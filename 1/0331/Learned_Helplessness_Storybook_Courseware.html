    const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(key, region);

    });

  function buildClozeLine(sentence) {
    const line = document.createElement("div");
    line.className = "cloze-line";
    tokenizeForCloze(sentence).forEach(function (p) {
      if (/^\s+$/.test(p)) {
        line.appendChild(document.createTextNode(p));
        return;
      }
      const span = document.createElement("span");
      span.className = "blank";
      span.dataset.word = p;
      span.textContent = "＿＿";
      span.setAttribute("role", "button");
      span.onclick = function () {
        span.textContent = span.dataset.word;
        span.classList.add("revealed");
      };
      line.appendChild(span);
    });
    return line;
  }

    }

    const stageBox = document.createElement("div");

      step = Math.max(1, Math.min(6, n));

      imgCol.innerHTML = "";

      stageBox.innerHTML = "";
      if (step === 1) renderStep1();
      else if (step === 2) renderStep2();
      else if (step === 3) renderStep3();

          body: JSON.stringify(payload),
        })
          .then(function (r) {
            return r.text().then(function (text) {
              try {
                return { ok: r.ok, j: JSON.parse(text) };
              } catch (e) {
                return { ok: r.ok, j: { error: text.slice(0, 500) || "无效响应" } };
              }
            });
          })
          .then(function (x) {
            btnAi.disabled = false;
            if (!x.ok || x.j.error) {
              aiBody.textContent = x.j && x.j.error ? x.j.error : "请求失败";

            aiBody.textContent = x.j.reply || "";
          })
          .catch(function (e) {
            btnAi.disabled = false;

              m +

      return 1;
    });
    sentenceGuideReveal = SENTENCES.map(function () {
      return 0;
    });
    sentenceSocraticReveal = SENTENCES.map(function () {
      return 0;
    });
    sentenceStep4Summary = SENTENCES.map(function () {
      return false;
    });
    sentenceSlideControllers = [];
    main.appendChild(buildIntro());
    SENTENCES.forEach(function (s, i) {
      main.appendChild(buildSentenceSlide(i, s));
    });
  }

  function updateGlobalNavState() {
    var prev = document.getElementById("globalPrev");
    var next = document.getElementById("globalNext");
    var ind = document.getElementById("stepIndicator");
    if (!prev || !next) return;
    if (currentPage === 0) {
      prev.disabled = true;
      next.disabled = false;
      if (ind) ind.textContent = "封面 · 故事总览";
    } else {
      var si = currentPage - 1;
      var st = sentenceSteps[si];
      var data = SENTENCES[si];
      prev.disabled = false;
      next.disabled = currentPage === totalPages - 1 && st === 6;
      var pairsN = normalizeGuidePairs(data).length;
      var socN = (data.socratic || []).length;
      var subHint = "";
      if (st === 2 && pairsN > 0 && sentenceGuideReveal[si] < pairsN) {
        subHint = "（引导 " + sentenceGuideReveal[si] + "/" + pairsN + "）";
      } else if (st === 4) {
        if (socN > 0 && sentenceSocraticReveal[si] < socN) {
          subHint = "（探究 " + sentenceSocraticReveal[si] + "/" + socN + "）";
        } else if (!sentenceStep4Summary[si]) {
          subHint = "（将显示小结与练习）";
        }
      }
      var ti = STEP_FLOW[st - 1] ? STEP_FLOW[st - 1].title : "";
      if (ind) ind.textContent = "第 " + currentPage + " 句 · " + ti + subHint;
    }
  }

  function showPage(n) {
    currentPage = Math.max(0, Math.min(totalPages - 1, n));
    document.querySelectorAll(".slide").forEach(function (el, i) {
      el.classList.toggle("active", i === currentPage);
    });
    if (currentPage >= 1) {
      var c = sentenceSlideControllers[currentPage - 1];
      if (c) c.goStep(sentenceSteps[currentPage - 1]);
    }
    try {
      document.getElementById("slide-" + currentPage).scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {}
    updateGlobalNavState();
  }

  function globalGoNext() {
    if (currentPage === 0) {
      showPage(1);
      return;
    }
    var si = currentPage - 1;
    var st = sentenceSteps[si];
    var data = SENTENCES[si];
    var c = sentenceSlideControllers[si];

    if (st === 2) {
      var pairs = normalizeGuidePairs(data);
      var np = pairs.length;
      if (np === 0) {
        sentenceSteps[si] = 3;
        if (c) c.goStep(3);
        updateGlobalNavState();
        return;
      }
      if (sentenceGuideReveal[si] < np) {
        sentenceGuideReveal[si]++;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      sentenceSteps[si] = 3;
      if (c) c.goStep(3);
      updateGlobalNavState();
      return;
    }

    if (st === 4) {
      var qs = data.socratic || [];
      var nq = qs.length;
      if (nq === 0) {
        if (!sentenceStep4Summary[si]) {
          sentenceStep4Summary[si] = true;
          if (c) c.refresh();
        } else {
          sentenceSteps[si] = 5;
          if (c) c.goStep(5);
        }
        updateGlobalNavState();
        return;
      }
      if (sentenceSocraticReveal[si] < nq) {
        sentenceSocraticReveal[si]++;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      if (!sentenceStep4Summary[si]) {
        sentenceStep4Summary[si] = true;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      sentenceSteps[si] = 5;
      if (c) c.goStep(5);
      updateGlobalNavState();
      return;
    }

    if (st < 6) {
      if (st === 1) sentenceGuideReveal[si] = 0;
      if (st === 3) {
        sentenceSocraticReveal[si] = 0;
        sentenceStep4Summary[si] = false;
      }
      sentenceSteps[si]++;
      if (c) c.goStep(sentenceSteps[si]);
      updateGlobalNavState();
      return;
    }
    if (currentPage < totalPages - 1) {
      showPage(currentPage + 1);
    }
  }

  function globalGoPrev() {
    if (currentPage === 0) return;
    var si = currentPage - 1;
    var st = sentenceSteps[si];
    var data = SENTENCES[si];
    var c = sentenceSlideControllers[si];

    if (st === 2) {
      if (sentenceGuideReveal[si] > 0) {
        sentenceGuideReveal[si]--;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      sentenceSteps[si] = 1;
      if (c) c.goStep(1);
      updateGlobalNavState();
      return;
    }

    if (st === 4) {
      if (sentenceStep4Summary[si]) {
        sentenceStep4Summary[si] = false;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      if (sentenceSocraticReveal[si] > 0) {
        sentenceSocraticReveal[si]--;
        if (c) c.refresh();
        updateGlobalNavState();
        return;
      }
      sentenceSteps[si] = 3;
      if (c) c.goStep(3);
      updateGlobalNavState();
      return;
    }

    if (st > 1) {
      sentenceSteps[si]--;
      if (c) c.goStep(sentenceSteps[si]);
      updateGlobalNavState();
      return;
    }
    showPage(currentPage - 1);
  }

  var gp = document.getElementById("globalPrev");
  if (gp) gp.onclick = globalGoPrev;
  var gn = document.getElementById("globalNext");
  if (gn) gn.onclick = globalGoNext;

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      globalGoPrev();
    }
    if (e.key === "ArrowRight") {
      e.preventDefault();
      globalGoNext();
    }
  });

  renderAll();
  showPage(0);
})();

</script>
</body>
</html>
