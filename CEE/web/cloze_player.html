<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>完形填空 · 高三英语 CEE</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --accent: #8b5cf6; --success: #10b981; --bg: #f1f5f9; --text: #1e293b; }
        body {
            font-family: 'Noto Sans SC', 'Roboto', sans-serif; margin: 0; color: var(--text);
            background: linear-gradient(165deg, #f8fafc 0%, #eef2ff 40%, #f5f3ff 100%);
            background-attachment: fixed; min-height: 100vh;
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 28px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            color: #fff; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
        }
        .passage-panel {
            background: linear-gradient(180deg, #ffffff 0%, #fafbff 100%); padding: 32px 36px;
            border-radius: 20px; font-size: 1.06rem; line-height: 1.9;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06); border: 1px solid rgba(99, 102, 241, 0.12);
        }
        .passage-filled { padding: 2px 8px; border-radius: 6px; }
        .passage-blank { color: #94a3b8; }
        .split-layout { display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 28px; align-items: start; }
        .opt-btn {
            display: inline-block; margin: 4px 8px 4px 0; padding: 9px 16px; border: 1px solid #cbd5e1;
            border-radius: 10px; background: linear-gradient(180deg, #f8fafc, #f1f5f9); cursor: pointer;
            transition: all 0.25s; font-weight: 500;
        }
        .opt-btn:hover { border-color: var(--primary); background: linear-gradient(180deg, #eef2ff, #e0e7ff); transform: translateY(-1px); }
        .opt-btn.selected { border-color: var(--primary); background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35); }
        .sidebar-panel {
            background: linear-gradient(180deg, #fff 0%, #f8fafc 100%); border-radius: 20px; padding: 24px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06); border-left: 4px solid var(--primary);
        }
        .modal-overlay { position: fixed; inset: 0; background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; }
        .modal-box { background: #fff; padding: 32px; border-radius: 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .dict-modal { max-width: 540px; width: 95%; max-height: 85vh; overflow-y: auto; text-align: left; border-top: 4px solid var(--primary); }
        .passage-clickable { cursor: pointer; }
        .passage-clickable:hover { outline: 2px solid rgba(99, 102, 241, 0.3); outline-offset: 4px; border-radius: 4px; }
        .word-tts-btn { cursor: pointer; color: var(--primary); margin-left: 6px; padding: 4px; border-radius: 8px; transition: background 0.2s; }
        .word-tts-btn:hover { background: #eef2ff; color: #4338ca; }
        .fab {
            position: fixed; bottom: 32px; right: 32px; z-index: 50; padding: 16px 32px; border-radius: 50px;
            font-weight: 700; border: none; cursor: pointer;
            background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.45); transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(79, 70, 229, 0.5); }
        .fab:disabled { opacity: 0.6; cursor: not-allowed; transform: none; background: #94a3b8; box-shadow: none; }
        .explain-card { background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); border-radius: 14px; border: 1px solid #e2e8f0; }
        /* 做题时左侧文章不可选中，防止复制给 AI 作弊 */
        .passage-panel.no-select {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        @media (max-width: 900px) { .split-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div>
                <a href="index.html" style="color:rgba(255,255,255,0.9); text-decoration:none; margin-right:12px;"><i class="fas fa-arrow-left"></i></a>
                <span class="font-bold">完形填空</span>
                <span v-if="paperData" class="opacity-90 ml-2">· {{ selectedPaperId }}</span>
            </div>
            <div class="flex items-center gap-4">
                <span v-if="timerStarted" class="font-mono text-lg">{{ formatTime(timeLeft) }}</span>
                <span @click="tryAdminMode" class="cursor-pointer opacity-90"><i class="far fa-user"></i> {{ studentName || '未登录' }}</span>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 py-6 pb-32">
            <template v-if="!paperData && selectedPaperId">
                <p class="text-slate-500">加载中…</p>
            </template>
            <template v-else-if="!paperData">
                <p class="text-slate-500">请从 <a href="index.html" class="text-indigo-600">首页</a> 选择试卷。</p>
            </template>
            <template v-else>
                <!-- 做题 -->
                <div v-if="stage === 'do'" class="space-y-6">
                    <div class="flex items-center gap-4 flex-wrap">
                        <button v-if="!timerStarted" type="button" @click="startTimer" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-semibold shadow-lg shadow-indigo-500/30 hover:shadow-xl transition-all">开始计时 (14 分钟)</button>
                        <span v-else class="text-slate-600">已计时，满 10 分钟可提交。</span>
                    </div>
                    <div class="split-layout">
                        <div class="passage-panel" :class="{ 'no-select': stage === 'do' }" v-html="clozePassageWithChoices"></div>
                        <div class="sidebar-panel sticky top-20">
                            <p class="text-slate-600 text-sm font-medium mb-3">选择选项填入文中</p>
                            <div v-for="q in (paperData.section_1_cloze.questions || [])" :key="q.number" class="mb-4">
                                <span class="font-semibold text-slate-700 mr-2">[{{ q.number }}]</span>
                                <button v-for="(opt, key) in q.options" :key="key" type="button"
                                    :class="['opt-btn', choicesCloze[q.number] === key ? 'selected' : '']"
                                    @click="setClozeChoice(q.number, key)">{{ key }}. {{ opt }}</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" :disabled="!canSubmit" :class="['fab', canSubmit ? 'bg-indigo-600 text-white' : 'bg-slate-300 text-slate-500']" @click="submitDo">{{ submitDoLabel }}</button>
                </div>

                <!-- 解析 -->
                <div v-if="stage === 'explain'" class="space-y-6">
                    <div class="flex gap-3 flex-wrap">
                        <button type="button" @click="stage = 'do'" class="px-5 py-2.5 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50 font-medium transition-all">返回做题</button>
                        <button type="button" @click="goReadTranslate" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-medium shadow-lg shadow-indigo-500/30 hover:shadow-xl transition-all">朗读与翻译</button>
                        <button type="button" @click="finishAndSendReport" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-purple-500 text-white font-medium shadow-lg shadow-violet-500/30 hover:shadow-xl transition-all">完成并发送报告</button>
                    </div>
                    <p class="text-slate-500 text-sm"><i class="fas fa-mouse-pointer"></i> 点击文中任意词汇可查询释义与例句（含发音）</p>
                    <div class="split-layout">
                        <div class="passage-panel passage-clickable" ref="explainPassageRef" @click="onPassageClick($event)" v-html="explainPassageHtml"></div>
                        <div class="sidebar-panel space-y-4 overflow-y-auto" style="max-height: 80vh;">
                            <p class="font-bold text-slate-800 text-lg border-b border-slate-200 pb-2">答案与解析</p>
                            <div v-for="q in (paperData.section_1_cloze.questions || [])" :key="q.number" class="explain-card p-4 text-sm">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="font-bold">[{{ q.number }}]</span>
                                    <span class="text-indigo-600">答案：{{ q.options && q.options[q.correct_answer] ? q.options[q.correct_answer] : q.correct_answer }}</span>
                                </div>
                                <p v-if="q.explanation" class="text-slate-600 mt-1">{{ q.explanation }}</p>
                                <p v-if="q.knowledge_points && q.knowledge_points.length" class="text-slate-500 mt-1">考点：<span v-for="(kp, i) in q.knowledge_points" :key="i">{{ kp }}<template v-if="i < q.knowledge_points.length - 1">、</template></span></p>
                                <p v-if="q.supplement" class="text-slate-500 mt-2 text-xs whitespace-pre-wrap">{{ q.supplement }}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 朗读与翻译 -->
                <div v-if="stage === 'read'" class="space-y-6">
                    <div class="flex gap-3 flex-wrap">
                        <button type="button" @click="stage = 'explain'" class="px-4 py-2 rounded-lg border border-slate-300 bg-white">返回解析</button>
                    </div>
                    <div class="passage-panel">
                        <p class="text-slate-600 mb-4">{{ currentReadSentence }}</p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <button type="button" @click="playTTS" :disabled="isPlaying" class="px-4 py-2 rounded-lg bg-slate-100 border border-slate-200"><i class="fas fa-volume-up"></i> 朗读</button>
                            <button type="button" @click="toggleRecord('en')" :class="['px-4 py-2 rounded-lg', isRecordingEn ? 'bg-red-100 text-red-700' : 'bg-slate-100 border border-slate-200']">{{ isRecordingEn ? '点击停止' : '读英文' }}</button>
                            <button type="button" @click="toggleRecord('cn')" :class="['px-4 py-2 rounded-lg', isRecordingCn ? 'bg-red-100 text-red-700' : 'bg-slate-100 border border-slate-200']">{{ isRecordingCn ? '点击停止' : '说中文翻译' }}</button>
                            <button type="button" @click="evaluateRead" :disabled="isEvaluating || !sttEn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white">AI 评价</button>
                        </div>
                        <p v-if="sttEn" class="text-slate-600"><strong>英文：</strong>{{ sttEn }}</p>
                        <p v-if="sttCn" class="text-slate-600"><strong>中文：</strong>{{ sttCn }}</p>
                        <div v-if="readEval" class="mt-4 p-4 bg-slate-50 rounded-lg prose prose-sm max-w-none" v-html="renderMarkdown(readEval)"></div>
                        <div class="flex gap-2 mt-4">
                            <button type="button" @click="prevRead" :disabled="currentReadIdx === 0" class="px-4 py-2 rounded-lg border border-slate-300">上一句</button>
                            <span class="self-center text-slate-500">{{ currentReadIdx + 1 }} / {{ readSentences.length }}</span>
                            <button type="button" @click="nextRead" :disabled="currentReadIdx >= readSentences.length - 1" class="px-4 py-2 rounded-lg border border-slate-300">下一句</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- 得分弹窗 -->
        <div v-if="showScoreModal" class="modal-overlay" @click.self="showScoreModal = false">
            <div class="modal-box border-t-4 border-indigo-500">
                <h3 class="text-xl font-bold mb-2 text-slate-800">答题结果</h3>
                <p class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-6">{{ scoreCorrect }} / {{ scoreTotal }}</p>
                <button type="button" @click="closeScoreAndGoExplain" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-semibold shadow-lg hover:shadow-xl transition-all">查看解析</button>
            </div>
        </div>

        <!-- 取词释义弹窗 -->
        <div v-if="showDictModal" class="modal-overlay" @click.self="closeDictModal">
            <div class="modal-box dict-modal">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <h3 class="text-xl font-bold text-indigo-700">{{ dictWord }}</h3>
                        <button type="button" @click="speakText(dictWord)" :disabled="isPlaying" class="word-tts-btn" title="词汇发音"><i class="fas fa-volume-up"></i></button>
                    </div>
                    <button type="button" @click="closeDictModal" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
                </div>
                <div v-if="dictLoading" class="text-slate-500 py-4"><i class="fas fa-spinner fa-spin"></i> 查询中…</div>
                <div v-else-if="dictError" class="text-red-600 py-2">{{ dictError }}</div>
                <div v-else-if="dictResult" class="space-y-4">
                    <p><strong class="text-slate-600">英释：</strong><span class="text-slate-800">{{ dictResult.definition_en }}</span></p>
                    <p><strong class="text-slate-600">中文：</strong><span class="text-slate-800">{{ dictResult.definition_zh }}</span></p>
                    <div class="border-t border-slate-200 pt-3">
                        <p class="font-semibold text-slate-700 mb-2">例句（高中难度 · 高考阅读/写作）</p>
                        <div v-for="(ex, i) in (dictResult.examples || [])" :key="i" class="mb-4 p-3 bg-slate-50 rounded-lg">
                            <p class="flex items-start gap-2">
                                <button type="button" @click="speakText(ex.en)" :disabled="isPlaying" class="word-tts-btn mt-0.5 shrink-0" title="例句发音"><i class="fas fa-volume-up"></i></button>
                                <span class="text-slate-800">{{ ex.en }}</span>
                            </p>
                            <p class="text-slate-600 text-sm mt-1 ml-6">{{ ex.zh }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const AZURE_KEY = "DKRXk8ueSfo5NdIOMqFRTCAfpeGDezJ3Snf5K8gGgtyqxiWdugLzJQQJ99BLACHYHv6XJ3w3AAAYACOGUYP9";
        const AZURE_REGION = "eastus2";
        const DEEPSEEK_KEY = "sk-daa16008e81843deba6fefe9dce51465";
        const EMAILJS_PUBLIC = "1QhXV5G_92GdK7_DF";
        const EMAILJS_SERVICE = "service_6dfbs2n";
        const EMAILJS_TEMPLATE = "template_zso8ebh";

        function getStudentName() { return localStorage.getItem('authing-user') || localStorage.getItem('current-user') || ''; }
        function getPaperFromUrl() { const m = /[?&]paper=(\d+)/i.exec(location.search); return m ? m[1].padStart(2, '0') : ''; }

        createApp({
            setup() {
                const selectedPaperId = ref(getPaperFromUrl() || '01');
                const paperData = ref(null);
                const studentName = ref(getStudentName());
                const stage = ref('do');
                const timerStarted = ref(false);
                const timeLeft = ref(14 * 60);
                const timerInterval = ref(null);
                const choicesCloze = ref({});
                const showScoreModal = ref(false);
                const scoreCorrect = ref(0);
                const scoreTotal = ref(0);
                const elapsed = ref(0);
                const CLOZE_MIN_SUBMIT = 10 * 60;
                const adminMode = ref(false);
                const titleClickCount = ref(0);
                const readSentences = ref([]);
                const currentReadIdx = ref(0);
                const sttEn = ref(''), sttCn = ref(''), isPlaying = ref(false), isRecordingEn = ref(false), isRecordingCn = ref(false), isEvaluating = ref(false), readEval = ref('');
                const recognizer = ref(null);
                let sttBuffer = '';
                const sessionStart = ref(new Date());
                const showDictModal = ref(false);
                const dictWord = ref('');
                const dictLoading = ref(false);
                const dictResult = ref(null);
                const dictError = ref('');
                const explainPassageRef = ref(null);

                const canSubmit = computed(() => {
                    if (!timerStarted.value) return false;
                    if (adminMode.value) return true;
                    return elapsed.value >= CLOZE_MIN_SUBMIT;
                });
                const submitDoLabel = computed(() => {
                    if (!timerStarted.value) return '请先开始计时';
                    if (adminMode.value) return '提交（管理员）';
                    const mins = Math.floor(elapsed.value / 60);
                    return elapsed.value >= CLOZE_MIN_SUBMIT ? '提交' : `请答题满 10 分钟后再提交（已 ${mins} 分钟）`;
                });

                function tryAdminMode() {
                    titleClickCount.value++;
                    if (titleClickCount.value >= 3) {
                        titleClickCount.value = 0;
                        const pwd = prompt('请输入管理员密码：');
                        if (pwd === '123888') { adminMode.value = true; alert('已进入管理员模式。'); }
                    }
                }
                function formatTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

                function getWordAtClick(ev) {
                    const x = ev.clientX, y = ev.clientY;
                    let range = null;
                    if (document.caretRangeFromPoint) {
                        range = document.caretRangeFromPoint(x, y);
                    } else if (document.caretPositionFromPoint) {
                        const pos = document.caretPositionFromPoint(x, y);
                        if (pos && pos.offsetNode) {
                            range = document.createRange();
                            range.setStart(pos.offsetNode, pos.offset);
                            range.setEnd(pos.offsetNode, pos.offset);
                        }
                    }
                    if (!range) return null;
                    const isWordChar = (c) => /[a-zA-Z\-']/.test(c);
                    const startNode = range.startContainer;
                    const endNode = range.endContainer;
                    let startOffset = range.startOffset, endOffset = range.endOffset;
                    const startText = startNode.textContent || '';
                    while (startOffset > 0 && isWordChar(startText[startOffset - 1])) startOffset--;
                    const endText = endNode.textContent || '';
                    while (endOffset < endText.length && isWordChar(endText[endOffset])) endOffset++;
                    try {
                        range.setStart(startNode, startOffset);
                        range.setEnd(endNode, endOffset);
                    } catch (_) { return null; }
                    let word = range.toString().trim();
                    if (!word || word.length > 35) return null;
                    if (!/^[a-zA-Z\-']+$/.test(word)) return null;
                    return word;
                }

                function onPassageClick(ev) {
                    if (stage.value !== 'explain') return;
                    const word = getWordAtClick(ev);
                    if (!word) return;
                    dictWord.value = word;
                    dictResult.value = null;
                    dictError.value = '';
                    showDictModal.value = true;
                    dictLoading.value = true;
                    fetchDict(word);
                }

                async function fetchDict(word) {
                    const prompt = `You are an English vocabulary assistant for Chinese high school students (Gaokao). For the word "${word}", provide in JSON only (no other text):
{"definition_en": "concise English definition, high school level",
 "definition_zh": "中文释义",
 "examples": [
   {"en": "One complete English sentence suitable for Gaokao reading or writing, using the word naturally.", "zh": "该句的中文翻译"},
   {"en": "Second sentence, also high memorability and Gaokao-relevant.", "zh": "该句的中文翻译"}
]}
Requirements: Examples must be 高中难度, 具备高度使用记忆价值, 符合高考阅读或写作场景. Output only valid JSON.`;
                    try {
                        const res = await fetch("https://api.deepseek.com/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
                            body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                        });
                        const data = await res.json();
                        let raw = data.choices?.[0]?.message?.content || '';
                        const jsonMatch = raw.match(/\{[\s\S]*\}/);
                        if (jsonMatch) raw = jsonMatch[0];
                        raw = raw.replace(/```json\s*|\s*```/g, '').trim();
                        const parsed = JSON.parse(raw);
                        dictResult.value = {
                            definition_en: parsed.definition_en || '',
                            definition_zh: parsed.definition_zh || '',
                            examples: Array.isArray(parsed.examples) ? parsed.examples : []
                        };
                    } catch (e) {
                        dictError.value = '查询失败，请重试';
                        console.error(e);
                    }
                    dictLoading.value = false;
                }

                function speakText(text) {
                    if (!text || isPlaying.value) return;
                    const toSpeak = textForTTS(text);
                    if (!toSpeak) return;
                    isPlaying.value = true;
                    const config = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
                    config.speechSynthesisVoiceName = "en-US-AvaMultilingualNeural";
                    const synth = new SpeechSDK.SpeechSynthesizer(config);
                    synth.speakTextAsync(toSpeak, () => { isPlaying.value = false; synth.close(); }, () => { isPlaying.value = false; synth.close(); });
                }

                function closeDictModal() {
                    showDictModal.value = false;
                    dictWord.value = '';
                    dictResult.value = null;
                    dictError.value = '';
                }

                async function loadPaper() {
                    const id = selectedPaperId.value;
                    if (!id) { paperData.value = null; return; }
                    try {
                        const r = await fetch('../enriched_questions/' + id + '.json');
                        if (!r.ok) throw new Error('Network');
                        paperData.value = await r.json();
                        stage.value = 'do';
                        timerStarted.value = false;
                        timeLeft.value = 14 * 60;
                        elapsed.value = 0;
                        choicesCloze.value = {};
                        showScoreModal.value = false;
                        readSentences.value = [];
                        currentReadIdx.value = 0;
                        sessionStart.value = new Date();
                    } catch (e) {
                        console.error(e);
                        paperData.value = null;
                    }
                }

                function startTimer() {
                    if (timerStarted.value) return;
                    timerStarted.value = true;
                    const total = 14 * 60;
                    timeLeft.value = total;
                    elapsed.value = 0;
                    timerInterval.value = setInterval(() => {
                        elapsed.value += 1;
                        timeLeft.value = Math.max(0, total - elapsed.value);
                        if (timeLeft.value <= 0 && timerInterval.value) {
                            clearInterval(timerInterval.value);
                            timerInterval.value = null;
                        }
                    }, 1000);
                }

                function setClozeChoice(num, key) { choicesCloze.value = { ...choicesCloze.value, [num]: key }; }

                const clozePassageWithChoices = computed(() => {
                    if (!paperData.value?.section_1_cloze?.passage) return '';
                    let p = paperData.value.section_1_cloze.passage;
                    (paperData.value.section_1_cloze.questions || []).forEach(q => {
                        const key = choicesCloze.value[q.number];
                        const word = key ? q.options[key] : '';
                        const blank = '[' + q.number + ']';
                        p = p.replace(blank, word ? '<span class="passage-filled bg-indigo-100 text-indigo-800">' + word + '</span>' : '<span class="passage-blank">____</span>');
                    });
                    return p.replace(/\n/g, '<br><br>');
                });

                function submitDo() {
                    if (!canSubmit.value || !paperData.value) return;
                    const qs = paperData.value.section_1_cloze.questions || [];
                    let correct = 0;
                    qs.forEach(q => { if (choicesCloze.value[q.number] === q.correct_answer) correct++; });
                    scoreCorrect.value = correct;
                    scoreTotal.value = qs.length;
                    showScoreModal.value = true;
                }

                function closeScoreAndGoExplain() { showScoreModal.value = false; stage.value = 'explain'; }

                const explainPassageHtml = computed(() => {
                    if (!paperData.value?.section_1_cloze?.passage) return '';
                    let p = paperData.value.section_1_cloze.passage;
                    (paperData.value.section_1_cloze.questions || []).forEach(q => {
                        const userKey = choicesCloze.value[q.number];
                        const correctKey = q.correct_answer;
                        const userWord = userKey ? q.options[userKey] : '___';
                        const correctWord = correctKey ? q.options[correctKey] : '';
                        const isRight = userKey === correctKey;
                        const span = '<span class="' + (isRight ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800') + ' px-1 rounded">' + userWord + '</span>';
                        if (!isRight && correctWord) p = p.replace('[' + q.number + ']', span + ' <span class="bg-emerald-100 text-emerald-800 px-1 rounded">(' + correctWord + ')</span>');
                        else p = p.replace('[' + q.number + ']', span);
                    });
                    return p.replace(/\n/g, '<br><br>');
                });

                function goReadTranslate() {
                    stage.value = 'read';
                    if (!paperData.value?.section_1_cloze?.passage) { readSentences.value = ['No passage.']; currentReadIdx.value = 0; return; }
                    let p = paperData.value.section_1_cloze.passage;
                    // 朗读与翻译页使用正确答案构建文章，不用学生填写内容
                    (paperData.value.section_1_cloze.questions || []).forEach(q => {
                        const key = q.correct_answer;
                        const word = key && q.options[key] ? q.options[key] : '';
                        p = p.replace('[' + q.number + ']', word || '_____');
                    });
                    readSentences.value = p.split(/(?<=[.!?])\s+/).filter(Boolean).map(s => s.trim());
                    if (!readSentences.value.length) readSentences.value = ['No sentences.'];
                    currentReadIdx.value = 0;
                    sttEn.value = ''; sttCn.value = ''; readEval.value = '';
                }

                const currentReadSentence = computed(() => readSentences.value[currentReadIdx.value] || '');

                function textForTTS(text) {
                    if (!text) return '';
                    return text.replace(/（[^）]+）/g, '').replace(/\([^)]*[\u4e00-\u9fa5][^)]*\)/g, '').replace(/\s+/g, ' ').trim();
                }
                function playTTS() {
                    const raw = currentReadSentence.value;
                    const toSpeak = textForTTS(raw);
                    if (!toSpeak) return;
                    isPlaying.value = true;
                    const config = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
                    config.speechSynthesisVoiceName = "en-US-AvaMultilingualNeural";
                    const synth = new SpeechSDK.SpeechSynthesizer(config);
                    synth.speakTextAsync(toSpeak, () => { isPlaying.value = false; synth.close(); }, () => { isPlaying.value = false; synth.close(); });
                }

                function toggleRecord(lang) {
                    const isEn = lang === 'en';
                    if ((isEn && isRecordingEn.value) || (!isEn && isRecordingCn.value)) { stopRecord(isEn); return; }
                    stopRecord(null);
                    sttBuffer = '';
                    if (isEn) isRecordingEn.value = true; else isRecordingCn.value = true;
                    const config = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
                    config.speechRecognitionLanguage = isEn ? "en-US" : "zh-CN";
                    const audio = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
                    const rec = new SpeechSDK.SpeechRecognizer(config, audio);
                    rec.recognized = (s, e) => { if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) sttBuffer += (sttBuffer ? ' ' : '') + e.result.text; };
                    rec.startContinuousRecognitionAsync(() => { recognizer.value = rec; }, (err) => { console.error(err); if (isEn) isRecordingEn.value = false; else isRecordingCn.value = false; });
                }
                function stopRecord(forLang) {
                    if (!recognizer.value) { isRecordingEn.value = false; isRecordingCn.value = false; return; }
                    const rec = recognizer.value;
                    recognizer.value = null;
                    rec.stopContinuousRecognitionAsync(() => {
                        if (forLang === true) sttEn.value = sttBuffer; else if (forLang === false) sttCn.value = sttBuffer;
                        rec.close();
                        sttBuffer = '';
                        isRecordingEn.value = false;
                        isRecordingCn.value = false;
                    }, () => {
                        if (forLang === true) sttEn.value = sttBuffer; else if (forLang === false) sttCn.value = sttBuffer;
                        try { rec.close(); } catch (_) {}
                        isRecordingEn.value = false;
                        isRecordingCn.value = false;
                    });
                }

                async function evaluateRead() {
                    if (!sttEn.value) return;
                    isEvaluating.value = true;
                    readEval.value = '';
                    const prompt = `Task: English Tutor. Target: "${currentReadSentence.value}" Student Reading: "${sttEn.value}" Student Translation: "${sttCn.value}". Rules: 1) Give Pronunciation Score 0-100. 2) Check translation. 3) Give standard translation. Output concise Chinese Markdown.`;
                    try {
                        const res = await fetch("https://api.deepseek.com/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
                            body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                        });
                        const data = await res.json();
                        readEval.value = data.choices?.[0]?.message?.content || '评价失败';
                    } catch (e) { readEval.value = '评价服务连接失败'; }
                    isEvaluating.value = false;
                }

                function prevRead() { if (currentReadIdx.value > 0) { currentReadIdx.value--; sttEn.value = ''; sttCn.value = ''; readEval.value = ''; } }
                function nextRead() { if (currentReadIdx.value < readSentences.value.length - 1) { currentReadIdx.value++; sttEn.value = ''; sttCn.value = ''; readEval.value = ''; } }
                function renderMarkdown(t) { return typeof marked !== 'undefined' ? marked.parse(t || '') : (t || ''); }

                function formatDateTime(d) {
                    const pad = n => ('0' + n).slice(-2);
                    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
                }
                function formatDuration(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return m + 'min ' + (s % 60) + 's'; }

                onMounted(() => loadPaper());

                function finishAndSendReport() {
                    const endTime = new Date();
                    const durationMs = endTime - sessionStart.value;
                    const contentName = 'CEE 高三英语 ' + (paperData.value?.paper_id || selectedPaperId.value) + ' - 完形填空';
                    const templateParams = {
                        student_name: studentName.value || 'Unknown',
                        content_name: contentName,
                        page_url: location.href,
                        page_url_display: contentName,
                        start_time: formatDateTime(sessionStart.value),
                        end_time: formatDateTime(endTime),
                        duration: formatDuration(durationMs),
                        score: scoreCorrect.value,
                        total: scoreTotal.value,
                        accuracy: scoreTotal.value ? (Math.round(scoreCorrect.value / scoreTotal.value * 100) + '%') : '-',
                        details_html: '<p><strong>得分：</strong>' + scoreCorrect.value + ' / ' + scoreTotal.value + '</p>'
                    };
                    emailjs.init(EMAILJS_PUBLIC);
                    emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, templateParams).then(() => alert('报告已发送')).catch(() => alert('报告发送失败'));
                }

                return {
                    selectedPaperId, paperData, studentName, stage, timerStarted, timeLeft, choicesCloze,
                    showScoreModal, scoreCorrect, scoreTotal, canSubmit, submitDoLabel,
                    clozePassageWithChoices, explainPassageHtml,
                    readSentences, currentReadIdx, currentReadSentence, sttEn, sttCn, isPlaying, isRecordingEn, isRecordingCn, isEvaluating, readEval,
                    showDictModal, dictWord, dictLoading, dictResult, dictError,
                    loadPaper, startTimer, setClozeChoice, submitDo, closeScoreAndGoExplain, goReadTranslate,
                    playTTS, toggleRecord, evaluateRead, prevRead, nextRead, renderMarkdown, finishAndSendReport,
                    onPassageClick, speakText, closeDictModal,
                    formatTime, tryAdminMode, adminMode
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
