  var SUMMARY_QA = [

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeXml(s) {
    return escapeHtml(s);
  }

  function ttsReadBtnHtml(plainText) {
    if (!plainText) return "";
    return (
      '<button type="button" class="tts-read-btn" data-tts-read="' +
      encodeURIComponent(plainText) +
      '" title="Azure 朗读" aria-label="朗读英文">🔊</button>'
    );
  }

  function speakAzure(text) {
    if (window.L00Speak) return window.L00Speak.speak(text);
    return Promise.resolve();
  }

  function parsePracticeState() {
    if (state > PRACTICE_TOTAL) return null;
    var si = Math.floor((state - 1) / PRACTICE_STEPS);
    var step = ((state - 1) % PRACTICE_STEPS) + 1;
    return { sentenceIndex: si, step: step, sentence: SENTENCES[si] };
  }

  /** 步骤 5：英文词块按成分着色（主语蓝 / 谓语红 / 宾语绿） */
  function roleToWordClass(role) {
    if (role === "subject") return "word-text word-text--subject";
    if (role === "predicate") return "word-text word-text--predicate";
    return "word-text word-text--object";
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  /** 图片排序题：先随机打乱；若碰巧已是正确顺序（如 0,1,2…），则交换前两张，保证初始必为乱序。 */
  function shuffleImagesForSort(items) {
    var a = shuffle(items);
    if (a.length < 2) return a;
    var allMatch = true;
    for (var i = 0; i < a.length; i++) {
      if (a[i].idx !== i) {
        allMatch = false;
        break;
      }
    }
    if (allMatch) {
      var tmp = a[0];
      a[0] = a[1];
      a[1] = tmp;
    }
    return a;
  }

      nextBtn.disabled = true;
      if (state !== TOTAL_STATES) {

      if (state <= PRACTICE_TOTAL) {
        var p = parsePracticeState();
        if (!p) return;
        mainBoard.className = "board";
        if (progressLabel) {
          progressLabel.textContent =

        }
        renderPractice(p);
        return;
      }

      mainBoard.className = "board" + (state >= SUMMARY_START ? " board--blackboard" : "");
      if (progressLabel) {
        progressLabel.textContent =
          state >= SUMMARY_START ? "总结与拓展 · 步骤 " + (state - PRACTICE_TOTAL) + "/" + (TOTAL_STATES - PRACTICE_TOTAL) : "";
      }

      if (state === SUMMARY_START) renderBlackboard();
      else if (state === 22) renderSummaryQ(0, false);
      else if (state === 23) renderSummaryQ(0, true);
      else if (state === 24) renderSummaryQ(1, false);
      else if (state === 25) renderSummaryQ(1, true);
      else if (state === 26) renderSummaryQ(2, false);
      else if (state === 27) renderSummaryQ(2, true);
      else if (state === 28) renderFinale();
    } catch (err) {
      console.error(err);
      if (stepMount) {
        stepMount.innerHTML =
          '<div class="step-panel active"><p class="zh-text" style="color:#b00020;">页面渲染出错：' +
          escapeHtml(err && err.message ? err.message : String(err)) +
          "</p><p class=\"hint-prompt\">请尝试刷新页面，或在浏览器控制台查看详细错误。</p></div>";
      }
    }
  }

  function renderPractice(p) {
    var s = p.sentence;
    var html = "";

    if (p.step === 1) {
      html =
        '<div class="step-panel active">' +
        '<p class="zh-text">请阅读下列英文句子（' +

    } else if (p.step === 2) {

    } else if (p.step === 3) {

      html = '<div class="step-panel active">';

      html += '<div class="zh-sort-strip" id="zhSortStrip">';

    } else if (p.step === 5) {

      html +=
        '<div class="sentence-tts-row">' +

      html +=
        '<div class="drag-label drag-label--subject" draggable="true" data-tag="subject" id="lab-subject">主语</div>' +
        '<div class="drag-label drag-label--predicate" draggable="true" data-tag="predicate" id="lab-predicate">谓语</div>' +
        '<div class="drag-label drag-label--object" draggable="true" data-tag="object" id="lab-object">宾语</div>';
      html += "</div>";

          '"></div>' +

    if (p.step === 3) {

  function bindNextWhenImagesOk(s) {
    function check() {
      var strip = document.getElementById("sortStrip");
      if (!strip) return;
      var items = strip.querySelectorAll(".sort-item");
      var order = [];
      items.forEach(function (el) {
        order.push(parseInt(el.getAttribute("data-idx"), 10));
      });
      var ok = order.length === s.images.length;
      for (var i = 0; i < order.length; i++) {
        if (order[i] !== i) ok = false;
      }
      nextBtn.disabled = !ok;
    }
    session._imgCheck = check;
    var stripEl = document.getElementById("sortStrip");
    if (!stripEl) return;
    stripEl.addEventListener("dragend", check);
    stripEl.addEventListener("drop", check);
    check();
  }

  function bindImageSort() {
    var strip = document.getElementById("sortStrip");
    if (!strip) return;
    var dragEl = null;
    strip.querySelectorAll(".sort-item").forEach(function (el) {
      el.addEventListener("dragstart", function (e) {
        dragEl = el;
        el.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", el.getAttribute("data-slot"));
      });
      el.addEventListener("dragend", function () {
        el.classList.remove("dragging");
        dragEl = null;
        session._sortSuppressUntil = Date.now() + 400;
        if (session._imgCheck) session._imgCheck();
      });
      el.addEventListener("dragover", function (e) {
        e.preventDefault();
      });
      el.addEventListener("drop", function (e) {
        e.preventDefault();
        var from = dragEl;
        var to = el;
        if (!from || !to || from === to) return;
        swapNodes(from, to);
        if (session._imgCheck) session._imgCheck();
      });
    });
    bindTapSwapSort(strip, ".sort-item", 3, function () {
      if (session._imgCheck) session._imgCheck();
    });
  }

  function swapNodes(a, b) {
    var p = a.parentNode;
    var t = document.createElement("div");
    p.insertBefore(t, a);
    p.insertBefore(a, b);
    p.insertBefore(b, t);
    p.removeChild(t);
  }

  /** 触摸屏上 HTML5 drag 常不可用：先点一张再点另一张交换（与 bindSvo 点选标签同理） */
  function bindTapSwapSort(strip, itemSelector, practiceStep, checkFn) {
    strip.addEventListener(
      "click",
      function (e) {
        var p = parsePracticeState();
        if (!p || p.step !== practiceStep) return;
        if (Date.now() < (session._sortSuppressUntil || 0)) return;
        var item = e.target.closest(itemSelector);
        if (!item || !strip.contains(item)) return;
        var pending = session.pendingSwapItem;
        if (pending === item) {
          item.classList.remove("sort-pending");
          session.pendingSwapItem = null;
          return;
        }
        if (pending && pending !== item) {
          swapNodes(pending, item);
          pending.classList.remove("sort-pending");
          session.pendingSwapItem = null;
          if (checkFn) checkFn();
          return;
        }
        strip.querySelectorAll(itemSelector).forEach(function (x) {
          x.classList.remove("sort-pending");
        });
        session.pendingSwapItem = item;
        item.classList.add("sort-pending");
      },
      true
    );
  }

      var items = strip.querySelectorAll(".zh-block");

      el.addEventListener("dragstart", function (e) {

      el.addEventListener("dragend", function () {

        if (!from || !to || from === to) return;

  function bindSvo() {
    var pool = document.getElementById("labelsPool");
    var dragEl = null;
    document.querySelectorAll(".drag-label").forEach(function (lab) {
      lab.addEventListener("dragstart", function (e) {
        dragEl = lab;
        e.dataTransfer.setData("text/plain", lab.getAttribute("data-tag"));
        e.dataTransfer.effectAllowed = "move";
      });
      lab.addEventListener("dragend", function () {
        dragEl = null;
      });
    });
    document.querySelectorAll(".drop-zone").forEach(function (zone) {
      zone.addEventListener("dragover", function (e) {
        e.preventDefault();
        zone.classList.add("drag-over");
      });
      zone.addEventListener("dragleave", function () {
        zone.classList.remove("drag-over");
      });
      zone.addEventListener("drop", function (e) {
        e.preventDefault();
        zone.classList.remove("drag-over");
        var tag = e.dataTransfer.getData("text/plain");
        var accept = zone.getAttribute("data-accept");
        if (!dragEl || zone.querySelector(".filled-tag")) return;
        if (tag === accept) {
          zone.classList.add("correct");
          var span = document.createElement("span");
          span.className = "filled-tag";
          span.textContent = dragEl.textContent.trim();
          zone.appendChild(span);
          dragEl.classList.add("placed");
          dragEl.setAttribute("draggable", "false");
          session.svoCorrect++;
          if (session.svoCorrect >= 3) {
            burstStars();
            nextBtn.disabled = false;
          }
        } else {
          zone.classList.add("wrong-shake");
          setTimeout(function () {
            zone.classList.remove("wrong-shake");
          }, 400);
        }
      });
    });

    if (!bindSvo._tapDone) {
      bindSvo._tapDone = true;
      document.addEventListener(
        "click",
        function (e) {
          var p = parsePracticeState();
          if (!p || p.step !== 5) return;
          if (!document.getElementById("labelsPool")) return;
          var lab = e.target.closest(".drag-label");
          var zone = e.target.closest(".drop-zone");
          if (lab && !lab.classList.contains("placed")) {
            document.querySelectorAll(".drag-label").forEach(function (l) {
              l.style.outline = "none";
            });
            session.pendingLabel = lab;
            lab.style.outline = "3px solid var(--crayon-orange)";
            return;
          }
          if (zone && session.pendingLabel && !zone.querySelector(".filled-tag")) {
            var tag = session.pendingLabel.getAttribute("data-tag");
            var accept = zone.getAttribute("data-accept");
            if (tag === accept) {
              zone.classList.add("correct");
              var span = document.createElement("span");
              span.className = "filled-tag";
              span.textContent = session.pendingLabel.textContent.trim();
              zone.appendChild(span);
              session.pendingLabel.classList.add("placed");
              session.pendingLabel.setAttribute("draggable", "false");
              session.pendingLabel.style.outline = "none";
              session.svoCorrect++;
              session.pendingLabel = null;
              if (session.svoCorrect >= 3) {
                burstStars();
                nextBtn.disabled = false;
              }
            } else {
              zone.classList.add("wrong-shake");
              setTimeout(function () {
                zone.classList.remove("wrong-shake");
              }, 400);
            }
          }
        },
        true
      );
    }
  }

  function burstStars() {
    var n = 12;
    for (var i = 0; i < n; i++) {
      var s = document.createElement("div");
      s.className = "star-burst";
      s.textContent = "★";
      s.style.left = 40 + Math.random() * 40 + "%";
      s.style.top = 30 + Math.random() * 20 + "%";
      s.style.color = ["#ffd54f", "#ff8fab", "#4a90d9"][i % 3];
      document.body.appendChild(s);
      setTimeout(
        (function (el) {
          return function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          };
        })(s),
        900
      );
    }
  }

  function launchConfetti() {
    confettiRoot.innerHTML = "";
    confettiRoot.setAttribute("aria-hidden", "false");
    var colors = ["#e85d5d", "#4a90d9", "#5cb85c", "#ffd54f", "#ff8fab", "#9b7edc"];
    for (var i = 0; i < 48; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.5 + Math.random() * 2 + "s";
      confettiRoot.appendChild(c);
    }
  }

  function advance() {
    if (state >= TOTAL_STATES) return;

    if (state <= PRACTICE_TOTAL) {
      var p = parsePracticeState();
      if (p && p.step === 3 && nextBtn.disabled) return;
      if (p && p.step === 4 && nextBtn.disabled) return;
      if (p && p.step === 5 && nextBtn.disabled) return;
    }

    p2NavStack.push(state);
    state++;
    if (state > TOTAL_STATES) state = TOTAL_STATES;

    render();
  }

  function retreatLesson() {
    if (!p2NavStack.length) return;
    state = p2NavStack.pop();
    render();
  }

  document.getElementById("mainBoard").addEventListener("click", function (e) {
    var b = e.target.closest(".tts-read-btn[data-tts-read]");
    if (!b || !document.getElementById("stepMount").contains(b)) return;
    var enc = b.getAttribute("data-tts-read");
    if (enc) speakAzure(decodeURIComponent(enc));
  });

  nextBtn.addEventListener("click", function () {
    if (state >= TOTAL_STATES) return;
    advance();
  });
  if (prevBtn) prevBtn.addEventListener("click", retreatLesson);

  render();
})();
  </script>

  <script src="assets/lesson-image-lightbox.js" defer></script>
