<!DOCTYPE html>
<html lang="zh-CN" class="l00-course">
<head>
  <script src="../shared/play-local-mp3.js"></script>
    <script src="../shared/lesson-tts-azure-config.js"></script>
  <script src="../shared/lesson-tts-azure-play.js"></script>
<script src="../shared/lesson-local-audio.js" defer></script>
  <script src="../shared/lesson-speak-local-only.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主谓宾与非谓语 · 第03页 · 谓语与非谓语</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #fff9e8;
      --paper-edge: #e8dcc4;
      --crayon-red: #e85d5d;
      --crayon-blue: #4a90d9;
      --crayon-green: #5cb85c;
      --crayon-yellow: #ffd54f;
      --crayon-pink: #ff8fab;
      --crayon-purple: #9b7edc;
      --crayon-orange: #ff9f43;
      --ink: #2c2c2c;
      --shadow: rgba(44, 44, 44, 0.15);
      --finite: #c62828;
      --nonfinite: #6a1b9a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "ZCOOL KuaiLe", "Patrick Hand", cursive, sans-serif;
      background: linear-gradient(145deg, #b8e6ff 0%, #c8f4e0 38%, #ffe8a3 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    /* 整体 140% 缩放见 assets/l00-scale.css */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    #app {
      max-width: 920px;
      margin: 0 auto;
      padding: 1rem 0.5rem 5.5rem;
      min-height: 100vh;
    }

    h1 {
      font-size: clamp(0.9rem, 2.6vw, 1.15rem);
      text-align: center;
      margin-bottom: 0.5rem;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    }

    .progress-tag {
      text-align: center;
      font-size: 0.78rem;
      color: #555;
      margin-bottom: 0.65rem;
    }

    .board {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      padding: clamp(0.85rem, 3vw, 1.35rem);
      box-shadow: 6px 8px 0 var(--paper-edge), 12px 14px 24px var(--shadow);
      min-height: 300px;
    }

    .board--blackboard {
      background: linear-gradient(145deg, #2d4a3e 0%, #1e3328 100%);
      color: #f0f0e8;
      border-color: #4a6b5c;
    }

    .board--blackboard .zh-text { color: #e8f0e8; }
    .board--blackboard .en-sentence { color: #f5f5f0; }

    .step-panel.active {
      display: block;
      animation: stepIn 0.4s ease;
    }
    .step-panel { display: none; }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .step-panel.active { animation: none; }
    }

    .zh-text {
      font-size: clamp(0.95rem, 2.5vw, 1.12rem);
      line-height: 1.65;
      color: var(--ink);
      text-align: center;
      margin: 0.5rem 0;
    }

    .en-sentence {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.2rem, 3.8vw, 1.75rem);
      text-align: center;
      margin: 0.85rem 0;
      line-height: 1.45;
      color: var(--ink);
    }
    .en-sentence--quiz {
      line-height: 1.85;
    }
    .sentence-tts-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      justify-content: center;
      gap: 0.45rem;
      margin: 0.65rem 0;
    }
    .sentence-tts-row--tap {
      flex-wrap: wrap;
      align-items: center;
    }
    .sentence-tts-row__text {
      flex: 1;
      min-width: 0;
      text-align: center;
    }
    .sentence-tts-row__text .en-sentence,
    .sentence-tts-row__text .p3-sentence-tap {
      margin: 0;
    }
    .tts-read-btn {
      flex-shrink: 0;
      width: 2.35rem;
      height: 2.35rem;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      padding: 0;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.12);
    }
    .board--blackboard .tts-read-btn {
      border-color: rgba(255, 255, 255, 0.55);
      background: linear-gradient(180deg, #fff 0%, #e8f4ec 100%);
    }
    .word-fix-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 0.12em;
      position: relative;
    }
    .word-fix-top {
      font-family: "Patrick Hand", cursive;
      font-size: 0.82em;
      color: #1b5e20;
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 0.08em;
    }
    .word-fix-bad {
      position: relative;
      color: #888;
      text-decoration: line-through;
      text-decoration-color: var(--crayon-red);
      text-decoration-thickness: 2px;
    }
    .word-fix-x {
      display: inline-block;
      margin-left: 0.12em;
      color: var(--crayon-red);
      font-weight: bold;
      font-size: 1.05em;
      text-decoration: none;
      vertical-align: middle;
    }

    .board-icons {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      margin: 0.5rem 0 0.75rem;
      font-size: 2rem;
      filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.15));
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      margin: 1rem 0;
    }

    .choice-chip {
      padding: 0.5rem 1rem;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: linear-gradient(180deg, #fff 0%, #f4f4f4 100%);
      font-size: 1.05rem;
      color: #000;
      cursor: default;
      box-shadow: 3px 4px 0 var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s;
    }
    .board--blackboard .choice-chip,
    .board--blackboard .choice-chip--winner {
      color: #000;
    }
    .choice-chip--winner {
      border-color: var(--crayon-red);
      background: linear-gradient(180deg, #ffe0e0 0%, #fff 100%);
      transform: scale(1.12);
      box-shadow: 0 0 0 4px rgba(232, 93, 93, 0.45);
      animation: pulseWin 0.9s ease infinite;
    }
    @keyframes pulseWin {
      0%, 100% { box-shadow: 0 0 0 4px rgba(232, 93, 93, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(232, 93, 93, 0.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .choice-chip--winner { animation: none; }
    }

    .pic-frame {
      margin: 0.5rem auto;
      max-width: 280px;
      padding: 0.5rem;
      background: #fffef6;
      border: 3px dashed var(--crayon-orange);
      border-radius: 14px;
      text-align: center;
    }
    .pic-frame img {
      max-width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      vertical-align: middle;
      border-radius: 8px;
    }

    .pic-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.75rem 0;
    }
    .pic-grid .pic-frame {
      max-width: 140px;
      flex: 1 1 120px;
    }
    .pic-grid .pic-frame img { max-height: 100px; }

    .pic-grid--ambig {
      margin-top: 0.85rem;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }
    .pic-with-q {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    .pic-with-q img {
      display: block;
      max-height: 100px;
      width: auto;
      margin: 0 auto;
    }
    .pic-qmark {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 1.65rem;
      height: 1.65rem;
      line-height: 1.45rem;
      padding: 0 0.2rem;
      text-align: center;
      font-family: "Patrick Hand", cursive;
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--crayon-red);
      background: rgba(255, 255, 255, 0.92);
      border: 3px solid var(--ink);
      border-radius: 50%;
      box-shadow: 2px 2px 0 var(--shadow);
      pointer-events: none;
    }

    .tf-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }

    .crayon-btn {
      font-family: inherit;
      padding: 0.55rem 1.35rem;
      font-size: 1.05rem;
      border: 3px solid var(--ink);
      border-radius: 12px 10px 14px 11px;
      cursor: pointer;
      box-shadow: 4px 5px 0 var(--shadow);
      background: linear-gradient(180deg, #fff 0%, #f0f0f0 100%);
    }
    .crayon-btn:hover:not(:disabled) {
      filter: brightness(1.03);
    }
    .crayon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .crayon-btn--green {
      border-color: var(--crayon-green);
      background: linear-gradient(180deg, #e8f8e8 0%, #fff 100%);
    }
    .crayon-btn--red {
      border-color: var(--crayon-red);
      background: linear-gradient(180deg, #ffe8e8 0%, #fff 100%);
    }
    .crayon-btn--yellow {
      border-color: var(--crayon-yellow);
      background: linear-gradient(180deg, #fff8e0 0%, #fff 100%);
    }

    .feedback-box {
      margin: 0.85rem auto;
      max-width: 520px;
      padding: 0.85rem 1rem;
      text-align: left;
      border-left: 5px solid var(--crayon-orange);
      background: rgba(255, 213, 79, 0.28);
      border-radius: 0 12px 12px 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink);
    }

    .speaker-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      margin-left: 0.5rem;
      border-radius: 50%;
      border: 3px solid var(--crayon-blue);
      background: linear-gradient(180deg, #e3f0ff 0%, #fff 100%);
      cursor: pointer;
      font-size: 1.35rem;
      vertical-align: middle;
      box-shadow: 3px 4px 0 var(--shadow);
    }
    .speaker-btn:active { transform: scale(0.96); }

    .kiwi-big {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      text-align: center;
      color: var(--crayon-green);
      text-shadow: 2px 2px 0 var(--paper-edge);
      margin: 0.5rem 0;
    }

    .teacher-box {
      margin: 1rem auto;
      max-width: 540px;
      padding: 1rem 1.15rem;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 12px 18px 14px 16px;
      box-shadow: 4px 6px 0 var(--shadow);
      text-align: left;
      font-size: 0.98rem;
      line-height: 1.75;
      color: #1a1a1a;
    }
    .board--blackboard .teacher-box {
      color: #1a1a1a;
    }

    .fight-stage {
      position: relative;
      min-height: 140px;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      font-family: "Patrick Hand", cursive;
      font-size: 1.75rem;
      font-weight: bold;
      animation: fightLeft 0.55s ease-in-out infinite alternate;
    }
    .fighter--b {
      animation-name: fightRight;
    }
    .fighter .glove {
      font-size: 1.5rem;
    }
    @keyframes fightLeft {
      from { transform: translateX(0) rotate(-4deg); }
      to { transform: translateX(12px) rotate(6deg); }
    }
    @keyframes fightRight {
      from { transform: translateX(0) rotate(4deg); }
      to { transform: translateX(-12px) rotate(-6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fighter, .fighter--b { animation: none; }
    }
    .fight-burst {
      position: absolute;
      font-size: 2rem;
      animation: burstPop 0.6s ease infinite;
    }
    @keyframes burstPop {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }

    .verb-finite {
      color: var(--finite);
      font-weight: bold;
      padding: 0.08em 0.2em;
      border-radius: 6px;
      background: rgba(198, 40, 40, 0.12);
      border-bottom: 4px solid var(--finite);
    }
    .verb-nonfinite {
      color: var(--nonfinite);
      font-weight: bold;
      padding: 0.08em 0.2em;
      border-radius: 6px;
      background: rgba(106, 27, 154, 0.12);
      border-bottom: 4px solid var(--nonfinite);
    }
    .verb-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 1rem;
      font-size: 0.92rem;
    }
    .verb-legend span { max-width: 220px; text-align: center; line-height: 1.5; }

    .hint-prompt {
      font-size: 0.88rem;
      color: #666;
      text-align: center;
      margin: 0.5rem 0;
    }
    .board--blackboard .hint-prompt { color: #c8ddd0; }

    .footer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(255,249,232,0.96) 40%);
      display: flex;
      justify-content: center;
      z-index: 150;
    }
    .footer-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 1rem;
      width: 100%;
      max-width: 960px;
    }
    .page-nav-link {
      font-family: "ZCOOL KuaiLe", sans-serif;
      font-size: 0.88rem;
      padding: 0.5rem 0.95rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: linear-gradient(180deg, #f8fbff 0%, #e8eef5 100%);
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 2px 3px 0 var(--shadow);
      transition: transform 0.12s ease;
    }
    a.page-nav-link:hover,
    button.page-nav-link:hover {
      transform: translateY(-1px);
    }
    button.page-nav-link {
      cursor: pointer;
      font: inherit;
    }
    .page-nav-link--disabled {
      opacity: 0.42;
      pointer-events: none;
      cursor: default;
      box-shadow: none;
    }
    .next-btn {
      font-family: "ZCOOL KuaiLe", sans-serif;
      font-size: 1.08rem;
      padding: 0.65rem 1.6rem;
      background: linear-gradient(180deg, var(--crayon-yellow) 0%, #ffc107 100%);
      border: 3px solid var(--ink);
      border-radius: 14px 10px 16px 12px;
      box-shadow: 4px 5px 0 var(--shadow);
      cursor: pointer;
    }
    .next-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .success-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -12px;
      animation: fall 2.8s linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(100vh) rotate(720deg); opacity: 0.35; }
    }

    /* Part 6–8：主谓宾拖拽 / 点选 / 练习区 */
    .p3-drop-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      margin: 1.1rem 0;
      align-items: stretch;
    }
    .p3-drop-zone {
      min-width: 92px;
      min-height: 52px;
      padding: 0.45rem 0.5rem;
      border: 3px dashed var(--ink);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .board--blackboard .p3-drop-zone {
      background: rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.45);
    }
    .p3-drop-zone__label {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 0.25rem;
    }
    .board--blackboard .p3-drop-zone__label { color: #c8ddd0; }
    .p3-drop-zone.drag-over {
      background: rgba(255, 213, 79, 0.35);
      border-color: var(--crayon-orange);
    }
    .p3-drop-zone.wrong-flash {
      animation: p3shake 0.35s ease;
    }
    .p3-drop-zone.filled-correct {
      border-style: solid;
      border-color: var(--crayon-green);
      background: rgba(92, 184, 92, 0.2);
    }
    .p3-drop-zone .dropped-chip {
      font-family: "Patrick Hand", cursive;
      font-size: 1.05rem;
      color: var(--ink);
      text-align: center;
    }
    /* 黑板 + 绿框内英文：白字易读 */
    .board--blackboard .p3-drop-zone.filled-correct .dropped-chip {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .p3-draggable {
      display: inline-block;
      padding: 0.2rem 0.45rem;
      margin: 0.08rem;
      border-radius: 8px;
      border: 2px dashed var(--crayon-blue);
      background: rgba(74, 144, 217, 0.12);
      cursor: grab;
      touch-action: none;
      user-select: none;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.05rem, 3.2vw, 1.35rem);
    }
    .p3-draggable:active { cursor: grabbing; }
    .p3-draggable.is-dragging {
      opacity: 0.85;
      z-index: 50;
      box-shadow: 4px 6px 0 var(--shadow);
    }
    .p3-chip-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.85rem 0;
      min-height: 48px;
    }
    .p3-sentence-tap {
      font-family: "Patrick Hand", cursive;
      font-size: clamp(1.05rem, 3.5vw, 1.4rem);
      text-align: center;
      line-height: 1.75;
      margin: 0.75rem 0;
      color: var(--ink);
    }
    .board--blackboard .p3-sentence-tap { color: #f5f5f0; }
    .p3-tap {
      padding: 0.06em 0.12em;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s;
    }
    .p3-tap.wrong-flash {
      animation: p3shake 0.35s ease;
    }
    @keyframes p3shake {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-5px); }
      60% { transform: translateX(5px); }
    }
    .p3-tap.tap-pred-done {
      color: var(--finite);
      font-weight: bold;
      box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.35);
      background: rgba(198, 40, 40, 0.12);
    }
    .p3-tap.tap-nf-done {
      color: #ffeb3b;
      font-weight: bold;
      box-shadow: 0 0 0 3px rgba(255, 235, 59, 0.55);
      background: rgba(255, 235, 59, 0.22);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .p3-board-lines {
      text-align: left;
      max-width: 520px;
      margin: 0.75rem auto;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(0.95rem, 2.8vw, 1.12rem);
      line-height: 1.85;
      color: #e8f0e8;
    }
    .p3-board-lines .nf-blink {
      color: #e1bee7;
      font-weight: bold;
      animation: nfBlink 1.1s ease-in-out infinite;
    }
    @keyframes nfBlink {
      0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(186, 104, 200, 0.9); }
      50% { opacity: 0.55; text-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-blink { animation: none; opacity: 1; text-decoration: underline; }
    }
    .summary-cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 520px;
      margin: 1rem auto;
    }
    .summary-card {
      padding: 0.85rem 1rem;
      border: 3px solid var(--ink);
      border-radius: 14px 10px 16px 12px;
      background: linear-gradient(180deg, #fffef8 0%, #ffe8c8 100%);
      box-shadow: 4px 5px 0 var(--shadow);
      text-align: left;
      font-size: 0.92rem;
      line-height: 1.65;
      color: #1a1a1a;
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      animation: cardPop 0.55s ease forwards;
    }
    .summary-card:nth-child(1) { animation-delay: 0.05s; }
    .summary-card:nth-child(2) { animation-delay: 0.2s; }
    .summary-card:nth-child(3) { animation-delay: 0.35s; }
    @keyframes cardPop {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    var re = new RegExp("(\\b" + escapeRegExp(wrong) + "\\b)");
    var parts = q.en.split(re);
    var html = "";
    for (var i = 0; i < parts.length; i++) {

          escapeHtml(correct) +
          '</span><span class="word-fix-bad">' +
          escapeHtml(wrong) +
          '<span class="word-fix-x" aria-hidden="true">✕</span></span></span>';
      } else {
        html += escapeHtml(parts[i]);

    }
    return html;

  function shuffle(arr) {

    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));

      a[i] = a[j];

  function playBeep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.13);
    } catch (e) {}
  }

    stepMount.innerHTML = html;
    bindStepEvents();
  }

  var _p3drag = null;

  function resetPracticeUx() {
    ux.predOk = false;
    ux.nfOk = false;
    ux.svoDone = false;
  }

  function clearP3Ghost() {
    if (_p3drag && _p3drag.ghost && _p3drag.ghost.parentNode) {
      _p3drag.ghost.parentNode.removeChild(_p3drag.ghost);
    }
    _p3drag = null;
  }

  function onP3PointerMove(e) {
    if (!_p3drag) return;
    _p3drag.ghost.style.left = e.clientX - _p3drag.offX + "px";
    _p3drag.ghost.style.top = e.clientY - _p3drag.offY + "px";
  }

  function onP3PointerUp(e) {
    if (!_p3drag) return;
    var role = _p3drag.role;
    var sourceEl = _p3drag.sourceEl;
    var prefix = _p3drag.prefix;
    var expected = _p3drag.expected;
    var onComplete = _p3drag.onComplete;
    clearP3Ghost();
    document.removeEventListener("pointermove", onP3PointerMove);
    document.removeEventListener("pointerup", onP3PointerUp);
    document.removeEventListener("pointercancel", onP3PointerUp);
    sourceEl.classList.remove("is-dragging");
    try {
      sourceEl.releasePointerCapture(e.pointerId);
    } catch (err) {}

    var dropEl = document.elementFromPoint(e.clientX, e.clientY);
    if (!dropEl) {
      sourceEl.style.visibility = "";
      return;
    }
    var zone = dropEl.closest(".p3-drop-zone");
    if (!zone || zone.getAttribute("data-accept") !== role) {
      sourceEl.style.visibility = "";
      if (zone) {
        zone.classList.add("wrong-flash");
        setTimeout(function () {
          zone.classList.remove("wrong-flash");
        }, 400);
      }
      return;
    }
    var exp = expected[role];
    if (sourceEl.textContent.trim() !== exp) {
      sourceEl.style.visibility = "";
      return;
    }
    var slot = zone.querySelector(".p3-drop-slot");
    if (!slot || slot.querySelector(".dropped-chip")) {
      sourceEl.style.visibility = "";
      return;
    }
    slot.innerHTML = '<div class="dropped-chip">' + escapeHtml(exp) + "</div>";
    zone.classList.add("filled-correct");
    sourceEl.style.visibility = "hidden";
    playBeep();
    if (onComplete) onComplete();
  }

  function beginP3Drag(e, sourceEl, prefix, expected, onComplete) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    var role = sourceEl.getAttribute("data-chunk");
    if (!role) return;
    var ghost = document.createElement("div");
    ghost.className = "p3-ghost";
    ghost.textContent = sourceEl.textContent;
    document.body.appendChild(ghost);
    var rect = sourceEl.getBoundingClientRect();
    var offX = e.clientX - rect.left;
    var offY = e.clientY - rect.top;
    ghost.style.left = e.clientX - offX + "px";
    ghost.style.top = e.clientY - offY + "px";
    _p3drag = { ghost: ghost, sourceEl: sourceEl, role: role, prefix: prefix, expected: expected, offX: offX, offY: offY, onComplete: onComplete };
    sourceEl.classList.add("is-dragging");
    try {
      sourceEl.setPointerCapture(e.pointerId);
    } catch (err2) {}
    document.addEventListener("pointermove", onP3PointerMove);
    document.addEventListener("pointerup", onP3PointerUp);
    document.addEventListener("pointercancel", onP3PointerUp);
  }

  function checkThreeZonesFilled(rowId) {
    var row = document.getElementById(rowId);
    if (!row) return false;
    var slots = row.querySelectorAll(".p3-drop-slot");
    if (slots.length !== 3) return false;
    for (var i = 0; i < slots.length; i++) {
      if (!slots[i].querySelector(".dropped-chip")) return false;
    }
    return true;
  }

  function attachP3Interactions() {
    clearP3Ghost();
    document.removeEventListener("pointermove", onP3PointerMove);
    document.removeEventListener("pointerup", onP3PointerUp);
    document.removeEventListener("pointercancel", onP3PointerUp);

    if (state === 24 && !ux.s24done) {
      var exp24 = { subject: "Steven", predicate: "likes", object: "eating apples" };
      stepMount.querySelectorAll("#p6DragLine .p3-draggable").forEach(function (el) {
        el.addEventListener("pointerdown", function (e) {
          beginP3Drag(e, el, "p6d", exp24, function () {
            if (checkThreeZonesFilled("p6dRow")) {
              ux.s24done = true;
              launchConfetti();
              render();
            }
          });
        });
      });
    }

    if (state >= PRACTICE_START && state <= PRACTICE_END && exStep() === 3 && !ux.svoDone) {
      var ex = currentEx();
      var expEx = { subject: ex.subj, predicate: ex.pred, object: ex.obj };
      var pool = stepMount.querySelector("#exChipPool");
      if (pool) {
        pool.querySelectorAll(".p3-draggable").forEach(function (el) {
          el.addEventListener("pointerdown", function (e) {
            beginP3Drag(e, el, "exd", expEx, function () {
              if (checkThreeZonesFilled("exdRow")) {
                ux.svoDone = true;
                playBeep();
                render();
              }
            });
          });
        });
      }
    }

    stepMount.querySelectorAll("[data-tap]").forEach(function (sp) {
      sp.addEventListener("click", function () {
        if (state < PRACTICE_START || state > PRACTICE_END) return;
        var st = exStep();
        var typ = sp.getAttribute("data-tap");
        if (st === 1) {
          if (typ === "p") {
            ux.predOk = true;
            playBeep();
            render();
          } else if (typ === "n") {
            sp.classList.add("wrong-flash");
            setTimeout(function () {
              sp.classList.remove("wrong-flash");
            }, 400);
          }
        } else if (st === 2) {
          if (typ === "n") {
            ux.nfOk = true;
            playBeep();
            render();
          } else if (typ === "p") {
            sp.classList.add("wrong-flash");
            setTimeout(function () {
              sp.classList.remove("wrong-flash");
            }, 400);
          }
        }
      });
    });
    updatePrevBtn();
  }

  function bindStepEvents() {
    var k = document.getElementById("kiwiSpeak");
    if (k) {
      k.addEventListener("click", function () {
        speakAzure("kiwi");
      });
    }
    var tfBtns = stepMount.querySelectorAll("[data-tf]");
    tfBtns.forEach(function (b) {
      b.addEventListener("click", function () {
        if (quizAnswered) return;
        quizAnswered = true;
        sessionStorage.setItem("p3_tf", b.getAttribute("data-tf"));
        render();
      });
    });
    attachP3Interactions();
  }

  function onEnterState() {}

  function advance() {
    if (state === 1) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 2;
      phase = 0;
      render();
      return;
    }
    if (state === 2) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 3;
      quizIndex = 0;
      quizAnswered = false;
      phase = 0;
      render();
      onEnterState();
      return;
    }
    if (state >= 3 && state <= 7) {
      if (!quizAnswered) return;
      if (state === 7) {
        state = 8;
        quizIndex = 0;
        quizAnswered = false;
        phase = 0;
        render();
        return;
      }
      state++;
      quizIndex++;
      quizAnswered = false;
      phase = 0;
      render();
      onEnterState();
      return;
    }
    if (state === 8) {
      state = 9;
      phase = 0;
      render();
      return;
    }
    if (state === 9) {
      if (phase < 2) {
        phase++;
        render();
        return;
      }
      state = 10;
      phase = 0;
      render();
      onEnterState();
      return;
    }
    if (state === 10) {
      state = 11;
      render();
      return;
    }
    if (state === 11) {
      state = 12;
      phase = 0;
      render();
      return;
    }
    if (state === 12) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 13;
      phase = 0;
      render();
      onEnterState();
      return;
    }
    if (state === 13) {
      state = 14;
      phase = 0;
      render();
      return;
    }
    if (state === 14) {
      if (phase < S15_QA.length * 2 - 1) {
        phase++;
        render();
        return;
      }
      state = 15;
      phase = 0;
      render();
      return;
    }
    if (state >= 15 && state <= 17) {
      state++;
      phase = 0;
      render();
      return;
    }
    if (state === 18) {
      state = 19;
      phase = 0;
      render();
      return;
    }
    if (state === 19) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 20;
      phase = 0;
      render();
      return;
    }
    if (state === 20) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 21;
      phase = 0;
      render();
      launchConfetti();
      nextBtn.textContent = "下一步 Next →";
      nextBtn.disabled = false;
      return;
    }
    if (state === 21) {
      state = 23;
      ux.s24done = false;
      phase = 0;
      render();
      return;
    }
    if (state === 23) {
      state = 24;
      ux.s24done = false;
      render();
      return;
    }
    if (state === 24) {
      if (!ux.s24done) return;
      state = 25;
      render();
      return;
    }
    if (state === 25) {
      state = 26;
      render();
      return;
    }
    if (state === 26) {
      state = 27;
      resetPracticeUx();
      phase = 0;
      render();
      onEnterState();
      return;
    }
    if (state >= PRACTICE_START && state <= PRACTICE_END) {
      if (!canAdvanceNext()) return;
      if (state === PRACTICE_END) {
        state = FINAL_START;
        phase = 0;
        render();
        return;
      }
      state++;
      if (exStep() === 0) {
        resetPracticeUx();
      }
      if (exStep() === 3) {
        ux.svoDone = false;
      }
      render();
      if (exStep() === 0) {
        onEnterState();
      }
      return;
    }
    if (state === 59) {
      state = 60;
      render();
      return;
    }
    if (state === 60) {
      state = 61;
      phase = 0;
      render();
      return;
    }
    if (state === 61) {
      if (phase === 0) {
        phase = 1;
        render();
        return;
      }
      state = 62;
      phase = 0;
      render();
      nextBtn.textContent = "本页结束 ✓";
      nextBtn.disabled = true;
      launchConfetti();
      onEnterState();
      return;
    }
  }

  document.getElementById("mainBoard").addEventListener("click", function (e) {
    var b = e.target.closest(".tts-read-btn[data-tts-read]");
    if (!b || !stepMount.contains(b)) return;
    var enc = b.getAttribute("data-tts-read");
    if (enc) speakAzure(decodeURIComponent(enc));
  });

  nextBtn.addEventListener("click", function () {
    if (state === 62) return;
    if (!canAdvanceNext()) return;
    p3NavStack.push(snapP3());
    advance();
  });
  if (prevBtn) prevBtn.addEventListener("click", retreatP3);

  render();
})();
  </script>
