      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")

  function launchConfetti() {
    confettiRoot.innerHTML = "";
    confettiRoot.setAttribute("aria-hidden", "false");
    var colors = ["#e85d5d", "#5dbeb1", "#4a90d9", "#e07c3e", "#ffd54f", "#1e3a5f"];

      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 1.6 + Math.random() * 0.9 + "s";
      confettiRoot.appendChild(c);

    setTimeout(function () {
      confettiRoot.innerHTML = "";
      confettiRoot.setAttribute("aria-hidden", "true");

  function trackItems() {
    if (!track) return [];
    var out = [];
    for (var i = 0; i < VERB_ITEMS.length; i++) {
      if (VERB_ITEMS[i].level === track) out.push(VERB_ITEMS[i]);
    }
    return out;
  }

  function currentVerb() {
    var arr = trackItems();
    return arr[verbIndex] || null;
  }

  function verbDoneKey(i) {
    return (track || "") + ":" + i;

  function p4WordListPillHtml(wi, it) {
    var dk = verbDoneKey(wi);
    var done = !!verbDone[dk];
    var active = wi === verbIndex && !done && verbIndex >= 0;
    var cls = "p4-word-pill";
    if (done) cls += " p4-word-pill--done";
    if (active) cls += " p4-word-pill--active";
    return (
      '<div class="p4-word-pill-wrap">' +
      '<button type="button" class="' +
      cls +
      '" data-verb-index="' +
      wi +
      '">' +
      '<span class="p4-word-pill__verb">' +
      escapeHtml(it.verb) +
      (done ? " ✓" : "") +
      "</span>" +
      '<span class="p4-word-pill__pat">' +
      escapeHtml(it.pattern) +
      "</span>" +
      '<span class="p4-word-pill__meta">' +
      escapeHtml(typeLabel(it.type)) +
      "</span>" +
      "</button>" +
      (it.example_sentence ? ttsReadBtnHtml(it.example_sentence) : "") +
      "</div>"
    );

  function htmlWordListBar() {
    return (
      '<div class="p4-lex-bar">' +

  function applyBodyTheme() {
    document.body.classList.remove("theme-junior", "theme-senior");
    if (track === "junior") document.body.classList.add("theme-junior");
    if (track === "senior") document.body.classList.add("theme-senior");

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  var _drag = null;

  function clearDragGhost() {
    if (_drag && _drag.ghost && _drag.ghost.parentNode) {
      _drag.ghost.parentNode.removeChild(_drag.ghost);
    }
    _drag = null;
  }

  function onDragMove(e) {
    if (!_drag) return;
    _drag.ghost.style.left = e.clientX - _drag.offX + "px";
    _drag.ghost.style.top = e.clientY - _drag.offY + "px";
  }

  function onDragUp(e) {
    if (!_drag) return;
    var answer = _drag.answer;
    var sourceEl = _drag.sourceEl;
    var slotClass = _drag.slotClass;
    var onCheck = _drag.onCheck;
    clearDragGhost();
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragUp);
    document.removeEventListener("pointercancel", onDragUp);
    sourceEl.classList.remove("is-dragging");
    try {
      sourceEl.releasePointerCapture(e.pointerId);
    } catch (err) {}

    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el) {
      sourceEl.style.visibility = "";
      return;
    }
    var slot = el.closest("." + slotClass);
    if (!slot) {
      sourceEl.style.visibility = "";
      return;
    }
    var idx = parseInt(slot.getAttribute("data-idx"), 10);
    if (slot.querySelector(".p4-chip")) {
      sourceEl.style.visibility = "";
      return;
    }
    var expected = answer[idx];
    if (sourceEl.getAttribute("data-text") !== expected) {
      sourceEl.style.visibility = "";
      slot.classList.add("wrong-flash");
      setTimeout(function () {
        slot.classList.remove("wrong-flash");
      }, 400);
      return;
    }
    sourceEl.style.visibility = "hidden";
    sourceEl.classList.add("p4-placed");
    var clone = document.createElement("span");
    clone.className = "p4-chip";
    clone.textContent = expected;
    clone.setAttribute("data-text", expected);
    slot.appendChild(clone);
    slot.classList.add("filled");
    if (onCheck) onCheck();
  }

  function beginChipDrag(e, chipEl, answer, slotClass, onCheck) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    var ghost = document.createElement("div");
    ghost.className = "p4-ghost";
    ghost.textContent = chipEl.getAttribute("data-text") || chipEl.textContent;
    document.body.appendChild(ghost);
    var rect = chipEl.getBoundingClientRect();
    var offX = e.clientX - rect.left;
    var offY = e.clientY - rect.top;
    ghost.style.left = e.clientX - offX + "px";
    ghost.style.top = e.clientY - offY + "px";
    chipEl.style.visibility = "hidden";
    _drag = { ghost: ghost, sourceEl: chipEl, answer: answer, slotClass: slotClass, offX: offX, offY: offY, onCheck: onCheck };
    chipEl.classList.add("is-dragging");
    try {
      chipEl.setPointerCapture(e.pointerId);
    } catch (err2) {}
    document.addEventListener("pointermove", onDragMove);
    document.addEventListener("pointerup", onDragUp);
    document.addEventListener("pointercancel", onDragUp);
  }

  function resetPracticeSlots(containerSel, answer) {
    var root = stepMount.querySelector(containerSel);
    if (!root) return;
    var slots = root.querySelectorAll(".p4-slot");
    for (var i = 0; i < slots.length; i++) {
      slots[i].innerHTML = "";
      slots[i].classList.remove("filled");
    }
    var chips = root.querySelectorAll(".p4-chip-pool .p4-chip");
    for (var j = 0; j < chips.length; j++) {
      chips[j].style.visibility = "";
      chips[j].classList.remove("is-dragging", "p4-placed");
    }
  }

  function checkSlotsComplete(slotsRowId, answerLen) {
    var row = document.getElementById(slotsRowId);
    if (!row) return false;
    var slots = row.querySelectorAll(".p4-slot");
    if (slots.length !== answerLen) return false;
    for (var i = 0; i < slots.length; i++) {
      if (!slots[i].querySelector(".p4-chip")) return false;
    }
    return true;
  }

  function attachSlotDragPractice(slotsRowId, poolId, answer, onComplete) {
    clearDragGhost();
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragUp);
    document.removeEventListener("pointercancel", onDragUp);

    var pool = document.getElementById(poolId);
    if (!pool) return;
    pool.querySelectorAll(".p4-chip:not(.p4-placed)").forEach(function (chip) {
      if (chip.parentNode && chip.parentNode.classList.contains("p4-slot")) return;
      chip.addEventListener("pointerdown", function (ev) {
        if (chip.style.visibility === "hidden") return;
        beginChipDrag(ev, chip, answer, "p4-slot", function () {
          if (checkSlotsComplete(slotsRowId, answer.length)) {
            ux.p1 = true;
            if (onComplete) onComplete();
            render();
          }
        });
      });
    });
  }

  function attachSortDragPractice(slotsRowId, poolId, answer, onComplete) {
    clearDragGhost();
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", onDragUp);
    document.removeEventListener("pointercancel", onDragUp);

    var pool = document.getElementById(poolId);
    if (!pool) return;
    pool.querySelectorAll(".p4-chip").forEach(function (chip) {
      chip.addEventListener("pointerdown", function (ev) {
        if (chip.style.visibility === "hidden") return;
        beginChipDrag(ev, chip, answer, "p4-slot", function () {
          if (checkSlotsComplete(slotsRowId, answer.length)) {
            ux.p2 = true;
            launchConfetti();
            if (onComplete) onComplete();
            render();
          }
        });
      });
    });
  }

  function typeLabel(t) {
    if (t === "to_do") return "to do";
    if (t === "doing") return "doing";
    return "裸不定式 do";
  }

  function updatePrevBtn() {
    if (prevBtn) prevBtn.disabled = state <= 1;
  }

  function retreatP4() {
    if (state <= 1) return;
    if (state === 7) {
      state = 8;
      render();
      return;
    }
    if (state === 6) {
      if (subStep > 0) {
        subStep--;
        if (subStep < 3) ux.p2 = false;
        if (subStep < 2) ux.p1 = false;
        render();
        return;
      }
      state = 8;
      verbIndex = -1;
      render();
      return;
    }
    if (state === 8) {
      state = 5;
      track = null;
      verbIndex = -1;
      subStep = 0;
      ux.p1 = false;
      ux.p2 = false;
      render();
      return;
    }
    if (state === 5) {
      state = 4;
      render();
      return;
    }
    state--;
    render();
  }

    if (state === 1) {

                escapeHtml(poolWords1[pi]) +
                '">' +
                escapeHtml(poolWords1[pi]) +
                "</span>";
            }
          }
          html =
            '<div class="step-panel active">' +
            htmlWordListBar() +
            '<span class="' +
            ribbonClass +
            '">' +
            escapeHtml(v.level + " · " + typeLabel(v.type)) +
            "</span>" +
            '<p class="zh-text">Step C · 看图造句</p>' +
            '<p class="hint-prompt" style="opacity:0.95;margin-top:0;">请把词块<strong>拖入横线槽</strong>，连成完整英文；目标句与 Step B <strong>不是同一句</strong>。</p>' +
            '<p class="hint-prompt" style="font-size:0.82rem;opacity:0.88;margin-top:0.15rem;">本步配图只配合下方中文提示与组句；插图 alt 为场景说明（制图 / 读屏）。</p>' +
            '<div class="pic-frame">' +
            "<!-- 练习场景：practice_1_pic_prompt，须与 example_pic_prompt 区分 -->" +
            '<img src="' +
            escapeHtml(dqAssetUrl(v.practice_image) || P4_IMG_FALLBACK) +
            '" onerror="this.onerror=null;this.src=\'' +
            P4_IMG_FALLBACK +
            '\'" alt="' +
            escapeHtml(v.practice_1_pic_prompt || "") +
            '" />' +
            "</div>" +
            '<p class="zh-text" style="font-weight:bold;">' +
            escapeHtml(v.practice_1_cn) +
            "</p>" +
            '<div class="p4-slots-row" id="p4Slots1">' +
            slots1 +
            "</div>" +
            '<div class="p4-chip-pool" id="p4Pool1"' +
            poolStyle1 +
            ">" +
            chips1 +
            "</div>" +
            (ux.p1
              ? '<p class="win-banner">造句正确！</p>' +
                '<div class="sentence-tts-row">' +
                '<p class="en-sentence" style="font-size:1.05rem;">' +
                escapeHtml(v.practice_1_answer.join(" ")) +
                "</p>" +
                ttsReadBtnHtml(v.practice_1_answer.join(" ")) +
                "</div>"
              : '<p class="hint-prompt">错格会弹回；全对后出现提示并可下一步。</p>') +
            "</div>";
          showNext = ux.p1;
        } else {
          var slots2 = "";
          var chips2 = "";
          var poolStyle2 = "";
          if (ux.p2) {
            for (var sj = 0; sj < v.practice_2_answer.length; sj++) {
              slots2 +=
                '<div class="p4-slot filled" data-idx="' +
                sj +
                '"><span class="p4-chip">' +
                escapeHtml(v.practice_2_answer[sj]) +
                "</span></div>";
            }
            poolStyle2 = ' style="display:none"';
          } else {
            for (var sj2 = 0; sj2 < v.practice_2_answer.length; sj2++) {
              slots2 += '<div class="p4-slot" data-idx="' + sj2 + '"></div>';
            }
            var poolWords2 = shuffle(v.practice_2_words.slice());
            for (var pj = 0; pj < poolWords2.length; pj++) {
              chips2 +=
                '<span class="p4-chip" data-text="' +
                escapeHtml(poolWords2[pj]) +
                '">' +
                escapeHtml(poolWords2[pj]) +
                "</span>";
            }
          }
          html =
            '<div class="step-panel active">' +
            htmlWordListBar() +
            '<span class="' +
            ribbonClass +
            '">' +
            escapeHtml(v.level + " · " + typeLabel(v.type)) +
            "</span>" +
            '<p class="zh-text">Step D · 句子排序</p>' +
            '<p class="hint-prompt" style="opacity:0.95;margin-top:0;">将词块<strong>拖入槽内</strong>并排出<strong>正确语序</strong>；本句与 Step B 例句、Step C 造句<strong>均不相同</strong>（第三句 · 无图）。</p>' +
            '<div class="p4-slots-row" id="p4Slots2">' +
            slots2 +
            "</div>" +
            '<div class="p4-chip-pool" id="p4Pool2"' +
            poolStyle2 +
            ">" +
            chips2 +
            "</div>" +
            (ux.p2
              ? '<p class="win-banner">顺序正确！撒花~</p>' +
                '<div class="sentence-tts-row">' +
                '<p class="en-sentence">' +
                escapeHtml(v.practice_2_answer.join(" ")) +
                "</p>" +
                ttsReadBtnHtml(v.practice_2_answer.join(" ")) +
                "</div>"
              : '<p class="hint-prompt">拖满后自动检查；完成后可点 🔊 听整句。</p>') +
            "</div>";
          showNext = ux.p2;
        }
      }
    } else if (state === 7) {
      var p7en = "Congratulations! You have finished this page.";
      html =
        '<div class="step-panel active">' +
        '<p class="zh-text" style="font-size:1.1rem;">🎉 本页通关！</p>' +
        '<div class="sentence-tts-row">' +
        '<p class="en-sentence" style="font-size:1.1rem;margin:0;">' +
        escapeHtml(p7en) +
        "</p>" +
        ttsReadBtnHtml(p7en) +
        "</div>" +
        '<p class="zh-text">你已经把 <strong>SVO / SVOC</strong> 框架下 <strong>to do、doing、裸 do</strong> 的核心动词走了一遍；裸不定式部分覆盖使役与感官的全部常见考点词。</p>' +
        '<div class="p4-list-actions">' +
        (track
          ? '<button type="button" class="p4-list-actions__primary" data-action="back-to-wordlist">返回单词表继续学</button>'
          : "") +
        "</div>" +
        '<p class="hint-prompt">可关闭本页或返回课程目录。</p>' +
        "</div>";
      showNext = false;
    }

    stepMount.innerHTML = html;
    nextBtn.disabled = !showNext;

    if (state === 5) {
      stepMount.querySelectorAll("[data-track]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          track = btn.getAttribute("data-track");
          verbIndex = -1;
          subStep = 0;
          ux.p1 = false;
          ux.p2 = false;
          state = 8;
          render();
        });
      });
    }

    if (state === 8) {
      stepMount.querySelectorAll(".p4-word-pill[data-verb-index]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var i = parseInt(btn.getAttribute("data-verb-index"), 10);
          if (isNaN(i)) return;
          verbIndex = i;
          subStep = 0;
          ux.p1 = false;
          ux.p2 = false;
          state = 6;
          render();
        });
      });
      var chg = stepMount.querySelector("[data-action=\"change-track\"]");
      if (chg) {
        chg.addEventListener("click", function () {
          track = null;
          verbIndex = -1;
          subStep = 0;
          ux.p1 = false;
          ux.p2 = false;
          state = 5;
          render();
        });
      }
      var fin = stepMount.querySelector("[data-action=\"finale\"]");
      if (fin) {
        fin.addEventListener("click", function () {
          state = 7;
          render();
        });
      }
    }

    if (state === 6) {
      var wlb = stepMount.querySelector("[data-action=\"word-list\"]");
      if (wlb) {
        wlb.addEventListener("click", function () {
          state = 8;
          render();
        });
      }
    }

    if (state === 7) {
      var bwl = stepMount.querySelector("[data-action=\"back-to-wordlist\"]");
      if (bwl) {
        bwl.addEventListener("click", function () {
          state = track ? 8 : 5;
          render();
        });
      }
    }

    if (state === 6 && currentVerb()) {
      var cv = currentVerb();
      if (subStep === 2 && !ux.p1) {
        attachSlotDragPractice("p4Slots1", "p4Pool1", cv.practice_1_answer, null);
      }
      if (subStep === 3 && !ux.p2) {
        attachSortDragPractice("p4Slots2", "p4Pool2", cv.practice_2_answer, null);
      }
    }

    updateProgressTag();

    if (state === 6 && subStep === 3 && ux.p2) {
      nextBtn.textContent = "返回单词表 →";
    } else {
      nextBtn.textContent = "下一步 →";
    }
    updatePrevBtn();
  }

  function onEnterState() {}

  function canAdvance() {
    if (state <= 4) return true;
    if (state === 5 || state === 8) return false;
    if (state === 6) {
      if (subStep === 2) return ux.p1;
      if (subStep === 3) return ux.p2;
      return true;
    }
    return false;
  }

  function advance() {
    if (!canAdvance()) return;
    if (state <= 4) {
      state++;
      render();
      return;
    }
    if (state === 6) {
      if (subStep < 3) {
        subStep++;
        if (subStep === 2) ux.p1 = false;
        if (subStep === 3) ux.p2 = false;
        render();
        return;
      }
      if (subStep === 3 && ux.p2) {
        verbDone[verbDoneKey(verbIndex)] = true;
        state = 8;
        render();
        return;
      }
    }
  }

  document.getElementById("mainBoard").addEventListener("click", function (e) {
    var b = e.target.closest(".tts-read-btn[data-tts-read]");
    if (!b || !stepMount.contains(b)) return;
    var enc = b.getAttribute("data-tts-read");
    if (enc) speakAzure(decodeURIComponent(enc));
  });

  nextBtn.addEventListener("click", function () {
    if (state === 7) return;
    advance();
  });
  if (prevBtn) prevBtn.addEventListener("click", retreatP4);

  render();
})();
  </script>
  <link rel="stylesheet" href="assets/lesson-image-lightbox.css" />
  <script src="assets/lesson-image-lightbox.js" defer></script>
</body>
</html>
