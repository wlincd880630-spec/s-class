  <style>
    :root {
      --paper: #fff9f0;
      --ink: #2c2c2c;
      --state-blue: #4a90d9;
      --habit-green: #43a047;
      --now-accent: #ff8f00;
      --shadow: rgba(60, 40, 20, 0.12);
      --crayon-red: #e85d4c;
      --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 220, 180, 0.42) 0%, transparent 44%),
        radial-gradient(circle at 86% 78%, rgba(200, 230, 255, 0.36) 0%, transparent 42%),
        linear-gradient(168deg, #ffeaa7 0%, #fab1a0 36%, #dfe6e9 100%);
      color: var(--ink);
      padding: 0.75rem;
      padding-bottom: 5.5rem;
    }
    body.tts-lock {
      cursor: wait;
    }
    body.tts-lock .pool-card,
    body.tts-lock .subject-bay {
      pointer-events: none;
    }
    .en, .sentence-line, .subject-slot-inner {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .book {
      max-width: 980px;
      margin: 0 auto;
      background: var(--paper);
      border-radius: var(--wobble);
      border: 3px solid rgba(200, 160, 100, 0.55);
      box-shadow: 6px 8px 0 var(--now-accent), 14px 18px 28px var(--shadow);
      padding: 1rem 1.1rem 1.4rem;
      position: relative;
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(200, 160, 100, 0.4);
      border-radius: 220px 20px 200px 24px / 18px 210px 22px 240px;
      pointer-events: none;
    }
    .top-bar {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 0.95rem;
      padding: 0.42rem 0.75rem;
      margin-bottom: 0.65rem;
      border-radius: var(--wobble);
      border: 3px solid var(--state-blue);
      background: linear-gradient(90deg, rgba(255,255,255,0.92), rgba(255,248,230,0.96));
    }
    .top-bar strong { color: var(--crayon-red); }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 0.35rem;
      font-size: clamp(1.15rem, 3.6vw, 1.45rem);
      color: #1a237e;
      text-align: center;
      text-shadow: 1px 2px 0 rgba(0,0,0,0.06);
    }
    .lab-stage {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 720px) {
      .lab-stage { grid-template-columns: 1fr; }
    }
    .panel-title {
      font-size: 0.82rem;
      margin: 0 0 0.45rem;
      color: #37474f;
      font-weight: 800;
    }
    .subject-bay {
      min-height: 140px;
      padding: 0.65rem;
      border-radius: var(--wobble);
      border: 3px dashed rgba(67, 160, 71, 0.45);
      background: rgba(255,255,255,0.65);
      box-shadow: inset 0 0 0 2px rgba(200, 230, 201, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .subject-bay .placeholder {
      font-size: 0.88rem;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
    .subject-slot-inner {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--habit-green);
      text-align: center;
      padding: 0.35rem 0.75rem;
      border-radius: 18px 8px 22px 12px;
      border: 3px solid var(--habit-green);
      background: rgba(232, 245, 233, 0.85);
      box-shadow: 3px 4px 0 rgba(46, 125, 50, 0.2);
      max-width: 100%;
    }
    .subject-note {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: #666;
      text-align: center;
      line-height: 1.45;
    }
    .sentence-panel {
      min-height: 160px;
      padding: 0.75rem 0.85rem 0.9rem;
      border-radius: var(--wobble);
      border: 3px solid rgba(74, 144, 217, 0.45);
      background: linear-gradient(180deg, rgba(227,242,253,0.45), rgba(255,255,255,0.92));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sentence-placeholder {
      margin: 0;
      font-size: 0.88rem;
      color: #888;
      text-align: center;
      line-height: 1.55;
    }
    .sentence-box {
      margin: 0;
      padding: 0.75rem 0.85rem;
      border-radius: 16px 22px 14px 20px;
      border: 3px dashed rgba(200, 100, 80, 0.42);
      background: rgba(255, 254, 250, 0.98);
      min-height: 4.5rem;
      display: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }
    .sentence-box.is-on { display: block; }
    .sentence-line {
      font-size: clamp(1.18rem, 3.4vw, 1.45rem);
      line-height: 1.55;
      color: #2c2c2c;
      text-align: center;
    }
    .sentence-line .hl {
      color: var(--crayon-red);
      font-weight: 800;
      text-decoration: underline wavy rgba(232, 93, 76, 0.45);
      text-underline-offset: 3px;
    }
    .pool {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      padding: 0.75rem 0.35rem;
      border-radius: var(--wobble);
      border: 2px solid rgba(200, 160, 100, 0.4);
      background: rgba(255,255,255,0.55);
      margin-bottom: 0.85rem;
    }
    .pool-card {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.42rem 0.65rem;
      border-radius: 18px 10px 22px 12px;
      border: 3px solid #5d4037;
      background: linear-gradient(180deg, #fff, #f5f0e6);
      cursor: pointer;
      box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
      touch-action: manipulation;
      user-select: none;
      transition: filter 0.2s ease;
    }
    .pool-card:hover:not(.is-busy) {
      filter: brightness(1.04);
    }
    .pool-card.is-busy {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .pool-card.is-selected {
      outline: 3px dashed var(--state-blue);
      outline-offset: 2px;
    }
    .attempt-badge {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 0.35rem;
    }
    .bottom-row {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
    }
    @media (min-width: 780px) {
      .bottom-row .pool-wrap {
        min-width: 0;
      }
      .notes-panel {
        max-width: none;
      }
    }
    .pool-wrap {
      flex: 1;
      min-width: 0;
    }
    .notes-panel {
      position: relative;
      z-index: 1;
      margin-top: 0.5rem;
      padding: 0.75rem 0.85rem;
      border-radius: 22px 14px 20px 16px;
      border: 3px solid rgba(74, 144, 217, 0.28);
      background: linear-gradient(165deg, rgba(255,255,255,0.95), rgba(255,249,240,0.92));
      min-height: 8rem;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
    }
    .notes-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      color: #1a237e;
    }
    .note-line {
      font-size: 0.86rem;
      line-height: 1.65;
      margin-bottom: 0.55rem;
      padding: 0.45rem 0.55rem;
      border-radius: 12px;
      border-left: 4px solid var(--now-accent);
      background: rgba(255, 243, 224, 0.55);
    }
    .note-line:last-child { margin-bottom: 0; }
    .fly-clone {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.42rem 0.65rem;
      border-radius: 18px 10px 22px 12px;
      border: 3px solid #5d4037;
      background: linear-gradient(180deg, #fff, #f5f0e6);
      box-shadow: 4px 5px 0 rgba(0,0,0,0.15);
    }
  </style>
  <style>
/* inlined from L03/assets/css/l03-pager.css */
/* 第03讲 · L03 专用底栏周边（底栏条本体见 assets/lesson-screen-16x9.css） */

/* Page05：右侧进度区整体上移，避免压住底栏 */
body.has-lesson-pager .progress-dock {
  bottom: 3.65rem;
}

/* Page07：掌握进度条置于底栏之上 */
body.has-lesson-pager .lesson-progress-chip {
  position: fixed;
  right: 0.65rem;
  bottom: 3.65rem;
  z-index: 199;
  max-width: min(92vw, 340px);
  text-align: right;
  font-size: 0.76rem;
  font-weight: 800;
  color: #37474f;
  line-height: 1.35;
  pointer-events: none;
}

</style>
  <style>
/* inlined from L03/assets/css/l03-layout.css */
/*
 * 第03讲 lesson03-page01 ~ page15：主区在父级内铺满
 * 视口级 16:9 舞台由 assets/lesson-screen-16x9.css 统一控制；此处不再限制 max-width。
 */
#shakeHost,
.book,
.page-wrap,
.desk,
.wrap {
  margin-left: auto;
  margin-right: auto;
  width: 100%;
  max-width: none;
  box-sizing: border-box;
}

  max-width: none;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
}

  <style>
/* inlined from assets/lesson-screen-16x9.css */
/**
 * Lesson 01 / 02 / 03 / 05 统一大屏布局 + 统一字体/字号
 * 桌面端（约平板横屏以上）：主舞台为视口内最大内接 16:9 矩形，四边留白最小；背景仅露窄边。
 * 字体：系统无衬线 + 雅黑/苹方/思源黑体，保证课堂可读；英文例句与中文同一栈，仅字号放大。
 * 各课 HTML 于 head 末引入外部样式表 lesson-screen-16x9.css（勿在本注释中写尖括号 link 标签，以免内联进 HTML 后被误匹配）
 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);

  <script>
  (function () {
    "use strict";

    const SUBJECT_POOL = [
      { id: "s1", text: "I", type: "was" },
      { id: "s2", text: "He", type: "was" },
      { id: "s3", text: "She", type: "was" },
      { id: "s4", text: "It", type: "was" },
      { id: "s5", text: "Confucius", type: "was", note: "孔子(成都中考常考单数)" },
      { id: "s6", text: "The weather", type: "was" },
      { id: "s7", text: "We", type: "were" },
      { id: "s8", text: "You", type: "were" },
      { id: "s9", text: "They", type: "were" },
      { id: "s10", text: "My family", type: "were", note: "强调家庭成员时复数" }
    ];

    const SENTENCE_CORPUS = {
      "I": "I was only five years old in this photo.",
      "He": "He was at a summer camp last July.",
      "She": "She was not at home yesterday.",
      "It": "It was a wonderful day!",
      "Confucius": "Confucius was a great teacher in ancient China.",
      "The weather": "The weather was sunny and hot.",
      "We": "We were very tired but happy after the trip.",
      "You": "Were you excited to share your experience?",
      "They": "They were at the beach last Sunday.",
      "My family": "My family were at the beach making sandcastles."
    };

    const NOTE1 = "发现 1：单数主语（我、他、她、它）的能量，会让 Be 动词聚合成 was。";
    const NOTE2 = "发现 2：在过去时里，复数主语和 you 召唤 were（对照：现在时 you 用 are）。";
    const NOTE3 = "发现 3：成都中考陷阱：Confucius（孔子）是单数用 was；My family（强调家人们）作复数用 were！";

    var poolEl = document.getElementById("pool");
    var subjectBay = document.getElementById("subjectBay");
    var bayPlaceholder = document.getElementById("bayPlaceholder");
    var bayContent = document.getElementById("bayContent");
    var slotText = document.getElementById("slotText");
    var slotNote = document.getElementById("slotNote");
    var sentencePlaceholder = document.getElementById("sentencePlaceholder");
    var sentenceBox = document.getElementById("sentenceBox");
    var sentenceLine = document.getElementById("sentenceLine");
    var notesMount = document.getElementById("notesMount");
    var attemptBadge = document.getElementById("attemptBadge");

    var ttsBusy = false;
    var attemptCount = 0;
    var currentSubjectId = null;
    var note1 = false, note2 = false, note3 = false;

    function setTtsLock(on) {
      ttsBusy = on;
      document.body.classList.toggle("tts-lock", on);
      var cards = poolEl.querySelectorAll(".pool-card");
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.toggle("is-busy", on);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlightBe(sentence) {
      var t = escapeHtml(sentence);
      t = t.replace(/\b(was|were)\b/gi, function (m) {
        return '<span class="hl">' + m + "</span>";
      });
      return t;
    }

    function speakSentence(text) {
      return new Promise(function (resolve) {
        if (!window.L03AzureTTS || !window.L03AzureTTS.isReady()) {
          resolve();
          return;
        }
        window.L03AzureTTS.speak(text, { rate: "-5%" }).then(resolve).catch(resolve);
      });
    }

    function typewriterInto(el, text, speedMs) {
      el.textContent = "";
      var i = 0;
      var timer = setInterval(function () {
        i++;
        if (i > text.length) {
          clearInterval(timer);
          el.textContent = text;
          return;
        }
        el.textContent = text.slice(0, i);
      }, speedMs || 22);
    }

    function appendNote(htmlEmojiPrefix, bodyText) {
      var div = document.createElement("div");
      div.className = "note-line";
      notesMount.appendChild(div);
      typewriterInto(div, htmlEmojiPrefix + bodyText, 20);
    }

    function checkNotesAfterPlace(sub) {
      var delay = 0;
      function schedule(body) {
        var ms = delay;
        delay += 2600;
        setTimeout(function () {
          appendNote("💡 ", body);
        }, ms);
      }
      if (sub.type === "was" && !note1) {
        note1 = true;
        schedule(NOTE1);
      }
      if (sub.type === "were" && !note2) {
        note2 = true;
        schedule(NOTE2);
      }
      if ((sub.text === "Confucius" || sub.text === "My family") && !note3) {
        note3 = true;
        schedule(NOTE3);
      }
    }

    function flyCardToBay(cardEl, done) {
      var clone = document.createElement("div");
      clone.className = "fly-clone";
      clone.textContent = cardEl.textContent;
      var r = cardEl.getBoundingClientRect();
      clone.style.left = r.left + "px";
      clone.style.top = r.top + "px";
      document.body.appendChild(clone);
      var br = subjectBay.getBoundingClientRect();
      var dx = br.left + br.width / 2 - r.left - r.width / 2;
      var dy = br.top + br.height / 2 - r.top - r.height / 2;
      anime({
        targets: clone,
        translateX: dx,
        translateY: dy,
        scale: [1, 1.05, 0.85],
        duration: 620,
        easing: "easeInOutQuad",
        complete: function () {
          clone.remove();
          if (done) done();
        }
      });
    }

    function selectSubject(sub, cardEl) {
      if (ttsBusy) return;
      attemptCount++;
      attemptBadge.textContent = "尝试次数：" + attemptCount;
      currentSubjectId = sub.id;
      poolEl.querySelectorAll(".pool-card").forEach(function (c) {
        c.classList.toggle("is-selected", c.getAttribute("data-id") === sub.id);
      });
      flyCardToBay(cardEl, function () {
        bayPlaceholder.style.display = "none";
        bayContent.style.display = "block";
        slotText.textContent = sub.text;
        slotNote.textContent = sub.note || "";
        var sent = SENTENCE_CORPUS[sub.text] || "";
        sentencePlaceholder.style.display = "none";
        sentenceLine.innerHTML = highlightBe(sent);
        sentenceBox.classList.add("is-on");
        sentenceBox.style.opacity = "0";
        anime({
          targets: sentenceBox,
          opacity: [0, 1],
          translateY: [8, 0],
          duration: 420,
          easing: "easeOutQuad"
        });
        setTtsLock(true);
        speakSentence(sent).then(function () {
          setTtsLock(false);
        });
        checkNotesAfterPlace(sub);
      });
    }

    function buildPool() {
      SUBJECT_POOL.forEach(function (sub) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pool-card";
        btn.setAttribute("data-id", sub.id);
        btn.textContent = sub.text;
        btn.addEventListener("click", function () {
          selectSubject(sub, btn);
        });
        btn.setAttribute("draggable", "true");
        btn.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", sub.id);
          e.dataTransfer.effectAllowed = "copy";
        });
        poolEl.appendChild(btn);
      });
      subjectBay.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
      });
      subjectBay.addEventListener("drop", function (e) {
        e.preventDefault();
        var id = e.dataTransfer.getData("text/plain");
        var sub = SUBJECT_POOL.filter(function (s) {
          return s.id === id;
        })[0];
        var card = poolEl.querySelector('[data-id="' + id + '"]');
        if (sub && card && !ttsBusy) selectSubject(sub, card);
      });
    }

    buildPool();
  })();
  </script>
