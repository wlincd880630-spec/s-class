<style>
    :root {
      --paper: #fff9f0;
      --ink: #2c2c2c;
      --state-blue: #4a90d9;
      --crayon-green: #43a047;
      --crayon-orange: #f0ad4e;
      --crayon-red: #e85d4c;
      --past-deep: #2f6fb7;
      --shadow: rgba(60, 40, 20, 0.14);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 220, 180, 0.5) 0%, transparent 46%),
        radial-gradient(circle at 88% 82%, rgba(200, 230, 255, 0.42) 0%, transparent 44%),
        linear-gradient(165deg, #ffeaa7 0%, #fab1a0 36%, #dfe6e9 100%);
      padding: 0.75rem;
      padding-bottom: 5.5rem;
    }
    body.is-tts .interactive-lock {
      pointer-events: none;
      opacity: 0.92;
    }
    .page-wrap {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }
    .book {
      background: var(--paper);
      border-radius: 10px 32px 14px 24px;
      border: 4px solid var(--crayon-orange);
      box-shadow: 6px 8px 0 var(--crayon-red), 14px 18px 28px var(--shadow);
      padding: 1rem 1.1rem 1.5rem;
      position: relative;
      overflow: visible;
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(200, 160, 100, 0.45);
      border-radius: 6px 24px 10px 8px;
      pointer-events: none;
      z-index: 0;
    }
    .top-bar {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 1.05rem;
      padding: 0.45rem 0.75rem;
      margin-bottom: 0.65rem;
      border-radius: 999px;
      border: 3px solid var(--state-blue);
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,248,230,0.95));
      box-shadow: 2px 3px 0 rgba(0,0,0,0.06);
    }
    .top-bar strong { color: var(--crayon-red); }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 0.35rem;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      font-weight: 700;
      color: var(--past-deep);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.06);
      text-align: center;
    }
    .subtitle {
      position: relative;
      z-index: 1;
      margin: 0 0 1rem;
      font-size: 0.98rem;
      line-height: 1.55;
      text-align: center;
      color: #444;
    }
    /* —— 神秘收音机 —— */
    .radio-shell {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      max-width: 420px;
      padding: 1.35rem 1.25rem 1.15rem;
      border-radius: 28px 36px 32px 30px;
      border: 5px solid #5d4037;
      background:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E"),
        linear-gradient(168deg, #eceff1 0%, #cfd8dc 45%, #b0bec5 100%);
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.35),
        8px 10px 0 rgba(93, 64, 55, 0.25),
        0 12px 28px rgba(0,0,0,0.12);
    }
    .radio-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 2px,
        rgba(255,255,255,0.03) 2px 4px
      );
      mix-blend-mode: overlay;
    }
    .radio-antenna {
      position: absolute;
      top: -52px;
      right: 18%;
      width: 8px;
      height: 56px;
      background: linear-gradient(90deg, #78909c, #546e7a);
      border-radius: 4px;
      border: 2px solid #37474f;
      transform: rotate(8deg);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    }
    .radio-antenna::after {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ef5350, #b71c1c);
      border: 2px solid #5d4037;
    }
    .freq-screen {
      position: relative;
      margin: 0 auto 1rem;
      width: 88%;
      height: 118px;
      border-radius: 14px 18px 16px 14px;
      border: 4px solid #37474f;
      background: linear-gradient(180deg, #1a237e 0%, #0d1642 100%);
      box-shadow: inset 0 0 24px rgba(0,0,0,0.65);
      overflow: hidden;
    }
    .freq-screen.is-playing {
      box-shadow: inset 0 0 24px rgba(0,0,0,0.65), 0 0 22px rgba(74, 144, 217, 0.55);
    }
    .wave-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 12%;
      opacity: 0.55;
      transition: opacity 0.35s ease;
    }
    .freq-screen.is-playing .wave-layer {
      opacity: 1;
    }
    .wave-bar {
      width: 7px;
      border-radius: 99px;
      background: linear-gradient(180deg, #81d4fa, var(--state-blue));
      height: 18%;
      animation: waveIdle 1.2s ease-in-out infinite;
      animation-play-state: paused;
    }
    .freq-screen.is-playing .wave-bar {
      animation-play-state: running;
      animation-name: waveStrong;
      animation-duration: 0.45s;
    }
    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.08s; }
    .wave-bar:nth-child(3) { animation-delay: 0.16s; }
    .wave-bar:nth-child(4) { animation-delay: 0.24s; }
    .wave-bar:nth-child(5) { animation-delay: 0.32s; }
    .wave-bar:nth-child(6) { animation-delay: 0.4s; }
    .wave-bar:nth-child(7) { animation-delay: 0.48s; }
    .wave-bar:nth-child(8) { animation-delay: 0.56s; }
    .wave-bar:nth-child(9) { animation-delay: 0.64s; }
    @keyframes waveIdle {
      0%, 100% { height: 22%; opacity: 0.5; }
      50% { height: 38%; opacity: 0.75; }
    }
    @keyframes waveStrong {
      0%, 100% { height: 20%; transform: scaleY(1); }
      25% { height: 95%; transform: scaleY(1.05); }
      50% { height: 35%; transform: scaleY(0.9); }
      75% { height: 88%; transform: scaleY(1.08); }
    }
    .knob-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-bottom: 0.85rem;
    }
    .knob-wrap {
      position: relative;
      text-align: center;
    }
    .knob-label {
      font-size: 0.88rem;
      margin-bottom: 0.35rem;
      color: #37474f;
    }
    .knob {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 5px solid #5d4037;
      background:
        conic-gradient(from 200deg, #eceff1 0deg, #90a4ae 80deg, #eceff1 160deg, #cfd8dc 100%);
      box-shadow:
        inset 0 0 0 4px rgba(255,255,255,0.4),
        4px 5px 0 rgba(0,0,0,0.2);
      cursor: pointer;
      position: relative;
      transition: transform 0.12s ease-out;
    }
    .knob:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }
    .knob::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 10px;
      height: 22px;
      margin-left: -5px;
      background: #37474f;
      border-radius: 3px;
      transform-origin: 50% 100%;
      transform: rotate(var(--knob-rot, 0deg));
    }
    .knob.is-tick {
      transform: rotate(calc(var(--knob-rot, 0deg) * 0.08));
    }
    .speaker-grill {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #5d4037;
      background: repeating-radial-gradient(circle at 50% 50%, #78909c 0 3px, #546e7a 3px 6px);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.35);
    }
    .choice-row {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    @media (min-width: 520px) {
      .choice-row { flex-direction: row; }
      .choice-row .crayon-btn { flex: 1; }
    }
    .crayon-btn {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      padding: 0.85rem 1rem;
      border-radius: 999px;
      border: 4px solid #5d4037;
      cursor: pointer;
      box-shadow: 4px 5px 0 rgba(0,0,0,0.18);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      line-height: 1.25;
    }
    .crayon-btn:active:not(:disabled) {
      transform: translate(2px, 3px);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.18);
    }
    .crayon-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .btn-now {
      background: linear-gradient(180deg, #a5d6a7, var(--crayon-green));
      color: #1b5e20;
    }
    .btn-past {
      background: linear-gradient(180deg, #90caf9, var(--state-blue));
      color: #0d47a1;
    }
    .replay-row {
      margin: 0 0 0.7rem;
      text-align: center;
    }
    .btn-replay {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      border: 4px solid #5d4037;
      cursor: pointer;
      box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.16);
      background: linear-gradient(180deg, #ffe082, var(--crayon-orange));
      color: #4e342e;
      min-width: 11rem;
    }
    .btn-replay:active:not(:disabled) {
      transform: translate(2px, 3px);
      box-shadow: 1px 2px 0 rgba(0, 0, 0, 0.16);
    }
    .btn-replay:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }
    /* 纸带 */
    .tape-slot {
      position: relative;
      margin: 1rem auto 0;
      max-width: 420px;
      min-height: 0;
      perspective: 600px;
    }
    .paper-tape {
      display: none;
      margin: 0 auto;
      max-width: 100%;
      padding: 0.75rem 1rem 0.85rem;
      border-radius: 4px 4px 12px 12px;
      background: linear-gradient(180deg, #fffef7 0%, #f5f0e6 100%);
      border: 3px dashed rgba(121, 85, 72, 0.45);
      box-shadow: 0 8px 0 rgba(93, 64, 55, 0.2), 0 12px 20px rgba(0,0,0,0.1);
      transform-origin: top center;
      animation: tapeEject 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .paper-tape.is-visible {
      display: block;
    }
    @keyframes tapeEject {
      0% {
        opacity: 0;
        transform: translateY(-28px) rotateX(-12deg) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
      }
    }
    .tape-sentence {
      font-size: 1.28rem;
      line-height: 1.45;
      min-height: 2.6em;
      word-break: break-word;
    }
    .tape-sentence .hl-was {
      color: var(--state-blue);
      font-weight: 800;
      text-decoration: underline wavy rgba(74, 144, 217, 0.5);
      text-underline-offset: 3px;
    }
    .tape-sentence .hl-is {
      color: var(--crayon-green);
      font-weight: 800;
    }
    .tape-meta {
      margin-top: 0.45rem;
      font-size: 0.92rem;
      color: #6d4c41;
      min-height: 1.4em;
    }
    .feedback-line {
      margin-top: 0.65rem;
      font-size: 1.05rem;
      line-height: 1.5;
      min-height: 1.5em;
      color: var(--crayon-red);
    }
    .feedback-line.ok {
      color: #2e7d32;
    }
    .hint-strip {
      margin-top: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.55;
      color: #555;
      text-align: center;
    }
    .interactive-lock { position: relative; z-index: 2; }

/**
 * Lesson 01 / 02 / 03 / 05 统一大屏布局 + 统一字体/字号
 * 桌面端（约平板横屏以上）：主舞台为视口内最大内接 16:9 矩形，四边留白最小；背景仅露窄边。

 * 各课 HTML 于 head 末引入外部样式表 lesson-screen-16x9.css（勿在本注释中写尖括号 link 标签，以免内联进 HTML 后被误匹配）
 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);
  --lesson-fs-btn: clamp(0.9rem, 0.36vw + 0.8rem, 1.02rem);
  /* 英文例句 / 展示行：明显大于正文 */
  --lesson-fs-example: clamp(1.05rem, 0.58vw + 0.9rem, 1.32rem);
  --lesson-fs-en-line: var(--lesson-fs-example);
}

/* 主舞台内子元素默认继承字体，压过各页内联里的 Patrick / ZCOOL（后文对 .en / [lang=en] / 例句容器再单独放大） */
html body .book *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .shell *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .app *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .page-wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .desk *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body main.sheet *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en) {
  font-family: inherit;
}

html {
  height: 100%;
  font-size: var(--lesson-fs-html);
}

body {
  --lesson-s-t: env(safe-area-inset-top, 0px);
  --lesson-s-b: env(safe-area-inset-bottom, 0px);
  --lesson-s-l: env(safe-area-inset-left, 0px);
  --lesson-s-r: env(safe-area-inset-right, 0px);
  /* 底部流式页脚（L01/L02 等）预留高度，避免主舞台 + 页脚超出视口 */
  --lesson-foot-h: 0px;
  /* 固定底栏占位（L01/L02/L03/L05 统一） */
  --lesson-pager-gap: 2.35rem;
  --lesson-l03-pager-gap: var(--lesson-pager-gap);
  /* 讲义页顶栏工具条粗略高度（打印条 + 可选姓名栏等） */
  --lesson-handout-chrome: 0px;

  margin: 0 !important;
  min-height: 100dvh !important;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

}

body:has(> .handout-pdf-bar):has(> main.sheet) {

  padding: var(--lesson-s-t) var(--lesson-s-r) var(--lesson-s-b) var(--lesson-s-l) !important;

}

;(function () {
  "use strict";

  var state = {
    audio: null,
    requestId: 0,
    missing: {}
  };

  function manifestEntries() {
    if (!window.L03AudioManifest || !window.L03AudioManifest.entries) return null;
    return window.L03AudioManifest.entries;
  }

  function normalizeText(s) {
    return String(s || "").replace(/\s+/g, " ").trim();
  }

  function mapRateToPlayback(rateVal, slow) {
    if (slow) return 0.72;
    if (typeof rateVal === "string" && /%$/.test(rateVal)) {
      var n = parseFloat(rateVal);
      if (!Number.isNaN(n)) {
        var r = 1 + n / 100;
        if (r < 0.55) r = 0.55;
        if (r > 1.4) r = 1.4;
        return r;
      }
    }
    if (typeof rateVal === "number" && isFinite(rateVal)) {
      if (rateVal < 0.55) return 0.55;
      if (rateVal > 1.4) return 1.4;
      return rateVal;
    }
    return 0.92;
  }

  function resolveAudioPath(text) {
    var entries = manifestEntries();
    if (!entries) return "";
    var t1 = String(text || "");
    if (entries[t1]) return entries[t1];
    var t2 = normalizeText(t1);
    if (entries[t2]) return entries[t2];
    return "";
  }

  function stop() {
    state.requestId++;
    if (state.audio) {
      try {
        state.audio.pause();
        state.audio.currentTime = 0;
        state.audio.src = "";
      } catch (e) {}
      state.audio = null;
    }
  }

  function speak(text, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var line = normalizeText(text);
      if (!line) {
        resolve();
        return;
      }
      var src = resolveAudioPath(line);
      if (!src) {
        if (!state.missing[line]) {
          state.missing[line] = true;
          console.warn("[L03 Audio Missing]", line);
        }
        resolve();
        return;
      }

      stop();
      var id = state.requestId;
      if (typeof window.playLocalMp3Url === "function") {

        return window.playLocalMp3Url(src, { playbackRate: mapRateToPlayback(opts.rate, opts.slow) }).then(function (ok) {

          if (!ok) console.warn("[LessonAudio] 本地 MP3 播放失败:", src);

          resolve();

        });

      }

      if (typeof window.playLocalMp3Url === "function") {


        return window.playLocalMp3Url(src).then(function (ok) {


          if (!ok) console.warn("[LessonAudio] 本地 MP3 播放失败:", src);


          resolve();


          return;


        });


      }


      if (typeof window.playLocalMp3Url === "function") {



        return window.playLocalMp3Url(src).then(function (ok) {



          if (!ok) console.warn("[LessonAudio] 本地 MP3 播放失败:", src);



          resolve();



          return;



        });



      }



      var a = new Audio(src);
      a.playbackRate = mapRateToPlayback(opts.rate, opts.slow);
      state.audio = a;

      var done = false;
      function fin() {
        if (done) return;
        done = true;
        if (state.audio === a) state.audio = null;
        resolve();
      }
      a.onended = fin;
      a.onerror = fin;
      var p = a.play();
      if (p && typeof p.catch === "function") p.catch(fin);
      window.setTimeout(function () {
        if (id !== state.requestId) return;
        fin();
      }, 20000);
    });
  }

  function isReady() {
    return !!manifestEntries();
  }

  window.L03AzureTTS = {
    speak: speak,
    stop: stop,
    configure: function () {},
    isReady: isReady
  };
})();

  <script>
  (function () {
    "use strict";

    /** 前 4 句可优先读取本地 mp3，其余自动走 Azure TTS */
    const AUDIO_CORPUS = [
      { text: "The weather was cloudy yesterday.", type: "past", key: "was", source: "人教八上 U1", audio: "assets/audio/l03-p02-corpus-00.mp3" },
      { text: "They were at the beach last Sunday.", type: "past", key: "were", source: "2018成都中考", audio: "assets/audio/l03-p02-corpus-01.mp3" },
      { text: "Confucius was a great teacher.", type: "past", key: "was", source: "2020成都中考", audio: "assets/audio/l03-p02-corpus-02.mp3" },
      { text: "The weather is sunny today.", type: "now", key: "is", source: "人教八上 U1", audio: "assets/audio/l03-p02-corpus-03.mp3" },
      { text: "I was in the countryside with my grandparents last summer.", type: "past", key: "was", source: "成都A卷仿真" },
      { text: "Our class was not quiet during the break.", type: "past", key: "was", source: "课堂语境" },
      { text: "The old bridge was very famous years ago.", type: "past", key: "was", source: "写景语境" },
      { text: "You were excited to share your experience.", type: "past", key: "were", source: "课内迁移" },
      { text: "My parents were proud of my progress last term.", type: "past", key: "were", source: "家庭语境" },
      { text: "They were at the museum this morning.", type: "past", key: "were", source: "研学语境" },
      { text: "It is a good time to review grammar now.", type: "now", key: "is", source: "课堂提示" },
      { text: "The school gate is open today.", type: "now", key: "is", source: "校园语境" }
    ];

    var corpusAudioEl = null;

    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    var ctx = null;

    function getCtx() {
      if (!AudioCtx) return null;
      if (!ctx) ctx = new AudioCtx();
      return ctx;
    }

    function playClick() {
      var c = getCtx();
      if (!c) return;
      if (c.state === "suspended") c.resume();
      var t0 = c.currentTime;
      var osc = c.createOscillator();
      var g = c.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(420, t0);
      osc.frequency.exponentialRampToValueAtTime(120, t0 + 0.04);
      g.gain.setValueAtTime(0.12, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + 0.07);
    }

    function playCheer() {
      var c = getCtx();
      if (!c) return;
      if (c.state === "suspended") c.resume();
      var t0 = c.currentTime;
      var freqs = [523.25, 659.25, 783.99, 1046.5];
      freqs.forEach(function (f, i) {
        var osc = c.createOscillator();
        var g = c.createGain();
        osc.type = "triangle";
        osc.frequency.value = f;
        var start = t0 + i * 0.07;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(0.11, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(start);
        osc.stop(start + 0.3);
      });
    }

    function playStatic(durationSec) {
      var c = getCtx();
      if (!c) return;
      if (c.state === "suspended") c.resume();
      var dur = durationSec || 0.55;
      var bufferSize = c.sampleRate * dur;
      var buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.85;
      }
      var noise = c.createBufferSource();
      noise.buffer = buffer;
      var filter = c.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1800;
      filter.Q.value = 0.6;
      var g = c.createGain();
      g.gain.value = 0.35;
      noise.connect(filter);
      filter.connect(g);
      g.connect(c.destination);
      noise.start();
      noise.stop(c.currentTime + dur);
    }

    var knob = document.getElementById("knobBtn");
    var freqScreen = document.getElementById("freqScreen");
    var btnNow = document.getElementById("btnNow");
    var btnPast = document.getElementById("btnPast");
    var btnReplay = document.getElementById("btnReplay");
    var paperTape = document.getElementById("paperTape");
    var tapeSentence = document.getElementById("tapeSentence");
    var tapeMeta = document.getElementById("tapeMeta");
    var feedbackLine = document.getElementById("feedbackLine");
    var statStrip = document.getElementById("statStrip");

    var knobRotation = 0;
    var current = null;
    var phase = "idle";
    var ttsBusy = false;
    var roundOrder = [];
    var roundPtr = 0;
    var solvedTotal = 0;
    var solvedCorrect = 0;

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function refillRoundOrder() {
      roundOrder = shuffle(
        AUDIO_CORPUS.map(function (_, i) {
          return i;
        })
      );
      roundPtr = 0;
    }

    function updateStatStrip() {
      var acc = solvedTotal ? Math.round((solvedCorrect / solvedTotal) * 100) + "%" : "--";
      var doneInRound = Math.min(roundPtr, AUDIO_CORPUS.length);
      statStrip.textContent =
        "本轮已练 " + doneInRound + " / " + AUDIO_CORPUS.length + " 句 · 正确 " + solvedCorrect + " 句 · 准确率 " + acc;
    }

    function refreshControls() {
      document.body.classList.toggle("is-tts", ttsBusy);
      freqScreen.classList.toggle("is-playing", ttsBusy);
      knob.disabled = ttsBusy || phase === "awaiting" || phase === "revealed";
      btnNow.disabled = ttsBusy || phase !== "awaiting";
      btnPast.disabled = ttsBusy || phase !== "awaiting";
      btnReplay.disabled =
        !current || ttsBusy || phase === "playing" || phase === "revealed";
    }

    function setTtsBusy(on) {
      ttsBusy = on;
      refreshControls();
    }

    function randomItem() {
      if (!roundOrder.length || roundPtr >= roundOrder.length) refillRoundOrder();
      var idx = roundOrder[roundPtr++];
      return AUDIO_CORPUS[idx];
    }

    function stopCorpusAudio() {
      if (corpusAudioEl) {
        corpusAudioEl.pause();
        corpusAudioEl.currentTime = 0;
        corpusAudioEl.src = "";
        corpusAudioEl.load();
        corpusAudioEl = null;
      }
    }

    function speakAzureTts(text) {
      return new Promise(function (resolve) {
        if (!window.L03AzureTTS || !window.L03AzureTTS.isReady()) {
          resolve();
          return;
        }
        window.L03AzureTTS.speak(text, { rate: "-5%" }).then(resolve).catch(resolve);
      });
    }

    /** 优先本地 MP3（Azure 预生成），失败则 Azure TTS 接口 */
    function playCorpusLine(item) {
      return new Promise(function (resolve) {
        stopCorpusAudio();
        var url = item && item.audio;
        if (!url) {
          speakAzureTts(item.text).then(resolve);
          return;
        }
        var a = new Audio(url);
        corpusAudioEl = a;
        var done = false;
        function fin() {
          if (done) return;
          done = true;
          corpusAudioEl = null;
          resolve();
        }
        a.addEventListener("ended", fin, { once: true });
        a.addEventListener(
          "error",
          function () {
            corpusAudioEl = null;
            speakAzureTts(item.text).then(fin);
          },
          { once: true }
        );
        var p = a.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {
            speakAzureTts(item.text).then(fin);
          });
        }
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildHighlightedHtml(text, corpusType) {
      var t = escapeHtml(text);
      if (corpusType === "past") {
        t = t.replace(/\b(was|were)\b/gi, function (m) {
          return '<span class="hl-was">' + m + "</span>";
        });
      } else {
        t = t.replace(/\b(is)\b/gi, function (m) {
          return '<span class="hl-is">' + m + "</span>";
        });
      }
      return t;
    }

    function typewriterHtml(el, html, speedMs, done) {
      el.innerHTML = "";
      var i = 0;
      var plain = html.replace(/<[^>]+>/g, "");
      var timer = window.setInterval(function () {
        i++;
        if (i > plain.length) {
          window.clearInterval(timer);
          el.innerHTML = html;
          if (done) done();
          return;
        }
        var slice = plain.slice(0, i);
        el.textContent = slice;
      }, speedMs);
    }

    function typewriterText(el, text, speedMs, done) {
      el.textContent = "";
      var i = 0;
      var timer = window.setInterval(function () {
        i++;
        if (i > text.length) {
          window.clearInterval(timer);
          el.textContent = text;
          if (done) done();
          return;
        }
        el.textContent = text.slice(0, i);
      }, speedMs);
    }

    function resetTapeUi() {
      paperTape.hidden = true;
      paperTape.classList.remove("is-visible");
      tapeSentence.innerHTML = "";
      tapeMeta.textContent = "";
      feedbackLine.textContent = "";
      feedbackLine.className = "feedback-line";
    }

    knob.addEventListener("click", function () {
      if (ttsBusy) return;
      if (phase === "awaiting") return;
      resetTapeUi();
      stopCorpusAudio();
      if (window.L03AzureTTS) window.L03AzureTTS.stop();
      current = randomItem();
      phase = "playing";
      knobRotation += 47 + Math.random() * 40;
      knob.style.setProperty("--knob-rot", knobRotation + "deg");
      knob.classList.add("is-tick");
      window.setTimeout(function () { knob.classList.remove("is-tick"); }, 140);
      playClick();
      setTtsBusy(true);
      playCorpusLine(current).then(function () {
        phase = "awaiting";
        setTtsBusy(false);
      });
    });

    btnReplay.addEventListener("click", function () {
      if (!current || ttsBusy || phase === "playing" || phase === "revealed") return;
      playClick();
      setTtsBusy(true);
      playCorpusLine(current).then(function () {
        setTtsBusy(false);
      });
    });

    function reveal(guessType) {
      if (!current || phase !== "awaiting") return;
      phase = "revealed";
      refreshControls();

      var ok = guessType === current.type;
      solvedTotal++;
      if (ok) solvedCorrect++;
      updateStatStrip();
      var html = buildHighlightedHtml(current.text, current.type);

      paperTape.hidden = false;
      paperTape.classList.add("is-visible");

      typewriterHtml(tapeSentence, html, 28, function () {
        if (ok) playCheer();
        typewriterText(tapeMeta, "出处：" + current.source, 22, function () {
          if (ok) {
            feedbackLine.className = "feedback-line ok";
            typewriterText(feedbackLine, "太棒了！耳朵抓到 Be 动词的分身了！", 24, function () {
              phase = "idle";
              refreshControls();
            });
          } else {
            playStatic(0.65);
            feedbackLine.className = "feedback-line";
            typewriterText(feedbackLine, "侦探，再仔细听听那个 Be 动词的分身！", 22, function () {
              phase = "idle";
              refreshControls();
            });
          }
        });
      });
    }

    btnNow.addEventListener("click", function () { reveal("now"); });
    btnPast.addEventListener("click", function () { reveal("past"); });
    refillRoundOrder();
    updateStatStrip();
  })();
