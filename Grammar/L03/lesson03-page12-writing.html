  <style>
    :root {
      --paper: #fff9f0;
      --ink: #2c2c2c;
      --crayon-purple: #9b59b6;
      --shadow: rgba(60, 40, 20, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(165deg, #2c3e50 0%, #4a6572 45%, #b0bec5 100%);
      color: var(--ink);
      padding: 0.55rem;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    .top-bar { font-size: 0.8rem; font-weight: 800; color: #eceff1; margin-bottom: 0.3rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.15rem; color: #fffde7; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 0.65rem;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .board, .screen {
      background: var(--paper);
      border: 4px solid #5d4037;
      border-radius: 18px;
      padding: 0.75rem;
      box-shadow: 6px 8px 0 var(--shadow);
    }
    .poster {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-bottom: 0.55rem;
    }
    .poster button {
      font-family: inherit;
      font-weight: 900;
      border-radius: 14px;
      border: 3px solid #5d4037;
      padding: 0.55rem 0.35rem;
      cursor: pointer;
      font-size: 0.78rem;
      line-height: 1.35;
      background: linear-gradient(180deg, #ffe082, #ffb74d);
    }
    .poster button:disabled { opacity: 0.45; cursor: default; }
    .step-title { font-weight: 900; margin: 0.35rem 0; color: #1a237e; font-size: 0.88rem; }
    .opt {
      width: 100%;
      text-align: left;
      margin-bottom: 0.35rem;
      padding: 0.45rem 0.5rem;
      border-radius: 12px;
      border: 2px solid rgba(93, 64, 55, 0.35);
      background: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .opt:hover { border-color: #5d4037; }
    .screen {
      min-height: 280px;
      position: relative;
      overflow: hidden;
    }
    .screen-inner {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.75;
      color: #222;
    }
    .vb { color: var(--crayon-purple); font-weight: 800; }
    .marquee {
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      pointer-events: none;
      opacity: 0;
      box-shadow: inset 0 0 0 0 rgba(255, 193, 7, 0);
    }
    .marquee.on {
      opacity: 1;
      animation: march 1.8s linear infinite;
    }
    @keyframes march {
      0% { box-shadow: inset 0 0 0 3px rgba(255, 193, 7, 0.65); }
      50% { box-shadow: inset 0 0 0 6px rgba(255, 152, 0, 0.45); }
      100% { box-shadow: inset 0 0 0 3px rgba(255, 193, 7, 0.65); }
    }
    .film.on .screen-inner { filter: sepia(0.25) contrast(1.05); }
    .toolbar { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .toolbar button {
      font-family: inherit;
      font-weight: 900;
      border-radius: 999px;
      border: 3px solid #5d4037;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      background: #eceff1;
    }
    .note {
      margin-top: 0.45rem;
      padding: 0.5rem;
      border-radius: 12px;
      background: rgba(232, 245, 233, 0.95);
      border: 2px dashed #43a047;
      font-size: 0.82rem;
      display: none;
    }
    .note.on { display: block; }

  <style>
/* inlined from assets/lesson-screen-16x9.css */
/**
 * Lesson 01 / 02 / 03 / 05 统一大屏布局 + 统一字体/字号
 * 桌面端（约平板横屏以上）：主舞台为视口内最大内接 16:9 矩形，四边留白最小；背景仅露窄边。
 * 字体：系统无衬线 + 雅黑/苹方/思源黑体，保证课堂可读；英文例句与中文同一栈，仅字号放大。
 * 各课 HTML 于 head 末引入外部样式表 lesson-screen-16x9.css（勿在本注释中写尖括号 link 标签，以免内联进 HTML 后被误匹配）
 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);
  --lesson-fs-btn: clamp(0.9rem, 0.36vw + 0.8rem, 1.02rem);
  /* 英文例句 / 展示行：明显大于正文 */
  --lesson-fs-example: clamp(1.05rem, 0.58vw + 0.9rem, 1.32rem);
  --lesson-fs-en-line: var(--lesson-fs-example);
}

/* 主舞台内子元素默认继承字体，压过各页内联里的 Patrick / ZCOOL（后文对 .en / [lang=en] / 例句容器再单独放大） */
html body .book *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .shell *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .app *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .page-wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .desk *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body main.sheet *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en) {
  font-family: inherit;
}

html {
  height: 100%;
  font-size: var(--lesson-fs-html);
}

body {
  --lesson-s-t: env(safe-area-inset-top, 0px);
  --lesson-s-b: env(safe-area-inset-bottom, 0px);
  --lesson-s-l: env(safe-area-inset-left, 0px);
  --lesson-s-r: env(safe-area-inset-right, 0px);
  /* 底部流式页脚（L01/L02 等）预留高度，避免主舞台 + 页脚超出视口 */
  --lesson-foot-h: 0px;
  /* 固定底栏占位（L01/L02/L03/L05 统一） */
  --lesson-pager-gap: 2.35rem;
  --lesson-l03-pager-gap: var(--lesson-pager-gap);
  /* 讲义页顶栏工具条粗略高度（打印条 + 可选姓名栏等） */
  --lesson-handout-chrome: 0px;

  margin: 0 !important;
  min-height: 100dvh !important;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--lesson-font-zh);
  line-height: 1.55;
}

body:has(> .handout-pdf-bar):has(> main.sheet) {
  --lesson-handout-chrome: 3.75rem;
  justify-content: flex-start;
}

body.has-lesson-pager:has(> main.sheet) {
  --lesson-handout-chrome: 8.5rem;
  justify-content: flex-start;
}

/* 去掉各页内联的 body 大留白；L03 单独处理底栏 */
body:not(.has-lesson-pager) {
  padding: var(--lesson-s-t) var(--lesson-s-r) var(--lesson-s-b) var(--lesson-s-l) !important;
}

body.has-lesson-pager {
  padding-top: max(4px, var(--lesson-s-t)) !important;
  padding-left: max(4px, var(--lesson-s-l)) !important;
  padding-right: max(4px, var(--lesson-s-r)) !important;
  padding-bottom: max(var(--lesson-pager-gap, 2.35rem), var(--lesson-s-b)) !important;
}

/* —— 全讲统一「页间导航」：固定底栏（与 L03 lesson-pager 视觉一致，兼容旧 class 名） —— */
body.has-lesson-pager nav.lesson-pager,

  border-top: 3px solid #5d4037;

  font-family: var(--lesson-font-zh);
}

body.has-lesson-pager nav.lesson-pager a,

body.has-lesson-pager nav.footer-nav a,
body.has-lesson-pager div.footer-nav a,
body.has-lesson-pager nav.lesson-footer-nav > span:not(.nav-sep),

          (typeof window !== "undefined" && window.__AZURE_TTS_KEY__) ||
          "";
        if (!key) {
          return Promise.reject(
            new Error(
              "[LessonSpeak] 离线无音频：请补全 assets/tts-mp3 与 manifest，或配置 window.__AZURE_SPEECH_KEY__"
            )
          );
        }
        return speakAzureSsml(t, lang);
      });
    });
  }

  function playEnglish(text) {
    return playText(text, { lang: "en-US" });
  }

  window.LessonSpeak = {
    norm: norm,
    playText: playText,
    playEnglish: playEnglish
  };
})();

</script>

  <script>
  (function () {
    "use strict";

    const STORY_DATA = {
      themeA: {
        title: "A Meaningful Cultural Trip",
        nodes: [
          {
            step: 1,
            label: "起因 (Beginning)",
            options: [
              { text: "Last weekend, our class organized a trip to the Sanxingdui Museum.", verb: "organized", type: "regular" },
              { text: "Last Sunday, I took a bus to the Sanxingdui Museum with my friends.", verb: "took", type: "irregular" }
            ]
          },
          {
            step: 2,
            label: "经过一 (Action 1)",
            options: [
              { text: "The local guide introduced the history of the ancient bronze masks to us.", verb: "introduced", type: "regular" },
              { text: "We saw many amazing ancient treasures in the museum.", verb: "saw", type: "irregular" }
            ]
          },
          {
            step: 3,
            label: "经过二 (Action 2)",
            options: [
              { text: "I experienced the deep charm of traditional Chinese culture.", verb: "experienced", type: "regular" },
              { text: "We bought some special souvenirs for our families.", verb: "bought", type: "irregular" }
            ]
          },
          {
            step: 4,
            label: "感悟 (Ending)",
            options: [
              { text: "Finally, I realized the greatness of our history and felt very proud.", verb: "realized", type: "regular" },
              { text: "In a word, I understood the true meaning of cultural protection.", verb: "understood", type: "irregular" }
            ]
          }
        ]
      },
      themeB: {
        title: "An Unforgettable Volunteer Day",
        nodes: [
          {
            step: 1,
            label: "起因 (Beginning)",
            options: [
              { text: "Yesterday, my classmates and I planned a meaningful charity activity.", verb: "planned", type: "regular" },
              { text: "Last Saturday, we went to the city park to do some volunteer work.", verb: "went", type: "irregular" }
            ]
          },
          {
            step: 2,
            label: "经过一 (Action 1)",
            options: [
              { text: "First, we protected the environment by picking up rubbish along the river.", verb: "protected", type: "regular" },
              { text: "First, we swept the floor and cleaned the public seats.", verb: "swept", type: "irregular" }
            ]
          },
          {
            step: 3,
            label: "经过二 (Action 2)",
            options: [
              { text: "Then, we provided the old people with warm water and help.", verb: "provided", type: "regular" },
              { text: "Then, we threw the waste into the correct recycling bins.", verb: "threw", type: "irregular" }
            ]
          },
          {
            step: 4,
            label: "感悟 (Ending)",
            options: [
              { text: "Although we felt tired, we achieved a lot and smiled happily.", verb: "achieved", type: "regular" },
              { text: "It meant a lot to me because teamwork made everything better.", verb: "meant", type: "irregular" }
            ]
          }
        ]
      }
    };

    var themeKey = null;
    var stepIndex = 0;
    var lines = [];

    function hlVerb(sentence, verb) {
      try {
        var re = new RegExp("\\b" + verb.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
        return sentence.replace(re, function (m) {
          return '<span class="vb">' + m + "</span>";
        });
      } catch (e) {
        return sentence;
      }
    }

    function renderSteps() {
      var mount = document.getElementById("stepMount");
      mount.innerHTML = "";
      if (!themeKey) return;
      var nodes = STORY_DATA[themeKey].nodes;
      if (stepIndex >= nodes.length) return;
      var node = nodes[stepIndex];
      var h = document.createElement("p");
      h.className = "step-title";
      h.textContent = "第 " + node.step + " 幕 · " + node.label;
      mount.appendChild(h);
      node.options.forEach(function (op) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        b.textContent = op.text;
        b.addEventListener("click", function () {
          pickOption(op);
        });
        mount.appendChild(b);
      });
    }

    function typeLine(html, done) {
      var screen = document.getElementById("screen");
      var wrap = document.createElement("p");
      wrap.style.margin = "0 0 0.55rem";
      screen.appendChild(wrap);
      var i = 0;
      var plain = html.replace(/<[^>]+>/g, "");
      function tick() {
        i++;
        if (i > plain.length) {
          wrap.innerHTML = html;
          if (done) done();
          return;
        }
        wrap.textContent = plain.slice(0, i);
        requestAnimationFrame(function () {
          setTimeout(tick, 12);
        });
      }
      tick();
    }

    function pickOption(op) {
      var html = hlVerb(op.text, op.verb) + " ";
      lines.push(op.text);
      typeLine(html, function () {
        stepIndex++;
        if (stepIndex < STORY_DATA[themeKey].nodes.length) {
          renderSteps();
        } else {
          premiere();
        }
      });
    }

    function premiere() {
      document.getElementById("marquee").classList.add("on");
      document.getElementById("film").classList.add("on");
      var note = document.getElementById("note");
      note.classList.add("on");
      note.textContent =
        "🎬 杀青啦！全程锁定紫色（过去式），一篇结构完整、时态统一的中考记叙文就诞生了！下面为你朗读全文。";
      var full = lines.join(" ");
      if (window.LessonSpeak && window.LessonSpeak.playEnglish) {
        window.LessonSpeak.playEnglish(full.replace(/\s+/g, " ").trim());
      }
    }

    function resetAll() {
      themeKey = null;
      stepIndex = 0;
      lines = [];
      document.getElementById("screen").innerHTML = "";
      document.getElementById("marquee").classList.remove("on");
      document.getElementById("film").classList.remove("on");
      document.getElementById("note").classList.remove("on");
      document.querySelectorAll("#posters button").forEach(function (b) {
        b.disabled = false;
      });
      document.getElementById("stepMount").innerHTML = "";
    }

    document.querySelectorAll("#posters button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        resetAll();
        themeKey = btn.getAttribute("data-theme") === "A" ? "themeA" : "themeB";
        document.querySelectorAll("#posters button").forEach(function (b) {
          b.disabled = true;
        });
        document.getElementById("screen").innerHTML =
          "<p style='margin:0 0 0.4rem;font-weight:900;color:#5d4037;'>" + STORY_DATA[themeKey].title + "</p>";
        renderSteps();
      });
    });

    document.getElementById("btnReset").addEventListener("click", resetAll);
  })();
  </script>
