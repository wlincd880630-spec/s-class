  <style>
    :root {
      --paper: #fff9f0;
      --ink: #2c2c2c;
      --habit-green: #43a047;
      --state-blue: #4a90d9;
      --now-accent: #ff8f00;
      --crayon-purple: #9b59b6;
      --crayon-red: #e85d4c;
      --gold-star: #ffc107;
      --shadow: rgba(60, 40, 20, 0.12);
      --wobble: 255px 15px 225px 15px / 15px 225px 15px 255px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 220, 180, 0.42) 0%, transparent 44%),
        radial-gradient(circle at 86% 78%, rgba(200, 230, 255, 0.35) 0%, transparent 42%),
        linear-gradient(168deg, #ffeaa7 0%, #fab1a0 36%, #dfe6e9 100%);
      color: var(--ink);
      padding: 0.75rem;
      padding-bottom: 8.25rem;
    }
    body.is-busy .side-lobby,
    body.is-busy .yesterday-btn,
    body.is-busy .sentence-play-btn {
      pointer-events: none;
      opacity: 0.55;
    }
    .en, .screen-line, .verb-hero, .stamp-ed, .particle, .vh-ch, .conveyor-belt {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .book {
      max-width: 1120px;
      margin: 0 auto;
      background: var(--paper);
      border-radius: var(--wobble);
      border: 3px solid rgba(200, 160, 100, 0.5);
      box-shadow: 6px 8px 0 var(--crayon-red), 14px 18px 28px var(--shadow);
      padding: 1rem 1.05rem 1.35rem;
      position: relative;
      clip-path: polygon(
        0% 1.2%, 3% 0%, 7% 1.5%, 12% 0.3%, 18% 1.1%, 24% 0%, 30% 1.4%, 38% 0.2%, 45% 1%, 52% 0%, 60% 1.3%, 68% 0.4%, 76% 1%, 84% 0%, 92% 1.2%, 100% 0.4%,
        100% 98.8%, 97% 100%, 91% 98.5%, 86% 99.7%, 79% 98.9%, 72% 100%, 65% 98.6%, 57% 99.8%, 48% 99%, 40% 100%, 32% 98.7%, 24% 99.6%, 16% 99%, 8% 100%, 0% 99.2%
      );
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(200, 160, 100, 0.38);
      border-radius: 220px 20px 200px 24px / 18px 210px 22px 240px;
      pointer-events: none;
    }
    .top-bar {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.9rem;
      padding: 0.4rem 0.7rem;
      margin-bottom: 0.5rem;
      border-radius: var(--wobble);
      border: 3px solid var(--state-blue);
      background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(255,248,230,0.95));
    }
    .top-bar strong { color: var(--crayon-red); }
    h1 {
      position: relative;
      z-index: 2;
      margin: 0 0 0.35rem;
      font-size: clamp(1.02rem, 3vw, 1.32rem);
      color: #1a237e;
      text-align: center;
    }
    .subtitle {
      position: relative;
      z-index: 2;
      margin: 0 0 0.75rem;
      font-size: 0.8rem;
      line-height: 1.55;
      text-align: center;
      color: #555;
    }
    .page-layout {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    @media (min-width: 900px) {
      .page-layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .side-lobby {
        flex: 0 0 300px;
        max-width: 320px;
      }
      .print-main { flex: 1; min-width: 0; }
    }
    .side-lobby {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .orb-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }
    .energy-orb {
      flex: 1;
      min-height: 4.5rem;
      border-radius: 999px;
      border: 4px solid #5d4037;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0.45rem 0.35rem;
      line-height: 1.35;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: linear-gradient(165deg, #fff 0%, #e8f5e9 55%, #c8e6c9 100%);
    }
    .energy-orb small { font-size: 0.68rem; font-weight: 700; opacity: 0.85; }
    .energy-orb.irregular {
      background: linear-gradient(165deg, #fff 0%, #f3e5f5 50%, #e1bee7 100%);
    }
    .energy-orb.is-open {
      outline: 3px dashed var(--state-blue);
      outline-offset: 3px;
      transform: translateY(-2px);
    }
    .energy-orb:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
    .orb-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.45s ease, opacity 0.35s ease;
      border-radius: 16px;
      border: 3px solid rgba(200, 160, 100, 0.45);
      background: rgba(255,255,255,0.65);
    }
    .orb-panel.is-open {
      max-height: 340px;
      opacity: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .orb-panel.regular { border-color: rgba(67, 160, 71, 0.55); }
    .orb-panel.irregular { border-color: rgba(155, 89, 182, 0.5); }
    .orb-panel-inner {
      padding: 0.45rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.32rem;
      justify-content: center;
    }
    .verb-pill {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(0.74rem, 1.9vw, 0.9rem);
      font-weight: 800;
      padding: 0.32rem 0.48rem 0.28rem;
      min-height: 2.1rem;
      border-radius: 14px 10px 16px 12px;
      border: 2px solid #5d4037;
      background: linear-gradient(180deg, #fff, #f5f0e6);
      cursor: pointer;
      box-shadow: 2px 3px 0 rgba(0,0,0,0.1);
      position: relative;
    }
    .verb-pill.is-active {
      outline: 3px dashed var(--state-blue);
      outline-offset: 1px;
      background: linear-gradient(180deg, #e3f2fd, #bbdefb);
    }
    .verb-pill.tag-regular { border-color: var(--habit-green); }
    .verb-pill.tag-irregular { border-color: var(--crayon-purple); }
    .verb-pill .tag-mini {
      display: block;
      font-size: 0.58rem;
      font-weight: 700;
      opacity: 0.72;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .print-main { min-width: 0; }
    .conveyor-wrap {
      perspective: 520px;
      margin-bottom: 0.5rem;
    }
    .conveyor-belt {
      height: 22px;
      margin: 0 0.35rem 0.25rem;
      border-radius: 8px;
      border: 2px solid #5d4037;
      background: repeating-linear-gradient(
        90deg,
        #90a4ae 0px,
        #90a4ae 14px,
        #cfd8dc 14px,
        #cfd8dc 28px
      );
      transform: rotateX(28deg);
      transform-origin: center bottom;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
      animation: beltMove 2.2s linear infinite;
      opacity: 0.85;
    }
    @keyframes beltMove {
      from { background-position: 0 0; }
      to { background-position: 56px 0; }
    }
    .screen-wrap {
      border-radius: 22px 16px 24px 18px;
      border: 4px solid #5d4037;
      background: linear-gradient(180deg, #eceff1, #cfd8dc);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5), 5px 6px 0 rgba(0,0,0,0.12);
      padding: 0.55rem;
    }
    .screen-inner {
      border-radius: 16px 12px 18px 14px;
      border: 3px dashed rgba(93, 64, 55, 0.35);
      background: rgba(255, 253, 248, 0.96);
      padding: 0.65rem 0.75rem 0.85rem;
      position: relative;
      overflow: hidden;
      transition: filter 0.55s ease;
    }
    .screen-inner.is-past {
      filter: sepia(0.52) grayscale(0.28) contrast(1.05);
    }
    .screen-inner.is-past::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.65'/%3E%3C/svg%3E");
      z-index: 4;
    }
    .screen-inner.shake {
      animation: screenShake 0.5s ease-out;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      18% { transform: translate(-5px, 3px); }
      36% { transform: translate(5px, -3px); }
      54% { transform: translate(-4px, -2px); }
      72% { transform: translate(4px, 2px); }
    }
    .photo-stack {
      position: relative;
      z-index: 5;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: min(48vw, 320px);
      min-height: 168px;
      height: auto;
      margin: 0 auto 0.35rem;
      border-radius: 14px 12px 16px 14px;
      border: 3px solid #5d4037;
      background: linear-gradient(180deg, #fafafa 0%, #eceff1 55%, #e0e0e0 100%);
      overflow: hidden;
    }
    .photo-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem 0.65rem;
      margin: 0 0 0.5rem;
    }
    .reveal-sentence-btn {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.92rem;
      font-weight: 900;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      border: 3px solid #5d4037;
      background: linear-gradient(180deg, #c8e6c9, #81c784);
      color: #1b5e20;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .reveal-sentence-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }
    .reveal-sentence-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .reveal-sentence-btn.is-done {
      background: linear-gradient(180deg, #e3f2fd, #90caf9);
      color: #0d47a1;
    }
    .photo-zoom-hint {
      font-size: 0.76rem;
      font-weight: 700;
      color: #78909c;
    }
    .photo-stack img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      box-sizing: border-box;
      padding: 0.28rem;
      cursor: zoom-in;
    }
    .photo-stack .img-now {
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
    }
    .photo-stack .img-past {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      filter: sepia(0.4) saturate(0.85) contrast(1.05);
    }
    .photo-stack.is-past-view .img-now {
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: 1;
    }
    .photo-stack.is-past-view .img-past {
      opacity: 1 !important;
      pointer-events: auto !important;
      z-index: 2;
    }
    .img-fallback {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.8rem, 12vw, 4.5rem);
      background: linear-gradient(145deg, #e8f5e9, #fff9c4);
    }
    .img-fallback.is-on { display: flex; }
    .screen-line {
      position: relative;
      z-index: 5;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeRe(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    var TIME_RE =
      /\b(Last\s+(?:week|month|year|Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|night|summer)|Yesterday|yesterday|last\s+(?:night|week|month|year)|finally|in\s+the\s+end|in\s+\d{4}|an\s+hour\s+ago|ago)\b/gi;

    function highlightPresent(sentence, base) {
      var t = escapeHtml(sentence);
      t = t.replace(/\b(usually|often|always|sometimes|every\s+day)\b/gi, function (m) {
        return '<span class="hl-usually">' + m + "</span>";
      });
      var re = new RegExp("\\b" + escapeRe(base) + "\\b", "gi");
      t = t.replace(re, function (m) {
        return '<span class="hl-base">' + m + "</span>";
      });
      return t;
    }

    function highlightPast(sentence, item) {
      var t = escapeHtml(sentence);
      t = t.replace(TIME_RE, function (m) {
        return '<span class="hl-time">' + m + "</span>";
      });
      var reP = new RegExp("\\b" + escapeRe(item.past) + "\\b", item.past === "read" ? "i" : "gi");
      if (item.category === "regular" && item.pastStem && item.pastSuffix) {
        t = t.replace(reP, function () {
          return (
            '<span class="hl-past-verb"><span class="hl-stem">' +
            escapeHtml(item.pastStem) +
            '</span><span class="hl-ed">' +
            escapeHtml(item.pastSuffix) +
            "</span></span>"
          );
        });
      } else {
        t = t.replace(reP, function (m) {
          return '<span class="hl-past-verb is-irregular-past" style="color:var(--crayon-purple)">' + m + "</span>";
        });
      }
      return t;
    }

    function playLowHum() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(110, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(72, ctx.currentTime + 0.35);
        g.gain.setValueAtTime(0.06, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.46);
      } catch (e) {}
    }

    function playStampThud() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(95, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.18, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        o.connect(g);
        g.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.16);
      } catch (e) {}
    }

    function speakLine(text, token) {
      return new Promise(function (resolve) {
        if (token !== speakToken) {
          resolve();
          return;
        }
        if (!window.L03AzureTTS || !window.L03AzureTTS.isReady()) {
          resolve();
          return;
        }
        if (btnPlaySentence) btnPlaySentence.classList.add("is-playing");
        window.L03AzureTTS
          .speak(text, { rate: SLOW_RATE, slow: true })
          .then(function () {
            if (btnPlaySentence && token === speakToken) {
              btnPlaySentence.classList.remove("is-playing");
            }
            resolve();
          })
          .catch(function () {
            if (btnPlaySentence) btnPlaySentence.classList.remove("is-playing");
            resolve();
          });
      });
    }

      } else {
        photoStack.classList.remove("is-past-view");
        imgNowEl.style.pointerEvents = "auto";
        imgPastEl.style.pointerEvents = "none";
      }
    }

    function openActivePhotoLightbox() {
      if (imgFail) return;
      var img = isPast ? imgPastEl : imgNowEl;
      if (!img) return;
      var src = img.currentSrc || img.src;
      if (!src) return;
      if (typeof window.openLessonImageLightbox === "function") {
        img.removeAttribute("data-no-lightbox");
        try {
          window.openLessonImageLightbox(img);
        } finally {
          img.setAttribute("data-no-lightbox", "1");
        }
        return;
      }
      // fallback：直接构建简易放大层
      var lb = document.getElementById("lesson-img-lightbox");
      if (!lb) return;
      var big = lb.querySelector(".lesson-img-lightbox-img");
      var capEl = lb.querySelector(".lesson-img-lightbox-caption");
      if (big) {
        big.src = src;
        big.alt = img.alt || "";
      }
      if (capEl) {
        capEl.textContent = img.alt || "";
        capEl.hidden = !img.alt;
      }
      lb.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function setupImagesForCurrent() {
      imgFail = false;
      imgFallback.classList.remove("is-on");
      imgNowEl.style.display = "";
      imgPastEl.style.display = "";
      var basePath = resolveP05ImageBase();
      var errOnce = false;
      function onErr() {
        if (errOnce) return;
        errOnce = true;
        imgFail = true;
        imgNowEl.style.display = "none";
        imgPastEl.style.display = "none";
        imgFallback.textContent = EMOJI_FALLBACK[current.base] || "📖";
        imgFallback.classList.add("is-on");
      }
      imgNowEl.onerror = onErr;
      imgPastEl.onerror = onErr;
      imgNowEl.src = basePath + current.imgNow;
      imgPastEl.src = basePath + current.imgPast;
      anime.remove([imgNowEl, imgPastEl]);
      imgNowEl.style.opacity = "1";
      imgPastEl.style.opacity = "0";
      syncPhotoViewMode();
    }


    function revealDiscovery() {
      if (discoveryRevealed) return;
      discoveryRevealed = true;
      applyDiscoveryUI();
      refreshScreen();
    }

    function runPhotoCrossfade(cb) {
      anime.remove([imgNowEl, imgPastEl]);
      syncPhotoViewMode();
      if (imgFail) {
        imgFallback.style.filter = "sepia(0.5)";
        if (cb) cb();
        return;
      }
      anime({
        targets: imgNowEl,
        opacity: [1, 0],
        duration: 550,
        easing: "easeInOutQuad"
      });
      anime({
        targets: imgPastEl,
        opacity: [0, 1],
        duration: 550,
        easing: "easeInOutQuad",
        complete: function () {
          syncPhotoViewMode();
          if (cb) cb();
        }
      });
    }

    function updateGoldKey() {
      if (isPast) {
        goldKey.hidden = false;
        goldSrc.textContent = "「" + current.source + "」";
        goldNote.textContent = current.note;
      } else {
        goldKey.hidden = true;
        goldSrc.textContent = "";
        goldNote.textContent = "";
      }
    }

    function refreshScreen() {
      screenInner.classList.toggle("is-past", isPast);
      if (!discoveryRevealed && !isPast) {
        screenSentence.innerHTML = "";
        delete screenSentence.dataset.ghWordsWrapped;
        verbHero.textContent = current.base;
        verbHero.classList.remove("is-irregular-past");
        updateGoldKey();
        updatePlayButton();
        return;
      }
      if (isPast) {
        screenSentence.innerHTML = highlightPast(current.pastSentence, current);
        verbHero.textContent = current.past;
        verbHero.classList.toggle("is-irregular-past", current.category === "irregular");
      } else {
        screenSentence.innerHTML = highlightPresent(current.baseSentence, current.base);
        verbHero.textContent = current.base;
        verbHero.classList.remove("is-irregular-past");
      }
      applySentenceLookup();
      updateGoldKey();
      updatePlayButton();
    }

    function setPastSentenceOnly() {
      screenInner.classList.add("is-past");
      screenSentence.innerHTML = highlightPast(current.pastSentence, current);
      applySentenceLookup();
      updateGoldKey();
      updatePlayButton();
    }

    function runStampAnimation(cb) {
      stampEd.textContent = "ed";
      stampEd.style.opacity = "1";
      stampEd.style.top = "-120%";
      anime.remove(stampEd);
      anime({
        targets: stampEd,
        top: ["-120%", "42%"],
        opacity: [1, 1],
        scale: [0.4, 1.25, 1],
        rotate: [-12, -4],
        duration: 380,
        easing: "easeInQuad",
        complete: function () {
          screenInner.classList.add("shake");
          playStampThud();
          window.setTimeout(function () {
            screenInner.classList.remove("shake");
          }, 520);
          anime({
            targets: stampEd,
            opacity: 0,
            scale: 1.2,
            duration: 220,
            easing: "easeOutQuad",
            complete: function () {
              stampEd.style.top = "-120%";
              if (cb) cb();
            }
          });
        }
      });
    }

    function runDoubleLetterAnim(cb) {
      var w = current.base;
      var letters = w.split("");
      verbHero.innerHTML = letters
        .map(function (ch) {
          return '<span class="vh-ch">' + escapeHtml(ch) + "</span>";
        })
        .join("") + '<span class="vh-ch vh-clone">' + escapeHtml(letters[letters.length - 1]) + "</span>";
      var clone = verbHero.querySelector(".vh-clone");
      anime.remove(clone);
      anime({
        targets: clone,
        translateX: [0, 16, 0],
        scale: [1, 1.4, 1],
        duration: 420,
        easing: "easeInOutQuad",
        complete: function () {
          verbHero.textContent = current.base;
          if (cb) cb();
        }
      });
    }

    function spawnParticles() {
      particleLayer.innerHTML = "";
      for (var i = 0; i < 18; i++) {
        var p = document.createElement("span");
        p.className = "particle";
        p.style.left = 38 + Math.random() * 44 + "%";
        p.style.top = 36 + Math.random() * 30 + "%";
        particleLayer.appendChild(p);
      }
      var nodes = particleLayer.querySelectorAll(".particle");
      anime({
        targets: nodes,
        translateX: function () {
          return anime.random(-55, 55);
        },
        translateY: function () {
          return anime.random(-45, 45);
        },
        scale: [0, 1.2, 0],
        opacity: [0, 0.9, 0],
        duration: 720,
        delay: anime.stagger(35),
        easing: "easeOutExpo"
      });
    }

    function runMagicAnimation(cb) {
      anime.remove(verbHero);
      anime({
        targets: verbHero,
        scale: [1, 1.12, 0.9, 1.1, 1],
        rotate: [0, -22, 20, -14, 0],
        filter: ["blur(0px)", "blur(0px)", "blur(6px)", "blur(10px)", "blur(2px)"],
        duration: 780,
        easing: "easeInOutQuad",
        complete: function () {
          spawnParticles();
          verbHero.textContent = current.past;
          verbHero.classList.add("is-irregular-past");
          anime.set(verbHero, { filter: "blur(0px)", scale: 1 });
          anime({
            targets: verbHero,
            scale: [0.15, 1.18, 1],
            opacity: [0.45, 1, 1],
            duration: 440,
            easing: "easeOutBack",
            complete: function () {
              if (cb) cb();
            }
          });
        }
      });
    }

    function afterPastTransform() {
      screenSentence.innerHTML = highlightPast(current.pastSentence, current);
      screenSentence.classList.remove("is-phased-out");
      verbHero.textContent = current.past;
      verbHero.classList.toggle("is-irregular-past", current.category === "irregular");
      applySentenceLookup();
      applyDiscoveryUI();
      setBusy(false);
    }

    function runPastVerbAnimChain() {
      if (current.category === "regular") {
        if (current.ruleType === "double") {
          verbHero.textContent = current.base;
          verbHero.classList.remove("is-irregular-past");
          runDoubleLetterAnim(function () {
            verbHero.textContent = current.past;
            runStampAnimation(afterPastTransform);
          });
        } else {
          verbHero.textContent = current.past;
          verbHero.classList.remove("is-irregular-past");
          runStampAnimation(afterPastTransform);
        }
      } else {
        verbHero.textContent = current.base;
        verbHero.classList.remove("is-irregular-past");
        runMagicAnimation(afterPastTransform);
      }
    }

    function transitionToPast() {
      if (busy || isPast || !discoveryRevealed) return;
      setBusy(true);
      isPast = true;
      syncPhotoViewMode();
      stopSpeak();
      runPhotoCrossfade(function () {
        playLowHum();
        setPastSentenceOnly();
        runPastVerbAnimChain();
      });
    }

    function transitionToPresent() {
      if (busy) return;
      stopSpeak();
      isPast = false;
      syncPhotoViewMode();
      screenInner.classList.remove("is-past");
      anime.remove(stampEd);
      stampEd.style.opacity = "0";
      stampEd.style.top = "-120%";
      particleLayer.innerHTML = "";
      verbHero.innerHTML = "";
      verbHero.textContent = current.base;
      if (!imgFail) {
        anime.remove([imgNowEl, imgPastEl]);
        imgNowEl.style.opacity = "1";
        imgPastEl.style.opacity = "0";
      } else {
        imgFallback.style.filter = "";
      }
      refreshScreen();
      applyDiscoveryUI();
    }

    function selectAction(item) {
      stopSpeak();
      current = item;
      isPast = false;
      discoveryRevealed = false;
      syncPhotoViewMode();
      screenInner.classList.remove("is-past");
      anime.remove(stampEd);
      stampEd.style.opacity = "0";
      stampEd.style.top = "-120%";
      particleLayer.innerHTML = "";
      verbHero.innerHTML = "";
      verbHero.textContent = item.base;
      verbHero.classList.toggle("is-long", item.base.length > 9);
      logImagePromptsFor(current);
      setupImagesForCurrent();
      applyDiscoveryUI();
      syncActivePill();
      refreshScreen();
    }

    function syncActivePill() {
      document.querySelectorAll(".verb-pill").forEach(function (c) {
        c.classList.toggle("is-active", c.getAttribute("data-id") === current.id);
      });
    }

    function buildDeck() {
      VERB_MASTER_POOL.regular.forEach(function (v, i) {
        var item = byId["r" + (i + 1)];
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "verb-pill tag-regular";
        btn.setAttribute("data-id", item.id);
        btn.innerHTML = escapeHtml(v.base) + '<span class="tag-mini">' + ruleLabel(v.rule) + "</span>";
        btn.addEventListener("click", function () {
          selectAction(item);
        });
        deckRegular.appendChild(btn);
      });
      VERB_MASTER_POOL.irregular.forEach(function (v, i) {
        var item = byId["i" + (i + 1)];
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "verb-pill tag-irregular";
        btn.setAttribute("data-id", item.id);
        btn.innerHTML = escapeHtml(v.base) + '<span class="tag-mini">不规则</span>';
        btn.addEventListener("click", function () {
          selectAction(item);
        });
        deckIrregular.appendChild(btn);
      });
    }

    function openPanel(which) {
      if (which === "reg") {
        panelReg.classList.add("is-open");
        panelReg.hidden = false;
        orbReg.classList.add("is-open");
        orbReg.setAttribute("aria-expanded", "true");
        panelIrr.classList.remove("is-open");
        panelIrr.hidden = true;
        orbIrr.classList.remove("is-open");
        orbIrr.setAttribute("aria-expanded", "false");
      } else {
        panelIrr.classList.add("is-open");
        panelIrr.hidden = false;
        orbIrr.classList.add("is-open");
        orbIrr.setAttribute("aria-expanded", "true");
        panelReg.classList.remove("is-open");
        panelReg.hidden = true;
        orbReg.classList.remove("is-open");
        orbReg.setAttribute("aria-expanded", "false");
      }
    }

    orbReg.addEventListener("click", function () {
      openPanel("reg");
    });
    orbIrr.addEventListener("click", function () {
      openPanel("irr");
    });

    btnNow.addEventListener("click", function () {
      if (busy) return;
      transitionToPresent();
    });
    btnYesterday.addEventListener("click", function () {
      transitionToPast();
    });

    if (photoStack) {
      photoStack.addEventListener("click", function (e) {
        if (busy) return;
        e.preventDefault();
        e.stopPropagation();
        openActivePhotoLightbox();
      });
    }

    btnRevealSentence.addEventListener("click", function () {
      if (busy || isPast) return;
      if (!discoveryRevealed) {
        revealDiscovery();
      }
    });

    if (btnPlaySentence) {
      btnPlaySentence.addEventListener("click", function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        playCurrentSentence();
      });
    }

    buildDeck();
    selectAction(flatList[0]);
    openPanel("reg");
    window.setTimeout(ensureLookupReady, 0);
  })();
  </script>
  <link rel="stylesheet" href="assets/lesson-image-lightbox.css" />
  <script src="assets/lesson-image-lightbox.js" defer></script>
</body>
</html>
