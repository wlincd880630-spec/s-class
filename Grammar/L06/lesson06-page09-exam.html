          stem: "It's Grandma's birthday—I _____ buy her flowers before noon.",
          opts: ["must", "have to", "can", "may"],
          ans: 0,
          detailZh: "表达主观强烈意愿「我一定要……」常用 must；have to 更偏外界强加的义务，此处情感驱动选 must 更自然。",
          extendZh: "同类拓展：I must call him today—it's been weeks."
        },
        {
          level: "medium",
          stem: "The traffic law says we _____ wear helmets when we ride e-bikes.",
          opts: ["have to", "must", "can", "may"],
          ans: 0,
          detailZh: "法规条文常用 have to 强调客观约束（不得不服从）；本题语境与「法律写明」高度贴合。",
          extendZh: "同类拓展：Drivers have to wear seat belts—it's the law."
        },
        {
          level: "medium",
          stem: "Whose notebook is this? It _____ be Lily's—look at the cartoon cat sticker.",
          opts: ["must", "might", "can", "should"],
          ans: 0,
          detailZh: "有证据支持的肯定推测「一定是」用 must be / must + V。might 语气偏弱，与「贴纸证据」不匹配。",
          extendZh: "同类拓展：The footprints are small—it must be a child's."
        },
        {
          level: "medium",
          stem: "That tall man _____ be our PE teacher. Our PE teacher is on sick leave.",
          opts: ["can't", "mustn't", "shouldn't", "needn't"],
          ans: 0,
          detailZh: "依据事实否定推测「不可能是」，用 can't be。Mustn't 表禁止，不作否定推测。",
          extendZh: "同类拓展：He can't be in two cities at the same time."
        },
        {
          level: "medium",
          stem: "The river looks calm but the sign says Danger—you _____ swim here.",
          opts: ["mustn't", "don't have to", "can't", "may not"],
          ans: 0,
          detailZh: "警示「严禁下水」用 mustn't / can't 表禁止。Don't have to 表示不必，与警示含义相反。",
          extendZh: "同类拓展：You mustn't climb over the fence."
        },
        {
          level: "hard",
          stem: "The living-room lights are off and the car is gone. My parents _____ be at home now.",
          opts: ["can't", "must", "may", "should"],
          ans: 0,
          detailZh: "根据现象（灯灭、车不在）推断「不可能在家」，否定推测用 can't。Must be 与语境矛盾。",
          extendZh: "同类拓展：The shop is closed—it can't be open at midnight."
        },
        {
          level: "hard",
          stem: "You've slept ten hours—you _____ still feel sleepy!",
          opts: ["can't", "mustn't", "shouldn't", "needn't"],
          ans: 0,
          detailZh: "常理推断「睡了十小时按理不可能仍困」，否定推测用 can't。语气可带轻微责备或调侃。",
          extendZh: "同类拓展：You can't be serious—that's impossible!"
        },
        {
          level: "hard",
          stem: "I took an umbrella, but in the end I _____ use it—the sky cleared.",
          opts: ["didn't have to", "mustn't", "can't", "shouldn't"],
          ans: 0,
          detailZh: "「带了伞但最终没用上」＝事实上不必使用，用 didn't have to。Mustn't 表禁止，不适用。",
          extendZh: "同类拓展：We didn't have to pay—the museum was free that day."
        },
        {
          level: "hard",
          stem: "The homework looks difficult, but it _____ be easier than we think—let's try first.",
          opts: ["may", "must", "can't", "should"],
          ans: 0,
          detailZh: "表示不确定的「也许、可能」用 may / might / could。Must 表把握过大的肯定推测，与 let's try 不符。",
          extendZh: "同类拓展：It may rain later, so take an umbrella."
        },
        {
          level: "hard",
          stem: "You _____ forget your passport—without it you can't board the plane.",
          opts: ["mustn't", "don't have to", "can't", "needn't"],
          ans: 0,
          detailZh: "严重后果情形强调「绝对不能忘」，用 mustn't forget。Don't have to forget 语义不通。",
          extendZh: "同类拓展：You mustn't tell anyone—it's a secret."
        },
        {
          level: "hard",
          stem: "I'm not sure—_____ I leave my bag here for a moment?",
          opts: ["Could", "Must", "Should", "Need"],
          ans: 0,
          detailZh: "委婉征求许可可用 Could I...? / Can I...?。Must I 变成「我必须吗」，语气不符。",
          extendZh: "同类拓展：Could I ask you something personal?"
        }
      ];

      var exam = [];
      var answers = [];
      var graded = false;
      var score = 0;

      var paperCol = document.getElementById("paperCol");
      var submitBtn = document.getElementById("submitBtn");
      var uiLock = document.getElementById("uiLock");
      var gradeDim = document.getElementById("gradeDim");
      var stampSeal = document.getElementById("stampSeal");
      var stampScore = document.getElementById("stampScore");
      var progressChip = document.getElementById("progressChip");

      function setBusy(on) {
        uiLock.classList.toggle("show", on);
      }

      function shuffleArr(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function shuffleQuestion(q) {
        var pairs = q.opts.map(function (text, i) {
          return { text: text, orig: i };
        });
        var shuffled = shuffleArr(pairs);
        var newAns = -1;
        for (var k = 0; k < shuffled.length; k++) {
          if (shuffled[k].orig === q.ans) {
            newAns = k;
            break;
          }
        }
        return {
          level: q.level,
          stem: q.stem,
          opts: shuffled.map(function (p) {
            return p.text;
          }),
          ans: newAns >= 0 ? newAns : q.ans,
          detailZh: q.detailZh,
          extendZh: q.extendZh
        };
      }

      function buildExam() {
        exam = RAW_BANK.map(shuffleQuestion);
        answers = exam.map(function () {
          return null;
        });
      }

      function playRustle() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          var ctx = new AC();
          var len = Math.floor(ctx.sampleRate * 0.075);
          var buf = ctx.createBuffer(1, len, ctx.sampleRate);
          var data = buf.getChannelData(0);
          for (var i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.2;
          }
          var src = ctx.createBufferSource();
          src.buffer = buf;
          var lp = ctx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 900;
          var g = ctx.createGain();
          g.gain.value = 0.35;
          src.connect(lp);
          lp.connect(g);
          g.connect(ctx.destination);
          src.start();
          src.onended = function () {
            try {
              ctx.close();
            } catch (e) {}
          };
        } catch (e) {}
      }

      function speakOpening() {
        var line = "Detectives, silence please. The final trial begins now.";
        if (typeof window.playL06Local === "function") {
          return window.playL06Local(line);
        }
        return Promise.resolve(false);
      }

      function speakStem(idx) {
        var q = exam[idx];
        if (!q) return Promise.resolve(false);
        if (typeof window.playL06Local === "function") {
          return window.playL06Local(q.stem);
        }
        return Promise.resolve(false);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function buildPostGradeHtml(qi) {
        var q = exam[qi];
        var ok = answers[qi] === q.ans;
        var ca = LETTERS[q.ans];
        var ct = q.opts[q.ans];
        var pa = answers[qi] !== null && answers[qi] !== undefined ? LETTERS[answers[qi]] : "—";
        var pt = answers[qi] !== null && answers[qi] !== undefined ? q.opts[answers[qi]] : "—";
        return (
          '<div class="pg-head">' +
          (ok ? '<span class="pg-ok">✓ 回答正确</span>' : '<span class="pg-bad">✗ 回答错误</span>') +
          "</div>" +
          '<p class="pg-line"><strong>正确答案：</strong>' +
          ca +
          ". " +
          escapeHtml(ct) +
          "</p>" +
          (ok
            ? ""
            : '<p class="pg-line"><strong>你的作答：</strong>' + pa + ". " + escapeHtml(pt) + "</p>") +
          '<div class="pg-block"><strong>详细解析</strong><p>' +
          escapeHtml(q.detailZh) +
          "</p></div>" +
          '<div class="pg-block pg-extend"><strong>同类拓展</strong><p>' +
          escapeHtml(q.extendZh) +
          "</p></div>"
        );
      }

      function revealAllExplanations() {
        for (var qi = 0; qi < totalQ(); qi++) {
          var card = document.getElementById("card-" + qi);
          var box = document.getElementById("post-grade-" + qi);
          if (box) {
            box.innerHTML = buildPostGradeHtml(qi);
          }
          if (card) {
            card.classList.add("graded");
          }
        }
      }

      function totalQ() {
        return exam.length;
      }

      function updateProgress() {
        var n = answers.filter(function (a) {
          return a !== null && a !== undefined;
        }).length;
        progressChip.textContent = "作答 " + n + " / " + totalQ();
      }

      function selectOption(qIdx, optIdx) {
        if (graded) return;
        answers[qIdx] = optIdx;
        playRustle();

        var card = document.getElementById("card-" + qIdx);
        if (card) {
          card.querySelectorAll(".opt-line").forEach(function (el, i) {
            el.classList.toggle("selected", i === optIdx);
          });
        }
        updateProgress();
      }

      function diffClass(level) {
        if (level === "easy") return "diff-easy";
        if (level === "hard") return "diff-hard";
        return "diff-medium";
      }

      function render() {
        paperCol.innerHTML = "";

        exam.forEach(function (q, qi) {
          if (qi === 0 || q.level !== exam[qi - 1].level) {
            var ban = document.createElement("div");
            ban.className = "section-banner section-" + q.level;
            ban.textContent = SECTION_TITLES[q.level] || "";
            paperCol.appendChild(ban);
          }

          var card = document.createElement("article");
          card.className = "q-card";
          card.id = "card-" + qi;
          card.innerHTML =
            '<div class="q-head">' +
            '<span class="q-num" id="num-' +
            qi +
            '">第 ' +
            (qi + 1) +
            ' 题</span>' +
            '<span class="diff-badge ' +
            diffClass(q.level) +
            '">' +
            (DIFF_LABEL[q.level] || "") +
            "</span>" +
            '<div style="flex:1">' +
            '<div class="q-stem" id="stem-' +
            qi +
            '">' +
            q.stem +
            "</div>" +
            "</div>" +
            '<button type="button" class="speak-mini" data-qi="' +
            qi +
            '" aria-label="朗读题干">🔊</button>' +
            "</div>" +
            '<div class="opts-row" id="opts-' +
            qi +
            '"></div>' +
            '<div class="post-grade-box" id="post-grade-' +
            qi +
            '"></div>';

          var optsRow = card.querySelector("#opts-" + qi);
          q.opts.forEach(function (optText, oi) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "opt-line";
            btn.innerHTML =
              '<span class="opt-letter">' +
              LETTERS[oi] +
              '</span><span class="opt-txt">' +
              optText +
              "</span>";
            btn.addEventListener("click", function () {
              selectOption(qi, oi);
            });
            optsRow.appendChild(btn);
          });

          card.querySelector(".speak-mini").addEventListener("click", function () {
            speakStem(+this.getAttribute("data-qi"));
          });

          paperCol.appendChild(card);
        });
      }

      function computeScore() {
        var s = 0;
        var t = totalQ();
        for (var i = 0; i < t; i++) {
          if (answers[i] === exam[i].ans) s++;
        }
        return s;
      }

      function wrongIndices() {
        var w = [];
        var t = totalQ();
        for (var i = 0; i < t; i++) {
          if (answers[i] !== exam[i].ans) w.push(i);
        }
        return w;
      }

      function runSubmitAnimationThenGrade() {
        setBusy(true);
        submitBtn.disabled = true;
        gradeDim.classList.add("on");

        var paper = document.getElementById("paperCol");

        var tl = anime.timeline({
          easing: "easeInOutQuad",
          complete: function () {
            score = computeScore();
            var tq = totalQ();
            stampScore.innerHTML = score + " / " + tq + '<br/><span style="font-size:55%">GRADED</span>';

            anime({
              targets: stampSeal,
              opacity: [0, 1],
              translateY: [-420, 0],
              scale: [0.35, 1],
              duration: 950,
              easing: "easeOutElastic(1, .58)",
              complete: function () {
                anime({
                  targets: "#appRoot",
                  translateX: [6, -6, 5, -4, 0],
                  duration: 420,
                  easing: "easeOutQuad",
                  complete: function () {
                    if (typeof anime.set === "function") anime.set("#appRoot", { translateX: 0 });
                  }
                });
                setTimeout(function () {
                  anime({
                    targets: stampSeal,
                    opacity: 0,
                    scale: 0.4,
                    duration: 380,
                    easing: "easeInQuad",
                    complete: function () {
                      stampSeal.style.opacity = 0;
                      stampSeal.style.transform = "none";
                      gradeDim.classList.remove("on");
                      finalizeGradeUi();
                    }
                  });
                }, 520);
              }
            });
          }
        });

        tl.add({
          targets: paper,
          translateY: ["0%", "1.5%"],
          scale: [1, 0.96],
          duration: 700
        });
      }

      function finalizeGradeUi() {
        graded = true;
        var wrong = wrongIndices();
        wrong.forEach(function (qi) {
          var num = document.getElementById("num-" + qi);
          if (num) num.classList.add("warn-blink");
        });

        revealAllExplanations();

        anime({
          targets: paperCol,
          translateY: 0,
          scale: 1,
          duration: 500,
          easing: "easeOutQuad"
        });

        submitBtn.disabled = false;
        submitBtn.textContent = "已交卷";
        setBusy(false);
        var tq = totalQ();
        progressChip.textContent =
          "得分 " + score + " / " + tq + " · 下方每题含解析与同类拓展 · 可用底栏前往下一页";
      }

      submitBtn.addEventListener("click", function () {
        if (graded) return;
        var incomplete = answers.some(function (a) {
          return a === null || a === undefined;
        });
        if (incomplete) {
          alert("还有题目未作答，请完成全部 " + totalQ() + " 道题后再交卷。");
          return;
        }
        runSubmitAnimationThenGrade();
      });

      buildExam();
      render();
      updateProgress();
      speakOpening();
    })();
  </script>
