  <!--
    Vertex Imagen 3.0 Fast · 书桌夜景（assets 占位，无图时深色渐变兜底）
    提示词：A messy teenager desk at night, illuminated by a warm desk lamp. Scattered stationeries, books, high-end crayon illustration style.
    放大镜道具（可选 PNG）：assets/vertex/l06-page06-lens.png — glowing magical magnifying glass, crayon style, transparent background.

    【设计自检 / 教学逻辑】
    - 三处错词分别锚定：义务 vs 禁止（have to vs mustn't）、红线禁止 vs 不必（mustn't/cannot vs don't have to）、生命危险语境下的绝对禁止（mustn't）。
    - 交互：探索（放大镜悬停）→ 聚焦（点击）→ 产出（替换词）→ 元认知（错则 DeepSeek 反问，对则正向反馈），符合「侦测—修正—巩固」流程。
    - 触控降级：细指针下放大镜跟手；粗指针/触摸下列为「点词纠错模式」，避免误触与遮挡。

    【“教学法 GPT vs 稳健工程 Codex”合成结论 — 本轮升级】
    - 教学法：编辑弹窗打开时暂停「放大镜猎寻」隐喻，恢复文本光标，符合 Prompt「暂时解除放大镜跟随」；成功反馈拆成「输入框消散 → 正文改写」，强化侦探闭环。
    - 工程：节流镜片震动避免 mousemove 噪声；submit 与 meta 防空；结算叠加轻微屏幕 Shake + 信纸亮度脉冲；DeepSeek system 与 Prompt 全文对齐。
  -->

    <section class="finish-overlay" id="finishOverlay">
      <div class="finish-card">
        <h2>逻辑照妖完毕</h2>
        <div class="stamp">LOGIC MASTER<br />CLEARED</div>
        <p style="margin:0;font-weight:900;color:#4e342e;line-height:1.55;">
          你已把青春期日记里的情态动词拉回<strong>真实世界的语气梯度</strong>：义务、不必、绝对禁止。
        </p>
        <a class="btn-link" href="lesson06-page07-debate.html">前往 Page 07 · 口语辩论赛 →</a>
      </div>
    </section>

  <nav class="lesson-pager is-file-nav" aria-label="页面导航">
    <a class="pager-prev" href="lesson06-page05-rulemaker.html">上一页</a>
    <a class="pager-logo" href="../index.html" aria-label="课程主页"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/logo2.png" alt="Steven's Class" width="204" height="61" decoding="async" /></a>

  </nav>

  <script>
    (function () {
      "use strict";

      var AZURE_KEY = "3C2ai7PPgPnOLlhb1c7gBw207PAVNfVJni6JnESsPjYPaVyFeQ9YJQQJ99CGAC3pKaRXJ3w3AAAYACOG0Zbc";
      var AZURE_REGION = "eastasia";
      var DEEPSEEK_KEY = "sk-daa16008e81843deba6fefe9dce51465";
      var DEEPSEEK_ENDPOINT = "https://api.deepseek.com/v1/chat/completions";

      var SEGMENTS = [
        [{ type: "text", value: "Dear Diary," }],
        [
          { type: "text", value: "Today is the worst day ever! My mom is so strict. I " },
          { type: "err", id: "1", wrong: "mustn't" },
          { type: "text", value: " clean my room every day. It makes me so tired!" }
        ],
        [
          { type: "text", value: "Tomorrow is my 13th birthday. I am so happy! But my mom says I " },
          { type: "err", id: "2", wrong: "do not have to" },
          {
            type: "text",
            value: " invite my best friend Leo because he is too noisy. I really want him to come!"
          }
        ],
        [
          {
            type: "text",
            value:
              "I am so angry right now. I just want to run away. The sign near the river says Danger, but I "
          },
          { type: "err", id: "3", wrong: "do not have to" },
          { type: "text", value: " swim there to relax! I am brave enough!" }
        ],
        [{ type: "text", value: "Nobody understands me." }]
      ];

      var ERROR_META = {
        "1": {
          micro: "考点：妈妈的严格要求更像「不得不」，不是「不准你做」。",
          placeholder: "如：have to",
          original:
            "Today is the worst day ever! My mom is so strict. I mustn't clean my room every day. It makes me so tired!",
          answerHint: "have to（客观义务：不得不打扫）",
          explain: function () {
            return "判定正确：这是外界长期要求，所以是 have to（不得不），不是 mustn't（禁止）。";
          },
          accept: function (raw) {
            var s = normalizeAns(raw);
            return /\bhave\s+to\b/.test(s) || s.indexOf("haveto") >= 0;
          }
        },
        "2": {
          micro: "考点：如果你强烈想邀请，但妈妈不允许——更像「不准 / 不能」，不是「没必要」。",
          placeholder: "如：mustn't 或 can't",
          original:
            "Tomorrow is my 13th birthday. I am so happy! But my mom says I do not have to invite my best friend Leo because he is too noisy. I really want him to come!",
          answerHint: "mustn't / cannot（禁止或不允许邀请）",
          explain: function (raw) {
            var s = normalizeAns(raw);
            if (/\bmustn'?t\b/.test(s) || /\bmust\s+not\b/.test(s)) {
              return "判定正确：mustn't 强调强禁止，语气最硬。";
            }
            return "判定正确：can't/cannot 表示不被允许，也符合语境。";
          },
          accept: function (raw) {
            var s = normalizeAns(raw);
            return (
              /\bmustn'?t\b/.test(s) ||
              /\bmust\s+not\b/.test(s) ||
              /\bcannot\b/.test(s) ||
              /\bcan\s*not\b/.test(s) ||
              /\bcan'?t\b/.test(s)
            );
          }
        },
        "3": {
          micro: "考点：危险水域是生命安全红线——更像「绝对禁止」，不是「不必」。",
          placeholder: "如：mustn't",
          original:
            "The sign near the river says Danger, but I do not have to swim there to relax! I am brave enough!",
          answerHint: "mustn't（绝对禁止下水）",
          explain: function () {
            return "判定正确：危险水域是安全红线，这里必须用 mustn't 表达绝对禁止。";
          },
          accept: function (raw) {
            var s = normalizeAns(raw);
            return /\bmustn'?t\b/.test(s) || /\bmust\s+not\b/.test(s);
          }
        }
      };

      function normalizeAns(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, " ")
          .replace(/[.!?]+$/g, "");
      }

      function animeRun(opts) {
        if (window.anime) return window.anime(opts).finished;
        return Promise.resolve();
      }

      function playHealChime() {
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = 880;
          g.gain.value = 0.0001;
          o.connect(g);
          g.connect(ctx.destination);
          o.start();
          var t = ctx.currentTime;
          g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
          o.stop(t + 0.24);
          window.setTimeout(function () {
            try {
              ctx.close();
            } catch (e) {}
          }, 400);
        } catch (e) {}
      }

      function speakAzure(text, voice, style) {
        var t = String(text || "").trim();
        if (!t) return Promise.resolve(false);
        if (typeof window.playL06Local === "function") {
          return window.playL06Local(t);
        }
        console.warn("[L06] 本地 MP3 未找到:", t.slice(0, 120));
        return Promise.resolve(false);
      }

      function deepSeekCoach(userPayload) {
        if (!DEEPSEEK_KEY) return Promise.resolve(null);
        var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timeoutId = window.setTimeout(function () {
          if (controller) controller.abort();
        }, 8000);
        return fetch(DEEPSEEK_ENDPOINT, {
          method: "POST",
          signal: controller ? controller.signal : undefined,
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + DEEPSEEK_KEY },
          body: JSON.stringify({
            model: "deepseek-v4-flash",
            temperature: 0.3,
            max_tokens: 120,
            messages: [
              {
                role: "system",
                content:
                  "你是一位温柔的心理医生兼中考英语名师。学生在修改一篇青春期日记时，找出了情态动词的错误，但他修改的新单词依然不对。用户消息中会依次给出：原句是：……学生试图将其修改为：……正确答案应该是：……请据此用中文进行极度简短（50字内）的苏格拉底式反问。例如若把不准游泳改成了 can，你要反问：大侦探，危险水域是可以随便去的吗？体会一下生命安全面前的绝对禁止哦。语气幽默、启发性强。不要输出英文。"
              },
              { role: "user", content: userPayload }
            ]
          })
        })
          .then(function (r) {
            window.clearTimeout(timeoutId);
            return r.ok ? r.json() : null;
          })
          .then(function (data) {
            var t =
              data &&
              data.choices &&
              data.choices[0] &&
              data.choices[0].message &&
              data.choices[0].message.content;
            return t ? String(t).trim() : null;
          })
          .catch(function () {
            window.clearTimeout(timeoutId);
            return null;
          });
      }

      var diaryRoot = document.getElementById("diaryRoot");
      var parchment = document.getElementById("parchment");
      var lens = document.getElementById("magicLens");
      var editPop = document.getElementById("editPop");
      var editMicro = document.getElementById("editMicro");
      var editInput = document.getElementById("editInput");
      var btnSubmitFix = document.getElementById("btnSubmitFix");
      var btnCancelFix = document.getElementById("btnCancelFix");
      var aiBubble = document.getElementById("aiBubble");
      var aiText = document.getElementById("aiText");
      var aiOk = document.getElementById("aiOk");
      var microToast = document.getElementById("microToast");
      var uiLock = document.getElementById("uiLock");
      var fixCountEl = document.getElementById("fixCount");
      var finishOverlay = document.getElementById("finishOverlay");

      var fixed = new Set();
      var busy = false;
      var activeId = null;
      var lensQuakeUntil = 0;
      var lastLensErrId = null;
      var STATE = {
        IDLE: "IDLE",
        EDITING: "EDITING",
        AI_WAIT: "AI_WAIT",
        FINISHING: "FINISHING"
      };
      var appState = STATE.IDLE;

      function setBusy(on) {
        busy = on;
        uiLock.classList.toggle("show", on);
      }

      function setState(next) {
        appState = next;
      }

      function isEditingOpen() {
        return appState === STATE.EDITING;
      }

      function renderDiary() {
        diaryRoot.innerHTML = "";
        SEGMENTS.forEach(function (parts) {
          var p = document.createElement("p");
          parts.forEach(function (chunk) {
            if (chunk.type === "text") {
              p.appendChild(document.createTextNode(chunk.value));
            } else if (chunk.type === "err") {
              var span = document.createElement("span");
              span.className = "diary-error";
              span.dataset.id = chunk.id;
              span.dataset.wrong = chunk.wrong;
              var inner = document.createElement("span");
              inner.className = "err-wrong";
              inner.textContent = chunk.wrong;
              span.appendChild(inner);
              p.appendChild(span);
            }
          });
          diaryRoot.appendChild(p);
        });
      }

      function updateFixCount() {
        fixCountEl.textContent = String(fixed.size);
      }

      function moveLens(clientX, clientY) {
        lens.style.transform = "translate(" + clientX + "px," + clientY + "px)";
      }

      function setHoverFromPoint(clientX, clientY) {
        if (document.body.classList.contains("editor-open")) return;
        var el = document.elementFromPoint(clientX, clientY);
        var hit = el && el.closest ? el.closest(".diary-error:not(.is-fixed)") : null;
        diaryRoot.querySelectorAll(".diary-error.is-hover").forEach(function (n) {
          n.classList.remove("is-hover");
        });
        if (hit) {
          hit.classList.add("is-hover");
          var now = Date.now();
          var hid = hit.dataset.id;
          if (now >= lensQuakeUntil || hid !== lastLensErrId) {
            lensQuakeUntil = now + 360;
            lastLensErrId = hid;
            var svg = lens.querySelector(".lens-svg");
            if (svg) {
              svg.classList.add("lens-quake");
              window.setTimeout(function () {
                svg.classList.remove("lens-quake");
              }, 380);
            }
          }
        } else {
          lastLensErrId = null;
        }
      }

      function openEditor(id, anchorRect) {
        if (busy || appState === STATE.FINISHING || appState === STATE.AI_WAIT) return;
        activeId = id;
        setState(STATE.EDITING);
        var meta = ERROR_META[id];
        editMicro.textContent = meta ? meta.micro : "";
        editInput.value = "";
        editInput.placeholder = meta && meta.placeholder ? meta.placeholder : "输入替换短语（情态动词短语）";
        document.body.classList.add("editor-open");
        editPop.classList.add("show");
        editInput.focus();

        var pad = 12;
        var left = anchorRect.left + anchorRect.width / 2 - editPop.offsetWidth / 2;
        var top = anchorRect.top - editPop.offsetHeight - pad;
        if (top < 12) top = anchorRect.bottom + pad;
        left = Math.max(12, Math.min(left, window.innerWidth - editPop.offsetWidth - 12));
        top = Math.max(12, Math.min(top, window.innerHeight - editPop.offsetHeight - 12));
        editPop.style.left = left + "px";
        editPop.style.top = top + "px";
      }

      function closeEditor() {
        if (busy && appState !== STATE.EDITING) return;
        activeId = null;
        document.body.classList.remove("editor-open");
        try {
          if (window.anime) anime.remove(editPop);
        } catch (e) {}
        editPop.style.opacity = "";
        editPop.style.transform = "";
        editPop.classList.remove("show");
        editInput.value = "";
        editInput.placeholder = "";
        if (appState !== STATE.FINISHING) setState(STATE.IDLE);
      }

      function applyFix(id, userText) {
        var span = diaryRoot.querySelector('.diary-error[data-id="' + id + '"]');
        if (!span || span.classList.contains("is-fixed")) return;
        var meta = ERROR_META[id];
        if (!meta.accept(userText)) {
          return false;
        }
        var display = String(userText).trim();
        span.classList.add("is-fixed");
        fixed.add(id);
        updateFixCount();

        var right = document.createElement("span");
        right.className = "err-right";
        right.textContent = display;
        span.appendChild(right);

        for (var i = 0; i < 26; i++) {
          var p = document.createElement("div");
          p.className = "particle";
          p.style.background = "hsl(" + (120 + Math.random() * 40) + ", 70%, 55%)";
          p.style.left = span.getBoundingClientRect().left + Math.random() * 80 + "px";
          p.style.top = span.getBoundingClientRect().top + Math.random() * 30 + "px";
          document.body.appendChild(p);
          animeRun({
            targets: p,
            translateY: [-10 - Math.random() * 40, -90 - Math.random() * 40],
            translateX: [(Math.random() - 0.5) * 60, (Math.random() - 0.5) * 90],
            opacity: [1, 0],
            duration: 650 + Math.random() * 300,
            easing: "easeOutQuad",
            complete: function () {
              try {
                p.remove();
              } catch (e) {}
            }
          });
        }

        playHealChime();
        speakAzure("Nice fix. Keep thinking like a detective.", "en-GB-RyanNeural", "cheerful");
        if (meta && typeof meta.explain === "function") {
          showMicroToast(meta.explain(userText));
        } else {
          showMicroToast("修正成功：先判断语气，再选情态动词。");
        }

        if (fixed.size >= 3) {
          celebrateFinish();
        }
        return true;
      }

      function celebrateFinish() {
        setState(STATE.FINISHING);
        setBusy(true);
        var host = document.getElementById("app");
        animeRun({
          targets: host,
          filter: ["brightness(1)", "brightness(1.16)", "brightness(1)"],
          translateX: [0, -5, 5, -4, 4, -3, 3, 0],
          duration: 1500,
          easing: "easeInOutQuad"
        });
        animeRun({
          targets: parchment,
          filter: ["brightness(1)", "brightness(1.08)", "brightness(1)"],
          boxShadow: [
            "inset 0 0 40px rgba(255, 255, 255, 0.35), 8px 12px 0 rgba(62, 39, 35, 0.18), 0 24px 48px rgba(0, 0, 0, 0.35)",
            "inset 0 0 52px rgba(255, 235, 120, 0.55), 8px 12px 0 rgba(62, 39, 35, 0.18), 0 28px 56px rgba(255, 193, 7, 0.38)",
            "inset 0 0 40px rgba(255, 255, 255, 0.35), 8px 12px 0 rgba(62, 39, 35, 0.18), 0 24px 48px rgba(0, 0, 0, 0.35)"
          ],
          duration: 1500,
          easing: "easeInOutQuad"
        }).then(function () {
          finishOverlay.classList.add("show");
          animeRun({
            targets: ".finish-card",
            scale: [0.3, 1.06, 1],
            opacity: [0, 1],
            translateY: [-80, 6, 0],
            duration: 820,
            easing: "easeOutElastic(1, .52)"
          });
          animeRun({
            targets: host,
            translateX: [0, -7, 7, -5, 5, 0],
            duration: 420,
            easing: "easeOutElastic(1, .62)"
          });
          speakAzure(
            "Logic master cleared. Rules protect us, even on bad days.",
            "en-GB-RyanNeural",
            "cheerful"
          );
          setBusy(false);
        });
      }

      function showAi(text) {
        aiText.textContent = text || "再想想看：语气是「不必」还是「千万别」？";
        aiBubble.classList.add("show");
      }

      function hideAi() {
        aiBubble.classList.remove("show");
      }

      function showMicroToast(text) {
        if (!microToast) return;
        microToast.textContent = text;
        animeRun({
          targets: microToast,
          opacity: [0, 1, 1, 0],
          translateY: [-10, 0, 0, -8],
          duration: 2200,
          easing: "easeOutQuad"
        });
      }

      function handleWrongAttempt(id, userText) {
        setState(STATE.AI_WAIT);
        setBusy(true);
        var meta = ERROR_META[id] || {};
        var payload =
          "原句是：" +
          meta.original +
          "\n学生试图将其修改为：" +
          userText +
          "\n正确答案应该是：" +
          meta.answerHint;

        animeRun({
          targets: editPop,
          translateX: [0, -8, 8, -6, 6, 0],
          duration: 520,
          easing: "easeOutElastic(1, .55)"
        });

        aiText.textContent = "思考中…";
        aiBubble.classList.add("show");

        deepSeekCoach(payload).then(function (txt) {
          showAi(txt || "再想想看：这里更像义务、禁止，还是不必？");
          setBusy(false);
          setState(STATE.EDITING);
        }).catch(function () {
          showAi("网络开小差了。先自问：这里更像「不必」，还是「千万别」？");
          setBusy(false);
          setState(STATE.EDITING);
        });
      }

      btnSubmitFix.addEventListener("click", function () {
        if (!activeId || busy || appState !== STATE.EDITING) return;
        var id = activeId;
        var val = editInput.value;
        if (!String(val || "").trim()) {
          showMicroToast("先输入一个情态动词或短语，再提交。");
          animeRun({
            targets: editInput,
            translateX: [0, -5, 5, -4, 4, 0],
            duration: 260,
            easing: "easeOutQuad"
          });
          return;
        }
        var meta = ERROR_META[id];
        if (!meta || typeof meta.accept !== "function") return;
        if (meta.accept(val)) {
          animeRun({
            targets: editPop,
            translateY: [0, -28],
            opacity: [1, 0],
            duration: 420,
            easing: "easeInQuad"
          }).then(function () {
            closeEditor();
            applyFix(id, val);
          });
        } else {
          handleWrongAttempt(id, val);
        }
      });

      btnCancelFix.addEventListener("click", function () {
        if (busy || appState !== STATE.EDITING) return;
        closeEditor();
      });

      aiOk.addEventListener("click", function () {
        hideAi();
        editInput.value = "";
        if (isEditingOpen() && editPop.classList.contains("show")) editInput.focus();
      });

      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && !busy && appState === STATE.EDITING && editPop.classList.contains("show")) {
          closeEditor();
        }
      });

      parchment.addEventListener("click", function (ev) {
        if (busy || appState === STATE.AI_WAIT || appState === STATE.FINISHING) return;
        var t = ev.target && ev.target.closest ? ev.target.closest(".diary-error") : null;
        if (!t || t.classList.contains("is-fixed")) return;
        ev.preventDefault();
        openEditor(t.dataset.id, t.getBoundingClientRect());
      });

      document.addEventListener("mousemove", function (ev) {
        if (document.body.classList.contains("touch-mode")) return;
        moveLens(ev.clientX, ev.clientY);
        setHoverFromPoint(ev.clientX, ev.clientY);
      });

      window.addEventListener(
        "touchstart",
        function () {
          document.body.classList.add("touch-mode");
          var th = document.querySelector(".touch-hint");
          if (th) th.style.display = "inline";
        },
        { passive: true, once: true }
      );

      if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
        document.body.classList.add("touch-mode");
        var th2 = document.querySelector(".touch-hint");
        if (th2) th2.style.display = "inline";
      }

      renderDiary();
      updateFixCount();
      moveLens(window.innerWidth / 2, window.innerHeight / 2);
    })();
  </script>
