<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../shared/play-local-mp3.js"></script>
  <script src="../shared/lesson-local-audio.js" defer></script>
  <script src="../shared/lesson-speak-local-only.js"></script>
  <!-- spa-assets-inlined -->

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>第02讲 · 第05页 · 时态语境辨析</title>
  <script src="assets/lesson-tts-azure-config.js"></script>
  <script src="assets/lesson-tts-azure-play.js"></script>
<style>
    :root {
      --paper: #fff9f0;
      --state-blue: #4a90d9;
      --habit-green: #43a047;
      --now-red: #e85d4c;
      --warning-orange: #ff8f00;
      --now-accent: var(--warning-orange);
      --semantic-state-be: var(--state-blue);
      --semantic-action-habit: var(--habit-green);
      --semantic-now-warning: var(--now-red);
      --semantic-now-accent: var(--warning-orange);
      --crayon-red: var(--now-red);
      --crayon-blue: var(--state-blue);
      --habit-green-light: #66bb6a;
      --now-red-light: #ef5350;
      --crayon-purple: #9b59b6;
      --crayon-green: #5cb85c;
      --ink: #2c2c2c;
      --shadow: rgba(60, 40, 20, 0.15);
    }
    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      background: var(--paper);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image: url("https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L02/assets/migrated/images/l02/bg-detective-desk.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      padding: 0.65rem;
      padding-bottom: 4.5rem;
    }
    body.tts-busy {
      cursor: wait;
      pointer-events: none;
    }
    .tts-lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      cursor: wait;
      background: transparent;
    }
    body.tts-busy .tts-lock-overlay {
      pointer-events: auto;
    }

    .book {
      max-width: 920px;
      margin: 0 auto;
      background: rgba(255, 249, 240, 0.96);
      border-radius: 10px 28px 14px 18px;
      border: 4px solid var(--crayon-red);
      box-shadow: 6px 8px 0 var(--crayon-red), 0 12px 36px var(--shadow);
      padding: 1rem 1.15rem 1.5rem;
      position: relative;
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(200, 160, 100, 0.45);
      border-radius: 4px 20px 8px 6px;
      pointer-events: none;
    }

    .top-bar {
      position: relative;
      z-index: 2;
      padding: 0.45rem 0.9rem;
      margin-bottom: 0.75rem;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(255, 248, 230, 0.96));
      border-radius: 999px;
      border: 3px solid var(--crayon-blue);
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      text-align: center;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.06);
    }
    .top-bar strong {
      color: var(--crayon-red);
    }

    h1.page-title {
      position: relative;
      z-index: 2;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.05rem, 3vw, 1.32rem);
      margin: 0 0 0.65rem;
      color: var(--crayon-red);
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.06);
      line-height: 1.35;
    }

    .phase-jump {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.15rem;
      position: relative;
      z-index: 2;
    }
    .phase-tab {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 0.95rem;
      padding: 0.4rem 0.85rem;
      border: 3px solid var(--crayon-purple);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: inherit;
      font-weight: 700;
      transition: background 0.2s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }
    .phase-tab:hover {
      background: rgba(255, 255, 255, 1);
      border-color: var(--crayon-green);
    }
    .phase-tab.active {
      background: var(--crayon-green);
      color: #fff;
      border-color: var(--crayon-green);
    }

    .phase-panel {
      display: none;
    }
    .phase-panel.is-active {
      display: block;
    }
    .mission-banner {
      position: relative;
      z-index: 2;
      margin: 0 0 0.9rem;
      padding: 0.8rem 0.95rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.84);
      border: 3px dashed rgba(74, 144, 217, 0.28);
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.05);
      font-size: 0.88rem;
      line-height: 1.68;
      color: #37474f;
    }
    .mission-banner strong {
      color: var(--crayon-red);
    }
    .mission-banner code {
      background: rgba(232, 93, 76, 0.1);
      padding: 0.08rem 0.3rem;
      border-radius: 4px;
    }

    .stage-title {
      position: relative;
      z-index: 2;
      font-size: 1.15rem;
      color: var(--crayon-red);
      margin: 0 0 0.45rem;
    }
    .hint {
      position: relative;
      z-index: 2;
      font-size: 0.86rem;
      color: #444;
      line-height: 1.55;
      margin: 0 0 0.75rem;
    }

    .section-rule {
      margin: 1.35rem 0 0.35rem;
      padding-top: 1rem;
      border-top: 3px dashed rgba(200, 160, 100, 0.45);
    }
    #p1.section-rule {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    /* —— 阶段一：双轨变形器 —— */
    .transformer-block {
      position: relative;
      z-index: 2;
      margin-bottom: 0;
    }
    .sentence-stage {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 0.65rem;
      min-height: 6.75rem;
      position: relative;
      perspective: 800px;
    }
    .sentence-rail {
      position: relative;
      width: 100%;
      min-height: 5.85rem;
      padding: 0.95rem 1.1rem;
      border-radius: 14px;
      border: 4px solid rgba(180, 140, 90, 0.5);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }
    .sentence-layer {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 0.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.32rem, 4.2vw, 1.78rem);
      line-height: 1.45;
      text-align: center;
      transition:
        opacity 0.45s ease,
        transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .sentence-layer.habit {
      opacity: 1;
      transform: translateY(-50%) rotateX(0deg) translateZ(0);
      z-index: 2;
    }
    .sentence-layer.now {
      opacity: 0;
      transform: translateY(-50%) rotateX(-88deg) translateZ(-40px);
      z-index: 1;
    }
    .transformer-block.mode-now .sentence-layer.habit {
      opacity: 0;
      transform: translateY(-50%) rotateX(88deg) translateZ(-40px);
    }
    .transformer-block.mode-now .sentence-layer.now {
      opacity: 1;
      transform: translateY(-50%) rotateX(0deg) translateZ(0);
      z-index: 2;
    }
    .hl-habit {
      color: var(--habit-green);
      font-weight: 800;
      text-decoration: underline wavy rgba(46, 125, 50, 0.45);
      text-underline-offset: 3px;
    }
    .hl-now {
      color: var(--now-red);
      font-weight: 800;
      animation: heartbeat 1.1s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.06); }
      55% { transform: scale(1.02); }
    }
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }
    .toggle-labels {
      display: flex;
      justify-content: space-between;
      width: min(100%, 340px);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0 0.25rem;
    }
    .toggle-labels .habit-l { color: var(--habit-green); }
    .toggle-labels .now-l { color: var(--now-red); }
    .crayon-toggle {
      position: relative;
      width: min(100%, 340px);
      height: 52px;
      border-radius: 999px;
      background: linear-gradient(180deg, #e0e0e0, #bdbdbd);
      border: 4px solid #757575;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .crayon-toggle:focus {
      outline: 3px solid var(--crayon-blue);
      outline-offset: 3px;
    }
    .crayon-toggle .thumb {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 8px);
      height: calc(100% - 8px);
      border-radius: 999px;
      background: linear-gradient(180deg, #a5d6a7, #66bb6a);
      border: 3px solid #2e7d32;
      box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.15);
      transition: transform 0.42s cubic-bezier(0.34, 1.3, 0.64, 1), background 0.35s ease, border-color 0.35s ease;
    }
    .crayon-toggle.on-now .thumb {
      transform: translateX(100%);
      background: linear-gradient(180deg, #ffab91, #ff7043);
      border-color: #d84315;
    }

    /* 阶段一：首次切到「此刻」后，例句下方的发现条（非弹窗） */
    .phase1-discovery {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      background: linear-gradient(165deg, rgba(255, 248, 220, 0.98), rgba(230, 245, 255, 0.92));
      border: 3px dashed var(--crayon-orange);
      box-shadow: 2px 3px 0 rgba(240, 173, 78, 0.25);
      text-align: center;
    }
    .phase1-discovery[hidden] {
      display: none !important;
    }
    .phase1-discovery-text {
      margin: 0 0 0.65rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #37474f;
    }
    .phase1-discovery-btn {
      font-family: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.45rem 1.25rem;
      border-radius: 999px;
      border: 3px solid var(--crayon-blue);
      background: linear-gradient(180deg, #e3f2fd, #bbdefb);
      cursor: pointer;
      box-shadow: 2px 3px 0 rgba(74, 144, 217, 0.3);
      touch-action: manipulation;
    }
    .phase1-discovery-btn:active {
      transform: scale(0.98);
    }

    /* —— 阶段二：证据分类 —— */
    .sorting-block {
      position: relative;
      z-index: 2;
    }
    .sorting-layout {
      display: grid;
      grid-template-columns: minmax(200px, 260px) 1fr;
      gap: 1rem;
      align-items: start;
    }
    @media (max-width: 720px) {
      .sorting-layout {
        grid-template-columns: 1fr;
      }
    }
    .sort-desk {
      position: relative;
      border-radius: 12px 16px 14px 10px;
      background: linear-gradient(180deg, #8d6e63, #5d4037 45%, #4e342e);
      border: 4px solid #3e2723;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), 4px 6px 0 rgba(0, 0, 0, 0.15);
      padding: 0.65rem 0.55rem 0.75rem;
      min-height: 220px;
    }
    .sort-desk .desk-mag {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }
    .sort-desk .desk-mag svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.25));
    }
    .drawer {
      display: block;
      width: 100%;
      margin-top: 0.45rem;
      padding: 0.55rem 0.5rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 8px 10px 8px 6px;
      border: 3px solid rgba(0, 0, 0, 0.2);
      cursor: pointer;
      text-align: left;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .drawer-habit {
      background: linear-gradient(180deg, #c8e6c9, #81c784);
      border-color: #2e7d32;
      color: #1b5e20;
      box-shadow: 2px 3px 0 rgba(46, 125, 50, 0.35);
    }
    .drawer-now {
      background: linear-gradient(180deg, #ffccbc, #ff8a65);
      border-color: #bf360c;
      color: #7f0000;
      box-shadow: 2px 3px 0 rgba(191, 54, 12, 0.3);
    }
    .drawer:hover:not(:disabled) {
      transform: translateY(-2px);
    }
    .drawer.drop-target {
      outline: 3px dashed var(--crayon-blue);
      outline-offset: 2px;
    }
    .drawer:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .drawer.pulse-ok {
      animation: drawer-pulse-ok 0.45s ease;
    }
    @keyframes drawer-pulse-ok {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .sort-arena {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      border: 3px solid rgba(180, 140, 90, 0.5);
      padding: 0.75rem;
      min-height: 200px;
    }
    .evidence-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.75rem;
      border-radius: 12px;
      border: 3px dashed rgba(74, 144, 217, 0.55);
      background: rgba(255, 255, 255, 0.95);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .evidence-card:active {
      cursor: grabbing;
    }
    .evidence-card.reject {
      animation: evidence-reject 0.55s ease;
      border-color: var(--crayon-red) !important;
      background: #ffebee !important;
    }
    @keyframes evidence-reject {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(6px); }
    }
    .evidence-card.sink-ok {
      animation: evidence-sink 0.55s ease forwards;
    }
    @keyframes evidence-sink {
      to {
        transform: scale(0.88) translateY(12px);
        opacity: 0.35;
      }
    }
    .evidence-img-wrap {
      flex: 0 0 auto;
      width: 220px;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid rgba(120, 90, 60, 0.35);
      background: linear-gradient(145deg, #eceff1, #cfd8dc);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .evidence-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .evidence-img-wrap .img-ph {
      font-size: 0.8rem;
      color: #666;
      text-align: center;
      padding: 0.25rem;
      line-height: 1.25;
    }
    .evidence-text {
      flex: 1 1 200px;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.08rem, 3.1vw, 1.32rem);
      line-height: 1.45;
      color: #333;
    }
    .sort-clue {
      margin: 0.65rem 0 0;
      font-size: 0.86rem;
      line-height: 1.55;
      color: #1565c0;
      font-weight: 700;
      min-height: 2.8rem;
    }
    .sort-progress {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      color: #555;
      font-weight: 800;
    }
    .sort-done-banner {
      display: none;
      margin-top: 0.65rem;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border: 3px solid var(--habit-green);
      font-size: 0.88rem;
      font-weight: 800;
      color: #1b5e20;
    }
    .sort-done-banner.show {
      display: block;
    }
    .sort-follow {
      margin-top: 0.75rem;
      display: none;
      flex-direction: column;
      gap: 0.45rem;
    }
    .sort-follow.show {
      display: flex;
    }
    .sort-follow-btn {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--crayon-blue);
      padding: 0.45rem 0.6rem;
      border-radius: 10px;
      border: 3px solid var(--crayon-blue);
      background: #e3f2fd;
      text-align: center;
      cursor: pointer;
      width: 100%;
      touch-action: manipulation;
    }
    .sort-follow-btn:hover {
      background: #bbdefb;
    }

    .print-worksheet {
      display: none;
    }

    /* —— 阶段三：侦探 —— */
    .detective-block {
      position: relative;
      z-index: 2;
    }
    .mag-wrap {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
    }
    .mag-icon {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      position: relative;
    }
    .mag-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.1));
    }
    .mag-fly {
      position: fixed;
      width: 56px;
      height: 56px;
      z-index: 200;
      pointer-events: none;
      transition: transform 0.85s cubic-bezier(0.45, 0, 0.2, 1), left 0.85s ease, top 0.85s ease;
    }
    .mag-fly svg {
      width: 56px;
      height: 56px;
      display: block;
    }
    .mag-fly.active {
      transform: scale(1.85);
    }
    .scene-card {
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid rgba(120, 90, 60, 0.4);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.75rem;
      position: relative;
      overflow: hidden;
    }
    .scene-card.probe-sweep .spotlight {
      position: relative;
      z-index: 1;
    }
    .scene-card.probe-sweep .spotlight::after {
      content: "";
      position: absolute;
      left: -120%;
      top: -0.15rem;
      bottom: -0.15rem;
      width: 55%;
      border-radius: 6px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 235, 59, 0.92),
        rgba(255, 213, 79, 0.55),
        transparent
      );
      animation: probe-sweep 1.05s ease-in-out 2;
      pointer-events: none;
    }
    @keyframes probe-sweep {
      0% { left: -120%; }
      100% { left: 130%; }
    }
    .scene-line {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.06rem, 3.1vw, 1.32rem);
      line-height: 1.5;
      margin: 0.25rem 0;
    }
    .spotlight {
      display: inline-block;
      transition: transform 0.35s ease, background 0.35s ease;
      border-radius: 6px;
      padding: 0 0.15rem;
    }
    .spotlight.zoom {
      background: rgba(255, 235, 59, 0.55);
      transform: scale(1.12);
      box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.65);
    }
    .spotlight.signal-pulse {
      animation: signal-pulse 1.15s ease-in-out infinite;
      background: rgba(255, 248, 180, 0.75);
      box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.85);
    }
    @keyframes signal-pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.55); }
      50% { box-shadow: 0 0 0 7px rgba(255, 215, 0, 0.85); }
    }
    .transformer-block.scene-shift .sentence-rail {
      animation: scene-fade 0.6s ease;
    }
    @keyframes scene-fade {
      from { opacity: 0.35; filter: blur(0.08rem); }
      to { opacity: 1; filter: none; }
    }
    .opt-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }
    .opt-btn {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 1.05rem;
      padding: 0.4rem 0.75rem;
      border-radius: 10px;
      border: 3px solid #90a4ae;
      background: #eceff1;
      cursor: pointer;
      transition: transform 0.1s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .opt-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #fff;
    }
    .opt-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .opt-btn.correct-pick {
      border-color: var(--habit-green);
      background: #e8f5e9;
      font-weight: 800;
    }
    .opt-btn.wrong-pick {
      border-color: var(--crayon-red);
      animation: shake-mini 0.45s ease;
    }
    @keyframes shake-mini {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .feedback-line {
      font-size: 0.85rem;
      color: var(--crayon-red);

        xmlEscape(l) +
        "'><voice xml:lang='" +
        xmlEscape(l) +
        "' name='" +
        xmlEscape(voice) +
        "'>" +
        xmlEscape(norm(text)) +
        "</voice></speak>";
      var url = "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1";
      fetch(url, {
        method: "POST",
        headers: {
          "Ocp-Apim-Subscription-Key": key,
          "Content-Type": "application/ssml+xml",
          "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3"
        },
        body: ssml
      })
        .then(function (res) {
          if (!res.ok) {
            return res.text().then(function (t) {
              throw new Error(String(res.status) + " " + t.slice(0, 120));
            });
          }
          return res.blob();
        })
        .then(function (blob) {
          playBlob(blob, resolve);
        })
        .catch(function () {
          resolve();
        });
    });
  }

  /**
   * @param {string} text
   * @param {{ lang?: string }} [opts]  lang 默认 en-US；中文例句用 zh-CN
   */
  function playText(text, opts) {
    opts = opts || {};
    var lang = opts.lang || "en-US";
    var t = norm(text);
    if (!t) return Promise.resolve();
    return tryL03Local(t).then(function (ok) {
      if (ok) return;
      return tryGlobalLocal(t).then(function (ok2) {
        if (ok2) return;
        var key =
          (typeof window !== "undefined" && window.__AZURE_SPEECH_KEY__) ||
          (typeof window !== "undefined" && window.__AZURE_TTS_KEY__) ||
          "";
        if (!key) {
          return Promise.reject(
            new Error(
              "[LessonSpeak] 离线无音频：请补全 assets/tts-mp3 与 manifest，或配置 window.__AZURE_SPEECH_KEY__"
            )
          );
        }
        return speakAzureSsml(t, lang);
      });
    });
  }

  function playEnglish(text) {
    return playText(text, { lang: "en-US" });
  }

  window.LessonSpeak = {
    norm: norm,
    playText: playText,
    playEnglish: playEnglish
  };
})();

</script>

  function shuffleSort(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function setupSortingPhase() {
    buildPrintTable();
    var sortWon = false;
    try {
      sortWon = sessionStorage.getItem(SORT_DONE_KEY) === "1";
    } catch (e) {}
    if (sortWon) {
      applySortSessionWon();
      return;
    }
    state.sortQueue = shuffleSort(SORT_EVIDENCE);
    state.sortQueuePos = 0;
    state.sortComplete = false;
    state.sortBusy = false;

    var card = document.getElementById("evidenceCard");
    var habit = document.getElementById("drawerHabit");
    var now = document.getElementById("drawerNow");
    var banner = document.getElementById("sortDoneBanner");
    banner.classList.remove("show");
    banner.textContent = "";
    document.getElementById("sortFollowLinks").classList.remove("show");
    habit.disabled = false;
    now.disabled = false;
    card.draggable = true;

    function clearDropHighlight() {
      habit.classList.remove("drop-target");
      now.classList.remove("drop-target");
    }

    function onReject() {
      if (state.sortBusy) return;
      state.sortBusy = true;
      card.classList.remove("sink-ok");
      card.classList.add("reject");
      setTimeout(function () {
        card.classList.remove("reject");
        state.sortBusy = false;
      }, 560);
    }

    function tryAnswer(bucket) {
      if (state.sortComplete || state.sortBusy || state.ttsLoading) return;
      var item = getCurrentSortItem();
      if (!item) return;
      if (bucket !== item.bucket) {
        onReject();
        return;
      }
      state.sortBusy = true;
      card.classList.remove("reject");
      card.classList.add("sink-ok");
      var drawerEl = bucket === "habit" ? habit : now;
      drawerEl.classList.add("pulse-ok");
      setTimeout(function () {
        drawerEl.classList.remove("pulse-ok");
      }, 480);
      document.getElementById("sortClueLine").textContent = item.clue;
      speakTtsWeb(item.text).catch(function () {});
      setTimeout(function () {
        card.classList.remove("sink-ok");
        state.sortQueuePos++;
        if (state.sortQueuePos >= state.sortQueue.length) {
          unlockBossAfterSort();
          state.sortBusy = false;
          return;
        }
        renderCurrentEvidence();
        state.sortBusy = false;
      }, 600);
    }

    card.addEventListener("dragstart", function (e) {
      if (state.sortComplete || state.sortBusy) {
        e.preventDefault();
        return;
      }
      try {
        e.dataTransfer.setData("text/plain", "evidence");
        e.dataTransfer.effectAllowed = "move";
      } catch (err) {}
    });

    [habit, now].forEach(function (dr) {
      dr.addEventListener("click", function () {
        tryAnswer(dr.getAttribute("data-bucket"));
      });
      dr.addEventListener("dragover", function (e) {
        e.preventDefault();
        try {
          e.dataTransfer.dropEffect = "move";
        } catch (err) {}
        dr.classList.add("drop-target");
      });
      dr.addEventListener("dragleave", function () {
        dr.classList.remove("drop-target");
      });
      dr.addEventListener("drop", function (e) {
        e.preventDefault();
        clearDropHighlight();
        tryAnswer(dr.getAttribute("data-bucket"));
      });
    });

    document.addEventListener("dragend", clearDropHighlight);

    renderCurrentEvidence();
  }

      mag.id = "magFly";
      mag.className = "mag-fly";
      mag.innerHTML = document.getElementById("magIcon").innerHTML;
      document.body.appendChild(mag);
    }
    var icon = document.getElementById("magIcon");
    var ir = icon.getBoundingClientRect();
    var tr = targetEl.getBoundingClientRect();
    mag.style.left = ir.left + "px";
    mag.style.top = ir.top + "px";
    mag.style.display = "block";
    void mag.offsetWidth;
    requestAnimationFrame(function () {
      mag.style.left = tr.left + tr.width / 2 - 28 + "px";
      mag.style.top = tr.top - 8 + "px";
      mag.classList.add("active");
    });
    setTimeout(function () {
      targetEl.classList.add("zoom");
      if (onDone) onDone();
    }, 820);
    setTimeout(function () {
      mag.style.display = "none";
      mag.classList.remove("active");
      mag.style.left = "";
      mag.style.top = "";
    }, 2800);
  }

  function burstConfetti() {
    var layer = document.getElementById("confettiLayer");
    layer.innerHTML = "";
    var colors = ["#e85d4c", "#43a047", "#4a90d9", "#ffd54f", "#ab47bc", "#ff7043"];
    for (var i = 0; i < 40; i++) {
      var s = document.createElement("span");
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = 1.8 + Math.random() * 1.2 + "s";
      s.style.animationDelay = Math.random() * 0.25 + "s";
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      layer.appendChild(s);
    }
    setTimeout(function () {
      layer.innerHTML = "";
    }, 3000);
  }

  function setupBoss() {
    var bs = document.getElementById("bossSentence");
    var optsWrap = document.getElementById("bossOpts");
    var hint = document.getElementById("bossStepHint");
    var progEl = document.getElementById("bossProgress");
    var srcEl = document.getElementById("bossQSource");
    var winBanner = document.getElementById("winBanner");
    var nextBtn = document.getElementById("nextPageBtn");

    var chainDrill = {
      source:
        "第 1 题：综合「习惯 + today + Be + V-ing」句型，命题思路对齐成都卷完形/阅读高频母题。",
      readAloud: state.copy.bossFullSentence,
      steps: [
        {
          correct: state.copy.optDrives,
          blank: "bossB1",
          classes: ["filled", "habit"],
          hintKey: "bossH1",
          options: [state.copy.optDrives, "drive", "drove", "driving"]
        },
        {
          correct: "is",
          blank: "bossB2",
          classes: ["filled", "be-bridge"],
          hintKey: "bossH2",
          options: ["am", "is", "are", "be"]
        },
        {
          correct: "taking",
          blank: "bossB3",
          classes: ["filled", "now"],
          hintKey: "bossH3",
          options: ["take", "takes", "taking", "taken"]
        },
        {
          correct: "is",
          blank: "bossB4",
          classes: ["filled", "be-bridge"],
          hintKey: "bossH4",
          options: ["am", "is", "are", "was"]
        }
      ]
    };

    var allDrills = [chainDrill].concat(BOSS_SINGLE_DRILLS);
    var bossQuizIndex = 0;

    function updateProgress() {
      progEl.textContent = "Boss 闯关 · 第 " + (bossQuizIndex + 1) + " / 5 题";
    }

    function finishAllBoss() {
      winBanner.classList.add("open");
      burstConfetti();
      nextBtn.classList.add("show");
      speakTtsWeb(allDrills[allDrills.length - 1].readAloud).catch(function () {});
    }

    function advanceBossQuiz() {
      bossQuizIndex++;
      if (bossQuizIndex >= allDrills.length) {
        finishAllBoss();
      } else {
        renderBossQuestion();
      }
    }

    function renderBossQuestion() {
      winBanner.classList.remove("open");
      nextBtn.classList.remove("show");
      optsWrap.querySelectorAll(".opt-btn").forEach(function (x) {
        x.remove();
      });

      var d = allDrills[bossQuizIndex];
      srcEl.textContent = d.source;
      updateProgress();

      if (d.steps) {
        bs.innerHTML =
          'My father usually <span class="boss-blank" id="bossB1">_____</span> (drive) to work, but today he <span class="boss-blank" id="bossB2">_____</span> <span class="boss-blank" id="bossB3">_____</span> (take) the subway because his car <span class="boss-blank" id="bossB4">_____</span> broken.';

        function showBossStep(stepIndex) {
          optsWrap.querySelectorAll(".opt-btn").forEach(function (x) {
            x.remove();
          });
          if (stepIndex >= d.steps.length) {
            return;
          }
          var st = d.steps[stepIndex];
          hint.textContent = state.copy[st.hintKey];
          st.options.forEach(function (label) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "opt-btn";
            btn.textContent = label;
            btn.addEventListener("click", function () {
              if (state.ttsLoading) {
                return;
              }
              if (label === st.correct) {
                btn.classList.add("correct-pick");
                var el = document.getElementById(st.blank);
                el.textContent = label;
                st.classes.forEach(function (c) {
                  el.classList.add(c);
                });
                optsWrap.querySelectorAll(".opt-btn").forEach(function (x) {
                  x.disabled = true;
                });
                var next = stepIndex + 1;
                if (next >= d.steps.length) {
                  setTimeout(function () {
                    advanceBossQuiz();
                  }, 380);
                } else {
                  setTimeout(function () {
                    showBossStep(next);
                  }, 380);
                }
              } else {
                btn.classList.add("wrong-pick");
                setTimeout(function () {
                  btn.classList.remove("wrong-pick");
                }, 450);
              }
            });
            optsWrap.appendChild(btn);
          });
        }

        showBossStep(0);
      } else {
        hint.textContent = d.hint;
        bs.innerHTML = d.sentenceHtml;
        d.options.forEach(function (label) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt-btn";
          btn.textContent = label;
          btn.addEventListener("click", function () {
            if (state.ttsLoading) {
              return;
            }
            if (label === d.correct) {
              btn.classList.add("correct-pick");
              var el = document.getElementById("bossSingleBlank");
              el.textContent = label;
              d.blankClasses.forEach(function (c) {
                el.classList.add(c);
              });
              optsWrap.querySelectorAll(".opt-btn").forEach(function (x) {
                x.disabled = true;
              });
              setTimeout(function () {
                advanceBossQuiz();
              }, 380);
            } else {
              btn.classList.add("wrong-pick");
              setTimeout(function () {
                btn.classList.remove("wrong-pick");
              }, 450);
            }
          });
          optsWrap.appendChild(btn);
        });
      }
    }

    renderBossQuestion();
  }

  renderAllCopy();
  updateMissionBanner(1);
  buildMagSvg();
  document.getElementById("phase1DiscoveryOk").addEventListener("click", function () {
    var d = document.getElementById("phase1Discovery");
    if (d) d.hidden = true;
  });
  setupPhase1();
  setupSortingPhase();
  initDetectiveScenes();
  if (!bossSetupDone) {
    bossSetupDone = true;
    setupBoss();
  }

  document.getElementById("nextPageBtn").addEventListener("click", function () {
    window.location.href = "lesson02-page06-force5.html";
  });
})();
  </script>
