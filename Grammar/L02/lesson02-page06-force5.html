  <script>
(function () {
  "use strict";

  var QUESTION_BANK = JSON.parse(
    document.getElementById("force5QuestionBank").textContent
  );

  var state = {
    ttsLoading: false,
    correctCount: 0,
    attemptsUsed: 0,
    maxAttempts: 6,
    starsTarget: 5,
    sessionUsedIndices: [],
    lastQIndex: -1,
    currentQ: null,
    shuffledOptions: [],
    answeringLocked: false
  };

  var ttsLockOverlay = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function pickQuestionIndex() {
    var avail = [];
    var u = state.sessionUsedIndices;
    var i;
    for (i = 0; i < QUESTION_BANK.length; i++) {
      if (u.indexOf(i) === -1) {
        avail.push(i);
      }
    }
    if (avail.length === 0) {
      for (i = 0; i < QUESTION_BANK.length; i++) {
        avail.push(i);
      }
    }
    var pick = avail[Math.floor(Math.random() * avail.length)];
    u.push(pick);
    state.lastQIndex = pick;
    return pick;
  }

  function setTtsLoading(on) {
    state.ttsLoading = on;
    if (on) {
      document.body.classList.add("tts-busy");
      if (!ttsLockOverlay) {
        ttsLockOverlay = document.createElement("div");
        ttsLockOverlay.className = "tts-lock-overlay";
        ttsLockOverlay.setAttribute("aria-hidden", "true");
        document.body.appendChild(ttsLockOverlay);
      }
    } else {
      document.body.classList.remove("tts-busy");
      if (ttsLockOverlay && ttsLockOverlay.parentNode) {
        ttsLockOverlay.remove();
        ttsLockOverlay = null;
      }
    }
  }

  var ttsWatchdog = null;
  function armTtsWatchdog() {
    if (ttsWatchdog) clearTimeout(ttsWatchdog);
    ttsWatchdog = setTimeout(function () {
      ttsWatchdog = null;
      state.ttsLoading = false;
      setTtsLoading(false);
    }, 3000);
  }
  function clearTtsWatchdog() {
    if (ttsWatchdog) {
      clearTimeout(ttsWatchdog);
      ttsWatchdog = null;
    }
  }
  function speakTtsWeb(text) {
    if (!window.LessonSpeak || !window.LessonSpeak.playEnglish) {
      return Promise.resolve();
    }
    return window.LessonSpeak.playEnglish(String(text || ""));
  }
  function withTtsLock(fn) {
    if (state.ttsLoading) return Promise.resolve();
    state.ttsLoading = true;
    setTtsLoading(true);
    armTtsWatchdog();
    return Promise.resolve()
      .then(fn)
      .catch(function () {})
      .finally(function () {
        clearTtsWatchdog();
        state.ttsLoading = false;
        setTtsLoading(false);
      });
  }
  function speakTts(text) {
    return withTtsLock(function () {
      return speakTtsWeb(text);
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderBoardSentence(q, blankText, filledClass) {
    var parts = q.sentenceTpl.split("______");
    var html =
      escapeHtml(parts[0]) +
      '<span class="arena-blank' +
      (filledClass ? " filled " + filledClass : "") +
      '" id="arenaBlank">' +
      (blankText ? escapeHtml(blankText) : "") +
      "</span>" +
      escapeHtml(parts[1] || "");
    document.getElementById("boardSentence").innerHTML = html;
  }

  function buildResolvedSentence(q, answer) {
    return q.sentenceTpl.replace("______", answer);
  }

  function updateStars() {
    var stars = document.querySelectorAll(".star");
    var n = state.correctCount;
    var i;
    for (i = 0; i < stars.length; i++) {
      stars[i].classList.toggle("lit", i < n);
      stars[i].classList.remove("shatter");
    }
  }

  function showTrap(title, body) {
    document.getElementById("trapTitle").textContent = title;
    document.getElementById("trapBody").textContent = body;
    document.getElementById("trapModal").classList.add("show");
  }

  function hideTrap() {
    document.getElementById("trapModal").classList.remove("show");
  }

  function showLose() {
    document.getElementById("loseOverlay").classList.add("show");
  }

  function hideLose() {
    document.getElementById("loseOverlay").classList.remove("show");
  }

  function hideWin() {
    document.getElementById("winOverlay").classList.remove("show");
  }

  function resetRound() {
    state.correctCount = 0;
    state.attemptsUsed = 0;
    state.sessionUsedIndices = [];
    state.lastQIndex = -1;
    updateStars();
    hideLose();
    hideWin();
    loadQuestion();
  }

  function loadQuestion() {
    state.answeringLocked = false;
    var qi = pickQuestionIndex();
    state.currentQ = QUESTION_BANK[qi];
    state.shuffledOptions = shuffle(state.currentQ.options.slice());
    document.getElementById("qSource").textContent =
      state.currentQ.source || "";
    renderBoardSentence(state.currentQ, "", "");
    var row = document.getElementById("optRow");
    row.innerHTML = "";
    state.shuffledOptions.forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt-btn";
      b.textContent = opt.text;
      b.dataset.correct = opt.correct ? "1" : "0";
      b.dataset.tip = opt.tip || "";
      b.addEventListener("click", onOptionClick);
      row.appendChild(b);
    });
  }

  function onOptionClick(ev) {
    var btn = ev.currentTarget;
    if (state.ttsLoading || state.answeringLocked) {
      return;
    }
    var isCorrect = btn.dataset.correct === "1";
    var q = state.currentQ;

    if (isCorrect) {
      state.answeringLocked = true;
      document.querySelectorAll(".opt-btn").forEach(function (b) {
        b.disabled = true;
      });
      var tone =
        q.fillTone === "now"
          ? "now"
          : q.fillTone === "state"
            ? "state"
            : "habit";
      renderBoardSentence(q, q.correctText, tone);
      var blankEl = document.getElementById("arenaBlank");
      if (blankEl) {
        blankEl.classList.add("fly-in");
        setTimeout(function () {
          blankEl.classList.remove("fly-in");
        }, 500);
      }
      state.correctCount++;
      state.attemptsUsed++;
      updateStars();
      var line = buildResolvedSentence(q, q.correctText);
      speakTtsWeb(line).catch(function () {});
      setTimeout(function () {
        if (state.correctCount >= state.starsTarget) {
          burstConfetti();
          document.getElementById("winOverlay").classList.add("show");
          return;
        }
        if (state.attemptsUsed >= state.maxAttempts) {
          showLose();
          return;
        }
        loadQuestion();
      }, 700);
    } else {
      state.answeringLocked = true;
      document.querySelectorAll(".opt-btn").forEach(function (b) {
        b.disabled = true;
      });
      btn.classList.add("wrong-burst");
      setTimeout(function () {
        btn.classList.remove("wrong-burst");
      }, 560);
      state.attemptsUsed++;
      var tip = btn.dataset.tip || "再读一遍题干里的时间信号词与主语哦。";
      if (state.attemptsUsed >= state.maxAttempts && state.correctCount < state.starsTarget) {
        setTimeout(function () {
          showLose();
        }, 580);
      } else {
        setTimeout(function () {
          showTrap("名师警告 · 防守失误", tip);
        }, 200);
      }
    }
  }

  document.getElementById("trapOk").addEventListener("click", function () {
    hideTrap();
    if (state.attemptsUsed >= state.maxAttempts && state.correctCount < state.starsTarget) {
      showLose();
    } else {
      loadQuestion();
    }
  });

  document.getElementById("loseRetry").addEventListener("click", function () {
    hideTrap();
    resetRound();
  });

  document.getElementById("winContinueBtn").addEventListener("click", function () {
    resetRound();
  });

  function burstConfetti() {
    var layer = document.getElementById("confettiLayer");
    layer.innerHTML = "";
    var colors = [
      "#e85d4c",
      "#43a047",
      "#4a90d9",
      "#ffd54f",
      "#ff8f00",
      "#ab47bc"
    ];
    var i;
    for (i = 0; i < 48; i++) {
      var s = document.createElement("span");
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = 1.9 + Math.random() * 1.4 + "s";
      s.style.animationDelay = Math.random() * 0.2 + "s";
      s.style.background = colors[Math.floor(Math.random() * colors.length)];
      layer.appendChild(s);
    }
    setTimeout(function () {
      layer.innerHTML = "";
    }, 3500);
  }

  updateStars();
  loadQuestion();
})();
  </script>
