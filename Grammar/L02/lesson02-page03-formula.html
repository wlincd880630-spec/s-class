/**

 */

  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);

  <script>
/* inlined: assets/lesson-speak-local.js */
/**
 * 统一朗读：优先 L03 专用 manifest → 全局 tts-manifest 本地 MP3 → Azure SSML（需 window.__AZURE_SPEECH_KEY__）。
 * 不使用浏览器 speechSynthesis。请在 tts-manifest.js / l03-audio-manifest.js 与对应 mp3 就绪后离线使用。
 */
(function () {
  "use strict";

  function norm(s) {
    return String(s || "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function xmlEscape(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function playBlob(blob, resolve) {
    var u = URL.createObjectURL(blob);
    var a = new Audio(u);
    var done = false;
    function fin() {
      if (done) return;
      done = true;
      try {
        URL.revokeObjectURL(u);
      } catch (e) {}
      resolve();
    }
    a.onended = fin;
    a.onerror = fin;
    var p = a.play();
    if (p && typeof p.catch === "function") p.catch(fin);
    setTimeout(fin, 60000);
  }

  function tryL03Local(t) {
    return new Promise(function (resolve) {
      var E = typeof window !== "undefined" && window.L03AudioManifest && window.L03AudioManifest.entries;
      if (!E) {
        resolve(false);
        return;
      }
      var rel = E[t] || E[norm(t)];
      if (!rel) {
        resolve(false);
        return;
      }
      if (typeof window.playLocalMp3Url === "function") {

        return window.playLocalMp3Url(rel).then(function (ok) {

          if (!ok) console.warn("(!!ok);

        });

      }

      var a = new Audio(rel);
      var done = false;
      function fin(ok) {
        if (done) return;
        done = true;
        resolve(!!ok);
      }
      a.onended = function () {
        fin(true);
      };
      a.onerror = function () {
        fin(false);
      };
      var p = a.play();
      if (p && typeof p.catch === "function") {
        p.catch(function () {
          fin(false);
        });
      }
    });
  }

  function tryGlobalLocal(t) {
    if (!window.LessonTTSBootstrap || !window.LessonTTSBootstrap.playLocalIfAvailable) {
      return Promise.resolve(false);
    }
    return window.LessonTTSBootstrap.playLocalIfAvailable(t);
  }

  function speakAzureSsml(text, lang) {
    return new Promise(function (resolve) {
      var key =
        (typeof window !== "undefined" && window.__AZURE_SPEECH_KEY__) ||
        (typeof window !== "undefined" && window.__AZURE_TTS_KEY__) ||
        "";
      var region =
        (typeof window !== "undefined" && window.__AZURE_SPEECH_REGION__) ||
        (typeof window !== "undefined" && window.__AZURE_TTS_REGION__) ||
        "southeastasia";
      if (!key) {
        console.error(
          "[LessonSpeak] 无离线语音：manifest 未命中或 assets/tts-mp3 中缺少对应文件，且未配置 window.__AZURE_SPEECH_KEY__。朗读文本预览:",
          String(text).slice(0, 120)
        );
        resolve();
        return;
      }
      var l = lang || "en-US";
      var voice = /^zh/i.test(l) ? "zh-CN-YunxiNeural" : "en-US-JennyNeural";
      var ssml =
        "<speak version='1.0' xml:lang='" +
        xmlEscape(l) +
        "'><voice xml:lang='" +
        xmlEscape(l) +
        "' name='" +
        xmlEscape(voice) +
        "'>" +
        xmlEscape(norm(text)) +
        "</voice></speak>";
      var url = "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1";
      fetch(url, {
        method: "POST",
        headers: {
          "Ocp-Apim-Subscription-Key": key,
          "Content-Type": "application/ssml+xml",
          "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3"
        },
        body: ssml
      })
        .then(function (res) {
          if (!res.ok) {
            return res.text().then(function (t) {
              throw new Error(String(res.status) + " " + t.slice(0, 120));
            });
          }
          return res.blob();
        })
        .then(function (blob) {
          playBlob(blob, resolve);
        })
        .catch(function () {
          resolve();
        });
    });
  }

  /**
   * @param {string} text
   * @param {{ lang?: string }} [opts]  lang 默认 en-US；中文例句用 zh-CN
   */
  function playText(text, opts) {
    opts = opts || {};
    var lang = opts.lang || "en-US";
    var t = norm(text);
    if (!t) return Promise.resolve();
    return tryL03Local(t).then(function (ok) {
      if (ok) return;
      return tryGlobalLocal(t).then(function (ok2) {
        if (ok2) return;
        var key =
          (typeof window !== "undefined" && window.__AZURE_SPEECH_KEY__) ||
          (typeof window !== "undefined" && window.__AZURE_TTS_KEY__) ||
          "";
        if (!key) {
          return Promise.reject(
            new Error(
              "[LessonSpeak] 离线无音频：请补全 assets/tts-mp3 与 manifest，或配置 window.__AZURE_SPEECH_KEY__"
            )
          );
        }
        return speakAzureSsml(t, lang);
      });
    });
  }

  function playEnglish(text) {
    return playText(text, { lang: "en-US" });
  }

  window.LessonSpeak = {
    norm: norm,
    playText: playText,
    playEnglish: playEnglish
  };
})();

</script>

  <script>
(function () {
  "use strict";

  /** 漏装 Be / V-ing 直接接主语 —— 与第 1 讲「动作家族 / 状态家族」联动 */
  var ERR_MISS_BE_BODY =
    "【动作家族】的 V-ing 齿轮带刺，不能直接接主语！必须向【状态家族】借用 am / is / are 当传动轴！";

  var LEVELS = [
    {
      subject: "I",
      tail: "the room now.",
      be: "am",
      ving: "cleaning",
      pool: ["is", "are", "clean", "am", "cleaning"]
    },
    {
      subject: "The boys",
      tail: "a football match.",
      be: "are",
      ving: "watching",
      pool: ["is", "watch", "watches", "are", "watching"]
    },
    {
      subject: "Look! Emma",
      tail: "an English book.",
      be: "is",
      ving: "reading",
      pool: ["are", "read", "reading", "is", "am", "plays"]
    }
  ];

  var state = {
    round: 0,
    completed: 0,
    ttsLoading: false,
    slot2: null,
    slot3: null,
    selected: null,
    successRunning: false,
    awaitingNextRound: false,
    dragWord: null
  };

  function makeConicGearBackground(color) {
    var parts = [];
    var i;
    for (i = 0; i < 18; i++) {
      var a = i * 20;
      parts.push(color + " " + a + "deg " + (a + 10) + "deg");
      parts.push("rgba(0,0,0,0.14) " + (a + 10) + "deg " + (a + 20) + "deg");
    }
    return "conic-gradient(from 0deg, " + parts.join(", ") + ")";
  }

  function makeGearHTML(word, color, spinClass) {
    var sc = spinClass ? ' class="gear-visual ' + spinClass + '"' : ' class="gear-visual"';
    var bg = makeConicGearBackground(color);
    return (
      "<div" +
      sc +
      '><div class="gear-disk" style="background-image:' +
      bg +
      '"></div><span class="gear-word">' +
      escapeHtml(word) +
      "</span></div>"
    );
  }

  function setBridgeBreak(on) {
    var el = document.getElementById("bridgeX");
    var miss = document.getElementById("bridgeMissBe");
    if (el) {
      el.textContent = on ? "\u2716" : "";
      el.classList.toggle("show", !!on);
    }
    if (miss) {
      miss.textContent = on ? "[ \u7f3a\u5c11 Be \u52a8\u8bcd\u6865\u6881 ]" : "";
      miss.classList.toggle("show", !!on);
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var BE_SET = { is: 1, am: 1, are: 1 };

  function isBe(w) {
    return !!BE_SET[w];
  }

  function isVingForm(w) {
    if (!w || w.length < 4) return false;
    return /ing$/i.test(w);
  }

  function isBaseVerb(w) {
    if (isBe(w) || isVingForm(w)) return false;
    return /^[a-zA-Z]+$/.test(w);
  }

  function expectedBe(subject) {
    if (subject === "I") return "am";
    if (/^The boys\b/i.test(subject)) return "are";
    return "is";
  }

  function currentLevel() {
    return LEVELS[state.round];
  }

  var ttsLockOverlay = null;
  function setTtsLoading(on) {
    state.ttsLoading = on;
    if (on) {
      document.body.classList.add("tts-busy");
      if (!ttsLockOverlay) {
        ttsLockOverlay = document.createElement("div");
        ttsLockOverlay.className = "tts-lock-overlay";
        ttsLockOverlay.setAttribute("aria-hidden", "true");
        document.body.appendChild(ttsLockOverlay);
      }
    } else {
      document.body.classList.remove("tts-busy");
      if (ttsLockOverlay && ttsLockOverlay.parentNode) {
        ttsLockOverlay.remove();
        ttsLockOverlay = null;
      }
    }
  }

  var ttsWatchdog = null;
  function armTtsWatchdog() {
    if (ttsWatchdog) clearTimeout(ttsWatchdog);
    ttsWatchdog = setTimeout(function () {
      ttsWatchdog = null;
      state.ttsLoading = false;
      setTtsLoading(false);
    }, 3000);
  }
  function clearTtsWatchdog() {
    if (ttsWatchdog) {
      clearTimeout(ttsWatchdog);
      ttsWatchdog = null;
    }
  }
  function speakTtsWeb(text) {
    if (!window.LessonSpeak || !window.LessonSpeak.playEnglish) {
      return Promise.resolve();
    }
    return window.LessonSpeak.playEnglish(String(text || ""));
  }
  function withTtsLock(fn) {
    if (state.ttsLoading) return Promise.resolve();
    state.ttsLoading = true;
    setTtsLoading(true);
    armTtsWatchdog();
    return Promise.resolve()
      .then(fn)
      .catch(function () {})
      .finally(function () {
        clearTtsWatchdog();
        state.ttsLoading = false;
        setTtsLoading(false);
      });
  }
  function speakTts(text) {
    return withTtsLock(function () {
      return speakTtsWeb(text);
    });
  }

  function playJamSound() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var filter = ctx.createBiquadFilter();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(90, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.2);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    } catch (e) {}
  }

  function showModal(title, body) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").textContent = body;
    document.getElementById("teacherModal").classList.add("show");
  }

  function hideModal() {
    document.getElementById("teacherModal").classList.remove("show");
  }

  document.getElementById("modalOk").addEventListener("click", hideModal);

  function triggerJamVisual() {
    document.body.classList.add("jam-shake");
    var rail = document.getElementById("gearRail");
    if (rail) {
      rail.classList.add("smoke-shake");
      setTimeout(function () {
        rail.classList.remove("smoke-shake");
      }, 560);
    }
    playJamSound();
    setTimeout(function () {
      document.body.classList.remove("jam-shake");
    }, 450);
  }

  function clearSelection() {
    state.selected = null;
    document.querySelectorAll(".part-gear").forEach(function (el) {
      el.classList.remove("selected");
    });
  }

  function updatePreview() {
    var L = currentLevel();
    var parts = [];
    parts.push(L.subject);
    parts.push(state.slot2 || "___");
    parts.push(state.slot3 || "___");
    parts.push(L.tail);
    document.getElementById("sentencePreview").textContent = parts.join(" ");
  }

  function renderSubjectGear() {
    var g1 = document.getElementById("gear1");
    g1.innerHTML = makeGearHTML(currentLevel().subject, "#4a90d9", "");
  }

  function fillSlot2(word, spinClass) {
    var el = document.getElementById("slot2");
    el.classList.add("slot-filled");
    el.innerHTML = makeGearHTML(word, "#43a047", spinClass || "");
    state.slot2 = word;
  }

  function fillSlot3(word, spinClass) {
    var el = document.getElementById("slot3");
    el.classList.add("slot-filled");
    el.innerHTML = makeGearHTML(word, "#ff8f00", spinClass || "");
    state.slot3 = word;
  }

  function emptySlot2() {
    var el = document.getElementById("slot2");
    el.classList.remove("slot-filled", "slot-danger");
    el.innerHTML = "";
    state.slot2 = null;
    setBridgeBreak(false);
  }

  function emptySlot3() {
    var el = document.getElementById("slot3");
    el.classList.remove("slot-filled", "slot-slip");
    el.innerHTML = "";
    state.slot3 = null;
    setBridgeBreak(false);
  }

  function buildParts() {
    var row = document.getElementById("partsRow");
    row.innerHTML = "";
    var pool = currentLevel().pool.slice();
    var used = [];
    if (state.slot2) used.push(state.slot2);
    if (state.slot3) used.push(state.slot3);
    pool.forEach(function (w) {
      if (used.indexOf(w) !== -1) return;
      var wrap = document.createElement("div");
      wrap.className = "part-gear";
      wrap.dataset.word = w;
      wrap.setAttribute("draggable", "true");
      wrap.innerHTML = makeGearHTML(w, "#78909c", "");
      wrap.addEventListener("click", function () {
        if (state.successRunning || state.ttsLoading || state.awaitingNextRound)
          return;
        document.querySelectorAll(".part-gear").forEach(function (x) {
          x.classList.remove("selected");
        });
        wrap.classList.add("selected");
        state.selected = w;
      });
      wrap.addEventListener("dragstart", function (e) {
        if (state.awaitingNextRound) {
          e.preventDefault();
          return;
        }
        state.dragWord = w;
        wrap.classList.add("dragging");
        try {
          e.dataTransfer.setData("text/plain", w);
          e.dataTransfer.effectAllowed = "move";
        } catch (err) {}
      });
      wrap.addEventListener("dragend", function () {
        wrap.classList.remove("dragging");
        state.dragWord = null;
      });
      row.appendChild(wrap);
    });
  }

  function removePartFromTray(word) {
    document.querySelectorAll(".part-gear").forEach(function (el) {
      if (el.dataset.word === word) el.remove();
    });
  }

  function returnWordToTray(word) {
    buildParts();
  }

  function tryPlace(word, slotNum) {
    if (
      state.successRunning ||
      state.ttsLoading ||
      state.awaitingNextRound
    )
      return;
    var L = currentLevel();
    var exp = expectedBe(L.subject);

    if (slotNum === 2) {
      if (isVingForm(word)) {
        var s2 = document.getElementById("slot2");
        s2.classList.add("slot-danger");
        setBridgeBreak(true);
        triggerJamVisual();
        showModal("🚨 危险！", ERR_MISS_BE_BODY);
        setTimeout(function () {
          s2.classList.remove("slot-danger");
          setBridgeBreak(false);
        }, 500);
        return;
      }
      if (!isBe(word)) {
        showModal("提示", "请把 Be 动词（am / is / are）装进槽 2。");
        return;
      }
      if (word !== exp) {
        removePartFromTray(word);
        fillSlot2(word, "");
        setTimeout(function () {
          triggerJamVisual();
          showModal(
            "🔧 齿轮型号不匹配！",
            "记得口诀：我用 am，你用 are，is 连着他/她/它！"
          );
          emptySlot2();
          returnWordToTray(word);
        }, 380);
        return;
      }
      removePartFromTray(word);
      fillSlot2(word, "");
      setBridgeBreak(false);
      clearSelection();
      updatePreview();
      return;
    }

    if (slotNum === 3) {
      if (!state.slot2) {
        if (isBe(word)) {
          showModal(
            "提示",
            "这是 Be 动词！请把它装进槽 2（传动轴），不要装进槽 3。"
          );
          return;
        }
        if (isVingForm(word)) {
          var s3a = document.getElementById("slot3");
          s3a.classList.add("slot-danger");
          setBridgeBreak(true);
          triggerJamVisual();
          showModal("🚨 危险！", ERR_MISS_BE_BODY);
          setTimeout(function () {
            s3a.classList.remove("slot-danger");
            setBridgeBreak(false);
          }, 500);
          return;
        }
        setBridgeBreak(true);
        showModal(
          "🚨 危险！",
          "槽 2 还是空的！必须先用【状态家族】的 am / is / are 当传动轴，再装【动作家族】的 V-ing 齿轮。"
        );
        triggerJamVisual();
        setTimeout(function () {
          setBridgeBreak(false);
        }, 650);
        return;
      }

      var beOk = state.slot2 === exp;

      if (isBe(word)) {
        showModal("提示", "槽 3 请装入带 -ing 的动作齿轮，不是 Be 动词哦。");
        return;
      }

      if (beOk && isBaseVerb(word)) {
        removePartFromTray(word);
        var s3 = document.getElementById("slot3");
        fillSlot3(word, "");
        s3.classList.add("slot-slip");
        setTimeout(function () {
          showModal(
            "⚙️ 原形动词太平滑了！",
            "无法带动机器！进行时机器必须使用带锯齿的 -ing 齿轮！"
          );
          emptySlot3();
          returnWordToTray(word);
          s3.classList.remove("slot-slip");
          updatePreview();
        }, 520);
        return;
      }

      if (word !== L.ving) {
        triggerJamVisual();
        showModal("再试试", "这个齿轮和当前句意不太合拍，换一个 V-ing 试试。");
        return;
      }

      removePartFromTray(word);
      fillSlot3(word, "");
      setBridgeBreak(false);
      clearSelection();
      updatePreview();
      checkSuccess();
    }
  }

  function checkSuccess() {
    var L = currentLevel();
    if (state.slot2 !== L.be || state.slot3 !== L.ving) return;

    state.successRunning = true;
    document.getElementById("book").classList.add("success-glow");
    document.getElementById("formulaCard").classList.add("show");

    var g1 = document.getElementById("slot1").querySelector(".gear-visual");
    var g2 = document.getElementById("slot2").querySelector(".gear-visual");
    var g3 = document.getElementById("slot3").querySelector(".gear-visual");
    if (g1) {
      g1.classList.add("spin-cw");
      g1.classList.remove("spin-ccw");
    }
    if (g2) {
      g2.classList.add("spin-ccw");
      g2.classList.remove("spin-cw");
    }
    if (g3) {
      g3.classList.add("spin-cw");
      g3.classList.remove("spin-ccw");
    }

    var sentence =
      L.subject +
      " " +
      L.be +
      " " +
      L.ving +
      " " +
      L.tail;

    speakTtsWeb(sentence).catch(function () {});
    setTimeout(function () {
      state.completed++;
      document.getElementById("progressBadge").textContent =
        state.completed + " / 3 组装完成";
      state.successRunning = false;
      document.getElementById("book").classList.remove("success-glow");
      document.getElementById("formulaCard").classList.remove("show");
      if (g1) {
        g1.classList.remove("spin-cw", "spin-ccw");
      }
      if (g2) {
        g2.classList.remove("spin-cw", "spin-ccw");
      }
      if (g3) {
        g3.classList.remove("spin-cw", "spin-ccw");
      }

      if (state.completed >= 3) {
        document.getElementById("unlockBar").classList.add("show");
        return;
      }
      state.awaitingNextRound = true;
      document.getElementById("nextRoundBar").classList.add("show");
      var btn = document.getElementById("btnNextRound");
      if (btn) btn.focus();
    }, 720);
  }

  function goToNextRound() {
    if (state.ttsLoading || !state.awaitingNextRound) return;
    state.awaitingNextRound = false;
    document.getElementById("nextRoundBar").classList.remove("show");
    clearSelection();
    state.round++;
    state.slot2 = null;
    state.slot3 = null;
    emptySlot2();
    emptySlot3();
    renderSubjectGear();
    updatePreview();
    buildParts();
  }

  function attachSlotHandlers() {
    [2, 3].forEach(function (n) {
      var slot = document.getElementById("slot" + n);
      slot.addEventListener("click", function () {
        if (
          state.successRunning ||
          state.ttsLoading ||
          state.awaitingNextRound
        )
          return;
        if (state.selected) {
          tryPlace(state.selected, n);
        }
      });
      slot.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          slot.click();
        }
      });
      slot.addEventListener("dragover", function (e) {
        e.preventDefault();
        try {
          e.dataTransfer.dropEffect = "move";
        } catch (err) {}
        slot.classList.add("drop-target");
      });
      slot.addEventListener("dragleave", function () {
        slot.classList.remove("drop-target");
      });
      slot.addEventListener("drop", function (e) {
        e.preventDefault();
        slot.classList.remove("drop-target");
        if (state.awaitingNextRound) return;
        var w =
          (e.dataTransfer && e.dataTransfer.getData("text/plain")) ||
          state.dragWord;
        if (w) tryPlace(w, n);
      });
    });
  }

  function init() {
    renderSubjectGear();
    updatePreview();
    buildParts();
    attachSlotHandlers();
    document
      .getElementById("btnNextRound")
      .addEventListener("click", goToNextRound);
  }

  init();
})();
  </script>
