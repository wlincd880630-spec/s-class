  <script>
    (function () {
      const $ = (s, r) => (r || document).querySelector(s);
      const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
      const socraticMeta = $("#socratic-meta");
      const socraticQ = $("#socratic-q");
      const socraticA = $("#socratic-a");
      const btnSocraticShow = $("#btn-socratic-show");
      const btnSocraticNext = $("#btn-socratic-next");
      const comicFigs = $$("#p07-guide .p07-comic");
      const socraticPanel = $("#p07-socratic");
      const socraticRecap = $("#socratic-recap");
      const socraticRows = [$("#p07-row-0"), $("#p07-row-1"), $("#p07-row-2")].filter(Boolean);

      const recapByPanel = { 0: [], 1: [], 2: [] };

      const PANEL_LABELS = ["图① 公园散步", "图② 发现受伤小鸟", "图③ 送往诊所"];
      const SOCRATIC = [
        {
          panel: 0,
          q: "看到第一格，你会用哪些英文词交代「地点」和「时间」，让读者知道这是在公园、在散步？",
          a: "可写 in the park、on a path、last Sunday afternoon 等。地点名词要具体，时间可用 last… / yesterday 与全文过去时一致。"
        },
        {
          panel: 0,
          q: "题目要求用 While + was/were + doing 铺背景。主语用 I 时，你打算用什么「进行中的动作」来对应「散步」？",
          a: "常见自然写法：While I was walking… / While I was taking a walk… 注意 was + walk 的 -ing：walking。"
        },
        {
          panel: 0,
          q: "这一格只负责「背景」，要不要现在就写 came across？为什么？",
          a: "先不写更清楚：本格聚焦「正在做什么」；把 came across 留给第二格，叙事有「背景 → 突变」的节奏。"
        },
        {
          panel: 0,
          q: "若写 While we were walking，后面主句主语通常怎么衔接，指代才不乱？",
          a: "可统一用 we… 或第二格改回 I…；人称在全文要前后一致，不要 we / I 随意跳。"
        },
        {
          panel: 1,
          q: "「偶然遇见」题目里推荐哪个短语？请用中文说清它的意思，再想一句英文骨架。",
          a: "came across 表示偶然碰见。骨架示例：…, I came across a small bird on the grass."
        },
        {
          panel: 1,
          q: "从「过去进行」转到「发生了一件事」，时态上你准备怎么接？写出一个 while 从句 + 主句的框架。",
          a: "While I was walking in the park, I came across … 从 was/were doing 过渡到一般过去式 came across，表短促结果。"
        },
        {
          panel: 1,
          q: "描写受伤小鸟，你想积累哪两三个形容词或分词？它们要修饰谁（the bird）？",
          a: "如 hurt、injured、weak、shaking；写成 a hurt bird / a little bird with a broken wing，注意名词短语结构。"
        },
        {
          panel: 1,
          q: "came across 后面接宾语从句可以吗？本图更推荐先写「物」还是直接写「发现它受伤了」？",
          a: "可先接物：came across a bird，再用并列或定语从句补充状态；避免一句堆太多从句，先写清「遇见什么」。"
        },
        {
          panel: 2,
          q: "题目要求至少一处 when 从句。你准备让 when 表示「一看到就……」还是「到了某地之后……」？",
          a: "两种皆可：When I saw …, I … / When we got to the pet clinic, … 关键是 when 从句与主句动作有清晰时间关系。"
        },
        {
          panel: 2,
          q: "found out 可以接什么内容，才能和「送诊所」自然连上？",
          a: "接获知的信息：I found out (that) it had a broken wing. / We found out the vet could help. 用 that 从句或宾语说明「知道了什么」。"
        },
        {
          panel: 2,
          q: "「把小鸟送去求助」常用哪个动词？宾语用 it 还是 the bird 更自然？",
          a: "常用 took / carried / rushed：We took it to a nearby clinic. 上文已提 bird，用 it 避免重复，但要前后指代清楚。"
        },
        {
          panel: 2,
          q: "短文结尾你想表达什么情感或结果？用一句英文收束时，时态用过去式可以吗？",
          a: "可以：I felt relieved. / The bird was in safe hands. 与全文一般过去时、过去进行时体系一致即可。"
        }
      ];

      function countQuestionsInPanel(panel) {
        let c = 0;
        for (let k = 0; k < SOCRATIC.length; k++) {
          if (SOCRATIC[k].panel === panel) c++;
        }
        return c;
      }
      function indexWithinPanel(globalIdx) {
        const p = SOCRATIC[globalIdx].panel;
        let n = 0;
        for (let k = 0; k <= globalIdx; k++) {
          if (SOCRATIC[k].panel === p) n++;
        }
        return n;
      }
      let socraticIdx = 0;

      function renderRecap(panel) {
        if (!socraticRecap) return;
        const list = recapByPanel[panel] || [];
        socraticRecap.innerHTML = "";
        if (!list.length) {
          const p = document.createElement("p");
          p.className = "p07-socratic-recap-empty";
          p.textContent =
            "每完成一题并点「下一问」后，该题的题干与参考提示会显示在这里，便于对照本图收尾。";
          socraticRecap.appendChild(p);
          return;
        }
        list.forEach(function (entry) {
          const block = document.createElement("div");
          block.className = "p07-socratic-recap-item";
          const qEl = document.createElement("div");
          qEl.className = "p07-socratic-recap-q";
          qEl.textContent = entry.q;
          const aEl = document.createElement("div");
          aEl.className = "p07-socratic-recap-a";
          aEl.textContent = entry.a;
          block.appendChild(qEl);
          block.appendChild(aEl);
          socraticRecap.appendChild(block);
        });
      }

      function dockSocraticBesidePanel(panel) {
        if (!socraticPanel || !socraticRows.length) return;
        socraticRows.forEach(function (r, i) {
          r.querySelectorAll(".p07-socratic-spacer").forEach(function (n) {
            n.remove();
          });
          if (i === panel) {
            r.appendChild(socraticPanel);
          } else {
            const ph = document.createElement("div");
            ph.className = "p07-socratic-spacer";
            ph.setAttribute("aria-hidden", "true");
            r.appendChild(ph);
          }
        });
      }

      function renderSocratic() {
        const item = SOCRATIC[socraticIdx];
        const totalInPanel = countQuestionsInPanel(item.panel);
        const nth = indexWithinPanel(socraticIdx);
        socraticMeta.textContent =
          PANEL_LABELS[item.panel] +
          " · 第 " +
          nth +
          "/" +
          totalInPanel +
          " 问 · 共 " +
          (socraticIdx + 1) +
          "/" +
          SOCRATIC.length;
        socraticQ.textContent = item.q;
        if (socraticA) {
          socraticA.textContent = item.a;
          socraticA.hidden = true;
        }
        if (btnSocraticShow) btnSocraticShow.textContent = "显示参考提示";
        comicFigs.forEach(function (fig) {
          fig.classList.toggle("is-active", +fig.getAttribute("data-panel") === item.panel);
        });
        dockSocraticBesidePanel(item.panel);
        renderRecap(item.panel);
      }

      if (btnSocraticShow && socraticA) {
        btnSocraticShow.addEventListener("click", function () {
          socraticA.hidden = !socraticA.hidden;
          btnSocraticShow.textContent = socraticA.hidden ? "显示参考提示" : "隐藏参考提示";
        });
      }
      if (btnSocraticNext && socraticA) {
        btnSocraticNext.addEventListener("click", function () {
          const cur = SOCRATIC[socraticIdx];
          if (!recapByPanel[cur.panel]) recapByPanel[cur.panel] = [];
          recapByPanel[cur.panel].push({ q: cur.q, a: cur.a });
          socraticA.hidden = true;
          socraticIdx = (socraticIdx + 1) % SOCRATIC.length;
          renderSocratic();
        });
      }
      renderSocratic();
    })();
  </script>
