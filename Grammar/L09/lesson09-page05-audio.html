  <script>
    (function () {
      const $ = (s, r) => (r || document).querySelector(s);
      const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

      const SCRIPT =
        "Last Wednesday night, I was driving home slowly in heavy rain. I was listening to the weather report when suddenly a dog rushed into the street. " +
        "While I was braking as hard as I could, my phone rang once. Then I heard a long horn and a crash behind us.";

      const CHIPS = [
        { id: "a", correct: "bg", text: "I was driving home slowly in heavy rain." },
        { id: "b", correct: "bg", text: "I was listening to the weather report." },
        { id: "c", correct: "bg", text: "I was braking as hard as I could." },
        { id: "d", correct: "ev", text: "Suddenly, a dog rushed into the street." },
        { id: "e", correct: "ev", text: "My phone rang once." },
        { id: "f", correct: "ev", text: "Then I heard a long horn and a crash behind us." }
      ];

      $("#script-en").textContent = SCRIPT;

      const CFG = () => (typeof window !== "undefined" && window.L09_CFG) ? window.L09_CFG : {};
      const uiLock = $("#ui-lock");
      const uiLockMsg = $("#ui-lock-msg");
      const scopeCanvas = $("#scope-canvas");
      const snowCanvas = $("#snow-canvas");
      const bank = $("#chip-bank");

      function setUiLock(on, msg) {
        uiLock.classList.toggle("active", !!on);
        uiLock.setAttribute("aria-hidden", on ? "false" : "true");
        if (msg) uiLockMsg.textContent = msg;
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function buildChips() {
        bank.querySelectorAll(".p05-chip").forEach(function (n) { n.remove(); });
        shuffle(CHIPS).forEach(function (c) {
          const el = document.createElement("div");
          el.className = "p05-chip";
          el.dataset.id = c.id;
          el.dataset.correct = c.correct;
          el.textContent = c.text;
          bank.appendChild(el);
        });
      }

      let ac = null;
      let noiseNode = null;
      let voiceNode = null;
      let analyser = null;
      let scopeRaf = 0;
      let playing = false;

      function getAC() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!ac) ac = new Ctx();
        return ac;
      }

      function makeDistortionCurve(amount) {
        const n = 44100;
        const curve = new Float32Array(n);
        const k = amount;
        for (let i = 0; i < n; i++) {
          const x = (i * 2) / n - 1;
          curve[i] = ((3 + k) * x * 20 * Math.PI) / (Math.PI + k * Math.abs(x));
        }
        return curve;
      }

      function makeWhiteBuffer(ctx, seconds) {
        const len = Math.floor(ctx.sampleRate * seconds);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        return buf;
      }

      function buildRadioChain(ctx, mergeIn) {
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 400;
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3000;
        const sh = ctx.createWaveShaper();
        sh.curve = makeDistortionCurve(6);
        mergeIn.connect(hp);
        hp.connect(lp);
        lp.connect(sh);
        return sh;
      }

      /** 语音走轻度带限即可；不要 WaveShaper，否则 TTS 易被「糊」成一片噪音感。 */
      function buildVoiceAirChain(ctx, mergeIn) {
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 90;
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 12000;
        mergeIn.connect(hp);
        hp.connect(lp);
        return lp;
      }

      function stopAudio() {
        playing = false;
        cancelAnimationFrame(scopeRaf);
        try {
          if (noiseNode) { noiseNode.stop(); noiseNode.disconnect(); }
        } catch (_) {}
        try {
          if (voiceNode) { voiceNode.stop(); voiceNode.disconnect(); }
        } catch (_) {}
        noiseNode = null;
        voiceNode = null;
        window.speechSynthesis.cancel();
        const ctx = scopeCanvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, scopeCanvas.width, scopeCanvas.height);
      }

      /**
       * Azure 失败或未配密钥时的回退：Web Audio 底噪 + 无线电链 + speechSynthesis。
       */
      function playWebAudioRadioUtterance(opts) {
        opts = opts || {};
        stopAudio();
        const ctx = getAC();
        if (!ctx) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(SCRIPT));
          return Promise.resolve();
        }
        return ctx
          .resume()
          .catch(function () {})
          .then(function () {
            const noiseBuf = makeWhiteBuffer(ctx, 4);
            const noiseSrc = ctx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            noiseSrc.loop = true;
            noiseNode = noiseSrc;
            const noiseGain = ctx.createGain();
            noiseGain.gain.value = 0.00175;
            const end = buildRadioChain(ctx, noiseGain);
            noiseSrc.connect(noiseGain);
            analyser = ctx.createAnalyser();
            analyser.fftSize = 2048;
            end.connect(analyser);
            analyser.connect(ctx.destination);
            noiseSrc.start();
            playing = true;
            resizeScope();
            drawScope();

            const u = new SpeechSynthesisUtterance(SCRIPT);
            u.lang = "en-US";
            u.rate = 0.92;
            u.volume = 1;
            u.onend = function () {
              try {
                noiseSrc.stop();
              } catch (_) {}
              playing = false;
              cancelAnimationFrame(scopeRaf);
            };
            window.speechSynthesis.speak(u);
          });
      }

      function resizeScope() {
        const w = scopeCanvas.parentElement.clientWidth;
        const h = scopeCanvas.parentElement.clientHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        scopeCanvas.width = Math.floor(w * dpr);
        scopeCanvas.height = Math.floor(h * dpr);
        scopeCanvas.style.width = w + "px";
        scopeCanvas.style.height = h + "px";
        snowCanvas.width = scopeCanvas.width;
        snowCanvas.height = scopeCanvas.height;
        snowCanvas.style.width = scopeCanvas.style.width;
        snowCanvas.style.height = scopeCanvas.style.height;
        const c = scopeCanvas.getContext("2d");
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawScope() {
        if (!playing || !analyser) return;
        const ctx = scopeCanvas.getContext("2d");
        const w = scopeCanvas.clientWidth;
        const h = scopeCanvas.clientHeight;
        ctx.fillStyle = "rgba(0, 18, 12, 0.22)";
        ctx.fillRect(0, 0, w, h);
        const buf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteTimeDomainData(buf);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(105, 240, 174, 0.85)";
        ctx.beginPath();
        const step = w / buf.length;
        for (let i = 0; i < buf.length; i++) {
          const v = buf[i] / 128.0;
          const y = v * (h * 0.45) + h * 0.28;
          const x = i * step;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        scopeRaf = requestAnimationFrame(drawScope);
      }

      async function playAzure() {
        if (window.LessonTTSBootstrap && typeof window.LessonTTSBootstrap.playLocalIfAvailable === "function") {
          const localOk = await window.LessonTTSBootstrap.playLocalIfAvailable(SCRIPT);
          if (localOk) return;
        }
        const c = CFG();
        const key = (c.azureKey || "").trim();
        const region = (c.azureRegion || "southeastasia").trim();
        if (!key) {
          await playWebAudioRadioUtterance({});
          return;
        }
        stopAudio();
        const ctx = getAC();
        if (!ctx) {
          await playWebAudioRadioUtterance({});
          return;
        }
        await ctx.resume().catch(function () {});
        const isFile = location.protocol === "file:";
        setUiLock(true, isFile ? "正在搜索频道" : "Azure 语音合成中…");
        try {
          const ep = (c.azureTtsEndpoint || "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1")
            .replace("{region}", region);
          const safe = SCRIPT.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          const ssml =
            '<speak version="1.0" xml:lang="en-US"><voice name="en-US-ChristopherNeural">' +
            "<prosody rate=\"-4%\">" + safe + "</prosody></voice></speak>";
          const res = await fetch(ep, {
            method: "POST",
            headers: {
              "Content-Type": "application/ssml+xml",
              "X-Microsoft-OutputFormat": "riff-16khz-16bit-mono-pcm",
              "Ocp-Apim-Subscription-Key": key
            },
            body: ssml
          });
          if (!res.ok) {
            const errTxt = await res.text().catch(function () {
              return "";
            });
            throw new Error("TTS HTTP " + res.status + (errTxt ? " · " + errTxt.slice(0, 120) : ""));
          }
          const arr = await res.arrayBuffer();
          const copy = arr.slice(0);
          const audioBuf = await ctx.decodeAudioData(copy);
          const noiseBuf = makeWhiteBuffer(ctx, 3);
          const noiseSrc = ctx.createBufferSource();
          noiseNode = noiseSrc;
          noiseSrc.buffer = noiseBuf;
          noiseSrc.loop = true;
          const noiseGain = ctx.createGain();
          noiseGain.gain.value = 0.0015;
          const radioEnd = buildRadioChain(ctx, noiseGain);
          noiseSrc.connect(noiseGain);

          const voiceSrc = ctx.createBufferSource();
          voiceNode = voiceSrc;
          voiceSrc.buffer = audioBuf;
          const voiceGain = ctx.createGain();
          voiceGain.gain.value = 3.84;
          const voiceAir = buildVoiceAirChain(ctx, voiceGain);
          voiceSrc.connect(voiceGain);

          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          radioEnd.connect(analyser);
          voiceAir.connect(analyser);
          analyser.connect(ctx.destination);

          playing = true;
          noiseSrc.start();
          voiceSrc.start();
          voiceSrc.onended = function () {
            try { noiseSrc.stop(); } catch (_) {}
            playing = false;
            cancelAnimationFrame(scopeRaf);
          };
          resizeScope();
          drawScope();
        } catch (e) {
          await playWebAudioRadioUtterance({});
        } finally {
          setUiLock(false);
        }
      }

      function flashSnow(ms) {
        snowCanvas.classList.add("is-on");
        const ctx = snowCanvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = snowCanvas.clientWidth;
        const h = snowCanvas.clientHeight;
        let t0 = performance.now();
        function f(t) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const img = ctx.createImageData(w, h);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = (Math.random() * 255) | 0;
            img.data[i] = v;
            img.data[i + 1] = v;
            img.data[i + 2] = v;
            img.data[i + 3] = 200;
          }
          ctx.putImageData(img, 0, 0);
          if (t - t0 < ms) requestAnimationFrame(f);
          else {
            snowCanvas.classList.remove("is-on");
            ctx.clearRect(0, 0, w, h);
          }
        }
        requestAnimationFrame(f);
      }

      async function deepseekWrong(lines) {
        const c = CFG();
        const key = (c.deepseekKey || "").trim();
        if (!key) {
          return "背景轨多用 was / were + doing 表持续；事件点用一般过去表打断。请对照听力中的先后顺序。";
        }
        const ep = c.deepseekEndpoint || "https://api.deepseek.com/v1/chat/completions";
        setUiLock(true, "DeepSeek 分析中…");
        try {
          const res = await fetch(ep, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
            body: JSON.stringify({
              model: c.deepseekModel || "deepseek-chat",
              temperature: 0.35,
              messages: [
                { role: "system", content: "你是初中英语听力教研员。最多80字中文说明芯片为何放错轨；对事不对人。" },
                { role: "user", content: lines.join("\n") }
              ]
            })
          });
          const raw = await res.text();
          let text = raw;
          try {
            const j = JSON.parse(raw);
            text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || raw;
          } catch (_) {}
          return String(text).replace(/```json|```/gi, "").trim().slice(0, 200);
        } catch (e) {
          return "请求失败：" + (e && e.message ? e.message : "unknown");
        } finally {
          setUiLock(false);
        }
      }

      let drag = null;
      function onChipDown(e) {
        const chip = e.target.closest(".p05-chip");
        if (!chip || !e.isPrimary) return;
        e.preventDefault();
        const r = chip.getBoundingClientRect();
        drag = {
          chip: chip,
          pid: e.pointerId,
          dx: e.clientX - r.left,
          dy: e.clientY - r.top,
          w: r.width,
          h: r.height
        };
        chip.classList.add("is-dragging");
        chip.style.position = "fixed";
        chip.style.left = r.left + "px";
        chip.style.top = r.top + "px";
        chip.style.width = r.width + "px";
        chip.style.zIndex = "100";
        chip.setPointerCapture(e.pointerId);
      }
      function onChipMove(e) {
        if (!drag || e.pointerId !== drag.pid) return;
        drag.chip.style.left = e.clientX - drag.dx + "px";
        drag.chip.style.top = e.clientY - drag.dy + "px";
      }
      function onChipUp(e) {
        if (!drag || e.pointerId !== drag.pid) return;
        const chip = drag.chip;
        try { chip.releasePointerCapture(e.pointerId); } catch (_) {}
        chip.classList.remove("is-dragging");
        const under = document.elementsFromPoint(e.clientX, e.clientY);
        let zone = null;
        for (let i = 0; i < under.length; i++) {
          const el = under[i];
          if (el && el.classList && el.classList.contains("p05-track")) {
            zone = el;
            break;
          }
          if (el && el.id === "chip-bank") {
            zone = bank;
            break;
          }
        }
        chip.style.position = "";
        chip.style.left = "";
        chip.style.top = "";
        chip.style.width = "";
        chip.style.zIndex = "";
        if (zone && zone.classList.contains("p05-track")) zone.appendChild(chip);
        else bank.appendChild(chip);
        drag = null;
      }

      function wireChips() {
        $$(".p05-chip").forEach(function (chip) {
          chip.addEventListener("pointerdown", onChipDown);
          chip.addEventListener("pointermove", onChipMove);
          chip.addEventListener("pointerup", onChipUp);
          chip.addEventListener("pointercancel", onChipUp);
        });
      }

      $("#btn-azure").addEventListener("click", playAzure);
      $("#btn-stop").addEventListener("click", stopAudio);

      $("#btn-reset").addEventListener("click", function () {
        stopAudio();
        buildChips();
        wireChips();
      });

      $("#btn-verify").addEventListener("click", async function () {
        const wrong = [];
        $$(".p05-chip").forEach(function (chip) {
          chip.classList.remove("is-wrong");
          const parent = chip.parentElement;
          const track = parent && parent.dataset ? parent.dataset.track : "";
          if (!track || track !== chip.dataset.correct) wrong.push(chip);
        });
        if (wrong.length) {
          wrong.forEach(function (c) { c.classList.add("is-wrong"); });
          flashSnow(650);
          const lines = wrong.map(function (c) {
            const p = c.parentElement;
            const z = p && p.dataset ? p.dataset.track : "";
            const where = z === "bg" ? "背景轨" : z === "ev" ? "事件轨" : "待分拣区";
            return "「" + c.textContent.trim() + "」当前在：" + where;
          });
          await deepseekWrong(lines);
          return;
        }
        try {
          if (typeof anime !== "undefined") {
            anime({ targets: "#zone-bg", borderColor: ["#66bb6a", "rgba(21, 101, 192, 0.45)"], duration: 700 });
            anime({ targets: "#zone-ev", borderColor: ["#66bb6a", "rgba(229, 57, 53, 0.45)"], duration: 700 });
          }
        } catch (_) {}
      });

      window.addEventListener("resize", function () { resizeScope(); });
      new ResizeObserver(resizeScope).observe($("#scope-wrap"));

      buildChips();
      wireChips();
      resizeScope();
    })();
  </script>
