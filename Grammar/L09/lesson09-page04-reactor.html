      const lightboxBackdrop = $("#p04-lightbox-backdrop");
      const lightboxX = $("#p04-lightbox-x");

      function openP04Lightbox(src, alt) {
        if (!lightbox || !lightboxImg) return;
        lightboxImg.src = src;
        lightboxImg.alt = alt || "情境插图";
        lightbox.hidden = false;
        lightbox.setAttribute("aria-hidden", "false");
        try {
          if (lightboxX) lightboxX.focus();
        } catch (_) {}
      }
      function closeP04Lightbox() {
        if (!lightbox || !lightboxImg) return;
        lightbox.hidden = true;
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImg.removeAttribute("src");
        lightboxImg.alt = "";
      }

      grid.addEventListener("click", function (e) {
        const thumb = e.target.closest && e.target.closest(".p04-thumb");
        if (!thumb) return;
        e.preventDefault();
        e.stopPropagation();
        openP04Lightbox(thumb.currentSrc || thumb.src, thumb.getAttribute("alt") || "");
      });
      if (lightboxBackdrop) {
        lightboxBackdrop.addEventListener("click", function () {
          closeP04Lightbox();
        });
      }
      if (lightboxX) {
        lightboxX.addEventListener("click", function (e) {
          e.stopPropagation();
          closeP04Lightbox();
        });
      }
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape") return;
        if (lightbox && !lightbox.hidden) closeP04Lightbox();
      });

      let stats = { correct: 0, attempts: 0 };
      let raceOn = false;
      let raceStart = 0;
      let raceTimer = 0;

      const CFG = () => (typeof window !== "undefined" && window.L09_CFG) ? window.L09_CFG : {};

      function setUiLock(on, msg) {
        uiLock.classList.toggle("active", !!on);
        uiLock.setAttribute("aria-hidden", on ? "false" : "true");
        if (msg) uiLockMsg.textContent = msg;
      }

      function shuffleInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function cableColor(leftId) {
        const hues = [188, 42, 268, 142, 28];
        return "hsl(" + hues[leftId % hues.length] + ",82%,52%)";
      }

      function layoutCanvas() {
        const r = grid.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(r.width * dpr));
        canvas.height = Math.max(1, Math.floor(r.height * dpr));
        canvas.style.width = r.width + "px";
        canvas.style.height = r.height + "px";
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      function jackCenter(el) {
        const r = el.getBoundingClientRect();
        const g = grid.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - g.left,
          y: r.top + r.height / 2 - g.top
        };
      }

      function drawBezier(ctx, x1, y1, x2, y2, stroke, alpha) {
        const dx = (x2 - x1) * 0.45;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.bezierCurveTo(x1 + dx, y1, x2 - dx, y2, x2, y2);
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        ctx.shadowColor = stroke;
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.restore();
      }

      function redraw() {
        const ctx = canvas.getContext("2d");
        const w = grid.clientWidth;
        const h = grid.clientHeight;
        ctx.clearRect(0, 0, w, h);

        connections.forEach((slot, leftId) => {
          const L = $('.p04-jack[data-side="L"][data-left-id="' + leftId + '"]', grid);
          const R = $('.p04-jack[data-side="R"][data-slot="' + slot + '"]', grid);
          if (!L || !R) return;
          const a = jackCenter(L);
          const b = jackCenter(R);
          drawBezier(ctx, a.x, a.y, b.x, b.y, cableColor(leftId), 0.92);
        });

        if (dragging && dragLine) {
          const L = $('.p04-jack[data-side="L"][data-left-id="' + dragging.leftId + '"]', grid);
          if (L) {
            const a = jackCenter(L);
            drawBezier(ctx, a.x, a.y, dragLine.x, dragLine.y, cableColor(dragging.leftId), 0.55);
          }
        }

        for (let i = sparkParticles.length - 1; i >= 0; i--) {
          const p = sparkParticles[i];
          p.life -= 0.08;
          if (p.life <= 0) {
            sparkParticles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          p.x += p.vx;
          p.y += p.vy;
        }
        if (sparkParticles.length) {
          cancelAnimationFrame(rafId);
          rafId = requestAnimationFrame(redraw);
        }
      }

      function burstSparks(x, y, c) {
        for (let i = 0; i < 18; i++) {
          const ang = Math.random() * Math.PI * 2;
          const sp = 1.5 + Math.random() * 3;
          sparkParticles.push({
            x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            life: 0.85 + Math.random() * 0.35, c: c || "#ffeb3b"
          });
        }
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(redraw);
      }

      let _toneAc = null;
      function playTone(freq, dur, type) {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!_toneAc) _toneAc = new Ctx();
          const ac = _toneAc;
          const o = ac.createOscillator();
          const g = ac.createGain();
          o.type = type || "sine";
          o.frequency.value = freq;
          g.gain.value = 0.12;
          o.connect(g);
          g.connect(ac.destination);
          o.start();
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
          o.stop(ac.currentTime + dur + 0.02);
        } catch (_) {}
      }

      function sfxConnect() { playTone(660, 0.08, "square"); }
      function sfxErr() { playTone(140, 0.22, "sawtooth"); playTone(95, 0.18, "sawtooth"); }
      function sfxOk() {
        playTone(523, 0.1, "sine");
        setTimeout(function () { playTone(659, 0.1, "sine"); }, 90);
        setTimeout(function () { playTone(784, 0.14, "sine"); }, 180);
      }

      function renderColumns() {
        colL.innerHTML = '<div class="p04-col-header">背景描述 · 过去进行时</div>' +
          BG_ROWS.map(function (row) {
            return '<div class="p04-card" data-left-row="' + row.id + '">' +
              '<div class="p04-card-body"><div class="en">' + row.en + '</div><div class="zh">' + row.zh + '</div></div>' +
              '<img class="p04-thumb" alt="情境：' + String(row.zh).replace(/"/g, "＂") + '" src="' + row.thumb + '" draggable="false" />' +
              '<button type="button" class="p04-jack" data-side="L" data-left-id="' + row.id + '" aria-label="左接口' + row.id + '"></button></div>';
          }).join("");

        colR.innerHTML = '<div class="p04-col-header">突变点 · 一般过去时（顺序已打乱）</div>' +
          rightOrder.map(function (evId, slot) {
            const ev = EVENTS[evId];
            return '<div class="p04-card" data-slot-card="' + slot + '">' +
              '<button type="button" class="p04-jack" data-side="R" data-slot="' + slot + '" data-event-id="' + ev.id + '" aria-label="右接口' + slot + '"></button>' +
              '<div class="p04-card-body"><div class="en">' + ev.en + '</div><div class="zh">' + ev.zh + '</div></div></div>';
          }).join("");

        $$(".p04-thumb", grid).forEach(function (img) {
          img.addEventListener("dragstart", function (e) { e.preventDefault(); });
        });
        wireJacks();
        layoutCanvas();
        updateJackHints();
      }

      function updateJackHints() {
        $$('.p04-jack[data-side="L"]', grid).forEach(function (j) {
          const id = +j.dataset.leftId;
          j.classList.toggle("is-wired", connections.has(id));
        });
      }

      function wireJacks() {
        $$('.p04-jack[data-side="L"]', grid).forEach(function (jack) {
          jack.addEventListener("pointerdown", onLeftDown);
        });
      }

      function onDragMove(e) {
        if (!dragging || e.pointerId !== dragging.pid) return;
        const g = grid.getBoundingClientRect();
        dragLine.x = e.clientX - g.left;
        dragLine.y = e.clientY - g.top;
        redraw();
      }

      function onDragUp(e) {
        if (!dragging || e.pointerId !== dragging.pid) return;
        window.removeEventListener("pointermove", onDragMove);
        window.removeEventListener("pointerup", onDragUp);
        window.removeEventListener("pointercancel", onDragUp);
        const t = document.elementFromPoint(e.clientX, e.clientY);
        const rj = t && t.closest && t.closest('.p04-jack[data-side="R"]');
        if (rj) {
          const slot = +rj.dataset.slot;
          connections.set(dragging.leftId, slot);
          sfxConnect();
          try {
            if (typeof anime !== "undefined") {
              anime({ targets: rj, scale: [1, 1.15, 1], duration: 320, easing: "easeOutQuad" });
            }
          } catch (_) {}
        }
        $$(".p04-jack.is-hot", grid).forEach(function (j) { j.classList.remove("is-hot"); });
        dragging = null;
        dragLine = null;
        updateJackHints();
        redraw();
      }

      function onLeftDown(e) {
        e.preventDefault();
        e.stopPropagation();
        const t = e.currentTarget;
        const leftId = +t.dataset.leftId;
        dragging = { leftId: leftId, pid: e.pointerId };
        const g = grid.getBoundingClientRect();
        dragLine = { x: e.clientX - g.left, y: e.clientY - g.top };
        window.addEventListener("pointermove", onDragMove);
        window.addEventListener("pointerup", onDragUp);
        window.addEventListener("pointercancel", onDragUp);
        t.classList.add("is-hot");
        redraw();
      }

      function clearAll() {
        connections.clear();
        dragging = null;
        dragLine = null;
        updateJackHints();
        redraw();
      }

      function shuffleRight() {
        rightOrder = shuffleInPlace([0, 1, 2, 3, 4].slice());
        clearAll();
        renderColumns();
      }

      function eventAtSlot(slot) {
        const id = rightOrder[slot];
        return EVENTS[id];
      }

      async function deepseekParadox(lines) {
        const c = CFG();
        const key = (c.deepseekKey || "").trim();
        if (!key) {
          return "（未配置 deepseekKey）请检查：为何「长背景」与「短事件」在常识上说不通，或主从时态搭配不当。";
        }
        const ep = c.deepseekEndpoint || "https://api.deepseek.com/v1/chat/completions";
        const model = c.deepseekModel || "deepseek-v4-flash";
        const body = {
          model: model,
          temperature: 0.35,
          messages: [
            {
              role: "system",
              content: "你是初中英语教研员「时空侦探」。用最多80字中文说明：下列配对在语法或生活常识上的问题。对事不对人，禁止人身攻击，勿展开敏感话题。"
            },
            { role: "user", content: "以下为学生错误接线说明，请短评：\n" + lines.join("\n") }
          ]
        };
        setUiLock(true, "DeepSeek 悖论短评中…");
        try {
          const res = await fetch(ep, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
            body: JSON.stringify(body)
          });
          const raw = await res.text();
          let text = raw;
          try {
            const j = JSON.parse(raw);
            text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || raw;
          } catch (_) {}
          text = String(text).replace(/```json|```/gi, "").trim();
          return text.slice(0, 200);
        } catch (err) {
          return "网络请求失败：" + (err && err.message ? err.message : "unknown");
        } finally {
          setUiLock(false);
        }
      }

      async function verify() {
        if (connections.size !== 5) {
          sfxErr();
          return;
        }
        stats.attempts++;
        const wrong = [];
        for (let L = 0; L < 5; L++) {
          const slot = connections.get(L);
          const ev = eventAtSlot(slot);
          if (!ev || ev.id !== L) wrong.push({ L: L, slot: slot, ev: ev });
        }

        if (wrong.length === 0) {
          stats.correct++;
          sfxOk();
          try {
            if (typeof anime !== "undefined") {
              anime({ targets: "#p04-patch-grid", borderColor: ["#66bb6a", "rgba(0, 229, 255, 0.22)"], duration: 900 });
            }
          } catch (_) {}
        } else {
          sfxErr();
          wrong.forEach(function (w) {
            const Lj = $('.p04-jack[data-side="L"][data-left-id="' + w.L + '"]', grid);
            const Rj = $('.p04-jack[data-side="R"][data-slot="' + w.slot + '"]', grid);
            if (Lj) {
              Lj.classList.add("is-bad");
              const c = jackCenter(Lj);
              burstSparks(c.x, c.y, "#ff7043");
            }
            if (Rj) {
              Rj.classList.add("is-bad");
              const c = jackCenter(Rj);
              burstSparks(c.x, c.y, "#ffeb3b");
            }
          });
          setTimeout(function () {
            $$(".p04-jack.is-bad", grid).forEach(function (j) { j.classList.remove("is-bad"); });
          }, 600);

          const lines = wrong.map(function (w) {
            const bg = BG_ROWS[w.L];
            const ev = w.ev || { en: "?", zh: "?" };
            return "「" + bg.en + "」接了「" + ev.en + "」(" + ev.zh + ")";
          });
          await deepseekParadox(lines);
        }
        $("#stat-display").textContent = "正确 " + stats.correct + " / 尝试 " + stats.attempts;
        redraw();
      }

      function tickRace() {
        if (!raceOn || !raceStart) {
          $("#race-display").textContent = "—:—";
          return;
        }
        const s = Math.floor((Date.now() - raceStart) / 1000);
        const m = Math.floor(s / 60);
        const r = s % 60;
        $("#race-display").textContent = m + ":" + (r < 10 ? "0" : "") + r;
        raceTimer = requestAnimationFrame(tickRace);
      }

      $("#btn-shuffle").addEventListener("click", shuffleRight);
      $("#btn-clear").addEventListener("click", clearAll);
      $("#btn-verify").addEventListener("click", function () { verify(); });
      $("#chk-race").addEventListener("change", function () {
        raceOn = $("#chk-race").checked;
        if (!raceOn) {
          raceStart = 0;
          cancelAnimationFrame(raceTimer);
          $("#race-display").textContent = "—:—";
        }
      });
      $("#btn-race").addEventListener("click", function () {
        if (!$("#chk-race").checked) {
          $("#chk-race").checked = true;
          raceOn = true;
        }
        if (raceStart) {
          raceStart = 0;
          cancelAnimationFrame(raceTimer);
          $("#race-display").textContent = "—:—";
        } else {
          raceStart = Date.now();
          cancelAnimationFrame(raceTimer);
          tickRace();
        }
      });

      window.addEventListener("resize", function () { layoutCanvas(); });
      new ResizeObserver(function () { layoutCanvas(); }).observe(grid);

      shuffleRight();
    })();
  </script>
