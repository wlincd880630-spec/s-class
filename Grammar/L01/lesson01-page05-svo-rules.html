    /* y 碎裂 + ies 浮现（辅音 + y → ies，如 study → studies） */
    .hl-ies-morph {
      position: relative;
      display: inline;
    }
    .morph-y-slot {
      position: relative;
      display: inline-block;
      vertical-align: baseline;
      min-width: 1.15em;
      margin-left: -0.02em;
    }
    .morph-y-char {
      display: inline-block;
      animation: morphYCrack 0.85s ease forwards;
      transform-origin: 60% 80%;
    }
    .morph-ies-tail {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-block;
      animation: morphIesPop 0.75s 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      color: var(--suffix-ies);
      font-weight: 700;
      border-bottom: 3px solid var(--suffix-ies);
      white-space: nowrap;
    }
    @keyframes morphYCrack {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      55% {
        opacity: 0.85;
        transform: translate(2px, 5px) rotate(14deg) scale(0.92);
      }
      100% {
        opacity: 0;
        transform: translate(6px, 12px) rotate(28deg) scale(0.35);
      }
    }
    @keyframes morphIesPop {
      0% {
        opacity: 0;
        transform: scale(0.2) translateY(0.35em);
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

      .replace(/&#039;/g, "'")
      .replace(/&apos;/g, "'")

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function buildDetailSession() {
    const bank = VERB_DETAIL_BANK;
    const byG = { 1: [], 2: [], 3: [], 4: [] };
    for (let i = 0; i < bank.length; i++) {
      byG[bank[i].group].push(i);
    }
    for (let g = 1; g <= 4; g++) {
      shuffleInPlace(byG[g]);
    }
    const targetCount = 8 + Math.floor(Math.random() * 3);
    const picked = [];
    const seen = {};

    function takeFromGroup(g, n) {
      let c = 0;
      for (let i = 0; i < byG[g].length && c < n; i++) {
        const id = byG[g][i];
        if (!seen[id]) {
          picked.push(id);
          seen[id] = true;
          c++;
        }
      }
    }

    takeFromGroup(1, 2);
    takeFromGroup(2, 2);
    takeFromGroup(3, 2);
    takeFromGroup(4, 1);

    const pool = [];
    for (let i = 0; i < bank.length; i++) {
      if (!seen[i]) {
        pool.push(i);
      }
    }
    shuffleInPlace(pool);
    let pi = 0;
    while (picked.length < targetCount && pi < pool.length) {
      picked.push(pool[pi]);
      pi++;
    }
    shuffleInPlace(picked);
    return picked;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeRegex(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function getDetailProgress(idx) {
    const p = state.detailProgress[idx];
    if (!p) {
      return { a: false, b: false };
    }
    return { a: !!p.a, b: !!p.b };
  }

  function setDetailSlotDone(idx, slot, done) {
    if (!state.detailProgress[idx]) {
      state.detailProgress[idx] = { a: false, b: false };
    }
    state.detailProgress[idx][slot] = !!done;
  }

  function extractVerbInSentence(ex) {
    const f = ex.full;
    const b = ex.before;
    const a = ex.after;
    if (f.length >= b.length + a.length && f.indexOf(b) === 0 && f.slice(f.length - a.length) === a) {
      return f.slice(b.length, f.length - a.length);
    }
    return "";
  }

  function highlightThirdToken(token) {
    const w = String(token);
    if (!w) {
      return "";
    }
    if (/^has$/i.test(w)) {
      return '<span class="hl-suffix-red">' + escapeHtml(w) + "</span>";
    }
    if (/ies$/i.test(w)) {
      const baseY = w.replace(/ies$/i, "y");
      if (/y$/i.test(baseY) && baseY.length >= 3) {
        const stemPart = baseY.slice(0, -1);
        return (
          '<span class="hl-ies hl-ies-morph">' +
          escapeHtml(stemPart) +
          '<span class="morph-y-slot"><span class="morph-y-char">y</span><span class="morph-ies-tail">ies</span></span></span>'
        );
      }
      const stem = w.slice(0, -3);
      return escapeHtml(stem) + '<span class="hl-suffix-red">' + escapeHtml("ies") + "</span>";
    }
    if (/es$/i.test(w) && !/ies$/i.test(w)) {
      const stem = w.slice(0, -2);
      return escapeHtml(stem) + '<span class="hl-suffix-red">' + escapeHtml("es") + "</span>";
    }
    if (/s$/i.test(w)) {
      const stem = w.slice(0, -1);
      return escapeHtml(stem) + '<span class="hl-suffix-red">' + escapeHtml("s") + "</span>";
    }
    return escapeHtml(w);
  }

  function detailLineHtml(ex, done, slotKey) {
    const blank =
      '<span class="blank-pick' +
      (done ? " done" : "") +
      '" data-detail-blank="' +
      slotKey +
      '" role="button" tabindex="0">' +
      (done ? escapeHtml(extractVerbInSentence(ex)) : "＿＿＿") +
      "</span>";
    if (!done) {
      return escapeHtml(ex.before) + blank + escapeHtml(ex.after);
    }
    const mid = extractVerbInSentence(ex);
    if (slotKey === "a") {
      return escapeHtml(ex.before) + '<span class="hl-verb-base">' + escapeHtml(mid) + "</span>" + escapeHtml(ex.after);
    }
    return escapeHtml(ex.before) + highlightThirdToken(mid) + escapeHtml(ex.after);
  }

  function speak(text) {
    return new Promise(function (resolve, reject) {
      var Boot = window.LessonTTSBootstrap;

      function tryRemote() {
        if (!LOCAL_DEV_MODE) {
          fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text })
          })
            .then(function (res) {
              if (!res.ok) {
                return res.text().then(function (t) {
                  throw new Error("TTS " + res.status + " " + t.slice(0, 120));
                });
              }
              return res.blob();
            })
            .then(function (blob) {
              playBlob(blob, resolve, reject);
            })
            .catch(function (e) {
              reject(e);
            });
          return;
        }
        var key = LOCAL_AZURE_KEY;
        var region = LOCAL_AZURE_REGION;
        if (!key) {
          reject(
            new Error(
              "离线语音未命中 manifest 或 mp3 无法播放，且未配置 Azure 密钥（可设 window.__AZURE_SPEECH_KEY__ 或本页 LOCAL_AZURE_KEY）。"
            )
          );
          return;
        }
        var url = "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1";
        var xmlSafe = String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
        var ssml =
          "<speak version='1.0' xml:lang='en-US'><voice xml:lang='en-US' xml:gender='Female' name='en-US-JennyNeural'>" +
          xmlSafe +
          "</voice></speak>";
        fetch(url, {
          method: "POST",
          headers: {
            "Ocp-Apim-Subscription-Key": key,
            "Content-Type": "application/ssml+xml",
            "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3"
          },
          body: ssml
        })
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (t) {
                throw new Error("Azure " + res.status + " " + t.slice(0, 120));
              });
            }
            return res.blob();
          })
          .then(function (blob) {
            playBlob(blob, resolve, reject);
          })
          .catch(function (e) {
            reject(e);
          });
      }

      if (Boot && typeof Boot.playLocalIfAvailable === "function") {
        var t = Boot.norm ? Boot.norm(text) : String(text || "").replace(/\s+/g, " ").trim();
        Boot.playLocalIfAvailable(t).then(function (ok) {
          if (ok) {
            resolve();
            return;
          }
          tryRemote();
        });
        return;
      }

      tryRemote();
    });
  }

  function stopAllSpeechMedia() {
    if (!window.__L01_MEDIA) {
      window.__L01_MEDIA = { audios: [], urls: [] };
    }
    window.__L01_MEDIA.audios.forEach(function (a) {
      try {
        a.pause();
        a.removeAttribute("src");
        a.load();
      } catch (e) {}
    });
    window.__L01_MEDIA.audios = [];
    window.__L01_MEDIA.urls.forEach(function (u) {
      try {
        URL.revokeObjectURL(u);
      } catch (e) {}
    });
    window.__L01_MEDIA.urls = [];
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && window.__l01AudioCtx) {
        if (window.__l01AudioCtx.state === "running") {
          window.__l01AudioCtx.suspend();
        }
      }
    } catch (e) {}
  }

  function playBlob(blob, resolve, reject) {
    if (!window.__L01_MEDIA) {
      window.__L01_MEDIA = { audios: [], urls: [] };
    }
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && !window.__l01AudioCtx) {
        window.__l01AudioCtx = new Ctx();
      }
      if (window.__l01AudioCtx && window.__l01AudioCtx.state === "suspended") {
        window.__l01AudioCtx.resume();
      }
    } catch (e) {}
    const url = URL.createObjectURL(blob);
    window.__L01_MEDIA.urls.push(url);
    const audio = new Audio(url);
    window.__L01_MEDIA.audios.push(audio);
    audio.onended = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      const ix = window.__L01_MEDIA.urls.indexOf(url);
      if (ix >= 0) {
        window.__L01_MEDIA.urls.splice(ix, 1);
      }
      const ai = window.__L01_MEDIA.audios.indexOf(audio);
      if (ai >= 0) {
        window.__L01_MEDIA.audios.splice(ai, 1);
      }
      resolve();
    };
    audio.onerror = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      reject(new Error("音频播放失败"));
    };
    audio.play().catch(function (e) {
      try {
        URL.revokeObjectURL(url);
      } catch (e2) {}
      reject(e);
    });
  }

  function speakWithGlobalLock(text) {
    stopAllSpeechMedia();

    document.body.classList.add("tts-locked");
    render();
    return speak(text).then(

          return v;
        }
        state.ttsGlobalLock = false;
        document.body.classList.remove("tts-locked");
        render();
        return v;
      },
      function (err) {
        if (sid !== state.ttsSessionId) {
          throw err;
        }
        state.ttsGlobalLock = false;
        document.body.classList.remove("tts-locked");
        render();
        throw err;
      }
    );
  }

  function runConfetti() {
    confettiCanvas.classList.remove("hidden");
    const ctx = confettiCanvas.getContext("2d");
    const w = (confettiCanvas.width = window.innerWidth);
    const h = (confettiCanvas.height = window.innerHeight);
    const pieces = [];
    const colors = ["#e85d4c", "#4a90d9", "#5cb85c", "#f0ad4e", "#9b59b6", "#ffeaa7"];
    for (let i = 0; i < 130; i++) {
      pieces.push({
        x: Math.random() * w,
        y: Math.random() * -h * 0.35,
        r: 4 + Math.random() * 8,
        vy: 2 + Math.random() * 4,
        vx: (Math.random() - 0.5) * 3,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.2,
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    let frames = 0;
    function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(function (p) {
        p.y += p.vy;
        p.x += p.vx;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.1);
        ctx.restore();
      });
      if (frames < 190) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, w, h);
        confettiCanvas.classList.add("hidden");
      }
    }
    tick();
  }

    const pick = avail[Math.floor(Math.random() * avail.length)];
    state.forceUsedIds[pick] = true;

  function renderSuffixHtml(sentence, ruleKey, baseVerb) {
    if (ruleKey === "base" && baseVerb) {
      const re = new RegExp("\\b(" + escapeRegex(baseVerb) + ")\\b", "i");
      return escapeHtml(sentence).replace(re, function (m) {
        return '<span class="hl-base">' + escapeHtml(m) + "</span>";
      });
    }
    const s = escapeHtml(sentence);
    if (ruleKey === "has") {
      return s.replace(/has\b/, '<span class="hl-has">has</span>');
    }
    const m = sentence.match(/(\w+)(s|es|ies)\b/i);
    if (!m) {
      return s;
    }
    const word = m[0];
    if (ruleKey === "ies" && /ies$/i.test(word)) {
      const baseY = word.replace(/ies$/i, "y");
      if (/y$/i.test(baseY) && baseY.length >= 3) {
        const stemPart = baseY.slice(0, -1);
        return (
          escapeHtml(sentence.split(word)[0]) +
          '<span class="hl-ies hl-ies-morph">' +
          escapeHtml(stemPart) +
          '<span class="morph-y-slot"><span class="morph-y-char">y</span><span class="morph-ies-tail">ies</span></span></span>' +
          escapeHtml(sentence.split(word)[1] || "")
        );
      }
      const stem = word.replace(/ies$/i, "");
      return escapeHtml(sentence.split(word)[0]) + '<span class="hl-ies">' + escapeHtml(stem) + "ies</span>" + escapeHtml(sentence.split(word)[1] || "");
    }
    if (ruleKey === "es" && /es$/i.test(word)) {
      const stem = word.replace(/es$/i, "");
      return escapeHtml(sentence.split(word)[0]) + '<span class="hl-es">' + escapeHtml(stem) + "es</span>" + escapeHtml(sentence.split(word)[1] || "");
    }
    if (ruleKey === "s" && /s$/i.test(word) && !/es$/i.test(word)) {
      const stem = word.replace(/s$/i, "");
      return escapeHtml(sentence.split(word)[0]) + '<span class="hl-s">' + escapeHtml(stem) + "s</span>" + escapeHtml(sentence.split(word)[1] || "");
    }
    return s;
  }

          '</div><button type="button" class="crayon b-red tts-cp" data-cp-tts="' +
          j +
          '" data-cp-side="R" title="Azure 朗读">🔊</button></div>';
      }
      html += "</div>";
      html += "</div>";
      html += '<div class="reveal-btn-wrap">';
      html += '<button type="button" class="crayon b-purple" id="btnReveal">揭晓规律</button>';
      html += "</div>";
      html += '<div class="rule-slide' + (state.ruleOpen ? " open" : "") + '" id="ruleSlide">';
      html += '<div class="rule-inner">';
      html += "<h3>第三人称单数（单三）· 一般现在时</h3>";
      html +=
        "<p>在一般现在时的<strong>动作家族</strong>句型里，当主语是<strong>第三人称单数</strong>（he, she, it 或单数的人或物）时，表示习惯性动作或状态时，<strong>谓语动词</strong>要挂上<strong>魔法尾巴</strong>（第三人称单数形式）。</p>";
      html += "<p><strong>结构小结：</strong>主语（三单） + 动词（三单形式 / 魔法尾巴） + 宾语 / 其他成分。</p>";
      html += "<p><strong>常见变化规则：</strong></p>";
      html += "<ul>";
      html +=
        '<li><span class="suffix-tag s-s">一般 +s</span>：多数动词直接加 <strong>s</strong>，如 play → plays, love → loves, like → likes, spend → spends, read → reads, help → helps。</li>';
      html +=
        '<li><span class="suffix-tag s-es">以 ch / sh / s / x / z / o 结尾 +es</span>：词尾是这些字母或字母组合时加 <strong>es</strong>，如 watch → watches, teach → teaches, fix → fixes, go → goes, do → does, finish → finishes。</li>';
      html +=
        '<li><span class="suffix-tag s-ies">辅音字母 + y 结尾</span>：把词尾的 <strong>y 改成 ies</strong>，如 fly → flies, study → studies。（若是<strong>元音字母 + y</strong> 结尾，多直接加 s，如 play → plays, enjoy → enjoys。）</li>';
      html += '<li><span class="suffix-tag s-has">不规则</span>：have → has</li>';
      html += "</ul>";
      html += "<p>非第三人称单数主语（I / you / we / they / 复数名词等）一般使用<strong>动词原形</strong>。</p>";
      html += "</div></div>";
      html += "</div>";
    }

    if (state.phase === 2) {
      if (!state.detailSessionOrder.length) {
        state.detailSessionOrder = buildDetailSession();
        state.detailSessionPos = 0;
      }
      const bankIdx = getDetailBankIndex();
      const vcur = VERB_DETAIL_BANK[bankIdx];
      const dp = getDetailProgress(bankIdx);
      const sessLen = state.detailSessionOrder.length;
      const pos = state.detailSessionPos;
      html += '<div class="phase-panel" id="p2">';
      html += '<div class="detail-hall-card"><div class="detail-hall-inner">';
      html += '<h1 class="page-title detail-hall-title">规则详析馆 · 随机挑战</h1>';
      html +=
        '<div class="detail-meta">' +
        escapeHtml(groupLabel(vcur.group)) +
        " · 难度★" +
        vcur.difficulty +
        " · 本局第 " +
        (pos + 1) +
        " / " +
        sessLen +
        " 词</div>";
      html += '<div class="detail-verb-title">' + escapeHtml(vcur.base) + "</div>";
      html += '<div class="detail-ex">';
      html += "<h3>练习 A · 非单三主语</h3>";
      html += trapBadgeHtml(vcur.exA);
      html += '<div class="detail-line">' + detailLineHtml(vcur.exA, dp.a, "a") + "</div>";
      html +=
        '<div class="detail-tts-row"><button type="button" class="crayon b-red detail-tts-btn" data-detail-tts-read="a" title="Azure 朗读例句 A" aria-label="Azure 朗读例句 A">🔊</button></div>';
      html += "</div>";
      html += '<div class="detail-ex">';
      html += '<h3 class="tag-b">练习 B · 单三主语（含陷阱）</h3>';
      html += trapBadgeHtml(vcur.exB);
      html += '<div class="detail-line">' + detailLineHtml(vcur.exB, dp.b, "b") + "</div>";
      html +=
        '<div class="detail-tts-row"><button type="button" class="crayon b-red detail-tts-btn" data-detail-tts-read="b" title="Azure 朗读例句 B" aria-label="Azure 朗读例句 B">🔊</button></div>';
      html += "</div>";
      if (dp.a && dp.b) {
        html += '<div class="detail-rule-box"><strong>规则揭晓：</strong>' + escapeHtml(vcur.ruleSummary) + "</div>";
      }
      html += '<div class="detail-nav">';
      html +=
        '<button type="button" class="crayon b-blue" data-detail-nav="prev"' +
        (pos <= 0 ? " disabled" : "") +
        ">◀ 上一词</button>";
      html +=
        '<button type="button" class="crayon b-orange" data-detail-nav="next"' +
        (pos >= sessLen - 1 ? " disabled" : "") +
        ">下一词 ▶</button>";
      html +=
        '<button type="button" class="crayon b-purple" data-detail-resample="1">换一批（重新抽样）</button>';
      html += "</div>";
      html += "</div></div>";
      html += "</div>";
    }

    if (state.phase === 3) {
      html += '<div class="phase-panel" id="p3">';
      html += '<h1 class="page-title">变身实验室 · 动词归位</h1>';
      html += '<div class="lab-row">';
      html +=
        '<div class="bottle" data-bottle="s"><div class="bottle-jar"></div><div class="bottle-label">+s</div></div>';
      html +=
        '<div class="bottle" data-bottle="es"><div class="bottle-jar"></div><div class="bottle-label">+es</div></div>';
      html +=
        '<div class="bottle" data-bottle="ies"><div class="bottle-jar"></div><div class="bottle-label">-y → ies</div></div>';
      html +=
        '<div class="bottle" data-bottle="has"><div class="bottle-jar"></div><div class="bottle-label">不规则 (has)</div></div>';
      html += "</div>";
      const td = TRANSFORM_DRILLS[state.transformIndex];
      const doneAll = state.transformIndex >= TRANSFORM_DRILLS.length;
      if (!doneAll) {
        html += '<div class="verb-card">';
        html += '<div class="base-word">' + escapeHtml(td.base) + "</div>";
        html +=
          '<p class="progress-txt">进度 ' +
          (state.transformIndex + 1) +
          " / " +
          TRANSFORM_DRILLS.length +
          "</p>";
        html += "</div>";
      } else {
        html += '<div class="success-banner">变身实验室通关！可进入阶段四 Force 5 挑战。</div>';
      }
      html += "</div>";
    }

    if (state.phase === 4) {
      html += '<div class="phase-panel" id="p4">';
      html += '<h1 class="page-title">Force 5 · 「S」狙击手</h1>';
      html +=
        '<p class="hint">连续答对 <strong>' +
        FORCE_WIN_STREAK +
        "</strong> 题点亮勋章（一名学生完成后可换人再来）。每题限时 " +
        state.timerMs / 1000 +
        " 秒。可随时点<strong>换一题</strong>跳过本条（保留连击、重计倒计时）。选错则勋章全暗并<strong>重置进度</strong>。选对后须点击朗读听完<strong>整句</strong>再进入下一题。题库共 " +
        FORCE_BANK.length +
        " 题，随机无放回，用尽后重洗。</p>";

      html += '<div class="force-medals">';
      for (let mi = 0; mi < FORCE_WIN_STREAK; mi++) {
        const lit = mi < state.forceStreak;
        const black = state.forceStreak === 0 && state.forceWrongModal;
        let cls = "medal-slot";
        if (lit) cls += " lit";
        if (black) cls += " black";
        html += '<span class="' + cls + '" title="勋章' + (mi + 1) + '">' + (lit ? "🏅" : "⚪") + "</span>";
      }
      html += "</div>";

      if (!state.forceRoundComplete && state.forceItem) {
        const fi = state.forceItem;
        const pct = Math.min(100, (state.forceTick / state.timerMs) * 100);
        const warn = state.forceTick < state.timerMs * 0.35;
        html += '<div class="timer-bar"><div class="timer-fill' + (warn ? " warn" : "") + '" style="width:' + pct + '%"></div></div>';

        html += '<div class="force-q">';
        html += '<p>请判断：主语 <span class="subj">' + escapeHtml(fi.subject) + "</span> + 动词原形 <span class=\"vbase\">" + escapeHtml(fi.verb) + "</span></p>";
        html += "</div>";

        const choiceLock = state.forceAwaitTts || state.ttsGlobalLock;
        html += '<div class="choice-row">';
        html +=
          '<button type="button" class="choice-f5" data-choice="base"' +
          (choiceLock ? " disabled" : "") +
          ">保持原形</button>";
        html +=
          '<button type="button" class="choice-f5" data-choice="3rd"' +
          (choiceLock ? " disabled" : "") +
          ">变第三人称单数</button>";
        html += "</div>";
        html += '<div class="reveal-btn-wrap">';
        html +=
          '<button type="button" class="crayon b-orange" id="btnForceSkip"' +
          (choiceLock ? " disabled" : "") +
          ">换一题（保留连击）</button>";
        html += "</div>";

        if (state.forceAwaitTts && state.lastCorrectSentence) {
          html +=
            '<p class="result-line" id="resultLine">' +
            renderSuffixHtml(state.lastCorrectSentence, state.lastRuleKey, state.lastVerb) +
            "</p>";
          html +=
            '<button type="button" class="tts-big' +
            (state.ttsGlobalLock ? " tts-loading" : "") +
            '" id="btnForceTts"' +
            (state.ttsGlobalLock ? " disabled" : "") +
            ' title="朗读完整句" aria-label="朗读完整句">' +
            (state.ttsGlobalLock ? "⏳" : "🔊") +
            "</button>";
        }
      }

      if (state.forceRoundComplete) {
        html += '<div class="success-banner">🏆 本轮通关（一名学生）！请下一位同学点击继续。</div>';
        html +=
          '<div class="reveal-btn-wrap"><button type="button" class="crayon b-green" id="btnForceAgain">下一位同学 / 再来一轮</button></div>';
      }

      if (!state.forceItem && state.phase === 4 && !state.forceRoundComplete && !state.forceWrongModal) {
        state.forceItem = pickRandomForceItem();
        state.forceAwaitTts = false;
        state.lastCorrectSentence = "";
        state.lastRuleKey = "";
        state.lastVerb = "";
        startForceTimer();
      }

      html += "</div>";
    }

    if (state.detailPickSlot) {
      const dv = VERB_DETAIL_BANK[getDetailBankIndex()];
      html += '<div class="pick-overlay" id="detailPickOverlay">';
      html += '<div class="pick-card">';
      html += "<h3>请选择动词形式</h3>";
      html += '<div class="pick-btns">';
      html +=
        '<button type="button" class="pick-opt" data-detail-pick="base">[原形] ' + escapeHtml(dv.base) + "</button>";
      html +=
        '<button type="button" class="pick-opt" data-detail-pick="third">[单三] ' + escapeHtml(dv.third) + "</button>";
      html +=
        '<button type="button" class="pick-opt" id="btnDetailPickCancel" style="border-color:#bbb;border-width:3px;font-size:1rem">取消</button>';
      html += "</div></div></div>";
    }

    app.innerHTML = html;

    if (state.forceWrongModal) {
      const oldM = document.getElementById("warnModal");
      if (oldM) {
        oldM.remove();
      }
      const wm = state.forceWrongModal;
      const o = document.createElement("div");
      o.className = "warn-modal";
      o.id = "warnModal";
      o.innerHTML =
        '<div class="warn-card"><strong>' +
        escapeHtml(wm.title) +
        "</strong><p>" +
        escapeHtml(wm.tip) +
        '</p><button type="button" class="crayon b-blue" id="btnWarnOk">知道了</button></div>';
      document.body.appendChild(o);
    }
  }

  function bindEventsDelegated() {
    document.addEventListener("click", function (e) {
      const t = e.target;
      if (t.closest("#btnWarnOk")) {
        const m = document.getElementById("warnModal");
        if (m) {
          m.remove();
        }
        state.forceWrongModal = null;
        if (state.phase === 4 && !state.forceRoundComplete && !state.forceItem && !state.forceAwaitTts) {
          state.forceItem = pickRandomForceItem();
          startForceTimer();
        }
        render();
      }
    });

    app.addEventListener("click", function (e) {
      const t = e.target;
      const tab = t.closest(".tab-btn");
      if (tab) {
        stopAllSpeechMedia();
        state.ttsSessionId++;
        state.ttsGlobalLock = false;
        document.body.classList.remove("tts-locked");
        const ph = parseInt(tab.getAttribute("data-phase"), 10);
        if ((ph === 4) !== (state.phase === 4)) {
          clearForceTimer();
          state.forceItem = null;
          state.forceStreak = 0;
          state.forceUsedIds = {};
          state.forceAwaitTts = false;
          state.forceRoundComplete = false;
          state.forceWrongModal = null;
          state.lastCorrectSentence = "";
          state.lastRuleKey = "";
          state.lastVerb = "";
        }
        state.detailPickSlot = null;
        state.phase = ph;
        render();
        return;
      }

      if (state.ttsGlobalLock && !t.closest("#warnModal")) {
        return;
      }

      const vh = t.closest(".verb-hit");
      if (vh && state.phase === 1) {
        vh.classList.toggle("is-on");
        return;
      }

      const cpTts = t.closest("[data-cp-tts]");
      if (cpTts && state.phase === 1) {
        const ix = parseInt(cpTts.getAttribute("data-cp-tts"), 10);
        const side = cpTts.getAttribute("data-cp-side");
        const pair = COMPARE_PAIRS[ix];
        if (!pair || state.ttsGlobalLock) return;
        const txt = side === "L" ? pair.left : pair.right;
        speakWithGlobalLock(txt).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnReveal")) {
        state.ruleOpen = !state.ruleOpen;
        render();
        return;
      }

      const detailTtsRead = t.closest("[data-detail-tts-read]");
      if (detailTtsRead && state.phase === 2) {
        const slot = detailTtsRead.getAttribute("data-detail-tts-read");
        const bix = getDetailBankIndex();
        const v = VERB_DETAIL_BANK[bix];
        const full = slot === "b" ? v.exB.full : v.exA.full;
        speakWithGlobalLock(full).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      const detailResample = t.closest("[data-detail-resample]");
      if (detailResample && state.phase === 2) {
        state.detailSessionOrder = buildDetailSession();
        state.detailSessionPos = 0;
        state.detailProgress = {};
        state.detailPickSlot = null;
        render();
        return;
      }

      const detailNav = t.closest("[data-detail-nav]");
      if (detailNav && state.phase === 2) {
        const dir = detailNav.getAttribute("data-detail-nav");
        state.detailPickSlot = null;
        const sl = state.detailSessionOrder.length;
        if (dir === "prev" && state.detailSessionPos > 0) {
          state.detailSessionPos--;
        } else if (dir === "next" && state.detailSessionPos < sl - 1) {
          state.detailSessionPos++;
        }
        render();
        return;
      }

      const detailBlank = t.closest("[data-detail-blank]");
      if (detailBlank && state.phase === 2) {
        if (detailBlank.classList.contains("done")) {
          return;
        }
        if (state.detailPickSlot) {
          return;
        }
        const slot = detailBlank.getAttribute("data-detail-blank");
        state.detailPickSlot = slot === "b" ? "b" : "a";
        render();
        return;
      }

      const detailPickBtn = t.closest("[data-detail-pick]");
      if (detailPickBtn && state.detailPickSlot && state.phase === 2) {
        const pick = detailPickBtn.getAttribute("data-detail-pick");
        const bix = getDetailBankIndex();
        const v = VERB_DETAIL_BANK[bix];
        const slot = state.detailPickSlot;
        const wantBase = slot === "a";
        const ok = wantBase ? pick === "base" : pick === "third";
        const ex = slot === "a" ? v.exA : v.exB;
        if (!ok) {
          detailPickBtn.style.animation = "none";
          void detailPickBtn.offsetWidth;
          detailPickBtn.style.animation = "shake 0.45s ease";
          return;
        }
        setDetailSlotDone(bix, slot, true);
        state.detailPickSlot = null;
        render();
        speakWithGlobalLock(ex.full).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (state.detailPickSlot) {
        if (t.closest("#btnDetailPickCancel") || t.id === "detailPickOverlay") {
          state.detailPickSlot = null;
          render();
          return;
        }
      }

      const bottle = t.closest("[data-bottle]");
      if (bottle) {
        if (state.phase !== 3) return;
        if (state.transformIndex >= TRANSFORM_DRILLS.length) return;
        if (state.ttsGlobalLock) return;
        const key = bottle.getAttribute("data-bottle");
        const cur = TRANSFORM_DRILLS[state.transformIndex];
        if (key === cur.bottle) {
          bottle.classList.add("flash-ok");
          setTimeout(function () {
            bottle.classList.remove("flash-ok");
          }, 700);
          const line = cur.pastTts.replace(/\.\.\./g, ", ").replace(/!/g, ".");
          speakWithGlobalLock(line)
            .then(function () {
              state.transformIndex++;
              render();
            })
            .catch(function (err) {
              alert("朗读失败：" + (err && err.message ? err.message : String(err)));
            });
        } else {
          bottle.style.animation = "none";
          void bottle.offsetWidth;
          bottle.style.animation = "shake 0.4s ease";
        }
        return;
      }

      if (t.closest("#btnForceSkip")) {
        if (state.phase !== 4 || state.forceRoundComplete) return;
        if (state.forceAwaitTts || state.ttsGlobalLock) return;
        if (!state.forceItem) return;
        clearForceTimer();
        state.forceItem = pickRandomForceItem();
        startForceTimer();
        render();
        return;
      }

      const choiceBtn = t.closest("[data-choice]");
      if (choiceBtn) {
        if (state.phase !== 4) return;
        if (!state.forceItem || state.forceAwaitTts || state.ttsGlobalLock) return;
        const ch = choiceBtn.getAttribute("data-choice");
        const fi = state.forceItem;
        const picked3rd = ch === "3rd";
        const correct = fi.needs3rd === picked3rd;
        clearForceTimer();
        if (!correct) {
          state.forceStreak = 0;
          state.forceAwaitTts = false;
          state.lastCorrectSentence = "";
          state.lastRuleKey = "";
          state.lastVerb = "";
          state.forceWrongModal = { title: "答错了", tip: fi.tip };
          state.forceItem = pickRandomForceItem();
          startForceTimer();
          render();
          return;
        }
        state.forceStreak++;
        state.lastCorrectSentence = fi.full;
        state.lastRuleKey = fi.ruleKey;
        state.lastVerb = fi.verb;
        state.forceAwaitTts = true;
        render();
        return;
      }

      if (t.closest("#btnForceTts")) {
        if (state.phase !== 4) return;
        if (!state.lastCorrectSentence || state.ttsGlobalLock) return;
        speakWithGlobalLock(state.lastCorrectSentence)
          .then(function () {
            state.forceTtsPlaying = false;
            state.forceAwaitTts = false;
            if (state.forceStreak >= FORCE_WIN_STREAK) {
              state.forceRoundComplete = true;
              clearForceTimer();
              runConfetti();
              state.forceItem = null;
            } else {
              state.forceItem = pickRandomForceItem();
              startForceTimer();
            }
            render();
          })
          .catch(function (err) {
            state.forceTtsPlaying = false;
            render();
            alert("朗读失败：" + (err && err.message ? err.message : String(err)));
          });
        return;
      }

      if (t.closest("#btnForceAgain")) {
        if (state.phase !== 4) return;
        state.forceStreak = 0;
        state.forceUsedIds = {};
        state.forceRoundComplete = false;
        state.forceItem = null;
        state.forceAwaitTts = false;
        state.lastCorrectSentence = "";
        state.lastRuleKey = "";
        state.lastVerb = "";
        clearForceTimer();
        render();
        return;
      }

    });
  }

  bindEventsDelegated();
  render();
})();
  </script>
</body>
</html>
