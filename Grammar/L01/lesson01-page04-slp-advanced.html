  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function playPopSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) {
        return;
      }
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
      o.start();
      o.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  }

  function playTickSound() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) {
        return;
      }
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.setValueAtTime(520, ctx.currentTime);
      g.gain.setValueAtTime(0.06, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
      o.start();
      o.stop(ctx.currentTime + 0.06);
    } catch (e) {}
  }

  function stopAllSpeechMedia() {
    if (!window.__L01_MEDIA) {
      window.__L01_MEDIA = { audios: [], urls: [] };
    }
    window.__L01_MEDIA.audios.forEach(function (a) {
      try {
        a.pause();
        a.removeAttribute("src");
        a.load();
      } catch (e) {}
    });
    window.__L01_MEDIA.audios = [];
    window.__L01_MEDIA.urls.forEach(function (u) {
      try {
        URL.revokeObjectURL(u);
      } catch (e) {}
    });
    window.__L01_MEDIA.urls = [];
    try {
      if (window.__l01AudioCtx && window.__l01AudioCtx.state === "running") {
        window.__l01AudioCtx.suspend();
      }
    } catch (e) {}
  }

  function playBlob(blob, resolve, reject) {
    if (!window.__L01_MEDIA) {
      window.__L01_MEDIA = { audios: [], urls: [] };
    }
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && !window.__l01AudioCtx) {
        window.__l01AudioCtx = new Ctx();
      }
      if (window.__l01AudioCtx && window.__l01AudioCtx.state === "suspended") {
        window.__l01AudioCtx.resume();
      }
    } catch (e) {}
    const url = URL.createObjectURL(blob);
    window.__L01_MEDIA.urls.push(url);
    const audio = new Audio(url);
    window.__L01_MEDIA.audios.push(audio);
    audio.onended = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      const ix = window.__L01_MEDIA.urls.indexOf(url);
      if (ix >= 0) {
        window.__L01_MEDIA.urls.splice(ix, 1);
      }
      const ai = window.__L01_MEDIA.audios.indexOf(audio);
      if (ai >= 0) {
        window.__L01_MEDIA.audios.splice(ai, 1);
      }
      resolve();
    };
    audio.onerror = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      reject(new Error("音频播放失败"));
    };
    audio.play().catch(function (e) {
      try {
        URL.revokeObjectURL(url);
      } catch (e2) {}
      reject(e);
    });
  }

  function speakWithGlobalLock(text) {

        document.body.classList.remove("tts-locked");

  function runConfetti() {
    confettiCanvas.classList.remove("hidden");
    const ctx = confettiCanvas.getContext("2d");
    const w = (confettiCanvas.width = window.innerWidth);
    const h = (confettiCanvas.height = window.innerHeight);
    const pieces = [];
    const colors = ["#e85d4c", "#4a90d9", "#5cb85c", "#f0ad4e", "#9b59b6", "#ffeaa7", "#ffeb3b"];
    for (let i = 0; i < 160; i++) {
      pieces.push({
        x: Math.random() * w,
        y: Math.random() * -h * 0.4,
        r: 4 + Math.random() * 9,
        vy: 2 + Math.random() * 5,
        vx: (Math.random() - 0.5) * 3.5,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.22,
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    let frames = 0;
    function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(function (p) {
        p.y += p.vy;
        p.x += p.vx;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.12);
        ctx.restore();
      });
      if (frames < 200) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, w, h);
        confettiCanvas.classList.add("hidden");
      }
    }
    tick();
  }

  function positionFlyNot() {
    const anchor = document.getElementById("fuseAnchor");
    const fly = document.getElementById("wordNotFly");
    if (!anchor || !fly) {
      return;
    }
    const a = anchor.getBoundingClientRect();
    const f = fly.getBoundingClientRect();
    const parent = fly.offsetParent;
    if (!parent) {
      return;
    }
    const pr = parent.getBoundingClientRect();
    const tx = a.left - pr.left + a.width * 0.85 - (f.left - pr.left);
    const ty = a.top - pr.top - (f.top - pr.top);
    fly.style.setProperty("--tx", tx + "px");
    fly.style.setProperty("--ty", ty + "px");
  }

        html +=
          '<span class="drill-collapse-sub">' +
          (state.stage1DrillOpen ? "收起" : "展开") +
          "</span>";
        html += "</button>";
        html +=
          '<div class="drill-collapse-panel"' +
          (state.stage1DrillOpen ? "" : " hidden") +
          ">";
        html += '<div class="success-banner">10 题全部完成！可继续阶段二或重温练习。</div>';
        html += "</div></div>";
      } else {
        if (state.stage1DrillOpts.length === 0) {
          prepareStage1DrillOptions();
        }
        const dq = STAGE1_DRILL[state.stage1DrillIndex];
        if (dq) {
          html += '<div class="stage1-drill-box drill-collapsible">';
          html +=
            '<button type="button" class="drill-collapse-toggle" data-drill-toggle="1" aria-expanded="' +
            (state.stage1DrillOpen ? "true" : "false") +
            '">';
          html += '<span class="drill-collapse-icon">▶</span>';
          html += "<span>学生练习 · 肯定/否定转换（单选）</span>";
          html +=
            '<span class="drill-collapse-sub">' +
            (state.stage1DrillOpen ? "收起" : "展开") +
            "</span>";
          html += "</button>";
          html +=
            '<div class="drill-collapse-panel"' +
            (state.stage1DrillOpen ? "" : " hidden") +
            ">";
          html +=
            '<p class="stage1-drill-progress">第 ' +
            (state.stage1DrillIndex + 1) +
            " / " +
            STAGE1_DRILL.length +
            " 题</p>";
          html += '<p class="stage1-drill-stem">' + escapeHtml(dq.stem) + "</p>";
          html += '<div class="stage1-drill-line-wrap">';
          html += '<div class="stage1-drill-line-card">' + escapeHtml(dq.line) + "</div>";
          html += "</div>";
          html += '<div class="stage1-drill-tts">';
          html +=
            '<button type="button" class="crayon b-red btn-tts" id="btnStage1DrillTts"' +
            (state.ttsGlobalLock ? " disabled" : "") +
            ' title="朗读（优先本地 MP3）" aria-label="朗读（优先本地 MP3）">🔊</button>';
          html += "</div>";
          if (state.stage1DrillWrongTip) {
            html +=
              '<p class="tip-warn">' + escapeHtml(state.stage1DrillWrongTip) + "</p>";
          }
          html += '<div class="choice-row">';
          for (let oi = 0; oi < state.stage1DrillOpts.length; oi++) {
            const o = state.stage1DrillOpts[oi];
            html +=
              '<button type="button" class="choice-opt choice-opt-s1" data-s1-i="' +
              oi +
              '">' +
              escapeHtml(o.letter) +
              ". " +
              escapeHtml(o.label) +
              "</button>";
          }
          html += "</div>";
          html += "</div></div>";
        }
      }

      html += "</div>";
    }

    if (state.stage === 2) {
      html += '<h1 class="page-title">阶段二 · 跷跷板提问（一般疑问 · Yes/No）</h1>';
      html +=
        '<p class="hint">含 <code>be</code> 的句子：把 <strong>be</strong> 提前、句号改问号；含<strong>实义动词</strong>的句子：句首加 <code>Do / Does</code>、动词用原形。回答多用 <strong>Yes</strong> / <strong>No</strong> 起头。</p>';
      html += '<div class="blackboard">';
      html += "<h2>三句话展示：陈述句 → 一般疑问句</h2>";
      html += '<div class="stage2-three-showcase" aria-label="三句对照">';
      for (let si = 0; si < STAGE2_SHOWCASE.length; si++) {
        const sc = STAGE2_SHOWCASE[si];
        const revealed = state.stage2Reveal[si];
        html += '<div class="stage2-pair-row">';
        html += '<span class="stage2-st">' + escapeHtml(sc.stmt) + "</span>";
        html +=
          '<button type="button" class="stage2-arr" data-stage2-reveal="' +
          si +
          '" aria-label="显示第 ' +
          (si + 1) +
          ' 句的一般疑问句">→</button>';
        html += '<span class="stage2-yq-reveal">';
        if (revealed) {
          html += '<span class="stage2-yq">' + escapeHtml(sc.q) + "</span>";
          html +=
            '<button type="button" class="crayon b-red btn-tts" data-stage2-showcase-tts="' +
            si +
            '"' +
            (state.ttsGlobalLock ? " disabled" : "") +
            ' title="朗读问句" aria-label="朗读问句">🔊</button>';
        } else {
          html +=
            '<button type="button" class="stage2-yq-mask" data-stage2-reveal="' +
            si +
            '">一般疑问句（点击显示）</button>';
        }
        html += "</span>";
        html += "</div>";
      }
      html += "</div>";

      if (state.stage2DrillComplete) {
        html += '<div class="stage2-drill-box drill-collapsible">';
        html +=
          '<button type="button" class="drill-collapse-toggle" data-drill-toggle="2" aria-expanded="' +
          (state.stage2DrillOpen ? "true" : "false") +
          '">';
        html += '<span class="drill-collapse-icon">▶</span>';
        html += "<span>学生练习 · 一般疑问句</span>";
        html +=
          '<span class="drill-collapse-sub">' +
          (state.stage2DrillOpen ? "收起" : "展开") +
          "</span>";
        html += "</button>";
        html +=
          '<div class="drill-collapse-panel"' +
          (state.stage2DrillOpen ? "" : " hidden") +
          ">";
        html += '<div class="success-banner">10 题全部完成！可重温练习。</div>';
        html += "</div></div>";
      } else {
        if (state.stage2DrillOpts.length === 0) {
          prepareStage2DrillOptions();
        }
        const dq2 = STAGE2_DRILL[state.stage2DrillIndex];
        if (dq2) {
          html += '<div class="stage2-drill-box drill-collapsible">';
          html +=
            '<button type="button" class="drill-collapse-toggle" data-drill-toggle="2" aria-expanded="' +
            (state.stage2DrillOpen ? "true" : "false") +
            '">';
          html += '<span class="drill-collapse-icon">▶</span>';
          html += "<span>学生练习 · 一般疑问句（单选）</span>";
          html +=
            '<span class="drill-collapse-sub">' +
            (state.stage2DrillOpen ? "收起" : "展开") +
            "</span>";
          html += "</button>";
          html +=
            '<div class="drill-collapse-panel"' +
            (state.stage2DrillOpen ? "" : " hidden") +
            ">";
          html +=
            '<p class="stage1-drill-progress">第 ' +
            (state.stage2DrillIndex + 1) +
            " / " +
            STAGE2_DRILL.length +
            " 题</p>";
          html += '<p class="stage1-drill-stem">' + escapeHtml(dq2.stem) + "</p>";
          html += '<div class="stage1-drill-line-wrap">';
          html += '<div class="stage1-drill-line-card">' + escapeHtml(dq2.line) + "</div>";
          html += "</div>";
          html += '<div class="stage1-drill-tts">';
          html +=
            '<button type="button" class="crayon b-red btn-tts" id="btnStage2DrillTts"' +
            (state.ttsGlobalLock ? " disabled" : "") +
            ' title="朗读（优先本地 MP3）" aria-label="朗读（优先本地 MP3）">🔊</button>';
          html += "</div>";
          if (state.stage2DrillWrongTip) {
            html +=
              '<p class="tip-warn">' + escapeHtml(state.stage2DrillWrongTip) + "</p>";
          }
          html += '<div class="choice-row">';
          for (let oi = 0; oi < state.stage2DrillOpts.length; oi++) {
            const o = state.stage2DrillOpts[oi];
            html +=
              '<button type="button" class="choice-opt choice-opt-s2" data-s2-i="' +
              oi +
              '">' +
              escapeHtml(o.letter) +
              ". " +
              escapeHtml(o.label) +
              "</button>";
          }
          html += "</div>";
          html += "</div></div>";
        }
      }

      html += "</div>";
    }

    if (state.stage === 3) {
      html += '<h1 class="page-title">阶段三 · 真假跷跷板（一般疑问 · Yes/No 应答）</h1>';
      html +=
        '<p class="hint">听到<strong>一般疑问句</strong>，选出<strong>得体</strong>的短小回答：通常以 <strong>Yes</strong> / <strong>No</strong> 开头，并注意<strong>人称</strong>与 <strong>be 动词</strong>搭配。连对 <strong>3</strong> 题通关。</p>';
      html += '<div class="streak-row">';
      for (let si = 0; si < 3; si++) {
        html += si < state.stage3Streak ? "⭐" : "☆";
      }
      html += "</div>";

      if (state.stage3Complete) {
        html += '<div class="success-banner">🎉 三连星！一般疑问应答通关！</div>';
        html += '<div class="reveal-btn-wrap">';
        html +=
          '<button type="button" class="crayon b-green" id="btnPage5">进入 Page 5：动作家族的头号规则（单三）</button>';
        html += "</div>";
      } else {
        if (state.stage3Opts.length === 0) {
          prepareStage3Options();
        }
        const dq = DRILL_QUESTIONS[state.stage3Index];
        html += '<div class="drill-drop-zone drill-q-static">';
        html += '<div class="stage1-drill-line-card">' + escapeHtml(dq.q) + "</div>";
        html += "</div>";
        html += '<div class="drill-q-tts">';
        html +=
          '<button type="button" class="crayon b-red btn-tts" id="btnStage3Qtts"' +
          (state.ttsGlobalLock ? " disabled" : "") +
          ' title="朗读（优先本地 MP3）" aria-label="朗读（优先本地 MP3）">🔊</button>';
        html += "</div>";
        if (state.stage3WrongTip) {
          html += '<p class="tip-warn">' + escapeHtml(state.stage3WrongTip) + "</p>";
        }
        html += '<div class="choice-row">';
        for (let oi = 0; oi < state.stage3Opts.length; oi++) {
          const o = state.stage3Opts[oi];
          html +=
            '<button type="button" class="choice-opt" data-oid="' +
            escapeHtml(o.id) +
            '">' +
            escapeHtml(o.label) +
            "</button>";
        }
        html += "</div>";
      }
    }

    if (state.ttsLoading) {
      html += '<div class="tts-lock-overlay" aria-hidden="true"></div>';
    }

    app.innerHTML = html;

    if (state.stage === 1) {
      maybeAttachStage1DemoConclusionOverlay();
    } else {
      const ex = document.getElementById("stage1-demo-conclusion-overlay");
      if (ex) {
        ex.remove();
      }
    }
  }

  function bindEvents() {
    stageNav.addEventListener("click", function (e) {
      const b = e.target.closest("button[data-goto]");
      if (!b) {
        return;
      }
      const n = parseInt(b.getAttribute("data-goto"), 10);
      if (n >= 1 && n <= 3) {
        stopAllSpeechMedia();
        state.ttsSessionId++;
        state.ttsGlobalLock = false;
        state.ttsLoading = false;
        document.body.classList.remove("tts-locked");
        state.stage = n;
        if (n === 3 && !state.stage3Complete && state.stage3Opts.length === 0) {
          prepareStage3Options();
        }
        render();
      }
    });

    app.addEventListener("click", function (e) {
      const t = e.target;

      const dToggle = t.closest("[data-drill-toggle]");
      if (dToggle) {
        const which = dToggle.getAttribute("data-drill-toggle");
        if (which === "1" && state.stage === 1) {
          state.stage1DrillOpen = !state.stage1DrillOpen;
          render();
          return;
        }
        if (which === "2" && state.stage === 2) {
          state.stage2DrillOpen = !state.stage2DrillOpen;
          render();
          return;
        }
      }

      if (t.closest("#btnStage3Qtts") && state.stage === 3 && !state.stage3Complete) {
        const dq = DRILL_QUESTIONS[state.stage3Index];
        if (!dq || state.ttsGlobalLock) return;
        speakWithGlobalLock(dq.tts).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnStage1ItDemoTts") && state.stage === 1 && state.stage1Tab === "it") {
        if (state.ttsGlobalLock) return;
        const txt = state.stage1ItStep >= 3 ? "It isn't in my schoolbag." : "It is in my schoolbag.";
        speakWithGlobalLock(txt).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnStage1AmDemoTts") && state.stage === 1 && state.stage1Tab === "am") {
        if (state.ttsGlobalLock) return;
        const txt = state.stage1AmStep >= 2 ? "I am not tall." : "I am tall.";
        speakWithGlobalLock(txt).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnStage1YouDemoTts") && state.stage === 1 && state.stage1Tab === "you") {
        if (state.ttsGlobalLock) return;
        const txt =
          state.stage1YouStep >= 3
            ? "You aren't in our club."
            : "You are in our club.";
        speakWithGlobalLock(txt).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnSummonNotIt") && state.stage === 1 && state.stage1Tab === "it") {
        startStage1ItFusion();
        return;
      }

      if (t.closest("#btnSummonNotYou") && state.stage === 1 && state.stage1Tab === "you") {
        startStage1YouFusion();
        return;
      }

      if (t.closest("#btnSummonNotAm") && state.stage === 1 && state.stage1Tab === "am") {
        startStage1AmRepel();
        return;
      }

      if (t.closest("#btnStage1DrillTts") && state.stage === 1 && !state.stage1DrillComplete) {
        const dq = STAGE1_DRILL[state.stage1DrillIndex];
        if (!dq || state.ttsGlobalLock) {
          return;
        }
        speakWithGlobalLock(dq.tts).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest(".choice-opt-s1") && state.stage === 1 && !state.stage1DrillComplete) {
        const btn = t.closest(".choice-opt-s1");
        const idx = parseInt(btn.getAttribute("data-s1-i"), 10);
        const opt = state.stage1DrillOpts[idx];
        if (!opt) {
          return;
        }
        if (!opt.correct) {
          state.stage1DrillWrongTip =
            "再想想：词序、主谓一致，以及 isn't / aren't / am not 的写法哦～";
          btn.classList.add("cracked");
          setTimeout(function () {
            btn.classList.remove("cracked");
          }, 600);
          render();
          return;
        }
        state.stage1DrillWrongTip = "";
        state.stage1DrillIndex++;
        state.stage1DrillOpts = [];
        if (state.stage1DrillIndex >= STAGE1_DRILL.length) {
          state.stage1DrillComplete = true;
        }
        render();
        return;
      }

      if (t.closest("[data-tab]") && state.stage === 1) {
        const tab = t.getAttribute("data-tab");
        if (tab === "it" || tab === "you" || tab === "am") {
          state.stage1Tab = tab;
          render();
        }
        return;
      }

      if (t.closest("#btnGoStage2") && state.stage === 1) {
        state.stage = 2;
        state.stage2Reveal = [false, false, false];
        state.stage2DrillOpen = false;
        render();
        return;
      }

      const s2rev = t.closest("[data-stage2-reveal]");
      if (s2rev && state.stage === 2) {
        const idx = parseInt(s2rev.getAttribute("data-stage2-reveal"), 10);
        if (idx >= 0 && idx < STAGE2_SHOWCASE.length && !state.stage2Reveal[idx]) {
          state.stage2Reveal[idx] = true;
          render();
        }
        return;
      }

      const s2showTts = t.closest("[data-stage2-showcase-tts]");
      if (s2showTts && state.stage === 2) {
        const idx = parseInt(s2showTts.getAttribute("data-stage2-showcase-tts"), 10);
        const sc = STAGE2_SHOWCASE[idx];
        if (!sc || !state.stage2Reveal[idx] || state.ttsGlobalLock) {
          return;
        }
        speakWithGlobalLock(sc.q).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnStage2DrillTts") && state.stage === 2 && !state.stage2DrillComplete) {
        const dq2 = STAGE2_DRILL[state.stage2DrillIndex];
        if (!dq2 || state.ttsGlobalLock) {
          return;
        }
        speakWithGlobalLock(dq2.tts).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest(".choice-opt-s2") && state.stage === 2 && !state.stage2DrillComplete) {
        const btn = t.closest(".choice-opt-s2");
        const idx = parseInt(btn.getAttribute("data-s2-i"), 10);
        const opt = state.stage2DrillOpts[idx];
        if (!opt) {
          return;
        }
        if (!opt.correct) {
          state.stage2DrillWrongTip =
            "再想想：语序与问号；be 动词与人称；Do/Does 与主语单复数及动词原形哦～";
          btn.classList.add("cracked");
          setTimeout(function () {
            btn.classList.remove("cracked");
          }, 600);
          render();
          return;
        }
        state.stage2DrillWrongTip = "";
        state.stage2DrillIndex++;
        state.stage2DrillOpts = [];
        if (state.stage2DrillIndex >= STAGE2_DRILL.length) {
          state.stage2DrillComplete = true;
        }
        render();
        return;
      }

      if (t.closest("#btnPage5") && state.stage === 3) {
        window.location.href = "lesson01-page05-svo-rules.html";
        return;
      }

      if (t.closest(".choice-opt") && state.stage === 3 && !state.stage3Complete) {
        const btn = t.closest(".choice-opt");
        const oid = btn.getAttribute("data-oid");
        let opt = null;
        for (let i = 0; i < state.stage3Opts.length; i++) {
          if (state.stage3Opts[i].id === oid) {
            opt = state.stage3Opts[i];
            break;
          }
        }
        if (!opt) {
          return;
        }
        if (opt.trap) {
          state.stage3WrongTip =
            "一般疑问句要先用 Yes / No 开头简短回答，并检查人称与 is / am / are 是否搭配哦！";
          btn.classList.add("cracked");
          setTimeout(function () {
            btn.classList.remove("cracked");
          }, 600);
          state.stage3Streak = 0;
          render();
          return;
        }
        state.stage3WrongTip = "";
        state.stage3Streak++;
        if (state.stage3Streak >= 3) {
          state.stage3Complete = true;
          runConfetti();
          render();
          return;
        }
        state.stage3Index = (state.stage3Index + 1) % DRILL_QUESTIONS.length;
        state.stage3Opts = [];
        prepareStage3Options();
        render();
        return;
      }
    });
  }

  bindEvents();
  render();
})();
  </script>
  <link rel="stylesheet" href="assets/lesson-image-lightbox.css" />
  <script src="assets/lesson-image-lightbox.js" defer></script>
</body>
