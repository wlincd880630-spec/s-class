      a[i] = a[j];
      a[j] = t;

        window.__l01AudioCtx.resume();
      }
    } catch (e) {}
    const url = URL.createObjectURL(blob);
    window.__L01_MEDIA.urls.push(url);
    const audio = new Audio(url);
    window.__L01_MEDIA.audios.push(audio);
    audio.onended = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      const ix = window.__L01_MEDIA.urls.indexOf(url);
      if (ix >= 0) {
        window.__L01_MEDIA.urls.splice(ix, 1);
      }
      const ai = window.__L01_MEDIA.audios.indexOf(audio);
      if (ai >= 0) {
        window.__L01_MEDIA.audios.splice(ai, 1);
      }
      resolve();
    };
    audio.onerror = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      reject(new Error("音频播放失败"));
    };
    audio.play().catch(function (e) {
      try {
        URL.revokeObjectURL(url);
      } catch (e2) {}
      reject(e);
    });
  }

  function runConfetti() {
    confettiCanvas.classList.remove("hidden");
    const ctx = confettiCanvas.getContext("2d");
    const w = (confettiCanvas.width = window.innerWidth);
    const h = (confettiCanvas.height = window.innerHeight);
    const pieces = [];
    const colors = ["#e85d4c", "#4a90d9", "#5cb85c", "#f0ad4e", "#9b59b6", "#ffeaa7"];
    for (let i = 0; i < 130; i++) {
      pieces.push({
        x: Math.random() * w,
        y: Math.random() * -h * 0.35,
        r: 4 + Math.random() * 8,
        vy: 2 + Math.random() * 4,
        vx: (Math.random() - 0.5) * 3,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.2,
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    let frames = 0;
    function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(function (p) {
        p.y += p.vy;
        p.x += p.vx;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.1);
        ctx.restore();
      });
      if (frames < 190) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, w, h);
        confettiCanvas.classList.add("hidden");
      }
    }
    tick();
  }

    state.filledVerb = "";
    state.wrongTip = "";
    state.wrongMirrorHtml = "";
    state.ttsGlobalLock = false;
    document.body.classList.remove("tts-locked");
    clearNextTimer();
  }

  function bindEvents() {
    app.addEventListener("click", function (e) {
      const t = e.target;

      if (t.closest("#btnDrillSkip") && state.stage === 2 && !state.forceComplete) {
        if (state.awaitingTts || state.ttsGlobalLock || state.betweenRounds) return;
        if (state.filledHelper && state.filledVerb) return;
        clearNextTimer();
        state.currentItem = pickRandomItem();
        state.optionRows = generateDynamicOptions(state.currentItem);
        state.wrongTip = "";
        state.wrongMirrorHtml = "";
        render();
        return;
      }

      if (t.closest("#btnForceNextStudent") && state.stage === 2) {
        resetForceStudentRound();
        render();
        return;
      }

      if (state.ttsGlobalLock && state.stage === 2 && !t.closest("#btnDrillTts")) {
        return;
      }

      if (t.closest("#btnDemoATts") && state.stage === 1) {
        if (state.ttsGlobalLock) return;
        speakWithGlobalLock(getDemoAPlainTts()).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnDemoBTts") && state.stage === 1) {
        if (state.ttsGlobalLock) return;
        speakWithGlobalLock(getDemoBPlainTts()).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("[data-stage1-drill-toggle]") && state.stage === 1) {
        state.stage1MirrorDrillOpen = !state.stage1MirrorDrillOpen;
        render();
        return;
      }

      if (t.closest("#btnStage1MirrorDrillTts") && state.stage === 1) {
        if (state.ttsGlobalLock) return;
        const dq = STAGE1_MIRROR_DRILL[state.stage1MirrorDrillIndex];
        if (!dq || state.stage1MirrorDrillComplete) return;
        speakWithGlobalLock(dq.ttsText).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest(".choice-opt-s1") && state.stage === 1 && !state.stage1MirrorDrillComplete) {
        if (state.ttsGlobalLock) return;
        const btn = t.closest(".choice-opt-s1");
        const idx = parseInt(btn.getAttribute("data-s1-i"), 10);
        const opt = state.stage1MirrorDrillOpts[idx];
        if (!opt) return;
        if (!opt.correct) {
          state.stage1MirrorDrillWrongTip =
            "照妖镜法则：doesn't 后面要跟动词原形，不能把第三人称单数的「尾巴」留在动词上哦。";
          btn.classList.add("wrong-shake");
          setTimeout(function () {
            btn.classList.remove("wrong-shake");
          }, 500);
          render();
          return;
        }
        state.stage1MirrorDrillWrongTip = "";
        state.stage1MirrorDrillIndex++;
        state.stage1MirrorDrillOpts = [];
        if (state.stage1MirrorDrillIndex >= STAGE1_MIRROR_DRILL.length) {
          state.stage1MirrorDrillComplete = true;
        }
        render();
        return;
      }

      if (state.ttsGlobalLock && state.stage === 1) {
        return;
      }

      if (t.closest(".demo-b-tab") && state.stage === 1) {
        const mid = state.demoBAnimStep >= 1 && state.demoBAnimStep < 3;
        if (mid) {
          return;
        }
        const variant = t.closest(".demo-b-tab").getAttribute("data-variant");
        if (variant) {
          state.demoBVariant = variant;
          state.demoBAnimStep = 0;
          state.demoBRuleExpanded = false;
          render();
        }
        return;
      }

      if (t.closest("#btnSummonA") && state.stage === 1 && !state.demoASummoned) {
        state.demoASummoned = true;
        render();
        return;
      }

      if (t.closest("#btnSummonB") && state.stage === 1 && (state.demoBAnimStep === 0 || state.demoBAnimStep === 3)) {
        state.demoBAnimStep = 1;
        state.demoBRuleExpanded = false;
        render();
        return;
      }

      if (t.closest("#btnMirrorRule") && state.stage === 1 && state.demoBAnimStep >= 3) {
        state.demoBRuleExpanded = !state.demoBRuleExpanded;
        render();
        return;
      }

      if (t.closest("#btnEnterDrill") && state.stage === 1 && state.demoBAnimStep >= 3) {
        goToStage2Drill();
        return;
      }

      if (t.closest(".choice-opt") && state.stage === 2 && !state.forceComplete) {
        if (state.awaitingTts || state.ttsGlobalLock) {
          return;
        }
        const btn = t.closest(".choice-opt");
        const oid = btn.getAttribute("data-oid");
        let opt = null;
        for (let i = 0; i < state.optionRows.length; i++) {
          if (state.optionRows[i].id === oid) {
            opt = state.optionRows[i];
            break;
          }
        }
        if (!opt || !state.currentItem) {
          return;
        }
        if (!opt.correct) {
          state.forceStreak = 0;
          state.wrongMirrorHtml = buildMirrorWrongHtml(state.currentItem, opt);
          state.wrongTip = state.wrongMirrorHtml
            ? ""
            : "星星全灭！主语选对助动词，并记住照妖镜法则：doesn't 后动词必须原形。";
          btn.classList.add("wrong-shake");
          setTimeout(function () {
            btn.classList.remove("wrong-shake");
          }, 500);
          render();
          return;
        }
        state.wrongTip = "";
        state.wrongMirrorHtml = "";
        state.filledHelper = opt.helper;
        state.filledVerb = opt.verb;
        state.awaitingTts = true;
        render();
        return;
      }

      if (t.closest("#btnDrillTts")) {
        if (!state.currentItem || state.ttsGlobalLock) {
          return;
        }
        const full = buildNegativeSentence(state.currentItem);
        speakWithGlobalLock(full)
          .then(function () {
            state.awaitingTts = false;
            state.forceStreak++;
            if (state.forceStreak >= FORCE_WIN_STREAK) {
              state.forceComplete = true;
              state.filledHelper = "";
              state.filledVerb = "";
              runConfetti();
              render();
              return;
            }
            state.betweenRounds = true;
            render();
            clearNextTimer();
            state.nextTimer = setTimeout(function () {
              state.betweenRounds = false;
              state.currentItem = pickRandomItem();
              state.optionRows = generateDynamicOptions(state.currentItem);
              state.filledHelper = "";
              state.filledVerb = "";
              state.wrongTip = "";
              state.wrongMirrorHtml = "";
              state.nextTimer = null;
              render();
            }, 1000);
          })
          .catch(function (err) {
            alert("朗读失败：" + (err && err.message ? err.message : String(err)));
          });
        return;
      }

      if (t.closest("#btnPage6")) {
        window.location.href = "lesson01-page07-svo-question.html";
        return;
      }
    });
  }

  bindEvents();
  render();
})();
  </script>
