  <script>
(function () {
  "use strict";

  /** true：浏览器直连 Azure Speech（LOCAL_AZURE_KEY 仅用于本地课）；false：走 /api/tts 代理 */
  const LOCAL_DEV_MODE = false;
  const LOCAL_AZURE_KEY =
    (typeof window !== "undefined" && window.__AZURE_SPEECH_KEY__) || "4SJbskufsk2tiu5jq1kzlJwTDw2eVPYd8e7HvDhb3lX6ZmItWOnxJQQJ99CHACqBBLyXJ3w3AAAYACOGxnpO";
  const LOCAL_AZURE_REGION = (typeof window !== "undefined" && window.__AZURE_SPEECH_REGION__) || "southeastasia";

  /**
   * 例句选自教材或教学化改写；q1: "action" | "state"；q2（仅动作家族句）: "habit" | "schedule"
   */
  const SENTENCES = [
    { id: 1, type: "svo", text: "I read English books every morning.", q1: "action", q2: "habit" },
    { id: 2, type: "svo", text: "I play basketball every weekend with my brother and my friends.", q1: "action", q2: "habit" },
    { id: 3, type: "svo", text: "Every week, we change seats.", q1: "action", q2: "habit" },
    { id: 4, type: "svo", text: "We spend most of the time in our classroom.", q1: "action", q2: "habit" },
    { id: 5, type: "svo", text: "I often listen to the news or music.", q1: "action", q2: "habit" },
    { id: 6, type: "svo", text: "The train leaves the station at 9:00.", q1: "action", q2: "schedule" },
    { id: 7, type: "svo", text: "I play it three times a week.", q1: "action", q2: "habit" },
    { id: 8, type: "slp", text: "My name is Emma Miller.", q1: "state" },
    { id: 9, type: "slp", text: "I'm 13 years old.", q1: "state" },
    { id: 10, type: "slp", text: "My favourite food is beef noodles.", q1: "state" },
    { id: 11, type: "slp", text: "The school library is very big.", q1: "state" },
    { id: 12, type: "slp", text: "Food is life.", q1: "state" }
  ];

  const Q1_LABELS = {
    action: "这句话描述的是：人或事物发出的动作、行为（实义动词句型 / 动作家族倾向）。",
    state: "这句话描述的是：人或事物的状态、身份、地位、性质、特征等（Be 动词句型 / 状态家族倾向）。"
  };

  const Q2_LABELS = {
    habit: "这句话侧重：习惯、爱好、反复发生的动作、客观事实或常见情况。",
    schedule: "这句话侧重：已经排好的时间、时刻表或固定日程安排。"
  };

  const app = document.getElementById("app");
  let state = {
    slide: "intro",
    index: 0,
    showText: false,
    showQ1: false,
    q1Solved: false,
    showQ2: false,
    q2Solved: false,
    q1Shake: null,
    q2Shake: null,
    q1WrongBtn: null,
    q2WrongBtn: null,
    q1Hint: false,
    q2Hint: false,
    summaryRecall: false,
    summaryLeftOk: false,
    summaryRightOk: false,
    sumShakeLeft: null,
    sumShakeRight: null,
    summaryHint: false,
    ttsLoading: false
  };

  function resetSentenceState() {
    state.showText = false;
    state.showQ1 = false;
    state.q1Solved = false;
    state.showQ2 = false;
    state.q2Solved = false;
    state.q1Shake = null;
    state.q2Shake = null;
    state.q1WrongBtn = null;
    state.q2WrongBtn = null;
    state.q1Hint = false;
    state.q2Hint = false;
  }

  function playBlob(blob, resolve, reject) {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = function () {
      URL.revokeObjectURL(url);
      resolve();
    };
    audio.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("音频播放失败"));
    };
    audio.play().catch(function (e) {
      URL.revokeObjectURL(url);
      reject(e);
    });
  }

  function speak(text) {
    if (window.L01Speak && window.L01Speak.speak) {
      return window.L01Speak.speak(text);
    }
    return Promise.resolve();
  }

  function render() {
    if (state.slide === "intro") {
      app.innerHTML = `
        <div class="intro-illus">
          <ul>
            <li><strong>实义动词句型（动作家族）</strong>：常用<strong>实义动词</strong>说明「做了什么」。</li>
            <li><strong>Be 动词句型（状态家族）</strong>：用 <strong>be 动词</strong>等 + 表语，说明「是什么 / 怎么样 / 在哪里」。</li>
          </ul>
          <div class="mission-note">
            <h2>本页教学任务</h2>
            <p>先把句子分成两大“家族”，再为后面的 <strong>三单 / do-does / 否定句 / 提问句</strong> 打地基。今天你最终不是只要分对句子，而是要能说出至少 2-4 句属于自己的日常句。</p>
          </div>
          <p>接下来共有 12 句，每句一页：先听朗读 → 再显示句子 → 回答问题 → 最后分类总结。闯关过程中可用上方的<strong>上一个 / 下一个</strong>在句子间自由跳转（跳转后当前句的显示与答题进度会重置）。</p>
        </div>
        <div class="btn-row">
          <button type="button" class="crayon b-green" id="goStart">开始句子闯关</button>
        </div>`;
      document.getElementById("goStart").onclick = () => {
        state.slide = "sentence";
        state.index = 0;
        resetSentenceState();
        state.summaryRecall = false;
        state.summaryLeftOk = false;
        state.summaryRightOk = false;
        state.sumShakeLeft = null;
        state.sumShakeRight = null;
        state.summaryHint = false;
        state.ttsLoading = false;
        render();
      };
      return;
    }

    if (state.slide === "summary") {
      const svoList = SENTENCES.filter((s) => s.type === "svo");
      const slpList = SENTENCES.filter((s) => s.type === "slp");
      const unlocked = state.summaryLeftOk && state.summaryRightOk;

      app.innerHTML = `
        <p class="progress">总结 · 分类</p>
        <div class="summary-grid">
          <div class="column">
            <h2>实义动词句型（动作家族 · 7 句）</h2>
            <ul>${svoList.map((s) => `<li class="summary-li-tts"><span>${escapeHtml(s.text)}</span><button type="button" class="crayon b-red tts-mini" data-tts-sent="${s.id}" aria-label="Azure 朗读" title="朗读"${state.ttsLoading ? " disabled" : ""}>🔊</button></li>`).join("")}</ul>
          </div>
          <div class="column slp">
            <h2>Be 动词句型（状态家族 · 5 句）</h2>
            <ul>${slpList.map((s) => `<li class="summary-li-tts"><span>${escapeHtml(s.text)}</span><button type="button" class="crayon b-red tts-mini" data-tts-sent="${s.id}" aria-label="Azure 朗读" title="朗读"${state.ttsLoading ? " disabled" : ""}>🔊</button></li>`).join("")}</ul>
          </div>
        </div>
        <div class="btn-row" style="margin-top:1rem;">
          <button type="button" class="crayon b-blue" id="btnRecall">${state.summaryRecall ? "（已展开）思考区" : "显示：还记得吗？"}</button>
        </div>
        <div id="recallBlock" class="${state.summaryRecall ? "" : "hidden"}">
          <div class="q-block">
            <h3>想一想 · 填空</h3>
            <p>观察左边 7 句话中的<strong>动词</strong>，它们主要表达____？右边 5 句话中的 <strong>be 动词</strong>，主要表达____？</p>
            <div class="summary-fill">
              <div class="blank-row">
                <span class="tag-mini">左侧（动作家族）</span>
                动词主要表达：
                <button type="button" class="crayon b-orange sum-l-a ${state.summaryLeftOk ? "choice-correct" : ""}" data-sum-left="A" ${state.summaryLeftOk ? "disabled" : ""}>A. 具体的动作</button>
                <button type="button" class="crayon b-purple sum-l-b ${state.summaryLeftOk ? "choice-wrong" : ""} ${!state.summaryLeftOk && state.sumShakeLeft === "B" ? "shake choice-wrong" : ""}" data-sum-left="B" ${state.summaryLeftOk ? "disabled" : ""}>B. 状态 / 身份 / 特征</button>
              </div>
              <div class="blank-row">
                <span class="tag-mini slp-tag">右侧（状态家族）</span>
                be 动词主要表达：
                <button type="button" class="crayon b-orange sum-r-a ${state.summaryRightOk ? "choice-wrong" : ""} ${!state.summaryRightOk && state.sumShakeRight === "A" ? "shake choice-wrong" : ""}" data-sum-right="A" ${state.summaryRightOk ? "disabled" : ""}>A. 具体的动作</button>
                <button type="button" class="crayon b-purple sum-r-b ${state.summaryRightOk ? "choice-correct" : ""}" data-sum-right="B" ${state.summaryRightOk ? "disabled" : ""}>B. 状态 / 身份 / 特征</button>
              </div>
            </div>
            <p class="q-hint" style="display:${state.summaryHint ? "block" : "none"}">再读一遍左右两边的句子？仔细想想哦~</p>
          </div>
        </div>
        <div id="sumAnsBlock" class="${unlocked ? "" : "hidden"}">
          <div class="summary-grid" style="margin-top:0.75rem;">
            <div class="column">
              <h2>动作家族（实义动词句型）</h2>
              <p class="answer-box">表述人 / 事物的<strong>动作</strong>。</p>
            </div>
            <div class="column slp">
              <h2>状态家族（Be 动词句型）</h2>
              <p class="answer-box">表述人 / 事物的<strong>状态、身份、地位、性质、特征</strong>等。</p>
            </div>
          </div>
          <div class="exit-task">
            <h2>离开本页前，请完成一个超短输出</h2>
            <p>请任选下面两种框架各说一句，把“分类”真正转成“表达”。</p>
            <ol class="micro-list">
              <li><code>I / We usually ...</code> 或 <code>My father / mother ... every day.</code></li>
              <li><code>I am ... / My school is ... / The library is ...</code></li>
            </ol>
          </div>
        </div>
        <div class="btn-row" id="backFirstRow" style="${unlocked ? "" : "display:none"}">
          <button type="button" class="crayon b-orange" id="backFirst"${state.ttsLoading ? " disabled" : ""}>回到封面</button>
          <button type="button" class="crayon b-green" id="btnNextLesson"${state.ttsLoading ? " disabled" : ""}>进入 Page 2：一般现在时概念图</button>
        </div>`;

      document.getElementById("btnRecall").onclick = () => {
        state.summaryRecall = true;
        render();
      };

      app.querySelectorAll("[data-tts-sent]").forEach((btn) => {
        btn.onclick = () => {
          if (state.ttsLoading) return;
          const sid = parseInt(btn.getAttribute("data-tts-sent"), 10);
          const sent = SENTENCES.find((x) => x.id === sid);
          if (!sent) return;
          state.ttsLoading = true;
          render();
          speak(sent.text)
            .then(() => {
              state.ttsLoading = false;
              render();
            })
            .catch(() => {
              state.ttsLoading = false;
              render();
            });
        };
      });

      app.querySelectorAll("[data-sum-left]").forEach((btn) => {
        btn.onclick = () => {
          if (state.summaryLeftOk) return;
          const v = btn.getAttribute("data-sum-left");
          if (v === "A") {
            state.summaryLeftOk = true;
            state.sumShakeLeft = null;
          } else {
            state.summaryHint = true;
            state.sumShakeLeft = "B";
            setTimeout(() => {
              state.sumShakeLeft = null;
              render();
            }, 480);
          }
          render();
        };
      });

      app.querySelectorAll("[data-sum-right]").forEach((btn) => {
        btn.onclick = () => {
          if (state.summaryRightOk) return;
          const v = btn.getAttribute("data-sum-right");
          if (v === "B") {
            state.summaryRightOk = true;
            state.sumShakeRight = null;
          } else {
            state.summaryHint = true;
            state.sumShakeRight = "A";
            setTimeout(() => {
              state.sumShakeRight = null;
              render();
            }, 480);
          }
          render();
        };
      });

      const bf = document.getElementById("backFirst");
      if (bf) {
        bf.onclick = () => {
          if (state.ttsLoading) return;
          state.slide = "intro";
          state.index = 0;
          resetSentenceState();
          state.summaryRecall = false;
          state.summaryLeftOk = false;
          state.summaryRightOk = false;
          state.sumShakeLeft = null;
          state.sumShakeRight = null;
          state.summaryHint = false;
          state.ttsLoading = false;
          render();
        };
      }
      const nx = document.getElementById("btnNextLesson");
      if (nx) {
        nx.onclick = () => {
          if (state.ttsLoading) return;
          window.location.href = "lesson01-page02-concept-map.html";
        };
      }
      return;
    }

    const s = SENTENCES[state.index];
    const isLast = state.index === SENTENCES.length - 1;

    function canGoNext() {
      if (!state.showText || !state.showQ1 || !state.q1Solved) return false;
      if (s.type === "svo") {
        return state.showQ2 && state.q2Solved;
      }
      return true;
    }

    const showQ2Block = s.type === "svo" && state.showQ2;
    const lockUi = state.ttsLoading;

    function q1BtnClass(side) {
      const isA = side === "a";
      const pick = isA ? "action" : "state";
      let c = "crayon pick-q1 " + (isA ? "b-orange" : "b-purple");
      if (state.q1Solved) {
        if (s.q1 === pick) c += " choice-correct";
        else c += " choice-wrong";
      } else if (state.q1WrongBtn === side) {
        c += " choice-wrong";
      }
      if (state.q1Shake === side) c += " shake";
      return c;
    }
    function q2BtnClass(side) {
      const isA = side === "a";
      const pick = isA ? "habit" : "schedule";
      let c = "crayon pick-q2 " + (isA ? "b-orange" : "b-purple");
      if (state.q2Solved) {
        if (s.q2 === pick) c += " choice-correct";
        else c += " choice-wrong";
      } else if (state.q2WrongBtn === side) {
        c += " choice-wrong";
      }
      if (state.q2Shake === side) c += " shake";
      return c;
    }
    const q1aClass = q1BtnClass("a");
    const q1bClass = q1BtnClass("b");
    const q2aClass = q2BtnClass("a");
    const q2bClass = q2BtnClass("b");

    app.innerHTML = `
      ${lockUi ? '<div class="tts-lock-overlay" aria-hidden="true"></div>' : ""}
      <p class="progress">句子 ${state.index + 1} / ${SENTENCES.length} · ${s.type === "svo" ? "动作家族" : "状态家族"}</p>
      <div class="btn-row sentence-jump-nav" role="group" aria-label="在 12 句间跳转">
        <button type="button" class="crayon b-orange" id="btnJumpPrev" ${state.index === 0 || lockUi ? "disabled" : ""} title="跳转到上一句（该句闯关进度重置）">上一个</button>
        <button type="button" class="crayon b-orange" id="btnJumpNext" ${state.index >= SENTENCES.length - 1 || lockUi ? "disabled" : ""} title="跳转到下一句（该句闯关进度重置）">下一个</button>
      </div>
      <div class="btn-row">
        <button type="button" class="crayon b-red${state.ttsLoading ? " tts-playing" : ""}" id="btnTts" aria-label="朗读" title="朗读" ${lockUi ? "disabled" : ""}>🔊</button>
        <button type="button" class="crayon b-blue" id="btnShow" ${state.showText || lockUi ? "disabled" : ""}>显示句子</button>
      </div>
      <div class="sentence-en ${state.showText ? "" : "placeholder"}" id="lineBox">${state.showText ? escapeHtml(s.text) : "（先点击朗读，再点击「显示句子」）"}</div>
      <div class="btn-row">
        <button type="button" class="crayon b-green" id="btnQ1" ${state.showText && !lockUi ? "" : "disabled"}>显示问题 1</button>
      </div>
      <div id="q1wrap" class="${state.showQ1 ? "" : "hidden"}">
        <div class="q-block">
          <h3>问题 1</h3>
          <p>这句话描述的是：某个人或事物<strong>发出的动作</strong>，还是描述人或事物的<strong>状态、身份、地位、性质、特征</strong>？点选你认为正确的一项。</p>
          <div class="choice-row">
            <button type="button" class="${q1aClass}" id="pickQ1a" data-q1="action" ${state.q1Solved || lockUi ? "disabled" : ""}>A. 更侧重「动作」</button>
            <button type="button" class="${q1bClass}" id="pickQ1b" data-q1="state" ${state.q1Solved || lockUi ? "disabled" : ""}>B. 更侧重「状态 / 身份 / 特征等」</button>
          </div>
          <p class="q-hint" style="display:${state.q1Hint ? "block" : "none"}">再读一遍句子？仔细想想哦~</p>
          <div class="answer-box ${state.q1Solved ? "" : "hidden"}" id="q1ans">${state.q1Solved ? escapeHtml(Q1_LABELS[s.q1]) : ""}</div>
        </div>
      </div>
      <div id="q2wrap" class="${showQ2Block ? "" : "hidden"}">
        <div class="q-block">
          <h3>问题 2（实义动词句型句）</h3>
          <p>这句话表述的是：人的<strong>习惯、爱好、长期以来的能力</strong>、<strong>自然真理</strong>、<strong>客观事实</strong>，还是<strong>已经规划好的时间 / 日程安排</strong>？</p>
          <div class="choice-row">
            <button type="button" class="${q2aClass}" id="pickQ2a" data-q2="habit" ${!showQ2Block || state.q2Solved || lockUi ? "disabled" : ""}>A. 习惯 / 事实 / 常见情况</button>
            <button type="button" class="${q2bClass}" id="pickQ2b" data-q2="schedule" ${!showQ2Block || state.q2Solved || lockUi ? "disabled" : ""}>B. 时刻表 / 固定安排的时间</button>
          </div>
          <p class="q-hint" style="display:${state.q2Hint ? "block" : "none"}">再读一遍句子？仔细想想哦~</p>
          <div class="answer-box ${state.q2Solved ? "" : "hidden"}" id="q2ans">${state.q2Solved ? escapeHtml(Q2_LABELS[s.q2]) : ""}</div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="crayon b-purple" id="btnNext" ${canGoNext() && !lockUi ? "" : "disabled"}>${isLast ? "进入总结" : "下一句"}</button>
      </div>`;

    document.getElementById("btnTts").onclick = () => {
      if (state.ttsLoading) return;
      state.ttsLoading = true;
      render();
      speak(s.text)
        .catch(function (e) {
          alert("朗读失败：" + (e && e.message ? e.message : String(e)));
        })
        .finally(function () {
          state.ttsLoading = false;
          render();
        });
    };
    const jumpPrev = document.getElementById("btnJumpPrev");
    if (jumpPrev) {
      jumpPrev.onclick = () => {
        if (state.ttsLoading || state.index <= 0) return;
        state.index--;
        resetSentenceState();
        render();
      };
    }
    const jumpNext = document.getElementById("btnJumpNext");
    if (jumpNext) {
      jumpNext.onclick = () => {
        if (state.ttsLoading || state.index >= SENTENCES.length - 1) return;
        state.index++;
        resetSentenceState();
        render();
      };
    }

    document.getElementById("btnShow").onclick = () => {
      if (state.ttsLoading) return;
      state.showText = true;
      render();
    };
    document.getElementById("btnQ1").onclick = () => {
      if (state.ttsLoading) return;
      state.showQ1 = true;
      render();
    };

    function handleQ1(choice) {
      if (state.ttsLoading) return;
      const val = choice === "a" ? "action" : "state";
      if (state.q1Solved) return;
      if (val === s.q1) {
        state.q1Solved = true;
        state.q1Hint = false;
        state.q1Shake = null;
        state.q1WrongBtn = null;
        if (s.type === "svo") state.showQ2 = true;
      } else {
        state.q1WrongBtn = choice;
        state.q1Hint = true;
        state.q1Shake = choice;
        setTimeout(() => {
          state.q1Shake = null;
          render();
        }, 480);
      }
      render();
    }

    function handleQ2(choice) {
      if (state.ttsLoading) return;
      const val = choice === "a" ? "habit" : "schedule";
      if (state.q2Solved || !showQ2Block) return;
      if (val === s.q2) {
        state.q2Solved = true;
        state.q2Hint = false;
        state.q2Shake = null;
        state.q2WrongBtn = null;
      } else {
        state.q2WrongBtn = choice;
        state.q2Hint = true;
        state.q2Shake = choice;
        setTimeout(() => {
          state.q2Shake = null;
          render();
        }, 480);
      }
      render();
    }

    const p1a = document.getElementById("pickQ1a");
    const p1b = document.getElementById("pickQ1b");
    if (p1a) p1a.onclick = () => handleQ1("a");
    if (p1b) p1b.onclick = () => handleQ1("b");

    const p2a = document.getElementById("pickQ2a");
    const p2b = document.getElementById("pickQ2b");
    if (p2a) p2a.onclick = () => handleQ2("a");
    if (p2b) p2b.onclick = () => handleQ2("b");

    document.getElementById("btnNext").onclick = () => {
      if (state.ttsLoading) return;
      if (isLast) {
        state.slide = "summary";
        state.summaryRecall = false;
        state.summaryLeftOk = false;
        state.summaryRightOk = false;
        state.sumShakeLeft = null;
        state.sumShakeRight = null;
        state.summaryHint = false;
        render();
        return;
      }
      state.index++;
      resetSentenceState();
      render();
    };
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  render();
})();
  </script>
  <link rel="stylesheet" href="assets/lesson-image-lightbox.css" />
  <script src="assets/lesson-image-lightbox.js" defer></script>
</body>
</html>
