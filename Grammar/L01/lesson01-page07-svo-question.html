/* inlined from assets/lesson-screen-16x9.css */
/**
 * Lesson 01 / 02 / 03 / 05 统一大屏布局 + 统一字体/字号
 * 桌面端（约平板横屏以上）：主舞台为视口内最大内接 16:9 矩形，四边留白最小；背景仅露窄边。
 * 字体：系统无衬线 + 雅黑/苹方/思源黑体，保证课堂可读；英文例句与中文同一栈，仅字号放大。
 * 各课 HTML 于 head 末引入外部样式表 lesson-screen-16x9.css（勿在本注释中写尖括号 link 标签，以免内联进 HTML 后被误匹配）
 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);
  --lesson-fs-btn: clamp(0.9rem, 0.36vw + 0.8rem, 1.02rem);
  /* 英文例句 / 展示行：明显大于正文 */
  --lesson-fs-example: clamp(1.05rem, 0.58vw + 0.9rem, 1.32rem);
  --lesson-fs-en-line: var(--lesson-fs-example);
}

/* 主舞台内子元素默认继承字体，压过各页内联里的 Patrick / ZCOOL（后文对 .en / [lang=en] / 例句容器再单独放大） */
html body .book *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .shell *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .app *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .page-wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .desk *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body main.sheet *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en) {
  font-family: inherit;
}

html {
  height: 100%;
  font-size: var(--lesson-fs-html);
}

body {
  --lesson-s-t: env(safe-area-inset-top, 0px);
  --lesson-s-b: env(safe-area-inset-bottom, 0px);
  --lesson-s-l: env(safe-area-inset-left, 0px);
  --lesson-s-r: env(safe-area-inset-right, 0px);
  /* 底部流式页脚（L01/L02 等）预留高度，避免主舞台 + 页脚超出视口 */
  --lesson-foot-h: 0px;
  /* 固定底栏占位（L01/L02/L03/L05 统一） */
  --lesson-pager-gap: 2.35rem;
  --lesson-l03-pager-gap: var(--lesson-pager-gap);
  /* 讲义页顶栏工具条粗略高度（打印条 + 可选姓名栏等） */
  --lesson-handout-chrome: 0px;

  margin: 0 !important;
  min-height: 100dvh !important;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--lesson-font-zh);
  line-height: 1.55;
}

body:has(> .handout-pdf-bar):has(> main.sheet) {
  --lesson-handout-chrome: 3.75rem;

}

}

  function stopAllSpeechMedia() {
    if (!window.__L01_MEDIA) {

    window.__L01_MEDIA.audios.forEach(function (a) {
      try {

      } catch (e) {}
    });
    window.__L01_MEDIA.audios = [];
    window.__L01_MEDIA.urls.forEach(function (u) {
      try {
        URL.revokeObjectURL(u);
      } catch (e) {}
    });
    window.__L01_MEDIA.urls = [];
    try {
      if (window.__l01AudioCtx && window.__l01AudioCtx.state === "running") {
        window.__l01AudioCtx.suspend();
      }
    } catch (e) {}
  }

  function playBlob(blob, resolve, reject) {
    if (!window.__L01_MEDIA) {
      window.__L01_MEDIA = { audios: [], urls: [] };
    }
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && !window.__l01AudioCtx) {
        window.__l01AudioCtx = new Ctx();
      }
      if (window.__l01AudioCtx && window.__l01AudioCtx.state === "suspended") {
        window.__l01AudioCtx.resume();
      }
    } catch (e) {}
    const url = URL.createObjectURL(blob);
    window.__L01_MEDIA.urls.push(url);
    const audio = new Audio(url);
    window.__L01_MEDIA.audios.push(audio);
    audio.onended = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      const ix = window.__L01_MEDIA.urls.indexOf(url);
      if (ix >= 0) {
        window.__L01_MEDIA.urls.splice(ix, 1);
      }
      const ai = window.__L01_MEDIA.audios.indexOf(audio);
      if (ai >= 0) {
        window.__L01_MEDIA.audios.splice(ai, 1);
      }
      resolve();
    };
    audio.onerror = function () {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
      reject(new Error("音频播放失败"));
    };
    audio.play().catch(function (e) {
      try {
        URL.revokeObjectURL(url);
      } catch (e2) {}
      reject(e);
    });
  }

  function runConfetti() {
    confettiCanvas.classList.remove("hidden");
    const ctx = confettiCanvas.getContext("2d");
    const w = (confettiCanvas.width = window.innerWidth);
    const h = (confettiCanvas.height = window.innerHeight);
    const pieces = [];
    const colors = ["#e85d4c", "#4a90d9", "#5cb85c", "#f0ad4e", "#9b59b6", "#ffeaa7", "#ffeb3b"];
    for (let i = 0; i < 160; i++) {
      pieces.push({
        x: Math.random() * w,
        y: Math.random() * -h * 0.4,
        r: 4 + Math.random() * 9,
        vy: 2 + Math.random() * 5,
        vx: (Math.random() - 0.5) * 3.5,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.22,
        c: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    let frames = 0;
    function tick() {
      frames++;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(function (p) {
        p.y += p.vy;
        p.x += p.vx;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 1.12);
        ctx.restore();
      });
      if (frames < 200) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, w, h);
        confettiCanvas.classList.add("hidden");
      }
    }
    tick();
  }

            }
            html += "</div>";
            html += '<div class="reveal-btn-wrap">';
            html +=
              '<button type="button" class="crayon b-orange" id="btnDrillSkip"' +
              (!showChoices ? " disabled" : "") +
              ">换一题（保留连击）</button>";
            html += "</div>";
          }

          if (state.ttsGlobalLock && state.filledAux && state.filledVerb) {
            html += '<p class="hint" style="margin-top:0.75rem;text-align:center">⏳ 正在朗读完整疑问句…</p>';
          }
        }
      }
      html += "</div>";
    }

    if (state.ttsLoading && state.stage === 2) {
      html += '<div class="tts-lock-overlay" aria-hidden="true"></div>';
    }

    app.innerHTML = html;

    if (state.stage === 1 && state.demoBStep === 2) {
      wireDemoBPlayDrop();
    }
  }

  function runDemoATransform() {
    const d = DEMO_A[state.demoAIndex];
    const train = document.getElementById("demoATrain");
    const subj = document.getElementById("demoASubj");
    const punct = document.getElementById("demoAPunct");
    if (!train || !subj || !punct) {
      return;
    }
    train.innerHTML = '<span class="engine-text">Do </span>';
    train.classList.add("in");
    subj.textContent = d.subjLow;
    subj.classList.add("lowered");
    punct.textContent = "?";
    punct.classList.add("q");
    setTimeout(function () {
      state.demoAStep = 1;
      render();
    }, 650);
  }

  function runDemoBTransform() {
    const d = DEMO_B[state.demoBIndex];
    const train = document.getElementById("demoBTrain");
    const subj = document.getElementById("demoBSubj");
    const punct = document.getElementById("demoBPunct");
    if (!train || !subj || !punct) {
      return;
    }
    train.innerHTML = '<span class="engine-text">Does </span>';
    train.classList.add("in");
    subj.textContent = d.subjQuestion;
    subj.classList.add("lowered");
    punct.textContent = "?";
    punct.classList.add("q");
    setTimeout(function () {
      state.demoBStep = 2;
      render();
    }, 620);
  }

  function resetForceStudentRound() {
    state.forceComplete = false;
    state.forceStreak = 0;
    state.currentItem = null;
    state.optionRows = [];
    state.betweenRounds = false;
    state.filledAux = "";
    state.filledVerb = "";
    state.wrongTip = "";
    state.wrongMirrorHtml = "";
    state.ttsLoading = false;
    state.ttsGlobalLock = false;
    document.body.classList.remove("tts-locked");
    clearNextTimer();
  }

  function bindEvents() {
    app.addEventListener("click", function (e) {
      const t = e.target;

      if (t.closest("#btnDrillSkip") && state.stage === 2 && !state.forceComplete) {
        if (state.ttsGlobalLock || state.ttsLoading || state.betweenRounds) return;
        if (state.filledAux && state.filledVerb) return;
        clearNextTimer();
        state.currentItem = pickRandomItem();
        state.optionRows = generateDynamicOptions(state.currentItem);
        state.wrongTip = "";
        state.wrongMirrorHtml = "";
        render();
        return;
      }

      if (t.closest("#btnForceNextStudent") && state.stage === 2) {
        resetForceStudentRound();
        render();
        return;
      }

      if (t.closest("#btnDemoATts") && state.stage === 1) {
        if (state.ttsGlobalLock) return;
        speakWithGlobalLock(getDemoAPlainTts()).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnDemoBTts") && state.stage === 1) {
        if (state.ttsGlobalLock) return;
        speakWithGlobalLock(getDemoBPlainTts()).catch(function (err) {
          alert("朗读失败：" + (err && err.message ? err.message : String(err)));
        });
        return;
      }

      if (t.closest("#btnEnterForce") && state.stage === 1) {
        stopAllSpeechMedia();
        state.ttsSessionId++;
        state.stage = 2;
        state.currentItem = null;
        state.optionRows = [];
        state.forceStreak = 0;
        state.forceComplete = false;
        state.betweenRounds = false;
        state.filledAux = "";
        state.filledVerb = "";
        state.wrongTip = "";
        state.wrongMirrorHtml = "";
        state.ttsLoading = false;
        state.ttsGlobalLock = false;
        document.body.classList.remove("tts-locked");
        clearNextTimer();
        render();
        return;
      }

      if (state.ttsGlobalLock && state.stage === 1) {
        return;
      }

      if (state.ttsGlobalLock && state.stage === 2) {
        return;
      }

      if (t.closest("#btnTrainRule") && state.stage === 1) {
        state.trainRuleExpanded = !state.trainRuleExpanded;
        render();
        return;
      }

      if (t.closest("#btnDemoANext") && state.stage === 1) {
        if (state.demoAStep === 1 && state.demoAIndex < DEMO_A.length - 1) {
          state.demoAIndex++;
          state.demoAStep = 0;
          render();
        }
        return;
      }

      if (t.closest("#btnDemoBNext") && state.stage === 1) {
        if (state.demoBStep === 3 && state.demoBIndex < DEMO_B.length - 1) {
          state.demoBIndex++;
          state.demoBStep = 0;
          render();
        }
        return;
      }

      if (t.closest("#btnDemoA") && state.stage === 1 && state.demoAStep === 0) {
        runDemoATransform();
        return;
      }

      if (t.closest("#btnDemoB") && state.stage === 1 && state.demoBStep === 0) {
        runDemoBTransform();
        return;
      }

      if (t.closest(".choice-opt") && state.stage === 2 && !state.forceComplete) {
        if (state.ttsGlobalLock || state.ttsLoading) {
          return;
        }
        const btn = t.closest(".choice-opt");
        const oid = btn.getAttribute("data-oid");
        let opt = null;
        for (let i = 0; i < state.optionRows.length; i++) {
          if (state.optionRows[i].id === oid) {
            opt = state.optionRows[i];
            break;
          }
        }
        if (!opt || !state.currentItem) {
          return;
        }
        if (!opt.correct) {
          state.forceStreak = 0;
          state.wrongMirrorHtml = buildMirrorQuestionWrongHtml(state.currentItem, opt);
          if (state.wrongMirrorHtml) {
            state.wrongTip = "";
          } else {
            let msg = "星星清零！";
            if (state.currentItem.type === "non-3rd") {
              msg += "实义动词疑问句用 Do/Does，不用 Are + 原形（避免 Are you play）。";
            } else {
              msg += "照妖镜法则：Does 后必须用动词原形，不能写第三人称单数形式；也不用 Is + 原形。";
            }
            state.wrongTip = msg;
          }
          btn.classList.add("wrong-shake");
          setTimeout(function () {
            btn.classList.remove("wrong-shake");
          }, 500);
          render();
          return;
        }
        state.wrongTip = "";
        state.wrongMirrorHtml = "";
        state.filledAux = opt.aux;
        state.filledVerb = opt.verb;
        const it0 = state.currentItem;
        const full = buildQuestionSentence(opt.aux, it0.sub, opt.verb, it0.rest);
        speakWithGlobalLock(full)
          .then(function () {
            state.forceStreak++;
            if (state.forceStreak >= FORCE_WIN_STREAK) {
              state.forceComplete = true;
              state.filledAux = "";
              state.filledVerb = "";
              runConfetti();
              render();
              return;
            }
            state.betweenRounds = true;
            render();
            clearNextTimer();
            state.nextTimer = setTimeout(function () {
              state.betweenRounds = false;
              state.currentItem = pickRandomItem();
              state.optionRows = generateDynamicOptions(state.currentItem);
              state.filledAux = "";
              state.filledVerb = "";
              state.wrongTip = "";
              state.wrongMirrorHtml = "";
              state.nextTimer = null;
              render();
            }, 1000);
          })
          .catch(function (err) {
            alert("朗读失败：" + (err && err.message ? err.message : String(err)));
          });
        return;
      }

      if (t.closest("#btnFinishL1")) {
        window.location.href = "lesson01-page08-wrap.html";
        return;
      }
    });
  }

  bindEvents();
  render();
})();
  </script>
  <link rel="stylesheet" href="assets/lesson-image-lightbox.css" />
  <script src="assets/lesson-image-lightbox.js" defer></script></body>
