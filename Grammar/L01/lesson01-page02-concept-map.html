/* inlined from assets/lesson-screen-16x9.css */
/**
 * Lesson 01 / 02 / 03 / 05 统一大屏布局 + 统一字体/字号
 * 桌面端（约平板横屏以上）：主舞台为视口内最大内接 16:9 矩形，四边留白最小；背景仅露窄边。
 * 字体：系统无衬线 + 雅黑/苹方/思源黑体，保证课堂可读；英文例句与中文同一栈，仅字号放大。
 * 各课 HTML 于 head 末引入外部样式表 lesson-screen-16x9.css（勿在本注释中写尖括号 link 标签，以免内联进 HTML 后被误匹配）
 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);
  --lesson-fs-btn: clamp(0.9rem, 0.36vw + 0.8rem, 1.02rem);
  /* 英文例句 / 展示行：明显大于正文 */
  --lesson-fs-example: clamp(1.05rem, 0.58vw + 0.9rem, 1.32rem);
  --lesson-fs-en-line: var(--lesson-fs-example);
}

/* 主舞台内子元素默认继承字体，压过各页内联里的 Patrick / ZCOOL（后文对 .en / [lang=en] / 例句容器再单独放大） */
html body .book *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .shell *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .app *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .page-wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .desk *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body main.sheet *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en) {
  font-family: inherit;
}

html {
  height: 100%;
  font-size: var(--lesson-fs-html);
}

body {
  --lesson-s-t: env(safe-area-inset-top, 0px);
  --lesson-s-b: env(safe-area-inset-bottom, 0px);
  --lesson-s-l: env(safe-area-inset-left, 0px);
  --lesson-s-r: env(safe-area-inset-right, 0px);
  /* 底部流式页脚（L01/L02 等）预留高度，避免主舞台 + 页脚超出视口 */
  --lesson-foot-h: 0px;
  /* 固定底栏占位（L01/L02/L03/L05 统一） */
  --lesson-pager-gap: 2.35rem;
  --lesson-l03-pager-gap: var(--lesson-pager-gap);
  /* 讲义页顶栏工具条粗略高度（打印条 + 可选姓名栏等） */
  --lesson-handout-chrome: 0px;

  margin: 0 !important;
  min-height: 100dvh !important;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--lesson-font-zh);
  line-height: 1.55;
}

body:has(> .handout-pdf-bar):has(> main.sheet) {
  --lesson-handout-chrome: 3.75rem;
  justify-content: flex-start;
}

body.has-lesson-pager:has(> main.sheet) {
  --lesson-handout-chrome: 8.5rem;
  justify-content: flex-start;
}

/* 去掉各页内联的 body 大留白；L03 单独处理底栏 */
body:not(.has-lesson-pager) {
  padding: var(--lesson-s-t) var(--lesson-s-r) var(--lesson-s-b) var(--lesson-s-l) !important;
}

body.has-lesson-pager {
  padding-top: max(4px, var(--lesson-s-t)) !important;
  padding-left: max(4px, var(--lesson-s-l)) !important;
  padding-right: max(4px, var(--lesson-s-r)) !important;
  padding-bottom: max(var(--lesson-pager-gap, 2.35rem), var(--lesson-s-b)) !important;
}

/* —— 全讲统一「页间导航」：固定底栏（与 L03 lesson-pager 视觉一致，兼容旧 class 名） —— */
body.has-lesson-pager nav.lesson-pager,

    if (wrongFlash) cls += " wrong-flash";
    let style = "";
    if (inPool && scatter[c.id]) {
      const sc = scatter[c.id];
      style =
        "left:" +
        sc.leftPct +
        "%;top:" +
        sc.topPx +
        "px;transform:rotate(" +
        sc.rot +
        "deg)" +
        (selected ? " scale(1.05)" : "") +
        ";z-index:" +
        (selected ? "5" : "1") +
        ";";
    }
    const ttsCls = "crayon b-red tts-mini" + (ttsBusy ? " tts-playing" : "");
    const ttsDisabled = ttsBusy ? " disabled" : "";
    return (
      '<div class="' +
      cls +
      '" data-card-id="' +
      c.id +
      '" style="' +
      style +
      '" role="group">' +
      '<div class="en">' +
      escapeHtml(c.text) +
      "</div>" +
      '<div class="tagline">' +
      escapeHtml(c.tag) +
      "</div>" +
      '<div class="card-actions">' +
      '<button type="button" class="' +
      ttsCls +
      '" data-tts-id="' +
      c.id +
      '" aria-label="朗读" title="朗读"' +
      ttsDisabled +
      ">🔊</button>" +
      "</div></div>"
    );
  }

  function render() {
    let html = "";
    const lockUi = state.ttsLoading;

    if (lockUi) {
      html += '<div class="tts-lock-overlay" aria-hidden="true"></div>';
    }

    html += '<h1 class="page-title">一般现在时 · 概念地图</h1>';

    html += '<div id="phase1"' + (state.phase === 2 ? ' class="phase1-hidden"' : "") + ">";

    html += '<div class="zones-row">';
    html += '<div class="drop-zone svo-zone" data-zone="svo" tabindex="0" role="button" aria-label="动作家族 · 实义动词句型">';
    html += "<h2>动作家族 · 5 句</h2>";
    html += '<div class="inner-cards" id="zone-svo">';
    CARDS.forEach(function (c) {
      if (state.placements[c.id] === "svo") {
        html += renderCardHtml(c, { locked: true, inPool: false });
      }
    });
    html += "</div></div>";

    html += '<div class="drop-zone slp-zone" data-zone="slp" tabindex="0" role="button" aria-label="状态家族 · Be 动词句型">';
    html += "<h2>状态家族 · 5 句</h2>";
    html += '<div class="inner-cards" id="zone-slp">';
    CARDS.forEach(function (c) {
      if (state.placements[c.id] === "slp") {
        html += renderCardHtml(c, { locked: true, inPool: false });
      }
    });
    html += "</div></div>";
    html += "</div>";

    html += '<div class="pool-area">';
    html += "<h3>卡片区（点击选中 → 再点上方家族框）</h3>";
    html += '<div class="pool-scatter" id="pool-scatter">';
    CARDS.forEach(function (c) {
      if (state.placements[c.id] === "pool") {
        html += renderCardHtml(c, { inPool: true, wrongFlash: state.shakingId === c.id });
      }
    });
    html += "</div></div>";

    if (state.phase === 1 && allCorrect()) {
      html += '<div class="phase1-footer">';
      html += '<p class="phase1-done-msg">全部归类正确！</p>';
      html +=
        '<button type="button" class="crayon btn-phase2" id="btnToPhase2"' +
        (lockUi ? " disabled" : "") +
        ">进入下一环节：时间轴与总结</button>";
      html += "</div>";
    }

    html += "</div>";

    if (state.phase === 2) {
      html += '<div class="blackboard-wrap" id="phase2">';
      html += '<div class="blackboard">';
      html += '<div class="umbrella-title">「一般现在时 (Present Simple)」</div>';

      html += '<div class="timeline-block">';
      html += '<div class="timeline-arrows" title="过去 → 现在 → 未来：一贯如此" aria-hidden="true">';
      for (var ai = 0; ai < 11; ai++) {
        html += '<span class="timeline-arrow">\u2193</span>';
      }
      html += "</div>";
      html += '<div class="timeline-labels"><span>Past (过去)</span><span>Now (现在)</span><span>Future (未来)</span></div>';
      html += '<div class="timeline-axis"></div>';
      html += '<div class="timeline-below">━━━━━━ 持续的状态 / 事实 ━━━━━━</div>';
      html += "</div>";

      html +=
        '<p class="note-text">为什么它们是一家人？因为它们都不局限于『此时此刻』。过去如此，现在如此，未来大概率也如此！</p>';

      html += '<div class="final-tts-row">';
      html +=
        '<button type="button" class="crayon tts-huge' +
        (lockUi ? " tts-playing" : "") +
        '" id="btnFinalTts"' +
        (lockUi ? " disabled" : "") +
        ' title="听听最终规律" aria-label="听听最终规律">🔊</button>';
      if (state.finalScriptShown) {
        html += '<div class="final-script-box">';
        html += '<p class="final-en">' + escapeHtml(FINAL_LINE) + "</p>";
        html += '<p class="final-cn">' + escapeHtml(FINAL_LINE_CN) + "</p>";
        html += "</div>";
      }
      html += "</div>";

      html += '<div class="next-row">';
      html +=
        '<button type="button" class="crayon next-btn" id="btnNext"' +
        (state.finalAudioCompleted && !lockUi ? "" : " disabled") +
        ">进入 Be 动词句型专项特训</button>";
      html += "</div>";

      html += "</div></div>";
    }

    app.innerHTML = html;

    bindEvents();
  }

  function bindEvents() {
    app.querySelectorAll("#pool-scatter [data-card-id]").forEach(function (el) {
      const id = parseInt(el.getAttribute("data-card-id"), 10);
      const c = getCard(id);
      if (!c) return;
      if (state.placements[id] !== "pool") return;

      el.addEventListener("click", function (e) {
        if (state.ttsLoading) return;
        if (e.target.closest("[data-tts-id]")) return;
        state.selectedId = state.selectedId === id ? null : id;
        render();
      });
    });

    app.querySelectorAll("[data-tts-id]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (state.ttsLoading) return;
        const id = parseInt(btn.getAttribute("data-tts-id"), 10);
        const c = getCard(id);
        if (!c) return;
        state.ttsLoading = true;
        render();
        speak(c.text)
          .catch(function (err) {
            alert("朗读失败：" + (err && err.message ? err.message : String(err)));
          })
          .finally(function () {
            state.ttsLoading = false;
            render();
          });
      });
    });

    const zSvo = app.querySelector(".svo-zone");
    const zSlp = app.querySelector(".slp-zone");
    if (zSvo) {
      zSvo.addEventListener("click", function () {
        if (state.ttsLoading) return;
        tryPlace("svo");
      });
      zSvo.addEventListener("mouseenter", function () {
        if (state.selectedId && !state.ttsLoading) zSvo.classList.add("highlight-target");
      });
      zSvo.addEventListener("mouseleave", function () {
        zSvo.classList.remove("highlight-target");
      });
    }
    if (zSlp) {
      zSlp.addEventListener("click", function () {
        if (state.ttsLoading) return;
        tryPlace("slp");
      });
      zSlp.addEventListener("mouseenter", function () {
        if (state.selectedId && !state.ttsLoading) zSlp.classList.add("highlight-target");
      });
      zSlp.addEventListener("mouseleave", function () {
        zSlp.classList.remove("highlight-target");
      });
    }

    const btnToPhase2 = document.getElementById("btnToPhase2");
    if (btnToPhase2) {
      btnToPhase2.addEventListener("click", function () {
        if (state.ttsLoading) return;
        if (!allCorrect()) return;
        state.phase = 2;
        render();
      });
    }

    const btnFinal = document.getElementById("btnFinalTts");
    if (btnFinal) {
      btnFinal.addEventListener("click", function () {
        if (state.ttsLoading) return;
        state.finalScriptShown = true;
        state.ttsLoading = true;
        render();
        speak(FINAL_LINE)
          .then(function () {
            state.finalAudioCompleted = true;
          })
          .catch(function (err) {
            alert("朗读失败：" + (err && err.message ? err.message : String(err)));
          })
          .finally(function () {
            state.ttsLoading = false;
            render();
          });
      });
    }

    const btnNext = document.getElementById("btnNext");
    if (btnNext) {
      btnNext.addEventListener("click", function () {
        if (state.ttsLoading) return;
        if (!state.finalAudioCompleted) return;
        window.location.href = "lesson01-page03-be-magic.html";
      });
    }
  }

  function tryPlace(zone) {
    if (state.phase !== 1) return;
    if (state.ttsLoading) return;
    const sid = state.selectedId;
    if (!sid) {
      return;
    }
    const c = getCard(sid);
    if (!c || state.placements[sid] !== "pool") return;

    const ok = c.target === (zone === "svo" ? "SVO" : "SLP");
    if (ok) {
      state.placements[sid] = zone === "svo" ? "svo" : "slp";
      state.selectedId = null;
      state.shakingId = null;
      render();
    } else {
      state.shakingId = sid;
      render();
      setTimeout(function () {
        state.shakingId = null;
        state.selectedId = null;
        render();
      }, 480);
    }
  }

  render();
})();
  </script>

  <script src="assets/lesson-image-lightbox.js" defer></script>
  <script src="../shared/course-guard.js" defer></script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
