<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>一般过去时 · 小学版（5–6年级）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
  <link rel="stylesheet" href="assets/l03p-shell.css" />
  <link rel="stylesheet" href="assets/l03p-pager.css" />
  <style>
    body.l03p-index-body{margin:0;min-height:100dvh;padding:1rem 1rem 2rem;background:linear-gradient(168deg,#ffeaa7 0%,#fab1a0 38%,#dfe6e9 100%);color:#2c2c2c;font-family:Nunito,system-ui,sans-serif}
    .l03p-index{max-width:760px;margin:0 auto}
    .l03p-index h1{font-size:clamp(1.4rem,4vw,1.8rem);font-weight:900;margin:.5rem 0;color:#e85d4c}
    .l03p-index .badge{display:inline-block;font-size:.72rem;font-weight:900;padding:.15rem .55rem;border-radius:999px;background:#f0ad4e;color:#422006;vertical-align:middle;margin-left:.35rem}
    .l03p-index .intro{color:#5a5a5a;font-size:.9rem;line-height:1.65;margin-bottom:1rem}
    .l03p-index-hero{border-radius:16px;overflow:hidden;margin-bottom:1rem;border:4px solid #f0ad4e;background:#fff9f0;display:flex;align-items:center;justify-content:center;min-height:160px}
    .l03p-index-hero img{width:100%;max-height:220px;object-fit:contain;display:block}
    .l03p-features{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
    .l03p-features span{font-size:.7rem;font-weight:800;padding:.2rem .5rem;border-radius:999px;background:rgba(255,255,255,.65);color:#444;border:2px solid rgba(0,0,0,.08)}
    .l03p-index-section{margin-bottom:1rem}
    .l03p-index-section h2{font-size:.76rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#e85d4c;margin:0 0 .4rem}
    .l03p-index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
    .l03p-index li a{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-radius:12px;background:#fff9f0;border:3px solid #f0ad4e;color:#2c2c2c;text-decoration:none;font-weight:700;font-size:.88rem;box-shadow:3px 4px 0 #e85d4c}
    .l03p-index li a:hover{background:#fff3e0}
    .l03p-index .num{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4a90d9,#9b59b6);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
    .l03p-index .back{margin-top:1.2rem;text-align:center}
    .l03p-index .back a{color:#5a5a5a;font-weight:700;text-decoration:none;font-size:.88rem}
  </style>
  <script src="assets/l03p-data.js"></script>
</head>
<body class="l03p-index-body">
  <main class="l03p-index">
    <p style="text-align:center;margin:0 0 .65rem"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/logo2.jpg" alt="Steven's Class" width="160" height="48" decoding="async" style="opacity:.95"/></p>
    <div class="l03p-index-hero"><img src="assets/img/l03p-past-vs-present.jpg" alt="" onerror="this.style.display='none'"/></div>
    <h1>一般过去时 <span class="badge">小学 5–6 年级 · 小升初</span></h1>
    <p class="intro">61 页专业 ESL 互动课件：was/were · 规则/不规则过去式 · didn't / Did · DeepSeek 语料对齐 5GA/6GA + 小升初 · 每句配图 · 课堂练习齐全</p>
    <div class="l03p-features">
      <span>⏪ was/were</span><span>✏️ 规则 -ed</span><span>⚡ 不规则</span><span>🚫 didn't</span>
      <span>❓ Did</span><span>📖 DeepSeek 语料</span><span>⏱ 限时挑战</span><span>🔥 连对闯关</span>
      <span>📝 课堂套题</span><span>🔗 配对游戏</span><span>🎧 听音快选</span>
    </div>
    <div id="l03pIndexMount"></div>
    <p class="back"><a href="../index.html">← 课程总目录</a> · <a href="../L03/index.html">初中版 →</a> · <a href="../L01-小学一般现在时/index.html">小学现在时 →</a></p>
  </main>
  <script>
    (function(){
      var m=document.getElementById("l03pIndexMount");if(!m||!window.L03pData)return;
      var sec={};window.L03pData.pages.forEach(function(p,i){if(!sec[p.section])sec[p.section]=[];sec[p.section].push({p:p,n:i+1});});
      var h="";Object.keys(sec).forEach(function(s){h+='<div class="l03p-index-section"><h2>'+s+'</h2><ol>';sec[s].forEach(function(x){h+='<li><a href="'+x.p.id+'.html"><span class="num">'+String(x.n).padStart(2,"0")+'</span><span>'+x.p.title+'</span></a></li>';});h+='</ol></div>';});
      m.innerHTML=h;
    })();
  </script>
</body>
</html>
