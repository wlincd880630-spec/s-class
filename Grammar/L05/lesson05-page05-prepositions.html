 */

:root {
  --lesson-font-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --lesson-font-zh: var(--lesson-font-sans);
  --lesson-font-en: var(--lesson-font-sans);
  /* 根字号：随视口略放大，带动全站 rem */
  --lesson-fs-html: clamp(16px, 0.55vw + 14px, 20px);
  --lesson-fs-topbar: clamp(0.88rem, 0.38vw + 0.78rem, 1.02rem);
  --lesson-fs-body: clamp(0.92rem, 0.42vw + 0.82rem, 1.05rem);
  --lesson-fs-small: clamp(0.8rem, 0.28vw + 0.72rem, 0.92rem);
  --lesson-fs-h1: clamp(1.2rem, 0.85vw + 0.95rem, 1.48rem);
  --lesson-fs-h2: clamp(1.05rem, 0.62vw + 0.86rem, 1.22rem);
  --lesson-fs-h3: clamp(0.98rem, 0.48vw + 0.8rem, 1.1rem);
  --lesson-fs-h4: clamp(0.92rem, 0.36vw + 0.76rem, 1.02rem);
  --lesson-fs-btn: clamp(0.9rem, 0.36vw + 0.8rem, 1.02rem);
  /* 英文例句 / 展示行：明显大于正文 */
  --lesson-fs-example: clamp(1.05rem, 0.58vw + 0.9rem, 1.32rem);
  --lesson-fs-en-line: var(--lesson-fs-example);
}

/* 主舞台内子元素默认继承字体，压过各页内联里的 Patrick / ZCOOL（后文对 .en / [lang=en] / 例句容器再单独放大） */
html body .book *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .shell *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .app *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .page-wrap *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body .desk *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en),
html body main.sheet *:not(code):not(kbd):not(samp):not(pre):not([lang="en"]):not(.en) {
  font-family: inherit;
}

html {
  height: 100%;
  font-size: var(--lesson-fs-html);
}

body {
  --lesson-s-t: env(safe-area-inset-top, 0px);
  --lesson-s-b: env(safe-area-inset-bottom, 0px);
  --lesson-s-l: env(safe-area-inset-left, 0px);
  --lesson-s-r: env(safe-area-inset-right, 0px);
  /* 底部流式页脚（L01/L02 等）预留高度，避免主舞台 + 页脚超出视口 */
  --lesson-foot-h: 0px;
  /* 固定底栏占位（L01/L02/L03/L05 统一） */
  --lesson-pager-gap: 2.35rem;
  --lesson-l03-pager-gap: var(--lesson-pager-gap);
  /* 讲义页顶栏工具条粗略高度（打印条 + 可选姓名栏等） */
  --lesson-handout-chrome: 0px;

  margin: 0 !important;
  min-height: 100dvh !important;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--lesson-font-zh);
  line-height: 1.55;
}

body:has(> .handout-pdf-bar):has(> main.sheet) {
  --lesson-handout-chrome: 3.75rem;
  justify-content: flex-start;
}

body.has-lesson-pager:has(> main.sheet) {
  --lesson-handout-chrome: 8.5rem;
  justify-content: flex-start;
}

/* 去掉各页内联的 body 大留白；L03 单独处理底栏 */
body:not(.has-lesson-pager) {
  padding: var(--lesson-s-t) var(--lesson-s-r) var(--lesson-s-b) var(--lesson-s-l) !important;
}

body.has-lesson-pager {
  padding-top: max(4px, var(--lesson-s-t)) !important;
  padding-left: max(4px, var(--lesson-s-l)) !important;
  padding-right: max(4px, var(--lesson-s-r)) !important;
  padding-bottom: max(var(--lesson-pager-gap, 2.35rem), var(--lesson-s-b)) !important;
}

/* —— 全讲统一「页间导航」：固定底栏（与 L03 lesson-pager 视觉一致，兼容旧 class 名） —— */
body.has-lesson-pager nav.lesson-pager,
body.has-lesson-pager nav.lesson-footer-nav,
body.has-lesson-pager div.lesson-footer-nav,
body.has-lesson-pager nav.page-foot,
body.has-lesson-pager nav.footer-nav,
body.has-lesson-pager div.footer-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 200;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 0.45rem;
  padding: 0.42rem 0.55rem;
  padding-bottom: max(0.42rem, env(safe-area-inset-bottom, 0px));
  background: rgba(255, 249, 240, 0.98);
  border-top: 3px solid #5d4037;
  box-shadow: 0 -8px 22px rgba(0, 0, 0, 0.1);
  font-family: var(--lesson-font-zh);
}

body.has-lesson-pager nav.lesson-pager a,
body.has-lesson-pager nav.lesson-pager .pager-muted,
body.has-lesson-pager nav.lesson-footer-nav a,
body.has-lesson-pager div.lesson-footer-nav a,
body.has-lesson-pager nav.page-foot a,
body.has-lesson-pager nav.footer-nav a,
body.has-lesson-pager div.footer-nav a,
body.has-lesson-pager nav.lesson-footer-nav > span:not(.nav-sep),
body.has-lesson-pager div.lesson-footer-nav > span:not(.nav-sep),
body.has-lesson-pager nav.page-foot > span:not(.nav-sep),
body.has-lesson-pager nav.footer-nav > span:not(.nav-sep),
body.has-lesson-pager div.footer-nav > span:not(.nav-sep) {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.35;
  font-size: clamp(0.7rem, 2.6vw, 0.82rem);
  font-weight: 800;
  padding: 0.42rem 0.4rem;
  border-radius: 999px;
  border: 3px solid #5d4037;
  box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.1);
}

body.has-lesson-pager nav.lesson-pager a,
body.has-lesson-pager nav.lesson-footer-nav a,
body.has-lesson-pager div.lesson-footer-nav a,
body.has-lesson-pager nav.page-foot a,
body.has-lesson-pager nav.footer-nav a,
body.has-lesson-pager div.footer-nav a {

}

body.has-lesson-pager nav.lesson-pager a:hover,
body.has-lesson-pager nav.lesson-footer-nav a:hover,
body.has-lesson-pager div.lesson-footer-nav a:hover,

}

body.has-lesson-pager nav.lesson-pager .pager-prev,
body.has-lesson-pager nav.lesson-footer-nav a:first-of-type,
body.has-lesson-pager div.lesson-footer-nav a:first-of-type,
body.has-lesson-pager nav.page-foot a:first-of-type,
body.has-lesson-pager nav.footer-nav a:first-of-type,
body.has-lesson-pager div.footer-nav a:first-of-type {
  color: #1565c0;
  background: rgba(255, 249, 240, 0.98);
}

body.has-lesson-pager nav.lesson-pager .pager-next,
body.has-lesson-pager nav.lesson-footer-nav a:last-of-type,
body.has-lesson-pager div.lesson-footer-nav a:last-of-type,
body.has-lesson-pager nav.page-foot a:last-of-type,
body.has-lesson-pager nav.footer-nav a:last-of-type,

  background: linear-gradient(180deg, #ffe082, #ffca28);

}

/* 三链接旧版：中间 <a> 用中性色（非首非尾的链接） */
body.has-lesson-pager nav.lesson-footer-nav a:not(:first-of-type):not(:last-of-type),
body.has-lesson-pager div.lesson-footer-nav a:not(:first-of-type):not(:last-of-type),
body.has-lesson-pager nav.page-foot a:not(:first-of-type):not(:last-of-type),
body.has-lesson-pager nav.footer-nav a:not(:first-of-type):not(:last-of-type),
body.has-lesson-pager div.footer-nav a:not(:first-of-type):not(:last-of-type) {
  color: #37474f;
  background: rgba(236, 239, 241, 0.96);
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.08);
}

body.has-lesson-pager nav.lesson-pager .pager-mid {
  color: #37474f;
  background: rgba(236, 239, 241, 0.96);
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.08);
}

body.has-lesson-pager nav.lesson-pager .pager-muted,
body.has-lesson-pager nav.lesson-footer-nav > span:not(.nav-sep),
body.has-lesson-pager div.lesson-footer-nav > span:not(.nav-sep),
body.has-lesson-pager nav.page-foot > span:not(.nav-sep),
body.has-lesson-pager nav.footer-nav > span:not(.nav-sep),

  background: rgba(236, 239, 241, 0.95);
  cursor: default;
  box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.06);
}

body.has-lesson-pager nav.footer-nav .nav-sep,
body.has-lesson-pager div.footer-nav .nav-sep,
body.has-lesson-pager div.footer-nav .sep {
  display: none;
}

/* L05 Page04：屏内阶段分页条与固定页间底栏错开，避免被遮挡 */
body.has-lesson-pager .book .pager-foot {
  margin-bottom: max(0.75rem, var(--lesson-pager-gap, 2.35rem));
}

/* 英文例句 / 片段：与中文同栈，字号用 --lesson-fs-example（勿给整段中文误标 lang="en"） */
body .book [lang="en"],
body .shell [lang="en"],
body .app [lang="en"],
body .wrap [lang="en"],
body .page-wrap [lang="en"],
body .desk [lang="en"],

body .shell .en,
body .app .en,

  font-size: var(--lesson-fs-example);
}

/* 压过各页内联里对 .en 的 Patrick Hand（与上条同义，提高权重） */
html body .book .en,

html body .app .en,

}

/* 常见「整句英文」容器（部分页未加 .en） */
body :is(.book, .shell, .app, .wrap, .page-wrap, .desk, main.sheet) :is(
  .sentence-en,
  .gold-line,
  .trap-line,
  .mirror-word,
  .contrast-line,
  .sentence-line,

  .example-en,

) {

/* 标题层级（主舞台内） */
body :is(.book, .shell, .app, .wrap, .page-wrap, .desk, main.sheet) :is(h1) {
  font-family: var(--lesson-font-zh);

  font-size: var(--lesson-fs-h3);

/* 常见标题/条类名（与 h1 同级视觉的条目标题） */
body :is(.book, .shell, .app, .wrap, .page-wrap, .desk, main.sheet) :is(

/* —— 主舞台：默认流式（小屏）；桌面端见下方 media —— */

  body > .lesson-footer-nav,

  body > nav.lesson-pager,
  body > nav.footer-nav,
  body > div.footer-nav {
    width: min(
        calc(100vw - var(--lesson-s-l) - var(--lesson-s-r)),
        calc((100dvh - var(--lesson-foot-h) - var(--lesson-s-t) - var(--lesson-s-b)) * 16 / 9)
      )

    max-width: min(

  <script>
    "use strict";

    /* 与 Page 03 使用同一 Speech 资源；勿把密钥提交到公开仓库。 */
    var DEEPSEEK = {
      key: "",
      endpoint: "https://api.deepseek.com/v1/chat/completions",
      model: "deepseek-v4-flash"
    };

    /** Chrome：未与页面产生手势前禁止 Audio.play()；须先点/按键再播 */
    var audioUserReady = false;
    function markAudioUserReady() {
      if (audioUserReady) return;
      audioUserReady = true;
    }
    document.addEventListener(
      "pointerdown",
      function () {
        markAudioUserReady();
      },
      { once: true, capture: true }
    );
    document.addEventListener(
      "keydown",
      function () {
        markAudioUserReady();

      { once: true, capture: true }
    );

    /** Phase 2：Where 组句进度（everCorrect 等仍可统计，Tab 不再依赖其解锁） */
    var waxPhase2 = {

    var hotspots = [

    ];

    /**
     * 躲猫猫关卡：教材原句或课堂化改编；answerId 为正确热区。
     */
    var seekLevels = [
      { line: "It's behind the box.", answerId: "box", whisper: "1.15" },
      { line: "It's under the bed.", answerId: "bed", whisper: "1.2" },
      { line: "It's on the desk.", answerId: "desk", whisper: "1.15" },
      { line: "It's on the chair.", answerId: "chair", whisper: "1.15" },
      { line: "It's next to the bookcase.", answerId: "bookcase", whisper: "1.15" },
      { line: "It's behind the bookcase.", answerId: "bookcase", whisper: "1.15" }
    ];

    var seekIx = 0;
    var seekWins = 0;
    var seekBusy = false;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /** 兼容无 Promise.prototype.finally 的环境，避免躲猫猫流程卡在 seekBusy */
    function promiseFinally(p, fn) {
      p = Promise.resolve(p);
      if (typeof p.finally === "function") return p.finally(fn);
      return p.then(
        function (v) {
          return Promise.resolve()
            .then(fn)
            .then(function () {
              return v;
            });
        },
        function (err) {
          return Promise.resolve()
            .then(fn)
            .then(function () {
              throw err;
            });
        }
      );
    }

    /** 英文朗读仅本地 MP3；SSML 用于抽取与 manifest 一致的纯文本键（勿用 speechSynthesis）。 */
    function buildSsmlEn(text) {
      return (
        "<speak version=\"1.0\" xmlns=\"http://www.w3.org/2001/10/synthesis\" xml:lang=\"en-US\"><voice name=\"en-GB-RyanNeural\"><prosody rate=\"medium\">" +
        escapeHtml(text) +
        "</prosody></voice></speak>"
      );
    }

    function azurePlay(ssml) {
      if (!window.L05SpeakLocalOnly || typeof window.L05SpeakLocalOnly.playSsml !== "function") {
        console.warn("[L05] 未加载 l05-tts-local-only.js");
        return Promise.resolve();
      }
      return window.L05SpeakLocalOnly.playSsml(ssml, null);
    }

    function ariaCheer(line) {
      return azurePlay(buildSsmlEn(line));
    }

    function ariaGeneral(line) {
      return azurePlay(buildSsmlEn(line));
    }

    function ariaWhisper(line, deg) {
      void deg;
      return azurePlay(buildSsmlEn(line));
    }

    /** 点 🔊 朗读：先满足浏览器手势，再播本地 MP3（与点蓝句一致） */
    function speakAzureEn(text) {
      var t = String(text || "").trim();
      if (!t || t === "\u2026") return Promise.resolve();
      markAudioUserReady();
      return ariaGeneral(t);
    }

    /** Web Audio：答对时的喵声（两段下滑音，贴近「喵～」；点击热区属用户手势，须 resume） */
    function playMeow() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ac = new AC();
        var p = ac.resume && ac.resume();
        if (p && typeof p.catch === "function") p.catch(function () {});

        function chirp(t0, f0, f1, dur, vol) {
          var o = ac.createOscillator();
          var g = ac.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(f0, t0);
          o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g);
          g.connect(ac.destination);
          o.start(t0);
          o.stop(t0 + dur + 0.02);
        }

        var t = ac.currentTime;
        chirp(t, 920, 640, 0.11, 0.16);
        chirp(t + 0.1, 780, 520, 0.14, 0.14);

        setTimeout(function () {
          ac.close();
        }, 500);
      } catch (e) {
        console.warn("[audio]", e);
      }
    }

    function playBuzz() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ac = new AC();
        var b = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
        var d = b.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.35;
        var src = ac.createBufferSource();
        src.buffer = b;
        var g = ac.createGain();
        g.gain.value = 0.2;
        src.connect(g);
        g.connect(ac.destination);
        src.start();
        setTimeout(function () {
          ac.close();
        }, 300);
      } catch (e) {
        console.warn("[audio]", e);
      }
    }

    function playDing() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ac = new AC();
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = "sine";
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.15);
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.16);
        setTimeout(function () {
          ac.close();
        }, 250);
      } catch (e) {
        console.warn("[audio]", e);
      }
    }

    /**
     * generateHint：刷新躲猫猫顶部英文提示并朗读（须先有一次用户手势，否则不调用 play）
     */
    function generateHint() {
      var lv = seekLevels[seekIx % seekLevels.length];
      var hintEl = document.getElementById("seekHint");
      if (hintEl) hintEl.textContent = lv.line;
      if (!audioUserReady) {
        return Promise.resolve();
      }
      return ariaWhisper(lv.line, lv.whisper);
    }

    /**
     * checkHotspot：判断点击的热区是否为当前关卡答案
     */
    function checkHotspot(id) {
      var lv = seekLevels[seekIx % seekLevels.length];
      return id === lv.answerId;
    }

    function positionCatForHotspot(id) {
      /* 与热区在插图上的大致中心对齐（left/top 相对 .room-wrap） */
      /* 与各热区矩形中心一致（由人工框选百分比推算） */
      var map = {
        bed: { left: "17%", top: "86%" },
        bookcase: { left: "53%", top: "62%" },
        box: { left: "68%", top: "71%" },
        chair: { left: "80%", top: "70%" },
        desk: { left: "89%", top: "59%" }
      };
      var p = map[id] || { left: "50%", top: "55%" };
      var cat = document.getElementById("catSprite");
      cat.style.left = p.left;
      cat.style.top = p.top;
    }

    /** 三阶段可随时切换；保留函数名供躲猫猫 / Phase2 等处调用，不再锁定 Tab */
    function unlockTabs() {
      var t2 = document.getElementById("tab2");
      var t3 = document.getElementById("tab3");
      if (!t2 || !t3) return;
      t2.classList.remove("locked");
      t2.disabled = false;
      t3.classList.remove("locked");
      t3.disabled = false;
    }

    /** 按屏幕坐标命中热区（DOM 顺序后者在上；从后往前测第一个包含点的按钮） */
    function pickHotspotAt(clientX, clientY) {
      var rw = document.getElementById("roomWrap");
      if (!rw) return null;
      var list = rw.querySelectorAll("button.hotspot");
      for (var i = list.length - 1; i >= 0; i--) {
        var r = list[i].getBoundingClientRect();
        if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) return list[i];
      }
      return null;
    }

    function seekHandleHotspot(btn) {
      if (seekBusy || !btn || !btn.dataset || !btn.dataset.id) return;
      var id = btn.dataset.id;
      if (checkHotspot(id)) {
        seekBusy = true;
        var cat = document.getElementById("catSprite");
        var catInner = document.getElementById("catInner");
        try {
          playMeow();
          positionCatForHotspot(id);
          cat.classList.add("show");
          if (window.anime && catInner) {
            anime({
              targets: catInner,
              scale: [0, 1.15, 1],
              duration: 600,
              easing: "easeOutElastic(1,.75)"
            });
          } else if (catInner) {
            cat.style.opacity = "1";
            catInner.style.transform = "scale(1)";
          }
        } catch (e0) {
          console.warn("[seek]", e0);
        }
        /* 入场约 600ms + 停留约 1.6s，再收起猫并进入下一题 */
        var catHoldTotalMs = 2200;
        promiseFinally(
          new Promise(function (resolve) {
            setTimeout(resolve, catHoldTotalMs);
          }),
          function () {
            try {
              seekWins += 1;
              document.getElementById("seekScore").textContent = String(seekWins);
              seekIx += 1;
              cat.classList.remove("show");
              if (window.anime && catInner) {
                anime.set(catInner, { scale: 0 });
              } else if (catInner) {
                catInner.style.transform = "scale(0)";
                cat.style.opacity = "0";
              }
              if (seekWins >= 5) {
                document.getElementById("seekBadge").classList.add("show");
                if (window.anime) anime({ targets: "#seekBadge", scale: [0.5, 1], opacity: [0, 1], duration: 600, easing: "easeOutBack" });
              }
              unlockTabs();
              generateHint();
            } catch (e3) {
              console.warn("[seek]", e3);
            } finally {
              seekBusy = false;
            }
          }
        );
      } else {
        btn.classList.add("shake");
        playBuzz();
        setTimeout(function () {
          btn.classList.remove("shake");
        }, 480);
        if (window.anime) anime({ targets: btn, translateX: [0, -5, 5, 0], duration: 380, easing: "easeInOutSine" });
      }
    }

    function initSeek() {
      generateHint();
      var hintEl = document.getElementById("seekHint");
      if (hintEl && !hintEl.dataset.boundReplay) {
        hintEl.dataset.boundReplay = "1";
        function replayHint() {
          generateHint();
        }
        hintEl.addEventListener("click", replayHint);
        hintEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            replayHint();
          }
        });
      }
      var rw = document.getElementById("roomWrap");
      if (rw && !rw.dataset.seekRoomBound) {
        rw.dataset.seekRoomBound = "1";
        rw.addEventListener(
          "click",
          function (ev) {
            if (seekBusy) return;
            var btn = ev.target.closest && ev.target.closest("button.hotspot");
            if (!btn || !rw.contains(btn)) btn = pickHotspotAt(ev.clientX, ev.clientY);
            if (!btn || !rw.contains(btn)) return;
            ev.preventDefault();
            seekHandleHotspot(btn);
          },
          true
        );
      }
    }

    function waxNormSentence(t) {
      return String(t || "")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/\s+([.,!?])/g, "$1")
        .toLowerCase();
    }

    function waxMulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function waxShuffle(arr, seed) {
      var a = arr.slice();
      var rnd = waxMulberry32(seed);
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var t = a[i];
        a[i] = a[j];
        a[j] = t;
      }
      return a;
    }

    function waxGetRoom() {
      return WAX_ROOMS[waxPhase2.roomIx] || WAX_ROOMS[0];
    }

    function waxCurrentQuestion() {
      var sc = waxGetRoom();
      var qi = waxPhase2.roomQ[waxPhase2.roomIx] || 0;
      if (qi >= sc.questions.length) return null;
      return sc.questions[qi];
    }

    function waxClearPicks() {
      waxPhase2.pickS = "";
      waxPhase2.pickB = "";
      waxPhase2.pickP = "";
    }

    function waxUpdatePreview() {
      var el = document.getElementById("waxPreview");
      if (!el) return;
      var bits = [];
      if (waxPhase2.pickS) bits.push(waxPhase2.pickS);
      if (waxPhase2.pickB) bits.push(waxPhase2.pickB);
      if (waxPhase2.pickP) bits.push(waxPhase2.pickP);
      el.textContent = bits.length ? bits.join(" ") : "\u2026";
      var prevBtn = document.getElementById("waxPreviewTts");
      if (prevBtn) {
        var txt = el.textContent.trim();
        prevBtn.disabled = !txt || txt === "\u2026";
      }
    }

    function waxBindPills(host, labels, kind, seed) {
      host.innerHTML = "";
      var order = waxShuffle(labels, seed);
      order.forEach(function (text) {
        var cell = document.createElement("div");
        cell.className = "wax-pill-cell";
        var b = document.createElement("button");
        b.type = "button";
        b.className = "wax-pill";
        b.textContent = text;
        b.dataset.kind = kind;
        b.dataset.text = text;
        if (kind === "s" && text === waxPhase2.pickS) b.classList.add("on");
        if (kind === "b" && text === waxPhase2.pickB) b.classList.add("on");
        if (kind === "p" && text === waxPhase2.pickP) b.classList.add("on");
        b.addEventListener("click", function () {
          host.querySelectorAll(".wax-pill").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
          if (kind === "s") waxPhase2.pickS = text;
          if (kind === "b") waxPhase2.pickB = text;
          if (kind === "p") waxPhase2.pickP = text;
          waxUpdatePreview();
        });
        var tts = document.createElement("button");
        tts.type = "button";
        tts.className = "azure-tts-btn azure-tts-btn--sm";
        tts.setAttribute("aria-label", "朗读（离线 MP3）");
        tts.title = "离线 MP3";
        tts.textContent = "🔊";
        tts.addEventListener("click", function (ev) {
          ev.stopPropagation();
          speakAzureEn(text);
        });
        cell.appendChild(b);
        cell.appendChild(tts);
        host.appendChild(cell);
      });
    }

    function waxRenderQuestion() {
      var sc = waxGetRoom();
      var qi = waxPhase2.roomQ[waxPhase2.roomIx] || 0;
      var prog = document.getElementById("designProgress");
      var img = document.getElementById("waxRoomImg");
      var qEl = document.getElementById("waxWhereQ");
      var fb = document.getElementById("designFeedback");
      if (fb) fb.textContent = "";
      if (img) {
        img.src = sc.fullImg;
        img.alt = sc.title + " \u53c2\u8003\u793a\u610f\u56fe";
      }
      if (prog) {
        prog.textContent =
          sc.title +
          "  \u00b7  " +
          (qi >= sc.questions.length
            ? "\u672c\u623f\u95f4 6 \u9898\u5df2\u5b8c\u6210"
            : "\u9898 " + (qi + 1) + " / 6");
      }
      if (qi >= sc.questions.length) {
        if (qEl) {
          qEl.textContent = "Great! This room is finished. Try another tab.";
          qEl.classList.add("done-all");
        }
        waxClearPicks();
        waxUpdatePreview();
        document.getElementById("waxPillsSubject").innerHTML = "";
        document.getElementById("waxPillsBe").innerHTML = "";
        document.getElementById("waxPillsPrep").innerHTML = "";
        return;
      }
      var Q = sc.questions[qi];
      waxPhase2.shufSeed = waxPhase2.roomIx * 100 + qi * 17 + 3;
      if (qEl) {
        qEl.textContent = Q.where;
        qEl.classList.remove("done-all");
      }
      waxClearPicks();
      waxBindPills(document.getElementById("waxPillsSubject"), Q.subjects, "s", waxPhase2.shufSeed + 1);
      waxBindPills(document.getElementById("waxPillsBe"), Q.bes, "b", waxPhase2.shufSeed + 2);
      waxBindPills(document.getElementById("waxPillsPrep"), Q.preps, "p", waxPhase2.shufSeed + 3);
      waxUpdatePreview();
    }

    function waxRenderTabs() {
      var tabs = document.getElementById("designRoomTabs");
      if (!tabs) return;
      tabs.innerHTML = "";
      WAX_ROOMS.forEach(function (sc, ix) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "design-tab" + (ix === waxPhase2.roomIx ? " on" : "");
        b.setAttribute("role", "tab");
        b.dataset.room = String(ix);
        var done = (waxPhase2.roomQ[ix] || 0) >= sc.questions.length;
        if (done) b.classList.add("done");
        b.textContent = String(ix + 1) + ". " + (sc.roomTab || sc.title);
        b.addEventListener("click", function () {
          waxPhase2.roomIx = ix;
          waxRenderTabs();
          waxRenderQuestion();
        });
        tabs.appendChild(b);
      });
    }

    function waxSubmit() {
      var sc = waxGetRoom();
      var qi = waxPhase2.roomQ[waxPhase2.roomIx] || 0;
      var fb = document.getElementById("designFeedback");
      if (qi >= sc.questions.length) {
        if (fb) fb.textContent = "\u8bf7\u5207\u6362\u5230\u672a\u5b8c\u6210\u623f\u95f4\u3002";
        return;
      }
      var Q = sc.questions[qi];
      if (!waxPhase2.pickS || !waxPhase2.pickB || !waxPhase2.pickP) {
        playBuzz();
        if (fb) fb.textContent = "\u8bf7\u9009\u6ee1\u4e09\u884c\u518d\u63d0\u4ea4\u3002";
        return;
      }
      var built = waxPhase2.pickS + " " + waxPhase2.pickB + " " + waxPhase2.pickP;
      var ok = waxNormSentence(built) === waxNormSentence(Q.full);
      if (ok) {
        playDing();
        waxPhase2.everCorrect = true;
        unlockTabs();
        waxPhase2.roomQ[waxPhase2.roomIx] = qi + 1;
        if (fb) fb.textContent = "\u2713 \u6b63\u786e\uff01";
        waxRenderTabs();
        waxRenderQuestion();
      } else {

      }
    }

      }
      var src = LISTEN_FURN_IMG[listenCur.furn] || "";
      var alt = LISTEN_FURN_NAME[listenCur.furn] || listenCur.furn;
      var zoneHtml = "";
      LISTEN_ZONE_ORDER.forEach(function (slot) {
        var box = LISTEN_ZONE_LAYOUT[slot];
        if (!box) return;
        var aria = LISTEN_ZONE_ARIA[slot] || slot;
        zoneHtml +=
          '<div class="listen-zone" data-slot="' +
          slot +
          '" role="button" tabindex="0" style="' +
          listenZoneStyle(box) +
          '" aria-label="' +
          aria.replace(/"/g, "&quot;") +
          '">' +
          listenZoneDefaultInner() +
          "</div>";
      });
      if (src) {
        mount.innerHTML =
          '<div class="listen-furn-stage">' +
          '<img class="listen-furn-img" src="' +
          src +
          '" alt="' +
          alt +
          '" loading="lazy" />' +
          zoneHtml +
          "</div>";
      } else {
        mount.innerHTML = "";
      }
      mount.setAttribute("aria-label", alt + "\u4e0e\u4ecb\u8bcd\u70ed\u533a");
      listenUpdateAwaitRevealClass();
    }

    /** 播放后：书面句先隐藏，点击图中任一热点（或拖入热点）再显示 */
    function listenSentenceSetMasked() {
      listenSentenceRevealed = false;
      var p = document.getElementById("listenText");
      if (!p) return;
      p.classList.remove("listen-text--revealed");
      if (!listenCur || !listenCur.text) {
        p.textContent = "";
        p.setAttribute("lang", "en");
        listenUpdateAwaitRevealClass();
        return;
      }
      p.textContent = "";
      p.setAttribute("lang", "en");
      listenUpdateAwaitRevealClass();
    }

    function listenSentenceReveal() {
      if (!listenCur || !listenCur.text || listenSentenceRevealed) return;
      listenSentenceRevealed = true;
      var p = document.getElementById("listenText");
      if (p) {
        p.textContent = listenCur.text;
        p.setAttribute("lang", "en");
        p.classList.add("listen-text--revealed");
      }
      listenUpdateAwaitRevealClass();
    }

    /**
     * playListeningInstruction：随机抽取听力句、默认隐藏书面句、刷新家具图与叠图热点、离线 MP3 朗读
     */
    function playListeningInstruction() {
      listenCur = listenDb[Math.floor(Math.random() * listenDb.length)];
      listenSentenceSetMasked();
      var ltBtn = document.getElementById("listenTextTts");
      if (ltBtn) ltBtn.disabled = !listenCur || !listenCur.text;
      listenDrop = { item: null, slot: null };
      document.getElementById("listenFb").textContent = "";
      listenRenderFurniture();
      listenResetZonesVisual();
      listenUpdateAwaitRevealClass();
      return ariaGeneral(listenCur.text);
    }

    function initListenDrag() {
      var mount = document.getElementById("listenDragMount");
      mount.innerHTML = "";
      var icons = [
        { id: "ball", sym: "\u26BD" },
        { id: "schoolbag", sym: "\uD83C\uDF92" },
        { id: "book", sym: "\uD83D\uDCD5" },
        { id: "keys", sym: "\uD83D\uDDDD" },
        { id: "glove", sym: "\uD83E\uDDE4" }
      ];
      function listenIconSym(id) {
        for (var j = 0; j < icons.length; j++) {
          if (icons[j].id === id) return icons[j].sym;
        }
        return "?";
      }
      icons.forEach(function (ic) {
        var d = document.createElement("div");
        d.className = "drag-token";
        d.draggable = true;
        d.dataset.item = ic.id;
        d.textContent = ic.sym;
        d.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/item", ic.id);
        });
        mount.appendChild(d);
      });
      var scene = document.getElementById("listenScene");
      if (scene && !scene.dataset.listenDropDelegated) {
        scene.dataset.listenDropDelegated = "1";
        scene.addEventListener("dragover", function (e) {
          var z = e.target.closest(".listen-zone[data-slot]");
          if (!z || !scene.contains(z)) return;
          e.preventDefault();
          z.classList.add("hover");
        });
        scene.addEventListener("dragleave", function (e) {
          var z = e.target.closest(".listen-zone[data-slot]");
          if (z && scene.contains(z)) z.classList.remove("hover");
        });
        scene.addEventListener("click", function (e) {
          var z = e.target.closest(".listen-zone[data-slot]");
          if (!z || !scene.contains(z)) return;
          listenTryRevealSentence();
        });
        scene.addEventListener("drop", function (e) {
          var z = e.target.closest(".listen-zone[data-slot]");
          if (!z || !scene.contains(z)) return;
          e.preventDefault();
          z.classList.remove("hover");
          listenTryRevealSentence();
          var it = e.dataTransfer.getData("text/item");
          listenResetZonesVisual();
          listenDrop.item = it;
          listenDrop.slot = z.getAttribute("data-slot");
          z.innerHTML = '<span class="listen-drop-icon">' + listenIconSym(it) + "</span>";
        });
        if (window.LessonDnD && !scene.dataset.lessonTouchDnD) {
          scene.dataset.lessonTouchDnD = "1";
          LessonDnD.bindTouchDrop({
            root: scene,
            dragSelector: ".drag-token",
            dropSelector: ".listen-zone[data-slot]",
            getPayload: function (el) {
              return el.dataset.item || "";
            },
            hoverClass: "hover",
            onDrop: function (o) {
              o.dropEl.classList.remove("hover");
              listenTryRevealSentence();
              listenResetZonesVisual();
              listenDrop.item = o.payload;
              listenDrop.slot = o.dropEl.getAttribute("data-slot");
              o.dropEl.innerHTML = '<span class="listen-drop-icon">' + listenIconSym(o.payload) + "</span>";
            }
          });
        }
      }
      listenRenderFurniture();
      listenResetZonesVisual();
      listenSentenceSetMasked();
      listenUpdateAwaitRevealClass();
      document.getElementById("btnPlayListen").addEventListener("click", function () {
        playListeningInstruction();
      });
      document.getElementById("btnListenSubmit").addEventListener("click", function () {
        if (!listenCur) {
          ariaGeneral("Press play first.");
          return;
        }
        if (!listenDrop.item || !listenDrop.slot) {
          ariaGeneral("Drag the item onto a zone on the picture first (top / bottom / left / right / center surface).");
          return;
        }
        var ok = listenDrop.item === listenCur.item && listenDrop.slot === listenCur.slot;
        if (ok) {
          playDing();
          document.getElementById("listenFb").textContent = "\u2713 正确！";
        } else {
          playBuzz();
          document.getElementById("listenFb").textContent =
            "\u518d\u542c\u4e00\u904d\uff1a\u7269\u54c1\u4e0e\u56fe\u4e0a\u533a\u57df\uff08\u4e0a/\u4e0b/\u5de6/\u53f3/\u4e2d\u5fc3\u63a5\u89e6\u9762\uff09\u662f\u5426\u4e0e\u53e5\u4e2d\u4ecb\u8bcd\u5339\u914d\u3002";
          if (window.anime) {
            anime({
              targets: "#listenScene .listen-zone",
              translateX: [0, -4, 4, 0],
              duration: 360,
              easing: "easeInOutSine"
            });
          }
        }
      });
    }

    function showPhase(n) {
      document.querySelectorAll(".phase-panel").forEach(function (p) {
        p.classList.toggle("show", Number(p.dataset.phase) === n);
      });
      document.querySelectorAll(".phase-tabs button").forEach(function (b) {
        b.classList.toggle("on", Number(b.dataset.phase) === n);
      });
    }

    document.getElementById("phaseTabs").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-phase]");
      if (!b || b.disabled) return;
      showPhase(Number(b.dataset.phase));
    });

    /** Phase1/2/3 与各列表上的 🔊：统一走 speakAzureEn；躲猫猫提示句与点蓝句一致用 generateHint（whisper） */
    function initAzureTtsUi() {
      var seekTts = document.getElementById("seekHintTts");
      if (seekTts && !seekTts.dataset.boundTts) {
        seekTts.dataset.boundTts = "1";
        seekTts.addEventListener("click", function (e) {
          e.stopPropagation();
          markAudioUserReady();
          generateHint();
        });
      }
      var wqT = document.getElementById("waxWhereTts");
      if (wqT && !wqT.dataset.boundTts) {
        wqT.dataset.boundTts = "1";
        wqT.addEventListener("click", function (e) {
          e.stopPropagation();
          var qEl = document.getElementById("waxWhereQ");
          var t = qEl ? String(qEl.textContent || "").trim() : "";
          if (t) speakAzureEn(t);
        });
      }
      var wpT = document.getElementById("waxPreviewTts");
      if (wpT && !wpT.dataset.boundTts) {
        wpT.dataset.boundTts = "1";
        wpT.addEventListener("click", function (e) {
          e.stopPropagation();
          var pv = document.getElementById("waxPreview");
          var t = pv ? String(pv.textContent || "").trim() : "";
          if (t && t !== "\u2026") speakAzureEn(t);
        });
      }
      var ltT = document.getElementById("listenTextTts");
      if (ltT && !ltT.dataset.boundTts) {
        ltT.dataset.boundTts = "1";
        ltT.addEventListener("click", function (e) {
          e.stopPropagation();
          var t = listenCur && listenCur.text ? listenCur.text : "";
          if (!t) {
            var p = document.getElementById("listenText");
            t = p ? String(p.textContent || "").trim() : "";
          }
          speakAzureEn(t);
        });
      }
    }

    /* 先绑定躲猫猫与首条提示，避免 Phase2 初始化抛错时提示区永远停在「Loading」 */
    initSeek();
    initWaxPhase2();
    unlockTabs();
    initListenDrag();
    initAzureTtsUi();
    showPhase(1);
  </script>
