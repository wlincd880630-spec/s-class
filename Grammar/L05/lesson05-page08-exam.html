        1: "<div class=\"review-body\"><p class=\"review-note\">本题围绕物主代词。请对照自己错选的选项，看下面辨析。</p><h4 class=\"review-sub\">【考点回顾】</h4><p>考查<strong>名词性物主代词 <span lang=\"en\">mine</span></strong>与形容词性物主代词 <span lang=\"en\">my</span> 的区别：空格后<strong>是否还有名词</strong>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><strong>A. my</strong>：形物代，后面<strong>必须再接名词</strong>；本句空格在句末作表语后已无名词，排除。<br><strong>B. mine</strong>：<strong>名物代</strong>，相当于 <span lang=\"en\">my photo</span>，可单独使用，<strong>正确</strong>。<br><strong>C. me</strong>：宾格「我」，不表示「我的（那张照片）」。<br><strong>D. I</strong>：主格，不作「所属」讲。</p><h4 class=\"review-sub\">【解题步骤】</h4><p>① 看空格后有没有名词 → 没有 → 倾向名物代。<br>② 代入朗读：<span lang=\"en\">It isn't mine.</span> 语义完整。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br>① <span lang=\"en\">This pen isn't _____. It's _____. (my / mine)</span> → my pen / Mine。<br>② <span lang=\"en\">—Whose bag is this? —It's _____.</span>（答 <span lang=\"en\">hers</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若把 <span lang=\"en\">my</span> 填进去，后面还缺什么词句子才完整？</p></div>",

        2: "<div class=\"review-body\"><p class=\"review-note\">There be 与 <span lang=\"en\">have/has</span> 别混用；be 与谁一致看「离它最近」的名词。</p><h4 class=\"review-sub\">【考点回顾】</h4><p><span lang=\"en\">There be</span> 的<strong>就近原则</strong>：与 <span lang=\"en\">be</span> 紧挨着的第一个主语在数上保持一致。</p><h4 class=\"review-sub\">【选项辨析】</h4><p>主语为 <span lang=\"en\">a pen and two books</span>，<strong>最靠近动词的是单数 <span lang=\"en\">a pen</span></strong>，故用 <strong><span lang=\"en\">is</span></strong>。<br><span lang=\"en\">are</span> 与「先出现复数主语」的语序更配；<span lang=\"en\">has/have</span> 不能用于 <span lang=\"en\">There</span> 句型。</p><h4 class=\"review-sub\">【解题步骤】</h4><p>① 划去 <span lang=\"en\">and</span> 之后部分，先看 <span lang=\"en\">There ___ a pen</span> → 单数 → <span lang=\"en\">is</span>。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br>① <span lang=\"en\">There _____ a book and some pens on the desk.</span>（<span lang=\"en\">is</span>）<br>② <span lang=\"en\">There _____ some pens and a book on the desk.</span>（<span lang=\"en\">are</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若把 <span lang=\"en\">a pen and two books</span> 顺序对调，<span lang=\"en\">be</span> 要不要改？</p></div>",

        3: "<div class=\"review-body\"><p class=\"review-note\">节日前后常考复数所有格 <span lang=\"en\">Teachers'</span>。</p><h4 class=\"review-sub\">【考点回顾】</h4><p>「教师节」= 全体教师们的节日 → 复数 <span lang=\"en\">teachers</span> 加 <strong>所有格 <span lang=\"en\">'</span></strong>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><strong>A. Teacher's</strong>：单数教师，不符合「全体教师」习惯表达。<br><strong>B. Teachers'</strong>：复数以 <span lang=\"en\">s</span> 结尾，只加 <strong><span lang=\"en\">'</span></strong>，<strong>正确</strong>。<br><strong>C. Teachers</strong>：缺所有格。<br><strong>D. Teacher</strong>：单数名词不能单独作定语。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">Children's Day</span>（不规则复数加 <span lang=\"en\">'s</span>）。</div><h4 class=\"review-sub\">【启发提问】</h4><p>若写成 <span lang=\"en\">Teacher's Day</span>，暗示几位老师过节？</p></div>",

        4: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p><span lang=\"en\">in front of</span>（外部前面） vs <span lang=\"en\">in the front of</span>（内部前部）。</p><h4 class=\"review-sub\">【选项辨析】</h4><p>图书馆与教学楼是<strong>两栋独立建筑</strong>，用 <strong><span lang=\"en\">in front of</span></strong>。<br><span lang=\"en\">in the front of the classroom</span> 才指「教室内部前排」。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">The cat is hiding _____ the sofa. (behind / in the front of)</span></div><h4 class=\"review-sub\">【启发提问】</h4><p>主语若站在「建筑物内部」描述前排座位，该用哪一条？</p></div>",

        5: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p>名词 <span lang=\"en\">dictionary</span> 前用<strong>形容词性物主代词 <span lang=\"en\">your</span></strong>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><strong>A. you</strong>：主格/宾格，不表所属。<br><strong>B. your</strong>：后接名词，<strong>正确</strong>。<br><strong>C. yours</strong>：名物代，后<strong>不可</strong>再跟 <span lang=\"en\">dictionary</span>。<br><strong>D. you're</strong> = you are。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">This is _____ pen. (her / hers)</span> → <span lang=\"en\">her</span>。</div><h4 class=\"review-sub\">【启发提问】</h4><p>若选 <span lang=\"en\">yours</span>，句子应改写成什么？</p></div>",

        9: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p><span lang=\"en\">Neither…nor…</span> 谓语常遵循<strong>就近原则</strong>，此处靠近动词的是 <span lang=\"en\">my parents</span>（复数）。</p><h4 class=\"review-sub\">【选项辨析】</h4><p>→ <strong><span lang=\"en\">are</span></strong>。<br>勿见 <span lang=\"en\">brother</span> 单数就选 <span lang=\"en\">is</span>，要看与谓语相邻的主语。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">Neither he nor his parents _____ ready.</span>（<span lang=\"en\">are</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若改成 <span lang=\"en\">Neither my parents nor my brother…</span>，谓语又与谁一致？</p></div>",

        12: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p><span lang=\"en\">Not only A but also B</span> 谓语就近：<strong>靠近的是 <span lang=\"en\">I</span></strong> → <span lang=\"en\">am</span>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><strong><span lang=\"en\">am</span></strong> 仅与 <span lang=\"en\">I</span> 搭配。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">Not only my sister but also I _____ fond of music.</span>（<span lang=\"en\">am</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若 <span lang=\"en\">but also</span> 后是 <span lang=\"en\">he</span>，谓语选什么？</p></div>",

        15: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p>宾语从句用<strong>陈述语序</strong>：连接词 + 主语 + 谓语。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><strong><span lang=\"en\">where the library is</span></strong> ✓；<span lang=\"en\">where is the library</span> 是疑问语序，用于独立问句。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">Could you tell me how ____ there? (to get / do I get)</span> → <span lang=\"en\">to get</span> / <span lang=\"en\">I can get</span>（陈述序）。</div><h4 class=\"review-sub\">【启发提问】</h4><p>把从句单独拿出来，读起来像不像陈述句？</p></div>",

        16: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p>「物作主语花费金钱」用 <span lang=\"en\">cost</span>：<span lang=\"en\">Sth. costs sb. + 金额</span>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><span lang=\"en\">spend / pay</span> 主语多为人；<span lang=\"en\">take</span> 常表时间。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">The coat _____ me 200 yuan.</span>（<span lang=\"en\">cost</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若主语改成 <span lang=\"en\">I</span>，哪个「花费」动词最自然？</p></div>",

        18: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p>否定句中「一些」常用 <strong><span lang=\"en\">any</span></strong>，不用 <span lang=\"en\">some</span>（教材常规考法）。</p><h4 class=\"review-sub\">【选项辨析】</h4><p><span lang=\"en\">milk</span> 不可数，排除 <span lang=\"en\">many/few</span>。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">I don't have _____ money.</span>（<span lang=\"en\">any</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>什么语境下否定句里仍可能出现 <span lang=\"en\">some</span>？</p></div>",

        19: "<div class=\"review-body\"><h4 class=\"review-sub\">【考点回顾】</h4><p>定语从句先行词 <span lang=\"en\">the boys</span>（人、复数），从句谓语与<strong>先行词</strong>一致 → <strong><span lang=\"en\">come</span></strong>。</p><h4 class=\"review-sub\">【选项辨析】</h4><p>勿被句首 <span lang=\"en\">Tom is one of…</span> 误导选单数；关系词 <span lang=\"en\">who</span> 指代 <span lang=\"en\">boys</span>。</p><div class=\"review-ext\"><strong>【同类拓展】</strong><br><span lang=\"en\">He is one of the students who _____ from Chengdu.</span>（<span lang=\"en\">come</span>）</div><h4 class=\"review-sub\">【启发提问】</h4><p>若改成 <span lang=\"en\">the only one of the boys who…</span>，谓语还可能一样吗？（进阶思考）</p></div>",

      };

      var answers = {};
      var wrongIds = [];
      var reviewed = {};
      var reviewCache = {};

      function $(id) { return document.getElementById(id); }

      function playExamVoice(text, voiceType) {
        function fallbackPlain() {
          if (typeof window.playLessonAzureTtsPlain === "function") {
            return window.playLessonAzureTtsPlain(text);
          }
          if (window.LessonTTSBootstrap && typeof window.LessonTTSBootstrap.playLocalIfAvailable === "function") {
            return window.LessonTTSBootstrap.playLocalIfAvailable(text);
          }
          return Promise.resolve(false);
        }
        if (!window.SpeechSDK) return fallbackPlain();
        return new Promise(function (resolve) {
          var cfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
          cfg.speechSynthesisVoiceName = voiceType === "exam" ? "en-GB-RyanNeural" : "en-GB-RyanNeural";
          var synth = new SpeechSDK.SpeechSynthesizer(cfg);
          synth.speakTextAsync(text, function () { synth.close(); resolve(true); }, function () {
            synth.close();
            fallbackPlain().then(resolve);
          });
        });
      }

      function beep() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          var ac = new AC();
          var osc = ac.createOscillator();
          var gain = ac.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(.12, ac.currentTime);
          gain.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .09);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start();
          osc.stop(ac.currentTime + .1);
          setTimeout(function () { ac.close(); }, 180);
        } catch (e) {}
      }

      function renderQuestions() {
        var list = $("questionList");
        list.innerHTML = "";
        EXAM_DATABASE.forEach(function (q) {
          var card = document.createElement("div");
          card.className = "q-card";
          card.id = "qCard" + q.id;
          card.innerHTML =
            '<div class="q-head"><span class="tag">' + q.tier + " · " + q.tag + " · " + q.point + '</span><button type="button" class="speak" data-speak="' + q.id + '">🔊</button></div>' +
            '<div class="q-text">' + q.id + ". " + q.q + "</div>" +
            '<div class="options">' + q.options.map(function (op) {
              var letter = op.charAt(0);
              return '<button type="button" class="opt" data-q="' + q.id + '" data-a="' + letter + '">' + op + "</button>";
            }).join("") + "</div>" +
            '<div class="q-review" id="qReview' + q.id + '">' +
            '<button type="button" class="btn-review" data-review="' + q.id + '">苏格拉底式阅卷详解</button>' +
            '<div class="review" id="review' + q.id + '"></div></div>';
          list.appendChild(card);
        });
        list.addEventListener("click", function (ev) {
          var rb = ev.target.closest(".btn-review[data-review]");
          if (rb) {
            loadReview(Number(rb.dataset.review));
            return;
          }
          var opt = ev.target.closest(".opt[data-q]");
          var sp = ev.target.closest(".speak[data-speak]");
          if (opt) chooseAnswer(Number(opt.dataset.q), opt.dataset.a);
          if (sp) {
            var qq = EXAM_DATABASE.find(function (x) { return x.id === Number(sp.dataset.speak); });
            if (qq) playExamVoice(qq.q.replace("_____", "blank"), "item");
          }
        });
      }

      function updateAnsweredCount() {
        var n = Object.keys(answers).length;
        var el = $("answeredCount");
        if (el) el.textContent = String(n);
      }

      function chooseAnswer(qid, letter) {
        answers[qid] = letter;
        document.querySelectorAll("#qCard" + qid + " .opt[data-q]").forEach(function (el) {
          el.classList.toggle("on", el.dataset.a === letter);
        });
        updateAnsweredCount();
        beep();
      }

      function resetStampForAnimation() {
        var st = $("stamp");
        if (window.anime) anime.remove(st);
        st.style.opacity = "0";
        st.style.transform = "translate(-50%, -50%) rotate(-12deg) scale(0)";
      }

      function resetPaperTransform() {
        var paper = $("paper");
        if (!paper) return;
        if (window.anime) anime.remove(paper);
        paper.style.removeProperty("transform");
      }

      function updateScoreBanner(score) {
        var pill = $("scorePill");
        var disp = $("scoreDisplay");
        if (disp) disp.textContent = String(score);
        if (pill) pill.hidden = false;
      }

      function dismissResultsOverlay() {
        document.body.classList.remove("exam-overlay-open");
        $("submitExam").disabled = false;
        if (window.anime) {
          try {
            anime({ targets: "#dim", opacity: 0, duration: 320, easing: "linear" });
            anime({
              targets: "#stamp",
              opacity: 0,
              scale: 0.35,
              duration: 280,
              easing: "easeInQuad",
              complete: function () {
                resetStampForAnimation();
              }
            });
            anime({ targets: "#paper", translateX: 0, rotate: 0, duration: 450, easing: "easeOutQuad", complete: resetPaperTransform });
          } catch (e) {
            $("dim").style.opacity = "0";
            resetStampForAnimation();
            resetPaperTransform();
          }
        } else {
          $("dim").style.opacity = "0";
          resetStampForAnimation();
          resetPaperTransform();
        }
        var hint = $("scoreHint");
        if (hint && hint.textContent.indexOf("满分") >= 0) {
          hint.textContent = "满分！可以前往档案室。";
        } else if (hint) {
          hint.textContent =
            "错题卡片下方可点「苏格拉底式阅卷详解」查看详解与同类拓展。需要看清试卷时，点分数印章上的 ✕ 或点击灰色遮罩收起面板。";
        }
      }

      function submitExam() {
        reviewed = {};
        reviewCache = {};
        document.body.classList.remove("exam-overlay-open");
        $("submitExam").disabled = false;
        resetPaperTransform();
        resetStampForAnimation();
        $("dim").style.opacity = "0";
        EXAM_DATABASE.forEach(function (q) {
          var rb = $("review" + q.id);
          if (rb) {
            rb.classList.remove("show");
            rb.innerHTML = "";
          }
        });
        var correct = 0;
        wrongIds = [];
        EXAM_DATABASE.forEach(function (q) {
          var ok = answers[q.id] === q.answer;
          if (ok) correct += 1;
          else wrongIds.push(q.id);
        });
        var score = Math.round((correct / EXAM_DATABASE.length) * 100);
        $("stampScore").textContent = score + "/100";
        updateScoreBanner(score);
        if (window.anime) {
          try {
            anime({
              targets: "#dim",
              opacity: [0, 1],
              duration: 360,
              easing: "linear",
              complete: function () {
                document.body.classList.add("exam-overlay-open");
                $("submitExam").disabled = true;
              }
            });
            anime({
              targets: "#stamp",
              opacity: [0, 1],
              scale: [0, 1.12, 1],
              rotate: [-14, -12],
              delay: 180,
              duration: 780,
              easing: "easeOutElastic(1,.58)",
              complete: function () {
                $("stamp").style.opacity = "1";
                $("stamp").style.transform = "translate(-50%, -50%) rotate(-12deg) scale(1)";
              }
            });
          } catch (animErr) {
            $("dim").style.opacity = "1";
            $("stamp").style.opacity = "1";
            $("stamp").style.transform = "translate(-50%, -50%) rotate(-12deg) scale(1)";
            document.body.classList.add("exam-overlay-open");
            $("submitExam").disabled = true;
          }
        } else {
          $("dim").style.opacity = "1";
          $("stamp").style.opacity = "1";
          $("stamp").style.transform = "translate(-50%, -50%) rotate(-12deg) scale(1)";
          document.body.classList.add("exam-overlay-open");
          $("submitExam").disabled = true;
        }
        markWrong();
        if (score === 100) unlockNext();
      }

      function markWrong() {
        EXAM_DATABASE.forEach(function (q) {
          var card = $("qCard" + q.id);
          var rw = $("qReview" + q.id);
          var ok = answers[q.id] === q.answer;
          card.classList.toggle("q-ok", ok);
          card.classList.toggle("q-wrong", !ok);
          if (rw) {
            rw.classList.toggle("show", !ok);
            $("review" + q.id).classList.remove("show");
          }
        });
        $("scoreHint").textContent = wrongIds.length
          ? "错题卡片下方可点「苏格拉底式阅卷详解」查看预置详解与同类拓展。全部错题都查看过后，可解锁前往档案室。交卷后点 ✕ 或灰色遮罩可收起分数面板。"
          : "满分！可以前往档案室。点 ✕ 或灰色遮罩可收起分数面板。";
      }

      function loadReview(qid) {
        if (wrongIds.indexOf(qid) < 0) return;
        var box = $("review" + qid);
        box.classList.add("show");
        if (reviewCache[qid]) {
          box.innerHTML = reviewCache[qid];
          reviewed[qid] = true;
          if (wrongIds.every(function (id) { return reviewed[id]; })) unlockNext();
          return;
        }
        var q = EXAM_DATABASE.find(function (x) { return x.id === qid; });
        var html = PREWRITTEN_REVIEWS[qid];
        if (html) {
          reviewCache[qid] = html;
          box.innerHTML = html;
        } else if (q) {
          var fb = document.createElement("div");
          fb.className = "review-body";
          fb.style.whiteSpace = "pre-wrap";
          fb.textContent = localHint(q);
          box.innerHTML = "";
          box.appendChild(fb);
          reviewCache[qid] = box.innerHTML;
        }
        reviewed[qid] = true;
        if (wrongIds.every(function (id) { return reviewed[id]; })) unlockNext();
      }

      function localHint(q) {
        var tail =
          "\n【同类拓展】（离线示例）\n1) 再造一句含同一结构的句子并自判对错。\n2) 把题干关键词替换成人名/地名后再选一次。\n【启发提问】题干里哪个词决定了谓语或介词的选择？";
        if (/There be|就近|There/.test(q.point)) {
          return (
            "【考点回顾】" +
            q.point +
            "\n【选项辨析】There be 句型不能用 have/has。谓语与离它最近的名词保持数的一致。\n【解题步骤】①找谓语位置 ②看最近名词单复数 ③排除 has/have。\n【启发提问】如果把 and 两边的名词顺序对调，谓语要不要改？" +
            tail
          );
        }
        if (/物主|形物代|名物代/.test(q.point)) {
          return (
            "【考点回顾】" +
            q.point +
            "\n【选项辨析】形容词性物主代词后必须接名词；名词性物主代词单独使用，相当于名词。\n【解题步骤】看空格后有无名词→决定用哪一类物主词。\n【启发提问】能否把选项代入后朗读整句检查是否完整？" +
            tail
          );
        }
        if (/所有格/.test(q.point)) {
          return (
            "【考点回顾】" +
            q.point +
            "\n【选项辨析】复数名词以 s 结尾时常加撇号在 s 后表示「们的」。\n【解题步骤】先判断拥有一方是单数还是群体→写对应所有格。\n【启发提问】Teachers 与 Teachers' 在句中角色有何不同？" +
            tail
          );
        }
        if (/宾语|陈述语序/.test(q.point)) {
          return (
            "【考点回顾】" +
            q.point +
            "\n【选项辨析】宾语从句要用陈述语序：连接词 + 主语 + 谓语。\n【解题步骤】把从句单独拿出来看是否像陈述句。\n【启发提问】where is the library 何时成立？放进从句里应改成什么？" +
            tail
          );
        }
        if (/条件|主将从现/.test(q.point)) {
          return (
            "【考点回顾】" +
            q.point +
            "\n【选项辨析】if 引导的条件状语从句表将来时常用一般现在时，主句才用 will。\n【解题步骤】圈出主从句→先填从句时态。\n【启发提问】tomorrow 出现在从句里能否直接用 will？" +
            tail
          );
        }
        return (
          "【考点回顾】" +
          q.point +
          "\n【选项辨析】请核对题干语境与固定搭配。\n【解题步骤】①译中文②排除明显不合语法项③代入朗读。\n【启发提问】哪个选项最贴合语境关键词？" +
          tail
        );
      }

      function unlockNext() {
        $("nextPage").classList.add("show");
        if (window.anime) anime({ targets: "#nextPage", opacity: [0, 1], translateY: [20, 0], duration: 520, easing: "easeOutBack" });
      }

      function init() {
        renderQuestions();
        updateAnsweredCount();
        $("submitExam").addEventListener("click", submitExam);
        $("stampClose").addEventListener("click", function (ev) {
          ev.stopPropagation();
          dismissResultsOverlay();
        });
        $("dim").addEventListener("click", dismissResultsOverlay);
        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && document.body.classList.contains("exam-overlay-open")) {
            dismissResultsOverlay();
          }
        });
        $("openingVoice").addEventListener("click", function () {
          playExamVoice("Detectives, silence please. The final trial begins now.", "exam");
        });
      }

      init();
    })();
  </script>
