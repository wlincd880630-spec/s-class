  <script>
(function () {
  "use strict";

  function escapeXml(t) {
    return String(t || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&apos;");
  }

  function escapeXmlAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  window.unlockAudio = async function () {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        var ctx = new Ctx();
        if (ctx.state === "suspended") await ctx.resume();
      }
    } catch (e) {}
  };

  window.speak = async function (text) {
    if (!text) return false;
    var cleanText = String(text).replace(/\n/g, " ").trim();
    if (!cleanText) return false;
    if (typeof window.playLessonL07LocalTts !== "function") {
      showToast("未加载 lesson-tts-l07-local.js", false);
      return false;
    }
    if (window.unlockAudio) await window.unlockAudio();
    if (window.currentAudio) {
      try {
        window.currentAudio.pause();
      } catch (e) {}
      window.currentAudio = null;
    }
    return window.playLessonL07LocalTts(cleanText);
  };

  function speakT(text) {
    var cleanText = String(text || "").replace(/\n/g, " ").trim();
    var start = window.unlockAudio ? window.unlockAudio() : Promise.resolve();
    return start
      .then(function () {
        if (typeof window.playLessonL07LocalTts !== "function") {
          showToast("未加载 lesson-tts-l07-local.js", false);
          return false;
        }
        return window.playLessonL07LocalTts(cleanText);
      })
      .then(function (ok) {
        if (!ok) {
          var r = String(window.__L07_TTS_FAIL_REASON__ || "");
          if (r === "map_miss") {
            showToast("朗读句未在本地清单中匹配，请更新 manifest.embed.js", false);
          } else if (r === "manifest") {
            showToast("无法加载朗读清单，请确认 manifest.embed.js 已部署", false);
          } else if (r === "audio" || r === "play_rejected") {
            showToast("无法播放朗读音频，请检查网络或刷新后重试", false);
          } else if (r !== "empty") {
            showToast("朗读失败", false);
          }
        }
        return !!ok;
      })
      .catch(function () {
        showToast("朗读失败", false);
        return false;
      });
  }

  function showToast(msg, ok) {
    var t = document.getElementById("toast");
    t.style.background = ok ? "rgba(46, 125, 50, 0.95)" : "rgba(183, 28, 28, 0.95)";
    t.textContent = msg;
    t.classList.add("show");
    window.setTimeout(function () {
      t.classList.remove("show");
    }, 2600);
  }

  function clearLessonActions() {
    var bar = document.getElementById("lesson-actions");
    if (!bar) return;
    bar.innerHTML = "";
    bar.classList.add("hidden");
  }

  function lessonActionsEl() {
    var bar = document.getElementById("lesson-actions");
    if (!bar) return null;
    bar.classList.remove("hidden");
    return bar;
  }

  function speakBtn(text, label) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "speak-inline";
    b.textContent = label || "🔊";
    b.addEventListener("click", function () {
      speakT(text);
    });
    return b;
  }

  function navNext(root, fn, label) {
    var bar = lessonActionsEl();
    if (!bar) return;
    var nav = document.createElement("div");
    nav.className = "btn-row";
    var nx = document.createElement("button");
    nx.type = "button";
    nx.className = "primary";
    nx.textContent = label || "下一步 →";
    nx.addEventListener("click", fn);
    nav.appendChild(nx);
    bar.appendChild(nav);
  }

  function navPrev(root, fn, label) {
    var bar = lessonActionsEl();
    if (!bar) return;
    var nav = document.createElement("div");
    nav.className = "btn-row";
    var p = document.createElement("button");
    p.type = "button";
    p.className = "ghost";
    p.textContent = label || "← 上一步";
    p.addEventListener("click", fn);
    nav.appendChild(p);
    bar.appendChild(nav);
  }

  function addExample(root, title, en, zh, examTip, speakLabel) {
    var div = document.createElement("div");
    div.className = "ex-block";
    var head = document.createElement("div");
    head.className = "ex-head";
    var left = document.createElement("div");
    var st = document.createElement("strong");
    st.style.color = "#ffe082";
    st.textContent = title;
    left.appendChild(st);
    head.appendChild(left);
    head.appendChild(speakBtn(en, speakLabel || "🔊 朗读"));
    div.appendChild(head);
    var pen = document.createElement("p");
    pen.className = "en";
    pen.textContent = en;
    div.appendChild(pen);
    var pzh = document.createElement("p");
    pzh.className = "zh";
    pzh.textContent = "译文：" + zh;
    div.appendChild(pzh);
    if (examTip) {
      var px = document.createElement("p");
      px.className = "exam";
      px.textContent = "考点：" + examTip;
      div.appendChild(px);
    }
    root.appendChild(div);
  }

  var phase = "welcome";

  function setProgress() {
    var el = document.getElementById("progress");
    if (!el) return;
    var map = {
      welcome: "封面 · Page 08",
      tips: "教研导读 · 铂金陷阱预告",
      t1: "第一梯队 · 绝对不规则变化",
      t2: "第二梯队 · 同源双线（词义分化）",
      t3: "第三梯队 · 复合形容词",
      boss: "Boss · 三大陷阱攻坚",
      done: "本页完成"
    };
    el.textContent = map[phase] || "";
  }

  function render() {
    setProgress();
    clearLessonActions();
    var root = document.getElementById("view-root");
    root.innerHTML = "";
    root.className = "panel";

    if (phase === "welcome") renderWelcome(root);
    else if (phase === "tips") renderTips(root);
    else if (phase === "t1") renderT1(root);
    else if (phase === "t2") renderT2(root);
    else if (phase === "t3") renderT3(root);
    else if (phase === "boss") renderBoss(root);
    else renderDone(root);
  }

  function renderWelcome(root) {
    var h = document.createElement("h2");
    h.textContent = "Page 08 · 不规则比较级与最高级";
    root.appendChild(h);
    var p = document.createElement("p");
    p.className = "cn-lead";
    p.innerHTML =
      "本页按<strong>三个梯队</strong>逐屏呈现：<strong>绝对不规则</strong>（good/well、bad/ill、many/much、little）→ <strong>同源双线</strong>（far、old、late、near 等词义分化）→ <strong>复合形容词</strong>（只变核心词）。每屏含<strong>表格 + 例句 + 本地朗读</strong>，最后单独攻克<strong>三大铂金陷阱</strong>。";
    root.appendChild(p);
    navNext(root, function () {
      phase = "tips";
      render();
    }, "进入教研导读 →");
  }

  function renderTips(root) {
    var h = document.createElement("h2");
    h.textContent = "教研总结与考点提示";
    root.appendChild(h);
    var g = document.createElement("div");
    g.className = "grammar-box";
    g.innerHTML =
      "<p><strong>目标：</strong>覆盖初中阶段高频、高中阶段延伸的<strong>特殊变化</strong>，并强调<strong>词义变化</strong>带来的不同比较级形式（不是只会拼写，还要会对语境）。</p>" +
      "<p><strong>肌肉记忆组：</strong><code>better / best</code>、<code>worse / worst</code>、<code>more / most</code>、<code>less / least</code> —— 先记牢，再谈辨析。</p>" +
      "<p><strong>母语负迁移重灾区：</strong>中文都叫「更远、更老、更新」，英文却要拆开 —— 下文 <strong>Boss 关卡</strong>单独强化。</p>" +
      "<p><strong>more 的两套逻辑：</strong>① 普通形容词：<em>more + adj. + than</em>（more important）；② 表语形容词 <strong>worth</strong>：<em>be worth + more + than</em>（价值量比较），<strong>不说</strong> <em>more worth</em>。</p>";
    root.appendChild(g);
    var plat = document.createElement("div");
    plat.className = "tier-tag plat";
    plat.textContent = "铂金级陷阱预告";
    root.appendChild(plat);
    var ul = document.createElement("ul");
    ul.className = "cn-lead";
    ul.style.paddingLeft = "1.2rem";
    ul.innerHTML =
      "<li><strong>farther vs further</strong>：具象距离 vs 抽象「进一步」</li>" +
      "<li><strong>older vs elder</strong>：可比年龄（可加 than）vs 家庭长幼（定语，不加 than）</li>" +
      "<li><strong>latest vs last</strong>：「最新」vs 序列「最后」（易与 later 混淆）</li>";
    root.appendChild(ul);
    navPrev(root, function () {
      phase = "welcome";
      render();
    });
    navNext(root, function () {
      phase = "t1";
      render();
      speakT("Tier one: good and well become better and best. Bad, badly, and ill become worse and worst.");
    }, "第一梯队 · 表格 →");
  }

  function renderT1(root) {
    var tag = document.createElement("div");
    tag.className = "tier-tag";
    tag.textContent = "第一梯队 · 绝对不规则 · 中考核心得分区";
    root.appendChild(tag);
    var h = document.createElement("h2");
    h.textContent = "总表：原级 → 比较级 → 最高级";
    root.appendChild(h);

    var wrap = document.createElement("div");
    wrap.className = "ir-table-wrap";
    wrap.innerHTML =
      "<table class='ir-table'><thead><tr>" +
      "<th>意义 / 原级</th><th>比较级</th><th>最高级</th><th>陷阱与说明</th></tr></thead><tbody>" +
      "<tr><td><em>好的</em> <code>good</code>（形）/ <code>well</code>（副；形＝身体好）</td><td><code>better</code></td><td><code>best</code></td><td><code>well</code> 表健康时比较级仍是 <code>better</code></td></tr>" +
      "<tr><td><em>坏的/差的/病的</em> <code>bad</code> / <code>badly</code> / <code>ill</code></td><td><code>worse</code></td><td><code>worst</code></td><td>易漏 <code>ill</code> 也用 <code>worse</code></td></tr>" +
      "<tr><td><em>多的</em> <code>many</code>（可数）/ <code>much</code>（不可数；亦可表程度）</td><td><code>more</code></td><td><code>most</code></td><td>先分清可数与不可数</td></tr>" +
      "<tr><td><em>少的</em> <code>little</code>（表数量少）</td><td><code>less</code></td><td><code>least</code></td><td>义为「小巧」时规则变化 <code>littler — littlest</code>；考点多在「数量少」</td></tr>" +
      "</tbody></table>";
    root.appendChild(wrap);

    var h3 = document.createElement("h2");
    h3.textContent = "例句与考点（逐条朗读）";
    h3.style.marginTop = "12px";
    root.appendChild(h3);

    addExample(
      root,
      "1 good/well · 原级（健康 + 副词）",
      "He didn't feel well yesterday, so he didn't do well in the exam.",
      "他昨天觉得身体不舒服，所以考试没考好。",
      "前半：well 表身体健康（形容词）；后半：well 修饰实义动词 do（副词）。",
      "🔊"
    );
    addExample(
      root,
      "1 · 比较级 better",
      "Nothing is better than reading a good book on a rainy day.",
      "在雨天，没有什么比读一本好书更好的了。",
      "否定词 / 不定代词 + 比较级 → 最高级含义，写作高频句型。",
      "🔊"
    );
    addExample(
      root,
      "1 · 最高级 best",
      "This is the best movie that I have ever seen.",
      "这是我看过的最好的电影。",
      "最高级 + that 定语从句（现在完成时）常出现在 B 卷完成句子。",
      "🔊"
    );

    addExample(
      root,
      "2 badly · 原级",
      "The building was badly damaged in the earthquake.",
      "那栋建筑在地震中受损严重。",
      "badly 修饰动词 / 过去分词，常配合被动语态。",
      "🔊"
    );
    addExample(
      root,
      "2 · 比较级 worse",
      "The weather is getting worse and worse. We have to stay at home.",
      "天气变得越来越糟，我们不得不待在家里。",
      "比较级 + and + 比较级 → 越来越……",
      "🔊"
    );
    addExample(
      root,
      "2 · 最高级 worst",
      "What's the worst thing about living in a big city?",
      "生活在大城市最糟糕的事情是什么？",
      null,
      "🔊"
    );

    addExample(
      root,
      "3 · 比较级 more（越…越…）",
      "The more books you read, the more knowledge you will get.",
      "你书读得越多，获得的知识就越多。",
      "The + 比较级, the + 比较级 —— 单选与作文极高频。",
      "🔊"
    );
    addExample(
      root,
      "3 · most（注意 most of 主谓一致）",
      "Most of the students in our class go to school by bus.",
      "我们班大多数学生乘公交车上学。",
      "most of + 名词作主语 → 谓语与 of 后名词一致。",
      "🔊"
    );

    addExample(
      root,
      "4 little · 原级（表「几乎没有」）",
      "There is little time left, so we must hurry up.",
      "几乎没什么剩余时间了，所以我们必须快点。",
      "little + 不可数，表否定；反义疑问常考 …, is there?",
      "🔊"
    );
    addExample(
      root,
      "4 · 比较级 less",
      "We should spend less time playing computer games and more time reading.",
      "我们应该少花时间打游戏，多花时间阅读。",
      "less 与 more 对仗，贴合「时间管理」作文主题。",
      "🔊"
    );
    addExample(
      root,
      "4 · least（固定搭配）",
      "It will take you at least two hours to finish the work.",
      "完成这项工作至少要花你两个小时。",
      "at least 常与 It takes sb. some time to do sth. 连用。",
      "🔊"
    );

    addExample(
      root,
      "worth · 特殊比较（表语形容词）",
      "The old stamp on the left is worth more than the silver coin on the right.",
      "左边的旧邮票比右边的银币更值钱。",
      "不说 more worth than；more 修饰价值量，放在 worth 后面。",
      "🔊"
    );
    addExample(
      root,
      "worth · 易错对照",
      "Good health is worth more than anything else in the world.",
      "健康比世上什么都更值得。",
      "同类结构：worth less than / worth much more than。",
      "🔊"
    );

    navPrev(root, function () {
      phase = "tips";
      render();
    });
    navNext(root, function () {
      phase = "t2";
      render();
      speakT("Tier two: farther and farthest for physical distance; further and furthest for abstract meaning.");
    }, "第二梯队 →");
  }

  function renderT2(root) {
    var tag = document.createElement("div");
    tag.className = "tier-tag";
    tag.textContent = "第二梯队 · 同源双线 · 词义分化陷阱区";
    root.appendChild(tag);
    var h = document.createElement("h2");
    h.textContent = "对照总表";
    root.appendChild(h);

    var wrap = document.createElement("div");
    wrap.className = "ir-table-wrap";
    wrap.innerHTML =
      "<table class='ir-table'><thead><tr><th>词根</th><th>路线</th><th>比较级 → 最高级</th><th>词义要点</th></tr></thead><tbody>" +
      "<tr><td rowspan='2'><em>far</em></td><td>A 物理距离</td><td><code>farther</code> → <code>farthest</code></td><td>具体路程、远近</td></tr>" +
      "<tr><td>B 抽象/附加</td><td><code>further</code> → <code>furthest</code></td><td>进一步、更深；further information 不用 farther</td></tr>" +
      "<tr><td rowspan='2'><em>old</em></td><td>A 年龄/新旧</td><td><code>older</code> → <code>oldest</code></td><td>可加 than；人或物「更旧」</td></tr>" +
      "<tr><td>B 家庭长幼</td><td><code>elder</code> → <code>eldest</code></td><td>仅定语；<strong>绝不</strong>说 elder than</td></tr>" +
      "<tr><td rowspan='2'><em>late</em></td><td>A 时间轴</td><td><code>later</code> → <code>latest</code></td><td>later 更晚；latest 最近的、最新的</td></tr>" +
      "<tr><td>B 两者/序列</td><td><code>latter</code> → <code>last</code></td><td>former… latter…；last 序列中的最后</td></tr>" +
      "<tr><td rowspan='2'><em>near</em></td><td>A 空间</td><td><code>nearer</code> → <code>nearest</code></td><td>距离最近</td></tr>" +
      "<tr><td>B 顺序「下一个」</td><td colspan='2'>用 <code>next</code>，不用 nearest：the next lesson / the next station</td></tr>" +
      "</tbody></table>";
    root.appendChild(wrap);

    var h3 = document.createElement("h2");
    h3.textContent = "例句 · far / old / late / near";
    root.appendChild(h3);

    addExample(
      root,
      "far · farther（物理更远）",
      "The train station is much farther than I thought.",
      "火车站比我想象的要远得多。",
      "much 修饰比较级；具象距离选 farther。",
      "🔊"
    );
    addExample(
      root,
      "far · further（进一步）",
      "If you need any further information, please visit our website.",
      "若需要进一步信息，请访问我们的网站。",
      "应用文/广告结尾高频；此处不用 farther。",
      "🔊"
    );
    addExample(
      root,
      "old · older（可比）",
      "My grandfather is much older than my grandmother.",
      "我爷爷比我奶奶年纪大得多。",
      null,
      "🔊"
    );
    addExample(
      root,
      "old · elder（辈分，定语）",
      "My elder brother goes to a university in Beijing.",
      "我哥哥在北京上大学。",
      "elder 只放在名词前；不说 elder than。",
      "🔊"
    );
    addExample(
      root,
      "late · later",
      "He realized his mistake a few days later.",
      "几天后，他意识到了自己的错误。",
      null,
      "🔊"
    );
    addExample(
      root,
      "late · latest",
      "Have you heard the latest news about the Olympic Games?",
      "你听到关于奥运会的最新消息了吗？",
      "latest ≈ 最新；不要与 last「最后」混淆。",
      "🔊"
    );
    addExample(
      root,
      "late · latter（两者中之后者）",
      "The former is easy, but the latter is difficult.",
      "前者容易，后者难。",
      "与 former 成对出现。",
      "🔊"
    );
    addExample(
      root,
      "near · nearest",
      "Excuse me, could you tell me the way to the nearest hospital?",
      "打扰一下，您能告诉我最近的医院怎么走吗？",
      "问路与指路交际用语核心句。",
      "🔊"
    );

    navPrev(root, function () {
      phase = "t1";
      render();
    });
    navNext(root, function () {
      phase = "t3";
      render();
    }, "第三梯队 →");
  }

  function renderT3(root) {
    var tag = document.createElement("div");
    tag.className = "tier-tag";
    tag.textContent = "第三梯队 · 高中高阶 · 复合形容词";
    root.appendChild(tag);
    var h = document.createElement("h2");
    h.textContent = "只变「核心不规则词」";
    root.appendChild(h);
    var g = document.createElement("div");
    g.className = "grammar-box";
    g.innerHTML =
      "<p>复合形容词里，<strong>比较级 / 最高级一般只变化其中的不规则核心</strong>，前后缀保持不变。</p>";
    root.appendChild(g);

    var wrap = document.createElement("div");
    wrap.className = "ir-table-wrap";
    wrap.innerHTML =
      "<table class='ir-table'><thead><tr><th>原级</th><th>比较级</th><th>最高级</th></tr></thead><tbody>" +
      "<tr><td><code>good-looking</code></td><td><code>better-looking</code></td><td><code>best-looking</code></td></tr>" +
      "<tr><td><code>well-known</code></td><td><code>better-known</code></td><td><code>best-known</code></td></tr>" +
      "<tr><td><code>badly-paid</code></td><td><code>worse-paid</code></td><td><code>worst-paid</code></td></tr>" +
      "<tr><td><code>much-needed</code></td><td><code>more-needed</code></td><td><code>most-needed</code></td></tr>" +
      "</tbody></table>";
    root.appendChild(wrap);

    addExample(
      root,
      "朗读示范（复合形容词）",
      "This better-known brand launched a much-needed service for badly-paid workers.",
      "这个更为知名的品牌为一群薪水偏低的工人推出了一项急需的服务。",
      "写作与七选五中可整体认读；抓核心 better / much / bad。",
      "🔊"
    );

    navPrev(root, function () {
      phase = "t2";
      render();
    });
    navNext(root, function () {
      phase = "boss";
      render();
      speakT("Boss traps: farther versus further, older versus elder, latest versus last.");
    }, "Boss · 三大陷阱 →");
  }

  function renderBoss(root) {
    var tag = document.createElement("div");
    tag.className = "tier-tag plat";
    tag.textContent = "Boss · 黄金 / 铂金级陷阱";
    root.appendChild(tag);
    var h = document.createElement("h2");
    h.textContent = "对照记忆 · 一击破局";
    root.appendChild(h);

    var grid = document.createElement("div");
    grid.className = "trap-grid";

    var c1 = document.createElement("div");
    c1.className = "trap-card";
    c1.innerHTML =
      "<h3>① farther vs further</h3>" +
      "<p><span class='ok'>✓</span> He ran farther than me.（路程）</p>" +
      "<p><span class='ok'>✓</span> For further details, email us.（进一步）</p>" +
      "<p><span class='bad'>✗</span> For farther information…（典型错搭）</p>";
    grid.appendChild(c1);

    var c2 = document.createElement("div");
    c2.className = "trap-card";
    c2.innerHTML =
      "<h3>② older vs elder</h3>" +
      "<p><span class='ok'>✓</span> He is older than me.</p>" +
      "<p><span class='ok'>✓</span> He is my elder brother.</p>" +
      "<p><span class='bad'>✗</span> He is elder than me.（必须用 older than）</p>";
    grid.appendChild(c2);

    var c3 = document.createElement("div");
    c3.className = "trap-card";
    c3.innerHTML =
      "<h3>③ latest vs last</h3>" +
      "<p><span class='ok'>✓</span> the latest news（最新消息）</p>" +
      "<p><span class='ok'>✓</span> the last chapter（书的最后一章）</p>" +
      "<p>latest ≠「最后」；last ≠「最新」。结合语境选词。</p>";
    grid.appendChild(c3);

    root.appendChild(grid);

    var bar = lessonActionsEl();
    if (bar) {
      var row = document.createElement("div");
      row.className = "btn-row";
      row.appendChild(speakBtn("He ran farther than me.", "🔊 farther"));
      row.appendChild(speakBtn("For further details, please call us.", "🔊 further"));
      row.appendChild(speakBtn("He is older than me.", "🔊 older"));
      row.appendChild(speakBtn("He is my elder brother.", "🔊 elder"));
      row.appendChild(speakBtn("Have you read the latest report?", "🔊 latest"));
      row.appendChild(speakBtn("This is the last page of the book.", "🔊 last"));
      bar.appendChild(row);
    }

    navPrev(root, function () {
      phase = "t3";
      render();
    });
    navNext(root, function () {
      phase = "done";
      render();
    }, "完成本页 →");
  }

  function renderDone(root) {
    var h = document.createElement("h2");
    h.textContent = "✨ Page 08 学完啦";
    root.appendChild(h);
    var p = document.createElement("p");
    p.className = "cn-lead";
    p.innerHTML =
      "你已系统梳理：<strong>绝对不规则</strong>、<strong>同源双线</strong>、<strong>复合形容词</strong>，并单独强化了 <strong>farther/further · older/elder · latest/last</strong>。";
    root.appendChild(p);
    var bar = lessonActionsEl();
    if (bar) {
      var row = document.createElement("div");
      row.className = "btn-row";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "speak-inline";
      b.textContent = "🔊 再听一遍小结（英）";
      b.addEventListener("click", function () {
        speakT(
          "Remember: good and well become better and best. Bad and ill become worse and worst. Use farther for physical distance and further for abstract meaning. Use older with than, but elder only before a noun like elder brother. Latest means most recent; last means final in a sequence."
        );
      });
      row.appendChild(b);
      bar.appendChild(row);
    }
    navPrev(root, function () {
      phase = "boss";
      render();
    }, "← 返回 Boss");
  }

  render();
})();
  </script>
