  <style>

    .toolbar {
      display: flex;

      gap: 8px;
      align-items: center;

    }
    .toolbar label { font-size: 0.74rem; color: #b0bec5; }
    .toolbar select {
      background: rgba(0, 0, 0, 0.35);

      border: 1px solid rgba(255, 193, 7, 0.35);

    }
    .toolbar button.primary,

      min-height: 44px;

    }

    .q-grid-wrap {
      flex: 1 1 auto;
      min-height: 0;

    .q-dot {

    .panel {

    button.primary, button.ghost {

    .report-panel {

    .cluster-block {

    #toast {

    #nav-foot {

    .hidden { display: none !important; }

    @media (max-width: 720px) {

    @media (hover: none) and (pointer: coarse) {

        border-color: rgba(255, 255, 255, 0.15);

      button.primary:active,

    @media (prefers-reduced-motion: reduce) {
      #toast {
        transition: none !important;
      }
    }
  </style>

  <script>
(function () {
  "use strict";

  function escapeXml(t) {
    return String(t || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&apos;");
  }

  function escapeXmlAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  window.unlockAudio = async function () {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        var ctx = new Ctx();
        if (ctx.state === "suspended") await ctx.resume();
      }
    } catch (e) {}
  };

  window.speak = async function (text) {
    if (!text) return;
    var cleanText = String(text).replace(/\n/g, " ").trim();
    if (typeof window.playLessonL07LocalTts !== "function") return;
    if (window.currentAudio) {
      try {
        window.currentAudio.pause();
      } catch (e) {}
      window.currentAudio = null;
    }
    await window.playLessonL07LocalTts(cleanText);
  };

  function speakT(text) {
    var p = window.unlockAudio ? window.unlockAudio() : Promise.resolve();
    return p.then(function () {
      if (typeof window.playLessonL07LocalTts !== "function") {
        showToast("未加载本地语音脚本", false);
        return;
      }
      return window.speak(text);
    });
  }

  function showToast(msg, ok) {
    var t = document.getElementById("toast");
    t.style.background = ok ? "rgba(46, 125, 50, 0.95)" : "rgba(183, 28, 28, 0.95)";
    t.textContent = msg;
    t.classList.add("show");
    window.setTimeout(function () {
      t.classList.remove("show");
    }, 2600);
  }

  /** 看图题配图：题库中为相对路径时，统一走腾讯云 COS（Grammar/L07/） */
  var L07_MEDIA_ROOT =
    "";
  function l07PictureUrl(u) {
    var s = String(u || "").trim();
    if (!s) return "";
    if (/^https?:\/\//i.test(s)) return s;
    return L07_MEDIA_ROOT + s.replace(/^\/+/, "");
  }

  var BANK = window.PAGE09_BANK || [];
  var READINGS = window.PAGE09_READINGS || [];
  var THEMES = (window.PAGE09_META && window.PAGE09_META.themes) || [];

  if (!BANK.length) {
    document.getElementById("panel").innerHTML =
      "<p style='color:#ffcdd2'>题库未加载：请与本页同目录放置 lesson07-page09-data.js</p>";
    throw new Error("PAGE09_BANK empty");
  }

  var filteredIndices = BANK.map(function (_, i) {
    return i;
  });
  var cursor = 0;
  var answers = {};
  var submitted = false;
  var results = {};
  var reportOpen = false;
  /** 每题解析区是否展开：true / false；未设置时，提交后默认展开 */
  var explainOpen = {};

  function explainIsOpen(qid) {
    var o = explainOpen[qid];
    if (o === true) return true;
    if (o === false) return false;
    return submitted;
  }

  function readingById(rid) {
    return READINGS.filter(function (r) {
      return r.id === rid;
    })[0];
  }

  function typeLabel(t) {
    var map = {
      choice: "单项选择",
      blank: "词汇填空",
      error: "改错（选错误部分）",
      order: "排序成句",
      picture: "看图选择",
      listen: "听力理解",
      reading: "阅读选择"
    };
    return map[t] || t;
  }

  function normBlank(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ")
      .replace(/，/g, ",")
      .replace(/；/g, ";");
  }

  function normOrderSentence(s) {
    var t = String(s || "")
      .trim()
      .replace(/\s+/g, " ")
      .toLowerCase();
    if (!/[.!?]$/.test(t)) t += ".";
    return t;
  }

  function checkBlank(user, key) {
    var u = normBlank(user);
    var k = normBlank(key);
    if (k.indexOf(";") >= 0) {
      var ka = k.split(";").map(function (x) {
        return normBlank(x);
      });
      var ua = u.split(/[;,，]/).map(function (x) {
        return normBlank(x);
      });
      if (ka.length !== ua.length) return false;
      for (var i = 0; i < ka.length; i++) if (ka[i] !== ua[i]) return false;
      return true;
    }
    return u === k;
  }

  function checkOrder(user, key) {
    return normOrderSentence(user) === normOrderSentence(key);
  }

  function checkMc(user, key) {
    var u = String(user || "").trim().toUpperCase();
    var letter = String(key || "").trim().toUpperCase();
    if (u === letter) return true;
    if (u.indexOf(letter + ".") === 0) return true;
    return false;
  }

  function applyFilters() {
    var th = document.getElementById("filter-theme").value;
    var df = document.getElementById("filter-dif").value;
    filteredIndices = [];
    BANK.forEach(function (q, i) {
      if (th && q.theme !== th) return;
      if (df && String(q.difficulty) !== df) return;
      filteredIndices.push(i);
    });
    if (!filteredIndices.length) filteredIndices = BANK.map(function (_, i) {
      return i;
    });
    cursor = 0;
    renderNav();
    renderQuestion();
  }

  function buildThemeSelect() {
    var sel = document.getElementById("filter-theme");
    THEMES.forEach(function (t) {
      var o = document.createElement("option");
      o.value = t;
      o.textContent = t;
      sel.appendChild(o);
    });
  }

  function scoreAll() {
    results = {};
    var ok = 0;
    BANK.forEach(function (q) {
      var u = answers[q.id];
      var good = false;
      if (q.type === "blank") good = checkBlank(u, q.answer);
      else if (q.type === "order") good = checkOrder(u, q.answer);
      else good = checkMc(u, q.answer);
      results[q.id] = good;
      if (good) ok++;
    });
    return { ok: ok, total: BANK.length };
  }

  function renderNav() {
    var grid = document.getElementById("q-grid");
    grid.innerHTML = "";
    filteredIndices.forEach(function (bankIdx, fi) {
      var q = BANK[bankIdx];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "q-dot";
      btn.textContent = String(q.id);
      if (fi === cursor) btn.classList.add("active");
      if (answers[q.id] != null && answers[q.id] !== "") btn.classList.add("has");
      if (submitted) {
        btn.classList.remove("has");
        if (results[q.id]) btn.classList.add("ok");
        else btn.classList.add("bad");
      }
      btn.addEventListener("click", function () {
        saveCurrentInput();
        cursor = fi;
        renderNav();
        renderQuestion();
      });
      grid.appendChild(btn);
    });
  }

  function saveCurrentInput() {
    if (!filteredIndices.length) return;
    var q = BANK[filteredIndices[cursor]];
    var panel = document.getElementById("panel");
    if (q.type === "blank" || q.type === "order") {
      var inp = panel.querySelector("[data-answer-input]");
      if (inp) answers[q.id] = inp.value;
    } else {
      var sel = panel.querySelector("input[name='mc']:checked");
      answers[q.id] = sel ? sel.value : answers[q.id];
    }
  }

  function renderQuestion() {
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    if (!filteredIndices.length) return;
    var q = BANK[filteredIndices[cursor]];

    var meta = document.createElement("div");
    meta.className = "meta-row";
    meta.innerHTML =
      "<span class='tag'>#" +
      q.id +
      " / " +
      BANK.length +
      "</span>" +
      "<span class='tag'>" +
      q.theme +
      "</span>" +
      "<span class='dif'>" +
      "★".repeat(q.difficulty || 1) +
      "</span>" +
      "<span class='type-lbl'>" +
      typeLabel(q.type) +
      "</span>";
    panel.appendChild(meta);

    if (q.type === "reading") {
      var rd = readingById(q.readingId);
      if (rd) {
        var box = document.createElement("div");
        box.className = "reading-box";
        var h4 = document.createElement("h4");
        h4.textContent = rd.title + " · " + rd.theme;
        box.appendChild(h4);
        var pt = document.createElement("div");
        pt.style.whiteSpace = "pre-wrap";
        pt.textContent = rd.text;
        box.appendChild(pt);
        panel.appendChild(box);
      }
    }

    if (q.type === "picture" && q.img) {
      var im = document.createElement("img");
      im.className = "pic-q";
      im.alt = "看图";
      im.src = l07PictureUrl(q.img);
      im.loading = "lazy";
      panel.appendChild(im);
    }

    var stem = document.createElement("p");
    stem.className = "stem";
    stem.textContent = q.stem;
    panel.appendChild(stem);

    if (q.type === "listen") {
      var br = document.createElement("div");
      br.className = "btn-row";
      br.style.marginTop = "0";
      var play = document.createElement("button");
      play.type = "button";
      play.className = "speak-inline";
      play.textContent = "🔊 播放听力（本地 MP3）";
      play.addEventListener("click", function () {
        speakT(q.listenText || "");
      });
      br.appendChild(play);
      panel.appendChild(br);
    }

    if (q.type === "order" && q.parts) {
      var shuffled = q.parts.slice();
      var seed = q.id * 7919 + 104729;
      for (var si = shuffled.length - 1; si > 0; si--) {
        seed = (seed * 9301 + 49297) % 233280;
        var sj = seed % (si + 1);
        var tmp = shuffled[si];
        shuffled[si] = shuffled[sj];
        shuffled[sj] = tmp;
      }
      var hint = document.createElement("div");
      hint.className = "parts-hint";
      hint.textContent = "词块提示（乱序）： " + shuffled.join("  |  ");
      panel.appendChild(hint);
      var ta = document.createElement("textarea");
      ta.className = "txt-in";
      ta.dataset.answerInput = "1";
      ta.placeholder = "请输入完整英文句子（注意标点与大小写参考答案格式）";
      ta.value = answers[q.id] || "";
      ta.addEventListener("input", function () {
        answers[q.id] = ta.value;
        renderNav();
      });
      panel.appendChild(ta);
    } else if (q.type === "blank") {
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "txt-in";
      inp.dataset.answerInput = "1";
      inp.placeholder = "若有多空，请用英文分号 ; 隔开，如 fewer; more";
      inp.value = answers[q.id] || "";
      inp.addEventListener("input", function () {
        answers[q.id] = inp.value;
        renderNav();
      });
      panel.appendChild(inp);
    } else {
      var opts = document.createElement("div");
      opts.className = "opts";
      (q.options || []).forEach(function (line, idx) {
        var lab = document.createElement("label");
        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "mc";
        var letter = String.fromCharCode(65 + idx);
        radio.value = letter;
        if (answers[q.id] === letter) radio.checked = true;
        radio.addEventListener("change", function () {
          answers[q.id] = letter;
          renderNav();
        });
        lab.appendChild(radio);
        lab.appendChild(document.createTextNode(line));
        opts.appendChild(lab);
      });
      panel.appendChild(opts);
    }

    var explainRow = document.createElement("div");
    explainRow.className = "btn-row explain-toggle-row";
    var btnExplain = document.createElement("button");
    btnExplain.type = "button";
    btnExplain.className = "ghost btn-explain";
    btnExplain.setAttribute("aria-expanded", explainIsOpen(q.id) ? "true" : "false");
    btnExplain.textContent = explainIsOpen(q.id) ? "收起解析" : "解析";
    btnExplain.addEventListener("click", function () {
      explainOpen[q.id] = !explainIsOpen(q.id);
      renderQuestion();
    });
    explainRow.appendChild(btnExplain);
    panel.appendChild(explainRow);

    var navRow = document.createElement("div");
    navRow.className = "btn-row";
    var prev = document.createElement("button");
    prev.type = "button";
    prev.className = "ghost";
    prev.textContent = "← 上一题";
    prev.disabled = cursor <= 0;
    prev.addEventListener("click", function () {
      saveCurrentInput();
      if (cursor > 0) {
        cursor--;
        renderNav();
        renderQuestion();
      }
    });
    var next = document.createElement("button");
    next.type = "button";
    next.className = "ghost";
    next.textContent = "下一题 →";
    next.disabled = cursor >= filteredIndices.length - 1;
    next.addEventListener("click", function () {
      saveCurrentInput();
      if (cursor < filteredIndices.length - 1) {
        cursor++;
        renderNav();
        renderQuestion();
      }
    });
    navRow.appendChild(prev);
    navRow.appendChild(next);
    panel.appendChild(navRow);

    var ex = document.createElement("div");
    ex.className = "explain" + (explainIsOpen(q.id) ? " show" : "");
    ex.innerHTML =
      "<p><strong>正确答案：</strong>" +
      escapeHtml(String(q.answer)) +
      "</p>" +
      "<p><strong>解析：</strong>" +
      escapeHtml(q.analysis || "") +
      "</p>" +
      "<p><strong>考点：</strong>" +
      escapeHtml(q.knowledge || "") +
      "</p>" +
      "<p><strong>同类归纳：</strong>" +
      escapeHtml(q.cluster || "") +
      "</p>";
    panel.appendChild(ex);
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderReport() {
    var rep = document.getElementById("report-panel");
    if (!submitted || !reportOpen) {
      rep.classList.remove("show");
      return;
    }
    rep.classList.add("show");
    var wrong = BANK.filter(function (q) {
      return !results[q.id];
    });
    var byCluster = {};
    BANK.forEach(function (q) {
      var c = q.cluster || "其他";
      if (!byCluster[c]) byCluster[c] = { wrong: [], tip: q.knowledge };
      if (!results[q.id]) byCluster[c].wrong.push(q.id);
    });
    var html =
      "<h4>错题清单（" +
      wrong.length +
      "）</h4>" +
      wrong
        .map(function (q) {
          return (
            "<div class='cluster-block'><strong>#" +
            q.id +
            "</strong> " +
            typeLabel(q.type) +
            "<br />正答：<code>" +
            escapeHtml(q.answer) +
            "</code><br />" +
            escapeHtml(q.analysis || "") +
            "</div>"
          );
        })
        .join("") +
      "<h4>按「同类归纳」分组复盘</h4>";
    Object.keys(byCluster).forEach(function (k) {
      var block = byCluster[k];
      if (!block.wrong.length) return;
      html +=
        "<div class='cluster-block'><strong>" +
        escapeHtml(k) +
        "</strong> · 错题号：" +
        block.wrong.join(", ") +
        "<br />建议：回顾教材与中考试题中同属「" +
        escapeHtml(k) +
        "」的句式，集中改写 3～5 句巩固。</div>";
    });
    html +=
      "<h4>全卷考点速览（抽查自学）</h4><ul style='margin:0;padding-left:1.2rem'>" +
      BANK.map(function (q) {
        return (
          "<li>#" +
          q.id +
          " · " +
          escapeHtml(q.knowledge || "") +
          "</li>"
        );
      }).join("") +
      "</ul>";
    rep.innerHTML = html;
  }

  document.getElementById("btn-submit").addEventListener("click", function () {
    saveCurrentInput();
    submitted = true;
    var sc = scoreAll();
    var pct = Math.round((sc.ok / sc.total) * 100);
    var ban = document.getElementById("result-banner");
    ban.classList.add("show");
    var tier =
      pct >= 90 ? "优秀 · 比较等级运用扎实" : pct >= 75 ? "良好 · 建议针对错题簇复盘" : pct >= 60 ? "及格 · 请优先重温错题归纳" : "需加强 · 建议回归教材例句再练";
    ban.innerHTML =
      "<strong>得分 " +
      sc.ok +
      " / " +
      sc.total +
      "（" +
      pct +
      "%）</strong><br />" +
      tier;
    renderNav();
    renderQuestion();
    renderReport();
    showToast("已评分，可逐题查看解析或打开解析总览", true);
  });

  document.getElementById("btn-toggle-report").addEventListener("click", function () {
    if (!submitted) {
      showToast("请先提交全部并评分", false);
      return;
    }
    reportOpen = !reportOpen;
    renderReport();
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    if (!confirm("确定清空全部作答与评分？")) return;
    answers = {};
    submitted = false;
    results = {};
    reportOpen = false;
    explainOpen = {};
    document.getElementById("result-banner").classList.remove("show");
    document.getElementById("report-panel").classList.remove("show");
    renderNav();
    renderQuestion();
  });

  document.getElementById("btn-first-wrong").addEventListener("click", function () {
    if (!submitted) {
      showToast("提交后可跳转错题", false);
      return;
    }
    saveCurrentInput();
    var fi = filteredIndices.findIndex(function (idx) {
      return !results[BANK[idx].id];
    });
    if (fi < 0) {
      showToast("当前筛选下没有错题 🎉", true);
      return;
    }
    cursor = fi;
    renderNav();
    renderQuestion();
  });

  document.getElementById("filter-theme").addEventListener("change", applyFilters);
  document.getElementById("filter-dif").addEventListener("change", applyFilters);

  buildThemeSelect();
  renderNav();
  renderQuestion();
})();
  </script>
