        var span = document.createElement("span");
        span.className =
          "tag " + (pt.tag.indexOf("one") >= 0 || pt.tag.indexOf("the most") >= 0 ? "tag-o" : "tag-t");
        span.textContent = pt.tag;
        textWrap.appendChild(span);
        textWrap.appendChild(document.createTextNode(" "));
        var inner = document.createElement("span");
        inner.innerHTML = pt.en;
        textWrap.appendChild(inner);
        reveal.appendChild(textWrap);

        function revealPointLine() {
          if (reveal.classList.contains("is-revealed")) return;
          reveal.classList.add("is-revealed");
          reveal.setAttribute("aria-expanded", "true");
        }
        reveal.addEventListener("click", function (ev) {
          if (!reveal.classList.contains("is-revealed")) {
            ev.preventDefault();
            revealPointLine();
          }
        });
        reveal.addEventListener("keydown", function (ev) {
          if (reveal.classList.contains("is-revealed")) return;
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            revealPointLine();
          }
        });

        var lineTts =
          typeof pt.tts === "string" && pt.tts.trim()
            ? pt.tts.trim()
            : htmlToPlainText(pt.en);

        var speakPt = document.createElement("button");
        speakPt.type = "button";
        speakPt.className = "speak-fab speak-fab--point";
        speakPt.setAttribute("aria-label", "朗读该例句");
        speakPt.textContent = "\uD83D\uDD0A";
        speakPt.addEventListener("click", function (ev) {
          ev.stopPropagation();
          speakLesson(lineTts);
        });

        var ptRow = document.createElement("div");
        ptRow.className = "slide-point-row";
        ptRow.appendChild(reveal);
        ptRow.appendChild(speakPt);
        li.appendChild(ptRow);
        ul.appendChild(li);
      });

    var nav = document.createElement("div");
    nav.className = "btn-row";
    if (slideIdx > 0) {
      var prev = document.createElement("button");
      prev.type = "button";
      prev.className = "ghost";
      prev.textContent = "\u2190 上一幕";
      prev.addEventListener("click", function () {
        slideIdx--;
        render();
      });
      nav.appendChild(prev);
    }
    var next = document.createElement("button");
    next.type = "button";
    next.className = "primary";
    next.textContent = slideIdx >= SLIDES.length - 1 ? "进入语法小结 \u2192" : "下一幕 \u2192";
    next.addEventListener("click", function () {
      if (slideIdx >= SLIDES.length - 1) {
        phase = "grammar";
        render();
        speakLesson(
          "Now let us summarize two important patterns: one of the plus superlative plus plural noun, and the plus superlative plus of plus group."
        );
      } else {
        slideIdx++;
        render();
      }
    });
    nav.appendChild(next);

    var split = document.createElement("div");
    split.className = "slide-split";
    var mediaCol = document.createElement("div");
    mediaCol.className = "slide-split__media";
    mediaCol.appendChild(stage);
    var bodyCol = document.createElement("div");
    bodyCol.className = "slide-split__body";
    bodyCol.appendChild(cn);
    bodyCol.appendChild(ul);
    bodyCol.appendChild(nav);
    split.appendChild(mediaCol);
    split.appendChild(bodyCol);
    root.appendChild(split);
  }

  function renderGrammar(root) {
    var h = document.createElement("h2");
    h.textContent = "语法小结 · 两大结构";
    root.appendChild(h);
    var g1 = document.createElement("div");
    g1.className = "grammar-box";
    g1.innerHTML =
      "<p><strong>结构 A：</strong><code>one of the + 形容词最高级 + 可数名词复数 (+ 范围)</code></p>" +
      "<p>例：China is <strong>one of the greatest countries</strong> in the world.</p>" +
      "<p>例：This is <strong>one of the most exciting lessons</strong> of the term.</p>";
    root.appendChild(g1);
    var g2 = document.createElement("div");
    g2.className = "grammar-box";
    g2.innerHTML =
      "<p><strong>结构 B：</strong><code>the + 形容词最高级 (+ 名词) + of / in + 群体或范围</code></p>" +
      "<p>例：Tom is <strong>the tallest boy of the three</strong>.</p>" +
      "<p>例：Summer is <strong>the hottest season of the year</strong>.</p>";
    root.appendChild(g2);
    var g3 = document.createElement("div");
    g3.className = "grammar-box";
    g3.innerHTML =
      "<p><strong>无比较级、最高级（常见考点）：</strong><code>favourite</code>（多用 my favourite…）；<code>unique</code>；<code>dead</code>；<code>main</code> 等。</p>" +
      "<p>不要说 <span class='hl'>more favourite</span> / <span class='hl'>most favourite</span>，应说 <strong>my favourite teacher</strong>。</p>" +
      "<p><strong>音节提示：</strong>单音节、部分双音节多用 <strong>-est</strong>；更长多用 <strong>most + 原级</strong>。</p>";
    root.appendChild(g3);
    var row = document.createElement("div");
    row.className = "btn-row";
    var bf = document.createElement("button");
    bf.type = "button";
    bf.className = "speak-fab";
    bf.textContent = "\uD83D\uDD0A";
    bf.addEventListener("click", function () {
      speakLesson(
        "Pattern A: one of the plus superlative plus plural noun. Pattern B: the plus superlative plus of plus group. Remember favourite has no comparative form."
      );
    });
    row.appendChild(bf);
    var nx = document.createElement("button");
    nx.type = "button";
    nx.className = "primary";
    nx.textContent = "查看 " + WORD_ROWS.length + " 组词形表 \u2192";
    nx.addEventListener("click", function () {
      phase = "wordbank";
      render();
    });
    row.appendChild(nx);
    root.appendChild(row);
  }

  function renderWordbank(root) {
    root.className = "panel panel--wordbank";
    var h = document.createElement("h2");
    h.textContent = "比较级 · 最高级 · 常见词形（" + WORD_ROWS.length + " 组）";
    root.appendChild(h);
    var grid = document.createElement("div");
    grid.className = "word-wall";
    WORD_ROWS.forEach(function (row) {
      var c = document.createElement("div");
      c.className = "word-card";
      c.setAttribute("role", "button");
      c.setAttribute("tabindex", "0");
      c.setAttribute("aria-expanded", "false");
      c.setAttribute("aria-label", "原级 " + row[0] + "，点击查看比较级与最高级");

      var lemma = document.createElement("div");
      lemma.className = "word-card__lemma";
      lemma.innerHTML = "<em>" + escapeHtml(row[0]) + "</em>";

      var rest = document.createElement("div");
      rest.className = "word-card__rest";
      rest.innerHTML = escapeHtml(row[1]) + " → <strong>" + escapeHtml(row[2]) + "</strong>";

      var hint = document.createElement("div");
      hint.className = "word-card__hint";
      hint.textContent = "\u70b9\u51fb\u663e\u793a\u6bd4\u8f83\u7ea7 / \u6700\u9ad8\u7ea7";

      c.appendChild(lemma);
      c.appendChild(rest);
      c.appendChild(hint);

      function toggleCard(ev) {
        if (ev) ev.preventDefault();
        var open = c.classList.toggle("is-open");
        c.setAttribute("aria-expanded", open ? "true" : "false");
      }
      c.addEventListener("click", toggleCard);
      c.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          toggleCard();
        }
      });

      grid.appendChild(c);
    });
    root.appendChild(grid);
    var row = document.createElement("div");
    row.className = "btn-row word-wall-footer";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.textContent = "进入分类练习 \u2192";
    b.addEventListener("click", function () {
      phase = "classify";
      classifyDone = false;
      render();
    });
    row.appendChild(b);
    root.appendChild(row);
  }

  function attachDragChip(chip, bankEl, findBin, bins) {
    chip.addEventListener("pointerdown", function (ev) {
      if (chip.parentElement !== bankEl && !chip.parentElement.classList.contains("bin")) return;
      ev.preventDefault();
      chip.classList.add("dragging");
      var r = chip.getBoundingClientRect();
      dragState = {
        el: chip,
        id: ev.pointerId,
        ox: ev.clientX - r.left,
        oy: ev.clientY - r.top,
        bank: bankEl
      };
      var parent = chip.parentElement;
      if (parent.classList.contains("bin")) parent.dataset.items = String(Math.max(0, (parseInt(parent.dataset.items, 10) || 0) - 1));
      chip.style.position = "fixed";
      chip.style.left = ev.clientX - dragState.ox + "px";
      chip.style.top = ev.clientY - dragState.oy + "px";
      chip.style.zIndex = "400";
      document.body.appendChild(chip);
      docMoveRef = function (e) {
        if (!dragState || e.pointerId !== dragState.id) return;
        dragState.el.style.left = e.clientX - dragState.ox + "px";
        dragState.el.style.top = e.clientY - dragState.oy + "px";
      };
      docUpRef = function (e) {
        if (!dragState || e.pointerId !== dragState.id) return;
        var el = dragState.el;
        var bin = findBin(e.clientX, e.clientY, bins);
        el.classList.remove("dragging");
        el.style.position = "";
        el.style.left = "";
        el.style.top = "";
        el.style.zIndex = "";
        if (bin) {
          bin.appendChild(el);
          bin.dataset.items = String((parseInt(bin.dataset.items, 10) || 0) + 1);
        } else bankEl.appendChild(el);
        clearDrag();
      };
      document.addEventListener("pointermove", docMoveRef);
      document.addEventListener("pointerup", docUpRef);
      document.addEventListener("pointercancel", docUpRef);
      try {
        chip.setPointerCapture(ev.pointerId);
      } catch (e2) {}
    });
  }

  function renderClassify(root) {
    clearDrag();
    var h = document.createElement("h2");
    h.textContent = "分类挑战 · 把词语拖进正确篮子";
    root.appendChild(h);
    var p = document.createElement("p");
    p.className = "cn-lead";
    p.textContent = "提示：无等级词（favourite 等）放进最后一栏。";
    root.appendChild(p);

    var grid = document.createElement("div");
    grid.className = "classify-grid";
    var bins = {};
    ["est", "most", "irr", "none"].forEach(function (key) {
      var d = document.createElement("div");
      d.className = "bin";
      d.dataset.bin = key;
      d.dataset.items = "0";
      d.innerHTML = "<h4>" + BIN_LABEL[key] + "</h4>";
      grid.appendChild(d);
      bins[key] = d;
    });
    root.appendChild(grid);

    var bank = document.createElement("div");
    bank.className = "bank";
    shuffle(CLASSIFY_CHIPS).forEach(function (item) {
      var c = document.createElement("div");
      c.className = "chip";
      c.textContent = item.w;
      c.dataset.bin = item.bin;
      bank.appendChild(c);
      attachDragChip(c, bank, function (cx, cy, bmap) {
        var hit = null;
        ["est", "most", "irr", "none"].forEach(function (k) {
          var r = bmap[k].getBoundingClientRect();
          if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) hit = bmap[k];
        });
        return hit;
      }, bins);
    });
    root.appendChild(bank);

    var row = document.createElement("div");
    row.className = "btn-row";
    var chk = document.createElement("button");
    chk.type = "button";
    chk.className = "primary";
    chk.textContent = "检查分类";
    chk.addEventListener("click", function () {
      if (bank.querySelectorAll(".chip").length > 0) {
        showToast("请先把所有词块拖进篮子。", false);
        return;
      }
      var ok = true;
      ["est", "most", "irr", "none"].forEach(function (k) {
        var bin = bins[k];
        bin.querySelectorAll(".chip").forEach(function (ch) {
          if (ch.dataset.bin !== k) ok = false;
        });
      });
      if (!ok) {
        showToast("有的词进错篮子了，想一想 -est / most / 不规则 / 无等级。", false);
        return;
      }
      classifyDone = true;
      showToast("\u2713 分类正确！", true);
    });
    row.appendChild(chk);
    var nx = document.createElement("button");
    nx.type = "button";
    nx.className = "ghost";
    nx.textContent = "进入分层练习 \u2192";
    nx.addEventListener("click", function () {
      phase = "practice";
      prTier = "easy";
      prIdx = 0;
      render();
      playPracticeListen();
    });
    row.appendChild(nx);
    root.appendChild(row);
  }

  function playPracticeListen() {
    if (phase !== "practice") return;
    var arr = prTier === "easy" ? PR_E : prTier === "medium" ? PR_M : PR_H;
    var item = arr[prIdx];
    if (item.listen) speakLesson(item.listen);
  }

  function renderPractice(root) {
    var arr = prTier === "easy" ? PR_E : prTier === "medium" ? PR_M : PR_H;
    var item = arr[prIdx];
    var h = document.createElement("h2");
    h.textContent = "分层练习";
    root.appendChild(h);
    var tier = document.createElement("div");
    tier.className = "practice-tier";
    tier.textContent =
      (item.zh ? item.zh + " · " : "") +
      (prTier === "easy" ? "\u2605 基础（辨结构）" : prTier === "medium" ? "\u2605\u2605 提高（改错）" : "\u2605\u2605\u2605 冲刺（拼写）");
    root.appendChild(tier);

    var rowSound = document.createElement("div");
    rowSound.className = "btn-row";
    var bf = document.createElement("button");
    bf.type = "button";
    bf.className = "speak-fab";
    bf.textContent = "\uD83D\uDD0A";
    bf.addEventListener("click", function () {
      if (item.listen) speakLesson(item.listen);
    });
    rowSound.appendChild(bf);
    var lb = document.createElement("button");
    lb.type = "button";
    lb.className = "ghost";
    lb.textContent = "播放题干朗读";
    lb.addEventListener("click", function () {
      if (item.listen) speakLesson(item.listen);
    });
    rowSound.appendChild(lb);
    root.appendChild(rowSound);

    if (prTier === "hard") {
      var stem = document.createElement("p");
      stem.className = "cn-lead";
      stem.style.fontSize = "1rem";
      stem.innerHTML = escapeHtml(item.stem);
      root.appendChild(stem);
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "cloze-in";
      inp.placeholder = "英文拼写";
      inp.autocomplete = "off";
      root.appendChild(inp);
      var sub = document.createElement("div");
      sub.className = "btn-row";
      var go = document.createElement("button");
      go.type = "button";
      go.className = "primary";
      go.textContent = "提交";
      go.addEventListener("click", function () {
        var v = inp.value.trim().toLowerCase();
        var ok = item.ans.some(function (a) {
          return v === a.toLowerCase();
        });
        if (!ok) {
          showToast("再想想拼写或形式。", false);
          return;
        }
        showToast("\u2713 Great!", true);
        advancePractice();
      });
      sub.appendChild(go);
      root.appendChild(sub);
    } else if (prTier === "medium") {
      var wr = document.createElement("p");
      wr.className = "grammar-box";
      wr.innerHTML = "<strong>\u274c \u539f\u53e5\uff08\u6709\u8bef\uff09\uff1a</strong><br />" + escapeHtml(item.wrong);
      root.appendChild(wr);
      var qq = document.createElement("p");
      qq.className = "cn-lead";
      qq.textContent = item.q;
      root.appendChild(qq);
      item.opts.forEach(function (opt, i) {
        var o = document.createElement("button");
        o.type = "button";
        o.className = "mc-opt";
        o.textContent = String.fromCharCode(65 + i) + ". " + opt;
        o.addEventListener("click", function () {
          root.querySelectorAll(".mc-opt").forEach(function (x) {
            x.classList.remove("ok", "bad");
          });
          if (i === item.ok) {
            o.classList.add("ok");
            showToast("\u2713 正确！", true);
            window.setTimeout(advancePractice, 500);
          } else {
            o.classList.add("bad");
            showToast(item.tip || "\u518d\u8bd5\u4e00\u6b21", false);
          }
        });
        root.appendChild(o);
      });
    } else {
      var qq = document.createElement("p");
      qq.className = "cn-lead";
      qq.style.fontSize = "0.95rem";
      qq.textContent = item.q;
      root.appendChild(qq);
      item.opts.forEach(function (opt, i) {
        var o = document.createElement("button");
        o.type = "button";
        o.className = "mc-opt";
        o.textContent = String.fromCharCode(65 + i) + ". " + opt;
        o.addEventListener("click", function () {
          root.querySelectorAll(".mc-opt").forEach(function (x) {
            x.classList.remove("ok", "bad");
          });
          if (i === item.ok) {
            o.classList.add("ok");
            showToast("\u2713 正确！", true);
            window.setTimeout(advancePractice, 500);
          } else {
            o.classList.add("bad");
            showToast(item.tip || "\u518d\u8bd5\u4e00\u6b21", false);
          }
        });
        root.appendChild(o);
      });
    }

    var tip = document.createElement("p");
    tip.className = "cn-lead";
    tip.style.fontSize = "0.78rem";
    tip.style.opacity = "0.85";
    tip.textContent = "\u63d0\u793a\uff1a" + (item.tip || "");
    root.appendChild(tip);

    var nav = document.createElement("div");
    nav.className = "btn-row";
    if (prIdx > 0 || prTier !== "easy") {
      var prev = document.createElement("button");
      prev.type = "button";
      prev.className = "ghost";
      prev.textContent = "\u2190 \u4e0a\u4e00\u9898";
      prev.addEventListener("click", function () {
        if (prIdx > 0) prIdx--;
        else if (prTier === "medium") {
          prTier = "easy";
          prIdx = PR_E.length - 1;
        } else if (prTier === "hard") {
          prTier = "medium";
          prIdx = PR_M.length - 1;
        }
        render();
        playPracticeListen();
      });
      nav.appendChild(prev);
    }
    root.appendChild(nav);

    window.setTimeout(playPracticeListen, 400);
  }

  function advancePractice() {
    var arr = prTier === "easy" ? PR_E : prTier === "medium" ? PR_M : PR_H;
    if (prIdx < arr.length - 1) {
      prIdx++;
      render();
      return;
    }
    if (prTier === "easy") {
      prTier = "medium";
      prIdx = 0;
      render();
      return;
    }
    if (prTier === "medium") {
      prTier = "hard";
      prIdx = 0;
      render();
      return;
    }
    phase = "done";
    render();
    speakLesson("Congratulations! You have finished superlative practice for zhongkao level.");
  }

  function renderDone(root) {
    root.innerHTML =
      "<h2>\u2728 \u672c\u9875\u5b8c\u6210</h2><p class=\"cn-lead\">\u4f60\u5df2\u638c\u63e1\uff1a<strong>\u4e09\u8005\u53ca\u4ee5\u4e0a\u6bd4\u8f83</strong>\u3001<strong>one of the + \u6700\u9ad8\u7ea7</strong>\u3001<strong>the + \u6700\u9ad8\u7ea7 + of</strong>\uff0c\u5e76\u5b8c\u6210\u8bcd\u5f62\u5f52\u7eb3\u4e0e\u5206\u5c42\u7ec3\u4e60\u3002</p>";
    var row = document.createElement("div");
    row.className = "btn-row";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.textContent = "\u518d\u542c\u603b\u7ed3\u6717\u8bfb";
    b.addEventListener("click", function () {
      speakLesson(
        "Superlatives are used when we compare three or more things. Use one of the plus superlative plus plural noun, or the plus superlative plus of plus group."
      );
    });
    row.appendChild(b);
    root.appendChild(row);
  }

  render();
})();
