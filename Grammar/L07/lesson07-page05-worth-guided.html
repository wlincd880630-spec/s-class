  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;

  function clearDragListeners() {
    if (docMoveRef) {
      document.removeEventListener("pointermove", docMoveRef);
      document.removeEventListener("pointerup", docUpRef);
      document.removeEventListener("pointercancel", docUpRef);
      docMoveRef = docUpRef = null;
    }
    dragState = null;
  }

  function attachDrag(chip, bankEl, slotFinder) {
    chip.addEventListener("pointerdown", function (ev) {
      var parent = chip.parentElement;
      var okParent =
        parent === bankEl ||
        parent.classList.contains("sent-slot");
      if (!okParent) return;
      ev.preventDefault();
      chip.classList.add("dragging");
      var r = chip.getBoundingClientRect();
      dragState = {
        el: chip,
        id: ev.pointerId,
        ox: ev.clientX - r.left,
        oy: ev.clientY - r.top,
        bank: bankEl,
        fromSlot: parent.classList.contains("sent-slot") ? parent : null
      };
      if (dragState.fromSlot) dragState.fromSlot.classList.remove("filled");
      chip.style.position = "fixed";
      chip.style.left = ev.clientX - dragState.ox + "px";
      chip.style.top = ev.clientY - dragState.oy + "px";
      chip.style.zIndex = "400";
      document.body.appendChild(chip);
      docMoveRef = function (e) {
        if (!dragState || e.pointerId !== dragState.id) return;
        dragState.el.style.left = e.clientX - dragState.ox + "px";
        dragState.el.style.top = e.clientY - dragState.oy + "px";
      };
      docUpRef = function (e) {
        if (!dragState || e.pointerId !== dragState.id) return;
        var el = dragState.el;
        try { el.releasePointerCapture(e.pointerId); } catch (err) {}
        var slot = slotFinder(e.clientX, e.clientY, el);
        if (slot) {
          el.style.position = "relative";
          el.style.left = "auto";
          el.style.top = "auto";
          el.style.zIndex = "";
          el.classList.remove("dragging");
          slot.appendChild(el);
          slot.classList.add("filled");
        } else {
          el.classList.remove("dragging");
          el.style.position = "relative";
          el.style.left = "auto";
          el.style.top = "auto";
          el.style.zIndex = "";
          bankEl.appendChild(el);
          sentSlots.forEach(function (s) {
            if (!s.querySelector(".drag-chip")) s.classList.remove("filled");
          });
        }
        clearDragListeners();
      };
      document.addEventListener("pointermove", docMoveRef);
      document.addEventListener("pointerup", docUpRef);
      document.addEventListener("pointercancel", docUpRef);
      try { chip.setPointerCapture(ev.pointerId); } catch (e2) {}
    });
  }

  function nearestSentSlot(cx, cy, usedSlot) {
    var best = null;
    var bestD = 1e9;
    sentSlots.forEach(function (s) {
      if (s === usedSlot) return;
      if (s.querySelector(".drag-chip")) return;
      var r = s.getBoundingClientRect();
      if (cx < r.left - 16 || cx > r.right + 16 || cy < r.top - 20 || cy > r.bottom + 20) return;
      var mx = (r.left + r.right) / 2;
      var my = (r.top + r.bottom) / 2;
      var d = (cx - mx) * (cx - mx) + (cy - my) * (cy - my);
      if (d < bestD) { bestD = d; best = s; }
    });
    return best;
  }

    b.style.margin = "0 auto";
    b.style.display = "block";
    b.textContent = "进入情景一 →";
    b.addEventListener("click", function () {
      sceneI = 0;
      guideStep = 0;
      guideUnlocked = 0;
      render();
    });
    root.appendChild(b);
  }

  function renderScene(root) {
    var S = SCENES[sceneI];
    var h = document.createElement("h2");
    h.textContent = S.title;
    root.appendChild(h);

    var dots = document.createElement("div");
    dots.className = "scene-dots";
    for (var d = 0; d < SCENES.length; d++) {
      var dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", "情景 " + (d + 1));
      if (d === sceneI) dot.classList.add("is-active");
      if (doneScenes[d]) dot.classList.add("is-done");
      (function (idx) {
        dot.addEventListener("click", function () {
          sceneI = idx;
          guideStep = 0;
          guideUnlocked = doneScenes[idx] ? SCENES[idx].guides.length : 0;
          render();
        });
      })(d);
      dots.appendChild(dot);
    }
    root.appendChild(dots);

    var layout = document.createElement("div");
    layout.className = "scene-layout";

    var imgWrap = document.createElement("div");
    imgWrap.className = "scene-img-wrap";
    var img = document.createElement("img");
    img.src = imgUrl(S.img);
    img.alt = S.alt;
    img.loading = "lazy";
    img.onerror = function () {
      if (img.dataset.fallback !== "1") {
        img.dataset.fallback = "1";
        img.src = IMG_COS + S.img;
      }
    };
    imgWrap.appendChild(img);

    var guideCol = document.createElement("div");
    guideCol.className = "guide-col";

    S.guides.forEach(function (g, gi) {
      var step = document.createElement("div");
      step.className = "guide-step";
      if (gi === guideStep) step.classList.add("is-current");
      if (gi < guideStep) step.classList.add("is-done");
      step.innerHTML =
        "<div class=\"step-tag\">引导 " + (gi + 1) + "/" + S.guides.length + "</div>" +
        "<p class=\"step-q\">" + g.q + "</p>" +
        "<p class=\"step-hint" + (gi <= guideUnlocked ? "" : " hidden") + "\">💡 " + g.hint + "</p>";
      if (g.worthTip && gi <= guideUnlocked) {
        var tag = document.createElement("span");
        tag.className = "worth-tag";
        tag.textContent = g.worthTip;
        step.appendChild(tag);
      }
      guideCol.appendChild(step);
    });

    var btnGuide = document.createElement("div");
    btnGuide.className = "btn-row";
    if (guideUnlocked < S.guides.length) {
      var btnReveal = document.createElement("button");
      btnReveal.type = "button";
      btnReveal.className = "ghost";
      btnReveal.textContent =
        guideUnlocked <= guideStep ? "我想好了 · 显示本步提示" : "显示本步提示";
      btnReveal.addEventListener("click", function () {
        if (guideUnlocked <= guideStep) guideUnlocked = guideStep + 1;
        if (guideUnlocked >= S.guides.length) {
          showToast("提示已全部显示 · 请在下方拼出完整句", true);
        }
        render();
      });
      btnGuide.appendChild(btnReveal);
    } else {
      var doneTag = document.createElement("span");
      doneTag.style.fontSize = "0.84rem";
      doneTag.style.color = "var(--mint)";
      doneTag.textContent = "✓ 引导完成 · 请在下方向下拼句";
      btnGuide.appendChild(doneTag);
    }
    if (guideStep < S.guides.length - 1 && guideUnlocked > guideStep) {
      var btnNext = document.createElement("button");
      btnNext.type = "button";
      btnNext.className = "primary";
      btnNext.textContent = "下一问 →";
      btnNext.addEventListener("click", function () {
        guideStep++;
        render();
      });
      btnGuide.appendChild(btnNext);
    }
    var btnOral = document.createElement("button");
    btnOral.type = "button";
    btnOral.className = "speak";
    btnOral.setAttribute("aria-label", "朗读 Oral question");
    btnOral.textContent = "\uD83D\uDD0A";
    btnOral.addEventListener("click", function () { speak(S.oralQ); });
    btnGuide.appendChild(btnOral);
    guideCol.appendChild(btnGuide);

    var buildReady = guideUnlocked >= S.guides.length;
    var buildZone = document.createElement("div");
    buildZone.className = "build-zone" + (buildReady ? "" : " hidden");
    buildZone.innerHTML =
      "<h3>✍ 拼出完整句</h3>" +
      "<p class=\"build-prompt\">根据引导，把下方词块拖入横线，组成正确的 <strong>worth more than</strong> 比较句。</p>";

    var slotsWrap = document.createElement("div");
    slotsWrap.className = "sent-slots";
    sentSlots = [];
    S.chunks.forEach(function () {
      var slot = document.createElement("div");
      slot.className = "sent-slot";
      slotsWrap.appendChild(slot);
      sentSlots.push(slot);
    });
    buildZone.appendChild(slotsWrap);

    var bank = document.createElement("div");
    bank.className = "bank";
    shuffle(S.chunks).forEach(function (tok) {
      var c = document.createElement("div");
      c.className = "drag-chip";
      c.textContent = tok;
      c.dataset.text = tok;
      bank.appendChild(c);
      attachDrag(c, bank, function (cx, cy) { return nearestSentSlot(cx, cy); });
    });
    buildZone.appendChild(bank);

    var model = document.createElement("div");
    model.className = "model-answer";
    model.id = "model-answer";
    model.innerHTML = "<strong>参考句：</strong>" + escapeHtml(S.target).replace(
      /worth more than/g,
      "<span class=\"cmp-highlight\">worth more than</span>"
    );
    buildZone.appendChild(model);

    var actions = document.createElement("div");
    actions.className = "btn-row";
    var btnCheck = document.createElement("button");
    btnCheck.type = "button";
    btnCheck.className = "primary";
    btnCheck.textContent = "检查我的句子";
    btnCheck.addEventListener("click", function () {
      var ok = true;
      for (var i = 0; i < sentSlots.length; i++) {
        var ch = sentSlots[i].querySelector(".drag-chip");
        if (!ch || ch.dataset.text !== S.chunks[i]) ok = false;
      }
      if (!ok) {
        showToast("顺序还不对：注意 worth more than 结构与左右/this-that 指代。", false);
        return;
      }
      doneScenes[sceneI] = true;
      document.getElementById("model-answer").classList.add("show");
      showToast("Great! 句子正确。", true);
      speak(S.target);
    });
    actions.appendChild(btnCheck);
    var btnSpeak = document.createElement("button");
    btnSpeak.type = "button";
    btnSpeak.className = "speak";
    btnSpeak.textContent = "\uD83D\uDD0A";
    btnSpeak.addEventListener("click", function () { speak(S.target); });
    actions.appendChild(btnSpeak);
    if (sceneI < SCENES.length - 1) {
      var btnScene = document.createElement("button");
      btnScene.type = "button";
      btnScene.className = "ghost";
      btnScene.textContent = "下一场景 →";
      btnScene.addEventListener("click", function () {
        sceneI++;
        guideStep = 0;
        guideUnlocked = 0;
        render();
      });
      actions.appendChild(btnScene);
    } else {
      var btnFinish = document.createElement("button");
      btnFinish.type = "button";
      btnFinish.className = "primary";
      btnFinish.textContent = "完成三句练习";
      btnFinish.addEventListener("click", function () {
        sceneI = SCENES.length;
        render();
      });
      actions.appendChild(btnFinish);
    }
    buildZone.appendChild(actions);
    guideCol.appendChild(buildZone);

    layout.appendChild(imgWrap);
    layout.appendChild(guideCol);
    root.appendChild(layout);

    if (buildReady && guideStep === S.guides.length - 1) {
      speak(S.oralQ);
    }
  }

  function renderDone(root) {
    root.innerHTML =
      "<div class=\"intro-card\">" +
      "<h2>✨ 三句练习完成</h2>" +
      "<p>你已用三个情景掌握 <strong>worth more than</strong>：</p>" +
      "<ol style=\"text-align:left;max-width:520px;margin:12px auto;line-height:1.65;\">" +
      "<li>The old stamp on the left is worth more than the silver coin on the right.</li>" +
      "<li>Good health is worth more than anything else in the world.</li>" +
      "<li>This second-hand dictionary is worth more than that new notebook.</li>" +
      "</ol>" +
      "<p>回到 <a href=\"lesson07-page05-more-comparative.html\" style=\"color:var(--gold)\">more + 形容词</a> 继续本课。</p>" +
      "</div>";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.style.display = "block";
    b.style.margin = "0 auto";
    b.textContent = "再练一遍";
    b.addEventListener("click", function () {
      sceneI = 0;
      guideStep = 0;
      guideUnlocked = 0;
      doneScenes = [false, false, false];
      render();
    });
    root.appendChild(b);
  }

  render();
})();
  </script>
