  window.fetchDeepSeekEvaluation = async function (payload) {
    var key = String(window.__DEEPSEEK_API_KEY__ || "").trim();
    if (!key) return { ok: false, error: "no_api_key" };
    var res = await fetch("https://api.deepseek.com/v1/chat/completions", {

    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data: data };
  };

  var L07_MEDIA_ROOT =
    "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L07/";

  function applySceneImage() {

    var sc = SCENARIOS[roundIndex];
    if (img && sc && sc.sceneImg) {

    },

    },

    }
  ];

  var roundIndex = 0;
  var slotEls = [];
  var audioBusy = false;
  var timers = [];
  var beamRotation = 0;

  function setDebug(t) {
    var el = document.getElementById("debug-strip");
    if (el) el.textContent = t;
  }

  function lock(on) {
    var L = document.getElementById("interaction-lock");
    if (L) L.classList.toggle("on", !!on);
  }

  function stopVoice() {
    try {
      if (typeof window.stopLessonL07LocalTts === "function") window.stopLessonL07LocalTts();
    } catch (e) {}
    audioBusy = false;
  }

  function speakChristopherExcited(plainSentence) {
    if (audioBusy) return Promise.resolve(false);
    var plain = String(plainSentence || "").trim();
    if (!plain || typeof window.playLessonL07LocalTts !== "function") return Promise.resolve(false);
    audioBusy = true;
    return window.playLessonL07LocalTts(plain).then(function (ok) {
      audioBusy = false;
      return !!ok;
    });
  }

  function showToast(msg, ms) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    var tid = window.setTimeout(function () {
      el.classList.remove("show");
    }, ms || 2200);
    timers.push(tid);
  }

  function clearParticles() {
    var layer = document.getElementById("particle-layer");
    if (!layer) return;
    while (layer.firstChild) layer.removeChild(layer.firstChild);
  }

  function spawnParticles(color, n, cx, cy) {
    var layer = document.getElementById("particle-layer");
    if (!layer || !window.anime) return;
    for (var i = 0; i < n; i++) {
      (function () {
        var p = document.createElement("div");
        p.style.cssText =
          "position:absolute;left:" + cx + "px;top:" + cy + "px;width:6px;height:6px;border-radius:50%;background:" + color + ";pointer-events:none;";
        layer.appendChild(p);
        window.anime({
          targets: p,
          translateX: (Math.random() - 0.5) * 160,
          translateY: (Math.random() - 0.5) * 160,
          opacity: [1, 0],
          scale: [1, 0.2],
          duration: 600 + Math.random() * 400,
          easing: "easeOutQuad",
          complete: function () {
            try {
              if (p.parentNode) p.parentNode.removeChild(p);
            } catch (e) {}
          }
        });
      })();
    }
  }

  function shakeRow() {
    var wrap = document.getElementById("slot-wrap");
    if (wrap && window.anime) {
      window.anime({
        targets: wrap,
        translateX: [0, -10, 10, -8, 8, 0],
        duration: 420,
        easing: "easeInOutQuad"
      });
    }
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "square";
      o.frequency.value = 140;
      g.gain.value = 0.06;
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  function valueForEntity(sc, text) {
    var t = String(text || "").trim();
    if (t === sc.left.text) return sc.left.value;
    if (t === sc.right.text) return sc.right.value;
    if (sc.altWrongObj && t === sc.altWrongObj) return sc.right.value;
    return null;
  }

  function semanticOk(sc, subject, cmp, object) {
    var sv = valueForEntity(sc, subject);
    var ov = valueForEntity(sc, object);
    if (sv == null || ov == null) return false;
    if (sc.requireParallel && object === sc.altWrongObj) return false;

    switch (cmp) {
      case "heavier":
        return sv > ov;
      case "lighter":
        return sv < ov;
      case "faster":
        return sv > ov;
      case "slower":
        return sv < ov;
      case "older":
        return sv > ov;
      case "younger":
        return sv < ov;
      case "colder":
        return sv < ov;
      case "hotter":
        return sv > ov;
      case "bigger":
        return sv > ov;
      case "smaller":
        return sv < ov;
      default:
        return false;
    }
  }

  function syntaxOk(sc, orderedRoles, orderedTexts) {
    if (orderedRoles.length !== 5) return false;
    if (orderedRoles[0] !== "nom" || orderedRoles[1] !== "be" || orderedRoles[2] !== "cmp" || orderedRoles[3] !== "than" || orderedRoles[4] !== "nom")
      return false;
    if (orderedTexts[1] !== "is" && orderedTexts[1] !== "are") return false;
    if (orderedTexts[3] !== "than") return false;
    if (sc.cmps.indexOf(orderedTexts[2]) < 0) return false;
    var subj = orderedTexts[0];
    var obj = orderedTexts[4];
    if (subj !== sc.left.text && subj !== sc.right.text) return false;
    if (sc.requireParallel) {
      if (obj !== sc.right.text) return false;
    } else {
      if (obj !== sc.left.text && obj !== sc.right.text) return false;
    }
    return true;
  }

  function buildOrderedFromSlots() {
    var roles = [];
    var texts = [];
    for (var i = 0; i < slotEls.length; i++) {
      var h = slotEls[i].querySelector(".word-block");
      if (!h) return { ok: false };
      roles.push(h.dataset.role || "");
      texts.push((h.textContent || "").trim());
    }
    return { ok: true, roles: roles, texts: texts };
  }

  function allSlotsFilled() {
    for (var i = 0; i < slotEls.length; i++) {
      if (!slotEls[i].querySelector(".word-block")) return false;
    }
    return true;
  }

  function updateValidateBtn() {
    var b = document.getElementById("btn-validate");
    if (!b) return;
    b.classList.toggle("show", allSlotsFilled());
  }

  function snapSceneUpright() {
    var wrap = document.getElementById("scene-visual-wrap");
    if (wrap && window.anime) {
      try {
        window.anime.remove(wrap);
      } catch (e) {}
    }
    beamRotation = 0;
    if (wrap) {
      wrap.style.transform = "rotate(0deg)";
    }
  }

  function setBeamAngle(deg, duration) {
    var wrap = document.getElementById("scene-visual-wrap");
    if (!wrap) return;
    if (window.anime) {
      try {
        window.anime.remove(wrap);
      } catch (e) {}
    }
    beamRotation = deg;
    if (!window.anime) {
      wrap.style.transform = "rotate(" + deg + "deg)";
      return;
    }
    window.anime({
      targets: wrap,
      rotate: deg,
      duration: duration || 900,
      easing: "easeOutElastic(1, .65)"
    });
  }

  function resetBeam() {
    snapSceneUpright();
  }

  function animateScaleForSuccess(sc, orderedTexts) {
    var subj = orderedTexts[0];
    var cmp = orderedTexts[2];
    var sv = valueForEntity(sc, subj);
    var ov = valueForEntity(sc, orderedTexts[4]);
    var diff = (sv != null && ov != null) ? (sv - ov) : 0;
    var mag = Math.min(18, Math.max(-18, diff / (Math.abs(sv) + Math.abs(ov) + 1) * 40));
    if (cmp === "lighter" || cmp === "slower" || cmp === "younger" || cmp === "colder" || cmp === "smaller") mag *= -1;
    setBeamAngle(mag, 1000);
  }

  function animateScaleJam() {
    var wrap = document.getElementById("scene-visual-wrap");
    if (!wrap) return;
    if (window.anime) {
      try {
        window.anime.remove(wrap);
      } catch (e) {}
      window.anime({
        targets: wrap,
        rotate: [0, 7, -9, 5, 0],
        duration: 700,
        easing: "easeInOutQuad"
      });
    }
    var rect = document.getElementById("scale-stage").getBoundingClientRect();
    spawnParticles("#e53935", 28, rect.left + rect.width / 2, rect.top + rect.height * 0.45);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function clearBank() {
    var bank = document.getElementById("block-bank");
    if (!bank) return;
    bank.innerHTML = "";
  }

  function firstEmptySlot() {
    for (var i = 0; i < slotEls.length; i++) {
      if (!slotEls[i].querySelector(".word-block")) return slotEls[i];
    }
    return null;
  }

  function markChipPlacement(el) {
    var bank = document.getElementById("block-bank");
    if (!bank || !el) return;
    if (el.parentElement === bank) {
      el.classList.add("in-bank");
      el.classList.remove("in-slot");
    } else {
      el.classList.remove("in-bank");
      el.classList.add("in-slot");
    }
  }

  function moveChipToNextSlot(chip) {
    if (phaseLocked()) return;
    if (!chip || !chip.classList.contains("word-block")) return;
    if (chip.parentElement && chip.parentElement.classList.contains("slot")) return;
    var slot = firstEmptySlot();
    if (!slot) {
      showToast("五个槽位已满，可点击槽内积木撤回，或点「清空重排」。", 2200);
      return;
    }
    slot.appendChild(chip);
    slot.classList.add("filled");
    markChipPlacement(chip);
    if (window.anime) {
      window.anime({ targets: chip, scale: [1.12, 1], duration: 220, easing: "easeOutQuad" });
    }
    updateValidateBtn();
  }

  function returnChipFromSlot(slotEl) {
    if (phaseLocked()) return;
    var chip = slotEl.querySelector(".word-block");
    if (!chip) return;
    var bank = document.getElementById("block-bank");
    slotEl.classList.remove("filled");
    bank.appendChild(chip);
    markChipPlacement(chip);
    updateValidateBtn();
  }

  function clearAllSlotsToBank() {
    if (phaseLocked()) return;
    var bank = document.getElementById("block-bank");
    slotEls.forEach(function (slotEl) {
      var chip = slotEl.querySelector(".word-block");
      if (chip) {
        slotEl.classList.remove("filled");
        bank.appendChild(chip);
        markChipPlacement(chip);
      }
    });
    updateValidateBtn();
  }

  function onSlotClick(ev) {
    var slotEl = ev.currentTarget;
    if (!slotEl.classList.contains("slot")) return;
    if (slotEl.querySelector(".word-block")) {
      ev.stopPropagation();
      returnChipFromSlot(slotEl);
    }
  }

  function onWordChipClick(ev) {
    var chip = ev.currentTarget;
    if (!chip.classList.contains("word-block")) return;
    if (chip.parentElement && chip.parentElement.classList.contains("slot")) {
      ev.stopPropagation();
      returnChipFromSlot(chip.parentElement);
      return;
    }
    if (chip.parentElement && chip.parentElement.id !== "block-bank") return;
    ev.stopPropagation();
    moveChipToNextSlot(chip);
  }

  var finaleShown = false;
  function phaseLocked() {
    return document.getElementById("interaction-lock").classList.contains("on") || finaleShown;
  }

  function renderRound() {
    snapSceneUpright();
    clearBank();
    slotEls = [];
    var wrap = document.getElementById("slot-wrap");
    wrap.innerHTML = "";
    var sc = SCENARIOS[roundIndex];
    document.getElementById("round-pill").textContent = "场景 " + (roundIndex + 1) + " / 5 · " + sc.title;
    applySceneImage();
    setDebug("写实场景图：" + (sc.sceneImg || "").split("/").pop());

    var bankData = [
      { text: sc.left.text, role: "nom" },
      { text: sc.right.text, role: "nom" },
      { text: "is", role: "be" },
      { text: sc.cmps[0], role: "cmp" },
      { text: sc.cmps[1], role: "cmp" },
      { text: "than", role: "than" }
    ];
    if (sc.altWrongObj) {
      bankData.push({ text: sc.altWrongObj, role: "nom" });
    }

    for (var i = 0; i < 5; i++) {
      var s = document.createElement("div");
      s.className = "slot";
      s.dataset.slotIndex = String(i);
      s.addEventListener("click", onSlotClick);
      wrap.appendChild(s);
      slotEls.push(s);
    }

    shuffle(bankData).forEach(function (b) {
      var el = document.createElement("div");
      var rc = "role-subj";
      if (b.role === "be") rc = "role-be";
      else if (b.role === "cmp") rc = "role-cmp";
      else if (b.role === "than") rc = "role-than";
      else if (String(b.text) === "that in Guangzhou") rc = "role-helper";
      el.className = "word-block in-bank " + rc;
      el.textContent = b.text;
      el.dataset.role = b.role;
      el.dataset.text = b.text;
      el.addEventListener("click", onWordChipClick);
      var bank = document.getElementById("block-bank");
      bank.appendChild(el);
    });

    document.getElementById("btn-validate").classList.remove("show");
    resetBeam();
    updateValidateBtn();
  }

  function sentenceFromSlots() {
    var o = buildOrderedFromSlots();
    if (!o.ok) return "";
    return o.texts.join(" ") + ".";
  }

  function runValidate() {
    if (!allSlotsFilled()) return;
    var sc = SCENARIOS[roundIndex];
    var o = buildOrderedFromSlots();
    if (!o.ok) return;

    if (!syntaxOk(sc, o.roles, o.texts)) {
      shakeRow();
      if (sc.requireParallel && o.texts[4] === sc.altWrongObj) {
        showToast("平行结构破碎：天气要与天气比，请使用 that in …", 2800);
      } else {
        showToast("语法结构破碎：请按 Noun + be + comparative + than + Noun 排列。", 2400);
      }
      return;
    }

    if (!semanticOk(sc, o.texts[0], o.texts[2], o.texts[4])) {
      lock(true);
      animateScaleJam();
      var sent = o.texts.join(" ") + ".";
      fetchDeepSeekTutor(sent).then(function (txt) {
        showTutorBubble(txt || "再想想客观事实与比较级是否一致。");
        lock(false);
      }).catch(function () {
        showTutorBubble("这句话在物理上说不通哦，试着交换主语和宾语，或换一个比较级。");
        lock(false);
      });
      return;
    }

    lock(true);
    animateScaleForSuccess(sc, o.texts);
    var rect = document.getElementById("scale-stage").getBoundingClientRect();
    spawnParticles("#ffd54f", 22, rect.left + rect.width / 2, rect.top + rect.height * 0.5);
    var plain = o.texts.join(" ") + ".";
    speakChristopherExcited(plain).then(
      function () {
        lock(false);
        advanceRound();
      },
      function () {
        lock(false);
        advanceRound();
      }
    );
  }

  function fetchDeepSeekTutor(studentSentence) {
    var sys =
      "You are a humorous but strict physics and logic professor. The student has assembled a grammatically correct English sentence, but it completely violates the laws of physics or objective reality. The student wrote " +
      JSON.stringify(studentSentence) +
      ". Please use Chinese to give a Socratic and highly sarcastic reprimand under sixty words. Ask them if they really believe what they just wrote. For example, if they wrote that a mouse is heavier than an elephant, ask them if their biology teacher is crying right now. Force them to swap the subject and object to fix the logical error.";
    return window
      .fetchDeepSeekEvaluation({
        model: "deepseek-chat",
        messages: [
          { role: "system", content: sys },
          { role: "user", content: "请开始点评。" }
        ],
        temperature: 0.7,
        max_tokens: 220
      })
      .then(function (res) {
        if (!res || !res.ok || !res.data) return "";
        var ch = (res.data.choices && res.data.choices[0] && res.data.choices[0].message && res.data.choices[0].message.content) || "";
        return String(ch).trim();
      });
  }

  var tutorTypeTimer = null;
  function showTutorBubble(full) {
    var bubble = document.getElementById("tutor-bubble");
    var tx = document.getElementById("tutor-text");
    if (tutorTypeTimer) {
      clearInterval(tutorTypeTimer);
      tutorTypeTimer = null;
    }
    tx.textContent = "";
    bubble.classList.add("show");
    var i = 0;
    tutorTypeTimer = setInterval(function () {
      i++;
      tx.textContent = full.slice(0, i);
      if (i >= full.length) {
        clearInterval(tutorTypeTimer);
        tutorTypeTimer = null;
      }
    }, 28);
  }

  function hideTutorBubble() {
    var bubble = document.getElementById("tutor-bubble");
    bubble.classList.remove("show");
    if (tutorTypeTimer) {
      clearInterval(tutorTypeTimer);
      tutorTypeTimer = null;
    }
  }

  function advanceRound() {
    clearParticles();
    roundIndex++;
    if (roundIndex >= SCENARIOS.length) {
      showFinale();
      return;
    }
    if (window.anime) {
      var els = document.querySelectorAll("#slot-wrap .word-block");
      window.anime({
        targets: els,
        opacity: [1, 0],
        translateY: 24,
        duration: 500,
        easing: "easeInQuad",
        complete: function () {
          renderRound();
        }
      });
    } else {
      renderRound();
    }
  }

  function showFinale() {
    finaleShown = true;
    lock(true);
    var white = document.getElementById("finale-white");
    var medal = document.getElementById("grand-medal");
    white.classList.add("flash");
    window.setTimeout(function () {
      white.classList.remove("flash");
      medal.classList.add("show");
      if (window.anime) {
        window.anime({
          targets: "body",
          translateX: [0, -6, 6, -4, 4, 0],
          duration: 600,
          easing: "easeInOutQuad"
        });
      }
      lock(false);
      var nw = document.getElementById("btn-next-wrap");
      window.setTimeout(function () {
        nw.classList.add("show");
      }, 800);
    }, 500);
  }

  document.getElementById("btn-validate").addEventListener("click", runValidate);
  document.getElementById("btn-clear-slots").addEventListener("click", clearAllSlotsToBank);
  document.getElementById("tutor-dismiss").addEventListener("click", hideTutorBubble);
  document.getElementById("btn-next").addEventListener("click", function () {
    window.location.href = "lesson07-page04-twincities.html";
  });

  renderRound();
})();
  </script>
</body>
