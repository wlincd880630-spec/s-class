<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>第04页 · 日常生活语料库</title>
  <link rel="stylesheet" href="../shared/grammar-lesson-pager.css" />
  <link rel="stylesheet" href="assets/l01p-core.css" />
  <script src="../shared/lesson-tts-azure-config.js"></script>
  <script src="assets/l01p-tts.js"></script>
  <script src="assets/l01p-corpus.js"></script>
  <script src="assets/l01p-ui.js" defer></script>
</head>
<body class="has-lesson-pager l01p-page">
  <div class="l01p-wrap">
    <p class="l01p-topbar">小学英语 · 一般现在时 · <strong>第 04 页</strong></p>
    <div class="l01p-progress" aria-hidden="true">
      <span class="done"></span><span class="done"></span><span class="done"></span><span class="here"></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="l01p-hero">
      <span class="l01p-hero-badge">语料库 · 48 句</span>
      <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L01-小学一般现在时/assets/img/daily-routine.png" alt="一天的生活" decoding="async" onerror="this.style.display='none'" />
    </div>

    <div class="l01p-card l01p-card--purple">
      <h1 class="l01p-title">📚 日常生活语料库</h1>
      <p class="l01p-lead">
        按主题分类的实用句子，涵盖早晨、校园、爱好、家庭、饮食和动物。
        点击标签切换主题，点击 🔊 听英式男声慢速朗读。
      </p>
    </div>

    <div class="l01p-card" id="topicMount" data-l01p-mount="topics"></div>

    <div class="l01p-card l01p-card--green">
      <h2 class="l01p-subtitle">📖 全部动词表（30 个）</h2>
      <div class="l01p-grid-4" id="allVerbs" data-l01p-mount="verbs"></div>
    </div>

    <div class="l01p-card l01p-card--blue">
      <h2 class="l01p-subtitle">⏰ 时间词大全</h2>
      <div class="l01p-grid-3" id="allTime"></div>
    </div>
  </div>

  <nav class="lesson-pager is-file-nav" aria-label="页面导航">
    <a class="pager-prev" href="page03-third-person.html">← 上一页</a>
    <a class="pager-logo" href="../index.html" aria-label="课程主页"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/logo2.png" alt="Steven's Class" width="204" height="61" decoding="async" /></a>
    <a class="pager-next" href="page05-negative.html">下一页 →</a>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var mount = document.getElementById("allTime");
      if (!mount || !window.L01pCorpus) return;
      mount.innerHTML = window.L01pCorpus.TIME_WORDS.map(function (t) {
        return '<div class="l01p-chip-card" data-tts="I study English ' + t.en + '."><div class="en">' + t.en + '</div><div class="zh">' + t.zh + '</div></div>';
      }).join("");
      if (window.L01pUI) window.L01pUI.bindTts(mount);
    });
  </script>
</body>
</html>
