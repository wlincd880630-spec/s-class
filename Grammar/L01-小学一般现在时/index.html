<!DOCTYPE html>
<html lang="zh-CN" class="g-index-scaled">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>一般现在时 · 小学版（3–5年级）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
  <link rel="stylesheet" href="../shared/grammar-index.css" />
  <link rel="stylesheet" href="../shared/grammar-index-scale.css" />
  <link rel="stylesheet" href="../shared/grammar-logo.css" />
  <link rel="stylesheet" href="assets/l01p-shell.css" />
  <style>
    body.g-index-scaled {
      background: #0f1419;
      color: #e2e8f0;
      min-height: 100dvh;
      padding: 1rem 1rem 2rem;
    }
    .l01p-index {
      max-width: 720px;
      margin: 0 auto;
    }
    .l01p-index-hero {
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 2px solid rgba(255,255,255,0.08);
    }
    .l01p-index-hero img {
      width: 100%;
      display: block;
      max-height: 200px;
      object-fit: cover;
    }
    .l01p-index h1 {
      font-family: Nunito, system-ui, sans-serif;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 900;
      margin: 0 0 0.35rem;
      color: #fff;
    }
    .l01p-index .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: #fbbf24;
      color: #422006;
      vertical-align: middle;
      margin-left: 0.35rem;
    }
    .l01p-index .intro {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .l01p-index-section {
      margin-bottom: 1rem;
    }
    .l01p-index-section h2 {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fbbf24;
      margin: 0 0 0.45rem;
    }
    .l01p-index ol {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .l01p-index li a {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.85rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .l01p-index li a:hover {
      background: rgba(59,130,246,0.15);
      border-color: rgba(59,130,246,0.35);
    }
    .l01p-index .num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .l01p-index .back {
      margin-top: 1.25rem;
      text-align: center;
    }
    .l01p-index .back a {
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
    }
    .l01p-index .back a:hover { color: #3b82f6; }
    .l01p-features {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }
    .l01p-features span {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
    }
  </style>
  <script src="assets/l01p-data.js"></script>
</head>
<body class="g-index-scaled">
  <main class="l01p-index">
    <p style="text-align:center;margin:0 0 0.75rem">
      <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/logo2.png" alt="Steven's Class" width="160" height="48" decoding="async" style="opacity:0.95" />
    </p>
    <div class="l01p-index-hero">
      <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L01-小学一般现在时/assets/img/l01p-action-vs-state.png" alt="" onerror="this.src='assets/img/l01p-action-vs-state.png'" />
    </div>
    <h1>一般现在时 <span class="badge">小学 3–5 年级</span></h1>
    <p class="intro">专业 ESL 互动课件：声音先行 · 图片先行 · 苏格拉底提问 · 动作/状态辨析 · 看图造句 · 听音排序 · DeepSeek 点词查询</p>
    <div class="l01p-features">
      <span>🔊 声音先行</span>
      <span>🖼 图片先行</span>
      <span>💭 苏格拉底</span>
      <span>⚡ 动态演示</span>
      <span>🧩 看图造句</span>
      <span>🎧 听音排序</span>
      <span>📖 DeepSeek 查词</span>
    </div>
    <div id="l01pIndexMount"></div>
    <p class="back"><a href="../index.html">← 课程总目录</a> · <a href="../L01/index.html">初中版 L01 →</a></p>
  </main>
  <script>
    (function () {
      var mount = document.getElementById("l01pIndexMount");
      if (!mount || !window.L01pData) return;
      var sections = {};
      window.L01pData.pages.forEach(function (p, i) {
        if (!sections[p.section]) sections[p.section] = [];
        sections[p.section].push({ page: p, num: i + 1 });
      });
      var html = "";
      Object.keys(sections).forEach(function (sec) {
        html += '<div class="l01p-index-section"><h2>' + sec + '</h2><ol>';
        sections[sec].forEach(function (item) {
          html += '<li><a href="' + item.page.id + '.html"><span class="num">' + String(item.num).padStart(2, "0") + '</span><span>' + item.page.title + '</span></a></li>';
        });
        html += "</ol></div>";
      });
      mount.innerHTML = html;
    })();
  </script>
</body>
</html>
