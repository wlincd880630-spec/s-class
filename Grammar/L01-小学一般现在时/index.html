    .l01p-index-hero{border-radius:16px;overflow:hidden;margin-bottom:1rem;border:4px solid #f0ad4e;background:#fff9f0;display:flex;align-items:center;justify-content:center;min-height:160px}
    .l01p-index-hero img{width:100%;max-height:220px;object-fit:contain;display:block}
    .l01p-features{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
    .l01p-features span{font-size:.7rem;font-weight:800;padding:.2rem .5rem;border-radius:999px;background:rgba(255,255,255,.65);color:#444;border:2px solid rgba(0,0,0,.08)}

    .l01p-index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}

    .l01p-index .num{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4a90d9,#9b59b6);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
    .l01p-index .back{margin-top:1.2rem;text-align:center}
    .l01p-index .back a{color:#5a5a5a;font-weight:700;text-decoration:none;font-size:.88rem}

    <div class="l01p-index-hero"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L01-小学一般现在时/assets/img/l01p-action-vs-be.png" alt="" onerror="this.src='assets/img/l01p-action-vs-be.png'"/></div>

      <span>🏫 地名/物品</span><span>📖 50+ 题库</span><span>⏱ 限时挑战</span><span>🔥 连对闯关</span>
      <span>📝 课堂套题</span><span>🔗 配对游戏</span><span>🎧 听音快选</span>

    <div id="l01pIndexMount"></div>
    <p class="back"><a href="../index.html">← 课程总目录</a> · <a href="../index.html#groupPrimary">小学语法分区</a> · <a href="../L03-小学一般过去时/index.html">小学过去时 →</a></p>
  </main>
  <script>
    (function(){
      var m=document.getElementById("l01pIndexMount");if(!m||!window.L01pData)return;
      var sec={};window.L01pData.pages.forEach(function(p,i){if(!sec[p.section])sec[p.section]=[];sec[p.section].push({p:p,n:i+1});});
      var h="";Object.keys(sec).forEach(function(s){h+='<div class="l01p-index-section"><h2>'+s+'</h2><ol>';sec[s].forEach(function(x){h+='<li><a href="'+x.p.id+'.html"><span class="num">'+String(x.n).padStart(2,"0")+'</span><span>'+x.p.title+'</span></a></li>';});h+='</ol></div>';});
      m.innerHTML=h;
    })();
  </script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>

</html>
