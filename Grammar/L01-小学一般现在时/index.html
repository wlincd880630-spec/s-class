<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>一般现在时 · 小学版（3–5年级）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
  <link rel="stylesheet" href="assets/l01p-shell.css" />
  <link rel="stylesheet" href="assets/l01p-pager.css" />
  <style>
    body.l01p-index-body{margin:0;min-height:100dvh;padding:1rem 1rem 2rem;background:#070b12;color:#e2e8f0;font-family:Nunito,system-ui,sans-serif}
    .l01p-index{max-width:760px;margin:0 auto}
    .l01p-index h1{font-size:clamp(1.4rem,4vw,1.8rem);font-weight:900;margin:.5rem 0}
    .l01p-index .badge{display:inline-block;font-size:.72rem;font-weight:900;padding:.15rem .55rem;border-radius:999px;background:#f59e0b;color:#422006;vertical-align:middle;margin-left:.35rem}
    .l01p-index .intro{color:#94a3b8;font-size:.9rem;line-height:1.65;margin-bottom:1rem}
    .l01p-index-hero{border-radius:20px;overflow:hidden;margin-bottom:1rem;border:2px solid rgba(255,255,255,.08)}
    .l01p-index-hero img{width:100%;display:block;max-height:200px;object-fit:cover}
    .l01p-features{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
    .l01p-features span{font-size:.7rem;font-weight:800;padding:.2rem .5rem;border-radius:999px;background:rgba(255,255,255,.08);color:#cbd5e1}
    .l01p-index-section{margin-bottom:1rem}
    .l01p-index-section h2{font-size:.76rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#fbbf24;margin:0 0 .4rem}
    .l01p-index ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
    .l01p-index li a{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#f1f5f9;text-decoration:none;font-weight:700;font-size:.88rem}
    .l01p-index li a:hover{background:rgba(37,99,235,.18);border-color:rgba(59,130,246,.35)}
    .l01p-index .num{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#7c3aed);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center}
    .l01p-index .back{margin-top:1.2rem;text-align:center}
    .l01p-index .back a{color:#94a3b8;font-weight:700;text-decoration:none;font-size:.88rem}
  </style>
  <script src="assets/l01p-data.js"></script>
</head>
<body class="l01p-index-body">
  <main class="l01p-index">
    <p style="text-align:center;margin:0 0 .65rem"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/logo2.png" alt="Steven's Class" width="160" height="48" decoding="async" style="opacity:.95"/></p>
    <div class="l01p-index-hero"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Grammar/L01-小学一般现在时/assets/img/l01p-action-vs-state.png" alt="" onerror="this.src='assets/img/l01p-action-vs-state.png'"/></div>
    <h1>一般现在时 <span class="badge">小学 3–5 年级 · v3</span></h1>
    <p class="intro">32 页专业 ESL 互动课件：每句配图 · 声音/图片先行 · 苏格拉底提问 · 三单自我发现 · 拼写实验室 · 否定/疑问动态演示 · 看图造句 · 听音排序 · DeepSeek 点词</p>
    <div class="l01p-features">
      <span>🖼 每句配图</span><span>🔊 声音先行</span><span>💭 苏格拉底</span><span>🔍 三单发现</span>
      <span>🎬 动态演示</span><span>✏️ 拼写规律</span><span>🧩 看图造句</span><span>🎧 听音排序</span><span>📖 DeepSeek</span>
    </div>
    <div id="l01pIndexMount"></div>
    <p class="back"><a href="../index.html">← 课程总目录</a> · <a href="../L01/index.html">初中版 →</a></p>
  </main>
  <script>
    (function(){
      var m=document.getElementById("l01pIndexMount");if(!m||!window.L01pData)return;
      var sec={};window.L01pData.pages.forEach(function(p,i){if(!sec[p.section])sec[p.section]=[];sec[p.section].push({p:p,n:i+1});});
      var h="";Object.keys(sec).forEach(function(s){h+='<div class="l01p-index-section"><h2>'+s+'</h2><ol>';sec[s].forEach(function(x){h+='<li><a href="'+x.p.id+'.html"><span class="num">'+String(x.n).padStart(2,"0")+'</span><span>'+x.p.title+'</span></a></li>';});h+='</ol></div>';});
      m.innerHTML=h;
    })();
  </script>
</body>
</html>
