<body class="has-lesson-pager">
  <div id="app"><div id="l15-book" class="book">
    <header class="top-bar"><div class="top-bar-main"><strong>词性转换与词汇 · L15</strong></div>
      <a class="l15-index-link" href="index.html">学习目录</a></header>
    <div class="l15-scroll"><section class="lesson-page active" data-page="1">
    <div class="page-head"><span class="page-kicker">1 / 2</span><h2 class="page-title">热身 · 技巧速测（10 题）</h2></div>
    <div class="panel">
      <p class="zh-hint">先完成技巧热身，再进入全库五种语境测验（699 条 × 5 模式）。</p>
      <div id="final-quiz"></div><p class="fb" id="quiz-score"></p></div></section>
<section class="lesson-page" data-page="2">
    <div class="page-head"><span class="page-kicker">2 / 2</span><h2 class="page-title">全库词汇测验 · 五种方式</h2></div>
    <div class="panel">
      <p class="zh-hint">每种模式覆盖全库 699 条（可按分类筛选），题目均结合例句 exEn 与真题语境 ctx。</p>
      <div class="vq-hub-grid" id="vq-hub"></div>
      <p style="text-align:center;margin-top:1rem"><a href="lesson15-page11-vocab-quiz.html" class="vq-btn primary" style="display:inline-block;text-decoration:none">进入全库测验中心 →</a></p></div></section>
    </div>
    <nav class="lesson-pager is-intra-nav" aria-label="分页">

        <span class="pager-mid" id="pager-mid" aria-live="polite">1 / 2</span>

  </div></div>
  <script src="l15-corpus-pool.js?v=3"></script>
  <script src="l15-vocab-browser.js"></script>
  <script src="l15-index-nav.js"></script>
  <script src="l15-lesson-pager.js"></script>
  <script>
  (function(){
    var pager = window.L15LessonPager && L15LessonPager.init();
    
    var box = document.getElementById("final-quiz"); var score = 0;
    L15Corpus.FINAL_QUIZ.forEach(function(q, i){
      var d = document.createElement("div"); d.className="vq-card"; d.style.marginBottom="0.75rem";
      d.innerHTML = "<p class='vq-stem'><strong>Q"+(i+1)+".</strong> "+q.stem+"</p>";
      var row = document.createElement("div"); row.className="vq-opts";
      q.opts.forEach(function(o){
        var b = document.createElement("button"); b.className="vq-opt"; b.textContent=o;
        b.onclick=function(){ if(b.dataset.done) return; b.dataset.done=1;
          if(o===q.ans){ b.classList.add("ok"); score++; } else b.classList.add("bad");
          document.getElementById("quiz-score").textContent = "得分："+score+" / "+L15Corpus.FINAL_QUIZ.length;
        }; row.appendChild(b);
      });
      d.appendChild(row); box.appendChild(d);
    });
    var hub = document.getElementById("vq-hub");
    if (hub && L15VocabQuizGen) {
      L15VocabQuizGen.MODES.forEach(function(m){
        var n = L15VocabQuizGen.buildQuizSet(L15Corpus.MASTER, m.id, {}).length;
        hub.innerHTML += '<div class="vq-hub-card"><strong>'+m.icon+' '+m.label+'</strong><span>'+n+' 题 · '+m.desc+'</span></div>';
      });
    }
  
  })();
  </script>
</body></html>
