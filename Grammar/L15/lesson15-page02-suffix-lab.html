  <script>
  (function () {
    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function wordCard(w) {
      var tts = w.form || w.base;
      return (
        '<article class="suffix-word-card">' +
        '<div class="suffix-word-head">' +
        '<div class="suffix-word-pair" lang="en">' +
        '<span class="sw-base">' + esc(w.base) + '</span>' +
        '<span class="sw-arrow">→</span>' +
        '<button type="button" class="sw-reveal sw-reveal-form" aria-label="点击显示变形">' +
        '<span class="sw-reveal-hint">点击显示变形</span>' +
        '<span class="sw-reveal-val sw-form" hidden>' + esc(w.form) + "</span>" +
        "</button>" +
        "</div>" +
        '<button type="button" class="sw-reveal sw-reveal-zh" aria-label="点击显示释义">' +
        '<span class="sw-reveal-hint">点击显示释义</span>' +
        '<span class="sw-reveal-val suffix-word-zh" hidden>' + esc(w.zh) + "</span>" +
        "</button>" +
        (w.year ? '<span class="suffix-word-year">' + esc(w.year) + "</span>" : "") +
        '<button type="button" class="tts-btn" data-tts="' +
        esc(tts).replace(/"/g, "") +
        '" aria-label="朗读" disabled>🔊</button>' +
        "</div>" +
        '<button type="button" class="sw-reveal sw-reveal-ex" aria-label="点击显示例句">' +
        '<span class="sw-reveal-hint">点击显示例句</span>' +
        '<span class="sw-reveal-val suffix-word-ex" lang="en" hidden>' +
        esc(w.exEn) +
        "</span>" +
        "</button>" +
        '<button type="button" class="sw-reveal sw-reveal-exzh" aria-label="点击显示译文">' +
        '<span class="sw-reveal-hint">点击显示译文</span>' +
        '<span class="sw-reveal-val suffix-word-ex-zh" hidden>' +
        esc(w.exZh) +
        "</span>" +
        "</button>" +
        "</article>"
      );
    }

    function resetCardReveals(card) {
      if (!card) return;
      card.querySelectorAll(".sw-reveal").forEach(function (btn) {
        btn.classList.remove("is-revealed");
        var hint = btn.querySelector(".sw-reveal-hint");
        var val = btn.querySelector(".sw-reveal-val");
        if (hint) hint.hidden = false;
        if (val) val.hidden = true;
      });
      var tts = card.querySelector(".tts-btn");
      if (tts) tts.disabled = true;
    }

    function bindCardReveals(card) {
      if (!card || card.dataset.revealBound) return;
      card.dataset.revealBound = "1";
      card.querySelectorAll(".sw-reveal").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (btn.classList.contains("is-revealed")) return;
          btn.classList.add("is-revealed");
          var hint = btn.querySelector(".sw-reveal-hint");
          var val = btn.querySelector(".sw-reveal-val");
          if (hint) hint.hidden = true;
          if (val) val.hidden = false;
          if (btn.classList.contains("sw-reveal-form")) {
            var tts = card.querySelector(".tts-btn");
            if (tts) tts.disabled = false;
          }
        });
      });
    }

    function sectionHtml(sec, i) {
      var wordCount = (sec.words || []).length;
      var words = (sec.words || []).map(wordCard).join("");
      return (
        '<section class="lesson-page' + (i === 0 ? " active" : "") + '" data-page="' + (i + 1) + '">' +
        '<div class="page-head"><span class="page-kicker">' + esc(sec.kicker) + '</span>' +
        '<h2 class="page-title">' + esc(sec.title) + "</h2></div>" +
        '<div class="panel suffix-lab-stepper">' +
        '<p class="suffix-lab-intro">' + sec.intro + "</p>" +
        '<p class="suffix-lab-progress" aria-live="polite">1 / ' + wordCount + "</p>" +
        '<div class="suffix-lab-stage">' + words + "</div>" +
        '<div class="suffix-lab-nav">' +
        '<button type="button" class="suffix-lab-prev" disabled>上一个</button>' +
        '<button type="button" class="suffix-lab-next"' +
        (wordCount <= 1 ? " disabled" : "") +
        ">下一个</button>" +
        "</div></div></section>"
      );
    }

    function bindSteppers() {
      document.querySelectorAll(".suffix-lab-stepper").forEach(function (stepper) {
        var cards = stepper.querySelectorAll(".suffix-word-card");
        var progress = stepper.querySelector(".suffix-lab-progress");
        var prevBtn = stepper.querySelector(".suffix-lab-prev");
        var nextBtn = stepper.querySelector(".suffix-lab-next");
        var cur = 0;

        function bindTtsIn(card) {
          card.querySelectorAll(".tts-btn").forEach(function (btn) {
            if (btn.dataset.slBound) return;
            btn.dataset.slBound = "1";
            btn.onclick = function () {
              if (window.playLessonAzureTtsPlain) {
                window.playLessonAzureTtsPlain(btn.getAttribute("data-tts"));
              }
            };
          });
        }

        function show(idx) {
          cur = Math.max(0, Math.min(cards.length - 1, idx));
          cards.forEach(function (c, j) {
            c.hidden = j !== cur;
            if (j === cur) {
              resetCardReveals(c);
              bindCardReveals(c);
            }
          });
          if (progress) {
            progress.textContent = cards.length ? cur + 1 + " / " + cards.length : "0 / 0";
          }
          if (prevBtn) prevBtn.disabled = cur === 0;
          if (nextBtn) nextBtn.disabled = cur >= cards.length - 1;
          if (cards[cur]) bindTtsIn(cards[cur]);
        }

        if (prevBtn) {
          prevBtn.addEventListener("click", function () {
            show(cur - 1);
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener("click", function () {
            show(cur + 1);
          });
        }
        show(0);
      });
    }

    var root = document.getElementById("suffix-lab-pages");
    var sections = (window.L15SuffixLab && L15SuffixLab.sections) || [];
    root.innerHTML = sections.map(sectionHtml).join("");
    bindSteppers();

    if (window.L15LessonPager) {
      L15LessonPager.init();
    }
  })();
  </script>
