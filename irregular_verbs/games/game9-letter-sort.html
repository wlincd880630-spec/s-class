<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>拼写轨道 · Verb Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/verbverse.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <script src="../distractors.js"></script>
  <script src="../assets/verbverse.js"></script>
<script src="../../scripts/site-nav.js" defer></script>
</head>
<body class="game-page">
  <header class="game-topbar">
    <a class="topbar-back" href="index.html" aria-label="返回游戏大厅"><span aria-hidden="true">←</span><span>游戏大厅</span></a>
    <div class="game-progress" aria-label="游戏进度">
      <div class="game-progress-labels"><span id="progressTitle">GAME 09 · 拼写轨道</span><strong id="progressLabel">0 / 0</strong></div>
      <div class="game-progress-track"><div class="game-progress-fill" id="progressFill"></div></div>
    </div>
    <a class="brand-lockup" href="../index.html"><span class="brand-mark">VA</span><span class="brand-copy"><strong>Verb Atlas</strong><span>Tense Observatory</span></span></a>
  </header>

  <main class="game-shell">
    <div class="game-stage-head">
      <div><p class="eyebrow">SPELLING ORBIT</p><h1>拼写轨道</h1></div>
      <p>三种难度：独立拼写、双倍随机字母、字母排序。按当前词库一次性全覆盖。</p>
    </div>

    <section class="game-setup" aria-label="选择拼写设置">
      <div class="game-setup-row">
        <p><strong>测试目标</strong></p>
        <div class="mode-tabs">
          <button class="mode-button" type="button" data-mode="past" aria-pressed="false">过去式</button>
          <button class="mode-button" type="button" data-mode="pp" aria-pressed="false">过去分词</button>
        </div>
      </div>
      <div class="game-setup-row">
        <p><strong>难度区分</strong></p>
        <div class="mode-tabs">
          <button class="mode-button" type="button" data-difficulty="free" aria-pressed="false">1 · 独立拼写</button>
          <button class="mode-button" type="button" data-difficulty="double" aria-pressed="false">2 · 双倍字母</button>
          <button class="mode-button" type="button" data-difficulty="sort" aria-pressed="false">3 · 字母排序</button>
        </div>
      </div>
      <section class="mode-confirm" id="modeConfirm" hidden>
        <div>
          <strong>切换设置？</strong>
          <p>当前进度会清空，并从第 1 题重新开始。</p>
        </div>
        <div class="mode-confirm-actions">
          <button class="button button-secondary" id="cancelMode" type="button">继续本局</button>
          <button class="button button-primary" id="confirmMode" type="button">确认切换</button>
        </div>
      </section>
    </section>

    <div id="gameStage" data-game-stage>
      <section class="game-empty">
        <p class="eyebrow">SELECT A ROUTE</p>
        <h1>先选择目标与难度</h1>
        <p>独立拼写没有字母提示；双倍字母会混入随机多余字母；字母排序只打乱目标词本身。</p>
      </section>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var U = window.IrregularVerbsUtil;
      var D = window.IrregularVerbsDistractors;
      var VV = window.VerbVerse;
      var GAME_ID = "letter-sort";
      var MODE_META = {
        past: { label: "过去式", pill: "过去式 · PAST", tone: "is-past" },
        pp: { label: "过去分词", pill: "过去分词 · PARTICIPLE", tone: "is-perfect" }
      };
      var DIFF_META = {
        free: { label: "独立拼写", hint: "没有字母提示，请独立写出目标形式。" },
        double: { label: "双倍字母", hint: "字母数量是目标词的两倍，多余字母随机出现。" },
        sort: { label: "字母排序", hint: "把打乱的字母重新排成正确形式。" }
      };
      var selectedVerbs = U.getSelectedVerbs();
      var stage = document.getElementById("gameStage");
      var modeButtons = Array.prototype.slice.call(document.querySelectorAll("[data-mode]"));
      var difficultyButtons = Array.prototype.slice.call(document.querySelectorAll("[data-difficulty]"));
      var modeConfirm = document.getElementById("modeConfirm");
      var pendingChange = null;
      var mode = null;
      var difficulty = null;
      var questions = [];
      var currentQuestion = null;
      var roundIndex = 0;
      var score = 0;
      var answered = false;
      var mistakes = [];
      var selectedIndexes = [];
      var answerBox;
      var poolBox;
      var feedback;
      var correctSpelling;
      var undoButton;
      var clearButton;
      var submitButton;
      var nextButton;
      var freeInput;

      function setChips() {
        modeButtons.forEach(function (button) {
          var active = button.dataset.mode === mode;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
        difficultyButtons.forEach(function (button) {
          var active = button.dataset.difficulty === difficulty;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function updateProgress(completed) {
        var total = questions.length;
        var count = mode && difficulty ? Math.min(total, roundIndex + (completed ? 1 : 0)) : 0;
        document.getElementById("progressLabel").textContent =
          total ? Math.min(roundIndex + 1, total) + " / " + total : "0 / 0";
        document.getElementById("progressFill").style.setProperty(
          "--progress",
          total ? Math.round((count / total) * 100) + "%" : "0%"
        );
      }

      function buildQuestions(field, letterMode) {
        var built = [];
        selectedVerbs.forEach(function (verb) {
          try {
            var question = D.createLetterQuestion({ verb: verb, field: field, mode: letterMode });
            if (question) built.push(question);
          } catch (error) {
          }
        });
        return VV.buildCoverageRounds(built);
      }

      function showEmpty() {
        stage.innerHTML =
          '<section class="game-empty"><p class="eyebrow">NO LETTER ROUTE</p><h1>当前词库无法生成题目</h1>' +
          '<p>过去分词模式会跳过 can。请调整词库后再试。</p>' +
          '<a class="button button-primary" href="../index.html#wordStudio">前往调整词库</a></section>';
        updateProgress(false);
      }

      function renderPlayShell() {
        var free = difficulty === "free";
        stage.innerHTML =
          '<section class="game-panel" aria-labelledby="baseWord">' +
          '<div class="question-meta"><span class="question-index" id="questionIndex">QUESTION 01</span>' +
          '<span class="tense-pill" id="formLabel"></span></div>' +
          '<div class="spelling-cue"><h2 id="baseWord">—</h2><p id="chineseMeaning">—</p></div>' +
          '<p class="pool-count" id="poolCount"></p>' +
          (free
            ? '<input class="free-spelling-input" id="freeInput" type="text" autocomplete="off" spellcheck="false" aria-label="独立拼写输入">'
            : '<div class="spelling-answer" id="answerSlots" aria-label="已选择的字母"></div><div class="letter-pool" id="letterPool"></div>') +
          '<p class="correct-spelling" id="correctSpelling" hidden></p>' +
          '<p class="game-feedback" id="gameFeedback">开始拼写。</p>' +
          '<div class="game-action-row spelling-actions">' +
          (free ? "" : '<button class="button button-secondary" id="undoButton" type="button">退格</button>' +
          '<button class="button button-secondary" id="clearButton" type="button">清空</button>') +
          '<button class="button button-primary" id="submitButton" type="button">提交</button>' +
          '<button class="button button-primary" id="nextButton" type="button" hidden>下一题</button></div></section>';
        answerBox = document.getElementById("answerSlots");
        poolBox = document.getElementById("letterPool");
        feedback = document.getElementById("gameFeedback");
        correctSpelling = document.getElementById("correctSpelling");
        undoButton = document.getElementById("undoButton");
        clearButton = document.getElementById("clearButton");
        submitButton = document.getElementById("submitButton");
        nextButton = document.getElementById("nextButton");
        freeInput = document.getElementById("freeInput");
        if (undoButton) undoButton.addEventListener("click", undoLetter);
        if (clearButton) clearButton.addEventListener("click", clearAnswer);
        submitButton.addEventListener("click", submitAnswer);
        nextButton.addEventListener("click", nextRound);
        if (freeInput) {
          freeInput.addEventListener("input", function () {
            submitButton.disabled = answered || !freeInput.value.trim();
          });
        }
      }

      function startRound(nextMode, nextDifficulty) {
        mode = nextMode;
        difficulty = nextDifficulty;
        questions = buildQuestions(mode, difficulty);
        roundIndex = 0;
        score = 0;
        answered = false;
        mistakes = [];
        selectedIndexes = [];
        setChips();
        document.getElementById("progressTitle").textContent =
          "GAME 09 · " + DIFF_META[difficulty].label;
        if (!questions.length) {
          showEmpty();
          return;
        }
        renderPlayShell();
        renderRound();
      }

      function maybeStart() {
        if (mode && difficulty) startRound(mode, difficulty);
      }

      function selectedMap() {
        var map = {};
        selectedIndexes.forEach(function (index) { map[index] = true; });
        return map;
      }

      function answerText() {
        if (difficulty === "free") return (freeInput && freeInput.value ? freeInput.value : "").trim();
        return selectedIndexes.map(function (index) {
          return currentQuestion.letters[index];
        }).join("");
      }

      function targetLength() {
        return currentQuestion ? String(currentQuestion.target).replace(/[^a-z]/gi, "").length : 0;
      }

      function renderAnswer() {
        if (!answerBox) return;
        answerBox.innerHTML = "";
        if (!selectedIndexes.length) {
          var placeholder = document.createElement("span");
          placeholder.className = "answer-placeholder";
          placeholder.textContent = "点击字母，或直接使用键盘输入";
          answerBox.appendChild(placeholder);
        } else {
          selectedIndexes.forEach(function (poolIndex, position) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "selected-letter";
            button.textContent = currentQuestion.letters[poolIndex];
            button.disabled = answered;
            button.addEventListener("click", function () { removeLetter(position); });
            answerBox.appendChild(button);
          });
        }
      }

      function syncControls() {
        if (difficulty === "free") {
          submitButton.disabled = answered || !answerText();
          return;
        }
        var used = selectedMap();
        var full = selectedIndexes.length >= targetLength();
        Array.prototype.forEach.call(poolBox.children, function (button) {
          var index = Number(button.dataset.index);
          var isUsed = Boolean(used[index]);
          button.classList.toggle("is-used", isUsed);
          button.disabled = answered || isUsed || full;
        });
        undoButton.disabled = answered || !selectedIndexes.length;
        clearButton.disabled = answered || !selectedIndexes.length;
        submitButton.disabled = answered || selectedIndexes.length !== targetLength();
      }

      function chooseLetter(index) {
        if (answered || selectedIndexes.length >= targetLength() || selectedIndexes.indexOf(index) !== -1) return;
        selectedIndexes.push(index);
        renderAnswer();
        syncControls();
        feedback.className = "game-feedback";
        feedback.textContent = selectedIndexes.length === targetLength()
          ? "字母数量已满，可以提交。"
          : "已选择 " + selectedIndexes.length + " / " + targetLength() + " 个字母。";
      }

      function removeLetter(position) {
        if (answered || position < 0 || position >= selectedIndexes.length) return;
        selectedIndexes.splice(position, 1);
        renderAnswer();
        syncControls();
      }

      function undoLetter() {
        removeLetter(selectedIndexes.length - 1);
      }

      function clearAnswer() {
        if (answered) return;
        selectedIndexes = [];
        if (freeInput) freeInput.value = "";
        renderAnswer();
        syncControls();
      }

      function submitAnswer() {
        if (answered || submitButton.disabled) return;
        var value = answerText();
        var correct = U.normalizeForm(value) === U.normalizeForm(currentQuestion.target);
        answered = true;
        if (answerBox) answerBox.classList.add(correct ? "is-correct" : "is-wrong");
        if (freeInput) {
          freeInput.disabled = true;
          freeInput.classList.add(correct ? "is-correct" : "is-wrong");
        }
        if (correct) {
          score += 1;
          feedback.className = "game-feedback is-success";
          feedback.textContent = "拼写正确：" + currentQuestion.target;
        } else {
          mistakes.push({
            prompt: currentQuestion.base + " · " + currentQuestion.cn,
            answer: currentQuestion.target
          });
          correctSpelling.hidden = false;
          correctSpelling.textContent = "正确拼写 · ";
          var strong = document.createElement("strong");
          strong.textContent = currentQuestion.target;
          correctSpelling.appendChild(strong);
          feedback.className = "game-feedback is-error";
          feedback.textContent = "本题拼写不正确。";
        }
        renderAnswer();
        syncControls();
        VV.recordGameAttempt(GAME_ID, {
          verbId: currentQuestion.verb.id,
          mode: mode,
          difficulty: difficulty,
          correct: correct,
          answer: value,
          expected: currentQuestion.target
        });
        submitButton.hidden = true;
        if (undoButton) undoButton.hidden = true;
        if (clearButton) clearButton.hidden = true;
        nextButton.hidden = false;
        nextButton.textContent = roundIndex === questions.length - 1 ? "查看结算" : "下一题";
        updateProgress(true);
      }

      function renderRound() {
        if (roundIndex >= questions.length) {
          finishGame();
          return;
        }
        currentQuestion = questions[roundIndex];
        answered = false;
        selectedIndexes = [];
        document.getElementById("questionIndex").textContent =
          "QUESTION " + String(roundIndex + 1).padStart(2, "0");
        document.getElementById("formLabel").className = "tense-pill " + MODE_META[mode].tone;
        document.getElementById("formLabel").textContent = MODE_META[mode].pill + " · " + DIFF_META[difficulty].label;
        document.getElementById("baseWord").textContent = currentQuestion.base;
        document.getElementById("chineseMeaning").textContent = currentQuestion.cn;
        document.getElementById("poolCount").textContent = DIFF_META[difficulty].hint;
        if (answerBox) answerBox.className = "spelling-answer";
        correctSpelling.hidden = true;
        correctSpelling.textContent = "";
        if (freeInput) {
          freeInput.disabled = false;
          freeInput.value = "";
          freeInput.className = "free-spelling-input";
          freeInput.focus();
        }
        if (poolBox) {
          poolBox.innerHTML = "";
          currentQuestion.letters.forEach(function (letter, index) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "letter-key";
            button.dataset.index = String(index);
            button.textContent = letter;
            button.addEventListener("click", function () { chooseLetter(index); });
            poolBox.appendChild(button);
          });
        }
        feedback.className = "game-feedback";
        feedback.textContent = DIFF_META[difficulty].hint;
        if (undoButton) undoButton.hidden = false;
        if (clearButton) clearButton.hidden = false;
        submitButton.hidden = false;
        nextButton.hidden = true;
        renderAnswer();
        syncControls();
        updateProgress(false);
      }

      function nextRound() {
        if (!answered) return;
        roundIndex += 1;
        renderRound();
      }

      function finishGame() {
        document.getElementById("progressLabel").textContent = questions.length + " / " + questions.length;
        document.getElementById("progressFill").style.setProperty("--progress", "100%");
        VV.recordGameSession(GAME_ID, {
          mode: mode,
          difficulty: difficulty,
          score: score,
          total: questions.length,
          mistakes: mistakes.length
        });
        VV.showGameSettlement({
          host: stage,
          title: DIFF_META[difficulty].label + "完成",
          message: "已按当前词库完成" + MODE_META[mode].label + "全覆盖拼写。",
          score: score,
          total: questions.length,
          mistakes: mistakes,
          nextHref: "game10-form-identity.html",
          onRestart: function () { startRound(mode, difficulty); }
        });
      }

      function chooseKeyboardLetter(letter) {
        if (!currentQuestion || answered || difficulty === "free") return;
        var used = selectedMap();
        for (var index = 0; index < currentQuestion.letters.length; index += 1) {
          if (!used[index] && currentQuestion.letters[index].toLowerCase() === letter.toLowerCase()) {
            chooseLetter(index);
            return;
          }
        }
      }

      function requestChange(kind, value) {
        if (!mode || !difficulty) {
          if (kind === "mode") mode = value;
          else difficulty = value;
          setChips();
          maybeStart();
          return;
        }
        if ((kind === "mode" && value === mode) || (kind === "difficulty" && value === difficulty)) return;
        pendingChange = { kind: kind, value: value };
        modeConfirm.hidden = false;
      }

      modeButtons.forEach(function (button) {
        button.addEventListener("click", function () { requestChange("mode", button.dataset.mode); });
      });
      difficultyButtons.forEach(function (button) {
        button.addEventListener("click", function () { requestChange("difficulty", button.dataset.difficulty); });
      });
      document.getElementById("cancelMode").addEventListener("click", function () {
        pendingChange = null;
        modeConfirm.hidden = true;
      });
      document.getElementById("confirmMode").addEventListener("click", function () {
        var change = pendingChange;
        pendingChange = null;
        modeConfirm.hidden = true;
        if (!change) return;
        if (change.kind === "mode") startRound(change.value, difficulty);
        else startRound(mode, change.value);
      });
      document.addEventListener("keydown", function (event) {
        if (!modeConfirm.hidden && event.key === "Escape") {
          pendingChange = null;
          modeConfirm.hidden = true;
          return;
        }
        if (!currentQuestion) return;
        if (answered && event.key === "Enter" && nextButton && !nextButton.hidden) {
          event.preventDefault();
          nextButton.click();
        } else if (!answered && difficulty !== "free" && /^[a-z]$/i.test(event.key)) {
          event.preventDefault();
          chooseKeyboardLetter(event.key);
        } else if (!answered && difficulty !== "free" && event.key === "Backspace") {
          event.preventDefault();
          undoLetter();
        } else if (!answered && event.key === "Enter" && submitButton && !submitButton.disabled) {
          event.preventDefault();
          submitButton.click();
        }
      });
      setChips();
      updateProgress(false);
    })();
  </script>
</body>
</html>
