<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>听音辨形 · 不规则动词</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <script src="../azure-tts.js"></script>
  <style>
    :root{--bg:#0c1222;--surface:#151d2e;--accent:#3b82f6;--ok:#22c55e;--bad:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(148,163,184,0.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC","DM Sans",sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);padding:1rem}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .toolbar a{color:var(--muted);text-decoration:none;font-size:0.85rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;max-width:480px;margin:0 auto;text-align:center}
    .play-btn{width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.8rem;margin:0.5rem auto 1rem;display:flex;align-items:center;justify-content:center}
    .play-btn.playing{animation:pulse 1s infinite}
    @keyframes pulse{50%{box-shadow:0 0 30px rgba(59,130,246,0.6)}}
    .hint{font-size:0.85rem;color:var(--muted);margin-bottom:1rem}
    .hint strong{color:#f59e0b}
    .opts{display:grid;gap:0.5rem}
    .opt{font-family:"DM Sans",sans-serif;font-size:1.05rem;font-weight:600;padding:0.85rem;border-radius:10px;border:2px solid var(--border);background:#1c2740;color:var(--text);cursor:pointer}
    .opt.correct{border-color:var(--ok);background:rgba(34,197,94,0.15)}
    .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,0.15)}
    .score{margin-top:1rem;font-size:0.85rem;color:var(--muted)}
    .score strong{color:var(--accent)}
  </style>
</head>
<body>
  <div class="toolbar"><a href="index.html"><i class="fas fa-arrow-left"></i> 游戏列表</a></div>
  <div class="card">
    <p class="hint">听发音，选出你听到的 <strong id="formLabel">过去式</strong></p>
    <button type="button" class="play-btn" id="playBtn"><i class="fas fa-volume-high"></i></button>
    <div class="opts" id="opts"></div>
    <p class="score">得分 <strong id="score">0</strong> / <span id="total">10</span></p>
  </div>
  <script>
  (function(){
    var U=window.IrregularVerbsUtil,TTS=window.IrregularVerbsTTS,verbs=U.getSelectedVerbs();
    if(!verbs.length){alert("请先选择词汇");location.href="../index.html";return;}
    var forms=[{key:"past",label:"过去式"},{key:"pp",label:"过去分词"},{key:"base",label:"原形"}];
    var pool=U.shuffle(verbs).slice(0,Math.min(10,verbs.length));
    var qi=0,score=0,answered=false,currentForm,spoken;
    document.getElementById("total").textContent=pool.length;

    function speak(){
      var btn=document.getElementById("playBtn");btn.classList.add("playing");
      TTS.speak(spoken,{onDone:function(){btn.classList.remove("playing");}});
    }

    function round(){
      if(qi>=pool.length){alert("完成！得分 "+score+"/"+pool.length);location.href="index.html";return;}
      answered=false;
      var v=pool[qi];
      currentForm=forms[Math.floor(Math.random()*forms.length)];
      spoken=v[currentForm.key].split(/\s*\/\s*/)[0].trim();
      if(spoken==="—"){qi++;round();return;}
      document.getElementById("formLabel").textContent=currentForm.label;
      var wrong=U.pickRandom(verbs.filter(function(x){return x.id!==v.id}),3).map(function(x){return x[currentForm.key].split(/\s*\/\s*/)[0].trim();});
      var opts=U.shuffle([spoken].concat(wrong));
      var box=document.getElementById("opts");box.innerHTML="";
      opts.forEach(function(o){
        var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o;
        b.addEventListener("click",function(){
          if(answered)return;answered=true;
          if(o===spoken){score++;document.getElementById("score").textContent=score;b.classList.add("correct");}
          else{b.classList.add("wrong");box.querySelectorAll(".opt").forEach(function(x){if(x.textContent===spoken)x.classList.add("correct");});}
          setTimeout(function(){qi++;round();},1200);
        });
        box.appendChild(b);
      });
      setTimeout(speak,300);
    }
    document.getElementById("playBtn").addEventListener("click",speak);
    round();
  })();
  </script>
</body>
</html>
