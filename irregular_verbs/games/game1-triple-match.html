<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三态连线 · 不规则动词</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <style>
    :root{--bg:#0c1222;--surface:#151d2e;--accent:#3b82f6;--ok:#22c55e;--bad:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(148,163,184,0.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC","DM Sans",sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);padding:1rem}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem}
    .toolbar a{color:var(--muted);text-decoration:none;font-size:0.85rem}
    .score{font-weight:700;color:var(--accent)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;max-width:520px;margin:0 auto}
    .prompt{text-align:center;margin-bottom:1.25rem}
    .prompt .label{font-size:0.75rem;color:var(--muted);margin-bottom:0.3rem}
    .prompt .word{font-family:"DM Sans",sans-serif;font-size:2rem;font-weight:700}
    .prompt .cn{color:#93c5fd;font-size:0.9rem;margin-top:0.25rem}
    .q{margin-bottom:1rem}
    .q label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem}
    .opts{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
    .opt{font-family:"DM Sans",sans-serif;font-size:0.95rem;font-weight:600;padding:0.7rem;border-radius:10px;border:2px solid var(--border);background:#1c2740;color:var(--text);cursor:pointer;transition:all 0.15s}
    .opt:hover{border-color:var(--accent)}
    .opt.sel{border-color:var(--accent);background:rgba(59,130,246,0.15)}
    .opt.correct{border-color:var(--ok);background:rgba(34,197,94,0.15)}
    .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,0.15)}
    .btn{display:block;width:100%;margin-top:1rem;padding:0.75rem;border:none;border-radius:10px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .feedback{text-align:center;margin-top:0.75rem;font-size:0.9rem;min-height:1.4rem}
    .feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html"><i class="fas fa-arrow-left"></i> 游戏列表</a>
    <span class="score">得分 <span id="score">0</span> · <span id="round">1</span>/<span id="total">10</span></span>
  </div>
  <div class="card">
    <div class="prompt">
      <div class="label">原形 Base Form</div>
      <div class="word" id="baseWord">—</div>
      <div class="cn" id="baseCn"></div>
    </div>
    <div class="q">
      <label>选择正确的过去式 Past Simple</label>
      <div class="opts" id="pastOpts"></div>
    </div>
    <div class="q">
      <label>选择正确的过去分词 Past Participle</label>
      <div class="opts" id="ppOpts"></div>
    </div>
    <button type="button" class="btn" id="checkBtn" disabled>确认答案</button>
    <p class="feedback" id="feedback"></p>
  </div>
  <script>
  (function(){
    var U=window.IrregularVerbsUtil, verbs=U.getSelectedVerbs();
    if(!verbs.length){alert("请先选择词汇");location.href="../index.html";return;}
    var pool=U.shuffle(verbs).slice(0,Math.min(10,verbs.length));
    var round=0,score=0,pastSel=null,ppSel=null,answered=false;
    var pastOpts=document.getElementById("pastOpts"),ppOpts=document.getElementById("ppOpts"),checkBtn=document.getElementById("checkBtn");
    document.getElementById("total").textContent=pool.length;

    function makeOpts(container, correct, field, selRef){
      container.innerHTML="";
      var wrong=U.pickRandom(verbs.filter(function(v){return v.id!==pool[round].id}),3).map(function(v){return v[field];});
      var opts=U.shuffle([correct].concat(wrong));
      opts.forEach(function(o){
        var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o;
        b.addEventListener("click",function(){
          if(answered)return;
          container.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel");});
          b.classList.add("sel");
          if(field==="past")pastSel=o;else ppSel=o;
          document.getElementById("checkBtn").disabled=!(pastSel&&ppSel);
        });
        container.appendChild(b);
      });
    }

    function next(){
      if(round>=pool.length){alert("完成！得分 "+score+"/"+pool.length);location.href="index.html";return;}
      var v=pool[round];
      answered=false;pastSel=null;ppSel=null;
      document.getElementById("baseWord").textContent=v.base;
      document.getElementById("baseCn").textContent=v.cn;
      document.getElementById("round").textContent=round+1;
      document.getElementById("feedback").textContent="";
      checkBtn.disabled=true;
      checkBtn.textContent="确认答案";
      makeOpts(pastOpts,v.past,"past");makeOpts(ppOpts,v.pp,"pp");
    }

    checkBtn.addEventListener("click",function(){
      if(answered){round++;next();return;}
      answered=true;
      var v=pool[round],ok=(pastSel===v.past&&ppSel===v.pp);
      if(ok){score++;document.getElementById("score").textContent=score;document.getElementById("feedback").className="feedback ok";document.getElementById("feedback").textContent="✓ 完全正确！";}
      else{document.getElementById("feedback").className="feedback bad";document.getElementById("feedback").textContent="✗ 正确答案："+v.past+" / "+v.pp;}
      pastOpts.querySelectorAll(".opt").forEach(function(b){if(b.textContent===v.past)b.classList.add("correct");else if(b.classList.contains("sel"))b.classList.add("wrong");});
      ppOpts.querySelectorAll(".opt").forEach(function(b){if(b.textContent===v.pp)b.classList.add("correct");else if(b.classList.contains("sel"))b.classList.add("wrong");});
      checkBtn.textContent="下一题 →";
    });
    next();
  })();
  </script>
</body>
</html>
