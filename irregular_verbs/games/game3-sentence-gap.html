<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>语境填空 · Verb Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/verbverse.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <script src="../azure-tts.js"></script>
  <script src="../assets/verbverse.js"></script>
</head>
<body class="game-page">
  <header class="game-topbar">
    <a class="topbar-back" href="index.html" aria-label="返回游戏大厅"><span aria-hidden="true">←</span><span>游戏大厅</span></a>
    <div class="game-progress" aria-label="游戏进度">
      <div class="game-progress-labels"><span>GAME 03 · 语境填空</span><strong id="progressLabel">1 / 10</strong></div>
      <div class="game-progress-track"><div class="game-progress-fill" id="progressFill"></div></div>
    </div>
    <a class="brand-lockup" href="../index.html"><span class="brand-mark">VA</span><span class="brand-copy"><strong>Verb Atlas</strong><span>Tense Observatory</span></span></a>
  </header>

  <main class="game-shell" id="gameStage" data-game-stage>
    <div class="game-stage-head">
      <div><p class="eyebrow">CONTEXT LAB · 10 QUESTIONS</p><h1>语境填空</h1></div>
      <p>每题来自词库中的真实例句。根据时态与上下文，找回被隐藏的目标词。</p>
    </div>
    <section class="game-panel">
      <div class="question-meta">
        <span class="question-index" id="questionIndex">QUESTION 01</span>
        <span class="tense-pill" id="tenseLabel">一般现在时</span>
      </div>
      <div class="context-card" id="contextCard" data-tense="present">
        <p class="context-sentence" id="sentence"></p>
        <p class="context-translation" id="translation"></p>
      </div>
      <div class="choice-grid" id="answerOptions" aria-label="句子填空选项"></div>
      <p class="game-feedback" id="gameFeedback" role="status" aria-live="polite">选择最符合例句的实际动词形式。</p>
      <div class="game-action-row">
        <button class="button button-secondary" id="speakButton" type="button">朗读完整例句</button>
        <button class="button button-primary" id="nextButton" type="button" hidden>下一题</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var U = window.IrregularVerbsUtil;
      var VV = window.VerbVerse;
      var TTS = window.IrregularVerbsTTS;
      var GAME_ID = "sentence-gap";
      var TOTAL = 10;
      var verbs = U.getSelectedVerbs();
      var stage = document.getElementById("gameStage");
      var sentenceNode = document.getElementById("sentence");
      var contextCard = document.getElementById("contextCard");
      var optionsBox = document.getElementById("answerOptions");
      var feedback = document.getElementById("gameFeedback");
      var nextButton = document.getElementById("nextButton");
      var speakButton = document.getElementById("speakButton");
      var candidates = [];
      var questions = [];
      var roundIndex = 0;
      var score = 0;
      var answered = false;
      var mistakes = [];

      function showEmpty() {
        stage.innerHTML =
          '<section class="game-empty"><p class="eyebrow">EMPTY ATLAS</p><h1>缺少可用例句</h1>' +
          '<p>请先选择包含完整例句的练习词汇。</p><a class="button button-primary" href="../index.html#wordStudio">前往调整词库</a></section>';
      }

      function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function findActualTarget(sentence, forms) {
        var sorted = VV.uniqueStrings(forms).sort(function (a, b) {
          return b.length - a.length;
        });
        for (var i = 0; i < sorted.length; i += 1) {
          var expression = new RegExp(
            "(^|[^A-Za-z])(" + escapeRegExp(sorted[i]) + ")(?=$|[^A-Za-z])",
            "i"
          );
          var match = expression.exec(sentence);
          if (match) {
            return {
              answer: match[2],
              start: match.index + match[1].length,
              end: match.index + match[1].length + match[2].length
            };
          }
        }
        return null;
      }

      function buildCandidates() {
        var list = [];
        verbs.forEach(function (verb) {
          ["present", "past", "perfect"].forEach(function (key) {
            if (verb.id === "can" && key === "perfect") return;
            var example = verb.examples && verb.examples[key];
            if (!example || !example.en) return;
            var target = findActualTarget(example.en, U.getHighlightForms(verb, key));
            if (!target) return;
            list.push({
              verb: verb,
              key: key,
              example: example,
              answer: target.answer,
              start: target.start,
              end: target.end
            });
          });
        });
        return list;
      }

      function renderSentence(item, reveal) {
        var before = U.escapeHtml(item.example.en.slice(0, item.start));
        var after = U.escapeHtml(item.example.en.slice(item.end));
        var middle = reveal ? U.escapeHtml(item.answer) : "?";
        sentenceNode.innerHTML =
          before + '<span class="sentence-gap">' + middle + "</span>" + after;
      }

      function makeOptions(item) {
        var alternatives = VV.uniqueStrings(
          candidates
            .filter(function (candidate) {
              return candidate.key === item.key && candidate.verb.id !== item.verb.id;
            })
            .map(function (candidate) { return candidate.answer; })
        ).filter(function (value) {
          return U.normalizeForm(value) !== U.normalizeForm(item.answer);
        });
        return U.shuffle([item.answer].concat(U.shuffle(alternatives).slice(0, 3)));
      }

      function speakSentence() {
        var item = questions[roundIndex];
        if (!item) return;
        VV.setButtonBusy(speakButton, true, { busy: "正在朗读" });
        Promise.resolve(TTS.speak(item.example.en, { slow: true }))
          .catch(function () { return false; })
          .finally(function () {
            VV.setButtonBusy(speakButton, false);
          });
      }

      function updateProgress(completed) {
        var current = Math.min(TOTAL, roundIndex + (completed ? 1 : 0));
        document.getElementById("progressLabel").textContent =
          Math.min(roundIndex + 1, TOTAL) + " / " + TOTAL;
        document.getElementById("progressFill").style.setProperty(
          "--progress",
          Math.round((current / TOTAL) * 100) + "%"
        );
      }

      function choose(button, value) {
        if (answered) return;
        var item = questions[roundIndex];
        var correct = U.normalizeForm(value) === U.normalizeForm(item.answer);
        answered = true;
        Array.prototype.forEach.call(optionsBox.children, function (option) {
          option.disabled = true;
          if (U.normalizeForm(option.dataset.value) === U.normalizeForm(item.answer)) {
            option.classList.add("is-correct");
          }
        });
        renderSentence(item, true);
        if (correct) {
          score += 1;
          feedback.className = "game-feedback is-success";
          feedback.textContent = "语境匹配正确：" + item.example.en;
        } else {
          button.classList.add("is-wrong");
          mistakes.push({
            prompt: item.example.en.slice(0, item.start) + "___" + item.example.en.slice(item.end),
            answer: item.answer
          });
          feedback.className = "game-feedback is-error";
          feedback.textContent = "正确答案是 " + item.answer + "。现在为你朗读完整例句。";
          speakSentence();
        }
        VV.recordGameAttempt(GAME_ID, {
          verbId: item.verb.id,
          tense: item.key,
          correct: correct,
          answer: value,
          expected: item.answer
        });
        nextButton.hidden = false;
        nextButton.textContent = roundIndex === TOTAL - 1 ? "查看结算" : "下一题";
        updateProgress(true);
      }

      function renderRound() {
        if (roundIndex >= TOTAL) {
          finishGame();
          return;
        }
        var item = questions[roundIndex];
        answered = false;
        document.getElementById("questionIndex").textContent =
          "QUESTION " + String(roundIndex + 1).padStart(2, "0");
        document.getElementById("tenseLabel").textContent =
          item.example.tense + " · " + item.example.level;
        document.getElementById("tenseLabel").className =
          "tense-pill " + (item.key === "past" ? "is-past" : item.key === "perfect" ? "is-perfect" : "");
        contextCard.dataset.tense = item.key;
        document.getElementById("translation").textContent = item.example.cn;
        renderSentence(item, false);
        optionsBox.innerHTML = "";
        makeOptions(item).forEach(function (option, index) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "choice-button";
          button.dataset.value = option;
          button.textContent = String(index + 1) + " · " + option;
          button.addEventListener("click", function () { choose(button, option); });
          optionsBox.appendChild(button);
        });
        feedback.className = "game-feedback";
        feedback.textContent = "选择最符合例句的实际动词形式。";
        nextButton.hidden = true;
        updateProgress(false);
      }

      function finishGame() {
        document.getElementById("progressLabel").textContent = TOTAL + " / " + TOTAL;
        document.getElementById("progressFill").style.setProperty("--progress", "100%");
        if (TTS && typeof TTS.stop === "function") TTS.stop();
        VV.recordGameSession(GAME_ID, {
          score: score,
          total: TOTAL,
          mistakes: mistakes.length
        });
        VV.showGameSettlement({
          host: stage,
          title: "语境实验完成",
          message: "十个真实例句已经重新接回时态轨道。",
          score: score,
          total: TOTAL,
          mistakes: mistakes,
          nextHref: "game4-time-tunnel.html"
        });
      }

      if (!verbs.length) {
        showEmpty();
        return;
      }
      candidates = buildCandidates();
      questions = VV.buildRounds(candidates, TOTAL);
      if (!questions.length) {
        showEmpty();
        return;
      }
      speakButton.addEventListener("click", speakSentence);
      nextButton.addEventListener("click", function () {
        roundIndex += 1;
        renderRound();
      });
      document.addEventListener("keydown", function (event) {
        if (!answered && /^[1-4]$/.test(event.key)) {
          var option = optionsBox.children[Number(event.key) - 1];
          if (option) option.click();
        } else if (event.key === "Enter" && event.target === document.body && !nextButton.hidden) {
          nextButton.click();
        }
      });
      renderRound();
    })();
  </script>
</body>
</html>
