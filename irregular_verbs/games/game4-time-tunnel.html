<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>时光隧道 · 不规则动词</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <style>
    :root{--bg:#0c1222;--surface:#151d2e;--present:#22c55e;--past:#f59e0b;--perfect:#a855f7;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(148,163,184,0.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC","DM Sans",sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);padding:1rem}
    .toolbar{display:flex;justify-content:space-between;margin-bottom:1rem}
    .toolbar a{color:var(--muted);text-decoration:none;font-size:0.85rem}
    .instr{font-size:0.85rem;color:var(--muted);text-align:center;margin-bottom:1rem}
  .instr strong{color:#f59e0b}
    .lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;max-width:640px;margin:0 auto 1rem}
    .lane{background:var(--surface);border:2px dashed var(--border);border-radius:12px;min-height:140px;padding:0.5rem}
    .lane.present{border-color:rgba(34,197,94,0.4)}.lane.past{border-color:rgba(245,158,11,0.4)}.lane.perfect{border-color:rgba(168,85,247,0.4)}
    .lane h3{font-size:0.72rem;text-align:center;margin-bottom:0.5rem;padding:0.2rem;border-radius:4px}
    .lane.present h3{background:rgba(34,197,94,0.15);color:var(--present)}
    .lane.past h3{background:rgba(245,158,11,0.15);color:var(--past)}
    .lane.perfect h3{background:rgba(168,85,247,0.15);color:var(--perfect)}
    .lane.drag-over{background:rgba(59,130,246,0.1)}
    .pool{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;max-width:640px;margin:0 auto;padding:0.75rem;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
    .chip{font-family:"DM Sans",sans-serif;font-size:0.9rem;font-weight:600;padding:0.5rem 0.85rem;border-radius:8px;background:#1c2740;border:2px solid var(--border);cursor:grab;user-select:none;touch-action:none}
    .chip.placed{cursor:default;opacity:0.85}
    .chip.correct{border-color:var(--present)}.chip.wrong{border-color:#ef4444}
    .score{text-align:center;margin-top:1rem;font-size:0.9rem}
    .btn{display:block;margin:1rem auto 0;padding:0.7rem 1.5rem;border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
  </style>
</head>
<body>
  <div class="toolbar"><a href="index.html"><i class="fas fa-arrow-left"></i> 游戏列表</a></div>
  <p class="instr">将动词卡片拖入正确的时间轨道：<strong>现在</strong>用原形，<strong>过去</strong>用过去式，<strong>完成</strong>用 have/has + 过去分词</p>
  <div class="lanes">
    <div class="lane present" data-lane="present"><h3>现在 · Base</h3></div>
    <div class="lane past" data-lane="past"><h3>过去 · Past</h3></div>
    <div class="lane perfect" data-lane="perfect"><h3>完成 · Perfect</h3></div>
  </div>
  <div class="pool" id="pool"></div>
  <p class="score" id="scoreText">已放置 0 / <span id="total">0</span></p>
  <button type="button" class="btn" id="checkBtn" style="display:none">检查答案</button>
  <script>
  (function(){
    var U=window.IrregularVerbsUtil,verbs=U.getSelectedVerbs();
    if(!verbs.length){alert("请先选择词汇");location.href="../index.html";return;}
    var selected=U.shuffle(verbs).slice(0,Math.min(6,verbs.length));
    document.getElementById("total").textContent=selected.length;
    var pool=document.getElementById("pool"),placed=0,placements={};
    var lanes=document.querySelectorAll(".lane");

    selected.forEach(function(v){
      var forms=[
        {text:v.base,lane:"present",verb:v},
        {text:v.past.split(/\s*\/\s*/)[0],lane:"past",verb:v},
      ];
      if(v.pp!=="—")forms.push({text:"has "+v.pp.split(/\s*\/\s*/)[0],lane:"perfect",verb:v});
      var f=forms[Math.floor(Math.random()*forms.length)];
      var chip=document.createElement("div");
      chip.className="chip";chip.textContent=f.text;
      chip.dataset.correctLane=f.lane;chip.dataset.verbId=f.verb.id;
      chip.draggable=true;
      chip.addEventListener("dragstart",function(e){e.dataTransfer.setData("text",chip.outerHTML);window._dragChip=chip;});
      pool.appendChild(chip);
    });

    lanes.forEach(function(lane){
      lane.addEventListener("dragover",function(e){e.preventDefault();lane.classList.add("drag-over");});
      lane.addEventListener("dragleave",function(){lane.classList.remove("drag-over");});
      lane.addEventListener("drop",function(e){
        e.preventDefault();lane.classList.remove("drag-over");
        var chip=window._dragChip;if(!chip||chip.classList.contains("placed"))return;
        if(lane.children.length>1)return;
        chip.classList.add("placed");chip.draggable=false;
        lane.appendChild(chip);placed++;
        placements[chip.dataset.verbId+chip.textContent]=lane.dataset.lane;
        document.getElementById("scoreText").textContent="已放置 "+placed+" / "+selected.length;
        if(placed>=selected.length)document.getElementById("checkBtn").style.display="block";
      });
    });

  /* Touch support */
    pool.addEventListener("click",function(e){
      var chip=e.target.closest(".chip");
      if(!chip||chip.classList.contains("placed"))return;
      window._selectedChip=chip;
      pool.querySelectorAll(".chip").forEach(function(c){c.style.outline=c===chip?"2px solid #3b82f6":"none";});
    });
    lanes.forEach(function(lane){
      lane.addEventListener("click",function(){
        var chip=window._selectedChip;
        if(!chip||chip.classList.contains("placed")||lane.children.length>1)return;
        chip.classList.add("placed");chip.style.outline="none";
        lane.appendChild(chip);placed++;
        if(placed>=selected.length)document.getElementById("checkBtn").style.display="block";
        document.getElementById("scoreText").textContent="已放置 "+placed+" / "+selected.length;
        window._selectedChip=null;
      });
    });

    document.getElementById("checkBtn").addEventListener("click",function(){
      var correct=0,total=0;
      document.querySelectorAll(".lane .chip").forEach(function(chip){
        total++;
        var parent=chip.parentElement;
        if(parent.dataset.lane===chip.dataset.correctLane){chip.classList.add("correct");correct++;}
        else chip.classList.add("wrong");
      });
      alert("正确 "+correct+" / "+total);
      if(correct===total)setTimeout(function(){location.href="index.html";},800);
    });
  })();
  </script>
</body>
</html>
