<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>记忆翻牌 · Verb Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/verbverse.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <script src="../assets/verbverse.js"></script>
</head>
<body class="game-page">
  <header class="game-topbar">
    <a class="topbar-back" href="index.html" aria-label="返回游戏大厅"><span aria-hidden="true">←</span><span>游戏大厅</span></a>
    <div class="game-progress" aria-label="配对进度">
      <div class="game-progress-labels"><span>GAME 05 · 记忆翻牌</span><strong id="progressLabel">记忆中</strong></div>
      <div class="game-progress-track"><div class="game-progress-fill" id="progressFill"></div></div>
    </div>
    <a class="brand-lockup" href="../index.html"><span class="brand-mark">VA</span><span class="brand-copy"><strong>Verb Atlas</strong><span>Tense Observatory</span></span></a>
  </header>

  <main class="game-shell" id="gameStage" data-game-stage>
    <div class="game-stage-head">
      <div><p class="eyebrow">MEMORY FIELD</p><h1>记忆翻牌</h1></div>
      <p>先看清正面，记住原形与过去式的位置，再翻回去开始配对。</p>
    </div>
    <section class="game-panel">
      <div class="memory-study-banner" id="studyBanner">
        <div>
          <p class="eyebrow">STUDY FIRST</p>
          <h2>先记住这些配对</h2>
          <p>所有卡片正面朝上。记好位置后，再点击开始配对。</p>
        </div>
        <button class="button button-primary" id="startMatch" type="button">记住了，开始配对</button>
      </div>
      <div class="memory-meta">
        <span>已配对 <strong id="matchedCount">0 / 0</strong></span>
        <span>步数 <strong id="moveCount">0</strong></span>
        <span id="phaseLabel">记忆阶段</span>
      </div>
      <div class="memory-grid is-preview" id="memoryGrid" aria-label="记忆卡片"></div>
      <p class="game-feedback" id="gameFeedback" role="status" aria-live="polite">先观察每张卡片的正面，不要急着翻。</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var U = window.IrregularVerbsUtil;
      var VV = window.VerbVerse;
      var GAME_ID = "memory-flip";
      var selectedVerbs = U.getSelectedVerbs();
      var stage = document.getElementById("gameStage");
      var grid = document.getElementById("memoryGrid");
      var feedback = document.getElementById("gameFeedback");
      var studyBanner = document.getElementById("studyBanner");
      var startMatch = document.getElementById("startMatch");
      var cards = [];
      var openCards = [];
      var matchedPairs = 0;
      var moves = 0;
      var locked = true;
      var studying = true;
      var mismatches = [];
      var pairCount = 0;

      function showEmpty() {
        stage.innerHTML =
          '<section class="game-empty"><p class="eyebrow">EMPTY ATLAS</p><h1>先选择练习词汇</h1>' +
          '<p>词库为空，暂时无法建立记忆场。</p><a class="button button-primary" href="../index.html#wordStudio">前往调整词库</a></section>';
      }

      function firstForm(value) {
        return U.splitForms(value)[0] || String(value || "");
      }

      function pickVerbs() {
        var limit = Math.min(8, Math.max(3, selectedVerbs.length));
        return U.shuffle(selectedVerbs).slice(0, limit);
      }

      function updateProgress() {
        document.getElementById("matchedCount").textContent = matchedPairs + " / " + pairCount;
        document.getElementById("moveCount").textContent = moves;
        document.getElementById("progressLabel").textContent = studying
          ? "记忆中"
          : matchedPairs + " / " + pairCount;
        document.getElementById("progressFill").style.setProperty(
          "--progress",
          pairCount ? Math.round((matchedPairs / pairCount) * 100) + "%" : "0%"
        );
      }

      function makeCardButton(card, position) {
        var button = document.createElement("button");
        var inner = document.createElement("span");
        var back = document.createElement("span");
        var front = document.createElement("span");
        var word = document.createElement("strong");
        var type = document.createElement("span");
        button.type = "button";
        button.className = "memory-card is-preview " + (card.form === "base" ? "is-base" : "is-past");
        button.setAttribute("aria-label", card.text + "，" + card.type + "，记忆中");
        inner.className = "memory-card-inner";
        back.className = "memory-face memory-back";
        back.innerHTML = "<span>VA</span>";
        front.className = "memory-face memory-front";
        word.textContent = card.text;
        type.textContent = card.type;
        front.appendChild(word);
        front.appendChild(type);
        inner.appendChild(back);
        inner.appendChild(front);
        button.appendChild(inner);
        button.addEventListener("click", function () { flipCard(card); });
        card.element = button;
        return button;
      }

      function beginMatching() {
        studying = false;
        locked = false;
        studyBanner.hidden = true;
        grid.classList.remove("is-preview");
        document.getElementById("phaseLabel").textContent = "配对阶段";
        cards.forEach(function (card, index) {
          card.element.classList.remove("is-preview");
          card.element.setAttribute("aria-label", "第 " + (index + 1) + " 张卡片，未翻开");
        });
        feedback.className = "game-feedback";
        feedback.textContent = "卡片已翻回背面。凭记忆找出同一动词的原形与过去式。";
        updateProgress();
        VV.announce("记忆结束，开始配对");
      }

      function flipCard(card) {
        if (studying || locked || card.matched || openCards.indexOf(card) !== -1) return;
        card.element.classList.add("is-flipped");
        card.element.setAttribute("aria-label", card.text + "，" + card.type + "，已翻开");
        openCards.push(card);
        VV.announce(card.text + "，" + card.type);
        if (openCards.length < 2) {
          feedback.className = "game-feedback";
          feedback.textContent = "已翻开「" + card.text + "」，再选择一张卡片。";
          return;
        }
        compareCards();
      }

      function compareCards() {
        var first = openCards[0];
        var second = openCards[1];
        var match = first.pairId === second.pairId && first.form !== second.form;
        moves += 1;
        locked = true;
        VV.recordGameAttempt(GAME_ID, {
          move: moves,
          correct: match,
          answer: first.text + " / " + second.text,
          expected: first.pairId
        });
        if (match) {
          first.matched = true;
          second.matched = true;
          first.element.classList.add("is-matched");
          second.element.classList.add("is-matched");
          first.element.disabled = true;
          second.element.disabled = true;
          matchedPairs += 1;
          openCards = [];
          locked = false;
          feedback.className = "game-feedback is-success";
          feedback.textContent = "配对成功：" + first.text + " ↔ " + second.text;
          updateProgress();
          if (matchedPairs === pairCount) window.setTimeout(finishGame, 520);
          return;
        }
        mismatches.push({ prompt: first.text + " / " + second.text, answer: "不是同一动词" });
        feedback.className = "game-feedback is-error";
        feedback.textContent = "这两张不属于同一动词，记住位置后再试。";
        updateProgress();
        window.setTimeout(function () {
          openCards.forEach(function (item) {
            item.element.classList.remove("is-flipped");
            item.element.setAttribute("aria-label", "记忆卡片，未翻开");
          });
          openCards = [];
          locked = false;
        }, 850);
      }

      function finishGame() {
        document.getElementById("progressLabel").textContent = pairCount + " / " + pairCount;
        document.getElementById("progressFill").style.setProperty("--progress", "100%");
        VV.recordGameSession(GAME_ID, {
          score: pairCount,
          total: pairCount,
          mistakes: mismatches.length,
          moves: moves
        });
        VV.showGameSettlement({
          host: stage,
          title: "记忆场全部配对",
          message: pairCount + " 组原形与过去式已经建立连接，共使用 " + moves + " 步。",
          score: pairCount,
          total: pairCount,
          mistakes: mismatches.slice(0, 10),
          nextHref: "game6-base-past.html"
        });
      }

      if (!selectedVerbs.length) {
        showEmpty();
        return;
      }
      pickVerbs().forEach(function (verb, index) {
        pairCount += 1;
        cards.push({
          id: verb.id + "-base-" + index,
          pairId: verb.id,
          text: verb.base,
          type: "原形 · BASE",
          form: "base",
          matched: false,
          element: null
        });
        cards.push({
          id: verb.id + "-past-" + index,
          pairId: verb.id,
          text: firstForm(verb.past),
          type: "过去式 · PAST",
          form: "past",
          matched: false,
          element: null
        });
      });
      cards = U.shuffle(cards);
      cards.forEach(function (card, index) {
        grid.appendChild(makeCardButton(card, index));
      });
      startMatch.addEventListener("click", beginMatching);
      updateProgress();
    })();
  </script>
</body>
</html>
