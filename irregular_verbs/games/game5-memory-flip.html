<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>记忆翻牌 · 不规则动词</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="../../scripts/auth-check.js"></script>
  <script src="../verbs-data.js"></script>
  <script src="../shared.js"></script>
  <style>
    :root{--bg:#0c1222;--surface:#151d2e;--accent:#3b82f6;--ok:#22c55e;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(148,163,184,0.15)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans SC","DM Sans",sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);padding:1rem}
    .toolbar{display:flex;justify-content:space-between;margin-bottom:1rem}
    .toolbar a{color:var(--muted);text-decoration:none;font-size:0.85rem}
    .meta{text-align:center;font-size:0.85rem;color:var(--muted);margin-bottom:1rem}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;max-width:480px;margin:0 auto}
    @media(max-width:400px){.grid{grid-template-columns:repeat(3,1fr)}}
    .card{aspect-ratio:1;border-radius:10px;cursor:pointer;perspective:600px}
    .card-inner{position:relative;width:100%;height:100%;transition:transform 0.4s;transform-style:preserve-3d}
    .card.flipped .card-inner{transform:rotateY(180deg)}
    .card.matched{opacity:0.5;pointer-events:none}
    .face{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border:2px solid var(--border);padding:0.35rem;text-align:center}
    .face.back{background:linear-gradient(135deg,#3b82f6,#8b5cf6);font-size:1.2rem}
    .face.front{background:var(--surface);transform:rotateY(180deg);font-family:"DM Sans",sans-serif;font-size:0.82rem;font-weight:700;line-height:1.3}
    .face.front .type{font-size:0.6rem;color:var(--muted);display:block;margin-top:0.2rem}
    .win{text-align:center;margin-top:1.5rem;font-size:1.1rem;color:var(--ok);display:none}
  </style>
</head>
<body>
  <div class="toolbar"><a href="index.html"><i class="fas fa-arrow-left"></i> 游戏列表</a></div>
  <p class="meta">翻开卡片，配对同一动词的 <strong>原形</strong> 与 <strong>过去式</strong> · 步数 <span id="moves">0</span></p>
  <div class="grid" id="grid"></div>
  <p class="win" id="winMsg">🎉 全部配对成功！</p>
  <script>
  (function(){
    var U=window.IrregularVerbsUtil,verbs=U.getSelectedVerbs();
    if(!verbs.length){alert("请先选择词汇");location.href="../index.html";return;}
    var picked=U.shuffle(verbs).slice(0,Math.min(6,verbs.length));
    var cards=[];
    picked.forEach(function(v){
      cards.push({id:v.id+"-b",pair:v.id,text:v.base,type:"原形"});
      cards.push({id:v.id+"-p",pair:v.id,text:v.past.split(/\s*\/\s*/)[0],type:"过去式"});
    });
    cards=U.shuffle(cards);
    var grid=document.getElementById("grid"),flipped=[],matched=0,moves=0,lock=false;

    cards.forEach(function(c){
      var el=document.createElement("div");el.className="card";
      el.innerHTML='<div class="card-inner"><div class="face back">?</div><div class="face front">'+c.text+'<span class="type">'+c.type+'</span></div></div>';
      el.addEventListener("click",function(){
        if(lock||el.classList.contains("flipped")||el.classList.contains("matched"))return;
        el.classList.add("flipped");flipped.push({el:el,card:c});
        if(flipped.length===2){
          moves++;document.getElementById("moves").textContent=moves;lock=true;
          if(flipped[0].card.pair===flipped[1].card.pair){
            flipped.forEach(function(f){f.el.classList.add("matched");});
            matched++;flipped=[];lock=false;
            if(matched===picked.length){document.getElementById("winMsg").style.display="block";setTimeout(function(){location.href="index.html";},2000);}
          }else{
            setTimeout(function(){
              flipped.forEach(function(f){f.el.classList.remove("flipped");});
              flipped=[];lock=false;
            },900);
          }
        }
      });
      grid.appendChild(el);
    });
  })();
  </script>
</body>
</html>
