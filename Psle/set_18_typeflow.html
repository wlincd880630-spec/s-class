词的形式由离它最近的名词决定。本句中，离空格最近的名词是 `any fruit`。`fruit` 在此作不可数名词，视为单数。因此，动词应使用单数形式。综上所述，正确答案是 `wasn't`。","knowledge_expansion_md":"### There be 句型的主谓一致：就近原则\n\n`There be` 句型用于表示“某地有某物”，其真正的“主语”是跟在 `be` 动词后面的名词。`be` 动词的单复数形式和时态需要根据这个“主语”来决定。\n\n**核心规则：就近原则 (Principle of Proximity)**\n当 `be` 动词后跟有两个或多个名词（通常由 `and`, `or`, `nor` 等连接）时，`be` 动词的形式与**离它最近的那个名词**的单复数形式保持一致。\n\n**举例说明：**\n*   `There **is** a book and two pens on the desk.` (动词 `is` 与最近的 `a book` 保持一致)\n*   `There **are** two pens and a book on the desk.` (动词 `are` 与最近的 `two pens` 保持一致)\n*   `There **wasn't** any milk or eggs in the fridge.` (动词 `wasn't` 与最近的不可数名词 `milk` 保持一致)\n*   `There **weren't** any eggs or milk in the fridge.` (动词 `weren't` 与最近的复数名词 `eggs` 保持一致)\n\n**本题分析：**\n`There _____ any fruit or a lot of vegetables...`\n1.  **时态**：`just now` → 过去时。\n2.  **句式**：`any` → 否定句。\n3.  **就近原则**：离动词最近的是 `fruit`。`fruit` 在此为不可数名词，按单数处理。\n4.  **结论**：过去时 + 否定 + 单数 → `wasn't`。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"句子里有没有表示时间的词？它告诉我们应该用什么时态？","hint":"找到 `just now` 这个词组，它的意思是“刚才”。","takeaway":"`just now` (刚才) 表明句子应该使用一般过去时。"},{"question":"`be` 动词的一般过去时有哪两种形式？它们分别和什么样的主语搭配？","hint":"一种用于单数主语，一种用于复数主语。","takeaway":"`be` 动词的过去时形式是 `was` (用于单数主语) 和 `were` (用于复数主语)。"}]},{"title":"主谓一致：就近原则","steps":[{"question":"在 `There be` 句型中，动词 `be` 的单复数形式由谁决定？","hint":"是由句首的 `There` 决定，还是由 `be` 后面的名词决定？","takeaway":"`There be` 句型的主谓一致遵循“就近原则”，即 `be` 动词的形式由离它最近的名词的单复数决定。"},{"question":"在这个句子里，离 `be` 动词最近的名词是什么？它是单数还是复数？","hint":"看 `any fruit or a lot of vegetables` 这一部分，哪个词紧挨着空格？`fruit` 在这里是可数还是不可数？","takeaway":"离空格最近的是 `any fruit`，`fruit` 在此作不可数名词，应视为单数。"}]},{"title":"句子结构与形式","steps":[{"question":"看到句子中的 `any`，你觉得这个句子应该是肯定句、否定句还是疑问句？","hint":"`any` 通常用在什么类型的句子中？而 `some` 通常用在肯定句中。","takeaway":"`any` 通常用于否定句和疑问句，所以这里应该填否定形式。"},{"question":"综合以上三点：过去时、单数主语（就近原则）、否定句，`be` 动词应该用什么最终形式？","hint":"把“过去时”、“单数”和“否定”这三个要素组合起来。","takeaway":"结合过去时、就近原则的单数以及否定句的要求，最终答案是 `wasn't`。"}]}]},"answer_area_hint":"横线"},{"number":"28","item_type":"fill_blank","context_note":"","stem":"I _____ (watch) TV last night.","options":{},"teaching":{"correct_answer":"watched","explanation_md":"本题考查一般过去时中规则动词的变化。句中的时间状语“last night”（昨晚）是明确的过去时间标志，表明这个句子描述的是过去发生的动作，因此谓语动词需要使用一般过去时。括号中给出的动词“watch”是一个规则动词。规则动词的过去式通常是在动词原形后直接加“-ed”。所以，“watch”的过去式是“watched”。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n一般过去时用于描述在过去某个时间点或时间段内发生并完成的动作或存在的状态。\n\n**标志词：**\n常与表示过去的时间状语连用，如：\n*   `yesterday` (昨天)\n*   `last night/week/year` (昨晚/上周/去年)\n*   `... ago` (…以前)，如 `two days ago`\n*   `in 2010` (在2010年)\n*   `just now` (刚才)\n\n**动词变化：**\n谓语动词需要变为过去式。动词过去式分为规则变化和不规则变化。\n\n**1. 规则动词过去式变化规则：**\n*   **一般情况**：直接加 `-ed` (如 `watch` → `watched`, `work` → `worked`)\n*   **以e结尾**：只加 `-d` (如 `like` → `liked`, `live` → `lived`)\n*   **以“辅音字母+y”结尾**：变 `y` 为 `i`，再加 `-ed` (如 `study` → `studied`, `carry` → `carried`)\n*   **重读闭音节结尾，末尾只有一个辅音字母**：双写该辅音字母，再加 `-ed` (如 `stop` → `stopped`, `plan` → `planned`)\n\n**2. 不规则动词：**\n没有统一规律，需要单独记忆 (如 `go` → `went`, `see` → `saw`, `eat` → `ate`, `is/am` → `was`, `are` → `were`)。","socratic_tracks":[{"title":"抓住时态标志词","steps":[{"question":"句子中哪个词或词组告诉我们这个动作发生的时间？","hint":"找一找表示“昨天”、“去年”这类过去的词。","takeaway":"`last night` (昨晚) 是一个明确的过去时间状语。"},{"question":"既然是表示过去发生的动作，我们应该使用什么时态？","hint":"描述过去的事情，用现在时、将来时还是过去时？","takeaway":"应该使用一般过去时。"}]},{"title":"动词形式变化","steps":[{"question":"我们确定了要用一般过去时，那么动词 `watch` 应该如何变化？它是规则动词还是不规则动词？","hint":"大部分动词都是规则动词，不规则动词需要特殊记忆，比如 `go-went`, `see-saw`。`watch` 在不在你背过的不规则列表里？","takeaway":"`watch` 是一个规则动词。"},{"question":"规则动词变过去式最常见的方法是什么？","hint":"想想 `work`, `play`, `clean` 这些词的过去式。","takeaway":"规则动词的过去式通常是在词尾加 `-ed`。"},{"question":"所以，`watch` 的过去式是什么？","hint":"直接在 `watch` 后面加上 `ed`。","takeaway":"`watch` 的过去式是 `watched`。"}]},{"title":"句子意义与结构","steps":[{"question":"这个句子的主语和谓语动词分别是什么？","hint":"谁(主语)做了什么动作(谓语)？","takeaway":"主语是 `I` (我)，谓语动词是 `watch` (看)。"},{"question":"整个句子 `I _____ TV last night.` 想要表达什么意思？","hint":"把主语、谓语、宾语和时间状语连起来翻译一下。","takeaway":"句子想表达“我昨晚看电视了”。"},{"question":"为了表达“看过了”这个已经完成的过去动作，动词 `watch` 必须变成什么形式？","hint":"对应中文里的“了”，英文动词需要进行时态变化。","takeaway":"为了表示过去的动作，动词 `watch` 必须使用其过去式 `watched`。"}]}]},"answer_area_hint":"横线"},{"number":"29","item_type":"fill_blank","context_note":"","stem":"Pipi wants _____ (be) a doctor. He wants _____ (help) people.","options":{},"teaching":{"correct_answer":"to be|to help","explanation_md":"本题考查固定搭配 `want to do sth.`，意为“想要做某事”。动词 `want` 后面需要跟动词不定式（to + 动词原形）作宾语。因此，第一个空应填入 `to be`，表示“想要成为”；第二个空应填入 `to help`，表示“想要帮助”。整个句子表达了 Pipi 的愿望和计划。","knowledge_expansion_md":"### 动词 + to do 结构\n\n在英语中，很多动词后面习惯跟动词不定式（to do）作宾语，表示一个计划、愿望、决定或目的。除了 `want to do` 之外，常见的还有：\n\n*   `need to do` (需要做某事)\n*   `hope to do` (希望做某事)\n*   `plan to do` (计划做某事)\n*   `decide to do` (决定做某事)\n*   `learn to do` (学习做某事)\n*   `try to do` (尽力做某事)\n\n**易错点对比**：\n\n*   **接不定式 vs. 接动名词**：有些动词后面跟动名词（doing），如 `enjoy doing` (享受做某事), `finish doing` (完成做某事), `mind doing` (介意做某事)。例如：`I enjoy playing football.`\n*   **两者都可接，意义不同**：`stop to do` (停下来去做另一件事) vs. `stop doing` (停止正在做的事)。例如：`He stopped to smoke.` (他停下来去抽烟) vs. `He stopped smoking.` (他戒烟了)。","socratic_tracks":[{"title":"want 的固定用法","steps":[{"question":"在英语中，当我们说“想要做某事”时，动词 `want` 后面跟的另一个动词应该是什么形式呢？","hint":"回忆一下“我想去公园”这句话怎么说？是 `I want go to the park` 还是 `I want to go to the park`？","takeaway":"动词 `want` 后面要跟动词不定式，即 `to + 动词原形`。"},{"question":"根据这个规则，第一个括号里的 `(be)` 应该变成什么？","hint":"`be` 的动词原形就是 `be`，它的不定式形式是什么？","takeaway":"第一个空应该填 `to be`。"},{"question":"同样地，第二个括号里的 `(help)` 应该变成什么？","hint":"它也是跟在 `wants` 后面的动作。","takeaway":"第二个空也应该使用不定式，填 `to help`。"}]},{"title":"动词不定式作宾语","steps":[{"question":"在句子 `Pipi wants...` 中，`wants` 是什么成分？","hint":"它是一个表示“想要”的动作。","takeaway":"`wants` 是句子的谓语动词。"},{"question":"谓语动词后面，回答“做什么”或“是什么”的部分，我们称之为什么成分？","hint":"比如 `I like apples.` 中，`apples` 就是宾语。","takeaway":"谓语动词后面跟的是宾语。"},{"question":"当一个动作（如“成为”或“帮助”）要作为另一个动词（如`want`）的宾语时，我们通常需要把这个动作变成什么形式？","hint":"在英语中，动词不能直接做另一个动词的宾语，需要进行形式上的变化。","takeaway":"当动词作宾语时，常需变为不定式 `to do` 或动名词 `-ing` 形式，而 `want` 后面固定跟不定式。"}]},{"title":"从句意理解语法","steps":[{"question":"这句话想表达什么意思？Pipi 的愿望是什么？","hint":"把句子翻译成中文：Pipi 想要...一个医生。他想要...人们。","takeaway":"Pipi 想要成为一名医生，并且想要帮助人们。"},{"question":"“成为医生”和“帮助人们”是已经发生的事，还是 Pipi 的一个愿望或计划？","hint":"动词 `wants`（想要）暗示了这是一个未来的想法。","takeaway":"这是一个对未来的愿望或计划。"},{"question":"在英语中，哪个语法结构常常用来表示一个对未来的、计划中的或希望的动作？","hint":"是 `to + 动词原形` 还是 `动词-ing` 形式？","takeaway":"动词不定式 `to do` 常常用来表示目的、计划或愿望。"}]}]},"answer_area_hint":"横线"},{"number":"30","item_type":"fill_blank","context_note":"","stem":"Let's finish _____ (they) _____ (quick).","options":{},"teaching":{"correct_answer":"them|quickly","explanation_md":"本题考查人称代词的宾格和副词的用法。\n1. 第一个空位于及物动词 `finish` 之后，需要一个宾语。人称代词 `they` 作宾语时，必须使用其宾格形式 `them`。\n2. 第二个空是用来修饰动词 `finish` 的，说明完成这个动作的方式是“快地”。因此，需要使用形容词 `quick` 对应的副词形式 `quickly`。\n整个句子的意思是“让我们快点完成它们吧”。","knowledge_expansion_md":"### 人称代词的格\n人称代词在句子中作不同成分时，有不同的形式，主要是主格和宾格。\n*   **主格**：作主语。如：**I, you, he, she, it, we, they**\n*   **宾格**：作动词或介词的宾语。如：**me, you, him, her, it, us, them**\n例如：**He** teaches **us**. (他教我们。`He`是主语，`us`是宾语。)\n\n### 形容词与副词\n*   **形容词 (Adjective)**: 修饰名词或代词，说明其性质或状态。通常放在名词前或系动词后。例：a **quick** runner, He is **quick**.\n*   **副词 (Adverb)**: 修饰动词、形容词、其他副词或整个句子，说明动作的方式、程度、时间、地点等。很多副词由“形容词+ly”构成。\n    *   修饰动词：He runs **quickly**. (他跑得快。)\n    *   修饰形容词：He is **very** quick. (他非常快。)\n*   **不规则变化**：`good` (形) -> `well` (副), `fast` (形/副同形), `hard` (形/副同形)。","socratic_tracks":[{"title":"人称代词的宾格","steps":[{"question":"在句子 `Let's finish...` 中，`finish` (完成) 是一个动作，它需要一个承受者，也就是宾语。第一个空 `(they)` 在这里应该做什么成分？","hint":"我们“完成”的是什么？","takeaway":"第一个空在动词 `finish` 后面，应该作宾语。"},{"question":"当人称代词 `they` 在句子中作宾语时，应该用什么形式？","hint":"想一想，“我爱他”是 `I love he` 还是 `I love him`？","takeaway":"人称代词作宾语时要用宾格形式，`they` 的宾格是 `them`。"}]},{"title":"副词的用法","steps":[{"question":"第二个空 `(quick)` 是用来描述什么的？是描述“它们”(`them`)，还是描述“完成”(`finish`)这个动作？","hint":"句子的意思是“快地完成”还是“快的它们”？","takeaway":"这个词是用来描述 `finish` 这个动作的方式的。"},{"question":"在英语中，用来修饰动词的词叫什么？","hint":"形容词修饰名词，那么什么词修饰动词呢？","takeaway":"用来修饰动词的词是副词。"},{"question":"形容词 `quick` 对应的副词形式是什么？","hint":"大多数形容词变副词，都是在词尾加上 `-ly`。","takeaway":"`quick` 的副词形式是 `quickly`。"}]},{"title":"句子成分分析","steps":[{"question":"`Let's finish...` 是一个什么类型的句子？它在表达什么？","hint":"它以 `Let's` 开头，是向对方提出一个建议。","takeaway":"这是一个祈使句，用来提出建议。"},{"question":"在这个句子里，谓语动词是 `finish`。那么，一个完整的句子需要告诉我们“完成什么”和“怎么样完成”。这两个部分分别叫什么成分？","hint":"“完成什么”是动作的对象，“怎么样完成”是动作的方式。","takeaway":"“完成什么”是宾语，“怎么样完成”是状语。"},{"question":"那么，`(they)` 应该变成什么形式来作宾语？`(quick)` 应该变成什么形式来作状语？","hint":"回顾一下人称代词宾格和副词的规则。","takeaway":"作宾语时，`they` 变为 `them`；作状语时，`quick` 变为 `quickly`。"}]}]},"answer_area_hint":"横线"}]},{"section_title":"III. 完成句子。(共10分)","section_instruction":"","items":[{"number":"31","item_type":"fill_blank","context_note":"","stem":"Some students are watching a football match. They are very _____ (兴奋的).","options":{},"teaching":{"correct_answer":"excited","explanation_md":"本题考查描述人感受的形容词。括号中的中文提示是“兴奋的”。在英语中，`be` 动词（如此处的 `are`）后面常跟形容词作表语，用来说明主语的状态。主语 `They` 指的是学生们，要描述人“感到兴奋”这种情绪，应该使用以 `-ed` 结尾的形容词 `excited`。如果是形容事物“令人兴奋”，则用 `-ing` 结尾的 `exciting`。","knowledge_expansion_md":"### -ed 形容词 vs. -ing 形容词\n\n这是一个非常重要且常见的考点。区分它们的关键在于看它们修饰的对象。\n\n1.  **-ed 形容词**：通常用来**修饰人**（或有情感的动物），描述其**内心的感受或情绪**。可以理解为“感到...的”。\n    *   `I am **bored**.` (我感到很无聊。)\n    *   `She is **interested** in music.` (她对音乐感兴趣。)\n    *   `The dog is **frightened**.` (这只狗被吓到了。)\n\n2.  **-ing 形容词**：通常用来**修饰事物**，或者**描述人/事物的性质**，说明其本身是“**令人...的**”。\n    *   `This book is **boring**.` (这本书很无聊。)\n    *   `The music is **interesting**.` (这音乐很有趣。)\n    *   `The news was **surprising**.` (这个消息令人惊讶。)\n\n**记忆口诀**：`ed` 感 `ing` 令（-ed 结尾的形容词表示“感到”，-ing 结尾的形容词表示“令人”）。","socratic_tracks":[{"title":"-ed 与 -ing 形容词辨析","steps":[{"question":"我们要描述学生们 `They` 的感受，他们是自己“感到兴奋”，还是“令人兴奋”？","hint":"主语是人，这里描述的是人的情绪。","takeaway":"这里是描述学生们自己内心的感受，即“感到兴奋”。"},{"question":"在英语中，描述人自身感受的形容词，通常是以 `-ed` 结尾还是以 `-ing` 结尾？","hint":"想一想“我对...感兴趣”是 `I am interested` 还是 `I am interesting`？","takeaway":"描述人自身感受时，通常用以 `-ed` 结尾的形容词。"},{"question":"那么，如果我想形容这场足球比赛 `the football match` 本身很精彩、很“令人兴奋”，应该用哪个词？","hint":"这时是描述事物的性质，它“令人”产生某种感觉。","takeaway":"形容事物“令人兴奋”时，应该用 `exciting`，例如 `an exciting match`。"}]},{"title":"主系表结构","steps":[{"question":"观察句子 `They are very _____`。这里的 `are` 是什么动词？","hint":"它是 `be` 动词的一种形式，用来连接主语和后面的部分。","takeaway":"`are` 是系动词。"},{"question":"系动词后面通常跟什么词性的词，来构成“主语-系动词-表语”结构，用以说明主语的性质或状态？","hint":"比如 `She is happy.` 中的 `happy` 是什么词性？","takeaway":"系动词后面通常跟形容词或名词作表语。"},{"question":"结合中文提示“兴奋的”，我们需要在这里填一个什么性质的英文单词？","hint":"词性和词义都要考虑。","takeaway":"我们需要填入一个表示“兴奋的”形容词，即 `excited`。"}]},{"title":"词汇与语境","steps":[{"question":"“兴奋的”这个中文词，在英语里对应的词根是什么？","hint":"这个词与 `excitement` (名词) 和 `exciting` (形容词) 有关。","takeaway":"对应的词根是 `excite`。"},{"question":"根据句意“学生们看球赛时很兴奋”，我们应该选择 `excite` 的哪种形容词形式？","hint":"是描述人的感受，还是事物的性质？","takeaway":"应该选择描述人感受的 `excited`。"},{"question":"把 `excited` 填入句子中，`They are very excited.` 读一读，是否通顺？是否符合我们刚刚讨论的语法规则？","hint":"主语是人 `They`，`excited` 用来形容人的感受，完全正确。","takeaway":"这个句子是完全正确且地道的，准确表达了学生们兴奋的状态。"}]}]},"answer_area_hint":"横线"},{"number":"32","item_type":"fill_blank","context_note":"","stem":"Chinese people have the Labour Day holiday in M_____.","options":{},"teaching":{"correct_answer":"May","explanation_md":"本题考查月份的英文拼写和专有名词大写规则。根据生活常识，“Labour Day”（劳动节）是在五月份。题干给出了首字母提示 `M`，因此可以确定是五月 `May`。在英语中，月份属于专有名词，其首字母必须大写，所以正确答案是 `May`。","knowledge_expansion_md":"### 英语中的月份 (Months of the Year)\n\n英语中的十二个月份都是专有名词，书写时首字母必须大写。\n\n*   一月: January (Jan.)\n*   二月: February (Feb.)\n*   三月: March (Mar.)\n*   四月: April (Apr.)\n*   五月: **May** (无缩写)\n*   六月: June (Jun.)\n*   七月: July (Jul.)\n*   八月: August (Aug.)\n*   九月: September (Sep.)\n*   十月: October (Oct.)\n*   十一月: November (Nov.)\n*   十二月: December (Dec.)\n\n### 时间介词 `in`, `on`, `at`\n\n*   `in`: 用于较长的时间，如年份、季节、月份。例如：`in 2024`, `in summer`, `in May`。\n*   `on`: 用于具体的某一天或日期。例如：`on Monday`, `on May 1st`, `on my birthday`。\n*   `at`: 用于具体的时刻。例如：`at 8 o'clock`, `at noon`。","socratic_tracks":[{"title":"月份与节日常识","steps":[{"question":"题目中的 `Labour Day` 是指中国的哪个法定假日？","hint":"`Labour` 的意思是“劳动”。","takeaway":"`Labour Day` 是指“劳动节”。"},{"question":"根据你的生活常识，中国的劳动节是在几月份？","hint":"我们通常说的“五一”假期。","takeaway":"劳动节是在五月。"},{"question":"“五月”的英文单词是什么？题目已经给了首字母 `M` 作为提示。","hint":"这是一个只有三个字母的单词。","takeaway":"“五月”的英文是 `May`。"}]},{"title":"专有名词大写规则","steps":[{"question":"在英语中，像星期（Monday）、国家（China）、人名（Tom）这类有特定名称的词，我们称为什么？","hint":"它们是独一无二的名称，不是泛指。","takeaway":"这类词被称为专有名词。"},{"question":"专有名词在书写时，有一个非常重要的规则是什么？","hint":"观察一下 `Chinese people` 和 `Labour Day` 的首字母。","takeaway":"专有名词的首字母必须大写。"},{"question":"月份的名称（比如五月）属于专有名词吗？我们填写的 `May` 需要大写吗？","hint":"是的，月份和星期一样，都是专有名词。","takeaway":"月份是专有名词，所以 `May` 的首字母 `M` 必须大写。"}]},{"title":"时间介词的用法","steps":[{"question":"句子中 `in M_____` 的 `in` 是一个什么词？它在这里起什么作用？","hint":"它表示“在...（时间）里”。","takeaway":"`in` 是一个介词，在这里用来表示时间。"},{"question":"在表示时间时，介词 `in` 通常用在哪些词的前面？","hint":"比如年份、季节、月份。","takeaway":"`in` 常用于表示“在某年”、“在某季节”或“在某月”。"},{"question":"如果我们想表达一个更具体的时间，比如“在五月一日”，我们还用 `in` 吗？应该用哪个介词？","hint":"想一想“在星期一”怎么说？`on Monday`。","takeaway":"对于具体的某一天，我们应该用介词 `on`，例如 `on May 1st`。"}]}]},"answer_area_hint":"横线"},{"number":"33","item_type":"fill_blank","context_note":"","stem":"Last week my brother b_____ me a present from Beijing.","options":{},"teaching":{"correct_answer":"bought","explanation_md":"本句意为“上周我哥哥从北京给我买了一件礼物”。\n1.  根据句中的时间状语 “Last week”（上周），可知本句应使用一般过去时。\n2.  结合语境“给我一件礼物”，横线处应填入一个表示“购买”或“带来”的动词。\n3.  题干提示动词首字母为 'b'。\n4.  动词 “buy”（购买）的过去式是 “bought”，符合语境和时态要求。\n5.  动词 “bring”（带来）的过去式是 “brought”，虽然也符合语境，但 “bought” 更符合 `b_____` 的拼写长度（6个字母）。","knowledge_expansion_md":"### 1. 不规则动词过去式\n英语中许多常用动词的过去式是不规则变化的，需要特别记忆。尤其是一些拼写相似、容易混淆的词，例如：\n- **buy (买) → bought**\n- **bring (带来) → brought**\n- think (思考) → thought\n- teach (教) → taught\n- catch (抓住) → caught\n\n### 2. 双宾语结构 (Double Object Construction)\n本句中的 `buy sb sth` (给某人买某物) 是一种典型的双宾语结构，即动词后面跟两个宾语：间接宾语 (通常是人 `sb`) 和直接宾语 (通常是物 `sth`)。\n- **结构**: `动词 + 间接宾语 + 直接宾语`\n- **例句**: My brother **bought me a present**.\n\n### 3. 双宾语结构转换\n双宾语结构可以转换为 `动词 + 直接宾语 + 介词 + 间接宾语` 的结构。此时需要注意介词的选择，`buy` 通常和 `for` 搭配。\n- **buy sth for sb**: My brother bought a present **for** me.\n- **用 `to` 的动词**: give, send, show, lend, pass (e.g., He gave a book **to** me.)\n- **用 `for` 的动词**: buy, make, cook, get (e.g., She made a cake **for** him.)","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"句子中哪个词或短语告诉我们这件事是什么时候发生的？","hint":"请注意句子的开头部分，有没有表示时间的词？","takeaway":"时间状语 “Last week” (上周) 表明句子应该使用一般过去时。"},{"question":"既然是过去发生的事情，那么横线上应该填动词的什么形式？","hint":"动词有原形、现在分词、过去式、过去分词等不同形式。","takeaway":"描述过去发生的确定动作，需要使用动词的过去式。"}]},{"title":"选择合适的动词","steps":[{"question":"根据句子“哥哥...我一件礼物”的含义，你觉得哥哥对礼物做了什么动作？","hint":"可以是“买”、“带”、“送”等动作。","takeaway":"结合生活实际，哥哥可能是“买”了礼物，也可能是“带”来了礼物。"},{"question":"题干提示这个动词以 'b' 开头，你能想到哪些相关的英文动词？","hint":"“买”的英文是 buy，“带来”的英文是 bring。","takeaway":"我们可以考虑 buy (买) 或 bring (带来) 这两个动词。"},{"question":"结合过去时态，buy 和 bring 的过去式分别是什么？它们是否符合 `b_____` 的拼写形式？","hint":"buy 的过去式是 bought，bring 的过去式是 brought。可以数一数它们的字母个数。","takeaway":"bought 恰好是6个字母，符合 `b_____` 的形式，而 brought 是7个字母，不符合。"}]},{"title":"认识双宾语结构","steps":[{"question":"在 \"My brother b_____ me a present\" 这个结构中，动词后面跟了几个事物？","hint":"动词后面有 \"me\" (我) 和 \"a present\" (一件礼物)。","takeaway":"这个动词后面跟了两个宾语：“me” 和 “a present”。"},{"question":"这种“动词 + 某人 + 某物”的结构叫什么？你还知道哪些动词可以这样用吗？","hint":"想想“给我一本书”(give me a book)，“教我英语”(teach me English) 的说法。","takeaway":"这叫双宾语结构，常见的动词还有 give, send, show, teach 等。"}]}]},"answer_area_hint":"横线"},{"number":"34","item_type":"fill_blank","context_note":"","stem":"I must study hard and read more books because I want to be a s_____ some day.","options":{},"teaching":{"correct_answer":"scientist","explanation_md":"1.  根据句意“我必须努力学习、多读书，因为我想有一天成为一名...”，横线处应填入一个表示职业或身份的名词。\n2.  这个职业或身份需要通过“努力学习”和“多读书”来实现，说明它需要丰富的知识。\n3.  横线处单词以字母 's' 开头。\n4.  在常见的职业中，`scientist` (科学家) 最符合这一语境，是很多学生的理想，并且需要大量的学习和阅读。\n5.  虽然 `scholar` (学者) 意思也通，但在小升初阶段 `scientist` 是更常用和具体的词汇。","knowledge_expansion_md":"### 1. 职业相关词汇\n英语中有很多表示职业的词汇，掌握它们有助于更好地表达个人理想。很多职业词汇有固定的后缀：\n- **-ist**: `scientist` (科学家), `artist` (艺术家), `pianist` (钢琴家)\n- **-er/-or**: `teacher` (教师), `writer` (作家), `doctor` (医生), `actor` (演员)\n- **-ian**: `musician` (音乐家), `magician` (魔术师)\n\n### 2. 表达未来的愿望\n句型 `I want to be a/an...` 是表达未来理想和职业规划的常用方式。其中 `want to do sth` 意为“想要做某事”。\n- `I want to be an engineer.` (我想成为一名工程师。)\n- `She wants to be a dancer.` (她想成为一名舞蹈家。)\n\n### 3. `because` 连接原因状语从句\n`because` 是一个连词，用来引导原因状语从句，解释主句行为的原因。“努力学习和多读书”是行为，“想成为科学家”是其原因。","socratic_tracks":[{"title":"根据原因推断结果","steps":[{"question":"句子中 “because” 前半部分说了要做什么？","hint":"请看 “because” 前面的两个动作：study hard and read more books。","takeaway":"句子前半部分说“必须努力学习和多读书”。"},{"question":"那么，“努力学习和多读书”通常是为了实现一个什么样的目标呢？","hint":"想一想，什么样的人需要具备丰富的知识？","takeaway":"这个目标应该是一个需要广博知识的身份或职业。"},{"question":"结合首字母 's'，你能想到哪个职业最需要“努力学习和多读书”吗？","hint":"比如，科学家、学者等。哪一个在课本里更常见？","takeaway":"“科学家”(scientist) 是一个非常符合逻辑且常见的答案。"}]},{"title":"联想职业词汇","steps":[{"question":"看到“study hard”和“read books”，你会联想到哪些与知识、学习相关的英文单词？","hint":"比如“科学”(science)、“学校”(school)、“学习”(study)。","takeaway":"我们可以联想到 science, school, study, knowledge 等词。"},{"question":"题目要求填一个以 's' 开头的职业名词，你能在刚才联想的词基础上，构造一个职业名词吗？","hint":"比如，在“科学”(science) 后面加上表示“...家”的后缀。","takeaway":"在 `science` 后面加上后缀 `-ist` 就可以得到 `scientist` (科学家)。"}]},{"title":"理解愿望的表达","steps":[{"question":"“I want to be a...” 这个句型是用来做什么的？","hint":"当你说 “I want a toy” 时，你在表达什么？","takeaway":"这个句型是用来表达自己未来的愿-望或理想。"},{"question":"作为一个学生，当你说“我必须努力学习”时，通常是为实现一个什么样的愿望？","hint":"你的理想是什么？想成为一个什么样的人？","takeaway":"通常是为了将来能成为一个有知识、有成就的人，比如从事某个专业性强的职业。"},{"question":"那么，在众多以 's' 开头的职业中，哪一个最能代表通过学习和阅读实现的成就？","hint":"是歌手 (singer)？士兵 (soldier)？还是科学家 (scientist)？","takeaway":"科学家 (scientist) 最能体现通过学习和阅读所取得的成就。"}]}]},"answer_area_hint":"横线"},{"number":"35","item_type":"fill_blank","context_note":"","stem":"The fish _____ (品尝起来) very nice. I like it very much.","options":{},"teaching":{"correct_answer":"tastes","explanation_md":"1.  本句意为“这鱼尝起来很美味”，括号中的中文提示是“品尝起来”。\n2.  “尝起来”在英文中对应感官系动词 `taste`。这类动词用于连接主语和表语，说明主语的性质或状态。\n3.  本句描述的是一个客观事实或当前感受，应使用一般现在时。\n4.  句子的主语 `The fish` 是第三人称单数（可以被 `it` 替代）。\n5.  根据主谓一致原则，当主语是第三人称单数且时态为一般现在时，谓语动词需要加 `-s`。\n6.  因此，`taste` 应变为 `tastes`。","knowledge_expansion_md":"### 1. 感官系动词 (Sensory Linking Verbs)\n英语中有一类特殊的系动词，叫感官系动词，用来描述主语给人的感觉。它们后面通常跟形容词作表语，构成“主系表”结构。\n- `look` (看起来): You **look** beautiful.\n- `sound` (听起来): That **sounds** great.\n- `smell` (闻起来): The flower **smells** sweet.\n- `taste` (尝起来): The soup **tastes** delicious.\n- `feel` (摸起来；感觉): The silk **feels** soft. / I **feel** happy.\n\n### 2. 一词多用：系动词 vs. 实义动词\n这些感官动词除了作系动词，也可以作实义动词（及物动词），表示一个具体的动作。需要根据句意判断。\n- **系动词**: The apple **tastes** sour. (这个苹果尝起来是酸的。) - *描述苹果本身的味道*\n- **实义动词**: Let me **taste** the soup. (让我尝尝这个汤。) - *表示“我”要做的动作*\n\n### 3. 主谓一致 (Subject-Verb Agreement)\n在一般现在时中，当主语是第三人称单数（如 he, she, it, a single noun）时，谓语动词需要进行相应变化，通常是加 `-s` 或 `-es`。本题中主语 `The fish` 是单数，所以 `taste` 变成 `tastes`。","socratic_tracks":[{"title":"确定动词形式","steps":[{"question":"这句话描述的是鱼的味道，是一个当前的事实还是过去的事情？我们应该用什么时态？","hint":"后半句 “I like it very much” 用的是一般现在时，说明是当下的感受。","takeaway":"描述一个客观味道或当前感受，应该使用一般现在时。"},{"question":"句子的主语是 “The fish”，它是第几人称？是单数还是复数？","hint":"在没有特指多条鱼的情况下，通常指代“鱼肉”或“一条鱼”，是单数。它可以用 \"it\" 来代替。","takeaway":"主语 “The fish” 在此是第三人称单数。"},{"question":"在一般现在时中，当主语是第三人称单数时，谓语动词有什么变化？","hint":"想想 “He likes...” 和 “I like...” 的区别。","takeaway":"当主语是第三人称单数时，动词末尾需要加-s或-es。"}]},{"title":"理解感官动词","steps":[{"question":"中文提示是“品尝起来”，你认为应该用哪个英文动词来表达？","hint":"“味道”的英文是 taste。","takeaway":"我们可以用动词 `taste` 来表示“尝起来”的味道。"},{"question":"在 “The fish tastes nice” 和 “I taste the fish” 这两句话中，“taste” 的意思和用法一样吗？","hint":"第一句是说鱼的味道，第二句是说“我”做的动作。","takeaway":"不一样。第一句的 `tastes` 是系动词，意为“尝起来”；第二句的 `taste` 是实义动词，意为“品尝”。"},{"question":"本题中，我们是想描述鱼本身的味道，还是某人品尝鱼的动作？","hint":"句子的主语是 “The fish”，而不是人。","takeaway":"我们是在描述鱼本身的味道，所以应该使用 `taste` 作为系动词的用法。"}]},{"title":"认识“主系表”结构","steps":[{"question":"在这个句子中，“very nice” 是一个什么词性的词组？它在描述谁？","hint":"“nice” 是一个形容词，它描述的是鱼 (The fish) 的特点。","takeaway":"“very nice” 是形容词词组，用来描述主语 “The fish” 的状态。"},{"question":"当一个动词后面跟着形容词，用来描述主语的状态时，这个动词叫什么？","hint":"比如 “be” 动词 (am, is, are) 就是最常见的这类动词。","takeaway":"这类动词叫做系动词 (Linking Verb)。"},{"question":"除了 be 动词，你还知道哪些动词可以像这样用，后面跟形容词？","hint":"想想“看起来”、“听起来”、“闻起来”用英语怎么说。","takeaway":"`look`, `sound`, `smell`, `feel`, `taste` 等感官动词都可以作系动词。"}]}]},"answer_area_hint":"横线"},{"number":"36","item_type":"fill_blank","context_note":"","stem":"Mike always goes to school e_____.","options":{},"teaching":{"correct_answer":"early","explanation_md":"1.  本句意为“迈克总是很早上学”。\n2.  横线上的词用来修饰动词词组 `goes to school`，说明他上学的情况，因此需要一个副词。\n3.  句中的 `always` (总是) 是一个频率副词，表示这是一个习惯性动作。\n4.  结合生活常识和首字母 'e' 的提示，可以推断是描述上学时间的早晚。\n5.  `early` 意为“早地”，是副词，符合语境和词性要求。\n6.  `early` 共有5个字母，也符合 `e_____` 的拼写长度提示。","knowledge_expansion_md":"### 1. 形副同形词：`early`\n`early` 是一个特殊的词，它既可以用作形容词，也可以用作副词，且拼写形式完全相同。这类词被称为形副同形词。\n- **作副词 (adv.)**，修饰动词、形容词或其他副词，表示“早地”。\n  - 例: He gets up **early**. (他起得早。) - *修饰动词 get up*\n- **作形容词 (adj.)**，修饰名词，表示“早期的；早的”。\n  - 例: He is an **early** bird. (他是一只早起的鸟。) - *修饰名词 bird*\n\n### 2. `early` 的反义词 `late`\n`early` 的反义词是 `late` (晚)。`late` 同样也是一个形副同形词。\n- **作副词**: He is always **late** for school. (他上学总是迟到。)\n- **作形容词**: He took a **late** train. (他搭乘了晚班火车。)\n- **注意**: `lately` 是另一个副词，意为“最近，近来”，与 `late` 意思完全不同。\n\n### 3. 频率副词的位置\n句子中的 `always` (总是) 是一个频率副词，表示动作发生的频率（100%）。其他常见的频率副词有 `usually` (通常), `often` (经常), `sometimes` (有时), `seldom` (很少), `never` (从不)。\n- **位置规则**: 频率副词通常放在**行为动词之前**，**be动词、情态动词或助动词之后**。\n  - 例: Mike **always goes** to school early. (行为动词 go 之前)\n  - 例: He **is always** late. (be动词 is 之后)","socratic_tracks":[{"title":"判断所需词性","steps":[{"question":"在句子 “Mike always goes to school ...” 中，横线上的词是用来做什么的？","hint":"这个词是用来描述 “goes to school” (去上学) 这个动作的。","takeaway":"横线上的词是用来修饰动词词组 “goes to school” 的。"},{"question":"修饰动词的词，我们称之为什么词性？","hint":"形容词修饰名词，那么什么词修饰动词呢？","takeaway":"修饰动词的词是副词 (adverb)。"},{"question":"结合首字母 'e' 和语境，你能想到哪个副词可以描述上学的状态？","hint":"上学可以早，也可以晚。“早”的英文是什么？","takeaway":"副词 `early` (早地) 非常符合语境。"}]},{"title":"根据上下文推断","steps":[{"question":"句子中的 “always” 是什么意思？它告诉我们 Mike 上学的行为有什么特点？","hint":"“always” 翻译成中文是“总是，一直”。","takeaway":"“always” 告诉我们这是 Mike 的一个习惯，他每次都这样做。"},{"question":"关于“上学”这个习惯，我们通常会描述它的什么方面？","hint":"比如，上学的方式（走路、坐车），或者上学的时间（早、晚）。","takeaway":"我们通常会描述上学的时间，是早到还是迟到。"},{"question":"那么，哪个以 'e' 开头的词可以描述上学时间，并且能和 “always” 搭配形成一个好习惯的描述？","hint":"“早”的英文是什么？","takeaway":"`early` (早) 这个词完全符合，表示“迈克总能很早上学”。"}]},{"title":"`early` 的双重身份","steps":[{"question":"你能用 `early` 造一个句子来描述“早班车”吗？","hint":"“早的”班车，这里 `early` 是修饰“班车”这个名词。","takeaway":"The early bus. (在这句话里，`early` 是形容词，修饰名词 bus)。"},{"question":"你还能用 `early` 造一个句子来描述“早起”吗？","hint":"“起得早”，这里 `early` 是修饰“起床”这个动作。","takeaway":"I get up early. (在这句话里，`early` 是副词，修饰动词 get up)。"},{"question":"那么在本题 “Mike always goes to school e_____” 中，`early` 应该是什么词性？","hint":"它修饰的是 “goes to school” 这个动作。","takeaway":"在本题中，`early` 是副词，因为它修饰的是动词词组。"}]}]},"answer_area_hint":"横线"},{"number":"37","item_type":"fill_blank","context_note":"","stem":"Students can learn how to c_____ nice food in the cooking class.","options":{},"teaching":{"correct_answer":"cook","explanation_md":"1. 句意为“学生们可以在烹饪课上学习如何____美味的食物”。\n2. 句中的“cooking class”（烹饪课）和“nice food”（美味的食物）提供了语境线索。\n3. “learn how to”是一个固定搭配，意为“学习如何做某事”，其后应接动词原形。\n4. 结合首字母“c”和语境，可以确定动词为“cook”（烹饪）。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **固定搭配 `learn how to do sth.`**\n    *   这是一个非常常见的结构，表示“学习如何做某事”。`to` 是不定式符号，后面必须跟动词原形（infinitive）。\n    *   例句：`He is learning how to drive a car.` (他正在学习如何开车。)\n\n2.  **词义辨析：`cook` vs. `cooker`**\n    *   `cook`：既可以作动词，意为“烹饪”；也可以作名词，意为“厨师”。\n        *   `My mom can cook delicious meals.` (我妈妈会做美味的饭菜。) - 动词\n        *   `Gordon Ramsay is a famous cook.` (戈登·拉姆齐是一位著名的厨师。) - 名词\n    *   `cooker`：是名词，指“炊具”或“炉灶”。\n        *   `We need a new rice cooker.` (我们需要一个新的电饭锅。)\n\n3.  **相关词汇：与“烹饪”相关的动词**\n    *   `bake` (烘烤，多指面包、蛋糕)\n    *   `roast` (烤，多指肉类、土豆)\n    *   `fry` (油炸，油煎)\n    *   `boil` (煮沸)\n    *   `steam` (蒸)\n    *   `chop` (切，剁)","socratic_tracks":[{"title":"动词搭配","steps":[{"question":"在英语中，“learn how to”这个短语后面应该跟什么形式的动词？","hint":"想一想我们说“学习如何游泳”是 “learn how to swim” 还是 “learn how to swimming”？","takeaway":"“learn how to” 后面必须跟动词原形。"},{"question":"知道了要用动词原形，再结合句意“在烹饪课上学习____食物”，以及首字母'c'的提示，这个动词是什么？","hint":"制作食物的那个动作，英文单词是什么？","takeaway":"结合语境和首字母提示，答案是 “cook”。"}]},{"title":"语境推断","steps":[{"question":"句子中的 “cooking class” 是什么意思？它为我们提供了什么线索？","hint":"“class”是“课”，“cooking”是“烹饪”，合在一起呢？","takeaway":"“cooking class” 指的是烹饪课，这提示了空格里的动词和烹饪有关。"},{"question":"在烹饪课上，我们对 “nice food”（美味的食物）会做什么动作呢？","hint":"这个动作的英文单词以 'c' 开头。","takeaway":"在烹饪课上，我们学习“烹饪”食物，所以动词是 “cook”。"}]},{"title":"词性辨析","steps":[{"question":"“cook” 这个词除了作动词“烹饪”，还可以是什么词性，表示什么意思？","hint":"“My father is a good ____.” (我爸爸是个好厨师。) 空格里填什么？","takeaway":"“cook” 还可以作名词，意思是“厨师”。"},{"question":"那表示“炊具”（比如电饭锅）的英文单词是什么？它和 “cook” 长得很像。","hint":"电饭煲的英文是 “rice cooker”。","takeaway":"“cooker” 是名词，指“炊具”，不要与 “cook”（厨师）混淆。"}]}]},"answer_area_hint":"横线"},{"number":"38","item_type":"fill_blank","context_note":"","stem":"I couldn't go _____ (骑自行车运动) in winter.","options":{},"teaching":{"correct_answer":"go cycling","explanation_md":"1. 句意为“冬天我不能去骑自行车。”\n2. 本题考查固定搭配 “go + v-ing”，表示“去做某项运动或活动”。\n3. 括号中的中文提示是“骑自行车运动”，其对应的 `v-ing` 形式是 `cycling`。\n4. 句中已有动词 `go`，因此在横线处填入 `cycling` 即可。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **固定搭配 `go + v-ing`**\n    *   这个结构通常用于表达去进行某项娱乐、体育活动或爱好，其中的 `v-ing` 形式在语法上作名词使用。\n    *   **常见搭配**：\n        *   `go swimming` (去游泳)\n        *   `go shopping` (去购物)\n        *   `go fishing` (去钓鱼)\n        *   `go hiking` (去远足)\n        *   `go skiing` (去滑雪)\n        *   `go skating` (去滑冰)\n\n2.  **词义辨析：`ride a bike` vs. `go cycling`**\n    *   `ride a bike`：更侧重“骑自行车”这个具体动作，可以是一次性的行为，常用于表示交通方式。\n        *   `I ride a bike to school every day.` (我每天骑自行车去上学。)\n    *   `go cycling`：更侧重将“骑行”作为一种运动、爱好或休闲活动。\n        *   `We often go cycling in the park on weekends.` (我们周末经常去公园骑车锻炼。)\n\n3.  **`v-ing` 的构成规则**\n    *   动词 `cycle` 以不发音的 `e` 结尾，变 `v-ing` 形式时，需要去掉 `e` 再加 `ing`，变为 `cycling`。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"当我们想表达“去进行某项活动”，比如“去游泳”，英文通常用什么结构？","hint":"是 “go to swim” 还是 “go swimming” 更常用于表达休闲活动？","takeaway":"表达“去做某项活动”常用 “go + v-ing” 的结构。"},{"question":"那么，“骑自行车”这项运动的 v-ing 形式是什么？","hint":"动词 “cycle” 结尾是 'e'，变 v-ing 形式时需要去掉 'e' 再加 'ing'。","takeaway":"“cycle” 的 v-ing 形式是 “cycling”，所以答案是 “go cycling”。"}]},{"title":"词汇转换","steps":[{"question":"“骑自行车”这个动作，我们最熟悉的英文短语是什么？","hint":"“ride a _____”。","takeaway":"我们通常用 “ride a bike” 来表示“骑自行车”这个动作。"},{"question":"当把“骑自行车”作为一种运动或爱好时，有没有一个更简洁的单词来表示？","hint":"这个词的动词原形是 “cycle”。","takeaway":"“cycling” 是指“骑自行车运动”，是一个名词。"},{"question":"结合 “go _____” 的结构，应该填入什么？","hint":"填入表示这项运动的名词形式。","takeaway":"填入 “cycling”，构成固定搭配 “go cycling”。"}]},{"title":"句型辨析","steps":[{"question":"“go doing” 和 “go to do” 都有“去做某事”的意思，它们在使用上有什么区别吗？","hint":"想一想 “go shopping”（去购物）和 “go to buy some food”（去买些食物）的区别。","takeaway":"“go doing” 强调活动本身（多为娱乐、运动），而 “go to do” 强调去做某事的具体目的。"},{"question":"题干中的“骑自行车运动”是强调一种娱乐活动还是一个具体目的？","hint":"这是一种爱好或锻炼方式。","takeaway":"“骑自行车运动”是一种休闲体育活动，所以应该使用 “go doing” 的结构。"}]}]},"answer_area_hint":"横线","correct_answer":"cycling"},{"number":"39","item_type":"fill_blank","context_note":"","stem":"I'm 12 years old, and Lily is 10 years old. I'm _____ Lily.","options":{},"teaching":{"correct_answer":"older than","explanation_md":"1. 句意为“我12岁，莉莉10岁。我比莉莉大。”\n2. 句子前后两部分存在对比关系，需要比较“我”和莉莉的年龄。\n3. 英文中比较两个人或事物，需要使用形容词的比较级形式。\n4. “old”（年长的）的比较级是 “older”。\n5. 比较级的基本句型是“A + be动词 + 形容词比较级 + than + B”，意为“A比B更……”。\n6. 因此，此处应填入 “older than”。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **形容词比较级的构成**\n    *   **规则变化**：\n        *   单音节词和部分双音节词：词尾加 `-er` (e.g., `old` → `older`, `tall` → `taller`)。\n        *   以 `e` 结尾：只加 `-r` (e.g., `nice` → `nicer`)。\n        *   重读闭音节：双写末尾辅音字母再加 `-er` (e.g., `big` → `bigger`)。\n        *   辅音字母+`y` 结尾：变 `y` 为 `i` 再加 `-er` (e.g., `happy` → `happier`)。\n    *   **多音节词和部分双音节词**：在词前加 `more` (e.g., `beautiful` → `more beautiful`)。\n    *   **不规则变化**：`good/well` → `better`, `bad` → `worse`, `many/much` → `more`, `little` → `less`。\n\n2.  **比较级基本句型**\n    *   `主语 + be/其他动词 + 形容词/副词比较级 + than + 比较对象`。\n    *   `He is taller than his brother.` (他比他哥哥高。)\n    *   `She runs faster than me.` (她比我跑得快。)\n\n3.  **易混淆词：`older` vs. `elder`**\n    *   `older`：用法普遍，可指人或物，既可作定语也可作表语，可以和 `than` 连用进行比较。\n    *   `elder`：仅指人，通常用于家庭成员之间表示“年长的”，多作定语，**不能**与 `than` 连用。\n        *   `my elder brother` (我的哥哥)  (√)\n        *   `He is elder than me.` (×)","socratic_tracks":[{"title":"比较级语法","steps":[{"question":"当我们要比较两个人或事物的某个方面时，形容词需要变成什么形式？","hint":"比如，A比B高，我们会说 “A is ____ than B.”","takeaway":"比较两者时，需要使用形容词的比较级。"},{"question":"“old”（年长的）这个词的比较级是什么？","hint":"这是一个单音节词，通常在词尾加什么？","takeaway":"“old” 的比较级是 “older”。"},{"question":"在比较句中，表示“比”的那个关键词是什么？","hint":"“I am taller ____ you.”","takeaway":"比较级后面通常跟 “than” 来引出比较对象。"}]},{"title":"逻辑推理","steps":[{"question":"根据题干信息，“I”（我）和 “Lily” 谁的年龄更大？","hint":"“我”是12岁，Lily是10岁。","takeaway":"“我”的年龄比 Lily 大。"},{"question":"那么，我们需要在空格里填入一个表示“比……年长”的短语，这个短语是什么？","hint":"“年长”是 “old” 的比较级，后面还要加上一个词表示“比”。","takeaway":"表示“比……年长”的短语是 “older than”。"}]},{"title":"词汇辨析","steps":[{"question":"我们学过一个词 “elder”，它也是“年长”的意思，可以用在这里吗？可以说 “I'm elder than Lily” 吗？","hint":"“elder” 通常用在什么场合？它后面能跟 “than” 吗？","takeaway":"“elder” 通常指家庭成员中的长幼，且不能和 “than” 连用。"},{"question":"那么，在需要用 “than” 进行比较的句子里，我们应该用哪个词来表示“更老，更年长”？","hint":"就是 “old” 的常规比较级形式。","takeaway":"在比较句型 “... than ...” 中，必须使用 “older”。"}]}]},"answer_area_hint":"横线"},{"number":"40","item_type":"fill_blank","context_note":"","stem":"She r_____ a book last night.","options":{},"teaching":{"correct_answer":"read","explanation_md":"1. 句中有时间状语 “last night”（昨晚），这是过去时间的明确标志。\n2. 因此，整个句子应使用一般过去时态。\n3. 在一般过去时中，谓语动词需要使用其过去式形式。\n4. 结合首字母“r”和宾语“a book”（一本书），可以推断出动词是“read”（阅读）。\n5. 动词“read”的过去式和原形拼写完全相同，都是“read”。\n6. 需要注意，虽然拼写相同，但过去式“read”的发音是 /red/，与原形 /ri:d/ 不同。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **一般过去时 (Simple Past Tense)**\n    *   **用途**：表示过去某个特定时间发生的动作或存在的状态。\n    *   **时间标志词**：`yesterday` (昨天), `last night/week/month/year` (昨晚/上周/上月/去年), `... ago` (……以前), `in 2010` (在2010年), `just now` (刚才) 等。\n\n2.  **不规则动词 `read`**\n    *   `read` 是一个特殊的不规则动词，它的原形、过去式和过去分词拼写完全相同，属于 A-A-A 型。\n    *   **动词形式**：`read` (原形) - `read` (过去式) - `read` (过去分词)。\n    *   **发音区别**：这是关键的易错点。原形发音为 /riːd/，而过去式和过去分词发音为 /red/，与单词 “red”（红色）同音。\n\n3.  **其他 A-A-A 型不规则动词**\n    *   `cut` - `cut` - `cut` (切)\n    *   `put` - `put` - `put` (放)\n    *   `cost` - `cost` - `cost` (花费)\n    *   `hit` - `hit` - `hit` (打)\n    *   `let` - `let` - `let` (让)","socratic_tracks":[{"title":"时态判断","steps":[{"question":"句子中哪个词或短语告诉我们这个动作发生的时间？","hint":"看看句子的末尾，有一个表示时间的短语。","takeaway":"“last night”（昨晚）是表示过去时间的标志词。"},{"question":"既然动作发生在过去，那么句子应该使用什么时态？动词应该用什么形式？","hint":"描述昨天发生的事情，用现在时还是过去时？","takeaway":"句子应该使用一般过去时，谓语动词要用过去式。"}]},{"title":"动词变化","steps":[{"question":"结合句意“她昨晚读了一本书”，空格里应该填哪个动词？","hint":"“读书”的“读”，以 'r' 开头。","takeaway":"动词是 “read”。"},{"question":"动词 “read” 的过去式是什么？它的拼写和原形一样吗？","hint":"这是一个特殊的不规则动词，它的过去式和原形长得一模一样。","takeaway":"“read” 的过去式拼写和原形一样，仍然是 “read”。"}]},{"title":"发音辨析","steps":[{"question":"如果这个句子是 “She reads a book every night.”，动词 “reads” 里的 “read” 怎么发音？","hint":"这是现在时，主语是第三人称单数，动词是原形加s。","takeaway":"动词原形 “read” 发音是 /riːd/。"},{"question":"那么在题干 “She read a book last night.” 中，过去式 “read” 的发音是什么？","hint":"它和“红色”（red）的发音一样。","takeaway":"动词过去式 “read” 发音是 /red/，虽然拼写没变，但发音变了。"}]}]},"answer_area_hint":"横线"}]},{"section_title":"IV. 完形填空。(共10分)","section_instruction":"It is evening. __41__ old cock (公鸡) is __42__ in a tall tree. A fox comes to the tree and looks at the cock.\n'Hello, Mr Cock, I have some good news for you,' says the fox.\n'Oh?' says the cock. 'What is it?'\n'All the animals __43__ good friends now. Let's __44__ friends, too. Please come down and play __45__ me.'\n'Fine!' says the cock. 'I'm very glad to hear that.' Then he looks up. 'Look! There is something over there.'\n'__46__ are you looking at?' asks the fox.\n'Oh, I see some animals over there. __47__ coming this way.'\n'Animals?'\n'Yes. Oh, they're dogs.'\n'What? Dogs!' asks the fox. 'Well...well, I __48__ now. Goodbye.'\n'Wait, Mr Fox,' says the cock. '__49__ go. They are only dogs. And dogs are our friends now.'\n'Yes. But they __50__ that yet.'\n'I see, I see,' says the cock. He smiles and goes to sleep in the tree.","items":[{"number":"41","item_type":"cloze","context_note":"Passage in section instruction","stem":"41. a/an","options":{"A":"the","B":"an","C":"a","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查不定冠词的用法。空格位于单词 old 前，old 以元音音素 /əʊ/ 开头，因此应使用不定冠词 an。句意为：一只老公鸡在一棵高树上。这是第一次提到这只公鸡，故用不定冠词表示泛指。选项A“the”是定冠词，表示特指；选项C“a”用于辅音音素开头的单词前。故选B。","knowledge_expansion_md":"### 冠词用法拓展\n\n1.  **不定冠词 (a/an)**：用于泛指某一类人或事物中的任何一个，仅用于单数可数名词前。\n    *   `a` 用在以**辅音音素**开头的词前。例如：`a boy`, `a car`, `a useful tool` (useful /'juːsfəl/ 以辅音 /j/ 开头)。\n    *   `an` 用在以**元音音素**开头的词前。例如：`an apple`, `an hour` (hour /'aʊər/ 的 h 不发音，以元音 /aʊ/ 开头)。\n\n2.  **定冠词 (the)**：用于特指某一个或某些特定的人或事物。\n    *   上文已提过的人或事物。例如：`I see a cat. The cat is white.`\n    *   谈话双方都明确所指的人或事物。例如：`Please open the door.`\n    *   世界上独一无二的事物。例如：`the sun`, `the moon`, `the earth`。\n\n3.  **零冠词**：指名词前不用任何冠词的情况，通常用于复数名词泛指、不可数名词泛指、专有名词前等。例如：`I like apples.` (泛指苹果)；`Water is important.` (泛指水)。","socratic_tracks":[{"title":"冠词选择基础","steps":[{"question":"我们什么时候会用 'a' 或 'an'？","hint":"想一想它们和 'the' 的区别，是泛指还是特指？","takeaway":"不定冠词 'a/an' 用于泛指一个单数可数名词。"},{"question":"那我们怎么决定用 'a' 还是 'an' 呢？是看单词的第一个字母吗？","hint":"想一想 'an hour' 和 'a university' 这两个例子。","takeaway":"选择 'a' 还是 'an' 取决于其后单词的第一个“音素”，而不是字母。"},{"question":"如果空格后面的单词是 'book'，它以什么音素开头？我们应该选哪个？","hint":"'book' 的发音是 /bʊk/，/b/ 是辅音还是元音？","takeaway":"以辅音音素开头的单词前用 'a'。"}]},{"title":"定冠词 vs. 不定冠词","steps":[{"question":"如果我想说“太阳是热的”，'太阳' 前面用什么冠词？为什么？","hint":"世界上的太阳有几个？","takeaway":"对于独一无二的事物，我们使用定冠词 'the'。"},{"question":"如果我说“我买了一本书”，这里的“书”是特指某一本还是泛指任意一本？","hint":"这是我第一次提到这本书，听话的人知道是哪本吗？","takeaway":"当第一次提到某个事物，表示泛指时，我们用不定冠词 'a/an'。"}]},{"title":"易错音素辨析","steps":[{"question":"单词 'useful' (有用的) 是以元音字母 'u' 开头，为什么我们说 'a useful tool' 而不是 'an useful tool'？","hint":"试着读一下 'useful' 这个词，注意开头的声音。","takeaway":"'useful' 的发音以辅音 /j/ 开头，所以前面用 'a'。"},{"question":"单词 'honest' (诚实的) 是以辅音字母 'h' 开头，为什么我们说 'an honest man'？","hint":"试着读一下 'honest'，注意字母 'h' 是否发音。","takeaway":"'honest' 的 'h' 不发音，单词以元音 /ɒ/ 开头，所以前面用 'an'。"}]}]}},{"number":"42","item_type":"cloze","context_note":"Passage in section instruction","stem":"42. sit","options":{"A":"sit","B":"sits","C":"sitting","D":"is sitting"},"teaching":{"correct_answer":"C","explanation_md":"本题考查现在进行时。根据短文，空格前有be动词 is，此处应填入动词的-ing形式，构成现在进行时（is doing），表示“正在做某事”或描述一种持续的状态。句意为：一只老公鸡正坐在一棵高树上。选项C“sitting”是现在分词，符合语法结构。选项A“sit”是原形，选项B“sits”是第三人称单数形式，选项D“is sitting”会造成动词重复，均不正确。故选C。","knowledge_expansion_md":"### 动词形式辨析\n\n在英语中，动词的形式会根据时态、语态、主语人称和数的变化而变化。以动词 `sit` 为例：\n\n1.  **动词原形 (sit)**：用于\n    *   主语为第一人称 (I, we)、第二人称 (you) 或第三人称复数 (they) 的一般现在时。例如：`They sit by the window.`\n    *   情态动词 (can, must, should等) 之后。例如：`You should sit down.`\n    *   某些动词之后，构成 `to do` 或 `do` 结构。例如：`I want to sit here.`\n\n2.  **第三人称单数形式 (sits)**：用于\n    *   主语为第三人称单数 (he, she, it, Tom, the cat) 的一般现在时，表示经常性、习惯性的动作或状态。例如：`He often sits there.`\n\n3.  **现在分词 (-ing形式, sitting)**：\n    *   与be动词构成进行时态，表示正在进行的动作。例如：`She is sitting on the sofa.`\n    *   作非谓语动词，充当定语、状语或宾语。例如：`The boy sitting there is my brother.` (作定语)\n\n4.  **过去式 (sat)** 和 **过去分词 (sat)**：用于过去时态和完成时态。例如：`He sat down.` (过去式)；`He has sat there for an hour.` (过去分词)","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"在英语句子中，动词的形式和什么有关系？","hint":"想一想 'I go' 和 'He goes' 的区别。","takeaway":"动词的形式需要和主语的人称和单复数保持一致。"},{"question":"如果主语是“他”（he）或者“一个男孩”（a boy），这属于第几人称？是单数还是复数？","hint":"不是“我”，不是“你”，就是“他/她/它”。","takeaway":"这是第三人称单数。"},{"question":"当主语是第三人称单数，并且句子描述的是一个经常发生的动作（一般现在时），动词应该有什么变化？","hint":"回忆一下动词 'go' 是如何变成 'goes' 的。","takeaway":"动词通常需要在词尾加上 '-s' 或 '-es'。"}]},{"title":"时态判断","steps":[{"question":"选项 'is sitting' 和 'sits' 有什么区别？它们分别描述了什么样的动作？","hint":"一个表示“正在做”，一个表示“经常做”。","takeaway":"'is sitting' (现在进行时) 表示动作正在发生，而 'sits' (一般现在时) 表示习惯或常态。"},{"question":"如果句子里有 'now' 或 'at the moment' 这样的词，我们应该用哪个时态？","hint":"这些词都指向“现在”这一刻。","takeaway":"有 'now' 等标志词时，通常使用现在进行时。"},{"question":"如果句子里有 'often', 'usually', 'always' 这样的词，我们又该用哪个时态？","hint":"这些词都表示动作的频率。","takeaway":"表示频率的副词通常与表示习惯的一般现在时连用。"}]},{"title":"动词形式功能","steps":[{"question":"一个句子中可以只有 'sitting' 这个词作谓语吗？比如 'He sitting there.' 这句话对吗？","hint":"动词的-ing形式前面通常需要一个“帮手”。","takeaway":"现在分词（-ing形式）不能单独作谓语，通常需要和be动词一起构成进行时。"},{"question":"那动词原形 'sit' 呢？可以用在 'He ___ there.' 这个句子里吗？","hint":"想想主谓一致的规则。","takeaway":"动词原形不能用于第三人称单数作主语的一般现在时句子中。"}]}]}},{"number":"43","item_type":"cloze","context_note":"Passage in section instruction","stem":"43. is","options":{"A":"is","B":"am","C":"are","D":"be"},"teaching":{"correct_answer":"C","explanation_md":"本题考查be动词的正确形式。本句的主语是“All the animals”，是一个复数概念，因此be动词应使用复数形式 are。句意为：现在所有的动物都是好朋友了。选项A“is”用于单数主语；选项B“am”用于主语I；选项D“be”是动词原形，不能直接作谓语。故选C。","knowledge_expansion_md":"### Be动词全面解析\n\nBe动词是英语中最基本也最不规则的动词之一，其形式随主语、时态和语气的变化而变化。\n\n**1. 现在时形式：am, is, are**\n*   `I am` (我)\n*   `You are` (你, 你们)\n*   `He/She/It is` (他/她/它/单数名词)\n*   `We are` (我们)\n*   `They are` (他们/她们/它们/复数名词)\n\n**2. 过去时形式：was, were**\n*   `I/He/She/It was` (单数主语)\n*   `You/We/They were` (复数主语及第二人称)\n\n**3. 功能**\n*   **作系动词**：连接主语和表语，说明主语的身份、状态、特征。例如：`She is a doctor.` (她是医生。)\n*   **作助动词**：\n    *   与现在分词(-ing)构成进行时态。例如：`They are playing.` (他们正在玩。)\n    *   与过去分词(-ed/en)构成被动语态。例如：`The window was broken.` (窗户被打破了。)\n\n**4. 原形 (be)**：用于情态动词后、不定式结构中。例如：`You must be quiet.`；`I want to be a teacher.`","socratic_tracks":[{"title":"Be动词与主语匹配","steps":[{"question":"Be动词在现在时中有哪三种形式？","hint":"分别对应“我”、“你/复数”、“他/她/它”。","takeaway":"Be动词的现在时形式是 am, is, are。"},{"question":"这三种形式分别和什么样的主语搭配？","hint":"请分别说出 'I', 'he', 'they' 后面跟哪个be动词。","takeaway":"I am, he/she/it is, you/we/they are。"},{"question":"如果主语是 'the children'（孩子们），它是一个人还是多个人？应该用 'is' 还是 'are'？","hint":"'children' 是 'child' 的复数形式。","takeaway":"复数主语需要搭配 'are'。"}]},{"title":"Be动词的功能","steps":[{"question":"在句子 'They ___ happy.' 中，这个空缺的动词起什么作用？","hint":"它是在表示一个动作，还是在连接主语和它的状态？","takeaway":"在这里，be动词作为系动词，连接主语和表语（形容词happy）。"},{"question":"在句子 'They ___ running.' 中，这个空缺的动词又起什么作用？","hint":"它和后面的 'running' 一起表达了什么意思？","takeaway":"在这里，be动词作为助动词，和现在分词一起构成现在进行时。"}]},{"title":"排除错误选项","steps":[{"question":"为什么我们不能选 'am'？","hint":"'am' 的主语非常专一。","takeaway":"'am' 只和第一人称单数 'I' 连用。"},{"question":"为什么我们不能选 'be'？","hint":"动词原形通常用在什么词的后面？","takeaway":"动词原形 'be' 不能直接作谓语，通常跟在情态动词（如 will, can）后面。"},{"question":"那么，我们只需要在 'is' 和 'are' 中做选择。选择的依据是什么？","hint":"看看主语是一个人/物，还是多个？","takeaway":"选择 'is' 还是 'are' 的关键在于判断主语是单数还是复数。"}]}]}},{"number":"44","item_type":"cloze","context_note":"Passage in section instruction","stem":"44. be","options":{"A":"are","B":"be","C":"is","D":"am"},"teaching":{"correct_answer":"B","explanation_md":"本题考查固定句型 Let's do sth.。Let's 是 Let us 的缩写，其后应跟动词原形，表示“让我们做某事吧”。本句中，空格后是名词 friends，需要一个系动词连接，动词 be 的原形就是 be。因此，构成“Let's be friends”，意为“让我们也成为朋友吧”。故选B。","knowledge_expansion_md":"### “There be”句型详解\n\n1.  **基本结构与含义**：表示“某地（或某时）有某物（或某人）”，强调“存在”。\n    *   `There is + 单数名词/不可数名词 + 地点/时间`. (e.g., `There is a cat under the table.`, `There is some milk in the fridge.`)\n    *   `There are + 复数名词 + 地点/时间`. (e.g., `There are two birds in the tree.`)\n\n2.  **就近原则**：当be动词后跟有多个名词时，be动词的形式通常与离它最近的那个名词的数保持一致。\n    *   `There is a pen and two pencils in the box.` (be动词is与最近的a pen保持一致)\n    *   `There are two pencils and a pen in the box.` (be动词are与最近的two pencils保持一致)\n\n3.  **与 `have/has` 的区别**：\n    *   `There be` 表示“存在”，主语是 `There`，真正的“主语”在be动词之后。\n    *   `have/has` 表示“拥有”，主语是人或物。例如：`I have a book.` (我有一本书。) vs. `There is a book on the desk.` (桌上有一本书。)\n\n4.  **其他时态**：`There be` 句型也可以用于其他时态。\n    *   过去时: `There was/were...`\n    *   将来时: `There will be...`\n    *   完成时: `There have/has been...`","socratic_tracks":[{"title":"There be 句型","steps":[{"question":"当我们想表达“某个地方有某个东西”时，通常用什么句型开头？","hint":"不是 'It is...'，而是表示“存在”的句型。","takeaway":"我们通常使用 'There be' 句型来表示“某地有某物”。"},{"question":"在这个句型中，be动词（is/are）的形式是由什么决定的？是由开头的 'There' 决定的吗？","hint":"比较一下 'There is a book.' 和 'There are books.'。","takeaway":"Be动词的形式是由它后面的名词的单复数决定的。"},{"question":"这个规则叫什么原则？","hint":"动词的形式跟离它最“近”的名词保持一致。","takeaway":"这被称为“就近原则”。"}]},{"title":"单复数判断","steps":[{"question":"如果be动词后面跟的是 'a cat'，应该用 'is' 还是 'are'？","hint":"'a cat' 是一只猫还是很多猫？","takeaway":"单数名词前用 'is'。"},{"question":"如果be动词后面跟的是 'some cats'，应该用 'is' 还是 'are'？","hint":"'some cats' 是复数。","takeaway":"复数名词前用 'are'。"},{"question":"如果be动词后面是不可数名词，比如 'water'，应该用 'is' 还是 'are'？","hint":"不可数名词在语法上通常被当作单数处理。","takeaway":"不可数名词前也要用 'is'，例如 'There is some water'。"}]},{"title":"与 have/has 辨析","steps":[{"question":"“我有一支笔” 和 “桌上有一支笔”，这两句话在中文里很像，在英文里表达方式一样吗？","hint":"想一想主语分别是谁。","takeaway":"不一样。“我有一支笔”的主语是“我”，用 have；“桌上有一支笔”是表示存在，用 There be。"},{"question":"可以说 'The desk has a pen.' 吗？","hint":"桌子能“拥有”一支笔吗？还是笔“存在于”桌子上？","takeaway":"虽然有时可以这么说，但用 'There is a pen on the desk.' 来表达“存在”关系更地道、更常见。"}]}]}},{"number":"45","item_type":"cloze","context_note":"Passage in section instruction","stem":"45. play with","options":{"A":"and","B":"to","C":"for","D":"with"},"teaching":{"correct_answer":"D","explanation_md":"本题考查介词的用法。固定搭配“play with sb.”意为“和某人一起玩”。根据上文狐狸的邀请“Please come down and play __45__ me.”（请下来和我一起玩吧），此处应填入介词 with。故选D。","knowledge_expansion_md":"### 常用介词搭配 (with)\n\n介词 `with` 常用于表示“和……一起”、“带有”、“用……”等含义。\n\n1.  **表示伴随（和……一起）**：\n    *   `play with sb.` (和某人玩)\n    *   `go with sb.` (和某人一起去)\n    *   `talk with sb.` (和某人谈话)\n\n2.  **表示拥有或带有**：\n    *   `a girl with long hair` (一个长发女孩)\n    *   `a room with a big window` (一个有大窗户的房间)\n\n3.  **表示使用工具或方式**：\n    *   `write with a pen` (用钢笔写字)\n    *   `cut with a knife` (用刀切)","socratic_tracks":[{"title":"“play with”搭配","steps":[{"question":"当你想表达‘和某人一起玩’时，英文怎么说？","hint":"‘玩’是 play，‘和...一起’用哪个介词？","takeaway":"我们用 'play with someone' 来表示‘和某人一起玩’。"},{"question":"狐狸想邀请公鸡下来做什么？","hint":"看原文 'Please come down and play __45__ me.'","takeaway":"狐狸想邀请公鸡和它一起玩。"},{"question":"所以，这个空格应该填什么词？","hint":"根据 'play with someone' 这个搭配。","takeaway":"空格里应该填入介词 'with'。"}]}]}},{"number":"46","item_type":"cloze","context_note":"Passage in section instruction","stem":"46. ___ are you looking at?","options":{"A":"What","B":"How","C":"Whose","D":"Where"},"teaching":{"correct_answer":"A","explanation_md":"本题考查特殊疑问词的用法。根据语境，狐狸问公鸡：‘你在看___？’这里狐狸是想询问公鸡正在看‘什么’。‘What’意为‘什么’，用来对事物提问，符合句意。选项 B ‘How’意为‘怎样’；选项 C ‘Whose’意为‘谁的’；选项 D ‘Where’意为‘在哪里’。均不符合句意。故选 A。","knowledge_expansion_md":"### 特殊疑问词辨析\n\n*   **What (什么)**: 询问事物、职业、姓名等。 e.g., `What is this?`\n*   **Where (哪里)**: 询问地点。 e.g., `Where are you from?`\n*   **When (何时)**: 询问时间。 e.g., `When is your birthday?`\n*   **Who (谁)**: 询问人的身份（作主语）。 e.g., `Who is that boy?`\n*   **Whose (谁的)**: 询问所有者。 e.g., `Whose book is this?`\n*   **Why (为什么)**: 询问原因。 e.g., `Why are you late?`\n*   **Which (哪个)**: 在限定范围内询问。 e.g., `Which one do you like?`\n*   **How (怎样)**: 询问方式、程度、健康状况等。 e.g., `How do you go to school?`\n\n本题中，狐狸想知道公鸡目光所及的‘内容’是什么，因此用 `What`。","socratic_tracks":[{"title":"疑问词辨析","steps":[{"question":"狐狸看到公鸡在向上看，它想问公鸡什么？是想问“在哪里看”、“怎样看”还是“看什么”？","hint":"公鸡说“看！那边有东西。”","takeaway":"狐狸想知道公鸡看到了什么东西。"},{"question":"在英语中，当我们想问“什么”的时候，应该用哪个疑问词？","hint":"What, Where, How, Whose 哪个是“什么”的意思？","takeaway":"用 “What” 来询问“什么”。"}]},{"title":"排除法应用","steps":[{"question":"选项B “How” (怎样)，C “Whose” (谁的)，D “Where” (哪里) 分别是什么意思？把它们放进句子“___ are you looking at?”里读一读，通顺吗？","hint":"“How are you looking at?” (你怎样在看？), “Whose are you looking at?” (你在看谁的？), “Where are you looking at?” (你在哪里看？) 都不符合狐狸想问“看到了什么”的语境。","takeaway":"“How”询问方式，“Whose”询问所有者，“Where”询问地点，都与句意不符，故排除。"},{"question":"排除了 B, C, D 后，剩下的唯一选项是什么？","hint":"用排除法可以帮助我们锁定正确答案。","takeaway":"只有 A “What” (什么) 符合句意，构成 “What are you looking at?” (你在看什么？)。"}]}]}},{"number":"47","item_type":"cloze","context_note":"Passage in section instruction","stem":"47. ___ coming this way.","options":{"A":"He is","B":"They are","C":"She is","D":"It is"},"teaching":{"correct_answer":"B","explanation_md":"本题考查人称代词的用法。根据前文“I see some animals over there.”（我看到那边有一些动物），可知本句是在描述这些动物的动向。‘some animals’是复数概念，因此应用代词‘They’来指代。‘They are coming this way.’意为‘它们正朝这边来。’选项 A 和 C 指代单数的人，选项 D 指代单数事物或动物，均不符合句意。故选 B。","knowledge_expansion_md":"### 人称代词主格的用法\n\n人称代词主格在句子中作主语，其形式需要根据指代对象的**人称、性别和数**来决定。\n\n| 人称 | 单数 | 复数 |\n| :--- | :--- | :--- |\n| 第一人称 | I (我) | we (我们) |\n| 第二人称 | you (你) | you (你们) |\n| 第三人称 | he (他), she (她), it (它) | they (他们/她们/它们) |\n\n**`it` 的特殊用法**：\n1.  **指代单数事物或动物**：`I have a book. It is interesting.` (我有一本书，它很有趣。)\n2.  **指代上文提到的情况或整件事**：`He missed the bus. It made him late for school.` (他错过了公交车，这件事让他上学迟到了。)\n3.  **作形式主语**，指代后面的不定式或从句：`It is important to protect our environment.` (保护我们的环境很重要。)\n4.  **表示时间、天气、距离等自然现象**：`It is raining.` (正在下雨。) `It is 8 o'clock.` (现在是八点。)\n\n本题中的 `It` 属于第一种用法，指代前文提到的事物“my English homework”。","socratic_tracks":[{"title":"代词指代","steps":[{"question":"空格所在的句子“___ coming this way”是在描述谁/什么正在过来？","hint":"请阅读前一句话：“I see some animals over there.”","takeaway":"这句话是在描述“一些动物 (some animals)”正在过来。"},{"question":"“some animals”是单数还是复数？应该用哪个代词来指代它们？","hint":"animal后面有s，是复数。","takeaway":"“some animals”是复数，应该用代词 “They” 来指代。"}]},{"title":"主谓一致","steps":[{"question":"我们确定了主语是 “They”。那么 “They” 后面应该跟be动词的哪种形式，“is”还是“are”？","hint":"复数主语 “They” 后面要跟 “are”。","takeaway":"复数主语作主语时，be动词的现在时形式是“are”。"},{"question":"观察四个选项，哪一个既正确指代了“一些动物”，又符合主谓一致的规则？","hint":"选项A和C指代单数的人，选项D指代单数事物，选项B指代复数的人或物。","takeaway":"只有“They are”既满足复数形式，又正确指代了“一些动物”。"}]}]}},{"number":"48","item_type":"cloze","context_note":"Passage in section instruction","stem":"48. I ___ now. Goodbye.","options":{"A":"must to go","B":"must go","C":"must going","D":"must to going"},"teaching":{"correct_answer":"B","explanation_md":"本题考查情态动词的用法。根据语境，狐狸听到狗来了，非常害怕，说“I ___ now. Goodbye.”（我必须现在就___了。再见。），表达了必须马上离开的紧迫性。“must”是一个情态动词，意为“必须”。情态动词（如 can, may, must, should 等）后面必须跟动词原形（不带 to 的动词不定式）。选项 B “must go”中，“go”是动词原形，符合语法规则。选项 A “must to go”错误，情态动词后不能加 “to”。选项 C “must going”和 D “must to going”也都是错误的动词形式。","knowledge_expansion_md":"### 情态动词 (Modal Verbs) 的核心用法\n\n情态动词是英语中一类特殊的助动词，用于表达说话人的语气、情感或态度，如能力、许可、义务、猜测等。\n\n**1. 基本特征**：\n*   **无人称和数的变化**：无论主语是第几人称、单数还是复数，情态动词本身形式不变。例如：`I can`, `He can` (不是 `cans`)。\n*   **后跟动词原形**：情态动词后面必须直接跟动词原形 (bare infinitive)。例如：`You should listen` (不是 `should to listen` 或 `should listening`)。\n*   **否定形式**：直接在情态动词后加 `not`。例如：`cannot` (或 `can't`), `must not` (或 `mustn't`)。\n*   **疑问形式**：将情态动词提到主语之前。例如：`Can you help me?`\n\n**2. 常见情态动词及其基本含义**：\n*   `can/could`: 表示能力、许可 (e.g., `I can swim.`)。\n*   `may/might`: 表示许可、可能性 (e.g., `You may leave now.`)。\n*   `must`: 表示必须、一定 (e.g., `You must be quiet.`)。\n*   `should/ought to`: 表示应该、建议 (e.g., `You should eat more vegetables.`)。\n\n**易错点**：初学者最常见的错误就是在情态动词后误加 `to` 或使用非原形动词。务必牢记“情态动词 + 动词原形”这一黄金法则。","socratic_tracks":[{"title":"情态动词语法","steps":[{"question":"“must”是一个什么类型的词？它在句子中有什么作用？","hint":"它和“can”（能）、“should”（应该）是同一类词，用来帮助主要动词表达一种“情态”。","takeaway":"“must”是一个情态动词，用来表示“必须”的义务或必要性。"},{"question":"情态动词后面跟的动词应该是什么形式？是 to do, doing, 还是动词原形？","hint":"回想一下“I can swim.”这句话里，“can”后面的“swim”是什么形式？","takeaway":"情态动词后面必须跟动词原形（不带to的不定式）。"},{"question":"那么，根据这个规则，选项中哪一个是“must + 动词原形”的正确组合？","hint":"“go”是动词原形，“to go”是不定式，“going”是现在分词。","takeaway":"正确的组合是“must go”，所以选B。"}]},{"title":"错误选项分析","steps":[{"question":"为什么选项A “must to go”是错的？","hint":"情态动词本身就带有情态意义，后面直接加动作即可，不需要介词“to”来连接。","takeaway":"情态动词后直接跟动词原形，中间不能加“to”。"},{"question":"为什么选项C “must going”是错的？","hint":"动词的-ing形式通常用在be动词后面表示进行时，或者作名词用。它能直接跟在情态动词后面吗？","takeaway":"情态动词后不能跟动词的-ing形式。"}]},{"title":"句意与功能","steps":[{"question":"狐狸听到狗来了，说了声“再见”。它说“I ___ now”这句话时，是什么心情和意图？","hint":"狐狸怕狗，它想留下还是想逃跑？","takeaway":"狐狸非常害怕，表示“我必须得走了”。"},{"question":"在英语中，哪个词最能表达这种“必须”的强烈语气？","hint":"在can, may, must, should这些词中，哪个词的语气最强硬，表示“必须做”？","takeaway":"使用情态动词“must”准确地传达了语境中“必须走”的强烈要求。"}]}]}},{"number":"49","item_type":"cloze","context_note":"Passage in section instruction","stem":"49. ___ go. They are only dogs.","options":{"A":"No","B":"Not","C":"Don't","D":"Doesn't"},"teaching":{"correct_answer":"C","explanation_md":"本题考查祈使句的否定形式。根据语境，公鸡想挽留正要离开的狐狸，对它说‘___ go’（___走）。这是在劝说对方不要做某事，应该使用否定祈使句。否定祈使句的结构是‘Don't + 动词原形’。因此，空格处应填入‘Don't’。选项 A ‘No’和 B ‘Not’不能用于此结构。选项 D ‘Doesn't’是第三人称单数形式的助动词，不用于祈使句。故选 C。","knowledge_expansion_md":"### 祈使句 (Imperative Sentences)\n\n祈使句用于表达命令、请求、建议、警告等，主语通常是第二人称 `you`，但被省略。\n\n1.  **肯定祈使句**：以**动词原形**开头。\n    *   `Come in, please.` (请进。)\n    *   `Be quiet!` (安静！)\n\n2.  **否定祈使句**：以 **`Don't`** 开头，后跟**动词原形**。\n    *   `Don't talk in class.` (课上不要讲话。)\n    *   `Don't be late.` (不要迟到。)\n\n本题中，公鸡劝狐狸“别走”，是对第二人称（狐狸）发出的否定请求，因此使用否定祈使句 `Don't go`。","socratic_tracks":[{"title":"句型判断","steps":[{"question":"公鸡对狐狸说“___ go.”，是想表达什么意思？是命令、请求还是陈述一个事实？","hint":"公鸡想让狐狸留下来。","takeaway":"这是公鸡对狐狸提出的请求或劝告，让他“别走”。"},{"question":"这种表示命令、请求、劝告的句子叫什么句型？","hint":"比如“Sit down!”或者“Please help me.”","takeaway":"这种句子叫祈使句。"}]},{"title":"否定祈使句","steps":[{"question":"如果我们想让别人“不要做”某事，应该用什么样的祈使句？它的开头是什么？","hint":"想想老师说“不要说话”时是怎么说的。","takeaway":"应该用否定祈使句，以 “Don't” 开头，后面跟动词原形。"},{"question":"根据这个规则，要表达“别走”，应该怎么说？在选项中选择正确的词。","hint":"“Don't”是“Do not”的缩写。","takeaway":"应该说 “Don't go.”，所以选择 C。"}]}]}},{"number":"50","item_type":"cloze","context_note":"Passage in section instruction","stem":"50. But they ___ that yet.","options":{"A":"aren't know","B":"doesn't know","C":"don't know","D":"isn't know"},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般现在时中动词的否定形式。句子主语是第三人称复数 “they”（指代 dogs）。在一般现在时中，当主语是复数（we, they）或第一、二人称（I, you）时，实义动词的否定形式需要借助助动词 “do not”（缩写为 don't），后跟动词原形。因此，正确答案是 “don't know”。选项 B “doesn't know” 用于第三人称单数主语（he, she, it）。选项 A 和 D 的 “aren't” 和 “isn't” 是 be 动词，不能和实义动词原形 “know” 直接连用构成否定句。","knowledge_expansion_md":"### 一般现在时否定句结构\n\n一般现在时的否定句是初中英语的重点和易错点，其核心在于区分 **be 动词**和**实义动词**。\n\n1.  **be 动词的否定**：\n    -   结构：主语 + `am/is/are` + `not` + ...\n    -   例句：`I am not a student.` / `He isn't happy.` / `They aren't here.`\n\n2.  **实义动词的否定**：\n    -   结构：主语 + `don't/doesn't` + 动词原形 + ...\n    -   `don't` 用于第一人称(I), 第二人称(you), 复数(we, they, the boys)。\n    -   `doesn't` 用于第三人称单数(he, she, it, the boy)。\n    -   例句：`I don't like coffee.` / `She doesn't play the piano.`\n\n**常见错误**：\n-   **混用 be 动词和助动词 do/does**：错误示范 `I am not know.` 或 `He doesn't be a teacher.`\n-   **`don't` 和 `doesn't` 使用混乱**：错误示范 `He don't like milk.`\n-   **`doesn't` 后动词未用原形**：错误示范 `She doesn't likes cats.`","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"这个句子的主语是哪个词？它指代的是谁？","hint":"空格的前面就是主语，联系上文，“they” 指的是 “dogs”。","takeaway":"句子的主语是 “they”（它们），指代“狗”。"},{"question":"当主语是 “they” 时，如果要表达“不（做某事）”，应该用哪个助动词？是 “don't” 还是 “doesn't”？","hint":"“they” 是复数。","takeaway":"主语是 “they” 时，否定形式要用 “don't”。"},{"question":"那 B 选项 “doesn't know” 为什么是错的？它应该和什么样的主语搭配？","hint":"比如“他不知道”或者“她不知道”应该怎么说？","takeaway":"“doesn't” 用于第三人称单数主语，如 he, she, it。"}]},{"title":"助动词与实义动词","steps":[{"question":"“know”（知道）是一个表示“是/成为”的 be 动词，还是一个表示具体动作或状态的实义动词？","hint":"像 run, eat, think, know 这类词叫什么动词？","takeaway":"“know” 是一个实义动词。"},{"question":"对于实义动词，我们能直接在后面加 “not” 来否定吗？比如 “they know not”？","hint":"这种说法在现代英语中几乎不用。我们需要一个“帮手”词。","takeaway":"实义动词的否定需要借助助动词 “do/does/did”。"},{"question":"既然需要助动词，那为什么 A (aren't know) 和 D (isn't know) 是错的？","hint":"“are” 和 “is” 是 be 动词，它们和助动词 “do” 是两套不同的系统。","takeaway":"be 动词不能和实义动词原形直接连用，所以 A 和 D 的结构是错误的。"}]}]}}]},{"section_title":"V. 阅读理解。根据短文内容，判断正(T)误(F)。(共10分)","section_instruction":"The sun is a fixed star (恒星). It is very, very hot and it gives out heat and light. Eight planets (行星) move around it. The earth is one of them. As far as we know, the earth is the only planet with life on it. The earth has air and water, and it gets heat and light from the sun. Life needs air, water, heat and light.\nThe earth moves around itself, too. It turns from west to east. The earth has a satellite (卫星), the moon.\nThe moon moves around the earth. There is no air or water on the moon, so there is no life there.","items":[{"number":"51","item_type":"choice","context_note":"See Passage (一).","stem":"The sun can give out heat and light.","options":{"A":"T","B":"F","C":"","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查对文章细节信息的理解和判断。题干意为“太阳能够释放热量和光”。根据文章内容“The sun is a fixed star (恒星). It is very, very hot and it gives out heat and light.”可知，太阳会释放热量和光。题干陈述与文章内容一致，因此判断为正确（True）。","knowledge_expansion_md":"### 阅读理解判断题（T/F）解题技巧\n\n1.  **关键词定位法**：\n    -   划出题干中的关键词（名词、动词、形容词、时间、地点等），如本题的 `sun`, `give out`, `heat`, `light`。\n    -   带着关键词快速在文章中寻找相关句子，进行信息匹配。\n\n2.  **同义替换意识**：\n    -   题目中的词语不一定与原文完全相同，常常会使用同义词或不同的句式来转述。例如，题干中的 `give out` 可能在原文中是 `produce` 或 `emit`。考生需要具备识别同义替换的能力。\n\n3.  **忠于原文原则**：\n    -   所有判断的唯一依据是文章内容，而不是自己的背景知识或常识。即使题干陈述的是一个普遍真理，也必须在文章中找到依据。如果文章没有提及相关信息，通常应判断为“未提及”（Not Given），但在T/F题中，若无依据则可能需要判断为F。\n\n4.  **注意绝对词和逻辑词**：\n    -   要特别留意题干中的绝对词（如 `all`, `only`, `never`, `every`）和逻辑词（如 `and`, `or`, `both`）。这些词往往是考点所在，只要原文信息与这些词的逻辑不符，陈述就为错误。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这个题干“The sun can give out heat and light.”的核心信息是什么？请找出3个关键词。","hint":"关于什么物体？它能发出什么？","takeaway":"题干的核心关键词是 “sun”（太阳）、“heat”（热量）和 “light”（光）。"},{"question":"现在，请在文章中快速找到包含这三个关键词或其近义词的句子。","hint":"扫描文章，寻找 “sun”, “heat”, “light” 这些词。","takeaway":"文章中可以定位到句子：“It is very, very hot and it gives out heat and light.”"},{"question":"对比你找到的句子和题干的陈述，它们的意思是否一致？","hint":"文章说太阳“gives out heat and light”，题干说太阳“can give out heat and light”。","takeaway":"文章信息与题干陈述的意思完全一致，因此判断为正确（T）。"}]},{"title":"细节信息核对","steps":[{"question":"题干是一个陈述句，我们需要判断它的真伪。判断的唯一标准是什么？","hint":"是我们的常识，还是文章的内容？","takeaway":"在阅读理解题中，判断的唯一标准是文章提供的信息。"},{"question":"文章中是如何描述太阳的？它提到了太阳的什么功能？","hint":"找到关于 “sun” 的那句话，看看动词是什么。","takeaway":"文章说太阳是一颗恒星，它 “gives out”（发出/释放）热量和光。"},{"question":"文章的描述 “gives out heat and light” 是否支持了题干 “can give out heat and light” 的说法？","hint":"“gives out” 是一个事实陈述，“can give out” 是描述能力。一个正在做某事的东西，必然有能力做某事。","takeaway":"文章中的事实描述完全可以支撑题干中的能力描述，因此陈述为真。"}]},{"title":"同义转述识别","steps":[{"question":"在阅读题中，题干的用词会和原文一模一样吗？","hint":"出题人为了考查你的理解能力，会怎么做？","takeaway":"不一定，题干常常会用同义词或不同的表达方式来转述原文的信息。"},{"question":"在本题中，题干和原文的用词（give out）恰好相同。如果原文用的是 “The sun produces heat and light”，题干的判断会改变吗？","hint":"“produce”（产生）和 “give out”（发出）在这里意思是否相近？","takeaway":"不会改变，因为 “produce” 是 “give out” 的同义词，表达的意思相同。"},{"question":"这个练习告诉我们，在做阅读题时，除了找相同的词，更重要的是什么？","hint":"不要只做“找茬”游戏，要理解词语背后的...","takeaway":"更重要的是理解词语和句子的真实含义，并能识别出意思相同但形式不同的表达。"}]}]}},{"number":"52","item_type":"choice","context_note":"See Passage (一).","stem":"Both the earth and the moon move around the sun.","options":{"A":"T","B":"F","C":"","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查对文章细节和逻辑关系的准确理解。题干意为“地球和月球都围绕太阳转”。根据文章内容，“Eight planets (行星) move around it [the sun]. The earth is one of them.”可知地球围绕太阳转。但对于月球，文章明确指出“The moon moves around the earth.”（月球围绕地球转）。题干中的“Both...and...”要求两个部分都成立，但关于月球运动的描述与原文不符，因此整个陈述是错误的（False）。","knowledge_expansion_md":"### 如何应对阅读判断题中的逻辑词\n\n阅读判断题中，逻辑词是出题人设置陷阱的常见手段，需要特别警惕。\n\n1.  **`Both...and...` (两者都)**：要求连接的两个部分都必须为真，只要有一个为假，整个陈述就为假。这是本题的考点。\n\n2.  **`All`, `Every`, `Only` (所有, 每个, 仅仅)**：这类词表示绝对化，语气很强。在判断时，要检查文章内容是否支持这种绝对的说法。如果文章只说“一些”或“大部分”，而题干用了 `all`，那么题干就是错误的。\n    -   例：原文“Some students like English.” 题干“All students like English.” (F)\n\n3.  **`Some`, `Many`, `Often` (一些, 许多, 经常)**：这类词表示部分或非绝对情况，通常比绝对词更容易为真。 \n\n4.  **`Not` (不)**：直接的否定。需要仔细核对原文是否也是否定，或是肯定。有时原文是肯定，题干是否定，反之亦然。\n\n**解题策略**：看到这些逻辑词时，放慢速度，把题干的陈述拆分开，逐一到原文中去验证，确保逻辑链条的每一环都与原文相符。","socratic_tracks":[{"title":"关键逻辑词分析","steps":[{"question":"题干 “Both the earth and the moon move around the sun” 中，哪个词对整个句子的真假起到了决定性作用？","hint":"哪个词要求“两者都必须……”？","takeaway":"关键词是 “Both...and...”（两者都），它要求地球和月球必须同时满足后面的条件。"},{"question":"我们来分步验证。第一部分：地球(the earth)是否围绕太阳(sun)转？文章是怎么说的？","hint":"在文章中找到关于 “earth” 和 “sun” 的句子。","takeaway":"是的，文章说“Eight planets (行星) move around it [the sun]. The earth is one of them.”，这说明地球围绕太阳转。所以第一部分成立。"},{"question":"第二部分：月球(the moon)是否围绕太阳(sun)转？文章是怎么说的？","hint":"找到描述月球运动的句子。","takeaway":"不是，文章明确说“The moon moves around the earth.”，它围绕地球转，而不是太阳。所以第二部分不成立。"},{"question":"既然 “Both...and...” 的两个条件没有被同时满足，那么整个陈述是正确还是错误？","hint":"一真一假，在“两者都”的逻辑下，结果是什么？","takeaway":"因为 “Both...and...” 要求两个条件都为真，而现在有一个是假的，所以整个句子是错误的（F）。"}]},{"title":"细节辨析与信息对比","steps":[{"question":"文章是如何描述月球运动的？","hint":"找到描述月球运动的句子。","takeaway":"文章明确指出“The moon moves around the earth.”，即月球是围绕地球运动的。"},{"question":"题干的说法 “the moon move around the sun” 与文章的描述有什么不同？","hint":"题干的说法比较笼统，而文章的描述更精确。","takeaway":"题干的说法“the moon move around the sun”与文章中“The moon moves around the earth.”的明确信息相矛盾。"},{"question":"为什么在阅读理解中，这种看似微小的细节差异如此重要？","hint":"这正是考查你是否能仔细、准确地理解文本。","takeaway":"阅读理解考查的就是对文本信息的精确把握能力，任何与原文信息的偏差都可能导致判断错误。"}]},{"title":"忠于原文原则","steps":[{"question":"从天文学知识我们知道，月球确实随着地球在绕太阳公转。那为什么这道题的答案是 F (错误)？","hint":"我们的判断依据应该是自己的背景知识，还是文章的明确说明？","takeaway":"在做阅读理解题时，必须严格遵守“忠于原文”的原则，文章的字面意思是唯一判断标准。"},{"question":"文章通过区分地球和月球的运动，向我们传达了什么样的精确信息？","hint":"它在区分两种不同的运动关系。","takeaway":"文章明确区分了两种运动：地球围绕太阳转，月球围绕地球转。根据文章的描述，月球的运动对象是地球。"},{"question":"这个题目给我们什么启示？当我们的常识和文章信息看起来有出入时，应该怎么办？","hint":"考试考的是对这篇文章的理解。","takeaway":"当常识和文章信息有出入时，必须以文章的明确陈述为准，不能凭自己的知识想当然。"}]}]}},{"number":"53","item_type":"choice","context_note":"See Passage (一).","stem":"The earth turns from east to west.","options":{"A":"T","B":"F","C":"","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查对文章细节信息的判断。题干意为“地球自东向西转动”。文章中明确指出：“It [the earth] turns from west to east.”（它[地球]自西向东转动）。题干陈述与文章内容完全相反，因此是错误的（False）。","knowledge_expansion_md":"### 知识点拓展：方位与地球运动\n\n1.  **基本方位词**：东(east)、南(south)、西(west)、北(north)。\n2.  **地球的运动**：\n    *   **自转 (Rotation)**: 地球围绕自身地轴的转动，方向为**自西向东 (from west to east)**。自转一圈约24小时，产生昼夜交替。\n    *   **公转 (Revolution)**: 地球围绕太阳的转动，方向也是自西向东。公转一周约365天，形成四季变化。\n3.  **易错点**：考生容易将“太阳东升西落”的视觉现象误解为地球的转动方向。需要牢记：正是因为地球“自西向东”转，我们才会先在东方看到太阳，感觉太阳“从东方升起”。","socratic_tracks":[{"title":"原文信息定位法","steps":[{"question":"题干说地球 'turns from east to west'。我们应该在文章中寻找关于地球（the earth）如何 'turn'（转动）的句子。","hint":"找到描述地球自身运动的句子。","takeaway":"文章中可以找到句子：'The earth moves around itself, too. It turns from west to east.'"},{"question":"对比文章的 'from west to east' 和题干的 'from east to west'，它们是否一致？","hint":"west 和 east 的顺序不同。","takeaway":"两者描述的方向正好相反，所以题干陈述是错误的。"}]},{"title":"方向与运动逻辑（拓展）","steps":[{"question":"我们每天看到太阳从哪个方向升起？","hint":"回想一下早晨太阳的位置。","takeaway":"我们看到太阳从东方升起，西方落下。"},{"question":"想象一下你坐在一辆向东行驶的火车上，窗外的树是向哪个方向移动的？","hint":"相对运动的原理。","takeaway":"火车向东行驶，窗外的树看起来是向西移动的。"},{"question":"那么，既然我们看到太阳是“东升西落”（向西移动），地球本身是向哪个方向转动的呢？","hint":"将地球比作火车，太阳比作窗外的树。","takeaway":"太阳看起来在向西移动，说明地球本身正在自西向东转动。"}]}]}},{"number":"54","item_type":"choice","context_note":"See Passage (一).","stem":"There is air and water on the moon.","options":{"A":"T","B":"F","C":"","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查对文章细节信息的判断。题干意为“月球上有空气和水”。文章最后一句明确指出：“There is no air or water on the moon, so there is no life there.”（月球上没有空气和水，所以那里没有生命。）题干的陈述与文章内容完全相反，因此是错误的（False）。","knowledge_expansion_md":"### 知识点拓展：There be 句型与不可数名词\n\n1.  **There be 句型**：表示“某地有某物”，基本结构为 `There is/are + 名词 + 地点状语`。\n    *   `There is` 用于连接单数可数名词或不可数名词。例：`There is a book on the desk.` / `There is some water in the glass.`\n    *   `There are` 用于连接复数可数名词。例：`There are three apples on the table.`\n2.  **不可数名词 (Uncountable Nouns)**：指不能以数目计算的名词，如 `air` (空气), `water` (水), `information` (信息), `news` (新闻), `money` (钱) 等。它们没有复数形式，通常被视为单数。\n3.  **题干分析**：`There is air and water on the moon.` 句中 `air` 和 `water` 都是不可数名词，因此谓语动词用 `is`。","socratic_tracks":[{"title":"原文信息定位","steps":[{"question":"要判断这个句子是否正确，我们应该在文章中寻找关于月球（moon）、空气（air）和水（water）的信息。请找出相关句子。","hint":"扫描文章最后一部分。","takeaway":"文章最后一句是：'There is no air or water on the moon, so there is no life there.'"},{"question":"文章说 'no air or water'。题干说 'There is air and water'。这两种说法矛盾吗？","hint":"一个是肯定，一个是否定。","takeaway":"是的，文章的陈述是直接的否定，与题干的肯定陈述完全相反，所以题干是错误的。"}]},{"title":"科学常识应用","steps":[{"question":"根据你在科学课上学到的知识，月球的环境是怎样的？","hint":"想一想宇航员登月时需要穿什么？为什么？","takeaway":"月球上几乎是真空，没有空气，温差极大。"},{"question":"宇航员的宇航服为他们提供了什么？这反过来证明了月球上缺少什么？","hint":"宇航服提供了氧气、适宜的温度和压力。","takeaway":"宇航员需要穿着复杂的宇航服，这恰恰说明了月球上没有可供呼吸的空气和适宜生命存在的环境。"}]},{"title":"语法结构分析","steps":[{"question":"句子 'There is air and water on the moon.' 使用了什么句型？","hint":"这是一个以 'There' 开头的句子。","takeaway":"这使用了 'There be' 句型，表示“存在”。"},{"question":"句子里 'air' 和 'water' 是可数名词还是不可数名词？","hint":"你能说 'an air' 或者 'two waters' 吗？","takeaway":"'air' 和 'water' 都是不可数名词。"},{"question":"为什么当 'air and water' 两样东西并列时，动词用的还是 'is' 而不是 'are'？","hint":"在 There be 句型中，动词的形式通常由紧跟其后的第一个名词的数来决定（就近原则）。","takeaway":"在 'There be' 句型中，动词单复数遵循“就近原则”，由离它最近的名词决定。"}]}]}},{"number":"55","item_type":"choice","context_note":"See Passage (一).","stem":"The earth can move around the sun and move around itself.","options":{"A":"T","B":"F","C":"","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查对文章信息的综合理解。题干意为“地球能够围绕太阳转动，也能围绕自身转动”。根据文章内容，“Eight planets (行星) move around it [the sun]. The earth is one of them.”说明地球围绕太阳转。同时，文章也提到“The earth moves around itself, too.”说明地球也围绕自身转动。题干的陈述综合了这两点信息，与文章内容相符，因此是正确的（True）。","knowledge_expansion_md":"### 知识点拓展：反身代词 (Reflexive Pronouns)\n\n1.  **定义**：反身代词指主语的动作返回到其自身，通常翻译为“……自己”。它由人称代词或物主代词后加 `-self` (单数) 或 `-selves` (复数) 构成。\n2.  **常见形式**：\n    *   myself (我自己), yourself (你自己), himself (他自己), herself (她自己), itself (它自己)\n    *   ourselves (我们自己), yourselves (你们自己), themselves (他们自己)\n3.  **用法**：\n    *   作宾语，表示动作的接受者就是主语本身。例：The earth moves around **itself**. (地球围绕自身转动。) He hurt **himself**. (他伤了自己。)\n    *   作同位语，用于加强主语或宾语的语气。例：I **myself** did the homework. (我亲自做的作业。)\n4.  **题干分析**：在 `move around itself` 中，`itself` 指代主语 `The earth`，表示地球是围绕“它自己”转动，符合反身代词的用法。","socratic_tracks":[{"title":"信息整合与判断","steps":[{"question":"这个句子由 'and' 连接了两个部分。第一部分是 'The earth can move around the sun'。请在文章中找到支持这个说法的句子。","hint":"找关于地球和太阳运动关系的句子。","takeaway":"文章提到 'Eight planets (行星) move around it [the sun]. The earth is one of them.'，这证明了地球围绕太阳转。"},{"question":"第二部分是 'move around itself'。请在文章中找到支持这个说法的句子。","hint":"找关于地球自身运动的句子。","takeaway":"文章提到 'The earth moves around itself, too.'，这证明了地球围绕自身转。"},{"question":"既然文章内容同时支持了 'and' 连接的两个部分，那么整个题干的陈述是正确还是错误？","hint":"如果一个复合句的两个部分都为真，那么整个句子也为真。","takeaway":"当 'and' 连接的两个信息点都正确时，整个陈述就是正确的（T）。"}]},{"title":"代词 'itself' 的理解","steps":[{"question":"在短语 'move around itself' 中，'itself' 指的是谁？","hint":"想一想这个句子的主语是什么。","takeaway":"'itself' 指的是句子的主语 'The earth' (地球)。"},{"question":"为什么这里用 'itself' 而不是 'it'？","hint":"当动作的发出者和承受者是同一个时，我们用什么代词？","takeaway":"当主语和宾语指代同一对象时，宾语需要使用反身代词。"}]},{"title":"科学概念联系","steps":[{"question":"地球围绕太阳转动（公转）会产生什么自然现象？","hint":"一年中天气有什么变化？","takeaway":"地球的公转产生了四季更替。"},{"question":"地球围绕自身转动（自转）又会产生什么自然现象？","hint":"一天中光线有什么变化？","takeaway":"地球的自转产生了昼夜交替。"}]}]}}]},{"section_title":"VI. 阅读理解。(共10分)","section_instruction":"Miss White: Today is Thursday, 14th July. Tomorrow is the start of the school holiday, children. Where are you going on holiday, Xiaoling?\nXiaoling: I'm going to America, Miss White.\nMiss White: That's fantastic, Xiaoling. How are you going to get there?\nXiaoling: By plane, of course.\nMiss White: Where are you going on holiday, Yongxian?\nYongxian: I'm going to Hong Kong tomorrow.\nMiss White: That's super, Yongxian. How are you going to get there?\nYongxian: I'm going by train.\nMiss White: I'm going to Hong Kong tomorrow, too. What time is your train leaving for Hong Kong?\nYongxian: At half past seven in the morning. What about yours?\nMiss White: At a quarter to eight. Where are you going on holiday, Wang Lili?\nWang Lili: I'm going to Italy tomorrow.\nMiss White: That's great. How are you going to get there?\nWang Lili: I'm going by ship.\nMiss White: When will you get there?\nWang Lili: At about four o'clock the next afternoon.\nMiss White: Where are you going on holiday, Jiamin?\nJiamin: I'm going to stay with my grandmother.\nMiss White: That's nice, Jiamin. How are you going to get there?\nJiamin: I'm going by bus. She lives near my home.","items":[{"number":"56","item_type":"choice","context_note":"See Passage (二).","stem":"What time will Yongxian's train leave for Hong Kong?","options":{"A":"At half past 10.","B":"At a quarter to 10.","C":"At half past 7.","D":"At a quarter past 10."},"teaching":{"correct_answer":"C","explanation_md":"该题考查对文章细节信息的定位和时间表达法的理解。问题是“永贤去香港的火车几点出发？”。根据原文，当Miss White问Yongxian“What time is your train leaving for Hong Kong?”时，Yongxian回答：“At half past seven in the morning.”。选项C“At half past 7.”与原文信息完全一致，意为“七点半”。因此，C是正确答案。","knowledge_expansion_md":"### 知识点拓展：英语中的时间表达法\n\n在英语中，询问和回答时间有多种方式。\n\n1.  **直接读写法 (Digital Format)**：直接按数字顺序读。如 10:30 读作 `ten thirty`。\n\n2.  **传统读法 (Analog Format)**：\n    *   **整点**：用 `o'clock`。如 7:00 是 `seven o'clock`。\n    *   **半点**：用 `half past + 小时`。如 10:30 是 `half past ten`。\n    *   **15分钟/一刻钟**：用 `a quarter`。\n        *   `a quarter past + 小时`：表示“……点过一刻”。如 10:15 是 `a quarter past ten`。\n        *   `a quarter to + 即将到的小时`：表示“差一刻到……点”。如 9:45 是 `a quarter to ten`。\n    *   **其他分钟**：\n        *   30分钟以内：用 `past`。格式：`分钟数 + past + 小时`。如 10:20 是 `twenty past ten`。\n        *   超过30分钟：用 `to`。格式：`（60-分钟数）+ to + 即将到的小_时`。如 10:50 是 `ten to eleven`。\n\n3.  **与时间搭配的介词**：表示在具体的时刻，用介词 `at`。如 `at 10:30`, `at half past ten`。","socratic_tracks":[{"title":"时间表达法转换","steps":[{"question":"选项A 'At half past 10'，用数字怎么表示？","hint":"'half' 是一半，一小时的一半是多少分钟？'past' 是“经过”的意思。","takeaway":"'half past 10' 就是 10 点过去了 30 分钟，即 10:30。"},{"question":"那选项B 'At a quarter to 10' 呢？","hint":"'quarter' 是四分之一，一小时的四分之一是多少分钟？'to' 是“到”的意思。","takeaway":"'a quarter to 10' 是“差一刻钟到 10 点”，即 9:45。"},{"question":"选项D 'At a quarter past 10' 呢？","hint":"这次是 'past'，表示“经过”。","takeaway":"'a quarter past 10' 是“10 点过一刻”，即 10:15。"}]},{"title":"阅读理解寻关键信息","steps":[{"question":"这个问题在问什么？我们需要从文章中找到什么信息？","hint":"看疑问词 'What time'。","takeaway":"问题在问“什么时间”，我们需要找到一个具体的时间点。"},{"question":"为了找到这个时间，我们应该在文章里寻找哪些关键词？","hint":"人名、目的地、交通工具、动作等都是很好的关键词。","takeaway":"我们可以通过定位 'Yongxian', 'train', 'leave for Hong Kong' 等关键词来快速找到相关句子。"},{"question":"找到相关句子后，我们要做什么？","hint":"将找到的时间信息和选项进行对比。","takeaway":"定位到原文信息后，需仔细比对，选择与原文信息完全匹配的选项。"}]},{"title":"介词的用法","steps":[{"question":"为什么所有选项都以 'At' 开头？","hint":"这是一个用在时间前面的词。","takeaway":"'At' 是一个介词，用在具体的时间点前面。"},{"question":"我们什么时候用 'at'，什么时候用 'in' 或 'on' 来表示时间？","hint":"想一想它们后面跟的时间单位的大小。'at' 用于最小的单位，'in' 用于最大的单位。","takeaway":"表示时间点用 'at' (at 5 o'clock)；表示日期或星期用 'on' (on Monday, on May 1st)；表示月份、年份、季节等较长时间用 'in' (in July, in 2024)。"}]}]}},{"number":"57","item_type":"choice","context_note":"See Passage (二).","stem":"Who else goes to Hong Kong?","options":{"A":"Xiaoling.","B":"Wang Lili.","C":"Jiamin.","D":"Miss White."},"teaching":{"correct_answer":"D","explanation_md":"这是一道细节理解题。题目询问“还有谁去香港？”。根据原文，Yongxian先提到他要去香港（'I'm going to Hong Kong tomorrow.'）。随后，Miss White说：“I'm going to Hong Kong tomorrow, too.”。这里的关键词“too”意为“也”，表明除了Yongxian之外，Miss White也去香港。因此，正确答案是D。","knowledge_expansion_md":"在阅读理解中，要特别注意一些表示并列、转折、递进或补充说明的信号词（Signal Words）。\n\n*   **表示“也，还”的词**：`also`, `too`, `as well`。这些词的出现，通常意味着前文提到的情况也适用于新的人或事物，是回答类似“Who else...?”问题的关键线索。\n*   **解题策略**：做此类题目时，应先定位到题目涉及的核心信息（如本题的“去香港”），找到第一个相关人物（Yongxian），然后根据“else”（另外的，其他的）这一要求，在附近寻找`also`, `too`等词，从而快速锁定第二个相关人物。\n*   **易错点**：考生容易在找到第一个信息点后，忽略题目中“else”这个词所要求的“另外一个”的含义。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"题目问的是“还有谁”（Who else）去香港。在文章中，我们首先要找到第一个确定要去香港的人是谁？","hint":"请阅读文章，看看Miss White和Yongxian的对话。","takeaway":"文章明确提到 Yongxian 要去香港。"},{"question":"既然Yongxian要去香港，那么题目中的“else”提示我们，应该寻找哪个表示“也”的词来找到另一个人？","hint":"在英语中，表示“也”的常用词有 also, too 等。","takeaway":"关键词 'too' (也) 是找到答案的关键线索。"},{"question":"文章中谁说了含有 'too' 的句子，并且目的地也是香港？","hint":"仔细阅读Miss White说的话：“I'm going to Hong Kong tomorrow, too.”。","takeaway":"Miss White 说她“也”要去香港，因此她就是“另外一个”去香港的人。"}]},{"title":"选项排除法","steps":[{"question":"我们来看看选项A，Xiaoling。根据文章，她在假期要去哪里？","hint":"在文章中找到 Xiaoling 的名字，看看她计划去哪个国家。","takeaway":"Xiaoling 要去美国 (America)，而不是香港，因此排除A。"},{"question":"选项B是 Wang Lili。她要去哪里？","hint":"在文章中找到 Wang Lili 的名字，看看她计划去哪个国家。","takeaway":"Wang Lili 要去意大利 (Italy)，而不是香港，因此排除B。"},{"question":"选项C，Jiamin。他要去哪里？","hint":"Jiamin说他要“stay with my grandmother”。","takeaway":"Jiamin要去奶奶家，他奶奶住在他家附近，文章没有提及他要去香港，因此可以排除C。"}]}]}},{"number":"58","item_type":"choice","context_note":"See Passage (二).","stem":"Who goes on holiday by ship?","options":{"A":"Yongxian.","B":"Jiamin.","C":"Wang Lili.","D":"We don't know."},"teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找题。题目询问“谁乘船去度假？”。根据原文，当Miss White问Wang Lili如何去意大利（'How are you going to get there?'）时，Wang Lili回答：“I'm going by ship.”。这里的“by ship”意为“乘船”。因此，乘船去度假的是Wang Lili。","knowledge_expansion_md":"本题考察对交通工具表达方式的掌握。\n\n*   **核心结构**：`by + 交通工具`，表示“乘坐/通过某种交通工具”。这是一个非常固定的用法，其中交通工具名词前不加冠词（a/an/the）。\n    *   `by ship` (乘船)\n    *   `by train` (乘火车)\n    *   `by plane` / `by air` (乘飞机)\n    *   `by car` (乘小汽车)\n    *   `by bus` (乘公共汽车)\n    *   `by bike` (骑自行车)\n*   **特殊情况**：表示“步行”时，我们不用`by`，而是用固定短语 `on foot`。\n*   **另一种表达**：我们也可以用动词 `take` 来表达，如 `take a ship`, `take the train`, `take a plane`。注意，此时交通工具前通常需要加冠词。","socratic_tracks":[{"title":"交通方式词汇","steps":[{"question":"题目的关键词是什么？它问的是哪种交通方式？","hint":"请看问题中的短语 'by ship'，它是什么意思？","takeaway":"题目的关键信息是 'by ship'，意思是“乘船”。"},{"question":"现在，请在文章中找到 'ship' 这个词，看看它和哪个人的名字联系最紧密？","hint":"仔细阅读描述 Wang Lili 计划的句子，里面提到了交通方式。","takeaway":"文章中 'I'm going by ship.' 这句话是 Wang Lili 说的。"}]},{"title":"细节信息定位","steps":[{"question":"这是一道典型的细节题。我们应该如何快速在文章中找到答案？是先通读全文再回忆，还是带着问题找关键词？","hint":"想一想哪种方法更高效，更不容易出错。","takeaway":"对于细节题，最高效的方法是带着问题中的关键词（如 'ship'）去文章中定位相关句子。"},{"question":"我们来核对一下其他选项。Yongxian (选项A) 的交通方式是什么？","hint":"找到提到 Yongxian 的句子，看看他怎么去香港。","takeaway":"文章明确指出 Yongxian 是 'by train'（乘火车），而不是 'by ship'。"},{"question":"Jiamin (选项B) 呢？他是怎么去奶奶家的？","hint":"找到描述 Jiamin 出行计划的句子。","takeaway":"文章明确指出 Jiamin 是 'by bus'（乘公共汽车），而不是 'by ship'。"}]}]}},{"number":"59","item_type":"choice","context_note":"See Passage (二).","stem":"When will Wang Lili get to Italy?","options":{"A":"On Friday.","B":"On Saturday.","C":"On Sunday.","D":"We don't know."},"teaching":{"correct_answer":"B","explanation_md":"这是一道基于信息的推理题。题目问“王丽丽什么时候能到意大利？”。首先，根据对话开头“Today is Thursday, 14th July. Tomorrow is the start of the school holiday”，可知她们的出发日“tomorrow”是7月15日，星期五（Friday）。其次，当Miss White问Wang Lili何时到达时，她回答：“At about four o'clock the next afternoon.”。从星期五（Friday）出发，“the next afternoon”指的是第二天的下午，也就是星期六（Saturday）的下午。因此，她将在星期六到达。","knowledge_expansion_md":"本题考察对时间信息的理解和简单推算能力，这是阅读理解中的常见题型。\n\n*   **关键动词**：`take` 在这里意为“花费（时间）”，`It takes sb. some time to do sth.` 是一个常用句型，意为“做某事花费了某人多长时间”。例如：`It took him two days to get to Xiamen.`\n*   **时间推算**：解答此类问题需要清晰的时间线概念。`出发时间 + 旅途时长 = 到达时间`。在计算时要特别小心，例如“两天”是指经过两个24小时的时间段。\n*   **星期词汇**：必须熟练掌握一周七天的英文单词及其顺序：Monday (周一), Tuesday (周二), Wednesday (周三), Thursday (周四), Friday (周五), Saturday (周六), Sunday (周日)。","socratic_tracks":[{"title":"时间信息推断","steps":[{"question":"题目问的是 Wang Lili “何时到达”意大利。我们需要先确定她什么时候出发？","hint":"文章开头说“Today is Thursday... Tomorrow is the start of the school holiday.”，而Wang Lili也是“tomorrow”出发。","takeaway":"出发日期是星期四的“明天”，也就是星期五（Friday）。"},{"question":"文章中描述她到达时间的短语是什么？","hint":"找到Wang Lili回答“When will you get there?”的句子。","takeaway":"关键信息是“At about four o'clock the next afternoon.”，意思是“第二天下午四点左右”。"},{"question":"如果她星期五（Friday）出发，那么“第二天”（the next day）是星期几？","hint":"从星期五开始数一天。","takeaway":"从星期五出发，第二天就是星期六（Saturday）。因此她将在星期六到达。"}]},{"title":"星期词汇与顺序","steps":[{"question":"要正确回答这个问题，我们必须熟悉什么基础知识？","hint":"计算的基础是星期的名称和它们的先后顺序。","takeaway":"我们必须熟练掌握一周七天的英文名称及其正确顺序。"},{"question":"请按顺序列出从周四 (Thursday) 开始往后的三天。","hint":"Thursday, ... , ...","takeaway":"正确的顺序是 Thursday (周四), Friday (周五), Saturday (周六)。"}]}]}},{"number":"60","item_type":"choice","context_note":"See Passage (二).","stem":"Where will Jiamin live in the holiday?","options":{"A":"In America.","B":"In Hong Kong.","C":"At his grandma's.","D":"We don't know."},"teaching":{"correct_answer":"C","explanation_md":"这是一道细节定位题。题目询问“假期里Jiamin将住在哪里？”。根据原文，当Miss White问Jiamin假期去哪里时，Jiamin回答：“I'm going to stay with my grandmother.”。这句话意为“我将和我奶奶待在一起”，直接表明了他假期的住处。选项C“At his grandma's”（在他奶奶家）与原文信息完全吻合。因此，C是正确答案。","knowledge_expansion_md":"本题考察对指代关系和所有格的理解。\n\n*   **指代关系**：在阅读中，代词（如 `he`, `she`, `it`, `they`）和地点副词（如 `here`, `there`）起着重要的连接上下文的作用。要准确理解文意，必须搞清楚它们指代的是什么。通常，它们指代的是上文中最近提到的人、物或地点。在本题中，`He` 指代 `Jiamin`，`there` 指代 `Hong Kong`。\n*   **名词所有格**：`'s` 是名词所有格的标志，表示“……的”。`grandma's home` 意为“奶奶的家”。在回答问题时，`at his grandma's` 也可以单独使用，省略了后面的名词 `home`，这是英语中常见的省略用法，例如 `at the doctor's (office)`。\n*   **最佳答案原则**：在选择题中，当有多个选项看起来都部分正确时（如本题的B和C），应选择最准确、最具体、最贴合原文信息的那个作为最佳答案。文章明确提到了“奶奶家”，这比“在香港”更为具体。","socratic_tracks":[{"title":"关键信息定位","steps":[{"question":"题目问 Jiamin 假期将住在哪里。文章中描述他计划的句子是哪一句？","hint":"在文章中找到 Jiamin 的名字，看看他是怎么回答Miss White的问题的。","takeaway":"关键句是 'I'm going to stay with my grandmother.'"},{"question":"短语 'to stay with someone' 是什么意思？","hint":"这通常指在某人那里住一段时间。","takeaway":"这个短语的意思是“和某人待在一起/住在某人家里”，直接回答了题目“住在哪里”的问题。"}]},{"title":"最佳答案选择","steps":[{"question":"我们来看选项A 'In America'。Jiamin要去美国吗？","hint":"去美国的是谁？","takeaway":"去美国的是Xiaoling，不是Jiamin。"},{"question":"再看选项B 'In Hong Kong'。Jiamin要去香港吗？","hint":"去香港的是谁？","takeaway":"去香港的是Yongxian和Miss White，不是Jiamin。"},{"question":"既然文章明确说了Jiamin要 'stay with my grandmother'，哪个选项是这句话最准确的同义转述？","hint":"比较选项和原文信息。","takeaway":"选项C 'At his grandma's' (在他奶奶家) 是对原文信息最直接、最准确的概括，是最佳答案。"}]}]}}]}],"content_markdown":"### 成都树德中学博瑞实验学校 初2026级新初一入学真卷英语\n\n**满分：**100分\n**时间：**60分钟\n\n***\n\n### I. 单项选择。(共30分)\n\n1.  —What _____ he do last weekend?\n    —He _____ tomatoes on the farm.\n    A. does; picked\n    B. did; picked\n    C. did; pick\n\n2.  The magazine talks about _____ dinosaurs.\n    A. a lot of\n    B. a lot\n    C. a lot\n\n3.  Before I was _____ in class. Now I'm very _____.\n    A. old; young\n    B. tall; short\n    C. quiet; active\n\n4.  He _____ his bike and hurt his foot.\n    A. fall\n    B. fell off\n    C. falls off\n\n5.  I _____ a film last weekend.\n    A. see\n    B. seeing\n    C. saw\n\n6.  Can he _____ chess?\n    A. play\n    B. plays\n    C. played\n\n7.  There is going to be a good film at the _____.\n    A. stadium\n    B. cinema\n    C. office\n\n8.  My father usually _____ books _____ Sunday morning.\n    A. read; in\n    B. reading; on\n    C. reads; on\n\n9.  —_____ was your summer holiday, Linda?\n    —It was _____.\n    A. What; good\n    B. How; good\n    C. When; well\n\n10. I _____ a cold. I stayed at home all weekend and slept.\n    A. have\n    B. was\n    C. had\n\n11. We will _____ on the Internet.\n    A. look them up\n    B. look up them\n    C. look them up at\n\n12. —What did you do last night?\n    —I _____ a film.\n    A. He saw a film.\n    B. I see a film.\n    C. I saw a film.\n\n13. Sandy is ill today. She only eats _____ rice and soup.\n    A. a little\n    B. many\n    C. a few\n\n14. —_____ you _____ a parrot show in the park yesterday?\n    —Yes, that's interesting.\n    A. Do; see\n    B. Did; look at\n    C. Did; watch\n\n15. What _____ you _____ next Sunday?\n    A. are; going to do\n    B. are; doing\n    C. are; going\n\n### II. 用单词的适当形式填空。(共30分)\n\n16. —What's the matter?\n    —My nose _____ (hurt).\n\n17. We shouldn't _____ (cut) down the trees.\n\n18. The canteen is on the _____ (two) floor.\n\n19. People couldn't _____ (use) the computer in the Tang Dynasty.\n\n20. Tom's father is a fisherman. He _____ (work) at sea.\n\n21. —Whose ruler is this?\n    —It's _____ (I).\n\n22. Liu Tao goes to bed late and he feels so _____ (sleep) in the morning.\n\n23. Bobby is shouting _____ (excited).\n\n24. He usually _____ (eat) carrots.\n\n25. Nancy likes cooking some _____ (tomato) soup.\n\n26. The students sing the song _____ (happy).\n\n27. There _____ any fruit or a lot of vegetables on the table just now. (be)\n\n28. I _____ (watch) TV last night.\n\n29. Pipi wants _____ (be) a doctor. He wants _____ (help) people.\n\n30. Let's finish _____ (they) _____ (quick).\n\n### III. 完成句子。(共10分)\n\n31. Some students are watching a football match. They are very _____ (兴奋的).\n\n32. Chinese people have the Labour Day holiday in M_____.\n\n33. Last week my brother b_____ me a present from ery, very hot and it gives out heat and light. Eight planets (行星) move around it. The earth is one of them. As far as we know, the earth is the only planet with life on it. The earth has air and water, and it gets heat and light from the sun. Life needs air, water, heat and light.\nThe earth moves around itself, too. It turns from west to east. The earth has a satellite (卫星), the moon.\nThe moon moves around the earth. There is no air or water on the moon, so there is no life there.\n\n51. The sun can give out heat and light.\n    A. T\n    B. F\n\n52. Both the earth and the moon move around the sun.\n    A. T\n    B. F\n\n53. The earth turns from east to west.\n    A. T\n    B. F\n\n54. There is air and water on the moon.\n    A. T\n    B. F\n\n55. The earth can move around the sun and move around itself.\n    A. T\n    B. F\n\n### VI. 阅读理解。(共10分)\n\nMiss White: Today is Thursday, 14th July. Tomorrow is the start of the school holiday, children. Where are you going on holiday, Xiaoling?\nXiaoling: I'm going to America, Miss White.\nMiss White: That's fantastic, Xiaoling. How are you going to get there?\nXiaoling: By plane, of course.\nMiss White: Where are you going on holiday, Yongxian?\nYongxian: I'm going to Hong Kong tomorrow.\nMiss White: That's super, Yongxian. How are you going to get there?\nYongxian: I'm going by train.\nMiss White: I'm going to Hong Kong tomorrow, too. What time is your train leaving for Hong Kong?\nYongxian: At half past seven in the morning. What about yours?\nMiss White: At a quarter to eight. Where are you going on holiday, Wang Lili?\nWang Lili: I'm going to Italy tomorrow.\nMiss White: That's great. How are you going to get there?\nWang Lili: I'm going by ship.\nMiss White: When will you get there?\nWang Lili: At about four o'clock the next afternoon.\nMiss White: Where are you going on holiday, Jiamin?\nJiamin: I'm going to stay with my grandmother.\nMiss White: That's nice, Jiamin. How are you going to get there?\nJiamin: I'm going by bus. She lives near my home.\n\n56. What time will Yongxian's train leave for Hong Kong?\n    A. At half past 10.\n    B. At a quarter to 10.\n    C. At half past 7.\n    D. At a quarter past 10.\n\n57. Who else goes to Hong Kong?\n    A. Xiaoling.\n    B. Wang Lili.\n    C. Jiamin.\n    D. Miss White.\n\n58. Who goes on holiday by ship?\n    A. Yongxian.\n    B. Jiamin.\n    C. Wang Lili.\n    D. We don't know.\n\n59. When will Wang Lili get to Xiamen?\n    A. On Friday.\n    B. On Saturday.\n    C. On Sunday.\n    D. We don't know.\n\n60. Where will Jiamin live in the holiday?\n    A. In America.\n    B. In Hong Kong.\n    C. At his grandma's.\n    D. We don't know.\n","proofread_notes":"1. 卷面标题中的“某”字已删除，以使标题更正式。\n2. 部分题干（如第8、26题）中与作答无关的中文提示语已删除。\n3. 第2题：选项B与选项C内容重复。\n4. 第59题：题干提问的目的地（Xiamen）与阅读材料中的目的地（Italy）不符，属原卷固有错误。","set_number":18,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_18\\page_032.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_18\\page_033.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":60},{"step":2,"name":"verify","items":60,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":60}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:34:15.600618+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");

    function flushText() {

      textBuf = [];

    while (i < lines.length) {

        const tbl = [];

    }
    flushText();
    return chunks;
