<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第18套","exam_meta":{"full_score_text":"满分100分","time_text":"时间60分钟","type_cards":[{"sections":[0],"title":"1. 单项选择","range_text":"第1-15题"},{"sections":[1,2],"title":"2. 用单词的适当形式填空","range_text":"第16-40题"},{"sections":[3],"title":"3. 完形填空","range_text":"第41-50题"},{"sections":[4,5],"title":"4. 阅读理解","range_text":"第51-55题 正误判断；第56-60题 阅读后选择最佳选项"}]},"sections":[{"section_title":"I. 单项选择。(共30分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"—What _____ he do last weekend?\n—He _____ tomatoes on the farm.","options":{"A":"does; picked","B":"did; picked","C":"did; pick","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查一般过去时。根据时间状语 “last weekend”（上周末），可知整个对话描述的是过去发生的事情，应使用一般过去时。第一句是特殊疑问句，其结构为“疑问词 + did + 主语 + 动词原形”，因此第一个空应填 “did”。第二句是肯定陈述句，谓语动词需用过去式，动词 “pick” 的过去式是 “picked”。因此，正确答案是 B。","knowledge_expansion_md":"### 一般过去时用法详解\n\n一般过去时主要用于表示过去某个时间发生且已经结束的动作或存在的状态。其核心在于助动词 `did` 的使用以及动词形式的变化。\n\n**1. 肯定句:** 主语 + 动词过去式 + 其他\n   - `He picked tomatoes last weekend.`\n\n**2. 否定句:** 主语 + `did not` (`didn't`) + 动词原形 + 其他\n   - `He didn't pick tomatoes last weekend.`\n\n**3. 一般疑问句:** `Did` + 主语 + 动词原形 + 其他?\n   - `Did he pick tomatoes last weekend?`\n\n**4. 特殊疑问句:** 疑问词 + `did` + 主语 + 动词原形 + 其他?\n   - `What did he do last weekend?`\n\n**易错点:** 在构成否定句和疑问句时，一旦使用了助动词 `did`，其后的实义动词必须恢复原形，切不可再使用过去式。例如，不说 `*What did he did?` 或 `*He didn't picked...`。","socratic_tracks":[{"title":"时态的判断","steps":[{"question":"看到题干中的 “last weekend”，你首先想到了什么时态？","hint":"“last weekend” 是“上周末”的意思，这是一个表示过去时间的词。","takeaway":"时间状语 “last weekend” 是使用一般过去时的明确标志。"},{"question":"既然是过去时态，那么在构成疑问句时，应该选用哪个助动词？是 “does” 还是 “did”？","hint":"回想一下一般现在时和一般过去时疑问句的构成区别。","takeaway":"一般过去时的疑问句需要使用助动词 “did”。"}]},{"title":"疑问句的动词形式","steps":[{"question":"在含有助动词 “did” 的疑问句中，主语后面的动词应该用什么形式？是原形、过去式还是其他形式？","hint":"比如 “Did you go to school yesterday?” 这里的 “go” 是什么形式？","takeaway":"助动词 “did” 出现后，后面的主要动词必须使用原形。"},{"question":"所以，对于第一句 “What _____ he do last weekend?”，第一个空填 “did” 是不是就完全符合语法规则了？","hint":"这里的 “do” 是实义动词，意为“做”。","takeaway":"是的，这个特殊疑问句的结构是“疑问词+did+主语+动词原形”，完全正确。"}]},{"title":"陈述句的动词形式","steps":[{"question":"回答句 “He _____ tomatoes on the farm.” 描述的也是过去发生的事情，这里的动词应该用什么时态？","hint":"问句问的是上周末做的事，回答也应该是上周末做的事。","takeaway":"回答句也应该使用一般过去时。"},{"question":"在一般过去时的肯定陈述句中，动词用什么形式？","hint":"比如 “I played basketball yesterday.” 这里的 “play” 是什么形式？","takeaway":"一般过去时的肯定句中，谓语动词要用其过去式形式。"},{"question":"那么，动词 “pick” 的过去式是什么？","hint":"“pick” 是一个规则动词，想一想规则动词变过去式的规则。","takeaway":"动词 “pick” 的过去式是 “picked”。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"The magazine talks about _____ dinosaurs.","options":{"A":"a lot of","B":"a lot","C":"","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查量词的用法。题干中 “dinosaurs” 是一个可数名词的复数形式，意为“恐龙”。我们需要一个词组来修饰它，表示“许多”。\n- `a lot of` 意为“许多，大量”，可以修饰可数名词复数和不可数名词，符合题意。\n- `a lot` 是一个副词词组，意为“很，非常”，通常用来修饰动词或形容词，不能直接修饰名词。\n因此，只有 `a lot of` 可以放在名词 `dinosaurs` 前面，构成 “a lot of dinosaurs”（许多恐龙）。","knowledge_expansion_md":"### `a lot of`, `lots of`, `many`, `much`, `a lot` 的辨析\n\n这组词都与“多”有关，但用法各不相同，是初学者的常见易混点。\n\n1.  **`a lot of` / `lots of`**: 意思和用法基本相同，意为“许多，大量”。它们非常灵活，既可修饰**可数名词复数**，也可修饰**不可数名词**，常用于肯定句。\n    - `There are a lot of/lots of books on the desk.` (修饰可数名词复数)\n    - `I drank a lot of/lots of water.` (修饰不可数名词)\n\n2.  **`many` / `much`**: `many` 修饰**可数名词复数**，`much` 修饰**不可数名词**。它们多用于否定句和疑问句。虽然也能用于肯定句，但在口语中不如 `a lot of` 常见。\n    - `Do you have many friends?`\n    - `I don't have much time.`\n\n3.  **`a lot`**: 这是一个**副词词组**，意为“很，非常，常常”，在句中修饰动词、形容词或副词，通常放在句末。它**不能**直接加名词。\n    - `He talks a lot.` (修饰动词 `talks`)\n    - `Thanks a lot.` (固定搭配)\n\n**总结:** 能直接加名词 `dinosaurs` 的只有 `a lot of`, `lots of`, `many`。而 `a lot` 后面不能跟名词。","socratic_tracks":[{"title":"词性与功能","steps":[{"question":"在句子 “The magazine talks about _____ dinosaurs.” 中，横线部分需要填一个什么功能的词或词组？","hint":"看看横线后面的词 “dinosaurs” 是什么词性，横线上的词是用来做什么的。","takeaway":"横线部分需要一个形容词性词组来修饰名词 “dinosaurs”。"},{"question":"“a lot” 和 “a lot of” 的词性有什么不同？","hint":"试着用它们分别造个句子，比如 “I like it ___” 和 “I have ___ books”。","takeaway":"“a lot” 是副词词组，而 “a lot of” 是形容词性词组（量词）。"},{"question":"那么，哪个词组可以用来修饰名词 “dinosaurs”？","hint":"副词不能修饰名词。","takeaway":"只有形容词性词组 “a lot of” 才能修饰名词。"}]},{"title":"用法辨析","steps":[{"question":"你能用 “a lot” 造一个句子吗？","hint":"想想它一般放在句子的什么位置，修饰什么词。比如“他吃得很多”。","takeaway":"“a lot” 通常放在句末修饰动词，如 “He eats a lot.”。"},{"question":"你能用 “a lot of” 造一个句子吗？","hint":"它的后面必须跟上一个什么词？","takeaway":"“a lot of” 后面必须跟名词，如 “He has a lot of books.”。"},{"question":"结合本题，“_____ dinosaurs”，应该用哪个？","hint":"“dinosaurs” 是一个名词。","takeaway":"因为后面有名词 “dinosaurs”，所以必须用 “a lot of”。"}]},{"title":"替换与检验","steps":[{"question":"还有哪些词或词组和 “a lot of” 的意思和用法相似，可以填入这个句子？","hint":"想一想表示“许多”并且可以修饰可数名词复数的词。","takeaway":"“lots of” 和 “many” 都可以表示“许多”并修饰可数名词复数。"},{"question":"我们可以把 “The magazine talks about many dinosaurs.” 替换成 “The magazine talks about a lot of dinosaurs.” 吗？","hint":"比较一下这两个句子的意思和语法结构。","takeaway":"可以，`many` 和 `a lot of` 在这里可以互换，都符合语法。"},{"question":"那我们可以说 “The magazine talks about a lot dinosaurs.” 吗？为什么？","hint":"读一下这个句子，感觉通顺吗？是不是少了点什么？","takeaway":"不可以，“a lot” 后面不能直接跟名词，缺少了介词 “of”。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"Before I was _____ in class. Now I'm very _____.","options":{"A":"old; young","B":"tall; short","C":"quiet; active","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查在语境中选择合适的反义形容词。句中的 “Before”（以前）和 “Now”（现在）表明前后是对比关系，描述的是一种变化。因此，两个空格处应填入一对意思相反的形容词。\n- A选项 “old”（老的）和 “young”（年轻的），不符合“以前老，现在年轻”的逻辑。\n- B选项 “tall”（高的）和 “short”（矮的），不符合“以前高，现在矮”的正常生长逻辑。\n- C选项 “quiet”（安静的）和 “active”（活跃的），描述性格或行为的转变，符合句意，表示“以前我在课堂上很安静，现在我非常活跃”。这种变化是合乎情理的。","knowledge_expansion_md":"### 语境中的反义词\n\n在英语学习中，理解和运用反义词（antonyms）非常重要，尤其是在表示对比、转折的语境中。这类题目往往通过一些信号词来提示对比关系。\n\n**1. 常见的对比信号词/句型:**\n   - `Before ..., now ...` (以前……，现在……)\n   - `... but ...` (……但是……)\n   - `On the one hand ..., on the other hand ...` (一方面……，另一方面……)\n   - `... used to be ..., but now ...` (...过去常常是……，但现在……)\n\n**2. 常见反义形容词对:**\n   - **性格/状态:** `happy` - `sad` (开心-伤心), `active` - `quiet` (活跃-安静), `brave` - `afraid` (勇敢-害怕), `energetic` - `tired` (精力充沛-疲劳)\n   - **外貌/尺寸:** `big` - `small` (大-小), `long` - `short` (长-短), `tall` - `short` (高-矮), `fat` - `thin` (胖-瘦)\n   - **评价/性质:** `good` - `bad` (好-坏), `easy` - `difficult/hard` (简单-困难), `new` - `old` (新-旧), `clean` - `dirty` (干净-脏)\n\n**解题技巧:** 首先找到表示对比的信号词，然后分析选项中的词对是否为反义词，最后判断哪对反义词最符合句子的逻辑和语境。","socratic_tracks":[{"title":"逻辑关系分析","steps":[{"question":"看到句子中的 “Before” 和 “Now”，你觉得这两个词提示了我们句子前后部分是什么关系？","hint":"一个是“以前”，一个是“现在”，它们在描述同一件事吗？","takeaway":"“Before” 和 “Now” 提示了前后是对比关系，描述了随时间发生的变化。"},{"question":"既然是对比关系，那么填入的两个词在意思上应该有什么特点？","hint":"比如，如果以前是“坏”的，现在可能变成了“好”的。","takeaway":"填入的两个词应该是一对反义词。"}]},{"title":"词义与语境","steps":[{"question":"让我们看看 A 选项 “old; young”。一个人可能“以前老，现在年轻”吗？","hint":"想想人的生长规律。","takeaway":"这不符合自然规律，逻辑上是错误的。"},{"question":"再看看 B 选项 “tall; short”。一个人可能“以前高，现在矮”吗？","hint":"正常情况下，人的身高会越长越矮吗？","takeaway":"这同样不符合正常的生长规律。"},{"question":"最后看 C 选项 “quiet; active”。一个人可能“以前在课堂上安静，现在变得活跃”吗？","hint":"人的性格和行为会不会随着成长而改变？","takeaway":"这种性格或行为上的转变是完全可能且合乎逻辑的。"}]},{"title":"词汇辨析","steps":[{"question":"“quiet” 是什么意思？用在 “in class” 这个语境里，描述的是一个什么样的学生？","hint":"一个 “quiet” 的学生在课堂上会做什么，或者不做什么？","takeaway":"“quiet” 意为“安静的”，在课堂上通常指不怎么说话、不爱发言的学生。"},{"question":"“active” 是什么意思？一个 “active” 的学生在课堂上又是什么样的？","hint":"“active” 的反义词是 “quiet”。","takeaway":"“active” 意为“活跃的、积极的”，在课堂上通常指积极举手、乐于参与讨论的学生。"},{"question":"“quiet” 和 “active” 放在这个句子里，是不是完美地表达了一种从“安静”到“活跃”的转变？","hint":"思考一下这种转变是否常见和合理。","takeaway":"是的，这两个词准确地描述了在课堂表现上的积极变化。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"He _____ his bike and hurt his foot.","options":{"A":"fall","B":"fell off","C":"falls off","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查并列句中的时态一致和动词短语。连词 “and” 连接了两个并列的动作：“从自行车上摔下来”和“伤了脚”。第二个动作 “hurt his foot” 中，动词 “hurt” 的原形、过去式和过去分词都是 “hurt”。根据句意，动作已经发生，且如果是一般现在时，主语 “He” 后面应跟 “hurts”，所以这里的 “hurt” 是过去式。根据并列句时态一致的原则，“and” 前面的第一个动作也应该使用过去式。“从……摔下来”的英文短语是 “fall off”，其过去式是 “fell off”。因此，正确答案是 B。","knowledge_expansion_md":"### 并列句时态一致与不规则动词\n\n**1. 并列句的时态一致原则:**\n   当连词 `and`, `but`, `or`, `so` 等连接两个或多个分句时，如果这些分句描述的是同时或先后发生的一系列动作，它们通常使用相同的时态。这有助于保持叙事的连贯性。\n   - `He came in, sat down, and opened a book.` (他走进来，坐下，然后打开了一本书。三个动作都用过去式)\n\n**2. 不规则动词过去式:**\n   英语中有很多动词的过去式和过去分词是不规则变化的，需要特别记忆。本题中的 `fall` 和 `hurt` 都是典型例子。\n   - **`fall` - `fell` - `fallen`**: (跌落) 属于 A-B-C 型。\n   - **`hurt` - `hurt` - `hurt`**: (伤害) 属于 A-A-A 型，其原形、过去式、过去分词形态相同。判断其时态需要结合上下文（如主语人称、时间状语等）。\n\n**3. 动词短语 `fall off`:**\n   这是一个固定的动词短语，意为“从……上掉下或摔下”。当需要将其变为过去式时，只需将短语中的动词 `fall` 变为过去式 `fell` 即可，介词 `off` 保持不变。\n   - `An apple fell off the tree.` (一个苹果从树上掉了下来。)","socratic_tracks":[{"title":"通过并列结构判断时态","steps":[{"question":"句中有一个连词 “and”，它连接了哪两个动作？","hint":"“and” 前面是一个动作，后面是 “hurt his foot”。","takeaway":"“and” 连接了 “_____ his bike” 和 “hurt his foot” 这两个动作。"},{"question":"看到第二个动作 “hurt his foot”，你能判断出它的时态吗？为什么？","hint":"如果是现在时，主语是 “He”，动词 “hurt” 应该是什么形式？","takeaway":"因为主语是 “He”，而动词是 “hurt” 而不是 “hurts”，所以可以判断 “hurt” 在这里是过去式。"},{"question":"既然 “and” 连接的第二个动作是过去时，那么第一个动作应该是什么时态？","hint":"并列连词连接的动作时态通常需要一致。","takeaway":"“and” 连接的并列动作，时态通常需要保持一致，所以第一个动作也应是过去时。"}]},{"title":"动词短语与过去式","steps":[{"question":"“从自行车上摔下来”用英语应该怎么表达？","hint":"“摔倒”是 “fall”，“从……上”用哪个介词？","takeaway":"应该用动词短语 “fall off”。"},{"question":"我们已经确定需要用过去时，那么动词 “fall” 的过去式是什么？","hint":"“fall” 是一个不规则动词，它的过去式不是加 “-ed”。","takeaway":"“fall” 的过去式是 “fell”。"},{"question":"那么，动词短语 “fall off” 的过去式是什么？","hint":"动词短语变时态，只需要改变哪个部分？","takeaway":"动词短语的过去式，只需将短语中的动词变为过去式即可，即 “fell off”。"}]},{"title":"排除错误选项","steps":[{"question":"为什么选项 A “fall” 不对？","hint":"句子的时态是什么？“fall” 是什么形式？","takeaway":"“fall” 是动词原形，而句子需要用过去式。"},{"question":"为什么选项 C “falls off” 不对？","hint":"“falls off” 是什么时态？它用在什么情况下？","takeaway":"“falls off” 是一般现在时的第三人称单数形式，与句子所需的过去时态不符。"},{"question":"排除 A 和 C 后，为什么 B “fell off” 是正确的？","hint":"从短语搭配和时态两方面检查。","takeaway":"“fell off” 既是正确的动词短语，又是正确的过去时态，完全符合句子要求。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"I _____ a film last weekend.","options":{"A":"see","B":"seeing","C":"saw","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般过去时。句中的时间状语 “last weekend”（上个周末）是过去时间的标志，表示动作发生在过去。因此，谓语动词需要使用一般过去时。动词 “see”（看见）的过去式是 “saw”，是一个不规则动词。选项 A “see” 是动词原形，选项 B “seeing” 是现在分词，均不符合题意。故正确答案为 C。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n1.  **用法**：表示过去某个时间发生并完成的动作或存在的状态。常与表示过去的时间状语连用。\n2.  **常见时间状语**：`yesterday` (昨天), `last week/month/year` (上周/月/年), `... ago` (…以前), `in 2010` (在2010年), `just now` (刚才) 等。\n3.  **动词形式**：\n    *   **规则动词**：在动词原形后加 `-ed`，如 `work` -> `worked`, `live` -> `lived`。\n    *   **不规则动词**：形式不固定，需要专门记忆，如 `see` -> `saw`, `go` -> `went`, `do` -> `did`, `have` -> `had`, `eat` -> `ate`。\n4.  **句子结构**：\n    *   肯定句：主语 + 动词过去式 + 其他。\n    *   否定句：主语 + `did not` (didn't) + 动词原形 + 其他。\n    *   一般疑问句：`Did` + 主语 + 动词原形 + 其他？","socratic_tracks":[{"title":"识别句子时态","steps":[{"question":"句子中哪个词或短语告诉我们这件事是什么时候发生的？","hint":"请注意句子的结尾部分，有没有表示时间的词？","takeaway":"时间状语 “last weekend”（上个周末）是判断时态的关键，它表示过去的时间。"},{"question":"当我们描述过去发生的事情时，句子的谓语动词应该使用什么时态？","hint":"是现在、过去还是将来？","takeaway":"描述过去特定时间发生并结束的动作，需要使用一般过去时。"},{"question":"动词 “see” 的过去式是什么？","hint":"这是一个不规则动词，它的过去式形式比较特殊，不是加-ed。","takeaway":"动词 “see” 的过去式是 “saw”。"}]},{"title":"动词形式辨析","steps":[{"question":"选项 A “see” 是动词的什么形式？它通常用在什么情况下？","hint":"想想 “I see a bird now.” 这句话，或者 “You should see a doctor.”","takeaway":"“see” 是动词原形或一般现在时（非第三人称单数）形式。"},{"question":"选项 B “seeing” 是什么形式？它能单独作句子的谓语吗？","hint":"比如 “I am seeing a film.”， “seeing” 前面需要什么词来帮助它？","takeaway":"“seeing” 是现在分词，不能单独作谓语，需要和be动词构成进行时态。"},{"question":"对比三个选项，哪一个才是符合 “last weekend” 这个过去时间的动词形式？","hint":"我们需要一个表示“过去看了”的词。","takeaway":"只有 “saw” 是过去式，符合一般过去时的要求。"}]},{"title":"句子结构分析","steps":[{"question":"这个句子的主语是谁？谓语动词应该描述谁的动作？","hint":"句子的开头通常是主语。","takeaway":"句子的主语是 “I”（我），谓语动词描述的是“我”做出的动作。"},{"question":"根据时间状语 “last weekend”，这个动作应该是什么时候发生的？","hint":"“上个周末”是现在、过去还是将来？","takeaway":"这个动作发生在过去，所以谓语动词要用过去式。"},{"question":"在 A, B, C 三个选项中，哪一个是正确的过去式动词？","hint":"回忆一下不规则动词 see 的变化形式。","takeaway":"“saw” 是 “see” 的过去式，因此是本题的正确答案。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"Can he _____ chess?","options":{"A":"play","B":"plays","C":"played","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查情态动词的用法。句子开头的 “Can” 是一个情态动词，表示“能，会”。情态动词（如 can, may, must, should 等）后面必须跟动词原形。选项 A “play” 是动词原形；选项 B “plays” 是第三人称单数形式；选项 C “played” 是过去式。因此，只有 “play” 符合语法规则。故正确答案为 A。","knowledge_expansion_md":"### 情态动词 (Modal Verbs)\n\n1.  **定义**：情态动词本身有一定词义，但不能独立作谓语，必须和动词原形一起构成谓语，用来表达说话人的语气、情感、态度等，如能力、许可、必要、推测等。\n2.  **常见情态动词**：`can` (能/会), `could` (能/会，过去式), `may` (可以), `might` (可能), `must` (必须), `should` (应该), `will` (将要), `would` (将会，过去式)。\n3.  **核心用法**：\n    *   **`情态动词 + 动词原形`**：这是最关键的规则。例如：`He can swim.` (他会游泳。)\n    *   **无人称和数的变化**：情态动词不随主语的人称和数发生变化。例如：`I can sing.`, `He can sing.` (不能用 `He cans...` 或 `He can sings.`)。\n    *   **否定形式**：在情态动词后加 `not`。例如：`cannot` (can't), `should not` (shouldn't)。\n    *   **疑问形式**：将情态动词提到主语之前。例如：`Can you help me?`","socratic_tracks":[{"title":"情态动词用法","steps":[{"question":"句子开头的 “Can” 是什么类型的词？它有什么作用？","hint":"它表示“能，会”，是一种帮助主要动词表达能力的词。","takeaway":"“Can” 是一个情态动词，用来提问“会不会”或“能不能”。"},{"question":"情态动词后面跟的动词应该是什么形式？是加-s，加-ed，还是用它本来的样子？","hint":"想想你学过的句子，比如 “I can swim.”， “swim” 是什么形式？","takeaway":"情态动词后面必须跟动词原形（base form of the verb）。"},{"question":"在 “play”, “plays”, “played” 中，哪一个是动词原形？","hint":"动词原形就是动词最基本、不加任何词尾变化的形式。","takeaway":"“play” 是动词原形，所以是正确答案。"}]},{"title":"一般疑问句构成","steps":[{"question":"这是一个陈述句还是疑问句？你是怎么判断的？","hint":"看看句子的开头和结尾的标点符号。","takeaway":"这是一个以 “Can” 开头、以问号结尾的一般疑问句。"},{"question":"含有情态动词的一般疑问句，它的语序是怎样的？","hint":"情态动词、主语、主要动词，它们的位置关系是？","takeaway":"含有情态动词的一般疑问句，其结构是：“情态动词 + 主语 + 动词原形...?”。"},{"question":"在这个句子里，主语是 “he”，这会影响后面动词的形式吗？为什么？","hint":"一般现在时中，主语是 “he” 时动词要加-s，但这里有 “Can” 的存在。","takeaway":"不会影响。因为情态动词的规则优先，即使主语是第三人称单数，其后的动词也必须用原形。"}]},{"title":"动词形式排除法","steps":[{"question":"选项 B “plays” 通常用在什么情况下？","hint":"想想主语是 “he”, “she”, “it” 的现在时陈述句。","takeaway":"“plays” 用于一般现在时中，当主语是第三人称单数时，例如 “He plays chess every day.”。"},{"question":"选项 C “played” 通常用在什么情况下？","hint":"想想描述昨天或上周发生的事情。","takeaway":"“played” 是过去式，用于一般过去时，例如 “He played chess yesterday.”。"},{"question":"为什么在这个句子里不能用 “plays” 或 “played”？","hint":"回顾一下句首的单词 “Can” 的语法作用。","takeaway":"因为情态动词 “Can” 决定了其后的动词必须使用原形 “play”，其他形式都不正确。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"There is going to be a good film at the _____.","options":{"A":"stadium","B":"cinema","C":"office","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查地点名词的辨析。句意为“将要有一部好电影在_____上映”。我们需要根据语境选择一个合适的地点。选项 A “stadium” 意为“体育场”，通常用于体育比赛或大型演唱会。选项 B “cinema” 意为“电影院”，是专门放映电影的场所。选项 C “office” 意为“办公室”，是人们工作的地方。根据句意，“看电影”的地点应该是“电影院”。因此，正确答案为 B。","knowledge_expansion_md":"### 常见地点名词辨析\n\n在英语学习中，准确理解和使用表示不同地点的名词非常重要。以下是一些常见的易混淆地点词汇：\n\n*   **`cinema` / `movie theater`**: 电影院。`cinema` 是英式英语，`movie theater` 是美式英语。\n*   **`theater` / `theatre`**: 剧院，主要用于观看戏剧、歌剧、音乐剧等现场表演。`theater` 是美式拼写，`theatre` 是英式拼写。\n*   **`stadium`**: （大型露天）体育场，用于足球、田径比赛等。\n*   **`gymnasium` (gym)**: 体育馆，健身房，通常是室内的。\n*   **`library`**: 图书馆，借书和读书的地方。\n*   **`bookshop` / `bookstore`**: 书店，买书的地方。\n*   **`museum`**: 博物馆，展览历史文物、艺术品的地方。\n*   **`gallery`**: 美术馆，画廊，主要展览艺术作品。\n\n**解题技巧**：做此类题目时，首先要理解整个句子的意思，然后分析每个选项词汇的含义，最后选择与句子语境最匹配的词汇。","socratic_tracks":[{"title":"场景词汇辨析","steps":[{"question":"这个句子的核心内容是关于什么？","hint":"请看 “a good film” 这个短语。","takeaway":"句子的核心内容是关于“一部好电影”。"},{"question":"我们通常去哪里看电影？","hint":"想一想你和家人朋友一起去看电影的地方叫什么。","takeaway":"我们通常去“电影院”（cinema）看电影。"},{"question":"请分别说出 A: stadium, B: cinema, C: office 的中文意思。","hint":"A 是看体育比赛的地方，B 是看电影的地方，C 是工作的地方。","takeaway":"A 是体育场，B 是电影院，C 是办公室。"},{"question":"根据句意，哪个地点最适合“上映一部好电影”？","hint":"将三个选项的中文意思代入句子，看哪个最通顺。","takeaway":"只有“电影院”（cinema）是符合语境的正确答案。"}]},{"title":"逻辑推理与排除","steps":[{"question":"选项 A “stadium”（体育场）是用来做什么的？适合放电影吗？","hint":"世界杯足球赛在哪里举行？","takeaway":"体育场主要用于体育赛事，不是常规的电影放映场所，因此可以排除。"},{"question":"选项 C “office”（办公室）是用来做什么的？和电影有关系吗？","hint":"爸爸妈妈上班的地方叫什么？","takeaway":"办公室是工作场所，与商业放映电影无关，因此可以排除。"},{"question":"排除了 A 和 C 之后，剩下的哪个选项是正确的？","hint":"使用排除法是做选择题的有效策略。","takeaway":"通过排除法，我们可以确定 B “cinema” 是唯一符合逻辑的答案。"}]},{"title":"理解 “There be” 句型","steps":[{"question":"句子开头的 “There is going to be...” 是什么意思？","hint":"它和 “There is...” / “There are...” 句型很像，但表示的是将来的情况。","takeaway":"“There is going to be...” 是 “There be” 句型的将来时形式，表示“将要有某物/某事”。"},{"question":"这个句型告诉我们“将要有”什么东西？在什么地方？","hint":"句型结构是 “There is going to be + 某物 + 地点状语”。","takeaway":"这个句子告诉我们“将要有一部好电影”在某个地方上映。"},{"question":"理解了句意之后，我们只需要为“电影”匹配一个最合适的地点。这个地点是什么？","hint":"电影院、体育场、办公室，三选一。","takeaway":"为“电影”匹配的最佳地点就是“电影院”（cinema）。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"My father usually _____ books _____ Sunday morning.","options":{"A":"read; in","B":"reading; on","C":"reads; on","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般现在时和时间介词的用法。\n1.  **第一个空**：句子中有频率副词 “usually”（通常），表示这是一个习惯性的动作，所以应该使用一般现在时。主语 “My father”（我父亲）是第三人称单数，因此动词 “read” 需要变为第三人称单数形式 “reads”。\n2.  **第二个空**：表示在具体的某一天或某一天的特定时间段（如：星期天早上），应该使用介词 “on”。例如 “on Sunday”, “on Monday morning”。\n综上所述，第一个空填 “reads”，第二个空填 “on”。故正确答案为 C。","knowledge_expansion_md":"### 1. 一般现在时 (Simple Present Tense)\n\n*   **用法**：表示经常性、习惯性的动作或存在的状态，以及客观真理。\n*   **标志词**：`always` (总是), `usually` (通常), `often` (经常), `sometimes` (有时), `every day/week/month` (每天/周/月)。\n*   **动词变化**：当主语是第三人称单数 (he, she, it, a single name like 'My father') 时，动词词尾通常加 `-s` 或 `-es`。\n\n### 2. 时间介词 `in`, `on`, `at`\n\n这是小升初阶段非常重要的考点，记忆口诀可帮助理解：\n\n*   **`in` 年月季，`in` a.m./p.m.** (泛指上下午)：用于较长的时间段，如 `in 2024`, `in May`, `in summer`, `in the morning`。\n*   **`on` 遇日期、星期几**：用于具体的某一天或日期，如 `on Sunday`, `on my birthday`, `on June 1st`。\n*   **`at` 用于时间点**：用于表示精确的时刻，如 `at 8 o'clock`, `at noon`, `at night`。\n\n**特别注意**：当“某天”和“上午/下午/晚上”结合时，介词由“某天”决定，要用 `on`。例如：`on Sunday morning` (在周日早上)，而不是 `in Sunday morning`。","socratic_tracks":[{"title":"一般现在时用法","steps":[{"question":"句子中的 “usually”（通常）告诉我们这个动作是什么时候发生的？是一次性的还是习惯性的？","hint":"想想 “I usually get up at 7.” 这句话的意思。","takeaway":"“usually” 表示这是一个习惯性的动作，句子应该使用一般现在时。"},{"question":"这个句子的主语 “My father” 是第几人称？是单数还是复数？","hint":"“My father” 可以用代词 “he” 来替换吗？","takeaway":"“My father” 是第三人称单数。"},{"question":"在一般现在时中，当主语是第三人称单数时，动词 “read” 应该变成什么形式？","hint":"动词词尾需要加 -s 吗？","takeaway":"动词需要变为第三人称单数形式 “reads”。"}]},{"title":"时间介词辨析","steps":[{"question":"我们要描述的时间是 “Sunday morning”（周日早上）。这是一个泛指的早上，还是特指某一个早上？","hint":"它提到了具体的 “Sunday”（星期天）。","takeaway":"“Sunday morning” 指的是“星期天”这一具体日子的“早上”，是特指。"},{"question":"当我们要表达“在具体的某一天”时，应该用哪个介词？是 in, on, 还是 at？","hint":"回忆一下“在星期一”怎么说？“___ Monday”。","takeaway":"表示在具体的某一天，我们用介词 “on”。"},{"question":"为什么这里不能用 “in”？我们不是常说 “in the morning” 吗？","hint":"对比 “in the morning” 和 “on Sunday morning” 的区别。哪个更具体？","takeaway":"当具体日期和某天的一部分（如morning）结合时，介词由更具体的日期决定，所以要用 “on”。"}]},{"title":"综合解题策略","steps":[{"question":"我们先看第一个空。根据主语 “My father” 和时间状语 “usually”，动词应该是什么形式？","hint":"一般现在时，第三人称单数。","takeaway":"第一个空必须填 “reads”，这样就可以直接排除选项 A 和 B。"},{"question":"既然已经锁定了选项 C，我们来验证一下第二个空。在 “Sunday morning” 前面用介词 “on” 是否正确？","hint":"回忆一下表示“在具体某天的早上/下午”的介词用法。","takeaway":"“on Sunday morning” 是固定搭配，用法正确，这进一步确认了选项 C 是正确答案。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—_____ was your summer holiday, Linda?\n—It was _____.","options":{"A":"What; good","B":"How; good","C":"When; well","D":""},"teaching":{"correct_answer":"B","explanation_md":"本题考查特殊疑问词和形容词的用法。\n1.  第一空询问“你的暑假过得怎么样？”，是对经历和感受进行提问，应用疑问副词 `How`。\n2.  `What` 用于询问“是什么”，`When` 用于询问“是什么时候”，均不符合句意。\n3.  第二空是回答，`It was...` 结构中，be动词 `was` 后面需要跟形容词作表语，说明主语 `It`（指代 summer holiday）的状态。\n4.  `good` 是形容词，意为“好的”，符合要求。`well` 通常作副词，意为“好地”，或作形容词时表示“身体好”，在此不适用。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **`How` vs. `What` 提问**\n    *   `How` 常用来询问方式、程度、状态或评价，如：`How are you?` (你怎么样？) `How was your trip?` (你的旅行怎么样？)\n    *   `What` 常用来询问具体内容或身份，如：`What is your name?` (你叫什么名字？) `What did you do?` (你做了什么？)\n\n2.  **系动词 + 形容词结构**\n    *   be动词 (`am`, `is`, `are`, `was`, `were`) 是最常见的系动词，后面常接形容词作表语，用来说明主语的性质或状态。例如：`The movie is interesting.` (电影很有趣。) `They were tired.` (他们很累。)\n\n3.  **`good` vs. `well`**\n    *   `good` 是形容词，修饰名词。例：`He is a good student.`\n    *   `well` 通常是副词，修饰动词。例：`She sings well.`\n    *   特殊情况：`well` 也可以作形容词，但通常指“身体健康”。例：`I don't feel well today.` (我今天感觉不舒服。)","socratic_tracks":[{"title":"疑问词辨析","steps":[{"question":"如果我们想问别人“周末过得怎么样？”，应该用哪个疑问词开头？","hint":"是想知道周末的“内容”是什么，还是想知道周末的“体验”如何？","takeaway":"询问对事物的评价或感受时，常用 “How” 提问。"},{"question":"那么，如果问 “What was your holiday?”，这又是在问什么呢？","hint":"“What” 关心的是事物的本质或具体信息。","takeaway":"“What was your holiday?” 可能是在问你的假期是什么，比如“一次海边旅行”或“一个夏令营”。"}]},{"title":"词性辨析：形容词与副词","steps":[{"question":"在回答 “It was ___.” 中，横线上的词是用来描述什么的？是描述动作 `was` 还是主语 `It`？","hint":"这里的 `It` 指代的是 `summer holiday`（暑假）。我们是在说“暑假”本身很好，还是“是”这个动作很好？","takeaway":"横线上的词是用来描述主语“暑假”的状态。"},{"question":"用来描述名词或代词（如 `holiday`）状态的词，我们称之为什么词性？","hint":"比如 `a beautiful girl`，`beautiful` 是什么词性？","takeaway":"形容词（adjective）用来修饰名词或代词。"},{"question":"在 `good` 和 `well` 中，哪一个是形容词，哪一个通常是副词？","hint":"我们常说 `do something well`，这里的 `well` 修饰动词 `do`。","takeaway":"`good` 是形容词，`well` 通常作副词，因此这里应选择 `good`。"}]},{"title":"问答逻辑匹配","steps":[{"question":"问句 “_____ was your summer holiday?” 的目的是什么？","hint":"结合回答 “It was ___.” 来推测问句的意图。","takeaway":"问句的目的是询问对暑假的评价。"},{"question":"回答 “It was ___.” 是在对假期做出评价。那么 `good` 和 `well` 哪个更适合用来评价一个假期？","hint":"`good` 意为“好的”，`well` 通常表示“好地”或“身体健康”。","takeaway":"使用形容词 `good` 来评价假期是常见且正确的表达。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"I _____ a cold. I stayed at home all weekend and slept.","options":{"A":"have","B":"was","C":"had","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查动词时态的判断与使用。\n1.  首先，观察后半句 “I stayed at home all weekend and slept.”。\n2.  句中的动词 `stayed` (待) 和 `slept` (睡觉) 都是过去式形式，表明整个事件发生在过去。\n3.  根据上下文时态一致的原则，前半句描述“感冒”这件事也应该使用一般过去时。\n4.  “感冒”的英文表达是固定搭配 `have a cold`。\n5.  动词 `have` 的过去式是 `had`。\n6.  因此，正确的句子是 “I had a cold.”，选择 C。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **上下文时态一致性 (Sequence of Tenses)**\n    *   在一个句子或语段中，如果描述的是同一时间段内发生的一系列动作，动词时态通常需要保持一致。本题中，后句的过去时态是判断前句时态的关键线索。\n\n2.  **固定搭配 `have a + 疾病`**\n    *   英语中常用 `have a...` 的结构来表示患有某种（通常是较轻的）疾病，这是一种习惯用法。\n    *   例如：`have a cold` (感冒), `have a fever` (发烧), `have a headache` (头痛), `have a cough` (咳嗽)。\n\n3.  **不规则动词过去式**\n    *   `have` 的过去式是 `had`，这是一个非常基础且重要的不规则动词。小升初阶段需要熟练掌握常见不规则动词的过去式和过去分词，例如：\n        *   `go - went - gone`\n        *   `see - saw - seen`\n        *   `do - did - done`\n        *   `eat - ate - eaten`","socratic_tracks":[{"title":"寻找时态线索","steps":[{"question":"请看后半句话 “I stayed at home all weekend and slept.”，你能从这句话中找到表示时间的线索吗？","hint":"注意动词的形式，它们可以告诉我们动作发生的时间。","takeaway":"动词 `stayed` 和 `slept` 都是过去式，说明这件事发生在过去。"},{"question":"既然“待在家里”和“睡觉”都发生在过去，那么“感冒”这件事最可能发生在什么时候？","hint":"这几件事是相关的，时态上应该保持一致。","takeaway":"整个句子描述的都是过去发生的事情，所以“感冒”也应该用过去时态来表达。"}]},{"title":"固定搭配的应用","steps":[{"question":"在英语中，我们想表达“得了感冒”，通常用哪个动词和 `a cold` 搭配？","hint":"想一想我们怎么说“头疼”：`have a headache`。","takeaway":"`have a cold` 是表示“感冒”的固定搭配。"},{"question":"既然我们确定了要用 `have a cold`，并且事情发生在过去，那么动词 `have` 应该变成什么形式？","hint":"`have` 是一个不规则动词，它的过去式是什么？","takeaway":"结合时态和固定搭配，我们应该选择 `have` 的过去式 `had`。"}]},{"title":"排除错误选项","steps":[{"question":"为什么不能选 A `have`？","hint":"看看后半句的时态，再想想 `have` 是什么时态？","takeaway":"选项 A `have` 是现在时，与后文的过去时态不符。"},{"question":"为什么不能选 B `was`？如果说 “I was a cold.” 是什么意思？","hint":"`was` 是 be 动词的过去式，表示“是”。人可以“是”一个感冒吗？","takeaway":"选项 B `was` 会使句子变成“我是一个感冒”，这在逻辑上是错误的。"},{"question":"排除了 A 和 B 之后，请说明为什么 C `had` 是唯一正确的选项。","hint":"从时态和语义两方面总结一下。","takeaway":"选项 C `had` 在时态上与上下文一致，并且 `had a cold` 语义通顺，是唯一正确的选择。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"We will _____ on the Internet.","options":{"A":"look them up","B":"look up them","C":"look them up at","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查“动词+副词”型动词短语的用法。\n1.  短语 `look up` 意为“查阅、查找”。\n2.  这是一个可分动词短语（Separable Phrasal Verb）。\n3.  当这类短语的宾语是**代词**（如 `me`, `it`, `them` 等）时，该代词**必须**放在动词和副词的中间。\n4.  本题中的宾语是代词 `them`，所以必须使用 `look them up` 的结构。\n5.  选项 B `look up them` 将代词放在了短语后面，是错误的。\n6.  选项 C 在末尾多加了一个介词 `at`，导致句子结构错误。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **可分动词短语 (Separable Phrasal Verbs)**\n    *   这类短语由“动词 + 副词”构成，如 `put on`, `take off`, `turn on`, `pick up` 等。\n    *   **宾语是名词**：名词可以放在副词后面，也可以放在动词和副词中间。例如：`Please turn on the light.` = `Please turn the light on.`\n    *   **宾语是代词**：代词**必须**放在动词和副词中间。例如：`Please turn it on.` (不能说 `Please turn on it.`)。\n\n2.  **常见可分动词短语列表**\n    *   `pick up` (捡起): `pick it up`\n    *   `put on` (穿上): `put it on`\n    *   `take off` (脱下): `take it off`\n    *   `turn on/off` (打开/关闭): `turn it on/off`\n    *   `give back` (归还): `give it back`\n    *   `try on` (试穿): `try it on`\n\n3.  **介词 `on` 的用法**\n    *   表示“在...上”时，特指在某个平台或媒介上，常用 `on`。例如：`on the Internet` (在互联网上), `on TV` (在电视上), `on the radio` (在收音机里)。","socratic_tracks":[{"title":"动词短语的结构","steps":[{"question":"“查阅”这个动作，对应的英文短语是什么？","hint":"想一想查字典的“查”。","takeaway":"动词短语 `look up` 表示“查阅”。"},{"question":"这个短语的宾语是 `them`（它们），它是一个代词。你认为 `look them up` 和 `look up them` 哪个是正确的？","hint":"试着回忆或读一下“穿上它”是 `put it on` 还是 `put on it`？","takeaway":"当“动词+副词”短语的宾语是代词时，代词必须放在动词和副词的中间。"}]},{"title":"排除法分析","steps":[{"question":"我们来分析 B 选项 `look up them`。根据我们刚才讨论的规则，它为什么是错的？","hint":"宾语 `them` 是一个代词，它的位置应该在哪里？","takeaway":"选项 B 的错误在于它把代词宾语放在了动词短语的后面。"},{"question":"再看 C 选项 `look them up at`。句子的后面已经有 `on the Internet` 了，如果选 C，句子就变成了 `...look them up at on the Internet`。这样说对吗？","hint":"一个地点通常只需要一个介词来引导。`at` 和 `on` 在这里可以同时使用吗？","takeaway":"选项 C 多了一个不必要的介词 `at`，导致了语法错误。"}]},{"title":"知识点迁移与应用","steps":[{"question":"这个规则同样适用于其他短语。比如“捡起它们”（pick up them），应该怎么说？","hint":"`them` 是代词，需要放在 `pick` 和 `up` 的中间。","takeaway":"正确的说法是 `pick them up`。"},{"question":"那如果是“关掉电视”（turn off the TV）呢？可以说 `turn the TV off` 吗？","hint":"注意，这次的宾语 `the TV` 是一个名词，不是代词。","takeaway":"当宾语是名词时，位置比较灵活，`turn off the TV` 和 `turn the TV off` 都是正确的。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"—What did you do last night?\n—I _____ a film.","options":{"A":"He saw a film.","B":"I see a film.","C":"I saw a film.","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般过去时态的问答。\n1.  问句是 “What did you do last night?”。\n2.  问句中的助动词 `did` 和时间状语 `last night` (昨晚) 表明，这是一个关于过去发生动作的提问。\n3.  因此，回答时也必须使用一般过去时，并且人称要对应。\n4.  选项 A `He saw a film.` 的主语是 `He` (他)，与问句中的 `you` (你) 不匹配。\n5.  选项 B `I see a film.` 的主语 `I` (我) 正确，但动词 `see` 是现在式，时态错误。\n6.  选项 C `I saw a film.` 的主语 `I` 正确，动词 `saw` 是 `see` 的过去式，时态也正确，完全符合问句的要求。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **一般过去时问答结构**\n    *   **特殊疑问句**: `Wh-疑问词 + did + 主语 + 动词原形 ...?`\n        *   例: `What did you eat for breakfast?` (你早餐吃了什么？)\n    *   **回答**: `主语 + 动词过去式 ...`\n        *   例: `I ate some bread.` (我吃了一些面包。)\n    *   注意：回答时不再需要助动词 `did`，但要把动词变为过去式。\n\n2.  **人称一致性**\n    *   在对话中，人称代词需要根据语境做相应转换。最常见的是问句中的 `you` 在答句中变为 `I` (当 `you` 指单数“你”时) 或 `we` (当 `you` 指复数“你们”时)。\n\n3.  **常见不规则动词过去式**\n    *   `see` 的过去式是 `saw`。熟练掌握不规则动词的过去式是学好一般过去时的关键。建议分类记忆，例如：\n        *   `do → did`\n        *   `go → went`\n        *   `have → had`\n        *   `eat → ate`\n        *   `get → got`\n        *   `say → said`","socratic_tracks":[{"title":"时态分析：从问句找线索","steps":[{"question":"看到问句 “What did you do last night?”，是哪个词告诉我们这件事发生在过去？","hint":"注意句子里的助动词和表示时间的词。","takeaway":"问句中的 `did` 和 `last night` 都表明这是一个关于过去动作的提问。"},{"question":"既然问的是过去发生的事，那么回答时，动词应该用什么形式？是现在式 `see` 还是过去式 `saw`？","hint":"问答的时态通常需要保持一致。","takeaway":"回答关于过去的问题，需要使用动词的过去式。"}]},{"title":"人称匹配：谁问谁答","steps":[{"question":"问句 “What did you do...?” 是在问谁？","hint":"注意看句子中的主语代词。","takeaway":"问句的主语是 `you`（你）。"},{"question":"那么，回答这个问题的时候，应该以谁的口吻来回答？是用 `I` (我)，还是 `He` (他)？","hint":"如果别人问你“你做了什么？”，你应该回答“我做了什么”。","takeaway":"问句中的 `you` 在答句中通常对应 `I`。"},{"question":"现在，结合时态和人称这两个要求，再看看三个选项，哪一个是完全正确的？","hint":"哪个选项的主语是 `I` 并且动词是过去式？","takeaway":"只有选项 C `I saw a film.` 同时满足了人称正确和时态正确两个条件。"}]},{"title":"逻辑与语义分析","steps":[{"question":"问句 “What did you do...?” 是在问“做了什么”。那么，选项 B `I see a film` 和选项 C `I saw a film` 在意思上有什么不同？","hint":"想一想一般现在时和一般过去时分别表示什么。一般现在时常表示习惯或真理。","takeaway":"`I see a film` 倾向于表示“我（通常）看电影”这个习惯，而 `I saw a film` 表示“我（在过去某个时间）看了一场电影”。"},{"question":"那么，哪个回答更准确地回应了“你昨晚做了什么”这个问题？","hint":"问题问的是一个发生在过去的具体动作。","takeaway":"只有 `I saw a film` 准确地回答了“昨晚”这个特定过去时间点所做的事情。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"Sandy is ill today. She only eats _____ rice and soup.","options":{"A":"a little","B":"many","C":"a few","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查量词的用法。题干中的名词 `rice` (米饭) 和 `soup` (汤) 都是不可数名词。`a little` 用于修饰不可数名词，表示“一点点”，符合句意。`many` (许多) 和 `a few` (一些) 都用于修饰可数名词复数，因此 B 和 C 选项是错误的。根据句意“桑迪今天病了，她只吃一点米饭和汤”，选择 A 最为恰当。","knowledge_expansion_md":"### 量词辨析：\n\n英语中，修饰名词数量的词语需要根据名词的可数性来选择。\n\n1.  **修饰不可数名词：**\n    *   `a little`: 一点（表肯定）\n    *   `little`: 几乎没有（表否定）\n    *   `much`: 大量，许多（多用于否定句和疑问句）\n\n2.  **修饰可数名词复数：**\n    *   `a few`: 一些（表肯定）\n    *   `few`: 很少，几乎没有（表否定）\n    *   `many`: 许多\n\n3.  **通用（既可修饰不可数名词也可修饰可数名词复数）：**\n    *   `a lot of` / `lots of`: 许多\n    *   `some`: 一些（多用于肯定句）\n    *   `any`: 一些（多用于否定句和疑问句）","socratic_tracks":[{"title":"名词可数性判断","steps":[{"question":"题干中需要被修饰的名词是哪两个？","hint":"请看横线后面的词。","takeaway":"需要修饰的名词是 `rice` (米饭) 和 `soup` (汤)。"},{"question":"`rice` 和 `soup` 是可数名词还是不可数名词？","hint":"你能不能说“一个米饭” (one rice) 或者“两个汤” (two soups)？","takeaway":"`rice` 和 `soup` 都是不可数名词。"}]},{"title":"量词用法辨析","steps":[{"question":"选项 B `many` 和选项 C `a few` 通常用来修饰哪一类名词？","hint":"想想 `many books` 和 `a few apples`。","takeaway":"`many` 和 `a few` 都用来修饰可数名词的复数形式。"},{"question":"既然 `rice` 和 `soup` 是不可数名词，那么 `many` 和 `a few` 还能用吗？","hint":"不可数名词不能用修饰可数名词的量词来修饰。","takeaway":"不能，因此 B 和 C 选项被排除了。"},{"question":"选项 A `a little` 是用来修饰什么名词的？","hint":"它和 `a few` 的用法正好相对。","takeaway":"`a little` 用来修饰不可数名词，表示“一点点”。"}]},{"title":"语境逻辑推断","steps":[{"question":"根据第一句话 'Sandy is ill today'，我们可以推断出 Sandy 的胃口怎么样？","hint":"想一想我们生病的时候，通常是吃得多还是吃得少？","takeaway":"生病的人通常胃口不好，吃得很少。"},{"question":"那么，'only eats _____ rice and soup' 中，横线处填入的词应该表示“多”还是“少”？","hint":"结合上一步的推断。","takeaway":"应该表示“少”或“一点点”。"},{"question":"在 `a little` (一点点), `many` (许多), `a few` (一些) 中，哪个词最符合“生病了只吃一点点”这个语境？","hint":"对比三个选项的含义。","takeaway":"`a little` 最符合语境，表示“只吃一点点”。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"—_____ you _____ a parrot show in the park yesterday?\n—Yes, that's interesting.","options":{"A":"Do; see","B":"Did; look at","C":"Did; watch","D":""},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般过去时的疑问句结构以及动词辨析。\n1.  根据时间状语 `yesterday` (昨天)，可知本句应使用一般过去时。\n2.  一般过去时的特殊疑问句结构为：“疑问词 + did + 主语 + 动词原形...?”。助动词需用 `did`，因此排除选项 A (`Do`)。\n3.  剩下的 B 和 C 选项需要辨析动词。`watch`，`look at` 和 `see` 都有“看”的意思，但用法不同。\n    *   `watch` 指观看动态的、持续一段时间的活动，如看电视(watch TV)、看比赛(watch a game)、看表演(watch a show)。\n    *   `look at` 强调“看”这个动作，指有意识地把目光投向某物。\n    *   `see` 强调“看见”这个结果，常为无意识地看到。\n4.  题干中观看的对象是 `a parrot show` (鹦鹉表演)，是一个持续的活动，因此用 `watch` 最为贴切。","knowledge_expansion_md":"### 动词辨析：see, look at, watch\n\n这三个动词都与“看”有关，但在使用中侧重点不同，是常见的易混淆点。\n\n*   **see**: 强调“看见”的结果，指视觉能力或无意中看到。\n    *   例：`I can't see anything without my glasses.` (不戴眼镜我什么也看不见。)\n    *   例：`I saw your brother in the street yesterday.` (我昨天在街上看到你哥哥了。)\n\n*   **look at**: 强调“看”这个动作，表示有意识地、集中注意力地朝某个方向看。\n    *   例：`Look at the blackboard, please.` (请看黑板。)\n    *   例：`He is looking at a photo.` (他正在看一张照片。)\n\n*   **watch**: 强调观看一个动态的、持续进行的过程，表示欣赏、观察。常用于观看电视、电影、比赛、表演等。\n    *   例：`We watched a football match last night.` (我们昨晚看了一场足球赛。)\n    *   例：`Do you want to watch a movie with me?` (你想和我一起看电影吗？)","socratic_tracks":[{"title":"时态判断与句型结构","steps":[{"question":"句子中哪个词提示我们应该使用过去时态？","hint":"找一找表示时间的词。","takeaway":"时间状语 `yesterday` (昨天) 表明动作发生在过去，应用一般过去时。"},{"question":"一般过去时的疑问句，应该用哪个助动词开头？是 `Do` 还是 `Did`？","hint":"`Do` 的过去式是什么？","takeaway":"一般过去时的疑问句需要使用助动词 `Did`。"},{"question":"使用了助动词 `Did` 之后，后面的主要动词应该用什么形式？","hint":"助动词 `Did` 已经承担了表示过去式的任务。","takeaway":"用了助动词 `Did` 后，主要动词必须使用原形。"}]},{"title":"核心动词辨析","steps":[{"question":"题干中要“看”的对象是什么？","hint":"看句子后半部分 `a parrot show`。","takeaway":"要看的对象是 `a parrot show` (鹦鹉表演)。"},{"question":"对于像“表演(show)”这样持续一段时间、有动态画面的活动，英语中通常用哪个动词来表示“观看”？","hint":"想一想“看电视”和“看电影”是怎么说的。","takeaway":"观看这类活动通常用 `watch`。"},{"question":"为什么不用 `look at`？`look at` 强调的是什么？","hint":"比如老师说“看黑板”，用的是 `look at`。","takeaway":"`look at` 强调的是“把目光投向...”这个动作，而不是持续观看一个过程。"}]},{"title":"固定搭配与习惯用法","steps":[{"question":"在英语中，“看表演”、“看电影”、“看比赛”有没有一些常见的固定搭配？","hint":"回忆一下你学过的关于娱乐活动的词组。","takeaway":"有，常见的搭配是 `watch a show`, `watch a movie`, `watch a game`。"},{"question":"根据这个固定搭配的知识，这道题应该选择哪个动词？","hint":"将 `parrot show` 套入固定搭配中。","takeaway":"根据 `watch a show` 的固定搭配，应该选择动词 `watch`。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"What _____ you _____ next Sunday?","options":{"A":"are; going to do","B":"are; doing","C":"are; going","D":""},"teaching":{"correct_answer":"A","explanation_md":"本题考查将来时的表达方式。根据时间状语 `next Sunday` (下周日)，可知句子是在询问未来的计划，应使用将来时态。`be going to do` 结构是表达将来计划或打算的常用方式。`What are you going to do?` 是一个固定句型，意为“你打算做什么？”。选项 A `are; going to do` 完整地构成了这个句型，语法正确且符合题意。选项 B `are; doing` 构成现在进行时，虽然现在进行时有时可以表示将来，但 `What are you doing?` 通常用来问“你正在做什么？”，用在此处不如 A 精确。选项 C `are; going` 使得句子变为 `What are you going next Sunday?`，语法不完整，因此错误。","knowledge_expansion_md":"### 英语中表达将来时的几种常见方式：\n\n1.  **`be going to + 动词原形`**\n    *   用法：表示事先考虑好的计划、打算或意图。\n    *   例：`I'm going to buy a new phone tomorrow.` (我打算明天买个新手机。)\n    *   用法：表示根据现有迹象做出的推测。\n    *   例：`Look at the dark clouds. It's going to rain.` (看那乌云，天要下雨了。)\n\n2.  **`will + 动词原形`**\n    *   用法：表示临时的决定、提议、请求或承诺。\n    *   例：`The phone is ringing. I'll answer it.` (电话响了，我去接。)\n\n3.  **现在进行时 (`be + doing`)**\n    *   用法：表示已经安排好的、确定要发生的未来活动，通常带有明确的时间或地点。\n    *   例：`I'm flying to Beijing next week.` (我下周要飞往北京。) (表示机票已订好)\n\n在本题中，`What are you going to do?` 是询问对方的一般性计划，而 `What are you doing?` 更倾向于询问已经确定好的具体安排。在没有更多上下文的情况下，`be going to do` 是询问未来“做什么”的最直接、最标准的句式。","socratic_tracks":[{"title":"时态判断与核心结构","steps":[{"question":"句子中的 `next Sunday` 告诉我们这个问句是关于哪个时间的？","hint":"是过去、现在还是将来？","takeaway":"`next Sunday` (下周日) 表明这是一个关于将来的问题。"},{"question":"我们学过的表示“打算做某事”的将来时结构是什么？","hint":"这个结构由 be 动词, going, to 和一个动词原形组成。","takeaway":"表示“打算做某事”的核心结构是 `be going to do`。"},{"question":"将 `be going to do` 结构应用到 `What _____ you _____ ...?` 这个问句中，应该如何填空？","hint":"主语是 `you`，be 动词用哪个？第二个空填什么？","takeaway":"主语是 `you`，be动词用 `are`，后面是 `going to do`，所以填 `are` 和 `going to do`。"}]},{"title":"选项辨析与排除","steps":[{"question":"我们先看选项 C `are; going`。填入后句子是 `What are you going next Sunday?`，这个句子语法正确吗？","hint":"`go` 是不及物动词，后面通常跟地点，比如 `Where are you going?`。用 `What` 来问，句子意思完整吗？","takeaway":"这个句子语法不完整，意思不通，所以 C 是错误的。"},{"question":"再看选项 B `are; doing`。填入后是 `What are you doing next Sunday?`。现在进行时可以表示将来吗？","hint":"想一想，我们可不可以说 `I'm having a party tomorrow.`？","takeaway":"可以，现在进行时可以表示已经安排好的未来计划。"},{"question":"既然 A 和 B 都可以表示将来，为什么 A 是最佳答案？","hint":"对比 `What are you going to do?` 和 `What are you doing?`。前者是问“打算做什么”，后者更像问“安排了什么活动”。哪个更符合一般性提问？","takeaway":"`What are you going to do?` 是询问未来计划最直接、最基础的句式，因此是本题的最佳答案。"}]},{"title":"疑问词与动词搭配","steps":[{"question":"这个问句的疑问词是 `What`，它是在问什么？","hint":"`What` 问的是“什么”。","takeaway":"疑问词 `What` 在这里是用来询问“做什么事”。"},{"question":"为了回答“做什么事”，句子的谓语动词部分需要包含哪个核心动词？","hint":"“做”的英文是什么？","takeaway":"需要包含核心动词 `do` (做)。"},{"question":"在 A, B, C 三个选项中，哪个选项的第二个空包含了动词 `do` 的信息？","hint":"仔细看每个选项的第二个词或词组。","takeaway":"只有选项 A 的 `going to do` 中包含了 `do`，直接对应了 `What` 的提问。"}]}]}}]},{"section_title":"II. 用单词的适当形式填空。(共30分)","section_instruction":"","items":[{"number":"16","item_type":"fill_blank","context_note":"","stem":"—What's the matter?\n—My nose _____ (hurt).","options":{},"teaching":{"correct_answer":"hurts","explanation_md":"本题考查一般现在时中动词的第三人称单数形式。对话 `What's the matter?` (怎么了？) 是在询问当前的情况，因此回答时应使用一般现在时。句子的主语是 `My nose` (我的鼻子)，这是一个单数名词，属于第三人称单数。根据语法规则，在一般现在时中，当主语是第三人称单数时，谓语动词需要进行相应的变化，通常是在动词原形后加 `-s` 或 `-es`。因此，动词 `hurt` (疼) 应变为 `hurts`。","knowledge_expansion_md":"### 一般现在时第三人称单数动词变化规则\n\n当主语是 `he`, `she`, `it` 或任何单个的人或物时，一般现在时的动词需要变化，规则如下：\n\n1.  **一般情况**：在动词词尾加 `-s`。\n    *   `work` → `works`\n    *   `play` → `plays`\n    *   `read` → `reads`\n\n2.  **以 -s, -x, -sh, -ch, -o 结尾的动词**：在词尾加 `-es`。\n    *   `guess` → `guesses`\n    *   `fix` → `fixes`\n    *   `wash` → `washes`\n    *   `watch` → `watches`\n    *   `go` → `goes`\n    *   `do` → `does`\n\n3.  **以“辅音字母 + y”结尾的动词**：变 `y` 为 `i`，再加 `-es`。\n    *   `study` → `studies`\n    *   `cry` → `cries`\n    *   `fly` → `flies`\n\n4.  **特殊情况**：`have` → `has`\n\n**注意**：动词 `hurt` 的过去式和过去分词与原形相同 (`hurt-hurt-hurt`)，但在本题中考查的是一般现在时，需与主语保持一致。","socratic_tracks":[{"title":"判断时态","steps":[{"question":"提问者问 `What's the matter?`，他是在关心现在发生的事，还是过去发生的事？","hint":"注意 `What's` 是 `What is` 的缩写，`is` 是现在时。","takeaway":"这是在询问当前的情况，所以应该使用一般现在时。"},{"question":"描述一个当前持续的状态或感觉，比如“我饿了”或“我头疼”，通常用什么时态？","hint":"比如 `I am hungry.` 或者 `My head aches.`","takeaway":"描述当前的状态或感觉，通常使用一般现在时。"}]},{"title":"确定主语人称和数","steps":[{"question":"回答句 `My nose _____ (hurt).` 的主语是什么？","hint":"谁或什么在 `hurt`？","takeaway":"主语是 `My nose` (我的鼻子)。"},{"question":"`My nose` 是单数还是复数？","hint":"一个人有几个鼻子？","takeaway":"`My nose` 是单数。"},{"question":"在英语语法中，`My nose` 属于第几人称？可以用 `he`, `she`, `it` 中的哪个代词来指代？","hint":"它不是“你”也不是“我”，而且是物体。","takeaway":"`My nose` 属于第三人称单数，可以用 `it` 来指代。"}]},{"title":"应用主谓一致规则","steps":[{"question":"在一般现在时中，如果主语是第三人称单数，动词需要发生什么变化？","hint":"回想一下 `He play football.` 这个句子对吗？","takeaway":"当主语是第三人称单数时，动词词尾通常需要加 `-s` 或 `-es`。"},{"question":"那么，根据这个规则，动词 `hurt` 应该变成什么形式？","hint":"`hurt` 属于一般情况，直接在词尾加 `-s`。","takeaway":"动词 `hurt` 应该变为 `hurts`。"}]}]},"answer_area_hint":"横线"},{"number":"17","item_type":"fill_blank","context_note":"","stem":"We shouldn't _____ (cut) down the trees.","options":{},"teaching":{"correct_answer":"cut","explanation_md":"本题考查情态动词的用法。\n句子中出现了情态动词 \"shouldn't\"（不应该），它表达了一种建议或责任。\n根据语法规则，情态动词（如 can, must, should, will 等）后面必须跟动词的原形（infinitive form）。\n因此，括号中的动词 \"cut\" 保持其原形不变。","knowledge_expansion_md":"**情态动词 + 动词原形** 是一个基础且重要的语法结构。\n1.  **常见情态动词**：can (could), may (might), must, should, will (would)。这些词本身没有人称和数的变化。\n2.  **结构**：无论主语是第几人称，单数还是复数，情态动词的形式不变，其后的动词也必须是原形。例如：`He can swim.` (正确) vs. `He can swims.` (错误)。\n3.  **否定与疑问**：否定形式通常是 `情态动词 + not`（可缩写，如 shouldn't, can't）；一般疑问句将情态动词提到句首。\n4.  **易错点**：切忌在情态动词后使用动词的第三人称单数形式、过去式或带 `to` 的不定式。","socratic_tracks":[{"title":"情态动词用法","steps":[{"question":"句子中的 'shouldn't' 是什么类型的词？它在句中起什么作用？","hint":"它和 'can', 'must' 属于同一类词，用来表达建议、能力、必要性等。","takeaway":"shouldn't 是情态动词，用来表达“不应该”的建议。"},{"question":"情态动词后面跟的动词应该是什么形式？想一想 'I can swim.' 这个例子。","hint":"在 'I can swim' 中，'swim' 是原形、过去式还是现在分词？","takeaway":"情态动词后面必须跟动词原形。"}]},{"title":"动词形式辨析","steps":[{"question":"动词 'cut' 有哪些主要形式？（例如，过去式，现在分词）","hint":"这是一个不规则动词，它的原形、过去式和过去分词形式相同。","takeaway":"动词 'cut' 的原形、过去式和过去分词都是 'cut'，现在分词是 'cutting'。"},{"question":"这个句子表达的是一个建议，不涉及特定的时态变化。在这种情况下，我们应该选择动词的哪种形式放在 'shouldn't' 后面？","hint":"表达建议或能力时，我们通常使用动词最基本、最原始的形式。","takeaway":"在情态动词后，我们总是使用动词的原形来构成谓语。"}]},{"title":"句子结构分析","steps":[{"question":"这个句子的主语是谁？谓语动词由哪几个部分组成？","hint":"谓语是说明主语动作或状态的部分。","takeaway":"句子的主语是 'We'，谓语由情态动词 'shouldn't' 和主要动词 'cut' 共同组成。"},{"question":"如果把句子改成肯定句 'We should _____ (cut) down the trees'，括号里的词会变吗？为什么？","hint":"肯定句和否定句会影响情态动词后的动词形式吗？","takeaway":"无论是肯定句、否定句还是一般疑问句，情态动词后的主要动词都保持原形不变。"}]}]},"answer_area_hint":"横线"},{"number":"18","item_type":"fill_blank","context_note":"","stem":"The canteen is on the _____ (two) floor.","options":{},"teaching":{"correct_answer":"second","explanation_md":"本题考查基数词与序数词的转换。\n句子意为“食堂在二楼”，表示楼层、日期、名次等顺序时，需要使用序数词（Ordinal Numbers）。\n括号中给出的 \"two\" 是表示数量的基数词（Cardinal Number）。\n基数词 \"two\" 对应的序数词是 \"second\"。\n此外，序数词前通常要加定冠词 \"the\"，题干中已有 \"the\"，所以只需填入 \"second\"。","knowledge_expansion_md":"**基数词与序数词的用法区别**\n1.  **基数词 (Cardinal Numbers)**：表示数量，回答 `How many...?` 的问题。如：one, two, three。\n2.  **序数词 (Ordinal Numbers)**：表示顺序，回答 `Which one...?` 的问题。如：first, second, third。\n\n**序数词构成规则**\n*   **一、二、三特殊记**：first (1st), second (2nd), third (3rd)。\n*   **大多数加-th**：four -> fourth, eleven -> eleventh。\n*   **-ve结尾变-fth**：five -> fifth, twelve -> twelfth。\n*   **-y结尾变-ieth**：twenty -> twentieth, thirty -> thirtieth。\n*   **组合数词**：只将末位变成序数词。如：twenty-one -> twenty-first。\n\n**常见用法**：`the + 序数词 + 名词`，用来特指某一个。例如：`the first lesson` (第一课), `my second book` (我的第二本书)。","socratic_tracks":[{"title":"词类辨析：基数词与序数词","steps":[{"question":"当我们说“一、二、三”和“第一、第二、第三”时，这两组词在意思上有什么不同？","hint":"一个表示有多少个，一个表示排在第几个。","takeaway":"“一、二、三”是基数词，表示数量；“第一、第二、第三”是序数词，表示顺序。"},{"question":"那么，当我们要说“在第几层楼”时，应该用基数词还是序数词？","hint":"楼层是有先后顺序的。","takeaway":"表示楼层、日期、名次等顺序时，必须使用序数词。"},{"question":"数字 'two' 对应的序数词是什么？","hint":"一、二、三的序数词是特殊的，需要单独记忆。","takeaway":"Two 对应的序数词是 second。"}]},{"title":"语境应用","steps":[{"question":"请读一下这个句子 'The canteen is on the _____ floor'。你觉得这里是想说食堂在‘两个楼层’还是‘第二层楼’？","hint":"一个食堂通常只在一个楼层。","takeaway":"根据句意，这里是想表达食堂在“第二层楼”。"},{"question":"除了楼层，你还能想到哪些需要用序数词的场合吗？","hint":"想想看日期怎么说，或者比赛得了第几名怎么说。","takeaway":"在表达日期（如 May 1st）、比赛名次（the first place）等场景中，都需要使用序数词。"}]},{"title":"冠词与序数词","steps":[{"question":"观察空格前面的单词 'the'。它是什么词？通常用在什么地方？","hint":"a/an/the 都属于一类词。","takeaway":"'the' 是定冠词，通常用在特指的人或事物前面。"},{"question":"为什么在序数词前面常常要加 'the'？","hint":"“第二层楼”是不是特指某一个特定的楼层？","takeaway":"因为序数词通常用来指定独一无二的顺序位置，所以前面常与定冠词 'the' 连用，表示特指。"}]}]},"answer_area_hint":"横线"},{"number":"19","item_type":"fill_blank","context_note":"","stem":"People couldn't _____ (use) the computer in the Tang Dynasty.","options":{},"teaching":{"correct_answer":"use","explanation_md":"本题再次考查情态动词的用法。\n句子中出现了情态动词 \"couldn't\"（不能），它是 \"can't\" 的过去式，用来表示过去没有某种能力或条件。\n尽管 \"couldn't\" 表示过去时，但它本身仍然是一个情态动词。\n所有情态动词，无论其时态形式如何，后面都必须跟动词原形。\n因此，括号中的动词 \"use\" 应当保持原形不变。","knowledge_expansion_md":"**情态动词的过去式形式**\n1.  一些情态动词有对应的过去式形式，如 `can -> could`, `will -> would`, `may -> might`。\n2.  这些过去式形式本身也遵循 **“情态动词 + 动词原形”** 的核心规则。时态的变化体现在情态动词上，而不是其后的主动词上。\n3.  **`could` 的用法**：\n    *   表示过去的能力：`I could swim when I was five.` (我五岁时会游泳。)\n    *   表示委婉的请求或许可：`Could you help me?` (你能帮我一下吗？)\n    *   表示较小的可能性：`It could rain.` (可能会下雨。)\n4.  **本题语境**：`in the Tang Dynasty` (在唐朝) 是明确的过去时间状语，因此使用 `couldn't` 表示过去的能力限制，其后跟动词原形 `use`。","socratic_tracks":[{"title":"情态动词规则","steps":[{"question":"句子中的 'couldn't' 是什么词？它和 'can't' 有什么关系？","hint":"从拼写和意思上想一想，'could' 和 'can' 的关系。","takeaway":"'couldn't' 是情态动词，是 'can't' 的过去式，表示“过去不能”。"},{"question":"既然 'couldn't' 也是情态动词，那么它后面的动词应该是什么形式？","hint":"这个规则和 'shouldn't', 'can't' 后面跟的动词形式规则一样吗？","takeaway":"所有情态动词（包括其过去式）后面都必须跟动词原形。"}]},{"title":"时态与动词形式","steps":[{"question":"句子末尾的 'in the Tang Dynasty' 告诉我们这是关于哪个时间的事情？","hint":"唐朝是中国的古代朝代。","takeaway":"这是一个明确的过去时间状语，表示动作发生在过去。"},{"question":"既然是过去发生的事，为什么动词 'use' 不用过去式 'used' 呢？","hint":"观察 'use' 前面的 'couldn't'，这个词是否已经表达了时态？","takeaway":"当句中有情态动词的过去式（如 could）时，时态已经由情态动词体现，其后的主动词无需再变，保持原形即可。"}]},{"title":"句子功能分析","steps":[{"question":"这句话想表达什么意思？是说唐朝人‘不使用’电脑，还是‘不能/没条件使用’电脑？","hint":"想一想唐朝的科技水平。","takeaway":"这句话表达的是唐朝人“没有能力或条件使用”电脑。"},{"question":"在句子中，是哪个词表达了“能力”这个概念？","hint":"哪个词和 'can' (能够) 有关？","takeaway":"情态动词 'couldn't' 表达了“过去没有能力”的含义，而其后的动词 'use' 仅表示核心动作。"}]}]},"answer_area_hint":"横线"},{"number":"20","item_type":"fill_blank","context_note":"","stem":"Tom's father is a fisherman. He _____ (work) at sea.","options":{},"teaching":{"correct_answer":"works","explanation_md":"本题考查一般现在时中主谓一致的用法。\n第一句话 \"Tom's father is a fisherman\" 介绍了汤姆父亲的职业，这是一个客观事实。\n第二句话描述的是他作为渔夫的日常工作，属于经常性、习惯性的动作。\n对于经常性、习惯性的动作，我们应使用一般现在时。\n第二句话的主语是 \"He\" (指代 Tom's father)，是第三人称单数。\n根据主谓一致原则，在一般现在时中，当主语是第三人称单数时，谓语动词词尾需要加 \"-s\" 或 \"-es\"。\n因此，动词 \"work\" 应变为 \"works\"。","knowledge_expansion_md":"**一般现在时 (Simple Present Tense) 的主谓一致**\n这是初中英语最核心的语法点之一，也是易错点。\n1.  **适用时机**：表示客观真理、事实、人的职业、性格、能力以及经常性或习惯性的动作。\n2.  **核心规则**：当主语是第三人称单数（he, she, it, 单个人名如 Tom, 单个事物如 the book）时，谓语动词要进行相应变化。\n3.  **动词变化规则**：\n    *   **一般情况**：直接加 -s (e.g., work -> works, like -> likes)。\n    *   **以 s, x, ch, sh, o 结尾**：加 -es (e.g., watch -> watches, go -> goes)。\n    *   **以“辅音字母+y”结尾**：变 y 为 i 再加 -es (e.g., study -> studies)。\n    *   **特殊**：have -> has。\n4.  **注意**：当主语是第一人称 (I, we)、第二人称 (you) 或第三人称复数 (they, Tom and Jerry) 时，动词用原形。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"第一句话说汤姆的爸爸是渔夫。那么第二句话“他在海上工作”描述的是一次性的动作，还是他日常的、习惯性的工作？","hint":"渔夫的工作地点通常在哪里？","takeaway":"这句话描述的是他作为渔夫的常规工作状态。"},{"question":"描述一个人的职业或习惯性的动作，我们应该用什么时态？","hint":"是现在进行时、一般过去时，还是一般现在时？","takeaway":"描述习惯性动作或当前事实，应使用一般现在时。"}]},{"title":"主谓一致原则","steps":[{"question":"第二句话的主语是谁？它在人称和数量上有什么特点？","hint":"主语是 'He'，它指代 'Tom's father'。","takeaway":"主语是 'He'，属于第三人称单数。"},{"question":"在一般现在时中，当主语是第三人称单数时，后面的谓语动词需要做什么样的变化？","hint":"回想一下 'I play' 和 'He plays' 的区别。","takeaway":"当主语是第三人称单数时，谓语动词词尾通常需要加 -s 或 -es。"}]},{"title":"动词变化规则","steps":[{"question":"我们已经确定动词 'work' 需要进行第三人称单数的变化。那么具体应该怎么变？是加 -s 还是 -es？","hint":"动词 'work' 的词尾是什么字母？","takeaway":"动词 'work' 的词尾是 'k'，不属于特殊情况，所以直接加 -s。"},{"question":"你能举一个需要加 -es 的动词例子吗？","hint":"想一想以 o, s, x, ch, sh 结尾的动词。","takeaway":"以 o, s, x, ch, sh 结尾的动词需要加 -es，例如 'go' 变为 'goes'，'watch' 变为 'watches'。"}]}]},"answer_area_hint":"横线"},{"number":"21","item_type":"fill_blank","context_note":"","stem":"—Whose ruler is this?\n—It's _____ (I).","options":{},"teaching":{"correct_answer":"mine","explanation_md":"本题考查名词性物主代词的用法。问句 “Whose ruler is this?”（这是谁的尺子？）是在询问物品的归属。回答 “It's _____.” 中，空格位于句末，前面是系动词 “is”，且后面没有跟名词，因此需要一个可以独立使用的、表示所属关系的词。括号中给出的 “I” 是主格人称代词，其对应的名词性物主代词是 “mine”，相当于 “my ruler”。因此，填入 “mine” 表示“这是我的（尺子）”。","knowledge_expansion_md":"### 人称代词与物主代词辨析\n\n在英语中，表示“我的”有两个词：`my` 和 `mine`。它们的用法有严格区别：\n\n1.  **形容词性物主代词 (Possessive Adjectives)**：如 `my`, `your`, `his`, `her`, `its`, `our`, `their`。它们具有形容词的特性，必须放在名词前作定语，用来修饰名词。例如：\n    *   This is **my** book. (这是我的书。)\n    *   Is that **your** bag? (那是你的包吗？)\n\n2.  **名词性物主代词 (Nominal Possessive Pronouns)**：如 `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。它们具有名词的特性，可以独立在句子中作主语、宾语或表语，其本身就等于“形容词性物主代词 + 名词”。例如：\n    *   This book is **mine**. (= my book)\n    *   Your bag is new, but **mine** is old. (= my bag)\n\n**易错点**：学生常常混淆 `my` 和 `mine`。切记一个简单的规则：“名词前用 `my`，无名词用 `mine`”。例如，回答 “Whose pen is this?”，可以说 “It's my pen.” 或者 “It's mine.”，但绝不能说 “It's my.”。","socratic_tracks":[{"title":"物主代词的种类","steps":[{"question":"问句 “Whose...?” 是在问什么？回答时需要表达什么信息？","hint":"比如有人问 “Whose book is this?”，你应该告诉他这本书是谁的。","takeaway":"回答 “Whose” 的问句需要表明物品的归属关系。"},{"question":"表示“我的”，我们学过哪两个词？它们有什么不同？","hint":"一个词后面必须跟上东西，比如“我的书”；另一个词可以单独说，就代表“我的东西”。","takeaway":"表示“我的”有 `my` 和 `mine`，`my` 是形容词性的，后面要加名词；`mine` 是名词性的，可以单独使用。"},{"question":"在这道题 “It's _____.” 的空格后面，有名词吗？那我们应该选哪个词？","hint":"空格后面是句号，没有跟任何名词。","takeaway":"因为空格后没有名词，所以要用名词性物主代词 `mine`。"}]},{"title":"代词的格","steps":[{"question":"括号里给的词是 “I”，它在句子中通常做什么成分？","hint":"想想 “I am a student.” 这句话里 “I” 的位置和作用。","takeaway":"“I” 是主格人称代词，通常在句子中作主语。"},{"question":"从 “I” 可以变出哪些表示“我”的相关的词？它们分别用在什么地方？","hint":"比如“他爱我 (love me)”、“我的名字 (my name)”、“这本书是我的 (is mine)”。","takeaway":"和“我”相关的代词有主格 `I`（作主语）、宾格 `me`（作宾语）、形容词性物主代词 `my`（修饰名词）和名词性物主代词 `mine`（单独使用）。"},{"question":"根据 “It's _____.” 这个句型，我们需要一个能单独作表语、又能表示“我的东西”的词，应该是哪个？","hint":"试试把 `I`, `me`, `my`, `mine` 都放进去读一下，哪个意思和语法都正确？","takeaway":"只有名词性物主代词 `mine` 既能表示所属关系，又能独立作表语。"}]},{"title":"句子成分分析","steps":[{"question":"在 “It's _____.” 这个回答中，主语是 “It”，动词是 “is”，那么空格处需要填的词是什么句子成分？","hint":"系动词（如 am, is, are）后面的成分叫什么？","takeaway":"在系动词 “is” 后面，需要一个表语来补充说明主语的情况。"},{"question":"我们学过哪些词性的词可以作表语？","hint":"比如 “I am happy.” (形容词)，“He is a doctor.” (名词)。","takeaway":"名词、形容词、代词等都可以作表语。"},{"question":"本题需要一个代词作表语，并且要表达“我的（尺子）”的含义，应该用哪个词？","hint":"这个代词本身要包含“我的”和“尺子”两层意思。","takeaway":"名词性物主代词 `mine` 相当于 `my ruler`，可以独立作表语，完全符合题目要求。"}]}]},"answer_area_hint":"横线"},{"number":"22","item_type":"fill_blank","context_note":"","stem":"Liu Tao goes to bed late and he feels so _____ (sleep) in the morning.","options":{},"teaching":{"correct_answer":"sleepy","explanation_md":"本题考查词性转换。句子中 “feels” 是一个系动词，意为“感觉”。系动词后面通常跟形容词作表语，用来说明主语的状态。括号中给出的 “sleep” 是一个动词或名词，意为“睡觉”或“睡眠”。我们需要将其转换为形容词形式来描述主语 “he” 的感觉。表示“困倦的，想睡觉的”的形容词是 “sleepy”。“so” 是副词，用来加强语气，修饰形容词 “sleepy”，表示“非常困”。","knowledge_expansion_md":"### 系动词与形容词的搭配\n\n在英语中，有一类动词叫做**系动词 (Linking Verbs)**。它们本身没有太多实际意义，主要功能是连接主语和表语，说明主语的状态、特征或身份。系动词后面最常跟的是**形容词**。\n\n常见的系动词包括：\n1.  **be 动词**：am, is, are, was, were\n2.  **感官动词**：`look` (看起来), `sound` (听起来), `feel` (感觉), `smell` (闻起来), `taste` (尝起来)\n3.  **状态变化动词**：`become` (变成), `get` (变得), `turn` (变成), `grow` (变得)\n4.  **保持状态动词**：`keep` (保持), `stay` (保持)\n5.  **表象动词**：`seem` (似乎), `appear` (显得)\n\n**词性转换：-y 后缀**\n很多名词或动词可以通过加上后缀 `-y` 变成形容词，表示“具有...特征的”或“多...的”。\n*   `sleep` (n./v. 睡眠/睡觉) → `sleepy` (adj. 困倦的)\n*   `sun` (n. 太阳) → `sunny` (adj. 晴朗的)\n*   `rain` (n. 雨) → `rainy` (adj.多雨的)\n*   `luck` (n. 运气) → `lucky` (adj. 幸运的)\n\n**易错点**：学生有时会误用副词。例如，错误地说 “He feels happily.”。正确的应该是 “He feels happy.”，因为 `feel` 在此作系动词，描述主语的状态。","socratic_tracks":[{"title":"系动词的用法","steps":[{"question":"句子中的动词 “feels” 是什么意思？它后面应该跟什么类型的词？","hint":"“feel” 在这里是“感觉...”，是用来描述主语的状态的。想想 “I feel happy.” 里的 “happy” 是什么词性？","takeaway":"“feel” 在此是系动词，后面需要跟形容词作表语，说明主语的感觉。"},{"question":"括号里给的词 “sleep” 是什么词性？","hint":"我们可以说 “go to sleep” 或者 “I sleep 8 hours a day.”","takeaway":"“sleep” 既可以是名词（睡眠），也可以是动词（睡觉）。"},{"question":"我们需要把 “sleep” 变成一个形容词，来表示“想睡觉的”这种感觉。这个形容词是什么？","hint":"在一些名词后面加 -y 可以变成形容词，比如 `rain` -> `rainy`。","takeaway":"“sleep” 对应的形容词是 “sleepy”，意思是“困倦的”。"}]},{"title":"词性转换规则","steps":[{"question":"这个句子 “he feels so _____” 的空格处需要填一个什么词性的词？","hint":"“so” 是副词，意为“如此地”，它通常用来修饰什么词？比如 “so beautiful”。","takeaway":"这个结构需要一个形容词，来描述主语 “he” 的感觉。"},{"question":"我们如何从名词或动词 “sleep” 得到一个形容词？","hint":"思考一下“晴天” (sunny day) 和“雨天” (rainy day) 的英文，`sun` 和 `rain` 是如何变成形容词的？","takeaway":"一个常见的构词法是在名词或动词后加 `-y` 构成形容词。"},{"question":"所以，将这个规则应用到 “sleep” 上，我们得到的形容词是什么？","hint":"Sleep + y = ?","takeaway":"通过在 “sleep” 后加上后缀 “-y”，我们得到形容词 “sleepy”。"}]},{"title":"根据语境推断词义","steps":[{"question":"句子的前半部分 “Liu Tao goes to bed late” 告诉了我们什么信息？","hint":"一个人睡得很晚。","takeaway":"前半句是原因：刘涛睡得很晚。"},{"question":"根据这个原因，你觉得他第二天早上会有什么感觉？","hint":"如果你晚上不睡觉，第二天上课会怎么样？","takeaway":"可以推断出，他早上会感觉很困、想睡觉。"},{"question":"在英语中，哪个形容词可以准确地描述“困倦的、想睡觉的”这种感觉？","hint":"这个词和“睡觉 (sleep)”长得很像。","takeaway":"表示“困倦的”的形容词正是 `sleepy`。"}]}]},"answer_area_hint":"横线"},{"number":"23","item_type":"fill_blank","context_note":"","stem":"Bobby is shouting _____ (excited).","options":{},"teaching":{"correct_answer":"excitedly","explanation_md":"本题考查副词的用法。在句子 “Bobby is shouting _____” 中，空格处的词是用来修饰动词 “shouting”（喊叫）的，说明喊叫的方式是怎样的。修饰动词需要用副词。括号中给出的 “excited” 是一个形容词，意为“兴奋的”，通常用来描述人或物的情绪状态。我们需要将其转换为副词形式。形容词变副词的常规方法是加后缀 “-ly”。因此，“excited” 变为 “excitedly”，意为“兴奋地”。","knowledge_expansion_md":"### 形容词与副词的转换与使用\n\n**1. 功能区分**：\n*   **形容词 (Adjective)**：修饰名词或代词，说明其性质、状态或特征。通常回答 “What kind of...?” 的问题。例如：He is a **brave** boy. (brave 修饰 boy)\n*   **副词 (Adverb)**：修饰动词、形容词、其他副词或整个句子，说明动作的方式、时间、地点、程度等。通常回答 “How?”, “When?”, “Where?” 等问题。例如：He fought **bravely**. (bravely 修饰 fought)\n\n**2. 构词法**：\n大多数副词由“形容词 + -ly”构成。\n*   `quick` → `quickly`\n*   `beautiful` → `beautifully`\n*   `excited` → `excitedly`\n\n**特殊情况**：\n*   以 `-y` 结尾的形容词，变 `y` 为 `i` 再加 `-ly`：`happy` → `happily`\n*   以 `-le` 结尾的形容词，去 `e` 加 `y`：`terrible` → `terribly`\n*   形容词和副词同形：`fast`, `hard`, `late`, `early` 等。\n\n**易错点**：`excited` vs `exciting`\n*   `excited` (兴奋的)：-ed 结尾的形容词通常用于描述人的感受。例：I am **excited**. (我感到兴奋。)\n*   `exciting` (令人兴奋的)：-ing 结尾的形容词通常用于描述事物或情况的性质。例：The game is **exciting**. (比赛很精彩。)\n本题中，即使是形容词，也应用 `excited`，但因为要修饰动词，所以用其副词形式 `excitedly`。","socratic_tracks":[{"title":"副词的功能","steps":[{"question":"观察句子 “Bobby is shouting _____”，空格里的词是用来描述什么的？","hint":"这个词是描述 Bobby 这个人，还是描述他 “shouting” 这个动作？","takeaway":"空格里的词是用来描述 “shouting” 这个动作的方式的。"},{"question":"在英语中，我们用什么词性的词来描述一个动作是“怎样”进行的？","hint":"比如，“慢慢地走” (walk slowly)，”大声地读“ (read loudly)。","takeaway":"修饰动词、说明动作方式的词是副词。"},{"question":"括号里给的 “excited” 是形容词，如何把它变成一个副词？","hint":"大多数形容词变副词，词尾会加上什么？","takeaway":"形容词 “excited” 加上后缀 “-ly” 就可以变成副词 “excitedly”。"}]},{"title":"词性与句子成分","steps":[{"question":"“excited” 这个词是什么词性？它通常用来做什么？","hint":"我们可以说 “an excited boy” (一个兴奋的男孩) 或者 “He is excited.” (他很兴奋)。","takeaway":"“excited” 是形容词，用来修饰名词或作表语，描述人或动物的情绪。"},{"question":"如果直接把 “excited” 填入空格，变成 “Bobby is shouting excited.”，这个句子在语法上正确吗？","hint":"形容词能直接跟在动词后面，修饰这个动词吗？","takeaway":"语法上不正确，因为形容词不能直接修饰动词。"},{"question":"那么，我们必须对 “excited” 做怎样的变形，才能让它正确地修饰动词 “shouting”？","hint":"我们需要一个表示“兴奋地”的词。","takeaway":"我们需要将形容词 “excited” 变为其对应的副词形式 “excitedly”。"}]},{"title":"区分 -ed 和 -ing","steps":[{"question":"我们学过 `excited` 和 `exciting`，它们有什么区别？","hint":"一个用来形容人的感受，一个用来形容事物本身。","takeaway":"`excited` 形容人感到兴奋，`exciting` 形容事物令人兴奋。"},{"question":"在这道题里，是 Bobby 感到兴奋，所以他大叫。那么描述他状态的词应该是 `excited` 还是 `exciting`？","hint":"是 Bobby 自己感到兴奋。","takeaway":"描述 Bobby 的感受，应该用 `excited`。"},{"question":"既然我们确定了是 `excited`，但又需要一个副词来修饰动作 `shouting`，那最终答案是什么？","hint":"如何从形容词 `excited` 得到一个副词？","takeaway":"将形容词 `excited` 加上 `-ly` 后缀，得到副词 `excitedly`。"}]}]},"answer_area_hint":"横线"},{"number":"24","item_type":"fill_blank","context_note":"","stem":"He usually _____ (eat) carrots.","options":{},"teaching":{"correct_answer":"eats","explanation_md":"本题考查一般现在时中第三人称单数动词的变化。句子中的时间状语 “usually”（通常）是标志词，表明这是一个经常性、习惯性的动作，因此应使用一般现在时。本句的主语是 “He”（他），属于第三人称单数。在一般现在时中，当主语是第三人称单数（如 he, she, it, a name）时，谓语动词需要进行相应的变化，通常是在动词原形后加 “-s” 或 “-es”。动词 “eat” 的第三人称单数形式是在词尾加 “-s”，变为 “eats”。","knowledge_expansion_md":"### 一般现在时与主谓一致\n\n**1. 一般现在时的用法**：\n*   表示经常性、习惯性的动作或状态。常与 `always`, `usually`, `often`, `sometimes`, `never`, `every day` 等频率副词或时间状语连用。\n*   表示客观真理、科学事实。例如：The earth **moves** around the sun.\n*   表示格言、警句。例如：Practice **makes** perfect.\n\n**2. 第三人称单数动词变化规则**：\n当主语是第三人称单数（he, she, it, a single person/thing）时，一般现在时的动词需要变化：\n*   **一般情况**：在动词原形后加 `-s`。\n    *   `work` → `works`\n    *   `eat` → `eats`\n    *   `play` → `plays`\n*   **以 -s, -x, -ch, -sh, -o 结尾**：在动词原形后加 `-es`。\n    *   `guess` → `guesses`\n    *   `fix` → `fixes`\n    *   `watch` → `watches`\n    *   `wash` → `washes`\n    *   `go` → `goes`, `do` → `does`\n*   **以“辅音字母 + y”结尾**：变 `y` 为 `i` 再加 `-es`。\n    *   `study` → `studies`\n    *   `cry` → `cries`\n*   **不规则变化**：`have` → `has`\n\n**易错点**：初学者最常见的错误之一，就是当主语是第三人称单数时，忘记给动词加 `-s` 或 `-es`。这是语法学习中需要反复练习和巩固的基础。","socratic_tracks":[{"title":"判断时态","steps":[{"question":"在填动词形式之前，我们首先要确定这个句子应该用什么时态。你能在句子里找到提示吗？","hint":"找一找表示时间或频率的词。","takeaway":"句子中的 “usually”（通常）是一个频率副词，是使用一般现在时的标志。"},{"question":"一般现在时是用来描述什么的？","hint":"“usually” 的意思是“通常”，这暗示了动作的什么特点？","takeaway":"一般现在时主要用来描述经常性、习惯性的动作或存在的状态。"}]},{"title":"主谓一致原则","steps":[{"question":"确定了用一般现在时后，动词的形式由什么决定？","hint":"看看动词前面的那个词，也就是做动作的人或物。","takeaway":"动词的形式必须和主语的人称和单复数保持一致，这就是主谓一致。"},{"question":"这个句子的主语是谁？它是第几人称？是单数还是复数？","hint":"主语是 “He”。想一想 “He” 是“我”？“你”？还是“他”？是一个人还是多个人？","takeaway":"主语 “He” 是第三人称单数。"},{"question":"当主语是第三人称单数时，一般现在时的动词需要做什么变化？","hint":"我们常说“三单加s”，还记得吗？","takeaway":"当主语是第三人称单数时，动词原形词尾通常要加 -s 或 -es。"},{"question":"所以，这道题的动词 “eat” 应该变成什么形式？","hint":"在 eat 后面加上 s。","takeaway":"动词 “eat” 应该变为 “eats”。"}]},{"title":"动词三单变化规则","steps":[{"question":"是不是所有动词在主语是第三人称单数时，都在后面加 -s 就可以了？","hint":"想想动词 go 和 watch，它们的变化是 goes 和 watches。","takeaway":"不是的，大部分动词加 -s，但有一些特殊情况需要加 -es 或进行其他变化。"},{"question":"你能举例说说哪些情况下动词要加 -es 吗？","hint":"观察一下 `watch`, `wash`, `guess`, `go` 这些词的词尾有什么共同点？","takeaway":"以 -s, -x, -ch, -sh, -o 结尾的动词，需要加 -es。"},{"question":"那动词 “eat” 属于哪种情况？","hint":"“eat” 的词尾是 “t”，不属于任何特殊情况。","takeaway":"“eat” 属于一般情况，直接在词尾加 -s 即可。"}]}]},"answer_area_hint":"横线"},{"number":"25","item_type":"fill_blank","context_note":"","stem":"Nancy likes cooking some _____ (tomato) soup.","options":{},"teaching":{"correct_answer":"tomato","explanation_md":"本题考查名词作定语的用法。空格处需要一个词来修饰名词“soup”（汤），说明是什么汤。\"tomato soup\"（西红柿汤）是一个固定的复合名词，其中第一个名词“tomato”作用类似于形容词，修饰第二个名词“soup”。当名词作定语时，通常使用其单数形式，即使它所代表的实际意义是复数。因此，此处应填“tomato”。","knowledge_expansion_md":"### 名词作定语\n\n在英语中，一个名词可以放在另一个名词前，起修饰作用，这被称为名词作定语。其功能类似于形容词。\n\n**核心规则：**\n用作定语的名词通常要用**单数形式**，即使其有复数意义。这是一种语法习惯。\n\n**常见例子：**\n*   `vegetable soup` (蔬菜汤)，而不是 `vegetables soup`。\n*   `apple tree` (苹果树)，而不是 `apples tree`。\n*   `shoe store` (鞋店)，而不是 `shoes store`。\n*   `a two-hour meeting` (一个两小时的会议)，`hour` 用单数。\n\n**易错点：**\n学生可能会因为制作西红柿汤需要不止一个西红柿，而误用复数形式 `tomatoes`。需要牢记“名词作定语用单数”的规则。","socratic_tracks":[{"title":"名词作定语","steps":[{"question":"在短语 `_____ soup` 中，空格里的词起什么作用？","hint":"它是用来描述 `soup` 的种类、颜色还是数量？","takeaway":"空格里的词是用来修饰名词 `soup`，说明汤的种类，作定语。"},{"question":"当一个名词（如 `tomato`）用来修饰另一个名词（如 `soup`）时，我们通常用它的单数形式还是复数形式？","hint":"想一想我们说“苹果树”是 `apple tree` 还是 `apples tree`？","takeaway":"名词作定语时，通常使用其单数形式。"}]},{"title":"复合名词","steps":[{"question":"像 `tomato soup` 这样，由两个名词组合在一起构成的新词组叫什么？","hint":"例如 `toothbrush` (牙刷) 是由 `tooth` 和 `brush` 组成的。","takeaway":"这种“名词+名词”的结构叫做复合名词。"},{"question":"做西红柿汤通常需要很多西红柿，那为什么在 `tomato soup` 这个复合名词里，`tomato` 却用单数呢？","hint":"这是复合名词的一条构成规则，第一个名词的形式有什么特点？","takeaway":"在“名词+名词”构成的复合名词中，第一个名词通常保持单数形式，即使其逻辑意义是复数。"}]},{"title":"词形辨析","steps":[{"question":"括号里给的词是 `tomato`，它的复数形式是什么？","hint":"以辅音字母+o结尾的名词，变复数时通常加 `-es`。","takeaway":"`tomato` 的复数是 `tomatoes`。"},{"question":"这句话是说“一些西红柿”和“汤”是两样东西，还是在说“一种汤”？","hint":"句子的核心是 `some soup` (一些汤)，`tomato` 只是说明汤的种类。","takeaway":"句子的核心是描述一种汤，即西红柿汤。"},{"question":"既然是说明汤的种类，我们应该用 `tomato` 还是 `tomatoes` 来修饰 `soup` 呢？","hint":"参考其他菜名，比如 `vegetable salad` (蔬菜沙拉)，`vegetable` 也是用单数。","takeaway":"当名词用来分类或说明另一个名词的属性时，通常用其单数形式。"}]}]},"answer_area_hint":"横线"},{"number":"26","item_type":"fill_blank","context_note":"","stem":"The students sing the song _____ (happy).","options":{},"teaching":{"correct_answer":"happily","explanation_md":"本题考查副词的用法。分析句子结构可知，主语是“The students”（学生们），谓语是“sing”（唱歌），宾语是“the song”（歌曲）。空格处需要一个词来修饰动词“sing”，说明唱歌的方式。修饰动词需要用副词。括号中给出的词“happy”是形容词，意为“快乐的”。我们需要将其变为副词形式。根据构词法，以辅音字母加“y”结尾的形容词，变副词时需要将“y”变为“i”，再加“-ly”。因此，正确答案是“happily”。","knowledge_expansion_md":"### 形容词变副词规则\n\n副词通常用来修饰动词、形容词、其他副词或整个句子，表示方式、程度、时间、地点等。很多副词是由形容词变化而来的。\n\n**主要变化规则：**\n1.  **一般情况**：直接在形容词后加 `-ly`。\n    *   `quick` → `quickly` (快地)\n    *   `slow` → `slowly` (慢地)\n2.  **以辅音字母 + y 结尾**：变 `y` 为 `i`，再加 `-ly`。\n    *   `happy` → `happily` (高兴地)\n    *   `easy` → `easily` (容易地)\n3.  **以 -le 结尾**：变 `le` 为 `ly`。\n    *   `gentle` → `gently` (温柔地)\n    *   `possible` → `possibly` (可能地)\n4.  **以 -ic 结尾**：通常加 `-ally`。\n    *   `basic` → `basically` (基本上)\n    *   `automatic` → `automatically` (自动地)\n\n**特殊情况（形副同形）：**\n一些词的形容词和副词形式相同。\n*   `fast` (快的/快地)\n*   `hard` (努力的/努力地)  (*hardly* 意为“几乎不”，词义完全不同)\n*   `late` (晚的/晚地) (*lately* 意为“最近”，词义不同)\n*   `early` (早的/早地)","socratic_tracks":[{"title":"词性判断","steps":[{"question":"在这个句子中，空格里的词是用来修饰哪个词的？","hint":"它是描述“学生们”(students) 的状态，还是描述“唱歌”(sing) 这个动作的方式？","takeaway":"空格里的词是用来修饰动词 `sing` 的。"},{"question":"修饰动词的词，我们称之为什么词性？","hint":"形容词修饰名词，那什么词修饰动词呢？","takeaway":"修饰动词需要用副词。"}]},{"title":"副词的构成","steps":[{"question":"括号里给的词 `happy` 是什么词性？","hint":"我们可以说 `a happy boy`，`happy` 是用来修饰名词 `boy` 的。","takeaway":"`happy` 是一个形容词。"},{"question":"我们已经知道需要一个副词，那么以字母 'y' 结尾的形容词 `happy` 怎样才能变成副词呢？","hint":"回忆一下 `easy` -> `easily` 的变化规则。","takeaway":"以辅音字母+y结尾的形容词，需要变y为i，再加-ly。"},{"question":"根据这个规则，`happy` 对应的副词是什么？","hint":"将 `happy` 的 `y` 变成 `i`，然后加上 `ly`。","takeaway":"`happy` 的副词形式是 `happily`。"}]},{"title":"句子成分分析","steps":[{"question":"这个句子的主语、谓语和宾语分别是什么？","hint":"谁(主语)做了(谓语)什么(宾语)？","takeaway":"主语是 `The students`，谓语是 `sing`，宾语是 `the song`。"},{"question":"那么空格部分在句子中充当什么成分呢？","hint":"它描述了动作发生的方式，我们称之为什么？","takeaway":"空格部分充当状语，修饰谓语动词 `sing`。"},{"question":"状语通常由什么词性的词来充当？这里应该用什么形式？","hint":"介词短语、副词等都可以作状语。这里括号里给的是形容词，需要变成什么形式才能作状语？","takeaway":"在这里，我们需要将形容词 `happy` 变为副词 `happily` 来充当状语。"}]}]},"answer_area_hint":"横线"},{"number":"27","item_type":"fill_blank","context_note":"","stem":"There _____ any fruit or a lot of vegetables on the table just now. (be)","options":{},"teaching":{"correct_answer":"wasn't","explanation_md":"本题考查 `There be` 句型的过去时态和主谓一致。首先，时间状语 `just now` (刚才) 表明句子应用一般过去时，所以 `be` 动词应为 `was` 或 `were`。其次，句中有 `any`，通常用于否定句或疑问句，结合句型结构，判断为否定句，所以应为 `wasn't` 或 `weren't`。最后，`There be` 句型的主谓一致遵循“就近原则”，即 `be` 动
