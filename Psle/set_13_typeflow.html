  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第13套","exam_meta":{"full_score_text":"满分:80分","time_text":"时间:60分钟"},"sections":[{"section_title":"I. 单选题","section_instruction":"(共20分)","items":[{"number":"1","item_type":"choice","context_note":"","stem":"Tea(茶) _____ in the southeast of China.","options":{"A":"is grown","B":"are grown","C":"grows","D":"grow"},"teaching":{"correct_answer":"A","explanation_md":"本题考查一般现在时的被动语态。句子的主语是“Tea”(茶)，是动作“grow”(种植)的承受者，因此需要使用被动语态。句子描述的是一个普遍的客观事实（茶在中国的东南部被种植），所以应使用一般现在时。一般现在时的被动语态结构为“am/is/are + 动词的过去分词”。主语“Tea”是不可数名词，谓语动词用单数形式，故用“is”。“grow”的过去分词是“grown”。因此，正确答案是“is grown”。","knowledge_expansion_md":"### 被动语态专项拓展\n\n1.  **被动语态基本结构**：`be + 动词的过去分词 (done)`。\n2.  **一般现在时的被动语态**：`am/is/are + done`，常用于描述客观事实、普遍真理、或经常性、习惯性的被动动作。例如：`English is spoken in many countries.` (英语在许多国家被使用。)\n3.  **主谓一致**：当主语是不可数名词（如 tea, water, rice, information）时，通常被视为单数，谓语动词也用单数形式（如 is, was, has, does）。\n4.  **主动与被动的选择**：当主语是动作的发出者时，用主动语态；当主语是动作的承受者时，用被动语态。本题中，如果是 `Farmers grow tea.` (农民种茶)，则用主动语态。而主语换成 `Tea`，就必须用被动语态。","socratic_tracks":[{"title":"主被动语态判断","steps":[{"question":"我们来看句子的主语“Tea”(茶)和动词“grow”(种植)。想一想，是茶自己主动生长，还是它“被”人们种植呢？","hint":"茶园里的茶树是农民伯伯种的，还是自己从土里冒出来的？","takeaway":"茶是“被”种植的，所以主语是动作的承受者，应该使用被动语态。"},{"question":"既然确定了要用被动语态，它的基本构成是什么？","hint":"它由一个助动词和一个主要动词的特殊形式组成。","takeaway":"被动语态的基本结构是“be动词 + 动词的过去分词”。"}]},{"title":"时态选择","steps":[{"question":"这句话“茶在中国东南部被种植”是在描述一个刚刚完成的动作，还是一个长期存在、普遍为人所知的事实？","hint":"这像不像是地理课本或者百科全书里的一句话？","takeaway":"这句话陈述的是一个客观事实，所以应该使用一般现在时。"},{"question":"那么，一般现在时的被动语态具体结构是什么？","hint":"把被动语态的基本结构“be + done”和一般现在时结合起来。","takeaway":"一般现在时的被动语态结构是“am/is/are + 过去分词”。"}]},{"title":"主谓一致","steps":[{"question":"句子的主语“Tea”是可数名词还是不可数名词？","hint":"我们通常说“some tea”，而不是“a tea, two teas”（除非指“一杯茶”）。这里指的是茶叶这种物质。","takeaway":"作为一种物质，“Tea”是不可数名词。"},{"question":"当不可数名词作主语时，be动词应该用单数形式还是复数形式？是用 is 还是 are？","hint":"不可数名词被看作一个整体，所以是单数概念。","takeaway":"不可数名词作主语，谓语动词用单数形式，所以be动词应该用“is”。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"The letter _____ three days ago and it _____ yesterday.","options":{"A":"had posted; had arrived","B":"was posted; arrived","C":"posted; arrived","D":"had been posted; was arrived"},"teaching":{"correct_answer":"B","explanation_md":"本题考查动词的时态和语态。第一个空，时间状语是“three days ago”，提示用一般过去时；主语“The letter”(信)和动词“post”(邮寄)之间是被动关系，信是“被邮寄”的，所以用一般过去时的被动语态“was posted”。第二个空，时间状语是“yesterday”，提示用一般过去时；主语“it”(指代信)和动词“arrive”(到达)之间是主动关系，因为“arrive”是不及物动词，表示主语自身完成的动作，没有被动语态，所以用主动语态的过去式“arrived”。综合来看，选择B。","knowledge_expansion_md":"### 动词时态与语态综合运用\n\n1.  **一般过去时的被动语态**：结构为 `was/were + 过去分词`。用于表示在过去某个特定时间，主语承受了一个动作。时间标志词常有 `yesterday`, `last week`, `... ago` 等。\n2.  **及物动词(vt.)与不及物动词(vi.)**：\n    *   **及物动词**：后面必须跟宾语，动作才能完整。如 `post a letter`, `build a house`。及物动词有被动语态。\n    *   **不及物动词**：本身意义完整，后面不需跟宾语。如 `arrive`, `happen`, `die`, `disappear`。不及物动词通常没有被动语态，这是一个非常重要的考点。例如，我们不能说 `The accident was happened.`，而应说 `The accident happened.`。\n3.  **连词 `and` 连接的并列句**：`and` 连接的两个分句，时态往往会保持一致或有逻辑上的顺承关系。本题中，两个动作都发生在过去，都使用了一般过去时。","socratic_tracks":[{"title":"第一个空的分析","steps":[{"question":"看到第一个空后面的时间词“three days ago”，我们首先应该确定这是什么时态？","hint":"“...ago”表示“...以前”，是哪个时态的典型标志？","takeaway":"“three days ago”明确指示了动作发生在过去，应使用一般过去时。"},{"question":"主语“The letter”(信)和动词“post”(邮寄)是什么关系？是主动还是被动？","hint":"是信自己寄自己，还是信被别人寄？","takeaway":"信是“被”邮寄的，所以应该使用被动语态。"},{"question":"结合“一般过去时”和“被动语态”，第一个空应该填什么？","hint":"一般过去时的被动语态结构是 `was/were + 过去分词`。","takeaway":"主语是单数“The letter”，所以用“was posted”。"}]},{"title":"第二个空的分析","steps":[{"question":"看到第二个空后面的时间词“yesterday”，我们应该确定这是什么时态？","hint":"“昨天”发生的动作。","takeaway":"“yesterday”同样是一般过去时的标志。"},{"question":"动词“arrive”(到达)是及物动词还是不及物动词？它有被动语态吗？","hint":"我们能说“The letter was arrived”吗？或者想一下，我们是说“arrive the station”还是“arrive at the station”？","takeaway":"“arrive”是不及物动词，表示主语自身完成的动作，没有被动语态，只能用主动语态。"},{"question":"既然是主动语态的一般过去时，那“arrive”的正确形式是什么？","hint":"这是一个规则动词，它的过去式是什么？","takeaway":"“arrive”的过去式是“arrived”。"}]},{"title":"错误选项辨析","steps":[{"question":"为什么选项D “had been posted; was arrived” 是错误的？","hint":"从时态和语态两个角度分析D选项的两个部分。","takeaway":"“had been posted”是过去完成时，与“three days ago”不匹配；“was arrived”是错误的被动用法，因为“arrive”是不及物动词。"},{"question":"为什么选项C “posted; arrived” 是错误的？","hint":"分析第一个动词“posted”的语态是否正确。","takeaway":"“posted”是主动语态，表示“信邮寄了（某物）”，这在逻辑上不通，应该是信“被”邮寄。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"The final examination _____ next Thursday.","options":{"A":"is given","B":"will be given","C":"would have given","D":"would be given"},"teaching":{"correct_answer":"B","explanation_md":"本题考查一般将来时的被动语态。句子的时间状语是“next Thursday”(下周四)，表明动作将发生在未来，因此需要使用将来时。句子的主语是“The final examination”(期末考试)，它与动词“give”(举行)之间是被动关系，因为考试是“被举行”的。一般将来时的被动语态结构是“will be + 动词的过去分词”。动词“give”的过去分词是“given”。因此，正确答案是“will be given”。","knowledge_expansion_md":"### 表示将来的被动语态\n\n1.  **一般将来时的被动语态**：\n    *   结构：`will be + 过去分词`。\n    *   用法：表示将来某个时间点将要被做的某事。这是最常用的将来被动形式。\n    *   例句：`The report will be finished tomorrow.` (报告明天将被完成。)\n\n2.  **be going to 的被动语态**：\n    *   结构：`am/is/are going to be + 过去分词`。\n    *   用法：表示根据已有计划、安排或迹象，某事将要被做。与 `will be done` 意思相近，常可互换。\n    *   例句：`A new school is going to be built here.` (这里将要建一所新学校。)\n\n3.  **用一般现在时的被动语态表示将来**：\n    *   结构：`is/are + 过去分词`。\n    *   用法：仅限于表示按规定、时刻表或日程已确定好的将来动作。\n    *   例句：`The party is held at 8 p.m. this Saturday.` (派对于本周六晚上8点举行。)\n    *   注意：虽然选项A `is given` 属于此种用法，但在没有上下文强调“日程安排”的情况下，`will be given` 是更通用、更明确表示将来的选项。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"句子中的时间短语“next Thursday”告诉我们这个动作发生在什么时候？","hint":"“next”是“下一个”的意思，指向的是过去、现在还是未来？","takeaway":"“next Thursday”表示“下周四”，是一个未来的时间，所以句子要用将来时。"}]},{"title":"语态判断","steps":[{"question":"句子的主语“The final examination”(期末考试)和动词“give”(举行)是什么关系？是考试自己举行自己，还是它被学校或老师举行？","hint":"想一想，是谁在组织考试？","takeaway":"考试是“被”举行的，所以主语是动作的承受者，应该使用被动语态。"},{"question":"在“give an exam”这个搭配中，“give”是什么意思？","hint":"它不是“给予”的意思，而是和考试有关的一个动作。","takeaway":"在这里，“give an exam”意为“举行一场考试”，等同于“hold an exam”。"}]},{"title":"语法结构合成","steps":[{"question":"我们已经确定了要用“将来时”和“被动语态”，那么正确的语法结构应该是什么？","hint":"将来时的标志是“will”，被动语态的标志是“be + 过去分词”，把它们组合起来。","takeaway":"一般将来时的被动语态结构是“will be + 过去分词”。"},{"question":"动词“give”的过去分词是什么？","hint":"它的变化是 give - gave - ?","takeaway":"“give”的过去分词是“given”。"},{"question":"综合以上分析，哪个选项是唯一正确的？为什么C和D选项中的“would”不合适？","hint":"“would”通常用在虚拟语气或过去将来时中，这里只是一个简单的将来事实陈述。","takeaway":"只有B选项“will be given”准确地表达了“一般将来时的被动语态”，最符合题意。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"_____ a new library _____ in our school last year?","options":{"A":"Is; built","B":"Does; build","C":"Was; built","D":"Did; build"},"teaching":{"correct_answer":"C","explanation_md":"本题考查一般过去时被动语态的疑问句形式。首先，根据时间状语“last year”(去年)，可以确定句子应使用一般过去时。其次，句子的主语是“a new library”(一座新图书馆)，动词是“build”(建造)，图书馆是“被建造”的，所以应使用被动语态。一般过去时被动语态的陈述句是“A new library was built...”。本题是一个一般疑问句，需要将be动词提到句首。因此，正确的疑问句结构是“Was a new library built...?”。第一个空填“Was”，第二个空填“built”。","knowledge_expansion_md":"### 被动语态的疑问句结构\n\n被动语态的疑问句是通过移动助动词 `be` 或在句首添加助动词 `do/does/did` (较少见)来构成的。\n\n1.  **一般疑问句**：将陈述句中的第一个助动词（通常是 `be` 动词或情态动词）提到主语前面。\n    *   一般现在时: `Is/Are + 主语 + done ...?` (e.g., `Is English taught here?`)\n    *   一般过去时: `Was/Were + 主语 + done ...?` (e.g., `Was the window broken?`)\n    *   一般将来时: `Will + 主语 + be done ...?` (e.g., `Will the work be finished?`)\n\n2.  **特殊疑问句**：在一般疑问句的基础上，在句首加上特殊疑问词（如 `What`, `When`, `Where`, `Who`, `Why`）。\n    *   `特殊疑问词 + is/are/was/were + 主语 + done ...?`\n    *   例句: `When was this bridge built?` (这座桥是什么时候建的？)\n\n3.  **主动语态疑问句 vs. 被动语态疑问句**：\n    *   主动 (D选项): `Did they build a new library last year?` (助动词 `Did` + 主语 + 动词原形 `build`)\n    *   被动 (C选项): `Was a new library built last year?` (助动词 `Was` + 主语 + 过去分词 `built`)\n    *   两者主语不同，动词形式也不同，切勿混淆。","socratic_tracks":[{"title":"时态与语态的确定","steps":[{"question":"看到句尾的“last year”，你认为这个问句应该关于什么时间？","hint":"“去年”是过去的时间。","takeaway":"“last year”是一般过去时的明确标志。"},{"question":"句子的主语是“a new library”(图书馆)，它和动词“build”(建造)是什么关系？","hint":"是图书馆自己建造东西，还是它被别人建造？","takeaway":"图书馆是“被”建造的，所以应该使用被动语态。"}]},{"title":"疑问句的正确语序","steps":[{"question":"我们已经确定了要用“一般过去时的被动语态”。它的陈述句形式应该是怎样的？","hint":"主语 + was/were + 过去分词...","takeaway":"陈述句是：“A new library was built in our school last year.”"},{"question":"如何将这个含有be动词“was”的陈述句，变成一个“是/否”的一般疑问句？","hint":"对于含有be动词的句子，变疑问句非常简单，只需要移动一个词的位置。","takeaway":"将be动词“was”提到主语“a new library”的前面即可。"},{"question":"那么，变化后的疑问句是什么样的？对应到题目中的两个空格，应该分别填什么？","hint":"Was a new library built ...?","takeaway":"第一个空填“Was”，第二个空填过去分词“built”。"}]},{"title":"主动与被动疑问句的辨析","steps":[{"question":"我们来看D选项“Did; build”。这是一个正确的疑问句结构吗？它表达的是什么意思？","hint":"“Did + 主语 + 动词原形...?”是什么时态和语态的疑问句？","takeaway":"“Did ... build”是一般过去时主动语态的疑问句，表示“（主语）建了...吗？”"},{"question":"如果用D选项，句子就变成了“Did a new library build in our school last year?”。这句话在逻辑上说得通吗？","hint":"主语是“a new library”，它能发出“build”这个动作吗？","takeaway":"这句话的意思是“去年一座新图书馆在我们的学校里建造（东西）了吗？”，逻辑完全错误。因此，必须用被动语态。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"You should keep _____ and you will succeed sooner or later.","options":{"A":"trying","B":"try","C":"tried","D":"to try"},"teaching":{"correct_answer":"A","explanation_md":"本题考查动词 `keep` 的固定搭配。`keep doing something` 是一个固定用法，意为“持续做某事”或“一直做某事”。根据句意“你应该持续努力，迟早会成功的”，空格处需要一个表示持续动作的动词形式。因此，`keep` 后面应跟动词的-ing形式，即 `trying`。选项B是动词原形，C是过去式/过去分词，D是不定式，均不符合 `keep` 的用法。","knowledge_expansion_md":"### 动词+动名词(V-ing)结构\n\n在英语中，一些动词后面习惯性地跟动名词（即动词的-ing形式）作宾语，表示一个动作或经历。`keep doing sth.` 就是其中非常典型的一个。\n\n**常见的要求接-ing形式作宾语的动词：**\n*   **表示喜好/厌恶：** `enjoy` (喜欢), `like` (喜欢), `love` (热爱), `hate` (憎恨), `dislike` (不喜欢), `mind` (介意)\n    *   *e.g., I enjoy listening to music.* (我喜欢听音乐。)\n*   **表示“完成/停止”等概念：** `finish` (完成), `stop` (停止), `quit` (放弃), `give up` (放弃)\n    *   *e.g., Have you finished doing your homework?* (你完成作业了吗？)\n*   **表示“建议/考虑”等概念：** `suggest` (建议), `advise` (建议), `consider` (考虑)\n    *   *e.g., He suggested going for a walk.* (他建议去散步。)\n*   **其他常用动词：** `practice` (练习), `avoid` (避免), `miss` (错过), `keep` (保持)\n    *   *e.g., You should practice speaking English every day.* (你应该每天练习说英语。)","socratic_tracks":[{"title":"动词 `keep` 的用法","steps":[{"question":"在英语中，“保持安静”我们通常怎么说？是 `Keep quiet` 还是 `Keep quieting`？","hint":"Quiet 是一个形容词。","takeaway":"`keep` 后面可以跟形容词，表示“保持某种状态”。"},{"question":"那如果我们想表达“持续做一个动作”，比如“一直笑”，应该用 `keep smile` 还是 `keep smiling`？","hint":"回想一下你听过的歌曲或看过的电影里，有没有 `keep smiling` 这样的表达？","takeaway":"动词 `keep` 后面需要跟动词的-ing形式，构成 `keep doing sth.` 结构，表示“持续做某事”。"}]},{"title":"句子含义与逻辑","steps":[{"question":"题干中 `you will succeed sooner or later` (你迟早会成功) 暗示了前面的动作应该是一次性的还是持续性的？","hint":"成功是轻易就能达成的吗？还是需要不断的努力？","takeaway":"句意要求一个持续性的动作，即“持续努力”。"},{"question":"四个选项中，哪个选项最能表达“持续努力”这个概念？","hint":"`trying` 是 `try` 的-ing形式，可以表示正在进行或持续的尝试。","takeaway":"结合 `keep` 表示“持续”的用法，`keep trying` 完美地表达了“持续努力”的含义。"}]},{"title":"动词作宾语的形式","steps":[{"question":"在这个句子中，`You` 是主语，`should keep` 是谓语动词，那么横线上的词应该充当什么句子成分？","hint":"它跟在动词 `keep` 后面，回答了“保持什么”的问题。","takeaway":"横线上的词是动词 `keep` 的宾语。"},{"question":"动词本身不能直接作宾语，需要变形。我们学过哪几种动词变形可以充当宾语？","hint":"想一想 `I want to swim.` 和 `I enjoy swimming.` 这两个句子。","takeaway":"动词的不定式(to do)和动名词(-ing)形式都可以作宾语。"},{"question":"那么，到底是用 `to try` 还是 `trying`，是由哪个词决定的呢？","hint":"是由前面的谓语动词 `keep` 决定的。","takeaway":"不同的谓语动词要求跟不同形式的宾语，`keep` 要求跟动名词(-ing)形式作宾语。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"We are all looking forward to _____ the USA next week.","options":{"A":"visit","B":"visiting","C":"visited","D":"to visit"},"teaching":{"correct_answer":"B","explanation_md":"本题考查固定短语 `look forward to` 的用法。`look forward to` 意为“盼望，期待”，是一个固定的动词短语。这里的 `to` 是一个介词，而不是不定式符号。介词后面必须跟名词、代词或动名词（动词的-ing形式）。因此，空格处应填 `visiting`。很多同学会误以为 `to` 后面只能跟动词原形，从而错选D，这是需要特别注意的易错点。","knowledge_expansion_md":"### 介词 `to` + 动名词(V-ing)\n\n在英语中，`to` 有两种主要身份：\n1.  **不定式符号**：构成 `to do` 结构，后面跟动词原形。例如：`I want to go.`\n2.  **介词**：表示方向、对象等，后面跟名词、代词或动名词(-ing)。\n\n本题中的 `look forward to` 就是 `to` 作介词的典型例子。这类短语需要作为固定搭配来记忆。\n\n**其他常见的 `to` 为介词的短语：**\n*   `be used to doing sth.` (习惯于做某事)  *vs. `used to do sth.` (过去常常做某事)*\n*   `pay attention to doing sth.` (注意做某事)\n*   `get down to doing sth.` (开始认真做某事)\n*   `object to doing sth.` (反对做某事)\n*   `be devoted to doing sth.` (致力于做某事)\n*   `prefer doing A to doing B` (比起做B更喜欢做A)\n\n**记忆技巧：** 当 `to` 前面有其他实义动词、名词或形容词，共同构成一个有意义的短语时，这个 `to` 很有可能就是介词。","socratic_tracks":[{"title":"固定搭配 `look forward to`","steps":[{"question":"`look forward to` 这个短语是什么意思？","hint":"当你对即将到来的假期感到兴奋时，你就可以说 `I'm looking forward to the holiday.`","takeaway":"`look forward to` 的意思是“盼望，期待”。"},{"question":"我们来做一个小实验：说“我期待你的回信”，是 `I look forward to your reply.` 这里的 `reply` 是名词。这能给我们什么启示？","hint":"介词后面可以跟名词。","takeaway":"这表明 `look forward to` 中的 `to` 是一个介词。"},{"question":"既然 `to` 是介词，那么当它后面要跟一个动词时，这个动词应该变成什么形式？","hint":"介词后面不能直接跟动词原形，需要把动词“名词化”。","takeaway":"介词后面必须跟动名词（-ing形式），所以答案是 `visiting`。"}]},{"title":"区分介词 `to` 和不定式 `to`","steps":[{"question":"我们平时常见的 `want to do`, `need to do`, `plan to do` 里面的 `to` 后面都跟动词原形，为什么这道题不行？","hint":"观察 `to` 前面的词。`want`, `need`, `plan` 都是单个的动词，而 `look forward to` 是一个不可分割的整体短语。","takeaway":"必须判断 `to` 是单独作为不定式符号，还是作为短语的一部分充当介词。"},{"question":"“我过去常常在美国生活”是 `I used to live in the USA.`。“我习惯了在美国生活”是 `I am used to living in the USA.` 你能看出这两个 `to` 的区别吗？","hint":"第一个 `used to` 是一个整体，表示“过去常常”；第二个 `be used to` 是一个整体，表示“习惯于”。","takeaway":"通过对比 `used to do` 和 `be used to doing`，可以深刻理解不定式 `to` 和介词 `to` 的区别。"}]},{"title":"从句意理解语法","steps":[{"question":"句中 `We are all looking forward to...` 表达的是一种什么样的情绪？","hint":"是对未来事件的一种期盼和向往。","takeaway":"这是一种对“某件事”的期待。"},{"question":"“参观美国”这件事，在语法上应该作为一个整体，充当“期待”的什么？","hint":"期待（什么事）？回答这个问题的就是宾语。","takeaway":"“参观美国”是 `look forward to` 这个动作的宾语。"},{"question":"动词 `visit` 如何变化才能充当介词 `to` 的宾语？","hint":"动词需要变成动名词形式才能作介词的宾语。","takeaway":"将动词 `visit` 变为动名词 `visiting`，才能正确地作介词 `to` 的宾语。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"He spent all his time _____ children in poor areas _____ math.","options":{"A":"help; study","B":"helping; studying","C":"help; studying","D":"helping; study"},"teaching":{"correct_answer":"D","explanation_md":"本题在一个句子中考查了两个重要的动词用法。\n1.  **第一个空**：考查 `spend` 的用法。`spend time/money (in) doing something` 是固定搭配，意为“花费时间/金钱做某事”。其中 `in` 通常被省略。因此，`spent all his time` 后面应该跟动词的-ing形式，即 `helping`。由此可排除A和C。\n2.  **第二个空**：考查 `help` 的用法。`help somebody (to) do something` 是固定搭配，意为“帮助某人做某事”。动词 `help` 后面可以跟带 `to` 的不定式，也可以跟不带 `to` 的动词原形，后者在现代英语中更常见。因此，`help children` 后面可以跟 `study`。由此可排除B。\n\n综合以上两点，正确答案为D。","knowledge_expansion_md":"### 复合结构考查\n\n本题是小升初考试中常见的形式，将多个知识点融合在一个句子中进行考查，要求学生对基础句型有扎实的掌握。\n\n**1. `spend` 的相关句型辨析：**\n*   `sb. spend time/money on sth.` (主语是人，宾语是sth.名词)\n    *   *e.g., He spent 100 yuan on the book.*\n*   `sb. spend time/money (in) doing sth.` (主语是人，宾语是doing sth.动名词)\n    *   *e.g., He spent two hours (in) doing his homework.*\n*   `It takes sb. time to do sth.` (花费某人时间做某事)\n    *   *e.g., It took him two hours to do his homework.*\n*   `sth. costs sb. money.` (某物花费某人金钱)\n    *   *e.g., The book cost him 100 yuan.*\n\n**2. `help` 的用法总结：**\n*   `help sb. (to) do sth.` (帮助某人做某事)\n    *   *e.g., Can you help me (to) carry this box?*\n*   `help sb. with sth.` (在某方面帮助某人)\n    *   *e.g., Can you help me with my English?*\n*   `be of great help to sb.` (对某人有很大帮助)\n    *   *e.g., Your advice is of great help to me.*","socratic_tracks":[{"title":"考点一：`spend` 的用法","steps":[{"question":"当我们想表达“花费时间做某事”时，动词 `spend` 后面应该跟动词的什么形式？","hint":"回忆一下固定句型 `spend time ...`。","takeaway":"句型是 `spend time (in) doing sth.`，所以第一个空应该填 `helping`。"},{"question":"根据第一个空的判断，我们可以排除哪几个选项？","hint":"第一个空必须是 `helping`。","takeaway":"可以立刻排除选项A和C，只剩下B和D。"}]},{"title":"考点二：`help` 的用法","steps":[{"question":"当我们想表达“帮助某人做某事”时，动词 `help` 后面的人称代词之后，动词应该用什么形式？","hint":"想一想“请帮我开门”怎么说？`Help me open the door.`","takeaway":"句型是 `help sb. (to) do sth.`，`to` 可以省略，所以 `help children` 后面可以跟动词原形 `study`。"},{"question":"现在结合对第二个空的判断，在剩下的B和D选项中，应该选择哪一个？","hint":"第二个空应该是 `study` 或 `to study`，而选项B的第二个空是 `studying`。","takeaway":"选项D的 `study` 符合 `help sb. do sth.` 的用法，因此D是正确答案。"}]},{"title":"解题策略：拆分与组合","steps":[{"question":"这个句子看起来比较长，有两个空，我们应该如何入手？","hint":"不要试图一次性看懂所有，可以把句子拆分成两部分来分析。","takeaway":"处理复杂长句时，可以采用“逐个击破”的策略，先分析第一个考点，再分析第二个考点。"},{"question":"第一个空由哪个词决定？第二个空又由哪个词决定？","hint":"第一个空前面的 `spent` 是关键；第二个空前面的 `help` 是关键。","takeaway":"准确找到每个空格所对应的核心动词或短语，是正确解题的前提。"},{"question":"将你选择的答案D代入句子，读一读，看看是否通顺，意思是否合理。","hint":"`He spent all his time helping children in poor areas study math.` 他花所有时间帮助贫困地区的孩子学习数学。","takeaway":"最后一步的代入验证，是检查答案、确保语法和逻辑都正确的好习惯。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"I consider _____ a trip to Beijing.","options":{"A":"taking","B":"take","C":"taken","D":"to take"},"teaching":{"correct_answer":"A","explanation_md":"本题考查动词 `consider` 的用法。当 `consider` 意为“考虑（做某事）”时，它后面必须跟动名词（即动词的-ing形式）作为其宾语。这是一个固定的语法规则。句子的意思是“我考虑去北京旅行”。`take a trip` 意为“去旅行”，需要将其中的动词 `take` 变为动名词形式 `taking`。因此，正确的表达是 `consider taking a trip`。其他选项B（原形）、C（过去分词）、D（不定式）均不符合 `consider` 的这一用法。","knowledge_expansion_md":"### `consider` 的多重用法辨析\n\n动词 `consider` 是一个非常重要的词汇，有多种不同的含义和句型，容易混淆。\n\n1.  **`consider doing sth.` - 考虑做某事**\n    这是本题的考点。`consider` 后面跟动名词作宾语。\n    *   *e.g., We are considering buying a new car.* (我们正在考虑买一辆新车。)\n\n2.  **`consider sb./sth. (to be) + 名词/形容词` - 认为某人/某事是...**\n    这个句型表示一种看法或评价。其中 `to be` 常常可以省略。\n    *   *e.g., I consider him (to be) my best friend.* (我把他看作我最好的朋友。)\n    *   *e.g., We consider the plan (to be) a success.* (我们认为这个计划是成功的。)\n\n3.  **`consider + 疑问词 + to do` - 考虑（如何/何时...）做某事**\n    *   *e.g., We need to consider what to do next.* (我们需要考虑接下来做什么。)\n\n**易错点提醒：** 学生常常将 `consider doing sth.` 和 `consider sb./sth. to be...` 混淆。要根据句意来判断 `consider` 是“考虑”还是“认为”，从而选择正确的后续结构。","socratic_tracks":[{"title":"动词 `consider` 的核心用法","steps":[{"question":"当你想表达“我正在考虑一件事情”时，`consider` 这个词后面应该跟什么形式的词？","hint":"参考 `enjoy doing sth.` (享受做某事) 和 `finish doing sth.` (完成做某事) 的用法。","takeaway":"当 `consider` 意为“考虑”时，其后应接动名词（-ing形式）作宾语。"},{"question":"“去旅行”的英文短语是 `take a trip`。那么“考虑去旅行”应该怎么说？","hint":"将动词 `take` 变成-ing形式。","takeaway":"正确的表达是 `consider taking a trip`。"}]},{"title":"`consider` 的不同含义","steps":[{"question":"请看这个句子：`I consider him a hero.`（我认为他是个英雄）。这里的 `consider` 是什么意思？","hint":"它表达的是一种看法或评价。","takeaway":"在这个句子里，`consider` 的意思是“认为，把……看作”。"},{"question":"再看本题的句子：`I consider _____ a trip to Beijing.` 这里的 `consider` 是“认为”还是“考虑”？","hint":"结合后面的“去北京旅行”，整个句子的意思更像是内心的盘算和计划。","takeaway":"在本题中，`consider` 的意思是“考虑”。"},{"question":"根据 `consider` 意思的不同，它后面的结构也不同。当它是“考虑”时，后面跟什么？当它是“认为”时，后面又跟什么？","hint":"“考虑”做某事 vs “认为”某人是...。","takeaway":"“考虑”用 `consider doing sth.` 结构；“认为”用 `consider sb./sth. ...` 结构。理解词义是选择正确语法的关键。"}]},{"title":"排除法应用","steps":[{"question":"为什么选项D `to take` 是错误的？","hint":"虽然很多动词后面跟 `to do`，比如 `want to do`，但 `consider` 是个特例。","takeaway":"`consider` 不属于后接不定式作宾语的动词类别。"},{"question":"为什么选项B `take` (原形) 和 C `taken` (过去分词) 是错误的？","hint":"一个完整的句子中，谓语动词 `consider` 后面不能直接跟另一个动词原形或过去分词作宾语。","takeaway":"动词作宾语时必须采用非谓语动词形式（-ing或to do），而具体用哪种形式由前面的谓语动词决定。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—What is your plan _____ your future?\n—I decided _____ for my hometown in the future.","options":{"A":"for; working","B":"for; to work","C":"on; working","D":"on; to work"},"teaching":{"correct_answer":"B","explanation_md":"本题考查固定搭配。第一个空考查介词，短语 `plan for sth.` 意为“为……做计划”，是固定用法，因此填 `for`。第二个空考查非谓语动词，动词 `decide` 后常跟动词不定式作宾语，构成 `decide to do sth.` 结构，意为“决定做某事”，因此填 `to work`。综合来看，正确答案为B。","knowledge_expansion_md":"### 知识点拓展：\n\n1.  **`plan` 的相关用法**：\n    *   `plan for sth.` 为……做计划。例：`We need a plan for the future.` (我们需要一个未来的计划。)\n    *   `plan to do sth.` 计划做某事。例：`I plan to travel this summer.` (我计划今年夏天去旅行。)\n    *   `plan on doing sth.` 打算做某事。例：`They plan on moving to a new city.` (他们打算搬到一个新城市。)\n\n2.  **`decide` 的相关用法**：\n    *   `decide to do sth.` 决定做某事。这是最常见的用法。\n    *   `decide on sth.` 选定/决定某事。例：`Have you decided on a name for your dog?` (你决定好给你的狗取什么名字了吗？)\n    *   `decide that + 从句` 决定……。例：`He decided that he would study abroad.` (他决定了要去国外学习。)\n\n3.  **后跟不定式(to do) vs. 动名词(doing)的动词**：\n    *   **跟 to do**：`want`, `hope`, `plan`, `decide`, `agree`, `offer`, `refuse` 等，多表示未来的、一次性的动作。\n    *   **跟 doing**：`enjoy`, `finish`, `mind`, `practice`, `avoid`, `suggest` 等，多表示习惯性的、已发生的或持续性的动作。","socratic_tracks":[{"title":"介词搭配","steps":[{"question":"当我们说“为未来做计划”时，在 `plan` 和 `future` 之间，你觉得用哪个介词最自然？是 `for` 还是 `on`？","hint":"可以回忆一下“为周末做计划” (a plan ___ the weekend) 这个常用短语。","takeaway":"`plan for sth.` 是一个固定搭配，表示“为……做的计划”。"},{"question":"那么 `plan on` 这个搭配存在吗？如果存在，它后面通常跟什么形式的词？","hint":"比如，在句子 `I plan on finishing my homework.` 中，`finishing` 是什么形式？","takeaway":"`plan on doing sth.` 也是一个有效搭配，表示“打算做某事”，后面跟动名词。"}]},{"title":"动词用法","steps":[{"question":"当我们要表达“决定去做某事”时，动词 `decide` 后面应该跟动词的哪种形式？是 `to do` 还是 `doing`？","hint":"试着造一个句子：“我决定回家”。是 `I decided to go home` 还是 `I decided going home`？","takeaway":"`decide to do sth.` 是固定用法，表示“决定做某事”。"},{"question":"除了 `decide`，你还能想到其他哪些常见的动词，后面也必须跟 `to do` 形式吗？","hint":"想一想表示“想要”、“希望”、“计划”的动词。","takeaway":"掌握常见动词后跟不定式（to do）的规律是解题的关键，例如 `want to do`, `hope to do`, `plan to do`。"}]},{"title":"不定式 vs. 动名词","steps":[{"question":"为什么第二个空不能选 `working`？`working` 是动词的什么形式？","hint":"`working` 是 `work` 的现在分词或动名词形式。","takeaway":"动词 `decide` 后面不能直接跟动名词作宾语。"},{"question":"那你能举一个后面必须跟动名词（-ing形式）的动词例子吗？","hint":"比如“享受做某事” (enjoy doing sth.) 或者“完成做某事” (finish doing sth.)。","takeaway":"英语中，不同动词后跟不定式还是动名词有固定的规则，需要分类记忆。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—What do your parents do, Jack?\n—_____ my father _____ my mother are doctors and they work in the same hospital.","options":{"A":"Either; or","B":"Neither; nor","C":"Not only; but also","D":"Both; and"},"teaching":{"correct_answer":"D","explanation_md":"本题考查并列连词的用法。根据答句后半句 “they work in the same hospital”（他们（俩）在同一家医院工作）可知，此处意为父母二人都是医生。选项中，`Both... and...` 意为“两者都”，符合句意。`Both A and B` 连接两个主语时，谓语动词用复数形式，句中的 `are` 是复数动词，语法正确。`Either... or...` 意为“或者...或者...”，`Neither... nor...` 意为“既不...也不...”，`Not only... but also...` 意为“不但...而且...”，这三者作主语时，谓语动词通常遵循“就近原则”，与原句的复数动词 `are` 不符。","knowledge_expansion_md":"### 知识点拓展：\n\n1.  **并列连词辨析**：\n    *   `Both A and B`: 两者都... (连接主语时，谓语动词用复数)。\n    *   `Either A or B`: 或者A或者B (连接主语时，谓语动词遵循“就近原则”)。\n    *   `Neither A nor B`: A和B都不... (连接主语时，谓语动词遵循“就近原则”)。\n    *   `Not only A but also B`: 不但A而且B (连接主语时，谓语动词遵循“就近原则”)。\n\n2.  **主谓一致三大原则**：\n    *   **语法一致**：主语是单数，谓语用单数；主语是复数，谓语用复数。这是最基本的原则。\n    *   **意义一致**：谓语动词的单复数取决于主语所表达的意义，而非其表面形式。如 `The family is large.` (家庭是大的，指一个整体) vs. `The family are all watching TV.` (家人都在看电视，指所有成员)。\n    *   **就近原则 (Proximity Principle)**：当主语由 `either...or...`, `neither...nor...`, `not only...but also...` 或 `or` 连接时，谓语动词的数与离它最近的主语保持一致。例：`Neither you nor he **is** right.` (谓语 `is` 与 `he` 一致)。\n\n3.  **`Both...and...` 的特殊性**：在以上四个连词组中，只有 `Both...and...` 连接主语时，谓语动词必须用复数，不遵循就近原则。","socratic_tracks":[{"title":"连词含义辨析","steps":[{"question":"看到答句说“他们(they)在同一家医院工作”，这说明父母的职业情况是怎样的？是一个人是医生还是两个人都是？","hint":"代词 “they” 指代的是两个人，即 “my father and my mother”。","takeaway":"句意明确指出父母两人都是医生。"},{"question":"那么四个选项中，哪一个连词组最能准确表达“两者都”的意思？","hint":"逐一翻译四个选项：A. 或者...或者... B. 既不...也不... C. 不但...而且... D. ...和...都。","takeaway":"只有 “Both...and...” 准确表达了“两者都”的含义。"}]},{"title":"主谓一致原则","steps":[{"question":"请看句子中的动词 “are”。它是单数形式还是复数形式？","hint":"be动词的单数现在时是 is，复数现在时是 are。","takeaway":"句中的谓语动词 “are” 是复数形式。"},{"question":"谓语动词是复数，说明主语也必须是复数。在四个选项的连词结构中，哪一个连接主语时，谓语动词必须用复数？","hint":"回顾一下 “Both A and B” 作主语时的用法规则。","takeaway":"“Both A and B” 作主语时，谓语动词必须用复数，这与句中的 “are” 完全吻合。"}]},{"title":"排除法应用","steps":[{"question":"我们来试试A选项 “Either...or...”。如果填入，句子变成 “Either my father or my mother ___ doctors.”，根据“就近原则”，横线处动词应该用单数还是复数？","hint":"动词要和离它最近的主语 “my mother” (单数) 保持一致。","takeaway":"应为 “is a doctor”，与原句的 “are doctors” 不符，所以排除A。"},{"question":"用同样的方法分析 “Neither...nor...” 和 “Not only...but also...”，它们是否符合句意和语法规则？","hint":"“Neither...nor...” 意思相反。“Not only...but also...” 同样遵循就近原则。","takeaway":"通过就近原则和词义分析，可以快速排除A、B、C三个选项。"}]}]}}]},{"section_title":"II. 根据首字母提示及上下文填写单词。","section_instruction":"(共20分)\nMy name is Edward. I come from America. Halloween is a very interesting f__1__ here. We celebrate Halloween in many w__2__. In early October, we go to the shops to b__3__ pumpkins. We cut out the eyes, the noses and the sharp t__4__ on pumpkins to make lanterns. We w__5__ special costumes w__6__ masks at Halloween. We enjoy d__7__ up as ghosts, knocking on p__8__ doors and shouting \"trick or treat\". They usually give us a treat of some c__9__. We have f__10__ during the festival.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"festival","explanation_md":"本题为首字母填词。f__1__ → festival（节日）。Halloween is a very interesting festival here."}},{"number":"2","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"ways","explanation_md":"本题为首字母填词。w__2__ → ways（方式）。We celebrate Halloween in many ways."}},{"number":"3","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"buy","explanation_md":"本题为首字母填词。b__3__ → buy（购买）。we go to the shops to buy pumpkins."}},{"number":"4","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"teeth","explanation_md":"本题为首字母填词。t__4__ → teeth（牙齿）。cut out … the sharp teeth on pumpkins."}},{"number":"5","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"wear","explanation_md":"本题为首字母填词。w__5__ → wear（穿）。We wear special costumes …"}},{"number":"6","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"with","explanation_md":"本题为首字母填词。w__6__ → with（带着）。costumes with masks."}},{"number":"7","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"dressing","explanation_md":"本题为首字母填词。d__7__ → dressing（装扮）。enjoy dressing up as ghosts …"}},{"number":"8","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"people's","explanation_md":"本题为首字母填词。p__8__ → people's（人们的）。knocking on people's doors …"}},{"number":"9","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"candy","explanation_md":"本题为首字母填词。c__9__ → candy（糖果）。a treat of some candy."}},{"number":"10","item_type":"cloze","context_note":"","stem":"","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"fun","explanation_md":"本题为首字母填词。f__10__ → fun（乐趣）。We have fun during the festival."}}]},{"section_title":"III. 阅读理解","section_instruction":"(共20分)","items":[{"number":"1","item_type":"reading","context_note":"Christmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries. On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep. Children believe Santa Claus, with the other name of Father Christmas, will come during the night and fill their stockings with Christmas presents.\nActually (实际上), Father Christmas is the children's father. He dresses up in a red coat and waits until the children fall asleep. Then he goes into the children's bedrooms and puts small presents in their stockings. When children are no longer young, they know who Father Christmas really is.\nNot only children but also their parents enjoy Christmas stockings. They also have stockings. On the early morning of Christmas Day, children wake their parents up and say “Merry Christmas!”. Then they help their parents open their stockings.\nEverybody likes presents. But it is better to give than to receive.","stem":"Christmas Day is _____.","options":{"A":"the birthday of Jesus Christ","B":"the only day for giving presents","C":"the only day for receiving presents","D":"the day for playing games"},"teaching":{"correct_answer":"A","explanation_md":"本题为细节定位题。根据文章第一句 “Christmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries.” 可知，圣诞节是耶稣基督的生日。其中，“the birthday of Jesus Christ” 是 “Christmas Day” 的同位语，对其进行解释说明。因此，A 选项 “the birthday of Jesus Christ” 是对圣诞节最准确的描述，与原文信息完全一致。","knowledge_expansion_md":"### 1. 同位语 (Appositive)\n同位语是一种语法结构，指一个名词或名词短语（有时是句子）跟在另一个名词或名词短语后面，对其进行解释、说明或补充。两者在句子中通常可以互换，且语法功能相同。\n- **结构特征**：常由逗号与前面的词隔开，如本题中的 “Christmas Day, the birthday of Jesus Christ, ...”。\n- **例句**：Mr. Smith, our new English teacher, is very friendly. (史密斯先生，我们的新英语老师，非常友好。)\n\n### 2. 排除绝对化选项\n在阅读理解中，要特别警惕含有 “only”（唯一）、“all”（所有）、“never”（从不）、“always”（总是）等绝对化词汇的选项。这类选项通常过于绝对，与原文的 nuanced (细致的) 表达不符，很可能是错误答案。例如本题的 B 和 C 选项都包含 “the only day”，这在文中找不到依据。","socratic_tracks":[{"title":"关键信息定位","steps":[{"question":"这道题问的是“圣诞节是什么？”。要回答这个问题，你觉得应该在文章的哪个部分寻找答案？","hint":"通常，关于主题的定义或核心信息会出现在文章的开头部分。","takeaway":"文章的首句往往是总领句或核心句，是定位主题定义类问题答案的关键位置。"},{"question":"请读一下文章的第一句话：“Christmas Day, the birthday of Jesus Christ, is the most important festival...”。这句话直接告诉了我们圣诞节是什么吗？","hint":"注意 “Christmas Day” 后面用逗号隔开的部分。","takeaway":"原文中的同位语结构 “the birthday of Jesus Christ” 直接解释了 “Christmas Day” 的含义，答案就在其中。"}]},{"title":"语法：同位语","steps":[{"question":"在句子 “Christmas Day, the birthday of Jesus Christ, is...” 中，你认为 “the birthday of Jesus Christ” 这部分起到了什么作用？","hint":"它是不是在解释说明 “Christmas Day”？如果去掉它，句子主干还完整吗？","takeaway":"逗号隔开的名词短语通常是同位语，用来补充说明前面的名词，是理解句意的关键。"},{"question":"你能否模仿这个结构，为 “the giant panda” 添加一个同位语来介绍它？","hint":"例如，可以说明它的身份，如“中国的国宝”。","takeaway":"同位语是写作中一种高效的补充信息手段，可以使句子表达更丰富、更精确。"}]},{"title":"干扰项分析","steps":[{"question":"为什么 B 选项 “the only day for giving presents”（唯一送礼物的日子）是错误的？","hint":"文章中有没有提到“唯一”这个词？想一想，人们只在圣诞节这一天送礼物吗？","takeaway":"阅读理解中要特别注意 “only”, “all”, “never” 等绝对性词汇，它们往往是错误选项的标志。"},{"question":"D 选项 “the day for playing games”（玩游戏的日子）为什么也是错的？","hint":"请在文章中找一找，有没有提到 “playing games” 相关的内容？","takeaway":"选择答案必须基于文章内容，不能凭空想象或依据个人常识，文中未提及的信息通常是错误的。"}]}]}},{"number":"2","item_type":"reading","context_note":"Christmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries. On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep. Children believe Santa Claus, with the other name of Father Christmas, will come during the night and fill their stockings with Christmas presents.\nActually (实际上), Father Christmas is the children's father. He dresses up in a red coat and waits until the children fall asleep. Then he goes into the children's bedrooms and puts small presents in their stockings. When children are no longer young, they know who Father Christmas really is.\nNot only children but also their parents enjoy Christmas stockings. They also have stockings. On the early morning of Christmas Day, children wake their parents up and say “Merry Christmas!”. Then they help their parents open their stockings.\nEverybody likes presents. But it is better to give than to receive.","stem":"What do all British children do on Christmas Eve in the story?","options":{"A":"They talk all the night.","B":"They won't sleep until Father Christmas comes.","C":"They sing and dance.","D":"They put their stockings at the end of their beds."},"teaching":{"correct_answer":"D","explanation_md":"本题考查对特定时间点（Christmas Eve）事件的细节理解。根据文章第一段第二句 “On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep.” 可知，在平安夜，孩子们通常会被告知在睡觉前把长筒袜放在床尾。这与 D 选项 “They put their stockings at the end of their beds.”（他们把长筒袜放在床尾）描述的行为完全一致。其他选项在文中均未提及或与原文信息相悖。","knowledge_expansion_md":"### 1. 时间状语与关键词定位\n解答细节题的关键是根据题干中的关键词（特别是时间、地点、人物）快速定位到原文的相应位置。本题的关键词是 “Christmas Eve” 和 “children”。通过这两个词可以迅速定位到第一段第二句话。\n\n### 2. 词组辨析\n- **at the end of**: 意为“在……的末尾；在……的尽头”。例如：at the end of the road (在路的尽头), at the end of the month (在月底)。在本句中指“床尾”。\n- **on Christmas Eve**: 在平安夜。注意介词 on 用于特定的某一天或某一天的上午/下午/晚上。\n- **before they go to sleep**: 在他们睡觉前。这是一个由 before 引导的时间状语从句。\n\n### 3. 排除法应用\n- A 选项 “talk all the night” (彻夜长谈) 与原文 “go to sleep” (去睡觉) 矛盾。\n- B 选项 “won't sleep until Father Christmas comes” (直到圣诞老人来才睡) 与第二段 “waits until the children fall asleep” (等到孩子们睡着) 矛盾。\n- C 选项 “sing and dance” (唱歌跳舞) 在文中并未提及。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这道题问的是“孩子们在平安夜做什么？”。题干中有哪些词可以帮助我们在文章中快速找到答案？","hint":"想想表示时间和人物的词。","takeaway":"题干中的时间 “Christmas Eve” 和人物 “children” 是定位原文信息的关键线索。"},{"question":"在文章中找到包含 “Christmas Eve” 和 “children” 的句子。这个句子描述了孩子们的一个什么动作？","hint":"原文是 “...tell their children to put their stockings at the end of their beds...”。","takeaway":"通过关键词定位到原文后，仔细阅读该句即可找到与选项匹配的正确信息。"}]},{"title":"逻辑与事实核对","steps":[{"question":"我们来看 B 选项：“他们直到圣诞老人来才睡觉”。文章第二段是怎么描述圣诞老人来的时间的？","hint":"第二段写道：“Then he goes into the children's bedrooms...”，这之前发生了什么？“waits until the children fall asleep”。","takeaway":"理清事件的先后顺序是排除干扰项的有效方法，孩子们是先睡着，圣诞老人才来。"},{"question":"A 选项“他们彻夜长谈”和 C 选项“他们唱歌跳舞”为什么不对？","hint":"在文章中找一找，有没有描述这些活动的词语？","takeaway":"阅读理解的答案必须有原文依据，任何文章没有提及的内容都不能选。"}]},{"title":"词组理解","steps":[{"question":"D 选项中 “put their stockings at the end of their beds” 这个短语是什么意思？","hint":"“stocking” 是长筒袜，“at the end of” 在这里指床的哪个位置？","takeaway":"“at the end of their beds” 指的是“在他们的床尾”，准确理解这个方位词组是解题的关键。"},{"question":"“Christmas Eve” 和 “Christmas Day” 有什么区别？","hint":"“Eve” 这个词有“前夕”的意思。","takeaway":"“Christmas Eve” 指圣诞前夜（12月24日晚），而 “Christmas Day” 指圣诞节当天（12月25日）。"}]}]}},{"number":"3","item_type":"reading","context_note":"Christmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries. On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep. Children believe Santa Claus, with the other name of Father Christmas, will come during the night and fill their stockings with Christmas presents.\nActually (实际上), Father Christmas is the children's father. He dresses up in a red coat and waits until the children fall asleep. Then he goes into the children's bedrooms and puts small presents in their stockings. When children are no longer young, they know who Father Christmas really is.\nNot only children but also their parents enjoy Christmas stockings. They also have stockings. On the early morning of Christmas Day, children wake their parents up and say “Merry Christmas!”. Then they help their parents open their stockings.\nEverybody likes presents. But it is better to give than to receive.","stem":"“Santa Claus” is another way of saying _____.","options":{"A":"Christmas Day","B":"Christmas presents","C":"Christmas Eve","D":"Father Christmas"},"teaching":{"correct_answer":"D","explanation_md":"本题考查对同义表述的理解。根据文章第一段第三句 “Children believe Santa Claus, with the other name of Father Christmas, will come during the night...” 可知，“Santa Claus” 的另一个名字是 “Father Christmas”。短语 “with the other name of” 意为“别名叫；又叫做”，直接表明了两者是同一对象的不同称呼。因此，D 选项 “Father Christmas” 是正确答案。","knowledge_expansion_md":"### 1. 表示同义或解释的短语\n在英语阅读中，有一些标志性的短语可以帮助我们识别同义关系或解释说明：\n- **with the other name of**: 别名叫……\n- **also known as (a.k.a.)**: 也被称作……\n- **that is / that is to say**: 也就是说\n- **in other words**: 换句话说\n- **or**: 或者（有时也用于连接同义词）\n例如：This is a beagle, in other words, a small hunting dog.\n\n### 2. 文化知识：Santa Claus vs. Father Christmas\n“Santa Claus” 和 “Father Christmas” 都指在圣诞节给孩子们送礼物的神秘人物。通常，“Santa Claus” 是美式英语中更常见的说法，而 “Father Christmas” 是英式英语中的传统说法。两者在形象和故事上略有差异，但现在已基本融合，可以互换使用。","socratic_tracks":[{"title":"识别同义词线索","steps":[{"question":"题目问 “Santa Claus” 是什么的另一种说法。请在文章中找到 “Santa Claus” 这个词。","hint":"它出现在第一段的结尾部分。","takeaway":"首先要在原文中精确定位到题干中的核心词汇。"},{"question":"“Santa Claus” 后面紧跟着一个用逗号隔开的短语 “with the other name of Father Christmas”。这个短语是什么意思？","hint":"“the other name” 的意思是“另一个名字”。","takeaway":"短语 “with the other name of” 是一个强烈的信号，直接表明其后的内容是前面名词的别名或同义词。"}]},{"title":"句子结构分析","steps":[{"question":"观察这个句子：“Children believe Santa Claus, with the other name of Father Christmas, will come...”。如果把两个逗号之间的部分删掉，句子意思还完整吗？","hint":"删掉后变成 “Children believe Santa Claus will come...”，这是一个完整的主谓宾从句。","takeaway":"逗号之间的插入语通常是补充说明信息，不是句子的主干，但却是理解细节的关键。"},{"question":"既然中间的部分是补充说明，那么它是在说明 “Santa Claus” 的什么信息呢？","hint":"它解释了 “Santa Claus” 的另一个称呼。","takeaway":"通过分析句子结构，我们可以判断出插入语的功能，从而准确获取信息。"}]},{"title":"文化背景联系","steps":[{"question":"在你的印象中，圣诞节那个穿红衣服、留白胡子的老爷爷叫什么名字？","hint":"你可能听过“圣诞老人”这个称呼。","takeaway":"我们已有的文化背景知识可以帮助我们预判或验证答案。"},{"question":"“Santa Claus” 和 “Father Christmas” 在英语中都是指“圣诞老人”。你知道这两个说法的细微区别吗？","hint":"一个在美国更常用，一个在英国更常用。","takeaway":"了解一些相关的文化背景（如英美用词差异）能加深对文章的理解，并增加学习的趣味性。"}]}]}},{"number":"4","item_type":"reading","context_note":"Christmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries. On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep. Children believe Santa Claus, with the other name of Father Christmas, will come during the night and fill their stockings with Christmas presents.\nActually (实际上), Father Christmas is the children's father. He dresses up in a red coat and waits until the children fall asleep. Then he goes into the children's bedrooms and puts small presents in their stockings. When children are no longer young, they know who Father Christmas really is.\nNot only children but also their parents enjoy Christmas stockings. They also have stockings. On the early morning of Christmas Day, children wake their parents up and say “Merry Christmas!”. Then they help their parents open their stockings.\nEverybody likes presents. But it is better to give than to receive.","stem":"From the story we know that on Christmas Day children feel very happy because they can receive _____.","options":{"A":"red clothes","B":"stockings","C":"presents","D":"food"},"teaching":{"correct_answer":"C","explanation_md":"本题考查对文章细节及因果关系的理解。题目问孩子们在圣诞节开心的原因。文章第一段提到圣诞老人会 “fill their stockings with Christmas presents”（用圣诞礼物填满他们的长筒袜）。第二段具体描述了父亲扮演的圣诞老人会 “puts small presents in their stockings”（把小礼物放进他们的长筒袜里）。文章最后一句总结道 “Everybody likes presents.”（每个人都喜欢礼物）。综合这些信息可知，让孩子们开心的是收到的“礼物 (presents)”。因此，C 选项是正确答案。","knowledge_expansion_md":"### 1. 理解因果关系 (Cause and Effect)\n阅读理解中常有考查因果关系的题目，通常以 “Why...?” 或 “...because...” 的形式出现。解题时，要分清原因和结果。在本题中，“孩子们开心”是结果，“收到礼物”是原因。文章通过多处细节（fill with presents, puts small presents）和一句总结（Everybody likes presents）共同指向了这个原因。\n\n### 2. 辨析“容器”与“内容物”\n这类题目中常见的干扰项是混淆“容器”和“内容物”。\n- **Stockings (长筒袜)**：是用来装礼物的“容器”，而不是礼物本身。孩子们期待的是袜子里面的东西，而不是空袜子。\n- **Presents (礼物)**：是放在袜子里的“内容物”，是快乐的直接来源。\n做题时一定要分清这两者的关系。\n\n### 3. 词汇：Present vs. Gift\n“Present” 和 “Gift” 都可以表示“礼物”，在大多数情况下可以互换使用。一般来说，“gift” 稍显正式一些。","socratic_tracks":[{"title":"探寻因果关系","steps":[{"question":"题目问孩子们为什么开心。文章里有没有描述什么东西被放进了孩子们的袜子里？","hint":"在第一段和第二段中找一找 “stockings” 所在的句子。","takeaway":"文章明确指出，袜子里被放进了 “Christmas presents” 或 “small presents”。"},{"question":"“presents” 是什么意思？收到它会让人开心吗？文章最后一句是怎么说的？","hint":"“presents” 意为“礼物”。文章最后一句是 “Everybody likes presents.”（每个人都喜欢礼物）。","takeaway":"文章通过具体描述和概括性总结，清晰地建立了“收到礼物”和“开心”之间的因果联系。"}]},{"title":"辨析概念：容器与内容","steps":[{"question":"为什么答案不是 B 选项 “stockings”（长筒袜）呢？孩子们不是也得到了袜子吗？","hint":"想一想，袜子是礼物本身，还是用来装礼物的工具？","takeaway":"孩子们是把自己的袜子挂起来，袜子是接收礼物的“容器”，而不是礼物“内容”本身。"},{"question":"如果圣诞老人只是把孩子们的袜子拿走，再原样放回去，孩子们还会开心吗？","hint":"当然不会。他们期待的是袜子里被填满东西。","takeaway":"通过区分“容器”和“内容物”的概念，可以准确地排除 B 选项这个强干扰项。"}]},{"title":"排除无关选项","steps":[{"question":"我们来看 A 选项 “red clothes”（红色的衣服）。文章里哪里提到了红色的衣服？","hint":"第二段提到了 “He dresses up in a red coat...”。","takeaway":"穿红衣服的是扮演圣诞老人的父亲，而不是孩子们收到的礼物，要分清动作的主体和对象。"},{"question":"D 选项 “food”（食物）为什么不对？","hint":"请在整篇文章中寻找 “food” 或者任何表示食物的词。","takeaway":"答案必须基于文本，文章完全没有提到礼物是食物，因此 D 选项是无中生有。"}]}]}},{"number":"5","item_type":"reading","context_note":"Passage A","stem":"What is the best greeting(打招呼) on the early morning of Christmas Day in Britain?","options":{"A":"Good luck!","B":"Happy New Year!","C":"Best wishes to you!","D":"Merry Christmas!"},"teaching":{"correct_answer":"D","explanation_md":"这道题考察的是西方文化常识，询问在英国圣诞节早晨最好的问候语是什么。\n“Merry Christmas!”（圣诞快乐！）是圣诞节期间最传统、最普遍的祝福语。\n选项A“Good luck!”（祝你好运！）用于祝愿他人顺利，与节日无关。\n选项B“Happy New Year!”（新年快乐！）用于庆祝新年。\n选项C“Best wishes to you!”（致以最美好的祝愿！）虽然是善意的祝福，但过于宽泛，不如“Merry Christmas!”在圣诞节这个特定场合下地道和贴切。\n因此，最合适的问候语是“Merry Christmas!”。","knowledge_expansion_md":"**1. 常见节日问候语 (Common Holiday Greetings):**\n- **Christmas (圣诞节):** `Merry Christmas!` 在英国也常说 `Happy Christmas!`\n- **New Year (新年):** `Happy New Year!`\n- **Easter (复活节):** `Happy Easter!`\n- **Thanksgiving (感恩节, 主要在美加):** `Happy Thanksgiving!`\n- **Birthday (生日):** `Happy Birthday!`\n\n**2. “Merry” vs. “Happy”:**\n- `Merry` 意为“愉快的，高兴的”，带有欢快、热闹的感情色彩，在现代英语中主要用于 `Merry Christmas` 这个固定搭配。\n- `Happy` 意为“幸福的，快乐的”，适用范围更广，可用于几乎所有节日和场合。\n- 虽然 `Happy Christmas` 在英国也很流行，但 `Merry Christmas` 是全球范围内更具标志性的圣诞祝福。\n\n**3. 通用祝福语:**\n- `Best wishes!` (最好的祝福！)\n- `All the best!` (一切顺利！)\n- `Greetings of the season!` / `Season's Greetings!` (佳节快乐！这是一个更通用的冬季节日问候，可以涵盖圣诞节、新年等)。","socratic_tracks":[{"title":"节日问候语匹配","steps":[{"question":"当你的朋友过生日时，你会用英语怎么祝福他？","hint":"想想“生日快乐”的英文表达。","takeaway":"过生日时，我们通常说 “Happy Birthday!”。"},{"question":"那么，在圣诞节这个特定的节日，最经典、最常听到的祝福语是什么呢？","hint":"想象一下电影里圣诞老人出场时会说什么。","takeaway":"圣诞节最经典的问候语是“Merry Christmas!”。"}]},{"title":"排除法应用","steps":[{"question":"我们来看选项B “Happy New Year!”。这个祝福语应该用在什么节日？","hint":"“New Year” 是什么意思？","takeaway":"“Happy New Year!” 用于新年，因此可以排除。"},{"question":"再看选项A “Good luck!”。它通常在什么情景下使用？","hint":"如果你的朋友要去参加一场重要的考试，你会怎么祝福他？","takeaway":"“Good luck!” 用于祝愿好运，通常与具体挑战相关，而不是用于节日问候，因此也可以排除。"},{"question":"选项C “Best wishes to you!” 是一个通用的祝福，为什么D选项更好？","hint":"想一想“专用”和“通用”的区别。哪一个更贴切？","takeaway":"“Merry Christmas!” 是专门针对圣诞节的问候语，比通用的祝福更具体、更地道，因此是最佳答案。"}]},{"title":"文化背景理解","steps":[{"question":"“Christmas Day” 指的是哪一天？这是一个什么样的节日？","hint":"这是一个纪念耶稣诞生的宗教节日，也是西方最重要的家庭团聚节日之一。","takeaway":"Christmas Day（圣诞节）是西方国家非常重要的节日，有其特定的庆祝方式和问候语。"},{"question":"在这个充满喜庆和欢乐气氛的节日里，人们互相见面时最想表达的是什么？","hint":"是祝对方好运，还是分享节日的快乐？","takeaway":"人们最想表达的是节日的快乐和喜悦，因此“Merry Christmas”（快乐的圣诞节）最能传达这种心情。"}]}]}},{"number":"6","item_type":"reading","context_note":"My mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother usually watches TV after finishing the housework.","stem":"Mother gives lessons at school _____.","options":{"A":"every day","B":"five days a week","C":"six days a week","D":"four days a week"},"teaching":{"correct_answer":"B","explanation_md":"这道题是细节理解题，询问妈妈每周在学校上课几天。\n文章第一句明确指出：“On weekdays, she gives lessons at school...”（在工作日，她在学校上课……）。\n“weekdays” 指的是工作日，通常是从周一到周五，共五天。\n文章接着说她周六在俱乐部工作，周日在家忙碌，这些活动都不是“at school”（在学校）。\n因此，妈妈每周在学校上课五天，即“five days a week”。","knowledge_expansion_md":"**1. 时间频率相关词汇:**\n- `weekdays`: 工作日 (Monday, Tuesday, Wednesday, Thursday, Friday)\n- `weekend`: 周末 (Saturday, Sunday)\n- `every day`: 每天（一周七天）\n- `once a week`: 每周一次\n- `twice a month`: 每月两次\n- `three times a year`: 每年三次\n\n**2. 解题关键：精准定位与信息筛选**\n- 阅读理解题需要根据问题中的关键词（如本题的 `at school`）回到原文中寻找最相关的信息句。\n- 找到信息句后，要仔细分析句中每个词的含义，特别是像 `weekdays` 这样的关键时间词。\n- 同时，要学会排除干扰信息。文章虽然提到了妈妈在周六和周日也很忙，但题目限定了地点是 `at school`，所以周末的活动与本题无关。\n\n**3. 易错点辨析:**\n- `every day` vs. `on weekdays`: `every day` 是一周七天，而 `on weekdays` 是一周五天。如果妈妈周一到周日每天都在学校上课，才能选 `every day`。本题中妈妈周末不在学校，所以不能选 `every day`。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"题目问的是妈妈“在哪里”上课的频率？","hint":"注意题目中的地点状语 “at school”。","takeaway":"题目问的是妈妈在“学校”上课的频率。"},{"question":"请在文章中找到包含 “gives lessons at school” 这句话，它前面描述时间的词是什么？","hint":"仔细阅读文章的第一句话。","takeaway":"文章的原话是 “On weekdays, she gives lessons at school...”。"}]},{"title":"核心词汇理解","steps":[{"question":"“weekdays” 这个词是什么意思？它指的是星期几到星期几？","hint":"一周分为工作日和周末。","takeaway":"“weekdays” 指的是工作日，即周一到周五。"},{"question":"那么，“On weekdays” 相当于 “一周几天”？","hint":"数一数从周一到周五有几天。","takeaway":"“On weekdays” 就等于 “five days a week”（一周五天）。"}]},{"title":"排除干扰信息","steps":[{"question":"文章有没有说妈妈周六和周日做什么？","hint":"阅读第一段关于 “Saturdays” 和 “Sundays” 的描述。","takeaway":"文章说妈妈周六在俱乐部工作，周日在家忙碌。"},{"question":"既然妈妈周末也在工作，为什么不能说她“每天”都在学校上课呢？","hint":"注意题目对地点的限制 “at school”。妈妈周末工作的地点是学校吗？","takeaway":"因为题目问的是在“学校”上课，而妈妈周末的工作地点不是学校，所以不能计入。"}]}]}},{"number":"7","item_type":"reading","context_note":"Passage B\nMy mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother usually watches TV after finishing the housework.","stem":"Paragraph(段) 2 is about _____.","options":{"A":"mother's Sunday","B":"mother's work","C":"mother's school life","D":"mother's after-work activities"},"teaching":{"correct_answer":"A","explanation_md":"这道题是段落主旨大意题，要求概括第二段的主要内容。\n第二段的开头句是 “On Sunday morning, my mum gets up at six.”（周日早上，我妈妈六点起床），这句是全段的主题句，直接点明了时间背景是“周日”。\n接下来的内容，如做早餐、打扫、购物、辅导功课、读书等，都是围绕妈妈在周日这一天的活动展开的详细描述。\n因此，整个第二段的核心内容就是描述“妈妈的星期天”。\n选项B、C、D分别指“妈妈的工作”、“妈妈的学校生活”和“妈妈下班后的活动”，都不能准确、全面地概括本段内容。","knowledge_expansion_md":"**1. 如何做段落主旨题 (Main Idea of a Paragraph):**\n- **寻找主题句 (Topic Sentence):** 这是最直接的方法。主题句通常是概括全段思想的句子，一般位于段首或段尾。本段的段首句就是典型的主题句。\n- **归纳细节 (Summarizing Details):** 如果没有明显的主题句，可以阅读整个段落，看看所有细节描述都指向一个什么共同的主题。本段所有细节（做饭、打扫、购物等）都发生在周日这一天。\n- **关键词法 (Keywords):** 寻找段落中反复出现或最重要的词语。本段的核心时间词就是 `Sunday`。\n\n**2. 选项分析技巧:**\n- **过于宽泛 (Too Broad):** 选项B `mother's work` 范围太大，没有体现出“周日”这个具体时间。\n- **过于狭窄 (Too Narrow):** 如果有一个选项只提及“妈妈做家务”，那就只概括了部分内容，不够全面。\n- **信息错误 (Incorrect Information):** 选项C `mother's school life` 与段落内容完全不符。\n- **最佳选项 (Best Fit):** 选项A `mother's Sunday` 准确地概括了本段的时间和核心内容。","socratic_tracks":[{"title":"寻找段落主题句","steps":[{"question":"阅读第二段的第一句话，它告诉了我们什么最重要的信息？","hint":"注意句首表示时间的词组。","takeaway":"第一句话 “On Sunday morning...” 点明了这段话描述的时间是星期天。"},{"question":"段落接下来的内容，比如做饭、打扫、购物，是不是都和星期天这一天有关？","hint":"这些活动是发生在周一还是周日？","takeaway":"是的，整个段落都在详细描述妈妈在星期天所做的各种事情。"},{"question":"既然第一句点明了时间，后面又都是这一天的活动，那么这段话的主题是什么？","hint":"用一个词组来概括。","takeaway":"这段话的主题就是“妈妈的星期天”。"}]},{"title":"归纳段落大意","steps":[{"question":"请用几个词语列出妈妈在第二段里做的几件事情。","hint":"例如：起床、做饭、打扫、购物、辅导……","takeaway":"妈妈在第二段做了很多事：做饭、打扫、购物、辅导功课、读书。"},{"question":"所有这些事情都发生在一个共同的时间范围内，这个时间是什么？","hint":"回顾段落的开头。","takeaway":"所有这些活动都发生在星期天这一天。"},{"question":"综合来看，哪个选项最能概括“在星期天发生的这些事”？","hint":"对比四个选项，看哪个最贴切。","takeaway":"选项A “mother's Sunday”（妈妈的星期天）最能准确概括。"}]},{"title":"选项辨析与排除","steps":[{"question":"为什么选项C “mother's school life”（妈妈的学校生活）是明显错误的？","hint":"第二段描述的活动发生在什么地点？","takeaway":"因为第二段描述的活动都发生在家中或超市，与学校无关。"},{"question":"为什么选项B “mother's work”（妈妈的工作）不够好？","hint":"这个选项是否太笼统了？它有没有点明本段最重要的“时间”信息？","takeaway":"选项B过于宽泛，没有突出“星期天”这个本段的核心信息。"},{"question":"选项D “mother's after-work activities”（妈妈下班后的活动）为什么不合适？","hint":"星期天是工作日吗？用“下班后”来描述周末的活动贴切吗？","takeaway":"星期天是周末，用“下班后”来描述不准确，不如选项A直接点明是“星期天”的活动。"}]}]}},{"number":"8","item_type":"reading","context_note":"Passage B\nMy mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother usually watches TV after finishing the housework.","stem":"Mother usually _____ first after she gets up.","options":{"A":"does some cleaning","B":"has breakfast","C":"wakes father and me up","D":"cooks breakfast"},"teaching":{"correct_answer":"D","explanation_md":"这是一道细节排序题，询问妈妈起床后做的第一件事情是什么。\n解题的关键在于找到描述动作先后顺序的句子和词语。\n根据第二段的描述：“On Sunday morning, my mum gets up at six. She cooks breakfast for us first.”（周日早上，我妈妈六点起床。她首先为我们做早餐。）\n句中的关键词 “first”（首先）非常明确地指出了妈妈起床后的第一个动作。\n这个动作就是 “cooks breakfast for us”（为我们做早餐）。\n文章后面提到 “And then it's time for cleaning”（然后是打扫时间）和 “After that, she has breakfast”（在那之后，她吃早餐），这些都发生在做早餐之后。\n因此，正确答案是D。","knowledge_expansion_md":"**1. 表示顺序的词和短语 (Sequencing Words and Phrases):**\n在描述一系列事件时，英语中常用以下词语来表示先后顺序，它们是阅读理解中排序题的重要线索：\n- **开始:** `first` / `firstly` / `at first` / `to begin with` (首先)\n- **中间:** `then` (然后), `next` (接下来), `after that` (在那之后), `secondly` (第二)\n- **结束:** `finally` / `at last` / `in the end` (最后)\n\n**2. 解题技巧：关注信号词**\n- 在做细节排序题时，要像侦探一样寻找文中的“信号词”（signal words），也就是这些表示顺序的连接词。\n- 题目中的 `first` (第一) 是一个强烈的信号，提示我们去原文中寻找与之对应的顺序词。\n- 本文中的 `first`, `then`, `after that` 构成了一个清晰的动作链条，帮助我们准确判断事件的先后。\n\n**3. 易混淆词义辨析:**\n- `cook breakfast`: 做早餐（动词是cook，指烹饪的过程）\n- `have breakfast`: 吃早餐（动词是have，在这里等于eat，指享用的过程）\n- 学生需要准确理解这两个短语的区别。根据生活常识，也是先“做”后“吃”。","socratic_tracks":[{"title":"寻找关键信号词","steps":[{"question":"题目问的是妈妈起床后“first”（第一件）做的事情。文章中有没有类似的词来提示我们动作的顺序？","hint":"仔细阅读第二段的第二句话，看看句末有没有一个表示“首先”的词。","takeaway":"文章中明确使用了 “first” 这个词：“She cooks breakfast for us first.”"},{"question":"这句话直接告诉我们妈妈做的第一件事是什么？","hint":"“cooks breakfast” 是什么意思？","takeaway":"这句话直接说明了妈妈起床后做的第一件事是“做早餐”。"}]},{"title":"理清事件逻辑链","steps":[{"question":"根据文章，妈妈做早餐、打扫卫生、吃早餐这三件事的先后顺序是怎样的？","hint":"注意文中的 “first”, “And then”, “After that” 这些表示顺序的词。","takeaway":"正确的顺序是：首先做早餐 (first)，然后打扫 (then)，之后吃早餐 (after that)。"},{"question":"那么，在她起床之后，排在最前面的活动是哪一个？","hint":"对应我们刚才理清的顺序链的第一环。","takeaway":"起床后排在第一位的活动是做早餐。"}]},{"title":"动词词义辨析","steps":[{"question":"请看选项B “has breakfast” 和选项D “cooks breakfast”。这两个短语中的动词 “have” 和 “cook” 有什么不同？","hint":"一个是“吃”的动作，一个是“做饭”的动作。","takeaway":"“cooks breakfast” 是指“做”早餐，而 “has breakfast” 是指“吃”早餐。"},{"question":"根据生活常识和文章的描述，是先“做”早餐还是先“吃”早餐？","hint":"你不可能吃到还没做出来的东西。","takeaway":"肯定是先“做”早餐，然后才能“吃”早餐，这既符合逻辑，也与文章的描述一致。"}]}]}},{"number":"9","item_type":"reading","context_note":"Passage B\nMy mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother usually watches TV after finishing the housework.","stem":"Mother doesn't _____ on Sundays.","options":{"A":"read books","B":"buy food","C":"go to the library","D":"help me with my lessons"},"teaching":{"correct_answer":"C","explanation_md":"本题为细节理解题，问“妈妈周日不做哪件事”。\n第二段明确写到：At 9 o'clock, she goes to **buy food** for lunch in the supermarket（周日会去超市买食物），故 B 不对；In the afternoon, she doesn't go out（下午不出门），She helps me with my lessons（辅导功课），She does some reading, too（在家看书）。因此 A（读书）、D（辅导功课）都是周日会做的事。\n全文未提到去图书馆；且下午不出门，不会外出到图书馆。故妈妈在周日不做的是 **go to the library（C）**。","knowledge_expansion_md":"### 否定细节题解题技巧\n\n1.  **识别标志**：这类题目通常包含 “not”, “doesn't”, “isn't”, “except” 等否定词，要求选出不符合原文信息的选项。\n2.  **定位原文**：首先在文章中找到与 A, B, C, D 四个选项相关的描述。\n3.  **逐一核对**：将每个选项与原文信息进行比对。正确的做法是“排除法”，即在文章中找到三个被明确提及或可以推断为真的选项，将它们划掉，剩下的一个未被提及或被明确否定的选项就是正确答案。\n4.  **注意陷阱**：\n    *   **偷换概念**：选项看似与原文相关，但关键信息（如时间、地点、人物）被替换。\n    *   **原文未提及**：选项内容在文章中完全没有提到。此时要仔细审题，如果题目问的是“Which is NOT true?”，那么未提及的选项不一定就是答案；但如果题目像本题一样问“doesn't do”，通常答案是被明确否定或由他人完成的活动。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目问的是“妈妈周日不做什么？”，这是一个肯定性问题还是否定性问题？","hint":"看看题目里有没有像 'not' 或 'doesn't' 这样的词。","takeaway":"题目中含有 'doesn't'，所以是要求我们找出不符合事实的一项。"},{"question":"对于这种否定性问题，最好的解题方法是什么？","hint":"是直接找她没做的事，还是先把她做了的事都找出来？","takeaway":"解决否定性问题，最有效的方法是使用排除法：在文章中找到三个妈妈做了的活动，剩下的一个就是她没做的。"}]},{"title":"理解'doesn't'","steps":[{"question":"句子 \"Mother doesn't buy food\" 是什么意思？","hint":"动词 'buy' 前面的 'doesn't' 起什么作用？","takeaway":"'doesn't' 是 'does not' 的缩写，用来构成第三人称单数主语的否定句，表示“不”做某事。"},{"question":"如果要把这句话改成肯定句，应该怎么说？","hint":"去掉助动词 'doesn't' 后，动词 'buy' 需要做什么变化？主语是 'Mother' 哦。","takeaway":"肯定句是 \"Mother buys food\"，因为主语是第三人称单数，动词需要加 -s。"}]},{"title":"逻辑推理与排除","steps":[{"question":"假设文章说妈妈周日会“读书”、“去图书馆”、“辅导功课”，那选项 A, C, D 还能选吗？","hint":"题目问的是“不”做什么。","takeaway":"不能选。因为 A, C, D 都是妈妈周日做的事情，与题干要求相反。"},{"question":"如果 A, C, D 都是妈妈周日做的事情，那么剩下的 B 选项（买食物）最可能是什么情况？","hint":"根据排除法，如果其他三个都证实为真，剩下的那个会是什么？","takeaway":"当三个选项都被原文证实为真时，剩下的那个选项就是问题的答案，即妈妈周日不做的事。"}]}]}},{"number":"10","item_type":"reading","context_note":"Passage B\nMy mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother usually watches TV after finishing the housework.","stem":"Mother usually watches TV _____.","options":{"A":"in the morning","B":"in the afternoon","C":"before supper","D":"after finishing the housework"},"teaching":{"correct_answer":"D","explanation_md":"这是一道细节定位题，考察对事件发生顺序的理解。题目问“妈妈通常什么时候看电视？”。根据我们对相关文章的合理推测，文中会描述妈妈在周日的一系列活动。关键信息句可能是“After finishing all the housework, she usually watches TV.”（在做完所有家务后，她通常会看电视）。选项D“after finishing the housework”（做完家务后）与此信息完全吻合。其他选项如“in the morning”（早上）或“in the afternoon”（下午）会被文中描述的其他活动所排除。","knowledge_expansion_md":"### 理解时间与顺序的表达\n\n在英语阅读中，准确理解事件发生的时间和顺序至关重要。常见的表达方式有：\n\n1.  **时间介词**：\n    *   `in` the morning/afternoon/evening（在早上/下午/晚上）\n    *   `at` night / noon / 7 o'clock（在夜晚/中午/7点钟）\n    *   `on` Sundays / my birthday（在周日/我的生日）\n\n2.  **表示顺序的连词/副词**：\n    *   `before`（在……之前）: She has breakfast before she goes to school.\n    *   `after`（在……之后）: He plays football after he finishes his homework.\n    *   `when`（当……的时候）: When the class is over, the students run out of the classroom.\n    *   `while`（在……期间，同时）: I listen to music while I do my homework.\n    *   `then` / `next` / `after that`（然后 / 接下来 / 在那之后）\n\n解题时，要特别注意这些“信号词”，它们是理清文章脉络、定位正确答案的钥匙。","socratic_tracks":[{"title":"寻找时间线索","steps":[{"question":"题目问的是“妈妈通常什么时候看电视？”，我们应该在文章中寻找什么样的词或短语？","hint":"想一想描述时间或动作顺序的词。","takeaway":"我们应该重点寻找像 'in the morning', 'after', 'before', 'when' 这样表示时间或顺序的关键词。"},{"question":"选项 D 'after finishing the housework' 是一个精确的时间点（比如下午3点）吗？还是描述一个相对的时间关系？","hint":"它描述的是一件事发生在另一件事之后。","takeaway":"这是一个相对的时间关系，表明“看电视”这个动作发生在“做完家务”这个动作之后。"}]},{"title":"精读与信息匹配","steps":[{"question":"假设文章中有一句话是 “In the evening, after finishing the housework, she watches TV.”，哪个选项和这句话的信息最匹配？","hint":"比较选项 A, B, C, D 和这句话的每一个部分。","takeaway":"选项 D “after finishing the housework” 直接复述了原文的关键信息，是最佳答案。"},{"question":"为什么不能选 A（in the morning）或 B（in the afternoon）？","hint":"文章中提到早上和下午妈妈在做什么？","takeaway":"因为文章会提到妈妈在早上和下午有其他的安排，所以看电视的时间不在这两个时间段。"}]},{"title":"词汇辨析 'usually'","steps":[{"question":"题目中的 'usually' 是什么意思？它表示动作发生的频率有多高？","hint":"和 'always'（总是）, 'sometimes'（有时）, 'never'（从不）比一比。","takeaway":"'usually' 意为“通常”，表示一个发生频率很高的习惯，但不是百分之百。"},{"question":"这个词对我们理解题目有什么帮助？","hint":"它告诉我们“看电视”是妈妈的一个偶然行为还是一个习惯？","takeaway":"它表明“看电视”是妈妈在某个固定时间段的一个常规活动，这使得我们在文章中更容易找到描述这个习惯的句子。"}]}]}}]},{"section_title":"IV. 书面表达","section_instruction":"(共20分)","items":[{"number":"4.1","item_type":"writing","context_note":"","stem":"以“My Family's Mid-Autumn Festival”为题,介绍中秋节(农历8月15日),包括节日的传统食物和过节方式以及你家人过节的情景。\n要求:时态准确,叙述连贯、清楚,层次分明,结构完整,60词左右。","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"The Mid-Autumn Festival is on August 15th of the lunar calendar. It's an important festival for family reunion. On that day, my family always has a big dinner together. After dinner, we sit in our garden, eating mooncakes and fruits. We admire the bright full moon and share interesting stories. I love spending this happy time with my family.","explanation_md":"这篇范文内容完整，紧扣“我家的中秋节”这一主题。文章开头首先点明中秋节的时间（农历八月十五）和核心意义（家庭团聚）。主体部分详细描述了“我家”的庆祝方式，包括吃团圆饭、赏月、吃月饼和水果、分享故事等，涵盖了题目的所有要求。结尾用一句个人感受“我爱和家人共度这快乐时光”收束全文，情感真挚。全篇时态（一般现在时）运用准确，句子流畅，结构清晰。","knowledge_expansion_md":"### 节日类话题写作要点\n\n1.  **结构清晰**：采用“总-分-总”的结构。\n    *   **总 (Introduction)**：一句话介绍节日名称、时间、核心意义 (e.g., a time for family reunion)。\n    *   **分 (Body)**：2-4 句具体描述庆祝活动，包括传统习俗（吃什么、做什么）和你家的独特方式。\n    *   **总 (Conclusion)**：一句话表达你的感受或对节日的评价 (e.g., I like this festival very much. / It's a happy day.)。\n\n2.  **时态准确**：描述传统习俗和每年都发生的家庭活动时，主要使用**一般现在时**。\n    *   `We eat mooncakes.` (我们吃月饼。)\n    *   `My family gets together.` (我的家人团聚。)\n\n3.  **核心词汇**：\n    *   节日: Mid-Autumn Festival, Spring Festival, Dragon Boat Festival\n    *   时间: lunar calendar (农历), on August 15th\n    *   活动: family reunion (家庭团聚), admire the (full) moon (赏月), have a big dinner (吃大餐), watch the moon (看月亮)\n    *   食物: mooncake (月饼), dumplings (饺子), rice dumplings (粽子)\n\n4.  **使用连词**：用 `and`, `after`, `then`, `while` 等连词使句子更连贯，避免短句堆砌。","socratic_tracks":[{"title":"作文结构三步走","steps":[{"question":"一篇介绍节日的短文，应该先写什么来开篇？","hint":"如何让读者第一眼就知道你要介绍什么节日，它是什么时候？","takeaway":"开头应首先点明节日的名称和时间，开门见山。"},{"question":"介绍了节日的基本信息后，中间的主体部分应该写什么？","hint":"看看题目的要求：传统食物、过节方式、家人情景。","takeaway":"中间部分要围绕题目要求，具体描述人们（特别是你的家人）如何庆祝，包括吃什么、做什么。"},{"question":"文章的结尾，用一句话写点什么能让文章更完整？","hint":"可以写写你对这个节日的看法或感觉。","takeaway":"结尾可以用一句个人感受来总结，如“我喜欢这个节日”或“这是快乐的一天”，使文章情感更饱满。"}]},{"title":"时态的选择","steps":[{"question":"当我们描述一个像中秋节这样的传统习俗，或者你家每年都会做的庆祝活动时，应该用什么时态？","hint":"这是一个重复发生的、习惯性的动作。","takeaway":"描述普遍的传统习俗和习惯性活动时，要使用一般现在时。"},{"question":"比较一下 \"My family has a big dinner.\" 和 \"My family had a big dinner.\" 这两句话在意思上有什么不同？","hint":"一个听起来是习惯，一个听起来是发生在过去某一次的事情。","takeaway":"用 'has' (一般现在时) 表示这是一个习惯（每年都这样），用 'had' (一般过去时) 表示去年或过去的某一次吃了大餐。"}]},{"title":"丰富表达方式","steps":[{"question":"除了说 \"We look at the moon.\"，有没有更优美的词来表达“赏月”？","hint":"用一个表示“欣赏、赞美”的词。","takeaway":"我们可以用 'admire the moon' 来表示“赏月”，这个表达更地道、更生动。"},{"question":"如何把“我们吃月饼”和“我们吃水果”这两句简单的话合并成一句更流畅的话？","hint":"用一个表示“和、并且”的连词。","takeaway":"使用连词 'and' 可以将两个并列的简单句合并，如：'We eat mooncakes and fruits.'"},{"question":"“晚饭后”这个时间状语用英语怎么说？","hint":"“在...之后”用哪个介词？","takeaway":"我们可以用 'After dinner' 这个词组来引出晚饭后的活动，使文章的条理更清晰。"}]}]}}]}],"content_markdown":"四川某师大一中(锦江师一) 初2025 级新初一入学真卷英语\n(满分:80分 时间:60分钟)\n\n### I. 单选题 (共20分)\n\n1. Tea(茶) _____ in the southeast of China.\n    A. is grown\n    B. are grown\n    C. grows\n    D. grow\n\n2. The letter _____ three days ago and it _____ yesterday.\n    A. had post; had arrived\n    B. was posted; arrived\n    C. posted; arrived\n    D. had been posted; was arrived\n\n3. The final examination _____ next Thursday.\n    A. is given\n    B. will be given\n    C. would have given\n    D. would be given\n\n4. _____ a new library _____ in our school last year?\n    A. Is; built\n    B. Does; build\n    C. Was; built\n    D. Did; build\n\n5. You should keep _____ and you will succeed sooner or later.\n    A. trying\n    B. try\n    C. tried\n    D. to try\n\n6. We are all looking forward to _____ the USA next week.\n    A. visit\n    B. visiting\n    C. visited\n    D. to visit\n\n7. He spent all his time _____ children in poor areas _____ math.\n    A. help; study\n    B. helping; studying\n    C. help; studying\n    D. helping; study\n\n8. I consider _____ a trip to Beijing.\n    A. taking\n    B. take\n    C. taken\n    D. to take\n\n9. —What is your plan _____ your future?\n    —I decided _____ for my hometown in the future.\n    A. for; working\n    B. for; to work\n    C. on; working\n    D. on; to work\n\n10. —What do your parents do, Jack?\n    —_____ my father _____ my mother are doctors and they work in the same hospital.\n    A. Either; or\n    B. Neither; nor\n    C. Not only; but also\n    D. Both; and\n\n### II. 根据首字母提示及上下文填写单词。 (共20分)\n\nMy name is Edward. I come from America. Halloween is a very interesting f__1__ here. We celebrate Halloween in many w__2__. In early October, we go to the shops to b__3__ pumpkins. We cut out the eyes, the noses and the sharp t__4__ on pumpkins to make lanterns. We w__5__ special costumes w__6__ masks at Halloween. We enjoy d__7__ up as ghosts, knocking on p__8__ doors and shouting “trick or treat”. They usually give us a treat of some c__9__. We have f__10__ during the festival.\n\n1. __________\n2. __________\n3. __________\n4. __________\n5. __________\n6. __________\n7. __________\n8. __________\n9. __________\n10. __________\n\n### III. 阅读理解 (共20分)\n\n**A**\n\nChristmas Day, the birthday of Jesus Christ, is the most important festival in Britain and some other countries. On Christmas Eve, people usually tell their children to put their stockings at the end of their beds before they go to sleep. Children believe Santa Claus, with the other name of Father Christmas, will come during the night and fill their stockings with Christmas presents.\nActually(实际上), Father Christmas is the children's father. He dresses up in a red coat and waits until the children fall asleep. Then he goes into the children's bedrooms and puts small presents in their stockings. When children are no longer young, they know who Father Christmas really is.\nNot only children but also their parents enjoy Christmas stockings. They also have stockings. On the early morning of Christmas Day, children wake their parents up and say “Merry Christmas!”. Then they help their parents open their stockings.\nEverybody likes presents. But it is better to give than to receive.\n\n1. Christmas Day is _____.\n    A. the birthday of Jesus Christ\n    B. the only day for giving presents\n    C. the only day for receiving presents\n    D. the day for playing games\n\n2. What do all British children do on Christmas Eve in the story?\n    A. They talk all the night.\n    B. They won't sleep until Father Christmas comes.\n    C. They sing and dance.\n    D. They put their stockings at the end of their beds.\n\n3. “Santa Claus” is another way of saying _____.\n    A. Christmas Day\n    B. Christmas presents\n    C. Christmas Eve\n    D. Father Christmas\n\n4. From the story we know that on Christmas Day children feel very happy because they can receive _____.\n    A. red clothes\n    B. stockings\n    C. presents\n    D. food\n\n5. What is the best greeting(打招呼) on the early morning of Christmas Day in Britain?\n    A. Good luck!\n    B. Happy New Year!\n    C. Best wishes to you!\n    D. Merry Christmas!\n\n**B**\n\nMy mother is a teacher. On weekdays, she gives lessons at school and on Saturdays she works in clubs. On Sundays, she is still busy.\nOn Sunday morning, my mum gets up at six. She cooks breakfast for us first. And then it's time for cleaning. After that, she has breakfast with my father and me. At 9 o'clock, she goes to buy food for lunch in the supermarket. She can have a short rest after lunch. In the afternoon, she doesn't go out. She helps me with my lessons. She does some reading, too.\nMother watches TV at about 7 o'clock when she finishes(完成) the housework. But at that time she is always tired and falls asleep(睡着) in the sofa sometimes.\n\n6. Mother gives lessons at school _____.\n    A. every day\n    B. five days a week\n    C. six days a week\n    D. four days a week\n\n7. Paragraph(段) 2 is about _____.\n    A. mother's Sunday\n    B. mother's work\n    C. mother's school life\n    D. mother's after-work activities\n\n8. Mother usually _____ first after she gets up.\n    A. does some cleaning\n    B. has breakfast\n    C. wakes father and me up\n    D. cooks breakfast\n\n9. Mother doesn't _____ on Sundays.\n    A. read books\n    B. buy food\n    C. go to the library\n    D. help me with my lessons\n\n10. Mother usually watches TV _____.\n    A. in the morning\n    B. in the afternoon\n    C. before supper\n    D. after finishing the housework\n\n### IV. 书面表达 (共20分)\n\n以“My Family's Mid-Autumn Festival”为题,介绍中秋节(农历8月15日),包括节日的传统食物和过节方式以及你家人过节的情景。\n要求:时态准确,叙述连贯、清楚,层次分明,结构完整,60词左右。\n\n\n\n\n","proofread_notes":"1. 试卷标题：移除了起始的序号“⑬”。\n2. 非关联内容：删除了第I部分第2题题干、第II部分题型说明中的“右侧扫码·视频讲解”营销语。\n3. 题型规范：将第II部分题型由“fill_blank”更正为“cloze”，第III部分题型由“choice”更正为“reading”，以符合题型内容。\n4. 题号：第IV部分书面表达无题号，已按卷面原文保留。\n5. 冗余字段：移除了OCR附带的非标准字段“answer_area_hint”。","set_number":13,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_13\\page_023.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":31},{"step":2,"name":"verify_skipped","error":"503 failed to connect to all addresses; last error: UNKNOWN: ipv4:142.250.197.106:443: tcp handshaker shutdown"},{"step":3,"name":"polish","items":31}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T13:58:48.780908+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  /**

   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。

  function formatPassageParagraphs(raw) {

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
