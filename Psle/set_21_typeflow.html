<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第21套","exam_meta":{"full_score_text":"满分:45分","time_text":"时间:60分钟","type_cards":[{"sections":[0],"title":"I. 单选题","range_text":"第1-5题"},{"sections":[1],"title":"II. 按要求用适当的介词填空","range_text":"第6-10题"},{"sections":[2],"title":"III. 阅读选择","range_text":"第11-20题"},{"sections":[3],"title":"IV. 任务型阅读","range_text":"第21-22题"},{"sections":[4],"title":"书面表达","range_text":"按要求完成句子第23-26题；第27题"}]},"sections":[{"section_title":"I. 单选题","section_instruction":"(共5分)","items":[{"number":"1","item_type":"choice","context_note":"","stem":"It _____ sunny and warm next Monday.","options":{"A":"will be","B":"is","C":"was","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题考查一般将来时。句中时间状语 next Monday（下周一）表示将来，谓语动词应用一般将来时，其结构为“will + 动词原形”。故选 A。"},"correct_answer":"A"},{"number":"2","item_type":"choice","context_note":"","stem":"—What did you do during the holidays?\n—I _____ many books.","options":{"A":"was reading","B":"readed","C":"read","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题考查一般过去时。根据问句中的 did 可知，对话发生在过去，答语应使用一般过去时。动词 read 的过去式与原形拼写相同，但读音不同。选项 B readed 是错误形式。故选 C。"},"correct_answer":"C"},{"number":"3","item_type":"choice","context_note":"","stem":"I saw _____ interesting bird in a book yesterday.","options":{"A":"a","B":"an","C":"/","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题考查不定冠词的用法。空格后的单词 interesting 以元音音素 /ɪ/ 开头，其前应使用不定冠词 an。故选 B。"},"correct_answer":"B"},{"number":"4","item_type":"choice","context_note":"","stem":"My ruler is _____ than yours.","options":{"A":"long","B":"longer","C":"longest","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题考查形容词的比较级。句中有标志词 than，表示两者之间的比较，应用形容词的比较级形式。long 的比较级是 longer。故选 B。"},"correct_answer":"B"},{"number":"5","item_type":"choice","context_note":"","stem":"They went to the park _____ eight o'clock in the morning.","options":{"A":"of","B":"on","C":"at","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题考查时间介词的用法。在具体的钟点前，应用介词 at。故选 C。"},"correct_answer":"C"}]},{"section_title":"II. 按要求用适当的介词填空","section_instruction":"(共10分)","items":[{"number":"6","item_type":"fill_blank","context_note":"","stem":"Have you got any photos _____ your pet?","options":{},"answer_area_hint":"横线","teaching":{"explanation_md":"本题考查介词的用法。固定搭配 photos of sb./sth. 意为“某人/某物的照片”，表示所属关系。句意：你有你宠物的照片吗？故填 of。"},"correct_answer":["of"]},{"number":"7","item_type":"fill_blank","context_note":"","stem":"What will you do _____ her?","options":{},"answer_area_hint":"横线","teaching":{"explanation_md":"本题考查介词的用法。do sth. for sb. 意为“为某人做某事”。根据句意“你将为她做什么？”，此处应使用 for。故填 for。"},"correct_answer":["for"]},{"number":"8","item_type":"fill_blank","context_note":"","stem":"My birthday is _____ spring.","options":{},"answer_area_hint":"横线","teaching":{"explanation_md":"本题考查时间介词的用法。表示在某个季节，应用介词 in。句意：我的生日在春天。故填 in。"},"correct_answer":["in"]},{"number":"9","item_type":"fill_blank","context_note":"","stem":"She often dances _____ TV programs.","options":{},"answer_area_hint":"横线","teaching":{"explanation_md":"本题考查介词的用法。表示“在……中（参与）”，此处应用介词 in。句意：她经常在电视节目中跳舞。故填 in。"},"correct_answer":["in"]},{"number":"10","item_type":"fill_blank","context_note":"","stem":"Eric is short. Danny is tall. Danny sits _____ Eric.","options":{},"answer_area_hint":"横线","teaching":{"explanation_md":"本题考查方位介词。前文“Eric is short. Danny is tall.”（埃里克矮，丹尼高。）为线索，通常高个子会坐在矮个子后面。表示“在……后面”用介词 behind。句意：丹尼坐在埃里克后面。故填 behind。"},"correct_answer":["behind"]}]},{"section_title":"III. 阅读选择","section_instruction":"(共10分)\n\n**A**\nThe NCP hit China during the Spring Festival of 2020. For several(几个) months, people had to stay at home. Students couldn't go back to school. Workers couldn't go back to the factories. Many people got sick(生病). Doctors, nurses and scientists worked very hard to help them get rid of(摆脱) the NCP. How to protect(保护) yourself from coronavirus(冠状病毒)? You should wear a mask(口罩) in public places, wash your hands frequently, eat healthy food and open the windows to keep the fresh air into the house.\n\n**B**\nA man finds a good bird in a shop. It can talk in twelve languages and sing ten famous songs. The man buys it at once. He pays(支付) 50,000 yuan for it. He sends it to his mother. It's a present for her birthday. The day after his mother's birthday, he talks to his mother on the phone. \"What do you think of the bird, mother?\" he asks. \"Oh, it's very nice to eat. Thank you, son!\"","items":[{"number":"11","item_type":"reading","context_note":"Passage A","stem":"The NCP hit China during the _____ of 2020.","options":{"A":"Spring Festival","B":"Mid-Autumn Festival","C":"summer holiday","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章A第一句“The NCP hit China during the Spring Festival of 2020.”可知，新冠肺炎是在2020年春节期间袭击中国的。故选A。"},"correct_answer":"A"},{"number":"12","item_type":"reading","context_note":"Passage A","stem":"For several months, students couldn't _____.","options":{"A":"stay at home","B":"go back to school","C":"go back to the factory","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章A第三句“Students couldn't go back to school.”可知，在疫情期间，学生们不能返校。故选B。"},"correct_answer":"B"},{"number":"13","item_type":"reading","context_note":"Passage A","stem":"_____ worked very hard to help the sick people.","options":{"A":"Only doctors","B":"Only nurses","C":"Doctors, nurses and scientists","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章A第六句“Doctors, nurses and scientists worked very hard to help them get rid of(摆脱) the NCP.”可知，医生、护士和科学家们努力帮助病人。故选C。"},"correct_answer":"C"},{"number":"14","item_type":"reading","context_note":"Passage A","stem":"You should _____ to protect yourself from coronavirus.","options":{"A":"wash your hands frequently","B":"eat a lot of food","C":"wear a sweater","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章A最后一句中提到的“wash your hands frequently”可知，为了保护自己免受冠状病毒的侵害，应该勤洗手。故选A。"},"correct_answer":"A"},{"number":"15","item_type":"reading","context_note":"Passage A","stem":"You should _____ to keep the fresh air into the house.","options":{"A":"close the windows","B":"open the windows","C":"wear a mask","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章A最后一句“...open the windows to keep the fresh air into the house.”可知，应该打开窗户以保持室内空气清新。故选B。"},"correct_answer":"B"},{"number":"16","item_type":"reading","context_note":"Passage B","stem":"Where does the man find the bird?","options":{"A":"In a restaurant.","B":"In a shop.","C":"At home.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章B第一句“A man finds a good bird in a shop.”可知，这个男人是在一家商店里发现这只鸟的。故选B。"},"correct_answer":"B"},{"number":"17","item_type":"reading","context_note":"Passage B","stem":"How much is the bird?","options":{"A":"5,000 yuan.","B":"50,000 dollars.","C":"50,000 yuan.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章B第三句“He pays(支付) 50,000 yuan for it.”可知，这只鸟价值50,000元。故选C。"},"correct_answer":"C"},{"number":"18","item_type":"reading","context_note":"Passage B","stem":"How many languages can the bird speak?","options":{"A":"Twelve.","B":"Ten.","C":"Two.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章B第二句“It can talk in twelve languages and sing ten famous songs.”可知，这只鸟会说十二种语言。故选A。"},"correct_answer":"A"},{"number":"19","item_type":"reading","context_note":"Passage B","stem":"How may the man feel at last?","options":{"A":"He's happy.","B":"He's excited.","C":"He's sad.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"本题为推理判断题。男人花了50,000元买了一只特别的鸟作为生日礼物送给妈妈，妈妈却把它吃了。可以推断，男人得知后可能会感到伤心。故选C。"},"correct_answer":"C"},{"number":"20","item_type":"reading","context_note":"Passage B","stem":"What does his mother think of the bird?","options":{"A":"It's very nice to eat.","B":"It's very beautiful.","C":"It's very clever.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据文章B最后一句妈妈说的话“Oh, it's very nice to eat.”可知，她认为这只鸟吃起来很美味。故选A。"},"correct_answer":"A"}]},{"section_title":"IV. 任务型阅读","section_instruction":"(共10分)\n\n**Oliver's Travel**\nOliver is an English boy. He studies in a university in London. Last winter holiday, he took a trip in China. It was great fun!\nOn the first day, he flew to Beijing. He went ice-skating in an ice rink(冰场). He fell down for several times, but luckily he didn't hurt. On the second day, he took the No. 811 bus to the Badaling Great Wall. He climbed the Great Wall and took a lot of pictures there. On the third day, he visited the Palace Museum in the morning and Beihai Park in the afternoon. The museum was amazing and the park was beautiful.\nOn the fourth day, he went to Sanya by train. It was hot and sunny in Sanya. The water was warm. He went to the beach to surf(冲浪) and swim. He enjoyed the sunshine and the fresh fruits there very much. After that, he came back home. What a wonderful holiday!","items":[{"number":"21.1","item_type":"reading","context_note":"","stem":"How many cities did Oliver visit in China?","options":{"A":"Two.","B":"Three.","C":"Four.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据原文“he flew to Beijing”和“he went to Sanya by train”可知，Oliver在中国游览了北京和三亚两个城市。故选A。"},"correct_answer":"A"},{"number":"21.2","item_type":"reading","context_note":"","stem":"How did Oliver go to Beijing from London?","options":{"A":"By subway.","B":"By bus.","C":"By plane.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据原文第一段“On the first day, he flew to Beijing.”可知，Oliver是从伦敦乘飞机去北京的。故选C。"},"correct_answer":"C"},{"number":"21.3","item_type":"reading","context_note":"","stem":"What did Oliver do in Beijing?","options":{"A":"He went ice-skating and climbed the Great Wall.","B":"He took pictures and visited the Palace Museum and Beihai Park.","C":"Both A and B.","D":""},"answer_area_hint":"","teaching":{"explanation_md":"根据原文可知，Oliver在北京滑了冰、爬了长城、参观了故宫和北海公园。选项A和B描述的活动都属实，因此选项C“Both A and B”是正确答案。故选C。"},"correct_answer":"C"},{"number":"22.1","item_type":"writing","context_note":"","stem":"When did Oliver take a trip in China?","options":{},"answer_area_hint":"","teaching":{"explanation_md":"根据原文第一段“Last winter holiday, he took a trip in China.”可知，Oliver是在上个寒假去中国旅行的。"},"correct_answer":"Last winter holiday."},{"number":"22.2","item_type":"writing","context_note":"","stem":"Did Oliver go to the beach and park in Sanya?","options":{},"answer_area_hint":"","teaching":{"explanation_md":"根据原文可知，Oliver在三亚去了海滩（went to the beach），但并未提及他在三亚去了公园。他在北京参观了北海公园（Beihai Park）。因此，问题的答案应为否定。故答案为No, he didn't。"},"correct_answer":"No, he didn't."}]},{"section_title":"V. 按要求完成句子","section_instruction":"(共10分)","items":[{"number":"23","item_type":"sentence_transform","context_note":"","stem":"I bought a dictionary yesterday. (改为否定句)\nI _____ a dictionary yesterday.","options":{},"answer_area_hint":"","teaching":{"explanation_md":"本题考查一般过去时态的否定句。原句为一般过去时态的肯定句，其谓语动词为 bought (buy 的过去式)。变为否定句时，需借助助动词 did，并在其后加上 not，同时将谓语动词恢复为原形 buy。因此，句子应改为 I did not buy a dictionary yesterday. 缩写形式为 I didn't buy a dictionary yesterday. 故填 didn't buy。"},"correct_answer":"didn't buy"},{"number":"24","item_type":"sentence_transform","context_note":"","stem":"Lucy watched a film with her friends yesterday. (用 now 改写句子)\nLucy _____ a film with her friends now.","options":{},"answer_area_hint":"","teaching":{"explanation_md":"本题考查时态的转换。原句是一般过去时，时间状语是 yesterday。根据要求，需要用 now 替换 yesterday，因此句子的时态需要变为现在进行时。现在进行时的结构是“be动词 (am/is/are) + 动词-ing形式”。主语 Lucy 是第三人称单数，所以 be 动词用 is，watch 的-ing形式是 watching。故填 is watching。"},"correct_answer":"is watching"},{"number":"25","item_type":"sentence_transform","context_note":"","stem":"John saw a film last Monday. (改为一般疑问句)\n_____ John _____ a film last Monday?","options":{},"answer_area_hint":"","teaching":{"explanation_md":"本题考查一般过去时态的一般疑问句。原句为一般过去时态的肯定句，其谓语动词为 saw (see 的过去式)。变为一般疑问句时，需在句首加助动词 Did，并将谓语动词恢复为原形 see。故第一个空填 Did，第二个空填 see。"},"correct_answer":["Did","see"]},{"number":"26","item_type":"sentence_transform","context_note":"","stem":"Wu Binbin is \u003cu>52 kilograms\u003c/u>. (对画线部分提问)\n_____ is Wu Binbin?","options":{},"answer_area_hint":"","teaching":{"explanation_md":"本题考查对体重提问。画线部分 '52 kilograms' 是表示体重的数量词。对体重提问，应用特殊疑问词组 'How heavy'。因此，句子应为 How heavy is Wu Binbin? 故填 How heavy。"},"correct_answer":"How heavy"},{"number":"27","item_type":"writing","context_note":"","stem":"Why are you tired? (根据自己的实际情况回答)","options":{},"answer_area_hint":"请用 'Because...' 回答。","teaching":{"explanation_md":"本题考查对 'Why' 引导的特殊疑问句进行回答。题目要求根据自身实际情况作答，回答时需说明自己疲劳的原因。常用 'Because...' 句型来回答。例如：Because I did my homework late last night. (因为我昨晚做作业到很晚。) 答案不唯一，符合题意、语法正确即可。"}}]}],"content_markdown":"## 成都某嘉祥外国语学校 初2025级新初一分班真卷英语\n\n**(满分:45分 时间:60分钟)**\n\n### I. 单选题\n(共5分)\n\n1. It _____ sunny and warm next Monday.\n\tA. will be\n\tB. is\n\tC. was\n\n2. —What did you do during the holidays?\n—I _____ many books.\n\tA. was reading\n\tB. readed\n\tC. read\n\n3. I saw _____ interesting bird in a book yesterday.\n\tA. a\n\tB. an\n\tC. /\n\n4. My ruler is _____ than yours.\n\tA. long\n\tB. longer\n\tC. longest\n\n5. They went to the park _____ eight o'clock in the morning.\n\tA. of\n\tB. on\n\tC. at\n\n### II. 按要求用适当的介词填空\n(共10分)\n\n6. Have you got any photos _____ your pet?\n\n7. What will you do _____ her?\n\n8. My birthday is _____ spring.\n\n9. She often dances _____ TV programs.\n\n10. Eric is short. Danny is tall. Danny sits _____ Eric.\n\n### III. 阅读选择\n(共10分)\n\n**A**\nThe NCP hit China during the Spring Festival of 2020. For several(几个) months, people had to stay at home. Students couldn't go back to school. Workers couldn't go back to the factories. Many people got sick(生病). Doctors, nurses and scientists worked very hard to help them get rid of(摆脱) the NCP. How to protect(保护) yourself from coronavirus(冠状病毒)? You should wear a mask(口罩) in public places, wash your hands frequently, eat healthy food and open the windows to keep the fresh air into the house.\n\n**B**\nA man finds a good bird in a shop. It can talk in twelve languages and sing ten famous songs. The man buys it at once. He pays(支付) 50,000 yuan for it. He sends it to his mother. It's a present for her birthday. The day after his mother's birthday, he talks to his mother on the phone. \"What do you think of the bird, mother?\" he asks. \"Oh, it's very nice to eat. Thank you, son!\"\n\n11. The NCP hit China during the _____ of 2020.\n\tA. Spring Festival\n\tB. Mid-Autumn Festival\n\tC. summer holiday\n\n12. For several months, students couldn't _____.\n\tA. stay at home\n\tB. go back to school\n\tC. go back to the factory\n\n13. _____ worked very hard to help the sick people.\n\tA. Only doctors\n\tB. Only nurses\n\tC. Doctors, nurses and scientists\n\n14. You should _____ to protect yourself from coronavirus.\n\tA. wash your hands frequently\n\tB. eat a lot of food\n\tC. wear a sweater\n\n15. You should _____ to keep the fresh air into the house.\n\tA. close the windows\n\tB. open the windows\n\tC. wear a mask\n\n16. Where does the man find the bird?\n\tA. In a restaurant.\n\tB. In a shop.\n\tC. At home.\n\n17. How much is the bird?\n\tA. 5,000 yuan.\n\tB. 50,000 dollars.\n\tC. 50,000 yuan.\n\n18. How many languages can the bird speak?\n\tA. Twelve.\n\tB. Ten.\n\tC. Two.\n\n19. How may the man feel at last?\n\tA. He's happy.\n\tB. He's excited.\n\tC. He's sad.\n\n20. What does his mother think of the bird?\n\tA. It's very nice to eat.\n\tB. It's very beautiful.\n\tC. It's very clever.\n\n### IV. 任务型阅读\n(共10分)\n\n**Oliver's Travel**\nOliver is an English boy. He studies in a university in London. Last winter holiday, he took a trip in China. It was great fun!\nOn the first day, he flew to Beijing. He went ice-skating in an ice rink(冰场). He fell down for several times, but luckily he didn't hurt. On the second day, he took the No. 811 bus to the Badaling Great Wall. He climbed the Great Wall and took a lot of pictures there. On the third day, he visited the Palace Museum in the morning and Beihai Park in the afternoon. The museum was amazing and the park was beautiful.\nOn the fourth day, he went to Sanya by train. It was hot and sunny in Sanya. The water was warm. He went to the beach to surf(冲浪) and swim. He enjoyed the sunshine and the fresh fruits there very much. After that, he came back home. What a wonderful holiday!\n\n21.1. How many cities did Oliver visit in China?\n\tA. Two.\n\tB. Three.\n\tC. Four.\n\n21.2. How did Oliver go to Beijing from London?\n\tA. By subway.\n\tB. By bus.\n\tC. By plane.\n\n21.3. What did Oliver do in Beijing?\n\tA. He went ice-skating and climbed the Great Wall.\n\tB. He took pictures and visited the Palace Museum and Beihai Park.\n\tC. Both A and B.\n\n22.1. When did Oliver take a trip in China?\n\n22.2. Did Oliver go to the beach and park in Sanya?\n\n### V. 按要求完成句子\n(共10分)\n\n23. I bought a dictionary yesterday. (改为否定句)\nI _____ a dictionary yesterday.\n\n24. Lucy watched a film with her friends yesterday. (用 now 改写句子)\nLucy _____ a film with her friends now.\n\n25. John saw a film last Monday. (改为一般疑问句)\n_____ John _____ a film last Monday?\n\n26. Wu Binbin is \u003cu>52 kilograms\u003c/u>. (对画线部分提问)\n_____ is Wu Binbin?\n\n27. Why are you tired? (根据自己的实际情况回答)\n","proofread_notes":"1. **Content Cleanup**: Removed non-academic content including a numerical prefix from the title and promotional text ('右侧扫码·视频讲解') from the Section IV title and question 25 stem. The original paper contained QR codes, which have been omitted.\n2. **Numbering & Structure**: The hierarchical questions in Section IV (e.g., 21 with sub-parts) were flattened into distinct items (21.1, 21.2, etc.) in both the JSON structure and the markdown for consistency.\n3. **Item Type Correction**: Changed `item_type` for questions 22.1 and 22.2 to `writing` to reflect their short-answer nature.\n4. **Schema Compliance**: Normalized all 3-option multiple-choice questions to a 4-option format by adding an empty 'D' option.\n5. **Readability**: Shortened verbose context notes in the reading section (e.g., 'This question is based on Passage A' to 'Passage A').","set_number":21,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_21\\page_037.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":30},{"step":2,"name":"verify","items":30,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":30}]},"second_text_pass":false}}</script>

  function rowsForPaperShard(t) {

      const out = [];

  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {

    const st = sec && String(sec.section_title || "").trim();

  function sectionRowsRenderKind(rows) {

    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        const secIns0 = String(row.section_instruction || "").trim();
        const keyIsLetter = isReadingPassageLetterKey(key);
        while (j < rows.length) {
          const r2 = rows[j];
          if (!isPassageKeyedQuizRow(r2)) break;
          const k2 = readingPassageGroupKey(String(r2.it.context_note || "").trim());
          if (k2 === key) {
            j++;
            continue;
          }
          if (
            !keyIsLetter &&
            isReadingPassageLetterKey(k2) &&
            String(r2.section_instruction || "").trim() === secIns0
          ) {
            j++;
            continue;
          }
          break;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupWritingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "writing") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "writing") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "writing") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupDetailsByReadingPassage(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const row = details[i].row;
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", details: [details[i]] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, details: details.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        const secIns0 = String(row.section_instruction || "").trim();
        const keyIsLetter = isReadingPassageLetterKey(key);
        while (j < details.length) {
          const r2 = details[j].row;
          if (!isPassageKeyedQuizRow(r2)) break;
          const k2 = readingPassageGroupKey(String(r2.it.context_note || "").trim());
          if (k2 === key) {
            j++;
            continue;
          }
          if (
            !keyIsLetter &&
            isReadingPassageLetterKey(k2) &&
            String(r2.section_instruction || "").trim() === secIns0
          ) {
            j++;
            continue;
          }
          break;
        }
        const slice = details.slice(i, j);
        const sliceRows = slice.map((d) => d.row);
        const body = pickReadingPassageBody(sliceRows);
        const ps = passageOrSectionBodyForSlice(
          slice.map((d) => d.row),
          body,
        );
        groups.push({ passage: ps.passage, details: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", details: [details[i]] });
        i++;
      }
    }
    return groups;
  }

  function groupDetailsByWritingPassage(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const row = details[i].row;
      if (row.type !== "writing") {
        groups.push({ passage: "", details: [details[i]] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "writing") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, details: details.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "writing") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = details.slice(i, j);
        const sliceRows = slice.map((d) => d.row);
        const body = pickReadingPassageBody(sliceRows);
        const ps = passageOrSectionBodyForSlice(
          slice.map((d) => d.row),
          body,
        );
        groups.push({ passage: ps.passage, details: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", details: [details[i]] });
        i++;
      }
    }
    return groups;
  }

  function groupFillBlankBySectionInstruction(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const ins = String(rows[i].section_instruction || "").trim();
      let j = i + 1;
      while (j < rows.length && String(rows[j].section_instruction || "").trim() === ins) j++;
      groups.push({ instruction: ins, rows: rows.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function sectionInstructionHasClozeInlineBlanks(ins) {
    const s = String(ins || "");
    if (/\(\d+\)[^_\n\r]*_{3,}/.test(s)) return true;
    if (/[a-zA-Z]?__\d+__/.test(s)) return true;
    return false;
  }

  /** 大题说明里 (53) Y_____ 或 f__1__ 式文中空，小题无 stem、无 A–D（首字母填空等） */
  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !sectionInstructionHasClozeInlineBlanks(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
  }

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;
  }

  function clozeInlineMatchToNum(m0) {
    const a = /^\((\d+)\)/.exec(m0);
    if (a) return a[1];
    const b = /__(\d+)__/.exec(m0);
    return b ? b[1] : "";
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const hits = collectClozeInlineBlankMatches(s);
    let out = "";
    let li = 0;
    hits.forEach((h) => {
      out += esc(s.slice(li, h.i)).replace(/\n/g, "<br>");
      li = h.i + h.len;
      const num = clozeInlineMatchToNum(h.m0);
      const rk = num ? rowByNum[num] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(h.m0).replace(/\n/g, "<br>");
      }
    });
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const hits = collectClozeInlineBlankMatches(s);
    let out = "";
    let li = 0;
    hits.forEach((h) => {
      out += esc(s.slice(li, h.i)).replace(/\n/g, "<br>");
      li = h.i + h.len;
      const num = clozeInlineMatchToNum(h.m0);
      const rk = num ? rowByNum[num] : null;
      out += rk ? "<span class='exam-blank'>&nbsp;</span>" : esc(h.m0).replace(/\n/g, "<br>");
    });
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text'>" + out + "</div>";
  }

  function groupDetailsByClozeSection(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const ins = String(details[i].row.section_instruction || "").trim();
      let j = i + 1;
      while (j < details.length) {
        if (String(details[j].row.section_instruction || "").trim() !== ins) break;
        j++;
      }
      groups.push({ passage: details[i].row.section_instruction || "", details: details.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function clozeAnswerWordFromItem(it) {
    const teach = it.teaching || {};
    const opts = it.options && typeof it.options === "object" ? it.options : {};
    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";
    const caUp = caRaw.toUpperCase().charAt(0);
    if ("ABCDEFG".indexOf(caUp) >= 0) {
      const tx = String(opts[caUp] || "").trim();
      if (tx) return tx;
    }
    return caRaw;
  }

  function clozeNumToAnswerMap(detailsPairs) {
    const map = Object.create(null);
    detailsPairs.forEach(({ row }) => {
      const it = row.it;
      const n = String(it.number || "").trim();
      if (!n) return;
      const w = clozeAnswerWordFromItem(it);
      map[n] = w;
      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
    });
    return map;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^[a-zA-Z]?__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");
        }
        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);
  }

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};
    const seg = (chunk) =>
      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!String(stem || "").trim()) {
      return opt.placeholderParen ? "<p class='stem'>（ ）</p>" : "<p class='stem'></p>";
    }
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;
  }

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：练习/PDF/讲解中整段不展示 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));
  }

  function sectionCardQuestionCount(rows) {
    if (!rows || !rows.length) return 0;
    const eff = sectionRowsRenderKind(rows);
    if (isClozeLikeQuizType(eff)) return visibleClozeQuizRows(rows).length;
    return rows.length;
  }

  /** 全卷连续题号区间（与首页卡片「共 n 道」计数规则一致）；供无 range_text 时使用 */
  function sectionGlobalQuestionRangeLabel(si) {
    let start = 0;
    for (let i = 0; i < si; i++) {
      start += sectionCardQuestionCount(state.bySection["sec:" + i] || []);
    }
    const rows = state.bySection["sec:" + si] || [];
    const cnt = sectionCardQuestionCount(rows);
    if (!cnt) return "";
    const lo = start + 1;
    const hi = start + cnt;
    return lo === hi ? "第 " + lo + " 题" : "第 " + lo + "–" + hi + " 题";
  }

  /** 左侧已有文章的完形/语法填空小题：仅展示纵向 A–D(或含 E…)，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || !isClozeLikeQuizType(row.type)) return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const optLetters = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim());
    if (optLetters.length) return { letters: optLetters, opts: raw };
    if (isClozeLikeQuizType(typ)) {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    /**
     * 阅读 JSON 常把「判断正误」标成 fill_blank + 空 options；大题标题含「阅读」但 section_instruction 未必含「判断」。
     * 有 teaching 答案 T/F，或 context_note 含判断/See Passage 指引时，按客观 T/F 渲染单选，勿用文本框。
     */
    const cnRd = String(it.context_note || "");
    const caRd = String((it.teaching && it.teaching.correct_answer) || "").trim().toUpperCase();
    const tfByTeaching = caRd === "T" || caRd === "F";
    const tfByReadingNote =
      /判断|正误|True\s*\(\s*T|错误的写|正确的写|写\s*["""']?[TFtf]/i.test(cnRd) ||
      /^See\s+Passage\s*[（(]/i.test(cnRd.trim());
    if (
      typ === "fill_blank" &&
      /阅读/.test(String(row.section_title || "")) &&
      stem &&
      !/_{3,}/.test(stem) &&
      (tfByTeaching || tfByReadingNote)
    ) {
      return { letters: ["T", "F"], opts: { T: "T", F: "F" } };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  /** 完形/语法填空练习页：选项自上而下纵向排列 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });

  function quizOptsGridClass(letters, opts) {
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
