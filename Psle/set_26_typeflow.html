<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .reading-sentence-bank-unit { margin-bottom: 1.5rem; }
    .reading-sentence-bank-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-passage-wrap .cloze-passage-text {
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 0;
    }
    .reading-sentence-bank-options-below { margin-top: 1.15rem; }
    .reading-sentence-bank-qhead {
      font-weight: 700;
      font-size: 1.08rem;
      margin: 0 0 0.5rem;
      color: var(--ink);
    }
    .reading-sentence-bank-opt-block { margin-bottom: 0.85rem; }
    .reading-sentence-bank-opts-grid {
      display: flex !important;
      flex-direction: column !important;
      flex-wrap: nowrap !important;
      align-items: stretch !important;
      gap: 0.4rem 0;
      grid-template-columns: unset !important;
      margin: 0 !important;
    }
    .reading-sentence-bank-opts-grid label { margin: 0; }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-passage-block .exam-para {
      margin: 0 0 0.55em;
      text-indent: 2em;
    }
    .exam-passage-block .exam-para:first-child { margin-top: 0; }
    .exam-passage-block .exam-para:last-child { margin-bottom: 0; }
    .exam-word-bank {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px dashed #000;
      font-size: 10.5pt;
      line-height: 1.6;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-passage-block .exam-cloze-inline-pdf {
      margin: 0;
    }
    .exam-passage-block .exam-cloze-inline-pdf .exam-para:last-child {
      margin-bottom: 0;
    }
    .exam-reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      line-height: 1.45;
      margin: 2mm 0 4mm;
    }
    .exam-reading-fill-table th,
    .exam-reading-fill-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
    }
    .exam-reading-fill-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-unit {
      margin-bottom: 4mm;
      break-inside: auto;
      page-break-inside: auto;
    }
    /* 同一题型内：每道小题（题干+选项）尽量不跨页 */
    .exam-item {
      margin: 0 0 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item .exam-item-row,
    .exam-item .exam-opts-row {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item-row {
      display: block;
      margin: 0;
    }
    .exam-n {
      font-weight: 700;
      margin-right: 0.35em;
    }
    .exam-paren { letter-spacing: 0.2em; margin-right: 0.25em; }
    .exam-blank {
      border-bottom: 1px solid #000;
      padding: 0 1.2em;
      margin: 0 0.15em;
    }
    /* 阅读/单选等：默认 2×2；按选项数单列等分对齐 */
    .exam-opts-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 1.5em;
      row-gap: 0.3em;
      margin: 1mm 0 0 2.2em;
      font-size: 10.5pt;
      align-items: start;
    }
    .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
    }
    /* 阅读理解 PDF：选项纵向排列，字母与正文对齐，避免三列过窄、英文被拆字换行 */
    .exam-item-reading .exam-opts-row {
      display: block;
      margin: 1.5mm 0 0 2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-cols-2,
    .exam-item-reading .exam-opts-row.exam-opts-cols-3,
    .exam-item-reading .exam-opts-row.exam-opts-cols-4 {
      display: block;
    }
    .exam-item-reading .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.55em;
      padding: 0;
      line-height: 1.5;
      text-align: left;
      min-width: 0;
    }
    .exam-item-reading .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    .exam-item-reading .exam-opt-chip b {
      margin-right: 0;
      font-weight: 700;
    }
    /* 阅读判断 PDF：与网页一致，横向 T / F */
    .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35em 0.65em;
      margin: 1mm 0 0 2.2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      margin: 1.5mm 0 0 2em;
    }
    .exam-opts-tf-pair .exam-tf-choice {
      font-weight: 700;
      font-size: 11pt;
      min-width: 1.1em;
      text-align: center;
    }
    .exam-opts-tf-pair .exam-tf-slash {
      color: #444;
      font-weight: 600;
      padding: 0 0.2em;
    }
    .exam-reading-sentence-bank-questions {
      margin-top: 4mm;
    }
    .exam-reading-sentence-bank-qnum {
      font-weight: 700;
      font-size: 11pt;
      margin: 0 0 1.5mm;
    }
    .exam-reading-sentence-bank-item {
      margin-bottom: 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-reading-sentence-bank-item .exam-opts-row {
      display: block;
      margin: 0 0 0 1.5em;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.45em;
      line-height: 1.45;
      text-align: left;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    /* 补全对话 PDF：题干已在左侧对话中，不重复「51.（ ）」等题目行，仅题号 + 方框选项 */
    .exam-item-cloze.exam-cloze-dialogue-gap {
      display: block;
    }
    .exam-cloze-dialogue-gap {
      margin: 0.55em 0 0.65em;
    }
    .exam-cloze-dialogue-gap .exam-dialogue-gap-num {
      display: block;
      font-weight: 700;
      margin: 0 0 0.35em 0.15em;
      font-size: 11pt;
    }
    /* 完形 PDF：题号与 A–D 同一行横向排列 */
    .exam-item-cloze {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 1em;
      row-gap: 0.6mm;
    }
    .exam-item-cloze .exam-item-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2em 0.45em;
    }
    .exam-item-cloze .exam-opts-row {
      display: grid;
      column-gap: 0.85em;
      row-gap: 0.2em;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr));
    }
    /* 完形 PDF：整卷表格，题号与 A/B/C 同一行；各题 A 列、B 列、C 列分别左对齐 */
    .exam-cloze-pdf-grid {
      display: grid;
      grid-template-columns: minmax(2.85em, auto) repeat(3, minmax(0, 1fr));
      column-gap: 0.75em;
      row-gap: 0.5em;
      margin: 0.55em 0 0.85em;
      align-items: start;
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-4opt {
      grid-template-columns: minmax(2.85em, auto) repeat(4, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-5opt {
      grid-template-columns: minmax(2.85em, auto) repeat(5, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-6opt {
      grid-template-columns: minmax(2.85em, auto) repeat(6, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-7opt {
      grid-template-columns: minmax(2.85em, auto) repeat(7, minmax(0, 1fr));
    }
    .exam-cloze-pdf-num {
      text-align: left;
      white-space: nowrap;
      font-weight: 600;
    }
    .exam-cloze-pdf-num .exam-n {
      font-weight: 700;
    }
    .exam-cloze-pdf-opt {
      text-align: left;
      min-width: 0;
      line-height: 1.45;
    }
    .exam-cloze-pdf-opt b {
      font-weight: 700;
      margin-right: 0.25em;
    }
    .exam-cloze-pdf-opt-empty {
      visibility: hidden;
      pointer-events: none;
      min-height: 1em;
    }
    .exam-item-cloze .exam-cloze-pdf-grid {
      flex: 1 1 100%;
      width: 100%;
    }
    .exam-item-cloze .exam-opt-chip {
      display: block;
      min-width: 0;
    }
    .exam-opt-chip {
      min-width: 0;
    }
    .exam-paper-doc .phonetic-ul,
    #printHost .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.12em;
      text-decoration-thickness: 0.08em;
      font-weight: 600;
    }
    .exam-opt-chip b { margin-right: 0.25em; }
    .exam-item-cloze .exam-opt-chip b {
      display: inline-block;
      min-width: 1.15em;
      margin-right: 0.2em;
    }
    .exam-answer-lines {
      min-height: 14em;
      margin-top: 2mm;
      border: 1px solid #333;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.45em,
        #ddd 1.45em,
        #ddd calc(1.45em + 1px)
      );
    }
    /* 句型转换、词汇填空等书写题：与客观题区分的标准卷面条目 + 作答横线区 */
    .exam-item-written {
      padding: 0 0 1mm 0;
    }
    .exam-item-written .exam-item-row {
      line-height: 1.55;
      font-size: 10.5pt;
      text-align: justify;
    }
    .exam-written-lines {
      min-height: 4.2em;
      margin: 1.5mm 0 0 0;
      border: 1px solid #222;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.38em,
        #e0e0e0 1.38em,
        #e0e0e0 calc(1.38em + 0.55px)
      );
    }
    .exam-paper-doc .exam-writing-stem-wrap {
      margin: 1.5mm 0 0;
      font-size: 10.5pt;
      line-height: 1.5;
      color: #000;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table,
    #printHost .writing-prompt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      color: #000;
      background: #fff;
      margin: 1mm 0;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table th,
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table td,
    #printHost .writing-prompt-table th,
    #printHost .writing-prompt-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
      text-align: left;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table thead th,
    #printHost .writing-prompt-table thead th {
      background: #eee;
      font-weight: 700;
    }
    .exam-reading-fill-table td.exam-table-stem-cell {
      font-size: 10.5pt;
      line-height: 1.5;
    }
    @media print {
      @page { size: A4; margin: 12mm 14mm; }
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      html.pdf-printing body {
        margin: 0 !important;
        padding: 0 !important;
      }
      html.pdf-printing #printHost {
        clip: auto !important;
      }
      .exam-paper-section:not(:first-of-type) {
        break-before: page !important;
        page-break-before: always !important;
      }
      .exam-passage-titled-wrap {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      /* 完形填空：PDF 不显示答题括号与题干下划线占位 */
      .exam-item-cloze .exam-paren,
      .exam-item-cloze .exam-blank,
      .exam-cloze-pdf-num .exam-paren {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="view-home" class="view active">
    <header class="flow" style="position:relative;margin:0 0 1rem;border-radius:0 0 12px 12px;">
      <h1 id="homeTitle">按题型练习</h1>
      <button type="button" class="btn secondary" id="btnPdfFull" title="按标准纸笔试卷版式排版，打印对话框中选「另存为 PDF」">导出 PDF（整套·标准试卷版式）</button>
    </header>
    <p class="breadcrumb">先选择一种题型，完成该题型全部题目后提交，再进入讲解与苏格拉底引导。</p>
    <div class="type-grid" id="typeGrid"></div>
  </div>

  <div id="view-quiz" class="view">
    <header class="flow">
      <h1 id="quizTitle">答题</h1>
      <span class="timer" id="quizTimer">用时 00:00</span>
      <button type="button" class="btn secondary" id="btnPdfType" title="仅导出当前题型，标准试卷版式">导出 PDF（本题型·标准版式）</button>
      <button type="button" class="btn secondary" id="btnBackHome">← 题型首页</button>
    </header>
    <div class="breadcrumb" id="quizBreadcrumb"></div>
    <div id="quizIntro"></div>
    <div id="quizBody"></div>
    <div style="margin-top:1.5rem;text-align:center;">
      <button type="button" class="btn primary" id="btnSubmitType">提交本题型</button>
    </div>
  </div>

  <div id="view-result" class="view">
    <header class="flow">
      <h1 id="resultTitle">本题型结果</h1>
      <button type="button" class="btn secondary" id="btnBackHome2">← 题型首页</button>
    </header>
    <div class="card" id="resultSummary"></div>
    <div style="text-align:center;margin:1rem 0;">
      <button type="button" class="btn primary" id="btnGoLearn">进入本题型讲解</button>
    </div>
  </div>

  <div id="view-learn" class="view">
    <header class="flow">
      <h1 id="learnTitle">讲解与学习</h1>
      <button type="button" class="btn secondary" id="btnBackHome3">← 题型首页</button>
    </header>
    <p class="breadcrumb">讲解页：题干与选项中可点击英文词查义；弹窗内可朗读该词。展开「解析」「知识点」「测试」查看更多。</p>
    <div id="learnBody"></div>
  </div>

  <div id="printHost" aria-hidden="true"></div>

  <div id="modal" aria-hidden="true">
    <div class="box">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.35rem;">
        <h4 id="modalWord" style="margin:0;color:var(--accent);font-size:1.15rem;">词汇</h4>
        <button type="button" class="btn primary" id="modalTtsWord">朗读本词</button>
      </div>
      <p id="modalBody" style="white-space:pre-wrap;margin:0.5rem 0;"></p>
      <button type="button" class="btn secondary" id="modalClose">关闭</button>

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第26套","exam_meta":{"full_score_text":"满分100分","time_text":"时间60分钟","type_cards":[{"sections":[0],"title":"1. 根据信息完成句子","range_text":"第1–5题"},{"sections":[1],"title":"2. 根据汉语提示完成句子","range_text":"第6–13题"},{"sections":[2],"title":"3. 单项选择题","range_text":"第14–23题"},{"sections":[3],"title":"4. 完形填空","range_text":"第24–33题"},{"sections":[4],"title":"5. 阅读理解","range_text":"第34–38题"},{"sections":[5],"title":"6. 写作","range_text":"第39题"}]},"sections":[{"section_title":"I. 根据情景, 完成句子。(共14分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"至今为止, 他已经在这家公司工作了十年了。\nHe has worked in this company for ten years _____.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"so far","explanation_md":"本题考查现在完成时的时间状语。中文提示“至今为止”意为“到目前为止”，英文中常用 “so far”、“up to now” 或 “until now” 来表达。句子 “He has worked...” 使用了现在完成时，表示动作从过去开始，持续到现在。因此，在句末填入 “so far” 来强调动作持续到当前，完全符合语法和语境。","knowledge_expansion_md":"### 现在完成时的时间状语\n\n现在完成时（Present Perfect Tense）常与以下几类时间状语连用：\n\n1.  **表示持续时间段的 `for` 和 `since`**：\n    *   `for` + 一段时间 (e.g., `for three years`, `for a long time`)\n    *   `since` + 一个时间点 (e.g., `since 2020`, `since last month`, `since I was a child`)\n\n2.  **表示“到目前为止”的 `so far`, `up to now`, `until now`**：\n    *   这些短语都意为“迄今为止”，常用于句首或句末。\n    *   例：`So far, we have learned five English songs.`\n\n3.  **表示“已经”、“尚未”、“刚刚”的 `already`, `yet`, `just`**：\n    *   `already`（已经）常用于肯定句。\n    *   `yet`（尚未，还）常用于否定句和疑问句。\n    *   `just`（刚刚）表示动作在不久前刚刚完成。\n\n4.  **表示“曾经”、“从未”的 `ever`, `never`**：\n    *   `ever`（曾经）常用于疑问句，询问经历。\n    *   `never`（从未）用于否定句，表示从未有过的经历。","socratic_tracks":[{"title":"时态与时间状语","steps":[{"question":"句子 “He has worked...” 使用了什么时态？这个时态有什么特点？","hint":"观察动词的形式 `has + worked`。这个时态通常表示从过去持续到现在的动作。","takeaway":"这是现在完成时，表示动作从过去开始，并持续到现在或对现在有影响。"},{"question":"题干中文“至今为止”是什么意思？它应该和哪种时态搭配使用？","hint":"“至今为止”强调的是“到目前这一刻为止”这个时间范围。","takeaway":"“至今为止”与现在完成时是黄金搭档，表示动作或状态持续到当前。"},{"question":"那么，有哪些英文短语可以表达“至今为止”的意思呢？","hint":"想一想，有没有一个以 s 开头的常用短语？或者以 up 开头的？","takeaway":"“so far”、“up to now” 或 “until now” 都可以表示“至今为止”，其中 “so far” 非常常用。"}]},{"title":"固定搭配 “so far”","steps":[{"question":"“so far” 这个短语你认识吗？它通常放在句子的哪个位置？","hint":"它可以放在句首或句末。比如 “So far, so good.” (目前为止，一切都好。)","takeaway":"“so far” 意为“到目前为止”，常用于句末或句首，用来修饰整个句子。"},{"question":"如果把 “so far” 换成 “so good” 放在句末，句子还通顺吗？为什么？","hint":"“so good” 是“这么好”的意思，它能修饰整个句子说明时间吗？","takeaway":"不通顺。“so good” 是形容词短语，不能作时间状语，而 “so far” 是时间状语短语。"}]},{"title":"语境逻辑推断","steps":[{"question":"句子 “He has worked in this company for ten years” 本身已经完整了，为什么还要在后面加一个词/短语？","hint":"句子的语法结构是完整的，但中文提示“至今为止”要求我们补充一个强调时间范围的状语。","takeaway":"补充状语是为了更精确地表达中文“至今为止”的含义，使语意更完整。"},{"question":"如果我们不加 “so far”，句子意思有什么细微的变化？","hint":"不加的话，句子只是陈述了一个事实：他在这家公司工作了十年。加上之后呢？","takeaway":"加上 “so far” 明确强调了这个状态持续到了说话的这一刻，与现在完成时的内涵完美契合。"}]}]},"answer_area_hint":"横线"},{"number":"2","item_type":"fill_blank","context_note":"","stem":"起初, 老师们都认为他不是学习的料。\n_____ all the teachers thought he had no ability to study well.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"At first","explanation_md":"本题考查表示“起初”的固定短语。根据中文提示“起初”，我们需要一个表示“一开始”或“最初”的英文短语。\"At first\" 是一个固定搭配，意为“起初，当初”，通常用于句首，后面跟逗号，引出后续的句子。这个短语完美地对应了中文意思，并符合句子的语法结构。它常常暗示后来的情况发生了变化，与句意“起初认为他不是学习的料”所隐含的转折意味相符。","knowledge_expansion_md":"### “起初”与“首先”的辨析\n\n在英语中，表示“开始”的状语有几个容易混淆，需要仔细辨析：\n\n1.  **At first**: 意为“起初，开始时”，通常暗示后来情况发生了**变化或对比**。它常常与 `but`, `but later`, `but then` 等连用。\n    *   例: `At first I didn't like him, but now we are good friends.` (起初我并不喜欢他，但现在我们是好朋友了。)\n\n2.  **First / Firstly**: 意为“首先”，通常用于**列举顺序或步骤**，后面常跟 `Second/Secondly`, `Then`, `Next`, `Finally` 等。\n    *   例: `First, open the book. Second, turn to page 10.` (首先，打开书。第二，翻到第10页。)\n\n3.  **In the beginning**: 意思与 \"At first\" 非常接近，可以互换，同样可以暗示后续的变化。\n    *   例: `In the beginning, I found the job very difficult.` (刚开始时，我觉得这份工作很难。)\n\n4.  **Initially**: 这是一个更正式的副词，意为“最初，起初”，功能与 `At first` 类似。\n    *   例: `Initially, the project was a great success, but it ran into problems later.` (最初这个项目很成功，但后来遇到了问题。)","socratic_tracks":[{"title":"固定短语辨析","steps":[{"question":"你知道 “first” 和 “at first” 的区别吗？它们都能表示“首先”吗？","hint":"想一想，当你要列举做事情的步骤时，你会用哪个？当你要描述一开始的情况和后来的变化时，你又会用哪个？","takeaway":"“First” 用于列举顺序，而 “At first” 用于描述“起初”的情况，并常暗示后续有转折。"},{"question":"这道题的语境是描述老师们“起初”的看法，这通常暗示了什么？","hint":"如果老师们“起初”这么认为，那么“后来”呢？这是否意味着他后来的表现可能超出了老师们的预料？","takeaway":"这种带有“今昔对比”意味的语境，正是使用 “At first” 的典型场景。"}]},{"title":"词义与功能","steps":[{"question":"观察这个句子，空缺部分在句子的什么位置？它起什么作用？","hint":"它在句首，并且后面有一个逗号。这通常是什么句子成分？","takeaway":"这是句子的状语，用来修饰整个句子，说明动作发生的时间或背景。"},{"question":"根据中文“起初”，这个状语应该表达什么样的时间概念？","hint":"它应该表达“在最开始的时候”这个意思。","takeaway":"我们需要一个表示“最初、起初”的时间状语短语，“At first” 正是这个功能。"}]},{"title":"同义词拓展","steps":[{"question":"除了 “At first”，你还能想到其他表示“起初”的英文表达吗？","hint":"尝试用 “begin” 这个词来构造一个短语。","takeaway":"“In the beginning” 是一个非常好的同义短语。"},{"question":"如果想用一个单词来表达“起初”，有没有更正式一点的词？","hint":"这个词以 “i” 开头，是 “initial” 的副词形式。","takeaway":"“Initially” 是一个更高级、更正式的副词，同样表示“起初”。"}]}]},"answer_area_hint":"横线"},{"number":"3","item_type":"fill_blank","context_note":"","stem":"你什么时候来中国看我?\nWhen will you _____ China and see me?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"come to","explanation_md":"本题考查趋向动词 “come” 和 “go” 的用法以及介词搭配。中文“来中国看我”表明动作的方向是朝向说话人（我）所在的地点（中国）。在英语中，表示朝向说话者方向的移动，应该使用动词 “come”。“来到某个地方”的表达是 “come to a place”。因此，此处应填入 “come to”，构成 “come to China”，意为“来到中国”。","knowledge_expansion_md":"### 趋向动词辨析：come vs. go\n\n`come` 和 `go` 是英语中一对最基本但又容易混淆的趋向动词，它们的选用取决于说话者的位置和视角。\n\n1.  **come (来)**: 表示朝向或到达说话者（或听话者）所在位置的移动。\n    *   **场景**: 我在中国，邀请在美国的朋友。我会说: \"When will you **come to** China?\" (你什么时候来中国？)\n    *   **场景**: 你在我家门口，我开门说: \"Please **come** in.\" (请进。)\n\n2.  **go (去)**: 表示离开说话者（或听话者）所在位置，向别处移动。\n    *   **场景**: 我和朋友都在中国，谈论他去美国的计划。我会问: \"When will you **go to** America?\" (你什么时候去美国？)\n    *   **场景**: 孩子要出门上学，妈妈说: \"It's time to **go** to school.\" (该去上学了。)\n\n### 其他表示“到达”的短语\n*   **arrive in**: 后接大地方，如国家、城市。例如: `arrive in Beijing`。\n*   **arrive at**: 后接小地方，如车站、学校、某栋建筑。例如: `arrive at the airport`。\n*   **get to**: 比较口语化，后面可接大地方或小地方，无严格区分。例如: `How can I get to the museum?`","socratic_tracks":[{"title":"趋向动词辨析","steps":[{"question":"假设我就在中国，我问你“你什么时候来中国”，我是希望你朝我这边移动，还是离开我？","hint":"“来”这个字本身就包含了方向性。","takeaway":"描述“朝向说话者移动”时，我们应该用动词 “come”。"},{"question":"那什么时候用 “go” 呢？比如我和你都在英国，我们讨论你去中国旅行的计划，我该怎么问？","hint":"这时中国对我们俩来说都是“别处”，是我们需要“去”的地方。","takeaway":"当目的地是远离说话者和听话者的地方时，我们用 “go”，比如 “When will you go to China?”。"}]},{"title":"动词与介词搭配","steps":[{"question":"在 “come” 后面表示“到达某个地方”，通常需要加一个介词吗？","hint":"想想“来学校”怎么说？“come school” 还是 “come to school”？","takeaway":"“come” 表示“来到”某个具体地点时，通常需要和介词 “to” 连用，构成 “come to a place”。"},{"question":"有没有不需要介词 “to” 的情况？","hint":"比如“回家”、“来这里”怎么说？","takeaway":"当地点是 “here”, “there”, “home” 这些地点副词时，前面不需要加介词，如 “come here”, “come home”。"}]},{"title":"句子结构分析","steps":[{"question":"观察句子中的连词 “and”，它连接了哪两个部分？","hint":"它连接了 “_____ China” 和 “see me”。","takeaway":"“and” 在这里连接了两个并列的动词短语，它们都跟在 “will you” 后面。"},{"question":"“see me” 是一个“动词+宾语”的结构，那么 “_____ China” 也应该是一个类似的结构，对吗？","hint":"是的，我们需要一个动词短语来表示“来中国”。","takeaway":"这个并列结构提示我们，空缺处需要填入一个与 “see” 并列的动词原形开头的短语，即 “come to”。"}]}]},"answer_area_hint":"横线"},{"number":"4","item_type":"fill_blank","context_note":"","stem":"参加教育交流是一次了不起的体验。\n_____ a fantastic experience _____ an educational exchange.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"It is|to take part in","explanation_md":"本题考查形式主语 “it” 的用法。中文句子的主语是“参加教育交流”，这是一个动作。在英语中，当动词不定式短语（to do sth.）作主语时，为了使句子结构更平衡，常使用 “It is ... to do sth.” 的句型。句中的 “It” 是形式主语，没有实际意义，真正的主语是后面的不定式短语。因此，第一个空填入 “It is”，构成句子的主谓部分；第二个空填入 “to take part in”（参加），引导出真正的主语内容。整个句子变为：“It is a fantastic experience to take part in an educational exchange.”","knowledge_expansion_md":"### 形式主语 “It” 的用法\n\n当一个句子的主语是动词不定式短语、动名词短语或一个从句时，这个主语会显得很长，造成句子“头重脚轻”。为了避免这种情况，英语中常用 “It” 来代替真正的主语，放在句首，而把真正的主语移到句子末尾。这个 “It” 就被称为形式主语。\n\n**常见句型：**\n\n1.  **It is + 形容词 + to do sth.**\n    *   `It is important to learn English well.` (学好英语很重要。)\n    *   `It is necessary for us to protect our eyes.` (保护我们的眼睛是必要的。)\n\n2.  **It is + 名词短语 + to do sth.**\n    *   `It is a good idea to get up early.` (早起是个好主意。)\n    *   `It is our duty to help others.` (帮助他人是我们的责任。)\n\n### “参加” 的不同表达\n*   **take part in**: 强调作为其中一员**参与**某项活动，并发挥作用。常用于活动、比赛、讨论等。 (e.g., `take part in a competition`)\n*   **join**: 强调**“加入”**某个组织、团体或成为其中一员。 (e.g., `join a club`, `join the army`)\n*   **attend**: 强调**“出席，到场”**，不一定亲自参与。 (e.g., `attend a meeting`, `attend a lecture`)\n*   **participate in**: 比较正式的说法，与 `take part in` 意思相近。","socratic_tracks":[{"title":"形式主语句型","steps":[{"question":"如果让你直接翻译“学好英语很重要”，你会怎么说？","hint":"“To learn English well is important.” 这样说对吗？语法上对，但听起来是不是有点“头重脚轻”？","takeaway":"虽然 “To do sth. is ...” 语法正确，但英语中更习惯用 “It is ... to do sth.” 来避免主语过长。"},{"question":"在 “It is important to learn English well.” 这个句子里，“It” 指代的是什么？真正的主语是哪个部分？","hint":"“It” 好像没有实际意思，真正想说的主语是“学好英语”这件事。","takeaway":"这里的 “It” 是形式主语，真正的主语是后面的不定式短语 “to learn English well”。"},{"question":"那么，回到原题，我们是否也可以用这个句型来表达“参加教育交流是一次了不起的体验”？","hint":"我们可以说 “It is a fantastic experience to...”","takeaway":"对，这正是本题考查的核心句型 “It is + 名词短语 + to do sth.”。"}]},{"title":"“参加”的词汇辨析","steps":[{"question":"英语中表示“参加”的词或短语，你最先想到哪个？","hint":"可能是 “join”？或者是 “take...” 开头的短语？","takeaway":"表示“参加”的常用表达有 “join”, “take part in”, “attend” 等。"},{"question":"“join a club” 和 “take part in an activity” 有什么区别？","hint":"一个是“加入”一个组织，成为会员；另一个是“参与”一次活动。","takeaway":"“join” 侧重“成为一员”，而 “take part in” 侧重“在活动中参与”。"},{"question":"对于“教育交流”这样一个活动，用哪个短语更合适？","hint":"“教育交流”是一项活动，而不是一个需要加入的组织。","takeaway":"用 “to take part in” 来表示参与到这项活动中，非常地道和准确。"}]},{"title":"句子成分分析","steps":[{"question":"看到这个句子 `_____ a fantastic experience _____ an educational exchange.`，你觉得它的主干是什么？","hint":"中间部分 “a fantastic experience” 看起来像是一个对主语的描述或说明，这在语法上叫什么成分？","takeaway":"“a fantastic experience” 是表语，那么它前面就应该是“主语+系动词”。"},{"question":"什么样的“主语+系动词”可以放在这里呢？","hint":"可以是 “This is”，也可以是 “It is”。但考虑到后面还有一个动作短语，哪个更合适？","takeaway":"考虑到后面还有一个不定式短语作真正的主语，使用形式主语 “It is” 是最符合逻辑和语法的选择。"}]}]},"answer_area_hint":"横线"},{"number":"5","item_type":"fill_blank","context_note":"","stem":"每个人都应该受到尊重。\nEveryone _____.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"should be respected","explanation_md":"本题考查含有情态动词的被动语态。中文“每个人都应该受到尊重”中，“每个人”是动作“尊重”的承受者，因此需要使用被动语态。 “应该”对应情态动词 `should`。“被尊重”的被动结构是 `be respected`（be动词+动词过去分词）。情态动词 `should` 后面必须跟动词原形，所以 `be` 动词用其原形 `be`。因此，完整填空为 `should be respected`。","knowledge_expansion_md":"### 情态动词与被动语态\n\n**结构**：`情态动词 + be + 动词过去分词`\n\n这个结构用来表示“应该/必须/可能被……”等含义，强调动作的承受者以及建议、义务或可能性。\n\n*   **情态动词**：`can`, `could`, `may`, `might`, `must`, `should`, `will`, `would` 等。\n*   **规则**：情态动词无人称和数的变化，其后永远跟动词原形。在被动语态中，这个动词原形就是 `be`。\n\n**举例**：\n*   The door **must be locked** at night. (门在晚上必须被锁上。)\n*   This problem **can be solved** in another way. (这个问题可以用另一种方法被解决。)\n*   Your homework **should be finished** before you watch TV. (在你看电视前，你的作业应该被完成。)\n\n**易错点**：学生常忘记 `be` 动词，或将 `be` 动词变成 `is/am/are`，这是错误的。例如，误写为 `Everyone should respected` 或 `Everyone should is respected`。","socratic_tracks":[{"title":"被动语态识别","steps":[{"question":"在“每个人都应该受到尊重”这句话里，主语“每个人”是发出“尊重”这个动作，还是接受这个动作？","hint":"是别人尊重“每个人”，还是“每个人”自己尊重别人？","takeaway":"主语“每个人”是动作的承受者，所以句子要用被动语态。"},{"question":"被动语态的基本结构是什么？","hint":"它由一个助动词和一个特殊形式的动词构成。","takeaway":"被动语态的基本结构是“be + 动词的过去分词（done）”。"}]},{"title":"情态动词用法","steps":[{"question":"中文里的“应该”通常用哪个情态动词来表示？","hint":"这个词常用来给别人提建议。","takeaway":"“应该”在英语中通常用情态动词 `should` 来表达。"},{"question":"情态动词（如 can, must, should）后面跟的动词应该是什么形式？","hint":"想一想 “I can swim.” 这句话里 swim 是什么形式？","takeaway":"情态动词后面必须跟动词原形。"}]},{"title":"结构整合","steps":[{"question":"现在，我们需要把“应该”(`should`) 和“被尊重”(`be respected`) 结合起来。根据情态动词后跟动词原形的规则，应该怎么组合？","hint":"被动结构 `be respected` 中的动词原形是哪个词？","takeaway":"`be` 本身就是动词原形，所以 `should` 后面直接跟 `be respected`。"},{"question":"所以，完整的短语是什么？它表达了什么完整的含义？","hint":"组合 `should` 和 `be respected`。","takeaway":"完整的短语是 `should be respected`，表示“应该被尊重”。"}]}]},"answer_area_hint":"横线"}]},{"section_title":"II. 根据汉语提示完成句子。(共16分)","section_instruction":"","items":[{"number":"6","item_type":"fill_blank","context_note":"","stem":"What's the Canadian way of _____ (理解) the world?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"understanding","explanation_md":"本题考查介词后的动词形式。句子意为“加拿大人理解世界的方式是什么？”。空格前的单词 `of` 是一个介词。在英语中，介词后面如果跟动词，该动词需要使用动名词形式（即-ing形式）。括号中给出的动词是 `understand`（理解），其动名词形式为 `understanding`。`the way of doing sth.` 是一个固定搭配，意为“做某事的方式”。","knowledge_expansion_md":"### 介词后的动名词（Gerund after Prepositions）\n\n**核心规则**：当一个动词跟在介词（如 `in`, `on`, `at`, `of`, `for`, `about`, `without`, `after`, `before` 等）后面时，必须将其变为动名词（verb-ing）形式。\n\n**常见搭配**：\n*   `be good at doing sth.` (擅长做某事)\n*   `be interested in doing sth.` (对做某事感兴趣)\n*   `thank sb. for doing sth.` (因某事感谢某人)\n*   `talk about doing sth.` (谈论做某事)\n*   `dream of doing sth.` (梦想做某事)\n*   `stop sb. from doing sth.` (阻止某人做某事)\n\n**特别注意**：`look forward to doing sth.` (盼望做某事) 中的 `to` 是介词，而不是不定式符号，所以后面也要跟动名词。例如：`I'm looking forward to seeing you.`\n\n**易错点**：学生常常在介词后误用动词原形，这是中式英语的典型错误。一定要记住“介词后面加名词或动名词”。","socratic_tracks":[{"title":"介词用法","steps":[{"question":"空格前面的单词 `of` 是什么词性？","hint":"它用于连接 `way` 和后面的内容，类似于 `in`, `on`, `at`。","takeaway":"`of` 是一个介词。"},{"question":"介词后面如果需要跟一个动作，这个动词应该使用什么形式？","hint":"回忆一下“感谢你帮助我” (Thank you for helping me.) 这句话里 `help` 的形式。","takeaway":"介词后面必须跟动名词（-ing形式）。"}]},{"title":"词形变换","steps":[{"question":"括号里给的中文“理解”对应的英文动词是什么？","hint":"这个词以 `u` 开头，表示“明白，懂得”。","takeaway":"“理解”对应的英文动词是 `understand`。"},{"question":"那么，动词 `understand` 的动名词形式应该怎么变？","hint":"动名词通常是在动词原形后面加上 `-ing`。","takeaway":"`understand` 的动名词形式是 `understanding`。"}]},{"title":"固定搭配","steps":[{"question":"短语 `the way of...` 是一个常用表达，它是什么意思？","hint":"例如，`the way of learning English` 是指“学习英语的……”","takeaway":"`the way of doing something` 是一个固定搭配，意思是“做某事的方式/方法”。"},{"question":"你能用这个搭配再造一个句子吗？比如“这是解决问题的一种新方法”。","hint":"“解决问题”是 `solve the problem`。","takeaway":"可以说 `This is a new way of solving the problem.`，这再次证明了 `of` 后面要用动名词。"}]}]},"answer_area_hint":"横线"},{"number":"7","item_type":"fill_blank","context_note":"","stem":"More than half of _____ (加拿大) have British or French ancestry.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"Canadians","explanation_md":"本题考查名词的数和主谓一致。句子意为“超过一半的加拿大人有英国或法国血统”。首先，从句意“有……血统”可知，主语应该是“人”而不是“国家”，所以需要用 `Canadian`（加拿大人）而非 `Canada`（加拿大）。其次，句子的谓语动词是 `have`，这是复数形式。这表明主语 `More than half of _____` 的核心词（空格中的词）必须是复数名词。因此，需要将 `Canadian` 变为其复数形式 `Canadians`。","knowledge_expansion_md":"### 国家、国民及语言的词形变换\n\n英语中，由国家名派生出指“某国人”或“某国语言”的词，其单复数形式有不同规律：\n\n1.  **以 `-an` 或 `-i` 结尾的，复数通常加 `-s`**：\n    *   America -> American -> Americans\n    *   Canada -> Canadian -> Canadians\n    *   Germany -> German -> Germans\n    *   Italy -> Italian -> Italians\n\n2.  **以 `-ese` 或 `-ss` 结尾的，单复数同形**：\n    *   China -> Chinese (一个中国人/一群中国人)\n    *   Japan -> Japanese (一个日本人/一群日本人)\n    *   Switzerland -> Swiss (一个瑞士人/一群瑞士人)\n\n3.  **特殊情况**：\n    *   Britain -> Briton -> Britons (指个体) / the British (指全体国民)\n    *   France -> Frenchman -> Frenchmen\n\n### 分数/百分比作主语的主谓一致\n\n当 `most of`, `half of`, `some of`, `a lot of`, `part of` 等结构作主语时，谓语动词的单复数取决于 `of` 后面的名词。\n*   `of` + 复数名词 -> 谓语用复数：`Some of the students are` from Class One.\n*   `of` + 不可数名词 -> 谓语用单数：`Most of the water is` clean.","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"句子里说“有英国或法国血统”（have British or French ancestry），拥有血统的应该是“加拿大”这个国家，还是“加拿大人”？","hint":"一个地理位置会有血统吗？","takeaway":"主语应该是“人”，所以需要填写表示“加拿大人”的词。"},{"question":"“加拿大”是 Canada，那么“加拿大人”的英文单词是什么？","hint":"类似于 America -> American。","takeaway":"“加拿大人”是 `Canadian`。"}]},{"title":"主谓一致","steps":[{"question":"观察句子中的动词 `have`。它是单数形式（如 has）还是复数形式？","hint":"He has a book. They have books.","takeaway":"`have` 是动词的复数形式。"},{"question":"既然谓语动词是复数，那么主语的核心部分（也就是空格里要填的词）应该是单数名词还是复数名词？","hint":"A boy has... vs. Boys have...","takeaway":"主语的核心词必须是复数名词，才能与复数动词 `have` 搭配。"}]},{"title":"名词复数","steps":[{"question":"我们已经知道需要填“加拿大人”的复数形式。`Canadian` 这个词的复数应该怎么变？","hint":"它和 `American` 的复数变化规则一样。","takeaway":"`Canadian` 的复数形式是 `Canadians`，直接在词尾加 `-s`。"},{"question":"你知道哪些表示“某国人”的词，其复数形式不是加-s的吗？","hint":"比如“中国人”或“日本人”。","takeaway":"像 `Chinese` 和 `Japanese` 这样的词，单数和复数形式是相同的。"}]}]},"answer_area_hint":"横线"},{"number":"8","item_type":"fill_blank","context_note":"","stem":"Canada has two official _____ (语言).","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"languages","explanation_md":"本题考查名词的复数形式。句子意为“加拿大有两种官方语言”。空格前的数词是 `two`（二），表示大于一的数量。在英语中，当一个可数名词被大于一的数词修饰时，该名词必须使用其复数形式。括号中提示的词是 `language`（语言），它是一个可数名词。其复数形式是直接在词尾加 `-s`，变为 `languages`。","knowledge_expansion_md":"### 可数名词的复数规则\n\n英语中可数名词变为复数时，有以下主要规则：\n\n1.  **一般情况**：直接在词尾加 `-s`。\n    *   `book` -> `books`\n    *   `language` -> `languages`\n\n2.  **以 s, x, ch, sh 结尾**：在词尾加 `-es`，读音为 /ɪz/。\n    *   `bus` -> `buses`\n    *   `box` -> `boxes`\n    *   `watch` -> `watches`\n\n3.  **以“辅音字母 + y”结尾**：变 `y` 为 `i`，再加 `-es`。\n    *   `city` -> `cities`\n    *   `family` -> `families`\n\n4.  **以“元音字母 + y”结尾**：直接加 `-s`。\n    *   `boy` -> `boys`\n    *   `day` -> `days`\n\n5.  **以 f 或 fe 结尾**：多数变 `f/fe` 为 `v`，再加 `-es`。\n    *   `leaf` -> `leaves`\n    *   `wife` -> `wives`\n    *   (少数例外：`roof` -> `roofs`)\n\n6.  **不规则变化**：需要特殊记忆。\n    *   `man` -> `men`\n    *   `child` -> `children`\n    *   `foot` -> `feet`\n    *   `mouse` -> `mice`\n    *   `person` -> `people`","socratic_tracks":[{"title":"数词与名词复数","steps":[{"question":"请看空格前面的单词 `two`。它表示的数量是单数还是复数？","hint":"想一想 `one` 和 `two` 的区别。","takeaway":"`two` 表示复数数量。"},{"question":"当一个可数名词前面有表示复数的数词（如 two, three, four...）时，这个名词应该用什么形式？","hint":"我们说 `one apple`，但会说 `two` 后面跟什么？","takeaway":"表示复数的数词后面必须跟名词的复数形式。"}]},{"title":"词形变换","steps":[{"question":"括号里提示的中文“语言”对应的英文单词是什么？","hint":"这个词以 `l` 开头。","takeaway":"“语言”的英文单词是 `language`。"},{"question":"`language` 这个词的复数形式是什么？它遵循哪种变化规则？","hint":"它是最常见的一种复数变化规则。","takeaway":"`language` 的复数形式是 `languages`，直接在词尾加 `-s`。"}]},{"title":"可数与不可数名词","steps":[{"question":"你认为 `language`（语言）是可数名词还是不可数名词？","hint":"我们能数“一种语言，两种语言”吗？","takeaway":"`language` 是可数名词，因为它有明确的个体概念。"},{"question":"与之相对，像 `water`（水）或 `information`（信息）这样的不可数名词，前面能直接加 `two` 吗？","hint":"我们能说 `two waters` 吗？（除非指两杯水）","takeaway":"不可数名词通常没有复数形式，也不能直接被数词修饰，这更凸显了 `language` 作为可数名词必须变复数的规则。"}]}]},"answer_area_hint":"横线"},{"number":"9","item_type":"fill_blank","context_note":"","stem":"Canadians believe that people must respect and _____ (包容) each other and help each other.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"tolerate","explanation_md":"本题考查动词词义和并列结构。\n1.  根据汉语提示“包容”，可知此处需要填写动词 `tolerate`。\n2.  句子结构为 `must respect and _____ each other`，`and` 是并列连词，用于连接两个语法功能相同的成分。\n3.  在 `must` 这个情态动词之后，需要使用动词原形。`and` 前的 `respect` 是动词原形，因此 `and` 之后也应使用动词原形 `tolerate`，以构成平行结构。\n4.  `tolerate` 意为“容忍，包容”，符合句意“加拿大人相信人们必须相互尊重、相互包容、相互帮助”。","knowledge_expansion_md":"### 词义辨析：tolerate vs. accept vs. put up with\n*   **tolerate** (v. 包容，容忍)：指尽管不一定喜欢或赞同，但仍允许其存在或发生。强调一种克制和忍耐。例如：`We should learn to tolerate different opinions.` (我们应该学会包容不同的意见。)\n*   **accept** (v. 接受)：指自愿地、主动地接纳某事物，认可其价值。情感色彩比 `tolerate` 更积极。例如：`She accepted my apology.` (她接受了我的道歉。)\n*   **put up with** (动词短语，忍受)：与 `tolerate` 意思相近，但更偏口语化，常用于指忍受令人不快的人或事。例如：`I can't put up with the noise any longer.` (我再也无法忍受这噪音了。)\n\n### 词形变化\n*   **tolerance** (n. 宽容，容忍)。例如：`We should show tolerance towards others.` (我们应该对他人表现出宽容。)\n*   **tolerant** (adj. 宽容的，容忍的)。例如：`He has a very tolerant attitude.` (他有非常宽容的态度。)\n\n### 语法结构：平行结构\n并列连词 `and`, `but`, `or` 等连接的成分在词性、形式和功能上应该保持一致。例如：`I like swimming, reading, and listening to music.` (动名词并列)","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"根据汉语提示“包容”，你首先想到的英文动词是什么？","hint":"这个词以 't' 开头，表示“容忍、忍受”。","takeaway":"“包容”在英文中常用动词 `tolerate` 来表达。"},{"question":"“包容”和“接受”(accept) 有什么不同？在这个句子里，为什么用“包容”更合适？","hint":"“包容”意味着即使你不喜欢或不同意，也允许它存在。“接受”则更偏向于主动认可。","takeaway":"`tolerate` 强调对差异的尊重和共存，而 `accept` 意味着完全赞同，因此 `tolerate` 更符合“尊重和帮助”的语境。"}]},{"title":"语法结构","steps":[{"question":"观察横线前后的词，`and` 在这里连接了什么？","hint":"`and` 前面是动词 `respect`，后面是 `each other`。","takeaway":"`and` 在这里连接了两个并列的动词，`respect` 和待填的词。"},{"question":"为什么这里的动词需要用原形？","hint":"注意句子前面的情态动词 `must`。","takeaway":"情态动词 `must` 后面要求跟动词原形，并且 `and` 连接的两个动词形式应保持一致。"}]},{"title":"词汇拓展","steps":[{"question":"`tolerate` 的名词形式是什么？","hint":"将动词结尾的 `-ate` 变为名词后缀 `-ance`。","takeaway":"`tolerate` 的名词形式是 `tolerance`，意为“宽容、容忍”。"},{"question":"你能用 `tolerance` 造一个句子，表达“我们应该对不同的文化有更多的宽容”吗？","hint":"We should have more _____ for different cultures.","takeaway":"一个例句是：`We should have more tolerance for different cultures.`"}]}]},"answer_area_hint":"横线"},{"number":"10","item_type":"fill_blank","context_note":"","stem":"We should _____ (尊重) those who are old.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"respect","explanation_md":"本题考查动词词义及情态动词的用法。\n1.  根据汉语提示“尊重”，可知此处需要填写动词 `respect`。\n2.  句中的 `should` 是一个情态动词，意为“应该”。\n3.  情态动词（如 `can`, `may`, `must`, `should` 等）后面必须跟动词原形。\n4.  因此，在 `should` 后面应填写动词原形 `respect`，构成 `should respect`，意为“应该尊重”。","knowledge_expansion_md":"### 一词多性：respect\n*   **动词 (v.)**：意为“尊重，尊敬”。例如：`You should respect your teachers.` (你应该尊敬你的老师。)\n*   **名词 (n.)**：意为“尊重，尊敬”（不可数）。常用搭配有：\n    *   `show respect for/to sb.`：对某人表示尊敬。\n    *   `treat sb. with respect`：尊重地对待某人。\n    *   `have respect for sb.`：尊敬某人。\n\n### 词汇家族\n*   **respectful** (adj.)：恭敬的，表示尊重的。常与 `to` 或 `of` 连用。例如：`Be respectful to the elderly.` (对老年人要恭敬。)\n*   **respectable** (adj.)：值得尊敬的，体面的，高尚的。例如：`He comes from a respectable family.` (他出身于一个体面的家庭。)\n*   **respective** (adj.)：分别的，各自的。例如：`They went back to their respective rooms.` (他们回到了各自的房间。) 这三个形容词词义差别很大，需要注意区分。","socratic_tracks":[{"title":"核心词义","steps":[{"question":"题干中汉语提示“尊重”对应的英文单词是什么？","hint":"这是一个在日常生活中非常常用的单词，既可以作动词也可以作名词。","takeaway":"“尊重”的英文是 `respect`。"},{"question":"在这个句子中，`respect` 是什么词性？它表示什么？","hint":"它跟在 `should` 后面，表示一个“应该做”的动作。","takeaway":"在这里，`respect` 是一个动词，表示“尊敬”这个动作。"}]},{"title":"语法规则","steps":[{"question":"句子中的 `should` 是什么类型的词？","hint":"像 `can`, `must`, `may` 一样，它表达一种语气或情态，如建议、义务等。","takeaway":"`should` 是一个情态动词。"},{"question":"情态动词后面跟的动词应该是什么形式？","hint":"回想一下 \"I can swim.\" 里的 `swim` 是什么形式。","takeaway":"情态动词后面必须跟动词原形。"}]},{"title":"词性拓展","steps":[{"question":"`respect` 除了作动词，还可以作什么词？","hint":"我们可以说“对某人表示尊敬”，即 \"show _____ for sb.\"。","takeaway":"`respect` 也可以作名词，意为“尊敬”。"},{"question":"那么，形容词“充满敬意的”怎么说？例如，“一个充满敬意的学生”。","hint":"在 `respect` 后面加上一个常见的形容词后缀 `-ful`。","takeaway":"形容词是 `respectful`，例如 `a respectful student`。"}]}]},"answer_area_hint":"横线"},{"number":"11","item_type":"fill_blank","context_note":"","stem":"Words cannot _____ (描述) her beauty.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"describe","explanation_md":"本题考查动词词义及情态动词的用法。\n1.  根据汉语提示“描述”，可知此处需要填写动词 `describe`。\n2.  句中的 `cannot` (can't) 是情态动词 `can` 的否定形式，意为“不能”。\n3.  情态动词（包括其肯定、否定和疑问形式）后面都必须跟动词原形。\n4.  因此，在 `cannot` 后面应填写动词原形 `describe`，构成 `cannot describe`，意为“无法描述”。\n5.  整个句子意为“言语无法描述她的美丽”，表达了她的美丽难以言表。","knowledge_expansion_md":"### 核心动词：describe\n*   `describe` (v.) 意为“描述，描绘”。\n*   **常用搭配 1**: `describe sth./sb. as ...` (把...描述为...)。例如：`He described the trip as exciting.` (他把这次旅行描述为激动人心的。)\n*   **常用搭配 2**: `describe sth./sb. to sb.` (向某人描述...)。例如：`Can you describe the man to me?` (你能向我描述一下那个男人吗？)\n\n### 词汇家族\n*   **description** (n. 描述，描绘)。例如：`The police asked for a description of the thief.` (警察要求提供对小偷的相貌描述。) 短语 `beyond description` 意为“难以形容”，与本题 `words cannot describe` 意思相近。\n*   **descriptive** (adj. 描述性的)。例如：`The book is full of descriptive details.` (这本书充满了描述性的细节。)","socratic_tracks":[{"title":"核心词义","steps":[{"question":"汉语提示“描述”对应的英文动词是什么？","hint":"这个词和它的名词形式 `description` 经常一起学习。","takeaway":"“描述”的英文动词是 `describe`。"},{"question":"整个句子的意思是“言语无法描述她的美丽”，这里的 `cannot describe` 表达了什么程度？","hint":"`cannot` 表示“不能，无法”。当说“言语无法...”时，通常是为了强调某事物的极端程度。","takeaway":"`cannot describe` 意为“无法描述”，是一种夸张的修辞手法，用以强调美丽到难以言表的程度。"}]},{"title":"语法规则","steps":[{"question":"句子中的 `cannot` 是什么词？","hint":"它是 `can` 的否定形式。`can` 是什么词？","takeaway":"`cannot` 是情态动词 `can` 的否定形式。"},{"question":"情态动词后面跟的动词应该是什么形式？","hint":"无论是肯定形式 `can` 还是否定形式 `cannot`，后面的规则是一样的。","takeaway":"情态动词后面必须跟动词原形。"}]},{"title":"词汇应用","steps":[{"question":"`describe` 的名词形式是什么？","hint":"它的结尾是 `-tion`，需要去掉动词结尾的 `e` 再加后缀。","takeaway":"`describe` 的名词形式是 `description`。"},{"question":"如何用 `description` 来表达“请给我一份关于这个产品的描述”？","hint":"Please give me a _____ of the product.","takeaway":"可以说：`Please give me a description of the product.`"}]}]},"answer_area_hint":"横线"},{"number":"12","item_type":"fill_blank","context_note":"","stem":"Nearly 70 _____ (百分比) of the fund was supplied by the government.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"percent","explanation_md":"本题考查名词词义及 `percent` 与 `percentage` 的区别。\n1.  根据汉语提示“百分比”，以及前面的具体数字 `70`，可知此处应填写 `percent`。\n2.  `percent` (或 `per cent`) 是一个名词，意为“百分之...”，其核心用法是必须与一个具体的数字连用，表示确切的百分比。\n3.  `percent` 本身没有复数形式，即使在数字大于1的情况下（如本题的70），也用 `percent` 而不是 `percents`。\n4.  句意为：将近70%的资金是由政府提供的。","knowledge_expansion_md":"### 易混词辨析：percent vs. percentage\n*   **`percent`**：意为“百分之...”，必须与**具体数字**连用。它本身没有复数形式。例如：`ten percent` (10%)，`0.5 percent` (0.5%)。\n*   **`percentage`**：意为“百分率，百分比”，是一个名词。它**不与具体数字**连用，通常用来泛指一个比例。常与 `a/the`, `high/low`, `small/large` 等词连用。例如：\n    *   `What percentage of students are girls?` (女生的百分比是多少？)\n    *   `A large percentage of the houses were damaged.` (很大比例的房屋被损坏了。)\n\n### 主谓一致规则\n当 `percent of + 名词` 作主语时，谓语动词的单复数形式取决于 `of` 后面的名词，这被称为“就近原则”的一种特殊情况。\n*   如果 `of` 后面的名词是**不可数名词**（如本题的 `the fund`），谓语动词用**单数**。例：`70 percent of the fund **was** supplied...`\n*   如果 `of` 后面的名词是**可数名词复数**（如 `the students`），谓语动词用**复数**。例：`70 percent of the students **are** from China.`","socratic_tracks":[{"title":"核心词义","steps":[{"question":"看到数字 `70` 和汉语提示“百分比”，你首先想到的英文单词是什么？","hint":"这个词通常可以被符号 \"%\" 替代。","takeaway":"表达“百分之七十”需要用 `70 percent`。"},{"question":"这个词有没有复数形式？可以说 `70 percents` 吗？","hint":"回想一下我们说 `two hundred` 而不是 `two hundreds`。`percent` 的用法与此类似。","takeaway":"`percent` 没有复数形式，即使前面的数字大于1，也用 `percent`。"}]},{"title":"易混词辨析","steps":[{"question":"`percent` 和 `percentage` 都和“百分比”有关，它们在使用上有什么关键区别？","hint":"观察本题，`percent` 前面有什么？","takeaway":"`percent` 前面必须有具体的数字，而 `percentage` 不能和具体数字连用，它泛指一个比例。"},{"question":"如果我想问“学生中男生占的百分比是多少？”，我应该用 `percent` 还是 `percentage`？","hint":"这个问题里没有给出具体的数字，只是泛指一个比例。","takeaway":"应该用 `percentage`，例如 `What percentage of the students are boys?`。"}]},{"title":"主谓一致","steps":[{"question":"在这个句子中，主语是 `Nearly 70 percent of the fund`。谓语动词 `was` 为什么用单数形式？","hint":"决定动词单复数的关键是 `of` 后面的名词 `fund`。","takeaway":"因为 `of` 后面的名词 `fund` (资金) 是一个不可数名词，所以谓语动词用单数。"},{"question":"如果句子是 `70 percent of the apples ____ (be) rotten.`，横线处应该填 `is` 还是 `are`？","hint":"`apples` 是可数名词复数。","takeaway":"应该填 `are`，因为 `of` 后面的名词 `apples` 是复数，谓语动词的数要与它保持一致。"}]}]},"answer_area_hint":"横线"},{"number":"13","item_type":"fill_blank","context_note":"","stem":"His office is in the _____ (中心的) part of the city.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"central","explanation_md":"该句意为“他的办公室在城市的中心部分”。空格处需要一个形容词来修饰名词 `part`（部分）。中文提示“中心的”对应的英文形容词是 `central`。`central` 意为“中心的、中央的”，符合句意。因此，填入 `central`。","knowledge_expansion_md":"**词汇辨析：`central` vs. `center`**\n*   `central` 是形容词，意为“中心的，中央的”，用来修饰名词。例如：`the central government` (中央政府)，`a central idea` (中心思想)。\n*   `center` 是名词，意为“中心，中央”，通常指一个具体的地点或位置。例如：`the city center` (市中心)，`in the center of the room` (在房间中央)。\n\n**构词法：后缀 `-al`**\n*   `central` 是由名词 `center` 加上形容词后缀 `-al` 构成的。很多名词加上 `-al` 可以变成形容词，这是一种常见的构词方式。\n*   例如：`nation` (国家) → `national` (国家的)，`person` (个人) → `personal` (个人的)，`nature` (自然) → `natural` (自然的)。\n\n**常见搭配**\n*   `central part` (中心部分)\n*   `central location` (中心位置)\n*   `Central Park` (专有名词，纽约中央公园)","socratic_tracks":[{"title":"确定所需词性","steps":[{"question":"在短语 `the _____ part of the city` 中，空格里的词是用来修饰哪个词的？","hint":"它位于名词 `part` 的前面，并且前面有定冠词 `the`。","takeaway":"空格里的词是一个形容词，用来修饰名词 `part`。"},{"question":"中文提示“中心的”有名词和形容词两种可能，根据我们刚才的分析，这里应该用哪种词性？","hint":"我们需要一个词来形容 `part` 是什么样的。","takeaway":"我们需要将“中心的”翻译成对应的英文形容词。"}]},{"title":"“中心”的英文表达","steps":[{"question":"你知道“中心”这个概念在英语里通常用哪个核心词来表示吗？","hint":"想想“市中心”可以说成 `city _____`。","takeaway":"“中心”对应的核心词是 `center`。"},{"question":"`center` 是名词，而我们需要的是形容词。你知道如何把名词 `center` 变成形容词吗？","hint":"很多名词可以加一个后缀变成形容词，比如 `nation` (国家) -> `national` (国家的)。","takeaway":"名词 `center` 加上后缀 `-al` 就变成了形容词 `central`。"}]},{"title":"语境与词汇辨析","steps":[{"question":"这句话 `His office is in the _____ part of the city.` 是想表达什么意思？","hint":"这句话描述了他办公室在城市里的具体位置。","takeaway":"这句话描述了他办公室所在的地理位置，即在城市的中心区域。"},{"question":"在描述城市的“中心”区域时，为什么用 `central` 比用 `middle` 更常见和准确？","hint":"`central` 侧重于功能、地位上的核心，而 `middle` 更多指纯粹物理空间上的正中间。对于一个城市区域，哪个词更能体现其重要性？","takeaway":"在描述城市区域时，`central` 是更常用和地道的表达，它不仅指地理位置，还常暗示其商业、文化或行政上的核心地位。"}]}]},"answer_area_hint":"横线"}]},{"section_title":"III. 单项选择。(共20分)","section_instruction":"","items":[{"number":"14","item_type":"choice","context_note":"","stem":"I have taught English in this school _____ 1980. It was thirty years ago.","options":{"A":"after","B":"in","C":"since","D":"for"},"teaching":{"correct_answer":"C","explanation_md":"句子的谓语动词是 `have taught`，这是现在完成时，表示一个从过去开始并持续到现在的动作。现在完成时常与 `since` 和 `for` 连用。`since` 用于引导一个具体的时间点（如 `since 1980`），表示动作的起始时间。`for` 用于引导一段时间（如 `for 30 years`），表示动作持续的总时长。题干中给出的时间是 “1980”，这是一个明确的过去时间点，因此应该使用 `since`。","knowledge_expansion_md":"**语法核心：现在完成时与 `since`/`for` 的搭配**\n*   **`since` + 时间点**: 表示动作从何时开始。时间点可以是：\n    *   具体年份/月份/日期: `since 2000`, `since last May`\n    *   `last` + 名词: `since last week`\n    *   时间状语从句 (从句用一般过去时): `since I was a child`\n*   **`for` + 时间段**: 表示动作持续了多久。时间段可以是：\n    *   `for` + a few/several/many + 时间单位: `for a few days`\n    *   `for` + a long time\n\n**易错点辨析**\n*   `in 1980` 通常与一般过去时连用，表示在1980年发生了某事，不强调持续性。例如：`I came to this school in 1980.` (我1980年来到这所学校)。\n*   `after 1980` 表示“1980年之后”，不与现在完成时搭配表示动作的起点。\n*   第二句话 `It was thirty years ago.` 是一个补充信息，可能是在2010年说的，它不影响第一句话的语法结构，有时会作为干扰项出现。","socratic_tracks":[{"title":"识别句子时态","steps":[{"question":"句子的谓语动词 “have taught” 是什么时态？","hint":"它的结构是 `have/has` + 动词的过去分词。","takeaway":"这是现在完成时，表示动作从过去开始，一直持续到现在。"},{"question":"现在完成时通常和哪些表示时间的介词连用，来表明动作的起始点或持续时长？","hint":"一个表示“自从...”，另一个表示“持续了...”。","takeaway":"现在完成时常与 `since` 和 `for` 连用。"}]},{"title":"介词 `since` vs. `for`","steps":[{"question":"`since` 和 `for` 在用法上有什么区别？它们后面分别跟什么样的时间表达？","hint":"一个是“时间点”，一个是“时间段”。","takeaway":"`since` 后面跟一个具体的时间点，而 `for` 后面跟一个持续的时间段。"},{"question":"题目中的 “1980” 是一个时间点还是一个时间段？","hint":"“1980年”是一个特定的年份，是一个时刻。","takeaway":"“1980” 是一个时间点，所以应该用 `since`。"}]},{"title":"排除干扰项","steps":[{"question":"为什么不能选 B 选项 “in”？ “in 1980” 这个用法通常和什么时态连用？","hint":"“in + 年份”表示动作发生在那个时间点，还是从那个时间点持续到现在？","takeaway":"“in 1980” 通常与一般过去时连用，表示动作发生在1980年这一刻，不强调持续性，所以不符合现在完成时的语境。"},{"question":"第二句话 “It was thirty years ago.” 对我们选择答案有影响吗？","hint":"这句话只是一个补充信息。它会改变第一句话的语法结构吗？","takeaway":"第二句话是补充说明或干扰信息，不影响第一句话中“现在完成时 + since + 时间点”的固定搭配。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—When _____ Mr. Green _____ to Australia?\n—He _____ there for a month.","options":{"A":"has; gone; has gone","B":"has; been; has been","C":"did; go; has gone","D":"did; go; has been"},"teaching":{"correct_answer":"D","explanation_md":"第一个句子是由 `When` 引导的特殊疑问句，询问动作发生的具体时间。对于已经发生的动作，`When` 引导的问句应该使用一般过去时，其结构为 “When + did + 主语 + 动词原形...?”，因此前两个空应填 `did` 和 `go`。\n\n第二个句子是回答，其中有时间状语 “for a month”（持续一个月），表示一个从过去开始并持续到现在的状态，这需要使用现在完成时。\n\n`has gone to` 表示“去了某地（人现在不在说话地）”。`has been to` 表示“去过某地（现在已经回来）”。`has been in/at/there` 表示“在某地待了多久（人还在那里）”。根据句意“他在那里已经待了一个月了”，应该使用 `has been`，表示状态的持续。因此，第三个空应填 `has been`。","knowledge_expansion_md":"**核心语法点1：`When` 引导的特殊疑问句时态**\n*   当 `When` 用来询问过去某个具体时间发生的动作时，必须使用**一般过去时**，不能使用现在完成时。\n*   错误用法：`*When have you finished your homework?`\n*   正确用法：`When did you finish your homework?`\n\n**核心语法点2：`have/has gone to` vs. `have/has been to` vs. `have/has been in`**\n*   `have/has gone to...`: 意为“去了某地”，表示主语人已离开，目前在目的地或在去目的地的路上。强调“离开”和“不在场”。例：`Tom has gone to the library.` (汤姆现在不在，在图书馆。)\n*   `have/has been to...`: 意为“去过某地”，表示主语曾经去过某地，但现在已经回来了。强调“经历”。例：`I have been to Beijing twice.` (我去过北京两次。)\n*   `have/has been in/at/there`: 意为“在某地待了多久”，表示主语目前仍在某地，并强调停留时间的长度。常与 `for` 或 `since` 引导的时间状语连用。例：`She has been in London for three years.` (她已经在伦敦待了三年了。)\n\n**本题情景分析**: 问句问的是“什么时候去的”，这是一个过去的具体时间点，所以用一般过去时 `did go`。答句说“他在那里待了一个月了”，强调的是从过去到现在持续的状态，人还在那里，所以用 `has been`。","socratic_tracks":[{"title":"问句时态分析","steps":[{"question":"疑问词 `When` 是用来问什么的？","hint":"是问一个动作持续了多久，还是问动作发生在什么时候？","takeaway":"`When` 用来询问动作发生的具体时间点。"},{"question":"当我们询问一个过去动作发生的具体时间点时，应该用什么时态？是现在完成时还是一般过去时？","hint":"现在完成时强调动作对现在的影响或持续性，而一般过去时关注动作本身在过去发生。哪个更符合“询问具体发生时间”这个目的？","takeaway":"询问过去动作的具体发生时间，必须使用一般过去时。"},{"question":"那么，一般过去时的疑问句结构是怎样的？主语是 “Mr. Green”，动词是 “go”。","hint":"需要借助动词 `do` 的过去式。","takeaway":"结构是 “When did + 主语 + 动词原形...?”，所以前两个空是 `did` 和 `go`。"}]},{"title":"答句时态与动词选择","steps":[{"question":"看到答句中的 “for a month”，你首先会想到什么时态？","hint":"“for + 一段时间” 通常与什么时态连用，表示动作或状态的持续？","takeaway":"“for + 一段时间” 常与现在完成时连用。"},{"question":"答句是想表达“他去澳大利亚”这个一次性动作，还是“他在澳大利亚”这个持续状态？","hint":"“持续一个月”是描述一个动作还是一种状态？","takeaway":"答句描述的是“在澳大利亚待了一个月”这个持续的状态。"},{"question":"那么，表示“在某地待了一段时间”应该用 `has gone` 还是 `has been`？","hint":"`has gone` 强调“去了”，人不在了；`has been` 可以表示“待在某地”的状态。","takeaway":"`He has been there for a month` 表示他已经在那里待了一个月，符合句意。"}]},{"title":"`gone` 与 `been` 的辨析","steps":[{"question":"如果我说 “My mother has gone to the supermarket”，我妈妈现在在哪里？","hint":"`go` 的动作已经完成，人已经离开了。","takeaway":"她人在超市或者去超市的路上了，总之不在这里。"},{"question":"如果我说 “I have been to the Great Wall”，我现在在哪里？","hint":"`be` 在这里可以理解为一种经历，去过并且回来了。","takeaway":"我现在已经回来了，只是在讲述一段去过的经历。"},{"question":"结合本题答句 “He _____ there for a month”，他是已经回来了，还是仍然在那里？","hint":"“待了一个月”意味着这个状态持续到了现在。","takeaway":"他人还在澳大利亚，所以应该用 `has been there` 来表示“在某地待了多久”的状态。"}]}]}},{"number":"16","item_type":"choice","context_note":"","stem":"_____ poor child the boy is!","options":{"A":"How","B":"What a","C":"What","D":"How a"},"teaching":{"correct_answer":"B","explanation_md":"本题考查感叹句的用法。感叹句主要有两种结构：\n1.  `What (+ a/an) + 形容词 + 名词 + 主语 + 谓语!`，用来修饰名词。\n2.  `How + 形容词/副词 + 主语 + 谓语!`，用来修饰形容词或副词。\n\n题干的中心词是名词 `child`，并且 `child` 是一个可数名词单数，前面有形容词 `poor` 修饰。这种“形容词+名词”的结构应该使用 `What` 引导的感叹句。因为 `child` 是可数名词单数，所以其前面必须加不定冠词 `a`。因此，正确的句子结构是 `What a poor child the boy is!`。","knowledge_expansion_md":"**感叹句两种结构详解**：\n1.  **`What` 引导的感叹句**：强调的是一个“名词”。\n    *   `What + a/an + 形容词 + 可数名词单数 + (主谓)!`\n        例：`What a lovely day it is!`\n    *   `What + 形容词 + 可数名词复数 + (主谓)!`\n        例：`What clever students they are!`\n    *   `What + 形容词 + 不可数名词 + (主谓)!`\n        例：`What beautiful music it is!`\n2.  **`How` 引导的感叹句**：强调的是一个“形容词”、“副词”或“动词”。\n    *   `How + 形容词 + (主谓)!`\n        例：`How beautiful the girl is!`\n    *   `How + 副词 + (主谓)!`\n        例：`How fast he runs!`\n\n**判断方法**：找到句子的中心词。如果中心词是名词（或名词短语），用 `What`；如果中心词是形容词或副词，用 `How`。\n\n**句型转换**：`What a poor child the boy is!` 可以转换为 `How poor the boy is!`。两者意思相近，但前者强调“一个多么可怜的孩子”，后者强调“多么可怜”。","socratic_tracks":[{"title":"判断感叹句类型","steps":[{"question":"这个句子以感叹号 `!` 结尾，它是什么类型的句子？","hint":"用来表达强烈情感的句子。","takeaway":"这是一个感叹句。"},{"question":"感叹句的核心是修饰哪个词？是 `poor` (可怜的) 还是 `child` (孩子)？","hint":"整个短语是 `poor child`，这是一个以名词为中心的短语。","takeaway":"感叹句的核心是名词短语 `poor child`。"},{"question":"当感叹句修饰的是名词或名词短语时，应该用 `What` 还是 `How` 来引导？","hint":"想一想 `What a day!` 和 `How beautiful!` 的区别。","takeaway":"修饰名词或名词短语时，应该用 `What` 引导感叹句。"}]},{"title":"`What`感叹句中的冠词","steps":[{"question":"我们确定了要用 `What` 引导。现在看中心词 `child`，它是什么类型的名词？","hint":"它是可数的还是不可数的？是单数还是复数？","takeaway":"`child` 是一个可数名词的单数形式。"},{"question":"当 `What` 引导的感叹句中，中心名词是可数名词单数时，名词前面需要加什么？","hint":"就像我们说 `He is a boy.` 一样，单数可数名词通常需要一个冠词。","takeaway":"在 `What` 引导的感叹句中，如果中心词是可数名词单数，必须在形容词前加上不定冠词 `a` 或 `an`。"},{"question":"`poor` 这个词以辅音音素开头，所以应该用 `a` 还是 `an`？","hint":"`a` 用于辅音音素开头的词前，`an` 用于元音音素开头的词前。","takeaway":"`poor` 以辅音音素开头，所以用 `a`，构成 `What a poor child...`。"}]},{"title":"排除错误选项","steps":[{"question":"为什么选项 A `How` 是错的？如果用 `How`，这个句子应该怎么说？","hint":"`How` 后面直接跟形容词或副词，而不是名词短语。","takeaway":"如果用 `How`，句子应该是 `How poor the boy is!`，`How` 后面不能跟名词短语 `poor child`。"},{"question":"为什么选项 D `How a` 是错的？","hint":"回忆一下 `How` 引导的感叹句的基本结构。","takeaway":"`How` 引导的感叹句中，`How` 后面只能跟形容词或副词，不存在 `How a` 这种结构。"}]}]}},{"number":"17","item_type":"choice","context_note":"","stem":"Don't make me _____ this or that. I'm too busy!","options":{"A":"to do","B":"do","C":"doing","D":"done"},"teaching":{"correct_answer":"B","explanation_md":"本题考查使役动词的用法。\n`make` 在这里是使役动词，意为“使、让”，其固定用法是 `make somebody do something`，即在宾语（sb.）后直接跟动词原形（do sth.）。\n句中 `me` 是宾语，因此其后应使用动词原形 `do`。\n选项A `to do` 是不定式，选项C `doing` 是现在分词，选项D `done` 是过去分词，均不符合该语法结构。","knowledge_expansion_md":"### 使役动词用法详解\n\n1.  **`make`, `let`, `have` + 宾语 + 动词原形**\n    这三个是最常见的使役动词，都要求宾语后跟不带 `to` 的不定式（即动词原形）。\n    *   `make sb. do sth.`：强迫/使得某人做某事（带有强制性）。例：`The teacher made the students clean the classroom.`\n    *   `let sb. do sth.`：允许/让某人做某事（带有许可性）。例：`Please let me know your decision.`\n    *   `have sb. do sth.`：叫/请某人做某事（带有安排、请求性）。例：`I'll have my assistant call you back.`\n\n2.  **被动语态中的变化**\n    当 `make` 用于被动语态 `be made ...` 时，其后的动词原形需要恢复 `to`，变成 `to do` 形式。\n    *   主动：`They made him work 12 hours a day.`\n    *   被动：`He was made to work 12 hours a day.`\n    *   注意：`let` 一般不用于被动语态，通常用 `be allowed to` 替代。\n\n3.  **其他需要宾补的动词**\n    与使役动词不同，大多数表示“要求、允许、告诉”等的动词，其宾补形式为带 `to` 的不定式。\n    *   `ask/tell/want/allow/encourage sb. to do sth.`\n    *   例：`My parents always encourage me to try new things.`","socratic_tracks":[{"title":"使役动词用法","steps":[{"question":"在句子 \"Don't make me _____ this or that\" 中，动词 `make` 是什么意思？它在这里起什么作用？","hint":"想想 \"make a cake\" (做蛋糕) 和 \"make me happy\" (让我开心) 中 `make` 的区别。","takeaway":"这里的 `make` 是使役动词，表示“使、让、强迫某人做某事”。"},{"question":"像 `make` 这样表示“让某人做某事”的动词，后面跟的动作应该是哪种形式？","hint":"回忆一下“让我走” (Let me go) 是怎么说的。","takeaway":"使役动词 `make`, `let`, `have` 后面需要跟宾语和动词原形，构成 `make/let/have sb. do sth.` 的结构。"},{"question":"如果把 `make` 换成 `ask` (要求)，这个句子应该怎么变？`Don't ask me _____ this or that.`","hint":"`ask` 后面跟动词原形吗？还是需要加点什么？","takeaway":"大多数动词如 `ask`, `tell`, `want` 后面需要跟带 `to` 的不定式，即 `ask sb. to do sth.`。"}]},{"title":"动词形式辨析","steps":[{"question":"选项中的 `to do`, `do`, `doing`, `done` 分别是动词 `do` 的什么形式？","hint":"`to do` 是带to的不定式，`do` 是不带to的不定式，也叫...？","takeaway":"它们分别是：带to的不定式、动词原形（不带to的不定式）、现在分词和过去分词。"},{"question":"为什么这里不能用 `doing` 或 `done`？它们通常用在什么句型中？","hint":"`doing` 常表示“正在做”，`done` 常表示“被做”或“已完成”。","takeaway":"`doing` 用于进行时态或作动名词，`done` 用于被动语态或完成时态，均不符合本句“让某人主动去做某事”的语境。"}]},{"title":"句意逻辑分析","steps":[{"question":"说话人说 \"I'm too busy!\"，结合前一句，他想表达一种怎样的心情？","hint":"一个很忙的人，会喜欢别人让他做这做那吗？","takeaway":"说话人感到不耐烦，不希望被强迫或指使去做各种事情。"},{"question":"哪个选项的动词形式能准确表达“强迫/使我去做”这个动作？","hint":"这是一个固定的语法结构，表示“使某人做某事”。","takeaway":"结构 `make sb. do sth.` 恰好表达了“使/强迫某人做某事”的含义，因此选择动词原形 `do` 最符合句意和语法。"}]}]}},{"number":"18","item_type":"choice","context_note":"","stem":"—Can you find the answer _____ the question?\n—Yes, it's too easy.","options":{"A":"to","B":"for","C":"with","D":"of"},"teaching":{"correct_answer":"A","explanation_md":"本题考查介词的固定搭配。\n在英语中，“某个问题的答案”的固定表达是 `the answer to the question`。\n这里的介词 `to` 表示一种对应关系，即“答案”是“对应于”这个“问题”的。\n虽然 `of` 有时也能表示所属关系，但在这一语境下，`to` 是最标准、最地道的用法。\n其他选项 `for`（为了）、`with`（和）均不符合该搭配习惯。","knowledge_expansion_md":"### 核心搭配：`... to ...`\n\n在英语中，很多表示“对应物”、“解决方案”或“入口”的名词，在与它们所对应的对象连接时，都习惯使用介词 `to`。这里的 `to` 是一个介词，后面跟名词或动名词。\n\n1.  **`the answer to sth.`**: ...的答案\n    *   `Do you know the answer to this math problem?`\n\n2.  **`the key to sth.`**: ...的钥匙；...的关键\n    *   `This is the key to the front door.`\n    *   `Hard work is the key to success.` (注意 `success` 是名词)\n\n3.  **`the solution to sth.`**: ...的解决方案\n    *   `We are trying to find a solution to the problem.`\n\n4.  **`the entrance/way/door to ...`**: 通往...的入口/路/门\n    *   `This is the main entrance to the museum.`\n\n**易混淆介词辨析**：\n*   `answer for sth.` 意为“为...负责任”，与“答案”无关。例：`You must answer for your actions.` (你必须为你的行为负责。)","socratic_tracks":[{"title":"介词 `to` 的固定搭配","steps":[{"question":"当我们说“门的钥匙”时，英文是 \"the key ___ the door\"，中间应该用哪个介词？","hint":"钥匙和门之间是一种什么样的关系？是“属于”还是“对应”？","takeaway":"我们用 \"the key to the door\"，这里的介词 `to` 表示一种对应关系。"},{"question":"类似地，当我们说“问题的解决方案”时，英文是 \"the solution ___ the problem\"，应该用哪个介词？","hint":"解决方案也是“对应于”问题而存在的。","takeaway":"同样使用介词 `to`，构成 \"the solution to the problem\"。"},{"question":"由此推断，“问题的答案”最地道的说法是什么？","hint":"答案也是对应于问题的。","takeaway":"最地道的说法是 \"the answer to the question\"，这也是一个固定搭配。"}]},{"title":"其他介词辨析","steps":[{"question":"为什么不能选 `of`？`the answer of the question` 从字面上翻译成“问题的答案”似乎也通顺。","hint":"语言不仅有语法规则，还有约定俗成的习惯用法。","takeaway":"虽然语法上勉强能理解，但 `the answer to the question` 是英语中更常用、更标准的固定搭配。"},{"question":"选项 `for` 通常表示什么意思？你能用 `answer for` 组一个短语并说明它的意思吗？","hint":"`for` 可以表示“为了”或“因为”。想想“为你的行为负责”。","takeaway":"`for` 常表示目的或原因，而 `answer for` 是一个固定短语，意为“对...负责”，与本题“答案”的语境完全不同。"}]},{"title":"从功能理解介词","steps":[{"question":"在这个句子里，“the question”（问题）和“the answer”（答案）之间是什么关系？","hint":"是答案从问题中来，还是答案指向问题？","takeaway":"答案是用来回应问题的，是针对问题而存在的，二者是“对应”或“指向”的关系。"},{"question":"A, B, C, D 四个介词中，哪一个最能表达这种“指向”或“对应”的含义？","hint":"想一想 `go to school` 里的 `to` 是什么意思。","takeaway":"介词 `to` 本身就常带有方向性，表示“朝向、对着”，在这里引申为“对应于”，最符合句意。"}]}]}},{"number":"19","item_type":"choice","context_note":"","stem":"Many people are unaware _____ the danger of polluting our environment.","options":{"A":"about","B":"of","C":"with","D":"to"},"teaching":{"correct_answer":"B","explanation_md":"本题考查形容词与介词的固定搭配。\n`unaware` 是一个形容词，意为“未意识到的，不知道的”。\n在英语中，`be unaware of something` 是一个固定短语，表示“没有意识到某事”。\n它的反义词组是 `be aware of something`，意为“意识到某事”，同样使用介词 `of`。\n因此，此处应填入介词 `of`。","knowledge_expansion_md":"### 形容词 + `of` 的常见搭配\n\n许多表示人的情感、状态或评价的形容词，后面习惯跟介词 `of` 来引出相关对象。\n\n1.  **表示“知道/意识到”**: `aware of`, `unaware of`, `conscious of`\n    *   `He was not aware of the danger.` (他没有意识到危险。)\n\n2.  **表示“充满/缺少”**: `full of`, `short
