 of`\n    *   `The basket is full of apples.` (篮子里装满了苹果。)\n\n3.  **表示“害怕/自豪/嫉妒”**: `afraid of`, `proud of`, `jealous of`\n    *   `She is very proud of her son.` (她为她的儿子感到非常自豪。)\n\n4.  **表示“厌烦/喜爱”**: `tired of`, `sick of`, `fond of`\n    *   `I'm tired of doing the same thing every day.` (我厌倦了每天做同样的事情。)\n\n**易错点**：学生可能会受到中文“关于”的影响而误选 `about`。虽然 `know about sth.` (知道关于某事) 是正确的，但 `be aware/unaware` 后面必须跟 `of`，这是固定用法，需要专门记忆。","socratic_tracks":[{"title":"形容词固定搭配","steps":[{"question":"题干中的 `unaware` 是什么词性？它是什么意思？","hint":"它描述了 `Many people` 的一种状态。`un-` 是一个表示否定的前缀。","takeaway":"`unaware` 是形容词，意思是“未意识到的、不知道的”。"},{"question":"`unaware` 的反义词是什么？","hint":"去掉表示否定的前缀 `un-` 即可。","takeaway":"`unaware` 的反义词是 `aware`，意为“意识到的”。"},{"question":"当我们说“意识到某事”时，`aware` 后面通常跟哪个介词？比如：`I am aware ___ the risk.`","hint":"这是一个非常常见的固定搭配。","takeaway":"`aware` 后面固定搭配介词 `of`，构成 `be aware of sth.`。"},{"question":"那么，作为其反义词，`unaware` 后面应该跟哪个介词呢？","hint":"反义词通常会使用相同的介词搭配结构。","takeaway":"`unaware` 同样与介词 `of` 搭配，构成固定短语 `be unaware of sth.`。"}]},{"title":"介词功能辨析","steps":[{"question":"为什么这里不能选 `about`？`about` 翻译成“关于”，“没有意识到关于这个危险”，听起来似乎也说得通。","hint":"英语中的介词搭配很多是约定俗成的，不能完全依赖中文翻译来选择。","takeaway":"虽然中文意思相近，但在英语中 `unaware` 这个词只和 `of` 搭配，`unaware about` 是错误的用法。"},{"question":"你能举出一些必须和 `about` 搭配的形容词吗？","hint":"想想表达“担心”或“激动”的词。","takeaway":"例如 `worried about` (担心), `anxious about` (焦虑), `excited about` (激动), `happy about` (对...感到高兴) 等形容词常与 `about` 搭配。"}]},{"title":"从句子结构理解","steps":[{"question":"这个句子的主干是什么？","hint":"找到主语、谓语动词和表语。","takeaway":"句子的主干是 “Many people are unaware”，这是一个“主-系-表”结构。"},{"question":"空格后面的部分 `_____ the danger of polluting our environment` 在句子中起什么作用？","hint":"它补充说明了 `unaware` 的什么？","takeaway":"这个介词短语作状语，用来修饰形容词 `unaware`，说明“未意识到”的具体对象是什么。"},{"question":"在“形容词 + 介词”这类结构中，介词的选择是由什么决定的？","hint":"是由介词本身的意思，还是由它前面的形容词决定的？","takeaway":"在这种结构中，介词的选择通常由前面的形容词决定，它们共同构成一个固定的短语。"}]}]}},{"number":"20","item_type":"choice","context_note":"","stem":"There is only _____ water in the bottle.","options":{"A":"a bit","B":"a bit of","C":"few","D":"a few of"},"teaching":{"correct_answer":"B","explanation_md":"本题考查量词的用法，特别是修饰不可数名词的量词。\n首先，判断名词类型：`water` (水) 是一个不可数名词。\n其次，分析选项：\n- A. `A bit` 单独使用时是副词短语，意为“有点儿”，用来修饰形容词或动词（如 `a bit tired`），不能直接修饰名词。\n- B. `a bit of` 意为“一点儿，少许”，是量词短语，专门用来修饰不可数名词。`a bit of water` (一点儿水) 是正确用法。\n- C. `few` (很少，几乎没有) 用来修饰可数名词复数。\n- D. `a few of` (一些) 也用来修饰可数名词复数，且其后常跟特指的名词（如 `a few of the students`）。\n综上，只有 `a bit of` 可以修饰不可数名词 `water`。","knowledge_expansion_md":"### 量词用法归纳\n\n1.  **修饰不可数名词**: `a little` (一点), `little` (几乎没有), `a bit of` (一点), `much` (许多), `a great deal of` (大量), `a large amount of` (大量)。\n    *   `There is only a little milk left.`\n\n2.  **修饰可数名词复数**: `a few` (一些), `few` (几乎没有), `many` (许多), `a number of` (一些), `several` (几个)。\n    *   `I have a few questions to ask.`\n\n3.  **既可修饰不可数名词，也可修饰可数名词复数**: `some` (一些), `any` (任何), `a lot of / lots of` (许多), `plenty of` (充足的)。\n    *   `a lot of water` / `a lot of books`\n\n**重点辨析**：\n*   **`a bit` vs. `a bit of`**: `a bit` 是副词短语，修饰形容词、副词或动词，意为“有点儿”。`a bit of` 是量词短语，修饰不可数名词，意为“一点儿”。\n    *   `He is a bit shy.` (他有点害羞。)\n    *   `I need a bit of help.` (我需要一点帮助。)\n*   **`a little/little` vs. `a few/few`**: 前两者修饰不可数名词，后两者修饰可数名词复数。带 `a` 的表示肯定（有一些），不带 `a` 的表示否定（几乎没有）。\n    *   `a little hope` (一点希望) vs. `little hope` (几乎没希望)\n    *   `a few friends` (几个朋友) vs. `few friends` (几乎没朋友)","socratic_tracks":[{"title":"名词可数性判断","steps":[{"question":"在选择量词之前，我们首先要看它修饰的名词。这个句子中要修饰的名词是什么？","hint":"看空格后面的单词。","takeaway":"要修饰的名词是 `water`（水）。"},{"question":"`water` 是可数名词还是不可数名词？","hint":"我们能说“一个水，两个水”吗？","takeaway":"`water` 是不可数名词。"},{"question":"知道了 `water` 是不可数名词，选项 C `few` 和 D `a few of` 还能选吗？为什么？","hint":"回忆一下 `few` 和 `a few` 是用来修饰哪类名词的？","takeaway":"不能选。因为 `few` 和 `a few (of)` 都是用来修饰可数名词复数的。"}]},{"title":"量词用法辨析","steps":[{"question":"剩下的选项 A `A bit` 和 B `a bit of` 有什么区别？","hint":"一个后面可以直接跟名词吗？另一个呢？","takeaway":"`a bit of` 是一个完整的量词短语，后面必须跟名词；而 `a bit` 单独使用时是副词，不能直接跟名词。"},{"question":"你能用 `a bit` 这个副词短语造一个句子吗？","hint":"用它来形容你“有点累”了。","takeaway":"`a bit` 作副词用，例如：`I'm a bit tired.`，用来修饰形容词 `tired`。"},{"question":"那么，要修饰名词 `water`，我们应该选择哪个结构？","hint":"我们需要一个能和名词 `water` 连接起来的量词短语。","takeaway":"必须使用 `a bit of` 这个完整的量词短语来修饰不可数名词 `water`。"}]},{"title":"同义表达替换","steps":[{"question":"句子中的 `only` 暗示了水量是多还是少？","hint":"`only` 的意思是“仅仅，只有”。","takeaway":"`only` 暗示了水量很少。"},{"question":"除了 `a bit of`，还有哪个常见的量词可以替换它，并且意思几乎不变？","hint":"想想另一个表示“一点点”并修饰不可数名词的词。","takeaway":"可以用 `a little` 来替换，句子变成 `There is only a little water in the bottle.`。"},{"question":"如果把不可数名词 `water` 换成可数名词复数 `apples`，这句话应该怎么说？","hint":"瓶子里只有几个苹果。","takeaway":"句子应该改成 `There are only a few apples in the bottle.`，同时 `is` 也要变成 `are`。"}]}]}},{"number":"21","item_type":"choice","context_note":"","stem":"Mr. Brown will introduce us _____ western art next week.","options":{"A":"to","B":"in","C":"on","D":"for"},"teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配的用法。`introduce sb to sth` 是一个固定的动词短语，意为“向某人介绍某事物”或“使某人初次接触某事物”。句意为：“下周布朗先生将向我们介绍西方艺术。”根据这个结构，空格处应填入介词 `to`。其他介词 `in`（在...里面）、`on`（在...上面；关于）均不与 `introduce` 构成此意。","knowledge_expansion_md":"动词 `introduce` 的用法拓展：\n1.  **`introduce sb to sb`**: 意为“把某人介绍给另一人”。例如：`Let me introduce my friend, Jack, to you.` (让我把我的朋友杰克介绍给你。)\n2.  **`introduce sb to sth`**: 意为“向某人介绍/引荐某事物”。例如：`This book will introduce you to the basics of coding.` (这本书将带你入门编程基础。)\n3.  **`introduce oneself`**: 意为“自我介绍”。例如：`Could you please introduce yourself to the class?` (你能向全班同学做个自我介绍吗？)\n\n**易错点**：学生可能会受“关于艺术的讲座 (a lecture on art)”中介词 `on` 的影响而误选。需牢记 `introduce` 在此语境下与 `to` 的固定搭配关系，表示一种“引见、引导”的方向性。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"当你想把你的朋友介绍给你的家人时，你会说 \"Let me introduce my friend ___ you.\"，空格里应该用哪个词？","hint":"想一想“介绍给某人”这个动作带有方向性，通常用哪个介词来表示“朝向”？","takeaway":"“把某人介绍给另一人”的固定搭配是 `introduce sb to sb`。"},{"question":"那么，从“介绍一个人”延伸到“介绍一个事物”，比如“向学生们介绍一门新课程”，这个搭配的结构会改变吗？","hint":"无论是人还是事物，都是被“介绍”这个动作引向接受者的。","takeaway":"这个结构是通用的，`introduce sb to sth` 表示“向某人介绍某事物”。"}]},{"title":"介词辨析","steps":[{"question":"为什么这里不能用 `on`？我们什么时候会用 `on` 来谈论一个话题？","hint":"想一想“a book on history”（一本关于历史的书）或“a speech on environment”（一场关于环境的演讲）。","takeaway":"`on` 可以表示“关于”某个主题，但它不与 `introduce` 构成“介绍”的固定搭配。"},{"question":"为什么不能用 `in`？我们常说 `be interested in art`，这里的 `in` 表示什么？","hint":"`in` 通常表示在某个领域、范围或兴趣“之内”。","takeaway":"`in` 表示“在...之中”，而 `introduce` 是一个引导性的动作，需要用 `to` 来表示方向。"}]},{"title":"句意理解","steps":[{"question":"分析句子结构，`introduce` 这个动作的直接对象（宾语）是谁？","hint":"动作的直接承受者是 `us`（我们）。","takeaway":"句子的核心结构是 `Mr. Brown will introduce us`（布朗先生将介绍我们）。"},{"question":"`western art` 在句子中扮演什么角色？它和 `us` 是什么关系？","hint":"`western art` 是被介绍的内容，是介绍这个动作所指向的对象。","takeaway":"介词 `to` 在这里起到了桥梁作用，连接了动作的接受者 `us` 和被介绍的内容 `western art`。"}]}]}},{"number":"22","item_type":"choice","context_note":"","stem":"He was angry _____ but after he read the letter, he laughed.","options":{"A":"first","B":"the first","C":"at first","D":"at the first"},"teaching":{"correct_answer":"C","explanation_md":"本题考查固定短语的辨析。`at first` 是一个固定短语，意为“起初，刚开始的时候”，通常用来描述一种初始状态，且后文常有 `but` 或 `later` 等词引导的转折，表示情况的变化。句意为：“起初他很生气，但在读了信之后，他笑了。”，前后情绪发生转变，使用 `at first` 完全符合语境。`first` 作为副词意为“首先”，用于列举顺序；`the first` 是序数词；`at the first` 不是固定搭配。","knowledge_expansion_md":"**`at first` vs. `first` vs. `in the first place`**\n\n1.  **`at first`**: 意为“起初，开始时”，强调与后来情况的**对比**。常用于句首或句中，后文常有转折连词 `but`。\n    *   例：`At first I didn't like the city, but now I love it.` (起初我不喜欢这个城市，但现在我爱上它了。)\n\n2.  **`first`**: 作为副词，意为“首先”，用于引出系列动作或观点中的**第一项**，表示顺序，常与 `second`, `then`, `finally` 等连用。\n    *   例：`First, mix the flour and eggs. Then, add some sugar.` (首先，混合面粉和鸡蛋。然后，加一些糖。)\n\n3.  **`in the first place`**: 意为“首先，首要的是”，常用于**列举理由**，语气比 `first` 更强，强调第一个理由的重要性。\n    *   例：`I can't go to the party. In the first place, I have to study for a test.` (我不能去派对。首先，我得复习备考。)","socratic_tracks":[{"title":"短语辨析","steps":[{"question":"观察句子后半部分 `but after he read the letter, he laughed`。连词 `but` 告诉我们前后两种情绪是什么关系？","hint":"`but` 表示转折，说明前后情况是相反或不同的。","takeaway":"句子描述了一个从“生气”到“笑”的情绪转变过程。"},{"question":"在 `first` 和 `at first` 中，哪一个短语专门用来表达这种“起初……后来……”的对比和转变？","hint":"试着把 `First, he was angry.` 放在一个列举顺序的句子里，比如 `First, he was angry. Second, he was sad.`","takeaway":"固定短语 `at first` 专门用于表示“起初”的状态，并暗示了后续的变化。"}]},{"title":"语境逻辑","steps":[{"question":"这个句子描述的是一系列按顺序发生的独立事件，还是一个状态随时间的变化？","hint":"“生气”和“笑”是针对同一件事（读信）前后的不同反应。","takeaway":"句子描述的是一个状态的变化，而不是一个步骤列表。"},{"question":"既然是描述状态变化，我们需要一个表示“初始阶段”的词。四个选项中，哪个最符合“在刚开始的时候”这个意思？","hint":"哪个选项翻译成中文是“起初”？","takeaway":"只有 `at first` 准确地表达了“起初”的含义，与后文的转折逻辑完美契合。"}]},{"title":"固定搭配的完整性","steps":[{"question":"为什么选项 B `the first` 和 D `at the first` 不正确？`the first` 通常怎么用？","hint":"想一想 `the first person to arrive` (第一个到的人) 或者 `the first day of school` (开学第一天)。","takeaway":"`the first` 是序数词用法，用来指明特定的顺序，不符合本句的副词功能。"},{"question":"`at first` 是一个固定短语，我们能随意在中间加上 `the` 变成 `at the first` 吗？","hint":"很多英语中的固定短语（如 `at last`, `in fact`, `on foot`）都是约定俗成的，不能随意增减词语。","takeaway":"`at first` 是一个不可分割的固定短语，不能随意添加冠词。"}]}]}},{"number":"23","item_type":"choice","context_note":"","stem":"They _____ Shanghai for the next week.","options":{"A":"tour","B":"will tour","C":"toured","D":"has toured"},"teaching":{"correct_answer":"B","explanation_md":"本题考查动词时态的正确使用。句中的时间状语 `for the next week` 意为“在接下来的一周”，明确指出了动作将发生在未来的时间段内。因此，谓语动词需要使用将来时态。选项 A `tour` 是一般现在时，选项 C `toured` 是一般过去时，选项 D `has toured` 是现在完成时，均不符合题意。只有选项 B `will tour` 是一般将来时（will + 动词原形），是正确答案。","knowledge_expansion_md":"**表示将来的主要方式总结：**\n\n1.  **`will + 动词原形`**：最常用的一般将来时。用于表达：\n    *   客观的将来事实：`The sun will rise tomorrow.`\n    *   临时的决定：`It's cold. I'll close the window.`\n    *   意愿、许诺：`I will help you.`\n\n2.  **`be going to + 动词原形`**：用于表达：\n    *   事先计划好的打算：`We are going to have a party this weekend.`\n    *   有迹象表明即将发生的事：`Look at the dark clouds. It's going to rain.`\n\n3.  **`现在进行时 (be doing)`**：用于表示按计划或安排即将发生的动作，尤其指近期内确定会发生的个人安排，常与表示位移的动词（如 `go`, `come`, `leave`, `arrive`）连用。\n    *   `She is flying to Paris tomorrow morning.`\n\n4.  **`一般现在时`**：用于表示按时刻表、日程安排等固定要发生的将来动作。\n    *   `The train leaves at 8:00 a.m. tomorrow.`","socratic_tracks":[{"title":"抓住时间状语","steps":[{"question":"要判断一个句子的时态，我们首先应该寻找什么关键信息？","hint":"通常是表示时间的词或短语。","takeaway":"判断时态的关键是找到句中的时间状语。"},{"question":"这个句子中的时间状语是什么？它指向过去、现在还是将来？","hint":"注意 `next week` 这个短语。","takeaway":"时间状语是 `for the next week`（在接下来的一周），明确指向将来。"},{"question":"既然动作发生在将来，我们应该选择哪种时态来表达？","hint":"表达将来的基本时态结构是什么？","takeaway":"描述将来的动作，应使用一般将来时，其基本结构是 `will + 动词原形`。"}]},{"title":"辨析不同时态","steps":[{"question":"如果选 A `tour`（一般现在时），句子表达的是什么意思？适用于这个语境吗？","hint":"一般现在时通常表示习惯或真理，比如 `They tour Shanghai every year.`","takeaway":"一般现在时与表示将来时间的 `next week` 矛盾。"},{"question":"如果选 C `toured` 或 D `has toured`，它们分别表示什么时间？与 `next week` 匹配吗？","hint":"这两个时态都与过去的动作有关。","takeaway":"过去时态和现在完成时都与将来时间状语 `next week` 冲突，造成逻辑错误。"}]},{"title":"将来时的不同表达","steps":[{"question":"除了 `will tour`，我们还可以用什么其他方式来表达“他们下周将游览上海”这个计划？","hint":"想一想表示“打算”的那个结构。","takeaway":"我们也可以用 `be going to`，说成 `They are going to tour Shanghai for the next week.`"},{"question":"在本题的四个选项中，哪一个最直接、最准确地表达了将要发生的动作？","hint":"直接考察一般将来时的构成。","takeaway":"选项 `will tour` 是标准的一般将来时形式，是本题的最佳答案。"}]}]}}]},{"section_title":"IV. 完形填空 (共20分)","section_instruction":"It was the last day of school and I planned to travel to my friend's hometown. I hadn't seen him for years and this was a good __1__ to meet him again.\nI was busy at school, so it was rather __2__ when I came back home. It was already 10 o'clock at night. Time was running out. After a hurried meal, I left, __3__ I found a taxi very soon. Asking the driver to drive me fast to the station, I relaxed for a while, imagining what my friend looked like now. I was soon at the station and was sure that I would be able to __4__ the train. Unfortunately, I fell on the way and lost some time. To my complete __5__, when I reached the platform, I saw that the train had just left! It was the last train, so I had to __6__ home.\nMy mother was glad to see me back as she had a feeling about my trip. But I was unhappy. I tried to relax and went to bed, but I had a __7__ sleep. The next morning I was very tired. As I was having breakfast, the __8__ arrived. I read over the pages and was shocked to __9__ that the train I missed had an accident. How __10__ I was that I missed the train!","items":[{"number":"24","item_type":"choice","context_note":"Passage for questions 1-10","stem":"1","options":{"A":"sign","B":"chance","C":"sense","D":"dream"},"teaching":{"correct_answer":"B","explanation_md":"本题考查名词词义辨析。根据上文，作者很多年没见朋友了，这次旅行是一个和他重逢的好“机会”。`a good chance to do sth.` 是固定搭配，意为“做某事的好机会”，符合语境。选项 A `sign` 意为“标志，信号”；C `sense` 意为“感觉，意识”；D `dream` 意为“梦想”。均不符合题意。","knowledge_expansion_md":"**核心词汇辨析**\n\n在完形填空中，辨析形近或义近的词汇是关键能力。本题的四个选项都是初中阶段的核心名词：\n\n*   **`chance` (机会，机遇)**: 强调可能性或时机。常用于 `a chance to do sth.` (做某事的机会) 或 `give sb a chance` (给某人一个机会)。它与 `opportunity` 近义。\n*   **`sign` (标志，迹象)**: 指示或预示某事物的符号或现象。例如：`A red sky at night is a sign of good weather.` (晚霞是好天气的迹象。)\n*   **`sense` (感觉，官能)**: 指人的五感（视觉、听觉等），或是一种模糊的直觉、意识。例如：`a sense of danger` (危险感)，`a sense of humor` (幽默感)。\n*   **`dream` (梦想，梦)**: 指睡眠中的梦境，或指内心的愿望和抱负。例如：`His dream is to become an astronaut.` (他的梦想是成为一名宇航员。)\n\n**解题技巧**：做完形填空时，即使某个词单独看是正确的，也必须代入原文，通读前后句，确保语义连贯、逻辑通顺。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"请分别说出 `sign`, `chance`, `sense`, `dream` 这四个词最基本的意思。","hint":"sign-标志；chance-机会；sense-感觉；dream-梦想。","takeaway":"准确理解每个选项的核心词义是解题的第一步。"},{"question":"如果一个句子想表达“我获得了一个可以……的时机”，这四个词中哪个最合适？","hint":"“时机”和哪个词的意思最接近？","takeaway":"`chance` 的核心含义是“机会、时机”，最符合该语境。"}]},{"title":"搭配用法","steps":[{"question":"我们经常说“一个做某事的机会”，英文的固定搭配是什么？","hint":"a ___ to do sth.","takeaway":"`a chance to do sth.` 是一个非常常见的固定搭配。"},{"question":"`a dream to do sth.` 也是一个可能的搭配，它和 `a chance to do sth.` 有什么区别？","hint":"`dream` 更多是内心的愿望，而 `chance` 是外部的客观条件或时机。","takeaway":"`dream` 强调主观愿望，`chance` 强调客观机遇。"}]},{"title":"语境推断","steps":[{"question":"假设空格前有一个形容词 `great` (绝佳的)，我们可以说 `a great chance` 和 `a great dream`。但为什么 `a great sense` 听起来很奇怪？","hint":"`sense` (感觉) 通常用 `strong` (强烈的) 或 `good` (好的) 来修饰，比如 `a strong sense of responsibility`。","takeaway":"形容词和名词的搭配是有限的，这可以帮助我们排除错误选项。"},{"question":"在“梦想”和“机会”之间，哪一个更能直接引出一个具体的行动？","hint":"人们有了“机会”之后才能去行动，从而实现“梦想”。","takeaway":"在描述一个具体的行动时机时，`chance` 比 `dream` 更为直接和贴切。"}]}]}},{"number":"25","item_type":"choice","context_note":"Passage for questions 1-10","stem":"2","options":{"A":"strange","B":"cold","C":"late","D":"quiet"},"teaching":{"correct_answer":"C","explanation_md":"本题考查形容词词义辨析。根据后文“It was already 10 o'clock at night.”（已经是晚上10点了），可知作者回家时天色已“晚”。因此，`late` (晚的) 最符合语境。选项 A `strange` 意为“奇怪的”；B `cold` 意为“寒冷的”；D `quiet` 意为“安静的”。均不符合此处描述时间的情景。","knowledge_expansion_md":"### 词义辨析与用法\n\n1.  **`late` vs. `lately`**: \n    *   `late` (adj./adv.) 意为“晚的，迟的”。例如：`The train is late.` (火车晚点了。) `He came late.` (他来晚了。)\n    *   `lately` (adv.) 意为“最近，近来”，相当于 `recently`，常与现在完成时连用。例如：`Have you seen him lately?` (你最近见到他了吗？)\n\n2.  **相关时间表达**: \n    *   `be late for...`: 因某事而迟到。例如：`Don't be late for school.` (上学别迟到。)\n    *   `on time`: 准时。例如：`The train arrived on time.` (火车准时到达。)\n    *   `in time`: 及时。例如：`We arrived in time to catch the movie.` (我们及时赶到，看上了电影。)","socratic_tracks":[{"title":"上下文逻辑推理","steps":[{"question":"空格后的句子 ‘It was already 10 o'clock at night.’ 告诉了我们什么信息？","hint":"这句话直接描述了当时的时间。","takeaway":"这句话明确指出当时已经是晚上十点，时间很晚了。"},{"question":"既然时间很晚了，那么用哪个形容词来描述作者回家时的状况最合适？","hint":"哪个选项和时间晚有关？","takeaway":"在四个选项中，只有 `late` (晚的) 与时间晚的语境直接相关。"}]}]}},{"number":"26","item_type":"choice","context_note":"Passage for questions 1-10","stem":"3","options":{"A":"Finally","B":"Suddenly","C":"Strangely","D":"Luckily"},"teaching":{"correct_answer":"D","explanation_md":"本题考查副词的语境应用。根据上文，作者时间紧迫（‘Time was running out’），急着去车站。在这种情况下，很快就找到了出租车，对他来说是一件“幸运”的事。因此 D `Luckily` (幸运地) 最符合语境和作者当时的心情。A `Finally` (最后，终于) 暗示经过了漫长等待，与 ‘very soon’ 矛盾。B `Suddenly` (突然地) 强调事件的意外性，但不如 `Luckily` 贴合此处“运气好”的含义。C `Strangely` (奇怪地) 不合逻辑。","knowledge_expansion_md":"### 叙事性副词辨析\n\n这类副词常置于句首，用来衔接上下文，推动故事情节发展，或表达作者/人物的态度。\n\n1.  **`Luckily` (幸运地)**: 表达说话人对事件的积极评价，强调事件带来的好运。它侧重于“评价”。\n2.  **`Suddenly` (突然地)**: 强调事件发生的急促和出人意料，侧重于“发生方式”。\n3.  **`Finally` (最后，终于)**: 强调经过长时间的等待、努力或一系列事件之后，某事最终发生。\n4.  **`Unfortunately` (不幸地)**: 与 `Luckily` 相对，表达对事件的消极评价。\n\n在本语境中，作者正处于赶时间的困境中，“很快找到出租车”是一个积极的转折，因此使用表达“幸运”的 `Luckily` 最能体现作者当时的心境。","socratic_tracks":[{"title":"语境与情感判断","steps":[{"question":"根据文章，作者当时处于什么状况？他的心情是怎样的？","hint":"文中提到 ‘Time was running out’ (时间不多了)。","takeaway":"作者很匆忙，心情是焦虑的。"},{"question":"对于一个赶时间的人来说，‘very soon’ (很快) 就找到了出租车，这件事的性质是什么？","hint":"是好事还是坏事？","takeaway":"这是一件幸运的好事。"},{"question":"比较 `Suddenly` 和 `Luckily`。哪个词更能表达‘这是一件幸运的好事’这层意思？","hint":"`Suddenly` 强调突然，`Luckily` 强调幸运。","takeaway":"`Luckily` 直接表达了事件的幸运性质，比 `Suddenly` 更贴合作者当时的需求和感受。"}]}]}},{"number":"27","item_type":"choice","context_note":"Passage for questions 1-10","stem":"4","options":{"A":"stop","B":"see","C":"catch","D":"miss"},"teaching":{"correct_answer":"C","explanation_md":"本题考查动词辨析。根据语境，作者赶到车站，并且‘was sure that’（确信）自己能够做某事。结合常识，赶火车的目标是“赶上”火车。`catch the train` 是固定搭配，意为“赶上火车”，符合文意。选项 D `miss the train` (错过火车) 与作者当时自信的心情（`was sure`）完全相反。选项 A `stop` (停止) 和 B `see` (看见) 也不符合逻辑。","knowledge_expansion_md":"### 易混词辨析：`catch` vs. `miss`\n\n这两个动词在谈论交通工具时是一对反义词。\n\n*   **`catch` (赶上)**: 指成功地登上或乘坐上交通工具。例如：`I ran fast and caught the last bus.` (我跑得很快，赶上了最后一班公交车。)\n*   **`miss` (错过)**: 指未能赶上交通工具。例如：`If we don't hurry, we'll miss the train.` (如果我们不快点，就会错过火车。)\n\n解题关键在于理解作者当时的心态。文中的 `was sure that` (确信) 表明作者当时是乐观的，认为自己能成功，所以应该选择 `catch`。","socratic_tracks":[{"title":"关键词与逻辑推理","steps":[{"question":"请找出空格前表达作者心情的关键词。","hint":"在 `I would be able to` 之前。","takeaway":"关键词是 `was sure` (确信)。"},{"question":"‘确信’是一种怎样的心态？是积极的还是消极的？","hint":"是自信的，认为能成功的。","takeaway":"这是一种积极、乐观的心态。"},{"question":"在 `catch the train` (赶上火车) 和 `miss the train` (错过火车) 中，哪一个代表了积极、成功的结果？","hint":"哪个是你想要的结果？","takeaway":"`catch the train` 代表成功的结果。"},{"question":"结合作者‘确信’的心态，他当时认为自己能做到的是什么？","hint":"是赶上火车，还是错过火车？","takeaway":"他确信自己能赶上火车，因此选 `catch`。"}]}]}},{"number":"28","item_type":"choice","context_note":"Passage for questions 1-10","stem":"5","options":{"A":"satisfaction","B":"hope","C":"surprise","D":"joy"},"teaching":{"correct_answer":"C","explanation_md":"本题考查名词辨析和固定句式。`To one's complete ___` 意为“完全令某人……的是”。根据后文，作者发现火车刚刚离开（`the train had just left!`），这与他之前确信能赶上的预期完全相反，是一个令人震惊的意外。因此，`surprise` (惊讶，意外) 最能表达这种震惊和出乎意料的心情。选项 A `satisfaction` (满意)，B `hope` (希望) 和 D `joy` (喜悦) 都是积极情感，与作者错过火车后的沮丧心情（下文提到 `I was unhappy`）完全不符。","knowledge_expansion_md":"### 固定句式：`To one's + 情感名词`\n\n这个结构常用于句首，作状语，用来引出某个出人意料或引发强烈情感的事件，可以使叙事更加生动。\n\n*   **`To my surprise, ...`** (令我惊讶的是……)\n*   **`To my joy, ...`** (令我高兴的是……)\n*   **`To my relief, ...`** (令我松了一口气的是……)\n*   **`To my disappointment, ...`** (令我失望的是……)\n*   **`To my satisfaction, ...`** (令我满意的是……)\n\n### 情感名词辨析\n*   `surprise` (n. 惊讶): 强调事情的不可预见性、出乎意料。\n*   `joy` (n. 喜悦): 强调内心深处的快乐和幸福感，比 `happiness` 更强烈。\n*   `satisfaction` (n. 满意): 强调愿望或需求得到满足后的感觉。\n*   `hope` (n. 希望): 强调对未来的期盼和向往。\n\n在描述一个巧合事件时，`surprise` 通常是第一层情感，其后可能会伴随 `joy` 或 `disappointment`。","socratic_tracks":[{"title":"前后文对比与情感推断","steps":[{"question":"在这一句之前，作者对赶上火车是什么态度？","hint":"回顾第4题，作者 ‘was sure’ (确信) 能赶上火车。","takeaway":"作者非常自信能赶上火车。"},{"question":"而这一句的实际结果是什么？","hint":"他到达站台时，看到了什么？","takeaway":"他看到火车已经开走了。"},{"question":"当一个人的预期和现实结果完全相反时，他首先会感到什么？","hint":"比如你以为考试得了100分，结果却不及格。","takeaway":"首先会感到震惊、意外。"},{"question":"在四个选项中，哪个词最能表达这种‘震惊、意外’的感觉？","hint":"satisfaction (满意), hope (希望), surprise (惊讶), joy (喜悦)","takeaway":"`surprise` 是最恰当的词，表达了事情完全出乎意料。"}]}]}},{"number":"29","item_type":"choice","context_note":"Passage for questions 1-10","stem":"6","options":{"A":"call","B":"leave","C":"return","D":"miss"},"teaching":{"correct_answer":"C","explanation_md":"该题考察动词词义辨析和上下文理解。根据故事情节，主角Mr. Black在外地乘火车，故事结尾处他需要回家。因此，“买另一张票回家”是符合逻辑的。选项A“打电话回家”、B“离开家”（与语境相反）、D“想家”（表达情感而非动作）均不符合句意。`return home`意为“回家”，是正确答案。","knowledge_expansion_md":"### 词义辨析：`return`, `call`, `leave`, `miss`\n\n- **return**: v. 返回，归还。`return home` 是固定搭配，意为“回家”。例如：`He will return to China next month.` (他下个月将返回中国。)\n- **call**: v. 呼叫，打电话。`call home` 意为“给家里打电话”。例如：`Please call me when you arrive.` (你到达后请给我打电话。)\n- **leave**: v. 离开。`leave home` 意为“离家”，指从家里出发，与“回家”方向相反。例如：`What time do you leave for school?` (你几点动身去上学？)\n- **miss**: v. 错过，想念。`miss home` 意为“想家”，表达一种情感状态，而非一个需要买票去完成的动作。例如：`I miss my family.` (我想念我的家人。)\n\n在语境中，主角需要买票完成一个位移动作，且方向是“返回”，故选 `return`。","socratic_tracks":[{"title":"动词词义辨析","steps":[{"question":"这句话说他不得不另买一张票来做什么？注意动词后面的词是 'home' (家)。","hint":"一个在外旅行的人，买票通常是为了去某个地方或返回。","takeaway":"他需要买票“回家”。"},{"question":"四个选项中，哪个动词有“返回”的意思？","hint":"想一想“还书给图书馆”可以说 `return a book to the library`。","takeaway":"`return` 的意思是“返回”或“归还”。"},{"question":"为什么其他选项不对？例如，`leave home` 是什么意思？","hint":"`leave` 是“离开”，`leave home` 是从家出发，方向与“回家”正好相反。","takeaway":"理解动词的准确含义和所表达的方向是解题的关键。"}]},{"title":"上下文逻辑推理","steps":[{"question":"根据故事，Mr. Black 此刻在哪里？是在自己家还是在外地？","hint":"他乘火车去旅行，现在故事快结束了。","takeaway":"他正在外地，所以接下来的动作应该是“回家”。"},{"question":"他为什么需要“再买一张”票？","hint":"他原来的火车票发生了什么事？","takeaway":"他原来的票找不到了，所以需要买新的票才能完成回家的行程。"}]},{"title":"不定式表目的","steps":[{"question":"句中的 `to ___ home` 是什么语法成分？它在说明什么？","hint":"它跟在 `buy another ticket` 后面，说明买票是为了……","takeaway":"动词不定式 `to do` 在这里作目的状语，解释买票的目的。"},{"question":"既然是解释买票的目的，那么结合上下文，最合理的目的应该是什么？","hint":"一个在外旅行的人，买一张回程票的目的是什么？","takeaway":"最合理的目的就是“回家”，因此选择表达“返回”意思的动词 `return`。"}]}]}},{"number":"30","item_type":"choice","context_note":"Passage for questions 1-10","stem":"7","options":{"A":"deep","B":"had","C":"great","D":"heavy"},"teaching":{"correct_answer":"C","explanation_md":"该题考察固定搭配。当Mr. Black在火车上找不到票时，他陷入了困境。`in trouble` 是一个固定短语，意为“遇到麻烦”。为了强调麻烦的程度，通常会在前面加上形容词。`in great trouble` 或 `in deep trouble` 都是正确的表达，意为“遇到大麻烦”。在小升初阶段的语料中，`in great trouble` 更为常见。选项D `heavy` 不与 `trouble` 搭配。选项B `had` 是动词，无法放在介词 `in` 之后，正确的结构应为 `He had trouble`。","knowledge_expansion_md":"### 固定搭配与词性辨析\n\n1.  **固定搭配**：\n    *   `in trouble`: 处在麻烦中。\n    *   `in great/deep trouble`: 处在大麻烦中。`great` 和 `deep` 都可以用来加强语气，`great` 更偏向口语化和普遍性。\n    *   `get into trouble`: 惹上麻烦（强调动作）。\n    *   `have trouble (in) doing sth.`: 做某事有困难。\n\n2.  **词性与结构**：\n    *   句子 `He was in ___ trouble.` 中，`in` 是介词，`trouble` 是名词，空格处需要一个**形容词**来修饰名词 `trouble`。\n    *   选项 `deep`, `great`, `heavy` 都是形容词，而 `had` 是动词 `have` 的过去式。\n    *   动词 `had` 不能放在 `in...trouble` 的结构中。如果使用 `had`，句子应为 `He had trouble.`，表示“他有麻烦了”。","socratic_tracks":[{"title":"固定搭配 'in trouble'","steps":[{"question":"短语 `in ___ trouble` 是什么意思？","hint":"当一个人找不到火车票时，他的处境是怎样的？","takeaway":"这个短语用来形容某人“处在麻烦之中”。"},{"question":"我们通常用什么形容词来加强 `trouble` 的程度，表示“大麻烦”？","hint":"想一想“一个很棒的主意”怎么说？`a ___ idea`。","takeaway":"常用 `great` 或 `deep` 来修饰 `trouble`，表示麻烦很大。"},{"question":"为什么不能选 `heavy`？","hint":"`heavy` 通常形容重量或数量，比如“大雨”是 `heavy rain`。","takeaway":"`heavy` 和 `trouble` 在此语境下不构成习惯搭配。"}]},{"title":"词性与句子结构","steps":[{"question":"分析句子 `He was in ___ trouble.`，空格处需要填什么词性的词？","hint":"介词 `in` 和名词 `trouble` 中间，通常放什么词来修饰名词？","takeaway":"空格处需要一个形容词来修饰名词 `trouble`。"},{"question":"看看选项 A, B, C, D，哪些是形容词？","hint":"`had` 是 `have` 的过去式，它是什么词性？","takeaway":"`deep`, `great`, `heavy` 是形容词，而 `had` 是动词。"},{"question":"既然 `had` 是动词，为什么它不能填入空格？","hint":"如果用 `had`，句子结构应该是怎样的？","takeaway":"动词 `had` 不能放在介词 `in` 和名词 `trouble` 之间。正确的句子结构是 `He had trouble.`，中间没有 `in`。"}]},{"title":"形容词搭配辨析","steps":[{"question":"选项 `deep`, `great`, `heavy` 都可以表示“程度深”或“大”，但用法有什么不同？","hint":"分别用它们造个词组，比如 `___ rain`, `___ sea`, `___ fun`。","takeaway":"不同的形容词有不同的搭配习惯，不能随意替换。"},{"question":"在形容“麻烦”时，英语中最自然的说法是哪一个？","hint":"在口语和常见故事中，`in great trouble` 和 `in deep trouble` 哪个更常用？","takeaway":"`in great trouble` 是一个非常地道和常见的表达。"}]}]}},{"number":"31","item_type":"choice","context_note":"Passage for questions 1-10","stem":"8","options":{"A":"newspaper","B":"ticket","C":"milk","D":"train"},"teaching":{"correct_answer":"B","explanation_md":"该题考察上下文理解和复合名词。前一句说“他突然找到了票（the ticket）”。本句以`But`开头，表示转折，说明找到的这张票不是他要找的那张。他要找的是什么票呢？是“火车票”。因此，`train`后面应该跟`ticket`，组成复合名词`train ticket`（火车票），以澄清票的种类。其他选项放入后均不符合逻辑。","knowledge_expansion_md":"### 复合名词 (Compound Nouns)\n\n英语中常将两个或多个名词放在一起，形成一个具有新意义的名词，即复合名词。在“名词 + 名词”的结构中，第一个名词通常起形容词的作用，说明第二个名词的种类、用途或属性。\n\n- **结构**: `noun 1 + noun 2`\n- **例子**:\n  - `train ticket` (火车票)\n  - `bus stop` (公交车站)\n  - `school gate` (校门口)\n  - `coffee shop` (咖啡店)\n  - `newspaper boy` (送报男童)\n\n理解复合名词的构成和意义，有助于在阅读和填空中快速锁定答案。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"这句话的前一句说了什么？","hint":"原文是 `Suddenly he found the ticket.`","takeaway":"前文说他找到了一张票。"},{"question":"这句话以 `But` (但是) 开头，暗示了什么？","hint":"`But` 表示转折，说明情况和他预想的不一样。","takeaway":"转折意味着他找到的这张票有问题，或者不是他想要的那张。"},{"question":"他一直在找的是什么？","hint":"故事开头，他要去乘火车旅行。","takeaway":"他一直在找的是火车票。"},{"question":"所以，为了说明找到的不是那张正确的票，`train` 后面应该跟哪个词？","hint":"组成“火车票”这个词组。","takeaway":"空格处应填 `ticket`，构成 `train ticket`，与上下文呼应。"}]},{"title":"复合名词","steps":[{"question":"像 `train ___` 这样，一个名词修饰另一个名词的结构叫什么？","hint":"比如 `school bag` (书包) 和 `book store` (书店)。","takeaway":"这叫做复合名词，第一个名词用来限定第二个名词。"},{"question":"在这个故事里，`train` 和哪个词组合在一起最合理？","hint":"整个故事都围绕着乘火车和票展开。","takeaway":"`train ticket` (火车票) 是最符合故事主题的复合名词。"}]},{"title":"排除法应用","steps":[{"question":"我们把其他选项放进去看看。`train newspaper` (火车报纸) 是什么意思？通顺吗？","hint":"虽然可能有火车上发的报纸，但这里上下文说的是他找到了一张“票据”。","takeaway":"`train newspaper` 在此语境中不合逻辑。"},{"question":"`train milk` (火车牛奶) 和 `train train` (火车火车) 呢？","hint":"这两个组合显然不通，无法构成有意义的词组。","takeaway":"选项 A, C, D 放入句子后都无法形成有意义且符合上下文的表达。"}]}]}},{"number":"32","item_type":"choice","context_note":"Passage for questions 1-10","stem":"9","options":{"A":"find","B":"hear","C":"feel","D":"remember"},"teaching":{"correct_answer":"D","explanation_md":"该题考察动词词义辨析。这句话描述了Mr. Black的心理活动：他找不到火车票，想不起来把它放在哪里了。这是一个关于“记忆”的问题。动词`remember`意为“记得，记起”，`couldn't remember where...`意为“想不起来……在哪里”，完全符合句意和人物健忘的特点。选项A `find`（找到）强调结果，而非回忆过程；选项B `hear`（听到）和C `feel`（感觉到）与语境无关。","knowledge_expansion_md":"### 动词辨析：`remember`, `find`, `hear`, `feel`\n\n- **remember**: v. 记得, 想起。侧重于大脑中的回忆、记忆活动。常接 `wh-` 引导的宾语从句 (如 `what`, `where`, `when`, `how` 等)。例: `I can't remember where I put my keys.` (我记不起我把钥匙放哪儿了。)\n- **find**: v. 找到, 发现。侧重于通过“寻找”这一动作最终“发现”某物的结果。例如：`I can't find my keys.` (我找不到我的钥匙。)\n- **hear**: v. 听见。与听觉有关。例如：`Can you hear the music?` (你能听见音乐吗？)\n- **feel**: v. 感觉, 触摸。与触觉或情感有关。例如：`I feel happy.` (我感到快乐。)\n\n在本题中，主角是在努力回忆票的存放地点，这是一个心理过程，因此用 `remember` 最为准确。","socratic_tracks":[{"title":"动词与宾语从句","steps":[{"question":"句子 `He just couldn't ___ where he had put the train ticket` 中，空格后面的 `where...` 部分是什么？","hint":"它是一个由 `where` 引导的句子，作前面动词的宾语。","takeaway":"这是一个宾语从句，说明动词的具体内容。"},{"question":"什么样的动词可以接 `where` 引导的宾语从句，来表示“想不起来在什么地方”？","hint":"这是一个关于记忆或思考的动作。","takeaway":"表示“知道、记得、忘记、告诉”等思索或交流类的动词常接宾语从句。"},{"question":"在四个选项中，哪个动词最符合“想不起来”这个意思？","hint":"故事的主角是一个 `forgetful man` (健忘的人)。","takeaway":"`remember` (记得) 的否定形式 `couldn't remember` (想不起来) 最贴合人物特点和语境。"}]},{"title":"语境与人物性格","steps":[{"question":"这篇文章的主角 Mr. Black 是一个什么样的人？","hint":"文章第一句话就介绍了他的特点。","takeaway":"他是一个非常健忘 (forgetful) 的人。"},{"question":"一个健忘的人找不到东西时，他大脑里最可能进行的活动是什么？","hint":"他是努力地在想，还是在用耳朵听？","takeaway":"他会努力地去“回忆”或“想起”东西放在哪里了。"},{"question":"哪个选项的动词最能描述“回忆”这个心理活动？","hint":"F-I-N-D 是找到，R-E-M-E-M-B-E-R 是……","takeaway":"`remember` (记得、回忆) 是描述这个心理活动最准确的词。"}]},{"title":"辨析 `find` 与 `remember`","steps":[{"question":"`find` 和 `remember` 的中文意思分别是什么？","hint":"一个是你找到了东西，一个是你想起了事情。","takeaway":"`find` 是“找到”，是一个动作的结果；`remember` 是“记得”，是一个心理过程。"},{"question":"这句话 `He just couldn't ___ where...` 描述的是一个动作的结果，还是一个心理过程？","hint":"他找不到票，所以他“想不起来”放在哪了。","takeaway":"这里描述的是他无法完成“回忆”这个心理过程。"},{"question":"所以，这里用 `find` 合适吗？","hint":"我们可以说 `He couldn't find the ticket` (他找不到票)，但 `He couldn't find where he put it` 这种说法不如 `remember` 自然。","takeaway":"虽然 `find` 勉强能说通，但 `remember` 在此语境中是最佳选择，更地道、更准确。"}]}]}},{"number":"33","item_type":"choice","context_note":"Passage for questions 1-10","stem":"10","options":{"A":"hopeful","B":"thankful","C":"careful","D":"painful"},"teaching":{"correct_answer":"B","explanation_md":"这是一道词义辨析题，需要根据上下文选择最符合情感逻辑的形容词。选项词义分别为：A. hopeful (有希望的)，B. thankful (感激的)，C. careful (小心的)，D. painful (痛苦的)。完形填空的结尾部分通常是对全文的总结或情感的升华。如果文章讲述了一个主人公通过努力或在他人帮助下达成目标的故事，那么在结尾处表达“感激”之情是非常合乎逻辑的。相比之下，“有希望的”通常指向未来，“小心的”描述行为状态，“痛苦的”则与积极的结局相悖。因此，`thankful`（感激的）最能体现故事圆满结束时人物的内心感受。","knowledge_expansion_md":"### 情感态度类形容词辨析\n在完形填空和阅读理解中，辨析描述情感、态度或状态的形容词是一项重要能力。这类词语的选择严重依赖于对上下文语境，尤其是人物心境和故事基调的把握。\n\n*   **`hopeful`**: 意为“充满希望的”，常用于对未来的展望。搭配：`be hopeful about sth.` (对某事抱有希望) 或 `be hopeful that...` (希望……)。\n*   **`thankful`**: 意为“感激的，感谢的”，用于表达因得到帮助或好事发生而产生的感激之情。搭配：`be thankful to sb. for sth.` (因某事而感谢某人) 或 `be thankful that...` (庆幸……)。\n*   **`careful`**: 意为“小心的，谨慎的”，描述行为方式或态度。搭配：`be careful with sth.` (小心对待某物) 或 `be careful to do sth.` (小心地做某事)。\n*   **`painful`**: 意为“令人痛苦的，疼痛的”，通常修饰事物、经历或身体部位，而不是直接描述人的感受（人感到疼痛是 `in pain`）。例如：`a painful memory` (一段痛苦的记忆)。\n\n**解题技巧**：做此类题目时，先通读空格前后句子，判断整个语境是积极的、消极的还是中性的，然后排除与情感基调不符的选项，最后在剩下的选项中根据词义和搭配选择最佳答案。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"请分别说出 `hopeful`, `thankful`, `careful`, `painful` 这四个词的中文意思和它们通常描述的情景。","hint":"可以尝试用每个词造一个简单的句子，比如：我对未来感到___。","takeaway":"准确理解每个选项的基本词义，是做出正确选择的第一步。"},{"question":"想象一个故事的结尾，主人公历经艰辛终于成功了，或者得到了别人的巨大帮助。他的心情更可能是“痛苦的”还是“感激的”？","hint":"想想你看过的电影或读过的故事，英雄在最后胜利时通常会说什么？是“太痛苦了”还是“谢谢大家”？","takeaway":"故事的结局和情感基调是选择情感形容词的关键线索。"}]},{"title":"搭配用法","steps":[{"question":"如果我们想表达“因为你的帮助而感谢你”，用 `thankful` 这个词应该怎么组织句子？","hint":"这个句型结构通常是 `be thankful to ... for ...`。","takeaway":"`thankful` 的常见搭配是 `be thankful to somebody for something`。"},{"question":"如果我们想表达“对未来充满希望”，应该用哪个词，后面通常跟什么介词？","hint":"“希望”是 `hope`，它的形容词是什么？表示“关于”未来，用哪个介词？","takeaway":"`hopeful` 常与介词 `about` 连用，表示“对……抱有希望”。"}]},{"title":"语境逻辑","steps":[{"question":"这道题是完形填空的最后一题。通常，文章的最后一句会起到什么作用？","hint":"是开启一个全新的故事，还是对前面的内容进行总结和收尾？","takeaway":"文章的结尾往往是点明主旨、总结全文或升华情感的地方。"},{"question":"根据这个作用，我们可以推断空格处需要一个什么样的词？","hint":"是描述一个具体动作的词，还是一个表达总结性感受或态度的词？","takeaway":"通过判断空格在文章结构中的作用，可以缩小备选词汇的范围，锁定表达情感或态度的词。"}]}]}}]},{"section_title":"V. 阅读理解。(共10分)","section_instruction":"Some people believe that dreams can tell them what will happen in the future. Nobody knows why, but there are many stories about people who have had dreams that came true. One of these people was a man called John Chapman, who lived in a small place, named Swaffham in England and was deeply loved by people in this town. Though he was very poor, he was kind and liked to help others in trouble. One night, he dreamed that he was standing on London Bridge and a man told him how to become rich. John Chapman really needed money and wanted to have a try, so the next day he set off for London. There were plenty of people on the bridge but they were not interested in him. They were all unaware of him. Three days later, he decided to go home, but before he could do this, a shopkeeper was approaching him.\n\"I've been watching you,\" the shopkeeper said. \"Are you waiting for someone?\"\n\"Yes,\" said John. \"I had a dream about a man on London Bridge. He was going to lead me to own a lot of money.\"\n\"Oh,\" said the shopkeeper. \"You shouldn't believe in dreams. If I believed in dreams, I'd be in Swaffham right now. I had a dream a few days ago about a man from Swaffham. His name was John Chapman and he had gold in his garden near an old apple tree.\"\nJohn was amazed and immediately headed for home. As soon as he arrived, he dug in his garden near the old apple tree.","items":[{"number":"34","item_type":"choice","context_note":"Passage for questions 1-5","stem":"Swaffham is probably the name of _____.","options":{"A":"a city","B":"a bridge","C":"a town","D":"a church"},"teaching":{"correct_answer":"C","explanation_md":"这是一道细节理解题。题目询问“Swaffham”是什么。根据文章第一句 “...a man called John Chapman, who lived in a small place, named Swaffham in England and was deeply loved by people in this town.” (一个叫约翰·查普曼的人，他住在一个叫斯瓦夫汉姆的英国小地方，深受这个镇上的人们的喜爱)，文中使用 `this town` 来指代 Swaffham。因此，可以明确得知 Swaffham 是一个城镇（town）。选项 C 正确。","knowledge_expansion_md":"### 阅读理解中的专有名词定位法\n在阅读理解中，当题目问及一个首字母大写的专有名词（如人名、地名、机构名）时，可以采用以下高效的解题策略：\n\n1.  **快速寻读（Scanning）**：带着问题中的专有名词（如本题的 `Swaffham`）快速扫描全文，眼睛不必逐词阅读，只需寻找这个特定的词形。这能帮你迅速定位到包含答案信息的句子或段落。\n2.  **精读上下文**：定位到该专有名词后，仔细阅读其所在的完整句子以及前后相邻的句子。文章通常会通过以下方式给出解释：\n    *   **同位语**：例如, \"Swaffham, a small town in Norfolk, was his home.\" (斯瓦夫汉姆，诺福克郡的一个小镇，是他的家。)\n    *   **定语从句**：例如, \"He came from Swaffham, which is a market town.\" (他来自斯瓦夫汉姆，那是一个集镇。)\n    *   **上下文描述**：例如, \"John Chapman was a pedlar in Swaffham. He lived a simple life in this quiet place.\" (约翰·查普曼是斯瓦夫汉姆的一个货郎。他住在这个安静的地方，生活简朴。) 从描述中可以推断出它是一个居住地。\n3.  **排除法**：根据定位到的信息，逐一比对选项，排除与原文信息明显矛盾或不符的选项。","socratic_tracks":[{"title":"寻读定位技巧","steps":[{"question":"看到题目中的 `Swaffham` 这个词，你觉得它在文章中好找吗？为什么？","hint":"注意这个单词的首字母是大写的。","takeaway":"以大写字母开头的专有名词是阅读定位中的关键“路标”，可以快速找到。"},{"question":"找到 `Swaffham` 后，你应该关注句子里的哪些信息来判断它是什么？","hint":"看看它和谁有关系？比如，是不是某人的家乡？文章有没有直接说它是一个 city, town 还是 village？","takeaway":"定位到关键词后，要仔细分析其所在句子的成分和上下文信息来获取答案。"}]},{"title":"常识与推断","steps":[{"question":"在英语中，很多地名以 `-ham`, `-ton`, `-ford` 结尾，这通常暗示着什么？","hint":"比如 Birmingham, Southampton。这些地方是大城市还是小村庄？","takeaway":"了解一些英语地名的构词规律有助于辅助判断，`-ham` 通常指村庄或城镇。"},{"question":"故事的主人公 John Chapman 是一个 `pedlar`（货郎）。你认为一个货郎的家乡，更有可能是一个繁华大都市（city）还是一个普通城镇（town）？","hint":"货郎是一种走街串巷的小商贩，他的生活背景通常是怎样的？","takeaway":"结合文章角色的身份和生活背景进行常识性推理，可以帮助我们做出更合理的选择。"}]},{"title":"选项辨析","steps":[{"question":"选项 A, B, C, D 分别是 `a city`, `a bridge`, `a town`, `a church`。它们的意思有什么不同？","hint":"A: 城市, B: 桥, C: 城镇, D: 教堂。","takeaway":"做选择题时，首先要确保自己清楚理解每一个选项的准确含义。"},{"question":"根据故事，John Chapman 是去伦敦的“桥”上，而不是来自一座“桥”。这能帮助我们排除哪个选项？","hint":"London Bridge 是他要去的目标，而不是他的家乡。","takeaway":"运用排除法，根据文章内容剔除明显错误的选项，是提高答题效率和准确率的有效方法。"}]}]}},{"number":"35","item_type":"choice","context_note":"Passage for questions 1-5","stem":"John Chapman went to London because _____.","options":{"A":"he wanted to visit a friend there","B":"he wanted to meet a shopkeeper","C":"he wanted to be famous","D":"he wanted to make his dream come true"},"teaching":{"correct_answer":"D","explanation_md":"这是一道关于行为动机的细节理解题。题目问“John Chapman 为什么去伦敦？”。根据故事《斯瓦夫汉姆的货郎》的情节，故事的起因是 John Chapman 做了一个反复出现的梦，梦指示他去伦敦桥（London Bridge），在那里他会听到好消息。因此，他去伦敦的直接目的就是为了追寻并实现这个梦境的预言。选项 A（拜访朋友）和 C（想出名）在文中没有依据。选项 B（想见一个店主）是他在伦敦的经历，是结果而非原因。所以，选项 D “他想让他的梦想成真” (he wanted to make his dream come true) 是对他行为动机最准确的概括。","knowledge_expansion_md":"### 如何解答阅读理解中的“Why”问题\n提问原因和目的的“Why”问题是阅读理解中的常见题型。解答这类问题需要准确把握文中的因果逻辑链条。\n\n1.  **关键词定位**：首先在文中寻找引出原因的信号词，如 `because`, `since`, `as`, `for` (因为)，以及引出结果的信号词 `so`, `therefore`, `as a result`。有时原因并无明显信号词，需要通过上下文逻辑理解。\n2.  **区分原因与结果**：务必分清“因”与“果”。很多干扰项会把结果当作原因来迷惑考生。例如本题中，“见到店主”是去伦敦之后发生的事（结果），而不是去伦敦的原因。\n3.  **注意同义替换**：正确答案往往不是原文的照搬，而是对原文信息的概括或同义转述。例如，原文说“他做了一个梦，梦让他去伦敦”，而选项概括为“让梦想成真”。这考察的是深层理解能力，而非简单的信息匹配。\n4.  **排除无关信息**：对于选项中提到的内容，如果文中根本没有提及（如本题的“拜访朋友”、“想出名”），则应立即排除。","socratic_tracks":[{"title":"探寻动机与原因","steps":[{"question":"题目问的是 `Why` (为什么)，我们应该在文章中寻找描述什么类型的信息？","hint":"是描述人物外貌的，还是描述人物行为动机的？","takeaway":"“Why”问题需要我们聚焦于文章中解释行为动机或事件起因的句子。"},{"question":"John Chapman 去伦敦这个行为，是由什么特别的事件引发的？","hint":"他是在散步时突然想去，还是因为发生了一件不寻常的事，比如做了一个梦？","takeaway":"故事的起因是 John Chapman 做了一个关于去伦敦的梦，这就是他行动的直接原因。"}]},{"title":"辨别因果与时序","steps":[{"question":"我们来看 B 选项“他想见一个店主”。John Chapman 是在出发去伦敦前就知道自己会遇到一个店主吗？","hint":"他是为了见店主才去的，还是去了之后才偶然遇到的？","takeaway":"要严格区分事件的先后顺序，后发生的事情不能作为先前行为的原因。"},{"question":"一个行为的“原因”和“结果”有什么区别？你能用去超市购物这件事举个例子吗？","hint":"比如，“因为家里没牛奶了（原因），所以我去超市（行为），结果买了一大堆零食（结果）。”","takeaway":"准确辨别因果关系是解答“Why”问题的核心，避免将结果误判为原因。"}]},{"title":"理解概括与转述","steps":[{"question":"文章里可能说 John Chapman 是“因为一个梦”才去伦敦的，而 D 选项说的是“为了让梦想成真”。你觉得这两句话表达的是同一个意思吗？","hint":"一个人因为一个梦而采取行动，他的最终目的是什么？","takeaway":"“为了一个梦而行动”就是“希望让梦想成真”的具体表现，选项是对原文意思的概括和提炼。"},{"question":"为什么在英语阅读考试中，正确答案常常不是文章里的原话？","hint":"如果答案和文章一模一样，那考察的是“找茬”能力还是“理解”能力？","takeaway":"阅读理解常通过同义替换来考察学生是否真正读懂了文章，而不仅仅是机械地匹配文字。"}]}]}},{"number":"36","item_type":"choice","context_note":"Passage for questions 1-5","stem":"The underlined phrase \"headed for\" means \"_____\".","options":{"A":"left","B":"passed","C":"went","D":"hid"},"teaching":{"correct_answer":"C","explanation_md":"这是一道词义猜测题，要求理解划线短语 `headed for` 的意思。该短语出现在文章末尾：“John was amazed and immediately headed for home.” (约翰大吃一惊，立刻动身回家了。) `head` 作为动词时，有“朝向……”的意思，`for` 在这里表示方向和目的地。因此，`head for` 这个动词短语的完整意思是“朝……走去；前往”。在四个选项中：A `left` (离开) 只说明离开，未指明方向；B `passed` (经过) 表示路过，但家是目的地；D `hid` (躲藏) 意思完全不符。只有 C `went` (去了) 最能准确表达“前往”这一核心含义。所以 `headed for` 在此语境下基本等同于 `went to`。","knowledge_expansion_md":"### 动词短语 `head for` 的用法与辨析\n\n**1. `head for` 的核心含义**\n*   **定义**：to travel or move in the direction of a particular place. (朝某个特定地方行进或移动)\n*   **特点**：强调“方向性”和“目的地”。它不仅仅是“走”，而是“朝着……走”。\n*   **示例**：\n    *   *The ship was heading for the nearest port.* (船正驶向最近的港口。)\n    *   *After school, we usually head for the library.* (放学后，我们通常去图书馆。)\n\n**2. 与相关动词/短语的辨析**\n*   **`go to`**: 最通用、最口语化的“去某地”，可以与 `head for` 在很多情境下互换，但 `head for` 更强调“在路上，正前往”的过程感。\n*   **`leave for`**: 意为“离开（某地）去往（另一地）”。它同时包含“离开”和“前往”两个动作。例：*He left his hometown for the big city.* (他离开家乡去了大城市。)\n*   **`set out for`**: 意为“出发前往某地”，特别强调“旅程的开始”。例：*The explorers set out for the South Pole.* (探险家们出发前往南极。)\n\n**解题技巧**：在猜测词义时，可以利用构词法（`head`作动词表“朝向”）和上下文逻辑（主人公要去伦敦）进行双重验证，从而锁定最准确的答案。","socratic_tracks":[{"title":"短语构成解析","steps":[{"question":"`head` 这个单词除了作名词“头”之外，你见过它作动词用吗？可以猜猜是什么意思吗？","hint":"想象一下，你的头转向哪个方向，你的身体是不是也准备朝那个方向移动？","takeaway":"`head` 作动词时，有“朝向，率领，前进”的意思。"},{"question":"知道了 `head` 的动词意思，那么 `head for a place` 这个短语，从字面上理解，可能是什么意思？","hint":"“头朝着一个地方”，引申一下就是人朝着一个地方去。","takeaway":"`head for` 的字面逻辑就是“朝向目的地”，即“前往”。"}]},{"title":"上下文逻辑推断","steps":[{"question":"在 John Chapman 的故事里，他做了一个梦，要去伦敦。那么接下来，他会采取什么行动？","hint":"他会待在家里，还是会出发去伦敦？","takeaway":"根据故事情节，他必然会动身前往伦敦。"},{"question":"那么 `He headed for London` 这句话描述的就是他“前往伦敦”这个动作。四个选项中，哪个词最能表达这个意思？","hint":"`left` (离开), `passed` (经过), `went` (去), `hid` (躲藏)。哪个最贴切？","takeaway":"通过故事情节的逻辑，可以反向推断出 `headed for` 的核心意思是“去”，即 `went`。"}]},{"title":"近义选项辨析","steps":[{"question":"为什么 A 选项 `left` (离开) 不如 C 选项 `went` (去) 好？","hint":"“He left Swaffham” (他离开了斯瓦夫汉姆) 和 “He went to London” (他去了伦敦)，这两个句子表达的侧重点有什么不同？","takeaway":"`left` 只强调离开出发点，而 `headed for` 和 `went to` 都强调了目的地。"},{"question":"为什么 B 选项 `passed` (经过) 是错的？","hint":"在故事里，伦敦是 John Chapman 的终点站 (destination) 还是路过的地方 (a place on the way)？","takeaway":"`passed` 意为“路过，经过”，而伦敦是 John Chapman 此行的目的地，因此 `passed` 不正确。"}]}]}},{"number":"37","item_type":"choice","context_note":"Passage for questions 1-5","stem":"According to the story, John was away from his town for at least _____ days.","options":{"A":"three","B":"four","C":"five","D":"six"},"teaching":{"correct_answer":"C","explanation_md":"本题考查对文章细节的理解和推断能力。题目要求计算 John 离家至少多少天。\n1.  根据文章 “Three days later, he decided to go home...” 可知，他在伦敦停留了三天。\n2.  文章提到他 “set off for London”（出发去伦敦）以及 “headed for home”（动身回家），虽然没有明说路途花费的时间，但从一个城镇到伦敦的往返路程必然需要时间。\n3.  根据常识进行合理推断，单程旅途至少需要1天。\n4.  因此，John 离家的总时间至少是：1天（去程）+ 3天（在伦敦）+ 1天（返程）= 5天。\n5.  所以，他离家“至少”（at least）有五天。选项 C 符合推断。","knowledge_expansion_md":"### 1. 细节推断题解题技巧\n在阅读理解中，细节推断题要求考生根据文中的信息进行简单的计算或逻辑推理。解题步骤如下：\n- **定位关键词**：快速找到题干在文中的对应信息点。本题的关键词是 `days`。\n- **整合信息**：将找到的多个相关信息点（如在桥上的天数、路上的时间）整合起来。\n- **合理推断**：对于文中未明确说明但有暗示的信息（如 `a long time`），需结合常识进行最保守、最合理的推断。\n\n### 2. `at least` 的含义与应用\n`at least` 意为“至少；不少于”，表示一个最小的限度。在选择题中，当多个选项从逻辑上看都“可能”正确时（例如，如果离家5天，那么“至少3天”和“至少4天”也成立），应选择最精确、最接近事实的那个选项。本题中，我们能推断出的最小值是5天，因此 `at least five` 是最佳答案。\n\n### 3. 词汇辨析\n- `pedlar`: （旧时用法）小贩，沿街叫卖的商人。\n- `treasure`: 宝藏，金银财宝。\n- `hurry`: 匆忙，赶快。文中 `hurries home` 体现了他得知宝藏线索后急切的心情。","socratic_tracks":[{"title":"定位关键时间信息","steps":[{"question":"题目问John离家至少多少天。要回答这个问题，我们需要知道他的总时间由哪几部分构成？","hint":"想想他的整个旅程，从离开家到返回家，都做了什么？","takeaway":"他的总时间包括路上花费的时间和在伦敦停留的时间。"},{"question":"文章明确说明了他在伦敦桥上待了多久吗？","hint":"在文章中找到 'bridge' 和表示时间的词。","takeaway":"文章明确指出他在桥上站了三天（three days）。"},{"question":"那路上的时间呢？文章是怎么描述的？这是一个确切的时间吗？","hint":"找到描述他去伦敦旅程的句子，看看用的是什么词。","takeaway":"文章用 'a long time' 来描述路途时间，这是一个模糊的表述，不是确切天数。"},{"question":"既然路途时间不确定，我们如何计算出“至少”的天数？","hint":"在古代，长途旅行最短需要多久？我们可以做一个最保守的估计。","takeaway":"我们可以合理推断单程旅行至少需要1天，因此总时间至少是 1 (去程) + 3 (停留) + 1 (返程) = 5天。"}]},{"title":"理解'at least'的逻辑","steps":[{"question":"题干中的 'at least' 是什么意思？它对我们选择答案有什么影响？","hint":"如果我说我口袋里至少有5块钱，这意味着我可能有5块、6块，但不可能有4块。","takeaway":"'at least' 意味着数字不能少于那个值，但可以等于或多于那个值，它要求我们找到一个最小值。"},{"question":"我们计算出John离家最少5天。那么选项A 'three' 和选项B 'four' 为什么不是最佳答案？","hint":"虽然他离家5天，也意味着他离家“至少3天”了，但这个描述够精确吗？","takeaway":"在选择题中，我们要选择最精确、最全面的答案，而不仅仅是逻辑上正确的答案。"},{"question":"为什么选项C 'five' 是比A和B更好的答案？","hint":"比较一下哪个选项最贴近我们根据文章能推断出的确切最小值。","takeaway":"选项C 'five' 是我们能从文中信息推断出的确切最小值，因此是最佳答案。"}]},{"title":"细节与推断的关系","steps":[{"question":"这道题的答案是直接写在文章里的，还是需要我们自己算一下？","hint":"文章里有直接说 'five days' 吗？","takeaway":"这道题需要我们结合文中的直接信息（三天）和间接信息（路途时间）进行推断和计算。"},{"question":"这个过程告诉我们，做阅读题时，只找到一个细节就够了吗？","hint":"如果我们只看到 'three days' 就选了A，会怎么样？","takeaway":"做细节题时，需要全面寻找所有相关信息，避免因信息不全而导致错误。"}]}]}},{"number":"38","item_type":"choice","context_note":"Passage for questions 1-5","stem":"What happened to John Chapman probably at the end of the story?","options":{"A":"He found nothing and remained very poor.","B":"He found gold and gave some to others in need.","C":"He found gold and kept it on his own.","D":"He found nothing and gave up his dream."},"teaching":{"correct_answer":"B","explanation_md":"本题考查对故事结局的推理判断。\n1.  题干问：“在故事的结尾，John Chapman可能发生了什么？”关键词是“probably”（可能），要求我们根据文中的线索进行推断。\n2.  故事的铺垫（John的梦、店主的梦）强烈暗示John会在自家花园里找到宝藏。因此，选项A和D（“He found nothing”）与故事的逻辑发展不符，可以排除。\n3.  文章开头描述John的性格是“he was kind and liked to help others in trouble”（他很善良，乐于助人）。\n4.  对比选项B和C：选项B“他找到了金子，并分了一些给有需要的人”符合他乐于助人的性格；选项C“他找到了金子，并据为己有”则与他的性格特点相悖。\n5.  因此，根据文中的人物设定进行合理推断，最可能的结局是B。","knowledge_expansion_md":"### 1. 主旨大意题解题技巧\n这类题目通常考察对文章中心思想、故事寓意或结局的把握。解题关键是通读全文，特别是文章的开头和结尾段落，因为这些地方往往是作者点明主旨的地方。\n\n### 2. 同义转述 (Paraphrasing)\n在阅读理解中，正确选项往往不是原文的照搬，而是对原文信息的“同义转述”。考生需要具备识别这种转述的能力。本题中，选项B的 `gave some to others in need` 就是对原文 `rebuild the church` 的意义上的概括和转述。学会识别同义转述是提高阅读理解分数的核心能力之一。\n\n### 3. 民间故事的文化背景\n这个故事（The Pedlar of Swaffham）是一个经典的英国民间故事。这类故事常常包含以下主题：\n- **追寻梦想**：主角通常会因为一个梦或预兆而踏上旅程。\n- **意外收获**：宝藏或好运往往在最意想不到的地方出现（例如，在家中）。\n- **善有善报/财富的意义**：故事的结局往往强调主角的慷慨和善良，将财富用于行善，如帮助穷人或建设社区。了解这些文化背景有助于更好地理解故事的深层寓意。","socratic_tracks":[{"title":"推理与判断结局","steps":[{"question":"题目问的是“可能(probably)”发生什么，这意味着答案不一定在文中直接写出。我们应该怎么做？","hint":"寻找文中的线索进行推断。","takeaway":"我们需要根据文章提供的线索（如人物性格、故事发展方向）进行合理推断。"},{"question":"故事的结尾，店主的梦暗示了什么？John最可能的结果是什么？","hint":"想想民间故事的常见套路，主角的梦和别人的梦都指向了宝藏。","takeaway":"故事的铺垫强烈暗示John会在花园里找到金子。"},{"question":"根据上一步的推断，我们可以排除哪些选项？","hint":"哪些选项说他“什么也没找到”？","takeaway":"我们可以排除A和D，因为它们都说John“found nothing”，这与故事的暗示相悖。"}]},{"title":"基于性格的推理","steps":[{"question":"剩下的B和C选项，都说John找到了金子，它们的主要区别是什么？","hint":"比较一下选项B和C中描述他找到金子后的行为。","takeaway":"选项B说他帮助了别人（gave some to others in need），而选项C说他据为己有（kept it on his own）。"},{"question":"回到文章开头，作者是如何描述John的为人的？","hint":"找到描述他性格的句子。","takeaway":"文章第一段就说他“was kind and liked to help others in trouble”（善良且乐于助人）。"},{"question":"结合John的性格，你认为他富裕之后更可能做出哪种行为？","hint":"一个善良的人会把钱全部留给自己，还是会去帮助别人？","takeaway":"根据他乐于助人的性格，他更可能会用财富去帮助他人，因此选项B是更合理的推断。"}]}]}}]},{"section_title":"VI. 作文。(共20分)","section_instruction":"","items":[{"number":"39","item_type":"writing","context_note":"","stem":"请以“Life in the Future”为题写一篇短文, 按下列提示完成。\n1. 想象一下未来的生活会有什么样子?\n2. 具体介绍一下未来的生活, 很多事情将由计算机或机器人来完成。例如: 料理家务, 购物, 网上聊天, 不出门就可以看病, 医疗卫生, 教育。\n3. 为了未来的生活, 我们现在应该努力学习, 实现理想。","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"What will life be like in the future? I think it will be fantastic and convenient. Computers and robots will help us a lot. For example, robots will do all the housework, so we will have more free time. We can shop online for anything we need without leaving home. If we are sick, we can see a doctor online. To make this wonderful future a reality, we must study hard now to realize our dreams.","explanation_md":"本题是一篇经典的半开放性话题作文，要求围绕“未来的生活”展开想象和论述。\n1.  **内容完整**：范文严格按照题目的三个提示点进行写作，确保了内容的完整性。涵盖了对未来的总体想象、科技应用的具体例子（家务、购物、医疗），以及与当下学习的联系。\n2.  **结构清晰**：文章采用了“总-分-总”的经典结构。开头总起（`What will life be like...? I think...`），中间用`For example`引出具体例子，结尾用`To make...`进行总结和升华，逻辑清晰，条理分明。\n3.  **语言准确**：主要时态为一般将来时（`will + 动词原形`），准确地表达了对未来的预测。句式方面，使用了`so`引导的结果状语从句和`If`引导的条件状语从句，使表达更多样。\n4.  **词汇恰当**：使用了如 `fantastic`, `convenient`, `without leaving home`, `make...a reality`, `realize our dreams` 等贴合主题且有一定亮点的词汇和短语。\n5.  **字数达标**：范文约75词，符合题目60-80词的要求。","knowledge_expansion_md":"### 1. 写作结构：总-分-总\n对于提示性作文，“总-分-总”是一个非常实用且高分的结构：\n- **总（Introduction）**：开门见山，直接回应主题，提出你的中心观点。例如：`Life in the future will be...`\n- **分（Body）**：展开论述，根据提示提供具体的例子和细节来支撑你的观点。使用 `For example`, `What's more`, `Also` 等连接词使段落更有条理。\n- **总（Conclusion）**：总结全文，或升华主题，将讨论引向更深的思考或行动呼吁。例如：`In short...`, `To achieve this dream, we should...`\n\n### 2. 核心时态：一般将来时\n在描述对未来的预测和想象时，主要使用一般将来时。\n- **`will + 动词原形`**：最常用的结构，表示预测。例如：`Robots will do the housework.`\n- **`be going to + 动词原形`**：也可使用，常表示有计划或有迹象表明要发生的事。\n\n### 3. “科技与未来”话题词汇库\n- **核心名词**: `technology` (技术), `robot` (机器人), `computer`, `Internet`, `AI (artificial intelligence)` (人工智能), `smart phone`\n- **生活场景**: `online shopping/learning/meeting`, `smart home`, `housework`, `remote medical care` (远程医疗)\n- **形容词**: `convenient` (方便的), `efficient` (高效的), `fantastic` (极好的), `amazing` (令人惊奇的), `automatic` (自动的)\n- **动词短语**: `play an important role` (扮演重要角色), `make...come true / make...a reality` (使……成真), `realize one's dream` (实现某人梦想), `free up time` (解放时间)","socratic_tracks":[{"title":"审题与构思","steps":[{"question":"看到这个作文题，你首先要做什么？","hint":"先别急着写，看看题目给了我们哪些“说明书”或“任务清单”？","takeaway":"首先要仔细阅读题目要求，特别是那三个提示要点，把它们作为写作的大纲。"},{"question":"这三个提示点告诉我们文章应该包含哪几部分内容？","hint":"把每个提示点变成一个段落的主题句试试。","takeaway":"文章需要包含三部分：对未来的总体想象、科技应用的具体例子、以及我们现在该怎么做。"},{"question":"这种根据提示分点写作的方法有什么好处？","hint":"想一想，如果漏掉一个提示点会怎么样？","takeaway":"这种方法可以确保内容完整不跑题，结构清晰，是应对提示性作文最稳妥的策略。"}]},{"title":"语言运用：时态与句型","steps":[{"question":"这篇文章是关于“未来”的生活，我们应该主要使用什么时态？","hint":"表示“将要”发生的事情，用什么时态？","takeaway":"应该主要使用一般将来时，即 'will + 动词原形'。"},{"question":"除了 'Life will be...'，你还能想出其他表达未来的句子开头吗？","hint":"试试用 'I think/believe/imagine that...' 或者 'In the future, ...'","takeaway":"我们可以用 'I think life will be...' 或 'In the future, robots will...' 等句型来丰富表达，避免单调。"},{"question":"如何连接“机器人做家务”和“我们有更多空闲时间”这两个想法，让句子逻辑更强？","hint":"想一想这两个想法之间的因果关系，用哪个词可以连接？","takeaway":"可以使用 'so' (所以) 来连接，如 'Robots will do the housework, so we will have more free time'，体现句子间的逻辑关系。"}]},{"title":"内容拓展与升华","steps":[{"question":"提示中提到了很多例子，如家务、购物、医疗等。我们是应该把所有例子都写一遍，还是有所选择？","hint":"考虑到字数限制（60-80词），如果每个例子都只写一句话，文章会显得怎么样？","takeaway":"不需要全部罗列，应选择2-3个自己最熟悉的例子进行稍微具体的描述，这样文章内容更充实。"},{"question":"以“购物”为例，除了说'we can shop online'，还能补充什么细节让它更生动？","hint":"想一想网上购物的好处是什么？比如需要出门吗？","takeaway":"可以补充细节，如 'we can buy anything we need without leaving home' (我们足不出户就能买到任何需要的东西)。"},{"question":"文章的结尾要求我们将未来和现在联系起来。你觉得为什么这是一个很重要的部分？","hint":"一篇好的文章仅仅是幻想吗？还是应该有现实意义和积极的导向？","takeaway":"这个结尾升华了主题，让文章不仅仅是空想，更赋予了激励我们努力学习的现实意义，使文章立意更高。"}]}]}}]}],"content_markdown":"# 成都某实验外国语学校 初2025级新初一分班(奖学金)真卷英语\n\n**(满分100分)** **(时间60分钟)**\n\n## I. 根据情景, 完成句子。(共14分)\n\n1. 至今为止, 他已经在这家公司工作了十年了。\nHe has worked in this company for ten years _____.\n\n2. 起初, 老师们都认为他不是学习的料。\n_____ all the teachers thought he had no ability to study well.\n\n3. 你什么时候来中国看我?\nWhen will you _____ China and see me?\n\n4. 参加教育交流是一次了不起的体验。\n_____ a fantastic experience _____ an educational exchange.\n\n5. 每个人都应该受到尊重。\nEveryone _____.\n\n## II. 根据汉语提示完成句子。(共16分)\n\n1. What's the Canadian way of _____ (理解) the world?\n\n2. More than half of _____ (加拿大) have British or French ancestry.\n\n3. Canada has two official _____ (语言).\n\n4. Canadians believe that people must respect and _____ (包容) each other and help each other.\n\n5. We should _____ (尊重) those who are old.\n\n6. Words cannot _____ (描述) her beauty.\n\n7. Nearly 70 _____ (百分比) of the fund was supplied by the government.\n\n8. His office is in the _____ (中心的) part of the city.\n\n## III. 单项选择。(共20分)\n\n1. I have taught English in this school _____ 1980. It was thirty years ago.\n    A. after\n    B. in\n    C. since\n    D. for\n\n2. —When _____ Mr. Green _____ to Australia?\n—He _____ there for a month.\n    A. has; gone; has gone\n    B. has; been; has been\n    C. did; go; has gone\n    D. did; go; has been\n\n3. _____ poor child the boy is!\n    A. How\n    B. What a\n    C. What\n    D. How a\n\n4. Don't make me _____ this or that. I'm too busy!\n    A. to do\n    B. do\n    C. doing\n    D. done\n\n5. —Can you find the answer _____ the question?\n—Yes, it's too easy.\n    A. to\n    B. for\n    C. with\n    D. of\n\n6. Many people are unaware _____ the danger of polluting our environment.\n    A. about\n    B. of\n    C. with\n    D. to\n\n7. There is only _____ water in the bottle.\n    A. A bit\n    B. a bit of\n    C. few\n    D. a few of\n\n8. Mr. Brown will introduce us _____ western art next week.\n    A. to\n    B. in\n    C. on\n    D. in\n\n9. He was angry _____ but after he read the letter, he laughed.\n    A. first\n    B. the first\n    C. at first\n    D. at the first\n\n10. They _____ Shanghai for the next week.\n    A. tour\n    B. will tour\n    C. toured\n    D. has toured\n\n## IV. 完形填空 (共20分)\n\n> It was the last day of school and I planned to travel to my friend's hometown. I hadn't seen him for years and this was a good __1__ to meet him again.\nI was busy at school, so it was rather __2__ when I came back home. It was already 10 o'clock at night. Time was running out. After a hurried meal, I left, __3__ I found a taxi very soon. Asking the driver to drive me fast to the station, I relaxed for a while, imagining what my friend looked like now. I was soon at the station and was sure that I would be able to __4__ the train. Unfortunately, I fell on the way and lost some time. To my complete __5__, when I reached the platform, I saw that the train had just left! It was the last train, so I had to __6__ home.\nMy mother was glad to see me back as she had a feeling about my trip. But I was unhappy. I tried to relax and went to bed, but I had a __7__ sleep. The next morning I was very tired. As I was having breakfast, the __8__ arrived. I read over the pages and was shocked to __9__ that the train I missed had an accident. How __10__ I was that I missed the train!\n\n1. \n    A. sign\n    B. chance\n    C. sense\n    D. dream\n\n2. \n    A. strange\n    B. cold\n    C. late\n    D. quiet\n\n3. \n    A. Finally\n    B. Suddenly\n    C. Strangely\n    D. Luckily\n\n4. \n    A. stop\n    B. see\n    C. catch\n    D. miss\n\n5. \n    A. satisfaction\n    B. hope\n    C. surprise\n    D. joy\n\n6. \n    A. call\n    B. leave\n    C. return\n    D. miss\n\n7. \n    A. deep\n    B. had\n    C. great\n    D. heavy\n\n8. \n    A. newspaper\n    B. ticket\n    C. milk\n    D. train\n\n9. \n    A. find\n    B. hear\n    C. feel\n    D. remember\n\n10. \n    A. hopeful\n    B. thankful\n    C. careful\n    D. painful\n\n## V. 阅读理解。(共10分)\n\n> Some people believe that dreams can tell them what will happen in the future. Nobody knows why, but there are many stories about people who have had dreams that came true. One of these people was a man called John Chapman, who lived in a small place, named Swaffham in England and was deeply loved by people in this town. Though he was very poor, he was kind and liked to help others in trouble. One night, he dreamed that he was standing on London Bridge and a man told him how to become rich. John Chapman really needed money and wanted to have a try, so the next day he set off for London. There were plenty of people on the bridge but they were not interested in him. They were all unaware of him. Three days later, he decided to go home, but before he could do this, a shopkeeper was approaching him.\n\"I've been watching you,\" the shopkeeper said. \"Are you waiting for someone?\"\n\"Yes,\" said John. \"I had a dream about a man on London Bridge. He was going to lead me to own a lot of money.\"\n\"Oh,\" said the shopkeeper. \"You shouldn't believe in dreams. If I believed in dreams, I'd be in Swaffham right now. I had a dream a few days ago about a man from Swaffham. His name was John Chapman and he had gold in his garden near an old apple tree.\"\nJohn was amazed and immediately headed for home. As soon as he arrived, he dug in his garden near the old apple tree.\n\n1. Swaffham is probably the name of _____.\n    A. a city\n    B. a bridge\n    C. a town\n    D. a church\n\n2. John Chapman went to London because _____.\n    A. he wanted to visit a friend there\n    B. he wanted to meet a shopkeeper\n    C. he wanted to be famous\n    D. he wanted to make his dream come true\n\n3. The underlined phrase \"headed for\" means \"_____\".\n    A. left\n    B. passed\n    C. went\n    D. hid\n\n4. According to the story, John was away from his town for at least _____ days.\n    A. three\n    B. four\n    C. five\n    D. six\n\n5. What happened to John Chapman probably at the end of the story?\n    A. He found nothing and remained very poor.\n    B. He found gold and gave some to others in need.\n    C. He found gold and kept it on his own.\n    D. He found nothing and gave up his dream.\n\n## VI. 作文。(共20分)\n\n请以“The Life in the Future”为题写一篇短文, 按下列提示完成。\n1. 想象一下未来的生活会有什么样子?\n2. 具体介绍一下未来的生活, 很多事情将由计算机或机器人来完成。例如: 料理家务, 购物, 网上聊天, 不出门就可以看病, 医疗卫生, 教育。\n3. 为了未来的生活, 我们现在应该努力学习, 实现理想。\n","proofread_notes":"1. 卷面中部分题干前有“去问问玛丽-视频讲解”等营销内容，已在转录时从题干中移除。\n2. III. 单项选择第8题中，选项B和选项D均为“in”，系卷面原有错误，已如实转录。\n3. IV. 完形填空部分，原数据中各小题题干(stem)包含“( ) 1.”等冗余信息，已根据上下文将其清空，以符合标准格式。\n4. VI. 作文部分，原题号为“VI”，因该大题仅一题，已将题号清空，并将原题号“VI”与题干合并为“作文”的section_title。","set_number":26,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_26\\page_045.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_26\\page_046.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":39},{"step":2,"name":"verify","items":39,"check_passed":true,"issues_count":2},{"step":3,"name":"polish","items":39}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T11:25:57.286455+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

    const r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + INLINE_CFG.deepseekKey,
      },
      body: JSON.stringify({
        model: "deepseek-chat",
        messages: [{ role: "user", content: userContent }],
        temperature: 0.2,
        max_tokens: maxTokens || 4096,
      }),
    });
    let data = {};
    try { data = await r.json(); } catch (e) { /* ignore */ }
    if (!r.ok) {
      const msg = (data.error && data.error.message) || data.detail || r.statusText || "请求失败";
      throw new Error(msg);
    }
    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return (c || "").trim();
  }

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",
    "choice",
    "cloze",
    "reading",
    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  /** 选项文案：含 <u> 时按语音题规则渲染下划线，否则转义 */
  function quizOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s);
    return esc(s).replace(/\n/g, "<br>");
  }

  /** PDF/卷面选项：同上，单行空格分隔 */
  function examOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s).replace(/\n/g, " ");
    return esc(s).replace(/\n/g, " ");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    const reNumDotBlank = /\d+\.\s*_{3,}/g;
    const reNumDotLetterUnd = /\d+\.\s+[A-Za-z]?_{3,}/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotBlank.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotLetterUnd.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;

    if (b) return b[1];

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^[a-zA-Z]?__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\.\s*_{3,}/.exec(fragment),
      /^(\d+)\.\s+[A-Za-z]?_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);

  function renderStemHtml(stem, qkey, opt) {

      return opt.placeholderParen ? "<p class='stem'>（ ）</p>" : "<p class='stem'></p>";

    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {

    parts.forEach((chunk, i) => {
      h += seg(chunk);

        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";

  function buildReadingSentenceBankPassageFromStems(rows) {
    const sorted = rows.slice().sort((a, b) => {
      const na = parseInt(String(a.it.number || "0"), 10) || 0;
      const nb = parseInt(String(b.it.number || "0"), 10) || 0;
      return na - nb;
    });
    const parts = [];
    sorted.forEach((r) => {
      const n = String(r.it.number || "").trim();
      let s = String(r.it.stem || "").trim();
      if (!s) return;
      if (/\n\s*_{3,}\s*\./.test(s)) {
        parts.push(s.replace(/\n\s*_{3,}\s*\./g, " " + n + ". _____"));
      } else {
        s = s.replace(/\s*_{3,}\s*$/g, "").trim();
        parts.push(s + " " + n + ". _____");
      }
    });
    return parts.join("\n\n");
  }

  function readingSentenceBankPassageBody(rows) {
    const ins = String(rows[0].section_instruction || "");
    let p = readingSentenceBankPassageFromInstruction(ins);
    if (!p) p = buildReadingSentenceBankPassageFromStems(rows);
    return p;
  }

  function buildReadingSentenceBankQuizHtml(rows, tag) {
    const st = String(rows[0].section_title || "").trim() || "阅读理解";
    const passage = readingSentenceBankPassageBody(rows);

      "<div class='cloze-passage-card card reading-sentence-bank-passage-card'><h2>" +

      "</h2>" +
      "<div class='reading-passage-text cloze-inline-passage-wrap'>" +
