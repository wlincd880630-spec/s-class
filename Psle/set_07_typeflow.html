th of the world."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道七选五的句子填空题，考查对上下文逻辑关系的理解。\n\n空格前的句子是：“The east coast has rain all the year round.”（东海岸全年都有雨。）\n这句话描述了东海岸的一个气候特点：全年有雨。\n\n我们需要寻找一个能解释“全年有雨”具体含义的句子。\n短语 “all the year round” 的意思是没有明显的间断。选项 B：“There are no dry months there.”（那里没有干旱的月份。）这句话准确地解释了“全年有雨”就意味着“没有旱季”，两者在意义上是等同的，构成了完美的解释关系。\n\n选项 D 谈论西海岸（the west side），虽然也是关于天气，但它引入了一个新的对比对象，不如选项 B 对前文的直接解释来得紧密。\n其他选项与“全年有雨”这个话题无关。\n因此，选项 B 是最佳答案。","knowledge_expansion_md":"### 1. 词汇与释义：理解 “all the year round”\n“all the year round” 或 “all year round” 是一个固定搭配，意为“一年到头，终年”。在描述天气时，它通常指某个天气现象（如降雨、温暖）持续存在，没有明显的季节性中断。理解这个短语的深层含义是解题的关键。它不等同于“every day”（每天），而是指没有明显的“dry season”（旱季）或“cold season”（寒季）。\n\n### 2. 篇章结构：解释说明 (Elaboration)\n一个结构良好的段落，往往会在提出一个观点或事实后，紧接着进行解释说明（Elaboration），让读者更容易理解。本题中，“The east coast has rain all the year round” 是一个事实陈述，而 “There are no dry months there” 就是对其进行的解释说明。这种“陈述-解释”是段落内非常紧凑和常见的逻辑结构。\n\n### 3. 逻辑对比：解释 vs. 对比 (Elaboration vs. Contrast)\n做这类题时，要辨析选项是起“解释”作用还是“对比”作用。\n- **解释 (Elaboration)**：选项 B 对前文内容进行说明，话题保持在“东海岸”。\n- **对比 (Contrast)**：选项 D 引入了“西海岸”，与前文的“东海岸”形成对比。\n通常情况下，作者会先完成对一个主体的描述，再引入另一个主体进行对比。因此，紧跟在描述东海岸的句子后面的，更可能是对东海岸的进一步解释，而不是立即转向西海岸。","socratic_tracks":[{"title":"理解关键短语","steps":[{"question":"空格前的句子说东海岸 “has rain all the year round”。这个短语 “all the year round” 是什么意思？","hint":"它的意思是“一年到头，终年”。","takeaway":"“all the year round” 意味着某事在一年中持续发生，没有明显的季节性中断。"},{"question":"如果一个地方全年都有雨，那换句话说，这个地方的天气缺少了什么？","hint":"想一想季节的分类，有雨季，还有……？","takeaway":"如果全年都有雨，那就意味着这个地方没有“旱季”或“干旱的月份”。"},{"question":"现在，请看所有选项，哪一个选项表达了“没有干旱月份”这个意思？","hint":"“干旱的”英文是 “dry”。","takeaway":"选项 B “There are no dry months there” 完美地解释了“全年有雨”的含义。"}]},{"title":"聚焦话题主体","steps":[{"question":"前一句话的主语（谈论的对象）是谁？是东海岸还是西海岸？","hint":"句子开头是 “The east coast...”。","takeaway":"前一句话谈论的主体是“东海岸”。"},{"question":"我们来看选项 D “There is not much rain on the west side.”。这个选项谈论的主体是谁？","hint":"句子中提到了 “the west side”。","takeaway":"选项 D 谈论的主体是“西海岸”。"},{"question":"在写文章时，你觉得是先详细说完东海岸的情况，再转到西海岸；还是说一句东海岸，马上就插一句西海岸更好？","hint":"通常我们会把一个话题讲清楚，再开始下一个话题。","takeaway":"更自然的逻辑是先用选项 B 解释完东海岸的情况，而不是用选项 D 立即跳转到西海岸的话题。"}]},{"title":"识别句子功能","steps":[{"question":"如果我说：“他学习很努力。” 后面紧跟一句 “他每天都学习到深夜。” 这第二句话起到了什么作用？","hint":"它是对“学习努力”这个说法的具体化。","takeaway":"第二句话起到了“解释说明”或“举例证明”的作用。"},{"question":"现在回到题目。“The east coast has rain all the year round.” 和选项 B “There are no dry months there.” 之间也是这种关系吗？","hint":"是的，后者解释了前者的意思。","takeaway":"选项 B 是对前一句话的解释说明，这是文章中非常紧密的逻辑关系。"},{"question":"为什么理解句子功能（如解释、举例、转折、对比）对做这类题很重要？","hint":"这能帮助我们判断哪个选项的衔接最自然、最符合逻辑。","takeaway":"识别句子功能可以帮助我们把握文章的脉络和作者的思路，从而做出正确的选择。"}]}]}},{"number":"29","item_type":"grammar_fill","context_note":"Sentence cloze passage","stem":"They bring rain from the sea. __29__","options":{"A":"When it is winter in China, it is summer there.","B":"There are no dry months there.","C":"They only blow here in summer.","D":"There is not much rain on the west side.","E":"It is in the south of the world."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题为句子填空，考查上下文的逻辑衔接。前一句“They bring rain from the sea.”（它们从海上带来雨水）中的“They”指代的是风。因此，空格处需要填入一个与“风”直接相关的句子。选项 C “They only blow here in summer.”（它们只在夏天吹到这里）直接对“They”（风）的特征进行补充说明，指出了这些风刮来的时间，与前文衔接最紧密、最自然。其他选项或话题转换过大，或与前文信息关联不强。","knowledge_expansion_md":"在做七选五或句子填空这类题型时，寻找上下文的“逻辑链条”至关重要。解题的关键技巧包括：\n1.  **指代关系**：注意 `it`, `they`, `this`, `that` 等代词，它们必然指代上文提到过的人或物，是重要的解题线索。\n2.  **词汇复现/同义替换**：上下文常有相同主题的词汇或同义词反复出现，帮助锁定答案范围。\n3.  **逻辑关系**：寻找句间的因果、转折、递进、并列、对比等关系。`but`, `however`, `so`, `therefore`, `in addition` 等连词是明显的标志；有时逻辑关系是隐含的，需要通过句意判断。","socratic_tracks":[{"title":"指代关系","steps":[{"question":"前一句话 “They bring rain from the sea.” 中的 “They” 指的是什么？","hint":"想一想，通常是什么东西能从海上带来雨水？","takeaway":"“They” 指的是风（winds），所以空格处的句子很可能也是在描述风的特点。"},{"question":"既然知道了“They”是风，五个选项中，哪一个也是以“They”开头，并且描述了风的一个关键特征？","hint":"看看选项C，它说了什么？","takeaway":"选项C “They only blow here in summer” 同样用“They”指代风，并说明了其季节性特征。"}]},{"title":"逻辑衔接","steps":[{"question":"前文说“风从海上带来雨水”，描述了风的作用。接下来，我们是应该介绍一个全新的话题，还是继续补充说明风的特点呢？","hint":"好的文章段落通常会围绕一个中心话题展开。","takeaway":"紧跟在描述风的作用之后，最合乎逻辑的是继续补充说明风的其他关键特征。"},{"question":"选项C描述了风的什么特征？这个特征和前文的“带来雨水”有关系吗？","hint":"选项C说的是风刮起的时间。特定的季节风带来特定的季节雨，这是常见的地理现象。","takeaway":"说明风只在夏天刮，恰好解释了为何会形成季节性的降雨，逻辑上非常通顺。"}]},{"title":"排除法","steps":[{"question":"为什么选项A “中国是冬天时，那里是夏天” 和 E “它在世界的南部” 不太合适？","hint":"这两个选项说的是关于澳大利亚的常识性事实，但它们和前一句“风带来雨水”这个具体的情境联系紧密吗？","takeaway":"选项A和E是孤立的背景信息，与前文的具体描述“风带来雨水”缺乏直接的逻辑联系。"},{"question":"再看选项D “西侧雨水不多”。前文在说风从海上带来雨水，这个选项突然转到“西侧”，是不是有点突兀？","hint":"虽然D也是描述气候，但它引入了一个新的地点“西侧”，而没有对当前讨论的“风”做进一步说明。","takeaway":"在没有铺垫的情况下突然转换讨论的地理区域，会使文脉显得跳跃，不如选项C衔接得平滑。"}]}]}},{"number":"30","item_type":"grammar_fill","context_note":"Sentence cloze passage","stem":"The southeast part of Australia has summer rain from the southeast wind. __30__","options":{"A":"When it is winter in China, it is summer there.","B":"There are no dry months there.","C":"They only blow here in summer.","D":"There is not much rain on the west side.","E":"It is in the south of the world."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查语篇的对比逻辑。前一句话“The southeast part of Australia has summer rain from the southeast wind.”（澳大利亚的东南部有来自东南风的夏季降雨）详细描述了澳大利亚一个特定区域（东南部）的气候特征。为了使信息更全面，作者常常会通过对比来介绍另一区域的情况。选项 D “There is not much rain on the west side.”（西侧的雨水不多）正好与前文的“东南部有雨”形成鲜明的地理和气候对比，使得段落结构完整，逻辑清晰。","knowledge_expansion_md":"在说明文或描述文体中，**对比（contrast）** 是一种非常重要的写作手法，能让文章结构更清晰，信息更全面。常见的对比结构有：\n1.  **使用转折/对比连词**：如 `but`, `however`, `while`, `whereas`, `on the other hand` 等。\n2.  **空间/方位对比**：如 `in the east... while in the west...`, `on the one side... on the other side...`。本题就属于隐含的方位对比，通过并列陈述两个不同区域的情况来实现。\n3.  **时间对比**：如 `in the past... but now...`, `in summer... but in winter...`。\n做题时，要善于发现这些对比标志，理解作者的行文思路。","socratic_tracks":[{"title":"篇章结构","steps":[{"question":"前一句话描述了澳大利亚哪个区域的气候特点？","hint":"句子里明确提到了 “The southeast part of Australia”。","takeaway":"前文聚焦于“澳大利亚的东南部”这一特定区域。"},{"question":"当一篇文章在介绍一个地区的地理气候时，只讲一个地方的情况就结束了吗？还是常常会讲讲其他地方的情况来做个对比？","hint":"为了让读者有一个更完整的印象，作者通常会从不同方面或不同区域进行描述。","takeaway":"描述性文章常通过对比不同区域的特点来构建完整的画面。"}]},{"title":"逻辑关系","steps":[{"question":"我们来看选项D “There is not much rain on the west side.”。这个选项里的“the west side”和前一句里的哪个词形成了对比？","hint":"前一句说的是 “the southeast part”。","takeaway":"选项D中的“西侧”与前文的“东南部”形成了清晰的方位对比。"},{"question":"这种“东南部有雨”和“西侧雨水不多”的对比，在地理气候描述中是不是很常见且合乎逻辑？","hint":"想一想我们描述中国气候时，是不是也常说“南方多雨，北方干旱”？","takeaway":"在描述地理或气候时，通过方位对比来阐述差异是一种非常经典和自然的写作手法。"}]},{"title":"排除干扰项","steps":[{"question":"为什么选项B “There are no dry months there.”（那里没有干旱的月份）不合适？","hint":"前文只说了“有夏季降雨”，这是否意味着全年都没有干旱的月份？这个推论是不是太绝对了？","takeaway":"选项B的表述过于绝对（“no dry months”），可能与事实不符，且不如选项D的对比结构更有逻辑性。"},{"question":"为什么选项A “When it is winter in China, it is summer there.” 不合适？","hint":"前文已经明确提到了“summer rain”（夏季降雨），选项A再强调“那里是夏天”是否有点信息重复，且未能有效推进话题？","takeaway":"最佳选项应提供新的、有价值的信息来推进文意，而不是重复已知信息或引入关联不大的背景知识。"}]}]}}]},{"section_title":"V. 完成句子","section_instruction":"(共5小题；每空1分，共10分)","items":[{"number":"31","item_type":"sentence_transform","context_note":"","stem":"你认为李老师的新裙子怎么样？\nWhat _____ you _____ of Miss Li's new dress?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"do|think","explanation_md":"这道题考察的是询问他人意见的常用句型。中文“你认为……怎么样？”对应到英文中，最经典的表达就是 “What do you think of...?”。这是一个固定搭配，of 后面跟名词或动名词，表示询问对某人或某事的看法。本句主语是 “you”，是第二人称，且为一般现在时，所以需要用助动词 “do” 提问。固定搭配中的动词是 “think”，用其原形。因此，两个空分别填 “do” 和 “think”。","knowledge_expansion_md":"询问意见或看法的表达方式非常丰富，除了 “What do you think of...?” 之外，还有以下常用句型：\n*   **How do you like...?**  更侧重于询问喜好程度。例如：`How do you like your new job?` (你觉得你的新工作怎么样？)\n*   **How do you feel about...?**  更侧重于询问感受。例如：`How do you feel about moving to a new city?` (对于搬到一个新城市你感觉如何？)\n*   **What's your opinion of/on/about...?**  比较正式的问法。例如：`What's your opinion on this plan?` (你对这个计划有什么意见？)\n*   **How about/What about...?**  用于提出建议或询问相关情况。例如：`How about going for a walk?` (去散步怎么样？)","socratic_tracks":[{"title":"固定句型","steps":[{"question":"当你想用英语问别人“你觉得……怎么样？”时，有没有一个以“What”开头的常用句型？","hint":"这个句型里有一个表示“思考、认为”的动词。","takeaway":"询问意见的固定句型是 “What do you think of...?”。"},{"question":"既然知道了固定句型，那么这道题的两个空应该填什么？","hint":"把句型 “What do you think of...?” 和题目 “What ___ you ___ of...?” 对比一下。","takeaway":"根据固定句型，第一个空填do，第二个空填think。"}]},{"title":"句子成分","steps":[{"question":"这是一个由“What”引导的特殊疑问句。在一般现在时中，如果主语是“you”，我们需要用哪个助动词来帮助构成疑问句？","hint":"主语是I/you/we/they用do，主语是he/she/it用does。","takeaway":"当主语是第二人称 “you” 时，一般现在时的特殊疑问句需要使用助动词 “do”。"},{"question":"助动词“do”后面跟的动词应该是什么形式？","hint":"无论是do, does还是did，它们作为助动词出现在疑问句或否定句中时，后面的主动词都用一种形式。","takeaway":"助动词do/does/did后面必须跟动词原形。"}]},{"title":"词义辨析","steps":[{"question":"题干中 “of” 这个介词提示我们，前面应该跟一个什么样的动词来表达“认为”？","hint":"想一个动词，它和of搭配可以表示“对...有看法”。","takeaway":"“think of” 是一个固定的动词短语，意思就是“认为”或“对……有某种看法”。"},{"question":"我们能用 “What do you see of...?” 或者 “What do you say of...?” 来问别人的看法吗？","hint":"虽然see和say也是动词，但它们和of的搭配没有“认为”的意思。","takeaway":"不同的动词与介词搭配有不同的含义，必须使用符合习惯和语境的固定搭配。"}]}]}},{"number":"32","item_type":"sentence_transform","context_note":"","stem":"我下周将去美国。\nI will _____ _____ the USA next week.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"go|to","explanation_md":"本题考察一般将来时的用法和介词搭配。中文“将去”和句中的时间状语 “next week”（下周）都表明这是一个发生在将来的动作，需要使用将来时。题干中已给出助动词 “will”，它后面必须跟动词原形。表示“去”的动词原形是 “go”。而“去某个地方”的常用表达是 “go to a place”，其中 “to” 是介词，表示方向。因此，两个空应分别填入 “go” 和 “to”。","knowledge_expansion_md":"**1. 一般将来时 (Simple Future Tense)**\n主要有两种结构：\n*   `will + 动词原形`: 常用于表达临时的决定、意愿、许诺或预测。例：`I will call you back later.` (我稍后会回你电话。)\n*   `be going to + 动词原形`: 常用于表达事先计划好的安排，或根据已有迹象判断即将发生的事。例：`It's 8:00. We are going to be late.` (8点了，我们要迟到了。)\n\n**2. 动词 `go` 的用法**\n*   `go to + 地点名词`: 去某地。例: `go to the cinema`。\n*   `go home/abroad/there/here`: `home`, `abroad`, `there`, `here` 是地点副词，前面不加介词 `to`。\n*   `go + v-ing`: 去做某项活动。例: `go shopping`, `go swimming`。","socratic_tracks":[{"title":"将来时态结构","steps":[{"question":"句子里有一个词 “will”，它是什么词？它后面的动词应该用什么形式？","hint":"“will” 是一个情态动词，比如 can, may, must。想一想这些词后面的动词规则。","takeaway":"情态动词 “will” 后面必须跟动词原形。"},{"question":"根据中文意思“我下周将去美国”，表示“去”的动词原形是什么？","hint":"这个词很简单，只有两个字母。","takeaway":"表示“去”的动词原形是 “go”，所以第一个空填 “go”。"}]},{"title":"介词搭配","steps":[{"question":"我们已经确定了动词是“go”。那么，当我们要表达“去一个具体的地方”，比如“去美国”，在动词“go”和地点“the USA”之间需要加一个什么词？","hint":"这个词表示一个动作的方向，朝向某个地方。","takeaway":"“go to a place” 是一个固定搭配，表示“去某地”，所以需要介词 “to”。"},{"question":"是不是所有“go”后面的地点前都要加“to”呢？比如“回家”怎么说？","hint":"“家”在这里被当作一个副词，而不是名词。","takeaway":"当go后面跟 home, here, there, abroad 等副词时，中间不需要加介词to。"}]},{"title":"冠词用法","steps":[{"question":"为什么题干中是 “the USA”，而不是 “USA”？这个 “the” 是必须的吗？","hint":"想一想USA的全称是什么？The United States of America。它是由很多州组成的国家。","takeaway":"对于由多个部分组成的联邦、共和国、王国或群岛等国家名称，通常需要加定冠词 “the”。"},{"question":"你还能举出其他需要加 “the” 的国家名称吗？比如英国、荷兰。","hint":"英国是 a kingdom (王国)，荷兰是 the Netherlands (复数形式)。","takeaway":"需要加the的国家名还有：the UK (the United Kingdom), the Netherlands, the Philippines 等。"}]}]}},{"number":"33","item_type":"sentence_transform","context_note":"","stem":"如果我有空，我会去游览香港。\n_____ I am free, I _____ _____ Hong Kong.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"If|will|visit","explanation_md":"本题考查 if 引导的真实条件状语从句。\n1.  根据中文提示“如果”，第一个空应填入连词 `If`，引导条件状语从句。\n2.  该句型遵循“主将从现”原则，即主句使用一般将来时，从句使用一般现在时。\n3.  从句 `I am free` 是一般现在时，因此主句“我会去游览”需要用一般将来时 `will + 动词原形`。\n4.  “游览”的动词原形是 `visit`，因此后两个空依次填入 `will` 和 `visit`。","knowledge_expansion_md":"### 知识点拓展：if 引导的真实条件状语从句\n\n1.  **基本结构**：`If + 从句 (一般现在时), 主句 (一般将来时)`。\n    -   这个结构被称为“主将从现”，是考试中的高频考点。它用来描述一个在将来很可能发生的条件及其可能导致的结果。\n    -   例：`If it rains tomorrow, we will stay at home.` (如果明天下雨，我们就待在家里。)\n\n2.  **主从句位置**：主句和从句的位置可以互换，但含义不变。当 `If` 从句放在主句之后时，两个句子之间不需要用逗号隔开。\n    -   例：`I will visit Hong Kong if I am free.`\n\n3.  **主句的其他形式**：主句除了一般将来时 `will + do`，还可以是含有情态动词的句子（如 `can`, `may`, `must`）或祈使句。\n    -   例：`If you are tired, you can have a rest.` (如果你累了，可以休息一下。)\n    -   例：`If you see him, please tell him the news.` (如果你见到他，请告诉他这个消息。)","socratic_tracks":[{"title":"条件状语从句","steps":[{"question":"句首的空需要填一个什么词来表达“如果”的意思？","hint":"想想我们学过的表示假设或条件的连词。","takeaway":"“如果”在英语中通常用连词 'If' 来引导条件状语从句。"},{"question":"这个由 'If' 引导的从句描述的是一个真实可能发生的情况，还是一个与现在事实相反的虚拟情况？","hint":"看看从句中的动词 'am'，它是现在时还是过去时？","takeaway":"从句使用了一般现在时，表示这是一个真实条件句，即“如果我有空”是可能发生的。"}]},{"title":"主句时态","steps":[{"question":"主句“我会去游览香港”描述的是什么时候的动作？","hint":"“会去”是表示过去、现在还是将来？","takeaway":"主句描述的是一个将来的计划或意图。"},{"question":"在英语中，我们通常用什么结构来表达将来的动作？","hint":"想想表示“将要”的助动词。","takeaway":"表达将来时，最常用的结构是 'will + 动词原形'。"}]},{"title":"句型结构“主将从现”","steps":[{"question":"观察一下，当 'If' 引导的从句用了一般现在时 (I am free)，主句应该用什么时态？","hint":"我们刚刚分析出主句是将来时。这是一种固定的搭配吗？","takeaway":"在 'If' 引导的真实条件句中，遵循“主将从现”的原则，即主句用将来时，从句用一般现在时。"},{"question":"那么，“游览”这个词应该用什么形式填在 'will' 后面？","hint":"助动词 'will' 后面跟动词的什么形式？","takeaway":"助动词 'will' 后面必须跟动词原形，所以填 'visit'。"}]}]}},{"number":"34","item_type":"sentence_transform","context_note":"","stem":"昨天我们玩得很开心，我们去放风筝和游泳了。\nWe had a good time yesterday. We _____ _____ and _____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"went|kite-flying|swimming","explanation_md":"本题考查一般过去时和 `go doing` 结构。\n1.  根据句中的时间状语 `yesterday` (昨天)，可知描述的动作发生在过去，因此全句应使用一般过去时。\n2.  “去放风筝”和“去游泳”是两个动作，动词“去”应使用其过去式 `went`。\n3.  英语中表示进行某种娱乐或体育活动，常用 `go + v.-ing` 的固定搭配。\n4.  因此，“放风筝 (fly a kite)” 和 “游泳 (swim)” 需要变为 `kite-flying` 和 `swimming` 的形式。\n5.  `and` 连接两个并列的活动，所以两个词都用 `-ing` 形式。","knowledge_expansion_md":"### 知识点拓展：一般过去时与 `go doing` 结构\n\n1.  **一般过去时**：\n    -   **功能**：表示过去某个时间发生的动作或存在的状态。\n    -   **标志词**：`yesterday`, `last week/year`, `... ago`, `in 1999`, `just now` 等。\n    -   **构成**：动词使用过去式。规则动词在词尾加 `-ed`，不规则动词需要专门记忆，如本题中的 `go` → `went`。\n\n2.  **`go + v.-ing` 结构**：\n    -   这是一个非常常见的固定搭配，用来表示“去做某项（通常是户外的、娱乐性的）活动”。\n    -   常见的例子包括：`go shopping` (去购物), `go swimming` (去游泳), `go fishing` (去钓鱼), `go hiking` (去远足), `go skating` (去滑冰), `go boating` (去划船)。\n    -   注意，这里的 `v.-ing` 是动名词，作 `go` 的宾语。\n\n3.  **并列连词 `and`**：\n    -   `and` 用于连接两个或多个语法功能和形式相同的词、短语或句子。这被称为并列结构。\n    -   在本题中，`and` 连接了两个动名词短语 `kite-flying` 和 `swimming`，表示我们同时进行了这两项活动。","socratic_tracks":[{"title":"动词时态判断","steps":[{"question":"句子中的 'yesterday' 告诉我们动作发生在什么时候？","hint":"'yesterday' 是“昨天”的意思。","takeaway":"'yesterday' 表明整个句子描述的是过去发生的事情。"},{"question":"既然是过去发生的事，那么描述“去”这个动作的动词应该用什么时态？它的过去式是什么？","hint":"'go' 是一个不规则动词。","takeaway":"动词 'go' 的过去式是 'went'，所以第一个空填 'went'。"}]},{"title":"固定搭配 'go doing'","steps":[{"question":"“去放风筝”和“去游泳”在英语中有什么常见的表达方式？","hint":"想一想表示“去做某项娱乐活动”的句型。","takeaway":"英语中常用 'go + v.-ing' 结构来表示进行某项运动或活动。"},{"question":"那么，“放风筝 (fly a kite)”和“游泳 (swim)”应该变成什么形式放在 'went' 后面？","hint":"把动词 'fly' 和 'swim' 变成 '-ing' 形式。注意 'swim' 的拼写变化。","takeaway":"它们需要变成动名词形式 'kite-flying' 和 'swimming'。"}]},{"title":"并列结构","steps":[{"question":"连词 'and' 在这里连接了哪两个部分？","hint":"'and' 前面是 'kite-flying'，后面应该是什么？","takeaway":"'and' 在这里连接了两个并列的活动。"},{"question":"为了保持句子结构的平行和对称，'and' 前后的词语形式应该是什么关系？","hint":"如果前面是动词的-ing形式，后面也应该是吗？","takeaway":"'and' 连接的并列成分在形式上应保持一致，所以 'kite-flying' 和 'swimming' 都用了 v.-ing 形式。"}]}]}},{"number":"35","item_type":"sentence_transform","context_note":"","stem":"对于我来说，解出这道数学难题是困难的。\nIt is _____ for me _____ work out the maths problem.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"difficult|to","explanation_md":"本题考查 `It is + adj. + for sb. + to do sth.` 的固定句型。\n1.  这个句型用来表达“对某人来说做某事是……的”。\n2.  其中 `It` 是形式主语，真正的主语是后面的动词不定式短语 `to do sth.`。\n3.  根据中文“困难的”，第一个空应填入一个形容词，如 `difficult` 或 `hard`。\n4.  “解出这道数学难题”是句子的真正主语，需要用动词不定式 `to do` 的形式来表达，即 `to work out the maths problem`。\n5.  因此，第二个空应填入不定式符号 `to`。","knowledge_expansion_md":"### 知识点拓展：`It` 作形式主语的句型\n\n**句型结构**：`It is + 形容词 + for/of sb. + to do sth.`\n\n这个句型是为了避免主语过长而导致句子头重脚轻，所以使用 `It` 作为形式主语，将真正的主语（动词不定式短语）后置。\n\n1.  **`for sb.` 和 `of sb.` 的区别**：\n    -   **`for sb.`**：当句中的形容词是用来描述**事情**的特征（如难易、重要性、可能性等）时，使用 `for sb.`。常见的这类形容词有：`difficult`, `hard`, `easy`, `important`, `necessary`, `possible`, `impossible`。\n        -   例：`It is important for us to learn English well.` (对我们来说，学好英语很重要。)\n    -   **`of sb.`**：当句中的形容词是用来描述**人**的性格、品质或特点时，使用 `of sb.`。常见的这类形容词有：`kind`, `nice`, `good`, `clever`, `wise`, `foolish`, `stupid`, `polite`, `rude`。\n        -   例：`It was kind of you to help me.` (你帮助我，真是太好了。)\n\n2.  **句型转换**：这个句型可以和以动词不定式作主语的句子进行转换。\n    -   `It is difficult for me to work out the maths problem.`\n    -   `To work out the maths problem is difficult for me.` (虽然语法正确，但不常用)","socratic_tracks":[{"title":"'It'作形式主语","steps":[{"question":"这个句子的主语是什么？是 'It' 吗？","hint":"'It' 在这里只是一个占位置的词，真正的主语在句子的后面。","takeaway":"'It' 是形式主语，真正的主语是后面的不定式短语 'to work out the maths problem'。"},{"question":"我们为什么要使用 'It' 作形式主语，而不直接把真正的主语放在句首呢？","hint":"如果把 'To work out the maths problem...' 放在句首，句子读起来会怎么样？","takeaway":"使用形式主语 'It' 可以避免句子头重脚轻，使结构更平衡、表达更地道。"}]},{"title":"句型结构分析","steps":[{"question":"题干给了 'It is ___ for me ___ work out...'，这是一个什么固定句型？","hint":"想想“对某人来说做某事是...的”怎么表达。","takeaway":"这是 'It is + 形容词 + for sb. + to do sth.' 的句型。"},{"question":"根据中文意思“困难的”，第一个空应该填一个什么词性的词？","hint":"“困难的”是一个形容词。","takeaway":"第一个空应填入形容词 'difficult' 或 'hard'。"},{"question":"句型中的 'to do sth.' 部分是动词不定式，那么第二个空应该填什么？","hint":"动词不定式的标志是什么？","takeaway":"第二个空应填入 'to'，构成不定式 'to work out'。"}]},{"title":"'for' 与 'of' 的辨析","steps":[{"question":"在这个句型中，我们有时用 'for sb.'，有时用 'of sb.'。你知道它们的区别吗？","hint":"想想形容词 'difficult' 是修饰“解题”这件事，还是修饰“我”这个人？","takeaway":"当形容词评价的是“事情”的性质（如 difficult, easy）时，用 'for sb.'。"},{"question":"那什么时候用 'of sb.' 呢？能举个例子吗？","hint":"比如，“你人真好，能帮我。” (It is kind ___ you to help me.)","takeaway":"当形容词是评价人的性格、品质（如 kind, nice, clever）时，用 'of sb.'。"}]}]}}]},{"section_title":"VI. 书面表达","section_instruction":"(共1题；共15分)","items":[{"number":"36","item_type":"writing","context_note":"","stem":"假如你是Tom, 你的笔友是Bill, 请根据表格内容向大家介绍他。可适当拓展。\n要求:\n(1) 语法正确, 意思连贯, 措辞通顺, 书写工整;\n(2) 词数不少于60词。\n\n| Name             | Bill                   |\n| ---------------- | ---------------------- |\n| Age              | 13                     |\n| Phone number     | 6263-7118              |\n| School           | No. 15 Middle School   |\n| Favourite subject| Chinese                |\n| Favourite sports | tennis                 |\n| Favourite food   | ice cream, hamburgers  |\n\nI'm Tom. Let me introduce my best friend Bill to you. He","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"请在此处写作","teaching":{"correct_answer":"I'm Tom. Let me introduce my best friend Bill to you. He is a 13-year-old boy and he studies at No. 15 Middle School. He is a good student and his favourite subject is Chinese. In his free time, he loves doing sports, and playing tennis is his favourite activity. He also likes food very much. Hamburgers and ice cream are his favourites. Bill is a friendly and interesting boy. I'm glad to be his friend.","explanation_md":"这篇作文要求根据表格信息介绍笔友 Bill。一篇优秀的范文应做到以下几点：\n1.  **内容完整**：涵盖表格中除电话号码外的所有关键信息，如姓名、年龄、学校、喜爱的科目、运动和食物。\n2.  **结构清晰**：文章有明确的开头（引出人物）、主体（分点介绍）和结尾（总结评价），条理清晰。\n3.  **表达准确**：使用正确的时态（一般现在时）和人称（第三人称 `he`），语法无误。\n4.  **句式多样**：灵活运用不同的句式来表达“喜欢”，如 `his favourite ... is ...`, `he loves ...`, `... are his favourites`，避免表达单一。\n5.  **适当拓展**：在介绍信息的基础上，加入如 `He is a good student`, `In his free time`, `Bill is a friendly and interesting boy` 等过渡或评价性语句，使文章更自然、丰满，并满足词数要求。","knowledge_expansion_md":"### 写作技巧拓展：人物介绍类作文\n\n1.  **文章结构（三段式）**：\n    -   **开头**：开门见山，点明要介绍的人物及其与你的关系。例如：`I'd like to introduce my friend, Bill, to you.`\n    -   **主体**：核心部分。围绕主题（表格、图片或文字提示）分点介绍人物的基本信息、外貌、性格、爱好等。注意使用过渡词（`and`, `also`, `besides`）和短语（`In his free time`）使段落连贯。\n    -   **结尾**：用一两句话进行总结，表达你对这个人的看法或感情。例如：`He is a great friend. I am happy to have a friend like him.`\n\n2.  **常用词汇和句型**：\n    -   **介绍年龄/学校**：`He is ... years old.` / `He studies at/in ...`\n    -   **表达喜好**：`He likes/loves ...` / `He enjoys doing sth.` / `His favourite ... is ...` / `He is good at ...`\n    -   **描述性格**：`He is friendly/kind/helpful/funny/outgoing/quiet.`\n    -   **描述外貌**：`He is tall/short.` / `He has big eyes/short hair.`\n\n3.  **写作注意事项**：\n    -   **人称和时态**：介绍他人通常使用第三人称（`he/she`），描述客观事实和习惯爱好时使用一般现在时。\n    -   **信息取舍**：对于题目给出的信息，要进行合理取舍。例如，在公开介绍中，通常会省略电话号码、家庭住址等隐私信息。\n    -   **避免逐字翻译**：不要将中文提示或表格信息生硬地翻译成英文，而要用流畅、地道的句子将其组织起来。","socratic_tracks":[{"title":"谋篇布局","steps":[{"question":"一篇介绍人物的短文，一般应该包含哪几个部分？","hint":"想想看，是不是应该先总起，然后分点介绍，最后总结？","takeaway":"一篇介绍性短文通常包括开头、主体和结尾三个部分。"},{"question":"针对这篇作文，开头、主体和结尾分别应该写什么内容？","hint":"开头已经给出。主体部分可以介绍表格里的信息。结尾可以谈谈你对他的看法。","takeaway":"主体部分应围绕表格信息展开，如年龄、学校、爱好等；结尾可以表达对朋友的评价或感情。"}]},{"title":"信息整合与表达","steps":[{"question":"如何将表格中关于“年龄”和“学校”的两个零散信息自然地合并到一句话里？","hint":"试试用 'and' 连接两个并列的描述。","takeaway":"可以用 'He is ... years old and he studies at ...' 这样的句式来整合信息。"},{"question":"描述“最喜欢的科目”时，除了说 'His favourite subject is Chinese'，还能怎样让句子更丰富？","hint":"可以加上一个原因，比如他为什么喜欢语文。","takeaway":"可以适当拓展，用 'because' 解释原因，如 'His favourite subject is Chinese because he finds it interesting.'"}]},{"title":"词汇与句式多样性","steps":[{"question":"在表达“喜欢”时，除了用 'like'，还有哪些词或短语可以用？","hint":"想想比 'like' 程度更深的词，或者表示“享受做某事”的短语。","takeaway":"我们可以用 'love', 'enjoy', 'be fond of' 等词汇来替换 'like'，使表达更多样。"},{"question":"表格里提到了他最喜欢的运动和食物，如何用不同的句式来介绍这两项爱好，避免重复？","hint":"介绍运动时可以说 'Playing tennis is his favourite.'，介绍食物时可以说 '... are his favourites.'。","takeaway":"可以变换句式，如使用 'His favourite sport is...' 和 '...are his favourite foods'，以增加文章的文采。"}]}]}}]}],"content_markdown":"## 成都某实验外国语学校初2026级新初一入学真卷英语\n\n**满分60分 时间:50分钟**\n\n### I. 单项选择\n(共10小题；每小题1分，共10分)\n\n1. —Could you please give me two _____? I have something to write down.\n   A. pieces of papers\n   B. pieces of paper\n   C. papers\n   D. piece of paper\n\n2. The boy on _____ chair needs _____ uniform for his new term.\n   A. a; an\n   B. the; an\n   C. the; a\n   D. the; the\n\n3. The People's Republic of China was founded _____.\n   A. in Oct. 1st, 1949\n   B. on 1949, Oct. 1st\n   C. in 1st, Oct. 1949\n   D. on Oct. 1st, 1949\n\n4. Which do you like _____, bread, eggs or sandwiches?\n   A. better\n   B. best\n   C. well\n   D. much\n\n5. We are looking for the key _____ the front door but we can't find it.\n   A. with\n   B. from\n   C. to\n   D. of\n\n6. He _____ a new pen on his way home yesterday.\n   A. bought\n   B. has bought\n   C. buys\n   D. will buy\n\n7. My brother usually _____ up late but tomorrow he _____ up early.\n   A. gets; get\n   B. get; will get\n   C. gets; will get\n   D. get; will gets\n\n8. Peter has collected three _____ Chinese stamps.\n   A. hundreds\n   B. hundreds of\n   C. hundred of\n   D. hundred\n\n9. —Would you like some milk?\n   —Yes, please, but just _____.\n   A. a few\n   B. few\n   C. little\n   D. a little\n\n10. —Excuse me, I want to see Mr. Johnson.\n    —OK. _____.\n    A. What's wrong with you?\n    B. This way please.\n    C. He is working now.\n    D. Mr. Johnson isn't in.\n\n### II. 完形填空\n(共10小题；每小题1分，共10分)\n阅读下面短文，掌握其大意，然后从各题所给的A、B、C、D四个选项中，选出最佳选项。\n\nMr and Mrs Wilson lived in a big crowded city, and one summer they took a __11__ in the country. They enjoyed it very much, __12__ it was a quiet, clean place and very different from the __13__. One day, __14__, went for a walk early in the morning and met an old man. He was sitting alone in the warm sun outside his front door. Mr Wilson __15__ him, “Do you like living in such a __16__ place?”\nThe old man said, “Yes, I do.”\nMr Wilson said, “What are the __17__ things about it?”\nThe old man answered, “Well, everybody __18__ everybody else. People often come and visit me, __19__ I often go and visit them. And __20__ are a lot of children here.”\nMr Wilson said, “That's interesting. And what are the bad things?”\nThe old man thought for a few minutes and said, “Well, the same things really.”\n\n11. A. run B. drink C. plane D. holiday\n12. A. if B. so C. or D. because\n13. A. city B. garden C. town D. village\n14. A. it B. he C. they D. she\n15. A. met B. spoke C. looked D. asked\n16. A. quiet B. crowded C. important D. wrong\n17. A. bad B. good C. wrong D. right\n18. A. asks B. helps C. teaches D. telephones\n19. A. and B. but C. before D. or\n20. A. we B. they C. there D. people\n\n### III. 阅读理解\n(共5小题；每小题2分，共10分)\n阅读下列短文，从每题所给的A、B、C、D四个选项中，选出最佳选项。\n\nGuangdong has been regarded as a famous paradise of diverse and wonderful foods. Most of the people of Guangdong thought that dim sum and dumplings are foods fit for the Spring Festival; Newsgit interviewed both expats and locals across Guangdong.\n\n**Poon choi (盆菜):** Cantonese people like to mix a variety of meats, seafood and mushrooms in a large “basin” (盆子). The dish can be widely bought from hotels, restaurants and even online.\n\n**Jiandui (fried cake with sesame seeds):** It's a famous snack in Guangzhou. It's a round fried pastry made from glutinous rice flour with yellow crisp skin and tasteful filling. It also carries good wishes that you will be blessed with fortune and luck all year round.\n\n**Lettuce porridge:** Lettuce in Chinese is “生菜”, which sounds like “生财” in Mandarin. Cantonese people will make lettuce porridge in Spring Festival as it implies luck and wealth.\n\n**Hakka stuffed tofu:** It's a traditional dish for the Hakka people. It's famous for the thickened soup and a tender and fresh taste. People in Hakka areas such as Meizhou, Huizhou and Heyuan often entertain the guests with this dish in festivals or banquets(宴会).\n\n21. Where can we probably find this passage?\n    A. From a novel.\n    B. From a newspaper.\n    C. From a comic book.\n    D. From a fiction.\n\n22. How many kinds of food are introduced here?\n    A. One.\n    B. Two.\n    C. Three.\n    D. Four.\n\n23. What is the main meaning of the word “expats”?\n    A. Someone who doesn't live in their own country.\n    B. Someone who enjoys cooking.\n    C. Someone who wants to send gifts.\n    D. Someone who works in Guangzhou.\n\n24. Which of the following is TRUE?\n    A. Most of the people in Guangzhou are interviewed.\n    B. Poon choi can be bought from hotels and even online.\n    C. Most of the people in Guangdong supposed that dim sum and dumplings are suitable for the occasion.\n    D. Hakka stuffed tofu is a symbol of good wishes with fresh taste.\n\n25. Which dish will you cook if you want your friends to be wealthy and lucky?\n    A. Poon choi and Jiandui.\n    B. Lettuce porridge and Hakka stuffed tofu.\n    C. Jiandui and Lettuce porridge.\n    D. All of the above.\n\n### IV. 语法填空\n(共5小题；每小题1分，共5分)\n根据短文内容, 从短文后的选项中选出能填入空白处的最佳选项, 使短文意思通顺、结构完整。\n\nThe weather in Australia is not the same as ours, because the seasons are opposite. __26__ Australia is a southern country. __27__ June, July and August are the winter months; September, October and November are spring, the summer is in December, January and February and March, April and May are the autumn months.\nA very large part of the country has no rain at all. The east coast has rain all the year round. __28__ The southeast winds blow all the year round. They bring rain from the sea. __29__ The southeast part of Australia has summer rain from the southeast wind. __30__\n\n**Options for 26-30**\n\nA. When it is winter in China, it is summer there.\nB. There are no dry months there.\nC. They only blow here in summer.\nD. There is not much rain on the west side.\nE. It is in the south of the world.\n\n### V. 完成句子\n(共5小题；每空1分，共10分)\n\n31. 你认为李老师的新裙子怎么样？\n    What _____ you _____ of Miss Li's new dress?\n\n32. 我下周将去美国。\n    I will _____ _____ the USA next week.\n\n33. 如果我有空, 我会去游览香港。\n    _____ I am free, I _____ _____ Hong Kong.\n\n34. 昨天我们玩得很开心, 我们去放风筝和游泳了。\n    We had a good time yesterday. We _____ _____ and _____.\n\n35. 对于我来说, 解出这道数学难题是困难的。\n    It is _____ for me _____ work out the maths problem.\n\n### VI. 书面表达\n(共1题；共15分)\n\n假如你是Tom, 你的笔友是Bill, 请根据表格内容向大家介绍他。可适当拓展。\n要求:\n(1) 语法正确, 意思连贯, 措辞通顺, 书写工整;\n(2) 词数不少于60词。\n\n| Name             | Bill                   |\n| ---------------- | ---------------------- |\n| Age              | 13                     |\n| Phone number     | 6263-7118              |\n| School           | No. 15 Middle School   |\n| Favourite subject| Chinese                |\n| Favourite sports | tennis                 |\n| Favourite food   | ice cream, hamburgers  |\n\nI'm Tom. Let me introduce my best friend Bill to you. He\n\n(请在此处写作)\n","proofread_notes":["去非关联内容：根据终审要求，阅读理解文章前的引导语“Let's see what funny things unfolded here. Let's learn more...”与答题无关，已删除。","题型规范：第二大题为完形填空，为使题型分类更准确，已将各小题的 `item_type` 从 `choice` 修正为 `cloze`。","内容一致性：第三大题第23题题干指明“underlined word”，但原文中“expats”一词无下划线，已将题干中的“underlined”删除。","格式规范：统一了各题型的分数说明格式，并对全文中英文标点、空格及换行进行了整理，确保格式符合出版要求。"],"set_number":7,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_07\\page_015.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_07\\page_016.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":36},{"step":2,"name":"verify","items":36,"check_passed":true,"issues_count":4},{"step":3,"name":"polish","items":36}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:54:01.655140+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
  <script>

  const INLINE_CFG = {

  let modalWordForTts = "";

  async function deepseekChat(userContent, maxTokens) {

  function xmlEscapeTts(s) {

  function isFillBlankQuizType(t) {

  const state = {

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    const raw = String(stem || "").replace(/\r\n/g, "\n");
    const lines = raw.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    let html = "";
    chunks.forEach((ch) => {
      if (ch.kind === "text") {
        html +=
          "<div class='writing-stem-text'>" + esc(ch.text).replace(/\n/g, "<br>") + "</div>";
      } else {
        html += markdownPipeTableLinesToHtml(ch.lines);
      }
    });
    return html;
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

    state.byType = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
    });
  }

  function typeLabel(t) { return TYPE_LABELS[t] || t || "其他"; }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphs(String(passage || "").trim());
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphsExam(String(passage || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    return false;
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const t = String(fullText || "");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (!mp) return t.trim();
      bodyStart = mp.index + mp[0].length;
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "reading") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupFillBlankBySectionInstruction(rows) {

      let j = i + 1;

  /** 大题说明里 (53) Y_____ 式文中空，小题无 stem、无 A–D（首字母填空对话等） */
  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !/\(\d+\)[^_\n\r]*_{3,}/.test(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(m[0]).replace(/\n/g, "<br>");
      }
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      out += rk
        ? "<span class='exam-blank'>&nbsp;</span>"
        : esc(m[0]).replace(/\n/g, "<br>");
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text'>" + out + "</div>";
  }

  function groupDetailsByClozeSection(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const ins = String(details[i].row.section_instruction || "").trim();
      let j = i + 1;
      while (j < details.length) {
        if (String(details[j].row.section_instruction || "").trim() !== ins) break;
        j++;
      }
      groups.push({ passage: details[i].row.section_instruction || "", details: details.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function clozeAnswerWordFromItem(it) {
    const teach = it.teaching || {};
    const opts = it.options && typeof it.options === "object" ? it.options : {};
    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";
    const caUp = caRaw.toUpperCase().charAt(0);
    if ("ABCDEFG".indexOf(caUp) >= 0) {
      const tx = String(opts[caUp] || "").trim();
      if (tx) return tx;
    }
    return caRaw;
  }

  function clozeNumToAnswerMap(detailsPairs) {
    const map = Object.create(null);
    detailsPairs.forEach(({ row }) => {
      const it = row.it;
      const n = String(it.number || "").trim();
      if (!n) return;
      const w = clozeAnswerWordFromItem(it);
      map[n] = w;
      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
    });
    return map;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");
        }
        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);
  }

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};
    const seg = (chunk) =>
      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!stem) return "<p class='stem'></p>";
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;
  }

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：练习/PDF/讲解中整段不展示 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));
  }

  /** 左侧已有文章的完形/语法填空小题：仅展示纵向 A–D(或含 E…)，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || !isClozeLikeQuizType(row.type)) return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const optLetters = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim());
    if (optLetters.length) return { letters: optLetters, opts: raw };
    if (isClozeLikeQuizType(typ)) {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  /** 完形/语法填空练习页：选项自上而下纵向排列 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  function quizOptsGridClass(letters, opts) {
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
    return "opts opts-cols-" + c;
  }

  function renderTransformStemHtml(stem, qkey) {
    if (!stem) {
      return "<p class='stem'><span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='0' autocomplete='off' /></span></p>";
    }
    if (/_{3,}/.test(stem)) return renderStemHtml(stem, qkey);
    return (
      "<p class='stem'>" +
      esc(stem).replace(/\n/g, "<br>") +
      " <span class='blank-line'><input type='text' data-k='" +
      esc(qkey) +
      "' data-bi='0' autocomplete='off' placeholder='作答' /></span></p>"
    );
  }

  function parseTransformAnswerParts(ca) {
    return String(ca || "").split("|").map((s) => s.trim());
  }

  /** 讲解页：句型转换题干，用正确答案填入空格并高亮（与完形「填入答案」样式一致） */
  function buildTransformFilledStemHtml(stem, ca) {
    const parts = parseTransformAnswerParts(ca);
    const stemStr = String(stem || "");
    const blankPh = "—";
    const spanAns = (w) =>
      "<span class='cloze-filled-ans'>" + esc(w && String(w).trim() ? w : blankPh) + "</span>";

    if (!stemStr.trim()) {
      const w = String(ca || "").trim() || parts.filter(Boolean).join(" | ") || blankPh;
      return "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" + spanAns(w) + "</div>";
    }

    if (/_{3,}/.test(stemStr)) {
      const chunks = stemStr.split(/_{3,}/);
      let h = "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>";
      const n = chunks.length - 1;
      for (let i = 0; i < chunks.length; i++) {
        h += esc(chunks[i]).replace(/\n/g, "<br>");
        if (i < n) {
          const w = i < parts.length ? parts[i] : "";
          h += spanAns(w);
        }
      }
      h += "</div>";
      return h;
    }

    const tail =
      String(ca || "").trim() ||
      (parts.length ? parts.filter(Boolean).join(" | ") : "") ||
      blankPh;
    return (
      "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" +
      esc(stemStr).replace(/\n/g, "<br>") +
      " " +
      spanAns(tail) +
      "</div>"
    );
  }

  function renderOpenAnswerStem(stem, qkey, rowType, quizType) {
    const isTf = rowType === "sentence_transform" || quizType === "sentence_transform";
    if (isTf) return renderTransformStemHtml(stem, qkey);
    if (
      rowType === "writing" &&
      quizType === "writing" &&
      writingStemHasPipeTable(stem)
    ) {
      return (
        "<div class='stem writing-stem'>" +
        writingPromptToHtml(stem) +
        "</div><textarea class='area' data-k='" +
        esc(qkey) +
        "' rows='8' placeholder='在此续写全文'></textarea>"
      );
    }
    return renderStemHtml(stem, qkey) + "<textarea class='area' data-k='" + esc(qkey) + "' rows='6' placeholder='在此作答（多空用 | 分隔）'></textarea>";
  }

  /** 按真题卷面顺序：自上而下扫 sections→items，题型首次出现顺序（与 buildFlat 的 state.flat 一致） */
  function typesInPaperAppearanceOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const t = row.type;
      if (seen[t]) return;
      if (!(state.byType[t] || []).length) return;
      seen[t] = true;
      out.push(t);
    });
    return out;
  }

  function orderedTypesList() {
    const paper =
      EXAM.exam_meta &&
      String(EXAM.exam_meta.type_card_order || "").toLowerCase() === "paper";
    if (paper) {
      return typesInPaperAppearanceOrder();
    }
    return Object.keys(state.byType)
      .filter((x) => (state.byType[x] || []).length > 0)
      .sort((a, b) => {
        const ia = TYPE_ORDER.indexOf(a);
        const ib = TYPE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
  }

  /** 生成某题型答题区 HTML（供页面与 PDF 共用） */
  function buildQuizBodyHtml(t) {
    const rows = state.byType[t] || [];
    const readingGroups = t === "reading" ? groupReadingByPassage(rows) : [];
    const writingGroups = t === "writing" ? groupWritingByPassage(rows) : [];
    let html = "";
    if (isClozeLikeQuizType(t) && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0])) return;
        if (isClozeInlineFillSectionGroup(g)) {
          const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
          html +=
            "<div class='pdf-cloze-unit cloze-inline-fill-unit'><div class='cloze-passage-card card'>" +
            "<h2>" +
            esc(gTitle) +
            "</h2>" +
            htmlClozeInstructionWithInlineBlanks(g.instruction, g.rows) +
            "</div></div>";
          return;
        }
        const ins = g.instruction.trim();
        const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
        const sp = splitSectionHintAndBody(ins);
        const hintTop = sp.hint
          ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
          : "";
        const mainIns = sp.body || ins;
        const passageHtml = ins
          ? "<div class='cloze-passage-card card'><h2>" +
            esc(gTitle) +
            "</h2>" +
            hintTop +
            "<div class='cloze-passage-text'>" +
            formatPassageParagraphs(mainIns) +
            "</div></div>"
          : "<div class='cloze-passage-card card'><p class='muted'>（本篇暂无导语，请仅根据右侧选项作答。）</p></div>";
        let rightCol =
          "<div class='cloze-options-col'><h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>答题区</h2>";
        g.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          const diaGap = isClozeDialoguePlaceholderStem(it.stem);
          rightCol +=
            "<div class='card q-block cloze-opt-card" +
            (diaGap ? " cloze-dialogue-gap-card" : "") +
            "' data-qkey='" +
            esc(qkey) +
            "'><div class='q'>";
          if (diaGap) {
            rightCol += "<div class='cloze-dialogue-gap-badge'>" + esc(num) + ".</div>";
          } else {
            rightCol +=
              "<div class='q-head'><span class='q-num'>第 " + esc(num) + " 空</span><span class='tag'>" + esc(t) + "</span></div>";
          }
          const layoutC = getObjectiveChoiceLayout(row, it);
          const lettersC = layoutC.letters;
          const optsC = layoutC.opts;
          const abcdOnly = isPassageClozeAbcdLayout(row, it);
          if (lettersC.length) {
            if (!diaGap && !abcdOnly) {
              rightCol += renderStemHtml(it.stem, qkey);
            }
            if (abcdOnly) {
              rightCol += "<div class='opts opts-cloze-abcd'>";
              rightCol += htmlQuizRadioOptionsAbcdGrid(lettersC, optsC, qkey);
            } else {
              rightCol += "<div class='" + quizOptsGridClass(lettersC, optsC) + "'>";
              rightCol += htmlQuizRadioOptions(lettersC, optsC, qkey);
            }
            rightCol += "</div>";
          } else {
            rightCol += renderStemHtml(it.stem, qkey);
          }
          rightCol += "</div></div>";
        });
        rightCol += "</div>";
        html +=
          "<div class='pdf-cloze-unit'><div class='cloze-quiz-layout'><div class='cloze-passage-col'>" +
          passageHtml +
          "</div>" +
          rightCol +
          "</div></div>";
      });
    } else if (t === "reading" && readingGroups.some((g) => g.passage)) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtml;
          if (g.fromSection) {
            passageHtml =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passageHtml =
              "<div class='reading-passage-card card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          let rightCol = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            rightCol += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            rightCol += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            rightCol += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR = getObjectiveChoiceLayout(row, it);
            const lettersR = layoutR.letters;
            const optsR = layoutR.opts;
            if (lettersR.length) {
              rightCol += renderStemHtml(it.stem, qkey);
              rightCol += "<div class='" + quizOptsGridClass(lettersR, optsR) + "'>";
              rightCol += htmlQuizRadioOptions(lettersR, optsR, qkey);
              rightCol += "</div>";
            } else {
              rightCol += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            rightCol += "</div></div>";
          });
          rightCol += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtml +
            "</div>" +
            rightCol +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            html += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR2 = getObjectiveChoiceLayout(row, it);
            const lettersR2 = layoutR2.letters;
            const optsR2 = layoutR2.opts;
            if (lettersR2.length) {
              html += renderStemHtml(it.stem, qkey);
              html += "<div class='" + quizOptsGridClass(lettersR2, optsR2) + "'>";
              html += htmlQuizRadioOptions(lettersR2, optsR2, qkey);
              html += "</div>";
            } else {
              html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            html += "</div></div>";
          });
        }
      });
    } else if (t === "writing" && writingGroups.some((g) => g.passage)) {
      writingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtmlW;
          if (g.fromSection) {
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const phw = splitReadingPassageHeading(g.passage);
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>" + esc(phw.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(phw.text) + "</div></div>";
          }
          let rightColW = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const itw = row.it;
            const qkeyW = row.key;
            const numW = String(itw.number);
            rightColW += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyW) + "'><div class='q'>";
            rightColW +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numW) +
              " 题</span>";
            rightColW += "<span class='tag'>" + esc(t) + "</span></div>";
            rightColW += renderOpenAnswerStem(itw.stem, qkeyW, row.type, t);
            rightColW += "</div></div>";
          });
          rightColW += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtmlW +
            "</div>" +
            rightColW +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const itx = row.it;
            const qkeyX = row.key;
            const numX = String(itx.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyX) + "'><div class='q'>";
            html +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numX) +
              " 题</span>";
            html += "<span class='tag'>" + esc(t) + "</span></div>";
            html += renderOpenAnswerStem(itx.stem, qkeyX, row.type, t);
            html += "</div></div>";
          });
        }
      });
    } else if (isFillBlankQuizType(t) && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((fg) => {
        if (fg.instruction) {
          const sp = splitSectionHintAndBody(fg.instruction);
          const hintPart = sp.hint
            ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
            : "";
          const bankSrc = sp.body || fg.instruction;
          html +=
            "<div class='card word-bank-card' style='margin-bottom:1rem'>" +
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            hintPart +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(bankSrc).replace(/\n/g, "<br>") +
            "</div></div>";
        }
        fg.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          html += "<div class='card q-block' data-qkey='" + esc(qkey) + "'><div class='q'>";
          html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
          html += "<span class='tag'>" + esc(t) + "</span></div>";
          html += renderStemHtml(it.stem, qkey);
          html += "</div></div>";
        });
      });
    } else {
      if (t === "phonetics" && rows.length) {
        const insPh = String(rows[0].section_instruction || "").trim();
        if (insPh) {
          html +=
            "<div class='card' style='margin-bottom:1rem;padding:0.75rem 1rem'><p class='muted' style='margin:0;line-height:1.55'>" +
            esc(insPh).replace(/\n/g, "<br>") +
            "</p></div>";
        }
      }
      const stemOptPh = t === "phonetics" ? { allowUnderline: true } : null;
      rows.forEach((row) => {
        const it = row.it;
        const qkey = row.key;
        const num = String(it.number);
        html +=
          "<div class='card q-block" +
          (t === "reading" ? " reading-q-card" : "") +
          "' data-qkey='" +
          esc(qkey) +
          "'><div class='q'>";
        html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
        html += "<span class='tag'>" + esc(t) + "</span></div>";

        if (t === "reading" && (it.context_note || "").trim()) {
          html += "<div class='passage'>" + formatPassageParagraphs(it.context_note) + "</div>";
        }

        const layoutG = getObjectiveChoiceLayout(row, it);
        const lettersG = layoutG.letters;
        const optsG = layoutG.opts;
        if (lettersG.length) {
          html += renderStemHtml(it.stem, qkey, stemOptPh || undefined);
          html += "<div class='" + quizOptsGridClass(lettersG, optsG) + "'>";
          html += htmlQuizRadioOptions(lettersG, optsG, qkey);
          html += "</div>";
        } else {
          html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
        }
        html += "</div></div>";
      });
    }
    return html;
  }

  /** 阅读材料中允许 &lt;u&gt;…&lt;/u&gt; 显示为下划线，其余 HTML 剥离 */
  function examSanitizePassageRich(p) {
    let t = String(p || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t.replace(/@@UON@@/g, "<u>").replace(/@@UOFF@@/g, "</u>");
  }

  function formatPassageParagraphsExam(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    return s
      .split(/\n+/)
      .map((x) => x.trim())
      .filter(Boolean)
      .map((para) => "<p class='exam-para'>" + examSanitizePassageRich(para).replace(/\n/g, "<br>") + "</p>")
      .join("");
  }

  function buildExamPaperStemPlain(stem, allowUnderline) {
    const s = String(stem || "");
    if (allowUnderline) {
      return stemHtmlWithAllowedUnderline(s).replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
    }
    return esc(s)
      .replace(/\n/g, "<br>")
      .replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
  }

  function buildExamPaperOptionsHtmlWithLayout(letters, opts) {
    const parts = [];
    letters.forEach((L) => {
      const tx = String((opts && opts[L]) || "").trim();
      if (!tx) return;
      parts.push("<span class='exam-opt-chip'><b>" + esc(L) + ".</b> " + esc(tx).replace(/\n/g, " ") + "</span>");
    });
    if (!parts.length) return "";
    const n = parts.length;
    const cls = n <= 4 ? "exam-opts-cols-" + n : "exam-opts-bank";
    return "<div class='exam-opts-row " + cls + "'>" + parts.join("") + "</div>";
  }

  /** 完形 PDF：多行表格，每行「题号 | A | B | …」，列对齐 */
  function buildExamPaperClozePdfGrid(rows) {
    if (!rows || !rows.length) return "";
    const union = new Set();
    rows.forEach((row) => {
      getObjectiveChoiceLayout(row, row.it).letters.forEach((L) => union.add(L));
    });
    const order = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => union.has(L));
    const nOpt = order.length;
    const optCls =
      nOpt >= 7
        ? " exam-cloze-pdf-grid-7opt"
        : nOpt >= 6
          ? " exam-cloze-pdf-grid-6opt"
          : nOpt >= 5
            ? " exam-cloze-pdf-grid-5opt"
            : nOpt >= 4
              ? " exam-cloze-pdf-grid-4opt"
              : "";
    let h = "<div class='exam-cloze-pdf-grid" + optCls + "'>";
    rows.forEach((row) => {
      const it = row.it;
      const num = String(it.number);
      const layout = getObjectiveChoiceLayout(row, it);
      const letters = layout.letters;
      const opts = layout.opts;
      h +=
        "<span class='exam-cloze-pdf-num'><span class='exam-n'>" +
        esc(num) +
        ".</span><span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span></span>";
      order.forEach((L) => {
        const tx = String((opts && opts[L]) || "").trim();
        if (letters.includes(L) && tx) {
          h += "<span class='exam-cloze-pdf-opt'><b>" + esc(L) + ".</b> " + esc(tx).replace(/\n/g, " ") + "</span>";
        } else {
          h += "<span class='exam-cloze-pdf-opt exam-cloze-pdf-opt-empty'></span>";
        }
      });
    });
    h += "</div>";
    return h;
  }

  function buildExamPaperOptionsHtml(opts) {
    const letters = ["A", "B", "C", "D"].filter((L) => String((opts && opts[L]) || "").trim());
    if (!letters.length) return "";
    return buildExamPaperOptionsHtmlWithLayout(letters, opts);
  }

  function buildExamPaperItemBlock(row, it, t) {
    const num = String(it.number);
    const layout = getObjectiveChoiceLayout(row, it);
    const letters = layout.letters;
    const opts = layout.opts;

  function collectTypeAnswers() {
    const t = state.currentType;
    const rows = state.byType[t] || [];
    const out = {};
    rows.forEach((row) => {
      const k = row.key;
      const kEsc = k.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      let block = document.querySelector(".q-block[data-qkey=\"" + kEsc + "\"]");
      if (!block) {
        const inlineInp = document.querySelector(
          "#quizBody .cloze-inline-passage input[data-k=\"" + kEsc + "\"]",
        );
        if (inlineInp) {
          out[k] = String(inlineInp.value || "").trim();
          return;
        }
        return;
      }
      const r = block.querySelector("input[type=radio]:checked");
      if (r) {
        out[k] = r.value;
        return;
      }
      const blankOne = block.querySelector("input.blank-input[data-k]");
      if (blankOne) {
        out[k] = blankOne.value.trim();
        return;
      }
      const blanks = block.querySelectorAll("input[data-k][data-bi]");
      if (blanks.length) {
        const bits = [];
        blanks.forEach((b) => bits.push(b.value.trim()));
        out[k] = bits.join("|");
        return;
      }
      const ta = block.querySelector("textarea[data-k]");
      if (ta) out[k] = ta.value.trim();
    });
    return out;
  }

  function normLetter(x) {
    return String(x || "").trim().toUpperCase().charAt(0);

  function normPipe(x) {
    return String(x || "")
      .split("|")
      .map((s) => s.trim().toLowerCase())
      .join("|");
  }

  function judge(row, userAns) {
    const it = row.it;
    const teach = it.teaching || {};
    const ca = teach.correct_answer || "";
    const typ = row.type;
    if (typ === "writing") return { open: true, ok: null, ca, userAns };
    if (["choice", "cloze", "grammar_fill", "reading", "other", "phonetics"].includes(typ)) {
      const ok = ca && normLetter(userAns) === normLetter(ca);
      return { open: false, ok, ca, userAns };
    }
    const ok = ca && normPipe(userAns) === normPipe(ca);
    return { open: false, ok, ca, userAns };
  }

  function stripForTts(s) {

  function wrapEnglishWords(container) {
    if (!container || container.nodeType !== 1) return;
    const skip = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "PRE", "BUTTON"]);
    function walk(node) {
      if (node.nodeType === 1) {
        if (skip.has(node.tagName)) return;
        if (node.classList && node.classList.contains("wlink")) return;
        Array.from(node.childNodes).forEach(walk);
        return;
      }
      if (node.nodeType !== 3) return;
      const text = node.textContent;
      if (!text || !/\b[A-Za-z]/.test(text)) return;
      const parent = node.parentNode;
      if (!parent) return;
      const frag = document.createDocumentFragment();
      const re = /(\b[A-Za-z]+(?:[-'][A-Za-z]+)*\b)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const sp = document.createElement("span");
        sp.className = "wlink";
        sp.textContent = m[1];
        sp.title = "点击查看词义";
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      parent.replaceChild(frag, node);
    }
    try {
      walk(container);
    } catch (err) {
      console.warn("wrapEnglishWords:", err);
    }
  }
