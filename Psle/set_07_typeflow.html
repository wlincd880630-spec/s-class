<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    a.btn.secondary.answers-link {
      display: inline-block; font: inherit; cursor: pointer;
      border-radius: 10px; padding: 0.45rem 1rem; font-weight: 600;
      background: #fff; border: 1px solid var(--border); color: var(--ink);
      text-decoration: none;
    }
    a.btn.secondary.answers-link:hover { border-color: var(--accent); color: var(--accent); }

    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第07套","exam_meta":{"full_score_text":"满分60分","time_text":"时间:50分钟","type_card_order":"paper"},"sections":[{"section_title":"I. 单项选择","section_instruction":"(共10小题；每小题1分，共10分)","items":[{"number":"1","item_type":"choice","context_note":"","stem":"—Could you please give me two _____? I have something to write down.","options":{"A":"pieces of papers","B":"pieces of paper","C":"papers","D":"piece of paper"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查不可数名词的量化表达。\n1.  “paper”作为“纸张”是不可数名词，不能直接加-s表示复数。\n2.  要表示其数量，需要借助量词“piece of”。\n3.  句中要求“two”（两），是复数概念，因此量词“piece”需要用其复数形式“pieces”。\n4.  不可数名词“paper”本身保持原形不变。\n5.  因此，“两张纸”的正确说法是“two pieces of paper”。","knowledge_expansion_md":"### 不可数名词的量化\n\n1.  **基本结构**：许多不可数名词（如 `water`, `bread`, `news`, `advice`, `information`, `furniture`）需要用“数词 + 量词 + of + 不可数名词”的结构来表示具体数量。\n2.  **复数形式**：当数量大于一时，只有量词需要变为复数，而后面的不可数名词保持不变。例如：\n    *   `a piece of` advice (一条建议) -> `two pieces of` advice (两条建议)\n    *   `a loaf of` bread (一个面包) -> `three loaves of` bread (三个面包)\n3.  **`paper` 的可数与不可数用法**：\n    *   **不可数**：指“纸，纸张”（材料）。例：I need some `paper` to draw a picture.\n    *   **可数**：指“报纸”(`newspaper`)或“文件、论文”。例：He has published many `papers` on this topic. (他已经在这个课题上发表了很多篇论文。) 句中的“write down”表明是需要书写用的纸张，故为不可数名词。","socratic_tracks":[{"title":"不可数名词的“数”","steps":[{"question":"在“I have something to write down”这个语境下，“paper”这个词应该理解成什么意思？它是可数名词还是不可数名词？","hint":"我们平时说“一张纸”、“两张纸”，中文里是不是也需要一个量词？这通常暗示了对应的英语单词是不可数的。","takeaway":"在这里“paper”指用来书写的“纸张”，是不可数名词。"},{"question":"对于不可数名词，如果我们想表达“两个”或“两份”，应该怎么说？","hint":"回想一下“一条建议”(advice)或者“一条新闻”(news)是怎么表达的。","takeaway":"我们需要使用“量词 + of + 不可数名词”的结构，比如“a piece of...”。"},{"question":"既然句中提到了“two”，那么量词“piece”应该用什么形式？不可数名词“paper”本身需要变化吗？","hint":"“two”后面跟的名词通常是复数形式。那么是“piece”变复数还是“paper”变复数？","takeaway":"当数量大于一时，量词要用复数形式（pieces），而不可数名词本身（paper）保持不变。"}]},{"title":"词义辨析：paper vs papers","steps":[{"question":"选项C中的“papers”是什么意思？它可以用在这里吗？","hint":"当“paper”变成复数“papers”后，词义会发生什么变化？它还指空白的纸张吗？","takeaway":"“papers”通常指“报纸”或“文件、论文”，而不是空白的“纸张”。"},{"question":"根据句意“I have something to write down”（我有些东西要写下来），判断这里需要的是哪种“paper”？","hint":"写东西是需要一份报纸，还是一张白纸？","takeaway":"句意表明需要的是用来书写的空白纸张，因此是不可数名词“paper”的用法。"}]},{"title":"选项排除法","steps":[{"question":"我们先看选项D “piece of paper”，它为什么不对？","hint":"题干中的“two”和选项中的“piece”在数量上匹配吗？","takeaway":"“two”是复数，而“piece of paper”是单数，两者在数上不一致。"},{"question":"再看选项A “pieces of papers”，它错在哪里？","hint":"我们已经知道“paper”在这里是不可数名词，不可数名词能加-s吗？","takeaway":"作为不可数名词的“paper”不能加-s变为“papers”，所以选项A错误。"},{"question":"排除了A和D后，对比B和C，为什么B是唯一正确的？","hint":"结合我们对“paper”和“papers”词义的分析，以及不可数名词的量化规则。","takeaway":"B“two pieces of paper”准确表达了“两张纸”的含义，而C“papers”词义不符，故B为正确答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"The boy on _____ chair needs _____ uniform for his new term.","options":{"A":"a; an","B":"the; an","C":"the; a","D":"the; the"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查冠词的用法。\n1.  第一个空“on _____ chair”中，“chair”是特指“那个男孩正坐在上面的椅子”，是谈话双方心中都明确的特定事物，所以应用定冠词“the”。\n2.  第二个空“needs _____ uniform”中，需要使用不定冠词“a”或“an”。\n3.  不定冠词的选择取决于其后单词的**首字母发音**，而非首字母本身。\n4.  “uniform”的发音是 /'juːnɪfɔːm/，其开头的音素是辅音音素 /j/。\n5.  以辅音音素开头的单词前用“a”，以元音音素开头的单词前用“an”。\n6.  因此，“uniform”前应该用“a”。综合两空，选择“the; a”。","knowledge_expansion_md":"### 冠词 “a/an” 和 “the” 的用法辨析\n\n1.  **定冠词 `the`**：用于特指，表示“这（个）”或“那（个）”，指代谈话双方都清楚的特定的人或物。例：`The` book on the desk is mine. (桌上的那本书是我的。)\n\n2.  **不定冠词 `a/an`**：用于泛指，表示“一（个）”，指某一类人或事物中的任意一个。`a` 和 `an` 的选择规则是关键：\n    *   **`a`** 用在以**辅音音素**开头的单词前。例：`a` book, `a` car, `a` university, `a` useful tool。\n    *   **`an`** 用在以**元音音素**开头的单词前。例：`an` apple, `an` egg, `an` hour, `an` honest man。\n\n3.  **易错点**：切记冠词 `a/an` 的选择取决于单词的**首音素**，而不是首字母。特别注意以下情况：\n    *   以元音字母 `u` 开头但发辅音 /j/ 的词：`a` `u`niversity, `a` `u`niform, `a` `u`seful idea。\n    *   以辅音字母 `h` 开头但不发音的词：`an` `h`our, `an` `h`onest boy。\n    *   以元音字母 `o` 开头但发辅音 /w/ 的词：`a` `o`ne-way street。","socratic_tracks":[{"title":"定冠词“the”的特指功能","steps":[{"question":"句子前半部分“The boy on ___ chair”是在描述一个普遍现象，还是一个特定场景？","hint":"句子开头用“The boy”而不是“A boy”，这本身就带有特指的意味。","takeaway":"句子描述的是一个特定的男孩和他的特定位置，是特指场景。"},{"question":"当我们要指代一个特定的、谈话双方都清楚的事物时，应该用哪个冠词？","hint":"在“a/an”和“the”中，哪一个表示“这个”或“那个”？","takeaway":"表示特指时，我们应该使用定冠词“the”。"}]},{"title":"不定冠词“a/an”的选择依据","steps":[{"question":"我们决定用“a”还是“an”的依据是什么？是看单词的第一个字母，还是听它的第一个发音？","hint":"想想“an hour”这个例子，“hour”的首字母'h'是辅音字母，为什么用“an”？","takeaway":"决定用“a”还是“an”的依据是单词开头的音素，而不是字母。"},{"question":"请读出“uniform”这个单词。它的第一个发音是像“apple”开头的元音，还是像“yes”开头的辅音？","hint":"“uniform”的发音是/'juːnɪfɔːm/，开头的音是/j/。","takeaway":"“uniform”是以辅音音素/j/开头的。"},{"question":"既然“uniform”是以辅音音素开头，那它前面应该用“a”还是“an”？","hint":"“辅音前用a，元音前用an”是针对发音而言的。","takeaway":"以辅音音素开头的单词前应该用“a”。"}]},{"title":"综合应用与排除","steps":[{"question":"根据我们对第一个空的分析，应该用“the”，那么可以立刻排除哪个选项？","hint":"查看A, B, C, D四个选项的第一个冠词。","takeaway":"选项A的第一个空是“a”，不符合特指的语境，可以排除。"},{"question":"根据我们对第二个空的分析，应该用“a”，那么在剩下的B, C, D中，可以排除哪些选项？","hint":"查看B, C, D四个选项的第二个冠词。","takeaway":"选项B和D的第二个空分别是“an”和“the”，不符合发音规则，可以排除。"},{"question":"综合两步的分析，哪个选项是唯一正确的？","hint":"同时满足第一个空是“the”和第二个空是“a”的选项是哪一个？","takeaway":"只有选项C“the; a”同时满足两个条件，是最终的正确答案。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"The People's Republic of China was founded _____.","options":{"A":"in Oct. 1st, 1949","B":"on 1949, Oct. 1st","C":"in 1st, Oct. 1949","D":"on Oct. 1st, 1949"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查表示具体日期的时间介词和日期表达法。\n1.  英语中，当表示在**具体的某一天**时，时间介词要用 **on**。\n2.  题中给出的是“1949年10月1日”，这是一个精确到“日”的特定日期，所以介词必须用“on”。由此可以排除使用“in”的选项A和C。\n3.  在英语中，表达日期的常规顺序是“月-日-年”（美式）或“日-月-年”（英式）。\n4.  选项D“on Oct. 1st, 1949”符合“月-日-年”的表达习惯。\n5.  选项B“on 1949, Oct. 1st”将年份放在最前，不符合常规的日期表达语序。\n6.  因此，D是语法和表达习惯都正确的选项。","knowledge_expansion_md":"### 时间介词 in, on, at 的用法总结\n\n*   **`in`**：用于较长的时间段，如**年份、月份、季节、世纪**，以及泛指的**上/下午、晚上**。\n    *   `in` 2024 (在2024年)\n    *   `in` May (在五月)\n    *   `in` summer (在夏天)\n    *   `in` the morning/afternoon/evening (在早上/下午/晚上)\n\n*   **`on`**：用于**具体的某一天**或**特定日期**，包括星期、具体日期、节假日等。\n    *   `on` Monday (在星期一)\n    *   `on` my birthday (在我生日那天)\n    *   `on` Christmas Day (在圣诞节那天)\n    *   `on` May 1st, 2024 (在2024年5月1日)\n\n*   **`at`**：用于**精确的时刻**或**时间点**。\n    *   `at` 8 o'clock (在8点钟)\n    *   `at` noon (在中午)\n    *   `at` midnight (在午夜)\n    *   `at` night (在夜晚，注意与 `in the evening` 的区别)\n\n### 日期的表达方式\n*   **美式英语**: 月-日, 年 (e.g., October 1, 1949)\n*   **英式英语**: 日-月, 年 (e.g., 1 October 1949 or 1st October 1949)\n*   无论哪种方式，表示“在这一天”时，介词都用 `on`。","socratic_tracks":[{"title":"时间介词的选择：in, on, at","steps":[{"question":"当我们谈论一个具体的、精确到“日”的日期时，应该用哪个介词：in, on, 还是 at？","hint":"想一想“在星期一”是“in Monday”, “on Monday”还是“at Monday”？","takeaway":"表示具体的某一天，介词要用“on”。"},{"question":"题目中的“Oct. 1st, 1949”是一个年份、一个月份，还是一个具体的日期？","hint":"它不仅有年份和月份，还精确到了“1st”这一天。","takeaway":"这是一个具体的日期，所以介词应该用“on”。"},{"question":"根据介词必须是“on”这一点，我们可以排除哪两个选项？","hint":"看看选项A和C用的是什么介词。","takeaway":"选项A和C都使用了介词“in”，因此是错误的。"}]},{"title":"日期的正确语序","steps":[{"question":"在英语中，书写或说一个完整的日期时，年、月、日通常按什么顺序排列？","hint":"回忆一下你平时看到的日期格式，比如“December 25th, 2024”。","takeaway":"英语中常见的日期顺序是“月-日-年”。"},{"question":"比较剩下的选项B和D：“1949, Oct. 1st”和“Oct. 1st, 1949”，哪一个更符合“月-日-年”的常规顺序？","hint":"October是月份，1st是日子，1949是年份。","takeaway":"“Oct. 1st, 1949”符合“月-日-年”的顺序，而把年份放在最前面是不规范的。"}]},{"title":"综合判断与排除","steps":[{"question":"我们分析的第一步是关于什么？它帮助我们排除了哪些选项？","hint":"我们首先分析了介词的用法。","takeaway":"第一步分析了介词，确定要用“on”，从而排除了A和C。"},{"question":"我们分析的第二步是关于什么？它又帮助我们排除了哪个选项？","hint":"第二步我们关注的是日期内部的排列顺序。","takeaway":"第二步分析了日期语序，确定“月-日-年”是正确顺序，从而排除了B。"},{"question":"通过这两步的筛选，最终哪个选项是完全正确的？","hint":"既使用了正确的介词，又使用了正确的日期语序的选项是哪一个？","takeaway":"只有选项D同时满足了介词和语序两方面的要求，是唯一正确的答案。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"Which do you like _____, bread, eggs or sandwiches?","options":{"A":"better","B":"best","C":"well","D":"much"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词/副词的比较级和最高级用法。\n1.  句中列举了“bread, eggs or sandwiches”三种食物，并询问你喜欢哪一种，这涉及在三者中进行比较。\n2.  当比较的对象是两者时，使用比较级（如 better）。\n3.  当比较的对象是三者或三者以上时，需要使用最高级（如 best）。\n4.  “like”的程度可以用副词“well”（原级）、“better”（比较级）、“best”（最高级）来修饰。\n5.  因为本题是在三者中进行选择，表示“最”喜欢，所以应该用最高级“best”。","knowledge_expansion_md":"### 形容词/副词的比较级和最高级\n\n1.  **基本用法**：\n    *   **原级**：表示事物本身的性质，不涉及比较。e.g., `good`, `well`, `beautiful`.\n    *   **比较级**：用于两者之间的比较，表示“更...”，常与 `than` 连用。e.g., `better`, `more beautiful`.\n    *   **最高级**：用于三者或三者以上事物的比较，表示“最...”，常在名词前与 `the` 连用，或在一个明确的范围内（如本题）使用。e.g., `the best`, `the most beautiful`.\n\n2.  **特殊疑问句中的最高级**：在由 `Which...?` 或 `Who...?` 引导的选择疑问句中，如果是在一个明确的范围内（三者或以上）进行比较，通常直接使用最高级，可以省略 `the`。例如：\n    *   Which season do you like **best**? (你最喜欢哪个季节？)\n    *   Of the three boys, who runs **fastest**? (这三个男孩中，谁跑得最快？)\n\n3.  **不规则变化的比较级和最高级**：\n    *   good/well → better → best\n    *   bad/ill → worse → worst\n    *   many/much → more → most\n    *   little → less → least","socratic_tracks":[{"title":"比较的范围：两个还是多个？","steps":[{"question":"请仔细阅读题目，这道题是在比较多少个事物？","hint":"数一数句末列出的食物种类：“bread, eggs or sandwiches”。","takeaway":"题中列出了三种食物，所以是在三者之间进行比较。"},{"question":"当我们在两者之间做比较时，应该用什么“级”？当我们在三者或更多者之间做比较时，又用什么“级”？","hint":"回想一下“好”、“更好”和“最好”的用法区别。","takeaway":"两者比较用比较级，三者或以上比较用最高级。"},{"question":"既然这道题是在三者中选出最喜欢的，我们应该用比较级还是最高级？","hint":"三者选“最”，对应的是哪个“级”？","takeaway":"在三者或以上的事物中进行比较，需要使用最高级。"}]},{"title":"词形辨析：well, better, best","steps":[{"question":"选项中的“better”和“best”分别是什么词的什么形式？","hint":"它们都和副词“well”（好地）或形容词“good”（好的）有关。","takeaway":"“better”是“well/good”的比较级，“best”是“well/good”的最高级。"},{"question":"根据我们对比较范围的分析，这道题应该选择比较级还是最高级？","hint":"我们已经确定了是在三者中进行比较。","takeaway":"应该选择最高级来表达“最”喜欢。"},{"question":"那么，在A、B、C、D四个选项中，哪一个是正确的最高级形式？","hint":"哪个词是“well”的最高级？","takeaway":"“best”是正确的最高级形式，因此是正确答案。"}]},{"title":"句型分析：“Which do you like...?”","steps":[{"question":"如果我问你“Which do you like better, tea or coffee?”，为什么用“better”？","hint":"“tea or coffee”是几个选项？","takeaway":"因为是在“茶”和“咖啡”两个选项中进行选择，所以用比较级“better”。"},{"question":"现在，问题变成了“Which do you like _____, bread, eggs or sandwiches?”，选项变成了三个，我们应该用什么词来提问？","hint":"从两者比较升级到三者比较，词形应该如何变化？","takeaway":"当选项变为三个或更多时，应该用最高级“best”来提问哪个是“最”喜欢的。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"We are looking for the key _____ the front door but we can't find it.","options":{"A":"with","B":"from","C":"to","D":"of"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查固定搭配。在英语中，表达“某物的钥匙”或“解决某个问题的关键/答案”时，习惯使用介词 `to`，构成 `the key to something` 的结构。这里的 `to` 表示一种对应、归属或通向的关系。因此，“前门的钥匙”正确的表达是 `the key to the front door`。选项 `of` 是常见的干扰项，虽然在中文里我们说“门的钥匙”，但英语中用 `to` 更为地道，强调钥匙的功能性。","knowledge_expansion_md":"### 介词 `to` 表示“对应关系”的用法\n\n介词 `to` 除了表示方向（go to school），还可以表示两者之间的对应、归属或解决方案关系。这是一个非常重要的知识点，在小升初考试中频繁出现。\n\n**常见搭配：**\n*   `the answer to the question` (问题的答案)\n*   `the solution to the problem` (问题的解决方案)\n*   `the entrance/way to the park` (公园的入口/路)\n*   `the secret to success` (成功的秘诀)\n\n**易错点辨析：`to` vs. `of`**\n*   `to` 强调功能、目的或对应关系，如 `the key to the door` (开这扇门的钥匙)。\n*   `of` 通常表示所属关系（所有格），如 `the color of the door` (门的颜色)。虽然 `the key of the door` 在语法上勉强可以理解为“属于这扇门的一把钥匙”，但在表达功能时，`the key to the door` 是标准且地道的用法。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"我们想表达“某个问题的答案”时，会说 `the answer ___ the question`，中间应该用哪个介词？","hint":"回忆一下老师讲过的固定搭配，是 `of`, `for` 还是 `to`？","takeaway":"“问题的答案”固定搭配是 `the answer to the question`。"},{"question":"既然“答案”对应“问题”用 `to`，那么“钥匙”对应“门”是不是也遵循类似的逻辑？","hint":"这里的“钥匙”和“门”也是一种功能上的对应关系。","takeaway":"是的，“……的钥匙”也使用 `the key to ...` 这个固定搭配。"}]},{"title":"介词辨析","steps":[{"question":"介词 `of` 通常表示什么关系？比如 `the leg of the table` 是什么意思？","hint":"`of` 常常被翻译成“……的”，表示一种从属关系。","takeaway":"`of` 主要表示“所属”关系，即“桌子的腿”。"},{"question":"那么，`the key of the front door` 和 `the key to the front door`，哪个更能体现出钥匙“用来开门”的功能和目的？","hint":"介词 `to` 除了表示方向，还有“朝向、对于”的含义，更能体现目的性。","takeaway":"介词 `to` 在此强调功能和目的，是更准确、更地道的用法。"}]},{"title":"举一反三","steps":[{"question":"如果我们想说“通往成功的秘诀”，应该用 `the secret ___ success` 呢？","hint":"这里的“秘诀”和“成功”也是一种对应关系，类似于“钥匙”和“门”。","takeaway":"“成功的秘诀”应该说 `the secret to success`。"},{"question":"再想一个，“这个城市博物馆的入口”应该怎么说？`the entrance ___ the city museum`?","hint":"入口是“通向”博物馆的。","takeaway":"“博物馆的入口”是 `the entrance to the city museum`。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"He _____ a new pen on his way home yesterday.","options":{"A":"bought","B":"has bought","C":"buys","D":"will buy"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词时态的选择。句中的时间状语 `yesterday` (昨天) 是一个非常明确的过去时间点。当句子中出现表示特定过去时间的词或短语时（如 `yesterday`, `last week`, `... ago` 等），谓语动词需要使用一般过去时。动词 `buy` (购买) 的一般过去时形式是不规则变化，为 `bought`。因此，正确答案是 A。","knowledge_expansion_md":"### 一般过去时 vs. 现在完成时\n\n这是英语时态中一对非常重要的易混淆点，也是小升初和初中阶段的考察重点。\n\n1.  **一般过去时 (Simple Past Tense)**\n    *   **用法**：表示在**过去特定时间**发生并完成的动作或存在的状态。\n    *   **标志词**：`yesterday`, `last night/week/year`, `... ago`, `in 2010`, `just now` (刚才) 等。\n    *   **例句**：`I saw him in the library yesterday.` (我昨天在图书馆看见他了。)\n\n2.  **现在完成时 (Present Perfect Tense)**\n    *   **用法**：表示过去的动作对现在造成的影响或结果，或者表示从过去开始一直持续到现在的动作或状态。它强调的是**与现在的关联**，而**不指明具体的发生时间**。\n    *   **关键**：**不能**与表示特定过去时间的状语（如 `yesterday`, `last week`）连用。\n    *   **例句**：`I have bought a new pen.` (我已经买了一支新钢笔了。—— 强调我现在有新笔这个结果)。\n\n**总结**：看到 `yesterday` 就用一般过去时，是解这道题最直接的方法。","socratic_tracks":[{"title":"抓住时间状语","steps":[{"question":"请在句子中找出表示时间的词语。","hint":"这个词的意思是“昨天”。","takeaway":"句子中的关键时间状语是 `yesterday`。"},{"question":"`yesterday` 表示的是过去、现在还是将来？它指的是一个确切的时间点吗？","hint":"“昨天”是一个已经结束的、特定的日子。","takeaway":"`yesterday` 指明了动作发生在过去的特定时间。"}]},{"title":"选择正确时态","steps":[{"question":"对于在过去特定时间发生的动作，我们应该使用哪种时态来描述？","hint":"是“一般过去时”还是“现在完成时”？","takeaway":"当有明确的过去时间点时，必须使用一般过去时。"},{"question":"动词 `buy` 的一般过去时形式是什么？","hint":"这是一个不规则动词，回忆一下它的过去式和过去分词。","takeaway":"`buy` 的过去式是 `bought`。"}]},{"title":"辨析易混时态","steps":[{"question":"为什么不能选 B 选项 `has bought` (现在完成时)？它不也表示过去的动作吗？","hint":"思考一下现在完成时能否和 `yesterday` 这样的词一起使用。","takeaway":"现在完成时强调与现在的联系，不能与 `yesterday` 等明确的过去时间状语连用。"},{"question":"如果我们想表达“他已经买了一支新钢笔了”（言下之意是他现在有新笔），但不提具体是什么时候买的，应该用哪个时态？","hint":"这种“过去影响现在”且时间不明确的情况，正是某个时态的典型用法。","takeaway":"不指明具体时间而强调对现在的影响时，应该用现在完成时：`He has bought a new pen.`"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"My brother usually _____ up late but tomorrow he _____ up early.","options":{"A":"gets; get","B":"get; will get","C":"gets; will get","D":"get; will gets"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查在不同时间状语下，动词时态的正确运用。句子由 `but` 连接两个分句。\n\n1.  **第一空**：前半句的时间状语是 `usually` (通常)，表示习惯性、经常性的动作，因此应使用一般现在时。主语 `My brother` 是第三人称单数，所以动词 `get` 需要变为 `gets`。\n2.  **第二空**：后半句的时间状语是 `tomorrow` (明天)，表示将要发生的动作，因此应使用一般将来时。其结构为 `will + 动词原形`，所以是 `will get`。\n\n综合来看，第一个空填 `gets`，第二个空填 `will get`。因此，正确答案是 C。","knowledge_expansion_md":"### 不同时态的综合运用\n\n一个句子，特别是复合句，常常会因为时间状语的不同而使用不同的时态。这是语言灵活性的体现，也是考试的重点。\n\n1.  **一般现在时 (Simple Present Tense)**\n    *   **标志词**：`always`, `usually`, `often`, `sometimes`, `every day/week/month`。\n    *   **核心规则**：当主语是第三人称单数（如 `he`, `she`, `it`, `My brother`）时，动词末尾要加 `-s` 或 `-es`。\n\n2.  **一般将来时 (Simple Future Tense)**\n    *   **标志词**：`tomorrow`, `next week/month/year`, `in the future`, `in two days`。\n    *   **核心结构**：`will + 动词原形`。注意，`will` 是情态动词，后面的动词**永远**用原形，不受主语人称和单复数的影响。例如，`I will go`, `He will go`。绝对不存在 `will gets` 这样的错误形式。\n\n**解题技巧**：看到并列连词（如 `and`, `but`, `or`）连接两个分句时，要分别寻找每个分句的时间状语，并根据各自的时间状语选择正确的时态。","socratic_tracks":[{"title":"第一空：一般现在时","steps":[{"question":"句子前半部分有一个词 `usually`，它通常表示什么？","hint":"是表示一次性的动作，还是经常发生的习惯？","takeaway":"`usually` (通常) 表示习惯性动作，需要使用一般现在时。"},{"question":"当主语是 `My brother` (第三人称单数) 时，一般现在时的动词 `get` 需要有什么变化？","hint":"对比一下：I get up, You get up, He ___ up.","takeaway":"主语是第三人称单数时，一般现在时的动词末尾要加-s，所以是 `gets`。"}]},{"title":"第二空：一般将来时","steps":[{"question":"句子后半部分有一个词 `tomorrow`，它指向什么时间？","hint":"`tomorrow` 的意思是“明天”。","takeaway":"`tomorrow` 表示将来时间，需要使用一般将来时。"},{"question":"一般将来时最常见的结构是什么？动词 `get` 应该变成什么形式？","hint":"它的结构是“情态动词 + 动词原形”。","takeaway":"一般将来时的结构是 `will + 动词原形`，所以是 `will get`。"}]},{"title":"排除语法错误","steps":[{"question":"我们来看选项 D，为什么 `will gets` 这种形式在语法上是绝对错误的？","hint":"`will` 是一个情态动词，想一想情态动词后面的动词有什么规则？","takeaway":"情态动词 (如 will, can, must) 后面必须跟动词原形，不能有任何形式变化。"},{"question":"现在回头看，为什么选项 A (`gets; get`) 和 B (`get; will get`) 也是错的？","hint":"结合前两步的分析，检查 A 和 B 两个选项分别错在哪个空。","takeaway":"选项 A 的第二空时态错误，选项 B 的第一空人称变化错误。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"Peter has collected three _____ Chinese stamps.","options":{"A":"hundreds","B":"hundreds of","C":"hundred of","D":"hundred"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查数词的用法，特别是 `hundred`, `thousand`, `million` 等词的用法规则。\n\n规则如下：\n1.  当 `hundred` 前面有具体的数字（如 `one`, `two`, `three`）时，`hundred` 本身用单数形式，并且其后直接跟名词，中间不加 `of`。例如：`two hundred students` (二百名学生)。\n2.  当 `hundred` 用来表示一个概数，意为“成百上千的”、“许多”时，它要用复数形式 `hundreds`，并且后面必须跟 `of`。例如：`hundreds of students` (数以百计的学生)。\n\n本题中，`hundred` 前面有具体数字 `three`，因此应使用第一条规则，即 `three hundred Chinese stamps`。所以正确答案是 D。","knowledge_expansion_md":"### 基数词 `hundred`, `thousand`, `million` 的用法总结\n\n这是一个非常清晰且重要的语法规则，适用于 `hundred` (百), `thousand` (千), `million` (百万), `billion` (十亿) 以及 `dozen` (打)。\n\n**用法一：表示精确数量**\n*   **结构**：`具体数字 + hundred/thousand/million + 名词`\n*   **特点**：`hundred` 等词保持单数形式，不加 `-s`，且后面不跟 `of`。\n*   **例子**：\n    *   `five hundred yuan` (五百元)\n    *   `two thousand years` (两千年)\n    *   `three dozen eggs` (三打鸡蛋)\n\n**用法二：表示概数（模糊的大约数量）**\n*   **结构**：`hundreds/thousands/millions + of + 名词`\n*   **特点**：`hundred` 等词必须用复数形式，加 `-s`，且后面必须跟 `of`。\n*   **例子**：\n    *   `hundreds of people` (数以百计的人)\n    *   `thousands of stars` (成千上万的星星)\n    *   `dozens of times` (几十次)\n\n**易错点**：切记不可将两种结构混用，例如 `three hundreds stamps` 或 `three hundred of stamps` 都是错误的。","socratic_tracks":[{"title":"精确数字 vs. 概数","steps":[{"question":"句子中的 `three` 是一个确切的数字，还是一个模糊的大概数量？","hint":"`three` 就是“三”，是一个非常具体的数字。","takeaway":"题干给出了精确数字 `three`，表示这是一个确切的数量。"},{"question":"当 `hundred` 前面有 `two`, `three` 这样的精确数字时，`hundred` 本身应该用单数还是复数形式？","hint":"回忆一下我们怎么说“二百”？是 `two hundreds` 还是 `two hundred`？","takeaway":"当 `hundred` 前有具体数字时，`hundred` 保持单数形式，作为数词的一部分。"}]},{"title":"`hundred` vs. `hundreds of`","steps":[{"question":"短语 `hundreds of` 是什么意思？它表达的是一个精确的数量吗？","hint":"比如 `hundreds of people` 是指“几百个人”，是一个大概的范围，而不是一个确定的数字。","takeaway":"`hundreds of` 表示概数，意为“数以百计的”，用来描述一个模糊的大量。"},{"question":"既然题干中已经有了精确数字 `three`，我们还能用表示概数的 `hundreds of` 吗？","hint":"精确和模糊两种表达方式通常是不能同时使用的。","takeaway":"有了精确数字 `three`，就不能再用表示概数的 `hundreds of` 结构了。"}]},{"title":"结构辨析与排除","steps":[{"question":"根据我们刚才的讨论，`具体数字 + hundred` 后面需要加 `of` 吗？","hint":"想一想“二百名学生”是 `two hundred students` 还是 `two hundred of students`？","takeaway":"在“具体数字 + hundred”结构中，后面直接跟名词，不需要加 `of`。"},{"question":"现在请检查所有选项，哪个选项完全符合“具体数字 `three` + 单数 `hundred` + 名词”这个结构？","hint":"选项A、B、C都违反了我们讨论的规则。","takeaway":"只有选项 D `hundred` 能够正确地放入句子，构成 `three hundred Chinese stamps`。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Would you like some milk?\n—Yes, please, but just _____.","options":{"A":"a few","B":"few","C":"little","D":"a little"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查量词的用法。首先，`milk`（牛奶）是不可数名词。`a few` 和 `few` 只能修饰可数名词复数，因此排除A和B选项。`little` 意为“几乎没有”，带有否定含义；`a little` 意为“有一点”，带有肯定含义。根据对话中“Yes, please”可知，说话人是想要牛奶的，但后面的 `but just` 表示转折，说明不想要太多，只要“一点点”即可。因此，应选择表示肯定但量少的 `a little`。","knowledge_expansion_md":"### a little / little / a few / few 的用法辨析\n\n这四个词组都用来表示数量，但用法和含义有细微差别：\n\n1.  **修饰不可数名词**\n    *   `a little`: 意为“一点，少量”，表示肯定含义。例：`I have a little money, so I can buy a book.` (我有一点钱，可以买本书。)\n    *   `little`: 意为“几乎没有”，表示否定含义。例：`He has little money, so he can't buy the book.` (他几乎没钱，买不了那本书。)\n\n2.  **修饰可数名词复数**\n    *   `a few`: 意为“一些，几个”，表示肯定含义。例：`There are a few apples on the table.` (桌上有几个苹果。)\n    *   `few`: 意为“很少，几乎没有”，表示否定含义。例：`He has few friends because he is always busy.` (他几乎没什么朋友，因为他总是很忙。)\n\n**易错点**：学生常常混淆这四者的用法，关键在于两步判断：第一，名词是可数还是不可数；第二，语境是肯定还是否定。","socratic_tracks":[{"title":"名词可数性判断","steps":[{"question":"在题干中，我们要修饰的名词是什么？它是可数名词还是不可数名词？","hint":"你能不能说“一杯牛奶”、“两杯牛奶”？你能不能直接说“一个牛奶”、“两个牛奶”？","takeaway":"我们要修饰的名词是 `milk`，它是一个不可数名词。"},{"question":"既然 `milk` 是不可数名词，那么四个选项中，哪些可以立刻被排除掉？","hint":"想一想 `a few` 和 `few` 通常用来修饰什么样的名词，比如 `a few friends`。","takeaway":"`a few` 和 `few` 用来修饰可数名词复数，所以可以排除A和B选项。"}]},{"title":"肯定与否定含义辨析","steps":[{"question":"`a little` 和 `little` 在意思上有什么关键区别？","hint":"一个带了冠词 `a`，一个没有。它们表达的情感色彩是相同的吗？","takeaway":"`a little` 表示“有一点”，是肯定的；`little` 表示“几乎没有”，是否定的。"},{"question":"对话中，说话人先说了“Yes, please”，这表达了肯定还是否定的意愿？","hint":"当别人问你“要不要来点……”时，回答“Yes, please”是什么意思？","takeaway":"“Yes, please”明确表达了说话人想要牛奶的肯定意愿。"},{"question":"结合“Yes, please”和后面的“but just...”，说话人是想表达“几乎不想要”还是“只想要一点点”？","hint":"`but just` 是“但是只要”的意思，它是在肯定想要的基础上对数量进行限制。","takeaway":"说话人想要，但只想要少量，因此应该用表示肯定含义的 `a little`。"}]},{"title":"生活情境应用","steps":[{"question":"假设你去朋友家做客，朋友问你要不要喝果汁，你有点渴但又不想喝太多，你会怎么用英语回答？","hint":"参考本题的对话结构：先礼貌地接受，然后说明想要的量。","takeaway":"你可以说：“Yes, please. Just a little.”"},{"question":"反过来，如果你几乎不想要，但又不想直接拒绝显得不礼貌，你可以怎么说？","hint":"这时可以用 `little` 来委婉地表达“几乎不要”的意思。","takeaway":"你可以说：“Just a little, please.” 或者在特定语境下用 “Very little, thanks.” 来强调量非常少。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—Excuse me, I want to see Mr. Johnson.\n—OK. _____.","options":{"A":"What's wrong with you?","B":"This way please.","C":"He is working now.","D":"Mr. Johnson isn't in."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查情景交际。第一说话人表明来意：“我想见约翰逊先生。”第二说话人回答“OK.”，表示知道了并愿意提供帮助。接下来最合乎逻辑的反应是为来访者引路。A选项“What's wrong with you?”（你怎么了/你有毛病吗？）非常不礼貌，完全不适用。C选项“他正在工作”和D选项“他不在”虽然可能是事实，但通常在告知坏消息前会用“I'm sorry, but...”等更委婉的表达，直接跟在表示承接的“OK.”后面显得突兀和不礼貌。B选项“This way please.”（这边请）是为他人引路时的标准礼貌用语，完全符合语境。","knowledge_expansion_md":"### 英语情景交际：接待访客\n\n在接待访客的场景中，礼貌和清晰的指引至关重要。以下是一些常用表达：\n\n**1. 积极回应与指引：**\n*   `This way please.` (这边请。)\n*   `Follow me please.` (请跟我来。)\n*   `Please take a seat. I'll let him know you're here.` (请坐。我去通知他您来了。)\n*   `His office is just down the hall.` (他的办公室就在走廊那头。)\n\n**2. 委婉告知无法见面：**\n当要找的人不在或正忙时，需要用委婉的语气告知，通常以 `I'm sorry` 或 `I'm afraid` 开头。\n*   `I'm sorry, but Mr. Johnson is in a meeting right now.` (很抱歉，约翰逊先生正在开会。)\n*   `I'm afraid he's not in the office today.` (恐怕他今天不在办公室。)\n*   `Can I take a message?` (需要我为您留个言吗？)\n\n**3. 避免不礼貌的表达：**\n*   `What do you want?` (你想干嘛？) -> 过于直接，应使用 `How can I help you?`\n*   `What's wrong with you?` (你怎么了？/你有病啊？) -> 极不礼貌，通常只用于关心熟人身体不适，或在争吵时使用。","socratic_tracks":[{"title":"对话功能分析","steps":[{"question":"访客说“我想见约翰逊先生”，作为接待者，你的主要任务是什么？","hint":"是盘问对方，还是提供帮助？","takeaway":"接待者的主要任务是为访客提供帮助，满足其合理请求。"},{"question":"接待者回答了“OK.”，这个词在这里传达了什么态度？","hint":"“OK”是同意还是拒绝？是积极还是消极？","takeaway":"“OK.”在这里表示“好的，我明白了”，是一种积极的、愿意合作的态度。"},{"question":"既然是积极合作的态度，那么接下来最可能采取什么行动？","hint":"是直接把访客领过去，还是告诉他不能见？","takeaway":"最合乎逻辑的行动是执行访客的请求，比如为他引路。"}]},{"title":"礼貌用语辨析","steps":[{"question":"选项A “What's wrong with you?” 在什么语境下使用是合适的？在这个对话中合适吗？","hint":"这句话可以用来关心生病的朋友，但对一个陌生访客说会怎么样？","takeaway":"这句话在这里极不礼貌，有冒犯性，完全不适用。"},{"question":"选项C和D描述了一种无法见面的情况。如果这是事实，通常应该如何礼貌地表达？","hint":"在拒绝或告知坏消息时，英语中通常会先说什么来缓和语气？","takeaway":"礼貌的做法是先说“I'm sorry”或“I'm afraid”，而不是在“OK”之后直接说出。"}]},{"title":"选项对比与排除","steps":[{"question":"我们已经确定，接待者在说了“OK”之后，应该会采取一个积极的行动。四个选项中，哪个是表示“行动”的？","hint":"哪个选项是一个祈使句，在指示对方做什么？","takeaway":"选项B “This way please.” 是一个祈使句，直接引导对方行动。"},{"question":"为什么选项B“这边请”是最佳答案？","hint":"它是否同时满足了“礼貌”、“积极”和“符合逻辑”这几个条件？","takeaway":"“This way please.”既礼貌又直接地回应了访客的请求，是接待场景中的标准用语，因此是最佳答案。"}]}]}}]},{"section_title":"II. 完形填空","section_instruction":"(共10小题；每小题1分，共10分)\n阅读下面短文，掌握其大意，然后从各题所给的A、B、C、D四个选项中，选出最佳选项。\n\nMr and Mrs Wilson lived in a big crowded city, and one summer they took a __11__ in the country. They enjoyed it very much, __12__ it was a quiet, clean place and very different from the __13__. One day, __14__, went for a walk early in the morning and met an old man. He was sitting alone in the warm sun outside his front door. Mr Wilson __15__ him, “Do you like living in such a __16__ place?”\nThe old man said, “Yes, I do.”\nMr Wilson said, “What are the __17__ things about it?”\nThe old man answered, “Well, everybody __18__ everybody else. People often come and visit me, __19__ I often go and visit them. And __20__ are a lot of children here.”\nMr Wilson said, “That's interesting. And what are the bad things?”\nThe old man thought for a few minutes and said, “Well, the same things really.”","items":[{"number":"11","item_type":"cloze","context_note":"Cloze passage","stem":"took a __11__ in the country.","options":{"A":"run","B":"drink","C":"plane","D":"holiday"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查名词辨析与固定搭配。根据前文“one summer”（一个夏天），以及句子结构“took a ____ in the country”（在乡下度过一个____），可知此处需要填入一个与假期活动相关的名词。`take a holiday` 是固定搭配，意为“度假”，符合语境。选项A和B是动词，词性不符；选项C“飞机”不符合搭配 `take a plane`（应为 `by plane` 或 `take a plane to...`），且与 `in the country` 语境不符。因此，D是最佳答案。","knowledge_expansion_md":"### 词性与搭配（Part of Speech & Collocation）\n\n完形填空题常常考查对词性和固定搭配的掌握。\n\n1.  **词性判断**：首先要分析句子结构，判断空格处需要什么词性的词（名词、动词、形容词等）。在本题的假设语境 `our summer ____` 中，`our`（我们的）和 `summer`（夏天的）都是修饰词，后面必须跟一个名词。\n\n2.  **固定搭配**：英语中有很多约定俗成的词语搭配（collocations），记忆这些搭配对做题和写作都很有帮助。\n    *   与 `holiday` 相关的搭配：`summer/winter holiday` (暑/寒假), `go on holiday` (去度假), `public holiday` (公共假日), `take a holiday` (休假)。\n    *   与 `plane` 相关的搭配：`by plane` (乘飞机), `catch a plane` (赶飞机), `get on/off a plane` (上/下飞机)。\n\n3.  **`holiday` vs. `vacation`**：\n    *   在英式英语中，`holiday` 指任何不用上学或上班的日子，包括长假和公共假日。\n    *   在美式英语中，`vacation` 通常指较长的假期（如暑假），而 `holiday` 多指特定的法定假日（如圣诞节、感恩节）。","socratic_tracks":[{"title":"固定搭配与语境","steps":[{"question":"观察句子 `...they took a ____ in the country.`，这是一个关于什么的常见表达？","hint":"动词 `took` 在这里和哪个名词搭配可以表示“度过（一段时光）”？","takeaway":"短语 `take a...` 常用于表示进行某种活动或度过一段时间。"},{"question":"结合前文的 `one summer`（一个夏天），在乡下（in the country）最可能进行的活动是什么？","hint":"夏天人们通常会做什么来放松？","takeaway":"夏天在乡下通常是为了“度假”。"},{"question":"四个选项中，哪个词可以和 `take a` 组成表示“度假”的固定搭配？","hint":"我们常说 `take a run`, `take a drink`, `take a plane` 还是 `take a holiday`？","takeaway":"`take a holiday` 是固定搭配，意为“度假”，完全符合语境。"}]}]}},{"number":"12","item_type":"cloze","context_note":"Cloze passage","stem":"They enjoyed it very much, __12__ it was a quiet, clean place...","options":{"A":"if","B":"so","C":"or","D":"because"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查连词的用法，需要判断前后分句的逻辑关系。前一个分句“They enjoyed it very much”（他们非常喜欢那里）是结果，后一个分句“it was a quiet, clean place”（那是个安静、干净的地方）是原因。在“结果, ____ 原因”的句子结构中，应该使用表示“因为”的连词。A `if`（如果）表条件；B `so`（所以）表结果，用于“原因, so 结果”；C `or`（或者）表选择；D `because`（因为）表原因。因此，D是正确答案。","knowledge_expansion_md":"### 常用逻辑连词辨析\n\n连词是连接句子中不同部分的桥梁，表达它们之间的逻辑关系。掌握常用连词的用法至关重要。\n\n1.  **因果关系**\n    *   `so` (所以): 用于“原因, so 结果”结构。例: `It was raining, so I stayed home.`\n    *   `because` (因为): 用于“结果 because 原因”结构。例: `I stayed home because it was raining.`\n    *   **易错点**: 在一个句子中，`so` 和 `because` 不能同时使用。中文可以说“因为...所以...”，但英文不行。\n\n2.  **条件关系**\n    *   `if` (如果): 引导条件状语从句，表示在某种条件下会发生什么。例: `If you study hard, you will get good grades.`\n\n3.  **选择关系**\n    *   `or` (或者): 用于连接两个或多个选择。例: `Would you like tea or coffee?`\n\n4.  **转折关系**\n    *   `but` (但是): 表示与前面情况相反或不同。例: `He is rich, but he is not happy.`","socratic_tracks":[{"title":"句子逻辑关系判断","steps":[{"question":"在句子 `They enjoyed it very much, ____ it was a quiet, clean place.` 中，前后两个部分是什么关系？","hint":"想一想，“他们很喜欢”和“那地方很安静干净”哪一个是原因，哪一个是结果？","takeaway":"“那地方很安静干净”是原因，“他们很喜欢”是结果。这是一个因果关系。"},{"question":"句子的结构是“结果”在前，“原因”在后。我们应该选择一个表示“因为”的词，还是表示“所以”的词？","hint":"中文里我们会说“我喜欢这里，因为这里很安静”。","takeaway":"我们需要一个表示“因为”的词来引出原因。"}]},{"title":"连词功能辨析","steps":[{"question":"选项中的 `so` 和 `because` 都可以表示因果关系，它们的用法有什么不同？","hint":"`so` 引导结果，`because` 引导原因。","takeaway":"`so` 用于“原因, so 结果”结构，而 `because` 用于“结果 because 原因”或“Because 原因, 结果”结构。"},{"question":"根据本题的“结果, ____ 原因”结构，应该选择哪个连词？","hint":"空格后面是原因。","takeaway":"应该选择 `because` 来引导原因分句。"}]}]}},{"number":"13","item_type":"cloze","context_note":"Cloze passage","stem":"...and very different from the __13__.","options":{"A":"city","B":"garden","C":"town","D":"village"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查上下文的理解和词义辨析。空格前的 `different from`（与……不同）提示我们需要找到一个与乡村环境形成对比的地方。根据文章第一句“Mr and Mrs Wilson lived in a big crowded city”（威尔逊夫妇住在一个拥挤的大城市里），可知他们是从城市来到乡村的。因此，乡村的安静、干净与他们所居住的“城市”形成了鲜明对比。A `city`（城市）符合此逻辑。B `garden`（花园）、C `town`（城镇）、D `village`（村庄）都不能与前文的“big crowded city”构成最直接和强烈的对比。","knowledge_expansion_md":"### 词义辨析：表示“地点”的名词\n\n在英语中，描述居住社区的词语有层级之分，了解它们的区别有助于准确使用：\n\n- **`city` (城市)**：规模最大，人口众多，通常是政治、经济、文化中心。例如：Beijing is a big city.\n- **`town` (城镇)**：规模介于 `city` 和 `village` 之间，比村庄大，但比城市小。例如：She grew up in a small town by the sea.\n- **`village` (村庄)**：规模较小，通常位于乡村地区（countryside），人口较少。例如：My grandparents live in a quiet village.\n- **`countryside` (乡村/农村)**：指城市和城镇以外的区域，是一个泛指的地理概念，而不是一个具体的居住点。常用搭配是 `in the countryside`。\n\n**解题技巧**：完形填空题常常需要“瞻前顾后”，利用上下文的线索来解题。本题的答案就隐藏在文章的开头。","socratic_tracks":[{"title":"上下文线索寻找","steps":[{"question":"这个空格需要填入一个地点名词，表示乡村与什么“不同”？","hint":"短语 `different from` 提示我们需要找一个对比项。","takeaway":"我们需要找到与“乡村”相对立或不同的地方。"},{"question":"文章的第一句话说了什么？它为我们提供了什么线索？","hint":"读第一句：`Mr and Mrs Wilson lived in a big crowded city...`","takeaway":"第一句话告诉我们，威尔逊夫妇的家在“一个拥挤的大城市里”。"},{"question":"既然他们从“大城市”来到“乡村”，那么说乡村“与……不同”时，最自然的对比对象是什么？","hint":"比较他们现在所在的地方和他们原来居住的地方。","takeaway":"最自然的对比就是乡村和城市。因此，空格处应填入 `city`。"}]}]}},{"number":"14","item_type":"cloze","context_note":"Cloze passage","stem":"One day, __14__, went for a walk early in the morning...","options":{"A":"it","B":"he","C":"they","D":"she"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查人称代词的正确使用。空格处是句子的主语，发出了“went for a walk”（去散步）这个动作。我们需要根据上下文判断主语是谁。文章的主人公是 Mr and Mrs Wilson。后面的句子提到“Mr Wilson asked him...”（威尔逊先生问他……），说明故事的焦点在威尔逊先生身上。因此，最合理的推断是威尔逊先生一个人去散步。`he` 是指代单数男性的主格代词，意为“他”，指代 Mr Wilson。因此，正确答案是B。","knowledge_expansion_md":"### 人称代词主格用法精讲\n\n人称代词有主格和宾格之分，在句子中充当不同成分。\n\n**主格人称代词**：在句子中作主语，是动作的发出者，通常位于动词之前。\n- `I` (我)\n- `you` (你, 你们)\n- `he` (他)\n- `she` (她)\n- `it` (它)\n- `we` (我们)\n- `they` (他们, 她们, 它们)\n\n**选择原则**：选择哪个人称代词取决于它所指代的名词的“人称”、“数”（单数/复数）和“性”（男/女/物）。\n\n**示例**：\n- The **teacher** is kind. **She** helps us a lot. (teacher -> she)\n- My **parents** are doctors. **They** work in a hospital. (parents -> they)\n- The **dog** is cute. **It** has long ears. (dog -> it)\n\n**易错点**：\n1.  **主格宾格混用**：误用宾格（me, him, her...）作主语。例如，错误地说 `Him is my friend.` 应为 `He is my friend.`\n2.  **单复数混淆**：用 `he/she` 指代复数名词，或用 `they` 指代单数名词。例如，`My sister is tall. They play basketball.` 是错误的。","socratic_tracks":[{"title":"寻找句子主语","steps":[{"question":"这个句子 `__14__, went for a walk...` 缺少了什么成分？","hint":"是谁 `went for a walk`（去散步）？","takeaway":"句子缺少主语，也就是发出动作的人。"},{"question":"根据文章，谁有可能去散步？","hint":"文章的主人公是谁？","takeaway":"可能是威尔逊先生（Mr Wilson），或威尔逊夫妇（Mr and Mrs Wilson）。"},{"question":"阅读后面的句子 `Mr Wilson __15__ him...`，这给了我们什么线索？","hint":"后面是只有威尔逊先生一个人在说话，还是夫妇俩一起？","takeaway":"由于后文只提到了威尔逊先生的活动，这暗示了去散步并遇到老人的主语很可能就是他一个人。"},{"question":"用哪个代词来指代“威尔逊先生”？","hint":"威尔逊先生是男性，单数。","takeaway":"应该使用主格代词 `he`（他）。"}]}]}},{"number":"15","item_type":"cloze","context_note":"Cloze passage","stem":"Mr Wilson __15__ him, “Do you like living in such a __16__ place?”","options":{"A":"met","B":"spoke","C":"looked","D":"asked"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词辨析。空格后面是一个直接引语，并且是一个问句（“Do you like...?”）。这表明威尔逊先生正在向老人“提问”或“询问”。在四个选项中，只有D `asked`（问）最符合这一语境。A `met`（遇见）；B `spoke`（说话，常需接 `to`）；C `looked`（看，常需接 `at`）。因此，`asked` 是唯一正确的答案。","knowledge_expansion_md":"### 动词及其宾语结构\n\n英语中，动词后面能否跟宾语，以及跟什么样的宾语，是固定的用法，需要重点记忆。\n\n1.  **及物动词 (Transitive Verbs)**：后面必须跟宾语。 \n    - **只跟一个宾语**：`meet sb.` (遇见某人), `hit sth.` (打某物)。\n    - **可跟双宾语**：`give sb. sth.` (给某人某物), `show sb. sth.` (给某人看某物)。\n    - **可跟复合宾语** (`宾语+宾补`)：`make sb. happy` (使某人开心)。\n\n2.  **不及物动词 (Intransitive Verbs)**：后面不能直接跟宾语，若要跟宾语，需借助介词。\n    - `look at` (看), `listen to` (听), `speak to` (对...说), `wait for` (等待)。\n\n3.  **特殊结构：动词 + sb. + wh-从句**\n    一些表示“问、说、告诉、展示”的动词可以跟这种结构，如：\n    - **`ask sb. what/who/where...`** (问某人...)\n    - **`tell sb. what/who/where...`** (告诉某人...)\n    - **`show sb. what/who/where...`** (给某人看...)\n\n**本题易错点**：学生可能因不熟悉动词的固定搭配而误选。比如，看到 `spoke`（说话）符合语境就选了，但忽略了它需要和介词 `to` 连用才能跟 `him`。","socratic_tracks":[{"title":"根据引语判断动词","steps":[{"question":"观察空格后面的内容：`him, “Do you like living in such a __16__ place?”`。引号里的内容是什么？","hint":"这是一个陈述句、疑问句还是感叹句？","takeaway":"引号里是一个以 `Do` 开头的疑问句。"},{"question":"当一个人说出一句问话时，我们应该用哪个动词来描述这个行为？","hint":"“问”问题，用哪个词？","takeaway":"应该用表示“询问”的动词。"},{"question":"比较四个选项 `met`(遇见), `spoke`(说话), `looked`(看), `asked`(询问)，哪一个最符合“提出问题”这个场景？","hint":"只有 `asked` 直接表达了“问”的含义。","takeaway":"`asked` 是最准确的动词，表示威尔逊先生向老人提问。"}]}]}},{"number":"16","item_type":"cloze","context_note":"Cloze passage","stem":"16. Do you like living in such a ___ place?","options":{"A":"quiet","B":"crowded","C":"important","D":"wrong"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查形容词的语境选择。根据上文可知，威尔逊夫妇来自一个“big crowded city”（又大又拥挤的城市），而他们正在度假的乡村是一个“quiet, clean place”（安静、干净的地方）。因此，当威尔逊先生询问老人是否喜欢住在这样一个“___”的地方时，这个空缺词应该用来描述这个乡村。选项A“quiet”（安静的）与上文描述完全一致。选项B“crowded”（拥挤的）与事实相反。选项C“important”（重要的）和D“wrong”（错误的）在语境中不合逻辑。故选A。","knowledge_expansion_md":"### 上下文线索 (Context Clues)\n\n在完形填空中，答案往往不是孤立存在的，而是由上下文中的词语或句子决定的。这道题就是典型的例子。\n1.  **直接线索**：文章前面直接提到乡村是 `a quiet, clean place`。\n2.  **对比线索**：文章将乡村与 `a big crowded city` 进行对比，进一步强化了乡村“安静”、“不拥挤”的特点。\n解题时，要像侦探一样，在文章中寻找这些线索，它们会直接或间接地指向正确答案。","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"文章开头是如何描述威尔逊夫妇住的城市和他们度假的乡村的？","hint":"找到关键词 `city` 和 `country` 所在的句子。","takeaway":"城市是 `big crowded` (又大又拥挤)，乡村是 `quiet, clean` (安静、干净)。"},{"question":"威尔逊先生问老人问题的地点是在城市还是乡村？","hint":"他们正在乡村度假。","takeaway":"他们在乡村。"},{"question":"那么，当威尔逊先生说“such a ___ place”（这样一个___的地方）时，他指的应该是哪种地方？","hint":"他指的是老人所居住的这个乡村。","takeaway":"他指的是这个安静、干净的乡村。"},{"question":"根据这个理解，四个选项中哪个词最能准确描述这个地方？","hint":"`quiet` (安静的), `crowded` (拥挤的), `important` (重要的), `wrong` (错误的)。","takeaway":"`quiet` (安静的) 最符合上下文的描述。"}]}]}},{"number":"17","item_type":"cloze","context_note":"Cloze passage","stem":"17. What are the ___ things about it?","options":{"A":"bad","B":"good","C":"wrong","D":"right"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词的语境选择和篇章理解。上文老人回答“Yes, I do.”，表明他喜欢住在这里。威尔逊先生接着问“What are the ___ things about it?”，是想了解喜欢的原因，即住在这里的优点。从下文老人回答的内容（人们互相认识、互相拜访、有很多孩子）可以看出，他列举的都是积极的方面。并且，后文威尔逊先生又问了“what are the bad things?”（坏处是什么？），形成了鲜明对比。因此，此处应该询问的是“好处”。选项B“good”（好的）符合语境。选项A“bad”（坏的）与后文提问重复且逻辑不符。选项C“wrong”（错误的）和D“right”（正确的）不符合提问习惯。故选B。","knowledge_expansion_md":"### 对比与反义词线索\n\n在阅读理解和完形填空中，作者常常使用对比（contrast）的手法来组织文章。识别文中的对比关系和反义词是重要的解题技巧。\n*   **关键词**：`but`, `however`, `on the other hand`, `while` 等是明显的对比信号。\n*   **结构对比**：有时对比不通过连词，而是通过句子结构和内容实现。本题中，`What are the good things?` 和 `what are the bad things?` 就是一个典型的结构和内容对比。\n*   **反义词**：`good` vs `bad`, `quiet` vs `crowded`, `early` vs `late`。注意到这些反义词对，可以帮助我们理解文章的逻辑，并预测空缺处的内容。","socratic_tracks":[{"title":"通过对话逻辑推理","steps":[{"question":"在威尔逊先生提问之前，老人说了什么？","hint":"老人回答了“Yes, I do.”","takeaway":"老人表示他喜欢住在这里。"},{"question":"当一个人说他喜欢某样东西后，你接着问他原因，你通常会问它的“好处”还是“坏处”？","hint":"“你为什么喜欢它？”就是在问它的优点。","takeaway":"通常会先问它的好处或优点。"},{"question":"再看下文，老人回答的内容是积极的还是消极的？","hint":"“每个人都认识彼此”、“人们经常来拜访我”...","takeaway":"老人回答的都是积极的、好的方面。"},{"question":"最后，看看文章后面威尔逊先生提的另一个问题是什么？","hint":"他问了 “And what are the bad things?”","takeaway":"他后来又问了“坏处”。这与前面的问题形成对比。"},{"question":"综合以上线索，第17题的空格里最应该填哪个词？","hint":"`good` (好的), `bad` (坏的), `wrong` (错误的), `right` (正确的)。","takeaway":"应该填 `good`，询问“好处”，与后文的“坏处”形成对比。"}]}]}},{"number":"18","item_type":"cloze","context_note":"Cloze passage","stem":"18. Well, everybody ___ everybody else.","options":{"A":"knows","B":"helps","C":"teaches","D":"telephones"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词在语境中的选择。空格所在句是老人对乡村生活优点的描述：“Well, everybody ___ everybody else.”（嗯，每个人都___其他每一个人。）这是在解释为什么他喜欢这里。“everybody knows everybody else”（每个人都认识彼此）是描述小社区人际关系紧密的常用表达，完全符合“人们经常互相拜访”的友好氛围。选项B“helps”（帮助）虽然也合理，但“认识”是“帮助”和“拜访”的基础。选项C“teaches”（教）和D“telephones”（打电话）在语境中不如A贴切。故选A。","knowledge_expansion_md":"### 语境与高频搭配\n\n完形填空非常注重对语境和常用搭配的考查。\n1.  **理解语境**：首先要明白句子的大意。本句是描述乡村生活的优点，关键词是“友好”、“社区感”。\n2.  **高频搭配**：`everybody knows everybody` 是一个非常地道且高频的表达，专门用来形容小地方（如村庄、小镇）人们彼此都非常熟悉的状态。\n3.  **选择最佳**：即使其他选项（如 `helps`）在逻辑上勉强说得通，但通常应优先选择最符合语境、最地道、最高频的表达。在描述小社区的特点时，`knows` 是最核心、最基础的概念。","socratic_tracks":[{"title":"理解社区生活特点","steps":[{"question":"老人正在描述乡村生活的什么方面？","hint":"参考第17题，他正在回答“What are the good things?”","takeaway":"他正在描述乡村生活的优点（good things）。"},{"question":"一个关系紧密的小社区，其最基本的特点是什么？","hint":"在互相帮助、互相拜访之前，人们首先得互相...？","takeaway":"人们首先得互相认识。"},{"question":"在英语中，有没有一个固定的说法来形容“小地方人人都认识”？","hint":"这是一个非常常见的短语。","takeaway":"常用的表达是 `everybody knows everybody`。"},{"question":"对比选项，`knows` 和 `helps` 哪个更适合作为描述社区特点的第一个优点？","hint":"“认识”是后续“拜访”、“帮助”等一系列社区行为的基础。","takeaway":"`knows` (认识) 更基础、更典型，是最佳选项。"}]}]}},{"number":"19","item_type":"cloze","context_note":"Cloze passage","stem":"19. People often come and visit me, ___ I often go and visit them.","options":{"A":"and","B":"but","C":"before","D":"or"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查并列连词的逻辑关系。空格前的分句是“People often come and visit me”（人们经常来看我），空格后的分句是“I often go and visit them”（我经常去看他们）。这两个动作是并列和互补的关系，共同描述了社区里人们友好、频繁的相互往来。连词`and`（并且）用来连接两个并列或顺承的句子，完全符合此处的逻辑。选项B`but`（但是）表示转折；C`before`（在……之前）表示时间；D`or`（或者）表示选择。均不符合句意。故选A。","knowledge_expansion_md":"### 并列连词的逻辑功能\n\n并列连词用于连接语法地位相同的词、短语或分句。理解它们各自的逻辑功能是关键：\n*   **`and` (和、并且)**: 表示**并列**或**顺承**。连接的两个部分在逻辑上是平等的或接续发生的。\n    *   *e.g., He washed the dishes, and she dried them.*\n*   **`but` (但是)**: 表示**转折**或**对比**。连接的两个部分在意思上是相反或相对的。\n    *   *e.g., He is rich, but he is not happy.*\n*   **`or` (或者)**: 表示**选择**。在两者或多者中选其一。\n    *   *e.g., Is it yours or mine?*\n*   **`so` (所以)**: 表示**因果**关系，引导结果。\n    *   *e.g., It was raining, so I took an umbrella.*","socratic_tracks":[{"title":"判断句子间的逻辑关系","steps":[{"question":"空格前后的两个句子分别是什么意思？","hint":"`People often come and visit me.` 和 `I often go and visit them.`","takeaway":"“人们来看我”和“我去看他们”。"},{"question":"这两个行为是相互矛盾的（转折），还是相互补充的（并列）？","hint":"这两个行为共同描绘了一幅邻里和睦、互相走动的画面。","takeaway":"这两个行为是相互补充的，表示一种双向的、并列的关系。"},{"question":"在给出的四个连词 `and`, `but`, `before`, `or` 中，哪一个最适合用来连接两个并列、互补的句子？","hint":"哪个词的意思是“并且”？","takeaway":"`and` (并且) 最适合用来表达这种并列关系。"},{"question":"为什么不能用 `but` (但是)？","hint":"如果用 `but`，句子的意思就变成了“人们来看我，但是我去看他们”，这在逻辑上说不通，因为两者并不矛盾。","takeaway":"`but` 表示转折，而这两个句子之间没有转折关系，所以不适用。"}]}]}},{"number":"20","item_type":"cloze","context_note":"Cloze passage","stem":"And __20__ are a lot of children here.","options":{"A":"we","B":"they","C":"there","D":"people"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 `There be` 句型。空格后的句子结构是 `... are a lot of children here`，意为“有很多孩子在这里”。这是一个典型的表示“某地有某物/某人”的场景，应该使用 `There be` 句型。其基本结构是 `There be + 名词 + 地点状语`。本句中，`be` 动词是 `are`，名词是 `a lot of children`，地点状语是 `here`，因此空格处应填入 `There`。选项 A `we` 和 B `they` 是人称代词主格，填入后语义不通。选项 D `people` 虽可作主语，但 `People are a lot of children here` 语义不合逻辑。故选 C。","knowledge_expansion_md":"### There be 句型\n\n`There be` 句型是英语中表示“存在”的常用句型，意为“某地（或某时）有某人/某物”。\n\n**1. 基本结构:**\n`There + be + 名词 + 地点/时间状语`\n\n**2. `be` 动词的选择:**\n`be` 动词的形式由其后的名词（即句子的真正主语）的单复数决定，遵循“就近原则”。\n- `There is a book on the desk.` (book是单数，用is)\n- `There are some books on the desk.` (books是复数，用are)\n- `There is a pen and two pencils in the box.` (pen离be动词最近，是单数，用is)\n\n**3. 与 `have/has` 的区别:**\n- `There be` 表示客观存在。例: `There is a tree in front of the house.` (房子前面有棵树。)\n- `have/has` 表示主观拥有。例: `He has a big house.` (他有一所大房子。)","socratic_tracks":[{"title":"句子含义分析","steps":[{"question":"请读一下空格所在的句子：`And ___ are a lot of children here.` 这句话想表达什么意思？","hint":"它是在描述“这里有很多孩子”这个事实，还是在说“我们/他们是很多孩子”？","takeaway":"这句话是在说“这里有很多孩子”，描述一个地方存在着某样东西或某些人。"},{"question":"在英语中，要表达“某地有某物/某人”这种“存在”的含义，我们通常用什么句型？","hint":"想一想我们怎么说“桌子上有一本书”？ `A book is on the table.` 还是 `There is a book on the table.`？","takeaway":"表达“存在”的含义，我们通常使用 `There be` 句型。"}]},{"title":"语法结构验证","steps":[{"question":"如果使用 `There be` 句型，这个句子应该是什么样的？","hint":"句型是 `There be + 名词 + 地点`。这里的 `be` 动词是 `are`，名词是 `a lot of children`，地点是 `here`。","takeaway":"完整的句子应该是 `There are a lot of children here.` 因此空格处应该填 `There`。"},{"question":"我们来检查一下其他选项为什么不对。如果填 A `we`，句子变成 `We are a lot of children here.` 这句话通顺吗？","hint":"`we` 指“我们”，句子意思变成“我们是很多孩子”，这在逻辑上很奇怪，也不符合老人的语境。","takeaway":"选项 A `we` 语义不通，排除。"},{"question":"如果填 B `they` 或 D `people` 呢？","hint":"`They are a lot of children here.` 或 `People are a lot of children here.` 同样存在语义逻辑问题。","takeaway":"选项 B 和 D 都不符合表达“某地有……”的句意和语法习惯，因此排除。最终确定答案是 C `there`。"}]}]}}]},{"section_title":"III. 阅读理解","section_instruction":"(共5小题；每小题2分，共10分)\n阅读下列短文，从每题所给的A、B、C、D四个选项中，选出最佳选项。\n\nGuangdong has been regarded as a famous paradise of diverse and wonderful foods. Most of the people of Guangdong thought that dim sum and dumplings are foods fit for the Spring Festival; Newsgit interviewed both expats and locals across Guangdong.\n\nPoon choi (盆菜): Cantonese people like to mix a variety of meats, seafood and mushrooms in a large “basin” (盆子). The dish can be widely bought from hotels, restaurants and even online.\n\nJiandui (fried cake with sesame seeds): It's a famous snack in Guangzhou. It's a round fried pastry made from glutinous rice flour with yellow crisp skin and tasteful filling. It also carries good wishes that you will be blessed with fortune and luck all year round.\n\nLettuce porridge: Lettuce in Chinese is “生菜”, which sounds like “生财” in Mandarin. Cantonese people will make lettuce porridge in Spring Festival as it implies luck and wealth.\n\nHakka stuffed tofu: It's a traditional dish for the Hakka people. It's famous for the thickened soup and a tender and fresh taste. People in Hakka areas such as Meizhou, Huizhou and Heyuan often entertain the guests with this dish in festivals or banquets(宴会).","items":[{"number":"21","item_type":"reading","context_note":"Passage about Guangdong food","stem":"Where can we probably find this passage?","options":{"A":"From a novel.","B":"From a newspaper.","C":"From a comic book.","D":"From a fiction."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道文体判断题。文章以客观、信息性的口吻介绍了广东地区的几种节日美食及其文化背景，这种体裁和风格非常符合报纸或杂志上的专题报道（feature article）。文章的目的在于提供信息，而非讲述一个虚构故事。因此，它最可能来源于报纸（newspaper），而不是小说（novel）、漫画（comic book）或虚构作品（fiction）。","knowledge_expansion_md":"### 如何判断文章体裁 (Text Genre)\n\n在阅读理解中，判断文章出处或体裁是一个常见考点。考生可以从以下几个方面入手：\n\n1.  **写作目的 (Purpose)**：\n    *   **说明文 (Expository)**：旨在解释事物、阐明事理，如科普文章、新闻报道、产品说明书。语言客观、准确。\n    *   **记叙文 (Narrative)**：旨在讲述故事、记叙经历，如小说、传记、新闻事件的叙述部分。有时间、地点、人物、情节等要素。\n    *   **议论文 (Argumentative)**：旨在表达观点、说服读者，如社论、评论。有论点、论据、论证。\n    *   **应用文 (Practical)**：旨在完成特定应用，如信件、通知、广告。格式通常比较固定。\n\n2.  **语言风格 (Style)**：是正式还是非正式？是客观还是主观？是风趣幽默还是严肃庄重？本文语言风格客观、平实，符合新闻报道的特点。\n\n3.  **文章结构 (Structure)**：新闻报道通常采用“倒金字塔”结构，将最重要的信息放在开头。而故事则按时间或逻辑顺序展开。","socratic_tracks":[{"title":"判断文章目的","steps":[{"question":"你认为作者写这篇文章是为了讲一个引人入胜的故事，还是为了向我们介绍一些关于广东美食的知识？","hint":"文章中是否有主角、曲折的情节？还是在分点介绍不同的食物？","takeaway":"文章的核心目的是提供信息，介绍广东的几种特色美食，属于说明性文体。"},{"question":"既然文章的目的是提供信息，那么在小说、报纸、漫画书这几个选项中，哪一个最常用来刊登这类信息？","hint":"想一想你通常在什么地方能读到关于文化、美食、旅游的介绍性文章。","takeaway":"报纸和杂志是刊登新闻、知识和文化介绍等信息性文章的主要媒介。"}]},{"title":"排除错误选项","steps":[{"question":"为什么这篇文章不像一本小说（novel）或虚构故事（fiction）？","hint":"小说和虚构故事通常需要具备哪些元素？比如人物关系、情节发展等。这篇文章具备吗？","takeaway":"本文缺乏小说的核心元素如故事情节和人物塑造，因此可以排除 A 和 D。"},{"question":"为什么它不可能是从一本漫画书（comic book）里节选的？","hint":"漫画书最主要的特点是什么？它主要通过什么形式来表达内容？","takeaway":"漫画书以图画为主要表现形式，而本文是纯文字描述，因此可以排除 C。"}]},{"title":"分析语言特征","steps":[{"question":"观察文章的语言，你觉得它是非常个人化、情绪化的，还是比较客观、中立的？","hint":"文中是否充满了作者强烈的个人喜好或感叹？还是在平实地介绍事实？","takeaway":"文章使用了客观、报道性的语言来介绍美食和文化，这符合新闻文体的特征。"},{"question":"文章的结构是怎样的？开头、中间、结尾分别讲了什么？这种结构适合哪种文体？","hint":"文章开头总起，中间分段介绍几种食物，结尾总结。这种“总-分-总”的结构常见于什么类型的文章？","takeaway":"清晰的条理和结构是说明性文章的典型特征，有助于读者快速获取信息。"}]}]}},{"number":"22","item_type":"reading","context_note":"Passage about Guangdong food","stem":"How many kinds of food are introduced here?","options":{"A":"One.","B":"Two.","C":"Three.","D":"Four."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道细节计数题。通过仔细阅读文章，我们可以找到文中明确介绍的四种食物。文章在第二段介绍了“Poon choi (盆菜)”，第三段介绍了“Jiandui (fried cake with sesame seeds)”，第四段介绍了“Lettuce porridge”，第五段介绍了“Hakka stuffed tofu”。因此，文章总共介绍了四种食物。","knowledge_expansion_md":"### 如何解答信息计数题 (Information Counting)\n\n信息计数题（如 `How many...?`）是阅读理解中的常见细节题，旨在考察学生定位和提取关键信息的能力。\n\n**解题步骤：**\n1.  **审题**：明确问题要求计数的是什么，如“食物种类”、“人数”、“原因”等。\n2.  **定位**：快速扫描全文，寻找与问题相关的关键词。对于本题，关键词就是食物的名称。大写字母、括号里的中文等都是很强的定位信号。\n3.  **列举**：将找到的相关信息点一一列出，避免遗漏和重复。在本题中，可以列出：Poon choi, Jiandui, Lettuce porridge, Hakka stuffed tofu。\n4.  **辨析**：注意区分“主要介绍”和“顺带提及”的信息。例如，文中提到了 `dumplings`（饺子），但只是在引言中提及，并未将其作为一种广东特色美食来详细介绍，因此不应计入总数。\n5.  **计数**：最后，对列举并确认过的信息点进行计数，得出最终答案。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"问题问的是“介绍了多少种食物”。我们应该在文章中寻找什么样的词语？","hint":"注意那些用大写字母开头的专有名词，特别是后面还跟着中文翻译的词语。","takeaway":"解答此类问题，首先要快速扫描并定位文中的专有名词或关键词。"},{"question":"请在文章中把这些食物的名称划出来。你找到了几个？","hint":"仔细阅读每个段落，看看每段是否都介绍了一种新的食物。","takeaway":"通过定位，我们可以找到 Poon choi, Jiandui, Lettuce porridge, 和 Hakka stuffed tofu 这四个食物名称。"}]},{"title":"辨别干扰信息","steps":[{"question":"文章开头提到了“dim sum and dumplings”，它们算不算被介绍的食物呢？","hint":"阅读引言部分，看看作者是在详细介绍它们，还是只是一笔带过作为引子？","takeaway":"文章只是在引言中提及“dim sum and dumplings”，并未像后面四种食物一样用独立段落进行详细介绍，因此不计入总数。"}]},{"title":"利用文章结构","steps":[{"question":"观察一下文章的段落安排。除了开头的引言，文章的主体部分有几个段落？","hint":"数一数文章的主体部分，即从第二段到第五段，一共有几个段落。","takeaway":"文章的主体部分由四个段落构成。"},{"question":"这四个段落各自的主要内容是什么？这和我们要找的答案有什么关系？","hint":"每个段落是不是都围绕一个核心话题展开？这个话题是不是一种食物？","takeaway":"文章结构清晰，每个主体段落介绍一种食物，因此段落数量直接对应了所介绍的食物种类数量。"}]}]},"correct_answer":"D"},{"number":"23","item_type":"reading","context_note":"Passage about Guangdong food","stem":"What is the main meaning of the word “expats”?","options":{"A":"Someone who doesn't live in their own country.","B":"Someone who enjoys cooking.","C":"Someone who wants to send gifts.","D":"Someone who works in Guangzhou."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道词义猜测题。在原文中定位到“expats”这个词，它出现在句子“Newsgit interviewed both expats and locals across Guangdong.”中。这里的“locals”（本地人）与“expats”用“and”连接，形成并列关系，暗示“expats”是与“本地人”相对应的一类人，即居住在国外的侨民。因此，选项A“不住在自己国家的人”是正确的。","knowledge_expansion_md":"### 词义猜测的常用方法\n\n在阅读中遇到生词时，不必惊慌，可以通过上下文提供的线索来推断其含义。常用方法有：\n\n1.  **利用对比或反义关系**：文中常使用 `but`, `however`, `unlike`, `in contrast to` 等词语，或像本题一样将反义词（`locals` vs `expats`）并列，从而揭示生词的含义。\n2.  **利用定义或解释**：作者有时会直接对生词进行解释，常伴有 `that is`, `in other words`, `which means` 等标志词，或使用破折号、括号进行补充说明。\n3.  **利用举例**：文中的例子可以帮助我们理解一个抽象的词汇。`for example`, `for instance`, `such as` 是常见的标志，本题中“an expat from the UK”就是一个具体的例子。\n4.  **利用构词法**：通过分析单词的前缀、后缀和词根来猜测词义。`Expat` 是 `expatriate` 的缩写，前缀 `ex-` 表示“出，外”，`patria` 源于拉丁语，意为“祖国”，合起来就是“离开祖国的人”。\n5.  **利用同义或近义关系**：有时文章会用更简单的词来复述或替代生词。","socratic_tracks":[{"title":"利用上下文线索","steps":[{"question":"在文章中，“expats”这个词和哪个词并排放在一起？它们之间是什么关系？","hint":"找到句子 “...both expats and locals...”。“locals”是什么意思？“and”在这里起什么作用？","takeaway":"“Expats”与“locals”（本地人）并列，形成对比关系，暗示“expats”指的是与本地人相对的“非本地人”，即侨民。"}]},{"title":"分析选项","steps":[{"question":"选项A说“不住在自己国家的人”，这和我们推断出的意思符合吗？","hint":"对比一下我们刚刚得出的结论和选项A的描述。","takeaway":"选项A是对“expat”含义的准确概括。"},{"question":"为什么选项D“在广州工作的人”不准确？","hint":"一个在广州工作的外国人是“expat”，但“在广州工作”是“expat”这个词的定义，还是这个人的一个属性？所有在广州工作的人都是“expat”吗？","takeaway":"“在广州工作”只是对某个“expat”的描述，而非“expat”这个词本身的定义，范围太窄且不准确。"}]},{"title":"学习构词法","steps":[{"question":"“Expat”是“expatriate”的缩写。你知道前缀“ex-”有什么含义吗？想想“exit”（出口）和“export”（出口）。","hint":"“exit”是走出去，“export”是把货物运出去。","takeaway":"前缀“ex-”通常表示“向外”或“离开”。"},{"question":"“patriot”是爱国者，“patria”在拉丁语中是“祖国”的意思。把“ex-”（离开）和“patria”（祖国）结合起来，你觉得“expatriate”是什么意思？","hint":"字面意思就是“离开祖国”。","takeaway":"通过构词法分析，可以推断出“expatriate”的含义是“离开祖国的人”。"}]}]}},{"number":"24","item_type":"reading","context_note":"Passage about Guangdong food","stem":"Which of the following is TRUE?","options":{"A":"Most of the people in Guangzhou are interviewed.","B":"Poon choi can be bought from hotels and even online.","C":"Most of the people in Guangdong supposed that dim sum and dumplings are suitable for the occasion.","D":"Hakka stuffed tofu is a symbol of good wishes with fresh taste."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节真伪判断题，需要将每个选项与原文信息进行仔细比对。\n\n*   **A 选项**：原文说采访了广东的本地人（“locals across Guangdong”），但未提及具体数量，而选项A错在使用了“Most”（大多数），与原文不符。所以A是错误的。\n*   **B 选项**：原文在介绍盆菜时明确提到“The dish can be widely bought from hotels, restaurants and even online.”。选项B的内容与原文信息完全相符。所以B是正确的。\n*   **C 选项**：虽然原文第一句提到“Most of the people of Guangdong thought that...”，与选项C表面意思相近，但该句位于介绍性段落，是作为背景信息引入。相比之下，B选项是文章主体部分陈述的一个明确事实，是更优、更准确的答案。因此C不是最佳选项。\n*   **D 选项**：原文只提到客家酿豆腐的味道鲜嫩（“a tender and fresh taste”），并未提及它是“美好祝愿的象征”（a symbol of good wishes）。原文中象征好运的是煎堆（Jiandui）和生菜粥（Lettuce porridge）。所以D是错误的。","knowledge_expansion_md":"### 攻克“细节真伪判断题” (TRUE/FALSE/NOT GIVEN)\n\n这类题目要求考生判断选项陈述是否与原文信息相符，是阅读理解的重中之重，也是拉开分数差距的关键题型。解题时要格外注意以下几点：\n\n1.  **关键词定位**：根据选项中的名词、数字、专有名词等关键词，快速返回原文找到相关句子。\n2.  **精细比对**：将选项与原文进行逐字逐句的比对，特别注意以下“陷阱词”：\n    *   **范围词**：`all`, `most`, `many`, `some`, `few`, `none`\n    *   **频率词**：`always`, `often`, `usually`, `sometimes`, `never`\n    *   **情态动词**：`must`, `can`, `may`, `should`\n    *   **比较级/最高级**：`more...than`, `the most...`\n    出题人常常通过偷换这些词语来改变原意，制造干扰项。\n3.  **区分“错误”与“未提及”**：\n    *   **错误 (False)**：选项与原文信息直接矛盾。\n    *   **未提及 (Not Given)**：原文没有提供足够信息来判断选项的真伪。\n    在选择题中，通常只需要判断“正确”与“错误”。\n4.  **选择最佳答案**：有时一个选项可能“部分正确”或“看似正确”，但另一个选项却是对原文信息的直接、准确的复述。在这种情况下，应选择最准确、信息匹配度最高的那个选项。","socratic_tracks":[{"title":"核对事实信息（选项B）","steps":[{"question":"请在文章中找到关于“盆菜（Poon choi）”购买方式的描述。","hint":"在介绍 Poon Choi 的段落里，寻找类似“buy”或“order”的词。","takeaway":"原文第二段提到“The dish can be widely bought from hotels, restaurants and even online.”"},{"question":"现在，对比原文的描述和选项B“Poon choi can be bought from hotels and even online.”，它们的意思是否一致？","hint":"逐字对比原文和选项。","takeaway":"选项B是对原文信息的准确复述，因此是正确的。"}]},{"title":"排除错误选项（选项A, C, D）","steps":[{"question":"我们来看选项A。原文有说“大多数”人都被采访了吗？","hint":"原文说的是“Newsgit interviewed both expats and locals...”，这能等同于“Most of the people”吗？","takeaway":"原文没有提及采访数量，选项A中的“Most”属于无中生有，因此错误。"},{"question":"我们来看选项D。原文有说客家酿豆腐象征“good wishes”吗？","hint":"在介绍 Hakka stuffed tofu 的段落里找找看有没有“wish”, “luck”, “fortune”等词。","takeaway":"原文没有提到客家酿豆腐有象征意义，选项D张冠李戴，将其他食物的寓意安在了它身上，因此错误。"},{"question":"最后看选项C。它看起来和原文第一句话很像，为什么它不是最佳答案？","hint":"在单选题中，当一个选项是明确的事实陈述（B选项），另一个是背景介绍或可能被反驳的观点（C选项）时，我们通常选择更可靠的事实陈述。","takeaway":"B选项是文章主体部分介绍的一个具体事实，而C选项是引言中的背景信息。在有直接事实可选的情况下，B是更优答案。"}]}]}},{"number":"25","item_type":"reading","context_note":"Passage about Guangdong food","stem":"Which dish will you cook if you want your friends to be wealthy and lucky?","options":{"A":"Poon choi and Jiandui.","B":"Lettuce porridge and Hakka stuffed tofu.","C":"Jiandui and Lettuce porridge.","D":"All of the above."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节理解题。题目要求找出寓意“富有(wealthy)”和“幸运(lucky)”的菜肴。\n\n根据原文信息：\n- **Jiandui (煎堆)**: 文中描述其寓意为 “blessed with fortune and luck”（财富和幸运）。\n- **Lettuce porridge (生菜粥)**: 文中描述其寓意为 “luck and wealth”（好运和财富）。\n- **Poon choi (盆菜)** 和 **Hakka stuffed tofu (客家酿豆腐)**: 文中未提及这两种食物有财富或幸运的寓意。\n\n选项 C “Jiandui and Lettuce porridge” 中的两种食物均符合题干要求。选项 A 和 B 都包含了一种文中未提及相关寓意的食物，因此不选。故正确答案为 C。","knowledge_expansion_md":"### 1. 阅读技巧：关键词定位 (Keyword Scanning)\n在做阅读理解题时，首先要从问题中提取关键词，如本题的 “wealthy” 和 “lucky”。然后带着这些关键词快速在文章中扫读（scan），找到包含这些词或其同义词、近义词的句子，从而精确定位答案信息，提高解题效率和准确性。\n\n### 2. 文化背景：中式菜肴的象征意义 (Symbolic Meanings of Chinese Dishes)\n英语阅读中常出现跨文化交流的内容。了解一些中国传统文化知识，特别是食物的谐音梗和象征意义，对理解文章大有裨益。例如：\n- **鱼 (fish)**: 象征“年年有余 (surplus year after year)”。\n- **苹果 (apple)**: 象征“平平安安 (safety and peace)”。\n- **面条 (noodles)**: 象征“长寿 (longevity)”。\n在阅读中遇到此类内容时，即使不认识具体菜名，也可以通过其后的英文解释来理解其文化内涵。\n\n### 3. 逻辑推理：排除法 (Process of Elimination)\n当不确定正确答案时，排除法是非常有效的策略。通过分析每个选项，找出其不符合题干要求的地方，逐一排除。本题中，题干要求满足“富有”和“幸运”两个条件，可以依次检验每个选项是否同时满足，从而排除 A 和 C，最终锁定正确答案。","socratic_tracks":[{"title":"关键词定位与信息匹配","steps":[{"question":"要回答这个问题，我们首先应该在问题中找到哪两个核心要求？","hint":"问题问的是希望朋友怎么样。","takeaway":"问题要求找到能带来 'wealthy' (富有) 和 'lucky' (幸运) 的菜肴。"},{"question":"现在，我们来检查文章中 'Jiandui' 的描述。它是否满足这两个要求？","hint":"找到 'Jiandui' 这一段，关注描述美好祝愿的句子。","takeaway":"满足。文章说 'Jiandui' 带有 'fortune and luck' (财富和幸运) 的祝愿。"},{"question":"接下来检查 'Lettuce porridge'。它的寓意是什么？是否满足要求？","hint":"找到 'Lettuce porridge' 这一段，关注 'implies' 后面的词。","takeaway":"满足。文章说它寓意着 'luck and wealth' (好运和财富)。"},{"question":"最后，'Poon choi' 和 'Hakka stuffed tofu' 在文中有没有提到相关的寓意？","hint":"仔细阅读这两部分的描述，看是否提到了 'wealth', 'fortune' 或 'luck'。","takeaway":"没有。文章没有提到这两种食物有财富或幸运的寓意。"},{"question":"根据以上分析，哪个选项中的两种食物都符合题意？","hint":"逐一检查选项 A, B, C。","takeaway":"选项 C 'Jiandui and Lettuce porridge' 中的两种食物都明确符合题意，是最佳答案。"}]},{"title":"排除法应用","steps":[{"question":"我们先看选项 A 'Poon choi and Jiandui'。根据文章，这个组合有什么问题？","hint":"组合里的每一种食物都必须符合题意吗？","takeaway":"Poon choi 在文中没有财富或幸运的寓意，所以这个选项不完全符合要求，可以排除。"},{"question":"同样地，选项 B 'Lettuce porridge and Hakka stuffed tofu' 有什么问题？","hint":"Hakka stuffed tofu 在文中的描述是什么？","takeaway":"Hakka stuffed tofu 在文中也没有财富或幸运的寓意，所以这个选项也可以排除。"},{"question":"既然选项 A 和 B 都被排除了，那么选项 D 'All of the above' 还会是正确答案吗？","hint":"“以上所有”选项成立的前提是什么？","takeaway":"如果 A 或 B 是错的，“以上所有”就不可能正确。因此 D 也可以排除，最终只剩下 C。"}]}]}}]},{"section_title":"IV. 语法填空","section_instruction":"(共5小题；每小题1分，共5分)\n根据短文内容, 从短文后的选项中选出能填入空白处的最佳选项, 使短文意思通顺、结构完整。\n\nThe weather in Australia is not the same as ours, because the seasons are opposite. __26__ Australia is a southern country. __27__ June, July and August are the winter months; September, October and November are spring, the summer is in December, January and February and March, April and May are the autumn months.\nA very large part of the country has no rain at all. The east coast has rain all the year round. __28__ The southeast winds blow all the year round. They bring rain from the sea. __29__ The southeast part of Australia has summer rain from the southeast wind. __30__","items":[{"number":"26","item_type":"grammar_fill","context_note":"Sentence cloze passage","stem":"The weather in Australia is not the same as ours, because the seasons are opposite. __26__","options":{"A":"When it is winter in China, it is summer there.","B":"There are no dry months there.","C":"They only blow here in summer.","D":"There is not much rain on the west side.","E":"It is in the south of the world."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道七选五的句子填空题，考查对上下文逻辑关系的理解。\n\n空格前的句子是：“The weather in Australia is not the same as ours, because the seasons are opposite.”（澳大利亚的天气和我们的不一样，因为季节是相反的。）\n这句话明确提出了一个核心观点：“季节相反”。\n\n我们需要在选项中找到一个能够具体解释或举例说明“季节相反”的句子。\n选项 A：“When it is winter in China, it is summer there.”（当中国是冬天时，那里是夏天。）这句话用一个具体的例子完美地诠释了什么是“季节相反”。\n其他选项分别讨论了降雨、风或地理位置，与前文的“季节相反”没有直接的解释关系。\n因此，选项 A 是最佳答案。","knowledge_expansion_md":"### 1. 篇章逻辑：总分结构 (General-to-Specific Structure)\n这篇文章的写作结构遵循了“总-分”模式。前一句提出一个总的观点（“seasons are opposite”），后面紧跟的句子需要对这个观点进行具体的解释、举例或阐述。选项 A 正是这样一个具体的例子。在做此类题目时，要学会识别句子之间的逻辑关系，是总分、因果、转折还是并列。\n\n### 2. 衔接词：显性与隐性 (Explicit and Implicit Cohesion)\n优秀的语篇中，句子间的衔接非常自然。有时会用明显的衔接词（如 for example, in other words, however），有时则是通过内容上的逻辑关系实现“隐性”衔接。本题就是隐性衔接的例子，虽然没有 “for example”，但选项 A 的内容在功能上起到了举例说明的作用。\n\n### 3. 背景知识：南北半球的季节差异\n了解一些基本的地理常识对英语学习很有帮助。地球的自转轴是倾斜的，导致太阳直射点在南北回归线之间移动。因此，位于北半球的中国和位于南半球的澳大利亚季节正好相反。这个背景知识可以帮助你快速验证选项 A 的正确性。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"空格前面的一句话 “...the seasons are opposite” 告诉了我们什么核心信息？","hint":"请翻译这句话，并找出最重要的两个词。","takeaway":"这句话的核心信息是“季节相反”。"},{"question":"既然前文提到了“季节相反”，那么紧接着的句子最可能应该写什么内容？","hint":"是应该开始一个新话题，还是对“季节相反”做进一步说明？","takeaway":"最合乎逻辑的是，接下来的句子应该解释或举例说明“季节相反”具体是什么意思。"},{"question":"现在看所有选项，哪一个选项是“季节相反”这个概念的最好例子？","hint":"找一个句子，它同时提到了中国和澳大利亚的季节，并且这两个季节是相反的。","takeaway":"选项 A “当中国是冬天时，那里是夏天” 完美地举例说明了季节相反。"}]},{"title":"排除干扰项","steps":[{"question":"我们来看看选项 E “It is in the south of the world.”。它谈论的是什么话题？和“季节相反”是直接的解释关系吗？","hint":"选项 E 谈论的是地理位置。地理位置是季节相反的原因，但不是对季节相反本身的解释。","takeaway":"选项 E 描述的是原因，而非对现象的直接阐释，因此不如 A 贴切。"},{"question":"再看选项 B 和 D，它们都提到了“rain”（雨）。这和“季节相反”有直接关系吗？","hint":"“季节”包含温度、降水等多种因素，但“季节相反”主要强调的是冷暖周期的对立。","takeaway":"选项 B 和 D 讨论的是降雨模式，偏离了“季节相反”这个核心话题，因此不合适。"}]},{"title":"篇章结构","steps":[{"question":"如果一篇文章先说“我喜欢运动”，接下来最可能写什么？是“我喜欢蓝色”，还是“比如，我每周都去跑步”？","hint":"通常，我们会先提出一个观点，然后用具体的例子来支撑它。","takeaway":"提出观点后，用具体例子来支撑是一种常见的写作手法，即“总-分”结构。"},{"question":"将这个规律应用到题目中。“the seasons are opposite” 是观点还是例子？","hint":"这是一个概括性的陈述。","takeaway":"“季节相反”是一个总的观点。"},{"question":"那么，空格处应该填入一个什么角色的句子？","hint":"根据“总-分”结构，总述观点之后应该是什么？","takeaway":"空格处需要一个具体的例子或解释来支撑前文的观点，所以选项 A 是最佳选择。"}]}]}},{"number":"27","item_type":"grammar_fill","context_note":"Sentence cloze passage","stem":"Australia is a southern country. __27__","options":{"A":"When it is winter in China, it is summer there.","B":"There are no dry months there.","C":"They only blow here in summer.","D":"There is not much rain on the west side.","E":"It is in the south of the world."},"answer_area_hint":"","teaching":{"correct_answer":"E","explanation_md":"这是一道七选五的句子填空题，考查对上下文逻辑关系的理解。\n\n空格前的句子是：“Australia is a southern country.”（澳大利亚是一个南方的国家。）\n这句话非常直接地指出了澳大利亚的地理位置属性。\n\n我们需要在选项中寻找一个与“南方的国家”这个信息紧密相关的句子。\n选项 E：“It is in the south of the world.”（它位于世界的南部。）这句话是对前一句“a southern country”的同义转述和确认，起到了强调和补充说明的作用。两句话意思几乎完全一样，衔接最为紧密和自然。\n\n选项 A 谈论季节，是其地理位置带来的结果，而不是对位置本身的描述。\n其他选项谈论天气，与前文的衔接不够直接。\n因此，选项 E 是最佳答案。","knowledge_expansion_md":"### 1. 篇章逻辑：同义复述与强调 (Paraphrasing and Emphasis)\n在写作中，为了强调某个重要信息，作者有时会用不同的词语或句子结构重复同一个意思，这种手法叫“同义复述”或“释义”。本题中，“It is in the south of the world” 就是对 “Australia is a southern country” 的同义复述。识别出这种关系是解题的关键。\n\n### 2. 代词指代 (Pronoun Reference)\n注意选项 E 中的代词 “It”。在语篇中，代词通常指代上文中提到的人或物。这里的 “It” 明确指代前一句的主语 “Australia”，使得两个句子在语法和逻辑上紧密相连。做题时，判断选项中的代词能否在上文中找到清晰的指代对象，是判断其是否合适的有效方法。\n\n### 3. 逻辑关系辨析：陈述 vs. 推论\n要区分“对事实的陈述/解释”和“基于事实的推论”。\n- **陈述/解释**：选项 E 是对“澳大利亚是南方国家”这一事实的直接解释。\n- **推论**：选项 A（季节相反）是“澳大利亚在南半球”这一事实所导致的*结果*或*推论*。\n在句子填空中，直接的陈述和解释通常比推论更适合紧跟在事实陈述之后，因为它的逻辑跳跃更小。","socratic_tracks":[{"title":"识别句子核心","steps":[{"question":"请看空格前的句子 “Australia is a southern country.”。这句话的核心话题是什么？是天气、季节还是地理位置？","hint":"“southern country” 是“南方的国家”的意思。","takeaway":"这句话的核心话题是澳大利亚的“地理位置”。"},{"question":"既然核心话题是地理位置，那么紧跟其后的句子最可能继续谈论什么？","hint":"是应该马上转换话题，还是对这个话题做一些补充？","takeaway":"最自然的衔接是继续围绕“地理位置”这一话题进行描述或解释。"},{"question":"浏览所有选项，哪一个选项的内容是关于“地理位置”的？","hint":"找一个包含方位词（如 south, north, east, west）并且描述位置的句子。","takeaway":"选项 E “It is in the south of the world” 直接谈论地理位置，与前文话题一致。"}]},{"title":"同义转述","steps":[{"question":"比较一下 “a southern country”（一个南方的国家）和 “in the south of the world”（在世界的南部）这两个短语，它们的意思是不是很相似？","hint":"它们都在描述同一个地理方位。","takeaway":"这两个短语的意思基本相同，只是表达方式不同。"},{"question":"在写作中，作者为什么会有时用不同的话说同一个意思？","hint":"想一想老师讲课时，有时会把一个重点用不同方式重复讲一遍。","takeaway":"作者通过同义转述来强调、澄清或加深读者对某个重要信息的印象。"},{"question":"所以，选项 E 和前一句话之间是什么关系？","hint":"是因果关系、转折关系，还是解释强调关系？","takeaway":"它们是同义复述的解释和强调关系，因此逻辑衔接非常紧密。"}]},{"title":"区分原因与结果","steps":[{"question":"我们来思考一下选项 A “When it is winter in China, it is summer there.”。澳大利亚季节与我们相反，这是由什么原因造成的？","hint":"想一想地球的南北半球。","takeaway":"季节相反的原因，正是因为它是一个南半球（southern）的国家。"},{"question":"那么，“Australia is a southern country”是原因，而“seasons are opposite”（选项A的内容）是结果。对吗？","hint":"是的，一个是地理事实，另一个是由此产生的气候现象。","takeaway":"前一句是原因，选项 A 是结果。"},{"question":"在文章叙述中，是先解释清楚“原因”本身，还是直接跳到“结果”更自然？","hint":"通常，我们会先对一个事实进行充分说明，再引出其后果。","takeaway":"先用选项 E 解释清楚地理位置，再在后文引出季节相反的结果，是更流畅的行文逻辑。"}]}]}},{"number":"28","item_type":"grammar_fill","context_note":"Sentence cloze passage","stem":"The east coast has rain all the year round. __28__","options":{"A":"When it is winter in China, it is summer there.","B":"There are no dry months there.","C":"They only blow here in summer.","D":"There is not much rain on the west side.","E":"It is in the sou
