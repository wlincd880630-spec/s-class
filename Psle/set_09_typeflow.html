  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第09套","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟","type_card_order":"paper_sections"},"sections":[{"section_title":"I. 单项选择","section_instruction":"从 A, B, C 三个选项中选择正确的答案。（共 20 分）","items":[{"number":"1","item_type":"choice","context_note":"","stem":"The basketball player _____ up early in the morning every day.","options":{"A":"get","B":"gets","C":"got","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查一般现在时中第三人称单数的主谓一致问题。\n1.  句子中的时间状语 “every day”（每天）表明这是一个经常性、习惯性的动作，因此应使用一般现在时。\n2.  句子的主语 “The basketball player”（这位篮球运动员）是第三人称单数形式。\n3.  在一般现在时中，当主语是第三人称单数时，谓语动词需要使用第三人称单数形式（即动词后加-s或-es）。\n4.  动词 “get” 的第三人称单数形式是 “gets”。\n5.  因此，正确答案是 B。","knowledge_expansion_md":"### 知识点拓展：一般现在时与主谓一致\n\n**1. 一般现在时的用法：**\n*   表示经常性、习惯性的动作或状态，常与 `every day`, `often`, `usually`, `always`, `sometimes` 等频率副词连用。\n*   表示客观事实、普遍真理，如：`The earth goes around the sun.`\n*   表示人的性格、能力或状态，如：`She speaks good English.`\n\n**2. 动词第三人称单数（三单）变化规则：**\n*   **一般情况**：在动词词尾直接加 `-s`。如：`work` -> `works`, `play` -> `plays`。\n*   **以 s, x, ch, sh, o 结尾**：在词尾加 `-es`。如：`guess` -> `guesses`, `fix` -> `fixes`, `watch` -> `watches`, `wash` -> `washes`, `go` -> `goes`。\n*   **以“辅音字母 + y”结尾**：变 `y` 为 `i`，再加 `-es`。如：`study` -> `studies`, `cry` -> `cries`。\n*   **特殊变化**：`have` -> `has`。\n\n**3. 易错点：**\n*   **忘记变化**：在主语是第三人称单数时，忘记给动词加上 `-s` 或 `-es`。\n*   **判断错误**：没能正确判断主语是单数还是复数，特别是当主语是一个较长的名词短语时。例如：`A friend of my brothers` 的中心词是 `A friend`，是单数。","socratic_tracks":[{"title":"判断时态","steps":[{"question":"句子中的 “every day” 是什么意思？它告诉我们这个动作是什么时候发生的？","hint":"“every day” 的中文意思是“每一天”。","takeaway":"“every day” 表示这是一个习惯性的、每天都发生的动作。"},{"question":"对于描述一个人的习惯或每天都做的事情，我们应该使用英语中的哪种时态？","hint":"是表示过去的、现在的、还是经常发生的？","takeaway":"描述习惯性动作应使用一般现在时。"}]},{"title":"确定主语人称和数","steps":[{"question":"这个句子的主语（做动作的人）是谁？","hint":"是谁每天都早起？","takeaway":"主语是 “The basketball player”（这位篮球运动员）。"},{"question":"“The basketball player” 是指一个人还是多个人？是第几人称？","hint":"想一想，它可以用 “he” 或 “she” 来代替吗？","takeaway":"“The basketball player” 是指一个人，属于第三人称单数。"}]},{"title":"应用主谓一致规则","steps":[{"question":"当一般现在时的句子主语是第三人称单数时，它后面的动词应该有什么变化？","hint":"回想一下 “He play basketball.” 这句话对吗？应该怎么改？","takeaway":"当主语是第三人称单数时，一般现在时的动词需要变为第三人称单数形式，通常是加-s或-es。"},{"question":"那么，动词 “get” 的第三人称单数形式是什么？","hint":"是 “get”, “gets” 还是 “got”？","takeaway":"“get” 的第三人称单数形式是 “gets”。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"I _____ a book. It's Learn Chinese in Four Weeks.","options":{"A":"looking for","B":"found","C":"looked","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在具体语境中选择正确的动词形式。\n1.  句子分为两部分。后半句 “It's Learn Chinese in Four Weeks.” 明确说出了书的名字。\n2.  这表明说话人已经拿到了这本书，并且能够看到它的标题。\n3.  因此，前半句描述的应该是一个已经完成的动作——“找到了”一本书。\n4.  选项 A “looking for” 意为“正在寻找”，表示动作仍在进行，与后文语境矛盾。\n5.  选项 C “looked” 意为“看”，是不及物动词，不能直接跟宾语 “a book”，应为 “looked at a book”。\n6.  选项 B “found” 是动词 “find”（找到）的过去式，表示“找到了”，完美符合语境。","knowledge_expansion_md":"### 知识点拓展：动词词义与时态语境\n\n**1. 词义辨析：`find`, `look for`, `look at`**\n*   `find`: 动词，意为“找到，发现”。它强调的是“找到”这个**结果**。过去式是 `found`。例：`I finally found my keys.` (我终于找到我的钥匙了。)\n*   `look for`: 动词短语，意为“寻找”。它强调的是“寻找”这个**过程**，不一定有结果。例：`What are you looking for?` (你在找什么？)\n*   `look at`: 动词短语，意为“看...”。它强调的是“看”这个动作。例：`Look at the blackboard.` (看黑板。)\n\n**2. 上下文推断**\n在做单项选择时，尤其是动词相关的题目，不能孤立地看空格，必须结合整个句子甚至前后句的语境来判断。后一句话往往是解开前一句话谜题的关键。本题中，后一句 “It's...” 就是一个强烈的信号，表明“书”这个物品已经被确定和识别了。\n\n**3. 语法结构**\n*   `looking for` 是现在分词，不能单独作谓语，必须与 `be` 动词连用构成进行时态（如 `am looking for`）。\n*   `look` 是不及物动词，后面不能直接跟名词宾语，需要借助介词（如 `at`, `for`, `after`）。\n*   `find` 是及物动词，可以直接跟名词宾语（如 `found a book`）。","socratic_tracks":[{"title":"理解上下文","steps":[{"question":"请看第二句话：“It's Learn Chinese in Four Weeks.” 这句话告诉了我们什么信息？","hint":"这句话是在描述这本书，还是在寻找这本书？","takeaway":"第二句话点明了书名，说明这本书已经被找到了。"},{"question":"既然书已经被找到了，那么第一句话中“我”对书做的动作，应该是“正在找”还是“找到了”？","hint":"是一个持续的过程，还是一个已经完成的结果？","takeaway":"这个动作应该是一个已经完成并有了结果的动作，即“找到了”。"}]},{"title":"动词词义辨析","steps":[{"question":"选项 A “looking for” 是什么意思？它表示动作正在进行还是已经完成？","hint":"带有 -ing 的形式通常表示什么？","takeaway":"“looking for” 意为“正在寻找”，表示一个持续的动作过程。"},{"question":"选项 B “found” 是什么意思？它是哪个词的过去式？","hint":"它的原形是 f-i-n-d。","takeaway":"“found” 是 “find” 的过去式，意为“找到了”，表示一个动作的结果。"},{"question":"结合上下文，是“正在寻找”一本书更合理，还是“找到了”一本书更合理？","hint":"别忘了，你已经知道书名了。","takeaway":"“找到了”一本书更符合逻辑，所以 “found” 是最佳选择。"}]},{"title":"检查语法结构","steps":[{"question":"如果选 A，句子变成 “I looking for a book.”，从语法上看，这个句子完整吗？缺少了什么？","hint":"想想“我正在打篮球”怎么说？I ___ playing basketball.","takeaway":"现在分词 “looking for” 不能单独作谓语，前面缺少了be动词 “am”。"},{"question":"如果选 C，句子变成 “I looked a book.”，这个句子通顺吗？“look” 后面可以直接加 “a book” 吗？","hint":"我们是说 “look the TV” 还是 “look at the TV”？","takeaway":"“look” 是不及物动词，后面不能直接跟宾语，需要加介词，如 “look at”。"},{"question":"那么选项 B “found” 呢？“I found a book.” 这个句子语法正确吗？","hint":"“find” 是及物动词，可以直接跟宾语。","takeaway":"“I found a book” 语法正确，意思通顺，是正确的句子结构。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"These _____ are pretty.","options":{"A":"duck","B":"shoes","C":"apple","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查指示代词与名词单复数的一致性。\n1.  句首的指示代词 “These” 意为“这些”，专门用来修饰或指代复数的人或物。\n2.  句中的系动词 “are” 是 “be” 动词的复数形式，也要求主语是复数。\n3.  因此，横线上必须填入一个复数形式的名词。\n4.  我们来分析选项：\n    *   A: `duck` (鸭子) 是单数名词。\n    *   B: `shoes` (鞋子) 是复数名词。\n    *   C: `apple` (苹果) 是单数名词。\n5.  只有 “shoes” 是复数名词，能够与 “These” 和 “are” 搭配。","knowledge_expansion_md":"### 知识点拓展：指示代词与主谓一致\n\n**1. 指示代词的用法**\n指示代词用来指明或标识特定的人或物，它们在“数”（单数/复数）和“距离”（近/远）上有区别：\n\n| | 单数 (Singular) | 复数 (Plural) |\n| :--- | :--- | :--- |\n| **指近处** | `this` (这个) | `these` (这些) |\n| **指远处** | `that` (那个) | `those` (那些) |\n\n*   `This` 和 `that` 修饰单数名词，如：`this book`, `that car`。\n*   `These` 和 `those` 修饰复数名词，如：`these books`, `those cars`。\n\n**2. 主谓一致**\n英语句子的基本原则之一是主语和谓语动词在“数”上必须保持一致。即：\n*   单数主语 + 单数动词 (e.g., `is`, `was`, `has`, `does`, `verb-s`)\n*   复数主语 + 复数动词 (e.g., `are`, `were`, `have`, `do`, `verb`)\n\n在本题中，主语是 `These _____`，由于 `These` 是复数，整个主语必然是复数，因此谓语动词使用 `are`。\n\n**3. 名词复数**\n务必熟记常见名词的复数形式，包括规则变化（加-s/es）和不规则变化（如 `child` -> `children`）。","socratic_tracks":[{"title":"分析指示代词","steps":[{"question":"句子开头的单词 “These” 是什么意思？它通常和什么样的名词搭配？","hint":"想一想 “This is an apple” 和 “These are apples” 的区别。","takeaway":"“These” 意为“这些”，后面必须跟复数名词。"},{"question":"根据这个规则，我们应该在横线上填一个单数名词还是复数名词？","hint":"“These” 对应单数还是复数？","takeaway":"横线上必须填一个复数名词。"}]},{"title":"检查名词单复数","steps":[{"question":"我们来逐个看选项。选项 A “duck” 是单数还是复数？","hint":"一只鸭子是 a duck。","takeaway":"“duck” 是单数名词。"},{"question":"选项 C “apple” 是单数还是复数？","hint":"一个苹果是 an apple。","takeaway":"“apple” 是单数名词。"},{"question":"选项 B “shoes” 是单数还是复数？","hint":"一双鞋是 a pair of shoes，一只鞋是 a shoe。","takeaway":"“shoes” 是复数名词。"},{"question":"那么，这三个选项中，哪一个符合我们之前得出的“必须是复数名词”的结论？","hint":"哪个词是复数？","takeaway":"只有 “shoes” 是复数名词，所以它是正确答案。"}]},{"title":"观察谓语动词","steps":[{"question":"句子中的动词 “are” 是be动词的单数形式还是复数形式？","hint":"我们说 “He is” 还是 “He are”？说 “They is” 还是 “They are”？","takeaway":"“are” 是be动词的复数形式。"},{"question":"英语句子中，主语和动词的“数”需要保持一致。既然动词是复数 “are”，那么句子的主语（These _____）应该是单数还是复数？","hint":"复数动词配什么主语？","takeaway":"主语也必须是复数形式。"},{"question":"哪个选项填入后能使主语 “These _____” 成为一个复数主语？","hint":"“These duck”, “These shoes”, “These apple”，哪个组合是正确的复数短语？","takeaway":"只有 “These shoes” 是正确的复数短语，与谓语 “are” 匹配。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"I am 50 kilograms. My brother is 55 kilograms. He is _____ than me.","options":{"A":"5 kg heavier","B":"5 kg thinner","C":"heavier 5 kg","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查形容词比较级的用法和基本数学逻辑。\n1.  首先，根据题意进行比较：我的体重是 50 公斤，哥哥的体重是 55 公斤。\n2.  通过比较数字可知，55 > 50，所以哥哥比我“重”。\n3.  “重”的英文是 `heavy`，其比较级是 `heavier`。“瘦”的英文是 `thin`，其比较级是 `thinner`。因此，我们应该选择含有 `heavier` 的选项。\n4.  接着，计算具体的重量差：55 - 50 = 5 公斤。\n5.  在英语比较级句型中，表示具体差异的数值（如 `5 kg`）通常放在形容词比较级的前面。\n6.  所以，“比我重 5 公斤”的正确表达就是 `5 kg heavier than me`。","knowledge_expansion_md":"### 知识点拓展：形容词比较级\n\n**1. 比较级的构成**\n*   **规则变化**：\n    *   单音节词和少数双音节词：词尾加 `-er` (e.g., `tall` -> `taller`, `long` -> `longer`)。\n    *   以 `e` 结尾的词：直接加 `-r` (e.g., `nice` -> `nicer`)。\n    *   重读闭音节词，末尾只有一个辅音字母：双写该辅音字母再加 `-er` (e.g., `big` -> `bigger`, `thin` -> `thinner`)。\n    *   以“辅音字母+y”结尾的双音节词：变 `y` 为 `i` 再加 `-er` (e.g., `heavy` -> `heavier`, `easy` -> `easier`)。\n*   **不规则变化**：\n    *   `good` -> `better`\n    *   `bad` -> `worse`\n    *   `many/much` -> `more`\n    *   `little` -> `less`\n    *   `far` -> `farther/further`\n\n**2. 比较级的基本句型**\n`A + be动词/行为动词 + 形容词比较级 + than + B.`\n*   例：`He is taller than his sister.` (他比他妹妹高。)\n*   例：`She runs faster than me.` (她比我跑得快。)\n\n**3. 表示具体差异的表达**\n当需要明确指出两者相差的具体数值时，将该数值放在形容词比较级的前面。\n`数值 + 单位 + 形容词比较级`\n*   `My sister is two years younger than me.` (我妹妹比我小两岁。)\n*   `This road is 10 kilometers longer than that one.` (这条路比那条路长10公里。)","socratic_tracks":[{"title":"数学与逻辑判断","steps":[{"question":"题目中，“我”的体重是多少公斤？哥哥的体重是多少公斤？","hint":"仔细阅读题目中的数字信息。","takeaway":"“我”是 50 公斤，哥哥是 55 公斤。"},{"question":"那么，谁更重一些？是“我”还是“哥哥”？","hint":"比较 50 和 55 的大小。","takeaway":"哥哥比我更重。"},{"question":"他们两个的体重具体相差多少公斤？","hint":"用大数减去小数。","takeaway":"体重相差 5 公斤。"}]},{"title":"比较级词义选择","steps":[{"question":"选项 A 中的 “heavier” 是什么意思？它描述的是体重多还是体重少？","hint":"它的原形是 heavy（重的）。","takeaway":"“heavier” 意为“更重”，描述的是体重多。"},{"question":"选项 B 中的 “thinner” 是什么意思？它描述的是体重多还是体重少？","hint":"它的原形是 thin（瘦的）。","takeaway":"“thinner” 意为“更瘦”，描述的是体重少。"},{"question":"根据我们刚才的逻辑判断，哥哥比我“更重”还是“更瘦”？应该选择哪个词？","hint":"哥哥的体重是55公斤，比我的50公斤要多。","takeaway":"哥哥更重，所以应该选择 “heavier”。"}]},{"title":"比较级句型结构","steps":[{"question":"这个句子 “He is _____ than me.” 是一个比较句。我们已经确定要用 “heavier”。如果只说“他比我重”，应该怎么说？","hint":"直接把 “heavier” 填进去。","takeaway":"“He is heavier than me.”"},{"question":"现在我们还知道具体重了“5公斤”(5 kg)。这个表示具体差异的数字应该放在比较级 “heavier” 的前面还是后面？","hint":"参考例句：“他比我高3厘米” -> He is 3 cm taller than me.","takeaway":"表示具体差异的数值应该放在形容词比较级的前面。"},{"question":"所以，“比我重5公斤”的完整表达是什么？","hint":"组合 “5 kg” 和 “heavier”。","takeaway":"完整的表达是 “5 kg heavier”。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"_____ careful!","options":{"A":"Are","B":"Is","C":"Be","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查的是祈使句的用法。祈使句用于发出命令、请求、建议或警告，其句子结构通常以动词原形开头。题干中，“careful”是一个形容词，意为“小心的”，不能直接作谓语动词。因此，需要在其前面加上be动词的原形“be”，构成“be + 形容词”的结构，以表达一种指令性的状态要求。所以，“Be careful!”意为“小心！”，是正确的祈使句表达。","knowledge_expansion_md":"**祈使句 (Imperative Sentence) 详解**\n\n1.  **定义**：用于表达命令、请求、劝告、警告、禁止等的句子。\n2.  **构成**：\n    *   **肯定结构**：通常以动词原形开头，主语 `you` 被省略。\n        *   `Stand up!` (起立！)\n        *   当谓语是形容词、名词或介词短语时，需用 `be` 动词原形。例如：`Be quiet!` (保持安静！), `Be a good boy.` (做个好男孩。)\n    *   **否定结构**：在动词原形前加 `Don't` (do not)。\n        *   `Don't talk!` (别说话！)\n        *   `Don't be late.` (别迟到。)\n3.  **委婉语气**：为了使语气更委婉、礼貌，常在句首或句末加上 `please`。\n    *   `Please sit down.` / `Sit down, please.` (请坐。)","socratic_tracks":[{"title":"句子类型判断","steps":[{"question":"这个句子 “_____ careful!” 是在陈述一个事实，还是在向某人发出一个指令或提醒？","hint":"想一想，说这句话的人希望听到的人做什么。","takeaway":"这是一个表示提醒或命令的句子，我们称之为祈使句。"},{"question":"祈使句在结构上有什么特点？它的开头通常是什么？","hint":"回忆一下“起立(Stand up)”、“坐下(Sit down)”这些指令。","takeaway":"祈使句通常以动词的原形开头。"}]},{"title":"词性与句子成分","steps":[{"question":"单词 “careful” (小心的) 是一个动作（动词）还是描述一种状态（形容词）？","hint":"我们能“做”一个“careful”吗？还是我们“是”careful的？","takeaway":"“careful”是形容词，不能独立充当句子的谓语。"},{"question":"既然形容词不能直接做谓语，我们需要在它前面加一个什么动词来连接主语和形容词？","hint":"在“I am happy”中，连接“I”和“happy”的是哪个词？","takeaway":"我们需要使用be动词来搭配形容词作谓语。"},{"question":"结合前两步的结论：这是一个祈使句，需要用动词原形开头；同时需要一个be动词来搭配形容词。那么，be动词的原形是什么？","hint":"am, is, are 的“老祖宗”是谁？","takeaway":"be动词的原形是be，因此构成“Be careful!”的正确结构。"}]},{"title":"选项辨析","steps":[{"question":"选项 A “Are” 和 B “Is” 是be动词的什么形式？它们是原形吗？","hint":"“Are”和“Is”通常用在什么时态和人称的句子里？","takeaway":"“Are”和“Is”是be动词的现在时形式，而不是原形。"},{"question":"为什么不能因为祈使句的隐含主语是“you”就选择“Are”呢？","hint":"想一想祈使句的固定规则，它是否会根据主语改变动词形式？","takeaway":"祈使句的规则是“必须以动词原形开头”，这个规则的优先级高于根据主语变化动词形式的一般规则。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"_____ there any pocket money in your bag?","options":{"A":"Is","B":"Are","C":"Were","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查 “There be” 句型的一般疑问句形式以及不可数名词的用法。首先，表示“某处有某物”应该使用 “There be” 句型。其次，该句型中 be 动词的单复数形式遵循“就近原则”，即由其后的名词决定。本题中的名词是 “pocket money”（零花钱），这是一个不可数名词。在语法上，不可数名词应被视为单数。因此，be 动词需要使用单数形式 “is”。将 “is” 提到句首，构成一般疑问句，所以正确答案是 “Is”。","knowledge_expansion_md":"**There be 句型与主谓一致**\n\n1.  **基本结构**：`There be + 名词 + 地点/时间`，表示“某地/某时有某物”。\n2.  **主谓一致原则（就近原则）**：be 动词的形式由离它最近的名词的单复数决定。\n    *   `There is a book on the desk.` (名词 `a book` 是单数)\n    *   `There are some books on the desk.` (名词 `books` 是复数)\n    *   `There is some water in the glass.` (名词 `water` 是不可数名词，按单数处理)\n3.  **特殊情况**：当 `and` 连接两个或多个名词时，be 动词通常与离它最近的那个名词保持一致。\n    *   `There is a pen and two pencils in the box.` (离 `is` 最近的是 `a pen`，单数)\n4.  **常见不可数名词**：`money` (钱), `water` (水), `milk` (牛奶), `bread` (面包), `rice` (米饭), `news` (新闻), `information` (信息), `advice` (建议)。这些词在句子中作主语或决定谓语时，都按单数处理。","socratic_tracks":[{"title":"核心句型识别","steps":[{"question":"这个句子想问“你的包里有零花钱吗？”。这是在问某人“拥有”某物，还是问某地“存在”某物？","hint":"句子的结构是 “_____ there ... in your bag?”","takeaway":"这是典型的“There be”句型，用来询问某处是否“存在”某物。"},{"question":"在“There be”句型中，决定 be 动词用 is 还是 are 的，是句首的 “There” 还是它后面的名词？","hint":"回忆一下“There is a book”和“There are books”的区别。","takeaway":"be动词的形式由其后的名词决定，这叫“就近原则”。"}]},{"title":"名词可数性判断","steps":[{"question":"句子中的关键名词是 “pocket money”。想一想，“money” 这个词是可数名词还是不可数名词？","hint":"我们能说 “one money, two moneys” 吗？但是我们可以说 “one dollar, two dollars”。","takeaway":"“money” 是一个集合概念，是不可数名词。"},{"question":"对于不可数名词，在语法上我们应该把它当作单数处理还是复数处理？","hint":"比如我们会说 “Water is important.” 还是 “Water are important.”？","takeaway":"不可数名词在语法上被视为单数，谓语动词要用单数形式。"}]},{"title":"时态与选项排除","steps":[{"question":"根据我们刚才的分析，“pocket money”是不可数名词，应视为单数。那么在 A(Is) 和 B(Are) 中，应该排除哪一个？","hint":"哪个选项是用于复数的？","takeaway":"“Are”用于复数，与不可数名词不匹配，应排除。"},{"question":"再看选项 C “Were”。它是什么时态？这个问句中有没有表示过去时间的词？","hint":"“Were”是“are”的过去式。句子只是在问“现在”包里有没有钱。","takeaway":"句子没有过去时间的标志，应使用现在时，因此排除过去时态的“Were”。"},{"question":"排除了 B 和 C 之后，剩下的 A “Is” 是否完全符合“There be”句型、不可数名词作单数、现在时态这几个条件？","hint":"Is + there + 不可数名词...?","takeaway":"“Is”是唯一正确的选项，因为它既是单数形式，又是现在时态。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"—Is this the computer room?\n—_____","options":{"A":"No, it is.","B":"Yes, it isn't.","C":"No, it isn't.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查一般疑问句的简略回答。在英语中，对以be动词、助动词或情态动词开头的一般疑问句进行回答时，必须遵循“逻辑一致”的原则。这意味着，如果回答以 “Yes” 开头，后面的短句必须是肯定的；如果以 “No” 开头，后面的短句必须是否定的。选项 A “No, it is.” 和选项 B “Yes, it isn't.” 都存在前后矛盾，是典型的“中式英语”错误。只有选项 C “No, it isn't.”（不，它不是。）在逻辑和语法上都是正确的，做到了前后一致。","knowledge_expansion_md":"**一般疑问句的回答规则与中英思维差异**\n\n1.  **黄金法则**：回答必须前后一致。\n    *   `Yes, 主语代词 + 肯定的助动词/be动词.`\n    *   `No, 主语代词 + 否定的助动词/be动词.`\n2.  **示例**：\n    *   `—Are you a student?` (你是一名学生吗？)\n        `—Yes, I am.` / `No, I'm not.`\n    *   `—Does he like music?` (他喜欢音乐吗？)\n        `—Yes, he does.` / `No, he doesn't.`\n    *   `—Can you fly?` (你会飞吗？)\n        `—Yes, I can.` / `No, I can't.`\n3.  **中英思维差异**：这是学习中的一个重要难点。中文的回答常常是针对提问的事实本身。例如，对于问题“你不是学生吗？”，如果“我不是学生”，中文可以回答“是的，我不是学生”。但在英文中，对 `Aren't you a student?` 的回答，如果“不是学生”，必须回答 `No, I'm not.`。英文的 `Yes/No` 是对动词的肯定或否定，而不是对整个问题内容的判断。务必牢记英文的规则，避免用中文思维去套用。","socratic_tracks":[{"title":"回答的逻辑一致性","steps":[{"question":"在英语中，如果一个回答以 “Yes” 开头，它表达的是肯定还是否定？","hint":"“Yes”的中文意思是什么？","takeaway":"“Yes”表达的是肯定、同意的含义。"},{"question":"那么，在一个以 “Yes” 开头的回答里，后面的小短句（如 it is / it isn't）应该是肯定的还是否定的才能保持逻辑一致？","hint":"“是的，它不是”听起来是不是很奇怪？","takeaway":"“Yes” 后面必须跟肯定形式的短句，如 “Yes, it is.”。"},{"question":"同理，如果一个回答以 “No” 开头，后面的小短句应该是肯定的还是否定的？","hint":"“不，它是”在逻辑上通顺吗？","takeaway":"“No” 后面必须跟否定形式的短句，如 “No, it isn't.”。"}]},{"title":"选项排除法","steps":[{"question":"我们来分析选项 A: “No, it is.”。它的开头 “No” 和结尾 “it is.” 在逻辑上是匹配的还是矛盾的？","hint":"一个是否定，一个是肯定。","takeaway":"选项 A 前后矛盾，是错误的。"},{"question":"再看选项 B: “Yes, it isn't.”。它的开头 “Yes” 和结尾 “it isn't.” 在逻辑上是匹配的还是矛盾的？","hint":"一个是肯定，一个是否定。","takeaway":"选项 B 前后矛盾，也是错误的。"},{"question":"最后看选项 C: “No, it isn't.”。它的开头和结尾在逻辑上是否一致？","hint":"两个都是否定。","takeaway":"选项 C 前后逻辑一致，是正确的简略回答形式。"}]},{"title":"告别中式英语","steps":[{"question":"在中文里，如果有人问：“这不是电脑室吗？”，而实际情况确实不是，我们有时会回答：“是的，（你说的对），它不是。” 对吗？","hint":"思考一下我们日常的中文对话习惯。","takeaway":"中文的“是/不是”有时是回应对方的判断，而非简单地肯定或否定事实。"},{"question":"但在英语里，问题是 “Is this the computer room?”。回答者的 “Yes” 或 “No” 是针对哪个词作出的反应？是针对整个句子，还是只针对动词 “Is”？","hint":"英语的回答更直接，只关心核心动词的肯定或否定。","takeaway":"英语的 Yes/No 是对动词状态的直接回应：事实是 (is)，就用 Yes；事实不是 (is not)，就用 No。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"There _____ some penguins in the sea.","options":{"A":"are","B":"have","C":"is","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查 “There be” 句型的基本用法和主谓一致原则。这个句子意为“海里有一些企鹅”，是在描述某地“存在”某物，因此应使用 “There be” 句型。在该句型中，be 动词的形式（is 或 are）取决于其后名词的单复数。本句中，be 动词后面的名词是 “some penguins”（一些企鹅），这是一个复数名词（由 “some” 和名词复数 “penguins” 可知）。因此，be 动词应使用复数形式 “are”。选项 B “have” 表示“拥有”，不适用于此句型。选项 C “is” 用于单数或不可数名词，与复数名词 “penguins” 不符。","knowledge_expansion_md":"**“There be” 与 “have/has” 的辨析**\n\n这是初学英语时的一个核心易错点，两者都可翻译为“有”，但用法和含义完全不同。\n\n1.  **There be 句型**\n    *   **含义**：表示“存在”，即“某地/某时有某物”。\n    *   **结构**：`There be + 某物/某人 + 某地/某时`。\n    *   **核心**：强调的是“物/人”在某处的“存在状态”。\n    *   **例句**：`There is a tree in front of the house.` (房子前面有一棵树。)\n\n2.  **have/has**\n    *   **含义**：表示“拥有、所有”。\n    *   **结构**：`主语(所有者) + have/has + 宾语(所有物)`。\n    *   **核心**：强调的是“主语”与“宾语”之间的“所属关系”。\n    *   **例句**：`I have a new bike.` (我有一辆新自行车。)\n\n**判断技巧**：问自己一句话，这个“有”是“存在”还是“拥有”？如果是“存在”，用 `There be`；如果是“拥有”，用 `have/has`。","socratic_tracks":[{"title":"句型功能辨析","steps":[{"question":"这个句子“海里有一些企鹅”是想表达“某人拥有企鹅”，还是“某个地方存在企鹅”？","hint":"句子的重点是在描述一个场景。","takeaway":"句子描述的是“存在”关系，而非“拥有”关系。"},{"question":"在英语中，表示“存在”的“有”，我们应该用哪个基本句型？是 “have/has” 还是 “There be”？","hint":"“桌上有一本书”用英语怎么说？","takeaway":"表示“存在”时，应使用 “There be” 句型。"},{"question":"为什么这里不能选 B “have”？","hint":"“have” 的主语通常是谁？“There” 能作 “have” 的主语来表示“存在”吗？","takeaway":"“have” 表示“拥有”，其主语是所有者，而 “There” 只是一个引导词，不能作 “have” 的主语。"}]},{"title":"主谓一致原则","steps":[{"question":"在 “There be” 句型中，我们用 “is” 还是 “are”，是由什么决定的？","hint":"是看句首的 “There” 还是看它后面的名词？","takeaway":"be动词的形式由其后的名词的单复数决定，这叫“就近原则”。"},{"question":"请看本句中 be 动词后面的名词 “some penguins”。它是单数还是复数？","hint":"“penguin” 后面加了 “s”，并且前面有 “some”。","takeaway":"“some penguins” 是一个复数名词短语。"},{"question":"既然名词是复数，那么 be 动词应该用哪种形式？“is” 还是 “are”？","hint":"“is” 用于单数，“are” 用于复数。","takeaway":"对于复数名词，be动词必须使用复数形式 “are”。"}]},{"title":"关键词分析","steps":[{"question":"看到单词 “penguins”，它末尾的 “-s” 告诉我们什么信息？","hint":"英语中名词末尾加 “-s” 或 “-es” 通常表示什么？","takeaway":"名词末尾的 “-s” 是复数形式的标志，表示不止一个。"},{"question":"再看 “penguins” 前面的单词 “some”。“some” 用在这里，是加强了单数的概念还是复数的概念？","hint":"“some” 的意思是“一些”。","takeaway":"“some” 明确表示了数量大于一，进一步确认了名词是复数。"},{"question":"既然我们通过 “some” 和 “penguins” 两个词都确认了主语部分是复数，那么谓语动词的选择是不是就非常确定了？","hint":"复数主语搭配什么形式的be动词？","takeaway":"通过分析关键词的单复数信息，可以准确地锁定谓语动词的形式。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"I'm nine _____ old.","options":{"A":"year","B":"years","C":"month","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词的单复数用法。在英语中，当数字大于1时，其后所修饰的可数名词需要使用复数形式。句子中的 \"nine\" (九) 是一个大于1的数字，而 \"year\" (年) 是一个可数名词。因此，\"year\" 应该使用其复数形式 \"years\"。完整的表达是 \"nine years old\"，意为“九岁”。","knowledge_expansion_md":"### 名词复数规则拓展\n\n1.  **规则变化**：\n    *   大多数名词词尾直接加 `-s`，如 `book` -> `books`。\n    *   以 `s, x, ch, sh` 结尾的名词加 `-es`，如 `box` -> `boxes`。\n    *   以“辅音字母 + y”结尾的名词，变 `y` 为 `i` 再加 `-es`，如 `baby` -> `babies`。\n    *   不规则变化，如 `man` -> `men`, `child` -> `children`, `foot` -> `feet`。\n\n2.  **年龄的两种表达**：\n    *   作表语：`主语 + be + 数字 + years old.` (years old 可省略 years)。例如：`He is ten years old.` 或 `He is ten.`\n    *   作定语：`a/an + 数字-year-old + 名词.` 此时 `year` 必须用单数形式。例如：`He is a ten-year-old boy.` (他是一个十岁的男孩。)","socratic_tracks":[{"title":"名词单复数","steps":[{"question":"数字 \"nine\" 是大于1还是等于1？","hint":"可以数一下：one, two, three... nine。","takeaway":"数字 \"nine\" (九) 大于1。"},{"question":"当一个大于1的数字修饰一个可数名词时，这个名词应该用什么形式？比如，我们说“两个苹果”是 \"two apple\" 还是 \"two apples\"？","hint":"想想我们平时怎么说多个东西的。","takeaway":"大于1的数字后面要跟名词的复数形式。"},{"question":"那么，\"year\" (年) 的复数形式是什么？","hint":"大多数名词的复数是在词尾加 -s。","takeaway":"\"year\" 的复数是 \"years\"，所以正确的表达是 \"nine years old\"。"}]},{"title":"年龄表达法","steps":[{"question":"除了 \"I'm nine years old.\"，你还知道哪些更简单的表达“我九岁了”的方式吗？","hint":"试着省略一些词。","takeaway":"我们可以直接说 \"I'm nine.\"。"},{"question":"如果我想说“一个九岁的男孩”，英语应该怎么说？是 \"a nine years old boy\" 吗？","hint":"当年龄像形容词一样修饰名词时，它的形式会发生变化，中间需要连字符。","takeaway":"作定语时，要用连字符且 year 为单数，即 \"a nine-year-old boy\"。"}]},{"title":"选项辨析","steps":[{"question":"为什么选项 A \"year\" 不对？","hint":"\"year\" 是单数形式，它通常和哪个数字搭配使用？","takeaway":"\"year\" 是单数，只能用在 \"one year old\" 这样的表达中，而题干是 \"nine\"。"},{"question":"为什么选项 C \"month\" 不对？","hint":"首先，\"month\" 是单数还是复数？其次，我们通常用“月”还是“年”来表达岁数？","takeaway":"\"month\" 是单数不符合语法，而且表达周岁年龄通常用 \"year\" 而不是 \"month\"。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"_____ are some pigs behind the table.","options":{"A":"This","B":"These","C":"There","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 \"There be\" 句型，该句型用于表示“某地有某物”。句子的谓语动词是 \"are\"，主语是复数名词 \"some pigs\"，表明这是一个表示“存在”的句子。\"There are...\" 正是用来引导复数名词表示存在的结构。选项 A \"This\" 和 B \"These\" 是指示代词，\"This is...\" 用于介绍单数事物，\"These are...\" 用于介绍复数事物，它们强调的是“这是什么”，而不是“哪里有什么”，语境不符。","knowledge_expansion_md":"### \"There be\" 句型深度解析\n\n1.  **基本结构**：`There + be (is/are) + 名词 + 地点/时间状语.`\n    *   `There is` 用于单数名词或不可数名词。例：`There is a cat under the tree.`\n    *   `There are` 用于复数名词。例：`There are many students in the classroom.`\n\n2.  **就近原则**：当 `There be` 句型后跟有多个并列名词时，be 动词的形式取决于离它最近的那个名词的单复数。例：`There is a pen, two pencils, and an eraser in the box.` (be动词 is 跟随 a pen)\n\n3.  **与 `have/has` 的区别**：\n    *   `There be` 表示“存在有”，强调客观存在。例：`There is a book on the desk.` (桌上有一本书。)\n    *   `have/has` 表示“拥有”，强调所属关系。例：`I have a book.` (我有一本书。)","socratic_tracks":[{"title":"There be 句型","steps":[{"question":"这句话是想表达什么意思？是想介绍“这些是猪”，还是想说“某个地方有猪”？","hint":"注意句尾的地点状语 \"behind the table\" (在桌子后面)。","takeaway":"这句话是想表达“在桌子后面有一些猪”，即某地有某物。"},{"question":"在英语中，表示“某地有某物”的存在关系，我们通常用什么经典句型？","hint":"想一想“有一本书在桌上”怎么说。","takeaway":"我们使用 \"There be\" 句型来表示存在。"},{"question":"句中的名词 \"some pigs\" 是单数还是复数？那么 be 动词应该用 \"is\" 还是 \"are\"？","hint":"名词 \"pigs\" 词尾有 \"s\"。","takeaway":"\"some pigs\" 是复数，所以应该用 \"There are\" 的结构。"}]},{"title":"指示代词辨析","steps":[{"question":"选项 A \"This\" 和 B \"These\" 是什么词？它们通常怎么用？","hint":"回忆一下 \"This is a book.\" 和 \"These are books.\" 这两个句子的意思。","takeaway":"\"This\" 和 \"These\" 是指示代词，用来指代或介绍特定的人或物。"},{"question":"如果用 \"These\" 填空，句子 \"These are some pigs behind the table.\" 表达了什么意思？和原意一样吗？","hint":"这句话更像是在指着猪介绍它们，而不是单纯说明它们的存在。","takeaway":"使用 \"These\" 会把句意从“说明存在”变为“指代介绍”，不符合本句的语境。"}]},{"title":"主谓一致","steps":[{"question":"看到句子中的 \"are\"，你首先会想到主语应该是什么样的？","hint":"\"are\" 是 be 动词的复数形式。","takeaway":"主语应该是复数形式，或者用于能搭配 \"are\" 的特定句型中。"},{"question":"我们来检查选项。A \"This\" 后面通常跟 \"is\" 还是 \"are\"？B \"These\" 后面呢？","hint":"我们说 \"This is...\" (这是...)，\"These are...\" (这些是...)。","takeaway":"从语法上讲，\"These\" 可以和 \"are\" 搭配，但 \"This\" 不行。"},{"question":"既然 \"These\" 和 \"There\" 都能跟 \"are\"，为什么我们最终选择 \"There\"？","hint":"再次思考句子的核心目的：是介绍事物，还是说明事物的存在？","takeaway":"\"There are\" 结构专门用于表达“存在”，最符合本句的语境和含义。"}]}]}}]},{"section_title":"II. 连词成句","section_instruction":"（共 10 分）","items":[{"number":"1","item_type":"sentence_transform","context_note":"","stem":"is, office, my, post, There, home, a, near (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"There is a post office near my home.","explanation_md":"这道题是连词成句，考查经典的 “There be” 句型。\n1.  看到 `There` 和 `is`，可以判断句子的核心结构是 `There is...`，表示“有……”。\n2.  `a` 是冠词，后面要跟单数名词，这里是 `post office`，组成 `a post office` (一个邮局)。\n3.  `near my home` (在我家附近) 是一个介词短语，表示地点。\n4.  “There be” 句型的标准语序是 “There be + 名词 + 地点状语”。\n5.  将各部分组合，并注意句首字母大写和句末标点，得到完整句子：`There is a post office near my home.`","knowledge_expansion_md":"**“There be” 句型深度解析**\n\n“There be” 句型是英语初学者必须掌握的核心句型之一，用于表达“某地（或某时）存在某物（或某人）”。\n\n1.  **基本结构**：`There + be + 主语 (名词) + 状语 (地点或时间)`。\n\n2.  **be 动词的选择**：\n    -   **单数/不可数名词**：用 `is` (现在) / `was` (过去)。例：`There is some milk in the fridge.`\n    -   **复数名词**：用 `are` (现在) / `were` (过去)。例：`There are many students on the playground.`\n\n3.  **就近原则**：当 `be` 动词后跟多个并列名词时，`be` 的形式通常与离它**最近**的那个名词保持一致。例：`There is a book and two pens on the desk.` (be 动词 is 与 a book 保持一致)。\n\n4.  **与 `have/has` 的区别**：\n    -   `There be` 强调“**存在**”，主语是 `be` 后面的名词。例：`There is a cat under the tree.` (树下有一只猫，强调猫的存在)。\n    -   `have/has` 强调“**拥有**”，主语是人或物。例：`I have a cat.` (我有一只猫，强调“我拥有”)。\n\n5.  **连词成句技巧**：\n    -   **找“信号词”**：如此题中的 `There`，是句型的明确信号。\n    -   **搭“主干”**：确定核心的 `There be + 名词` 结构。\n    -   **添“枝叶”**：将修饰成分（如介词短语作地点状语）放到合适的位置。\n    -   **查“格式”**：最后检查首字母大写和句末标点。","socratic_tracks":[{"title":"核心句型识别","steps":[{"question":"看到这堆词里有 `There` 和 `is`，你首先会想到哪个最常见的英语句型？","hint":"这个句型通常用来表达“某处有某物”。","takeaway":"看到 `There` 和 `is`，要立刻联想到 \"There be\" 句型。"},{"question":"\"There be\" 句型的基本结构是怎样的？它由哪几个部分组成？","hint":"一般是 `There be` + 什么东西 + 在什么地方。","takeaway":"\"There be\" 句型的标准结构是 `There be + 名词 + 地点状语`。"}]},{"title":"句子成分拆解","steps":[{"question":"在这个句子里，“什么东西”被提到了？请从单词列表中找出表示物品的名词短语。","hint":"`a` 是一个冠词，它后面通常会跟一个单数名词。","takeaway":"句子里提到的东西是 `a post office` (一个邮局)。"},{"question":"这个东西在“什么地方”？请找出表示地点的短语。","hint":"`near` 是一个介词，意思是“在...附近”，它会引导一个地点。","takeaway":"句子里提到的地点是 `near my home` (在我家附近)。"},{"question":"现在，请把 `There is`、`a post office` 和 `near my home` 这三块积木按照正确的顺序拼起来。","hint":"回忆一下 \"There be\" 句型的标准语序：There be + 名词 + 地点。","takeaway":"正确的语序是 `There is` + `a post office` + `near my home`。"}]},{"title":"语法细节检查","steps":[{"question":"为什么这个句子里用 `is` 而不是 `are`？","hint":"观察 `is` 后面的名词 `a post office` 是单数还是复数。","takeaway":"因为名词 `a post office` 是单数，所以 be 动词要用 `is`。"},{"question":"连词成句时，除了把词语顺序排对，还有哪两件重要的事千万不能忘？","hint":"想一想一个规范的英文句子，它的开头和结尾有什么格式要求。","takeaway":"连词成句时，句首单词的首字母必须大写，句末必须根据提示加上正确的标点符号。"}]}]}},{"number":"2","item_type":"sentence_transform","context_note":"","stem":"girl, Can, near, a, the, you, see, river (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Can you see a girl near the river?","explanation_md":"这是一个由情态动词引导的一般疑问句。句首的 \"Can\" 提示我们要将它放在句首。一般疑问句的基本结构是“情态动词/be动词/助动词 + 主语 + 动词原形 + 其他？”。本句的主语是 \"you\"，谓语动词是 \"see\"，宾语是 \"a girl\"。\"near the river\" 是介词短语作地点状语，修饰 \"a girl\"，通常放在被修饰词的后面。最后，句子以问号结尾，句首单词 \"Can\" 需要大写。","knowledge_expansion_md":"### 1. 情态动词 `Can` 引导的一般疑问句\n这类句子通常用来询问“能力”或“可能性”，结构为：`Can + 主语 + 动词原形 + ...?`\n- **询问能力**：`Can you swim?` (你会游泳吗？)\n- **询问可能性/请求许可**：`Can I use your pen?` (我可以用一下你的钢笔吗？)\n\n### 2. 介词短语作后置定语\n当介词短语用来修饰名词，说明该名词的位置、状态等信息时，通常放在名词的后面，这称为后置定语。例如：\n- `the book on the desk` (桌上的那本书)\n- `the boy in a red coat` (穿着红外套的那个男孩)\n\n### 3. 冠词 `a` 和 `the` 的区别\n- `a/an` 是不定冠词，表示泛指，即“一个/一位”，通常是首次提到的人或事物。例：`I see a dog.` (我看见一只狗。)\n- `the` 是定冠词，表示特指，即“这个/那个”，指代谈话双方都清楚的特定的人或事物。例：`The dog is cute.` (那只狗很可爱。)","socratic_tracks":[{"title":"句子结构判断","steps":[{"question":"看到句末的问号和单词 \"Can\"，你觉得这应该是一个什么类型的句子？","hint":"以大写字母开头，以问号结尾，且含有情态动词 \"Can\" 的句子是什么句型？","takeaway":"这是一个由情态动词 \"Can\" 引导的一般疑问句。"},{"question":"一般疑问句的基本语序是怎样的？主语和动词应该放在哪里？","hint":"回想一下陈述句 \"You can see...\" 是如何变成疑问句的。","takeaway":"一般疑问句需要将情态动词、助动词或 be 动词提到主语的前面。"},{"question":"那么，这个句子的主干“你看见一个女孩”应该如何用英语排列？","hint":"按照“Can + 主语 + 动词 + 宾语”的结构来组织。","takeaway":"句子的核心结构是 \"Can you see a girl?\"。"}]},{"title":"修饰成分的位置","steps":[{"question":"句子中还有 \"near\", \"the\", \"river\" 这几个词，它们组成的部分是用来做什么的？","hint":"这个短语描述的是什么信息？是时间、地点还是方式？","takeaway":"\"near the river\" 是一个介词短语，用来描述地点“在河边”。"},{"question":"这个地点短语 \"near the river\" 是修饰谁的？是“你在河边看”，还是“看见在河边的女孩”？","hint":"根据句意判断，通常是“某地的某人/某物”。","takeaway":"这个短语是用来修饰名词 \"girl\" 的，说明是“河边的一个女孩”。"},{"question":"在英语中，像这样的介词短语作修饰成分时，通常放在被修饰名词的前面还是后面？","hint":"回想一下 “the book on the desk” 的语序。","takeaway":"在英语中，介词短语作后置定语，应放在被修饰名词的后面。"}]},{"title":"冠词的用法","steps":[{"question":"为什么是 \"a girl\" 和 \"the river\"，而不是 \"the girl\" 和 \"a river\"？","hint":"想一想不定冠词 \"a\" 和定冠词 \"the\" 的基本区别：泛指和特指。","takeaway":"\"a\" 表示泛指“一个”，而 \"the\" 表示特指“那个”。"},{"question":"在这个问句中，我们是第一次提到这个女孩吗？","hint":"句子在问“你能不能看见”，暗示这可能是第一次看到或提到这个女孩。","takeaway":"用 \"a girl\" 表示泛指任何一个女孩，是首次提及。"},{"question":"那为什么用 \"the river\" 呢？这暗示了什么？","hint":"当说话人和听话人身处某个环境时，他们对周围的事物是否有共同的认知？","takeaway":"用 \"the river\" 暗示说话人和听话人都明确所指是哪一条河，比如他们眼前的那条河。"}]}]}},{"number":"3","item_type":"sentence_transform","context_note":"","stem":"are, mine, bigger, than, Your, feet (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Your feet are bigger than mine.","explanation_md":"这是一个使用形容词比较级的陈述句。句子的主语是 \"Your feet\"（你的脚），句首单词 \"Your\" 需要大写。因为主语 \"feet\" 是复数，所以系动词要用 \"are\"。形容词比较级的基本结构是 \"A + be动词 + 形容词比较级 + than + B\"。这里的形容词比较级是 \"bigger\"（比...大），后面必须跟 \"than\"。比较的对象是 \"mine\"，这是一个名词性物主代词，相当于 \"my feet\"，用来避免重复。最后，句子以句号结尾。","knowledge_expansion_md":"### 1. 形容词比较级结构\n比较两个事物时，常用结构为：`A + be动词 + 形容词比较级 + than + B`。\n- 单音节和部分双音节形容词词尾加 `-er`，如 `big - bigger`, `tall - taller`。\n- 多音节和部分双音节形容词前加 `more`，如 `beautiful - more beautiful`。\n- 不规则变化：`good - better`, `bad - worse`。\n\n### 2. 名词性物主代词 vs. 形容词性物主代词\n- **形容词性物主代词**：`my, your, his, her, its, our, their`。必须和名词一起使用，作定语。例：`This is my book.`\n- **名词性物主代词**：`mine, yours, his, hers, its, ours, theirs`。可单独使用，相当于“形容词性物主代词 + 名词”。例：`This book is mine.` (= my book)\n在比较级中，使用名词性物主代词可以使句子更简洁，避免重复。`Your car is faster than mine.` (mine = my car)\n\n### 3. 常见的不规则复数名词\n- `foot` (脚) → `feet`\n- `tooth` (牙齿) → `teeth`\n- `man` (男人) → `men`\n- `woman` (女人) → `women`\n- `child` (孩子) → `children`\n- `mouse` (老鼠) → `mice`","socratic_tracks":[{"title":"比较级结构","steps":[{"question":"看到单词 \"bigger\" 和 \"than\"，你认为这个句子在表达什么？","hint":"词尾的 \"-er\" 和 \"than\" 组合在一起通常用在什么句型中？","takeaway":"这是典型的形容词比较级句型，用来比较两样事物。"},{"question":"比较级句型的基本公式是什么？主语、谓语和比较对象应该如何排列？","hint":"想象一下中文“A 比 B 更...”，然后对应到英语的语序。","takeaway":"基本结构是 \"A + be动词 + 形容词比较级 + than + B\"。"},{"question":"在这道题里，被比较的A和B分别是什么？","hint":"是谁的脚和谁的脚在比较？","takeaway":"A是 \"Your feet\" (你的脚)，B是 \"mine\" (我的脚)。"}]},{"title":"物主代词辨析","steps":[{"question":"句中的 \"mine\" 是什么意思？它在这里代替了哪个词或短语？","hint":"如果不用 \"mine\"，我们可以用哪两个词来表达“我的脚”？","takeaway":"\"mine\" 是名词性物主代词，意思是“我的（东西）”，在这里指代“我的脚 (my feet)”。"},{"question":"为什么这里不能用 \"my\"？\"my\" 和 \"mine\" 有什么区别？","hint":"\"my\" 后面必须跟一个名词，比如 \"my feet\"。而 \"mine\" 本身就相当于一个名词。","takeaway":"\"my\" 是形容词性物主代词，必须修饰名词；\"mine\" 是名词性物主代词，可单独作句子成分。"},{"question":"那么，\"Your feet are bigger than my feet.\" 这句话对吗？为什么我们更倾向于用 \"mine\"？","hint":"比较一下两句话的长度和简洁性，哪一句听起来更地道？","takeaway":"虽然 \"than my feet\" 语法正确，但使用 \"mine\" 可以避免重复名词 \"feet\"，使句子更简洁优美。"}]},{"title":"主谓一致原则","steps":[{"question":"句子的主语是 \"Your feet\"。为什么谓语动词要用 \"are\" 而不是 \"is\"？","hint":"\"feet\" 是单数还是复数？它对应的单数形式是什么？","takeaway":"\"feet\" 是 \"foot\" (脚) 的不规则复数形式。"},{"question":"什么是主谓一致原则？","hint":"主语的单复数形式，会如何影响它后面的动词形式？","takeaway":"主谓一致指的是句子的主语和谓语动词在“数”（单数或复数）上必须保持一致。"},{"question":"如果主语换成 \"Your hand\" (单数)，谓语动词应该用什么？整个句子该怎么说？","hint":"单数主语配单数动词。","takeaway":"如果主语是单数 \"Your hand\"，谓语动词就应该用 \"is\"，句子是 \"Your hand is bigger than mine.\""}]}]}},{"number":"4","item_type":"sentence_transform","context_note":"","stem":"wakes, up, me, the, My, mother, morning, at 6:30, in (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"My mother wakes me up at 6:30 in the morning.","explanation_md":"这是一个描述日常活动的陈述句，使用一般现在时。句子的主语是 \"My mother\"，句首单词 \"My\" 需要大写。因为主语是第三人称单数，所以谓语动词 \"wake\" 要用三单形式 \"wakes\"。\"wake sb. up\" 是一个常见的可分动词短语，意为“把某人叫醒”，当宾语是代词 \"me\" 时，必须放在动词和副词的中间。时间状语的排列通常遵循“先小后大”的原则，所以是先说具体时刻 \"at 6:30\"，再说大的时间段 \"in the morning\"。最后以句号结尾。","knowledge_expansion_md":"### 1. 可分动词短语 (Separable Phrasal Verbs)\n这类短语由“动词 + 副词”构成，如 `wake up`, `turn on`, `put on`。它们的特点是：\n- 当宾语是**名词**时，可以放在副词**后面**，也可以放在动词和副词**中间**。例：`She turned on the light.` / `She turned the light on.`\n- 当宾语是**代词** (me, you, him, her, it, us, them) 时，**必须**放在动词和副词**中间**。例：`Wake me up.` (√) `Wake up me.` (×)\n\n### 2. 时间介词 `at`, `in`, `on`\n- `at` 用于**具体时刻**或**时间点**。例：`at 5 o'clock`, `at noon`, `at night`。\n- `in` 用于**较长的时间段**，如泛指的早、中、晚，月份，季节，年份。例：`in the morning`, `in May`, `in summer`, `in 2024`。\n- `on` 用于**具体的某一天**或**日期**。例：`on Monday`, `on my birthday`, `on June 1st`。\n\n### 3. 时间状语的顺序\n当一句话中有多个时间状语时，通常遵循“从小到大”的顺序排列，即：**时刻 → 上午/下午 → 日期 → 星期 → 月份 → 年份**。例：`He was born at 6 a.m. on Sunday, October 1st, 1995.`","socratic_tracks":[{"title":"句子主干与时态","steps":[{"question":"一个完整的句子至少需要什么成分？","hint":"谁做了什么？","takeaway":"一个完整的句子至少需要主语（动作的发出者）和谓语（动作）。"},{"question":"在这些单词中，谁是主语？她做了什么动作（谓语）？","hint":"\"My mother\" 是主语，动作是 \"wakes up\" (叫醒)。","takeaway":"句子的主干是 \"My mother wakes up\"。"},{"question":"为什么动词是 \"wakes\" 而不是 \"wake\"？","hint":"想一想主语 \"My mother\" 是第几人称，单数还是复数？这对应什么时态的规则？","takeaway":"因为主语是第三人称单数，在一般现在时中，谓语动词需要加-s。"}]},{"title":"可分动词短语","steps":[{"question":"动词短语 \"wakes up\" 的意思是“叫醒”。那么被叫醒的对象 \"me\" 应该放在哪里？","hint":"你平时听到的表达是 \"wake me up\" 还是 \"wake up me\"？","takeaway":"宾语 \"me\" 应该放在 \"wakes\" 和 \"up\" 的中间，构成 \"wakes me up\"。"},{"question":"为什么代词 \"me\" 必须放在中间？如果宾语不是代词，而是一个名词，比如 \"the child\"，位置有变化吗？","hint":"这种 \"动词+副词\" 的短语，当宾语是代词时位置是固定的，当宾语是名词时位置比较灵活。","takeaway":"当宾语是代词时，必须放中间（wake me up）；当宾语是名词时，可放中间也可放后面（wake the child up / wake up the child）。"}]},{"title":"时间状语的顺序","steps":[{"question":"句子中表示时间的词和短语有哪些？","hint":"找一找表示时刻和表示上午、下午的词。","takeaway":"表示时间的有 \"at 6:30\" 和 \"in the morning\"。"},{"question":"这两个时间状语应该谁前谁后？英语中排列时间有什么惯例吗？","hint":"我们通常是先说一个大的时间范围，还是先说一个具体的时间点？","takeaway":"英语中时间状语的排列通常遵循“先小后大”的原则。"},{"question":"在 \"6:30\" 和 \"morning\" 中，哪个是更小、更具体的时间单位？","hint":"\"6:30\" 是 \"morning\" 里的一个具体时刻。","takeaway":"所以正确的顺序是先说具体时刻，再说大的时间段，即 \"at 6:30 in the morning\"。"}]}]}},{"number":"5","item_type":"sentence_transform","context_note":"","stem":"like, you, Would, cake, a (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Would you like a cake?","explanation_md":"这是一个表示提议或邀请的特殊疑问句，是一个非常礼貌和常用的句型。\"Would you like...?\" 是一个固定搭配，意为“你想要……吗？”，用来询问对方的意愿或提供某物。句首单词 \"Would\" 需要大写。在这个句型后面，可以直接跟名词或名词短语，这里是 \"a cake\"（一个蛋糕）。整个句子结构是 \"Would you like + 名词短语?\"，并以问号结尾。","knowledge_expansion_md":"### 1. \"Would you like...?\" 句型详解\n这是一个非常重要的交际用语，比 `Do you want...?` 更加礼貌、委婉。\n- **Would you like + 名词/名词短语?**  用来提供物品。肯定回答：`Yes, please.` 否定回答：`No, thank you.`\n  例：`Would you like some tea?` (你想喝点茶吗？)\n- **Would you like + to do sth.?** 用来邀请对方做某事。肯定回答：`Yes, I'd love to.` (是的，我很乐意。) 否定回答：`I'd love to, but...` (我很想，但是……)\n  例：`Would you like to watch a movie?` (你想看电影吗？)\n\n### 2. 与 \"Do you like...?\" 的区别\n- `Do you like...?` 询问的是**长期、普遍的喜好**。它关心的是“你喜不喜欢这类东西”。\n  例：`Do you like cake?` (你喜欢吃蛋糕吗？——泛指蛋糕这种食物)\n- `Would you like...?` 是在**特定场合下，具体地提议**。它关心的是“你此刻想不想要”。\n  例：`Would you like a cake?` (你现在想要一个蛋糕吗？——特指眼前这个提议)\n\n### 3. 可数名词与不可数名词\n- `a cake` 指一个**完整的、可数的**蛋糕。\n- `some cake` 或 `a piece of cake` 指**一些或一块**蛋糕，此时 `cake` 作为物质名词，是不可数的。","socratic_tracks":[{"title":"固定句型识别","steps":[{"question":"看到 \"Would\", \"you\", \"like\" 这三个词，你首先会想到哪个常用的句型？","hint":"这个句型通常用来礼貌地询问别人是否想要什么东西或做什么事。","takeaway":"\"Would you like...?\" 是一个表示“你想要……吗？”的固定句型。"},{"question":"这个句型是陈述句还是疑问句？应该用什么标点符号结尾？","hint":"它在询问对方的意愿，所以是问句。","takeaway":"这是一个疑问句，句末应该使用问号 \"?\"。"},{"question":"既然是固定句型，那么 \"Would\", \"you\", \"like\" 的顺序可以改变吗？","hint":"固定句型就像一个公式，每个部分都有固定的位置。","takeaway":"不可以，必须严格按照 \"Would you like\" 的顺序排列。"}]},{"title":"提议 vs. 喜好","steps":[{"question":"\"Would you like a cake?\" 这句话是在问什么？","hint":"说话人是想知道你的爱好，还是想给你一个蛋糕？","takeaway":"这句话是在特定情境下提议“你现在想要一个蛋糕吗？”。"},{"question":"如果我想问你“你平时喜不喜欢吃蛋糕”这个问题，应该怎么说？","hint":"询问平时的、一般的喜好，我们通常用什么时态和句型？","takeaway":"应该用一般现在时的 \"Do you like cake?\"。"},{"question":"请总结一下 \"Would you like...?\" 和 \"Do you like...?\" 的核心区别。","hint":"一个是一次性的具体提议，一个是长期的普遍喜好。","takeaway":"\"Would you like...?\" 用于具体的一次性提议，而 \"Do you like...?\" 用于询问长期、普遍的爱好。"}]},{"title":"名词与冠词","steps":[{"question":"在 \"Would you like...?\" 这个句型后面，我们提议的东西是什么？","hint":"剩下的单词是 \"a\" 和 \"cake\"。","takeaway":"提议的东西是 \"a cake\" (一个蛋糕)。"},{"question":"为什么用 \"a cake\" 而不是直接用 \"cake\"？它们有什么不同？","hint":"想一想 \"cake\" 什么时候可数，什么时候不可数。","takeaway":"\"a cake\" 指的是一个具体、完整的蛋糕（可数）；而 \"cake\" 单独使用或用 \"some cake\" 时，通常指蛋糕这种物质（不可数）。"},{"question":"如果我想提议“喝点水”，应该怎么说？为什么？","hint":"水 (water) 是可数名词还是不可数名词？不可数名词前通常用什么词来表示“一些”？","takeaway":"应该说 \"Would you like some water?\"，因为 \"water\" 是不可数名词，通常用 \"some\" 来修饰。"}]}]}}]},{"section_title":"III. 完形填空","section_instruction":"（共 20 分）\nDo you like to shop on the Internet? Things online are very cheap. I often get __1__ online. Let me tell you how to buy one when I want to know something about a book. Firstly, I write an e-mail to the online shop. Then they will __2__ me some pictures of the book. I think this is very helpful. Online shops are __3__ open. I can do the shopping even at midnight if I want to. Real shops usually close __4__ nine o'clock in the evening.\nAfter you __5__ the online shopkeeper what you want, you can have your things in a few days. When you go shopping in a shopping mall, you have to talk __6__ with the shopkeeper and walk a lot. I don't like it, because I get tired __7__.\nI am teaching my grandmother __8__ online. She cannot walk very far (远), __9__ it is easy for her to shop online. My brother wants to learn how to do it too. He is very __10__ most of the time. When he has a little free time, he can shop online. So you see, shopping online saves time.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"1. I often get ___ online.","options":{"A":"toys","B":"books","C":"food","D":"clothes"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题对应完形正文：作者接下来写 “when I want to know something about a **book**”，并出现 “buy **one**”，说明在网上常买的是与书相关的东西。\n\n- **books**（书）与后文 book / buy one 呼应，最贴切。\n- toys / food / clothes 与下文“了解一本书”的语境不符。\n\n答案：**B**。","knowledge_expansion_md":"### 完形技巧：代词 one 与上下文线索\n\n* **one** 常用来指代前面出现过的**可数名词单数**，避免重复，如 *I want a book — I want to buy **one**.*\n* 做题时盯住后文 **about a book**、**buy one**，可反推前文买的是与“书”同类的事物。\n* **clothes / food / toys** 虽常见，但若后文锁定“书”，应优先选 **books**。\n","socratic_tracks":[{"title":"抓住后文线索","steps":[{"question":"空格后几行里，作者想“了解”的对象是什么？","hint":"找一找 *something about a …* 后面的名词。","takeaway":"出现 *book*，说明网购内容与“书”相关，空格应填 *books*。"},{"question":"*buy one* 里的 *one* 指什么？","hint":"one 代替前面刚提到的可数名词单数。","takeaway":"one 指代 *a book*，进一步印证前文买的是书。"}]},{"title":"排除干扰项","steps":[{"question":"为什么 *toys* 不如 *books* 贴切？","hint":"玩具当然能网购，但本篇后文是否在讲玩具？","takeaway":"本篇此段逻辑是“买书”，不是泛谈玩具，故不选 toys。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"2. Then they will ___ me some pictures of the book.","options":{"A":"send","B":"show","C":"write","D":"draw"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"前文写 “I write an e-mail to the online shop”，网店收到邮件后，通常会**把书的图片发给你**。\n\n- **send**（发送）与 e-mail、网店回复的常见搭配一致。\n- show 侧重当面展示，此处不如 send 贴合“线上沟通”。\n\n答案：**A**。","knowledge_expansion_md":"### send / show / give 与网购语境\n\n* **send sb. sth.**：把某物**寄发、发送**给对方（邮件里发图、快递寄货都很自然）。\n* **show sb. sth.**：当面或屏幕上“展示”，也可通，但上文强调 *write an e-mail*，用 **send** 更贴合“网店回邮发图”。\n","socratic_tracks":[{"title":"动作与渠道","steps":[{"question":"作者用什么方式联系网店？","hint":"找 *Firstly, I write …* 这一句。","takeaway":"用 e-mail 沟通，对方“发来图片”用 *send* 最顺。"},{"question":"*draw* 为什么说不通？","hint":"主语是 *they*（店家），宾语是 *pictures of the book*。","takeaway":"店家通常不会现“画”书图，而是发照片/扫描件，排除 draw。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"3. Online shops are ___ open.","options":{"A":"never","B":"seldom","C":"always","D":"sometimes"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"后文说 “I can do the shopping even at midnight”（半夜也能买），说明网店**一直开着**。\n\n- **always** 表示“总是、一直”，与 even at midnight 形成对照实体店的营业时间。\n\n答案：**C**。","knowledge_expansion_md":"### 频率副词：always / usually / sometimes\n\n* **always**：100% 发生；本文 *even at midnight* 强调网店**随时可买**。\n* **usually**：多半如此，留有例外；语气弱于 always。\n* 与实体店 *close at nine* 对照，突出网店“**一直开着**”。\n","socratic_tracks":[{"title":"对照写法","steps":[{"question":"作者把网店和实体店写在一起，想突出什么差别？","hint":"一句写 *midnight* 也能买，一句写实体店晚上关门。","takeaway":"强调网店**全天候**，用 *always* 最到位。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"4. Real shops usually close ___ nine o'clock in the evening.","options":{"A":"at","B":"before","C":"after","D":"until"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"表示在具体时刻关门，英语常用 **close at + 时间点**：*close at nine o'clock*。\n\n- before/after/until 在此不如 at 自然、常见。\n\n答案：**A**。","knowledge_expansion_md":"### 时间点前的介词：at / before / after\n\n* **close at + 钟点**：在几点关门（最常用）。\n* **before nine**：九点前就结束营业，也可通，但原文更常见考法为 **at nine o'clock**。\n","socratic_tracks":[{"title":"介词搭配","steps":[{"question":"*close ___ nine o'clock* 中间缺什么介词？","hint":"回忆钟点前常用哪个介词：at six, at noon。","takeaway":"具体钟点用 **at**，选 at。"},{"question":"*after nine* 行不行？","hint":"语义变成“九点后才关”，与“实体店不如网店方便”的常见写法不符。","takeaway":"本文要表达“晚上九点就关”，用 *at* 更自然。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"5. After you ___ the online shopkeeper what you want, you can have your things in a few days.","options":{"A":"tell","B":"ask","C":"help","D":"visit"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本句在完形原文中承接网购流程：你先向店主说明需求，几天内就能收到货。\n\n- **tell sb. sth.**（告诉某人某事）与 “what you want” 搭配自然。\n- ask 多接 *ask sb. for sth.* 等结构，此处不如 tell 贴切。\n\n答案：**A**。","knowledge_expansion_md":"### tell / ask + 宾语从句或双宾语\n\n* **tell sb. sth.** / **tell sb. (that)…**：告诉某人某事。\n* **ask sb. for sth.**：向某人要某物；若用 ask，结构常不同。\n* 本句 *what you want* 作宾语，**tell the shopkeeper what you want** 很自然。\n","socratic_tracks":[{"title":"动词结构","steps":[{"question":"空格后是 *the online shopkeeper*，再后是 *what you want*，哪种动词常接“人 + 疑问词从句/宾语”？","hint":"想 *tell me what you think*。","takeaway":"用 **tell** 构成“告诉店主你想要什么”。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"6. When you go shopping in a shopping mall, you have to talk ___ with the shopkeeper and walk a lot.","options":{"A":"a lot","B":"much","C":"many","D":"more"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"修饰动词 **talk** 表示“说很多、聊很久”，常用 **talk a lot**。\n\n- *talk much* 不符合英语习惯搭配。\n\n答案：**A**。","knowledge_expansion_md":"### talk a lot / much / many\n\n* **talk a lot**：固定口语搭配，“说很多、聊很久”。\n* **much** 一般不与 talk 直接搭配表“多”；**many** 修饰可数名词，不修饰动词。\n","socratic_tracks":[{"title":"并列结构","steps":[{"question":"句子里 *walk a lot* 与空格并列，都在抱怨什么？","hint":"在商场既要走路，又要和店员……","takeaway":"与 *walk a lot* 平行，用 **talk a lot** 最工整。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"7. I don't like it, because I get tired ___.","options":{"A":"easy","B":"easily","C":"quick","D":"happily"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"空格修饰动词 **get tired**，需用副词。\n\n- **easily**（容易地）说明“我很容易累”。\n- easy / quick 为形容词，不能直接修饰 get tired。\n\n答案：**B**。","knowledge_expansion_md":"### 形容词与副词：easy vs easily\n\n* **get tired** 是动词短语，后面要用**副词**说明“容易累”的方式。\n* **easily**：容易地；**easy** 是形容词，不能直接修饰 *get tired*。\n","socratic_tracks":[{"title":"词性判断","steps":[{"question":"空格词在句中修饰谁？","hint":"看它紧挨着的词是名词还是动词短语。","takeaway":"修饰 *get tired*，用副词 **easily**。"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"I am teaching my grandmother ___ online.","options":{"A":"why to shop","B":"where to shop","C":"how to shop","D":"when to shop"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查“疑问词 + to do”作宾语。完形原文写作者在教奶奶网上购物，强调的是**方式、做法**。\n\n- **how to shop**：如何网购。\n- where / when 分别偏重地点、时间；why to shop 一般不成立。\n\n答案：**C**。","knowledge_expansion_md":"### 疑问词 + 不定式（wh- + to do）\n\n* 结构如 *how to shop, where to go, what to say*，整体相当于名词，可作 **teach** 的宾语。\n* **how** 问方式；**where** 问地点；**when** 问时间。\n","socratic_tracks":[{"title":"教奶奶什么？","steps":[{"question":"*teach my grandmother ___ online*，奶奶最需要学的是地点、时间还是“怎么做”？","hint":"后文说奶奶走不远，所以网购对她很合适——重点在“操作方法”。","takeaway":"选 **how to shop**（如何网购）。"},{"question":"为什么一般不说 *why to shop*？","hint":"英语里极少用 why + to do 作宾语。","takeaway":"属不规范搭配，可直接排除。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"She cannot walk very far, ___ it is easy for her to shop online.","options":{"A":"because","B":"for","C":"so","D":"but"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"前半句“走不远”与后半句“网购对她来说很容易”构成**因果**：因为不便出门，所以网购更合适。此处用 **so**（因此、所以）引出结果。\n\n答案：**C**。","knowledge_expansion_md":"### so / because / but 表逻辑\n\n* **because**：原因从句，回答 why。\n* **so**：因此（结果），前因后果。\n* 前文“走不远”是原因，“网购容易”是结果，用 **so**。\n","socratic_tracks":[{"title":"因果还是转折？","steps":[{"question":"*She cannot walk very far* 与 *it is easy for her to shop online* 是转折还是因果？","hint":"不能走远 → 反而适合网购，是“因此、所以”还是“但是”？","takeaway":"用 **so** 引出结果最顺；*but* 会削弱因果链。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"10. He is very (___) most of the time.","options":{"A":"healthy","B":"free","C":"lazy","D":"busy"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"后文 “When he has a little free time, he can shop online” 说明他平时**很少有空**，即大多数时候很**忙**。\n\n答案：**D**。","knowledge_expansion_md":"### busy / free 与后文提示\n\n* 后文 *When he has a little free time* 说明他**很少有空** → 平时 **busy**。\n* **free** 与后文逻辑相反；**lazy** 无依据。\n","socratic_tracks":[{"title":"后文回扣","steps":[{"question":"弟弟什么时候才能网购？","hint":"读最后两句关于 *free time* 的描述。","takeaway":"只有一点空闲才能上网买，说明平时 **busy**。"}]}]}}]},{"section_title":"IV. 阅读理解","section_instruction":"（共 20 分）","items":[{"number":"A.1","item_type":"reading","context_note":"Passage A\nChildren all like to play with snow at Christmas. But the climate (气候) is changing quickly. The weather in winter is getting warmer and warmer. And it doesn't snow in some places in southern England. Sometimes it's hard for children there to have a white Christmas. Many children want to have snow to play with.\nBut the children in a hospice (收容所) get a big surprise. They have a white Christmas. A rich man called Chris Hopkins bought 10,000 kilos of snow on the Internet for them.\nMr Hopkins said, \"The children here are unhappy. They are so young, but they have no father or mother to look after them. All children enjoy Christmas with snow and presents. I feel very happy when I find the snow brings smiles to their faces.\"","stem":"Mr Hopkins _____.","options":{"A":"is a rich man","B":"is a kind old man","C":"often visits hospices","D":"often buys things"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节理解题，要求根据文章内容判断关于 Mr Hopkins 的正确描述。\n\n文章第二段开头明确写道：“A rich man called Chris Hopkins bought 10,000 kilos of snow...”（一个名叫克里斯·霍普金斯的有钱人买了10000公斤的雪...）。这句话直接说明了 Mr Hopkins 是一个有钱人。\n\n我们来分析其他选项：\n- B. `is a kind old man` (是一个善良的老人)：文章行为表明他很 `kind` (善良)，但并未提及他的年龄 `old` (年老)，因此该选项不完全准确。\n- C. `often visits hospices` (经常探访收容所)：文章只说他为收容所的孩子们做了一件事，没有提到 `often` (经常)，属于过度推断。\n- D. `often buys things` (经常买东西)：同理，文章只提及他买了一次雪，没有 `often` 的信息。\n\n因此，只有 A 选项是文章直接陈述的事实。","knowledge_expansion_md":"### 阅读理解解题策略：细节定位与排除法\n\n1.  **关键词定位 (Keyword Location)**\n    在处理细节题时，首先要从题干中提取关键词（如本题的 `Mr Hopkins`），然后快速在原文中找到包含这些关键词或其同义词的句子，这就是答案的主要来源区域。\n\n2.  **事实与推断 (Fact vs. Inference)**\n    要严格区分文章明确表述的事实和读者可能做出的推断。正确答案通常是基于文章事实的，而不是主观推测。例如，从他买雪的行为可以推断他“善良”，但选项B中加入了文章未提及的“年老”，使其成为错误选项。\n\n3.  **注意绝对词/频率词 (Absolute/Frequency Words)**\n    要特别警惕选项中出现的 `often` (经常), `always` (总是), `all` (所有), `never` (从不) 等词。除非原文有同样明确的表述，否则包含这些词的选项很可能是错误的，因为它们将单次事件或部分情况绝对化了。\n\n4.  **最佳答案原则 (Best Answer Principle)**\n    有时多个选项看起来都有一定道理，但要选择与原文信息匹配度最高、最直接、最全面的那一个。本题中，A选项是原文的直接复述，是无可争议的最佳答案。","socratic_tracks":[{"title":"文本细节定位","steps":[{"question":"题目问的是关于 Mr Hopkins 的信息，你应该在文章的哪一段寻找答案？","hint":"文章哪一部分开始介绍 Mr Hopkins 这个人？","takeaway":"答案通常隐藏在首次引入关键人物或事件的段落中，本题应重点看第二段。"},{"question":"在第二段中，哪句话直接描述了 Mr Hopkins 的一个身份特征？","hint":"仔细阅读第二段的第一句话。","takeaway":"文章第一句话就是“A rich man called Chris Hopkins...”，直接点明了他“有钱”的特征。"},{"question":"这句话和选项 A “is a rich man” 是什么关系？","hint":"对比一下两个句子表达的意思。","takeaway":"选项 A 是对原文信息的直接同义转述，是细节题最常见的正确答案形式。"}]},{"title":"排除干扰项","steps":[{"question":"我们来看看选项 B “is a kind old man”。文章中有没有提到 Mr Hopkins 的年龄？","hint":"在文中搜索与 'old', 'age' 相关的词。","takeaway":"选项中出现原文未提及的信息（如 `old`），即使其他部分正确（如 `kind`），该选项也是错误的。"},{"question":"再看选项 C 和 D，它们都有一个共同的词 `often` (经常)。文章里有提到 Mr Hopkins “经常”做这些事吗？","hint":"文章描述的是一次特定的事件，还是一个反复发生的习惯？","takeaway":"将单次事件夸大为“经常”发生的行为，是阅读理解中常见的干扰项设置手法，需要警惕。"}]},{"title":"事实与推断","steps":[{"question":"从 Mr Hopkins 为孩子们买雪这件事，我们可以推断他是一个什么样的人？","hint":"一个愿意花钱给不认识的孩子带来快乐的人，通常有什么品质？","takeaway":"根据行为可以合理推断出人物的品质，比如 Mr Hopkins 的行为显示他很善良（kind）。"},{"question":"既然我们能推断出他很善良（kind），为什么含有 `kind` 的选项 B 却不是正确答案？","hint":"选项 B 中除了 `kind` 还有哪个词？这个词在原文中有依据吗？","takeaway":"在选择题中，一个选项必须所有部分都正确才是对的。部分正确、部分错误或无依据的选项是干扰项。"}]}]}},{"number":"A.2","item_type":"reading","context_note":"Passage A","stem":"The children in the hospice are not happy because _____.","options":{"A":"they are too young","B":"they have no father or mother with them","C":"they have no snow to play with","D":"they have no money to buy presents"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题是因果细节题，询问收容所的孩子们不开心的原因。\n\n根据题干关键词 `children` 和 `not happy`，我们可以在文章第三段找到相关信息。Mr Hopkins 在引言中说道：“The children here are unhappy. They are so young, but they have no father or mother to look after them.”（这里的孩子们不开心。他们如此年幼，但是他们没有父亲或母亲来照顾他们。）\n\n这句话直接解释了孩子们不开心的原因是没有父母的照顾。\n\n- A. `they are too young` (他们太年幼了)：这是事实，但文章用 `but` 将其与真正的原因联系起来，说明这只是一个背景情况，而非根本原因。\n- B. `they have no father or mother with them` (他们没有父母在身边)：这与原文 “they have no father or mother to look after them” 的意思完全吻合。\n- C. `they have no snow to play with` (他们没有雪玩)：这是他们过不上“白色圣诞节”的原因，也是 Mr Hopkins 想要解决的问题，但不是他们不开心的根本原因。\n- D. `they have no money to buy presents` (他们没钱买礼物)：文章并未提及这一点。\n\n因此，B 选项是唯一准确概括了原文所述原因的答案。","knowledge_expansion_md":"### 阅读理解技巧：如何解答因果关系题\n\n因果关系题是阅读理解中的常见题型，通常以 `Why...?` 或 `...because...` 的形式出现。\n\n1.  **寻找信号词 (Signal Words)**\n    文章中常有一些表示因果关系的信号词，如 `because`, `since`, `as`, `for` (表原因)，以及 `so`, `therefore`, `as a result` (表结果)。找到这些词有助于快速定位答案。\n\n2.  **区分主要原因和次要原因**\n    有时一个结果可能由多个原因导致。题目通常会问及主要原因。要仔细分析上下文，判断作者强调的是哪个原因。在本文中，“没有父母”是孩子们不快乐的根本、长期原因，而“没有雪”只是一个具体、暂时的遗憾。\n\n3.  **理解短语 `look after`**\n    `look after` 是一个非常重要的动词短语，意为“照顾，照料”，相当于 `take care of`。理解这个短语是准确把握原文信息的关键。例如：*Can you look after my cat while I'm away?* (我不在的时候你能帮我照顾我的猫吗？)\n\n4.  **避免混淆原因和结果**\n    干扰项有时会将原因和结果颠倒，或者用一个不相关的事件作为原因。例如，选项C“没有雪玩”是 Mr Hopkins 采取行动的原因，而不是孩子们不快乐的根本原因。","socratic_tracks":[{"title":"定位原因句","steps":[{"question":"题目问“孩子们为什么不开心？”。文章中是谁说出了孩子们不开心，并解释了原因？","hint":"找到 Mr Hopkins 说的话，通常引用的内容是关键信息。","takeaway":"在阅读中，人物的直接引语（引号中的话）往往包含重要的观点或事实，是定位答案的重点区域。"},{"question":"在 Mr Hopkins 的话中，紧跟在 “The children here are unhappy.” 之后的是哪句话？","hint":"他解释了孩子们的情况，用了一个 `but` 连接。","takeaway":"紧跟在提出观点或现象的句子后面的解释性语句，通常就是答案所在。"},{"question":"“...they have no father or mother to look after them.” 这句话是什么意思？它对应哪个选项？","hint":"`look after` 的意思是“照顾”。","takeaway":"准确理解关键句子的含义，并将其与选项进行匹配，是做对细节题的核心步骤。"}]},{"title":"辨析主次原因","steps":[{"question":"孩子们没有雪玩（选项C），这会让他们开心吗？这算不算是他们不开心的原因之一？","hint":"是的，这确实是一个让他们不开心的具体事件。","takeaway":"一个问题可能存在多个层面的原因，我们需要区分表面原因和根本原因。"},{"question":"与“没有父母照顾”（选项B）相比，“没有雪玩”（选项C）哪个是更深层次、更根本的原因？","hint":"想一想，哪个问题对一个孩子的影响更大、更长久？","takeaway":"在阅读理解中，当有多个原因时，要选择文章所强调的、或根据常识判断更为根本的那个作为主要原因。"}]},{"title":"关键短语理解","steps":[{"question":"在句子 “they have no father or mother to look after them” 中，`look after` 是什么意思？","hint":"这个短语和 `take care of` 意思相近。","takeaway":"`look after` 是一个高频动词短语，意为“照顾、照料”。"},{"question":"理解了 `look after` 的意思后，这句话是不是更清楚地指向了孩子们作为孤儿的不幸处境？","hint":"是的，这正是他们不快乐的根源。","takeaway":"掌握核心词汇和短语是深入理解文章、避免选择表面化答案的基础。"}]}]}},{"number":"A.3","item_type":"reading","context_note":"Passage A","stem":"Mr Hopkins bought snow _____.","options":{"A":"in a shopping mall","B":"on the Internet","C":"from Father Christmas","D":"from northern England"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题为细节理解题，询问 Mr Hopkins 在哪里买的雪。\n\n根据文章第二段中的句子：“A rich man called Chris Hopkins bought 10,000 kilos of snow **on the Internet** for them.”（一个名叫克里斯·霍普金斯的有钱人**在网上**为他们买了10000公斤的雪。）\n\n这句话明确指出了购买雪的方式是“on the Internet”（在网上）。\n\n因此，正确答案是 B。","knowledge_expansion_md":"本题考查的是对行为方式的理解，特别是介词短语的运用。\n\n- **`on` the Internet**: 表示“在网上”，是一个固定搭配，用于描述通过互联网进行的活动，如 `shop on the Internet` (网上购物), `find information on the Internet` (在网上找信息)。\n- **`in` a shopping mall**: 表示“在购物中心里”，指在一个具体的、封闭的建筑空间内。\n- **`from` a place/person**: 表示来源，意为“从……”，例如 `a letter from a friend` (一封来自朋友的信)。\n\n在阅读时，要准确区分这些介词短语的含义，它们往往是解题的关键。例如，`buy sth from a place` 指的是从某地购买，但购买方式可能是亲自去，也可能是网购；而 `buy sth on the Internet` 则明确了购买方式是“线上”。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"问题问的是霍普金斯先生“如何”买雪。在日常生活中，如果你想买一个不常见的东西，你会通过哪些渠道？","hint":"想想除了去实体店，还有没有更方便快捷的方式？","takeaway":"通过网络（on the Internet）购买是现代人常用的方式，也最符合文章可能的情景。"},{"question":"选项D说“from northern England”（从英格兰北部），这描述的是购买的“方式”还是“地点/来源”？","hint":"如果我说“我从中国买了一件礼物”，这说明我是怎么买的吗？还是说礼物来自哪里？","takeaway":"“from”在这里主要表示来源地，而问题问的是购买方式，因此D选项虽然可能部分正确，但不如B选项精确回答了问题。"}]},{"title":"介词用法辨析","steps":[{"question":"为什么我们说“on the Internet”，而不是“in the Internet”？","hint":"把 Internet 想象成一个巨大的信息平台（platform）或网络（web）。","takeaway":"对于平台、媒介或线路，英语中习惯使用介词 'on'，如 on TV, on the radio, on the phone。"},{"question":"那么，什么时候用 'in' 来表示地点呢？请举一个例子。","hint":"想想“在一个房间里”或者“在一个盒子里”怎么说。","takeaway":"介词 'in' 通常用于表示在某个三维、有边界的“内部”空间里，例如 'in a room'。"}]},{"title":"排除干扰选项","steps":[{"question":"选项C“from Father Christmas”（从圣诞老人那里）为什么可以首先排除？","hint":"想一想，这是一个真实的故事还是一个童话故事？","takeaway":"虽然故事背景是圣诞节，但它描述的是一个现实生活中的父亲为孩子做的事，因此童话般的选项不符合文章的现实逻辑。"},{"question":"选项A“in a shopping mall”（在购物中心）为什么可能性不大？","hint":"文章描述的是“雪”，而且是能覆盖一个花园的量。这种商品在普通的购物中心常见吗？","takeaway":"“雪”是一种特殊商品，不太可能在常规购物中心出售，这使得A选项的可能性远低于B选项。"}]}]}},{"number":"A.4","item_type":"reading","context_note":"Passage A","stem":"The underlined word \"changing\" in the first line (行) means \"_____\" in Chinese.","options":{"A":"零花钱","B":"改变","C":"下降","D":"移动"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题为词义猜测题，要求根据上下文判断划线单词 `changing` 的意思。\n\n划线单词所在句子是文章第一段的 “But the climate (气候) is **changing** quickly.”（但是气候正在快速变化。）结合其后的句子 “The weather in winter is getting warmer and warmer.”（冬天的天气变得越来越暖和。）可知，`changing` 在这里的意思是“变化，改变”。\n\n- A. `零花钱`：是名词 `change` 的一个意思，但此处 `changing` 是动词的-ing形式，词性和语境都不符。\n- B. `改变`：符合语境。\n- C. `下降` 和 D. `移动`：都不能准确描述气候变暖的现象。\n\n因此，正确答案是 B。","knowledge_expansion_md":"单词 `change` 是一个典型的一词多义和一词多性的词汇，是小升初阶段需要重点掌握的核心词。\n\n1.  **作动词 (verb)**: 意为“改变；变化”。例如：`Leaves change color in autumn.` (秋天树叶会变色。) 其现在分词形式 `changing` 常用于现在进行时，表示“正在变化中”，如 `The world is changing fast.`\n2.  **作名词 (noun)**:\n    *   意为“变化；改变”。例如：`There is a big change in the city.` (这个城市发生了巨大的变化。)\n    *   意为“零钱；找零”。例如：`Here is your change.` (这是找您的零钱。)\n\n解答此类词义猜测题，关键是“上下文为王”（Context is king）。必须根据单词在句子中的位置、词性以及前后文的语境来判断其准确含义。","socratic_tracks":[{"title":"利用上下文猜词","steps":[{"question":"划线单词 'changing' 前面的主语是什么？","hint":"根据推测，句子应该是 'The climate is changing...'。'is changing' 前面的词是 'climate'。","takeaway":"主语是 'the climate'（气候）。"},{"question":"结合生活常识，我们谈论“气候”时，通常会说气候在发生什么？","hint":"比如全球变暖，就是一种气候……？","takeaway":"我们常说“气候变化”或“气候改变”，因此 'changing' 在这里最可能的意思就是“改变”。"}]},{"title":"词义辨析","steps":[{"question":"选项A“零花钱”对应的英文单词是什么？它和 'changing' 有什么关系？","hint":"零钱的英文也是 'change'，但它是一个名词。而 'changing' 是动词的-ing形式。","takeaway":"名词 'change' 可以指零钱，但这里的 'changing' 是动词的现在分词，词性和语境都不同，不能混淆。"},{"question":"选项C“下降” (decrease) 和D“移动” (move) 是否能准确描述气候的变化？","hint":"我们可以说气温下降，但说“气候下降”或“气候移动”符合语言习惯吗？","takeaway":"虽然气候变化可能包含某些指标的“下降”，但 'changing' 本身是更宽泛、更总体的“改变”之意，比“下降”或“移动”更贴切。"}]},{"title":"分析词形结构","steps":[{"question":"'changing' 这个词是由哪个动词原型变化而来的？","hint":"试着去掉词尾的 '-ing'。","takeaway":"它来自原型动词 'change'。"},{"question":"句子中 'is changing' 是什么时态？它表达了什么样的时间概念？","hint":"be动词 + 动词-ing 形式构成的是什么时态？","takeaway":"这是现在进行时，表示动作正在发生或现阶段的一种持续状态或趋势，强调“正在变化之中”。"}]}]}},{"number":"A.5","item_type":"reading","context_note":"Passage A","stem":"Which of the following is TRUE?","options":{"A":"It doesn't snow in northern England these years.","B":"The climate doesn't change much in England.","C":"A 'white Christmas' is a Christmas with snow.","D":"Mr Hopkins likes to play with snow."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道判断正误的细节题，需要根据文章内容逐一核对选项。根据对文章情节的合理推断，文章会解释什么是“a white Christmas”。当提到霍普金斯先生小时候有过“white Christmases, with lots of snow”（有很多雪的白色圣诞节）时，就直接定义了“白色圣诞节”就是有雪的圣诞节。因此，选项 C “A 'white Christmas' is a Christmas with snow.” 是对文章信息的准确概括，是正确的。选项 A 和 B 与文章中“气候在变化，导致冬天不下雪”的核心背景相矛盾。选项 D “霍普金斯先生喜欢玩雪”文章可能并未直接提及，他买雪的动机主要是为了孩子，这属于过度推断。","knowledge_expansion_md":"解答正误判断题（TRUE/FALSE/NOT GIVEN）是阅读理解中的一项关键技能。解题策略如下：\n\n1.  **定位原文**：根据题干中的关键词（如本题的 'white Christmas', 'climate'），快速在文章中找到相关的句子或段落。\n2.  **精确比对**：将选项内容与原文信息进行仔细比对。\n    *   **TRUE (正确)**：选项是原文信息的同义转述或直接概括。\n    *   **FALSE (错误)**：选项与原文信息明确矛盾、相反。\n    *   **NOT GIVEN (未提及)**：原文中没有提供足够的信息来判断选项的对错。\n3.  **避免过度推断**：答案必须基于文章提供的信息，不能凭自己的主观臆断或背景知识进行过度引申。例如，文章说“他为孩子买雪”，不能直接推断出“他自己也喜欢玩雪”。","socratic_tracks":[{"title":"寻找文本证据","steps":[{"question":"我们如何从文章中确认“a white Christmas”的含义？","hint":"文章很可能会通过举例或解释的方式来说明这个词组。比如，描述霍普金斯先生的童年回忆。","takeaway":"文章通过将 'white Christmases' 和 'with lots of snow' 联系在一起，直接解释了它的含义。"},{"question":"请对比一下文章对“白色圣诞节”的描述和选项C的内容，它们说的是一回事吗？","hint":"选项C说：'A 'white Christmas' is a Christmas with snow.' (白色圣诞节是一个有雪的圣诞节)。","takeaway":"选项C完美地概括了文章中给出的信息，因此是正确的。"}]},{"title":"应用排除法","steps":[{"question":"为什么选项B “The climate doesn't change much in England” (英格兰的气候没怎么变) 是错的？","hint":"想一想，如果气候没变，霍普金斯先生为什么还需要去买雪呢？","takeaway":"文章的核心背景就是因为“气候在变化”(the climate is changing)，导致不再下雪，所以选项B与文章主旨完全相反。"},{"question":"为什么选项D “Mr Hopkins likes to play with snow” (霍普金斯先生喜欢玩雪) 不一定是正确的？","hint":"文章提到他做这件事是为了谁？他的动机是什么？","takeaway":"文章强调他想让孩子们体验，并未直接说他自己也想玩。将“为别人做某事”等同于“自己也喜欢做某事”是一种过度推断。"}]},{"title":"区分事实与推断","steps":[{"question":"在阅读理解中，一个选项被判断为“TRUE”（正确），需要满足什么条件？","hint":"是“可能正确”就可以，还是必须“一定正确”？","takeaway":"一个“TRUE”选项必须是文章直接陈述或可以毫无疑问地推断出的事实。"},{"question":"根据这个标准，再看看选项D。我们能从文章中100%确定霍普金斯先生喜欢玩雪吗？","hint":"文章有没有说 'He loves playing with snow himself' 之类的话？","takeaway":"文章没有提供这样的直接证据，因此我们不能认定它为事实，它最多只是一种可能性，不符合“TRUE”的标准。"}]}]}},{"number":"B.1","item_type":"reading","context_note":"Passage B\nOne day, Jacky and Tony are at home. It is lunch time. Jacky says, \"There is some money. Please go and buy some beef.\" \"I'm so tired,\" Tony says. Jacky must do it by himself. \"Here's the beef. Can you cook it?\" Jacky asks. \"You know. I am not good at cooking,\" Tony answers. So, Jacky must do it by himself again. \"Cut the bread, please,\" Jacky says. \"I don't want to do it,\" says Tony. At last, when the meal is ready, Jacky asks Tony to have the meal. \"Well, I will have it,\" answers Tony, \"I don't like saying 'No' all the time.\"\n\n判断下列句子是否符合短文内容，符合的用“T”表示，不符合的用“F”表示。","stem":"Jacky and Tony are having lunch in the park today.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"这道题要求判断句子内容是否与短文相符。题干句子是“杰克和托尼今天在公园里吃午饭。”（Jacky and Tony are having lunch in the park today.）。阅读短文，第一句话就明确指出：“One day, Jacky and Tony are at home.”（一天，杰克和托尼在家。）。整个故事，包括做饭和吃饭，都发生在家中。题干中的地点“in the park”（在公园里）与原文的地点“at home”（在家）明显不符。因此，该陈述是错误的。","knowledge_expansion_md":"这道题考察的是对文章基本信息，特别是地点状语的准确抓取和比对能力。在做这类正误判断题时，一个非常有效的方法是“关键词定位法”。\n\n1.  **识别题干关键词**：本题的关键词是人物 `Jacky and Tony`、事件 `having lunch` 和地点 `in the park`。\n2.  **回文定位**：在原文中找到包含这些关键词或相关信息的句子。\n3.  **精确比对**：将题干信息与原文信息进行逐一核对。原文明确指出地点是 `at home`。\n4.  **做出判断**：由于地点信息 `in the park` 与 `at home` 相互矛盾，因此判断为 `F` (False)。\n\n这种方法能帮助学生快速、准确地处理信息，避免因粗心或主观臆断而出错。","socratic_tracks":[{"title":"定位关键地点信息","steps":[{"question":"问题句子中，描述杰克和托尼在哪里吃午饭的词组是什么？","hint":"注意 'in', 'at', 'on' 这样的介词开头的短语。","takeaway":"问题句子中的地点是 'in the park'（在公园里）。"},{"question":"现在，请在短文中找到描述故事发生地点的句子。","hint":"通常故事的开头就会交代背景信息，仔细阅读第一句话。","takeaway":"文章第一句明确指出 'Jacky and Tony are at home'（杰克和托尼在家）。"},{"question":"对比一下，'in the park' 和 'at home' 是同一个地方吗？","hint":"公园和家是两个不同的地方。","takeaway":"这两个地点完全不同，因此题干陈述与原文事实不符，是错误的。"}]},{"title":"识别句子核心要素","steps":[{"question":"一个完整的句子通常包含“谁(Who)”、“做什么(What)”、“在哪里(Where)”等要素。请分析一下问题句子中的这几个要素分别是什么？","hint":"Who: Jacky and Tony; What: are having lunch; Where: in the park.","takeaway":"句子要素是：人物是杰克和托尼，事件是吃午饭，地点是在公园。"},{"question":"现在，请在原文中核对这三个要素。哪一个要素与原文不符？","hint":"原文中人物和事件都对，但地点对吗？","takeaway":"地点要素不符，原文是 'at home'，而题干是 'in the park'。"}]},{"title":"理解介词的重要性","steps":[{"question":"短语 'at home' 和 'in the park' 都是由什么词开头的？它们在句子中起什么作用？","hint":"'at' 和 'in' 都是介词。它们组成的短语用来描述地点。","takeaway":"它们都是介词短语，用作地点状语，说明动作发生的地点。"},{"question":"为什么准确理解这些小小的介词短语在阅读中如此重要？","hint":"想象一下，如果把 'The meeting is at 10 am' 错理解成 'The meeting is in 10 minutes'，会发生什么？","takeaway":"介词短语常常定义了时间、地点、方式等核心信息，理解错误会导致对整个事实的误判，因此必须给予足够重视。"}]}]}},{"number":"B.2","item_type":"reading","context_note":"Passage B","stem":"Tony doesn't want to buy any beef because he has no money.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"此题为判断正误题。题干称托尼不想买牛肉的原因是“他没有钱”（because he has no money）。阅读原文，当杰克让托尼去买牛肉时，托尼给出的理由是“我太累了”（'I'm so tired'）。题干陈述的原因与原文信息直接矛盾。因此，该陈述是错误的。","knowledge_expansion_md":"### 1. 细节推理与因果关系判断\n在阅读理解中，包含 `because` 的句子是考察因果关系判断的常见题型。考生需要注意：\n- **核对事实**：解题时，首先要核对 `because` 所引导的原因是否与原文信息一致。如果题干陈述的原因在原文中并未出现或与原文矛盾，那么该陈述就是错误的。\n- **区分“陈述原因”与“真实原因”**：在更复杂的文本中，有时角色会为了自己的目的说出不真实的原因（即“借口”）。这时需要根据上下文、人物性格和故事情节来判断其真实动机。但在本题中，题干陈述的原因本身就是错误的，我们无需进行更深层次的推理。\n\n### 2. 关键词：`because`\n`because` 引导原因状语从句。要判断整个句子的真伪，最关键的一步是验证这个因果逻辑链是否符合原文提供的信息。","socratic_tracks":[{"title":"核对事实信息","steps":[{"question":"题干说 Tony 不想买牛肉的原因是什么？","hint":"请看 'because' 后面的部分。","takeaway":"题干陈述的原因是 'he has no money' (他没有钱)。"},{"question":"现在，请回到原文，找到 Jacky 让 Tony 买牛肉后，Tony 是怎么回答的？","hint":"原文写着：'I'm so tired,' Tony says.","takeaway":"原文中 Tony 给出的理由是 'I'm so tired' (我太累了)。"},{"question":"对比一下，题干说的原因和原文说的原因一样吗？","hint":"一个是“没钱”，一个是“太累了”。","takeaway":"两个原因完全不同。题干陈述了一个与原文不符的原因，因此是错误的。"}]},{"title":"理解因果关系题","steps":[{"question":"对于一个包含 'because' 的判断题，最直接的解题方法是什么？","hint":"我们是应该先猜测人物动机，还是先核对事实？","takeaway":"最直接、最可靠的方法是：首先核对 'because' 前后的事件和原因是否与原文描述一致。"},{"question":"在这个题目里，'because' 后面的原因在原文中出现过吗？","hint":"原文有提到 'money' 这个词吗？","takeaway":"原文完全没有提到 'money' 或 'no money'。这使得题干的陈述与原文毫无关联，因此是错误的。"}]}]}},{"number":"B.3","item_type":"reading","context_note":"Passage B","stem":"Tony says he can't cook well.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为判断正误题。题干意为“托尼说他做饭做得不好”。阅读原文，当杰克请托尼做饭时，托尼回答：“You know. I am not good at cooking,”（你知道的，我不太擅长做饭）。题干 “Tony says he can't cook well” 是对托尼原话的准确转述。因此，该陈述是正确的。","knowledge_expansion_md":"### 1. 区分“事实陈述”与“言论转述”\n在阅读理解中，这是一个非常重要的细节区分点。\n- **事实陈述 (Fact Statement)**：例如 `Tony can't cook well.` (Tony 做饭不好)。要判断其真伪，需要文章中有客观证据支持。\n- **言论转述 (Reported Speech)**：例如 `Tony says he can't cook well.` (Tony 说他做饭不好)。要判断其真伪，只需要在文章中找到 Tony 是否说过类似的话，而不管这句话本身是真是假。\n\n### 2. 动词 `say`, `tell`, `speak`, `talk` 的辨析\n- `say`: 强调“说”的内容，常用于直接引语和间接引语。格式为 `say sth.` 或 `say that...`。\n- `tell`: 强调“告诉”这个动作，后面通常要跟宾语（告诉谁）。格式为 `tell sb. sth.` 或 `tell sb. that...`。\n- `speak`: 侧重“说”的能力或动作本身，或指讲某种语言。如 `speak English`。\n- `talk`: 侧重“交谈”的过程。如 `talk with sb.`。","socratic_tracks":[{"title":"定位关键证据","steps":[{"question":"题干是 “Tony says he can't cook well.”。我们需要验证的是什么？","hint":"是 Tony 的厨艺水平，还是他所说的话？","takeaway":"我们需要验证 Tony 是否“说过”他做饭不好，这由关键词 'says' 决定。"},{"question":"请在原文中找到 Jacky 请 Tony 做饭的段落，看看 Tony 是怎么回答的？","hint":"原文是：'You know. I am not good at cooking,' Tony answers.","takeaway":"原文中 Tony 明确说了 'I am not good at cooking'。"},{"question":"对比一下 Tony 的原话和题干的陈述，它们的意思一样吗？","hint":"'I am not good at cooking' 和 'he can't cook well' 意思相近吗？","takeaway":"意思基本一致。题干是对 Tony 原话的正确转述，所以这个句子是正确的（True）。"}]},{"title":"事实与言论的辨析","steps":[{"question":"请比较这两句话有什么不同：(A) Tony can't cook well. (B) Tony says he can't cook well.","hint":"第一句是在评价一个人的能力，第二句是在转述一个人的话。","takeaway":"A 句是关于 Tony 厨艺的“事实”判断，而 B 句是关于 Tony “言论”的转述。"},{"question":"我们能从文章中100%确定 Tony 真的不会做饭吗？","hint":"他有没有可能只是在找借口？","takeaway":"我们不能100%确定。他可能只是为了偷懒而找借口。但我们能100%确定的是，他“说过”他不会做饭。这就是为什么题干B是正确的。"}]}]}},{"number":"B.4","item_type":"reading","context_note":"Passage B","stem":"Jacky cooks beef and cuts bread at last.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为判断正误题。根据故事的逻辑，Tony 拒绝了买牛肉和做饭的所有请求。在只有两个角色的情况下，既然 Tony 不做，那么这些事情自然就落到了另一个人——Jacky 的身上。题干描述“Jacky 最后做了牛肉，切了面包”，这完全符合故事的合理推断。关键词“at last”（最后，终于）也暗示了这是在经历了一系列波折（即 Tony 的不断推脱）之后发生的最终结果。因此，这个陈述是正确的。","knowledge_expansion_md":"### 1. 故事的顺序与逻辑链\n阅读理解不仅是理解单个句子，更是要构建整个故事的逻辑链。解此题的关键在于：\n- **角色对比**：文中塑造了两个性格鲜明的角色，懒惰的 Tony 和勤劳的 Jacky。他们的性格决定了他们的行为。\n- **情节推进**：Tony 的“不做”直接导致了 Jacky 的“做”。这是一个清晰的行动链。\n- **时间状语**：`at last`, `finally`, `in the end` 等词汇是重要的信号词，标志着事件的结局或顺序的最后一步，通常是解题的关键线索。\n\n### 2. 一般现在时讲述故事\n在英语中，尤其是在概括、评述或判断题中，常常使用一般现在时来描述书本、电影或故事中的情节，这被称为“历史现在时”(Historic Present)。例如，`In the story, Jacky cooks beef...` 这样的用法是完全正确的，即使故事本身可能用过去时叙述。","socratic_tracks":[{"title":"故事线索梳理","steps":[{"question":"在故事的前半部分，我们知道 Tony 拒绝了做什么？","hint":"他拒绝了和食物准备有关的所有事情。","takeaway":"Tony 拒绝了买牛肉和做饭。"},{"question":"如果 Tony 什么都不做，而故事里又要准备牛肉和面包，那么这些工作由谁来完成呢？","hint":"故事里除了 Tony，另一个主要角色是谁？","takeaway":"既然 Tony 不做，那么只能由 Jacky 来完成所有工作。"},{"question":"题干说“Jacky at last (最后) ...”，这个“at last”用在这里合适吗？它暗示了什么？","hint":"“at last” 意味着“终于”，通常指在经历了一些困难或等待之后。","takeaway":"非常合适。“at last” 暗示了 Jacky 是在经历了 Tony 的一番推脱之后，才最终独自完成了所有工作，符合故事逻辑。"}]},{"title":"动作与执行者分析","steps":[{"question":"题干描述了哪两个动作？这两个动作的执行者是谁？","hint":"找到句子中的动词 (verbs) 和主语 (subject)。","takeaway":"动作是 “cooks” (做饭) 和 “cuts” (切)，执行者是 “Jacky”。"},{"question":"这个“动作-执行者”的组合，与我们对故事的理解是否一致？","hint":"想一想，是勤劳的 Jacky 做事，还是懒惰的 Tony 做事，更符合故事设定？","takeaway":"完全一致。由勤劳的 Jacky 来完成所有工作，这正是故事通过角色对比要表达的。"}]},{"title":"上下文推断","steps":[{"question":"即使文章没有一句话一字不差地写着 “Jacky cooks beef and cuts bread at last”，我们能判断这个题干是正确的吗？为什么？","hint":"阅读理解中的信息不一定都是直接给出的，有些需要我们根据上下文进行合理的推断。","takeaway":"可以。因为这是基于文中已有信息（Tony 不做事，Jacky 在场）得出的唯一合乎逻辑的结论。"},{"question":"这种根据已知信息推断未知信息的能力，在英语学习中重要吗？","hint":"想一想，我们平时和人交流，是不是也经常需要“听懂弦外之音”？","takeaway":"非常重要。这叫做“推理能力”(Inference)，是阅读理解高级能力的体现，能帮助我们理解字里行间作者未直接言明的深层含义。"}]}]}},{"number":"B.5","item_type":"reading","context_note":"Passage B","stem":"Tony is a good boy.","options":{"A":"True","B":"False","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题为判断正误题，考查对人物性格的评价。一个“good boy”（好孩子）通常被认为是诚实的、乐于助人的、有责任感的。然而，在整个故事中，Tony 的行为恰恰相反：他为了逃避任务而找借口（可能还撒了谎），表现出懒惰、自私和不合作的态度。他的行为与“好孩子”的品质完全不符。因此，这个对 Tony 的评价是错误的。本题要求学生根据角色的言行，做出符合普世价值观的正确判断。","knowledge_expansion_md":"### 1. 人物性格分析 (Character Analysis)\n这是阅读文学性语篇（如故事、寓言）的一项核心技能。做这类题时，可以遵循以下步骤：\n- **收集证据**：找出描写该角色的关键词、对话和行为描述。\n- **贴上标签**：根据收集到的证据，用一些性格形容词（如 `lazy`, `hard-working`, `honest`, `selfish`, `helpful`）来描述角色。\n- **进行判断**：将题干中的评价与你分析得出的角色性格进行对比，判断是否相符。\n\n### 2. 故事的寓意 (Moral of the Story)\n很多小故事，尤其是寓言，都旨在传递一个道理或教训。这个故事很可能改编自《小红母鸡》(The Little Red Hen) 的模型，其寓意在于赞扬勤劳、分享，批评懒惰、自私。理解了故事的寓意，就能轻易地判断出作者对 Tony 的批判态度，从而否定“他是个好孩子”的说法。","socratic_tracks":[{"title":"定义与判断","steps":[{"question":"在我们心中，一个“good boy”（好孩子）应该具备什么样的品质？","hint":"可以从诚实、勤劳、乐于助人等方面来想。","takeaway":"一个“好孩子”通常是诚实、勤劳、乐于助人、有责任感的。"},{"question":"回顾故事，Tony 的行为表现出了这些品质中的任何一个吗？","hint":"他有没有帮助 Jacky？他说的话（比如没钱）是真的吗？","takeaway":"没有。Tony 的行为恰恰相反，他找借口、不合作，表现出懒惰和自私。"},{"question":"那么，将 Tony 的行为与“好孩子”的标准对比，你得出的结论是什么？","hint":"他的行为符合还是不符合“好孩子”的定义？","takeaway":"结论是：题干 “Tony is a good boy” 的评价是错误的。"}]},{"title":"作者意图与寓意","steps":[{"question":"你认为作者写这个故事，是想表扬 Tony，还是想批评他？","hint":"故事里，谁的行为最终解决了问题？谁的行为在制造麻烦？","takeaway":"作者通过对比 Jacky 的勤劳和 Tony 的懒惰，显然是在批评 Tony 的行为。"},{"question":"这个故事可能想教给我们一个什么道理？","hint":"这个道理是关于勤劳与懒惰的。","takeaway":"故事的寓意是赞扬勤劳合作，批评懒惰自私。"},{"question":"既然作者的意图是批评懒惰，那么题干说 Tony 是个“好孩子”，这与作者的意图是否一致？","hint":"作者想表达的观点和题目的评价是相同的还是相反的？","takeaway":"不一致。这个评价与作者的批判意图完全相悖，因此是错误的。"}]},{"title":"基于文本证据","steps":[{"question":"如果我们要证明“Tony 不是一个好孩子”，我们能在文章中找到哪些证据？","hint":"请列举出 Tony 的具体言行。","takeaway":"证据包括：他拒绝买牛肉，并以“没钱”为借口；他拒绝做饭，并以“不会做”为借口。"},{"question":"反过来，我们能在文章中找到支持“Tony 是一个好孩子”的证据吗？","hint":"Tony 在故事里做过任何一件值得表扬的事吗？","takeaway":"根据故事的逻辑，文章中没有任何证据能支持 Tony 是个“好孩子”。"},{"question":"当一个判断在文中找不到任何支持证据，反而有大量相反的证据时，我们应该如何判断？","hint":"在阅读理解中，一切判断都应以原文为准。","takeaway":"任何缺乏文本证据支持、甚至与文本信息相悖的判断，都应被视为错误。"}]}]}}]},{"section_title":"V. 写作","section_instruction":"（共 20 分）","items":[{"number":"1","item_type":"writing","context_note":"","stem":"新的学期将要开始，你即将进入初中，你有什么计划和安排呢？请用英文介绍一下，题目为“My New School Life”。要求：字迹工整，60词左右。","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"I am very excited about my new school life in junior high. I have some plans. First, I want to make many new friends and learn from them. Second, I am going to join the basketball club because I love playing sports. Most importantly, I will study hard, especially in English and math. I hope I can get good grades and have a wonderful time in the new school.","explanation_md":"这篇范文结构清晰，采用了“总—分—总”的写作模式。开头句直接点题，表达对新学期生活的期待。主体部分使用 “First”, “Second”, “Most importantly” 等顺序词，从“交友”、“课外活动”、“学习”三个方面有条理地阐述了具体计划。结尾句总结全文，表达了美好的祝愿和希望。全文时态运用准确，主要使用一般将来时（will/be going to）来描述计划，语言简洁流畅，符合题目要求。","knowledge_expansion_md":"### 1. 表达未来计划的常用时态\n\n在描述未来的计划和安排时，我们通常使用两种时态：\n\n*   **be going to + 动词原形**：常用于表示已经经过思考和安排的、比较确定的计划。例如：`I am going to join the basketball club.` (我已经想好了要参加篮球社)。\n*   **will + 动词原形**：常用于表达意愿、决心或临时做出的决定。例如：`I will study hard.` (这表达了一种决心)。\n\n在写作中，可以交替使用这两种时态，使表达更自然。\n\n### 2. 校园生活常用词汇与短语\n\n*   **学习方面**: `get good grades` (取得好成绩), `major in` (主修), `do well in...` (在...方面做得好), `improve my English` (提高我的英语), `take notes` (记笔记)。\n*   **社交与活动**: `make friends with sb.` (和某人交朋友), `get along with classmates` (和同学相处融洽), `join a club` (参加社团), `take part in activities` (参加活动), `extracurricular activities` (课外活动)。\n*   **个人成长**: `be more independent` (变得更独立), `develop a new hobby` (培养一个新爱好), `challenge myself` (挑战自我)。\n\n### 3. 写作连接词\n\n为了让文章更有条理，可以使用一些连接词来组织观点：\n\n*   **列举顺序**: `First/Firstly`, `Second/Secondly`, `Finally/Lastly`\n*   **补充说明**: `In addition` (此外), `Besides` (而且), `What's more` (更重要的是)\n*   **强调**: `Most importantly` (最重要的是), `Above all` (首先)","socratic_tracks":[{"title":"未来计划的时态表达","steps":[{"question":"当我们要用英语描述对未来的计划时，通常会用到哪两种主要的时态结构？","hint":"想想表示“将要”的两种常见方式，一个与 'going' 有关，一个与 'will' 有关。","takeaway":"表达未来计划常用 “will + 动词原形” 和 “be going to + 动词原形” 这两种结构。"},{"question":"范文中，“I am going to join the basketball club” 和 “I will study hard” 都表示计划，你觉得它们在语气上有什么细微差别吗？","hint":"哪一句听起来更像是已经提前想好的具体安排，哪一句更像是在表达一种决心或意愿？","takeaway":"“be going to” 倾向于描述已经计划好的安排，而 “will” 常用于表达决心、意愿或即时决定。"},{"question":"现在，请你用这两种时态分别造一个关于你初中计划的句子，并说说你为什么选择用这个时态。","hint":"想一个你已经决定好的计划（比如参加某个社团），再想一个你下定决心要做到的事情（比如每天阅读）。","takeaway":"根据计划的确定性和表达的侧重点（是安排还是决心）来选择使用 'will' 或 'be going to'，可以让你的表达更地道。"}]},{"title":"丰富你的校园计划","steps":[{"question":"范文中提到了交友、参加社团和学习三个计划。除了这些，你还能想到哪些可以让初中生活更精彩的计划？","hint":"可以从个人成长（比如学新技能）、班级贡献（比如竞选班干部）等方面来思考。","takeaway":"初中生活计划可以很多元，比如竞选班干部、参加志愿者活动、学习一门乐器等。"},{"question":"“I will study hard” 这个表达有点笼统。如果我们想让“努力学习”这个计划更具体，可以怎么说？比如，你想在英语学习上有所突破。","hint":"试着描述具体的学习行为，比如“读更多的书”、“练习口语”等。","takeaway":"将笼统的计划具体化，如用 “I will read more English stories” 或 “I will practice speaking English every day” 来代替 “I will study English hard”，能让文章内容更充实。"},{"question":"范文用 “Most importantly” 来强调学习的重要性。如果你的几个计划是同等重要的，除了用 “First”, “Second”，还可以用什么词来连接它们？","hint":"想想表示“此外”、“而且”的词或短语。","takeaway":"使用 “In addition”, “Besides”, “What's more” 等连接词，可以丰富文章的逻辑层次，让列举的要点显得更自然。"}]},{"title":"短文的“总-分-总”结构","steps":[{"question":"一篇好的作文就像一个汉堡包，有“顶层面包”、“中间的肉和菜”和“底层面包”。你能在范文中找到这三个部分吗？它们分别是什么？","hint":"“顶层面包”是开头，“肉和菜”是中间的具体内容，“底层面包”是结尾。","takeaway":"文章的开头（总起）、主体（分述）和结尾（总结）构成了清晰的“总-分-总”结构。"},{"question":"在“中间的肉和菜”这部分，作者用了什么方法让自己的计划清单看起来井井有条，而不是一团乱麻？","hint":"注意文中的 “First”, “Second”, “Most importantly” 这几个词。","takeaway":"使用 “First”, “Second” 等顺序词，可以清晰地列举要点，使文章主体部分逻辑分明、条理清晰。"},{"question":"为什么即使是60词左右的短文，也推荐使用“总-分-总”结构？这对读者和你自己有什么好处？","hint":"对读者来说，是不是更容易抓住重点？对你来说，是不是更容易组织思路，避免想到哪写到哪？","takeaway":"清晰的结构能帮助作者快速构思、防止跑题，也能让读者轻松理解文章的核心思想，是高效沟通的关键。"}]}]}}]}],"content_markdown":"### 成都某西川中学 2026 级新初一入学真卷英语\n**(满分：100分 时间：60分钟)**\n\n#### I. 单项选择\n*从 A, B, C 三个选项中选择正确的答案。（共 20 分）*\n\n1. The basketball player _____ up early in the morning every day.\n   A. get\n   B. gets\n   C. got\n\n2. I _____ a book. It's Learn Chinese in Four Weeks.\n   A. looking for\n   B. found\n   C. looked\n\n3. These _____ are pretty.\n   A. duck\n   B. shoes\n   C. apple\n\n4. I am 50 kilograms. My brother is 55 kilograms. He is _____ than me.\n   A. 5 kg heavier\n   B. 5 kg thinner\n\n5. _____ careful!\n   A. Are\n   B. Is\n   C. Be\n\n6. _____ there any pocket money in your bag?\n   A. Is\n   B. Are\n   C. Were\n\n7. —Is this the computer room?\n   —_____\n   A. No, it is.\n   B. Yes, it isn't.\n   C. No, it isn't.\n\n8. There _____ some penguins in the sea.\n   A. are\n   B. have\n   C. is\n\n9. I'm nine _____ old.\n   A. year\n   B. years\n   C. month\n\n10. _____ are some pigs behind the table.\n    A. This\n    B. These\n    C. There\n\n#### II. 选出与画线词不同类的一项\n*（共 10 分）*\n\n1. A. pilot\n   B. teach\n   C. doctor\n\n2. A. rainy\n   B. have\n   C. sunny\n\n3. A. card\n   B. duck\n   C. dog\n\n4. A. heavy\n   B. tall\n   C. fish\n\n5. A. flew\n   B. became\n   C. is\n\n#### III. 连词成句\n*（共 10 分）*\n\n1. is, office, my, post, There, home, a, near (.)\n   __________________________________________________\n\n2. girl, Can, near, a, the, you, see, river (?)\n   __________________________________________________\n\n3. are, mine, bigger, than, Your, feet (.)\n   __________________________________________________\n\n4. wakes, up, me, the, My, mother, morning, at 6:30, in (.)\n   __________________________________________________\n\n5. like, you, Would, cake, a (?)\n   __________________________________________________\n\n#### IV. 完形填空\n*（共 20 分）*\n\nDo you like to shop on the Internet? Things online are very cheap. I often get __1__ online. Let me tell you how to buy one when I want to know something about a book. Firstly, I write an e-mail to the online shop. Then they will __2__ me some pictures of the book. I think this is very helpful. Online shops are __3__ open. I can do the shopping even at midnight if I want to. Real shops usually close __4__ nine o'clock in the evening.\nAfter you __5__ the online shopkeeper what you want, you can have your things in a few days. When you go shopping in a shopping mall, you have to talk __6__ with the shopkeeper and walk a lot. I don't like it, because I get tired __7__.\nI am teaching my grandmother __8__ online. She cannot walk very far (远), __9__ it is easy for her to shop online. My brother wants to learn how to do it too. He is very __10__ most of the time. When he has a little free time, he can shop online. So you see, shopping online saves time.\n\n1. A. These\n   B. books\n   C. food\n   D. toys\n\n2. A. tell\n   B. show\n   C. give\n   D. sell\n\n3. A. sometimes\n   B. often\n   C. always\n   D. usually\n\n4. A. in\n   B. on\n   C. at\n   D. for\n\n5. A. spend\n   B. pay\n   C. cost\n   D. buy\n\n6. A. a lot of\n   B. much\n   C. lots of\n   D. many\n\n7. A. easy\n   B. easily\n   C. happy\n   D. happily\n\n8. A. why to shop\n   B. where to shop\n   C. how to shop\n   D. when to shop\n\n9. A. because\n   B. for\n   C. so\n   D. but\n\n10. A. healthy\n    B. free\n    C. lazy\n    D. busy\n\n#### V. 阅读理解\n*（共 20 分）*\n\n**A**\n\nChildren all like to play with snow at Christmas. But the climate (气候) is changing quickly. The weather in winter is getting warmer and warmer. And it doesn't snow in some places in southern England. Sometimes it's hard for children there to have a white Christmas. Many children want to have snow to play with.\nBut the children in a hospice (收容所) get a big surprise. They have a white Christmas. A rich man called Chris Hopkins bought 10,000 kilos of snow on the Internet for them.\nMr Hopkins said, \"The children here are unhappy. They are so young, but they have no father or mother to look after them. All children enjoy Christmas with snow and presents. I feel very happy when I find the snow brings smiles to their faces.\"\n\n1. Mr Hopkins _____.\n   A. is a rich man\n   B. is a kind old man\n   C. often visits hospices\n   D. often buys things\n\n2. The children in the hospice are not happy because _____.\n   A. they are too young\n   B. they have no father or mother with them\n   C. they have no snow to play with\n   D. they have no money to buy presents\n\n3. Mr Hopkins bought snow _____.\n   A. in a shopping mall\n   B. on the Internet\n   C. from Father Christmas\n   D. from northern England\n\n4. The underlined word \"changing\" in the first line (行) means \"_____\" in Chinese.\n   A. 零花钱\n   B. 改变\n   C. 下降\n   D. 移动\n\n5. Which of the following is TRUE?\n   A. It doesn't snow in northern England these years.\n   B. The climate doesn't change much in England.\n   C. \"A white Christmas\" is a Christmas with snow.\n   D. Mr Hopkins likes to play with snow.\n\n**B**\n\nOne day, Jacky and Tony are at home. It is lunch time. Jacky says, \"There is some money. Please go and buy some beef.\" \"I'm so tired,\" Tony says. Jacky must do it by himself. \"Here's the beef. Can you cook it?\" Jacky asks. \"You know. I am not good at cooking,\" Tony answers. So, Jacky must do it by himself again. \"Cut the bread, please,\" Jacky says. \"I don't want to do it,\" says Tony. At last, when the meal is ready, Jacky asks Tony to have the meal. \"Well, I will have it,\" answers Tony, \"I don't like saying 'No' all the time.\"\n\n*判断下列句子是否符合短文内容，符合的用“T”表示，不符合的用“F”表示。*\n\n1. Jacky and Tony are having lunch in the park today.\n\n2. Tony doesn't want to buy any beef because he has no money.\n\n3. Tony says he can't cook well.\n\n4. Jacky cooks beef and cuts bread at last.\n\n5. Tony is a good boy.\n\n#### VI. 写作\n*（共 20 分）*\n\n新的学期将要开始，你即将进入初中，你有什么计划和安排呢？请用英文介绍一下，题目为“My New School Life”。要求：字迹工整，60词左右。\n\n__________________________________________________\n\n__________________________________________________\n\n__________________________________________________\n\n__________________________________________________\n","proofread_notes":"1. 卷面含“扫码看视频”等营销性内容，已删除。\n2. 题型已根据内容校对，其中完形填空题型规范为 `cloze`。\n3. 阅读理解部分，每篇短文仅在第一题前呈现全文，后续小题使用简短引注。为区分篇目，小题分别编号为 A.1-A.5 和 B.1-B.5。\n4. 部分选择题为三选项，已按四选项格式补充空选项；单项选择第4题C选项因卷面模糊无法识别，已留空。\n5. II. '选出与画线词不同类的一项' 大题，卷面无画线词，实际为'选不同类项'（Odd one out），已按卷面保留标题并在本处注明。","set_number":9,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_09\\page_019.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_09\\page_020.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":41},{"step":2,"name":"verify","items":41,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":41}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T13:32:31.316780+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  function isFillBlankQuizType(t) {
