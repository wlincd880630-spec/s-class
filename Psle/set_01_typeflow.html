ourite subject is geography. At school, we have many rules—don't be noisy, don't eat in class... I think they are good for us.\nAfter school we have no homework, so we have free time to do interesting things. I join the music club because I like music. On Wednesday afternoon I go to the club. There I play the piano for two hours. I like animals and my favourite animals are giraffes. I think they are beautiful. There's a zoo near my home so I often go there on weekends.\nI like making friends. Do you want to be my friend? Please write to me!","items":[{"number":"31","item_type":"reading","context_note":"","stem":"How does Jenny go to school?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____________________","teaching":{"correct_answer":"By bus.","explanation_md":"此题是一道阅读理解问答题，询问“Jenny 是如何去上学的？”。问题以 `How` 开头，是典型的对方式、方法的提问。根据题干关键词 `How` 和 `go to school`，可以在文章第一段定位到关键句：`...I take the bus to school.`。这句话明确说明了 Jenny 的上学方式是乘公交车。因此，答案是 `By bus.` 或 `She goes to school by bus.`。","knowledge_expansion_md":"### 询问和回答交通方式\n\n**1. 提问方式：**\n*   `How do/does + 主语 + go to + 地点?`\n    *   例：`How do you go to work?` (你怎样去上班？)\n\n**2. 回答方式：**\n*   **`By + 交通工具`** (名词为单数，且前面无冠词 a/an/the)\n    *   `by bus` (乘公交车)\n    *   `by car` (乘小汽车)\n    *   `by train` (乘火车)\n    *   `by subway` (乘地铁)\n    *   `by plane` (乘飞机)\n*   **`On foot`** (步行) - 这是一个固定搭配，必须用 `on`。\n*   **`Take/Ride + (a/an/the) + 交通工具`**\n    *   `take a bus` (乘一辆公交车)\n    *   `ride a bike` (骑自行车)\n\n**易错点**：`by` 后面直接加交通工具名词，不加冠词；而 `take` 或 `ride` 后面通常需要冠词。`by walk` 是错误表达，应用 `on foot`。","socratic_tracks":[{"title":"识别问题类型","steps":[{"question":"这个问题是以哪个疑问词开头的？","hint":"句子的第一个词是 H-o-w。","takeaway":"问题以 'How' 开头，通常是询问方式或方法。"},{"question":"结合后面的 'go to school'，整个问题是在问关于上学的什么信息？","hint":"是问上学的时间，地点，还是方式？","takeaway":"这是一个典型的询问“如何去上学”，即交通方式的问题。"}]},{"title":"定位关键信息","steps":[{"question":"要在文章中找到答案，我们应该寻找哪些关键词？","hint":"想想“去学校”和表示交通工具的词。","takeaway":"我们应该在文章中寻找 'go to school' 以及 'bus', 'bike', 'car', 'on foot' 等词语。"},{"question":"找到相关句子后，如何提炼出最核心的答案？","hint":"问题问的是 'How'，所以答案的核心是方式本身。","takeaway":"答案可以直接用 'By + 交通工具' 或一个完整的句子来回答，关键是明确指出交通方式。"}]},{"title":"交通方式表达法","steps":[{"question":"如果我们想说“乘公交车”，除了 'take a bus'，还有哪种更简洁的介词短语表达方式？","hint":"使用介词 by。","takeaway":"我们可以用 'by bus' 来表示“乘公交车”。"},{"question":"那“步行”去上学怎么说？也是用 by 吗？","hint":"这是一个特殊的固定搭配，用另一个介词 on。","takeaway":"“步行”的表达是 'on foot'，这是一个需要特殊记忆的固定搭配。"}]}]}},{"number":"32","item_type":"reading","context_note":"","stem":"How many classes does Jenny have a day at school?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____________________","teaching":{"correct_answer":"Six.","explanation_md":"此题是一道阅读理解问答题，询问“Jenny 在学校一天上几节课？”。问题以 `How many` 开头，是针对数量的提问。根据题干关键词 `classes` 和 `a day`，可以在文章第一段定位到相关信息：`We have four classes in the morning. In the afternoon we have two classes.`。将上午和下午的课程数量相加 (4 + 2 = 6)，即可得出 Jenny 一天有六节课。因此，答案是 `Six.` 或 `She has six classes.`。","knowledge_expansion_md":"### 询问和回答数量\n\n**1. 提问方式：**\n*   `How many + 可数名词复数 + do/does + 主语 + have?`\n    *   例：`How many books do you have?` (你有多少本书？)\n*   `How many + 可数名词复数 + are there + 地点/时间?`\n    *   例：`How many students are there in your class?` (你们班有多少学生？)\n\n**2. 回答方式：**\n*   **直接回答数字**：`Seven.` / `About twenty.`\n*   **用完整句子回答**：`She has seven classes.` / `There are forty students in our class.`\n\n**词汇辨析**：`class` vs. `lesson`\n*   在“课程”这个意义上，两者常可互换，都指一节课。`I have a math lesson/class at 9.`\n*   `class` 还可以指“班级”或“（全体）同学”。`My class is very friendly.` (我的班级非常友好。)","socratic_tracks":[{"title":"识别问题类型","steps":[{"question":"这个问题是以哪两个词开头的？","hint":"H-o-w m-a-n-y。","takeaway":"问题以 'How many' 开头，是用来询问可数名词的数量。"},{"question":"它具体在问什么东西的数量？","hint":"看 'How many' 后面的名词。","takeaway":"这个问题在问 'classes' (课) 的数量。"}]},{"title":"定位关键信息","steps":[{"question":"为了回答这个问题，我们应该在文章中寻找哪些关键词？","hint":"除了 'classes'，还有什么词可能表示‘课’？还有表示时间的词 'a day'。","takeaway":"我们应该寻找 'classes', 'lessons', 'a day' 以及相关的数字。"},{"question":"文章中分别提到了上午和下午的课程数量，我们应该如何处理这些数字来回答问题？","hint":"问题问的是 'a day' (一天) 的总数。","takeaway":"我们需要将上午的四节课和下午的两节课相加，得到一天的总课程数。"}]},{"title":"数量问答句型","steps":[{"question":"当别人问你 'How many books do you have?'，你最简单的回答是什么？","hint":"直接说出数量就可以。","takeaway":"对于 'How many' 的提问，最简洁的回答是直接给出数字。"},{"question":"如果想用一个完整的句子来回答 'How many classes does Jenny have?'，主语和谓语应该用什么？","hint":"问题中的主语是 Jenny，助动词是 does，所以回答时动词要用第三人称单数形式。","takeaway":"完整的回答应该是 'She has...'，注意主语是第三人称单数，谓语动词用 has。"}]}]},"correct_answer":"Six."},{"number":"33","item_type":"reading","context_note":"","stem":"What's Jenny's favourite subject?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____________________","teaching":{"correct_answer":"Her favourite subject is geography.","explanation_md":"这是一道细节理解题，询问珍妮最喜欢的科目是什么。\n根据题干中的关键词 “favourite subject”（最喜欢的科目），我们可以在文章第一段定位到关键句：`My favourite subject is geography.`。\n句中的 “My” 指的就是讲述者珍妮（Jenny）。\n因此，我们可以直接得出答案：珍妮最喜欢的科目是地理。\n在回答这类问答题时，使用完整的句子作答会更规范，所以答案是 “Her favourite subject is geography.”。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **核心词汇 (Vocabulary)**\n    *   `favourite` (adj./n.) 最喜欢的（东西）。英式拼写为 `favourite`，美式拼写为 `favorite`。\n    *   `subject` (n.) 科目。常见科目有：`Chinese` (语文), `Maths` (数学), `English` (英语), `Science` (科学), `P.E.` (Physical Education, 体育), `Music` (音乐), `Art` (美术)。\n\n2.  **提问与回答 (Question & Answer)**\n    *   提问某人最喜欢什么，常用句型：`What's your/his/her favourite ...?`\n    *   回答句型：`My/His/Her favourite ... is ...`。\n    *   例如：`What's your favourite color?` (你最喜欢的颜色是什么？) `My favourite color is blue.` (我最喜欢的颜色是蓝色。)\n\n3.  **阅读技巧 (Reading Skill)**\n    *   对于此类询问具体信息的题目（`Wh-`问题），应采用“查读法”（Scanning）。\n    *   首先，从问题中提取关键词（如本题的 `favourite subject`）。\n    *   然后，带着关键词快速浏览文章，定位到包含这些词语或其同义词的句子，从而找到答案。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"这个问题问的是什么具体信息？","hint":"注意题目中的 “What” 和 “favourite subject”。","takeaway":"问题是在问“珍妮最喜欢的科目是什么”。"},{"question":"我们应该在文章中寻找哪些关键词来快速找到答案？","hint":"可以直接从问题中找核心词汇。","takeaway":"我们应该在文章中寻找 “favourite” 和 “subject” 这两个词。"},{"question":"在文章第一段，包含这两个关键词的句子是什么？","hint":"仔细阅读第一段的每一句话。","takeaway":"关键句是 “My favourite subject is geography.”。"},{"question":"根据这个句子，我们可以得出什么答案？注意回答时的人称转换。","hint":"文章中的 “My” 指的是珍妮，回答时应该用 “Her”。","takeaway":"珍妮最喜欢的科目是地理，完整的回答是 “Her favourite subject is geography.”。"}]},{"title":"问答句式转换","steps":[{"question":"题目 “What's Jenny's favourite subject?” 是一个特殊疑问句，它的基本结构是怎样的？","hint":"疑问词 + be动词/助动词 + 主语 + ...?","takeaway":"它的结构是 “疑问词(What) + is + 主语(Jenny's favourite subject)”。"},{"question":"在回答这类问题时，我们通常会把主语放在句首，构成一个陈述句。请试着构建回答的句子框架。","hint":"可以这样开始：\"Jenny's favourite subject is...\"。","takeaway":"回答的句子框架是 “Her favourite subject is ...”。"},{"question":"结合我们在文章中找到的信息“geography”，如何组成一个完整的回答？","hint":"将信息填入上一步的句子框架中。","takeaway":"完整的回答是 “Her favourite subject is geography.”。"}]},{"title":"相关词汇拓展","steps":[{"question":"除了 “favourite”，你还知道哪些表达“喜欢”或“最喜欢”的词或短语？","hint":"比如 “like ... best” 或者 “be fond of ...”。","takeaway":"表达喜欢的词语有 “like ... very much”, “love”, “be fond of”, “be keen on”, “like ... best” 等。"},{"question":"你能用 “like ... best” 来改写句子 “Geography is her favourite subject” 吗？","hint":"主语需要换成 “She”。","takeaway":"可以改写为 “She likes geography best.”。"}]}]},"correct_answer":"Her favourite subject is geography."},{"number":"34","item_type":"reading","context_note":"","stem":"When does Jenny go to the music club?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____________________","teaching":{"correct_answer":"She goes to the music club on Wednesday afternoon.","explanation_md":"这是一道关于时间信息的细节题，询问珍妮参加音乐俱乐部的具体时间。\n题干的关键词是 “When”（何时）和 “music club”（音乐俱乐部）。\n我们需要在文章中快速定位 “music club” 这个词组，并查找相关的时间信息。\n在文章第二段中，我们找到了关键句：`On Wednesday afternoon I go to the club.`\n这句话明确说明了她去音乐俱乐部的时间是“在周三下午”。\n回答问题时，需要将第一人称 “I” 转换为第三人称 “She”，同时动词 “go” 也要相应地变为 “goes”。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **核心语法 (Grammar): 时间介词**\n    *   提问时间的疑问词是 `When`。\n    *   回答时常用介词 `on`, `in`, `at` 来表示时间，用法需区分：\n        *   `on` + 具体某一天 / 特定日期 / 特定某一天的上、下午（如 `on Monday`, `on May 1st`, `on Wednesday afternoon`）。\n        *   `in` + 年 / 月 / 季节 / 泛指的上、下午、晚上（如 `in 2024`, `in May`, `in the morning`）。\n        *   `at` + 具体时刻 / 固定时间点（如 `at 8 o'clock`, `at noon`, `at night`）。\n\n2.  **一般现在时第三人称单数 (Simple Present - 3rd Person Singular)**\n    *   当主语是第三人称单数（如 `he`, `she`, `it`, `Jenny`）时，一般现在时中的动词通常需要变化。\n    *   大部分动词在词尾加 `-s`（如 `likes`, `plays`）。\n    *   以 `-s, -x, -sh, -ch, -o` 结尾的动词，在词尾加 `-es`（如 `goes`, `watches`, `teaches`）。\n    *   以“辅音字母 + y”结尾的动词，变 `y` 为 `i` 再加 `-es`（如 `study` -> `studies`）。\n\n3.  **词汇辨析 (Vocabulary)**\n    *   `on Wednesday afternoon`: 特指某个周三的下午。\n    *   `on Wednesday afternoons`: 指“每逢周三下午”，表示一种规律性的活动。在描述课外活动等固定安排时，使用复数形式更常见。","socratic_tracks":[{"title":"定位时间信息","steps":[{"question":"这个问题在问什么？注意开头的疑问词 “When”。","hint":"“When” 是用来提问时间的。","takeaway":"这个问题在问珍妮“什么时候”去音乐俱乐部。"},{"question":"为了找到答案，我们应该在文章中寻找哪个关键的活动名称？","hint":"问题中提到了一个俱乐部。","takeaway":"我们应该寻找关键词 “music club”。"},{"question":"在文章第二段找到 “music club” 了吗？与它相关的时间信息是什么？","hint":"看看包含 “music club” 的整个句子。","takeaway":"关键句是 “On Wednesday afternoon I go to the club.”，时间信息是 “On Wednesday afternoon”。"}]},{"title":"时间介词的用法","steps":[{"question":"为什么答案用介词 “on” (On Wednesday afternoon)，而不是 “in” 或者 “at”？","hint":"想一想表示“在具体某一天”时，我们应该用哪个介词？","takeaway":"因为介词 “on” 用于具体的某一天或特定日期的上/下午/晚上。"},{"question":"如果我们想说“在早上”，应该用哪个介词？","hint":"这是一个泛指的时间段。","takeaway":"泛指“在早上/下午/晚上”时，我们用 “in the morning/afternoon/evening”。"},{"question":"如果我们想说“在八点钟”，又该用哪个介词？","hint":"这是一个非常具体的时间点。","takeaway":"表示具体的时刻时，我们用 “at”，例如 “at 8 o'clock”。"}]},{"title":"人称与动词变化","steps":[{"question":"原文用的是 “I go...”，为什么我们的答案要用 “She goes...”？","hint":"想一想文章的叙述者是谁，而问题问的又是谁？","takeaway":"因为文章是珍妮用第一人称 “I” 叙述，而问题是关于她（She）的事情，所以需要转换人称。"},{"question":"当主语从 “I” 变成 “She” 时，为什么动词 “go” 要变成 “goes”？","hint":"这是一般现在时中，主语为第三人称单数时的动词变化规则。","takeaway":"因为主语是第三人称单数 “She”，动词 “go” 需变为第三人称单数形式 “goes”。"},{"question":"为什么 “go” 是加 “-es” 而不是 “-s”？","hint":"回忆一下以字母 “o” 结尾的动词的变形规则。","takeaway":"以 -o, -s, -x, -sh, -ch 结尾的动词，在主语为第三人称单数时，词尾需要加 “-es”。"}]}]},"correct_answer":"She goes to the music club on Wednesday afternoon."},{"number":"35","item_type":"reading","context_note":"","stem":"What does Jenny think of giraffes?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____________________","teaching":{"correct_answer":"She thinks they are beautiful.","explanation_md":"这是一道关于观点态度的细节题，询问珍妮对长颈鹿的看法。\n题干的关键词是 “What ... think of”（如何看待）和 “giraffes”（长颈鹿）。\n我们需要在文章中寻找表达珍妮观点和感受的词句。\n在文章第二段，我们找到了直接表达观点的句子：“I think they are beautiful.”（我认为它们很漂亮）。\n根据这句话，将 “I think” 替换为 “She thinks”，即可得到答案。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **核心句型 (Sentence Pattern): 询问观点**\n    *   `What + do/does + 主语 + think of + ...?` 是一个常用句型，用于询问某人对某事/物的看法或意见。\n    *   例如：`What do you think of the movie?` (你觉得这部电影怎么样？)\n    *   回答时常用 `I/He/She think(s) ...` 或 `I feel ...`，也可以直接用 `It is / They are + 形容词` 来描述。\n\n2.  **核心词汇 (Vocabulary): 描述性形容词**\n    *   `tall` (adj.) 高的，通常指身高。\n    *   `beautiful` (adj.) 漂亮的，美丽的。\n    *   `gentle` (adj.) 温顺的，文雅的。\n    *   `long` (adj.) 长的。\n    *   `high` (adj.) 高的，通常指位置、高度。注意与 `tall` 的区别：`a tall tree` (一棵高大的树) vs. `a high mountain` (一座高山)。\n\n3.  **阅读技巧 (Reading Skill): 理解观点态度**\n    *   在阅读时，要特别留意文中表达观点、情感或评价的词语。\n    *   标志性词语包括 `think`, `feel`, `believe`, `in my opinion` 等。\n    *   描述性的形容词（如 `good`, `bad`, `interesting`, `boring`, `beautiful`）也直接反映了作者或人物的态度。","socratic_tracks":[{"title":"提取观点信息","steps":[{"question":"这个问题在问什么？注意 “What ... think of” 这个句型。","hint":"这个句型是用来询问看法的。","takeaway":"问题是在问“珍妮认为长颈鹿怎么样”。"},{"question":"我们应该在文章中寻找哪些词语来定位答案？","hint":"可以寻找表示“认为”的词，以及描述动物的形容词。","takeaway":"我们应该寻找 “think” 这个词，以及描述 “giraffes” 的形容词。"},{"question":"在文章第二段，珍妮用了哪个词来描述她对长颈鹿的看法？","hint":"仔细阅读 “I think they are beautiful.” 这句话。","takeaway":"她用了 “beautiful”（漂亮的）这个形容词。"},{"question":"如何将这个信息整合成一个完整的句子来回答问题？","hint":"以 “She thinks...” 开头，并加上找到的形容词。","takeaway":"完整的回答是 “She thinks they are beautiful.”。"}]},{"title":"询问观点的句型","steps":[{"question":"“What does Jenny think of giraffes?” 这个句型是用来做什么的？","hint":"它是用来问别人的想法或意见。","takeaway":"这个句型用于询问某人对特定事物的看法。"},{"question":"如果我想问你“你觉得成都怎么样？”，我应该怎么用英语提问？","hint":"套用 “What do you think of ...?” 句型。","takeaway":"可以问：“What do you think of Chengdu?”"},{"question":"回答这类问题时，除了用 “I think...”，还可以用哪些方式来表达？","hint":"可以直接描述这个事物，比如 “It is...”。","takeaway":"还可以用 “I feel...”, “In my opinion...”, 或者直接用 “It's / They're + 形容词” 来回答。"}]},{"title":"描述性词汇辨析","steps":[{"question":"在知识拓展中，我们学习了 “tall” 和 “high” 两个表示“高”的词。它们在使用上有什么区别吗？","hint":"一个常用于形容生物的身高，另一个常用于形容物体的位置高度。","takeaway":"“tall” 通常指人或细长物体（如树、建筑）自身的高度，而 “high” 通常指物体所在的位置或达到的高度（如山、飞机）。"},{"question":"我们应该说 “a tall building” 还是 “a high building”？","hint":"形容建筑物本身的高度。","takeaway":"两者都可以，但 “a tall building” 更侧重于建筑的细长和高耸感。"},{"question":"那我们应该说 “The kite is flying tall” 还是 “The kite is flying high”？","hint":"形容风筝飞行的位置。","takeaway":"应该说 “The kite is flying high”，因为它描述的是风筝所在的高度。"}]}]}}]}],"content_markdown":"# 成都某嘉祥外国语学校初2026级新初一入学考试英语试卷\n\n**满分：60分**\n**时间：50分钟**\n\n## I. 完形填空 (共10分)\n\nIt's the day before school starts. Mum takes her three little boys, Jim, Bob and Tom, shopping _____1_____ clothes and school things. There are so many people in the shopping centre. “Stay with me,” Mum says. But it doesn't _____2_____ a long time for her kids to go here and there.\nJim would like a new shirt, but he doesn't know his _____3_____, so he asks for help. While his mother is trying to ask for a small shirt, Bob goes away. He is _____4_____ and runs to buy three bottles of cola, because they are _____5_____ sale. While Bob is _____6_____ a pair of shoes, Mum can't find Tom. He sees his classmate Jack _____7_____ so he goes to talk with him. While Tom is _____8_____ a schoolbag from different colours, Mum can't find Jim and Bob, either. They drink too much cola and go to the bathroom.\nIt's seven when they get home. Mum is really _____9_____. She gets a pen and then _____10_____ one rule (规定) on the list of “Family Rules” —Shop with one boy each time.\n\n1. _____\n    A. for\n    B. and\n    C. so\n    D. or\n\n2. _____\n    A. cost\n    B. take\n    C. pay\n    D. spend\n\n3. _____\n    A. size\n    B. colour\n    C. favorite\n    D. price\n\n4. _____\n    A. hungry\n    B. thirsty\n    C. angry\n    D. sad\n\n5. _____\n    A. for\n    B. in\n    C. on\n    D. at\n\n6. _____\n    A. looking at\n    B. looking for\n    C. looking after\n    D. looking into\n\n7. _____\n    A. sadly\n    B. quickly\n    C. happily\n    D. easily\n\n8. _____\n    A. taking\n    B. choosing\n    C. showing\n    D. finding\n\n9. _____\n    A. silly\n    B. lonely\n    C. tired\n    D. afraid\n\n10. _____\n    A. collects\n    B. gets\n    C. says\n    D. writes\n\n## II. 阅读理解 (共20分)\n\n**Passage A**\n\nJoris Hutchissen, a young boy, loves cheetahs (非洲猎豹). He was upset to learn that the big animals might be in great danger. “When he was six, he was reading a book about cheetahs. The book says cheetahs could be in great danger. He got very upset,” said Joris' mother.\nJoris asked his mum what he could do to help. They got in touch with a wildlife sanctuary (野生动物保护中心) in Africa. Joris began raising money. He sold T-shirts, flowers and juice. He held yard sales and skating parties. “I'm just a normal kid. I only want to do something to save them,” Joris said.\nSo far, he has raised more than $14,000. The money is used to buy special collars (项圈). The collars <u>track</u> the cheetahs. This helps protect them from being killed. Joris has also visited the sanctuary in Africa. He has spent three summers volunteering there. “We need to raise awareness (意识) and tell people what's happening,” Joris says. “I've learned that everyone can make a difference, even if you're just a kid!” says Joris. “You just have to start somewhere.”\n\n11. How did Joris learn that cheetahs are in great danger?\n    A. His mother told him.\n    B. He learned it from a book.\n    C. His teacher told him.\n    D. He learned it from a piece of news.\n\n12. What does the underlined word “track” mean?\n    A. 追踪\n    B. 赛跑\n    C. 停下\n    D. 复制\n\n13. Where did Joris spend three summers in order to help save cheetahs?\n    A. In Africa.\n    B. In America.\n    C. In Australia.\n    D. In Russia.\n\n14. The passage tells us that _____.\n    A. cheetahs are in great danger\n    B. we should do something meaningful\n    C. kids can also make a difference\n    D. parents should help kids do something good\n\n15. The passage is probably from a _____.\n    A. notice board\n    B. school newspaper\n    C. fashion magazine\n    D. guidebook\n\n**Passage B**\n\nDo you want to stay young? Do you know how to stay young? Here's some advice (建议).\nForget some numbers. The numbers are about your age, <u>weight</u> and height (身高). Let the doctor worry about them. That's why you pay him or her.\nMake happy friends. People who are bright and happy should be your friends. Their happiness may help you change (改变) your bad mood (情绪), and your life will be better.\nKeep learning. Learn more about the computer, gardening or others. Don't stop using your mind. Take an interest in the world around you, and learn at least one new thing every day. Learning makes you become very clever.\nKeep healthy. Do more exercise and eat healthy food to keep healthy. If there is something wrong, go to see the doctor.\nThere are many other ways to stay young, such as enjoying the simple things, laughing often, having a walk often, telling people you love them and so on.\n\n16. Who can help you change your bad mood according to the passage?\n    A. Serious and scared people.\n    B. Bright and happy people.\n    C. Young and beautiful people.\n    D. Tall and strong people.\n\n17. The underlined word “weight” means “_____” in Chinese.\n    A. 知识\n    B. 习惯\n    C. 朋友\n    D. 体重\n\n18. If you want to become smart (聪明的), you should _____.\n    A. make happy friends\n    B. forget some numbers\n    C. laugh often\n    D. learn something new every day\n\n19. Which of the following is NOT true according to the passage?\n    A. To have a healthy body, people should do more exercise.\n    B. When people don't feel well, they shouldn't see a doctor.\n    C. Health can help you stay young.\n    D. People should eat healthy food.\n\n20. Which of the following is the best title?\n    A. Enjoy the Simple Things\n    B. Tell People Your Love\n    C. How to Stay Young\n    D. Why to Help Others\n\n## III. 选词填空 (共10分)\n\n从方框中选择合适的词汇，并用其适当形式填空。每词限用一次。（方框中有两个多余选项）\n\nleave, opposite, beach, hurry, nothing, enjoy, fresh\n\n21. Today is Sunday. I have _____ to do.\n\n22. What about going swimming? The children are looking forward to _____ themselves on Children's Day.\n\n23. Yalong Bay in Sanya is one of the most beautiful _____ in China.\n\n24. Tom got up late this morning and he _____ to work.\n\n25. The bookshop _____ the supermarket is popular with the children.\n\n## IV. 词汇运用 (共10分)\n\n根据句意及汉语提示，填写恰当的单词。\n\n26. Jane's first _____ (小学) was near her house.\n\n27. What is your _____ (最喜欢的) sport?\n\n28. My _____ (号码) is 942-381.\n\n29. There are nine _____ (百) students in this school.\n\n30. My father, a great writer, made his dream come true at the age of _____ (四十).\n\n## V. 阅读问答 (共10分)\n\n阅读下面短文，根据所提供的信息回答问题。要求答案语法正确，语义完整切题。\n\nHello! I'm Jenny Brown. Do you want to know about my life in England? Let me tell you. I have classes from Monday to Friday. School usually starts at nine o'clock. My home is a little far from my school so I take the bus to school. We have four classes in the morning. In the afternoon we have two classes. We have English, P.E., geography, history... My favourite subject is geography. At school, we have many rules—don't be noisy, don't eat in class... I think they are good for us.\nAfter school we have no homework, so we have free time to do interesting things. I join the music club because I like music. On Wednesday afternoon I go to the club. There I play the piano for two hours. I like animals and my favourite animals are giraffes. I think they are beautiful. There's a zoo near my home so I often go there on weekends.\nI like making friends. Do you want to be my friend? Please write to me!\n\n31. How does Jenny go to school?\n\n_____________________\n\n32. How many classes does Jenny have a day at school?\n\n_____________________\n\n33. What's Jenny's favourite subject?\n\n_____________________\n\n34. When does Jenny go to the music club?\n\n_____________________\n\n35. What does Jenny think of giraffes?\n\n_____________________\n","proofread_notes":"1. 卷面整体整洁，未发现二维码、公众号等无关营销信息。\n2. 统一了各部分题型名称，使其更规范。例如，将“完形填空+短文理解”修正为“完形填空”，将“阅读表达”修正为“阅读理解”，将“书面表达...”修正为“阅读问答”。\n3. 在 Section II（阅读理解）中，根据题干要求，为文章中的关键词“track”和“weight”添加了下划线标识。\n4. 在 Section III（选词填空）中，原卷说明“每词只能用一遍”不完全准确，因为部分词汇需要进行词形变换。已将说明修正为“用其适当形式填空”，并调整 item_type 为 `fill_blank`。\n5. 在 Section IV（词汇运用）中，第26题的汉语提示“小学”与单数名词的填空要求存在一定歧义，已按原样保留，但需注意此潜在问题。\n6. 在 Section V（阅读问答）中，原标题“书面表达：根据所给短文，续写短文”与实际的问答题型严重不符，已修正为“阅读问答”，并调整了说明文字。","set_number":1,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_01\\page_006.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_01\\page_007.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":35},{"step":2,"name":"verify","items":35,"check_passed":false,"issues_count":3},{"step":3,"name":"polish","items":35}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T11:23:52.361241+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
  <script>
  const EXAM = JSON.parse(document.getElementById("exam-embed").textContent);

  const INLINE_CFG = {
    deepseekKey: "sk-daa16008e81843deba6fefe9dce51465",
    azureKey: "3C2ai7PPgPnOLlhb1c7gBw207PAVNfVJni6JnESsPjYPaVyFeQ9YJQQJ99CGAC3pKaRXJ3w3AAAYACOG0Zbc",
    azureRegion: "eastasia",
  };

  let modalWordForTts = "";

  function hasDeepseekKey() {
    const k = String(INLINE_CFG.deepseekKey || "").trim();
    return k.length >= 8;
  }

  async function deepseekChat(userContent, maxTokens) {
    if (!hasDeepseekKey()) {
      throw new Error("未配置 DeepSeek API Key");

    const r = await fetch("https://api.deepseek.com/chat/completions", {

      headers: {
        "Content-Type": "application/json",

    let data = {};
    try { data = await r.json(); } catch (e) { /* ignore */ }

      const msg = (data.error && data.error.message) || data.detail || r.statusText || "请求失败";
      throw new Error(msg);
    }
    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return (c || "").trim();
  }

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    choice: "单项选择",
    cloze: "完形填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    other: "其他题型",
  };
  const TYPE_ORDER = ["choice", "cloze", "reading", "sentence_transform", "writing", "fill_blank", "other"];

  const state = {
    flat: [],
    byType: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + examSanitizePassageRich(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
    });
  }

  function typeLabel(t) { return TYPE_LABELS[t] || t || "其他"; }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "reading") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        groups.push({ passage: pickReadingPassageBody(slice), rows: slice });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupDetailsByReadingPassage(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const row = details[i].row;
      if (row.type !== "reading") {
        groups.push({ passage: "", details: [details[i]] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, details: details.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "reading") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = details.slice(i, j);
        const sliceRows = slice.map((d) => ({ it: d.row.it }));
        groups.push({ passage: pickReadingPassageBody(sliceRows), details: slice });
        i = j;
      } else {
        groups.push({ passage: "", details: [details[i]] });
        i++;
      }
    }
    return groups;
  }

  function groupFillBlankBySectionInstruction(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const ins = String(rows[i].section_instruction || "").trim();
      let j = i + 1;
      while (j < rows.length && String(rows[j].section_instruction || "").trim() === ins) j++;
      groups.push({ instruction: ins, rows: rows.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function groupDetailsByClozeSection(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const ins = String(details[i].row.section_instruction || "").trim();
      let j = i + 1;
      while (j < details.length) {
        if (String(details[j].row.section_instruction || "").trim() !== ins) break;
        j++;
      }
      groups.push({ passage: details[i].row.section_instruction || "", details: details.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function clozeAnswerWordFromItem(it) {
    const teach = it.teaching || {};
    const opts = it.options && typeof it.options === "object" ? it.options : {};
    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";
    const caUp = caRaw.toUpperCase().charAt(0);
    if ("ABCD".indexOf(caUp) >= 0) {
      const tx = String(opts[caUp] || "").trim();
      if (tx) return tx;
    }
    return caRaw;
  }

  function clozeNumToAnswerMap(detailsPairs) {
    const map = Object.create(null);
    detailsPairs.forEach(({ row }) => {
      const it = row.it;
      const n = String(it.number || "").trim();
      if (!n) return;
      const w = clozeAnswerWordFromItem(it);
      map[n] = w;
      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
    });
    return map;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");
        }
        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);
  }

  function renderStemHtml(stem, qkey) {
    if (!stem) return "<p class='stem'></p>";
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + esc(stem).replace(/\n/g, "<br>") + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += esc(chunk).replace(/\n/g, "<br>");
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;
  }

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：练习/PDF/讲解中整段不展示 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));
  }

  /** 左侧已有文章的完形小题：仅展示对齐的 A–D，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || row.type !== "cloze") return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    if (isClozeDialoguePlaceholderStem(it && it.stem)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const abcd = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim());
    if (abcd.length) return { letters: abcd, opts: raw };
    if (typ === "cloze") {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (stem && sectionLooksTrueFalse(row) && (typ === "reading" || typ === "choice")) {
      return {
        letters: ["T", "F"],
        opts: { T: "（正确）", F: "（错误）" },
      };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  /** 完形练习页：A→B→C 纵向，仅输出有内容的项 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    const order = ["A", "B", "C", "D"];
    let h = "";
    order.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!letters.includes(L) || !tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  function quizOptsGridClass(letters, opts) {
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
    return "opts opts-cols-" + c;
  }

  function renderTransformStemHtml(stem, qkey) {
    if (!stem) {
      return "<p class='stem'><span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='0' autocomplete='off' /></span></p>";
    }
    if (/_{3,}/.test(stem)) return renderStemHtml(stem, qkey);
    return (
      "<p class='stem'>" +
      esc(stem).replace(/\n/g, "<br>") +
      " <span class='blank-line'><input type='text' data-k='" +
      esc(qkey) +
      "' data-bi='0' autocomplete='off' placeholder='作答' /></span></p>"
    );
  }

  function parseTransformAnswerParts(ca) {
    return String(ca || "").split("|").map((s) => s.trim());
  }

  /** 讲解页：句型转换题干，用正确答案填入空格并高亮（与完形「填入答案」样式一致） */
  function buildTransformFilledStemHtml(stem, ca) {
    const parts = parseTransformAnswerParts(ca);
    const stemStr = String(stem || "");
    const blankPh = "—";
    const spanAns = (w) =>
      "<span class='cloze-filled-ans'>" + esc(w && String(w).trim() ? w : blankPh) + "</span>";

    if (!stemStr.trim()) {
      const w = String(ca || "").trim() || parts.filter(Boolean).join(" | ") || blankPh;
      return "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" + spanAns(w) + "</div>";
    }

    if (/_{3,}/.test(stemStr)) {
      const chunks = stemStr.split(/_{3,}/);
      let h = "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>";
      const n = chunks.length - 1;
      for (let i = 0; i < chunks.length; i++) {
        h += esc(chunks[i]).replace(/\n/g, "<br>");
        if (i < n) {
          const w = i < parts.length ? parts[i] : "";
          h += spanAns(w);
        }
      }
      h += "</div>";
      return h;
    }

    const tail =
      String(ca || "").trim() ||
      (parts.length ? parts.filter(Boolean).join(" | ") : "") ||
      blankPh;
    return (
      "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" +
      esc(stemStr).replace(/\n/g, "<br>") +
      " " +
      spanAns(tail) +
      "</div>"
    );
  }

  function renderOpenAnswerStem(stem, qkey, rowType, quizType) {
    const isTf = rowType === "sentence_transform" || quizType === "sentence_transform";
    if (isTf) return renderTransformStemHtml(stem, qkey);
    return renderStemHtml(stem, qkey) + "<textarea class='area' data-k='" + esc(qkey) + "' rows='6' placeholder='在此作答（多空用 | 分隔）'></textarea>";
  }

  function orderedTypesList() {
    return Object.keys(state.byType)
      .filter((x) => (state.byType[x] || []).length > 0)
      .sort((a, b) => {
        const ia = TYPE_ORDER.indexOf(a);
        const ib = TYPE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
  }

  /** 生成某题型答题区 HTML（供页面与 PDF 共用） */
  function buildQuizBodyHtml(t) {
    const rows = state.byType[t] || [];
    const readingGroups = t === "reading" ? groupReadingByPassage(rows) : [];
    let html = "";
    if (t === "cloze" && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0])) return;
        const ins = g.instruction.trim();
        const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
        const sp = splitSectionHintAndBody(ins);
        const hintTop = sp.hint
          ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
          : "";
        const mainIns = sp.body || ins;
        const passageHtml = ins
          ? "<div class='cloze-passage-card card'><h2>" +
            esc(gTitle) +
            "</h2>" +
            hintTop +
            "<div class='cloze-passage-text'>" +
            formatPassageParagraphs(mainIns) +
            "</div></div>"
          : "<div class='cloze-passage-card card'><p class='muted'>（本篇暂无导语，请仅根据右侧选项作答。）</p></div>";
        let rightCol =
          "<div class='cloze-options-col'><h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>答题区</h2>";
        g.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          const diaGap = isClozeDialoguePlaceholderStem(it.stem);
          rightCol +=
            "<div class='card q-block cloze-opt-card" +
            (diaGap ? " cloze-dialogue-gap-card" : "") +
            "' data-qkey='" +
            esc(qkey) +
            "'><div class='q'>";
          if (diaGap) {
            rightCol += "<div class='cloze-dialogue-gap-badge'>" + esc(num) + ".</div>";
          } else {
            rightCol += "<div class='q-head'><span class='q-num'>第 " + esc(num) + " 空</span><span class='tag'>cloze</span></div>";
          }
          const layoutC = getObjectiveChoiceLayout(row, it);
          const lettersC = layoutC.letters;
          const optsC = layoutC.opts;
          const abcdOnly = isPassageClozeAbcdLayout(row, it);
          if (lettersC.length) {
            if (!diaGap && !abcdOnly) {
              rightCol += renderStemHtml(it.stem, qkey);
            }
            if (abcdOnly) {
              rightCol += "<div class='opts opts-cloze-abcd'>";
              rightCol += htmlQuizRadioOptionsAbcdGrid(lettersC, optsC, qkey);
            } else {
              rightCol += "<div class='" + quizOptsGridClass(lettersC, optsC) + "'>";
              rightCol += htmlQuizRadioOptions(lettersC, optsC, qkey);
            }
            rightCol += "</div>";
          } else {
            rightCol += renderStemHtml(it.stem, qkey);
          }
          rightCol += "</div></div>";
        });
        rightCol += "</div>";
        html +=
          "<div class='pdf-cloze-unit'><div class='cloze-quiz-layout'><div class='cloze-passage-col'>" +
          passageHtml +
          "</div>" +
          rightCol +
          "</div></div>";
      });
    } else if (t === "reading" && readingGroups.some((g) => g.passage)) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtml;
          if (g.fromSection) {
            const sp = splitSectionHintAndBody(g.passage);
            const hintHtml = sp.hint
              ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
              : "";
            const mainText = sp.body || g.passage;
            passageHtml =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              hintHtml +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(mainText) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passageHtml =
              "<div class='reading-passage-card card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          let rightCol = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            rightCol += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            rightCol += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            rightCol += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR = getObjectiveChoiceLayout(row, it);
            const lettersR = layoutR.letters;
            const optsR = layoutR.opts;
            if (lettersR.length) {
              rightCol += renderStemHtml(it.stem, qkey);
              rightCol += "<div class='" + quizOptsGridClass(lettersR, optsR) + "'>";
              rightCol += htmlQuizRadioOptions(lettersR, optsR, qkey);
              rightCol += "</div>";
            } else {
              rightCol += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            rightCol += "</div></div>";
          });
          rightCol += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtml +
            "</div>" +
            rightCol +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            html += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR2 = getObjectiveChoiceLayout(row, it);
            const lettersR2 = layoutR2.letters;
            const optsR2 = layoutR2.opts;
            if (lettersR2.length) {
              html += renderStemHtml(it.stem, qkey);
              html += "<div class='" + quizOptsGridClass(lettersR2, optsR2) + "'>";
              html += htmlQuizRadioOptions(lettersR2, optsR2, qkey);
              html += "</div>";
            } else {
              html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            html += "</div></div>";
          });
        }
      });
    } else if (t === "fill_blank" && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((fg) => {
        if (fg.instruction) {
          const sp = splitSectionHintAndBody(fg.instruction);
          const hintPart = sp.hint
            ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
            : "";
          const bankSrc = sp.body || fg.instruction;
          html +=
            "<div class='card word-bank-card' style='margin-bottom:1rem'>" +
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            hintPart +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(bankSrc).replace(/\n/g, "<br>") +
            "</div></div>";
        }
        fg.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          html += "<div class='card q-block' data-qkey='" + esc(qkey) + "'><div class='q'>";
          html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
          html += "<span class='tag'>" + esc(t) + "</span></div>";
          html += renderStemHtml(it.stem, qkey);
          html += "</div></div>";
        });
      });
    } else {
      rows.forEach((row) => {
        const it = row.it;
        const qkey = row.key;
        const num = String(it.number);
        html +=
          "<div class='card q-block" +
          (t === "reading" ? " reading-q-card" : "") +
          "' data-qkey='" +
          esc(qkey) +
          "'><div class='q'>";
        html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
        html += "<span class='tag'>" + esc(t) + "</span></div>";

        if (t === "reading" && (it.context_note || "").trim()) {
          html += "<div class='passage'>" + formatPassageParagraphs(it.context_note) + "</div>";
        }

        const layoutG = getObjectiveChoiceLayout(row, it);
        const lettersG = layoutG.letters;
        const optsG = layoutG.opts;
        if (lettersG.length) {
          html += renderStemHtml(it.stem, qkey);
          html += "<div class='" + quizOptsGridClass(lettersG, optsG) + "'>";
          html += htmlQuizRadioOptions(lettersG, optsG, qkey);
          html += "</div>";
        } else {
          html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
        }
        html += "</div></div>";
      });
    }
    return html;
  }

  /** 阅读材料中允许 &lt;u&gt;…&lt;/u&gt; 显示为下划线，其余 HTML 剥离 */
  function examSanitizePassageRich(p) {
    let t = String(p || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t.replace(/@@UON@@/g, "<u>").replace(/@@UOFF@@/g, "</u>");
  }

  function formatPassageParagraphsExam(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    return s
      .split(/\n+/)
      .map((x) => x.trim())
      .filter(Boolean)
      .map((para) => "<p class='exam-para'>" + examSanitizePassageRich(para).replace(/\n/g, "<br>") + "</p>")
      .join("");
  }

  function buildExamPaperStemPlain(stem) {
    const s = String(stem || "");
    return esc(s)
      .replace(/\n/g, "<br>")
      .replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
  }

  function buildExamPaperOptionsHtmlWithLayout(letters, opts) {
    const parts = [];
    letters.forEach((L) => {
      const tx = String((opts && opts[L]) || "").trim();
      if (!tx) return;
      parts.push("<span class='exam-opt-chip'><b>" + esc(L) + ".</b> " + esc(tx).replace(/\n/g, " ") + "</span>");
    });
    if (!parts.length) return "";
    const n = parts.length;
    const cls = n <= 4 ? "exam-opts-cols-" + n : "exam-opts-bank";
    return "<div class='exam-opts-row " + cls + "'>" + parts.join("") + "</div>";
  }

  /** 完形 PDF：多行表格，每行「题号 | A | B | C | (D)」，列对齐 */
  function buildExamPaperClozePdfGrid(rows) {
    if (!rows || !rows.length) return "";
    const hasD = rows.some((row) => {
      const o = getObjectiveChoiceLayout(row, row.it).opts;
      return String((o && o.D) || "").trim();
    });
    const order = hasD ? ["A", "B", "C", "D"] : ["A", "B", "C"];
    let h =
      "<div class='exam-cloze-pdf-grid" + (hasD ? " exam-cloze-pdf-grid-4opt" : "") + "'>";
    rows.forEach((row) => {
      const it = row.it;
      const num = String(it.number);
      const layout = getObjectiveChoiceLayout(row, it);
      const letters = layout.letters;
      const opts = layout.opts;
      h +=
        "<span class='exam-cloze-pdf-num'><span class='exam-n'>" +
        esc(num) +
        ".</span><span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span></span>";
      order.forEach((L) => {
        const tx = String((opts && opts[L]) || "").trim();
        if (letters.includes(L) && tx) {
          h += "<span class='exam-cloze-pdf-opt'><b>" + esc(L) + ".</b> " + esc(tx).replace(/\n/g, " ") + "</span>";
        } else {
          h += "<span class='exam-cloze-pdf-opt exam-cloze-pdf-opt-empty'></span>";
        }
      });
    });
    h += "</div>";
    return h;
  }

  function buildExamPaperOptionsHtml(opts) {
    const letters = ["A", "B", "C", "D"].filter((L) => String((opts && opts[L]) || "").trim());
    if (!letters.length) return "";
    return buildExamPaperOptionsHtmlWithLayout(letters, opts);
  }

  function buildExamPaperItemBlock(row, it, t) {
    const num = String(it.number);
    const layout = getObjectiveChoiceLayout(row, it);
    const letters = layout.letters;
    const opts = layout.opts;
    const itemCls = "exam-item" + (t === "reading" ? " exam-item-reading" : "");
    let block = "<div class='" + itemCls + "'>";
    if (letters.length) {
      block += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span>";
      block += "<span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span>";
      block += buildExamPaperStemPlain(it.stem) + "</div>";
      block += buildExamPaperOptionsHtmlWithLayout(letters, opts);
    } else {
      block += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span> ";
      block += buildExamPaperStemPlain(it.stem);
      if (t === "writing" || row.type === "writing") {
        block += "</div><div class='exam-answer-lines'></div>";
      } else {
        block += "</div>";
      }
    }
    block += "</div>";
    return block;
  }

  /** 标准纸笔考试排版（非网页练习样式） */
  function buildExamPaperSectionHtml(t) {
    const rows = state.byType[t] || [];
    if (!rows.length) return "";
    const readingGroups = t === "reading" ? groupReadingByPassage(rows) : [];

    if (t === "cloze" && rows.length) {
      let out = "";
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0])) return;
        const gTitle = String(g.rows[0].section_title || "").trim() || typeLabel(t);
        out += "<h2 class='exam-big-title'>" + esc(gTitle) + "</h2>";
        const ins = g.instruction.trim();
        if (ins) {
          const sp = splitSectionHintAndBody(ins);
          const mainText = sp.body || ins;
          out += "<div class='exam-passage-titled-wrap'>";
          if (sp.hint) {
            out += "<p class='exam-direction'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>";
          }
          out += "<div class='exam-passage-block'>" + formatPassageParagraphsExam(mainText) + "</div>";
          out += "</div>";
        }
        const allPassageAbcd =
          g.rows.length > 0 &&
          g.rows.every((row) => {
            const it = row.it;
            return (
              !isClozeDialoguePlaceholderStem(it.stem) &&
              isPassageClozeAbcdLayout(row, it) &&
              getObjectiveChoiceLayout(row, it).letters.length > 0
            );
          });
        if (allPassageAbcd) {
          out += buildExamPaperClozePdfGrid(g.rows);
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const num = String(it.number);
            const layoutZ = getObjectiveChoiceLayout(row, it);
            const lettersZ = layoutZ.letters;
            const optsZ = layoutZ.opts;
            const diaGapZ = isClozeDialoguePlaceholderStem(it.stem);
            const abcdOnlyZ = isPassageClozeAbcdLayout(row, it);
            out +=
              "<div class='exam-item exam-item-cloze" +
              (diaGapZ && lettersZ.length ? " exam-cloze-dialogue-gap" : "") +
              "'>";
            if (lettersZ.length) {
              if (diaGapZ) {
                out += "<span class='exam-dialogue-gap-num'>" + esc(num) + ".</span>";
                out += buildExamPaperOptionsHtmlWithLayout(lettersZ, optsZ);
              } else if (abcdOnlyZ) {
                out += buildExamPaperClozePdfGrid([row]);
              } else {
                out += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span>";
                out += "<span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span>";
                if (String(it.stem || "").trim()) {
                  out += buildExamPaperStemPlain(it.stem);
                }
                out += "</div>";
                out += buildExamPaperOptionsHtmlWithLayout(lettersZ, optsZ);
              }
            } else {
              out += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span> ";
              out += buildExamPaperStemPlain(it.stem || "_____") + "</div>";
            }
            out += "</div>";
          });
        }
      });
      return out;
    }

    const secTitle = String(rows[0].section_title || "").trim() || typeLabel(t);
    let h = "<h2 class='exam-big-title'>" + esc(secTitle) + "</h2>";

    if (t === "reading" && readingGroups.some((g) => g.passage)) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          h += "<div class='exam-reading-unit'>";
          if (g.fromSection) {
            const sp = splitSectionHintAndBody(g.passage);
            const mainText = sp.body || g.passage;
            h += "<div class='exam-passage-titled-wrap'>";

  function collectTypeAnswers() {
    const t = state.currentType;

    const out = {};
    rows.forEach((row) => {
      const k = row.key;
      const block = document.querySelector(".q-block[data-qkey=\"" + k.replace(/"/g, "") + "\"]");
      if (!block) return;
      const r = block.querySelector("input[type=radio]:checked");
      if (r) {
        out[k] = r.value;
        return;
      }
      const blankOne = block.querySelector("input.blank-input[data-k]");
      if (blankOne) {
        out[k] = blankOne.value.trim();
        return;
      }
      const blanks = block.querySelectorAll("input[data-k][data-bi]");
      if (blanks.length) {
        const bits = [];

        out[k] = bits.join("|");

      const ta = block.querySelector("textarea[data-k]");
      if (ta) out[k] = ta.value.trim();
    });
    return out;

  function normLetter(x) {
    return String(x || "").trim().toUpperCase().charAt(0);

  function normPipe(x) {
    return String(x || "")
      .split("|")
      .map((s) => s.trim().toLowerCase())

  function judge(row, userAns) {
    const it = row.it;
    const teach = it.teaching || {};
    const ca = teach.correct_answer || "";
    const typ = row.type;
    if (typ === "writing") return { open: true, ok: null, ca, userAns };
    if (["choice", "cloze", "reading"].includes(typ)) {
      const ok = ca && normLetter(userAns) === normLetter(ca);
      return { open: false, ok, ca, userAns };
    }
    const ok = ca && normPipe(userAns) === normPipe(ca);
    return { open: false, ok, ca, userAns };
  }

  function wrapEnglishWords(container) {
    if (!container || container.nodeType !== 1) return;
    const skip = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "PRE", "BUTTON"]);
    function walk(node) {
      if (node.nodeType === 1) {
        if (skip.has(node.tagName)) return;
        if (node.classList && node.classList.contains("wlink")) return;
        Array.from(node.childNodes).forEach(walk);
        return;
      }
      if (node.nodeType !== 3) return;
      const text = node.textContent;
      if (!text || !/\b[A-Za-z]/.test(text)) return;
      const parent = node.parentNode;
      if (!parent) return;
      const frag = document.createDocumentFragment();
      const re = /(\b[A-Za-z]+(?:[-'][A-Za-z]+)*\b)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const sp = document.createElement("span");
        sp.className = "wlink";
        sp.textContent = m[1];
        sp.title = "点击查看词义";
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      parent.replaceChild(frag, node);
    }
    try {
      walk(container);
    } catch (err) {
      console.warn("wrapEnglishWords:", err);
    }
  }

  function speechVoicesReady() {
    return new Promise((resolve) => {
      const syn = window.speechSynthesis;
      if (!syn) {
        resolve();
        return;
      }
      if (syn.getVoices().length) {
        resolve();
        return;
      }
      const done = () => resolve();
      syn.addEventListener("voiceschanged", done, { once: true });
      setTimeout(done, 600);
    });
  }

  function pickEnglishTtsVoice() {
    const syn = window.speechSynthesis;
    if (!syn) return null;
    const vs = syn.getVoices();
    return (
      vs.find((v) => /^en-US\b/i.test(v.lang || "")) ||
      vs.find((v) => /^en-GB\b/i.test(v.lang || "")) ||
      vs.find((v) => /^en\b/i.test(v.lang || "")) ||
      vs.find((v) => (v.lang || "").toLowerCase().startsWith("en")) ||
      null
    );
  }

  async function playTtsAzure(textPlain) {
    const t = stripForTts(textPlain).trim();
    if (!t) throw new Error("无朗读内容");
    const region = String(INLINE_CFG.azureRegion || "").trim();
    const key = String(INLINE_CFG.azureKey || "").trim();
    if (!region || !key || key.length < 8) throw new Error("未配置 Azure 区域或密钥");
    const url = "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1";
    const safe = xmlEscapeTts(t);
    const ssml =
      "<speak version='1.0' xml:lang='en-GB'>" +
      "<voice xml:lang='en-GB' name='en-GB-RyanNeural'>" +
      "<prosody rate='0.85'>" + safe + "</prosody></voice></speak>";
    const r = await fetch(url, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Ocp-Apim-Subscription-Key": key,
        "Content-Type": "application/ssml+xml",
        "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3",
      },
      body: ssml,
    });
    if (!r.ok) {
      const errText = await r.text();
      throw new Error("Azure " + r.status + " " + errText.slice(0, 120));
    }
    const buf = await r.arrayBuffer();
    const blob = new Blob([buf], { type: "audio/mpeg" });
    const u = URL.createObjectURL(blob);
    const a = new Audio(u);
    try {
      await a.play();
    } catch (playErr) {
      URL.revokeObjectURL(u);
      throw playErr;
    }
    await new Promise((resolve, reject) => {
      a.onended = () => {
        URL.revokeObjectURL(u);
        resolve();
      };
      a.onerror = () => {
        URL.revokeObjectURL(u);
        reject(new Error("音频播放失败"));
      };
    });
  }

  async function playTtsSpeechSynth(textPlain) {
    const t = stripForTts(textPlain).trim();
    if (!t) throw new Error("无朗读内容");
    const syn = window.speechSynthesis;
    if (!syn) throw new Error("当前浏览器不支持本机语音朗读");
    await speechVoicesReady();
    syn.cancel();
    return new Promise((resolve, reject) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "en-GB";
      u.rate = 0.85;
      const voice = pickEnglishTtsVoice();
      if (voice) u.voice = voice;
      u.onend = () => resolve();
      u.onerror = () => reject(new Error("本机朗读出错"));
      syn.speak(u);
    });
  }

  async function playTts(text) {
    const t = stripForTts(text).trim();
    if (!t) {
      alert("无朗读内容");
      return;
    }
    const fileLocal = location.protocol === "file:";
    const tryOrder = fileLocal
      ? [
          ["本机英文语音", playTtsSpeechSynth],
          ["Azure 在线语音", playTtsAzure],
        ]
      : [
          ["Azure 在线语音", playTtsAzure],
          ["本机英文语音", playTtsSpeechSynth],
        ];
    let lastErr = null;
    for (let i = 0; i < tryOrder.length; i++) {
      try {
        await tryOrder[i][1](t);
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    alert(
      "朗读未成功。\n\n" +
        (fileLocal
          ? "本地打开试卷时，浏览器无法直连 Azure（跨域限制），已优先尝试本机朗读。\n"
          : "已尝试在线语音与本机朗读。\n") +
        "最后错误：" +
        (lastErr && lastErr.message ? lastErr.message : "未知")
    );
  }

      }
    });

    parent.appendChild(card);
  }

  function renderLearn() {
    const t = state.currentType;
    const details = state.lastResults || [];
    const root = document.getElementById("learnBody");
    document.getElementById("learnTitle").textContent = typeLabel(t) + " · 讲解";
    root.innerHTML = "";

    if (t === "cloze") {
      groupDetailsByClozeSection(details).forEach((g) => {
        const row0 = g.details[0] && g.details[0].row;
        if (row0 && isClozeDialogueCompletionSection(row0)) return;
        const ins = (g.passage || "").trim();
        if (ins && g.details.length) {
          const filled = buildClozeFilledPassageHtml(g.passage, g.details);
          const wrap = document.createElement("div");
          wrap.className = "reading-learn-layout";
          wrap.innerHTML =
            "<div class='reading-learn-passage'>" +
            "<div class='card cloze-learn-block'>" +
            "<h2>完整原文</h2>" +
            "<p class='muted' style='margin:0 0 0.6rem'>下列为完形填空全文，空白处已填入<strong>正确答案</strong>并高亮显示。</p>" +
            "<div class='cloze-learn-passage'>" + formatPassageHtmlParagraphs(filled) + "</div></div></div>" +
            "<div class='reading-learn-cards-col'>" +
            "<h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>各题解析 · 选项讲解</h2></div>";
          const clozeCard = wrap.querySelector(".cloze-learn-block") || wrap.querySelector(".cloze-learn-passage");
          if (clozeCard) wrapEnglishWords(clozeCard);
          const col = wrap.querySelector(".reading-learn-cards-col");
          g.details.forEach((pair) => appendLearnCard(col, pair, t, false));
          root.appendChild(wrap);
        } else {
          g.details.forEach((pair) => appendLearnCard(root, pair, t, false));
        }
      });
      return;
    }

    if (t === "fill_blank" && details.length) {
      let fi = 0;
      while (fi < details.length) {
        const ins = String(details[fi].row.section_instruction || "").trim();
        let fj = fi + 1;
        while (fj < details.length && String(details[fj].row.section_instruction || "").trim() === ins) fj++;
        const slice = details.slice(fi, fj);
        if (ins) {
          const sp = splitSectionHintAndBody(ins);
          const wb = document.createElement("div");
          wb.className = "card word-bank-card";
          wb.style.marginBottom = "1rem";
          wb.innerHTML =
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            (sp.hint
              ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
              : "") +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(sp.body || ins).replace(/\n/g, "<br>") +
            "</div>";
          wrapEnglishWords(wb);
          root.appendChild(wb);
        }
        slice.forEach((pair) => appendLearnCard(root, pair, t, false));
        fi = fj;
      }
      return;
    }

    const readingLearnGroups = t === "reading" ? groupDetailsByReadingPassage(details) : [];
    const useReadingGroups = t === "reading" && readingLearnGroups.some((g) => g.passage);
    if (useReadingGroups) {
      readingLearnGroups.forEach((g) => {
        if (g.passage) {
          const wrap = document.createElement("div");
          wrap.className = "reading-learn-layout";
          let passInner;
          if (g.fromSection) {
            const sp = splitSectionHintAndBody(g.passage);
            const hintHtml = sp.hint
              ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
              : "";
            const mainText = sp.body || g.passage;
            passInner =
              "<div class='card'><h2>阅读材料</h2>" +
              hintHtml +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(mainText) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passInner =
              "<div class='card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          wrap.innerHTML =
            "<div class='reading-learn-passage'>" + passInner + "</div>" + "<div class='reading-learn-cards-col'></div>";
          const passCard = wrap.querySelector(".reading-learn-passage .card") || wrap.querySelector(".reading-passage-text");
          if (passCard) wrapEnglishWords(passCard);
          const col = wrap.querySelector(".reading-learn-cards-col");
          g.details.forEach((pair) => appendLearnCard(col, pair, t, true));
          root.appendChild(wrap);
        } else {
          g.details.forEach((pair) => appendLearnCard(root, pair, t, false));
        }
      });
    } else {
      details.forEach((pair) => appendLearnCard(root, pair, t, false));
    }
  }

  function renderHome() {
    const title = EXAM.school_or_title || "英语试卷";
    document.getElementById("homeTitle").textContent = title;
    document.title = title;

    const types = Object.keys(state.byType).sort((a, b) => {
      const ia = TYPE_ORDER.indexOf(a);
      const ib = TYPE_ORDER.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    let html = "";
    types.forEach((t) => {
      const rawRows = state.byType[t] || [];
      const n = t === "cloze" ? visibleClozeQuizRows(rawRows).length : rawRows.length;
      html += "<div class='type-card'><h2>" + esc(typeLabel(t)) + "</h2>";
      html += "<div class='meta'>共 " + n + " 道题 · 计时答题后可看讲解</div>";
      html += "<div class='type-card-actions'>";
      html += "<button type='button' class='btn primary btn-pick-type' data-type='" + esc(t) + "'>开始该题型</button>";
      if (t === "cloze") {
        html += "<a class='btn-link' href='set_01_review/cloze_review_quiz.html'>复习</a>";
        html += "<a class='btn-link' href='set_01_review/cloze_summary.html'>总结</a>";
      }
      if (t === "reading") {
        html += "<a class='btn-link' href='set_01_review/reading_review_quiz.html'>复习</a>";
        html += "<a class='btn-link' href='set_01_review/reading_summary.html'>总结</a>";
      }
      html += "</div></div>";
    });
    document.getElementById("typeGrid").innerHTML = html;
    document.querySelectorAll(".btn-pick-type").forEach((b) => {
      b.addEventListener("click", () => {
        state.currentType = b.getAttribute("data-type");
        showView("quiz");
        renderQuiz();
      });
    });
  }

  window.addEventListener("afterprint", () => {
    document.documentElement.classList.remove("pdf-printing");
    const ph = document.getElementById("printHost");
    if (ph) ph.innerHTML = "";
    if (pdfPrintTitleRestore != null) {
      document.title = pdfPrintTitleRestore;
      pdfPrintTitleRestore = null;
    }
  });

  document.getElementById("btnPdfFull").addEventListener("click", () => {
    const types = orderedTypesList();
    if (!types.length) {
      alert("暂无题目。");
      return;
    }
    runPrintPdf(types);
  });

  document.getElementById("btnPdfType").addEventListener("click", () => {
    const t = state.currentType;
    if (!t || !(state.byType[t] || []).length) {
      alert("当前题型无题目。");
      return;
    }
    runPrintPdf([t]);
  });

  document.getElementById("btnBackHome").addEventListener("click", () => {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    showView("home");
  });
  document.getElementById("btnBackHome2").addEventListener("click", () => showView("home"));
  document.getElementById("btnBackHome3").addEventListener("click", () => showView("home"));

  document.getElementById("btnSubmitType").addEventListener("click", () => {
    const t = state.currentType;
    if (!t) return;
    if (!confirm("确定提交本题型？提交后可查看结果与讲解。")) return;
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    state.answers[t] = collectTypeAnswers();
    renderResult();
    showView("result");
  });

  document.getElementById("btnGoLearn").addEventListener("click", () => {
    renderLearn();
    showView("learn");
  });

  const modalEl = document.getElementById("modal");
  document.getElementById("modalClose").addEventListener("click", () => {
    modalEl.classList.remove("open");
  });
  modalEl.addEventListener("click", (ev) => {
    if (ev.target === modalEl) modalEl.classList.remove("open");
  });

  document.getElementById("modalTtsWord").addEventListener("click", () => {
    if (modalWordForTts) playTts(modalWordForTts);
    else alert("请先点击题干或选项中的英文词");
  });

  buildFlat();
  renderHome();
  </script>
</body>
</html>
