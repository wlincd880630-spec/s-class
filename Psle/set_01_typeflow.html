<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .type-card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.55rem;
    }
    .type-card-actions a.btn-link {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      padding: 0.45rem 0.9rem;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .type-card-actions a.btn-link:hover {
      border-color: var(--accent);
      background: #f4f8f5;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第01套","exam_meta":{"full_score_text":"满分：60分","time_text":"时间：50分钟"},"sections":[{"section_title":"I. 完形填空 (共10分)","section_instruction":"It's the day before school starts. Mum takes her three little boys, Jim, Bob and Tom, shopping _____1_____ clothes and school things. There are so many people in the shopping centre. “Stay with me,” Mum says. But it doesn't _____2_____ a long time for her kids to go here and there.\nJim would like a new shirt, but he doesn't know his _____3_____, so he asks for help. While his mother is trying to ask for a small shirt, Bob goes away. He is _____4_____ and runs to buy three bottles of cola, because they are _____5_____ sale. While Bob is _____6_____ a pair of shoes, Mum can't find Tom. He sees his classmate Jack _____7_____ so he goes to talk with him. While Tom is _____8_____ a schoolbag from different colours, Mum can't find Jim and Bob, either. They drink too much cola and go to the bathroom.\nIt's seven when they get home. Mum is really _____9_____. She gets a pen and then _____10_____ one rule (规定) on the list of “Family Rules” —Shop with one boy each time.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"1. (为...而购物)","options":{"A":"for","B":"and","C":"so","D":"or"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配。`shop for sth.` 是一个固定短语，意为“为了买某物而去购物”。句意为：妈妈带着三个小男孩去购物，为他们买衣服和学习用品。因此，选项A `for` 符合题意。选项B `and`（和）不符合动词搭配；选项C `so`（所以）表示因果；选项D `or`（或者）表示选择，均不适用于此处。","knowledge_expansion_md":"### 并列连词用法辨析\n\n在英语中，有七个并列连词，可以用首字母缩写 **FANBOYS** 来记忆：\n- **F**or (因为): 表原因，相当于 because，但语气较弱，通常用于补充说明，且不能置于句首。例：He didn't go to the party, for he was tired.\n- **A**nd (和，并且): 表并列、递进。例：She is smart and beautiful.\n- **N**or (也不): 表否定，常与 neither 连用。例：He can neither read nor write.\n- **B**ut (但是): 表转折。例：He is poor but happy.\n- **O**r (或者，否则): 表选择。例：Would you like tea or coffee?\n- **Y**et (然而): 表转折，意思接近 but。例：The weather was cold, yet they went swimming.\n- **S**o (所以): 表结果。例：It was raining, so I took an umbrella.","socratic_tracks":[{"title":"固定搭配辨析","steps":[{"question":"动词 `shop` 在表示“去买某个东西”时，通常和哪个介词搭配？","hint":"比如，你想说“我去买菜了”，可以说 `I went shopping ___ groceries.`","takeaway":"`shop for sth.` 是一个固定搭配，表示“为了买……而购物”。"},{"question":"阅读原文，妈妈带孩子们去购物的目的是什么？","hint":"她要去买 `clothes and school things`。","takeaway":"购物的目的是买“衣服和学习用品”。"},{"question":"那么，为了表达“去买衣服和学习用品”这个目的，连接 `shopping` 和 `clothes` 的词应该是什么？","hint":"回顾第一步中的固定搭配。","takeaway":"应该使用介词 `for`，构成 `shopping for clothes and school things`。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"2. 花费（时间）","options":{"A":"cost","B":"take","C":"pay","D":"spend"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查表示“花费”的几个动词的用法区别。句型为 `It takes sb. time to do sth.`，意为“做某事花费了某人多长时间”。本句是否定形式，句意为“没过多久，孩子们就到处乱跑了”。主语是形式主语 `it`，宾语是时间 `a long time`，因此应该使用 `take`。`cost` 的主语通常是物；`spend` 和 `pay` 的主语通常是人。因此，选项B `take` 是正确答案。","knowledge_expansion_md":"### “花费”动词四兄弟：cost, spend, pay, take\n\n这四个动词都与“花费”有关，但用法各不相同，是考试中的高频考点。\n\n1.  **cost** (v.) 花费（金钱）\n    -   主语：物或事 (sth.)\n    -   句型：`sth. + cost + (sb.) + money`\n    -   例：The book cost me 20 dollars. (这本书花了我20美元。)\n\n2.  **spend** (v.) 花费（金钱/时间）\n    -   主语：人 (sb.)\n    -   句型：`sb. + spend + money/time + on sth.` 或 `sb. + spend + money/time + (in) doing sth.`\n    -   例：I spent two hours on my homework. (我花了两小时做作业。)\n\n3.  **pay** (v.) 支付\n    -   主语：人 (sb.)\n    -   句型：`sb. + pay + money + for sth.`\n    -   例：She paid 100 yuan for the dress. (她花100元买了这条裙子。)\n\n4.  **take** (v.) 花费（时间/精力）\n    -   主语：形式主语 It\n    -   句型：`It + takes/took + sb. + time/effort + to do sth.`\n    -   例：It took him three years to build the house. (他花了三年时间建这所房子。)","socratic_tracks":[{"title":"从句子结构判断动词","steps":[{"question":"观察句子 `But it doesn't _____ a long time for her kids...`，它的主语是什么？","hint":"句子的开头是 `It`。","takeaway":"这个句子的主语是形式主语 `It`。"},{"question":"在表示“花费时间”的四个选项动词中，哪一个最常用于 `It` 作主语的句型 `It ... sb. time to do sth.` 中？","hint":"想一想“完成作业花了我两个小时”这句话的英文表达：`It ___ me two hours to finish my homework.`","takeaway":"动词 `take` 常用于 `It takes sb. time to do sth.` 这个固定句型中。"},{"question":"因此，根据这个固定句型，本题的空格处应该填入哪个动词？","hint":"选择符合 `It ... time` 结构的动词。","takeaway":"正确答案是 `take`。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"3. 尺寸","options":{"A":"size","B":"colour","C":"favorite","D":"price"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查名词词义辨析。选项A `size` (尺寸)，B `colour` (颜色)，C `favorite` (最喜欢的)，D `price` (价格)。根据上下文，Jim想买一件新衬衫，但他不知道自己的______，所以他向妈妈求助。在买衣服时，不知道“尺寸”是需要求助的常见情况。句意为“吉姆想要一件新衬衫，但他不知道自己的尺码”。因此，选项A `size` 最符合语境。","knowledge_expansion_md":"### 购物场景核心词汇\n\n在小升初英语中，购物是一个非常高频的场景，以下是一些核心词汇和表达：\n\n- **商品属性**: `price` (价格), `size` (尺寸), `colour`/`color` (颜色), `brand` (品牌), `quality` (质量)\n- **价格相关**: `expensive` (贵的), `cheap` (便宜的), `discount` (折扣), `on sale` (打折中), `cash` (现金), `credit card` (信用卡)\n- **人物与地点**: `customer` (顾客), `shopkeeper`/`assistant` (店员), `cashier` (收银员), `shopping mall` (购物中心), `supermarket` (超市), `fitting room` (试衣间)\n- **常用句型**:\n  - 询问价格: `How much is it?` / `How much does it cost?`\n  - 询问尺寸/颜色: `What size/colour do you want?` / `Do you have it in a larger size/another colour?`\n  - 试穿: `Can I try it on?`","socratic_tracks":[{"title":"根据生活常识和语境推理","steps":[{"question":"当你要去商店买一件衣服时，为了确保衣服合身，你需要知道关于这件衣服的什么重要信息？","hint":"除了颜色、价格，还有一个决定你能不能穿的关键因素。","takeaway":"你需要知道衣服的“尺寸”（size）。"},{"question":"原文中说，Jim 想买一件新衬衫，但他不知道自己的某个信息，所以需要求助。结合生活常识，这个信息最可能是什么？","hint":"小孩子通常不清楚自己的尺码，需要大人帮忙看。","takeaway":"Jim 最可能不知道的是自己的“尺寸”。"},{"question":"那么，在 `size`, `colour`, `favorite`, `price` 这四个选项中，哪一个最符合“买衬衫时需要知道的关键信息”这个语境？","hint":"选择与“合身”直接相关的词。","takeaway":"选项 `size` (尺寸) 是最符合语境的答案。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"4. 口渴的","options":{"A":"hungry","B":"thirsty","C":"angry","D":"sad"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词词义辨析。选项A `hungry` (饥饿的)，B `thirsty` (口渴的)，C `angry` (生气的)，D `sad` (伤心的)。根据下文“...and runs to buy three bottles of cola”（……跑去买三瓶可乐），可以推断出Bob的行为是由于口渴引起的。句意为“他口渴了，跑去买三瓶可乐”。因此，选项B `thirsty` 是最符合逻辑的答案。","knowledge_expansion_md":"### 常见情感与状态形容词\n\n描述人物情感和状态的形容词是阅读理解和写作中的重点。以下是一些常见词汇：\n\n- **正面情绪**:\n  - `happy` (开心的): 最普遍的积极情绪。\n  - `excited` (兴奋的): 对将要发生的好事感到非常开心和激动。\n  - `proud` (自豪的): 为自己或他人的成就感到满意和骄傲。\n  - `pleased` (高兴的，满意的): 对某个结果或情况感到满意。\n\n- **负面情绪**:\n  - `sad` (伤心的): 感到不开心，通常因为失去或失望。\n  - `angry` (生气的): 因为不公或错误的事情而感到愤怒。\n  - `worried` (担心的): 对可能发生的不好的事情感到焦虑。\n  - `disappointed` (失望的): 因为期望没有被满足而感到不快。\n  - `scared`/`afraid` (害怕的): 感到恐惧。\n\n- **生理状态**:\n  - `hungry` (饥饿的)\n  - `thirsty` (口渴的)\n  - `tired` (疲劳的)\n  - `sick` (生病的)","socratic_tracks":[{"title":"通过行为推断原因","steps":[{"question":"阅读原文，Bob 跑去做了一件什么具体的事情？","hint":"原文写着 `...runs to buy three bottles of cola.`","takeaway":"Bob 跑去买了三瓶可乐。"},{"question":"根据生活经验，一个人在什么身体状态下会特别想去买可乐这样的饮料来喝？","hint":"想喝水或饮料通常是因为……","takeaway":"通常是因为感到“口渴”（thirsty）。"},{"question":"因此，在 `hungry`, `thirsty`, `angry`, `sad` 这四个描述状态的词中，哪一个最能合理解释 Bob 跑去买可乐的行为？","hint":"找到能引发“买可乐”这个行为的最直接原因。","takeaway":"选项 `thirsty` (口渴的) 是最符合逻辑的原因。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"5. 促销、打折 (固定搭配 on sale)","options":{"A":"for","B":"in","C":"on","D":"at"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查固定搭配。空格后是 `sale`，`on sale` 为固定短语，意为“打折出售、促销中”。句意为：可乐正在促销，所以他跑去买。选项 A `for sale` 虽可表示“待售”，但此处强调“赶上促销/打折”，用 `on sale` 最贴切；选项 B `in sale`、选项 D `at sale` 均非正确搭配。因此选 C。","knowledge_expansion_md":"### 与 sale 相关的常见搭配\n\n* **`on sale`**：打折出售；上市销售（美式也常用）。\n* **`for sale`**：待售（标明某物可买）。\n* **`sales`**：销售额、大减价活动（复数）。\n\n易混点：`on sale` 强调“有折扣/在促销”，不要与单纯表地点的介词混选。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"空格后面是名词 `sale`，你学过哪个介词和它构成“打折、促销”？","hint":"想一想商店橱窗里常见的英文。","takeaway":"`on sale` 表示打折出售。"},{"question":"句子里主语 `they` 指谁？和“买三瓶可乐”有什么关系？","hint":"指可乐（或那一批饮料）正在促销。","takeaway":"因为饮料在促销，所以去买，逻辑通顺。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"6. 动词短语 (在鞋区看鞋)","options":{"A":"looking at","B":"looking for","C":"looking after","D":"looking into"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查 `look` 短语辨析。原文在商场鞋区：`While Bob is _____ a pair of shoes` 表示 Bob 正在看/打量一双鞋。`look at` 意为“看、注视”，与试鞋、挑选时“看着鞋”完全合拍。`look for` 强调“寻找”，侧重找的过程；此处更自然的是“正在看一双鞋”。`look after` 为“照顾”，与鞋作宾语不搭配；`look into` 为“调查”。因此选 A。","knowledge_expansion_md":"### “look”相关动词短语全解\n\n以 `look` 开头的动词短语是考试的重点和难点，它们的意思往往不能从字面推断。\n\n*   **look after**: 照顾，照料。相当于 `take care of`。\n    > e.g., Can you help me look after my cat this weekend?\n*   **look for**: 寻找。强调“找”的过程。\n    > e.g., I'm looking for my keys. Have you seen them?\n*   **look at**: 看。指把目光投向某个方向。\n    > e.g., Look at the beautiful sunset!\n*   **look up**: 查阅（在字典、网络中）；抬头看。\n    > e.g., If you don't know the word, look it up in the dictionary.\n*   **look into**: 调查。通常指深入研究或调查某事。\n    > e.g., The police will look into the case.\n*   **look out**: 小心，当心。常用于提醒别人注意危险。\n    > e.g., Look out! There's a car coming.\n*   **look forward to**: 盼望，期待。注意 `to` 是介词，后面要跟名词或动名词（-ing形式）。\n    > e.g., I'm looking forward to seeing you soon.","socratic_tracks":[{"title":"语境与搭配","steps":[{"question":"在鞋区里，Bob 对一双鞋最自然的动作是“盯着看、打量”还是“照顾”？","hint":"`look after` 通常接弟弟、宠物。","takeaway":"`look at` 表示“看”，符合看鞋。"},{"question":"`look for` 与 `look at` 有什么差别？","hint":"一个是“找在哪”，一个是“把目光放在……上”。","takeaway":"本句强调当下正对着一双鞋，用 `looking at` 更贴切。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"7. 副词 (Tom 看见同学 Jack 的样子)","options":{"A":"sadly","B":"quickly","C":"happily","D":"easily"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查副词。前一句说妈妈找不到 Tom；本句 `He` 指 **Tom**（紧承上文的 Tom）。Tom 看见同班同学 Jack，后面接 `so he goes to talk with him`，说明 Jack 的状态是积极、愉快的，才会上前打招呼。`happily`（高兴地）符合语境。`sadly` 与去交谈矛盾；`quickly`/`easily` 不如 `happily` 能体现情绪线索。","knowledge_expansion_md":"### 副词的用法与辨析\n\n副词在句子中扮演着重要的修饰角色，主要用来修饰动词、形容词、其他副词或整个句子。\n\n**1. 副词的分类：**\n*   **方式副词**: 回答 `how` 的问题，如 `quickly`, `happily`, `carefully`。本题选项均属此类。\n*   **时间副词**: 回答 `when` 的问题，如 `now`, `today`, `soon`。\n*   **地点副词**: 回答 `where` 的问题，如 `here`, `there`, `everywhere`。\n*   **频率副词**: 回答 `how often` 的问题，如 `always`, `usually`, `sometimes`, `never`。\n*   **程度副词**: 修饰形容词或副词，表示程度，如 `very`, `too`, `quite`, `so`。\n\n**2. 副词的构成：**\n*   大多数副词由“形容词 + -ly”构成，如 `quick` -> `quickly`, `beautiful` -> `beautifully`。\n*   以 `y` 结尾的形容词，变 `y` 为 `i` 再加 `-ly`，如 `happy` -> `happily`。\n*   形容词和副词同形，如 `fast`, `hard`, `late`, `early`。\n*   不规则副词，如 `good` -> `well`。\n\n**易错点：**\n*   混淆形容词和副词。形容词修饰名词，副词修饰动词。例如：`She is a careful driver.` (adj.) vs. `She drives carefully.` (adv.)\n*   `hard` vs. `hardly`。`hard` 作副词意为“努力地”，`hardly` 意为“几乎不”，是频率副词。","socratic_tracks":[{"title":"指代与语境","steps":[{"question":"`He sees his classmate Jack _____` 里的 `He` 是谁？","hint":"上一句结尾刚提到 `Tom`。","takeaway":"`He` 指 Tom。"},{"question":"Tom 走过去和 Jack 说话，说明 Jack 当时更可能是什么状态？","hint":"与 `talk with` 搭配的情绪。","takeaway":"用 `happily` 描写 Jack 很高兴最合理。"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"8. 动词 (从多种颜色中挑选书包)","options":{"A":"taking","B":"choosing","C":"showing","D":"finding"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词。空格后是 `a schoolbag from different colours`，表示在多种颜色中做出选择，应使用 `choosing`（挑选）。`taking` 侧重拿走；`showing` 侧重展示；`finding` 侧重找到的结果，都不如 `choosing` 贴合“从不同颜色中选”的过程。","knowledge_expansion_md":"### 核心动词辨析：`take`, `choose`, `show`, `find`\n\n这四个动词都是小学和初中阶段的核心词汇，但它们的具体用法和搭配有很大区别。\n\n*   **take**: 含义非常丰富，常见的有“拿，取，带走”，“花费（时间/金钱）”，“乘坐（交通工具）”等。\n    > e.g., `take an apple`, `take a photo`, `it takes 2 hours`, `take a bus`.\n\n*   **choose**: 意为“选择，挑选”，强调从两个或多个对象中选出一个。\n    > e.g., `choose a book from the library`, `choose to do sth` (选择做某事).\n\n*   **show**: 意为“展示，给...看”，常用于 `show sth to sb` 或 `show sb sth` 的结构。\n    > e.g., `He showed his new toy to his friends.`\n\n*   **find**: 意为“找到，发现”，强调经过寻找后得到的结果。它的过去式和过去分词是 `found`。\n    > e.g., `I can't find my wallet.` (强调寻找的动作) `I found it!` (强调找到的结果)。\n\n**易错点：**\n*   `find` vs. `look for`: `look for` 是“寻找”的过程，而 `find` 是“找到”的结果。\n*   `choose` vs. `decide`: `choose` 侧重于从已有选项中挑选，而 `decide` 侧重于下决心做某事 (`decide to do sth`)。","socratic_tracks":[{"title":"动词词义辨析","steps":[{"question":"想象你在一家商店，面前有很多不同颜色的T恤。你想买一件。这时，你正在做什么？","hint":"你正在从很多件衣服里“挑选”你喜欢的那一件。","takeaway":"`choose` 的核心意思是“从多个选项中进行选择”。"},{"question":"你把新买的T恤拿给妈妈看，这个动作叫什么？","hint":"把东西拿出来给别人看，是“展示”。","takeaway":"`show` 的意思是“展示，给...看”。"},{"question":"你找不到你的手机了，你到处找，最后在沙发下面看到了它。这个“看到、发现”的瞬间，用哪个词描述？","hint":"这是“寻找”之后的结果。","takeaway":"`find` 的意思是“找到，发现”。"}]},{"title":"动词搭配与用法","steps":[{"question":"“花了我两个小时完成作业”这句话，用哪个动词来表达“花费”时间？","hint":"这是一个关于 `take` 的固定句型 `It takes sb some time to do sth`。","takeaway":"`take` 可以表示“花费”时间或金钱。"},{"question":"“向朋友们展示我的画”，英文结构 `show my picture ___ my friends` 中间应该填什么？","hint":"这是一个常用结构 `show sth to sb`。","takeaway":"`show` 常与介词 `to` 连用，表示“向某人展示某物”。"}]},{"title":"近义词辨析","steps":[{"question":"`look for` 和 `find` 都有“找”的意思，它们有什么区别？","hint":"一个是过程，一个是结果。你可能 `look for` 很久，但不一定能 `find`。","takeaway":"`look for` 强调“寻找”的动作过程，而 `find` 强调“找到”的结果。"},{"question":"“我选择待在家里” 和 “我决定待在家里”，用 `choose` 和 `decide` 都可以表达，但侧重点有什么不同？","hint":"`choose` 好像在“待在家里”和“出去玩”之间做选择，而 `decide` 更强调下定决心。","takeaway":"`choose` 侧重于挑选选项，而 `decide` 侧重于做出决定。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"9. 妈妈的感受 (孩子走散、晚归七点到家)","options":{"A":"silly","B":"lonely","C":"tired","D":"afraid"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查形容词。空格所在句为 `It's seven when they get home. Mum is really _____.` 上文写商场人多、孩子几次跑开、妈妈反复找人，情节紧张。此处描写妈妈终于带孩子到家时的心情：`afraid` 表示“害怕的、担心的”，强调刚才差点出事带来的后怕与不安，与全文走散惊魂的语境一致。`silly`、`lonely` 与语境不符；`tired`（累）虽可联想，但本文更突出险情下的情绪反应，故选 D。","knowledge_expansion_md":"### 情绪形容词\n\n* **`afraid`**：害怕、担心；可指受惊吓后的不安。\n* **`tired`**：疲倦。\n* **`lonely`**：孤独。\n* **`silly`**：傻气、不严肃。\n\n要把选项放回“购物中心—走散—晚归”的情节线里判断语气。","socratic_tracks":[{"title":"情节推断","steps":[{"question":"到家已经七点，之前在商场里发生了什么让妈妈紧张？","hint":"孩子乱跑、妈妈多次找不到人。","takeaway":"险情过后，妈妈仍可能感到害怕或后怕。"},{"question":"`Mum is really afraid` 更强调哪一种感受？","hint":"与“差点出事”相关的是担心、害怕。","takeaway":"选 `afraid` 与走散惊魂的叙事最贴合。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"She gets a pen and then _____10_____ one rule (规定) on the list of “Family Rules” —Shop with one boy each time.","options":{"A":"collects","B":"gets","C":"says","D":"writes"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词词义辨析。根据上文 “She gets a pen” (她拿起一支笔)，可知妈妈接下来的动作是用笔来完成的。再结合宾语 “one rule (规定) on the list” (清单上的一条规定)，可以推断出妈妈是用笔在清单上“写下”一条新规定。选项中，A. collects 意为“收集”；B. gets 意为“得到”；C. says 意为“说”；D. writes 意为“写”。因此，`writes` 最符合语境。句意：她拿起一支笔，然后在“家庭规定”清单上写下了一条规定——每次只带一个男孩购物。","knowledge_expansion_md":"### 知识点拓展：\n**动词与工具的搭配**\n在英语中，很多动词都与特定的工具或方式相关联，理解这些搭配有助于我们根据上下文选择正确的词汇。\n*   **`write with a pen/pencil`**: 用钢笔/铅笔写字。\n*   **`cut with a knife/scissors`**: 用刀/剪刀切/剪。\n*   **`eat with a fork/chopsticks`**: 用叉子/筷子吃饭。\n*   **`see with your eyes`**: 用眼睛看。\n本题中，`gets a pen` (拿起一支笔) 就是一个强烈的线索，提示接下来的动作很可能是 `writes` (写)。","socratic_tracks":[{"title":"上下文线索分析","steps":[{"question":"观察空格前的句子 `She gets a pen`，妈妈拿起了什么工具？","hint":"a pen (一支笔)。","takeaway":"文中的 `pen` (笔) 是解题的关键线索。"},{"question":"人们通常用笔在清单 (list) 上做什么动作？","hint":"是“收集”、“得到”、“说”还是“写”？","takeaway":"用笔的主要功能是书写，因此妈妈的动作是“写下”规定。"}]},{"title":"动词词义辨析","steps":[{"question":"请解释 `collects`, `gets`, `says`, `writes` 这四个词的意思。","hint":"collects (收集), gets (得到), says (说), writes (写)。","takeaway":"准确理解选项中每个动词的含义是做出正确选择的基础。"},{"question":"将这四个词放入句子 `She gets a pen and then ___ one rule...` 中，哪个词最符合“用笔在清单上增加规定”这个场景？","hint":"哪个动作需要用到笔？","takeaway":"只有 `writes` (写) 这个动作与使用笔 (pen) 的情境完全吻合，因此是正确答案。"}]}]}}]},{"section_title":"II. 阅读理解 (共20分)","section_instruction":"","items":[{"number":"11","item_type":"reading","context_note":"Passage A\nJoris Hutchissen, a young boy, loves cheetahs (非洲猎豹). He was upset to learn that the big animals might be in great danger. “When he was six, he was reading a book about cheetahs. The book says cheetahs could be in great danger. He got very upset,” said Joris' mother.\nJoris asked his mum what he could do to help. They got in touch with a wildlife sanctuary (野生动物保护中心) in Africa. Joris began raising money. He sold T-shirts, flowers and juice. He held yard sales and skating parties. “I'm just a normal kid. I only want to do something to save them,” Joris said.\nSo far, he has raised more than $14,000. The money is used to buy special collars (项圈). The collars <u>track</u> the cheetahs. This helps protect them from being killed. Joris has also visited the sanctuary in Africa. He has spent three summers volunteering there. “We need to raise awareness (意识) and tell people what's happening,” Joris says. “I've learned that everyone can make a difference, even if you're just a kid!” says Joris. “You just have to start somewhere.”","stem":"How did Joris learn that cheetahs are in great danger?","options":{"A":"His mother told him.","B":"He learned it from a book.","C":"His teacher told him.","D":"He learned it from a piece of news."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题是细节理解题，询问 Joris 是如何得知猎豹处于危险之中的。解题的关键在于定位原文中的信息。根据文章第一段中的句子：“When he was six, he was reading a book about cheetahs. The book says cheetahs could be in great danger.”（当他六岁时，他正在读一本关于猎豹的书。书上说猎豹可能处于巨大的危险之中。）这句话明确指出，Joris 是通过读书了解到这个信息的。因此，选项 B “他从一本书中得知的”是正确答案。","knowledge_expansion_md":"### 知识点拓展：\n1.  **阅读理解技巧：细节定位 (Scanning for Details)**\n    *   做细节理解题时，首先要从题干中提取关键词，如本题的 `Joris`, `learn`, `danger`。\n    *   然后带着关键词快速浏览（scan）文章，寻找包含这些词或其同义词的句子。\n    *   定位到相关句子后，仔细阅读并与选项进行比对，找出完全匹配或意思最相近的答案。\n2.  **信息来源的常见表达**：\n    *   `learn from...`: 从……中学习/得知。例：`I learned a lot from my teacher.`\n    *   `... says`: ……上说/写着。常用于书籍、报纸、报告等。例：`The sign says 'Stop'.`\n    *   `according to...`: 根据……。例：`According to the weather forecast, it will rain tomorrow.`\n3.  **干扰项分析**：\n    *   选项 A (His mother told him)：文中出现 `said Joris' mother`，但引号内是母亲在**转述** Joris 六岁时“读关于猎豹的书、从书中得知危险并难过”的经过，**并非**“妈妈把猎豹有危险这一事实作为新信息告诉 Joris”。危险信息仍直接来自 **the book**。因出现 mother 字样易误选，可用“事实首源是书还是人”来排除。\n    *   选项 C (His teacher told him) 和 D (He learned it from a piece of news) 在原文中没有提及，属于无中生有，可直接排除。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"问题是“Joris 是如何得知猎豹有危险的？”。为了在文章中找到答案，我们应该寻找哪些关键词？","hint":"可以找人名 `Joris`，以及表示“得知”的 `learn` 和表示“危险”的 `danger`。","takeaway":"带着问题中的关键词去阅读，可以帮我们快速定位到答案所在的位置。"},{"question":"在文章第一段，你找到了哪句话同时提到了 Joris、书以及危险？","hint":"寻找 `reading a book` 和 `in great danger` 这两个短语。","takeaway":"原文“he was reading a book about cheetahs. The book says cheetahs could be in great danger.”直接给出了答案。"}]},{"title":"排除干扰项","steps":[{"question":"我们来看选项A：是他妈妈告诉他的吗？文章中妈妈扮演了什么角色？","hint":"注意 `“...” said Joris' mother.` 这个结构。母亲是在引述孩子当年从书中得知危险的经历，信息首源仍是书本。","takeaway":"因此不能把“母亲开口引述”等同于“母亲向他告知该事实”，选项 A 不成立。"},{"question":"再看选项C（老师）和选项D（新闻），文章中有提到这两个信息来源吗？","hint":"通读第一段，看看有没有 `teacher` 或 `news` 这两个词。","takeaway":"对于文章中完全没有提到的信息，我们可以直接判定为错误选项。"}]},{"title":"理解提问方式","steps":[{"question":"这是一个以 `How` 开头的问题，它通常在问什么？","hint":"`How` 提问的是“怎么样”或“如何”，也就是方式、方法或途径。","takeaway":"理解 `How` 问题的意图，能帮助我们集中精力寻找表示方式或方法的信息。"},{"question":"所以，这个问题是在问 Joris “得知信息”的方式。文章描述的方式是听别人说，还是自己阅读？","hint":"原文中的动词是 `reading`。","takeaway":"Joris 得知信息的方式是 `reading a book`（读书），这直接对应了选项B。"}]}]}},{"number":"12","item_type":"reading","context_note":"Passage A","stem":"What does the underlined word “track” mean?","options":{"A":"追踪","B":"赛跑","C":"停下","D":"复制"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题是词义猜测题，要求解释划线单词 `track` 的意思。`track` 所在的句子是 “The collars track the cheetahs.”，其上一句提到这些钱被用来购买特殊的项圈（collars），下一句说 “This helps protect them from being killed.”（这有助于保护它们不被杀害）。将这三句话联系起来，我们可以推断：给猎豹戴上项圈是为了保护它们，而要实现保护，就需要知道它们的位置。因此，项圈的功能就是“追踪”猎豹的行踪。选项 A “追踪”最符合此意。","knowledge_expansion_md":"### 知识点拓展：\n1.  **上下文猜词义 (Guessing Meaning from Context)**：这是阅读理解的核心技能之一。常用方法包括：\n    *   **利用因果关系**：如本题，因为要 `protect` (保护)，所以需要 `track` (追踪)。\n    *   **利用定义或解释**：作者有时会直接或间接解释词义，如 `...collars (项圈)`。\n    *   **利用举例**：通过 `for example`, `such as` 等词语后面的例子来推断。\n    *   **利用反义或对比关系**：通过 `but`, `however`, `on the other hand` 等找到线索。\n2.  **一词多义：`track`**\n    *   **作动词 (v.)**: 追踪，跟踪。例: `The police tracked the criminal for days.` (警察追踪了罪犯好几天。)\n    *   **作名词 (n.)**: \n        *   小路，小径。例: `a dirt track` (一条土路)\n        *   踪迹，足迹。例: `follow the tracks in the snow` (跟着雪地里的足迹)\n        *   轨道，跑道。例: `railway track` (铁轨), `running track` (跑道)","socratic_tracks":[{"title":"上下文逻辑推断","steps":[{"question":"划线词 `track` 所在的句子前面和后面分别讲了什么？","hint":"前面讲用钱买 `special collars` (特殊项圈)，后面讲这能 `protect them` (保护它们)。","takeaway":"理解单词所在句子的上下文是猜词义的第一步。"},{"question":"想一想，一个戴在动物脖子上的“特殊项圈”怎样才能起到“保护”作用？","hint":"如果能随时知道动物在哪里，是不是就能在它遇到危险时提供帮助？这种“知道它在哪”的功能叫什么？","takeaway":"通过分析上下文的因果逻辑（项圈的功能是为了保护），可以推断出 `track` 是指确定并跟随猎豹位置的动作，即“追踪”。"}]},{"title":"词汇知识联想","steps":[{"question":"你以前见过 `track` 这个词吗？它作名词时有哪些常见意思？","hint":"想一想操场上的“跑道”，或者火车的“轨道”。","takeaway":"`track` 作为名词，常指“跑道、轨道、踪迹”等与路径相关的概念。"},{"question":"既然 `track` 的名词意思和“踪迹、路径”有关，那么把它当成一个动作（动词）来理解，可能会是什么意思呢？","hint":"沿着一条踪迹或路径去做一件事，这个动作是什么？","takeaway":"`track` 作为动词的核心含义就是“顺着踪迹去寻找或跟随”，即“追踪”。"}]},{"title":"代入排除法","steps":[{"question":"我们把四个中文选项的意思分别代入原句 “The collars ___ the cheetahs.” 看看哪个最合理。","hint":"A. 项圈追踪猎豹。 B. 项圈赛跑猎豹。 C. 项圈停下猎豹。 D. 项圈复制猎豹。","takeaway":"将选项代入原文是检验答案是否通顺的有效方法。"},{"question":"哪个选项代入后，最符合逻辑，并且能解释为什么这能“保护”猎豹？","hint":"“追踪”能让保护人员知道猎豹的位置，从而保护它们。其他选项（赛跑、停下、复制）在逻辑上都说不通。","takeaway":"通过代入法和逻辑判断，可以排除不合理的选项，最终确定正确答案。"}]}]}},{"number":"13","item_type":"reading","context_note":"Passage A","stem":"Where did Joris spend three summers in order to help save cheetahs?","options":{"A":"In Africa.","B":"In America.","C":"In Australia.","D":"In Russia."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节定位题，询问Joris在哪里度过了三个夏天来帮助猎豹。根据文章第三段中的句子：“Joris has also visited the sanctuary in Africa. He has spent three summers volunteering there.”（Joris 也参观了非洲的这个保护中心。他在那里做了三个夏天的志愿者。）这句话明确指出了地点是“in Africa”（在非洲）。因此，正确答案是A。","knowledge_expansion_md":"### 关键词定位与地理常识\n\n1.  **关键词定位法**：对于`Where`引导的特殊疑问句，解题的关键是快速在文章中定位到表示地点的词语。首先确定题干中的核心词（如`Joris`, `summers`, `cheetahs`），然后带着这些核心词去文章中寻找相关的地名（国家、城市、大洲等）。\n\n2.  **地理常识**：本题考察了对基本地理常识的掌握。建议在日常学习中积累各大洲及其代表性国家的英文名称。\n\n3.  **排除干扰项**：题目问的是“为了帮助猎豹去的地方”，而非他的家乡。要仔细审题，避免被“原文出现过的词”误导。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目问的是关于什么的信息？是一个时间、一个人物还是一个地点？","hint":"注意题目开头的第一个词 'Where'。","takeaway":"题目问的是Joris去帮助猎豹的“地点”。"},{"question":"我们应该在文章中寻找什么样的词来回答这个问题？","hint":"既然是问地点，就应该找地名，比如国家、城市或大洲的名称。","takeaway":"我们需要在文章中找到与Joris和猎豹相关的地名信息。"},{"question":"根据文章第三段，Joris在哪里做志愿者？","hint":"寻找句子 'Joris has also visited the sanctuary in Africa. He has spent three summers volunteering there.'","takeaway":"文章明确指出地点是 'in Africa'（在非洲）。"}]},{"title":"区分事实细节","steps":[{"question":"题目问的是他“去哪里”帮助猎豹，还是他“来自哪里”？","hint":"仔细阅读题干 'Where did Joris spend three summers...?'","takeaway":"题目问的是他做志愿者的地方，而不是他的家乡。"},{"question":"因此，在选择答案时，我们应该关注文章中与哪个行为相关的地点？","hint":"关注与 'spend three summers' 和 'help save cheetahs' 相关的地点信息。","takeaway":"必须根据问题的具体要求来定位信息，而不是选择文章中可能出现的任何一个地名。"}]},{"title":"排除无关选项","steps":[{"question":"请快速浏览文章，看看有没有提到 'Australia' (澳大利亚) 或 'Russia' (俄罗斯)？","hint":"使用快速扫描（skimming）的方法，只关注地名。","takeaway":"文章全文没有出现澳大利亚或俄罗斯这两个地名。"},{"question":"对于文章中完全没有提到的信息，我们应该如何处理这些选项？","hint":"如果一个选项的内容在原文中找不到任何依据，它会是正确答案吗？","takeaway":"在阅读理解中，无中生有的选项通常是错误选项，应直接排除。"}]}]}},{"number":"14","item_type":"reading","context_note":"Passage A","stem":"The passage tells us that _____.","options":{"A":"cheetahs are in great danger","B":"we should do something meaningful","C":"kids can also make a difference","D":"parents should help kids do something good"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道主旨大意题，询问这篇文章告诉了我们什么。文章通过讲述男孩 Joris 的故事，传达了一个道理。文章结尾 Joris 亲口说道：“I've learned that everyone can make a difference, even if you're just a kid!”（我明白了每个人都可以有所作为，即使你只是个孩子！）这句话直接点明了文章的主旨。选项 C “kids can also make a difference”（孩子们也能有所作为）正是这句话的直接体现。因此，C 是最佳答案。","knowledge_expansion_md":"### 主旨大意题解题策略\n\n1.  **寻找主题句**：主旨大意题的答案通常隐藏在文章的“主题句”（Topic Sentence）中。主题句最常出现在文章的开头（开门见山）或结尾（总结升华）。本文的结尾句就是典型的主题句。\n\n2.  **区分主旨与细节**：选项A“猎豹处境危险”是文章提到的一个背景事实，是促使Joris行动的原因，但它不是文章的核心思想。主旨是作者想通过这些事实传达的观点或道理。\n\n3.  **避免过度概括或以偏概全**：选项B“我们应该做有意义的事”虽然正确，但过于宽泛，没有体现出文章强调的“年轻人”这一特定群体。选项A则是以偏概全，只抓住了故事背景。正确的主旨应能全面且精准地概括全文核心信息。\n\n4.  **警惕无中生有的选项**：选项D“父母应该帮助孩子做好事”在文章中并未提及，属于主观臆断或过度推断，应予以排除。","socratic_tracks":[{"title":"识别文章主旨","steps":[{"question":"这篇文章主要是在讲一个故事，还是在说明一个道理？","hint":"作者写这个故事的目的是什么？仅仅是介绍Joris这个人吗？","takeaway":"作者通过讲述Joris的故事，旨在传达一个更深层的道理。"},{"question":"文章的结尾部分通常有什么作用？","hint":"文章结尾是用来总结全文，还是开启一个新话题？","takeaway":"文章的结尾常常会总结观点，点明主旨。"},{"question":"文章结尾Joris说的话是什么意思？它和哪个选项的意思最接近？","hint":"原文是 '...everyone can make a difference, even if you're just a kid!'","takeaway":"Joris的话直接说明了“即使是孩子也能有所作为”，这与选项C的意思完全一致。"}]},{"title":"细节与主旨的区别","steps":[{"question":"选项A“猎豹处境危险”在文章中提到了吗？","hint":"Joris为什么要帮助猎豹？文章开头提到了原因。","takeaway":"是的，文章提到了猎豹濒临灭绝，这是故事的背景细节。"},{"question":"既然提到了，为什么A不是正确答案呢？","hint":"想一想，文章的重点是介绍猎豹的困境，还是介绍Joris这个人的行为和精神？","takeaway":"文章的主角是Joris，他的行动和带来的启示才是文章的主旨，因此A只是一个细节。"}]},{"title":"评估选项的概括性","steps":[{"question":"比较选项B“我们应该做有意义的事”和选项C“孩子们也能有所作为”，哪个更贴合文章内容？","hint":"文章的主角Joris有什么特别的身份？他的年龄有什么特殊性？","takeaway":"选项B过于宽泛，而文章特别强调了主角是个年轻人，所以选项C更具体、更准确地概括了文章的独特启示。"},{"question":"文章中有没有提到Joris的父母？","hint":"快速浏览全文，寻找 'parents', 'father', 'mother' 等词。","takeaway":"文章完全没有提及Joris的父母，因此选项D是无中生有的推断。"}]}]}},{"number":"15","item_type":"reading","context_note":"Passage A","stem":"The passage is probably from a _____.","options":{"A":"notice board","B":"school newspaper","C":"fashion magazine","D":"guidebook"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道文章出处推断题。我们需要根据文章的内容、风格和目标读者来判断它最可能来自哪里。文章讲述了一个名叫Joris的学生的励志事迹，内容积极向上，旨在激励同龄人。这种以学生为榜样、报道校园动态的文章，最典型的载体就是“校报”（school newspaper）。选项A“布告栏”多为简短通知。选项C“时尚杂志”关注潮流服饰。选项D“指南”提供旅游或操作信息。这三者均与文章内容不符。因此，校报是唯一合理的出处。","knowledge_expansion_md":"### 文章体裁与出处推断题\n\n这类题目考查学生根据文本特征进行逻辑推理的能力。解题时，可以从以下几个方面分析：\n\n1.  **内容 (Content)**：文章讲了什么？是新闻、故事、广告、说明还是通知？本文是一篇关于学生的人物报道。\n2.  **语气 (Tone)**：作者的态度是客观的、主观的、严肃的、幽默的还是鼓舞人心的？本文的语气是积极、正面的，带有教育和激励意义。\n3.  **目标读者 (Target Audience)**：文章是写给谁看的？是儿童、学生、家长还是一般大众？本文以学生为主角，显然主要写给其他学生看。\n4.  **格式与语言 (Format & Language)**：文章有无特殊格式（如标题、日期、地址）？语言是正式还是非正式？\n\n**常见出处及其特征**：\n-   **Newspaper (报纸)**: 报道新闻时事，语言客观。\n-   **School Newspaper (校报)**: 报道校园新闻、师生事迹，面向学生，常有激励性。\n-   **Magazine (杂志)**: 分类多样（时尚、科技、旅游等），内容更深入，图文并茂。\n-   **Notice (通知/布告)**: 格式固定，语言简洁，目的明确（如会议、活动通知）。\n-   **Guidebook (指南)**: 提供实用信息和指导（如旅游指南、使用手册）。\n-   **Diary (日记)**: 私人记录，第一人称，语言随意。","socratic_tracks":[{"title":"分析文章内容与读者","steps":[{"question":"这篇文章的主角是谁？文章主要讲了什么事？","hint":"主角是学生Joris，他做了一件很有意义的事。","takeaway":"文章讲述了一名学生为保护动物而努力的励志故事。"},{"question":"你认为这篇文章最想给谁看？是给所有人，还是某个特定群体？","hint":"讲述一个学生的故事，最能激励和影响的是哪些人？","takeaway":"这篇文章的目标读者很可能是和Joris年龄相仿的学生。"},{"question":"四个选项中，哪一个出版物主要是给学生看的？","hint":"比较“校报”、“时尚杂志”、“指南”的读者群体。","takeaway":"“校报”（school newspaper）是主要面向学生的出版物。"}]},{"title":"辨析不同文体特征","steps":[{"question":"“Notice board”（布告栏）上通常会贴什么样的东西？","hint":"比如，会议通知、失物招领等。它们的篇幅长吗？","takeaway":"布告栏上的信息通常是简短的通知或公告，而不是一个完整的故事。"},{"question":"“Fashion magazine”（时尚杂志）会刊登这样的文章吗？为什么？","hint":"时尚杂志关心的是动物保护，还是穿着打扮？","takeaway":"时尚杂志主要关注潮流和名人，与本文的环保励志主题不符。"},{"question":"“Guidebook”（指南）的作用是什么？这篇文章像一份指南吗？","hint":"指南会告诉你去哪里玩，怎么做某件事。这篇文章是在教你怎么去非洲吗？","takeaway":"这篇文章是在讲述一个故事以激励人心，而不是提供操作指引，所以它不是指南。"}]}]}},{"number":"16","item_type":"reading","context_note":"Passage B\nDo you want to stay young? Do you know how to stay young? Here's some advice (建议).\nForget some numbers. The numbers are about your age, <u>weight</u> and height (身高). Let the doctor worry about them. That's why you pay him or her.\nMake happy friends. People who are bright and happy should be your friends. Their happiness may help you change (改变) your bad mood (情绪), and your life will be better.\nKeep learning. Learn more about the computer, gardening or others. Don't stop using your mind. Take an interest in the world around you, and learn at least one new thing every day. Learning makes you become very clever.\nKeep healthy. Do more exercise and eat healthy food to keep healthy. If there is something wrong, go to see the doctor.\nThere are many other ways to stay young, such as enjoying the simple things, laughing often, having a walk often, telling people you love them and so on.","stem":"Who can help you change your bad mood according to the passage?","options":{"A":"Serious and scared people.","B":"Bright and happy people.","C":"Young and beautiful people.","D":"Tall and strong people."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节查找题，问题是“根据文章，谁能帮助你改变坏心情？”。解题的关键是找到题干中的核心词“change your bad mood”在文章中的对应位置。文章第二段建议“Make happy friends.”（结交快乐的朋友），紧接着解释说：“People who are bright and happy should be your friends. Their happiness may help you change your bad mood...”（那些开朗快乐的人应该成为你的朋友。他们的快乐可以帮助你改变坏心情...）。由此可见，能够帮助改变坏心情的是“bright and happy people”。因此，正确答案是B。","knowledge_expansion_md":"### 关键词定位法与词义辨析\n\n1.  **关键词定位法 (Keyword Skimming)**：这是做阅读细节题最核心、最有效的方法。首先，从题干中提炼出关键词（如此题的 `change bad mood`）。然后，带着这些关键词快速扫描文章，定位到包含这些词或其同义词的句子。答案通常就在该句或其上下文之中。\n\n2.  **一词多义：'bright'**：在英语中，很多单词有不止一个意思。`bright` 最常见的意思是“明亮的”，但当它用来形容人时，通常指“聪明的，伶俐的”或“开朗的，愉快的”。在本句中，`bright` 与 `happy` 并列，共同形容朋友的性格，取“开朗的”之意。理解一词多义是提升阅读能力的关键。\n\n3.  **同义替换**：阅读理解题的选项常常使用原文词汇的同义词或同义短语来进行替换，以考查学生真正的理解能力。例如，题干中的 `who` 对应原文中的 `people`。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这个问题想让我们在文章中找到什么信息？","hint":"看看问题里的核心短语是什么？“change your bad mood”。","takeaway":"问题想知道“谁能帮助你改变坏心情”。"},{"question":"我们应该在文章中寻找哪些关键词来定位答案？","hint":"题干中的 “change” 和 “bad mood” 是最关键的词。","takeaway":"我们要在文章中快速找到 “change” 和 “bad mood” 这两个词。"},{"question":"找到这些词后，它们所在的句子说了什么？","hint":"读一下 “Their happiness may help you change (改变) your bad mood (情绪)” 这句话，以及它的前一句。","takeaway":"文章说“开朗快乐的人”的“快乐”可以帮助改变坏心情，因此答案是开朗快乐的人。"}]},{"title":"理解一词多义","steps":[{"question":"在选项B “Bright and happy people” 中，“bright”是什么意思？","hint":"我们通常说灯很“bright”，但用“bright”来形容人呢？","takeaway":"“Bright”在这里不是指“发光的”，而是指人“聪明的”或“开朗的”。"},{"question":"文章中与“bright”并列的词是什么？这能帮助我们理解它的意思吗？","hint":"文章中说的是 “bright and happy people”。","takeaway":"文章将“bright”和“happy”并列使用，说明它们描述的都是一类积极向上的人的性格。"}]},{"title":"排除错误选项","steps":[{"question":"为什么选项A “Serious and scared people”（严肃和害怕的人）是错的？","hint":"严肃和害怕的人会给你带来快乐，还是让你也感到紧张？","takeaway":"严肃和害怕的情绪与“改变坏心情”的目标正好相反，不符合逻辑。"},{"question":"文章中有没有提到“young and beautiful”（年轻漂亮）或者“tall and strong”（高大强壮）的人？","hint":"快速浏览全文，看看有没有这些关于外貌或体格的形容词。","takeaway":"文章完全没有提及外貌或体格这些特征，因此C和D都是无中生有的无关选项。"}]}]}},{"number":"17","item_type":"reading","context_note":"Passage B","stem":"The underlined word “weight” means “_____” in Chinese.","options":{"A":"知识","B":"习惯","C":"朋友","D":"体重"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查在特定语境中猜测词义的能力。划线单词 `weight` 出现在句子 'The numbers are about your age, <u>weight</u> and height (身高).' 中。该句列举了三个与身体相关的数字：`age` (年龄)、`weight` 和 `height` (身高)。根据并列关系和上下文，`weight` 在此指人的“体重”。因此，正确答案是D。","knowledge_expansion_md":"### 词汇拓展：`weight` 的多重含义\n\n1.  **体重/重量 (n.)**: 这是 `weight` 最基本的意思。\n    *   例句：`He is trying to lose weight.` (他正在努力减肥。)\n    *   常见搭配：`lose weight` (减肥), `gain/put on weight` (增重), `watch one's weight` (注意体重)。\n\n2.  **重要性/分量 (n.)**: `weight` 也可以用作比喻，指某事物的重要性或影响力。\n    *   例句：`Her opinion carries a lot of weight in the company.` (她的意见在公司里很有分量。)\n\n3.  **重物/砝码 (n.)**: 指用于称重或锻炼的重物。\n    *   例句：`He lifts weights at the gym every day.` (他每天在健身房举重。)\n\n### 易混淆词\n*   **wait (v.)**: 等待。`weight` 和 `wait` 是同音异形异义词，注意区分。","socratic_tracks":[{"title":"语境推断法","steps":[{"question":"划线单词 `weight` 出现在哪个句子中？和它并列的词是什么？","hint":"找到文章中包含 `weight` 的句子：'The numbers are about your age, weight and height (身高).'","takeaway":"句子列举了 `age` (年龄)、`weight` 和 `height` (身高)，这三个词描述的都是和身体相关的数字。"},{"question":"既然 `age` 是年龄，`height` 是身高，那么 `weight` 在这里最可能是什么意思？","hint":"想一想我们描述身体特征时，除了年龄和身高，还会说哪个指标？","takeaway":"在年龄和身高的语境下，`weight` 指的就是“体重”。"}]},{"title":"词汇辨析","steps":[{"question":"除了“体重”，你还知道“weight”的其他意思吗？例如，在“Your opinion carries great weight”这句话中，“weight”是什么意思？","hint":"这句话可以翻译为“你的意见很有分量”。","takeaway":"“weight”除了表示物理上的“重量”，还可以引申为“重要性”或“影响力”。"},{"question":"既然“weight”有多种含义，我们如何确定它在阅读文章中的具体意思呢？","hint":"是孤立地看这个词，还是结合它所在的句子和段落来看？","takeaway":"理解单词在具体语境中的含义是阅读理解的关键，必须结合上下文来判断。"}]}]}},{"number":"18","item_type":"reading","context_note":"Passage B","stem":"If you want to become smart (聪明的), you should _____.","options":{"A":"make happy friends","B":"forget some numbers","C":"laugh often","D":"learn something new every day"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道细节查找题，问题是“如果你想变得聪明，你应该做什么？”。解题的关键是找到题干中的核心词“smart (聪明的)”在文章中的对应信息。文章第三段建议“Keep learning.”（保持学习），并解释说：“Learning makes you become very clever.”（学习让你变得非常聪明）。选项D“每天学习新东西”与此段内容完全吻合。因此，正确答案是D。","knowledge_expansion_md":"### 语法点：`become` 的用法\n\n`become` 是一个常见的系动词，意为“变成；成为”，其后可以跟名词或形容词作表语。\n*   **`become` + 形容词**: 表示状态的变化。\n    *   例句：`He became famous after writing the book.` (写了这本书后他出名了。)\n    *   本题中：`become smart` (变得聪明)\n*   **`become` + 名词**: 表示身份或角色的转变。\n    *   例句：`She wants to become a doctor.` (她想成为一名医生。)\n\n### 词汇辨析：`smart`, `clever`, `wise`\n这三个词都表示“聪明”，但侧重点不同：\n*   **`smart`**: 通常指头脑敏锐、反应快，善于学习和理解新事物，尤指在学业或社交上表现出色。\n*   **`clever`**: 指人机灵、有小聪明，善于动手或想出巧妙的办法，有时略带“精明”的意味。\n*   **`wise`**: 指有智慧、有远见，能做出明智的判断，通常与经验和阅历的积累有关。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这个问题想让我们在文章中找到什么信息？","hint":"看看问题里的核心词是什么？“become smart”。","takeaway":"问题想知道“如何变得聪明”。"},{"question":"我们应该在文章中寻找哪些关键词来定位答案？","hint":"题干中的 “smart” 是关键词。文章中可能出现它的近义词，比如 “clever”。","takeaway":"我们要在文章中快速找到 “smart” 或 “clever” 这些词。"},{"question":"找到相关句子 “Learning makes you become very clever.” 后，它告诉我们什么方法可以变聪明？","hint":"这句话的主语是什么？","takeaway":"文章明确指出“学习”可以让人变得聪明，因此答案与“学习”有关。"}]},{"title":"排除错误选项","steps":[{"question":"为什么选项A“交快乐的朋友”和C“经常笑”不是最佳答案？","hint":"根据文章，交朋友和笑主要对什么有好处？","takeaway":"根据文章，交快乐的朋友是为了“改变坏心情”，属于情绪方面，与“变聪明”没有直接关系。"},{"question":"为什么选项B“忘记一些数字”是错的？","hint":"文章建议忘记的是哪些数字？忘记它们能让人变聪明吗？","takeaway":"文章建议忘记的是年龄、体重等数字，目的是减轻心理负担，与增长智力无关。"}]}]}},{"number":"19","item_type":"reading","context_note":"Passage B","stem":"Which of the following is NOT true according to the passage?","options":{"A":"To have a healthy body, people should do more exercise.","B":"When people don't feel well, they shouldn't see a doctor.","C":"Health can help you stay young.","D":"People should eat healthy food."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题是一道是非判断题，要求选出与文章内容**不符**的选项。我们需要逐一核对选项。文章第四段“Keep healthy”中提到：“Do more exercise and eat healthy food to keep healthy.”，因此选项A和D是正确的。该段还提到：“If there is something wrong, go to see the doctor.”（如果有什么不对劲，就去看医生），这与选项B“当人们感觉不舒服时，他们不应该去看医生”的说法完全相反。选项C是文章主旨的合理推断。因此，与原文内容不符的选项是B。","knowledge_expansion_md":"### 题型解析：“NOT True” 题\n\n“Which of the following is NOT true?” (以下哪项不正确？) 是阅读理解中的经典“反向选择”题型。解题关键在于：\n\n1.  **审清题意**：务必看清大写的“NOT”，避免误选为“正确”的选项。\n2.  **正向排除**：将每个选项与原文信息进行比对。能在原文中找到依据，或与原文意思相符的选项，都是“True”的，应该被排除。\n3.  **锁定答案**：与原文信息明确矛盾、或原文完全未提及（unmentioned）的选项，就是“NOT True”的答案。在中小学阶段，答案通常是与原文明确矛盾的选项。\n\n### 重点短语\n*   `feel well`: 感觉身体好/舒服\n*   `don't feel well`: 感觉不舒服\n*   `see a doctor`: 看医生 (英式英语常用 `see the doctor`)\n*   `do more exercise`: 多做运动","socratic_tracks":[{"title":"识别题型与原文定位","steps":[{"question":"请仔细阅读题干“Which of the following is NOT true...”。这道题要求我们做什么？是找正确的还是错误的描述？","hint":"注意题干中大写的单词 “NOT”。","takeaway":"这道题要求我们找出四个选项中与原文内容“不相符”的那一个。"},{"question":"我们来核对选项B。文章中关于“看医生”是怎么说的？","hint":"在文章中找到 “doctor” 这个词。","takeaway":"文章第四段说：“If there is something wrong, go to see the doctor.”（如果有什么不对劲，就去看医生。）"},{"question":"比较一下原文的建议和选项B的说法，它们的意思是相同还是相反？","hint":"原文说“要去看医生”，选项B说“不应该去看医生”。","takeaway":"选项B的说法与原文的建议完全相反，因此选项B是“NOT true”的。"}]},{"title":"验证其他选项","steps":[{"question":"文章中有没有提到选项A“多锻炼”和D“吃健康食品”？","hint":"在第四段“Keep healthy”中找找看。","takeaway":"文章明确提到“Do more exercise and eat healthy food”，所以选项A和D都是正确的，应该被排除。"},{"question":"选项C“健康有助于保持年轻”在文章中有体现吗？","hint":"想一想整篇文章的主题是什么？“保持健康”是不是实现这个主题的一个重要方法？","takeaway":"文章的主题就是“如何保持年轻”，而“保持健康”是其中一个重要建议，所以选项C符合文章的主旨，是正确的，也应被排除。"}]}]}},{"number":"20","item_type":"reading","context_note":"Passage B","stem":"Which of the following is the best title?","options":{"A":"Enjoy the Simple Things","B":"Tell People Your Love","C":"How to Stay Young","D":"Why to Help Others"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查对文章主旨大意的归纳能力，要求选出最佳标题。文章开篇就提出了问题：“Do you want to stay young? Do you know how to stay young? Here's some advice.”（你想保持年轻吗？你知道如何保持年轻吗？这里有一些建议。）这明确指出了文章的主题是关于“如何保持年轻”。接下来的段落分别从交友、学习、保持健康等方面给出了具体的建议。选项A和B（在文章最后一句提到）只是其中的具体建议，过于片面。选项D在文中未提及。只有选项C“How to Stay Young”（如何保持年轻）能够全面概括文章的中心思想。因此，C是最佳标题。","knowledge_expansion_md":"### 题型解析：最佳标题 (Best Title) 题\n\n选择最佳标题是考查考生归纳和概括文章中心思想能力的核心题型。一个好的标题通常具备以下特点：\n\n1.  **概括性强**：能够覆盖文章的主要内容，而不是仅仅描述某个段落或细节。\n2.  **针对性强**：准确反映文章的核心话题和写作意图，不会过于宽泛或笼统。\n3.  **语言精炼**：简洁明了，引人注目。\n\n**解题技巧**：\n*   **寻找中心句**：文章的开头或结尾常常有揭示主旨的中心句（如此文第一段）。\n*   **排除干扰项**：\n    *   排除**以偏概全**的选项（只描述了文章的某个细节）。\n    *   排除**范围过大**的选项（过于宽泛，不够精确）。\n*   **检查匹配度**：将选定的标题与文章内容进行比对，看它是否是全文内容的最佳概括。","socratic_tracks":[{"title":"寻找主旨句","steps":[{"question":"一篇文章的中心思想通常在哪里最容易找到？","hint":"想一想写作文时，老师是怎么教我们开篇点题和结尾总结的。","takeaway":"文章的开头和结尾部分通常会点明或总结中心思想。"},{"question":"读一下这篇文章的第一段，它说了什么？","hint":"“Do you want to stay young? Do you know how to stay young? Here's some advice.”","takeaway":"文章开头直接用提问的方式点明了主题：关于“如何保持年轻”的建议。"},{"question":"既然开头就告诉我们文章是关于“如何保持年轻”的，那么哪个选项最适合做标题？","hint":"将开头点明的主题和四个选项进行匹配。","takeaway":"选项C “How to Stay Young” 与文章开头揭示的主题完全一致。"}]},{"title":"排除细节选项","steps":[{"question":"文章最后提到了“enjoying the simple things”（享受简单事物）和“telling people you love them”（告诉人们你爱他们）。那么选项A和B为什么不是最佳标题？","hint":"它们是文章的全部内容，还是只是一部分？","takeaway":"选项A和B只是文章列举的众多建议中的两个，它们是细节，不能概括全文，属于以偏概全。"},{"question":"一个好的标题应该像什么？是一片叶子，还是一棵大树？","hint":"标题需要覆盖文章的所有主要部分。","takeaway":"最佳标题应该像一棵大树，能够统领全文（树干），而各个段落的建议就像是树枝和树叶（细节）。"}]}]}}]},{"section_title":"III. 选词填空 (共10分)","section_instruction":"从方框中选择合适的词汇，并用其适当形式填空。每词限用一次。（方框中有两个多余选项）\n\nleave, opposite, beach, hurry, nothing, enjoy, fresh","items":[{"number":"21","item_type":"fill_blank","context_note":"","stem":"Today is Sunday. I have _____ to do.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"nothing","explanation_md":"本句意为“今天是星期天，我无事可做”。`have nothing to do` 是一个固定搭配，意为“无事可做”，用来表达一种空闲的状态。根据句意，星期天是休息日，因此“无事可做”符合生活常理和语境。此处的 `nothing` 是不定代词，作 `have` 的宾语。","knowledge_expansion_md":"### 不定代词 `nothing`, `something`, `anything`\n\n1.  **`nothing`**：意为“没有什么东西；没事”，本身含有否定意义，用于肯定句结构中表达否定概念。例如：`There is nothing in the box.` (盒子里什么也没有。) \n    `I have nothing to do.` 等同于 `I don't have anything to do.`\n\n2.  **`something`**：意为“某事；某物”，通常用于肯定句中。例如：`I have something to tell you.` (我有些事要告诉你。)\n\n3.  **`anything`**：意为“任何事；任何东西”，通常用于否定句和疑问句中。例如：`Do you have anything to say?` (你有什么要说的吗？) `He doesn't know anything about it.` (对此他一无所知。)\n\n### 固定搭配 `have sth. to do`\n\n这个结构中，不定式 `to do` 作后置定语，修饰前面的代词或名词。类似的结构还有 `have a lot of homework to do` (有很多家庭作业要做)。","socratic_tracks":[{"title":"句意理解与逻辑推断","steps":[{"question":"这句话前半句说“今天是星期天”，后半句说“我 _____ 事要做”。根据常识，星期天通常是休息日，那么人们可能会处于什么样的状态？","hint":"想一想休息日你是忙碌还是空闲？","takeaway":"句子很可能在表达“我没事可做”或“我有很多事要做”的其中一种状态。"},{"question":"英语中“没事可做”这个常见的短语是怎么表达的？","hint":"这个短语以 `have` 开头，中间需要一个表示“没有东西”的词。","takeaway":"“没事可做”的固定搭配是 `have nothing to do`。"}]},{"title":"不定代词的用法","steps":[{"question":"空格处需要填一个什么词性的词来作动词 `have` 的宾语？","hint":"可以说 `I have a book`，`book` 是名词。这里也可以用一个代词。","takeaway":"空格处需要一个名词或代词作宾语。"},{"question":"如果想用一个词在肯定句结构里表达“什么也没有”的否定意思，应该用 `something`, `anything` 还是 `nothing`？","hint":"`any-` 系列通常用于否定句和疑问句，而 `no-` 系列本身就带有否定含义。","takeaway":"`nothing` 本身表示否定，可以直接用在肯定句中，表示“什么也没有”。"}]},{"title":"不定式作后置定语","steps":[{"question":"在 `have _____ to do` 这个结构中，`to do` 是什么成分？它在修饰哪个词？","hint":"它跟在空格后面，是用来描述空格里那个“东西”的。","takeaway":"`to do` 是不定式短语，作后置定语，修饰前面的宾语。"},{"question":"你能否举一个类似的例子，比如“我有一些作业要做”？","hint":"“一些作业”是 `some homework`。","takeaway":"可以说 `I have some homework to do`，这再次证明了 `to do` 是用来修饰 `have` 的宾语的。"}]}]}},{"number":"22","item_type":"fill_blank","context_note":"","stem":"What about going swimming? The children are looking forward to _____ themselves on Children's Day.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"enjoying","explanation_md":"本句意为“去游泳怎么样？孩子们盼望着在儿童节玩得开心。”\n1.  `look forward to` 是一个固定短语，意为“盼望，期待”。\n2.  关键在于，这个短语中的 `to` 是一个介词，而不是不定式符号。\n3.  介词后面必须跟名词、代词或动名词（-ing形式）。\n4.  `enjoy oneself` 是固定搭配，意为“玩得开心”。\n5.  因此，需要将动词 `enjoy` 变为动名词形式 `enjoying` 填入空格。","knowledge_expansion_md":"### 关键短语：`look forward to doing sth.`\n\n这是一个非常重要的短语，也是小升初考试中的高频考点。学生极易将这里的 `to` 误认为是动词不定式的符号，从而在后面错跟动词原形。务必牢记，`look forward to` 中的 `to` 是介词，后面要跟名词或动名词（-ing）。\n\n*   **例句**：\n    *   `I'm looking forward to the summer holiday.` (我盼望着暑假。) - `to` + 名词\n    *   `She is looking forward to seeing her grandparents.` (她盼望着见到她的祖父母。) - `to` + 动名词\n\n### 其他含介词 `to` 的常见短语\n\n除了 `look forward to`，还有一些短语中的 `to` 也是介词，后面同样要跟名词或动名词：\n\n*   `be used to doing sth.` (习惯于做某事)\n*   `pay attention to doing sth.` (注意做某事)\n*   `get down to doing sth.` (开始认真做某事)\n*   `stick to doing sth.` (坚持做某事)\n\n### 反身代词搭配\n\n`enjoy oneself` (玩得开心) 是一个常用搭配。类似的还有 `help oneself to sth.` (随便吃/用某物), `teach oneself` (自学), `dress oneself` (自己穿衣服) 等。反身代词必须与主语在人称和数上保持一致。本题中主语是 `The children` (复数)，所以用 `themselves`。","socratic_tracks":[{"title":"关键短语 `look forward to`","steps":[{"question":"句子中的 `looking forward to` 是什么意思？","hint":"这是一个表示“期待”的短语。","takeaway":"`look forward to` 的意思是“盼望，期待”。"},{"question":"这个短语中的 `to` 是什么词性？它后面应该跟什么形式的词？","hint":"试着说“我盼望周末”，`I'm looking forward to the weekend.`，`weekend` 是名词。","takeaway":"这里的 `to` 是介词，后面必须跟名词或动名词（-ing形式）。"}]},{"title":"动词与反身代词搭配","steps":[{"question":"空格后面的 `themselves` 是什么词？它指代谁？","hint":"它是一个反身代词，通常指代句子的主语。","takeaway":"`themselves` 是反身代词，指代主语 `The children`。"},{"question":"哪个动词经常和反身代词搭配，表示“玩得开心”？","hint":"当你想祝别人玩得开心时，可以说 `Have fun!` 或者 `_____ yourself!`","takeaway":"`enjoy oneself` 是一个固定搭配，意为“玩得开心”。"}]},{"title":"语法形式综合应用","steps":[{"question":"我们已经知道 `look forward to` 后面要跟动词的-ing形式，并且要填的动词是 `enjoy`。那么，最终应该填什么？","hint":"将动词 `enjoy` 变成动名词形式。","takeaway":"我们需要将 `enjoy` 变为 `enjoying`。"},{"question":"为什么这里用 `themselves` 而不是 `himself` 或 `herself`？","hint":"反身代词要和主语的人称、单复数保持一致。句子的主语是什么？","takeaway":"因为主语是 `The children`（孩子们，复数），所以反身代词要用复数形式 `themselves`。"}]}]}},{"number":"23","item_type":"fill_blank","context_note":"","stem":"Yalong Bay in Sanya is one of the most beautiful _____ in China.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"beaches","explanation_md":"本句意为“三亚的亚龙湾是中国最美丽的海滩之一”。\n1.  `one of the + 形容词最高级 + 名词复数` 是一个固定句型，表示“最……的……之一”。\n2.  句中已经有了 `one of the most beautiful`，所以空格处必须填一个可数名词的复数形式。\n3.  根据常识，三亚的亚龙湾（Yalong Bay）是以其美丽的海滩（beach）而闻名的旅游胜地。\n4.  因此，应填入 `beach` 的复数形式 `beaches`。","knowledge_expansion_md":"### 句型 `one of the + 最高级 + 名词复数`\n\n这个句型是英语中表达“……之一”最常用的结构，是各级考试的重点。其核心要点是，最高级后面的名词必须使用复数形式，因为“一个”是从“多个”中选出来的。\n\n*   **结构**：`one of + the + 形容词最高级/most + 原级 + 名词复数`\n*   **例句**：\n    *   `Shanghai is one of the biggest cities in China.` (上海是中国最大的城市之一。)\n    *   `He is one of my best friends.` (他是我最好的朋友之一。)\n\n### 易错点\n\n学生在使用此句型时，最常犯的错误就是忘记将名词变为复数。例如，会错误地写成 `*one of the biggest city`。务必记住，既然是“之一”，就一定是从一个大于一的群体中选出，所以群体必须是复数。\n\n### 相关地理词汇\n\n*   `beach` [biːtʃ] (n.) 海滩，沙滩\n*   `bay` [beɪ] (n.) 海湾\n*   `coast` [kəʊst] (n.) 海岸，海岸线\n*   `island` [ˈaɪlənd] (n.) 岛屿\n*   `ocean` [ˈəʊʃn] (n.) 海洋","socratic_tracks":[{"title":"核心句型 `one of the...`","steps":[{"question":"当你看到 `one of the` 这个短语时，你首先会想到什么语法规则？","hint":"这个结构是用来表达“……之一”的。既然是“之一”，那么它一定是从一个群体中选出来的。这个群体是单数还是复数？","takeaway":"`one of the` 后面必须跟名词的复数形式。"},{"question":"句中 `most beautiful` 是形容词的什么级？","hint":"形容词有原级、比较级和最高级。","takeaway":"`most beautiful` 是形容词 `beautiful` 的最高级形式。"},{"question":"结合以上两点，`one of the most beautiful _____` 这个结构完整的要求是什么？","hint":"把“最高级”和“名词复数”结合起来。","takeaway":"这个句型的完整结构是 `one of the + 形容词最高级 + 名词复数`。"}]},{"title":"语境与常识判断","steps":[{"question":"句子提到了 `Yalong Bay in Sanya`（三亚的亚龙湾），根据你的地理常识或生活经验，这是个什么样的地方？","hint":"三亚是中国著名的海滨旅游城市。","takeaway":"亚龙湾是三亚一个著名的海湾，以其优美的海边风光而闻名。"},{"question":"那么，亚龙湾最可能被称作中国最美丽的什么之一？","hint":"海边最吸引人的自然景观是什么？有沙子和海水的地方。","takeaway":"亚龙湾以其美丽的海滩（beaches）而闻名。"}]},{"title":"名词复数变化规则","steps":[{"question":"我们确定了要填的词是“海滩”（beach），根据句型要求，需要用它的复数形式。`beach` 这个词应该如何变复数？","hint":"想一想以 `s, x, sh, ch` 结尾的名词，变复数时词尾有什么规则？","takeaway":"以 `ch` 结尾的名词，变复数时通常在词尾加 `-es`。"},{"question":"所以，`beach` 的复数形式是什么？","hint":"在 `beach` 后面加上 `-es`。","takeaway":"`beach` 的复数形式是 `beaches`。"}]}]}},{"number":"24","item_type":"fill_blank","context_note":"","stem":"Tom got up late this morning and he _____ to work.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"hurried","explanation_md":"本句意为“汤姆今天早上起晚了，于是他匆忙地去上班了。”\n1.  这是一个描述过去发生的一系列动作的句子，时间状语是 `this morning`（指已经过去的今天早上）。\n2.  连词 `and` 连接了两个并列的谓语动词短语：`got up late` 和 `he _____ to work`。\n3.  并列连词连接的动作时态通常需要保持一致。第一个动词 `got` 是一般过去时，所以第二个动词也应该使用一般过去时。\n4.  根据“起晚了”的逻辑结果，可以推断出汤姆是“匆忙”去上班。方框中的动词 `hurry` (匆忙，赶紧) 符合此意。\n5.  `hurry` 的过去式是 `hurried`。","knowledge_expansion_md":"### 并列句中的时态一致\n\n当连词 `and`, `but`, `or`, `so` 等连接两个或多个独立的句子或并列的谓语时，为了保持叙述的连贯性，它们的时态通常会保持一致。尤其是在按时间顺序叙述一连串动作时，使用相同的时态（尤其是一般过去时）非常普遍。\n\n*   **例句**：`He came into the room, took off his coat, and sat on the sofa.` (他走进房间，脱下外套，然后坐在了沙发上。) - 三个动作都用了一般过去时。\n\n### 一般过去时\n\n一般过去时用于表示过去某个特定时间发生并完成的动作或存在的状态。规则动词的过去式通常在词尾加 `-ed`，不规则动词则需要专门记忆。\n\n*   **时间状语**：`yesterday`, `last week`, `two days ago`, `in 1999`, `this morning` (当指过去的早上时) 等。\n\n### 词义辨析：`hurry` vs. `rush`\n\n*   **`hurry`**: 侧重于“赶紧、急忙做某事”，强调主观上的着急。例如：`Hurry, or we'll be late.` (快点，否则我们就要迟到了。)\n*   **`rush`**: 强调速度快、动作猛，带有“冲、闯”的意味，常用于形容紧急情况下的快速移动。例如：`He rushed to the hospital.` (他飞奔到医院。)\n\n在本题的语境下，两者意思相近，但根据方框所给词汇，应选用 `hurry`。","socratic_tracks":[{"title":"并列句与时态一致","steps":[{"question":"句子中的连词 `and` 起到了什么作用？它连接了哪两个动作？","hint":"`and` 前面是汤姆做的一件事，后面是他做的另一件事。","takeaway":"`and` 连接了“起床晚了”和“去上班”这两个连续发生的动作。"},{"question":"第一个动作 `got up` 使用了什么时态？","hint":"`got` 是哪个动词的过去式？","takeaway":"`got` 是 `get` 的过去式，所以这里用的是一般过去时。"},{"question":"当 `and` 连接两个按顺序发生的动作时，它们的时态通常有什么关系？","hint":"为了让叙述连贯，时态应该保持...","takeaway":"时态通常需要保持一致，所以第二个动词也应该用一般过去时。"}]},{"title":"上下文逻辑推理","steps":[{"question":"句子的前半部分“Tom got up late this morning”告诉了我们一个什么情况？","hint":"`late` 是“晚”的意思。","takeaway":"汤姆今天早上起床晚了。"},{"question":"一个人如果上班/上学起晚了，他接下来的行动会是怎样的？是慢悠悠的，还是非常着急的？","hint":"想一想你快要迟到时的状态。","takeaway":"他很可能会匆匆忙忙地赶去目的地。"}]},{"title":"词汇选择与形式变化","steps":[{"question":"根据方框中的词汇，哪个动词可以表示“匆忙、赶着去”？","hint":"想一想“快点”的英文祈使句 `Hurry up!`。","takeaway":"动词 `hurry` 可以表示“匆忙”。"},{"question":"根据前面分析的时态，应该填入 `hurry` 的什么形式？它的变位规则是什么？","hint":"我们需要 `hurry` 的过去式，注意它以 `y` 结尾。","takeaway":"需要填入 `hurry` 的过去式。`hurry` 是以“辅音字母+y”结尾的动词，其过去式需要变y为i再加-ed，即 `hurried`。"}]}]},"correct_answer":"hurried"},{"number":"25","item_type":"fill_blank","context_note":"","stem":"The bookshop _____ the supermarket is popular with the children.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"opposite","explanation_md":"本句意为“超市对面的那家书店很受孩子们欢迎”。句子主语是“书店”，需要一个词来表明它和“超市”之间的位置关系。空格处需要填入一个表示方位的介词。根据方框中的词汇，`opposite` (在……对面) 符合要求。填入后构成介词短语 `opposite the supermarket`，用来修饰 `The bookshop`，指明是哪一家书店。整个 `The bookshop opposite the supermarket` 作为主语，符合语法和句意。","knowledge_expansion_md":"### 知识点拓展：方位介词与介词短语作后置定语\n\n1.  **常见方位介词/词组**：\n    *   `in` 在……里面\n    *   `on` 在……上面（接触表面）\n    *   `at` 在……（某个地点）\n    *   `near` 在……附近\n    *   `next to` 紧邻，在……旁边\n    *   `behind` 在……后面\n    *   `in front of` 在……前面\n    *   `opposite` 在……对面\n    *   `between ... and ...` 在……和……之间\n\n2.  **`near` vs. `next to`**：\n    *   `near` 表示“附近”，指距离上很近，但不一定紧挨着。\n    *   `next to` 表示“紧邻，隔壁”，指两个物体并排挨着，中间没有其他物体。\n\n3.  **介词短语作后置定语**：\n    *   一个介词和它后面的名词（或代词）等共同构成介词短语。\n    *   当介词短语跟在一个名词后面时，可以起到修饰该名词的作用，这被称为后置定语。它能提供更多关于该名词的信息，如位置、属性等。\n    *   例如：`The book on the desk is mine.` （桌上的那本书是我的。）其中 `on the desk` 修饰 `The book`。","socratic_tracks":[{"title":"句子成分分析","steps":[{"question":"这句话的谓语动词是哪个词？","hint":"动词通常表达“是”什么，或者做什么动作。","takeaway":"句子的谓语动词是 `is`。"},{"question":"既然 `is` 是谓语动词，那么它前面的 `The bookshop _____ the supermarket` 整体在句子中充当什么成分？","hint":"在动词前面，通常是发出动作或描述状态的主体。","takeaway":"动词 `is` 前面的整个名词性部分 `The bookshop _____ the supermarket` 共同构成了句子的主语。"},{"question":"空格里的词连接了 `bookshop` 和 `supermarket`，它起到了什么语法作用？","hint":"想一想我们用什么类型的词来表示一个物体相对于另一个物体的位置？","takeaway":"空格处需要一个介词，来引导一个介词短语，修饰主语 `The bookshop`。"}]},{"title":"方位介词选择","steps":[{"question":"我们已经知道空格处需要一个表示位置的介词。请查看方框中的词汇，哪一个词可以用来描述两个地点之间的位置关系？","hint":"这个词通常用来指“在……对面”。","takeaway":"方框中的 `opposite` 是一个方位介词，意为“在……对面”。"},{"question":"将 `opposite` 填入句子中，`The bookshop opposite the supermarket`，这个句子通顺吗？它描述了一个什么样的场景？","hint":"想象一条街道，书店和超市分别在街道的两边。","takeaway":"句子通顺，意为“超市对面的那家书店”，描述了书店和超市隔街相望的场景。"}]},{"title":"语境逻辑推理","steps":[{"question":"句子的后半部分 `is popular with the children` 告诉了我们关于书店的什么信息？","hint":"`popular with...` 是一个固定搭配，意为“受……欢迎”。","takeaway":"这句话的核心信息是：这家书店在孩子们中间很受欢迎。"},{"question":"书店的位置（在超市对面）和它“受孩子们欢迎”之间可能有什么联系？","hint":"想象一下生活场景：家长带孩子去超市购物，出门时可能会顺便去对面的书店看看。","takeaway":"便利的地理位置（如靠近人流量大的超市）是这家书店受欢迎的合理解释之一，这使得句子在逻辑上非常通顺。"}]}]},"correct_answer":"opposite"}]},{"section_title":"IV. 词汇运用 (共10分)","section_instruction":"根据句意及汉语提示，填写恰当的单词。","items":[{"number":"26","item_type":"fill_blank","context_note":"","stem":"Jane's first _____ (小学) was near her house.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"primary school","explanation_md":"本题考查名词的翻译与应用。题干中的中文提示是“小学”。“小学”在英语中的标准表达是 `primary school`。其中 `primary` 意为“初级的，首要的”。在美式英语中，也常用 `elementary school`。根据句子结构 `Jane's first _____`，空格处需要填入一个名词，`primary school` 填入后，句子意思完整通顺，意为“简的第一所小学在她家附近”。","knowledge_expansion_md":"### 知识点拓展：不同教育阶段的英文表达\n\n掌握不同学习阶段的说法对于描述个人经历非常重要。\n\n*   **学前教育**: \n    *   `kindergarten` / `nursery school`: 幼儿园\n*   **基础教育**: \n    *   `primary school` (英式/通用) / `elementary school` (美式): 小学\n    *   `middle school` / `junior high school`: 初中\n    *   `high school` / `senior high school`: 高中\n*   **高等教育**:\n    *   `university` / `college`: 大学\n\n**注意**：在所有格（如 `Jane's`）或物主代词（如 `my`, `your`）之后使用序数词（如 `first`, `second`）时，序数词前不再加定冠词 `the`。例如：`my first teacher` (我的第一位老师)，而不是 `my the first teacher`。","socratic_tracks":[{"title":"核心词汇翻译","steps":[{"question":"你知道“学校”的英文是什么吗？","hint":"这是一个非常基础的单词，s-c-h-o-o-l。","takeaway":"`school` 是“学校”的总称。"},{"question":"“小学”和“中学”都是学校，我们需要用一个词来修饰 `school` 以区分它们。表示“初级的、基础的”是哪个形容词？","hint":"这个词是 p-r-i-m-a-r-y。","takeaway":"`primary` 意为“初级的、首要的”，因此 `primary school` 就是小学。"}]},{"title":"英美英语差异","steps":[{"question":"除了 `primary school`，你还知道“小学”的其他说法吗？","hint":"英语在英国和美国的用法有时会不同，就像中文里“西红柿”和“番茄”的关系。","takeaway":"`primary school` 是英式英语中更常见的说法。"},{"question":"那么在美式英语中，人们通常用哪个词组来表示“小学”？","hint":"提示词：`elementary`，这个词也有“基础的、初步的”意思。","takeaway":"`elementary school` 是美式英语中“小学”的常用表达，两者在考试中通常都正确。"}]},{"title":"限定词的规则","steps":[{"question":"句子中的 `Jane's` 是什么？它起什么作用？","hint":"它表示这个学校是属于“简”的。","takeaway":"`Jane's` 是名词所有格，作为一个限定词，表明名词的归属。"},{"question":"我们常说 `the first` (第一)，为什么这里 `first` 前面没有加 `the`？","hint":"观察一下 `Jane's` 和 `the` 的位置关系。我们能同时说 `Jane's the first school` 吗？","takeaway":"当名词前已经有了所有格（如 `Jane's`）或物主代词（如 `my`, `your`）等限定词时，就不能再使用冠词 `a/an/the`。"}]}]}},{"number":"27","item_type":"fill_blank","context_note":"","stem":"What is your _____ (最喜欢的) sport?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"favorite","explanation_md":"本题考查形容词的翻译与应用。题干中的中文提示是“最喜欢的”。“最喜欢的”在英语中对应的单词是 `favorite`（美式拼写）或 `favourite`（英式拼写）。在本句 `What is your _____ sport?` 中，空格处需要一个形容词来修饰名词 `sport`（运动）。填入 `favorite` 后，句子构成一个完整的特殊疑问句，意为“你最喜欢的运动是什么？”，符合题意。","knowledge_expansion_md":"### 知识点拓展：`favorite` 的用法与同义表达\n\n1.  **拼写差异**：\n    *   `favorite`: 美式英语拼写 (AmE)\n    *   `favourite`: 英式英语拼写 (BrE)\n    在大多数考试中，两种拼写都被视为正确。\n\n2.  **词性**：`favorite` 词性灵活，既可作形容词，也可作名词。\n    *   作形容词：`My favorite color is blue.` (我最喜欢的颜色是蓝色。)\n    *   作名词：`Which of these songs is your favorite?` (这些歌里你最喜欢哪一首？)\n\n3.  **同义表达**：询问“最喜欢”，除了用 `favorite`，还可以用 `like ... best/most` 结构。\n    *   `What is your favorite sport?` \n    *   等同于: `What sport do you like best?` 或 `What sport do you like most?`","socratic_tracks":[{"title":"核心词汇学习","steps":[{"question":"我们学过“喜欢”的英文动词是什么？","hint":"I _____ apples.","takeaway":"动词“喜欢”是 `like`。"},{"question":"如果想表达“最”喜欢，我们可以在 `like` 后面加上什么词？","hint":"good, better, _____","takeaway":"我们可以用 `like ... best` 或 `like ... most` 来表达“最喜欢”。"},{"question":"除了用动词词组，有没有一个单独的形容词，可以直接放在名词前面表示“最喜欢的”？","hint":"这个词以 'f' 开头。","takeaway":"`favorite` 是一个形容词，意为“最喜欢的”，可以直接修饰名词。"}]},{"title":"提问方式多样性","steps":[{"question":"题干中的句子 `What is your favorite sport?` 是一个经典的提问喜好的句型。请模仿它，问别人最喜欢的颜色是什么。","hint":"只需要替换掉 `sport` 这个词。","takeaway":"`What is your favorite color?` 这个句型是 `What is your favorite + 名词?`"},{"question":"如果不用 `favorite` 这个词，你还能用什么句型来问“你最喜欢什么运动”？","hint":"想想我们第一步里提到的 `like...best` 结构。","takeaway":"我们可以用 `What sport do you like best/most?` 来表达同样的意思。"}]},{"title":"词性辨析","steps":[{"question":"在 `my favorite sport` 这个短语中，`favorite` 是什么词性？它起什么作用？","hint":"它在名词 `sport` 的前面，描述 `sport` 的。","takeaway":"在这里，`favorite` 是形容词，作定语修饰名词 `sport`。"},{"question":"如果别人问你 `What's your favorite color?`，你回答 `Blue is my favorite.` 在这个回答中，`favorite` 又是什么词性？","hint":"它在句子的末尾，前面没有跟名词。它本身就代表“最喜欢的东西”。","takeaway":"在这种用法中，`favorite` 是名词，意为“最喜欢的人或物”。"}]}]}},{"number":"28","item_type":"fill_blank","context_note":"","stem":"My _____ (号码) is 942-381.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"number","explanation_md":"本题考查名词的翻译与应用。题干中的中文提示是“号码”。“号码”或“数字”在英语中都用 `number` 来表示。根据句子 `My _____ is 942-381.`，主语是 `My _____`，后面是一串数字，显然是在告知一个号码。填入 `number` 后，句子意思为“我的号码是 942-381”，语法正确，逻辑通顺。","knowledge_expansion_md":"### 知识点拓展：`number` 的用法与数字读法\n\n1.  **`number` 的常见搭配**：\n    *   `phone number`: 电话号码\n    *   `room number`: 房间号码\n    *   `ID number`: 身份证号码\n    *   `student number`: 学号\n    *   `lucky number`: 幸运数字\n\n2.  **号码的读法**：\n    *   电话号码、房间号等通常是**逐个数字**读出。\n    *   例如 `942-381` 读作 `nine four two, three eight one`。\n    *   数字 `0` 在读号码时，除了可以读作 `zero`，更常见、更口语化的读法是 `oh` (像字母O的发音)。例如，`502` 可以读作 `five oh two`。\n    *   两个相同的数字连在一起，比如 `22`，可以读作 `two two`，也可以读作 `double two`。\n\n3.  **`a number of` vs. `the number of`**:\n    *   `a number of` + 复数名词：意为“许多，一些”，谓语动词用复数。 (e.g., `A number of students are playing outside.`) \n    *   `the number of` + 复数名词：意为“……的数量”，谓语动词用单数。 (e.g., `The number of students in our class is 40.`)","socratic_tracks":[{"title":"基础词汇对应","steps":[{"question":"当我们数数时，1, 2, 3... 这些叫什么？","hint":"“数字”和“号码”在中文里意思相近。","takeaway":"1, 2, 3 是“数字”。"},{"question":"在英语中，“数字”和“号码”（如电话号码）通常用同一个单词表示，这个单词是什么？","hint":"这个单词以 'n' 开头。","takeaway":"`number` 既可以指“数字”，也可以指由数字组成的“号码”。"}]},{"title":"句子结构分析","steps":[{"question":"在句子 `My _____ is 942-381.` 中，`My` 是什么？","hint":"它表示“我的”，说明了后面名词的归属。","takeaway":"`My` 是物主代词，作定语。"},{"question":"这个句子的基本结构是什么？","hint":"主语 + be动词 + ...","takeaway":"这是一个“主-系-表”结构，`My number` 是主语，`is` 是系动词，`942-381` 是表语，用来说明主语的情况。"}]},{"title":"数字的朗读","steps":[{"question":"看到一串电话号码，比如 86-135-8888-1234，你会怎么用英文读出来？","hint":"是一个一个数字读，还是一起读？","takeaway":"电话号码等编号通常是逐位朗读的。"},{"question":"如果号码里有数字 `0`，比如房间号是 `405`，这个 `0` 怎么读比较地道？","hint":"除了 `zero`，还有一个更口语化的读法，听起来像一个英文字母。","takeaway":"在读号码时，数字 `0` 常被读作 `oh`，就像字母 O 一样。"},{"question":"如果号码里有两个 `8` 连在一起，比如 `88`，除了读 `eight eight`，还有什么更简洁的读法？","hint":"“双倍”的英文是什么？","takeaway":"连续两个相同的数字，比如 `88`，可以读作 `double eight`。"}]}]}},{"number":"29","item_type":"fill_blank","context_note":"","stem":"There are nine _____ (百) students in this school.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"hundred","explanation_md":"本题考查数词的用法。句意为“这个学校有九百名学生”。“百”的英文是 hundred。当 hundred, thousand, million 等表示确切数字时，即其前面有具体的数词（如 one, two, nine）时，它们本身不用复数形式。只有在表示概数，如“成百上千”时，才使用复数形式“hundreds of”。因此，此处应填 hundred。","knowledge_expansion_md":"### 数词单位 (hundred, thousand, million) 的用法总结\n\n1.  **表示确切数目**：当 `hundred`, `thousand`, `million` 等词前面有具体数字时，这些词保持单数形式。\n    *   `two hundred` (二百)\n    *   `five thousand` (五千)\n    *   `ten million` (一千万)\n\n2.  **表示概数（不确定的多数）**：当表示“成百的”、“成千的”等概数时，使用“`hundreds/thousands/millions of` + 名词”的结构。\n    *   `hundreds of students` (数以百计的学生)\n    *   `thousands of people` (成千上万的人)\n\n3.  **作为普通名词**：这些词也可以作为普通可数名词使用，指“一百”、“一千”等概念。\n    *   `A hundred is ten times ten.` (一百是十个十。)\n\n**易错点**：在具体数字后误用复数形式，如将 `nine hundred` 错写为 `nine hundreds`。","socratic_tracks":[{"title":"确数与概数的表达","steps":[{"question":"这句话是想表达一个精确的学生数量（九百人），还是一个大概的数量（好几百人）？","hint":"句子里用的是 `nine` 这个具体的数字。","takeaway":"句子中的 'nine' 表明了这是一个精确的数量。"},{"question":"当 hundred, thousand 等词前面有具体数字，表示精确数量时，它们本身需要变成复数形式吗？","hint":"回忆一下“二百”是 `two hundred` 还是 `two hundreds`？","takeaway":"当 hundred, thousand 等词前有具体数字时，它们保持单数形式。"},{"question":"那如果我们想表达“成百上千的”学生，应该怎么说呢？","hint":"这时需要用复数形式，并且后面要加一个介词。","takeaway":"表达概数时，我们使用 'hundreds of' 这种复数形式加 of 的结构。"}]},{"title":"词义辨析","steps":[{"question":"题目中括号里的中文是“百”，它的英文单词是什么？","hint":"这个单词以 h 开头，是学习数字时的一个重要单位词。","takeaway":"“百”的英文是 hundred。"},{"question":"这个单词除了作数词单位，还能作名词吗？比如 ‘a hundred’ 是什么意思？","hint":"它既可以指数字100，也可以指“一百个”。","takeaway":"Hundred 既是数词单位，也可以作名词，表示数量100。"}]},{"title":"句型结构分析","steps":[{"question":"“There are ...” 这个句型是用来表达什么的？","hint":"这是一个非常基础和常用的句型，表示“某地有某物”。","takeaway":"“There be” 句型用来表示“存在”，即“有”。"},{"question":"在这个句型中，be 动词（are）后面的部分是什么成分？","hint":"“nine hundred students” 在句中是主语。","takeaway":"在 “There be” 句型中，be 动词后面的名词是句子的主语。"}]}]}},{"number":"30","item_type":"fill_blank","context_note":"","stem":"My father, a great writer, made his dream come true at the age of _____ (四十).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"_____","teaching":{"correct_answer":"forty","explanation_md":"本题考查基数词的拼写。句意为“我的父亲，一位伟大的作家，在四十岁时实现了他的梦想。”。“四十”的英文是 forty。这是一个需要特别记忆的单词，其拼写是 `f-o-r-t-y`。很多同学容易受到 `four` (四) 和 `fourteen` (十四) 的影响，误写成 `fourty`，这是不正确的。因此，正确答案是 forty。","knowledge_expansion_md":"### 英语数字拼写易错点\n\n1.  **Forty vs. Four**: `four` (四) 拼写为 f-o-u-r，但 `forty` (四十) 中没有 `u`，应拼写为 f-o-r-t-y。\n\n2.  **-teen vs. -ty**: -teen 结尾的词表示十几（如 `sixteen`），重音在后；-ty 结尾的词表示几十（如 `sixty`），重音在前。注意发音和拼写的区别。\n\n3.  **特殊拼写**: \n    *   `eight` (八) -> `eighth` (第八)，只加 h。\n    *   `nine` (九) -> `ninth` (第九)，去掉 e。\n    *   `twelve` (十二) -> `twelfth` (第十二)，ve 变 f 加 th。\n    *   `five` (五) -> `fifth` (第五)，ve 变 f 加 th。\n\n4.  **固定搭配**: `at the age of...` 意为“在……岁的时候”，是表达年龄的常用短语。例如：`He started learning piano at the age of five.` (他五岁时开始学钢琴。)","socratic_tracks":[{"title":"数字拼写易错点","steps":[{"question":"我们先来拼写数字“四”，是 f-o-u-r，对吗？","hint":"这是最基础的数字之一。","takeaway":"数字“四”的英文是 four。"},{"question":"那么“四十”的拼写是不是直接在 four 后面加上 -ty 呢？","hint":"想一想 forty 和 four 的发音有什么不同？forty 里面是 /ɔː/ 的音，而没有 /aʊə/ 的音。","takeaway":"“四十”的正确拼写是 forty，需要去掉 four 中的字母 u。"}]},{"title":"基数词家族","steps":[{"question":"“四十”这个数字属于几十的范畴，它的英文单词是什么？","hint":"以 f 开头，以 -ty 结尾。","takeaway":"“四十”的英文是 forty。"},{"question":"我们来回顾一下，从 20 到 90 的整十数都怎么说？它们结尾有什么共同点？","hint":"twenty, thirty, ... ninety.","takeaway":"英语中表示整十的数字大多以 -ty 结尾，但具体拼写各有特点，需要专门记忆。"}]},{"title":"固定搭配 at the age of","steps":[{"question":"句子里 'at the age of _____' 这个短语是什么意思？","hint":"它和年龄有关，age 的意思是“年龄”。","takeaway":"短语 'at the age of...' 意为“在……岁的时候”，用来表示做某事时的年龄。"},{"question":"除了这个短语，我们还可以怎么表达“在他四十岁时”？","hint":"可以尝试用一个 when 引导的时间状语从句。","takeaway":"我们也可以用 'When he was forty...' 来表达相同的意思。"}]}]}}]},{"section_title":"V. 阅读问答 (共10分)","section_instruction":"阅读下面短文，根据所提供的信息回答问题。要求答案语法正确，语义完整切题。\n\nHello! I'm Jenny Brown. Do you want to know about my life in England? Let me tell you. I have classes from Monday to Friday. School usually starts at nine o'clock. My home is a little far from my school so I take the bus to school. We have four classes in the morning. In the afternoon we have two classes. We have English, P.E., geography, history... My fav
