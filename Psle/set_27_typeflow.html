<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .reading-sentence-bank-unit { margin-bottom: 1.5rem; }
    .reading-sentence-bank-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-passage-wrap .cloze-passage-text {
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 0;
    }
    .reading-sentence-bank-options-below { margin-top: 1.15rem; }
    .reading-sentence-bank-qhead {
      font-weight: 700;
      font-size: 1.08rem;
      margin: 0 0 0.5rem;
      color: var(--ink);
    }
    .reading-sentence-bank-opt-block { margin-bottom: 0.85rem; }
    .reading-sentence-bank-opts-grid {
      display: flex !important;
      flex-direction: column !important;
      flex-wrap: nowrap !important;
      align-items: stretch !important;
      gap: 0.4rem 0;
      grid-template-columns: unset !important;
      margin: 0 !important;
    }
    .reading-sentence-bank-opts-grid label { margin: 0; }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-table-wrap {
      overflow-x: auto;
      margin: 0.65rem 0 0.85rem;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    .reading-passage-pipe-table {
      min-width: 36rem;
      font-size: 0.98rem;
    }
    /* B 篇个人信息表（与真卷版式一致：黑框线、居中、第三行三组键值、长字段 colspan） */
    .reading-passage-text table.reading-personal-info-table,
    .exam-passage-block table.reading-personal-info-table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      border: 1.5px solid var(--ink);
      font-size: 0.96rem;
      table-layout: fixed;
    }
    .reading-personal-info-table th,
    .reading-personal-info-table td {
      border: 1px solid var(--ink);
      padding: 0.5rem 0.55rem;
      text-align: center;
      vertical-align: middle;
      word-break: break-word;
    }
    .reading-personal-info-table th {
      font-weight: 600;
      background: rgba(45, 106, 79, 0.07);
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }

    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    /* 完形填空 A/B 篇等同题型多段：PDF 每段新页 */
    .exam-cloze-pdf-unit + .exam-cloze-pdf-unit {
      break-before: page;
      page-break-before: always;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-passage-block .exam-para {
      margin: 0 0 0.55em;
      text-indent: 2em;
    }
    .exam-passage-block .exam-para:first-child { margin-top: 0; }
    .exam-passage-block .exam-para:last-child { margin-bottom: 0; }
    .exam-word-bank {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px dashed #000;
      font-size: 10.5pt;
      line-height: 1.6;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-passage-block .exam-cloze-inline-pdf {
      margin: 0;
    }
    .exam-passage-block .exam-cloze-inline-pdf .exam-para:last-child {
      margin-bottom: 0;
    }
    .exam-reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      line-height: 1.45;
      margin: 2mm 0 4mm;
    }
    .exam-reading-fill-table th,
    .exam-reading-fill-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
    }
    .exam-reading-fill-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-pipe-table-wrap {
      margin: 2mm 0 4mm;
      width: 100%;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-reading-pipe-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
      line-height: 1.38;

    }
    .exam-reading-pipe-table th,
    .exam-reading-pipe-table td {
      border: 1px solid #222;
      padding: 1.8mm 2mm;
      vertical-align: top;
      word-wrap: break-word;
    }
    .exam-reading-pipe-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-unit {
      margin-bottom: 4mm;
      break-inside: auto;
      page-break-inside: auto;
    }
    /* 同一题型内：每道小题（题干+选项）尽量不跨页 */
    .exam-item {
      margin: 0 0 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item .exam-item-row,
    .exam-item .exam-opts-row {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item-row {
      display: block;
      margin: 0;
    }
    .exam-n {
      font-weight: 700;
      margin-right: 0.35em;
    }
    .exam-paren { letter-spacing: 0.2em; margin-right: 0.25em; }
    .exam-blank {
      border-bottom: 1px solid #000;
      padding: 0 1.2em;
      margin: 0 0.15em;
    }
    /* 阅读/单选等：默认 2×2；按选项数单列等分对齐 */
    .exam-opts-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 1.5em;
      row-gap: 0.3em;
      margin: 1mm 0 0 2.2em;
      font-size: 10.5pt;
      align-items: start;
    }
    .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
    }
    /* 阅读理解 PDF：选项纵向排列，字母与正文对齐，避免三列过窄、英文被拆字换行 */
    .exam-item-reading .exam-opts-row {
      display: block;
      margin: 1.5mm 0 0 2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-cols-2,
    .exam-item-reading .exam-opts-row.exam-opts-cols-3,
    .exam-item-reading .exam-opts-row.exam-opts-cols-4 {
      display: block;
    }
    .exam-item-reading .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.55em;
      padding: 0;
      line-height: 1.5;
      text-align: left;
      min-width: 0;
    }
    .exam-item-reading .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    .exam-item-reading .exam-opt-chip b {
      margin-right: 0;
      font-weight: 700;
    }
    /* 阅读判断 PDF：与网页一致，横向 T / F */
    .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35em 0.65em;
      margin: 1mm 0 0 2.2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      margin: 1.5mm 0 0 2em;
    }
    .exam-opts-tf-pair .exam-tf-choice {
      font-weight: 700;
      font-size: 11pt;
      min-width: 1.1em;
      text-align: center;
    }
    .exam-opts-tf-pair .exam-tf-slash {
      color: #444;
      font-weight: 600;
      padding: 0 0.2em;
    }
    .exam-reading-sentence-bank-questions {
      margin-top: 4mm;
    }
    .exam-reading-sentence-bank-qnum {
      font-weight: 700;
      font-size: 11pt;
      margin: 0 0 1.5mm;
    }
    .exam-reading-sentence-bank-item {
      margin-bottom: 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-reading-sentence-bank-item .exam-opts-row {
      display: block;
      margin: 0 0 0 1.5em;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.45em;
      line-height: 1.45;
      text-align: left;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    /* 补全对话 PDF：题干已在左侧对话中，不重复「51.（ ）」等题目行，仅题号 + 方框选项 */
    .exam-item-cloze.exam-cloze-dialogue-gap {
      display: block;
    }
    .exam-cloze-dialogue-gap {
      margin: 0.55em 0 0.65em;
    }
    .exam-cloze-dialogue-gap .exam-dialogue-gap-num {
      display: block;
      font-weight: 700;
      margin: 0 0 0.35em 0.15em;
      font-size: 11pt;
    }
    /* 完形 PDF：题号与 A–D 同一行横向排列 */
    .exam-item-cloze {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 1em;
      row-gap: 0.6mm;
    }
    .exam-item-cloze .exam-item-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2em 0.45em;
    }
    .exam-item-cloze .exam-opts-row {
      display: grid;
      column-gap: 0.85em;
      row-gap: 0.2em;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr));
    }
    /* 完形 PDF：整卷表格，题号与 A/B/C 同一行；各题 A 列、B 列、C 列分别左对齐 */
    .exam-cloze-pdf-grid {
      display: grid;
      grid-template-columns: minmax(2.85em, auto) repeat(3, minmax(0, 1fr));
      column-gap: 0.75em;
      row-gap: 0.5em;
      margin: 0.55em 0 0.85em;
      align-items: start;
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-4opt {
      grid-template-columns: minmax(2.85em, auto) repeat(4, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-5opt {
      grid-template-columns: minmax(2.85em, auto) repeat(5, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-6opt {
      grid-template-columns: minmax(2.85em, auto) repeat(6, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-7opt {

    .exam-cloze-pdf-num {

      font-weight: 600;
    }
    .exam-cloze-pdf-num .exam-n {
      font-weight: 700;
    }
    .exam-cloze-pdf-opt {
      text-align: left;
      min-width: 0;
      line-height: 1.45;
    }
    .exam-cloze-pdf-opt b {
      font-weight: 700;
      margin-right: 0.25em;
    }
    .exam-cloze-pdf-opt-empty {

      pointer-events: none;
      min-height: 1em;
    }
    .exam-item-cloze .exam-cloze-pdf-grid {
      flex: 1 1 100%;
      width: 100%;
    }
    .exam-item-cloze .exam-opt-chip {
      display: block;
      min-width: 0;
    }
    .exam-opt-chip {
      min-width: 0;
    }
    .exam-paper-doc .phonetic-ul,
    #printHost .phonetic-ul {

      text-underline-offset: 0.12em;
      text-decoration-thickness: 0.08em;

    }
    .exam-opt-chip b { margin-right: 0.25em; }
    .exam-item-cloze .exam-opt-chip b {
      display: inline-block;
      min-width: 1.15em;
      margin-right: 0.2em;
    }
    .exam-answer-lines {
      min-height: 14em;
      margin-top: 2mm;
      border: 1px solid #333;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.45em,
        #ddd 1.45em,
        #ddd calc(1.45em + 1px)
      );
    }
    /* 句型转换、词汇填空等书写题：与客观题区分的标准卷面条目 + 作答横线区 */
    .exam-item-written {
      padding: 0 0 1mm 0;
    }
    .exam-item-written .exam-item-row {
      line-height: 1.55;
      font-size: 10.5pt;
      text-align: justify;
    }
    .exam-written-lines {
      min-height: 4.2em;
      margin: 1.5mm 0 0 0;
      border: 1px solid #222;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.38em,
        #e0e0e0 1.38em,
        #e0e0e0 calc(1.38em + 0.55px)
      );
    }
    .exam-paper-doc .exam-writing-stem-wrap {
      margin: 1.5mm 0 0;
      font-size: 10.5pt;

    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table,
    #printHost .writing-prompt-table {

      color: #000;

    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table th,
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table td,
    #printHost .writing-prompt-table th,
    #printHost .writing-prompt-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
      text-align: left;

    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table thead th,

    @media print {
      @page { size: A4; margin: 12mm 14mm; }

        background: #fff !important;

      .exam-item-cloze .exam-paren,
      .exam-item-cloze .exam-blank,
      .exam-cloze-pdf-num .exam-paren {
        display: none !important;
      }

  </style>
</head>
<body>
  <div id="view-home" class="view active">
    <header class="flow" style="position:relative;margin:0 0 1rem;border-radius:0 0 12px 12px;">
      <h1 id="homeTitle">按题型练习</h1>
      <button type="button" class="btn secondary" id="btnPdfFull" title="按标准纸笔试卷版式排版，打印对话框中选「另存为 PDF」">导出 PDF（整套·标准试卷版式）</button>

    <div id="quizIntro"></div>
    <div id="quizBody"></div>

    </div>
  </div>

      <h1 id="resultTitle">本题型结果</h1>
      <button type="button" class="btn secondary" id="btnBackHome2">← 题型首页</button>
    </header>
    <div class="card" id="resultSummary"></div>
    <div style="text-align:center;margin:1rem 0;">
      <button type="button" class="btn primary" id="btnGoLearn">进入本题型讲解</button>
    </div>
  </div>

  <div id="view-learn" class="view">

  <div id="printHost" aria-hidden="true"></div>

  <div id="modal" aria-hidden="true">
    <div class="box">

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第27套","exam_meta":{"full_score_text":"满分:100分","time_text":"时间:60分钟"},"sections":[{"section_title":"一、选择填空","section_instruction":"(共15分)\nA. 第1—4题：从 A、B、C、D 四个选项中选出与下列各句中画线部分意思相同或相近，并能替换画线部分的选项。(共4分)\nB. 第5—15题：从各题的 A、B、C 三个选项中选出正确答案。(共11分)","items":[{"number":"1","item_type":"choice","context_note":"","stem":"This girl is my \u003cu>aunt's daughter\u003c/u>.","options":{"A":"How about","B":"Her books","C":"helping me","D":"cousin"},"answer_area_hint":"( )","teaching":{"correct_answer":"D","explanation_md":"本题考察对家庭成员称谓的掌握。题干划线部分 `aunt's daughter` 意为“姑姑或阿姨的女儿”。根据英语中亲属关系的表达，这个称谓对应的单词是 `cousin`（堂/表兄弟姐妹）。选项A `How about` 用于提建议，选项B `Her books` 意为“她的书”，选项C `helping me` 意为“帮助我”，均与题意不符。因此，正确答案是D。","knowledge_expansion_md":"### 英语亲属关系词汇\n\n1.  **核心词汇**：\n    *   `parent`: 父母\n    *   `father`/`mother`: 父亲/母亲\n    *   `sibling`: 兄弟姐妹\n    *   `brother`/`sister`: 兄弟/姐妹\n    *   `spouse`: 配偶\n    *   `husband`/`wife`: 丈夫/妻子\n    *   `child`/`children`: 孩子（单数/复数）\n    *   `son`/`daughter`: 儿子/女儿\n\n2.  **旁系亲属**：\n    *   `uncle`: 叔叔、伯伯、舅舅、姑父、姨父\n    *   `aunt`: 姑姑、姨、婶婶、伯母、舅妈\n    *   `cousin`: 堂/表兄弟姐妹（不区分性别）\n    *   `nephew`: 侄子、外甥\n    *   `niece`: 侄女、外甥女\n\n3.  **所有格 's**：表示“……的”，如 `aunt's daughter` 指“阿姨的女儿”。当名词是复数时，所有格通常只加撇号 `'`，如 `my parents' car`（我父母的车）。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"题干中划线部分 `aunt's daughter` 是什么意思？","hint":"`aunt` 是阿姨或姑姑，`daughter` 是女儿。","takeaway":"`aunt's daughter` 指的是“阿姨/姑姑的女儿”。"},{"question":"这个称谓在中文里我们叫什么？","hint":"想想你妈妈的姐妹或者爸爸的姐妹，她们的女儿你应该怎么称呼？","takeaway":"我们称之为“表姐妹”或“堂姐妹”。"},{"question":"那么在英语中，哪个单词可以概括“表/堂兄弟姐妹”这个概念？","hint":"看看选项中哪个词与家庭成员有关。","takeaway":"英语中的 `cousin` 既可以指堂/表兄弟，也可以指堂/表姐妹。"}]},{"title":"句子结构","steps":[{"question":"这个句子 `This girl is my ___` 是一个什么类型的句子？","hint":"它在描述 `This girl` 的身份。","takeaway":"这是一个主系表结构的句子，用来介绍或描述主语。"},{"question":"空格处需要填入一个什么词性的词来替换划线部分？","hint":"`is` 是系动词，后面通常跟名词、代词或形容词作表语，说明主语的身份或状态。","takeaway":"空格处需要一个名词来指代 `This girl` 的身份。"},{"question":"比较四个选项，哪个是表示身份的名词，并且能替换 `aunt's daughter`？","hint":"A是建议句型，B是名词短语但意思不符，C是动名词短语。","takeaway":"只有 D `cousin` 是一个表示亲属关系的名词，且意思与划线部分一致。"}]},{"title":"亲属关系词汇拓展","steps":[{"question":"`uncle's son` 应该用哪个词来表示？","hint":"`uncle's son` 和 `aunt's daughter` 的关系是类似的。","takeaway":"`uncle's son` 也是 `cousin`。"},{"question":"那么 `brother's son` 呢？这和 `cousin` 有什么不同？","hint":"这是隔了一代的关系，是你兄弟的儿子。","takeaway":"`brother's son` 是 `nephew` (侄子)，而 `brother's daughter` 是 `niece` (侄女)，这与 `cousin` (堂/表兄弟姐妹) 是不同的亲属关系。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"These green books on the table are \u003cu>hers\u003c/u>.","options":{"A":"How about","B":"Her books","C":"helping me","D":"cousin"},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考察名词性物主代词的用法。划线单词 `hers` 是一个名词性物主代词，意思是“她的（东西）”。它的完整形式是“形容词性物主代词 + 名词”。在这个句子中，主语是 `These green books`（这些绿色的书），所以 `hers` 指代的就是 `her books`（她的书）。因此，选项B是正确的等价表达。","knowledge_expansion_md":"### 形容词性物主代词 vs. 名词性物主代词\n\n这两种代词都表示所有关系，但用法不同。\n\n1.  **形容词性物主代词 (Possessive Adjectives)**\n    *   形式: `my`, `your`, `his`, `her`, `its`, `our`, `their`\n    *   用法: 必须放在名词前，起修饰作用，相当于形容词。不能单独使用。\n    *   例句: This is **my** book. (这是我的书。)\n\n2.  **名词性物主代词 (Possessive Pronouns)**\n    *   形式: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`\n    *   用法: 可单独使用，在句子中充当主语、宾语或表语，本身已包含名词的含义。\n    *   例句: This book is **mine**. (这本书是我的。)\n\n**转换公式**: 名词性物主代词 = 形容词性物主代词 + 名词\n*   `mine` = `my` + n.\n*   `hers` = `her` + n.\n*   `theirs` = `their` + n.","socratic_tracks":[{"title":"物主代词辨析","steps":[{"question":"划线单词 `hers` 是什么词性？它在句子中起什么作用？","hint":"它表示“某人的东西”，并且可以独立使用，后面不跟名词。","takeaway":"`hers` 是名词性物主代词，意思是“她的（东西）”。"},{"question":"`hers` 在这个句子里具体指代什么？","hint":"看看句子的主语是什么。","takeaway":"`hers` 指代的是句子的主语 `These green books`。"},{"question":"那么，如何用另一种方式表达“她的书”这个意思？","hint":"使用“她的”这个形容词，后面加上名词。","takeaway":"“她的书”可以用 `her books` 来表达。"}]},{"title":"两种物主代词的转换","steps":[{"question":"短语 `my book` 可以用哪个单独的单词来替换？","hint":"找一个表示“我的东西”并且能单独使用的词。","takeaway":"`my book` 可以用 `mine` 替换。"},{"question":"那么 `her book` 呢？","hint":"参照 `my book` -> `mine` 的变化，注意 `her` 对应的变化。","takeaway":"`her book` 可以用 `hers` 替换。"},{"question":"反过来，本题中的 `hers` 可以被哪个短语替换，而保持句子意思不变？","hint":"句子的主语是 `These green books`。","takeaway":"`hers` 等于 `her books`，所以选项 B 是正确的。"}]},{"title":"句子成分分析","steps":[{"question":"句子 `These green books on the table are hers.` 的主语是什么？","hint":"句子的核心讨论对象是谁或什么？","takeaway":"主语是 `These green books on the table`。"},{"question":"`are` 在这个句子中是什么动词？`hers` 又是什么成分？","hint":"`are` 是 be 动词的一种形式，它后面的成分叫什么？","takeaway":"`are` 是系动词，`hers` 是表语，用来表明主语的归属。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"Thank you very much for \u003cu>your help\u003c/u>.","options":{"A":"How about","B":"Her books","C":"helping me","D":"cousin"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考察介词 `for` 后面的宾语形式。题干中 `Thank you for...` 是一个固定句型，用于表达感谢。介词 `for` 后面可以跟名词、代词或动名词（-ing形式）。划线部分 `your help` 是一个名词短语，意为“你的帮助”。选项C `helping me` 是一个动名词短语，意为“帮助我”。在表达感谢的语境中，`Thank you for your help` 和 `Thank you for helping me` 意思几乎完全相同，可以互换。因此，C选项是正确的。","knowledge_expansion_md":"### 介词后的宾语形式\n\n介词（如 `for`, `in`, `at`, `of`, `about` 等）后面必须跟宾语，其宾语形式可以是：\n\n1.  **名词或名词短语**：\n    *   `Thank you for **your help**.` (感谢你的帮助。)\n    *   `She is good at **music**.` (她擅长音乐。)\n\n2.  **代词（宾格）**：\n    *   `This is a gift for **you**.` (这是给你的礼物。)\n    *   `He is talking about **us**.` (他在谈论我们。)\n\n3.  **动名词（-ing形式）**：当介词后跟一个动作时，该动词需要变为-ing形式。\n    *   `Thank you for **helping me**.` (感谢你帮助我。)\n    *   `I'm interested in **learning English**.` (我对学英语感兴趣。)\n\n**易错点**：介词后不能直接跟动词原形。错误：`Thank you for help me.` 正确：`Thank you for helping me.`","socratic_tracks":[{"title":"介词后的宾语","steps":[{"question":"句子中的 `for` 是什么词性？","hint":"它用在名词或代词前，表示原因或对象。","takeaway":"`for` 是一个介词。"},{"question":"介词后面通常跟什么形式的词或短语？","hint":"想想 `look at me`, `interested in swimming` 这些例子。","takeaway":"介词后面可以跟名词、代词或动名词（-ing形式）作宾语。"},{"question":"划线部分 `your help` 是名词短语，选项中哪个是动名词短语，并且意思相近？","hint":"动名词由动词原形加 -ing 构成。","takeaway":"`helping me` 是动名词短语，与 `your help` 意思相近，都可以跟在 `for` 后面。"}]},{"title":"名词与动名词的转换","steps":[{"question":"`your help` 中的 `help` 是名词还是动词？","hint":"它前面有形容词性物主代词 `your` 修饰。","takeaway":"这里的 `help` 是名词，意为“帮助”。"},{"question":"如何把“你的帮助”这个意思里的“帮助”用一个动作来表达？","hint":"动词 `help` (帮助) + 宾语 `me` (我)。","takeaway":"可以用动词短语 `help me` 来表达这个动作。"},{"question":"当 `help me` 这个动作需要放在介词 `for` 后面时，`help` 需要变成什么形式？","hint":"动词不能直接跟在介词后面，需要做一些变化。","takeaway":"动词需要变成动名词形式，即 `helping`，所以整个短语是 `helping me`。"}]},{"title":"表达感谢","steps":[{"question":"`Thank you for...` 是一个用来做什么的句型？","hint":"它的意思是“为……而感谢你”。","takeaway":"这是一个常用的表达感谢的句型。"},{"question":"如果我想感谢朋友邀请我参加派对，我可以说 `Thank you for your ______` (用名词)。","hint":"用 `invitation` (邀请) 这个名词。","takeaway":"`Thank you for your invitation.`"},{"question":"我也可以用动词形式说 `Thank you for ______ me to your party.` (用动词)。","hint":"把动词 `invite` 变成适合放在 `for` 后面的形式。","takeaway":"`Thank you for inviting me to your party.` 这说明了名词和动名词在特定句型中可以替换使用。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"\u003cu>What about\u003c/u> these pens? Are they Andy's, too?","options":{"A":"How about","B":"Her books","C":"helping me","D":"cousin"},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考察功能句型的同义替换。题干划线部分 `What about` 是一个常用于提出建议或询问情况的句型，意为“……怎么样？”或“那……呢？”。选项A `How about` 与 `What about` 在绝大多数情况下意思和用法完全相同，可以互换使用。本句中，`What about these pens?` 是在询问“那这些钢笔呢？”，与 `How about these pens?` 意思一致。因此，A是正确答案。","knowledge_expansion_md":"### 提建议句型：What about vs. How about\n\n`What about...?` 和 `How about...?` 都是非常口语化和常用的句型，用于提出建议或询问意见。\n\n1.  **结构**：\n    *   `What/How about + 名词/代词?`\n    *   `What/How about + 动名词 (-ing)?`\n\n2.  **用法与区别**：\n    *   **提建议**: 两者通常可以互换。\n        *   `How about going for a picnic?` (去野餐怎么样？)\n        *   `What about a cup of coffee?` (来杯咖啡怎么样？)\n    *   **询问情况/意见**: 两者也通常可以互换。\n        *   `I'm from China. How about you?` (我来自中国，你呢？)\n        *   `This T-shirt is nice. What about that one?` (这件T恤不错，那件呢？)\n    *   **细微差别**：在某些语境下，`What about` 还可以用来引出一个潜在的问题或障碍，而 `How about` 较少这样用。例如：`We can go at 8. But what about the traffic?` (我们可以8点走。但是交通怎么办呢？) 不过对于初学者而言，将两者视为同义词即可。","socratic_tracks":[{"title":"功能句型辨析","steps":[{"question":"划线短语 `What about` 在这个句子中起什么作用？","hint":"说话人可能正在讨论其他物品，然后转换话题到 `these pens`。","takeaway":"`What about` 用来引出新的话题或询问关于某事的情况。"},{"question":"在英语中，还有一个和 `What about` 意思和用法几乎完全一样的短语是什么？","hint":"只是把 `What` 换成了另一个疑问词。","takeaway":"`How about` 和 `What about` 意思和用法基本相同。"}]},{"title":"提出建议","steps":[{"question":"如果你想建议大家去看电影，可以用 `What about...` 怎么说？","hint":"`go to the cinema` 这个动作需要放在 `What about` 后面，注意动词形式。","takeaway":"`What about going to the cinema?`"},{"question":"同样的意思，用 `How about...` 应该怎么说？","hint":"句型结构是一样的。","takeaway":"`How about going to the cinema?`"},{"question":"这说明了 `What about` 和 `How about` 在提出建议时有什么关系？","hint":"它们可以互相替换吗？","takeaway":"在提出建议时，`What about` 和 `How about` 完全可以互换。"}]},{"title":"句型结构","steps":[{"question":"`What about` 和 `How about` 后面可以跟什么词性的词或短语？","hint":"观察 `What about these pens?` 和 `What about going to the cinema?` 这两个例子。","takeaway":"它们后面可以跟名词（或名词短语）和动名词（-ing形式）。"},{"question":"看看四个选项，哪个选项的结构和功能与 `What about` 最相似？","hint":"哪个选项也是一个用于提问或建议的短语？","takeaway":"只有 `How about` 是一个功能和结构都与 `What about` 相似的短语。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"I have a book. _____ book is in the bookcase.","options":{"A":"A","B":"An","C":"The","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查定冠词“the”的用法。第一句“I have a book.”首次提到“一本书”，用不定冠词“a”表示泛指。第二句“_____ book is in the bookcase.”中提到的“book”是特指第一句中已经出现过的那本书，因此需要用定冠词“the”来表示特指。整个句子的意思是“我有一本书。这本书在书柜里。”","knowledge_expansion_md":"冠词是英语中非常重要的词类，分为不定冠词（a/an）和定冠词（the）。\n\n1.  **不定冠词 (a/an)**：用于单数可数名词前，表示泛指，即“一（个）”。\n    *   `a` 用在以辅音音素开头的单词前，如 `a boy`, `a university` (university 的首音素是 /j/，是辅音)。\n    *   `an` 用在以元音音素开头的单词前，如 `an apple`, `an hour` (hour 的 h 不发音，首音素是 /aʊ/，是元音)。\n\n2.  **定冠词 (the)**：用于表示特指，即谈话双方都知道的人或事物。常见用法包括：\n    *   上文已提过的人或物（如此题）。\n    *   世界上独一无二的事物，如 `the sun`, `the moon`。\n    *   指谈话双方都明确的事物，如 `Please open the door.`\n    *   用在序数词和形容词最高级前，如 `the first day`, `the best student`。","socratic_tracks":[{"title":"冠词的特指与泛指","steps":[{"question":"第一句话 “I have a book” 里的 “a book” 是指任何一本不特定的书，还是某本特定的书？","hint":"不定冠词 “a” 有“一个”的意思，通常不指定是哪一个。","takeaway":"“a book” 在这里是泛指，表示“一本书”，而不是特指某本具体的书。"},{"question":"第二句话 “_____ book is in the bookcase” 里的 “book” 是指哪本书？","hint":"联系上下文，这句话是在描述第一句话里提到的那本书。","takeaway":"这里的 “book” 指的是第一句中提到的那本特定的书。"},{"question":"当我们谈论一个特定的、上文提到过的人或物时，应该用哪个冠词？","hint":"表示“这个”或“那个”特定事物的冠词是定冠词。","takeaway":"特指上文提到过的名词时，必须使用定冠词 “the”。"}]},{"title":"冠词的分类","steps":[{"question":"英语中的冠词可以分为哪两大类？它们的基本含义是什么？","hint":"一类表示“一个”，另一类表示“这个/那个”。","takeaway":"冠词分为不定冠词 (a/an)，表示泛指“一”；和定冠词 (the)，表示特指“这/那”。"},{"question":"选项 A, B, C 分别属于哪一类冠词？","hint":"想一想它们各自的含义和用法。","takeaway":"A (A) 和 B (An) 是不定冠词，C (The) 是定冠词。"}]},{"title":"语境理解","steps":[{"question":"如果只有第二句话 “_____ book is in the bookcase”，我们可以填 “A” 吗？如果可以，那是什么意思？","hint":"脱离第一句话的语境，单独看这句话。","takeaway":"可以填“A”，句子 “A book is in the bookcase” 意思是“有一本书在书柜里”，是完全正确的，但它表达的是泛指。"},{"question":"为什么在这道题里，我们不能只看第二句话，而必须把两句话联系起来？","hint":"这两句话构成了一个完整的语境，后一句是对前一句的补充说明。","takeaway":"因为这是一个连贯的语境，后一句中的名词“book”的指代对象由前一句决定，所以必须联系上下文来选择正确的冠词。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Welcome to my family, _____?\n—My father Jack and my mother Tracy.","options":{"A":"This is","B":"He is","C":"These are","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查介绍人物的句式。根据答语“My father Jack and my mother Tracy.”可知，这里介绍了两个人。在英语中，介绍单个人或物时用“This is...”，而介绍多个人或物时用“These are...”。选项A“This is”和选项B“He is”都用于指代单数，不符合题意。因此，只有选项C“These are”是正确的。虽然题干中的问号使用不规范，但根据问答逻辑，最合理的场景是介绍多位家庭成员。","knowledge_expansion_md":"在英语中，介绍人物有固定的表达方式：\n1.  **介绍单人**: `This is + [人名/关系]`. 例如: `This is my friend, Lucy.` (这是我的朋友，露西。)\n2.  **介绍多人**: `These are + [人名/关系]`. 例如: `These are my parents.` (这些是我的父母。)\n\n**辨析 `This is` 和 `He/She is`**: \n*   `This is` 用于首次向第三方介绍某人，起“引见”作用。\n*   `He is / She is` 用于介绍完之后，进一步描述这个人的信息（如职业、年龄等）。\n*   例如: `This is my brother, Tom. He is a doctor.` (这是我哥哥汤姆。他是一名医生。) 先用 `This is` 引见，再用 `He is` 补充信息。\n\n**辨析 `These are` 和 `They are`**: \n*   `These are` 用于首次近距离介绍多个人或物。\n*   `They are` 用于后续的补充描述，或者回答 `Who are they?` 这类问题。\n*   例如: `Who are they?` `They are my teachers.` (他们是谁？他们是我的老师。)","socratic_tracks":[{"title":"单复数匹配","steps":[{"question":"请看答语 “My father Jack and my mother Tracy.”，这里提到了几个人？","hint":"数一数 “and” 连接了几个身份。","takeaway":"答语中提到了两个人：父亲杰克和母亲特蕾西。"},{"question":"既然是两个人，我们在介绍时应该用表示单数的形式还是复数的形式？","hint":"一个人是单数，多于一个人就是复数。","takeaway":"介绍多于一个人时，需要使用复数形式。"},{"question":"在选项 A, B, C 中，哪一个是用来介绍复数的人或物的？","hint":"“This is” 和 “He is” 都指一个人。","takeaway":"“These are” 是用于介绍复数概念的，而 “This is” 和 “He is” 用于单数。"}]},{"title":"介绍他人的句式","steps":[{"question":"如果我只想向你介绍我的朋友 Tom 一个人，我应该说 “This is Tom” 还是 “These are Tom”？","hint":"Tom 是一个人，是单数。","takeaway":"介绍一个人时，我们通常说 “This is...”。"},{"question":"介绍完 Tom 之后，我想接着说他是一名学生，应该用 “This is a student” 还是 “He is a student”？为什么？","hint":"“This is” 主要用于初次引见，后续描述应该用什么代词？","takeaway":"“This is” 用于初次介绍，之后再提到他时，应用人称代词 “He is” 进行描述。"}]},{"title":"问答逻辑推断","steps":[{"question":"看到答语是 “My father Jack and my mother Tracy.”，你认为对方可能问了什么问题？","hint":"这个问题是关于“谁”还是“什么”？是单数还是复数？","takeaway":"对方很可能问了 “Who are they?” 或 “Who are these people?” (他们是谁？)。"},{"question":"那么，在回答 “Who are they?” 时，我们可以用 “These are...” 开头来具体指明是谁吗？","hint":"比如，指着两个人说：“这些是我的父母”。","takeaway":"可以，用 “These are...” 来回答 “Who are they?” 是非常自然的，意为“这些是……”。"},{"question":"综合来看，为什么选项 C 是唯一符合这个场景逻辑的？","hint":"考虑答语是复数，以及介绍人物的常用句式。","takeaway":"因为答语内容是复数，所以介绍时必须使用复数形式 “These are”。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"—Excuse me, _____?\n—They are on the tape player.","options":{"A":"where are the tapes","B":"Where are the tapes","C":"How are the tapes","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查特殊疑问句和书写规范。答语是“They are on the tape player.”（它们在磁带播放机上），这是一个描述地点的句子。因此，问句应该用提问地点的特殊疑问词“Where”（在哪里）开头。答语中的代词“They”（它们）是复数，说明问句中询问的名词也应该是复数“tapes”。选项A和B都询问磁带的位置，但选项A的首字母“w”没有大写，不符合英语句子开头的书写规范。选项C用“How”提问，意为“怎么样”，与答语的地点信息不符。因此，只有选项B是完全正确的。","knowledge_expansion_md":"1.  **特殊疑问词 (Wh- Words)**：英语中用于提出具体问题的疑问词，常见的有：\n    *   `Who`: 问“谁” (询问人)\n    *   `What`: 问“什么” (询问事物、信息)\n    *   `Where`: 问“哪里” (询问地点)\n    *   `When`: 问“何时” (询问时间)\n    *   `Why`: 问“为什么” (询问原因)\n    *   `How`: 问“怎样” (询问方式、状况、程度)\n\n2.  **英语书写规范 (Capitalization and Punctuation)**：\n    *   **首字母大写**：每个句子的第一个单词的首字母必须大写。这包括陈述句、疑问句和感叹句。\n    *   **句末标点**：每个句子必须以句号(.)、问号(?)或感叹号(!)结尾。\n    *   在选择题中，书写规范（如大小写、标点）也是一个重要的考点。\n\n3.  **代词与指代物的一致性**：问句和答句之间，代词和它所指代的名词在“数”（单数/复数）上必须保持一致。例如：`Where is the book?` -> `It is on the desk.` (`It` 指代 `the book`)；`Where are the books?` -> `They are on the desk.` (`They` 指代 `the books`)。","socratic_tracks":[{"title":"特殊疑问词的运用","steps":[{"question":"看到回答是 “on the tape player”（在磁带播放机上），你觉得这是在回答关于什么信息的问题？是时间、地点、还是原因？","hint":"“在……上”是一个表示位置的短语。","takeaway":"这是一个关于“地点”的信息。"},{"question":"英语中，用来提问“地点”的疑问词是哪一个？","hint":"通常以 W 开头，意思是“在哪里”。","takeaway":"提问地点要用特殊疑问词 “Where”。"},{"question":"选项 C 用了 “How”，它通常是用来问什么的？能和本题的回答匹配吗？","hint":"比如 “How are you?” 是问你“怎么样”。","takeaway":"“How” 通常用来询问方式或状况（“怎么样”），与表示地点的回答不匹配。"}]},{"title":"英语书写规范","steps":[{"question":"比较一下选项 A 和选项 B，它们的内容几乎一样，但有一个很小的区别，是什么？","hint":"仔细观察每个选项的第一个字母。","takeaway":"选项 A 的 “where” 是小写字母开头，而选项 B 的 “Where” 是大写字母开头。"},{"question":"在英语写作中，一个完整的句子的开头有什么要求？","hint":"无论是陈述句、疑问句还是感叹句，开头都有一个共同的规则。","takeaway":"英语中任何一个完整的句子都必须以大写字母开头。"},{"question":"那么，即使选项 A 的意思正确，为什么它仍然是一个错误选项？","hint":"在正式的书面语和考试中，格式和内容同样重要。","takeaway":"因为它不符合基本的书写规范，在正式考试中会被认为是错误的。"}]},{"title":"代词与指代","steps":[{"question":"回答 “They are on the tape player” 中的 “They” 指的是什么？","hint":"“They” 是复数代词，意思是“它们”或“他们”。它在对话中代替了问句里的某个名词。","takeaway":"“They” 指的是问句中提到的 “the tapes”（磁带）。"},{"question":"“They” 是单数还是复数？这说明它指代的名词 “tapes” 应该是单数还是复数？","hint":"代词和它指代的名词在数量上要一致。","takeaway":"“They” 是复数，所以它指代的名词 “tapes” 也必须是复数。"},{"question":"如果问题是 “Where is the tape?” (单数)，那么回答应该用 “It is...” 还是 “They are...”？","hint":"用什么代词来指代单个的物品？","takeaway":"如果问的是单数名词 “tape”，回答时就应该用单数代词 “It”，即 “It is...”。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"—Are these pens your sister's?\n—No, _____ aren't. They are _____ sister's.","options":{"A":"they; Lily","B":"they; Lily's","C":"these; Lily","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查人称代词和名词所有格的用法。\n1.  **第一个空**：问句的主语是“these pens”（这些笔），是复数。在简略回答中，通常用人称代词来代替前面提到的名词。代替复数名词“these pens”的正确人称代词是“they”。所以第一空填“they”，构成“No, they aren't.”。\n2.  **第二个空**：句意是“它们是……姐姐的（笔）”。这里需要表达“莉莉的姐姐”这个概念。在英语中，“莉莉的”是“Lily's”，“莉莉的姐姐”就是“Lily's sister”。因此，空格处应填“Lily's”，与后面的“sister's”构成“Lily's sister's”，意为“（属于）莉莉的姐姐的”，语法上是正确的。选项A和C中的“Lily sister's”是错误的表达方式。","knowledge_expansion_md":"1.  **人称代词与指示代词**：\n    *   `these` 是指示代词，意为“这些”，通常用于近指。在回答问题时，虽然口语中有时会用 `No, these aren't`，但更规范、标准的用法是用人称代词 `they` 来代替前文提到的复数名词。\n\n2.  **名词所有格 ('s)**：\n    *   **基本用法**：在名词后加 `'s` 表示“……的”。例如：`Tom's car` (汤姆的车)。\n    *   **双重所有格/所属格链**：当所有者本身也是一个所有格短语时，会形成类似 `A's B's C` 的结构。例如本题的 `Lily's sister's pens` (莉莉的姐姐的笔)。这种结构虽然语法正确，但在初级阶段较为复杂。\n    *   **名词性所有格**：`'s` 也可以单独使用，后面省略被修饰的名词，功能类似于名词性物主代词（如 `mine`, `yours`）。例如：`Whose pen is this?` `It's Lily's.` (这是莉莉的笔)。\n\n3.  **易错点**：注意区分 `Lily sister` 和 `Lily's sister`。前者是错误的组合，后者 `Lily's sister` 才表示“莉莉的姐姐”，是一个正确的名词短语。","socratic_tracks":[{"title":"代词的正确使用","steps":[{"question":"问句 “Are these pens your sister's?” 中，主语是什么？是单数还是复数？","hint":"看看 pens 这个词。","takeaway":"主语是 “these pens”，是复数。"},{"question":"在回答时，我们需要用一个代词来代替 “these pens”。应该用哪个代词？","hint":"代替复数名词（无论是人还是物）的主格代词是什么？","takeaway":"应该用复数人称代词 “they”。"},{"question":"为什么不用 “these” 来回答？","hint":"“these” 是指示代词，通常用于指着东西说“这些”，而 “they” 是人称代词，用于在上下文中指代前面提到过的复数名词。","takeaway":"在回答中，用人称代词 “they” 来指代前文的名词是更规范的用法。"}]},{"title":"名词所有格 ('s)","steps":[{"question":"“Lily's” 这个词是什么意思？","hint":"词尾的 's 通常表示什么关系？","takeaway":"“Lily's” 表示“莉莉的”，是名词所有格形式。"},{"question":"那么，“莉莉的姐姐”用英语应该怎么说？是 “Lily sister” 还是 “Lily's sister”？","hint":"要表示“莉莉的”，就需要使用所有格。","takeaway":"“莉莉的姐姐”是 “Lily's sister”。"},{"question":"现在看第二个空 “They are _____ sister's.”。为了表达“它们是莉莉的姐姐的”，空格里应该填什么？","hint":"你需要先构成“莉莉的姐姐”这个词组。","takeaway":"空格里需要填 “Lily's”，与后面的 “sister” 构成 “Lily's sister” 这个整体，表示“莉莉的姐姐”。"}]},{"title":"句子结构分析","steps":[{"question":"我们来分析第二句话 “They are _____ sister's.”。这句话想表达“这些笔是谁的？”","hint":"根据对话，笔不是“你姐姐的”，而是另一个人的姐姐的。","takeaway":"这句话想表达这些笔是“某人的姐姐的”。"},{"question":"假设这个人是莉莉。那么“属于莉莉的姐姐”这个所有关系，用英语怎么表达？","hint":"我们先说“莉莉的姐姐” (Lily's sister)，然后怎么表示“……的”？","takeaway":"“属于莉莉的姐姐”可以表达为 “(Lily's sister)'s”。"},{"question":"对照题目 “They are _____ sister's.”，你会发现题目已经给出了 `sister's`。那么，为了构成 `(Lily's sister)'s` 这个完整意思，空格里应该填什么？","hint":"将 `(Lily's sister)'s` 与 `_____ sister's` 进行对比。","takeaway":"通过对比可以发现，空格部分正好是 “Lily's”。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Tina, _____\n—G-R-E-E-N.","options":{"A":"what's your first name?","B":"what's that in English?","C":"spell \"green\", please.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查情景对话。根据答语“G-R-E-E-N”，我们可以判断出对方正在逐个字母地拼写一个单词。这直接回应了选项 C “spell ‘green’, please.”（请拼写“green”这个单词）的请求。选项 A 问的是名字，答语应为人名。选项 B 问的是某物的英文说法，答语应为一个单词或词组，而不是拼写。因此，C 是唯一符合对话逻辑的选项。","knowledge_expansion_md":"### 核心知识点：祈使句与特殊疑问句的辨析\n\n1.  **请求拼写 (Asking for Spelling)**:\n    *   `Spell [word], please.` (祈使句，表示请求)\n    *   `How do you spell [word]?` (特殊疑问句)\n    *   `Can you spell [word] for me?` (情态动词疑问句，语气更委婉)\n\n2.  **询问姓名 (Asking for Name)**:\n    *   `What's your name?` (你叫什么名字？)\n    *   `What's your first name / last name?` (你的名/姓是什么？)\n\n3.  **询问翻译 (Asking for Translation)**:\n    *   `What's this/that in English?` (这个/那个用英语怎么说？)\n    *   `How do you say [中文] in English?` (……用英语怎么说？)\n\n**易错点**：学生容易混淆“询问单词”和“请求拼写”。前者用 `What's ...?`，后者用 `How do you spell ...?` 或 `Spell ...`。","socratic_tracks":[{"title":"理解应答内容","steps":[{"question":"看到回答 “G-R-E-E-N”，你觉得说话人是在做什么？是在说一个完整的词，还是在把一个词拆开念？","hint":"想想我们学习英文字母后，老师会让我们做什么练习？比如 a-p-p-l-e。","takeaway":"回答 “G-R-E-E-N” 是在逐个字母地拼读单词。"},{"question":"既然回答是在拼写单词，那么提问的人应该是想知道什么呢？","hint":"是想知道对方的名字，还是想知道某个词的拼法？","takeaway":"提问者是请求对方拼写某个单词。"},{"question":"对比三个选项，哪一个选项是“请求拼写”的意思？","hint":"找到含有动词“拼写”（spell）的选项。","takeaway":"选项 C “spell 'green', please.” 正是请求拼写单词的指令。"}]},{"title":"关键词汇分析","steps":[{"question":"选项 C 中的动词 “spell” 是什么意思？","hint":"当你不知道一个单词怎么写时，你会问老师：“老师，这个单词怎么...？”","takeaway":"动词 “spell” 的意思是“拼写”。"},{"question":"“spell 'green', please.” 是一个什么类型的句子？它为什么以动词原形开头？","hint":"以动词原形开头的句子，通常用来表达命令或请求。比如 “Sit down, please.”","takeaway":"这是一个祈使句，用来有礼貌地请求对方做某事。"}]},{"title":"排除干扰选项","steps":[{"question":"如果问题是 A ‘what's your first name?’，一个合理的回答应该是什么？","hint":"“first name” 指的是“名”，比如 Tom, Mary。","takeaway":"问名字的回答应该是一个具体的人名，而不是一串字母。"},{"question":"如果问题是 B ‘what's that in English?’，回答又应该是什么样的？","hint":"这个问题是用来询问某个东西的英文说法的，比如指着一个苹果问。","takeaway":"问翻译的回答应该是一个英文单词（如 It's an apple），而不是它的拼写。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—_____?\n—They are my sisters.","options":{"A":"How are they","B":"Who are they","C":"What are they","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查特殊疑问词的用法。答语“They are my sisters.”（她们是我的姐妹。）是在介绍人物的身份。针对“人”的身份进行提问，应使用疑问词“Who”（谁）。因此，问题“Who are they?”（她们是谁？）是正确的。选项 A “How are they?” 用于询问健康状况或近况。选项 C “What are they?” 通常用于询问职业。故 B 为最佳答案。","knowledge_expansion_md":"### 核心知识点：疑问词 Who, What, How 的辨析\n\n1.  **Who**: 专门用来对“人”进行提问，询问姓名、身份或关系。\n    *   `Who is he?` (他是谁？) -> `He is my brother.` (他是我哥哥。)\n\n2.  **What**: 用来对“物”或“事”提问，也可以询问人的“职业”。\n    *   `What is this?` (这是什么？) -> `It's a book.` (这是一本书。)\n    *   `What are you?` (你是做什么工作的？) -> `I'm a student.` (我是一名学生。)\n\n3.  **How**: 用来询问“方式”、“程度”或“健康状况”。\n    *   `How are you?` (你好吗？) -> `I'm fine.` (我很好。)\n    *   `How do you go to school?` (你怎么去上学？) -> `By bus.` (坐公交车。)\n\n**易错点**：初学者常混淆 `Who are they?` 和 `What are they?`。前者问“是谁”，期待的是姓名或关系（如 my friends）；后者问“是干什么的”，期待的是职业（如 doctors）。","socratic_tracks":[{"title":"从答案中找线索","steps":[{"question":"请看回答 “They are my sisters.”。这个回答告诉了我们关于“她们”的什么信息？","hint":"“sisters”（姐妹）是一种身份或关系吗？","takeaway":"这个回答揭示了人物的身份和家庭关系。"},{"question":"当我们想知道“某人是谁”时，应该用哪个英文疑问词来提问？","hint":"中文的“谁”对应哪个英文单词？","takeaway":"询问人物身份时，必须使用疑问词 “Who”。"}]},{"title":"疑问词功能辨析","steps":[{"question":"选项 A “How are they?” 是用来问什么的？一个典型的回答是什么？","hint":"想一想 “How are you?” 这个经典问候语。","takeaway":"“How are they?” 用来询问健康或近况，回答通常是 “They are fine/well.”。"},{"question":"选项 C “What are they?” 通常是问什么？它和 “Who are they?” 有什么关键区别？","hint":"如果有人问你 “What are you?”，你应该回答你的职业，比如 “I'm a student.”。","takeaway":"“What are they?” 通常询问职业，而 “Who are they?” 询问的是身份或姓名。"}]},{"title":"构建对话场景","steps":[{"question":"假设你指着远处的两个人问朋友，朋友回答：“她们是我的姐妹。” 在中文里，你的问题最可能是什么？","hint":"你想知道的是她们和朋友的关系。","takeaway":"在中文里，我们最可能问：“她们是**谁**？”"},{"question":"那么，把中文的“谁”翻译成英文，并组成一个完整的问句，应该是什么？","hint":"“谁”是 Who，“她们是”是 are they。","takeaway":"正确的英文问句是 “Who are they?”。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"—_____ is your jacket?\n—It's black.","options":{"A":"What","B":"What color","C":"What's color","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查对颜色提问的固定句型。答语“It's black.”（它是黑色的。）明确说明了夹克的颜色。因此，问题应该是询问颜色。在英语中，询问颜色的固定疑问词组是“What color”。所以，完整的问句是“What color is your jacket?”（你的夹克是什么颜色的？）。选项 A “What” 提问过于宽泛。选项 C “What's color” 是语法错误，因为 “What's” 是 “What is” 的缩写，导致句子中有两个be动词。","knowledge_expansion_md":"### 核心知识点：特殊疑问句型 “What color...?”\n\n1.  **标准句型**：`What color + be动词 + 主语?`\n    *   `What color is your bag?` (你的包是什么颜色的？)\n    *   `What color are his eyes?` (他的眼睛是什么颜色的？)\n\n2.  **“What” vs. “What color”**：\n    *   `What is it?` (它是什么？) -> 提问物品本身 -> `It's a jacket.` (它是一件夹克。)\n    *   `What color is it?` (它是什么颜色的？) -> 提问物品的颜色 -> `It's black.` (它是黑色的。)\n\n3.  **语法陷阱**：注意 `What's` 的用法。`What's` = `What is`。\n    *   **错误**: `What's color is your jacket?` (相当于 `What is color is your jacket?`，动词重复)\n    *   **正确**: `What color is your jacket?` (疑问词组 `What color` + be动词 `is` + 主语 `your jacket`)\n    *   **正确**: `What's the color of your jacket?` (这里的 `What's` = `What is`，主语是 `the color of your jacket` 整体)","socratic_tracks":[{"title":"从答案反推问题","steps":[{"question":"看到回答 “It's black.”，我们知道了关于夹克的什么信息？","hint":"“black”（黑色）是一个描述什么属性的词？","takeaway":"回答明确指出了夹克的颜色是黑色。"},{"question":"既然回答是关于颜色的，那么问题应该如何提问才能精确地得到这个答案？","hint":"我们想问“什么颜色”，英文应该怎么说？","takeaway":"询问颜色的标准问法是 “What color...?”。"}]},{"title":"语法结构分析","steps":[{"question":"在正确的问句 “What color is your jacket?” 中，“What color” 整体充当什么成分？","hint":"像 “Who”, “What”, “Where” 一样，它放在句首，用来引出问题。","takeaway":"“What color” 是一个不可分割的疑问词组，专门用来对颜色进行提问。"},{"question":"为什么选项 C “What's color” 是错误的？请试着把 “What's” 展开成 “What is”。","hint":"展开后，句子变成了 “What is color is your jacket?”。你发现了什么问题？","takeaway":"展开后句子中出现了两个be动词 “is”，这是严重的语法错误。"}]},{"title":"区分易混选项","steps":[{"question":"如果我们用选项 A 来提问：“What is your jacket?”，一个合适的回答会是什么？","hint":"这个问题问的是“你的夹克是**什么**”，而不是“是什么颜色的”。","takeaway":"回答可能是描述夹克的材质或类型，比如 “It's a leather jacket.”（它是一件皮夹克）。"},{"question":"所以，为了准确地问出颜色，我们必须在 “What” 后面加上哪个词来限定提问范围？","hint":"“颜色”的英文单词是什么？","takeaway":"必须使用 “What color” 这个固定组合来特指对颜色的提问。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"This is a picture _____ my family.","options":{"A":"of","B":"in","C":"at","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查介词的固定搭配。句意为“这是一张我们家的照片”。在英语中，要表达“一张……的相片”或“一幅……的画”，使用固定搭配“a picture of...”，其中介词“of”用来表示照片所描绘的内容或所属关系。因此，此处应填“of”。选项 B “in”表示“在……里面”，选项 C “at”表示“在……（某个地点）”，均不符合该语境下的搭配习惯和句意。","knowledge_expansion_md":"### 核心知识点：介词 of 表示所属和内容\n\n1.  **固定搭配**: `a picture of sb./sth.` 意为“某人/某物的照片”。这是最核心的考点。\n    *   `a picture of the Great Wall` (一张长城的照片)\n    *   `a photo of my dog` (我狗狗的一张照片)\n\n2.  **介词 of 的引申用法**：`of` 常用来表示“……的”，连接两个名词，表示所属、内容、构成等关系。\n    *   **内容/主题**: `a map of China` (一张中国地图), `the story of his life` (他一生的故事)。本题用法即为此类。\n    *   **所属**: `the leg of the table` (桌子的腿), `the cover of the book` (书的封面)。\n    *   **部分与整体**: `one of my friends` (我的朋友之一)。\n\n3.  **易混介词辨析**：\n    *   **in**: 表示在空间、时间或范围“内部”。`There are five people in my family.` (我家有五口人。)\n    *   **at**: 表示在具体的“地点”或“时间点”。`We are at school.` (我们在学校。)","socratic_tracks":[{"title":"掌握固定搭配","steps":[{"question":"我们想表达“一张猫的照片”，英语会怎么说？“a picture ___ a cat”。你认为中间应该用哪个词来连接“照片”和“猫”？","hint":"这个词需要表达出照片的内容是关于什么的。","takeaway":"表达“……的照片”时，我们使用固定搭配 “a picture of...”。"},{"question":"现在，把这个规律应用到题目中，“一张我家的照片”应该怎么说？","hint":"只需要把 “a cat” 替换成 “my family”。","takeaway":"同样地，我们说 “a picture of my family”。"}]},{"title":"介词功能辨析","steps":[{"question":"介词 “in” 通常表示什么意思？你能用 “in my family” 造一个正确的句子吗？","hint":"“in” 常常表示“在...里面”或“在...之中”。","takeaway":"“in” 表示包含关系，例如 “There are four people in my family.”（我家有四口人）。"},{"question":"介词 “at” 通常表示什么？用它来描述照片和家庭的关系合适吗？","hint":"“at” 常常表示一个具体的地点，比如 “at the bus stop”。","takeaway":"“at” 表示地点，用在这里语义不通，我们不能说“在我的家庭的照片”。"},{"question":"那么，在这个句子里，介词 “of” 起到了什么关键作用？","hint":"它连接了 “picture” 和 “my family”，说明了照片和家庭之间的关系。","takeaway":"介词 “of” 在此表示所属或内容关系，说明了照片是关于“我的家庭”的。"}]},{"title":"举一反三","steps":[{"question":"除了 “a picture of...”，你还能想到其他用 “of” 来表示“关于……”或“……的”内容的词组吗？比如“一张中国的地图”怎么说？","hint":"结构和 “a picture of...” 完全一样。","takeaway":"我们可以说 “a map of China”。"},{"question":"非常好！那么，“一个关于英雄的故事”又该怎么说呢？","hint":"故事是 “story”，英雄是 “hero”。","takeaway":"我们可以说 “a story of a hero”，这里的 “of” 同样是表示故事的内容。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"Here _____ my pencils and my pens. They are _____ my schoolbag.","options":{"A":"is; on","B":"are; in","C":"be; under","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查 `Here be` 倒装句型和介词的用法。\n1.  第一空：句子以 `Here` 开头，引导一个倒装句。真正的主语是后面的 `my pencils and my pens`，这是一个复数名词，所以谓语动词应使用 `are`。\n2.  第二空：根据句意“它们在我的书包里”，表示“在……（内部）”应使用介词 `in`。\n3.  `on` 意为“在……上面”，`under` 意为“在……下面”，均不符合此处语境。\n4.  综合判断，选择 B。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **Here/There be 倒装句**\n    *   当 `Here` (这里) 或 `There` (那里) 位于句首，且主语是名词时，句子通常采用倒装结构，即 `Here/There + 动词 + 主语`。\n    *   谓语动词的单复数形式由其后的主语决定，遵循“就近原则”。\n    *   例如：`Here is the bus.` (公交车来了。) / `There are some apples on the table.` (桌子上有一些苹果。)\n    *   **注意**：如果主语是代词（如 you, it, they），则不倒装。例如：`Here you are.` (给你。) / `There it is.` (它在那儿。)\n\n2.  **常用方位介词辨析**\n    *   `in`: 在……（立体空间）内部。例：`in the box` (在盒子里)。\n    *   `on`: 在……（表面）上。例：`on the desk` (在课桌上)。\n    *   `under`: 在……正下方。例：`under the tree` (在树下)。\n    *   `at`: 在……（某个点）。例：`at the door` (在门口)。","socratic_tracks":[{"title":"Here be 句型语法","steps":[{"question":"当一个句子以 'Here' 开头，并且主语是一个名词时，动词和主语的顺序是怎样的？","hint":"回想一下 'Here comes the bus.' 这句话，'bus' 是主语，'comes' 是动词。","takeaway":"以 'Here' 开头的句子，当主语是名词时，需要倒装，即动词在主语前面。"},{"question":"既然是倒装，那么动词用 'is' 还是 'are' 由谁来决定呢？","hint":"句子的真正主语是 'my pencils and my pens'，它决定了动词的形式。","takeaway":"动词的单复数形式由其后的真实主语决定，这叫主谓一致。"},{"question":"'my pencils and my pens' 是单数还是复数？因此第一个空应该填什么？","hint":"用 'and' 连接的两个或多个名词通常表示复数概念。","takeaway":"主语是复数，所以谓语动词要用 'are'。"}]},{"title":"方位介词辨析","steps":[{"question":"根据生活常识，铅笔和钢笔通常放在书包的哪个位置？","hint":"是放在书包的“里面”、“上面”还是“下面”？","takeaway":"文具通常是放在书包的内部。"},{"question":"英语中，哪一个介词可以准确地表达“在……里面”这个概念？","hint":"选项中有 'on', 'in', 'under'，它们的意思分别是什么？","takeaway":"介词 'in' 表示“在……（内部）”。"},{"question":"为什么 'on' 和 'under' 在这里不合适？","hint":"想象一下 'pencils on the schoolbag' (铅笔在书包表面上) 的画面，这符合常理吗？","takeaway":"'on' 表示在表面，'under' 表示在下面，都不符合“文具在书包里”的逻辑。"}]},{"title":"句子结构与指代","steps":[{"question":"在第二句话 'They are _____ my schoolbag.' 中，主语 'They' 指代的是什么？","hint":"代词通常指代上文中提到的人或物，看看前一句话说了什么。","takeaway":"'They' 指代的是前文提到的 'my pencils and my pens'。"},{"question":"理解了 'They' 的指代后，我们如何选择第二个空的介词？","hint":"这句话描述的是铅笔和钢笔与书包之间的位置关系。","takeaway":"我们需要一个能描述“铅笔和钢笔在书包里”的介词，即 'in'。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"—Is this your mother's?\n—Yes, _____ is.","options":{"A":"she","B":"it","C":"Some","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"1.  本题考查代词的正确使用。\n2.  问句是 `Is this your mother's?`，意为“这是你妈妈的（东西）吗？”。这里的 `this` 指代的是一个物品，而不是人。\n3.  在对一般疑问句进行简略回答时，回答的主语需要使用人称代词来指代问句的主语。\n4.  用来指代物品（或事物）的单数人称代词是 `it`。\n5.  因此，完整的回答是 `Yes, it is.`。\n6.  选项 A `she` 用来指代女性，而问句主语是物，故不正确。选项 C `Some` 意为“一些”，不符合语法和句意。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **名词所有格的省略用法**\n    *   题干中的 `your mother's` 是名词所有格，其后省略了名词。这种用法非常常见，前提是上下文清晰，听话人明白省略的是什么。\n    *   例如：`—Is this your coat? —No, it's Tom's.` (这里的 `Tom's` 等于 `Tom's coat`)\n    *   这种所有格形式本身（如 `Tom's`）在语法上被当作名词性物主代词使用。\n\n2.  **人称代词主格的指代**\n    *   在回答以 `this`, `that`, `these`, `those` 或名词提问的一般疑问句时，答语的主语通常要换成相应的人称代词。\n    *   `this/that` 或单数名词（指物） -> `it`\n    *   `these/those` 或复数名词（指物） -> `they`\n    *   单数名词（指人） -> `he/she`\n    *   复数名词（指人） -> `they`\n    *   例如：`—Is this your book? —Yes, it is.` / `—Are those your parents? —Yes, they are.`","socratic_tracks":[{"title":"代词指代对象","steps":[{"question":"问句 'Is this your mother's?' 的主语 'this' 指的是一个人，还是一个东西？","hint":"我们通常用 'this' 来指代近处的一个具体事物。","takeaway":"问句的主语 'this' 指代的是一个物品。"},{"question":"在英语中，当我们需要用一个代词来指代单个的物品时，应该用哪个词？","hint":"想想 'it', 'he', 'she' 的区别。","takeaway":"代词 'it' 用来指代单个的物品、动物或事件。"},{"question":"为什么这里不能用 'she'？问句里不是提到了 'mother' 吗？","hint":"问题是关于“这个东西”的归属，还是关于“妈妈”这个人？","takeaway":"问句的核心是物品 'this'，而非 'mother'，所以回答时必须指代 'this'。"}]},{"title":"名词所有格的省略","steps":[{"question":"在 'your mother's' 这个短语中，'s 后面是不是省略了什么词？","hint":"比如，完整的说法可能是 'your mother's book'。","takeaway":"'your mother's' 是名词所有格，后面省略了上文或语境中已知的名词。"},{"question":"这种省略如何帮助我们理解问句的真正含义？","hint":"既然是“妈妈的（东西）”，说明谈论的焦点是一个东西。","takeaway":"名词所有格的省略用法提示我们，问句的主语 'this' 是一个物品。"}]},{"title":"一般疑问句的回答","steps":[{"question":"对于 'Is this a pen?' 这样的问题，最标准的简略回答是什么？","hint":"回答通常以 'Yes' 或 'No' 开始。","takeaway":"标准回答是 'Yes, it is.' 或 'No, it isn't.'"},{"question":"为什么在回答中，'this' 变成了 'it'？","hint":"这是一种固定的语法规则，为了避免重复和表达更自然。","takeaway":"在回答一般疑问句时，主语 'this' 或 'that' 通常要用代词 'it' 来替换。"},{"question":"现在回到原题 'Is this your mother's?'，根据这个规则，你应该如何回答？","hint":"将 'your mother's' 看作一个整体，问句结构与 'Is this a pen?' 类似。","takeaway":"同样地，主语 'this' 应该用 'it' 替换，构成回答 'Yes, it is.'"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—Is your father's brother your _____?\n—Yes, he is.","options":{"A":"aunt","B":"uncle","C":"grandfather","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"1.  本题考查对家庭成员称谓的理解。\n2.  问句 `Is your father's brother your _____?` 意为“你父亲的兄弟是你的_____吗？”\n3.  根据英语家庭称谓，父亲的兄弟（即伯伯或叔叔）应称为 `uncle`。\n4.  选项 A `aunt` 指姑姑或姨母，是女性。选项 C `grandfather` 指祖父或外祖父，是不同辈分的亲属。两者均不符合题意。\n5.  因此，正确答案是 B。","knowledge_expansion_md":"### 知识点拓展\n\n1.  **英语家庭成员核心词汇 (Family Members):**\n    *   直系亲属：`parents` (父母) = `father` (父亲) + `mother` (母亲)；`grandparents` (祖父母) = `grandfather` (祖父/外祖父) + `grandmother` (祖母/外祖母)；`children` (子女) = `son` (儿子) + `daughter` (女儿)。\n    *   旁系亲属：`uncle` (叔、伯、舅), `aunt` (姑、姨), `cousin` (堂/表兄弟姐妹)。\n\n2.  **英文称谓的宽泛性:**\n    *   与中文精细的称谓体系不同，英文的称谓词更宽泛。例如，`uncle` 一个词就涵盖了中文的“叔叔、伯伯、舅舅、姑父、姨父”等多种关系。\n    *   同样，`aunt` 涵盖了“姑姑、姨、婶婶、舅妈”等。\n    *   `grandfather` 既指祖父，也指外祖父。","socratic_tracks":[{"title":"家庭关系词汇","steps":[{"question":"请问 'uncle', 'aunt', 'grandfather' 这三个词分别指代哪些家庭成员？","hint":"可以从性别和辈分两个角度来区分。","takeaway":"'uncle' 指叔伯舅舅，'aunt' 指姑姑阿姨，'grandfather' 指祖父或外祖父。"},{"question":"问句中的 'father's brother' 是指谁？","hint":"爸爸的哥哥或弟弟，我们中文叫叔叔或伯伯。","takeaway":"父亲的兄弟在英语中统称为 'uncle'。"},{"question":"如果问题是“你母亲的父亲是谁？”，你应该选择哪个词？","hint":"妈妈的爸爸，我们中文叫外公或外祖父。","takeaway":"母亲的父亲在英语中是 'grandfather'。"}]},{"title":"排除法应用","steps":[{"question":"看到回答是 'Yes, he is.'，这里的 'he' 告诉我们什么信息？","hint":"'he' 是男性还是女性？","takeaway":"'he' 是男性代词，说明横线上填的词必须指代一位男性。"},{"question":"根据这个线索，我们可以排除哪个选项？","hint":"A: aunt, B: uncle, C: grandfather。哪个是女性？","takeaway":"选项 A 'aunt' (姑姑/姨母) 是女性，与 'he' 矛盾，因此可以首先排除。"},{"question":"剩下的 B 和 C 都是男性。为什么 'grandfather' 不对？","hint":"比较一下 'grandfather' 和 'father's brother' 的关系。","takeaway":"'grandfather' 是祖父，而 'father's brother' 是叔叔/伯伯，两者不是同一个人。"}]}]}}]},{"section_title":"二、完形填空 A篇（对话，第16—25题）","section_instruction":"根据短文内容，从 A、B、C 三个选项中选出可以填入空白处的最佳答案。\n\n【A篇】（卷面「A」，空位 1—10）\n\nA: __16__ me, what's __17__?\nB: My name is Ann Read. And __18__?\nA: Wei Hua. __19__ you do?\nB: How do you do?\nA: __20__ in the bag? __21__ it a pencil?\nB: No, it's __22__ eraser.\nA: What __23__ that in English?\nB: It's a watch, an __24__ watch.\nA: How do you __25__ \"watch\"?\nB: W-A-T-C-H, watch.","items":[{"number":"16","item_type":"cloze","context_note":"","stem":"","options":{"A":"excuse","B":"Excuse","C":"Sorry","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查日常交际用语及句子书写规范。对话开头“A: ___ me, what's …?” 是典型的礼貌打扰用语，完整固定搭配为 **Excuse me**（打扰一下；劳驾）。选项 A `excuse` 虽为同一词根，但位于句首时必须大写首字母，单独小写不符合英语书写规范。选项 C `Sorry` 多用于承认过错、表示歉意（如踩到别人脚时说 Sorry），此处语境是“开口问路/搭话”，用 Excuse me 更贴切。综合语境与书写规则，正确答案是 B。","knowledge_expansion_md":"### 1. Excuse me 与 Sorry 的语用区别\n\n*   **`Excuse me`**：在需要**打断对方、引起注意、借过、问路、插话**等场合使用，强调“占用你一点时间/空间”，并不一定表示自己做错了事。\n    *   例：`Excuse me, where is the library?`（请问图书馆在哪里？）\n*   **`Sorry` / `I'm sorry`**：多用于**道歉、表达遗憾**，或听不清请对方重复时（英式英语中也可用 `Sorry?`）。\n    *   例：`I'm sorry I'm late.`（对不起我迟到了。）\n\n### 2. 句首字母大写规则\n\n英语中，**句子的第一个单词**以及**直接引语的开头**等位置，实词首字母通常大写。因此本空若填 `excuse`，应写作 **`Excuse`**。","socratic_tracks":[{"title":"语境判断：要表达什么意图？","steps":[{"question":"说话人接下来要问对方姓名，他在开口前最需要表达的是“道歉”还是“礼貌地打扰一下”？","hint":"想想中文里你会先说“不好意思打扰一下”还是先说“对不起”。","takeaway":"此处是礼貌开启对话，更符合 **Excuse me** 的用法，而不是单纯道歉。"},{"question":"如果把 `Sorry` 放在句首，后面直接接 `me` 构成 `Sorry me` 常见吗？","hint":"英语里表示道歉常用 `Sorry` 或 `I'm sorry`，很少说 `Sorry me`。","takeaway":"本句结构是 `___ me`，与 **`Excuse me`** 这一固定搭配完全吻合。"},{"question":"在 A 和 B 都是 `excuse` 的情况下，还应该根据什么规则二选一？","hint":"看这个词在句中所处的位置。","takeaway":"句首单词首字母应大写，故选 **`Excuse`**（选项 B）。"}]},{"title":"选项排除与书写规范","steps":[{"question":"选项 A 的拼写有没有问题？意思对不对？","hint":"小写 `excuse` 放在句首是否符合规范？","takeaway":"意思对但**书写不规范**，小升初完形常同时考查语用与大小写。"},{"question":"什么时候你会优先选 `Sorry` 而不是 `Excuse me`？","hint":"联想自己做错事、需要道歉的场景。","takeaway":"`Sorry` 偏道歉；本题是发起询问，故不选 C。"}]}]}},{"number":"17","item_type":"cloze","context_note":"","stem":"","options":{"A":"that","B":"this","C":"your name","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查特殊疑问句 **What's …?** 的完整结构。根据答语 “My name is Ann Read.” 可知，问句是在询问对方姓名，标准表达为 **What's your name?**（你叫什么名字？）。空白处紧跟在 `what's` 之后，应填入表语部分 **`your name`**。选项 A `that`、B `this` 若代入会得到 `what's that/this`，多用来询问“那/这是什么”，与答语“我的名字是……”无法对应。因此正确答案是 C。","knowledge_expansion_md":"### 1. 询问姓名的常用句型\n\n*   **`What's your name?`** —— 最基础、最常用。\n*   **`May I have your name?`** —— 更正式、更客气。\n*   回答可用：`My name is ...` / `I'm ...` / `Call me ...`。\n\n### 2. What's this / that? 与 What's your name? 的区别\n\n*   **`What's this/that?`**：问**事物**的名称或类别。\n*   **`What's your name?`**：问**对方**的姓名，**your** 不可省略，后面接 **name**。\n\n### 3. 完形填空中的“问答呼应”\n\n答语若出现 **My name is ...**，问句十有八九在考 **name** 相关结构，应优先在选项中寻找 **`your name`**、**`his name`** 等与“姓名”直接搭配的名词短语。","socratic_tracks":[{"title":"从答语反推问句","steps":[{"question":"B 的回答是 “My name is Ann Read.”，这说明问句最想了解什么信息？","hint":"回答里重复率最高的核心词是什么？","takeaway":"问句是在询问**姓名（name）**相关信息。"},{"question":"英语里问“你叫什么名字”，`what's` 后面通常跟什么？","hint":"需要一个表示“你的名字”的名词短语。","takeaway":"常用搭配是 **`your name`**，构成 `What's your name?`。"},{"question":"若选 `that` 或 `this`，答语还会是介绍自己的名字吗？","hint":"试试翻译：`What's that?` 一般会怎么回答？","takeaway":"`that/this` 与“自我介绍姓名”的答语不匹配，故排除 A、B。"}]},{"title":"代词与名词的搭配","steps":[{"question":"`your` 是形容词性物主代词还是名词性物主代词？后面能否什么都不跟？","hint":"回忆：`your` 后面通常要接什么词性？","takeaway":"`your` 后必须接**名词**，本句中即 **`your name`**。"}]}]}},{"number":"18","item_type":"cloze","context_note":"","stem":"","options":{"A":"yours","B":"your","C":"name","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查物主代词的辨析与对话省略。上文 B 已说 “My name is Ann Read.”，A 反问 “And ___?” 实际相当于 “And **what's your name?**” 的省略形式。英语中为避免重复，常用名词性物主代词 **`yours`** 代替 **`your name`**，即 **And yours?** = “你呢？/你的名字呢？”。选项 B `your` 为形容词性物主代词，后面缺少名词，不能单独作省略问句的表语核心。选项 C `name` 单独使用既不能表达“你的”含义，也不构成自然省略。因此正确答案是 A。","knowledge_expansion_md":"### 1. 形容词性物主代词 vs. 名词性物主代词（复习）\n\n| 类型 | 形式示例 | 用法要点 |\n| :--- | :--- | :--- |\n| 形容词性 | `my`, `your`, `his`, `her` … | **后接名词**：`your name` |\n| 名词性 | `mine`, `yours`, `his`, `hers` … | **单独使用**，相当于“形容词性 + 名词” |\n\n**转换关系**：`your name` ⇔ `yours`（在指代明确时）。\n\n### 2. 口语中的省略问句\n\n在双方对话信息对称时，常省略重复部分：\n\n*   — `My favorite color is blue.` — `And yours?`（= And what's **your favorite color**?）\n*   — `I'm from Chengdu.` — `And you?` / `And your friend?`\n\n### 3. 易错点\n\n*   错误：`*And your?*`（`your` 不能裸用）\n*   正确：**`And yours?`**","socratic_tracks":[{"title":"对话逻辑：在省略什么？","steps":[{"question":"B 已经介绍了自己的名字，A 说 “And ___?” 是在问什么？","hint":"中文里常说“你呢？”。","takeaway":"是在反问对方**名字**，与上一句 `My name is ...` 对称。"},{"question":"如果完整说出来，不问省略，这句话可能是哪一句？","hint":"用上一题考过的句型。","takeaway":"相当于 **`And what's your name?`**。"},{"question":"哪一个词可以代替 `your name` 并且能单独用在句末？","hint":"名词性物主代词。","takeaway":"**`yours`** = `your name`，故选 A。"}]},{"title":"排除 your 与 name","steps":[{"question":"能否说 `And your?` 结束句子？","hint":"`your` 后面缺什么？","takeaway":"`your` 必须带名词，不能单独收尾，排除 B。"},{"question":"`And name?` 能表达“你的名字呢”吗？","hint":"缺少物主限定，指代不清。","takeaway":"语义不完整、不自然，排除 C。"}]}]}},{"number":"19","item_type":"cloze","context_note":"","stem":"","options":{"A":"How","B":"How do","C":"How are","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查初次见面时的固定问候语 **How do you do?** 及其问答配套。下一句 B 回答 “How do you do?”，说明上一句 A 说的也应是同一句式的问候（英式英语中较为正式），完整形式为 **How do you do?**，题干已给出 `you do?`，前面缺 **`How do`**。选项 A 只有 `How`，缺少助动词 `do`，无法构成规范疑问句骨架。选项 C `How are` 若接 `you` 构成 `How are you?`（你好吗），答语一般是 `I'm fine, thank you.` 等，与下文的 `How do you do?` 不配套。因此正确答案是 B。","knowledge_expansion_md":"### 1. How do you do? 与 How are you?\n\n*   **`How do you do?`**：传统上用于**初次被介绍认识**时的正式问候，**答语仍可重复** `How do you do?`（现代口语中也常见 Nice to meet you.）。\n*   **`How are you?`**：用于**熟人之间**询问近况，答语多为 `Fine, thanks.` / `I'm OK.` 等。\n\n### 2. 句子结构\n\n`How do you do?` 中 **`do`** 为**助动词**，无实义，与主语 `you` 搭配；不可写成 `*How are you do?*`，因为 **be 动词与助动词 do 不能这样混用**。\n\n### 3. 完形中的“固定问答链”\n\n看到答语是 **`How do you do?`**，应高度敏感：上文往往在考 **`How do you do?`** 的**前半部分**或整句复述。","socratic_tracks":[{"title":"固定问候语的配套","steps":[{"question":"下一句 B 说 “How do you do?”，这提示上一句 A 在做什么？","hint":"想想中文里初次见面双方说什么。","takeaway":"双方在完成**同一套正式问候**，问句也应围绕 **How do you do?** 展开。"},{"question":"题干已给出 `you do?`，前面还缺哪两个词？","hint":"把整句连起来读一遍。","takeaway":"缺 **`How do`**，构成 **`How do you do?`**。"},{"question":"为什么不能用 `How are`？","hint":"后面接的是 `you do` 还是 `you`？","takeaway":"题干结构不是 `How are you?`，且 `are` 与后面的 `do` 语法冲突，排除 C。"}]},{"title":"助动词 do 的作用","steps":[{"question":"`How do you do?` 里的第二个 `do` 是实义动词“做”吗？","hint":"整句是在问“你做什么工作”吗？","takeaway":"这是**固定寒暄句**，第二个 `do` 在此结构中习惯上这样用；本题考查的是 **`How do`** 这一部分能否补全。"}]}]}},{"number":"20","item_type":"cloze","context_note":"","stem":"","options":{"A":"What","B":"Is","C":"What's","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查 **what** 引导的特殊疑问句及缩略形式。根据下一句 “___ it a pencil?” 可知，前一句在问“包里有什么”，常用句型为 **What's in the bag?** = **What is in the bag?**。空白处需要**疑问词 + be 动词**（缩写 **What's**），才能构成完整谓语。选项 A `What` 单独使用缺少动词，句子不完整。选项 B `Is` 若置于句首更像一般疑问句 “Is …?”，与 “in the bag” 搭配无法表达“里面有什么”的含义。因此正确答案是 C。","knowledge_expansion_md":"### 1. 询问“某地/容器里有什么”\n\n*   **`What's + 介词短语?`**\n    *   `What's in the box?` 盒子里有什么？\n    *   `What's on the desk?` 桌子上有什么？\n\n### 2. 缩略形式\n\n*   `what is` → **`what's`**\n*   写作时注意：**What's** = What is，后面可接 **in/on/under...** 引导的地点。\n\n### 3. 与一般疑问句区分\n\n*   **特殊疑问句**：句首是 **What/Who/Where...**，不能用 Yes/No 回答。\n*   **一般疑问句**：句首是 **Be/Do/Does...**，常用 Yes/No 回答。\n\n本题若用 `Is` 开头，则丢失“什么”这一疑问信息。","socratic_tracks":[{"title":"语义：问“有什么”还是问“是不是”？","steps":[{"question":"后一句问 “它是一支铅笔吗？”，说明前一句更可能在问什么？","hint":"先问包里内容，再追问具体是不是铅笔。","takeaway":"前一句应先问**包里有什么**，用 **What** 引导。"},{"question":"英语里 “……里有什么” 的 be 动词一般怎么和 what 连用？","hint":"单数概念用 is。","takeaway":"**What is in ...?** 或口语缩写 **`What's in ...?`**。"},{"question":"只填 `What` 够不够？","hint":"一个完整分句至少需要主谓结构。","takeaway":"缺 **is**，应选 **`What's`**（选项 C）。"}]},{"title":"排除 Is 开头","steps":[{"question":"若句首用 `Is`，整句最像哪种疑问句？","hint":"Is it a pencil? 是哪一类？","takeaway":"那是一般疑问句，无法表达“什么物品”在包里，故排除 B。"}]}]}},{"number":"21","item_type":"cloze","context_note":"","stem":"","options":{"A":"Is","B":"Are","C":"Do","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查含 be 动词的一般疑问句。答语语境为讨论包里的物品，问句 “___ it a pencil?” 意为“它是一支铅笔吗？”，主语为 **`it`**，表语为 **`a pencil`**，中间需用 be 动词的第三人称单数形式 **`Is`**，即 **Is it a pencil?**。选项 B `Are` 用于第二人称 **you** 或复数主语，与 **it** 不搭配。选项 C `Do` 构成行为动词一般疑问句（如 `Do you like it?`），而本句无实义动词原形，结构要求用 **be 动词提前**。因此正确答案是 A。","knowledge_expansion_md":"### 1. Be 动词一般疑问句语序\n\n**Be + 主语 + 其他？**\n\n*   `Is it a ruler?` 它是一把尺子吗？\n*   `Are they students?` 他们是学生吗？\n\n### 2. is / are 与主语搭配\n\n| 主语 | be 动词（一般现在时） |\n| :--- | :--- |\n| I | am |\n| he / she / it / 单数名词 | **is** |\n| you / we / they / 复数名词 | are |\n\n### 3. Do/Does 与 Be 动词不要混用\n\n*   句中**只有 be 动词**作谓语时，提前 **be**。\n*   句中有**实义动词**且无时态变化时，才用 **Do/Does** 提问。","socratic_tracks":[{"title":"主谓一致：it 搭配谁？","steps":[{"question":"本句主语是 `it`，指的是单数还是复数？","hint":"它指代上文提到的某个物品。","takeaway":"`it` 为**第三人称单数**。"},{"question":"第三人称单数现在时，be 动词用哪一个？","hint":"He ___, she ___, it ___.","takeaway":"用 **`is`**，一般疑问句将 **Is** 提前。"},{"question":"什么时候用 `Are it`？","hint":"这样写规范吗？","takeaway":"**不规范**，`it` 不能与 `are` 搭配，排除 B。"}]},{"title":"为何不用 Do？","steps":[{"question":"句子里有没有像 `like`、`have` 这样的实义动词原形？","hint":"谓语核心是 be 还是行为动词？","takeaway":"本句是 **主 + be + 表语** 结构，应使用 **Is**，不用 **Do**。"}]}]}},{"number":"22","item_type":"cloze","context_note":"","stem":"","options":{"A":"/","B":"a","C":"an","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查不定冠词 **a / an** 的选用。空格后为可数名词单数 **`eraser`**（橡皮），需用不定冠词表示泛指“一块”。**`eraser`** 发音以元音音素 /ɪ/ 开头，故前面用 **`an`**，即 **an eraser*
