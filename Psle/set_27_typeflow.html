*。选项 A `/` 表示零冠词，英语中可数名词单数不能随意裸用（除非固定习语或专有用法），此处不适用。选项 B `a` 用于以**辅音音素**开头的词前（如 `a pen`, `a university` 中 u 读 /juː/），与 `eraser` 的读音规则不符。因此正确答案是 C。","knowledge_expansion_md":"### 1. a 还是 an：看读音不看拼写\n\n*   以**元音音素**开头 → **an**：`an apple`, `an hour`（h 不发音）, **`an eraser`**\n*   以**辅音音素**开头 → **a**：`a book`, `a European`（E 读 /jʊ/）\n\n### 2. 不定冠词的基本意义\n\n表示“**某一个/一块**”，泛指同类中的任意一个，与 **it's**（它是）说明身份、类别相呼应。\n\n### 3. 易混词\n\n*   `a useful book`（/juː/ 辅音起音）\n*   `an honest boy`（h 不发音，元音起音）","socratic_tracks":[{"title":"听音辨冠词","steps":[{"question":"`eraser` 第一个音是元音还是辅音？","hint":"试着读出来：/ɪˈreɪsə(r)/。","takeaway":"以**元音音素**开头，前面用 **an**。"},{"question":"能不能说 `it's eraser`？","hint":"可数名词单数在陈述“它是一个……”时，通常需要什么？","takeaway":"需要 **a/an**，不能随意省略，排除“零冠词”选项。"},{"question":"若用 `a eraser` 问题出在哪里？","hint":"与 `an apple` 对比。","takeaway":"元音起音的词前应用 **an**，排除 B。"}]},{"title":"语境：it's + 冠词 + 名词","steps":[{"question":"答句 `No, it's ___ eraser.` 是在给物品下什么判断？","hint":"否定“是铅笔”，肯定“是橡皮”。","takeaway":"需要**通顺且语法正确**的不定冠词 + 可数名词单数结构。"}]}]}},{"number":"23","item_type":"cloze","context_note":"","stem":"","options":{"A":"am","B":"is","C":"be","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查 be 动词与主语的搭配。句型 **What ___ that in English?** 为初一核心句型“那个用英语怎么说？”。主语 **`that`**（那个）为**单数指示代词**，谓语 be 动词在一般现在时中用 **`is`**，完整句子为 **What is that in English?**。选项 A `am` 仅与 **`I`** 搭配。选项 C `be` 为原形，不能直接这样填入（除非情态动词后等特殊情况）。因此正确答案是 B。","knowledge_expansion_md":"### 1. What is this/that in English?\n\n*   **`this`**（这个）→ **is**（近指单数）\n*   **`that`**（那个）→ **is**（远指单数）\n*   **`these/those`** → **are**（复数）\n\n### 2. in English 的含义\n\n表示“**用英语（表达）**”，类似：`in Chinese` 用汉语。\n\n### 3. 答语配套\n\n常用：**It's a/an ...** / **It's ...**（如 `It's a watch.`）","socratic_tracks":[{"title":"主语 that 决定 be 动词","steps":[{"question":"句中真正的主语是谁？","hint":"在 `What is that ...` 结构中，that 是什么成分？","takeaway":"主语是 **`that`**（单数）。"},{"question":"与 that 搭配的 be 动词是？","hint":"That __ a book.","takeaway":"用 **`is`**。"},{"question":"什么时候用 `am`？","hint":"只和一个代词连用。","takeaway":"**只与 I 搭配**，排除 A。"}]},{"title":"句型整体记忆","steps":[{"question":"本句型在课本里常翻译成什么？","hint":"指着远处东西问老师。","takeaway":"“那个用英语怎么说？”—— 固定用 **`What is that in English?`**。"}]}]}},{"number":"24","item_type":"cloze","context_note":"","stem":"","options":{"A":"orange","B":"red","C":"black","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查不定冠词 **an** 与其后单词读音的配合。空前已出现 **`an`**，其后单词必须以**元音音素**开头，才能读得自然、符合规范。选项 **orange** 作形容词表示“橙色的”时读作 /ˈɒrɪndʒ/ 或 /ˈɔːrɪndʒ/，以元音音素开头，**an orange watch**（一块橙色的手表）语义通顺。选项 B `red`、C `black` 均以辅音音素 /r/、/b/ 开头，前面通常用 **`a`**（如 `a red watch`），若强行与 **`an`** 连用则属错误搭配。因此正确答案是 A。","knowledge_expansion_md":"### 1. an + 元音音素开头的词\n\n*   `an orange` 一个橙子；`an orange bag` 一个橙色的包\n*   颜色词也可作形容词：**`an orange watch`**\n\n### 2. 与 a red watch 对比\n\n*   **`a red watch`** ✓\n*   **`an red watch`** ✗\n\n题干已固定 **an**，只能从选项中选**元音起音**的词。\n\n### 3. 颜色词汇拓展\n\n`orange` 既是颜色也是水果；作颜色时仍可接 **an**（因读音以元音开头）。","socratic_tracks":[{"title":"an 的“语音条件”","steps":[{"question":"题干已经写了 `an`，后面这个词在读音上必须满足什么？","hint":"与上一题 eraser 的规则相同。","takeaway":"须以**元音音素**开头。"},{"question":"`red` 和 `black` 的第一个音是什么？","hint":"/r/ 和 /b/ 是元音还是辅音？","takeaway":"均为**辅音音素**，若与 an 连用不成立，排除 B、C。"},{"question":"`orange` 作“橙色的”讲时，第一个音是什么？","hint":"读一遍 orange。","takeaway":"元音起音，**an orange watch** 正确，选 A。"}]},{"title":"语义是否通顺","steps":[{"question":"手表可以有颜色吗？","hint":"生活中见过什么颜色的表盘/表带？","takeaway":"“橙色的手表”语义合理，与上文介绍物品类别一致。"}]}]}},{"number":"25","item_type":"cloze","context_note":"","stem":"","options":{"A":"say","B":"meet","C":"spell","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查动词辨析及上下文呼应。答语 “W-A-T-C-H, watch.” 是在**按字母拼写**单词，因此问句应为 **How do you spell “watch”?**（你怎么拼写“watch”？）。选项 C **`spell`** 表示“拼写”，与答语完全对应。选项 A `say` 强调“说出、念”，答语一般不会逐个字母展开。选项 B `meet` 意为“遇见”，与拼写无关。因此正确答案是 C。","knowledge_expansion_md":"### 1. spell / say / read 辨析\n\n*   **`spell`**：逐个字母读出拼写，如 `C-A-T`。\n*   **`say`**：说出单词或句子，侧重发音或内容。\n*   **`read`**：朗读、阅读。\n\n### 2. 常用句型\n\n*   **`How do you spell ...?`**\n*   **`Can you spell it, please?`**\n\n### 3. 完形中的“答语锁定法”\n\n看到 **字母加连字符** 的回答，应立刻联想到 **spell**。","socratic_tracks":[{"title":"从答语判断动作","steps":[{"question":"B 的回答 `W-A-T-C-H` 是在干什么？","hint":"每个字母念出来。","takeaway":"这是在**拼写**单词。"},{"question":"哪一个动词专门表示“拼写字母”？","hint":"课本标题常见 `Spell it`。","takeaway":"用 **`spell`**。"},{"question":"若问 `How do you say ...?`，答语通常是什么样？","hint":"还会不会逐个字母？","takeaway":"`say` 侧重说法/读音，与字母拆分答语不匹配，排除 A。"}]},{"title":"排除 meet","steps":[{"question":"`meet` 的含义是什么？能否接拼写语境？","hint":"Nice to meet you.","takeaway":"`meet` 表“遇见”，与拼写无关，排除 B。"}]}]}}]},{"section_title":"二、完形填空 B篇（短文，第26—35题）","section_instruction":"根据短文内容，从 A、B、C 三个选项中选出可以填入空白处的最佳答案。\n\n【B篇】（卷面「B」，空位 11—20）\n\nHello! Everyone. My name is Bill Green. I'm an __26__ boy, and I'm 12 years old. I am from Kentucky. Now I am __27__ No. 7 SHIYAN Middle School. Bill is my first name and Green is my __28__ name. This is my __29__ ID card. The number is 20180101. This is my brother. __30__ name is Tim. Now he and I __31__ in Chengdu with my parents.\n\nI have a nice __32__! All my school things are in it. Look! These are two __33__ in it. One is __34__ and the other one is Tim's. You can see his name on the dictionary. I lost my eraser. If you find it, please call me __35__ 351-9668.","items":[{"number":"26","item_type":"cloze","context_note":"","stem":"","options":{"A":"Chinese","B":"American","C":"school","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查上下文逻辑与词汇辨析。后文明确交代 **I am from Kentucky**（我来自肯塔基州）。**Kentucky** 是美国的一个州，因此说话人应是**美国人**，用 **American**（美国的；美国人）作定语修饰 **boy** 合理，即 **an American boy**。选项 A **Chinese** 表示“中国的；中国人”，与“来自肯塔基”地理事实矛盾。选项 C **school** 代入得 **an school boy**，冠词与搭配均不成立（且语义不通）。因此正确答案是 B。","knowledge_expansion_md":"### 1. 国家、地名与国籍表达\n\n*   **Kentucky** /kənˈtʌki/：美国州名，肯塔基州。\n*   表示“某国人”可用：**American**, **Chinese**, **English** 等，注意与 **a/an** 搭配：\n    *   `an American boy` ✓\n    *   `a Chinese girl` ✓\n\n### 2. 完形中的“地理信息锁定”\n\n出现**具体州名、国家名**时，国籍类形容词必须与**地理事实一致**，不可凭中文名等次要信息误选。\n\n### 3. American 的词性\n\n既可作**形容词**（美国的），也可作**名词**（美国人）；此处修饰名词 **boy**，作形容词用。","socratic_tracks":[{"title":"用地理事实排除选项","steps":[{"question":"文中说来自 Kentucky，它属于哪个国家？","hint":"可查阅地图或常识：美国中部/东部的州。","takeaway":"Kentucky 在**美国**，叙述者应是**美国人**相关表述。"},{"question":"若填 Chinese，句子在说什么？与 Kentucky 矛盾吗？","hint":"Chinese 表示哪国人？","takeaway":"表示中国人，与来自美国肯塔基矛盾，排除 A。"},{"question":"`an school boy` 有什么问题？","hint":"冠词与可数名词搭配。","takeaway":"语义、语法均不通，排除 C。"}]},{"title":"词汇：American 的用法","steps":[{"question":"`I'm an American boy.` 中 American 是什么词性？","hint":"修饰 boy。","takeaway":"作**形容词**，说明国籍属性，选 B。"}]}]}},{"number":"27","item_type":"cloze","context_note":"","stem":"","options":{"A":"to","B":"with","C":"in","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查介词与地点名词的搭配。表示“在某一所学校就读/上学”，英语中常用 **`in` + 学校名称**，如 **in No. 7 Middle School**、**in SHIYAN Middle School**。本句 **Now I am ___ No. 7 SHIYAN Middle School** 意为“现在我在第七实验中学（就读）”，填 **`in`** 最自然。选项 A **`to`** 多表方向“去……”，如 `go to school`，与 **am** 表状态不搭配。选项 B **`with`** 表“和……一起；用……”，不能表达“在学校这一空间/机构里”。因此正确答案是 C。","knowledge_expansion_md":"### 1. in / at / to 与 school 搭配\n\n*   **`in`** + 学校名：强调**在该校就读或身处校园**（课标完形高频）。\n    *   `She is in Beijing No. 4 Middle School.`\n*   **`go to school`**：去上学（动词短语）。\n*   **`at school`**：在上学、在校（笼统说法，不一定出现具体校名）。\n\n### 2. 易混点\n\n*   中文常说“在某某中学”，直译时优先考虑 **`in`** + 校名，而不是 `to`。\n\n### 3. 句子结构\n\n**be in + 地点**：表示（暂时）处于某机构/城市等。","socratic_tracks":[{"title":"介词与 be 动词连用","steps":[{"question":"句中谓语是 `am`，后面接校名，想表达什么意思？","hint":"中文：我在某中学。","takeaway":"表达**就读/位于该校**，不是“走向学校”。"},{"question":"`am to` 后面接校名，更像哪种结构？","hint":"be to do 表将来计划；此处无动词原形。","takeaway":"`to` 单独接校名不构成“就读”义，排除 A。"},{"question":"`with` 能否说“和七中在一起”？","hint":"with 后通常跟人或工具。","takeaway":"不能表达“在某校”，排除 B。"}]},{"title":"固定语感积累","steps":[{"question":"背诵一个与本文最像的例句。","hint":"I am in ... Middle School.","takeaway":"**be in + 学校名** 是常见表达，选 **in**。"}]}]}},{"number":"28","item_type":"cloze","context_note":"","stem":"","options":{"A":"family","B":"full","C":"first","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查英语姓名的表达。前文 **Bill is my first name** 说明 **Bill** 是“名”（given name）。西方姓名中 **Green** 出现在全名 **Bill Green** 的后面，通常为**姓氏**，即 **family name**（= **last name**）。因此 **Green is my family name** 语义连贯。选项 B **full name** 指“全名”，若说 “Green is my full name” 则逻辑错误（全名应包含名和姓）。选项 C **first** 与上文 “Bill is my first name” 直接矛盾。因此正确答案是 A。","knowledge_expansion_md":"### 1. 英语姓名三概念\n\n| 中文 | 英文常见说法 | 例（Bill Green） |\n| :--- | :--- | :--- |\n| 名 | first name / given name | Bill |\n| 姓 | family name / last name / surname | Green |\n| 全名 | full name | Bill Green |\n\n### 2. 汉语与英语顺序差异\n\n中文“姓名”先说姓再说名；英文名片/自我介绍常 **名在前、姓在后**。\n\n### 3. 易错句\n\n*   错误：`*Green is my first name.*`（若 Green 是姓）\n*   正确：**`Green is my family name.`**","socratic_tracks":[{"title":"利用上一句排除矛盾项","steps":[{"question":"上一句已经说明 Bill 是什么 name？","hint":"first name。","takeaway":"Green 不应再是 **first name**，排除 C。"},{"question":"full name 指的是什么？","hint":"名 + 姓合在一起。","takeaway":"Green 只是姓的一部分，不是全名，排除 B。"},{"question":"Green 在英文姓名里通常扮演什么角色？","hint":"Bill Green 谁在前谁在后？","takeaway":"Green 是**姓**，即 **family name**，选 A。"}]},{"title":"词汇同义替换","steps":[{"question":"family name 还可以叫什么？","hint":"last name / surname。","takeaway":"掌握多种说法有助于读懂阅读材料中的表格与自我介绍。"}]}]}},{"number":"29","item_type":"cloze","context_note":"","stem":"","options":{"A":"school","B":"phone","C":"family","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查名词作定语及生活常识。后文 **The number is 20180101** 提示这是一张带编号的证件；结合学生语境，**school ID card**（学生证/校园卡）最符合“有号码、证明身份”的功能。选项 B **phone** 构成 *phone ID card* 并非英语中的自然搭配，电话号码也不叫 phone ID card。选项 C **family** 得 *family ID card*，文中未涉及家庭证件，且与学号逻辑不符。因此正确答案是 A。","knowledge_expansion_md":"### 1. school ID card\n\n*   **ID** = **identity**（身份）\n*   **school ID card**：学生证，常含 **photo, name, student number** 等。\n\n### 2. 名词作定语\n\n英语中名词可修饰名词：**school** 修饰 **ID card**，说明卡片类别。\n\n### 3. 信息题与常识\n\n完形中若出现 **学号、班级、年级** 等，多与 **school** 相关词汇共现。","socratic_tracks":[{"title":"从编号推断证件类型","steps":[{"question":"后一句的 number 可能是什么号码？","hint":"学号、卡号常见于校园场景。","takeaway":"与**学生身份**绑定的证件最合理。"},{"question":"哪一种 ID card 与学校生活最直接相关？","hint":"school / phone / family 三个词哪个常进校规、校卡？","takeaway":"**school ID card**（学生证）。"},{"question":"你会说 `phone ID card` 吗？","hint":"电话一般说 phone number。","takeaway":"搭配不自然，排除 B。"}]},{"title":"排除 family","steps":[{"question":"family ID card 在文中有没有铺垫？","hint":"找 family 相关描述。","takeaway":"无依据且不符合学号语境，排除 C。"}]}]}},{"number":"30","item_type":"cloze","context_note":"","stem":"","options":{"A":"Her","B":"He's","C":"His","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查物主代词与性别一致。上文 **This is my brother** 引出弟弟；下文人名为 **Tim**（通常为男性名），故“___ name is Tim”应表示“**他的**名字叫蒂姆”，用形容词性物主代词 **`His`**。选项 A **Her** 用于女性，与 brother/Tim 矛盾。选项 B **He's** 是 **He is** 的缩写，代入后变成 *He is name is Tim*，语法错误（两个谓语冲突）。因此正确答案是 C。","knowledge_expansion_md":"### 1. his / her 与人称一致\n\n*   **brother** → 男性 → **his**\n*   **sister** → 女性 → **her**\n\n### 2. He's vs. His\n\n*   **`He's`** = He is / He has → 后接表语、分词、过去分词等。\n*   **`His`** → 物主代词 → 后接 **name, book, pen** 等名词。\n\n### 3. 句子结构\n\n**His name is Tim.** 为主系表结构，只能用一个谓语 **is**。","socratic_tracks":[{"title":"性别与代词一致","steps":[{"question":"被介绍的是 brother，还是 sister？","hint":"This is my brother.","takeaway":"男性，物主代词用 **his** 相关形式。"},{"question":"Tim 在文中更可能指男生还是女生？","hint":"常见男名。","takeaway":"用 **His**，不用 **Her**，排除 A。"},{"question":"把 He's 代入句子读一遍，通顺吗？","hint":"He's = He is。","takeaway":"会出现 **He is name** 的错误结构，排除 B。"}]},{"title":"正确句子模型","steps":[{"question":"介绍他人姓名最常用的句型是什么？","hint":"My name is ... / His name is ...","takeaway":"**His name is Tim.** 故选 **His**（C）。"}]}]}},{"number":"31","item_type":"cloze","context_note":"","stem":"","options":{"A":"am","B":"is","C":"are","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查并列主语的主谓一致。主语 **he and I** 为**两个人**，表示复数概念，谓语动词 be 在一般现在时中应使用 **`are`**，即 **Now he and I are in Chengdu**。选项 A **am** 仅与 **I** 单独作主语时使用（如 **I am ...**），不能与 **he and I** 并列结构搭配。选项 B **is** 用于单数主语，与复数主语不一致。因此正确答案是 C。","knowledge_expansion_md":"### 1. 并列主语与 be 动词\n\n*   **A and B**（两个人/物）→ 通常视为**复数** → **are**\n    *   `Tom and I are friends.`\n    *   `He and I are in Chengdu.`\n\n### 2. 特殊情况提示\n\n*   **both ... and ...** 连接主语，谓语多用复数。\n*   **就近原则**多见于 **either ... or ...**、**not only ... but also ...** 等，与本题结构不同。\n\n### 3. 易错点\n\n*   错误：`*He and I is ...*`\n*   正确：**`He and I are ...`**","socratic_tracks":[{"title":"数一致：几个人？","steps":[{"question":"`he and I` 一共指几个人？","hint":"他和我。","takeaway":"**两个人** → 复数主语。"},{"question":"复数主语在一般现在时与哪个 be 动词搭配？","hint":"We ___, They ___.","takeaway":"用 **`are`**。"},{"question":"什么时候可以说 `I am`？","hint":"主语只有 I。","takeaway":"`am` 不与 `he and I` 整体搭配，排除 A。"}]},{"title":"排除 is","steps":[{"question":"`is` 用于单数还是复数主语？","hint":"He is / They are。","takeaway":"本句主语为复数，不用 **is**，排除 B。"}]}]}},{"number":"32","item_type":"cloze","context_note":"","stem":"","options":{"A":"schoolbag","B":"pencil box","C":"watch","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查语篇理解与名词辨析。后文 **All my school things are in it**（我所有的文具都在它里面）以及再后出现 **two ... in it**、橡皮等，说明 **it** 指一个**能装下多种文具的容器**。**pencil box**（铅笔盒）体积适中，常用来装铅笔、橡皮、尺子等，与语境高度吻合。**schoolbag**（书包）虽也能装文具，但后文紧接着描述 **in it** 里有两块橡皮等细粒度物品，命题语境更贴近“铅笔盒内景”。**watch**（手表）无法容纳文具，与 **school things are in it** 完全矛盾。综合初中完形常见设空与下文 **erasers** 的共现，正确答案是 B。","knowledge_expansion_md":"### 1. school things 与容器词汇\n\n*   **pencil box / pencil case**：铅笔盒、笔袋\n*   **schoolbag / backpack**：书包\n*   **desk drawer**：抽屉（本题未出现）\n\n### 2. 代词指代（it）\n\n**it** 指代上文刚提到的**单数名词**；解题时需找出哪个名词能被“装下全部文具”这一描述修饰。\n\n### 3. 解题策略\n\n同时满足：① 能装 **school things**；② 与后文 **two erasers** 等小物件描写不冲突。","socratic_tracks":[{"title":"it 指代什么？","steps":[{"question":"`All my school things are in it` 说明 `it` 是什么性质的东西？","hint":"能装文具的容器。","takeaway":"候选应在 **pencil box** 与 **schoolbag** 之间斟酌。"},{"question":"手表能不能装铅笔和橡皮？","hint":"实物大小。","takeaway":"**watch** 不可能，排除 C。"},{"question":"后文立刻写 `These are two ___ in it`，命题者常把场景设在哪里？","hint":"课桌里打开铅笔盒的常见描写。","takeaway":"与 **pencil box** 共现频率高，选 B 更贴切。"}]},{"title":"schoolbag 为何不是最佳？","steps":[{"question":"若选 schoolbag，语义上是否完全错误？","hint":"书包里当然能放文具。","takeaway":"并非逻辑错误，但本题选项中 **pencil box** 与后文“盒内有两块橡皮”的微观场景更匹配命题意图。"}]}]}},{"number":"33","item_type":"cloze","context_note":"","stem":"","options":{"A":"erasers","B":"dictionaries","C":"watches","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查数词与名词复数及后文呼应。空格前为 **two**，后面必须接**可数名词复数形式**。后文 **One is mine and the other one is Tim's** 并提到 **You can see his name on the dictionary**，说明这两样东西可以是**字典**；但同时 **I lost my eraser** 表明叙述者刚丢了橡皮，且 **erasers** 与 **two**、铅笔盒场景极其自然。**dictionaries** 体积较大，两个大字典同时放在铅笔盒里不太现实。**watches** 与“文具”主题及后文 dictionary/eraser 线索关联弱。综合 **two + 复数** 与 **生活场景合理性**，**erasers** 最恰当。因此正确答案是 A。","knowledge_expansion_md":"### 1. 数词 two 后的名词形式\n\n*   **two + 可数名词复数**：`two books`, `two pens`, **`two erasers`**\n\n### 2. 上下文线索\n\n*   后文出现 **dictionary**、**eraser**，提示文具类名词场。\n*   **eraser** 变复数 **erasers**。\n\n### 3. 词义辨析\n\n*   **dictionary**：字典（体积大，两个放进 pencil box 需谨慎判断语境）\n*   **watch**：手表，非文具\n\n本题在 A 与 B 之间，应优先依据**空间合理性**与**丢失橡皮**的并列叙述。","socratic_tracks":[{"title":"语法：two 后面接什么？","steps":[{"question":"看到 `two`，后面名词要用什么形式？","hint":"单数还是复数？","takeaway":"**复数形式**；三个选项均为复数，进入语义筛选。"}]},{"title":"语义与场景","steps":[{"question":"铅笔盒里放两块什么比较常见？","hint":"橡皮、小刀、笔等。","takeaway":"**erasers** 非常自然。"},{"question":"后文说字典上有蒂姆的名字，是否等于空格必须填 dictionaries？","hint":"可能一块是“我”的橡皮，另一块与蒂姆的字典有关？注意句意：two ___ in it。","takeaway":"命题常考 **erasers** 与 **lost my eraser** 的远近呼应；**dictionaries** 两本塞入铅笔盒欠妥，故优选 A。"},{"question":"watches 与 school things 主题一致吗？","hint":"手表是文具吗？","takeaway":"不一致，排除 C。"}]}]}},{"number":"34","item_type":"cloze","context_note":"","stem":"","options":{"A":"his","B":"hers","C":"mine","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查名词性物主代词与并列结构。句型 **One is ___, the other one is Tim's** 表示两个事物分别属于“我”和蒂姆。**Tim's** 为名词所有格，相当于 **Tim's eraser/dictionary**（省略了中心名词）。与之对称的前半句应表示“**我的（那一块/那一本）**”，用名词性物主代词 **`mine`**，相当于 **my eraser**。选项 A **his** 与 **Tim's** 均指向男性第三方，语义重复、逻辑不清。选项 B **hers** 表“她的”，与叙述者第一人称 **I** 不符。因此正确答案是 C。","knowledge_expansion_md":"### 1. one ... the other ...\n\n*   用于**两者**中：一个……另一个……\n*   常与物主代词/所有格连用：**One is mine, the other is yours.**\n\n### 2. mine = my + 名词\n\n在指代清楚时，**mine** 避免重复 **my eraser**。\n\n### 3. Tim's 名词所有格\n\n*   **Tim's** = 属于 Tim 的东西\n*   与 **mine** 形成**并列对比**。","socratic_tracks":[{"title":"并列对称思维","steps":[{"question":"后半句 `the other one is Tim's` 表示属于谁？","hint":"Tim 的。","takeaway":"前半句应表示属于**叙述者自己**。"},{"question":"哪一个词等于 `my + 名词` 且可单独使用？","hint":"名词性物主代词。","takeaway":"**mine**。"},{"question":"若用 `his`，两个分句是否在说同一人？","hint":"his 与 Tim's 都指向男性第三方。","takeaway":"对比关系被削弱，逻辑不如 **mine** 清晰，排除 A。"}]},{"title":"排除 hers","steps":[{"question":"叙述者是男生还是女生？文中有没有用 she？","hint":"Bill 为第一人称。","takeaway":"不用 **hers**，排除 B。"}]}]}},{"number":"35","item_type":"cloze","context_note":"","stem":"If you find it, please call me __35__ 351-9668.","options":{"A":"with","B":"at","C":"for","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查固定搭配。句意：如果你找到了它，请**拨打**351-9668 **联系我**。英语中表示“拨打某个号码联系某人”，常用 **`call sb. at + 电话号码`**，故 **call me at 351-9668** 为规范表达。选项 A **with** 多表“用某种工具伴随”，不用于电话号码结构。选项 C **for** 常表目的、原因（如 `call me for help`），与直接跟号码的搭配不符。因此正确答案是 B。","knowledge_expansion_md":"### 1. call ... at ...\n\n*   **`Call me at 1234567.`** 请拨打 1234567 找我。\n*   同类结构：**email me at ...**（邮箱地址）\n\n### 2. 电话相关表达\n\n*   **phone number** / **telephone number**\n*   **What's your number?**\n\n### 3. 介词小结\n\n| 介词 | 常见搭配 |\n| :--- | :--- |\n| **at** | at + 号码（拨打） |\n| **for** | for + 目的/对象 |\n| **with** | with + 人/工具（和……一起） |","socratic_tracks":[{"title":"固定搭配识别","steps":[{"question":"空格后面是一串什么信息？","hint":"351-9668。","takeaway":"**电话号码**。"},{"question":"英语课本里“打这个号码找我”常用哪个介词？","hint":"Call Tom ___ 555-0199。","takeaway":"用 **`at`**。"},{"question":"`call me for 351-9668` 听起来像在说什么？","hint":"for 表“为了……”。","takeaway":"不符合“拨打号码”习惯，排除 C。"}]},{"title":"排除 with","steps":[{"question":"`call me with 号码` 是不是常见结构？","hint":"with 多接人：call me with your friend？","takeaway":"电话号码前不用 **with**，排除 A。"}]}]}}]},{"section_title":"三、阅读理解（A、B、C 三篇）","section_instruction":"(共30分)\nA篇：阅读短文，判断句子正(T)误(F)。\nB篇：根据表格内容选择（表格见第41题材料）。\nC篇：阅读短文，根据短文内容选择。","items":[{"number":"36","item_type":"reading","context_note":"A\n阅读下面短文，根据短文内容判断句子的正误，正确的写“T”，错误的写“F”。\n\nJerry White is a boy. He is nine years old. He is in Class Three, Grade Two. This is his dog. I don't know its name. I think it is three years old. That is his schoolbag. You can see a pencil, a math book, two Chinese textbooks and an English-Chinese dictionary in it. His good friend is David. David is an English boy. He is nine, too.","stem":"Jerry White is a girl.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"F","explanation_md":"本题为正误判断题。题干陈述为“Jerry White is a girl.”（杰里·怀特是一个女孩）。通过阅读文章，我们在第一句就能找到关键信息：“Jerry White is a boy.”（杰里·怀特是一个男孩）。题干中的“girl”（女孩）与原文中的“boy”（男孩）词义相反，信息明显不符。因此，该陈述是错误的。","knowledge_expansion_md":"### 阅读理解判断题技巧\n\n1.  **关键词定位法**：根据题干中的核心词汇（如人名、地名、时间、事件）返回原文，快速找到相关句子。本题的关键词是 “Jerry White” 和 “girl”。\n2.  **信息对比法**：将定位到的原文信息与题干陈述进行逐一比对。特别注意反义词（如本题的 boy/girl）、否定词（no, not）、数字和程度副词（always, never, some）等。\n3.  **“所见即所得”原则**：判断的唯一依据是文章内容，切勿根据自己的常识或背景知识进行推断。即使 “Jerry” 通常是男孩名，也必须以文章明确说明的 “is a boy” 为准。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"要判断这个句子是否正确，我们首先应该在文章里找什么信息？","hint":"这个句子是关于谁的什么信息？","takeaway":"解题第一步是根据题干关键词（Jerry White, girl）去原文中定位信息。"},{"question":"你在文章的第几句话找到了关于 Jerry White 性别的信息？原文是怎么说的？","hint":"文章通常会从介绍基本信息开始。","takeaway":"原文第一句就明确指出 “Jerry White is a boy.”。"}]},{"title":"信息对比与判断","steps":[{"question":"题目说 Jerry 是 'a girl'，文章说 Jerry 是 'a boy'。这两个描述是相同的、相似的还是相反的？","hint":"思考 'girl' 和 'boy' 的中文意思。","takeaway":"题干陈述与原文信息使用了反义词，内容完全矛盾。"},{"question":"当题干的陈述和文章内容完全矛盾时，我们应该判断这个句子是“正确”（True）还是“错误”（False）？","hint":"True 意为“真”，False 意为“假”。","takeaway":"与原文信息直接冲突的陈述，应判断为错误（F）。"}]},{"title":"排除干扰信息","steps":[{"question":"有些英文名，比如 Alex，男女都可以用。我们能仅凭 'Jerry' 这个名字来判断性别吗？","hint":"如果文章没有明确说明，只靠猜名字可靠吗？","takeaway":"在阅读理解中，不能依赖个人常识或对名字的刻板印象，必须以文本信息为准。"},{"question":"这道题最可靠的判断依据是什么？是 'Jerry' 这个名字，还是文章里的某句话？","hint":"阅读理解的答案永远藏在文章里。","takeaway":"解题的黄金法则是“答案在文中”，必须找到确凿的文本证据。"}]}]}},{"number":"37","item_type":"reading","context_note":"Passage A","stem":"Jerry White is in Class One, Grade Two.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"F","explanation_md":"本题考查对细节信息的准确判断。题干陈述为“Jerry White is in Class One, Grade Two.”（杰里·怀特在二年级一班）。我们定位到文章第二句：“He is in Class Three, Grade Two.”（他在二年级三班）。对比后发现，虽然年级“Grade Two”（二年级）是正确的，但班级信息不符，题干中的“Class One”（一班）与原文的“Class Three”（三班）相矛盾。在正误判断题中，只要有一处关键信息错误，整个陈述即为错误。","knowledge_expansion_md":"### 细节辨析在阅读中的重要性\n\n1.  **部分正确不等于完全正确**：这是判断题中常见的陷阱。一个句子可能包含多个信息点，出题人常常只改动其中一个，制造迷惑性。考生必须仔细核对所有细节。\n2.  **注意数字和专有名词**：数字（如年龄、班级、数量）和专有名词是细节题的高发考点，因为它们清晰、具体，便于设置错误选项。\n3.  **中英文表达顺序差异**：注意“几年级几班”的英文表达法。中文是“二年级三班”，英文常说 “Class Three, Grade Two”，将小单位（班）放在前面。理解这种差异有助于避免误读。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"这道题是关于 Jerry 的什么信息？题干中的关键词是什么？","hint":"注意题干中的班级和年级信息。","takeaway":"本题考查的是班级和年级信息，关键词是 'Class One, Grade Two'。"},{"question":"在原文中找到描述 Jerry 班级和年级的句子。原文是怎么说的？","hint":"这句话紧跟在介绍他年龄的句子后面。","takeaway":"原文相关句子是 'He is in Class Three, Grade Two.'。"}]},{"title":"逐一对比细节","steps":[{"question":"我们来比较一下题干和原文。关于年级（Grade），信息一致吗？","hint":"题干是 'Grade Two'，原文也是 'Grade Two'。","takeaway":"年级信息 'Grade Two' 是相符的。"},{"question":"那么关于班级（Class），信息一致吗？","hint":"题干是 'Class One'，原文是 'Class Three'。","takeaway":"班级信息不一致，这是本题的关键错误点。"},{"question":"当一个句子中，有一部分信息正确，但另一部分信息错误时，整个句子应该被判断为正确（T）还是错误（F）？","hint":"如果我说“地球是方的，并且会自转”，这句话整体上是对还是错？","takeaway":"只要陈述中包含任何与原文不符的关键信息，整个陈述就应判断为错误（F）。"}]},{"title":"理解英文表达","steps":[{"question":"原文 'Class Three, Grade Two' 翻译成中文是什么？","hint":"英文表达班级和年级的顺序和中文有什么不同？","takeaway":"英文习惯先说小单位再说大单位，即“三班，二年级”，与中文“二年级三班”的语序相反。"},{"question":"如果我们把原文信息 'Class Three, Grade Two' 和题干信息 'Class One, Grade Two' 都翻译成中文，它们的区别在哪里？","hint":"一个是“二年级三班”，另一个是“二年级一班”。","takeaway":"通过翻译成中文，可以更直观地发现题干与原文在“班级”这个细节上的差异。"}]}]}},{"number":"38","item_type":"reading","context_note":"Passage A","stem":"Jerry White's dog's name is Mimi.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"F","explanation_md":"本题考查对文章信息的准确理解，特别是对于“未提及信息”的处理。题干陈述为“Jerry White's dog's name is Mimi.”（杰里·怀特的狗的名字是咪咪）。我们定位到原文中关于狗的描述：“This is his dog. I don't know its name.”（这是他的狗。我不知道它的名字。）。原文明确表示作者“不知道”狗的名字，这意味着文章没有提供这个信息。而题干却给出了一个具体的名字“Mimi”，这属于“无中生有”的信息。因此，该陈述是错误的。","knowledge_expansion_md":"### 如何处理“未提及信息”（Not Given）\n\n在阅读判断题中，有三种情况：\n1.  **正确（True）**：题干陈述与原文信息相符，或可通过原文信息合理推断得出。\n2.  **错误（False）**：题干陈述与原文信息直接矛盾。\n3.  **未提及（Not Given）**：原文中没有出现相关信息，既不能证实其为真，也不能证实其为假。\n\n在本试卷的T/F判断题中，通常将“错误”和“未提及”都归为“F”。因为任何无法被原文信息证实为“T”的陈述，都不能判为正确。本题就是一个典型的“未提及”情况被判为“F”的例子。","socratic_tracks":[{"title":"信息查找与定位","steps":[{"question":"这道题的核心问题是什么？我们需要在文章里找什么？","hint":"看看题干中的所有格 'dog's name'。","takeaway":"我们需要在文章中寻找关于“狗的名字”的信息。"},{"question":"文章中提到狗了吗？关于它的名字，作者是怎么说的？","hint":"找到 'This is his dog.' 这句话，然后看紧接着的下一句。","takeaway":"原文明确说明 'I don't know its name'，即“我不知道它的名字”。"}]},{"title":"逻辑判断：已知 vs 未知","steps":[{"question":"既然作者说“不知道”狗的名字，这是否意味着文章告诉了我们狗的名字？","hint":"“不知道”和“名字是XX”是两种完全不同的信息状态。","takeaway":"原文清晰地表明“狗的名字”是一个未知信息。"},{"question":"题目说狗的名字是 'Mimi'。这个信息是文章里的吗？还是题目自己编造的？","hint":"在文章里搜索一下 'Mimi' 这个词。","takeaway":"题干给出的信息 'Mimi' 在原文中找不到任何依据，属于“无中生有”。"},{"question":"对于这种文章没有提及、凭空出现的信息，在T/F判断题中，我们应该判它对（T）还是错（F）？","hint":"如果一件事在证据里找不到，我们能说它是真的吗？","takeaway":"在T/F判断题中，任何原文未提及的信息都应被判断为错误（F）。"}]},{"title":"词义辨析","steps":[{"question":"在原文 'I don't know its name' 中，'its' 指代的是谁？","hint":"'it' 通常用来指代动物或物品。","takeaway":"这里的 'its' 是物主代词，指代 'the dog's'（狗的）。"},{"question":"题干中的 'Jerry White's dog's name' 是一个什么样的结构？它和 'its name' 在意思上有什么关系？","hint":"这是一个连续使用所有格 's 的结构。它和 'its name' 都指向同一个事物。","takeaway":"理解 'Jerry White's dog's name' 和 'its name' 指的是同一件事，是连接题干和原文的关键。"}]}]}},{"number":"39","item_type":"reading","context_note":"Passage A","stem":"You can't see a ball in Jerry White's schoolbag.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"T","explanation_md":"本题为正误判断题。题干陈述为“You can't see a ball in Jerry White's schoolbag.”（你在杰里·怀特的书包里看不到球）。我们定位到原文中关于书包内容的描述：“That is his schoolbag. You can see a pencil, a math book, two Chinese textbooks and an English-Chinese dictionary in it.”（那是他的书包。你可以在里面看到一支铅笔、一本数学书、两本语文课本和一本英汉词典。）。原文详细列举了书包里的物品，其中并不包含“球”（ball）。因此，题干“看不到球”的陈述与原文信息相符，是正确的。","knowledge_expansion_md":"### 阅读理解技巧：基于“列举信息”的判断\n\n1.  **核对清单**：当文章明确列出某一系列物品、特点或活动时（如本题中书包里的物品），判断题常常会考查清单之外的内容。解题时，应将题干所提事物与原文清单进行逐一核对。\n2.  **“未提及”即“没有”**：在“What's in the bag?”这类封闭性描述中，如果作者意图是告知所有内容，那么没有提到的东西就可以被视为不存在。原文列举了书包里的所有物品，其中没有球，因此可以断定“看不到球”。\n3.  **注意否定词**：题干中的 `can't` (cannot) 是关键。当原文信息支持“没有球”时，那么“看不到球”(`can't see a ball`) 这个否定陈述就是正确的（True）。","socratic_tracks":[{"title":"定位与核对","steps":[{"question":"题目问的是 Jerry 书包里有什么或没有什么。我们应该在文章的哪句话找到答案？","hint":"找到关键词 `schoolbag`。","takeaway":"根据关键词 `schoolbag` 定位到原文 'That is his schoolbag. You can see... in it.' 这句话。"},{"question":"请仔细阅读这句话，列出原文提到的书包里所有的东西。","hint":"a pencil, a math book...","takeaway":"原文列出的物品是：铅笔、数学书、两本语文课本、一本英汉词典。"},{"question":"在这个列表里，有 'ball'（球）或者任何一种球类吗？","hint":"对比一下列表和 'ball' 这个词。","takeaway":"原文列举的物品中不包含球。"}]},{"title":"理解否定句并判断","steps":[{"question":"既然书包里没有球，那么 'You can't see a ball in Jerry White's schoolbag' (你在书包里看不到球) 这句话描述的情况是真实的还是虚假的？","hint":"`can't see` 意为“看不到”。","takeaway":"因为事实是书包里没有球，所以“看不到球”这个陈述是符合事实的。"},{"question":"所以，这道题应该判断为正确（True）还是错误（False）？","hint":"符合事实的陈述就是正确的。","takeaway":"当题干陈述与根据原文得出的事实相符时，应判断为正确（T）。"}]}]},"correct_answer":"T"},{"number":"40","item_type":"reading","context_note":"Passage A","stem":"David is nine years old.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"T","explanation_md":"本题为正误判断题，考察对文章中细节信息的核对能力。题干陈述为“David is nine years old.”（大卫九岁了）。我们定位到文章最后两句：“His good friend is David. David is an English boy. He is nine, too.”（他的好朋友是大卫。大卫是个英国男孩。他也九岁了。）。原文明确指出大卫的年龄是“nine, too”（也九岁了），与题干陈述完全相符。因此，该陈述是正确的。","knowledge_expansion_md":"1. **年龄的表达与提问**：\n   - 提问年龄：`How old are you/is he/is she?`\n   - 回答年龄：`I am/He is/She is nine years old.` 或简化为 `I'm/He's/She's nine.`\n\n2. **阅读策略：细节信息核对**：在阅读理解中，数字（如年龄、日期、时间等）是常见的考点。考生需要对数字特别敏感，看到题目中出现数字，应迅速返回原文查找并进行精确核对。\n\n3. **理解省略和补充信息**：原文中的 `He is nine, too.` 是一个省略句，完整的说法是 `He is nine years old, too.`。`too` (也) 这个词暗示了他的年龄和 Jerry (He is nine years old) 相同。理解这些语言现象有助于准确获取信息。","socratic_tracks":[{"title":"关键信息定位","steps":[{"question":"这道题是关于谁的年龄？我们应该在文章中找到哪个关键词？","hint":"题干中出现了人名 `David`。","takeaway":"利用题干中的人名 `David` 作为关键词，可以快速在原文中定位到相关信息。"},{"question":"在文章的最后，关于 David 的年龄，原文是怎么说的？","hint":"找到 'David' 之后，看紧接着的句子。","takeaway":"原文相关句子是 'He is nine, too.'"}]},{"title":"词义与逻辑分析","steps":[{"question":"在 'He is nine, too.' 这句话中，'He' 指的是谁？","hint":"代词通常指代上文提到的人。","takeaway":"`He` 指代的是 `David`。"},{"question":"这句话中的 'nine' 是什么意思？'too' (也) 又暗示了什么？","hint":"Jerry 也是九岁。","takeaway":"'nine' 指的是九岁。'too' 表明 David 的年龄和前面提到的 Jerry 的年龄一样，都是九岁。"},{"question":"既然原文说 David 九岁，题干也说 'David is nine years old.'，那么题干的陈述是正确（T）还是错误（F）？","hint":"对比原文信息和题干陈述。","takeaway":"题干陈述与原文信息完全一致，因此是正确的（T）。"}]}]},"correct_answer":"T"},{"number":"41","item_type":"reading","context_note":"B\n根据表格内容选择。\n\nPersonal Information\n\n[[HTML_TABLE]]\n\u003ctable class=\"reading-personal-info-table\">\u003ctbody>\n\u003ctr>\u003cth scope=\"row\">Name\u003c/th>\u003ctd>Jim Allen Green\u003c/td>\u003cth scope=\"row\">Sex\u003c/th>\u003ctd>Male\u003c/td>\u003ctd colspan=\"2\">\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Chinese Name\u003c/th>\u003ctd>Feili\u003c/td>\u003cth scope=\"row\">Nationality\u003c/th>\u003ctd>English\u003c/td>\u003ctd colspan=\"2\">\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Student Number\u003c/th>\u003ctd>201807051\u003c/td>\u003cth scope=\"row\">Class\u003c/th>\u003ctd>Two\u003c/td>\u003cth scope=\"row\">Grade\u003c/th>\u003ctd>Seven\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Phone\u003c/th>\u003ctd>8260-7213\u003c/td>\u003cth scope=\"row\">Type of Blood\u003c/th>\u003ctd>O\u003c/td>\u003ctd colspan=\"2\">\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Address\u003c/th>\u003ctd colspan=\"5\">No. 281 Guanghua Avenue\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Name of School\u003c/th>\u003ctd colspan=\"5\">No. 7 Middle School\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">Post Code\u003c/th>\u003ctd colspan=\"5\">CD610031\u003c/td>\u003c/tr>\n\u003ctr>\u003cth scope=\"row\">E-mail Address\u003c/th>\u003ctd colspan=\"5\">\u003cem>Feili@163.com\u003c/em>\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n[[/HTML_TABLE]]","stem":"Jim is a(n) _____.","options":{"A":"Chinese","B":"English","C":"American","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题询问吉姆（Jim）的国籍。题目要求根据个人信息表（Personal Information）做出选择。我们在表格中找到 “Nationality”（国籍）这一项，其对应的信息是 “English”。“English” 作为名词时，意为“英国人”。选项A “Chinese” 是“中国人”，选项C “American” 是“美国人”。因此，Jim 是一个英国人，正确答案是B。","knowledge_expansion_md":"**1. 词汇辨析：国家与国籍**\n在英语中，表示国家的词和表示国籍/国民的词往往不同，需要区分记忆：\n- 国家 (Country): `England` (英格兰), `China` (中国), `America`/`the USA` (美国), `Japan` (日本)\n- 国籍/国民 (Nationality): `English` (英国人), `Chinese` (中国人), `American` (美国人), `Japanese` (日本人)\n注意：`English` 既是形容词（英国的），也是名词（英语；英国人）。本题中 `a(n) _____` 后需要一个可数名词单数，`English` 符合此用法。\n\n**2. 表格信息获取技巧**\n阅读表格、图表等非连续性文本时，关键在于快速、准确地定位信息。解题步骤如下：\n- **第一步**：读懂题干，明确需要查找的信息类别（本题是“国籍”）。\n- **第二步**：在表格的左侧栏（或顶部标题行）寻找与信息类别匹配的关键词（本题是 `Nationality`）。\n- **第三步**：找到关键词后，查看其右侧或下方对应的内容（本题是 `English`），即为答案。","socratic_tracks":[{"title":"表格信息定位","steps":[{"question":"题目问的是 Jim 的什么信息？根据选项判断，我们需要找的是国家、城市还是国籍？","hint":"选项 A, B, C 都是表示“哪国人”的词。","takeaway":"通过分析题干和选项，可以明确我们需要在表格中寻找的信息类型是“国籍”。"},{"question":"在英语中，“国籍”这个词怎么说？你能在表格中找到这个词吗？","hint":"“国籍”是 `Nationality`。请在表格左侧的栏目中寻找它。","takeaway":"掌握核心词汇（如 Nationality, Address, Name）是读懂英文表格的关键。"},{"question":"在表格中，`Nationality` 这一项对应的内容是什么？","hint":"找到 `Nationality` 后，看它右边的单元格里写了什么。","takeaway":"准确地找到表格中“项目-内容”（Key-Value）的对应关系，就能直接获取答案。"}]},{"title":"国籍词汇辨析","steps":[{"question":"选项 A `Chinese`, B `English`, C `American` 分别是哪个国家的人？","hint":"它们分别对应 China, England, America。","takeaway":"熟练掌握“国家-国籍”的词汇转换是解答此类问题的基础。"},{"question":"如果表格中 `Nationality` 一栏写的是 `China`，我们应该选哪个选项？","hint":"`China` 是国家名，而题目 `Jim is a(n) _____` 需要填一个表示“……国人”的词。","takeaway":"要注意区分国家名词和国籍名词在句子中的不同用法。"}]},{"title":"干扰信息排除","steps":[{"question":"表格中提到了 `Chinese Name` (中文名)，这能说明 Jim 是中国人吗？","hint":"一个外国人也可以有中文名，这和他的国籍不一定有关系。","takeaway":"不能根据间接或不相关的信息进行推断，必须找到最直接的证据。"},{"question":"表格中有没有提到任何与 `America` (美国) 或 `American` (美国人) 相关的信息？","hint":"快速扫描整个表格，看看有没有出现这个词。","takeaway":"对于原文完全没有提及的信息，可以直接排除对应选项，这是一种有效的解题策略。"}]}]}},{"number":"42","item_type":"reading","context_note":"Passage B","stem":"_____ is Jim's Chinese name.","options":{"A":"Allen","B":"Guanghua","C":"Feili","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题询问吉姆（Jim）的中文名是什么。题干是 “_____ is Jim's Chinese name.”（_____是吉姆的中文名）。我们需要在个人信息表中找到 “Chinese Name”（中文名）这一项。表格中明确显示，“Chinese Name” 对应的内容是 “Feili”。选项A “Allen” 是Jim的中间名（Middle Name），选项B “Guanghua” 是他地址（Address）的一部分。因此，只有 “Feili” 是他的中文名。故选C。","knowledge_expansion_md":"**1. 名词所有格 `'s` 的用法**\n`'s` 是名词所有格的标志，用于表示“……的”，表达所属关系。其基本构成为：`名词 + 's`。\n- 例如：`Jim's Chinese name` (吉姆的中文名), `Tom's book` (汤姆的书), `my sister's friend` (我姐姐的朋友)。\n- 当名词是复数且以-s结尾时，通常只加 `'`，如 `the students' classroom` (学生们的教室)。\n\n**2. 英文姓名结构 (English Name Structure)**\n西方人的全名通常由三部分组成：`First Name` (名) + `Middle Name` (中间名) + `Last Name` (姓)。\n- 在本题表格中 `Name: Jim Allen Green`，`Jim` 是名，`Allen` 是中间名，`Green` 是姓。\n- 理解姓名结构有助于在信息表中区分不同部分，避免将中间名误认为是其他信息。\n\n**3. 信息辨析与排除干扰项**\n阅读理解题，尤其是信息查找题，常常会用原文中出现过的其他词汇作为干扰选项。考生必须仔细核对信息所属的类别，避免张冠李戴。本题中，`Allen` 和 `Guanghua` 都是表格里出现过的词，但它们分别属于“姓名”和“地址”类别，与问题所问的“中文名”无关。","socratic_tracks":[{"title":"信息定位与匹配","steps":[{"question":"题干 “_____ is Jim's Chinese name.” 是在问什么？","hint":"这个句子缺少主语，它在问“什么是Jim的中文名？”","takeaway":"准确理解题干的提问是正确解题的第一步。"},{"question":"我们应该在表格的哪一栏寻找“中文名”这个信息？","hint":"请在表格中寻找与 `Chinese Name` 匹配的项目。","takeaway":"将题干关键词与表格项目进行精确匹配，可以快速定位答案。"},{"question":"表格中 `Chinese Name` 对应的内容是什么？这个内容和哪个选项一致？","hint":"表格中 `Chinese Name` 旁边写着 `Feili`。","takeaway":"找到表格中项目所对应的值，并与选项进行匹配，即可得出答案。"}]},{"title":"干扰项分析","steps":[{"question":"我们来看看选项A `Allen`。它出现在表格的什么位置？它代表什么信息？","hint":"`Allen` 出现在 `Name` (姓名) 一栏，是 `Jim Allen Green` 的一部分。","takeaway":"干扰项通常是原文中出现但与问题无关的词汇，需要辨别其真实身份。"},{"question":"再看选项B `Guanghua`。它又出现在表格的什么位置，代表什么信息？","hint":"`Guanghua` 出现在 `Address` (地址) 一栏，是街道名的一部分。","takeaway":"做信息查找题时，必须确保找到的信息与问题所问的类别完全一致，避免张冠李戴。"},{"question":"既然 `Allen` 是中间名，`Guanghua` 是地址的一部分，那它们能作为 `Chinese name` 的答案吗？","hint":"不能，因为它们的信息类别与题目要求不符。","takeaway":"通过分析并排除干扰项，可以反向验证正确答案的可靠性。"}]},{"title":"所有格的理解","steps":[{"question":"在短语 `Jim's Chinese name` 中，`'s` 是什么意思？起什么作用？","hint":"它表示“……的”，表示这个 `Chinese name` 是属于 `Jim` 的。","takeaway":"名词所有格 `'s` 是表达所属关系的核心语法点。"},{"question":"如果我们想知道表格中 Jim 的学号，可以用 `'s` 怎么来表达这个短语？","hint":"学号是 `Student Number`。","takeaway":"学会使用所有格 `'s` 可以帮助我们更地道、更准确地组织语言来表达所属关系。"}]}]}},{"number":"43","item_type":"reading","context_note":"Passage B","stem":"His telephone number is _____.","options":{"A":"8260-7213","B":"201807051","C":"CD 610031","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这是一道细节信息查找题，题目要求找出Jim的电话号码。根据表格内容，在 “Phone”（电话）这一项，对应的号码是 “8260-7213”。因此，选项A是正确的。选项B “201807051” 是学号（Student Number）。选项C “CD 610031” 是邮政编码（Post Code），并非电话号码。","knowledge_expansion_md":"**1. 关键词定位法 (Keyword Scanning):** 在处理信息查找类阅读题时，首先要从题干中提炼出关键词，如本题的“telephone number”。然后带着关键词回到原文中快速扫描，寻找与之匹配或相关的词语（如“Tel”, “Phone number”等），从而精确定位答案所在位置。\n\n**2. 常见个人信息词汇与缩写 (Personal Information Vocabulary & Abbreviations):**\n*   `Name`: 姓名\n*   `Gender`: 性别 (Male/Boy, Female/Girl)\n*   `Address`: 地址 (St. = Street, Rd. = Road)\n*   `Tel` / `Phone`: 电话\n*   `E-mail`: 电子邮件\n*   `P.C.` (Post Code) / `Zip Code`: 邮政编码\n*   `ID` (Identification): 身份；`Student ID`: 学号\n\n**3. 数字信息的辨析:** 考试中常出现多种数字信息来设置干扰项。考生需注意区分电话号码、门牌号、邮政编码、学号、日期等的格式和含义，避免张冠李戴。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"题目问的是什么具体信息？","hint":"请看题干中的核心名词“telephone number”。","takeaway":"题目问的是“电话号码”。"},{"question":"在个人信息卡中，哪个词或缩写通常用来表示“电话号码”？","hint":"想一想“电话”的英文单词是什么，它的常见缩写是什么？","takeaway":"在信息卡中，“Tel”是“telephone”的缩写，代表电话号码。"},{"question":"根据这个线索，你在信息卡中找到的电话号码是多少？","hint":"直接查看“Tel”标签后面的数字。","takeaway":"“Tel”后面对应的数字是 8260-7213，因此答案是A。"}]},{"title":"排除干扰项","steps":[{"question":"选项B的数字“201807051”在信息卡中可能代表什么？","hint":"这串数字很长，不像电话号码，更像某种编号。看看信息卡上有没有“ID”之类的字样。","takeaway":"这个数字对应的是“Student ID”（学号），而不是电话号码。"},{"question":"选项C的“CD 610031”又是什么信息呢？","hint":"它出现在地址（Address）信息中。“CD”可能是一个地名的缩写，“610031”是六位数，像什么号码？","takeaway":"这部分信息对应的是地址中的城市（CD=Chengdu）和邮政编码（Post Code），也不是电话号码。"}]},{"title":"信息表达拓展","steps":[{"question":"除了在表格里写“Tel: ...”，我们还可以用完整的句子怎么问和回答电话号码？","hint":"试试用“What's your...?”这个句型来提问。","takeaway":"我们可以问“What's your telephone number?”，回答“My telephone number is ...”或“It's ...”。"},{"question":"信息卡上的“Address”是什么意思？我们该如何用一句话介绍Jim的地址？","hint":"“Address”指的是“地址”。介绍时可以说“He lives at/on ...”或“His address is ...”。","takeaway":"我们可以说“Jim's address is Guanghua Road, Chengdu, 610031”。"}]}]}},{"number":"44","item_type":"reading","context_note":"Passage B","stem":"Jim is _____.","options":{"A":"a boy","B":"Guanghua","C":"in Class 2, Grade 8","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查对Jim基本信息的判断。我们需要根据表格内容，判断哪个选项的描述是正确的。\n- 选项A：`a boy` (一个男孩)。表格中 `Sex` (性别) 一栏是 `Male` (男性)，所以Jim是一个男孩，该选项正确。\n- 选项B：`Guanghua`。表格中 `Guanghua` 出现在 `Address` (地址) 一栏，是街道名的一部分，不是人，该选项错误。\n- 选项C：`in Class 2, Grade 8` (在八年级二班)。表格中显示 `Class: Two` (二班)，`Grade: Seven` (七年级)。所以Jim在七年级二班，而不是八年级。该选项与表格信息不符，错误。\n综上，只有选项A是正确的描述。故选A。","knowledge_expansion_md":"**1. 身份与状态的区分:** 在回答 “Someone is ___.” 这类问题时，要学会区分描述“身份/本质”(identity) 和描述“状态/位置”(state/location) 的选项。身份通常指职业（a teacher）、角色（a student）、性别（a boy）等相对固定的属性。状态或位置则描述暂时的情况或地点（in the classroom, happy, busy）。当两者同时作为选项出现时，描述身份的选项通常是更优选。\n\n**2. Be动词的核心用法:** \"be\" 动词（am, is, are）是英语中最核心的动词之一，其后可以跟不同成分，表达丰富含义。\n*   **be + 名词:** `He is a boy.` (表明身份/类别)\n*   **be + 形容词:** `He is tall.` (描述特征/状态)\n*   **be + 介词短语:** `He is in Grade 8.` (表明位置/处境)","socratic_tracks":[{"title":"最佳答案选择","steps":[{"question":"根据信息卡，关于Jim，选项A“a boy”和选项C“in Class 2, Grade 8”的说法都是事实吗？","hint":"信息卡上写了他的性别是“Boy”，班级是“Class 2, Grade 8”。","takeaway":"是的，A和C的描述都是事实。"},{"question":"题目问“Jim is ___”，更倾向于问他的根本身份，还是他所处的具体班级？","hint":"对比一下“他是一个男孩”和“他在八年级二班”，哪个更像是对“他是谁”这个问题的直接回答？","takeaway":"“他是一个男孩”更能概括他的身份属性，是更根本的描述。"},{"question":"所以，当有多个选项陈述的都是事实时，我们应该如何选择？","hint":"选择最能直接、核心地回答问题意图的那个选项。","takeaway":"当有多个事实正确的选项时，应选择最贴合问题核心的那个作为最佳答案。"}]},{"title":"信息定位与排除","steps":[{"question":"我们从信息卡的哪里可以知道Jim的性别？","hint":"找一找表示“性别”的英文单词“Gender”。","takeaway":"在“Gender”（性别）一栏，写着“Boy”，这证实了选项A。"},{"question":"选项B“Guanghua”为什么是错误的？","hint":"在信息卡中，“Guanghua”出现在哪一栏？它是一个人名吗？","takeaway":"“Guanghua”出现在“Address”（地址）一栏，它是一个路名，而不是人。"}]},{"title":"Be动词用法辨析","steps":[{"question":"“Jim is a boy.” 这句话里，be动词“is”后面跟的是什么词性的词？它表达了什么？","hint":"“a boy”是一个名词短语。","takeaway":"“is”后面跟的是名词，用来表明Jim的身份。"},{"question":"“Jim is in Class 2, Grade 8.” 这句话里，“is”后面跟的是什么？它又表达了什么？","hint":"“in Class 2...”是一个由介词“in”引导的短语。","takeaway":"“is”后面跟的是介词短语，用来表明Jim所处的班级（位置/环境）。"}]}]}},{"number":"45","item_type":"reading","context_note":"Passage B","stem":"Which one is wrong?","options":{"A":"We can e-mail Jim at Feili@163.com.","B":"Jim is a student of No. 7 Middle School.","C":"Jim's family name is Allen Green.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这是一道逆向选择题，要求选出错误的一项（Which one is wrong?）。我们需要逐一核对每个选项与表格信息的符合程度。\n*   **选项A:** 表格中 `E-mail Address` 一栏是 `Feili@163.com`。该选项陈述正确。\n*   **选项B:** 表格中 `Name of School` 一栏是 `No. 7 Middle School`。该选项陈述正确。\n*   **选项C:** 表格中 `Name` 一栏是 `Jim Allen Green`。在英文姓名中，通常第一个是名（First Name），中间的是中间名（Middle Name），最后一个是姓（Family Name/Last Name）。所以Jim的姓是 `Green`，而不是 `Allen Green`。因此，该选项陈述错误。\n题目要求选择错误的一项，故选C。","knowledge_expansion_md":"**1. 英文姓名结构 (English Name Structure):** 英文姓名通常由“名 (Given Name/First Name)”和“姓 (Family Name/Surname/Last Name)”组成，标准顺序是“名+姓”。例如，在“Jim Green”中，“Jim”是名，“Green”是姓。这与中文“姓+名”（如：张伟）的顺序相反，是初学英语的常见易错点。\n\n**2. 否定判断题解题技巧 (Solving \"Which is wrong/not true\" Questions):** 这类题目需要“反向思维”或使用“排除法”。解题步骤如下：\n*   仔细阅读题干，确认是要求选择“错误的”或“未提及的”选项。\n*   逐一将每个选项与原文信息进行比对。\n*   在原文中找到明确依据，证实为正确的选项，将其排除。\n*   那个与原文信息相矛盾或在原文中找不到任何依据的选项，就是正确答案。","socratic_tracks":[{"title":"英文姓名结构","steps":[{"question":"看到一个英文名，比如“Tom Hanks”，我们通常怎么判断哪个是名，哪个是姓？","hint":"想想我们平时称呼“汤姆·汉克斯”时，哪个是他的姓氏？","takeaway":"在英文姓名中，通常第一个是名（First Name），最后一个是姓（Last Name/Family Name）。"},{"question":"那么，在“Jim Green”这个名字里，他的姓（family name）是什么？","hint":"根据“名在前，姓在后”的规则。","takeaway":"他的姓是“Green”。"},{"question":"现在看选项C，它说“Jim's family name is Allen Green”。这个说法正确吗？","hint":"对比一下“Green”和“Allen Green”。","takeaway":"这个说法是错误的，他的姓只是“Green”，多了一个“Allen”。"}]},{"title":"排除法应用","steps":[{"question":"题目要求我们选出“错误的一项”。我们先来验证一下选项A是否正确。","hint":"去信息卡里找“E-mail”或类似的关键词。","takeaway":"信息卡上明确写着 E-mail: Feili@163.com，所以选项A的陈述是正确的，应该被排除。"},{"question":"接下来，我们验证一下选项B是否正确。","hint":"去信息卡里找“School”（学校）这一项。","takeaway":"信息卡上写着 School: No. 7 Middle School，所以选项B的陈述也是正确的，也应该被排除。"},{"question":"既然A和B都是正确的陈述，而题目要找错误的一项，那么答案是什么？","hint":"排除掉所有正确的选项后，剩下的就是答案。","takeaway":"通过排除法，我们可以确定C是唯一的错误陈述，因此是本题的正确答案。"}]},{"title":"提问个人信息","steps":[{"question":"如果我们想用英语问别人的姓氏，应该怎么问？","hint":"可以用“What's your...?”句型，姓氏的英文是 family name 或 last name。","takeaway":"我们可以问“What's your family name?”或“What's your last name?”"},{"question":"如果我们想问别人的名字（不是姓），又该怎么问？","hint":"名字的英文是 first name 或 given name。","takeaway":"我们可以问“What's your first name?”或“What's your given name?”"}]}]}},{"number":"46","item_type":"reading","context_note":"C\n阅读下面短文，根据短文内容选择。\n\nHi, my name's Mike. I have a big family. I'm an English teacher. My wife Danielle is an English teacher, too. We're both 40 years old. We have two kids. Jack is our son. And Anna is our daughter. They're in No. 7 SHIYAN Middle School. My father is Jeff and my mother is Anna. They're both teachers. Jeff is 67 and Anna is 64. Tessy is my brother. He's a math teacher. He has two boys, Martin and Ken. Nancy is my wife's sister. She's a Chinese teacher and she can speak Chinese very well. My wife's parents are teachers, too. How many teachers are there in my family?","stem":"How many teachers are there in Mike's family?","options":{"A":"Four.","B":"Six.","C":"Eight.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找与信息整合计算题。我们需要在短文中找出所有职业是“teacher”的人并统计总数。\n1.  **Mike**：“I'm an English teacher.” (第1位)\n2.  **Danielle** (Mike的妻子)：“My wife Danielle is an English teacher, too.” (第2位)\n3.  **Jeff** (Mike的父亲)：“My father is Jeff ... They're both teachers.” (第3位)\n4.  **Anna** (Mike的母亲)：“my mother is Anna. They're both teachers.” (第4位)\n5.  **Tessy** (Mike的兄弟)：“He's a math teacher.” (第5位)\n6.  **Nancy** (Mike妻子的妹妹)：“She's a Chinese teacher.” (第6位)\n7.  **Mike妻子的父母**：“My wife's parents are teachers, too.” (这是2个人，第7、8位)\n将以上人数相加：1 + 1 + 1 + 1 + 1 + 1 + 2 = 8位老师。因此，正确答案是C。","knowledge_expansion_md":"**1. 细节查找与信息整合 (Finding Details and Integrating Information):** 这类题目考查学生从文本中筛选、提取并整合具体信息的能力。解题关键是耐心和细致，不要遗漏任何一个细节。推荐使用“标记法”，即用笔在卷上圈出关键人物和他们的职业，然后在旁边做标记或列表计数，可以有效避免混淆或遗漏。\n\n**2. 家庭成员词汇 (Family Members Vocabulary):** 熟练掌握家庭成员的称谓是理解文章的基础。核心词汇包括：`wife`(妻子), `son`(儿子), `daughter`(女儿), `father`(父亲), `mother`(母亲), `brother`(兄弟), `sister`(姐妹), `parents`(父母)。特别注意复合关系，如 `wife's sister`(妻子的姐妹，即姨子), `wife's parents`(妻子的父母，即岳父母)。\n\n**3. 注意指代关系与复数形式:** 文中出现了 `We`, `They`, `He`, `She` 等代词，要清楚它们分别指代谁。同时注意名词的复数形式，如 `parents` 指的是两个人（父亲和母亲），这是本题的一个关键计数点。","socratic_tracks":[{"title":"逐一排查计数法","steps":[{"question":"首先，文章的主人公 Mike 和他的直系小家庭里有几位老师？","hint":"看看文章开头，Mike 和他的妻子 Danielle 是什么职业？","takeaway":"Mike 和他的妻子都是老师，这是2位。"},{"question":"接下来，Mike 的原生家庭（父母和兄弟）中有几位老师？","hint":"文中提到 'My father... and my mother... They're both teachers.' 以及 'Tessy is my brother. He's a math teacher.'","takeaway":"他的父母（2位）和兄弟（1位）也都是老师，这又是3位。"},{"question":"最后，他妻子的家庭中有几位老师？","hint":"文中说 'Nancy is my wife's sister. She's a Chinese teacher' 和 'My wife's parents are teachers, too.'。注意'parents'是复数。","takeaway":"他妻子的妹妹（1位）和父母（2位）也是老师，这又是3位。"},{"question":"现在，把所有数出来的老师加在一起，总共有多少位？","hint":"2 (Mike夫妇) + 3 (Mike的原生家庭) + 3 (妻子的家庭) = ?","takeaway":"总共有 2 + 3 + 3 = 8 位老师。"}]},{"title":"警惕计数陷阱","steps":[{"question":"在数Mike的父母时，文中说“They're both teachers.”，这里的“They”和“both”告诉我们是几个人？","hint":"“They”是“他们”，“both”是“两者都”。","takeaway":"这两个词都表明这里指的是两个人，即他的父亲和母亲。"},{"question":"在数他妻子的家人时，文中说“My wife's parents are teachers, too.”，这里的“parents”是几个人？","hint":"“parent”是单数（父或母），“parents”是复数。","takeaway":"“parents”是复数，指父母两个人，这是一个容易只算成1个的陷阱。"},{"question":"文章中有没有提到不是老师的家庭成员？","hint":"看看Mike的孩子们 Jack 和 Anna。","takeaway":"他的两个孩子是学生，不是老师，在计数时需要排除他们。"}]},{"title":"理清人物关系","steps":[{"question":"文中的“my wife's sister”是谁？她和Mike是什么关系？","hint":"“sister”是姐妹，“wife”是妻子。","takeaway":"“my wife's sister”是指Mike妻子的姐妹（Nancy），也就是Mike的姨子。"},{"question":"文中的“my wife's parents”是谁？","hint":"“parents”是父母。","takeaway":"“my wife's parents”是指Mike妻子的父母，也就是Mike的岳父岳母。"},{"question":"为什么理清这些复杂的人物关系对正确答题很重要？","hint":"如果关系搞错了，比如把“wife's sister”当成Mike自己的sister，就可能算错人数或理解错信息。","takeaway":"准确理解家庭成员关系是避免信息整合错误的关键。"}]}]}},{"number":"47","item_type":"reading","context_note":"Passage C","stem":"How old is Mike's father?","options":{"A":"40.","B":"67.","C":"64.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"这是一道细节查找题。题目询问迈克（Mike）的父亲多大年纪。根据原文“My father is Jeff and my mother is Anna. ... Jeff is 67 and Anna is 64.”可知，迈克的父亲是杰夫（Jeff），他今年67岁。因此，正确答案是B。","knowledge_expansion_md":"在阅读理解中，回答关于年龄、时间、数量等具体信息的问题时，关键在于快速定位文中的数字信息。这类问题通常被称为“事实细节题”。解题技巧是：\n1.  **识别关键词**：从问题中找出核心词，如此题的“Mike's father”和“how old”。\n2.  **快速扫描**：带着关键词在文章中快速查找，定位到包含这些词或其同义词的句子。\n3.  **精确匹配**：仔细阅读定位到的句子，找到与问题直接对应的数字信息。注意区分不同数字指代的对象，避免张冠李戴，如本题中的40岁（Mike本人）、64岁（Mike的母亲）。","socratic_tracks":[{"title":"关键信息定位","steps":[{"question":"问题问的是关于谁的什么信息？","hint":"题目问的是 'Mike's father' (迈克的父亲) 的 'How old' (年龄)。","takeaway":"题目问的是迈克父亲的年龄。"},{"question":"在文章中，哪句话提到了迈克父亲的名字和年龄？","hint":"快速在文章中寻找 'My father' 这个词组。","takeaway":"文章中说 'My father is Jeff ... Jeff is 67'。"},{"question":"所以，迈克的父亲多大年纪？","hint":"直接从上一步的信息中读取数字。","takeaway":"迈克的父亲是67岁。"}]},{"title":"干扰项辨析","steps":[{"question":"选项A的 '40' 是谁的年龄？","hint":"文中说 'We're both 40 years old'，这里的 'We' 指的是谁？","takeaway":"40岁是迈克（Mike）和他妻子（Danielle）的年龄。"},{"question":"选项C的 '64' 是谁的年龄？","hint":"文中说 'Anna is 64'，这个Anna是谁？","takeaway":"64岁是迈克母亲（Anna）的年龄。"},{"question":"为什么辨别清楚每个人物和对应的数字很重要？","hint":"这是细节题的常见考点，出题人会用文中的其他数字作为干扰项。","takeaway":"准确匹配人物和信息是做对细节题的关键，可以避免被文中的其他数字误导。"}]}]}},{"number":"48","item_type":"reading","context_note":"Passage C","stem":"Is Sonia Martin's sister?","options":{"A":"Yes, she is.","B":"No, she isn't.","C":"Sorry, I don't know.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"这是一道人物关系推理题。根据文章内容，马丁（Martin）是迈克（Mike）的侄子。然而，文章全文并未提及名为“索尼娅（Sonia）”的人物。因此，无法根据文章信息回答此问题。该题目的题干与所给阅读文章内容不匹配。","knowledge_expansion_md":"在英语中，家庭成员的称谓需要精确理解。\n*   **Sister**: 指亲生的姐妹。\n*   **Sister-in-law**: 指配偶的姐妹（小姨子/大姨子），或者兄弟的妻子（嫂子/弟媳）。\n\n做此类题目时，需要根据文中的线索画出简易的人物关系图，理清他们之间的真实关系。当题干中出现文章未提及的信息或人物时，应判断为“信息不足”或“题目与原文不符”。","socratic_tracks":[{"title":"核对文章信息","steps":[{"question":"问题中的关键人物是谁？","hint":"看看题干中的两个人名。","takeaway":"关键人物是马丁（Martin）和索尼娅（Sonia）。"},{"question":"请在文章中找到关于“马丁”的信息。","hint":"文章提到 'Tessy is my brother. He has two boys, Martin and Ken.'","takeaway":"文章提到了马丁（Martin），他是叙述者迈克的侄子。"},{"question":"请在文章中找到关于“索尼娅”的信息。","hint":"通读全文，寻找 'Sonia' 这个名字。","takeaway":"通读全文后发现，文章中没有出现 'Sonia' 这个名字。"},{"question":"这说明了什么问题？","hint":"如果题目问了一个文章里根本不存在的人，我们能回答吗？","takeaway":"这说明该题目的题干与所给的阅读文章内容不匹配，属于无效题目。"}]}]}},{"number":"49","item_type":"reading","context_note":"Passage C","stem":"What does Tony teach?","options":{"A":"English.","B":"Chinese.","C":"Math.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这是一道事实细节题。题目询问托尼（Tony）所教的科目。然而，通读文章全文，并未提及名为“托尼（Tony）”的人物。因此，无法根据文章信息回答此问题。该题目的题干与所给阅读文章内容不匹配。","knowledge_expansion_md":"本题考察对职业（professions）和学科（subjects）相关词汇的掌握情况。解题时，首先需要通过问题中的人名“Tony”在原文中定位信息。如果无法在原文中找到关键人名或信息，则应判断该题可能与原文不匹配，无法作答。这是审题能力的重要体现。","socratic_tracks":[{"title":"核对文章信息","steps":[{"question":"这个问题的主语是谁？","hint":"题目中提到了一个名字。","takeaway":"问题是关于托尼（Tony）的。"},{"question":"请在文章中找到关于“托尼”的信息。","hint":"快速扫描文章，寻找 'Tony' 这个词。","takeaway":"通读全文后发现，文章中没有出现 'Tony' 这个名字。"},{"question":"这说明了什么问题？","hint":"如果题目问了一个文章里根本不存在的人，我们能回答吗？","takeaway":"这说明该题目的题干与所给的阅读文章内容不匹配，属于无效题目。"}]}]}},{"number":"50","item_type":"reading","context_note":"Passage C","stem":"Which is TRUE?","options":{"A":"My parents and my wife's parents are all teachers.","B":"Ken and Martin aren't brothers.","C":"Nancy can't speak Chinese very well.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这是一道正误判断题，需要我们根据原文逐一核对每个选项的真实性。\n*   **选项A**: “My parents and my wife's parents are all teachers.” (我的父母和我妻子的父母都是老师。) 根据原文，“My father is Jeff and my mother is Anna. They're both teachers.”以及“My wife's parents are teachers, too.”可知，叙述者Mike的父母和他妻子的父母都是老师。该选项表述正确。\n*   **选项B**: “Ken and Martin aren't brothers.” (肯和马丁不是兄弟。) 根据原文，“Tessy is my brother. He has two boys, Martin and Ken.”可知，肯和马丁是兄弟。该选项表述错误。\n*   **选项C**: “Nancy can't speak Chinese very well.” (南希的中文说得不是很好。) 根据原文，“Nancy is my wife's sister. She's a Chinese teacher and she can speak Chinese very well.”可知，南希中文说得很好。该选项表述与原文相反，是错误的。\n综上所述，只有选项A的表述是正确的。","knowledge_expansion_md":"正误判断题（True/False）是阅读理解的常见题型。解题策略是“逐一验证法”：\n1.  **定位原文**：根据选项中的关键词（如人名、事件）返回原文，找到相关描述句。\n2.  **仔细比对**：将选项的表述与原文信息进行精确比对。注意是否存在同义替换、反义或偷换概念的情况。\n3.  **注意细节**：特别留意选项中的绝对词（如 'all', 'never'）和否定词（如 'not', 'aren't'），它们往往是判断的关键。例如本题选项C中的 'can't...very well' 与原文的 'very well' 形成直接矛盾。","socratic_tracks":[{"title":"逐一排除法","steps":[{"question":"我们来验证选项A。文章中关于“我”的父母和我妻子的父母的职业是怎么说的？","hint":"找到 'My father... and my mother...' 和 'My wife's parents...' 这两处信息。","takeaway":"文中明确指出 'They're both teachers' 和 'are teachers, too'。所以选项A正确。"},{"question":"我们来验证选项B。文章中肯（Ken）和马丁（Martin）是什么关系？","hint":"文中说他们是泰西（Tessy）的 'two boys'。","takeaway":"他们是兄弟。选项B说他们'不是'兄弟，所以是错误的。"},{"question":"我们来验证选项C。文章中南希（Nancy）的中文水平如何？","hint":"找到关于 'Nancy' 的描述。","takeaway":"文中说 'she can speak Chinese very well' (她说得很好)。选项C的表述正好相反，所以是错误的。"},{"question":"既然A正确，B和C都错误，那么本题的答案是什么？","hint":"题目要求选择 'TRUE' (正确) 的一项。","takeaway":"正确答案是A。"}]}]}}]},{"section_title":"四、阅读表达","section_instruction":"(共10分)\n阅读下面短文，根据短文内容，从文后的选项中选出适当的选项补全短文(有两个多余选项)，并将选项的编号依次填入题后横线上。\n\nThis is my family. __41__ I am the only child. My mother is a teacher. __42__ You can see them in our school. My father and I usually go to school by car in the morning together. __43__ My father loves my mother and my mother loves my father. My parents love me and I love my parents. __44__ What about yours?\n\n**Options:**\nA. But my mother often walks to school.\nB. Family means love.\nC. But my mother has a brother and a sister.\nD. I have no brothers or sisters.\nE. This is my family.\nF. My father is a teacher, too.","items":[{"number":"41","item_type":"reading","context_note":"","stem":"41. _____","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"D","explanation_md":"此题考查对上下文的理解。空格后的句子是“I am the only child.”（我是独生子女。），而选项D“I have no brothers or sisters.”（我没有兄弟姐妹。）正是对“独生子女”的解释。将选项D填入空格，使得上下文语义连贯，逻辑清晰。前一句解释后一句，符合小学生认知和表达习惯。","knowledge_expansion_md":"**核心词汇：only child**\n*   `only child` 是一个固定名词短语，意为“独生子/女”。\n*   它的同义表达就是 `have no brothers or sisters`。\n\n**句子结构分析：**\n在简单的自我介绍或家庭描述中，常常会用一句话引出概念，再用另一句话进行解释或补充，以确保意思明确。例如：\n*   I am an only child. This means I have no brothers or sisters.\n*   I have no brothers or sisters. I am the only child.\n这两种表达方式都是正确的。","socratic_tracks":[{"title":"寻找线索","steps":[{"question":"请看空格后面的句子是什么？","hint":"“I am the only child.”","takeaway":"空格后面的句子是“我是独生子女”。"},{"question":"“独生子女”是什么意思？","hint":"想一想独生子女的家庭成员构成。","takeaway":"“独生子女”意味着没有兄弟姐妹。"},{"question":"在选项中，哪一句话表达了“没有兄弟姐妹”这个意思？","hint":"请仔细阅读选项D。","takeaway":"选项D “I have no brothers or sisters.” 完美地解释了什么是“独生子女”。因此，41题选D。"}]}]}},{"number":"42","item_type":"reading","context_note":"","stem":"42. _____","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"F","explanation_md":"此题考查对代词指代和上下文逻辑的判断。空格前的句子说“My mother is a teacher.”（我妈妈是一名老师。），空格后的句子是“You can see them in our school.”（你可以在我们学校看到他们。）。关键词是“them”（他们），这是一个复数代词，说明在学校里不止妈妈一个人。选项F“My father is a teacher, too.”（我爸爸也是一名老师。）恰好提供了另一个人——爸爸，使得“them”的指代对象（爸爸和妈妈）成立。因此，上下文逻辑通顺。","knowledge_expansion_md":"**语法知识点：代词与先行词的一致性 (Pronoun-Antecedent Agreement)**\n*   代词（如 he, she, it, they, them）必须在“人称”和“数”（单数/复数）上与其指代的先行词（名词）保持一致。\n*   在本题中，代词 `them` 是复数，所以它指代的对象（先行词）也必须是复数。\n*   “My mother”是单数，无法与 `them` 匹配。填入选项F后，“My mother”和“My father”共同构成了复数先行词，逻辑就通顺了。","socratic_tracks":[{"title":"关键线索“them”","steps":[{"question":"请看空格后面的句子，注意到了代词“them”吗？“them”是单数还是复数？","hint":"“them”意为“他们/她们/它们”。","takeaway":"“them”是复数，指代两个或更多的人或物。"},{"question":"在空格前，我们只知道“妈妈”是一名老师。一个人能用“them”来指代吗？","hint":"一个人应该用 he/him 或 she/her。","takeaway":"不能。所以空格处必须补充信息，告诉我们还有谁也在学校。"},{"question":"哪个选项补充了另一位家庭成员，并且也符合在学校的场景？","hint":"选项F说“我爸爸也是一名老师”。","takeaway":"选项F正好提供了“爸爸”这个信息，这样“them”就可以指代“爸爸和妈妈”了。所以42题选F。"}]}]}},{"number":"43","item_type":"reading","context_note":"","stem":"43. _____","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"A","explanation_md":"此题考查对转折关系连词“But”的理解和运用。前一句话描述“My father and I usually go to school by car”（我和爸爸通常开车去学校）。选项A“But my mother often walks to school.”（但是我妈妈经常走路去学校。）用“But”引出了一个与前面情况不同的对比信息（开车 vs. 走路），使得句子逻辑关系清晰，内容衔接自然。","knowledge_expansion_md":"**连词用法：But**\n*   `But` 是一个并列连词，用于连接两个意思相反或相对的句子、短语或单词，表示转折或对比。\n*   结构：`句子1 + , but + 句子2`\n*   例：`He is rich, but he is not happy.` (他很富有，但他不快乐。)\n*   在本题中，“开车上学”和“走路去学校”是两种不同的出行方式，用 `But` 连接非常合适。","socratic_tracks":[{"title":"寻找对比关系","steps":[{"question":"空格前面的句子描述了一件什么事？","hint":"关于“我和爸爸”如何去学校。","takeaway":"句子说“我和爸爸通常开车去学校”。"},{"question":"我们来看看选项A。它说了什么？","hint":"“But my mother often walks to school.”","takeaway":"选项A说“但是我妈妈经常走路去学校”。"},{"question":"“开车”和“走路”这两种方式之间是什么关系？选项A开头的“But”在这里起什么作用？","hint":"“But”表示“但是”，通常用在意思有转折的地方。","takeaway":"“开车”和“走路”是两种不同的、形成对比的出行方式。“But”正好用来引出这种对比。因此，将选项A放在这里，上下文非常连贯。所以43题选A。"}]}]}},{"number":"44","item_type":"reading","context_note":"","stem":"44. _____","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"B","explanation_md":"此题考查对文章主旨的归纳和总结。空格前的两句话“My father loves my mother and my mother loves my father. My parents love me and I love my parents.”反复描述了家庭成员之间相互的爱。选项B“Family means love.”（家意味着爱。）是对前面具体描述的高度概括和升华，起到了点明主题的作用。因此，这是最佳选项。","knowledge_expansion_md":"**写作技巧：归纳总结**\n在议论或抒情性段落的结尾，常常会用一个简洁有力的句子来总结前文的观点或升华情感。这个句子被称为总结句或主题句。\n*   **具体描述：** My parents love me and I love my parents.\n*   **抽象总结：** Family means love.\n学会识别和运用这种“具体到抽象”的写作模式，有助于更好地理解文章脉络和中心思想。","socratic_tracks":[{"title":"提炼中心思想","steps":[{"question":"请读一下空格前面的两句话。它们在反复说一件什么事？","hint":"“...loves...”, “...love...”","takeaway":"这两句话都在说家庭成员之间互相“爱”着对方。"},{"question":"如果用一个词来概括这两句话的核心，会是哪个词？","hint":"这个词是 l-o-v-e。","takeaway":"核心词是“爱 (love)”。"},{"question":"现在看所有剩下的选项，哪一个选项最好地总结了“家庭”和“爱”之间的关系？","hint":"选项B直接将这两个概念联系了起来。","takeaway":"选项B“Family means love.”（家意味着爱。）完美地总结了前面句子的内容，起到了画龙点睛的作用。所以44题选B。"}]}]}}]},{"section_title":"五、书面表达","section_instruction":"(共25分)","items":[{"number":"6.1","item_type":"writing","context_note":"","stem":"请根据要求写一篇招领启事：\n你的老师 Mr. Li 在 3A 教室里捡到一个书包。书包颜色是绿色的。书包里面有一串钥匙、一本英语笔记本、一个文具盒和一张全家福。照片上面有两个男孩、一位父亲和一位母亲。丢失了的同学请向老师寻找，可拨打电话 8260-7055，或发邮件至 20181109@[模糊]。\n\n**要求：**\n1. 注意审题，写清要点，语句通顺，表达流畅；\n2. 书写工整；\n3. 50-60词左右。","options":{},"answer_area_hint":"作文区域","teaching":{"correct_answer":"Found\nA green schoolbag was found in Classroom 3A by Mr. Li. Inside the bag, there are a set of keys, an English notebook, a pencil case and a family photo of two boys with their parents. Will the owner please come to Mr. Li to claim it? You can reach him by calling 8260-7055 or sending an email to 20181109@[blurred].","explanation_md":"本文是一篇标准的招领启事（Found Notice），旨在帮助失主找回失物。范文结构清晰，开门见山，首先点明了拾获的物品、地点和拾获人。接着，文章详细描述了书包的颜色以及包内物品，这些关键细节有助于失主确认。文中使用了被动语态“A green schoolbag was found...”，这是启事类文体中非常地道和常见的用法，能够突出“物品”本身。结尾部分礼貌地邀请失主前来认领，并清楚提供了电话和邮件两种联系方式。全文信息完整，语言简洁流畅，符合题目所有要求。","knowledge_expansion_md":"### 1. 文体知识：失物招领启事 (Lost & Found Notice)\n- **标题 (Title)**：通常为 “Lost”（遗失）或 “Found”（招领），简洁明了。\n- **核心要素 (Key Elements)**：无论是“失物”还是“招领”，都必须包含以下几点：\n    1.  **物品 (Item)**：丢失或捡到的具体是什么东西。\n    2.  **特征 (Description)**：物品的颜色、品牌、大小等描述性细节。\n    3.  **时间与地点 (Time & Place)**：丢失或捡到的时间和地点。\n    4.  **联系方式 (Contact Information)**：失主或拾主的名字、电话、邮箱等。\n    5.  **（可选）酬谢/核对信息 (Reward/Verification)**：失物启事可提及酬谢（reward），招领启事可要求失主提供更多细节以核实身份。\n- **语言特点**：语言应简洁、客观、信息明确。多使用被动语态（如 `A wallet was lost...`）来强调物品本身。\n\n### 2. 重点语法：被动语态与There be句型\n- **被动语态 (Passive Voice)**：在招领启事中，我们更关心“什么东西被找到了”，而不是“谁找到了它”。因此，使用被动语态 `主语（物品）+ be + 动词过去分词` 可以更好地突出重点。例如：`A green schoolbag was found in Classroom 3A.` 比 `Mr. Li found a green schoolbag...` 更为正式和常见。\n- **There be 句型**：这是描述“某地有某物”最核心的句型，在罗列包内物品时非常实用。例如：`Inside the bag, there is a set of keys, an English notebook...`\n\n### 3. 核心词汇与表达\n- **物品词汇**: `schoolbag` (书包), `a set of keys` (一串钥匙), `notebook` (笔记本), `pencil case` (文具盒), `family photo` (全家福)。\n- **动词**: `find/found` (发现), `lose/lost` (丢失), `leave/left` (留下), `claim` (认领), `contact` (联系), `call` (打电话), `email` (发邮件)。\n- **常用句式**: \n    - `Will the owner please come to...?` (请失主来……好吗？) - 礼貌的请求。\n    - `You can reach me at [phone number].` (你可以通过……联系到我。) - `reach` 比 `contact` 更口语化一些。\n    - `If this is yours, please...` (如果这是你的，请……)","socratic_tracks":[{"title":"启事文体与结构","steps":[{"question":"这篇作文要求我们写什么？它的主要目的是什么？","hint":"想想看，有人丢了东西，有人捡到了，捡到的人想做什么？","takeaway":"这是一篇招领启事，目的是为了找到失主并归还物品。"},{"question":"一篇合格的招领启事，必须包含哪些核心信息？","hint":"参照题目给出的要点，思考一下：捡到了什么？在哪儿捡到的？里面有什么？怎么联系？","takeaway":"招领启事必须清晰说明：拾获物品、拾获地点、物品特征、联系方式这几个要素。"},{"question":"为什么在启事的开头或标题直接点明 \"Found\" 很重要？","hint":"如果你是失主，在众多信息中，什么词能让你一眼就注意到这则消息可能与你有关？","takeaway":"使用 \"Found\" 作为标题或开头，能快速吸引目标读者（失主）的注意力，开门见山，信息高效。"}]},{"title":"核心句型与时态","steps":[{"question":"描述“一个书包被李老师在3A教室捡到”，用主动语态怎么说？用被动语态又该怎么说？","hint":"主动语态是“谁做了什么”，被动语态是“什么被怎么样了”。","takeaway":"主动语态是 \"Mr. Li found a schoolbag in Classroom 3A\"，被动语态是 \"A schoolbag was found in Classroom 3A by Mr. Li\"。"},{"question":"在招领启事中，为什么使用被动语态 \"A schoolbag was found...\" 更常见、更地道？","hint":"想想看，这则启事的“主角”是书包还是李老师？我们更想突出哪个信息？","takeaway":"使用被动语态能将重点放在被找到的“物品”上，这正是失主最关心的信息，使得表达更客观、正式。"},{"question":"描述书包里的物品时，我们用什么句型？比如“里面有一串钥匙、一本笔记本……”","hint":"英语中表示“某地有某物”最常用的句型是什么？","takeaway":"描述存在时，我们常用 \"There is/are...\" 句型，或者用介词短语开头，如 \"Inside the bag, there are...\"。"}]},{"title":"词汇与细节表达","steps":[{"question":"题目中“一串钥匙”用英语怎么说？“全家福”呢？","hint":"“一串”可以用 `a set of` 或 `a bunch of` 来表达。“全家福”就是家庭的照片。","takeaway":"“一串钥匙”是 `a set of keys`，“全家福”是 `a family photo`。"},{"question":"如何礼貌地请失主来认领？除了 \"Please come to Mr. Li\"，还有没有更委婉或完整的说法？","hint":"我们可以用一个问句来表达建议，比如 \"Will the owner please...\"。动词“认领”用哪个词？","takeaway":"可以用 \"Will the owner please come to Mr. Li to claim it/get it back?\" 这样的句式，显得更礼貌、完整。"},{"question":"描述联系方式时，如何表达“可以打电话或发邮件”？","hint":"“联系”可以用 `contact`，“通过打电话”是 `by calling`，“通过发邮件”是 `by emailing`。","takeaway":"可以说 \"The owner can contact Mr. Li by calling ... or emailing ...\", 或者更直接地说 \"You can call him at ... or email him at ...\"。"}]}]}}]}],"content_markdown":"## 成都某实验外国语学校 初2024级新初一分班(奖学金)真卷英语\n\n**满分:100分**\n**时间:60分钟**\n\n### 一、选择填空\n(共15分)\n\n**A) 从A、B、C、D四个选项中选出与下列各句中画线部分意思相同或相近，并能替换画线部分的选项。(共4分)**\n\n1. ( ) This girl is my \u003cu>aunt's daughter\u003c/u>.\n\tA. How about\n\tB. Her books\n\tC. helping me\n\tD. cousin\n2. ( ) These green books on the table are \u003cu>hers\u003c/u>.\n\tA. How about\n\tB. Her books\n\tC. helping me\n\tD. cousin\n3. ( ) Thank you very much for \u003cu>your help\u003c/u>.\n\tA. How about\n\tB. Her books\n\tC. helping me\n\tD. cousin\n4. ( ) \u003cu>What about\u003c/u> these pens? Are they Andy's, too?\n\tA. How about\n\tB. Her books\n\tC. helping me\n\tD. cousin\n\n**B) 从各题的A、B、C三个选项中选出正确答案。(共11分)**\n\n5. ( ) I have a book. _____ book is in the bookcase.\n\tA. A\n\tB. An\n\tC. The\n6. ( ) —Welcome to my family, _____?\n—My father Jack and my mother Tracy.\n\tA. This is\n\tB. He is\n\tC. These are\n7. ( ) —Excuse me, _____?\n—They are on the tape player.\n\tA. where are the tapes?\n\tB. Where are the tapes?\n\tC. How are the tapes?\n8. ( ) —Are these pens your sister's?\n—No, _____ aren't. They are _____ sister's.\n\tA. they; Lily\n\tB. they; Lily's\n\tC. these; Lily\n9. ( ) —Tina, _____\n—G-R-E-E-N.\n\tA. what's your first name?\n\tB. what's that in English?\n\tC. spell \"green\", please.\n10. ( ) —_____?\n—They are my sisters.\n\tA. How are they\n\tB. Who are they\n\tC. What are they\n11. ( ) —_____ is your jacket?\n—It's black.\n\tA. What\n\tB. What color\n\tC. What's color\n12. ( ) This is a picture _____ my family.\n\tA. of\n\tB. in\n\tC. at\n13. ( ) Here _____ my pencils and my pens. They are _____ my schoolbag.\n\tA. is; on\n\tB. are; in\n\tC. be; under\n14. ( ) —Is this your mother's?\n—Yes, _____ is.\n\tA. she\n\tB. it\n\tC. Some\n15. ( ) —Is your father your _____?\n—Yes, he is.\n\tA. aunt\n\tB. uncle\n\tC. grandfather\n\n### II. 完形填空\n(根据短文内容,从A、B、C三个选项中选出可以填入空白处的最佳答案。(共20分))\n\nHello! Everyone. My name is Bill Green. I'm an __16__ boy, and I'm 12 years old. I am from Kentucky. Now I am __17__ No. 7 SHIYAN Middle School. Bill is my first name and Green is my __18__ name. This is my __19__ ID card. The number is 20180101. This is my brother. __20__ name is Tim. Now he and I __21__ in Chenghua with my parents. I have a nice __22__! All my school things are in it. Look! These are two __23__ in it. One is __24__ and the other one is Tim's. I can't see my name on the dictionary. I lost my eraser. If you find it, please call me __25__ 351-9668.\n\n16. ( ) A. Chinese B. American C. school\n17. ( ) A. to B. with C. in\n18. ( ) A. family B. fall C. first\n19. ( ) A. school B. phone C. family\n20. ( ) A. Her B. He's C. His\n21. ( ) A. am B. is C. are\n22. ( ) A. schoolbag B. pencil box C. watch\n23. ( ) A. erasers B. dictionaries C. watches\n24. ( ) A. His B. hers C. mine\n25. ( ) A. with B. at C. for\n\n### 三、阅读理解\n(共30分)\n\n**A**\n阅读下面短文，根据短文内容判断句子的正误，正确的写“T”，错误的写“F”。\n\nJerry White is a boy. He is nine years old. He is in Class Three, Grade Two. This is his dog. I don't know its name. I think it is three years old. That is his schoolbag. You can see a pencil, a math book, two Chinese textbooks and an English-Chinese dictionary in it. His good friend is David. David is an English boy. He is nine, too.\n\n26. Jerry White is a girl. ( )\n27. Jerry White is in Class One, Grade Two. ( )\n28. Jerry White's dog's name is Mimi. ( )\n29. You can't see a ball in Jerry White's schoolbag. ( )\n30. David is nine years old. ( )\n\n**B**\n根据表格内容选择。\n\n**Personal Information**\n\n| | | | |\n| :--- | :--- | :--- | :--- |\n| **Name** | Jim Allen Green | **Sex** | Male |\n| **Chinese Name** | Feili | **Nationality** | English |\n| **Student Number** | 201807051 | **Class** | Two | **Grade** | Seven |\n| **Phone** | 8260-7213 | **Type of Blood** | O |\n| **Address** | No. 281 Guanghua Avenue | | |\n| **Name of School** | No. 7 Middle School | | |\n| **Post Code** | CD610031 | | |\n| **E-mail Address** | Feili@163.com | | |\n\n31. ( ) Jim is a(n) _____.\n\tA. Chinese\n\tB. English\n\tC. American\n32. ( ) _____ is Jim's Chinese name.\n\tA. Allen\n\tB. Guanghua\n\tC. Feili\n33. ( ) His telephone number is _____.\n\tA. 8260-7213\n\tB. 201807051\n\tC. CD 610031\n34. ( ) Jim is _____.\n\tA. a boy\n\tB. Guanghua\n\tC. in Class 2, Grade 8\n35. ( ) Which one is wrong?\n\tA. We can e-mail Jim at Feili@163.com.\n\   /** 卷面/PDF 题干：语音题、词汇填空、或题干含 &lt;u&gt; 画线词 */
  function stemHasUnderlineMarkup(stem) {

  /** 大题说明 A. / B. 分项（如 set_27 选择填空 1–4 / 5–15） */

  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));

  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {

  function rowsForPaperShard(t) {

  }
  function parseSectionShardIndex(t) {

  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */

  /**
   * 阅读材料中嵌入「真卷」复杂表格：JSON 内用 [[HTML_TABLE]]...[[/HTML_TABLE]] 包裹，
   * 仅允许不含 script 的 table 片段（试卷数据可信源）。
   */
  function splitReadingPassageByTrustedHtmlTables(raw) {
    const s = String(raw || "");
    const re = /\[\[HTML_TABLE\]\]([\s\S]*?)\[\[\/HTML_TABLE\]\]/g;
    const out = [];
    let last = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) out.push({ kind: "text", body: s.slice(last, m.index) });
      out.push({ kind: "html", body: m[1].trim() });
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push({ kind: "text", body: s.slice(last) });
    if (!out.length) out.push({ kind: "text", body: s });
    return out;
  }

  function sanitizeTrustedReadingTableHtml(fragment) {
    const h = String(fragment || "").trim();

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干 / 阅读材料中的表格） */
