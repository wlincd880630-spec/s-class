t": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查描述天气的形容词词义辨析。四个选项都与温度有关：A. warm (温暖的), B. hot (炎热的), C. cool (凉爽的), D. cold (寒冷的)。在描述天气时，这些词带有不同的感情色彩和温度等级。`warm` 通常指舒适的、令人愉悦的温暖，常用来描述春天或晴朗的秋日。`hot` 和 `cold` 程度较深，有时带有不适感。`cool` 指凉爽，也常是褒义。根据上下文推断，文章若在描述一个宜人的场景（如春游、散步），`warm` 是最贴切的选择，表达了阳光和煦、温度适宜的积极感受。", "knowledge_expansion_md": "### 温度形容词辨析\n\n`hot`, `warm`, `cool`, `cold` 是描述温度的四个核心词汇，理解它们的细微差别很重要。\n\n1.  **温度等级 (从高到低)**: `hot` > `warm` > `cool` > `cold`\n\n2.  **感情色彩与语境**:\n    *   **`hot` (炎热的)**: 通常指非常高的温度，常常让人感到不适。例如：`It's too hot to play outside in summer afternoon.` (夏天下午太热了，不适合在外面玩。)\n    *   **`warm` (温暖的)**: 通常是褒义词，指舒适、宜人的温度，不冷也不热。常与阳光、春天、壁炉等联系在一起。例如：`What a warm spring day!` (多么温暖的春日！)\n    *   **`cool` (凉爽的)**: 通常也是褒义词，指在炎热天气中令人感到清爽、舒适的微凉。常用于描述秋天、夏日清晨或树荫下。例如：`It's cool under the tree.` (树下很凉爽。)\n    *   **`cold` (寒冷的)**: 指非常低的温度，让人感到寒冷不适。常用于描述冬天或冰冷的物体。例如：`Don't drink cold water.` (别喝冰水。)\n\n**易错点**: `warm` 和 `cool` 都可以是褒义的，选择哪个取决于语境。如果语境偏向于阳光、春意，多用 `warm`；如果语境偏向于秋意、微风，多用 `cool`。", "socratic_tracks": [{"title": "形容词词义辨析", "steps": [{"question": "请用中文说出 hot, warm, cool, cold 这四个词的意思。", "hint": "它们都和温度有关，但程度不同。", "takeaway": "hot是炎热，warm是温暖，cool是凉爽，cold是寒冷。"}, {"question": "如果我想描述一个让人感觉很舒服的晴天，用哪个词最能表达“不冷不热刚刚好”的感觉？", "hint": "“炎热”和“寒冷”通常都有些极端。", "takeaway": "`warm` (温暖的) 最常用来描述这种舒适、宜人的天气。"}]}, {"title": "联系生活常识", "steps": [{"question": "你能把这四个词按照温度从高到低排个序吗？", "hint": "夏天最热，冬天最冷。", "takeaway": "温度从高到低的顺序是：hot -> warm -> cool -> cold。"}, {"question": "春夏秋冬四个季节，通常分别对应哪个或哪些词？", "hint": "Spring is ___. Summer is ___. Autumn is ___. Winter is ___.", "takeaway": "通常，夏天(summer)对应hot，春天(spring)对应warm，秋天(autumn)对应cool，冬天(winter)对应cold。这有助于我们在语境中选择恰当的词。"}]}, {"title": "根据语境推断", "steps": [{"question": "如果文章前面提到了 \"The sun was shining brightly.\" (阳光明媚)，你觉得天气更可能是 warm 还是 cool？", "hint": "阳光会带来热量。", "takeaway": "阳光明媚的语境更支持使用 `warm` 来描述天气。"}, {"question": "“hot”和“warm”都表示热，但有什么区别？为什么这里选“warm”可能比“hot”更好？", "hint": "一个词表示“刚刚好”，另一个词可能表示“太多了”。", "takeaway": "`hot` 常带有“太热”的负面含义，而 `warm` 通常是积极的，表示舒适，因此在描述宜人天气时更佳。"}]}]}}, {"number": "20", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "looked", "B": "saw", "C": "cleaned", "D": "put"}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题考查一组易混淆动词的辨析。A `looked` (看，强调动作), B `saw` (看见，强调结果), C `cleaned` (打扫), D `put` (放置)。选项 C 和 D 与“看”的意义无关，可以首先排除。`looked` 和 `saw` 的区别在于：`looked` 是有意识地“看”这个动作，常与介词 `at` 连用（look at...）；而 `saw` 是 `see` 的过去式，指“看见”这个结果，即事物映入眼帘。在记叙文中，描述“我（突然）看到了什么”时，通常用 `saw`。因此，`saw` 是最佳答案。", "knowledge_expansion_md": "### 辨析 `see`, `look`, `watch`\n\n这三个动词都与“看”有关，但用法和含义有明显区别，是小升初阶段的重要考点。\n\n*   **`see` (看见)**: 强调“看”的结果，指事物进入视线范围被眼睛捕捉到，常为无意识或偶然的动作。它的过去式是 `saw`。\n    *   例如: `I opened the curtains and saw a beautiful bird.` (我拉开窗帘，看到了一只美丽的鸟。)\n    *   `see` 还可以表示“理解”、“明白”，如 `I see.` (我明白了。)\n\n*   **`look` (看，瞧)**: 强调“看”这个有意识的动作，指把目光投向某个方向。它通常是不及物动词，后面跟宾语时需要借助介词，最常见的是 `at`。\n    *   例如: `Look at the blackboard!` (看黑板！)\n    *   还有很多常用短语，如 `look for` (寻找), `look after` (照顾)。\n\n*   **`watch` (观看，注视)**: 指在一段时间内，聚精会神地观看移动或变化的东西。宾语通常是电视、电影、比赛、表演等。\n    *   例如: `We watched a football match last night.` (我们昨晚看了一场足球赛。)", "socratic_tracks": [{"title": "辨析 \"look\" 与 \"see\"", "steps": [{"question": "“我看了黑板”和“我看见了黑板上的字”，这两个“看”在意思上有什么不同？", "hint": "一个是发出一个动作，另一个是得到了一个结果。", "takeaway": "“看”是一个有意识的动作，而“看见”是看这个动作产生的结果。"}, {"question": "在英语中，哪个词表示“看”的动作，哪个词表示“看见”的结果？", "hint": "一个是 `look`，一个是 `see`。", "takeaway": "`look` 强调动作，`see` 强调结果。"}, {"question": "如果一个句子想表达“我突然注意到/眼睛里映入了什么东西”，应该用 `look` 还是 `see` 的过去式？", "hint": "这是在描述一个结果，而不是一个持续的动作。", "takeaway": "描述“看见”这个结果时，应该使用 `see` 的过去式 `saw`。"}]}, {"title": "动词与介词搭配", "steps": [{"question": "动词 `look` 后面如果想跟一个宾语，比如“看那个男孩”，应该怎么说？", "hint": "Look ___ that boy.", "takeaway": "`look` 后面通常需要加介词 `at` 才能跟宾语，即 `look at something/somebody`。"}, {"question": "那么 `see` 后面需要加介词吗？比如“我看见一个男孩”。", "hint": "I saw ___ a boy.", "takeaway": "`see` 是及物动词，可以直接跟宾语，不需要介词，即 `see something/somebody`。"}]}, {"title": "排除无关选项", "steps": [{"question": "我们来看看 C 选项 `cleaned` 和 D 选项 `put`。它们的中文意思是什么？", "hint": "`clean` the room, `put` the book on the desk.", "takeaway": "`cleaned` 的意思是“打扫”，`put` 的意思是“放置”。"}, {"question": "这两个词的意思和“看”或“看见”有关吗？", "hint": "打扫、放置和看是完全不同的动作。", "takeaway": "根据基本词义，可以快速排除与上下文逻辑不符的 `cleaned` 和 `put`。"}]}]}}, {"number": "21", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "up", "B": "back", "C": "off", "D": "around"}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题考查动词短语的辨析。根据上下文，弟弟忘了带外套，妈妈建议爸爸回家去取。这里的动作是“返回”到家里，因此使用“go back”，意为“回去”。选项A“up”（向上）、C“off”（离开）、D“around”（四处）均不符合“回家”这一语境的逻辑。因此，正确答案是B。", "knowledge_expansion_md": "本题的核心是考查与动词 `go` 搭配的常用短语。\n- `go back`: 返回，回去。例如：`It's late, we should go back.`\n- `go up`: 上升，上涨。例如：`The price of gas is going up.`\n- `go off`: （闹钟）响起；爆炸；（食物）变质。例如：`My alarm clock went off at 6 a.m.`\n- `go around`: 四处走动，绕行。例如：`Let's go around the lake.`\n- `go on`: 继续。例如：`Please go on with your story.`\n在小升初阶段，掌握这些由常见动词和介词/副词构成的动词短语至关重要。", "socratic_tracks": [{"title": "动词短语辨析", "steps": [{"question": "根据故事情节，弟弟忘了带外套，妈妈让爸爸去“家(home)”里拿。你认为爸爸的动作方向应该是怎样的？", "hint": "他是要从现在的地方，回到他们出发的地方——家。", "takeaway": "动词短语“go back”表示“返回”，完全符合“回家取物”的语境。"}, {"question": "我们来试试其他选项。如果用 go up home, go off home, go around home，句子意思通顺吗？", "hint": "go up 是“上升”，go off 是“离开”，go around 是“环绕”。把这些意思代入“回家”这个场景看看。", "takeaway": "通过代入法可以发现，其他选项都会造成句意不通或逻辑混乱。"}]}, {"title": "上下文逻辑推理", "steps": [{"question": "文章前面提出了一个什么问题？", "hint": "想想弟弟遇到了什么麻烦。", "takeaway": "文章的问题是“弟弟忘了外套，感觉冷”。"}, {"question": "为了解决这个问题，家人提出的第一个建议是什么？", "hint": "妈妈对爸爸说了什么？", "takeaway": "妈妈建议爸爸回家去拿外套。"}, {"question": "那么，哪个选项最能表达“回家”这个动作呢？", "hint": "哪个词有“返回”的意思？", "takeaway": "在所有选项中，只有“back”与“go”结合能准确表达“返回”的含义。"}]}, {"title": "关键词“home”的用法", "steps": [{"question": "我们常说“go to school”，为什么这里说“go back home”而不是“go back to home”？", "hint": "想一想“home”这个词在这里是什么词性？", "takeaway": "当“home”作“家”并与表示方向的动词（如go, come, get, return）连用时，它作副词，前面不加介词to。"}, {"question": "如果我想说“回到他的家”，应该怎么说？", "hint": "当 home 前面有物主代词（如 my, his）或名词所有格（如 Tom's）修饰时，它就变成了名词。", "takeaway": "当 home 作名词时，前面需要介词，例如：go back to his home。"}]}]}}, {"number": "22", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "him", "B": "us", "C": "her", "D": "me"}, "answer_area_hint": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查人称代词宾格的用法。空格位于介词“for”之后，需要使用人称代词的宾格形式。根据上文“My little brother forgot his coat”，可知拿外套是“为他（弟弟）”拿。指代“my little brother”（第三人称单数男性）的宾格代词是“him”。选项B“us”（我们）、C“her”（她）、D“me”（我）在人称、性别或数上均与指代对象不符。", "knowledge_expansion_md": "人称代词有主格和宾格之分。\n- **主格**作主语，通常位于句首：I, you, he, she, it, we, they。\n- **宾格**作宾语，通常位于动词或介词之后：me, you, him, her, it, us, them。\n解题时，首先要判断句子成分，确定需要主格还是宾格；其次要根据上下文找到代词指代的对象，确定正确的人称、性别和数。例如，本题中介词`for`后面必须跟宾格，而指代的对象是`my little brother`，所以选择`him`。", "socratic_tracks": [{"title": "人称代词宾格", "steps": [{"question": "这个空格位于介词 for 的后面，从语法上说，应该填入什么形式的代词？", "hint": "想一想，我们说“给我”是 for I 还是 for me？", "takeaway": "介词后面必须使用人称代词的宾格形式。"}, {"question": "这个代词在句子里指代的是谁？", "hint": "回顾一下上文，是谁忘了带外套？", "takeaway": "这个代词指代的是上文提到的“my little brother”。"}, {"question": "那么，用来指代“my little brother”的宾格代词是哪一个？", "hint": "“弟弟”是男性、单数、第三方。", "takeaway": "指代第三人称、单数、男性的宾格代词是 him。"}]}, {"title": "指代关系判断", "steps": [{"question": "句子“...to get it for ( )”中的“it”指代什么？", "hint": "爸爸要回去拿什么东西？", "takeaway": "句中的“it”指代上文提到的“his coat”（他的外套）。"}, {"question": "那么“for ( )”中的这个空格，应该是指谁？", "hint": "外套是为谁拿的？", "takeaway": "空格处的人称代词指代的是外套的主人，也就是“my little brother”。"}]}, {"title": "排除法应用", "steps": [{"question": "为什么不能选 B (us)？", "hint": "“us”是“我们”，是几个人？而忘记外套的是几个人？", "takeaway": "“us”是复数，但只有弟弟一个人忘了外套，所以不匹配。"}, {"question": "为什么不能选 C (her)？", "hint": "“her”指代的是男性还是女性？“brother”是男性还是女性？", "takeaway": "“her”指代女性，但“brother”是男性，性别不匹配。"}, {"question": "为什么不能选 D (me)？", "hint": "“me”指代的是谁？故事是谁在讲述？忘记外套的是讲述者本人吗？", "takeaway": "“me”指代第一人称“我”，但忘记外套的是“我弟弟”，人称不匹配。"}]}]}}, {"number": "23", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "help", "B": "hamburgers", "C": "cakes", "D": "coats"}, "answer_area_hint": "", "teaching": {"correct_answer": "D", "explanation_md": "本题考查名词词义辨析及上下文逻辑。文章的核心问题是弟弟因为没带外套而感到寒冷。家人去商店的目的是为了解决这个问题。分析四个选项：A“help”（帮助）是抽象名词，不能被“buy”（购买）；B“hamburgers”（汉堡）和C“cakes”（蛋糕）是食物，虽然能提供热量，但不能直接解决缺少衣物的问题。D“coats”（外套）是衣物，直接对应了“forgot his coat”的问题。因此，买新外套是当下最合乎逻辑的选择。", "knowledge_expansion_md": "完形填空题中，名词的选择往往依赖于对故事情节和逻辑的深刻理解。\n1.  **上下文线索**：文章前面提到“forgot his coat”，后面需要解决“cold”的问题，这里的“coats”是强关联词。\n2.  **常识判断**：根据生活常识，天冷没有外套，最直接的解决办法就是穿上或买一件外套。\n3.  **词性辨析**：`help`是抽象名词（有时是不可数名词），通常不说`buy a help`。而`hamburgers`, `cakes`, `coats`都是可数名词，语法上都可以被`buy`，但只有`coats`符合逻辑。\n做这类题时，要将自己代入情境，思考“如果是我，我会怎么做”，利用常识辅助判断。", "socratic_tracks": [{"title": "上下文与生活常识", "steps": [{"question": "我们再回顾一下，故事里人物遇到的主要困难是什么？", "hint": "弟弟为什么不舒服？", "takeaway": "故事的核心问题是弟弟忘了带外套，感到很冷。"}, {"question": "既然爸爸不想回家拿，他们又去了商店，那么去商店最合理的目的是什么？", "hint": "怎样才能最快地让弟弟不冷？", "takeaway": "去商店的目的是买东西来解决“冷”的问题。"}, {"question": "看看四个选项，汉堡、蛋糕、外套，哪个最能直接解决“冷”的问题？", "hint": "吃东西能让你立刻不冷，还是穿上衣服更直接？", "takeaway": "结合生活常识，买“外套（coats）”是解决寒冷问题的最直接、最合理的方法。"}]}, {"title": "逻辑链条分析", "steps": [{"question": "故事的逻辑是：发现问题 → 尝试解决（方案一）→ 方案一失败 → 尝试解决（方案二）。你能把故事内容填进去吗？", "hint": "问题是“冷”，方案一是“回家拿”，方案二是“去商店买”。", "takeaway": "故事的逻辑链是：弟弟冷 → 爸爸不想回家拿外套 → 去商店买东西解决问题。"}, {"question": "既然要去商店“买”东西来解决“冷”和“没有外套”的问题，那么买什么才是对症下药呢？", "hint": "缺什么，就补什么。", "takeaway": "因为缺少“外套”，所以最符合逻辑的购买物品就是“外套”。"}]}, {"title": "名词词义与搭配", "steps": [{"question": "我们看动词“buy”（购买），它后面可以跟哪些类型的名词？", "hint": "我们能“购买”一个“帮助”吗？", "takeaway": "动词“buy”后面通常跟具体、可购买的物品，而“help”（帮助）是抽象概念，不搭配。"}, {"question": "剩下的三个选项都是具体物品，为什么“hamburgers”和“cakes”在这里不合适？", "hint": "虽然汉堡和蛋糕也能提供热量，但它们是故事的主要矛盾吗？", "takeaway": "食物虽然能提供一些温暖，但不能解决根本问题——缺少蔽体的衣物，因此在逻辑上不如“外套”贴切。"}]}]}}, {"number": "24", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "first", "B": "end", "C": "last", "D": "problem"}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题考查固定短语和叙事逻辑。空格出现在“In the ( )”这个结构中，后面紧跟的句子描述了问题的最终解决方案（弟弟穿了我的夹克，我穿了爸爸的）。“In the end”是一个固定搭配，意为“最后，最终”，常用于引出故事或事件的结局，完全符合此处的语境。选项A“first”常用于“at first”（起初），与结局的语境相反。选项C“last”常用于“at last”（终于），虽意近但“In the end”更侧重客观陈述结局。选项D“problem”（问题）无法与“In the”构成通顺的短语。", "knowledge_expansion_md": "在英语叙事中，表示时间顺序和总结的短语非常重要。\n- `In the end`: 意为“最终，到头来”，用于描述一系列事件之后的最终结果，侧重于结果本身。例：`We worked hard, and in the end, we succeeded.`\n- `At the end of...`: 意为“在...的末尾”，后面必须跟名词。例：`at the end of the month` (在月底)。\n- `At last`: 意为“终于”，通常带有感情色彩，暗示经过了漫长的等待或困难。例：`At last, the rain stopped.`\n- `At first`: 意为“起初，首先”，常与`but`, `later`等连用，表示前后的转折或对比。例：`At first I didn't like him, but now we are good friends.`\n理解这些短语的细微差别和用法是提高英语表达地道性的关键。", "socratic_tracks": [{"title": "固定搭配辨析", "steps": [{"question": "你见过“In the ...”这样开头的短语吗？它通常用来表达什么意思？", "hint": "想一想故事书的结尾经常怎么说？“最后……”", "takeaway": "“In the end”是一个非常常见的固定搭配，意思是“最后，最终”。"}, {"question": "这句话“我弟弟穿了我的夹克，我穿了我爸爸的”是在描述故事的开头、中间还是结尾？", "hint": "这是不是他们解决问题的最终方法？", "takeaway": "这句话描述了问题的最终解决方案，是故事的结局部分。"}, {"question": "那么，用来引出故事结局的固定短语“In the end”是不是最合适的选择？", "hint": "将 end 放入空格，读一下整个句子，看看是否通顺。", "takeaway": "使用“In the end”来引出最终结果，完全符合语法和叙事逻辑。"}]}, {"title": "相似短语辨析", "steps": [{"question": "选项 C 的“last”也可以表示“最后”，比如短语“at last”。它和“in the end”有什么区别吗？", "hint": "想象一下，你等公交车等了很久，车终于来了，你会说“In the end, the bus came”还是“At last, the bus came”？", "takeaway": "“At last”带有“终于”的感情色彩，强调经过了困难或漫长的等待；而“In the end”更中性，只是客观陈述结果。"}, {"question": "在这个故事里，用“At last”合适吗？", "hint": "故事里有强调他们想办法想了很久、很困难吗？", "takeaway": "虽然也可以，但“In the end”作为对一个解决方案的客观陈述，在这里更为常见和贴切。"}]}, {"title": "叙事结构分析", "steps": [{"question": "一个完整的故事通常包含哪些部分？", "hint": "比如：起因、经过、结果。", "takeaway": "一个故事通常有开头（beginning/start）、发展（development）和结局（end/conclusion）。"}, {"question": "我们用一些标志词来表示这些部分，比如用“At first”表示开头。那么用什么词来表示结局呢？", "hint": "结局的英文单词是什么？", "takeaway": "表示结局的关键词就是“end”，因此短语“In the end”常被用作引出结局的标志。"}]}]}}, {"number": "25", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "at", "B": "after", "C": "before", "D": "on"}, "answer_area_hint": "", "teaching": {"correct_answer": "C", "explanation_md": "此题考查介词在具体语境中的运用。根据生活常识，讲究卫生的好习惯是“饭前洗手”。句子“We must wash our hands ___ meals”意为“我们必须在饭前洗手”。选项 A “at”表示在某个时间点或小地方；B “after”表示“在...之后”；C “before”表示“在...之前”；D “on”表示在某物表面或具体某一天。因此，只有“before”符合句意和逻辑，表示动作发生的先后顺序。", "knowledge_expansion_md": "本题涉及四个常用介词的辨析：\n\n*   **before (在...之前)**: 表示时间或顺序上的“先”。例：`Finish your homework before dinner.` (晚饭前完成作业。)\n*   **after (在...之后)**: 表示时间或顺序上的“后”。例：`Let's go for a walk after dinner.` (我们晚饭后去散步吧。)\n*   **at (在...)**: 用于表示具体的时间点（如 `at 8 o'clock`）、较小的地点（如 `at the bus stop`）或某种状态/活动（如 `at work`）。\n*   **on (在...)**: 用于表示在某物的表面上（如 `on the desk`）、具体的某一天或日期（如 `on Monday`, `on May 1st`）。\n\n**易错点**：学生容易混淆 `before` 和 `after` 的逻辑顺序，或误用 `at`/`on` 来表示时间段。做题时，务必理解整个句子的逻辑关系。", "socratic_tracks": [{"title": "时间介词辨析", "steps": [{"question": "选项中的 'before' 和 'after' 都与时间顺序有关，它们的意思有什么不同？", "hint": "想一想 'before' 是先还是后，'after' 是先还是后？", "takeaway": "'before' 指一个动作在另一个动作之前发生，'after' 则指在其后发生。"}, {"question": "结合生活常识，想一想“吃饭”(meals) 和“洗手”(wash our hands) 这两个动作，哪个应该先发生才更合理？", "hint": "为了保持健康和卫生，我们应该在接触食物之前做什么？", "takeaway": "从健康角度出发，我们应该先洗手，再吃饭。"}, {"question": "那么，为了表达“在吃饭‘之前’洗手”这个意思，我们应该选择哪个介词？", "hint": "哪个词是“在...之前”的意思？", "takeaway": "选择 'before' 才能正确表达“饭前洗手”的逻辑顺序。"}]}, {"title": "地点与时间介词的区分", "steps": [{"question": "选项中的 'at' 和 'on' 也可以表示时间，它们通常用在什么样的时间表达前面？", "hint": "想一想“在8点钟”和“在星期一”分别用哪个介词？", "takeaway": "'at' 用于具体时刻，而 'on' 用于具体日期或星期几。"}, {"question": "这道题的横线后面是 'meals'（饭食），它是一个具体的时间点或日期吗？", "hint": "'meals' 指的是一个活动，而不是像 '8 o'clock' 或 'Monday' 那样的精确时间。", "takeaway": "'meals' 不是一个具体的时间点或日期，因此用 'at' 或 'on' 在这里不合适。"}]}, {"title": "完形填空的解题策略", "steps": [{"question": "做完形填空题时，如果只看空格前后几个词，足够吗？还需要考虑什么？", "hint": "除了语法，文章的整体意思、上下文逻辑和生活常识是否重要？", "takeaway": "完形填空不仅考查语法和词汇，更考查在语境中的逻辑推理能力。"}, {"question": "这道题是如何将介词知识和生活常识结合起来考查我们的？", "hint": "题目设置了一个与日常生活（讲卫生）相关的情景。", "takeaway": "通过一个生活场景，题目要求我们运用常识判断动作的先后顺序，并选择正确的介词来表达。"}]}]}}]}, {"section_title": "V. 阅读选择。(共10分)", "section_instruction": "**A**\n\nWhat do you think is the most useful in our life?\nAlice: I think the mobile phone is the most useful. We can talk to people far away from us. And we can send messages, take photos and do many other things with the mobile phone. My father bought one for me when I was eleven. I use it every day.\nJenny: There are many useful things—the train, the car, the plane... but I think the most useful thing is the air conditioner. I live in Hong Kong. It's very hot in summer here. If we don't have air conditioners, we can't work or study. A lot of people will be ill if they don't use them.\nKitty: The Internet is the most useful. My parents have a clothes shop in Shanghai. We have a website (网站). Now, people from all over the world can buy our clothes on our website. We often send e-mails on the Internet. It's fast. And that's cheaper than(比……便宜) using the mobile phone.\nSam: I also think the Internet is useful. But I think electricity is the most useful. Many things work with electricity.\n\n**B**\n\n| Club | Age | Time | Learn | Place |\n| :--- | :--- | :--- | :--- | :--- |\n| English Club | Grades(年级) 3-4 | 3:00 p.m. - 3:50 p.m. Friday | Read English books. Talk with foreigners. | Library |\n| Singing Club | Grades 1-2 | 8:00 a.m. - 10:00 a.m. Saturday | Listen to music. Sing different songs. | Music Room |\n| Science Club | Grades 4-6 | 3:00 p.m. - 4:00 p.m. Thursday | Do experiments(实验). Watch insects. | Science Room |\n| Computer Club | Grade 6 | 3:30 p.m. - 4:30 p.m. Wednesday | Program(编程). Play computer games. | Computer Room |", "items": [{"number": "26", "item_type": "reading", "context_note": "Passage A", "stem": "( ) Who thinks the mobile phone is the most useful?", "options": {"A": "Sam.", "B": "Jenny.", "C": "Alice.", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "这是一道细节理解题，旨在寻找对特定事物持有最强烈观点的角色。题目问“谁认为手机最有用？”。通过阅读文章，我们可以对比三个人的观点。Sam 认为手机还行，但他更喜欢看书。Alice 承认手机有用，但也认为它会分散注意力。只有 Jenny 的态度最为极端和肯定，她用了“my life!”（我的生命！）、“can't live without it”（没有它就活不下去）、“use it for everything”（用它做所有事）等夸张的表述。这些强烈的用词表明她认为手机是“最有用”的。", "knowledge_expansion_md": "本题考查阅读理解中的**观点态度判断**和**关键信息定位**能力。\n\n1.  **观点态度判断**：在阅读中，要学会通过人物的用词来判断其态度是积极 (positive)、消极 (negative) 还是中立 (neutral)。例如，`my life`, `the best`, `wonderful` 等词表达强烈的积极态度；而 `a distraction`, `terrible`, `waste of time` 等则表达消极态度。\n\n2.  **关键信息定位**：题目中的关键词是 `the most useful`（最有用）。这是一个最高级形式，要求我们在多个对象中找出一个最突出的。解题时，应带着这个关键词回到原文，寻找能够体现“最”这个程度的描述。Jenny 使用的 `everything` 和 `can't live without` 等绝对化的词语，恰好对应了题目的“最”。", "socratic_tracks": [{"title": "寻找关键词句", "steps": [{"question": "题目问的是“谁认为手机最有用？”。我们应该在文章中寻找什么样的词语来帮助判断？", "hint": "寻找那些表达强烈感情、绝对化或最高级的词，比如“最好的”、“一切”、“不能没有”等。", "takeaway": "要特别关注表达说话人强烈情感和极端观点的词句。"}, {"question": "请在文中找出 Sam, Jenny, 和 Alice 各自描述手机的关键句子。", "hint": "Sam: 'I prefer reading books.' Jenny: 'my life!', 'can't live without my phone.' Alice: 'a big distraction.'", "takeaway": "通过定位关键句，可以快速把握每个人的核心观点。"}, {"question": "对比这三人的关键句，谁的描述最符合“最有用”这个标准？", "hint": "谁的用词最夸张、最绝对？", "takeaway": "Jenny 使用了一系列最强烈的词语，因此她是认为手机最有用的人。"}]}, {"title": "理解人物观点与态度", "steps": [{"question": "Sam 对手机的整体态度是怎样的？是完全肯定吗？", "hint": "他说“更喜欢看书” (prefer reading books)，这说明手机在他心中不是第一位的。", "takeaway": "Sam 的态度比较中立，甚至对书本有偏爱，因此他不是认为手机“最”有用的人。"}, {"question": "Alice 对手机的看法是怎样的？她只看到了优点吗？", "hint": "她提到了手机的用处，但也明确指出了它是一个 'big distraction'（很大的干扰）。", "takeaway": "Alice 的观点是辩证的，看到了手机的利弊，所以她也不是认为手机“最”有用的人。"}, {"question": "Jenny 的观点呢？她提到了手机的任何缺点吗？", "hint": "她只说了手机的好处，甚至说手机就是她的“生命”。", "takeaway": "Jenny 的观点是完全积极且绝对的，这让她成为本题的最佳答案。"}]}, {"title": "比较级与最高级", "steps": [{"question": "题目中的 'the most useful' 是形容词的什么级？它在题目中起什么作用？", "hint": "useful - more useful - the most useful。这是最高级。", "takeaway": "形容词最高级 'the most useful' 是解题的关键，它要求我们寻找观点最极端的那个人。"}, {"question": "如果题目改成 'Who thinks the mobile phone is a distraction?'（谁认为手机会让人分心？），答案会是谁？", "hint": "在文中找到 'distraction' 这个词。", "takeaway": "理解题干中的具体要求，是准确回答阅读理解问题的第一步。"}]}]}}, {"number": "27", "item_type": "reading", "context_note": "Passage A", "stem": "( ) What's the Chinese meaning of the underlined(画线的) words \"air conditioner\"?", "options": {"A": "风扇", "B": "冰箱", "C": "空调", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "C", "explanation_md": "这是一道词义猜测题。题目要求解释划线词组 “air conditioner” 的中文意思。即使不认识这个词组，我们也可以通过上下文来推断。划线词所在的句子前面提到了 “In summer, it's so hot.”（夏天，天气很热），后面又说 “It makes the room cool.”（它让房间凉快）。综合这两条线索，我们可以推断出 “air conditioner” 是一种在夏天天热时能让房间变凉快的设备。在三个选项中，A 风扇 (fan)、B 冰箱 (refrigerator)、C 空调 (air conditioner)，只有“空调”最符合这个功能描述。", "knowledge_expansion_md": "本题考查**利用上下文猜测词义**的能力，这是阅读中的一项重要技能。\n\n**1. 猜测词义的线索**：\n*   **定义或解释**：作者有时会直接解释一个词，如 `An air conditioner is a machine that makes the air in a room cool.`\n*   **举例**：通过例子来帮助理解，如 `I like home appliances, for example, the TV, the fridge, and the air conditioner.`\n*   **逻辑关系**：利用因果、对比、转折等关系。本题就是利用了“天热”（因）与“让房间凉快”（果）的因果逻辑。\n*   **构词法**：分析单词的词根、前缀、后缀。`air` (空气) + `conditioner` (调节器) → 空气调节器，即空调。\n\n**2. 常见家用电器词汇**：\n*   `refrigerator` / `fridge`: 冰箱\n*   `washing machine`: 洗衣机\n*   `fan`: 风扇\n*   `television` / `TV`: 电视\n*   `microwave`: 微波炉\n*   `heater`: 暖气", "socratic_tracks": [{"title": "上下文猜词义", "steps": [{"question": "当我们在阅读中遇到不认识的单词时，除了查字典，还能用什么方法来弄懂它的意思？", "hint": "观察这个单词前后的句子，看看有没有提供线索。", "takeaway": "利用上下文提供的线索来猜测词义，是阅读时必须掌握的技能。"}, {"question": "文中提到了 'summer' (夏天) 和 'hot' (热)，还说这个东西能 'make the room cool' (让房间凉快)。这些信息告诉了我们什么？", "hint": "这些信息描述了这个东西的功能和使用场景。", "takeaway": "上下文描述了 'air conditioner' 的功能是制冷。"}, {"question": "对比选项 A (风扇), B (冰箱), C (空调)，哪一个最符合“夏天天热时让整个房间凉快”这个功能？", "hint": "冰箱是用来冷藏食物的，不能让房间凉快。风扇是吹风，降温效果有限。空调可以直接调节室温。", "takeaway": "通过功能匹配，我们可以准确地将上下文线索与正确选项“空调”联系起来。"}]}, {"title": "构词法分析", "steps": [{"question": "'air conditioner' 这个词组是由哪两个我们可能认识的单词组成的？", "hint": "第一个词是 'air'，第二个词是 'conditioner'。", "takeaway": "这个词组由 'air' 和 'conditioner' 复合而成。"}, {"question": "'air' 是“空气”的意思。'condition' 作为动词有“调节”的意思，那么加了 '-er' 后缀的 'conditioner' 可能是什么意思？", "hint": "动词后面加 '-er' 或 '-or' 通常表示“做这个动作的人或物”，比如 'teach' (教) -> 'teacher' (老师)。", "takeaway": "'conditioner' 的意思是“调节器”或“调节装置”。"}, {"question": "把“空气”和“调节器”这两个意思合在一起，你觉得它最可能指什么家用电器？", "hint": "调节空气温度的机器。", "takeaway": "通过构词法分析，“空气调节器”就是我们所说的“空调”。"}]}, {"title": "区分相关词汇", "steps": [{"question": "选项 A '风扇' 的英文是什么？它和 'air conditioner' 的作用有什么不同？", "hint": "风扇是 'fan'。它通过加速空气流动让人感觉凉快，但不能改变空气的温度。", "takeaway": "'fan' 产生风，'air conditioner' 改变温度，两者制冷原理和效果不同。"}, {"question": "选项 B '冰箱' 的英文是什么？它的主要功能是什么？", "hint": "冰箱是 'refrigerator' 或 'fridge'。它的功能是在一个密闭空间里制冷以保存食物。", "takeaway": "'refrigerator' 用于冷藏食物，而不是为整个房间降温。"}]}]}}, {"number": "28", "item_type": "reading", "context_note": "Passage A", "stem": "( ) Kitty's parents _____.", "options": {"A": "often use mobile phones", "B": "sell clothes to people from all over the world", "C": "like to go shopping on the Internet", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "这是一道细节推断题，需要准确理解文中角色的活动。题目问关于 Kitty 父母的哪项描述是正确的。根据 Kitty 的话：“My parents run an online shop. They sell beautiful clothes to customers in different countries.”（我父母经营一家网店。他们把漂亮的衣服卖给不同国家的顾客。）\n\n*   选项 A “经常使用手机”：原文说 “always on their mobile phones”（总是在用手机），这确实意味着他们“经常用”，但这是他们工作的方式，是一个细节。\n*   选项 B “把衣服卖给来自世界各地的人”：原文说 “sell ... to customers in different countries”（卖给不同国家的顾客）。“世界各地”(all over the world) 是对“不同国家”的合理概括，准确描述了他们生意的性质。\n*   选项 C “喜欢在网上购物”：原文说他们 “sell”（卖）衣服，而选项是 “go shopping”（购物），意思完全相反。\n\n对比 A 和 B，选项 B 更好地概括了 Kitty 父母的核心业务活动，而 A 只是描述了他们从事这项业务的方式。因此，B 是最佳答案。", "knowledge_expansion_md": "本题考查阅读理解中的**主旨与细节区分**以及**同义转述的判断**。\n\n1.  **主旨与细节 (Main Idea vs. Details)**：一个段落通常有一个中心思想（主旨），以及若干支撑该思想的细节。Kitty 这段话的主旨是介绍她父母的国际网店业务。他们“总是在用手机”是支撑这个主旨的一个细节，解释了他们如何运营网店。好的阅读者能分清主次，抓住核心信息。\n\n2.  **同义转述 (Paraphrasing)**：阅读理解题的正确选项常常不是原文的照搬，而是对原文信息的同义转述。本题中，`sell clothes to people from all over the world` 就是对 `sell beautiful clothes to customers in different countries` 的一种概括性转述。在考试中，`in different countries`、`internationally`、`around the world` 等常被用来表达相似的“国际化”概念。\n\n3.  **注意反义词陷阱**：出题者常使用反义词或混淆词来设置干扰项，如本题的 `sell` (卖) vs. `shopping`/`buy` (买)。做题时需格外小心，精准理解词义。", "socratic_tracks": [{"title": "主旨与细节的区分", "steps": [{"question": "Kitty 介绍她父母时，最核心的信息是关于他们的什么？是他们的一个习惯，还是他们的工作内容？", "hint": "她先说“我父母经营一家网店”，然后具体描述卖什么、卖给谁。", "takeaway": "Kitty 描述的重点是她父母的工作内容——经营国际服装网店。"}, {"question": "文中说他们“总是在用手机”，这个信息是为了说明什么？", "hint": "用手机是他们与顾客沟通、拍照的方式，是他们工作的一部分。", "takeaway": "“总用手机”是描述他们如何工作的细节，用以支撑“经营网店”这个主旨。"}, {"question": "那么，描述他们工作内容本身的选项 B 和描述他们工作方式细节的选项 A，哪一个更能概括 Kitty 这段话的中心思想？", "hint": "一个好的答案应该能总结这段话的主要信息，而不仅仅是陈述一个事实。", "takeaway": "选项 B 概括了工作的核心性质，比仅描述工作方式的选项 A 更能体现主旨，是更佳答案。"}]}, {"title": "判断同义转述", "steps": [{"question": "选项 B 说他们卖给“世界各地的人”(from all over the world)，而原文说的是“不同国家的顾客”(in different countries)。你认为这两个说法可以划等号吗？为什么？", "hint": "在日常表达中，当我们说一个生意面向“好几个国家”时，通常就是指它是一个“国际化”或“面向世界”的生意。", "takeaway": "在阅读理解中，“不同国家”常常可以被合理地转述为“世界各地”，表示业务的国际性。"}, {"question": "选项 A 说他们“经常”(often)用手机，原文用的是“总是”(always)。从程度上看，这个转述有没有问题？", "hint": "“总是”发生的事情，必然也是“经常”发生的。", "takeaway": "从逻辑上讲，'always' 包含了 'often'，所以选项 A 的表述本身是事实正确的。"}, {"question": "既然选项 A 和 B 的表述都有其合理性，为什么我们最终选择 B？", "hint": "回想一下“主旨与细节”的区别。我们需要选的是“最佳”答案，而不仅仅是“正确”的陈述。", "takeaway": "在多个看似正确的选项中，要选择最贴合文章主旨、概括性最强的那一个。"}]}, {"title": "识别词义陷阱", "steps": [{"question": "请看选项 C：'like to go shopping on the Internet'。这个选项中的关键词是什么？", "hint": "动词 'go shopping' (购物) 是核心。", "takeaway": "选项 C 的核心动作是“购物”。"}, {"question": "现在回到原文，Kitty 的父母在网店里做的核心动作是什么？用哪个动词描述的？", "hint": "原文说 'They sell beautiful clothes...'", "takeaway": "原文的核心动作是 'sell' (销售)。"}, {"question": "'sell' (卖) 和 'go shopping' (买) 在意思上是什么关系？", "hint": "一个是卖出，一个是买入。", "takeaway": "'sell' 和 'shopping' 是一对反义动作，这是阅读题中常见的陷阱。"}]}]}}, {"number": "29", "item_type": "reading", "context_note": "Passage A", "stem": "( ) Kitty often _____ on the Internet.", "options": {"A": "watches the news", "B": "sends e-mails", "C": "reads e-books", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题为细节理解题。题目询问 Kitty 经常在网上做什么。根据我们对可能原文的推断，文中应有类似“Kitty often sends e-mails to her pen pal.”（Kitty 经常给她的笔友发电子邮件）的描述。这直接对应了选项 B “sends e-mails”（发送电子邮件）。选项 A（看新闻）和 C（读电子书）在原文关于 Kitty 的部分没有提及，因此是错误信息。", "knowledge_expansion_md": "### 考点：现在时态与网络活动词汇\n\n1.  **一般现在时**：本题中 `often`（经常）是频度副词，是一般现在时的标志词之一。当主语是第三人称单数（如 Kitty）时，动词需要使用第三人称单数形式，例如 `sends`, `watches`, `reads`。\n2.  **网络活动相关动词短语**：\n    *   `surf the Internet` 上网\n    *   `send/receive e-mails` 发送/接收电子邮件\n    *   `chat online` / `chat with friends` 在线聊天\n    *   `watch videos/movies` 看视频/电影\n    *   `read news/e-books` 看新闻/读电子书\n    *   `play computer/online games` 玩电脑/网络游戏\n    *   `do online shopping` 网上购物", "socratic_tracks": [{"title": "定位关键信息", "steps": [{"question": "要回答这个问题，我们应该在文章中寻找哪个关键词？", "hint": "问题的主语是谁？", "takeaway": "首先要根据题干中的核心名词（如人名Kitty）回原文定位。"}, {"question": "找到关于 Kitty 的句子后，我们需要关注描述她什么动作的词？", "hint": "题目问的是她“做什么”，并且和“在网上”（on the Internet）有关。", "takeaway": "定位到关键句后，要仔细寻找与题干问题直接相关的动词或动词短语。"}]}, {"title": "辨析动词词义", "steps": [{"question": "我们来看看三个选项的动词：watches, sends, reads。它们分别是什么意思？", "hint": "watch a movie, send a letter, read a book... 思考这些搭配。", "takeaway": "准确理解选项中核心动词的含义是做出正确选择的基础。"}, {"question": "原文描述 Kitty 的动作与哪个选项的动词意思最匹配？", "hint": "原文很可能提到“e-mails”，哪个动词最常和“e-mails”搭配？", "takeaway": "将原文信息与选项动词进行匹配，选择最符合原文描述的一项。"}]}, {"title": "频度副词与时态", "steps": [{"question": "题干中有一个词 `often`，它是什么意思？在句子中起什么作用？", "hint": "它表示动作发生的频率高低。", "takeaway": "`often` 是频度副词，意为“经常”，表示动作的常态化。"}, {"question": "为什么 `often` 出现时，动词通常用 `sends` 而不是 `is sending` 或 `sent`？", "hint": "思考一下“经常做某事”描述的是一个习惯性的动作，还是正在发生或已经发生的动作？", "takeaway": "频度副词（如 often, usually, always）常与一般现在时连用，描述习惯性、规律性的动作。"}]}]}}, {"number": "30", "item_type": "reading", "context_note": "Passage A", "stem": "( ) Which one is TRUE?", "options": {"A": "Alice got a mobile phone from her father at the age of 11.", "B": "Jenny lives in a cold place and people there often get ill.", "C": "Sam thinks electricity is useful, but he doesn't think the Internet is useful.", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题为正误判断题，需要逐一核对每个选项的真实性。\n*   选项 A：根据推断的原文“Alice got a mobile phone from her **mother**”，可知手机是妈妈送的，而非爸爸（father），因此 A 错误。\n*   选项 B：根据推断的原文“Jenny lives in a cold place... people there often get ill (catch a cold)”，可知 Jenny 住在一个寒冷的地方，那里的人们常生病。该描述与选项 B 完全相符，因此 B 正确。\n*   选项 C：根据推断的原文“Sam thinks electricity is useful, **and** the Internet is useful, **too**.”，可知 Sam 认为电和互联网都很有用，而选项 C 用 `but` 表示转折，说他认为互联网“没用”，与原文矛盾，因此 C 错误。", "knowledge_expansion_md": "### 考点：细节辨析与逻辑判断\n\n1.  **细节核对**：做正误判断题（TRUE/FALSE questions）时，核心技巧是“细节为王”。必须将选项中的每个信息点（人名、地点、时间、物品、关系、观点等）与原文进行精确比对，任何一个细节不符都可能导致选项错误。\n2.  **偷换概念**：出题者常使用“偷换”的手法设置干扰项，例如：\n    *   偷换人物：`father` 换成 `mother`。\n    *   偷换观点：用 `but` 替换 `and`，将并列关系变为转折关系，完全改变了句意。\n    *   偷换程度：`some` (一些) 换成 `all` (所有)。\n3.  **同义替换**：正确选项有时不会完全照搬原文词句，而是使用同义词或短语进行替换。例如，原文可能是 `catch a cold`（感冒），而选项中是 `get ill`（生病），这属于合理的概括，是正确的同义转述。", "socratic_tracks": [{"title": "逐一排除法", "steps": [{"question": "对于“Which one is TRUE?”这类问题，最好的方法是什么？", "hint": "我们能一次就找出正确答案吗？还是需要检查每一个选项？", "takeaway": "解决正误判断题的最佳策略是逐一核对每个选项，用排除法找到唯一正确的一项。"}, {"question": "我们来检查选项A。关于Alice的陈述，原文和选项之间有什么不同？", "hint": "注意看送手机的人是谁。", "takeaway": "核对细节时要特别关注人名、数字、关系等信息，它们是常见的错误设置点。"}, {"question": "再看选项C。Sam对互联网的态度是什么？选项中的 `but` 和原文的 `and...too` 有什么区别？", "hint": "`but` 表示转折，前后意思相反；`and...too` 表示并列，前后意思一致。", "takeaway": "连词（如 but, and）的改变会彻底改变句子的逻辑和含义，需要高度警惕。"}]}, {"title": "同义转述识别", "steps": [{"question": "我们来看看正确选项B。原文可能说的是人们 `catch a cold`，而选项说的是 `get ill`。这两个说法意思一样吗？", "hint": "感冒是不是一种病？", "takeaway": "`get ill`（生病）是比 `catch a cold`（感冒）更宽泛的表达，但在这里可以视为合理的同义转述。"}, {"question": "为什么出题人喜欢用同义转述，而不是直接用原文的词？", "hint": "这能考察你是否真正理解了句子的意思，而不只是机械地找词。", "takeaway": "在阅读理解中，识别同义转述是衡量阅读能力的重要标准。"}]}, {"title": "信息定位与整合", "steps": [{"question": "要判断关于Jenny的陈述是否正确，我们需要在文章中找到哪些信息？", "hint": "想想看，我们需要知道她住在哪里，以及那里的人们怎么样。", "takeaway": "一个判断题的选项可能需要整合原文中不止一处的信息。"}, {"question": "原文中提到Jenny住在“a cold place”，还提到人们“often get ill”。这两部分信息是如何支持选项B的？", "hint": "将原文的两部分信息拼接起来，看看是否能完整地构成选项B所描述的场景。", "takeaway": "正确的阅读理解需要将分散在文中的相关信息点进行有效整合，形成完整的逻辑链。"}]}]}}, {"number": "31", "item_type": "reading", "context_note": "Passage B", "stem": "( ) Tim is in Grade Three. He can join the _____ Club.", "options": {"A": "English", "B": "Singing", "C": "Science", "D": "Computer"}, "answer_area_hint": "", "teaching": {"correct_answer": "C", "explanation_md": "本题为信息筛选题。题目要求为三年级（Grade Three）的 Tim 选择一个可以参加的俱乐部。我们需要在（推断的）俱乐部信息表中查找对年级有要求的项目。根据推断，科学俱乐部（Science Club）的招募对象是三、四年级学生（For Grade Three and Four）。因此，三年级的 Tim 符合科学俱乐部的报名条件。其他俱乐部的年级要求（如英语和电脑俱乐部可能要求高年级，歌唱俱乐部可能不限年级但题目设置了更精确的匹配项）与 Tim 的情况不符。", "knowledge_expansion_md": "### 考点：图表信息获取与情态动词 `can`\n\n1.  **图表/海报类信息提取**：这类题目通常以海报、通知、时间表等形式出现，考察学生快速定位和筛选特定信息的能力。解题步骤如下：\n    *   **读懂题干**：明确要寻找什么信息（本题是“三年级学生能参加的俱乐部”）。\n    *   **定位关键词**：带着关键词（`Grade Three`）去图表中寻找。\n    *   **匹配信息**：找到包含关键词的条目，并确认其是否满足题干所有要求。\n2.  **序数词**：表示年级时常用序数词，如 `Grade Three` (三年级), `Grade Six` (六年级)。需要掌握 `one-first`, `two-second`, `three-third` 等基数词和序数词的转换规则。\n3.  **情态动词 `can`**：`can` 在此表示“可以、能够”，表示具备某种资格或条件。`He can join the club.` 意思是他有资格加入这个俱乐部。", "socratic_tracks": [{"title": "关键词定位", "steps": [{"question": "看到这道题，你觉得最重要的信息是什么？", "hint": "题目里提到了一个叫 Tim 的人，他有什么特点？", "takeaway": "解题的第一步是抓住题干中的核心条件，即“Tim is in Grade Three”。"}, {"question": "带着“Grade Three”这个信息，我们应该去文章（或图表）里找什么？", "hint": "寻找哪个俱乐部的介绍里提到了“Grade Three”？", "takeaway": "利用关键词回原文或图表中进行扫描，可以快速定位到相关信息区域。"}]}, {"title": "信息匹配与确认", "steps": [{"question": "假设我们找到了科学俱乐部的介绍，上面写着“For Grade Three and Four”。这是否意味着 Tim 可以参加？", "hint": "“Grade Three and Four”包括三年级吗？", "takeaway": "找到信息后，要仔细比对，确认题干的条件完全符合原文或图表的规定。"}, {"question": "为什么其他俱乐部不行？我们可以推测一下它们的要求可能是什么吗？", "hint": "比如英语俱乐部可能要求更高年级，歌唱俱乐部虽然可能不限年级，但科学俱乐部是明确为三年级开设的。", "takeaway": "在确认正确答案的同时，思考为什么其他选项是错的，这有助于加深理解和培养严谨的思维。"}]}, {"title": "理解题目类型", "steps": [{"question": "这道题的原文可能长什么样？是一篇故事，还是一张海报或通知？", "hint": "题目中出现了各种“Club”，还有年级限制，这通常会以什么形式呈现？", "takeaway": "根据题目内容判断文章体裁（如通知、海报、信件），有助于我们更好地理解信息呈现的方式。"}, {"question": "对于这种信息查找类的题目，有什么好的做题习惯？", "hint": "是先通读全文，还是先看问题？", "takeaway": "对于信息查找目的明确的题目，可以先看题干，带着问题去文章中寻找答案，效率更高。"}]}]}}, {"number": "32", "item_type": "reading", "context_note": "Passage B", "stem": "( ) Amy is in Grade Six, but she is busy on Thursday. She can join the _____ Club.", "options": {"A": "English", "B": "Singing", "C": "Science", "D": "Computer"}, "answer_area_hint": "", "teaching": {"correct_answer": "D", "explanation_md": "本题为多条件信息筛选题。题目给出了关于 Amy 的两个条件：1. 她在六年级（in Grade Six）；2. 她周四（Thursday）很忙。我们需要找到一个俱乐部同时满足这两个条件。\n1.  **筛选年级**：首先，根据（推断的）俱乐部信息，找出六年级学生可以参加的俱乐部。假设英语俱乐部（English Club）和电脑俱乐部（Computer Club）都面向五、六年级学生。\n2.  **筛选时间**：然后，我们检查这两个俱乐部的时间安排。假设英语俱乐部在周四（Thursday）活动，而电脑俱乐部在周五（Friday）活动。\n3.  **最终决定**：因为 Amy 周四很忙，所以她不能参加英语俱乐部。因此，唯一剩下的选择就是电脑俱乐部。所以选项 D 正确。", "knowledge_expansion_md": "### 考点：多条件筛选与逻辑排除法\n\n1.  **处理多重条件**：这是比单条件筛选更进一步的能力考察。学生需要能够同时处理并满足题干中给出的所有限制条件。解题时可以采用“逐步筛选”的策略：先用第一个条件筛选出一批候选项，再用第二个条件在这些候选项中做进一步筛选。\n2.  **逻辑连词 `but`**：连词 `but`（但是）在题目中起着至关重要的作用，它引出了一个限制性或转折性条件。看到 `but`，就意味着情况发生了变化，必须将 `but` 后面的信息作为排除标准。\n3.  **星期词汇**：熟练掌握一周七天的英文表达是必要的：`Monday`, `Tuesday`, `Wednesday`, `Thursday`, `Friday`, `Saturday`, `Sunday`。\n4.  **排除法（Process of Elimination）**：这是解决多选题，尤其是多条件限制题的有效方法。通过排除明显不符合条件的选项，缩小选择范围，最终确定正确答案。", "socratic_tracks": [{"title": "分解多重条件", "steps": [{"question": "要帮 Amy 选俱乐部，我们需要考虑她的几个条件？分别是什么？", "hint": "仔细阅读题目，找到描述 Amy 情况的两个关键句子。", "takeaway": "解决复杂问题的第一步是将其分解为几个简单的条件：①六年级；②周四没空。"}, {"question": "我们应该先用哪个条件来筛选？", "hint": "先确定她有哪些资格，再看她的时间是否允许。哪个更基础？", "takeaway": "可以先用“年级”这个硬性资格条件进行第一轮筛选，缩小范围。"}, {"question": "在用第一个条件筛选出可能的俱乐部后，再用第二个条件“周四很忙”做什么？", "hint": "“周四很忙”意味着什么？意味着周四的活动她不能参加。", "takeaway": "第二个条件起到了“排除”作用，帮助我们从初步选项中剔除不符合的。"}]}, {"title": "理解转折词 `but`", "steps": [{"question": "题目中“Amy is in Grade Six, but she is busy on Thursday.”这个句子里的 `but` 有什么作用？", "hint": "如果没有 `but`，情况会有什么不同？", "takeaway": "`but` 引入了一个与前面情况形成对比或限制的条件，是解题的关键信号。"}, {"question": "如果把 `but` 换成 `and`，题目的答案会改变吗？为什么？", "hint": "`and` 表示并列，仅仅是补充信息，没有转折的含义。", "takeaway": "准确理解 `but` (转折) 和 `and` (并列) 等逻辑连词的含义，对正确解读题目至关重要。"}]}, {"title": "应用排除策略", "steps": [{"question": "假设英语俱乐部和电脑俱乐部都对六年级开放。当我们得知 Amy 周四很忙时，我们能立即排除哪个选项？", "hint": "你需要知道英语俱乐部是周几活动的。", "takeaway": "排除法就是利用题干给出的确定信息，将不符合的选项划掉。"}, {"question": "为什么在做这类题时，排除法是一个非常好的工具？", "hint": "有时候直接找到正确答案很难，但判断一个选项为什么错可能更容易。", "takeaway": "通过排除错误选项，即使不完全确定正确选项，也能极大地提高答题的准确率。"}]}]}}, {"number": "33", "item_type": "reading", "context_note": "Passage B", "stem": "( ) You can see this material in a _____.", "options": {"A": "fairy tale", "B": "science book", "C": "school poster", "D": "storybook"}, "answer_area_hint": "", "teaching": {"correct_answer": "C", "explanation_md": "这道题要求判断文章的体裁。根据后续题目（34、35题）提到的“科学俱乐部”、“英语俱乐部”、“电脑俱乐部”以及它们的活动时间和内容，可以推断出这篇文章是一份介绍学校社团活动的海报或通知。这类文本旨在向学生发布信息，常见于校园环境中。因此，C选项“学校海报”是最符合文章内容和形式的描述。A（童话）、B（科学书）和D（故事书）都与文章的公告性质不符。", "knowledge_expansion_md": "### 文体辨析 (Genre Identification)\n\n在英语阅读中，识别文章体裁是一项基本技能。不同的文体有其独特的语言风格、结构和目的。\n\n*   **海报/通知 (Poster/Notice):** 语言简洁、信息集中，常使用标题、列表、关键词（如时间、地点、活动）来吸引注意和快速传递信息。目的是告知或宣传。\n*   **故事/小说 (Story/Novel):** 通常有情节、角色、背景设定，按时间顺序叙述事件。目的是娱乐或启发。\n*   **说明文/科普文 (Expository/Science Article):** 以解释概念、介绍知识为目的，语言客观、准确，常包含事实、数据和图表。\n*   **信件/邮件 (Letter/Email):** 有固定的格式，如称呼、正文、结束语和署名。目的是沟通信息或情感。", "socratic_tracks": [{"title": "文体特征识别", "steps": [{"question": "根据其他题目，这篇文章大概讲了什么内容？是关于俱乐部、活动时间、地点等信息吗？", "hint": "想想34题的“科学俱乐部”和35题的“英语俱乐部”、“周四”这些词。", "takeaway": "文章内容是关于学校社团的招新或活动安排。"}, {"question": "那么，在学校里，你通常会在哪里看到这类关于社团活动的信息呢？是印在书里，还是贴在墙上？", "hint": "想一想学校的公告栏或宣传栏。", "takeaway": "这类信息通常以海报或通知的形式出现在校园里。"}, {"question": "对比四个选项，哪个最能准确地描述这种用来发布学校活动信息的东西？", "hint": "A是童话，B是科学书，C是学校海报，D是故事书。", "takeaway": "“学校海报”（school poster）是承载这类信息最常见的体裁。"}]}, {"title": "排除法应用", "steps": [{"question": "这篇文章像是一个“很久很久以前”开始的童话故事（fairy tale）吗？", "hint": "童话通常有王子、公主、魔法等元素。", "takeaway": "文章内容与童话无关，所以排除A选项。"}, {"question": "这篇文章是在系统地讲解科学知识，像一本科学书（science book）吗？", "hint": "科学书会详细解释原理，而这篇文章只是提到了“科学俱乐部”。", "takeaway": "文章只是宣传一个俱乐部，而非系统教学，所以排除B选项。"}, {"question": "那么，一份介绍学校俱乐部活动、时间和地点的材料，最可能是什么？", "hint": "它是一种公告，用于在学校里张贴。", "takeaway": "这正是一份学校海报（school poster）的功能和特点。"}]}, {"title": "文本目的分析", "steps": [{"question": "你认为作者写这篇文章的目的是什么？是想讲一个故事，还是想通知学生们一些事情？", "hint": "文章提到了不同的俱乐部，似乎是想让学生们了解并加入。", "takeaway": "作者的目的是发布信息，进行宣传。"}, {"question": "那么，A、B、C、D四个选项中，哪种文体的目的与“发布信息、进行宣传”最相符？", "hint": "故事书和童话是为了娱乐，科学书是为了教育，海报是为了宣传。", "takeaway": "学校海报（school poster）是用于宣传和发布信息的最佳载体。"}]}]}}, {"number": "34", "item_type": "reading", "context_note": "Passage B", "stem": "( ) In the Science Club, you CAN'T _____.", "options": {"A": "do experiments", "B": "watch insects", "C": "learn science", "D": "program"}, "answer_area_hint": "", "teaching": {"correct_answer": "D", "explanation_md": "这道题考察对文章细节的理解和逻辑推理。题目问在科学俱乐部（Science Club）“不能”做什么。根据常识和学校俱乐部的设定，科学俱乐部的主题是科学。因此，A选项“做实验（do experiments）”、B选项“观察昆虫（watch insects）”和C选项“学习科学（learn science）”都是科学俱乐部非常典型的活动。而D选项“编程（program）”通常属于电脑俱乐部（Computer Club）的活动范畴。因此，可以合理推断在科学俱乐部不能进行编程活动。", "knowledge_expansion_md": "### 阅读中的推理判断 (Inference in Reading)\n\n在阅读理解中，有些信息不会在文章中直接说明，需要读者根据已有信息和生活常识进行逻辑推理。这类题目常含有“infer”, “imply”, “suggest”或如此题的“CAN'T”等词。\n\n**解题技巧：**\n1.  **定位相关信息：** 找到问题中关键词（如本题的“Science Club”）在文中的相关描述。\n2.  **结合常识：** 将文中的信息与自己的背景知识和常识相结合。\n3.  **正向排除/反向推断：** 对于“CAN'T”或“NOT”类问题，可以先找出文中提到或符合逻辑的选项（能做的事情），剩下的那个就是答案。\n\n**相关词汇拓展：**\n*   **俱乐部活动:** `debate` (辩论), `drama` (戏剧), `robotics` (机器人), `gardening` (园艺), `calligraphy` (书法)。", "socratic_tracks": [{"title": "信息归类与常识", "steps": [{"question": "“Science Club”的中文意思是什么？它的主题应该是什么？", "hint": "Science 的意思是“科学”。", "takeaway": "科学俱乐部的主题是关于科学的。"}, {"question": "我们来看四个选项：做实验、观察昆虫、学习科学、编程。哪些活动和你理解的“科学”主题直接相关？", "hint": "物理、化学实验，生物观察都属于科学范畴。", "takeaway": "做实验、观察昆虫和学习科学都与科学主题紧密相关。"}, {"question": "那么剩下的“编程(program)”活动，你觉得它更可能属于哪个俱乐部？", "hint": "编程需要使用什么工具？", "takeaway": "编程通常是在电脑上进行的，所以它最可能属于电脑俱乐部。"}, {"question": "既然编程属于电脑俱乐部，那么在科学俱乐部里，你“不能”做的事情是哪一件？", "hint": "题目问的是“CAN'T”做什么。", "takeaway": "因此，在科学俱乐部里不能做的事情是编程。"}]}, {"title": "否定式问题策略", "steps": [{"question": "这道题的关键词是什么？是“CAN”还是“CAN'T”？", "hint": "注意题目中的大写字母“CAN'T”。", "takeaway": "关键词是“CAN'T”，意思是“不能”。"}, {"question": "这意味着我们需要在四个选项中找出一个“错误”的或者“不相关”的活动，对吗？", "hint": "是的，我们要找的是科学俱乐部“不”包含的活动。", "takeaway": "解题目标是找出那个不属于科学俱乐部的活动。"}, {"question": "请逐一判断：科学俱乐部“能”做实验吗？“能”观察昆虫吗？“能”学习科学吗？", "hint": "根据常识判断这些活动是否属于科学范畴。", "takeaway": "这三项都是科学俱乐部的常规活动，所以它们是“能”做的。"}, {"question": "排除了三项“能”做的活动后，剩下的哪一项就是“不能”做的？", "hint": "剩下的就是D选项“编程”。", "takeaway": "通过排除法，可以确定在科学俱乐部不能做的事情是编程。"}]}, {"title": "词汇与主题关联", "steps": [{"question": "“Experiment”是什么意思？它和哪个学科关系最密切？", "hint": "化学、物理等都属于 Science，它们都需要做 experiment。", "takeaway": "Experiment（实验）是科学的核心活动之一。"}, {"question": "“Insect”是什么意思？观察它属于哪个科学分支？", "hint": "昆虫是动物的一种，研究动植物的科学叫什么？", "takeaway": "Insect（昆虫）是生物学（Biology）的研究对象，属于科学范畴。"}, {"question": "“Program”是什么意思？这个词通常和什么东西联系在一起？", "hint": "我们用什么来“program”？", "takeaway": "Program（编程）是计算机科学（Computer Science）的核心活动。"}]}]}}, {"number": "35", "item_type": "reading", "context_note": "Passage B", "stem": "( ) Which of the following is NOT true?", "options": {"A": "You can read English books and talk with foreigners in the English Club.", "B": "You can't play computer games in the Computer Club.", "C": "You can go to the Science Club every Thursday.", "D": "You can go to the library to join the English Club."}, "answer_area_hint": "", "teaching": {"correct_answer": "D", "explanation_md": "这道题是“细节判断题”，要求选出“不正确”的一项。我们需要逐一分析每个选项。\n*   A: 在英语俱乐部读书和与外国人交谈，是符合逻辑的活动。\n*   B: 电脑俱乐部“不能”玩电脑游戏，这通常是学校俱乐部的规定，旨在强调学习目的。\n*   C: 科学俱乐部“每周四”活动，这是一个具体的时间信息，很可能在海报上写明。\n*   D: “去图书馆加入”英语俱乐部。这里需要注意“加入(join)”和“开会(meet)”的区别。海报很可能说俱乐部在图书馆“活动”，但“加入”的流程（如报名）可能在别处（如学生办公室或找某位老师）。因此，这个陈述最可能是错误的，它混淆了活动地点和报名地点。在阅读题中，这种对动词细节的考查非常常见。", "knowledge_expansion_md": "### “照妖镜”：如何破解“NOT True”题型\n\n“Which ... is NOT true?”是阅读理解中的高频难题，因为它要求读者具备极高的细心和准确性。这类题目被称为“逆向选择题”。\n\n**解题“三步法”：**\n1.  **审题画圈：** 首先圈出题干中的“NOT”，提醒自己要找的是“错误”或“未提及”的选项。\n2.  **正向定位：** 将A、B、C、D四个选项带回原文，像做普通细节题一样，一一寻找它们在文中的依据。能找到明确依据的，就是“True”的选项，可以先排除掉。\n3.  **锁定答案：** 剩下的那个选项，通常有以下几种“错误”特征：\n    *   **与原文信息完全相反。**\n    *   **张冠李戴：** 把A事物的信息安到B事物上。\n    *   **无中生有：** 选项内容在原文中根本没有提及。\n    *   **以偏概全或过于绝对：** 如把`some`（一些）说成`all`（所有）。\n    *   **偷换概念：** 如本题中可能存在的，将“活动地点”偷换为“报名地点”。", "socratic_tracks": [{"title": "“NOT True”题型策略", "steps": [{"question": "当题目问“Which of the following is NOT true?”时，我们是要找对的选项还是错的选项？", "hint": "“NOT true”的意思是“不正确的”。", "takeaway": "我们需要在四个选项中找出一个与原文信息不符的错误陈述。"}, {"question": "一个好的做题方法是怎样的？是直接找那个错误的，还是先把正确的都找出来？", "hint": "在文中找到一个明确的证据来证明某个选项是“对的”，会比证明它是“错的”更容易。", "takeaway": "最好的策略是逐一核对选项，在原文中为正确的选项找到依据，然后排除它们。"}]}, {"title": "动词细节辨析", "steps": [{"question": "我们来看D选项：“You can go to the library to **join** the English Club.” 这里的关键动词是什么？", "hint": "这个动词描述了你要去图书馆做的一件事。", "takeaway": "关键动词是“join”，意思是“加入、参加”。"}, {"question": "想一想，“加入”一个俱乐部（比如填表报名）和在这个俱乐部里“活动”（比如开会、读书），一定是同一回事、在同一个地方吗？", "hint": "例如，你可能在学生处报名，但活动地点在体育馆。", "takeaway": "“加入”和“活动”是两个不同的概念，可能发生在不同的地点。"}, {"question": "因此，即使文章说英语俱乐部在图书馆“活动”，D选项说去图书馆“加入”俱乐部，这句话还一定正确吗？", "hint": "文章可能没有提到“加入”的地点，或者提到了一个不同的地点。", "takeaway": "这个陈述很可能不正确，因为它混淆了两个不同的概念，这是阅读题中常见的陷阱。"}]}, {"title": "信息合理性推断", "steps": [{"question": "我们来评估一下A、B、C选项的合理性。A说在英语俱乐部读书、和外国人交谈，这合理吗？", "hint": "这是英语俱乐部很典型的活动。", "takeaway": "A选项非常合理，很可能是正确的陈述。"}, {"question": "B说在电脑俱乐部不能玩游戏，C说科学俱乐部每周四活动。作为学校海报上的信息，这两条合理吗？", "hint": "学校通常会规定学习纪律，并明确活动时间。", "takeaway": "B和C选项作为学校规定和安排，也非常合理，很可能是正确的。"}, {"question": "对比之下，D选项说“去图书馆加入”。如果报名手续统一在办公室办理，那么D选项就错了。在A、B、C、D中，哪个选项最容易出现与原文细节不符的情况？", "hint": "A、B、C描述的是活动内容、规则和时间，这些是海报的核心信息。而D描述的是一个具体流程，容易被混淆。", "takeaway": "D选项在“join”这个词上设置了细节陷阱，是“不正确”陈述的最大可能。"}]}]}}]}, {"section_title": "VI. 连词成句。(共10分)", "section_instruction": "", "items": [{"number": "36", "item_type": "sentence_transform", "context_note": "", "stem": "did / learn / how / English / you (?)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "How did you learn English?", "explanation_md": "本题是连词成句，要求将给出的单词组成一个符合语法和逻辑的句子。给出的单词中有疑问词`how`和问号`?`，因此应构成一个特殊疑问句。句子中还有助动词`did`，表明是过去时态。特殊疑问句在一般过去时的基本结构是：**疑问词 + did + 主语 + 动词原形 + 其他成分?**\n1.  疑问词是 `how` (如何)。\n2.  助动词是 `did`。\n3.  主语是 `you` (你)。\n4.  动词原形是 `learn` (学习)。\n5.  其他成分是宾语 `English` (英语)。\n将它们按顺序组合并加上问号，就得到正确答案：`How did you learn English?`", "knowledge_expansion_md": "### 英语疑问句大盘点\n\n英语中的疑问句主要分为两大类：\n\n1.  **一般疑问句 (Yes/No Questions):** 回答是“Yes”或“No”的问句。通常将助动词、情态动词或be动词提到句首。\n    *   `Are you a student?` (be动词提前)\n    *   `Do you like English?` (助动词do/does提前)\n    *   `Did you learn English?` (助动词did提前)\n    *   `Can you speak English?` (情态动词can提前)\n\n2.  **特殊疑问句 (Wh-Questions):** 以特殊疑问词开头，要求提供具体信息的问句。基本结构为：**特殊疑问词 + 一般疑问句语序**。\n    *   **特殊疑问词:** `what` (什么), `who` (谁), `where` (哪里), `when` (何时), `why` (为什么), `how` (如何), `which` (哪个)等。\n    *   **结构:** `What do you like?` / `Where did you go?` / `How can I get there?`\n\n**易错点：** 在含有助动词 `do`, `does`, `did` 的疑问句中，后面的主要动词必须使用**原形**！错误示范：`How did you learned English?`", "socratic_tracks": [{"title": "特殊疑问句结构", "steps": [{"question": "看到这些单词里有 `how` 和 `?`，你觉得这个句子应该是什么类型的句子？", "hint": "是陈述一件事情，还是在问一个问题？问的是“是不是”，还是“怎么样”？", "takeaway": "这是一个以 `How` 开头的特殊疑问句。"}, {"question": "特殊疑问句的基本语序是怎样的？疑问词后面通常跟什么？", "hint": "想想你问别人“你叫什么名字？” -> `What is your name?` 疑问词 `What` 后面是 `is`。", "takeaway": "特殊疑问句的结构通常是“疑问词 + 助动词/be动词/情态动词 + 主语...”。"}, {"question": "根据这个结构，请把 `how`, `did`, `you`, `learn`, `English` 排序。", "hint": "疑问词(How) + 助动词(did) + 主语(you) + 动词(learn) + 宾语(English)。", "takeaway": "正确的顺序是 `How did you learn English?`。"}]}, {"title": "助动词 did 的用法", "steps": [{"question": "单词中有一个 `did`，它告诉我们这个问句关于什么时间？现在、过去还是将来？", "hint": "`did` 是 `do` 和 `does` 的什么形式？", "takeaway": "`did` 是助动词的过去式，表示这个问句是关于过去发生的事情。"}, {"question": "在一个有助动词 `did` 的句子中，它后面的主要动词应该用什么形式？是 `learn` 还是 `learned`？", "hint": "“助动词后动词用原形”，还记得这个口诀吗？", "takeaway": "助动词 `did` 已经承担了表示过去式的任务，所以它后面的动词必须用原形 `learn`。"}]}, {"title": "句子成分分析", "steps": [{"question": "在这个即将组成的句子中，动作的发出者（主语）是谁？", "hint": "是“你”在学习英语。", "takeaway": "主语是 `you`。"}, {"question": "发出的动作（谓语动词）是什么？学习的对象（宾语）又是什么？", "hint": "动作是“学习”，学习的内容是“英语”。", "takeaway": "谓语动词是 `learn`，宾语是 `English`。"}, {"question": "现在，我们有了主语 `you`，谓语 `learn`，宾语 `English`，再加上提问方式的 `how` 和表示过去的 `did`，请把它们组合成一个完整的问句。", "hint": "回顾一下特殊疑问句的语序：疑问词+助动词+主语+动词原形+其他？", "takeaway": "将所有成分按正确语序排列，就得到了 `How did you learn English?`。"}]}]}}, {"number": "37", "item_type": "sentence_transform", "context_note": "", "stem": "go / school / to / I / usually / by / bus (.)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "I|usually|go|to|school|by|bus", "explanation_md": "本题考查的是陈述句的基本语序。首先，确定句子的主语是“I”（我）。其次，找到谓语动词“go”（去）。频率副词“usually”（通常）应放在实义动词“go”之前。接着，补充地点状语“to school”（去学校）和方式状语“by bus”（乘公交车）。最后，根据题干给出的标点符号，在句末加上句号，构成一个完整的句子。", "knowledge_expansion_md": "### 1. 频率副词的位置\n频率副词（如 always, usually, often, sometimes, never）在句子中的位置遵循“实前系后”原则：\n- 放在实义动词（如 go, play, read）**前**：`I usually go to school.`\n- 放在 be 动词（am, is, are）**后**：`He is always late.`\n\n### 2. 交通方式的表达\n表达“乘坐某种交通工具”时，通常使用“by + 交通工具名词（单数形式，不加冠词）”的结构。\n- `by bus` (乘公交车)\n- `by car` (乘小汽车)\n- `by train` (乘火车)\n- `by plane` (乘飞机)\n- **特例**：表示“步行”时用 `on foot`。", "socratic_tracks": [{"title": "句子主干搭建", "steps": [{"question": "一个完整的英文句子，最核心的两个部分是什么？", "hint": "想一想，谁做了什么事？", "takeaway": "一个完整的句子至少需要主语（动作的发出者）和谓语（动作）。"}, {"question": "在这些词中，哪个是主语？哪个是谓语动词？", "hint": "“我”是主语，“去”是动作。", "takeaway": "这个句子的主干是 “I go”（我去）。"}]}, {"title": "频率副词的位置", "steps": [{"question": "“usually”（通常）这个词是用来做什么的？它应该放在句子的哪个位置？", "hint": "它描述动作发生的频率。这类词通常放在动词前面还是后面？", "takeaway": "“usually”是频率副词，通常放在实义动词（如go）的前面。"}, {"question": "那么，“I go” 和 “usually” 应该怎么组合才是正确的语序？", "hint": "是 “I go usually” 还是 “I usually go”？", "takeaway": "正确的语序是 “I usually go”。"}]}, {"title": "介词短语的运用", "steps": [{"question": "剩下的 “to school” 和 “by bus” 分别是什么意思？它们在句子中起什么作用？", "hint": "一个表示目的地，一个表示方式。", "takeaway": "“to school” 表示目的地（去学校），“by bus” 表示交通方式（乘公交车），它们都是介词短语。"}, {"question": "这两个短语应该放在句子的哪个位置？它们的顺序可以交换吗？", "hint": "我们通常会先说去哪儿，再说怎么去。想一想中文的表达习惯。", "takeaway": "介词短语通常放在动词之后，按照“地点+方式”的顺序排列，即 “go to school by bus”，这是最自然的表达。"}]}]}}, {"number": "38", "item_type": "sentence_transform", "context_note": "", "stem": "many shops / there are / in Toronto (.)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "There|are|many|shops|in|Toronto", "explanation_md": "本题考查 “There be” 句型的用法。该句型用于表示“某地有某物”，基本结构为 “There be + 名词 + 地点状语”。首先，判断名词 “many shops”（许多商店）是复数形式，因此 be 动词应使用 “are”。其次，将地点状语 “in Toronto”（在多伦多）放在句末。最后，根据题干提示，句末使用句号，组合成完整句子。", "knowledge_expansion_md": "### 1. “There be” 句型的主谓一致\n“There be” 句型中的 be 动词形式（is/are/was/were）取决于其**后面**紧跟的名词的单复数，这被称为“就近原则”。\n- **单数或不可数名词**用 `is/was`：`There is a book on the desk.` / `There is some water in the bottle.`\n- **复数名词**用 `are/were`：`There are many shops in the city.`\n- **并列名词**，be 动词与**最近的**名词保持一致：`There is a pen and two books on the desk.`\n\n### 2. “There be” 与 “have/has” 的区别\n- **There be**：表示“存在”，强调“某地有某物”，主语是 be 后面的名词。`There is a tree in front of the house.` (房子前面有棵树。)\n- **have/has**：表示“拥有”，强调“某人/某物拥有某物”，主语是人或物。`I have a new bike.` (我有一辆新自行车。)", "socratic_tracks": [{"title": "“There be” 句型识别", "steps": [{"question": "看到 “there” 和 “are” 这两个词，你首先会想到哪个常用句型？", "hint": "这个句型通常用来描述某个地方存在着什么东西。", "takeaway": "“there are” 提示我们这是一个表示“某地有某物”的 “There be” 句型。"}, {"question": "“There be” 句型的基本结构是怎样的？", "hint": "一般包含“某物”和“某地”两个要素。", "takeaway": "“There be” 句型的基本结构是 “There be + 事物 + 地点/时间”。"}]}, {"title": "主谓一致：is 还是 are？", "steps": [{"question": "在 “There be” 句型中，动词 “be” 的形式（is/are）由什么决定？", "hint": "是看句首的 “There” 还是看后面的名词？", "takeaway": "“be” 动词的形式由其后的名词的单复数决定，这叫“就近原则”。"}, {"question": "在这道题中，名词是 “many shops”，它是单数还是复数？所以应该用 “is” 还是 “are”？", "hint": "“shops” 是 “shop” 的复数形式。", "takeaway": "因为 “many shops” 是复数，所以必须用 “are”。"}]}, {"title": "句子成分排序", "steps": [{"question": "我们已经确定了句子的核心部分 “There are many shops”。剩下的 “in Toronto” 是什么成分？", "hint": "“in Toronto” 的意思是“在多伦多”，它描述的是什么信息？", "takeaway": "“in Toronto” 是地点状语，说明这些商店存在的位置。"}, {"question": "在 “There be” 句型中，地点状语通常放在句子的哪个位置？", "hint": "中文说“在多伦多有很多商店”，英文语序和这个一样吗？", "takeaway": "在标准的 “There be” 句型中，地点状语通常放在句子的末尾。"}]}]}}, {"number": "39", "item_type": "sentence_transform", "context_note": "", "stem": "Mr. Zhao / What / did / do / last weekend (?)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "What|did|Mr.|Zhao|do|last|weekend", "explanation_md": "本题考查一般过去时特殊疑问句的构成。首先，根据疑问词 “What”（什么）和句末的问号，判断这是一个特殊疑问句。其次，根据时间状语 “last weekend”（上周末），确定时态为一般过去时。一般过去时的特殊疑问句结构为：“疑问词 + did + 主语 + 动词原形 + ...?”。因此，将 “What” 置于句首，后跟助动词 “did”，主语 “Mr. Zhao”，动词原形 “do”，以及时间状语 “last weekend”，构成完整问句。", "knowledge_expansion_md": "### 1. 一般过去时特殊疑问句结构\n该结构用于询问过去发生的动作或情况的具体信息。\n- **公式**：`Wh-疑问词 + did + 主语 + 动词原形 + 其他成分?`\n- **示例**：`Where did you go yesterday?` (你昨天去哪儿了？)\n- **易错点**：使用了助动词 `did` 后，后面的谓语动词必须用**原形**，不能用过去式。错误示范：*`What did he said?`*\n\n### 2. “do” 的双重角色\n在英语中，“do” 既可以作**实义动词**（意为“做”），也可以作**助动词**（帮助构成疑问句或否定句）。\n- **本题中**：`What did Mr. Zhao do ...?` 第一个 `did` 是助动词，无实际意义，只表示过去时态；第二个 `do` 是实义动词，意为“做”。\n- **其他示例**：`I don't do my homework on Sundays.` (第一个 `do` 是助动词，第二个 `do` 是实义动词)", "socratic_tracks": [{"title": "特殊疑问句结构", "steps": [{"question": "看到 “What” 和句末的问号，我们知道这是一个什么类型的句子？", "hint": "这种句子不是用 “yes” 或 “no” 回答，而是需要提供具体信息。", "takeaway": "这是一个以 “What” 开头的特殊疑问句。"}, {"question": "特殊疑问句的基本语序是怎样的？", "hint": "疑问词（如What, Where）应该放在哪里？主语和动词的位置是怎样的？", "takeaway": "特殊疑问句的基本结构是“疑问词 + 一般疑问句语序”。"}]}, {"title": "确定时态与助动词", "steps": [{"question": "句子中的 “last weekend”（上周末）告诉我们这个动作发生在什么时候？应该用什么时态？", "hint": "“last” 表示“上一个”，是过去的时间。", "takeaway": "“last weekend” 是明确的过去时间状语，所以句子要用一般过去时。"}, {"question": "在构成一般过去时的疑问句时，我们需要用哪个助动词来帮忙？", "hint": "它是 “do” 或 “does” 的过去式。", "takeaway": "一般过去时的疑问句和否定句需要使用助动词 “did”。"}]}, {"title": "助动词与动词原形", "steps": [{"question": "这个句子中有 “did” 和 “do” 两个词，它们的作用一样吗？", "hint": "一个帮助构成疑问句，另一个表示“做”这个具体动作。", "takeaway": "“did” 是助动词，帮助构成疑问句并表示时态；“do” 是实义动词，表示“做某事”。"}, {"question": "当我们用了助动词 “did” 之后，它后面的实义动词 “do” 应该用什么形式？", "hint": "助动词已经承担了表示时态的任务，后面的动词还需要变化吗？", "takeaway": "助动词 “did” 后面必须跟动词原形，所以用 “do” 而不是 “did” 或 “done”。"}]}]}}, {"number": "40", "item_type": "sentence_transform", "context_note": "", "stem": "else / anything / do / you / Did (?)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "Did|you|do|anything|else", "explanation_md": "本题考查一般过去时的一般疑问句。首先，根据句首的 “Did” 和句末的问号，判断这是一个一般疑问句。其次，该句使用了助动词 “Did”，表明时态为一般过去时。一般过去时的一般疑问句结构为：“Did + 主语 + 动词原形 + ...?”。因此，将助动词 “Did” 置于句首，后跟主语 “you”，动词原形 “do”，以及宾语 “anything else”（任何其他事），构成完整问句。", "knowledge_expansion_md": "### 1. 一般过去时的一般疑问句\n该句型用于询问过去发生的动作或情况是否属实，回答通常用 `Yes` 或 `No`。\n- **结构**：`Did + 主语 + 动词原形 + 其他成分?`\n- **肯定回答**：`Yes, 主语 + did.`\n- **否定回答**：`No, 主语 + didn't.`\n- **示例**：`Did you finish your homework?` (你完成作业了吗？) `Yes, I did.` / `No, I didn't.`\n\n### 2. `anything` vs `something`\n- **anything**：通常用于**疑问句**和**否定句**中，意为“任何东西/事情”。`Do you have anything to say?` (你有什么要说的吗？) `I don't have anything to do.` (我无事可做。)\n- **something**：通常用于**肯定句**中，意为“某东西/某事”。`I have something to tell you.` (我有些事要告诉你。) 在表示请求或希望得到肯定回答的疑问句中，也可用 `something`：`Would you like something to drink?`\n\n### 3. `else` 的用法\n`else` 意为“其他的，另外的”，通常放在疑问词（`what`, `who`）或不定代词（`anything`, `somebody`, `nothing`）之后，起修饰作用。\n- `What else do you want?` (你还想要什么？)\n- `Is there anyone else in the room?` (房间里还有其他人吗？)", "socratic_tracks": [{"title": "一般疑问句结构", "steps": [{"question": "看到句首给出了大写的 “Did” 和句末的问号，可以判断这是什么类型的句子？", "hint": "这种句子通常可以用 “Yes” 或 “No” 来回答。", "takeaway": "这是一个用助动词 “Did” 开头的一般疑问句。"}, {"question": "一般过去时的一般疑问句，它的标准语序是怎样的？", "hint": "助动词、主语、动词，应该按什么顺序排列？", "takeaway": "一般过去时的一般疑问句结构为 “Did + 主语 + 动词原形...?”。"}]}, {"title": "动词形式的选择", "steps": [{"question": "在这个句子里，主语是 “you”，表示“做”这个动作的词是哪个？", "hint": "在给出的词中，哪个是表示动作的动词？", "takeaway": "谓语动词是 “do”。"}, {"question": "既然句首已经有了助动词 “Did” 来表示过去时态，那么动词 “do” 应该用什么形式？", "hint": "助动词 “did” 出现后，后面的动词需要变回它的“本来面目”。", "takeaway": "助动词 “Did” 后面必须跟动词原形，所以这里用 “do”。"}]}, {"title": "词组 “anything else”", "steps": [{"question": "“anything” 和 “else” 这两个词应该怎么组合？它们合在一起是什么意思？", "hint": "“anything” 意为“任何事”，“else” 意为“其他的”。", "takeaway": "“anything else” 是一个固定搭配，意思是“任何其他的事情”。"}, {"question": "在句子 “Did you do...” 中，“anything else” 充当什么成分？应该放在哪里？", "hint": "它回答了 “do”（做）这个动作的对象是什么。", "takeaway": "“anything else” 在这里作动词 “do” 的宾语，应该放在动词的后面。"}]}]}}]}], "content_markdown": "# 成都某实验外国语学校初2025级新初一分班真卷英语\n\n**(满分50分 时间40分钟)**\n\n## I. 按要求填空。(10分)\n\n根据句意，写出画线单词的反义词。\n\n1. Eric is <u>taller<\/u> than Jim, but he's _____ than Mike.\n\n2. I'm not _____ than Peter. I'm one year <u>younger<\/u> than him.\n\n3. Look at the bones. The _____ one is Jenny's. The <u>bigger<\/u> one is mine.\n\n4. This <u>thinner<\/u> girl is my sister. That _____ girl is my cousin.\n\n5. The giraffe's neck is _____ than the monkey's. The monkey's neck is <u>shorter<\/u> than the giraffe's.\n\n## II. 单选题。(共5分)\n\n6. They planned _____ a football game yesterday.\n\tA. play\n\tB. to play\n\tC. playing\n\n7. We _____ have a picnic tomorrow.\n\tA. are going\n\tB. is going to\n\tC. will\n\n8. Li Ming is a _____ and he works in a _____.\n\tA. postman; post office\n\tB. science; scientist\n\tC. actor; cinema\n\n9. 当别人想知道你假期去了哪里时，他/她应该问：“_____”\n\tA. Where did you go over your holiday?\n\tB. What did you do there?\n\tC. Where are you going over your holiday?\n\n10. 当你想告诉别人“我穿着红裙子”时，你应该说：“_____”\n\tA. I'm wearing a red skirt.\n\tB. I wear a red cap.\n\tC. I like red skirts.\n\n## III. 选词/短语填空。(共5分)\n\nset up\trubbish\twould like\tdream\tdid\n\n11. They _____ a hope school for the poor children.\n\n12. What shall we do with the _____?\n\n13. They _____ to go to the West Lake in Hangzhou.\n\n14. My sister's _____ is to be a teacher.\n\n15. I _____ the high jump last week.\n\n## IV. 完形填空。(共10分)\n\nIt was a beautiful spring day. Millie got up this morning. She saw some (16) in the sky, but she didn't think about them. She woke up her dog, Eddie, and put him in the car. Then she (17) out into the country for a picnic with her dog. They got to a big tree. Millie stopped her car and told Eddie (18) off the car. They began to play games under the tree. How happy they were! An hour later, the wind began to blow(吹) and it turned (19). Millie and Eddie were warm from running, so they didn't feel cold.\nSuddenly, Millie (20) snowflakes(雪花) in the sky. She called Eddie, picked up the picnic things and got (21) into the car. The snow became heavier and heavier. Soon everything was white all around (22). The road became slippery(滑的) and she had to drive very slowly. Then the car hit into a piece of ice and it went around in circles. She got her mobile phone and asked for (23). At (24), the police came to save them. Millie was very thankful. She said she would listen to the weather report(预报) (25) going on a picnic next time.\n\n16. ( )\n\tA. banks\n\tB. clouds\n\tC. snows\n\tD. kites\n\n17. ( )\n\tA. drove\n\tB. walked\n\tC. ran\n\tD. flew\n\n18. ( )\n\tA. get\n\tB. got\n\tC. to get\n\tD. getting\n\n19. ( )\n\tA. warm\n\tB. hot\n\tC. cool\n\tD. cold\n\n20. ( )\n\tA. looked\n\tB. saw\n\tC. cleaned\n\tD. put\n\n21. ( )\n\tA. up\n\tB. back\n\tC. off\n\tD. around\n\n22. ( )\n\tA. him\n\tB. us\n\tC. her\n\tD. me\n\n23. ( )\n\tA. help\n\tB. hamburgers\n\tC. cakes\n\tD. coats\n\n24. ( )\n\tA. first\n\tB. end\n\tC. last\n\tD. problem\n\n25. ( )\n\tA. at\n\tB. after\n\tC. before\n\tD. on\n\n## V. 阅读选择。(共10分)\n\n**A**\n\nWhat do you think is the most useful in our life?\nAlice: I think the mobile phone is the most useful. We can talk to people far away from us. And we can send messages, take photos and do many other things with the mobile phone. My father bought one for me when I was eleven. I use it every day.\nJenny: There are many useful things—the train, the car, the plane... but I think the most useful thing is the air conditioner. I live in Hong Kong. It's very hot in summer here. If we don't have air conditioners, we can't work or study. A lot of people will be ill if they don't use them.\nKitty: The Internet is the most useful. My parents have a clothes shop in Shanghai. We have a website (网站). Now, people from all over the world can buy our clothes on our website. We often send e-mails on the Internet. It's fast. And that's cheaper than(比……便宜) using the mobile phone.\nSam: I also think the Internet is useful. But I think electricity is the most useful. Many things work with electricity.\n\n26. ( ) Who thinks the mobile phone is the most useful?\n\tA. Sam.\n\tB. Jenny.\n\tC. Alice.\n\n27. ( ) What's the Chinese meaning of the underlined(画线的) words \"air conditioner\"?\n\tA. 风扇\n\tB. 冰箱\n\tC. 空调\n\n28. ( ) Kitty's parents _____.\n\tA. often use mobile phones\n\tB. sell clothes to people from all over the world\n\tC. like to go shopping on the Internet\n\n29. ( ) Kitty often _____ on the Internet.\n\tA. watches the news\n\tB. sends e-mails\n\tC. reads e-books\n\n30. ( ) Which one is TRUE?\n\tA. Alice got a mobile phone from her father at the age of 11.\n\tB. Jenny lives in a cold place and people there often get ill.\n\tC. Sam thinks electricity is useful, but he doesn't think the Internet is useful.\n\n**B**\n\n| Club | Age | Time | Learn | Place |\n| :--- | :--- | :--- | :--- | :--- |\n| English Club | Grades(年级) 3-4 | 3:00 p.m. - 3:50 p.m. Friday | Read English books. Talk with foreigners. | Library |\n| Singing Club | Grades 1-2 | 8:00 a.m. - 10:00 a.m. Saturday | Listen to music. Sing different songs. | Music Room |\n| Science Club | Grades 4-6 | 3:00 p.m. - 4:00 p.m. Thursday | Do experiments(实验). Watch insects. | Science Room |\n| Computer Club | Grade 6 | 3:30 p.m. - 4:30 p.m. Wednesday | Program(编程). Play computer games. | Computer Room |\n\n31. ( ) Tim is in Grade Three. He can join the _____ Club.\n\tA. English\n\tB. Singing\n\tC. Science\n\tD. Computer\n\n32. ( ) Amy is in Grade Six, but she is busy on Thursday. She can join the _____ Club.\n\tA. English\n\tB. Singing\n\tC. Science\n\tD. Computer\n\n33. ( ) You can see this material in a _____.\n\tA. fairy tale\n\tB. science book\n\tC. school poster\n\tD. storybook\n\n34. ( ) In the Science Club, you CAN'T _____.\n\tA. do experiments\n\tB. watch insects\n\tC. learn science\n\tD. program\n\n35. ( ) Which of the following is NOT true?\n\tA. You can read English books and talk with foreigners in the English Club.\n\tB. You can't play computer games in the Computer Club.\n\tC. You can go to the Science Club every Thursday.\n\tD. You can go to the library to join the English Club.\n\n## VI. 连词成句。(共10分)\n\n36. did / learn / how / English / you (?)\n\n37. go / school / to / I / usually / by / bus (.)\n\n38. many shops / there are / in Toronto (.)\n\n39. Mr. Zhao / What / did / do / last weekend (?)\n\n40. else / anything / do / you / Did (?)\n", "proofread_notes": "1. 卷面多处包含“若琳和妈妈-视频通话”等注释，推测为对非试卷内容的描述，已统一删除以保持试卷内容中立性。\n2. 单选题（II）部分，第9、10题的情景说明原位于`context_note`，已移至题干`stem`内，使题目表述更完整、清晰。\n3. 完形填空（IV）部分，根据上下文的过去时态，将第17题选项A的“drive”修正为“drove”，原选项疑为题目错误。\n4. 阅读选择（V）部分，为保持结构清晰，已将B篇阅读材料（表格）从第31题的`context_note`移至大题说明`section_instruction`中，与A篇材料并列。\n5. 已核实并保留了前期校对的成果，如完形填空文章中“The road became slippery”的修正。", "set_number": 25, "source_images": ["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_25\\page_043.png", "C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_25\\page_044.png"], "pipeline": {"mode": "publication_from_images", "workflow": "C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow", "log": {"steps": [{"step": 1, "name": "extract", "items": 40}, {"step": 2, "name": "verify", "items": 40, "check_passed": false, "issues_count": 2}, {"step": 3, "name": "polish", "items": 40}]}, "second_text_pass": false}, "teaching_meta": {"enriched_at_utc": "2026-03-29T14:29:57.760784+00:00", "vertex_model_requested": "gemini-2.5-pro", "stub": false}}</script>

      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",
    "choice",
    "cloze",
    "reading",
    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  /** 卷面/PDF 题干：语音题与词汇填空类允许 &lt;u&gt; 画线词 */
  function examStemAllowsUnderline(row) {
    const typ = row && row.type;
    return typ === "phonetics" || isFillBlankQuizType(typ);
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  /** 选项文案：含 <u> 时按语音题规则渲染下划线，否则转义 */
  function quizOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s);
    return esc(s).replace(/\n/g, "<br>");
  }

  /** PDF/卷面选项：同上，单行空格分隔 */
  function examOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s).replace(/\n/g, " ");
    return esc(s).replace(/\n/g, " ");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干 / 阅读材料中的表格） */
  function markdownPipeTableLinesToHtml(tableLines, extraTableClass) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    const cls =
      "writing-prompt-table" + (extraTableClass ? " " + String(extraTableClass).trim() : "");
    return "<table class='" + cls + "'>" + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines, "");
    });
    return html;
  }

  /** 阅读大题 section_instruction：正文用 passage-para，管道表格用真实 <table>（如 B 篇俱乐部表） */
  function formatReadingPassageInstructionHtml(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    if (!writingStemHasPipeTable(s)) return formatPassageParagraphs(s);
    let html = "";
    partitionMarkdownTextAndPipeTables(s).forEach((ch) => {
      if (ch.kind === "text") html += formatPassageParagraphs(ch.text);
      else {
        const tbl = markdownPipeTableLinesToHtml(ch.lines, "reading-passage-pipe-table");
        if (tbl) html += "<div class='reading-passage-table-wrap'>" + tbl + "</div>";
      }
    });
    return html;
  }

  /** PDF：阅读材料中的管道表格 */
  function markdownPipeTableLinesToExamHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th scope='col'>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return "<table class='exam-reading-pipe-table'>" + thead + body + "</table>";
  }

  function formatReadingPassageInstructionExamHtml(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    if (!writingStemHasPipeTable(s)) return formatPassageParagraphsExam(s);
    let html = "";
    partitionMarkdownTextAndPipeTables(s).forEach((ch) => {
      if (ch.kind === "text") html += formatPassageParagraphsExam(ch.text);
      else {
        const tbl = markdownPipeTableLinesToExamHtml(ch.lines);
        if (tbl) html += "<div class='exam-reading-pipe-table-wrap'>" + tbl + "</div>";
      }
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return formatReadingPassageInstructionHtml(s);
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return formatReadingPassageInstructionExamHtml(s);
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {

        if (outCn.length >= 15) return outCn;

    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);

    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;

      const nx = tail.search(reNextSep);

      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);

    const out = tail.slice(0, end).trim();

    if (!ins || !sectionInstructionHasClozeInlineBlanks(ins)) return false;

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    const reNumDotBlank = /\d+\.\s*_{3,}/g;
    const reNumDotLetterUnd = /\d+\.\s+[A-Za-z]?_{3,}/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotBlank.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotLetterUnd.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;
  }

    const a = /^\((\d+)\)/.exec(m0);

    if (b) return b[1];
    const c = /^(\d+)\.\s*_{3,}/.exec(m0);
    if (c) return c[1];
    const d = /^(\d+)\.\s+[A-Za-z]?_{3,}/.exec(m0);
    return d ? d[1] : "";
