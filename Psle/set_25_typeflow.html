","explanation_md":"本题考查一组易混淆动词的辨析。A `looked` (看，强调动作), B `saw` (看见，强调结果), C `cleaned` (打扫), D `put` (放置)。选项 C 和 D 与“看”的意义无关，可以首先排除。`looked` 和 `saw` 的区别在于：`looked` 是有意识地“看”这个动作，常与介词 `at` 连用（look at...）；而 `saw` 是 `see` 的过去式，指“看见”这个结果，即事物映入眼帘。在记叙文中，描述“我（突然）看到了什么”时，通常用 `saw`。因此，`saw` 是最佳答案。","knowledge_expansion_md":"### 辨析 `see`, `look`, `watch`\n\n这三个动词都与“看”有关，但用法和含义有明显区别，是小升初阶段的重要考点。\n\n*   **`see` (看见)**: 强调“看”的结果，指事物进入视线范围被眼睛捕捉到，常为无意识或偶然的动作。它的过去式是 `saw`。\n    *   例如: `I opened the curtains and saw a beautiful bird.` (我拉开窗帘，看到了一只美丽的鸟。)\n    *   `see` 还可以表示“理解”、“明白”，如 `I see.` (我明白了。)\n\n*   **`look` (看，瞧)**: 强调“看”这个有意识的动作，指把目光投向某个方向。它通常是不及物动词，后面跟宾语时需要借助介词，最常见的是 `at`。\n    *   例如: `Look at the blackboard!` (看黑板！)\n    *   还有很多常用短语，如 `look for` (寻找), `look after` (照顾)。\n\n*   **`watch` (观看，注视)**: 指在一段时间内，聚精会神地观看移动或变化的东西。宾语通常是电视、电影、比赛、表演等。\n    *   例如: `We watched a football match last night.` (我们昨晚看了一场足球赛。)","socratic_tracks":[{"title":"辨析 \"look\" 与 \"see\"","steps":[{"question":"“我看了黑板”和“我看见了黑板上的字”，这两个“看”在意思上有什么不同？","hint":"一个是发出一个动作，另一个是得到了一个结果。","takeaway":"“看”是一个有意识的动作，而“看见”是看这个动作产生的结果。"},{"question":"在英语中，哪个词表示“看”的动作，哪个词表示“看见”的结果？","hint":"一个是 `look`，一个是 `see`。","takeaway":"`look` 强调动作，`see` 强调结果。"},{"question":"如果一个句子想表达“我突然注意到/眼睛里映入了什么东西”，应该用 `look` 还是 `see` 的过去式？","hint":"这是在描述一个结果，而不是一个持续的动作。","takeaway":"描述“看见”这个结果时，应该使用 `see` 的过去式 `saw`。"}]},{"title":"动词与介词搭配","steps":[{"question":"动词 `look` 后面如果想跟一个宾语，比如“看那个男孩”，应该怎么说？","hint":"Look ___ that boy.","takeaway":"`look` 后面通常需要加介词 `at` 才能跟宾语，即 `look at something/somebody`。"},{"question":"那么 `see` 后面需要加介词吗？比如“我看见一个男孩”。","hint":"I saw ___ a boy.","takeaway":"`see` 是及物动词，可以直接跟宾语，不需要介词，即 `see something/somebody`。"}]},{"title":"排除无关选项","steps":[{"question":"我们来看看 C 选项 `cleaned` 和 D 选项 `put`。它们的中文意思是什么？","hint":"`clean` the room, `put` the book on the desk.","takeaway":"`cleaned` 的意思是“打扫”，`put` 的意思是“放置”。"},{"question":"这两个词的意思和“看”或“看见”有关吗？","hint":"打扫、放置和看是完全不同的动作。","takeaway":"根据基本词义，可以快速排除与上下文逻辑不符的 `cleaned` 和 `put`。"}]}]}},{"number":"21","item_type":"cloze","context_note":"Cloze Passage","stem":"( )","options":{"A":"up","B":"back","C":"off","D":"around"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词短语的辨析。根据上下文，因为天气突变开始下雪（Suddenly, Millie (20) snowflakes），Millie收拾好野餐的东西准备离开。这里的动作是“返回”到车里，因此使用短语`get back into`，意为“回到……里去”。选项A `up`（向上）、C `off`（离开）、D `around`（四处）与动词`get`搭配后均不符合语境。因此，正确答案是B。","knowledge_expansion_md":"本题的核心是考查与动词`get`搭配的常用短语。\n- `get back`: 返回，回来。例如：`What time did you get back last night?`\n- `get up`: 起床，站起来。例如：`I get up at 7 a.m. every day.`\n- `get off`: 下（车、船、飞机等）。例如：`We need to get off at the next stop.`\n- `get on`: 上（车、船、飞机等）。例如：`Hurry up and get on the bus!`\n- `get into`: 进入（某个空间或陷入某种状态）。例如：`He got into the car.`\n在初中阶段，掌握这些由常见动词和介词/副词构成的动词短语至关重要。","socratic_tracks":[{"title":"上下文逻辑推理","steps":[{"question":"故事中发生了什么突发情况？","hint":"Millie看到了什么从天而降？","takeaway":"天气突然变坏，开始下雪了。"},{"question":"面对这个情况，Millie 做了什么决定？","hint":"她收拾了野餐的东西（picked up the picnic things）。","takeaway":"她决定中断野餐，准备离开。"},{"question":"那么，她和她的狗 Eddie 接下来应该去哪里？","hint":"她们是开车来的。","takeaway":"她们应该回到车里去。"},{"question":"哪个选项可以和 `get` 以及 `into the car` 搭配，表示“回到车里”这个动作？","hint":"哪个词有“返回”的意思？","takeaway":"只有 `back` 符合，构成 `get back into the car`，意为“回到车里”。"}]},{"title":"动词短语辨析","steps":[{"question":"我们来分析一下动词短语 `get back` 的意思。","hint":"如果你离开家又回来，可以说 `I get back home`。","takeaway":"`get back` 的意思是“返回，回来”。"},{"question":"我们把其他选项代入句子试试。`get up into the car` 是什么意思？通顺吗？","hint":"`get up` 是“起床”或“站起来”。","takeaway":"不通顺，`get up into` 搭配很奇怪，不符合语境。"},{"question":"那 `get off into the car` 呢？","hint":"`get off` 通常是“下车”。","takeaway":"意思与“进入车里”(`into the car`)完全相反，逻辑矛盾。"},{"question":"那 `get around into the car` 呢？","hint":"`get around` 有“四处走动”或“避开”的意思。","takeaway":"不符合进入车里的动作，句意不通。"}]}]}},{"number":"22","item_type":"cloze","context_note":"Cloze Passage","stem":"( )","options":{"A":"him","B":"us","C":"her","D":"me"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查人称代词宾格的用法。空格位于介词`around`之后，需要使用人称代词的宾格形式。根据上下文，故事的主人公是Millie和她的狗Eddie。前文提到`She woke up her dog, Eddie, and put him in the car`，可知Eddie是男性。此处的代词可以指代车里的某个角色，`him`指代的就是小狗Eddie。选项B`us`（我们）和D`me`（我）是第一人称，与第三人称叙事不符。选项C`her`（她）指代Millie。在本题的特定语境下，选择`him`描述雪景环绕小狗的画面是可能的。因此，正确答案是A。","knowledge_expansion_md":"人称代词有主格和宾格之分。\n- **主格**作主语，通常位于句首：I, you, he, she, it, we, they。\n- **宾格**作宾语，通常位于动词或介词之后：me, you, him, her, it, us, them。\n解题时，首先要判断句子成分，确定需要主格还是宾格；其次要根据上下文找到代词指代的对象，确定正确的人称、性别和数。例如，本题中介词`around`后面必须跟宾格，而指代的对象是`Eddie`，所以选择`him`。","socratic_tracks":[{"title":"人称代词宾格","steps":[{"question":"空格前的单词 `around` 是什么词性？它后面应该跟什么形式的代词？","hint":"`around` 是一个介词，想一想 `look around me`。","takeaway":"介词后面需要跟人称代词的宾格形式，如 `me`, `you`, `him`, `her` 等。"},{"question":"故事中有哪些角色可以被代词指代？","hint":"一个女孩和她的宠物。","takeaway":"故事的角色是 Millie（女性）和她的狗 Eddie（男性，前文用 `him` 指代）。"},{"question":"选项 A `him` 指代谁？选项 C `her` 指代谁？","hint":"根据性别判断。","takeaway":"`him` 指代小狗 Eddie，`her` 指代 Millie。"}]},{"title":"排除法应用","steps":[{"question":"为什么不能选 B (us) 和 D (me)？","hint":"故事是用第几人称叙述的？","takeaway":"故事是用第三人称（`She...`, `Millie...`）叙述的，所以第一人称代词 `me` 和 `us` 不正确。"},{"question":"剩下的选项是 `him` 和 `her`。虽然 `her` 也很合理，但题目给出的答案是 `him`。这可能是从一个特定视角来描绘场景，即大雪纷飞，环绕着小狗。","hint":"文学描述有时会切换焦点。","takeaway":"在排除了第一人称代词后，`him` 和 `her` 都是可能的。根据标准答案，本题选择 `him`。"}]}]}},{"number":"23","item_type":"cloze","context_note":"Cloze Passage","stem":"( )","options":{"A":"help","B":"hamburgers","C":"cakes","D":"coats"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查名词词义辨析及上下文逻辑。根据上文，Millie的车撞到冰块后失控打转（went around in circles），这是一个紧急情况。她拿出手机（got her mobile phone）打电话，最合理的行为是“请求帮助”。因此，`asked for help`最符合逻辑。下文“the police came to save them”（警察来救他们）也印证了她是在求助。选项B（汉堡）、C（蛋糕）、D（外套）都是具体物品，在车祸后打电话要这些东西不合常理。因此，正确答案是A。","knowledge_expansion_md":"完形填空题中，名词的选择往往依赖于对故事情节和逻辑的深刻理解。\n1.  **上下文线索**：文章描述了车祸险情（`hit into a piece of ice`, `went around in circles`），紧接着的动作是打电话，后续结果是警察来救援（`the police came to save them`）。整个逻辑链条都指向“求助”。\n2.  **常识判断**：根据生活常识，遇到交通事故等紧急情况时，首要行动是拨打电话求救（ask for help）。\n3.  **固定搭配**：`ask for help` 是一个常见的固定搭配，意为“请求帮助”。\n做这类题时，要将自己代入情境，思考“如果是我，我会怎么做”，利用常识辅助判断。","socratic_tracks":[{"title":"故事情节推理","steps":[{"question":"在打电话之前，Millie 和她的车遇到了什么情况？","hint":"阅读前一句：`the car hit into a piece of ice and it went around in circles`。","takeaway":"她的车在结冰的路上失控了，这是一个危险的紧急情况。"},{"question":"在这种紧急情况下，一个人用手机打电话，最可能要做什么？","hint":"是点外卖，还是向外界求援？","takeaway":"最合理的行为是打电话求救。"},{"question":"看看四个选项，哪个词是“帮助”或“求救”的意思？","hint":"A: help, B: hamburgers, C: cakes, D: coats.","takeaway":"选项 A `help` 意为“帮助”，`ask for help` 就是“请求帮助”。"},{"question":"故事的下一句是什么？它是否能证实我们的推断？","hint":"下一句是 `the police came to save them`。","takeaway":"警察来救他们，这说明 Millie 之前的电话确实是求助电话。这进一步证实了答案是 `help`。"}]},{"title":"词义辨析与常识判断","steps":[{"question":"我们来分析短语 `ask for...` 的意思。","hint":"它的意思是“请求/索要……”。","takeaway":"`ask for` 后面跟的是打电话想要得到的东西。"},{"question":"在车祸后，打电话索要 `hamburgers`（汉堡）、`cakes`（蛋糕）或 `coats`（外套）符合生活常识吗？","hint":"这些是紧急救援物资吗？","takeaway":"不符合。在紧急事故中，首要任务是确保安全和获得救援，而不是索要食物或衣物。"},{"question":"那么，索要 `help`（帮助）是不是最合理的选择？","hint":"对比一下四个选项的合理性。","takeaway":"是的，`ask for help` 是在危急时刻最合乎逻辑和常识的行为。"}]}]}},{"number":"24","item_type":"cloze","context_note":"Cloze Passage","stem":"( )","options":{"A":"first","B":"end","C":"last","D":"problem"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查副词短语的辨析。根据上下文，Millie打电话求助后，警察最终赶到。这里需要一个表示“终于，最后”的词来描述经过等待后的结果。`At last`是一个固定短语，意为“终于”，带有经过等待或困难后事情得以解决的语气，符合语境。选项A `first`构成`At first`（起初），与语境相反。选项B `end`构成的`At end`不是规范的英语短语（应为`In the end`或`At the end of...`）。选项D `problem`（问题）无法与`At`构成通顺的短语。因此，正确答案是C。","knowledge_expansion_md":"在英语叙事中，表示时间顺序和总结的短语非常重要。\n- `At last`: 意为“终于”，通常带有感情色彩，暗示经过了漫长的等待或困难。例：`At last, the rain stopped.`\n- `In the end`: 意为“最终，到头来”，用于描述一系列事件之后的最终结果，侧重于结果本身。例：`We worked hard, and in the end, we succeeded.`\n- `At the end of...`: 意为“在...的末尾”，后面必须跟名词。例：`at the end of the month` (在月底)。\n- `At first`: 意为“起初，首先”，常与`but`, `later`等连用，表示前后的转折或对比。例：`At first I didn't like him, but now we are good friends.`\n理解这些短语的细微差别和用法是提高英语表达地道性的关键。","socratic_tracks":[{"title":"固定搭配辨析","steps":[{"question":"我们想表达警察‘终于’来了，表示经过了一段时间的等待。哪个选项可以和 `At` 搭配表达这个意思？","hint":"想一想 `At first` (起初), `At last` (终于)。","takeaway":"选项 C `last` 可以和 `At` 构成固定短语 `At last`，意思是‘终于’。"},{"question":"我们把 `last` 放入句子中：`At last, the police came to save them.` 这句话通顺吗？符合故事情节吗？","hint":"她打电话求助，然后等待警察到来。","takeaway":"非常通顺，并且符合打电话求助后等待救援的逻辑。"},{"question":"为什么选项 B `end` 不对？`At end` 是一个正确的短语吗？","hint":"我们通常说 `In the end` 或者 `At the end of the story`。","takeaway":"`At end` 不是一个标准的英语固定搭配。表示‘最后’的短语是 `In the end` 或 `At the end of...`，它们都与题干中的 `At ( )` 结构不完全匹配。"}]},{"title":"叙事逻辑与时间副词","steps":[{"question":"故事的时间线是怎样的？","hint":"开车 -> 下雪 -> 遇险 -> 打电话 -> 警察来。","takeaway":"警察到来是这一系列事件的后续结果。"},{"question":"选项 A `first` 构成的 `At first` 是什么意思？用在这里合适吗？","hint":"`At first` 意为‘起初’，通常用于描述事情的开端。","takeaway":"不合适，警察到来是事件的结尾部分，而不是开头。"},{"question":"对比 `At last` 和 `In the end`。`At last` 强调了什么？","hint":"它带有一种如释重负的感觉。","takeaway":"`At last`（终于）常带有感情色彩，强调经过等待或困难。这很符合在雪地里遇险后等待救援的心情。"}]}]}},{"number":"25","item_type":"cloze","context_note":"Cloze Passage","stem":"( )","options":{"A":"at","B":"after","C":"before","D":"on"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查介词的用法。根据句意和生活常识，为了避免因天气突变而遇到麻烦，应该在出行“之前”收听天气预报。句子意为“她说她下次去野餐‘之前’会听天气预报”。选项C `before`（在……之前）表示动作的先后顺序，符合逻辑。选项B `after`（在……之后）表示“野餐之后听天气预报”，不合常理。选项A `at`和D `on`不用于表达这种动作的先后关系。因此，正确答案是C。","knowledge_expansion_md":"本题涉及表示时间顺序的介词辨析：\n\n*   **before (在...之前)**: 表示时间或顺序上的“先”。例：`You should look before you leap.` (三思而后行。)\n*   **after (在...之后)**: 表示时间或顺序上的“后”。例：`She felt tired after a long walk.` (长途步行后她感到很累。)\n\n本题的语境是吸取教训，所以“听天气预报”这个预防措施必须发生在“去野餐”这个行动之前，因此只能用 `before`。\n\n**易错点**：学生容易混淆 `before` 和 `after` 的逻辑顺序。做题时，务必理解整个句子的逻辑关系，判断哪个动作应该先发生。","socratic_tracks":[{"title":"逻辑推理与常识判断","steps":[{"question":"故事的结尾，Millie 从这次经历中学到了什么教训？","hint":"她因为没预料到下雪而陷入困境。","takeaway":"她学到了出行前了解天气的重要性。"},{"question":"那么，“听天气预报”和“去野餐”这两个动作，哪个应该先发生？","hint":"为了做好准备，应该先做什么？","takeaway":"应该先听天气预报，再决定是否去野餐或如何准备。"},{"question":"哪个介词可以表示“在……之前”这个先后顺序？","hint":"A: at, B: after, C: before, D: on.","takeaway":"介词 `before` 表示“在……之前”。"}]},{"title":"介词辨析","steps":[{"question":"我们把选项 B `after` 代入句子：`...listen to the weather report after going on a picnic.` 这句话是什么意思？合理吗？","hint":"`after` 是“在……之后”。","takeaway":"意思是“在野餐之后听天气预报”。这失去了预报的意义，不合逻辑。"},{"question":"为什么不能用 `at` 或 `on`？","hint":"这两个介词通常表示具体的时间点或日期，而不是动作的先后关系。","takeaway":"`at` 和 `on` 不用于连接两个动作来表示它们的发生顺序，因此不适用于本句。"},{"question":"所以，只有 `before` 能正确表达出‘先听预报，后去野餐’的逻辑关系。","hint":"确认 `before` 的含义和用法。","takeaway":"`before` + V-ing 结构是常用用法，表示“在做某事之前”，完全符合本题语境。"}]}]}}]},{"section_title":"V. 阅读选择。(共10分)","section_instruction":"**A**\n\nWhat do you think is the most useful in our life?\nAlice: I think the mobile phone is the most useful. We can talk to people far away from us. And we can send messages, take photos and do many other things with the mobile phone. My father bought one for me when I was eleven. I use it every day.\nJenny: There are many useful things—the train, the car, the plane... but I think the most useful thing is the air conditioner. I live in Hong Kong. It's very hot in summer here. If we don't have air conditioners, we can't work or study. A lot of people will be ill if they don't use them.\nKitty: The Internet is the most useful. My parents have a clothes shop in Shanghai. We have a website (网站). Now, people from all over the world can buy our clothes on our website. We often send e-mails on the Internet. It's fast. And that's cheaper than(比……便宜) using the mobile phone.\nSam: I also think the Internet is useful. But I think electricity is the most useful. Many things work with electricity.\n\n**B**\n\n| Club | Age | Time | Learn | Place |\n| :--- | :--- | :--- | :--- | :--- |\n| English Club | Grades(年级) 3-4 | 3:00 p.m. - 3:50 p.m. Friday | Read English books. Talk with foreigners. | Library |\n| Singing Club | Grades 1-2 | 8:00 a.m. - 10:00 a.m. Saturday | Listen to music. Sing different songs. | Music Room |\n| Science Club | Grades 4-6 | 3:00 p.m. - 4:00 p.m. Thursday | Do experiments(实验). Watch insects. | Science Room |\n| Computer Club | Grade 6 | 3:30 p.m. - 4:30 p.m. Wednesday | Program(编程). Play computer games. | Computer Room |","items":[{"number":"26","item_type":"reading","context_note":"Passage A","stem":"( ) Who thinks the mobile phone is the most useful?","options":{"A":"Sam.","B":"Jenny.","C":"Alice.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节理解题。题目问“谁认为手机最有用？”。根据文章第一段，Alice明确表示：“I think the mobile phone is the most useful.”（我认为手机最有用。）。因此，正确答案是 Alice。","knowledge_expansion_md":"本题考查阅读理解中的**关键信息定位**能力。解题的关键是找到与问题 “Who thinks the mobile phone is the most useful?” 完全匹配的句子。在阅读时，应带着问题中的关键词 `the most useful` 和 `mobile phone` 回到原文中寻找直接陈述观点的句子。Alice 的第一句话就是对这个问题的直接回答，而其他人的观点都集中在别的物品上（Jenny - air conditioner, Kitty - Internet, Sam - electricity）。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目问的是“谁认为手机最有用？”。我们应该在文章中寻找哪几个关键词？","hint":"寻找 'mobile phone' 和 'the most useful'。","takeaway":"带着问题中的核心词汇去原文中寻找答案，可以提高阅读效率和准确性。"},{"question":"请在文章中找出直接回答这个问题的句子。","hint":"看文章开头 Alice 的第一句话。","takeaway":"Alice 说：'I think the mobile phone is the most useful.' 这句话直接给出了答案。"},{"question":"Jenny, Kitty 和 Sam 分别认为什么最有用？","hint":"Jenny 认为空调最有用，Kitty 认为网络最有用，Sam 认为电最有用。","takeaway":"通过对比不同人物的观点，可以确认只有 Alice 认为手机最有用，从而验证答案的正确性。"}]}]}},{"number":"27","item_type":"reading","context_note":"Passage A","stem":"( ) What's the Chinese meaning of the underlined(画线的) words \"air conditioner\"?","options":{"A":"风扇","B":"冰箱","C":"空调","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道词义猜测题。题目要求解释划线词组 “air conditioner” 的中文意思。即使不认识这个词组，我们也可以通过上下文来推断。根据 Jenny 的描述，她住在香港，“It's very hot in summer here.”（这里夏天很热），并且如果没有 “air conditioners”，人们就无法工作或学习。由此可知，“air conditioner” 是一种在炎热天气中用来降温的设备。在三个选项中，只有 C “空调”符合这个功能描述。","knowledge_expansion_md":"本题考查**利用上下文猜测词义**的能力，这是阅读中的一项重要技能。\n\n**1. 猜测词义的线索**：\n*   **定义或解释**：作者有时会直接解释一个词，如 `An air conditioner is a machine that makes the air in a room cool.`\n*   **举例**：通过例子来帮助理解，如 `I like home appliances, for example, the TV, the fridge, and the air conditioner.`\n*   **逻辑关系**：利用因果、对比、转折等关系。本题就是利用了“天热”（因）与“让房间凉快”（果）的因果逻辑。\n*   **构词法**：分析单词的词根、前缀、后缀。`air` (空气) + `conditioner` (调节器) → 空气调节器，即空调。\n\n**2. 常见家用电器词汇**：\n*   `refrigerator` / `fridge`: 冰箱\n*   `washing machine`: 洗衣机\n*   `fan`: 风扇\n*   `television` / `TV`: 电视\n*   `microwave`: 微波炉\n*   `heater`: 暖气","socratic_tracks":[{"title":"上下文猜词义","steps":[{"question":"当我们在阅读中遇到不认识的单词时，除了查字典，还能用什么方法来弄懂它的意思？","hint":"观察这个单词前后的句子，看看有没有提供线索。","takeaway":"利用上下文提供的线索来猜测词义，是阅读时必须掌握的技能。"},{"question":"文中提到了 'summer' (夏天) 和 'hot' (热)，还说没有这个东西人们就 'can't work or study' (无法工作或学习)。这些信息告诉了我们什么？","hint":"这些信息描述了这个东西的功能和使用场景。","takeaway":"上下文描述了 'air conditioner' 的功能是制冷。"},{"question":"对比选项 A (风扇), B (冰箱), C (空调)，哪一个最符合“夏天天热时让整个房间凉快”这个功能？","hint":"冰箱是用来冷藏食物的，不能让房间凉快。风扇是吹风，降温效果有限。空调可以直接调节室温。","takeaway":"通过功能匹配，我们可以准确地将上下文线索与正确选项“空调”联系起来。"}]},{"title":"构词法分析","steps":[{"question":"'air conditioner' 这个词组是由哪两个我们可能认识的单词组成的？","hint":"第一个词是 'air'，第二个词是 'conditioner'。","takeaway":"这个词组由 'air' 和 'conditioner' 复合而成。"},{"question":"'air' 是“空气”的意思。'condition' 作为动词有“调节”的意思，那么加了 '-er' 后缀的 'conditioner' 可能是什么意思？","hint":"动词后面加 '-er' 或 '-or' 通常表示“做这个动作的人或物”，比如 'teach' (教) -> 'teacher' (老师)。","takeaway":"'conditioner' 的意思是“调节器”或“调节装置”。"},{"question":"把“空气”和“调节器”这两个意思合在一起，你觉得它最可能指什么家用电器？","hint":"调节空气温度的机器。","takeaway":"通过构词法分析，“空气调节器”就是我们所说的“空调”。"}]},{"title":"区分相关词汇","steps":[{"question":"选项 A '风扇' 的英文是什么？它和 'air conditioner' 的作用有什么不同？","hint":"风扇是 'fan'。它通过加速空气流动让人感觉凉快，但不能改变空气的温度。","takeaway":"'fan' 产生风，'air conditioner' 改变温度，两者制冷原理和效果不同。"},{"question":"选项 B '冰箱' 的英文是什么？它的主要功能是什么？","hint":"冰箱是 'refrigerator' 或 'fridge'。它的功能是在一个密闭空间里制冷以保存食物。","takeaway":"'refrigerator' 用于冷藏食物，而不是为整个房间降温。"}]}]}},{"number":"28","item_type":"reading","context_note":"Passage A","stem":"( ) Kitty's parents _____.","options":{"A":"often use mobile phones","B":"sell clothes to people from all over the world","C":"like to go shopping on the Internet","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目问关于 Kitty 父母的哪项描述是正确的。根据 Kitty 的话：“Now, people from all over the world can buy our clothes on our website.”（现在，来自世界各地的人们都可以在我们的网站上购买我们的衣服。）这说明她的父母通过网站把衣服卖给世界各地的人。因此，选项 B “sell clothes to people from all over the world”（把衣服卖给来自世界各地的人）是正确的。选项 A “经常使用手机”在文中没有提及。选项 C “喜欢在网上购物”与原文他们是“卖”衣服的事实相反。","knowledge_expansion_md":"本题考查阅读理解中的**信息推断**和**反义词辨析**能力。\n\n1.  **信息推断**：正确选项 B 并非原文的直接复制，而是基于原文信息的合理推断。原文说“people from all over the world can buy our clothes”（来自世界各地的人们可以购买我们的衣服），我们可以从中推断出，Kitty 的父母“sell clothes to people from all over the world”（把衣服卖给世界各地的人）。`buy`（买）和 `sell`（卖）是交易的两个方面。\n\n2.  **同义转述**：在阅读理解题中，正确选项常常是对原文信息的同义转述。本题中，`people from all over the world` 在原文和选项中都出现了，是定位关键信息的线索。\n\n3.  **注意反义词陷阱**：出题者常使用反义词或混淆词来设置干扰项，如本题的 `sell` (卖) vs. `shopping`/`buy` (买)。选项 C 使用 `go shopping`，与原文中 Kitty 父母作为卖家的角色完全相反，是典型的干扰项。","socratic_tracks":[{"title":"信息推断与验证","steps":[{"question":"要回答这个问题，我们应该在文章中找到哪位同学的发言？","hint":"题目中提到了 'Kitty's parents'。","takeaway":"根据题干中的人名 'Kitty' 定位到相关段落。"},{"question":"在 Kitty 的描述中，关于她父母生意的关键句是什么？","hint":"找到关于 'website' 和 'buy clothes' 的句子。","takeaway":"关键句是 'Now, people from all over the world can buy our clothes on our website.'。"},{"question":"如果“世界各地的人们可以购买他们的衣服”，这说明 Kitty 的父母在做什么？","hint":"买和卖是交易的双方。一方买，另一方就在卖。","takeaway":"这意味着 Kitty 的父母在“向世界各地的人们出售衣服”，这与选项 B 的意思一致。"},{"question":"为什么选项 C 'like to go shopping on the Internet' 是错的？","hint":"比较 'go shopping' (购物/买东西) 和他们实际做的事情。","takeaway":"他们的角色是卖家 (seller)，而不是买家 (shopper)，选项 C 描述的动作与事实相反。"}]}]}},{"number":"29","item_type":"reading","context_note":"Passage A","stem":"( ) Kitty often _____ on the Internet.","options":{"A":"watches the news","B":"sends e-mails","C":"reads e-books","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目问 Kitty 经常在网上做什么。根据文章中 Kitty 的话：“We often send e-mails on the Internet.”（我们经常在网上发送电子邮件。）。这里的 “We”（我们）包含了 Kitty 本人，因此可以推断出 Kitty 经常发送电子邮件。选项 B “sends e-mails”（发送电子邮件）与原文信息一致。选项 A 和 C 在文中没有提及。","knowledge_expansion_md":"### 考点：现在时态与网络活动词汇\n\n1.  **一般现在时**：本题中 `often`（经常）是频度副词，是一般现在时的标志词之一。当主语是第三人称单数（如 Kitty）时，动词需要使用第三人称单数形式，例如 `sends`, `watches`, `reads`。\n2.  **网络活动相关动词短语**：\n    *   `surf the Internet` 上网\n    *   `send/receive e-mails` 发送/接收电子邮件\n    *   `chat online` / `chat with friends` 在线聊天\n    *   `watch videos/movies` 看视频/电影\n    *   `read news/e-books` 看新闻/读电子书\n    *   `play computer/online games` 玩电脑/网络游戏\n    *   `do online shopping` 网上购物","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"要回答这个问题，我们应该在文章中寻找哪位同学的发言？","hint":"题干的主语是 'Kitty'。","takeaway":"首先根据题干中的核心名词（如人名 Kitty）回原文定位到相关段落。"},{"question":"在 Kitty 的发言中，找到描述她和家人在网上活动的句子。","hint":"寻找含有 'Internet' 和频度副词 'often' 的句子。","takeaway":"关键句是 'We often send e-mails on the Internet.'。"},{"question":"句中的主语 'We' 指的是谁？它是否包括 Kitty？","hint":"Kitty 在介绍她和她的父母，所以 'We' 指的是他们一家人。","takeaway":"既然 'We' (我们) 经常发邮件，那么作为其中一员的 Kitty 自然也经常发邮件。因此可以确定答案。"}]},{"title":"辨析动词词义","steps":[{"question":"我们来看看三个选项的动词：watches, sends, reads。它们分别是什么意思？","hint":"watch a movie, send a letter, read a book... 思考这些搭配。","takeaway":"准确理解选项中核心动词的含义是做出正确选择的基础。"},{"question":"原文描述 Kitty 的动作与哪个选项的动词意思最匹配？","hint":"原文提到“e-mails”，哪个动词最常和“e-mails”搭配？","takeaway":"将原文信息与选项动词进行匹配，选择最符合原文描述的一项。"}]},{"title":"频度副词与时态","steps":[{"question":"题干中有一个词 `often`，它是什么意思？在句子中起什么作用？","hint":"它表示动作发生的频率高低。","takeaway":"`often` 是频度副词，意为“经常”，表示动作的常态化。"},{"question":"为什么 `often` 出现时，动词通常用 `sends` 而不是 `is sending` 或 `sent`？","hint":"思考一下“经常做某事”描述的是一个习惯性的动作，还是正在发生或已经发生的动作？","takeaway":"频度副词（如 often, usually, always）常与一般现在时连用，描述习惯性、规律性的动作。"}]}]}},{"number":"30","item_type":"reading","context_note":"Passage A","stem":"( ) Which one is TRUE?","options":{"A":"Alice got a mobile phone from her father at the age of 11.","B":"Jenny lives in a cold place and people there often get ill.","C":"Sam thinks electricity is useful, but he doesn't think the Internet is useful.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节判断题。需要将每个选项与原文A进行比对。\n*   选项 A：原文中 Alice 说：“My father bought one for me when I was eleven.” (我爸爸在我十一岁时给我买了一个。) 选项 A “Alice got a mobile phone from her father at the age of 11.” (Alice 11岁时从她爸爸那里得到了一个手机。) 与原文信息完全一致，因此 A 正确。\n*   选项 B：原文中 Jenny 说：“I live in Hong Kong. It's very hot in summer here.” (我住在香港，这里夏天很热。) 选项 B 说 Jenny 住在一个寒冷的地方 (a cold place)，与原文矛盾，因此 B 错误。\n*   选项 C：原文中 Sam 说：“I also think the Internet is useful. But I think electricity is the most useful.” (我也认为互联网很有用。但我认为电是最有用的。) 选项 C 说他认为互联网“没用”(doesn't think the Internet is useful)，与原文矛盾，因此 C 错误。","knowledge_expansion_md":"### 考点：细节辨析与逻辑判断\n\n1.  **细节核对**：做正误判断题（TRUE/FALSE questions）时，核心技巧是“细节为王”。必须将选项中的每个信息点（人名、地点、时间、物品、关系、观点等）与原文进行精确比对，任何一个细节不符都可能导致选项错误。\n2.  **偷换概念**：出题者常使用“偷换”的手法设置干扰项，例如：\n    *   偷换人物：`father` 换成 `mother`。\n    *   偷换观点：用 `but` 替换 `and`，将并列关系变为转折关系，完全改变了句意。\n    *   偷换程度：`some` (一些) 换成 `all` (所有)。\n3.  **同义替换**：正确选项有时不会完全照搬原文词句，而是使用同义词或短语进行替换。例如，原文可能是 `catch a cold`（感冒），而选项中是 `get ill`（生病），这属于合理的概括，是正确的同义转述。","socratic_tracks":[{"title":"逐一排除法","steps":[{"question":"对于“Which one is TRUE?”这类问题，最好的方法是什么？","hint":"我们能一次就找出正确答案吗？还是需要检查每一个选项？","takeaway":"解决正误判断题的最佳策略是逐一核对每个选项，用排除法找到唯一正确的一项。"},{"question":"我们来检查选项A。关于Alice的陈述，原文和选项之间是否一致？","hint":"找到原文中Alice说的话，核对送手机的人和她的年龄。","takeaway":"选项A与原文信息完全相符。做题时要仔细核对人名、时间、关系等关键细节。"},{"question":"再看选项C。Sam对互联网的态度是什么？选项中的描述与原文矛盾吗？","hint":"原文说 'I also think the Internet is useful.'，而选项C说 'he doesn't think the Internet is useful.'","takeaway":"连词（如 but, also）的改变会彻底改变句子的逻辑和含义，需要高度警惕。"}]},{"title":"识别反义词干扰","steps":[{"question":"我们来看看选项B为什么是错的。原文说Jenny住的地方天气怎么样？选项B又是怎么说的？","hint":"原文用的是 'hot'，选项用的是 'cold'。","takeaway":"出题者常用反义词来设置干扰项，这是阅读理解题中常见的错误类型，需要仔细辨别。"}]}]}},{"number":"31","item_type":"reading","context_note":"Passage B","stem":"( ) Tim is in Grade Three. He can join the _____ Club.","options":{"A":"English","B":"Singing","C":"Science","D":"Computer"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为图表信息筛选题。题目要求为三年级（Grade Three）的 Tim 选择一个可以参加的俱乐部。我们需要在表格B中查找各个俱乐部的年级要求。\n*   English Club: 年级要求是 Grades 3-4。Tim 是三年级，符合要求。\n*   Singing Club: 年级要求是 Grades 1-2。Tim 不符合要求。\n*   Science Club: 年级要求是 Grades 4-6。Tim 不符合要求。\n*   Computer Club: 年级要求是 Grade 6。Tim 不符合要求。\n因此，Tim 只能参加英语俱乐部（English Club）。","knowledge_expansion_md":"### 考点：图表信息获取与情态动词 `can`\n\n1.  **图表/海报类信息提取**：这类题目通常以海报、通知、时间表等形式出现，考察学生快速定位和筛选特定信息的能力。解题步骤如下：\n    *   **读懂题干**：明确要寻找什么信息（本题是“三年级学生能参加的俱乐部”）。\n    *   **定位关键词**：带着关键词（`Grade Three`）去图表中寻找。\n    *   **匹配信息**：找到包含关键词的条目，并确认其是否满足题干所有要求。\n2.  **序数词**：表示年级时常用序数词，如 `Grade Three` (三年级), `Grade Six` (六年级)。需要掌握 `one-first`, `two-second`, `three-third` 等基数词和序数词的转换规则。\n3.  **情态动词 `can`**：`can` 在此表示“可以、能够”，表示具备某种资格或条件。`He can join the club.` 意思是他有资格加入这个俱乐部。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"看到这道题，你觉得最重要的信息是什么？","hint":"题目里提到了一个叫 Tim 的人，他有什么特点？","takeaway":"解题的第一步是抓住题干中的核心条件，即“Tim is in Grade Three”。"},{"question":"带着“Grade Three”这个信息，我们应该去表格里找什么？","hint":"寻找哪个俱乐部的介绍里提到了“Grade Three”？","takeaway":"利用关键词回原文或图表中进行扫描，可以快速定位到相关信息区域。"}]},{"title":"信息匹配与确认","steps":[{"question":"我们来核对表格。哪个俱乐部的年级要求包括'Grade Three'？","hint":"仔细看表格中'Age'那一列。","takeaway":"表格信息题的关键是精确定位和匹配。英语俱乐部（English Club）的要求是'Grades 3-4'，完全符合Tim的年级。"},{"question":"为什么其他俱乐部不行？比如科学俱乐部（Science Club）？","hint":"看科学俱乐部的年级要求是什么？","takeaway":"科学俱乐部的要求是'Grades 4-6'，三年级的Tim不符合条件。做选择题时，不仅要确认正确答案，也要明白其他选项为什么错。"}]}]}},{"number":"32","item_type":"reading","context_note":"Passage B","stem":"( ) Amy is in Grade Six, but she is busy on Thursday. She can join the _____ Club.","options":{"A":"English","B":"Singing","C":"Science","D":"Computer"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题为多条件信息筛选题。题目给出了关于 Amy 的两个条件：1. 她在六年级（in Grade Six）；2. 她周四（Thursday）很忙。我们需要在表格B中找到一个同时满足这两个条件的俱乐部。\n1.  **筛选年级**：根据表格，六年级学生可以参加的俱乐部有：科学俱乐部（Science Club，要求 Grades 4-6）和电脑俱乐部（Computer Club，要求 Grade 6）。\n2.  **筛选时间**：Amy 周四很忙，不能参加周四的活动。科学俱乐部的活动时间是周四（Thursday），因此她不能参加。\n3.  **最终决定**：电脑俱乐部的活动时间是周三（Wednesday），Amy 在这一天有空。因此，她可以参加电脑俱乐部。所以选项 D 正确。","knowledge_expansion_md":"### 考点：多条件筛选与逻辑排除法\n\n1.  **处理多重条件**：这是比单条件筛选更进一步的能力考察。学生需要能够同时处理并满足题干中给出的所有限制条件。解题时可以采用“逐步筛选”的策略：先用第一个条件筛选出一批候选项，再用第二个条件在这些候选项中做进一步筛选。\n2.  **逻辑连词 `but`**：连词 `but`（但是）在题目中起着至关重要的作用，它引出了一个限制性或转折性条件。看到 `but`，就意味着情况发生了变化，必须将 `but` 后面的信息作为排除标准。\n3.  **星期词汇**：熟练掌握一周七天的英文表达是必要的：`Monday`, `Tuesday`, `Wednesday`, `Thursday`, `Friday`, `Saturday`, `Sunday`。\n4.  **排除法（Process of Elimination）**：这是解决多选题，尤其是多条件限制题的有效方法。通过排除明显不符合条件的选项，缩小选择范围，最终确定正确答案。","socratic_tracks":[{"title":"分解多重条件","steps":[{"question":"要帮 Amy 选俱乐部，我们需要考虑她的几个条件？分别是什么？","hint":"仔细阅读题目，找到描述 Amy 情况的两个关键句子。","takeaway":"解决复杂问题的第一步是将其分解为几个简单的条件：①六年级；②周四没空。"},{"question":"我们应该先用哪个条件来筛选？","hint":"先确定她有哪些资格，再看她的时间是否允许。哪个更基础？","takeaway":"可以先用“年级”这个硬性资格条件进行第一轮筛选，缩小范围。"}]},{"title":"应用排除策略","steps":[{"question":"根据表格，六年级的Amy可以报名哪些俱乐部？","hint":"查看'Age'一栏，找到包含'Grade 6'的俱乐部。","takeaway":"第一步筛选后，我们发现科学俱乐部和电脑俱乐部是备选项。"},{"question":"现在用第二个条件“周四很忙”来排除。科学俱乐部和电脑俱乐部哪个在周四活动？","hint":"查看'Time'一栏，注意'but she is busy on Thursday'这个关键信息。","takeaway":"科学俱乐部在周四活动，所以应被排除。剩下的电脑俱乐部就是正确答案。"}]}]}},{"number":"33","item_type":"reading","context_note":"Passage B","stem":"( ) You can see this material in a _____.","options":{"A":"fairy tale","B":"science book","C":"school poster","D":"storybook"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题要求判断文章B的体裁。根据文章B的内容，它用表格形式列出了学校各个俱乐部（Club）的名称、年级要求（Age）、活动时间（Time）、活动内容（Learn）和地点（Place）。这种为了向学生发布活动信息、进行宣传的材料，最常见的形式就是学校海报（school poster）或通知。因此，C选项“学校海报”是最符合文章内容和形式的描述。A（童话）、B（科学书）和D（故事书）都与文章的公告性质不符。","knowledge_expansion_md":"### 文体辨析 (Genre Identification)\n\n在英语阅读中，识别文章体裁是一项基本技能。不同的文体有其独特的语言风格、结构和目的。\n\n*   **海报/通知 (Poster/Notice):** 语言简洁、信息集中，常使用标题、列表、关键词（如时间、地点、活动）来吸引注意和快速传递信息。目的是告知或宣传。\n*   **故事/小说 (Story/Novel):** 通常有情节、角色、背景设定，按时间顺序叙述事件。目的是娱乐或启发。\n*   **说明文/科普文 (Expository/Science Article):** 以解释概念、介绍知识为目的，语言客观、准确，常包含事实、数据和图表。\n*   **信件/邮件 (Letter/Email):** 有固定的格式，如称呼、正文、结束语和署名。目的是沟通信息或情感。","socratic_tracks":[{"title":"文体特征识别","steps":[{"question":"这篇文章大概讲了什么内容？是关于俱乐部、活动时间、地点等信息吗？","hint":"看看表格B里都有哪些信息？比如'Club', 'Time', 'Place'。","takeaway":"文章内容是关于学校社团的招新或活动安排。"},{"question":"那么，在学校里，你通常会在哪里看到这类关于社团活动的信息呢？是印在书里，还是贴在墙上？","hint":"想一想学校的公告栏或宣传栏。","takeaway":"这类信息通常以海报或通知的形式出现在校园里。"},{"question":"对比四个选项，哪个最能准确地描述这种用来发布学校活动信息的东西？","hint":"A是童话，B是科学书，C是学校海报，D是故事书。","takeaway":"“学校海报”（school poster）是承载这类信息最常见的体裁。"}]},{"title":"排除法应用","steps":[{"question":"这篇文章像是一个“很久很久以前”开始的童话故事（fairy tale）吗？","hint":"童话通常有王子、公主、魔法等元素。","takeaway":"文章内容与童话无关，所以排除A选项。"},{"question":"这篇文章是在系统地讲解科学知识，像一本科学书（science book）吗？","hint":"科学书会详细解释原理，而这篇文章只是提到了“科学俱乐部”。","takeaway":"文章只是宣传一个俱乐部，而非系统教学，所以排除B选项。"},{"question":"那么，一份介绍学校俱乐部活动、时间和地点的材料，最可能是什么？","hint":"它是一种公告，用于在学校里张贴。","takeaway":"这正是一份学校海报（school poster）的功能和特点。"}]}]}},{"number":"34","item_type":"reading","context_note":"Passage B","stem":"( ) In the Science Club, you CAN'T _____.","options":{"A":"do experiments","B":"watch insects","C":"learn science","D":"program"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这道题考察对文章细节的理解和逻辑推理。题目问在科学俱乐部（Science Club）“不能”做什么。根据常识和学校俱乐部的设定，科学俱乐部的主题是科学。因此，A选项“做实验（do experiments）”、B选项“观察昆虫（watch insects）”和C选项“学习科学（learn science）”都是科学俱乐部非常典型的活动。而D选项“编程（program）”通常属于电脑俱乐部（Computer Club）的活动范畴。因此，可以合理推断在科学俱乐部不能进行编程活动。","knowledge_expansion_md":"### 阅读中的推理判断 (Inference in Reading)\n\n在阅读理解中，有些信息不会在文章中直接说明，需要读者根据已有信息和生活常识进行逻辑推理。这类题目常含有“infer”, “imply”, “suggest”或如此题的“CAN'T”等词。\n\n**解题技巧：**\n1.  **定位相关信息：** 找到问题中关键词（如本题的“Science Club”）在文中的相关描述。\n2.  **结合常识：** 将文中的信息与自己的背景知识和常识相结合。\n3.  **正向排除/反向推断：** 对于“CAN'T”或“NOT”类问题，可以先找出文中提到或符合逻辑的选项（能做的事情），剩下的那个就是答案。\n\n**相关词汇拓展：**\n*   **俱乐部活动:** `debate` (辩论), `drama` (戏剧), `robotics` (机器人), `gardening` (园艺), `calligraphy` (书法)。","socratic_tracks":[{"title":"信息归类与常识","steps":[{"question":"“Science Club”的中文意思是什么？它的主题应该是什么？","hint":"Science 的意思是“科学”。","takeaway":"科学俱乐部的主题是关于科学的。"},{"question":"我们来看四个选项：做实验、观察昆虫、学习科学、编程。哪些活动和你理解的“科学”主题直接相关？","hint":"物理、化学实验，生物观察都属于科学范畴。","takeaway":"做实验、观察昆虫和学习科学都与科学主题紧密相关。"},{"question":"那么剩下的“编程(program)”活动，你觉得它更可能属于哪个俱乐部？","hint":"编程需要使用什么工具？","takeaway":"编程通常是在电脑上进行的，所以它最可能属于电脑俱乐部。"},{"question":"既然编程属于电脑俱乐部，那么在科学俱乐部里，你“不能”做的事情是哪一件？","hint":"题目问的是“CAN'T”做什么。","takeaway":"因此，在科学俱乐部里不能做的事情是编程。"}]},{"title":"否定式问题策略","steps":[{"question":"这道题的关键词是什么？是“CAN”还是“CAN'T”？","hint":"注意题目中的大写字母“CAN'T”。","takeaway":"关键词是“CAN'T”，意思是“不能”。"},{"question":"这意味着我们需要在四个选项中找出一个“错误”的或者“不相关”的活动，对吗？","hint":"是的，我们要找的是科学俱乐部“不”包含的活动。","takeaway":"解题目标是找出那个不属于科学俱乐部的活动。"},{"question":"请逐一判断：科学俱乐部“能”做实验吗？“能”观察昆虫吗？“能”学习科学吗？","hint":"根据常识判断这些活动是否属于科学范畴。","takeaway":"这三项都是科学俱乐部的常规活动，所以它们是“能”做的。"},{"question":"排除了三项“能”做的活动后，剩下的哪一项就是“不能”做的？","hint":"剩下的就是D选项“编程”。","takeaway":"通过排除法，可以确定在科学俱乐部不能做的事情是编程。"}]},{"title":"词汇与主题关联","steps":[{"question":"“Experiment”是什么意思？它和哪个学科关系最密切？","hint":"化学、物理等都属于 Science，它们都需要做 experiment。","takeaway":"Experiment（实验）是科学的核心活动之一。"},{"question":"“Insect”是什么意思？观察它属于哪个科学分支？","hint":"昆虫是动物的一种，研究动植物的科学叫什么？","takeaway":"Insect（昆虫）是生物学（Biology）的研究对象，属于科学范畴。"},{"question":"“Program”是什么意思？这个词通常和什么东西联系在一起？","hint":"我们用什么来“program”？","takeaway":"Program（编程）是计算机科学（Computer Science）的核心活动。"}]}]}},{"number":"35","item_type":"reading","context_note":"Passage B","stem":"( ) Which of the following is NOT true?","options":{"A":"You can read English books and talk with foreigners in the English Club.","B":"The Computer Club is open on Wednesday.","C":"You can go to the Science Club every Thursday.","D":"You can go to the library to join the English Club."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这道题是“细节判断题”，要求选出“不正确”的一项。我们需要根据表格信息，逐一核对每个选项。\n*   A: 该选项内容与表格中英语俱乐部“Learn”项下的“Read English books. Talk with foreigners.”信息一致，故陈述正确。\n*   B: 该选项指出电脑俱乐部在周三活动，与表格中“Time”项下的“Wednesday”信息一致，故陈述正确。\n*   C: 该选项指出科学俱乐部在周四活动，与表格中“Time”项下的“Thursday”信息一致，故陈述正确。\n*   D: 该选项说“去图书馆**加入**英语俱乐部”。表格只说明了英语俱乐部的活动**地点(Place)**是图书馆(Library)，但并未说明**加入(join)**的地点。活动地点和报名加入的地点可能不同。因此，这个陈述很可能是错误的，它混淆了两个概念。在其他三项都正确的情况下，此项为答案。","knowledge_expansion_md":"### “照妖镜”：如何破解“NOT True”题型\n\n“Which ... is NOT true?”是阅读理解中的高频难题，因为它要求读者具备极高的细心和准确性。这类题目被称为“逆向选择题”。\n\n**解题“三步法”：**\n1.  **审题画圈：** 首先圈出题干中的“NOT”，提醒自己要找的是“错误”或“未提及”的选项。\n2.  **正向定位：** 将A、B、C、D四个选项带回原文，像做普通细节题一样，一一寻找它们在文中的依据。能找到明确依据的，就是“True”的选项，可以先排除掉。\n3.  **锁定答案：** 剩下的那个选项，通常有以下几种“错误”特征：\n    *   **与原文信息完全相反。**\n    *   **张冠李戴：** 把A事物的信息安到B事物上。\n    *   **无中生有：** 选项内容在原文中根本没有提及。\n    *   **以偏概全或过于绝对：** 如把`some`（一些）说成`all`（所有）。\n    *   **偷换概念：** 如本题中可能存在的，将“活动地点”偷换为“报名地点”。","socratic_tracks":[{"title":"“NOT True”题型策略","steps":[{"question":"当题目问“Which of the following is NOT true?”时，我们是要找对的选项还是错的选项？","hint":"“NOT true”的意思是“不正确的”。","takeaway":"我们需要在四个选项中找出一个与原文信息不符的错误陈述。"},{"question":"一个好的做题方法是怎样的？是直接找那个错误的，还是先把正确的都找出来？","hint":"在文中找到一个明确的证据来证明某个选项是“对的”，会比证明它是“错的”更容易。","takeaway":"最好的策略是逐一核对选项，在原文中为正确的选项找到依据，然后排除它们。"}]},{"title":"动词细节辨析","steps":[{"question":"我们来看D选项：“You can go to the library to **join** the English Club.” 这里的关键动词是什么？","hint":"这个动词描述了你要去图书馆做的一件事。","takeaway":"关键动词是“join”，意思是“加入、参加”。"},{"question":"想一想，“加入”一个俱乐部（比如填表报名）和在这个俱乐部里“活动”（比如开会、读书），一定是同一回事、在同一个地方吗？","hint":"例如，你可能在学生处报名，但活动地点在体育馆。","takeaway":"“加入”和“活动”是两个不同的概念，可能发生在不同的地点。"},{"question":"因此，即使文章说英语俱乐部在图书馆“活动”，D选项说去图书馆“加入”俱乐部，这句话还一定正确吗？","hint":"文章可能没有提到“加入”的地点，或者提到了一个不同的地点。","takeaway":"这个陈述很可能不正确，因为它混淆了两个不同的概念，这是阅读题中常见的陷阱。"}]},{"title":"信息核对与排除","steps":[{"question":"我们来逐一核对A、B、C选项。A说在英语俱乐部读书、和外国人交谈。这在表格里写了吗？","hint":"查看English Club的'Learn'一栏。","takeaway":"是的，表格里写了。所以A是正确的陈述。"},{"question":"B说电脑俱乐部周三活动，C说科学俱乐部周四活动。这两条信息在表格里能直接找到吗？","hint":"分别查看电脑俱乐部和科学俱乐部的'Time'一栏。","takeaway":"是的，表格明确列出了时间。所以B和C都是正确的陈述。"},{"question":"现在A、B、C都被证实是正确的了。在只剩D选项的情况下，我们可以确定它就是那个“不正确”的陈述。D选项的“错误”点在哪里？","hint":"回顾一下“动词细节辨析”的结论，比较“活动地点”和“加入地点”的区别。","takeaway":"D选项的错误在于混淆了“活动地点”（在图书馆）和“加入地点”（未提及），因此该陈述无法被原文证实，是本题的答案。"}]}]}}]},{"section_title":"VI. 连词成句。(共10分)","section_instruction":"","items":[{"number":"36","item_type":"sentence_transform","context_note":"","stem":"did / learn / how / English / you (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"How did you learn English?","explanation_md":"本题是连词成句，要求将给出的单词组成一个符合语法和逻辑的句子。给出的单词中有疑问词`how`和问号`?`，因此应构成一个特殊疑问句。句子中还有助动词`did`，表明是过去时态。特殊疑问句在一般过去时的基本结构是：**疑问词 + did + 主语 + 动词原形 + 其他成分?**\n1.  疑问词是 `how` (如何)。\n2.  助动词是 `did`。\n3.  主语是 `you` (你)。\n4.  动词原形是 `learn` (学习)。\n5.  其他成分是宾语 `English` (英语)。\n将它们按顺序组合并加上问号，就得到正确答案：`How did you learn English?`","knowledge_expansion_md":"### 英语疑问句大盘点\n\n英语中的疑问句主要分为两大类：\n\n1.  **一般疑问句 (Yes/No Questions):** 回答是“Yes”或“No”的问句。通常将助动词、情态动词或be动词提到句首。\n    *   `Are you a student?` (be动词提前)\n    *   `Do you like English?` (助动词do/does提前)\n    *   `Did you learn English?` (助动词did提前)\n    *   `Can you speak English?` (情态动词can提前)\n\n2.  **特殊疑问句 (Wh-Questions):** 以特殊疑问词开头，要求提供具体信息的问句。基本结构为：**特殊疑问词 + 一般疑问句语序**。\n    *   **特殊疑问词:** `what` (什么), `who` (谁), `where` (哪里), `when` (何时), `why` (为什么), `how` (如何), `which` (哪个)等。\n    *   **结构:** `What do you like?` / `Where did you go?` / `How can I get there?`\n\n**易错点：** 在含有助动词 `do`, `does`, `did` 的疑问句中，后面的主要动词必须使用**原形**！错误示范：`How did you learned English?`","socratic_tracks":[{"title":"特殊疑问句结构","steps":[{"question":"看到这些单词里有 `how` 和 `?`，你觉得这个句子应该是什么类型的句子？","hint":"是陈述一件事情，还是在问一个问题？问的是“是不是”，还是“怎么样”？","takeaway":"这是一个以 `How` 开头的特殊疑问句。"},{"question":"特殊疑问句的基本语序是怎样的？疑问词后面通常跟什么？","hint":"想想你问别人“你叫什么名字？” -> `What is your name?` 疑问词 `What` 后面是 `is`。","takeaway":"特殊疑问句的结构通常是“疑问词 + 助动词/be动词/情态动词 + 主语...”。"},{"question":"根据这个结构，请把 `how`, `did`, `you`, `learn`, `English` 排序。","hint":"疑问词(How) + 助动词(did) + 主语(you) + 动词(learn) + 宾语(English)。","takeaway":"正确的顺序是 `How did you learn English?`。"}]},{"title":"助动词 did 的用法","steps":[{"question":"单词中有一个 `did`，它告诉我们这个问句关于什么时间？现在、过去还是将来？","hint":"`did` 是 `do` 和 `does` 的什么形式？","takeaway":"`did` 是助动词的过去式，表示这个问句是关于过去发生的事情。"},{"question":"在一个有助动词 `did` 的句子中，它后面的主要动词应该用什么形式？是 `learn` 还是 `learned`？","hint":"“助动词后动词用原形”，还记得这个口诀吗？","takeaway":"助动词 `did` 已经承担了表示过去式的任务，所以它后面的动词必须用原形 `learn`。"}]},{"title":"句子成分分析","steps":[{"question":"在这个即将组成的句子中，动作的发出者（主语）是谁？","hint":"是“你”在学习英语。","takeaway":"主语是 `you`。"},{"question":"发出的动作（谓语动词）是什么？学习的对象（宾语）又是什么？","hint":"动作是“学习”，学习的内容是“英语”。","takeaway":"谓语动词是 `learn`，宾语是 `English`。"},{"question":"现在，我们有了主语 `you`，谓语 `learn`，宾语 `English`，再加上提问方式的 `how` 和表示过去的 `did`，请把它们组合成一个完整的问句。","hint":"回顾一下特殊疑问句的语序：疑问词+助动词+主语+动词原形+其他？","takeaway":"将所有成分按正确语序排列，就得到了 `How did you learn English?`。"}]}]}},{"number":"37","item_type":"sentence_transform","context_note":"","stem":"go / school / to / I / usually / by / bus (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I usually go to school by bus.","explanation_md":"本题考查的是陈述句的基本语序。首先，确定句子的主语是“I”（我）。其次，找到谓语动词“go”（去）。频率副词“usually”（通常）应放在实义动词“go”之前。接着，补充地点状语“to school”（去学校）和方式状语“by bus”（乘公交车）。最后，根据题干给出的标点符号，在句末加上句号，构成一个完整的句子。","knowledge_expansion_md":"### 1. 频率副词的位置\n频率副词（如 always, usually, often, sometimes, never）在句子中的位置遵循“实前系后”原则：\n- 放在实义动词（如 go, play, read）**前**：`I usually go to school.`\n- 放在 be 动词（am, is, are）**后**：`He is always late.`\n\n### 2. 交通方式的表达\n表达“乘坐某种交通工具”时，通常使用“by + 交通工具名词（单数形式，不加冠词）”的结构。\n- `by bus` (乘公交车)\n- `by car` (乘小汽车)\n- `by train` (乘火车)\n- `by plane` (乘飞机)\n- **特例**：表示“步行”时用 `on foot`。","socratic_tracks":[{"title":"句子主干搭建","steps":[{"question":"一个完整的英文句子，最核心的两个部分是什么？","hint":"想一想，谁做了什么事？","takeaway":"一个完整的句子至少需要主语（动作的发出者）和谓语（动作）。"},{"question":"在这些词中，哪个是主语？哪个是谓语动词？","hint":"“我”是主语，“去”是动作。","takeaway":"这个句子的主干是 “I go”（我去）。"}]},{"title":"频率副词的位置","steps":[{"question":"“usually”（通常）这个词是用来做什么的？它应该放在句子的哪个位置？","hint":"它描述动作发生的频率。这类词通常放在动词前面还是后面？","takeaway":"“usually”是频率副词，通常放在实义动词（如go）的前面。"},{"question":"那么，“I go” 和 “usually” 应该怎么组合才是正确的语序？","hint":"是 “I go usually” 还是 “I usually go”？","takeaway":"正确的语序是 “I usually go”。"}]},{"title":"介词短语的运用","steps":[{"question":"剩下的 “to school” 和 “by bus” 分别是什么意思？它们在句子中起什么作用？","hint":"一个表示目的地，一个表示方式。","takeaway":"“to school” 表示目的地（去学校），“by bus” 表示交通方式（乘公交车），它们都是介词短语。"},{"question":"这两个短语应该放在句子的哪个位置？它们的顺序可以交换吗？","hint":"我们通常会先说去哪儿，再说怎么去。想一想中文的表达习惯。","takeaway":"介词短语通常放在动词之后，按照“地点+方式”的顺序排列，即 “go to school by bus”，这是最自然的表达。"}]}]}},{"number":"38","item_type":"sentence_transform","context_note":"","stem":"many shops / there are / in Toronto (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"There are many shops in Toronto.","explanation_md":"本题考查 “There be” 句型的用法。该句型用于表示“某地有某物”，基本结构为 “There be + 名词 + 地点状语”。首先，判断名词 “many shops”（许多商店）是复数形式，因此 be 动词应使用 “are”。其次，将地点状语 “in Toronto”（在多伦多）放在句末。最后，根据题干提示，句末使用句号，组合成完整句子。","knowledge_expansion_md":"### 1. “There be” 句型的主谓一致\n“There be” 句型中的 be 动词形式（is/are/was/were）取决于其**后面**紧跟的名词的单复数，这被称为“就近原则”。\n- **单数或不可数名词**用 `is/was`：`There is a book on the desk.` / `There is some water in the bottle.`\n- **复数名词**用 `are/were`：`There are many shops in the city.`\n- **并列名词**，be 动词与**最近的**名词保持一致：`There is a pen and two books on the desk.`\n\n### 2. “There be” 与 “have/has” 的区别\n- **There be**：表示“存在”，强调“某地有某物”，主语是 be 后面的名词。`There is a tree in front of the house.` (房子前面有棵树。)\n- **have/has**：表示“拥有”，强调“某人/某物拥有某物”，主语是人或物。`I have a new bike.` (我有一辆新自行车。)","socratic_tracks":[{"title":"“There be” 句型识别","steps":[{"question":"看到 “there” 和 “are” 这两个词，你首先会想到哪个常用句型？","hint":"这个句型通常用来描述某个地方存在着什么东西。","takeaway":"“there are” 提示我们这是一个表示“某地有某物”的 “There be” 句型。"},{"question":"“There be” 句型的基本结构是怎样的？","hint":"一般包含“某物”和“某地”两个要素。","takeaway":"“There be” 句型的基本结构是 “There be + 事物 + 地点/时间”。"}]},{"title":"主谓一致：is 还是 are？","steps":[{"question":"在 “There be” 句型中，动词 “be” 的形式（is/are）由什么决定？","hint":"是看句首的 “There” 还是看后面的名词？","takeaway":"“be” 动词的形式由其后的名词的单复数决定，这叫“就近原则”。"},{"question":"在这道题中，名词是 “many shops”，它是单数还是复数？所以应该用 “is” 还是 “are”？","hint":"“shops” 是 “shop” 的复数形式。","takeaway":"因为 “many shops” 是复数，所以必须用 “are”。"}]},{"title":"句子成分排序","steps":[{"question":"我们已经确定了句子的核心部分 “There are many shops”。剩下的 “in Toronto” 是什么成分？","hint":"“in Toronto” 的意思是“在多伦多”，它描述的是什么信息？","takeaway":"“in Toronto” 是地点状语，说明这些商店存在的位置。"},{"question":"在 “There be” 句型中，地点状语通常放在句子的哪个位置？","hint":"中文说“在多伦多有很多商店”，英文语序和这个一样吗？","takeaway":"在标准的 “There be” 句型中，地点状语通常放在句子的末尾。"}]}]}},{"number":"39","item_type":"sentence_transform","context_note":"","stem":"Mr. Zhao / What / did / do / last weekend (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"What did Mr. Zhao do last weekend?","explanation_md":"本题考查一般过去时特殊疑问句的构成。首先，根据疑问词 “What”（什么）和句末的问号，判断这是一个特殊疑问句。其次，根据时间状语 “last weekend”（上周末），确定时态为一般过去时。一般过去时的特殊疑问句结构为：“疑问词 + did + 主语 + 动词原形 + ...?”。因此，将 “What” 置于句首，后跟助动词 “did”，主语 “Mr. Zhao”，动词原形 “do”，以及时间状语 “last weekend”，构成完整问句。","knowledge_expansion_md":"### 1. 一般过去时特殊疑问句结构\n该结构用于询问过去发生的动作或情况的具体信息。\n- **公式**：`Wh-疑问词 + did + 主语 + 动词原形 + 其他成分?`\n- **示例**：`Where did you go yesterday?` (你昨天去哪儿了？)\n- **易错点**：使用了助动词 `did` 后，后面的谓语动词必须用**原形**，不能用过去式。错误示范：*`What did he said?`*\n\n### 2. “do” 的双重角色\n在英语中，“do” 既可以作**实义动词**（意为“做”），也可以作**助动词**（帮助构成疑问句或否定句）。\n- **本题中**：`What did Mr. Zhao do ...?` 第一个 `did` 是助动词，无实际意义，只表示过去时态；第二个 `do` 是实义动词，意为“做”。\n- **其他示例**：`I don't do my homework on Sundays.` (第一个 `do` 是助动词，第二个 `do` 是实义动词)","socratic_tracks":[{"title":"特殊疑问句结构","steps":[{"question":"看到 “What” 和句末的问号，我们知道这是一个什么类型的句子？","hint":"这种句子不是用 “yes” 或 “no” 回答，而是需要提供具体信息。","takeaway":"这是一个以 “What” 开头的特殊疑问句。"},{"question":"特殊疑问句的基本语序是怎样的？","hint":"疑问词（如What, Where）应该放在哪里？主语和动词的位置是怎样的？","takeaway":"特殊疑问句的基本结构是“疑问词 + 一般疑问句语序”。"}]},{"title":"确定时态与助动词","steps":[{"question":"句子中的 “last weekend”（上周末）告诉我们这个动作发生在什么时候？应该用什么时态？","hint":"“last” 表示“上一个”，是过去的时间。","takeaway":"“last weekend” 是明确的过去时间状语，所以句子要用一般过去时。"},{"question":"在构成一般过去时的疑问句时，我们需要用哪个助动词来帮忙？","hint":"它是 “do” 或 “does” 的过去式。","takeaway":"一般过去时的疑问句和否定句需要使用助动词 “did”。"}]},{"title":"助动词与动词原形","steps":[{"question":"这个句子中有 “did” 和 “do” 两个词，它们的作用一样吗？","hint":"一个帮助构成疑问句，另一个表示“做”这个具体动作。","takeaway":"“did” 是助动词，帮助构成疑问句并表示时态；“do” 是实义动词，表示“做某事”。"},{"question":"当我们用了助动词 “did” 之后，它后面的实义动词 “do” 应该用什么形式？","hint":"助动词已经承担了表示时态的任务，后面的动词还需要变化吗？","takeaway":"助动词 “did” 后面必须跟动词原形，所以用 “do” 而不是 “did” 或 “done”。"}]}]}},{"number":"40","item_type":"sentence_transform","context_note":"","stem":"else / anything / do / you / Did (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Did you do anything else?","explanation_md":"本题考查一般过去时的一般疑问句。首先，根据句首的 “Did” 和句末的问号，判断这是一个一般疑问句。其次，该句使用了助动词 “Did”，表明时态为一般过去时。一般过去时的一般疑问句结构为：“Did + 主语 + 动词原形 + ...?”。因此，将助动词 “Did” 置于句首，后跟主语 “you”，动词原形 “do”，以及宾语 “anything else”（任何其他事），构成完整问句。","knowledge_expansion_md":"### 1. 一般过去时的一般疑问句\n该句型用于询问过去发生的动作或情况是否属实，回答通常用 `Yes` 或 `No`。\n- **结构**：`Did + 主语 + 动词原形 + 其他成分?`\n- **肯定回答**：`Yes, 主语 + did.`\n- **否定回答**：`No, 主语 + didn't.`\n- **示例**：`Did you finish your homework?` (你完成作业了吗？) `Yes, I did.` / `No, I didn't.`\n\n### 2. `anything` vs `something`\n- **anything**：通常用于**疑问句**和**否定句**中，意为“任何东西/事情”。`Do you have anything to say?` (你有什么要说的吗？) `I don't have anything to do.` (我无事可做。)\n- **something**：通常用于**肯定句**中，意为“某东西/某事”。`I have something to tell you.` (我有些事要告诉你。) 在表示请求或希望得到肯定回答的疑问句中，也可用 `something`：`Would you like something to drink?`\n\n### 3. `else` 的用法\n`else` 意为“其他的，另外的”，通常放在疑问词（`what`, `who`）或不定代词（`anything`, `somebody`, `nothing`）之后，起修饰作用。\n- `What else do you want?` (你还想要什么？)\n- `Is there anyone else in the room?` (房间里还有其他人吗？)","socratic_tracks":[{"title":"一般疑问句结构","steps":[{"question":"看到句首给出了大写的 “Did” 和句末的问号，可以判断这是什么类型的句子？","hint":"这种句子通常可以用 “Yes” 或 “No” 来回答。","takeaway":"这是一个用助动词 “Did” 开头的一般疑问句。"},{"question":"一般过去时的一般疑问句，它的标准语序是怎样的？","hint":"助动词、主语、动词，应该按什么顺序排列？","takeaway":"一般过去时的一般疑问句结构为 “Did + 主语 + 动词原形...?”。"}]},{"title":"动词形式的选择","steps":[{"question":"在这个句子里，主语是 “you”，表示“做”这个动作的词是哪个？","hint":"在给出的词中，哪个是表示动作的动词？","takeaway":"谓语动词是 “do”。"},{"question":"既然句首已经有了助动词 “Did” 来表示过去时态，那么动词 “do” 应该用什么形式？","hint":"助动词 “did” 出现后，后面的动词需要变回它的“本来面目”。","takeaway":"助动词 “Did” 后面必须跟动词原形，所以这里用 “do”。"}]},{"title":"词组 “anything else”","steps":[{"question":"“anything” 和 “else” 这两个词应该怎么组合？它们合在一起是什么意思？","hint":"“anything” 意为“任何事”，“else” 意为“其他的”。","takeaway":"“anything else” 是一个固定搭配，意思是“任何其他的事情”。"},{"question":"在句子 “Did you do...” 中，“anything else” 充当什么成分？应该放在哪里？","hint":"它回答了 “do”（做）这个动作的对象是什么。","takeaway":"“anything else” 在这里作动词 “do” 的宾语，应该放在动词的后面。"}]}]}}]}],"content_markdown":"# 成都某实验外国语学校初2025级新初一分班真卷英语\n\n**(满分50分 时间40分钟)**\n\n## I. 按要求填空。(10分)\n\n根据句意，写出画线单词的反义词。\n\n1. Eric is \u003cu>taller\u003c/u> than Jim, but he's _____ than Mike.\n\n2. I'm not _____ than Peter. I'm one year \u003cu>younger\u003c/u> than him.\n\n3. Look at the bones. The _____ one is Jenny's. The \u003cu>bigger\u003c/u> one is mine.\n\n4. This \u003cu>thinner\u003c/u> girl is my sister. That _____ girl is my cousin.\n\n5. The giraffe's neck is _____ than the monkey's. The monkey's neck is \u003cu>shorter\u003c/u> than the giraffe's.\n\n## II. 单选题。(共5分)\n\n6. They planned _____ a football game yesterday.\n\tA. play\n\tB. to play\n\tC. playing\n\n7. We _____ have a picnic tomorrow.\n\tA. are going\n\tB. is going to\n\tC. will\n\n8. Li Ming is a _____ and he works in a _____.\n\tA. postman; post office\n\tB. science; scientist\n\tC. actor; cinema\n\n9. 当别人想知道你假期去了哪里时，他/她应该问：“_____”\n\tA. Where did you go over your holiday?\n\tB. What did you do there?\n\tC. Where are you going over your holiday?\n\n10. 当你想告诉别人“我穿着红裙子”时，你应该说：“_____”\n\tA. I'm wearing a red skirt.\n\tB. I wear a red cap.\n\tC. I like red skirts.\n\n## III. 选词/短语填空。(共5分)\n\nset up\trubbish\twould like\tdream\tdid\n\n11. They _____ a hope school for the poor children.\n\n12. What shall we do with the _____?\n\n13. They _____ to go to the West Lake in Hangzhou.\n\n14. My sister's _____ is to be a teacher.\n\n15. I _____ the high jump last week.\n\n## IV. 完形填空。(共10分)\n\nIt was a beautiful spring day. Millie got up this morning. She saw some (16) in the sky, but she didn't think about them. She woke up her dog, Eddie, and put him in the car. Then she (17) out into the country for a picnic with her dog. They got to a big tree. Millie stopped her car and told Eddie (18) off the car. They began to play games under the tree. How happy they were! An hour later, the wind began to blow(吹) and it turned (19). Millie and Eddie were warm from running, so they didn't feel cold.\nSuddenly, Millie (20) snowflakes(雪花) in the sky. She called Eddie, picked up the picnic things and got (21) into the car. The snow became heavier and heavier. Soon everything was white all around (22). The road became slippery(滑的) and she had to drive very slowly. Then the car hit into a piece of ice and it went around in circles. She got her mobile phone and asked for (23). At (24), the police came to save them. Millie was very thankful. She said she would listen to the weather report(预报) (25) going on a picnic next time.\n\n16. ( )\n\tA. banks\n\tB. clouds\n\tC. snows\n\tD. kites\n\n17. ( )\n\tA. drove\n\tB. walked\n\tC. ran\n\tD. flew\n\n18. ( )\n\tA. get\n\tB. got\n\tC. to get\n\tD. getting\n\n19. ( )\n\tA. warm\n\tB. hot\n\tC. cool\n\tD. cold\n\n20. ( )\n\tA. looked\n\tB. saw\n\tC. cleaned\n\tD. put\n\n21. ( )\n\tA. up\n\tB. back\n\tC. off\n\tD. around\n\n22. ( )\n\tA. him\n\tB. us\n\tC. her\n\tD. me\n\n23. ( )\n\tA. help\n\tB. hamburgers\n\tC. cakes\n\tD. coats\n\n24. ( )\n\tA. first\n\tB. end\n\tC. last\n\tD. problem\n\n25. ( )\n\tA. at\n\tB. after\n\tC. before\n\tD. on\n\n## V. 阅读选择。(共10分)\n\n**A**\n\nWhat do you think is the most useful in our life?\nAlice: I think the mobile phone is the most useful. We can talk to people far away from us. And we can send messages, take photos and do many other things with the mobile phone. My father bought one for me when I was eleven. I use it every day.\nJenny: There are many useful things—the train, the car, the plane... but I think the most useful thing is the air conditioner. I live in Hong Kong. It's very hot in summer here. If we don't have air conditioners, we can't work or study. A lot of people will be ill if they don't use them.\nKitty: The Internet is the most useful. My parents have a clothes shop in Shanghai. We have a website (网站). Now, people from all over the world can buy our clothes on our website. We often send e-mails on the Internet. It's fast. And that's cheaper than(比……便宜) using the mobile phone.\nSam: I also think the Internet is useful. But I think electricity is the most useful. Many things work with electricity.\n\n26. ( ) Who thinks the mobile phone is the most useful?\n\tA. Sam.\n\tB. Jenny.\n\tC. Alice.\n\n27. ( ) What's the Chinese meaning of the underlined(画线的) words \"air conditioner\"?\n\tA. 风扇\n\tB. 冰箱\n\tC. 空调\n\n28. ( ) Kitty's parents _____.\n\tA. often use mobile phones\n\tB. sell clothes to people from all over the world\n\tC. like to go shopping on the Internet\n\n29. ( ) Kitty often _____ on the Internet.\n\tA. watches the news\n\tB. sends e-mails\n\tC. reads e-books\n\n30. ( ) Which one is TRUE?\n\tA. Alice got a mobile phone from her father at the age of 11.\n\tB. Jenny lives in a cold place and people there often get ill.\n\tC. Sam thinks electricity is useful, but he doesn't think the Internet is useful.\n\n**B**\n\n| Club | Age | Time | Learn | Place |\n| :--- | :--- | :--- | :--- | :--- |\n| English Club | Grades(年级) 3-4 | 3:00 p.m. - 3:50 p.m. Friday | Read English books. Talk with foreigners. | Library |\n| Singing Club | Grades 1-2 | 8:00 a.m. - 10:00 a.m. Saturday | Listen to music. Sing different songs. | Music Room |\n| Science Club | Grades 4-6 | 3:00 p.m. - 4:00 p.m. Thursday | Do experiments(实验). Watch insects. | Science Room |\n| Computer Club | Grade 6 | 3:30 p.m. - 4:30 p.m. Wednesday | Program(编程). Play computer games. | Computer Room |\n\n31. ( ) Tim is in Grade Three. He can join the _____ Club.\n\tA. English\n\tB. Singing\n\tC.   /** 卷面/PDF 题干：语音题与词汇填空类允许 &lt;u&gt; 画线词 */

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);

    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;

    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {

  const state = {

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  /** 选项文案：含 <u> 时按语音题规则渲染下划线，否则转义 */
  function quizOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s);
    return esc(s).replace(/\n/g, "<br>");
  }

  /** PDF/卷面选项：同上，单行空格分隔 */
  function examOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s).replace(/\n/g, " ");

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干 / 阅读材料中的表格） */
  function markdownPipeTableLinesToHtml(tableLines, extraTableClass) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    const cls =
      "writing-prompt-table" + (extraTableClass ? " " + String(extraTableClass).trim() : "");
    return "<table class='" + cls + "'>" + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines, "");
    });
    return html;
  }

  /** 阅读大题 section_instruction：正文用 passage-para，管道表格用真实 <table>（如 B 篇俱乐部表） */
  function formatReadingPassageInstructionHtml(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    if (!writingStemHasPipeTable(s)) return formatPassageParagraphs(s);
    let html = "";
    partitionMarkdownTextAndPipeTables(s).forEach((ch) => {
      if (ch.kind === "text") html += formatPassageParagraphs(ch.text);
      else {
        const tbl = markdownPipeTableLinesToHtml(ch.lines, "reading-passage-pipe-table");
        if (tbl) html += "<div class='reading-passage-table-wrap'>" + tbl + "</div>";
      }
    });
    return html;
  }

  /** PDF：阅读材料中的管道表格 */
  function markdownPipeTableLinesToExamHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th scope='col'>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {

  function formatReadingPassageInstructionExamHtml(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    if (!writingStemHasPipeTable(s)) return formatPassageParagraphsExam(s);

    });
    return html;

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function buildFlat() {

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);

    return TYPE_LABELS[t] || t || "其他";

  function showView(name) {

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return formatReadingPassageInstructionHtml(s);
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {

    if (!s) return "";

    return formatPassageParagraphsExam(s);

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        const secIns0 = String(row.section_instruction || "").trim();
        const keyIsLetter = isReadingPassageLetterKey(key);
        while (j < rows.length) {
          const r2 = rows[j];
          if (!isPassageKeyedQuizRow(r2)) break;
          const k2 = readingPassageGroupKey(String(r2.it.context_note || "").trim());
          if (k2 === key) {
            j++;
            continue;
          }
          if (
            !keyIsLetter &&
            isReadingPassageLetterKey(k2) &&
            String(r2.section_instruction || "").trim() === secIns0
          ) {
            j++;
            continue;
          }
          break;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }
