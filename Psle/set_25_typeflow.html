<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .reading-sentence-bank-unit { margin-bottom: 1.5rem; }
    .reading-sentence-bank-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-passage-wrap .cloze-passage-text {
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 0;
    }
    .reading-sentence-bank-options-below { margin-top: 1.15rem; }
    .reading-sentence-bank-qhead {
      font-weight: 700;
      font-size: 1.08rem;
      margin: 0 0 0.5rem;
      color: var(--ink);
    }
    .reading-sentence-bank-opt-block { margin-bottom: 0.85rem; }
    .reading-sentence-bank-opts-grid {
      display: flex !important;
      flex-direction: column !important;
      flex-wrap: nowrap !important;
      align-items: stretch !important;
      gap: 0.4rem 0;
      grid-template-columns: unset !important;
      margin: 0 !important;
    }
    .reading-sentence-bank-opts-grid label { margin: 0; }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-table-wrap {
      overflow-x: auto;
      margin: 0.65rem 0 0.85rem;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    .reading-passage-pipe-table {
      min-width: 36rem;
      font-size: 0.98rem;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-passage-block .exam-para {
      margin: 0 0 0.55em;
      text-indent: 2em;
    }
    .exam-passage-block .exam-para:first-child { margin-top: 0; }
    .exam-passage-block .exam-para:last-child { margin-bottom: 0; }
    .exam-word-bank {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px dashed #000;
      font-size: 10.5pt;
      line-height: 1.6;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-passage-block .exam-cloze-inline-pdf {
      margin: 0;
    }
    .exam-passage-block .exam-cloze-inline-pdf .exam-para:last-child {
      margin-bottom: 0;
    }
    .exam-reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      line-height: 1.45;
      margin: 2mm 0 4mm;
    }
    .exam-reading-fill-table th,
    .exam-reading-fill-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
    }
    .exam-reading-fill-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-pipe-table-wrap {
      margin: 2mm 0 4mm;
      width: 100%;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-reading-pipe-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
      line-height: 1.38;
      table-layout: auto;
    }
    .exam-reading-pipe-table th,
    .exam-reading-pipe-table td {
      border: 1px solid #222;
      padding: 1.8mm 2mm;
      vertical-align: top;
      word-wrap: break-word;
    }
    .exam-reading-pipe-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-unit {
      margin-bottom: 4mm;
      break-inside: auto;
      page-break-inside: auto;
    }
    /* 同一题型内：每道小题（题干+选项）尽量不跨页 */
    .exam-item {
      margin: 0 0 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item .exam-item-row,
    .exam-item .exam-opts-row {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item-row {
      display: block;
      margin: 0;
    }
    .exam-n {
      font-weight: 700;
      margin-right: 0.35em;
    }
    .exam-paren { letter-spacing: 0.2em; margin-right: 0.25em; }
    .exam-blank {
      border-bottom: 1px solid #000;
      padding: 0 1.2em;
      margin: 0 0.15em;
    }
    /* 阅读/单选等：默认 2×2；按选项数单列等分对齐 */
    .exam-opts-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 1.5em;
      row-gap: 0.3em;
      margin: 1mm 0 0 2.2em;
      font-size: 10.5pt;
      align-items: start;
    }
    .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
    }
    /* 阅读理解 PDF：选项纵向排列，字母与正文对齐，避免三列过窄、英文被拆字换行 */
    .exam-item-reading .exam-opts-row {
      display: block;
      margin: 1.5mm 0 0 2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-cols-2,
    .exam-item-reading .exam-opts-row.exam-opts-cols-3,
    .exam-item-reading .exam-opts-row.exam-opts-cols-4 {
      display: block;
    }
    .exam-item-reading .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.55em;
      padding: 0;
      line-height: 1.5;
      text-align: left;
      min-width: 0;
    }
    .exam-item-reading .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    .exam-item-reading .exam-opt-chip b {
      margin-right: 0;
      font-weight: 700;
    }
    /* 阅读判断 PDF：与网页一致，横向 T / F */
    .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35em 0.65em;
      margin: 1mm 0 0 2.2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      margin: 1.5mm 0 0 2em;
    }
    .exam-opts-tf-pair .exam-tf-choice {
      font-weight: 700;
      font-size: 11pt;
      min-width: 1.1em;
      text-align: center;
    }
    .exam-opts-tf-pair .exam-tf-slash {
      color: #444;
      font-weight: 600;
      padding: 0 0.2em;
    }
    .exam-reading-sentence-bank-questions {
      margin-top: 4mm;
    }
    .exam-reading-sentence-bank-qnum {
      font-weight: 700;
      font-size: 11pt;
      margin: 0 0 1.5mm;
    }
    .exam-reading-sentence-bank-item {
      margin-bottom: 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-reading-sentence-bank-item .exam-opts-row {
      display: block;
      margin: 0 0 0 1.5em;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.45em;
      line-height: 1.45;
      text-align: left;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    /* 补全对话 PDF：题干已在左侧对话中，不重复「51.（ ）」等题目行，仅题号 + 方框选项 */
    .exam-item-cloze.exam-cloze-dialogue-gap {
      display: block;
    }
    .exam-cloze-dialogue-gap {
      margin: 0.55em 0 0.65em;
    }
    .exam-cloze-dialogue-gap .exam-dialogue-gap-num {
      display: block;
      font-weight: 700;
      margin: 0 0 0.35em 0.15em;
      font-size: 11pt;
    }
    /* 完形 PDF：题号与 A–D 同一行横向排列 */
    .exam-item-cloze {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 1em;
      row-gap: 0.6mm;
    }
    .exam-item-cloze .exam-item-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2em 0.45em;
    }
    .exam-item-cloze .exam-opts-row {
      display: grid;
      column-gap: 0.85em;
      row-gap: 0.2em;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr));
    }
    /* 完形 PDF：整卷表格，题号与 A/B/C 同一行；各题 A 列、B 列、C 列分别左对齐 */
    .exam-cloze-pdf-grid {
      display: grid;
      grid-template-columns: minmax(2.85em, auto) repeat(3, minmax(0, 1fr));
      column-gap: 0.75em;
      row-gap: 0.5em;
      margin: 0.55em 0 0.85em;
      align-items: start;
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-4opt {
      grid-template-columns: minmax(2.85em, auto) repeat(4, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-5opt {
      grid-template-columns: minmax(2.85em, auto) repeat(5, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-6opt {
      grid-template-columns: minmax(2.85em, auto) repeat(6, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-7opt {
      grid-template-columns: minmax(2.85em, auto) repeat(7, minmax(0, 1fr));
    }
    .exam-cloze-pdf-num {
      text-align: left;
      white-space: nowrap;
      font-weight: 600;
    }
    .exam-cloze-pdf-num .exam-n {
      font-weight: 700;
    }
    .exam-cloze-pdf-opt {
      text-align: left;
      min-width: 0;
      line-height: 1.45;
    }
    .exam-cloze-pdf-opt b {
      font-weight: 700;
      margin-right: 0.25em;
    }
    .exam-cloze-pdf-opt-empty {
      visibility: hidden;
      pointer-events: none;
      min-height: 1em;
    }
    .exam-item-cloze .exam-cloze-pdf-grid {
      flex: 1 1 100%;
      width: 100%;
    }
    .exam-item-cloze .exam-opt-chip {
      display: block;
      min-width: 0;
    }
    .exam-opt-chip {
      min-width: 0;
    }
    .exam-paper-doc .phonetic-ul,
    #printHost .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.12em;
      text-decoration-thickness: 0.08em;
      font-weight: 600;
    }
    .exam-opt-chip b { margin-right: 0.25em; }
    .exam-item-cloze .exam-opt-chip b {
      display: inline-block;
      min-width: 1.15em;
      margin-right: 0.2em;
    }
    .exam-answer-lines {
      min-height: 14em;
      margin-top: 2mm;
      border: 1px solid #333;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.45em,
        #ddd 1.45em,
        #ddd calc(1.45em + 1px)
      );
    }
    /* 句型转换、词汇填空等书写题：与客观题区分的标准卷面条目 + 作答横线区 */
    .exam-item-written {
      padding: 0 0 1mm 0;
    }
    .exam-item-written .exam-item-row {
      line-height: 1.55;
      font-size: 10.5pt;
      text-align: justify;
    }
    .exam-written-lines {
      min-height: 4.2em;
      margin: 1.5mm 0 0 0;
      border: 1px solid #222;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.38em,
        #e0e0e0 1.38em,
        #e0e0e0 calc(1.38em + 0.55px)
      );
    }
    .exam-paper-doc .exam-writing-stem-wrap {
      margin: 1.5mm 0 0;
      font-size: 10.5pt;
      line-height: 1.5;
      color: #000;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table,
    #printHost .writing-prompt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      color: #000;
      background: #fff;
      margin: 1mm 0;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table th,
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table td,
    #printHost .writing-prompt-table th,
    #printHost .writing-prompt-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
      text-align: left;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table thead th,
    #printHost .writing-prompt-table thead th {
      background: #eee;
      font-weight: 700;
    }
    .exam-reading-fill-table td.exam-table-stem-cell {
      font-size: 10.5pt;
      line-height: 1.5;
    }
    @media print {
      @page { size: A4; margin: 12mm 14mm; }
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      html.pdf-printing body {
        margin: 0 !important;
        padding: 0 !important;
      }
      html.pdf-printing #printHost {
        clip: auto !important;
      }
      .exam-paper-section:not(:first-of-type) {
        break-before: page !important;
        page-break-before: always !important;
      }
      .exam-passage-titled-wrap {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      /* 完形填空：PDF 不显示答题括号与题干下划线占位 */
      .exam-item-cloze .exam-paren,
      .exam-item-cloze .exam-blank,
      .exam-cloze-pdf-num .exam-paren {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="view-home" class="view active">
    <header class="flow" style="position:relative;margin:0 0 1rem;border-radius:0 0 12px 12px;">
      <h1 id="homeTitle">按题型练习</h1>
      <button type="button" class="btn secondary" id="btnPdfFull" title="按标准纸笔试卷版式排版，打印对话框中选「另存为 PDF」">导出 PDF（整套·标准试卷版式）</button>
    </header>
    <p class="breadcrumb">先选择一种题型，完成该题型全部题目后提交，再进入讲解与苏格拉底引导。</p>
    <div class="type-grid" id="typeGrid"></div>
  </div>

  <div id="view-quiz" class="view">
    <header class="flow">
      <h1 id="quizTitle">答题</h1>
      <span class="timer" id="quizTimer">用时 00:00</span>
      <button type="button" class="btn secondary" id="btnPdfType" title="仅导出当前题型，标准试卷版式">导出 PDF（本题型·标准版式）</button>
      <button type="button" class="btn secondary" id="btnBackHome">← 题型首页</button>
    </header>
    <div class="breadcrumb" id="quizBreadcrumb"></div>
    <div id="quizIntro"></div>
    <div id="quizBody"></div>
    <div style="margin-top:1.5rem;text-align:center;">
      <button type="button" class="btn primary" id="btnSubmitType">提交本题型</button>
    </div>
  </div>

  <div id="view-result" class="view">
    <header class="flow">
      <h1 id="resultTitle">本题型结果</h1>
      <button type="button" class="btn secondary" id="btnBackHome2">← 题型首页</button>
    </header>
    <div class="card" id="resultSummary"></div>
    <div style="text-align:center;margin:1rem 0;">
      <button type="button" class="btn primary" id="btnGoLearn">进入本题型讲解</button>
    </div>
  </div>

  <div id="view-learn" class="view">
    <header class="flow">
      <h1 id="learnTitle">讲解与学习</h1>
      <button type="button" class="btn secondary" id="btnBackHome3">← 题型首页</button>
    </header>
    <p class="breadcrumb">讲解页：题干与选项中可点击英文词查义；弹窗内可朗读该词。展开「解析」「知识点」「测试」查看更多。</p>
    <div id="learnBody"></div>
  </div>

  <div id="printHost" aria-hidden="true"></div>

  <div id="modal" aria-hidden="true">
    <div class="box">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.35rem;">
        <h4 id="modalWord" style="margin:0;color:var(--accent);font-size:1.15rem;">词汇</h4>
        <button type="button" class="btn primary" id="modalTtsWord">朗读本词</button>
      </div>
      <p id="modalBody" style="white-space:pre-wrap;margin:0.5rem 0;"></p>
      <button type="button" class="btn secondary" id="modalClose">关闭</button>

  <script type="application/json" id="exam-embed">{"school_or_title": "初一入学考试英语试卷 · 第25套", "exam_meta": {"full_score_text": "满分50分", "time_text": "时间40分钟", "type_cards": [{"sections": [0], "title": "1. 按要求填空", "range_text": "第1–5题"}, {"sections": [1], "title": "2. 单项选择", "range_text": "第6–10题"}, {"sections": [2], "title": "3. 选词/短语填空", "range_text": "第11–15题"}, {"sections": [3], "title": "4. 完形填空", "range_text": "第16–25题"}, {"sections": [4], "title": "5. 阅读理解", "range_text": "第26–35题"}, {"sections": [5], "title": "6. 连词成句", "range_text": "第36–40题"}]}, "sections": [{"section_title": "I. 按要求填空。(10分)", "section_instruction": "根据句意，写出画线单词的反义词。", "items": [{"number": "1", "item_type": "fill_blank", "context_note": "", "stem": "Eric is <u>taller<\/u> than Jim, but he's _____ than Mike.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "shorter", "explanation_md": "本题考查形容词比较级和逻辑关系。句子前半部分“Eric is taller than Jim”意为“埃里克比吉姆高”。连接词“but”表示转折，说明后半句与前半句在逻辑上是相反的。因此，埃里克和迈克的关系应该是“更矮”。“than Mike”提示此处需要填入形容词的比较级形式。“矮的”是short，其比较级为shorter。所以填入shorter，表示“但他比迈克矮”，符合句意。", "knowledge_expansion_md": "**1. 形容词比较级的构成**\n*   **规则变化**：单音节和部分双音节词词尾加-er（如tall-taller, short-shorter）；以e结尾的词加-r（如nice-nicer）；以“辅音+元音+辅音”结尾的重读闭音节词，双写末尾辅音再加-er（如big-bigger）；以“辅音+y”结尾的词，变y为i再加-er（如happy-happier）。\n*   **不规则变化**：多音节词和部分双音节词前加more（如beautiful-more beautiful）。还有一些不规则形式，如good/well-better, bad/ill-worse, many/much-more, little-less, far-farther/further。\n\n**2. 转折连词 `but` 的用法**\n`but` 用于连接两个意思相反或相对的分句，表示转折关系。在比较级的句子中，`but`常常引出与前文相反的比较结果。例如：`My car is faster, but his is more comfortable.`（我的车更快，但他的车更舒服。）", "socratic_tracks": [{"title": "逻辑关系：转折连词", "steps": [{"question": "句子中的连词 `but` 是什么意思？它连接的两个部分在意思上有什么关系？", "hint": "想一想，“我喜欢苹果，但是不喜欢香蕉”这句话里，“但是”起到了什么作用？", "takeaway": "`but` 表示转折，它连接的两个分句意思通常是相反的。"}, {"question": "前半句说“Eric is taller than Jim”（埃里克比吉姆高），那么 `but` 后面的部分应该表达一个怎样的信息？", "hint": "如果前面是“高”，那转折之后应该是“不高”或者“更矮”。", "takeaway": "`but` 提示了埃里克和迈克的身高关系与他和吉姆的关系是相反的。"}]}, {"title": "语法结构：比较级", "steps": [{"question": "空格后面有一个词 `than`，这提示我们空格里应该填什么词性的词？", "hint": "我们在做比较时，会用 `taller than`, `bigger than` 这样的结构，这里的 `taller`, `bigger` 是什么词？", "takeaway": "`than` 前面通常要用形容词的比较级形式。"}, {"question": "根据句意，我们需要一个表示“更矮”的词。你知道“矮的”（short）这个词的比较级是什么吗？", "hint": "像 `short`, `long`, `tall` 这样的单音节词，比较级通常怎么变？", "takeaway": "单音节形容词的比较级通常在词尾加 `-er`，所以 `short` 的比较级是 `shorter`。"}]}, {"title": "词汇应用：反义词", "steps": [{"question": "题目中已经出现了一个表示“更高”的词，是哪个？", "hint": "找一找 `Eric is taller than Jim` 这句话里的比较级。", "takeaway": "`taller` 是 `tall` 的比较级，意思是“更高”。"}, {"question": "因为 `but` 表示转折，我们需要一个和 `taller` 意思相反的词。你知道 `tall` (高的) 的反义词是什么吗？", "hint": "形容一个人身高不高，我们会用哪个词？", "takeaway": "`tall` 的反义词是 `short`。"}, {"question": "那么 `short` 的比较级形式是什么？填入空格后句子通顺吗？", "hint": "`short` 加 `-er` 变成 `shorter`。代入句子检查一下。", "takeaway": "结合逻辑和语法，空格处应填 `shorter`，使得句子完整通顺。"}]}]}}, {"number": "2", "item_type": "fill_blank", "context_note": "", "stem": "I'm not _____ than Peter. I'm one year <u>younger<\/u> than him.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "older", "explanation_md": "本题考查在否定句中运用比较级，并结合上下文进行逻辑判断。第二句话“I'm one year younger than him.”（我比他小一岁。）是对第一句话的解释说明，是解题的关键。既然“我”比彼得（Peter）年轻，那么反过来说，“我”就不比彼得年长。第一句话是“I'm not _____ than Peter.”，是一个否定句，意为“我并不比彼得……”。因此，空格处应填入与“younger”（更年轻）相对的反义词的比较级形式，即“older”（更年长）。", "knowledge_expansion_md": "**1. `not + 比较级 + than` 结构**\n这个结构表示“不比……更……”，通常暗含“等于”或“不如”的意思。例如：\n*   `He is not taller than his brother.` (他没有他哥哥高。) 可能一样高，也可能更矮。\n*   在本题中，`I'm not older than Peter` 明确表示“我”的年龄不大于Peter，结合后文可知“我”比他小。\n\n**2. `younger` vs. `older`**\n`younger` 和 `older` 是一对关于年龄的反义比较级。`young` (年轻的) -> `younger` (更年轻的)；`old` (年老的) -> `older` (更年长的)。在比较年龄时，`older` 比 `bigger` 更常用和准确。\n\n**3. 利用上下文线索**\n在英语阅读和完形填空中，后文对前文的解释、举例或总结是重要的解题线索。本题的第二句话就是典型的解释说明，直接揭示了答案。", "socratic_tracks": [{"title": "上下文逻辑", "steps": [{"question": "第二句话 “I'm one year younger than him” 告诉了我们关于“我”和 Peter 年龄的什么信息？", "hint": "`younger` 是什么意思？", "takeaway": "第二句话明确说明“我”比 Peter 年纪小。"}, {"question": "既然“我”比 Peter 年纪小，那么第一句话 “I'm not ___ than Peter” 是想否定一个什么事实？", "hint": "如果你比别人小，那你是不是“不比他大”？", "takeaway": "第一句话要表达的是“我并不比 Peter 年长”。"}]}, {"title": "比较级的否定", "steps": [{"question": "`not ... than` 这个结构是什么意思？比如 `I'm not taller than you` 是什么意思？", "hint": "这句话是说我比你高，还是不比你高？", "takeaway": "`not + 比较级 + than` 结构表示“不比……更……”。"}, {"question": "我们需要找到一个词，填入 `I'm not ___ than Peter` 后，能表达出“我比他年轻”的含义。这个词应该是什么意思？", "hint": "“我不比他___”就等于“我比他年轻”。空格里应该填“老”还是“年轻”？", "takeaway": "空格处需要填入“年长”的比较级，即 `older`。"}]}, {"title": "反义词辨析", "steps": [{"question": "题干中出现了一个比较级 `younger`，它的原级和反义词分别是什么？", "hint": "`younger` 来自于哪个词？它的反义词是什么？", "takeaway": "`younger` 的原级是 `young` (年轻的)，其反义词是 `old` (年老的)。"}, {"question": "根据句意，第一句是否定句，第二句是肯定句，它们描述的是同一件事。既然第二句用了 `younger`，第一句的否定结构中应该使用哪个词的比较级？", "hint": "“我比他年轻”就等于“我并不比他老”。", "takeaway": "在否定句中，应该使用 `younger` 对应反义词 `old` 的比较级 `older`。"}]}]}}, {"number": "3", "item_type": "fill_blank", "context_note": "", "stem": "Look at the bones. The _____ one is Jenny's. The <u>bigger<\/u> one is mine.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "smaller", "explanation_md": "本题考查在特定语境中通过对比选择合适的形容词比较级。句子描述的是两块骨头（bones）。第二句“The bigger one is mine.”（那个更大的是我的。）提供了关键线索，说明其中一块是“更大的”。既然是在两者之间进行比较，一个被描述为“更大”，那么另一个逻辑上就应该是“更小”。“更小的”是 `small` 的比较级 `smaller`。因此，第一句应为“The smaller one is Jenny's.”（那个更小的是珍妮的。），与后文形成鲜明对比。", "knowledge_expansion_md": "**1. `the + 比较级 + one` 结构**\n这个结构常用于两者之间的对比选择，意为“那个更……的”。`the` 在这里是特指，指两者中符合该特征的那一个。例如：\n*   `Of the two bags, I prefer the cheaper one.` (在这两个包中，我更喜欢那个更便宜的。)\n\n**2. 形容词比较级的特殊用法**\n虽然 `bigger` 和 `smaller` 是比较级，但在这个结构中，它们的作用更像是描述性形容词，用来区分两个已知的对象。这种用法在口语和日常写作中非常普遍。\n\n**3. 掌握常见的反义词对**\n在英语学习中，积累常见的反义词对（如 big-small, tall-short, long-short, hot-cold, expensive-cheap）对于理解和解题非常有帮助，能够让你在遇到对比情境时迅速反应。", "socratic_tracks": [{"title": "对比逻辑", "steps": [{"question": "句子中提到了几个 `one` (这里指代骨头)？它们之间有什么关系？", "hint": "看看 “The bigger one is mine” 这句话，它描述了其中一个。", "takeaway": "句子在对比两个骨头，其中一个是“更大的”。"}, {"question": "如果两个东西放在一起，一个被描述为“更大的”，那么另一个通常会被如何描述？", "hint": "想一想“大”的反义词是什么？", "takeaway": "与“更大的”相对的自然是“更小的”。"}]}, {"title": "形容词辨析", "steps": [{"question": "`bigger` 是哪个词的比较级？它是什么意思？", "hint": "`big` 这个词你认识吗？", "takeaway": "`bigger` 是 `big` (大的) 的比较级，意思是“更大的”。"}, {"question": "我们需要一个和 `bigger` 意思相反的词来描述另一个骨头。你知道 `big` 的反义词 `small` 的比较级是什么吗？", "hint": "`small` 是一个单音节词，它的比较级怎么变化？", "takeaway": "`small` 的比较级是 `smaller`，意思是“更小的”。"}]}, {"title": "the + 比较级 结构", "steps": [{"question": "“The bigger one” 这个短语是什么意思？为什么 `bigger` 前面要加 `the`？", "hint": "当我们谈论两者中“那个更...”的时候，是不是特指某一个？", "takeaway": "`the + 比较级` 用于特指两者中具有某种特性的那一个。"}, {"question": "既然一句话用了 “The bigger one”，那么描述另一个时，为了保持结构平行和意思对比，应该用什么结构？", "hint": "模仿 “The bigger one” 的结构，把 `bigger` 换成它的反义词。", "takeaway": "应该使用 “The smaller one” 来与 “The bigger one” 形成工整的对比。"}]}]}}, {"number": "4", "item_type": "fill_blank", "context_note": "", "stem": "This <u>thinner<\/u> girl is my sister. That _____ girl is my cousin.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "fatter", "explanation_md": "本题考查形容词比较级的反义词运用和上下文对比。句子通过指示代词 `This` 和 `That` 对两个人进行对比。第一句话“This thinner girl is my sister.”（这个更瘦的女孩是我的妹妹。）描述了其中一人是“更瘦的”（thinner）。`thinner` 是 `thin`（瘦的）的比较级。第二句话“That _____ girl is my cousin.”（那个___的女孩是我的表妹。）描述另一个人。为了与“更瘦的”形成对比，空格处需要填入其反义词的比较级。`thin` 的反义词是 `fat`（胖的），其比较级是 `fatter`。因此，填入 `fatter` 最符合逻辑。", "knowledge_expansion_md": "**1. `thin` 的比较级和反义词**\n*   `thin` 的比较级是 `thinner`。注意，`thin` 是以“辅音+元音+辅音”结尾的单音节词，所以需要双写末尾辅音 `n` 再加 `-er`。\n*   它的常见反义词是 `fat` (胖的)，其比较级是 `fatter` (同样需要双写末尾辅音 `t` 再加 `-er`)。\n\n**2. `this` vs. `that`**\n这对指示代词常用于对比，`this` 指近处的、刚提到的，`that` 指远处的、后提到的，可以用来清晰地分指两个不同的人或物。\n\n**3. 描述身材的词汇**\n*   **褒义/中性**: `slim` (苗条的), `slender` (修长的), `fit` (健美的), `plump` (丰满的), `chubby` (胖乎乎的，多用于形容小孩或可爱的脸颊)。\n*   **中性/偏贬义**: `thin` (瘦的，有时带营养不良的含义), `fat` (胖的，直接，有时不礼貌)。在正式场合或希望表达委婉时，可使用 `overweight` (超重的) 或 `heavy` (重的)。", "socratic_tracks": [{"title": "对比与反义", "steps": [{"question": "句子中用 `This` 和 `That` 分别指代了两个人，这暗示了她们之间有什么关系？", "hint": "当我们说“这个...”和“那个...”时，我们通常在做什么？", "takeaway": "`This` 和 `That` 表明这是一个对比的场景。"}, {"question": "第一个女孩被描述为 `thinner` (更瘦的)，那么为了形成对比，另一个女孩应该被如何描述？", "hint": "“瘦”的反义词是什么？", "takeaway": "与“更瘦”相对的应该是“更胖”。"}]}, {"title": "比较级构词法", "steps": [{"question": "`thinner` 是哪个词的比较级？它的拼写有什么特点？", "hint": "`thinner` 来自 `thin`。看看它的结尾，是 t-h-i-n，属于“辅音+元音+辅音”结构。", "takeaway": "`thin` 是“辅音+元音+辅音”结尾的单音节词，变比较级时需要双写末尾辅音再加-er。"}, {"question": "我们需要的词是“更胖的”。“胖的”是 `fat`，它也符合“辅音+元音+辅音”的规律吗？它的比较级应该怎么拼？", "hint": "`fat` 的最后三个字母是 f-a-t。", "takeaway": "`fat` 变比较级也需要双写末尾辅音t，变成 `fatter`。"}]}, {"title": "词汇选择", "steps": [{"question": "形容一个人“瘦”，除了 `thin`，你还知道哪些词？", "hint": "比如形容模特身材很好，可以说她很...？", "takeaway": "描述“瘦”的词还有 `slim`, `slender` 等，它们比 `thin` 更具褒义。"}, {"question": "那么形容人“胖”，除了 `fat`，还有别的说法吗？为什么这里用 `fatter` 最合适？", "hint": "`fat` 是 `thin` 最直接的反义词。想一想 `chubby`, `plump` 等词。", "takeaway": "因为 `fat` 是 `thin` 最直接、最常见的反义词，所以 `fatter` 是与 `thinner` 形成对比的最优选择。"}]}]}}, {"number": "5", "item_type": "fill_blank", "context_note": "", "stem": "The giraffe's neck is _____ than the monkey's. The monkey's neck is <u>shorter<\/u> than the giraffe's.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "longer", "explanation_md": "本题考查形容词比较级。题干中出现了标志词`than`，表示两者之间的比较。第二句话“The monkey's neck is shorter than the giraffe's.”意为“猴子的脖子比长颈鹿的短”，这为我们提供了上下文线索。根据这句的逻辑，可以推断出第一句要表达的意思是“长颈鹿的脖子比猴子的长”。形容词`long`（长的）是单音节词，其比较级形式是在词尾加`-er`，变为`longer`。", "knowledge_expansion_md": "### 形容词比较级的构成与用法\n\n**1. 比较级的基本结构：**\n   `主语A + be动词 + 形容词比较级 + than + 主语B`\n\n**2. 形容词比较级的构成规则：**\n   - **单音节词和少数双音节词**：直接在词尾加 `-er`。如：`tall` -> `taller`, `fast` -> `faster`。\n   - **以不发音的`e`结尾的词**：直接加 `-r`。如：`nice` -> `nicer`, `large` -> `larger`。\n   - **重读闭音节且末尾只有一个辅音字母的词**：双写该辅音字母再加 `-er`。如：`big` -> `bigger`, `hot` -> `hotter`。\n   - **以“辅音字母 + y”结尾的词**：变 `y` 为 `i` 再加 `-er`。如：`happy` -> `happier`, `busy` -> `busier`。\n   - **多音节词和部分双音节词**：在词前加 `more`。如：`beautiful` -> `more beautiful`, `interesting` -> `more interesting`。\n   - **不规则变化**：`good` -> `better`, `bad` -> `worse`, `many/much` -> `more`, `little` -> `less`。", "socratic_tracks": [{"title": "识别比较级信号", "steps": [{"question": "在第一个句子中，你看到了哪个词，它通常暗示我们需要进行比较？", "hint": "看看空格后面的那个词，它经常出现在“A比B如何如何”的句型中。", "takeaway": "单词 `than` 是使用形容词比较级的明确标志。"}, {"question": "既然要用比较级，我们应该用哪个形容词的比较级形式来填空呢？", "hint": "看看第二句话，它描述了猴子和长颈鹿脖子的关系，可以反向推理。", "takeaway": "第二句的 `shorter` (更短) 暗示了第一句需要填 `long` (长) 的比较级。"}]}, {"title": "形容词比较级变形", "steps": [{"question": "形容词 `long` (长的) 是一个单音节词，它的比较级应该怎么变化？", "hint": "回想一下单音节形容词构成比较级的一般规则，比如 `short` -> `shorter`。", "takeaway": "单音节形容词的比较级通常是在词尾直接加 `-er`。"}, {"question": "你能再举一个类似的例子吗？比如 `tall` (高的) 的比较级是什么？", "hint": "它的变化规则和 `long` 完全一样。", "takeaway": "`tall` 的比较级是 `taller`，这巩固了单音节词加 `-er` 的规则。"}]}, {"title": "理解句子逻辑", "steps": [{"question": "题目的第二句话 “The monkey's neck is shorter than the giraffe's” 是什么意思？", "hint": "`shorter` 是 `short` (短的) 的比较级。", "takeaway": "这句话的意思是“猴子的脖子比长颈鹿的短”。"}, {"question": "根据第二句话的逻辑，第一句话 “The giraffe's neck is _____ than the monkey's.” 应该表达什么意思？", "hint": "如果A比B短，那么B比A怎么样？", "takeaway": "既然猴子的脖子更短，那么反过来，长颈鹿的脖子就一定更长。"}]}]}}]}, {"section_title": "II. 单选题。(共5分)", "section_instruction": "", "items": [{"number": "6", "item_type": "choice", "context_note": "", "stem": "They planned _____ a football game yesterday.", "options": {"A": "play", "B": "to play", "C": "playing", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题考查固定动词搭配。动词`plan`（计划）后面需要跟动词不定式（to + 动词原形）来作宾语，构成`plan to do something`的结构，意为“计划做某事”。句中的`planned`是`plan`的过去式，但其后的动词形式要求不变。选项A `play`是动词原形，缺少`to`。选项C `playing`是动名词，不符合`plan`的用法。因此，只有选项B `to play`是正确的形式。", "knowledge_expansion_md": "### 动词后接不定式 vs. 动名词\n\n在英语中，当一个动词后面需要跟另一个动词时，后一个动词通常要变为非谓语形式，主要是动词不定式（to do）或动名词（doing）。\n\n1.  **必须接不定式（to do）的常见动词**：这类动词常表示意愿、计划、决定等。\n    - `want to do` (想要做), `hope to do` (希望做), `decide to do` (决定做), `plan to do` (计划做), `agree to do` (同意做), `learn to do` (学习做), `offer to do` (主动提出做), `refuse to do` (拒绝做)。\n\n2.  **必须接动名词（doing）的常见动词**：这类动词常表示喜好、习惯、完成等。\n    - `enjoy doing` (享受做), `finish doing` (完成做), `mind doing` (介意做), `practice doing` (练习做), `keep doing` (持续做), `avoid doing` (避免做)。\n\n3.  **接两者均可但意义不同的动词**：\n    - `stop to do` (停下来去做另一件事) vs. `stop doing` (停止正在做的事)。\n    - `remember to do` (记得要去做某事) vs. `remember doing` (记得做过某事)。\n    - `forget to do` (忘记要去做某事) vs. `forget doing` (忘记做过某事)。", "socratic_tracks": [{"title": "掌握核心动词用法", "steps": [{"question": "句子中的主要动作是什么？这个词是什么意思？", "hint": "主语 `They` 后面的那个动词是 `planned`。", "takeaway": "句子的主要动词是 `planned`，是 `plan` (计划) 的过去式。"}, {"question": "当我们说“计划做某事”时，`plan` 后面应该跟哪种动词形式？是 `play`, `to play` 还是 `playing`？", "hint": "回忆一下你学过的 `want to do` (想要做某事)，`plan` 的用法和它类似。", "takeaway": "动词 `plan` 后面必须跟不定式 `to do`，构成 `plan to do something` 的固定搭配。"}]}, {"title": "辨析非谓语动词", "steps": [{"question": "选项中的 `to play` 和 `playing` 在语法上分别叫什么？", "hint": "一个是由 `to` 加上动词原形构成，另一个是动词词尾加 `-ing` 构成。", "takeaway": "`to play` 是动词不定式，`playing` 是动名词。"}, {"question": "为什么这里不能用动名词 `playing`？", "hint": "有些动词后面跟动名词，比如 `enjoy doing`，但 `plan` 属于哪一类呢？", "takeaway": "不同的动词后面跟的非谓语动词形式不同，需要专门记忆，`plan` 后面只能跟不定式，不能跟动名词。"}]}, {"title": "分析句子时态与结构", "steps": [{"question": "句末的 `yesterday` 告诉我们这个句子的时态是什么？", "hint": "`yesterday` 的意思是“昨天”。", "takeaway": "`yesterday` 表明整个事件发生在过去，所以句子要用一般过去时。"}, {"question": "既然是过去时，为什么空格里不填一个过去式的动词，比如 `played`？", "hint": "一个简单句里通常只有一个谓语动词。这个句子的谓语动词已经有了吗？", "takeaway": "句子的谓语动词已经是 `planned`，其后的动词 `play` 是非谓语动词，其形式由 `planned` 决定，而不再由时态决定。"}]}]}}, {"number": "7", "item_type": "choice", "context_note": "", "stem": "We _____ have a picnic tomorrow.", "options": {"A": "are going", "B": "is going to", "C": "will", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "C", "explanation_md": "本题考查一般将来时的用法。句末的时间状语`tomorrow`（明天）表明句子需要使用将来时态。一般将来时有两种主要结构：`will + 动词原形`和`be going to + 动词原形`。选项A `are going`缺少了不定式符号`to`，结构不完整。选项B `is going to`中的`is`与主语`We`在人称上不一致，主语`We`是复数，be动词应使用`are`。选项C `will`是情态动词，后跟动词原形`have`，构成`will have`，是正确的一般将来时结构。因此，正确答案是C。", "knowledge_expansion_md": "### 一般将来时的两种核心结构\n\n一般将来时主要用来表示将来发生的动作或存在的状态。其基本构成方式有两种：\n\n1.  **`will + 动词原形`**\n    - `will`是情态动词，适用于所有人称，其后必须跟动词原形。\n    - 常用于表示：\n        - **临时的决定**：`The phone is ringing. I will answer it.` (电话响了，我去接。)\n        - **主观意愿、允诺**：`I will help you.` (我会帮你的。)\n        - **纯粹的将来预测**：`It will be sunny tomorrow.` (明天会是晴天。)\n\n2.  **`be going to + 动词原形`**\n    - `be`动词需要根据主语的人称和数进行变化（`am`, `is`, `are`）。\n    - 常用于表示：\n        - **事先计划好的安排**：`We are going to have a party this weekend.` (我们这周末要开个派对。)\n        - **有根据的预测**：`Look at the dark clouds. It's going to rain.` (看那乌云，天要下雨了。)\n\n**易错点**：在小升初阶段，主要考察结构是否正确，如`be`动词是否与主语匹配，`be going to`中的`to`是否遗漏，`will`后是否跟动词原形。", "socratic_tracks": [{"title": "识别将来时标志", "steps": [{"question": "看到句子中的哪个词，可以判断这个句子描述的是未来的事情？", "hint": "句子的最后一个词是什么意思？", "takeaway": "时间状语 `tomorrow` (明天) 是将来时的明确标志。"}, {"question": "表达将来时，我们学过哪两种最基本的结构？", "hint": "一种是 `will` 开头的，另一种是 `be ...` 开头的。", "takeaway": "表达将来时主要用 `will + 动词原形` 和 `be going to + 动词原形` 两种结构。"}]}, {"title": "剖析 `be going to` 结构", "steps": [{"question": "我们来看选项A `are going`，如果想用它来表达将来时，它缺少了什么？", "hint": "完整的结构是 `be going to do`。", "takeaway": "选项A缺少了不定式符号 `to`，结构不完整。"}, {"question": "再看选项B `is going to`，这个选项的错误在哪里？", "hint": "句子的主语是 `We`，它后面应该用哪个be动词？", "takeaway": "主语 `We` 是复数，be动词应该用 `are`，而不是 `is`，这违反了主谓一致原则。"}]}, {"title": "掌握 `will` 的用法", "steps": [{"question": "选项C `will` 是什么类型的词？", "hint": "它和 `can`, `may`, `must` 属于同一类词。", "takeaway": "`will` 是一个情态动词，可以用来表示将来。"}, {"question": "情态动词 `will` 后面跟的动词应该是什么形式？", "hint": "想一想 `I can swim`，`swim` 是什么形式？", "takeaway": "情态动词后面必须跟动词原形，所以 `will have` 是一个完全正确的将来时结构。"}]}]}}, {"number": "8", "item_type": "choice", "context_note": "", "stem": "Li Ming is a _____ and he works in a _____.", "options": {"A": "postman; post office", "B": "science; scientist", "C": "actor; cinema", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查职业与工作地点的词汇搭配，以及冠词的正确使用。我们需要为李明选择一个合适的职业和对应的工作地点。选项A：`postman`（邮递员）在`post office`（邮局）工作，逻辑通顺，搭配正确。选项B：`science`（科学）是学科名，不是职业；`scientist`（科学家）才是职业，选项将两者顺序和位置弄反了。选项C：`actor`（演员）是以元音音素开头的单词，其前的不定冠词应该是`an`，而不是`a`，存在语法错误。因此，只有选项A是完全正确的。", "knowledge_expansion_md": "### 1. 常见职业与工作场所搭配\n\n- `teacher` (老师) - `school` (学校)\n- `doctor` / `nurse` (医生/护士) - `hospital` (医院)\n- `farmer` (农民) - `farm` (农场)\n- `worker` (工人) - `factory` (工厂)\n- `shop assistant` (店员) - `shop` / `store` (商店)\n- `waiter` / `waitress` (服务员) - `restaurant` (餐馆)\n- `scientist` (科学家) - `laboratory` (实验室)\n\n### 2. 不定冠词 `a` 和 `an` 的用法\n\n不定冠词的选择取决于其后所跟单词的**第一个音素**是元音还是辅音，而不是看字母。\n\n- **`a`** 用在以**辅音音素**开头的单词前。\n  - 例如：`a boy`, `a car`, `a university` (因为 `university` 的发音 /ˌjuːnɪˈvɜːsəti/ 以辅音 /j/ 开头)。\n\n- **`an`** 用在以**元音音素**开头的单词前。\n  - 例如：`an apple`, `an egg`, `an hour` (因为 `hour` 的 `h` 不发音，发音 /ˈaʊə(r)/ 以元音 /aʊ/ 开头)。\n\n这是小升初英语考试中非常重要的基础语法点。", "socratic_tracks": [{"title": "职业与场所逻辑匹配", "steps": [{"question": "这个句子想表达什么？它由两个部分组成，它们之间有什么关系？", "hint": "`and` 连接了两个分句，描述了同一个人 `Li Ming` 的两个方面。", "takeaway": "句子描述了李明的职业以及他的工作地点，两者应该是相互关联的。"}, {"question": "我们来检查A选项。`postman` 是什么意思？`post office` 是什么意思？他们匹配吗？", "hint": "词根 `post` 通常和“邮政”有关。", "takeaway": "`postman` 是邮递员，`post office` 是邮局，邮递员在邮局工作，逻辑完全正确。"}, {"question": "再看看B选项。`science` 是人还是物？`scientist` 是人还是物？这个选项的顺序对吗？", "hint": "以 `-ist` 结尾的词通常指“……家”或“从事……的人”。", "takeaway": "`science` 是科学（学科），`scientist` 是科学家（人），选项把人和学科搞混了，顺序也反了。"}]}, {"title": "不定冠词 `a/an` 用法", "steps": [{"question": "请仔细观察C选项，`a actor` 这个搭配在语法上有没有问题？", "hint": "想一想 `actor` 这个词的第一个字母的发音。", "takeaway": "`actor` 的发音以元音音素 /æ/ 开头，所以前面应该用 `an`，而不是 `a`。"}, {"question": "为什么 `a university` 是对的，而 `a actor` 是错的？", "hint": "冠词的选择是看单词的拼写，还是看它的发音？", "takeaway": "不定冠词 `a/an` 的选择取决于其后单词的第一个“音素”是元音还是辅音，而不是看字母。"}]}, {"title": "词义与身份辨析", "steps": [{"question": "在B选项中，`science` 和 `scientist`，哪一个词可以用来指代一个人的职业身份？", "hint": "就像 `art` (艺术) 和 `artist` (艺术家) 的关系一样。", "takeaway": "`scientist` 指人（科学家），而 `science` 指学科（科学），第一个空应该填表示人的词。"}, {"question": "在C选项中，`actor` 和 `cinema`，哪一个是职业，哪一个是地点？", "hint": "`actor` 是表演的人，`cinema` 是看电影的地方。", "takeaway": "`actor` 是职业（演员），`cinema` 是地点（电影院）。"}, {"question": "演员（actor）最主要的工作地点是电影院（cinema）吗？", "hint": "电影是在哪里拍摄的？话剧是在哪里演出的？", "takeaway": "演员主要在片场（film set）或剧院（theater）工作，电影院是观众看电影的地方，所以这个工作地点的搭配也不够精确。"}]}]}}, {"number": "9", "item_type": "choice", "context_note": "", "stem": "当别人想知道你假期去了哪里时，他/她应该问：“_____”", "options": {"A": "Where did you go over your holiday?", "B": "What did you do there?", "C": "Where are you going over your holiday?", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查在特定语境下如何正确提问。题干中文“当别人想知道你假期去了哪里时”明确了两个关键信息：一是询问“地点”（哪里），二是询问“过去发生的事情”（去了）。\n\n- 选项A `Where did you go over your holiday?` 使用疑问词 `Where` 提问地点，并使用一般过去时 `did you go` 询问过去发生的动作，完全符合题意。\n- 选项B `What did you do there?` 询问的是“做了什么”（What），而非地点。\n- 选项C `Where are you going over your holiday?` 使用了现在进行时表将来，询问的是“将要去哪里”，与题干的过去语境不符。", "knowledge_expansion_md": "### 一般过去时疑问句结构\n\n本题核心语法点是一般过去时的特殊疑问句。其基本结构为：\n\n**特殊疑问词 + did + 主语 + 动词原形 + 其他？**\n\n- **特殊疑问词**：如 `What` (什么), `Where` (哪里), `When` (何时), `Why` (为什么), `How` (如何)。\n- **助动词 `did`**: 用于构成过去式的疑问句和否定句，本身没有词义。一旦使用了 `did`，后面的动词必须用原形。\n\n### 时态辨析\n\n- **一般过去时 (Simple Past)**: `did go`，用于询问或描述过去某一时间点或时间段内发生的动作或存在的状态。标志词有 `yesterday`, `last week`, `...ago` 等。\n- **现在进行时表将来 (Present Continuous for Future)**: `are going`，用于表示按计划或安排即将发生的动作。常与表示将来的时间状语连用。\n- **一般现在时 (Simple Present)**: `do go`，用于表示习惯性、经常性的动作或客观真理。例如：`Where do you usually go for your holiday?` (你通常去哪里度假？)", "socratic_tracks": [{"title": "时态分析", "steps": [{"question": "题干中“假期去了哪里”描述的是已经发生的事情，还是将要发生的事情？", "hint": "注意“去了”这个词，是已经完成的动作还是计划中的动作？", "takeaway": "题干描述的是一个发生在过去的动作。"}, {"question": "那么在英语中，询问过去发生的事情，我们应该用什么时态？", "hint": "回忆一下表示“过去”的时态，它的助动词是什么？", "takeaway": "询问过去的动作需要使用一般过去时，其助动词是 did。"}]}, {"title": "疑问词辨析", "steps": [{"question": "题干想问的是“哪里”，在英语中，我们用哪个疑问词来提问地点？", "hint": "是 `What` (什么), `Where` (哪里), 还是 `When` (何时)？", "takeaway": "提问地点应该使用疑问词 `Where`。"}, {"question": "既然要问地点，我们可以排除哪个选项？那个选项问的是什么？", "hint": "看看哪个选项的开头不是 `Where`。", "takeaway": "可以排除以 `What` 开头的选项B，它问的是“做了什么”。"}]}, {"title": "选项对比", "steps": [{"question": "现在剩下 A 和 C 两个选项。比较 A 选项 `Where did you go...` 和 C 选项 `Where are you going...`，它们在时间上有什么不同？", "hint": "`did` 通常用于什么时间？`are ...ing` 在这个句子里表示什么时间？", "takeaway": "`did go` 表示过去，而 `are going` 在此语境下表示将来。"}, {"question": "结合第一步的结论（题干问的是过去的事），哪个选项是正确的？", "hint": "我们需要一个表示过去时态的句子。", "takeaway": "选项A使用了一般过去时，是正确的答案。"}]}]}}, {"number": "10", "item_type": "choice", "context_note": "", "stem": "当你想告诉别人“我穿着红裙子”时，你应该说：“_____”", "options": {"A": "I'm wearing a red skirt.", "B": "I wear a red cap.", "C": "I like red skirts.", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查如何描述当前正在进行的动作或状态。题干“我穿着红裙子”描述的是说话者此刻的穿着状态。\n\n- 在英语中，描述当前正在进行的动作或所处的状态，应使用现在进行时。其结构为 `am/is/are + 动词的-ing形式`。\n- 选项A `I'm wearing a red skirt.` 中，`I'm wearing` 是 `I am wearing` 的缩写，是现在进行时，表示“我正穿着”，`a red skirt` 意为“一条红裙子”，完全符合题意。\n- 选项B `I wear a red cap.` 使用了一般现在时，通常表示习惯性动作（我习惯戴红帽子），且 `cap`（帽子）与题干的 `skirt`（裙子）不符。\n- 选项C `I like red skirts.` 表达的是“我喜欢红裙子”，是一种偏好，而不是穿着的状态。", "knowledge_expansion_md": "### 现在进行时 vs. 一般现在时\n\n这是英语初学者常见的混淆点，尤其是在使用 `wear` 这类既可表示动作又可表示状态的动词时。\n\n1.  **现在进行时 (Present Continuous)**: `am/is/are + wearing`\n    - **用法**: 表示说话时正在进行的动作或所处的状态。\n    - **例句**: `Look! The girl is wearing a beautiful dress.` (快看！那个女孩穿着一条漂亮的连衣裙。) -> 强调“此刻正穿着”。\n\n2.  **一般现在时 (Simple Present)**: `wear/wears`\n    - **用法**: 表示习惯性的、经常性的动作或一般性的事实。\n    - **例句**: `She wears glasses.` (她戴眼镜。) -> 表示她平时有戴眼镜的习惯，是一个普遍事实，而不是特指现在。\n\n### 词汇辨析\n\n- `skirt`: 半身裙\n- `dress`: 连衣裙\n- `cap`: （有帽檐的）帽子，如棒球帽\n- `hat`: 帽子（总称）", "socratic_tracks": [{"title": "时态辨析：现在与习惯", "steps": [{"question": "“我穿着红裙子”这句话，是想表达“我每天都穿红裙子”这个习惯，还是“我现在身上正穿着红裙子”这个状态？", "hint": "想象一下你指着自己向别人介绍时的场景。", "takeaway": "这句话描述的是说话时正持续的状态。"}, {"question": "那么，在英语中，描述当前正在进行的动作或状态，我们应该用什么时态？", "hint": "是表示习惯的一般现在时，还是表示“正在进行”的现在进行时？", "takeaway": "描述当前状态或动作应使用现在进行时 (be + doing)。"}]}, {"title": "词汇准确性", "steps": [{"question": "题干中的“红裙子”应该翻译成 `red skirt` 还是 `red cap`？", "hint": "`skirt` 和 `cap` 分别是什么意思？", "takeaway": "“红裙子”是 `red skirt`，“红帽子”是 `red cap`。"}, {"question": "根据这个词汇知识，我们可以排除哪个选项？为什么？", "hint": "哪个选项描述的物品与题干不符？", "takeaway": "可以排除选项B，因为它描述的是 `red cap`（红帽子），与题干不符。"}]}, {"title": "句意理解", "steps": [{"question": "选项 C `I like red skirts.` 表达的是什么意思？", "hint": "动词 `like` 是什么意思？", "takeaway": "选项 C 表达的是“我喜欢红裙子”这一偏好或喜好。"}, {"question": "“喜欢”和“穿着”是同一个意思吗？它能回答“你穿着什么”这个问题吗？", "hint": "一个人可以喜欢某样东西，但并不一定此刻就穿着它。", "takeaway": "表达喜好和描述当前状态是完全不同的两个概念，因此选项C不符合题意。"}]}]}}]}, {"section_title": "III. 选词/短语填空。(共5分)", "section_instruction": "set up\trubbish\twould like\tdream\tdid", "items": [{"number": "11", "item_type": "fill_blank", "context_note": "", "stem": "They _____ a hope school for the poor children.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "set up", "explanation_md": "本题考查在具体语境中选择合适的动词短语。句子大意是“他们为贫困儿童______一所希望小学”。\n\n- 空格处需要一个动词或动词短语来表达“创办”或“建立”学校这个动作。\n- `set up` 是一个非常常见的动词短语，意为“建立，创办，设立”，用在这里非常贴切。\n- 完整句子为 `They set up a hope school for the poor children.`（他们为贫困儿童创办了一所希望小学。）\n- 这里的 `set up` 既可以理解为一般过去时（动词 `set` 的过去式和原形相同），表示“创办了”；也可以理解为一般现在时，表示他们经常或习惯性地做这件事。\n- 在没有上下文的情况下，通常理解为过去时更为常见。", "knowledge_expansion_md": "### 核心动词短语 `set up`\n\n`set up` 是一个高频多义动词短语，在小升初阶段，主要掌握其“建立，创办”的含义。\n- **含义**: 建立（公司、组织、学校等）；安装；安排（会议等）。\n- **例句**:\n  - `They plan to set up a new company.` (他们计划成立一家新公司。)\n  - `Can you help me set up the printer?` (你能帮我安装一下打印机吗？)\n\n### 相关动词辨析\n\n- `build` (v.): 建造。多指具体的建筑施工过程，侧重于“盖楼”。例如：`They built a new library last year.` (他们去年建了一座新图书馆。)\n- `found` (v.): 创立，创办。比 `set up` 更为正式，常用于创立国家、大学、重要机构等。例如：`The university was founded in 1901.` (这所大学创建于1901年。)\n- `run` (v.): 经营，管理。指学校建成后的日常运营。例如：`He runs the school very well.` (他把学校管理得很好。)\n\n在描述“创办希望小学”这一事件时，`set up` 和 `built` 都是可能的，但 `set up` 侧重于机构的创立，而 `built` 侧重于校舍的建造。", "socratic_tracks": [{"title": "动词搭配", "steps": [{"question": "看到句子中的“a hope school”（一所希望小学），你首先会想到对学校做什么样的动作？", "hint": "比如是“吃”一所学校，还是“建造”或“创办”一所学校？", "takeaway": "对学校通常是进行“建造”、“创办”或“经营”等动作。"}, {"question": "在英语中，哪个常见的动词短语可以表示“建立”或“创办”？", "hint": "这个短语由两个单词组成，第一个是 s... 开头，第二个是 u... 开头。", "takeaway": "动词短语 `set up` 意为“建立，创办”。"}]}, {"title": "理解句意", "steps": [{"question": "这句话的主语是 `They` (他们)，宾语是 `a hope school` (一所希望小学)，`for the poor children` (为贫困儿童) 是目的状语。整个句子的意思是什么？", "hint": "把所有部分连起来，用中文描述一下。", "takeaway": "句意是“他们为贫困儿童做了一件与希望小学有关的事情”。"}, {"question": "结合“创办”这个意思，填入 `set up` 后，句子 `They set up a hope school for the poor children.` 是否通顺合理？", "hint": "翻译一下这个完整的句子，看看是否符合逻辑。", "takeaway": "填入 `set up` 后，句意为“他们为贫困儿童创办了一所希望小学”，非常通顺合理。"}]}, {"title": "时态思考", "steps": [{"question": "`set up` 这个动词短语，它的过去式和过去分词是什么？", "hint": "这是一个不规则变化，想一想 `put-put-put` 或 `cut-cut-cut`。", "takeaway": "`set up` 的原形、过去式、过去分词都是 `set up` (A-A-A型)。"}, {"question": "因此，这个句子可以被理解为一般现在时或一般过去时。这两种时态在意思上有什么区别？", "hint": "一般现在时表示习惯或事实，一般过去时表示过去发生的动作。", "takeaway": "理解为过去时（他们创办了）更像是在讲述一个故事，而现在时（他们创办）则说明这是一种常规行为，两者语法都对。"}]}]}}, {"number": "12", "item_type": "fill_blank", "context_note": "", "stem": "What shall we do with the _____?", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "rubbish", "explanation_md": "本题考查固定句型及相关名词。句型 `What shall we do with...?` 意为“我们该如何处理/处置……？”，用来征求处理某物或某事的意见。\n\n- 空格处需要填入一个名词，作为 `do with` 的宾语，即需要被处理的东西。\n- 结合生活常识和英语学习中的常见话题（如环境保护、日常生活），“垃圾”是经常需要讨论如何处理的物品。\n- `rubbish` 是英语中表示“垃圾，废弃物”的常用词，填入后符合语境。\n- 完整句子为 `What shall we do with the rubbish?`（我们该怎么处理这些垃圾呢？），意思通顺，逻辑合理。\n- 同样表示“垃圾”的 `trash` 也是一个完全正确的答案。", "knowledge_expansion_md": "### 核心句型：`What to do with...?`\n\n这是一个非常实用的句型，用于询问如何处理某事或某物，表达一种征求意见或略带为难的语气。\n- **完整形式**: `What shall/should/can we do with...?`\n- **不定式形式**: `I don't know what to do with...`\n- **例句**:\n  - `What shall we do with the old newspapers?` (我们该怎么处理这些旧报纸？)\n  - `He didn't know what to do with all his free time.` (他不知道该如何打发他所有的空闲时间。)\n\n### 词汇辨析：表示“垃圾”的词\n\n在英语中，有多个词可以表示“垃圾”，它们在使用上略有区别：\n- `rubbish`: 主要在英式英语中使用，泛指各种废弃物。\n- `trash`: 主要在美式英语中使用，通常指废纸、包装等干垃圾。\n- `garbage`: 主要在美式英语中使用，多指厨房产生的食物残渣等湿垃圾。\n- `waste`: 含义最广，可指任何废料、废品、废水等，更为正式和书面化。\n\n对于小升初阶段的学生来说，掌握 `rubbish` 和 `trash` 即可满足大部分日常和考试需求。", "socratic_tracks": [{"title": "理解句型", "steps": [{"question": "看到 `What shall we do with...?` 这个句型，你觉得它是在问什么？", "hint": "短语 `do with` 的意思是“处理，处置”。", "takeaway": "这个句型是用来询问“我们该如何处理/处置某物？”。"}, {"question": "那么，横线上应该填入一个什么样的词？", "hint": "既然是“处理”某物，横线上应该是一个物品的名称，也就是一个名词。", "takeaway": "横线上需要填入一个表示需要被处理的物品的名词。"}]}, {"title": "词汇联想", "steps": [{"question": "在日常生活中，有哪些东西是我们经常需要思考“该怎么处理”的？", "hint": "想想家里的、学校里的，比如不再需要的旧东西，或者吃完饭剩下的东西。", "takeaway": "我们经常需要处理垃圾、旧书、剩饭剩菜等物品。"}, {"question": "“垃圾”用英语怎么说？你能想到至少两个单词吗？", "hint": "一个在英式英语中常用 (r...)，一个在美式英语中常用 (t...)。", "takeaway": "“垃圾”在英语中可以说 `rubbish` 或 `trash`。"}]}, {"title": "语境判断", "steps": [{"question": "假设横线上填入 `books` (书)，句子 `What shall we do with the books?` 通顺吗？", "hint": "当然通顺，比如在搬家或整理房间时可能会这么问。", "takeaway": "填入 `books` 语法正确，意思也通顺。"}, {"question": "相比于 `books` 或 `money`，为什么 `rubbish` (垃圾) 在小升初英语的选词填空中，是更可能考查的词汇？", "hint": "考虑一下教材和考试中常见的单元主题，比如环境保护、城市生活等。", "takeaway": "`rubbish` 紧密关联环保这一核心话题，是小升初阶段的重点词汇和热门考点，因此是本题最可能的答案。"}]}]}}, {"number": "13", "item_type": "fill_blank", "context_note": "", "stem": "They _____ to go to the West Lake in Hangzhou.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "would like", "explanation_md": "本题考查固定搭配 `would like to do sth.`，意为“想要做某事”。\n\n1.  句意为“他们想去杭州西湖”。\n2.  空格后是动词不定式 `to go`，前面需要一个能接不定式的动词或短语来表达意愿。\n3.  `would like` 是一个常用的、表达委婉愿望的短语，其后跟动词不定式，形式为 `would like to do sth.`。\n4.  主语 `They` 是复数，但情态动词 `would` 不随主语人称和数的变化而变化，因此填入 `would like` 完全正确。", "knowledge_expansion_md": "### `would like` vs. `like` vs. `want`\n\n*   **`would like to do sth.`**: 表示**具体某一次**的愿望，语气较为**委婉、礼貌**。例如：`I would like to have a cup of tea.` (我想喝杯茶)。\n*   **`like doing sth.` / `like to do sth.`**: 表示**长期、习惯性**的喜好。例如：`I like drinking tea.` (我喜欢喝茶)。\n*   **`want to do sth.`**: 表示**直接、强烈**的愿望，语气不如 `would like` 委婉。例如：`I want to go home.` (我想回家)。\n\n### 其他后接不定式的动词/短语\n\n许多表示“计划、决定、希望、同意”等的动词后都跟动词不定式 `to do`，例如：\n*   `plan to do sth.` (计划做某事)\n*   `decide to do sth.` (决定做某事)\n*   `hope to do sth.` (希望做某事)\n*   `agree to do sth.` (同意做某事)\n*   `need to do sth.` (需要做某事)", "socratic_tracks": [{"title": "固定搭配 `would like to do`", "steps": [{"question": "观察空格后面的 `to go`，这是一个什么样的结构？", "hint": "它由 `to` 和一个动词原形构成，我们称之为“动词不定式”。", "takeaway": "空格后是动词不定式结构，表示一个将要发生的动作。"}, {"question": "在英语中，有哪些常见的短语可以放在动词不定式前，用来表达“想要做某事”的愿望？", "hint": "想一想“想要”怎么说？除了 `want` 还有更礼貌的说法吗？", "takeaway": "固定搭配 `would like to do sth.` 是表达“想要做某事”的常见且委婉的方式。"}]}, {"title": "情态动词 `would` 的用法", "steps": [{"question": "如果把 `would like` 换成 `like`，句子 `They like to go...` 的意思有什么不同？", "hint": "一个是谈论一次具体的想法，另一个是谈论平时的爱好。", "takeaway": "`would like` 表达的是特定的、具体的愿望，而 `like` 表达的是一般性的、长期的喜好。"}, {"question": "这里的 `would` 起到了什么作用？它对句子的语气有什么影响？", "hint": "对比一下 `I want an apple.` 和 `I would like an apple.`，哪一句听起来更客气？", "takeaway": "情态动词 `would` 在这里使愿望的表达听起来更加礼貌和委婉。"}, {"question": "主语是 `They`，为什么 `like` 前面的 `would` 不需要变成复数形式？", "hint": "想一想 `can`, `may`, `must` 这些词会根据主语变化吗？", "takeaway": "`would` 是情态动词，它本身没有人称和数的变化，适用于所有主语。"}]}, {"title": "主谓一致", "steps": [{"question": "这个句子的主语是 `They`，它是单数还是复数？", "hint": "`They` 指的是“他们/她们/它们”。", "takeaway": "主语 `They` 是第三人称复数。"}, {"question": "如果不用 `would like`，而是用 `want`，那么应该用 `want` 还是 `wants`？", "hint": "在一般现在时中，当主语是第三人称复数时，动词用什么形式？", "takeaway": "当主语是复数时，动词用原形，所以应该是 `They want`。"}]}]}}, {"number": "14", "item_type": "fill_blank", "context_note": "", "stem": "My sister's _____ is to be a teacher.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "dream", "explanation_md": "本题考查名词词义辨析及句子结构理解。\n\n1.  句意为“我姐姐的_____是成为一名教师”。\n2.  句子结构是“主语 + is + 表语”，其中 `is` 是系动词，后面的 `to be a teacher` (成为一名教师) 是动词不定式作表语，用来解释说明主语的内容。\n3.  能够用“成为一名教师”来具体说明的，通常是“梦想”、“目标”或“愿望”。\n4.  在常见的词汇中，`dream` (梦想) 最符合语境，指对未来的憧憬和理想。", "knowledge_expansion_md": "### 不定式作表语\n\n动词不定式 (`to do sth.`) 可以在系动词（如 `be`, `seem`, `look` 等）之后作表语，用来说明主语的具体内容。这种结构通常用来表达计划、目的、愿望、职责等。\n*   **句型**：`主语 + be + to do sth.`\n*   **例子**：\n    *   `My plan is to finish the work tomorrow.` (我的计划是明天完成这项工作。)\n    *   `His job is to help customers.` (他的工作是帮助顾客。)\n\n### 词义辨析：`dream`, `goal`, `wish`, `ambition`\n\n*   **`dream`** (梦想): 通常指比较长远的、美好的、有时甚至不太容易实现的理想。\n*   **`goal`** (目标): 指经过努力可以达到的、具体的、阶段性的目标。\n*   **`wish`** (愿望): 多指具体的、希望发生或拥有的事情，有时可能不切实际。\n*   **`ambition`** (抱负，野心): 指对成就、权力、财富等的强烈渴望，是一个更正式、更强烈的词。", "socratic_tracks": [{"title": "句子结构分析", "steps": [{"question": "这个句子的主语、系动词和表语分别是什么？", "hint": "主语是动作的发出者，系动词连接主语和表语，表语说明主语的身份或状态。", "takeaway": "主语是 `My sister's _____`，系动词是 `is`，表语是 `to be a teacher`。"}, {"question": "表语 `to be a teacher` 在这里起什么作用？", "hint": "它在解释说明“我姐姐的……”是什么。", "takeaway": "动词不定式 `to be a teacher` 作表语，用来说明主语的具体内容。"}, {"question": "既然表语是“成为一名教师”，那么空格处应该填入一个表示什么概念的名词？", "hint": "想一想关于未来的计划、理想之类的词。", "takeaway": "空格处需要填入一个能被“成为一名教师”所解释的名词，如“梦想”或“目标”。"}]}, {"title": "核心词汇选择", "steps": [{"question": "“成为一名教师”是一种当前的工作，还是对未来的设想？", "hint": "注意 `to be` 表示“将要成为”。", "takeaway": "这是一个对未来的理想或规划。"}, {"question": "`job` (工作) 这个词填在这里合适吗？为什么？", "hint": "`job` 通常指现在的职业，而句意指向未来。", "takeaway": "`job` 不合适，因为它描述的是现状，而 `to be a teacher` 是一个未来的愿望。"}, {"question": "在 `dream` (梦想) 和 `wish` (愿望) 中，哪一个更适合描述“成为一名教师”这种人生规划？", "hint": "`dream` 通常指长远的、重大的理想，而 `wish` 可能更侧重于具体的、小一点的愿望。", "takeaway": "`dream` (梦想) 更能体现“成为教师”这种长期的人生理想。"}]}, {"title": "名词所有格", "steps": [{"question": "句首的 `My sister's` 是什么意思？这个 `'s` 表示什么？", "hint": "它表示一种归属关系，即“……的”。", "takeaway": "`My sister's` 是名词所有格，意思是“我姐姐的”。"}, {"question": "如果主语是复数名词，比如 `the boys`，我们想说“男孩们的梦想”，应该怎么写？", "hint": "对于以 `s` 结尾的复数名词，所有格通常只在词尾加一撇 `’`。", "takeaway": "以 `s` 结尾的复数名词，其所有格直接在末尾加撇号，写作 `the boys' dreams`。"}]}]}}, {"number": "15", "item_type": "fill_blank", "context_note": "", "stem": "I _____ the high jump last week.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "横线", "teaching": {"correct_answer": "did", "explanation_md": "本题考查动词时态和动宾搭配。\n\n1.  句意为“我上周参加了跳高运动”。\n2.  句中的时间状语 `last week` (上周) 表明动作发生在过去，因此谓语动词需要使用一般过去时。\n3.  “进行跳高运动”在英语中常用固定搭配 `do the high jump`。\n4.  动词 `do` 的过去式是不规则变化，应为 `did`。\n5.  综合以上两点，空格处应填入 `did`。", "knowledge_expansion_md": "### 体育运动的动词搭配：`play`, `go`, `do`\n\n英语中，不同的体育运动或活动通常与特定的动词搭配使用，这是一个重要的知识点。\n\n*   **`play`**: 通常用于**球类运动**、**棋类**或**团队对抗性**的比赛。\n    *   例如: `play football` (踢足球), `play basketball` (打篮球), `play chess` (下象棋)。\n\n*   **`go`**: 常与以 **`-ing` 结尾的动词**连用，表示去参加某项休闲活动，强调过程。\n    *   例如: `go swimming` (去游泳), `go fishing` (去钓鱼), `go shopping` (去购物)。\n\n*   **`do`**: 常用于**个人性**的、**非团队**的运动、武术或健身活动。\n    *   例如: `do kung fu` (练功夫), `do yoga` (做瑜伽), `do the high jump` (跳高), `do the long jump` (跳远)。\n\n### 不规则动词过去式\n\n`do` 是一个不规则动词，其过去式是 `did`，过去分词是 `done`。初中阶段需要掌握大量常见不规则动词的变位，例如：\n*   `go` -> `went` -> `gone`\n*   `see` -> `saw` -> `seen`\n*   `eat` -> `ate` -> `eaten`", "socratic_tracks": [{"title": "确定动词时态", "steps": [{"question": "句子中是否有表示时间的词或短语？它是什么？", "hint": "找一找描述“什么时候”的词。", "takeaway": "句中有时间状语 `last week` (上周)。"}, {"question": "`last week` 表明动作发生在什么时候？因此，句子应该使用什么时态？", "hint": "“上周”是过去的时间。", "takeaway": "它表明动作发生在过去，所以句子要用一般过去时。"}]}, {"title": "动词与运动的搭配", "steps": [{"question": "“跳高” (`the high jump`) 是一项运动，我们通常用哪个动词来表示“进行”这项运动？", "hint": "想一想 `play`, `go`, `do` 这三个动词在搭配运动时的区别。", "takeaway": "“进行跳高运动”的固定搭配是 `do the high jump`。"}, {"question": "结合上一个知识点（需要用过去时），我们应该把动词 `do` 变成什么形式？", "hint": "`do` 的过去式是一个不规则变化。", "takeaway": "动词 `do` 的一般过去时形式是 `did`。"}]}, {"title": "辨析 `play`, `go`, `do`", "steps": [{"question": "我们什么时候用 `play` 来谈论运动？能举个例子吗？", "hint": "通常是需要用手或脚控制一个球，或者有对手的棋类游戏。", "takeaway": "`play` 常用于球类和对抗性比赛，如 `play tennis` (打网球)。"}, {"question": "那什么时候用 `go` 呢？", "hint": "通常是去某个地方进行的、以 `-ing` 结尾的活动。", "takeaway": "`go` 常与动词的 `-ing` 形式连用，表示去参加某活动，如 `go skating` (去滑冰)。"}, {"question": "`do` 又适用于哪些运动或活动？", "hint": "想一想那些一个人就可以练习的，比如武术、体操等。", "takeaway": "`do` 常用于个人性的运动或健身活动，如 `do gymnastics` (做体操)。"}]}]}}]}, {"section_title": "IV. 完形填空。(共10分)", "section_instruction": "It was a beautiful spring day. Millie got up this morning. She saw some (16) in the sky, but she didn't think about them. She woke up her dog, Eddie, and put him in the car. Then she (17) out into the country for a picnic with her dog. They got to a big tree. Millie stopped her car and told Eddie (18) off the car. They began to play games under the tree. How happy they were! An hour later, the wind began to blow(吹) and it turned (19). Millie and Eddie were warm from running, so they didn't feel cold.\nSuddenly, Millie (20) snowflakes(雪花) in the sky. She called Eddie, picked up the picnic things and got (21) into the car. The snow became heavier and heavier. Soon everything was white all around (22). The road became slippery(滑的) and she had to drive very slowly. Then the car hit into a piece of ice and it went around in circles. She got her mobile phone and asked for (23). At (24), the police came to save them. Millie was very thankful. She said she would listen to the weather report(预报) (25) going on a picnic next time.", "items": [{"number": "16", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "banks", "B": "clouds", "C": "snows", "D": "kites"}, "answer_area_hint": "", "teaching": {"correct_answer": "D", "explanation_md": "本题为完形填空，虽然缺少完整语境，但我们可以根据选项进行合理推断。本题考查名词词义辨析。\n\n1.  分析选项：A. `banks` (银行/河岸)，B. `clouds` (云)，C. `snows` (雪)，D. `kites` (风筝)。\n2.  推测语境：这四个词中，`kites` (风筝) 是最常与儿童户外活动联系在一起的物品。\n3.  我们可以构建一个合理的场景：天气晴朗有风，孩子们在公园里玩耍。\n4.  在这种场景下，“放风筝” (`fly kites`) 是一个非常常见的活动。例如，前文可能是 `It was a windy day, so the children went to the park to fly their _____`。\n5.  其他选项与“放飞”这一动作或儿童公园活动的相关性不大，因此 `kites` 是最符合逻辑的选择。", "knowledge_expansion_md": "### 词义辨析与语境推断\n\n在完形填空题中，即使上下文信息不全，也可以通过分析选项本身的含义和常见搭配来推测答案。\n\n*   **`kite` (n. 风筝)**: 常用搭配 `fly a kite` (放风筝)。这是一个非常高频的考点，通常与 `windy` (有风的), `park` (公园), `string` (线) 等词一同出现。\n*   **`bank` (n. 岸；银行)**: 作为一个多义词，需要根据语境判断。`river bank` (河岸) 或 `on the bank of the lake` (在湖边)；`go to the bank to save money` (去银行存钱)。\n*   **`cloud` (n. 云)**: 通常与天空、天气有关。`The sun is behind the clouds.` (太阳在云后面)。\n*   **`snow` (n. 雪)**: 通常为不可数名词。但在表示“一场一场的雪”或“大雪”时，可用复数 `snows`。例如：`the winter snows` (冬天的几场大雪)。但在初中阶段，主要掌握其不可数用法。\n\n掌握这些词的常见用法和搭配，是做好完形填空的关键。", "socratic_tracks": [{"title": "语境逻辑推断", "steps": [{"question": "选项 `kites` 是什么意思？它通常和什么动词搭配在一起？", "hint": "一种有线的玩具，可以在天上飞。", "takeaway": "`kites` 是风筝，常与动词 `fly` 搭配，组成 `fly kites` (放风筝)。"}, {"question": "“放风筝”这项活动一般在什么样的天气和地点进行？", "hint": "什么天气能让风筝飞起来？去哪里放风筝比较安全开阔？", "takeaway": "放风筝通常需要有风的天气，并在公园、广场等开阔地进行。"}, {"question": "如果一篇文章描述了“有风的日子”和“孩子们在公园里”，那么填入 `kites` 是不是最合理的？", "hint": "对比一下，在这种场景下，孩子们会去“放银行”、“放云”或者“放雪”吗？", "takeaway": "在推测的“公园活动”语境下，`kites` 是唯一符合逻辑的答案。"}]}, {"title": "选项词义辨析", "steps": [{"question": "选项 A `banks` 有哪两个完全不同的常见意思？", "hint": "一个和钱有关，一个和水有关。", "takeaway": "`banks` 可以是“银行”（复数），也可以是“河岸、堤岸”（复数）。"}, {"question": "选项 B `clouds` 和 C `snows` 都和哪一类自然现象有关？", "hint": "抬头看天，或者感受季节变化。", "takeaway": "`clouds` (云) 和 `snows` (雪) 都与天气有关。"}, {"question": "在这四个名词中，哪一个最可能成为孩子们户外玩耍时“拥有”和“放飞”的物品？", "hint": "哪个词描述的是一种玩具？", "takeaway": "`kites` (风筝) 是最符合儿童户外活动语境的物品。"}]}, {"title": "名词的数", "steps": [{"question": "四个选项 `banks`, `clouds`, `snows`, `kites` 在词形上有什么共同点？", "hint": "注意它们的词尾。", "takeaway": "它们都是以 `-s` 结尾的名词复数形式。"}, {"question": "`snow` 这个词，我们平时说“下雪了” (`It's snowing.`) 时，是把它当可数名词还是不可数名词？", "hint": "我们能数“一个雪，两个雪”吗？", "takeaway": "`snow` 通常是不可数名词，表示“雪”这种物质。"}, {"question": "那为什么选项里会有 `snows` 这种形式呢？它在什么特殊情况下使用？", "hint": "当你想强调“好几场雪”或者“大片大片的雪景”时。", "takeaway": "当 `snow` 指“一场一场的雪”或“大面积的积雪”时，可以用复数 `snows`，但这在初中不常用。"}]}]}}, {"number": "17", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "drove", "B": "walked", "C": "ran", "D": "flew"}, "answer_area_hint": "", "teaching": {"correct_answer": "A", "explanation_md": "本题考查在具体语境中选择合适的动词。选项均为表示移动的动词过去式。A. drove (驾驶), B. walked (步行), C. ran (跑步), D. flew (飞行)。在完形填空的记叙文语境中，描述一家人或朋友出行，最常见的情景之一是“开车去某地”。因此，在没有更具体上下文的情况下，`drove` 是最符合逻辑和普遍生活经验的选项。它暗示了主语通过驾驶交通工具的方式到达目的地。", "knowledge_expansion_md": "### 动词过去式及用法辨析\n\n本题的四个选项都是表示“移动”的动词，但方式和适用场景不同。\n\n1.  **不规则动词过去式**: 学习并记忆常见不规则动词的过去式是基础。\n    *   `drive` (驾驶) -> `drove`\n    *   `run` (跑) -> `ran`\n    *   `fly` (飞) -> `flew`\n2.  **规则动词过去式**: 大部分动词的过去式是在原形后加 `-ed`。\n    *   `walk` (走) -> `walked`\n3.  **词义与语境**: \n    *   `drove`: 通常指驾驶汽车、卡车等。在没有明确指出交通工具时，`drove` 常常就暗指“开车”。\n    *   `walked`: 指“步行”，适用于短距离或徒步旅行的场景。\n    *   `ran`: 指“跑步”，除非上下文是关于体育比赛、锻炼或紧急情况，否则在旅行语境中较少使用。\n    *   `flew`: 指“飞行”，通常指乘坐飞机长途旅行，或描述鸟类、昆虫的飞行。", "socratic_tracks": [{"title": "动词时态判断", "steps": [{"question": "观察四个选项 (drove, walked, ran, flew)，它们的时态有什么共同点？", "hint": "这些词是动词的现在式还是过去式？", "takeaway": "所有选项都是动词的过去式，这表明句子需要一个过去式谓语来描述过去发生的动作。"}]}, {"title": "交通方式动词辨析", "steps": [{"question": "这四个动词分别描述了哪种出行方式？", "hint": "想象一下 drive a car, walk to school, run a race, fly in a plane 这些常用短语。", "takeaway": "drove是开车，walked是步行，ran是跑步，flew是飞行，它们对应了不同的交通或移动方式。"}, {"question": "在一篇讲述周末出游的故事里，哪种交通方式最常见和合乎逻辑？", "hint": "考虑家庭或朋友一起出游的便利性。", "takeaway": "开车（drove）是记叙文中描述出行的常见且合理的方式。"}]}, {"title": "及物与不及物用法", "steps": [{"question": "我们常说 \"drive a car\"，这里的 \"drive\" 后面跟了宾语 \"a car\"。如果句子是 \"We drove there.\"，这里的 \"drove\" 后面有宾语吗？", "hint": "\"there\" 是一个表示地点的副词，不是名词宾语。", "takeaway": "动词 \"drive\" 既可以作及物动词（后接宾语），也可以作不及物动词（不接宾语，泛指开车这一行为）。"}]}]}}, {"number": "18", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "get", "B": "got", "C": "to get", "D": "getting"}, "answer_area_hint": "", "teaching": {"correct_answer": "B", "explanation_md": "本题考查动词在句子中作谓语时的正确形式。一个完整的句子必须有谓语动词。根据完形填空通常为记叙文的特点，文章时态大概率是一般过去时。选项中，A `get` 是动词原形，C `to get` 是不定式，D `getting` 是-ing形式，这三者都不能单独在主语后作谓语。只有 B `got` 是 `get` 的过去式，可以独立作谓语，表示过去发生的动作。因此，`got` 是唯一正确的选择。", "knowledge_expansion_md": "### 动词在句子中的功能\n\n在一个简单句中，主语之后通常需要一个谓语动词来构成完整句意。动词的不同形式有不同的语法功能：\n\n*   **动词过去式 (e.g., `got`, `went`, `played`)**: 主要用于一般过去时的肯定句中，独立作谓语，表示过去发生的动作或存在的状态。例如：`He got a new book yesterday.`\n*   **动词原形 (e.g., `get`, `go`, `play`)**: 用于一般现在时（主语为复数或I/you/we/they时）、情态动词后、或某些使役动词后。不能在一般过去时句子中单独作谓语。例如：`They get up early.` / `You should get up early.`\n*   **不定式 (to do, e.g., `to get`)**: 不能独立作谓语。常用于表达目的（`He came here to get help.`）或跟在某些动词后（`I want to get a new pen.`）。\n*   **-ing形式 (e.g., `getting`)**: 不能独立作谓语。常用于进行时态（与be动词连用，如 `is getting`）或作动名词（在句中充当主语、宾语等，如 `Getting up early is good.`）。", "socratic_tracks": [{"title": "寻找句子主干", "steps": [{"question": "一个最简单的英文句子需要包含哪两个部分？", "hint": "比如 \"Birds fly.\"，\"Birds\" 是什么成分？\"fly\" 是什么成分？", "takeaway": "一个完整的句子至少需要主语和谓语。"}, {"question": "这道题的横线处，是不是正缺少一个能让句子完整的谓语动词？", "hint": "假设主语是 \"He\"，那么 \"He ___ ...\" 需要一个动作来完成。", "takeaway": "确定句子所缺的成分是谓语动词，是解题的关键一步。"}]}, {"title": "动词形式的功能", "steps": [{"question": "我们来看四个选项：get, got, to get, getting。它们能直接放在主语后面作谓语吗？比如 \"I get...\", \"I got...\", \"I to get...\", \"I getting...\"，哪些句子是正确的？", "hint": "试着回忆一下你学过的句子结构。", "takeaway": "动词原形(get)和过去式(got)可以直接作谓语，而不带to的不定式(to get)和-ing形式(getting)则不能。"}, {"question": "那么，在什么情况下我们会使用 \"to get\" 和 \"getting\" 呢？", "hint": "想想 \"want to do\" 和 \"be doing\" 这样的结构。", "takeaway": "不定式(to get)常跟在特定动词后，-ing形式(getting)常用于进行时或作动名词，它们都需要在特定的结构中使用。"}]}, {"title": "确定文章时态", "steps": [{"question": "完形填空通常是讲述一个故事或一段经历。这类文章最常用的时态是什么？", "hint": "故事是发生在现在还是过去？", "takeaway": "记叙文通常使用一般过去时来叙述已经发生的事情。"}, {"question": "在确定了时态是一般过去时之后，我们应该选择 \"get\" 的哪种形式作谓语？", "hint": "哪个选项是 \"get\" 的过去式？", "takeaway": "在一般过去时句子中，谓语动词应使用其过去式形式，即 `got`。"}]}]}}, {"number": "19", "item_type": "cloze", "context_note": "Cloze Passage", "stem": "( )", "options": {"A": "warm", "B": "hot", "C": "cool", "D": "cold"}, "answer_area_hin
