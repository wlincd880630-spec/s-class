<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第11套","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟"},"sections":[{"section_title":"I. 单项选择","section_instruction":"（共20分）","items":[{"number":"1","item_type":"choice","context_note":"","stem":"Our team lost _____ the team from No. 6 Middle School.","options":{"A":"on","B":"at","C":"in","D":"to"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查固定搭配。动词 `lose` 在表示“输给……”时，其固定搭配是 `lose to sb./sth.`。句子的意思是“我们的队伍输给了来自第六中学的队伍”。根据句意和固定搭配的规则，空格处应填入介词 `to`。因此，正确答案是 D。","knowledge_expansion_md":"### 动词与介词的搭配\n\n在英语中，很多动词需要与特定的介词搭配才能表达完整的意思，这些组合通常是固定的，需要记忆。\n\n1.  **`lose to sb./sth.`**: 意为“输给某人/某物”。\n    *   *例句*: Our basketball team lost to the visiting team by only one point. (我们的篮球队仅以一分之差输给了客队。)\n\n2.  **`win against/over sb./sth.`**: 意为“战胜/赢了某人/某物”，是 `lose to` 的反义表达。\n    *   *例句*: She finally won over her opponent. (她最终战胜了她的对手。)\n\n3.  **`lose` 的其他用法**:\n    *   作及物动词，意为“丢失，失去”。例: `I lost my keys yesterday.` (我昨天把钥匙弄丢了。)\n    *   与 `get` 连用，`get lost` 意为“迷路”。例: `We got lost in the big city.` (我们在大城市里迷路了。)\n\n4.  **易混淆词**：注意区分 `lose` (v. /luːz/ 丢失；输掉) 和 `loose` (adj. /luːs/ 松的)。","socratic_tracks":[{"title":"动词搭配","steps":[{"question":"句中的核心动词是什么？它表达了什么意思？","hint":"句子的主语是 `Our team`，谓语动词是 `lost`。","takeaway":"核心动词是 `lost`，是 `lose` 的过去式，表示“输了”。"},{"question":"当我们说“A队输给了B队”时，英文中“输给”这个概念通常用哪个动词和介词组合来表达？","hint":"想一想比赛结果的表达方式，比如“比分是3比2”，我们会说 `3 to 2`。","takeaway":"“输给某人/某队”的固定搭配是 `lose to sb./sth.`。"}]},{"title":"介词辨析","steps":[{"question":"为什么不能选 `on`, `at`, `in`？这些介词通常用在什么地方？","hint":"`on` 表示在...上面，`at` 表示在某个地点，`in` 表示在...里面。","takeaway":"这些介词在这里的语境中都不符合逻辑，无法表达“输给”这个对手关系。"},{"question":"那么，介词 `to` 在这里起什么作用？它表示方向还是其他？","hint":"`to` 可以表示方向（go to school），也可以表示对象（give it to me）。","takeaway":"在 `lose to` 这个搭配中，`to` 指出了“输”这个动作的对象，即输给了谁。"}]},{"title":"语境理解","steps":[{"question":"这句话描述了一个什么场景？","hint":"句子提到了 `team` (队伍) 和 `lost` (输了)。","takeaway":"这句话描述了一场比赛或竞赛的场景。"},{"question":"在比赛场景中，两支队伍的关系是什么？","hint":"一支队伍是另一支队伍的对手。","takeaway":"`lose to` 这个结构清晰地表达了这种对抗和结果的关系。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"I _____, so I didn't know where I was.","options":{"A":"lost","B":"was lost","C":"lose","D":"am lost"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查时态和语态。根据后半句 `so I didn't know where I was` 可知，事情发生在过去，因此应使用过去时态，排除 C (`lose`) 和 D (`am lost`)。`lost` 是动词 `lose` 的过去式，意为“丢失；输掉”，是主动语态，例如：`I lost my wallet.` (我丢了钱包)。而 `was lost` 是 `be lost` 的过去时形式，表示“迷路了”的状态。后半句“我不知道我在哪里”解释了前半句的原因，即“我迷路了”。因此，表示“迷路”的状态应用 `be lost` 结构，此处用过去时 `was lost`。","knowledge_expansion_md":"### `lose` 的相关用法辨析\n\n1.  **`be lost`**: 表示“迷路；迷失方向”。这里的 `lost` 是过去分词作表语，功能类似于形容词，描述主语所处的状态。\n    *   *例句*: `The child was lost in the crowd.` (那个孩子在人群中走失了。)\n\n2.  **`get lost`**: 也可以表示“迷路”，但更侧重于“迷路”这个动作的发生，即从不迷路到迷路的过程。\n    *   *例句*: `Follow the map, or you will get lost.` (跟着地图走，否则你会迷路的。)\n\n3.  **`lose` (v.)**: 作为一个及物动词，意为“丢失；输掉”，其过去式和过去分词都是 `lost`。它表达的是一个主动的动作。\n    *   *例句*: `He lost the game.` (他输了比赛。) `She lost her hope.` (她失去了希望。)\n\n4.  **总结**：`I lost.` 意为“我输了”或“我丢了（东西）”，是一个动作。`I was lost.` 意为“我迷路了”，是一种状态。根据题干“我不知道我在哪里”的语境，应选择描述“迷路”状态的 `was lost`。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"看到句子中的 `so`，我们知道前后是因果关系。后半句 `I didn't know where I was` 是什么时态？","hint":"注意动词 `did` 和 `was`。","takeaway":"后半句是过去时，描述了过去发生的事情。"},{"question":"既然结果是发生在过去，那么导致这个结果的原因（前半句）应该是什么时态？","hint":"原因和结果通常发生在同一时间段。","takeaway":"前半句也应该是过去时态，因此可以排除现在时选项 C 和 D。"}]},{"title":"词义辨析 (lost vs. was lost)","steps":[{"question":"剩下 A (`lost`) 和 B (`was lost`)。`I lost` 是什么意思？能造个句子吗？","hint":"`lost` 是 `lose` 的过去式，`lose` 的意思是“丢失”或“输掉”。","takeaway":"`I lost` 意思是“我输了”或“我丢了（某个东西）”，它是一个动作。"},{"question":"`I was lost` 又是什么意思？这里的 `lost` 是动词还是其他词性？","hint":"`be + 过去分词` 可以构成被动语态，也可以表示一种状态。","takeaway":"`I was lost` 表示“我迷路了”，描述的是一种状态，这里的 `lost` 相当于形容词。"}]},{"title":"逻辑推理","steps":[{"question":"句子的后半部分“我不知道我在哪里”描述的是一种什么样的情景？","hint":"一个人不知道自己的位置。","takeaway":"这正是“迷路”的定义。"},{"question":"那么，前半句的空缺处应该填入一个表示“迷路”的词组，还是表示“输掉比赛”或“丢失物品”的词？","hint":"哪个选项的含义与“不知道自己在哪里”的逻辑关系最紧密？","takeaway":"只有“我迷路了”(`I was lost`)才能直接导致“我不知道我在哪里”这个结果。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"Miss Smith isn't in the office. She _____ to the classroom.","options":{"A":"has gone","B":"went","C":"will go","D":"goes"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查现在完成时。第一句话 `Miss Smith isn't in the office.` (史密斯小姐现在不在办公室) 描述了目前的状态。第二句话解释了造成这个现状的原因。这个“去教室”的动作发生在过去，但其结果（人不在办公室）持续到了现在。现在完成时正是用来表示过去发生的、但对现在有影响的动作。`has gone to` 意为“已经去了某地（人已不在说话地）”，正好符合句意“她已经去教室了，所以现在不在办公室”。`went` 是一般过去时，只表示过去做了某事，与现在的关联性不强。`will go` 是将来时，`goes` 是一般现在时，均不符合语境。","knowledge_expansion_md":"### `have/has gone to` vs. `have/has been to`\n\n这两个现在完成时的结构是初中英语的重点和易错点，它们都与“去”有关，但含义截然不同。\n\n1.  **`have/has gone to...`**: 意为“去了某地”，强调**人已经离开，目前不在说话地**，可能在目的地或在路上。它强调的是动作的结果——“人不在这里了”。\n    *   *例句*: `My father has gone to Beijing.` (我爸爸去北京了。言下之意是他现在不在家。)\n    *   *注意*: 因为主语已经不在原地，所以 `have gone to` 的主语通常不能是第一人称 (`I`, `we`) 或第二人称 (`you`)，除非是在转述或特殊语境中。\n\n2.  **`have/has been to...`**: 意为“去过某地”，强调**曾经有过去某地的经历，现在已经回来了**。它强调的是经历。\n    *   *例句*: `I have been to the Great Wall twice.` (我去过长城两次。言下之意是我现在在这里，并且有这样的经历。)\n\n**本题情境分析**：`Miss Smith isn't in the office.` (她现在不在办公室)，这正是 `has gone to` 所强调的“人不在此地”的结果。所以用 `She has gone to the classroom.` (她去教室了) 来解释是最恰当的。","socratic_tracks":[{"title":"关注现在，连接过去","steps":[{"question":"题干的第一句话 `Miss Smith isn't in the office` 描述的是什么时候的情况？","hint":"注意动词 `is`。","takeaway":"它描述的是“现在”的情况。"},{"question":"第二句话是来解释为什么“现在”会这样。那么，我们要填入的动作，和“现在”有没有关系？","hint":"“她去教室”这个动作，导致了“她现在不在办公室”这个结果。","takeaway":"这个动作虽然发生在过去，但它的结果影响到了现在，这是使用现在完成时的典型标志。"}]},{"title":"辨析 `gone to` 与 `been to`","steps":[{"question":"我们学过 `have gone to` 和 `have been to`，它们有什么区别？","hint":"一个表示人去了还没回来，一个表示去过已经回来了。","takeaway":"`have gone to` 意味着人不在说话地，而 `have been to` 意味着人已经回来了。"},{"question":"根据题意“她现在不在办公室”，应该用哪个？","hint":"人不在，说明她去了教室还没回来。","takeaway":"所以应该用 `has gone to` 来表达“人已去，不在此地”的含义。"}]},{"title":"排除法","steps":[{"question":"为什么不能用一般过去时 `went` (B)？","hint":"一般过去时只表示动作发生在过去，和现在有必然联系吗？","takeaway":"一般过去时只陈述过去的事实，而现在完成时强调过去对现在的影响，后者更贴合本题的语境。"},{"question":"为什么不能用将来时 `will go` (C) 和一般现在时 `goes` (D)？","hint":"`will go` 表示将要去，但她现在已经不在了。`goes` 表示习惯性动作，比如“她每天都去教室”，这和当前情况不符。","takeaway":"只有现在完成时 `has gone` 能准确连接“过去的动作”和“现在的结果”。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"The students have cleaned the classroom, _____?","options":{"A":"do they","B":"don't they","C":"have they","D":"haven't they"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查反义疑问句的构成。反义疑问句的基本原则是“前肯后否，前否后肯”。陈述部分 `The students have cleaned the classroom` 是一个肯定句，所以附加的疑问部分应为否定形式，由此可以排除 A (`do they`) 和 C (`have they`)。附加疑问部分的主语和助动词/情态动词应与陈述部分保持一致。陈述部分的主语是 `The students`，其对应的人称代词是 `they`。陈述部分的助动词是 `have` (来自现在完成时 `have cleaned`)，所以附加疑问部分也应用助动词 `have`。结合“前肯后否”的原则，附加疑问部分应为 `have` 的否定形式 `haven't` 加上主语代词 `they`。因此，正确的反义疑问句是 `haven't they?`。","knowledge_expansion_md":"### 反义疑问句核心规则与特殊情况\n\n反义疑问句（Tag Question）是附加在陈述句之后，对陈述句所叙述的事实提出疑问的简短问句。\n\n**基本构成口诀**：前肯后否，前否后肯；动词一致，主语用代。\n\n1.  **动词一致**：\n    *   陈述句有**be动词、助动词或情态动词**时，附加问句直接使用这些词。例：`He is a doctor, isn't he?` / `She can swim, can't she?`\n    *   陈述句是**实义动词**时，附加问句根据时态和人称使用 `do/does/did`。例：`You like English, don't you?` / `He went home, didn't he?`\n    *   本题中 `have cleaned` 的 `have` 是助动词，所以附加问句用 `have`。\n\n2.  **特殊情况**：\n    *   当陈述部分含有 `never`, `seldom`, `hardly`, `few`, `little`, `no`, `nothing` 等**否定或半否定词**时，被视为否定句，附加问句用肯定形式。例：`He seldom comes late, does he?`\n    *   **祈使句**的反义疑问句通常用 `will you?` 或 `won't you?`。例：`Open the door, will you?`\n    *   以 **`Let's`** 开头的祈使句，附加问句用 `shall we?`。例：`Let's go, shall we?`\n    *   以 **`Let us/me`** 开头的祈使句，附加问句用 `will you?`。例：`Let us go, will you?`\n    *   当陈述句主语是 `I`，谓语是 `am` 时，附加问句用 `aren't I?`。例：`I am right, aren't I?`","socratic_tracks":[{"title":"反义疑问句基本规则","steps":[{"question":"这是一个什么类型的问句？它由哪两部分组成？","hint":"句子后面有一个小尾巴一样的问句。","takeaway":"这是反义疑问句，由“陈述句 + 附加疑问”构成。"},{"question":"对于这种句型，陈述句和附加疑问的肯定/否定形式之间有什么关系？","hint":"想想中文里的“他很高，不是吗？”","takeaway":"它们遵循“前肯后否，前否后肯”的原则。"},{"question":"题干中的陈述句是肯定的还是否定的？那么附加疑问应该是肯定的还是否定的？","hint":"`have cleaned` 是肯定形式。","takeaway":"陈述句是肯定的，所以附加疑问必须是否定的，排除 A 和 C。"}]},{"title":"动词形式匹配","steps":[{"question":"附加疑问句中的动词是怎么确定的？是随便选一个吗？","hint":"观察陈述句中有什么特殊的动词，比如 `is`, `are`, `can`, `will`, `have` 等。","takeaway":"附加疑问句的动词必须与陈述句中的助动词、情态动词或be动词一致。"},{"question":"在 `The students have cleaned the classroom` 这句话里，`have` 是什么词？是实义动词“有”吗？","hint":"它和 `cleaned` 一起构成了 `have cleaned`，这是什么时态？","takeaway":"这里的 `have` 是构成现在完成时的助动词，因此附加疑问句也必须用 `have`。"}]},{"title":"主语代词转换","steps":[{"question":"附加疑问句的主语是怎么确定的？","hint":"看看陈述句的主语是什么。","takeaway":"附加疑问句的主语必须是与陈述句主语相对应的人称代词。"},{"question":"陈述句的主语是 `The students`，它应该用哪个人称代词来替换？","hint":"`The students` 是复数名词，指“学生们”。","takeaway":"应该用复数代词 `they`。"},{"question":"好了，现在我们确定了附加疑问是否定、动词用 `have`、主语用 `they`，把它们组合起来是什么？","hint":"否定形式是 `have not`，缩写是 `haven't`。","takeaway":"组合起来就是 `haven't they?`。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"We _____ each other since 2002.","options":{"A":"know","B":"had known","C":"have known","D":"knew"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查现在完成时。句中的时间状语 “since 2002”（从2002年起）是现在完成时的典型标志，表示一个从过去某时间点开始，一直持续到现在的动作或状态。因此，谓语动词需要使用现在完成时 “have/has + 过去分词” 的形式。主语是 “We”，所以助动词用 “have”，动词 “know” 的过去分词是 “known”。故正确答案为 C。","knowledge_expansion_md":"### 现在完成时 (Present Perfect Tense)\n\n现在完成时用来表示过去发生的、但与现在有联系的动作。其基本结构为 `have/has + 动词的过去分词`。\n\n**常见用法及标志词:**\n1.  表示一个从过去开始持续到现在的动作或状态，常与 `for + 时间段` 或 `since + 时间点` 连用。\n    *   `He has lived here for ten years.` (他在这里住了十年了。)\n    *   `I have known her since she was a child.` (我从小就认识她。)\n2.  表示一个在过去发生、但对现在有影响或结果的动作，常与 `already`, `yet`, `just` 连用。\n    *   `I have just finished my homework.` (我刚做完作业，结果是现在可以玩了。)\n3.  表示在过去不确定的时间里发生的经历，常与 `ever`, `never`, `before` 连用。\n    *   `Have you ever been to Beijing?` (你以前去过北京吗？)\n\n**易错点:**\n*   **现在完成时 vs. 一般过去时**: 一般过去时只表示动作在过去某个特定时间发生并结束，与现在无关；而现在完成时则强调与现在的联系。例如：`I saw the movie yesterday.` (昨天看的，事情已结束) vs. `I have seen the movie.` (我看过这电影了，强调“看过”这个经历)。\n*   **延续性动词 vs. 非延续性动词**: `since/for` 引导的现在完成时句子中，通常使用延续性动词（如 `know`, `live`, `study`）。非延续性动词（如 `buy`, `borrow`, `arrive`）不能直接与 `for/since` 连用，需要转换形式，例如 `He has had this book for two weeks.` (不能说 `He has bought this book for two weeks.`)。","socratic_tracks":[{"title":"时态标志词","steps":[{"question":"句子中哪个词或短语是判断时态的关键？","hint":"看看句末表示时间的那个部分，它告诉我们动作从何时开始。","takeaway":"“since 2002”是解题的关键时间状语。"},{"question":"“since + 过去时间点”这个结构通常和什么时态连用？为什么？","hint":"想一想，这个动作是从过去开始，一直持续到现在吗？哪种时态可以表达这个意思？","takeaway":"“since”引导的时间状语表示动作从过去持续至今，是现在完成时的典型标志。"}]},{"title":"动词状态","steps":[{"question":"“know”（认识）这个动词是表示一个瞬间的动作，还是一个可以持续的状态？","hint":"你能说“我正在认识他” (I am knowing him) 吗？通常我们不会这么说。","takeaway":"“know”是一个状态动词，表示一种可以持续的认识状态。"},{"question":"对于从过去开始并持续到现在的状态，我们应该用什么时态来描述？","hint":"这种时态需要能够连接过去和现在，强调动作或状态的延续性。","takeaway":"描述从过去持续到现在的状态或动作，需要使用现在完成时。"}]},{"title":"选项辨析","steps":[{"question":"为什么不能选 D (knew)？“knew”是什么时态？它表示什么？","hint":"“I knew him in 2002”和“I have known him since 2002”有什么区别？","takeaway":"一般过去时 (knew) 表示动作在过去发生并结束，与现在无关，而题干强调的是持续到现在的状态。"},{"question":"为什么不能选 B (had known)？过去完成时用在什么情况下？","hint":"过去完成时需要有一个过去的参照时间点，表示“过去的过去”。这个句子里有吗？","takeaway":"过去完成时 (had known) 用于描述在另一个过去动作之前发生的动作，本句没有这个语境。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Hello, may I speak to Kate?\n—Sorry, she isn't here now. She _____ to Shanghai.","options":{"A":"went","B":"has been","C":"has gone","D":"goes"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查现在完成时中 `have been to` 和 `have gone to` 的区别。根据对话的后半句 “Sorry, she isn't here now.”（对不起，她现在不在这里），我们可以判断出凯特（Kate）去了上海，并且人还没有回来。`has gone to` 意为“去了某地（但人未归）”，强调的是离开的动作及其导致人不在场的结果。而 `has been to` 意为“去过某地（人已返回）”，强调的是经历。因此，`has gone to` 符合本题语境。","knowledge_expansion_md":"### `have gone to`, `have been to`, `have been in` 的辨析\n\n这三个短语都与现在完成时有关，但含义和用法有明显区别，是小升初和初中阶段的重要考点。\n\n1.  **`have/has gone to...`**: 意为“去了某地”，表示主语已经去了目的地，但**人还没有回来**，目前仍在目的地或在路上。因此，主语通常不能是第一人称（I, we）或第二人称（you），因为说话人不可能在别处的同时又在这里说话。\n    *   例: `My father has gone to Beijing. He will be back next week.` (我爸爸去北京了，他下周回来。)\n\n2.  **`have/has been to...`**: 意为“去过某地”，表示主语曾经去过某个地方，但**现在已经回来了**。它强调的是一种“经历”。主语可以是任何人称。\n    *   例: `I have been to the Great Wall twice.` (我到过长城两次了。)\n\n3.  **`have/has been in...`**: 意为“在某地待了多久”，表示主语在某个地方**停留了一段时间**，并且**目前可能还在那里**。它强调的是“停留”的状态和时长，通常与 `for` 或 `since` 引导的时间状语连用。\n    *   例: `She has been in Shanghai for three days.` (她已经在上海待了三天了。)\n\n**总结:**\n*   `gone to` → 人去了，未回\n*   `been to` → 人去过，已回\n*   `been in` → 人在某地，待了一段时间","socratic_tracks":[{"title":"语境线索","steps":[{"question":"对话中哪句话为我们选择答案提供了最重要的线索？","hint":"看看回答者说的第二句话，它描述了 Kate 现在的状态。","takeaway":"关键线索是 “she isn't here now”（她现在不在这儿）。"},{"question":"“她现在不在这儿”这个结果，说明她去上海这个动作是已经结束并回来了，还是去了没回来？","hint":"如果她回来了，她现在应该会在这里。","takeaway":"这个线索表明她去了上海但人还没回来。"}]},{"title":"关键短语辨析","steps":[{"question":"“has been to”和“has gone to”这两个短语在意思上有什么核心区别？","hint":"想想看，如果我说 “I have been to Beijing”，我人现在在哪里？如果我说 “He has gone to Beijing”，他人在哪里？","takeaway":"“has been to”强调“去过”的经历（人已回），而“has gone to”强调“去了”的状态（人未回）。"},{"question":"根据上一步的分析，本题中 Kate 的状态是“去过”还是“去了”？","hint":"别忘了，她现在不在这里。","takeaway":"她的状态是“去了”但还没回来，所以应该用“has gone to”。"}]},{"title":"时态功能","steps":[{"question":"为什么这里不用过去式“went”？“She went to Shanghai”这句话本身语法对吗？","hint":"这句话语法上是对的，但为什么在当前对话中不是最佳选项？它和现在有联系吗？","takeaway":"过去式“went”只陈述一个过去发生的动作，不强调与现在的联系。"},{"question":"为什么现在完成时“has gone”更合适？它比过去式多了什么含义？","hint":"想想现在完成时的基本功能——连接过去和现在。","takeaway":"现在完成时强调了过去的动作对现在造成的结果或影响（即“人不在这里”）。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"He has never visited Shenzhen, _____?","options":{"A":"has he","B":"hasn't he","C":"does he","D":"doesn't he"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查反义疑问句的用法。反义疑问句的基本构成原则是“前肯后否，前否后肯”。主句 “He has never visited Shenzhen” 中含有否定词 “never”，因此陈述部分是否定的。根据“前否后肯”的原则，附加疑问部分应该用肯定形式。陈述句的助动词是 “has”（来自现在完成时 `has visited`），所以附加问句也应使用助动词 “has”。主语是 “He”，附加问句的主语应用相应的人称代词 “he”。综上，正确的附加问句是 “has he”。","knowledge_expansion_md":"### 反义疑问句 (Tag Questions) 结构详解\n\n反义疑问句由一个陈述句和一个简短的附加问句组成，附加问句与陈述句的主语和谓语动词相关，但肯定/否定形式相反。\n\n**基本规则:**\n1.  **前肯后否**: 陈述句是肯定句，附加问句是否定形式。\n    *   `You are a student, aren't you?`\n2.  **前否后肯**: 陈述句是否定句，附加问句是肯定形式。\n    *   `He can't swim, can he?`\n\n**特殊情况与易错点:**\n*   **含有半否定词的句子**: 当陈述句中含有 `never`, `seldom`, `hardly`, `rarely`, `few`, `little` 等具有否定意义的词时，该陈述句被视为否定句，附加问句需用肯定形式。本题中的 `never` 就属于这种情况。\n    *   `She seldom comes late, does she?`\n*   **祈使句**: 肯定的祈使句后通常用 `will you?` 或 `won't you?`。以 `Let's` 开头的祈使句后用 `shall we?`；以 `Let us` 开头的祈使句后用 `will you?`。\n    *   `Open the window, will you?`\n    *   `Let's go home, shall we?`\n*   **`I am...` 的句型**: 附加问句用 `aren't I?`。\n    *   `I am right, aren't I?`\n*   **主语为 `this/that`, `these/those`**: 附加问句的主语分别用 `it` 和 `they`。\n    *   `This is your pen, isn't it?`\n*   **主语为不定代词**: 如 `somebody`, `everyone`, `nobody` 等，附加问句的主语通常用 `they`。\n    *   `Everyone is here, aren't they?`","socratic_tracks":[{"title":"肯定与否定","steps":[{"question":"看到 “He has never visited Shenzhen” 这句话，你觉得它是肯定的还是否定的？为什么？","hint":"句子里有没有像 `not`, `no`, `never`, `hardly` 这样的词？","takeaway":"因为句中有否定词 “never”，所以这是一个否定句。"},{"question":"对于反义疑问句，如果前面的陈述句是否定的，后面的简短问句应该是肯定的还是否定的？","hint":"回忆一下反义疑问句的基本规则：“前肯后否，前...后...”。","takeaway":"反义疑问句遵循“前否后肯”的原则。"}]},{"title":"助动词匹配","steps":[{"question":"陈述句 “He has never visited Shenzhen” 中，谓语动词是什么？它由哪几部分组成？","hint":"动词短语是 “has visited”，这是一个完整的谓语。","takeaway":"谓语是现在完成时 “has visited”，由助动词 “has” 和过去分词 “visited” 构成。"},{"question":"在构成反义疑问句时，我们应该选择哪个词来放在后面的问句里？是 `has` 还是 `does`？","hint":"附加问句的助动词或情态动词要与陈述句保持一致。陈述句里有 `has` 吗？有 `does` 吗？","takeaway":"附加问句要使用陈述句中出现的第一个助动词或情态动词，这里是 “has”。"}]},{"title":"主语一致","steps":[{"question":"陈述句的主语是谁？","hint":"通常在句子的开头。","takeaway":"陈述句的主语是 “He”。"},{"question":"那么，反义疑问句的附加问句部分，主语应该用什么？","hint":"附加问句的主语必须是与陈述句主语相对应的人称代词。","takeaway":"附加问句的主语必须用代词形式，所以这里用 “he”。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"He is a funny boy. He often makes us _____.","options":{"A":"laugh","B":"to laugh","C":"laughing","D":"to laughing"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查使役动词 `make` 的用法。`make` 在这里是使役动词，意为“使，让”。其固定句型是 `make somebody do something`，意为“使某人做某事”。在这个结构中，宾语 `somebody` 之后必须跟不带 `to` 的动词不定式，也就是动词原形。题中 `us` 是宾语，因此其后应跟动词原形 `laugh`。所以正确答案是 A。","knowledge_expansion_md":"### 使役动词和感官动词的用法\n\n在英语中，一些特殊的动词后面跟宾语补足语时，需要使用动词原形（即不带 `to` 的不定式）。这类动词主要是使役动词和感官动词。\n\n**1. 使役动词 (Causative Verbs)**\n这类动词表示“使”、“让”、“叫”某人做某事。\n*   **`make sb. do sth.`** (使/迫使某人做某事，带有强制意味)\n    *   `The teacher made the students stand up.`\n*   **`let sb. do sth.`** (允许/让某人做某事)\n    *   `Please let me know your decision.`\n*   **`have sb. do sth.`** (叫/请/使某人做某事，语气比 `make` 弱)\n    *   `I'll have my assistant call you.`\n\n**注意:** 当这些结构用于被动语态时，`to` 必须被还原。例如：`He was made to clean the room.`\n\n**2. 感官动词 (Verbs of Perception)**\n这类动词表示通过感官感知到的动作。\n*   **`see/hear/watch/notice/feel sb. do sth.`** (表示看到/听到...某人做了某事，强调动作的全过程)\n    *   `I saw him cross the street.` (我看见他穿过了马路)\n*   **`see/hear/watch/notice/feel sb. doing sth.`** (表示看到/听到...某人正在做某事，强调动作正在进行)\n    *   `I heard someone singing in the next room.` (我听到隔壁有人在唱歌)\n\n**3. 特殊动词 `help`**\n`help` 的用法比较灵活，其后的动词原形可以带 `to` 也可以不带 `to`。\n*   **`help sb. (to) do sth.`**\n    *   `Can you help me (to) carry this box?`","socratic_tracks":[{"title":"关键动词用法","steps":[{"question":"这个句子中，哪个动词决定了后面 “laugh” 的形式？","hint":"看看 “us” 前面的那个动词。","takeaway":"关键动词是 “makes”，它的用法决定了后面动词的形式。"},{"question":"动词 “make” 在这里是什么意思？它有什么特殊的语法规则吗？","hint":"想一想 “make” 作为“使、让”的意思时，后面跟的动词是什么形式。比如“妈妈让我打扫房间”。","takeaway":"“make”是使役动词，其后要跟宾语和动词原形，构成“make sb. do sth.”结构。"}]},{"title":"句子结构分析","steps":[{"question":"在 “He often makes us _____” 这个句子中，“us” 是什么成分？","hint":"“us” 是动作 “makes” 的承受者。","takeaway":"“us” 是宾语。"},{"question":"空格处需要填的词是用来补充说明宾语 “us” 做的动作，这个成分叫什么？","hint":"补充说明宾语的成分叫宾语补足语。","takeaway":"空格处需要填一个宾语补足语来补充说明宾语 “us” 的动作。"},{"question":"在 “make + 宾语 + 宾补” 这个结构中，当宾补是动词时，应该用什么形式？","hint":"回忆一下 “make sb. do sth.” 这个经典句型。","takeaway":"当使役动词 “make” 后跟动词作宾补时，该动词必须使用原形。"}]},{"title":"动词形式辨析","steps":[{"question":"为什么不能选 B “to laugh”？在什么情况下动词前会加 “to”？","hint":"比如 “I want to laugh.” 这里的 “want” 后面就加了 “to”。","takeaway":"动词不定式通常带 “to”，但某些特殊动词（如 make, let, see）后要省略 “to”。"},{"question":"为什么不能选 C “laughing”？“laughing” 是什么形式？在什么情况下会用它？","hint":"比如 “I see him laughing.” (我看见他正在笑)。感官动词后可以用现在分词。","takeaway":"“laughing”是现在分词，常用于表示动作正在进行，但使役动词 “make” 后面不接现在分词作宾补。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"If I find your dog, I _____ you a call.","options":{"A":"give","B":"gave","C":"giving","D":"will give"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查if引导的条件状语从句。这是一个典型的“主将从现”句型，即主句使用一般将来时，而if引导的从句使用一般现在时来表示将来可能发生的条件。句中从句部分“If I find your dog”的动词“find”是一般现在时，因此主句应该使用一般将来时。选项D“will give”正是一般将来时的结构（will + 动词原形），符合语法规则。故选D。","knowledge_expansion_md":"### If条件状语从句（第一类真实条件句）\n\n1.  **基本结构**：`If + 一般现在时, ... will + 动词原形.`\n    这个结构用来谈论在未来极有可能发生的、真实的条件及其可能产生的结果。我们称之为“主将从现”，即主句用一般将来时，if从句用一般现在时。\n\n2.  **常见错误**：学生最容易犯的错误是在if从句中也使用了将来时，例如：*If I will find your dog...* 这是错误的。在表示将来条件的if从句中，必须用现在时态代替将来时态。\n\n3.  **语序变化**：主句和从句的位置可以互换，但标点符号会变化。\n    -   `If I find your dog, I will give you a call.` (从句在前，用逗号隔开)\n    -   `I will give you a call if I find your dog.` (主句在前，无需逗号)\n\n4.  **主句情态动词**：主句中除了`will`，还可以使用其他情态动词如`can`, `may`, `should`等来表达不同的语气。\n    -   `If you finish your homework, you can watch TV.` (你可以看电视)","socratic_tracks":[{"title":"识别句型结构","steps":[{"question":"这个句子是不是一个简单句？如果不是，它由哪几部分构成？","hint":"注意句首的 'If'，它在英语中通常用来引导什么？","takeaway":"这是一个由 'If' 引导的条件状语从句和主句构成的复合句。"},{"question":"在 'If' 引导的条件句中，从句和主句的时态通常遵循什么规则？","hint":"回想一下我们常说的“主将从现”这个口诀。","takeaway":"在表示将来可能发生的真实条件句中，if从句用一般现在时，主句用一般将来时。"}]},{"title":"分析句子时态","steps":[{"question":"我们先看从句 'If I find your dog'，这里的动词 'find' 是什么时态？","hint":"主语是 'I'，动词用了原形 'find'，这表示一个现在或将来的动作/状态。","takeaway":"从句 'If I find your dog' 使用的是一般现在时。"},{"question":"既然从句是一般现在时，根据“主将从现”的规则，主句应该用什么时态？","hint":"“主将从现”中的“将”字代表什么时态？","takeaway":"主句应该使用一般将来时，其结构是 'will + 动词原形'。"}]},{"title":"辨析选项","steps":[{"question":"选项A 'give' 和B 'gave' 分别是什么时态？为什么它们不适合放在主句中？","hint":"'give' 是一般现在时，'gave' 是一般过去时。这个句子讨论的是未来的可能性。","takeaway":"主句需要表达将来的动作，一般现在时和一般过去时都不符合要求。"},{"question":"选项C 'giving' 是动词的什么形式？它能单独作谓语吗？","hint":"'giving' 是现在分词，它前面需要有be动词才能构成进行时态。","takeaway":"现在分词不能单独作谓语，因此C是错误的。"},{"question":"那么D选项 'will give' 为什么是正确答案？","hint":"观察 'will give' 的构成，它是什么时态？是否符合我们之前分析的规则？","takeaway":"'will give' 是一般将来时，完全符合“主将从现”的语法规则。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"Mr Brown will come to the party if he _____ too busy tomorrow.","options":{"A":"is","B":"isn't","C":"will be","D":"won't be"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在if条件状语从句中的时态和逻辑判断。首先，这是一个“主将从现”的句型：主句 'Mr Brown will come to the party' 使用了一般将来时，因此if引导的从句需要用一般现在时来表示将来的情况。据此可排除C选项 'will be' 和D选项 'won't be'。剩下A 'is' 和B 'isn't'。根据生活逻辑，“如果他不忙，他就会来参加聚会”，所以从句需要表达否定的含义。主语 'he' 是第三人称单数，be动词的现在时否定形式是 'isn't'。因此，正确答案是B。","knowledge_expansion_md":"### 条件状语从句中的时态与逻辑\n\n1.  **“主将从现”的拓展**：这个规则不仅适用于 `if`，也适用于其他引导时间或条件状语从句的词，当主句是将来时或祈使句时，从句通常用一般现在时。这些词包括：`when`, `while`, `as soon as`, `until`, `unless`, `before`, `after` 等。\n    -   `He will call you as soon as he arrives.` (他一到就给你打电话。)\n\n2.  **肯定与否定的逻辑判断**：在选择题中，语法正确的选项可能不止一个，这时就需要根据上下文的逻辑关系来做出最终选择。学生需要完整阅读句子，理解主句和从句之间的因果、条件或转折关系。\n\n3.  **`unless` 的使用**：`unless` 意为 “if... not”（除非；如果不）。本题可以用 `unless` 进行改写，意思保持不变：\n    -   `Mr Brown will come to the party unless he is too busy tomorrow.` (除非布朗先生明天太忙，否则他会来参加聚会。)","socratic_tracks":[{"title":"分析句子时态规则","steps":[{"question":"这个句子中，主句 'Mr Brown will come to the party' 是什么时态？","hint":"句中有 'will come'，'will' 是将来时的标志。","takeaway":"主句是一般将来时。"},{"question":"当主句是一般将来时，'if' 引导的从句应该使用什么时态？","hint":"回忆一下“主将从现”的口诀。","takeaway":"if从句应该使用一般现在时。"},{"question":"根据这个时态规则，我们可以排除哪些选项？","hint":"哪些选项不是一般现在时？","takeaway":"C 'will be' 和 D 'won't be' 都是将来时，应该被排除。"}]},{"title":"理解句子逻辑关系","steps":[{"question":"现在只剩下 A 'is' 和 B 'isn't'。从意思上看，布朗先生“会来参加聚会”的条件应该是什么？","hint":"一个人是“忙”的时候容易赴约，还是“不忙”的时候？","takeaway":"从逻辑上讲，他“不忙”才是他能来参加聚会的条件。"},{"question":"那么，为了表达“不忙”这个意思，我们应该选择肯定形式 'is' 还是否定形式 'isn't'？","hint":"“不忙”在英语中是 'is not busy'。","takeaway":"应该选择否定形式 'isn't' 来使句子逻辑通顺。"}]},{"title":"主谓一致检查","steps":[{"question":"在确定了要用一般现在时的否定形式后，我们还需要检查什么语法点？","hint":"看看从句的主语 'he'，它对后面的动词有什么要求？","takeaway":"我们需要检查主谓一致，即动词形式要和主语的人称、单复数相匹配。"},{"question":"主语 'he' 是第几人称单数？be动词在一般现在时中应该用哪种形式？其否定形式是什么？","hint":"I am, you are, he/she/it is.","takeaway":"主语 'he' 是第三人称单数，be动词用 'is'，其否定形式是 'is not' 或缩写 'isn't'，选项B完全正确。"}]}]}}]},{"section_title":"II. 完形填空","section_instruction":"（共20分）\nMr King is a very old man. He likes eating dumplings very much. Every Sunday, he goes to a Chinese __1__ and eats dumplings __2__ dinner. Ann is a waitress. She __3__ in the restaurant. Ann often __4__ with Mr King, so they become very good friends. Every time after Mr King __5__ for his dinner, he puts some money on the table. The __6__ is for Ann. It's her tip(小费). One day, Mr King __7__ Ann, \"Do you want a tip or half my lottery (彩票)? prize?\" Ann thinks that __8__ is telling a joke (玩笑). __9__ she laughs and says, \"Half of your prize.\"\nThe next day, Mr King wins the lottery and gets six million dollars. Then he goes to the restaurant and gives Ann the tip — __10__ of his lottery prize!","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"","options":{"A":"office","B":"library","C":"restaurant","D":"school"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查名词词义辨析。根据上文语境 'he goes to a Chinese __1__ and eats dumplings'（他去一家中国的___吃饺子），可知Mr. King要去一个能吃饭的地方。选项A 'office'（办公室）、B 'library'（图书馆）、D 'school'（学校）均不符合语境。只有C 'restaurant'（餐馆）是吃饭的地方。因此，正确答案是C。","knowledge_expansion_md":"### 场景词汇与上下文推断\n\n1.  **常见场所词汇及其功能**：掌握与日常生活相关的场所词汇是完形填空的基础。\n    -   `restaurant` / `diner` / `cafe`: 吃饭、喝东西的地方。\n    -   `library`: 借书、读书、学习的地方。\n    -   `office`: 工作、办公的地方。\n    -   `school` / `classroom`: 学习、上课的地方。\n    -   `hospital`: 看病的地方。\n    -   `supermarket`: 购物的地方。\n\n2.  **利用上下文线索**：做完形填空题时，切忌孤立地看一个空。要通过阅读空格前后甚至整个段落来寻找线索（clues）。这些线索可能是某个动词、形容词，也可能是描述某个活动的短语。\n\n3.  **词义辨析**：有时选项词汇属于同一类别，需要精确辨析。\n    -   `restaurant`: 泛指餐馆、饭店。\n    -   `canteen / cafeteria`: （学校、工厂、医院等的）食堂，价格通常更便宜。\n    -   `snack bar`: 小吃店。","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"在空格前面，有什么词或短语可以告诉我们主人公当时的状态或需求吗？","hint":"注意描述感觉的形容词。","takeaway":"句子提到了 'I was very hungry'（我非常饿），这表明他有进食的需求。"},{"question":"在空格后面，有什么词或短语说明了他要去这个地方做什么吗？","hint":"注意 'to do sth.' 这种表示目的的结构。","takeaway":"句子提到了 'to have lunch'（去吃午饭），这直接说明了目的。"},{"question":"综合“饥饿”和“吃午饭”这两个线索，我们可以推断出空格处应该填一个什么类型的场所？","hint":"人们通常去哪里解决饥饿和吃午饭的问题？","takeaway":"空格处应该是一个提供食物和用餐服务的地方。"}]},{"title":"分析选项功能","steps":[{"question":"我们来分析一下四个选项。'office'（办公室）是做什么的地方？","hint":"人们在办公室里主要是工作。","takeaway":"办公室是工作的地方，不是专门吃饭的场所。"},{"question":"'library'（图书馆）呢？它的主要功能是什么？","hint":"图书馆里有很多书，而且需要保持安静。","takeaway":"图书馆是阅读和学习的地方，通常禁止饮食。"},{"question":"'restaurant'（餐馆）和 'school'（学校）的功能又是什么？","hint":"一个是商业场所，一个是教育机构。","takeaway":"餐馆是专门提供餐饮服务的地方，而学校是学习的地方。"}]},{"title":"匹配与排除","steps":[{"question":"将我们推断出的“吃饭的地方”这个功能与四个选项的功能进行匹配，哪个最合适？","hint":"哪个选项的主要功能就是吃饭？","takeaway":"只有 'restaurant'（餐馆）的功能与“吃午饭”完全匹配。"},{"question":"为什么不能选 'school'？我们也会在学校吃午饭呀。","hint":"想一想，'school' 指的是整个学校，还是特指吃饭的地方？如果要去学校吃饭，通常会去哪里？","takeaway":"虽然可以在学校吃饭，但吃饭的特定地点是食堂（canteen），而 'restaurant' 更准确地描述了“去一个地方吃午饭”这个商业行为，更符合语境。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"","options":{"A":"at","B":"for","C":"with","D":"in"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查介词的用法。根据句意 'eats dumplings __2__ dinner'（吃饺子作为晚餐），介词 'for' 在此表示目的或用途，意为“作为，当作”。'for dinner' 意为“作为晚餐”。选项A 'at' 通常表示时间点或地点；选项C 'with' 表示“和...一起”；选项D 'in' 表示“在...里面”。因此，正确答案是B。","knowledge_expansion_md":"### 形容词与介词的固定搭配\n\n很多形容词需要和特定的介词搭配使用，构成固定的短语，这是英语学习中需要重点记忆的部分。\n\n1.  **与 `at` 搭配**：常表示在某方面的能力或表现。\n    -   `be good at...` (擅长...)\n    -   `be bad at...` (不擅长...)\n    -   `be clever at...` (在...方面聪明)\n    -   `be surprised at...` (对...感到惊讶)\n\n2.  **与 `for` 搭配**：常表示原因、目的或益处。\n    -   `be famous for...` (因...而著名)\n    -   `be ready for...` (为...做好准备)\n    -   `be good for...` (对...有益)\n    -   `be sorry for...` (为...感到抱歉)\n\n3.  **与 `with` 搭配**：常表示伴随、关系或对待方式。\n    -   `be angry with sb.` (生某人的气)\n    -   `be pleased with...` (对...感到满意)\n    -   `be popular with...` (受...欢迎)\n    -   `be good with...` (善于和...相处/善于使用...)\n\n4.  **与 `in` 搭配**：常表示在某领域或方面。\n    -   `be interested in...` (对...感兴趣)\n    -   `be weak in...` (在...方面薄弱)","socratic_tracks":[{"title":"识别固定搭配","steps":[{"question":"观察空格前后的词 'good' 和 'playing'。你认为这里可能在考查什么知识点？","hint":"当一个形容词后面要跟一个动作时，它们之间常常通过一个固定的介词连接。","takeaway":"这里很可能在考查 'good' 与某个介词构成的固定搭配。"},{"question":"在英语中，我们想表达“擅长做某事”时，会用 'be good' 加上哪个介词？","hint":"这是一个非常基础和常用的短语，比如“我擅长数学” I'm good ___ math.","takeaway":"表达“擅长”的固定搭配是 'be good at'。"}]},{"title":"辨析易混短语","steps":[{"question":"选项B是 'for'。'be good for' 是什么意思？用在这里合适吗？","hint":"想一想 'Eating vegetables is good for your health.' 这句话的意思。","takeaway":"'be good for' 意为“对...有益”，与本句“哥哥擅长打篮球”的句意不符。"},{"question":"选项C是 'with'。'be good with' 又是什么意思呢？","hint":"比如 'She is good with children.' (她很会带孩子)。","takeaway":"'be good with' 意为“善于与...相处”或“善于使用...”，用在此处也不合适。"},{"question":"选项D是 'in'。我们学过 'be interested in'，那 'be good in' 对吗？","hint":"虽然 'in' 也可以表示“在...方面”，但在表达“擅长”这个意思时，哪个搭配更固定、更常用？","takeaway":"表达“擅长”最地道、最固定的搭配就是 'be good at'，而不是 'be good in'。"}]},{"title":"拓展语法规则","steps":[{"question":"我们确定了要用介词 'at'。那么，为什么 'play' 这个词在这里要用 'playing' 的形式？","hint":"介词是一种特殊的词类，它对跟在它后面的动词有什么要求？","takeaway":"介词后面如果跟动词，必须使用动词的-ing形式，即动名词。"},{"question":"你能否再举一个介词后面跟动词-ing形式的例子？","hint":"比如用 'thank you for...' 或者 'be interested in...' 来造个句。","takeaway":"例如：'Thank you for helping me.' 或 'I am interested in swimming.'，这都遵循了“介词+动名词”的规则。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"","options":{"A":"works","B":"does","C":"finishes","D":"makes"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析。根据上文 'Ann is a waitress'（安是一名女服务员）和下文 'in the restaurant'（在餐馆里），可知本句是描述安的工作地点和状态。动词 'work' 意为“工作”，常用 'work in a place' 结构表示“在某地工作”。因为主语 'She' 是第三人称单数，所以动词用第三人称单数形式 'works'。选项B 'does'（做）、C 'finishes'（完成）、D 'makes'（制作）均不符合句意和搭配。因此，正确答案是A。","knowledge_expansion_md":"### 动词辨析：do, make, work, finish\n\n这组词都与“做”或“工作”有关，但在用法上有明显区别，尤其 `do` 和 `make` 是小升初阶段的重点和易错点。\n\n1.  **do**: 通常指**执行**一个动作、任务或活动，不强调创造出新的东西。\n    *   固定搭配：`do homework`, `do sports`, `do business`, `do a favor`, `do one's best`。\n    *   用于泛指：`What do you do?` (你做什么工作？) `I have nothing to do.` (我无事可做。)\n\n2.  **make**: 通常指**创造**、**制造**出具体或抽象的东西，强调“从无到有”的过程和结果。\n    *   固定搭配：`make a cake`, `make a noise`, `make a mistake`, `make money`, `make a decision`, `make friends`。\n\n3.  **work**: 多用作不及物动词，意为“工作”，指一种持续的状态或职业；也可指“起作用，有效”。\n    *   例句：`He works in a bank.` (他在银行工作。) `The medicine works well.` (这药很有效。)\n\n4.  **finish**: 意为“完成”，强调一个动作或过程的结束。\n    *   例句：`Have you finished your meal?` (你吃完饭了吗？)","socratic_tracks":[{"title":"辨析 do 与 make","steps":[{"question":"我们说“制作一个蛋糕”和“做作业”，这两个“做”在英文里会用同一个词吗？为什么？","hint":"想一想，“制作蛋糕”是不是创造出了一个新东西？而“做作业”是不是在完成一项任务？","takeaway":"`make` 强调创造新事物，而 `do` 强调执行任务或活动。"},{"question":"那么，“犯错误”是 `do a mistake` 还是 `make a mistake` 呢？","hint":"这是一个固定搭配，可以理解为“造成了一个错误的结果”。","takeaway":"固定搭配 `make a mistake` 意为“犯错误”。"}]},{"title":"辨析 work 与 do","steps":[{"question":"当我想问别人“你是做什么工作的？”，我应该用 `work` 还是 `do`？","hint":"这是一个非常常用的日常表达，句型是 `What do you ...?`","takeaway":"询问职业的常用句型是 `What do you do?`。"},{"question":"如果我想说“他在一家医院工作”，应该用哪个词？","hint":"这里是想表达一个长期、稳定的职业状态。","takeaway":"`work` 常用来指明工作地点或职业状态，如 `work in a hospital`。"}]},{"title":"理解 finish 的用法","steps":[{"question":"如果一个动作或任务已经到了结尾，我们最应该用哪个词来表达“完成”？","hint":"比如，你刚刚写完了作业的最后一个字。","takeaway":"`finish` 专门用来表示“完成、结束”。"},{"question":"“完成做某事”应该怎么表达？是 `finish to do sth` 还是 `finish doing sth`？","hint":"这个动词后面需要跟动名词形式。","takeaway":"`finish` 的固定用法是 `finish doing something`。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"","options":{"A":"thinks","B":"tells","C":"says","D":"talks"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查近义动词的用法辨析。根据空格后的介词 'with'，可知此处需要一个能与 'with' 搭配表示“和某人交谈”的动词。'talk with sb.' 是固定搭配，意为“和某人谈话”。因为主语 'Ann' 是第三人称单数，且 'often' 表明是经常性动作，所以动词用第三人称单数形式 'talks'。选项A 'thinks'（认为）、B 'tells'（告诉，及物动词）、C 'says'（说，常接说的内容）均不能与 'with' 直接搭配表示交谈。因此，正确答案是D。","knowledge_expansion_md":"### “说”的四种表达：say, tell, speak, talk\n\n这四个动词是英语初学者极易混淆的，掌握它们的核心用法和区别至关重要。\n\n1.  **say (v. said, said)**: 强调“说的内容”。\n    *   结构：`say something` 或 `say (that) ...`\n    *   例句：`He said, \"Hello.\"` (他说了声“你好”。) `She said that she was tired.` (她说她累了。)\n    *   注意：如果要提到听话人，需用 `say sth. to sb.` 结构。\n\n2.  **tell (v. told, told)**: 强调“告诉某人某事”，有“传达、吩咐”的意味。\n    *   结构：`tell sb. sth.` 或 `tell sb. (that) ...`\n    *   例句：`Please tell me your name.` (请告诉我你的名字。) `He told me that he would be late.` (他告诉我他会迟到。)\n    *   固定搭配：`tell a story` (讲故事), `tell a joke` (讲笑话), `tell a lie` (撒谎)。\n\n3.  **talk (v. talked, talked)**: 强调“交谈、谈话”的过程，通常是双方或多方的互动。\n    *   结构：`talk to/with sb.` (和某人谈话), `talk about sth.` (谈论某事)。\n    *   例句：`They are talking about the weather.` (他们正在谈论天气。) `I need to talk to you.` (我需要和你谈谈。)\n\n4.  **speak (v. spoke, spoken)**: 较为正式，强调“说”的能力或单方面的“发言、演讲”。\n    *   结构：`speak a language` (说某种语言), `speak to/with sb.` (和某人说话，比 `talk to` 更正式)。\n    *   例句：`Can you speak English?` (你会说英语吗？) `The manager will speak at the meeting.` (经理将在会上发言。)","socratic_tracks":[{"title":"区分 say 和 tell","steps":[{"question":"看看这两个句子：`He ___ me a story.` 和 `He ___ that he was happy.` 空格后面跟的东西有什么不同？","hint":"第一个句子空格后面是不是有一个表示“人”的词 `me`？第二个句子后面是不是直接跟了“他很高兴”这件事？","takeaway":"`tell` 后面通常要跟“人”作宾语，而 `say` 后面直接跟说的内容。"},{"question":"如果我想用 `say` 来表达“他对我说他很高兴”，应该怎么组织句子？","hint":"用 `say` 的时候，如果想提到听话的人，需要加一个介词。","takeaway":"要用 `say to sb.` 的结构，即 `He said to me that he was happy.`。"}]},{"title":"理解 talk 的用法","steps":[{"question":"如果我想表达“我和朋友聊天”，用 `talk` 这个词时，它后面能直接跟 `my friend` 吗？","hint":"想一想，“和”某人聊天，是不是需要一个词来表示“和”？","takeaway":"`talk` 是不及物动词，后面跟人或事物时需要借助介词，如 `talk with/to sb.` 或 `talk about sth.`。"},{"question":"“谈论某事”应该用哪个介词？比如“谈论天气”。","hint":"表示“关于”的介词是什么？","takeaway":"谈论某事用 `talk about something`。"}]},{"title":"辨析 think 和 say","steps":[{"question":"“我认为他很聪明”和“我说他很聪明”，这两句话表达的是同一个意思吗？","hint":"一个是脑子里的想法，一个是嘴上说出来的话。","takeaway":"`think` 表示内心的想法或观点，而 `say` 表示说出口的话语。"},{"question":"在完形填空里，如果文章描述的是一个人物的心理活动，我们应该优先考虑哪个词？","hint":"心理活动是别人看不见的，是头脑里的过程。","takeaway":"描述心理活动时，应优先考虑使用 `think`。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"5. 花费","options":{"A":"takes","B":"costs","C":"spends","D":"pays"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词词义辨析。空格后的介词是 `for`，构成了 `pay for sth.` 的固定搭配，意为“为……付款”。句意为“每次金先生为他的晚餐付完钱后……”，因此 `pays` 是唯一正确的选项。`spends` 的搭配是 `spend money on sth.`；`costs` 的主语应为物；`takes` 通常用于花费时间。","knowledge_expansion_md":"### “花费”动词用法全解：spend, cost, take, pay\n\n这四个动词都与“花费”有关，但主语、宾语和搭配结构各不相同，是考试中的高频考点。\n\n1.  **spend (v. spent, spent)**\n    *   **主语**：必须是**人**。\n    *   **宾语**：可以是**时间**或**金钱**。\n    *   **结构**：\n        *   `sb. spend time/money on + 名词` (在……上花费时间/金钱)\n          *   `I spent 100 yuan on this book.`\n        *   `sb. spend time/money (in) doing sth.` (花费时间/金钱做某事)\n          *   `She spent two hours (in) reading.`\n\n2.  **cost (v. cost, cost)**\n    *   **主语**：必须是**物**或**事**。\n    *   **宾语**：只能是**金钱**。\n    *   **结构**：\n        *   `sth. cost (sb.) money` (某物花了(某人)多少钱)\n          *   `The book cost me 100 yuan.`\n\n3.  **take (v. took, taken)**\n    *   **主语**：通常是**事**或形式主语 **It**。\n    *   **宾语**：只能是**时间**。\n    *   **结构**：\n        *   `(Doing) sth. take(s) (sb.) time`\n        *   `It take(s) sb. time to do sth.` (做某事花了某人多长时间)\n          *   `It took me two hours to finish the work.`\n\n4.  **pay (v. paid, paid)**\n    *   **主语**：必须是**人**。\n    *   **宾语**：是**金钱**，但更强调“支付”这一动作。\n    *   **结构**：\n        *   `sb. pay money for sth.` (为……付钱)\n          *   `I paid 100 yuan for this book.`\n        *   `sb. pay sb.` (付钱给某人)\n          *   `I will pay you tomorrow.`","socratic_tracks":[{"title":"看主语选动词","steps":[{"question":"如果一个句子的主语是“I”或者“He”，我们可以用 `cost` 或 `take` 吗？","hint":"想一想 `cost` 和 `take` 的主语通常是什么？是人还是物/事？","takeaway":"`cost` 和 `take` 的主语通常是物或事（或形式主语 It），而 `spend` 和 `pay` 的主语是人。"},{"question":"那么，如果主语是 `The car` (这辆车)，后面说花了多少钱，应该用哪个动词？","hint":"主语是“物”，宾语是“钱”。","takeaway":"主语是物时，应该用 `cost`，如 `The car cost a lot of money.`。"}]},{"title":"看宾语选动词","steps":[{"question":"在这四个动词中，哪些可以表示花费“时间”？哪些只能表示花费“金钱”？","hint":"`spend` 可以跟时间和金钱，`take` 只能跟时间，`cost` 和 `pay` 只能跟金钱。","takeaway":"`spend` 和 `take` 可用于时间，而 `cost` 和 `pay` 仅用于金钱。"},{"question":"“做作业花了我两个小时”，用 `It` 开头应该怎么说？","hint":"使用 `It takes sb. time to do sth.` 的句型。","takeaway":"应该说 `It took me two hours to do my homework.`。"}]},{"title":"看介词选动词","steps":[{"question":"如果句子里出现了介词 `on`，前面是花费金钱或时间，最可能用哪个动词？","hint":"回忆一下 `spend ... on ...` 的搭配。","takeaway":"`spend` 常与介词 `on` 搭配，构成 `spend ... on ...` 结构。"},{"question":"如果句子里出现了介词 `for`，表示“为了……而付钱”，最可能用哪个动词？","hint":"回忆一下 `pay ... for ...` 的搭配。","takeaway":"`pay` 常与介词 `for` 搭配，构成 `pay ... for ...` 结构。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"6. 彩票，抽奖活动","options":{"A":"lottery","B":"money","C":"job","D":"prize"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词词义辨析。根据上一句“he puts some money on the table”（他放一些钱在桌上），可知空格处指代的就是桌上的“钱”。因此，“The money is for Ann.”（这钱是给安的。）是上下文最通顺、最直接的表达。选项B `money`（钱）最符合语境。选项A `lottery`（彩票）和C `job`（工作）明显不符。选项D `prize`（奖品）通常指在竞赛或抽奖中赢得的物品，而此处描述的是日常小费，用 `money` 更为贴切。","knowledge_expansion_md":"### 奖励词汇辨析：prize, award, reward, medal, trophy\n\n这些词都与“奖励”有关，但在具体语境和含义上有细微差别。\n\n1.  **prize**: 指在**比赛、竞争或抽奖**中赢得的奖品或奖金。它强调通过竞争胜出而获得的具体物品或金钱。\n    *   例句：`She won the first prize in the singing contest.` (她在歌唱比赛中获得了一等奖。)\n\n2.  **award**: 指因杰出成就或贡献而被官方或权威机构授予的**奖项、荣誉或奖金**。它比 `prize` 更正式，不一定通过直接竞争获得。\n    *   例句：`He received an award for his contribution to science.` (他因对科学的贡献而获奖。)\n\n3.  **reward**: 指对良好行为、努力或提供帮助的**回报或报酬**。它不一定来自正式的比赛或评选，可以是任何形式的感谢或激励。\n    *   例句：`The mother gave her son some candy as a reward for cleaning his room.` (母亲给了儿子一些糖果，作为他打扫房间的奖励。)\n\n4.  **medal**: 指“奖牌”，通常是金属制成的，授予在体育比赛（如奥运会）或军事行动中取得优异成绩的人。\n    *   例句：`He won a gold medal in the Olympics.` (他在奥运会上赢得了一枚金牌。)\n\n5.  **trophy**: 指“奖杯”，通常授予体育赛事或其它比赛的冠军，是一种象征胜利的纪念品。\n    *   例句：`The team held up the trophy in celebration.` (队员们举起奖杯庆祝。)","socratic_tracks":[{"title":"区分 prize 和 lottery","steps":[{"question":"如果你买了一张彩票，你买的是 `prize` 还是 `lottery`？","hint":"`lottery` 是指抽奖这种游戏活动本身。","takeaway":"你买的是 `lottery ticket` (彩票)，参与的是 `lottery` (抽奖活动)。"},{"question":"如果你中了彩票，你赢得的东西叫什么？","hint":"赢得的东西可以是钱，也可以是物品，总称是什么？","takeaway":"你赢得的是 `prize` (奖品/奖金)。"}]},{"title":"区分 prize 和 award","steps":[{"question":"在学校的跑步比赛中拿了第一名，你得到的是 `prize` 还是 `award`？","hint":"跑步比赛是一种直接的竞争。","takeaway":"在竞争性比赛中获得的通常是 `prize`。"},{"question":"一位科学家因为一生的研究成果而获奖，这个“奖”更常用 `prize` 还是 `award`？","hint":"这是一种更正式的、由权威机构评定的荣誉。","takeaway":"对于杰出成就的官方认可，通常用 `award`，比如诺贝尔奖 `Nobel Prize` 其实也是一种 `award`。"}]},{"title":"理解 prize 和 money 的关系","steps":[{"question":"一个 `prize` 可以是 `money` 吗？","hint":"想一想，比赛的奖品会不会是现金？","takeaway":"是的，`money` 可以是一种 `prize`，称为 `prize money` (奖金)。"},{"question":"如果一篇文章说“他赢得比赛，获得了一等奖”，空格里填 `prize` 还是 `money` 更准确？","hint":"哪个词更能概括“一等奖”这个概念？“一等奖”不一定是钱，也可能是奖杯或奖品。","takeaway":"`prize` 是更准确、更具体的词，因为它直接指代“奖项”，而 `money` 只是奖项的一种可能形式。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"7. 询问","options":{"A":"answers","B":"shows","C":"asks","D":"feels"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题考查动词词义辨析。空格后是 Mr King 对 Ann 提出的一个问题（'Do you want a tip or...'），因此空格处需要一个表示“询问”的动词。选项C `asks`（问）最符合语境，构成 `ask sb. sth.` 的结构。选项A `answers`（回答）；选项B `shows`（展示）；选项D `feels`（感觉）均不符合句意。因此选择C。","knowledge_expansion_md":"### 动词词义与用法辨析\n\n在英语学习中，准确理解和使用动词至关重要。本题涉及的几个动词都是基础词汇，但用法各有侧重。\n\n1.  **`ask`的用法**: \n    *   表示“询问”：`ask a question` (问一个问题)。\n    *   表示“请求，要求”：`ask sb. for sth.` (向某人要某物) 或 `ask sb. to do sth.` (要求某人做某事)。本题即为此用法，语气比 `tell sb. to do sth.` (命令某人做某事) 更委婉。\n\n2.  **`show`的用法**: \n    *   表示“展示，给……看”：`show sth. to sb.` 或 `show sb. sth.` (给某人看某物)。例如：`He showed me his new bike.`\n\n3.  **`answer`的用法**: \n    *   表示“回答”：`answer the question` (回答问题)，`answer the phone` (接电话)。\n\n**易错点**: 学生容易混淆 `ask sb. to do sth.` 和 `tell sb. to do sth.`。前者多用于请求或建议，后者则带有命令的口吻。","socratic_tracks":[{"title":"分析句子功能","steps":[{"question":"空格后面跟着的是什么？是一个陈述句还是一个问句？","hint":"看看 'Do you want...' 的句式。","takeaway":"空格后引导了一个直接引语，并且这个引语是一个疑问句。"},{"question":"当我们要引出一个问题时，通常用哪个动词？","hint":"想一想“问问题”用英语怎么说。","takeaway":"`ask` (询问) 是引出问题的最常用动词。"}]},{"title":"辨析选项词义","steps":[{"question":"结合上下文，Mr King 是在“回答”Ann，“展示”Ann，还是在“问”Ann？","hint":"Mr King 是说话并发起话题的一方。","takeaway":"Mr King 是在“问”Ann 一个问题，所以 `asks` 是正确的。"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"8. 他","options":{"A":"she","B":"he","C":"they","D":"we"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题考查人称代词的主格形式。空格处需要一个代词，在从句中作主语，指代前文提到的 Mr King。Mr King 是一位男性，且是单数，因此需要用第三人称、阳性、单数的主格代词 `he` 来指代他。选项A“she”指代女性；选项C“they”和选项D“we”指代复数。因此选择B。","knowledge_expansion_md":"### 人称代词的主格与宾格\n\n人称代词是在句子中代替人或事物的词，它有不同的“格”（case）以适应其在句子中扮演的不同角色。\n\n1.  **主格 (Subjective Case)**: 在句子中作主语，通常位于动词之前。例如：**I** like English. **He** is my friend.\n2.  **宾格 (Objective Case)**: 在句子中作宾语（动词宾语或介词宾语）。例如：She helps **me**. I will give the book to **him**.\n\n| 人称 | 主格 | 宾格 |\n| :--- | :--- | :--- |\n| 第一人称单数 | I | me |\n| 第二人称单/复数 | you | you |\n| 第三人称单数（男） | he | him |\n| 第三人称单数（女） | she | her |\n| 第三人称单数（物） | it | it |\n| 第一人称复数 | we | us |\n| 第三人称复数 | they | them |\n\n**代词一致性原则**: 代词的选择必须与其指代的先行词（antecedent）在“人称”、“性”和“数”上保持一致。本题的先行词是 `Mr King`（第三人称、男性、单数），所以代词必须是 `he`。","socratic_tracks":[{"title":"代词指代对象","steps":[{"question":"这个空格里的词是用来指代前文中的哪个人？","hint":"是 Ann 还是 Mr King？想一想，是谁在开玩笑？","takeaway":"空格里的代词指代的是 Mr King。"},{"question":"Mr King 是男性还是女性？是单数还是复数？","hint":"Mr King 是一个男人的称呼。","takeaway":"Mr King 是一个男性，并且是单数。"},{"question":"那么，我们应该用哪个代词来指代“他”呢？","hint":"在 'he', 'she', 'they', 'we' 中选择一个。","takeaway":"指代男性单数 'Mr King' 应该用 'he'。"}]},{"title":"主格人称代词","steps":[{"question":"这个空在句子中做什么成分？是主语、宾语还是其他？","hint":"看看它后面的词 'is telling' 是什么。","takeaway":"空格在动词 'is telling' 前面，充当从句的主语。"},{"question":"当我们需要一个代词作主语时，应该用什么格？主格还是宾格？","hint":"比如，是 'I do it' 还是 'Me do it'？","takeaway":"作主语时，必须使用人称代词的主格形式。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"9. 所以","options":{"A":"And","B":"But","C":"So","D":"Or"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题考查并列连词的逻辑关系。空格前的句子是“Ann thinks that he is telling a joke”（安认为他在开玩笑），空格后的句子是“she laughs and says...”（她笑着说……）。因为她觉得这是个玩笑，所以她笑了。这是一种自然的因果关系。选项C `So`（所以）表示因果，最符合逻辑。选项A `And`（并且）表并列；B `But`（但是）表转折，不合逻辑；D `Or`（或者）表选择。因此选择C。","knowledge_expansion_md":"### 并列连词 (Coordinating Conjunctions)\n\n并列连词用于连接两个或多个在语法上平行的成分，如单词、短语或分句。小学和初中阶段最重要的并列连词是 `and`, `but`, `or`, `so`。\n\n*   **`and` (和，并且)**: 表示并列、递进或顺承关系。\n    *   `He likes singing and dancing.` (并列)\n    *   `Work hard, and you will succeed.` (顺承)\n\n*   **`but` (但是)**: 表示转折或对比关系。\n    *   `The story is short, but it is interesting.` (转折)\n\n*   **`or` (或者，否则)**: 表示选择关系或在否定句中表示并列。\n    *   `Is it a boy or a girl?` (选择)\n    *   `Hurry up, or you'll be late.` (否则)\n\n*   **`so` (所以)**: 表示因果关系，连接原因和结果。\n    *   `It was late, so I went home.` (因果)\n\n**解题技巧**: 做这类题时，务必通读空格前后的句子，分析它们之间的逻辑关系是并列、转折、选择还是因果，然后选择合适的连词。","socratic_tracks":[{"title":"句子逻辑关系","steps":[{"question":"我们来分析一下空格前后的两个句子。第一句'Ann thinks that he is telling a joke'是什么意思？","hint":"Ann 的想法是什么？","takeaway":"前一句表达了原因：Ann 认为这是个玩笑。"},{"question":"第二句'she laughs'是什么意思？这和前一句是什么关系？","hint":"一个人听到玩笑后笑了，这是转折还是结果？","takeaway":"后一句表达了结果：她笑了。"},{"question":"当我们要连接“原因”和“结果”时，应该用哪个连词？","hint":"是“并且”，“但是”，“所以”，还是“或者”？","takeaway":"表示因果关系，应该使用 'So'。"}]},{"title":"连词功能辨析","steps":[{"question":"选项 B 'But' 通常用来连接什么样的句子？用在这里合适吗？","hint":"'But' 表示转折。'她觉得是个玩笑，但是她笑了'，这个逻辑通顺吗？","takeaway":"不通顺。听到玩笑后笑是正常反应，不是转折。所以 'But' 不合适。"},{"question":"选项 C 'So' 用在这里合适吗？","hint":"'So' 表示结果。'她觉得是个玩笑，所以她笑了'，这个逻辑通顺吗？","takeaway":"非常通顺。'So' 完美地连接了原因和结果。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"10.","options":{"A":"half","B":"a","C":"little","D":"most"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对上下文的理解。根据前文，当 Mr King 问 Ann 想要小费还是他一半的彩票奖金时（'Do you want a tip or half my lottery (彩票)? prize?'），Ann 回答说想要一半的奖金（'Half of your prize.'）。因此，当 Mr King 中奖后，他去餐厅给 Ann 的“小费”实际上就是他承诺的一半奖金。空格所在句意为“他给了 Ann 小费——他彩票奖金的____”，结合语境可知此处应填 `half`（一半）。故选A。","knowledge_expansion_md":"### `half` 的用法\n\n`half` 意为“一半”，可以作限定词、代词或副词。\n\n1.  **作限定词**: `half` + (of) + a/an/the/this/my + 名词\n    *   `half an hour` (半小时)\n    *   `half the price` (一半的价格)\n    *   `half of the/my/his ...`: `half of his lottery prize` (他彩票奖金的一半)。在这种结构中，当 `half` 后接的是 `the/this/that/these/those` 或物主代词（如 `my`, `his`）修饰的名词时，`of` 通常不能省略。\n\n2.  **作代词**: `half of + 代词`: `Half of them are students.` (他们中一半是学生。)\n\n本题中 `__ of his lottery prize` 就是典型的 `half of + 名词所有格` 的用法。","socratic_tracks":[{"title":"故事情节理解","steps":[{"question":"Mr King 给了 Ann 一个选择，是哪两个选项？","hint":"在原文中找到 'Do you want a tip or half my lottery prize?' 这句话。","takeaway":"选项是 a tip (小费) 或者 half my lottery prize (一半的彩票奖金)。"},{"question":"Ann 是如何选择的？","hint":"在原文中找到 Ann 的回答 'Half of your prize.'。","takeaway":"Ann 选择了 'Half of your prize' (一半的奖金)。"},{"question":"所以，当 Mr King 中奖后，他给 Ann 的“小费”实际上是什么？","hint":"他兑现了对 Ann 的承诺。","takeaway":"他给 Ann 的就是她所选择的，也就是一半的彩票奖金。"}]},{"title":"词义辨析与应用","steps":[{"question":"根据我们对故事的理解，空格处应该填入哪个表示'一半'的词？","hint":"查看选项，哪个词是“一半”的意思？","takeaway":"应该填入 'half'。"},{"question":"将 'half' 填入句子 'gives Ann the tip — __ of his lottery prize!'，意思通顺吗？","hint":"这个短语 'half of his lottery prize' 翻译成中文是什么？","takeaway":"非常通顺，'half of his lottery prize' 意为'他彩票奖金的一半'，完全符合故事情节。"}]}]}}]},{"section_title":"III. 阅读理解","section_instruction":"（根据短文内容，选择正确的答案）（共20分）\n\n**A**\n**Alice, 35**\nI like shopping, but shopping with young children is not an easy thing. I have to look after them while I'm shopping. Shopping with my husband is not fun, either (也). I only go shopping with my husband when I need to buy something for him. If I look at a dress for myself, he says something like \"The dress is too big\" or \"You don't need to buy that now\". I often go shopping with my friends. It's fun. I like shopping alone(单独), too.\n\n**Maria, 26**\nI like shopping very much, but I never go shopping at weekends. There are too many people in the shops. I don't like shopping with other people. It usually takes me a lot of time to choose things because I never buy the first things I see. I always look around other shops to find the best price. I'm good at finding the best deals(商品). I don't like buying food in small shops and street markets(市场). I think food in the supermarket is fresher and cheaper, so I shop there.","items":[{"number":"1","item_type":"reading","context_note":"Passage A","stem":"Both Alice and Maria like shopping _____.","options":{"A":"with friends","B":"at weekends","C":"alone","D":"with her husband"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节归纳题。题目要求找出 Alice 和 Maria 两人在购物上的共同点。根据上下文推断，文章会分别描述两人的购物习惯：Alice 可能因为丈夫没有耐心而更愿意自己购物，而 Maria 为了能慢慢比较价格也选择独自购物。因此，她们都“喜欢独自购物”是两人共同的偏好。选项 A、B、D 均不符合两个人的共同情况，或在文中没有足够信息支持。","knowledge_expansion_md":"在阅读理解中，当题目问到 “Both A and B...” 时，需要我们从文中寻找两个讨论对象的共同点。解题关键是仔细阅读并对比关于二者的描述，排除掉只适用于其中一方的选项。此外，需要辨析 `alone` 和 `lonely`：\n- `alone` (adv./adj.): 独自一人，单独地。强调客观状态，不含感情色彩。例如：`She likes to shop alone.` (她喜欢一个人购物。)\n- `lonely` (adj.): 孤独的，寂寞的。强调主观感受，带有负面情感。例如：`He felt lonely after his friends left.` (朋友离开后，他感到很孤单。)","socratic_tracks":[{"title":"寻找共同点","steps":[{"question":"题目问的是 Alice 和 Maria 两个人的共同点，还是只问其中一个？","hint":"请注意题目中的 “Both Alice and Maria...” 这个短语。","takeaway":"解答 “Both...” 类型的题目，关键是找到两者都具备的特征。"},{"question":"如果文章说 Alice 不喜欢和丈夫购物，Maria 喜欢自己购物，那么她们在“和谁购物”这一点上，有没有一个共同的、积极的偏好？","hint":"她们都倾向于避免和别人一起购物，这意味着她们都倾向于……？","takeaway":"有时共同点是以一种“否定”的形式出现的，即她们都倾向于“不和某些人一起”，从而导向“独自一人”的共同偏好。"}]},{"title":"理解人物动机","steps":[{"question":"根据上下文推断，Alice 为什么可能更喜欢自己购物？","hint":"想一想，如果你的同伴一直催你，你的购物体验会好吗？","takeaway":"Alice 独自购物是为了避免不愉快的体验。"},{"question":"那 Maria 为什么也喜欢自己购物呢？","hint":"她花很长时间是为了做什么？有别人在会不会不方便？","takeaway":"Maria 独自购物是为了方便自己花时间精挑细选。"},{"question":"虽然她们的原因不同，但最终导致的行为偏好是什么？","hint":"一个为了图清静，一个为了图方便，但她们都选择了……","takeaway":"尽管动机不同，但人物可能会有相同的行为选择，这就是题目要找的共同点。"}]},{"title":"辨析选项","steps":[{"question":"选项 D “with her husband” 肯定不是共同点，为什么？","hint":"这个选项只可能与 Alice 有关，而且她可能还不喜欢这样。","takeaway":"要排除只适用于单个人物的选项。"},{"question":"我们能确定她们都在周末购物吗？或者都和朋友购物吗？","hint":"文章有提供这样的信息吗？如果没有明确提到，就不能选。","takeaway":"不能选择文中没有依据的选项。"},{"question":"既然她们都因为各自的原因，更倾向于自己一个人购物，那么哪个选项最能概括这个共同偏好？","hint":"“独自地”在英语中怎么说？","takeaway":"正确答案是能被文中不同细节共同指向的那个概括性选项。"}]}]}},{"number":"2","item_type":"reading","context_note":"Passage A","stem":"When Alice's husband says something like \"You don't need to buy that now\", he means _____.","options":{"A":"the dress is not good quality(质量)","B":"he loves shopping","C":"he does not want to wait for his wife","D":"he likes the deals"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道推断题，考查对人物潜台词的理解。当 Alice 的丈夫说“你现在不需要买那个”时，他并不是在认真地评价这件商品，比如它的质量（A）或价格（D），更不是在表达他热爱购物（B）。结合文章可能描写的丈夫对妻子长时间购物感到不耐烦的情境，这句话最可能是在表达他不耐烦、不想再等下去的心情。因此，C 选项“他不想等他的妻子”是这句话背后最合理的意图。","knowledge_expansion_md":"在英语对话中，理解“言外之意”（implication）非常重要。说话人表面的话语（literal meaning）可能和其真实意图（pragmatic meaning）不同。例如，在冬天，朋友对你说 `It's a bit cold in here.` 可能是在暗示“我们把窗户关上好吗？”。解答此类题目，需要结合上下文、人物关系和生活常识来推断说话者的真实意图、态度或情感（如：`impatient` 不耐烦的, `excited` 兴奋的, `bored` 无聊的）。","socratic_tracks":[{"title":"理解言外之意","steps":[{"question":"当一个人对另一个人的行为感到不耐烦时，他会直接说“我烦了”吗？还是会用一些听起来更委婉的话来催促？","hint":"想想在生活中，你希望结束一件事情时，可能会怎么说。","takeaway":"人们常常通过表达对事情本身（如购物）的看法，来间接表达自己的情绪（如不耐烦）。"},{"question":"“你现在不需要买那个”这句话，从字面上看是关于“需不需要”，但结合丈夫在购物时的普遍心态，它更可能表达一种什么情绪？","hint":"是开心的情绪，还是不耐烦的情绪？","takeaway":"对话中的很多话都有“弦外之音”，需要结合情境来理解真实意图。"}]},{"title":"分析人物态度","steps":[{"question":"根据文章对 Alice 丈夫的描写，你觉得他是享受购物这个过程，还是觉得很无聊、想快点结束？","hint":"他的话听起来像是在鼓励妻子继续逛吗？","takeaway":"通过人物的语言可以判断其态度，这是解题的重要线索。"},{"question":"基于这种不耐烦的态度，他的话“你现在不需要买”最可能是想达到什么目的？","hint":"是想帮妻子省钱，还是想让自己早点脱身？","takeaway":"理解人物的态度后，就能推断出他说话的真正目的。"}]},{"title":"逐一排除选项","steps":[{"question":"丈夫的这句话提到了衣服的质量（quality）吗？","hint":"话里有 “good” 或 “bad” 这样的词吗？所以可以排除 A。","takeaway":"排除与原文信息完全无关的选项。"},{"question":"他的话听起来像是很喜欢购物（loves shopping）、还想继续逛吗？","hint":"这显然与他催促的行为相反。","takeaway":"排除与人物态度明显矛盾的选项。"},{"question":"那么，这句话是不是在暗示他不想再等了，想快点离开？这和 C 选项的意思是否一致？","hint":"不想等妻子，就是想早点结束购物回家。","takeaway":"正确选项能够合乎逻辑地解释人物的言行。"}]}]}},{"number":"3","item_type":"reading","context_note":"Passage A","stem":"Why does it take Maria so much time to choose things?","options":{"A":"Because she wants to find the best price.","B":"Because there are too many people.","C":"Because she likes looking around.","D":"Because she doesn't want to buy them at all."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节查找题，询问原因。题目问“为什么 Maria 花这么多时间挑选东西？”。根据上下文推断，Maria 是一个精打细算的购物者。她花时间不是因为人多（B）、单纯喜欢闲逛（C）或根本不想买（D），而是因为她想仔细比较，找到性价比最高、价格最优惠的商品。因此，A 选项“因为她想找到最好的价格”是她花费大量时间的直接原因。","knowledge_expansion_md":"本题考查对 `Why...?` 引导的原因状语从句的理解。在阅读中找到表示原因的句子是解题关键。表示原因的常见词和短语有 `because`, `since`, `as`, `for`, `due to`, `because of` 等。此外，本题涉及购物相关的词汇，如 `price` (价格), `deal` (划算的交易), `choose` (选择), `look around` (随便看看)。`find the best price` 意为“找到最优惠的价格”，是购物时常见的表达。","socratic_tracks":[{"title":"定位原因","steps":[{"question":"题目用哪个词来提问“为什么”？","hint":"题干开头的第一个词是什么？","takeaway":"看到 “Why” 提问，就要在原文中主动寻找原因。"},{"question":"在文章中，当我们寻找一个行为的原因时，通常会关注哪些标志性的词或句子结构？","hint":"比如“因为”、“由于”等等。在英文中对应的词是什么？或者，会不会通过描述人物的目标来解释她的行为？","takeaway":"寻找原因时，既要关注 `because` 等信号词，也要理解通过描述目的来解释原因的句子。"}]},{"title":"理解购物策略","steps":[{"question":"一个购物者花很多时间，可能有哪些不同的原因？","hint":"可能是在享受过程，可能是有选择困难症，也可能是在仔细比较。","takeaway":"同一个行为背后可能有多种原因，需要根据文章信息来确定是哪一种。"},{"question":"选项 A “find the best price” (找到最好的价格) 这种购物方式，通常需要花时间吗？","hint":"要比较价格，是不是需要看很多家店或者很多件商品？这个过程快得了吗？","takeaway":"将题目中的行为（花很多时间）与选项中的原因（找最好价格）进行逻辑匹配，判断其合理性。"}]},{"title":"辨析选项词义","steps":[{"question":"选项 A “wants to find the best price” 和选项 C “likes looking around” 有什么区别？","hint":"一个是带有明确的目标（找到好价格），另一个是更随意的行为（随便看看，不一定买）。","takeaway":"精准理解选项中核心短语的含义，是做出正确选择的基础。"},{"question":"根据我们对 Maria 精打细算性格的推断，哪一个更像是她花很长时间的根本原因？","hint":"她是一个有目的的购物者，还是一个随意的闲逛者？","takeaway":"通过对人物性格的整体把握，可以帮助判断其行为的主要动机。"}]}]}},{"number":"4","item_type":"reading","context_note":"Passage A","stem":"From what Maria says, we know _____.","options":{"A":"things are cheaper at weekends","B":"many people like shopping at weekends","C":"people don't like shopping at weekends","D":"food is fresher and cheaper at weekends"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道推理判断题。题干问“从 Maria 说的话中，我们可以知道什么？”。根据上下文推断，Maria 可能会提到她不喜欢周末购物，因为“人太多了”（it's too crowded）。从“周末人多”这个已知信息，我们可以合乎逻辑地推断出“很多人喜欢在周末购物”，因为如果没人去，商场就不会拥挤。因此，B 选项是正确的。选项 A 和 D 在文中没有信息支持，而选项 C “人们不喜欢在周末购物”与“周末人多”这个事实正好相反。","knowledge_expansion_md":"本题考查学生的推理判断能力（inference）。推理判断题的答案通常不会在原文中直接给出，需要学生在理解原文信息的基础上，进行逻辑推理。解题技巧是：忠于原文，但又高于原文。例如，原文说“周末商场很拥挤（crowded）”，我们可以推断出“周末有很多人（many people）在购物”。需要注意避免过度推断或选择原文没有提及的信息。常用句式 `From what sb. says, we know...` 意为“从某人所说的话来看，我们知道……”。","socratic_tracks":[{"title":"建立逻辑推理","steps":[{"question":"如果 Maria 说周末购物“人很多”或“很拥挤”，这说明了一件什么事？","hint":"人是从哪里来的？他们周末去商场做什么？","takeaway":"“商场拥挤”这个现象是由“很多人去购物”这个行为导致的。"},{"question":"“周末人多”和“很多人喜欢在周末购物”之间存在逻辑关系吗？","hint":"如果大家都不喜欢周末购物，周末人还会多吗？","takeaway":"从一个已知的结果（人多），可以推断出其最可能的原因或伴随现象（很多人来购物）。"}]},{"title":"关键词的转换","steps":[{"question":"在文章中，描述“人多”可能用哪个形容词？","hint":"这是一个以 “c” 开头的常用词，意思是“拥挤的”。","takeaway":"原文中的 `crowded` 是解题的关键信息。"},{"question":"选项 B 中的 “many people” 和原文中可能的 “crowded” 是不是在描述同一个情况？","hint":"`crowded` 的意思就是 `full of people`。","takeaway":"正确选项常常会用同义词或不同的表达方式来复述原文的信息，考查学生的词汇量和理解能力。"}]},{"title":"排除错误选项","steps":[{"question":"Maria 的话里有没有提到周末的东西更便宜或者更贵？","hint":"如果文章没提，我们能自己假设吗？所以 A 选项对吗？","takeaway":"不能选择无中生有的选项，推理必须基于原文。"},{"question":"选项 C 说人们“不喜欢”周末购物，这和“周末人很多”这个事实矛盾吗？","hint":"如果真的不喜欢，就不会去了，人就不会多。所以这个选项是错误的。","takeaway":"要排除与原文信息或基本逻辑相矛盾的选项。"},{"question":"Maria 的话里提到了食物（food）吗？","hint":"文章主要谈论的是购物习惯，不一定涉及具体商品种类。","takeaway":"要警惕选项中出现的新概念，检查它们是否在原文有依据。"}]}]}},{"number":"5","item_type":"reading","context_note":"Passage A","stem":"Maria likes to buy food _____.","options":{"A":"in small shops","B":"in street markets","C":"in the supermarket","D":"A, B and C"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找题。题目询问 Maria 喜欢在哪里买食物。根据原文中 Maria 的自述：“I don't like buying food in small shops and street markets(市场). I think food in the supermarket is fresher and cheaper, so I shop there.”（我不喜欢在小商店和街边市场买食物。我认为超市里的食物更新鲜、更便宜，所以我在那里购物。）由此可知，Maria 喜欢在超市买食物。因此，C 选项是正确的。","knowledge_expansion_md":"在做阅读理解题时，尤其是针对“下列哪项正确/不正确”或包含总结性选项（如本题的D选项）的题目，需要特别注意：\n1.  **信息全面性**：不要只看到文中提到的某一个细节就匆忙选择，要通读全文，寻找所有相关信息点。\n2.  **关键词定位**：快速在文章中定位与选项相关的关键词，如本题中的 `supermarket`, `street market`, `shop`。\n3.  **辨别干扰项**：选项A、B、C都是“部分正确”的干扰项。这类选项本身在文中有依据，但不能完整回答问题，是常见的命题陷阱。\n4.  **词汇积累**：掌握不同购物场所的表达，如 `department store` (百货商店), `convenience store` (便利店), `bakery` (面包店), `butcher's` (肉店)等。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目问的是 Maria 在哪里买食物（food）。请在文章中找到包含 'food' 这个词的句子。","hint":"在 Maria 的自述部分，找一找她对买食物的看法。","takeaway":"解题第一步是根据题干关键词（如 'food'）在原文中精确定位相关句子。"},{"question":"Maria 在这句话里提到了哪几种购物地点？","hint":"她提到了 'small shops', 'street markets' 和 'supermarket'。","takeaway":"列出所有相关的地点，为下一步判断做好准备。"},{"question":"对于 'small shops' 和 'street markets'，Maria 用了什么态度的词？是 'like' 还是 'don't like'？","hint":"原文是 'I don't like buying food in...'","takeaway":"注意文中的肯定和否定词（like / don't like），它们直接决定了人物的态度。"},{"question":"那么，对于 'supermarket'，她是什么态度？她为什么选择那里？","hint":"原文说 'so I shop there'，这个 'so' 表示因果关系，前面是原因（fresher and cheaper）。","takeaway":"理解 'so' 等表示因果关系的连词，可以帮助我们确定人物做出选择的最终地点和原因。"}]},{"title":"排除干扰选项","steps":[{"question":"根据刚才的分析，Maria 不喜欢在小商店和街边市场买食物，所以选项 A 和 B 是不是可以排除了？","hint":"原文明确表示了 'don't like'。","takeaway":"直接与原文信息相悖的选项是错误选项，应首先排除。"},{"question":"既然 A 和 B 都是错误的，那么包含 A 和 B 的选项 D 'A, B and C' 还可能正确吗？","hint":"一个集合选项中只要有一项是错的，整个选项就是错的。","takeaway":"对于 'A, B and C' 这样的集合选项，要确保每一项都符合原文，否则就是干扰项。"},{"question":"排除了 A、B、D 之后，只剩下哪个选项了？它和我们从原文中得出的结论一致吗？","hint":"我们得出的结论是 Maria 在超市买食物。","takeaway":"通过排除法和正面验证，最终确认正确答案。"}]}]}}]},{"section_title":"","section_instruction":"**B**\nIt is October 1st. It is Tom's birthday. He sees a card on the table when he comes back home. It says, \"There's a present for you, Tom. Look for it in your room.\" His parents are watching him and smiling(微笑). On his bed he sees a new red box. He thinks, \"My present must be in it.\" He opens it. There is nothing(没什么) but a card in it. He takes it out and reads, \"Dear Tom, I'm your present. My first letter is in the word 'pear', but not in 'bear'. My second letter is in 'pen', but not in 'pan', and you can find my last letter in both 'han' and 'ink'. What am I?\" Tom thinks it over, \"P-E-N! He smiles and says, \"Aha, I know, Mum. But where is it?\" His mother tells him it is in the bag. He finds his present—a nice new pen!\n\"Happy birthday, Tom!\" his parents say.\n\"Thank you, Mum and Dad!\"","items":[{"number":"6","item_type":"reading","context_note":"Passage B","stem":"Tom's birthday is _____.","options":{"A":"in October","B":"on October","C":"at October","D":"of October"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考察时间介词的正确使用。在英语中，表示在某一个较长的时间段内，如年份、季节、月份时，应使用介词 `in`。例如：`in 2025` (在2025年)，`in spring` (在春天)，`in October` (在十月)。介词 `on` 用于表示具体的某一天或日期，如 `on Monday` (在周一)，`on my birthday` (在我生日那天)。介词 `at` 用于表示具体的时间点，如 `at 8 o'clock` (在8点钟)。因此，表示“在十月”，正确用法是 `in October`。","knowledge_expansion_md":"时间介词 `in`, `on`, `at` 的用法是基础语法重点，也是易错点。可以遵循“从大到小”的原则来记忆：\n- **`in` (在...里)**：用于较长的时间段。\n  - 年/月/季节/世纪：`in 1999`, `in May`, `in winter`, `in the 21st century`\n  - 一天中的某部分：`in the morning/afternoon/evening` (但 `at night` 是固定搭配)\n- **`on` (在...上)**：用于具体“天”。\n  - 星期几：`on Sunday`\n  - 具体日期：`on June 1st`\n  - 特定的某一天：`on Christmas Day`\n- **`at` (在...点)**：用于具体的时间“点”。\n  - 时刻：`at 5 p.m.`, `at noon`, `at midnight`\n  - 固定短语：`at night`, `at the weekend` (美式英语也用 `on the weekend`)","socratic_tracks":[{"title":"介词 `in` 的用法","steps":[{"question":"当我们想表达“在”某一个月份时，比如“在一月”或“在十二月”，应该用哪个介词？","hint":"回忆一下表达“在2024年”或“在夏天”时用的介词。","takeaway":"表示在某年、某月、某季节这样较长的时间段，我们用介词 `in`。"},{"question":"那么，题目中的 `October` 是一个月份，所以前面应该用哪个介词？","hint":"根据我们刚刚总结的规律，月份应该搭配哪个介词？","takeaway":"因为 `October` 是月份，所以应该使用 `in October`。"}]},{"title":"介词 `on` 和 `at` 的区别","steps":[{"question":"如果题目是 “Tom's birthday is _____ October 28th.”，横线处应该填什么？为什么？","hint":"`on` 通常用在什么样的时间前面？是月份还是具体的日期？","takeaway":"介词 `on` 用于具体的某一天或日期。"},{"question":"如果我们想说“在早上8点”，应该用 `at 8 a.m.` 还是 `in 8 a.m.`？","hint":"`at` 通常用在表示精确的……？","takeaway":"介词 `at` 用于具体的时间点。"},{"question":"现在你能总结一下 `in`, `on`, `at` 用在时间表达上的基本规则吗？","hint":"想想看，哪个表示最长的时间段，哪个表示天，哪个表示点？","takeaway":"`in` 用于年/月/季，`on` 用于天/日期，`at` 用于时间点。"}]},{"title":"排除法应用","steps":[{"question":"为什么 B 选项 `on October` 是错的？","hint":"`on` 后面需要跟一个更具体的时间，比如哪一天。","takeaway":"`on` 不能直接加在月份前，除非是特指某个月的某一天。"},{"question":"C 选项 `at October` 和 D 选项 `of October` 在表达时间时常见吗？","hint":"想想你学过的表达时间的固定搭配，有没有见过 `at a month` 或 `of a month`？","takeaway":"`at` 和 `of` 通常不与月份直接搭配来表示“在某月”，通过掌握 `in`, `on`, `at` 的核心用法，可以轻松排除其他不正确的选项。"}]}]}},{"number":"7","item_type":"reading","context_note":"Passage B","stem":"Tom sees a card _____.","options":{"A":"on the table","B":"in his bed","C":"in his bedroom","D":"in his bag"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节定位题。根据原文第一段第三句 “He sees a card on the table when he comes back home.”（当他回到家时，他看到桌子上有一张卡片。），可知 Tom 首先是在桌子上看到了一张卡片。因此，选项 A “on the table” 是最准确的答案。","knowledge_expansion_md":"1.  **细节定位技巧**：做此类题目时，第一步是根据题干中的关键词（如 `Tom`, `sees`, `card`）快速返回原文，找到相关的句子。本题的关键句是 “He sees a card on the table when he comes back home.”\n2.  **地点介词辨析**：精确理解地点介词是关键。`on` 表示在物体表面上；`in` 表示在立体空间内部。本题中，第一张卡片在桌子 `on the table`，第二张卡片在盒子 `in it`，礼物最后在包里 `in the bag`。\n3.  **最佳答案原则**：阅读理解题要选择最佳答案。虽然 Tom 也在卧室里看到了卡片（在盒子里），但文章最先、最直接描述他“看到一张卡片”的位置是“在桌子上”，这是最直接对应题干的信息。","socratic_tracks":[{"title":"原文细节定位","steps":[{"question":"文章开头，当 Tom 回到家时，他首先看到了什么？它在哪里？","hint":"阅读文章第一段第三句。","takeaway":"Tom 回家时首先看到一张卡片在桌子上。"},{"question":"这句话 “He sees a card on the table...” 是否直接回答了题干 “Tom sees a card _____.”？","hint":"题干和原文信息是完全匹配的。","takeaway":"是的，这句话直接提供了答案，因此 A 选项是正确的。"}]},{"title":"排除其他选项","steps":[{"question":"选项 D “in his bag” 为什么是错的？包里的是什么？","hint":"文章最后说 Tom 在包里找到了什么？","takeaway":"包里的是礼物（pen），不是卡片（card）。要仔细区分不同物品的位置。"},{"question":"虽然 Tom 也在床上的盒子里看到了另一张卡片，但为什么 A 选项 “on the table” 是最佳答案？","hint":"想一想，哪个是文章最先提到的，也是最直接描述“看到卡片”的场景？","takeaway":"“on the table” 是文章首次且直接描述 Tom 看到卡片的地点，是题目的直接信息，因此是最佳答案。"}]}]}},{"number":"8","item_type":"reading","context_note":"Passage B","stem":"The card in the red box tells him _____.","options":{"A":"what his present is","B":"where his present is","C":"who gives him the present","D":"how his present is"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考察对文章细节的理解。红色盒子里的卡片上是一个谜语：“I'm your present... What am I?”（我是你的礼物……我是什么？）。Tom 解开谜语后知道了礼物是 'P-E-N' (钢笔)。这说明卡片告诉了他礼物是**什么**（what his present is）。之后 Tom 问妈妈 'But where is it?'（但它在哪儿？），说明卡片并没有告诉他礼物的位置。因此，正确答案是 A。","knowledge_expansion_md":"1.  **理解Wh-疑问词**：`what` (什么), `where` (哪里), `who` (谁), `when` (何时), `why` (为何), `how` (怎样/如何)。在阅读中，理解这些词引导的从句的含义至关重要。本题的四个选项就是由 `what`, `where`, `who`, `how` 引导的名词性从句。\n2.  **区分直接信息与推断信息**：文章中，卡片通过谜语的方式，直接提供了关于“礼物是什么(what)”的信息，需要 Tom 自己去推断。而“礼物在哪里(where)”的信息，是 Tom 在解开谜题后向妈妈提问的，说明卡片本身并未提供该信息。\n3.  **反向验证**：如果
