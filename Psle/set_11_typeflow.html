卡片告诉了 Tom 礼物在哪里，他就不会问妈妈 'But where is it?'。这个后续情节是判断卡片内容的重要线索。","socratic_tracks":[{"title":"理解卡片内容","steps":[{"question":"红色盒子里的卡片上写了什么？它是一个直接的说明还是一个问题？","hint":"找到 'What am I?' 这句话。","takeaway":"卡片上是一个谜语，让 Tom 猜猜礼物是什么。"},{"question":"当 Tom 解开谜语后，他知道了关于礼物的什么信息？是它的名字，还是它的位置？","hint":"Tom 喊出了 'P-E-N!'","takeaway":"Tom 知道了礼物是“PEN”（钢笔），也就是知道了“礼物是什么”。"}]},{"title":"分析后续对话","steps":[{"question":"知道礼物是钢笔后，Tom 问了妈妈一个什么问题？","hint":"找到 'But where is it?' 这句话。","takeaway":"Tom 问妈妈礼物在哪里。"},{"question":"Tom 问“它在哪儿”这个行为，说明了关于卡片内容的什么信息？","hint":"如果卡片已经告诉他位置了，他还需要问吗？","takeaway":"这说明卡片没有告诉他礼物的位置。"}]},{"title":"匹配正确选项","steps":[{"question":"综上所述，卡片告诉了 Tom “礼物是什么”（what his present is），但没有告诉他“礼物在哪里”（where his present is）。那么应该选择哪个选项？","hint":"对比我们分析的结果和四个选项的含义。","takeaway":"应该选择 A 选项。"}]}]}},{"number":"9","item_type":"reading","context_note":"Passage B","stem":"Where is the birthday present?","options":{"A":"On the table.","B":"On the bag.","C":"On the card.","D":"On the bed."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对细节信息的定位能力。根据文章倒数第三句，妈妈告诉汤姆礼物的位置：'His mother tells him it is in the bag.'（他妈妈告诉他礼物在包里。）。因此，生日礼物最终是在包里找到的。**注意：本题所给选项未包含正确答案“in the bag”。** 选项 A 'On the table' 是第一张卡片的位置。选项 D 'On the bed' 是装有第二张卡片的盒子的位置。选项 B 'On the bag' 与正确位置 'in the bag' 介词不同。","knowledge_expansion_md":"在做阅读理解的细节题时，要学会使用“关键词定位法”。\n1.  **划出题干关键词**：如此题的 `Where` 和 `birthday present`。\n2.  **快速扫描文章**：带着关键词在文章中寻找相关信息。本题中，描述礼物最终位置的句子是 'His mother tells him it is in the bag.'。\n3.  **对比原文和选项**：找到相关句子后，仔细比对信息。原文明确指出礼物在 `in the bag` (包里)，而所有选项均不完全匹配。做题时需注意，有时题目或选项可能存在瑕疵，但解题的根本还是要依据原文。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目问的是“生日礼物”（birthday present）在哪里。文章中哪句话直接说明了礼物的位置？","hint":"找到妈妈告诉 Tom 的那句话。","takeaway":"妈妈说礼物在 “in the bag”（在包里）。"}]},{"title":"分析所有选项","steps":[{"question":"选项 A “On the table” (在桌子上) 放的是什么？","hint":"回顾文章开头部分。","takeaway":"桌子上放的是第一张卡片，不是礼物。"},{"question":"选项 D “On the bed” (在床上) 放的是什么？","hint":"Tom 在房间里找到了什么？","takeaway":"床上放的是一个红色的盒子，里面有第二张卡片，但不是最终的礼物。"},{"question":"正确位置是 “in the bag”。对比选项 B “On the bag”，它们有什么不同？","hint":"介词 `in` 和 `on` 的意思一样吗？","takeaway":"`in` 表示“在...里面”，`on` 表示“在...表面上”。这两个词的意义不同，所以选项 B 也不准确。"}]}]}},{"number":"10","item_type":"reading","context_note":"Passage B","stem":"Tom's present is _____.","options":{"A":"a letter","B":"three letters","C":"a card","D":"a nice new pen"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题是细节理解题。根据文章内容，Tom 解开卡片上的谜语，得出礼物是 'P-E-N'。随后，文章最后一句明确指出：'He finds his present—a nice new pen!'（他找到了他的礼物——一支漂亮的新钢笔！）。因此，正确答案是 D。","knowledge_expansion_md":"在英语阅读中，要善于区分不同事物。本文中出现了 `card` (卡片) 和 `present` (礼物)。卡片是提供线索的工具，而礼物是最终找到的物品。文章通过一个寻宝游戏的设计，将卡片和礼物联系起来，但它们是两个不同的东西。题目问的是 `present`，所以要定位到描述最终礼物的句子，而不是描述线索的句子。","socratic_tracks":[{"title":"关键信息定位","steps":[{"question":"文章的结尾部分，描述 Tom 找到礼物时的句子是什么？","hint":"找到 'He finds his present' 这句话。","takeaway":"关键句是 “He finds his present—a nice new pen!”。"},{"question":"这句话直接告诉我们礼物是什么了吗？","hint":"注意破折号后面的内容。","takeaway":"是的，破折号后面的 “a nice new pen” 直接说明了礼物的内容。"}]},{"title":"排除干扰项","steps":[{"question":"选项 A “a letter” (一封信) 和 B “three letters” (三个字母) 为什么不对？","hint":"'P', 'E', 'N' 是三个字母，但它们组成了一个词，代表一个物品。","takeaway":"礼物是一个物品（钢笔），而不是字母本身。谜题用了字母，但礼物不是字母。"},{"question":"选项 C “a card” (一张卡片) 为什么不对？","hint":"卡片和礼物在文中的作用是什么？","takeaway":"卡片是用来提供寻找礼物线索的工具，它本身不是最终的礼物。"}]}]}}]},{"section_title":"IV. 句型转换","section_instruction":"（共20分）","items":[{"number":"1","item_type":"sentence_transform","context_note":"","stem":"Daniel knows a lot about computers. (改为一般疑问句, 并作否定回答)\n_____ Daniel _____ a lot about computers?\n—No, he _____.","options":{},"answer_area_hint":"3 blanks","teaching":{"correct_answer":"Does|know|doesn't","explanation_md":"本题考查一般现在时态的句型转换。\n1.  **改为一般疑问句**：原句 “Daniel knows...” 的主语 `Daniel` 是第三人称单数，动词 `knows` 是一般现在时。变一般疑问句时，需在句首加助动词 `Does`，同时动词 `knows` 恢复为原形 `know`。所以第一、二个空填 `Does` 和 `know`。\n2.  **作否定回答**：题目要求作否定回答。问句主语是 `Daniel`（he），助动词是 `Does`。否定简略回答的结构是 “No, 主语代词 + doesn't.”。所以第三个空填 `doesn't`。","knowledge_expansion_md":"### 一般现在时句型转换规则\n\n对于包含实义动词的一般现在时陈述句，其句型转换遵循以下核心规则：\n\n1.  **变一般疑问句**：\n    *   **结构**：`Do/Does + 主语 + 动词原形 + 其他?`\n    *   **助动词选择**：主语为第三人称单数（he, she, it, a name like Daniel）时用 `Does`；主语为其他任何人称（I, you, we, they, plural nouns）时用 `Do`。\n    *   **关键点**：一旦使用了助动词 `Does`，原句中的动词第三人称单数形式（如 `knows`, `goes`, `studies`）必须还原为动词原形（`know`, `go`, `study`）。\n\n2.  **变否定句**：\n    *   **结构**：`主语 + don't/doesn't + 动词原形 + 其他.`\n    *   **助动词选择**：规则同上，第三人称单数用 `doesn't`，其他用 `don't`。\n\n3.  **简略回答**：\n    *   **肯定**：`Yes, 主语代词 + do/does.`\n    *   **否定**：`No, 主语代词 + don't/doesn't.`\n    *   **注意**：回答时必须用 `do/does`，不能用实义动词本身。","socratic_tracks":[{"title":"一般疑问句构成","steps":[{"question":"看到原句 “Daniel knows...”，它的动词有什么特点？这告诉我们它是什么时态和人称？","hint":"动词是 “knows”，末尾加了 -s。这通常发生在主语是什么样的人称和数的情况下？","takeaway":"这是主语为第三人称单数的一般现在时。"},{"question":"要把这种句子变成一般疑问句，我们需要在句首添加一个什么“帮手”（助动词）？","hint":"我们学过 do 和 does，根据主语 “Daniel” 应该选哪一个？","takeaway":"因为主语是第三人称单数，所以需要用 Does 放在句首。"},{"question":"用了助动词 Does 之后，原来的动词 “knows” 应该有什么变化？","hint":"助动词已经承担了表示“第三人称单数”的任务，所以后面的动词就不需要再变化了。","takeaway":"助动词 Does 出现后，实义动词必须用原形 know。"}]},{"title":"否定回答结构","steps":[{"question":"题目要求作否定回答，英语中简略的否定回答通常以什么词开头，后面跟什么？","hint":"回答的结构是 “No, 主语 + 助动词 + not”。","takeaway":"否定回答以 “No” 开头，后跟 “主语代词 + 助动词的否定形式”。"},{"question":"在这个句子里，主语代词是什么？助动词的否定形式又是什么？","hint":"主语是 Daniel，可以用 he 代替。问句用的助动词是 Does。","takeaway":"主语代词是 he，助动词的否定形式是 does not，其缩写形式是 doesn't。"}]},{"title":"主谓一致","steps":[{"question":"在原句 “Daniel knows...” 中，为什么动词 know 要加 s？","hint":"这和主语 “Daniel” 的人称和单复数有关，是语法规则的要求。","takeaway":"因为在一般现在时中，当主语是第三人称单数时，谓语动词需要进行相应的变化（通常是加-s）。"},{"question":"在疑问句 “Does Daniel know...” 中，为什么 know 又不加 s 了？这个 s “跑”到哪里去了？","hint":"观察一下新加的助动词 Does，它是不是由 do + es 构成的？","takeaway":"助动词 Does 已经体现了主语是第三人称单数，所以后面的主动词必须使用原形，避免重复变化。"}]}]}},{"number":"2","item_type":"sentence_transform","context_note":"","stem":"My cousin wears a red hat today. (改为一般疑问句, 并作肯定回答)\n_____ your cousin _____ a red hat today?\n—Yes, he _____.","options":{},"answer_area_hint":"3 blanks","teaching":{"correct_answer":"Does|wear|does","explanation_md":"本题考查一般现在时的一般疑问句和简略回答，同时涉及人称代词的转换。\n1.  **改为一般疑问句**：原句主语 `My cousin` 在问句中变为 `your cousin`，但这仍然是第三人称单数。因此，需要用助动词 `Does` 开头提问。原动词 `wears` 需变为动词原形 `wear`。所以前两个空填 `Does` 和 `wear`。\n2.  **作肯定回答**：题目要求作肯定回答。回答中的主语 `he` 指代 `your cousin`。肯定简略回答的结构是 “Yes, 主语代词 + does.”。所以第三个空填 `does`。","knowledge_expansion_md":"### 句型转换中的人称变化\n\n在进行句型转换时，特别是将陈述句改为疑问句，常常模拟对话场景，因此需要注意人称代词和物主代词的相应变化。这是一个常见的考点和易错点。\n\n*   **第一人称 → 第二人称**\n    *   `I` → `you`\n    *   `we` → `you`\n    *   `my` → `your`\n    *   `our` → `your`\n    *   `me` → `you`\n    *   `us` → `you`\n\n*   **第二人称 → 第一人称** (在回答问题时)\n    *   `you` → `I` / `we`\n    *   `your` → `my` / `our`\n\n**本题情景分析**：\n原句：`My cousin wears a red hat.` (我的表哥戴着一顶红帽子。——这是“我”在陈述。)\n疑问句：`Does your cousin wear a red hat?` (你的表哥戴着一顶红帽子吗？——这是“你”在向“我”提问。)\n回答：`Yes, he does.` (是的，他戴着。——这是“我”在回答“你”的问题。)","socratic_tracks":[{"title":"助动词与动词原形","steps":[{"question":"疑问句的主语是 “your cousin”，它的人称和数是什么？","hint":"“your cousin” 可以用 “he” 或 “she” 来代替，所以是单数还是复数？","takeaway":"“your cousin” 是第三人称单数。"},{"question":"既然主语是第三人称单数，我们应该用哪个助动词来构成一般疑问句？","hint":"在 Do 和 Does 中选择一个。","takeaway":"主语是第三人称单数，应该用助动词 Does。"},{"question":"使用了助动词 Does 之后，原句的动词 “wears” 应该变成什么形式？","hint":"助动词后面的主动词要“返璞归真”。","takeaway":"动词需要恢复原形，所以 “wears” 变成 “wear”。"}]},{"title":"人称代词转换","steps":[{"question":"为什么原句中的 “My cousin” 在问句中变成了 “your cousin”？","hint":"想象一下这是两个人之间的对话。我说“我的表哥”，你向我提问时会怎么说？","takeaway":"这是在模拟对话，陈述句中的第一人称（my）在疑问句中通常会转变为第二人称（your）。"},{"question":"在回答 “Yes, he ...” 中，这个 “he” 指的是谁？","hint":"这个 “he” 指的是提问者和你都在谈论的那个人。","takeaway":"“he” 指代的是 “my cousin” 或 “your cousin”，即同一个人。"}]},{"title":"肯定回答构成","steps":[{"question":"题目要求作肯定回答，简略肯定回答的结构是什么？","hint":"以 Yes 开头，后面是主语和助动词。","takeaway":"肯定回答的结构是 “Yes, 主语代词 + 相应的助动词”。"},{"question":"在这个回答中，主语代词是 “he”，那么助动词应该用什么？","hint":"回答中使用的助动词应该和问句中的助动词保持一致。","takeaway":"问句以 Does 开头，所以肯定回答也用 does。"}]}]}},{"number":"3","item_type":"sentence_transform","context_note":"","stem":"I like my school very much. (改为一般疑问句)\n_____ you _____ _____ school very much?","options":{},"answer_area_hint":"3 blanks","teaching":{"correct_answer":"Do|like|your","explanation_md":"此题考查一般现在时陈述句改为一般疑问句。\n1.  原句是“I like...”，含有实义动词 `like`，变疑问句需借助助动词 `Do` 或 `Does`。主语 `I` 变为 `you`，因此用 `Do` 开头。\n2.  句中第一个空应填入助动词 `Do`。\n3.  第二个空应填入动词原形 `like`。\n4.  问句中，第一人称的物主代词 `my` 需相应地转变为第二人称的 `your`，因此第三个空填 `your`。","knowledge_expansion_md":"### 一般现在时的一般疑问句\n\n当陈述句的谓语动词是**实义动词**时，将其变为一般疑问句需要借助助动词 `do` 或 `does`，并置于句首，同时句末使用问号。基本结构为：\n\n`Do/Does + 主语 + 动词原形 + 其他成分?`\n\n1.  **助动词的选择**：\n    *   当主语是第一人称 (I, we)、第二人称 (you) 或第三人称复数 (they) 时，用 `Do`。\n    *   当主语是第三人称单数 (he, she, it, 或单个的人名/物) 时，用 `Does`。\n\n2.  **动词形式**：\n    *   无论用 `Do` 还是 `Does`，后面的实义动词都必须使用**原形**。\n    *   例如：`He likes apples.` -> `Does he like apples?` (likes 变为 like)\n\n3.  **人称代词的转换**：\n    *   在对话情景中，第一人称（I/we, my/our）通常要变为第二人称（you, your）。\n    *   `I know him.` -> `Do you know him?`\n    *   `We have our own books.` -> `Do you have your own books?`","socratic_tracks":[{"title":"助动词的选择","steps":[{"question":"原句“I like my school”中，动词是什么？是be动词（am/is/are）还是行为动词？","hint":"“like”（喜欢）是一个表示动作或状态的词。","takeaway":"当句子中有行为动词时，我们需要借助“助动词”来帮助构成疑问句。"},{"question":"当我们要把“I like...”变成一个问别人的问题时，主语“I”会变成什么？","hint":"我问你，主语就从“我”变成了“你”。","takeaway":"主语从'I'变成了'you'。"},{"question":"对于主语“you”，我们应该用哪个助动词来开头，是'Do'还是'Does'？","hint":"想一想“你喜欢...”的英文表达：Do you like...?","takeaway":"主语是'you'时，一般疑问句要用助动词'Do'开头。"}]},{"title":"人称代词转换","steps":[{"question":"在原句“I like my school”中，“my school”是谁的学校？","hint":"my 的意思是“我的”。","takeaway":"原句中，school是“我”的学校。"},{"question":"当“我”问“你”问题时，提到“我的学校”，在问题里应该变成谁的学校？","hint":"我问你：“你喜欢我的学校吗？”。但题目是想问你是否喜欢你自己的学校。","takeaway":"在将陈述句改为疑问句的练习中，通常需要将“我的”转换为“你的”。"},{"question":"“你的”用哪个英文单词表示？","hint":"my 对应 I，那么 you 对应的物主代词是什么？","takeaway":"物主代词'my'在问句中需要相应地转变为'your'。"}]},{"title":"句子结构","steps":[{"question":"我们已经知道要用助动词'Do'开头，主语是'you'，那动词'like'需要变化吗？","hint":"助动词'Do'或'Does'后面，动词要用什么形式？","takeaway":"在'Do/Does'引导的一般疑问句中，主要动词必须使用原形。"},{"question":"现在，请把'Do', 'you', 'like', 'your school very much'这些部分按照一般疑问句的语序排列起来。","hint":"语序是：助动词 + 主语 + 动词原形 + ...?","takeaway":"一般疑问句的正确语序是“助动词+主语+动词原形+其他成分?”。"}]}]}},{"number":"4","item_type":"sentence_transform","context_note":"","stem":"They do morning exercises every day. (改为否定句)\nThey _____ _____ morning exercises every day.","options":{},"answer_area_hint":"2 blanks","teaching":{"correct_answer":"don't|do","explanation_md":"此题考查一般现在时陈述句改为否定句。\n1.  原句 “They do morning exercises every day.” 是一般现在时，谓语是实义动词 `do`（做）。\n2.  一般现在时的否定句，需要在主语后根据人称使用 `don't` 或 `doesn't`。\n3.  本句主语 `They` 是第三人称复数，所以用 `don't`。\n4.  `don't` 后面必须跟动词原形。原句中的 `do` 是实义动词，其原形就是 `do`。\n5.  因此，第一个空填 `don't`，第二个空填实义动词 `do`。","knowledge_expansion_md":"### 助动词 do vs. 实义动词 do\n\n在英语中，`do` 是一个非常特殊的词，它既可以作**助动词**，也可以作**实义动词**。\n\n1.  **实义动词 do**：\n    *   意思是“做，干”，有实际的词义。\n    *   例如：`I do my homework.` (我做我的作业。) `She does the housework.` (她做家务。)\n    *   在这些句子中，`do/does` 是句子的主要动词。\n\n2.  **助动词 do**：\n    *   本身没有词义，用于帮助构成否定句和疑问句。\n    *   主要用于一般现在时和一般过去时。\n    *   例如：`You like English.` -> 否定句: `You **do**n't like English.` / 疑问句: `**Do** you like English?`\n\n**易错点**：当实义动词 `do` 所在的句子需要变为否定或疑问时，仍然需要借助助动词 `do`。这就会出现“两个do”并存的情况，第一个是助动词，第二个是实义动词原形。\n*   **肯定句**: `He does his homework.` (这里的 `does` 是实义动词)\n*   **否定句**: `He **doesn't** **do** his homework.` (第一个 `does` 在 `doesn't` 里是助动词，第二个 `do` 是实义动词原形)\n*   **疑问句**: `**Does** he **do** his homework?` (第一个 `Does` 是助动词，第二个 `do` 是实义动词原形)","socratic_tracks":[{"title":"否定句的构成","steps":[{"question":"要把一个现在时的句子变成否定句，通常需要加哪个词？","hint":"比如，“I like apples.” 变成 “I ___ like apples.”","takeaway":"一般现在时的否定句需要借助助动词 do/does 和 not，即 don't 或 doesn't。"},{"question":"这个句子的主语是 'They'，我们应该用 'don't' 还是 'doesn't'？","hint":"主语是第三人称单数（he/she/it）时用 doesn't，其他用 don't。","takeaway":"主语是 'They' 时，否定句使用 'don't'。"}]},{"title":"“两个do”的辨析","steps":[{"question":"在原句 “They do morning exercises” 中，'do' 是什么意思？它是一个有实际意义的动词吗？","hint":"这里的 'do' 和 'do homework' (做作业) 里的 'do' 意思一样。","takeaway":"原句中的 'do' 是一个实义动词，意思是“做”。"},{"question":"在否定词 'don't' 后面，动词应该用什么形式？","hint":"无论是 'don't' 还是 'doesn't'，后面跟的动词都不能变。","takeaway":"助动词 don't/doesn't 后面必须跟动词原形。"},{"question":"那么，实义动词 'do' 的原形是什么？把它放在 'don't' 后面，就得到了答案。","hint":"'do' 本身就是原形。","takeaway":"因此，否定句是 'They don't do...'，第一个是助动词，第二个是实义动词。"}]},{"title":"主谓一致","steps":[{"question":"如果把原句的主语从 'They' 改成 'He'，句子会变成什么？","hint":"主语是第三人称单数时，动词要加 -s 或 -es。","takeaway":"如果主语是 'He'，原句应为 'He does morning exercises every day'。"},{"question":"那么，'He does morning exercises' 的否定句应该怎么说？","hint":"主语是 'He'，否定时应该用 'don't' 还是 'doesn't'？","takeaway":"主语是 'He' 时，否定句要用 'doesn't'。"},{"question":"所以，'He does morning exercises' 的完整否定句是什么？","hint":"He + doesn't + 动词原形...","takeaway":"完整的否定句是 'He doesn't do morning exercises every day'。"}]}]}},{"number":"5","item_type":"sentence_transform","context_note":"","stem":"Amy likes <u>reading and drawing</u>. (对划线部分提问)","options":{},"answer_area_hint":"2 blanks","teaching":{"correct_answer":"What|doing","explanation_md":"此题考查对划线部分提问。\n1.  原句划线部分 `reading and drawing` 是指事物或活动，因此需要用疑问词 `What` 来提问。\n2.  原句 “Amy likes...” 是一般现在时，主语 `Amy` 是第三人称单数，因此构成疑问句需要借助助动词 `Does`。\n3.  特殊疑问句的基本结构是：`疑问词 + 一般疑问句`。所以语序是 `What does Amy...`。\n4.  助动词 `Does` 后面要跟动词原形，所以 `likes` 变为 `like`。\n5.  `like` 后面可以跟动名词 `doing` 来询问喜欢做什么活动，与原句的 `reading and drawing` 形式相呼应。","knowledge_expansion_md":"### 对划线部分提问 (Wh-questions)\n\n对划线部分提问是常见的句型转换题，关键在于三步：\n\n1.  **选择正确的疑问词**：\n    *   对**人**提问：`Who` (主格), `Whom` (宾格), `Whose` (所有格)\n    *   对**事物、活动**提问：`What`\n    *   对**地点**提问：`Where`\n    *   对**时间**提问：`When` / `What time`\n    *   对**原因**提问：`Why`\n    *   对**方式、方法**提问：`How`\n    *   对**颜色、星期**等提问：`What color/day...`\n    *   对**数量、年龄**提问：`How many/much/old...`\n\n2.  **变为一般疑问句语序**：\n    *   将原句去掉划线部分后，剩下的部分改为一般疑问句语序。\n    *   `Amy likes reading and drawing.` -> 去掉划线部分 `Amy likes.` -> 改为一般疑问句 `Does Amy like...?`\n\n3.  **组合疑问词和语序**：\n    *   将第一步的疑问词放在第二步的句子最前面。\n    *   `What` + `does Amy like...?` -> `What does Amy like?`\n\n**关于 `like doing` 和 `like to do`**：\n*   `like doing sth` 通常表示一种长期的、发自内心的享受和爱好。如：`I like swimming.` (我享受游泳这件事)。\n*   `like to do sth` 更多表示一种习惯、选择或“认为这样做是好的”。如：`I like to get up early.` (我习惯早起)。\n*   在对爱好提问时，`What do you like doing?` 和 `What do you like to do?` 很多时候可以互换，但用 `doing` 更侧重于询问兴趣本身。","socratic_tracks":[{"title":"疑问词的选择","steps":[{"question":"划线部分 'reading and drawing' (阅读和绘画) 指的是人、地点还是事物/活动？","hint":"这些是 Amy 喜欢做的事情。","takeaway":"划线部分指的是活动，是“什么事”。"},{"question":"那么，我们应该用哪个疑问词来提问“什么”？是 Who, Where, 还是 What？","hint":"“What”是用来问“什么”的。","takeaway":"对事物或活动提问，应该使用疑问词 'What'。"}]},{"title":"疑问句的语序","steps":[{"question":"原句是现在时，主语是 'Amy'（第三人称单数）。在构成疑问句时，我们需要哪个助动词？","hint":"主语是 he, she, it 或单个人名时，用 Do 还是 Does？","takeaway":"主语是第三人称单数时，疑问句需要使用助动词 'Does'。"},{"question":"使用了助动词 'Does' 之后，原句中的动词 'likes' 应该变成什么形式？","hint":"助动词后面，动词要用最初的、不加任何变化的形式。","takeaway":"助动词 'Does' 后面，动词 'likes' 必须变回原形 'like'。"},{"question":"现在，把疑问词、助动词、主语和动词原形按正确顺序组合起来。","hint":"顺序：疑问词 + 助动词 + 主语 + 动词原形...?","takeaway":"特殊疑问句的正确语序是 'What does Amy like...?'。"}]},{"title":"like doing sth.","steps":[{"question":"原句中，'like' 后面跟的 'reading' 和 'drawing' 是什么形式？","hint":"动词后面加了 -ing。","takeaway":"原句中 'like' 后面跟的是动名词（-ing形式）。"},{"question":"为了让问题更具体，询问喜欢“做什么”，我们可以在 'like' 后面加一个什么词来对应原句的-ing形式？","hint":"这个词本身也是-ing形式，意思是“做”。","takeaway":"我们可以在 'like' 后面加上 'doing'，构成 'like doing'，用来询问喜欢做的活动。"}]}]}}]},{"section_title":"V. 书面表达","section_instruction":"（共20分）","items":[{"number":"1","item_type":"writing","context_note":"","stem":"请根据下面的信息写一篇不少于60词的短文介绍。\n\n下周我们班将举办一场时装表演。老师让我们设计一些衣服和鞋子。我设计了一件外套。这件外套是羊毛做的, 很暖和且看起来很舒服。米莉设计了一条裙子, 是丝绸的, 适合夏天穿。西蒙设计了一双鞋子, 是皮制的。所有的衣服和鞋子看起来都很酷。","options":{},"answer_area_hint":"Lined writing area provided.","teaching":{"correct_answer":"Our class will have a fashion show next week. Our teacher asked us to design some clothes and shoes. I designed a coat. It is made of wool, so it is warm and looks comfortable. Milly designed a dress. It is made of silk and it is suitable for summer. Simon designed a pair of shoes. They are made of leather. All the clothes and shoes look very cool. We are all looking forward to the show.","explanation_md":"这篇短文要求根据中文提示，介绍班级时装秀的准备情况。写作时应注意以下几点：\n1.  **时态正确**：介绍下周的活动应用将来时（will have / is going to have），介绍已经完成的设计可用一般过去时（designed），描述物品的材质和特性应用一般现在时（is / are）。\n2.  **覆盖要点**：确保中文提示中的所有信息点（时装秀、设计任务、我的设计、米莉的设计、西蒙的设计、总体评价）都得到体现。\n3.  **词汇准确**：正确使用关键词，如 `fashion show`（时装表演）、`design`（设计）、`wool`（羊毛）、`silk`（丝绸）、`leather`（皮革）、`comfortable`（舒服的）、`suitable`（适合的）。\n4.  **句子连贯**：使用 `and`, `so` 等简单的连词，使句子之间的逻辑关系更清晰，文章更流畅。\n5.  **结构完整**：文章开头介绍事件，中间分述每个人的设计，结尾进行总结，结构清晰。","knowledge_expansion_md":"### 写作技巧：根据提示信息组织段落\n\n1.  **审题与构思**：\n    *   **抓取关键信息**：明确时间（next week）、地点（our class）、人物（I, Milly, Simon, teacher）、事件（fashion show）、物品（coat, dress, shoes）及其描述。\n    *   **确定时态**：未来计划用将来时，过去动作（设计）用过去时，客观描述用现在时。\n    *   **组织逻辑顺序**：按照“总-分-总”的结构。先总述事件，再分别描述每个设计，最后总结感受。\n\n2.  **核心词汇与句型**：\n    *   **活动**：`have a fashion show`, `hold an activity`\n    *   **材质**：`be made of...` (由……制成，能看出原材料)。例如：`The coat is made of wool.`\n    *   **描述外观/感受**：`look + 形容词` (看起来……)。例如：`It looks comfortable.`\n    *   **描述用途/适宜性**：`be suitable for...` / `be good for...` (适合……)。例如：`It is suitable for summer.`\n    *   **连接词**：使用 `and` (和), `so` (所以), `but` (但是) 等可以使文章更连贯。\n\n3.  **范文亮点**：\n    *   **时态运用准确**：`will have` (将来时), `asked/designed` (过去时), `is/are/looks` (现在时) 运用得当。\n    *   **信息点全面**：涵盖了所有中文提示。\n    *   **结尾升华**：用 `We are all looking forward to the show.` (我们都盼望着这场表演) 来结尾，表达了积极的情感，使文章更完整。","socratic_tracks":[{"title":"时态的运用","steps":[{"question":"“下周我们班将举办”，这件事发生在将来，应该用什么时态？","hint":"表示将要发生的计划，可以用 'will + 动词原形' 或 'be going to'。","takeaway":"描述未来的计划和活动，应使用将来时。"},{"question":"“老师让我们设计”、“我设计了”，这些设计动作已经完成了吗？应该用什么时态？","hint":"这些是发生在写作文之前已经做完的事情。","takeaway":"描述过去发生的动作，应使用一般过去时。"},{"question":"“外套是羊毛做的”、“它很暖和”，这些是在描述物品本身的属性，应该用什么时态？","hint":"描述客观事实或当前的状态，用最基本的时态。","takeaway":"描述人或事物的特征、状态时，应使用一般现在时。"}]},{"title":"篇章结构","steps":[{"question":"一篇文章要有头有尾。我们应该先写什么来让读者马上明白文章的主题？","hint":"开门见山，直接说将要发生什么事。","takeaway":"文章开头应先总述核心事件，即“我们将要举办一场时装秀”。"},{"question":"文章的主体部分应该写些什么内容？如何安排顺序？","hint":"根据提示，依次介绍你、米莉和西蒙的设计。","takeaway":"文章主体部分应按逻辑顺序分点描述，比如按人物顺序介绍每个人的设计细节。"},{"question":"文章的结尾可以写些什么，让它更完整？","hint":"可以写一个总结性的评价，或者表达自己的感受和期待。","takeaway":"结尾部分可以进行总结评价并表达期待，使文章结构完整，情感饱满。"}]},{"title":"核心词汇与句型","steps":[{"question":"如何用英语表达“一件东西是……材质制成的”？","hint":"比如，桌子是木头做的：The table is made ___ wood.","takeaway":"表达“由……制成”时，可以使用句型 'be made of'。"},{"question":"如何描述一个东西“看起来……”怎么样？","hint":"比如，它看起来很漂亮：It ___ beautiful.","takeaway":"描述外观时，可以使用句型 'look + 形容词'。"},{"question":"如何表达“适合于……”？比如“适合夏天穿”。","hint":"可以用 'be good for...' 或者 'be suitable for...'。","takeaway":"表达“适合……”时，可以使用句型 'be suitable for'。"}]}]}}]}],"content_markdown":"# 四川某师大一中（龙泉师一）初2025级新初一入学真卷英语（一）\n\n**满分：100分**\n**时间：60分钟**\n\n## I. 单项选择\n（共20分）\n\n1. Our team lost _____ the team from No. 6 Middle School.\n    A. on\n    B. at\n    C. in\n    D. to\n\n2. I _____, so I didn't know where I was.\n    A. lost\n    B. was lost\n    C. lose\n    D. am lost\n\n3. Miss Smith isn't in the office. She _____ to the classroom.\n    A. has gone\n    B. went\n    C. will go\n    D. goes\n\n4. The students have cleaned the classroom, _____?\n    A. do they\n    B. don't they\n    C. have they\n    D. haven't they\n\n5. We _____ each other since 2002.\n    A. know\n    B. had known\n    C. have known\n    D. knew\n\n6. —Hello, may I speak to Kate?\n—Sorry, she isn't here now. She _____ to Shanghai.\n    A. went\n    B. has been\n    C. has gone\n    D. goes\n\n7. He has never visited Shenzhen, _____?\n    A. has he\n    B. hasn't he\n    C. does he\n    D. doesn't he\n\n8. He is a funny boy. He often makes us _____.\n    A. laugh\n    B. to laugh\n    C. laughing\n    D. to laughing\n\n9. If I find your dog, I _____ you a call.\n    A. give\n    B. gave\n    C. giving\n    D. will give\n\n10. Mr Brown will come to the party if he _____ too busy tomorrow.\n    A. is\n    B. isn't\n    C. will be\n    D. won't be\n\n## II. 完形填空\n（共20分）\nMr King is a very old man. He likes eating dumplings very much. Every Sunday, he goes to a Chinese __1__ and eats dumplings __2__ dinner. Ann is a waitress. She __3__ in the restaurant. Ann often __4__ with Mr King, so they become very good friends. Every time after Mr King __5__ for his dinner, he puts some money on the table. The __6__ is for Ann. It's her tip(小费). One day, Mr King __7__ Ann, \"Do you want a tip or half my lottery (彩票)? prize?\" Ann thinks that __8__ is telling a joke (玩笑). __9__ she laughs and says, \"Half of your prize.\"\nThe next day, Mr King wins the lottery and gets six million dollars. Then he goes to the restaurant and gives Ann the tip — __10__ of his lottery prize!\n\n1. \n    A. office\n    B. library\n    C. restaurant\n    D. school\n\n2. \n    A. at\n    B. for\n    C. with\n    D. in\n\n3. \n    A. works\n    B. does\n    C. finishes\n    D. makes\n\n4. \n    A. thinks\n    B. tells\n    C. says\n    D. talks\n\n5. \n    A. takes\n    B. costs\n    C. spends\n    D. pays\n\n6. \n    A. lottery\n    B. money\n    C. job\n    D. prize\n\n7. \n    A. answers\n    B. shows\n    C. asks\n    D. feels\n\n8. \n    A. she\n    B. he\n    C. they\n    D. we\n\n9. \n    A. And\n    B. But\n    C. So\n    D. Or\n\n10. \n    A. half\n    B. a\n    C. little\n    D. most\n\n## III. 阅读理解\n（根据短文内容，选择正确的答案）（共20分）\n\n**A**\n**Alice, 35**\nI like shopping, but shopping with young children is not an easy thing. I have to look after them while I'm shopping. Shopping with my husband is not fun, either (也). I only go shopping with my husband when I need to buy something for him. If I look at a dress for myself, he says something like \"The dress is too big\" or \"You don't need to buy that now\". I often go shopping with my friends. It's fun. I like shopping alone(单独), too.\n\n**Maria, 26**\nI like shopping very much, but I never go shopping at weekends. There are too many people in the shops. I don't like shopping with other people. It usually takes me a lot of time to choose things because I never buy the first things I see. I always look around other shops to find the best price. I'm good at finding the best deals(商品). I don't like buying food in small shops and street markets(市场). I think food in the supermarket is fresher and cheaper, so I shop there.\n\n1. (Passage A) Both Alice and Maria like shopping _____.\n    A. with friends\n    B. at weekends\n    C. alone\n    D. with her husband\n\n2. (Passage A) When Alice's husband says something like \"You don't need to buy that now\", he means _____.\n    A. the dress is not good quality(质量)\n    B. he loves shopping\n    C. he does not want to wait for his wife\n    D. he likes the deals\n\n3. (Passage A) Why does it take Maria so much time to choose things?\n    A. Because she wants to find the best price.\n    B. Because there are too many people.\n    C. Because she likes looking around.\n    D. Because she doesn't want to buy them at all.\n\n4. (Passage A) From what Maria says, we know _____.\n    A. things are cheaper at weekends\n    B. many people like shopping at weekends\n    C. people don't like shopping at weekends\n    D. food is fresher and cheaper at weekends\n\n5. (Passage A) Maria likes to buy food _____.\n    A. in small shops\n    B. in street markets\n    C. in the supermarket\n    D. A, B and C\n\n**B**\nIt is October 1st. It is Tom's birthday. He sees a card on the table when he comes back home. It says, \"There's a present for you, Tom. Look for it in your room.\" His parents are watching him and smiling(微笑). On his bed he sees a new red box. He thinks, \"My present must be in it.\" He opens it. There is nothing(没什么) but a card in it. He takes it out and reads, \"Dear Tom, I'm your present. My first letter is in the word 'pear', but not in 'bear'. My second letter is in 'pen', but not in 'pan', and you can find my last letter in both 'han' and 'ink'. What am I?\" Tom thinks it over, \"P-E-N! He smiles and says, \"Aha, I know, Mum. But where is it?\" His mother tells him it is in the bag. He finds his present—a nice new pen!\n\"Happy birthday, Tom!\" his parents say.\n\"Thank you, Mum and Dad!\"\n\n6. (Passage B) Tom's birthday is _____.\n    A. in October\n    B. on October\n    C. at October\n    D. of October\n\n7. (Passage B) Tom sees a card _____.\n    A. on the table\n    B. in his bed\n    C. in his bedroom\n    D. in his bag\n\n8. (Passage B) The card in the red box tells him _____.\n    A. what his present is\n    B. where his present is\n    C. who gives him the present\n    D. how his present is\n\n9. (Passage B) Where is the birthday present?\n    A. On the table.\n    B. On the bag.\n    C. On the card.\n    D. On the bed.\n\n10. (Passage B) Tom's present is _____.\n    A. a letter\n    B. three letters\n    C. a card\n    D. a nice new pen\n\n## IV. 句型转换\n（共20分）\n\n1. Daniel knows a lot about computers. (改为一般疑问句, 并作肯定回答)\n_____ Daniel _____ a lot about computers?\n—No, he _____.\n\n2. My cousin wears a red hat today. (改为一般疑问句, 并作肯定回答)\n_____ your cousin _____ a red hat today?\n—Yes, he _____.\n\n3. I like my school very much. (改为一般疑问句)\n_____ you _____ like _____ school very much?\n\n4. They do morning exercises every day. (改为否定句)\nThey _____ _____ morning exercises every day.\n\n5. Amy likes reading and drawing. (对划线部分提问)\n_____ Amy like _____?\n\n## V. 书面表达\n（共20分）\n\n1. 请根据下面的信息写一篇不少于60词的短文介绍。\n\n下周我们班将举办一场时装表演。老师让我们设计一些衣服和鞋子。我设计了一件外套。这件外套是羊毛做的, 很暖和且看起来很舒服。米莉设计了一条裙子, 是丝绸的, 适合夏天穿。西蒙设计了一双鞋子, 是皮制的。所有的衣服和鞋子看起来都很酷。\n\n\n","proofread_notes":"1. **内容修正**：\n    *   移除了第I大题第2、6小题题干中的“老胡妈妈-视频讲解”等与作答无关的营销提示语。\n    *   修正了第V大题书面表达的说明，移除了重复且易产生误导的语句，使指令更清晰。\n2. **格式规范**：\n    *   已按要求统一各题型`item_type`（choice, cloze, reading, sentence_transform, writing）。\n    *   阅读理解部分，全文仅在每篇起始处提供，后续小题使用简短的`context_note`指代，避免重复。\n    *   所有选择题均包含A/B/C/D四个选项，非选择题`options`字段为空对象。\n3.  **原文问题记录**：为保证试卷原貌，以下在原始卷面中发现的问题已在数据中如实保留，提请使用方注意：\n    *   **指令与模板矛盾**：第IV大题第1小题要求“作肯定回答”，但答题模板为否定回答“—No, he _____.”。\n    *   **模板疑似错误**：第IV大题第3小题的填空模板“`_____ you _____ like _____ school very much?`”结构不完整；第5小题的提问模板“`_____ Amy like _____?`”疑似缺少助动词“does”。\n    *   **细节考查**：第III大题第9小题，原文描述礼物“in the bag”，而选项B为“On the bag.”，可能意在考查介词辨析。\n    *   **卷面信息不一致**：据初审报告，试卷标题为“英语（一）”，但页脚为“英语（二）”，存在编号不一致问题。","set_number":11,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_11\\page_021.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_11\\page_022.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":36},{"step":2,"name":"verify","items":36,"check_passed":true,"issues_count":3},{"step":3,"name":"polish","items":36}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T13:46:40.235800+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
  <script>

  let modalWordForTts = "";

  function hasDeepseekKey() {

    return k.length >= 8;

  async function deepseekChat(userContent, maxTokens) {
    if (!hasDeepseekKey()) {

    const r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + INLINE_CFG.deepseekKey,

      }),
    });
    let data = {};
    try { data = await r.json(); } catch (e) { /* ignore */ }
    if (!r.ok) {

      throw new Error(msg);

    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

  }

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",
    "choice",
    "cloze",
    "reading",
    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    const raw = String(stem || "").replace(/\r\n/g, "\n");
    const lines = raw.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    let html = "";
    chunks.forEach((ch) => {
      if (ch.kind === "text") {
        html +=
          "<div class='writing-stem-text'>" + esc(ch.text).replace(/\n/g, "<br>") + "</div>";
      } else {
        html += markdownPipeTableLinesToHtml(ch.lines);
      }
    });
    return html;
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isSectionShardId(t)) return sectionShardLabel(t);

  function showView(name) {

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphs(String(passage || "").trim());
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphsExam(String(passage || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const t = String(fullText || "");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        const singleLetterLn = new RegExp("^\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterLn.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (!isPassageKeyedQuizRow(r2)) break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  /** 大题说明里 (53) Y_____ 式文中空，小题无 stem、无 A–D（首字母填空对话等） */
  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !/\(\d+\)[^_\n\r]*_{3,}/.test(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(m[0]).replace(/\n/g, "<br>");
      }
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {

      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      out += rk
        ? "<span class='exam-blank'>&nbsp;</span>"
        : esc(m[0]).replace(/\n/g, "<br>");

    out += esc(s.slice(li)).replace(/\n/g, "<br>");
