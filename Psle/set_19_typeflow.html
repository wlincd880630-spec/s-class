<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;

  <script type="application/json" id="exam-embed">{"school_or_title":"成都某棠湖外国语学校初2026级新初一入学真卷英语","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟","type_cards":[{"sections":[0],"title":"1. 单项选择","range_text":"第1-15题"},{"sections":[1],"title":"2. 根据所给中文、英文释义及首字母完成句子","range_text":"第16-20题"},{"sections":[2],"title":"3. 根据句意写出所给单词的正确形式","range_text":"第21-25题"},{"sections":[3],"title":"4. 完形填空","range_text":"第26-35题"},{"sections":[4,5],"title":"5. 阅读理解","range_text":"第36-40题（写句子回答问题）；第41-44题（选择）"},{"sections":[6],"title":"6. 书面表达","range_text":"第55题"}]},"sections":[{"section_title":"I. 单项选择。（共15分）","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"What do you think _____ solve the problem?","options":{"A":"you can do","B":"can you do","C":"you can do to","D":"can do to"},"teaching":{"correct_answer":"C","explanation_md":"本题考查的是“特殊疑问词 + do you think + 宾语从句”的结构。在这种结构中，宾语从句需要使用陈述句语序，即主语在前，谓语在后。因此，首先排除B和D选项。剩下的A和C选项中，`to solve the problem` 是动词不定式作目的状语，用来解释“做某事”的目的。完整的表达是 `do something to solve the problem`（做某事来解决问题）。因此，`you can do` 后面需要跟 `to` 来连接目的状语。故正确答案是C。","knowledge_expansion_md":"### 1. 含插入语的特殊疑问句\n当 `think`, `believe`, `suppose`, `guess` 等动词以 `Do you think...?` 的形式出现时，其后的宾语从句如果是特殊疑问句，需要将特殊疑问词（如 `what`, `who`, `where`）提到整个句子的最前面。而从句本身则保持陈述句语序（主语+谓语）。\n- 错误：`Do you think what he should do?`\n- 正确：`What do you think he should do?`\n\n### 2. 动词不定式作目的状语\n动词不定式 `to do sth.` 在句中可以作目的状语，表示“为了做某事”，用以回答 `why` 或 `for what purpose` 的提问。它通常可以置于句首或句末。\n- 例：`He got up early to catch the first bus.` (他早起是为了赶上第一班公交车。)\n- 例：`To learn English well, you need to practice every day.` (为了学好英语，你需要每天练习。)","socratic_tracks":[{"title":"宾语从句的语序","steps":[{"question":"在 `What do you think ...` 这个句型中，`do you think` 像一个插入语，它后面的从句应该用什么样的语序？是像 `Can you do?` 这样的疑问句语序，还是像 `You can do.` 这样的陈述句语序？","hint":"回忆一下老师讲过的宾语从句，比如 `I know who he is.`，这里的 `who he is` 是什么语序？","takeaway":"在疑问词引导的宾语从句中，从句部分必须使用陈述句语序（主语+谓语）。"}]},{"title":"不定式表目的","steps":[{"question":"我们再看句子的后半部分，`...do...solve the problem`。“解决问题”和“做”之间是什么关系？","hint":"“解决问题”是不是“做”这件事的目的？","takeaway":"“解决问题”是“做某事”的目的。"},{"question":"在英语中，当我们想表达“为了做某事”这个目的时，通常用动词的哪种形式来引导？","hint":"比如“我来这里是为了见你”：`I came here ___ see you.` 空格处应该填什么？","takeaway":"动词不定式（to do）常用来在句中作目的状语，表示“为了……”。"}]},{"title":"句子结构拆解","steps":[{"question":"让我们把 `do you think` 这个部分先拿掉，句子想问的核心问题是什么？","hint":"句子可以简化为 `What ... you can do ... solve the problem?`","takeaway":"句子的核心是想问“你能做什么来解决问题”。"},{"question":"在这个核心问题 `What can you do to solve the problem?` 中，`What` 是做什么成分的？","hint":"回答这个问题时，你会说 `I can do something to solve it.`，这里的 `something` 就对应着 `What`。","takeaway":"疑问词 `What` 在这里是动词 `do` 的宾语，只是因为是特殊疑问句而被提前了。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"—He often makes his sister _____, but now he is often made _____ by his sister.","options":{"A":"to cry; cry","B":"cry; to cry","C":"to cry; cry","D":"cry; to cry"},"teaching":{"correct_answer":"B","explanation_md":"本题考查使役动词 `make` 在主动语态和被动语态中的不同用法。\n1.  第一个空：`He often makes his sister _____`。这是主动语态，结构是 `make somebody do something`（使某人做某事），`make` 后面跟宾语，再加上不带 `to` 的动词不定式（即动词原形）。所以第一空填 `cry`。\n2.  第二个空：`he is often made _____ by his sister`。这是被动语态，当 `make sb. do sth.` 变为被动结构 `sb. be made ...` 时，原来被省略的 `to` 需要被还原，结构变为 `be made to do something`（被迫做某事）。所以第二空填 `to cry`。\n综上，正确答案为B。","knowledge_expansion_md":"### 1. 使役动词和感官动词的主动用法\n在主动语态中，一些动词后面需要跟不带 `to` 的动词不定式（动词原形）作宾语补足语。常见的有：\n- **三“使”**：`make`, `let`, `have` (使/让某人做某事)\n- **二“听”**：`hear`, `listen to`\n- **一“感”**：`feel`\n- **半“帮”**：`help` (`help sb. do sth.` 或 `help sb. to do sth.` 均可)\n- **多“看”**：`see`, `watch`, `notice`, `observe`\n\n### 2. 被动语态中的变化\n当上述大部分动词（`let` 除外）的结构变为被动语态时，其后的动词原形必须变为带 `to` 的不定式。\n- 主动：`I saw him enter the building.`\n- 被动：`He was seen to enter the building.`\n- 主动：`The boss made them work 12 hours a day.`\n- 被动：`They were made to work 12 hours a day.`\n\n**特例**：`let` 的被动语态通常用 `be allowed to do` 来表达。例如 `Let me go.` 变为被动时，通常说 `I should be allowed to go.`","socratic_tracks":[{"title":"使役动词的主动用法","steps":[{"question":"看前半句 `He often makes his sister _____`，这里的 `make` 是什么意思？它后面跟的动词有什么格式要求吗？","hint":"`make` 在这里是“让、使”的意思，属于使役动词。想想 `let me go` 里的 `go` 是什么形式？","takeaway":"在主动语态中，使役动词 `make` 后面要跟宾语和不带 `to` 的动词原形。"}]},{"title":"make 的被动语态","steps":[{"question":"看后半句 `he is often made _____`，从 `is made` 这个形式看，这是主动语态还是被动语态？","hint":"`be` 动词 + 动词的过去分词是构成被动语态的标志。","takeaway":"`is made` 是被动语态，表示“被迫……”。"},{"question":"当 `make sb. do sth.` 这个主动结构变成 `sb. is made ...` 这个被动结构时，原来跟在后面的动词原形 `do` 会发生什么变化？","hint":"主动句中省略掉的 `to`，在被动句中是不是要加回来呢？","takeaway":"当 `make` 用于被动语态时，其后必须跟带 `to` 的动词不定式。"}]},{"title":"语境对比理解","steps":[{"question":"请翻译前半句：`He often makes his sister cry.`","hint":"他经常把妹妹弄哭。","takeaway":"前半句中，“他”是动作的发出者，是主动的。"},{"question":"再翻译后半句：`but now he is often made to cry by his sister.`","hint":"但是现在他经常被他妹妹弄哭。","takeaway":"后半句中，“他”是动作的承受者，是被动的。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"The teacher told us that the sun _____ in the east.","options":{"A":"rises","B":"rose","C":"raises","D":"raised"},"teaching":{"correct_answer":"A","explanation_md":"本题考查宾语从句中的时态和动词辨析。\n1.  **时态**：主句动词 `told` 是过去时。但宾语从句 `that the sun _____ in the east` 所陈述的内容是“太阳从东方升起”，这是一个客观真理或自然规律。当宾语从句表达的是客观真理时，其时态不受主句时态的影响，必须使用一般现在时。\n2.  **动词辨析**：`rise` 是不及物动词，意为“升起，上升”，主语自身完成动作，如 `The sun rises.`。`raise` 是及物动词，意为“举起，提高”，后面必须跟宾语，如 `Raise your hand.`。本句中，太阳是自己升起，所以应该用 `rise`。\n3.  **主谓一致**：从句主语 `the sun` 是第三人称单数，因此在一般现在时中，谓语动词 `rise` 需要变为第三人称单数形式 `rises`。","knowledge_expansion_md":"### 1. 宾语从句时态不受主句影响的几种情况\n在间接引语中，当主句动词为过去时，从句时态通常要“向后退一步”，但这几类情况例外：\n- **客观真理/科学事实**：永远用一般现在时。例：`He said that the earth moves around the sun.`\n- **历史事件**：永远用一般过去时。例：`The teacher told us that the First World War broke out in 1914.`\n- **名人名言/格言警句**：通常用一般现在时。例：`She said that practice makes perfect.`\n- **情态动词 `must`, `ought to`, `had better`**：在转述时形式保持不变。\n\n### 2. 易混淆动词：`rise` vs `raise` vs `arise`\n- **`rise` (vi.) - `rose` - `risen`**：上升，升起。主语是动作的发出者。例：`The river has risen by several metres.` (河水上涨了好几米。)\n- **`raise` (vt.) - `raised` - `raised`**：举起，提高；筹集；抚养。后面必须跟宾语。例：`They are raising money for charity.` (他们在为慈善筹款。)\n- **`arise` (vi.) - `arose` - `arisen`**：出现，发生，产生（多指抽象的问题、困难等）。例：`If any problems arise, please let me know.` (如果出现任何问题，请告诉我。)","socratic_tracks":[{"title":"宾语从句的特殊时态","steps":[{"question":"主句 `The teacher told us` 是过去时，按照常规，后面的从句应该用什么时态？","hint":"这涉及到“时态呼应”原则，从句通常也要用过去的某种时态。","takeaway":"一般情况下，主句为过去时，从句也应用相应的过去时态。"},{"question":"但是，从句描述的“太阳从东方升起”是一件什么样的事情？它是一个会改变的事实，还是一个永恒的真理？","hint":"这是一个自然规律，不会因为老师是“昨天”告诉我们而改变。","takeaway":"当宾语从句内容为客观真理时，其时态有特殊规则。"},{"question":"对于客观真理，宾语从句应该使用什么时态，还会受到主句时态的影响吗？","hint":"无论主句是什么时态，真理永远是“现在”的。","takeaway":"当宾语从句是客观真理时，必须使用一般现在时，不受主句时态限制。"}]},{"title":"动词 rise 与 raise 的辨析","steps":[{"question":"句子的意思是“太阳升起”，这个动作是太阳自己完成的，还是被别的物体“举起来”的？","hint":"太阳是自己升起的。","takeaway":"这是一个主语自身完成的动作。"},{"question":"`rise` 和 `raise` 这两个词，哪一个表示“（自己）升起”，哪一个表示“举起（某个东西）”？","hint":"`raise` 后面需要跟一个被举起的东西，比如 `raise your hand`。","takeaway":"`rise` 是不及物动词，意为“升起”；`raise` 是及物动词，意为“举起”。"}]},{"title":"主谓一致的运用","steps":[{"question":"我们已经确定从句要用一般现在时，动词原型是 `rise`。那么从句的主语是什么？","hint":"主语是 `the sun`。","takeaway":"从句的主语是 `the sun`。"},{"question":"主语 `the sun` 是第几人称单数？在一般现在时中，谓语动词需要做什么变化？","hint":"类似 `he`, `she`, `it`，是第三人称单数，动词词末要加 `-s`。","takeaway":"当主语是第三人称单数时，一般现在时的谓语动词需要加-s或-es。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"He lives in a village _____ there are a lot of trees.","options":{"A":"there","B":"where","C":"that","D":"which"},"teaching":{"correct_answer":"B","explanation_md":"本题考查定语从句关系词的选择。首先，分析句子结构，先行词是 `a village`，是一个表示地点的名词。其次，分析空格后的从句 `there are a lot of trees`，这是一个完整的“There be”句型，句子成分齐全，不缺少主语或宾语。这个从句描述的是在村庄里（in the village）发生的情况。因此，我们需要一个关系词，既能指代地点 `a village`，又能在从句中充当状语。关系副词 `where` 正好满足这一要求，它在定语从句中作地点状语，相当于 `in which`。所以，`where` 是正确答案。","knowledge_expansion_md":"### 定语从句关系词选择“两步法”\n1.  **第一步：看先行词**。确定先行词是指人、指物、指时间还是指地点。\n    - `a village` 是指地点。\n2.  **第二步：看从句成分**。将先行词代入从句，分析它在从句中做什么成分。\n    - 将 `a village` 代入从句 `there are a lot of trees`，变成 `There are a lot of trees in the village.`。在这里，`in the village` 作地点状语。\n\n### 关系代词 vs. 关系副词\n- 如果先行词在从句中作**主语**或**宾语**，应使用**关系代词**（`that`, `which`, `who`, `whom`）。\n  - 例：`This is the village that/which we visited last year.` (village在从句中作 `visited` 的宾语)\n- 如果先行词在从句中作**状语**（地点、时间、原因），应使用**关系副词**（`where`, `when`, `why`）。\n  - 例：`This is the village where I grew up.` (village在从句中作地点状语，相当于 `in which`)\n\n**易错点**：不要一看到先行词是地点名词就选 `where`，关键要看它在从句中充当什么成分。","socratic_tracks":[{"title":"识别定语从句","steps":[{"question":"句子中 `_____ there are a lot of trees` 这一部分是用来干什么的？","hint":"它是不是在描述和限定前面的 `a village` 是一个什么样的村庄？","takeaway":"这是一个定语从句，用来修饰先行词 `a village`。"}]},{"title":"关系词成分分析","steps":[{"question":"我们来看从句 `there are a lot of trees`。这个句子本身完整吗？缺不缺主语或宾语？","hint":"`There be` 句型是一个完整的句子结构。","takeaway":"从句本身结构完整，不缺少主语或宾语。"},{"question":"如果把先行词 `a village` 放到从句中，它应该充当什么成分？是 `a village are trees` 还是 `there are trees in a village`？","hint":"肯定是“在村庄里有很多树”。","takeaway":"先行词在从句中充当的是地点状语。"},{"question":"既然先行词在从句中作地点状语，我们应该选择哪个关系词来引导这个定语从句？","hint":"哪个关系词是专门用来在定语从句中作地点状语的？","takeaway":"关系副词 `where` 用于在定语从句中作地点状语。"}]},{"title":"辨析 `where` 和 `which/that`","steps":[{"question":"为什么这个句子不能用 `which` 或者 `that`？","hint":"`which` 和 `that` 是关系代词，它们在从句中必须充当什么成分？","takeaway":"`which` 和 `that` 必须在从句中作主语或宾语，但本题从句不缺这两种成分。"},{"question":"我们能把这个句子改写成用 `which` 的形式吗？比如 `He lives in a village in _____ there are a lot of trees.`，这时空格里该填什么？","hint":"介词 `in` 后面需要一个宾语，`which` 可以作介词宾语。","takeaway":"`where` 引导的定语从句通常可以改写为 `介词 + which` 的形式。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"—He _____ Alice for ten years.","options":{"A":"married to","B":"has married to","C":"has married","D":"has been married to"},"teaching":{"correct_answer":"D","explanation_md":"本题考查现在完成时态和动词 `marry` 的用法。句中的时间状语 `for ten years`（持续十年）表明动作或状态从过去开始，一直持续到现在，因此需要使用现在完成时。`marry` 作为“结婚”的动作是瞬间发生的，不能与表示一段时间的 `for ten years` 连用。而 `be married to sb.` 表示“与某人结婚”的婚姻状态，这个状态是可以持续的。因此，描述“已经结婚十年”这个状态，需要用 `be married to` 的现在完成时形式，即 `has been married to`。所以正确答案是D。","knowledge_expansion_md":"### 瞬间动词与持续性动词/状态\n\n在现在完成时中，需要特别注意动词的类型：\n1.  **持续性动词**：如 `live`, `study`, `work`。这类动词可以与 `for + 一段时间` 或 `since + 时间点` 连用，表示动作的持续。\n    *   例：`I have lived here for five years.`（我在这里住了五年了。）\n2.  **瞬间动词（或称终止性动词）**：如 `buy`, `die`, `arrive`, `marry`, `join`。这类动词表示的动作瞬间完成，不能表示持续。因此，它们在现在完成时中通常不与 `for + 一段时间` 连用，而是表示“动作已经完成”或“动作完成到现在有多久了”。\n    *   错误用法：`He has died for ten years.`\n    *   正确用法：要表达“他去世十年了”这个状态，需要转换为相应的状态表达：`He has been dead for ten years.`\n\n### `marry` 的用法总结\n*   **主动语态（及物动词）**：`marry sb.` 意为“与某人结婚”。\n    *   例：`Jack married Jill last year.`\n*   **系表结构（表示状态）**：`be married to sb.` 意为“与某人是夫妻关系”。\n    *   例：`Jack is married to Jill.`\n    *   当这个状态需要用现在完成时表达持续时间时，就变成 `have/has been married to sb.`。","socratic_tracks":[{"title":"现在完成时与时间状语","steps":[{"question":"看到句子里的 `for ten years`（十年了），你首先会想到什么时态？","hint":"哪个时态常用来表示一个从过去开始并持续到现在的动作或状态？","takeaway":"时间状语 `for + 一段时间` 是现在完成时的典型标志。"},{"question":"既然是现在完成时，为什么 C 选项 `has married` 不对呢？“结婚”这个动作本身可以持续十年吗？","hint":"想一想，“结婚”是一个瞬间完成的动作，还是一个可以一直进行下去的动作？","takeaway":"瞬间性动词（如 marry）的现在完成时不能与表示“持续一段时间”的状语连用，而需要转换为状态的表达。"}]},{"title":"动词 `marry` 的用法","steps":[{"question":"在主动语态中，我们说“他和爱丽丝结婚”，应该是 `He married Alice` 还是 `He married to Alice`？","hint":"`marry` 是一个及物动词，后面需要介词吗？","takeaway":"`marry` 作为及物动词，后面直接跟结婚对象，即 `marry sb.`。"},{"question":"那什么时候我们会用到 `married to` 这个结构呢？它表达的是一个动作还是一个状态？","hint":"想一想如何用英语形容“某人是已婚的”。`He is married.` 那么“他和某人结婚了”的状态呢？","takeaway":"`be married to sb.` 是一个固定搭配，用来描述“与某人结婚”的婚姻状态。"},{"question":"结合第一点的时态知识，如何表达“和爱丽丝结婚的状态已经持续了十年”？","hint":"请把 `be married to` 这个表示状态的短语变成现在完成时。","takeaway":"表示状态的 `be married to` 变成现在完成时就是 `has been married to`。"}]},{"title":"选项辨析","steps":[{"question":"我们来分析一下 B 选项 `has married to` 为什么是错误的？","hint":"回顾一下 `marry` 作主动词时的用法，它后面需要加 `to` 吗？","takeaway":"`has married to` 混淆了主动用法和状态用法，在语法上是错误的结构。"},{"question":"对比 C 选项 `has married` 和 D 选项 `has been married to`，它们强调的重点有什么不同？哪个更符合题意？","hint":"一个强调“完成了一个动作”，另一个强调“一个状态的持续”。题目中的 `for ten years` 更适合描述哪一个？","takeaway":"描述一个持续了十年的情况，应该用表示状态的结构 `has been married to`，而不是表示瞬间动作的 `has married`。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"We need fifteen more people _____ our team to do the job.","options":{"A":"but","B":"except","C":"as well","D":"besides"},"teaching":{"correct_answer":"D","explanation_md":"本题考查介词的词义辨析。句意为：“除了我们现有的团队，我们还需要15个人来完成这项工作。”这里需要一个表示“在...之外，还...”的词，即在原有基础上进行补充和增加。`besides` 作为介词，意为“除……之外（还包括）”，符合句意。`but` 是转折连词，意思不符。`except` 作介词时意为“除了（不包括）”，表示排除，与句意相反。`as well` 是副词，意为“也”，通常放在句末，不能像介词一样连接两个名词短语。","knowledge_expansion_md":"### 辨析 `besides`, `except`, `except for`\n\n这组词都意为“除了”，但用法和含义有细微差别，是常见的易错点。\n\n1.  **`besides`** (prep./adv.)：表示“**除此之外，还……**”，是**包含性**的，相当于 `in addition to`。\n    *   例：`Besides Chinese, she can also speak English.` (除了中文，她还会说英语。=> 两者都会)\n\n2.  **`except`** (prep.)：表示“**把……除外**”，是**排除性**的，强调所说情况不适用于 `except` 之后的人或物。通常用于谈论同类事物。\n    *   例：`Everyone passed the exam except Tom.` (除了汤姆，所有人都通过了考试。=> 汤姆没通过)\n\n3.  **`except for`** (prep.)：也表示“**把……除外**”，但常用于对前面所说的**整体情况进行局部修正或补充说明**，其后的内容与前面谈论的不是同类事物，或者是指整体中的一个细节。\n    *   例：`Your essay is good except for a few spelling mistakes.` (你的文章很好，只是有几个拼写错误。=> “文章”和“拼写错误”不是同类)\n\n### `as well` 与 `as well as`\n*   **`as well`** 是副词，意为 `too` 或 `also`，通常置于句末。\n    *   例：`He plays the piano, and he sings as well.`\n*   **`as well as`** 是一个连词或介词短语，意为“和；也”，可以连接两个对等的成分。\n    *   例：`She is a talented singer as well as a great actress.`","socratic_tracks":[{"title":"逻辑关系：加法还是减法？","steps":[{"question":"根据句意“We need fifteen more people ... our team to do the job”，我们是想在现有团队的基础上“增加”人手，还是“减去”人手？","hint":"“more people”意味着需要更多的人。","takeaway":"句子的逻辑是在现有团队的基础上增加人手，这是一个“加法”关系。"},{"question":"在 `besides` 和 `except` 这两个词中，哪一个表示“加法”（除此之外还有），哪一个表示“减法”（排除掉）？","hint":"想一个例子：`I like all fruits except apples.` (我喜欢除了苹果外的所有水果) vs `Besides apples, I also like bananas.` (除了苹果，我也喜欢香蕉)。","takeaway":"`besides` 表示包含，是“加法”；`except` 表示排除，是“减法”。"}]},{"title":"词性与句子结构","steps":[{"question":"观察空格前后的部分 `... people _____ our team ...`，我们需要一个什么词性的词来连接这两个名词短语？","hint":"能在名词或代词前，表示其与句子其他成分关系的词是什么词？","takeaway":"我们需要一个介词来连接 `people` 和 `our team`，并说明它们之间的关系。"},{"question":"选项 C `as well` 为什么不符合这个结构要求？它是什么词性？","hint":"`as well` 通常放在句子的哪个位置？它能像 `in`, `on`, `at` 那样用在名词前面吗？","takeaway":"`as well` 是副词，通常放在句末，不能作介词使用。"}]},{"title":"选项辨析","steps":[{"question":"选项 A `but` 是什么意思？用在这里合适吗？","hint":"`but` 通常表示转折，比如 `He is rich, but he is not happy.`","takeaway":"`but` 是连词，表示转折关系，与本句的“补充说明”逻辑不符。"},{"question":"如果把 `besides` 换成 `except`，句子 `We need fifteen more people except our team...` 意思会变成什么？通顺吗？","hint":"`except our team` 意味着“不包括我们团队”。","takeaway":"使用 `except` 会使句意变成“除了我们团队，我们还需要15个人”，逻辑不通，与“more”的含义矛盾。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"They won't allow us _____ at this beach.","options":{"A":"swimming","B":"to swim","C":"swim","D":"swam"},"teaching":{"correct_answer":"B","explanation_md":"本题考查动词 `allow` 的固定用法。`allow` 意为“允许”，其常见句型是 `allow somebody to do something`，表示“允许某人做某事”。在这个结构中，`somebody` 是宾语，后面的 `to do something` 是动词不定式作宾语补足语，说明宾语 `somebody` 所做的动作。题干中 `us` 是宾语，因此后面应该跟动词不定式 `to swim`。所以正确答案是B。","knowledge_expansion_md":"### 动词 + 宾语 + 宾语补足语\n\n英语中有一类动词，后面需要跟一个宾语，还需要一个宾语补足语来说明宾语的情况或动作，构成 `Verb + Object + Object Complement` 结构。宾补的形式有多种，常见的是动词不定式。\n\n1.  **跟带 `to` 的不定式作宾补的动词**：这是最常见的一类，`allow` 就属于其中。其他常用词有：\n    *   `ask`, `tell`, `want`, `wish`, `advise`, `encourage`, `force`, `invite`, `order`, `persuade`, `remind`, `teach`, `warn`, `permit`, `forbid` 等。\n    *   例：`My teacher told me to finish my homework.`\n\n2.  **跟不带 `to` 的不定式（原形动词）作宾补的动词**：主要是使役动词和感官动词。\n    *   使役动词：`let`, `make`, `have` (注意：`get sb. to do sth.`)。\n        *   例：`Don't let him go.`\n    *   感官动词：`see`, `hear`, `watch`, `notice`, `feel` 等（注意：这些词后也可跟 `-ing` 形式，表示动作正在进行）。\n        *   例：`I saw him cross the street.`\n\n3.  **`allow` 的特殊用法**：\n    *   `allow sb. to do sth.` (有宾语 `sb.`)\n    *   `allow doing sth.` (无宾语 `sb.`，后跟动名词)\n    *   例：`They don't allow us to smoke here.` = `They don't allow smoking here.`","socratic_tracks":[{"title":"`allow` 的核心用法","steps":[{"question":"当你想表达“允许某人做某事”时，动词 `allow` 后面通常跟什么样的结构？","hint":"回忆一个包含 `allow` 的例句，比如“妈妈允许我去看电影”。","takeaway":"`allow` 的核心句型是 `allow somebody to do something`。"},{"question":"在这道题中，`somebody` 是谁？`do something` 里的 `do` 对应哪个词？","hint":"句中的 `us` 是宾语，`swim` 是要做的动作。","takeaway":"将 `us` 和 `swim` 套入 `allow sb. to do sth.` 的公式中，即可得到正确答案。"}]},{"title":"宾补形式大比拼","steps":[{"question":"你知道哪些动词后面跟“某人做某事”时，用的是动词原形（不带 to 的不定式）吗？","hint":"想想“让他走”（Let him go）和“让他做作业”（Make him do his homework）中的动词。","takeaway":"使役动词 `let`, `make`, `have` 和感官动词 `see`, `hear` 等后面跟动词原形作宾补。"},{"question":"`allow` 和 `let` 意思相近，都表示“允许”，但用法上有什么关键区别？","hint":"比较 `Let me go.` 和 `Allow me ...`。","takeaway":"`let` 后面跟动词原形（`let sb. do`），而 `allow` 后面跟带 `to` 的不定式（`allow sb. to do`）。"}]},{"title":"`allow` 的不同句式","steps":[{"question":"如果句子里没有 `us`，只是说“他们不允许在这里游泳”，句子该怎么说？","hint":"当 `allow` 后面没有具体的人做宾语时，它后面可以跟什么形式的动词？","takeaway":"当 `allow` 后面没有宾语 `sb.` 时，可以直接跟动名词 `doing sth.`，即 `allow swimming`。"},{"question":"比较 `allow us to swim` 和 `allow swimming`，你发现了什么规律？","hint":"观察宾语 `us` 的有无，对后面动词形式的影响。","takeaway":"有宾语用 `to do`，无宾语用 `doing`，这是 `allow` 用法的一个重要特点。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"Is this factory _____ you visited last week?","options":{"A":"that","B":"where","C":"the one","D":"in which"},"teaching":{"correct_answer":"C","explanation_md":"本题考查的是“主系表结构”和“定语从句”的结合。这个疑问句的基本结构是 `Is A B?`（A是B吗？）。句中的主语A是 `this factory`，而空格及其后面的部分共同构成表语B。为了避免重复说 `Is this factory the factory that you visited...?`，我们用代词 `one` 来代替名词 `factory`。因此，完整的表语部分是 `the one (that) you visited last week`，意为“你上周参观的那一个（工厂）”。其中 `(that)` 是引导定语从句的关系代词，在从句中作 `visited` 的宾语，可以省略。选项C `the one` 恰好能充当这个表语的核心词，使句子结构完整，逻辑通顺。","knowledge_expansion_md":"### 代词 `one`/`ones` 的用法\n\n`one` (单数) 和 `ones` (复数) 是代词，常用来避免重复前提中已经提到过的可数名词。\n*   **`a/an + 形容词 + one`**: 泛指同类中的一个。例：`I need a new pen. I want a blue one.`\n*   **`the + (形容词) + one`**: 特指某一个。常与定语从句或介词短语连用，明确指出是哪一个。本题就属于这种情况。\n    *   例：`Which bike is yours? The red one.`\n    *   例：`I prefer the book that you recommended.` = `I prefer the one that you recommended.`\n\n### 定语从句中的关系词选择\n\n*   **关系代词 (`that`, `which`, `who`)**: 在从句中作主语或宾语。当先行词是物时用 `that/which`。当关系代词在从句中作宾语时，常常可以省略。\n    *   本题完整形式：`Is this factory the one which/that you visited last week?` (`which/that` 作 `visited` 的宾语，可省略)\n*   **关系副词 (`where`, `when`, `why`)**: 在从句中作状语。\n    *   `where` (地点状语) = `in/at/on which`\n    *   `when` (时间状语) = `in/at/on which`\n*   **`visit` 的用法**: `visit` 是及物动词，直接跟宾语（地点或人），如 `visit the factory`。因此，在定语从句中，`factory` 应该是 `visited` 的宾语，需要用关系代词 `which/that`，而不是关系副词 `where`。如果动词是 `work`，则可以说 `...the factory where you work` (因为 `work in the factory`)。","socratic_tracks":[{"title":"分析句子主干","steps":[{"question":"这个问句 `Is this factory ...?` 的基本句型是什么？","hint":"这是一个 `be` 动词开头的一般疑问句，它的陈述句形式是 `This factory is ...`。","takeaway":"这是一个主系表结构 `Subject + be + Predicative` 的疑问形式 `Be + Subject + Predicative?`。"},{"question":"在这个结构中，主语是 `this factory`，那么空格处需要填入一个什么成分来使句子完整？","hint":"就像 `Is this a book?` 中的 `a book` 一样，这个成分叫什么？","takeaway":"句子缺少表语，我们需要一个名词或代词来充当表语。"},{"question":"哪个选项可以充当名词或代词，并指代前面提到的 `factory`？","hint":"`that` 和 `in which` 是连词/关系词，`where` 是副词/关系词。","takeaway":"只有 `the one` 是代词短语，可以作表语，指代 `the factory`。"}]},{"title":"定语从句关系词辨析","steps":[{"question":"我们来看 `you visited last week` 这个从句。动词 `visit` 是及物动词还是不及物动词？我们是说 `visit the factory` 还是 `visit in the factory`？","hint":"参观某个地方，后面直接加地点名词即可。","takeaway":"`visit` 是及物动词，后面直接跟宾语，所以是 `visit the factory`。"},{"question":"既然 `the factory` 在从句中是作 `visited` 的宾语，那么引导这个从句应该用关系代词（如 `that/which`）还是关系副词（如 `where`）？","hint":"`where` 在从句中作地点状语，相当于 `in/at which`。这里缺少的是状语还是宾语？","takeaway":"从句中缺少宾语，所以不能用关系副词 `where`，而应该用关系代词 `that` 或 `which`。"},{"question":"为什么正确答案 `the one` 后面没有 `that` 或 `which` 呢？","hint":"定语从句中，在什么情况下关系代词可以被省略？","takeaway":"当关系代词在定语从句中作宾语时，通常可以省略。"}]},{"title":"错误选项排除","steps":[{"question":"为什么 A 选项 `that` 不对？`Is this factory that you visited...?` 这个句子错在哪里？","hint":"这个句子有主语 `this factory`，但有表语吗？`that you visited` 是什么成分？","takeaway":"句子缺少表语。`that you visited` 只是一个修饰 `factory` 的定语从句，句子结构不完整。"},{"question":"为什么 B 选项 `where` 和 D 选项 `in which` 也不对？","hint":"从两个角度思考：第一，它们能作表语吗？第二，它们用在 `visit` 后面合适吗？","takeaway":"这两个选项都不能作表语导致句子结构残缺，并且它们都表示地点状语，与及物动词 `visit` 的用法不匹配。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"The reason _____ he was absent from the meeting was _____ his car broke down on the way.","options":{"A":"that; because","B":"why; that","C":"that; that","D":"for; that"},"teaching":{"correct_answer":"B","explanation_md":"本题考查定语从句和表语从句的引导词。第一个空是定语从句，修饰名词 `reason`，应用关系副词 `why` 或关系代词 `that` 引导。第二个空是表语从句，跟在系动词 `was` 后面，说明 `The reason` 的具体内容。`The reason is/was that...` 是一个固定句型，用 `that` 引导表语从句。`The reason is because...` 的用法在正式文体中被认为是错误的，因为它在语义上有所重复（“原因是因为...”）。综合来看，选项B `why; that` 是最规范、最正确的搭配。","knowledge_expansion_md":"### 知识点：`The reason is that...` 句型\n\n1.  **定语从句部分**：`The reason why/that...`\n    *   当 `reason` 作先行词时，其后的定语从句通常由关系副词 `why` 引导，`why` 在从句中作原因状语。\n    *   在很多情况下，`that` 也可以用来引导这个定语从句，`that` 在此作关系代词。\n    *   `why` 和 `that` 常常可以省略一个，例如：`The reason (why/that) he was late is that his car broke down.`\n\n2.  **表语从句部分**：`...is that...`\n    *   这是本题的核心考点。在 `The reason is...` 结构中，`is` 是系动词，其后需要跟一个表语。如果这个表语是一个句子，那么就是表语从句。\n    *   `that` 在这里是引导表语从句的连词，没有实际意义，只起连接作用，但不能省略。\n    *   **易错点**：避免使用 `The reason is because...`。虽然在口语中很常见，但在书面语和语法考试中，这被认为是冗余和不规范的。`because` 引导的是原因状语从句，而这里需要的是名词性的表语从句。","socratic_tracks":[{"title":"定语从句的引导词","steps":[{"question":"句子的第一部分 “The reason _____ he was absent from the meeting” 是什么成分？它在修饰哪个词？","hint":"它是一个从句，跟在名词 “The reason” 后面，用来解释这个“原因”具体是什么。","takeaway":"这是一个定语从句，用来修饰名词 “The reason”。"},{"question":"修饰 “reason” 的定语从句，通常用哪个词来引导？","hint":"想一想我们问原因时用什么疑问词？","takeaway":"修饰原因（reason）的定语从句通常由关系副词 `why` 引导，有时也可以用 `that` 替代。"}]},{"title":"表语从句的引导词","steps":[{"question":"句子的主干是 “The reason was...”，那么 “was” 后面的部分是什么句子成分？","hint":"“was” 是一个系动词，系动词后面跟的成分叫什么？","takeaway":"“was” 后面的部分是表语，这里是一个从句作表语，所以叫表语从句。"},{"question":"“The reason is/was...” 这个句型后面跟一个表语从句，应该用哪个词来引导这个从句？","hint":"我们常说“原因是……”，这个“是”后面的内容需要一个词来连接，这个词本身没有实际意义，只起连接作用。","takeaway":"“The reason is/was that...” 是一个固定句型，用 `that` 引导表语从句，`that` 在此没有词义，只起连接作用。"}]},{"title":"辨析 `that` 和 `because`","steps":[{"question":"为什么第二个空不能填 `because`？“The reason was because...” 听起来好像也对。","hint":"`because` 引导的是什么类型的从句？它通常回答什么问题？","takeaway":"`because` 引导的是原因状语从句，而这里需要的是一个名词性的表语从句来解释 `reason` 的内容。"},{"question":"从语义上讲，“The reason is because...” 有什么问题吗？","hint":"“reason” 本身就是“原因”的意思，“because” 也是“因为”的意思，把它们放在一起 “The reason is because...” 会不会有点重复？","takeaway":"“The reason is because...” 在语义上有重复之嫌（“原因是因为……”），在正式文体中应避免使用，而用 “The reason is that...”。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"Is the river _____ through that town very large?","options":{"A":"which flows","B":"flows","C":"that flowing","D":"whose flows"},"teaching":{"correct_answer":"A","explanation_md":"这个句子是一个一般疑问句，其主干是 “Is the river very large?”。中间的空白部分是用来修饰主语 “the river” 的定语成分。选项 A “which flows” 构成了一个完整的定语从句 “which flows through that town”（流过那个城镇的河），其中 `which` 指代 `the river` 并在从句中作主语，语法结构正确。选项 B “flows” 是动词，不能直接放在名词后作定语，会导致句子出现 `Is` 和 `flows` 两个谓语动词。选项 C “that flowing” 结构错误，`that` 引导定语从句时，从句中需要完整的谓语动词，而不是分词 `flowing`。选项 D “whose flows” 逻辑不通。","knowledge_expansion_md":"### 知识点：后置定语的形式\n\n修饰名词的定语可以放在名词后面，称为后置定语。常见的后置定语形式有：\n\n1.  **定语从句**：由关系代词（that, which, who, whom, whose）或关系副词（when, where, why）引导的从句。\n    *   例：`The river which flows through that town is very large.` (本题考点)\n\n2.  **分词短语**：\n    *   **现在分词短语**：表示主动或正在进行的动作。通常可以看作是主动语态定语从句的简化形式。\n        *   例：`The river flowing through that town is very large.` (由 `The river which flows...` 简化而来)\n    *   **过去分词短语**：表示被动或已完成的动作。\n        *   例：`The letter written by Tom is on the desk.` (由 `The letter which was written by Tom...` 简化而来)\n\n3.  **不定式短语**：\n    *   例：`He is always the first one to arrive.`\n\n4.  **介词短语**：\n    *   例：`The book on the table is mine.`\n\n本题考查的是未经简化的定语从句形式，需要学生准确识别句子结构，避免将动词原形或错误的分词结构当作定语。","socratic_tracks":[{"title":"识别句子主干","steps":[{"question":"如果我们把中间的空白部分拿掉，这个问句的主干是什么？","hint":"这是一个 “Is...?” 开头的一般疑问句，主语是 “the river”。","takeaway":"句子的主干是 “Is the river very large?”（这条河很大吗？）。"},{"question":"那么，填入空白处的部分应该起到什么作用？","hint":"它位于名词 “the river” 之后，应该是用来描述或限定这条河的。","takeaway":"空白处需要填入一个定语成分，用来修饰主语 “the river”。"}]},{"title":"定语从句的构成","steps":[{"question":"我们想用一个从句来修饰 “the river”，告诉别人是“流过城镇”的那条河。这个从句应该怎么说？","hint":"先行词是 “the river”（物），从句中的动词是 “flows”（流淌），我们需要一个关系词来连接。","takeaway":"我们可以用关系代词 `which` 或 `that` 来指代 “the river”，并引导这个从句。"},{"question":"那么，“which flows through that town” 和 “that flowing through that town” 哪个是正确的从句结构？","hint":"从句内部也需要有主谓结构。`which` 可以在从句里作主语，但 `flowing` 是分词，不是谓语动词。","takeaway":"定语从句需要有完整的“关系词+主谓”结构，所以 `which flows...` 是正确的，而 `that flowing...` 结构错误。"}]},{"title":"动词与分词作定语的区别","steps":[{"question":"为什么不能直接填动词 `flows` (选项 B)？“the river flows...” 看起来很顺。","hint":"一个简单句里能有几个谓语动词？这个句子已经有 `Is` 了。","takeaway":"一个简单句只能有一个谓语动词，“Is the river flows...” 造成了 “is” 和 “flows” 两个谓语，是错误的。"},{"question":"那我们能用 `flowing` 来修饰 `river` 吗？比如 “the river flowing...”？","hint":"是的，现在分词短语可以作后置定语。那么选项 C “that flowing” 为什么不对？","takeaway":"`flowing` 本身就可以作定语，不需要再加 `that`；`that` 引导的是从句，后面需要跟谓语动词，而不是分词。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"The teacher told me that the students I wanted to see were seen _____ football on the playground just now.","options":{"A":"playing","B":"to be playing","C":"play","D":"to play"},"teaching":{"correct_answer":"A","explanation_md":"本题考查感官动词 `see` 的被动语态用法。主动语态中，`see sb. do sth.` (看见某人做某事) 或 `see sb. doing sth.` (看见某人正在做某事)。当变为被动语态时，`sb.` 成为主语，结构相应变为 `sb. is/are seen to do sth.` 或 `sb. is/are seen doing sth.`。其中，原形动词 `do` 变为不定式 `to do`，而现在分词 `doing` 保持不变。根据句意“学生们刚才被看到正在操场上踢足球”，强调的是动作正在进行，因此使用现在分词 `playing` 最为贴切。","knowledge_expansion_md":"### 知识点：感官动词与使役动词的被动语态\n\n1.  **主动语态结构**：\n    *   感官动词 `see/watch/hear/notice/feel sb. do/doing sth.`\n    *   使役动词 `make/let/have sb. do sth.`\n    *   `do` (动词原形) 强调动作的全过程或事实；`doing` (现在分词) 强调动作正在进行。\n\n2.  **变为被动语态时的规则**：\n    *   `see/hear/make sb. do sth.` → `sb. be seen/heard/made to do sth.` (动词原形 `do` 前面必须加上 `to`)\n    *   `see/hear/feel sb. doing sth.` → `sb. be seen/heard/felt doing sth.` (现在分词 `doing` 保持不变)\n    *   `let sb. do sth.` 的被动语态比较特殊，通常用 `sb. be allowed to do sth.` 来表达。\n\n3.  **例句**：\n    *   Active: I saw him **cross** the street. → Passive: He was seen **to cross** the street.\n    *   Active: I saw him **crossing** the street. → Passive: He was seen **crossing** the street. (本题考点)\n    *   Active: The teacher made us **clean** the classroom. → Passive: We were made **to clean** the classroom.","socratic_tracks":[{"title":"主动语态与被动语态","steps":[{"question":"句中 “the students ... were seen...” 是主动语态还是被动语态？是谁在“看”？","hint":"“were seen” 是 “be + 动词过去分词” 的形式，表示“被看见”。句中没有说出是谁看的。","takeaway":"这是被动语态，主语 “the students” 是动作 “see” 的承受者。"},{"question":"那么，它的主动语态应该是什么样的？比如，“我看见学生们...” 应该怎么说？","hint":"“看见某人做某事” 的结构是 `see somebody do/doing something`。","takeaway":"主动语态是 `(Someone) saw the students play/playing football`。"}]},{"title":"感官动词的宾补变化","steps":[{"question":"在主动句 `saw the students _____ football` 中，空白处可以填 `play` 或 `playing`。它们有什么区别？","hint":"一个是动词原形，一个是现在分词。一个强调整个动作，一个强调动作正在进行。","takeaway":"`play` 强调看到了踢球的整个过程或事实，而 `playing` 强调看到时他们正在踢。"},{"question":"当这个结构变成被动语态 `the students were seen _____ football` 时，`play` 和 `playing` 会发生什么变化？","hint":"这是一个固定规则：动词原形需要变回带 `to` 的不定式，而现在分词保持不变。","takeaway":"动词原形 `play` 变为 `to play`，而现在分词 `playing` 保持不变。"}]},{"title":"根据语境选择最佳形式","steps":[{"question":"题目中有 “just now”（刚才），这个时间状语暗示了什么？","hint":"“刚才”通常描述一个刚刚发生的、持续时间不长的动作场景。","takeaway":"“just now” 暗示了动作在当时正在进行。"},{"question":"那么，在 `were seen to play` (被看见踢了球) 和 `were seen playing` (被看见正在踢球) 中，哪个更能体现“正在进行”的场景？","hint":"`playing` 这个-ing形式本身就含有“正在进行”的意思。","takeaway":"`were seen playing` 更好地描述了“刚才看到他们正在踢球”的生动场景，因此是最佳选项。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"The red rose is the only one _____ I real like.","options":{"A":"which","B":"who","C":"that","D":"whom"},"teaching":{"correct_answer":"C","explanation_md":"本题考查定语从句中关系代词的选择。从句 “_____ I real(ly) like” 修饰先行词 “the only one”。先行词 “one” 指代 “rose”（玫瑰），是物，因此关系代词应用 `which` 或 `that`。然而，这是一个特殊规则的考查点：当先行词被 `the only`, `the very`, `the last` 或序数词、形容词最高级等词修饰时，其后的定语从句引导词通常只能用 `that`，而不能用 `which`。因此，正确答案是 `that`。","knowledge_expansion_md":"### 知识点：定语从句中关系代词 `that` 的特殊用法\n\n在限制性定语从句中，虽然 `that` 和 `which` 很多时候可以互换（指物时），但在以下几种情况下，必须或优先使用 `that`：\n\n1.  **先行词为不定代词**：当先行词是 `all`, `everything`, `nothing`, `anything`, `little`, `much`, `none` 等不定代词时。\n    *   例：`Is this all that you have?`\n\n2.  **先行词被形容词最高级或序数词修饰**：\n    *   例：`This is the best movie that I have ever seen.`\n    *   例：`The first thing that you should do is to call the police.`\n\n3.  **先行词被 `the only`, `the very`, `the last` 修饰**：(本题考点)\n    *   例：`He is the only person that understands me.`\n\n4.  **先行词既有人又有物**：\n    *   例：`They talked about the people and the places that they had visited.`\n\n**只能用 `which` 的情况**：与 `that` 相对，在非限制性定语从句（即关系代词前有逗号）或介词后，则不能用 `that`，必须用 `which`（指物）或 `whom`（指人）。\n*   例：`The book, which I bought yesterday, is very interesting.`\n*   例：`This is the house in which I lived.`","socratic_tracks":[{"title":"定语从句关系词的基本选择","steps":[{"question":"这个定语从句 “_____ I real like” 是在修饰哪个词？","hint":"它紧跟在 “the only one” 后面，是用来限定 “one” 的。","takeaway":"从句修饰的是先行词 “the only one”。"},{"question":"“one” 在这里指代的是人还是物？根据这个，我们可以排除哪些选项？","hint":"“one” 指代的是 “The red rose”（红玫瑰），是物。`who` 和 `whom` 用来指人。","takeaway":"先行词指物，所以我们应该在 `which` 和 `that` 中选择，可以排除 `who` 和 `whom`。"}]},{"title":"`that` 的特殊用法","steps":[{"question":"在剩下的 `which` 和 `that` 中，我们应该怎么选？它们有什么区别吗？","hint":"通常情况下，指物时它们可以互换，但有些特殊情况只能用 `that`。","takeaway":"在某些特定情况下，我们必须或者优先使用 `that`。"},{"question":"观察一下先行词 “the only one”，它有什么特别之处吗？这是否属于必须用 `that` 的情况？","hint":"先行词被 “the only” 这个词修饰了。想一想，当先行词被 `the only`, `the last`, 形容词最高级等词修饰时，有什么规则？","takeaway":"当先行词被 `the only` 修饰时，关系代词必须用 `that`。"}]},{"title":"关系词在从句中的成分","steps":[{"question":"在从句 “that I really like” 中，关系代词 `that` 充当什么成分？","hint":"把 `that` 指代的 “the only one” (rose) 放回从句中，句子是 “I really like (the rose)”。","takeaway":"`that` 在从句中作动词 `like` 的宾语。"},{"question":"当关系代词在从句中作宾语时，它有时可以被省略。这个句子可以写成 “The red rose is the only one I really like” 吗？","hint":"是的，在限制性定语从句中，作宾语的关系代词（that/which/whom）可以省略。","takeaway":"在本句中，`that` 作为宾语可以省略，但题目要求选择填空，所以必须选出 `that`。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"All the apples _____ fell down were eaten by the pigs.","options":{"A":"those","B":"which","C":"what","D":"that"},"teaching":{"correct_answer":"D","explanation_md":"本题考查定语从句中关系代词的选择。从句“_____ fell down”是用来修饰先行词“All the apples”的。由于先行词指物，关系代词可以用 which 或 that。但是，当先行词被 all, any, every, no, the only, a superlative (最高级) 等词修饰时，通常优先使用 that。因此，正确答案是 D。","knowledge_expansion_md":"### 定语从句关系词辨析\n\n1.  **关系代词**: `who` (指人，作主语/宾语), `whom` (指人，作宾语), `whose` (指人或物，作定语), `which` (指物，作主语/宾语), `that` (指人或物，作主语/宾语)。\n2.  **`that` 的优先使用场景**：\n    *   先行词被 `all`, `any`, `every`, `no`, `some`, `little`, `much` 等不定代词修饰时。\n    *   先行词被 `the only`, `the very`, `the last` 等词修饰时。\n    *   先行词被序数词或形容词最高级修饰时。\n    *   先行词既有人又有物时。\n3.  **只能用 `which` 的场景**：\n    *   在非限制性定语从句中（即从句与主句用逗号隔开）。\n    *   当关系代词在介词后面时。\n4.  **`what` 的用法**：`what` 不能引导定语从句，它引导名词性从句，本身相当于 `the thing(s) that/which`，自带先行词。例如：`What he said is true.` (他说的话是真的。)","socratic_tracks":[{"title":"定语从句识别","steps":[{"question":"在这个句子中，“_____ fell down”这部分起什么作用？它是在描述什么？","hint":"它是不是在详细说明前面的“苹果”怎么样了？","takeaway":"“_____ fell down”是一个定语从句，用来修饰和限定前面的名词“apples”。"},{"question":"既然是修饰名词的从句，我们需要用什么类型的词来引导它，并把它和“apples”联系起来？","hint":"这种词既能连接句子，又在从句中充当成分，比如主语或宾语。","takeaway":"我们需要用关系代词（如 which, that）来引导定语从句。"}]},{"title":"关系代词辨析","steps":[{"question":"定语从句的先行词“apples”指的是“人”还是“物”？根据这个，我们可以用哪些关系代词？","hint":"指物时，常用的关系代词是 w 开头和 t 开头的两个。","takeaway":"先行词“apples”指物，所以关系代词可以用 which 或 that。"},{"question":"观察先行词“apples”前面，有一个修饰词“All”。在有“All”修饰先行词的情况下，我们更倾向于用 which 还是 that？","hint":"回忆一下，在哪些特殊情况下，我们必须或者最好用 that？","takeaway":"当先行词被 all, any, the only, 形容词最高级等词修饰时，我们优先使用 that。"}]},{"title":"错误选项排除","steps":[{"question":"为什么不能选 C 选项“what”？","hint":"what 引导的从句叫什么从句？它本身是否包含了一个名词在内？","takeaway":"what 引导名词性从句，相当于“the thing(s) that”，它自带先行词，而句中已有先行词“apples”，所以不能用 what。"},{"question":"为什么不能选 A 选项“those”？“those apples”不是一个很常见的说法吗？","hint":"“those”是一个指示代词，它具备连接两个句子的功能吗？","takeaway":"“those”不能作为关系代词来引导定语从句，无法连接主句和从句。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"Don't forget the day _____ you were received into the Youth League.","options":{"A":"when","B":"that","C":"at which","D":"where"},"teaching":{"correct_answer":"A","explanation_md":"本题考查定语从句。从句“_____ you were received into the Youth League”修饰先行词“the day”。先行词“the day”表示时间，且关系词在从句中作时间状语（在你入团的那一天），因此需要使用关系副词 `when`。`when` 在此相当于 `on which`。选项 C `at which` 介词使用错误，修饰“天”应该用 `on`。选项 D `where` 指代地点，不符合题意。选项 B `that` 虽然在某些情况下可以代替 `when`，但 `when` 是指代时间最明确、最标准的用法。","knowledge_expansion_md":"### 关系副词引导的定语从句\n\n关系副词 `when`, `where`, `why` 用于引导定语从句，在从句中充当状语。\n\n1.  **`when`**: 先行词是表示时间的名词（如 `time`, `day`, `year`, `moment`），`when` 在从句中作时间状语。\n    *   `I'll never forget the day when I first met you.`\n    *   `when` = `介词 + which` (介词根据先行词搭配，如 `on that day` -> `on which`)\n\n2.  **`where`**: 先行词是表示地点的名词（如 `place`, `house`, `city`, `school`），`where` 在从句中作地点状语。\n    *   `This is the school where I studied for six years.`\n    *   `where` = `介词 + which` (如 `in that school` -> `in which`)\n\n3.  **`why`**: 先行词通常是 `the reason`，`why` 在从句中作原因状语。\n    *   `He didn't tell me the reason why he was angry.`\n    *   `why` = `for which`\n\n**易错点**：注意区分关系副词和关系代词。判断方法是看关系词在从句中充当什么成分。如果充当主语、宾语或定语，就用关系代词；如果充当状语，就用关系副词。","socratic_tracks":[{"title":"识别先行词","steps":[{"question":"句子中，空格后面的从句是用来修饰哪一个词的？","hint":"“你入团”是用来描述哪一个“......”？","takeaway":"从句“you were received into the Youth League”是用来修饰先行词“the day”的。"},{"question":"先行词“the day”表达的是时间、地点还是原因？","hint":"“day”是“天”的意思。","takeaway":"先行词“the day”表示时间。"}]},{"title":"选择关系词","steps":[{"question":"当先行词表示时间，并且关系词在从句中作状语时，我们应该用哪个关系副词？","hint":"询问时间的特殊疑问词是什么？它也可以作为关系副词。","takeaway":"我们应该用关系副词 when 来引导修饰时间名词的定语从句。"},{"question":"我们能把这个句子拆成两个句子吗？比如“Don't forget the day.”和“You were received into the Youth League ___ the day.”，空格处应该填什么介词？","hint":"我们常说“在那一天”，英文表达是...？","takeaway":"介词应该用 on，所以 when 在这里就等于 on which。"}]},{"title":"辨析易混选项","steps":[{"question":"为什么选项 C “at which” 是错误的？它也是“介词+which”的形式。","hint":"我们说 “at that day” 还是 “on that day”？","takeaway":"表示“在某一天”时，介词习惯用 on，所以正确的形式是 on which，而不是 at which。"},{"question":"为什么选项 D “where” 是错误的？","hint":"where 用来修饰表示什么概念的先行词？","takeaway":"where 用来修饰表示地点的先行词，而“the day”表示时间。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"I prefer _____ at home to _____ outside.","options":{"A":"staying; playing","B":"to stay; play","C":"staying; play","D":"to stay; playing"},"teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配 `prefer...to...` 的用法。`prefer doing sth to doing sth` 是一个常用句型，意为“宁愿做某事而不愿做某事”或“与做B事相比，更喜欢做A事”。在这个结构中，`prefer` 和 `to` 后面都必须跟动名词（动词的-ing形式）。因此，第一个空应填 `staying`，第二个空应填 `playing`。选项 A 完全符合这个结构。","knowledge_expansion_md":"### `prefer` 的用法总结\n\n`prefer` 意为“更喜欢”，其后可接不同形式，表达细微差别：\n\n1.  **`prefer sth to sth`**: 比较两个名词，意为“与B相比更喜欢A”。\n    *   `I prefer dogs to cats.` (比起猫，我更喜欢狗。)\n\n2.  **`prefer doing sth to doing sth`**: 比较两个动作，意为“宁愿做A而不愿做B”。注意此处的 `to` 是介词，所以后面跟动名词 `doing`。\n    *   `She prefers reading books to watching movies.` (与看电影相比，她更喜欢读书。)\n\n3.  **`prefer to do sth`**: 表示“宁愿/更想做某事”。\n    *   `I prefer to walk.` (我宁愿走路。)\n\n4.  **`prefer to do sth rather than do sth`**: 比较两个动作，意为“宁愿做A而不愿做B”。注意 `rather than` 后面跟动词原形 `do`。\n    *   `He prefers to stay at home rather than go shopping.` (他宁愿待在家里也不愿去购物。)\n\n**易错点**：考生常常混淆 `prefer doing to doing` 和 `prefer to do rather than do`。关键在于区分 `to` 是介词还是不定式符号，以及 `rather than` 后面跟动词原形。","socratic_tracks":[{"title":"核心结构识别","steps":[{"question":"看到句子中的 `prefer` 和 `to`，你首先想到了哪个表示“比较喜欢”的固定搭配？","hint":"这个搭配是 `prefer A to B`，表示“喜欢A胜过B”。","takeaway":"看到 `prefer ... to ...`，应该想到 `prefer A to B` 的核心结构。"},{"question":"在这个结构中，如果 A 和 B 是动作（动词），它们应该使用什么形式？","hint":"这里的 `to` 是一个介词，类似于 `look forward to` 中的 `to`。","takeaway":"在 `prefer doing sth to doing sth` 结构中，`to` 是介词，所以前后两个动作都要用动名词（-ing）形式。"}]},{"title":"平行结构原则","steps":[{"question":"在 `prefer A to B` 这个比较结构中，A 和 B 的形式需要保持一致吗？","hint":"比如，我们能比较“苹果”和“去跑步”吗？通常我们会比较同类事物。","takeaway":"是的，为了保持句子结构的平行和平衡，A 和 B 的形式应该保持一致。"},{"question":"现在看 C 和 D 选项，`staying; play` 和 `to stay; playing`，它们的形式一致吗？","hint":"一个是 -ing 形式，一个是原形；一个是不定式，一个是 -ing 形式。","takeaway":"C 和 D 选项中 to 前后的动词形式不一致，违反了平行结构原则，因此是错误的。"}]},{"title":"`prefer` 的其他用法","steps":[{"question":"除了 `prefer doing to doing`，`prefer` 还有没有其他表示“宁愿做...”的用法？","hint":"如果 `prefer` 后面直接跟一个动作，应该用什么形式？","takeaway":"`prefer` 后面也可以直接跟不定式，即 `prefer to do sth`。"},{"question":"如果我们想用 `prefer to do` 来表达“宁愿做A而不愿做B”，应该用哪个词组来连接第二个动作，而不是用介词 `to`？","hint":"这个词组是 `r_____ than`。","takeaway":"表达“宁愿做A而不愿做B”时，也可以用 `prefer to do A rather than do B`。"},{"question":"在 `prefer to do sth rather than do sth` 这个结构中，`rather than` 后面的动词用的是什么形式？","hint":"注意观察，是 `do` 还是 `to do` 还是 `doing`？","takeaway":"在 `prefer to do... rather than...` 结构中，`rather than` 后面要跟动词原形。"}]}]}}]},{"section_title":"II. 根据所给中文、英文释义及首字母等提示完成句子。（共10分）","section_instruction":"","items":[{"number":"16","item_type":"fill_blank","context_note":"","stem":"How many _____ (猴子) does the zoo have?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"monkeys","explanation_md":"本题考查名词的复数形式。句首的 “How many” 意为“多少”，用于提问可数名词的数量，其后必须跟可数名词的复数形式。中文提示“猴子”的英文单词是 “monkey”。根据名词变复数的规则，以“元音字母+y”结尾的名词，直接在词尾加 “-s”。因此，“monkey”的复数形式是 “monkeys”。","knowledge_expansion_md":"### 名词复数规则要点\n\n1.  **一般情况**：直接加 `-s`。如：`book` -> `books`。\n2.  **以 s, x, ch, sh 结尾**：加 `-es`。如：`bus` -> `buses`, `box` -> `boxes`, `watch` -> `watches`。\n3.  **以“辅音字母 + y”结尾**：变 `y` 为 `i` 再加 `-es`。如：`baby` -> `babies`, `city` -> `cities`。\n4.  **以“元音字母 + y”结尾**：直接加 `-s`。如：`boy` -> `boys`, `monkey` -> `monkeys`, `toy` -> `toys`。\n5.  **以 f 或 fe 结尾**：多数变 `f/fe` 为 `v` 再加 `-es`。如：`leaf` -> `leaves`, `wife` -> `wives`。但有例外，如 `roof` -> `roofs`。\n6.  **不规则变化**：需要特殊记忆。如：`man` -> `men`, `woman` -> `women`, `child` -> `children`, `foot` -> `feet`, `mouse` -> `mice`, `sheep` -> `sheep` (单复数同形)。\n\n### `How many` vs. `How much`\n*   `How many` + 可数名词复数: `How many students are there?`\n*   `How much` + 不可数名词: `How much water do you need?`","socratic_tracks":[{"title":"提问词的功能","steps":[{"question":"看到句子开头的 “How many”，你觉得它对后面的名词有什么要求？","hint":"“How many” 是用来问“多少个”的，那么它后面的名词应该是可数的还是不可数的？","takeaway":"“How many” 用来提问可数名词的数量。"},{"question":"当我们问“多少个苹果”时，我们会说 “How many apple” 还是 “How many apples”？","hint":"既然是问“多少个”，数量通常不止一个。","takeaway":"“How many” 后面必须跟可数名词的复数形式。"}]},{"title":"名词复数规则","steps":[{"question":"“猴子”的英文单词是什么？","hint":"这是一个常见的动物单词，以 m 开头。","takeaway":"“猴子”的英文是 monkey。"},{"question":"“monkey”这个词是以字母 y 结尾的，它的复数应该怎么变？是变 y 为 i 加 -es 吗？","hint":"观察一下字母 y 前面是元音字母（a, e, i, o, u）还是辅音字母？","takeaway":"因为 “monkey” 以“元音字母e + y”结尾，所以它的复数形式是直接在词尾加 -s，变成 “monkeys”。"}]},{"title":"易混淆点辨析","steps":[{"question":"如果我想问动物园有多少“水”，我应该用 “How many” 还是 “How much”？","hint":"“水 (water)” 是可以一个一个数的吗？","takeaway":"我们应该用 “How much”，因为 “water” 是不可数名词。"},{"question":"那么提问“多少水”的句子中，“water”这个词需要变成复数吗？","hint":"不可数名词有复数形式吗？","takeaway":"不可数名词没有复数形式，所以在使用 “How much” 提问时，后面的名词保持原形。"}]}]}},{"number":"17","item_type":"fill_blank","context_note":"","stem":"He listens to the teacher as _____ (仔细) as his cousin.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"carefully","explanation_md":"本题考查副词的用法以及 `as...as` 同级比较结构。句中 `listens` 是一个动词，需要用副词来修饰，说明听讲的方式。中文提示“仔细”对应的副词是 `carefully`。`as...as` 结构意为“和……一样”，中间需要填入形容词或副词的原级。因为是修饰动词 `listens`，所以应填入副词 `carefully`。整个句子的意思是“他听老师讲课和他表哥一样仔细”。","knowledge_expansion_md":"### `as...as` 同级比较结构\n\n`as...as` 结构用于表示两者在某一方面程度相同，意为“和……一样……”。\n\n1.  **基本结构**：`主语 + 谓语 + as + 形容词/副词原级 + as + 比较对象`。\n\n2.  **词性选择**：\n    *   如果中间的词是用来修饰名词或说明主语的状态，通常用**形容词**。这常常出现在系动词（如 `be`, `look`, `seem`）之后。\n        *   例：She is **as tall as** her mother. (她和她妈妈一样高。)\n    *   如果中间的词是用来修饰动词，说明动作发生的方式，则用**副词**。\n        *   例：He runs **as fast as** a deer. (他跑得像鹿一样快。)\n        *   本题中，`carefully` 就是修饰动词 `listens` 的，所以用副词。\n\n3.  **常见易错点**：\n    *   混淆形容词和副词。例如，错将 `He runs as quick as me.` 写成 `He runs as quickly as me.` 才是正确的。\n    *   特殊词形：`good` (形容词) vs `well` (副词) -> He is as **good** as you. / He plays basketball as **well** as you.","socratic_tracks":[{"title":"语法结构：as...as","steps":[{"question":"句子里有一个 `as ... as` 结构，你知道这个结构是用来做什么的吗？","hint":"想想 \"He is as tall as me.\" 这句话的意思。","takeaway":"`as ... as` 结构用于表示两者在某方面程度相同，即“和……一样……”。"},{"question":"在这个结构中，`as` 和 `as` 中间应该填什么词性的词呢？","hint":"这个词是用来修-饰动词 `listens` 的，还是修饰主语 `He` 的？","takeaway":"修饰动词 `listens` 需要用副词。"}]},{"title":"词性辨析：形容词与副词","steps":[{"question":"中文提示是“仔细”，对应的英文形容词是什么？","hint":"小心、细心。","takeaway":"“仔细”的形容词是 `careful`。"},{"question":"那么，我们需要一个形容词还是副词来填空呢？为什么？","hint":"空格前的词是动词 `listens`，我们需要一个词来描述听讲这个动作是“怎样”的。","takeaway":"修饰动词需要用副词，所以要用 `careful` 的副词形式。"},{"question":"`careful` 对应的副词是什么？","hint":"大部分形容词变副词是在词尾加 `-ly`。","takeaway":"`careful` 的副词是 `carefully`。"}]},{"title":"句子成分分析","steps":[{"question":"这个句子的主要动作（谓语动词）是什么？","hint":"他对他老师做了什么？","takeaway":"句子的谓语动词是 `listens`。"},{"question":"我们需要填的词是来描述谁或者什么的？是描述主语 `He`，还是描述动作 `listens`？","hint":"是说“他”是仔细的，还是说他“听讲”是仔细的？","takeaway":"这个词是用来描述动作 `listens` 的方式，作状语。"},{"question":"在英语中，用来修饰动词、说明动作发生方式的词叫什么？","hint":"形容词修饰名词，那什么词修饰动词呢？","takeaway":"修饰动词的词是副词。"}]}]}},{"number":"18","item_type":"fill_blank","context_note":"","stem":"The old man lives in a _____ (not quiet) street, so he can't sleep well every day.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"noisy","explanation_md":"本题考查形容词的词义辨析和上下文逻辑推断。空格位于冠词 `a` 和名词 `street` 之间，因此需要填入一个形容词来修饰 `street`。括号中的提示 `(not quiet)` 意为“不安静的”，其反义词是 `noisy`（吵闹的）。后半句 `so he can't sleep well`（所以他每天都睡不好）提供了因果关系的线索，进一步证实街道是“吵闹的”。","knowledge_expansion_md":"### 1. 反义词（Antonyms）\n\n英语学习中，掌握常用反义词对阅读理解和词汇运用非常有帮助。本题 `quiet` (安静的) 的反义词是 `noisy` (吵闹的)。\n\n**常见形容词反义词：**\n*   `big` - `small` (大 - 小)\n*   `long` - `short` (长 - 短)\n*   `hot` - `cold` (热 - 冷)\n*   `happy` - `sad` (开心 - 伤心)\n*   `easy` - `difficult`/`hard` (简单 - 困难)\n*   `new` - `old` (新 - 旧)\n*   `clean` - `dirty` (干净 - 肮脏)\n\n### 2. 逻辑连词 `so`\n\n`so` 是一个表示因果关系的连词，意为“所以”，用来引导结果。其结构为：**原因, so + 结果**。\n*   例：It was raining, **so** I took an umbrella. (天在下雨，所以我带了把伞。)\n*   在本题中，“The old man lives in a noisy street”是原因，“he can't sleep well”是结果。","socratic_tracks":[{"title":"词义推断：反义词","steps":[{"question":"括号里的提示是 `(not quiet)`，这是什么意思？","hint":"`not` 表示否定。","takeaway":"`(not quiet)` 的意思就是“不安静的”。"},{"question":"一个“不安静的”街道，用一个单词来形容，应该是什么样的？","hint":"街上有很多声音，很吵。","takeaway":"“不安静的”就是“吵闹的”，对应的英文单词是 `noisy`。"}]},{"title":"逻辑关系：因果","steps":[{"question":"句子中间有一个词 `so`，它连接了两个部分，你知道 `so` 表示什么关系吗？","hint":"比如句子：\"It's raining, so I will take an umbrella.\"","takeaway":"`so` 表示因果关系，前面是原因，后面是结果。"},{"question":"句子的后半部分说“他每天都睡不好”，这可能是什么原因造成的？","hint":"什么样的居住环境会影响睡眠？","takeaway":"吵闹的环境会影响睡眠。"},{"question":"那么，为了让整个句子的逻辑通顺，空格里应该填一个表示什么意思的词来形容街道？","hint":"这个词要能解释为什么他睡不好。","takeaway":"空格里应该填一个表示“吵闹的”词，即 `noisy`。"}]},{"title":"词性分析：形容词","steps":[{"question":"空格后面的单词是 `street`，它是一个什么词？","hint":"我们可以说 a street, two streets...","takeaway":"`street` 是一个名词，意思是“街道”。"},{"question":"在名词前面，用来描述或修饰名词的词，通常是什么词性？","hint":"例如：a beautiful girl, a red apple.","takeaway":"通常用形容词来修饰名词。"},{"question":"`quiet` 是一个形容词，它的反义词 `noisy` 是什么词性？","hint":"我们可以说 a noisy class。","takeaway":"`noisy` 也是一个形容词，可以用来修饰名词 `street`。"}]}]}},{"number":"19","item_type":"fill_blank","context_note":"","stem":"W_____ (the fourth day in a week) is my busiest day.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"Wednesday","explanation_md":"本题考查星期的英文表达及书写规范。题目提示首字母为 \"W\"，英文释义为 \"the fourth day in a week\"（一周中的第四天）。在一些将星期日（Sunday）视为一周第一天的文化习惯中，第四天正好是星期三。结合首字母 \"W\"，可以确定答案是 `Wednesday`。`Wednesday` 位于句首，且本身是专有名词，所以首字母必须大写。","knowledge_expansion_md":"### 1. 星期（Days of the Week）\n\n*   `Monday` (星期一)\n*   `Tuesday` (星期二)\n*   `Wednesday` (星期三)\n*   `Thursday` (星期四)\n*   `Friday` (星期五)\n*   `Saturday` (星期六)\n*   `Sunday` (星期日)\n\n### 2. 专有名词大写规则\n\n在英语中，以下几类词属于专有名词，无论在句子中处于什么位置，其首字母都必须大写：\n*   **星期**：`Monday`, `Friday`\n*   **月份**：`January`, `December`\n*   **人名/姓氏**：`Tom`, `Smith`\n*   **国家/城市/地名**：`China`, `Chengdu`, `the Great Wall`\n*   **语言/国籍**：`English`, `Chinese`\n*   **节日**：`Christmas`, `Spring Festival`\n\n### 3. 文化背景\n\n关于一周从哪天开始，存在文化差异。国际标准（ISO 8601）和大多数欧洲国家将星期一作为一周的开始。但在美国、加拿大等国家，传统上将星期日视为一周的开始。本题的提示 \"the fourth day\" 显然是基于后一种习惯，即：Sunday (1st), Monday (2nd), Tuesday (3rd), **Wednesday (4th)**。","socratic_tracks":[{"title":"词汇知识：星期","steps":[{"question":"题目给出的首字母是 \"W\"，你能想到哪些以 \"W\" 开头的表示星期的单词？","hint":"一周七天里只有一个。","takeaway":"以 \"W\" 开头的星期单词只有 `Wednesday`。"},{"question":"`Wednesday` 的中文意思是什么？","hint":"它在 Tuesday 之后，Thursday 之前。","takeaway":"`Wednesday` 的意思是星期三。"}]},{"title":"逻辑与文化：一周的第几天","steps":[{"question":"题目提示说这是 \"the fourth day in a week\"（一周的第四天）。如果一周从星期一开始算，第四天是星期几？","hint":"Monday, Tuesday, Wednesday, ...?","takeaway":"如果从星期一开始，第四天是星期四 `Thursday`。"},{"question":"但是题目的首字母提示是 \"W\"，这和我们刚才推断的 `Thursday` 不符。这说明什么？","hint":"有没有可能一周不是从星期一开始的？","takeaway":"这说明出题人可能默认一周是从星期日开始计算的。"},{"question":"如果一周从星期日 (Sunday) 开始算，那么第四天是星期几？","hint":"Sunday, Monday, Tuesday, ...?","takeaway":"从星期日开始算，第四天就是星期三 `Wednesday`，这与首字母 \"W\" 吻合。"}]},{"title":"书写规范：大写","steps":[{"question":"`Wednesday` 这个词放在句子的开头，它的首字母应该怎么写？","hint":"位于句首的单词，其首字母需要...","takeaway":"位于句首的单词，首字母必须大写。"},{"question":"除了放在句首，`Wednesday` 这个词在句子中间时，首字母需要大写吗？为什么？","hint":"想想 `I`, `China`, `May` 这些词的特点。","takeaway":"`Wednesday` 是专有名词，无论在句子中什么位置，首字母都必须大写。"}]}]}},{"number":"20","item_type":"fill_blank","context_note":"","stem":"My ideal school starts at 9:00 a. m. and f_____ at 3:00 p. m.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"finishes","explanation_md":"本句描述理想学校的作息时间，考查动词的正确形式。句子主语是 `My ideal school`，为第三人称单数。句子描述的是一个常规性、事实性的情况，应使用一般现在时。连词 `and` 连接了两个并列的谓语动词，`starts` 和 `f_____`。根据并列结构一致的原则，既然第一个动词是 `starts`（第三人称单数形式），那么第二个动词也应使用第三人称单数形式。根据首字母 `f` 和句意“结束”，可知动词为 `finish`。`finish` 以 `-sh` 结尾，其第三人称单数形式为 `finishes`。","knowledge_expansion_md":"### 1. 一般现在时第三人称单数\n\n当主语是第三人称单数（如 `he`, `she`, `it`, `my school`, `Tom`）时，一般现在时中的谓语动词需要进行相应变化，通常称为“三单”形式。\n\n**变化规则：**\n*   **一般情况**：在动词词尾加 `-s`，如 `start` -> `starts`, `work` -> `works`。\n*   **以 -s, -x, -sh, -ch 结尾**：加 `-es`，读 /ɪz/，如 `finish` -> `finishes`, `watch` -> `watches`, `go` -> `goes`。\n*   **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-es`，如 `study` -> `studies`, `cry` -> `cries`。\n*   **特殊变化**：`have` -> `has`。\n\n### 2. 并列连词 `and`\n\n`and` 用于连接语法上对等的成分，这些成分在形式上必须保持一致。这被称为平行结构（Parallel Structure）。\n*   **连接两个动词**：He **sings** and **dances** well. (主语是 `He`，两个动词都用三单形式)\n*   **连接两个不定式**：I want **to read** a book and **listen** to some music. (第二个 `to` 可以省略)\n*   **连接两个形容词**：The girl is **clever** and **beautiful**.","socratic_tracks":[{"title":"动词时态与形式","steps":[{"question":"这个句子的主语是什么？是单数还是复数？","hint":"主语是 `My ideal school`。","takeaway":"主语是 `My ideal school`，是第三人称单数。"},{"question":"句子描述的是一个理想中的、常规的情况，应该用什么时态？","hint":"描述事实、习惯或常规安排用什么时态？","takeaway":"应该使用一般现在时。"},{"question":"在一般现在时中，当主语是第三人称单数时，动词有什么变化？","hint":"看看句子中已有的动词 `starts`。","takeaway":"动词需要变成第三人称单数形式，通常是加 `-s` 或 `-es`。"}]},{"title":"句子结构：并列谓语","steps":[{"question":"句中有一个连词 `and`，它在这里连接了什么？","hint":"看看 `and` 前后的词 `starts` 和 `f_____`。","takeaway":"`and` 连接了两个并列的动词，构成并列谓语。"},{"question":"在并列结构中，`and` 前后的成分在形式上通常有什么要求？","hint":"比如句子：`He likes singing and dancing.`","takeaway":"`and` 连接的并列成分在形式上应该保持一致。"},{"question":"既然 `and` 前面的动词是 `starts` (第三人称单数形式)，那么 `and` 后面的动词 `finish` 应该用什么形式？","hint":"两个动词的主语都是 `My ideal school`。","takeaway":"`finish` 也应该使用第三人称单数形式 `finishes`。"}]},{"title":"词义与拼写","steps":[{"question":"学校在上午9点 `starts` (开始)，那么在下午3点应该是做什么？","hint":"与“开始”相对的词是什么？","takeaway":"与“开始”相对的是“结束”。"},{"question":"表示“结束”的动词，以 \"f\" 开头，你能想到哪个词？","hint":"比如：I finished my homework.","takeaway":"这个词是 `finish`。"},{"question":"`finish` 这个词的第三人称单数形式怎么写？","hint":"它以 `-sh` 结尾，是加 `-s` 还是 `-es`？","takeaway":"以 `-sh` 结尾的动词，其第三人称单数形式需要加 `-es`，所以是 `finishes`。"}]}]}}]},{"section_title":"III. 根据句意写出所给单词的正确形式。（共10分）","section_instruction":"","items":[{"number":"21","item_type":"fill_blank","context_note":"","stem":"Look! One of the children _____ (swim) in the lake.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"is swimming","explanation_md":"句首的 “Look!” 是现在进行时的标志词，表示动作正在发生，其基本结构是 “be + 动词-ing形式”。本句的主语是 “One of the children”（孩子们中的一个），其核心词是 “One”，是单数概念。因此，be动词应使用第三人称单数形式 “is”。动词 “swim” 需变为-ing形式，根据“重读闭音节且末尾只有一个辅音字母的动词，需要双写该辅音字母再加-ing”的规则，变为 “swimming”。综上，正确答案为 “is swimming”。","knowledge_expansion_md":"**1. 主谓一致中的 “one of + a/the + 复数名词” 结构**\n- 在这种结构中，句子的真正主语是 “one”，而不是后面的复数名词。因此，谓语动词必须使用单数形式。\n- 示例：`One of my best friends lives in Beijing.` (我的一个最好的朋友住在北京。)\n\n**2. 现在进行时 (Present Continuous Tense)**\n- 表示说话时刻正在发生或进行的动作。常与 “Look!”, “Listen!”, “now”, “at the moment” 等标志词连用。\n- 结构：主语 + be (am/is/are) + 动词-ing形式。\n\n**3. 动词-ing形式的变化规则**\n- 一般情况：直接在动词后加-ing (e.g., `work` -> `working`)。\n- 以不发音的e结尾：去e加-ing (e.g., `make` -> `making`)。\n- 以重读闭音节结尾（即“辅音+元音+辅音”结构）：双写末尾的辅音字母，再加-ing (e.g., `run` -> `running`, `swim` -> `swimming`)。\n- 以ie结尾：变ie为y，再加-ing (e.g., `lie` -> `lying`)。","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"看到句子开头的 “Look!”，你觉得这个动作是发生在什么时候？是过去、现在还是将来？","hint":"当你对别人说“快看！”的时候，通常是想让他看一个正在发生的事情。","takeaway":"句首的 “Look!” 是一个强烈的信号，提示我们句子描述的是正在发生的动作，应使用现在进行时。"},{"question":"现在进行时的基本结构是什么？","hint":"它由一个助动词和一个动词的特殊形式构成。","takeaway":"现在进行时的结构是 “be动词 + 动词-ing形式”。"}]},{"title":"确定主语单复数","steps":[{"question":"这个句子的主语是 “the children” 还是 “One of the children”？是谁在游泳？","hint":"句子想表达的是“所有孩子”都在游泳，还是“其中一个孩子”在游泳？","takeaway":"句子的主语是 “One of the children”，意思是“孩子们中的一个”。"},{"question":"既然主语是“一个孩子”，那么这个主语是单数还是复数？","hint":"“One” 这个词本身是单数还是复数？","takeaway":"主语的核心词是 “One”，所以主语是单数。"},{"question":"对于单数主语，在现在进行时中，be动词应该用 am, is, 还是 are？","hint":"回忆一下 “I am”, “He/She/It is”, “We/You/They are”。","takeaway":"第三人称单数主语搭配的be动词是 “is”。"}]},{"title":"动词-ing形式规则","steps":[{"question":"动词 “swim” 变成-ing形式，是直接加-ing吗？它符合哪种变化规则？","hint":"观察一下 “swim” 这个单词的结尾结构：辅音(w) + 元音(i) + 辅音(m)。","takeaway":"对于以重读闭音节结尾的动词，需要遵循特殊规则。"},{"question":"像 “run”, “sit”, “get” 这类单词，变-ing形式时有什么特点？“swim” 和它们是同一类吗？","hint":"它们都变成了 “running”, “sitting”, “getting”，结尾的辅音字母都增加了一个。","takeaway":"这类单词需要双写末尾的辅音字母再加-ing，所以 “swim” 变成 “swimming”。"}]}]}},{"number":"22","item_type":"fill_blank","context_note":"","stem":"Lily is much _____ (health) than her sister.","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"healthier","explanation_md":"句中的 “than” 是一个明确的标志，表明这是一个比较级句子，意为“比……更……”。我们需要将括号中的词变为形容词的比较级形式。括号中给出的 “health” 是名词，意为“健康”，其对应的形容词是 “healthy”。形容词 “healthy” 是一个以“辅音字母+y”结尾的单词，其比较级需要遵循“变y为i再加-er”的规则。因此，“healthy” 的比较级是 “healthier”。句中的 “much” 用来修饰比较级，表示“……得多”，加强语气，但不改变比较级的形式。","knowledge_expansion_md":"**1. 形容词比较级的构成规则**\n- 一般单音节词和少数双音节词：词尾加-er (e.g., `tall` -> `taller`)。\n- 以e结尾：直接加-r (e.g., `nice` -> `nicer`)。\n- 以“辅音字母+y”结尾：变y为i再加-er (e.g., `easy` -> `easier`, `healthy` -> `healthier`)。\n- 重读闭音节结尾：双写末尾辅音字母再加-er (e.g., `big` -> `bigger`)。\n- 多音节词和部分双音节词：在词前加 `more` (e.g., `beautiful` -> `more beautiful`)。\n- 不规则变化：`good` -> `better`, `bad` -> `worse`, `many/much` -> `more`, `far` -> `farther/further`。\n\n**2. 修饰比较级的副词**\n- 可以用 `much`, `far`, `a lot` (……得多), `a little`, `a bit` (……一点), `even` (甚至更……) 等词来修饰比较级，以表示差异的程度。\n- 示例：`This car is a lot more expensive than that one.` (这辆车比那辆贵得多。)","socratic_tracks":[{"title":"识别比较结构","steps":[{"question":"在这个句子中，是哪个词告诉我们这里需要进行比较？","hint":"找一找表示“比”的那个词。","takeaway":"看到 “than”，就要立刻想到使用形容词或副词的比较级形式。"}]},{"title":"词性转换与选择","steps":[{"question":"括号里给的 “health” 是什么词性？我们能说 “Lily is much health” 吗？","hint":"“health” 是名词“健康”，而be动词后面通常跟形容词来描述主语的状态。","takeaway":"此处需要的是形容词，而不是名词。"},{"question":"名词 “health” 对应的形容词是什么？","hint":"在词尾加上字母 “y” 试试。","takeaway":"名词 “health” 对应的形容词是 “healthy”。"}]},{"title":"比较级变形规则","steps":[{"question":"我们已经确定要用 “healthy” 的比较级。这个单词是以什么字母结尾的？","hint":"最后一个字母是 “y”，它前面是一个辅音字母 “h”。","takeaway":"“healthy” 是一个以“辅音字母+y”结尾的形容词。"},{"question":"对于这类以 “y” 结尾的形容词，变比较级时有什么特殊规则？可以参考 “easy” 或 “happy”。","hint":"“easy” 的比较级是 “easier”，“happy” 的比较级是 “happier”。","takeaway":"规则是“变y为i，再加-er”，所以 “healthy” 的比较级是 “healthier”。"}]}]}},{"number":"23","item_type":"fill_blank","context_note":"","stem":"They _____ (be) to the UK, didn't they?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"have been","explanation_md":"这道题考察的是现在完成时态中 “have been to” 的用法，意为“去过某地（现在已经回来）”。这是一个非常核心且常用的短语，用来谈论过去的经历。句子的主语是 “They”（他们），是复数，所以助动词应使用 “have”。动词 “be” 在完成时态中需要使用其过去分词形式 “been”。因此，填入 “have been” 构成 “They have been to the UK.” 是最符合句意和常用法的选择。需要注意的是，句末的反义疑问句 “, didn't they?” 在严格语法上是错误的，正确的应为 “, haven't they?”。在解题时，我们应优先保证主句核心结构的正确性，因为这很可能是命题中的一个瑕疵。","knowledge_expansion_md":"**1. “have/has been to” vs “have/has gone to”**\n- `have/has been to + 地点`: 表示“去过某地”，强调的是一种经历，表示人已经从该地返回。\n  - 示例: `She has been to Paris twice.` (她去过巴黎两次。)\n- `have/has gone to + 地点`: 表示“去了某地”，强调的是一个未完成的动作或其结果，表示人目前还在该地或在去往该地的路上。\n  - 示例: `Tom has gone to the library.` (汤姆去图书馆了，现在不在说话的地方。)\n\n**2. 反义疑问句 (Tag Questions)**\n- 其构成规则是“前肯后否，前否后肯”，且助动词/情态动词/be动词与主句保持一致。\n- 主句是现在完成时 (have done)，反义疑问句用 `haven't/hasn't`。例: `He has finished his homework, hasn't he?`\n- 主句是一般过去时 (did)，反义疑问句用 `didn't`。例: `She went home, didn't she?`\n- 主句含be动词，反义疑问句也用be动词。例: `They were happy, weren't they?`\n- 本题中的反义疑问句与主句时态存在矛盾，这可能是非标准用法或命题瑕疵，解题时应以主句的常用和核心结构为准。","socratic_tracks":[{"title":"核心短语辨析","steps":[{"question":"当你想表达“去过某个地方”并且现在已经回来了，应该用哪个固定短语？","hint":"想一想 “go” 和 “be” 在完成时态里和 “to a place” 搭配时的不同含义。","takeaway":"表达“去过某地”的经历，应该使用 “have/has been to” 这个固定搭配。"},{"question":"这个句子的主语是 “They”，那么助动词应该用 “has” 还是 “have”？","hint":"“They” 是第三人称复数。","takeaway":"主语 “They” 是复数，所以助动词用 “have”。"}]},{"title":"反义疑问句的线索与矛盾","steps":[{"question":"看到句尾的 “, didn't they?”，它叫什么？它通常能给我们什么提示？","hint":"这种“小尾巴”问句叫反义疑问句，它的形式和主句的动词有关。","takeaway":"反义疑问句的形式由主句的谓语动词决定，可以帮助我们判断主句的时态和肯定/否定形式。"},{"question":"一个 “didn't” 的反义疑问句，通常对应的主句动词是什么时态？","hint":"“did” 是哪个动词的过去式？","takeaway":"它通常对应一般过去时的肯定句，例如 “They went to the UK, didn't they?”。"},{"question":"这道题的提示动词是 “(be)”，而反义疑问句是 “didn't they?”，这是否存在矛盾？我们应该如何选择？","hint":"一般过去时的be动词是 “was/were”，对应的反义疑问句是 “wasn't/weren't”。“have been” 对应的反义疑问句是 “haven't”。","takeaway":"题干存在语法矛盾，但 “have been to” 是最符合 “(be) to a place” 含义的核心短语，应优先选择。"}]},{"title":"时态综合运用","steps":[{"question":"如果我们用一般过去时来表达“他们去了英国”，应该怎么说？","hint":"用动词 “go” 的过去式。","takeaway":"可以说 “They went to the UK”。"},{"question":"如果我们用现在完成时来表达“他们去过英国”，应该怎么说？","hint":"用我们刚才讨论过的 “have been to”。","takeaway":"可以说 “They have been to the UK”。"},{"question":"这两种时态在含义上有什么细微差别？","hint":"一般过去时强调过去的动作，现在完成时强调过去的动作对现在的影响或结果（比如拥有了“去过”的经历）。","takeaway":"一般过去时只说明过去发生，现在完成时则把过去的动作和现在联系起来。"}]}]}},{"number":"24","item_type":"fill_blank","context_note":"","stem":"Is _____ (eat) too much good or bad for your body?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"Eating","explanation_md":"这个句子是一个疑问句，其陈述句形式是 “_____ too much is good or bad for your body.”。可以看出，句子缺少主语。主语必须是名词或起名词作用的成分。括号中给出的 “eat” 是一个动词，不能直接作主语。为了让动词作主语，我们需要将其变为非谓语动词形式，即动名词（-ing形式）或不定式（to do形式）。在这里，使用动名词 “Eating” 作主语是最常见和自然的用法。“Eating too much”（吃得太多）这个动名词短语在句子中充当主语，指代“吃太多”这件事情。动名词作主语时，谓语动词视为单数，这与句中的 “Is” 相符。","knowledge_expansion_md":"**1. 动名词作主语 (Gerund as Subject)**\n- 动名词是由 “动词+ing” 构成，具有名词的性质，可以在句子中作主语、宾语、表语等。\n- 作主语时，通常表示一种抽象的、泛指的或习惯性的动作，谓语动词要用单数形式。\n- 示例：`Reading is a good habit.` (读书是一个好习惯。)\n- 示例：`Learning a new language takes time.` (学习一门新语言需要时间。)\n\n**2. 不定式作主语 (Infinitive as Subject)**\n- 动词不定式（to do）也可以作主语，同样谓语动词用单数。通常表示某次具体的行为。\n- 示例：`To see is to believe.` (眼见为实。)\n- 为了避免头重脚轻，不定式作主语时，更常用 “It is + adj. + to do sth.” 的形式主语结构。例如：`It is important to learn English well.` (学好英语很重要。)\n\n**3. 动名词 vs. 不定式作主语**\n- 在很多情况下两者可以互换，但动名词作主语更普遍、更口语化，尤其是在谈论一般性的、习惯性的动作时。本题语境下，“Eating” 比 “To eat” 更为常用。","socratic_tracks":[{"title":"分析句子结构","steps":[{"question":"观察这个问句 “Is _____ good or bad...?”，如果把它变回陈述句，会是什么样子？","hint":"把系动词 “Is” 放到主语的后面。","takeaway":"陈述句的形式是 “_____ is good or bad...”。"},{"question":"在这个陈述句中，横线部分充当什么句子成分？","hint":"位于动词 “is” 前面的是什么成分？","takeaway":"横线部分是整个句子的主语。"}]},{"title":"动词的名词化","steps":[{"question":"我们能用一个动词原形，比如 “eat”，直接来当句子的主语吗？可以说 “Eat is good” 吗？","hint":"主语必须是名词或相当于名词的成分。","takeaway":"动词原形不能直接作主语，需要进行“名词化”处理。"},{"question":"有哪些方法可以把动词“eat”变成“吃饭”这件事，让它能作主语？","hint":"想一想动词的非谓语形式，比如-ing形式或者to do形式。","takeaway":"我们可以用动名词 “Eating” 或不定式 “To eat” 来作主语。"}]},{"title":"动名词主语的特点","steps":[{"question":"当用 “Eating too much” 这个短语作主语时，我们应该把它看作是单数还是复数？","hint":"它指的是“吃太多”这一件“事情”，而不是很多个东西。","takeaway":"动名词或动名词短语作主语时，通常被视为单数概念。"},{"question":"既然主语是单数，那么后面的be动词用 “is” 还是 “are”？这和原句是否匹配？","hint":"单数主语配单数谓语。","takeaway":"谓语动词用单数 “is”，这与原句开头的 “Is...” 完全吻合。"}]}]}},{"number":"25","item_type":"fill_blank","context_note":"","stem":"Mr. Lee _____ (give) us a talk on the history of China tomorrow, isn't he?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"is giving","explanation_md":"该句末尾的时间状语是“tomorrow”（明天），表示动作将发生在将来，因此需要使用将来时态。句末的反意疑问句是“isn't he?”，其助动词是“is”的否定形式。根据反意疑问句“前肯后否，前否后肯”且助动词/be动词保持一致的原则，主句的谓语动词应包含“is”。结合动词“give”，表示已经计划好的将来动作，可以使用现在进行时表将来，构成“is giving”结构。因此，填入“is giving”最符合语法和句意。","knowledge_expansion_md":"### 表示将来时间的多种方式\n\n英语中表示将来发生的事情有多种时态和结构，各自的侧重点不同：\n1.  **will + 动词原形**：常用于表示“临时的决定”、“意愿”或“纯粹的将来预测”。\n    *   例：*I think it **will rain** tomorrow.* (我认为明天下雨，纯粹预测)\n2.  **be going to + 动词原形**：常用于表示“事先计划好的打算”或“有迹象表明即将发生的事情”。\n    *   例：*Look at the dark clouds. It's **going to rain**.* (有迹象表明要下雨了)\n3.  **现在进行时 (be + doing)**：常用于表示“已经安排好的、确定会发生的将来计划”，通常与表示将来时间的词语连用，尤其常见于涉及时间、地点安排的个人或公共活动。\n    *   例：*I'm **flying** to Beijing next Monday.* (我已经订好票，下周一飞北京)\n    *   本题中“李老师明天给我们做讲座”就是一个已经安排好的活动，用现在进行时非常贴切。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"看到句子中的哪个词，我们可以判断这件事还没发生？","hint":"找一找表示时间的词。","takeaway":"句中的“tomorrow”（明天）告诉我们这是一个将来要发生的动作。"},{"question":"既然是将来要发生的动作，我们学过哪些时态或结构可以用来表示将来？","hint":"最简单的是用哪个助动词？还有表示“打算做某事”的结构是什么？","takeaway":"表示将来的常见方式有 will do, be going to do, 以及现在进行时 be doing。"}]},{"title":"反意疑问句","steps":[{"question":"句子最后“isn't he?”这个小尾巴叫什么？它有什么作用？","hint":"它用来对前面的陈述进行反问，确认信息。","takeaway":"这是反意疑问句，用于确认陈述部分的内容。"},{"question":"反意疑问句的构成规则是什么？特别是它的动词形式是如何根据主句变化的？","hint":"想想“前肯后否，前否后肯”的原则。","takeaway":"反意疑问句的be动词或助动词与主句保持一致，但肯定/否定形式相反。"},{"question":"既然反意疑问句部分用了“isn't”，那么主句的动词部分应该包含哪个词的肯定形式？","hint":"“isn't”是哪个词的否定缩写？","takeaway":"反意疑问句用了“isn't”，说明主句的谓语动词中必须包含“is”。"}]},{"title":"动词形式","steps":[{"question":"根据前面的分析，我们知道主句要用将来时，并且谓语动词要包含“is”。那么，动词“give”应该变成什么形式呢？","hint":"想想“is”后面可以跟动词的哪种形式来表达将来计划？","takeaway":"“is”后面可以跟动词的-ing形式，用现在进行时来表示已经安排好的将来动作。"},{"question":"所以，把“is”和“give”的正确形式组合起来，应该填什么？","hint":"give 的 -ing 形式是 giving。","takeaway":"最终答案是 is giving，表示一个已经安排好的未来计划。"}]}]}}]},{"section_title":"IV. 完形填空。（共10分）","section_instruction":"\"Where is the university?\" This is a question that many visitors to Cambridge (剑桥) ask. But no one can give them a __26__ answer, for there's no wall to be found __27__ the university. The university is the city. You can find classroom buildings, __28__, museums and offices of the university all over the city. And most of its members are the students and __29__ of the thirty-one colleges (学院).\nCambridge was already an __30__ town long before the first students and teachers arrived 800 years ago. It grew up by the river Granta, and the river was once __31__ the Cam. A __32__ was built over the river as early as 875, so the town got its name \"Cambridge\".\nIn the fourteenth and fifteenth centuries more and more land was used for college buildings. The town grew much __33__ in the nineteenth century after the opening of the railway in 1845. Cambridge became a __34__ in 1951 and now it has a popula
