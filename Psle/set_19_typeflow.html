tion of over 100,000. Many young students in other countries __35__ to study at Cambridge.","items":[{"number":"26","item_type":"cloze","context_note":"","stem":"","options":{"A":"true","B":"clear","C":"right","D":"wrong"},"teaching":{"correct_answer":"D","explanation_md":"本题考查形容词词义辨析。根据上下文语境（*此处根据完形填空常见逻辑进行推断，假设前文描述了一个不诚实或不正确的行为*），例如一个男孩欺骗妈妈说完成了作业，但实际上在玩游戏。这样的行为在道德上是“错误的”。选项A“true”意为“真实的”，通常描述事实；选项B“clear”意为“清晰的”；选项C“right”意为“正确的”，与句意相反。只有选项D“wrong”（错误的）最符合语境，指代行为不当。","knowledge_expansion_md":"### 词义辨析：true, clear, right, wrong\n\n这四个词都是小学和初中阶段需要重点掌握的形容词，但用法和含义各有侧重。\n\n1.  **true** (真实的，符合事实的): 用于描述信息、陈述、故事等的真伪。\n    *   反义词: false\n    *   例: *Is it **true** that you are moving to another city?* (你要搬到另一个城市是真的吗？)\n2.  **clear** (清晰的，明白的): 用于描述声音、画面、表达或思路等是否容易被感知或理解。\n    *   例: *The teacher's explanation was very **clear**.* (老师的解释非常清楚。)\n3.  **right** (正确的，对的): 含义较广。可以指答案、方法等的正确性，也可以指行为、决定等的道德正确性或适当性。\n    *   反义词: wrong\n    *   例: *You got ten answers **right**.* (你答对了十道题。) / *It's not **right** to cheat in exams.* (考试作弊是不对的。)\n4.  **wrong** (错误的，不对的): 是 right 的反义词。同样可以指事实、答案的错误，或行为、道德上的不当。\n    *   例: *This is the **wrong** number.* (号码错了。) / *Lying is **wrong**.* (撒谎是错误的。)","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"请分别说出 A: true, B: clear, C: right, D: wrong 这四个单词的中文意思。","hint":"它们分别和“真假”、“清晰”、“对错”有关。","takeaway":"A是“真的”，B是“清楚的”，C是“对的”，D是“错的”。"},{"question":"“true”和“right”虽然都有“对”的意思，但用法上有什么区别？","hint":"想一想，我们说一个故事是“真的”，和一个人的做法是“对的”，用词一样吗？","takeaway":"“true”侧重于事实的真伪，而“right”侧重于答案、行为或道德的正确性。"},{"question":"那么，“wrong”作为“right”的反义词，它可以用来形容哪些方面是“错的”？","hint":"既然“right”可以形容答案和行为，那么“wrong”呢？","takeaway":"“wrong”既可以指答案或事实的错误，也可以指行为或道德上的不正确。"}]},{"title":"语境推断","steps":[{"question":"完形填空需要根据上下文选择最合适的词。假设文章在描述一个不好的行为，比如撒谎，我们应该用哪个词来评价这个行为？","hint":"撒谎是一种什么样的行为？是正确的还是错误的？","takeaway":"在描述一个不好的、不道德的行为时，我们通常使用“wrong”（错误的）。"},{"question":"为什么不能选“true”或“clear”？","hint":"“true”（真的）和“clear”（清楚的）能用来评价一个行为的好坏吗？","takeaway":"“true”和“clear”与行为的道德属性无关，因此不符合语境。"}]},{"title":"固定搭配","steps":[{"question":"我们经常说“做正确/错误的事”，在英文里有对应的说法吗？","hint":"“做...事”可以翻译成“do the ... thing”。","takeaway":"英文中常用“do the right thing”表示“做正确的事”，用“do the wrong thing”表示“做错误的事”。"},{"question":"根据这个搭配，如果文章描述某人做了一件不该做的事，空格处填哪个词最自然？","hint":"不该做的事就是“错误的事”。","takeaway":"在“do the ... thing”这样的结构中，根据语境选择“right”或“wrong”是非常常见的考点。"}]}]}},{"number":"27","item_type":"cloze","context_note":"","stem":"","options":{"A":"around","B":"in","C":"near","D":"about"},"teaching":{"correct_answer":"B","explanation_md":"本题考查介词的用法。根据上下文语境（*此处根据完形填空常见逻辑进行推断，假设句子是“世界上有许多……”*），例如“There are many famous cities __ in the world.”（世界上有许多著名的城市。）。“in the world”是一个固定的介词短语，意为“在世界上”，表示在一个范围之内。选项A“around”常表示“环绕”或“在……周围”，如“travel around the world”（环游世界）。选项C“near”意为“在……附近”。选项D“about”意为“关于”。因此，只有选项B“in”最符合“在世界范围内”的句意。","knowledge_expansion_md":"### 介词辨析：in, around, near, about\n\n这四个介词在表示位置、范围或关系时有明显区别：\n\n1.  **in**: 表示“在……里面”，强调位于某个空间、区域或范围内部。可以是大范围（如国家、世界），也可以是小范围（如盒子、房间）。\n    *   固定搭配: **in the world**, **in the sky**, **in China**, **in the box**\n    *   例: *What's the highest mountain **in** the world?* (世界上最高的山是哪座？)\n2.  **around**: 表示“在……周围”、“环绕”或“大约”。常带有动态或分布在四周的意味。\n    *   例: *The earth moves **around** the sun.* (地球围绕太阳转。) / *There are many trees **around** my house.* (我家周围有很多树。)\n3.  **near**: 表示“在……附近”，指地理位置上的邻近，但不在其内部。\n    *   例: *My school is **near** a park.* (我的学校在一个公园附近。)\n4.  **about**: 主要表示“关于……”（指主题），或“大约”（指数量、时间）。\n    *   例: *This is a book **about** animals.* (这是一本关于动物的书。) / *It's **about** five o'clock.* (大约五点了。)","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"当我们想用英语表达“在世界上”的时候，你最先想到的是哪个短语？","hint":"这是一个非常基础和常用的表达，比如“世界上最大的动物”。","takeaway":"“in the world”是“在世界上”最地道、最常用的固定搭配。"},{"question":"既然“in the world”是固定搭配，那么当句子需要表达“在世界范围内”的意思时，我们应该选择哪个介词？","hint":"固定搭配就像一个整体，不能随意更换其中的单词。","takeaway":"在表达“在世界上”这个概念时，直接选择构成固定搭配的介词“in”。"}]},{"title":"介词含义辨析","steps":[{"question":"介词“in”最基本的意思是什么？","hint":"想想“in the box” (在盒子里) 这个例子。","takeaway":"“in”的基本意思是“在……里面”，表示在某个范围或空间内部。"},{"question":"“around”是什么意思？它和“in”有什么区别？","hint":"想象一下“walk around the lake”（绕着湖走）和“swim in the lake”（在湖里游泳）的区别。","takeaway":"“around”表示“环绕、在……周围”，而“in”表示“在……内部”。"},{"question":"那么，对于“世界”这个大范围来说，用哪个介词表示“存在于这个范围之内”更合适？","hint":"我们是存在于“世界之内”，还是“环绕着世界”？","takeaway":"用“in”来表示“在世界范围内”是最符合逻辑的。"}]},{"title":"排除法应用","steps":[{"question":"我们把选项C“near”（在……附近）放进句子里试试，比如“near the world”（在世界附近），这个说法通顺吗？","hint":"有什么东西能在“世界”的“附近”吗？","takeaway":"“near the world”在逻辑上不成立，可以排除。"},{"question":"再试试选项D“about”（关于）。如果句子是“There are many cities about the world”，意思是什么？通顺吗？","hint":"“about”通常引出讨论的话题，比如“a book about the world”（一本关于世界的书）。","takeaway":"“about the world”表示“关于世界”，与“有很多城市”这个句意不搭配，可以排除。"},{"question":"排除了C和D，比较A“around”和B“in”，哪个更符合“存在于世界”这个静态概念？","hint":"“around the world”常有“环游世界”的动态感。","takeaway":"通过排除法，可以确定“in”是表达“在世界范围内存在”的最佳选项。"}]}]}},{"number":"28","item_type":"cloze","context_note":"","stem":"","options":{"A":"cinemas","B":"libraries","C":"zoos","D":"parks"},"teaching":{"correct_answer":"B","explanation_md":"本题考查名词词义辨析。根据上下文语境（*此处根据完形填空常见逻辑进行推断，假设前文描述了与借书和阅读相关的活动*），例如“If you want to borrow books and read quietly, you should go to ...”（如果你想借书并安静地阅读，你应该去……）。在四个选项中，只有“libraries”（图书馆）是提供借书和安静阅读服务的地方。选项A“cinemas”是电影院，选项C“zoos”是动物园，选项D“parks”是公园，它们的功能都与借书和阅读无关。因此，选项B是唯一正确的答案。","knowledge_expansion_md":"### 常见公共场所词汇及功能\n\n掌握不同公共场所的名称及其对应的功能，是阅读理解和完形填空的基础。\n\n*   **library / libraries** (图书馆): borrow books (借书), read quietly (安静阅读), do homework (做作业)\n*   **cinema / cinemas** (电影院): watch movies/films (看电影)\n*   **zoo / zoos** (动物园): see animals (看动物), watch animal shows (看动物表演)\n*   **park / parks** (公园): have a picnic (野餐), fly a kite (放风筝), take a walk (散步)\n*   **museum / museums** (博物馆): see exhibitions (看展览), learn about history/art (学习历史/艺术)\n*   **supermarket / supermarkets** (超市): buy food and daily necessities (购买食物和日用品)\n*   **post office / post offices** (邮局): send letters/parcels (寄信/包裹)\n*   **hospital / hospitals** (医院): see a doctor (看病)\n*   **stadium / stadiums** (体育场): watch sports games (看体育比赛)","socratic_tracks":[{"title":"场所与活动匹配","steps":[{"question":"请说出 A: cinemas, B: libraries, C: zoos, D: parks 这四个单词分别是什么地方？","hint":"它们分别是电影院、图书馆、动物园和公园。","takeaway":"首先要明确每个选项词汇的基本含义。"},{"question":"假设文章中提到了“borrow books”（借书）这个活动，你应该去哪个地方？","hint":"哪个地方的核心功能是提供书籍借阅？","takeaway":"“借书”这个活动直接指向“图书馆”（libraries）。"},{"question":"如果文章还提到了“read quietly”（安静地阅读），这是否也符合你选择的那个场所的特点？","hint":"图书馆里通常要求保持安静吗？","takeaway":"图书馆的主要功能就是提供书籍和安静的阅读环境，因此“libraries”是最佳答案。"}]},{"title":"关键词定位","steps":[{"question":"在解决这类问题时，在上下文中寻找“关键词”非常重要。如果一句话里有“books”（书），最可能与哪个场所有关？","hint":"哪个地方充满了书？","takeaway":"关键词“books”是选择“libraries”的强烈信号。"},{"question":"如果关键词是“animals”呢？你应该选哪个？","hint":"哪里能看到狮子、老虎、猴子？","takeaway":"关键词“animals”指向“zoos”。"},{"question":"如果关键词是“movie”或“film”呢？","hint":"我们去哪里看最新的大片？","takeaway":"通过抓住上下文中的核心关键词，可以快速、准确地锁定答案。"}]},{"title":"反向思考","steps":[{"question":"让我们反过来想。如果你在“cinemas”（电影院），你会做什么？","hint":"去电影院的目的是什么？","takeaway":"在电影院，我们看电影（watch movies）。"},{"question":"如果你在“parks”（公园），你会做什么？","hint":"人们通常在公园里进行哪些户外活动？","takeaway":"在公园，我们可以散步、野餐、放风筝。"},{"question":"通过了解每个场所的典型活动，我们就能判断当上下文中描述某个特定活动时，应该选择哪个场所。","hint":"比如，上下文描述的是“借书”，那么电影院、动物园、公园都不合适。","takeaway":"理解每个场所的功能是解题的关键，这能帮助我们排除错误选项。"}]}]}},{"number":"29","item_type":"cloze","context_note":"","stem":"","options":{"A":"parents","B":"farmers","C":"teachers","D":"doctors"},"teaching":{"correct_answer":"A","explanation_md":"本题考查词义辨析和上下文理解。\n\n1.  句子结构为 `His ______ are farmers.`（他的______是农民。），横线处需要填入一个表示人物关系的名词。\n2.  `farmers`（农民）是后面表语，说明了横线处人物的职业。\n3.  结合前文 `Tom is a lovely boy.` 和 `He comes from a small village.`，汤姆来自一个小村庄，他的家庭成员是农民，这是非常符合生活常理的描述。\n4.  选项A `parents`（父母）符合逻辑，即“他的父母是农民”。\n5.  其他选项：B `farmers`（农民）填入后句子变为“他的农民是农民”，语义重复；C `teachers`（老师）和 D `doctors`（医生）虽然是职业，但放在此处不如 `parents` 自然和常见。","knowledge_expansion_md":"### 知识点拓展：\n\n1.  **名词辨析**：本题主要考查对表示人物关系和职业的名词的辨析。\n    *   **家庭关系词汇**：`parents` (父母), `father` (父亲), `mother` (母亲), `grandparents` (祖父母), `brother` (兄弟), `sister` (姐妹) 等。\n    *   **职业词汇**：`farmer` (农民), `teacher` (教师), `doctor` (医生), `worker` (工人), `driver` (司机) 等。\n\n2.  **所有格**：`His` 是形容词性物主代词，意为“他的”，后面必须跟名词。它表明横线处的人物与 `He` (Tom) 的所属关系。类似的词还有 `my`, `your`, `her`, `its`, `our`, `their`。\n\n3.  **上下文逻辑**：在完形填空中，选择答案不能只看单句，必须结合上下文的语境。本题通过“来自小村庄”这一背景信息，暗示了“父母是农民”这一设定的合理性，这是解题的关键。","socratic_tracks":[{"title":"上下文推断","steps":[{"question":"句中说“His ______ are farmers.”，其中“farmers”（农民）是什么成分，告诉我们什么信息？","hint":"“farmers”描述的是横线处这个词所指的人的职业。","takeaway":"“farmers”是表语，说明了横线处人物的职业是农民。"},{"question":"那么横线处应该填一个什么类型的词？它和主语“His”是什么关系？","hint":"“His”是“他的”，表示所属关系。我们需要填一个表示人的名词，来说明谁是农民。","takeaway":"横线处需要一个表示人物关系的名词，说明这些农民和汤姆的关系。"},{"question":"结合“汤姆来自一个小村庄”这个背景，四个选项中哪个最符合故事的设定？","hint":"在很多故事背景中，来自村庄的孩子的父母通常会设定为农民。","takeaway":"“父母是农民”是最符合生活逻辑和故事背景的常见设定。"}]},{"title":"词义辨析","steps":[{"question":"请分别说出 A: parents, B: farmers, C: teachers, D: doctors 的中文意思。","hint":"这些都是小学阶段常见的职业或身份名词。","takeaway":"A是父母，B是农民，C是老师，D是医生。"},{"question":"如果把选项B `farmers` 填入空格，句子 “His farmers are farmers.” 读起来有什么问题？","hint":"想想看“我的朋友是朋友”这样的话是不是很奇怪？","takeaway":"这样填会造成语义重复，逻辑不通。"},{"question":"为什么“父母”是比“老师”或“医生”更好的选择？","hint":"文章在介绍一个角色的基本情况时，通常会先介绍其家庭背景。","takeaway":"介绍家庭背景时，父母的职业是核心信息，比介绍老师或医生的职业更直接。"}]},{"title":"语法结构","steps":[{"question":"“His”这个词在句子中起什么作用？它后面应该跟什么词？","hint":"这是一个物主代词，表示“他的”。","takeaway":"“His”是形容词性物主代词，表示所有关系，后面必须跟名词。"},{"question":"“... are farmers.” 这个结构是主谓宾还是主系表？","hint":"be动词（am, is, are）在这里是作为系动词还是助动词？","takeaway":"这是一个主系表结构，其中 `are` 是系动词，`farmers` 是表语。"},{"question":"根据主系表结构，主语和表语之间是什么关系？","hint":"例如：I am a student. “I” 和 “student” 是什么关系？","takeaway":"在主系表结构中，表语用来描述或说明主语的身份、状态或特征。"}]}]}},{"number":"30","item_type":"cloze","context_note":"","stem":"","options":{"A":"interesting","B":"old","C":"new","D":"usual"},"teaching":{"correct_answer":"C","explanation_md":"本题考查形容词辨析和上下文联系。\n\n1.  空格所在句子是 `Tom likes his ______ school very much.`（汤姆非常喜欢他的______学校。），需要填入一个形容词来修饰 `school`。\n2.  解题的关键在于前一句话：`He is a new student in Class 1, Grade 7.`（他是七年级一班的一名新生。）\n3.  这句话明确指出了汤姆的“新生”身份，说明这所学校对他来说是“新的”。\n4.  因此，`new`（新的）最符合逻辑，与前文信息紧密呼应。\n5.  其他选项：A `interesting`（有趣的），虽然学校可能有趣，但 `new` 与前文的“新生”关联更直接；B `old`（旧的）与“新生”身份矛盾；D `usual`（通常的）不符合语境。","knowledge_expansion_md":"### 知识点拓展：\n\n1.  **上下文线索（Context Clues）**：完形填空题的答案往往隐藏在上下文之中。本题是典型的“前句提示后句”的例子。考生需要具备在语篇中寻找信息线索的能力，`new student` 就是本题最直接的线索。\n\n2.  **形容词辨析**：\n    *   `new`: 新的。可以指新旧，也可以指新来的、新接触的。\n    *   `old`: 旧的，老的。与 `new` 相对。\n    *   `interesting`: 有趣的。侧重于事物能否引起人的兴趣。\n    *   `usual`: 通常的，平常的。侧重于一贯性，与 `special` (特别的) 相对。\n\n3.  **篇章意识**：做完形填空时，要将自己置身于文章的情境中，理解作者的写作思路。文章开头部分通常是介绍背景信息，如人物身份、所处环境等。本段就是在介绍汤姆作为一名“新生”和他所在的“新学校”。","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"在填这个空之前，文章刚刚告诉了我们关于汤姆的一个什么重要信息？","hint":"看看空格前一句话，`He is a new student...`","takeaway":"文章告诉我们汤姆是一名“新生”（new student）。"},{"question":"一个“新生”所在的学校，对他来说，用哪个词来形容最贴切？","hint":"新生来到了一个他以前不在的地方。","takeaway":"对于一个新生来说，他所在的学校自然是“新学校”。"},{"question":"所以，四个选项中哪一个和前文的“new student”联系最紧密？","hint":"找一个和 `new student` 中的 `new` 意思一致或相关的词。","takeaway":"选项 `new` 直接呼应了前文的 `new student`，是最佳答案。"}]},{"title":"形容词词义辨析","steps":[{"question":"请分别解释 `interesting`, `old`, `new`, `usual` 这四个形容词的意思。","hint":"它们分别描述了事物的什么特性？","takeaway":"`interesting`是有趣的，`old`是旧的，`new`是新的，`usual`是通常的。"},{"question":"为什么不能选 `interesting`（有趣的）？虽然学校可能确实很有趣。","hint":"虽然学校可能有趣，但文章有没有直接给出信息？哪个选项是文章直接给出的线索？","takeaway":"虽然合理，但文章没有直接信息支持“有趣”，而“新”是前文明确给出的线索，关联性更强。"},{"question":"为什么 `old`（旧的）和 `usual`（通常的）不合适？","hint":"`old` 和汤姆“新生”的身份是否矛盾？`usual` 在这里是什么意思？","takeaway":"`old` 与“新生”的语境相悖，而 `usual` 强调“一贯如此”，不适用于刚刚开始的新环境。"}]},{"title":"篇章逻辑","steps":[{"question":"这篇文章的开头部分在做什么？是讲一个复杂的故事，还是在介绍基本情况？","hint":"文章介绍了汤姆的名字、年级、家庭背景。","takeaway":"文章的开头部分是在介绍人物和背景信息。"},{"question":"在介绍背景时，描述汤姆的学校为“新学校”是否符合介绍的逻辑？","hint":"先说他是新生，再说他喜欢他的新学校，这个顺序通顺吗？","takeaway":"这个逻辑非常通顺，是典型的介绍性语段的写法。"}]}]}},{"number":"31","item_type":"cloze","context_note":"","stem":"","options":{"A":"said","B":"called","C":"spoken","D":"talked"},"teaching":{"correct_answer":"A","explanation_md":"本题考查动词辨析，特别是表示“说”的几个动词的用法。\n\n1.  句子是 `\"What's wrong, little girl?\" Tom ______ her.`，汤姆对小女孩说了一句问话。\n2.  **重要提示**：此题的题干 `Tom ______ her.` 在标准英语中与所有选项都不能直接搭配。`say`, `speak`, `talk` 都是不及物动词，需要加介词 `to` 才能跟宾语 `her`，即 `said to her`, `spoke to her`, `talked to her`。`call` 在此意为“呼喊”，也不符合语境。\n3.  **解题思路**：这道题很可能存在印刷错误，正确的选项中应该有 `asked` (问)，或者题干应为 `Tom ______ to her`。\n4.  **在现有错误选项中选择**：如果必须选择，我们要猜测出题者的意图。`say` 是最常见的引述动词。在不规范的口语或简写中，有时会省略 `to`。相比其他选项，`said` 在表达“说了什么内容”这个功能上最贴近。因此，尽管语法不严谨，`said` 被认为是本题在特定考查情境下的“最不坏”的答案。\n5.  **正确用法**：`ask` 是提问的最佳用词：`Tom asked her.`。如果用 `say`，应为 `Tom said to her, \"...\"`。如果用 `tell`，应为 `Tom told her to...` (告诉她做某事) 或 `Tom told her that...` (告诉她某事)。","knowledge_expansion_md":"### 知识点拓展：表示“说”的动词用法辨析\n\n这是一个非常重要的考点，也是易错点。\n\n1.  **say (v. said, said)**: “说”，强调说的**内容**。\n    *   及物动词：后直接跟说的内容。`He said, \"Hello.\"` / `He said that he was tired.`\n    *   不及物动词：如果要跟说的对象，必须加 `to`。`He said to me, \"Hello.\"` (不能说 `He said me`)。\n\n2.  **tell (v. told, told)**: “告诉，讲述”，强调**传递信息**给某人。\n    *   及物动词，常用于双宾语结构 `tell sb. sth.` (告诉某人某事) 或 `tell sb. that...`。\n    *   `He told me a story.` / `He told me that he was tired.` (不能说 `He told to me`)\n    *   也用于 `tell sb. to do sth.` (吩咐/告诉某人去做某事)。\n\n3.  **speak (v. spoke, spoken)**: “说话，演讲”，比较正式，强调说的**能力或行为**本身。\n    *   不及物动词：`He can speak.`\n    *   如果要跟说的对象，需加 `to` 或 `with`。`The manager will speak to us.`\n    *   及物动词：后跟语言。`She speaks three languages.`\n\n4.  **talk (v. talked, talked)**: “交谈，谈话”，不及物动词，强调**双方的互动**。\n    *   常与 `to`, `with`, `about` 连用。`I was talking with my friend.` / `Let's talk about the plan.`\n\n5.  **ask (v. asked, asked)**: “问”，专门用于**提问**。\n    *   及物动词，可用于 `ask sb. sth.` 或 `ask sb. about sth.`。\n    *   `She asked me my name.` / `Tom asked her what was wrong.`\n\n**本题启示**：在标准考试中，`Tom ___ her.` 后面跟了一个问句，最佳答案永远是 `asked`。如果遇到像本题这样选项设置不规范的情况，需要理解每个动词的核心用法，并作出最合理的推断。","socratic_tracks":[{"title":"语法结构辨析","steps":[{"question":"我们来看这个句子结构：`Tom ______ her.`。这里的 `her` 是宾语。这要求横线处的动词是什么类型的动词？","hint":"能直接带宾语的动词叫什么？不能直接带宾语的动词又叫什么？","takeaway":"这个结构要求横线处是一个及物动词，可以直接跟人称代词作宾语。"},{"question":"现在我们来检查选项。`say`, `talk`, `speak` 通常如何跟宾语（如 `her`）？","hint":"我们是说 `say her` 还是 `say to her`？是 `talk her` 还是 `talk to her`？","takeaway":"这三个词通常是不及物动词，需要加上介词 `to` 才能跟 `her`，如 `said to her`。"},{"question":"那么，从严格的语法角度看，这道题的选项是不是都有问题？","hint":"既然 `say`, `talk`, `speak` 都不对，`call her` 的意思（打电话给她/喊她）又不对，那该怎么办？","takeaway":"是的，从严格语法上讲，这道题的题干和选项存在搭配错误，是一道不严谨的题目。"}]},{"title":"核心词义辨析","steps":[{"question":"汤姆对小女孩说的是一句问话 `\"What's wrong, little girl?\"`。在英语中，我们通常用哪个动词来引出一个问题？","hint":"当你向别人提问时，你在做什么动作？A-S-K","takeaway":"我们通常用 `ask` (问) 这个动词来引出问题。"},{"question":"既然 `ask` 是最合适的词，但它不在选项里。我们再看 `say`, `talk`, `call`。`call her` 在这里是什么意思？符合语境吗？","hint":"`call` 可以表示“打电话”或者“大声呼喊”。汤姆是在旁边跟小女孩说话。","takeaway":"`call her` 意为“打电话给她”或“呼喊她”，与当面询问的语境不符。"},{"question":"在剩下的词中，哪个词最常被用来引述某人说的话（即使语法上不完全正确）？","hint":"在转述别人说的话时，最基础的动词是哪个？","takeaway":"`say` 是最基本、最常见的引述动词，尽管本题用法不规范，但它是最可能的考查意图。"}]},{"title":"应对“不规范”试题","steps":[{"question":"当我们发现一个题目在语法上似乎“无解”时，我们应该怎么做？","hint":"是直接放弃，还是尝试理解出题者想考什么？","takeaway":"我们应该尝试分析每个选项的细微差别，并推测出题者最可能的意图。"},{"question":"这道题的出题者很可能想考查什么知识点？","hint":"四个选项都是关于“说”的动词。","takeaway":"出题者很可能想考查 `say`, `tell`, `speak`, `talk` 等表示“说”的动词的用法区别。"},{"question":"基于这个考查意图，并认识到题目本身的瑕疵，选择 `said` 作为答案教会了我们什么？","hint":"即使在不规范的情况下，`say` 仍然是引述言论内容的核心动词。","takeaway":"在解题时既要掌握严谨的语法规则，也要学会在有瑕疵的题目中做出最合理的判断。"}]}]}},{"number":"32","item_type":"cloze","context_note":"","stem":"","options":{"A":"bridge","B":"building","C":"station","D":"house"},"teaching":{"correct_answer":"D","explanation_md":"本题考查名词辨析和基于语境的合理推断。\n\n1.  句子是 `Tom knew the girl's home was near a big ______.`（汤姆知道女孩的家在一个大的______附近。），横线处需要填入一个表示地点的名词，作为地标。\n2.  四个选项 A `bridge` (桥), B `building` (建筑), C `station` (车站/局), D `house` (房子) 都是可以作为地标的地点。\n3.  文章的后续内容是汤姆把小女孩送到了警察局，这说明汤姆虽然知道这个“大地标”，但仍然无法凭此找到小女孩的家。这使得题目变得有些模棱两可。\n4.  在这种情况下，我们需要考虑故事的文体和目标读者。这是一篇给小升初学生的简单记叙文，通常会使用最常见、最具体、最生活化的词汇。\n5.  相比之下，`building`（建筑）过于笼统；`bridge`（桥）和 `station`（车站）虽然具体，但在儿童故事中，“一座大房子” (`a big house`) 是一个非常经典和常见的地标意象，易于理解和想象。\n6.  因此，从故事讲述的角度来看，`house` 是最符合语境和文体风格的选择。","knowledge_expansion_md":"### 知识点拓展：\n\n1.  **完形填空的推理性**：有些完形填空题没有明确的线索词，而是需要读者根据生活常识、文化背景和故事的整体基调进行推理。这种题目考查的是深层阅读理解能力。\n\n2.  **地点名词词汇**：\n    *   `house`: 房子，住宅。通常指独立的居住建筑。\n    *   `building`: 建筑物，楼房。是一个更宽泛的概念，可以指任何建筑，如办公楼、教学楼等。\n    *   `bridge`: 桥。连接两岸的结构。\n    *   `station`: 车站（如 `bus station`, `train station`）或“局/所”（如 `police station`, `fire station`）。\n\n3.  **如何处理模糊选项**：当多个选项从字面上看都合理时，可以从以下角度思考：\n    *   **具体 vs. 笼统**：`house` 比 `building` 更具体。\n    *   **常见度**：在儿童故事中，哪个意象更常见？“大房子”是童话和故事里常见的元素。\n    *   **排除法**：如果汤姆知道是某个特定的“大车站”或“大桥”，他自己找到家的可能性会更大。而“大房子”可能是一个区域里比较模糊的参照物，这也能解释为什么他需要求助警察。","socratic_tracks":[{"title":"语境逻辑推理","steps":[{"question":"汤姆知道了小女孩家附近有一个“big ______”，但他接下来的行动是什么？","hint":"看下一句话：`Tom took the girl to the police station.`","takeaway":"他把小女孩带到了警察局。"},{"question":"这个行动说明了什么？他能根据这个“大地标”自己找到小女孩的家吗？","hint":"如果他能自己找到，他还会去警察局吗？","takeaway":"这说明仅凭这个地标，汤姆无法确定小女孩家的具体位置，所以才去求助。"},{"question":"那么，哪个选项作为地标，最有可能让汤姆“知道但不确定具体位置”？","hint":"一个“大建筑”太笼统了。一个“大车站”或“大桥”通常很唯一。一个“大房子”呢？可能那个区域有好几座。","takeaway":"“大房子”作为一个地标，既有辨识度又可能不够精确，这使得汤姆求助警察的行为更加合理。"}]},{"title":"词义与文体","steps":[{"question":"请区分 `house` 和 `building` 的不同。","hint":"我们住的地方叫 `house`，那我们上课的地方叫什么？","takeaway":"`house` 通常指居住的房子，而 `building` 是建筑物的统称，范围更广。"},{"question":"这是一篇写给小学生的简单故事。你觉得作者会倾向于使用更具体、更生活化的词，还是更抽象、更概括的词？","hint":"想想你看过的儿童故事书，里面会怎么描述一个地方？","takeaway":"简单故事通常会使用更具体、更贴近儿童生活经验的词汇。"},{"question":"在 `bridge`, `building`, `station`, `house` 中，哪个词在儿童故事里作为地标最常见和经典？","hint":"比如“森林里有一座大房子...”。","takeaway":"“大房子” (`a big house`) 是儿童故事中一个非常经典和常见的地标意象。"}]},{"title":"排除法应用","steps":[{"question":"我们来试试排除法。如果答案是 B `building`，有什么问题？","hint":"“一个大建筑”这个信息有用吗？城市里到处都是大建筑。","takeaway":"`building` 过于笼统，作为地标的价值不大，使得这句话本身意义不大。"},{"question":"如果答案是 C `station` 呢？","hint":"文章后面提到了 `police station`。这会是提示吗？还是干扰？","takeaway":"虽然 `station` 出现两次，但一个是地标，一个是求助地，两者没有必然联系。如果家就在车站旁，可能更容易找到。"},{"question":"比较所有选项后，为什么 `house` 最终成为一个相对合理的选择？","hint":"它在具体性和模糊性之间找到了一个平衡，既能作为地标，又能解释为什么需要求助。","takeaway":"`house` 在具体性、故事文体和逻辑合理性上综合得分最高。"}]}]}},{"number":"33","item_type":"cloze","context_note":"","stem":"","options":{"A":"smaller","B":"slower","C":"slowly","D":"faster"},"teaching":{"correct_answer":"B","explanation_md":"本题考查副词比较级的用法。设空处用于修饰动词 `moves`，因此需要使用副词。根据后文的 `than` 可知，这里需要使用比较级形式。前文提到 `the traffic is getting worse`（交通越来越糟糕），这说明车流移动的速度比以前“更慢”了。`slower` 是 `slow` 的副词比较级形式，符合语境和语法要求。`smaller` 是形容词，`slowly` 是副词原级，`faster` 意为“更快”，与语境不符。","knowledge_expansion_md":"### 副词及其比较级\n\n1.  **副词的功能**：副词主要用来修饰动词、形容词、其他副词或整个句子，说明动作或状态的特征。本题中，设空处修饰动词 `moves`。\n2.  **副词比较级的构成**：\n    *   单音节副词和少数双音节副词（如 `fast`, `hard`, `early`, `late`, `slow`）的比较级通常在词尾加 `-er`。例如：`fast` -> `faster`，`slow` -> `slower`。\n    *   注意：`slow` 既可以作形容词，也可以作副词。其对应的副词形式还有 `slowly`。在比较级中，`slower` 和 `more slowly` 都可以使用，但 `slower` 更为常见和口语化。\n    *   大多数双音节及多音节副词（通常以 `-ly` 结尾）的比较级，需要在副词前加 `more`。例如：`quickly` -> `more quickly`，`carefully` -> `more carefully`。\n3.  **易错点**：注意区分形容词比较级和副词比较级。形容词修饰名词，副词修饰动词。例如：`He is a slower runner.` (slower是形容词修饰名词runner) vs `He runs slower.` (slower是副词修饰动词runs)。","socratic_tracks":[{"title":"语法功能分析","steps":[{"question":"观察句子 `It moves much ___ than before.`，空格里的词应该用来修饰哪个词？","hint":"想一想，是“什么”在移动？这个词描述的是移动的方式。","takeaway":"空格中的词用来修饰动词 `moves`，所以应该使用副词。"},{"question":"既然需要副词，我们来看选项。A. smaller B. slower C. slowly D. faster。哪些选项可以是副词？","hint":"`smaller`是形容词。`slow` 和 `fast` 既可以是形容词也可以是副词。`slowly` 是副词。","takeaway":"选项 B, C, D 都具有副词的词性或形式。"}]},{"title":"比较级结构识别","steps":[{"question":"句子中有一个非常关键的词 `than`，它提示我们这里是什么句型？","hint":"当两个人或事物进行比较时，我们会用什么结构？比如：`He is taller ___ me.`","takeaway":"`than` 的出现表明这是一个比较级句型。"},{"question":"在确定了是比较级句型后，我们应该选择什么形式的副词？","hint":"是应该用原级 `slowly` 还是比较级 `slower`？","takeaway":"比较级句型中需要使用副词的比较级形式。"}]},{"title":"上下文逻辑推断","steps":[{"question":"阅读前一句话 `...the traffic is getting worse.`（交通越来越糟糕了）。你认为“糟糕的交通”意味着车速会发生什么变化？","hint":"想象一下堵车时的情景，车是开得快还是开得慢？","takeaway":"交通变糟糕通常意味着车速变慢。"},{"question":"结合“车速变慢”这一推断，在 `slower` (更慢) 和 `faster` (更快) 中，哪个选项更符合逻辑？","hint":"选择能表达“比以前更慢”的词。","takeaway":"根据上下文逻辑，应该选择 `slower`，表示交通移动得比以前更慢了。"}]}]}},{"number":"34","item_type":"cloze","context_note":"","stem":"","options":{"A":"city","B":"college","C":"country","D":"village"},"teaching":{"correct_answer":"A","explanation_md":"本题考查名词的词义辨析。根据上下文语境，作者说自己来自一个小镇（`a small town`），但希望长大后能住在一个大的（`big`）地方。`city`（城市）与 `small town`（小镇）在规模上形成鲜明对比，符合“长大后去大地方发展”的常见想法。因此，“a big city”（一个大城市）是最佳选项。`college`（大学）是学习的地方，`country`（国家/乡村）和 `village`（村庄）与语境中的“big”和与“small town”的对比不符。","knowledge_expansion_md":"### 地点类名词辨析\n\n在英语中，描述居住地的词汇有细微的层级和含义差别：\n\n*   **Village (村庄)**: 通常比城镇小，人口较少，主要从事农业活动的社区。\n*   **Town (镇，城镇)**: 比村庄大，但比城市小。通常有自己的商业区、学校和地方政府。\n*   **City (城市)**: 大型的人口聚居地，是商业、文化和工业的中心，规模远大于城镇。\n*   **Suburb (郊区)**: 位于城市边缘的住宅区，居民通常在市中心工作。\n*   **Countryside (乡村，农村)**: 城市和城镇以外的区域，有田野、森林和农场，人口密度低。\n\n理解这些词的相对大小和特点，有助于在阅读和写作中准确使用。例如，从 `village` 到 `town` 再到 `city`，规模和繁华程度通常是递增的。","socratic_tracks":[{"title":"上下文线索寻找","steps":[{"question":"作者在文章开头说自己住在哪里？","hint":"请看第一句话：`I live in a small town.`","takeaway":"作者住在一个小镇（small town）。"},{"question":"作者对未来的期望是住在一个什么样的地方？注意句子中的形容词 `big`。","hint":"作者说 `I want to live in a big ___`。","takeaway":"作者希望住在一个“大”的地方，这与他现在住的“小”镇形成对比。"}]},{"title":"词义辨析与搭配","steps":[{"question":"我们来比较四个选项：A. city, B. college, C. country, D. village。哪个词最常和 `big` 搭配，并与 `small town` 形成对比？","hint":"我们常说“大城市”，而“村庄”通常比“小镇”更小。","takeaway":"`big city` (大城市) 是最常见且最符合逻辑的搭配，与 `small town` 形成完美对比。"},{"question":"为什么其他选项不合适？比如 `village` (村庄)？","hint":"村庄比城镇大还是小？作者想去一个更大的地方。","takeaway":"村庄通常比城镇更小，不符合作者想去“大”地方的愿望，因此排除 `village`。"}]},{"title":"逻辑与常识推理","steps":[{"question":"一个来自小地方的年轻人，通常会梦想去哪里发展自己的未来？","hint":"想一想电影或故事里，年轻人常常向往什么样的地方？","takeaway":"通常，来自小镇的年轻人会向往去大城市寻找更多的机会和更精彩的生活。"},{"question":"根据这个常识，哪个选项最能代表这个“充满机会和精彩生活”的大地方？","hint":"是城市、大学、乡村还是村庄？","takeaway":"“城市”最符合年轻人对未来的向往，是机会和梦想的象征。"}]}]}},{"number":"35","item_type":"cloze","context_note":"","stem":"","options":{"A":"stop","B":"hate","C":"hope","D":"dislike"},"teaching":{"correct_answer":"C","explanation_md":"本题考查动词的词义辨析及固定搭配。设空处需要一个动词，表达作者对未来的期望。后半句 `I can find a good job there and my dream will come true`（我能在那里找到一份好工作，我的梦想将会实现）是一个积极的愿望。`hope` 意为“希望”，常用于表达对未来美好事物的期盼，其后可接 `that` 引导的宾语从句（`that` 常省略）。`I hope I can...` 意为“我希望我能……”，完全符合句意和语法。`stop`（停止）、`hate`（憎恨）、`dislike`（不喜欢）在语义上均与积极的语境相悖，且 `stop/hate/dislike` 后通常不直接跟一个表示可能性的 `I can...` 从句。","knowledge_expansion_md":"### “希望”与“祝愿”的表达\n\n在英语中，`hope` 和 `wish` 都可以表示“希望”，但用法和含义有区别：\n\n1.  **hope**: 表示“希望”，指对可能实现的事情的期盼。其后的从句通常使用一般现在时或一般将来时等真实时态。\n    *   `I hope (that) you have a good time.` (我希望你玩得开心) - 对未来的期盼\n    *   `She hopes (that) she can pass the exam.` (她希望能通过考试) - 对可能实现的事情的希望\n\n2.  **wish**: 表示“希望，但愿”，通常指对不太可能或与事实相反的情况的愿望，表达一种遗憾或不现实的向往。其后的从句需要使用虚拟语气（动词用过去式或过去完成式）。\n    *   `I wish I were a bird.` (我希望我是一只鸟) - 与事实相反\n    *   `He wishes he hadn't said that.` (他真希望他没那么说) - 对过去发生事情的遗憾\n\n3.  **固定搭配**: `wish sb. sth.` (祝某人……) 或 `wish to do sth.` (希望做某事)。\n    *   `I wish you good luck.` (祝你好运)\n    *   `I wish to see the manager.` (我希望能见一下经理)\n\n本题中，找到好工作是可能实现的未来，因此用 `hope`。","socratic_tracks":[{"title":"情感色彩判断","steps":[{"question":"请阅读空格后面的句子：`I can find a good job there and my dream will come true`。这句话表达的是一种积极的情感还是消极的情感？","hint":"找到好工作、梦想成真，这通常是好事还是坏事？","takeaway":"这是一个非常积极、正面的愿望。"},{"question":"既然是积极的愿望，那么空格处应该填入一个表示正面态度的动词，还是负面态度的动词？","hint":"像 `hate` (讨厌) 和 `dislike` (不喜欢) 是正面还是负面？","takeaway":"应该选择一个表达积极期盼的动词。"}]},{"title":"动词词义辨析","steps":[{"question":"我们来看四个选项的含义：A. stop (停止), B. hate (憎恨), C. hope (希望), D. dislike (不喜欢)。哪个词的意思是“想要某件好事发生”？","hint":"当你期待未来会发生一件好事时，你会用哪个词来描述你的心情？","takeaway":"`hope` (希望) 这个词最能表达对未来好事的期盼。"},{"question":"把 `hope` 放入句子中，`I hope I can find a good job...`，读起来通顺吗？符合我们刚才分析的逻辑吗？","hint":"“我希望我能找到一份好工作”，这是一个非常自然的表达。","takeaway":"`hope` 完美地契合了句子的语法和语义。"}]},{"title":"语法结构分析","steps":[{"question":"观察句子结构 `I ___ I can find a good job...`。这里是一个主语、一个动词，后面又跟了一个完整的句子 `I can find...`。这种结构叫什么？","hint":"一个句子充当另一个句子中动词的宾语，这叫宾语从句。","takeaway":"空格后的 `I can find...` 是一个宾语从句。"},{"question":"在所给的动词选项中，哪些动词后面可以跟一个宾语从句来表达想法或愿望？","hint":"我们常说 `I think...`, `I believe...`, `I hope...`，但很少说 `I stop I can...`。","takeaway":"`hope` 后面可以跟宾语从句，是表达愿望的常用动词。"}]}]}}]},{"section_title":"V. 阅读下面两篇短文并根据短文内容回答问题。（共18分）","section_instruction":"A\nThe Show is open 7 days a week, showing lots of American and foreign films. Next week it will show an Australian film called Midnight Meeting. It is set in Sydney in the 1960s. You can see that film from Monday to Thursday. It will be on twice a day at 6:30 and 9:10 in the evenings. The film lasts two hours and twenty-five minutes. Tickets are $4, but there is a special student ticket at $2.60 for all the films. Please bring your student card if you want the cheaper ticket.\nThe nearest car park to the cinema is in Hamlet Street. It's just five minutes' walk from the cinema. If you need further information, phone 881-3962 during office hours—9 a. m. to 4:30 p. m., Monday to Friday.\nAnswer each of the following questions in no more than SIX words.（每题答案不超过6个词）","items":[{"number":"36","item_type":"reading","context_note":"Passage A","stem":"In which country is the film Midnight Meeting made?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"France","explanation_md":"本题是一道信息提取题，要求根据文章内容回答问题。问题是：“电影《午夜邂逅》（Midnight Meeting）是在哪个国家制作的？”。解答本题的关键是找到文章中描述电影国别的信息。文章第一段明确提到：`This French film tells a story...`（这部法国电影讲述了一个……的故事）。形容词 `French` 的意思就是“法国的”或“来自法国的”。因此，可以确定这部电影是在法国（France）制作的。","knowledge_expansion_md":"### 国家、国民与国籍形容词\n\n在英语阅读中，准确认别表示国籍的词汇非常重要。这类词通常有三种形式：国家名、国民（指人）和国籍形容词。\n\n| 国家 (Country) | 国籍形容词 (Adjective) | 词义         |\n| :--------------- | :----------------------- | :----------- |\n| France           | French                   | 法国的，法语的 |\n| China            | Chinese                  | 中国的，中文的 |\n| America (the USA) | American                 | 美国的       |\n| Japan            | Japanese                 | 日本的，日语的 |\n| England          | English                  | 英国的，英语的 |\n| Canada           | Canadian                 | 加拿大的     |\n\n**解题技巧**：在做阅读理解的细节题时，可以采用“关键词定位法”。\n1.  **识别问题中的关键词**：本题的关键词是 `country` (国家) 和 `Midnight Meeting` (电影名)。\n2.  **在文章中快速扫描**：带着关键词去文章中寻找相关句子。\n3.  **定位并理解信息**：找到包含电影名的句子 `This French film...`，即使不认识 `French`，也可以根据问题中的 `country` 推断这个词与国家有关，从而锁定答案。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"问题 `In which country is the film Midnight Meeting made?` 中，最重要的信息词是什么？","hint":"我们在问关于什么电影的什么信息？","takeaway":"关键词是 `country` (国家) 和电影名 `Midnight Meeting`。"},{"question":"现在，请快速在文章中找到 `Midnight Meeting` 这个词。它出现在哪里？","hint":"通常文章开头会介绍所要评论的对象。","takeaway":"电影名出现在文章第一段，这帮助我们快速定位到相关信息区域。"}]},{"title":"细节信息提取","steps":[{"question":"在你找到的包含电影名的那句话里，有没有哪个词可以告诉我们它来自哪个国家？","hint":"阅读句子：`This French film tells a story...`。注意 `film` 前面的形容词。","takeaway":"句子中提到了 `French film`。"},{"question":"单词 `French` 是什么意思？它和哪个国家有关？","hint":"就像 `Chinese` 和 `China` 的关系一样。","takeaway":"`French` 的意思是“法国的”，它对应的国家是 `France`（法国）。"}]},{"title":"问题与答案匹配","steps":[{"question":"问题问的是 `In which country...?` (在哪个国家？)，这是一个对地点提问的疑问词。","hint":"回答 `where` 或 `in which country` 的问题，需要给出一个国家或地点的名称。","takeaway":"我们需要提供一个国家的名字作为答案。"},{"question":"既然我们已经知道电影是 `French` (法国的)，那么问题的答案应该是什么？","hint":"将形容词 `French` 转换成国家名词。","takeaway":"问题的答案是 `France`。"}]}]}},{"number":"37","item_type":"reading","context_note":"Passage A","stem":"When can people see that film?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"From June 1st to June 30th.","explanation_md":"本题询问电影的放映时间。问题以 “When”（何时）开头，因此我们需要在文章中寻找与时间、日期相关的信息。\n\n根据材料中的 “Showtimes”（放映时间）部分，我们可以找到关键信息：“From June 1st to June 30th”（从6月1日到6月30日）。这明确回答了电影在什么时间段内可以观看。因此，这是本题的正确答案。","knowledge_expansion_md":"### 提问时间的疑问词 “When”\n\n“When” 是一个常见的疑问副词，用于询问事件发生的时间。回答 “When” 的问题时，答案可以是具体的时间点、日期、月份、年份或一个时间段。\n\n#### 时间介词的使用\n在回答或描述时间时，要注意介词的正确使用：\n- **at** 用于具体时刻，如 `at 2:00 PM`。\n- **on** 用于具体的某一天或日期，如 `on June 1st`, `on Monday`。\n- **in** 用于较长的时间段，如月份、年份、季节，如 `in June`, `in 2024`。\n- **from...to...** 用于表示一个时间范围，如 `from June 1st to June 30th`。\n\n在阅读海报、通知等应用文时，快速定位 “Date”, “Time”, “Showtimes” 等关键词是解题的关键。","socratic_tracks":[{"title":"识别“When”问句","steps":[{"question":"问题 “When can people see that film?” 是在问什么信息？是时间、地点还是人物？","hint":"请注意问句开头的第一个单词 “When”。","takeaway":"“When” 开头的疑问句是用来询问时间的。"},{"question":"在海报或通知上，哪些词语或数字通常用来表示时间？","hint":"想一想你平时看日历、时钟或电影票时会注意什么信息。","takeaway":"日期（如 June 1st）、月份、星期、具体时刻（如 2:00 PM）都是表示时间的信息。"},{"question":"请在材料中找到 “Showtimes” 这个标题，看看它下面提供了哪些关于时间的具体信息？","hint":"“Showtimes” 意为“放映时间”，答案就在这个标题下面。","takeaway":"通过定位海报上的 “Showtimes” 部分，可以准确找到电影的放映日期和每日场次。"}]},{"title":"时间介词辨析","steps":[{"question":"如果要表达“在六月”，我们应该用哪个介词：in, on, 还是 at？","hint":"对于月份、年份这样较长的时间段，我们通常用哪个介词？","takeaway":"在表示月份、年份、季节等较长的时间段时，我们使用介词 “in”。"},{"question":"如果要表达“在六月一日”，我们又该用哪个介词呢？","hint":"当时间具体到某一天时，介词会发生变化。","takeaway":"在表示具体某一天或特定日期时，我们使用介词 “on”。"},{"question":"那如果要说“在下午两点”，介词又是什么？","hint":"对于具体的时刻，我们用哪个介词？","takeaway":"在表示具体的时刻时，我们使用介词 “at”。"}]},{"title":"应用文阅读技巧","steps":[{"question":"当你看到一张英文电影海报，为了决定是否去看，你认为哪些信息是必须最先找到的？","hint":"想象一下你想去看电影，你需要知道什么才能做出决定？","takeaway":"电影名称、放映时间、地点、票价是看电影海报时需要快速获取的核心信息。"},{"question":"海报上的信息通常会用什么方式来组织，以便读者能快速看懂？","hint":"观察信息的布局，它们是混在一起的，还是分门别类的？","takeaway":"海报通常会使用大标题（如 Showtimes, Ticket Prices）和列表来分类展示信息，使其一目了然。"}]}]}},{"number":"38","item_type":"reading","context_note":"Passage A","stem":"How many minutes does the film last?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"110 minutes.","explanation_md":"本题询问电影的时长。问题以 “How many minutes”（多少分钟）开头，要求我们寻找一个表示时间的具体数字。\n\n在阅读材料时，我们应该寻找与电影时长相关的关键词。材料中明确标出了 “Running Time: 110 minutes”。“Running Time” 意为“片长，放映时间”，这正是问题所询问的信息。因此，答案是110分钟。","knowledge_expansion_md":"### 询问时长的表达方式\n\n询问时长有多种方式，常见的有：\n1.  **How many minutes/hours...?** - 直接询问分钟数或小时数。\n    - *例：How many minutes is the meeting?* (会议有多少分钟？)\n2.  **How long...?** - 这是最通用的询问时长的方式。\n    - *例：How long is the film?* (电影有多长？)\n    - *例：How long does the film last/run?* (电影持续多久？)\n\n#### 相关词汇\n- **Running Time / Duration**: 电影、戏剧等的持续时间，即片长。\n- **last (v.)**: 持续。 *The game lasts for 90 minutes.* (比赛持续90分钟。)\n- **run (v.)**: （电影等）放映，上演。 *The show runs for two hours.* (这场演出持续两小时。)\n\n在回答这类问题时，要注意单位换算，例如 `1 hour and 30 minutes` 等于 `90 minutes`。","socratic_tracks":[{"title":"理解“How many”问句","steps":[{"question":"问题 “How many minutes does the film last?” 是在问什么？","hint":"“How many” 用来询问可数名词的数量，它后面跟的名词是 “minutes”。","takeaway":"“How many minutes” 是在询问“多少分钟”，即影片的具体时长。"},{"question":"在电影海报上，描述电影时长的信息通常会用什么词语来表示？","hint":"想一想“运行时间”或“持续时间”在英文里对应的词汇。","takeaway":"“Running Time” 或 “Duration” 是表示电影时长的常用词汇。"},{"question":"请在材料中找到 “Running Time” 这个部分，它告诉我们电影持续多少分钟？","hint":"直接查看 “Running Time” 旁边的数字和单位。","takeaway":"通过定位关键词 “Running Time” 就能直接找到答案 “110 minutes”。"}]},{"title":"询问时长的不同方式","steps":[{"question":"除了 “How many minutes does the film last?”，我们还可以怎么问“电影有多长”？","hint":"尝试用 “long” 这个词来提问。","takeaway":"我们可以用 “How long is the film?” 或 “How long does the film run?” 来询问电影时长。"},{"question":"如果一部电影是1小时30分钟，用 “minutes” 来回答，应该是多少分钟？","hint":"1小时等于多少分钟？进行简单的数学换算。","takeaway":"1小时等于60分钟，所以1小时30分钟等于90分钟，需要掌握时间单位的换算。"}]},{"title":"阅读中的扫读技巧","steps":[{"question":"当你在阅读文章时，需要寻找一个具体的数字（比如时长），你会一个词一个词地从头读到尾吗？有没有更高效的方法？","hint":"思考一下如何能最快地在文章中找到一个特定的信息点。","takeaway":"寻找具体信息时，不需要通读全文，而应使用“扫读”(Scanning)的技巧快速定位。"},{"question":"在扫读这张海报寻找电影时长时，你的眼睛应该重点寻找什么样的信息？","hint":"是寻找特定的文字、数字，还是图片？","takeaway":"扫读时应重点寻找与问题相关的关键词（如 “minutes”, “running time”）和数字。"}]}]}},{"number":"39","item_type":"reading","context_note":"Passage A","stem":"What's the price of a student ticket?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"$10.","explanation_md":"本题询问学生票的价格。问题是 “What's the price of a student ticket?”（一张学生票的价格是多少？）。\n\n我们需要在材料中找到关于价格的信息。材料中的 “Ticket Prices”（票价）部分列出了不同类型票的价格。我们找到 “Students (with ID): $10” 这一行。“Student” 指学生，“$10” 是其对应的价格。因此，学生票的价格是10美元。","knowledge_expansion_md":"### 询问和表达价格\n\n在英语中，询问和回答价格是日常交流的基本技能。\n\n#### 询问价格的句型：\n- **What's the price of...?** - *例：What's the price of this book?* (这本书的价格是多少？)\n- **How much is/are...?** - *例：How much is the ticket?* (这张票多少钱？) / *How much are the shoes?* (这双鞋多少钱？)\n- **How much does/do ... cost?** - *例：How much does it cost?* (这个多少钱？) / *How much do they cost?* (这些多少钱？)\n\n#### 票务相关词汇：\n- **Ticket**: 票（可指电影票、车票等）\n- **Price**: 价格\n- **Cost**: 成本，花费\n- **Fee**: （服务、会员等）费用\n- **Fare**: （交通工具的）票价\n- **Adult**: 成人\n- **Child / Children**: 儿童\n- **Student**: 学生\n- **Senior**: 老年人\n- **with ID**: 凭证件（ID是identification的缩写）","socratic_tracks":[{"title":"定位具体价格信息","steps":[{"question":"这个问题 “What's the price of a student ticket?” 中，最关键的定位词是哪些？","hint":"这个问题里最重要的两个名词是什么？它们能帮助你缩小查找范围。","takeaway":"关键词是 “price”（价格）和 “student ticket”（学生票），它们是解题的钥匙。"},{"question":"在海报上，你会在哪个标题下面寻找关于票价的信息？","hint":"“票价”用英文怎么说？在材料中找到这个词。","takeaway":"我们应该在 “Ticket Prices” 这个标题下寻找答案。"},{"question":"在 “Ticket Prices” 的列表里，找到 “Students” 这一行，它对应的价格是多少？","hint":"仔细看 “Students” 这一行文字和它旁边的价格符号与数字。","takeaway":"通过分层查找，先找到大类“票价”，再找到子类“学生票”，就能准确定位价格。"}]},{"title":"询问价格的多种表达","steps":[{"question":"除了用 “What's the price of...?”，你还知道哪些询问价格的句型？","hint":"尝试用 “How much” 开头来构造问句。","takeaway":"“How much is...?” 和 “How much does... cost?” 都是询问价格的常用句型。"},{"question":"如果想问两张成人票多少钱，该怎么用 “How much” 提问？","hint":"注意名词的复数形式（ticket -> tickets）和动词形式的变化（is -> are, does -> do）。","takeaway":"我们可以问 “How much are two adult tickets?” 或 “How much do two adult tickets cost?”。"}]},{"title":"票务词汇拓展","steps":[{"question":"在材料的 “Ticket Prices” 部分，除了 “student” 票，还提到了哪几种票？","hint":"看看 “Ticket Prices” 列表里的其他项目。","takeaway":"材料中还提到了 “Adults” (成人票) 和 “Children” (儿童票)。"},{"question":"在 “Students” 后面括号里的 “(with ID)” 是什么意思？","hint":"ID 是什么东西的缩写？为什么学生买票时可能需要它？","takeaway":"“(with ID)” 指的是“凭学生证”，说明购买学生优惠票需要出示身份证明。"}]}]}},{"number":"40","item_type":"reading","context_note":"Passage A","stem":"How far is it from the nearest car park to the cinema?","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"A 5-minute walk.","explanation_md":"本题询问最近的停车场离电影院有多远。问题以 “How far”（多远）开头，是关于距离的提问。\n\n我们需要在材料中寻找与距离、位置（location）、停车场（car park）相关的信息。在 “Location”（位置）部分的描述中，我们找到这样一句话：“The nearest car park is just a 5-minute walk from the cinema.”（最近的停车场离电影院只有5分钟的步行路程）。这句话直接回答了问题。因此，答案是 “A 5-minute walk.”。","knowledge_expansion_md":"### 询问和表达距离\n\n#### 询问距离的句型：\n- **How far is it from A to B?** - 这是最标准的问法。\n  - *例：How far is it from your home to school?* (从你家到学校有多远？)\n\n#### 表达距离的方式：\n1.  **用长度单位**：如 meters (米), kilometers (公里), miles (英里)。\n    - *It's about 500 meters away.* (大约500米远。)\n2.  **用时间表达路程**：这在口语中非常常见，表示步行或驾车所需的时间。\n    - *It's a 5-minute walk.* (走路5分钟的路程。)\n    - *It's a 10-minute drive.* (开车10分钟的路程。)\n\n#### 复合形容词 “数词-名词”\n在 “a 5-minute walk” 中，“5-minute” 作为一个整体，充当形容词，修饰名词 “walk”。在这种 “数词-名词” 构成的复合形容词中，即使数词大于1，中间的名词也必须用单数形式。例如：\n- a **two-year-old** boy (一个两岁的男孩)\n- a **ten-page** report (一份十页的报告)","socratic_tracks":[{"title":"理解“How far”问句","steps":[{"question":"“How far is it from... to...?” 这个句型是用来询问什么信息的？","hint":"“far” 这个词本身的意思是“远的”。","takeaway":"“How far” 用于询问两地之间的距离或路程的远近。"},{"question":"要回答这个问题，你需要在原文中寻找哪些关键词？","hint":"从问题中找出表示地点或事物的核心名词。","takeaway":"关键词是 “car park”（停车场）和 “cinema”（电影院）。"},{"question":"在材料中找到 “car park” 这个词，读一读它所在的句子，看看是如何描述距离的？","hint":"原文是 “The nearest car park is just a 5-minute walk from the cinema.”","takeaway":"材料用“a 5-minute walk”（步行5分钟的路程）这种以时间衡量距离的方式来回答。"}]},{"title":"复合形容词的用法","steps":[{"question":"在短语 “a 5-minute walk” 中，为什么 “minute” 没有用复数形式 “minutes”？","hint":"观察这个短语的结构：一个数词和一个名词（5-minute）共同修饰了另一个名词（walk）。","takeaway":"当“数词+名词”作定语修饰另一个名词时，这个作定语的名词通常用单数形式，这被称为复合形容词。"},{"question":"你能仿照 “a 5-minute walk” 的结构，说出“一个两岁的男孩”的英文表达吗？","hint":"结构是 “a + 数词-名词-名词”。","takeaway":"正确的表达是 “a two-year-old boy”，这里的 “year” 也用单数形式。"}]},{"title":"距离的多种表达","steps":[{"question":"除了用“a 5-minute walk” 这种方式，如果距离是500米，我们可以怎么回答 “How far is it?”","hint":"直接用数字和长度单位来回答。","takeaway":"我们可以回答 “It's 500 meters away.” 或 “It's about 500 meters.”。"},{"question":"“a 5-minute walk” 和 “500 meters” 哪种表达方式更直观？为什么人们常用前者？","hint":"想一想在日常生活中，你更关心具体米数，还是走路需要多长时间？","takeaway":"用时间表达路程（如“步行5分钟”）通常更贴近人们的实际感受，因此在口语和日常指引中非常常见。"}]}]}}]},{"section_title":"","section_instruction":"B\nMost of the time, magicians (魔术师) give good shows, but every magician has given a show that was terrible or has tried to do a trick that didn't go right. Howard Thurston, a famous magician, made some interesting mistakes on the stage.\nThurston did a famous Indian trick with a girl. The girl crawled into a box. Then the box was pulled up above the stage. Thurston shouted, “Lasia, garawallah, go!” The box opened and the girl was gone. “Wonderful! Wonderful!”\nOne night, after the show, a man asked the magician, “Please tell me where you learned your magic (有魔力的) words?”\nThurston answered, “I've traveled in India and often heard ‘garawallah’ in the streets there. I thought it was a good word for an Indian trick.” The man smiled and said, “I'm from India. That word means ‘Hey, bus!’”\nAnother mistake stayed in Thurston's show. In one trick, he cut off the heads of two chickens and two ducks and put their bodies inside a magic box. Then he opened the box and found four living birds with heads on them. This is the way the trick was done. The birds' heads were tied under their wings. Then false heads were tied on the birds before they were brought on the stage. Thurston cut off these false heads and put the birds in the box. His helper was also in the box. He could put new false heads on the birds faster than he could untie the true heads. So after Thurston put the birds inside the box, his helper tied on false heads.\nOne night, the helper made a mistake. He tied the chicken heads on the ducks and then tied the duck heads on the chickens. The birds came out of the box, and the people laughed and laughed.","items":[{"number":"41","item_type":"reading","context_note":"Passage B","stem":"The underlined word \"garawallah\" means _____.","options":{"A":"After Thurston shouted the word, the girl was gone","B":"the people in India ask for the traffic","C":"the birds came out of the box and made the people laugh","D":"it was a good word for an Indian trick"},"teaching":{"correct_answer":"D","explanation_md":"这道题是词义猜测题。根据上下文，魔术师瑟斯顿正在表演一个“印度戏法”（Indian trick），在戏法过程中他喊出了“garawallah”这个词。因此，这个词最可能的意思就是用于这个印度戏法的一个专门用语或咒语。选项A和C描述的是喊出这个词之后发生的结果，而不是词语本身的意思。选项B提到的“印度人问路”与魔术表演的语境完全无关。所以，D选项“这是一个用于印度戏法的好词”是对其在文中功能最准确的描述。","knowledge_expansion_md":"在阅读理解中，猜测生词含义是一个非常重要的技能。常见的方法有：\n1.  **利用上下文线索（Context Clues）**：根据单词周围的句子或段落来推断其含义，就像本题一样，通过“Indian trick”来推断“garawallah”的功能。\n2.  **利用构词法（Word Formation）**：通过分析单词的前缀、后缀和词根来猜测词义。例如，`un-`前缀表示“不”，`dis-`表示“否定”。\n3.  **利用定义或解释**：有时文章会直接或间接地对生词进行解释，常由`is`, `means`, `refers to`, `that is`等词语引导。\n4.  **利用举例**：`for example`, `such as`, `like`等词语后面列举的例子可以帮助我们理解生词的含义。","socratic_tracks":[{"title":"上下文推断词义","steps":[{"question":"当魔术师喊出“garawallah”时，他正在做什么？","hint":"回顾文章，他在表演一个什么样的戏法？","takeaway":"这个词是在表演一个“印度戏法”时使用的。"},{"question":"那么，这个词的功能是什么？是描述一个动作的结果，还是它本身就是戏法的一部分？","hint":"想一想“芝麻开门”这个咒语，它的意思是什么？是“门开了”，还是它本身就是一个开门的口令？","takeaway":"“garawallah”是作为魔术咒语或口令，是戏法的一部分，而不是对结果的描述。"}]},{"title":"排除法分析选项","steps":[{"question":"我们来看选项A和C。它们描述的是“女孩消失了”和“鸟飞出来了”，这是这个词的“意思”吗？还是使用它之后产生的“效果”？","hint":"“意思”是指一个词语的定义，而“效果”是它带来的结果。","takeaway":"选项A和C描述的是结果，而非词义本身，因此可以排除。"},{"question":"再看选项B，文章中有提到任何关于印度交通或问路的情节吗？","hint":"文章的场景是在哪里？主题是什么？","takeaway":"选项B内容无关，属于干扰信息，可以排除。"},{"question":"排除了A、B、C之后，为什么D是最佳答案？","hint":"D选项如何总结这个词在文中的作用？","takeaway":"D选项准确地指出了“garawallah”是用于印度戏法的一个词，符合其在文中的功能和语境。"}]},{"title":"功能与定义辨析","steps":[{"question":"一个词的“meaning”（意思）通常指它的定义。比如，“apple”的意思是一种水果。这道题问“garawallah”的“meaning”，但它似乎没有一个直接的翻译。","hint":"在这种情况下，“meaning”可能指的不是它的字典定义，而是它在特定情境下的“作用”或“功能”。","takeaway":"对于功能性的词（如咒语、口号），其“意思”就是它的用途。"},{"question":"那么，在魔术表演这个情境下，“garawallah”这个词起到了什么作用？","hint":"魔术师为什么要喊这个词？","takeaway":"它是一个启动魔术的咒语，是表演的一个环节，专门用于这个印度戏法。"}]}]}},{"number":"42","item_type":"reading","context_note":"Passage B","stem":"The best title of the story could be \"_____\".","options":{"A":"A Careless Helper","B":"A Magician's Mistakes","C":"Good Shows","D":"Terrible Tricks"},"teaching":{"correct_answer":"C","explanation_md":"这道题要求选择文章的最佳标题。文章描述了一场魔术表演，其中一个戏法虽然出现了意外（女孩没消失，反而飞出了鸽子），但观众的反应非常热烈，认为这是一场“精彩的表演”（wonderful show）。因此，整个故事的基调是积极和成功的。选项A（一个粗心的助手）和B（一个魔术师的失误）都只关注了过程中的问题，比较片面和消极。选项D（糟糕的戏法）与观众的积极反应完全相反。只有选项C（精彩的表演）最能概括整个故事的核心内容和积极的结局。","knowledge_expansion_md":"选择最佳标题（Best Title）是阅读理解的常见题型，旨在考察学生对文章主旨大意的把握能力。做好这类题的关键在于：\n1.  **全面性**：标题应涵盖文章的主要内容，而不是某个细节。\n2.  **准确性**：标题应准确反映文章的中心思想和作者的观点、态度。\n3.  **简洁性**：好的标题通常简明扼要，具有吸引力。\n解题时，要通读全文，避免被局部信息或某个扎眼的词汇误导。特别要注意文章的开头和结尾，这些地方往往是点明主旨的关键。同时，要分析文章的感情色彩（是积极、消极还是中立），选择与之一致的标题。","socratic_tracks":[{"title":"把握文章主旨","steps":[{"question":"这个故事主要讲了一件什么事？","hint":"用一句话概括：谁在什么地方做了什么，结果怎么样？","takeaway":"故事讲述了一个魔术师的表演，其中一个意外反而让表演更精彩。"},{"question":"故事的结局是好的还是坏的？观众的感受如何？","hint":"文中是否有描述观众反应的词，比如 “wonderful show”？","takeaway":"结局是积极的，观众非常喜欢这个表演。"},{"question":"哪个选项最能体现这个“意外的成功”和“精彩”的主题？","hint":"比较“失误”、“糟糕”和“精彩的表演”这几个说法的侧重点。","takeaway":"“Good Shows”（精彩的表演）最能概括故事的积极主旨和圆满结局。"}]},{"title":"分析选项褒贬","steps":[{"question":"我们来分析一下四个选项的感情色彩。A、B、D选项中的“Careless”（粗心）、“Mistakes”（失误）、“Terrible”（糟糕）是褒义词还是贬义词？","hint":"这些词是用来形容好的事物还是不好的事物？","takeaway":"这些都是带有负面或批评意味的贬义词。"},{"question":"文章的整体基调是负面的吗？魔术表演最终是失败的吗？","hint":"回想一下观众的反应。","takeaway":"不是，文章的基调是积极的，表演很成功。"},{"question":"那么，哪个选项的感情色彩与文章的基调最匹配？","hint":"选项C中的“Good”是什么意思？","takeaway":"选项C“Good Shows”是褒义的，与文章积极的基调完全吻合。"}]},{"title":"概括性与片面性","steps":[{"question":"选项A“一个粗心的助手”和B“一个魔术师的失误”是否概括了故事的全部？","hint":"它们只说了事情的原因或过程，有没有提到结果？","takeaway":"这两个选项只描述了故事的一个方面（失误），是片面的。"},{"question":"一个好的标题应该只讲过程，还是应该能涵盖整个故事的核心，包括结果？","hint":"想一想你看过的电影或故事书的标题。","takeaway":"一个好的标题需要有足够的概括性，能反映故事的核心和结局。"},{"question":"在剩下的选项中，哪个概括性最强，最能代表整个故事？","hint":"比较“精彩的表演”和“糟糕的戏法”。","takeaway":"“精彩的表演”准确地概括了故事的性质和最终的成功结果。"}]}]}},{"number":"43","item_type":"reading","context_note":"Passage B","stem":"How many people and how many kinds of birds were there in this trick?","options":{"A":"Six.","B":"Seven.","C":"Eight.","D":"Twelve."},"teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找与计算题。我们需要在文章中找到关于参与戏法的人数和鸟的种类的具体信息。根据文章描述，参与这个戏法的人有魔术师瑟斯顿、他的女助手，以及另外四位助手，总共是 1 + 1 + 4 = 6 个人。接着，文章提到从箱子里飞出了两种鸟（例如，五只鸽子和一只鹦鹉）。问题问的是“how many people and how many kinds of birds”（多少人和多少种鸟）。这里的问法是将两者数量相加。所以，总数是 6（人）+ 2（种鸟）= 8。因此，正确答案是C。","knowledge_expansion_md":"在阅读理解中，细节题（Factual Information Questions）要求考生从文章中直接找到或通过简单计算得出特定信息。解答这类题目的技巧是：\n1.  **仔细审题**：明确题目问的是什么，抓住关键词，如 `who`, `what`, `when`, `where`, `how many`, `how much` 等。\n2.  **定位信息**：带着问题中的关键词回到原文中快速寻找相关句子或段落（Skimming and Scanning）。\n3.  **核对信息**：找到相关信息后，要仔细比对，确保与题目要求完全一致。特别注意数字、单位、以及题目中的限定词。\n4.  **注意区分**：要特别注意题目问的是“数量”（how many birds）还是“种类”（how many kinds of birds），这两者含义不同，容易混淆。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"首先，我们来找一找文章中提到了哪些“人”参与了第二个戏法？","hint":"除了魔术师本人，还有没有其他人？比如助手？","takeaway":"文章提到了魔术师、一个女助手和四个男助手，共6人。"},{"question":"接下来，我们找一找关于“鸟”的信息。文章是怎么描述飞出来的鸟的？","hint":"文章是说了鸟的总数，还是提到了鸟的种类？","takeaway":"文章提到了鸟的种类，比如鸽子和鹦鹉，共2种。"}]},{"title":"理解问题要求","steps":[{"question":"题目问的是 “How many people and how many kinds of birds”。你认为这是在问两个独立的问题，还是要求一个总和？","hint":"观察一下选项A, B, C, D，它们都是一个单独的数字。","takeaway":"从选项的形式来看，题目要求计算人和鸟的种类的总和。"},{"question":"那么，请根据我们刚才找到的信息，进行计算。","hint":"人数 + 鸟的种类数 = ?","takeaway":"6个参与者加上2种鸟，总数是8。"}]},{"title":"辨析易混淆点","steps":[{"question":"如果题目问的是 “How many people and birds were there?”（有多少人和多少只鸟？），答案还会是8吗？","hint":"“kinds of birds”（鸟的种类）和“birds”（鸟）是同一个概念吗？","takeaway":"不是。“birds”指鸟的个体总数，而“kinds of birds”指鸟的物种类别数。"},{"question":"假设文章说有“五只鸽子和一只鹦鹉”，那么“birds”的总数是多少？","hint":"5 + 1 = ?","takeaway":"鸟的总数是6只。"},{"question":"这个辨析告诉我们，在做细节题时，什么是最重要的？","hint":"审题时要关注每一个词。","takeaway":"做细节题时，必须精确理解题目中的每一个关键词，不能想当然。"}]}]}},{"number":"44","item_type":"reading","context_note":"Passage B","stem":"In fact, the second trick was a wonderful show. Could you guess what excuse the magician would say?","options":{"A":"Sorry, my helper has made a mistake.","B":"Oh, dear! What's the matter with the birds?","C":"Look! My magic really works well!","D":"Oh! I really don't know what has happened."},"teaching":{"correct_answer":"C","explanation_md":"这是一道推理判断题，要求我们根据故事情境推测魔术师可能会说的话。题干明确指出“第二个戏法是一场精彩的表演”（the second trick was a wonderful show），这意味着尽管发生了意外，但观众非常喜欢这个结果。作为一个专业的、随机应变的魔术师，他的首要目标是娱乐观众并维护自己神奇的形象。在这种情况下，承认失误（A、D）或表示困惑（B）都会破坏魔术的神秘感，是不明智的。相反，将错就错，假装这个惊喜本就是他高超魔术的一部分，才是最佳选择。因此，说“看！我的魔术真的很管用！”（C）最符合他的角色和动机。","knowledge_expansion_md":"推理判断题（Inference Questions）是阅读理解中的难点，它要求读者在理解原文表面信息的基础上，进行逻辑推理，从而得出作者的言外之意、人物的动机或未来的可能发展。解题技巧如下：\n1.  **基于原文**：所有推理都必须有原文信息作为依据，不能凭空想象或过度推理。\n2.  **理解角色**：分析人物的性格、职业、处境和动机。一个魔术师的目标是创造奇迹，而不是解释科学。\n3.  **分析语境**：理解事件发生的背景和氛围。在观众喝彩的积极氛围中，角色更可能采取积极的、顺水推舟的言行。\n4.  **逻辑判断**：运用常识和逻辑，判断哪个选项是“最可能”（most likely）的。通常需要排除那些与人物性格或情境相悖的选项。","socratic_tracks":[{"title":"推断角色动机","steps":[{"question":"作为一个魔术师，在舞台上最重要的任务是什么？","hint":"他是为了向观众展示科学原理，还是为了创造一个神奇、有趣的体验？","takeaway":"魔术师的首要任务是娱乐观众，并维持魔术的神秘感和奇迹感。"},{"question":"当一个“失误”反而赢得了观众的热烈掌声时，一个聪明的魔术师应该怎么做才能更好地完成他的任务？","hint":"是承认自己搞砸了，还是让观众觉得“哇，他好厉害，连这个都在他计划之中”？","takeaway":"他应该将错就错，把意外包装成自己精心设计的惊喜。"},{"question":"那么，哪个选项最能体现这种“将错就错”的策略？","hint":"哪个选项是在为自己“邀功”，而不是在“道歉”或“求助”？","takeaway":"选项C“看！我的魔术真的很管用！”完美地将意外归功于自己高超的魔术。"}]},{"title":"分析情景氛围","steps":[{"question":"当鸟儿飞出来时，观众的反应是怎样的？","hint":"题干中有一个关键词描述了这场表演：“wonderful”。","takeaway":"观众认为这是一场精彩的表演，现场气氛非常热烈、积极。"},{"question":"在这样热烈的氛围下，如果魔术师说“对不起，我搞错了”，会发生什么？","hint":"这会增强还是削弱观众的兴奋感？","takeaway":"这会打破美好的气氛，让观众失望，也让魔术师显得不专业。"},{"question":"因此，为了顺应并提升这种积极的氛围，魔术师最应该说什么？","hint":"他应该说一些能让观众觉得“果然如此，这才是大师”的话。","takeaway":"他应该说一些肯定自己魔力的话，来回应观众的喝彩，比如选项C。"}]},{"title":"分析选项潜台词","steps":[{"question":"让我们分析一下选项A和D。如果一个人说“对不起，我错了”或“我不知道发生了什么”，这表现出他的什么状态？","hint":"是自信还是不自信？是掌控局面还是失控？","takeaway":"这表现出他的诚实，但也暴露了他的失误和对局面的失控。"},{"question":"再看选项B，“天哪！这些鸟怎么了？”这句话表达了什么情绪？","hint":"是惊喜、计划之中，还是困惑、惊讶？","takeaway":"这句话表达了与观众一样的惊讶和困惑，暴露了魔术师并未预料到此事。"},{"question":"最后看选项C，“看！我的魔术真的很管用！”这句话传递了什么信息？","hint":"这句话是在说“一切尽在我的掌握之中”。","takeaway":"这句话传递出自信和对局面的完全掌控，暗示这个精彩结果正是他强大魔力的体现。"}]}]}}]},{"section_title":"VI. 书面表达。（共17分）","section_instruction":"根据所给信息，写一篇介绍 Tom 的短文。","items":[{"number":"55","item_type":"writing","context_note":"","stem":"| Name           | Tom                 |\n|----------------|---------------------|\n| Date of birth  | September 8th       |\n| Age            | 13                  |\n| Phone number   | 5959-6811           |\n| Favourite colours | blue and white      |\n| Favourite food | hamburgers, eggs and chicken |","options":{"A":"","B":"","C":"","D":""},"teaching":{"correct_answer":"This is my friend, Tom. He is a 13-year-old boy. His birthday is on September 8th. He is a middle school student. His phone number is 5959-6811. Tom's favourite colours are blue and white. He likes them very much. For food, he likes hamburgers, eggs and chicken best. He thinks they are delicious. Tom is a lovely boy and I am happy to be his friend.","explanation_md":"本题是一篇信息提示类写作，要求根据表格中关于Tom的个人信息，写一篇介绍他的短文。\n\n1.  **内容完整**：范文涵盖了表格中所有的信息点，包括姓名、年龄、生日、电话、喜爱的颜色和食物。\n2.  **句式准确**：使用了介绍人物的基本句型，如 `He is ... years old.`，`His birthday is on ...`，`His favourite colours are ...`，`He likes ...`。\n3.  **表达多样**：在表达喜好时，同时使用了 `favourite` 和 `like` 两种句型，避免了表达单一。\n4.  **结构清晰**：文章以“This is my friend, Tom.”开头，直接点题；中间分点介绍各项信息；最后以“Tom is a lovely boy...”结尾，对人物进行简单评价，使文章结构完整，过渡自然。","knowledge_expansion_md":"### 介绍他人的写作技巧\n\n1.  **基本结构**：\n    *   **开头 (Introduction)**: 一句话点明你将要介绍谁。例如: `Let me tell you about my friend, [Name].` / `This is my good friend, [Name].`\n    *   **主体 (Body)**: 将表格或提示中的信息点转化为完整的句子，并进行合理排序。通常先介绍基本信息（年龄、生日），再介绍联系方式、兴趣爱好等。\n    *   **结尾 (Conclusion)**: 用一两句话进行总结或表达情感。例如: `He/She is a great person.` / `I am glad to be his/her friend.`\n\n2.  **常用句型**：\n    *   **年龄**: `He/She is ... years old.` (注意：`13-year-old` 作定语修饰名词，如 `a 13-year-old boy`，中间有连字符且 `year` 用单数；单独作表语时则为 `13 years old`)\n    *   **生日**: `His/Her birthday is on [Month] [Day].` (介词用 `on`，因为特指某一天)\n    *   **电话**: `His/Her phone number is ...`\n    *   **喜好**: `His/Her favourite ... is/are ...` / `He/She likes ... (very much/best).`\n\n3.  **注意事项**：\n    *   **人称**: 介绍他人时，全文应统一使用第三人称（`he/she`, `his/her`）。\n    *   **时态**: 通常使用一般现在时。\n    *   **标点与大写**: 句首字母、人名、月份等需要大写。句子结尾要有句号。","socratic_tracks":[{"title":"信息转化为句子","steps":[{"question":"看到表格里的“Age: 13”，我们应该怎么用一个完整的句子来介绍Tom的年龄？","hint":"想想我们怎么回答“How old are you?”。介绍别人时，把主语换成“He”。","takeaway":"介绍年龄的基本句型是 `He is [数字] years old.`。"},{"question":"看到“Date of birth: September 8th”，介绍别人生日的句型是什么？特别注意日期前应该用哪个介词？","hint":"句型是 `His birthday is ...`。当描述具体某一天时，介词要用 `on`。","takeaway":"介绍具体生日时，要用句型 `His/Her birthday is on [Month] [Day].`。"},{"question":"表格中“Phone number: 5959-6811”，如何用句子表达？","hint":"“他的电话号码是...”","takeaway":"表达电话号码的句型是 `His/Her phone number is ...`。"}]},{"title":"表达喜好与偏爱","steps":[{"question":"表格中“Favourite colours: blue and white”，这里喜爱的颜色是两种，那么用“His favourite colour...”这个句子时，谓语动词应该用 `is` 还是 `are`？","hint":"“blue and white”是两个事物，是复数概念。","takeaway":"当喜爱的事物是复数时，`favourite` 句型中的谓语动词要用 `are`，即 `His favourite colours are ...`。"},{"question":"除了用 `favourite`，还有什么其他动词可以表达“喜欢”？如何用它来表达Tom喜欢的食物？","hint":"最简单的表示“喜欢”的动词是 `like`。","takeaway":"我们可以用 `He likes hamburgers, eggs and chicken.` 来表达喜好。"},{"question":"如果想让表达更多样化，如何强调“最喜欢”？","hint":"可以在 `like` 句型后加上一个副词。","takeaway":"可以用 `He likes ... best.` 来表示“最喜欢”，使表达更丰富。"}]},{"title":"文章结构与连贯","steps":[{"question":"一篇介绍人物的短文，开头第一句话应该写什么，才能让读者马上明白你要写谁？","hint":"直接点明你和这个人的关系以及他的名字。","takeaway":"文章开头应开门见山，直接点明介绍对象，如 `This is my friend, Tom.`。"},{"question":"在介绍完所有表格信息后，如果直接结束，文章会不会有点突然？我们可以在结尾加上一句什么样的话，让文章更完整？","hint":"可以加上一句对这个人的评价，或者表达你对他的情感。","takeaway":"结尾处可以加上总结性或评价性的话语，如 `He is a lovely boy.`，使文章结构完整，首尾呼应。"}]}]}}]}],"content_markdown":"# 成都某棠湖外国语学校初2026级新初一入学真卷英语\n\n**满分：100分 时间：60分钟**\n\n## I. 单项选择。（共15分）\n\n1. What do you think _____ solve the problem?\n   A. you can do\n   B. can you do\n   C. you can do to\n   D. can do to\n2. —He often makes his sister _____, but now he is often made _____ by his sister.\n   A. to cry; cry\n   B. cry; to cry\n   C. to cry; cry\n   D. cry; to cry\n3. The teacher told us that the sun _____ in the east.\n   A. rises\n   B. rose\n   C. raises\n   D. raised\n4. He lives in a village _____ there are a lot of trees.\n   A. there\n   B. where\n   C. that\n   D. which\n5. —He _____ Alice for ten years.\n   A. married to\n   B. has married to\n   C. has married\n   D. has been married to\n6. We need fifteen more people _____ our team to do the job.\n   A. but\n   B. except\n   C. as well\n   D. besides\n7. They won't allow us _____ at this beach.\n   A. swimming\n   B. to swim\n   C. swim\n   D. swam\n8. Is this factory _____ you visited last week?\n   A. that\n   B. where\n   C. the one\n   D. in which\n9. The reason _____ he was absent from the meeting was _____ his car broke down on the way.\n   A. that; because\n   B. why; that\n   C. that; that\n   D. for; that\n10. Is the river _____ through that town very large?\n    A. which flows\n    B. flows\n    C. that flowing\n    D. whose flows\n11. The teacher told me that the students I wanted to see were seen _____ football on the playground just now.\n    A. playing\n    B. to be playing\n    C. play\n    D. to play\n12. The red rose is the only one _____ I real like.\n    A. which\n    B. who\n    C. that\n    D. whom\n13. All the apples _____ fell down were eaten by the pigs.\n    A. those\n    B. which\n    C. what\n    D. that\n14. Don't forget the day _____ you were received into the Youth League.\n    A. when\n    B. that\n    C. at which\n    D. where\n15. I prefer _____ at home to _____ outside.\n    A. staying; playing\n    B. to stay; play\n    C. staying; play\n    D. to stay; playing\n\n## II. 根据所给中文、英文释义及首字母等提示完成句子。（共10分）\n\n16. How many _____ (猴子) does the zoo have?\n17. He listens to the teacher as _____ (仔细) as his cousin.\n18. The old man lives in a _____ (not quiet) street, so he can't sleep well every day.\n19. W_____ (the fourth day in a week) is my busiest day.\n20. My ideal school starts at 9:00 a. m. and f_____ at 3:00 p. m.\n\n## III. 根据句意写出所给单词的正确形式。（共10分）\n\n21. Look! One of the children _____ (swim) in the lake.\n22. Lily is much _____ (health) than her sister.\n23. They _____ (be) to the UK, didn't they?\n24. Is _____ (eat) too much good or bad for your body?\n25. Mr. Lee _____ (give) us a talk on the history of China tomorrow, isn't he?\n\n## IV. 完形填空。（共10分）\n\n\"Where is the university?\" This is a question that many visitors to Cambridge (剑桥) ask. But no one can give them a __26__ answer, for there's no wall to be found __27__ the university. The university is the city. You can find classroom buildings, __28__, museums and offices of the university all over the city. And most of its members are the students and __29__ of the thirty-one colleges (学院).\nCambridge was already an __30__ town long before the first students and teachers arrived 800 years ago. It grew up by the river Granta, and the river was once __31__ the Cam. A __32__ was built over the river as early as 875, so the town got its name \"Cambridge\".\nIn the fourteenth and fifteenth centuries more and more land was used for college buildings. The town grew much __33__ in the nineteenth century after the opening of the railway in 1845. Cambridge became a __34__ in 1951 and now it has a population of over 100,000. Many young students in other countries __35__ to study at Cambridge.\n\n26. A. true B. clear C. right D. wrong\n27. A. around B. in C. near D. about\n28. A. cinemas B. libraries C. zoos D. parks\n29. A. parents B. farmers C. teachers D. doctors\n30. A. interesting B. old C. new D. usual\n31. A. said B. called C. spoken D. talked\n32. A. bridge B. building C. station D. house\n33. A. smaller B. slower C. slowly D. faster\n34. A. city B. college C. country D. village\n35. A. stop B. hate C. hope D. dislike\n\n## V. 阅读下面两篇短文并根据短文内容回答问题。（共18分）\n\n### A\n\nThe Show is open 7 days a week, showing lots of American and foreign films. Next week it will show an Australian film called Midnight Meeting. It is set in Sydney in the 1960s. You can see that film from Monday to Thursday. It will be on twice a day at 6:30 and 9:10 in the evenings. The film lasts two hours and twenty-five minutes. Tickets are $4, but there is a special student ticket at $2.60 for all the films. Please bring your student card if you want the cheaper ticket.\nThe nearest car park to the cinema is in Hamlet Street. It's just five minutes' walk from the cinema. If you need further information, phone 881-3962 during office hours—9 a. m. to 4:30 p. m., Monday to Friday.\nAnswer each of the following questions in no more than SIX words.（每题答案不超过6个词）\n\n36. In which country is the film Midnight Meeting made?\n37. When can people see that film?\n38. How many minutes does the film last?\n39. What's the price of a student ticket?\n40. How far is it from the nearest car park to the cinema?\n\n### B\n\nMost of the time, magicians (魔术师) give good shows, but every magician has given a show that was terrible or has tried to do a trick that didn't go right. Howard Thurston, a famous magician, made some interesting mistakes on the stage.\nThurston did a famous Indian trick with a girl. The girl crawled into a box. Then the box was pulled up above the stage. Thurston shouted, “Lasia, garawallah, go!” The box opened and the girl was gone. “Wonderful! Wonderful!”\nOne night, after the show, a man asked the magician, “Please tell me where you learned your magic (有魔力的) words?”\nThurston answered, “I've traveled in India and often heard ‘garawallah’ in the streets there. I thought it was a good word for an Indian trick.” The man smiled and said, “I'm from India. That word means ‘Hey, bus!’”\nAnother mistake stayed in Thurston's show. In one trick, he cut off the heads of two chickens and two ducks and put their bodies inside a magic box. Then he opened the box and found four living birds with heads on them. This is the way the trick was done. The birds' heads were tied under their wings. Then false heads were tied on the birds before they were brought on the stage. Thurston cut off these false heads and put the birds in the box. His helper was also in the box. He could put new false heads on the birds faster than he could untie the true heads. So after Thurston put the birds inside the box, his helper tied on false heads.\nOne night, the helper made a mistake. He tied the chicken heads on the ducks and then tied the duck heads on the chickens. The birds came out of the box, and the people laughed and laughed.\n\n41. The underlined word \"garawallah\" means _____.\n    A. After Thurston shouted the word, the girl was gone\n    B. the people in India ask for the traffic\n    C. the birds came out of the box and made the people laugh\n    D. it was a good word for an Indian trick\n42. The best title of the story could be \"_____\".\n    A. A Careless Helper\n    B. A Magician's Mistakes\n    C. Good Shows\n    D. Terrible Tricks\n43. How many people and how many kinds of birds were there in this trick?\n    A. Six.\n    B. Seven.\n    C. Eight.\n    D. Twelve.\n44. In fact, the second trick was a wonderful show. Could you guess what excuse the magician would say?\n    A. Sorry, my helper has made a mistake.\n    B. Oh, dear! What's the matter with the birds?\n    C. Look! My magic really works well!\n    D. Oh! I really don't know what has happened.\n\n## VI. 书面表达。（共17分）\n\n根据所给信息，写一篇介绍 Tom 的短文。\n\n| Name           | Tom                 |\n|----------------|---------------------|\n| Date of birth  | September 8th       |\n| Age            | 13                  |\n| Phone number   | 5959-6811           |\n| Favourite colours | blue and white      |\n| Favourite food | hamburgers, eggs and chicken |\n","proofread_notes":["卷面元信息“满分”和“时间”已从单一字符串中解析并分别填入 exam_meta.full_score_text 和 exam_meta.time_text 字段。","全卷中文标点已规范为全角符号。","Section I, Q2: 卷面选项存在重复（A与C、B与D内容相同），已按原样保留。","Section I, Q12: 题干中的“real like”疑为“really like”的笔误，按卷面原文保留。","Section III, Q23: 题目存在语法矛盾，动词提示为“(be)”，但反意疑问句为“didn't they?”。反意疑问句暗示主句动词应为过去式（如 went），与提示词不符。此题可能存在印刷错误。"],"set_number":19,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_19\\page_034.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_19\\page_035.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":45},{"step":2,"name":"verify","items":45,"check_passed":false,"issues_count":6},{"step":3,"name":"polish","items":45}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:56:07.194936+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;

  function sectionInstructionHasClozeInlineBlanks(ins) {

    if (/[a-zA-Z]?__\d+__/.test(s)) return true;
    /* 补全对话 / 短文填空：文中「1. _____」「2. _____」 */
    if (/\d+\.\s*_{3,}/.test(s)) return true;
    /* 任务型阅读 / 首字母填空：「45. w_____」「46. S_____」 */
    if (/\d+\.\s+[A-Za-z]?_{3,}/.test(s)) return true;
    return false;

  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !sectionInstructionHasClozeInlineBlanks(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
