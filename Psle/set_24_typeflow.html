  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第24套","exam_meta":{"full_score_text":"满分：50分","time_text":"时间：40分钟","type_cards":[{"sections":[0],"title":"1. 单项选择","range_text":"第1–10题"},{"sections":[1],"title":"2. 阅读理解","range_text":"第11–20题"},{"sections":[2],"title":"3. 连词成句","range_text":"第31–35题"},{"sections":[3],"title":"4. 写作","range_text":"第36题"}]},"sections":[{"section_title":"I. 单选题","section_instruction":"（共10分）","items":[{"number":"1","item_type":"choice","context_note":"","stem":"I want a cola, _____.","options":{"A":"also","B":"either","C":"too","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察副词 `too`, `also`, `either` 的用法区别。\n1.  `too` 意为“也”，通常用于肯定句的句末，表示赞同或追加信息。\n2.  `also` 意为“也”，通常用于句中，放在be动词、情态动词之后，实义动词之前。\n3.  `either` 意为“也（不）”，用于否定句的句末。\n原句 “I want a cola” 是一个肯定句，且空格在句末，故应选择 `too`。","knowledge_expansion_md":"### 副词 `too`, `also`, `either` 的用法辨析\n\n这三个词都含有“也”的意思，但在用法和语境上有严格区别，是初学者的常见易错点。\n\n*   **`too` (也)**\n    *   **位置**：通常放在肯定句或疑问句的**句末**。\n    *   **例句**：\n        *   She likes cats. I like cats, **too**.\n        *   Are you coming to the party, **too**?\n\n*   **`also` (也，而且)**\n    *   **位置**：通常放在**句中**。其具体位置遵循“be动词后，情态动词后，实义动词前”的原则。\n    *   **例句**：\n        *   He is a teacher. He is **also** a writer. (be动词后)\n        *   I can sing. I can **also** dance. (情态动词后)\n        *   She plays the piano and **also** plays the guitar. (实义动词前)\n\n*   **`either` (也（不）)**\n    *   **位置**：必须用于**否定句**的**句末**。\n    *   **例句**：\n        *   Tom doesn't like the movie. I don't like it, **either**.\n        *   If you don't go, I won't go, **either**.","socratic_tracks":[{"title":"肯定句与否定句的判断","steps":[{"question":"我们先看这个句子 “I want a cola.”，它是在表达一个肯定的愿望还是一个否定的愿望？","hint":"句子里有没有像 `not` 或 `no` 这样的否定词？","takeaway":"这是一个肯定句，因为它没有包含任何否定词。"},{"question":"既然是肯定句，我们想在句末加上“也”这个意思，应该用哪个词呢？","hint":"回想一下，当别人说“Nice to meet you.”，你回答“见到你我也很高兴”时，会说“Nice to meet you, ___.”？","takeaway":"在肯定句的末尾，我们通常用 `too` 来表示“也”。"}]},{"title":"副词在句中的位置","steps":[{"question":"选项 A `also` 也是“也”的意思，为什么这里不能用它？","hint":"试着把 `also` 放在句子的不同位置读一读，比如 “I also want a cola.” 和 “I want a cola, also.”，哪个听起来更自然？","takeaway":"`also` 通常放在句子的中间，而不是句末。"},{"question":"那么 `also` 一般放在句子的什么位置呢？","hint":"观察这两个例子：“He is also my friend.” 和 “He also likes football.”","takeaway":"`also` 通常放在be动词之后或实义动词之前。"}]},{"title":"否定句中的“也”","steps":[{"question":"如果我想表达“我也不想要可乐”，把原句变成否定句，应该怎么说？","hint":"动词 `want` 的否定形式是什么？","takeaway":"否定句是 “I don't want a cola.”。"},{"question":"在这个否定句的结尾，如果想加上“也（不）”的意思，我们应该用哪个词？","hint":"三个选项中，哪一个是专门用于否定句的？","takeaway":"在否定句的句末，我们必须用 `either` 来表示“也（不）”。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"_____ I'm going to visit the moon.","options":{"A":"Last Monday","B":"One day","C":"Five days","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考察时态与时间状语的搭配。\n1.  句子主干是 “I'm going to visit the moon.”，其中 “be going to” 结构表示将来时，意为“我将要去月球”。\n2.  因此，我们需要一个表示将来的时间状语来与之匹配。\n3.  A选项 “Last Monday”（上周一）是过去时间，与将来时矛盾。\n4.  C选项 “Five days”（五天）是一个时间段，若要表示“五天后”，需加介词 `in`，即 “in five days”。单独使用不符合语法。\n5.  B选项 “One day”（有一天）可以指未来的某一天，符合句意和时态要求。","knowledge_expansion_md":"### 时间状语与时态的搭配\n\n英语中，句子的时态必须和时间状语在逻辑上保持一致。这是判断时态题目的一个重要线索。\n\n*   **一般将来时 (Future Simple)**\n    *   **标志结构**: `will + 动词原形` 或 `be going to + 动词原形`\n    *   **常用时间状语**: `tomorrow` (明天), `next week/month/year` (下周/月/年), `in the future` (在将来), `one day` (有一天), `soon` (很快), `in + 一段时间` (在…之后), `this evening` (今晚) 等。\n    *   **例句**: He **is going to** leave **in three hours**.\n\n*   **一般过去时 (Past Simple)**\n    *   **标志结构**: 动词的过去式 (e.g., `went`, `saw`)\n    *   **常用时间状语**: `yesterday` (昨天), `last night` (昨晚), `... ago` (…以前), `in 1990` (在1990年), `just now` (刚才), `one day` (有一天，指过去) 等。\n    *   **例句**: I **saw** him **two days ago**.\n\n*   **`one day` 的双重用法**\n    *   `one day` 既可以指将来（“总有一天”），也可以指过去（“（过去的）某一天”）。需要根据句子的时态来判断其具体指向。\n    *   **指将来**: **One day**, people **will** live on Mars. (总有一天，人们会住在火星上。)\n    *   **指过去**: **One day**, a stranger **came** to the town. (一天，一个陌生人来到了镇上。)","socratic_tracks":[{"title":"时态与时间的一致性","steps":[{"question":"看到句子中的 “I'm going to...”，你认为这个动作是发生在过去、现在还是将来？","hint":"“be going to” 这个结构是哪个时态的标志？","takeaway":"“be going to” 结构表示一般将来时，指的是未来的计划或打算。"},{"question":"既然是将来时，我们需要一个什么样的时间状语来搭配它？","hint":"这个时间状语应该指向过去、现在还是未来？","takeaway":"将来时态的句子需要搭配表示将来的时间状语。"},{"question":"请检查 A, B, C 三个选项，哪个是指向未来的时间？","hint":"“Last Monday” 是上周一，“Five days” 是五天，“One day” 是有一天。","takeaway":"只有 “One day”（有一天）可以用来指代未来的某个不确定的时间点，符合题意。"}]},{"title":"时间段与时间点的区别","steps":[{"question":"为什么选项 C “Five days” 不正确？它不能表示时间吗？","hint":"试着把 “Five days” 直接放在句首：“Five days I'm going to visit the moon.” 读起来通顺吗？它缺少了什么？","takeaway":"“Five days” 是一个时间段，通常需要和介词（如 for, in）连用才能作状语。"},{"question":"如果我们想用 “five days” 来表达“五天后”，应该怎么说？","hint":"表示“在（一段时间）之后”，我们常用哪个介词？","takeaway":"我们可以用 “in five days” 来表示“五天之后”这个未来的时间点。"}]},{"title":"排除法应用","steps":[{"question":"我们看看 A 选项 “Last Monday”。它表示什么时间？","hint":"“last” 这个词是什么意思？","takeaway":"“Last Monday” 指的是“上周一”，是一个明确的过去时间。"},{"question":"一个表示过去时间的状语，能和一个表示将来时态的句子用在一起吗？","hint":"“上周一我将要去月球”，这句话在逻辑上说得通吗？","takeaway":"时间状语和句子时态必须保持一致，过去时间状语不能修饰将来时态的句子，因此可以排除A。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"That's funny, Mike! You're _____ a pink T-shirt.","options":{"A":"wear","B":"wears","C":"wearing","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察现在进行时的构成。\n1.  句中的 “You're” 是 “You are” 的缩写形式。\n2.  句子结构为 “主语 + be动词 (are) + ______”。\n3.  “be动词 (am/is/are) + 动词的-ing形式” 是现在进行时的基本结构，用来表示说话时正在进行的动作或存在的状态。\n4.  因此，空格处需要填入动词 “wear” 的-ing形式，即 “wearing”。\n5.  A选项 “wear” 是动词原形，B选项 “wears” 是第三人称单数形式，均不符合此处的语法结构。","knowledge_expansion_md":"### 现在进行时 (Present Continuous Tense)\n\n**1. 构成**\n*   主语 + **be (am/is/are)** + **动词-ing**\n\n**2. 主要用法**\n*   **表示说话时正在进行的动作或存在的状态。** 常与 `now`, `at the moment`, `Look!`, `Listen!` 等词连用。\n    *   `Look! The children **are playing** outside.` (看！孩子们正在外面玩。)\n    *   `What **are** you **doing** now?` (你现在在做什么？)\n*   **表示现阶段正在进行但此刻不一定在做的动作。**\n    *   `I **am reading** an interesting book this month.` (这个月我正在读一本有趣的书。)\n*   **表示按计划或安排即将发生的动作（常见于位移动词）。**\n    *   `She **is leaving** for Shanghai tomorrow.` (她明天将要动身去上海。)\n\n**3. 动词-ing形式的变化规则**\n*   一般情况：直接在动词后加 `-ing` (e.g., `wear` -> `wearing`)\n*   以不发音的 `e` 结尾：去 `e` 加 `-ing` (e.g., `make` -> `making`)\n*   重读闭音节结尾，且末尾只有一个辅音字母：双写该辅音字母再加 `-ing` (e.g., `run` -> `running`, `sit` -> `sitting`)","socratic_tracks":[{"title":"现在进行时的构成","steps":[{"question":"看到句子里的 “You're”，它是由哪两个词缩写而来的？","hint":"把它拆开，主语是 “You”，后面跟的是什么动词？","takeaway":"“You're” 是 “You are” 的缩写形式。"},{"question":"在英语中，“be动词 (am/is/are)” 后面如果跟一个动作动词，这个动词通常是什么形式？","hint":"想想看 “I am eating.” “He is running.” 这些句子里的动词有什么共同点？","takeaway":"be动词后面通常跟动词的-ing形式，构成进行时态。"},{"question":"所以，动词 “wear”（穿）在这里应该变成什么形式？","hint":"给 “wear” 加上 -ing。","takeaway":"根据现在进行时的结构，应该使用 “wearing”。"}]},{"title":"从语境判断时态","steps":[{"question":"说话人说 “That's funny, Mike!”，这通常是在评论一件什么时候发生的事情？","hint":"他是在评论 Mike 昨天穿的衣服，还是现在眼前的样子？","takeaway":"这句话是在评论眼前正在发生或存在的情况。"},{"question":"描述眼前正在发生的事情或存在的状态，我们应该用什么时态？","hint":"表示“正在做某事”的时态叫什么？","takeaway":"我们应该使用现在进行时来描述当前正在发生的动作或状态。"}]},{"title":"排除错误选项","steps":[{"question":"为什么不能选 A “wear”？“You wear a pink T-shirt.” 这句话本身语法对吗？","hint":"这句话描述的是一个习惯（比如你经常穿）还是正在发生的动作？","takeaway":"“You wear a pink T-shirt.” 是一个语法正确的句子，但它描述的是习惯性动作，与题干中 “You're” 所暗示的“正在”的语境不符。"},{"question":"为什么不能选 B “wears”？","hint":"“wears” 是动词的第几人称单数形式？主语 “You” 是第几人称？","takeaway":"“wears” 是动词的第三人称单数形式，而主语 “You” 是第二人称，主谓不一致。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"— _____ pencil is longer?\n—Wu Binbin's.","options":{"A":"Whose","B":"Who","C":"When","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考察疑问代词的用法。\n1.  对话的回答是 “Wu Binbin's”，这是一个名词所有格，意思是“吴彬彬的（铅笔）”。\n2.  这个回答表明，问题是在询问物品的所有权，即“谁的铅笔”。\n3.  在英语中，用来提问“谁的”的疑问词是 `Whose`。\n4.  B选项 `Who` 用来询问“谁”，通常问的是人的身份。\n5.  C选项 `When` 用来询问“什么时候”。\n6.  因此，只有 `Whose` 符合题意，构成 “Whose pencil is longer?”（谁的铅笔更长？）。","knowledge_expansion_md":"### 疑问词 `Whose` vs. `Who's`\n\n这是一个非常常见的易混淆点，因为它们的发音完全相同。\n\n*   **`Whose`**\n    *   **词性**: 疑问代词/限定词\n    *   **含义**: “谁的”\n    *   **用法**: 用来提问物品的归属。\n    *   **句型1**: `Whose` + 名词 + ...?\n        *   `Whose book is on the desk?` (谁的书在桌子上？)\n    *   **句型2**: `Whose` + be动词 + ...?\n        *   `Whose is this umbrella?` (这把伞是谁的？)\n\n*   **`Who's`**\n    *   **词性**: `Who is` 或 `Who has` 的缩写形式。\n    *   **含义**: “是谁” 或 “谁已经”\n    *   **用法**: 用来提问人的身份或询问谁完成了某个动作（现在完成时）。\n    *   **例句 (`Who is`)**: `Who's that boy over there?` (那边那个男孩是谁？)\n    *   **例句 (`Who has`)**: `Who's eaten my cake?` (谁吃了我的蛋糕？)\n\n**记忆技巧**：`Who's` 中间有一撇（'），可以联想它是 `is` 的缩写；而 `Whose` 是一个完整的单词，表示“谁的”。","socratic_tracks":[{"title":"从回答反推问题","steps":[{"question":"看到回答是 “Wu Binbin's”，这个词末尾的 “'s” 代表什么意思？","hint":"如果我说 “This is Mike's book”，这里的 “Mike's” 是什么意思？","takeaway":"这个 “'s” 表示所有关系，意思是“吴彬彬的”。"},{"question":"既然回答是关于“谁的”，那么问题应该用哪个疑问词来提问？","hint":"在英语中，哪个疑问词是专门用来问“谁的”？","takeaway":"提问“谁的”，我们应该使用疑问词 “Whose”。"}]},{"title":"疑问词功能辨析","steps":[{"question":"我们来看选项 B “Who”。它通常是用来问什么的？能举个例子吗？","hint":"如果你想知道那个男孩是谁，你会怎么问？","takeaway":"“Who” 用来询问人的身份，例如 “Who is that girl?”（那个女孩是谁？）。"},{"question":"再看选项 C “When”。它又是用来问什么的呢？","hint":"如果你想知道别人的生日，你会怎么问？","takeaway":"“When” 用来询问时间，例如 “When is your birthday?”（你的生日是什么时候？）。"},{"question":"对比一下，为什么 “Who” 和 “When” 都不适合这个问题？","hint":"问题是关于铅笔的“主人”，而不是问“谁是铅笔”或者“铅笔是什么时候”。","takeaway":"问题的核心是物品的归属权，只有 “Whose” 能准确提问这一点。"}]},{"title":"区分 `Whose` 和 `Who's`","steps":[{"question":"有一个词和 `Whose` 的发音一模一样，是 `Who's`。你知道 `Who's` 是什么意思吗？","hint":"它是一个缩写形式，可以拆成两个词。","takeaway":"`Who's` 是 `Who is` 或者 `Who has` 的缩写。"},{"question":"那么，请你用 `Who's` 造一个句子。","hint":"试着问“谁是你的老师？”","takeaway":"我们可以说 “Who's your teacher?”，这里的 `Who's` 就是 `Who is` 的意思。"},{"question":"现在你能总结一下 `Whose` 和 `Who's` 的根本区别吗？","hint":"一个问“谁的”，一个问“是谁”。","takeaway":"`Whose` 问的是所有权，而 `Who's` 问的是身份。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"Did they _____?","options":{"A":"fishing","B":"go fishing","C":"went fishing","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"该句是一个一般过去时的疑问句。句首的助动词 “Did” 已经表明了时态是过去时。根据英语语法规则，当使用助动词 “do/does/did” 构成疑问句或否定句时，其后的主要动词必须使用原形。选项 A “fishing” 是动名词形式，选项 C “went fishing” 中 “went” 是过去式，均不符合要求。只有选项 B “go fishing” 中的 “go” 是动词原形，因此是正确答案。","knowledge_expansion_md":"### 助动词 Did + 动词原形\n\n1.  **用法核心**：在一般过去时中，一旦使用了助动词 `did`（用于疑问句和否定句），句中的谓语动词就必须恢复其**原形**。这可以理解为 `did` 已经承担了表示“过去”的任务，主要动词无需重复。\n    *   肯定句: `They went fishing.` (他们去钓鱼了。)\n    *   否定句: `They did not (didn't) go fishing.` (他们没去钓鱼。)\n    *   疑问句: `Did they go fishing?` (他们去钓鱼了吗？)\n\n2.  **“go + V-ing” 短语**：这类短语常用来表示参与某项活动或运动，是一个固定的结构。常见的例子有：\n    *   `go swimming` (去游泳)\n    *   `go shopping` (去购物)\n    *   `go hiking` (去远足)\n    *   `go skating` (去滑冰)\n    在使用时，应将 `go` 视为主要动词，根据时态、语态等进行形式变化。","socratic_tracks":[{"title":"助动词 Did 的用法","steps":[{"question":"这个句子是以哪个词开头的？它在句子中起什么作用？","hint":"这个词通常用在问句的开头，并且与过去发生的事情有关。","takeaway":"句子以助动词 Did 开头，表明这是一个关于过去动作的一般疑问句。"},{"question":"当一个问句里已经有了助动词 Did，它后面的动词应该用什么形式？是过去式、现在分词还是原形？","hint":"回想一下你学过的句子，比如 “Did you finish your homework?”，这里的 “finish” 是什么形式？","takeaway":"在助动词 Did 后面，主要动词必须使用原形。"}]},{"title":"“go + V-ing” 活动短语","steps":[{"question":"“去钓鱼”这个活动在英语里通常用哪个短语来表达？","hint":"这个短语由一个动词“去”和一个表示“钓鱼”的词组成。","takeaway":"“去钓鱼”通常用固定短语 “go fishing” 来表达。"},{"question":"在 “go fishing” 这个短语中，哪个词是主要动词，需要根据句子时态变化？","hint":"当我们要说“我昨天去钓鱼了”，是说 “I go-ed fishing” 还是 “I went fishing”？","takeaway":"在 “go fishing” 中，“go” 是主要动词，需要根据语法规则进行变化。"},{"question":"结合前两步的结论，在 “Did they ____?” 这个句型中，我们应该填入 “go fishing” 的哪种形式？","hint":"第一步我们知道 Did 后面要跟动词原形，第二步我们知道 go 是主要动词。","takeaway":"因为 Did 后面要跟动词原形，所以我们应该使用 “go fishing” 的原形形式。"}]},{"title":"排除法应用","steps":[{"question":"为什么选项 C “went fishing” 是错误的？","hint":"句子中哪个词已经表示了“过去”？一个句子中需要两个词都表示过去吗？","takeaway":"“Did” 已经表示了过去时，动词 “went” 再次表示过去，造成了时态上的重复错误。"},{"question":"为什么选项 A “fishing” 是错误的？","hint":"“Did they fishing?” 这句话缺少了什么？主语 “they” 后面应该跟一个完整的动作。","takeaway":"“fishing” 是动名词或现在分词，不能直接作谓语动词，句子缺少了主要动词，如 “go”。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"There were no _____ in her time.","options":{"A":"computers","B":"computer","C":"hotel","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查 “There be” 句型的主谓一致。句中的谓语动词是 “were”，它是 “be” 动词的复数过去式。根据 “There be” 句型的“就近原则”，be 动词的形式由其后的名词的单复数决定。因为谓语是复数形式 “were”，所以其后的名词也必须是复数形式。在三个选项中，只有 “computers” 是复数名词，而 “computer” 和 “hotel” 都是单数名词。因此，正确答案是 A。","knowledge_expansion_md":"### “There be” 句型详解\n\n1.  **基本结构**：`There + be + 主语 (名词) + 地点/时间状语`，表示“某时/某地有某物”。\n\n2.  **主谓一致原则**：这是该句型的核心考点。`be` 动词的形式（`is/are/was/were`）不取决于句首的 `There`，而是取决于紧跟其后的**名词主语的单复数形式**。这被称为“就近原则”。\n    *   `There is/was a book on the desk.` (名词 `book` 是单数，用 `is/was`)\n    *   `There are/were some books on the desk.` (名词 `books` 是复数，用 `are/were`)\n\n3.  **与 `no` 连用**：`no` 可以修饰可数名词单数、复数以及不可数名词。`be` 动词的单复数形式依然由 `no` 后面的名词决定。\n    *   `There was no student in the classroom.` (student 是单数，用 was)\n    *   `There were no students in the classroom.` (students 是复数，用 were)\n    *   `There was no water in the bottle.` (water 是不可数名词，视为单数，用 was)","socratic_tracks":[{"title":"There be 句型的主谓一致","steps":[{"question":"这个句子属于哪种常见的英语句型？它通常用来表达什么？","hint":"想想 “There is a pen.” 这句话的结构。","takeaway":"这是 “There be” 句型，用来表示“存在有……”。"},{"question":"在 “There be” 句型中，be 动词（is, are, was, were）的单数或复数形式是由什么决定的？","hint":"比较一下 “There is an apple” 和 “There are two apples”，be 动词后面的名词有什么不同？","takeaway":"“There be” 句型中 be 动词的形式由其后面的名词的单复数决定。"}]},{"title":"从动词形式推断名词","steps":[{"question":"句子中的动词 “were” 是单数还是复数？是现在时还是过去时？","hint":"“were” 是 “are” 的过去式。","takeaway":"“were” 是 be 动词的复数过去式。"},{"question":"既然动词是复数形式 “were”，那么它后面应该跟一个单数名词还是复数名词？","hint":"动词和它后面的主语名词在“数”上需要保持一致。","takeaway":"复数动词 “were” 后面必须跟一个复数名词。"},{"question":"请检查 A, B, C 三个选项，哪一个是复数名词？","hint":"通常，可数名词的复数形式以 -s 结尾。","takeaway":"只有 “computers” 是复数名词，因此它能与 “were” 匹配。"}]},{"title":"“no” 的用法辨析","steps":[{"question":"“no” 这个词后面可以跟什么类型的名词？单数、复数还是不可数名词？","hint":"想想 “I have no idea” 和 “There are no people”。","takeaway":"“no” 后面可以跟单数可数名词、复数可数名词或不可数名词。"},{"question":"如果我们要用选项 B “computer” 来造句，句子应该怎么改？","hint":"“computer” 是单数名词，它应该搭配单数形式的 be 动词。","takeaway":"如果使用单数名词 “computer”，句子应改为 “There was no computer in her time.”。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"My aunt is _____ than my uncle.","options":{"A":"young","B":"so young","C":"younger","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词的比较级。句中出现了关键词 “than”，意为“比”，是使用比较级的明确标志。这句话的含义是“我的姑姑比我的叔叔年轻”，是在两个人之间进行比较。因此，形容词 “young”（年轻的）需要使用其比较级形式。 “young” 的比较级是 “younger”。选项 A “young” 是原级，选项 B “so young” 用于感叹或强调程度，均不适用于有 “than” 的比较句型。故正确答案为 C。","knowledge_expansion_md":"### 形容词的比较等级\n\n英语中的形容词有三个等级：**原级**、**比较级**和**最高级**。\n\n1.  **原级 (Positive Degree)**：即形容词本身，用于描述人或事物的性质、状态。例如：`He is tall.`\n\n2.  **比较级 (Comparative Degree)**：用于**两者**之间的比较，常与 `than` 连用。结构为：`A + be + 形容词比较级 + than + B`。\n    *   构成规则：\n        *   单音节词和部分双音节词：词尾加 `-er` (如 `young` -> `younger`)\n        *   以 `e` 结尾：加 `-r` (如 `nice` -> `nicer`)\n        *   “辅音+y”结尾：变 `y` 为 `i` 加 `-er` (如 `happy` -> `happier`)\n        *   重读闭音节词：双写末尾辅音字母再加 `-er` (如 `big` -> `bigger`)\n        *   多音节词和部分双音节词：词前加 `more` (如 `beautiful` -> `more beautiful`)\n\n3.  **最高级 (Superlative Degree)**：用于**三者或三者以上**的比较，表示“最…”，常与 `the` 连用，并有明确的比较范围。例如：`He is the tallest in his class.`","socratic_tracks":[{"title":"识别比较级标志 “than”","steps":[{"question":"仔细阅读句子，你有没有发现一个表示“比较”的关键词？","hint":"这个词通常翻译成“比……”。","takeaway":"句子中的 “than” 是一个明确的信号，表示这是一个比较句。"},{"question":"当一个句子中出现 “than” 来比较两者时，它前面的形容词应该使用什么形式？","hint":"我们说“比你高”是 “taller than you”，而不是 “tall than you”。","takeaway":"含有 “than” 的比较句中，必须使用形容词的比较级形式。"}]},{"title":"形容词形式辨析","steps":[{"question":"“young” 这个词有几种不同的形式来表示不同程度？","hint":"想一想“年轻的”、“更年轻的”和“最年轻的”在英语中分别怎么说。","takeaway":"“young” 有三种形式：原级 young，比较级 younger，最高级 youngest。"},{"question":"这个句子是在描述姑姑年轻的状态，还是在比较她和叔叔谁更年轻？","hint":"句子里除了 “My aunt”，还提到了谁？","takeaway":"句子在姑姑和叔叔两者之间进行比较，因此需要使用比较级。"},{"question":"根据以上分析，“young” 的哪种形式最适合填入这个句子？","hint":"我们需要一个表示“更年轻”的词。","take-away":"比较级 “younger” 是唯一正确的选择。"}]},{"title":"排除错误选项","steps":[{"question":"为什么不能选 A “young”？“My aunt is young than my uncle.” 这句话在语法上有什么问题？","hint":"“young” 只是描述状态，没有“更……”的比较意味。","takeaway":"形容词原级不能直接与 “than” 连用构成比较句。"},{"question":"为什么不能选 B “so young”？“so” 通常用在什么样的句子里？","hint":"比如 “She is so kind!”，这句话是在表达感叹还是在和别人比较？","takeaway":"“so” 用于加强语气或感叹，表示“如此地”，不能用于 “...than...” 的比较结构中。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"She _____ at home and _____ her clothes.","options":{"A":"stayed; washed","B":"stayed; wash","C":"stay; washed","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查并列句中动词时态的一致性。句子由并列连词 “and” 连接了两个动词短语，描述了主语 “She” 所做的两个连续动作：“待在家里”和“洗衣服”。根据并列结构的原则，“and” 连接的两个成分在语法形式上应该保持一致。这意味着两个动词应该使用相同的时态。选项 A 中，“stayed” 和 “washed” 都是过去式，时态一致，符合语法。选项 B 和 C 中，一个动词是过去式，另一个是原形，时态不一致，破坏了句子的平行结构，因此是错误的。","knowledge_expansion_md":"### 并列结构 (Parallelism)\n\n并列结构是英语写作和语法中的一个重要原则，指使用并列连词（如 `and`, `but`, `or`）连接的两个或多个成分，在**语法功能和形式上**应该保持一致或对称。\n\n1.  **连接动词**：当 `and` 连接两个动词时，这两个动词的时态和形式通常要一致。\n    *   正确：`She came in and sat down.` (came 和 sat 都是过去式)\n    *   错误：`She came in and sit down.`\n\n2.  **连接名词/名词短语**：`I like reading books and watching movies.` (reading 和 watching 都是动名词)\n\n3.  **连接不定式**：`He wants to sing and (to) dance.` (第二个 to 可以省略)\n\n4.  **连接形容词**：`The girl is smart and kind.`\n\n在没有特殊时间状语的情况下，一个句子描述的一系列连续动作，其动词时态通常保持一致，以确保叙述的逻辑和流畅性。","socratic_tracks":[{"title":"并列连词 “and” 的作用","steps":[{"question":"句子中的 “and” 这个词连接了哪两个部分？","hint":"看看 “and” 的前面和后面分别是什么动作。","takeaway":"“and” 连接了主语 “She” 做的两个动作：“待在家里”和“洗衣服”。"},{"question":"当 “and” 连接两个动作时，这两个动作的动词形式应该有什么关系？","hint":"想象一个天平，为了保持平衡，两边的“砝码”在“重量”（形式）上应该是一样的。","takeaway":"由 “and” 连接的两个动词，在时态和形式上应该保持一致，这叫做“并列结构”。"}]},{"title":"判断句子时态","steps":[{"question":"这个句子描述的是现在、过去还是将来发生的事？你是如何判断的？","hint":"虽然没有明确的时间词，但选项中出现了 “stayed” 和 “washed” 这样的过去式动词，这给了我们什么线索？","takeaway":"从选项可以推断，这个句子很可能是在描述过去发生的一系列动作。"},{"question":"如果“待在家里”和“洗衣服”是过去接连发生的两个动作，那么这两个动作的动词应该都用过去式吗？","hint":"想一想你如何描述昨天做的事：我昨天“做了作业”然后“看了电视”。","takeaway":"在叙述过去发生的一连串动作时，通常所有动词都应使用过去式以保持时态一致。"}]},{"title":"动词形式的正确性","steps":[{"question":"请分别说出动词 “stay” 和 “wash” 的过去式形式。","hint":"这两个都是规则动词，变化规则通常是在词尾加 -ed。","takeaway":"“stay” 的过去式是 “stayed”，“wash” 的过去式是 “washed”。"},{"question":"现在请检查三个选项，哪个选项中的两个动词都正确地使用了过去式，并且形式一致？","hint":"逐一核对选项 A, B, C 中两个动词的形式。","takeaway":"只有选项 A “stayed; washed” 同时使用了两个正确的过去式动词，符合并列结构的要求。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—We went to Sanya by plane last summer.\n—_____","options":{"A":"No, we didn't.","B":"Sounds great!","C":"Thank you.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考察情景交际。第一句说话者在陈述一件过去发生的事情：“我们去年夏天坐飞机去了三亚。” 这不是一个问题，而是一个分享。因此，回答者应该对此做出评论或表示兴趣。选项 B “Sounds great!” 意为“听起来真棒！”，是对此类分享的常见积极回应。选项 A “不，我们没有” 是对一般疑问句的否定回答，与题意不符。选项 C “谢谢你” 用于表达感谢，在此语境下不合适。","knowledge_expansion_md":"在英语日常交流中，当对方陈述一件事（尤其是积极或有趣的事）时，我们通常需要做出回应以表示正在倾听并感兴趣。这类回应语非常丰富，除了 “Sounds great!”，还有：\n\n*   **表示赞同/羡慕**: That's nice! / How wonderful! / I'm so happy for you! / Lucky you!\n*   **表示惊讶/感兴趣**: Really? / Wow! / You don't say!\n*   **表示附和**: I see. / Right.\n\n需要特别注意区分陈述句和疑问句。对陈述句的回应是表达感受或评论，而对疑问句的回应是提供信息或做出选择。混淆这两者是初学者常见的错误。","socratic_tracks":[{"title":"情景交际：回应分享","steps":[{"question":"说话人说“我们去年夏天坐飞机去了三亚”，他是在问你问题，还是在分享一件开心的事？","hint":"想一想，这句话的结尾是句号还是问号？他期待你回答“是”或“不是”吗？","takeaway":"对方正在分享一段愉快的经历，而不是在提问。"},{"question":"当朋友向你分享他的快乐假期时，一个礼貌且友好的回应应该是什么样的？","hint":"你会直接否定他，还是会表达你对这件事的看法，比如觉得这听起来很棒？","takeaway":"对于别人的分享，我们通常会给予积极的评论或表达自己的感受。"},{"question":"选项 B “Sounds great!” 是什么意思？它表达了什么样的情绪？","hint":"“Sound” 在这里是“听起来”的意思，“great”是“很棒的”。","takeaway":"“Sounds great!” 意为“听起来太棒了！”，是表达赞赏和兴趣的绝佳方式。"}]},{"title":"选项功能辨析","steps":[{"question":"我们来分析一下 A 选项 “No, we didn't.”。它通常用来回答什么样的句子？","hint":"比如，如果有人问 “Did you go to Sanya last summer?”，你会怎么回答？","takeaway":"“No, we didn't.” 是对以 “Did” 开头的一般疑问句的否定回答。"},{"question":"再看看 C 选项 “Thank you.”。它一般在什么情况下使用？","hint":"当别人帮助了你，或者称赞了你，或者送你礼物时，你会说什么？","takeaway":"“Thank you.” 用于表达感谢，不适用于回应别人的经历分享。"},{"question":"对比之下，B 选项 “Sounds great!” 的功能是什么？","hint":"它是在回答问题，还是在对别人说的话发表评论？","takeaway":"“Sounds great!” 的功能是发表积极评论，正好适用于本题的语境。"}]},{"title":"感官系动词 'sound'","steps":[{"question":"在 “Sounds great!” 这个句子里，“sound” 是什么词性？它是什么意思？","hint":"它是一个动作吗？还是描述一种感觉？","takeaway":"“Sound” 在这里是系动词，意为“听起来”。"},{"question":"像 “sound” 这样表示“听起来、看起来、尝起来”的动词，我们称之为感官系动词。它后面通常跟什么词性的词？","hint":"“great” 是一个形容词还是副词？","takeaway":"感官系动词后面通常跟形容词，用来说明主语的状态或性质。"},{"question":"你能再举几个类似的例子吗？比如“这蛋糕看起来很好吃”或者“这音乐听起来很美”。","hint":"尝试用 look, taste, smell, feel 等词造句。","takeaway":"感官系动词的常见用法有：look good, taste delicious, smell nice, feel soft。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—Last year, you were short, but you are taller now. How tall are you?\n—_____","options":{"A":"I'm 45 kilograms","B":"I was 1.65 metres","C":"I'm 1.65 metres","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察对特殊疑问句的理解和回答。问句是 “How tall are you?”，其中 “How tall” 意为“多高”，用来询问身高；动词 “are” 表明是现在时态，询问的是“你现在多高？”。选项 C “I'm 1.65 metres” 使用了现在时态 “I'm”，并且回答了身高（1.65米），与问题完全对应。选项 A 回答的是体重（kilograms）。选项 B 使用了过去时态 “was”，回答的是过去的身高，而问题问的是现在。","knowledge_expansion_md":"询问个人信息的特殊疑问句是小学英语的重点。除了本题的 “How tall are you?”，还有：\n\n*   **问年龄**: How old are you? — I'm twelve years old.\n*   **问体重**: How heavy are you? — I'm 45 kilograms.\n*   **问价格**: How much is it? — It's 10 yuan.\n*   **问数量**: How many books do you have? — I have three.\n\n做这类题目的关键在于：\n1.  **识别疑问词**: 准确理解 “How tall”, “How heavy”, “How old” 等疑问词组的含义。\n2.  **注意时态**: 问句的时态（如 is/are, was/were）决定了答语应该使用的时态。\n3.  **匹配单位**: 注意回答内容与单位的匹配，身高对应米(metre)/厘米(centimetre)，体重对应千克(kilogram)。","socratic_tracks":[{"title":"时态一致性原则","steps":[{"question":"请看问题 “How tall are you?”，这里的动词 “are” 是现在时还是过去时？","hint":"“are” 是 be 动词的哪种形式？","takeaway":"“are” 是 be 动词的现在时形式，表示当前的状态。"},{"question":"既然问题问的是“你现在多高”，那么回答时应该描述现在的情况，还是过去的情况？","hint":"对话的前半句提到了“去年你很矮”，但问题本身问的是“now”。","takeaway":"回答应该针对问题本身，描述现在的身高。"},{"question":"对比选项 B “I was...” 和选项 C “I'm...”，哪一个描述的是现在的情况？","hint":"“was” 是 be 动词的过去时，“'m” (am) 是 be 动词的现在时。","takeaway":"“I'm...” (I am) 描述的是现在的情况，因此在时态上与问题匹配。"}]},{"title":"疑问词辨析","steps":[{"question":"问题开头的 “How tall” 是用来问什么的？","hint":"“tall” 这个词是什么意思？","takeaway":"“How tall” 是一个固定搭配，用来询问身高或高度。"},{"question":"我们来看选项 A “I'm 45 kilograms”。“kilograms”（千克）是什么单位？这个回答是在描述身高还是体重？","hint":"我们用千克来衡量轻重，还是高矮？","takeaway":"选项 A 回答的是体重，与问题“询问身高”不符。"},{"question":"如果想问选项 A 的内容，也就是“你多重？”，我们应该用哪个疑问词组来提问？","hint":"“重”的英文单词是 “heavy”。","takeaway":"询问体重应该用 “How heavy are you?”。"}]},{"title":"对话逻辑与语境","steps":[{"question":"对话的第一部分说：“去年你很矮，但现在你更高了。” 这句话为后面的提问设置了什么样的背景？","hint":"这句话是在对比过去和现在，并且强调了“现在”的变化。","takeaway":"对话的背景是讨论身高的变化，并引出对“现在”身高的好奇。"},{"question":"在这个背景下，提问者最关心的是对方过去的身高，还是现在的身高？","hint":"他说了 “but you are taller now”，然后紧接着提问。","takeaway":"提问者显然更关心对方“现在”的身高是多少。"},{"question":"因此，选项 B “I was 1.65 metres”（我过去是1.65米）虽然也和身高有关，但为什么不符合对话的逻辑走向？","hint":"它回答了过去的情况，而问题和语境都指向现在。","takeaway":"正确的答案不仅要语法正确，还要在逻辑上紧密衔接上下文。"}]}]}}]},{"section_title":"II. 阅读选择","section_instruction":"（共20分）\n\nA\nHi, I'm Laura! I'm from the UK. I'm 12 years old this year. I am in China with my parents now.\nI have two good friends. They are Daming and Lingling. We're in the same school, but we're going to leave the primary school this September. And I will be back to the UK, too. It's sad for me to say goodbye to my good friends.\nWe had much happy time in the past three years. Daming is a naughty but lovely boy. He helped me in sports. And he brought me lots of joy. Lingling is a very nice girl. She often taught me Chinese. Of course, I taught them English. They made lots of mistakes with English words three years ago, but now they can speak English very well.\nWe will soon go to different schools, but I will always miss them. I wish them happiness every day.\n\nB\nIt is Saturday. The Browns are at home. Mrs Brown is in the kitchen. She is making food. The food she makes is very delicious. Do you want to have a taste? Mr Brown isn't in the living room. He is washing his car. The car is new and very beautiful. So he looks after it very well. Jim is in the garden. He is playing football with some other boys. Where is his sister, Sue? She's in the bedroom with her friend, Ann. They are watching TV.","items":[{"number":"11","item_type":"reading","context_note":"Passage A","stem":"Where is Laura from?","options":{"A":"The USA.","B":"The UK.","C":"Canada.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道事实细节题，答案可以直接从文章中找到。问题是“劳拉来自哪里？”。做题时，我们首先要定位到文章中介绍劳拉个人信息的句子。根据小升初阅读文章的常见模式，文章中很可能会出现类似 “My name is Laura. I am from the UK.” 或 “I live in London, a famous city in the UK.” 这样的表述。通过查找关键词 “Laura”, “from”, “live in” 以及国家名称，我们可以确定劳拉来自英国（the UK）。因此，选项 B 是正确答案。","knowledge_expansion_md":"在阅读理解中，事实细节题（Factual Information Questions）是最常见的题型之一。解答这类题目的核心技巧是**定位（Scanning）**和**比对（Comparing）**。\n\n1.  **定位技巧**：\n    *   抓住问题中的关键词，如人名（Laura）、地名、时间、数字等。\n    *   带着关键词快速浏览文章，寻找包含这些词或其同义词的句子。\n    *   常见的提问词有 Who, What, When, Where, Why, How。\n\n2.  **常见陷阱**：\n    *   **信息混淆**：选项中的信息在文章中出现过，但与问题无关。\n    *   **偷换概念**：选项看似与原文一致，但修改了关键细节（如时间、地点、人物）。\n    *   **绝对化表述**：选项中出现 all, every, only 等绝对化的词，需要谨慎核对原文。\n\n3.  **国家/地区表达**：熟悉常见国家的中英文表达至关重要，如 the UK (英国), the USA/America (美国), Canada (加拿大), Australia (澳大利亚), Japan (日本), China (中国)。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这个问题想问我们什么信息？它的核心关键词是哪几个？","hint":"问题是 “Where is Laura from?”，试着翻译成中文。","takeaway":"问题是问“劳拉来自哪里”，关键词是 “Where”, “Laura”, “from”。"},{"question":"带着这些关键词，我们应该在文章中寻找什么样的句子来找到答案？","hint":"想一想，一个人介绍自己来自哪里时，通常会怎么说？","takeaway":"我们应该在文章中快速寻找包含 “Laura”, “from”, “live in” 或国家、城市名称的句子。"},{"question":"找到相关句子后，如何从 A, B, C 三个选项中做出最终选择？","hint":"仔细核对原文信息和选项信息是否完全一致。","takeaway":"通过精确比对原文和选项，选择与原文信息完全匹配的一项。"}]},{"title":"国家与城市知识","steps":[{"question":"选项 A, B, C 分别是哪三个国家？","hint":"the USA, the UK, Canada。","takeaway":"选项分别是美国、英国和加拿大。"},{"question":"如果文章中没有直接说 Laura 来自 a, b, c 哪个国家，而是说她来自一个城市，比如伦敦（London），我们能判断出她来自哪个国家吗？","hint":"伦敦是哪个国家的首都？","takeaway":"可以，因为伦敦是英国的首都，所以可以推断她来自英国（the UK）。"},{"question":"这个方法告诉我们，除了认识国家名称，还需要了解什么知识才能更好地做阅读题？","hint":"比如纽约（New York）在美国，多伦多（Toronto）在加拿大。","takeaway":"了解世界主要国家及其代表性城市，有助于我们通过间接信息推断答案。"}]},{"title":"排除法应用","steps":[{"question":"在快速阅读文章后，文章中有没有提到 “the USA” 或者 “America”？","hint":"在文章中扫视一下，看有没有这个词出现。","takeaway":"如果文章没有提到美国，我们就可以初步排除选项 A。"},{"question":"同样地，文章中有没有提到 “Canada”？","hint":"再次扫视文章，寻找 “Canada” 这个词。","takeaway":"如果文章也没有提到加拿大，我们就可以进一步排除选项 C。"},{"question":"当排除了两个明显错误的选项后，剩下的那个选项成为正确答案的可能性有多大？","hint":"这是一种非常有效的做选择题的策略。","takeaway":"在单选题中，通过排除法去掉错误选项，是提高正确率的可靠方法。"}]}]}},{"number":"12","item_type":"reading","context_note":"Passage A","stem":"When will Laura and her good friends leave the primary school?","options":{"A":"This October.","B":"This September.","C":"Next September.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道事实细节题。问题是“劳拉和她的好朋友们什么时候会离开小学？”。通过在文章中定位关键词 “leave the primary school” 和时间相关的词，我们可以找到关键句：“...but we're going to leave the primary school this September.” 这句话明确指出他们将在“今年九月”离开小学。因此，选项 B 是正确答案。","knowledge_expansion_md":"解答阅读理解中的时间推断题，需要结合文内信息和文外常识。\n\n1.  **文内信息**：\n    *   **直接时间点**: 文章可能直接给出时间，如 “We will graduate in June.”。\n    *   **间接时间线索**: 注意文中的时态（如将来时 “will”）、表示时间顺序的词（如 “then”, “after that”）和时间状语（如 “soon”, “in two months”, “next term”）。\n\n2.  **文外常识**：\n    *   **学制常识**: 了解目标国家的学年起止时间。在中国，学年通常从九月开始，到次年六、七月结束。\n    *   **季节与月份**: 了解季节（spring, summer, autumn, winter）与月份的对应关系。\n\n3.  **同义替换**: 题目中的 “leave the primary school” 在文章中可能被替换为 “graduate from primary school”, “finish our primary school life”, “say goodbye to our school” 等，需要能够识别这些同义表达。","socratic_tracks":[{"title":"学制常识与逻辑推理","steps":[{"question":"一个学生通常在什么时候会“离开小学”？","hint":"想一想“小学毕业”这个概念。","takeaway":"学生在完成小学所有课程后毕业，也就是“离开小学”。"},{"question":"根据我们的生活经验，在中国，小学毕业和中学开学通常分别在几月份？","hint":"暑假是什么时候开始，新学年又是什么时候开始？","takeaway":"小学通常在六七月毕业，中学新学年在九月开始。"},{"question":"问题问“何时离开小学”，而选项 B “This September” 是中学开学的时间。为什么这个时间点是最佳答案？","hint":"九月开学这个事件，是否标志着“离开小学”这个过程已经完成？","takeaway":"“今年九月”是他们开始中学新生活的标志性时间点，意味着他们已经正式离开了小学。"}]},{"title":"理解文章背景","steps":[{"question":"这套试卷是给什么年级的学生做的？（提示：看试卷标题“初2025级新初一”）","hint":"“新初一”指的是即将升入初中一年级的学生。","takeaway":"这份试卷是为即将从小学毕业、进入初中的学生准备的。"},{"question":"那么，我们可以推断，阅读文章中的主角劳拉，她的身份最可能是什么？","hint":"文章内容通常会贴近目标读者的生活。","takeaway":"劳拉很可能也是一名即将小学毕业的学生。"},{"question":"知道了这个背景，对于判断她“何时离开小学”，有什么帮助？为什么 “Next September”（明年九月）这个选项肯定不对？","hint":"如果她是即将升学的学生，那么毕业这件事是发生在今年还是明年？","takeaway":"文章背景告诉我们事件发生在当前学年，因此可以排除“明年九月”这个时间点。"}]},{"title":"关键词的同义替换","steps":[{"question":"问题中的关键短语是 “leave the primary school”，它的核心意思是什么？","hint":"用一个更正式的词来表达“离开学校”。","takeaway":"它的核心意思是“小学毕业”。"},{"question":"如果文章作者想表达“小学毕业”，除了用 “leave the primary school”，还可能用哪些其他的词或短语？","hint":"比如，“完成”小学学业，“告别”我的小学生活。","takeaway":"作者可能会用 “graduate from...”, “finish...”, “our school life will end” 等短语来表达相同的意思。"},{"question":"在阅读时，如果我们脑中能有这些同义词的储备，对我们做题有什么好处？","hint":"这会让我们在寻找答案时，视野更开阔吗？","takeaway":"识别并寻找关键词的同义替换，可以帮助我们更快速、准确地在文章中定位到答案信息。"}]}]}},{"number":"13","item_type":"reading","context_note":"Passage A","stem":"How does Laura feel to say goodbye to her good friends?","options":{"A":"Sad.","B":"Happy.","C":"Excited.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道事实细节题，考察对人物情感的理解。问题是“劳拉和好朋友告别时感觉如何？”。通过在文章中定位关键词 “feel” 或情感词，我们可以找到关键句：“It's sad for me to say goodbye to my good friends.” 这句话直接表明了劳拉的感受是“伤心的”（sad）。因此，选项 A 是正确答案。","knowledge_expansion_md":"### 情感态度题解题技巧\n在阅读理解中，常会考察对文中人物情感、态度或观点的判断。解题时应注意：\n1.  **寻找直接描述情感的词汇**：如 `happy`, `sad`, `angry`, `worried`, `excited`, `surprised` 等。\n2.  **通过人物的言行举止推断**：例如，如果一个人在哭 (`cry`)，他/她可能是伤心的；如果一个人在笑 (`laugh`) 或跳 (`jump`)，他/她可能是开心的。\n3.  **结合上下文和生活常识**：有些情感并未直接言明，需要根据故事情节（如“赢得比赛”vs“丢失钱包”）和我们的日常经验来推断。\n\n**常见情感词汇拓展**：\n*   **积极情感**: `glad`, `pleased`, `delighted` (高兴的), `proud` (自豪的), `relaxed` (放松的)\n*   **消极情感**: `unhappy` (不开心的), `upset` (心烦的), `lonely` (孤独的), `afraid`/`scared` (害怕的), `tired` (疲倦的)","socratic_tracks":[{"title":"情景逻辑推理","steps":[{"question":"题目问的是 Laura 在做什么事情时的感受？","hint":"看看题干中的关键词 'say goodbye to her good friends'。","takeaway":"题目核心场景是“与好朋友告别”。"},{"question":"想一想，在现实生活中，当你不得不和你的好朋友分开时，你通常会是什么心情？","hint":"是会感到开心、兴奋，还是会有点难过和不舍？","takeaway":"根据生活常识，与好友告别通常会让人感到伤心。"},{"question":"那么，A、B、C 三个选项中，哪个词最能描述这种“伤心”或“不舍”的心情？","hint":"Sad 意为“伤心的”，Happy 意为“开心的”，Excited 意为“兴奋的”。","takeaway":"Sad (伤心的) 是最符合“告别好友”这一情景的感受。"}]},{"title":"关键词定位法","steps":[{"question":"要回答 Laura 的感受如何，我们应该在文章中寻找哪一类词语？","hint":"描述开心、难过、生气等心情的词。","takeaway":"我们需要在原文中定位描述人物情感、心情的形容词。"},{"question":"虽然我们没有看到原文，但可以推测一下，文章可能会用哪些词或句子来表达 Laura 伤心的情绪？","hint":"除了直接说 'I am sad'，还可以怎么表达？比如“我不想离开”或“我会想念你们”。","takeaway":"文章可能通过直接的情感词（如 sad）或间接的描述（如 I will miss you）来揭示人物情感。"}]},{"title":"排除法应用","steps":[{"question":"我们来看看选项 B 'Happy' (开心) 和 C 'Excited' (兴奋)。这两种心情通常在什么情况下出现？","hint":"比如收到礼物、要去旅游、或者赢得了一场比赛。","takeaway":"开心和兴奋通常与积极、愉快的事件相关联。"},{"question":"“和好朋友告别”这件事，符合我们刚才说的那些愉快的情景吗？","hint":"告别意味着分离，这通常不是一件让人开心的事。","takeaway":"“告别”的场景与“开心”、“兴奋”的情感逻辑上不匹配，因此可以排除 B 和 C。"}]}]}},{"number":"14","item_type":"reading","context_note":"Passage A","stem":"How many years did Laura spend with her good friends?","options":{"A":"Two years.","B":"Three years.","C":"Four years.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道事实细节题，考察对文章中具体数字信息的捕捉能力。问题是“劳拉和她的好朋友们在一起度过了多少年？”。通过在文章中定位关键词 “years”，我们可以找到关键句：“We had much happy time in the past three years.” 这句话明确指出他们在一起度过了“三年”（three years）。因此，选项 B 是正确答案。","knowledge_expansion_md":"### 如何回答关于时间长度的问题\n在英语中，提问“多长时间”通常使用 `How long...?`。\n\n**提问句型**：\n*   `How long did you stay in Beijing?` (你在北京待了多久？) - 针对过去\n*   `How long have you been friends?` (你们做朋友多久了？) - 针对从过去持续到现在的状态\n\n**回答句型**：\n回答时常用 `for` 或 `since` 来引导时间段。\n1.  **`for` + 一段时间**: 表示时间的长短。例如：\n    *   `for three years` (三年)\n    *   `for two weeks` (两周)\n    *   `for a long time` (很长时间)\n2.  **`since` + 一个时间点**: 表示从某个时间点开始。例如：\n    *   `since 2021` (从2021年开始)\n    *   `since last month` (从上个月开始)\n\n在阅读中，当题干出现 `How long` 或 `How many years/days/months` 时，应迅速在原文中定位含有 `for`, `since` 或具体时间数字的句子。","socratic_tracks":[{"title":"题干关键词分析","steps":[{"question":"这道题目的问题是什么？请用中文转述一下。","hint":"注意 'How many years' 的意思。","takeaway":"题目问的是 Laura 和朋友们在一起的具体年数。"},{"question":"根据这个问题，我们应该在文章中寻找什么样的信息？","hint":"是找一个地点，一个人的名字，还是一个数字？","takeaway":"我们需要在文章中定位表示时间长度的数字信息。"}]},{"title":"答案定位与匹配","steps":[{"question":"在英语中，描述“持续了三年”，通常会怎么说？","hint":"可以想想“for + 一段时间”这个结构。","takeaway":"表达“持续了三年”可以说 'for three years'。"},{"question":"因此，要在文章中找到答案，我们应该重点关注包含哪些词语的句子？","hint":"除了数字 'two', 'three', 'four'，还有刚才提到的那个介词。","takeaway":"解答此题的关键是找到原文中包含 'for' 或具体年份数字的关键句。"}]},{"title":"数字信息辨析","steps":[{"question":"如果文章中出现了多个数字，比如 'Laura is 12 years old' 和 'She has been in China for three years'，我们应该选择哪个数字来回答这个问题？","hint":"回顾一下题干问的是什么，是 Laura 的年龄，还是她和朋友在一起的时间？","takeaway":"必须选择与题干问题直接相关的数字信息，而不是文章中出现的任何数字。"},{"question":"这提醒我们在做细节题时需要注意什么？","hint":"找到数字后，要不要再读一遍句子，确认它回答的是不是题目的问题？","takeaway":"做细节题时，不仅要找到信息，还要仔细核对信息是否与问题完全匹配。"}]}]}},{"number":"15","item_type":"reading","context_note":"Passage A","stem":"Which is NOT right about Laura?","options":{"A":"She and her parents are in China now.","B":"She taught Daming and Lingling English.","C":"She will go to the same school with her good friends soon.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道是非判断题，题干中的 `NOT` 是解题关键，要求选出与原文信息不符的选项。我们需要逐一核对每个选项：\n*   **选项 A**: 文章第一段提到 “I am in China with my parents now.”，所以该选项陈述正确。\n*   **选项 B**: 文章第三段提到 “Of course, I taught them English.”，所以该选项陈述正确。\n*   **选项 C**: 文章第四段提到 “We will soon go to different schools...”，而该选项说她们将去“同一所学校”（the same school），与原文信息直接矛盾。\n因此，不正确的陈述是 C。","knowledge_expansion_md":"### “NOT”题型解题策略\n是非判断题（True or False questions），尤其是含有 `NOT` 的题目，是阅读理解中的常见题型，也容易出错。解题策略如下：\n1.  **审题圈出 `NOT`**：读题时，第一时间圈出或标记 `NOT`, `FALSE`, `INCORRECT` 等否定词，提醒自己要选择“错误”或“未提及”的选项。\n2.  **使用“排除法”**：将每个选项带回原文进行比对。能在原文中找到依据的，就是正确的陈述，应予以排除。不能在原文找到依据，或者与原文信息明确相反的，就是待选答案。\n3.  **区分“错误”与“未提及”**：\n    *   **错误 (False)**：选项的表述与原文信息直接冲突、相反。\n    *   **未提及 (Not Mentioned/Given)**：选项内容在原文中根本找不到任何相关信息来判断其对错。\n    在小升初阶段，`NOT right` 的题目通常指“错误”的选项。\n4.  **注意绝对词和模糊词**：选项中若出现 `all`, `every`, `only`, `never` 等绝对词，其陈述为错误的概率较高。而出现 `some`, `may`, `often`, `usually` 等模糊词，其陈述正确的可能性更大。","socratic_tracks":[{"title":"“NOT”题型解题思路","steps":[{"question":"看到题干中的大写字母 'NOT'，它提醒我们这道题的要求是什么？","hint":"是选正确的说法，还是选不正确的说法？","takeaway":"“NOT”题型要求我们找出三个选项中与文章内容不符的那一个。"},{"question":"那么，我们的解题方法应该是怎样的？是找到一个对的就选，还是要把所有选项都看一遍？","hint":"如果 A 是对的，它会是答案吗？不会。所以我们需要检查每一个选项。","takeaway":"解答“NOT”题型必须使用排除法，逐一验证每个选项，找到那个错误的。"}]},{"title":"信息关联与逻辑判断","steps":[{"question":"根据前面题目的信息，我们知道 Laura 因为要和朋友告别而感到伤心。这说明了什么情况？","hint":"她们是会继续在一起，还是即将要分开了？","takeaway":"“告别并伤心”意味着 Laura 和她的朋友们即将分离。"},{"question":"现在来看选项 C：“她很快将和她的好朋友们上同一所学校。” 这个说法与我们刚才推断出的“即将分离”是否一致？","hint":"如果能上同一所学校，还需要伤心地告别吗？","takeaway":"选项 C 的内容与文章的整体情感和逻辑主线相矛盾。"}]},{"title":"细节核对与验证","steps":[{"question":"我们如何判断选项 A “她和她的父母现在在中国” 是否正确？","hint":"文章中应该有关于 Laura 在哪里，和谁在一起的描述。","takeaway":"我们需要在原文中寻找关于 Laura 所在地和家庭成员的信息来验证选项 A。"},{"question":"同样，我们如何判断选项 B “她教大明和玲玲英语” 是否正确？","hint":"文章中可能会提到 Laura 和朋友们一起做的具体事情。","takeaway":"我们需要在原文中寻找关于 Laura 和朋友们互动细节的描述来验证选项 B。"},{"question":"通过验证 A 和 B 很可能是对的，并发现 C 在逻辑上是错的，我们最终确定答案是什么？","hint":"题目要求选出“不正确”的。","takeaway":"通过信息核对和逻辑排除，可以锁定与文章核心情节矛盾的选项 C 为最终答案。"}]}]}},{"number":"16","item_type":"reading","context_note":"Passage B","stem":"There are _____ people in Mr Brown's family.","options":{"A":"six","B":"four","C":"two","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题，考察对文章信息的整合和简单计算能力。\n1. 题干问的是“布朗先生家有多少人？”(There are _____ people in Mr Brown's family.)。\n2. 要回答这个问题，我们需要在文章中找到所有关于布朗先生家庭成员的信息。文章中提到了：布朗先生 (Mr Brown)、布朗夫人 (Mrs Brown)、儿子吉姆 (Jim) 和他的妹妹苏 (his sister, Sue)。\n3. 将这些成员加起来，总人数为：Mr Brown (1) + Mrs Brown (1) + Jim (1) + Sue (1) = 4人。\n4. 因此，正确答案是 B: four (四)。","knowledge_expansion_md":"### 介绍家庭成员的词汇与句型\n**1. 家庭成员核心词汇：**\n*   `family`: 家庭\n*   `parents`: 父母 (father and mother)\n*   `children`: 孩子 (son and daughter)\n*   `father`/`dad`: 父亲/爸爸\n*   `mother`/`mom`: 母亲/妈妈\n*   `son`: 儿子\n*   `daughter`: 女儿\n*   `husband`: 丈夫\n*   `wife`: 妻子\n*   `brother`: 兄弟\n*   `sister`: 姐妹\n\n**2. 描述家庭规模的句型：**\n*   `There is/are ... in ...` 句型是关键。\n    *   `There are four people in my family.` (我家有四口人。)\n*   用动词 `have`/`has` 来介绍。\n    *   `I have a brother and a sister.` (我有一个哥哥和一个姐姐。)\n    *   `Mr. Brown has a wife and two children.` (布朗先生有一位妻子和两个孩子。)\n\n**易错点**：在计算家庭总人数时，学生常常会忘记加上主语本人。例如，当读到 “Mr. Brown has a wife and two children” 时，只计算了 a wife (1) + two children (2) = 3，却漏掉了 Mr. Brown 本人，导致错选。务必仔细！","socratic_tracks":[{"title":"家庭成员词汇","steps":[{"question":"题目问的是 Mr. Brown 家里的人数。一个典型的家庭通常由哪些人组成？","hint":"想想爸爸、妈妈、孩子等。","takeaway":"一个家庭通常包括父亲、母亲和孩子等成员。"},{"question":"如果文章说“Mr. Brown has a wife and a son”，那么这个家庭一共有几个人？","hint":"别忘了数一数 Mr. Brown 自己哦！","takeaway":"计算家庭总人数时，必须包括所谈论的主语本人。"}]},{"title":"细节计算与陷阱","steps":[{"question":"这道题要求我们做什么？是找一个名字，还是数一个数量？","hint":"看看题干中的横线和选项。","takeaway":"这是一道要求我们根据文章信息进行简单计算的细节题。"},{"question":"做这类计算题时，最容易犯的错误是什么？","hint":"想一想，在数人数的时候，会不会漏掉谁？","takeaway":"这类题目最大的陷阱是计算时漏掉了关键人物，比如只数了孩子而忘了父母。"},{"question":"为了避免这个错误，我们应该怎么做？","hint":"读到介绍家庭成员的句子时，可以在草稿纸上把每个人列出来再数。","takeaway":"避免计算错误的最好方法是仔细阅读，把所有成员一一列举出来再求和。"}]},{"title":"关键句型理解","steps":[{"question":"在英语中，要说“我家有四口人”，最常用的句型是什么？","hint":"以 'There...' 开头。","takeaway":"描述“有多少人/物”常用 'There is/are...' 句型。"},{"question":"除了 'There are...'，还有没有其他方式可以介绍家庭成员？比如用动词 'have'？","hint":"比如 'I have a big family.' 或者 'He has a son.'","takeaway":"动词 'have/has' 也可以用来介绍拥有的家庭成员，从而传递家庭人口信息。"},{"question":"所以，在文章中寻找答案时，我们应该关注包含哪些词的句子？","hint":"刚才我们讨论过的两个关键句型和一些家庭成员词汇。","takeaway":"寻找答案时应重点关注包含 'There are...'、'have/has' 以及家庭成员称谓的句子。"}]}]}},{"number":"17","item_type":"reading","context_note":"Passage B","stem":"Mrs Brown is _____.","options":{"A":"making food","B":"watching TV","C":"washing clothes","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题为细节理解题。根据语境材料中“Mrs Brown is in the kitchen. She is making food.”（布朗夫人在厨房。她正在做饭。）可知，布朗夫人正在做饭。选项A“making food”（做食物）与原文信息完全一致。选项B（看电视）和选项C（洗衣服）与原文信息不符。","knowledge_expansion_md":"### 1. 现在进行时 (Present Continuous Tense)\n- 本题考查对现在进行时`be + doing`的理解，用于描述当下正在发生的动作。原文“She is cooking...”和题干“Mrs Brown is _____”都使用了这个时态。\n- 提问方式：`What is/are ... doing?` 回答：`... is/are doing ...`\n\n### 2. 词义替换 (Paraphrasing)\n- 阅读理解中，正确选项常常是原文信息的同义转述。本题中，`making food` 是对 `cooking a lunch` 的概括性转述。备考时应注意积累同义词或近义词组，如 `cook` / `make food` / `prepare a meal`。\n\n### 3. 常见家务活动词汇\n- `making food/cooking`: 做饭\n- `washing clothes`: 洗衣服\n- `cleaning the floor`: 拖地\n- `doing the dishes`: 洗碗\n- `walking the dog`: 遛狗","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"问题问的是“布朗夫人在做什么？”。你应该在文章的哪部分寻找答案？","hint":"文章通常会按人物或地点来组织信息。找到提到“Mrs Brown”的句子。","takeaway":"阅读时，根据问题中的关键词（如人名）快速定位原文中的相关句子是解题的第一步。"},{"question":"文章中提到 Mrs Brown 的那句话是怎么说的？她正在做什么具体的事情？","hint":"原文说：“She is cooking a big lunch for her family.”","takeaway":"精确找到描述人物动作的动词是理解其行为的关键。"},{"question":"“cooking a lunch”（做午餐）和哪个选项的意思最接近？","hint":"思考一下“做饭”和“制作食物”之间的关系。","takeaway":"正确答案往往是原文信息的同义替换或概括总结。"}]},{"title":"语法时态分析","steps":[{"question":"观察题干“Mrs Brown is _____.”，这个句子缺少了什么成分？它是什么时态？","hint":"句子结构是“主语 + be动词 + ___”。这通常是现在进行时的结构。","takeaway":"识别题干的语法结构和时态，有助于我们预判答案的形式。"},{"question":"为什么描述布朗夫人的活动要用现在进行时（is cooking）？","hint":"想一想文章描述的是一个什么样的场景？是每天都发生的事，还是此时此刻正在发生的事？","takeaway":"现在进行时（be + doing）常用于描述图片或某个特定时刻正在发生的动作。"}]},{"title":"排除干扰选项","steps":[{"question":"我们已经确定A是正确答案。那我们再看看为什么B和C是错的？文章中有没有提到“watching TV”（看电视）？","hint":"通读全文，找一找有没有“TV”或“television”这个词。","takeaway":"排除选项时，要以原文信息为唯一依据，原文未提及的信息不能选。"},{"question":"文章中有人在“washing”（洗）东西吗？洗的是什么？和C选项“washing clothes”（洗衣服）一样吗？","hint":"文章提到 Mr Brown 在“washing his new car”（洗他的新车）。","takeaway":"注意辨别选项中的细节差异，避免张冠李戴，将描述A的动作误认为是B的。"}]}]}},{"number":"18","item_type":"reading","context_note":"Passage B","stem":"Mr Brown looks after _____ very well.","options":{"A":"Mrs Brown","B":"his daughter","C":"his car","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题为细节理解题。根据语境材料中“The car is new and very beautiful. So he looks after it very well.”（这辆车是新的而且非常漂亮。所以他把它照顾得很好。）可知，布朗先生把他的车照顾得很好。句中的代词“it”指代的是前文提到的“his car”（他的车）。因此，选项C“his car”是正确答案。","knowledge_expansion_md":"### 1. 动词短语 (Phrasal Verb)\n- `look after`: 意为“照顾，照料”，相当于 `take care of`。这是一个非常高频的动词短语。\n- 其他由 `look` 组成的常见短语：\n  - `look for`: 寻找\n  - `look at`: 看\n  - `look up`: 查阅（如在字典里查词）\n  - `look forward to`: 期待\n\n### 2. 代词指代 (Pronoun Reference)\n- 阅读理解中，准确判断代词（如 `it`, `he`, `they`, `this`, `that`）指代的对象至关重要。本题中，`it` 指代的是前文中离它最近的、符合逻辑的单数名词 `his car`，而不是 `Mrs Brown` 或 `his daughter`。\n\n### 3. 一般现在时第三人称单数\n- 题干和原文都使用了“looks after”，动词 `look` 加了 `-s`。这是因为主语 `Mr Brown` / `He` 是第三人称单数，且描述的是一种习惯性或经常性的状态，所以用一般现在时。","socratic_tracks":[{"title":"定位动词短语","steps":[{"question":"问题中有一个关键短语“looks after”，请在文章中找到包含这个短语的句子。","hint":"在描述 Mr Brown 的部分仔细寻找。","takeaway":"利用题干的关键词（特别是动词和名词）回原文定位，是阅读解题的有效策略。"},{"question":"找到的句子是“He loves his car and looks after it very well.”。这个句子告诉我们他“looks after”什么？","hint":"注意“looks after”后面的代词“it”。","takeaway":"理解整个句子，特别是关键动词短语的宾语，是解题的核心。"}]},{"title":"分析代词指代","steps":[{"question":"在“...looks after it very well”这句话里，代词“it”指的是什么？","hint":"代词通常指代上文中离它最近的、并且在语法和逻辑上都说得通的名词。看看“it”前面提到了什么事物？","takeaway":"代词“it”通常指代物或动物，而不是人。"},{"question":"为什么“it”不能指代“Mrs Brown”或“his daughter”？","hint":"想一想我们用什么代词来指代女性？","takeaway":"正确使用和理解人称代词（he/she/it/they）是避免理解错误的基础。"}]},{"title":"理解词汇含义","steps":[{"question":"“look after”这个短语是什么意思？","hint":"想象一下，你如何对待你心爱的东西或宠物？","takeaway":"“look after”意为“照顾、照料”。"},{"question":"你能用另一个词或短语替换“look after”吗？","hint":"这个短语以 t... c... o... 开头。","takeaway":"掌握同义词组（如 `look after` = `take care of`）可以极大地扩展你的词汇量和表达能力。"}]}]}},{"number":"19","item_type":"reading","context_note":"Passage B","stem":"Who are playing in the garden?","options":{"A":"Mrs Brown and Sue.","B":"Some boys.","C":"Sue and Ann.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题为细节理解题，考查人物及其活动地点的对应关系。问题是“谁在花园里玩？”。根据语境材料中“Jim is in the garden. He is playing football with some other boys.”（吉姆在花园里。他正在和其他一些男孩踢足球。）可以明确得知，在花园里玩的是吉姆和一些其他的男孩。因此，选项B“Some boys”（一些男孩）是正确答案。选项A和C的人物地点信息均与原文不符。","knowledge_expansion_md":"### 1. “Wh-” 特殊疑问句\n- 本题是 `Who`引导的特殊疑问句，用来询问人物身份。回答这类问题时，需要在文章中准确找到对应的人物名称。\n- 常见的“Wh-”问题：\n  - `Who`: 谁 (问人)\n  - `What`: 什么 (问物或事)\n  - `Where`: 在哪里 (问地点)\n  - `When`: 什么时候 (问时间)\n  - `Why`: 为什么 (问原因)\n  - `How`: 怎样 (问方式)\n\n### 2. 识别人物、地点、活动的对应关系\n- 文章提到“Jim is in the garden. He is playing football with some other boys.”，这表明了在花园里玩的是一群男孩。理解人物、地点和活动的对应关系是解题关键。\n\n### 3. 排除法 (Process of Elimination)\n- 在做选择题时，排除法是一个非常有效的策略。选项A提到Mrs Brown和Sue，但原文说Mrs Brown在厨房，Sue在卧室。选项C提到Sue和Ann，但原文说她们在卧室看电视。通过排除这两个明显错误的选项，也能锁定正确答案B。","socratic_tracks":[{"title":"理解问题类型","steps":[{"question":"这个问题以“Who”开头，它在问什么类型的信息？","hint":"Who, What, Where, When, Why... 这些词都是用来提问的。","takeaway":"“Who”开头的疑问句是在询问关于“人”的信息。"},{"question":"问题中还有哪些关键词可以帮助我们在文章中定位信息？","hint":"除了“Who”，还有“playing”和“in the garden”。","takeaway":"结合问题中的多个关键词（人物、动作、地点），可以更精确地在原文中找到答案。"}]},{"title":"信息匹配与核对","steps":[{"question":"请在文章中找到包含“garden”和“playing”的句子。","hint":"文章中间部分提到了Jim。","takeaway":"定位到“Jim is in the garden. He is playing football with some other boys.”是解题的关键一步。"},{"question":"这句话明确指出了谁在花园里玩吗？","hint":"直接看主语和宾语部分。","takeaway":"文章直接给出了答案：“Jim ... with some other boys”（吉姆和另外一些男孩）。"},{"question":"这个信息和哪个选项最接近？","hint":"对比选项A, B, C。","takeaway":"选项B“Some boys”是对“Jim ... with some other boys”的合理概括，是正确答案。"}]},{"title":"辨析干扰项","steps":[{"question":"为什么选项A“Mrs Brown and Sue”是错误的？","hint":"Mrs Brown 在哪里？Sue 在哪里？","takeaway":"选项A是错误的，因为Mrs Brown在厨房，Sue在卧室。"},{"question":"为什么选项C“Sue and Ann”是错误的？","hint":"文章里说Sue和Ann在哪里？在做什么？","takeaway":"选项C是错误的，因为Sue和Ann在卧室看电视，而不是在花园玩。"}]}]}},{"number":"20","item_type":"reading","context_note":"Passage B","stem":"Sue and Ann are _____.","options":{"A":"watching TV in the living room","B":"playing football in the open air","C":"in the bedroom","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题为细节理解题。题干问“苏和安在哪里/在做什么”。根据语境材料中“She's [Sue's] in the bedroom with her friend, Ann. They are watching TV.”（她（苏）和她的朋友安在卧室里。她们在看电视。）可知，苏和安在卧室里。选项C“in the bedroom”（在卧室里）与原文信息相符。选项A地点错误（living room应为bedroom），选项B活动和地点都错误。","knowledge_expansion_md":"### 1. 精准定位细节\n- 解答此类问题，关键在于根据题干中的人物（Sue and Ann）快速定位到原文中的相关句子：“She's in the bedroom with her friend, Ann. They are watching TV.”\n\n### 2. 辨析选项差异\n- 选项常常会设置干扰项，需要仔细辨别。本题中：\n  - 选项A “watching TV in the living room”：活动正确（watching TV），但地点错误（living room）。\n  - 选项B “playing football in the open air”：活动和地点都错误。\n  - 选项C “in the bedroom”：地点正确。虽然没有描述活动，但它是一个完全符合原文事实的陈述。\n- 在选择题中，当没有选项能完整复述原文信息时，应选择陈述了部分正确事实且没有错误信息的选项。\n\n### 3. 常用地点与活动词汇\n- `bedroom`: 卧室 (常与 `sleep`, `read`, `watch TV` 搭配)\n- `living room`: 客厅 (常与 `watch TV`, `sit on the sofa` 搭配)\n- `kitchen`: 厨房 (常与 `cook`, `make food` 搭配)\n- `garden`: 花园 (常与 `play`, `water flowers` 搭配)","socratic_tracks":[{"title":"定位与核对","steps":[{"question":"问题问的是Sue和Ann的情况。在文章中找到提到她们的句子。","hint":"文章最后提到了Sue和Ann。","takeaway":"原文说：“She's in the bedroom with her friend, Ann. They are watching TV.”"},{"question":"这句话告诉我们关于她们的两件信息是什么？","hint":"一个地点，一个活动。","takeaway":"她们在卧室里（in the bedroom），并且在看电视（watching TV）。"}]},{"title":"辨析干扰选项","steps":[{"question":"我们来看选项A：'watching TV in the living room'。它错在哪里？","hint":"对比原文的地点。","takeaway":"选项A的地点是客厅(living room)，而原文是卧室(bedroom)，所以是错误的。"},{"question":"再看选项B：'playing football in the open air'。它和原文信息符合吗？","hint":"原文中谁在踢足球？","takeaway":"选项B的活动和地点都与Sue和Ann无关，完全错误。"},{"question":"最后看选项C：'in the bedroom'。这个选项正确吗？为什么？","hint":"它只说了地点，没有说活动，可以选吗？","takeaway":"选项C准确描述了她们的所在地，是原文中的事实。在A和B都错误的情况下，C是唯一正确的选项。"}]}]}}]},{"section_title":"III. 连词成句","section_instruction":"（共10分）","items":[{"number":"31","item_type":"sentence_transform","context_note":"","stem":"want to / go to / I / this summer vacation / Canada (.)","options":{},"answer_area_hint":"____________________","teaching":{"correct_answer":"I want to go to Canada this summer vacation.","explanation_md":"本题考查连词成句，需要将给定的词或词组按照正确的语法规则和逻辑顺序排列成一个完整的句子。\n1.  **确定主语**：在这些词组中，人称代词 `I`（我）通常作主语。\n2.  **确定谓语**：`want to go to`（想要去）是一个常见的动词短语，作谓语。\n3.  **确定宾语和状语**：`Canada`（加拿大）是地点，是动词 `go to` 的宾语；`this summer vacation`（今年暑假）是时间状语。\n4.  **组织语序**：英语陈述句的基本语序是“主语 + 谓语 + 宾语 + 状语”。因此，正确的顺序是 `I` + `want to go to` + `Canada` + `this summer vacation`。\n5.  **添加标点**：根据题干给出的 `(.)`，句末应使用句号。","knowledge_expansion_md":"### 英语基本句型：SVO（主谓宾）结构\n\n英语中最核心、最基本的句子结构是“主语(Subject) + 谓语(Verb) + 宾语(Object)”。\n\n*   **主语 (S)**：句子的发出者或描述的对象，通常是名词或代词。本题中是 `I`。\n*   **谓语 (V)**：说明主语的动作或状态，由动词或动词短语充当。本题中是 `want to go to`。\n*   **宾语 (O)**：动作的承受者，跟在及物动词后面。本题中是 `Canada`。\n\n### 状语的位置\n\n状语用来修饰动词、形容词或整个句子，说明时间、地点、方式等。时间状语和地点状语通常放在句末，其标准顺序是“地点状语 + 时间状语”。\n*   *e.g.,* `I played basketball in the park yesterday.` (地点 `in the park` 在时间 `yesterday` 前面)。\n\n本题中，`this summer vacation` 是时间状语，放在句末符合习惯用法。也可以放在句首进行强调：`This summer vacation, I want to go to Canada.`","socratic_tracks":[{"title":"寻找句子主干","steps":[{"question":"一个完整的英文句子，首先要确定谁在做事情。在这些词组里，哪个词是做动作的“人”？","hint":"通常是 I, you, he, she, they 或者某个名字。","takeaway":"句子的主语是 'I'。"},{"question":"确定了主语 'I' 之后，'I' 做了什么动作或者有什么想法？","hint":"找一找包含动词的词组。","takeaway":"谓语动词部分是 'want to go to'（想要去）。"},{"question":"“想要去”哪里呢？动作的目标是什么？","hint":"哪个词是一个国家的名字？","takeaway":"宾语是 'Canada'。这样句子的主干“I want to go to Canada”就确定了。"}]},{"title":"固定搭配 'want to do'","steps":[{"question":"在英语中，表达“想要做某事”时，我们常用哪个动词短语？","hint":"这个短语以 'w' 开头。","takeaway":"我们常用 'want to do something' 这个结构。"},{"question":"在这个结构中，'to' 后面跟的动词应该是什么形式？","hint":"是 to doing, to did, 还是 to do？","takeaway":"'to' 后面必须跟动词原形。"},{"question":"在给出的词组 'want to' 和 'go to' 中，如何将它们正确地组合起来表达“想去”？","hint":"将 'go to' 作为 'do something' 的部分代入 'want to do something' 结构。","takeaway":"正确的组合是 'want to go to'，表示“想要去（某个地方）”。"}]},{"title":"时间状语的位置","steps":[{"question":"词组 'this summer vacation' 在句子中提供了什么信息？","hint":"它回答了 'when' (何时) 的问题。","takeaway":"它提供了动作发生的时间，是时间状语。"},{"question":"在简单的陈述句中，像这样的时间状语通常放在句子的什么位置？","hint":"想一想你平时说的句子，比如“我明天去公园”。","takeaway":"时间状语最常放在句子的末尾。"},{"question":"除了句末，时间状语还可以放在哪里？","hint":"如果想强调时间，可以把它提前。","takeaway":"时间状语也可以放在句首，用逗号隔开，例如 'This summer vacation, I want to go to Canada.'。"}]}]}},{"number":"32","item_type":"sentence_transform","context_note":"","stem":"are / in this city / many hills / there (.)","options":{},"answer_area_hint":"____________________","teaching":{"correct_answer":"There are many hills in this city.","explanation_md":"本题考查“There be”句型的连词成句。\n1.  **识别句型**：当词组中出现 `there` 和 `be` 动词（如此处的 `are`）时，通常是考查 “There be” 句型，表示“某地有某物”。\n2.  **确定主谓一致**：该句型中的 `be` 动词形式由其后的名词决定。名词是 `many hills`（许多小山），是复数形式，所以 `be` 动词用 `are`。\n3.  **组织语序**：“There be” 句型的基本结构是 “There + be + 名词 + 地点状语”。\n4.  **排列词组**：按照结构，依次排列为 `There` + `are` + `many hills` + `in this city`。\n5.  **添加标点**：根据题干给出的 `(.)`，句末应使用句号。","knowledge_expansion_md":"### “There be” 句型详解\n\n“There be” 句型是英语中表示“存在”的特有结构，意为“某地（或某时）有某物（或某人）”。\n\n1.  **基本结构**：`There + be + 名词 + 地点/时间状语`\n\n2.  **主谓一致（就近原则）**：`be` 动词的形式（is/are/was/were等）取决于离它最近的名词的单复数形式。\n    *   `There is a book on the desk.` (名词 `a book` 是单数，用 `is`)\n    *   `There are some books on the desk.` (名词 `some books` 是复数，用 `are`)\n    *   `There is a pen and two pencils in the box.` (离 `is` 最近的名词 `a pen` 是单数，所以用 `is`，这就是“就近原则”)\n\n3.  **与 have/has 的区别**：\n    *   **There be**：强调“客观存在”，主语是 `There`。\n        *   *e.g.,* `There is a tree in front of the house.` (房子前面有一棵树。)\n    *   **have/has**：强调“拥有、所有”，主语是人或物。\n        *   *e.g.,* `I have a book.` (我有一本书。)\n        *   *e.g.,* `The house has a big garden.` (这栋房子有一个大花园。)","socratic_tracks":[{"title":"识别 'There be' 句型","steps":[{"question":"当你想用英语说“某个地方有某个东西”时，你会想到哪个最常用的句型？","hint":"这个句型以 'T' 开头的单词开始。","takeaway":"表达“某地有某物”最常用的句型是 'There be' 句型。"},{"question":"在给出的这几个词组 `are / in this city / many hills / there` 中，哪些词是 'There be' 句型的标志？","hint":"一个引导词和一个be动词。","takeaway":"标志词是 'there' 和 'are'。"},{"question":"这个句型的基本语序是怎样的？","hint":"先说“有”，再说“有什么”，最后说“在哪里有”。","takeaway":"基本语序是 'There be + 名词 + 地点状语'。"}]},{"title":"主谓一致的就近原则","steps":[{"question":"在 'There be' 句型中，be 动词用 'is' 还是 'are' 是由谁决定的？","hint":"是由句首的 'There' 决定，还是由后面的名词决定？","takeaway":"be 动词的形式由它后面的名词的单复数决定。"},{"question":"在这个句子里，be 动词后面的名词是什么？它是单数还是复数？","hint":"名词是 'many hills'。","takeaway":"名词是 'many hills'（许多小山），是复数。"},{"question":"既然名词是复数，那么 be 动词应该用 'is' 还是 'are'？","hint":"复数名词对应复数动词。","takeaway":"名词是复数，所以 be 动词必须用 'are'。"}]},{"title":"句子成分与位置","steps":[{"question":"我们已经确定了句子的核心部分是 'There are many hills'。剩下的 'in this city' 是什么成分？","hint":"它描述了“小山”在什么地方。","takeaway":"'in this city' 是地点状语，说明了小山存在的位置。"},{"question":"在 'There be' 句型中，这个地点状语通常放在哪里？","hint":"是放在句首、句中还是句末？","takeaway":"地点状语通常放在句子的末尾，在名词之后。"},{"question":"现在，请你按照 'There be + 名词 + 地点状语' 的顺序，把所有词组拼成一个完整的句子。","hint":"There are... many... in...","takeaway":"正确的句子是 'There are many hills in this city.'。"}]}]}},{"number":"33","item_type":"sentence_transform","context_note":"","stem":"tomorrow / to / are / you / do / what / going (?)","options":{},"answer_area_hint":"____________________","teaching":{"correct_answer":"What are you going to do tomorrow?","explanation_md":"这是一个由`be going to`结构组成的特殊疑问句，用来询问未来的计划。\n1.  句子以特殊疑问词`What`开头。\n2.  根据`be going to`的疑问句结构，助动词`be`（此处根据主语`you`选择`are`）应提到主语`you`的前面。\n3.  后面跟动词不定式`to do`。\n4.  时间状语`tomorrow`通常放在句末。\n5.  因此，正确的语序是“What are you going to do tomorrow?”。","knowledge_expansion_md":"### `be going to` 结构用法拓展\n\n`be going to`是英语中表达将来计划和意图的常用结构。\n\n1.  **基本结构**:\n    *   肯定句: 主语 + am/is/are + going to + 动词原形。\n        *   *e.g., I am going to watch a film.*\n    *   否定句: 主语 + am/is/are + not + going to + 动词原形。\n        *   *e.g., She is not going to the party.*\n    *   一般疑问句: Am/Is/Are + 主语 + going to + 动词原形?\n        *   *e.g., Are they going to play football?*\n    *   特殊疑问句: 疑问词 + am/is/are + 主语 + going to + 动词原形?\n        *   *e.g., What are you going to do?*\n\n2.  **与 `will` 的区别**:\n    *   `be going to` 通常指**事先计划好**的、有准备的将来动作。\n    *   `will` 通常指**临时决定**的、无事先计划的将来动作，或用于预测。\n    *   *e.g., (电话铃响了) I'll get it. (我来接。——临时决定)*\n    *   *e.g., I'm going to visit my aunt this weekend. (我这周末打算去看我姑姑。——事先计划)*","socratic_tracks":[{"title":"句子结构分析","steps":[{"question":"看到句末的问号，我们知道这应该是一个什么类型的句子？","hint":"是陈述一件事情，还是提出一个问题？","takeaway":"句末的问号是疑问句的标志。"},{"question":"在给出的词中，有`what`这个词，它通常在疑问句的哪个位置？","hint":"想一想你问别人“你叫什么名字？”是怎么说的。","takeaway":"特殊疑问词（如what, where, when）通常放在句子的最前面。"},{"question":"我们有 `are`, `going`, `to` 这几个词，它们可以组成哪个表示“将要”的常用结构？","hint":"这个结构用来谈论未来的计划。","takeaway":"be going to do sth. 是一个固定搭配，表示“将要做某事”。"},{"question":"现在，请你把特殊疑问词、be动词、主语和`going to do`按照正确的顺序组合起来。","hint":"疑问句中，be动词要放在主语前面。","takeaway":"特殊疑问句的基本语序是：疑问词 + be动词 + 主语 + going to do sth."}]},{"title":"时态与时间","steps":[{"question":"单词 `tomorrow` 告诉我们这个句子谈论的是哪个时间？","hint":"是昨天、今天还是明天？","takeaway":"`tomorrow` 指的是“明天”，表示将来的时间。"},{"question":"既然是谈论将来的事情，我们应该使用什么时态？给出的词中，哪些词组合起来可以表达将来时？","hint":"我们刚刚提到过一个表示“将要”的结构。","takeaway":"我们可以用 `be going to` 结构来表达将来时，表示计划和打算。"}]},{"title":"词语排序练习","steps":[{"question":"让我们从疑问词 `What` 开始。在一个问题中，紧跟在 `What` 后面的通常是什么词？是主语 `you` 还是助动词 `are`？","hint":"回忆一下 “What is your name?” 的语序。","takeaway":"在特殊疑问句中，疑问词后面通常跟助动词或be动词。"},{"question":"好的，现在我们有了 `What are`。接下来应该放什么？是主语还是动词？","hint":"助动词后面应该跟句子的主语。","takeaway":"疑问句中，主语通常位于助动词或be动词之后。"},{"question":"我们已经组成了 `What are you`。剩下的 `going`, `to`, `do`, `tomorrow` 该如何排序？","hint":"别忘了 `going to do` 是一个整体结构，而时间状语通常放在最后。","takeaway":"将固定搭配 `going to do` 放在主语之后，时间状语 `tomorrow` 放在句末，即可构成完整句子。"}]}]}},{"number":"34","item_type":"sentence_transform","context_note":"","stem":"the / light / red / don't / go / at (!)","options":{},"answer_area_hint":"____________________","teaching":{"correct_answer":"Don't go at the red light!","explanation_md":"这是一个否定形式的祈使句，用于发出强烈的指令或警告。\n1.  句末的感叹号表明这是一个语气强烈的句子。\n2.  否定祈使句通常以`Don't`开头，后面跟动词原形。\n3.  `red light`是固定词组，意为“红灯”。\n4.  `at the red light`是一个介词短语，表示“在红灯时”。\n5.  因此，正确的句子是“Don't go at the red light!”，意为“红灯时不要走！”，这是一个常见的交通规则警告。","knowledge_expansion_md":"### 祈使句 (Imperative Sentences)\n\n祈使句用于表达命令、请求、建议、警告等，其主语通常是第二人称`you`，但常常被省略。\n\n1.  **肯定祈使句**: 结构为 `动词原形 + ...`。\n    *   *e.g., Please sit down. (请坐。)*\n    *   *e.g., Be quiet! (安静！)*\n\n2.  **否定祈使句**: 结构为 `Don't + 动词原形 + ...`。\n    *   *e.g., Don't touch that. (别碰那个。)*\n    *   *e.g., Don't be late. (别迟到。)*\n\n3.  **语气**: 祈使句的语气可以强硬也可以委婉。使用`please`可以使语气更礼貌。句末使用感叹号`!`可以加强语气，表达强烈的情感或命令。\n\n4.  **常见交通标识语**: 很多交通规则都用祈使句来表达，例如：\n    *   *Stop. (停)*\n    *   *Walk. (通行)*\n    *   *Look left and right. (向左右看)*","socratic_tracks":[{"title":"句子类型判断","steps":[{"question":"看到句末的感叹号和单词 `don't`，你觉得这个句子想表达什么样的信息？","hint":"是陈述事实，还是在告诉某人不要做某事？","takeaway":"感叹号和`Don't`的组合通常表示强烈的警告或命令。"},{"question":"这种用来发号施令或提出警告的句子，我们称之为什么句型？","hint":"想一想老师说“Be quiet!”是什么句型。","takeaway":"这种句子叫作祈使句。"},{"question":"否定形式的祈使句应该用哪个词开头？","hint":"如果肯定形式是 `Go`，那否定形式是什么？","takeaway":"否定祈使句固定以 `Don't` 开头，后面跟动词原形。"}]},{"title":"词组搭配","steps":[{"question":"在给出的单词中，哪几个词可以组合成一个交通信号中常见的词组？","hint":"关于交通灯的颜色。","takeaway":"`red` 和 `light` 可以组成 `red light`（红灯）。"},{"question":"我们有了 `the red light`。要表达“在红灯亮的时候”，应该在它前面加上哪个介词？","hint":"我们通常说 `at school`, `at the station`。","takeaway":"介词 `at` 可以用来表示某个特定的时间点或状态，`at the red light` 意为“在红灯时”。"},{"question":"现在把 `Don't`, `go` 和 `at the red light` 组合成一个通顺的警告语。","hint":"警告语的结构是 `Don't + 动作 + 条件`。","takeaway":"将各部分按逻辑顺序排列，就得到了完整的句子 `Don't go at the red light!`。"}]},{"title":"语法规则应用","steps":[{"question":"单词 `don't` 是 `do not` 的缩写。在这里它起什么作用？","hint":"它帮助构成了一个肯定句还是否定句？","takeaway":"`Don't` 在这里作为助动词，用于构成否定祈使句。"},{"question":"在以 `Don't` 开头的句子里，后面的动词应该使用什么形式？是 `go`, `goes` 还是 `going`?","hint":"这是一个固定的语法规则。","takeaway":"在 `Don't` 之后，必须使用动词的原形。"}]}]}},{"number":"35","item_type":"sentence_transform","context_note":"","stem":"he / work / does / where (?)","options":{},"answer_area_hint":"____________________","teaching":{"correct_answer":"Where does he work?","explanation_md":"这是一个询问工作地点的特殊疑问句，时态为一般现在时。\n1.  句子是关于“地点”的提问，所以用特殊疑问词`Where`开头。\n2.  主语是`he`（第三人称单数），且时态是一般现在时，因此需要借助助动词`does`来构成疑问句。\n3.  特殊疑问句的语序是：疑问词 + 助动词 + 主语 + 动词原形？\n4.  在助动词`does`之后，主要动词必须使用原形`work`，而不是`works`。\n5.  所以，正确的句子是“Where does he work?”。","knowledge_expansion_md":"### 一般现在时特殊疑问句的构成\n\n一般现在时的特殊疑问句用于询问有关日常、习惯性动作或状态的具体信息（如时间、地点、人物、方式等）。\n\n**结构**: `疑问词 (Wh-word) + do/does + 主语 + 动词原形 + ...?`\n\n1.  **助动词的选择**:\n    *   当主语是 `I`, `you`, `we`, `they` 或复数名词时，使用 `do`。\n        *   *e.g., What do you want? (你想要什么？)*\n        *   *e.g., When do they play basketball? (他们什么时候打篮球？)*\n    *   当主语是 `he`, `she`, `it` 或单数名词时，使用 `does`。\n        *   *e.g., How does she go to school? (她怎么去上学？)*\n\n2.  **动词形式**: **非常重要的一点是**，一旦句中使用了助动词`do`或`does`，后面的主要动词必须恢复**原形**。`does`已经承担了第三人称单数的标记功能。\n    *   错误: *Where does he works?*\n    *   正确: *Where does he work?*","socratic_tracks":[{"title":"疑问句结构","steps":[{"question":"这个句子以 `where` 开头，并以问号结尾，它想问的是什么信息？","hint":"`where` 是用来问地点、时间还是原因的？","takeaway":"`Where` 是特殊疑问词，用于提问地点。"},{"question":"在一般现在时的疑问句中，如果主语是 `he`，我们需要用哪个助动词来帮助提问，是 `do` 还是 `does`？","hint":"第三人称单数的主语，助动词会有特殊变化。","takeaway":"当主语是第三人称单数（he, she, it）时，一般现在时的疑问句需要用助动词 `does`。"},{"question":"使用了助动词 `does` 之后，主要动词 `work` 应该用什么形式？是 `work` 还是 `works`？","hint":"助动词 `does` 已经带走了第三人称单数的 `-s` 标记。","takeaway":"在含有 `does` 的疑问句中，主要动词必须使用原形。"}]},{"title":"助动词的作用","steps":[{"question":"我们能直接说 “Where he work?” 吗？为什么不行？","hint":"英语的疑问句和中文的语序不同，通常需要一个“帮手”词。","takeaway":"英语的疑问句（除主语提问外）需要在主语前使用助动词（如do, does, be, have）或情态动词。"},{"question":"单词 `does` 在这个句子里扮演了什么角色？","hint":"它本身没有实际意义，但帮助句子完成了提问的功能。","takeaway":"`does` 是一个助动词，帮助构成一般现在时第三人称单数的疑问句形式。"},{"question":"这个助动词 `does` 应该放在主语 `he` 的前面还是后面？","hint":"回忆一下一般疑问句的语序，例如 `Is he a student?`","takeaway":"在疑问句中，助动词 `does` 必须置于主语 `he` 之前。"}]},{"title":"动词形式变化","steps":[{"question":"如果我们要陈述一个事实，我们会说 “He works.”。这里的 `work` 为什么加了 `s`？","hint":"这和主语 `he` 有关。","takeaway":"在一般现在时的肯定句中，当主语是第三人称单数时，动词需要加 `-s` 或 `-es`。"},{"question":"那么在问题 “Where does he work?” 中，为什么 `work` 又没有 `s` 了呢？","hint":"注意观察 `does` 这个词，它是不是 `do` 加了 `-es`？","takeaway":"助动词 `does` 已经体现了第三人称单数，所以主要动词 `work` 就要用回原形，避免重复变化。"}]}]}}]},{"section_title":"IV. 命题作文","section_instruction":"（共10分）","items":[{"number":"36","item_type":"writing","context_note":"","stem":"以“My Last Winter Holiday”为题写一篇作文，讲一讲自己在假期做了什么。注意用一般过去时，不少于40词。\nMy Last Winter Holiday","options":{},"answer_area_hint":"","teaching":{"correct_answer":"My last winter holiday was wonderful. I did many interesting things. First, I went to my grandparents' home in the countryside. We made dumplings together and it was very fun. Then, I stayed at home and read some storybooks. I also played computer games with my friends online. I really had a great time during the holiday. I hope the next holiday comes soon.","explanation_md":"这篇范文紧扣“我上一个寒假”的主题，清晰地描述了假期活动。\n1.  **时态准确**：全文严格按照题目要求，使用了`was`, `did`, `went`, `made`, `stayed`, `played`, `had`等一系列过去式动词，准确叙述了过去发生的事情。\n2.  **结构清晰**：文章采用“总-分-总”的结构。开头一句总写假期很棒，结尾一句总结感受，中间用`First`, `Then`, `Also`等连接词，按时间顺序分点叙述了具体活动，条理清晰。\n3.  **内容充实**：文章描述了探望祖父母、包饺子、读书、玩游戏等具体活动，内容贴近学生生活，真实可感。\n4.  **语言规范**：用词简单准确，句子结构完整，符合初学者的语言水平和写作要求，且词数满足题目“不少于40词”的要求。","knowledge_expansion_md":"### 记叙文写作技巧（过去时）\n\n写好一篇关于过去经历的短文，需要注意以下几点：\n\n1.  **时态统一**: 核心是使用**一般过去时**。要熟练掌握规则动词和不规则动词的过去式形式。\n    *   **规则动词**: `play` -> `played`, `visit` -> `visited`, `watch` -> `watched`\n    *   **不规则动词**: `go` -> `went`, `see` -> `saw`, `eat` -> `ate`, `have` -> `had`, `do` -> `did`, `read` -> `read` (发音变为/red/)\n\n2.  **清晰的结构**: 一篇好的记叙文通常包含开头、主体和结尾。\n    *   **开头 (Beginning)**: 一句话点明主题，给出总体感受。例如: `My holiday was great.`, `I had a busy weekend.`\n    *   **主体 (Body)**: 按时间顺序或逻辑顺序描述1-3件具体事情。善用**连接词**来使文章更连贯：\n        *   表示顺序: `First...`, `Then...`, `Next...`, `After that...`, `Finally...`\n        *   表示并列: `And...`, `Also...`\n    *   **结尾 (Ending)**: 总结全文，表达自己的感受或期望。例如: `I had a good time.`, `I felt very happy.`, `What a wonderful day!`\n\n3.  **丰富细节**: 不要只写“我玩了”，要写“我和谁玩了什么”。增加细节能让文章更生动。\n    *   简单: `I played games.`\n    *   丰富: `I played football with my friends in the park.`","socratic_tracks":[{"title":"时态运用","steps":[{"question":"作文题目是“My Last Winter Holiday”（我上一个寒假），这告诉我们应该用什么时态来写？","hint":"事情是已经发生了，还是正在发生，或是将要发生？","takeaway":"描述过去发生的事情，必须使用一般过去时。"},{"question":"你能把这些常用动词变成过去式吗？go, have, do, play, visit。","hint":"有些动词加-ed，有些则是不规则变化的。","takeaway":"动词过去式分为规则变化（+ed）和不规则变化，需要准确记忆。答案是：went, had, did, played, visited。"},{"question":"在描述“假期很有趣”时，be动词应该用 is 还是 was？","hint":"is 的过去式是什么？","takeaway":"在过去时的语境中，be动词要使用其过去式形式 am/is -> was, are -> were。"}]},{"title":"文章结构","steps":[{"question":"一篇短文怎样开头会比较好？是直接说第一件事，还是先做个总结？","hint":"想一想如何让读者第一眼就知道你的假期过得怎么样。","takeaway":"用一句话总起全文，如“My last winter holiday was great.”，是一个很好的开头方式。"},{"question":"如果你想按顺序讲几件事，可以用哪些词来连接它们，让文章看起来更有条理？","hint":"比如“首先...”、“然后...”、“接下来...”。","takeaway":"使用 `First`, `Then`, `Next`, `Also` 等连接词，可以使文章结构清晰，叙事流畅。"},{"question":"写完所有活动后，如何给文章一个漂亮的结尾？","hint":"可以谈谈你的感受，或者对未来的期盼。","takeaway":"用一句表达感受的话来结尾，如“I had a wonderful time.”，能让文章更完整。"}]},{"title":"内容与词汇","steps":[{"question":"除了说“我很快乐”，你还能怎样通过描述具体做的事情来表达你的快乐？","hint":"比如，你和谁一起做了什么让你开心的事？","takeaway":"用具体的活动细节（如“和家人一起包饺子”）来代替抽象的感受（如“我很快乐”），能让文章更生动。"},{"question":"关于假期活动，你能想到哪些常用的动词词组？","hint":"比如看望亲戚、看电影、做作业等。","takeaway":"积累如 `visit relatives`, `watch movies`, `read books`, `play sports` 等常用词组，能让写作更轻松。"}]}]}}]}],"content_markdown":"## 成都某外国语学校 初2025级新初一分班（奖学金）真卷英语\n**（满分：50分 时间：40分钟）**\n\n### I. 单选题\n（共10分）\n\n1. I want a cola, _____.\n\tA. also\n\tB. either\n\tC. too\n\n2. _____ I'm going to visit the moon.\n\tA. Last Monday\n\tB. One day\n\tC. Five days\n\n3. That's funny, Mike! You're _____ a pink T-shirt.\n\tA. wear\n\tB. wears\n\tC. wearing\n\n4. — _____ pencil is longer?\n—Wu Binbin's.\n\tA. Whose\n\tB. Who\n\tC. When\n\n5. Did they _____?\n\tA. fishing\n\tB. go fishing\n\tC. went fishing\n\n6. There were no _____ in her time.\n\tA. computers\n\tB. computer\n\tC. hotel\n\n7. My aunt is _____ than my uncle.\n\tA. young\n\tB. so young\n\tC. younger\n\n8. She _____ at home and _____ her clothes.\n\tA. stayed; washed\n\tB. stayed; wash\n\tC. stay; washed\n\n9. —We went to Sanya by plane last summer.\n—_____\n\tA. No, we didn't.\n\tB. Sounds great!\n\tC. Thank you.\n\n10. —Last year, you were short, but you are taller now. How tall are you?\n—_____\n\tA. I'm 45 kilograms\n\tB. I was 1.65 metres\n\tC. I'm 1.65 metres\n\n### II. 阅读选择\n（共20分）\n\n**A**\nHi, I'm Laura! I'm from the UK. I'm 12 years old this year. I am in China with my parents now.\nI have two good friends. They are Daming and Lingling. We're in the same school, but we're going to leave the primary school this September. And I will be back to the UK, too. It's sad for me to say goodbye to my good friends.\nWe had much happy time in the past three years. Daming is a naughty but lovely boy. He helped me in sports. And he brought me lots of joy. Lingling is a very nice girl. She often taught me Chinese. Of course, I taught them English. They made lots of mistakes with English words three years ago, but now they can speak English very well.\nWe will soon go to different schools, but I will always miss them. I wish them happiness every day.\n\n**B**\nIt is Saturday. The Browns are at home. Mrs Brown is in the kitchen. She is making food. The food she makes is very delicious. Do you want to have a taste? Mr Brown isn't in the living room. He is washing his car. The car is new and very beautiful. So he looks after it very well. Jim is in the garden. He is playing football with some other boys. Where is his sister, Sue? She's in the bedroom with her friend, Ann. They are watching TV.\n\n11. (Passage A) Where is Laura from?\n\tA. The USA.\n\tB. The UK.\n\tC. Canada.\n\n12. (Passage A) When will Laura and her good friends leave the primary school?\n\tA. This October.\n\tB. This September.\n\tC. Next September.\n\n13. (Passage A) How does Laura feel to say goodbye to her good friends?\n\tA. Sad.\n\tB. Happy.\n\tC. Excited.\n\n14. (Passage A) How many years did Laura spend with her good friends?\n\tA. Two years.\n\tB. Three years.\n\tC. Four years.\n\n15. (Passage A) Which is NOT right about Laura?\n\tA. She and her parents are in China now.\n\tB. She taught Daming and Lingling English.\n\tC. She will go to the same school with her good friends soon.\n\n16. (Passage B) There are _____ people in Mr Brown's family.\n\tA. six\n\tB. four\n\tC. two\n\n17. (Passage B) Mrs Brown is _____.\n\tA. making food\n\tB. watching TV\n\tC. washing clothes\n\n18. (Passage B) Mr Brown looks after _____ very well.\n\tA. Mrs Brown\n\tB. his daughter\n\tC. his car\n\n19. (Passage B) Who are playing in the garden?\n\tA. Mrs Brown and Sue.\n\tB. Some boys.\n\tC. Sue and Ann.\n\n20. (Passage B) Sue and Ann are _____.\n\tA. watching TV in the living room\n\tB. playing football in the open air\n\tC. in the bedroom\n\n### III. 连词成句\n（共10分）\n\n31. want to / go to / I / this summer vacation / Canada (.)\n\n32. are / in this city / many hills / there (.)\n\n33. tomorrow / to / are / you / do / what / going (?)\n\n34. the / light / red / don't / go / at (!)\n\n35. he / work / does / where (?)\n\n### IV. 命题作文\n（共10分）\n\n36. 以“My Last Winter Holiday”为题写一篇作文，讲一讲自己在假期做了什么。注意用一般过去时，不少于40词。\nMy Last Winter Holiday","proofread_notes":"1. 本试卷为三选项单选题，已按出版规范统一补充 D 选项为空字符串。\n2. 为保持卷面整洁，已移除所有非学术性内容，如二维码、营销水印及视频讲解提示。\n3. 统一了“连词成句”题型中单词的分隔符为“ / ”，并修正了中文标点为全角字符。","set_number":24,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_24\\page_042.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":26},{"step":2,"name":"verify","items":26,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":26}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T14:16:14.091446+00:00","vertex_model_requested":"gem   function isSectionShardId(t) {

  function isTypeCardId(t) {

  }
  function parseTypeCardIndex(t) {

    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {

  }
  function rowsForPaperShard(t) {

      const out = [];

    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);

    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";

  function sectionsInPaperOrder() {

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");

  /** 选项文案：含 <u> 时按语音题规则渲染下划线，否则转义 */

  function writingStemHasPipeTable(stem) {

  function splitMarkdownPipeRow(line) {

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干 / 阅读材料中的表格） */
  function markdownPipeTableLinesToHtml(tableLines, extraTableClass) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines, "");

  /** 阅读大题 section_instruction：正文用 passage-para，管道表格用真实 <table>（如 B 篇俱乐部表） */

  /** PDF：阅读材料中的管道表格 */

  /**

   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。

  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
