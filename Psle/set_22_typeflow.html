<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第22套","exam_meta":{"full_score_text":"满分:80分","time_text":"时间:60分钟","type_cards":[{"sections":[0],"title":"1. 单项选择","range_text":"第1–10题"},{"sections":[1],"title":"2. 完形填空","range_text":"第11–20题"},{"sections":[2],"title":"3. 阅读理解","range_text":"第21–30题"},{"sections":[3],"title":"4. 阅读短文，根据短文内容，从方框中选择正确的句子补全短文","range_text":"第31–35题"},{"sections":[4],"title":"5. 选词填空","range_text":"第36–45题"}]},"sections":[{"section_title":"I. 单项选择","section_instruction":"每小题1分，共10分。","items":[{"number":"1","item_type":"choice","context_note":"","stem":"Please don't _____ this book to Mr. Zhang.","options":{"A":"forget give","B":"to forget give","C":"forget to give","D":"to forget to give"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察动词 `forget` 的用法。句子是“Please don't...”引导的否定祈使句，后面应跟动词原形，因此排除B和D。`forget` 后面可以跟不定式 `to do` 或动名词 `doing`，但含义不同。`forget to do sth.` 意为“忘记要去做某事”（事情未做），`forget doing sth.` 意为“忘记做过某事”（事情已做）。根据句意“请不要忘记把这本书给张老师”，强调“给书”这个动作还未发生，因此应该使用 `forget to give`。","knowledge_expansion_md":"### 后面跟 to do 和 doing 含义不同的动词\n\n英语中有些动词后面既可以跟不定式（to do），也可以跟动名词（doing），但意思会有很大差别，需要根据语境仔细辨析。常见的有：\n\n1.  **remember to do** （记得要去做某事） vs. **remember doing** （记得做过某事）\n    *   *e.g., Please remember to close the window. （请记得去关窗。）*\n    *   *e.g., I remember meeting him somewhere before. （我记得以前在哪里见过他。）*\n\n2.  **forget to do** （忘记要去做某事） vs. **forget doing** （忘记做过某事）\n    *   *e.g., Don't forget to bring your homework. （别忘了带作业。）*\n    *   *e.g., I'll never forget seeing the Great Wall for the first time. （我永远不会忘记第一次看到长城的景象。）*\n\n3.  **stop to do** （停下来去做另一件事） vs. **stop doing** （停止正在做的事）\n    *   *e.g., He stopped to smoke a cigarette. （他停下来，抽了根烟。）*\n    *   *e.g., Please stop talking! （请不要说话了！）*\n\n4.  **try to do** （努力尝试做某事） vs. **try doing** （尝试用某种方法做某事）\n    *   *e.g., You must try to finish the work on time. （你必须努力按时完成工作。）*\n    *   *e.g., Why not try using a different key? （为什么不试试用一把不同的钥匙呢？）*","socratic_tracks":[{"title":"动词 forget 的用法","steps":[{"question":"动词 `forget` 后面如果跟另一个动词，通常有两种形式，你知道是哪两种吗？","hint":"一种是带 `to` 的，一种是加 `-ing` 的。","takeaway":"`forget` 后面可以跟 `to do` 或者 `doing`。"},{"question":"`forget to do` 和 `forget doing` 在意思上有什么区别？哪个表示“忘记要去做”，哪个表示“忘记做过了”？","hint":"想一想，“不要忘记带钥匙”和“我忘记见过他了”，哪个动作发生了，哪个没发生？","takeaway":"`forget to do` 是忘记要去做某事（未发生），而 `forget doing` 是忘记已经做过某事（已发生）。"}]},{"title":"否定祈使句","steps":[{"question":"“Please don't...”开头的句子是什么类型的句子？它想表达什么？","hint":"它是在请求或命令别人“不要”做某事。","takeaway":"这是一个否定祈使句，用于礼貌地请求或命令某人不要做某事。"},{"question":"在否定祈使句 “Don't...” 后面，动词应该使用什么形式？是原形、带 to 的不定式还是其他形式？","hint":"回想一下助动词 `do/does/did` 的用法，它们后面的动词用什么形式？","takeaway":"否定祈使句的基本结构是 “Don't + 动词原形”，所以 `don't` 后面要用 `forget`。"}]},{"title":"语境分析","steps":[{"question":"这句话“请不要...把这本书给张老师”，是提醒对方去做一件将要做的事，还是提醒对方一件已经做过的事？","hint":"“给书”这个动作是希望它在未来发生，还是已经发生了？","takeaway":"根据语境，这是在提醒对方不要忘记一件将要去做的事。"},{"question":"既然是提醒对方去做一件“未来”的、尚未发生的动作，那么应该用 `forget to give` 还是 `forget giving`？","hint":"回顾一下 `forget to do` 和 `forget doing` 的区别。","takeaway":"对于尚未发生的动作，应该使用 `forget to do` 的结构。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"—Why do you want to live in the countryside?\n—Because I want to live _____.","options":{"A":"quiet somewhere","B":"somewhere quiet","C":"different something","D":"something different"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考察形容词修饰不定代词/副词的词序规则。当形容词修饰由 `some-`, `any-`, `no-`, `every-` 开头的不定代词或副词（如 `something`, `anything`, `somewhere`）时，形容词必须后置。因此，`somewhere quiet`（某个安静的地方）和 `something different`（不同的事物）是正确的结构，而A和C选项词序错误。根据对话语境，问句是“你为什么想住在乡下？”，回答“因为我想住在一个安静的地方”在逻辑上最通顺。D选项 `live something different` 搭配不当，语意不通。","knowledge_expansion_md":"### 形容词后置规则\n\n在英语中，形容词通常放在它所修饰的名词前面（如 a *beautiful* girl），但在某些特定情况下，形容词需要放在其修饰的词之后，这称为“形容词后置”。\n\n1.  **修饰不定代词/副词**：这是最常见的一种情况。当形容词修饰 `something`, `anything`, `nothing`, `everything`, `somebody`, `anybody`, `nobody`, `everybody`, `somewhere`, `anywhere`, `nowhere` 等词时，必须后置。\n    *   *e.g., I want to try **something new**.* （我想尝试点新东西。）\n    *   *e.g., Is there **anything interesting** in the news?* （新闻里有什么有趣的事吗？)\n\n2.  **形容词短语作定语**：当修饰成分不是单个形容词，而是一个较长的形容词短语（如形容词+介词短语）时，通常需要后置。\n    *   *e.g., He is a man **capable of handling the job**.* （他是一个能胜任这份工作的人。）\n\n3.  **某些固定搭配**：一些从法语等语言借鉴来的表达或法律术语中，形容词会后置。\n    *   *e.g., the president **elect** （总统当选人）, time **immemorial** （远古）*","socratic_tracks":[{"title":"形容词的位置","steps":[{"question":"我们说“一个安静的地方”，通常会说 `a quiet place`。这里形容词 `quiet` 放在名词 `place` 的前面还是后面？","hint":"观察 `a quiet place` 的词序。","takeaway":"通常情况下，形容词放在名词的前面作定语。"},{"question":"那为什么在选项B `somewhere quiet` 中，形容词 `quiet` 跑到了 `somewhere` 的后面呢？`somewhere` 是什么类型的词？","hint":"它是由 `some-` 开头，表示不确定地点的一个词。","takeaway":"`somewhere` 是不定副词，修饰这类词的形容词需要后置。"},{"question":"你还能举出其他形容词需要后置的例子吗？比如“重要的事”或者“新鲜的东西”应该怎么说？","hint":"用 `something` 来造句。","takeaway":"修饰以 `some-`, `any-`, `no-`, `every-` 开头的不定代词/副词时，形容词都要后置，例如 `something important`, `anything new`。"}]},{"title":"语境与逻辑","steps":[{"question":"对话中，提问者问“你为什么想住在乡下？”。从常识判断，人们喜欢乡下的原因可能有哪些？","hint":"乡下和城市相比，有什么不同的特点？比如环境、节奏等。","takeaway":"人们选择住在乡下，通常是因为那里更安静、空气更清新、生活节奏更慢。"},{"question":"选项B `somewhere quiet` 意思是“一个安静的地方”，选项D `something different` 意思是“一些不同的东西”。结合上一步的思考，哪个是更直接、更合理的回答？","hint":"“住在安静的地方”和“住一些不同的东西”，哪个说法更通顺？","takeaway":"回答“因为我想住在一个安静的地方”完全符合逻辑，是选择乡下的一个典型理由。"}]},{"title":"词语搭配","steps":[{"question":"动词 `live` 的意思是“居住”，它后面通常跟什么类型的词或短语？","hint":"比如 `I live in Chengdu.` 或者 `I live with my parents.`","takeaway":"`live` 后面通常跟表示地点或方式的状语。"},{"question":"我们来看 `live somewhere quiet` 和 `live something different` 这两个搭配。`somewhere quiet` 是指“一个安静的地方”，`something different` 是指“不同的事物”。哪个可以和 `live` 搭配来表示“居住”？","hint":"人可以“居住”在某个地方，但可以“居住”一个东西吗？","takeaway":"动词 `live` 和表示地点的 `somewhere quiet` 是合理搭配，而和表示事物的 `something different` 搭配不当，不符合语言习惯。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"—Tidy, please. _____ the radio. I want to listen to the weather report.","options":{"A":"Mix up","B":"cut up","C":"turn on","D":"work on"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察动词短语的辨析。题干的后半句是“I want to listen to the weather report”（我想听天气预报）。为了能听到收音机（radio）里的天气预报，需要先执行一个动作。C选项 `turn on` 意为“打开（电器）”，符合语境，指“打开收音机”。A选项 `Mix up` 意为“混合，搞混”；B选项 `cut up` 意为“切碎”；D选项 `work on` 意为“从事，致力于”。这三个选项的含义均不符合题意。因此，选择 `turn on` 是唯一正确的。","knowledge_expansion_md":"### “turn”相关的动词短语\n\n动词 `turn` 可以和许多不同的副词或介词搭配，构成意义丰富的动词短语，特别是在描述操作电器或设备时非常常用。\n\n*   **turn on**: 打开（电器、水源、煤气等）\n    *   *e.g., Please **turn on** the light. It's dark here.* (请开灯，这里太暗了。)\n*   **turn off**: 关闭（电器、水源、煤气等）\n    *   *e.g., Don't forget to **turn off** the TV before you go to bed.* (睡觉前别忘了关电视。)\n*   **turn up**: 调高，开大（音量、温度等）；出现\n    *   *e.g., Could you **turn up** the volume? I can't hear it.* (你能把音量调大一点吗？我听不见。)\n    *   *e.g., He promised to come but hasn't **turned up** yet.* (他答应要来，但还没出现。)\n*   **turn down**: 调低，关小（音量、温度等）；拒绝\n    *   *e.g., Please **turn down** the music. It's too loud.* (请把音乐关小声点，太吵了。)\n    *   *e.g., She **turned down** the job offer.* (她拒绝了那份工作。)\n*   **turn into**: 变成\n    *   *e.g., The caterpillar will **turn into** a butterfly.* (毛毛虫会变成蝴蝶。)","socratic_tracks":[{"title":"动词短语辨析","steps":[{"question":"为了能“听收音机”，我们首先需要对收音机做什么操作？","hint":"想想开灯、开电视、开电脑，我们用的是哪个动词？","takeaway":"要使用电器，第一步通常是“打开”它。"},{"question":"我们来看四个选项的意思：A `Mix up` (搞混)，B `cut up` (切碎)，C `turn on` (打开)，D `work on` (从事)。哪个选项是“打开”的意思？","hint":"`on` 这个词经常和“开启”状态有关。","takeaway":"`turn on` 是一个固定的动词短语，意思就是“打开（电器）”。"}]},{"title":"根据目的推断行为","steps":[{"question":"说话人说“I want to listen to the weather report”（我想听天气预报）。这句话告诉了我们他的“目的”是什么？","hint":"他的愿望是“听天气预报”。","takeaway":"后半句清晰地表明了说话人的目的是获取信息（听天气预报）。"},{"question":"为了达成“听天气预报”这个目的，前半句的指令应该是让收音机发生什么变化？","hint":"一个关着的收音机是无法听到预报的。","takeaway":"目的（听）决定了行为（打开），通过后文的目的可以反推出前文的动作。"}]},{"title":"“turn”短语家族","steps":[{"question":"`turn on` 的意思是“打开”，那它的反义词“关闭”应该怎么说？","hint":"`on` 的反义词是 `off`。","takeaway":"“关闭”是 `turn off`。"},{"question":"如果收音机声音太小，你想让别人“调大声一点”，应该用 `turn` 和哪个词搭配？","hint":"“向上”通常表示增加或变大。","takeaway":"“调大”是 `turn up`。"},{"question":"那么，如果声音太大了，想“调小声一点”呢？","hint":"“向下”通常表示减少或变小。","takeaway":"“调小”是 `turn down`。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"—We are going to Hainan this winter holiday.\n—_____!","options":{"A":"Great","B":"Enjoy yourselves","C":"No problem","D":"Good luck"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考察情景交际中的恰当回应。第一位说话人说“我们寒假要去海南”，分享了一个愉快的未来计划。作为回应，应该表达积极的情感或美好的祝愿。B选项 `Enjoy yourselves` 意为“祝你们玩得开心”，是当别人提及即将到来的假期或娱乐活动时，最常用、最贴切的祝福语。其中，反身代词 `yourselves`（你们自己）与主语 `We`（我们）在人称和数上完全对应，显示了回应的针对性。A选项 `Great!`（太棒了！）也是一个积极的回应，但它更多的是对“计划”本身的赞叹，而 `Enjoy yourselves` 是对“人”的祝福，互动性更强，是此情景下的更优选择。C选项 `No problem`（没问题）和D选项 `Good luck`（祝你好运）均不适用于此语境。","knowledge_expansion_md":"### 情景交际：如何回应别人的消息\n\n在英语对话中，根据对方分享消息的性质（好消息、坏消息、计划、请求等），选择恰当的回应至关重要。\n\n1.  **回应好消息或计划 (Responding to Good News/Plans)**\n    *   表达喜悦/赞同: `Great!`, `Wonderful!`, `That's fantastic!`, `How exciting!`\n    *   表达祝福: `Congratulations!`（用于成就）, `Have a great time!`, `Enjoy yourself/yourselves!`（用于娱乐活动）\n\n2.  **回应坏消息 (Responding to Bad News)**\n    *   表达同情/遗憾: `I'm sorry to hear that.`, `That's too bad.`, `Oh no.`\n\n3.  **回应感谢 (Responding to Thanks)**\n    *   `You're welcome.`, `No problem.`, `My pleasure.`, `Don't mention it.`\n\n4.  **回应道歉 (Responding to an Apology)**\n    *   `That's all right.`, `No problem.`, `Don't worry about it.`, `It doesn't matter.`\n\n5.  **回应请求 (Responding to a Request)**\n    *   同意: `Sure.`, `Of course.`, `No problem.`\n    *   拒绝: `I'm sorry, but...`, `I'm afraid I can't.`","socratic_tracks":[{"title":"交际功能","steps":[{"question":"当你的朋友告诉你一个好消息，比如他要去旅行了，你通常会怎么说？是简单地评价一下，还是会祝福他？","hint":"想一想中文里我们是说“太好了”还是“玩得开心”？或者两者都会说？","takeaway":"在社交中，对别人的好消息表达美好的祝愿是一种非常重要且得体的回应。"},{"question":"比较 `Great!` (太棒了) 和 `Enjoy yourselves!` (祝你们玩得开心)，哪个回应更侧重于对朋友未来的体验表达关心和祝福？","hint":"`Great!` 是对事，`Enjoy yourselves!` 是对人。","takeaway":"`Enjoy yourselves!` 直接祝福对方，是更具互动性和人情味的回答。"}]},{"title":"选项辨析","steps":[{"question":"如果你的朋友说他明天要参加一场重要的考试，你会对他说 `Good luck` 还是 `Enjoy yourself`？为什么？","hint":"考试是一种挑战，需要运气和努力；而度假是一种享受。","takeaway":"`Good luck` (祝你好运) 适用于挑战或困难，不适用于享受性的活动。"},{"question":"如果有人对你说“谢谢”，你会回答 `No problem` 还是 `Great`？","hint":"`No problem` 的意思是“不客气”或“没问题”。","takeaway":"`No problem` (没问题) 常用于回应感谢或请求，与本题的语境不符。"}]},{"title":"语法细节","steps":[{"question":"第一个说话人用了 `We`，这表示有几个人要去海南？","hint":"`We` 是“我们”的意思。","takeaway":"`We` 表示至少两个人，是复数。"},{"question":"在B选项 `Enjoy yourselves` 中，为什么用 `yourselves` 而不是 `yourself`？它们有什么区别？","hint":"`yourself` 指“你自己”（单数），`yourselves` 指“你们自己”（复数）。","takeaway":"使用复数的 `yourselves` 是为了与前面说话人提到的 `We` (我们) 在数量上保持一致，这使得回应更加精确。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"I went to the park yesterday. There were many relatives _____ games in it.","options":{"A":"is playing","B":"was playing","C":"playing","D":"play"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查“There be”句型中对名词进行修饰的成分。句子的主干是 “There were many relatives...”，意为“有许多亲戚”。空格部分需要一个成分来修饰 “relatives”，说明他们正在做什么。此处使用现在分词短语 “playing games” 作后置定语，表示亲戚们正在进行“玩游戏”这个动作。整个句子的意思是“有许多亲戚在公园里玩游戏”。选项A和B是完整的谓语形式，但句中已有谓语 “were”，故不选。选项D动词原形用法不当。","knowledge_expansion_md":"### 现在分词作后置定语\n\n1.  **结构**：`名词 + doing sth.`\n    当分词所修饰的名词是该分词动作的发出者（即主谓关系），且动作正在进行或是一种状态时，使用现在分词（-ing形式）作后置定语。这相当于一个简化的定语从句。\n    *   `There were many relatives playing games.` = `There were many relatives who were playing games.`\n    *   `The boy standing by the door is my brother.` = `The boy who is standing by the door is my brother.`\n\n2.  **与过去分词作后置定语的区别**：\n    如果名词是分词动作的承受者（即动宾关系），则使用过去分词（-ed形式）作后置定语。\n    *   `This is a letter written in English.` (信是被写的)\n\n3.  **在感官动词和使役动词后的区别**：\n    不要与 `see/hear/watch sb. doing sth.` 混淆。虽然形式相似，但 `There be` 句型强调“存在”，而感官动词句型强调“看到/听到”这一动作。","socratic_tracks":[{"title":"There be 句型与后置定语","steps":[{"question":"这个句子的主干结构是什么？它是不是想表达“在某个地方有什么人”？","hint":"观察句子的开头 “There were...”。","takeaway":"这是经典的 “There be” 句型，表示“存在”。"},{"question":"“There were many relatives” 已经是一个完整的句子核心了，那么后面的 “_____ games” 是用来做什么的呢？","hint":"它是在描述 “relatives” 当时正在做什么吗？","takeaway":"这个部分是用来修饰前面的名词 “relatives” 的，我们称之为后置定语。"},{"question":"什么样的词或短语可以跟在名词后面作定语，来表示这个名词正在进行的、主动的动作？","hint":"想一想动词的-ing形式除了构成进行时，还有什么语法功能？","takeaway":"动词的现在分词（-ing形式）可以作后置定语，表示主动态和进行时。"}]},{"title":"非谓语动词与谓语动词","steps":[{"question":"我们来看 A 和 B 选项，`is playing` 和 `was playing`。它们是完整的动词短语，如果选它们，句子中会出现几个谓语动词？","hint":"句子里已经有了一个谓语动词 “were”。一个简单句能有两个谓语动词吗？","takeaway":"一个简单句通常只有一个谓语动词，所以不能再填入另一个完整的谓语动词短语。"},{"question":"那么 D 选项 `play` 是动词原形，可以用在这里吗？我们学过哪些结构后面可以跟动词原形？","hint":"比如 “let sb do sth.” 或 “see sb do sth.”，但 “There be sb do sth” 这个结构常见吗？","takeaway":"动词原形通常用在使役动词或感官动词后面作宾补，而 “There be” 句型中修饰名词时不用动词原形。"}]},{"title":"主谓一致与时态","steps":[{"question":"即使我们假设这里需要一个完整的谓语动词，我们来检查一下主语。句子的主语 “many relatives” 是单数还是复数？","hint":"“many” 修饰的是可数名词的单数还是复数？","takeaway":"“many relatives” 是复数，所以动词不能用单数形式 `is` 或 `was`。"},{"question":"再看整个句子的时态。第一句话 “I went to the park yesterday” 是什么时态？","hint":"“yesterday” 是一个明确的过去时间标志。","takeaway":"整个语境是过去时，所以选项 A 的 `is playing` 在时态上也是错误的。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Will you go to the cinema with me tomorrow?\n—Sorry, I _____ skating with Tom.","options":{"A":"go","B":"went","C":"will go","D":"have gone"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查一般将来时的用法。根据对话中的时间状语 “tomorrow”（明天），可知对话内容是关于未来的计划。问句 “Will you go...?” 使用了一般将来时进行提问。答句中，说话人以 “Sorry” 开头，表示拒绝邀请，并解释原因。这个原因也是一个发生在未来的安排，因此谓语动词需要使用将来时态。选项 C `will go` 是一般将来时的正确形式，表示“我将要去和汤姆滑冰”，符合语境。其余选项时态均不正确。","knowledge_expansion_md":"### 表示将来时间的几种常见方式\n\n在英语中，有多种方式可以表达将来的动作或状态，需要根据具体语境选择最恰当的一种：\n\n1.  **will + 动词原形**：常用于表示临时的决定、主观的意愿、预测或承诺。\n    *   例：`I'm thirsty. I think I will buy a drink.` (临时决定)\n\n2.  **be going to + 动词原形**：常用于表示事先已经计划好、打算要做的事，或根据现有迹象判断即将发生的事。\n    *   例：`She is going to travel to France next month.` (已计划)\n    *   例：`Look at the dark clouds. It's going to rain.` (有迹象的预测)\n\n3.  **现在进行时 (be + doing)**：常用于表示已经确定并安排好的个人日程，语气比 `be going to` 更为肯定。\n    *   例：`I'm meeting my friends at the airport at 10 a.m. tomorrow.` (已安排)\n\n4.  **一般现在时**：常用于表示按时刻表、节目表等固定安排将要发生的动作。\n    *   例：`The train leaves at 8:00 tomorrow morning.` (时刻表)","socratic_tracks":[{"title":"根据时间状语选时态","steps":[{"question":"在对话中，有没有一个词明确告诉我们动作将要发生的时间？","hint":"仔细看问句的最后一个词。","takeaway":"关键词是 “tomorrow”（明天），它表示将来时间。"},{"question":"既然是关于明天的事情，我们应该选择哪种时态来描述这个动作？","hint":"描述未来的时态我们学过哪些？比如“将要”怎么说？","takeaway":"我们需要使用将来时态来表达未来的动作或计划。"},{"question":"请看四个选项，哪一个是表示将来时态的正确形式？","hint":"A. go (现在时), B. went (过去时), C. will go (将来时), D. have gone (现在完成时)。","takeaway":"只有 `will go` 是一般将来时的正确形式。"}]},{"title":"对话逻辑与语境","steps":[{"question":"第一个人的问题 “Will you go...?” 是在做什么？","hint":"他想和对方明天一起去看电影。","takeaway":"这是一个关于未来计划的邀请。"},{"question":"第二个人回答 “Sorry”，这表示同意还是拒绝？他后面的话是在做什么？","hint":"“Sorry” 通常用在无法满足对方要求的时候。","takeaway":"他是在拒绝邀请，并解释为什么明天不能去的原因。"},{"question":"既然是解释明天的安排，那么这个安排是已经发生了，还是将要发生？","hint":"这个安排是导致他明天没空的原因。","takeaway":"因此，描述这个安排的动词必须使用将来时态。"}]},{"title":"辨析不同时态的用法","steps":[{"question":"选项 A `go` 是一般现在时，它通常用在什么情况下？用在这里合适吗？","hint":"比如 “I go to school every day.” 是表示习惯。","takeaway":"一般现在时主要表示习惯性动作或真理，不适合描述一次性的未来安排。"},{"question":"选项 B `went` 是过去时。如果用过去发生的事来解释为什么明天不能去，这在逻辑上说得通吗？","hint":"“对不起，我明天不能去，因为我昨天去滑冰了。” 这个理由听起来奇怪吗？","takeaway":"用过去时来解释未来的事情，逻辑上不通顺。"},{"question":"选项 D `have gone` 是现在完成时，它强调什么？能用来表示未来的事吗？","hint":"现在完成时连接过去和现在，比如 “I have finished my homework.” (我现在是完成的状态)。","takeaway":"现在完成时与过去和现在相关，不能用来表示纯粹的未来事件。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"Look! The piece of meat is too big, let's cut _____.","options":{"A":"them up","B":"it up","C":"up them","D":"up it"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查“动词+副词”型短语动词的宾语位置。首先，题干中的 “The piece of meat” 是单数名词，指代它时应用代词 `it`。其次，“cut up”是一个可分动词短语，意为“切碎”。当这类短语的宾语是代词时（如 it, them, me, him 等），代词必须放在动词和副词的中间。因此，正确的表达是 `cut it up`。选项A和C的代词 `them` 错误；选项D中代词 `it` 的位置错误。","knowledge_expansion_md":"### 可分动词短语 (Separable Phrasal Verbs)\n\n1.  **定义**：由“动词 + 副词”构成的短语，如 `turn on` (打开), `put on` (穿上), `take off` (脱下), `pick up` (捡起), `give up` (放弃)。这类短语的特点是副词可以和动词分开。\n\n2.  **宾语位置规则**：\n    *   **当宾语是名词时**：名词可以放在副词之后，也可以放在动词和副词之间。\n        *   `Please turn on the light.` = `Please turn the light on.`\n        *   `He took off his coat.` = `He took his coat off.`\n    *   **当宾语是代词时**：人称代词宾格 (me, you, him, her, it, us, them) **必须**放在动词和副词之间。\n        *   `Please turn it on.` (正确)\n        *   `Please turn on it.` (错误)\n        *   `Pick them up.` (正确)\n        *   `Pick up them.` (错误)\n\n3.  **与不可分动词短语的区别**：\n    由“动词 + 介词”构成的短语是不可分的，如 `look at` (看), `listen to` (听), `wait for` (等待)。其宾语只能放在介词后面。\n    *   `Look at me.` (正确)\n    *   `Look me at.` (错误)","socratic_tracks":[{"title":"代词的正确选择","steps":[{"question":"句子中 “let's cut _____” 是要切什么东西？","hint":"看看逗号前面的主语 “The piece of meat”。","takeaway":"需要用代词指代的是 “The piece of meat”。"},{"question":"“The piece of meat” 是单数还是复数？是人还是物？","hint":"“a piece” 是一块，是单数。“meat” 是物。","takeaway":"所以应该用单数、指物的代词 `it` 来指代它。"},{"question":"根据这一点，我们可以直接排除哪两个选项？","hint":"选项 A 和 C 中的 `them` 是复数代词。","takeaway":"代词 `them` 使用错误，因此 A 和 C 选项被排除。"}]},{"title":"可分动词短语的结构","steps":[{"question":"“cut up” 是一个动词短语，你知道它属于哪种类型吗？是“动词+介词”（像 look at）还是“动词+副词”（像 turn on）？","hint":"试着把宾语名词 “the meat” 放在中间，`cut the meat up`，听起来通顺吗？","takeaway":"“cut up” 是一个由“动词+副词”构成的可分动词短语。"},{"question":"当这种可分动词短语的宾语是代词（比如 `it`）时，这个代词应该放在哪里？","hint":"回想一下我们常说的“打开它”是 `turn it on` 还是 `turn on it`？","takeaway":"当宾语是代词时，必须放在动词和副词的中间。"},{"question":"现在，请将 “cut up” 和代词 “it” 按照正确的规则组合起来。","hint":"动词 + 代词 + 副词。","takeaway":"正确的组合是 `cut it up`。"}]},{"title":"举一反三","steps":[{"question":"让我们换一个短语，比如 “put on”（穿上）。如果要说“穿上这件外套”，有几种说法？","hint":"宾语 “this coat” 是名词。","takeaway":"可以说 `put on this coat` 或者 `put this coat on`。"},{"question":"那如果用代词 `it` 来代替 “this coat”，应该怎么说“穿上它”？","hint":"记住宾语是代词时的特殊规则。","takeaway":"只能说 `put it on`，不能说 `put on it`。"},{"question":"现在回到原题，将这个规则应用到 “cut up” 和 “it” 上，答案是什么？","hint":"“put it on” 和 “cut it up” 的结构规则是完全一样的。","takeaway":"同样的规则适用，所以正确答案是 `cut it up`。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"—It's time for the weather report. Could I _____ the TV, Dad?\n—Go ahead, please. I also want to know about the weather for tomorrow.","options":{"A":"turn off","B":"turn on","C":"turn down","D":"turn back"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在具体语境中对动词短语的辨析。根据对话上文，“It's time for the weather report.”（到天气预报的时间了），以及下文爸爸的回答“Go ahead, please. I also want to know...”（可以啊，我也想知道...），可以推断出说话者想要看天气预报。为了观看电视节目，需要执行的动作是“打开”电视。`turn on` 的意思正是“打开（电器）”，完全符合语境。`turn off` 是“关掉”，`turn down` 是“调小音量”，`turn back` 是“返回”，均不符合题意。","knowledge_expansion_md":"### 与 `turn` 相关的常用动词短语辨析\n\n`turn` 是一个非常活跃的动词，可以和不同的副词或介词搭配，构成意义丰富的短语动词。在学习时，最好结合具体场景来记忆：\n\n*   **turn on**: 打开（电器、灯、水龙头等）。\n    *   `Could you turn on the light? It's dark here.`\n*   **turn off**: 关闭（与 `turn on` 相对）。\n    *   `Don't forget to turn off the computer when you leave.`\n*   **turn up**: 调高，开大（音量、温度等）；也可以表示“出现，露面”。\n    *   `Can you turn up the volume? I can't hear it.`\n    *   `He promised to come, but he didn't turn up.`\n*   **turn down**: 调低，关小（与 `turn up` 相对）；也可以表示“拒绝”。\n    *   `The music is too loud. Please turn it down.`\n    *   `She turned down my invitation.`\n*   **turn back**: 返回，折返。\n    *   `We had to turn back because of the bad weather.`\n*   **turn into**: 变成。\n    *   `The frog turned into a handsome prince.`","socratic_tracks":[{"title":"通过上下文推断","steps":[{"question":"对话的起因是什么？说话人提到了什么电视节目？","hint":"看第一句话 “It's time for the weather report.”","takeaway":"对话的背景是“到了天气预报的时间”。"},{"question":"爸爸的回答 “Go ahead, please” 和 “I also want to know...” 表明了什么态度？","hint":"“Go ahead” 是一个表示同意和允许的常用语。","takeaway":"爸爸同意了孩子的请求，并且他也想看天气预报。"},{"question":"综合这两点信息，孩子向爸爸请求对电视做一个什么动作，才是最合乎逻辑的？","hint":"为了看一个还没开始的电视节目，第一步要做什么？","takeaway":"孩子最可能的请求是“打开电视”。"}]},{"title":"动词短语含义辨析","steps":[{"question":"我们来看四个选项，它们都是以 `turn` 开头的动词短语。`turn on` 和 `turn off` 分别是什么意思？","hint":"想一想开灯和关灯的英文表达。","takeaway":"`turn on` 是“打开”，`turn off` 是“关闭”。"},{"question":"`turn down` 通常用在什么情景下？比如音乐声音太大了，你会怎么说？","hint":"“Please turn down the music.”","takeaway":"`turn down` 的意思是“调小音量”或“调低”。"},{"question":"`turn back` 是什么意思？如果你出门后发现忘了带钥匙，需要回家拿，你会做什么？","hint":"你需要“折返”或“返回”。","takeaway":"`turn back` 就是“返回，折返”的意思。"},{"question":"根据我们第一步推断出的“打开电视”的语境，哪个短语是正确的？","hint":"“打开”对应的英文短语是哪一个？","takeaway":"`turn on` 是唯一符合语境的正确选项。"}]},{"title":"请求许可的句型功能","steps":[{"question":"问句 “Could I...?” 是一个用来做什么的句型？","hint":"比如 “Could I use your pen?”，这是在请求什么？","takeaway":"这是一个有礼貌地提出请求、寻求许可的句型。"},{"question":"在这个对话中，说话人请求许可去做某事，这件事的最终目的是什么？","hint":"他想知道明天的天气。","takeaway":"他的目的是通过看电视来获取天气预报的信息。"},{"question":"为了达到这个目的，对电视机（the TV）进行什么操作是合乎逻辑的第一步？","hint":"是让电视机开始工作，还是停止工作？","takeaway":"逻辑上，必须先打开电视机才能观看节目。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Can I help you?\n—I'd like _____ for my twin daughters.","options":{"A":"two pair of shoes","B":"two pairs of shoe","C":"two pair of shoe","D":"two pairs of shoes"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查名词复数的用法。\n1.  “一双”或“一对”用“a pair of”表达。当要表示“两双”时，量词“pair”需要使用复数形式“pairs”。因此，排除A和C选项。\n2.  “two pairs of”意为“两双”，修饰的是名词“shoe”。既然是两双，就意味着不止一只鞋，所以名词“shoe”也必须使用复数形式“shoes”。因此，排除B选项。\n3.  综上所述，“two pairs of shoes”是正确的表达方式。","knowledge_expansion_md":"本题考查“数词 + 复数量词 + of + 名词”的结构，这是英语中表示数量的常用方式。\n\n1.  **当of后的名词是可数名词时**：该名词通常用复数形式。例如：\n    *   `two boxes of apples` (两箱苹果)\n    *   `five cups of coffee` (五杯咖啡，这里coffee虽为不可数，但cup是可数的，指五份)\n\n2.  **当of后的名词是不可数名词时**：该名词保持原形。例如：\n    *   `three glasses of water` (三杯水)\n    *   `a piece of news` (一则新闻)\n\n3.  **特殊名词 `pair`**：`pair`常用于成双成对的物品，如 `shoes` (鞋), `glasses` (眼镜), `trousers` (裤子), `scissors` (剪刀)。这些名词本身常常以复数形式出现。当`pair`前的数词大于1时，`pair`要变为`pairs`。例如：`a pair of trousers` (一条裤子)，`four pairs of scissors` (四把剪刀)。","socratic_tracks":[{"title":"量词 pair 的单复数","steps":[{"question":"当我们说“一双鞋”时，英文怎么说？","hint":"我们用一个特定的词来表示“一对”或“一双”。","takeaway":"“一双鞋”是 “a pair of shoes”。"},{"question":"那如果我们要说“两双鞋”，表示数量的“pair”这个词需不需要变化？","hint":"就像我们说“one apple”和“two apples”一样，可数名词在数量大于1时需要变成复数。","takeaway":"当数量大于一时，量词“pair”需要变成复数“pairs”。"}]},{"title":"名词 shoe 的单复数","steps":[{"question":"“两双鞋”总共有几只鞋？是一只还是多只？","hint":"一双是两只，两双是四只。","takeaway":"“两双鞋”指的是多只鞋，是复数概念。"},{"question":"既然是多只鞋，那么在“two pairs of”后面的名词“shoe”应该用单数还是复数形式？","hint":"英语中，可数名词的复数形式通常在词尾加-s或-es。","takeaway":"因为指的是多只鞋，所以名词“shoe”必须使用其复数形式“shoes”。"}]},{"title":"结构辨析与应用","steps":[{"question":"综合来看，选项A (two pair of shoes) 和选项B (two pairs of shoe) 分别错在哪里？","hint":"分别思考一下“pair”和“shoe”的单复数形式是否正确。","takeaway":"选项A的“pair”错了，选项B的“shoe”错了。"},{"question":"你能用类似的结构正确地表达“五条裤子”吗？","hint":"“裤子”的英文是“trousers”或“pants”，它本身就是复数形式。","takeaway":"“五条裤子”的正确表达是 “five pairs of trousers/pants”。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"I think _____ is important to eat a balanced diet to stay healthy.","options":{"A":"this","B":"that","C":"he","D":"it"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查形式主语`it`的用法。\n句子的真正主语是后面的动词不定式短语 `to eat a balanced diet to stay healthy`（为了保持健康而吃均衡的饮食）。\n在英语中，当动词不定式短语、动名词短语或从句作主语时，为了避免句子结构“头重脚轻”，常常使用`it`作为形式主语放在句首，而将真正的主语移到句子末尾。\n本句的基本句型是 `It is + 形容词 + to do sth.`，意为“做某事是……的”。\n选项A `this` 和B `that` 是指示代词，通常指代上文提到的具体事物，不在此句型中作形式主语。选项C `he` 是人称代词，指代男性，与句意不符。","knowledge_expansion_md":"#### 形式主语 `it` 的用法总结\n\n`it`可以代替真正的主语（动词不定式、动名词或that从句），使句子结构更加平衡。这是一种非常重要的语法结构。\n\n**1. 代替动词不定式短语**\n*   `It is + adj. (+ for sb.) + to do sth.`\n    *   `It is important to learn English well.` (学好英语很重要。)\n    *   `It is difficult for him to finish the task in one day.` (对他来说，一天内完成任务是困难的。)\n\n**2. 代替动名词短语**\n*   `It is + no use/no good/fun + doing sth.`\n    *   `It is no use crying over spilt milk.` (覆水难收，哭也无用。)\n\n**3. 代替that引导的主语从句**\n*   `It is + adj./noun/past participle + that-clause`\n    *   `It is a pity that you missed the party.` (你错过了派对，真可惜。)\n    *   `It is said that a new library will be built here.` (据说这里要建一个新图书馆。)\n\n#### 形式宾语 `it`\n`it` 也可以作形式宾语，常见于 `find/think/make/feel` 等动词后，其结构为：`动词 + it + 宾补 + 真正的宾语`。\n*   `I think it necessary to take a break.` (我认为有必要休息一下。)","socratic_tracks":[{"title":"寻找真正的主语","steps":[{"question":"在这个句子中，“什么事情”是重要的？","hint":"请看句子的后半部分 `...to eat a balanced diet to stay healthy`，它描述了一件具体的事情。","takeaway":"“为了保持健康而吃均衡的饮食”这件事是重要的。"},{"question":"这个描述事情的短语 `to eat a balanced diet...` 在句子中本应充当什么成分？","hint":"一个完整的句子需要主语。这里 `is important` 是谓语部分，那么“谁”或“什么” `is important` 呢？","takeaway":"这个不定式短语是这个句子的真正主语。"}]},{"title":"形式主语的引入","steps":[{"question":"如果把真正的主语 `To eat a balanced diet to stay healthy` 直接放在句首，这个句子读起来感觉如何？","hint":"一个很长的主语放在句首，会让人觉得句子不平衡，像一个大头娃娃。","takeaway":"当主语太长时，直接放在句首会造成“头重脚轻”，不符合英语的表达习惯。"},{"question":"为了让句子结构更平衡，英语中通常会用一个“占位置”的词放在句首，这个词是什么？","hint":"这个词本身没有实际意义，只是为了满足语法结构而存在。","takeaway":"英语中常用 `it` 来充当形式主语，把真正的主语后置。"}]},{"title":"辨析其他选项","steps":[{"question":"为什么不能用 `this` 或 `that`？它们不也能指代“这件事”吗？","hint":"`this` 和 `that` 通常指代上文已经提到过、听者和说者都知道的特定事物。这里是第一次提出“吃均衡饮食”这件事。","takeaway":"`this/that` 是实指代词，而这里需要一个没有实际意义、只起语法作用的形式主语 `it`。"},{"question":"为什么不能用 `he`？","hint":"`he` 是人称代词，指代“他”。“吃均衡饮食”是人还是事？","takeaway":"句子的主语是一件事情，而不是人，所以不能用人称代词 `he`。"}]}]}}]},{"section_title":"II. 完形填空","section_instruction":"每小题1.5分，共15分。\n\nYu Mei wants to eat dumplings. So she goes to a house of dumplings __1__ her mother. There are many kinds of __2__ in the restaurant. So she is very __3__. She sees many nice dumpling pictures on the wall. She looks at the menu. There are two __4__ bowls of dumplings. She is hungry (饿的). So she'd like a __5__ bowl. And she'd like the use __6__ onions. She wants her mother to __7__ it for her. When she __8__ some drinks, she also asks her mother to buy some. Her mother buys salad, orange juice __9__ green tea. __10__ are they? Only 4.5 dollars.","items":[{"number":"11","item_type":"cloze","context_note":"","stem":"1. 和……一起","options":{"A":"with","B":"and","C":"or","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查介词的用法。根据句意“她和她妈妈一起去饺子馆”（She goes to a house of dumplings ... her mother），空格处需要一个表示“和……一起”的介词。`with` 意为“和……一起”，符合句意。`and` 是连词，表示“和”，连接并列成分；`or` 是连词，表示“或者”。因此，正确答案是 A。","knowledge_expansion_md":"#### 介词 `with` 的用法\n\n`with` 是一个非常常用的介词，其核心含义是“和...在一起”，可以表示：\n\n1.  **伴随**：表示“和...一起”，强调某人或某物伴随着主语。这是本题的考点。\n    *   `I went to the park with my friends.` (我和我的朋友们一起去了公园。)\n    *   `She lives with her parents.` (她和她的父母住在一起。)\n\n2.  **拥有/带有**：表示“带有...”、“有...”。\n    *   `a girl with long hair` (一个长头发的女孩)\n    *   `a room with a big window` (一个有大窗户的房间)\n\n3.  **使用工具/方式**：表示“用...”。\n    *   `He writes with a pen.` (他用钢笔写字。)\n    *   `Please handle it with care.` (请小心处理。)","socratic_tracks":[{"title":"理解句子含义","steps":[{"question":"这句话 'So she goes to a house of dumplings __1__ her mother' 想表达什么意思？","hint":"Yu Mei 和她的妈妈是什么关系？她们是一起去的吗？","takeaway":"她和她妈妈一起去了一家饺子馆。"},{"question":"哪个词可以表达'和...一起'的意思？","hint":"在英语中，表示伴随关系的介词是哪个？","takeaway":"介词 `with` 可以表示'和...一起'。"}]},{"title":"辨析选项","steps":[{"question":"选项中的 `and` 和 `with` 有什么区别？","hint":"`and` 是连词，连接两个平等的成分，比如 'you and me'。`with` 是介词，表示伴随。","takeaway":"`and` 连接并列成分，`with` 表示伴随关系。'She and her mother go...' 是正确的，但这里是 'she goes... __1__ her mother'，需要用介词短语作状语。"},{"question":"为什么不能选 `or`？","hint":"`or` 表示选择，'或者'。","takeaway":"句意是两个人一起去，而不是选择其中一个去，所以 `or` 不符合逻辑。"}]}]}},{"number":"12","item_type":"cloze","context_note":"","stem":"2. 食物种类","options":{"A":"things","B":"dumplings","C":"drinks","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词辨析。根据上文“So she goes to a house of dumplings”（她去了一家饺子馆），以及下文“She sees many nice dumpling pictures on the wall”（她看到墙上有很多好看的饺子图片），可以推断出这家餐厅主营饺子。因此，句意应为“餐厅里有很多种类的饺子”。`dumplings` (饺子) 符合语境。`things` (东西) 过于宽泛；`drinks` (饮料) 不符合餐厅主题。因此，正确答案是 B。","knowledge_expansion_md":"#### 完形填空技巧：利用上下文线索\n\n完形填空题的答案往往隐藏在文章的上下文（前文或后文）中。解题时，要像侦探一样寻找线索。\n\n1.  **前文线索**：本题的答案线索就在前一句 `a house of dumplings` (饺子馆)。这直接点明了餐厅的主题。\n2.  **后文线索**：空格后的句子 `She sees many nice dumpling pictures on the wall` (她看到墙上有很多好看的饺子图片) 再次印证了这家餐厅是卖饺子的。\n3.  **常识推理**：一家“饺子馆”里，理应有“很多种类的饺子”。\n\n通过综合利用这些线索，可以轻松锁定答案。","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"这句话 'There are many kinds of __2__ in the restaurant.' 的前一句是什么？","hint":"Yu Mei 去了哪里？","takeaway":"前一句是 'So she goes to a house of dumplings...' (她去了一家饺子馆)。"},{"question":"根据前文，这家餐厅是卖什么的？","hint":"a house of dumplings","takeaway":"这是一家饺子馆，主营饺子。"},{"question":"那么，'餐厅里有很多种类的____'，空格里填什么最合理？","hint":"饺子馆里应该有很多种类的什么？","takeaway":"应该有很多种类的饺子 (`dumplings`)。"}]},{"title":"选项辨析","steps":[{"question":"为什么不选 A `things` (东西)？","hint":"这个词是不是太笼统了？","takeaway":"`things` 词义太宽泛，不如 `dumplings` 具体和贴切。"},{"question":"为什么不选 C `drinks` (饮料)？","hint":"虽然餐厅也卖饮料，但'很多种类'的，并且是餐厅主题的，应该是什么？","takeaway":"餐厅的主题是饺子，所以'很多种类'的应该是饺子，而不是饮料。"}]}]}},{"number":"13","item_type":"cloze","context_note":"","stem":"3. 高兴的","options":{"A":"scry","B":"happy","C":"good","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词辨析。根据上文“There are many kinds of dumplings in the restaurant”（餐厅里有很多种类的饺子），以及下文“She sees many nice dumpling pictures on the wall”（她看到墙上有很多好看的饺子图片），可以推断出 Yu Mei 看到这么多选择时，心情应该是积极的。`happy` 意为“高兴的，开心的”，符合句意“所以她非常开心”。`good` (好的) 在此语境不通顺。`scry` (占卜) 是动词，词义和词性都不对。因此，正确答案是 B。","knowledge_expansion_md":"#### 形容词辨析：`happy` vs. `excited` vs. `glad`\n\n这三个词都表示“高兴”，但在用法和语气上有细微差别。\n\n1.  **`happy`**：最常用、最普遍的词，表示内心的喜悦、满足和幸福感。可以指长期的幸福，也可以指一时的开心。\n    *   `She is very happy to see so many choices.` (看到这么多选择她很开心。)\n\n2.  **`excited`**：表示“兴奋的，激动的”，通常指因期待某事或经历某事而感到非常高兴和激动，情绪比较强烈。\n    *   `The children were excited about opening their presents.` (孩子们对拆礼物感到很兴奋。)\n\n3.  **`glad`**：表示“高兴的，乐意的”，通常用于对某件事感到庆幸或欣慰，语气比 `happy` 稍弱，常用于 `be glad to do sth.` 或 `be glad that...` 结构中。\n    *   `I'm glad you could come.` (我很高兴你能来。)","socratic_tracks":[{"title":"理解上下文情感","steps":[{"question":"当 Yu Mei 在饺子馆里看到有很多种类的饺子时，她的心情可能会是怎样的？","hint":"想象一下你来到一家你最喜欢的餐厅，菜单上有很多好吃的。","takeaway":"她可能会感到高兴、兴奋。"},{"question":"所以，空格里需要填一个描述她心情的词。这个词应该是什么词性？","hint":"前面有 `very` (非常)。","takeaway":"需要一个形容词。"}]},{"title":"选项分析与排除","steps":[{"question":"看选项 B `happy` (高兴的)。这个词符合我们刚才的推断吗？","takeaway":"符合，`happy` 可以描述她当时开心的心情。"},{"question":"看选项 A `scry`。你知道这个词的意思和词性吗？","hint":"这是一个不常见的词，意思是'占卜'，是个动词。","takeaway":"`scry` 是动词，词义也完全不对，所以排除。"},{"question":"看选项 C `good` (好的)。'She is very good' 在这里说得通吗？","hint":"'She is good' 通常是评价一个人的品行或能力，比如 'She is good at English'。","takeaway":"`good` 在这里不符合语境，不能用来描述看到很多选择时的心情。"}]}]}},{"number":"14","item_type":"cloze","context_note":"","stem":"4. 碗的大小","options":{"A":"big","B":"kinds","C":"sizes","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查名词辨析和上下文理解。根据后文“She is hungry (饿的). So she'd like a __5__ bowl.”（她饿了，所以她想要一个……的碗），可知她在根据自己的饥饿程度选择碗的大小。因此，菜单上提供的应该是两种不同大小的碗。选项中，`sizes` 意为“大小，尺寸”，符合语境。虽然 `two sizes bowls` 的语法不完全规范（应为 `bowls of two different sizes`），但在选项中 `sizes` 是表达“大小”这一概念的最佳选择。`kinds` (种类) 和 `big` (大的) 不如 `sizes` 贴切。因此，正确答案是 C。","knowledge_expansion_md":"#### 上下文推理：根据后文推断前文\n\n在完形填空中，一个空缺的信息往往需要通过阅读后面的句子来补全。这是一种非常重要的解题技巧。\n\n*   **本题线索**：第4个空的信息，是由第5个空所在的句子提供的。`She is hungry. So she'd like a __5__ bowl.` 这句话表明，她做出的选择与“饥饿程度”有关。\n*   **逻辑链条**：饿了 → 想吃多一点 → 选择大碗。这个逻辑链条反过来告诉我们，菜单上提供了不同“大小 (sizes)”的碗供选择。\n\n做题时，如果当前句子无法提供足够信息，一定要继续往下读，答案可能就在下一句。","socratic_tracks":[{"title":"寻找解题线索","steps":[{"question":"要填第4个空，我们应该关注文章的哪句话？","hint":"看看空格后面的句子说了什么。","takeaway":"关键线索在后面的句子：'She is hungry (饿的). So she'd like a __5__ bowl.' (她饿了，所以她想要一个……的碗。)"},{"question":"一个人饿的时候，在选择食物分量时会怎么选？","hint":"饿了是想吃多还是吃少？","takeaway":"饿了通常会选择分量大的一份。"},{"question":"这说明菜单上提供的碗有什么不同？是颜色不同，还是大小不同？","takeaway":"这说明碗的大小 (sizes) 是有区别的，比如大碗和小碗。"}]},{"title":"选项辨析","steps":[{"question":"根据我们的分析，选项 A 'big', B 'kinds', C 'sizes' 中，哪个词最能表达'大小'这个概念？","takeaway":"选项 C `sizes` (大小，尺寸) 最符合。"},{"question":"为什么不选 B 'kinds' (种类)？","hint":"虽然也可能有不同种类的饺子，但后文的'饿了'这个线索更直接地指向了分量，也就是大小。","takeaway":"后文的线索'hungry'强烈暗示了选择与分量/大小有关，而不是种类。"}]}]}},{"number":"15","item_type":"cloze","context_note":"","stem":"5. 大碗","options":{"A":"great","B":"small","C":"large","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词辨析和逻辑推理。根据上文“She is hungry (饿的)”（她饿了），可以进行逻辑推断：因为饿了，所以她会想要一个大碗的饺子。选项中，`large` 意为“大的”，符合语境。`small` (小的) 与“饿了”的语境相反。`great` (巨大的；伟大的) 虽然也有“大”的意思，但 `large` 在描述食物分量大小时更常用、更贴切。因此，正确答案是 C。","knowledge_expansion_md":"#### 形容词辨析：`large` vs. `big` vs. `great`\n\n这三个词都含有“大”的意思，但在用法上有区别。\n\n1.  **`large`**: 通常指面积、体积、数量上的“大”，是一个比较正式、客观的词。常用来描述衣服尺码、食物份量等。\n    *   `a large bowl of noodles` (一大碗面条)\n    *   `a large population` (众多的人口)\n\n2.  **`big`**: 是最口语化、最常用的表示“大”的词，可以指代尺寸、体积、重要性等，适用范围很广。\n    *   `a big house` (一个大房子)\n    *   `a big problem` (一个大问题)\n\n3.  **`great`**: 更多地表示“伟大的”、“杰出的”、“非常好的”，带有赞美或强调的感情色彩。虽然有时也指尺寸上的“巨大”，但不如 `large` 或 `big` 常用。\n    *   `a great man` (一个伟人)\n    *   `a great success` (巨大的成功)\n\n在本题中，描述碗的大小，`large` 是非常恰当的选择。","socratic_tracks":[{"title":"逻辑推理","steps":[{"question":"这句话 'So she'd like a __5__ bowl.' 的前半句是什么？","hint":"是什么原因导致她做出选择？","takeaway":"前半句是 'She is hungry (饿的).'"},{"question":"根据常识，一个饿了的人会选择大份的食物还是小份的食物？","takeaway":"通常会选择大份的食物。"},{"question":"那么，空格里应该填一个表示'大'的形容词。是哪个？","takeaway":"应该填一个表示'大'的词。"}]},{"title":"选项辨析","steps":[{"question":"看选项，A 'great', B 'small', C 'large'，哪个词的意思是'大的'并且最适合描述碗的大小？","takeaway":"C `large` (大的) 最合适。"},{"question":"为什么不选 B 'small' (小的)？","hint":"这和'饿了'的逻辑矛盾吗？","takeaway":"不符合'饿了'就要吃大份的逻辑，所以排除。"},{"question":"为什么 C `large` 比 A `great` 更好？","hint":"`great` 通常有什么更强的含义？","takeaway":"`large` 客观描述大小，而 `great` 常带有'伟大的、很棒的'等感情色彩，在这里用 `large` 更准确。"}]}]}},{"number":"16","item_type":"cloze","context_note":"","stem":"He thanked the woman ______ her help.","options":{"A":"for","B":"with","C":"at","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题考查非常基础且重要的固定搭配。短语 \"thank somebody for something\" 意为“因某事而感谢某人”，是英语中表达感谢的常用句式。在这个结构中，介词 \"for\" 用来引出感谢的原因或事项。本句意为“他为她的帮助而感谢那位女士”，\"her help\" (她的帮助) 正是感谢的原因，因此必须使用介词 \"for\"。选项 B \"with\" (带有；和) 和 C \"at\" (在…) 均不符合该短语的用法。","knowledge_expansion_md":"### 动词 + for + 原因\n\n英语中，很多表示“表扬、感谢、惩罚、责备”等的动词，在说明其原因时，都习惯搭配介词 `for`。这是一个非常重要的语法规律。\n\n*   **感谢**: `thank sb for sth` (为某事感谢某人)\n    *   *Thank you for your kindness.* (谢谢你的好意。)\n*   **表扬**: `praise sb for sth` (为某事表扬某人)\n    *   *The teacher praised him for his honesty.* (老师为他的诚实表扬了他。)\n*   **道歉**: `apologize to sb for sth` (为某事向某人道歉)\n    *   *I must apologize for my late arrival.* (我必须为我的迟到道歉。)\n*   **责备/惩罚**: `blame/punish sb for sth` (为某事责备/惩罚某人)\n    *   *Don't blame me for what happened.* (别为发生的事责备我。)","socratic_tracks":[{"title":"固定搭配识别","steps":[{"question":"当你想用英语表达“为了...而感谢你”时，你会怎么说？比如“谢谢你的礼物”。","hint":"这是一个非常口语化、日常的表达。","takeaway":"我们通常说 \"Thank you for your gift.\"。"},{"question":"在这个短语 \"Thank you for...\" 中，连接“感谢”和“感谢的原因”的介词是哪个？","hint":"就是 'for' 这个词。","takeaway":"介词 'for' 在这里用来引出感谢的原因。"},{"question":"那么，回到题目 \"He thanked the woman ______ her help\"，根据我们刚才总结的规律，应该填入哪个介词？","hint":"'her help' (她的帮助) 就是感谢的原因。","takeaway":"同样地，这里也应该使用 'for' 来引出感谢的原因，构成 'thank sb for sth' 的固定搭配。"}]},{"title":"介词功能辨析","steps":[{"question":"我们知道 'for' 在这里表示“原因”。那么介词 'with' 和 'at' 能表示原因吗？它们通常用在什么地方？","hint":"想想 'go with sb' (和某人一起去), 'look at sth' (看某物)。","takeaway":"'with' 常表示“和...一起”或“用...工具”；'at' 常表示“在...地点”或“指向...目标”。它们都不能表示感谢的原因。"},{"question":"试着把 'with' 和 'at' 放入句子中，读一读，看看是否通顺？","hint":"\"thanked the woman with her help\" 和 \"thanked the woman at her help\"。","takeaway":"将 'with' 或 'at' 放入句子后，意思变得奇怪且不合逻辑，进一步证明了它们是错误选项。"}]},{"title":"举一反三","steps":[{"question":"你学会了 'thank sb for sth'。我们再看一个结构相似的短语 'be famous for sth' (因...而著名)，你能用它造个句子吗？","hint":"比如，四川因什么而闻名？","takeaway":"一个例子是：Sichuan is famous for its spicy food and pandas. (四川因其辛辣的食物和熊猫而闻名。)"},{"question":"再看一个 'be sorry for sth' (为...感到抱歉)。如果我打碎了你的杯子，我该怎么道歉？","hint":"用 'I am sorry for...' 这个句型。","takeaway":"你应该说：I am sorry for breaking your cup. (很抱歉打碎了你的杯子。)"},{"question":"通过这些例子，你发现了什么共同的规律？","hint":"看看 'for' 在这些短语里都起到了什么作用。","takeaway":"在很多短语中，介词 'for' 都被用来引出动作或状态的原因。"}]}]}},{"number":"17","item_type":"cloze","context_note":"","stem":"Let's go to the market to ___ some fruit.","options":{"A":"buy","B":"eat","C":"take","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这道题考查动词的词义辨析。此题需要结合上下文语境进行作答。我们需要根据选项推测可能的语境。选项 A `buy` (购买)，B `eat` (吃)，C `take` (拿走；服用；乘坐等)。\n\n在一个典型的购物或准备食物的语境中，比如 “Let's go to the market to ___ some fruit.” (我们去市场____些水果吧。)，动词 `buy` (购买) 是最符合逻辑的。`eat` 表示当场就吃，`take` 的意思则过于宽泛，不如 `buy` 精准。因此，在最常见的语境假设下，`buy` 是最佳选项。","knowledge_expansion_md":"### 动词辨析：buy, eat, take\n\n这三个动词在日常生活中都非常高频，但用法和搭配各不相同。\n\n1.  **buy (购买)**: 指用钱换取物品。\n    *   搭配：`buy sth.` (买某物), `buy sth. for sb.` (为某人买某物), `buy sb. sth.` (给某人买某物)\n    *   例句：`My mother bought a new dress for me.` (我妈妈给我买了一条新裙子。)\n\n2.  **eat (吃)**: 指将食物放入口中咀嚼并吞咽。\n    *   搭配：`eat breakfast/lunch/dinner` (吃早/午/晚餐), `eat out` (外出就餐), `eat up` (吃光)\n    *   例句：`What do you want to eat for dinner?` (你晚饭想吃什么？)\n\n3.  **take (拿；带；乘坐；花费等)**: 这是一个含义非常丰富的动词，其具体意思需要根据上下文判断。\n    *   `take sth. with you`: 随身带着某物。 `Don't forget to take your umbrella.`\n    *   `take medicine`: 吃药。 `You should take the medicine three times a day.`\n    *   `take a bus/train/plane`: 乘坐交通工具。 `I take the bus to school.`\n    *   `take pictures/photos`: 拍照。 `Let's take a photo here.`\n    *   `take time/money`: 花费时间/金钱。 `It takes me 20 minutes to walk to school.`","socratic_tracks":[{"title":"动词与宾语搭配","steps":[{"question":"如果我们想表达“买苹果”，应该用哪个动词？如果想表达“吃苹果”呢？","hint":"想想“买”和“吃”在中文里的区别，它们对应着不同的动作。","takeaway":"不同的动词描述不同的动作，需要和动作的对象（宾语）合理搭配。"},{"question":"如果句子的宾语是“药(medicine)”，我们通常用哪个动词来表达“吃药”？是 `eat` 吗？","hint":"英语中“吃药”有一个固定的说法，不是我们中文直译的 `eat`。","takeaway":"英语中“吃药”的固定搭配是 `take medicine`，而不是 `eat medicine`。"}]},{"title":"多义词 'take'","steps":[{"question":"“I take a bus to school.” 和 “I take a book from the shelf.” 这两句话里的 `take` 意思一样吗？","hint":"第一句是关于交通方式，第二句是关于一个“拿取”的动作。","takeaway":"动词 `take` 有很多含义，如“乘坐”、“拿取”等，需要根据上下文判断其具体意思。"},{"question":"我们来造个句子描述“拍照”这个动作，应该用哪个动词？","hint":"“拍照”在英语里也是一个和 `take` 相关的固定短语。","takeaway":"“拍照”的英文是 `take a picture` 或 `take a photo`。"}]},{"title":"根据场景选动词","steps":[{"question":"如果你在一家商店里，看到货架上的商品，你接下来可能会做什么动作？用一个动词描述。","hint":"在商店里，我们的主要目的是什么？","takeaway":"在商店（store）或市场（market）这样的场景中，`buy` 是一个关键的动词。"},{"question":"如果你在一家餐厅（restaurant）里，服务员把菜端上来了，你接下来会做什么？","hint":"菜上来了，我们当然是……","takeaway":"在餐厅（restaurant）或饭桌（dinner table）旁，`eat` 是最核心的动作。"}]}]}},{"number":"18","item_type":"cloze","context_note":"","stem":"The new dress ___ beautiful.","options":{"A":"looks","B":"watches","C":"sees","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这道题考查近义动词的辨析，特别是关于“看”的三个动词：`looks`, `watches`, `sees`。\n\n*   `looks`：作为感官动词（linking verb）时，意为“看起来”，后面常跟形容词，用来描述主语的状态或外观。例如：`The cake looks delicious.` (蛋糕看起来很美味)。\n*   `watches`：意为“观看，注视”，通常指有意识地、持续一段时间地看动态的或变化中的事物，如看电视、看比赛。例如：`He watches TV every night.`\n*   `sees`：意为“看见”，强调看的结果，指眼睛注意到某物，可能是有意的也可能是无意的。例如：`I see a bird in the tree.`\n\n假设题目所在的句子是描述某物的外观，比如 “The new dress ___ beautiful.” (新裙子___很漂亮)，那么 `looks` 是唯一正确的选项。","knowledge_expansion_md":"### “看”的家族：look, see, watch\n\n这三个词是英语初学者的常见易错点。它们的区别主要在于动作的意图、持续时间和方式。\n\n1.  **look (看，瞧)**\n    *   **不及物动词**：强调“看”的动作本身，常与介词连用。\n        *   `look at...`: 看... (有意识地把目光投向...)\n        *   `look for...`: 寻找...\n        *   `look after...`: 照顾...\n    *   **感官动词/系动词**：意为“看起来”，后接形容词。\n        *   `You look happy today.` (你今天看起来很高兴。)\n\n2.  **see (看见，明白)**\n    *   **及物动词**：强调“看”的结果，即“看见了”。\n        *   `Did you see my keys?` (你看见我的钥匙了吗？)\n    *   可以表示“理解，明白”。\n        *   `Oh, I see.` (哦，我明白了。)\n    *   可以表示“看电影/看病/拜访”。\n        *   `see a film`, `see a doctor`, `see a friend`\n\n3.  **watch (观看，注视)**\n    *   **及物动词**：强调在一段时间内，有意识地、专注地看活动或变化中的事物。\n        *   `watch TV/a movie/a football match` (看电视/电影/足球赛)\n        *   `Watch your step!` (小心脚下！)","socratic_tracks":[{"title":"动作意图与持续性","steps":[{"question":"“看电视”和“看见一只鸟”，哪个动作持续的时间更长，更有意识？","hint":"看电视通常是坐下来专注地看一段时间，而看见一只鸟可能只是一瞬间的事。","takeaway":"`watch` 用于持续观看动态事物，而 `see` 强调“看见”这一结果。"},{"question":"老师说：“请看黑板。” 他会用 `Look at the blackboard.` 还是 `See the blackboard.`？为什么？","hint":"老师是想让学生把目光“投向”黑板，发出一个指令。","takeaway":"`look at` 强调“看”这个有意识的动作，而 `see` 是看的结果。"}]},{"title":"感官动词 'look'","steps":[{"question":"在句子 “She looks happy.” 中，`looks` 是什么意思？它后面跟的是什么词性的词？","hint":"这句话是描述她的外表给人的感觉。happy 是形容词。","takeaway":"`look` 作为感官动词，意为“看起来”，后面要跟形容词。"},{"question":"我们能说 “She looks happily.” 吗？为什么？","hint":"Happily 是副词，通常用来修饰动词。而这里的 `looks` 是系动词，功能类似 `is`。","takeaway":"感官动词 `look` 后面不能跟副词，只能跟形容词，因为它描述的是主语的状态。"}]},{"title":"固定搭配辨析","steps":[{"question":"“看电影”可以用 `see a film` 也可以用 `watch a film`，它们有什么细微差别吗？","hint":"`see a film` 更多指去电影院看电影这个活动，而 `watch a film` 强调观看的过程，可以在任何地方（如在家）。","takeaway":"虽然有时可互换，但 `see a film` 偏向于去电影院的社交活动，`watch a film` 强调观看行为本身。"},{"question":"“寻找”我的钢笔，应该用 `look for`, `see for` 还是 `watch for`？","hint":"这是一个非常常见的固定短语，表示“寻找”。","takeaway":"动词短语 `look for` 的意思是“寻找”。"}]}]}},{"number":"19","item_type":"cloze","context_note":"","stem":"I bought a pen, a ruler, ___ an eraser.","options":{"A":"also","B":"with","C":"and","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考查的是词性与句子结构，选项是三个功能完全不同的词。\n\n*   A: `also` (也) 是一个副词，通常放在行为动词前或be动词后，表示补充说明。例如：`I also like apples.`\n*   B: `with` (和...一起；带有) 是一个介词，后面跟名词或代词，组成介词短语。例如：`a girl with big eyes`。\n*   C: `and` (和；并且) 是一个并列连词，用来连接两个或多个语法功能相同的词、短语或句子。例如：`bread and butter`。\n\n在一个需要连接两个名词（如购物清单）的语境中，比如 “I bought a pen, a ruler, ___ an eraser.” (我买了一支钢笔，一把尺子，___一块橡皮)，`and` 是唯一正确的选择，因为它用于连接并列的成分。","knowledge_expansion_md":"### 词性辨析：连词 (and), 介词 (with), 副词 (also)\n\n理解不同词性的功能是构建正确句子的基础。\n\n1.  **并列连词 (Conjunction) - `and`**\n    *   功能：连接语法地位相同的成分。被连接的成分必须是“平级”的。\n    *   连接名词：`I like dogs and cats.`\n    *   连接动词：`He can sing and dance.`\n    *   连接形容词：`The story is long and boring.`\n    *   连接句子：`It was getting dark, and we went home.`\n\n2.  **介词 (Preposition) - `with`**\n    *   功能：表示词与词之间的关系，后面必须跟名词、代词或动名词，构成介词短语。\n    *   表示“和...一起”：`I went to the park with my friends.`\n    *   表示“带有；拥有”：`Do you see the man with a hat?`\n    *   表示“用...”：`He writes with a pen.`\n\n3.  **副词 (Adverb) - `also`**\n    *   功能：修饰动词、形容词、其他副词或整个句子，表示“也”。\n    *   位置：通常在 `be` 动词之后，行为动词之前。`She is also a doctor. / She also plays the piano.`\n    *   **易混淆词**：`too` 和 `as well` 也表示“也”，但通常放在句末。`I like music, too.` / `I like music as well.`","socratic_tracks":[{"title":"词性与句子功能","steps":[{"question":"在 “a pen ___ a book” 这个短语的横线上，我们想表达“一支笔和一本书”，应该填什么词？为什么？","hint":"我们需要一个词来“连接” `a pen` 和 `a book` 这两个名词短语。","takeaway":"连词 `and` 的基本功能就是连接两个或多个同类词或短语。"},{"question":"在句子 “The girl ___ long hair is my sister.” 中，我们想表达“长头发的女孩”，应该填什么词？","hint":"这里需要一个词来表示“带有”或“拥有”的关系。","takeaway":"介词 `with` 可以用来描述人或物的特征，表示“带有”。"}]},{"title":"并列结构","steps":[{"question":"“I like swimming and to skate.” 这个句子有什么问题吗？","hint":"`and` 连接的两个成分形式上应该保持一致。`swimming` 是动名词，`to skate` 是不定式。","takeaway":"使用 `and` 连接时，要尽量保持连接的成分在结构和形式上的平行，应改为 `swimming and skating` 或 `to swim and to skate`。"},{"question":"如果我想列举三样东西，比如苹果、香蕉、橘子，`and` 应该放在哪里？","hint":"在A, B, C的列表中，连接词通常只在最后两项之间出现。","takeaway":"在列举多个并列项时，通常用逗号分隔前面的各项，只在最后两项之间使用 `and`，即 `A, B, and C`。"}]},{"title":"副词 'also' 的位置","steps":[{"question":"“我也是一名学生” 这句话，用 `also` 怎么表达？`I also am a student.` 对吗？","hint":"回忆一下副词 `also` 和 `be` 动词（am, is, are）的位置关系。","takeaway":"副词 `also` 应该放在 `be` 动词的后面，所以正确说法是 `I am also a student.`。"},{"question":"那 “我也喜欢音乐” 呢？`I like also music.` 对吗？","hint":"这次是和行为动词 `like` 一起使用。","takeaway":"副词 `also` 应该放在行为动词的前面，所以正确说法是 `I also like music.`。"}]}]}},{"number":"20","item_type":"cloze","context_note":"","stem":"10. ___ are they?","options":{"A":"How much","B":"How many","C":"What","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这道题考查特殊疑问词的用法，重点区分 `How much` 和 `How many`。\n\n*   A: `How much` 用于提问不可数名词的数量，或者提问价格。例如：`How much water is in the bottle?` (瓶子里有多少水？) / `How much is the book?` (这本书多少钱？)\n*   B: `How many` 用于提问可数名词复数的数量。例如：`How many students are in your class?` (你们班有多少学生？)\n*   C: `What` 用于询问信息、名称、事物等。例如：`What is your name?` (你叫什么名字？)\n\n在购物场景中，询问价格是非常常见的。如果题目是 “___ is it?” 或 “___ are they?” 来询问价格，那么 `How much` 是最合适的。如果后面跟的是一个不可数名词（如 `money`, `time`），也应该用 `How much`。","knowledge_expansion_md":"### 特殊疑问词辨析：How much, How many, What\n\n1.  **How much vs. How many**\n    *   核心区别在于其后修饰的名词是**可数**还是**不可数**。\n    *   **`How much` + 不可数名词**: `How much milk/money/time do you need?`\n    *   **`How many` + 可数名词复数**: `How many apples/books/days are there?`\n    *   **提问价格**：固定用 `How much`。\n        *   `How much is this T-shirt?` (单数)\n        *   `How much are these shoes?` (复数)\n\n2.  **`What` 的用法**\n    *   `What` 的用途非常广泛，可以单独使用，也可以和名词连用。\n    *   询问“什么”：`What is that?`\n    *   询问职业：`What does your father do?`\n    *   询问颜色、时间、尺寸等：`What color is your car?` / `What time is it?`\n    *   **`What` vs `How much` 提问价格**：虽然 `How much is it?` 是标准问法，但在口语中有时也会听到 `What's the price?` (价格是什么？)，但直接用 `What is it?` 来问价格是错误的。\n\n3.  **由 `How` 引导的其他疑问词**\n    *   `How old`: 问年龄\n    *   `How tall`: 问身高\n    *   `How long`: 问时长或长度\n    *   `How often`: 问频率\n    *   `How far`: 问距离\n    *   `How soon`: 问“再过多久”","socratic_tracks":[{"title":"可数与不可数名词","steps":[{"question":"“水(water)”和“书(book)”这两个名词，哪个是可数的，哪个是不可数的？","hint":"可以数“一个、两个、三个...”的就是可数名词。","takeaway":"能用具体数字计数的名词是可数名词（如 book, apple），不能直接计数的物质或抽象概念是不可数名词（如 water, time）。"},{"question":"那么，提问“有多少水”和“有多少本书”，应该分别用 `How much` 还是 `How many`？","hint":"`How much` 问不可数，`How many` 问可数。","takeaway":"提问不可数名词数量用 `How much`，提问可数名词数量用 `How many`。"}]},{"title":"提问价格","steps":[{"question":"你想问一件T恤衫的价格，应该怎么说？","hint":"价格（price）在英语中被当作一个不可数的概念来提问。","takeaway":"询问价格的句型是 `How much is...?` 或 `How much are...?`。"},{"question":"如果我想问“这些苹果多少钱？”，主语是复数 `these apples`，那应该用 `How much is` 还是 `How much are`？","hint":"主语是复数时，be动词要用相应的复数形式。","takeaway":"当询问复数商品的价格时，句型是 `How much are + (复数名词)?`。"}]},{"title":"What 与 How 的区别","steps":[{"question":"如果我想知道“你最喜欢的颜色”，应该用 `What` 还是 `How` 开头提问？","hint":"这个问题是在询问一个“事物”或“信息”，而不是程度或方式。","takeaway":"`What` 用来询问事物的本身，而 `How` 用来询问方式、程度或状态。"},{"question":"“你今天感觉怎么样？” 和 “你今天长什么样？”，这两个问题在英语里都用 `How` 提问吗？","hint":"“感觉怎么样”是问状态，用 `How are you feeling?`。“长什么样”是问外貌特征，用 `What do you look like?`。","takeaway":"即使中文里都有“怎么样”，也要根据具体询问的内容（状态 vs. 具体特征）来选择 `How` 或 `What`。"}]}]}}]},{"section_title":"III. 阅读理解","section_instruction":"共20分。A篇：阅读短文，判断正(T)误(F)；B篇：阅读短文，选择正确答案。","items":[{"number":"21","item_type":"reading","context_note":"**A. 阅读下面短文, 根据短文内容判断正(T)误(F)。(每小题2分，共10分)**\n\nAn elephant and a monkey are good friends. They are both proud (骄傲的). People always say, \"Look, how big and strong the elephant is!\" The monkey is proud because he is smart. He always asks others, \"Can you climb a tree?\"\nThere is a river near them, and a tall banana tree is on the other bank (河岸) of the river. They want to cross the river to get some bananas. The elephant can cross the river, but he cannot get the bananas because the tree is too tall. The monkey cannot cross the river because the water runs too fast.\nBoth of them cannot get the bananas.\n\"Come on, I can carry(背) you there,\" the elephant says. When they arrive there, the monkey says, \"Let me climb up.\"\nNow both of them get the bananas. They are eating the bananas. And they know they must help each other.","stem":"The elephant is big and strong, and the monkey is smart.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为判断正误题。根据原文第一段中的“People always say, 'Look, how big and strong the elephant is!'”以及“The monkey is proud because he is smart.”可知，大象的特点是“又大又强壮”，猴子的特点是“聪明”。题干“The elephant is big and strong, and the monkey is smart.”（大象又大又强壮，猴子很聪明。）与原文信息完全一致，因此该陈述是正确的。","knowledge_expansion_md":"### 词汇与篇章理解\n\n1.  **核心形容词**：`big` (大的), `strong` (强壮的), `smart` (聪明的)。在阅读中，准确理解描述人物或动物特征的形容词至关重要。它们是理解角色和故事情节的基础。\n2.  **并列连词 `and`**：`and` 用于连接两个或多个语法结构相同的词、短语或句子，表示并列关系。在本题中，`and` 连接了两个完整的句子，分别描述大象和猴子的特点。\n3.  **信息定位**：做阅读理解题时，关键是根据题干中的关键词（如 `elephant`, `monkey`, `big`, `strong`, `smart`）快速回到原文中定位相关信息。这种“寻读”能力是提高阅读效率和准确率的核心技能。","socratic_tracks":[{"title":"文本细节定位","steps":[{"question":"我们如何判断这个句子的对错？第一步应该做什么？","hint":"我们应该去文章里找证据，而不是凭空猜测。","takeaway":"做阅读判断题，首先要根据题干关键词回原文定位信息。"},{"question":"文章第一段是如何描述大象和猴子的？你能找到具体的句子吗？","hint":"看看第一段里人们怎么说大象，以及猴子为什么而骄傲。","takeaway":"原文明确指出大象“big and strong”，猴子“smart”。"}]},{"title":"形容词辨析","steps":[{"question":"题干中 `big`, `strong`, `smart` 这三个词是什么词性？它们在句子中起什么作用？","hint":"这些词是用来描述事物或人的特征的。","takeaway":"它们是形容词，用来修饰名词，说明主语的特征。"},{"question":"你能想出这三个词的反义词吗？比如，`big` 的反义词是什么？","hint":"`big` 是“大的”，那“小的”怎么说？`strong` 是“强壮的”，那“虚弱的”呢？","takeaway":"掌握核心形容词及其反义词（如 big-small, strong-weak, smart-foolish）能极大丰富我们的表达和理解能力。"}]},{"title":"并列连词 and","steps":[{"question":"题干 “The elephant is big and strong, and the monkey is smart.” 中间有一个 `and`，它起什么作用？","hint":"它连接了前后两个部分，这两个部分是什么关系？","takeaway":"连词 `and` 在这里连接了两个独立的句子，表示并列关系。"},{"question":"我们能把这个长句拆成两个独立的短句吗？如果可以，会是哪两个句子？","hint":"试着把 `and` 去掉，看看剩下的部分。","takeaway":"这个句子可以拆分为 “The elephant is big and strong.” 和 “The monkey is smart.” 这有助于我们理解复杂句子的结构。"}]}]}},{"number":"22","item_type":"reading","context_note":"Passage A","stem":"They want to cross the river because they want to see who is strong.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"此题为判断正误题。根据原文第二段中的“They want to cross the river to get some bananas.”可知，大象和猴子过河的目的是为了“得到一些香蕉”。而题干“They want to cross the river because they want to see who is strong.”（他们想过河是因为他们想看看谁更强壮。）陈述的过河原因与原文不符。因此，该陈述是错误的。","knowledge_expansion_md":"### 表目的的两种方式\n\n在英语中，表达“为了做某事”这一目的，常见的方式有两种：\n\n1.  **`to do something` (不定式表目的)**：这是非常简洁和常用的方式。例如文中的 `to get some bananas`。\n    *   例句：He works hard `to support` his family. (他努力工作以养家糊口。)\n\n2.  **`because` 引导的原因状语从句**：虽然 `because` 主要用来解释原因，但当原因和目的紧密相关时，也可以使用。题干就使用了这种结构。但需要注意，`because` 引导的是一个完整的句子。\n    *   例句：He ran `because he was late`. (他跑是因为他迟到了。)\n\n做题时要仔细辨别题目陈述的目的（`to see who is strong`）是否与原文给出的目的（`to get some bananas`）一致。","socratic_tracks":[{"title":"目的与原因定位","steps":[{"question":"根据文章，大象和猴子为什么要过河？","hint":"在文章第二段找找看，他们看到河对岸有什么？他们想做什么？","takeaway":"文章明确说明，他们过河是为了去拿香蕉。"},{"question":"题目中说他们过河的原因是什么？","hint":"读一下题干句子中 `because` 后面的部分。","takeaway":"题目说他们过河是为了“看看谁更强壮”。"},{"question":"比较一下你从文章中找到的原因和题目中给出的原因，它们一样吗？","hint":"“为了拿香蕉”和“为了比试谁更强壮”是同一个意思吗？","takeaway":"题干陈述的原因与原文信息完全不符，因此是错误的。"}]},{"title":"不定式表目的","steps":[{"question":"原文中 “They want to cross the river to get some bananas.” 这句话里，`to get some bananas` 是什么成分？它在说明什么？","hint":"这个部分回答了 “Why do they want to cross the river?” (他们为什么想过河？) 这个问题。","takeaway":"这是一个不定式短语，作目的状语，说明了“过河”的目的。"},{"question":"你能用 `to do` 的结构再造一个句子来表达目的吗？比如，“我早起是为了赶上第一班公交车。”","hint":"I get up early ... the first bus.","takeaway":"使用不定式表目的非常普遍，如：I get up early to catch the first bus."}]},{"title":"辨别干扰信息","steps":[{"question":"文章开头提到大象和猴子都很“proud”（骄傲），这会不会让你觉得他们之间有竞争关系，想比试一下？","hint":"虽然他们很骄傲，但这只是背景介绍。他们的具体行动是为了什么？","takeaway":"阅读时要区分背景信息和具体事件的原因，不能凭感觉推断。"},{"question":"为什么出题人可能会设计“to see who is strong”这样的错误选项？","hint":"想一想文章开头对两个角色的描述。","takeaway":"出题人常利用文中的背景信息（如角色性格）来制造看似合理但与事实不符的干扰项。"}]}]}},{"number":"23","item_type":"reading","context_note":"Passage A","stem":"The tree is too tall, so the monkey can't get the bananas.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"此题为判断正误题。根据原文第二段，“The elephant can cross the river, but he cannot get the bananas because the tree is too tall.” 这句话说明，因为树太高而拿不到香蕉的是“大象”，而不是猴子。猴子的问题是“cannot cross the river because the water runs too fast.”（因为水流太急而无法过河）。题干将大象遇到的困难错误地安在了猴子身上，因此该陈述是错误的。","knowledge_expansion_md":"### 细节辨析与逻辑关系\n\n1.  **`too...to...` 结构**：虽然原文没有直接用 `too...to...`，但意思相近。`The tree is too tall for the elephant to get the bananas.` 意为“树太高了，大象够不着香蕉”。这个结构表示“太……以至于不能……”，本身含有否定意义。\n2.  **`so` (所以) vs. `because` (因为)**：`so` 用于引导结果，`because` 用于引导原因。题干用 `so` 连接，表示“树太高”是“猴子拿不到香蕉”的原因。在判断这类句子时，必须确认两点：\n    *   事实是否正确？（树是不是太高？）\n    *   因果关系是否成立？（是不是因为树太高，所以猴子拿不到？）\n    在本题中，因果关系的主体（猴子）是错误的。\n3.  **信息归属**：在涉及多个角色的阅读中，要特别注意将行为、困难、特点准确地与对应角色匹配，避免张冠李戴。这是阅读理解中的一个常见考点。","socratic_tracks":[{"title":"信息主体匹配","steps":[{"question":"文章中提到了“树太高”（the tree is too tall），这是谁遇到的问题？","hint":"仔细阅读第二段，看看“because the tree is too tall”这句话是跟在描述谁的句子后面的。","takeaway":"原文说的是大象（he）因为树太高而拿不到香蕉。"},{"question":"那么，猴子遇到的困难是什么？","hint":"还是在第二段，找一找关于猴子（the monkey）的那句话。","takeaway":"猴子的问题是水流太急，无法过河。"},{"question":"现在再看题干：“树太高，所以猴子拿不到香蕉。” 这个说法正确吗？","hint":"你已经知道是谁因为树高拿不到香蕉了。","takeaway":"题干将大象的问题错误地归于猴子，所以是错误的。"}]},{"title":"因果关系分析","steps":[{"question":"题干中有一个词 `so`，它表示什么逻辑关系？","hint":"A, so B. A是原因，B是结果。","takeaway":"`so` 表示“所以”，引导的是一个结果。"},{"question":"根据题干，原因是什么？结果是什么？","hint":"`so` 前面是原因，后面是结果。","takeaway":"原因是“树太高”，结果是“猴子拿不到香蕉”。"},{"question":"根据我们在文章里找到的信息，这个因果关系在故事里成立吗？","hint":"猴子拿不到香蕉的直接原因是什么？是过不了河，还是够不着？","takeaway":"故事中不存在这个因果链条，猴子首先要解决的是过河问题，而不是树高的问题。"}]},{"title":"关键词 `too` 的用法","steps":[{"question":"当说 `The tree is too tall.` 时，`too` 是什么意思？","hint":"它和 `very tall` (非常高) 的感觉一样吗？","takeaway":"`too` 表示“太……”，常带有负面含义，暗示高到产生某种不良后果。"},{"question":"如果我们要用一个完整的句子表达“树太高了以至于大象拿不到香蕉”，可以用什么句型？","hint":"尝试使用 `too...to...` 结构。","takeaway":"我们可以说：The tree is too tall for the elephant to get the bananas."}]}]}},{"number":"24","item_type":"reading","context_note":"Passage A","stem":"At last, the elephant carries the monkey and the monkey climbs the tree to get the bananas.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为判断正误题。根据原文第四段，“'Come on, I can carry(背) you there,' the elephant says.”（大象说：“来，我能背你过去。”）以及“When they arrive there, the monkey says, 'Let me climb up.'”（当他们到达那里时，猴子说：“让我爬上去。”）。这表明大象背着猴子过了河，然后猴子爬上树去拿香蕉。题干“At last, the elephant carries the monkey and the monkey climbs the tree to get the bananas.”（最后，大象背着猴子，猴子爬上树去拿香蕉。）准确地概括了他们合作解决问题的过程。因此，该陈述是正确的。","knowledge_expansion_md":"### 故事发展与主题提炼\n\n1.  **时间顺序词 `At last`**：`At last` 意为“最后，终于”，通常用在故事的结尾，标志着一系列事件的最终结果。它和 `finally`, `in the end` 意思相近，是理解故事叙述顺序的重要线索。\n2.  **动词理解**：`carry` (背，扛，携带) 和 `climb` (攀爬) 是理解本句的关键动作。`carry` 体现了大象的力量和帮助，`climb` 体现了猴子的敏捷和分工。\n3.  **合作主题 (Teamwork)**：这个句子是整个故事的高潮和转折点，完美诠释了“合作”的主题。大象和猴子各自的优点（力量和敏捷）结合起来，才克服了他们独自无法解决的困难。这也是故事最后一句“they know they must help each other”所揭示的道理。","socratic_tracks":[{"title":"事件顺序梳理","steps":[{"question":"故事的最后，大象和猴子是怎样拿到香蕉的？他们各自做了什么？","hint":"去文章的第四段找答案，看看大象说了什么，猴子又说了什么。","takeaway":"大象提出可以背猴子过河，猴子则提出由自己爬树。"},{"question":"题干是如何描述这个过程的？“the elephant carries the monkey”和“the monkey climbs the tree”这两个动作在原文中能找到依据吗？","hint":"大象说的 `I can carry you` 和猴子说的 `Let me climb up` 正好对应了题干的两个动作。","takeaway":"题干准确地总结了原文中描述的合作行为。"},{"question":"题干开头的 `At last` 是什么意思？用在这里合适吗？","hint":"这个词表示“最后，终于”。想想这个动作是发生在故事的开头、中间还是结尾？","takeaway":"`At last` 准确地点明了这是故事的最终解决方案，用在此处非常恰当。"}]},{"title":"提炼故事主旨","steps":[{"question":"在他们合作之前，为什么他们拿不到香蕉？","hint":"回顾一下大象和猴子各自遇到的困难。","takeaway":"因为他们只靠自己的力量，无法同时克服“过河”和“够高”两个难题。"},{"question":"他们的合作是如何让问题得到解决的？","hint":"大象的优点解决了什么问题？猴子的优点解决了什么问题？","takeaway":"他们通过优势互补解决了问题：大象的力量解决了过河问题，猴子的敏捷解决了爬树问题。"},{"question":"这个故事告诉我们一个什么道理？文章最后一句是什么？","hint":"看看文章的最后一句话。","takeaway":"这个故事告诉我们互相帮助、团队合作的重要性，即 “they must help each other”。"}]},{"title":"关键动词理解","steps":[{"question":"在“the elephant carries the monkey”中，`carry` 是什么意思？为什么这里用 `carry`？","hint":"想一想大象和猴子的体型差异，以及他们如何过河。","takeaway":"`carry` 在这里是“背”或“驮”的意思，生动地描述了大象利用自己的身体帮助猴子的情景。"},{"question":"在“the monkey climbs the tree”中，`climb` 是什么意思？这个动作和猴子的什么特点有关？","hint":"猴子以什么闻名？它们擅长做什么？","takeaway":"`climb` 是“攀爬”的意思，这正是猴子“聪明”（smart）和敏捷的具体体现。"}]}]}},{"number":"25","item_type":"reading","context_note":"Passage A","stem":"From the story we know that it's important to help each other.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为判断正误题，考察对文章主旨的理解。根据原文最后一句“And they know they must help each other.”（而且他们知道了他们必须互相帮助。）可知，这个故事告诉我们的道理就是互相帮助的重要性。题干“From the story we know that it's important to help each other.”（从这个故事我们知道互相帮助很重要。）是对文章中心思想的准确概括。因此，该陈述是正确的。","knowledge_expansion_md":"### 如何提炼文章中心思想\n\n阅读理解中的主旨大意题是常见题型，旨在考察考生对文章宏观结构的把握能力。这类题目的问题常常是 “What is the main idea of the passage?” 或 “What can we learn from the story?”。\n\n**解题技巧：**\n1.  **关注首尾段落**：议论文和说明文的中心论点常在首段提出，在末段总结。故事类文章的道理则常在结尾处通过角色的感悟或旁白点明。\n2.  **寻找高频词汇**：反复出现的词语或其同义词往往是文章的核心话题。\n3.  **注意转折**：文中的转折连词（如 but, however）之后的内容往往是作者想要强调的重点。\n4.  **排除细节选项**：主旨题的正确答案应具有概括性，只涉及文章某个细节的选项通常是干扰项。","socratic_tracks":[{"title":"理解故事寓意","steps":[{"question":"一个故事除了讲述“谁在什么地方做了什么”之外，通常还会告诉我们什么？","hint":"想一想我们读《龟兔赛跑》和《狼来了》之后学到了什么。","takeaway":"故事常常会通过情节和人物来传达一个道理或教训，这被称为寓意或中心思想。"},{"question":"如果一个故事里，小动物们一起努力才搬动了一块大石头，这个故事可能想告诉我们什么道理？","hint":"一个人的力量小，很多人的力量大。","takeaway":"这个故事很可能是在告诉我们“团结就是力量”或者“互相帮助很重要”。"},{"question":"那么，当题目问“从故事中我们知道互相帮助很重要”是否正确时，我们应该在文章中寻找什么样的证据？","hint":"我们需要在文章中找到能证明“互相帮助”带来了好处，或者“不互相帮助”带来了坏处的情节。","takeaway":"判断故事寓意需要根据故事情节和结局进行合理推断。"}]},{"title":"关键词“Important”","steps":[{"question":"“It's important to do something” 这句话是什么意思？","hint":"单词 “important” 的意思是“重要的”。","takeaway":"“It's important to do something” 意为“做某事是重要的”，用来强调某件事的必要性或价值。"},{"question":"除了 “important”，还有哪些词可以表达“重要”的意思？","hint":"想一想表示“关键的”、“必要的”、“主要的”等词。","takeaway":"表达“重要”的词还有 necessary (必要的), essential (必不可少的), key (关键的), vital (至关重要的) 等。"}]},{"title":"识别主旨大意题","steps":[{"question":"这道题是问故事里的一个具体细节，还是问整个故事告诉我们的道理？","hint":"题目中的“From the story we know that...”是在引导对整个故事的归纳总结。","takeaway":"这道题是在考察对文章中心思想的提炼能力，属于主旨大意题。"},{"question":"做这类题目时，我们应该关注的是文章的某个句子，还是文章的整体内容？","hint":"一个细节正确不代表整体主旨就是它。","takeaway":"解答主旨大意题需要通读全文，从整体上把握作者的意图，而不是纠结于个别细节。"}]}]}},{"number":"26","item_type":"reading","context_note":"**B. 阅读下面短文, 根据短文内容选择正确答案。(每小题2分，共10分)**\n\n**House of Hamburgers**\nAt the House of Hamburgers we have two great new specials. Special 1 has strawberry and chicken, and is only $3. Special 2 has cabbage and mutton. The prices of the small, medium and large ones are $4, $6 and $7.\nTel: 573-9603\n\n**Dessert (甜品) House**\nWe have many kinds of ice cream. We also have orange juice and green tea. An apple and pear ice cream is $3. A banana and orange one is $4. A glass of orange juice is $4 and a glass of green tea is $5.\nTel: 895-2598","stem":"Linda has four dollars. Can she buy a medium strawberry and chicken hamburger?","options":{"A":"Yes, she can.","B":"No, she can't.","C":"I don't know.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题为细节查找与逻辑判断题。首先，在“House of Hamburgers”的菜单中找到“strawberry and chicken hamburger”，即Special 1。原文描述为“Special 1 has strawberry and chicken, and is only $3.”，只给出了一个价格，并未提及有不同尺寸（如small, medium, large）。其次，原文中关于尺寸的描述“The prices of the small, medium and large ones are $4, $6 and $7”是紧跟在“Special 2 has cabbage and mutton”之后的，因此这些尺寸和价格是针对Special 2的。综上所述，菜单上并不存在“medium strawberry and chicken hamburger”这个商品，所以Linda无法买到。因此选B。","knowledge_expansion_md":"### 阅读理解中的“信息匹配”与“干扰项排除”\n\n这道题是典型的“信息错配”干扰题，题目将A商品（草莓鸡肉汉堡）的名称和B商品（卷心菜羊肉汉堡）的属性（中号）结合在一起，制造了一个看似存在但实际不存在的商品。\n\n**解题要点：**\n1.  **精确定位**：根据题干关键词（strawberry and chicken, medium）回到原文中寻找完全匹配的信息。\n2.  **仔细核对**：确认信息归属，即某个描述（如尺寸、价格）到底是属于哪个对象的。广告、菜单等信息分类清晰的文本尤其要注意这一点。\n3.  **避免脑补**：不要想当然地认为所有汉堡都有大中小号。阅读理解要严格基于文本给出的信息（“What the text says”），而不是自己的常识或推测（“What you think”）。\n4.  **认识逻辑陷阱**：如果一个物品在文中不存在，那么关于“能否购买”、“价格多少”等问题的答案通常是否定的或无法回答的。","socratic_tracks":[{"title":"信息定位与核对","steps":[{"question":"琳达想买的汉堡是什么口味的？原文中关于这个口味的汉堡是怎么描述的？","hint":"在“House of Hamburgers”部分找到“strawberry and chicken”。","takeaway":"是草莓鸡肉汉堡（Special 1），原文说它“is only $3”，只有一个价格。"},{"question":"原文中提到的“medium”（中号）是用来描述哪一种汉堡的？","hint":"仔细阅读关于尺寸和价格的那句话，看看它前面紧跟着的是哪种汉堡。","takeaway":"“small, medium and large”这些尺寸是用来描述“cabbage and mutton”（卷心菜羊肉）汉堡（Special 2）的。"},{"question":"既然“中号”这个尺寸不属于“草莓鸡肉汉堡”，那么琳达能买到“中号的草莓鸡肉汉堡”吗？","hint":"如果一个东西菜单上没有，你能买到吗？","takeaway":"菜单上没有这个商品，所以她不能买到。"}]},{"title":"理解价格信息","steps":[{"question":"草莓鸡肉汉堡的价格是多少？","hint":"找到“Special 1”的价格信息。","takeaway":"
