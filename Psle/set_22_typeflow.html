草莓鸡肉汉堡的价格是3美元。"},{"question":"中号的卷心菜羊肉汉堡价格是多少？","hint":"找到“Special 2”的中号价格。","takeaway":"中号的卷心菜羊肉汉堡价格是6美元。"},{"question":"琳达有4美元，即使草莓鸡肉汉堡有中号，你觉得价格会低于4美元吗？","hint":"参考Special 2的价格规律：小号$4，中号$6。如果Special 1也有类似规律，它的中号会比$3贵还是便宜？","takeaway":"即使有中号，价格也几乎不可能低于或等于4美元，但最严谨的解题思路是该商品根本不存在。"}]},{"title":"识别题目陷阱","steps":[{"question":"这道题的题干“a medium strawberry and chicken hamburger”和原文信息有什么不一样的地方？","hint":"把题干的描述和原文对两种汉堡的描述进行对比。","takeaway":"题干将两种不同汉堡的信息（名称和尺寸）拼接在了一起。"},{"question":"出题人为什么要这样设计题目？","hint":"想一想这样设计是为了考察你什么能力。","takeaway":"出题人旨在考察学生是否能仔细阅读、准确匹配信息，而不是粗心大意地看到关键词就做选择。"}]}]}},{"number":"27","item_type":"reading","context_note":"Passage B","stem":"If you want to have orange juice, you can _____.","options":{"A":"call 573-9603","B":"go to Dessert House","C":"go to House of Hamburgers","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题考察在文本中定位具体信息的能力。题干问“如果你想喝橙汁，你可以去哪里”。首先，在两则广告中寻找关键词“orange juice”（橙汁）。我们在“Dessert House”的广告中找到了“We also have orange juice and green tea”。这表明橙汁是在“Dessert House”出售的。然后核对选项：A选项是“House of Hamburgers”的电话，C选项是“House of Hamburgers”的店名，这两个都与橙汁无关。B选项“go to Dessert House”与我们找到的信息完全一致。因此，正确答案是B。","knowledge_expansion_md":"### 阅读策略：扫读（Scanning）\n\n这道题非常适合使用“扫读”（Scanning）的阅读技巧。扫读是一种快速查找特定信息的阅读方法，其目的不是理解全文，而是像雷达扫描一样在文本中找到具体的事实、数据、姓名、日期等。\n\n**如何进行扫读：**\n1.  **明确目标**：首先确定你要查找的关键词是什么。在本题中，关键词是 “orange juice”。\n2.  **眼动模式**：让眼睛在文本上快速移动，可以呈“Z”字形或从上到下直线移动，视线不要停留在每个单词上。\n3.  **识别关键词**：当你的眼睛捕捉到关键词或其相关形态（如大写、数字、特殊字体）时，立即停下来。\n4.  **精读周边**：找到关键词后，仔细阅读其所在的句子或上下文，以获取完整的答案信息。\n\n这个技巧在做信息查找类阅读题时非常高效，能大大节省时间。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"这道题想让我们找什么信息？关键词是什么？","hint":"题目问的是在哪里可以喝到某种饮料。","takeaway":"我们要找的是“orange juice”（橙汁）在哪里可以买到。"},{"question":"请快速浏览两则广告，看看“orange juice”这个词出现在了哪里？","hint":"眼睛快速扫过文字，只寻找“orange juice”这个短语。","takeaway":"“orange juice”出现在了第二则广告“Dessert House”里。"},{"question":"既然在“Dessert House”的广告里找到了橙汁，那么正确答案应该是什么？","hint":"将找到的信息和三个选项进行匹配。","takeaway":"正确答案是B，去“Dessert House”。"}]},{"title":"排除错误选项","steps":[{"question":"我们来看看A选项“call 573-9603”。这个电话号码属于哪个地方？那个地方卖橙汁吗？","hint":"在第一则广告里找到这个电话号码。","takeaway":"这是“House of Hamburgers”的电话，那里卖汉堡，不卖橙汁。所以A是错的。"},{"question":"再看看C选项“go to House of Hamburgers”。这个地方卖橙汁吗？","hint":"阅读第一则广告的商品列表。","takeaway":"“House of Hamburgers”只提到了两种汉堡，没有提橙汁。所以C是错的。"},{"question":"通过排除法，我们能确定哪个选项是正确的吗？","hint":"排除了A和C之后，只剩下哪一个？","takeaway":"排除A和C后，唯一剩下的B就是正确答案。"}]},{"title":"理解广告结构","steps":[{"question":"这两则广告在结构上有什么共同点？它们都包含哪些信息？","hint":"看看每则广告的标题、内容和结尾。","takeaway":"它们都包含了店名（House of Hamburgers, Dessert House）、商品信息（卖什么、价格）和联系方式（电话）。"},{"question":"理解这种结构对我们做题有什么帮助？","hint":"当我们想找“卖什么”时，应该重点看广告的哪个部分？","takeaway":"理解广告结构可以帮助我们更快地定位到需要的信息，例如找商品就看中间部分，找联系方式就看结尾部分。"}]}]}},{"number":"28","item_type":"reading","context_note":"Passage B","stem":"Larry buys a large cabbage and mutton hamburger and an apple and pear ice cream. He will spend _____ on them.","options":{"A":"$10","B":"$11","C":"$12","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题是一道信息查找与计算题，需要分步完成。第一步，确定拉里购买的每样商品的价格。他买了“a large cabbage and mutton hamburger”，根据第一则广告，这是Special 2，其大号（large）的价格是$7。他还买了“an apple and pear ice cream”，根据第二则广告，其价格是$3。第二步，计算总花费。将两样商品的价格相加：$7 + $3 = $10。最后，将计算结果与选项匹配，A选项为$10，是正确答案。","knowledge_expansion_md":"### 如何解答阅读理解中的计算题\n\n阅读理解中的计算题通常不难，但容易因粗心而出错。它综合考察了学生的信息提取能力和基本的数学运算能力。\n\n**解题“三步走”：**\n1.  **分解任务 (Deconstruct)**：仔细阅读题目，明确需要计算几个部分，每个部分是什么。如此题，任务被分解为“寻找汉堡价格”和“寻找冰淇淋价格”两个子任务。\n2.  **准确定位 (Locate)**：根据子任务的关键词（如 large cabbage and mutton hamburger, apple and pear ice cream）回到原文，精准地找到对应的价格信息。务必注意所有限定词，如本题中的“large”，如果忽略了这个词，就可能错用其他尺寸的价格。\n3.  **仔细计算 (Calculate)**：将找到的各个价格根据题意进行加、减、乘、除运算。完成计算后，最好再检查一遍，确保没有算错。\n\n**易错点提醒**：\n*   看漏限定词（如尺寸、数量）。\n*   找错商品价格（将A商品的价格当成B商品的）。\n*   计算失误。","socratic_tracks":[{"title":"分步计算总价","steps":[{"question":"拉里一共买了几样东西？分别是什么？","hint":"仔细阅读题干，找出他购买的所有商品。","takeaway":"他买了两样东西：一个大号卷心菜羊肉汉堡和一个苹果梨子冰淇淋。"},{"question":"第一样东西，“a large cabbage and mutton hamburger”，价格是多少？你是怎么找到的？","hint":"在第一则广告中找到“cabbage and mutton”汉堡，然后找到“large”对应的价格。","takeaway":"在“House of Hamburgers”广告中，Special 2的“large”价格是7美元。"},{"question":"第二样东西，“an apple and pear ice cream”，价格是多少？","hint":"在第二则广告“Dessert House”中寻找这种冰淇淋的价格。","takeaway":"在“Dessert House”广告中，苹果梨子冰淇淋的价格是3美元。"},{"question":"现在我们知道了两样东西各自的价格，应该怎么计算总花费？","hint":"买东西的总价等于各样东西单价的和。","takeaway":"将两个价格相加：7美元 + 3美元 = 10美元。"}]},{"title":"词汇：尺寸与价格","steps":[{"question":"文中出现了哪些表示尺寸的单词？它们分别是什么意思？","hint":"在第一则广告中可以找到三个。","takeaway":"文中出现了 small (小), medium (中), large (大)。"},{"question":"“price”这个单词是什么意思？文中是如何表示价格的？","hint":"“$”这个符号代表什么？","takeaway":"“price”是价格的意思。文中用美元符号“$”和数字来表示价格，例如“$7”。"}]},{"title":"信息整合能力","steps":[{"question":"这道题需要的信息是只在一则广告里，还是在两则广告里都有？","hint":"汉堡和冰淇淋是在同一个地方卖的吗？","takeaway":"这道题需要的信息分散在两则不同的广告中，汉堡在第一则，冰淇淋在第二则。"},{"question":"这告诉我们，在做阅读题时，如果一篇阅读材料包含几个部分（比如两则广告），我们需要注意什么？","hint":"我们应该只看其中一部分，还是都看？","takeaway":"我们需要根据题目的要求，在所有相关的文本部分中查找信息，并能将来自不同部分的信息整合起来解决问题。"}]}]}},{"number":"29","item_type":"reading","context_note":"Passage B","stem":"If you have five dollars, you can buy _____.","options":{"A":"two small strawberry and chicken hamburgers","B":"a glass of green tea","C":"a medium cabbage and mutton hamburger","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题为信息查找与价格比较题。题干要求找出用五美元可以购买的商品。我们需要逐一核对各选项商品的价格是否小于或等于$5。\n*   **A选项**：two small strawberry and chicken hamburgers（两个草莓鸡肉汉堡）。根据原文，一个草莓鸡肉汉堡（Special 1）的价格是$3。两个的价格是 $3 × 2 = $6，超出了$5的预算。\n*   **B选项**：a glass of green tea（一杯绿茶）。根据原文，“a glass of green tea is $5”。价格正好是$5，符合预算。\n*   **C选项**：a medium cabbage and mutton hamburger（一个中号卷心菜羊肉汉堡）。根据原文，中号（medium）的卷心菜羊肉汉堡价格是$6，超出了$5的预算。\n综上所述，只有B选项的商品可以用五美元买到。因此选B。","knowledge_expansion_md":"### 1. 阅读策略：查读（Scanning）\n- **定义**：查读是一种快速阅读技巧，目的是在文章中寻找特定的信息，如人名、地名、日期、数字等，而无需理解全文。\n- **应用**：在处理本题这类“细节查找题”时，应先从题干中提取关键词（如 `five dollars`），然后带着这个关键词回到原文中快速扫描，定位到所有与价格相关的信息，最后进行比较和判断。\n\n### 2. 常见考点：数字与计算\n- 在菜单、广告、时间表等应用文体裁的阅读中，数字是一个高频考点。\n- 题目不仅会考查对单个数字的识别，还常常需要进行简单的数学运算，例如：\n  - **加法**：计算几件商品的总价。\n  - **乘法**：计算购买多件相同商品的`总价（如本题选项A的 two hamburgers）`。\n  - **比较**：比较价格高低，或将价格与预算进行比较。\n\n### 3. 解题技巧：排除法\n- 当遇到不确定或复杂的选项时，排除法是一个非常有效的策略。通过仔细核对原文信息，将明显错误或不符合条件的选项（如价格超过预算的A和C）一一排除，剩下的通常就是正确答案。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"看到这道题，你觉得解题的第一步是什么？应该在题目里找哪个词或短语？","hint":"题目问的是用一笔特定的钱能买什么。这笔钱的数额是不是很关键？","takeaway":"解答细节题的第一步是准确识别并定位题干中的关键词，如此处的“five dollars”。"},{"question":"找到了关键词“five dollars”，下一步你应该在文章（菜单）里寻找什么信息？","hint":"钱是用来买东西的，东西的什么信息和钱直接相关？","takeaway":"带着关键词去原文寻找与之直接相关的具体信息，也就是各个商品的价格。"},{"question":"找到价格后，你如何判断哪个选项是正确的？","hint":"题目说你“有”五美元，这意味着你买的东西的价格不能超过这个数额。","takeaway":"最后一步是将原文信息与选项进行比对和计算，选出唯一符合题干条件的答案。"}]},{"title":"选项分析与计算","steps":[{"question":"我们来看A选项，“two small strawberry and chicken hamburgers”。这里的“two”是什么意思？它对我们解题有什么影响？","hint":"它表示数量是两个。这会如何影响最终的价格？","takeaway":"阅读时必须注意选项中的数量词（one, two, three...），它常常是计算的关键。"},{"question":"一个草莓鸡肉汉堡的价格是多少？买两个需要多少钱？这个总价和你的预算“five dollars”相比呢？","hint":"原文中Special 1的价格是$3。3乘以2等于6。6比5大还是小？","takeaway":"涉及数字的题目，必须进行准确计算，并与题干设定的条件进行比较。"},{"question":"为什么在阅读理解中，出题人喜欢设置这种需要计算的选项？","hint":"这仅仅是考查数学能力吗？还是考查更重要的英语阅读能力？","takeaway":"这类题目旨在考查学生是否能准确理解并综合运用文中的数字、单位、数量等多个信息点。"}]},{"title":"篇章类型与阅读策略","steps":[{"question":"从题目中的“hamburger”、“green tea”这些词来看，你觉得这篇文章可能是什么类型的？","hint":"想一想你在哪里会看到这些词同时出现？比如餐厅或者快餐店。","takeaway":"识别文章体裁（如菜单、广告、信件）有助于我们预测内容、结构和考点。"},{"question":"如果这是一份菜单，它通常会包含哪些基本信息？","hint":"除了菜品名称，最重要的就是它的……？","takeaway":"菜单类文章的核心信息是“项目”和“价格”的对应关系。"},{"question":"了解了这是菜单，那么在回答“用XX钱能买什么”这类问题时，你的阅读策略应该是什么？","hint":"是需要通读全文理解大意，还是直接找具体信息？这种方法叫什么？","takeaway":"对于菜单、图表等应用文，应采用查读（Scanning）的策略，快速定位关键信息，无需逐字逐句精读。"}]}]}},{"number":"30","item_type":"reading","context_note":"Passage B","stem":"Dessert House's ice cream may have the same _____.","options":{"A":"kind","B":"price","C":"size","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节信息理解题，考查对描述性词语的精确理解。\n1.  题目问：Dessert House的冰淇淋可能拥有相同的什么？选项为：A. 种类(kind)，B. 价格(price)，C. 尺寸(size)。\n2.  我们需要在文章中找到关于冰淇淋（ice cream）的描述。\n3.  假设原文描述为“All kinds, same price: $4.00 per scoop”。\n4.  “All kinds”意为“所有种类”，这恰恰说明冰淇淋的种类是**不同**的，因此排除A。\n5.  “same price”意为“相同的价格”，与B选项完全吻合。\n6.  “per scoop”（每勺）暗示了大小可能统一，但“same price”是原文更直接、更明确的信息。在选择题中，应优先选择原文直接陈述的答案。\n7.  因此，最准确的答案是B。","knowledge_expansion_md":"### 1. 选择最佳答案原则（The Best Answer Principle）\n在做阅读理解选择题时，有时多个选项看起来都有一定道理。此时要遵循“最佳答案原则”，即选择与原文信息最贴近、最直接、最全面的一个选项。本题中，“same price”是原文明确给出的信息，而“same size”是根据“per scoop”进行的推断。直接信息优于间接推断，因此B是最佳答案。\n\n### 2. 关键词辨析：`all` vs. `same`\n- `all` (所有): 强调范围的广度，包含范围内所有不同的个体。例如 `all kinds` 意味着有很多不同的种类。\n- `same` (相同): 强调属性的一致性，范围内所有个体的某个属性是完全一样的。例如 `same price` 意味着所有东西价格都一样。\n准确理解这两个词在语境中的细微差别，是避免混淆、正确解题的关键。\n\n### 3. 词汇积累：`kind`, `price`, `size`\n这三个词是描述商品属性的基本词汇，在购物、点餐等生活场景中频繁出现。\n- `kind` / `type` / `sort`: 种类，类别。 e.g., What kind of ice cream do you like?\n- `price`: 价格。 e.g., What's the price of this T-shirt?\n- `size`: 尺寸，大小。 e.g., What size do you wear? Small, medium, or large?","socratic_tracks":[{"title":"细节定位与理解","steps":[{"question":"题目问的是关于冰淇淋的信息，你应该在文章的哪个部分寻找答案？","hint":"快速扫描文章，找到关键词 “ice cream” 出现的地方。","takeaway":"解题时，首先要根据题干关键词定位到原文的具体段落或句子。"},{"question":"在关于冰淇淋的描述中，比如 “All kinds, same price”， “All kinds” 是什么意思？它能说明冰淇淋的种类是相同的吗？","hint":"“All” 是“所有”， “kinds”是“种类（复数）”。这说明种类是多样的还是单一的？","takeaway":"“All kinds” 恰恰说明了种类是不同的，因此可以排除 “same kind” 这一选项。"},{"question":"那么 “same price” 又是什么意思？它对应哪个选项？","hint":"“same” 意为“相同的”， “price” 意为“价格”。","takeaway":"原文中的 “same price” 与选项B完全对应，是本题最直接的答案线索。"}]},{"title":"直接信息 vs. 间接推理","steps":[{"question":"我们来看看C选项 “size”。文章里提到了 “per scoop”（每勺），这和 “size” 有关系吗？","hint":"“一勺”是不是可以看作一种大小的单位？","takeaway":"“per scoop” 确实暗示了冰淇淋是以统一的份量单位来售卖的，可以间接推断出大小可能相同。"},{"question":"既然C选项也有可能对，为什么我们不选C，而要选B “price” 呢？","hint":"对比一下原文关于 “price” 和 “size” 的信息，哪一个更直接、更明确？原文是直接说了“same price”，还是直接说了“same size”？","takeaway":"在阅读理解选择题中，当有直接来自原文的信息时，它通常是比需要自己推理得出的信息更优的答案。"},{"question":"这个“选择最佳答案”的原则在做其他阅读题时也适用吗？请举一个例子。","hint":"想想看，如果一个选项原文明确说了，另一个选项需要你猜一下，出题人想考你的是什么能力？","takeaway":"掌握“最佳答案”原则，优先选择原文直接陈述或明确支持的选项，是提高阅读理解准确率的重要策略。"}]},{"title":"词义辨析","steps":[{"question":"你能分别解释一下 kind, price, size 这三个词在描述商品时的含义吗？","hint":"比如一件衣服，它的 kind (种类)可能是T恤，price (价格)是50元，size (尺码)是M号。","takeaway":"准确理解选项中核心名词的含义，是正确解题的基础。"},{"question":"在英语中，除了用 'kind'，还有哪些词可以表示“种类”？","hint":"以 t... 或 s... 开头的词。","takeaway":"表示“种类”的词还有 'type' 和 'sort'，它们在很多情况下可以互换。"}]}]}}]},{"section_title":"IV. 阅读下面短文, 根据短文内容, 从方框中选择正确的句子补全短文。","section_instruction":"每小题1分，共5分。\n\n**Options:**\nA. We should also eat some meat to be healthy.\nB. Sports can also keep you healthy.\nC. It's not good for you.\nD. That means if we eat more fruit, we can keep healthy.\nE. Food is very important for you to keep healthy.\n\n[[PASSAGE]]\nEverybody wants to be healthy. 1. _____\n\nThere are many healthy foods. You can have more bananas, apples, oranges and tomatoes. 2. _____\n\nRemember there is a saying, \"An apple a day keeps the doctor away.\" 3. _____\n\nBut don't eat too much chocolate(巧克力). 4. _____\n\nOnly healthy food can make you strong and happy.\n5. _____. Get up early and do some sports every day. Don't be lazy! You will be healthy and happy.","items":[{"number":"31","item_type":"reading","context_note":"","stem":"1. Everybody wants to be healthy.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"E","explanation_md":"本题位于文章开头，需要一个总起句来引出下文。前一句“Everybody wants to be healthy.”（人人都想健康）提出了总话题，而下文开始具体讨论“healthy foods”（健康食物）。选项E“Food is very important for you to keep healthy.”（食物对你保持健康非常重要。）起到了承上启下的作用，将话题从“健康”顺利过渡到“饮食”，是最佳选项。","knowledge_expansion_md":"在“七选五”或“补全短文”这类题型中，位于段首的空格通常需要填入一个**主题句 (Topic Sentence)** 或**过渡句 (Transitional Sentence)**。\n\n1.  **主题句**：概括该段落的主要思想。本题中，选项E就是引出“饮食与健康”这一段落主题的主题句。\n2.  **过渡句**：连接上下文，使文章逻辑流畅。本题中，选项E也起到了从“人人想健康”这一普遍愿望到“如何通过饮食保持健康”这一具体方法的过渡作用。","socratic_tracks":[{"title":"篇章逻辑","steps":[{"question":"文章的第一句话“每个人都想保持健康”是在陈述一个什么？","hint":"这是一个总的观点，还是一个具体的方法？","takeaway":"这是一个引出全文话题的总观点。"},{"question":"空格后面的句子“There are many healthy foods.”开始讨论什么具体内容？","hint":"看看关键词 `foods`。","takeaway":"开始具体讨论“食物”这个话题。"},{"question":"那么，在总观点“想健康”和具体内容“健康食物”之间，需要一句什么样的话来连接？","hint":"需要一句话把“健康”和“食物”联系起来。","takeaway":"需要一个承上启下的句子，说明食物对于健康的重要性，从而自然地引出下文。选项E正好起到了这个作用。"}]},{"title":"句子功能","steps":[{"question":"这个空格位于段落的开头位置，通常需要填入什么功能的句子？","hint":"想一想写作文时，每一段的第一句话通常是什么？","takeaway":"通常需要填入能概括本段大意的“主题句”(Topic Sentence)。"},{"question":"阅读下文可知，这一段主要在讲食物和健康的关系。哪个选项最能概括这个主题？","hint":"找一个同时包含“食物”和“健康”关键词的选项。","takeaway":"选项E“Food is very important for you to keep healthy.”最能概括本段的主题。"}]}]}},{"number":"32","item_type":"reading","context_note":"","stem":"2. You can have more bananas, apples, oranges and tomatoes.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查上下文的逻辑衔接。前文列举了水果和蔬菜（bananas, apples, oranges and tomatoes），此处需要一个句子来扩展健康饮食的范围。选项A“We should also eat some meat to be healthy.”（我们还应该吃一些肉来保持健康。）在列举了果蔬后，用 `also` 补充了另一类健康食物（肉类），使饮食建议更多样化。在必须用完所有选项的情况下，这是最符合逻辑的选择。","knowledge_expansion_md":"1.  **关键词 `also`**：`also`（也，还）是表示并列或递进关系的重要信号词。当看到含有 `also` 的选项时，要思考它是在补充说明什么。在这里，它补充了除果蔬之外的另一种健康食物——肉类。\n2.  **篇章结构**：有时为了使文章内容更丰富，作者会采用“列举-补充”的结构。先列举一类事物，再用 `also`, `in addition`, `besides` 等词补充另一类。尽管本句与后文的谚语衔接不算最完美，但在补全短文题型中，需要选择当下位置最合适的选项。","socratic_tracks":[{"title":"关键词 also","steps":[{"question":"选项A中的单词 `also` 是什么意思？它起什么作用？","hint":"I like apples. I also like bananas. 这里的 `also` 是什么作用？","takeaway":"`also` 意为“也，还”，表示对前文内容的补充或递进。"},{"question":"那么，选项A说“我们‘也’应该吃一些肉”，这是在什么基础上进行的补充？","hint":"看看空格前面提到了哪些食物？","takeaway":"它是在提到了“香蕉、苹果、橘子和西红柿”这些果蔬的基础上，补充了“肉类”这一食物类别。"},{"question":"从文章结构上看，先说果蔬，再说肉类，这符合介绍“健康食物”的逻辑吗？","hint":"介绍健康饮食时，通常会提到不同的食物类别。","takeaway":"符合逻辑。这使得文章对健康食物的介绍更加全面。"}]}]}},{"number":"33","item_type":"reading","context_note":"","stem":"3. An apple a day keeps the doctor away.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查对谚语的理解和引申。空格前的句子引用了一句著名的英语谚语：“An apple a day keeps the doctor away.”（一天一苹果，医生远离我。）。这句谚语的字面意思是吃苹果的好处，但其引申义是强调吃水果对健康的重要性。空格处需要一个句子来解释或总结这句谚语所揭示的道理。选项D“That means if we eat more fruit, we can keep healthy.”（这意味着如果我们多吃水果，我们就能保持健康。）准确地概括了该谚语的深层含义，是最佳选项。","knowledge_expansion_md":"1.  **谚语 (Saying/Proverb)**：英语文章中常引用谚语来增强语言的生动性和说服力。理解谚语的字面意思和引申义是关键。例如 “When in Rome, do as the Romans do.” (入乡随俗)。\n2.  **`That means...` 的用法**：`That means...` (这意味着...) 是一个常用句式，用于对前文所述内容进行解释、总结或引出结论。这里的 `That` 指代的是前一句谚语“一天一苹果，医生远离我”所传达的整个信息。\n3.  **`show` 的用法**：`show` 在这里意为“表明，说明”，后面常跟 `that` 引导的宾语从句，用于引出一个事实或结论。","socratic_tracks":[{"title":"理解谚语","steps":[{"question":"“An apple a day keeps the doctor away.” 这句谚语的字面意思是什么？","hint":"每天吃一个苹果，就能让医生远离你。","takeaway":"它的字面意思是每天吃苹果能让你保持健康，不用看医生。"},{"question":"这句谚语真的只是在说“苹果”这一种水果吗？还是它有更广泛的含义？","hint":"想一想，我们说“一寸光阴一寸金”，真的只是在说黄金吗？","takeaway":"它用“苹果”作为代表，强调的是“吃水果”这个好习惯的重要性。"},{"question":"那么，哪个选项最好地解释了这句谚语背后更广泛的道理？","hint":"哪个选项从“苹果”上升到了“水果”的层面？","takeaway":"选项D“这意味着如果我们多吃水果，我们就能保持健康。”准确地揭示了谚语的引申义。"}]},{"title":"关键词 That 的指代","steps":[{"question":"在选项D “That means if we eat more fruit, we can keep healthy.” 中，开头的 `That` 指的是什么？","hint":"它不是指一个具体的东西，而是指一件事或一个道理。这件事是什么？","takeaway":"`That` 指代的是前一句的谚语“An apple a day keeps the doctor away”所传达的整个信息。"},{"question":"我们能把 `That` 换成 `The saying` 吗？比如 “The saying means that...”？","hint":"“这句谚语意味着...”，意思上一样吗？","takeaway":"完全可以，这样更清晰地说明了 `That` 的指代对象，两者在功能上是相似的。"}]},{"title":"论证方法","steps":[{"question":"作者在这里为什么要引用一句谚语，而不是直接说“吃水果很重要”？","hint":"哪种说法听起来更有趣、更有说服力？","takeaway":"引用谚语是一种常见的论证方法，它能使文章更生动，观点更具说服力。"},{"question":"引用了谚语之后，为什么还要加上一句解释的话（比如选项D）？","hint":"如果只放一句谚语，读者都能明白作者想表达的确切意思吗？","takeaway":"在引用谚语后加上解释性的句子，可以确保读者准确理解作者的意图，并使论证逻辑更清晰、更完整。"}]}]}},{"number":"34","item_type":"reading","context_note":"","stem":"4. But don't eat too much chocolate.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查上下文的因果逻辑关系。空格前的句子是一个转折和建议：“But don't eat too much chocolate.”（但是不要吃太多巧克力。）。这是一个警告或建议。在提出一个“不要做”的建议后，下文最合乎逻辑的便是解释“为什么不要做”，即说明其带来的不良后果。选项C“It's not good for you.”（这对你不好。）直接说明了吃太多巧克力的后果，构成了“建议+原因”的逻辑链条，因此是正确答案。","knowledge_expansion_md":"1.  **转折连词 `But`**：`But` 表示转折，意味着后面的内容与前面的内容在语气或事实上形成对比。此前文章都在讲健康食品的好处，`But` 的出现标志着话题转向了不健康食品或不健康的饮食习惯。\n2.  **因果关系**：在说明性或议论性的文段中，因果关系是重要的逻辑链。作者提出一个观点或建议（结果），常常会紧接着给出理由（原因），有时用 `because`, `since`, `as` 等词连接，有时则省略连接词，通过句子顺序自然体现。本题就属于后者。\n3.  **生活常识**：做阅读题时，符合逻辑和生活常识的选项往往是正确答案的有力候选。吃太多甜食（如巧克力）对身体不好，这是一个普遍的生活常识，可以帮助我们快速锁定答案。","socratic_tracks":[{"title":"逻辑关系","steps":[{"question":"空格前的句子 “But don't eat too much chocolate.” 是在给出一个什么信息？","hint":"它是在表扬巧克力，还是在提醒我们一些事情？","takeaway":"这是一个警告或建议，告诉我们不要做某件事。"},{"question":"当你告诉别人“不要做某事”时，为了让对方信服，你通常会接着说什么？","hint":"比如，你告诉朋友“不要闯红灯”，你接下来会说什么？","takeaway":"通常会解释为什么不要这样做，也就是说明这样做的坏处或后果。"},{"question":"那么，哪个选项解释了“吃太多巧克力”的坏处？","hint":"哪个选项提到了一个负面影响？","takeaway":"选项A“它对你的牙齿有害”明确指出了吃太多巧克力的一个负面后果。"}]},{"title":"关键词 But","steps":[{"question":"这句话以 `But` 开头，这个词有什么作用？","hint":"它通常连接两个意思相反或不同的部分。","takeaway":"`But` 表示转折，说明接下来要讲的内容和前面讲的“健康食品”不一样了。"},{"question":"前面在讲吃水果的好处，`But` 之后开始讲巧克力。这暗示了巧克力在文中的“角色”是什么？","hint":"是和水果一样的健康食物，还是相反？","takeaway":"这暗示了巧克力在这里是作为不那么健康的食物的例子出现的。"}]},{"title":"生活常识","steps":[{"question":"根据你的生活经验，吃太多巧克力可能会有什么不好的结果？","hint":"想一想妈妈或牙医通常会怎么说。","takeaway":"吃太多巧克力可能会导致蛀牙、发胖等问题。"},{"question":"看看所有选项，哪个选项最符合我们关于巧克力的常识？","hint":"哪个选项提到了牙齿？","takeaway":"选项A“它对你的牙齿有害”与我们“吃糖坏牙”的常识完全吻合，这让它成为一个非常可能的答案。"}]}]}},{"number":"35","item_type":"reading","context_note":"","stem":"5. Only healthy food can make you strong and happy","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在语篇中承上启下的能力。空格前的句子“Only healthy food can make you strong and happy”讲述了健康饮食的重要性。空格后的句子“Get up early and do some sports every day”则提出了具体的锻炼建议。因此，空格处需要一个过渡句，将话题从“饮食”自然地转向“运动”。选项B“Sports can also keep you healthy.”（运动也能让你保持健康。）恰好起到了这个承上启下的作用，使得段落逻辑连贯，意思完整。","knowledge_expansion_md":"### 篇章逻辑与过渡\n\n在阅读和写作中，句子之间、段落之间需要有逻辑联系，才能使文章结构清晰、意思连贯。这种联系通常通过过渡性词语或句子来实现。\n\n1.  **常见过渡词/词组**：\n    *   **并列/递进**: `and`, `also`, `besides`, `in addition`, `what's more`\n    *   **转折**: `but`, `however`, `on the other hand`\n    *   **因果**: `so`, `therefore`, `as a result`\n    *   **举例**: `for example`, `for instance`, `such as`\n\n2.  **解题技巧**：对于这类“句子填空”题，要遵循“瞻前顾后”的原则。\n    *   **瞻前**：分析前文，明确已经讲述了什么内容。\n    *   **顾后**：分析后文，判断将要讲述什么内容。\n    *   **找联系**：思考前后文之间的逻辑关系（是递进、转折还是总结？），然后选择最能体现这种逻辑关系的句子。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"我们来看空格前面的句子，它在谈论什么话题？","hint":"找一找句子里的关键词，比如 `food`。","takeaway":"前文在谈论“健康食物”的重要性。"},{"question":"再看空格后面的句子，它又在建议我们做什么？","hint":"看看 `do some sports` 是什么意思。","takeaway":"后文在建议我们“每天早起做运动”。"},{"question":"文章的话题从“食物”转向了“运动”。那么，中间这个空缺的句子应该起到什么样的作用呢？","hint":"想一想，如果直接从食物跳到运动，会不会有点突然？我们需要怎样一句话来连接它们？","takeaway":"这个句子需要起到承上启下的过渡作用，将话题从饮食引向运动。"}]},{"title":"段落主旨","steps":[{"question":"读完整个小段落，你觉得它的中心思想是什么？","hint":"段落里反复出现的词是 `healthy` 和 `happy`。","takeaway":"这个段落的中心思想是如何保持健康和快乐。"},{"question":"为了说明这个中心思想，作者提到了哪两个具体的方法？","hint":"一个是关于吃的，一个是关于动的。","takeaway":"作者提到了“健康饮食”和“坚持运动”两个方法。"},{"question":"那么，我们填入的句子，是不是应该把这两个方法联系起来？","hint":"想想看，如果一个选项只谈食物，或者谈一个完全无关的话题，还合适吗？","takeaway":"是的，正确的句子需要体现出“运动”也是保持健康的一个重要方面。"}]},{"title":"关键词“also”","steps":[{"question":"假设正确选项是“Doing sports is also very important.”，你看到里面的 `also` 这个词了吗？它通常是什么意思？","hint":"比如我说：I like apples. I also like bananas. 这里的 `also` 是什么作用？","takeaway":"`also` 的意思是“也，还”，表示补充或递进。"},{"question":"那么，当句子里出现 `also` 时，它暗示了什么信息？","hint":"它暗示了在此之前，已经提到了至少一个别的东西或观点。","takeaway":"它暗示了“运动”是除了前面提到的“健康饮食”之外的另一个重要方面。"},{"question":"所以，`also` 这个词是不是帮助我们确认，这个句子很好地连接了前后的内容？","hint":"它既承认了前面说的内容，又引出了新的内容。","takeaway":"关键词 `also` 是判断该句是否为最佳过渡句的重要线索。"}]}]}}]},{"section_title":"V. 阅读下面短文, 从方框中选择合适的词, 并用其正确形式填空, 每词限用一次。","section_instruction":"每小题1分，共10分。\n\n**Word Box:** anything, angry, last, be, drive, buy, teach, happy, don't, one, begin, have\n\nTom is a school boy, he likes playing with his classmates in school, but he doesn't like having __1__ at home. __2__ day at 10:00 a.m., his art teacher __3__ him an art lesson. Everyone __4__ to draw pictures, but Tom __5__. When the bell rings, Tom hands in (上交) his picture. The __6__ teacher has a look at it and he says, \"Tom, can you give me a picture with __7__, Tom?\" \"I'm sorry, sir. I draw a cat and a fish on my __8__.\" \"Then where __9__ the fish and the cat?\" asks the teacher again. \"I draw a fish __10__. When I finish drawing the cat, it eats the fish. When I give it to you, the cat runs away,\" says Tom.","items":[{"number":"36","item_type":"cloze","context_note":"","stem":"1. (根据题意填空)","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"无法确定","explanation_md":"此题需要结合上下文语境进行作答。无法对本题进行分析和解答。此类题型（选词填空）通常要求学生在理解全文大意的基础上，分析空格处的句子成分，判断所需词汇的词性，并根据上下文的语法和语境要求，选择最合适的词并使用其正确形式。","knowledge_expansion_md":"### 选词填空（正确形式）解题策略\n\n此题型是小升初英语考试中的常见题型，综合考查学生的词汇积累、语法知识和语篇理解能力。解题关键步骤如下：\n\n1.  **通读全文，掌握大意**：不要急于填空，先快速阅读整篇文章，了解文章的主题和基本情节。\n2.  **分析选项，预判词性**：看清方框中给出的所有单词，判断每个词的基本词性（名词、动词、形容词、副词等）和含义。\n3.  **逐个攻破，分析空格**：\n    *   **判断词性**：分析空格所在的句子结构，判断该位置需要什么词性的词。\n    *   **判断形式**：确定词性后，再根据上下文判断词汇的具体形式，如：动词的时态、语态、第三人称单数；名词的单复数、所有格；形容词/副词的比较级、最高级等。\n4.  **代入验证，检查通顺**：将填好的答案代入原文，再次通读，检查文章是否逻辑通顺、语法正确。","socratic_tracks":[{"title":"第一步：判断词性","steps":[{"question":"当你在一个句子中看到 `a very ___ girl` 这样的结构，你觉得横线上应该填什么词性的词？","hint":"这个词是用来描述 `girl`（女孩）的。","takeaway":"应该填入形容词，用来修饰名词。"},{"question":"如果句子是 `He can ___ very fast`，横线上应该是什么词性的词？","hint":"注意 `can` 是一个情态动词，它后面跟的动词有什么特点？","takeaway":"应该填入动词原形，因为情态动词后必须跟动词原形。"},{"question":"所以，在做选词填空时，分析空格在句子中的位置和作用，来判断它需要什么词性，是不是非常关键的第一步？","hint":"先确定词的“身份”，再选择具体的词。","takeaway":"分析句子结构以确定所需词性，是解题的关键第一步。"}]},{"title":"第二步：确定形式","steps":[{"question":"如果我们确定一个空需要填动词 `go`，但句子是 `He ___ to school yesterday.`，我们应该填 `go` 吗？","hint":"注意句子里的时间状语 `yesterday`（昨天）。","takeaway":"不行，因为是过去发生的事，应该用 `go` 的过去式 `went`。"},{"question":"如果句子是 `There are three ___ (apple) on the table.` 呢？","hint":"注意名词前面的数量词 `three`。","takeaway":"应该用名词的复数形式 `apples`。"},{"question":"这说明，即使我们从框里选对了词，还需要做什么重要的一步？","hint":"词选对了，但它的样子可能需要变一变。","takeaway":"选对词后，必须根据上下文的语法规则来确定其正确形式。"}]},{"title":"第三步：利用语境","steps":[{"question":"如果一个句子说：`The weather is ___, so I will take an umbrella.`，就算选项里有很多词，你觉得这个空应该填一个表示什么意思的词？","hint":"想一想，我们通常在什么天气下会带雨伞？","takeaway":"这个词的意思应该和“下雨的（rainy）”或“糟糕的（bad）”有关。"},{"question":"这说明，空格前后的句子会给我们很多线索，对吗？","hint":"句子和句子之间是有联系的，不是孤立的。","takeaway":"是的，上下文提供了理解和选择正确单词的重要线索。"},{"question":"因此，在做题时，我们应该只看空格所在的那个句子，还是应该阅读整段话来理解大意？","hint":"哪种方法能获得更全面的信息？","takeaway":"必须通读全文或至少是上下文，才能准确理解语境并做出最佳选择。"}]}]}},{"number":"37","item_type":"cloze","context_note":"","stem":"2. (根据题意填空)","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"无法确定","explanation_md":"此题需要结合上下文语境进行作答。无法对本题进行分析和解答。此类题型（选词填空）通常要求学生在理解全文大意的基础上，分析空格处的句子成分，判断所需词汇的词性，并根据上下文的语法和语境要求，选择最合适的词并使用其正确形式。","knowledge_expansion_md":"### 选词填空（正确形式）解题策略\n\n此题型是小升初英语考试中的常见题型，综合考查学生的词汇积累、语法知识和语篇理解能力。解题关键步骤如下：\n\n1.  **通读全文，掌握大意**：不要急于填空，先快速阅读整篇文章，了解文章的主题和基本情节。\n2.  **分析选项，预判词性**：看清方框中给出的所有单词，判断每个词的基本词性（名词、动词、形容词、副词等）和含义。\n3.  **逐个攻破，分析空格**：\n    *   **判断词性**：分析空格所在的句子结构，判断该位置需要什么词性的词。\n    *   **判断形式**：确定词性后，再根据上下文判断词汇的具体形式，如：动词的时态、语态、第三人称单数；名词的单复数、所有格；形容词/副词的比较级、最高级等。\n4.  **代入验证，检查通顺**：将填好的答案代入原文，再次通读，检查文章是否逻辑通顺、语法正确。","socratic_tracks":[{"title":"第一步：判断词性","steps":[{"question":"当你在一个句子中看到 `a very ___ girl` 这样的结构，你觉得横线上应该填什么词性的词？","hint":"这个词是用来描述 `girl`（女孩）的。","takeaway":"应该填入形容词，用来修饰名词。"},{"question":"如果句子是 `He can ___ very fast`，横线上应该是什么词性的词？","hint":"注意 `can` 是一个情态动词，它后面跟的动词有什么特点？","takeaway":"应该填入动词原形，因为情态动词后必须跟动词原形。"},{"question":"所以，在做选词填空时，分析空格在句子中的位置和作用，来判断它需要什么词性，是不是非常关键的第一步？","hint":"先确定词的“身份”，再选择具体的词。","takeaway":"分析句子结构以确定所需词性，是解题的关键第一步。"}]},{"title":"第二步：确定形式","steps":[{"question":"如果我们确定一个空需要填动词 `go`，但句子是 `He ___ to school yesterday.`，我们应该填 `go` 吗？","hint":"注意句子里的时间状语 `yesterday`（昨天）。","takeaway":"不行，因为是过去发生的事，应该用 `go` 的过去式 `went`。"},{"question":"如果句子是 `There are three ___ (apple) on the table.` 呢？","hint":"注意名词前面的数量词 `three`。","takeaway":"应该用名词的复数形式 `apples`。"},{"question":"这说明，即使我们从框里选对了词，还需要做什么重要的一步？","hint":"词选对了，但它的样子可能需要变一变。","takeaway":"选对词后，必须根据上下文的语法规则来确定其正确形式。"}]},{"title":"第三步：利用语境","steps":[{"question":"如果一个句子说：`The weather is ___, so I will take an umbrella.`，就算选项里有很多词，你觉得这个空应该填一个表示什么意思的词？","hint":"想一想，我们通常在什么天气下会带雨伞？","takeaway":"这个词的意思应该和“下雨的（rainy）”或“糟糕的（bad）”有关。"},{"question":"这说明，空格前后的句子会给我们很多线索，对吗？","hint":"句子和句子之间是有联系的，不是孤立的。","takeaway":"是的，上下文提供了理解和选择正确单词的重要线索。"},{"question":"因此，在做题时，我们应该只看空格所在的那个句子，还是应该阅读整段话来理解大意？","hint":"哪种方法能获得更全面的信息？","takeaway":"必须通读全文或至少是上下文，才能准确理解语境并做出最佳选择。"}]}]}},{"number":"38","item_type":"cloze","context_note":"","stem":"3. (根据题意填空)","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"无法确定","explanation_md":"此题需要结合上下文语境进行作答。无法对本题进行分析和解答。此类题型（选词填空）通常要求学生在理解全文大意的基础上，分析空格处的句子成分，判断所需词汇的词性，并根据上下文的语法和语境要求，选择最合适的词并使用其正确形式。","knowledge_expansion_md":"### 选词填空（正确形式）解题策略\n\n此题型是小升初英语考试中的常见题型，综合考查学生的词汇积累、语法知识和语篇理解能力。解题关键步骤如下：\n\n1.  **通读全文，掌握大意**：不要急于填空，先快速阅读整篇文章，了解文章的主题和基本情节。\n2.  **分析选项，预判词性**：看清方框中给出的所有单词，判断每个词的基本词性（名词、动词、形容词、副词等）和含义。\n3.  **逐个攻破，分析空格**：\n    *   **判断词性**：分析空格所在的句子结构，判断该位置需要什么词性的词。\n    *   **判断形式**：确定词性后，再根据上下文判断词汇的具体形式，如：动词的时态、语态、第三人称单数；名词的单复数、所有格；形容词/副词的比较级、最高级等。\n4.  **代入验证，检查通顺**：将填好的答案代入原文，再次通读，检查文章是否逻辑通顺、语法正确。","socratic_tracks":[{"title":"第一步：判断词性","steps":[{"question":"当你在一个句子中看到 `a very ___ girl` 这样的结构，你觉得横线上应该填什么词性的词？","hint":"这个词是用来描述 `girl`（女孩）的。","takeaway":"应该填入形容词，用来修饰名词。"},{"question":"如果句子是 `He can ___ very fast`，横线上应该是什么词性的词？","hint":"注意 `can` 是一个情态动词，它后面跟的动词有什么特点？","takeaway":"应该填入动词原形，因为情态动词后必须跟动词原形。"},{"question":"所以，在做选词填空时，分析空格在句子中的位置和作用，来判断它需要什么词性，是不是非常关键的第一步？","hint":"先确定词的“身份”，再选择具体的词。","takeaway":"分析句子结构以确定所需词性，是解题的关键第一步。"}]},{"title":"第二步：确定形式","steps":[{"question":"如果我们确定一个空需要填动词 `go`，但句子是 `He ___ to school yesterday.`，我们应该填 `go` 吗？","hint":"注意句子里的时间状语 `yesterday`（昨天）。","takeaway":"不行，因为是过去发生的事，应该用 `go` 的过去式 `went`。"},{"question":"如果句子是 `There are three ___ (apple) on the table.` 呢？","hint":"注意名词前面的数量词 `three`。","takeaway":"应该用名词的复数形式 `apples`。"},{"question":"这说明，即使我们从框里选对了词，还需要做什么重要的一步？","hint":"词选对了，但它的样子可能需要变一变。","takeaway":"选对词后，必须根据上下文的语法规则来确定其正确形式。"}]},{"title":"第三步：利用语境","steps":[{"question":"如果一个句子说：`The weather is ___, so I will take an umbrella.`，就算选项里有很多词，你觉得这个空应该填一个表示什么意思的词？","hint":"想一想，我们通常在什么天气下会带雨伞？","takeaway":"这个词的意思应该和“下雨的（rainy）”或“糟糕的（bad）”有关。"},{"question":"这说明，空格前后的句子会给我们很多线索，对吗？","hint":"句子和句子之间是有联系的，不是孤立的。","takeaway":"是的，上下文提供了理解和选择正确单词的重要线索。"},{"question":"因此，在做题时，我们应该只看空格所在的那个句子，还是应该阅读整段话来理解大意？","hint":"哪种方法能获得更全面的信息？","takeaway":"必须通读全文或至少是上下文，才能准确理解语境并做出最佳选择。"}]}]}},{"number":"39","item_type":"cloze","context_note":"","stem":"4. 国王非常担心","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"best","explanation_md":"此处需要填入一个形容词，对第三位王子的礼物进行评价。根据前文“国王非常担心”和后文公主被治愈的情节，以及与前两个礼物对比，可知国王认为第三位王子的礼物是“最好”的。空格前的定冠词“the”提示需要使用形容词的最高级形式。方框中给出的是形容词“good”，其最高级为不规则形式“best”。因此，正确答案是 best。","knowledge_expansion_md":"### 形容词的比较级和最高级\n\n1.  **规则变化**：\n    *   单音节词和少数双音节词：词尾加 `-er` (比较级) 和 `-est` (最高级)，如 `tall - taller - tallest`。\n    *   以e结尾：直接加 `-r` 和 `-st`，如 `wise - wiser - wisest`。\n    *   重读闭音节且末尾只有一个辅音字母：双写该辅音字母再加 `-er`/`-est`，如 `big - bigger - biggest`。\n    *   以“辅音字母+y”结尾：变 `y` 为 `i` 再加 `-er`/`-est`，如 `happy - happier - happiest`。\n    *   多音节词和部分双音节词：在前面加 `more` (比较级) 和 `most` (最高级)，如 `beautiful - more beautiful - most beautiful`。\n\n2.  **不规则变化**：\n    *   `good/well - better - best`\n    *   `bad/ill - worse - worst`\n    *   `many/much - more - most`\n    *   `little - less - least`\n    *   `far - farther/further - farthest/furthest`\n\n**易错点**：使用最高级时，前面通常需要加定冠词 `the`，但如果形容词前有物主代词（如 `my`, `his`）或名词所有格（如 `Tom's`），则不再使用 `the`。例如：`He is my best friend.`","socratic_tracks":[{"title":"形容词最高级","steps":[{"question":"空格前面有一个什么词？这个词通常提示我们后面要用什么形式的形容词？","hint":"看看 \"the\" 这个词。我们说“最高的山”会说 \"the ______ mountain\"。","takeaway":"定冠词 \"the\" 后面常常跟形容词的最高级形式。"},{"question":"根据上下文，国王在比较三件礼物后，认为第三位王子的礼物怎么样？是“好”、“更好”还是“最好”的？","hint":"想一想，这个礼物救了公主的命，而其他两个礼物在那时毫无用处。","takeaway":"语境表明，国王在三个礼物中做出了比较，认为这个礼物是最好的。"},{"question":"单词表里给出的词是 \"good\"，它的最高级形式是什么？","hint":"这是一个不规则变化的形容词，不是直接加 \"-est\"。","takeaway":"\"good\" 的比较级是 \"better\"，最高级是 \"best\"。"}]},{"title":"语境逻辑推理","steps":[{"question":"故事里一共有几位王子献上了礼物？国王对这些礼物有什么看法？","hint":"回顾一下第一段和第二段，有三位王子，三件礼物。","takeaway":"故事中有三件礼物，需要进行比较。"},{"question":"为什么国王最终认为第三位王子的礼物是价值最高的？","hint":"思考一下哪个礼物在最关键的时刻解决了最严重的问题。","takeaway":"第三位王子的礼物治好了生命垂危的公主，体现了最高的价值。"},{"question":"所以，用来描述这个“价值最高”的礼物的词，应该是什么？","hint":"我们要从 \"good\" 这个词变化而来，表示“最”好。","takeaway":"因此，这里需要用 \"good\" 的最高级 \"best\" 来表达“最好”的含义。"}]},{"title":"词形变换","steps":[{"question":"题型要求我们做什么？是直接填入方框里的词，还是需要变化？","hint":"仔细阅读大题的要求：“用其正确形式填空”。","takeaway":"题目要求使用所给单词的正确形式。"},{"question":"方框中给出的词是 \"good\"，它是一个什么词性的词？","hint":"它可以用来描述一个东西，比如 a good book。","takeaway":"\"good\" 是一个形容词。"},{"question":"在 \"the ______\" 这个结构中，形容词 \"good\" 应该变成什么形式？","hint":"比较三个或以上事物时，形容词要用最高级。","takeaway":"形容词 \"good\" 在这里需要变为其最高级形式 \"best\"。"}]}]}},{"number":"40","item_type":"cloze","context_note":"","stem":"5. man","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"wisest","explanation_md":"此处需要填入一个形容词来修饰名词“man”。根据句意，国王宣布第三位王子将迎娶公主并成为未来的国王，这表明国王认为他是最出色的人。空格前的定冠词“the”提示需要使用形容词的最高级。方框中给出的词是“wise”（明智的），其最高级形式是在词尾加“-st”，即“wisest”。因此，正确答案是 wisest。","knowledge_expansion_md":"### 形容词最高级的构成\n\n1.  **以 -e 结尾的形容词**：这类形容词在构成最高级时，只需在词尾加上 `-st` 即可。\n    *   `wise` (明智的) -> `wisest`\n    *   `nice` (好的) -> `nicest`\n    *   `large` (大的) -> `largest`\n    *   `brave` (勇敢的) -> `bravest`\n\n2.  **词义辨析：`wise` vs `smart` vs `clever`**\n    *   `wise` (明智的)：通常指基于经验、知识和良好判断力的深层智慧。它强调远见和正确的决策能力。例：`It was a wise decision.`\n    *   `smart` (聪明的)：多指头脑灵活、学习能力强、反应快。在美国英语中常用。例：`She is a smart student.`\n    *   `clever` (聪明的)：与 `smart` 类似，但有时可能略带贬义，指“精明”“小聪明”。例：`He is a clever liar.`\n\n在本题中，第三位王子不追求华而不实的礼物，而是选择了一个能救死扶伤的苹果，体现了其深刻的智慧和远见，因此用 `wisest` 最为贴切。","socratic_tracks":[{"title":"形容词最高级","steps":[{"question":"看看空格前面的 \"the\"，这通常意味着什么？","hint":"和上一题一样，定冠词 \"the\" 常常用来引出最高级的形容词。","takeaway":"定冠词 \"the\" 提示此处需要使用形容词的最高级。"},{"question":"国王为什么会这样评价第三位王子？他是在拿这位王子和谁比较？","hint":"国王宣布他将成为未来的国王，这说明国王认为他比所有人都更……","takeaway":"国王认为第三位王子在所有追求者中是最出色的，因此需要用最高级。"},{"question":"单词 \"wise\" 的最高级形式是什么？","hint":"\"wise\" 是一个以 'e' 结尾的单音节词。","takeaway":"以 'e' 结尾的形容词，其最高级直接加 \"-st\"，所以是 \"wisest\"。"}]},{"title":"词义辨析 (wise)","steps":[{"question":"为什么国王会认为第三位王子是 \"wise\" (明智的)？","hint":"想想第三位王子的礼物和另外两位王子的礼物有什么本质不同。","takeaway":"他的礼物不追求奢华，而是解决了最根本、最重要的问题——健康和生命。"},{"question":"\"wise\" 这个词和 \"smart\" 或 \"clever\" 有什么区别？","hint":"一个小偷可能很 \"clever\"，但他 \"wise\" 吗？","takeaway":"\"wise\" (明智) 强调基于经验和判断力的深层智慧，而 \"smart\" (聪明) 更侧重于头脑反应快。"},{"question":"在这个故事里，用 \"wisest\" (最明智的) 来形容第三位王子，是不是非常贴切？","hint":"他不仅聪明，更有远见和善良。","takeaway":"\"wisest\" 完美地概括了第三位王子超越其他人的远见和判断力。"}]},{"title":"句子结构分析","steps":[{"question":"\"The third prince is the ______ man.\" 这个句子的基本结构是什么？","hint":"这是 \"主语 + 系动词 + 表语\" 结构。","takeaway":"这是一个主系表结构的句子，空格部分是表语的一部分，用来修饰名词 \"man\"。"},{"question":"用来修饰名词 \"man\" 的应该是什么词性的词？","hint":"什么词可以形容一个“男人”？","takeaway":"需要一个形容词来修饰名词 \"man\"。"},{"question":"结合我们已经知道的，需要用形容词的最高级，那么 \"wise\" 应该如何变化填入？","hint":"别忘了 \"wise\" 以 'e' 结尾。","takeaway":"形容词 \"wise\" 需要变为其最高级形式 \"wisest\"。"}]}]}},{"number":"41","item_type":"cloze","context_note":"","stem":"6. ... felt ___.","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"ashamed","explanation_md":"此处需要填入一个词来描述前两位王子的感受。动词“felt”（feel的过去式）是感官系动词，后面应跟形容词作表语。根据语境，前两位王子看到第三位王子因为一个朴素但有用的礼物赢得了公主，而他们昂贵的礼物却毫无用处，他们应该感到“羞愧的”。方框中给出的词是名词“shame”（羞耻），其对应的形容词是“ashamed”。因此，正确答案是 ashamed。","knowledge_expansion_md":"### 系动词与词性转换\n\n1.  **系动词 (Linking Verbs)**：系动词本身没有实际意义，主要起连接主语和表语的作用，说明主语的状态、性质或身份。常见的系动词有：\n    *   **be动词**：`am, is, are, was, were`\n    *   **感官动词**：`feel` (感觉), `look` (看起来), `sound` (听起来), `smell` (闻起来), `taste` (尝起来)\n    *   **状态变化动词**：`become` (变成), `get` (变得), `grow` (变得), `turn` (变成)\n    *   **状态维持动词**：`keep` (保持), `stay` (保持), `seem` (似乎), `appear` (似乎)\n    **关键**：系动词后面必须跟形容词、名词或介词短语等作表语，不能跟副词。\n\n2.  **名词到形容词的转换**：英语中很多表示情感的名词可以转换为形容词。\n    *   `shame` (n. 羞耻) -> `ashamed` (adj. 感到羞耻的)\n    *   `pride` (n. 骄傲) -> `proud` (adj. 感到骄傲的)\n    *   `surprise` (n. 惊奇) -> `surprised` (adj. 感到惊奇的)\n    *   `interest` (n. 兴趣) -> `interested` (adj. 感兴趣的)\n    **注意**：`feel shame` (感到羞耻) 也是正确的表达，但本题要求用所给词的正确形式填空，且 `feel + adj.` 是更常见的用法。","socratic_tracks":[{"title":"系动词与表语","steps":[{"question":"空格前面的动词 \"felt\" 是什么类型的动词？","hint":"这个词描述的是一种感觉，它连接了主语（王子们）和他们的状态。这类动词叫什么？","takeaway":"\"felt\" 在这里是感官系动词，表示“感觉到”。"},{"question":"系动词后面通常跟什么词性的词来作表语，描述主语的状态？","hint":"我们会说 \"I feel happy\"，而不是 \"I feel happily\"。","takeaway":"系动词后面通常跟形容词作表语。"},{"question":"单词表里给的是名词 \"shame\" (羞耻)，它的形容词形式是什么？","hint":"当你做错了事，你会感到...？","takeaway":"\"shame\" 的形容词形式是 \"ashamed\"。"}]},{"title":"词形变换 (名词变形容词)","steps":[{"question":"题目要求使用所给单词的正确形式。所给的词是 \"shame\"，它是什么词性？","hint":"我们可以说 \"What a shame!\" (真遗憾！)。","takeaway":"\"shame\" 是一个名词，意为“羞耻，遗憾”。"},{"question":"在 \"The princes felt ______.\" 这个句子里，我们需要一个词来形容王子的感受。应该用名词还是形容词？","hint":"描述感受时，我们通常用形容词，如 happy, sad, angry。","takeaway":"我们需要一个形容词来描述主语“王子们”的感受。"},{"question":"那么，如何将名词 \"shame\" 变成一个形容词来表达“感到羞耻的”？","hint":"这是一个常见的词形变化。","takeaway":"名词 \"shame\" 对应的形容词是 \"ashamed\"。"}]},{"title":"故事人物情感分析","steps":[{"question":"故事的结局是什么？前两位王子成功了吗？","hint":"国王选择了第三位王子。","takeaway":"前两位王子失败了，没能娶到公主。"},{"question":"他们为什么会失败？他们从中学到了什么？","hint":"阅读文章最后一句：“They understood that the most valuable gift is not the most expensive one...”","takeaway":"他们明白了最有价值的礼物不是最贵的，而是最能帮助人的。这说明他们认识到了自己的错误。"},{"question":"当一个人认识到自己的想法是错误或肤浅的时候，通常会产生什么样的感觉？","hint":"这种感觉与“骄傲”相反。","takeaway":"他们会感到羞愧或惭愧，因此填 \"ashamed\" (感到羞愧的) 最符合语境。"}]}]}},{"number":"42","item_type":"cloze","context_note":"","stem":"7. ... lived ___ ever after.","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"happily","explanation_md":"此处需要填入一个词来修饰动词“lived”，说明王子和公主是“怎样”生活的。修饰动词需要用副词。方框中给出的词是形容词“happy”（快乐的），需要将其变为副词形式。形容词“happy”以“辅音字母+y”结尾，变副词时需将“y”变为“i”，再加“-ly”，即“happily”。“lived happily ever after”是童话故事中经典的结尾句式，意为“从此幸福地生活在一起”。因此，正确答案是 happily。","knowledge_expansion_md":"### 形容词与副词的转换\n\n副词（特别是方式副词）经常由形容词变化而来，用来修饰动词，说明动作发生的方式。其转换规则主要有：\n\n1.  **直接加 `-ly`**：大多数形容词直接在词尾加 `-ly`。\n    *   `slow` -> `slowly`\n    *   `quick` -> `quickly`\n    *   `beautiful` -> `beautifully`\n\n2.  **以“辅音字母+y”结尾**：变 `y` 为 `i`，再加 `-ly`。\n    *   `happy` -> `happily`\n    *   `easy` -> `easily`\n    *   `busy` -> `busily`\n\n3.  **以 `-le` 结尾**：去掉 `e`，加 `y`。\n    *   `possible` -> `possibly`\n    *   `terrible` -> `terribly`\n\n4.  **形容词和副词同形**：\n    *   `fast` (快的/地), `hard` (努力的/地), `early` (早的/地), `late` (晚的/地), `high` (高的/地)\n    *   **注意**：`hardly` 是一个副词，但意为“几乎不”，与 `hard` 意思完全不同。`highly` 也是副词，意为“高度地”，是抽象含义。\n\n**固定搭配**：`live happily ever after` 是英语文学，尤其是童话故事中一个非常著名的固定短语，是学习者应该掌握的文化知识点。","socratic_tracks":[{"title":"副词的用法","steps":[{"question":"空格在句子中的作用是什么？它是在修饰哪个词？","hint":"它描述的是王子和公主“生活”的方式。","takeaway":"空格处的词用来修饰动词 \"lived\"。"},{"question":"用来修饰动词的词，我们称之为什么？","hint":"形容词修饰名词，______修饰动词。","takeaway":"修饰动词的词是副词。"},{"question":"单词表里给的是形容词 \"happy\"，它的副词形式是什么？","hint":"记得以 'y' 结尾的形容词变副词的规则吗？","takeaway":"形容词 \"happy\" 变为副词是 \"happily\" (变 y 为 i 再加 ly)。"}]},{"title":"固定搭配 (童话结局)","steps":[{"question":"这篇文章是一个什么类型的故事？","hint":"故事里有国王、公主和王子。","takeaway":"这是一个典型的童话故事 (fairy tale)。"},{"question":"你知道童话故事通常用怎样一句话来结尾吗？","hint":"中文常说“从此以后，他们幸福地生活在一起”。","takeaway":"英文童话的经典结尾是 \"And they lived happily ever after.\""},{"question":"那么，根据这个固定搭配，空格里应该填什么词？","hint":"对应中文里的“幸福地”。","takeaway":"空格里应该填入副词 \"happily\"。"}]},{"title":"词形变换 (形容词变副词)","steps":[{"question":"题目要求我们对所给单词进行词形变换。给出的词是 \"happy\"，它是什么词性？","hint":"我们可以说 \"a happy boy\"。","takeaway":"\"happy\" 是一个形容词。"},{"question":"在 \"lived ______ ever after\" 这个结构中，我们需要一个词来描述 \"lived\" 这个动作的方式。应该用形容词还是副词？","hint":"描述动作，用副词。","takeaway":"我们需要一个副词来修饰动词 \"lived\"。"},{"question":"将形容词 \"happy\" 变成副词的规则是什么？","hint":"它以辅音字母 + 'y' 结尾。","takeaway":"将词尾的 'y' 变为 'i'，再加 '-ly'，得到 \"happily\"。"}]}]}},{"number":"43","item_type":"cloze","context_note":"","stem":"8. ... ___ hobbies.","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"different","explanation_md":"此题为选词填空，考查形容词的用法和上下文理解。\n1.  **语法分析**：空格位于名词 `hobbies` (爱好) 前面，需要一个形容词来修饰这个名词。\n2.  **词义与上下文**：根据后文 “For example, Tom likes reading books, and Lucy enjoys playing the piano.” (例如，汤姆喜欢读书，露西喜欢弹钢琴)，可知大家有各自不同的爱好。\n3.  **词形变化**：在方框中的词 `different` 本身就是形容词，意为“不同的”，符合语法和句意要求。\n4.  **结论**：因此，填入 `different`，构成 `different hobbies` (不同的爱好)，使句子完整通顺。","knowledge_expansion_md":"### 形容词修饰名词\n\n形容词 (Adjective) 的一个主要功能是修饰名词，说明人或事物的性质、状态或特征。通常情况下，单个形容词作定语时放在它所修饰的名词前面。\n\n*   **结构**：`形容词 + 名词`\n*   **例句**：\n    *   a `beautiful` flower (一朵美丽的花)\n    *   `interesting` stories (有趣的故事)\n    *   `Chinese` tea (中国茶)\n\n### 词汇家族：differ vs. different vs. difference\n\n*   **differ** (动词): 意为“不同，相异”。\n    *   `Our opinions differ on this matter.` (我们在这件事上的看法不同。)\n*   **different** (形容词): 意为“不同的，差异的”。\n    *   `They come from different countries.` (他们来自不同的国家。)\n*   **difference** (名词): 意为“不同，差异”。\n    *   `What's the difference between these two words?` (这两个词之间有什么区别？)","socratic_tracks":[{"title":"词性判断","steps":[{"question":"空格后面的单词 `hobbies` 是什么词性？","hint":"`hobby` 的意思是“爱好”，这里是它的复数形式。它是一个人、地方还是事物？","takeaway":"hobbies 是名词，所以空格处很可能需要一个形容词来修饰它。"},{"question":"在给定的词库中，哪些词是或可以变成形容词？","hint":"想一想 `happy`, `different` 这些词本身是什么词性。`interest` 这个词可以变成什么形式的形容词？","takeaway":"词库中的 `different` 和 `happy` 是形容词，可以直接使用。"},{"question":"结合句意“我们有...的爱好”，`happy` (开心的) 爱好 和 `different` (不同的) 爱好，哪个更符合后文的举例？","hint":"后文举了“读书”和“弹钢琴”两个例子，这说明了什么？","takeaway":"后文通过举例说明了大家爱好的“不同”，因此 `different` 是最佳选择。"}]},{"title":"上下文逻辑","steps":[{"question":"本句 `We have ___ hobbies.` 在短文中的作用是什么？是开头、中间还是结尾？","hint":"看看它后面的句子 `For example...` (例如...)","takeaway":"这句话后面紧跟着举例说明，所以它是一个总起句。"},{"question":"后面的例子（汤姆爱读书，露西爱弹琴）说明了大家爱好的哪个方面？是爱好很有趣，还是爱好各不相同？","hint":"读书和弹琴是两种完全不一样的活动。","takeaway":"例子清晰地表明了爱好的多样性和差异性。"},{"question":"既然这句话是总起句，并且后面的例子说明了爱好的差异，那么空格里应该填入一个表示什么意思的词？","hint":"这个词需要概括“各不相同”这个概念。","takeaway":"因此，空格处需要填入表示“不同的”意思的词，即 `different`。"}]},{"title":"词义辨析","steps":[{"question":"我们能填 `interesting` (有趣的) 吗？`We have interesting hobbies.` 这句话语法正确吗？","hint":"`interesting` 是形容词，修饰名词 `hobbies`。","takeaway":"语法上完全正确，意思也讲得通，表示“我们有有趣的爱好”。"},{"question":"既然 `interesting` 也可以，为什么 `different` 是这道题的“最佳”答案？","hint":"再读一遍后面的句子 `For example, Tom likes reading books, and Lucy enjoys playing the piano.` 这句话是为了证明什么？","takeaway":"虽然 `interesting` 语法正确，但 `different` 更能起到统领下文、与后文例子形成逻辑关联的作用，是上下文的最佳选择。"}]}]}},{"number":"44","item_type":"cloze","context_note":"","stem":"9. For example, Tom likes reading books, and Lucy enjoys ___ the piano.","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"playing","explanation_md":"此题考查非谓语动词中动名词的用法。\n1.  **语法分析**：空格位于动词 `enjoys` (喜欢) 的后面。`enjoy` 是一个及物动词，后面需要跟宾语。\n2.  **固定搭配**：`enjoy` 这个动词有一个固定的用法，即 `enjoy doing something` (喜欢做某事)。它后面如果跟动词，必须使用该动词的动名词形式 (V-ing)。\n3.  **词义选择**：根据宾语 `the piano` (钢琴)，可以从方框中选择动词 `play` (弹奏)。\n4.  **词形变化**：将动词原形 `play` 变为动名词形式 `playing`。\n5.  **结论**：因此，正确答案是 `playing`。","knowledge_expansion_md":"### 动词后跟动名词（V-ing）\n\n在英语中，一些特定的动词后面如果需要跟另一个动词作宾语，那么这个作宾语的动词必须使用动名词（gerund, 即 V-ing）形式。这是初中英语的重点和高频考点。\n\n**常见的要求后跟 V-ing 的动词：**\n\n*   **表示“喜恶”**: `enjoy` (喜欢), `like` (喜欢), `love` (爱), `hate` (憎恨), `dislike` (不喜欢)\n*   **表示“完成/放弃”**: `finish` (完成), `give up` (放弃), `keep` (坚持), `practise` (练习)\n*   **表示“建议/考虑”**: `suggest` (建议), `advise` (建议), `consider` (考虑)\n*   **其他**: `mind` (介意), `miss` (想念/错过), `avoid` (避免)\n\n**例句：**\n*   `He finished reading the book.` (他读完了那本书。)\n*   `Would you mind opening the window?` (你介意打开窗户吗？)\n*   `You should practise speaking English every day.` (你应该每天练习说英语。)","socratic_tracks":[{"title":"动词固定搭配","steps":[{"question":"请看空格前面的动词 `enjoys`，它的原形是什么？","hint":"`enjoys` 是第三人称单数形式。","takeaway":"动词原形是 `enjoy`，意思是“喜欢，享受”。"},{"question":"你学过 `enjoy` 这个词的用法吗？它后面如果跟一个动作，这个动作要用什么形式？是 `enjoy to do` 还是 `enjoy doing`？","hint":"回想一下“我喜欢游泳”怎么说？是 `I enjoy to swim` 还是 `I enjoy swimming`？","takeaway":"`enjoy` 后面必须跟动名词（V-ing形式）作宾语，构成 `enjoy doing sth.` 的固定搭配。"},{"question":"根据句意和词库，哪个动词和 `the piano` 搭配最合适？应该变成什么形式？","hint":"“弹”钢琴用 `play the piano`。","takeaway":"应该选择动词 `play`，并根据 `enjoy doing` 的规则将其变为 `playing`。"}]},{"title":"句子成分分析","steps":[{"question":"在 `Lucy enjoys ___ the piano` 这个句子里，主语和谓语动词分别是什么？","hint":"主语是动作的发出者，谓语是主语发出的动作。","takeaway":"主语是 `Lucy`，谓语动词是 `enjoys`。"},{"question":"`enjoys` 后面的部分在句子中充当什么成分？","hint":"它回答了 `enjoys` (喜欢) 的是什么，是 `enjoy` 这个动作的对象。","takeaway":"`enjoys` 后面的部分是宾语。"},{"question":"当一个动词（比如 `play`）需要在一个句子里作宾语时，它通常需要变成什么形式？","hint":"动词本身不能直接作宾语，需要进行“名词化”处理。","takeaway":"动词作宾语时，通常需要变成动名词（-ing）或不定式（to do）。而 `enjoy` 这个动词特殊，规定了后面只能跟动名词。"}]},{"title":"乐器与球类运动的表达","steps":[{"question":"在英语中，表示“演奏”某种乐器，比如钢琴、吉他、小提琴，我们通常用哪个动词？","hint":"是 `do`, `make`, 还是 `play`？","takeaway":"我们用动词 `play` 来表示“演奏乐器”。"},{"question":"当我们说“演奏某种乐器”时，乐器名词前通常需要加冠词吗？加哪个？","hint":"是 `play piano` 还是 `play the piano`？","takeaway":"表示演奏乐器时，通常要在乐器名词前加定冠词 `the`，构成 `play the + 乐器` 的结构。"},{"question":"那么，表示“进行某种球类运动”，比如篮球、足球，球类名词前需要加 `the` 吗？","hint":"是 `play basketball` 还是 `play the basketball`？","takeaway":"表示进行球类运动时，球类名词前通常不加冠词，直接用 `play + 球类运动`。"}]}]}},{"number":"45","item_type":"cloze","context_note":"","stem":"I draw a fish ___.","options":{"A":"(正确选项)","B":"(干扰项)","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"","explanation_md":"此题的题干、答案及解析与篇章上下文完全不符。根据篇章，本题的实际句子是“I draw a fish ___.”。结合后文“When I finish drawing the cat, it eats the fish.”（当我画完猫时，它吃了鱼），可知汤姆的逻辑是鱼先被画出，然后猫才被画出并吃了鱼。因此，空格处最符合逻辑的词应为 `first` (首先)，但该词并未在方框词库中提供。词库中的其他词汇均不符合句意或逻辑，导致本题无法作答。","knowledge_expansion_md":"","socratic_tracks":[]}}]}],"content_markdown":"# 成都某嘉祥外国语学校 初2024级新初一分班(奖学金)真卷英语\n\n**满分:80分 时间:60分钟**\n\n## I. 单项选择\n(每小题1分，共10分。)\n\n1. Please don't _____ this book to Mr. Zhang.\n  A. forget give\n  B. to forget give\n  C. forget to give\n  D. to forget to give\n\n2. —Why do you want to live in the countryside?\n—Because I want to live _____.\n  A. quiet somewhere\n  B. somewhere quiet\n  C. different something\n  D. something different\n\n3. —Tidy, please. _____ the radio. I want to listen to the weather report.\n  A. Mix up\n  B. cut up\n  C. turn on\n  D. work on\n\n4. —We are going to Hainan this winter holiday.\n—_____!\n  A. Great\n  B. Enjoy yourselves\n  C. No problem\n  D. Good luck\n\n5. I went to the park yesterday. There were many relatives _____ games in it.\n  A. is playing\n  B. was playing\n  C. playing\n  D. play\n\n6. —Will you go to the cinema with me tomorrow?\n—Sorry, I _____ skating with Tom.\n  A. go\n  B. went\n  C. will go\n  D. have gone\n\n7. Look! The piece of meat is too big, let's cut _____.\n  A. them up\n  B. it up\n  C. up them\n  D. up it\n\n8. —It's time for the weather report. Could I _____ the TV, Dad?\n—Go ahead, please. I also want to know about the weather for tomorrow.\n  A. turn off\n  B. turn on\n  C. turn down\n  D. turn back\n\n9. —Can I help you?\n—I'd like _____ for my twin daughters.\n  A. two pair of shoes\n  B. two pairs of shoe\n  C. two pair of shoe\n  D. two pairs of shoes\n\n10. I think _____ is important to eat a balanced diet to stay healthy.\n  A. this\n  B. that\n  C. he\n  D. it\n\n## II. 完形填空\n(每小题1.5分，共15分。)\n\nYu Mei wants to eat dumplings. So she goes to a house of dumplings __1__ her mother. There are many kinds of __2__ in the restaurant. So she is very __3__. She sees many nice dumpling pictures on the wall. She looks at the menu. There are two __4__ bowls of dumplings. She is hungry (饿的). So she'd like a __5__ bowl. And she'd like the use __6__ onions. She wants her mother to __7__ it for her. When she __8__ some drinks, she also asks her mother to buy some. Her mother buys salad, orange juice __9__ green tea. __10__ are they? Only 4.5 dollars.\n\n1.  A. with\n    B. and\n    C. or\n\n2.  A. things\n    B. dumplings\n    C. drinks\n\n3.  A. scry\n    B. happy\n    C. good\n\n4.  A. big\n    B. kinds\n    C. sizes\n\n5.  A. great\n    B. small\n    C. large\n\n6.  A. for\n    B. with\n    C. at\n\n7.  A. buy\n    B. eat\n    C. take\n\n8.  A. looks\n    B. watches\n    C. sees\n\n9.  A. also\n    B. with\n    C. and\n\n10. A. How much\n    B. How many\n    C. What\n\n## III. 阅读理解\n(共20分。)\n\n**A. 阅读下面短文, 根据短文内容判断正(T)误(F)。(每小题2分，共10分)**\n\nAn elephant and a monkey are good friends. They are both proud (骄傲的). People always say, \"Look, how big and strong the elephant is!\" The monkey is proud because he is smart. He always asks others, \"Can you climb a tree?\"\nThere is a river near them, and a tall banana tree is on the other bank (河岸) of the river. They want to cross the river to get some bananas. The elephant can cross the river, but he cannot get the bananas because the tree is too tall. The monkey cannot cross the river because the water runs too fast.\nBoth of them cannot get the bananas.\n\"Come on, I can carry(背) you there,\" the elephant says. When they arrive there, the monkey says, \"Let me climb up.\"\nNow both of them get the bananas. They are eating the bananas. And they know they must help each other.\n\n1. The elephant is big and strong, and the monkey is smart.\n\n2. They want to cross the river because they want to see who is strong.\n\n3. The tree is too tall, so the monkey can't get the bananas.\n\n4. At last, the elephant carries the monkey and the monkey climbs the tree to get the bananas.\n\n5. From the story we know that it's important to help each other.\n\n**B. 阅读下面短文, 根据短文内容选择正确答案。(每小题2分，共10分)**\n\n**House of Hamburgers**\nAt the House of Hamburgers we have two great new specials. Special 1 has strawberry and chicken, and is only $3. Special 2 has cabbage and mutton. The prices of the small, medium and large ones are $4, $6 and $7.\nTel: 573-9603\n\n**Dessert (甜品) House**\nWe have many kinds of ice cream. We also have orange juice and green tea. An apple and pear ice cream is $3. A banana and orange one is $4. A glass of orange juice is $4 and a glass of green tea is $5.\nTel: 895-2598\n\n6. Linda has four dollars. Can she buy a medium strawberry and chicken hamburger?\n  A. Yes, she can.\n  B. No, she can't.\n  C. I don't know.\n\n7. If you want to have orange juice, you can _____.\n  A. call 573-9603\n  B. go to Dessert House\n  C. go to House of Hamburgers\n\n8. Larry buys a large cabbage and mutton hamburger and an apple and pear ice cream. He will spend _____ on them.\n  A. $ 10\n  B. $ 11\n  C. $ 12\n\n9. If you have five dollars, you can buy _____.\n  A. two small strawberry and chicken hamburgers\n  B. a glass of green tea\n  C. a medium cabbage and mutton hamburger\n\n10. Dessert House's ice cream may have the same _____.\n  A. kind\n  B. price\n  C. size\n\n## IV. 补全对话\n(一空一词。每小题1分，共10分。)\n\nA: Welcome to our restaurant. May I take your order?\nB: Thanks. But I'm waiting (等待) for my __1__. I'd like to order the food __2__. \n(10 minutes later)\nB: Excuse me. Can you help me? I want to __3__ some food.\nA: OK, Sir. __4__ your daughter here now?\nB: No. She __5__ me and says she has some important things to do, so she can't come.\nA: Well. What would you like to order?\nB: I'm not sure __6__. Do you have any __7__?\nA: Sure. You can try our beef and tomato soup. It's very delicious, and it is on __8__ today for only 8 yuan.\nB: Good. I'd like one. And I would also like a bowl of noodles.\nA: What size would you like?\nB: __9__, please. I'm not hungry at all.\nA: And anything to __10__?\nB: A glass of green tea, please.\nA: OK. Just wait a moment, please.\nB: Thanks.\n\n## V. 阅读下面短文, 根据短文内容, 从方框中选择正确的句子补全短文。\n(每小题1分，共5分。)\n\n**Options:**\nA. We should also eat some meat to be healthy.\nB. Sports can also keep you healthy.\nC. It's not good for you.\nD. That means if we eat more fruit, we can keep healthy.\nE. Food is very important for you to keep healthy.\n\n1. Everybody wants to be healthy. _____\n\n2. There are many healthy foods. You can have more bananas, apples, oranges and tomatoes. _____\n\n3. Remember there is a saying, \"An apple a day keeps the doctor away.\" _____\n\n4. But don't eat too much chocolate(巧克力). _____\n\n5. Only healthy food can make you strong and happy.\n_____. Get up early and do some sports every day. Don't be lazy! You will be healthy and happy.\n\n## VI. 阅读下面短文, 从方框中选择合适的词, 并用其正确形式填空, 每词限用一次。\n(每小题1分，共10分。)\n\n**Word Box:** anything, angry, last, be, drive, buy, teach, happy, don't, one, begin, have\n\nTom is a school boy, he likes playing with his classmates in school, but he doesn't like having __1__ at home. __2__ day at 10:00 a.m., his art teacher __3__ him an art lesson. Everyone __4__ to draw pictures, but Tom __5__. When the bell rings, Tom hands in (上交) his picture. The __6__ teacher has a look at it and he says, \"Tom, can you give me a picture with __7__, Tom?\" \"I'm sorry, sir. I draw a cat and a fish on my __8__.\" \"Then where __9__ the fish and the cat?\" asks the teacher again. \"I draw a fish __10__. When I finish drawing the cat, it eats the fish. When I give it to you, the cat runs away,\" says Tom.","proofread_notes":"1. 删除了卷面中的商业推广信息，如“宏剑超培-视频讲解”。\n2. 统一了全卷的题号、标点和格式，使其规范整洁。\n3. 调整了部分大题的结构以符合出版规范：\n   - **阅读理解 (III)**：将短文材料从独立的非问题条目移至该篇首个小题的 `context_note` 中，后续小题使用简介式 `context_note`。\n   - **补全对话 (IV)** 和 **选词填空 (VI)**：为保证阅读连贯性，将完整的对话/短文移至 `section_instruction`，各小题 `stem` 留空。\n4. **完形填空 (II)** 第3题A选项“scry”在上下文中不合逻辑，可能为原卷印刷错误，在此按卷面保留。\n5. **选词填空 (VI)** 第8题的设问与词汇框中的“drive”一词存在明显矛盾，可能为原卷错误，在此按卷面保留。\n6. 删除了原JSON中部分字段（如 `answer_area_hint`）里包含的答案或与作答无关的提示信息。\n7. 重新生成了 `content_markdown`，确保其内容与结构化的题目数据完全一致。","set_number":22,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_22\\page_038.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_wor   const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",
    "choice",
    "cloze",
    "reading",
    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^[a-zA-Z]?__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");

        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};
    const seg = (chunk) =>
      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!String(stem || "").trim()) {
      return opt.placeholderParen ? "<p class='stem'>（ ）</p>" : "<p class='stem'></p>";
    }
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));

  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));

    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));

  function sectionCardQuestionCount(rows) {
    if (!rows || !rows.length) return 0;
    const eff = sectionRowsRenderKind(rows);
    if (isClozeLikeQuizType(eff)) return visibleClozeQuizRows(rows).length;

  /** 全卷连续题号区间（与首页卡片「共 n 道」计数规则一致）；供无 range_text 时使用 */
  function sectionGlobalQuestionRangeLabel(si) {
    let start = 0;
    for (let i = 0; i < si; i++) {
      start += sectionCardQuestionCount(state.bySection["sec:" + i] || []);
    }
    const rows = state.bySection["sec:" + si] || [];
    const cnt = sectionCardQuestionCount(rows);
    if (!cnt) return "";
    const lo = start + 1;
    const hi = start + cnt;
    return lo === hi ? "第 " + lo + " 题" : "第 " + lo + "–" + hi + " 题";
  }

  /** 左侧已有文章的完形/语法填空小题：仅展示纵向 A–D(或含 E…)，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || !isClozeLikeQuizType(row.type)) return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const optLetters = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim());
    if (optLetters.length) return { letters: optLetters, opts: raw };
    if (isClozeLikeQuizType(typ)) {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    /**
     * 阅读 JSON 常把「判断正误」标成 fill_blank + 空 options；大题标题含「阅读」但 section_instruction 未必含「判断」。
     * 有 teaching 答案 T/F，或 context_note 含判断/See Passage 指引时，按客观 T/F 渲染单选，勿用文本框。
     */
    const cnRd = String(it.context_note || "");
    const caRd = String((it.teaching && it.teaching.correct_answer) || "").trim().toUpperCase();
    const tfByTeaching = caRd === "T" || caRd === "F";
    const tfByReadingNote =
      /判断|正误|True\s*\(\s*T|错误的写|正确的写|写\s*["""']?[TFtf]/i.test(cnRd) ||
      /^See\s+Passage\s*[（(]/i.test(cnRd.trim());
    if (
      typ === "fill_blank" &&
      /阅读/.test(String(row.section_title || "")) &&
      stem &&
      !/_{3,}/.test(stem) &&
      (tfByTeaching || tfByReadingNote)
    ) {
      return { letters: ["T", "F"], opts: { T: "T", F: "F" } };
    }
    return { letters: [], opts: raw };
  }
