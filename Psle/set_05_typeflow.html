<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .exam-item-cloze.exam-cloze-dialogue-gap {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第05套","exam_meta":{"full_score_text":"90分","time_text":"60分钟","type_card_order":"paper"},"sections":[{"section_title":"一、用适当的人称代词或物主代词填空。(共10分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"Your football clothes are on the desk. Please put _____ (they/them/their/theirs) away.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"them","explanation_md":"本题考查人称代词的宾格形式。句意为“你的足球服在桌子上。请把它们收好。”\n1.  横线前的动词词组是 `put ... away`（把……收好），需要一个宾语来作 `put` 的对象。\n2.  这个宾语指代的是前文提到的 `Your football clothes`（你的足球服）。\n3.  `clothes` 是复数名词，所以需要用复数形式的代词。\n4.  在动词后作宾语，应使用人称代词的宾格形式。\n5.  综合来看，指代复数名词且作宾语，应该用 `them`。","knowledge_expansion_md":"### 人称代词的主格与宾格\n\n人称代词有不同的“格”，取决于其在句子中扮演的角色：\n\n- **主格 (Subjective Case)**：作句子的主语，是动作的发出者。通常位于句首或动词之前。\n  - 如：`I`, `you`, `he`, `she`, `it`, `we`, `they`\n  - 例：`They` are playing football. (他们正在踢足球。)\n\n- **宾格 (Objective Case)**：作动词或介词的宾语，是动作的承受者或对象。通常位于动词或介词之后。\n  - 如：`me`, `you`, `him`, `her`, `it`, `us`, `them`\n  - 例：I saw `them` in the park. (我在公园里看到了他们。)\n  - 例：Please give the book to `me`. (请把书给我。)\n\n**易错点**：当动词词组（如 `put away`, `pick up`, `turn on`）的宾语是代词时，该代词必须放在动词和副词之间。例如，只能说 `put them away`，而不能说 `put away them`。","socratic_tracks":[{"title":"语法功能：宾语","steps":[{"question":"在句子 `Please put _____ away` 中，横线部分在句子中充当什么成分？","hint":"想一想，`put` (放) 这个动作的对象是什么？","takeaway":"横线处需要填入动词 `put` 的宾语，即动作的承受者。"},{"question":"当人称代词作宾语时，我们应该使用它的哪种形式？主格还是宾格？","hint":"回想一下“我爱他”是 `I love he` 还是 `I love him`？","takeaway":"人称代词作宾语时，必须使用宾格形式。"}]},{"title":"代词指代","steps":[{"question":"横线上的代词，是指代前面句子中的哪个名词？","hint":"前半句说“你的足球服在桌子上”，后半句说“请把____收好”。","takeaway":"这个代词指代的是 `Your football clothes`（你的足球服）。"},{"question":"`football clothes` 是单数还是复数？","hint":"`clothes` 这个词本身就是复数形式。","takeaway":"指代复数名词 `clothes`，需要使用复数代词。"}]},{"title":"选项辨析","steps":[{"question":"我们来看看 `they`, `them`, `their`, `theirs` 这四个词。哪个是复数宾格代词？","hint":"`they` 是主格（他们），`their` 是形容词性物主代词（他们的），`theirs` 是名词性物主代词（他们的东西）。","takeaway":"`them` 是指代复数的宾格形式。"},{"question":"综合以上分析，为什么最终选择 `them`？","hint":"我们需要一个代词，它既是宾格，又能指代复数名词 `football clothes`。","takeaway":"只有 `them` 同时满足“宾格”和“复数”两个条件，因此是唯一正确的答案。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"(We/Us/Our/Ours) _____ English teacher is Mrs Green. We all like _____ (she/her/hers).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Our|her","explanation_md":"本题考查物主代词和人称代词的用法。\n1.  **第一个空**：`_____ English teacher`。横线后是名词 `English teacher`，需要一个词来修饰它，表示“我们的”。因此，应使用形容词性物主代词 `Our`。\n2.  **第二个空**：`We all like _____`。横线在动词 `like`（喜欢）之后，作其宾语。这个宾语指代的是 `Mrs Green`（格林女士），是一位女性。因此，应使用指代女性的宾格人称代词 `her`。","knowledge_expansion_md":"### 形容词性物主代词 vs. 名词性物主代词\n\n- **形容词性物主代词**：`my`, `your`, `his`, `her`, `its`, `our`, `their`。\n  - **功能**：像形容词一样，必须放在名词前，修饰名词，表示所属关系。\n  - **公式**：形容词性物主代词 + 名词。\n  - **例**：This is `our` classroom. (这是我们的教室。)\n\n- **名词性物主代词**：`mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n  - **功能**：像名词一样，可单独使用，不能再跟名词。\n  - **公式**：名词性物主代词 = 形容词性物主代词 + 名词。\n  - **例**：This classroom is `ours`. (这间教室是我们的。) `ours` = `our classroom`。\n\n**特别注意**：`her` 既可以作宾格（`I like her.`），也可以作形容词性物主代词（`This is her book.`），需根据语境判断。","socratic_tracks":[{"title":"第一空：物主代词","steps":[{"question":"第一个空后面跟着一个名词 `English teacher`，我们需要一个什么词性的词来修饰它，表示“我们的”？","hint":"比如“我的书”是 `my book`，`my` 是什么类型的词？","takeaway":"在名词前表示所属关系，需要用形容词性物主代词。"},{"question":"在 `We`, `Us`, `Our`, `Ours` 中，哪一个是形容词性物主代词？","hint":"`We` 是主格，`Us` 是宾格，`Ours` 是名词性物主代词。","takeaway":"`Our` 是形容词性物主代词，用来修饰名词。"}]},{"title":"第二空：人称代词宾格","steps":[{"question":"第二个空位于动词 `like` 的后面，它在句子中充当什么成分？","hint":"“我们都喜欢……” 喜欢的是谁？被喜欢的对象是句子的什么成分？","takeaway":"在动词 `like` 后面，需要一个宾语。"},{"question":"这个宾语指的是谁？是男性还是女性？","hint":"句子前面提到了 `Mrs Green`。","takeaway":"宾语指代的是 `Mrs Green`，是一位女性。"},{"question":"在 `she`, `her`, `hers` 中，哪一个是表示女性的宾格代词？","hint":"`she` 是主格（她），`hers` 是名词性物主代词（她的东西）。","takeaway":"`her` 是指代女性的宾格形式。"}]},{"title":"代词家族辨析","steps":[{"question":"为什么第一空不能填 `Ours`？`Ours English teacher` 对吗？","hint":"`Ours` 的意思是“我们的东西”，它本身相当于一个名词，后面还能再跟名词吗？","takeaway":"`Ours` 是名词性物主代词，不能再修饰名词，因此 `Ours English teacher` 是错误的。"},{"question":"为什么第二空不能填 `she`？`We all like she.` 对吗？","hint":"`she` 是主格，通常用在句首作主语。","takeaway":"动词 `like` 后面必须跟宾格代词，不能用主格 `she`。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"(I/Me/My/Mine) _____ can't get my kite. Could you help _____ (I/me/my/mine)?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I|me","explanation_md":"本题考查第一人称单数代词 `I` 和 `me` 的区别。\n1.  **第一个空**：`_____ can't get my kite.`。横线位于句首，是谓语动词 `can't get` 的主语，即动作的发出者。因此，应使用主格人称代词 `I`。\n2.  **第二个空**：`Could you help _____?`。横线位于动词 `help`（帮助）之后，作其宾语，即动作的承受者。因此，应使用宾格人称代词 `me`。","knowledge_expansion_md":"### 第一人称单数代词用法辨析\n\n`I`, `me`, `my`, `mine` 是初学者非常容易混淆的一组词，它们都和“我”有关，但用法完全不同。\n\n- **`I` (主格)**：只能作主语。例：`I` am a teacher.\n- **`me` (宾格)**：只能作宾语（动词宾语或介词宾语）。例：She helps `me`. / Talk to `me`.\n- **`my` (形容词性物主代词)**：修饰名词，表示“我的”。例：This is `my` pen.\n- **`mine` (名词性物主代词)**：相当于 `my + 名词`，单独使用。例：The pen is `mine`.\n\n**快速判断技巧**：\n- 动词前面找主语，用 `I`。\n- 动词、介词（如 `to`, `for`, `with`）后面找宾语，用 `me`。\n- 名词前面找“主人”，用 `my`。\n- 单独使用表示“我的东西”，用 `mine`。","socratic_tracks":[{"title":"第一空：主格 I","steps":[{"question":"在第一句话 `_____ can't get my kite` 中，是谁发出了 `can't get` 这个动作？","hint":"这个句子缺少一个主语。","takeaway":"横线处需要一个主语来表示动作的发出者。"},{"question":"当“我”在句子中作主语时，应该用 `I` 还是 `me`？","hint":"我们说“我是个学生”是 `I am a student` 还是 `Me am a student`？","takeaway":"作主语时，必须使用主格 `I`。"}]},{"title":"第二空：宾格 me","steps":[{"question":"在第二句话 `Could you help _____?` 中，“你”帮助的对象是谁？","hint":"这个句子是在请求别人帮助“我”。","takeaway":"横线处需要一个宾语，表示动作 `help` 的承受者。"},{"question":"当“我”在句子中作宾语时，应该用 `I` 还是 `me`？","hint":"我们说“请帮帮我”是 `Please help I` 还是 `Please help me`？","takeaway":"作宾语时，必须使用宾格 `me`。"}]},{"title":"排除其他选项","steps":[{"question":"为什么第一个空不能填 `My`？`My can't get my kite.` 听起来对吗？","hint":"`My` 的意思是“我的”，后面通常要跟一个名词，比如 `my name`。","takeaway":"`My` 是形容词性物主代词，不能独立作主语。"},{"question":"为什么第二个空不能填 `mine`？`Could you help mine?` 是什么意思？","hint":"`mine` 的意思是“我的东西”。这句话是在请求帮助“我”这个人，还是“我的东西”？","takeaway":"`mine` 指代物品，而这里需要指代人，所以不能用 `mine`。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"Tom can't get down from the tree. Can you help _____ (he/him/his)?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"him","explanation_md":"本题考查第三人称单数男性代词的宾格形式。\n1.  句意为“汤姆下不了树。你能帮助他吗？”\n2.  在问句 `Can you help _____?` 中，横线位于动词 `help` 之后，需要一个宾语。\n3.  这个宾语指代的是前文提到的 `Tom`。\n4.  `Tom` 是第三人称、单数、男性。\n5.  指代男性的宾格代词是 `him`。\n6.  选项中 `he` 是主格，`his` 是物主代词，都不符合要求。","knowledge_expansion_md":"### 第三人称单数男性代词 (`he`, `him`, `his`)\n\n这组词都用来指代男性单数，但功能各不相同：\n\n- **`he` (主格)**: 作主语。\n  - 例: `He` is a doctor. (他是一名医生。)\n\n- **`him` (宾格)**: 作动词或介词的宾语。\n  - 例: I told `him` the truth. (我告诉了他真相。) (动词宾语)\n  - 例: The gift is for `him`. (礼物是给他的。) (介词宾语)\n\n- **`his` (物主代词)**: 有两种形式。\n  - **形容词性**: `his` + 名词，表示“他的”。\n    - 例: That is `his` car. (那是他的车。)\n  - **名词性**: 单独使用，表示“他的东西”。\n    - 例: The car is `his`. (这辆车是他的。)\n\n**易错点**：`his` 的两种物主代词形式拼写完全相同，需要根据其在句中是否修饰名词来判断其具体身份。","socratic_tracks":[{"title":"语法功能：动词宾语","steps":[{"question":"在句子 `Can you help _____?` 中，横线处需要填入一个什么语法成分？","hint":"它跟在动词 `help` 的后面，是 `help` 这个动作的承受者。","takeaway":"横线处需要填入动词 `help` 的宾语。"},{"question":"当人称代词作宾语时，应该用主格、宾格还是物主代词？","hint":"回想一下，我们说“我认识他”是 `I know he` 还是 `I know him`？","takeaway":"作动词宾语时，必须使用人称代词的宾格形式。"}]},{"title":"代词指代关系","steps":[{"question":"这个句子里的代词指的是谁？","hint":"请阅读前一句话：`Tom can't get down from the tree.`","takeaway":"这个代词指代的是 `Tom`。"},{"question":"`Tom` 对应的人称代词应该是第几人称？单数还是复数？男性还是女性？","hint":"`Tom` 是一个男孩的名字，是除了你我之外的第三方。","takeaway":"`Tom` 对应的是第三人称、单数、男性代词。"}]},{"title":"选项辨析","steps":[{"question":"我们来看选项 `he`, `him`, `his`。哪一个是表示男性的宾格代词？","hint":"`he` 是主格，用在句首；`his` 表示“他的”，表示所属关系。","takeaway":"`him` 是指代男性的宾格形式。"},{"question":"为什么不能说 `Can you help he?` 或者 `Can you help his?`","hint":"思考 `he` 和 `his` 的基本用法。`he` 作主语，`his` 表示所有物。","takeaway":"动词 `help` 后面不能跟主格 `he`，也不能跟表示所属关系的 `his`，只能跟宾格 `him`。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"Her kite is broken. Can _____ (you/your/yours) mend it?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"you","explanation_md":"本题考查人称代词的用法。句子 “Can _____ mend it?” 是一个疑问句，横线处需要一个主语来执行 “mend”（修理）这个动作。根据括号内提供的选项 (you/your/yours)，只有 “you” 是人称代词主格，可以作句子的主语。选项 “your” 是形容词性物主代词，后面必须跟名词。选项 “yours” 是名词性物主代词，不能直接跟动词。因此，正确答案是 “you”，句意为“你能修好它吗？”。","knowledge_expansion_md":"### 人称代词与物主代词辨析\n\n1.  **人称代词**：分为主格和宾格。\n    *   **主格** (Nominative Case)：用作主语。如：I, you, he, she, it, we, they。\n        *   例：`I` like English. `She` is my friend.\n    *   **宾格** (Objective Case)：用作动词或介词的宾语。如：me, you, him, her, it, us, them。\n        *   例：Please help `me`. I will give the book to `him`.\n\n2.  **物主代词**：分为形容词性和名词性。\n    *   **形容词性物主代词** (Possessive Adjectives)：后面必须跟名词，起修饰作用。如：my, your, his, her, its, our, their。\n        *   例：This is `my` book.\n    *   **名词性物主代词** (Possessive Pronouns)：可单独使用，相当于“形容词性物主代词 + 名词”。如：mine, yours, his, hers, its, ours, theirs。\n        *   例：This book is `mine`. (= my book)\n\n**易错点**：在选择代词时，务必先分析其在句子中充当的成分（主语、宾语、定语等），再根据其功能选择正确形式的代词。","socratic_tracks":[{"title":"句子成分分析","steps":[{"question":"在 “Can _____ mend it?” 这个问句中，横线处需要填一个什么功能的词？是主语、宾语还是定语？","hint":"想一想是谁在做 “mend” (修理) 这个动作。执行动作的通常是主语。","takeaway":"这个句子缺少执行动作 “mend” 的主语。"},{"question":"那么，在给出的选项 (you/your/yours) 中，哪个词可以作主语呢？","hint":"'your' 后面通常跟名词，'yours' 本身相当于 'your + 名词'。只有 'you' 可以直接作主语。","takeaway":"只有人称代词主格 'you' 可以在这里作主语。"}]},{"title":"词性辨析","steps":[{"question":"'you', 'your', 'yours' 这三个词的词性分别是什么？","hint":"'you' 是人称代词，'your' 是...？'yours' 是...？","takeaway":"'you' 是人称代词，'your' 是形容词性物主代词，'yours' 是名词性物主代词。"},{"question":"动词 'mend' 前面应该放哪种词性的词来作主语？","hint":"通常是名词或代词来充当句子的主语。","takeaway":"动词前通常需要名词或代词作主语。"},{"question":"结合词性和句子结构，为什么不能选 'your' 或 'yours'？","hint":"'your' 后面需要跟名词，但这里没有；'yours' 不能跟动词原形。","takeaway":"'your' 缺少名词，'yours' 结构不符，所以只能选 'you'。"}]},{"title":"语境理解","steps":[{"question":"前一句 “Her kite is broken.” 告诉我们什么信息？","hint":"她的风筝怎么了？这暗示了什么？","takeaway":"她的风筝坏了，这为后面的求助作了铺垫。"},{"question":"那么后半句 “Can _____ mend it?” 是在向谁请求帮助？","hint":"这是一个直接的对话，是在对听话人说话。","takeaway":"这句话是在直接向听话人“你”发出请求。"},{"question":"在英语中，直接指代听话人“你”的代词是哪个？","hint":"在 'you', 'your', 'yours' 中，哪个词直接指代“你”这个人？","takeaway":"'you' 就是指代听话人“你”的代词。"}]}]}},{"number":"6","item_type":"fill_blank","context_note":"","stem":"We can't find our kites. Can you help _____ (we/us/our/ours)?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"us","explanation_md":"本题考查人称代词宾格的用法。句子结构是 “Can you help _____?”，其中 “help” 是一个及物动词，后面需要跟一个宾语，表示“帮助”的对象。根据前文 “We can't find our kites.”（我们找不到我们的风筝了），可知请求帮助的对象是“我们”。在选项 (we/us/our/ours) 中，“we” 是主格，作主语；“us” 是宾格，作宾语；“our” 是形容词性物主代词；“ours” 是名词性物主代词。因此，只有 “us” 能作动词 “help” 的宾语，表示“帮助我们”。","knowledge_expansion_md":"### 人称代词主格与宾格的用法\n\n在英语中，人称代词有主格和宾格之分，它们在句子中扮演不同的角色：\n\n1.  **主格 (Nominative Case)**: 用作句子的主语，是动作的发出者。主格代词通常位于句首或动词之前。\n    *   `I`, `you`, `he`, `she`, `it`, `we`, `they`\n    *   例：`We` are students. (我们是学生。)\n\n2.  **宾格 (Objective Case)**: 用作动词或介词的宾语，是动作的承受者或对象。\n    *   `me`, `you`, `him`, `her`, `it`, `us`, `them`\n    *   **作动词宾语**：紧跟在及物动词之后。例：She loves `him`. (她爱他。)\n    *   **作介词宾语**：紧跟在介词（如 to, for, with, about）之后。例：Please give the book to `me`. (请把书给我。)\n\n**解题技巧**：判断代词在句中的位置。如果位于动词或介词之后，通常应使用宾格形式。","socratic_tracks":[{"title":"句子成分分析","steps":[{"question":"在 “Can you help _____?” 这个句子中，横线处的词充当什么成分？","hint":"动词 'help' (帮助) 的对象是谁？动作的对象就是宾语。","takeaway":"横线处需要一个宾语，来表示被帮助的对象。"},{"question":"在给出的选项 (we/us/our/ours) 中，哪个词可以作宾语？","hint":"想一想人称代词的主格和宾格形式。哪个是放在动词后面的？","takeaway":"只有人称代词宾格 'us' 可以在动词后面作宾语。"}]},{"title":"主格与宾格辨析","steps":[{"question":"'we' 和 'us' 有什么区别？请分别用它们造一个简单的句子。","hint":"一个通常放在句首作主语，一个通常放在动词或介词后面作宾语。","takeaway":"'we' 是主格，作主语，如 “We are happy.”；'us' 是宾格，作宾语，如 “She told us a story.”。"},{"question":"那么在本题中，'help' 是一个动词，它后面应该跟主格 'we' 还是宾格 'us'？","hint":"参考你刚才造的句子 “She told us a story.”，'tell' 和 'help' 都是动词。","takeaway":"及物动词后面应该跟人称代词的宾格形式。"}]},{"title":"语境逻辑推理","steps":[{"question":"句子的第一部分 “We can't find our kites” 告诉我们谁遇到了困难？","hint":"注意句子的主语是 'We' (我们)。","takeaway":"是“我们”遇到了麻烦，找不到风筝了。"},{"question":"那么第二部分 “Can you help _____?” 是在请求“你”去帮助谁？","hint":"根据第一句话，需要帮助的应该是遇到麻烦的“我们”。","takeaway":"请求帮助的对象是“我们”。"},{"question":"表示宾语“我们”的正确形式是哪个词？","hint":"'we' 的宾格形式是什么？","takeaway":"表示宾语“我们”的词是 'us'。"}]}]}},{"number":"7","item_type":"fill_blank","context_note":"","stem":"Those are _____ (he/him/his) planes. The white ones are _____ (I/me/my/mine).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"his|mine","explanation_md":"本题考查形容词性物主代词和名词性物主代词的区别。\n\n第一个空在名词 “planes” 前面，需要一个词来修饰 “planes”，说明是谁的飞机。这需要一个形容词性物主代词。在 (he/him/his) 中，“his” 可以作形容词性物主代词，表示“他的”。\n\n第二个空在系动词 “are” 后面，且句子到此结束，后面没有再跟名词。这个空需要一个能独立作表语的词，表示“我的（飞机）”。这需要一个名词性物主代词。在 (I/me/my/mine) 中，“mine” 是名词性物主代词，相当于 “my planes”。\n\n因此，完整的句子是：“Those are his planes. The white ones are mine.”（那些是他的飞机。白色的那些是我的。）","knowledge_expansion_md":"### 形容词性物主代词 vs. 名词性物主代词\n\n这是英语中非常重要且容易混淆的一对概念。它们的根本区别在于后面是否需要跟名词。\n\n1.  **形容词性物主代词 (Possessive Adjectives)**\n    *   形式: `my`, `your`, `his`, `her`, `its`, `our`, `their`\n    *   功能: 如同形容词，必须放在名词前作定语，表示所属关系。\n    *   公式: **形容词性物主代词 + 名词**\n    *   例: Is this `your pen`? (这是你的钢笔吗？)\n\n2.  **名词性物主代词 (Possessive Pronouns)**\n    *   形式: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`\n    *   功能: 如同名词，可独立在句子中作主语、宾语或表语。\n    *   公式: **名词性物主代词 = 形容词性物主代词 + 名词**\n    *   例: This pen is `mine`. (这支钢笔是我的。) `mine` = `my pen`\n\n**特别注意**: `his` 和 `its` 的形容词性与名词性形式完全相同。判断方法是看它后面是否跟了名词。例如：\n*   This is `his` book. (这是他的书。) - 形容词性\n*   This book is `his`. (这本书是他的。) - 名词性","socratic_tracks":[{"title":"第一空：修饰名词","steps":[{"question":"看第一个空，它后面紧跟着一个什么词？","hint":"'planes' 是一个名词，意思是“飞机”。","takeaway":"第一个空后面是一个名词 'planes'。"},{"question":"当我们需要一个词放在名词前面，表示“某人的”东西时，应该用哪一类物主代词？","hint":"是像形容词一样修饰名词的，还是像名词一样独立使用的？","takeaway":"修饰名词时，要用形容词性物主代词。"},{"question":"在 (he/him/his) 中，哪个是表示“他的”的形容词性物主代词？","hint":"'he' 是主格，'him' 是宾格。","takeaway":"'his' 可以作形容词性物主代词，构成 'his planes'（他的飞机）。"}]},{"title":"第二空：独立使用","steps":[{"question":"看第二个空，它位于句子的末尾，后面还有名词吗？","hint":"看看句号前面的结构 “are _____.”","takeaway":"第二个空后面没有名词，它需要独立充当句子成分。"},{"question":"当一个物主代词需要独立使用，本身就代表“某人的东西”时，我们应该用哪一类物主代词？","hint":"哪一类物主代词相当于 “my + 名词” 或 “your + 名词”？","takeaway":"应该使用名词性物主代词。"},{"question":"在 (I/me/my/mine) 中，哪个是表示“我的（东西）”的名词性物主代词？","hint":"'my' 后面必须跟名词，比如 'my planes'。","takeaway":"'mine' 是名词性物主代词，意思是“我的东西”，在这里指“我的飞机”。"}]},{"title":"结构对比与替换","steps":[{"question":"“那些是他的飞机”英文是 “Those are his planes”。那么“白色的那些是我的飞机”应该怎么说？","hint":"模仿前面的结构，用 'my' 替换 'his'。","takeaway":"可以表达为 “The white ones are my planes.”"},{"question":"在英语中，为了避免重复使用名词 'planes'，我们可以用一个词来代替 'my planes'。这个词是哪个？","hint":"名词性物主代词的作用就是避免重复。","takeaway":"名词性物主代词 'mine' 就等于 'my planes'。"},{"question":"所以，原句 “The white ones are _____.” 为了简洁表达，横线处应该填什么？","hint":"用那个可以代替 'my planes' 的词。","takeaway":"横线处应填入名词性物主代词 'mine'。"}]}]}}]},{"section_title":"二、单项选择。(共20分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"Amy always finishes her homework on time. She _____ leaves it for tomorrow.","options":{"A":"always","B":"usually","C":"never","D":"sometimes"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查频度副词的运用和上下文的逻辑关系。第一句话 “Amy always finishes her homework on time.” 意为“艾米总是按时完成作业”。关键词 “always”（总是）表示这个行为的发生频率是100%，说明她每一次都按时完成。第二句话 “She _____ leaves it for tomorrow.”（她____把作业留到明天。）是对此的进一步说明。根据逻辑，既然她“总是”按时完成，那么她就“从不”会把作业留到明天。选项中，A “always”（总是）、B “usually”（通常）和 D “sometimes”（有时）都与前文的逻辑相悖。只有 C “never”（从不）符合逻辑，表示0%的频率，是唯一正确的答案。","knowledge_expansion_md":"### 频度副词 (Adverbs of Frequency)\n\n频度副词用于表示动作发生的频率高低。理解它们的精确含义和在句中的位置是关键。\n\n**1. 常见频度副词（按频率从高到低）**\n*   `always` (总是, 100%)\n*   `usually` (通常, 约90%)\n*   `often` / `frequently` (经常, 约70%)\n*   `sometimes` (有时, 约50%)\n*   `occasionally` (偶尔, 约30%)\n*   `seldom` / `rarely` (很少, 约10%)\n*   `hardly ever` (几乎从不, 约5%)\n*   `never` (从不, 0%)\n\n**2. 在句中的位置**\n*   通常位于**行为动词之前**：`I often play football.`\n*   位于**be动词、助动词或情态动词之后**：`She is always happy.` / `He has never been to China.` / `You should always try your best.`\n\n**3. 解题技巧**\n*   注意 `always` (100%) 和 `never` (0%) 这两个表示绝对频率的词。它们经常在逻辑推理题中作为关键线索出现。\n*   当两个描述是互斥行为时（如“按时完成” vs “拖到明天”），它们的频率副词也应该是对立的（如 `always` vs `never`）。","socratic_tracks":[{"title":"关键词与逻辑推理","steps":[{"question":"阅读第一句话，哪个词最关键，告诉了我们艾米完成作业的频率？","hint":"那个表示“总是”、“每一次都”的词是什么？","takeaway":"关键词是 'always' (总是)，表示100%的频率。"},{"question":"如果一个人“总是”按时完成作业，那么她“把作业留到明天”这件事发生的可能性有多大？","hint":"是每次都这样，还是有时这样，还是一次也不这样？","takeaway":"可能性是零，也就是她一次也不会把作业留到明天。"},{"question":"在选项中，哪个词表示“一次也不”、“从不”的意思？","hint":"A是总是，B是通常，C是从不，D是有时。","takeaway":"'never' 就是“从不”的意思，完全符合逻辑推断。"}]},{"title":"频度副词辨析","steps":[{"question":"你能把 'always', 'usually', 'sometimes', 'never' 这四个词按照发生的频率从高到低排个序吗？","hint":"想象一下一周七天，做某事的天数。七天都做是哪个词？一天都不做是哪个词？","takeaway":"频率排序是：always (总是) > usually (通常) > sometimes (有时) > never (从不)。"},{"question":"题目说艾米 “always” 按时完成作业。如果第二空填 “sometimes”，即“她有时会把作业留到明天”，这两句话放在一起矛盾吗？为什么？","hint":"“总是按时”和“有时拖延”能同时成立吗？","takeaway":"这两句话是矛盾的。因为如果她有时会拖延，就不能说她“总是”按时完成了。"},{"question":"既然 'sometimes' 不行，'usually' 和 'always' 肯定更不行。那么唯一不矛盾的选项是哪个？","hint":"排除法是做选择题的好方法。","takeaway":"只有 'never' 才符合“总是按时完成”这个前提条件，使得两句话逻辑通顺。"}]},{"title":"反义关系理解","steps":[{"question":"“按时完成作业”(finish homework on time) 和“把作业留到明天”(leave it for tomorrow) 这两个行为之间是什么关系？","hint":"做了前者，就意味着没有做后者。这是一种什么关系？","takeaway":"这两个行为是相互对立、相互排斥的，可以看作是反义行为。"},{"question":"既然两个行为是对立的，那么描述这两个行为的频率词之间也应该有特定关系。如果第一个行为的频率是 'always' (100%)，那么对立行为的频率应该是多少？","hint":"100% 的反面是什么？","takeaway":"对立行为的频率应该是 'never' (0%)。"},{"question":"所以，这道题本质上就是在寻找与 'always' 描述的行为相斥的行为所对应的频率副词。","hint":"在选项中找到表示“从不”的词。","takeaway":"在描述对立事件时，'never' 是 'always' 的逻辑反义词。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"Peter is busy all the time. He _____ has time to play badminton.","options":{"A":"always","B":"often","C":"usually","D":"seldom"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查频度副词的辨析与语境逻辑。第一句“Peter is busy all the time.”意为“彼得一直很忙”，这表明他几乎没有空闲时间。根据这个逻辑，第二句描述他打羽毛球的频率应该是非常低的。四个选项中，A. always (总是), B. often (经常), C. usually (通常) 都表示较高的频率，与句意矛盾。只有 D. seldom (很少，不常) 表示频率很低，符合“一直很忙”的语境。因此，正确答案是 D。","knowledge_expansion_md":"### 频度副词用法详解\n\n频度副词用来表示动作发生的频率高低，在句中的位置通常遵循“动前be后”的原则，即放在实义动词前，be动词、助动词或情态动词后。\n\n1.  **频率由高到低排序**: `always` (100%, 总是) > `usually` (约90%, 通常) > `often` (约70%, 经常) > `sometimes` (约50%, 有时) > `seldom`/`rarely` (约10%, 很少) > `hardly ever` (约5%, 几乎从不) > `never` (0%, 从不)。\n\n2.  **位置举例**:\n    *   He is **always** late. (be动词后)\n    *   She **usually** gets up at 7 a.m. (实义动词前)\n    *   I can **never** understand him. (情态动词后)\n\n3.  **易错点**: `seldom`, `hardly ever`, `never` 都是否定意义的副词，本身就带有否定含义，无需再与 `not` 连用。若将它们置于句首以示强调，句子需要部分倒装，即将助动词或be动词提到主语前。例如：**Seldom does** he have time to play badminton.","socratic_tracks":[{"title":"上下文逻辑推理","steps":[{"question":"“Peter is busy all the time”这句话告诉我们关于Peter时间安排的什么信息？","hint":"“all the time”是“一直，总是”的意思。如果一个人一直很忙，他的空闲时间会多还是少？","takeaway":"这句话说明Peter的空闲时间非常少。"},{"question":"既然Peter的空闲时间很少，那么他打羽毛球的次数应该是多还是少？","hint":"时间少，自然做某件事的次数就少。","takeaway":"他打羽毛球的频率应该很低。"},{"question":"四个选项中，always, often, usually, seldom，哪一个词表示“很少，不常”？","hint":"可以回忆一下这些词的中文意思：总是、经常、通常、很少。","takeaway":"seldom表示“很少”，最符合句子的逻辑。"}]},{"title":"频度副词辨析","steps":[{"question":"你能把 always, often, usually, seldom 这四个词按照发生的频率从高到低排个序吗？","hint":"想象一下，做一件事100%是哪个词？几乎不做又是哪个词？","takeaway":"频率从高到低依次是：always > usually > often > seldom。"},{"question":"题干说Peter“一直很忙”，这对应的是高频率还是低频率的活动？","hint":"“一直”意味着这件事占据了他所有的时间。","takeaway":"“一直很忙”是最高频率的活动。"},{"question":"那么，他有时间打球的频率就应该是高还是低呢？哪个选项最合适？","hint":"一个人的总时间是固定的，忙碌占用的时间越多，空闲时间就越少。","takeaway":"他有时间打球的频率必然很低，所以应该选择表示低频率的 `seldom`。"}]},{"title":"词义与语境","steps":[{"question":"`seldom` 和 `never` 都有“很少”或“不”的意思，它们有什么区别？","hint":"`never` 的意思是“从不”，频率是0%。`seldom` 呢？","takeaway":"`seldom` 意思是“很少，不常”，表示频率极低，但不是完全没有；而 `never` 是“从不”，频率为零。"},{"question":"根据“Peter一直很忙”的语境，他是“从不”打球，还是“很少”打球更符合生活常理？","hint":"“一直忙”不一定等于“一次机会都没有”，可能只是机会非常少。","takeaway":"“很少有时间”比“从没有时间”在逻辑上更温和、更常见，因此 `seldom` 是最佳选择。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"I can remember that she left _____ a cold winter morning.","options":{"A":"in","B":"at","C":"on","D":"for"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查时间介词的用法。基本规则是：`in` 用于较长的时间（如年份、月份、季节），`at` 用于具体的时间点（如几点钟），`on` 用于具体的某一天或日期。本题的关键点在于，虽然泛指“在早上”用 `in the morning`，但当 `morning`, `afternoon`, `evening` 等词前面有形容词（如 `cold`, `sunny`）或具体的星期几来修饰，从而特指某一个特定的早上/下午/晚上时，介词就要用 `on`。题干中的“a cold winter morning”是一个被形容词 `cold` 修饰的特定早晨，因此应使用 `on`。","knowledge_expansion_md":"### 时间介词 `in`, `on`, `at` 的用法拓展\n\n1.  **基本用法回顾**:\n    *   `in`: 年、月、季节、世纪、泛指的早/中/晚。如：`in 2024`, `in July`, `in summer`, `in the 1990s`, `in the morning`。\n    *   `on`: 具体日期、星期几、特定节日。如：`on May 1st`, `on Monday`, `on Christmas Day`。\n    *   `at`: 具体时刻、时间点、短暂的节假日。如：`at 8:00`, `at noon`, `at night`, `at Christmas`。\n\n2.  **核心考点：`in` 变 `on` 的特殊情况**\n    当 `morning`, `afternoon`, `evening` 前面出现修饰词，使其从泛指变为特指时，介词由 `in` 变为 `on`。\n    *   `in the morning` (在早上) vs. `on a sunny morning` (在一个晴朗的早晨)\n    *   `in the afternoon` (在下午) vs. `on the afternoon of May 1st` (在5月1日的下午)\n    *   `in the evening` (在晚上) vs. `on Friday evening` (在周五晚上)\n\n3.  **`at night` vs. `in the night`**\n    *   `at night` 是固定搭配，泛指“在夜里”。\n    *   `in the night` 则特指“在某个特定的夜里”，通常有故事背景。例如：`I heard a strange noise in the night.` (我在那天夜里听到了一个奇怪的声音。)","socratic_tracks":[{"title":"时间介词基本用法","steps":[{"question":"我们通常怎么表达“在早上”？是用 `in the morning` 还是 `on the morning`？","hint":"这是一个非常基础和固定的搭配。","takeaway":"泛指“在早上”通常用 `in the morning`。"},{"question":"那我们什么时候会用介词 `on` 来表示时间呢？能举个例子吗？","hint":"想想星期、具体的日期，比如“在周一”或“在6月1日”。","takeaway":"`on` 通常用在具体的某一天或日期前，如 `on Monday` 或 `on June 1st`。"},{"question":"题干中的 “a cold winter morning” 是泛指所有的早晨，还是指一个特定的早晨？","hint":"形容词 `cold` 和不定冠词 `a` 使得这个早晨变得具体化了，就像一个特定的“日子”。","takeaway":"当早晨、下午等被形容词修饰，特指某一个时，介词要从 `in` 变为 `on`。"}]},{"title":"特殊情况辨析","steps":[{"question":"比较一下 “in the morning” 和 “on a cold morning” 这两个短语，它们在结构上有什么不同？","hint":"看看 “morning” 前面多了什么词，少了什么词？","takeaway":"后者在 “morning” 前面多了一个形容词 `cold`，并且冠词从 `the` 变成了 `a`。"},{"question":"这个多出来的形容词 `cold` 对整个短语的意思有什么影响？","hint":"它是不是让这个“早晨”变得更具体、更特别了？","takeaway":"形容词的加入使得这个早晨被特定化了，不再是泛指。"},{"question":"英语中，当时间段被这样特定化后，介词使用会有一个特殊规则。你知道是什么吗？","hint":"规则是从表示“一段时间”的 `in` 变为更侧重“某一天”的 `on`。","takeaway":"特指某一天的某个时间段，介词要用 `on`。"}]},{"title":"举一反三","steps":[{"question":"知道了 “on a cold winter morning” 的用法，那么“在一个下雨的下午”应该怎么说？","hint":"“下雨的”是 `rainy`，“下午”是 `afternoon`。","takeaway":"应该说 `on a rainy afternoon`。"},{"question":"“在周日的晚上”又该怎么说呢？","hint":"“周日”是 `Sunday`，“晚上”是 `evening`。","takeaway":"应该说 `on Sunday evening`。"},{"question":"总结一下，什么时候我们应该用 `on` + morning/afternoon/evening？","hint":"思考一下 “a cold morning” 和 “Sunday evening” 的共同点，它们都是“特定”的。","takeaway":"当 morning/afternoon/evening 前有形容词修饰，或与表示具体日期的词连用时，介词要用 `on`。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"—How do you come here?\n—I come here _____ bus.","options":{"A":"by","B":"take","C":"ride","D":"on"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查表示交通方式的介词。问题“How do you come here?”是在询问来这里的方式。回答交通方式最常用的结构是 `by + 交通工具名词`，意为“乘坐/通过某种交通工具”。例如 `by bus` (坐公交)，`by car` (坐小汽车)，`by train` (坐火车)。在这个结构中，交通工具名词前通常不加冠词（如 a/an/the）。选项 B 和 C 是动词，不符合句子结构。选项 D `on` 也可以和交通工具连用，如 `on the bus`，但它更多强调“在公交车上”的状态，而 `by bus` 是回答 `How` 提问交通方式最直接、最标准的用法。因此，A 是最佳答案。","knowledge_expansion_md":"### 表示交通方式的多种表达\n\n1.  **`by + 交通工具`**: 最常用，表示方式。名词前不加冠词，是固定搭配。\n    *   `by bus`, `by car`, `by train`, `by plane`, `by ship`, `by subway`。\n    *   **特例**：步行用 `on foot`。\n\n2.  **`take + a/an/the + 交通工具`**: `take` 作动词“乘坐”。\n    *   `I take the bus to school.` (我坐公交车去上学。)\n\n3.  **`ride + a/an/the + 交通工具`**: `ride` 作动词“骑”或“乘坐”。\n    *   常用于自行车、摩托车、马：`ride a bike/motorcycle/horse`。\n    *   也可用于公共交通，但不如 `take` 常用：`ride the bus`。\n\n4.  **`on/in + a/an/the + 交通工具`**: 强调“在...上/里”的状态。\n    *   `on` 用于人可以在上面站立或行走的大型交通工具：`on a bus`, `on a train`, `on a plane`。\n    *   `in` 用于人通常只能坐着的小型交通工具：`in a car`, `in a taxi`。\n    *   虽然 `I come here on the bus.` 语法正确，但回答 `How...?` 时，`by bus` 更为地道。","socratic_tracks":[{"title":"句子结构分析","steps":[{"question":"观察答句 “I come here _____ the bus.”，句子的主语和谓语动词分别是什么？","hint":"主语是动作的发出者，谓语是动作本身。","takeaway":"主语是 `I`，谓语动词是 `come`。"},{"question":"既然句子已经有了主谓结构，横线处需要填一个什么词性的词来连接 `come here` 和 `the bus` 呢？","hint":"我们需要一个词来说明“来”的方式，这个词后面还跟着名词 `the bus`。","takeaway":"横线处需要一个介词，构成介词短语作状语，修饰动词 `come`。"},{"question":"看看选项，`take` 和 `ride` 是什么词性？它们适合填在这个位置吗？","hint":"`take` 和 `ride` 都是动词。","takeaway":"一个简单句中通常只有一个谓语动词，所以动词 `take` 和 `ride` 不能直接填入，排除 B 和 C。"}]},{"title":"介词 `by` 的核心用法","steps":[{"question":"当你想用英语说“坐火车去”或者“坐飞机去”时，最常用的表达方式是什么？","hint":"通常用一个介词开头，后面直接加交通工具。","takeaway":"我们通常说 `by train`, `by plane`。"},{"question":"这个 `by + 交通工具` 的结构是用来回答哪种类型的问句的？","hint":"是回答 `Where` (哪里)，`When` (何时)，还是 `How` (如何)？","takeaway":"这个结构专门用来回答以 `How` 提问的关于方式、方法的问句。"},{"question":"因此，面对 `How do you come here?` 的提问，用哪个介词来引导交通方式最合适？","hint":"选择那个专门表示“方式”的介词。","takeaway":"`by` 是回答 `How` 并引出交通方式的标准介词，是本题的最佳选择。"}]},{"title":"区分 `by`, `on`, `in`","steps":[{"question":"我们什么时候用 `in a car`？什么时候用 `on a bus`？","hint":"想一想这两种交通工具的大小，以及人能否在里面站起来走动。","takeaway":"`in` 用于小型、私人交通工具（car, taxi），`on` 用于大型、公共交通工具（bus, train, plane）。"},{"question":"`on the bus` 和 `by bus` 表达的侧重点有什么不同？","hint":"一个强调“你在哪里”，一个强调“你用什么方式”。","takeaway":"`on the bus` 侧重于“在公交车上”这个位置状态，而 `by bus` 侧重于“乘坐公交”这种交通方式。"},{"question":"提问 “How do you come here?” 是在问你的位置，还是在问你来的方式？","hint":"“How” 在这里是“如何，怎样”的意思。","takeaway":"“How” 问的是方式，因此用 `by` 来回答是最直接和最地道的。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"Do you often have eggs _____ breakfast?","options":{"A":"on","B":"at","C":"in","D":"for"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查与三餐搭配的介词用法。当我们要表达“早餐/午餐/晚餐吃……”时，英语中的固定搭配是 `have something for breakfast/lunch/dinner`。这里的介词 `for` 含有“作为，当作”的意思。因此，“have eggs for breakfast”的完整意思就是“吃鸡蛋作为早餐”。选项 B `at` 通常表示“在吃早餐的时候”，强调时间点，如 `at breakfast`。选项 A `on` 和 C `in` 不与三餐构成此类搭配。故正确答案是 D。","knowledge_expansion_md":"### 与“三餐”相关的介词用法\n\n在谈论餐点时，不同的介词表达不同的含义，需要准确区分：\n\n1.  **`for` + 餐点**: 表示“为了某餐而吃……”，指明食物是哪一餐的内容。这是本题的考点。\n    *   `What did you have for lunch?` (你午餐吃了什么？)\n    *   `We often have porridge for breakfast.` (我们早餐经常喝粥。)\n\n2.  **`at` + 餐点**: 表示“在吃某餐的时候”，强调的是发生某事的时间点。\n    *   `He read the newspaper at breakfast.` (他在吃早餐时读报纸。)\n    *   `Let's discuss it at dinner.` (我们晚饭时再讨论这件事吧。)\n\n3.  **`with` + 餐点/食物**: 表示“和……一起吃”或“配着……吃”，指食物或饮品的搭配。\n    *   `I like to have milk with my breakfast.` (我喜欢早餐时喝牛奶。)\n    *   `Would you like some sauce with your steak?` (你的牛排要配点酱汁吗？)\n\n4.  **`before/after` + 餐点**: 表示“在某餐之前/之后”。\n    *   `Wash your hands before dinner.` (饭前洗手。)\n    *   `She likes to take a walk after supper.` (她喜欢晚饭后散步。)","socratic_tracks":[{"title":"固定搭配识别","steps":[{"question":"当你想用英语问朋友“午餐想吃什么？”时，你会怎么说？","hint":"句型是 “What do you want _____ lunch?”，中间填哪个介词？","takeaway":"地道的说法是 “What do you want for lunch?”。"},{"question":"从上一个问题中，我们可以发现，当表示“为某一餐吃某物”时，用的介词是什么？","hint":"观察 “for lunch” 这个短语。","takeaway":"表示“为某餐吃某物”时，固定搭配使用介词 `for`。"},{"question":"现在，将这个规律应用到本题，“早餐吃鸡蛋”应该怎么表达？","hint":"将 `lunch` 换成 `breakfast`，将 `what` 换成 `eggs`。","takeaway":"应该用 `have eggs for breakfast`，所以选 `for`。"}]},{"title":"介词 `for` 和 `at` 的辨析","steps":[{"question":"比较一下 “I have eggs for breakfast.” 和 “I read news at breakfast.” 这两个句子，它们的意思有什么区别吗？","hint":"一个是在说早餐“吃什么”，另一个是说“吃早餐的时候做什么”。","takeaway":"`for breakfast` 指的是早餐的食物内容，而 `at breakfast` 指的是吃早餐的时间点。"},{"question":"题干 “Do you often have eggs _____ breakfast?” 是在问你吃早餐的“内容”，还是在问你吃早餐的“时间”？","hint":"句子的核心是 `have eggs` (吃鸡蛋)，这是食物内容。","takeaway":"这句话是在问你是否经常把鸡蛋作为早餐来吃，关心的是食物内容。"},{"question":"既然是问早餐的内容，我们应该选择哪个介词？`for` 还是 `at`？","hint":"回想第一步中两个介词的不同侧重点。","takeaway":"询问食物内容时，应该使用介词 `for`。"}]},{"title":"介词 `for` 的含义","steps":[{"question":"介词 `for` 有很多意思，比如 “This gift is for you.” (给你的)，“Wait for me.” (等我)。你觉得在 “have eggs for breakfast” 中，`for` 是什么意思？","hint":"试着把这个短语翻译成中文，怎么翻译最通顺？“吃鸡蛋为了早餐”？还是“吃鸡蛋作为早餐”？","takeaway":"在这里，`for` 的意思是“作为，当作”，表示鸡蛋是早餐的一部分。"},{"question":"理解了 `for` 在这里的“作为”之意，再看其他选项，`on` (在...上), `at` (在...点), `in` (在...里)，它们有这个意思吗？","hint":"这三个介词主要表示位置或时间点。","takeaway":"其他三个介词都没有“作为、当作”的含义，因此 `for` 是唯一符合逻辑的选择。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"My father and I will go to Beijing _____ the night _____ January 10th.","options":{"A":"in; in","B":"at; in","C":"to; of","D":"on; of"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查时间介词的用法。第一个空，虽然泛指“在晚上”是 `at night`，但当 `night` 被一个具体的日期（如 `of January 10th`）修饰时，表示“在某一天的晚上”，介词要用 `on`。这与表示具体某一天的介词用 `on` 的规则一致，例如 `on Monday`。第二个空，表示“1月10日的晚上”，用介词 `of` 来表达这种所属关系。因此，完整的表达是 `on the night of January 10th`。","knowledge_expansion_md":"### 时间介词 `in`, `on`, `at` 用法辨析\n\n1.  **`in`**: 用于较长的时间段，如年、月、季节、世纪，以及泛指的“上午/下午/晚上”。\n    *   `in 2024` (在2024年), `in May` (在五月), `in summer` (在夏天)\n    *   `in the morning/afternoon/evening` (在上午/下午/傍晚)\n\n2.  **`on`**: 用于具体某一天或特定日期的上午/下午/晚上。\n    *   `on Monday` (在星期一), `on May 1st` (在5月1日)\n    *   `on a cold morning` (在一个寒冷的早晨), `on the night of the party` (在聚会那晚)\n\n3.  **`at`**: 用于具体的时刻或一些固定的时间点。\n    *   `at 8 o'clock` (在8点), `at noon` (在中午), `at midnight` (在午夜)\n    *   `at night` (在夜晚), `at the weekend` (在周末)\n\n**核心易错点**：`at night` vs. `on the night of...`\n*   `at night` 是一个固定搭配，泛指“在晚上”。\n*   当 `night` 被特指时（例如被 `of...` 或 `that` 修饰），它就等同于一个具体的“日子”，介词需用 `on`。例如：`We had a great time on the night of her birthday.` (在她生日那晚我们玩得很开心。)","socratic_tracks":[{"title":"介词 `on` 的核心用法","steps":[{"question":"我们在说“在星期一”或者“在5月1日”时，用哪个介词？","hint":"回忆一下你学过的关于星期的表达，比如 `on Monday`。","takeaway":"表示具体某一天时，我们用介词 `on`。"},{"question":"那么，“1月10日的晚上” (the night of January 10th) 是不是指一个非常具体的、特定的晚上？","hint":"它不再是泛指的任何一个晚上，而是特指1月10号那天的晚上。","takeaway":"是的，它特指了某一个具体的晚上。"},{"question":"既然它指的是一个具体的日子里的晚上，我们应该把它当作“泛指的晚上”处理，还是当作“具体的一天”来处理呢？应该用哪个介词？","hint":"参考“在星期一的早上” `on Monday morning` 的用法。","takeaway":"特指某一天的上午、下午或晚上，介词要随“天”走，使用 `on`。"}]},{"title":"固定搭配与特指","steps":[{"question":"我们通常说“在晚上”这个时间段，用英语的固定搭配怎么说？","hint":"比如“我晚上看电视”，I watch TV _____ night.","takeaway":"泛指“在晚上”通常用固定搭配 `at night`。"},{"question":"题目中的 `the night` 和我们平时说的 `night` 有什么不同？它后面跟了什么来限定它？","hint":"注意 `the night` 后面的 `of January 10th`。","takeaway":"题目中的 `the night` 被 `of January 10th` 限定，变成了特指“1月10日的那个晚上”。"},{"question":"当时间从“泛指”变为“特指”时，介词往往会发生变化。既然不再是泛指的 `at night`，我们应该换成哪个表示“在具体某一天”的介词？","hint":"想想 `on Monday`, `on my birthday`。","takeaway":"泛指用 `at night`，一旦特指到某天的晚上则用 `on the night`。"}]},{"title":"从结构入手排除","steps":[{"question":"看第二个空，我们要表达“1月10日的晚上”，这个“的”字，在英语中通常用哪个介词来表示所属关系？","hint":"比如“中国的地图”是 `the map of China`。","takeaway":"表示所属关系通常用介词 `of`。"},{"question":"知道了第二个空很可能是 `of`，我们再看四个选项，可以排除哪些？","hint":"看看 A, B, C, D 选项中第二个介词分别是什么。","takeaway":"选项 A, B, C 的第二个介词都不是 `of`，因此可以被排除，只剩下 D。"},{"question":"现在我们来验证一下选项 D 是否完全正确。`on the night of January 10th` 这个表达，是否符合我们对时间介词的理解？","hint":"回顾一下第一条 track 的结论：特指某一天的晚上用 `on`。","takeaway":"通过分析第二个空并使用排除法，可以快速锁定正确答案 D，并验证其完全符合语法规则。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"He began to teach in this school _____.","options":{"A":"in 2000, December 6th","B":"in December 6th, 2000","C":"on December 6th, 2000","D":"on 2000, December 6th"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查具体日期的表达方式及所用介词。首先，当时间具体到某一天时（如本题中的12月6日），无论后面是否跟有年份，时间介词都应该用 `on`。因此，可以排除使用介词 `in` 的选项 A 和 B。其次，英语中表达具体日期的标准书写格式之一是“月 日, 年”，即 `December 6th, 2000`。选项 D 的语序 `2000, December 6th` 不符合常规表达习惯。综上，只有选项 C `on December 6th, 2000` 在介词和日期格式上都是正确的。","knowledge_expansion_md":"### 英语日期表达法全解\n\n1.  **日期格式**\n    *   **美式英语 (AmE)**: 月 日, 年。例如: `December 6th, 2000`。\n    *   **英式英语 (BrE)**: 日 月, 年。例如: `6th December, 2000` 或 `the 6th of December, 2000`。\n    *   两种格式在国际交流中都很常见，但一个选项内部的格式必须规范。本题中的 `December 6th, 2000` 是标准的美式写法。\n\n2.  **搭配介词**\n    *   **`in`**: 用于单独的年份或月份。`in 2000`, `in December`。\n    *   **`on`**: 只要日期精确到“日”，就必须用 `on`。`on December 6th`, `on December 6th, 2000`, `on that day`。\n\n3.  **易错点**\n    *   **介词混用**：很多学生看到年份 `2000` 就想用 `in`，但忽略了前面有更精确的“日”。**判断原则是：以最精确的时间单位为准。** “日”比“年”更精确，所以要用 `on`。\n    *   **语序混乱**：`on 2000, December 6th` 这样的语序是错误的。年份通常放在最后，或者在某些特定格式中放在最前（如 2000-12-06）。","socratic_tracks":[{"title":"时间介词的选择","steps":[{"question":"当我们谈论一个具体的年份，比如 2000 年，我们用哪个介词？","hint":"例如，“我出生在2000年”。","takeaway":"表示年份时，我们用介词 `in`。"},{"question":"当我们谈论一个具体的日期，比如12月6日，我们用哪个介词？","hint":"例如，“我的生日在12月6日”。","takeaway":"表示具体某一天时，我们用介词 `on`。"},{"question":"题目中的时间是 `December 6th, 2000`，它是一个宽泛的年份还是一个精确的日期？我们应该优先根据“年”还是“日”来选择介词？","hint":"哪个时间单位更具体、更精确？","takeaway":"只要时间精确到“日”，就必须使用介词 `on`，无论后面是否跟着年份。"}]},{"title":"日期格式的规范","steps":[{"question":"在英语中，书写包含“月、日、年”的日期时，你见过哪些常见的顺序？","hint":"想一想日历或者信件上的日期格式，比如美式和英式的区别。","takeaway":"常见的日期格式有“月 日, 年”（美式）或“日 月, 年”（英式）。"},{"question":"我们来看选项 C 和 D。C 的格式是 `December 6th, 2000`，D 的格式是 `2000, December 6th`。哪一种是你熟悉的、规范的格式？","hint":"我们平时写作文或者看文章，日期是怎么写的？","takeaway":"“月 日, 年” (`December 6th, 2000`) 是非常标准和规范的日期格式。"},{"question":"为什么 `on 2000, December 6th` 这种格式是错误的？","hint":"年份在英语日期表达中的位置通常是固定的。","takeaway":"将年份用逗号隔开放在最前面，不符合英语日期书写的习惯用法。"}]},{"title":"综合应用与排除","steps":[{"question":"看到这个题目，第一步应该判断什么？是介词还是日期顺序？","hint":"介词的选择是语法硬性规则，通常更容易判断。","takeaway":"首先判断介词用法，因为 `December 6th` 是具体的一天，必须用 `on`。"},{"question":"根据“必须用 `on`”这个结论，我们可以立刻排除哪几个选项？","hint":"看 A 和 B 选项开头的介词。","takeaway":"选项 A 和 B 使用了介词 `in`，因此可以直接排除。"},{"question":"现在只剩下 C 和 D。它们都用了正确的介词 `on`，区别在于日期部分的书写顺序。哪个顺序是正确的？","hint":"回忆一下标准的日期写法：`月 日, 年`。","takeaway":"通过“先判断介词，再判断格式”的两步法，可以准确地选出正确答案 C。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"We will have a party _____ this week, but they will have one _____ next Monday.","options":{"A":"in; in","B":"in; on","C":"/; /","D":"in; /"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查特定时间状语前介词的省略规则。在英语中，当表示时间的短语前面有指示词或限定词，如 `this`, `that`, `next`, `last`, `every`, `some`, `any` 等修饰时，其前面通常不再需要加时间介词 `in`, `on`, `at`。第一个空是 `this week`（本周），前面有 `this`，所以不加介词。第二个空是 `next Monday`（下周一），前面有 `next`，所以也不加介词。因此，两个空都应省略介词，正确答案是 C。","knowledge_expansion_md":"### 时间介词的省略规则\n\n在英语语法中，有一条重要规则：当时间名词前有特定的限定词修饰时，必须省略介词 `in`, `on`, `at`。\n\n1.  **必须省略介词的限定词**：\n    *   `this` (e.g., `this morning`, `this week`, `this year`)\n    *   `that` (e.g., `that afternoon`, `that day`)\n    *   `last` (e.g., `last night`, `last month`)\n    *   `next` (e.g., `next Sunday`, `next year`)\n    *   `every` (e.g., `every day`, `every winter`)\n    *   `each` (e.g., `each time`, `each year`)\n    *   `some` (e.g., `I'll see you some day.`)\n\n2.  **本身是副词，不需介词的时间词**：\n    *   `today`, `yesterday`, `tomorrow`\n    *   `tonight`, `the day after tomorrow`, `the day before yesterday`\n\n3.  **对比记忆法**：\n    *   `in the morning` (在上午) **vs.** `this morning` (今天上午)\n    *   `on Sunday` (在星期天) **vs.** `next Sunday` (下个星期天)\n    *   `at night` (在晚上) **vs.** `last night` (昨天晚上)\n\n这个规则的原因是 `this`, `next`, `last` 等词本身已经足够明确地限定了时间，再加介词会显得冗余。","socratic_tracks":[{"title":"聚焦 `this` 和 `next`","steps":[{"question":"我们想表达“今天早上”，英文是 `in this morning` 还是 `this morning`？","hint":"想一想你平时会怎么说：“我今天早上起晚了。”","takeaway":"我们通常直接说 `this morning`，前面不加介词。"},{"question":"同样地，我们说“明年见”，是 `See you in next year` 还是 `See you next year`？","hint":"这是一个非常常见的告别语。","takeaway":"我们通常直接说 `next year`，前面也不加介词。"},{"question":"从这两个例子中，你能总结出什么规律吗？当时间名词前出现了像 `this` 或 `next` 这样的词时，我们还需要加 `in`, `on`, `at` 吗？","hint":"观察 `this` 和 `next` 在句子中的作用。","takeaway":"当时间名词前有 `this`, `that`, `next`, `last`, `every` 等限定词时，要省略前面的时间介词。"}]},{"title":"对比法学习","steps":[{"question":"如果我们要说“在周一”，应该用哪个介词？","hint":"这是一个具体到“天”的时间。","takeaway":"我们会说 `on Monday`。"},{"question":"现在，如果我们要说“在下周一”，也就是 `next Monday`，你觉得 `on` 这个介词还必要吗？","hint":"`next` 这个词本身是不是已经起到了限定时间的作用？","takeaway":"`next` 已经明确了时间，所以不再需要介词 `on`。"},{"question":"同样地，我们说“在一周里”可以用 `in a week`，那“在本周” `this week` 前面还需要 `in` 吗？","hint":"对比 `a week` 和 `this week` 的区别。","takeaway":"也不需要了，`this` 和 `next` 的用法类似，都使得介词变得多余。"}]},{"title":"从语感和简洁性出发","steps":[{"question":"请你读一下这个句子：“We will have a party in this week.” 和 “We will have a party this week.” 哪一个听起来更自然、更简洁？","hint":"英语母语者倾向于使用更简洁的表达。","takeaway":"不加介词的 `this week` 听起来更自然、地道。"},{"question":"为什么会觉得加上介词 `in` 或 `on` 会有点奇怪或啰嗦？","hint":"想一想 `this` 和 `next` 这些词本身的功能。","takeaway":"因为 `this` 和 `next` 本身就具有很强的指示功能，已经回答了“何时”的问题，再加介词就功能重复了。"},{"question":"所以，当我们在 `this week` 和 `next Monday` 前面选择介词时，最佳选择是什么？","hint":"当一个词的功能是多余的时候，我们通常会怎么做？","takeaway":"最佳选择是省略介词，因为它们是多余的。因此两个空都不填任何东西。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"What did she say _____ her letter _____ her friend in the USA?","options":{"A":"on; to","B":"for; to","C":"in; to","D":"in; with"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查常用介词的固定搭配。第一个空，表示“在信里”、“在书中”或“在报纸上”看到的内容时，我们通常使用介词 `in`，因为它强调信息是在这个载体的“内部”或“内容”里。所以是 `in her letter`。第二个空，考查动词 `say` 的用法。`say something to somebody` 是一个非常重要的固定搭配，意为“对某人说某事”，介词 `to` 用来引出说话的对象或听者。因此，完整的问句是 `What did she say in her letter to her friend...?`（她在给朋友的信里说了什么？）。","knowledge_expansion_md":"### 核心介词搭配辨析\n\n1.  **`in` vs. `on` (用于信息载体)**\n    *   **`in`**: 强调在“内容”里。常用于 `in a letter` (在信里), `in a book` (在书里), `in a newspaper` (在报纸上), `in a picture` (在图画里)。\n    *   **`on`**: 强调整在“表面”上。常用于 `on a piece of paper` (在一张纸上), `on the wall` (在墙上), `on the screen` (在屏幕上)。虽然信是写在纸上，但当把“信”作为一个整体信息载体时，习惯用 `in` 来指代其内容。\n\n2.  **表示“说”的动词与介词搭配**\n    *   **`say sth to sb`**: 对某人说某事。（`say` 后面不能直接跟“人”，必须通过 `to` 来连接）\n        *   *e.g., She said hello to me.* (她向我问好。)\n    *   **`tell sb sth`**: 告诉某人某事。（`tell` 后面直接跟“人”，无需介词）\n        *   *e.g., She told me a story.* (她给我讲了一个故事。)\n    *   **`speak/talk to/with sb`**: 和某人说话/交谈。\n        *   `to` 稍侧重单向的“对...说”。\n        *   `with` 稍侧重双向的“和...一起谈”。在很多情况下可以互换。\n        *   *e.g., I need to speak to you. / I was talking with my friend.*","socratic_tracks":[{"title":"介词 `in` 的空间感","steps":[{"question":"当我们说“在盒子里”或“在房间里”时，用哪个介词？","hint":"想象一个有边界的空间，物体在它的内部。","takeaway":"我们用 `in` 来表示在一个三维或有边界的空间内部。"},{"question":"一封信、一本书，我们可以把它们看作是承载“信息”的“容器”吗？","hint":"信件和书本里面都包含着文字和故事。","takeaway":"是的，可以把它们比喻成信息的容器。"},{"question":"那么，当我们想表达“在信里（的内容）”时，类比“在盒子里”，应该用哪个介词更合适？","hint":"是 `on the letter` (在信纸表面) 还是 `in the letter` (在信的内容里)？","takeaway":"表达“在...内容里”时，我们习惯使用介词 `in`，如 `in the letter`。"}]},{"title":"动词 `say` 的固定搭配","steps":[{"question":"如果想表达“对他说你好”，你会怎么说？`Say hello _____ him.`","hint":"这是一个非常基础的日常用语，`say` 后面要跟听话的人。","takeaway":"我们会说 `Say hello to him`。"},{"question":"从这个例子中，我们可以看出 `say` 这个动词后面如果跟一个听话的人，需要用哪个介词来连接？","hint":"观察 `say` 和 `him` 之间的那个词。","takeaway":"`say something to somebody` 是一个固定搭配，表示“对某人说某事”。"},{"question":"那么在题目中，`say` 的动作对象是 `her friend`，中间应该填入哪个介词？","hint":"套用 `say to sb` 的句型。","takeaway":"应该用 `to`，构成 `say ... to her friend`。"}]},{"title":"辨析 `to` 和 `with`","steps":[{"question":"在第二个空中，我们可能会犹豫 `to` 和 `with`。`talk with sb` 是正确的，那 `say with sb` 呢？","hint":"你听过 `say with me` 这种说法吗？通常是 `talk with me` 或 `speak with me`。","takeaway":"`say with sb` 不是一个常规搭配，`say` 这个动词通常不和 `with` 连用表示说话对象。"},{"question":"`talk with sb` 和 `say to sb` 这两个正确的搭配，在使用上有什么区别？","hint":"`talk` 侧重“交谈、对话”，是双向的；`say` 侧重“说出内容”，是单向的。","takeaway":"`talk` 强调交流，而 `say` 强调陈述。"},{"question":"题干中的动词是 `say`，它是在问“她说了什么内容”。根据我们刚才的分析，`say` 应该和哪个介词搭配来引出听话的对象？","hint":"是强调交流的 `with`，还是强调陈述对象的 `to`？","takeaway":"选择介词必须紧密结合它所搭配的动词，`say` 的固定搭配是 `say to sb`。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"Simon and Daniel are _____ their new school life over there.","options":{"A":"talking about","B":"talking with","C":"talking to","D":"talking at"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词 `talk` 与不同介词搭配的用法。`talk about something` 意为“谈论某事”，句中横线后的宾语是 `their new school life`（他们的新学校生活），是一个“事物”或“话题”，因此应使用介词 `about`。选项 B `talk with somebody` 和选项 C `talk to somebody` 均意为“和某人交谈”，其后应接表示“人”的宾语。选项 D `talk at somebody` 意为“对某人说教式地讲（不顾对方反应）”，语意和用法均不符合本题语境。因此，正确答案是 A。","knowledge_expansion_md":"动词 `talk` 的相关搭配是初中英语的重点，需要准确辨析：\n\n*   **talk about sth./sb.**: 谈论某事/某人。这是最常见的用法，表示谈话的内容。\n    *   *例：Let's talk about the plan. (我们来谈谈计划吧。)*\n*   **talk to sb.**: 和某人说话。侧重“说”的动作，有时略带单向性。\n    *   *例：I need to talk to my teacher. (我需要和我的老师谈谈。)*\n*   **talk with sb.**: 和某人交谈。侧重双方的互动和交流，是双向的。\n    *   *例：She was talking with her friends. (她正和朋友们交谈。)*\n*   **talk sb. into doing sth.**: 说服某人做某事。\n    *   *例：He talked me into buying the car. (他说服我买了这辆车。)*\n*   **talk sb. out of doing sth.**: 说服某人不要做某事。\n    *   *例：His parents tried to talk him out of the trip. (他的父母试图劝他不要去旅行。)*","socratic_tracks":[{"title":"介词搭配辨析","steps":[{"question":"请看句子中横线后面的部分 'their new school life'，它指的是一个人，还是一个话题或一件事？","hint":"“新学校生活”是一个可以被讨论的话题。","takeaway":"横线后的内容是谈论的“话题”，而不是交谈的“对象”。"},{"question":"当我们想表达“谈论关于某个话题”时，动词 'talk' 应该和哪个介词搭配？","hint":"“关于”这个意思，在英语中最常用的介词是什么？","takeaway":"固定搭配 'talk about' 意为“谈论关于……”。"}]},{"title":"排除错误选项","steps":[{"question":"'talk to' 和 'talk with' 后面通常接什么类型的词？","hint":"想一想例句：I'm talking to my friend. 这里的 'my friend' 是人还是物？","takeaway":"'talk to' 和 'talk with' 后面通常接表示“人”的名词或代词作为交谈对象。"},{"question":"既然 'talk to/with' 后面要接“人”，而题中横线后是“事”，那么 B 和 C 选项是否正确？","hint":"将选项 B 和 C 代入句子，'talking with their new school life'，这在逻辑上说得通吗？","takeaway":"选项 B 和 C 因为宾语类型不匹配，所以是错误的。"},{"question":"'talk at' 是什么意思？它和 'talk to' 有什么不同？","hint":"这个词组带有一定的负面含义，想象一下一个人在不停地对你说话，不让你插嘴。","takeaway":"'talk at' 意为“对……喋喋不休地说”，带有不顾对方感受的含义，与本题语境不符。"}]},{"title":"从句意理解切入","steps":[{"question":"请用中文翻译一下整个句子想要表达的意思。","hint":"Simon 和 Daniel 在对他们的新学校生活做一件什么事？","takeaway":"句子的意思是：西蒙和丹尼尔正在那边谈论他们的新学校生活。"},{"question":"“谈论”这个动作，在四个选项中哪个能最准确地表达，并且与其谈论的内容 'their new school life' 构成正确搭配？","hint":"回顾一下 'talk about', 'talk with', 'talk to' 的核心区别。","takeaway":"只有 'talking about' 能够准确地表达“谈论（某个话题）”这一核心含义。"}]}]}}]},{"section_title":"三、完形填空。(共20分)","section_instruction":"You like surfing the Internet (浏览网页) in your free time, don't you? But do you know \"Happy Farm\"? If you __(1)__ \"Happy Farm\" is a farm in the countryside (农村), you are wrong. \"Happy Farm\" is a computer __(2)__. Players have their own farm and do things __(3)__ farmers do on a farm. They plant seeds (播种), water plants, pick worms (捉虫) and harvest crops (收庄稼).\nI have a farm, too. Every night after __(4)__ my homework, I turn on my computer to look after my farm. Every player takes care of their farms often. First, I harvest my crops __(5)__ they are fully grown (成熟). __(6)__, I will sell (卖) the crops. Third, I go shopping and buy the seeds. Fourth, I plant the seeds and wait for __(7)__ harvest. In \"Happy Farm\", players can steal (偷) the crops __(8)__ other people's farms. To protect (保护) the crops, some players have a __(9)__ on their farm. I don't have enough money to buy a dog. __(10)__ I have a plan. First I will save (存) money by selling my crops, and then I will have enough money to get a dog.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"If you __ \"Happy Farm\" is a farm in the countryside, you are wrong.","options":{"A":"think","B":"take","C":"bring","D":"want"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析。根据上下文，`If you __ \"Happy Farm\" is a farm..., you are wrong.` 意为“如果你认为‘开心农场’是一个农场……那你就错了”。这里需要一个表示“认为”的动词。选项A `think` (认为)符合句意，构成 `think (that)...` 句式。选项B `take` (拿走)、C `bring` (带来)、D `want` (想要) 均不符合逻辑。故选A。","knowledge_expansion_md":"动词 `think` 的常见用法：\n\n1.  **`think (that)...`**: 认为……（后接宾语从句）\n    *   `I think (that) you are right.` (我认为你是对的。)\n2.  **`think about/of...`**: 考虑……；想起……\n    *   `What are you thinking about?` (你在想什么？)\n    *   `This song makes me think of my childhood.` (这首歌让我想起了我的童年。)\n3.  **`think of ... as ...`**: 把……看作是……\n    *   `We think of him as a good friend.` (我们把他当作一个好朋友。)","socratic_tracks":[{"title":"上下文推断词义","steps":[{"question":"看到句子 'If you __ ..., you are wrong.'，这个结构暗示了什么逻辑关系？","hint":"“如果你……，那么你就错了。”，空格里的动词应该表达一种观点或假设。","takeaway":"通过理解句子的基本逻辑框架，可以缩小所需词汇的范围。"},{"question":"将四个选项 'think', 'take', 'bring', 'want' 分别代入句子，哪个最通顺？","hint":"“如果你认为...”、“如果你拿走...”、“如果你带来...”、“如果你想要...”。","takeaway":"将选项代入原文进行检验，是完形填空最直接有效的方法之一。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"\"Happy Farm\" is a computer __.","options":{"A":"form","B":"game","C":"sport","D":"program"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词词义辨析。根据上下文，`\"Happy Farm\" is a computer __.` 意为“‘开心农场’是一款电脑……”。结合网游语境，它是一款电脑“游戏”（game），选项 B 正确。选项 D 设计为 program（程序），与 game 区分，避免重复选项干扰。选项 C sport（体育运动）偏重体能项目；选项 A form（形式）不切题。故选 B。","knowledge_expansion_md":"词义辨析是英语学习的重点，尤其是易混淆词汇。\n\n*   **sport vs. game**:\n    *   `sport` (体育运动): 通常指需要体力和技巧的、有规则的体育活动的总称，是不可数名词；或指某一类体育运动，是可数名词。例: `I like sport.` / `Football is a team sport.`\n    *   `game` (比赛, 游戏): 通常指一场具体的比赛，或任何以娱乐为目的的“游戏”。例: `The football game was exciting.` / `Let's play a game.`\n*   **总结**: `sport` 是对活动类型的归类，而 `game` 强调的是一次具体的活动或比赛。\n*   **辨析**: `computer game` 常指电脑游戏；`program` 泛指程序，本文语境下“开心农场”更应归为游戏（game）。","socratic_tracks":[{"title":"词义辨析：sport vs. game","steps":[{"question":"当我们想说“篮球是一项团队运动”时，这里的“运动”应该用 `sport` 还是 `game`？","hint":"我们是在给“篮球”这个活动进行分类，还是在说一场具体的比赛？","takeaway":"在对体育活动进行归类时，我们使用 'sport'。"},{"question":"那我们什么时候会用 'game' 呢？请用 'game' 造一个关于篮球的句子。","hint":"想一想“比赛”这个词，比如“昨天的湖人队比赛很精彩”。","takeaway":"'game' 通常指一场具体的比赛，例如 'The basketball game was very exciting.'"},{"question":"根据这个区别，如果原文在讨论足球（Football）的性质，那么空格里填 `sport` 和 `game` 哪个更准确？","hint":"是在给足球归类，还是在说一场足球比赛？","takeaway":"给足球这项活动归类时，'sport' 是比 'game' 更准确的词。"}]},{"title":"排除法应用","steps":[{"question":"选项 A `form`（形式）能否准确说明“开心农场”是什么？","hint":"需要的是事物类别，而不是抽象“形式”。","takeaway":"`form` 不切题，排除。"},{"question":"选项 C `sport` 通常指哪类活动？网游算不算体育运动？","hint":"`sport` 多指体能类运动项目。","takeaway":"语境是网络游戏，不是体育运动，排除 C。"},{"question":"在 B `game` 与 D `program` 之间，哪一个更贴切描述“开心农场”？","hint":"休闲类网游常用 game；program 范围太宽。","takeaway":"选 B（computer game）最符合文意。"}]},{"title":"完形填空“最佳答案”原则","steps":[{"question":"在一些情况下，'Football is a game.' 这句话本身是成立的。那为什么在完形填空中，'sport' 可能是更好的答案？","hint":"完形填空要求选择的不仅仅是“正确”的词，而是“最贴切、最恰当”的词。","takeaway":"完形填空考察的是在特定语境下的最佳词汇选择，需要考虑词语的精确含义。"},{"question":"这种对词语精确性的考察，提醒我们在平时学习词汇时应该注意什么？","hint":"只背中文意思够吗？","takeaway":"学习单词时，不仅要记中文意思，更要理解其在不同语境中的具体用法和细微差别。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"...do things __ farmers do on a farm.","options":{"A":"what","B":"about","C":"like","D":"for"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查介词的用法。根据上下文，`...do things __ farmers do on a farm.` 意为“做……像农民在农场里做的事情”。这里的空格需要一个词来表示“像，如同”。选项C `like` 作介词时，意为“像……一样”，符合句意。选项A `what` (什么)、B `about` (关于)、D `for` (为了) 均不符合该句的语法结构和逻辑。故选C。","knowledge_expansion_md":"### 介词 `like` vs. 动词 `like`\n\n*   **`like` (介词)**: 意为“像……一样”，用来比较两种相似的人或事物。\n    *   `He runs like the wind.` (他跑得像风一样快。)\n    *   `She looks like her mother.` (她长得像她妈妈。)\n*   **`like` (动词)**: 意为“喜欢”，后接名词、代词或动名词(doing)。\n    *   `I like apples.` (我喜欢苹果。)\n    *   `Do you like swimming?` (你喜欢游泳吗？)\n\n**`like` vs. `as`**: 在本题语境中，`as` 也可以使用，但 `like` 在口语中更常见，用于比较。`as` 通常更正式，强调身份或功能（作为）。","socratic_tracks":[{"title":"一词多义：like","steps":[{"question":"'I like you.' 和 'You are like my brother.' 这两个句子中，'like' 的意思和词性一样吗？","hint":"一个表示“喜欢”，一个表示“像”。","takeaway":"'like' 既可以作动词表示“喜欢”，也可以作介词表示“像……一样”。"},{"question":"在本题 'do things __ farmers do' 中，我们需要表达的是“喜欢”还是“像”？","hint":"是说玩家们喜欢农民，还是说玩家们做的事情和农民做的相似？","takeaway":"通过上下文判断词义是解题的关键。这里需要的是表示“像”的介词 'like'。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"Every night after __ my homework, I turn on my computer...","options":{"A":"did","B":"do","C":"does","D":"doing"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查介词 after 后的动词形式。`after` 作介词时，其后若接动词，须用动名词（-ing）。句意为“每天晚上做完作业之后，我打开电脑……”，故应填 doing（do one's homework 的动名词形式）。选项 A did、B do、C does 均不能直接跟在介词 after 后作宾语。正确答案为 D。","knowledge_expansion_md":"### 介词后跟动名词 (Gerund)\n\n介词（如 after, before, without, by）后的动词须用 -ing 形式。\n\n* `After finishing my homework, I watched TV.`\n* 本题：`Every night after doing my homework, ...`\n","socratic_tracks":[{"title":"介词 + doing","steps":[{"question":"`after` 后面若接动词，应使用什么形式？","hint":"介词后面需要名词性成分，动词要变为动名词。","takeaway":"after doing my homework 符合语法。"},{"question":"四个选项中哪一个为动名词？","hint":"doing 是 do 的 -ing 形式。","takeaway":"选 D。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"First, I harvest my crops __ they are fully grown.","options":{"A":"before","B":"when","C":"if","D":"who"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查连词的用法。根据上下文，`I harvest my crops __ they are fully grown.` 意为“我收获我的庄稼，__ 它们完全成熟了”。这句话描述的是两个动作之间的时间关系，“收获”发生在“庄稼成熟”的时候。选项B `when` (当……的时候) 引导时间状语从句，准确地表达了这种关系。选项A `before` (在……之前) 逻辑不通。选项C `if` (如果) 表示条件，不如 `when` 精确。选项D `who` 用于指人，不适用。故选B。","knowledge_expansion_md":"### 状语从句连词辨析\n\n在复合句中，连词的选择至关重要，它们揭示了主句和从句之间的逻辑关系。\n\n1.  **时间状语从句连词**：\n    *   `when`：当……的时候。强调动作发生的特定时间点或时间段。\n    *   `while`：当……的时候，期间。强调主从句动作同时发生，且从句动词通常是延续性的。\n    *   `before` / `after`：在……之前/之后。表示动作的先后顺序。\n    *   `as soon as`：一……就……。强调动作的紧接着发生。\n\n2.  **条件状语从句连词**：\n    *   `if`：如果。引导表示条件的状语从句。\n    *   `unless`：除非，如果不。相当于 `if...not`。\n\n3.  **原因状语从句连词**：\n    *   `because`, `as`, `since`：因为，由于。\n\n4.  **“主将从现”规则**：在时间和条件状语从句中，如果主句是将来时态（或含有情态动词表示将来），那么从句要用一般现在时来表示将来。例如：`If it rains tomorrow, we will stay at home.`","socratic_tracks":[{"title":"判断逻辑关系","steps":[{"question":"假设一个句子分为两部分：“我会给你打电话”和“我到家”。这两部分之间最可能是什么关系？是时间关系、条件关系，还是指代关系？","hint":"想一想，“到家”是打电话的“时间”、“条件”还是“对象”？","takeaway":"“我到家”是“我会给你打电话”这个动作发生的时间，因此两者是时间关系。"},{"question":"既然是时间关系，那么选项中的 `if` 和 `who` 是否可以首先排除？为什么？","hint":"`if` 用来表达什么？`who` 用来指代什么？","takeaway":"`if` 引导条件状语从句，`who` 引导定语从句或名词性从句且指代人，都与时间关系不符，故可排除。"}]},{"title":"辨析时间连词","steps":[{"question":"剩下的 `before` 和 `when` 都表示时间，它们有什么区别？","hint":"用“吃饭”和“洗手”两个动作造句，感受一下 `I wash my hands before I eat.` 和 `I wash my hands when I eat.` 的区别。","takeaway":"`before` 表示“在...之前”，强调先后顺序；`when` 表示“当...时”，强调动作发生的那个时间点。"},{"question":"回到原题，“我到家”和“给你打电话”，哪个动作先发生，哪个后发生？用 `when` 是否能准确表达这种紧随其后的关系？","hint":"通常是先到家，然后才打电话。","takeaway":"`when` 可以表示一个动作紧接着另一个动作发生，符合“到家后就打电话”的逻辑。"}]},{"title":"“主将从现”语法规则","steps":[{"question":"观察主句 `I will call you`，这是什么时态？","hint":"句中有 `will`。","takeaway":"主句是一般将来时。"},{"question":"观察从句 `I get home`，这又是什么时态？","hint":"动词 `get` 是原形。","takeaway":"从句是一般现在时。"},{"question":"在一个句子中，主句是将来时，而由 `when`, `if`, `before`, `as soon as` 等词引导的从句却用现在时，这个语法现象叫什么？","hint":"它的口诀是“主将从现”。","takeaway":"这个规则叫做“主将从现”，是时间和条件状语从句的一个重要考点。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"__(6)__, I will sell (卖) the crops.","options":{"A":"First","B":"Second","C":"Third","D":"Fourth"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查表示顺序的副词。根据空格前出现的 `First` (第一) 和空格后出现的 `Third` (第三)，可以判断此处正在按顺序列举步骤。因此，空格处应填入表示“第二”的词。`Second` 意为“第二”，符合文章的逻辑顺序。`First` 意为“第一”，`Third` 意为“第三”，`Fourth` 意为“第四”。故选B。","knowledge_expansion_md":"### 顺序词与篇章结构\n\n顺序词（Sequence Words）是写作和阅读理解中的重要线索，它们帮助组织思想，使文章结构清晰，逻辑流畅。\n\n1.  **基本顺序词**：\n    *   **开头**: `First`, `Firstly`, `To begin with`, `To start with`\n    *   **中间**: `Second(ly)`, `Third(ly)`, `Next`, `Then`, `After that`, `In addition`\n    *   **结尾**: `Finally`, `Lastly`, `In conclusion`, `To sum up`\n\n2.  **词性与用法**：\n    *   这些词通常作为**副词**使用，放在句首，并用逗号与句子主体隔开。例如：`First, open the box. Then, take out the parts.`\n    *   `First`, `second` 等也可以作为**形容词**使用，修饰名词。例如：`This is the first step.`\n\n3.  **区分 `First` 和 `At first`**：\n    *   `First` 用于列举顺序的第一项。\n    *   `At first` 意为“起初，当初”，通常用来描述情况的初始状态，且往往暗示后来情况发生了变化，常与 `but later` 或 `in the end` 连用。例如：`At first I didn't like him, but now we are good friends.`","socratic_tracks":[{"title":"理解篇章逻辑","steps":[{"question":"当你看到 `First`, `Second`, `Third` 这样的选项时，应该立刻想到这道题在考查什么？","hint":"这些词都是用来做什么的？比如在写作文或者说明书的时候。","takeaway":"这些是顺序词，题目在考查对文章或段落逻辑顺序的理解。"},{"question":"如果一个段落的开头说：“做蛋糕需要三个步骤。”，那么紧接着的第一句话最可能用哪个词来引导？","hint":"开始列举第一步时，我们应该用哪个顺序词？","takeaway":"在开始列举一系列步骤或观点时，通常使用 `First` 来引出第一项。"}]},{"title":"词汇辨析","steps":[{"question":"除了 `First`，还有哪些词或短语可以表示“首先”或“第一点”？","hint":"想一想 `begin` 或 `start` 这两个词可以怎么用。","takeaway":"我们还可以用 `Firstly`, `To begin with`, `To start with` 来引出第一点。"},{"question":"`First` 和 `At first` 有什么区别？可以说 `At first, let me introduce myself.` 吗？","hint":"`At first` 强调的是“起初”，暗示后来有变化。而 `First` 是单纯的顺序第一。","takeaway":"`First` 用于列举顺序，而 `At first` 用于描述初始状态与后来的对比，两者不能混用。"}]},{"title":"标点符号规范","steps":[{"question":"当 `First` 这样的词放在一句话的开头时，它的后面通常需要加什么标点符号？","hint":"例如：`First, we need to buy some eggs.`","takeaway":"当顺序副词位于句首时，其后通常要加逗号，将其与句子主干分开。"},{"question":"为什么这个逗号很重要？","hint":"它在朗读时起什么作用？在结构上又起什么作用？","takeaway":"这个逗号表示一个短暂的停顿，并清晰地标示出这是一个引导性的状语，使句子结构更分明。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"Fourth, I plant the seeds and wait for __(7)__ harvest.","options":{"A":"other","B":"another","C":"others","D":"the other"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查不定代词的用法。句意为：“第四，我种下种子，等待下一次的丰收。”空格处修饰单数名词 `harvest` (丰收)。`another` 意为“又一个，再一个”，泛指同类事物中的另一个，`another harvest` 指“又一次丰收”，符合语境。`other` 意为“其他的”，通常与复数名词连用，或前面有 `the` 等限定词。`others` 是代词，不能修饰名词。`the other` 特指两者中的“另一个”，语境中没有特指两个，而是指循环往复中的又一次。故选B。","knowledge_expansion_md":"### `other`, `another`, `the other`, `others` 的用法辨析\n\n这组词是小升初和初中阶段的重点和难点，关键在于理解它们的“限定”和“数量”含义。\n\n1.  **`another`**: `an + other`，泛指“再一个，另一个”（三者或以上中的任何一个）。\n    *   用法：`another` + 单数名词。例如：`Can you give me another example?`\n    *   也可作代词：`I don't like this one, show me another.`\n\n2.  **`the other`**: 特指“（两者中的）另一个”或“（特定范围里）其余的那个/些”。\n    *   用法1（两者中另一个）：`the other` + 单数名词。例如：`He has two sons. One is a doctor, the other is a teacher.`\n    *   用法2（特定范围其余）：`the other` + 复数名词。例如：`Where are the other students?`\n\n3.  **`other`**: 泛指“别的，其他的”，是形容词，必须和名词连用。\n    *   用法：`other` + 复数名词/不可数名词。例如：`Do you have any other questions?`\n\n4.  **`others` / `the others`**: 是代词，相当于 `other/the other + 名词`。\n    *   `others`：泛指“另外的人或物”（复数）。例如：`Some people agree, but others don't.`\n    *   `the others`：特指“（特定范围里）其余的所有人或物”。例如：`Two of us will stay, the others can leave.`","socratic_tracks":[{"title":"确定数量和范围","steps":[{"question":"假设有人说“我可以再来一个吗？”，他想要的是一个还是多个？","hint":"“一个”是单数还是复数？","takeaway":"他想要的是“一个”，所以我们需要一个表示单数的词。"},{"question":"他想要的是桌子上剩下的蛋糕里“特定的某一个”还是“随便哪一个”？","hint":"如果他想要特定的，他可能会说“那个巧克力味的”。但他只说了“一个”。","takeaway":"他想要的是不确定的“任何一个”，这属于泛指。"}]},{"title":"词义拆解与辨析","steps":[{"question":"我们已经确定需要一个表示“泛指的、单数的”另一个。我们来看看 `another` 这个词，它可以拆成哪两个部分？","hint":"读一下 `another`，听起来像 `an` + ?","takeaway":"`another` 可以理解为 `an + other`，`an` 正好表示“一个、泛指”。"},{"question":"那么 `the other` 中的 `the` 又表示什么意思呢？","hint":"定冠词 `the` 通常用来指代前面提到过的，或者独一无二的，也就是“特定的”。","takeaway":"`the other` 中的 `the` 表示特指，指“两者中的另一个”或“特定范围里剩下的那个”。"},{"question":"选项 `others` 词尾的 `s` 说明了什么？","hint":"名词词尾加 `s` 通常表示？","takeaway":"`others` 是复数形式，指“其他的人或物”，与我们需要的“一个”不符。"}]},{"title":"应用与场景","steps":[{"question":"如果我有两支笔，一支是红色的，另一支是蓝色的。我该如何用英语描述“另一支”？","hint":"这是在两个特定的东西里说“另一个”，应该用泛指还是特指？","takeaway":"应该用特指，说 `the other is blue`。"},{"question":"如果我想表达“有些人喜欢夏天，另一些人喜欢冬天”，这里的“另一些人”该用哪个词？","hint":"“另一些人”是复数，而且不是一个特定范围里的所有人。","takeaway":"应该用泛指的复数代词 `others`，说 `Some people like summer, but others prefer winter.`"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"In \"Happy Farm\", players can steal (偷) the crops __(8)__ other people's farms.","options":{"A":"with","B":"about","C":"from","D":"after"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查介词的用法。句意为：“在‘开心农场’里，玩家可以从别人的农场偷庄稼。”表示“从……（地方）”，应该使用介词 `from`。固定搭配 `steal sth. from ...` 意为“从……偷东西”。`with` 意为“和……一起”；`about` 意为“关于”；`after` 意为“在……之后”。均不符合句意。故选C。","knowledge_expansion_md":"### 介词 `from` 的用法拓展\n\n`from` 是一个核心介词，主要表示“来源、起点”。\n\n1.  **表示来源（地点）**：`I come from China.` (我来自中国。) `He took a book from the shelf.` (他从书架上拿了一本书。)\n2.  **表示来源（时间）**：`The store is open from 9 a.m. to 5 p.m.` (商店从上午9点营业到下午5点。)\n3.  **表示来源（材料）**：`Wine is made from grapes.` (葡萄酒是由葡萄酿造的。)\n4.  **表示“使免于，阻止”**：常与 `keep`, `stop`, `prevent` 等动词连用，构成 `keep/stop/prevent sb. from doing sth.` 结构。`The rain stopped us from going out.` (大雨使我们无法出门。)","socratic_tracks":[{"title":"理解动作与方向","steps":[{"question":"句子中的动词是 `steal` (偷)。这个动作的方向是什么？是“带着”农场偷，还是“从”农场里偷出来？","hint":"想想小偷偷东西的场景，他是把东西从一个地方拿走。","takeaway":"理解动词的含义和其所暗示的方向性，是选择正确介词的关键。"},{"question":"哪个介词最能表达“从一个地方出来”这个方向？","hint":"`with` (和), `about` (关于), `from` (从), `after` (在...之后)。","takeaway":"介词 `from` 的核心含义就是表示来源或起点，包括地理位置上的起点。"}]},{"title":"固定搭配检验","steps":[{"question":"英语中“从某地偷走某物”这个短语怎么说？","hint":"`steal something ___ a place`","takeaway":"记住固定搭配 `steal sth. from a place` 可以帮助快速解题。"},{"question":"我们把其他选项放进去试试。`steal crops with other people's farms` 是什么意思？","hint":"“用别人的农场来偷庄稼”，这在逻辑上完全不通。","takeaway":"将选项代入原文，检查其逻辑是否合理，是排除错误选项的有效方法。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"To protect (保护) the crops, some players have a __(9)__ on their farm.","options":{"A":"dog","B":"cat","C":"monkey","D":"tiger"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查名词词义辨析和语境推断。根据空格前一句 `To protect (保护) the crops` 可知，空格处需要填入一个可以用来“保护庄稼”的东西。再根据空格后一句 `I don't have enough money to buy a dog.`（我没有足够的钱买一只狗），可以明确推断出，其他玩家用来保护农场的就是狗。故选A。","knowledge_expansion_md":"### 完形填空解题技巧：利用上下文线索\n\n在做完形填空时，答案往往隐藏在空格的前后句子中。这道题就是典型的例子。\n\n1.  **上文线索**：`To protect (保护) the crops` 提示了空格处名词的功能——保护。\n2.  **下文线索**：`I don't have enough money to buy a dog.` 是最关键的线索，直接点明了其他玩家拥有的、而“我”想买但买不起的东西就是 `dog`。\n3.  **逻辑推理**：将上下文联系起来，逻辑链条是：为了保护庄稼（不被偷），一些玩家在农场里养了某种东西。而“我”也想买那个东西，但钱不够，那个东西就是狗。因此，空格处填 `dog`。","socratic_tracks":[{"title":"寻找关键线索","steps":[{"question":"要填这个空，文章里哪句话给了我们最直接、最明确的提示？","hint":"看看空格后面的句子，作者说了自己想买什么但是钱不够。","takeaway":"解题的关键线索有时不在紧挨着的前后，可能在下一句甚至下几句，要通读语境。"},{"question":"后文说“我没有足够的钱去买一只狗”。这句话暗示了什么？","hint":"它暗示了“狗”就是前面提到的，别人用来保护农场的东西。","takeaway":"作者通过对比“别人有”和“我没有但想有”的方式，给出了答案的线索。"}]},{"title":"理解句间逻辑","steps":[{"question":"我们把空格前后的信息连起来看：为了保护庄稼，一些玩家在农场里养了____。我没钱买一只狗。这两句话之间是什么关系？","hint":"后一句是对前一句的补充说明和具体化。","takeaway":"理解句子之间的逻辑关系（如解释、举例、对比等）是完形填空的重要能力。"},{"question":"为什么养一只狗可以“保护庄稼”？","hint":"在游戏设定里，狗可以看家护院，防止别人来偷东西。","takeaway":"结合生活常识和游戏背景进行合理推断，可以帮助验证答案的正确性。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"I don't have enough money to buy a dog. __(10)__ I have a plan.","options":{"A":"But","B":"If","C":"And","D":"Then"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查逻辑关系连词的运用。空格前的句子 `I don't have enough money to buy a dog.`（我没有足够的钱买一只狗）陈述了一个困难或问题。空格后的句子 `I have a plan.`（我有一个计划）提出了一个解决方案或转机。前后两句在逻辑上构成了转折关系。选项中，`But` (但是) 表示转折，符合语境。`If` (如果) 表示条件；`And` (并且) 表示并列；`Then` (然后) 表示顺序。故选A。","knowledge_expansion_md":"### 常见逻辑关系连词辨析\n\n连词是连接句子、表示逻辑关系的重要词汇，在完形填空中是高频考点。\n\n*   **`And` (和，并且)**：表示**并列**或**递进**关系，连接的事物或观点在方向上是一致的。\n    *   `He is tall and handsome.` (他既高又帅。)\n*   **`But` (但是，可是)**：表示**转折**关系，连接的事物或观点在方向上是相反或相对的。\n    *   `The book is good, but it's too expensive.` (这本书很好，但是太贵了。)\n*   **`So` (所以)**：表示**因果**关系，前面是原因，后面是结果。\n    *   `It was raining, so we stayed at home.` (天在下雨，所以我们待在家里。)\n*   **`Or` (或者，否则)**：表示**选择**关系。\n    *   `Would you like tea or coffee?` (你想要茶还是咖啡？)\n*   **`If` (如果)**：引导**条件**状语从句。\n    *   `If you work hard, you will succeed.` (如果你努力，你就会成功。)","socratic_tracks":[{"title":"分析句子逻辑","steps":[{"question":"我们来分析空格前后的两句话。第一句说“我没钱买狗”，这是一个问题。第二句说“我有一个计划”，这是一个对策。这两句话之间是什么关系？","hint":"虽然我遇到了困难，**但是**我找到了解决办法。","takeaway":"判断句子间的逻辑关系（并列、转折、因果等）是选择连词的第一步。"},{"question":"既然是转折关系，那么在 `And`, `But`, `If`, `Then` 这四个词中，哪一个专门用来表示这种“虽然...但是...”的转折？","hint":"想一想中文里的“但是”。","takeaway":"`But` 是表达转折或对比关系的核心连词，常用于引出与前文相反或出人意料的情况。"}]},{"title":"连词功能辨析","steps":[{"question":"如果这里填 `And`，句子 “我没钱买狗，并且我有一个计划” 听起来通顺吗？为什么？","hint":"`And` 通常连接方向一致的信息。这里的“没钱”和“有计划”虽然不是完全相反，但“有计划”是针对“没钱”这个困境提出的转机，用 `But` 更能体现这种逻辑。"
