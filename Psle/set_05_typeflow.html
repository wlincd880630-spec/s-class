,"takeaway":"`And` 表示并列，而 `But` 表示转折，两者表达的逻辑关系不同。"},{"question":"如果填 `Then` 呢？`Then` 是什么意思，用在这里合适吗？","hint":"`Then` 意为“然后”，表示时间或逻辑上的顺序。这里不是“没钱，然后有计划”的顺序关系。","takeaway":"`Then` 表示顺承关系，不适用于此处描述的转折情况。"}]}]}}]},{"section_title":"四、阅读理解。(共20分)","section_instruction":"**A**\n\nBroadway (百老汇) is a place in New York. Many new plays (戏剧) are put on (上演) on Broadway. If they are successful (成功的), they can then go to many cities all over the country. About 50 plays are put on each season. So if you go to New York, be sure to visit Broadway. It will be very interesting.\n\nNow Tom is in New York. He is new here. He is studying art in a university (大学). He wants to go to Broadway. But he doesn't know the way. Now, he is asking a policeman for help.\n\n\"Excuse me. Could you tell me the way to Broadway?\" says Tom. \"Yes, of course. Go down the street and take the third turning on the right. Then take the second turning on the left. You won't miss it,\" says the policeman.\n\n**B**\n\nOn Friday afternoon, Mr Tian, the Chinese teacher, asks his students to write an article (文章). The topic (主题) is \"My Beautiful Mother\". Mr Tian says to the students, \"You can go home after you finish (完成) it.\"\n\nAll the students except (除了) Xiao Hong begin to write. They want to go home early. Xiao Hong is sitting there and thinks of her activities on weekends. She usually plays basketball on Monday afternoon if it is sunny. She plays volleyball on Tuesday afternoon. On Wednesday, she plays tennis. She often plays ping-pong on Thursday. And she likes playing soccer on Friday afternoon.\n\nShe raises her head and looks around. There are only five students except her in the classroom. Forty students hand in (上交) their articles and leave (离开) for home. She is a little worried (担心的).\n\nShe thinks it over, and then she has a good idea. She writes down the words on the paper: My mother is a tall and healthy woman. She is really beautiful. If you look at her daughter, you can know all about her.","items":[{"number":"1","item_type":"reading","context_note":"Passage A","stem":"Broadway is a place in _____.","options":{"A":"China","B":"the UK","C":"Australia","D":"the USA"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题为细节信息题，考查对特定地点的地理位置认知。根据常识，百老汇（Broadway）是位于美国纽约市的一条著名大道，以其众多的剧院而闻名于世，是美国戏剧和音乐剧的重要发源地。因此，百老汇是在美国（the USA）。在阅读文章中，通常会直接或间接提及纽约（New York）或美国（the USA）等信息，考生需要从中定位答案。","knowledge_expansion_md":"### 世界著名地标与文化常识\n\n小升初英语考试中的阅读理解，有时会涉及一些基本的文化背景和地理常识。了解一些英语国家的著名地标，有助于快速理解文章内容。\n\n*   **美国 (the USA)**:\n    *   `Broadway` (百老汇，纽约): 戏剧和音乐剧中心。\n    *   `the Statue of Liberty` (自由女神像，纽约): 美国的象征。\n    *   `Hollywood` (好莱坞，洛杉矶): 世界电影中心。\n*   **英国 (the UK)**:\n    *   `Big Ben` (大本钟，伦敦): 伦敦的标志性建筑。\n    *   `the River Thames` (泰晤士河，伦敦): 英国的母亲河。\n    *   `Stonehenge` (巨石阵): 史前遗迹。\n*   **澳大利亚 (Australia)**:\n    *   `Sydney Opera House` (悉尼歌剧院，悉尼): 标志性建筑。\n    *   `the Great Barrier Reef` (大堡礁): 世界最大的珊瑚礁群。\n\n平时多积累这类常识，对阅读理解大有裨益。","socratic_tracks":[{"title":"定位地理常识","steps":[{"question":"你听说过“百老汇”（Broadway）吗？它以什么而闻名？","hint":"它和戏剧、音乐剧有很大关系，比如《猫》、《歌剧魅影》等。","takeaway":"百老汇是世界闻名的戏剧艺术中心。"},{"question":"那么，这个著名的百老汇位于哪个城市和哪个国家呢？","hint":"它在美国一个非常繁华的大都市，这个城市有“大苹果”的昵称。","takeaway":"百老汇位于美国的纽约市（New York City, the USA）。"}]},{"title":"阅读定位技巧","steps":[{"question":"如果在考试中你不认识 Broadway，你应该如何在文章中寻找答案？","hint":"首先在文章中找到 `Broadway` 这个词。","takeaway":"利用题干中的关键词（专有名词、地名等）回原文定位是阅读解题的基本方法。"},{"question":"找到 `Broadway` 后，应该关注它周围的哪些信息？","hint":"注意和它一起出现的其他地名，比如城市名或国家名，或者描述其位置的介词短语，如 `in...` 或 `located in...`。","takeaway":"定位到关键词后，仔细阅读其所在句子及上下文，寻找与问题相关的信息。"}]},{"title":"排除法应用","steps":[{"question":"我们来看选项。你知道中国、英国或澳大利亚有什么著名的戏剧街区吗？","hint":"比如英国伦敦的西区（West End）也以戏剧闻名，但它不叫 Broadway。","takeaway":"了解其他选项的相关知识，有助于反向排除，提高正确率。"},{"question":"即使文章没有直接说 Broadway 在 the USA，但如果提到了 New York，你能否推断出答案？","hint":"New York 是哪个国家的城市？","takeaway":"阅读理解不仅考查直接信息，也考查基于已有知识的间接推理能力。"}]}]}},{"number":"2","item_type":"reading","context_note":"Passage A","stem":"How many plays are put on a year on Broadway?","options":{"A":"About fifty.","B":"About two hundred.","C":"About four.","D":"Three hundred and sixty-five."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节推理题。根据原文第一段“About 50 plays are put on each season.”（每个演出季大约上演50部戏剧。），结合一年有四季的常识，可以推断出一年大约上演 50 × 4 = 200 部戏剧。因此，选项B“About two hundred”是正确答案。","knowledge_expansion_md":"### 1. 如何解答“How many”细节题\n这类问题要求考生在文章中快速定位并识别具体的数字信息。解题关键在于：\n- **识别关键词**：抓住问题中的核心名词，如本题的“plays”。\n- **定位原文**：带着关键词回到文章中寻找相关句子。\n- **核对数字**：找到包含数字的句子，并仔细核对数字是否与选项匹配。注意“about”, “around”, “approximately”（大约）等词，它们表示数字是近似值。\n\n### 2. 数字的英文表达\n- **hundred**: 百\n- **thousand**: 千\n- **million**: 百万\n- **billion**: 十亿\n\n例如，“two hundred”是200，“three hundred and sixty-five”是365。在阅读中快速识别这些数字词是基本功。","socratic_tracks":[{"title":"定位与推理","steps":[{"question":"问题问的是“How many plays ... a year”（一年有多少部戏剧）。你应该在文章中寻找什么样的词语来回答这个问题？","hint":"回答“多少”的问题，通常需要找到表示数量的词，比如具体的数字。","takeaway":"解答“How many”问题，关键是快速定位文中的数字信息。"},{"question":"在文章第一段中，哪句话提到了戏剧（plays）的数量？","hint":"仔细阅读第一段，找到包含“plays”和数字的句子。","takeaway":"文章明确指出“About 50 plays are put on each season.”"},{"question":"问题问的是“a year”（一年），而文章说的是“each season”（每个季度）。这两者有什么关系？","hint":"“season”是“季”的意思，一年有四季。50乘以4等于多少？","takeaway":"通过“50 plays each season”和一年四季的常识，可以推算出一年大约有200部戏剧，与选项B“About two hundred”对应，因此B是正确答案。"}]},{"title":"排除干扰项","steps":[{"question":"为什么选项A “About fifty” 是错的？","hint":"“fifty”是哪个时间段内的戏剧数量？是“each season”还是“a year”？","takeaway":"选项A是每个演出季的数量，而题目问的是一年的数量，因此不正确。"}]}]}},{"number":"3","item_type":"reading","context_note":"Passage A","stem":"Tom is a _____.","options":{"A":"student","B":"singer","C":"writer","D":"player"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道人物身份识别题。根据文章第二段“He is studying art in a university (大学).”（他在一所大学学习艺术。）可知，在大学学习的人就是学生（student）。因此，选项A“student”是正确答案。","knowledge_expansion_md":"### 1. 区分“身份”与“梦想/职业目标”\n在阅读理解中，作者常常会同时描述一个角色的**当前身份**和**未来梦想**。考生需要仔细分辨：\n- **is/am/are** 通常用来描述当前的、既定的事实或身份。例如：“Tom **is** a student.”\n- **wants to be/dreams of being** 等短语则用来描述未来的愿望或目标。例如：“His dream **is to be** a great actor.”\n\n### 2. 词义辨析\n- **student**: 学生，指正在学校学习的人。\n- **singer**: 歌手，以唱歌为职业的人。\n- **writer**: 作家，以写作为职业的人。\n- **player**: 在这里可以理解为“演员”（an actor in a play），也可以指“运动员”。结合语境“act in a play”，它最可能指演员。无论哪种意思，都不是汤姆目前的身份。","socratic_tracks":[{"title":"识别人物身份","steps":[{"question":"问题问的是“Tom is a _____.”（汤姆是一个……）。这通常是在问他的什么信息？","hint":"这个问题是在问汤姆的身份或职业。","takeaway":"理解问题意图是第一步，本题旨在考察对人物基本信息的把握。"},{"question":"文章第二段是如何介绍汤姆的？请找出能表明他身份的句子。","hint":"找到描述他正在做什么的句子，比如“studying in a university”。","takeaway":"文章指出“He is studying art in a university.”，这直接表明了他的学生身份。"}]},{"title":"排除法应用","steps":[{"question":"选项中的 singer（歌手）, writer（作家）, player（演员/运动员）在文章中被提及了吗？","hint":"快速扫描文章，看有没有这些词或者相关描述。","takeaway":"文章完全没有提到汤姆是歌手、作家或演员，因此可以排除B、C、D选项。"}]}]}},{"number":"4","item_type":"reading","context_note":"Passage A","stem":"Why does Tom go to Broadway?","options":{"A":"Because he wants to study art there.","B":"Because he wants to act (表演) in a play there.","C":"Because his parents live there.","D":"We don't know."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道推理判断题，询问汤姆去百老汇的原因。文章第二段只提到“He wants to go to Broadway.”（他想去百老汇。），但并未说明他想去那里的具体原因。选项A（去学艺术）文中未提及，他是在大学学艺术，不一定是在百老汇。选项B（想去演戏）和C（父母住在那）在文中也找不到任何依据。因此，根据文章提供的信息，我们无法确切知道他去百老汇的具体原因，故选择D“We don't know.”（我们不知道）。","knowledge_expansion_md":"### 1. 解答“Why”类问题的策略\n“Why”问题旨在考察原因。解题时需注意：\n- **寻找信号词**：在原文中寻找表示原因的词或短语，如 `because`, `since`, `as`, `for`, `in order to`, `to do sth.`。\n- **区分直接原因与间接背景**：有时文章会提供背景信息（如个人梦想、兴趣），但这不一定是某次具体行动的直接原因。本题就是一个典型例子，汤姆的梦想是背景，而“for a holiday”才是直接原因。\n- **注意“无中生有”的陷阱**：如果选项内容在文章中找不到任何依据，那么它就是错误的。\n- **“不知道”选项的判断**：当其他所有选项都被证明是错误的或文中未提及，且文章确实没有提供足够信息来回答问题时，“We don't know”或“Not mentioned”就是正确答案。这是小升初阅读中较难的一类题。","socratic_tracks":[{"title":"分析原文信息","steps":[{"question":"问题是“Why does Tom go to Broadway?”（汤姆为什么要去百老汇？）。我们应该在文中寻找什么样的信息来回答？","hint":"寻找解释他“目的”或“原因”的句子，比如含有 `because` 或 `to do sth.` 的句子。","takeaway":"解答“Why”问题，核心是定位文中的原因状语或表目的的短语。"},{"question":"文章第二段是如何描述汤姆想去百老汇这件事的？它给出原因了吗？","hint":"文章只说“He wants to go to Broadway. But he doesn't know the way.”","takeaway":"文章只陈述了汤姆想去百老汇，但没有解释为什么。"}]},{"title":"评估所有选项","steps":[{"question":"我们来逐一检查选项。选项A（去学艺术）、B（想去演戏）和C（父母住在那）在文中有提到吗？","hint":"在文章中搜索与“study art on Broadway”, “act”或“parents”相关的信息。","takeaway":"选项A、B、C的内容在文中都找不到依据，属于无中生有，可以排除。"},{"question":"既然A、B、C都不对，那么哪个选项最合适？","hint":"当已知信息不足以支撑任何一个明确的肯定选项时，我们应该如何选择？","takeaway":"在信息不充分的情况下，承认“不知道”（We don't know）是严谨和正确的选择。"}]}]}},{"number":"5","item_type":"reading","context_note":"Passage A","stem":"Who helps Tom at last?","options":{"A":"An old friend.","B":"A policeman.","C":"A teacher.","D":"A guide (导游)."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题，询问是谁帮助了汤姆。根据文章第二段末尾和第三段“He wants to go to Broadway. But he doesn't know the way. Now, he is asking a policeman for help.”（他想去百老汇，但他不认路。现在，他正在向一位警察求助。），可以明确知道是警察帮助了他。因此，选项B“A policeman”是正确答案。","knowledge_expansion_md":"### 1. 理解故事的基本要素：冲突与解决\n记叙文通常包含“问题/冲突”（Problem/Conflict）和“解决方法”（Solution）两个部分。快速抓住故事线索有助于解题：\n- **冲突**：在本题中，冲突是“Tom got lost and was scared.”（汤姆迷路了，很害怕。）\n- **解决**：解决方法是“A policeman helped him.”（一个警察帮助了他。）\n理解这个“问题-解决”的模式，就能迅速定位到关键人物和事件。\n\n### 2. 识别人物职业词汇\n掌握常见的职业词汇对于做对人物身份题至关重要：\n- **policeman**: 警察\n- **teacher**: 老师\n- **guide**: 导游\n- **friend**: 朋友\n- **doctor**: 医生\n- **nurse**: 护士\n平时注意积累这类词汇，并能在阅读中快速识别。","socratic_tracks":[{"title":"梳理故事情节","steps":[{"question":"在故事的后半部分，汤姆遇到了什么麻烦？","hint":"阅读第二段末尾“But he doesn't know the way.”","takeaway":"汤姆遇到的麻烦是想去百老汇但不认识路。"},{"question":"当汤姆遇到麻烦时，他向谁求助了？文章是如何描述的？","hint":"第三段开头写道：“Now, he is asking a ________ for help.”","takeaway":"文章明确指出汤姆向一个“policeman”（警察）求助。"},{"question":"这个警察帮助汤姆了吗？","hint":"警察回答了他的问题并给他指了路。","takeaway":"警察给他指了路，所以是警察帮助了他。"}]},{"title":"排除其他选项","steps":[{"question":"为什么选项A“An old friend”（一位老朋友）、C“A teacher”（一位老师）和D“A guide”（一位导游）是错的？","hint":"文章中有提到这些人吗？","takeaway":"文中只提到了警察提供了帮助，其他角色均未出现，因此可以排除。"}]}]}},{"number":"6","item_type":"reading","context_note":"Passage B","stem":"Mr. Tian asks his students to _____.","options":{"A":"go home","B":"have an English class","C":"write an article","D":"visit friends"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考察对文章主旨和关键信息的定位能力。根据文章设定，田老师给学生们布置了一项写作任务。题干问“田老师要求他的学生做什么？”。通过在文章中寻找与“Mr. Tian”和“ask”相关的句子，我们可以找到他要求学生“write an article”（写一篇文章）的直接描述。因此，选项C是唯一符合文章内容的答案。其他选项如“回家”、“上英语课”或“拜访朋友”均与文章描述的课堂任务不符。","knowledge_expansion_md":"### 知识点拓展：动词不定式作宾语补足语\n\n在英语中，“ask somebody to do something”是一个非常常见的句型，意为“要求某人做某事”。这里的 `to do something` 是动词不定式，作宾语 `somebody` 的补足语，说明要求宾语去完成的动作。\n\n**结构**：`主语 + ask + 宾语 + to + 动词原形 ...`\n\n**举例**：\n- `My mother asks me to wash the dishes.` (我妈妈叫我去洗碗。)\n- `The teacher asked the students to listen carefully.` (老师要求学生们仔细听。)\n\n**易错点**：\n- `ask` 后面如果直接跟动词，要用 `to do` 形式，不能用动词原形或-ing形式。\n- 错误：`Mr. Tian asks his students write an article.`\n- 错误：`Mr. Tian asks his students writing an article.`\n- 正确：`Mr. Tian asks his students to write an article.`","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"问题问的是“田老师要求学生做什么？” 我们应该在文章中寻找哪个关键词来定位答案？","hint":"想一想问题中的主语是谁？他做了什么动作？","takeaway":"通过定位题干中的核心人物“Mr. Tian”和关键动词“asks”，可以快速在原文中找到相关句子。"},{"question":"找到相关句子后，我们看到“Mr. Tian asks his students to...”，后面紧跟的动作是什么？","hint":"仔细阅读“to”后面的动词短语，它直接说明了老师的要求。","takeaway":"老师要求的具体内容是“write an article”，即写一篇文章。"}]},{"title":"分析选项","steps":[{"question":"我们来看看选项A 'go home'（回家）。文章的场景是在哪里？老师会让学生在课堂上立刻回家吗？","hint":"文章描述的是一个课堂情景，老师正在布置任务。","takeaway":"在课堂上布置任务时，要求学生“回家”是不合逻辑的，因此排除A。"},{"question":"选项B 'have an English class'（上英语课）。学生们是不是已经在上英语课了？布置作业是上课的一部分，还是整个上课活动本身？","hint":"布置写作任务是英语课中的一个环节。","takeaway":"“上英语课”过于笼统，而“写文章”是这堂课上的具体任务，因此C比B更准确。"},{"question":"选项D 'visit friends'（拜访朋友）。这是老师在学校课堂上会布置的任务吗？","hint":"这通常是周末或假期的个人活动，而不是课堂作业。","takeaway":"“拜访朋友”与课堂教学环境无关，因此排除D。"}]},{"title":"句型结构解析","steps":[{"question":"在英语中，如果我们想表达“要求某人做某事”，通常会用哪个句型？","hint":"想想“ask”这个词的用法，后面跟人，再跟动作。","takeaway":"表达“要求某人做某事”的常用句型是“ask somebody to do something”。"},{"question":"根据这个句型，题干“Mr. Tian asks his students to _____.”中，横线上应该填入什么形式的词语？","hint":"“to”后面应该跟动词的什么形式？","takeaway":"横线上需要填入一个动词原形引导的短语，来说明老师要求的具体动作。"}]}]}},{"number":"7","item_type":"reading","context_note":"Passage B","stem":"Xiao Hong doesn't begin because she _____.","options":{"A":"thinks of her activities","B":"isn't in the classroom","C":"thinks it is easy","D":"feels it interesting"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对原因的理解和细节信息的捕捉。题干问“小红为什么没有开始（写作）？”。根据文章情节，当其他同学都开始写作时，小红却迟迟没有动笔。文章会描述她的思绪飘到了周末的活动上，例如“her mind is full of her weekend activities”或“she thinks of her activities”。这直接对应了选项A“thinks of her activities”（她在想她的活动）。其他选项，如B“不在教室里”与事实不符；C“认为这很简单”和D“觉得这很有趣”都与她不开始写作的行为相矛盾。","knowledge_expansion_md":"### 知识点拓展：原因状语从句\n\n本题的题干和答案选项构成了一个因果关系。在英语中，表达“因为...”我们常用 `because` 引导原因状语从句。\n\n**结构**：`结果 + because + 原因`\n\n**举例**：\n- `Xiao Hong doesn't begin because she thinks of her activities.` (小红没有开始，因为她在想她的活动。)\n- `He was late because the traffic was heavy.` (他迟到了，因为交通很拥堵。)\n\n**其他表示原因的连词/词组**：\n- **as / since**: 语气比 `because` 弱，通常用于说明一个已知的、显而易见的原因，常放在句首。\n  - `As it's raining, we'd better stay indoors.` (既然在下雨，我们最好待在室内。)\n- **because of**: 后面只能跟名词、代词或动名词短语，不能跟句子。\n  - `He was late because of the heavy traffic.` (他因为交通拥堵而迟到。)","socratic_tracks":[{"title":"因果关系推理","steps":[{"question":"问题以“Why”开头，或者像本题这样问“...because...”，它在寻找什么信息？","hint":"它在问一个动作或状态发生的原因。","takeaway":"这类问题要求我们从文章中找到解释某个行为或事件发生原因的句子。"},{"question":"文章描述了小红“doesn't begin”（没有开始），那紧接着文章解释了她当时正在做什么或想什么吗？","hint":"文章提到她的思绪飘走了，想到了别的事情。","takeaway":"文章通过描述小红正在回想她的周末活动，来解释她没有开始写作的原因。"},{"question":"将文章中描述她所想的内容，与四个选项进行匹配，哪个选项最贴切？","hint":"选项A是“thinks of her activities”（想她的活动）。","takeaway":"文章内容直接支持了选项A，即她因回想周末活动而分心。"}]},{"title":"排除法应用","steps":[{"question":"我们来看选项B，“isn't in the classroom”（不在教室里）。根据上下文，小红是在教室里还是外面？","hint":"老师在给全班同学布置任务，小红是其中一员。","takeaway":"小红就在教室里，所以选项B与事实不符，可以排除。"},{"question":"再看选项C，“thinks it is easy”（认为这很简单）。如果一个人觉得任务很简单，他通常会怎么做？是会不做，还是会很快完成？","hint":"通常觉得简单会立刻动手或者不屑于做，但“不开始”的原因更可能是畏难或分心。","takeaway":"觉得任务简单并不能很好地解释“不开始”这个行为，文章也没有提供这样的信息，因此排除C。"},{"question":"最后看选项D，“feels it interesting”（觉得这很有趣）。如果她觉得写这个话题很有趣，她应该是很想写还是不想写？","hint":"兴趣是最好的老师，有趣通常会促使人行动。","takeaway":"觉得有趣应该会促使她开始写作，而不是不写，这与她的行为矛盾，因此排除D。"}]},{"title":"词义辨析","steps":[{"question":"选项A中的 'activities' 在这里指的是什么？","hint":"结合文章背景，老师要求写“我的周末”，所以她想的活动应该和什么有关？","takeaway":"这里的 'activities' 指的是小红在周末所做的一系列事情，如上课、拜访亲人等。"},{"question":"“think of” 和 “think about” 都有“想起、思考”的意思，它们在这里有什么细微差别吗？","hint":"“think of” 常常指“突然想起”或“头脑中浮现”，而“think about”更侧重“持续地、深入地思考”。","takeaway":"在这个语境下，小红的思绪飘到了周末的活动上，用“thinks of”非常贴切地描述了她分心走神的状态。"}]}]}},{"number":"8","item_type":"reading","context_note":"Passage B","stem":"Xiao Hong is good at _____.","options":{"A":"her lessons","B":"playing balls","C":"playing the piano","D":"singing and dancing"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题为细节推断题。题干问小红擅长什么。原文并未提到唱歌跳舞；她在回忆周末活动时写道：周一打篮球、周二排球、周三网球、周四乒乓球、周五喜欢踢足球，均为球类活动，可概括为 playing balls（打球类运动）。选项 D 在文中无依据。故选 B。","knowledge_expansion_md":"### 知识点拓展：表达“擅长”与“不擅长”\n\n在英语中，描述某人是否擅长某事有多种表达方式。\n\n**1. 擅长做某事:**\n- **be good at sth. / doing sth.** (这是最常用的表达)\n  - `She is good at singing.`\n  - `He is good at basketball.`\n- **do well in sth. / doing sth.**\n  - `She does well in dancing.`\n- **be skilled at/in sth. / doing sth.** (更强调“有技巧”)\n  - `He is a skilled at repairing computers.`\n\n**2. 不擅长做某事:**\n- **be bad at sth. / doing sth.**\n  - `I'm bad at drawing.`\n- **be not good at sth. / doing sth.**\n  - `She is not good at math.`\n- **be weak in sth.** (多用于学科)\n  - `He is weak in physics.`\n\n**注意**：这些介词（at, in）后面如果跟动词，一定要使用动名词形式（-ing）。","socratic_tracks":[{"title":"回扣原文","steps":[{"question":"文中写小红周末做了哪些运动？","hint":"寻找 basketball, volleyball, tennis, ping-pong, soccer 等词。","takeaway":"均为球类，对应 playing balls。"},{"question":"文中有没有说她擅长 singing and dancing？","hint":"全文检索 singing / dancing。","takeaway":"未提及，故 D 不可选。"}]}]}},{"number":"9","item_type":"reading","context_note":"Passage B","stem":"There are _____ students in Xiao Hong's class.","options":{"A":"35","B":"26","C":"45","D":"46"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题为数字推算题。开头仅交代周五下午语文老师布置写作文，并未写出全班人数。倒数第二段：教室里除小红外还有 five students（5 人），另有 Forty students 已上交作文离开；把小红本人计入：5 + 40 + 1 = 46。故全班共 46 人，选 D。","knowledge_expansion_md":"**数字题提示**：注意 except her / besides 等表述，避免漏计叙述者本人。\n- 在教室：除她外 5 人 → 教室当前共 6 人（含小红）。\n- 已离校上交：40 人。\n- 全班总数：40 + 5 + 1 = 46。\n","socratic_tracks":[{"title":"分段定位","steps":[{"question":"开头是否直接写出“46 名学生”？","hint":"只写了老师布置写作文与主题。","takeaway":"人数需从后段推算。"},{"question":"如何由 five 与 forty 得到 46？","hint":"离校 40 人 + 仍在教室的另外 5 人 + 小红自己。","takeaway":"40 + 5 + 1 = 46。"}]}]}},{"number":"10","item_type":"reading","context_note":"Passage B","stem":"We know from the passage that Xiao Hong is a(n) _____ girl.","options":{"A":"naughty (淘气的) and beautiful","B":"ugly (丑的) and friendly","C":"short and old","D":"thin and small"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查人物推断。最后一段小红未认真构思作文，而是用“看女儿可知母亲”这类取巧方式完成，可见其机灵、淘气（naughty）。文中又明确写母亲 tall、healthy、really beautiful，并让读者由 daughter 推知母亲，可合理推断女儿也漂亮（beautiful）。选项 D“瘦小”等并非文意重点；B、C 与文意相反或矛盾。故选 A。","knowledge_expansion_md":"人物题需区分**直接描写**与**行为推断**：外貌词描写母亲，性格可从“偷懒/取巧完成作业”推断。\n","socratic_tracks":[{"title":"证据整合","steps":[{"question":"小红写作文的方式说明她怎样的性格？","hint":"未展开描写母亲，而用一句话搪塞。","takeaway":"淘气、爱耍小聪明。"},{"question":"文中如何写母亲外貌？对推断小红有何帮助？","hint":"beautiful 与 daughter 的暗示。","takeaway":"可支持 beautiful。"}]}]}}]},{"section_title":"五、翻译。(共5分)","section_instruction":"","items":[{"number":"1","item_type":"sentence_transform","context_note":"","stem":"许多小伙子喜欢在周末整天玩电脑游戏。","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"like playing|on","explanation_md":"本题考查根据中文提示完成英文句子，涉及固定搭配和介词用法。\n1.  “喜欢做某事”在英语中常用`like doing sth.`的结构来表达一种习惯性的爱好。因此，动词`play`需要变为动名词形式`playing`。\n2.  “在周末”的英文表达是`on weekends` (美式) 或 `at weekends` (英式)，两者都正确。这里要求填两个空，所以`on`是第二个空的答案。\n3.  “整天”是`all day`或`all day long`。\n4.  结合起来，完整的句子可以是 `Many young boys like playing computer games all day long on weekends.`","knowledge_expansion_md":"1.  **`like doing` vs `like to do`**\n    *   `like doing sth.`：通常指长期的、习惯性的爱好。例如：`I like swimming.` (我喜欢游泳这项运动)。\n    *   `like to do sth.`：多指一时的、具体的想法或选择。例如：`I like to swim in the morning.` (我喜欢在早上游泳)。在很多情况下，两者可以互换，但`like doing`更侧重于享受过程本身。\n\n2.  **表示时间的介词 `in`, `on`, `at`**\n    *   `at`：用于具体时间点 (at 5 o'clock)、短暂的节日 (at Christmas)、以及一些固定短语 (at noon, at night, at the weekend)。\n    *   `on`：用于具体的某一天、日期、星期几 (on Monday, on May 1st)、或特定一天的上午/下午/晚上 (on Sunday morning)。\n    *   `in`：用于较长的时间段，如月份、年份、季节、世纪 (in May, in 2024, in summer, in the 21st century)，以及泛指的上午/下午/晚上 (in the morning/afternoon/evening)。","socratic_tracks":[{"title":"动词形式","steps":[{"question":"在英语中，“喜欢”后面的动词“玩”应该用什么形式呢？","hint":"想一想 `like` 这个词后面跟动词时，动词需要做什么变化？是 `play`, `to play` 还是 `playing`？","takeaway":"固定搭配 `like doing sth.` 表示习惯性的“喜欢做某事”。"},{"question":"为什么这里用 `playing` 比用 `to play` 更好？","hint":"这句话描述的是一种普遍的现象和习惯，还是一次性的行为？","takeaway":"`like doing` 更侧重于描述一种长期的、享受其中的爱好。"}]},{"title":"介词用法","steps":[{"question":"表示“在周末”这个时间，我们应该用哪个介词？`in`, `on`, 还是 `at`？","hint":"“周末”可以看作是一个特定的时间段，类似于某一天。","takeaway":"表达“在周末”通常使用介词 `on` (on weekends) 或 `at` (at the weekend)。"},{"question":"我们来回顾一下，`on`, `in`, `at` 用在时间上有什么区别？“在五月”用哪个？“在5点钟”呢？","hint":"`at`接点，`on`接线（天），`in`接面（月、年、季）。","takeaway":"掌握时间介词 `at`, `on`, `in` 的用法规则是正确表达时间的关键。"}]},{"title":"句子结构","steps":[{"question":"我们来分析一下这个中文句子“许多小伙子喜欢在周末整天玩电脑游戏”的成分吧。主语是谁？谓语是什么？","hint":"谁做了什么？","takeaway":"翻译句子的第一步是正确分析原句的结构和成分。"},{"question":"“在周末”和“整天”在句子中充当什么成分？它们在英文句子中一般放在什么位置？","hint":"它们是用来修饰动作的，描述动作发生的时间。","takeaway":"时间状语在英语句子中位置比较灵活，通常可以放在句首或句末。"}]}]}},{"number":"2","item_type":"sentence_transform","context_note":"","stem":"左侧的妇女们正解释怎样做美味的食物和饮料。","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"are explaining|how to make","explanation_md":"本题考查现在进行时和“疑问词+不定式”结构。\n1.  中文提示“正解释”中的“正”字，表明动作正在进行，因此需要使用现在进行时。主语是`The women`（复数），所以be动词用`are`，`explain`变为`explaining`，合起来是`are explaining`。\n2.  “怎样做...”在英语中常用`how to do sth.`的结构来表达。这里的“做”是`make`，“美味的食物和饮料”是`delicious food and drinks`，所以“怎样做美味的食物和饮料”就是`how to make delicious food and drinks`。","knowledge_expansion_md":"1.  **现在进行时 (Present Continuous Tense)**\n    *   **结构**：主语 + am/is/are + 动词-ing形式。\n    *   **用法**：\n        a. 表示说话时正在发生的动作。例如：`Listen! The baby is crying.` (听！宝宝正在哭。)\n        b. 表示现阶段正在进行但说话时不一定在做的动作。例如：`I am reading a new book.` (我最近在读一本新书。)\n\n2.  **“疑问词+不定式”结构**\n    *   **结构**：`what`, `which`, `when`, `where`, `how` + `to do` (动词不定式)。\n    *   **用法**：这个结构在句子中相当于一个名词，可以作主语、宾语、表语等。它用来表达“做什么、去哪里、何时做、怎么做”等含义。\n        *   `I don't know what to do.` (我不知道该做什么。) - 作宾语\n        *   `The question is how to get there.` (问题是怎么去那里。) - 作表语","socratic_tracks":[{"title":"时态判断","steps":[{"question":"看到中文里的“正”字，比如“我正吃饭”，它提示我们这个动作处于什么状态？","hint":"是已经完成，还是正在进行？","takeaway":"中文的“正”或“正在”明确表示动作正在进行。"},{"question":"在英语中，哪个时态专门用来表达“正在进行”的动作？它的构成是怎样的？","hint":"Be动词 + 一个动词的变化形式。","takeaway":"现在进行时（am/is/are + doing）是表达当前正在发生动作的核心时态。"},{"question":"这句话的主语是 `The women`，是单数还是复数？所以be动词应该用 `is` 还是 `are`？","hint":"`woman`的复数形式是`women`。","takeaway":"动词时态不仅要注意时间，还要确保主谓一致。"}]},{"title":"特殊结构","steps":[{"question":"“怎样做某事”这个短语，在英语里有一个很常见的结构，你知道是什么吗？","hint":"以 `how` 开头，后面跟一个动词的不定式。","takeaway":"“疑问词 + to do”结构是表达“如何/何时/何地做某事”的常用方式。"},{"question":"除了 `how to do`，你还能举出其他类似的例子吗？比如“去哪里”或者“吃什么”？","hint":"想想 `where` 和 `what` 怎么用在这个结构里。","takeaway":"这个结构很灵活，适用于多个疑问词，如 `what to eat`, `where to go`, `when to start`。"}]},{"title":"词汇选择","steps":[{"question":"“左侧的妇女们”翻译成 `The women on the left`，这里的 `on the left` 是什么意思？","hint":"它是在描述这些妇女的什么信息？","takeaway":"`on the left/right` 是表示方位的重要介词短语。"},{"question":"“美味的”除了 `delicious`，你还知道哪些类似的词吗？","hint":"比如 `tasty`, `yummy`。","takeaway":"积累同义词可以使你的表达更加丰富多彩。"}]}]}}]},{"section_title":"六、书面表达。(共15分)","section_instruction":"根据下面提示，写一篇关于你上个周天的动物园之行的短文。","items":[{"number":"1","item_type":"writing","context_note":"","stem":"提示：\n1. 我们首先看到了大熊猫，它们在吃竹子。\n2. 大熊猫北面是狮子，狮子很危险，不要靠近它们。\n3. 还看到了猴子。它们正在荡来荡去。\n4. 我们看到了各种动物，玩得很开心。","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线作答区域","teaching":{"correct_answer":"We had a wonderful day at the zoo. First, we saw some giant pandas. They were happily eating bamboo. To the north of the pandas' area, we saw the lions. Our teacher told us that lions are dangerous, so we didn't get too close. After that, we saw many naughty monkeys swinging from tree to tree. We saw so many kinds of animals and we all had a great time!","explanation_md":"这篇范文是一篇优秀的记叙文，它满足了题目的所有要求。首先，文章涵盖了全部四个提示要点，内容完整。其次，全文主要使用一般过去时（`had`, `saw`, `were`, `told`, `didn't get`），与描述过去经历的语境完全一致，时态运用准确。再次，范文使用了`First`, `To the north of...`, `After that`等过渡词和短语，使得句子之间衔接自然，逻辑清晰。最后，文章在提示的基础上进行了一些合理的扩展，如`happily eating`, `swinging from tree to tree`, `Our teacher told us`等，使内容更生动、更具体，语言表达更丰富。","knowledge_expansion_md":"对于小升初阶段的提示性写作，掌握以下几点至关重要：\n\n1.  **时态统一**：记叙过去发生的事情，通篇应以**一般过去时**为主要时态。这是评分的重要标准。\n\n2.  **逻辑连贯**：使用过渡词（Transition Words）将独立的提示点串联成一个有机的整体。常用过渡词有：\n    *   **顺序**: `First`, `Then`, `Next`, `After that`, `Finally`\n    *   **并列**: `And`, `Also`\n    *   **转折**: `But`, `However`\n    *   **因果**: `So`, `Because`\n\n3.  **内容丰满**：在准确翻译提示点的基础上，可以适当增加细节，让文章更生动。可以增加：\n    *   **形容词/副词**: `beautiful` flowers, `happily` playing\n    *   **地点/方式状语**: `at the zoo`, `from tree to tree`\n    *   **个人感受**: `I felt very happy`, `We had a great time`\n\n4.  **主谓一致和单复数**：写作时要时刻注意主语是单数还是复数，谓语动词要随之变化。名词的单复数形式也要正确使用，如 `lion` vs `lions`。","socratic_tracks":[{"title":"时态选择","steps":[{"question":"这篇作文是关于一次动物园之旅的，这件事是现在发生的还是过去发生的？","hint":"提示说“我们看到了...”，这是已经发生的事。","takeaway":"记叙过去的经历，文章的主要时态应该是一般过去时。"},{"question":"那么，动词 `see`, `are`, `eat`, `play` 的过去式分别是什么？","hint":"注意不规则动词的变化。","takeaway":"熟练掌握常见动词的过去式是写好记叙文的基础。"}]},{"title":"篇章结构","steps":[{"question":"题目给了四个独立的提示点，我们怎样才能让它们读起来像一篇文章，而不是四个独立的句子？","hint":"想一想表示“首先”、“然后”、“也”的词语。","takeaway":"使用 `First`, `Then`, `Also` 等过渡词可以使文章脉络清晰，逻辑连贯。"},{"question":"文章的开头和结尾通常应该写些什么？","hint":"开头可以交代背景（我们去了哪里），结尾可以总结感受（我们玩得很开心）。","takeaway":"一个好的开头和结尾能让文章结构更完整，给读者留下好印象。"}]},{"title":"细节润色","steps":[{"question":"“猴子正在荡来荡去”，除了直接翻译 `The monkeys were swinging`，我们还能不能加点细节让画面更生动？","hint":"它们在哪里荡来荡去？它们的心情怎么样？","takeaway":"通过增加地点（from tree to tree）、方式（happily）等细节，可以让描写更具体、更有画面感。"},{"question":"“狮子很危险，不要靠近它们”，这句话在记叙文里直接写出来会不会有点奇怪？可以怎么改写一下？","hint":"可以把它变成“我们”当时的想法或行动。比如“我们知道狮子很危险，所以我们......”","takeaway":"将提示中的指令或评价转化为故事中的情节或感受，会让叙述更自然。"}]}]}}]}],"content_markdown":"# 成都某外国语学校初2025级新初一入学真卷英语(一)\n\n**满分：**90分\n**时间：**60分钟\n\n### 一、用适当的人称代词或物主代词填空。(共10分)\n\n1. Your football clothes are on the desk. Please put _____ (they/them/their/theirs) away.\n2. (We/Us/Our/Ours) _____ English teacher is Mrs Green. We all like _____ (she/her/hers).\n3. (I/Me/My/Mine) _____ can't get my kite. Could you help _____ (I/me/my/mine)?\n4. Tom can't get down from the tree. Can you help _____ (he/him/his)?\n5. Her kite is broken. Can _____ (you/your/yours) mend it?\n6. We can't find our kites. Can you help _____ (we/us/our/ours)?\n7. Those are _____ (he/him/his) planes. The white ones are _____ (I/me/my/mine).\n\n### 二、单项选择。(共20分)\n\n1. Amy always finishes her homework on time. She _____ leaves it for tomorrow.\n    A. always\n    B. usually\n    C. never\n    D. sometimes\n2. Peter is busy all the time. He _____ has time to play badminton.\n    A. always\n    B. often\n    C. usually\n    D. seldom\n3. I can remember that she left _____ a cold winter morning.\n    A. in\n    B. at\n    C. on\n    D. for\n4. —How do you come here?\n   —I come here _____ the bus.\n    A. by\n    B. take\n    C. ride\n    D. on\n5. Do you often have eggs _____ breakfast?\n    A. on\n    B. at\n    C. in\n    D. for\n6. My father and I will go to Beijing _____ the night _____ January 10th.\n    A. in; in\n    B. at; in\n    C. to; of\n    D. on; of\n7. He began to teach in this school _____.\n    A. in 2000, December 6th\n    B. in December 6th, 2000\n    C. on December 6th, 2000\n    D. on 2000, December 6th\n8. We will have a party _____ this week, but they will have one _____ next Monday.\n    A. in; in\n    B. in; on\n    C. /; /\n    D. in; /\n9. What did she say _____ her letter _____ her friend in the USA?\n    A. on; to\n    B. for; to\n    C. in; to\n    D. in; with\n10. Simon and Daniel are _____ their new school life over there.\n    A. talking about\n    B. talking with\n    C. talking to\n    D. talking at\n\n### 三、完形填空。(共20分)\n\nYou like surfing the Internet (浏览网页) in your free time, don't you? But do you know \"Happy Farm\"? If you __(1)__ \"Happy Farm\" is a farm in the countryside (农村), you are wrong. \"Happy Farm\" is a computer __(2)__. Players have their own farm and do things __(3)__ farmers do on a farm. They plant seeds (播种), water plants, pick worms (捉虫) and harvest crops (收庄稼).\nI have a farm, too. Every night after __(4)__ my homework, I turn on my computer to look after my farm. Every player takes care of their farms often. First, I harvest my crops __(5)__ they are fully grown (成熟). __(6)__, I will sell (卖) the crops. Third, I go shopping and buy the seeds. Fourth, I plant the seeds and wait for __(7)__ harvest. In \"Happy Farm\", players can steal (偷) the crops __(8)__ other people's farms. To protect (保护) the crops, some players have a __(9)__ on their farm. I don't have enough money to buy a dog. __(10)__ I have a plan. First I will save (存) money by selling my crops, and then I will have enough money to get a dog.\n\n1. _____\n    A. think\n    B. take\n    C. bring\n    D. want\n2. _____\n    A. form\n    B. game\n    C. sport\n    D. program\n3. _____\n    A. what\n    B. about\n    C. like\n    D. for\n4. _____\n    A. did\n    B. do\n    C. does\n    D. doing\n5. _____\n    A. before\n    B. when\n    C. if\n    D. who\n6. _____\n    A. First\n    B. Second\n    C. Third\n    D. Fourth\n7. _____\n    A. other\n    B. another\n    C. others\n    D. the other\n8. _____\n    A. with\n    B. about\n    C. from\n    D. after\n9. _____\n    A. dog\n    B. cat\n    C. monkey\n    D. tiger\n10. _____\n    A. But\n    B. If\n    C. And\n    D. Then\n\n### 四、阅读理解。(共20分)\n\n**A**\n\nBroadway (百老汇) is a place in New York. Many new plays (戏剧) are put on (上演) on Broadway. If they are successful (成功的), they can then go to many cities all over the country. About 50 plays are put on each season. So if you go to New York, be sure to visit Broadway. It will be very interesting.\n\nNow Tom is in New York. He is new here. He is studying art in a university (大学). He wants to go to Broadway. But he doesn't know the way. Now, he is asking a policeman for help.\n\n\"Excuse me. Could you tell me the way to Broadway?\" says Tom. \"Yes, of course. Go down the street and take the third turning on the right. Then take the second turning on the left. You won't miss it,\" says the policeman.\n\n**B**\n\nOn Friday afternoon, Mr Tian, the Chinese teacher, asks his students to write an article (文章). The topic (主题) is \"My Beautiful Mother\". Mr Tian says to the students, \"You can go home after you finish (完成) it.\"\n\nAll the students except (除了) Xiao Hong begin to write. They want to go home early. Xiao Hong is sitting there and thinks of her activities on weekends. She usually plays basketball on Monday afternoon if it is sunny. She plays volleyball on Tuesday afternoon. On Wednesday, she plays tennis. She often plays ping-pong on Thursday. And she likes playing soccer on Friday afternoon.\n\nShe raises her head and looks around. There are only five students except her in the classroom. Forty students hand in (上交) their articles and leave (离开) for home. She is a little worried (担心的).\n\nShe thinks it over, and then she has a good idea. She writes down the words on the paper: My mother is a tall and healthy woman. She is really beautiful. If you look at her daughter, you can know all about her.\n\n1. (Passage A) Broadway is a place in _____.\n    A. China\n    B. the UK\n    C. Australia\n    D. the USA\n2. (Passage A) How many plays are put on a year on Broadway?\n    A. About fifty.\n    B. About two hundred.\n    C. About four.\n    D. Three hundred and sixty-five.\n3. (Passage A) Tom is a _____.\n    A. student\n    B. singer\n    C. writer\n    D. player\n4. (Passage A) Why does Tom go to Broadway?\n    A. Because he wants to study art there.\n    B. Because he wants to act (表演) in a play there.\n    C. Because his parents live there.\n    D. We don't know.\n5. (Passage A) Who helps Tom at last?\n    A. An old friend.\n    B. A policeman.\n    C. A teacher.\n    D. A guide (导游).\n6. (Passage B) Mr. Tian asks his students to _____.\n    A. go home\n    B. have an English class\n    C. write an article\n    D. visit friends\n7. (Passage B) Xiao Hong doesn't begin because she _____.\n    A. thinks of her activities\n    B. isn't in the classroom\n    C. thinks it is easy\n    D. feels it interesting\n8. (Passage B) Xiao Hong is good at _____.\n    A. her lessons\n    B. playing balls\n    C. playing the piano\n    D. singing and dancing\n9. (Passage B) There are _____ students in Xiao Hong's class.\n    A. 35\n    B. 26\n    C. 45\n    D. 46\n10. (Passage B) We know from the passage that Xiao Hong is a(n) _____ girl.\n    A. naughty (淘气的) and beautiful\n    B. ugly (丑的) and friendly\n    C. short and old\n    D. thin and small\n\n### 五、翻译。(共5分)\n\n1. 许多小伙子喜欢在周末整天玩电脑游戏。\n2. 左侧的妇女们正解释怎样做美味的食物和饮料。\n\n### 六、书面表达。(共15分)\n\n根据下面提示，写一篇关于你上个周天的动物园之行的短文。\n\n提示：\n1. 我们首先看到了大熊猫，它们在吃竹子。\n2. 大熊猫北面是狮子，狮子很危险，不要靠近它们。\n3. 还看到了猴子。它们正在荡来荡去。\n4. 我们看到了各种动物，玩得很开心。\n","proofread_notes":"1. 卷面大题号'V.'和'VI.'已统一为中文数字'五、'和'六、'。\n2. 第五大题（翻译）和第六大题（书面表达）原卷未对小题编号，已按顺序添加。\n3. 完形填空：第2小题已将选项 D 由重复的 game 改为 program；第4小题已改为唯一选项并将正确答案定为 D（doing）。\n4. 原卷含多处彩色水印，已在处理中忽略。","set_number":5,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_05\\page_013.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_05\\page_014.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":39},{"step":2,"name":"verify","items":40,"check_passed":false,"issues_count":5},{"step":3,"name":"polish","items":40}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:38:50.680417+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function splitReadingPassageHeading(body) {

    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };

  /**

  function passageHtmlFromSectionInstruction(passage) {

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    return false;
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const t = String(fullText || "");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (!mp) return t.trim();
      bodyStart = mp.index + mp[0].length;
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "reading") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {

          if (r2.type !== "reading") break;

        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupWritingByPassage(rows) {

  function groupDetailsByReadingPassage(details) {

      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, details: details.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < details.length) {

        const slice = details.slice(i, j);
        const sliceRows = slice.map((d) => ({ it: d.row.it }));
        const body = pickReadingPassageBody(sliceRows);
        const ps = passageOrSectionBodyForSlice(
          slice.map((d) => d.row),
          body,
        );
        groups.push({ passage: ps.passage, details: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", details: [details[i]] });
        i++;
      }
    }
    return groups;
  }

  function groupDetailsByWritingPassage(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const row = details[i].row;
      if (row.type !== "writing") {
        groups.push({ passage: "", details: [details[i]] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "writing") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, details: details.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < details.length) {
          const r2 = details[j].row;
          if (r2.type !== "writing") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = details.slice(i, j);
        const sliceRows = slice.map((d) => ({ it: d.row.it }));
        const body = pickReadingPassageBody(sliceRows);
        const ps = passageOrSectionBodyForSlice(
          slice.map((d) => d.row),
          body,
        );
        groups.push({ passage: ps.passage, details: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", details: [details[i]] });
        i++;
      }
    }
    return groups;
  }

  function groupFillBlankBySectionInstruction(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const ins = String(rows[i].section_instruction || "").trim();
      let j = i + 1;
      while (j < rows.length && String(rows[j].section_instruction || "").trim() === ins) j++;
      groups.push({ instruction: ins, rows: rows.slice(i, j) });
      i = j;
    }
    return groups;
  }

  /** 大题说明里 (53) Y_____ 式文中空，小题无 stem、无 A–D（首字母填空对话等） */
  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !/\(\d+\)[^_\n\r]*_{3,}/.test(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(m[0]).replace(/\n/g, "<br>");
      }
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      out += rk
        ? "<span class='exam-blank'>&nbsp;</span>"
        : esc(m[0]).replace(/\n/g, "<br>");
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text'>" + out + "</div>";
  }

  function groupDetailsByClozeSection(details) {
    const groups = [];
    let i = 0;
    while (i < details.length) {
      const ins = String(details[i].row.section_instruction || "").trim();
      let j = i + 1;
      while (j < details.length) {
        if (String(details[j].row.section_instruction || "").trim() !== ins) break;
        j++;
      }
      groups.push({ passage: details[i].row.section_instruction || "", details: details.slice(i, j) });
      i = j;
    }
    return groups;
  }

  function clozeAnswerWordFromItem(it) {
    const teach = it.teaching || {};
    const opts = it.options && typeof it.options === "object" ? it.options : {};
    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";
    const caUp = caRaw.toUpperCase().charAt(0);
    if ("ABCD".indexOf(caUp) >= 0) {
      const tx = String(opts[caUp] || "").trim();
      if (tx) return tx;
    }
    return caRaw;
  }

  function clozeNumToAnswerMap(detailsPairs) {
    const map = Object.create(null);
    detailsPairs.forEach(({ row }) => {
      const it = row.it;
      const n = String(it.number || "").trim();
      if (!n) return;
      const w = clozeAnswerWordFromItem(it);
      map[n] = w;
      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
    });
    return map;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");
        }
        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);
  }

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};
    const seg = (chunk) =>
      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!stem) return "<p class='stem'></p>";
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;
  }

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：练习/PDF/讲解中整段不展示 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));
  }

  /** 左侧已有文章的完形小题：仅展示对齐的 A–D，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || row.type !== "cloze") return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    if (isClozeDialoguePlaceholderStem(it && it.stem)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const abcd = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim());
    if (abcd.length) return { letters: abcd, opts: raw };
    if (typ === "cloze") {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  /** 完形练习页：A→B→C 纵向，仅输出有内容的项 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    const order = ["A", "B", "C", "D"];
    let h = "";
    order.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!letters.includes(L) || !tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  function quizOptsGridClass(letters, opts) {
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
    return "opts opts-cols-" + c;
  }

  function renderTransformStemHtml(stem, qkey) {
    if (!stem) {
      return "<p class='stem'><span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='0' autocomplete='off' /></span></p>";
    }
    if (/_{3,}/.test(stem)) return renderStemHtml(stem, qkey);
    return (
      "<p class='stem'>" +
      esc(stem).replace(/\n/g, "<br>") +
      " <span class='blank-line'><input type='text' data-k='" +
      esc(qkey) +
      "' data-bi='0' autocomplete='off' placeholder='作答' /></span></p>"
    );
  }

  function parseTransformAnswerParts(ca) {
    return String(ca || "").split("|").map((s) => s.trim());
  }

  /** 讲解页：句型转换题干，用正确答案填入空格并高亮（与完形「填入答案」样式一致） */
  function buildTransformFilledStemHtml(stem, ca) {
    const parts = parseTransformAnswerParts(ca);
    const stemStr = String(stem || "");
    const blankPh = "—";
    const spanAns = (w) =>
      "<span class='cloze-filled-ans'>" + esc(w && String(w).trim() ? w : blankPh) + "</span>";

    if (!stemStr.trim()) {
      const w = String(ca || "").trim() || parts.filter(Boolean).join(" | ") || blankPh;
      return "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" + spanAns(w) + "</div>";
    }

    if (/_{3,}/.test(stemStr)) {
      const chunks = stemStr.split(/_{3,}/);
      let h = "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>";
      const n = chunks.length - 1;
      for (let i = 0; i < chunks.length; i++) {
        h += esc(chunks[i]).replace(/\n/g, "<br>");
        if (i < n) {
          const w = i < parts.length ? parts[i] : "";
          h += spanAns(w);
        }
      }
      h += "</div>";
      return h;
    }

    const tail =
      String(ca || "").trim() ||
      (parts.length ? parts.filter(Boolean).join(" | ") : "") ||
      blankPh;
    return (
      "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" +
      esc(stemStr).replace(/\n/g, "<br>") +
      " " +
      spanAns(tail) +
      "</div>"
    );
  }

  function renderOpenAnswerStem(stem, qkey, rowType, quizType) {
    const isTf = rowType === "sentence_transform" || quizType === "sentence_transform";
    if (isTf) return renderTransformStemHtml(stem, qkey);
    return renderStemHtml(stem, qkey) + "<textarea class='area' data-k='" + esc(qkey) + "' rows='6' placeholder='在此作答（多空用 | 分隔）'></textarea>";
  }

  /** 按真题卷面顺序：自上而下扫 sections→items，题型首次出现顺序（与 buildFlat 的 state.flat 一致） */
  function typesInPaperAppearanceOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const t = row.type;
      if (seen[t]) return;
      if (!(state.byType[t] || []).length) return;
      seen[t] = true;
      out.push(t);
    });
    return out;
  }

  function orderedTypesList() {
    const paper =
      EXAM.exam_meta &&
      String(EXAM.exam_meta.type_card_order || "").toLowerCase() === "paper";
    if (paper) {
      return typesInPaperAppearanceOrder();
    }
    return Object.keys(state.byType)
      .filter((x) => (state.byType[x] || []).length > 0)
      .sort((a, b) => {
        const ia = TYPE_ORDER.indexOf(a);
        const ib = TYPE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
  }

  /** 生成某题型答题区 HTML（供页面与 PDF 共用） */
  function buildQuizBodyHtml(t) {
    const rows = state.byType[t] || [];
    const readingGroups = t === "reading" ? groupReadingByPassage(rows) : [];
    const writingGroups = t === "writing" ? groupWritingByPassage(rows) : [];
    let html = "";
    if (t === "cloze" && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0])) return;
        if (isClozeInlineFillSectionGroup(g)) {
          const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
          html +=
            "<div class='pdf-cloze-unit cloze-inline-fill-unit'><div class='cloze-passage-card card'>" +
            "<h2>" +
            esc(gTitle) +
            "</h2>" +
            htmlClozeInstructionWithInlineBlanks(g.instruction, g.rows) +
            "</div></div>";
          return;
        }
        const ins = g.instruction.trim();
        const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
        const sp = splitSectionHintAndBody(ins);
        const hintTop = sp.hint
          ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
          : "";
        const mainIns = sp.body || ins;
        const passageHtml = ins
          ? "<div class='cloze-passage-card card'><h2>" +
            esc(gTitle) +
            "</h2>" +
            hintTop +
            "<div class='cloze-passage-text'>" +
            formatPassageParagraphs(mainIns) +
            "</div></div>"
          : "<div class='cloze-passage-card card'><p class='muted'>（本篇暂无导语，请仅根据右侧选项作答。）</p></div>";
        let rightCol =
          "<div class='cloze-options-col'><h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>答题区</h2>";
        g.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          const diaGap = isClozeDialoguePlaceholderStem(it.stem);
          rightCol +=
            "<div class='card q-block cloze-opt-card" +
            (diaGap ? " cloze-dialogue-gap-card" : "") +
            "' data-qkey='" +
            esc(qkey) +
            "'><div class='q'>";
          if (diaGap) {
            rightCol += "<div class='cloze-dialogue-gap-badge'>" + esc(num) + ".</div>";
          } else {
            rightCol += "<div class='q-head'><span class='q-num'>第 " + esc(num) + " 空</span><span class='tag'>cloze</span></div>";
          }
          const layoutC = getObjectiveChoiceLayout(row, it);
          const lettersC = layoutC.letters;
          const optsC = layoutC.opts;
          const abcdOnly = isPassageClozeAbcdLayout(row, it);
          if (lettersC.length) {
            if (!diaGap && !abcdOnly) {
              rightCol += renderStemHtml(it.stem, qkey);
            }
            if (abcdOnly) {
              rightCol += "<div class='opts opts-cloze-abcd'>";
              rightCol += htmlQuizRadioOptionsAbcdGrid(lettersC, optsC, qkey);
            } else {
              rightCol += "<div class='" + quizOptsGridClass(lettersC, optsC) + "'>";
              rightCol += htmlQuizRadioOptions(lettersC, optsC, qkey);
            }
            rightCol += "</div>";
          } else {
            rightCol += renderStemHtml(it.stem, qkey);
          }
          rightCol += "</div></div>";
        });
        rightCol += "</div>";
        html +=
          "<div class='pdf-cloze-unit'><div class='cloze-quiz-layout'><div class='cloze-passage-col'>" +
          passageHtml +
          "</div>" +
          rightCol +
          "</div></div>";
      });
    } else if (t === "reading" && readingGroups.some((g) => g.passage)) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtml;
          if (g.fromSection) {
            passageHtml =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";

            passageHtml =
              "<div class='reading-passage-card card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
