<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;

 <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第17套","exam_meta":{"full_score_text":"满分：20分","time_text":"时间：20分钟"},"sections":[{"section_title":"I. 找出画线部分发音与其他三个不同的一项。","section_instruction":"（共5分）","items":[{"number":"1","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>i\u003c/u>)","options":{"A":"ice","B":"ride","C":"ship","D":"kite"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查元音字母 'i' 在单词中的发音。\n- A选项 `ice` /aɪs/ 中，'i' 发长元音 /aɪ/。\n- B选项 `ride` /raɪd/ 中，'i' 发长元音 /aɪ/。\n- C选项 `ship` /ʃɪp/ 中，'i' 发短元音 /ɪ/。\n- D选项 `kite` /kaɪt/ 中，'i' 发长元音 /aɪ/。\n- 比较可知，A、B、D三项中 'i' 的发音相同，而C项不同。故选C。","knowledge_expansion_md":"元音字母 'i' 的发音规则是自然拼读中的重要一环。\n1.  **发长元音 /aɪ/**：通常出现在“元音+辅音+e”的开音节结构中，如 `like`, `time`, `nice`。也出现在一些以 `-igh` (如 `high`, `night`) 或 `-ind` (如 `kind`, `find`) 结尾的单词中。\n2.  **发短元音 /ɪ/**：通常出现在“辅音+元音+辅音”的闭音节结构中，如 `big`, `sit`, `fish`, `in`。\n3.  **其他发音**：在少数单词中，'i' 也可能发 /iː/ (如 `machine`) 或 /ɜː/ (如 `bird`)。\n\n**易错点**：学生容易混淆 /aɪ/ 和 /ɪ/ 的发音，尤其是在听力辨音和口语表达中。有效的区分方法是记住典型单词，如用 `bike` 代表 /aɪ/，用 `big` 代表 /ɪ/，并通过对比练习来强化记忆。","socratic_tracks":[{"title":"元音字母 i 的发音规则","steps":[{"question":"我们来分别读一下 ice, ride, kite。你听听看，它们里面的 'i' 发音是不是一样的？","hint":"试着模仿 'my', 'bike' 的发音，感受口型从大到小的变化。","takeaway":"在 ice, ride, kite 中，字母 'i' 都发长元音 /aɪ/。"},{"question":"现在我们再读一下 ship。它里面的 'i' 发音和前面三个一样吗？","hint":"对比一下 'sit', 'big' 和 'bike', 'like' 的发音。","takeaway":"在 ship 中，字母 'i' 发短元音 /ɪ/，与其他三个不同。"}]},{"title":"开闭音节辨析","steps":[{"question":"你知道什么是'开音节'和'闭音节'吗？它和元音字母的发音有什么关系？","hint":"想一想 'a' 在 'cake' 和 'cat' 里的发音为什么不一样。","takeaway":"开音节和闭音节是决定元音字母发长音还是短音的关键规则。"},{"question":"我们来分析一下 ride, kite 这两个单词的音节结构。它们属于开音节还是闭音节？","hint":"看看单词末尾是不是 '元音字母+辅音字母+e' 的结构。","takeaway":"ride, kite 都是以 'i+辅音+e' 结尾的相对开音节，所以 'i' 发长音 /aɪ/。"},{"question":"那 ship 这个单词呢？它的音节结构是怎样的？","hint":"ship 是 '辅音+元音+辅音' 的结构吗？","takeaway":"ship 是一个典型的闭音节单词，所以 'i' 发短音 /ɪ/。"}]},{"title":"语音对比练习","steps":[{"question":"除了这道题里的单词，你还能想到哪些包含 /aɪ/ 音的单词？","hint":"想想关于'我'、'喜欢'、'自行车'的单词。","takeaway":"包含 /aɪ/ 音的常见词有 I, my, like, bike, five, time 等。"},{"question":"那包含 /ɪ/ 音的单词呢？","hint":"想想'坐下'、'大的'、'鱼'这些词怎么说。","takeaway":"包含 /ɪ/ 音的常见词有 sit, big, fish, pig, six 等。"},{"question":"现在请你用 'This is a ...' 的句型，分别造两个句子，一个用含 /aɪ/ 音的词，一个用含 /ɪ/ 音的词，并大声读出来。","hint":"比如：This is a big kite.","takeaway":"通过自己造句和朗读，可以加深对 /aɪ/ 和 /ɪ/ 发音区别的记忆。"}]}]}},{"number":"2","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>a\u003c/u> / \u003cu>ay\u003c/u>)","options":{"A":"came","B":"last","C":"play","D":"cake"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查元音字母 'a' 及其组合的发音。\n- A选项 `came` /keɪm/ 中，'a' 在 a_e 结构中发 /eɪ/。\n- C选项 `play` /pleɪ/ 中，字母组合 'ay' 发 /eɪ/。\n- D选项 `cake` /keɪk/ 中，'a' 在 a_e 结构中发 /eɪ/。\n- B选项 `last` /lɑːst/ (英式) 或 /læst/ (美式) 中，'a' 的发音不是 /eɪ/。\n- 比较可知，A、C、D三项的发音中都包含音素 /eɪ/，而B项不同。故选B。","knowledge_expansion_md":"发 /eɪ/ 音的常见字母和字母组合有：\n1.  **a 在开音节中**：通常是 `a + 辅音 + e` 的结构，如 `name`, `make`, `late`。\n2.  **字母组合 ai**：通常出现在单词中间，如 `rain`, `wait`, `train`。\n3.  **字母组合 ay**：通常出现在单词末尾，如 `day`, `say`, `way`。\n\n与此相对，字母 'a' 的其他常见发音包括：\n- **短元音 /æ/**：在闭音节中，如 `cat`, `map`, `apple`。\n- **/ɑː/ 音**：在英式英语中，常出现在 `a + s/f/th` 的结构中，如 `class`, `ask`, `path`。\n\n**易错点**：学生需要注意 `last` 这类词在英美发音中的差异，但在做选择题时，关键是辨别其发音是否属于 /eɪ/ 这一类，而无需过分纠结于具体的英美口音。","socratic_tracks":[{"title":"核心音素 /eɪ/ 的辨认","steps":[{"question":"我们来读一下 came, play, cake 这三个词。你听听它们共同的元音发音是什么？","hint":"这个发音和字母表里字母 A 的读音一样吗？","takeaway":"在 came, play, cake 中，都包含了 /eɪ/ 这个音。"},{"question":"我们再来读一下 last 这个词。它里面的 'a' 发音和前面三个词一样吗？","hint":"试着对比 'cat' 和 'cake' 的发音。","takeaway":"last 中 'a' 的发音是 /ɑː/ 或 /æ/，与 /eɪ/ 不同。"}]},{"title":"发 /eɪ/ 音的字母组合","steps":[{"question":"在 came 和 cake 中，字母 'a' 为什么发 /eɪ/ 音？","hint":"观察一下这两个词的结构，特别是 'a' 后面的部分。","takeaway":"在 'a+辅音+e' 的结构中，'a' 通常发长元音 /eɪ/。"},{"question":"在 play 这个词中，我们看到的是 'ay' 这个字母组合。它发什么音？","hint":"想一想 'day', 'say', 'way' 这些词的发音。","takeaway":"字母组合 'ay' 通常也发 /eɪ/ 音。"},{"question":"你还能想到其他发 /eɪ/ 音的字母或字母组合吗？","hint":"下雨(rain)怎么说？等待(wait)呢？","takeaway":"字母组合 'ai' 也常常发 /eɪ/ 音，如 rain, wait。"}]},{"title":"英美发音差异的理解","steps":[{"question":"你知道单词 last 在英国和美国的发音可能不一样吗？","hint":"试着把嘴巴张大一点发 'a' 音，再试着把嘴巴咧开一点发 'a' 音。","takeaway":"last 在英式英语中发 /lɑːst/，在美式英语中发 /læst/。"},{"question":"虽然英美发音有差异，但无论是 /lɑːst/ 还是 /læst/，它们和 /keɪm/ 中的 /eɪ/ 音一样吗？","hint":"仔细听辨这几个音的区别。","takeaway":"无论英式还是美式发音，last 中的元音都与 came, play, cake 中的 /eɪ/ 音明显不同。"},{"question":"这个例子告诉我们，在做发音题时，最重要的是什么？","hint":"是找到那个'与众不同'的，还是纠结于某一个词的绝对发音？","takeaway":"做发音辨析题的关键是找出相对差异，找到那个与其他选项发音规律不符的单词。"}]}]}},{"number":"3","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>ow\u003c/u>)","options":{"A":"know","B":"show","C":"how","D":"flow"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查字母组合 'ow' 的发音。\n- A选项 `know` /nəʊ/ 中，'ow' 发 /əʊ/ 音。\n- B选项 `show` /ʃəʊ/ 中，'ow' 发 /əʊ/ 音。\n- D选项 `flow` /fləʊ/ 中，'ow' 发 /əʊ/ 音。\n- C选项 `how` /haʊ/ 中，'ow' 发 /aʊ/ 音。\n- 比较可知，A、B、D三项中 'ow' 的发音相同，而C项不同。故选C。","knowledge_expansion_md":"字母组合 'ow' 是一个多音组合，主要有两种发音：\n1.  **发 /əʊ/ (类似 'oh')**：常见于单词末尾，如：`know`, `show`, `flow`, `grow`, `low`, `snow`, `window`。可以记一个口诀“下雪(snow)了，慢慢(slow)地，一排(row)一排(row)地，往下(low)飘，我知道(know)”。\n2.  **发 /aʊ/ (类似 'ouch')**：常见于单词中或词尾，如：`how`, `now`, `cow`, `brown`, `down`, `town`, `flower`。可以记一个口诀“一头黄牛(brown cow)现在(now)怎么样(how)了？它从城里(town)下来(down)了”。\n\n**学习策略**：由于没有绝对的规则可以百分百区分这两种发音，最好的方法结合词义分类记忆。遇到不确定的新词时，要勤查字典确认发音。","socratic_tracks":[{"title":"字母组合 ow 的两种发音","steps":[{"question":"我们来读一下 know, show, flow 这三个词。你听出它们结尾的 'ow' 发音有什么共同点吗？","hint":"这个发音和单词 'go' 的元音一样吗？","takeaway":"在 know, show, flow 中，'ow' 都发 /əʊ/ 音。"},{"question":"现在我们来读 how 这个词。它结尾的 'ow' 发音和前面三个一样吗？","hint":"这个发音和单词 'now' (现在) 的发音一样吗？","takeaway":"在 how 中，'ow' 发 /aʊ/ 音，与 /əʊ/ 不同。"}]},{"title":"归纳与记忆","steps":[{"question":"除了 know, show, flow，你还能想到哪些 'ow' 发 /əʊ/ 音的单词？","hint":"想想'雪'(snow)、'生长'(grow)、'低的'(low)。","takeaway":"发 /əʊ/ 音的 'ow' 单词还有 snow, grow, low, window 等。"},{"question":"那除了 how，你还能想到哪些 'ow' 发 /aʊ/ 音的单词？","hint":"想想'现在'(now)、'奶牛'(cow)、'棕色的'(brown)。","takeaway":"发 /aʊ/ 音的 'ow' 单词还有 now, cow, brown, down, town 等。"},{"question":"既然 'ow' 有两种发音，我们怎么记住哪个词发哪个音呢？","hint":"有没有什么好办法，比如把发音相同的词放在一起记？","takeaway":"对于 'ow' 这种多音组合，最好的方法是分类记忆，将发音相同的单词编成小组一起背诵。"}]},{"title":"易混音辨析","steps":[{"question":"我们来辨析一下 /əʊ/ 和 /aʊ/ 这两个音。发 /əʊ/ 时，你的口型是怎样的？","hint":"先发 /ə/，然后嘴巴慢慢收圆，变成发 /ʊ/ 的口型。","takeaway":"/əʊ/ 是一个双元音，口型由大到小，由不圆到圆。"},{"question":"那发 /aʊ/ 时，口型又是怎样的？","hint":"先发 /a/，然后嘴巴慢慢收拢，滑向 /ʊ/。","takeaway":"/aʊ/ 也是一个双元音，口型也是由大到小，但起始音不同。"},{"question":"请你分别用 /əʊ/ 和 /aʊ/ 的发音去读 'how' 这个词，哪个听起来是正确的？","hint":"你平时说 'How are you?' 的时候是怎么发音的？","takeaway":"通过在熟悉单词中应用发音规则，可以帮助我们确认和巩固正确的发音。"}]}]}},{"number":"4","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>th\u003c/u>)","options":{"A":"nothing","B":"these","C":"fifth","D":"month"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查字母组合 'th' 的两种发音：清辅音 /θ/ 和浊辅音 /ð/。\n- A选项 `nothing` /ˈnʌθɪŋ/ 中，'th' 发清辅音 /θ/。\n- C选项 `fifth` /fɪfθ/ 中，'th' 发清辅音 /θ/。\n- D选项 `month` /mʌnθ/ 中，'th' 发清辅音 /θ/。\n- B选项 `these` /ðiːz/ 中，'th' 发浊辅音 /ð/。\n- 比较可知，A、C、D三项中 'th' 的发音相同，而B项不同。故选B。","knowledge_expansion_md":"字母组合 'th' 的发音是英语学习中的一个难点，区分清辅音和浊辅音是关键。\n- **清辅音 /θ/** (unvoiced): 发音时声带不振动，只有气流声。常见于多数实词（名词、动词、形容词）的词首或词尾，如 `think`, `three`, `thin`, `bath`, `mouth`, `earth`，以及序数词词尾，如 `fourth`, `fifth`。\n- **浊辅音 /ð/** (voiced): 发音时声带振动。常见于一些功能词（冠词、代词、介词、连词）中，如 `the`, `this`, `that`, `these`, `those`, `they`, `them`, `with`, `than`。也出现在少数实词中，如 `weather`, `mother`, `father`, `brother`。\n\n**区分技巧**：将手指放在喉结处，发 /ð/ 时能感到明显的振动，发 /θ/ 时则没有。这个简单的物理方法可以有效帮助学习者辨别和练习。","socratic_tracks":[{"title":"清浊辅音辨析","steps":[{"question":"请你把手轻轻放在喉咙上，然后分别读 'think' 和 'this' 这两个词。你感觉到什么不同了吗？","hint":"感受一下声带有没有振动。","takeaway":"发 'this' 的 'th' (/ð/) 时声带振动，而发 'think' 的 'th' (/θ/) 时声带不振动。"},{"question":"我们用这个方法来检查一下 A, C, D 三个选项：nothing, fifth, month。它们的 'th' 发音时声带振动吗？","hint":"和 'think' 对比一下。","takeaway":"在 nothing, fifth, month 中，'th' 都发不振动的清辅音 /θ/。"},{"question":"现在再检查一下 B 选项 these。它的 'th' 发音时声带振动吗？","hint":"和 'this' 对比一下。","takeaway":"在 these 中，'th' 发振动的浊辅音 /ð/，因此它与众不同。"}]},{"title":"'th' 发音规律总结","steps":[{"question":"观察一下 B 选项 these。它是一个什么类型的词？","hint":"是指示'这些'的词，属于哪一类词性？","takeaway":"these 是一个指示代词，属于功能词。"},{"question":"再看看我们熟悉的 the, this, that, they, them。它们有什么共同点？'th' 都发什么音？","hint":"它们都是代词、冠词等，都发浊辅音 /ð/。","takeaway":"以 'th' 开头的功能词（如代词、冠词、连词）通常发浊辅音 /ð/。"},{"question":"再看 A, C, D 选项：nothing (名词), fifth (序数词), month (名词)。它们都是有实际意义的实词。这和它们的 'th' 发音有什么关系？","hint":"回忆一下 'think', 'three', 'mouth' 这些词。","takeaway":"在大多数实词中，'th' 通常发清辅音 /θ/。"}]},{"title":"发音动作练习","steps":[{"question":"我们来练习发清辅音 /θ/。请把舌尖轻轻放在上下牙齿之间，然后送气，不要让声带振动。","hint":"想象一下说 'three' (三) 这个词的开头。","takeaway":"发 /θ/ 的关键是舌尖轻触上齿，只送气，不振动声带。"},{"question":"现在我们来练习发浊辅音 /ð/。保持刚才的口型和舌位不变，但在送气的同时，让你的声带振动起来。","hint":"想象一下说 'the' 这个词。","takeaway":"发 /ð/ 的关键是在 /θ/ 的基础上，加入声带的振动。"},{"question":"请你用 'I think...' 和 'This is...' 分别造两个句子，并大声读出来，注意 'th' 的正确发音。","hint":"例如：I think this is a good idea.","takeaway":"通过在句子中练习，可以更好地掌握清浊辅音 /θ/ 和 /ð/ 的区别和应用。"}]}]}},{"number":"5","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>ear\u003c/u>)","options":{"A":"year","B":"near","C":"bear","D":"dear"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查字母组合 `ear` 的发音。在选项 A `year`、B `near` 和 D `dear` 中，`ear` 均发双元音 /ɪər/。而在选项 C `bear` 中，`ear` 发的是另一个双元音 /eər/。因此，C 选项的发音与其他三项不同，是正确答案。","knowledge_expansion_md":"字母组合 `ear` 的发音有多种情况，需要重点记忆：\n1.  发 /ɪər/：这是最常见的发音之一，如 `hear` (听见), `clear` (清楚的), `fear` (害怕), `tear` (眼泪)。\n2.  发 /eər/：这也是一种常见的发音，如 `wear` (穿), `pear` (梨), `swear` (发誓)。\n3.  发 /ɜː/：在一些单词中，`ear` 发这个音，如 `learn` (学习), `earth` (地球), `search` (搜索)。\n\n记忆技巧：可以通过押韵词组来记忆，例如 `near, dear, clear` 一组，`bear, wear, pear` 另一组。","socratic_tracks":[{"title":"辨析 'ear' 的核心发音","steps":[{"question":"请分别读出 A、B、D 三个选项：year, near, dear。你听到了什么共同的元音？","hint":"这个发音听起来很像“耳朵” `ear` 这个单词本身的读音。","takeaway":"在 `year`, `near`, `dear` 中，字母组合 'ear' 都发 /ɪər/ 这个音。"},{"question":"现在，请读出 C 选项 `bear`。你觉得它的发音和前面三个词的结尾部分一样吗？","hint":"试着把它和“穿” `wear` 这个词的发音比较一下。","takeaway":"在 `bear` 中，'ear' 发的是 /eər/ 音，这与 /ɪər/ 是不同的。"}]},{"title":"通过同韵词巩固记忆","steps":[{"question":"除了 `near` 和 `dear`，你还能想到哪些 `ear` 发 /ɪər/ 音的单词吗？","hint":"想一想“听见”、“清楚的”、“眼泪”用英语怎么说。","takeaway":"`hear`, `clear`, `tear` (眼泪) 都是 `ear` 发 /ɪər/ 音的例子。"},{"question":"那么，除了 `bear`，你还能想到哪些 `ear` 发 /eər/ 音的单词吗？","hint":"想一想“穿戴”和水果“梨”的英文单词。","takeaway":"`wear` 和 `pear` 都是 `ear` 发 /eər/ 音的例子。"}]},{"title":"拓展 'ear' 的其他发音","steps":[{"question":"我们学习了 `ear` 的两种发音，你还见过它的其他发音吗？比如在 `earth` (地球) 这个词里？","hint":"试着读一下 `learn` (学习) 这个词，感受一下 `ear` 的发音。","takeaway":"在 `earth`, `learn`, `search` 等词中，`ear` 还可以发 /ɜː/ 的音。"},{"question":"既然 `ear` 有这么多发音，当遇到一个不认识的含 `ear` 的单词时，最好的方法是什么？","hint":"我们有什么工具可以帮助我们确定一个单词的准确发音？","takeaway":"遇到不确定的发音时，查阅词典是最好、最准确的学习方法。"}]}]}},{"number":"6","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>ea\u003c/u> / \u003cu>ee\u003c/u>)","options":{"A":"easy","B":"sea","C":"weather","D":"bee"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查对元音发音的辨析。选项 A `easy`、B `sea` 中的 `ea` 和选项 D `bee` 中的 `ee`，它们的发音都是长元音 /iː/。而选项 C `weather` 中的 `ea` 发的是短元音 /e/。因此，C 选项的发音与其他三项不同。","knowledge_expansion_md":"字母组合 `ea` 是一个发音多变的组合，主要有以下几种情况：\n1.  发长元音 /iː/：这是最常见的一种，如 `eat` (吃), `read` (读，现在时), `tea` (茶), `speak` (说)。\n2.  发短元音 /e/：这也是一种非常常见的发音，如 `bread` (面包), `head` (头), `heavy` (重的), `ready` (准备好的)。\n3.  发双元音 /eɪ/：这种情况比较少，属于特殊情况，需要特别记忆，如 `great` (伟大的), `break` (打破)。\n\n相比之下，字母组合 `ee` 的发音则非常稳定，绝大多数情况下都发长元音 /iː/，如 `see` (看见), `meet` (遇见), `three` (三)。","socratic_tracks":[{"title":"辨析核心音素","steps":[{"question":"请读出 A、B、D 三个选项：easy, sea, bee。你听出它们画线部分有什么共同的发音吗？","hint":"这个音听起来像字母 E 本身的发音，而且拖得比较长。","takeaway":"在 `easy`, `sea`, `bee` 中，画线部分都发长元音 /iː/。"},{"question":"现在读出 C 选项 `weather`。它画线部分 `ea` 的发音和前面三个一样吗？","hint":"试着把它和 `head` (头) 这个词里的 `ea` 发音做比较。","takeaway":"在 `weather` 中，`ea` 发的是短元音 /e/，与其他三个选项都不同。"}]},{"title":"归类记忆 'ea' 的发音","steps":[{"question":"除了 `easy` 和 `sea`，你还能举出一些 `ea` 发 /iː/ (长音) 的例子吗？","hint":"想想我们每天都要做的动作“吃”和“喝茶”。","takeaway":"`eat`, `tea`, `speak`, `read` (现在时) 等词中的 `ea` 都发 /iː/。"},{"question":"那除了 `weather`，你还能举出一些 `ea` 发 /e/ (短音) 的例子吗？","hint":"想想早餐吃的“面包”和我们身体上的“头”。","takeaway":"`bread`, `head`, `ready` 等词中的 `ea` 都发 /e/。"}]},{"title":"拓展 'ea' 的特殊发音","steps":[{"question":"你认识 `great` (伟大的) 这个词吗？它里面的 `ea` 发什么音？是 /iː/ 或 /e/ 吗？","hint":"这个音听起来像字母 A 的发音。","takeaway":"在 `great`, `break` 等少数单词中，`ea` 会特殊地发 /eɪ/ 音。"},{"question":"通过今天的学习，我们知道 `ea` 至少有三种发音，这告诉我们在学习单词时应该注意什么？","hint":"我们不能只看字母组合，就想当然地认为它只有一个读音。","takeaway":"学习单词时要耳、口、眼、手并用，尤其要注意记忆那些不符合一般规律的特殊发音。"}]}]}},{"number":"7","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>o\u003c/u>)","options":{"A":"on","B":"hot","C":"body","D":"open"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查字母 `o` 在单词中的发音。在选项 A `on`、B `hot` 和 C `body` 中，字母 `o` 都处于重读闭音节中，发短元音 /ɒ/。而在选项 D `open` 中，字母 `o` 处于重读开音节中，发其字母本身的音，即双元音 /əʊ/。因此，D 选项的发音与其他三项不同。","knowledge_expansion_md":"字母 `o` 的发音与其所在的音节类型密切相关：\n1.  **在重读闭音节中**：通常发短元音 /ɒ/。闭音节指元音字母后有辅音字母（或字母组合）结尾的音节。例如：`dog`, `box`, `stop`, `clock`。\n2.  **在重读开音节中**：通常发双元音 /əʊ/。开音节指以元音字母结尾的音节。例如：`go`, `no`, `so`。在 `o_e` 结构（相对开音节）中，`o` 也发 /əʊ/，如 `home`, `note`, `phone`。\n3.  **特殊发音**：字母 `o` 还有一些不规则发音，需要特别记忆。例如：\n    * 发 /ʌ/：`come`, `son`, `love`, `month`\n    * 发 /uː/：`do`, `to`, `who`\n    * 发 /ʊ/：`woman`","socratic_tracks":[{"title":"辨析开闭音节中的 'o' 音","steps":[{"question":"请读出 A、B、C 三个选项：on, hot, body。你注意到画线的字母 'o' 发音有什么共同点吗？","hint":"这个发音比较短促，嘴巴需要张成圆形。","takeaway":"在 `on`, `hot`, `body` 中，字母 'o' 都发短元音 /ɒ/。"},{"question":"现在读出 D 选项 `open`。它画线字母 'o' 的发音和前面三个一样吗？","hint":"这个音听起来和 `go` 或 `no` 里的 'o' 发音一样吗？","takeaway":"在 `open` 中，字母 'o' 发的是双元音 /əʊ/，与其他三个选项不同。"},{"question":"为什么 `hot` 里的 'o' 和 `open` 里的 'o' 发音不同？观察一下 'o' 在单词中的位置。","hint":"`hot` 里的 'o' 后面有辅音字母 't' 把它“关”起来了，而 `open` 里的 'o' 后面没有。","takeaway":"字母 'o' 在闭音节中常发 /ɒ/，在开音节中常发 /əʊ/。"}]},{"title":"巩固开闭音节发音规则","steps":[{"question":"你能再举出几个字母 'o' 在闭音节中发 /ɒ/ 音的例子吗？","hint":"想一想“盒子”、“狗”、“停”这些单词。","takeaway":"`box`, `dog`, `stop` 都是字母 'o' 在闭音节中发 /ɒ/ 的典型例子。"},{"question":"那你能再举出几个字母 'o' 在开音节或类似结构（如 o-e）中发 /əʊ/ 音的例子吗？","hint":"想一想“家”、“鼻子”、“电话”这些单词。","takeaway":"`home`, `nose`, `phone` 都是字母 'o' 发 /əʊ/ 的典型例子。"}]},{"title":"拓展 'o' 的不规则发音","steps":[{"question":"在 `come` 和 `son` 这两个词中，字母 'o' 发什么音？它符合我们刚才总结的规律吗？","hint":"这个音听起来像 `up` 里面的 `u` 的发音。","takeaway":"在 `come`, `son`, `love` 等词中，'o' 特殊地发 /ʌ/ 音，需要单独记忆。"},{"question":"在 `do` 和 `to` 这两个词中，'o' 又发什么音呢？","hint":"这个音听起来像 `blue` 里面的 `ue` 的发音。","takeaway":"在 `do`, `to`, `who` 等词中，'o' 特殊地发 /uː/ 音，也需要我们特别注意。"}]}]}},{"number":"8","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>u\u003c/u> / \u003cu>ue\u003c/u>)","options":{"A":"blue","B":"number","C":"up","D":"umbrella"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查字母 `u` 的发音。在选项 B `number`、C `up` 和 D `umbrella` 中，字母 `u` 都处于重读闭音节中，发短元音 /ʌ/。而在选项 A `blue` 中，字母组合 `ue` 发的是长元音 /uː/。因此，A 选项的发音与其他三项不同。","knowledge_expansion_md":"字母 `u` 的发音同样与音节类型密切相关：\n1.  **在重读闭音节中**：通常发短元音 /ʌ/。例如：`bus` (公共汽车), `cup` (杯子), `run` (跑), `subject` (科目)。\n2.  **在重读开音节或特定组合中**：通常发长元音 /uː/ 或 /juː/。\n    * 发 /uː/：通常在字母 `l`, `r`, `j` 之后，如 `blue` (蓝色), `ruler` (尺子), `June` (六月), `fruit` (水果)。\n    * 发 /juː/：在很多其他情况下发此音，听起来像 `y`+`u`，如 `use` (使用), `student` (学生), `music` (音乐), `excuse` (借口)。\n3.  **特殊发音**：\n    * 发 /ʊ/：`put`, `full`, `pull`。\n    * 发 /ɪ/：`busy`。","socratic_tracks":[{"title":"辨析 'u' 的核心发音","steps":[{"question":"请读出 B、C、D 三个选项：number, up, umbrella。你听出它们画线部分 'u' 的共同发音了吗？","hint":"这个发音很短，嘴巴放松，舌头位置较低。","takeaway":"在 `number`, `up`, `umbrella` 中，字母 'u' 都发短元音 /ʌ/。"},{"question":"现在读出 A 选项 `blue`。它画线部分的发音和前面三个一样吗？","hint":"这个音拖得比较长，嘴唇要收圆前凸。可以和 `ruler` (尺子) 里的 `u` 比较一下。","takeaway":"在 `blue` 中，字母组合 `ue` 发的是长元音 /uː/，与其他三个选项不同。"}]},{"title":"运用开闭音节规则","steps":[{"question":"观察 `up`, `number` 这些词，字母 'u' 后面是不是都有辅音字母？这叫什么音节？","hint":"元音被辅音“关”起来了，所以是闭音节。","takeaway":"在重读闭音节中，字母 'u' 通常发短元音 /ʌ/。"},{"question":"在 `blue` 这个词里，`ue` 这个组合通常发什么音？你能再举一个例子吗？","hint":"想一想“胶水” `glue` 或者“真的” `true`。","takeaway":"字母组合 `ue` 通常发长元音 /uː/。"}]},{"title":"区分 'u' 的两种长元音","steps":[{"question":"我们知道 `blue` 里的 `u` 发 /uː/。那 `use` (使用) 这个词里的 `u` 发什么音？听起来有什么不同？","hint":"仔细听，`use` 的开头是不是多了一个类似 `y` 的音？","takeaway":"在 `use`, `music`, `student` 等词中，字母 'u' 发 /juː/ 音。"},{"question":"什么时候发 /uː/，什么时候发 /juː/ 呢？观察一下 `blue`, `ruler` 和 `use`, `music` 中 `u` 前面的字母。","hint":"在 `l` 和 `r` 后面，`y` 的音好像被“吃掉”了。","takeaway":"一个简单的规律是：当 `u` 在 `l`, `r`, `j` 等字母后时常发 /uː/，在其他很多辅音后则发 /juː/。"}]}]}},{"number":"9","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>ur\u003c/u> / \u003cu>ir\u003c/u> / \u003cu>ar\u003c/u>)","options":{"A":"nurse","B":"bird","C":"card","D":"shirt"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考察元音字母组合的发音。\n- A选项 `nurse` 中 `ur` 的发音是 /ɜː/。\n- B选项 `bird` 中 `ir` 的发音是 /ɜː/。\n- D选项 `shirt` 中 `ir` 的发音是 /ɜː/。\n- C选项 `card` 中 `ar` 的发音是 /ɑː/。\n- A、B、D三项划线部分发音相同，C项不同。故选C。","knowledge_expansion_md":"在英语中，有一些固定的字母组合常常对应着特定的发音，但也存在例外，需要多记忆。\n1.  **发 /ɜː/ 音的常见字母组合**：\n    * `ir` (如: bird, girl, shirt, first)\n    * `ur` (如: nurse, turn, fur, Thursday)\n    * `er` (在重读音节中，如: her, person, serve)\n    * `ear` (在少数词中，如: learn, earth, search)\n2.  **发 /ɑː/ 音的常见字母组合**：\n    * `ar` (如: card, car, park, farm)\n3.  **易错点**：注意区分 /ɜː/ (her) 和 /ə/ (teacher) 的发音，前者是重读长元音，后者是轻读短元音。同时也要注意 `ar` 在 `w` 后面发音会变化，如 `warm` /wɔːm/。","socratic_tracks":[{"title":"核心音素辨析","steps":[{"question":"请你依次读出 nurse, bird, shirt 这三个词，仔细听它们中间元音的发音，感觉像不像同一个音？","hint":"它们听起来都像中文里“饿”的拉长音。","takeaway":"字母组合 ir 和 ur 在这些单词中都发 /ɜː/ 这个音。"},{"question":"现在读一下 card 这个词，它的元音发音和前面三个词还一样吗？","hint":"试着读一下 car (小汽车)，park (公园)，感受一下 ar 的发音。","takeaway":"字母组合 ar 在这个词中发 /ɑː/ 音，听起来像“啊”的长音。"},{"question":"对比 /ɜː/ 和 /ɑː/ 这两个音，现在你能找出哪个选项的发音是与众不同的吗？","hint":"一个发音时嘴巴扁平，一个发音时嘴巴张得更大。","takeaway":"通过辨别 /ɜː/ 和 /ɑː/ 两个核心元音，就能确定C选项是发音不同的那一个。"}]},{"title":"发音规则归纳","steps":[{"question":"除了题目中的 `bird` 和 `shirt`，你还能想到其他包含 `ir` 且发 /ɜː/ 音的单词吗？","hint":"比如“女孩”或者“第一个”怎么说？","takeaway":"通过联想 girl, first 等词，可以巩固 `ir` 发 /ɜː/ 音的规则。"},{"question":"同样地，除了 `nurse`，还有哪些包含 `ur` 且发 /ɜː/ 音的单词？","hint":"比如“转弯”或者“皮毛”怎么说？","takeaway":"通过联想 turn, fur 等词，可以巩固 `ur` 发 /ɜː/ 音的规则。"},{"question":"那么，包含 `ar` 且发 /ɑː/ 音的单词是不是也很多呢？","hint":"比如“农场”或者“手臂”怎么说？","takeaway":"联想 farm, arm 等词，可以加深对 `ar` 发 /ɑː/ 音规则的记忆。"}]},{"title":"易混音辨析","steps":[{"question":"我们来对比两个词的发音：shirt /ʃɜːt/ 和 short /ʃɔːt/。你能听出它们元音部分的区别吗？","hint":"注意听元音，一个是 /ɜː/，一个是 /ɔː/。","takeaway":"/ɜː/ 和 /ɔː/ 是常见的易混淆元音，需要通过对比练习来准确区分。"},{"question":"再来对比一下 card /kɑːd/ 和 cat /kæt/。它们的元音 /ɑː/ 和 /æ/ 有什么不同？","hint":"感受一下发音时嘴巴张开的大小和舌头的位置。","takeaway":"掌握元音发音的口型和舌位是准确发音的关键，/ɑː/ 比 /æ/ 嘴巴张得更大，舌位更靠后。"}]}]}},{"number":"10","item_type":"phonetics","context_note":"","stem":"(测试发音: \u003cu>oo\u003c/u>)","options":{"A":"look","B":"room","C":"zoo","D":"food"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考察字母组合 `oo` 的两种常见发音。\n- B选项 `room` 中 `oo` 的发音是长元音 /uː/。\n- C选项 `zoo` 中 `oo` 的发音是长元音 /uː/。\n- D选项 `food` 中 `oo` 的发音是长元音 /uː/。\n- A选项 `look` 中 `oo` 的发音是短元音 /ʊ/。\n- B、C、D三项划线部分发音相同，A项不同。故选A。","knowledge_expansion_md":"字母组合 `oo` 的发音是小升初阶段的重点和难点。\n1.  **发长元音 /uː/**：这是 `oo` 最常见的发音之一。例如：`room`, `zoo`, `food`, `moon`, `school`, `cool`。\n2.  **发短元音 /ʊ/**：这种发音也比较常见，尤其是在字母 `k` 前面。例如：`look`, `book`, `cook`, `good`, `wood`, `foot`。\n3.  **特殊发音**：还有少数单词中的 `oo` 发音比较特殊，需要单独记忆。例如：\n    * 发 /ʌ/ 音：`blood`, `flood`。\n    * 发 /ɔː/ 音：`door`, `floor`。","socratic_tracks":[{"title":"oo 的两种发音","steps":[{"question":"请你读一下 room, zoo, food 这三个词，注意听划线部分 `oo` 的发音，它们听起来是不是一样的？","hint":"它们的发音都像中文里“乌”的拉长音。","takeaway":"字母组合 `oo` 在这些词中都发长元音 /uː/。"},{"question":"现在，我们来读 A 选项的 `look`。你觉得它的 `oo`发音和刚才那三个词一样长吗？","hint":"对比一下 `food` 和 `look`，一个长，一个短。","takeaway":"在 `look` 中，`oo` 发的是短元音 /ʊ/。"},{"question":"既然我们找到了一个短音 /ʊ/ 和三个长音 /uː/，那么哪个选项是与众不同的呢？","hint":"找出那个发音短促的单词。","takeaway":"通过辨别 `oo` 发长音 /uː/ 还是短音 /ʊ/，就能确定A选项是正确答案。"}]},{"title":"发音规律探索","steps":[{"question":"我们观察一下发短音 /ʊ/ 的几个词：look, book, cook。你发现它们有什么共同的结构特点吗？","hint":"看看 `oo` 后面都跟着哪个字母？","takeaway":"当 `oo` 后面跟着字母 `k` 时，通常会发短音 /ʊ/。"},{"question":"这个规律是不是绝对的呢？我们再看看 `good`, `wood`, `foot`，它们也发短音 /ʊ/，但后面不是 `k`。","hint":"这说明 `oo` 后面跟 `k` 发短音只是一个高频规律，但不是唯一情况。","takeaway":"语音规则多为规律总结，而非绝对真理，需要结合具体单词进行记忆。"},{"question":"除了 `oo`，还有哪些字母或组合可以发长音 /uː/？","hint":"比如单词 `blue` (蓝色) 或者 `fruit` (水果)。","takeaway":"同一个音可以由不同的字母或字母组合来表示，如 `ue`, `ui` 等也可以发 /uː/ 音。"}]},{"title":"最小音差对练习","steps":[{"question":"我们来读一组发音很像的词：pool /puːl/ (水池) 和 pull /pʊl/ (拉)。你能听出并模仿它们元音的区别吗？","hint":"注意元音的长短，一个是 /uː/，一个是 /ʊ/。","takeaway":"通过 `pool` 和 `pull` 这样的最小音差对练习，可以有效训练我们对相近音素的辨别能力。"},{"question":"再来一组：Luke /luːk/ (人名卢克) 和 look /lʊk/ (看)。再次感受一下长短音的区别。","hint":"一个是人名，一个是动词，意思完全不同。","takeaway":"准确区分 /uː/ 和 /ʊ/ 不仅能帮助做对语音题，还能避免日常交流中的听力误解和口语错误。"}]}]}}]},{"section_title":"II. 请写出下列所给单词的一个同类词。","section_instruction":"（共2.5分）","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"plane, subway, _____","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"bus|car|train|ship|bike|boat|taxi","explanation_md":"本题考察词汇的分类能力。\n题目中给出的单词是 `plane` (飞机) 和 `subway` (地铁)。\n分析这两个单词可以发现，它们都属于“交通工具” (transportation) 这一类别。\n因此，我们需要填写另一个属于交通工具的单词。\n例如 `bus` (公交车)、`car` (汽车)、`train` (火车)、`ship` (轮船)、`bike` (自行车) 等都是正确的答案。","knowledge_expansion_md":"在英语学习中，按类别记忆单词是一种非常高效的方法。关于“交通工具”(Transportation)，我们可以进行如下拓展：\n1.  **陆地交通 (Land Transport)**: `car` (汽车), `bus` (公交车), `taxi` (出租车), `train` (火车), `bike`/`bicycle` (自行车), `motorcycle` (摩托车)。\n2.  **空中交通 (Air Transport)**: `plane`/`airplane` (飞机), `helicopter` (直升机)。\n3.  **水上交通 (Water Transport)**: `ship` (轮船), `boat` (小船), `ferry` (渡轮)。\n4.  **相关动词搭配**：\n    * `take`: take a bus/ a train/ a plane\n    * `ride`: ride a bike/ a horse\n    * `drive`: drive a car\n    * `fly`: fly a plane (指驾驶)/ fly in a plane (指乘坐)\n5.  **表达方式**：用介词 `by` + 交通工具名词（名词前不加冠词）来表示出行方式，如 `go to school by bus`。注意“步行”是 `on foot`。","socratic_tracks":[{"title":"词汇分类识别","steps":[{"question":"我们先看看已知的两个单词：plane 和 subway。它们分别是什么意思？","hint":"一个在天上飞，一个在地下跑。","takeaway":"`plane` 是飞机，`subway` 是地铁。"},{"question":"飞机和地铁有什么共同点？我们可以把它们归为哪一类事物？","hint":"它们都能帮助我们从一个地方去到另一个地方。","takeaway":"它们都属于“交通工具”这一类别。"},{"question":"那么，你还能想到哪些其他的交通工具来填在这个横线上呢？","hint":"想一想你平时上学或出门会用到哪些交通工具。","takeaway":"只要是表示交通工具的单词，比如 bus, car, train, bike 等，都可以作为正确答案。"}]},{"title":"交通方式表达","steps":[{"question":"如果我们想说“我乘公交车去上学”，英语应该怎么说？","hint":"可以用动词 `take` 或者介词 `by`。","takeaway":"我们可以说 \"I take a bus to school.\" 或者 \"I go to school by bus.\"。"},{"question":"“take a bus” 和 “by bus” 在用法上有什么细微的区别吗？","hint":"一个前面是动词，一个前面是介词；一个有名词的单复数和冠词，一个没有。","takeaway":"`take` 是动词，后面跟具体的交通工具（常加冠词a/an）；`by` 是介词，表示方式，后面直接跟交通工具名词（通常不加冠词）。"},{"question":"那“走路”和“骑自行车”应该用什么动词呢？","hint":"走路用脚，自行车用“骑”。","takeaway":"我们通常说 `walk to school` (走路去上学) 和 `ride a bike` (骑自行车)。"}]},{"title":"场景词汇联想","steps":[{"question":"想象一下你在一个大城市的火车站(train station)，除了火车(train)，你还会看到哪些交通工具？","hint":"人们出站后会换乘什么交通工具回家或去别的地方？","takeaway":"在火车站附近，我们可能会看到 bus (公交车), taxi (出租车), subway (地铁入口)等。"},{"question":"如果是在一个港口(port/harbor)呢？你会看到什么？","hint":"在水上航行的交通工具。","takeaway":"在港口，我们会看到 ship (轮船), boat (小船), ferry (渡轮)等。"},{"question":"如果是在机场(airport)呢？","hint":"除了 plane，还有没有可能看到别的飞行器？","takeaway":"在机场，我们主要看到 plane (飞机)，有时也可能看到 helicopter (直升机)。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"driver, policeman, _____","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"teacher|doctor|nurse|farmer|worker|cook|singer|actor","explanation_md":"本题考察词汇的分类能力。\n题目中给出的单词是 `driver` (司机) 和 `policeman` (警察)。\n分析这两个单词可以发现，它们都属于“职业” (job/occupation) 这一类别。\n因此，我们需要填写另一个属于职业的单词。\n例如 `teacher` (老师)、`doctor` (医生)、`nurse` (护士)、`farmer` (农民) 等都是正确的答案。","knowledge_expansion_md":"按“职业”类别来记忆和拓展词汇非常重要。\n1.  **常见职业词汇**：\n    * **教育医疗**: `teacher` (老师), `doctor` (医生), `nurse` (护士), `dentist` (牙医)\n    * **公共服务**: `policeman`/`policewoman` (警察), `fireman`/`firefighter` (消防员), `postman` (邮递员)\n    * **其他**: `farmer` (农民), `worker` (工人), `driver` (司机), `cook`/`chef` (厨师), `singer` (歌手), `actor`/`actress` (演员), `engineer` (工程师)\n2.  **询问职业的句型**：\n    * `What do you do?` / `What's your job?` (你是做什么工作的？)\n    * `What does he/she do?` (他/她是做什么工作的？)\n3.  **回答职业的句型**：\n    * `I'm a/an ...` (我是一名...)\n    * `He's/She's a/an ...` (他/她是一名...)\n    * **注意**: 职业是可数名词，前面通常要加不定冠词 `a` 或 `an`。元音音素开头的单词前用 `an` (如 `an actor`, `an engineer`)，辅音音素开头的单词前用 `a` (如 `a teacher`, `a doctor`)。","socratic_tracks":[{"title":"职业词汇归类","steps":[{"question":"我们看看这两个词：driver 和 policeman。它们分别指代什么样的人？","hint":"一个是开车的人，一个是维护治安的人。","takeaway":"`driver` 是司机，`policeman` 是警察。"},{"question":"司机和警察这两个词，有什么共同点？它们都在描述人的哪一种身份？","hint":"这都是人们的工作。","takeaway":"它们都属于“职业”这一类别。"},{"question":"现在，请你说出一个你知道的其他职业的英文单词。","hint":"想一想在学校、医院里工作的人，或者你的爸爸妈妈是做什么工作的。","takeaway":"任何表示职业的单词，如 teacher, doctor, nurse, farmer 等，都是正确的答案。"}]},{"title":"职业的构成与表达","steps":[{"question":"观察一下 `drive` (开车) -> `driver` (司机)，`teach` (教书) -> `teacher` (老师)。你发现了什么规律吗？","hint":"看看动词后面加了什么后缀？","takeaway":"很多职业名词可以通过在动词后面加上 `-er` 或 `-or` 构成。"},{"question":"当别人问你 “What does your father do?” 时，你应该怎么回答？","hint":"这句话是问你爸爸的职业。","takeaway":"应该用句型 \"He is a/an [职业名词].\" 来回答，例如 \"He is a doctor.\"。"},{"question":"为什么回答时有时用 `a`，有时用 `an`？比如 `a teacher` 和 `an actor`。","hint":"这取决于职业名词开头的第一个音是元音还是辅音。","takeaway":"如果职业名词的第一个音是元音音素，用 `an`；如果是辅音音素，用 `a`。"}]},{"title":"工作地点与职业","steps":[{"question":"A doctor works in a hospital. (医生在医院工作)。那么，a teacher 在哪里工作？","hint":"我们每天上学的地方。","takeaway":"A teacher works in a school. (老师在学校工作)。"},{"question":"A farmer (农民) 在哪里工作？","hint":"种植庄稼和饲养动物的地方。","takeaway":"A farmer works on a farm. (农民在农场工作)。"},{"question":"反过来想，在 a police station (警察局) 工作的人是谁？","hint":"题目里出现过这个职业。","takeaway":"A policeman or a policewoman works in a police station. (警察在警察局工作)。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"happy, angry, _____","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"sad|tired|excited|worried|bored","explanation_md":"题干中的 `happy` (高兴的) 和 `angry` (生气的) 都是用来描述情绪或感觉的形容词。\n\n因此，我们需要在横线上填写一个与它们同类的词，也就是另一个描述情绪的形容词。\n\n例如 `sad` (伤心的)、`tired` (疲倦的)、`excited` (兴奋的)、`worried` (担心的) 等都是正确的答案。\n\n这些词都属于情感形容词这一类别。","knowledge_expansion_md":"### 情感类形容词拓展\n\n在英语中，描述情感、情绪或感觉的形容词非常丰富。它们通常与系动词（如 be, feel, look, seem）连用，构成“主语 + 系动词 + 形容词”的结构，来说明主语的状态。\n\n**常见情感形容词：**\n* **正面情绪：** `happy` (高兴的), `excited` (兴奋的), `glad` (开心的), `pleased` (满意的), `proud` (自豪的)\n* **负面情绪：** `sad` (伤心的), `angry` (生气的), `upset` (难过的), `worried` (担心的), `scared` (害怕的), `lonely` (孤独的)\n* **身体感受：** `tired` (疲倦的), `sleepy` (困倦的), `hungry` (饥饿的), `thirsty` (口渴的), `sick` (生病的)\n\n**易错点：**\n注意区分形容词和名词。例如：`happy` (高兴的) 是形容词，而 `happiness` (幸福) 是名词；`angry` (生气的) 是形容词，而 `anger` (愤怒) 是名词。\n\n**例句：**\n* `I feel happy today.` (我今天感到很高兴。)\n* `He looks tired.` (他看起来很累。)","socratic_tracks":[{"title":"词性与分类","steps":[{"question":"`happy` 和 `angry` 这两个词是用来做什么的？它们描述的是什么？","hint":"当你说 “I am happy” 的时候，`happy` 是在说明你的什么？","takeaway":"它们是形容词，用来描述人或事物的情绪或状态。"},{"question":"既然它们都是描述情绪的形容词，那我们应该找一个什么样的词填进去呢？","hint":"是不是也应该是一个描述情绪的词？比如“难过”用英语怎么说？","takeaway":"我们需要填写另一个描述情绪的形容词，比如 sad, tired, excited 等。"}]},{"title":"句子应用","steps":[{"question":"你能用 `happy` 造一个句子吗？","hint":"比如，“我今天很高兴”。","takeaway":"我们可以说 “I am happy.”，这里的 `happy` 是形容词。"},{"question":"那用 `angry` 呢？句子的结构是不是很像？","hint":"比如，“他很生气”。","takeaway":"同样，我们可以说 “He is angry.”，句型结构是“主语 + be动词 + 形容词”。"},{"question":"那么，我们填入的词是不是也应该能放进 “She is ____.” 这个句子里呢？","hint":"试试看 “She is sad.” 通顺吗？","takeaway":"我们要找的词必须能用在 “主语 + be动词 + ___” 结构中，来描述主语的状态。"}]},{"title":"反义词联想","steps":[{"question":"`happy` 的反义词是什么？","hint":"高兴的反面是什么？","takeaway":"`happy` (高兴的) 的反义词是 `sad` (伤心的)。"},{"question":"`sad` 这个词是不是也用来描述一种情绪？它和 `happy`, `angry` 是不是一类词？","hint":"想一想 `sad` 能不能像 `happy` 一样放在 “I feel ___.” 这个句子里。","takeaway":"是的，`sad` 也是描述情绪的形容词，通过联想反义词，我们也能找到符合条件的同类词。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"apple, banana, _____","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"orange|pear|grape|strawberry|peach|lemon|mango","explanation_md":"题干中给出的单词 `apple` (苹果) 和 `banana` (香蕉) 都是水果的名称。\n\n因此，这道题要求我们填写另一个属于“水果”类别的单词。\n\n我们可以填写任何一种常见水果的英文名称。\n\n例如 `orange` (橙子)、`pear` (梨)、`grape` (葡萄)、`strawberry` (草莓) 等都是正确的答案。","knowledge_expansion_md":"### 水果类名词拓展\n\n英语中关于水果的词汇非常丰富，掌握它们是日常交流的基础。\n\n**常见水果词汇：**\n* `orange` (橙子), `pear` (梨), `grape` (葡萄)\n* `strawberry` (草莓), `watermelon` (西瓜), `peach` (桃子)\n* `lemon` (柠檬), `mango` (芒果), `cherry` (樱桃)\n\n**语法点：可数与不可数**\n* 大多数水果名词是**可数名词**，有单数和复数形式。例如：`an apple` (一个苹果), `two apples` (两个苹果)；`a strawberry` (一颗草莓), `some strawberries` (一些草莓)。注意 `strawberry` 的复数形式是 `strawberries` (y变i加es)。\n* 当把“水果”作为一个集合概念时，`fruit` 可以是**不可数名词**。例如：`I like fruit.` (我喜欢水果。)\n* 当指“多种水果”时，`fruit` 也可以用作**可数名词**。例如：`We have many kinds of fruits here.` (我们这里有许多种水果。)","socratic_tracks":[{"title":"物品分类","steps":[{"question":"`apple` 和 `banana` 是什么东西？","hint":"它们是可以吃的一种食物，通常长在树上或植物上。","takeaway":"它们都是水果 (fruit)。"},{"question":"那你还能想到哪些其他的水果？用英语怎么说？","hint":"比如橙子、梨、草莓？","takeaway":"我们需要填写另一个水果的英文名称，比如 orange, pear, grape 等。"}]},{"title":"场景联想","steps":[{"question":"你通常在什么地方能看到 `apple` 和 `banana`？","hint":"想一想你去买东西的地方，比如超市。","takeaway":"我们通常在超市 (supermarket) 或水果店 (fruit store) 看到它们。"},{"question":"在超市的水果区，除了苹果和香蕉，你还会看到什么？","hint":"回忆一下水果区的货架上都摆着什么。","takeaway":"通过联想生活场景，我们可以轻松地举出更多同类词，如葡萄、西瓜、桃子等。"}]},{"title":"特征描述","steps":[{"question":"你能描述一下 `apple` 吗？它是什么颜色，什么味道？","hint":"苹果通常是红色的或绿色的，味道甜甜的。","takeaway":"苹果是一种圆形、多汁、味道甜的水果。"},{"question":"`banana` 呢？它有什么特征？","hint":"香蕉是黄色的，长长的，软软的。","takeaway":"香蕉是一种长条形、黄色、口感软糯的水果。"},{"question":"那么，我们还能想到什么具有类似特征（可以吃、有特定颜色和味道、长在植物上）的东西呢？","hint":"比如橙子，是圆的，橙色的，酸甜的。","takeaway":"通过思考物品的共同特征，我们可以确定它们都属于“水果”这一类别。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"jacket, shirt, _____","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"dress|sweater|coat|skirt|trousers|pants|jeans|shorts","explanation_md":"题干中给出的单词 `jacket` (夹克) 和 `shirt` (衬衫) 都是衣物的名称。\n\n这道题的目的是考察对“服装”这一类词汇的掌握情况。\n\n因此，我们需要在横线上填写另一个表示衣物的单词。\n\n例如 `dress` (连衣裙)、`sweater` (毛衣)、`coat` (外套)、`skirt` (短裙)、`trousers` (裤子) 等都是符合题意的答案。","knowledge_expansion_md":"### 服装类词汇拓展\n\n服装词汇是日常生活中的高频词，可以按照不同方式分类记忆。\n\n**按穿着部位分类：**\n* **上衣 (Tops):** `T-shirt` (T恤), `shirt` (衬衫), `sweater` (毛衣), `blouse` (女士衬衫)\n* **下装 (Bottoms):** `trousers`/`pants` (裤子), `jeans` (牛仔裤), `shorts` (短裤), `skirt` (短裙)\n* **外套 (Outerwear):** `jacket` (夹克), `coat` (大衣), `windbreaker` (风衣)\n* **连衣裙 (Dresses):** `dress` (连衣裙)\n* **鞋袜 (Footwear):** `shoes` (鞋子), `socks` (袜子), `boots` (靴子)\n\n**语法易错点：**\n一些成双成对的衣物，如 `trousers` (裤子), `jeans` (牛仔裤), `shorts` (短裤), `glasses` (眼镜)，在英语中通常以复数形式出现。在计数时，需要使用量词 `a pair of`。例如：\n* `a pair of trousers` (一条裤子)\n* `two pairs of jeans` (两条牛仔裤)","socratic_tracks":[{"title":"功能与用途","steps":[{"question":"`jacket` 和 `shirt` 是用来做什么的？","hint":"我们把它们穿在身上。","takeaway":"它们都是衣服，用来穿在身上保暖或装饰。"},{"question":"你还能想到哪些穿在身上的东西？用英语怎么说？","hint":"比如裙子、裤子、毛衣。","takeaway":"我们需要填写另一个表示衣物的单词，比如 dress, skirt, trousers 等。"}]},{"title":"穿着部位","steps":[{"question":"`jacket` 和 `shirt` 通常穿在身体的哪个部位？","hint":"它们都穿在上半身。","takeaway":"它们都属于上衣 (tops)。"},{"question":"除了上衣，我们还穿什么？比如穿在下半身的？或者整件的？","hint":"我们可以穿裤子 (trousers/pants) 或裙子 (skirt/dress)。","takeaway":"从穿着部位思考，可以帮我们更系统地联想同类词，如上衣、下装、连衣裙等。"}]},{"title":"季节与天气","steps":[{"question":"你通常在什么天气或季节穿 `jacket`？","hint":"天气有点冷的时候，比如春天或秋天。","takeaway":"`jacket` 通常在凉爽的天气穿着。"},{"question":"那么，在更冷的天气里，你会穿什么？在炎热的夏天呢？","hint":"冬天穿毛衣(sweater)或大衣(coat)，夏天穿T恤(T-shirt)。","takeaway":"根据不同天气联想，可以扩展出更多衣物词汇，它们都属于同类词。"}]}]}}]},{"section_title":"III. 根据情境，选择正确的英语句子。","section_instruction":"（共2.5分）","items":[{"number":"1","item_type":"choice","context_note":"","stem":"你去商场买衣服，想要询问某件商品的价格时，你应该说：","options":{"A":"How many is it?","B":"How much is it?","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查询问价格的正确表达方式。\n\n`How much` 用于询问价格或不可数名词的数量。例如，询问价格时说 `How much is it?` (它多少钱？)，询问水量时说 `How much water?` (多少水？)。\n\n`How many` 用于询问可数名词复数的数量。例如，`How many apples?` (多少个苹果？)。\n\n题干情景是“询问某件商品的价格”，价格是不可数的概念，所以应该使用 `How much`。\n\n因此，`How much is it?` 是正确的表达。","knowledge_expansion_md":"### 核心知识点：`How much` vs. `How many`\n\n这是英语中一对非常重要且容易混淆的疑问词组，关键区别在于其后所跟名词的可数性。\n\n1.  **`How much`**\n    * **用途1：询问价格。** 这是固定用法，无论商品是单数还是复数。\n        * `How much is this T-shirt?` (这件T恤多少钱？)\n        * `How much are these shoes?` (这双鞋多少钱？)\n    * **用途2：询问不可数名词的数量。**\n        * `How much money do you have?` (你有多少钱？)\n        * `How much time do we have left?` (我们还剩多少时间？)\n\n2.  **`How many`**\n    * **用途：询问可数名词复数的数量。**\n        * `How many students are there in your class?` (你们班有多少学生？)\n        * `How many books did you buy?` (你买了几本书？)\n\n**购物常用句式拓展：**\n* 询问价格：`What's the price of ...?` / `How much does ... cost?`\n* 回答价格：`It's ... yuan.` / `It costs ... dollars.`","socratic_tracks":[{"title":"辨析 `How much` 与 `How many`","steps":[{"question":"`How much` 和 `How many` 的中文意思有什么不同？","hint":"一个问“多少钱/多少量”，一个问“多少个”。","takeaway":"`How much` 用来询问价格或不可数名词的数量，而 `How many` 用来询问可数名词的数量。"},{"question":"“价格”或者说“钱 (money)”在英语中是可数名词还是不可数名词？","hint":"我们通常说 `much money`，而不是 `many moneys`。","takeaway":"在英语中，金钱 (money) 被当作一个不可数的整体概念，因此询问价格时要用 `How much`。"}]},{"title":"疑问词的功能","steps":[{"question":"选项 A 中的 `many` 通常用来修饰什么样的名词？你能举个例子吗？","hint":"比如 `many apples`, `many books`。这些名词有什么共同点？","takeaway":"`many` 用来修饰复数形式的可数名词。"},{"question":"那么，当我们问价格时，我们问的是物品的“个数”吗？","hint":"不是，我们问的是它值多少钱。","takeaway":"询问价格是询问价值，而不是物品的个数，因此不能用 `How many`。"}]},{"title":"情景应用与地道表达","steps":[{"question":"想象一下，你指着一件衣服问店员。如果用 `How many is it?`，店员可能会怎么理解？","hint":"店员可能会以为你在问“这儿有几件？”。而且这个句子本身语法不正确，应该是 `How many are there?`","takeaway":"使用 `How many` 询问价格会造成误解，因为它通常用来询问物品的数量。"},{"question":"那么，为了准确地表达“这件多少钱？”，最标准、最常用的句型是什么？","hint":"回忆一下课本上学过的标准问价句型。","takeaway":"`How much is it?` 是询问价格最常用、最标准的地道表达。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"当你想问John打算去哪里时，你应该说：","options":{"A":"Where are you going, John?","B":"Where are you going to, John?","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查特殊疑问词 `where` 的用法。`where` 是一个疑问副词，意为“在哪里”或“到哪里”，其本身已经包含了方向性。因此，当与表示位移的动词如 `go` (去) 连用时，后面无需再添加介词 `to`。\"Where are you going?\" 是询问“你要去哪里？”的地道且语法正确的表达方式。选项 B 在句末多加了介词 `to`，属于冗余，不符合标准英语的习惯。","knowledge_expansion_md":"**1. 疑问副词 `where` 的用法**\n`where` 用于对地点或位置提问，它本身就包含了“in/at/to which place”的含义。因此，在与 `go`, `come`, `travel` 等表示移动的动词连用时，通常不需要再加介词 `to`。\n* **例句**: `Where do you live?` (你住在哪里？)\n* **例句**: `Where are you from?` (你从哪里来？)\n\n**2. 对比 `where` 和普通地点名词**\n当我们使用具体的地点名词时，通常需要介词来表示方向。\n* `I am going **to the park**.` (我要去公园。)\n* 对划线部分提问时，`to the park` 整个被 `where` 替换，所以句子变成：`**Where** are you going?`\n\n**3. 介词悬空 (Preposition Stranding)**\n虽然在非常口语化的英语中，有时会听到 \"Where are you going to?\" 这种说法，这属于介词悬空的现象，但在正式文体和标准考试中应避免使用。因为介词 `to` 后面没有宾语，结构不完整。","socratic_tracks":[{"title":"疑问词 `where` 的含义","steps":[{"question":"`where` 这个词是用来问什么的？","hint":"是问时间、地点，还是原因？","takeaway":"`where` 是用来提问地点的疑问副词。"},{"question":"那么 `where` 的意思仅仅是“在什么地方”吗？还是也包含了“到什么地方去”？","hint":"想一想 \"Where are you going?\" 这句话想要问的是什么。","takeaway":"`where` 本身就包含了“到哪里”的含义，询问的是目的地。"},{"question":"既然 `where` 已经有“到哪里”的意思，那么在它后面再加上一个表示“到”的介词 `to`，会不会显得重复？","hint":"中文里我们说“你去哪儿？”，不会说“你去到哪儿？”。","takeaway":"疑问副词 `where` 本身已包含方向，无需再加介词 `to`。"}]},{"title":"动词 `go` 的搭配","steps":[{"question":"我们想表达“去学校”，英文怎么说？","hint":"动词 `go` 和名词 `school` 之间需要一个词来连接。","takeaway":"表达“去学校”是 `go to school`。"},{"question":"在这个短语 `go to school` 中，`to` 是什么作用？","hint":"它表示一个动作的方向。","takeaway":"`to` 是介词，表示“去往”某个目的地。"},{"question":"如果我们要对 `to school` 这个部分提问，应该用哪个疑问词来替换它？替换后，原来的 `to` 还需要保留吗？","hint":"用 `where` 替换整个 `to school` 部分。","takeaway":"用 `where` 提问时，它替代了“介词+地点名词”的整个结构，所以不再需要 `to`。"}]},{"title":"句子结构的完整性","steps":[{"question":"介词，比如 `to`, `for`, `with`，它们后面通常需要跟什么类型的词？","hint":"想一想 `go to school`, `look for my book`, `play with my friends` 这些短语。","takeaway":"介词后面通常需要跟名词或代词作宾语。"},{"question":"看一下 B 选项 \"Where are you going to?\"，句尾的介词 `to` 后面有宾语吗？","hint":"句子的结尾就是 `to`，后面没有其他词了。","takeaway":"在这个句子中，介词 `to` 后面没有宾语。"},{"question":"一个介词后面没有宾语，在正式的语法中，这种结构通常被认为是规范的吗？","hint":"虽然口语中存在，但这在语法上被视为一种“悬垂介词”，应尽量避免。","takeaway":"句末悬空的介词在标准语法中是不规范的，因此 A 选项更正确。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"朋友告诉你他生病了，你应该说：","options":{"A":"I'm sorry to hear that.","B":"That's OK.","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查情景交际中如何表达同情。当朋友告诉你他生病了，这是一个令人难过的消息，我们应当表达关心和慰问。选项 A \"I'm sorry to hear that.\" 意为“听到这个消息我很难过/感到遗憾”，是英语中表达同情和安慰的标准用语，非常得体。选项 B \"That's OK.\" 意为“没关系”，通常用于回应别人的道歉或表示某事不成问题，用在此处会显得冷漠，不合时宜。","knowledge_expansion_md":"**1. 如何表达同情与安慰**\n当听到坏消息时，可以使用以下句式表达同情：\n* `I'm sorry to hear that.` (听到这个消息我很难过。)\n* `That's too bad.` / `That's a pity.` (太糟糕了。/ 真遗憾。)\n* `I hope you get well soon.` / `I hope you feel better soon.` (希望你早日康复。)\n* `Take care of yourself.` (照顾好自己。)\n\n**2. `I'm sorry` 的双重含义**\n`sorry` 在英语中有两个主要意思：\n* **道歉**: 表示“对不起”，为自己的过错道歉。例：`I'm sorry for being late.` (对不起，我迟到了。)\n* **遗憾/难过**: 表示“遗憾的，难过的”，对他人的不幸遭遇表示同情。例：`He was sorry about his friend's illness.` (他为朋友的病感到难过。) 本题即为此用法。\n\n**3. `That's OK` 的使用场景**\n`That's OK` 或 `That's all right` 主要用于回应道歉，表示原谅对方。例：A: `Oops, I spilled your coffee.` B: `That's OK.` (哎呀，我把你的咖啡洒了。 B: 没关系。)","socratic_tracks":[{"title":"`sorry` 的不同含义","steps":[{"question":"如果你不小心踩到了别人的脚，你会说什么？","hint":"你需要向对方道歉。","takeaway":"我会说 `I'm sorry.` (对不起)。"},{"question":"在这种情况下，`sorry` 是什么意思？","hint":"表示你为自己做错的事感到歉意。","takeaway":"这里的 `sorry` 意思是“抱歉的，对不起的”。"},{"question":"现在，朋友告诉你他生病了，你并没有做错任何事，为什么也要说 `I'm sorry to hear that`？这里的 `sorry` 还是“对不起”吗？","hint":"想一想你此刻的心情，是内疚，还是为朋友感到难过？","takeaway":"这里的 `sorry` 意思是“遗憾的，难过的”，用来表达同情。"}]},{"title":"`That's OK` 的功能","steps":[{"question":"如果你的同桌向你借橡皮，你同意了，他会对你说什么？","hint":"他得到了你的帮助。","takeaway":"他会对我说 `Thank you.` (谢谢)。"},{"question":"如果你的朋友不小心弄坏了你的笔并向你道歉说 `I'm sorry`，你会怎么回答来表示“没关系”？","hint":"你需要表示你原谅了他。","takeaway":"我会回答 `That's OK.` 或 `It doesn't matter.`。"},{"question":"那么，当朋友告诉你他生病了，他是在向你道歉吗？用 `That's OK` 回答合适吗？","hint":"他只是在陈述一个事实，并不是在请求你的原谅。","takeaway":"`That's OK` 主要用于回应道歉，不适用于表达同情。"}]},{"title":"情景交际的得体性","steps":[{"question":"想象一下，你的朋友生病了，他此刻的心情可能怎么样？","hint":"身体不舒服时，人通常会感到难受、沮丧。","takeaway":"他可能会感到身体不适，心情也不太好。"},{"question":"作为朋友，你的回应应该达到什么效果？是让他觉得“生病不是什么大事”，还是让他感受到你的关心？","hint":"朋友之间需要相互关怀。","takeaway":"我的回应应该让他感受到我的关心和支持。"},{"question":"对比 \"I'm sorry to hear that.\" 和 \"That's OK.\"，哪一句更能表达出你的关心和同情心？","hint":"一句表达了“我为你难过”，另一句表达了“没关系”。","takeaway":"在社交中，根据对方的处境选择恰当的语言表达同理心至关重要。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"当你想表示“我们经常在周末去徒步远足。”你应该说：","options":{"A":"We often go hiking on the weekend.","B":"We often go hike on the weekend.","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配 `go doing sth.` 的用法。在英语中，当我们要表达“去做某项娱乐或体育活动”时，通常使用“go + 动词的-ing形式”这一结构。例如，`go swimming` (去游泳)，`go shopping` (去购物)。因此，“去徒步远足”的正确表达是 `go hiking`。选项 B 中的 `go hike` 是将两个动词原形直接连用，这在语法上是错误的。一个句子中不能连续出现两个谓语动词，除非有连词连接。","knowledge_expansion_md":"**1. 固定搭配 `go doing sth.`**\n这个结构专门用于指代去参加一些休闲、娱乐或体育活动。这里的 `doing` 是动名词（gerund），在句子中作宾语，表示活动本身。\n* **常见例子**: `go fishing` (去钓鱼), `go skiing` (去滑雪), `go skating` (去滑冰), `go running` (去跑步), `go climbing` (去爬山)。\n\n**2. 动词连用规则**\n在一个简单句中，通常只有一个谓语动词。如果需要在一个动词后接另一个动词，通常有以下几种方式：\n* **加 `to`**: `I want **to play** basketball.` (我想打篮球。)\n* **加 `-ing`**: `I enjoy **playing** basketball.` (我喜欢打篮球。)\n* **情态动词后加动词原形**: `I can **play** basketball.` (我会打篮球。)\n* 直接将两个动词原形连用（如 `go hike`）是错误的。\n\n**3. 时间介词 `on` 的用法**\n句中的 `on the weekend` 表示“在周末”，是固定搭配。在美式英语中常用 `on the weekend`，在英式英语中常用 `at the weekend`。","socratic_tracks":[{"title":"固定搭配 `go doing`","steps":[{"question":"我们想表达“去游泳”，英语里通常怎么说？","hint":"这是一个非常常见的短语，想想 `swim` 这个词的形式。","takeaway":"“去游泳”通常说 `go swimming`。"},{"question":"类似地，“去购物”怎么说？“去钓鱼”呢？","hint":"遵循和 `go swimming` 一样的规律。","takeaway":"“去购物”是 `go shopping`，“去钓鱼”是 `go fishing`。"},{"question":"从这些例子中，你发现了什么规律？当 `go` 后面跟着一个表示娱乐活动的动词时，这个动词应该是什么形式？","hint":"观察 `swimming`, `shopping`, `fishing` 的词尾。","takeaway":"表达“去做某项娱乐活动”时，要使用 `go + 动词-ing` 的固定搭配。"}]},{"title":"动词连用规则","steps":[{"question":"在一个简单的英文句子中，比如 \"I like apples.\"，通常有几个主要的动词（谓语动词）？","hint":"找一找表示动作或状态的词。","takeaway":"一个简单的句子通常只有一个谓语动词。"},{"question":"如果一个句子中确实需要出现两个动词，它们能直接挨着放吗？比如可以说 \"I want play games.\" 吗？","hint":"这句话听起来很别扭，缺少了点什么。","takeaway":"两个动词不能直接连用，需要用 `to` 或改变第二个动词的形式。"},{"question":"那么，选项 B \"We often go hike...\" 中，`go` 和 `hike` 都是动词原形，它们直接放在一起，符合语法规则吗？","hint":"参照上一步的结论。","takeaway":"两个动词原形直接连用是错误的，因此 `go hike` 不正确。"}]},{"title":"词汇辨析 `hike` vs. `hiking`","steps":[{"question":"`hike` 这个词本身可以作动词，意思是“徒步”。那 `hiking` 是什么？","hint":"动词加了-ing可以变成什么？","takeaway":"`hiking` 是 `hike` 的动名词形式，可以理解为“徒步”这项活动。"},{"question":"在 `go doing` 这个结构中，我们需要的是一个表示“动作”的词，还是一个表示“活动名称”的词？","hint":"我们是“去做（go）”一件“事情（...ing）”。","takeaway":"我们需要一个表示“活动名称”的词，这个词在语法上起名词的作用。"},{"question":"所以，在 `go` 后面，我们应该用动词原形 `hike` 还是动名词 `hiking` 来表示“徒步”这项活动？","hint":"动名词可以像名词一样使用。","takeaway":"应该使用动名词 `hiking`，因为它在结构中充当了活动名称的角色。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"当好友 Sam 在你家做客时，你应该说：","options":{"A":"Thank you!","B":"Have some cake!","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查待客之道的情景交际。当朋友来你家做客时，你的角色是主人（host），应该热情招待客人。选项 B \"Have some cake!\" 意为“吃点蛋糕吧！”，是主人向客人提供食物的礼貌邀请，体现了主人的好客，完全符合情境。选项 A \"Thank you!\" 意为“谢谢你！”，通常是客人在接受主人的款待后，或者主人在收到客人带来的礼物时说的话。在这个情境下，作为主人主动说“谢谢”是不合逻辑的。","knowledge_expansion_md":"**1. 作为主人招待客人的常用语**\n* `Welcome to my home.` (欢迎来我家。)\n* `Make yourself at home.` (别客气，就像在自己家一样。)\n* `Would you like something to drink/eat?` (你想喝/吃点什么吗？)\n* `Help yourself to some snacks.` (请随便吃些点心。)\n* `Have some tea/coffee/cake.` (喝点茶/咖啡/吃点蛋糕吧。) - 本题用法\n\n**2. 作为客人的常用语**\n* `Thank you for having me.` / `Thank you for your invitation.` (谢谢你的招待/邀请。)\n* `This is for you.` (这是给你的。——在送礼物时说)\n* `It's delicious!` (真好吃！——在品尝食物后说)\n* `Yes, please.` / `No, thank you.` (好的，谢谢。/ 不了，谢谢。——在回应主人是否需要某物时说)\n\n**3. 祈使句的礼貌用法**\n像 `Have some cake!` 这样的祈使句，虽然以动词原形开头，但在社交场合中，配合友好的语气，通常表示礼貌的邀请或建议，而非强硬的命令。","socratic_tracks":[{"title":"主人与客人的角色定位","steps":[{"question":"在这个情景“好友 Sam 在你家做客”中，谁是主人，谁是客人？","hint":"你在自己的家里接待朋友。","takeaway":"我是主人，Sam 是客人。"},{"question":"作为主人，你的主要责任是什么？是感谢客人来访，还是招待好客人？","hint":"想一想待客之道的核心是什么。","takeaway":"作为主人，我的主要责任是招待好客人，让他们感到舒适和受欢迎。"},{"question":"那么，\"Have some cake!\" (吃点蛋糕吧！) 和 \"Thank you!\" (谢谢你！) 哪句话更能体现出主人在招待客人的角色？","hint":"一句是提供东西，一句是表达感谢。","takeaway":"提供食物的 \"Have some cake!\" 更符合主人招待客人的角色。"}]},{"title":"`Thank you` 的使用时机","steps":[{"question":"我们通常在什么时候说 \"Thank you\"？","hint":"当别人给了我们帮助或好处时。","takeaway":"当收到别人的帮助、礼物或款待时，我们会说“谢谢”。"},{"question":"在这个场景中，是你给了 Sam 好处（蛋糕），还是 Sam 给了你好处？","hint":"你是提供食物的一方。","takeaway":"是我在款待 Sam，为他提供蛋糕。"},{"question":"因此，更应该是谁对谁说 \"Thank you\"？","hint":"接受款待的一方应该表示感谢。","takeaway":"应该是 Sam 在接受或吃完蛋糕后对我说 \"Thank you\"。"}]},{"title":"祈使句的社交功能","steps":[{"question":"\"Have some cake!\" 这个句子是以什么词开头的？","hint":"`Have` 是一个动词。","takeaway":"这个句子是以动词原形 `Have` 开头的。"},{"question":"这种以动词原形开头的句子叫什么？它通常用来做什么？","hint":"比如 `Sit down.` (坐下) 或者 `Be quiet.` (安静)。","takeaway":"这叫祈使句，通常用来发出命令、请求或建议。"},{"question":"在招待朋友时说 \"Have some cake!\"，你觉得这是强硬的命令，还是友好的邀请？","hint":"想想你对朋友说话的语气。","takeaway":"在社交场合中，祈使句常用于表达礼貌的邀请和建议。"}]}]}}]},{"section_title":"IV. 选择填空。","section_instruction":"（共5分）","items":[{"number":"1","item_type":"choice","context_note":"","stem":"There _____ much water on the ground now.","options":{"A":"am","B":"is","C":"are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查 There be 句型中 be 动词的用法。There be 句型表示“某地有某物”，其中 be 动词的形式取决于其后的名词。本句中，be 动词后面的名词是 `water`（水）。`water` 是一个不可数名词。在语法上，不可数名词被视作单数。因此，be 动词应使用单数形式 `is`。选项 A `am` 只与 `I` 连用，选项 C `are` 用于复数名词，均不正确。","knowledge_expansion_md":"### There be 句型的主谓一致\n\n1.  **基本结构**：`There is/are + 名词 + 地点/时间`。\n2.  **一致原则**：be 动词的形式由紧跟其后的名词（即句子的真实主语）的单复数形式决定，这被称为“就近原则”。\n    * **单数或不可数名词**：用 `There is`。例如：`There is a book on the desk.` (桌上有一本书。) `There is some milk in the glass.` (杯子里有一些牛奶。)\n    * **复数名词**：用 `There are`。例如：`There are three apples on the table.` (桌上有三个苹果。)\n3.  **特殊情况**：当有多个名词并列时，be 动词通常与离它最近的那个名词保持一致。\n    * 例如：`There is a pen and two pencils in the box.` (盒子里面有一支钢笔和两支铅笔。) 在口语中，`There are a pen and two pencils...` 也可接受，但在标准书面语和考试中，就近原则更常见。\n4.  **常见不可数名词**：`water`, `milk`, `bread`, `rice`, `money`, `information`, `advice`, `news`, `furniture` 等。这些词作主语时，谓语动词用单数。","socratic_tracks":[{"title":"There be 句型","steps":[{"question":"这个句子是以什么词开头的？这种句型通常用来表达什么？","hint":"观察句首的 'There'，想想 'There is a book' 这类句子的意思。","takeaway":"这是 “There be” 句型，用来表达“某地有某物”的存在关系。"},{"question":"在 “There be” 句型中，be 动词（is/are）的形式是由句首的 'There' 决定，还是由它后面的名词决定？","hint":"比较 'There is a cat' 和 'There are two cats' 的区别。","takeaway":"be 动词的形式由其后的名词的单复数决定，这叫“就近原则”。"},{"question":"本题中，be 动词后面的名词是什么？它是单数、复数还是不可数？","hint":"看看 'much' 修饰的是哪个词。","takeaway":"名词是 'water'（水），它是一个不可数名词。"},{"question":"对于不可数名词，我们应该把它当作单数还是复数来对待？be 动词应该用哪一个？","hint":"我们说 'Money is important' 还是 'Money are important'？","takeaway":"不可数名词在语法上视为单数，因此 be 动词要用单数形式 'is'。"}]},{"title":"不可数名词","steps":[{"question":"我们能数“一个水，两个水”吗？像 'water' 这类名词叫什么？","hint":"与 'apple', 'book' 这类可以数的名词对比一下。","takeaway":"'water' 是不可数名词，不能直接用数字来计数。"},{"question":"当不可数名词作主语时，谓语动词应该用单数形式还是复数形式？","hint":"想一想 'Time is money' 这句谚语。","takeaway":"不可数名词作主语时，谓语动词要用单数形式。"},{"question":"既然 'water' 是不可数名词，应视为单数，那么 be 动词应该用 'is' 还是 'are'？","hint":"单数主语配单数动词。","takeaway":"主语 'water' 视为单数，所以 be 动词用 'is'。"}]},{"title":"be 动词用法辨析","steps":[{"question":"选项 A 的 'am' 通常和哪个主语连用？","hint":"“我是一名学生” 怎么说？ 'I ___ a student.'","takeaway":"'am' 只能和第一人称单数 'I' 搭配使用。"},{"question":"选项 C 的 'are' 通常和什么样的主语连用？","hint":"“他们是我的朋友” 怎么说？ 'They ___ my friends.'","takeaway":"'are' 用于第二人称（you）或任何复数形式的主语。"},{"question":"本题的主语是 'water'（不可数名词），既不可能是 'I'，也不是复数，那么 'am' 和 'are' 都不对，正确答案是什么？","hint":"排除法是做选择题的好方法。","takeaway":"通过排除法和正向推理，可以确定 'is' 是唯一正确的答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"— I will go to Shanghai for a trip next week.\n— Great. _____!","options":{"A":"Have a good time","B":"Nice to see you","C":"Good job","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查情景交际用语。对话中，第一人说：“我下周要去上海旅行。”第二人先是说“太棒了”，接着应该表达一句合适的祝福。选项 A `Have a good time` 意为“祝你玩得开心”，符合为即将旅行的人送上祝福的语境。选项 B `Nice to see you` 意为“很高兴见到你”，用于与人见面时的问候。选项 C `Good job` 意为“干得好”，用于表扬他人的工作或成就。因此，只有 A 选项最符合题意。","knowledge_expansion_md":"### 常见情景交际用语归纳\n\n在英语交流中，针对不同情景使用固定的表达方式非常重要。\n\n1.  **表达祝福**\n    * 旅行/度假：`Have a good time!`, `Have a nice trip!`, `Enjoy your trip!`\n    * 考试/比赛前：`Good luck!`\n    * 节日：`Happy New Year!`, `Merry Christmas!`\n\n2.  **见面问候**\n    * 初次见面：`Nice to meet you.`\n    * 再次见面：`Nice to see you.`, `Long time no see.`\n    * 日常问候：`How are you?`, `How's it going?`\n\n3.  **表扬与鼓励**\n    * `Good job!`, `Well done!`, `Excellent!`, `Great!`\n\n4.  **道歉与回应**\n    * 道歉：`I'm sorry.`, `Excuse me.`\n    * 回应：`That's all right.`, `Never mind.`, `It doesn't matter.`\n\n5.  **感谢与回应**\n    * 感谢：`Thank you.`, `Thanks a lot.`\n    * 回应：`You're welcome.`, `My pleasure.`, `Not at all.`\n\n**易错点**：学生常常会混淆不同场合的用语，例如将用于见面的 `Nice to see you` 误用于送别或祝福的场合。关键在于理解每个表达的精确含义和使用语境。","socratic_tracks":[{"title":"理解对话语境","steps":[{"question":"对话中的第一个人说了什么？他/她将要做什么？","hint":"注意关键词 'go to Shanghai for a trip'。","takeaway":"第一个人说他下周要去上海旅行。"},{"question":"当你的朋友告诉你他要去旅行时，你通常会说什么来回应？","hint":"是祝他玩得开心，还是夸他干得好？","takeaway":"通常我们会祝福对方旅途愉快。"},{"question":"在三个选项中，哪一个最能表达“祝你玩得开心”这个意思？","hint":"逐一翻译三个选项的意思。","takeaway":"选项 A 'Have a good time' 的意思正是“祝你玩得开心”。"}]},{"title":"辨析选项含义","steps":[{"question":"选项 B 'Nice to see you' 是什么意思？通常在什么情况下使用？","hint":"当你在街上遇到一位熟人时，你会说什么？","takeaway":"'Nice to see you' 意为“很高兴见到你”，用于见面打招呼的场合。"},{"question":"选项 C 'Good job' 是什么意思？通常在什么情况下使用？","hint":"如果你的同学在考试中取得了很好的成绩，你会怎么祝贺他？","takeaway":"'Good job' 意为“干得好”，用于表扬和称赞。"},{"question":"比较 A、B、C 三个选项的含义和使用场景，哪个最适合回应“我要去旅行”？","hint":"一个是祝福，一个是问候，一个是表扬。","takeaway":"只有表达祝福的 'Have a good time' 符合该对话的语境。"}]},{"title":"交际功能","steps":[{"question":"从功能的角度看，第二个人说的话是为了实现什么交际目的？是问候、感谢还是祝福？","hint":"第二个人对第一个人的计划作出了积极的回应 'Great.'，接下来应该是什么？","takeaway":"这句话的交际功能是向对方表达美好的祝愿，即“祝福”。"},{"question":"在英语中，有哪些常见的表达旅行祝福的句子？","hint":"除了 'Have a good time'，你还知道其他的吗？比如 'Enjoy...'","takeaway":"表达旅行祝福的常用语有 'Have a good time', 'Have a nice trip', 'Enjoy your trip' 等。"},{"question":"明确了交际功能是“祝福”之后，再看这三个选项，哪个是用来表达祝福的？","hint":"只有一句是表达祝愿的。","takeaway":"'Have a good time' 是一个典型的用于表达祝福的功能性用语。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"Mike and Jane _____ in the library.","options":{"A":"is","B":"am","C":"are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查主谓一致原则，特别是 be 动词的用法。句子的主语是 `Mike and Jane`。由 `and` 连接的两个人名构成了一个复数主语。当主语是复数时，谓语动词也需要用复数形式。在 be 动词的现在时形式中，`am` 用于第一人称单数 `I`，`is` 用于第三人称单数，而 `are` 用于第二人称和所有复数形式的主语。因此，与复数主语 `Mike and Jane` 搭配的 be 动词应该是 `are`。","knowledge_expansion_md":"### 主谓一致（Subject-Verb Agreement）\n\n主谓一致是英语语法中的核心规则，指谓语动词的人称和数必须与主语的人称和数保持一致。\n\n1.  **be 动词的现在时形式**：\n    * `I` + `am`\n    * `He/She/It/单数名词` + `is`\n    * `You/We/They/复数名词` + `are`\n\n2.  **由 `and` 连接的并列主语**：\n    * 通常情况下，由 `and` 连接的两个或多个名词/代词作主语时，主语为复数，谓语动词用复数形式。例如：`Tom and Jerry are good friends.` (汤姆和杰瑞是好朋友。) `You and I are students.` (你和我是学生。)\n    * **例外**：如果 `and` 连接的两个词在意义上指同一个人、同一事物或一个不可分割的整体，则主语视为单数。例如：`Bread and butter is my favorite breakfast.` (黄油面包是我最喜欢的早餐。) `The writer and singer is coming.` (那位作家兼歌手要来了。)\n\n3.  **易错点**：学生有时会受“就近原则”的干扰，只看离动词最近的名词来决定动词形式。但在 `A and B` 结构中，除非是特例，否则应将 `A and B` 视为一个复数整体。","socratic_tracks":[{"title":"确定主语的单复数","steps":[{"question":"在这个句子中，主语是谁？是只有 Mike 一个人吗？","hint":"看看句子的开头部分，是谁在图书馆里？","takeaway":"句子的主语是 'Mike and Jane'。"},{"question":"'Mike and Jane' 是一个人还是多个人？这使得主语是单数还是复数？","hint":"关键词 'and' 连接了两个不同的名字。","takeaway":"这是两个人，所以主语是复数。"}]},{"title":"应用主谓一致原则","steps":[{"question":"什么是“主谓一致”原则？","hint":"主语和动词在“数量”上需要匹配。","takeaway":"主谓一致意味着谓语动词的形式必须和主语的单复数形式保持一致。"},{"question":"既然我们确定了主语 'Mike and Jane' 是复数，那么 be 动词应该用单数形式还是复数形式？","hint":"回想一下，'They' 后面用 'is' 还是 'are'？","takeaway":"复数主语需要搭配复数形式的谓语动词。"},{"question":"在 'is', 'am', 'are' 这三个选项中，哪一个是 be 动词的复数形式？","hint":"回忆 be 动词的变位：I am, you are, he is, we are, they are.","takeaway":"'are' 是 be 动词在现在时态下的复数形式。"}]},{"title":"排除错误选项","steps":[{"question":"选项 A 'is' 通常和什么样的主语搭配？","hint":"例如：'He ___ a boy.'","takeaway":"'is' 用于第三人称单数主语。"},{"question":"选项 B 'am' 通常和什么样的主语搭配？","hint":"例如：'I ___ a student.'","takeaway":"'am' 仅用于第一人称单数主语 'I'。"},{"question":"句子的主语 'Mike and Jane' 既不是第三人称单数，也不是 'I'。因此，'is' 和 'am' 都不正确，剩下的唯一选择是什么？","hint":"用排除法可以帮助我们锁定正确答案。","takeaway":"排除法证明了 'are' 是唯一符合复数主语 'Mike and Jane' 的正确选项。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"My mother _____ long hair.","options":{"A":"was","B":"have","C":"has","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查一般现在时中实义动词的主谓一致。句子意为“我的妈妈有长头发”，表达“拥有”应该使用动词 `have`。句子的主语是 `My mother`（我的妈妈），这是一个第三人称单数名词。在一般现在时中，当主语是第三人称单数时，谓语动词需要使用其第三人称单数形式。动词 `have` 的第三人称单数形式是 `has`。选项 A `was` 是 be 动词的过去式，意思和词性都不对。选项 B `have` 用于非第三人称单数主语。因此，正确答案是 `has`。","knowledge_expansion_md":"### 实义动词的第三人称单数\n\n在一般现在时中，当主语是第三人称单数时（如 `he`, `she`, `it`, `Tom`, `my mother`, `a dog` 等），谓语动词需要进行相应的变化，这被称为“第三人称单数形式”，简称“三单”。\n\n1.  **变化规则**：\n    * **一般情况**：在动词原形后加 `-s`。如：`work` -> `works`, `play` -> `plays`。\n    * **以 s, x, ch, sh, o 结尾**：在动词原形后加 `-es`。如：`go` -> `goes`, `do` -> `does`, `watch` -> `watches`, `fix` -> `fixes`。\n    * **以“辅音字母+y”结尾**：变 `y` 为 `i`，再加 `-es`。如：`study` -> `studies`, `fly` -> `flies`。\n    * **特殊情况**：`have` 的三单形式是 `has`。\n\n2.  **用法辨析**：\n    * **have/has**：表示“拥有”，是实义动词。例如：`She has a new bike.`\n    * **is/am/are**：表示“是”或描述状态、身份，是 be 动词。例如：`She is a teacher.`\n    * **易错点**：初学者容易混淆 `have/has` 和 `is/am/are` 的用法。要根据句子想表达的含义（是“拥有”还是“是”）来选择正确的动词。","socratic_tracks":[{"title":"选择正确的动词意义","steps":[{"question":"这个句子想要表达什么意思？是“我妈妈是长头发”还是“我妈妈有长头发”？","hint":"头发是人身体的一部分，我们通常说“拥有”某个特征。","takeaway":"句子要表达“拥有”的含义，描述外貌特征。"},{"question":"在英语中，哪个动词主要用来表达“拥有”？","hint":"“我有一支笔”应该怎么说？ 'I ___ a pen.'","takeaway":"动词 'have' 用来表示“拥有”。"},{"question":"既然要表达“拥有”，那么选项 A 'was'（是）是否合适？","hint":"'was' 是 be 动词的过去式。","takeaway":"'was' 意思不符，首先被排除。"}]},{"title":"主谓一致与第三人称单数","steps":[{"question":"句子的主语是哪个词或词组？","hint":"是谁拥有长头发？","takeaway":"主语是 'My mother'。"},{"question":"'My mother' 属于第几人称？是单数还是复数？","hint":"可以用代词 'she' 来替换 'My mother'。","takeaway":"'My mother' 属于第三人称单数。"},{"question":"当主语是第三人称单数，并且时态是一般现在时，动词 'have' 应该变成什么特殊形式？","hint":"这不是一个加 -s 的常规变化。","takeaway":"在主语是第三人称单数时，'have' 必须变为 'has'。"}]},{"title":"have 与 has 的用法对比","steps":[{"question":"选项 B 'have' 通常用在什么样的主语后面？","hint":"例如：I ___, you ___, we ___, they ___。","takeaway":"'have' 用于第一人称、第二人称和所有复数主语。"},{"question":"那么，主语 'My mother' 可以用 'have' 吗？为什么？","hint":"'My mother' 是第三人称单数。","takeaway":"不可以，因为 'My mother' 是第三人称单数，不符合 'have' 的使用条件。"},{"question":"对比 'have' 和 'has'，哪个才是 'have' 专门用于第三人称单数主语的形式？","hint":"He/She/It 后面用哪一个？","takeaway":"'has' 是 'have' 的第三人称单数形式，是本题的正确答案。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"— What did you do last night?\n— I _____ my homework and _____ a film on TV.","options":{"A":"did; see","B":"did; saw","C":"do; saw","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查一般过去时。问句中的“did”和时间状语“last night”（昨晚）表明对话发生在过去，讨论的是过去发生的事情。因此，回答时需要使用一般过去时。连词“and”连接了两个并列的动作，这两个动作都发生在昨晚，所以它们的动词都应该使用过去式。“do”的过去式是“did”，“see”的过去式是“saw”。因此，两个空分别填入“did”和“saw”。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n1.  **用法**：表示过去某个时间发生的动作或存在的状态。常与表示过去的时间状语连用，如 `yesterday`, `last night/week/year`, `... ago`, `in 2010` 等。\n2.  **构成**：\n    * **肯定句**：主语 + 动词过去式 (verb-ed / 不规则动词)。\n    * **否定句**：主语 + `didn't` + 动词原形。\n    * **一般疑问句**：`Did` + 主语 + 动词原形？\n3.  **并列连词 `and`**：当 `and` 连接两个或多个动词时，这些动词的时态和形式通常保持一致，以维持句子的平行结构。例如：`He came in, sat down, and opened the book.` (三个动词都是过去式)。\n4.  **常见不规则动词过去式**：`do` -> `did`, `see` -> `saw`, `go` -> `went`, `eat` -> `ate`, `have` -> `had`, `buy` -> `bought`。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"问句 “What did you do last night?” 中有哪些词可以帮助我们判断事情发生的时间？","hint":"注意句首的助动词和句末的时间状语。","takeaway":"“did” 和 “last night” 都表明这是一个关于过去发生的事情的问句。"},{"question":"既然问的是过去的事情，那么回答时应该用什么时态来描述过去的动作呢？","hint":"描述过去某个时间点完成的动作，我们通常使用一般过去时。","takeaway":"回答时需要用一般过去时来描述过去的动作。"}]},{"title":"动词变形","steps":[{"question":"题目中需要填写的两个动作分别是“做作业”和“看电影”，它们的动词原形是什么？","hint":"“做”是 do，“看”是 see。","takeaway":"两个动词原形分别是 do 和 see。"},{"question":"我们已经知道要用一般过去时，那么 do 和 see 的过去式分别是什么？它们是规则变化吗？","hint":"这两个动词的过去式变化不遵循在词尾加-ed的规则。","takeaway":"do 和 see 都是不规则动词，它们的过去式分别是 did 和 saw。"}]},{"title":"并列结构","steps":[{"question":"句子中的连词 “and” 起到了什么作用？","hint":"它连接了 “_____ my homework” 和 “_____ a film on TV” 这两个部分。","takeaway":"“and” 用来连接两个并列的动作。"},{"question":"当 “and” 连接两个动词或动词短语时，为了让句子结构保持平衡，这两个动词在时态上通常有什么要求？","hint":"想象一下天平的两端，需要保持平衡。","takeaway":"“and” 连接的两个并列动词时态通常需要保持一致。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"The trip yesterday was great. We _____ it very much.","options":{"A":"talked","B":"enjoyed","C":"played","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在特定语境中选择恰当的动词。第一句 “The trip yesterday was great.”（昨天的旅行很棒）为整个对话设定了积极的基调，并指明事件发生在过去。第二句中的 “it” 指代 “the trip”。我们需要选择一个动词来表达对这次很棒的旅行的感受。选项 B “enjoyed”（享受）最符合语境，表示“我们非常享受这次旅行”。选项 A “talked”（谈论）和选项 C “played”（玩）与宾语 “it” (the trip) 搭配不当，不符合英语的表达习惯。","knowledge_expansion_md":"### 动词与宾语的搭配 (Collocation)\n\n在英语学习中，掌握动词与宾语的固定搭配非常重要。有些动词后面可以跟多种宾语，而有些则有特定的搭配对象。\n\n1.  **`enjoy`**：及物动词 (vt.)，意为“享受...的乐趣；欣赏”，后面必须跟宾语。常见的搭配有：\n    * `enjoy the party/film/music` (享受聚会/电影/音乐)\n    * `enjoy the trip` (享受旅行)\n    * `enjoy oneself` (玩得开心)\n\n2.  **`talk`**：多为不及物动词 (vi.)，当表示“谈论某事”时，需要借助介词 `about` 或 `of`。\n    * `talk about the trip` (谈论这次旅行)\n    * 错误用法：`talk the trip`\n\n3.  **`play`**：及物动词 (vt.)，但其宾语通常是球类、牌类、乐器或游戏等。\n    * `play football/cards/the piano` (踢足球/打牌/弹钢琴)\n    * 我们不能说 `play the trip`。","socratic_tracks":[{"title":"语境逻辑","steps":[{"question":"第一句话 “The trip yesterday was great” 告诉了我们关于这次旅行的什么信息？","hint":"句中的形容词 “great” 是一个关键信息。","takeaway":"这句话告诉我们昨天的旅行非常棒。"},{"question":"既然旅行很棒，那么第二句话 “We _____ it very much” 应该是表达一种怎样的感受？","hint":"是积极的感受还是消极的感受？","takeaway":"第二句话应该表达对这次旅行的喜爱和享受。"}]},{"title":"词义与搭配","steps":[{"question":"请分别说出三个选项动词的过去式 talked, enjoyed, played 的意思。","hint":"talked - 谈论；enjoyed - 享受；played - 玩。","takeaway":"三个动词的意思分别是“谈论了”、“享受了”和“玩了”。"},{"question":"哪个动词和宾语 “it”（指代 “the trip”）搭配起来最通顺，并且最符合“旅行很棒”这个语境？","hint":"试试把三个词分别代入句子中读一读：“We talked it...”, “We enjoyed it...”, “We played it...”。哪个听起来最自然？","takeaway":"“enjoyed it”（享受它）是唯一符合语境和搭配习惯的用法。"}]},{"title":"及物与不及物动词","steps":[{"question":"动词 “enjoy” 后面可以直接跟一个名词或代词作宾语吗？比如 “enjoy the movie”？","hint":"是的，“enjoy” 是一个及物动词，它需要一个动作的接受者。","takeaway":"“enjoy” 是及物动词，后面需要直接跟宾语。"},{"question":"那动词 “talk” 呢？我们能说 “talk the trip” 吗？通常我们会怎么表达“谈论这次旅行”？","hint":"我们通常会说 “talk about the trip”。","takeaway":"“talk” 在表示“谈论某事”时，是不及物动词，需要和介词 “about” 连用，所以不能直接跟宾语 “it”。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"Sarah likes _____ snowmen.","options":{"A":"makes","B":"made","C":"making","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查动词 “like” 的固定用法。在英语中，“like” 表示“喜欢”，其后如果跟另一个动词来表示喜欢“做”某事时，这个动词需要使用非谓语动词形式。常见的结构是 “like doing sth.” 或 “like to do sth.”。本题中，动词 “make” 应该变为动名词形式 “making”。选项 A “makes” 是动词第三人称单数，选项 B “made” 是过去式，均不符合该语法结构。因此，正确答案是 C。","knowledge_expansion_md":"### 动词后跟 -ing 形式 (动名词)\n\n在英语中，一些动词后面习惯跟动名词（verb-ing）作宾语。掌握这些动词是提高英语水平的关键。\n\n1.  **只跟动名词（doing）的动词**：\n    * `enjoy` (享受): `We enjoy playing basketball.`\n    * `finish` (完成): `Have you finished doing your homework?`\n    * `mind` (介意): `Would you mind opening the window?`\n    * `practice` (练习): `She practices singing every day.`\n    * `keep` (坚持): `Keep trying, and you will succeed.`\n    * `avoid` (避免): `You should avoid making the same mistake.`\n\n2.  **既可跟动名词（doing）也可跟不定式（to do）的动词**：\n    * **意义差别不大**：`like`, `love`, `hate`, `prefer`, `start`, `begin`, `continue`。\n        * `I like swimming.` / `I like to swim.` (两者意思基本相同)\n    * **意义差别较大**：`stop`, `remember`, `forget`, `try`。\n        * `stop doing sth.` (停止正在做的事): `He stopped smoking.` (他戒烟了。)\n        * `stop to do sth.` (停下来去做另一件事): `He stopped to smoke.` (他停下来，以便抽根烟。)","socratic_tracks":[{"title":"动词搭配格式","steps":[{"question":"在一个简单的英语句子中，一个谓语动词（比如 likes）后面能直接跟另一个谓语动词（比如 makes）吗？","hint":"一个萝卜一个坑，一个句子通常只有一个主要的谓语动词。","takeaway":"一个简单句中，一个动词后面不能直接跟另一个谓语动词。"},{"question":"那么当动词 “like” 后面要表达“做某事”时，我们应该如何处理第二个动词 “make”？","hint":"我们需要把它变成一种“名词化”的形式，让它作为 “like” 的宾语。","takeaway":"我们需要把第二个动词变成非谓语动词，比如动名词（-ing形式）或不定式（to do）。"}]},{"title":"动名词用法","steps":[{"question":"“like” 这个动词后面可以跟哪种形式的非谓语动词？","hint":"它的用法比较灵活，有两种常见的形式都可以。","takeaway":"“like” 后面既可以跟动名词（doing），也可以跟不定式（to do）。"},{"question":"根据这个规则，并结合题目给出的选项，动词 “make” 应该变成什么形式才能放在 “likes” 后面？","hint":"看看选项中哪个是 “make” 的 -ing 形式。","takeaway":"“make” 应该变成动名词 “making”。"}]},{"title":"排除法","steps":[{"question":"为什么选项 A “makes” 是错的？","hint":"“likes” 和 “makes” 都是动词的第三人称单数形式，它们能这样直接连在一起吗？","takeaway":"两个谓语动词不能直接连用，所以 “likes makes” 是错误的语法结构。"},{"question":"为什么选项 B “made” 是错的？","hint":"“made” 是过去式，而 “likes” 是现在时。在 “like + 动作” 这个结构中，可以用过去式吗？","takeaway":"“likes made” 不构成任何正确的语法结构，因此也是错误的。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"Jack usually _____ to school by bike. But yesterday he _____ to school.","options":{"A":"go; walk","B":"goes; walks","C":"goes; walked","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查在不同时间语境下，一般现在时和一般过去时的区别使用。句子由连词 “But” 分为两部分，形成了对比。第一部分有时间状语 “usually”（通常），表示一个经常性、习惯性的动作，因此谓语动词应使用一般现在时。主语 “Jack” 是第三人称单数，所以动词 “go” 要变为 “goes”。第二部分有明确的过去时间状语 “yesterday”（昨天），表示一个在过去特定时间发生的动作，因此谓语动词应使用一般过去时。动词 “walk” 是规则动词，其过去式为 “walked”。因此，正确答案是 C。","knowledge_expansion_md":"### 时态对比：一般现在时 vs. 一般过去时\n\n1.  **一般现在时 (Simple Present Tense)**\n    * **功能**：表示经常性、习惯性的动作或状态；表示客观真理、事实。\n    * **标志词**：`always`, `usually`,
