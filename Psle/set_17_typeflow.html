 `often`, `sometimes`, `every day/week/month`。\n    * **构成**：主语为第三人称单数 (he, she, it, Jack) 时，动词词尾加 `-s` 或 `-es`。\n\n2.  **一般过去时 (Simple Past Tense)**\n    * **功能**：表示在过去某个特定时间发生并完成的动作或存在的状态。\n    * **标志词**：`yesterday`, `last night/week`, `... ago`, `in 2020`。\n    * **构成**：在动词原形后加 `-ed` (规则动词) 或使用不规则动词的过去式。\n\n3.  **连词 `But` 的作用**：`But` (但是) 是一个转折连词，常用于连接两个意思上相对或相反的句子。在本题中，它清晰地将“通常的情况”（现在时）与“昨天的特殊情况”（过去时）进行了对比。","socratic_tracks":[{"title":"解析前半句：习惯动作","steps":[{"question":"在 “Jack usually _____ to school by bike” 这半句话中，哪个词是判断时态的关键？","hint":"哪个词表示“通常”？","takeaway":"“usually” 表明这是一个习惯性动作，需要使用一般现在时。"},{"question":"在一般现在时中，如果主语是 “Jack”（他），动词 “go” 应该如何变化？","hint":"当主语是 he/she/it 时，动词有什么特殊规则？","takeaway":"主语是第三人称单数时，动词 “go” 要变为 “goes”。"}]},{"title":"解析后半句：过去动作","steps":[{"question":"在 “... But yesterday he _____ to school” 这半句话中，哪个词明确指出了动作发生的时间？","hint":"哪个词的意思是“昨天”？","takeaway":"“yesterday” 表明这是一个发生在过去的动作，需要使用一般过去时。"},{"question":"动词 “walk” 的一般过去时形式是什么？它是规则动词吗？","hint":"规则动词的过去式通常是在词尾加 -ed。","takeaway":"“walk” 是规则动词，其过去式是在词尾加 -ed，变为 “walked”。"}]},{"title":"理解句子逻辑","steps":[{"question":"句子中间的 “But” (但是) 在这里起到了什么作用？","hint":"它连接了 Jack 平时的做法和昨天的做法，这两种做法一样吗？","takeaway":"“But” 在此表示转折，对比了两种不同的情况。"},{"question":"这种“平时”与“昨天”的对比，是如何通过动词的时态变化体现出来的？","hint":"前半句描述的是“通常”，后半句描述的是“昨天”，它们在时间上有什么不同？","takeaway":"“But” 常常连接不同时态的句子，用一般现在时描述习惯，用一般过去时描述过去的例外情况，形成鲜明对比。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"_____ pencil is this?\n— Linda's.","options":{"A":"Who's","B":"Whose","C":"Who","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查疑问词的辨析。\n1.  句意理解：根据回答 “Linda's”（琳达的），可知问句是在询问物品的所有者，即“这是谁的铅笔？”\n2.  选项分析：\n    * A. `Who's` 是 `who is` 或 `who has` 的缩写，意为“是谁”或“谁有”，例如：`Who's that girl?` (那个女孩是谁？)\n    * B. `Whose` 是疑问代词，意为“谁的”，用来询问物品的归属。\n    * C. `Who` 是疑问代词，意为“谁”，用来询问人的身份。\n3.  结论：为了询问铅笔的所有者，应该使用 `Whose`。因此，正确答案是 B。","knowledge_expansion_md":"### `Whose` vs. `Who's` 的辨析\n\n`Whose` 和 `Who's` 是初学者极易混淆的一对词，因为它们发音完全相同。\n\n1.  **`Whose` (疑问代词/关系代词)**\n    * **含义**：谁的\n    * **用法**：用于提问或说明某物属于谁。\n    * **结构**：`Whose` + 名词\n    * **例句**：\n        * `Whose bag is on the desk?` (谁的书包在桌上？) —— 疑问句\n        * `This is the boy whose father is a doctor.` (这就是那个爸爸是医生的男孩。) —— 定语从句\n\n2.  **`Who's` (缩写形式)**\n    * **含义**：是 `who is` 或 `who has` 的缩写。\n    * **用法**：用来询问“是谁”或“谁已经...”。\n    * **结构**：`Who's` + ...\n    * **例句**：\n        * `Who's your English teacher?` (谁是你的英语老师？) ( = Who is...)\n        * `Who's finished the homework?` (谁已经完成了作业？) ( = Who has...)\n\n**记忆技巧**：当你看到 `Who's` 时，可以尝试将它替换成 `who is` 或 `who has`，看句子是否通顺。如果通顺，就用 `Who's`；如果不通顺，且句意是询问“谁的”，就用 `Whose`。","socratic_tracks":[{"title":"从回答倒推问题","steps":[{"question":"看到回答是 \"Linda's\"，这个 's 代表什么意思？","hint":"想想 \"Tom's bag\" 是什么意思。","takeaway":"\"Linda's\" 表示“琳达的”，是在表达所属关系。"},{"question":"既然回答是关于“所属关系”的，那么提问时应该问“是谁的”。英语中哪个疑问词是用来问“谁的”？","hint":"回忆一下询问所有者的特殊疑问词。","takeaway":"询问“是谁的”应该用疑问代词 `Whose`。"}]},{"title":"疑问词辨析","steps":[{"question":"`Who's` 是什么词的缩写？它通常用来问什么？","hint":"试着把 `Who's` 拆开成两个单词。","takeaway":"`Who's` 是 `who is` 或 `who has` 的缩写，用来问“是谁”或“谁有”。"},{"question":"那么 `Whose` 和 `Who's` 的根本区别是什么？","hint":"一个问归属，一个问身份。","takeaway":"`Whose` 问“谁的”，`Who's` 问“是谁”。"},{"question":"根据句意“这是_____铅笔？”，应该选择问“是谁”还是“谁的”？","hint":"回答是“琳达的”，而不是“是琳达”。","takeaway":"句意是询问铅笔的主人，所以应该用 `Whose`。"}]},{"title":"词性与句子结构","steps":[{"question":"在 \"_____ pencil is this?\" 这个句子中，横线上的词后面紧跟着一个什么词？","hint":"看看 `pencil` 是什么类型的词。","takeaway":"横线上的词后面紧跟着一个名词 `pencil`。"},{"question":"在 `Who's`, `Whose`, `Who` 中，哪一个词可以像 `my`, `your` 一样，直接放在名词前面修饰它，表示“谁的”？","hint":"试着造句：`my pencil`, `whose pencil`。","takeaway":"`Whose` 可以作为限定词，直接修饰名词，表示所属关系。"},{"question":"可以把 `Who's` 放在 `pencil` 前面说 `Who's pencil` 吗？","hint":"读一下 `Who is pencil?`，通顺吗？","takeaway":"`Who's` 不能直接修饰名词，不符合语法规则。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"My birthday is _____ December.","options":{"A":"on","B":"in","C":"at","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查表示时间的介词用法。\n1.  句意为“我的生日在十二月”。\n2.  英语中，表示时间的介词 `in`, `on`, `at` 有不同的使用范围。\n3.  `in` 通常用在较长的时间段前，如年份、月份、季节、世纪等。例如：`in 2024`, `in summer`, `in the 21st century`。\n4.  `on` 通常用在具体的某一天或日期前。例如：`on Monday`, `on May 1st`。\n5.  `at` 通常用在具体的时刻前。例如：`at 8 o'clock`, `at noon`。\n6.  题干中的 `December` (十二月) 是一个月份，属于较长的时间段，因此前面应该使用介词 `in`。","knowledge_expansion_md":"### 时间介词 `in`, `on`, `at` 的用法总结\n\n我们可以用一个“金字塔”模型来记忆这三个介词的用法，从范围最大到最小：\n\n**`in` (在...里面) → 范围最大**\n* **年份**: `in 1999`, `in 2025`\n* **月份**: `in January`, `in August`\n* **季节**: `in spring`, `in winter`\n* **世纪**: `in the 20th century`\n* **泛指的一天中的某段时间**: `in the morning`, `in the afternoon`, `in the evening` (注意：夜晚用 `at night`)\n\n**`on` (在...上) → 范围中等**\n* **具体日期**: `on June 1st`, `on Christmas Day` (特指圣诞节当天)\n* **星期几**: `on Sunday`, `on Friday morning` (当具体到某天的上午/下午/晚上时，用 `on`)\n* **特定的日子**: `on my birthday`, `on New Year's Eve`\n\n**`at` (在...点) → 范围最小，最精确**\n* **具体时刻**: `at 5 o'clock`, `at half past six`\n* **一天中的某个时间点**: `at noon`, `at midnight`, `at night`\n* **固定短语**: `at the weekend` (英式), `at the same time`\n\n**易错点**：如果只有月份，用 `in` (`in December`)；但如果具体到某一天，即使有月份，也要用 `on` (`on December 25th`)。","socratic_tracks":[{"title":"时间单位判断","steps":[{"question":"题干中的时间词 `December` 是指一个具体的时刻、某一天，还是一个月份？","hint":"December 是十二月。","takeaway":"`December` 是一个月份，代表一段持续约30天的时间。"},{"question":"在英语中，当我们谈论在某一个“月份”里发生的事情时，通常用哪个介词？","hint":"想象一下，你是“在”一整个月份“里面”的。","takeaway":"表示在某月份，我们使用介词 `in`。"}]},{"title":"介词用法对比","steps":[{"question":"介词 `on` 通常用在什么样的时间前面？能举个例子吗？","hint":"想想“在星期一”或者“在6月1日”怎么说。","takeaway":"`on` 用在具体的日期或星期几前面，如 `on Monday`, `on May 1st`。"},{"question":"介词 `at` 通常用在什么样的时间前面？能举个例子吗？","hint":"想想“在8点钟”怎么说。","takeaway":"`at` 用在具体的时刻前面，如 `at 8 o'clock`。"},{"question":"比较 `in`, `on`, `at` 的用法后，对于 `December` (月份) 这个词，哪个介词最合适？","hint":"月份是一个时间段，不是一个时间点，也不是具体的一天。","takeaway":"对于月份，应该使用表示较长时间段的介词 `in`。"}]},{"title":"举一反三","steps":[{"question":"如果我想说“我的生日在12月25日”，句子会变成 `My birthday is _____ December 25th.`，这时横线应该填什么？","hint":"现在的时间精确到“天”了。","takeaway":"当时间具体到某一天时，无论前面是否有月份，都应该用 `on`。"},{"question":"如果我想说“派对在晚上8点开始”，句子是 `The party starts _____ 8 p.m.`，横线应该填什么？","hint":"这是一个非常具体的时间点。","takeaway":"当时间具体到某个时刻时，应该用 `at`。"},{"question":"通过这两个例子，你是否更清楚 `in`, `on`, `at` 在表示时间时的区别了？再回到原题，`_____ December` 应该用哪个？","hint":"只说月份，时间范围比较大。","takeaway":"只说月份时，固定搭配使用 `in`。"}]}]}}]},{"section_title":"V. 阅读理解。","section_instruction":"（共5分）","items":[{"number":"1","item_type":"reading","context_note":"(一) 根据短文内容，判断正误，正确的写“T”，错误的写“F”。\n\nMy name is Lily. I have a good friend. Her name is Amy. We are in the same grade. But we are in different classes. I am twelve years old. Amy is eleven years old. But she is taller than me. She is active and I am very quiet. She likes winter best because she can ice-skate in winter. I like summer best because I can swim in summer. We are so different, but we are good friends. We often go cycling together on the weekend. We both have strong bodies.","stem":"Lily and Amy are in the same class.","options":{"T":"True (正确)","F":"False (错误)"},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"这道题考查对文章细节的理解和判断能力。\n1.  题目陈述：`Lily and Amy are in the same class.` (莉莉和艾米在同一个班级。)\n2.  在文章中寻找相关信息。文章第四句和第五句明确指出：`We are in the same grade. But we are in different classes.`\n3.  `We` 指的是叙述者莉莉和她的朋友艾米。\n4.  这句话的意思是：“我们在同一个年级。但是我们在不同的班级。”\n5.  `different classes` (不同的班级) 与题目中的 `same class` (同一个班级) 意思完全相反。\n6.  因此，题目中的陈述是错误的。","knowledge_expansion_md":"### 阅读理解技巧：细节定位与关键词辨析\n\n在做正误判断题（T/F questions）时，有两个关键技巧：\n\n1.  **精确定位 (Locating Specific Information)**：\n    * 首先，仔细阅读题目，抓住核心信息词（关键词），如此题的 `same class`。\n    * 然后，带着这些关键词快速在文章中扫描，找到包含这些词或相关信息的句子。这比通读全文更高效。\n\n2.  **辨析关键词与逻辑关系 (Analyzing Keywords and Logic)**：\n    * **同义/反义词**：题目常常会使用原文词汇的同义词或反义词来设置考点。本题中，`same` (相同的) 和 `different` (不同的) 就是一对反义词，是判断的关键。\n    * **注意转折词**：像 `but`, `however`, `although` 这样的转折词非常重要。它们往往引出与前文相反或不同的信息，是出题人最喜欢设置考点的地方。本题中的 `But` 就是一个强烈的信号，提示我们后面的信息与前面的“同一年级”有所不同。\n    * **区分概念**：要能区分易混淆的概念，如 `grade` (年级) 和 `class` (班级)。虽然她们在 `same grade`，但这并不意味着她们在 `same class`。","socratic_tracks":[{"title":"文本细节定位","steps":[{"question":"题目是关于 Lily 和 Amy 是否在同一个班级。请在文章中找到描述她们班级或年级关系的那句话。","hint":"找一找含有 `class` 或 `grade` 这两个词的句子。","takeaway":"文章中说：“We are in the same grade. But we are in different classes.”"},{"question":"这句话 “But we are in different classes” 是什么意思？","hint":"`different` 的意思是“不同的”。","takeaway":"这句话的意思是“但是我们在不同的班级”。"},{"question":"那么，题目中的陈述 “Lily and Amy are in the same class” (Lily和Amy在同一个班级) 与文章内容是否一致？","hint":"一个说“不同班级”，一个说“相同班级”。","takeaway":"题目陈述与文章内容完全相反，因此是错误的。"}]},{"title":"关键词辨析","steps":[{"question":"题目陈述中的关键词是什么？","hint":"描述她们班级关系的核心词。","takeaway":"关键词是 `same class` (同一个班级)。"},{"question":"文章中与 `class` 相关的描述是什么？","hint":"在文章中找到 `class` 这个词，看看它前面的形容词是什么。","takeaway":"文章中说的是 `different classes` (不同的班级)。"},{"question":"`same` 和 `different` 这两个词的意思是相同、相近还是相反？","hint":"`same` 是相同，`different` 是不同。","takeaway":"`same` 和 `different` 是反义词，意思完全相反。"},{"question":"既然文章用 `different` 来描述班级，而题目用 `same`，那么这个陈述是对还是错？","hint":"描述完全相反。","takeaway":"这个陈述是错误的（False）。"}]},{"title":"逻辑与干扰信息","steps":[{"question":"文章中提到了 `same grade` (同一年级)，这和 `same class` (同一班级) 是一回事吗？","hint":"一个学校的一个年级通常有好几个班。","takeaway":"“同一年级”和“同一班级”是两个不同的概念，不能混淆。"},{"question":"文章中用了一个很重要的词来连接“同一年级”和“不同班级”，是哪个词？这个词起到了什么作用？","hint":"在 `...same grade. ___ ...different classes.` 中间。","takeaway":"是转折词 `But` (但是)，它强调了前后信息的对比和转折，是理解句意的关键。"}]}]}},{"number":"2","item_type":"reading","context_note":"See Passage (一).","stem":"Amy is quiet and Lily is active.","options":{"T":"True (正确)","F":"False (错误)"},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"这道题考查对人物特征描述的准确理解。\n1.  题目陈述：`Amy is quiet and Lily is active.` (艾米是安静的，莉莉是活跃的。)\n2.  在文章中定位描述性格的句子。文章中说：`She is active and I am very quiet.`\n3.  首先需要确定代词的指代对象。根据上下文，`I` 是文章的叙述者 `Lily`；`She` 指的是她的朋友 `Amy`。\n4.  将代词替换为名字后，原句的意思是：“Amy 是活跃的 (active)，而我 (Lily) 是非常安静的 (quiet)。”\n5.  对比文章信息和题目陈述：\n    * 文章：Amy 是 active，Lily 是 quiet。\n    * 题目：Amy 是 quiet，Lily 是 active。\n6.  可以发现，题目中的描述与文章内容正好相反，张冠李戴了。因此，该陈述是错误的。","knowledge_expansion_md":"### 阅读理解技巧：代词指代与信息核对\n\n在阅读理解中，准确判断代词的指代对象是理解文章的基础。同时，正误判断题常通过“信息错位”来设置陷阱。\n\n1.  **追踪代词指代 (Pronoun Reference)**\n    * 常见的代词有 `I`, `you`, `he`, `she`, `it`, `we`, `they` 等。\n    * 要确定一个代词指代谁或什么，通常需要看这个代词前面最近提到的人或物。\n    * 在本篇短文中，第一句 `My name is Lily.` 确定了 `I` 和 `my` 指的是 Lily。第二句 `Her name is Amy.` 确定了 `Her` 和 `She` 指的是 Amy。\n\n2.  **警惕“信息互换”陷阱 (Information Swap Trap)**\n    * 这是正误判断题中非常常见的一种错误选项设置方式。\n    * 出题人会将文中的两个或多个信息点（如人物、地点、时间、特征等）相互交换，形成一个看似正确但实际上错误的陈述。\n    * 本题就是典型的例子，它将 Lily 和 Amy 的性格特点 `active` 和 `quiet` 互换了位置。\n    * 做题时，最好的方法是把题目中的信息拆分成几个部分，然后逐一与原文进行核对，确保每个细节都准确无误。","socratic_tracks":[{"title":"代词指代追踪","steps":[{"question":"在文章中，叙述者“我”是谁？","hint":"看文章第一句 `My name is Lily.`","takeaway":"文中的 `I` 和 `my` 指的都是 Lily。"},{"question":"那么，文中的 `She` 和 `Her` 指的是谁？","hint":"看文章第二句 `Her name is Amy.`","takeaway":"文中的 `She` 和 `Her` 指的都是 Amy。"},{"question":"现在我们来看这句话：`She is active and I am very quiet.` 把代词换成名字，这句话是什么意思？","hint":"She = Amy, I = Lily.","takeaway":"这句话的实际意思是：“Amy 是活跃的，而 Lily 是非常安静的。”"},{"question":"对比一下题目中的陈述 `Amy is quiet and Lily is active.`，你发现了什么？","hint":"题目把两个人的性格说反了。","takeaway":"题目陈述与文章内容完全相反，所以是错误的。"}]},{"title":"信息拆分核对","steps":[{"question":"我们把题目拆成两部分来看。第一部分是 `Amy is quiet`。请在文章中找一找关于 Amy 性格的描述。","hint":"Amy 在文中是用 `She` 来指代的。","takeaway":"文章描述 Amy 的句子是 `She is active`，意思是“她是活跃的”。"},{"question":"那么，`Amy is quiet` (Amy是安静的) 这个说法对吗？","hint":"`active` (活跃的) 和 `quiet` (安静的) 是反义词。","takeaway":"这个说法是错误的，与原文矛盾。"},{"question":"既然题目的陈述中有一部分是错误的，那么整个陈述是对还是错？","hint":"一个判断句只要有一个部分不符合事实，整个句子就是错的。","takeaway":"只要有一处错误，整个陈述就是错误的（False）。"}]},{"title":"反义词辨析","steps":[{"question":"`active` 和 `quiet` 这两个形容词是什么意思？它们之间是什么关系？","hint":"一个好动，一个安静。","takeaway":"`active` 意为“活跃的”，`quiet` 意为“安静的”，它们是一对反义词。"},{"question":"根据文章，谁是 `active` 的？谁是 `quiet` 的？","hint":"回顾一下代词指代：`She (Amy) is active and I (Lily) am very quiet.`","takeaway":"文章明确指出 Amy 是 `active` 的，而 Lily 是 `quiet` 的。"},{"question":"题目是如何描述她们的？","hint":"看一下题目 `Amy is quiet and Lily is active.`","takeaway":"题目说 Amy 是 `quiet` 的，而 Lily 是 `active` 的，正好把人物和性格特点弄反了。"}]}]}},{"number":"3","item_type":"reading","context_note":"See Passage (一).","stem":"Lily's favourite season is summer.","options":{"T":"True (正确)","F":"False (错误)"},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"本题考查细节理解。文章倒数第三句明确指出 'I like summer best because I can swim in summer.'，其中 'I' 指代叙述者莉莉 (Lily)。因此莉莉最喜欢的季节是夏天，题干描述完全正确。","knowledge_expansion_md":"### 1. 阅读理解技巧：精确定位与代词还原\n在做阅读判断题时，正确的做法是：\n- **第一步：圈出关键词。** 圈出题干中的主语（Lily）、表语（summer）和核心词汇（favourite season / like best）。\n- **第二步：带关键词回原文定位。** 在文章中寻找关于“季节喜爱”的描述。\n- **第三步：还原代词。** 文章用第一人称自述，要明确文中的“I”是谁（即文章开头的 'My name is Lily.'）。\n- **第四步：核对信息。** 原文“I like summer best”即“Lily likes summer best”，这与题干“Lily's favourite season is summer”意思完全相符。\n\n### 2. 同义句转换\n“A's favourite... is B” 与 “A likes B best” 是英语中常见的同义表达形式。掌握这种转换能帮助快速识别文本中改写的信息。\n\n### 3. 季节词汇复习\n- `spring`: 春天\n- `summer`: 夏天\n- `autumn` / `fall`: 秋天 (英式/美式)\n- `winter`: 冬天","socratic_tracks":[{"title":"细节定位法","steps":[{"question":"题目问的是谁最喜欢的季节？","hint":"看看题目中的人名是什么。","takeaway":"题目问的是 Lily 最喜欢的季节。"},{"question":"根据文章内容，文章的叙述者“我”指的是谁？","hint":"文章开头第一句是怎么说的？","takeaway":"文章开头说“My name is Lily.”，所以文中的“我（I）”就是Lily。"},{"question":"那在文章中，关于“我”（Lily）最喜欢的季节是哪一句？","hint":"找一找带有“like”和表示季节名词的句子。","takeaway":"文章写道：“I like summer best because I can swim in summer.”（我最喜欢夏天……）"},{"question":"综合来看，这说明 Lily 最喜欢的季节是什么？","hint":"summer是什么季节？","takeaway":"Lily 最喜欢的季节是夏天（summer）。"},{"question":"那么，题目的说法“Lily's favourite season is summer”是正确的吗？","hint":"对比题目的描述和文章中提取出的事实。","takeaway":"题干描述与原文表达的事实完全一致，故应判断为正确（T）。"}]}]}},{"number":"4","item_type":"reading","context_note":"See Passage (一).","stem":"Amy is older than Lily.","options":{"T":"True (正确)","F":"False (错误)"},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查细节理解与数字比较。文章第六、七句提到 'I am twelve years old. Amy is eleven years old.'，由于文中的 'I' 代表叙述者莉莉 (Lily)，由此可知莉莉12岁，艾米11岁。所以艾米比莉莉小 (younger)，题干 'Amy is older than Lily' (艾米比莉莉大) 描述错误。","knowledge_expansion_md":"### 1. 形容词比较级 (Comparative Adjectives)\n“older than” 是形容词 `old` 的比较级形式，用于比较两者。其基本结构是：**A + be动词 + 形容词比较级 + than + B**。\n\n**构成规则：**\n- **单音节词：** 直接在词尾加 `-er`。如：`old` -> `older`, `young` -> `younger`, `tall` -> `taller`。\n- **以“辅音+y”结尾的双音节词：** 变 `y` 为 `i` 再加 `-er`。如：`happy` -> `happier`。\n- **多音节词和部分双音节词：** 在词前加 `more`。如：`beautiful` -> `more beautiful`。\n- **不规则变化：** 如：`good` -> `better`, `bad` -> `worse`。\n\n### 2. 反义表达\n“Amy is younger than Lily.” (Amy比Lily小) 这句话可以被替换为 “Lily is older than Amy.” (Lily比Amy大)，两句话表达的是同一个事实。在阅读中经常会遇到运用反义词来混淆视听的判断题。","socratic_tracks":[{"title":"数字信息提取与比较","steps":[{"question":"题目是关于谁和谁的年龄比较？","hint":"题目中出现了两个名字。","takeaway":"题目在比较 Amy 和 Lily 的年龄。"},{"question":"根据文章内容，她们的年龄分别是多少岁？注意文中的“I”是谁。","hint":"在文章中寻找 “years old” 及其前面的数字和主语。","takeaway":"文章中写道：“I am twelve years old. Amy is eleven years old.” 因为“I”是Lily，所以Lily 12岁，Amy 11岁。"},{"question":"比较一下她们俩的年龄，谁的年龄更大？","hint":"12 和 11 哪个数字更大？","takeaway":"Lily 的年龄比 Amy 大。所以 Amy 比 Lily 小。"}]},{"title":"比较级语法理解","steps":[{"question":"题目中的 “older than” 是什么意思？","hint":"“old” 是“老的，年长的”，“-er than” 是一个比较结构。","takeaway":"“older than” 意为“比……年长 / 大”。"},{"question":"那么 “Amy is older than Lily” 这句话翻译成中文是什么？","hint":"把人名和比较关系组合起来。","takeaway":"这句话的意思是“Amy 比 Lily 大”。"},{"question":"根据你在文章中提取到的事实（Amy 11岁，Lily 12岁），题目的说法是对的吗？","hint":"11岁的人比12岁的人大吗？","takeaway":"说法与事实相反，所以这个描述是错误的（F）。"}]}]}},{"number":"5","item_type":"reading","context_note":"See Passage (一).","stem":"Lily and Amy often go cycling on the weekend.","options":{"T":"True (正确)","F":"False (错误)"},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"本题考查细节理解。文章倒数第二句明确提到 'We often go cycling together on the weekend.'（我们在周末经常一起去骑自行车）。由于此文的叙事者 'We' 就是莉莉 (Lily) 和艾米 (Amy)，题干描述与原文内容完全一致，故正确。","knowledge_expansion_md":"### 频率副词 (Adverbs of Frequency)\n频率副词用来表示动作发生的频繁程度，是英语学习中的一个重点，也是阅读理解题的常见考点。\n\n**1. 常见频率副词（按频率从高到低）**\n- `always` (总是, 100%)\n- `usually` (通常, 约90%)\n- `often` (经常, 约70%)\n- `sometimes` (有时, 约50%)\n- `occasionally` (偶尔, 约30%)\n- `seldom` / `rarely` (很少, 约10%)\n- `hardly ever` (几乎从不, 约5%)\n- `never` (从不, 0%)\n\n**2. 在句中的位置**\n- 通常在 **行为动词之前**：e.g., `I often drink coffee.`\n- 在 **be动词、助动词或情态动词之后**：e.g., `She is always happy.` `I can never forget it.`\n\n**3. 同义替换 (Paraphrase)**\n阅读题常常将原文句子做简单的词汇替换。本题是将代词 'We' 还原为了具体的名字 'Lily and Amy'。要习惯识别这种形式的同义替换。","socratic_tracks":[{"title":"关键词对比法","steps":[{"question":"题目中描述她们周末做了什么活动？","hint":"找到题目里的动作短语。","takeaway":"题目中描述的活动是“go cycling”（骑自行车）。"},{"question":"文章中是怎么描写她们周末活动的呢？请找到对应的句子。","hint":"在文章倒数第二句找一找含有“weekend”的句子。","takeaway":"文章中写道：“We often go cycling together on the weekend.”"},{"question":"文中的“We”（我们）指的是谁？","hint":"整篇文章讲述的是哪两个女孩的事？","takeaway":"“We” 就是指 Lily 和 Amy。"},{"question":"对比原文句子和题干，它们所表达的事件、人物和频率是否相符？","hint":"“We often go cycling” 对应 “Lily and Amy often go cycling”。","takeaway":"题干除了将代词还原为人名以外，其他意思完全一致，所以是正确的（T）。"}]}]}},{"number":"6","item_type":"reading","context_note":"(二) 根据短文内容，选择正确答案。\n\nIt's a bright sunny day. A woman gets off the bus and goes into a butcher (屠夫) shop to buy some meat. A strange man follows her into the shop and stands behind her. Suddenly, the woman screams (尖叫), and the man turns and runs out of the shop. At that time, some policemen are passing by. They find a gun in the man's pocket. The man is a robber.\n\n\"Madam, thank you very much. Your scream saved me,\" the butcher says, \"but how did you know he was a robber?\"\n\n\"I didn't know,\" replies the woman. \"I screamed because the meat was too expensive.\"","stem":"It's a _____ day.","options":{"A":"rainy","B":"sunny","C":"windy","D":"cloudy"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对文章具体信息的定位和理解，属于细节题。\n1.  题目要求填空：“It's a _____ day.” (这是个……的天气。)\n2.  我们需要在文章中找到描述当天天气的句子。\n3.  阅读短文的第一句话：“It's a bright sunny day.” (这是一个晴朗明媚的日子。)\n4.  这句话直接、明确地告诉我们当天的天气是 “sunny” (晴朗的)。\n5.  将选项与原文信息进行比对：\n    - A: `rainy` (下雨的)，不符。\n    - B: `sunny` (晴朗的)，相符。\n    - C: `windy` (有风的)，不符。\n    - D: `cloudy` (多云的)，不符。\n6.  因此，正确答案是 B。","knowledge_expansion_md":"### 1. 天气相关词汇拓展\n在英语学习中，描述天气是一个非常基础且重要的话题。除了本题中的四个词，还有更多相关表达：\n- **形容词:** `hot` (炎热的), `warm` (温暖的), `cool` (凉爽的), `cold` (寒冷的), `freezing` (极冷的), `snowy` (下雪的), `foggy` (有雾的), `stormy` (有暴风雨的)。\n- **名词:** `sunshine` (阳光), `rain` (雨), `wind` (风), `cloud` (云), `snow` (雪), `fog` (雾), `storm` (暴风雨), `thunder` (雷), `lightning` (闪电)。\n- **句型:** \n  - `It's ...` (e.g., `It's sunny.`) \n  - `What's the weather like today?` (今天天气怎么样？)\n\n### 2. 阅读理解技巧：寻读法 (Scanning)\n对于这种询问具体信息的题目（如时间、地点、人物、天气等），最有效的阅读方法是“寻读法”。\n- **步骤1：** 读题，抓住关键词（本题是 `day`，暗示问天气）。\n- **步骤2：** 不必通读全文，而是带着关键词像雷达一样在文章中快速扫描，寻找与天气相关的词汇。\n- **步骤3：** 定位到原文第一句 “It's a bright sunny day.”，直接找到答案。\n这种方法可以大大提高做题速度和准确率。","socratic_tracks":[{"title":"寻读定位法","steps":[{"question":"这个问题在问什么？","hint":"看看句子里的横线和选项，它们都在描述什么？","takeaway":"这个问题在问天气怎么样。"},{"question":"你能在文章里找到描述天气的一句话吗？它通常在故事的什么位置？","hint":"故事的开头常常会交代时间、地点和天气。","takeaway":"文章的第一句话就是 “It's a bright sunny day.”"},{"question":"这句话告诉我们天气是怎样的？哪个选项和它意思最匹配？","hint":"“sunny” 是什么意思？","takeaway":"原文直接说明了是 “sunny day”，所以选 B。"}]},{"title":"天气词汇辨析","steps":[{"question":"选项 A, B, C, D 分别是什么意思？","hint":"A. 下雨的, B. 晴朗的, C. 有风的, D. 多云的。","takeaway":"四个选项分别描述了雨天、晴天、风天和阴天。"},{"question":"文章中 “bright sunny day” 中的 “bright” 和 “sunny” 分别是什么意思？","hint":"“bright” 指光线，“sunny” 指天气状况。","takeaway":"“bright” 意为“明亮的”， “sunny” 意为“晴朗的”，合在一起就是“阳光明媚的一天”。"},{"question":"为什么其他选项是错的？","hint":"将其他选项的词义与原文的 “bright sunny” 进行比较。","takeaway":"其他选项描述的天气状况与原文的直接陈述相矛盾。"}]},{"title":"理解故事背景","steps":[{"question":"为什么作者在故事开头要先描述天气？","hint":"想一想，一个好天气是不是会让故事的开头显得很平常、很普通？","takeaway":"描述天气是为了交代故事发生的背景和营造氛围。"},{"question":"一个“阳光明媚”的日子，通常会让人联想到什么样的心情或事件？","hint":"是开心的、平常的，还是悲伤的、紧张的？","takeaway":"通常联想到平静、普通的一天，这与后面发生的意外事件形成了对比。"},{"question":"理解这种写作手法对我们阅读有什么帮助？","hint":"知道作者为什么这么写，可以帮助我们更好地理解故事的转折和深层含义。","takeaway":"关注故事的开头背景描写，有助于我们预测情节发展和理解作者意图。"}]}]}},{"number":"7","item_type":"reading","context_note":"See Passage (二).","stem":"The woman wants to buy _____.","options":{"A":"fruit","B":"vegetables","C":"drinks","D":"meat"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查细节定位能力。根据文章第一段，一位女士走下一辆巴士并走进一家肉店（butcher shop）去买一些肉（to buy some meat）。原文句子 “A woman gets off the bus and goes into a butcher shop to buy some meat.” 直接表明了她想要购买的物品是肉。因此，正确答案是 D。","knowledge_expansion_md":"**1. 购物场景词汇拓展：**\n* **地点:** `supermarket` (超市), `grocery store` (杂货店), `bakery` (面包店), `butcher's shop` (肉店), `bookstore` (书店)。\n* **物品:** `fruit` (水果), `vegetables` (蔬菜), `drinks` (饮料), `meat` (肉), `bread` (面包), `milk` (牛奶)。\n* **人物:** `customer` (顾客), `shopkeeper` (店主), `butcher` (屠夫), `baker` (面包师), `cashier` (收银员)。\n\n**2. 表达购物意愿/目的的句型：**\n* `I go to the store to buy...` (我去商店买……) - 用动词不定式 `to buy` 表示目的。\n* `I'd like to buy...` (我想买……)\n* `I want some...` (我想要些……)","socratic_tracks":[{"title":"细节定位","steps":[{"question":"题目问“女士想买什么”，我们应该在文章的哪个部分寻找答案呢？","hint":"通常，故事的开头会介绍人物、地点以及他们正在做的事情。","takeaway":"阅读理解题的答案往往隐藏在文章的特定句子中，要学会快速定位关键信息。"},{"question":"在文章第一段中，关于这位女士去了哪里、去做什么，原话是怎么写的？","hint":"找含有 \"woman\"、\"shop\" 和 \"buy\" 的句子。","takeaway":"文章写道：“A woman gets off the bus and goes into a butcher shop to buy some meat.”"}]},{"title":"场景词汇","steps":[{"question":"文章提到女士去的是一家 “butcher shop”，你知道这是什么店吗？","hint":"“butcher” 指的是“屠夫，卖肉的人”。","takeaway":"“butcher shop” 就是肉店，专门卖肉的地方。"},{"question":"知道了她是去肉店，那么在 fruit（水果）、vegetables（蔬菜）、drinks（饮料）和 meat（肉）这四个选项中，哪个最可能在肉店买到？","hint":"肉店的核心商品是什么？","takeaway":"通过关键场景词（如 butcher shop）可以有效推断出与场景相关的正确答案（meat），而且文中也明确写了 `to buy some meat`。"}]}]}},{"number":"8","item_type":"reading","context_note":"See Passage (二).","stem":"The strange man is a _____.","options":{"A":"policeman","B":"driver","C":"businessman","D":"robber"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查人物身份的直接提取。根据文章第一段的描述，警察在那个奇怪的男人（the strange man）的口袋里找到了一把枪，接着原文明确给出了结论：“The man is a robber.”（这个男人是一个抢匪）。因此，正确答案是 D。","knowledge_expansion_md":"**1. 常见职业/身份词汇：** \n* `policeman` / `police officer` (警察)\n* `driver` (司机)\n* `businessman` (商人)\n* `robber` (抢匪), `thief` (小偷), `burglar` (入室窃贼)\n\n**2. 推断与确认：** 在阅读故事时，通常会先描述某人的行为特点（如跟踪女士，口袋里有枪），让读者进行推测，最后再由作者或情节直接揭示身份（The man is a robber.）。做题时要找准这些直接定性的关键句。","socratic_tracks":[{"title":"关键句定位","steps":[{"question":"题目问那个“奇怪的男人”的身份是什么。在文章的第一段，对这个男人的最终结论是什么？","hint":"看看第一段的最后一句话是怎么说这个男人的。","takeaway":"文章第一段最后一句直接说：“The man is a robber.”（这个男人是一个抢匪）。"},{"question":"选项中哪个词和原文一致？","hint":"A. policeman B. driver C. businessman D. robber","takeaway":"选项 D “robber” 与原文完全一致。"}]},{"title":"行为推断补充","steps":[{"question":"在文章直接说出他是 robber 之前，警察在他的口袋里发现了什么？","hint":"文中写道：They find a _____ in the man's pocket.","takeaway":"警察在他口袋里发现了一把枪（a gun）。"},{"question":"带着枪尾随别人进入商店，结合这个行为，也侧面证实了他是个抢匪。这给了我们什么启示？","hint":"不仅要看明确的文字结论，还要理解人物的行为逻辑。","takeaway":"通过人物的反常行为（跟踪、带枪），可以帮助我们更好地理解和确认文中的关键信息。"}]}]}},{"number":"9","item_type":"reading","context_note":"See Passage (二).","stem":"The meat is _____.","options":{"A":"cheap","B":"expensive","C":"nice","D":"fresh"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查细节理解。在故事的结尾，屠夫问女士怎么知道那个人是抢匪，女士回答说 'I didn't know... I screamed because the meat was too expensive.'（我不知道……我尖叫是因为肉太贵了）。由此可知，根据文本中女士的说法及其尖叫的直接原因，肉是昂贵的 (expensive)。故选 B。","knowledge_expansion_md":"**1. 理解幽默 (Humor & Punchline):**\n很多简短的英语阅读材料（尤其是笑话或小故事）常常会在结尾处设计一个意想不到的转折（Punchline）。这个转折往往是破题的关键。在这个故事中，大家都以为女士是因为察觉到危险而尖叫，结果她仅仅是因为看到了肉的高昂价格被吓到了。理解这种幽默反转，是做对这道题的核心。\n\n**2. 描述价格的形容词：**\n* `cheap` (便宜的)\n* `expensive` (昂贵的), `costly` / `pricey` (昂贵的)\n* `free` (免费的)","socratic_tracks":[{"title":"理解故事转折","steps":[{"question":"女士在肉店里突然大声尖叫（screamed），周围的人（包括屠夫）认为她为什么尖叫？","hint":"抢匪听到尖叫就跑了，屠夫对她说了什么？","takeaway":"屠夫以为她发现了抢匪，是用尖叫声救了他。"},{"question":"但是，在故事的最后，女士自己解释的尖叫原因是什么？","hint":"找到文章的最后一句话，看看引号里面说了什么。","takeaway":"女士说：“I screamed because the meat was too expensive.”（我尖叫是因为肉太贵了。）"},{"question":"所以根据这篇短文的文本内容，肉的特点是什么？","hint":"文中明确用了一个词来修饰 meat。","takeaway":"根据文章明确交代的原因，肉是非常昂贵的（expensive），所以选 B。"}]}]}},{"number":"10","item_type":"reading","context_note":"See Passage (二).","stem":"The woman _____.","options":{"A":"wants to save the butcher","B":"wants to help the robber","C":"wants to help the police","D":"doesn't know the robber"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查对文章情节和幽默内涵的理解。屠夫以为女士尖叫是为了救他，问她是怎么识破抢匪的。女士回答 'I didn't know'（我不知道），说明她根本不认识抢匪，也不知道对方在抢劫。她尖叫纯粹是因为肉价太贵，歪打正着吓跑了抢匪。因此选项 D 'doesn't know the robber'（不认识/不知道那个抢匪）最符合文意。","knowledge_expansion_md":"**1. 推断人物动机与事实状态:**\n* **行为：** 女士尖叫。\n* **旁人的误解：** 屠夫以为女士想救他（wants to save the butcher）。\n* **事实真相：** 女士说“我不知道（他是抢匪）”。她并没有救人的动机，纯粹是被价格吓到了。所以A选项（想救屠夫）是屠夫的主观臆想，不是事实。\n* 通过分析结尾的对话，我们可以澄清误会，得出正确的事实状态：她完全不知情（doesn't know the robber）。\n\n**2. 核心动词与短语：**\n* `save`: 拯救。\n* `help`: 帮助。\n* `doesn't know`: 不知道/不认识。","socratic_tracks":[{"title":"动机与误解的澄清","steps":[{"question":"屠夫对女士说“Your scream saved me”，他认为女士的动机是什么？","hint":"屠夫以为女士察觉了什么才尖叫？","takeaway":"屠夫认为女士是故意尖叫来救他的（选项A的意思）。"},{"question":"但是，当屠夫问她是怎么知道那个人是抢匪时，女士是怎么回答的？","hint":"看文章最后一句女士说的原话。","takeaway":"女士回答说：“I didn't know”（我不知道）。"},{"question":"如果她连那个人是抢匪都不知道，她会故意想去救屠夫吗？或者帮助警察/抢匪吗？","hint":"不知情的情况下，不可能有这些针对性的目的。","takeaway":"既然她不知道对方是抢匪，那么 A、B、C 选项中提到的明确目的（救人或帮人）都不成立。"},{"question":"综合来看，最符合事实的一句话是什么？","hint":"她对那个奇怪的男人和他的身份处于什么状态？","takeaway":"她对抢匪的身份毫不知情，即她不认识/不知道那个抢匪（doesn't know the robber），所以 D 是正确答案。"}]}]}}]}],"content_markdown":"## 成都石室东部新区实验学校2026级新初一入学测试英语试卷\n**（满分：20分 时间：20分钟）**\n\n### I. 找出画线部分发音与其他三个不同的一项。\n**（共5分）**\n\n1. ( &nbsp; )\nA. ice\nB. ride\nC. ship\nD. kite\n\n2. ( &nbsp; )\nA. came\nB. last\nC. play\nD. cake\n\n3. ( &nbsp; )\nA. know\nB. show\nC. how\nD. flow\n\n4. ( &nbsp; )\nA. nothing\nB. these\nC. fifth\nD. month\n\n5. ( &nbsp; )\nA. year\nB. near\nC. bear\nD. dear\n\n6. ( &nbsp; )\nA. easy\nB. sea\nC. weather\nD. bee\n\n7. ( &nbsp; )\nA. on\nB. hot\nC. body\nD. open\n\n8. ( &nbsp; )\nA. blue\nB. number\nC. up\nD. umbrella\n\n9. ( &nbsp; )\nA. nurse\nB. bird\nC. card\nD. shirt\n\n10. ( &nbsp; )\nA. look\nB. room\nC. zoo\nD. food\n\n### II. 请写出下列所给单词的一个同类词。\n**（共2.5分）**\n\n1. plane, subway, _____\n2. driver, policeman, _____\n3. happy, angry, _____\n4. apple, banana, _____\n5. jacket, shirt, _____\n\n### III. 根据情境，选择正确的英语句子。\n**（共2.5分）**\n\n1. ( &nbsp; ) 你去商场买衣服，想要询问某件商品的价格时，你应该说：\nA. How many is it?\nB. How much is it?\n\n2. ( &nbsp; ) 当你想问John打算去哪里时，你应该说：\nA. Where are you going, John?\nB. Where are you going to, John?\n\n3. ( &nbsp; ) 朋友告诉你他生病了，你应该说：\nA. I'm sorry to hear that.\nB. That's OK.\n\n4. ( &nbsp; ) 当你想表示“我们经常在周末去徒步远足。”你应该说：\nA. We often go hiking on the weekend.\nB. We often go hike on the weekend.\n\n5. ( &nbsp; ) 当好友 Sam 在你家做客时，你应该说：\nA. Thank you!\nB. Have some cake!\n\n### IV. 选择填空。\n**（共5分）**\n\n1. ( &nbsp; ) There _____ much water on the ground now.\nA. am\nB. is\nC. are\n\n2. ( &nbsp; ) — I will go to Shanghai for a trip next week.\n— Great. _____!\nA. Have a good time\nB. Nice to see you\nC. Good job\n\n3. ( &nbsp; ) Mike and Jane _____ in the library.\nA. is\nB. am\nC. are\n\n4. ( &nbsp; ) My mother _____ long hair.\nA. was\nB. have\nC. has\n\n5. ( &nbsp; ) — What did you do last night?\n— I _____ my homework and _____ a film on TV.\nA. did; see\nB. did; saw\nC. do; saw\n\n6. ( &nbsp; ) The trip yesterday was great. We _____ it very much.\nA. talked\nB. enjoyed\nC. played\n\n7. ( &nbsp; ) Sarah likes _____ snowmen.\nA. makes\nB. made\nC. making\n\n8. ( &nbsp; ) Jack usually _____ to school by bike. But yesterday he _____ to school.\nA. go; walk\nB. goes; walks\nC. goes; walked\n\n9. ( &nbsp; ) _____ pencil is this?\n— Linda's.\nA. Who's\nB. Whose\nC. Who\n\n10. ( &nbsp; ) My birthday is _____ December.\nA. on\nB. in\nC. at\n\n### V. 阅读理解。\n**（共5分）**\n\n**(一) 根据短文内容，判断正误，正确的写“T”，错误的写“F”。**\n\nMy name is Lily. I have a good friend. Her name is Amy. We are in the same grade. But we are in different classes. I am twelve years old. Amy is eleven years old. But she is taller than me. She is active and I am very quiet. She likes winter best because she can ice-skate in winter. I like summer best because I can swim in summer. We are so different, but we are good friends. We often go cycling together on the weekend. We both have strong bodies.\n\n1. ( &nbsp; ) Lily and Amy are in the same class.\n\n2. ( &nbsp; ) Amy is quiet and Lily is active.\n\n3. ( &nbsp; ) Lily's favourite season is summer.\n\n4. ( &nbsp; ) Amy is older than Lily.\n\n5. ( &nbsp; ) Lily and Amy often go cycling on the weekend.\n\n**(二) 根据短文内容，选择正确答案。**\n\nIt's a bright sunny day. A woman gets off the bus and goes into a butcher (屠夫) shop to buy some meat. A strange man follows her into the shop and stands behind her. Suddenly, the woman screams (尖叫), and the man turns and runs out of the shop. At that time, some policemen are passing by. They find a gun in the man's pocket. The man is a robber.\n\n\"Madam, thank you very much. Your scream saved me,\" the butcher says, \"but how did you know he was a robber?\"\n\n\"I didn't know,\" replies the woman. \"I screamed because the meat was too expensive.\"\n\n6. ( &nbsp; ) It's a _____ day.\nA. rainy\nB. sunny\nC. windy\nD. cloudy\n\n7. ( &nbsp; ) The woman wants to buy _____.\nA. fruit\nB. vegetables\nC. drinks\nD. meat\n\n8. ( &nbsp; ) The strange man is a _____.\nA. policeman\nB. driver\nC. businessman\nD. robber\n\n9. ( &nbsp; ) The meat is _____.\nA. cheap\nB. expensive\nC. nice\nD. fresh\n\n10. ( &nbsp; ) The woman _____.\nA. wants to save the butcher\nB. wants to help the robber\nC. wants to help the police\nD. doesn't know the robber\n","proofread_notes":"1. 试卷标题根据卷面信息“成都某石室东部新区实验初”优化为“成都石室东部新区实验学校2026级新初一入学测试英语试卷”，更符合规范。\n2. 第一大题（语音题）为常规考点，原卷未对考察音素进行划线，已按此方式保留，但在电子交互版中题干补充了考察发音字母。\n3. 第一大题的题型归类（item_type）由 `choice` 修改为了专属的 `phonetics`。\n4. 第四大题第1、8小题旁附有的二维码营销信息（“视频讲解”）已移除。\n5. 第五大题（阅读理解）第一篇的题型归类（item_type）由 `choice` 修改为了 `reading`。同时修复了原JSON中阅读理解第一篇部分题目的AI解析幻觉（原解析虚构了不属于原文的段落）并更正了正确答案。\n6. 第五大题（阅读理解）第二篇的题型归类（item_type）由 `choice` 修改为了 `reading`，并基于原文本故事的幽默内涵（punchline）更正了最后两题的答案及解析。\n7. 全卷格式已按出版标准调整，如统一中英文标点、补充了部分选择题的空选项、清理了冗余的答题区提示等。","set_number":17,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_17\\page_031.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":40},{"step":2,"name":"verify","items":40,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":40}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:11:53.567018+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");

  function isMarkdownTableSeparatorRow(line) {

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \n」分段，没有空行。
   * 按换行拆成多段，每段独立 <p>，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */

    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",

    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();

    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

    if (

    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;

    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;

    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;

      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");

      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;

    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();

  function sectionInstructionHasClozeInlineBlanks(ins) {

  /** 大题说明里 (53) Y_____ 或 f__1__ 式文中空，小题无 stem、无 A–D（首字母填空等） */
  function isClozeInlineFillSectionGroup(g) {

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;
  }

    const a = /^\((\d+)\)/.exec(m0);

    return b ? b[1] : "";

    let li = 0;

      li = h.i + h.len;

      } else {

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [

      /^__(\d+)__/.exec(fragment),
      /^[a-zA-Z]?__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {

      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";

    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;

      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};

      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!String(stem || "").trim()) {
      return opt.placeholderParen ? "<p class='stem'>（ ）</p>" : "<p class='stem'></p>";
    }
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;

      out[m[1].toUpperCase()] = m[2].trim();

  function isClozeDialogueCompletionSection(row) {

  /** 全卷连续题号区间（与首页卡片「共 n 道」计数规则一致）；供无 range_text 时使用 */
  function sectionGlobalQuestionRangeLabel(si) {
    let start = 0;
    for (let i = 0; i < si; i++) {
      start += sectionCardQuestionCount(state.bySection["sec:" + i] || []);
    }
    const rows = state.bySection["sec:" + si] || [];
    const cnt = sectionCardQuestionCount(rows);
    if (!cnt) return "";
    const lo = start + 1;

    return lo === hi ? "第 " + lo + " 题" : "第 " + lo + "–" + hi + " 题";
  }

  /** 左侧已有文章的完形/语法填空小题：仅展示纵向 A–D(或含 E…)，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || !isClozeLikeQuizType(row.type)) return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
