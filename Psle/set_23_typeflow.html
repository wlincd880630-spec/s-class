 near his new house”。","knowledge_expansion_md":"### 1. 关键词定位法\n在阅读理解中，快速找到答案的关键是定位与题干关键词相关的信息。本题的关键词是 “new house”。回到原文寻找包含该词的句子，可以迅速锁定答案范围在第一段。\n\n### 2. 介词 `near` 的用法\n`near` 是一个介词，表示“在……附近”，用来描述两个事物在空间位置上的接近。例如：\n- My school is **near** a post office. (我的学校在邮局附近。)\n- Don't stand **near** the railway. (不要站在铁路附近。)\n\n### 3. `There be` 句型\n`There is a small garden near his house.` 是一个典型的 `There be` 句型，用来表示“某地有某物”。其基本结构是 `There be + 名词 + 地点状语`。\n- **肯定句:** There is a book on the desk.\n- **否定句:** There isn't a book on the desk.\n- **疑问句:** Is there a book on the desk?","socratic_tracks":[{"title":"信息定位","steps":[{"question":"题目问的是 John 的新房子在什么地方。我们应该在文章的哪个部分寻找答案？","hint":"通常，描述人物或地点基本情况的句子会出现在文章的开头部分。","takeaway":"带着问题回到原文，特别是文章的开头，寻找与题干关键词相关的句子。"},{"question":"在文章第一段，提到了哪些与 John 的房子位置有关的地点？","hint":"仔细阅读第一段，找一找 `garden`, `river` 这些地点名词。","takeaway":"原文提到了 `a small garden near his house` 和 `isn't a river near his new house`。"},{"question":"根据找到的信息，哪个选项是正确的？为什么其他选项是错误的？","hint":"对比原文 “There is a small garden near his house.” 和选项。再看看原文关于河的描述。","takeaway":"原文明确说房子附近有花园，而没有河，因此选项 C 正确。"}]},{"title":"介词辨析","steps":[{"question":"选项 C 用了 `near a garden`。`near` 这个词是什么意思？","hint":"想象一下你家和学校的位置关系，如果很近，你会怎么说？","takeaway":"`near` 是一个介词，意思是“在……附近”，表示位置上的邻近。"},{"question":"文章中除了 `near a garden`，还在哪里用到了 `near`？","hint":"在第一段中再找找看，有没有其他包含 `near` 的句子。","takeaway":"文章中还提到了 `near his house` 和 `near his new house`，都在描述位置关系。"}]},{"title":"干扰项分析","steps":[{"question":"为什么选项 B “near a river”（在河边）是错误的？","hint":"文章第一段的后半部分是怎么描述“河”的？注意看有没有否定词。","takeaway":"原文明确指出 “But there isn't a river near his new house”，所以 B 是错误的。"},{"question":"为什么选项 A “in the park”（在公园里）是错误的？","hint":"文章说公园是 `near here`（在这附近），但 John 的房子是在公园里面吗？","takeaway":"John 只是去公园玩，他的房子在公园附近，而不是在公园里面。`in` 和 `near` 的意思不同。"}]}]}},{"number":"22","item_type":"reading","context_note":"Passage A","stem":"John likes playing _____.","options":{"A":"in his new house","B":"in the river","C":"in the garden","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目询问约翰喜欢玩什么。根据原文第一段第三句 “He likes playing in the river.”（他喜欢在河里玩），我们可以直接找到答案。这句话清晰地表明了约翰的喜好。尽管他后来在水池里玩了，但题目问的是他的“喜好”，原文直接给出了答案。","knowledge_expansion_md":"### 1. 区分“喜好”与“行为”\n在阅读中，要注意区分人物的长期喜好（preference）和单次具体行为（action）。本题的关键词是 `likes`，问的是喜好。虽然 John 后来 `plays in the pool`（在水池里玩），但这只是一个具体的行为，而 `likes playing in the river`（喜欢在河里玩）才是他的喜好。\n\n### 2. 动词 `like` 的用法\n`like` 作为动词，表示“喜欢”，后面可以跟名词、代词或动名词（v-ing形式）。\n- **like + 名词:** I like apples.\n- **like + 动名词 (doing):** He likes playing football. (他喜欢踢足球。)\n- **like + to do (不定式):** She likes to read books in the library. (她喜欢在图书馆看书。)\n在表达习惯性的爱好时，`like doing` 更为常见。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"这个问题问的是 John “喜欢”做什么。在原文中，哪个词表达了“喜欢”的意思？","hint":"这是一个非常基础的动词，想一想“我喜欢苹果”用英语怎么说。","takeaway":"文中的 `likes` 就是“喜欢”的意思，是解题的关键词。"},{"question":"找到包含 `likes` 的那句话了吗？它告诉我们 John 喜欢做什么？","hint":"在文章第一段找一找 `He likes...` 这句话。","takeaway":"关键句是 “He likes playing in the river.”，直接说明了他喜欢在河里玩。"}]},{"title":"逻辑辨析","steps":[{"question":"文章后面提到 John 在水池里玩（`plays in the pool`），那为什么答案不是“在水池里玩”呢？","hint":"注意审题，题目问的是他“喜欢”做什么，还是他“做了”什么？","takeaway":"要严格根据题干提问来回答，题目问的是喜好（likes），而不是具体的行为（plays）。"},{"question":"为什么选项 C “in the garden”（在花园里）是错误的？","hint":"文章提到花园了吗？提到 John 在花园里玩或者喜欢在花园里玩了吗？","takeaway":"原文只说房子附近有花园，并未提及 John 在花园里的任何活动或喜好，属于无关信息。"}]},{"title":"语法点：like doing","steps":[{"question":"在句子 “He likes playing in the river.” 中，为什么 `play` 这个词要变成 `playing`？","hint":"在一个句子里，动词 `likes` 后面如果再跟一个表示动作的词，这个词的形式需要变化。","takeaway":"动词 `like` 后面跟另一个动词作宾语时，通常要把这个动词变成动名词形式（v-ing）。"},{"question":"你能用 “like doing sth.” 这个句型，说说你喜欢做什么吗？","hint":"例如：I like ______ (watch) TV. 空格里应该填什么？","takeaway":"学会使用 `like doing sth.` 句型，可以帮助我们地道地表达自己的爱好。"}]}]}},{"number":"23","item_type":"reading","context_note":"Passage A","stem":"There isn't _____ near his new house.","options":{"A":"a river","B":"a park","C":"a garden","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节查找题，并且考查对否定信息的理解。题目问约翰的新家附近“没有”什么。根据原文第一段第四句 “But there isn't a river near his new house.”（但是他的新家附近没有一条河），我们可以直接找到答案。句中的 `isn't` (is not) 表明了否定的含义。","knowledge_expansion_md":"### 1. `There be` 句型的否定形式\n`There be` 句型用来表示“某地有某物”，其否定形式是在 `be` 动词后加 `not`。\n- **单数否定:** `There is not...` 或 `There isn't...`\n  - *There isn't a book on the desk.* (桌子上没有书。)\n- **复数否定:** `There are not...` 或 `There aren't...`\n  - *There aren't any apples in the basket.* (篮子里没有任何苹果。)\n\n### 2. 转折连词 `But`\n`But` 是一个常用的转折连词，表示前后内容在意义上的转折或对比。它常常引导出与前文相反或出乎意料的信息，是阅读理解中需要特别关注的信号词。\n- *He likes playing in the river. **But** there isn't a river near his new house.* (他喜欢在河里玩。**但是**他家附近没有河。)\n看到 `but`，就意味着后面的信息很关键，可能是一个考点。","socratic_tracks":[{"title":"否定信息识别","steps":[{"question":"题目问的是新家附近“没有”什么。题干中的哪个词提示我们去寻找“没有”的信息？","hint":"注意看 `There isn't` 这个结构，`n't` 是什么的缩写？","takeaway":"题干中的 `isn't` 是 `is not` 的缩写，是明确的否定信号，要求我们寻找不存在的事物。"},{"question":"回到原文第一段，哪句话同样使用了否定结构，告诉我们什么东西不存在？","hint":"寻找同样包含 `isn't` 或 `not` 的句子。","takeaway":"原文关键句是 “But there isn't a river near his new house.”，直接回答了问题。"}]},{"title":"干扰项排除","steps":[{"question":"为什么选项 B “a park” 是错误的？","hint":"读第二段，妈妈是怎么介绍公园的？","takeaway":"原文明确提到 “There is a beautiful park near here”，说明公园是存在的。"},{"question":"为什么选项 C “a garden” 是错误的？","hint":"读第一段，关于花园是怎么说的？","takeaway":"原文明确提到 “There is a small garden near his house”，说明花园也是存在的。"}]},{"title":"信号词 `But`","steps":[{"question":"在关键句 “But there isn't a river...” 中，开头的 `But` 起到了什么作用？","hint":"它连接的前一句话是“他喜欢在河里玩”。再看这句话“但是他家附近没有河”。这两句话之间是什么关系？","takeaway":"`But` 是一个转折连词，表示前后意思的转折或对比，它后面的信息通常很重要。"},{"question":"理解了 `But` 的作用，对我们理解 John 的情绪有什么帮助？","hint":"喜欢的东西（河）和现实中没有的东西（没有河）放在一起，会产生什么样的情绪？","takeaway":"正是因为这种转折——喜欢河但附近却没有河——才导致了 John 后来的不开心（He is not happy）。"}]}]}},{"number":"24","item_type":"reading","context_note":"Passage A","stem":"John and his mother go to the park _____.","options":{"A":"in the morning","B":"in the afternoon","C":"in the evening","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道关于时间信息的细节推断题。题目询问约翰和妈妈去公园的时间。文章中有两个关键信息点：\n1. 第二段妈妈提议说：“We can go there **in the afternoon**.”（我们下午可以去那儿。）\n2. 第三段描述他们出发时说：“**After lunch**, John and his mother go to the park...”（午饭后，约翰和妈妈去了公园。）\n“午饭后”通常指的就是下午时段。这两个信息相互印证，因此可以确定他们是在下午去的公园。","knowledge_expansion_md":"### 1. 表示时间的介词短语\n英语中表示一天中不同时间段的常用短语：\n- **in the morning** (在上午)\n- **in the afternoon** (在下午)\n- **in the evening** (在晚上)\n- **at noon** (在正午)\n- **at night** (在夜里)\n- **at midnight** (在午夜)\n注意 `in` 和 `at` 的搭配习惯。\n\n### 2. 通过逻辑推断获取信息\n阅读理解不仅考查直接信息的获取，也考查间接信息的推断能力。本题中，“After lunch”（午饭后）就是一个间接的时间线索。我们需要根据生活常识（午饭通常在中午吃）来推断出“午饭后”就是“下午”。这种联系上下文、结合常识进行推断的能力是阅读高分的关键。","socratic_tracks":[{"title":"时间线索定位","steps":[{"question":"题目问的是“什么时候”去的公园。我们应该在文中寻找哪些类型的词语？","hint":"找一找表示“上午”、“下午”、“晚上”或者与一日三餐相关的词。","takeaway":"解决时间问题，关键是定位文中的时间状语或与时间相关的描述。"},{"question":"文中提到了两个和去公园时间有关的线索，它们分别是什么？","hint":"一个在妈妈说的话里，一个在描述他们出发的动作的句子里。","takeaway":"第一个线索是妈妈的提议 “in the afternoon”，第二个线索是实际出发时间 “After lunch”。"}]},{"title":"逻辑推理","steps":[{"question":"“After lunch”（午饭后）通常是指一天中的哪个时间段？","hint":"我们一般在中午（noon）吃午饭（lunch）。","takeaway":"根据生活常识，“午饭后”就是指下午（afternoon）。"},{"question":"妈妈提议的时间和他们实际出发的时间是否一致？这说明了什么？","hint":"妈妈提议 `in the afternoon`，他们 `After lunch` 出发。这两个时间吻合吗？","takeaway":"两个时间线索相互印证，使答案更加确定无疑。"}]},{"title":"排除错误选项","steps":[{"question":"为什么选项 A “in the morning” 是错误的？文章开头明明提到了 “One morning...”。","hint":"“One morning” 描述的是什么事件发生的时间？是妈妈说话的时间，还是他们去公园的时间？","takeaway":"要仔细区分“讨论某事的时间”和“做某事的时间”，这是常见的陷阱。"},{"question":"选项 C “in the evening”（在晚上）为什么是错误的？","hint":"文章中有没有提到任何与“晚上”相关的信息？","takeaway":"文中完全没有提及晚上的活动，因此该选项是无中生有，可以直接排除。"}]}]}},{"number":"25","item_type":"reading","context_note":"Passage A","stem":"John can play _____ and he is very happy.","options":{"A":"in the river","B":"in the garden","C":"in the pool","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节定位题。题目询问约翰在哪里玩并且感到很开心。根据原文第二段 “John is very happy.” 和第三段 “...he plays in the pool.”，我们可以知道，当妈妈提议去公园的泳池时，约翰很开心，并且他后来确实在泳池里玩了。因此，正确答案是 C。","knowledge_expansion_md":"### 1. 细节信息整合\n本题的答案需要整合文章中不同部分的信息。首先，在第二段，当妈妈提到公园里的水池时，文章说 “John is very happy.”。然后，在第三段，文章描述了具体行为 “he plays in the pool.”。将这两处信息（开心的原因和实际的活动）结合起来，就能得出完整答案。\n\n### 2. 区分地点\n文章提到了多个地点：`garden` (花园), `river` (河), `park` (公园), `pool` (水池)。做题时要仔细辨别，题目问的是 John 最终在哪里玩耍并感到开心。他喜欢在河里玩，但新家附近没有河；房子附近有花园，但没说他在里面玩；他去了公园，具体是在公园里的水池里玩。因此 `in the pool` 是最准确的答案。","socratic_tracks":[{"title":"信息定位与整合","steps":[{"question":"题目问 John 在哪里玩并且很开心。我们先找找 John 在哪里玩了？","hint":"阅读文章的最后一段，看看描述 John 和妈妈去公园后发生了什么。","takeaway":"文章第三段明确写道：“...he plays in the pool.” (他在水池里玩。)"},{"question":"John 在水池里玩的时候开心吗？文章中有没有线索？","hint":"回顾一下当妈妈提议去公园的水池时，John 的反应是怎样的？","takeaway":"文章第二段说，当妈妈提到公园和水池时，“John is very happy.” 这表明他对去水池玩这件事感到非常开心。"},{"question":"综合这两条线索，哪个选项是正确的？","hint":"他因为可以去水池玩而开心，并且他确实在水池里玩了。","takeaway":"John 在水池里玩，并且他很开心。所以选项 C “in the pool” 是正确答案。"}]},{"title":"干扰项分析","steps":[{"question":"为什么选项 A “in the river” 是错误的？文章不是说他喜欢在河里玩吗？","hint":"他“喜欢”在河里玩，和他“能”在哪里玩是两回事。看看新家附近有没有河？","takeaway":"文章明确说了 “there isn't a river near his new house”，所以他不可能在新家附近的河里玩。"},{"question":"为什么选项 B “in the garden” 是错误的？","hint":"文章提到花园了吗？提到 John 在花园里玩了吗？","takeaway":"文章只说房子附近有一个花园，但没有提及 John 在花园里玩。这是一个无关信息干扰项。"}]}]}},{"number":"26","item_type":"reading","context_note":"Hello, everyone! I'm George. I'll tell you something about my last winter holiday. Last winter holiday, I went to my grandparents' home with my father. My father took me there on foot.\nIt was snowy on that day. There was snow everywhere. I made a snowman with my cousin John. First, we made a big snowball. It was the body. Next, we made a small snowball. It was the head. We put the small snowball on the big snowball. Then we made a face on the small snowball. We put two stones for his eyes and a carrot for his nose. We had a banana for his mouth and two potatoes for his ears. We had two sticks for his arms. At last, we put a hat on his head. He was very cool.\nIt was cold but I was very happy. We had a great time.","stem":"Last winter holiday, I went to visit my _____.","options":{"A":"father","B":"grandfather and grandmother","C":"teacher","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目询问“我”上个寒假去拜访了谁。根据文章第二段开头第一句：“Last winter holiday, I went to my grandparents' home with my father.”（上个寒假，我和爸爸一起去了我祖父母家。）可知，“我”去的是祖父母家。选项B“grandfather and grandmother”正是“grandparents”的完整表述。因此，正确答案是B。","knowledge_expansion_md":"### 1. 关键词定位法（Keyword Scanning）\n在阅读理解中，针对细节题，可以先从题干中找出关键词（如本题的 `visit`、`last winter holiday`），然后带着关键词回到原文中快速扫描，定位到包含这些词语或其同义表达的句子，答案往往就在这些句子的前后。\n\n### 2. 家庭成员词汇（Family Members）\n- `parents`: 父母 (father and mother)\n- `grandparents`: 祖父母 (grandfather and grandmother)\n- `siblings`: 兄弟姐妹 (brother and sister)\n- `cousin`: 堂/表兄弟姐妹\n- `aunt`: 姑/姨/婶/舅妈\n- `uncle`: 叔/伯/姑父/舅/姨夫\n掌握这些词汇的集合概念（如 `grandparents`）和具体构成（`grandfather and grandmother`）对于理解家庭关系至关重要。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"题干问的是什么信息？关键词是什么？","hint":"题干是 “Last winter holiday, I went to visit my _____.”，询问的是拜访的对象。","takeaway":"题目问的是“我”去拜访了谁。"},{"question":"带着“拜访谁”这个问题，在文章的开头部分找一找，有没有相关的描述？","hint":"故事的开头通常会交代人物、时间和地点等背景信息。","takeaway":"文章第二段开头就说“I went to my grandparents' home”，这就是答案的关键句。"}]},{"title":"家庭关系词汇","steps":[{"question":"文章中提到的 `grandparents` 是什么意思？","hint":"这个词由 `grand` 和 `parents` 组成。","takeaway":"`grandparents` 指的是祖父母或外祖父母。"},{"question":"选项 B `grandfather and grandmother` 和文章中的 `grandparents` 是什么关系？","hint":"想一想 `parents` 和 `father and mother` 的关系。","takeaway":"`grandfather and grandmother` 是对 `grandparents` 的具体解释，两者意思相同。"}]},{"title":"排除法应用","steps":[{"question":"文章提到 `father` 了吗？“我”是去拜访他吗？","hint":"仔细读第一句话：“I went to my grandparents' home with my father.”","takeaway":"“我”是和爸爸“一起”去的，而不是去“拜访”爸爸，所以A是错误的。"},{"question":"文章中有没有提到 `teacher`（老师）？","hint":"快速浏览全文，看是否存在 `teacher` 这个词。","takeaway":"文章通篇没有提到老师，所以C是无关选项，可以直接排除。"}]}]}},{"number":"27","item_type":"reading","context_note":"Passage B","stem":"I made a snowman with my _____.","options":{"A":"grandfather","B":"father","C":"cousin","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找题。题目问“我和谁一起堆了雪人？”。在文章第二段中，可以非常清晰地找到原句：“I made a snowman with my cousin John.”（我和我的堂兄约翰一起堆了一个雪人。）。句中的 `with my cousin John` 明确指出了和“我”一起堆雪人的人是 `cousin`（堂/表兄弟姐妹）。因此，正确答案是C。","knowledge_expansion_md":"### 1. 介词 `with` 的用法\n`with` 是一个非常常用的介词，在本题的语境中，它表示“和……一起”，引导出动作的同伴或共事者。\n- `I play with my dog.` (我和我的狗一起玩。)\n- `She went shopping with her mother.` (她和她妈妈一起去购物了。)\n\n### 2. 区分人物关系\n在阅读故事时，理清人物关系是理解文章的基础。本篇短文涉及的人物有：\n- `I` (George): 故事的叙述者。\n- `my father`: 带“我”去祖父母家的人。\n- `my grandparents`: “我”去拜访的人。\n- `my cousin John`: 和“我”一起堆雪人的人。\n做题时要分清每个人的角色和行为，避免张冠李戴。","socratic_tracks":[{"title":"定位关键信息句","steps":[{"question":"题干的核心动作是什么？","hint":"题干是 “I made a snowman with my _____.”，核心动作是 `made a snowman`（堆雪人）。","takeaway":"我们需要在文章中找到描述“堆雪人”的句子。"},{"question":"在文章中快速查找 `snowman` 这个词，它所在的句子说了什么？","hint":"这个词在第二段出现了好几次，找到第一次提到“做”雪人的那一句。","takeaway":"关键句是 “I made a snowman with my cousin John.”，直接给出了答案。"}]},{"title":"理解介词 `with`","steps":[{"question":"在 “I made a snowman with my cousin” 这句话里，`with` 是什么意思？","hint":"当你和朋友一起做某事时，你会用哪个词来连接你和你的朋友？","takeaway":"`with` 在这里表示“和……一起”，引出动作的同伴。"},{"question":"知道了 `with` 的意思，我们就能确定题目在问什么，对吗？","hint":"题目在问，和“我”一起堆雪人的人是谁？","takeaway":"理解了 `with` 的含义，就能准确地从原文中提取“同伴”这一信息。"}]},{"title":"分析人物角色","steps":[{"question":"这个故事里提到了哪些人物？","hint":"从头到尾读一遍，把表示人的词都找出来。","takeaway":"故事里有“我”(I)、爸爸(father)、祖父母(grandparents)和堂兄(cousin John)。"},{"question":"这些人中，谁参与了“堆雪人”这个活动？","hint":"文章描述堆雪人时，主语是 `I`，后面用 `with` 引出了另一个人。","takeaway":"文章只明确说明了“我”和“堂兄”一起堆雪人，没有提到其他人也参与了。"}]}]}},{"number":"28","item_type":"reading","context_note":"Passage B","stem":"We had two _____ for the arms.","options":{"A":"potatoes","B":"carrots","C":"sticks","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找题。题目询问雪人的胳膊是用什么做的。文章在描述堆雪人过程时，对雪人的各个部分都进行了说明。在第二段中可以找到原句：“We had two sticks for his arms.”（我们用两根树枝做他的胳膊。）。这句话直接说明了 `arms`（胳膊）是用 `sticks`（树枝）做的。因此，正确答案是C。","knowledge_expansion_md":"### 1. 介词 `for` 表示“用途”\n在本题语境中，介词 `for` 用来表示“为了……的目的”或“用作”。这是一种常见的用法，用来连接材料和其用途。\n- `We put two stones for his eyes.` (我们用两块石头做他的眼睛。)\n- `We had a banana for his mouth.` (我们用一根香蕉做他的嘴巴。)\n- `What did you use for the roof?` (你们用什么做的屋顶？)\n\n### 2. 描述性段落的阅读技巧\n当阅读描述事物或过程的段落时，可以采用“图像化”的阅读策略。一边读，一边在脑海中构建出雪人的形象：一个大雪球和一个小雪球是身体和头，石头是眼睛，胡萝卜是鼻子……这种方法能将枯燥的文字转化为生动的画面，有助于加深理解和记忆细节。","socratic_tracks":[{"title":"细节扫描与定位","steps":[{"question":"题干问的是雪人的哪个部位是用什么做的？","hint":"注意题干的最后一个词 `arms`。","takeaway":"题目问的是用来做“胳膊”(arms)的材料。"},{"question":"请在文章中找到 `arms` 这个词，并阅读它所在的完整句子。","hint":"文章是按照从整体到局部的顺序描述雪人的，胳膊在脸部之后被提到。","takeaway":"找到 “We had two sticks for his arms.” 这句话，就能直接得到答案是 `sticks`。"}]},{"title":"排除法验证答案","steps":[{"question":"我们来看看选项A `potatoes` (土豆)。文章说土豆是用来做什么的？","hint":"在文章中找到 `potatoes` 这个词。","takeaway":"文章说 “two potatoes for his ears”，土豆是用来做耳朵的，所以A是错的。"},{"question":"那选项B `carrots` (胡萝卜) 呢？它又是用来做什么的？","hint":"在文章中找到 `carrot` 这个词。","takeaway":"文章说 “a carrot for his nose”，胡萝卜是用来做鼻子的，所以B也是错的。"},{"question":"排除了A和B，剩下的C是不是就是正确答案？","hint":"将选项C `sticks` 带回原文验证一下。","takeaway":"通过排除法，我们可以确认C是正确答案，并且原文也直接支持了这个结论。"}]},{"title":"理解介词 `for` 的功能","steps":[{"question":"在 “two sticks for his arms” 这句话里，`for` 起到了什么作用？","hint":"它连接了“材料”(sticks)和“部位”(arms)，说明了材料的什么？","takeaway":"介词 `for` 在这里表示“用作”，说明了材料的“用途”。"},{"question":"你能在文章中找到其他用 `for` 表示“用途”的例子吗？","hint":"看看雪人脸上的其他部分是用什么做的。","takeaway":"文章中还有 `a carrot for his nose`、`two stones for his eyes` 等，都是用 `for` 来连接材料和其用途。"}]}]}},{"number":"29","item_type":"reading","context_note":"Passage B","stem":"The underlined word \"snowball\" means (意思是) \"_____\" in Chinese.","options":{"A":"雪人","B":"雪球","C":"雪花","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查词汇的字面意思。\"snowball\" 是一个复合词，由 \"snow\"（雪）和 \"ball\"（球）两个单词组成。将两个单词的意思直接组合，就是“雪做的球”，即“雪球”。选项 A “雪人”是 snowman，选项 C “雪花”是 snowflake。因此，根据构词法，最准确的中文意思是“雪球”。","knowledge_expansion_md":"### 复合词构词法\n英语中有很多类似`snowball`的复合名词，通过将两个或多个单词组合在一起构成一个新词，表达一个新的、独立的概念。学习和掌握常见的复合词构成规律，可以有效扩大词汇量。\n\n**常见构成方式：**\n1.  **名词 + 名词**：这是最常见的形式。例如：\n    *   `sun` + `flower` -> `sunflower` (向日葵)\n    *   `rain` + `bow` -> `rainbow` (彩虹)\n    *   `class` + `room` -> `classroom` (教室)\n2.  **形容词 + 名词**：例如：\n    *   `black` + `board` -> `blackboard` (黑板)\n    *   `green` + `house` -> `greenhouse` (温室)\n3.  **动名词 + 名词**：例如：\n    *   `swimming` + `pool` -> `swimming pool` (游泳池)\n\n### “Snowball”的比喻义\n在更高级的语境中，`snowball` 还可以作动词使用，意为“（问题、计划、支持等）越滚越大，迅速增长”，就像雪球在雪地里滚动会越滚越大一样。例如：\n*   `The problem started to snowball.` (问题开始变得越来越严重。)","socratic_tracks":[{"title":"复合词解析","steps":[{"question":"单词 \"snowball\" 看起来像是由哪两个我们学过的简单单词组成的？","hint":"试着把这个词从中间拆开看看。","takeaway":"\"snowball\" 是由 \"snow\"（雪）和 \"ball\"（球）两个词组成的。"},{"question":"既然我们知道了 \"snow\" 是“雪”，\"ball\" 是“球”，那么把它们合在一起，最直接的中文意思应该是什么？","hint":"想象一下用雪做成的球状物。","takeaway":"所以 \"snowball\" 的字面意思就是“雪球”。"}]},{"title":"选项辨析","steps":[{"question":"我们再看看其他选项。“雪人”的英文通常怎么说？","hint":"提示：是用雪堆成的一个“人”。","takeaway":"“雪人”的英文是 snowman。"},{"question":"那么天上飘落的、晶莹剔透的“雪花”又该怎么说呢？","hint":"它像一片片的东西，英文中“片”可以用 flake。","takeaway":"“雪花”的英文是 snowflake。"},{"question":"对比 snowball, snowman, snowflake，为什么只有“雪球”是正确答案？","hint":"回顾一下 snowball 是由哪两个词组成的。","takeaway":"因为只有“雪球”准确对应了 \"snow\" (雪) + \"ball\" (球) 的组合含义。"}]},{"title":"语境推断","steps":[{"question":"假设文章中描述孩子们在雪地里玩耍，他们把雪团成一团互相扔，这个被扔的东西最可能是什么？","hint":"我们冬天常玩的打雪仗游戏，扔的是什么？","takeaway":"在打雪仗的场景中，孩子们扔的正是“雪球”。"},{"question":"在这种场景下，他们会扔“雪人”或者“雪花”吗？为什么？","hint":"想一想雪人、雪花和雪球的大小、形状和用途。","takeaway":"雪人太大不能扔，雪花太小无法握在手里扔，所以根据常识和语境推断，答案也只能是“雪球”。"}]}]}},{"number":"30","item_type":"reading","context_note":"Passage B","stem":"It was a _____ day.","options":{"A":"cold","B":"nice","C":"A and B","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道综合理解题。题目询问这一天是怎样的一天。根据文章最后一段第一句 “It was cold but I was very happy.”（天气很冷，但我非常开心。）可知，当天的天气是寒冷的（cold），所以选项A是正确的。同时，根据 “I was very happy. We had a great time.”（我非常开心。我们玩得很尽兴。）可知，从“我”的主观感受来说，这也是美好的一天（a nice day），所以选项B也是正确的。选项C “A and B” 综合了客观天气和主观感受，是最全面、最准确的答案。因此，正确答案是C。","knowledge_expansion_md":"### 推理判断题解题技巧\n在阅读理解中，推理判断题要求我们根据文章中提供的线索和事实，进行逻辑推理，得出作者没有直接说明但隐含的结论。解题时要注意：\n1.  **忠于原文**：所有推理都必须基于文章内容，不能凭空想象或过度引申。\n2.  **抓住细节**：文中的关键词、描述性词语、人物的言行举止等都是推理的重要依据。例如本题的 \"snowball\" 就是关键线索。\n3.  **理解词语的多重含义**：很多词语（如本题的 `nice`）有多种意思，需要结合语境判断其确切含义。`nice` 在这里不仅可以指天气晴朗，更可以指“令人愉快的”一段经历。\n\n### 形容天气的词汇\n*   **描述温度**：`hot` (炎热的), `warm` (温暖的), `cool` (凉爽的), `cold` (寒冷的), `freezing` (极冷的)\n*   **描述天气状况**：`sunny` (晴朗的), `cloudy` (多云的), `rainy` (下雨的), `snowy` (下雪的), `windy` (有风的), `foggy` (有雾的)\n*   **描述综合感受**：`fine` (好的), `nice` (美好的), `lovely` (宜人的), `terrible` (糟糕的), `awful` (恶劣的)","socratic_tracks":[{"title":"客观天气推断","steps":[{"question":"文章有没有直接描述当天的天气？","hint":"读一读文章的最后一段。","takeaway":"文章直接说了 “It was cold”，所以天气是寒冷的，选项A正确。"}]},{"title":"主观感受理解","steps":[{"question":"文章有没有描述“我”当天的心情或感受？","hint":"同样在最后一段，找一找描述心情的词。","takeaway":"文章说 “I was very happy. We had a great time.”，这说明从“我”的感受来说，这是美好的一天 (a nice day)，所以选项B也正确。"},{"question":"“nice”这个词在这里是指天气很好（比如晴朗温暖）吗？还是指别的？","hint":"想一想“美好的一天”和“好天气”的区别。","takeaway":"在这里，\"nice\" 更侧重于描述主观的愉快感受，而不仅仅是客观的天气状况。"}]},{"title":"最佳选项选择","steps":[{"question":"既然我们分析出 A (cold) 和 B (nice) 都有道理，那么应该选哪一个呢？","hint":"看看选项里有没有一个能把 A 和 B 都包含进去的。","takeaway":"选项 C 是 \"A and B\"，它同时承认了天气寒冷和体验美好这两个方面。"},{"question":"为什么 C 是比 A 或 B 单独更好的答案？","hint":"一个好的答案应该最全面、最准确地反映文章所提供的信息。","takeaway":"选项 C 完整地概括了当天的客观事实（冷）和主观感受（美好），因此是最佳答案。"}]}]}},{"number":"31","item_type":"reading","context_note":"My school is very beautiful. There are more than 500 students. There is a big playground in my school. We have PE class and play sports on the playground. Our teaching building has five floors. My classroom is on the fifth floor. It's big and clean. The computer rooms are on the third floor. We can search information (查找信息) on the Internet now. There is a library on the second floor. There are many books in the library. I often read books there. There are some music rooms and art rooms in the teaching building, too.\nBut five years ago, my school was very small. There were only a few students in our school. There was no library or Internet at that time. There was no art room or music room, either. So we had music and art classes in the classroom. The playground was very small, too.\nI love my new school. Welcome to our school!\n\n阅读短文，判断正(T)误(F)。","stem":"( ) Our teaching building has fifteen floors.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题为细节判断题。题目陈述为“我们的教学楼有十五层。”（Our teaching building has fifteen floors.）。我们需要在原文中找到相关信息进行核对。根据原文第一段“Our teaching building has five floors.”（我们的教学楼有五层。），可知教学楼实际只有五层，而不是十五层。题目中的数字 `fifteen` (15) 与原文的 `five` (5) 不符，因此该陈述是错误的。","knowledge_expansion_md":"### 细节定位与核对\n这是阅读理解中最常见的题型之一，考察学生快速定位并准确理解具体信息的能力。\n\n**解题步骤：**\n1.  **审题，找关键词**：阅读题干，圈出核心名词、动词、数字、专有名词等。本题的关键词是 `teaching building`, `fifteen`, `floors`。\n2.  **寻读，定位原文**：带着关键词快速在文章中扫读（scanning），找到包含这些关键词或其同义词的句子。\n3.  **比对，做出判断**：仔细比较题干陈述与原文信息的细节，特别是数字、肯定/否定、程度、范围等。任何不一致都意味着陈述为“假”（False）。\n\n### 易混淆的数字\n在英语学习中，一些发音或拼写相似的数字是常见的考点和易错点，需要特别注意区分：\n*   **-teen vs. -ty**：`thirteen` (13) vs. `thirty` (30); `fourteen` (14) vs. `forty` (40); `fifteen` (15) vs. `fifty` (50), etc. `-teen` 结尾的重音在后，`-ty` 结尾的重音在前。\n*   **发音相似**：`five` (5) vs. `fifteen` (15)；`eight` (8) vs. `eighty` (80)。","socratic_tracks":[{"title":"信息定位","steps":[{"question":"这道题想让我们判断关于什么的陈述？关键词是什么？","hint":"题目中提到了一个建筑和它的层数。","takeaway":"题目是关于“教学楼”（teaching building）的“层数”（floors）。"},{"question":"请在原文中快速找到描述教学楼层数的那句话。","hint":"在文章第一段找一找含有 \"teaching building\" 和 \"floors\" 的句子。","takeaway":"原文的相关句子是：\"Our teaching building has five floors.\""}]},{"title":"细节比对","steps":[{"question":"原文说教学楼有几层？","hint":"看一下原文句子里的数字 \"five\" 是多少。","takeaway":"原文说教学楼有五（five）层。"},{"question":"题目说教学楼有几层？","hint":"看一下题目句子里的数字 \"fifteen\" 是多少。","takeaway":"题目说教学楼有十五（fifteen）层。"},{"question":"原文的“五层”和题目的“十五层”信息一致吗？","hint":"5 等于 15 吗？","takeaway":"信息完全不一致，所以这个陈述是错误的（False）。"}]},{"title":"易错点辨析","steps":[{"question":"你觉得为什么出题人会用 \"fifteen\" 来替换原文的 \"five\"？","hint":"从单词的拼写或读音上想一想。","takeaway":"因为 \"five\" 和 \"fifteen\" 的首字母和发音开头部分相似，容易对粗心的读者造成混淆。"},{"question":"除了 five/fifteen，你还能想到其他类似的、容易混淆的数字组合吗？","hint":"比如 thirteen 和 thirty。","takeaway":"是的，比如 thirteen(13) 和 thirty(30)，fourteen(14) 和 forty(40) 等，这些都是需要我们在听和读的时候特别留意的。"}]}]}},{"number":"32","item_type":"reading","context_note":"Passage C","stem":"( ) Students often have PE class and play sports on the playground.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节判断题。题目陈述为“学生们经常在操场上体育课和进行体育运动。”（Students often have PE class and play sports on the playground.）。我们在原文第一段可以找到几乎完全一样的句子：“We have PE class and play sports on the playground.”（我们在操场上体育课和进行体育运动。）。这里的 “We” 指的就是作者和他的同学们，即“学生们”（Students）。原文使用一般现在时描述常规活动，本身就含有“经常”的意味，与题目的 `often` 并不矛盾。因此，该陈述与原文信息一致，是正确的。","knowledge_expansion_md":"### 信息匹配与同义转述\n在阅读理解的判断题中，正确陈述（True）通常有两种形式：\n1.  **信息复现**：题干几乎是原文句子的直接复制，就像本题一样。这是最简单的形式。\n2.  **同义转述 (Paraphrasing)**：题干用不同的词汇或句式来表达与原文相同的意思。这是更常见的考查方式，要求学生具备一定的词汇量和句型转换能力。\n\n**同义转述的例子：**\n*   **代词替换**：原文用 `We`，题干用 `Students`。（如本题）\n*   **词汇替换**：原文用 `a lot of books`，题干可能用 `many books`。\n*   **句式转换**：原文 `There is a library on the second floor.`，题干可能转述为 `The library is on the second floor.`\n\n### 重点词汇\n*   **PE class**: `Physical Education` 的缩写，意为“体育课”。\n*   **play sports**: 动词词组，意为“做运动；进行体育活动”。注意 `sport` 在这里是复数形式，因为通常指各种体育项目。\n*   **playground**: 名词，意为“操场，运动场”，特指学校里供学生活动的场地。","socratic_tracks":[{"title":"寻找原文证据","steps":[{"question":"这道题的核心信息是什么？我们应该在文章中寻找哪些关键词？","hint":"关于什么人、在什么地方、做什么事？","takeaway":"关键词是“上体育课”(have PE class)、“做运动”(play sports) 和“操场”(playground)。"},{"question":"请在原文中找到包含这些关键词的句子。","hint":"仔细阅读第一段，寻找关于 playground 的描述。","takeaway":"原文中直接出现了这句话：\"We have PE class and play sports on the playground.\""},{"question":"比较一下原文的句子和题目的句子，它们表达的意思是否一致？","hint":"除了主语从 \"We\" 变成了 \"Students\"，其他部分几乎一样。","takeaway":"两个句子的核心信息完全一致，所以陈述是正确的（True）。"}]},{"title":"理解同义转述","steps":[{"question":"原文用的是主语 \"We\"（我们），而题目用的是 \"Students\"（学生们），为什么这样换了之后意思还是一样的？","hint":"想一想这篇文章是谁写的？文中的“我们”指的是谁？","takeaway":"这篇文章是以一个学生的口吻写的，所以文中的 \"We\" 指的就是学生们，\"Students\" 是对 \"We\" 的同义转述。"},{"question":"题目中多了一个词 \"often\"（经常），但原文没有。这会影响判断吗？为什么？","hint":"想一想原文用的是什么时态？一般现在时通常用来描述什么样的动作？","takeaway":"原文用了一般现在时 \"have PE class\"，这本身就表示一种常规的、重复发生的动作，隐含了“经常”的意思，所以加上 \"often\" 是对原文意思的合理加强，并不矛盾。"}]},{"title":"词汇学习","steps":[{"question":"你知道 \"PE class\" 是哪两个单词的缩写吗？","hint":"P 开头和 E 开头的两个词，与“身体”和“教育”有关。","takeaway":"PE 是 Physical Education 的缩写，直译是“身体教育”，也就是我们说的“体育课”。"},{"question":"“做运动”除了说 \"play sports\"，还可以怎么表达？","hint":"还有一个很常用的动词 do。","takeaway":"我们也可以说 \"do sports\" 或者 \"do exercise\" 来表示“做运动”。"}]}]}},{"number":"33","item_type":"reading","context_note":"Passage C","stem":"( ) My school was very small five years ago.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节判断题。根据原文第二段“But five years ago, my school was very small.”可知，五年前学校很小。题干“My school was very small five years ago.”（我的学校五年前很小）与原文信息完全一致。因此，该陈述是正确的。","knowledge_expansion_md":"### 1. 过去时态与时间状语\n- **`was`** 是 `be` 动词 `is` 的过去式，用于描述过去的状态。当主语是第三人称单数（如 it, he, she）或第一人称单数（I）时使用。\n- **`five years ago`** 是一个明确的过去时间状语，意为“五年以前”，句子通常需要使用一般过去时。\n\n### 2. 对比连词 `but`\n- `but` 是一个表示转折或对比的连词，意为“但是”。它常常连接两个意思相反或不同的句子。在本段中，`but` 将学校“现在”(`now`) 的“大而新”与“五年前”(`five years ago`) 的“小而旧”进行对比，帮助读者理解学校发生的变化。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"要判断这个句子是否正确，你首先应该在文章中寻找哪些关键词？","hint":"想想题目中表示时间和状态的词。","takeaway":"寻找题干中的核心词“small”和“five years ago”是快速定位信息的关键。"},{"question":"在文章中找到包含这些关键词的句子后，它是怎么说的？","hint":"阅读文章第二段的第一句话。","takeaway":"文章明确指出：“But five years ago, my school was very small.”"},{"question":"将文章信息与题目“My school was very small five years ago.”进行对比，它们的意思是否一致？","hint":"比较一下“was very small”和原文的描述。","takeaway":"题目陈述与原文信息完全吻合，因此是正确的。"}]},{"title":"一般过去时 be 动词","steps":[{"question":"题目中的动词 'was' 是什么时态？它表示什么时候发生的事情？","hint":"'was' 是 'is' 的过去形式。","takeaway":"'was' 是一般过去时，表示过去发生的事情或过去的状态。"},{"question":"我们什么时候用 'was'，什么时候用 'were'？","hint":"想一想主语的单复数形式。","takeaway":"当主语是第一人称单数（I）或第三人称单数（he, she, it）时用 'was'；其他复数人称（we, you, they）用 'were'。"}]},{"title":"上下文逻辑推理","steps":[{"question":"文章第一句话说 “My school is very beautiful. It is big and new now...”。这里的 'now' (现在) 和题目中的 'five years ago' (五年前) 有什么关系？","hint":"它们是两个不同的时间点。","takeaway":"文章通过对比“现在”和“过去”来描述学校的变化。"},{"question":"文章用了一个什么词来连接“现在”和“过去”的描述？这个词暗示了什么？","hint":"找到连接词 'but'。","takeaway":"连词 'but' (但是) 暗示了过去的情况与现在是相反的，既然现在是 'big'，那么过去很可能就是 'small'。"}]}]}},{"number":"34","item_type":"reading","context_note":"Passage C","stem":"( ) There is a library on the second floor. I often read books there.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节判断题。根据原文第一段“There is a library on the second floor. ... I often read books there.”可知，二楼有一个图书馆，并且作者经常在那里读书。题干“There is a library on the second floor. I often read books there.”（二楼有图书馆。我经常在那读书。）与原文信息完全一致。因此，该陈述是正确的。","knowledge_expansion_md":"### 1. `There be` 句型\n- `There is/are...` 是英语中表示“某地有某物”的经典句型。\n- `There is` 用于单数名词或不可数名词前，例如：`There is a library.`\n- `There are` 用于复数名词前，例如：`There are some books.`\n\n### 2. 介词 `on` 的用法\n- 表示“在……楼层”时，我们使用介词 `on`，而不是 `in` 或 `at`。例如：`on the second floor` (在二楼)，`on the ground floor` (在一楼)。\n\n### 3. 频度副词 `often`\n- `often` 意为“经常”，是频度副词，用来表示动作发生的频率。它通常放在行为动词之前（如 `I often go...`）或 be 动词之后。","socratic_tracks":[{"title":"细节信息核对","steps":[{"question":"题目包含几个信息点？分别是什么？","hint":"这个题目其实是两个句子组成的，可以拆开看。","takeaway":"题目包含两个信息：1. 二楼有图书馆。2. 我经常在那里读书。"},{"question":"我们先核对第一个信息点。关于图书馆的位置，文章是怎么说的？","hint":"在文章中找到 'library' 这个词。","takeaway":"文章说：“There is a library on the second floor.”，明确指出图书馆在二楼。"},{"question":"我们再核对第二个信息点。关于在图书馆做什么，文章是怎么说的？","hint":"紧接着上一句，文章描述了作者在图书馆的活动。","takeaway":"文章说：“I often read books there.”，明确指出作者经常去那里读书。"},{"question":"既然两个信息点都与原文完全一致，那么这个题目是正确还是错误？","hint":"如果所有细节都匹配，那么陈述就是正确的。","takeaway":"题目中的两个信息点都得到了原文的支持，因此该陈述是正确的。"}]},{"title":"There be 句型","steps":[{"question":"“There is a library” 这个句子结构是用来表达什么的？","hint":"想想它的中文意思“有一个图书馆”。","takeaway":"“There be” 句型用来表达“某地有某物/某人”的存在。"},{"question":"如果图书馆不止一个，而是“一些图书馆”，这句话应该怎么改？","hint":"注意名词的单复数和 be 动词的变化。","takeaway":"应该说 “There are some libraries.”，be 动词要用 are，名词要用复数。"}]},{"title":"地点状语与介词","steps":[{"question":"“on the second floor” 在句子中是什么成分？它告诉我们什么信息？","hint":"它描述了事情发生的地点。","takeaway":"“on the second floor” 是地点状语，告诉我们图书馆的位置。"},{"question":"为什么用介词 'on' 来表示楼层，而不是 'in' 或者 'at'？","hint":"这是英语中的固定搭配习惯。","takeaway":"在英语中，表示“在第几层楼”时，固定使用介词 'on'。"}]}]}},{"number":"35","item_type":"reading","context_note":"Passage C","stem":"( ) We had no music room or art room five years ago.","options":{"T":"True","F":"False"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为细节判断题。根据原文第二段“There was no art room or music room, either.”（也没有美术教室或音乐教室。）可知，五年前学校没有这些设施。题干“We had no music room or art room five years ago.”（五年前我们没有音乐教室或美术教室。）是对原文信息的同义转述，表意一致，因此该陈述是正确的。","knowledge_expansion_md":"### 1. 否定表达方式\n- **`had no + 名词`**：这是过去时态中表示“没有……”的一种方式，语气比较直接。例如：`We had no money.` (我们没有钱)。\n- **`didn't have any + 名词`**：这是另一种更常见的否定表达，意思与 `had no` 相近。例如：`We didn't have any music rooms.`\n\n### 2. `or` 与 `and` 在否定句中的区别\n- 在否定句中，连接两个或多个名词时，通常使用 `or`，表示“（两者）都不”。例如 `We had no music room or art room.` 意味着音乐教室和美术教室都没有。\n- 如果在否定句中使用 `and`，意思会变得不同且通常不符合逻辑。`I don't like apples and oranges.` 意思是我不喜欢“苹果和橘子”这个组合，但可能单独喜欢其中一个。\n\n### 3. 副词 `either`\n- `either` 用在否定句的句末，表示“也（不）”，相当于肯定句句末的 `too`。例如：`He doesn't like it. I don't like it, either.`","socratic_tracks":[{"title":"否定信息的定位与理解","steps":[{"question":"题目是关于五年前学校的情况，你应该在文章的哪个部分寻找答案？","hint":"找到描述“five years ago”或“at that time”的部分。","takeaway":"答案位于文章第二段，描述过去情况的部分。"},{"question":"文章中是如何描述五年前的音乐教室和美术教室的？","hint":"找到包含 'music room' 和 'art room' 的句子。","takeaway":"文章说：“There was no art room or music room, either.”"},{"question":"原文的“There was no...”和题目的“We had no...”意思一样吗？","hint":"“There was no room”表示“没有这个房间存在”。“We had no room”表示“我们没有这个房间”。在这里意思是一样的。","takeaway":"虽然句式不同，但“There was no...”和“We had no...”都表示“没有”，意思一致。因此题目陈述是正确的。"}]},{"title":"否定句中的 or","steps":[{"question":"在 “no music room or art room” 这个短语中，为什么用 'or' (或者) 而不是 'and' (和)？","hint":"想一想在否定句中，连接两个事物时通常用哪个词。","takeaway":"在否定句中，并列几个事物时，通常用 'or' 来表示全部否定。"},{"question":"如果我说 “I don't like dogs or cats”，这是什么意思？","hint":"我是两种动物都不喜欢，还是只不喜欢其中一种？","takeaway":"这句话的意思是“我既不喜欢狗，也不喜欢猫”。"}]},{"title":"上下文线索词 either","steps":[{"question":"在句子 “There was no art room or music room, either.” 的末尾，'either' 这个词有什么作用？","hint":"它表示“也”，但用在什么类型的句子中？","takeaway":"'either' 用在否定句句末，表示“也（不）”，起补充说明作用。"},{"question":"这个 'either' 是在补充说明什么？它和前文有什么联系？","hint":"看看 'either' 所在句子的前一句是什么。","takeaway":"前文说“There was no library or Internet at that time”，'either' 表示“同样也没有音乐教室或美术教室”，进一步说明了当时条件的简陋。"}]}]}}]},{"section_title":"V. 汉译英。(共5分)","section_instruction":"","items":[{"number":"36","item_type":"fill_blank","context_note":"","stem":"我妈妈和我。\nMy mother _____ me.","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"and","explanation_md":"本题考查连词的用法。中文“我妈妈和我”中的“和”字，在英语中通常用连词 `and` 来表示。`and` 用于连接两个或多个并列的词、短语或句子。这里需要一个词来连接 `My mother` 和 `me`，因此填 `and`。","knowledge_expansion_md":"### 1. 并列连词 `and`\n- `and` 是最基本的并列连词，意为“和；与；及”，用来连接语法上相同或相似的成分。\n- 连接名词：`bread and butter` (面包和黄油)\n- 连接代词：`you and me` (你和我)\n- 连接形容词：`big and new` (又大又新)\n\n### 2. 人称代词 `I` vs `me`\n- 这是一个常见的易错点。`I` 是主格，在句子中作主语；`me` 是宾格，在句子中作宾语。\n- **作主语**：`My mother and I like music.` (我和我妈妈喜欢音乐。)\n- **作宾语**：`He invited my mother and me.` (他邀请了我和我妈妈。)\n- 在题干这种非完整句子的短语中，习惯上使用宾格 `me`。\n\n### 3. 语言礼貌顺序 (Polite Order)\n- 在英语中，当提到自己和他人时，出于礼貌，通常将他人放在前面，将自己（I/me）放在后面。例如，说 `My mother and I` 或 `you and me`，而不是 `I and my mother` 或 `me and you`。","socratic_tracks":[{"title":"连词 and 的基本用法","steps":[{"question":"中文里说“苹果和香蕉”，中间的“和”字，在英语里对应哪个单词？","hint":"这是一个非常基础的连接词。","takeaway":"中文的“和”对应英语中的连词 'and'。"},{"question":"那么，要把“我妈妈”和“我”这两个部分连接起来，应该用什么词？","hint":"同样是表示“和”的关系。","takeaway":"应该使用 'and' 来连接 'My mother' 和 'me'。"}]},{"title":"人称代词主格与宾格","steps":[{"question":"为什么这里用 'me' 而不是 'I'？比如我们经常说 'My mother and I'。","hint":"想一想 'I' 和 'me' 在句子中充当的不同角色。","takeaway":"'I' 是主格，作主语；'me' 是宾格，作宾语。"},{"question":"请用 'My mother and I' 造一个句子。","hint":"让“我们”去做一件事。","takeaway":"例如：'My mother and I go shopping.' (我和妈妈去购物)。这里 'My mother and I' 是句子的主语。"},{"question":"请用 'my mother and me' 造一个句子。","hint":"让别人对“我们”做一件事。","takeaway":"例如：'Dad bought a gift for my mother and me.' (爸爸为我和妈妈买了礼物)。这里 'my mother and me' 是介词 'for' 的宾语。"},{"question":"对于题干“My mother ___ me”这种单独的短语，为什么用 'me' 更常见？","hint":"这种短语通常被看作一个整体，类似于一个宾语性质的标签。","takeaway":"在独立的标题或短语中，当没有充当主语时，习惯上使用宾格 'me'。"}]},{"title":"英语的礼貌顺序","steps":[{"question":"在列举包含自己的多个人时，是先说自己还是先说别人？比如“我和你”，英语应该怎么说？","hint":"考虑一下礼貌问题。","takeaway":"英语中习惯先说别人，后说自己，所以是 'you and me'。"},{"question":"所以，题干的顺序 'My mother and me' 是否符合这个习惯？","hint":"对比一下 'Me and my mother'。","takeaway":"是的，'My mother and me' 将他人（妈妈）放在前面，是符合英语礼貌习惯的表达方式。"}]}]}},{"number":"37","item_type":"fill_blank","context_note":"","stem":"今天是星期天，我们将去看电影。\nIt's Sunday today. We will _____ _____ a film.","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"go|see","explanation_md":"本题考查表达“去看电影”的常用短语。中文“去看电影”包含“去”和“看”两个连续的动作。在英语中，除了常见的 `go to see a film`，还有一种更简洁的口语化表达 `go see a film`。这里的 `go` 后面直接跟动词原形 `see`，表示去做某事。由于题干提供了两个空格，`go see` 是最符合题目要求的答案。句子中的 `will` 提示我们使用动词原形。","knowledge_expansion_md":"### 语法点：`go + 动词原形`\n\n1.  **结构**：在非正式的英语，特别是美式英语中，动词 `go` 和 `come` 后面可以直接跟另一个动词原形，用来表示目的或连续的动作。这种用法省略了两者之间的 `and` 或 `to`。\n    *   `go get the newspaper.` (去拿报纸。) = `go and get...`\n    *   `Come meet my family.` (来见见我的家人。) = `Come and meet...`\n\n2.  **与 `go to do` 和 `go doing` 的区别**：\n    *   `go to do sth.`：标准的表示目的的不定式结构，更正式。例如：`We will go to see a film.`\n    *   `go doing`：通常用于表达特定的休闲活动或运动。例如：`go swimming` (去游泳), `go shopping` (去购物)。\n\n3.  **表达“看电影”**：\n    *   `see a film/movie`: 强调“看”这个动作的结果。\n    *   `watch a film/movie`: 强调“观看”的过程，通常指在电视或设备上看。\n    *   `go to the cinema / go to the movies`: 强调“去电影院”这个行为。","socratic_tracks":[{"title":"动词不定式：go see 结构","steps":[{"question":"“去看电影”这个动作包含几个部分？","hint":"想想看，你是先“去”还是先“看”？","takeaway":"这个短语包含“去”和“看”两个连续的动作。"},{"question":"在英语中，我们学过表示目的的不定式，比如 `go to see a film`。但这里只有两个空，你还知道有什么其他结构可以连接 `go` 和 `see` 吗？","hint":"想想我们口语中会不会说 `go and see` 或者省略掉 `and`？","takeaway":"英语中 `go` 后面可以直接跟另一个动词原形，表示去做某事，这是一种常见的用法。"}]},{"title":"表达“看电影”的多种方式","steps":[{"question":"中文的“看电影”在英语里只有一种说法吗？你能想到哪些？","hint":"比如，你是在家里看还是去电影院看？动词用 `see` 还是 `watch`？","takeaway":"我们可以用 `see a film`, `watch a film`, `go to the cinema`, `go to the movies` 等多种方式表达。"},{"question":"这个句子里已经有了 `a film`，所以我们应该填一个什么样的动词短语？","hint":"题干中文是“去看电影”，强调了“去”这个动作。","takeaway":"因为中文有“去”的含义，所以我们需要填入一个包含“去”这个动作的短语，如 `go see`。"}]},{"title":"将来时态 `will` 的用法","steps":[{"question":"句子中的 `will` 告诉我们这件事发生在什么时候？","hint":"`will` 是哪个时态的标志？","takeaway":"`will` 表示这是一个发生在将来的动作，所以是将来时。"},{"question":"在 `will` 后面，动词应该用什么形式？","hint":"想想情态动词 (can, must, will) 后面的动词规则。","takeaway":"情态动词 `will` 后面必须跟动词原形。"}]}]}},{"number":"38","item_type":"fill_blank","context_note":"","stem":"老师叫我们星期一上课前上交一个面包和一些香肠作为晚餐。\nWe _____ some bread and _____ dinner last Monday.","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"brought|had","explanation_md":"这道题的中文和英文句子存在一些差异，需要我们结合语境进行推理。时间状语 `last Monday` 表明整个句子应使用一般过去时。中文“老师叫我们...上交...”提供了一个故事背景：学生们被要求为晚餐带食物。因此，第一个动作可以理解为“带了”面包，`bring` 的过去式 `brought` 符合此意。第二个空格在 `dinner` 前面，`have dinner` (吃晚餐) 是固定搭配，其过去式为 `had dinner`。所以，`We brought some bread and had dinner last Monday.` (我们上周一带了些面包并且吃了晚餐) 是一个符合逻辑且语法正确的句子。","knowledge_expansion_md":"### 语法点：一般过去时与不规则动词\n\n1.  **一般过去时**：用于描述在过去特定时间发生并完成的动作。时间状语（如 `yesterday`, `last week`, `in 1999`）是使用一般过去时的重要标志。\n\n2.  **不规则动词变化**：英语中有许多动词的过去式和过去分词是不规则的，需要特别记忆。本题涉及：\n    *   `bring` (带来) -> `brought` -> `brought`\n    *   `have` (有；吃) -> `had` -> `had`\n    *   其他常见不规则动词：`buy` -> `bought`, `go` -> `went`, `eat` -> `ate`, `make` -> `made`。\n\n3.  **并列谓语**：一个主语可以跟两个或多个由 `and`, `but`, `or` 等连词连接的并列谓语动词，表示主语连续进行多个动作。例如本句中，主语 `We` 发出了 `brought` 和 `had` 两个动作，时态需保持一致。","socratic_tracks":[{"title":"确定时态","steps":[{"question":"句子里哪个词告诉我们动作发生的时间？","hint":"找一找表示过去时间的词语。","takeaway":"`last Monday` (上周一) 表明这是过去发生的事情，所以要用一般过去时。"},{"question":"动词 `bring` (带来) 和 `have` (吃/度过) 的过去式分别是什么？","hint":"这两个都是不规则动词，需要专门记忆。","takeaway":"`bring` 的过去式是 `brought`，`have` 的过去式是 `had`。"}]},{"title":"理解句子结构","steps":[{"question":"这个句子是谁做了什么事？主语是谁？","hint":"句子的开头通常是主语。","takeaway":"句子的主语是 `We` (我们)。"},{"question":"`We` 在上周一做了几件事？它们之间用什么词连接的？","hint":"看看 `and` 这个词，它是不是连接了两个动作？","takeaway":"`We` 做了两件事，用 `and` 连接：`_____ some bread` 和 `_____ dinner`。"}]},{"title":"动词搭配与语境推理","steps":[{"question":"对于“晚餐(dinner)”，我们通常用什么动词来搭配？","hint":"想想“吃晚饭”用英语怎么说？","takeaway":"我们常说 `have dinner`, `eat dinner`, `cook dinner` 或 `make dinner`。"},{"question":"结合中文提示“老师叫我们上交...”，第一个动作应该是关于“面包(bread)”的什么操作？","hint":"“上交”意味着你需要先把它“带来”或者“买来”。","takeaway":"填入 `brought` (带来) 最符合中文语境，表示我们带了面包去学校。"}]}]}},{"number":"39","item_type":"fill_blank","context_note":"","stem":"——你在假期读了很多书吗？ ——我读了两本。\n—_____ you _____ many books did you read in summer vacation?\n—I read two books.","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"Did|read","explanation_md":"这道题的英文题干可能存在印刷错误，显得有些重复和混乱。但我们可以通过分析对话的意图来找到最合理的答案。首先，中文提问“你在假期读了很多书吗？”是一个典型的“是/非”问题，即一般疑问句。其英文结构应为 `Did you read many books...?`。题干中的两个空格 `_____ you _____ many books` 恰好可以填入 `Did` 和 `read` 来构成这个问句的开头。虽然题干后半部分 `did you read in summer vacation?` 造成了重复，但填入 `Did` 和 `read` 是唯一能使前半部分构成一个语法正确问句的方式。对方的回答 `I read two books.` (我读了两本) 可以视为对“你读了很多书吗？”这个问题的具体化回答，说明了自己读书的数量。","knowledge_expansion_md":"### 语法点：一般疑问句与特殊疑问句\n\n1.  **一般疑问句 (Yes/No Questions)**: 用于提问“是”或“不是”，回答通常以 `Yes` 或 `No` 开始。对于过去发生的动作，其基本结构是 `Did + 主语 + 动词原形...?`。\n    *   例：`Did you read many books?` (你读了很多书吗？)\n\n2.  **特殊疑问句 (Wh- Questions)**: 以 `what`, `who`, `how` 等疑问词开头，用于询问具体信息。回答不能用 `Yes` 或 `No`。\n    *   例：`How many books did you read?` (你读了几本书？) -> `I read two books.`\n\n3.  **动词 `read` 的时态发音**: `read` 这个词的过去式和过去分词虽然拼写与原形相同，但发音不同。动词原形读作 /riːd/，而过去式和过去分词读作 /red/（同单词“红色”的发音）。在回答 `I read two books` 中，`read` 是过去式，应读作 /red/。","socratic_tracks":[{"title":"识别问句类型","steps":[{"question":"看到中文“...吗？”，你认为这是一个问“是或不是”的句子，还是问具体信息的句子？","hint":"“你吃饭了吗？” 我们会回答“吃了”或“没吃”。","takeaway":"这是一个“是/不是”问题，在英语中被称为一般疑问句 (Yes/No question)。"},{"question":"对于发生在过去的一般疑问句，我们应该用哪个词来开头？","hint":"想想“你昨天看电视了吗？”用英语怎么说。","takeaway":"我们应该用助动词 `Did` 开头，后面跟主语和动词原形。"}]},{"title":"动词 `read` 的用法","steps":[{"question":"在问句 `Did you _____ many books?` 中，`read` 应该用什么形式？为什么？","hint":"助动词 `Did` 后面跟动词的什么形式？","takeaway":"因为前面已经有了助动词 `Did` 表示过去时，所以后面的动词需要用原形 `read`。"},{"question":"在回答 `I read two books` 中，`read` 是什么时态？发音和原形一样吗？","hint":"这个回答是针对过去发生的事情。`read` 的过去式拼写不变，但发音会变。","takeaway":"这里的 `read` 是过去式，发音是 /red/，而动词原形的发音是 /riːd/。"}]},{"title":"分析对话逻辑","steps":[{"question":"提问是“你读了很多书吗？”，回答是“我读了两本”。这个回答直接吗？","hint":"如果是直接回答，应该先说 Yes 或 No。","takeaway":"这不是一个直接的 Yes/No 回答，但它提供了具体信息来回应问题。"},{"question":"为什么有人会这样回答？这在交流中意味着什么？","hint":"想想看，如果“很多”的标准是十本，那两本算多吗？","takeaway":"这种回答方式很自然，它通过给出具体数量，让对方自己判断“多”或“不多”，是一种更详细的沟通方式。"}]}]}},{"number":"40","item_type":"fill_blank","context_note":"","stem":"——你怎么了？ ——我发烧了。\n—What's the matter with you?\n—I have a _____.","options":{},"answer_area_hint":"横线","teaching":{"correct_answer":"fever","explanation_md":"这是一段询问和回答身体状况的日常对话。问句 \"What's the matter with you?\" 是英语中询问“你怎么了？”或“你有什么不舒服？”的常用句型。中文回答“我发烧了”对应的标准英文表达是 \"I have a fever\"。因此，在 \"I have a _____\" 的横线上，应填入名词 \"fever\"，意为“发烧”。这是一个基础的词汇和句型应用题。","knowledge_expansion_md":"### 知识拓展：谈论健康问题\n\n1.  **询问身体状况的句型**:\n    *   `What's the matter (with you)?` (你怎么了？)\n    *   `What's wrong (with you)?` (你哪里不舒服？)\n    *   `Are you all right? / Are you OK?` (你还好吗？)\n    *   `How are you feeling?` (你感觉怎么样？)\n\n2.  **表达常见病痛的句型**: 通常使用 `I have a + (病症)` 或 `I have + (症状)` 的结构。\n    *   `I have a fever.` (我发烧了。)\n    *   `I have a cold.` (我感冒了。)\n    *   `I have a cough.` (我咳嗽。)\n    *   `I have a headache.` (我头痛。)\n    *   `I have a toothache.` (我牙痛。)\n    *   `I have a stomachache.` (我胃痛。)\n    *   `I have a sore throat.` (我喉咙痛。)\n\n3.  **冠词的使用**: 注意在表达这些病症时，它们通常被当作可数名词，因此前面需要加不定冠词 `a` 或 `an` (如 `an earache` 耳朵痛)。","socratic_tracks":[{"title":"词汇：常见病症","steps":[{"question":"中文“发烧”翻译成英文是什么单词？","hint":"这个词以字母 'f' 开头，和 'cold' (感冒), 'cough' (咳嗽) 一样是常见的病症词汇。","takeaway":"“发烧”的英文是 `fever`。"},{"question":"当我们说“我发烧了”，在 `fever` 这个词前面需要加什么吗？","hint":"想想我们说“我感冒了”是 `I have cold` 还是 `I have a cold`？","takeaway":"`fever` 在这里作为可数名词使用，表示一种病症，所以前面要加不定冠词 `a`，构成 `have a fever`。"}]},{"title":"句型：询问与回答健康问题","steps":[{"question":"当你想关心别人，问“你怎么了？”时，除了 `What's the matter with you?` 还可以怎么说？","hint":"试试用 `wrong` 这个词来提问。","takeaway":"我们可以说 `What's wrong with you?` 或者更简单地问 `Are you OK?`。"},{"question":"当你回答这类问题，描述自己生病时，最常用的动词是什么？","hint":"句子里已经给出了提示：`I _____ a fever.`","takeaway":"描述拥有某种病症时，我们最常用动词 `have` (或 `has`)。"}]},{"title":"冠词 `a/an` 的使用","steps":[{"question":"为什么在 `fever`, `cold`, `headache` 前面要用 `a`？","hint":"这些病症是被当作一件一件可以数的“事情”还是不可数的“物质”？","takeaway":"在表达得了某种病时，英语习惯将这些病症当作可数名词。"},{"question":"那什么时候用 `an` 呢？你能举一个病症的例子吗？","hint":"`an` 用在以元音音素开头的单词前。想想“耳朵痛”。","takeaway":"当病症单词以元音音素开头时，我们用 `an`，例如 `I have an earache.` (我耳朵痛)。"}]}]}}]}],"content_markdown":"## 成都某外国语学校初2025级新初一分班真卷英语\n\n**满分60分 时间：30分钟**\n\n### I. 语音选择题。(共5分)\n\n选择画线部分读音不同的选项。\n\n1. ( )\nA. t\u003cu>a\u003c/u>xi\nB. h\u003cu>a\u003c/u>ppy\nC. gr\u003cu>a\u003c/u>ss\n\n2. ( )\nA. p\u003cu>u\u003c/u>zzle\nB. p\u003cu>u\u003c/u>pil\nC. st\u003cu>u\u003c/u>dy\n\n3. ( )\nA. l\u003cu>e\u003c/u>sson\nB. l\u003cu>a\u003c/u>te\nC. l\u003cu>e\u003c/u>ft\n\n4. ( )\nA. id\u003cu>ea\u003c/u>\nB. t\u003cu>ea\u003c/u>cher\nC. r\u003cu>ea\u003c/u>ding\n\n5. ( )\nA. angr\u003cu>y\u003c/u>\nB. ferr\u003cu>y\u003c/u>\nC. b\u003cu>y\u003c/u>\n\n### II. 词汇选择题。(共5分)\n\n读单词，选出每组中单词不同类的一项。\n\n6. ( )\nA. bicycle\nB. postcard\nC. letter\nD. often\n\n7. ( )\nA. America\nB. China\nC. Canada\nD. French\n\n8. ( )\nA. week\nB. month\nC. day\nD. year\n\n9. ( )\nA. looks\nB. rulers\nC. says\nD. comes\n\n10. ( )\nA. seat\nB. clean\nC. look\nD. sit\n\n### III. 完形填空。(共10分)\n\nDear Daniel,\nI'm in London now. It's the (11)_____ of England. I love everything here except the food. I don't know how people in London stand (忍受) the (12)_____ here. I often think of Chinese food and I never (13)_____ missing you. Is your school life good? I'll (14)_____ you when I go to China next time.\nYou (15)_____ me about the traffic in London in your email. Taxis in London are really expensive. (16)_____ if you come to London, you should have enough (17)_____ with you. Taxi drivers are usually (18)_____. They are always ready to help you. And they must take exams (19)_____ they become taxi drivers. London also has a complicated (复杂的) underground system. It's (20)_____ to go the wrong way if you are not careful.\nBest wishes,\nYours,\nMillie\n\n11. ( )\nA. country\nB. city\nC. capital\n\n12. ( )\nA. weather\nB. traffic\nC. food\n\n13. ( )\nA. stop\nB. remember\nC. start\n\n14. ( )\nA. know\nB. teach\nC. visit\n\n15. ( )\nA. asked\nB. told\nC. talked\n\n16. ( )\nA. Because\nB. So\nC. But\n\n17. ( )\nA. time\nB. energy\nC. money\n\n18. ( )\nA. friendly\nB. clever\nC. angry\n\n19. ( )\nA. After\nB. Before\nC. until\n\n20. ( )\nA. important\nB. funny\nC. easy\n\n### IV. 阅读理解。(共15分)\n\n**A**\n\nJohn lives in a new house. There is a small garden near his house. He likes playing in the river. But there isn't a river near his new house. He is not happy.\nOne morning, his mother says, \"There is a beautiful park near here, and there is a pool in it. We can go there in the afternoon.\" John is very happy.\nAfter lunch, John and his mother go to the park, and he plays in the pool. His mother is watching him under a tree.\n\n21. John lives in the new house _____.\nA. in the park\nB. near a river\nC. near a garden\n\n22. John likes playing _____.\nA. in his new house\nB. in the river\nC. in the garden\n\n23. There isn't _____ near his new house.\nA. a river\nB. a park\nC. a garden\n\n24. John and his mother go to the park _____.\nA. in the morning\nB. in the afternoon\nC. in the evening\n\n25. John can play _____ and he is very happy.\nA. in the river\nB. in the garden\nC. in the pool\n\n**B**\n\nHello, everyone! I'm George. I'll tell you something about my last winter holiday. Last winter holiday, I went to my grandparents' home with my father. My father took me there on foot.\nIt was snowy on that day. There was snow everywhere. I made a snowman with my cousin John. First, we made a big snowball. It was the body. Next, we made a small snowball. It was the head. We put the small snowball on the big snowball. Then we made a face on the small snowball. We put two stones for his eyes and a carrot for his nose. We had a banana for his mouth and two potatoes for his ears. We had two sticks for his arms. At last, we put a hat on his head. He was very cool.\nIt was cold but I was very happy. We had a great time.\n\n26. Last winter holiday, I went to visit my _____.\nA. father\nB. grandfather and grandmother\nC. teacher\n\n27. I made a snowman with my _____.\nA. grandfather\nB. father\nC. cousin\n\n28. We had two _____ for the arms.\nA. potatoes\nB. carrots\nC. sticks\n\n29. The underlined word \"snowball\" means (意思是) \"_____\" in Chinese.\nA. 雪人\nB. 雪球\nC. 雪花\n\n30. It was a _____ day.\nA. cold\nB. nice\nC. A and B\n\n**C**\n\nMy school is very beautiful. There are more than 500 students. There is a big playground in my school. We have PE class and play sports on the playground. Our teaching building has five floors. My classroom is on the fifth floor. It's big and clean. The computer rooms are on the third floor. We can search information (查找信息) on the Internet now. There is a library on the second floor. There are many books in the library. I often read books there. There are some music rooms and art rooms in the teaching building, too.\nBut five years ago, my school was very small. There were only a few students in our school. There was no library or Internet at that time. There was no art room or music room, either. So we had music and art classes in the classroom. The playground was very small, too.\nI love my new school. Welcome to our school!\n\n阅读短文，判断正(T)误(F)。\n\n31. ( ) Our teaching building has fifteen floors.\n\n32. ( ) Students often have PE class and play sports on the playground.\n\n33. ( ) My school was very small five years ago.\n\n34. ( ) There is a library on the second floor. I often read books there.\n\n35. ( ) We had no music room or art room five years ago.\n\n### V. 汉译英。(共5分)\n\n36. 我妈妈和我。\nMy mother _____ me.\n\n37. 今天是星期天，我们将去看电影。\nIt's Sunday today. We will _____ _____ a film.\n\n38. 老师叫我们星期一上课前上交一个面包和一些香肠作为晚餐。\nWe _____ some bread and _____ dinner last Monday.\n\n39. ——你在假期读了很多书吗？ ——我读了两本。\n—_____ you _____ many books did you read in summer vacation?\n—I read two books.\n\n40. ——你怎么了？ ——我发烧了。\n—What's the matter with you?\n—I have a _____.\n","proofread_notes":[{"type":"内容与标题调整","description":"Section III 的原始大标题为“看图补全对话+视频填词+完形填空”，但内容仅为一篇完形填空。已将大标题修正为“III. 完形填空。(共10分)”。原标题中提及的“看图补全对话”缺失，“视频填词”部分卷面仅有二维码，无对应题目。"},{"type":"数据结构规范","description":"为保证 schema 统一，所有选择题（含判断题）的选项均补充至 A, B, C, D 四个键，不足四项以空字符串填充。"},{"type":"格式统一","description":"Section I 语音题中，原用于标记发音部分的下划线格式不一，已统一使用 `\u003cu>...\u003c/u>` 标签进行标记。"},{"type":"内容勘误说明","description":"Section II 第8题，所有选项均为时间单位名词，题目可能存在设计缺陷。Section V 第38题，中文提示与英文句意不匹配。Section V 第39题，英文问句存在明显语法错误。以上内容均按卷面原样保留，未作修改。"},{"type":"非关联信息处理","description":"卷面整体存在水印、页码等非试题内容，已忽略。"}],"set_number":23,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_23\\page_040.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_23\\page_041.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","it   <script>
  const EXAM = JSON.parse(document.getElementById("exam-embed").textContent);

  const INLINE_CFG = {
    deepseekKey: "sk-daa16008e81843deba6fefe9dce51465",

    azureRegion: "southeastasia",
  };

  let modalWordForTts = "";

  function hasDeepseekKey() {
    const k = String(INLINE_CFG.deepseekKey || "").trim();

  async function deepseekChat(userContent, maxTokens) {

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",
    "choice",
    "cloze",
    "reading",
    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  /** 选项文案：含 <u> 时按语音题规则渲染下划线，否则转义 */
  function quizOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s);
    return esc(s).replace(/\n/g, "<br>");
  }

  /** PDF/卷面选项：同上，单行空格分隔 */
  function examOptionBodyHtml(tx) {
    const s = String(tx || "").trim();
    if (!s) return "";
    if (/<\s*u\s*>/i.test(s)) return stemHtmlWithAllowedUnderline(s).replace(/\n/g, " ");
    return esc(s).replace(/\n/g, " ");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    const reNumDotBlank = /\d+\.\s*_{3,}/g;
    const reNumDotLetterUnd = /\d+\.\s+[A-Za-z]?_{3,}/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotBlank.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotLetterUnd.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^[a-zA-Z]?__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\.\s*_{3,}/.exec(fragment),
      /^(\d+)\.\s+[A-Za-z]?_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);

    return formatPassageHtmlParagraphs(html);

    parts.forEach((chunk, i) => {
