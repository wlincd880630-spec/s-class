    const idx = ins.indexOf(READING_SENTENCE_BANK_PASSAGE_MARKER);
    if (idx < 0) return ins;
    return ins.slice(0, idx).trim();
  }

  function readingSentenceBankPassageFromInstruction(ins) {
    const s = String(ins || "");
    const idx = s.indexOf(READING_SENTENCE_BANK_PASSAGE_MARKER);
    if (idx < 0) return "";
    return s.slice(idx + READING_SENTENCE_BANK_PASSAGE_MARKER.length).trim();
  }

  function buildReadingSentenceBankPassageFromStems(rows) {
    const sorted = rows.slice().sort((a, b) => {
      const na = parseInt(String(a.it.number || "0"), 10) || 0;
      const nb = parseInt(String(b.it.number || "0"), 10) || 0;
      return na - nb;
    });
    const parts = [];
    sorted.forEach((r) => {
      const n = String(r.it.number || "").trim();
      let s = String(r.it.stem || "").trim();
      if (!s) return;
      if (/\n\s*_{3,}\s*\./.test(s)) {
        parts.push(s.replace(/\n\s*_{3,}\s*\./g, " " + n + ". _____"));
      } else {
        s = s.replace(/\s*_{3,}\s*$/g, "").trim();
        parts.push(s + " " + n + ". _____");
      }
    });
    return parts.join("\n\n");
  }

  function readingSentenceBankPassageBody(rows) {
    const ins = String(rows[0].section_instruction || "");
    let p = readingSentenceBankPassageFromInstruction(ins);
    if (!p) p = buildReadingSentenceBankPassageFromStems(rows);
    return p;
  }

  function buildReadingSentenceBankQuizHtml(rows, tag) {
    const st = String(rows[0].section_title || "").trim() || "阅读理解";
    const passage = readingSentenceBankPassageBody(rows);
    let h =
      "<div class='reading-sentence-bank-unit'>" +
      "<div class='cloze-passage-card card reading-sentence-bank-passage-card'><h2>" +
      esc(st) +
      "</h2>" +
      "<div class='reading-passage-text cloze-inline-passage-wrap'>" +
      htmlClozeInstructionWithInlineBlanks(passage, rows) +
      "</div></div>" +
      "<div class='reading-sentence-bank-options-below'>";
    rows.forEach((row) => {
      const it = row.it;
      const qkey = row.key;
      const num = String(it.number);
      const layout = getObjectiveChoiceLayout(row, it);
      const letters = layout.letters;
      const opts = layout.opts;
      h +=
        "<div class='card q-block reading-sentence-bank-opt-block' data-qkey='" +
        esc(qkey) +
        "'><div class='q'>" +
        "<div class='reading-sentence-bank-qhead'>" +
        esc(num) +
        ".</div>";
      if (letters.length) {
        h +=
          "<div class='" +
          quizOptsGridClass(letters, opts) +
          " reading-sentence-bank-opts-grid'>" +
          htmlQuizRadioOptions(letters, opts, qkey) +
          "</div>";
      } else {
        h += renderOpenAnswerStem(it.stem, qkey, row.type, "reading");
      }
      h += "</div></div>";
    });
    h += "</div></div>";
    return h;
  }

  function buildExamPaperSentenceBankHtml(rows) {
    const passage = readingSentenceBankPassageBody(rows);
    let out =
      "<div class='exam-reading-sentence-bank'><div class='exam-passage-titled-wrap'><div class='exam-passage-block'>";
    out += buildClozeInlinePassagePdfHtml(passage, rows);
    out += "</div></div><div class='exam-reading-sentence-bank-questions'>";
    rows.forEach((row) => {
      const it = row.it;
      const num = String(it.number);
      const layout = getObjectiveChoiceLayout(row, it);
      const letters = layout.letters;
      const opts = layout.opts;
      out += "<div class='exam-item exam-item-reading exam-reading-sentence-bank-item'>";
      out += "<div class='exam-reading-sentence-bank-qnum'>" + esc(num) + ".</div>";
      if (letters.length) {
        out += buildExamPaperOptionsHtmlWithLayout(letters, opts);
      } else {
        out +=
          "<div class='exam-item-row'>" + buildExamPaperStemPlain(it.stem || "_____") + "</div>";
      }
      out += "</div>";
    });
    out += "</div></div>";
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：若 JSON 无 section_instruction 正文则整段隐藏 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => {
      if (!isClozeDialogueCompletionSection(r)) return true;
      const ins = String(r.section_instruction || "").trim();
      return ins.length > 0 && sectionInstructionHasClozeInlineBlanks(ins);
    });
  }

  /** 阅读填表：题干为表格填空，材料在大题 section_instruction */
  function isReadingTableFillSection(row) {
    return /阅读填表/.test(String((row && row.section_title) || ""));
  }

  function sectionCardQuestionCount(rows) {
    if (!rows || !rows.length) return 0;
    const eff = sectionRowsRenderKind(rows);
    if (isClozeLikeQuizType(eff)) return visibleClozeQuizRows(rows).length;
    return rows.length;
  }

  /** 全卷连续题号区间（与首页卡片「共 n 道」计数规则一致）；供无 range_text 时使用 */
  function sectionGlobalQuestionRangeLabel(si) {
    let start = 0;
    for (let i = 0; i < si; i++) {
      start += sectionCardQuestionCount(state.bySection["sec:" + i] || []);
    }
    const rows = state.bySection["sec:" + si] || [];
    const cnt = sectionCardQuestionCount(rows);
    if (!cnt) return "";
    const lo = start + 1;
    const hi = start + cnt;
    return lo === hi ? "第 " + lo + " 题" : "第 " + lo + "–" + hi + " 题";
  }

  /** 左侧已有文章的完形/语法填空小题：仅展示纵向 A–D(或含 E…)，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || !isClozeLikeQuizType(row.type)) return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const src = it && typeof it.options === "object" && it.options ? it.options : {};
    const hasCdg = ["C", "D", "E", "F", "G"].some((L) => String(src[L] || "").trim());
    const a0 = String(src.A || "").trim().toUpperCase();
    const b0 = String(src.B || "").trim().toUpperCase();
    const hasTfKeys = String(src.T || "").trim() && String(src.F || "").trim();
    let raw = src;
    if (!hasCdg && !hasTfKeys && a0 && b0) {
      if ((a0 === "T" && b0 === "F") || (a0 === "F" && b0 === "T")) {
        raw = { T: "T", F: "F" };
      }
    }
    const typ = row.type;
    /* options 键名 T、F 与 A–G 中的字母 F 冲突：仅含 T+F 两键时必须先走判断题分支 */
    const rawValKeys = Object.keys(raw).filter((k) => String(raw[k] || "").trim());
    if (
      rawValKeys.length === 2 &&
      rawValKeys.indexOf("T") >= 0 &&
      rawValKeys.indexOf("F") >= 0
    ) {
      return { letters: ["T", "F"], opts: raw };
    }
    const optLetters = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => String(raw[L] || "").trim());
    if (optLetters.length) return { letters: optLetters, opts: raw };
    /* 阅读理解「方框选句」：小题 options 为空，从本大题 section_instruction 解析 A. … E. …（不含 [[PASSAGE]] 后正文） */
    if (!optLetters.length && typ === "reading") {
      const bankSrc = readingSentenceBankBankSource(row);
      const bankRd = dialogueBankOptionsFromSection({ section_instruction: bankSrc });
      const bankLettersRd = Object.keys(bankRd).sort();
      if (bankLettersRd.length >= 2) return { letters: bankLettersRd, opts: bankRd };
    }
    if (isClozeLikeQuizType(typ)) {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    /**
     * 阅读 JSON 常把「判断正误」标成 fill_blank + 空 options；大题标题含「阅读」但 section_instruction 未必含「判断」。
     * 有 teaching 答案 T/F，或 context_note 含判断/See Passage 指引时，按客观 T/F 渲染单选，勿用文本框。
     */
    const cnRd = String(it.context_note || "");
    const caRd = String((it.teaching && it.teaching.correct_answer) || "").trim().toUpperCase();
    const tfByTeaching = caRd === "T" || caRd === "F";
    const tfByReadingNote =
      /判断|正误|True\s*\(\s*T|错误的写|正确的写|写\s*["""']?[TFtf]/i.test(cnRd) ||
      /^See\s+Passage\s*[（(]/i.test(cnRd.trim());
    if (
      typ === "fill_blank" &&
      /阅读/.test(String(row.section_title || "")) &&
      stem &&
      !/_{3,}/.test(stem) &&
      (tfByTeaching || tfByReadingNote)
    ) {
      return { letters: ["T", "F"], opts: { T: "T", F: "F" } };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    const bareTf =
      letters.length === 2 &&
      letters[0] === "T" &&
      letters[1] === "F" &&
      String(opts.T || "").trim() === "T" &&
      String(opts.F || "").trim() === "F";
    if (bareTf) {
      const base = "r-" + qkey.replace(/:/g, "-");
      return (
        "<label class='opt-tf'><input type='radio' name='k-" +
        esc(qkey) +
        "' value='T' id='" +
        base +
        "-T' /><span class='opt-tf-letter'>T</span></label>" +
        "<span class='opt-tf-slash' aria-hidden='true'>/</span>" +
        "<label class='opt-tf'><input type='radio' name='k-" +
        esc(qkey) +
        "' value='F' id='" +
        base +
        "-F' /><span class='opt-tf-letter'>F</span></label>"
      );
    }
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + quizOptionBodyHtml(tx) + "</span></label>";
    });
    return h;
  }

  /** 完形/语法填空练习页：选项自上而下纵向排列 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + quizOptionBodyHtml(tx) + "</span></label>";
    });
    return h;
  }

  function quizOptsGridClass(letters, opts) {
    if (
      letters.length === 2 &&
      letters[0] === "T" &&
      letters[1] === "F" &&
      String(opts.T || "").trim() === "T" &&
      String(opts.F || "").trim() === "F"
    ) {
      return "opts opts-tf-pair";
    }
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
    return "opts opts-cols-" + c;
  }

  function renderTransformStemHtml(stem, qkey) {
    if (!stem) {
      return "<p class='stem'><span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='0' autocomplete='off' /></span></p>";
    }
    if (/_{3,}/.test(stem)) return renderStemHtml(stem, qkey);
    return (
      "<p class='stem'>" +
      esc(stem).replace(/\n/g, "<br>") +
      " <span class='blank-line'><input type='text' data-k='" +
      esc(qkey) +
      "' data-bi='0' autocomplete='off' placeholder='作答' /></span></p>"
    );
  }

  function parseTransformAnswerParts(ca) {
    return String(ca || "").split("|").map((s) => s.trim());
  }

  /** 讲解页：句型转换题干，用正确答案填入空格并高亮（与完形「填入答案」样式一致） */
  function buildTransformFilledStemHtml(stem, ca) {
    const parts = parseTransformAnswerParts(ca);
    const stemStr = String(stem || "");
    const blankPh = "—";
    const spanAns = (w) =>
      "<span class='cloze-filled-ans'>" + esc(w && String(w).trim() ? w : blankPh) + "</span>";

    if (!stemStr.trim()) {
      const w = String(ca || "").trim() || parts.filter(Boolean).join(" | ") || blankPh;
      return "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" + spanAns(w) + "</div>";
    }

    if (/_{3,}/.test(stemStr)) {
      const chunks = stemStr.split(/_{3,}/);
      let h = "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>";
      const n = chunks.length - 1;
      for (let i = 0; i < chunks.length; i++) {
        h += esc(chunks[i]).replace(/\n/g, "<br>");
        if (i < n) {
          const w = i < parts.length ? parts[i] : "";
          h += spanAns(w);
        }
      }
      h += "</div>";
      return h;
    }

    const tail =
      String(ca || "").trim() ||
      (parts.length ? parts.filter(Boolean).join(" | ") : "") ||
      blankPh;
    return (
      "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" +
      esc(stemStr).replace(/\n/g, "<br>") +
      " " +
      spanAns(tail) +
      "</div>"
    );
  }

  function renderOpenAnswerStem(stem, qkey, rowType, quizType) {
    const isTf = rowType === "sentence_transform" || quizType === "sentence_transform";
    if (isTf) return renderTransformStemHtml(stem, qkey);
    if (
      rowType === "writing" &&
      quizType === "writing" &&
      writingStemHasPipeTable(stem)
    ) {
      return (
        "<div class='stem writing-stem'>" +
        writingPromptToHtml(stem) +
        "</div><textarea class='area' data-k='" +
        esc(qkey) +
        "' rows='8' placeholder='在此续写全文'></textarea>"
      );
    }
    return renderStemHtml(stem, qkey) + "<textarea class='area' data-k='" + esc(qkey) + "' rows='6' placeholder='在此作答（多空用 | 分隔）'></textarea>";
  }

  /** 按真题卷面顺序：自上而下扫 sections→items，题型首次出现顺序（与 buildFlat 的 state.flat 一致） */
  function typesInPaperAppearanceOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const t = row.type;
      if (seen[t]) return;
      if (!(state.byType[t] || []).length) return;
      seen[t] = true;
      out.push(t);
    });
    return out;
  }

  function orderedTypesList() {
    const cards = getTypeCards();
    if (cards) return cards.map((_, i) => "tc:" + i);
    const orderRaw = EXAM.exam_meta && String(EXAM.exam_meta.type_card_order || "").toLowerCase();
    if (orderRaw === "paper_sections" || orderRaw === "sections") {
      return sectionsInPaperOrder();
    }
    if (orderRaw === "paper") {
      return typesInPaperAppearanceOrder();
    }
    return Object.keys(state.byType)
      .filter((x) => (state.byType[x] || []).length > 0)
      .sort((a, b) => {
        const ia = TYPE_ORDER.indexOf(a);
        const ib = TYPE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
  }

  /** 生成某题型答题区 HTML（供页面与 PDF 共用）；quizType 为内容分支，tag 为题卡角标文案 */
  function buildQuizBodyHtmlByType(quizType, rows, displayTag) {
    const tag = displayTag != null ? displayTag : quizType;
    const readingGroups = groupReadingByPassage(rows);
    const usePassageReadingLayout =
      readingGroups.some((g) => g.passage) &&
      quizType !== "writing" &&
      !isClozeLikeQuizType(quizType);
    const writingGroups = quizType === "writing" ? groupWritingByPassage(rows) : [];
    let html = "";
    if (isClozeLikeQuizType(quizType) && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0]) && !String(g.instruction || "").trim()) return;
        if (isClozeInlineFillSectionGroup(g)) {
          const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
          html +=
            "<div class='pdf-cloze-unit cloze-inline-fill-unit'><div class='cloze-passage-card card'>" +
            "<h2>" +
            esc(gTitle) +
            "</h2>" +
            htmlClozeInstructionWithInlineBlanks(g.instruction, g.rows) +
            "</div></div>";
          return;
        }
        const ins = g.instruction.trim();
        const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
        const sp = splitSectionHintAndBody(ins);
        const hintTop = sp.hint
          ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
          : "";
        const mainIns = sp.body || ins;
        const passageHtml = ins
          ? "<div class='cloze-passage-card card'><h2>" +
            esc(gTitle) +
            "</h2>" +
            hintTop +
            "<div class='cloze-passage-text'>" +
            formatPassageParagraphs(mainIns) +
            "</div></div>"
          : "<div class='cloze-passage-card card'><p class='muted'>（本篇暂无导语，请仅根据右侧选项作答。）</p></div>";
        let rightCol =
          "<div class='cloze-options-col'><h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>答题区</h2>";
        g.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          const diaGap = isClozeDialoguePlaceholderStem(it.stem);
          rightCol +=
            "<div class='card q-block cloze-opt-card" +
            (diaGap ? " cloze-dialogue-gap-card" : "") +
            "' data-qkey='" +
            esc(qkey) +
            "'><div class='q'>";
          if (diaGap) {
            rightCol += "<div class='cloze-dialogue-gap-badge'>" + esc(num) + ".</div>";
          } else {
            rightCol +=
              "<div class='q-head'><span class='q-num'>第 " + esc(num) + " 空</span><span class='tag'>" + esc(tag) + "</span></div>";
          }
          const layoutC = getObjectiveChoiceLayout(row, it);
          const lettersC = layoutC.letters;
          const optsC = layoutC.opts;
          const abcdOnly = isPassageClozeAbcdLayout(row, it);
          if (lettersC.length) {
            if (!diaGap && !abcdOnly) {
              rightCol += renderStemHtml(it.stem, qkey);
            }
            if (abcdOnly) {
              rightCol += "<div class='opts opts-cloze-abcd'>";
              rightCol += htmlQuizRadioOptionsAbcdGrid(lettersC, optsC, qkey);
            } else {
              rightCol += "<div class='" + quizOptsGridClass(lettersC, optsC) + "'>";
              rightCol += htmlQuizRadioOptions(lettersC, optsC, qkey);
            }
            rightCol += "</div>";
          } else {
            rightCol += renderStemHtml(it.stem, qkey);
          }
          rightCol += "</div></div>";
        });
        rightCol += "</div>";
        html +=
          "<div class='pdf-cloze-unit'><div class='cloze-quiz-layout'><div class='cloze-passage-col'>" +
          passageHtml +
          "</div>" +
          rightCol +
          "</div></div>";
      });
    } else if (
      quizType === "reading" &&
      rows.length &&
      isReadingSentenceBankCompletionSection(rows[0])
    ) {
      html += buildReadingSentenceBankQuizHtml(rows, tag);
    } else if (usePassageReadingLayout) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtml;
          if (g.fromSection) {
            passageHtml =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passageHtml =
              "<div class='reading-passage-card card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          let rightCol = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            rightCol += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            rightCol += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            rightCol += "<span class='tag'>" + esc(tag) + "</span></div>";
            const layoutR = getObjectiveChoiceLayout(row, it);
            const lettersR = layoutR.letters;
            const optsR = layoutR.opts;
            if (lettersR.length) {
              rightCol += renderStemHtml(it.stem, qkey);
              rightCol += "<div class='" + quizOptsGridClass(lettersR, optsR) + "'>";
              rightCol += htmlQuizRadioOptions(lettersR, optsR, qkey);
              rightCol += "</div>";
            } else {
              rightCol += renderOpenAnswerStem(it.stem, qkey, row.type, quizType);
            }
            rightCol += "</div></div>";
          });
          rightCol += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtml +
            "</div>" +
            rightCol +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            html += "<span class='tag'>" + esc(tag) + "</span></div>";
            const layoutR2 = getObjectiveChoiceLayout(row, it);
            const lettersR2 = layoutR2.letters;
            const optsR2 = layoutR2.opts;
            if (lettersR2.length) {
              html += renderStemHtml(it.stem, qkey);
              html += "<div class='" + quizOptsGridClass(lettersR2, optsR2) + "'>";
              html += htmlQuizRadioOptions(lettersR2, optsR2, qkey);
              html += "</div>";
            } else {
              html += renderOpenAnswerStem(it.stem, qkey, row.type, quizType);
            }
            html += "</div></div>";
          });
        }
      });
    } else if (quizType === "reading" && rows.length && isReadingTableFillSection(rows[0])) {
      const insT = String(rows[0].section_instruction || "").trim();
      const stT = String(rows[0].section_title || "").trim() || "阅读填表";
      const passageT =
        "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
        "<div class='reading-passage-text'>" +
        (insT ? formatPassageParagraphs(insT) : "<p class='muted'>（暂无材料）</p>") +
        "</div></div>";
      let tbl =
        "<div class='reading-questions-col'><div class='card reading-table-fill-wrap'>" +
        "<h3 class='reading-table-fill-hd'>" +
        esc(stT) +
        " · 图表填空</h3>" +
        "<table class='reading-fill-table'><thead><tr><th scope='col'>序号</th><th scope='col'>题目与作答</th></tr></thead><tbody>";
      rows.forEach((row) => {
        const it = row.it;
        const qkey = row.key;
        const num = String(it.number);
        tbl += "<tr><td class='reading-fill-num'>" + esc(num) + "</td><td class='reading-fill-cell'>";
        tbl +=
          "<div class='q-block reading-table-q' data-qkey='" +
          esc(qkey) +
          "'>" +
          renderStemHtml(it.stem, qkey, { placeholderParen: true }) +
          "</div></td></tr>";
      });
      tbl += "</tbody></table></div></div>";
      html +=
        "<div class='reading-quiz-layout reading-table-fill-layout'><div class='reading-passage-col'>" +
        passageT +
        "</div>" +
        tbl +
        "</div>";
    } else if (quizType === "writing" && writingGroups.some((g) => g.passage)) {
      writingGroups.forEach((g) => {
        if (g.passage) {
          const writingCardTitle =
            String((g.rows[0] && g.rows[0].section_title) || "").trim() || "书面表达";
          let passageHtmlW;
          if (g.fromSection) {
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>" + esc(writingCardTitle) + "</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const phw = splitReadingPassageHeading(g.passage);
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>" + esc(phw.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(phw.text) + "</div></div>";
          }
          let rightColW = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const itw = row.it;
            const qkeyW = row.key;
            const numW = String(itw.number);
            rightColW += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyW) + "'><div class='q'>";
            rightColW +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numW) +
              " 题</span>";
            rightColW += "<span class='tag'>" + esc(tag) + "</span></div>";
            rightColW += renderOpenAnswerStem(itw.stem, qkeyW, row.type, quizType);
            rightColW += "</div></div>";
          });
          rightColW += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtmlW +
            "</div>" +
            rightColW +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const itx = row.it;
            const qkeyX = row.key;
            const numX = String(itx.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyX) + "'><div class='q'>";
            html +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numX) +
              " 题</span>";
            html += "<span class='tag'>" + esc(tag) + "</span></div>";
            html += renderOpenAnswerStem(itx.stem, qkeyX, row.type, quizType);
            html += "</div></div>";
          });
        }
      });
    } else if (isFillBlankQuizType(quizType) && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((fg) => {
        if (isClozeInlineFillSectionGroup(fg)) {
          const gTitle = String(fg.rows[0].section_title || "").trim() || "词汇填空";
          html +=
            "<div class='pdf-cloze-unit cloze-inline-fill-unit'><div class='cloze-passage-card card'>" +
            "<h2>" +
            esc(gTitle) +
            "</h2>" +
            htmlClozeInstructionWithInlineBlanks(fg.instruction, fg.rows) +
            "</div></div>";
          return;
        }
        if (fg.instruction) {
          const sp = splitSectionHintAndBody(fg.instruction);
          const hintPart = sp.hint
            ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
            : "";
          const bankSrc = sp.body || fg.instruction;
          html +=
            "<div class='card word-bank-card' style='margin-bottom:1rem'>" +
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            hintPart +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(bankSrc).replace(/\n/g, "<br>") +
            "</div></div>";
        }
        fg.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          html += "<div class='card q-block' data-qkey='" + esc(qkey) + "'><div class='q'>";
          html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
          html += "<span class='tag'>" + esc(tag) + "</span></div>";
          html += renderStemHtml(it.stem, qkey);
          html += "</div></div>";
        });
      });
    } else {
      if (quizType === "phonetics" && rows.length) {
        const insPh = String(rows[0].section_instruction || "").trim();
        if (insPh) {
          html +=
            "<div class='card' style='margin-bottom:1rem;padding:0.75rem 1rem'><p class='muted' style='margin:0;line-height:1.55'>" +
            esc(insPh).replace(/\n/g, "<br>") +
            "</p></div>";
        }
      }
      const stemOptBase =
        quizType === "phonetics" ? { allowUnderline: true, placeholderParen: true } : { placeholderParen: true };
      rows.forEach((row) => {
        const it = row.it;
        const qkey = row.key;
        const num = String(it.number);
        html +=
          "<div class='card q-block" +
          (quizType === "reading" ? " reading-q-card" : "") +
          "' data-qkey='" +
          esc(qkey) +
          "'><div class='q'>";
        html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
        html += "<span class='tag'>" + esc(tag) + "</span></div>";

        if (quizType === "reading" && (it.context_note || "").trim()) {
          html += "<div class='passage'>" + formatPassageParagraphs(it.context_note) + "</div>";
        }

        const layoutG = getObjectiveChoiceLayout(row, it);
        const lettersG = layoutG.letters;
        const optsG = layoutG.opts;
        if (lettersG.length) {
          html += renderStemHtml(it.stem, qkey, stemOptBase);
          html += "<div class='" + quizOptsGridClass(lettersG, optsG) + "'>";
          html += htmlQuizRadioOptions(lettersG, optsG, qkey);
          html += "</div>";
        } else {
          html += renderOpenAnswerStem(it.stem, qkey, row.type, quizType);
        }
        html += "</div></div>";
      });
    }
    return html;
  }

  function buildQuizBodyHtmlMixedSection(rows) {
    let html = "";
    let i = 0;
    while (i < rows.length) {
      let j = i + 1;
      while (j < rows.length && rows[j].type === rows[i].type) j++;
      const chunk = rows.slice(i, j);
      const typ = rows[i].type;
      html += buildQuizBodyHtmlByType(typ, chunk, typ);
      i = j;
    }
    return html;
  }

  function buildQuizBodyHtml(t) {
    const isBlock = isPaperShardId(t);
    const rows = isBlock ? rowsForPaperShard(t) : (state.byType[t] || []);
    if (!rows.length) return "";
    const effective = isBlock ? sectionRowsRenderKind(rows) : t;
    const displayTag = isBlock ? sectionRowsPrimaryType(rows) : t;
    if (isBlock && effective === "mixed") return buildQuizBodyHtmlMixedSection(rows);
    return buildQuizBodyHtmlByType(effective, rows, displayTag);
  }

  /** 阅读材料中允许 &lt;u&gt;…&lt;/u&gt; 显示为下划线，其余 HTML 剥离 */
  function examSanitizePassageRich(p) {
    let t = String(p || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t.replace(/@@UON@@/g, "<u>").replace(/@@UOFF@@/g, "</u>");
  }

  function formatPassageParagraphsExam(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    return s
      .split(/\n+/)
      .map((x) => x.trim())
      .filter(Boolean)
      .map((para) => "<p class='exam-para'>" + examSanitizePassageRich(para).replace(/\n/g, "<br>") + "</p>")
      .join("");
  }

  function buildExamPaperStemPlain(stem, allowUnderline) {
    const s = String(stem || "");
    if (allowUnderline) {
      return stemHtmlWithAllowedUnderline(s).replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
    }
    return esc(s)
      .replace(/\n/g, "<br>")
      .replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
  }

  function buildExamPaperOptionsHtmlWithLayout(letters, opts) {
    const bareTfPdf =
      letters.length === 2 &&
      letters[0] === "T" &&
      letters[1] === "F" &&
      String((opts && opts.T) || "").trim() === "T" &&
      String((opts && opts.F) || "").trim() === "F";
    if (bareTfPdf) {
      return (
        "<div class='exam-opts-row exam-opts-tf-pair'>" +
        "<span class='exam-tf-choice'>T</span>" +
        "<span class='exam-tf-slash'>/</span>" +
        "<span class='exam-tf-choice'>F</span>" +
        "</div>"
      );
    }
    const parts = [];
    letters.forEach((L) => {
      const tx = String((opts && opts[L]) || "").trim();
      if (!tx) return;
      parts.push("<span class='exam-opt-chip'><b>" + esc(L) + ".</b> " + examOptionBodyHtml(tx) + "</span>");
    });
    if (!parts.length) return "";
    const n = parts.length;
    const cls = n <= 4 ? "exam-opts-cols-" + n : "exam-opts-bank";
    return "<div class='exam-opts-row " + cls + "'>" + parts.join("") + "</div>";
  }

  /** 完形 PDF：多行表格，每行「题号 | A | B | …」，列对齐 */
  function buildExamPaperClozePdfGrid(rows) {
    if (!rows || !rows.length) return "";
    const union = new Set();
    rows.forEach((row) => {
      getObjectiveChoiceLayout(row, row.it).letters.forEach((L) => union.add(L));
    });
    const order = ["A", "B", "C", "D", "E", "F", "G"].filter((L) => union.has(L));
    const nOpt = order.length;
    const optCls =
      nOpt >= 7
        ? " exam-cloze-pdf-grid-7opt"
        : nOpt >= 6
          ? " exam-cloze-pdf-grid-6opt"
          : nOpt >= 5
            ? " exam-cloze-pdf-grid-5opt"
            : nOpt >= 4
              ? " exam-cloze-pdf-grid-4opt"
              : "";
    let h = "<div class='exam-cloze-pdf-grid" + optCls + "'>";
    rows.forEach((row) => {
      const it = row.it;
      const num = String(it.number);
      const layout = getObjectiveChoiceLayout(row, it);
      const letters = layout.letters;
      const opts = layout.opts;
      h +=
        "<span class='exam-cloze-pdf-num'><span class='exam-n'>" +
        esc(num) +
        ".</span><span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span></span>";
      order.forEach((L) => {
        const tx = String((opts && opts[L]) || "").trim();
        if (letters.includes(L) && tx) {
          h += "<span class='exam-cloze-pdf-opt'><b>" + esc(L) + ".</b> " + examOptionBodyHtml(tx) + "</span>";
        } else {
          h += "<span class='exam-cloze-pdf-opt exam-cloze-pdf-opt-empty'></span>";
        }
      });
    });
    h += "</div>";
    return h;
  }

  function buildExamPaperOptionsHtml(opts) {
    const letters = ["A", "B", "C", "D"].filter((L) => String((opts && opts[L]) || "").trim());
    if (!letters.length) return "";
    return buildExamPaperOptionsHtmlWithLayout(letters, opts);
  }

  function isPdfWrittenAnswerItem(row) {
    const typ = row.type;
    if (typ === "writing") return false;
    if (typ === "sentence_transform") return true;
    if (isFillBlankQuizType(typ)) return true;
    if (typ === "grammar_fill") return true;
    if (typ === "other") return true;
    return false;
  }

  function buildExamPaperItemBlock(row, it, t) {
    const num = String(it.number);
    const layout = getObjectiveChoiceLayout(row, it);
    const letters = layout.letters;
    const opts = layout.opts;
    const written = !letters.length && isPdfWrittenAnswerItem(row);
    const itemCls =
      "exam-item" +
      (t === "reading" ? " exam-item-reading" : "") +
      (written ? " exam-item-written" : "");
    let block = "<div class='" + itemCls + "'>";
    if (letters.length) {
      block += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span>";
      block += "<span class='exam-paren'>（&nbsp;&nbsp;&nbsp;&nbsp;）</span>";
      block += buildExamPaperStemPlain(it.stem, row.type === "phonetics") + "</div>";
      block += buildExamPaperOptionsHtmlWithLayout(letters, opts);
    } else {
      block += "<div class='exam-item-row'><span class='exam-n'>" + esc(num) + ".</span>";
      if (
        (t === "writing" || row.type === "writing") &&
        writingStemHasPipeTable(it.stem)
      ) {
        block += "</div><div class='exam-writing-stem-wrap'>" + writingPromptToHtml(it.stem) + "</div>";
      } else {
        block += " " + buildExamPaperStemPlain(it.stem, row.type === "phonetics") + "</div>";
      }
      if (t === "writing" || row.type === "writing") {
        block += "<div class='exam-answer-lines'></div>";
      } else if (written) {
        block += "<div class='exam-written-lines' aria-hidden='true'></div>";
      }
    }
    block += "</div>";
    return block;
  }

  /** PDF：按 groupReadingByPassage 输出「文章框 + 小题」（与练习页聚篇一致） */
  function buildExamPaperReadingGroupsHtml(readingGroups) {
    let frag = "";
    readingGroups.forEach((g) => {
      if (g.passage) {
        frag += "<div class='exam-reading-unit'>";
        if (g.fromSection) {
          frag += "<div class='exam-passage-titled-wrap'>";
          frag +=
            "<div class='exam-passage-block'>" +
            passageExamHtmlFromSectionInstruction(g.passage) +
            "</div>";
          frag += "</div>";
        } else {
          const ph = splitReadingPassageHeading(g.passage);
          frag += "<div class='exam-passage-titled-wrap'>";
          frag += "<p class='exam-subhead'>" + esc(ph.title) + "</p>";
          frag += "<div class='exam-passage-block'>" + formatPassageParagraphsExam(ph.text) + "</div>";
          frag += "</div>";
        }
        g.rows.forEach((row) => {
          frag += buildExamPaperItemBlock(
            row,
            row.it,
            isPassageKeyedQuizRow(row) ? "reading" : row.type,
          );
        });
        frag += "</div>";
      } else {
        g.rows.forEach((row) => {
          frag += buildExamPaperItemBlock(
            row,
            row.it,
            isPassageKeyedQuizRow(row) ? "reading" : row.type,
          );
        });
      }
    });
    return frag;
  }

  /** 合并大题 PDF：去掉子节自带的卷面大标题，只保留 type_cards 总标题 */
  function stripLeadingExamBigTitleHtml(inner) {
    return String(inner || "").replace(
      /^\s*<h2\b[^>]*\bclass=['"]exam-big-title['"][^>]*>[\s\S]*?<\/h2>\s*/i,
      "",
    );
  }

  function buildExamPaperTypeCardHtml(tcId) {
    const idx = parseTypeCardIndex(tcId);
    const cards = getTypeCards();
    if (!cards || idx < 0 || idx >= cards.length) return "";
    const spec = cards[idx];
    const secs = spec.sections;
    if (!Array.isArray(secs) || !secs.length) return "";
    const mainTitle = String(spec.title || "").trim() || "大题";
    let h = "<h2 class='exam-big-title'>" + esc(mainTitle) + "</h2>";
    secs.forEach((si) => {
      const chunk = buildExamPaperSectionHtml("sec:" + si);
      h += stripLeadingExamBigTitleHtml(chunk);
    });
    return h;
  }

  /** 标准纸笔考试排版（非网页练习样式）；rowsOverride 用于 sec:N 大题卡 */
  function buildExamPaperSectionHtml(shardOrType, rowsOverride) {
    if (isTypeCardId(shardOrType)) {
      return buildExamPaperTypeCardHtml(shardOrType);
    }
    const isSec = isSectionShardId(shardOrType);
    const rows =
      rowsOverride != null
        ? rowsOverride
        : isSec
          ? (state.bySection[shardOrType] || [])
          : (state.byType[shardOrType] || []);
    if (!rows.length) return "";
    const qt = isSec ? sectionRowsRenderKind(rows) : shardOrType;
    if (isSec && qt === "mixed") {
      const readingGroupsMix = groupReadingByPassage(rows);
      if (readingGroupsMix.some((g) => g.passage)) {
        return (
          "<h2 class='exam-big-title'>" +
          esc(sectionShardLabel(shardOrType)) +
          "</h2>" +
          buildExamPaperReadingGroupsHtml(readingGroupsMix)
        );
      }
      let mix = "<h2 class='exam-big-title'>" + esc(sectionShardLabel(shardOrType)) + "</h2>";
      rows.forEach((row) => {
        const it = row.it;
        if (row.type === "reading" && (it.context_note || "").trim()) {
          mix +=
            "<div class='exam-passage-block exam-passage-inline'>" +
            formatPassageParagraphsExam(it.context_note) +
            "</div>";
        }
        mix += buildExamPaperItemBlock(row, it, row.type);
      });
      return mix;
    }
    const readingGroups = groupReadingByPassage(rows);
    const writingGroupsEp = qt === "writing" ? groupWritingByPassage(rows) : [];

    if (isClozeLikeQuizType(qt) && rows.length) {
      let out = "";
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0]) && !String(g.instruction || "").trim()) return;
        const gTitle = String(g.rows[0].section_title || "").trim() || typeLabel(qt);
        out += "<h2 class='exam-big-title'>" + esc(gTitle) + "</h2>";
        if (isClozeInlineFillSectionGroup(g)) {
          out += buildClozeInlineFillPdfBlockHtml(g.instruction, g.rows, gTitle);
          return;
        }
        const ins = g.instruction.trim();
        if (ins) {
          const sp = splitSectionHintAndBody(ins);
          const mainText = sp.body || ins;
          out += "<div class='exam-passage-titled-wrap'>";
          if (sp.hint) {
            out += "<p class='exam-direction'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>";
          }
          out += "<div class='exam-passage-block'>" + formatPassageParagraphsExam(mainText) + "</div>";
          out += "</div>";
        }
        const allPassageAbcd =
          g.rows.length > 0 &&
          g.rows.every((row) => {
            const it = row.it;
            return (
              !isClozeDialoguePlaceholderStem(it.stem) &&
              isPassageClozeAbcdLayout(row, it) &&
              getObjectiveChoiceLayout(row, it).letters.length > 0
            );
          });
        if (allPassageAbcd) {
          out += buildExamPaperClozePdfGrid(g.rows);
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const num = String(it.number);
            const layoutZ = getObjectiveChoiceLayout(row, it);
            const lettersZ = layoutZ.letters;
            const optsZ = layoutZ.opts;
            const diaGapZ = isClozeDialoguePlaceholderStem(it.stem);

  function collectTypeAnswers() {
    const t = state.currentType;
    const rows = isPaperShardId(t) ? rowsForPaperShard(t) : (state.byType[t] || []);
    const out = {};
    rows.forEach((row) => {
      const k = row.key;
      const kEsc = k.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      let block = document.querySelector(".q-block[data-qkey=\"" + kEsc + "\"]");
      if (!block) {
        const inlineInp = document.querySelector(
          "#quizBody .cloze-inline-passage input[data-k=\"" + kEsc + "\"]",
        );
        if (inlineInp) {
          out[k] = String(inlineInp.value || "").trim();
          return;
        }
        return;
      }
      const r = block.querySelector("input[type=radio]:checked");
      if (r) {
        out[k] = r.value;
        return;
      }
      const blankOne = block.querySelector("input.blank-input[data-k]");
      if (blankOne) {
        out[k] = blankOne.value.trim();
        return;
      }
      const blanks = block.querySelectorAll("input[data-k][data-bi]");
      if (blanks.length) {
        const bits = [];
        blanks.forEach((b) => bits.push(b.value.trim()));
        out[k] = bits.join("|");
        return;
      }
      const ta = block.querySelector("textarea[data-k]");
      if (ta) out[k] = ta.value.trim();
    });
    return out;
  }

  function normLetter(x) {
    return String(x || "").trim().toUpperCase().charAt(0);

  function normPipe(x) {
    return String(x || "")
      .split("|")
      .map((s) => s.trim().toLowerCase())
      .join("|");
  }

  function judge(row, userAns) {
    const it = row.it;
    const teach = it.teaching || {};
    const ca = teach.correct_answer || "";
    const typ = row.type;
    if (typ === "writing") return { open: true, ok: null, ca, userAns };
    if (typ === "cloze") {
      const layout = getObjectiveChoiceLayout(row, it);
      if (layout.letters.length === 0 && !String(it.stem || "").trim()) {
        const ok =
          !!ca &&
          String(userAns || "").trim().toLowerCase() === String(ca || "").trim().toLowerCase();
        return { open: false, ok, ca, userAns };
      }
    }
    if (["choice", "cloze", "grammar_fill", "reading", "other", "phonetics"].includes(typ)) {
      const ok = ca && normLetter(userAns) === normLetter(ca);
      return { open: false, ok, ca, userAns };
    }
    const ok = ca && normPipe(userAns) === normPipe(ca);
    return { open: false, ok, ca, userAns };
  }

  function wrapEnglishWords(container) {
    if (!container || container.nodeType !== 1) return;
    const skip = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "PRE", "BUTTON"]);
    function walk(node) {
      if (node.nodeType === 1) {
        if (skip.has(node.tagName)) return;
        if (node.classList && node.classList.contains("wlink")) return;
        Array.from(node.childNodes).forEach(walk);
        return;
      }
      if (node.nodeType !== 3) return;
      const text = node.textContent;
      if (!text || !/\b[A-Za-z]/.test(text)) return;
      const parent = node.parentNode;
      if (!parent) return;
      const frag = document.createDocumentFragment();
      const re = /(\b[A-Za-z]+(?:[-'][A-Za-z]+)*\b)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const sp = document.createElement("span");
        sp.className = "wlink";
        sp.textContent = m[1];
        sp.title = "点击查看词义";
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      parent.replaceChild(frag, node);
    }
    try {
      walk(container);
    } catch (err) {
      console.warn("wrapEnglishWords:", err);
    }
  }

  function speechVoicesReady() {
    return new Promise((resolve) => {
      const syn = window.speechSynthesis;
      if (!syn) {
        resolve();
        return;
      }
      if (syn.getVoices().length) {
        resolve();
        return;
      }
      const done = () => resolve();
      syn.addEventListener("voiceschanged", done, { once: true });
      setTimeout(done, 600);
    });
  }

  function pickEnglishTtsVoice() {
    const syn = window.speechSynthesis;
    if (!syn) return null;
    const vs = syn.getVoices();
    return (
      vs.find((v) => /^en-US\b/i.test(v.lang || "")) ||
      vs.find((v) => /^en-GB\b/i.test(v.lang || "")) ||
      vs.find((v) => /^en\b/i.test(v.lang || "")) ||
      vs.find((v) => (v.lang || "").toLowerCase().startsWith("en")) ||
      null
    );
  }

  async function playTtsAzure(textPlain) {
    const t = stripForTts(textPlain).trim();
    if (!t) throw new Error("无朗读内容");
    const region = String(INLINE_CFG.azureRegion || "").trim();
    const key = String(INLINE_CFG.azureKey || "").trim();
    if (!region || !key || key.length < 8) throw new Error("未配置 Azure 区域或密钥");
    const url = "https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1";
    const safe = xmlEscapeTts(t);
    const ssml =
      "<speak version='1.0' xml:lang='en-GB'>" +
      "<voice xml:lang='en-GB' name='en-GB-RyanNeural'>" +
      "<prosody rate='0.85'>" + safe + "</prosody></voice></speak>";
    const r = await fetch(url, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Ocp-Apim-Subscription-Key": key,
        "Content-Type": "application/ssml+xml",
        "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3",
      },
      body: ssml,
    });
    if (!r.ok) {
      const errText = await r.text();
      throw new Error("Azure " + r.status + " " + errText.slice(0, 120));
    }
    const buf = await r.arrayBuffer();
    const blob = new Blob([buf], { type: "audio/mpeg" });
    const u = URL.createObjectURL(blob);
    const a = new Audio(u);
    try {
      await a.play();
    } catch (playErr) {
      URL.revokeObjectURL(u);
      throw playErr;
    }
    await new Promise((resolve, reject) => {
      a.onended = () => {
        URL.revokeObjectURL(u);
        resolve();
      };
      a.onerror = () => {
        URL.revokeObjectURL(u);
        reject(new Error("音频播放失败"));
      };
    });
  }

  async function playTtsSpeechSynth(textPlain) {
    const t = stripForTts(textPlain).trim();
    if (!t) throw new Error("无朗读内容");
    const syn = window.speechSynthesis;
    if (!syn) throw new Error("当前浏览器不支持本机语音朗读");
    await speechVoicesReady();
    syn.cancel();
    return new Promise((resolve, reject) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "en-GB";
      u.rate = 0.85;
      const voice = pickEnglishTtsVoice();
      if (voice) u.voice = voice;
      u.onend = () => resolve();
      u.onerror = () => reject(new Error("本机朗读出错"));
      syn.speak(u);
    });
  }

  async function playTts(text) {
    const t = stripForTts(text).trim();
    if (!t) {
      alert("无朗读内容");
      return;
    }
    const fileLocal = location.protocol === "file:";
    const tryOrder = fileLocal
      ? [
          ["本机英文语音", playTtsSpeechSynth],
          ["Azure 在线语音", playTtsAzure],
        ]
      : [
          ["Azure 在线语音", playTtsAzure],
          ["本机英文语音", playTtsSpeechSynth],
        ];
    let lastErr = null;
    for (let i = 0; i < tryOrder.length; i++) {
      try {
        await tryOrder[i][1](t);
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    alert(
      "朗读未成功。\n\n" +
        (fileLocal
          ? "本地打开试卷时，浏览器无法直连 Azure（跨域限制），已优先尝试本机朗读。\n"
          : "已尝试在线语音与本机朗读。\n") +
        "最后错误：" +
        (lastErr && lastErr.message ? lastErr.message : "未知")
    );
  }

    const it = row.it;
    const teach = it.teaching || {};
    const ex = teach.explanation_md || "（暂无解析，请运行 enrich_teaching_vertex.py 生成）";
    const kn = teach.knowledge_expansion_md || "（暂无）";
    const tracks = Array.isArray(teach.socratic_tracks) ? teach.socratic_tracks : [];

    const layoutL = getObjectiveChoiceLayout(row, it);
    const lettersL = layoutL.letters;
    const optsL = layoutL.opts;
    let optReview = "";
    if (lettersL.length) {
      optReview = "<div class='opt-review'><strong>选项回顾</strong><br>";
      lettersL.forEach((L) => {
        const tx = String(optsL[L] || "").trim();
        if (tx) optReview += "<span style='display:block;margin:0.2rem 0'>" + esc(L) + ". " + esc(tx) + "</span>";
      });
      optReview += "</div>";
    }

    const card = document.createElement("div");
    card.className = "card";
    const num = String(it.number);
    let pill = "";
    if (j.open) pill = "<span class='pill-open'>开放题</span>";
    else if (j.ok) pill = "<span class='pill-ok'>回答正确</span>";
    else pill = "<span class='pill-bad'>回答有误</span>";

    let sub = "";
    if (!skipReadingPassage && t === "reading" && (it.context_note || "").trim()) {
      sub += "<div class='passage' style='font-size:0.9rem'>" + formatPassageParagraphs(it.context_note) + "</div>";
    }

    const youCls = j.open ? "ans-you" : j.ok ? "ans-you ok" : "ans-you";
    const youLabel = j.open ? "你的作答（参考）" : "你的作答";
    const keyLabel = j.open ? "参考范文 / 要点" : "正确答案";

    const isTfLearn = t === "sentence_transform";
    let stemAndAnsBlock;
    if (isTfLearn) {
      const caTf = (teach.correct_answer != null ? String(teach.correct_answer) : "") || j.ca || "";
      stemAndAnsBlock =
        buildTransformFilledStemHtml(it.stem, caTf) +
        (!j.ok && String(j.userAns || "").trim()
          ? "<p class='muted' style='margin:0 0 0.75rem;font-size:0.9rem'>你的作答：" +
            esc(j.userAns || "（未答）") +
            "</p>"
          : "");
    } else {
      const stemLearnInner =
        t === "phonetics"
          ? stemHtmlWithAllowedUnderline(it.stem || "")
          : t === "writing" && writingStemHasPipeTable(it.stem)
            ? writingPromptToHtml(it.stem)
            : esc(it.stem || "").replace(/\n/g, "<br>");
      stemAndAnsBlock =
        "<div class='stem' style='margin-bottom:0.75rem'>" + stemLearnInner + "</div>" +
        "<div class='ans-row'>" +
        "<div class='ans-box " + youCls + "'><strong>" + youLabel + "</strong><br>" + esc(j.userAns || "（未答）") + "</div>" +
        "<div class='ans-box ans-key'><strong>" + keyLabel + "</strong><br>" + esc(j.ca || "—") + "</div></div>";
    }

    card.innerHTML =
      "<h2>" + esc(row.section_title) + " · 第 " + esc(num) + " 题 " + pill + "</h2>" + sub +
      optReview +
      stemAndAnsBlock +
      "<div class='toolbar'>" +
      "<button type='button' class='btn secondary btn-ex'>查看解析</button>" +
      "<button type='button' class='btn secondary btn-kn'>知识点扩充</button>" +
      "<button type='button' class='btn primary btn-soc'>苏格拉底式测一测</button></div>" +
      "<div class='panel md p-ex'></div>" +
      "<div class='panel md p-kn'></div>" +
      "<div class='panel p-soc'></div>";

    const pEx = card.querySelector(".p-ex");
    const pKn = card.querySelector(".p-kn");
    const pSoc = card.querySelector(".p-soc");
    pEx.innerHTML = marked.parse(ex, { breaks: true });
    pKn.innerHTML = marked.parse(kn, { breaks: true });
    // 整卡题目内容（题干/选项/答案/文章片段/解析/知识点）均可点击查词
    wrapEnglishWords(card);

    card.querySelector(".btn-ex").addEventListener("click", () => {
      pEx.classList.toggle("open");
    });
    card.querySelector(".btn-kn").addEventListener("click", () => {
      pKn.classList.toggle("open");
    });

    let socOpen = false;
    card.querySelector(".btn-soc").addEventListener("click", () => {
      socOpen = !socOpen;
      pSoc.classList.toggle("open", socOpen);
      if (socOpen && !pSoc.dataset.built) {
        pSoc.dataset.built = "1";
        let sh = "";
        if (!tracks.length) {
          sh = "<p class='muted'>暂无苏格拉底引导数据。</p>";
        } else {
          tracks.forEach((tr, ti) => {
            const title = esc(tr.title || "知识点 " + (ti + 1));
            const steps = Array.isArray(tr.steps) ? tr.steps : [];
            sh += "<div class='soc-track'><h4>" + title + "</h4>";
            steps.forEach((st, si) => {
              const q = esc(st.question || "");
              const hi = esc(st.hint || "");
              const ta = esc(st.takeaway || "");
              sh += "<div class='soc-step' data-ti='" + ti + "' data-si='" + si + "'>" +
                "<div class='qtext'>" + q + "</div>" +
                "<button type='button' class='btn ghost btn-hint-sm'>显示提示</button> " +
                "<button type='button' class='btn secondary btn-next-sm'>下一步 / 点破</button>" +
                "<div class='hint'>" + hi + "</div>" +
                "<div class='takeaway'>" + ta + "</div></div>";
            });
            sh += "</div>";
          });
        }
        pSoc.innerHTML = sh;
        wrapEnglishWords(pSoc);
        pSoc.querySelectorAll(".btn-hint-sm").forEach((b) => {
          b.addEventListener("click", () => b.parentElement.querySelector(".hint").classList.add("show"));
        });
        pSoc.querySelectorAll(".btn-next-sm").forEach((b) => {
          b.addEventListener("click", () => {
            b.parentElement.querySelector(".takeaway").classList.add("show");
          });
        });
      }
    });

    parent.appendChild(card);
  }

  function renderLearn() {
    const t = state.currentType;
    const rowsLearn = isPaperShardId(t) ? rowsForPaperShard(t) : (state.byType[t] || []);
    const effectiveType = isPaperShardId(t) ? sectionRowsRenderKind(rowsLearn) : t;
    const details = state.lastResults || [];
    const root = document.getElementById("learnBody");
    document.getElementById("learnTitle").textContent = typeLabel(t) + " · 讲解";
    root.innerHTML = "";

    if (isPaperShardId(t) && effectiveType === "mixed") {
      details.forEach((pair) => appendLearnCard(root, pair, pair.row.type, false));
      return;
    }

    if (isClozeLikeQuizType(effectiveType)) {
      groupDetailsByClozeSection(details).forEach((g) => {
        const row0 = g.details[0] && g.details[0].row;
        if (row0 && isClozeDialogueCompletionSection(row0) && !String(row0.section_instruction || "").trim()) return;
        const ins = (g.passage || "").trim();
        if (ins && g.details.length) {
          const filled = buildClozeFilledPassageHtml(g.passage, g.details);
          const wrap = document.createElement("div");
          wrap.className = "reading-learn-layout";
          wrap.innerHTML =
            "<div class='reading-learn-passage'>" +
            "<div class='card cloze-learn-block'>" +
            "<h2>完整原文</h2>" +
            "<p class='muted' style='margin:0 0 0.6rem'>下列为完形填空全文，空白处已填入<strong>正确答案</strong>并高亮显示。</p>" +
            "<div class='cloze-learn-passage'>" + formatPassageHtmlParagraphs(filled) + "</div></div></div>" +
            "<div class='reading-learn-cards-col'>" +
            "<h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>各题解析 · 选项讲解</h2></div>";
          const clozeCard = wrap.querySelector(".cloze-learn-block") || wrap.querySelector(".cloze-learn-passage");
          if (clozeCard) wrapEnglishWords(clozeCard);
          const col = wrap.querySelector(".reading-learn-cards-col");
          g.details.forEach((pair) => appendLearnCard(col, pair, effectiveType, false));
          root.appendChild(wrap);
        } else {
          g.details.forEach((pair) => appendLearnCard(root, pair, effectiveType, false));
        }
      });
      return;
    }

    if (isFillBlankQuizType(effectiveType) && details.length) {
      let fi = 0;
      while (fi < details.length) {
        const ins = String(details[fi].row.section_instruction || "").trim();
        let fj = fi + 1;
        while (fj < details.length && String(details[fj].row.section_instruction || "").trim() === ins) fj++;
        const slice = details.slice(fi, fj);
        if (ins) {
          const sp = splitSectionHintAndBody(ins);
          const wb = document.createElement("div");
          wb.className = "card word-bank-card";
          wb.style.marginBottom = "1rem";
          wb.innerHTML =
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            (sp.hint
              ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
              : "") +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(sp.body || ins).replace(/\n/g, "<br>") +
            "</div>";
          wrapEnglishWords(wb);
          root.appendChild(wb);
        }
        slice.forEach((pair) => appendLearnCard(root, pair, effectiveType, false));
        fi = fj;
      }
      return;
    }

    const readingLearnGroups =
      effectiveType === "reading" || isTypeCardId(t)
        ? groupDetailsByReadingPassage(details)
        : [];
    const writingLearnGroups =
      effectiveType === "writing" ? groupDetailsByWritingPassage(details) : [];
    const useReadingGroups =
      (effectiveType === "reading" || isTypeCardId(t)) &&
      readingLearnGroups.some((g) => g.passage);
    const useWritingLearnGroups =
      effectiveType === "writing" && writingLearnGroups.some((g) => g.passage);
    if (useReadingGroups) {
      readingLearnGroups.forEach((g) => {
        if (g.passage) {
          const wrap = document.createElement("div");
          wrap.className = "reading-learn-layout";
          let passInner;
          if (g.fromSection) {
            passInner =
              "<div class='card'><h2>阅读材料</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passInner =
              "<div class='card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          wrap.innerHTML =
            "<div class='reading-learn-passage'>" + passInner + "</div>" + "<div class='reading-learn-cards-col'></div>";
          const passCard = wrap.querySelector(".reading-learn-passage .card") || wrap.querySelector(".reading-passage-text");
          if (passCard) wrapEnglishWords(passCard);
          const col = wrap.querySelector(".reading-learn-cards-col");
          g.details.forEach((pair) => appendLearnCard(col, pair, effectiveType, true));
          root.appendChild(wrap);
        } else {
          g.details.forEach((pair) => appendLearnCard(root, pair, effectiveType, false));
        }
      });
    } else if (useWritingLearnGroups) {
      writingLearnGroups.forEach((g) => {
        if (g.passage) {
          const wrapW = document.createElement("div");
          wrapW.className = "reading-learn-layout";
          const writingLearnTitle =
            String((g.details[0] && g.details[0].row && g.details[0].row.section_title) || "").trim() ||
            "书面表达";
          let passInnerW;
          if (g.fromSection) {
            passInnerW =
              "<div class='card'><h2>" + esc(writingLearnTitle) + "</h2>" +
              "<div class='reading-passage-text'>" + passageHtmlFromSectionInstruction(g.passage) + "</div></div>";
          } else {
            const phw = splitReadingPassageHeading(g.passage);
            passInnerW =
              "<div class='card'><h2>" + esc(phw.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(phw.text) + "</div></div>";
          }
          wrapW.innerHTML =
            "<div class='reading-learn-passage'>" + passInnerW + "</div>" + "<div class='reading-learn-cards-col'></div>";
          const passCardW = wrapW.querySelector(".reading-learn-passage .card") || wrapW.querySelector(".reading-passage-text");
          if (passCardW) wrapEnglishWords(passCardW);
          const colW = wrapW.querySelector(".reading-learn-cards-col");
          g.details.forEach((pair) => appendLearnCard(colW, pair, effectiveType, true));
          root.appendChild(wrapW);
        } else {
          g.details.forEach((pair) => appendLearnCard(root, pair, effectiveType, false));
        }
      });
    } else {
      details.forEach((pair) => appendLearnCard(root, pair, effectiveType, false));
    }
  }

  function renderHome() {
    const title = EXAM.school_or_title || "英语试卷";
    document.getElementById("homeTitle").textContent = title;
    document.title = title;

    const types = orderedTypesList();

    let html = "";
    types.forEach((t) => {
      const rawRows = isPaperShardId(t) ? rowsForPaperShard(t) : (state.byType[t] || []);
      const eff = isPaperShardId(t) ? sectionRowsRenderKind(rawRows) : t;
      const n = isClozeLikeQuizType(eff)
        ? visibleClozeQuizRows(rawRows).length
        : rawRows.length;
      if (n === 0) return;
      html += "<div class='type-card'><h2>" + esc(typeLabel(t)) + "</h2>";
      let metaLine;
      if (isTypeCardId(t)) {
        const idx = parseTypeCardIndex(t);
        const cards = getTypeCards();
        const spec = cards && cards[idx];
        const rng = spec && String(spec.range_text || "").trim();
        metaLine = (rng ? rng + " · " : "") + "共 " + n + " 道题 · 计时答题后可看讲解";
      } else if (isSectionShardId(t)) {
        const si = parseSectionShardIndex(t);
        const ov = getSectionCardOverride(si);
        const rng = (ov && String(ov.range_text || "").trim()) || sectionGlobalQuestionRangeLabel(si);
        metaLine = (rng ? rng + " · " : "") + "共 " + n + " 道题 · 计时答题后可看讲解";
      } else {
        metaLine = "共 " + n + " 道题 · 计时答题后可看讲解";
      }
      html += "<div class='meta'>" + esc(metaLine) + "</div>";
      html += "<button type='button' class='btn primary btn-pick-type' data-type='" + esc(t) + "'>开始该题型</button></div>";
    });
    document.getElementById("typeGrid").innerHTML = html;
    document.querySelectorAll(".btn-pick-type").forEach((b) => {
      b.addEventListener("click", () => {
        state.currentType = b.getAttribute("data-type");
        showView("quiz");
        renderQuiz();
      });
    });
  }

  window.addEventListener("afterprint", () => {
    document.documentElement.classList.remove("pdf-printing");
    const ph = document.getElementById("printHost");
    if (ph) ph.innerHTML = "";
    if (pdfPrintTitleRestore != null) {
      document.title = pdfPrintTitleRestore;
      pdfPrintTitleRestore = null;
    }
  });

  document.getElementById("btnPdfFull").addEventListener("click", () => {
    const types = orderedTypesList();
    if (!types.length) {
      alert("暂无题目。");
      return;
    }
    runPrintPdf(types);
  });

  document.getElementById("btnPdfType").addEventListener("click", () => {
    const t = state.currentType;
    const rows = isPaperShardId(t) ? rowsForPaperShard(t) : (state.byType[t] || []);
    if (!t || !rows.length) {
      alert("当前大题无题目。");
      return;
    }
    runPrintPdf([t]);
  });

  document.getElementById("btnBackHome").addEventListener("click", () => {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    showView("home");
  });
  document.getElementById("btnBackHome2").addEventListener("click", () => showView("home"));
  document.getElementById("btnBackHome3").addEventListener("click", () => showView("home"));

  document.getElementById("btnSubmitType").addEventListener("click", () => {
    const t = state.currentType;
    if (!t) return;
    if (!confirm("确定提交本题块？提交后可查看结果与讲解。")) return;
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    state.answers[t] = collectTypeAnswers();
    renderResult();
    showView("result");
  });

  document.getElementById("btnGoLearn").addEventListener("click", () => {
    renderLearn();
    showView("learn");
  });

  const modalEl = document.getElementById("modal");
  document.getElementById("modalClose").addEventListener("click", () => {
    modalEl.classList.remove("open");
  });
  modalEl.addEventListener("click", (ev) => {
    if (ev.target === modalEl) modalEl.classList.remove("open");
  });

  document.getElementById("modalTtsWord").addEventListener("click", () => {
    if (modalWordForTts) playTts(modalWordForTts);
    else alert("请先点击题干或选项中的英文词");
  });

  buildFlat();
  renderHome();
  </script>
</body>
</html>
