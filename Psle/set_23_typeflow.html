<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .reading-sentence-bank-unit { margin-bottom: 1.5rem; }
    .reading-sentence-bank-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-passage-wrap .cloze-passage-text {
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 0;
    }
    .reading-sentence-bank-options-below { margin-top: 1.15rem; }
    .reading-sentence-bank-qhead {
      font-weight: 700;
      font-size: 1.08rem;
      margin: 0 0 0.5rem;
      color: var(--ink);
    }
    .reading-sentence-bank-opt-block { margin-bottom: 0.85rem; }
    .reading-sentence-bank-opts-grid {
      display: flex !important;
      flex-direction: column !important;
      flex-wrap: nowrap !important;
      align-items: stretch !important;
      gap: 0.4rem 0;
      grid-template-columns: unset !important;
      margin: 0 !important;
    }
    .reading-sentence-bank-opts-grid label { margin: 0; }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-passage-block .exam-para {
      margin: 0 0 0.55em;
      text-indent: 2em;
    }
    .exam-passage-block .exam-para:first-child { margin-top: 0; }
    .exam-passage-block .exam-para:last-child { margin-bottom: 0; }
    .exam-word-bank {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px dashed #000;
      font-size: 10.5pt;
      line-height: 1.6;
      break-inside: auto;
      page-break-inside: auto;
    }
    .exam-passage-block .exam-cloze-inline-pdf {
      margin: 0;
    }
    .exam-passage-block .exam-cloze-inline-pdf .exam-para:last-child {
      margin-bottom: 0;
    }
    .exam-reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      line-height: 1.45;
      margin: 2mm 0 4mm;
    }
    .exam-reading-fill-table th,
    .exam-reading-fill-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
    }
    .exam-reading-fill-table thead th {
      font-weight: 700;
      background: #eee;
      text-align: left;
    }
    .exam-reading-unit {
      margin-bottom: 4mm;
      break-inside: auto;
      page-break-inside: auto;
    }
    /* 同一题型内：每道小题（题干+选项）尽量不跨页 */
    .exam-item {
      margin: 0 0 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item .exam-item-row,
    .exam-item .exam-opts-row {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-item-row {
      display: block;
      margin: 0;
    }
    .exam-n {
      font-weight: 700;
      margin-right: 0.35em;
    }
    .exam-paren { letter-spacing: 0.2em; margin-right: 0.25em; }
    .exam-blank {
      border-bottom: 1px solid #000;
      padding: 0 1.2em;
      margin: 0 0.15em;
    }
    /* 阅读/单选等：默认 2×2；按选项数单列等分对齐 */
    .exam-opts-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 1.5em;
      row-gap: 0.3em;
      margin: 1mm 0 0 2.2em;
      font-size: 10.5pt;
      align-items: start;
    }
    .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(11em, 1fr));
    }
    /* 阅读理解 PDF：选项纵向排列，字母与正文对齐，避免三列过窄、英文被拆字换行 */
    .exam-item-reading .exam-opts-row {
      display: block;
      margin: 1.5mm 0 0 2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-cols-2,
    .exam-item-reading .exam-opts-row.exam-opts-cols-3,
    .exam-item-reading .exam-opts-row.exam-opts-cols-4 {
      display: block;
    }
    .exam-item-reading .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.55em;
      padding: 0;
      line-height: 1.5;
      text-align: left;
      min-width: 0;
    }
    .exam-item-reading .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    .exam-item-reading .exam-opt-chip b {
      margin-right: 0;
      font-weight: 700;
    }
    /* 阅读判断 PDF：与网页一致，横向 T / F */
    .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35em 0.65em;
      margin: 1mm 0 0 2.2em;
    }
    .exam-item-reading .exam-opts-row.exam-opts-tf-pair {
      display: flex;
      margin: 1.5mm 0 0 2em;
    }
    .exam-opts-tf-pair .exam-tf-choice {
      font-weight: 700;
      font-size: 11pt;
      min-width: 1.1em;
      text-align: center;
    }
    .exam-opts-tf-pair .exam-tf-slash {
      color: #444;
      font-weight: 600;
      padding: 0 0.2em;
    }
    .exam-reading-sentence-bank-questions {
      margin-top: 4mm;
    }
    .exam-reading-sentence-bank-qnum {
      font-weight: 700;
      font-size: 11pt;
      margin: 0 0 1.5mm;
    }
    .exam-reading-sentence-bank-item {
      margin-bottom: 3.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-reading-sentence-bank-item .exam-opts-row {
      display: block;
      margin: 0 0 0 1.5em;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip {
      display: grid;
      grid-template-columns: 1.65em minmax(0, 1fr);
      column-gap: 0.45em;
      align-items: start;
      margin: 0 0 0.45em;
      line-height: 1.45;
      text-align: left;
    }
    .exam-reading-sentence-bank-item .exam-opt-chip:last-child {
      margin-bottom: 0;
    }
    /* 补全对话 PDF：题干已在左侧对话中，不重复「51.（ ）」等题目行，仅题号 + 方框选项 */
    .exam-item-cloze.exam-cloze-dialogue-gap {
      display: block;
    }
    .exam-cloze-dialogue-gap {
      margin: 0.55em 0 0.65em;
    }
    .exam-cloze-dialogue-gap .exam-dialogue-gap-num {
      display: block;
      font-weight: 700;
      margin: 0 0 0.35em 0.15em;
      font-size: 11pt;
    }
    /* 完形 PDF：题号与 A–D 同一行横向排列 */
    .exam-item-cloze {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 1em;
      row-gap: 0.6mm;
    }
    .exam-item-cloze .exam-item-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2em 0.45em;
    }
    .exam-item-cloze .exam-opts-row {
      display: grid;
      column-gap: 0.85em;
      row-gap: 0.2em;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
      margin: 0;
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .exam-item-cloze .exam-opts-row.exam-opts-bank {
      grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr));
    }
    /* 完形 PDF：整卷表格，题号与 A/B/C 同一行；各题 A 列、B 列、C 列分别左对齐 */
    .exam-cloze-pdf-grid {
      display: grid;
      grid-template-columns: minmax(2.85em, auto) repeat(3, minmax(0, 1fr));
      column-gap: 0.75em;
      row-gap: 0.5em;
      margin: 0.55em 0 0.85em;
      align-items: start;
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-4opt {
      grid-template-columns: minmax(2.85em, auto) repeat(4, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-5opt {
      grid-template-columns: minmax(2.85em, auto) repeat(5, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-6opt {
      grid-template-columns: minmax(2.85em, auto) repeat(6, minmax(0, 1fr));
    }
    .exam-cloze-pdf-grid.exam-cloze-pdf-grid-7opt {
      grid-template-columns: minmax(2.85em, auto) repeat(7, minmax(0, 1fr));
    }
    .exam-cloze-pdf-num {
      text-align: left;
      white-space: nowrap;
      font-weight: 600;
    }
    .exam-cloze-pdf-num .exam-n {
      font-weight: 700;
    }
    .exam-cloze-pdf-opt {
      text-align: left;
      min-width: 0;
      line-height: 1.45;
    }
    .exam-cloze-pdf-opt b {
      font-weight: 700;
      margin-right: 0.25em;
    }
    .exam-cloze-pdf-opt-empty {
      visibility: hidden;
      pointer-events: none;
      min-height: 1em;
    }
    .exam-item-cloze .exam-cloze-pdf-grid {
      flex: 1 1 100%;
      width: 100%;
    }
    .exam-item-cloze .exam-opt-chip {
      display: block;
      min-width: 0;
    }
    .exam-opt-chip {
      min-width: 0;
    }
    .exam-paper-doc .phonetic-ul,
    #printHost .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.12em;
      text-decoration-thickness: 0.08em;
      font-weight: 600;
    }
    .exam-opt-chip b { margin-right: 0.25em; }
    .exam-item-cloze .exam-opt-chip b {
      display: inline-block;
      min-width: 1.15em;
      margin-right: 0.2em;
    }
    .exam-answer-lines {
      min-height: 14em;
      margin-top: 2mm;
      border: 1px solid #333;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.45em,
        #ddd 1.45em,
        #ddd calc(1.45em + 1px)
      );
    }
    /* 句型转换、词汇填空等书写题：与客观题区分的标准卷面条目 + 作答横线区 */
    .exam-item-written {
      padding: 0 0 1mm 0;
    }
    .exam-item-written .exam-item-row {
      line-height: 1.55;
      font-size: 10.5pt;
      text-align: justify;
    }
    .exam-written-lines {
      min-height: 4.2em;
      margin: 1.5mm 0 0 0;
      border: 1px solid #222;
      background: repeating-linear-gradient(
        transparent,
        transparent 1.38em,
        #e0e0e0 1.38em,
        #e0e0e0 calc(1.38em + 0.55px)
      );
    }
    .exam-paper-doc .exam-writing-stem-wrap {
      margin: 1.5mm 0 0;
      font-size: 10.5pt;
      line-height: 1.5;
      color: #000;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table,
    #printHost .writing-prompt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5pt;
      color: #000;
      background: #fff;
      margin: 1mm 0;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table th,
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table td,
    #printHost .writing-prompt-table th,
    #printHost .writing-prompt-table td {
      border: 1px solid #222;
      padding: 2mm 2.5mm;
      vertical-align: top;
      text-align: left;
    }
    .exam-paper-doc .exam-writing-stem-wrap .writing-prompt-table thead th,
    #printHost .writing-prompt-table thead th {
      background: #eee;
      font-weight: 700;
    }
    .exam-reading-fill-table td.exam-table-stem-cell {
      font-size: 10.5pt;
      line-height: 1.5;
    }
    @media print {
      @page { size: A4; margin: 12mm 14mm; }
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      html.pdf-printing body {
        margin: 0 !important;
        padding: 0 !important;
      }
      html.pdf-printing #printHost {
        clip: auto !important;
      }
      .exam-paper-section:not(:first-of-type) {
        break-before: page !important;
        page-break-before: always !important;
      }
      .exam-passage-titled-wrap {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      /* 完形填空：PDF 不显示答题括号与题干下划线占位 */
      .exam-item-cloze .exam-paren,
      .exam-item-cloze .exam-blank,
      .exam-cloze-pdf-num .exam-paren {
        display: none !important;
      }
    }
  </style>

<body>
  <div id="view-home" class="view active">
    <header class="flow" style="position:relative;margin:0 0 1rem;border-radius:0 0 12px 12px;">
      <h1 id="homeTitle">按题型练习</h1>
      <button type="button" class="btn secondary" id="btnPdfFull" title="按标准纸笔试卷版式排版，打印对话框中选「另存为 PDF」">导出 PDF（整套·标准试卷版式）</button>
    </header>
    <p class="breadcrumb">先选择一种题型，完成该题型全部题目后提交，再进入讲解与苏格拉底引导。</p>
    <div class="type-grid" id="typeGrid"></div>
  </div>

  <div id="view-quiz" class="view">
    <header class="flow">
      <h1 id="quizTitle">答题</h1>
      <span class="timer" id="quizTimer">用时 00:00</span>
      <button type="button" class="btn secondary" id="btnPdfType" title="仅导出当前题型，标准试卷版式">导出 PDF（本题型·标准版式）</button>
      <button type="button" class="btn secondary" id="btnBackHome">← 题型首页</button>
    </header>
    <div class="breadcrumb" id="quizBreadcrumb"></div>
    <div id="quizIntro"></div>
    <div id="quizBody"></div>
    <div style="margin-top:1.5rem;text-align:center;">
      <button type="button" class="btn primary" id="btnSubmitType">提交本题型</button>
    </div>
  </div>

  <div id="view-result" class="view">
    <header class="flow">
      <h1 id="resultTitle">本题型结果</h1>
      <button type="button" class="btn secondary" id="btnBackHome2">← 题型首页</button>
    </header>
    <div class="card" id="resultSummary"></div>
    <div style="text-align:center;margin:1rem 0;">
      <button type="button" class="btn primary" id="btnGoLearn">进入本题型讲解</button>
    </div>
  </div>

  <div id="view-learn" class="view">
    <header class="flow">
      <h1 id="learnTitle">讲解与学习</h1>
      <button type="button" class="btn secondary" id="btnBackHome3">← 题型首页</button>
    </header>

    <div id="learnBody"></div>
  </div>

  <div id="printHost" aria-hidden="true"></div>

  <div id="modal" aria-hidden="true">
    <div class="box">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.35rem;">

        <button type="button" class="btn primary" id="modalTtsWord">朗读本词</button>
      </div>
      <p id="modalBody" style="white-space:pre-wrap;margin:0.5rem 0;"></p>
      <button type="button" class="btn secondary" id="modalClose">关闭</button>

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第23套","exam_meta":{"full_score_text":"满分60分","time_text":"时间：30分钟","type_cards":[{"sections":[0],"title":"1. 语音选择题","range_text":"第1–5题"},{"sections":[1],"title":"2. 词汇选择题","range_text":"第6–10题"},{"sections":[2],"title":"3. 完形填空","range_text":"第11–20题"},{"sections":[3],"title":"4. 阅读理解","range_text":"第21–35题"},{"sections":[4],"title":"5. 汉译英","range_text":"第36–40题"}]},"sections":[{"section_title":"I. 语音选择题。(共5分)","section_instruction":"选择画线部分读音不同的选项。","items":[{"number":"1","item_type":"phonetics","context_note":"","stem":"( )","options":{"A":"t\u003cu>a\u003c/u>xi","B":"h\u003cu>a\u003c/u>ppy","C":"gr\u003cu>a\u003c/u>ss","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查字母 a 在单词中的发音。\n- A 选项 `taxi` /'tæksi/ 中，划线字母 a 发短元音 /æ/。\n- B 选项 `happy` /'hæpi/ 中，划线字母 a 发短元音 /æ/。\n- C 选项 `grass` /grɑːs/ 中，划线字母 a 发长元音 /ɑː/。\n- A、B两项发音相同，C项发音不同，故选C。","knowledge_expansion_md":"#### 字母 a 的常见发音规律\n1.  **/æ/**：在重读闭音节中。例如：`cat`, `bag`, `map`, `apple`。\n2.  **/eɪ/**：在重读开音节或“元音+辅音+e”结构中。例如：`name`, `cake`, `paper`, `late`。\n3.  **/ɑː/**：在字母 `r` 前，或在部分辅音字母（如 `s`, `f`, `th`）前。例如：`car`, `father`, `class`, `ask`。\n4.  **/ɔː/**：在字母组合 `all`, `al`, `au` 中。例如：`ball`, `talk`, `autumn`。\n5.  **/ə/**：在非重读音节中。例如：`about`, `banana`, `China`。\n\n**易错点**：`grass` 一词存在英美发音差异，美式发音为 /græs/，英式发音为 /grɑːs/。在小升初语音题中，通常会选取其最具辨识度的英式发音 /ɑː/ 作为考点，与 /æ/ 形成对比。","socratic_tracks":[{"title":"字母 a 的发音规则","steps":[{"question":"这三个单词中划线部分都是字母'a'，你先分别读读看，感觉哪个读音不太一样？","hint":"试着夸张地读出每个单词，注意嘴巴的形状。","takeaway":"通过朗读，我们可以初步感知到 `grass` 的发音可能与众不同。"},{"question":"我们来分析一下 `taxi` 和 `happy` 中的 'a'。它们都发什么音？你还能想到其他发这个音的单词吗？","hint":"想想 `cat`, `bag`, `apple` 这些词。","takeaway":"在重读闭音节中，字母'a'通常发短元音 /æ/。"},{"question":"现在看 `grass`。它的发音 /grɑːs/ 和 /æ/ 有什么区别？这种发音在什么情况下常见？","hint":"对比 `cat` /kæt/ 和 `car` /kɑːr/ 的发音。","takeaway":"字母'a'在特定辅音（如s, f, th）前，有时会发长元音 /ɑː/。"}]},{"title":"辨音题解题技巧","steps":[{"question":"做语音题时，如果遇到不确定的单词，第一步应该做什么？","hint":"是蒙一个答案，还是有更好的方法？","takeaway":"首先要利用已知的、确定的单词发音作为参照。"},{"question":"在这道题里，`taxi` 和 `happy` 哪个单词你更熟悉？它们的发音是相同的吗？","hint":"这两个都是小学阶段非常高频的词汇。","takeaway":"通过比较两个确定项，可以锁定一个基准发音 /æ/。"},{"question":"既然已经确定了 A 和 B 的发音相同，那么这道题的答案会是什么？","hint":"这是一道单选题，要求选出“不同”的一项。","takeaway":"在三选一的辨音题中，一旦确定有两个选项发音相同，那么剩下的那个就是答案。"}]},{"title":"英美发音差异","steps":[{"question":"你是否知道 `grass` 这个词在英语中可能有不止一种读法？","hint":"想想看，你在不同的电影或歌曲里听到的发音一样吗？","takeaway":"英语存在英式发音和美式发音的差异。"},{"question":"美式英语中 `grass` 的 'a' 发 /æ/，和 `happy` 一样。而英式英语中发 /ɑː/。那为什么这道题还能选出 C 呢？","hint":"想一想考试出题的目的。是为了考查偏僻的知识，还是基础的核心区别？","takeaway":"在小升初考试中，通常会考察最典型、最具区分度的发音规则，/æ/ 和 /ɑː/ 的对立是经典考点。"}]}]}},{"number":"2","item_type":"phonetics","context_note":"","stem":"( )","options":{"A":"p\u003cu>u\u003c/u>zzle","B":"p\u003cu>u\u003c/u>pil","C":"st\u003cu>u\u003c/u>dy","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查字母 u 在单词中的发音。\n- A 选项 `puzzle` /'pʌzl/ 中，划线字母 u 发短元音 /ʌ/。\n- B 选项 `pupil` /'pjuːpl/ 中，划线字母 u 发其字母音 /juː/。\n- C 选项 `study` /'stʌdi/ 中，划线字母 u 发短元音 /ʌ/。\n- A、C两项发音相同，B项发音不同，故选B。","knowledge_expansion_md":"#### 字母 u 的常见发音规律\n1.  **/ʌ/**：在重读闭音节中。例如：`cup`, `run`, `bus`, `study`。\n2.  **/juː/**：在重读开音节或“元音+辅音+e”结构中。例如：`use`, `cute`, `music`, `pupil`。\n3.  **/uː/**：在部分开音节中，尤其是在 `r`, `l`, `j` 等字母后。例如：`rule`, `blue`, `June`。\n4.  **/ʊ/**：在少数单词中，通常在 `p`, `b`, `f` 后，且音节以 `ll` 或 `sh` 结尾。例如：`put`, `full`, `push`。\n\n**核心规律**：判断元音字母是处于**开音节**还是**闭音节**，是掌握其发音规律的关键。开音节中元音常发长音（字母音），闭音节中元音常发短音。","socratic_tracks":[{"title":"字母 u 的发音规则","steps":[{"question":"我们先来读一下 `puzzle` 和 `study` 这两个词，注意听划线字母 'u' 的发音，你觉得它们像不像？","hint":"想想 `cup` 和 `bus` 里面的 'u' 是怎么读的。","takeaway":"在重读闭音节中，字母'u'通常发短元音 /ʌ/。"},{"question":"现在我们来读 `pupil`，它的 'u' 发音和前两个一样吗？","hint":"试着读出 `use` 或者 `music`，感受一下 'u' 的发音。","takeaway":"在 `pupil` 中，字母 'u' 发的是它在字母表中的读音 /juː/。"},{"question":"为什么 `puzzle` 和 `pupil` 中 'u' 的发音会不同呢？观察一下 'u' 所在的音节是开音节还是闭音节。","hint":"以元音字母结尾的音节是开音节，以辅音字母结尾的是闭音节。","takeaway":"字母'u'在重读开音节中常发 /juː/，而在重读闭音节中常发 /ʌ/。"}]},{"title":"开音节与闭音节","steps":[{"question":"你知道什么是闭音节吗？看看 `puzzle` 和 `study` 的音节划分，'u' 所在的音节有什么特点？","hint":"闭音节通常是“辅音+元音+辅音”的结构。","takeaway":"`puzzle` (/'pʌz.l/) 和 `study` (/'stʌ.di/) 中的 'u' 都在重读闭音节中，所以发 /ʌ/。"},{"question":"那什么是开音节呢？看看 `pupil` 的音节划分 /'pjuː.pəl/，第一个音节有什么特点？","hint":"开音节通常以元音字母结尾。","takeaway":"`pupil` 中的 'u' 在重读开音节中，所以发其字母音 /juː/。"},{"question":"所以，判断元音字母发长音还是短音，有一个重要依据是什么？","hint":"是看它在单词里的位置吗？","takeaway":"判断元音字母处于开音节还是闭音节，是掌握其发音规律的关键一步。"}]},{"title":"归类排除法","steps":[{"question":"面对这三个单词，有没有你特别熟悉的？比如 `study`？","hint":"这是一个从三年级就开始学的单词。","takeaway":"从最熟悉的单词入手，可以建立一个可靠的参照标准。"},{"question":"`study` 里的 'u' 发 /ʌ/。现在我们看 `puzzle`，你觉得它的发音和 `study` 里的 'u' 更像，还是和 `pupil` 里的 'u' 更像？","hint":"可以试着把 /ʌ/ 的音套进 `puzzle` 读一下，再把 /juː/ 的音套进去读一下，看哪个更顺口。","takeaway":"通过与已知单词进行类比，可以有效地判断未知单词的发音。"},{"question":"既然我们确定了 `puzzle` 和 `study` 的 'u' 发音相同，那么这道题的答案是什么？","hint":"题目要求选出“不同”的一项。","takeaway":"在语音辨析题中，成功找出两个相同的选项，就等于找到了正确答案。"}]}]}},{"number":"3","item_type":"phonetics","context_note":"","stem":"( )","options":{"A":"l\u003cu>e\u003c/u>sson","B":"l\u003cu>a\u003c/u>te","C":"l\u003cu>e\u003c/u>ft","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查元音音素的辨析。虽然B选项划线字母与A、C不同，但比较的仍然是它们的发音。\n- A 选项 `lesson` /'lesn/ 中，划线字母 e 发短元音 /e/。\n- B 选项 `late` /leɪt/ 中，划线字母 a 发双元音 /eɪ/。\n- C 选项 `left` /left/ 中，划线字母 e 发短元音 /e/。\n- A、C两项的元音发音相同，均为 /e/，而B项发音为 /eɪ/，与之不同，故选B。","knowledge_expansion_md":"#### 核心考点：短元音 /e/ vs. 双元音 /eɪ/\n1.  **/e/**：通常由字母 `e` 在重读闭音节中发出。例如：`bed`, `red`, `get`, `pen`, `lesson`。\n2.  **/eɪ/**：发音方式多样：\n    *   字母 `a` 在“a+辅音+e”结构中：`cake`, `name`, `late`。\n    *   字母组合 `ai`：`rain`, `wait`, `afraid`。\n    *   字母组合 `ay`：`day`, `say`, `play`。\n\n**解题关键**：语音题的核心是辨别**音素（sound）**，而不是**字母（letter）**。即使划线字母不同，只要发音相同，就属于同一类。本题通过不同字母设置干扰，旨在考查学生是否能“透过字母看发音”。","socratic_tracks":[{"title":"短元音 /e/ vs. 双元音 /eɪ/","steps":[{"question":"我们先读 A 选项 `lesson` 和 C 选项 `left`，听听划线字母 'e' 的发音，是不是一样的？","hint":"想想 `bed`, `egg` 这些词里的 'e'。","takeaway":"在 `lesson` 和 `left` 中，字母 'e' 都发短元音 /e/。"},{"question":"现在读 B 选项 `late`，注意划线字母 'a' 的发音。这个音和刚才的 /e/ 一样吗？","hint":"试着读 `cake`, `name`，感受一下 'a' 的发音。","takeaway":"在 `late` 中，字母 'a' 发的是双元音 /eɪ/。"},{"question":"对比一下 /e/ 和 /eɪ/，你能描述一下它们发音时口型和舌位的变化吗？","hint":"/e/ 的口型是基本不变的，而 /eɪ/ 是从 /e/ 滑向 /ɪ/ 的。","takeaway":"区分单元音和双元音是语音学习的重要一环，关键在于感受发音过程中口型是否变化。"}]},{"title":"关注发音，而非字母","steps":[{"question":"看到这道题，你有没有发现 B 选项和其他两个有什么不一样？","hint":"A和C划线的是字母'e'，B划线的是字母'a'。","takeaway":"出题者有时会通过改变划线字母来设置干扰项。"},{"question":"既然字母不一样，那我们应该比较什么呢？是比较字母本身，还是比较它们发出的声音？","hint":"语音题，顾名思义，是考察声音的。","takeaway":"语音题的核心是辨别音素（sound），而不是字母（letter）。"},{"question":"所以，即使 B 选项的字母是 'a'，我们也要把它读出来，和 A、C 的发音进行比较，找出那个声音不同的选项，对吗？","hint":"是的，要比较的是 /e/ 和 /eɪ/ 这两个声音。","takeaway":"做语音题时，必须“透过字母看发音”，才能避免被表面形式迷惑。"}]},{"title":"自然拼读规则应用","steps":[{"question":"观察 `lesson` 和 `left`，划线的 'e' 所在的音节有什么共同点？","hint":"它们都是“元音+辅音”结尾的，比如 `les` 和 `left`。","takeaway":"在重读闭音节中，字母 'e' 通常发短元音 /e/。"},{"question":"再看 `late`，这个单词的结构有什么特点？","hint":"它以 'e' 结尾，但这个 'e' 不发音。","takeaway":"这是典型的“a-e”结构，即神奇的 'magic e'，它让前面的元音字母 'a' 发字母本身的音 /eɪ/。"},{"question":"所以，我们可以根据什么来预测元音字母的发音？","hint":"根据单词的音节结构，是开音节还是闭音节，或者有没有特殊的字母组合。","takeaway":"掌握基本的自然拼读规则，如开闭音节和 'magic e'，能帮助我们准确判断大多数单词的发音。"}]}]}},{"number":"4","item_type":"phonetics","context_note":"","stem":"( )","options":{"A":"id\u003cu>ea\u003c/u>","B":"t\u003cu>ea\u003c/u>cher","C":"r\u003cu>ea\u003c/u>ding","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查字母组合 ea 的不同发音。\n- A 选项 `idea` /aɪ'dɪə/ 中，字母组合 ea 发双元音 /ɪə/。\n- B 选项 `teacher` /'tiːtʃə(r)/ 中，字母组合 ea 发长元音 /iː/。\n- C 选项 `reading` /'riːdɪŋ/ 中，字母组合 ea 发长元音 /iː/。\n- B、C两项发音相同，A项发音不同，故选A。","knowledge_expansion_md":"#### 字母组合 `ea` 的常见发音\n字母组合 `ea` 的发音较为复杂，需要重点记忆。\n1.  **/iː/**（最常见）：`tea`, `sea`, `read`, `meat`, `leave`, `teacher`。\n2.  **/e/**：`head`, `bread`, `ready`, `weather`, `heavy`。\n3.  **/eɪ/**（少数）：`great`, `break`, `steak`。\n4.  **/ɪə/**（较少，常在词尾或r前）：`idea`, `real`, `dear`, `hear`。\n\n**记忆技巧**：可以编成顺口溜帮助记忆，例如：“`ea` 发 /iː/ 是主力，`head` `bread` 发 /e/ 很淘气，`great` `break` 发 /eɪ/ 真稀奇，`idea` `real` 发 /ɪə/ 要牢记。”","socratic_tracks":[{"title":"字母组合 ea 的发音","steps":[{"question":"我们先看 B 选项 `teacher` 和 C 选项 `reading`，这两个词里的 'ea' 发音一样吗？","hint":"想想 `eat`, `tea`, `sea` 这些词，'ea' 是怎么发音的？","takeaway":"在 `teacher` 和 `reading` 中，字母组合 'ea' 都发长元音 /iː/，这是 'ea' 最常见的发音。"},{"question":"现在我们来看 A 选项 `idea`。你读一下这个词，感觉 'ea' 的发音和刚才的 /iː/ 一样吗？","hint":"注意这个词的重音在第二个音节 /aɪ'dɪə/。","takeaway":"在 `idea` 中，'ea' 发的是双元音 /ɪə/。"},{"question":"除了 /iː/ 和 /ɪə/，你还知道 'ea' 有其他发音吗？比如在 `bread` 或 `great` 里？","hint":"`bread` 里的 'ea' 发 /e/，`great` 里的 'ea' 发 /eɪ/。","takeaway":"字母组合 'ea' 的发音比较多变，需要通过多读多记来掌握规律和特例。"}]},{"title":"辨音技巧：找同类，识特例","steps":[{"question":"做这道题时，`teacher` 和 `reading` 是不是我们非常熟悉的单词？","hint":"是的，这两个词在课本里经常出现。","takeaway":"从熟悉的单词入手，可以快速确定一个基准发音。"},{"question":"既然 `teacher` 和 `reading` 中的 'ea' 都发 /iː/，那么这道题的答案范围就缩小了，对吗？","hint":"是的，答案肯定不是 B 或 C，因为题目要求选“不同”的。","takeaway":"在三选一的辨音题中，确定两个选项发音相同，剩下的一个就是答案。"},{"question":"所以，即使我们不完全确定 `idea` 的发音，通过排除法也能选出正确答案 A。这个方法在考试中是不是很实用？","hint":"是的，可以节省时间，提高正确率。","takeaway":"排除法是应对选择题，尤其是语音和语法选择题的有效策略。"}]},{"title":"音节与重音的影响","steps":[{"question":"我们来给这三个单词划分音节并找到重音：`teacher`, `reading`, `idea`。","hint":"`tea-cher` (重音在前), `read-ing` (重音在前), `i-de-a` (重音在中间)。","takeaway":"单词的音节和重音位置会影响元音的发音。"},{"question":"在 `teacher` 和 `reading` 中，'ea' 都在重读音节里。在 `idea` 中，'ea' 所在的音节是重读音节吗？","hint":"不是，`idea` /aɪ'dɪə/ 的重音在 'de' 上，'ea' 所在的音节 /dɪə/ 是非重读音节。","takeaway":"虽然 'ea' 在 `idea` 的末尾音节，但它的发音 /ɪə/ 确实很特殊，与它在单词中的位置有关。"},{"question":"这个例子告诉我们，在分析发音时，除了字母组合本身，还应该注意什么？","hint":"还要注意它在单词的哪个音节，以及这个音节是否重读。","takeaway":"单词的重音位置是决定元音字母发音质量的关键因素之一。"}]}]}},{"number":"5","item_type":"phonetics","context_note":"","stem":"( )","options":{"A":"angr\u003cu>y\u003c/u>","B":"ferr\u003cu>y\u003c/u>","C":"b\u003cu>y\u003c/u>","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查字母 `y` 在单词中的发音规律。题目要求找出划线部分读音不同的单词。\n- A 选项 `angry` /'æŋɡri/，`y` 在多音节单词词尾，发 /i/ 音。\n- B 选项 `ferry` /'feri/，`y` 同样在多音节单词词尾，发 /i/ 音。\n- C 选项 `by` /baɪ/，`y` 在单音节词中，发 /aɪ/ 音。\n因此，C 选项的发音与 A、B 不同。","knowledge_expansion_md":"字母 `y` 的发音规律总结：\n1.  **作元音时**：\n    *   在多音节单词的非重读词尾，通常发 /ɪ/ 或 /i/，如 `happy`, `city`, `study`。\n    *   在单音节词词尾或重读音节中，通常发 /aɪ/，如 `my`, `fly`, `try`, `reply`。\n    *   在单词中间，常发 /ɪ/，如 `gym`, `system`, `symbol`。\n2.  **作辅音时**：\n    *   在单词或音节的开头，发 /j/，如 `yes`, `yellow`, `year`, `beyond`。\n\n掌握这些规律，有助于快速判断 `y` 在不同单词中的发音。","socratic_tracks":[{"title":"y 在词尾的发音规律","steps":[{"question":"请分别读出 A 选项 `angry` 和 B 选项 `ferry`，注意听它们结尾 'y' 的发音。你觉得这个发音和哪个我们熟悉的元音相似？","hint":"试着和单词 `see` /siː/ 或者 `it` /ɪt/ 比较一下。","takeaway":"在多音节单词的词尾，字母 'y' 通常发 /i/ 或 /ɪ/ 音。"},{"question":"现在，再读一下 C 选项的单词 `by`。它的发音和 A、B 选项的结尾音有什么不同？","hint":"它的发音和单词 `my` 或 `fly` 是一样的，听起来像“拜”。","takeaway":"在单音节词中，字母 'y' 通常发双元音 /aɪ/。"},{"question":"既然我们知道了 'y' 在单音节词和多音节词词尾的发音规律不同，那么这道题的答案是哪个？","hint":"题目要求选出读音“不同”的一项。","takeaway":"通过识别 'y' 在单音节词和多音节词词尾的不同发音规律，可以准确找出读音不同的单词 `by`。"}]},{"title":"字母 y 的多重身份","steps":[{"question":"除了作元音，字母 'y' 还可以发什么音？试着读一下 `yes` 和 `yellow` 这两个词。","hint":"在这两个词里，'y' 都在单词的开头。","takeaway":"字母 'y' 在词首时通常作为辅音，发 /j/ 的音。"},{"question":"我们再看几个单词：`gym`, `system`。这里的 'y' 在单词中间，它发什么音？","hint":"它的发音和 `sit` 里面的 'i' 很像。","takeaway":"在单词中间，'y' 常常发短元音 /ɪ/。"}]},{"title":"归纳排除解题法","steps":[{"question":"当遇到不确定的语音题时，可以先从你最熟悉的单词开始。A, B, C 三个选项中，哪个单词你最有把握读对？","hint":"像 `by` 这样的介词非常常用，我们很早就学过。","takeaway":"从最熟悉、最有把握的选项入手是解题的有效策略。"},{"question":"假设你确定 `by` 读作 /baɪ/。现在观察 `angry` 和 `ferry`，它们在结构上有什么共同点？","hint":"它们都是两个音节，并且 'y' 都在词尾。","takeaway":"结构相似的单词，其发音往往也遵循相同的规律。"},{"question":"既然 `angry` 和 `ferry` 很有可能读音相同，而 `by` 的读音 /aɪ/ 又很特别，那么答案最可能是哪一个？","hint":"题目要求选出读音“不同”的一项。","takeaway":"通过比较和归类，即使不完全确定每个单词的读音，也能通过排除法大大提高正确率。"}]}]}}]},{"section_title":"II. 词汇选择题。(共5分)","section_instruction":"读单词，选出每组中单词不同类的一项。","items":[{"number":"6","item_type":"choice","context_note":"","stem":"( )","options":{"A":"bicycle","B":"postcard","C":"letter","D":"often"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查词性辨析。题目给出的四个选项需要找出一个与其他三个不同类的词。\n- A 选项 `bicycle`（自行车）是名词。\n- B 选项 `postcard`（明信片）是名词。\n- C 选项 `letter`（信）是名词。\n- D 选项 `often`（经常）是表示频率的副词。\n\nA、B、C 三个词都是名词，指代具体事物，而 D 是副词，用来修饰动作发生的频率。因此，D 选项是不同类的词。","knowledge_expansion_md":"### 词性分类 (Parts of Speech)\n这是英语语法的基础。辨别词性是理解句子结构和词语用法的关键。\n- **名词 (Noun)**: 表示人、事、物、地点或概念的词。例如 `bicycle`, `postcard`, `letter`。\n- **副词 (Adverb)**: 修饰动词、形容词、其他副词或整个句子，说明时间、地点、程度、方式等。`often` 属于频率副词。\n\n### 频率副词 (Adverbs of Frequency)\n频率副词表示动作发生的频繁程度，常见的有：\n- `always` (总是)\n- `usually` (通常)\n- `often` (经常)\n- `sometimes` (有时)\n- `seldom` / `rarely` (很少)\n- `never` (从不)\n它们在句中的位置通常在主要动词之前，但在 be 动词之后。例如：`He often plays football.` / `He is often late.`","socratic_tracks":[{"title":"词性辨析法","steps":[{"question":"我们尝试用这四个单词分别造一个简单的句子，看看它们在句子中做什么用？","hint":"例如：I ride a bicycle. I write a letter. I often read books.","takeaway":"通过造句可以帮助我们直观地感受单词在句子中的功能，从而判断其词性。"},{"question":"在你造的句子中，'bicycle', 'postcard', 'letter' 扮演了什么角色？它们是动作、东西还是描述？","hint":"它们都是可以触摸到的“东西”或“物品”。","takeaway":"'bicycle', 'postcard', 'letter' 都是名词，用来指代具体事物。"},{"question":"那么 'often' 呢？它在句子 \"I often read books\" 中是做什么用的？","hint":"它描述了“读书”这个动作发生的频繁程度。","takeaway":"'often' 是一个副词，用来修饰动词，表示动作的频率，因此它和另外三个名词词性不同。"}]},{"title":"概念归类法","steps":[{"question":"抛开语法，从意思上想一想，A, B, C 三个单词有什么共同点？","hint":"想想看，它们是不是都是一些具体的东西？","takeaway":"'bicycle', 'postcard', 'letter' 都是具体名词，指代我们生活中看得见、摸得着的物品。"},{"question":"那 'often' 是一个具体的东西吗？你能画出 'often' 的样子吗？","hint":"'often' 表示“经常”，它是一个关于时间频率的概念，是抽象的。","takeaway":"'often' 是一个表示频率的抽象概念，而不是一个实体物品。"},{"question":"所以，从“具体物品”和“抽象概念”这个角度来看，哪个单词是与众不同的？","hint":"哪个词不属于“物品”这一类？","takeaway":"通过将词语按“具体”和“抽象”进行分类，可以发现 'often' 是与其他三者不同类的词。"}]},{"title":"寻找语义联系","steps":[{"question":"我们来看看 B 'postcard' 和 C 'letter'。它们之间有什么关系？","hint":"它们都是可以用来邮寄、传递信息的纸制品。","takeaway":"'postcard' 和 'letter' 属于“邮件/信件”这个小类别，关系非常紧密。"},{"question":"现在加入 A 'bicycle'。它和 B、C 有什么潜在的联系吗？","hint":"邮递员可能会骑着什么送信？或者你可以骑车去邮局寄信。","takeaway":"'bicycle' 虽然不是邮件，但可以和“邮寄”这个生活场景联系起来，都属于具体事物。"},{"question":"那么 D 'often' 呢？它能和“邮件”、“交通工具”这些具体事物归为一类吗？","hint":"'often' 描述的是动作的频率，而不是一个事物。","takeaway":"'often' 在语义上与其他三个词无法归入同一个大的类别，因此是不同类的词。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"( )","options":{"A":"America","B":"China","C":"Canada","D":"French"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查词义辨析，特别是关于国家、国籍和语言的词汇。题目要求找出一个与其他三个不同类的词。\n- A 选项 `America`（美国）是国家名称。\n- B 选项 `China`（中国）是国家名称。\n- C 选项 `Canada`（加拿大）是国家名称。\n- D 选项 `French`（法国的；法语；法国人）可以作形容词或名词，但不是国家名称。“法国”这个国家对应的单词是 `France`。\n\nA、B、C 都是国家名称（名词），而 D 不是。因此，D 选项是不同类的词。","knowledge_expansion_md":"### 国家、国籍、语言词汇辨析\n这是小升初英语的常见考点，需要学生准确区分相关词汇。\n\n| 国家 (Country) | 国籍/形容词 (Nationality/Adjective) | 语言 (Language) |\n| :--- | :--- | :--- |\n| China | Chinese | Chinese |\n| America (the USA) | American | English |\n| Canada | Canadian | English, French |\n| **France** | **French** | **French** |\n| Japan | Japanese | Japanese |\n| England | English | English |\n\n从表格中可以清晰地看到，`America`, `China`, `Canada` 属于“国家”一列，而 `French` 属于“国籍/形容词”和“语言”一列，其对应的国家是 `France`。","socratic_tracks":[{"title":"词义分类：国家 vs. 其他","steps":[{"question":"请读一下 A, B, C 三个单词：America, China, Canada。它们指的是什么类型的事物？","hint":"它们都是世界地图上的……","takeaway":"America, China, 和 Canada 都是国家的名字。"},{"question":"那么 D 选项 'French' 是一个国家的名字吗？表示“法国”这个国家应该用哪个单词？","hint":"“I come from France.” 我来自法国。","takeaway":"'French' 不是国家名称，而 'France' 才是。"},{"question":"既然 A, B, C 都是国家，而 D 不是，那么哪个是不同类的词？","hint":"题目要求找出与其他三个词不同类的一项。","takeaway":"'French' 因为不是国家名称，所以是与其他三个词不同类的词。"}]},{"title":"词性与用法辨析","steps":[{"question":"我们能说 \"I am from America.\" 吗？能说 \"I am from China.\" 吗？","hint":"\"from + 国家名\" 是一个介绍自己来自哪里的常用表达。","takeaway":"国家名称通常作为名词，可以跟在介词 'from' 后面表示来源地。"},{"question":"那我们通常会说 \"I am from French.\" 吗？还是会说 \"I am French.\" 或者 \"I speak French.\"？","hint":"'French' 可以表示“法国人”或“法语”。","takeaway":"'French' 通常用作形容词（法国的）或名词（法国人/法语），用法与国家名称不同。"},{"question":"从用法上的区别来看，A, B, C 是一类，而 D 是另一类。你能总结一下它们的区别吗？","hint":"想想它们分别回答了什么问题？(Where are you from? vs. What is your nationality? / What language do you speak?)","takeaway":"'America', 'China', 'Canada' 回答 \"Where\" (地点/国家)，而 'French' 回答 \"What\" (国籍/语言)，因此 'French' 是不同类的。"}]},{"title":"词形联想与推断","steps":[{"question":"看到 'America'，你会联想到哪些相关的词？比如“美国的”或“美国人”怎么说？","hint":"比如美国国旗是 the American flag。","takeaway":"从 'America' (国家) 可以联想到 'American' (美国人/美国的)。"},{"question":"同样地，从 'China' 和 'Canada' 你能联想到什么词？","hint":"Chinese people, Canadian dollars.","takeaway":"很多国家名称后面加上特定后缀可以变成表示国籍或形容词的词，如 'Chinese', 'Canadian'。"},{"question":"现在看 'French'。它更像是 'China' 这一类（国家名），还是像 'Chinese' 这一类（国籍/形容词）？","hint":"'French' 的形式和用法与 'Chinese', 'American' 更类似，都表示国籍/语言/形容词。","takeaway":"通过词形变化规律的联想，可以判断出 'French' 属于“国籍/语言”类别，而 A, B, C 属于“国家”类别。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"( )","options":{"A":"week","B":"month","C":"day","D":"year"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对时间单位词汇的深层理解。题目要求找出一个与其他三个不同类的词。\n- `day` (天)、`month` (月)、`year` (年) 都是基于**天文现象**而定义的时间单位。\n- `day` 是地球自转一周的时间。\n- `month` 约是月球环绕地球一周的时间。\n- `year` 是地球环绕太阳一周的时间。\n- `week` (星期) 则是人为约定的时间单位，由7天组成，与任何一个独立的天文周期没有直接、精确的对应关系。\n因此，`week` 是唯一一个非天文起源的单位，是不同类的词。","knowledge_expansion_md":"### 时间单位的起源\n理解词汇背后的文化和科学渊源，有助于更深刻地掌握语言。\n- **天文单位**: `day` (地球自转), `month` (月球公转), `year` (地球公转)。这些是自然界客观存在的周期，是古代人类最早使用的时间度量衡。\n- **人为单位**: `second` (秒), `minute` (分), `hour` (小时), `week` (星期)。这些单位是为了更精细或更方便地组织生活和工作而人为划分的。\n\n`week` (星期) 的7天周期起源于古代巴比伦，后被犹太教采纳并传播到世界各地，与宗教和文化传统密切相关，而非天文学。在逻辑分类题中，这种“本质属性”的差异（自然 vs. 人为）是一个常见的考查角度。","socratic_tracks":[{"title":"探寻词源与定义","steps":[{"question":"我们先看 'day' 和 'year'。你知道这两个时间单位是怎么来的吗？它们和地球的运动有什么关系？","hint":"一个是地球自己转一圈，一个是地球绕着太阳转一圈。","takeaway":"'day' 源于地球自转，'year' 源于地球公转，它们都是基于天文现象。"},{"question":"那 'month' 呢？它和天上的哪个天体有关系？","hint":"想一想 'month' 和 'moon' (月亮) 这两个词是不是长得很像？","takeaway":"'month' 最初是根据月亮（moon）绕地球运行的周期来定义的。"},{"question":"最后看 'week'。一个星期有七天，这个“七”是和某个天文现象直接相关，还是人们的规定？","hint":"天文学上并没有一个不多不少正好是七天的自然周期。","takeaway":"'week' 是一个没有直接天文依据、由人类社会约定的时间单位，因此它与另外三者不同。"}]},{"title":"单位的构成关系","steps":[{"question":"我们来比较一下这些时间单位。一个 'year' 由什么组成？一个 'month' 由什么组成？","hint":"一年有12个……，一个月有大约30个……","takeaway":"'year' 由 'month' 组成，'month' 由 'day' 组成，它们之间有明确的包含关系。"},{"question":"那 'week' 和 'month' 以及 'year' 的关系是怎样的？一个 'month' 正好是整数个 'week' 吗？一个 'year' 呢？","hint":"一个月有4个多星期，一年有52个多星期。这个关系不是那么“整齐”。","takeaway":"'week' 这个单位与 'month' 和 'year' 的换算关系不是整数，它像一个独立的计时系统。"},{"question":"从这种“不整齐”的关系来看，'day', 'month', 'year' 构成了一个更紧密的体系，而哪个单位显得有些格格不入？","hint":"哪个单位打破了月和年之间的整洁换算？","takeaway":"'week' 作为一个人为插入的单位，打破了 'day-month-year' 这个基于天文的体系的完整性，因此是不同类的。"}]},{"title":"寻找本质属性差异","steps":[{"question":"这四个词都是时间单位，这是它们的共性。为了找出不同点，我们需要从更深层次的属性来思考。比如，这些单位是“天然形成”的还是“人为规定”的？","hint":"想一想，如果没有人类，地球还会自转和公转吗？","takeaway":"地球的自转（天）和公转（年）是自然规律，不以人的意志为转移。"},{"question":"那么，“星期”这个概念是自然界本来就有的，还是人类为了方便生活而创造的一个概念？","hint":"回顾一下历史或文化知识，星期制度和宗教传说有关。","takeaway":"“星期”是一个人为设定的、具有文化属性的计时周期。"},{"question":"现在，根据“自然形成”和“人为规定”这两个标准，你能把这四个词分成两类吗？哪一个词是单独一类？","hint":"day, month, year 是一类，week 是另一类。","takeaway":"从事物起源的本质属性（天文vs人为）来区分，'week' 是最与众不同的，这通常是此类逻辑辨析题的考点。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"( )","options":{"A":"looks","B":"rulers","C":"says","D":"comes"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考察名词复数和动词第三人称单数词尾-s的发音规则。\n1.  词尾-s在清辅音后发 /s/ 音。在`looks`中，'k'是清辅音，所以-s发 /s/。\n2.  词尾-s在浊辅音和元音后发 /z/ 音。\n3.  在`rulers`中，词尾-s在元音/ə/后，发 /z/。\n4.  在`comes`中，词尾-s在浊辅音/m/后，发 /z/。\n5.  `says` /sez/ 是一个特殊发音，但其词尾-s同样发 /z/ 音。\n6.  综上所述，只有`looks`的-s发音为/s/，与其他三项不同。","knowledge_expansion_md":"### 词尾-s发音三原则\n\n1.  **在清辅音（/p/, /t/, /k/, /f/, /θ/）后，发 /s/ 音。**\n    - 示例: `maps` /mæps/, `cats` /kæts/, `books` /bʊks/\n\n2.  **在浊辅音（除/z/, /dʒ/, /ʒ/外）和元音后，发 /z/ 音。**\n    - 示例: `dogs` /dɒɡz/, `beds` /bedz/, `pigs` /pɪɡz/, `cars` /kɑːrz/\n\n3.  **在 /s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ 等音后，发 /ɪz/ 音，并增加一个音节。**\n    - 示例: `classes` /ˈklɑːsɪz/, `noses` /ˈnəʊzɪz/, `dishes` /ˈdɪʃɪz/, `watches` /ˈwɒtʃɪz/\n\n#### 易错点与特殊记忆\n- **特殊词 `says`**: 它的原形是 `say` /seɪ/，但第三人称单数形式 `says` 的发音是 /sez/，元音部分发生了变化，需要特别记忆。\n- **清浊辅音的判断**: 关键在于发音时声带是否振动。可以将手放在喉咙处感受。发/k/时不振动（清），发/m/时振动（浊）。","socratic_tracks":[{"title":"词尾-s发音规则","steps":[{"question":"这道题是比较单词的意思还是发音？我们应该关注单词的哪个部分？","hint":"这类选择题通常是找出划线部分发音不同的单词。题干虽然没有划线，但共同点是词尾的-s。","takeaway":"这是一道语音题，考察词尾-s的发音规则。"},{"question":"词尾-s的发音有几种情况？它们分别遵循什么规律？","hint":"想一想-s前面的音是清辅音、浊辅音还是元音。","takeaway":"词尾-s的发音取决于其前面音素的清浊属性，分为/s/、/z/和/ɪz/三种。"},{"question":"请用“清清浊浊”的规则分析`looks`和`comes`中-s的发音。","hint":"`look`的末尾音/k/是清辅音，`come`的末尾音/m/是浊辅音。","takeaway":"根据“清清浊浊”原则，`looks`的-s发/s/音，而`comes`的-s发/z/音。"}]},{"title":"特殊词汇辨析","steps":[{"question":"选项C `says` 这个词的发音有什么特别之处吗？","hint":"它的原形是 `say` /seɪ/，但变成第三人称单数后，元音部分发生了变化。","takeaway":"`says` 的发音是 /sez/，是一个需要特殊记忆的不规则发音。"},{"question":"既然 `says` 的发音是 /sez/，那它词尾的 's' 发的是什么音？","hint":"/sez/ 的最后一个音是 /z/。","takeaway":"`says` 的词尾-s发/z/音，与`rulers`和`comes`属于同一类。"}]},{"title":"解题策略","steps":[{"question":"面对这类语音辨析题，第一步应该做什么？","hint":"首先要明确题目考察的是哪个音素或发音规则。","takeaway":"解题第一步是确定考察点，即词尾-s的发音。"},{"question":"确定考察点后，如何快速判断选项？","hint":"应用“清辅音后读/s/，浊辅音和元音后读/z/”这个核心规则，先处理符合规则的单词。","takeaway":"运用核心发音规则可以快速判断大多数选项，从而缩小范围。"},{"question":"如果遇到像 `says` 这样的不确定项怎么办？","hint":"即使不确定某个特殊词的发音，通过分析其他三个规则词，也能用排除法找到答案。","takeaway":"掌握“一般规则+特殊记忆+排除法”是高效解决语音题的关键。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"Please have a ___, Tom.","options":{"A":"seat","B":"clean","C":"look","D":"sit"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配 `have a seat`。\n1.  根据句意，说话者在礼貌地请汤姆坐下。\n2.  `have a seat` 是一个常用的礼貌表达，意为“请坐”，相当于 `sit down`，但更为正式和客气。\n3.  `seat` 在这里用作名词，意为“座位”，符合空格前不定冠词 `a` 的要求。\n4.  选项 B `clean`（干净的/打扫）和 C `look`（看）在句意上不通。\n5.  选项 D `sit`（坐）是动词，不能跟在冠词 `a` 后面，语法错误。","knowledge_expansion_md":"### 核心辨析：`seat` vs `sit`\n\n- **`sit`** 是不及物动词，表示“坐”这个**动作**。\n  - 常用结构: `sit down` (坐下), `sit on a chair` (坐在椅子上)。\n  - 示例: `Please sit down.` (请坐下。)\n\n- **`seat`** 主要用作名词，意为“座位”这个**物体**。\n  - 常用结构: `have a seat` / `take a seat` (请坐), `find a seat` (找个座位)。\n  - 示例: `Is this seat taken?` (这个座位有人吗？)\n\n- **`seat` 作动词**: `seat` 也可用作及物动词，意为“使...坐下，安排...就座”，常用于被动语态或与反身代词连用，比 `sit` 更正式。\n  - 示例: `Please be seated.` (请就座。) \n  - 示例: `He seated himself by the window.` (他在窗边坐下。)\n\n**小升初重点**: 必须熟练掌握 `have a seat` 和 `take a seat` 这两个表示“请坐”的固定搭配。","socratic_tracks":[{"title":"语法结构分析","steps":[{"question":"观察空格前面的单词 `a`，它是什么词？它后面通常跟什么词性的单词？","hint":"`a` 是一个不定冠词，用来修饰名词。","takeaway":"冠词 `a` 后面必须跟一个可数名词的单数形式。"},{"question":"分析四个选项的词性：`seat`, `clean`, `look`, `sit`，哪些在语法上可以放在`a`的后面？","hint":"`sit` 是动词。`clean` 主要是形容词。`look` 和 `seat` 都可以作名词。","takeaway":"从语法角度看，`seat` 和 `look` (作名词时) 是可能的选项，而 `sit` 和 `clean` 基本可以排除。"}]},{"title":"固定搭配","steps":[{"question":"在日常口语中，当我们想礼貌地请别人“坐下”时，除了 `sit down`，还有哪些更常用的说法？","hint":"想一想和“座位”这个词相关的表达。","takeaway":"`Have a seat` 或 `Take a seat` 是邀请他人就座的常用礼貌短语。"},{"question":"结合这个固定搭配，再看题目 \"Please have a ___\"，哪个选项最合适？","hint":"将 `seat` 填入空格，构成 `have a seat`。","takeaway":"本题直接考察固定搭配 `have a seat`，意为“请坐”。"}]},{"title":"易混词辨析","steps":[{"question":"为什么不能选 D `sit`？它不也是“坐”的意思吗？","hint":"注意 `sit` 的词性，它是一个动词。再看看空格前有什么词。","takeaway":"`sit` 是动词，不能放在冠词 `a` 后面，语法结构错误。"},{"question":"那么 `sit` 和 `seat` 在用法上有什么核心区别？","hint":"一个是动作（sit），一个是物体（seat）。","takeaway":"`sit` 指“坐”的动作，而 `seat` 指“座位”这个东西，`have a seat` 的意思是“拥有一个座位”，引申为“请坐”。"}]}]}}]},{"section_title":"III. 完形填空。(共10分)","section_instruction":"Dear Daniel,\nI'm in London now. It's the (11)_____ of England. I love everything here except the food. I don't know how people in London stand (忍受) the (12)_____ here. I often think of Chinese food and I never (13)_____ missing you. Is your school life good? I'll (14)_____ you when I go to China next time.\nYou (15)_____ me about the traffic in London in your email. Taxis in London are really expensive. (16)_____ if you come to London, you should have enough (17)_____ with you. Taxi drivers are usually (18)_____. They are always ready to help you. And they must take exams (19)_____ they become taxi drivers. London also has a complicated (复杂的) underground system. It's (20)_____ to go the wrong way if you are not careful.\nBest wishes,\nYours,\nMillie","items":[{"number":"11","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"country","B":"city","C":"capital","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查地点名词的辨析。\n1.  根据上下文“I'm in London now. It's the (11)_____ of England.”（我现在在伦敦。它是英格兰的___。），我们需要填入一个表示伦敦地位的名词。\n2.  选项A `country` 意为“国家”，选项B `city` 意为“城市”，选项C `capital` 意为“首都”。\n3.  根据常识，伦敦是英格兰的首都，因此 `capital` 是最准确描述其身份的词。\n4.  虽然伦敦也是一个 `city`（城市），但在特指“首都”这一行政中心地位时，`capital` 的表意更精确，是完形填空中的最佳选项。","knowledge_expansion_md":"### 词义辨析：`country`, `city`, `capital`\n\n- **`country`**: 指“国家”，是最高一级的行政区域。\n  - 示例: `China is a great country.` (中国是一个伟大的国家。)\n\n- **`city`**: 指“城市”，通常规模较大，人口较多。\n  - 示例: `London is a modern city.` (伦敦是一座现代化的城市。)\n\n- **`capital`**: 指“首都”（一个国家的）或“省会”（一个省的）。当指国家的首都时，首字母通常大写。\n  - 示例: `London is the capital of England.` (伦敦是英格兰的首都。)\n  - 示例: `Chengdu is the capital of Sichuan province.` (成都是四川省的省会。)\n\n#### 解题技巧\n在完形填空中，当多个选项看似都合理时（如本题的 `city` 和 `capital`），要选择最贴切、最具体、最能体现上下文逻辑关系的词。句型 `the ___ of ...` 常常暗示一种独特的、具有代表性的关系，`capital` 比 `city` 更好地体现了这种关系。","socratic_tracks":[{"title":"词义精确辨析","steps":[{"question":"`country`, `city`, `capital` 这三个词的中文意思分别是什么？","hint":"`country`是国家，`city`是城市，`capital`是首都或省会。","takeaway":"这三个词描述的是不同层级和性质的地理行政单位。"},{"question":"题目中提到了 \"London\" 和 \"England\"，它们之间是什么关系？","hint":"伦敦是英格兰的首都。","takeaway":"理解伦敦和英格兰的从属和功能关系是解题的关键。"},{"question":"那么，哪个词最能准确地描述“首都”这个身份？","hint":"`capital` 这个词既可以指国家的首都，也可以指省的省会。","takeaway":"`capital` 是描述首都或省会身份最精确的词汇。"}]},{"title":"最佳答案选择","steps":[{"question":"为什么 B `city`（城市）不是最佳答案？伦敦难道不是一个城市吗？","hint":"伦敦当然是一个城市，但文章在这里强调的是它在英格兰的“地位”，而不仅仅是“一个城市”。","takeaway":"完形填空要求选择“最佳”答案，而不仅仅是“正确”的答案。"},{"question":"如何判断哪个是“最佳”答案？","hint":"看哪个选项提供的信息更具体、更贴合上下文的逻辑。句子结构 \"The ___ of ...\" 提示了两者间的特定关系。","takeaway":"`capital` 精确地定义了伦敦作为英格兰行政中心的角色，比泛指的 `city` 信息更丰富，因此是最佳答案。"}]},{"title":"知识拓展应用","steps":[{"question":"这道题除了考查英语词汇，还涉及了哪方面的知识？","hint":"题目提到了英国的城市和国家构成部分。","takeaway":"本题结合了英语词汇和基本的地理常识。"},{"question":"你能用英语说出“北京是中国的首都”吗？","hint":"套用句型 `A is the capital of B.`","takeaway":"我们可以这样表达：`Beijing is the capital of China.`"}]}]}},{"number":"12","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"weather","B":"traffic","C":"food","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查名词的语境选择。\n1.  根据上一句“I love everything here except the food.”（我喜欢这里的一切，除了食物。），作者明确表达了对伦敦食物的不满。\n2.  下一句“I don't know how people in London stand (忍受) the (12)_____ here.”（我不知道伦敦人怎么能忍受这里的___。）是上一句内容的延续和解释。\n3.  因此，作者无法忍受的正是前文提到的 `food`（食物）。\n4.  选项A `weather`（天气）和B `traffic`（交通）虽然也是伦敦常被抱怨的方面，但与前文的“food”没有直接联系。根据上下文一致性原则，应选择C。","knowledge_expansion_md":"### 上下文一致性原则 (Contextual Coherence)\n\n在完形填空中，句子与句子之间不是孤立的，而是通过逻辑关系紧密联系在一起的。解题时，必须关注空格前后句子的信息，寻找线索。\n\n- **指代关系**: 后文的词可能指代前文已经提到过的人或物。\n- **逻辑关系**: 句子之间可能存在因果、转折、递进、并列等关系。\n- **情感态度**: 作者在文中的情感态度（喜欢、讨厌、怀疑等）通常是贯穿全文或某个段落的。\n\n在本题中，前一句的关键词 `except the food` 直接为后一句的空格提供了最直接的线索，体现了上下文的一致性。","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"读空格前的句子 'I love everything here except the food.' 这句话表达了作者对什么东西的不满？","hint":"关键词是 `except`（除了）。","takeaway":"作者明确表示不喜欢伦敦的食物（food）。"},{"question":"空格所在的句子 'I don't know how people in London stand the ___ here.' 是什么意思？","hint":"`stand` 在这里是“忍受”的意思。","takeaway":"这句话的意思是作者不理解人们如何忍受这里的某个东西。"},{"question":"结合前后两句话，作者最有可能无法忍受的是什么？","hint":"后一句话通常是前一句话的延续或解释。","takeaway":"既然作者不喜欢食物，那么他无法忍受的自然就是食物。这符合逻辑。"}]},{"title":"排除法应用","steps":[{"question":"为什么 A `weather`（天气）和 B `traffic`（交通）不是最佳答案？","hint":"虽然伦敦的天气和交通也可能不好，但前文有提到它们吗？","takeaway":"文章前面没有提供关于天气或交通的任何信息，选择它们属于无根据的猜测。"},{"question":"完形填空的首要原则是什么？","hint":"是根据自己的想象来填，还是根据文章已有的信息来填？","takeaway":"完形填空必须基于上下文提供的线索，而不是主观臆断。因此，只有前文提到过的 `food` 是有据可循的答案。"}]}]}},{"number":"13","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"stop","B":"remember","C":"start","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查固定搭配和动词辨析。\n1.  根据上下文“I never (13)_____ missing you.”（我从未___想念你。），作者在表达对收信人 Daniel 的思念之情。\n2.  空格后是动名词 `missing`。我们需要选择一个能与 `missing` 搭配并符合句意的动词。\n3.  选项A `stop`，`stop doing sth.` 意为“停止做某事”。`never stop missing you` 意为“从未停止想念你”，情感真挚，符合语境。\n4.  选项B `remember`，`remember doing sth.` 意为“记得做过某事”。`never remember missing you` 意为“从不记得想念过你”，与信件的友好口吻相悖，不合逻辑。\n5.  选项C `start`，`start doing sth.` 意为“开始做某事”。`never start missing you` 意为“从未开始想念你”，同样不合逻辑。\n6.  因此，`stop` 是唯一正确的选项。","knowledge_expansion_md":"### 重点词汇辨析：remember\n\n`remember` 是一个非常重要的动词，其后可接不同的形式，表达不同的含义：\n1.  **remember to do sth**: 记得去做某事（事情还未做）。\n    -   例：`Please remember to turn off the lights when you leave.` (请记得离开时关灯。)\n2.  **remember doing sth**: 记得做过某事（事情已经发生）。\n    -   例：`I remember meeting him at a party last year.` (我记得去年在一次聚会上见过他。)\n\n### 易混词辨析：stop\n\n`stop` 的用法也需注意区分：\n1.  **stop to do sth**: 停下来（原来的事），去做另一件事。\n    -   例：`He stopped to smoke a cigarette.` (他停下来，抽了根烟。)\n2.  **stop doing sth**: 停止正在做的事。\n    -   例：`Please stop talking.` (请不要讲话了。)","socratic_tracks":[{"title":"分析句子结构与搭配","steps":[{"question":"观察空格后面的词 `missing`，它是什么词性？","hint":"动词 `miss` 的 `-ing` 形式，这里是动名词。","takeaway":"我们需要找一个可以后接动名词（doing sth）的动词。"},{"question":"在选项 `stop`, `remember`, `start` 中，哪些可以接 `doing sth`？","hint":"它们都可以。`stop doing`, `remember doing`, `start doing` 都是合法的结构。","takeaway":"语法上都可行，所以必须从词义和语境来判断。"}]},{"title":"理解语境和情感","steps":[{"question":"这句话 'I never ___ missing you.' 是想表达一种什么样的情感？","hint":"作者在异国他乡给朋友写信，提到了想念中国菜。","takeaway":"作者在表达对朋友的强烈思念之情。"},{"question":"把选项A `stop` 代入，'never stop missing you' 是什么意思？","hint":"从未停止想念你。","takeaway":"这个表达情感浓烈，符合语境。"},{"question":"把选项B `remember` 和 C `start` 代入，'never remember missing you' 和 'never start missing you' 分别是什么意思？它们符合思念的情感吗？","hint":"一个是从不记得想念过，一个是从未开始想念。","takeaway":"这两个选项都表达了“不想念”的意思，与上下文情感完全相反，因此是错误的。"}]}]}},{"number":"14","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"know","B":"teach","C":"visit","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查动词词义辨析。\n1.  根据上下文“I'll (14)_____ you when I go to China next time.”（我下次去中国的时候会___你。），作者在表达对未来的计划。\n2.  选项A `know` 意为“认识”，作者和收信人 Daniel 已经是朋友，不需要再“认识”，不合逻辑。\n3.  选项B `teach` 意为“教”，文中没有提到任何教与学相关的内容，不合逻辑。\n4.  选项C `visit` 意为“拜访，看望”。作者在伦敦，朋友在中国，说“下次去中国时会去看你”是人之常情，完全符合语境。\n5.  因此，`visit` 是最佳答案。","knowledge_expansion_md":"### 词义辨析：`know`, `teach`, `visit`\n\n- **`know`**: 意为“知道，认识”，表示一种已经存在的状态。通常不用于将来时态来表达“将要去认识”。\n  - 示例: `I know him well.` (我很了解他。)\n\n- **`teach`**: 意为“教，讲授”，指传授知识或技能。\n  - 示例: `My father taught me how to swim.` (我爸爸教我游泳。)\n\n- **`visit`**: 意为“拜访，参观，看望”，指去某个地方或看某个人。\n  - 示例: `I will visit my grandparents next week.` (我下周要去看望我的祖父母。)\n  - 在本题语境中，`visit you` (看望你) 是最符合逻辑的计划。","socratic_tracks":[{"title":"理解语境和计划","steps":[{"question":"这句话 'I'll ___ you when I go to China next time.' 描述的是一个未来的什么事情？","hint":"`I'll` 是 `I will` 的缩写，表示一个将来的计划或承诺。","takeaway":"作者在告诉朋友自己下次去中国时的打算。"},{"question":"作者 Millie 在伦敦，朋友 Daniel 在中国。当 Millie 去中国时，她会对 Daniel 做什么最合情理？","hint":"想一想异地的朋友见面会做什么。","takeaway":"去看望/拜访朋友是最自然、最常见的行为。"}]},{"title":"动词词义排除","steps":[{"question":"为什么不能选 A `know`？","hint":"他们正在通信，说明他们已经互相认识了。","takeaway":"`know` 表示“认识”，用在这里不合逻辑。"},{"question":"为什么不能选 B `teach`？","hint":"信中提到了生活、食物、交通，有提到任何关于“教”或“学”的内容吗？","takeaway":"选择 `teach` 没有任何上下文依据，属于凭空猜测。"},{"question":"为什么 C `visit` 是最合适的？","hint":"`visit you` 的意思是“看望你”。","takeaway":"`visit` 完美地契合了“去中国”和“看朋友”这两个情境，是唯一合理的选项。"}]}]}},{"number":"15","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"asked","B":"told","C":"talked","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义和上下文逻辑。\n1.  根据上下文“You (15)_____ me about the traffic in London in your email.”（你在邮件里___我关于伦敦交通的事。）以及后文作者开始详细描述伦敦的交通（出租车、地铁），可以判断作者正在回应收信人 Daniel 的一个请求或问题。\n2.  选项A `asked`，`ask sb about sth` 意为“询问某人某事”。“你在邮件里问我关于伦敦交通的事”符合逻辑，后文的描述就是对这个问题的回答。\n3.  选项B `told`，`tell sb about sth` 意为“告诉某人某事”。“你告诉我关于伦敦交通的事”不合逻辑，因为 Daniel 不在伦敦，而是在向身处伦敦的 Millie 了解情况。\n4.  选项C `talked`，`talk` 是不及物动词，不能直接跟宾语 `me`，正确用法是 `talked to me about...`，因此语法错误。\n5.  综上，`asked` 是唯一符合逻辑和语法的选项。","knowledge_expansion_md":"### 核心动词辨析：ask, tell, talk\n\n-   **`ask`**: 强调“询问”以获取信息。用法：`ask sb sth` (问某人某事), `ask sb about sth` (询问某人关于某事), `ask sb to do sth` (请求某人做某事)。在本题中，Daniel 向 Millie 询问信息，用 `ask` 最合适。\n-   **`tell`**: 强调“告知、讲述”信息，是单向的信息传递。用法：`tell sb sth` (告诉某人某事), `tell sb about sth` (向某人讲述关于某事)。如果用 `told`，则意味着 Daniel 在告诉 Millie 伦敦的交通情况，与情境不符。\n-   **`talk`**: 强调“交谈、谈论”的动作，通常是不及物动词。用法：`talk to/with sb about sth` (和某人谈论某事)。它不能直接跟宾语 `me`，因此 `talked me` 是错误的。","socratic_tracks":[{"title":"分析信息流向","steps":[{"question":"阅读空格所在的句子以及后面的内容。是谁在提供关于伦敦交通的信息？是 Millie 还是 Daniel？","hint":"信是 Millie 写的，她在描述伦敦的交通。","takeaway":"信息是从 Millie（作者）流向 Daniel（收信人）的。"},{"question":"既然 Millie 是信息的提供者，那么 Daniel 在之前的邮件里很可能扮演了什么角色？","hint":"一个人回答问题，说明另一个人...？","takeaway":"Daniel 应该是信息的请求者，也就是他“问”了问题。"},{"question":"在选项 `asked`, `told`, `talked` 中，哪个词表示“请求信息”或“提问”？","hint":"A是问，B是告诉。","takeaway":"`asked` (问) 最符合 Daniel 的角色。"}]},{"title":"语法和用法辨析","steps":[{"question":"为什么 C `talked` 在这里是错误的？","hint":"`talk` 是不及物动词，后面可以直接跟人称代词作宾语吗？","takeaway":"语法错误。正确的说法是 `talked to me`。"},{"question":"比较 A `asked` 和 B `told`。`You asked me about...` 和 `You told me about...` 意思上有什么根本区别？","hint":"一个是你问我，一个是你告诉我。","takeaway":"这两个词代表了完全相反的信息流向。根据上下文，只能是 Daniel 问，Millie 答。"}]}]}},{"number":"16","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"Because","B":"So","C":"But","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查并列连词的逻辑关系。根据上下文，前一句“Taxis in London are really expensive.”（伦敦的出租车真的很贵）是原因，后一句“you should have enough (17)_____ with you.”（你应该随身带足够的钱）是结果。选项B“So”（所以）表示因果关系，符合句意“因为出租车很贵，所以你应该带足够的钱”。选项A“Because”（因为）用法错误，不能这样连接两个独立的句子。选项C“But”（但是）表示转折，不符合逻辑。故选B。","knowledge_expansion_md":"### 核心语法：并列连词\n\n并列连词用于连接两个或多个语法地位相同的单词、短语或分句。初中阶段必须掌握以下几个：\n-   **and (和)**: 表示并列、递进或顺承关系。\n    -   `He is tall and handsome.` (他又高又帅。)\n-   **but (但是)**: 表示转折或对比关系。\n    -   `The story is sad, but it has a happy ending.` (故事是悲伤的，但结局是快乐的。)\n-   **or (或者)**: 表示选择关系。\n    -   `Would you like tea or coffee?` (你想喝茶还是咖啡？)\n-   **so (所以)**: 表示因果关系（前因后果）。\n    -   `It was cold, so I put on my coat.` (天很冷，所以我穿上了外套。)\n\n### 易错点：`so` 和 `because`\n\n`so` 和 `because` 都表示因果关系，但用法不同，且**不能在同一个句子中同时使用**。\n-   `Because it was cold, I put on my coat.` (因为天冷，我穿上外套。)\n-   `It was cold, so I put on my coat.` (天冷，所以我穿上了外套。)\n-   错误用法：`Because it was cold, so I put on my coat.` (这是典型的中式英语错误)","socratic_tracks":[{"title":"句子逻辑关系判断","steps":[{"question":"请分析空格前后的两个分句：'Taxis in London are really expensive' 和 'you should have enough money with you'。这两个分句在意思上是什么关系？","hint":"“出租车贵”和“应该带足够的钱”之间，一个是原因，另一个是什么？","takeaway":"两个分句之间是因果关系，前者是原因，后者是结果。"}]},{"title":"连词功能辨析","steps":[{"question":"在 'Because', 'So', 'But' 这三个连词中，哪一个专门用来连接表示“前因后果”的两个句子？","hint":"回忆一下这三个词的中文意思：因为、所以、但是。","takeaway":"'So' 是表达“所以”这个因果关系的正确选项。"},{"question":"为什么不能用 'But' (但是)？","hint":"'But' 表示转折关系，而“出租车贵”和“要带够钱”之间是顺理成章的因果关系，不是转折。","takeaway":"上下文逻辑是因果而非转折，因此排除 'But'。"}]}]}},{"number":"17","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"time","B":"energy","C":"money","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查名词词义辨析。根据上文“Taxis in London are really expensive.”（伦敦的出租车真的很贵），可以推断出作者建议带足“钱”（money）以应对高昂的交通费用。选项A“time”（时间）和选项B“energy”（精力）与上下文的“expensive”（昂贵的）没有直接逻辑关系。故选C。","knowledge_expansion_md":"### 词汇辨析与上下文推断\n\n完形填空题非常考验根据上下文语境选择最恰当词汇的能力。解题步骤如下：\n1.  **定位线索**：找到空格前后与答案相关的关键词或句子。在本题中，关键线索是前一句的 `expensive` (昂贵的)。\n2.  **分析逻辑**：分析线索与选项之间的逻辑关系。`expensive` 直接指向了金钱 `money` 的概念。\n3.  **词义辨析**：区分各选项的含义，并代入原文检查是否通顺。\n    *   `time`: 时间\n    *   `energy`: 精力\n    *   `money`: 钱\n    只有 `money` 能与 `expensive` 构成合理的因果关系。","socratic_tracks":[{"title":"上下文线索定位","steps":[{"question":"这个空格前的句子 'Taxis in London are really expensive.' 告诉了我们关于伦敦出租车的什么信息？","hint":"expensive 的中文意思是什么？","takeaway":"它告诉我们伦敦的出租车非常昂贵。"}]},{"title":"逻辑推断","steps":[{"question":"既然出租车很贵，那么作者建议来伦敦的人应该随身带足什么呢？","hint":"贵的东西需要用什么来支付？","takeaway":"昂贵的费用需要用钱（money）来支付，所以应该带足够的钱。"}]},{"title":"选项排除","steps":[{"question":"为什么不选 'time' (时间) 或 'energy' (精力)？","hint":"“昂贵”这个特点和“时间”、“精力”有直接关系吗？","takeaway":"上下文讨论的是花费问题，与金钱直接相关，而与时间或精力没有直接的逻辑联系，因此可以排除A和B。"}]}]}},{"number":"18","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"friendly","B":"clever","C":"angry","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查根据上下文选择合适的形容词。根据空格后的句子“They are always ready to help you.”（他们总是乐于帮助你），可以推断出出租车司机的性格特点。选项A“friendly”（友好的）最符合“乐于助人”这一描述。选项B“clever”（聪明的）和选项C“angry”（生气的）与上下文语境不符。故选A。","knowledge_expansion_md":"### 根据行为推断性格\n\n在阅读理解和完形填空中，经常需要通过一个人的言行来推断其性格特点。这要求我们掌握描述人物性格的常用形容词，并能将它们与具体的行为联系起来。\n\n*   **褒义词 (Positive)**: `friendly` (友好的), `kind` (善良的), `patient` (耐心的), `helpful` (乐于助人的), `brave` (勇敢的), `hard-working` (勤奋的), `clever` (聪明的), `wise` (智慧的)。\n*   **贬义词 (Negative)**: `angry` (生气的), `rude` (粗鲁的), `lazy` (懒惰的), `selfish` (自私的), `impatient` (不耐烦的)。\n\n**解题技巧**：先判断上下文语境是积极的还是消极的，然后排除与语境感情色彩不符的选项。","socratic_tracks":[{"title":"上下文线索","steps":[{"question":"我们如何判断出租车司机是怎么样的人？文章给了什么线索？","hint":"看看空格后面的句子 'They are always ready to help you.' 是什么意思？","takeaway":"线索是“他们总是乐于帮助你”，这描述了他们的行为。"}]},{"title":"形容词词义","steps":[{"question":"一个“总是乐于助人”的人，用 'friendly' (友好的), 'clever' (聪明的), 'angry' (生气的) 中的哪一个词来形容最贴切？","hint":"“乐于助人”是友好的一种表现。","takeaway":"'friendly' (友好的) 最能概括这种乐于助人的品质。"}]},{"title":"褒贬判断","steps":[{"question":"我们把词语分为有好的感情色彩（褒义）和坏的感情色彩（贬义）。在 'friendly', 'clever', 'angry' 中，哪个是明显的贬义词？","hint":"哪个词是用来描述负面情绪的？","takeaway":"'angry' (生气的) 是一个贬义词。"},{"question":"如果上下文描述的是一件好事，比如得到帮助，我们应该排除哪个选项？","hint":"描述好事的句子，通常不会用一个表示负面情绪的词。","takeaway":"通过判断上下文的褒贬色彩，可以快速排除感情色彩相反的选项。"}]}]}},{"number":"19","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"After","B":"Before","C":"until","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查时间状语从句连词的用法。根据逻辑关系，“参加考试”（take exams）这个动作发生在“成为出租车司机”（become taxi drivers）这个结果之前。选项B“Before”（在……之前）表示动作发生的先后顺序，符合句意。选项A“After”（在……之后）和选项C“until”（直到……为止）均不符合逻辑。故选B。","knowledge_expansion_md":"### 时间状语从句连词辨析\n\n*   **until / till**: 意为“直到……为止”，强调主句的动作或状态一直持续到 `until` 从句所表示的时间点。肯定句中，主句谓语动词必须是延续性动词；否定句中，主句谓语动词可以是瞬间性动词，构成 `not...until...`（直到……才……）结构。\n    *   *e.g., Wait here until I come back.* (主句动词 wait 是延续性的)\n    *   *e.g., He didn't go to bed until 11 o'clock.* (他直到11点才睡觉。)\n\n*   **before**: 意为“在……之前”。\n    *   *e.g., Brush your teeth before you go to bed.* (睡觉前要刷牙。)\n\n*   **after**: 意为“在……之后”。\n    *   *e.g., I will call you after I finish my homework.* (我写完作业后会给你打电话。)\n\n*   **when**: 意为“当……时候”，可以指一个时间点或时间段。\n\n*   **while**: 意为“在……期间”，强调两个动作同时进行，`while` 从句中的动词通常是延续性的。","socratic_tracks":[{"title":"动作顺序判断","steps":[{"question":"请分析“参加考试”和“成为出租车司机”这两个动作，哪一个应该先发生？","hint":"是先成为司机再考试，还是先考试再成为司机？","takeaway":"正常的逻辑顺序是，必须先通过考试，然后才能获得成为司机的资格。"}]},{"title":"连词词义辨析","steps":[{"question":"在 'After', 'Before', 'until' 这三个表示时间的连词中，哪一个词表示“在……之前”？","hint":"回忆这三个词的中文意思。","takeaway":"'Before' 的意思是“在……之前”，正好可以用来表达“在成为司机之前必须参加考试”这个顺序。"}]},{"title":"排除法应用","steps":[{"question":"如果用 'After' (在...之后)，句子变成“他们在成为司机之后必须参加考试”，这合乎常理吗？","hint":"都已经成为司机了，为什么还要参加准入考试呢？","takeaway":"用 'After' 逻辑不通，可以排除。"},{"question":"如果用 'until' (直到)，句子变成“他们必须参加考试，直到他们成为司机为止”，这句话听起来对吗？","hint":"'until' 强调一个动作的持续。这句话听起来像是他们一直在不停地考试，直到成为司机的那一刻才停下来，语意很奇怪。","takeaway":"'until' 在此语境下不自然，'Before' 最能清晰地表达事件的先后顺序。"}]}]}},{"number":"20","item_type":"cloze","context_note":"","stem":"( )","options":{"A":"important","B":"funny","C":"easy","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词词义辨析。根据上文“London also has a complicated (复杂的) underground system.”（伦敦还有一个复杂的地铁系统）以及后半句“if you are not careful”（如果你不小心），可以推断出，在复杂的系统里不小心，就“容易”（easy）走错路。这是一个常见的因果推断。选项A“important”（重要的）和选项B“funny”（有趣的）均不符合逻辑。故选C。","knowledge_expansion_md":"### 上下文逻辑推断\n\n完形填空常考查根据上下文进行逻辑推断的能力。本题是典型的“原因+条件→结果”模式。\n*   **原因**: The underground system is `complicated` (复杂的).\n*   **条件**: `if you are not careful` (如果你不小心).\n*   **结果**: It's `easy` (容易) to go the wrong way.\n\n**解题句型**: `It's + adj. + to do sth.`\n这个句型用来评价做某事的性质。常见的形容词有：\n*   `easy` (容易的)\n*   `difficult / hard` (困难的)\n*   `important` (重要的)\n*   `necessary` (有必要的)\n*   `possible / impossible` (可能的/不可能的)\n解题时需要根据上下文逻辑选择最合适的形容词。","socratic_tracks":[{"title":"语境线索分析","steps":[{"question":"文章描述伦敦的地铁系统时，用了一个什么词？","hint":"看空格前一句，'complicated' 是什么意思？","takeaway":"文章说地铁系统是 'complicated' (复杂的)。"},{"question":"句子后面还给了一个条件 'if you are not careful'，这是什么意思？","hint":"not careful = 不小心。","takeaway":"条件是“如果你不小心”。"}]},{"title":"逻辑推断","steps":[{"question":"在一个复杂的系统里，如果你不小心，会发生什么？走错路会变得怎么样？","hint":"是会变得困难，还是容易？","takeaway":"在一个复杂的系统里不小心，就很容易走错路。"}]},{"title":"词义辨析与代入","steps":[{"question":"在 'important' (重要的), 'funny' (有趣的), 'easy' (容易的) 中，哪个词最符合“很容易走错路”这个意思？","hint":"我们需要一个词来描述“走错路”这件事发生的可能性或难易度。","takeaway":"'easy' (容易的) 最符合逻辑，表示“很容易走错路”。"}]}]}}]},{"section_title":"IV. 阅读理解。(共15分)","section_instruction":"","items":[{"number":"21","item_type":"reading","context_note":"John lives in a new house. There is a small garden near his house. He likes playing in the river. But there isn't a river near his new house. He is not happy.\nOne morning, his mother says, \"There is a beautiful park near here, and there is a pool in it. We can go there in the afternoon.\" John is very happy.\nAfter lunch, John and his mother go to the park, and he plays in the pool. His mother is watching him under a tree.","stem":"John lives in the new house _____.","options":{"A":"in the park","B":"near a river","C":"near a garden","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节定位题。题目询问约翰的新房子在哪里。根据原文第一段第二句 “There is a small garden near his house.”（他的房子附近有一个小花园），我们可以直接找到答案。因此，约翰的房子在一个花园附近。选项 A 和 B 均与原文信息不符，原文明确提到 “there isn't a river
