 a a a a a-answering the question`）的性质。\n2.  **同义词与反义词**：\n    *   `difficult` 的近义词是 `hard`。`It's hard for me.` 意思完全相同。\n    *   `difficult` 的反义词是 `easy` 或 `simple`。`It's easy for me.` (这对我来说很简单。)\n3.  **固定搭配**：`be difficult for sb. (to do sth.)` 意为“对某人来说（做某事）是困难的”。例如：`It's difficult for a child to understand this book.` (对一个孩子来说，理解这本书是困难的。)", "socratic_tracks": [{"title": "对话逻辑推理", "steps": [{"question": "在对话中，回答者说的第一个词是“Sorry”，这通常表达了什么样的情绪或意图？", "hint": "当你无法满足别人的请求时，你通常会先说什么？", "takeaway": "“Sorry”在这里表示歉意，暗示无法完成对方的请求，即无法回答问题。"}, {"question": "既然无法回答问题，那么这个问题对于回答者来说，是简单的还是困难的？", "hint": "想一想 `easy` 和 `difficult` 哪一个更符合语境。", "takeaway": "这个问题对于回答者来说是困难的。"}]}, {"title": "词汇与首字母匹配", "steps": [{"question": "请想一个以字母 'd' 开头，并且意思是“困难的”的英语形容词。", "hint": "这个词的反义词是 `easy`。", "takeaway": "表示“困难的”且以 'd' 开头的词是 `difficult`。"}, {"question": "将 `difficult` 放入句子 “it's ___ for me” 中，是否通顺并符合逻辑？", "hint": "读一读完整的句子：“Sorry, it's difficult for me.” 意思是对不起，这对我来说很难。", "takeaway": "填入 `difficult` 后，句子意思通顺，逻辑完整，是正确答案。"}]}, {"title": "句子结构分析", "steps": [{"question": "在句子 “it's d_____ for me” 中，`it's` 是哪两个词的缩写？", "hint": "它可以是 `it is` 或 `it has`。根据后面的形容词，应该是哪一个？", "takeaway": "`it's` 是 `it is` 的缩写。"}, {"question": "在 `主语 + is + ___` 这样的结构中，空格处通常填入什么词性的词来描述主语的状态或性质？", "hint": "例如：`The weather is nice.`，`nice` 是什么词？", "takeaway": "空格处通常填入形容词作表语，本题中 `difficult` 就是形容词。"}]}]}}, {"number": "5", "item_type": "fill_blank", "context_note": "", "stem": "My friends and I always play ping-pong after school. It's r_____ for us.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "relaxing", "explanation_md": "本题考查-ing形式形容词的用法。第一句说“我和朋友们总是在放学后打乒乓球”，描述了一项常规的、令人愉快的活动。第二句中的 `It` 指代“打乒乓球”这件事。空格处需要一个以 'r' 开头的形容词来描述这项活动带给人的感觉。放学后的体育活动通常是“令人放松的”。因此，根据首字母和语境，应填入 `relaxing`。`relaxing` 是形容词，意为“令人放松的”，用来修饰事物。完整的句子是 “It's relaxing for us.”（这对我们来说是件放松的事。）", "knowledge_expansion_md": "### -ing形容词 vs. -ed形容词\n\n这是一对非常重要且容易混淆的知识点，它们都由动词变化而来，但用法和意义有本质区别。\n\n1.  **-ing 形容词 (如 relaxing, interesting, exciting, boring)**\n    *   **意义**：表示“令人……的”，描述事物或人的内在属性，说明它能带给别人什么样的感觉。\n    *   **修饰对象**：通常修饰**事物**，有时也可修饰**人**（指这个人具有某种“令人……”的特质）。\n    *   **例句**：\n        *   `The music is relaxing.` (这音乐令人放松。) -> 修饰事物 music\n        *   `He is an interesting person.` (他是个有趣的人。) -> 修饰人 person，指他具有“令人感觉有趣”的特质。\n\n2.  **-ed 形容词 (如 relaxed, interested, excited, bored)**\n    *   **意义**：表示“感到……的”，描述人或动物自身的情绪或感受。\n    *   **修饰对象**：通常修饰**人**或能产生情感的**动物**。\n    *   **例句**：\n        *   `I feel relaxed when I listen to the music.` (听音乐时我感到很放松。) -> 修饰人 I 的感受。\n        *   `I am interested in history.` (我对历史感兴趣。) -> 修饰人 I 的感受。\n\n**本题辨析**：句子主语是 `It`，指代“打乒乓球”这件事。是这件事“令人放松”，而不是这件事“感到放松”，所以必须用-ing形式的形容词 `relaxing`。", "socratic_tracks": [{"title": "语境与逻辑推理", "steps": [{"question": "第一句话描述了什么活动？“always play ping-pong after school”通常是一种什么样的体验？", "hint": "放学后和朋友们一起运动，通常是为了好玩和休息。", "takeaway": "这是一种常规的、积极的休闲娱乐活动。"}, {"question": "那么，这项活动给人的感觉是什么？用一个以 'r' 开头的词来形容。", "hint": "与 `stressful` (有压力的) 相反的感觉是什么？", "takeaway": "这项活动是“令人放松的”（relaxing）。"}]}, {"title": "-ing 与 -ed 形容词辨析", "steps": [{"question": "在句子 “It's r_____ for us” 中，主语 `It` 指代的是人还是事物？", "hint": "联系上一句话，`It` 指代的是“打乒乓球”这件事。", "takeaway": "`It` 指代的是“打乒乓球”这件事，是事物。"}, {"question": "当我们要描述一个事物的性质是“令人感到……”时，应该用-ing结尾的形容词还是-ed结尾的形容词？", "hint": "想一想“一部有趣的电影”是 `an interesting movie` 还是 `an interested movie`？", "takeaway": "描述事物的性质，要用-ing结尾的形容词。"}, {"question": "所以，动词 `relax` 在这里应该变成什么形式来修饰 `It`？", "hint": "给动词 `relax` 加上 `-ing` 后缀。", "takeaway": "应该使用 `relaxing`。"}]}, {"title": "词汇与拼写", "steps": [{"question": "“放松”这个动作的英文动词原形是什么？", "hint": "这个词以 r-e-l 开头。", "takeaway": "动词原形是 `relax`。"}, {"question": "将 `relax` 变成-ing形式的形容词，拼写是怎样的？", "hint": "直接在动词后面加上-ing即可。", "takeaway": "拼写是 `relaxing`。"}]}]}}]}, {"section_title": "IV. 补全对话。(一空一词)(共10分)", "section_instruction": "A: Hello! Who is that?\nB: Hi, Jack. It's Frank here. It's a 1. _____ day. The sky(天空) is blue and the air is fresh(新鲜的).\nA: Yes. The weather(天气) is good!\nB: How about playing 2. _____?\nA: That 3. _____ fun, but I can't find my 4. _____. My parents aren't at home. If I don't 5. _____ it, I can't come back(返回) home.\nB: Let me 6. _____ you. Is it in your room?\nA: Yes. But my room is untidy. My school things and balls are everywhere. It's 7. _____ for me to find it.\nB: Then, is it 8. _____ your bed? If it falls to the ground(掉落在地上), it can be there.\nA: Let me see...I see my ping-pong balls and tennis balls, but it's not here.\nB: Is it in your English books?\nA: Oh, I love reading English every evening! Let me see...Oh, here it is! Thanks!\nB: You are 9. _____. Now you can come out to play with me. Don't forget (忘记) your ping-pong balls and bats.\nA: OK. Let's 10. _____ at 3 p. m.\nB: See you then!", "items": [{"number": "1", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "your", "explanation_md": "本题考查形容词性物主代词的用法。这是一段补全对话的题目，需要根据上下文推断缺失的单词。假设对话场景为初次见面，A向B打招呼并提问，B回答说：“My name is Tom.”（我的名字是汤姆）。从B的回答可以反推出，A问的是B的名字。询问对方名字的经典句型是 “What's your name?”。因此，空格处应填入形容词性物主代词 `your`，表示“你的”，用来修饰名词 `name`。", "knowledge_expansion_md": "### 人称代词与物主代词的区分\n\n在英语中，代词的格和形式非常重要，尤其是在对话中。\n\n1.  **形容词性物主代词 (Possessive Adjectives)**\n    *   **形式**: `my`, `your`, `his`, `her`, `its`, `our`, `their`\n    *   **功能**: 相当于形容词，必须放在名词前，表示“……的”，说明物品的归属。\n    *   **例句**: `This is my book.` `What's your name?`\n\n2.  **名词性物主代词 (Possessive Pronouns)**\n    *   **形式**: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`\n    *   **功能**: 相当于名词，可以单独使用，等于“形容词性物主代词 + 名词”。\n    *   **例句**: `This book is mine.` (= my book) `That pen is yours.` (= your pen)\n\n3.  **本题辨析**：空格后面有名词 `name`，因此需要一个起修饰作用的词，故选用形容词性物主代词。因为是询问对方，所以用 `your`。切不可与名词性物主代词 `yours` 混淆，也不能用人称代词 `you`。", "socratic_tracks": [{"title": "对话逻辑与反推", "steps": [{"question": "假设B的回答是 “My name is Tom.”，这句话是什么意思？", "hint": "“My name” 的意思是“我的名字”。", "takeaway": "B在告诉对方自己的名字是汤姆。"}, {"question": "既然B回答了自己的名字，那么A提出的问题应该是在问什么？", "hint": "如果别人告诉你他的名字，你之前可能问了什么？", "takeaway": "A应该是在询问B的名字。"}]}, {"title": "代词的功能与选择", "steps": [{"question": "在问题 “What's ___ name?” 中，横线后面的 `name` 是一个名词，我们需要一个什么词性的词来修饰它？", "hint": "我们想问“谁的”名字，这个“谁的”就是一个限定和修饰作用的词。", "takeaway": "我们需要一个形容词性的物主代词来修饰名词 `name`。"}, {"question": "因为A是在和B对话，询问B的名字，那么“你的”这个物主代词在英语中是哪个词？", "hint": "想一想“我的”是 `my`，“他的”是 `his`，那么“你的”是什么？", "takeaway": "“你的”在英语中是 `your`。"}]}, {"title": "常用句型回顾", "steps": [{"question": "在初次见面、互相介绍的场景中，询问对方姓名的最常用句型是什么？", "hint": "以 “What's...” 开头。", "takeaway": "最常用的句型是 “What's your name?”。"}, {"question": "将这个常用句型与题目 “What's ___ name?” 进行对比，横线上应该填什么？", "hint": "两个句子只差一个词。", "takeaway": "横线上应该填入 `your`。"}]}]}}, {"number": "2", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "miss", "explanation_md": "此处考察固定搭配。在指路场景中，“You can't miss it.” 是一个非常地道的固定表达，意为“你不会错过的”或“这个地方很显眼，很容易找到”。说话人B在详细指路后，用这句话来让问路人A安心，表示目的地非常容易辨认。", "knowledge_expansion_md": "### 动词 miss 的用法拓展\n\n`miss` 是一个多义词，在小升初阶段需要掌握其核心用法：\n1.  **错过（机会、事件等）**：指未能赶上或经历某事。\n    *   `I missed the bus this morning.` (我今天早上没赶上公交车。)\n    *   `Don't miss the chance!` (别错过机会！)\n2.  **想念，思念**：指因某人或某物不在而感到难过。\n    *   `I miss my family.` (我想念我的家人。)\n3.  **未击中，未达到**：\n    *   `He threw the ball but missed the target.` (他扔出了球，但没有击中目标。)\n\n### 固定搭配\n*   `can't miss it`: 你不会错过的（指路用语）。", "socratic_tracks": [{"title": "固定搭配", "steps": [{"question": "当别人给你指完路，说 “You can't ___ it.”，他最想表达的是什么意思？是说这个地方很难找，还是很容易找？", "hint": "想一想，如果一个人很自信地告诉你路线，他最后会是鼓励你还是让你觉得更复杂？", "takeaway": "这句话的目的是让问路人放心，表示目的地很显眼，容易找到。"}, {"question": "那么，哪个动词放在这里可以表达“错过”或“找不到”的含义，从而组成“你不可能找不到它”这个意思呢？", "hint": "在 lose, find, see, miss 这些词中，哪一个词有“错过”的意思？", "takeaway": "动词 miss 在这里意为“错过”，因此 “You can't miss it.” 是一个固定搭配，意为“你不会错过的”。"}]}, {"title": "动词辨析", "steps": [{"question": "我们学过动词 miss 的哪些意思？", "hint": "比如，你想念远方的朋友时会怎么说？或者，你早上没赶上校车时会怎么说？", "takeaway": "动词 miss 至少有两个常用意思：“想念”和“错过”。"}, {"question": "在这个句子 “You can't miss it.” 中，miss 是“想念”还是“错过”的意思？", "hint": "结合指路的语境，是“你不能想念它”还是“你不会错过它”更合理？", "takeaway": "在指路的情景下，miss 的意思是“错过”。"}]}, {"title": "语境逻辑", "steps": [{"question": "说话人B刚刚详细地描述了去医院的路线：“Go down this street and turn left at the second crossing. It's on your right.”，他的语气是肯定的还是不确定的？", "hint": "这是一个非常清晰、具体的指令。", "takeaway": "说话人B的语气非常肯定，他清楚地知道医院在哪里。"}, {"question": "在给出一个清晰的路线后，为了结束指路并让对方安心，最合乎逻辑的补充说明是什么？", "hint": "是补充说“那里很难找”，还是说“你放心，很好找”？", "takeaway": "合乎逻辑的补充是强调目的地很容易找到，因此需要一个词来完成“你不会错过它”这个意思。"}]}]}}, {"number": "3", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "minutes'", "explanation_md": "此处考察名词所有格的用法。当我们要表达“...时间的步行路程”时，常用“时间名词所有格 + walk”的结构。因为前面是 `twenty` (二十)，所以时间单位要用复数 `minutes`。而表示“的”这个所属关系，复数名词的所有格是在词尾的 `s` 后面直接加撇号 `'`。因此，正确的形式是 `minutes'`。", "knowledge_expansion_md": "### 名词所有格的特殊用法\n\n除了表示“某人的”之外，名词所有格（'s 或 s'）还可以用于表示时间、距离、价值等：\n\n1.  **表示时间**：\n    *   `a day's work` (一天的工作量)\n    *   `ten minutes' walk` (十分钟的步行路程)\n    *   `today's newspaper` (今天的报纸)\n\n2.  **表示距离**：\n    *   `a stone's throw` (一箭之遥，很近的距离)\n\n3.  **易错点对比**：\n    *   `ten minutes' walk` (名词所有格结构): 十分钟的步行路程。\n    *   `a ten-minute walk` (复合形容词结构): 一段十分钟的步行路程。注意 `ten-minute` 作形容词时，`minute` 用单数形式。\n\n本题的结构是 `twenty ___ walk`，前面没有冠词 `a`，因此只能使用名词所有格结构。", "socratic_tracks": [{"title": "名词所有格", "steps": [{"question": "当我们要表达“...的步行路程”时，比如“十分钟的路程”，在英语中有什么表达方式？", "hint": "这涉及到“属于”十分钟的步行路程，需要用到所有格。", "takeaway": "我们可以用名词所有格来表达，例如 `ten minutes' walk`。"}, {"question": "为什么是 `minutes'` 而不是 `minute's` 或 `minutes`？", "hint": "首先，`twenty` 是复数还是单数？其次，复数名词的所有格应该怎么表示？", "takeaway": "因为 `twenty` 是复数，所以用 `minutes`；而以 `s` 结尾的复数名词，其所有格是在 `s` 后面直接加撇号 `'`。"}]}, {"title": "语境与单位", "steps": [{"question": "A问的是 “How far is it?” (有多远？)，B回答的是步行所需的时间。根据常识，描述一段不长不短的步行距离，最常用的时间单位是什么？", "hint": "是秒(seconds)、分钟(minutes)还是小时(hours)？", "takeaway": "用“分钟”(minutes)来描述步行二十分钟左右的路程是最符合生活常识的。"}, {"question": "既然确定了单位是 `minutes`，为什么不能只填 `minutes` 呢？“twenty minutes walk” 对吗？", "hint": "“twenty minutes” 和 “walk” 都是名词，两个名词直接放在一起通常是不对的，需要一个东西把它们连接起来表示所属关系。", "takeaway": "为了表示“二十分钟的步行路程”，需要在 `minutes` 后面加上表示所有格的撇号。"}]}, {"title": "结构辨析", "steps": [{"question": "你见过 `a ten-minute walk` 这种说法吗？它和 `ten minutes' walk` 有什么区别？", "hint": "注意第一种说法里有冠词 `a` 和连字符 `-`，`minute` 还是单数。", "takeaway": "`a ten-minute walk` 中 `ten-minute` 是一个复合形容词，用来修饰名词 `walk`。而 `ten minutes' walk` 是名词所有格结构。"}, {"question": "回到题目，`It's about twenty ___ walk.` 前面没有冠词 `a`，所以我们应该用哪种结构？", "hint": "没有 `a`，就无法构成 `a ... walk` 的形容词结构。", "takeaway": "题干的结构决定了我们必须使用名词所有格 `minutes'` 来填空。"}]}]}}, {"number": "4", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "take", "explanation_md": "此处考察关于交通工具的动词搭配。在英语中，表达“乘坐”某种公共交通工具（如公交车、地铁、火车等），最常用的动词是 `take`。句子 `You can take the No. 1 bus.` 意为“你可以乘坐1路公交车”。这是给对方提出的具体建议，符合对话的语境。", "knowledge_expansion_md": "### 交通方式的动词搭配\n\n掌握不同交通工具和动词的搭配是英语学习的基础：\n*   **take**: 最通用的“乘坐”，常用于公共交通。\n    *   `take a bus / the subway / a train / a taxi / a plane`\n*   **ride**: “骑”或“乘坐”，常用于跨坐的交通工具或作为乘客。\n    *   `ride a bike / a horse / a motorcycle`\n    *   `ride in a car` (作为乘客坐在车里)\n    *   `ride on a bus` (作为乘客在公交车上，强调“在上面”的状态)\n*   **drive**: “驾驶”，指自己开车。\n    *   `drive a car / a truck`\n*   **catch**: “赶上”，常带有匆忙、及时的意味。\n    *   `catch a bus / a train` (强调赶上了车)\n*   **get on / get off**: “上车”/“下车”，强调上下交通工具的动作。\n    *   `get on the bus`, `get off the train`", "socratic_tracks": [{"title": "动词搭配", "steps": [{"question": "当你想告诉别人可以“乘坐”公交车去某个地方时，最常用的动词是什么？", "hint": "这个动词非常通用，不仅可以用于公交车，还可以用于地铁、出租车等。", "takeaway": "动词 `take` 是表达“乘坐”公共交通工具最常用的词。"}, {"question": "除了 `take`，你还能想到其他和公交车有关的动词吗？比如 `catch` 或 `ride`？它们和 `take` 有什么区别？", "hint": "`catch` 强调“赶上”，`ride` 也可以表示“乘坐”，但 `take` 在给出建议时最为普遍和自然。", "takeaway": "虽然 `catch` 和 `ride` 也能用于公交车，但在“你可以乘坐...”这种建议性句式中，`take` 是最标准、最常用的动词。"}]}, {"title": "语法结构", "steps": [{"question": "在句子 `You can ___ the No. 1 bus.` 中，`can` 是一个什么词？", "hint": "它表示“能够”或“可以”，和 `must`, `should`, `may` 属于同一类词。", "takeaway": "`can` 是一个情态动词。"}, {"question": "情态动词后面跟的动词应该使用什么形式？", "hint": "是动词原形、过去式还是现在分词？想一想 `I can swim.` 这个句子。", "takeaway": "情态动词后面必须跟动词原形。"}, {"question": "结合上一步的结论和语境，我们需要在这里填一个表示“乘坐”的动词原形，这个词是什么？", "hint": "这个词以 `t` 开头。", "takeaway": "结合语法规则和语意，应填入动词原形 `take`。"}]}, {"title": "对话功能", "steps": [{"question": "回顾一下对话，A 问：“Is there a bus to the hospital?” (有去医院的公交车吗？)。B 回答 “Yes.”，那么 B 接下来这句话的目的是什么？", "hint": "A 提出了一个问题，B 在回答并提供更具体的信息。", "takeaway": "B 的目的是给 A 提供一个具体的解决方案或建议。"}, {"question": "为了完成“你可以乘坐1路公交车”这个建议，应该用哪个动词来连接主语 `You` 和宾语 `the No. 1 bus`？", "hint": "这个动词表示一个“采纳”或“使用”某种交通方式的动作。", "takeaway": "动词 `take` 完美地承载了“采纳交通方式”这一功能，使得建议清晰完整。"}]}]}}, {"number": "5", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "opposite", "explanation_md": "此处考察表示方位的介词。A 问公交站在哪里，B 回答 “It's over there”（就在那边），并用银行作为参照物来指出更精确的位置。根据图片，公交站牌和银行建筑分别在一条马路的两侧，是相互“对面”的位置关系。因此，介词 `opposite` (在...对面) 最符合图示和语境。", "knowledge_expansion_md": "### 表示位置关系的介词\n\n精确描述物体位置是英语表达的重要一环，尤其是在问路和指路时。以下是几个需要重点区分的介词：\n*   **opposite**: 在...对面。通常指隔着一条街、一个房间、一张桌子等，两者相对。\n    *   `The school is opposite the park.` (学校在公园对面。)\n*   **next to / beside**: 在...旁边，紧邻着。\n    *   `The library is next to the post office.` (图书馆在邮局旁边。)\n*   **near**: 在...附近。比 `next to` 的范围更广，不一定紧挨着。\n    *   `There is a supermarket near my home.` (我家附近有个超市。)\n*   **in front of**: 在...（外部的）前面。\n    *   `There is a car in front of the house.` (房子前面有辆车。)\n*   **behind**: 在...后面。\n    *   `The garden is behind the house.` (花园在房子后面。)", "socratic_tracks": [{"title": "介词辨析", "steps": [{"question": "我们学过哪些表示“在...旁边”或“在...对面”的介词？", "hint": "想一想 `next to`, `near`, `beside`, `opposite` 这些词。", "takeaway": "表示位置的常用介词有 `next to` (紧邻), `near` (附近), `beside` (旁边), `opposite` (对面)等。"}, {"question": "观察图片，公交站和银行之间有什么？它们是紧挨着还是隔开的？", "hint": "注意它们中间有一条马路。", "takeaway": "公交站和银行被一条马路隔开，处于相对的位置。"}, {"question": "那么，哪个介词最能准确地描述这种“隔街相望”的位置关系？", "hint": "这个词以 `o` 开头。", "takeaway": "介词 `opposite` 专门用来表示“在...对面”的关系，最符合图示场景。"}]}, {"title": "读图能力", "steps": [{"question": "请描述一下你在题目图片中看到了什么主要元素。", "hint": "有一个公交站牌，一个写着 `BANK` 的大楼，还有它们之间的空间。", "takeaway": "图片的主要元素是公交站、银行和它们之间的马路。"}, {"question": "根据这些元素的位置关系，用一个中文词来形容它们，是“并排”还是“相对”？", "hint": "如果要去另一个地方需要过马路，那就是“相对”或“对面”。", "takeaway": "公交站和银行的位置关系是“相对”的。"}, {"question": "现在，请将“相对”或“对面”这个位置关系翻译成一个合适的英语介词。", "hint": "这个词是 `opposite`。", "takeaway": "通过准确解读图片信息，我们可以确定需要使用 `opposite` 来描述位置关系。"}]}, {"title": "单复数与词性", "steps": [{"question": "题目要求“一空一词”，也就是只能填一个单词。我们想到的 `next to` 符合要求吗？", "hint": "`next to` 是由几个单词组成的？", "takeaway": "`next to` 是一个介词短语，由两个词组成，不符合“一空一词”的要求。"}, {"question": "那么，我们需要找一个单词来表示位置关系。`beside`, `near`, `opposite` 都是一个单词。结合图片，为什么 `beside` 和 `near` 不如 `opposite` 好？", "hint": "`beside` 意为“紧挨着”，`near` 意为“在附近”，而图片显示的是隔着马路面对面。", "takeaway": "只有 `opposite` 能最精确地描述图中“隔街相对”的场景，且符合“一空一词”的要求。"}]}]}}, {"number": "6", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "favorite", "explanation_md": "此处需要一个形容词来修饰“animal”（动物）。根据下文B的回答“Pandas. They are my favorite.”（熊猫。它们是我的最爱。），可以推断出G是在问B“最喜欢的”动物是什么。因此，填入“favorite”（最喜爱的）符合对话逻辑。整个问句“What's your favorite animal?”是询问个人偏好的常用句型。", "knowledge_expansion_md": "### 词汇辨析：`favorite` vs `favourite`\n- `favorite` 是美式英语拼写，`favourite` 是英式英语拼写，两者意思完全相同，均为“最喜爱的（东西或人）”。在考试中通常两种拼写都可接受。\n\n### 句型拓展：询问偏好\n- “What's your favorite + 名词?” 是一个非常基础且重要的句型，用于询问他人最喜欢的事物。\n  - 例如: `What's your favorite color?` (你最喜欢的颜色是什么？)\n  - `What's your favorite subject?` (你最喜欢的科目是什么？)\n\n### 词性注意\n- `favorite` 在这里作形容词，修饰名词 `animal`。\n- `favorite` 也可以作名词，意为“最喜爱的人或物”。例如：`She is the teacher's favorite.` (她是老师最喜欢的学生。)", "socratic_tracks": [{"title": "上下文线索推理", "steps": [{"question": "对话中，男孩B是如何回答女孩G的问题的？", "hint": "请看B回答的第二句话：“They are my favorite.”", "takeaway": "下文的回答“它们是我的最爱”直接揭示了上一句问题的内容。"}, {"question": "“They are my favorite.” 这句话里的 “favorite” 是什么意思？", "hint": "这个词描述了他对熊猫的感情。", "takeaway": "“favorite”意为“最喜爱的”，因此问题是在询问“最喜爱的”动物。"}]}, {"title": "句型结构分析", "steps": [{"question": "“What's your ___ animal?” 这个句子里，空缺的词应该是什么词性？", "hint": "这个词用来修饰名词 “animal”，告诉我们是“什么样的”动物。", "takeaway": "在名词前起修饰作用的通常是形容词。"}, {"question": "如果想用英语问别人“你最喜欢的食物是什么？”，你会怎么说？", "hint": "套用“What's your favorite ...?”这个句型。", "takeaway": "询问“最喜欢的”事物，固定句型中的核心词就是 `favorite`。"}]}, {"title": "词汇拼写与用法", "steps": [{"question": "你知道 `favorite` 这个词还有别的拼写方式吗？", "hint": "想一想美式英语和英式英语的区别，比如 `color` 和 `colour`。", "takeaway": "`favorite` 是美式拼写，`favourite` 是英式拼写，两者都正确。"}, {"question": "除了作形容词，`favorite` 还能作名词用吗？", "hint": "比如在句子 “These songs are my favorites.” 中，`favorites` 是什么词性？", "takeaway": "`favorite` 既可以作形容词（最喜爱的），也可以作名词（最喜爱的人或物）。"}]}]}}, {"number": "7", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "cute", "explanation_md": "此处需要一个形容词来描述熊猫给人的感觉。根据上下文，对话双方对熊猫都持积极、喜爱的态度。结合熊猫通常给人的印象（可爱、讨人喜欢），填入“cute”（可爱的）非常贴切。前面的副词“so”表示“如此地”，用来加强形容词的语气，说明熊猫看起来“非常可爱”。其他如 `lovely` (可爱的) 也是可能的答案。", "knowledge_expansion_md": "### 感官动词（Linking Verbs）用法\n- `look` 在这里是感官动词，也叫系动词，意为“看起来”。其后应接形容词作表语，用来说明主语的状态或特征。\n- 常见的感官动词还有：`sound` (听起来), `feel` (感觉起来), `smell` (闻起来), `taste` (尝起来)。\n- 例如：`The music sounds beautiful.` (这音乐听起来很美。)\n\n### 描述性形容词\n- 描述动物外貌或特性的常见形容词有：\n  - **褒义**: `cute` (可爱的), `lovely` (可爱的), `adorable` (讨人喜爱的), `fluffy` (毛茸茸的), `gentle` (温顺的)\n  - **中性/贬义**: `big` (大的), `huge` (巨大的), `small` (小的), `fierce` (凶猛的), `dangerous` (危险的)\n\n### 强调副词 `so`\n- `so` 是一个程度副词，用于加强形容词或副词的语气，意为“如此，那么”。\n- 句型：`so + adj./adv.`\n- 例如：`It's so cold today.` (今天太冷了。) `He runs so fast.` (他跑得真快。)", "socratic_tracks": [{"title": "描述词汇联想", "steps": [{"question": "当我们谈论熊猫时，通常会用哪些词来形容它们的外表？", "hint": "想想熊猫黑白相间、圆滚滚的样子，会让你有什么感觉？", "takeaway": "“cute”（可爱的）是描述熊猫最常用、最贴切的形容词之一。"}]}, {"title": "语法结构分析", "steps": [{"question": "在句子 “They look so ___.” 中，“look” 是什么类型的动词？", "hint": "这个动词后面不是跟一个动作，而是描述主语“看起来怎么样”。", "takeaway": "`look` 在这里是感官动词（系动词），意为“看起来”。"}, {"question": "感官动词（如 `look`, `sound`, `feel`）后面通常跟什么词性的词？", "hint": "参考例子：`You look happy.` `It sounds great.`", "takeaway": "感官动词后面通常跟形容词，作表语，描述主语的状态。"}]}, {"title": "副词 `so` 的作用", "steps": [{"question": "句中的 `so` 起到了什么作用？如果去掉它，句子意思有什么变化？", "hint": "比较 “They look cute.” 和 “They look so cute.” 的语气。", "takeaway": "`so` 是程度副词，用来加强语气，表示“非常、如此地”，使情感表达更强烈。"}]}]}}, {"number": "8", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "from", "explanation_md": "此处考察询问来源地的固定句型。根据下文B的回答“They are from China.”（它们来自中国），可以判断G的问题是询问熊猫的来源地。固定搭配“be from”意为“来自……”，因此询问来源地的疑问句应为“Where are ... from?”。故此处应填入介词“from”。", "knowledge_expansion_md": "### 固定句型：询问来源/出处\n- `Where + be动词 + 主语 + from?` 是询问某人或某物来自哪里的标准句型。\n- 回答：`主语 + be动词 + from + 地点.`\n- 例如：\n  - `Where are you from?` (你来自哪里？)\n  - `I'm from Beijing.` (我来自北京。)\n\n### 介词辨析：`from` vs `in`\n- `from` 表示“来源、起点”，强调“从哪里来”。\n- `in` 表示“位置”，强调“在什么地方”。\n- 比较：\n  - `Where are the pandas from?` (熊猫产自哪里？) -> `They are from China.` (它们来自中国。)\n  - `Where are the pandas?` (熊猫在哪里？) -> `They are in the zoo.` (它们在动物园里。)\n\n### `from` 的其他用法\n- 表示时间的起点：`from Monday to Friday` (从周一到周五)\n- 表示距离的起点：`from my home to school` (从我家到学校)\n- 表示材料来源：`Wine is made from grapes.` (葡萄酒是葡萄酿造的。)", "socratic_tracks": [{"title": "从答案反推问题", "steps": [{"question": "看到男孩的回答是 “They are from China.”，这句话是什么意思？", "hint": "“from China” 的意思是“来自中国”。", "takeaway": "这个回答表明了熊猫的来源地是中国。"}, {"question": "既然回答是关于“来自哪里”，那么提问时应该使用哪个句型？", "hint": "想一想如何用英语问“你来自哪里？”", "takeaway": "询问来源地的固定句型是 “Where are ... from?”。"}]}, {"title": "介词 `from` 的核心意义", "steps": [{"question": "“from”这个介词最基本的意思是什么？", "hint": "想想短语 “from home to school”（从家到学校），“from” 在这里表示什么？", "takeaway": "`from` 的核心意义是表示“来源”或“起点”。"}, {"question": "在这个对话中，女孩想知道熊猫的“起点”或“来源地”，所以应该用哪个词来完成这个问句？", "hint": "这个词需要和 `Where are they` 结合，构成一个询问来源的完整问题。", "takeaway": "使用 `from` 正好可以表达询问来源地的意思。"}]}, {"title": "常见搭配与易混淆点", "steps": [{"question": "如果我想问“熊猫现在在哪里？”，而不是“它们来自哪里？”，我应该怎么问？", "hint": "只问当前位置，不需要表示“来源”。", "takeaway": "询问当前位置用 `Where are the pandas?`，不需要 `from`。"}, {"question": "为什么这里不能填 `in`？“Where are they in?” 听起来对吗？", "hint": "`in` 表示“在...里面”，通常问的是在某个更大范围内的具体位置，比如 `in which city?`", "takeaway": "询问国籍或产地这类宏观的来源信息，固定搭配是 `be from`，而不是 `be in`。"}]}]}}, {"number": "9", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "anything", "explanation_md": "此处考察不定代词 `anything` 和 `something` 的用法。这个句子 “Do you know ___ else about them?” 是一个一般疑问句，意为“关于它们，你还知道其他（任何）事情吗？”。在一般疑问句和否定句中，通常使用 `anything` 来表示“任何事/物”。`something` 通常用于肯定句中。因此，此处应填 `anything`。", "knowledge_expansion_md": "### 不定代词：`anything` vs `something`\n- **`something`** (某事；某物): 通常用于**肯定句**中。\n  - `I want to eat something.` (我想吃点东西。)\n  - 特殊情况：在表示请求、提议或期望得到肯定回答的疑问句中，也可以用 `something`。\n    - `Would you like something to drink?` (你想喝点什么吗？) (提议)\n\n- **`anything`** (任何事；任何物): 通常用于**否定句**和**疑问句**中。\n  - `I don't know anything about it.` (关于这件事我什么都不知道。) (否定句)\n  - `Is there anything I can do for you?` (有什么我能为你做的吗？) (疑问句)\n\n### 短语 `... else`\n- `else` 是一个副词，意为“别的，其他的”，常跟在疑问词或不定代词后面。\n- 常见搭配：`what else` (还有什么), `who else` (还有谁), `somewhere else` (其他地方), `somebody else` (其他人), `nothing else` (没有别的事了)。\n- `anything else` 的意思就是“任何其他的事情”。", "socratic_tracks": [{"title": "辨析 `anything` 与 `something`", "steps": [{"question": "“Do you know...?” 开头的这个句子，是肯定句、否定句还是疑问句？", "hint": "句子的结构和句末的标点符号可以帮助你判断。", "takeaway": "这是一个以助动词 `Do` 开头的一般疑问句。"}, {"question": "在一般疑问句中，当我们想表达“任何事情”或“什么东西”时，通常用 `anything` 还是 `something`？", "hint": "回想一下老师讲过的规则：`some` 用于肯定句，`any` 用于否定和疑问句。", "takeaway": "在一般疑问句和否定句中，我们通常使用 `anything`。"}]}, {"title": "理解短语 `... else`", "steps": [{"question": "短语 `anything else` 是什么意思？", "hint": "`else` 的意思是“其他的，另外的”。", "takeaway": "`anything else` 的意思是“任何其他的事情”。"}, {"question": "这个意思符合对话的逻辑吗？女孩知道了熊猫来自中国，她还想了解更多。", "hint": "她是在问“除了这个，还有别的吗？”", "takeaway": "是的，女孩在寻求更多额外的信息，所以 `anything else` 完全符合语境。"}, {"question": "你能再举一个包含 `else` 的例子吗？比如问“还有谁要去？", "hint": "把 `anything` 换成表示“谁”的疑问词。", "takeaway": "可以说 `Who else is going?`，`else` 可以灵活地跟在疑问词或不定代词后。"}]}, {"title": "特殊用法探讨", "steps": [{"question": "是不是所有疑问句都只能用 `anything`，绝对不能用 `something` 呢？", "hint": "想一想，当服务员问你 “Would you like something to drink?” 时，为什么用 `something`？", "takeaway": "在表示提议、请求或期望得到肯定回答的疑问句中，可以用 `something`。"}, {"question": "那么，我们这个句子 “Do you know ___ else about them?” 属于这种情况吗？", "hint": "女孩是在真诚地提问，并不一定期望对方肯定知道，也不是在提议。", "takeaway": "这个句子是一个纯粹的信息询问，不属于特殊情况，因此应使用 `anything`。"}]}]}}, {"number": "10", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "together", "explanation_md": "本题考查对话的语境理解和副词的使用。\n1.  **语境分析**：对话中，A 提议“Let's go and make a snowman...”，B 回答“Great! Let's go.”，表示欣然同意。这表明 A 是在邀请 B 与他一同行动。\n2.  **词义选择**：为了表达“一同行动”的含义，我们需要一个表示“一起”的词。\n3.  **词性与位置**：副词 `together` 意为“一起，共同地”，通常放在动词或句末，用来修饰动作。放在这里表示“让我们一起去堆雪人吧”，完全符合对话的逻辑和语气。\n4.  **结论**：因此，填入 `together` 最为恰当。", "knowledge_expansion_md": "### 1. 副词 `together` 的用法\n`together` 是一个常用的副词，表示动作由两个或更多的人/物共同完成或发生。\n- **修饰动词**：常放在动词短语之后。例如：`We study English together.` (我们一起学习英语。)\n- **构成短语**：\n  - `get together`: 聚会，聚集\n  - `put together`: 组合，装配\n  - `work together`: 合作，共事\n\n### 2. 提建议的常用句型\n在英语中，提出建议有多种方式，熟练掌握有助于口语和写作：\n- **`Let's + 动词原形...`** (肯定建议，表示“让我们做某事吧”，包含说话人)\n  - 例：`Let's go to the park.`\n- **`What about / How about + V-ing / 名词?`** (询问对方意愿，表示“...怎么样？”)\n  - 例：`How about playing football?`\n- **`Shall we + 动词原形...?`** (征求对方意见，表示“我们...好吗？”)\n  - 例：`Shall we start now?`\n- **`Why don't you / we + 动词原形...?`** (以否定形式提出的肯定建议，语气委婉)\n  - 例：`Why don't we have a rest?`", "socratic_tracks": [{"title": "对话逻辑推断", "steps": [{"question": "对话中，A 对 B 说了什么？B 是如何回应的？", "hint": "A 说 “Let's go and make a snowman”，B 回答 “Great! Let's go.”。", "takeaway": "B 同意了 A 的提议，表明他们要一起行动。"}, {"question": "既然他们要一起行动，那么在 A 的邀请中填入哪个词最能体现这种“共同”的意味？", "hint": "这个词在中文里是“一起”的意思。", "takeaway": "填入 `together` 最符合对话双方将要共同行动的语境。"}]}, {"title": "词性与句子成分", "steps": [{"question": "“Let's go and make a snowman” 这句话本身完整吗？它表达了什么意思？", "hint": "这是一个完整的祈使句，意思是“我们去堆雪人吧”。", "takeaway": "这是一个完整的建议，但可以加上词语来补充更多信息。"}, {"question": "我们想在句末加一个词，来修饰“堆雪人”这个动作的方式。这个词应该是什么词性？", "hint": "修饰动词的词通常是副词。", "takeaway": "副词 `together` 用来修饰动词，表示动作是共同完成的。"}]}, {"title": "句型结构应用", "steps": [{"question": "“Let's...” 是一个什么样的句型？它通常用来做什么？", "hint": "比如 “Let's play.” (我们玩吧。)，这是一个邀请或建议。", "takeaway": "`Let's + 动词原形` 是提出建议的常用句型，表示“让我们（一起）做某事”。"}, {"question": "在这个句型后面，我们还能加上什么成分来让建议更具体？比如想强调“和朋友们一起”或者“在公园里”。", "hint": "比如 `Let's play football in the park.` 或者 `Let's go to the cinema with friends.`", "takeaway": "我们可以在 `Let's` 句型后加上状语（如地点、时间、方式）来丰富句子信息，`together` 就是一个表示方式的副词。"}]}]}}]}, {"section_title": "V. 短文填空。从方框中选出正确单词将其正确形式填在横线上。(每词限用一次)(共10分)", "section_instruction": "Word Bank: class, classmate, cousin, difficult, game, one, play, relaxing, sister, say, sport, it\n\nI am Linda. Jenny and I are 1. _____. We are in the same school. We love our school. We don't only have 2. _____ in school. We play 3. _____, too. I am in Grade 7. I have four classes in the morning. My 4. _____ class in the afternoon is P. E. (体育). I like ping-pong, but it's 5. _____ for me. I love tennis. I have two tennis rackets and six tennis balls. I play tennis with my three 6. _____. It is 7. _____. I love baseball, too. But I don't play 8. _____. I only watch baseball 9. _____ on TV. Jenny likes ping-pong, too. She thinks it is interesting.\nAt home, Jenny is always tidy. Her books are in the bookcase. Her keys are in her schoolbag. She can find her things easily. But I can't. My books and notebooks are everywhere. My mum 10. _____ her two daughters are so different!", "items": [{"number": "1", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "write", "explanation_md": "本题考查固定搭配和动词原形的使用。\n1.  **文体分析**：文章以 `Dear Linda,` 开头，以 `Yours, Li Lei` 结尾，这是一封信。\n2.  **语境理解**：第一句话是写信人向收信人问好并说明写信的动作。`I'm very glad to ... to you.` 意为“我很高兴...给你”。\n3.  **句型结构**：`be glad to do sth.` 是一个固定句型，意为“很高兴做某事”，其中 `to` 是不定式符号，后面必须跟动词原形。\n4.  **词汇选择**：结合“写信”的语境和备选词库，动词 `write` (写) 最为合适，构成短语 `write to sb.` (给某人写信)。\n5.  **结论**：因此，此处应填入动词原形 `write`。", "knowledge_expansion_md": "### 1. `be + 形容词 + to do sth.` 句型\n这是一个非常实用的句型，用于表达做某事时的心情或感受。\n- `be glad/happy to do sth.` (很高兴做某事)\n- `be sad to do sth.` (很难过做某事)\n- `be sorry to do sth.` (很抱歉做某事)\n- `be ready to do sth.` (准备好做某事)\n**关键点**：`to` 后面必须跟动词原形。\n\n### 2. 书信常用语\n- **开头**：\n  - `How are you?` / `How is it going?` (你好吗？)\n  - `I'm glad to hear from you.` (很高兴收到你的来信。)\n  - `Thank you for your last letter.` (感谢你上一封信。)\n- **结尾**：\n  - `I'm looking forward to hearing from you.` (我期待你的回信。)\n  - `Best wishes!` / `With best regards,` (致以最好的祝愿。)\n  - `Yours,` / `Sincerely,` (你真挚的，)\n\n### 3. `write` 的相关短语\n- `write to sb.`: 给某人写信\n- `write sth. down`: 把某事写下来，记下来\n- `write about sth.`: 写关于某事的内容", "socratic_tracks": [{"title": "句型结构分析", "steps": [{"question": "看到句子中的 “glad to”，你首先会想到这是一个什么样的结构？`to` 后面应该跟什么词性的词？", "hint": "比如 `nice to meet you`，`to` 后面跟的是动词 `meet`。", "takeaway": "`be + 形容词 + to do sth.` 是一个固定句型，`to` 后面要跟动词原形。"}, {"question": "那么，从方框中选一个动词，填入后能和后面的 `to you` 组成一个通顺的、与“写信”这个场景相关的短语。", "hint": "哪个动词可以和 `to you` 搭配，表示一种交流方式？", "takeaway": "动词 `write` 和 `to you` 构成 `write to you` (给你写信)，完全符合句意。"}]}, {"title": "语境推断", "steps": [{"question": "这篇文章的格式是怎样的？开头有 `Dear Linda,` 结尾有 `Yours, Li Lei`。", "hint": "这很明显是一封信的格式。", "takeaway": "识别出文体是书信，是理解内容的关键第一步。"}, {"question": "在一封信的开头，作者通常会做什么？", "hint": "问候对方，并说明写信的目的或表达写信时的心情。", "takeaway": "信件开头通常会表达写信的喜悦或目的，因此“很高兴给你写信”是常见的开场白。"}, {"question": "结合“写信”这个场景，方框里哪个动词最适合放在 “I'm very glad to ... to you” 这句话里？", "hint": "哪个词是“写”的意思？", "takeaway": "`write` (写) 是唯一符合“写信”这一语境的动词。"}]}, {"title": "备选词汇辨析", "steps": [{"question": "我们把方框里的动词都看一下：`visit`, `make`, `come`, `write`。它们分别是什么意思？", "hint": "`visit` (拜访), `make` (制作), `come` (来), `write` (写)。", "takeaway": "明确每个备选动词的基本含义是解题的基础。"}, {"question": "试着把这些动词填入 “I'm very glad to ___ to you.” 这个句子中，哪个最通顺且符合逻辑？", "hint": "“很高兴拜访给你”？“很高兴制作给你”？“很高兴来给你”？“很高兴写给你”？", "takeaway": "只有 `write` 填入后，句子在语法和逻辑上都是正确且最合理的。"}]}]}}, {"number": "2", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "friends", "explanation_md": "本题考查名词的数和上下文指代关系。\n1.  **上下文指代**：空格前的代词 `They` 指代的是上一句中提到的 `forty-five students` (四十五名学生)。\n2.  **语境理解**：句子 `They are all my good ______` 意为“他们都是我的好...”。结合语境，作者是在描述他与同学之间的关系。\n3.  **词汇选择**：从备选词中选择 `friend` (朋友) 最符合逻辑，表示同学们都是他的好朋友。\n4.  **语法形式**：因为主语 `They` 是复数（指代45个学生），所以与其对应的表语名词也必须使用复数形式。`friend` 是可数名词，其复数形式是在词尾加 `-s`，变为 `friends`。\n5.  **结论**：因此，此处应填入 `friends`。", "knowledge_expansion_md": "### 1. 名词的单复数\n英语中，可数名词有单数和复数之分。当指代一个以上的人或物时，需使用复数形式。\n- **常规变化**：大部分名词词尾加 `-s`，如 `book` -> `books`, `friend` -> `friends`。\n- **特殊变化**：\n  - 以 `s, x, ch, sh` 结尾，加 `-es`，如 `bus` -> `buses`, `box` -> `boxes`。\n  - 以“辅音字母+y”结尾，变 `y` 为 `i` 加 `-es`，如 `city` -> `cities`。\n  - 以 `f` 或 `fe` 结尾，多为变 `f/fe` 为 `v` 加 `-es`，如 `leaf` -> `leaves`。\n  - 不规则变化需特殊记忆，如 `man` -> `men`, `child` -> `children`, `foot` -> `feet`。\n\n### 2. 主语与表语的一致性\n在 `主语 + be动词 + 表语` 结构中，当主语是复数时，表语中表示身份、职业等的可数名词通常也要用复数形式，以保持数的一致性。\n- `He is a student.` (主语 `He` 是单数，表语 `student` 是单数)\n- `They are students.` (主语 `They` 是复数，表语 `students` 是复数)", "socratic_tracks": [{"title": "语法一致性", "steps": [{"question": "空格所在句子的主语是哪个词？它指代的是单数还是复数？", "hint": "主语是 `They`，它指代前一句的 `forty-five students`。", "takeaway": "主语 `They` 是复数，指代45名学生。"}, {"question": "既然主语是复数，那么用来描述这些学生身份的名词，应该用单数形式还是复数形式？", "hint": "比如，我们说 “They are students.” 而不是 “They are student.”。", "takeaway": "为了保持数的一致性，表示复数主语身份的名词也需要用复数形式。"}, {"question": "从方框中选择 `friend`，并把它变成正确的形式填入空中。", "hint": "`friend` 的复数形式是什么？", "takeaway": "可数名词 `friend` 的复数形式是 `friends`。"}]}, {"title": "上下文与词汇", "steps": [{"question": "这句话 “They are all my good ______.” 是在描述谁？", "hint": "往前看，`They` 指代的是 `forty-five students in my class`。", "takeaway": "这句话描述的是作者和班上同学之间的关系。"}, {"question": "你认为作者会把同学称作他的什么？从方框里找一个最合适的词。", "hint": "备选词有 `I`, `visit`, `make`, `one`, `come`, `friend`... 哪个词表示一种人际关系？", "takeaway": "`friend` (朋友) 是描述同学关系最恰当的词。"}]}, {"title": "词形变化规则", "steps": [{"question": "为什么我们不能直接填 `friend`？", "hint": "看看句子主语 `They` 和前文提到的数量 `forty-five`。", "takeaway": "因为主语是复数，指的是多个人，所以对应的名词也必须是复数。"}, {"question": "`friend` 这个词变成复数，应该怎么变？这是哪一种变化规则？", "hint": "这是最常见的名词变复数规则。", "takeaway": "大多数可数名词变复数直接在词尾加 `-s`，所以 `friend` 变为 `friends`。"}]}]}}, {"number": "3", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "coming", "explanation_md": "本题考查固定搭配 `look forward to` 的用法。\n1.  **句型分析**：`look forward to` 是一个固定短语，意为“期待，盼望”。\n2.  **语法关键**：此短语中的 `to` 是一个**介词**，而不是不定式符号。因此，其后应接名词或动词的-ing形式（即动名词）。\n3.  **语境与词汇选择**：句子意为“我期待...从你那里”。在书信结尾，通常是期待收到对方的回信。标准表达是 `hearing from you`。然而，备选词库中没有 `hear`。\n4.  **逻辑推断**：在现有词库中，`come` (来) 是唯一可以表示“从某处传来”的动作。虽然 `coming from you` 不是地道的表达，但在此题的特定限制下，它可能被用来指代“期待有东西（如信件、消息）从你那里过来”。\n5.  **词形变化**：根据 `look forward to + v-ing` 的规则，动词 `come` 需变为动名词 `coming`。\n6.  **结论**：因此，本题在有限的选项内，最可能的答案是 `coming`。", "knowledge_expansion_md": "### 1. 核心短语：`look forward to`\n- **含义**：期待，盼望。\n- **语法**：这是一个动词短语，关键在于 `to` 是**介词**。因此，后面只能跟**名词**或**动名词 (v-ing)**。\n- **正确示例**：\n  - `I'm looking forward to the summer holiday.` (我盼望着暑假。) - 跟名词\n  - `She is looking forward to meeting her grandparents.` (她盼望着见到她的祖父母。) - 跟动名词\n- **常见错误**：`I'm looking forward to see you.` (×) 误将 `to` 当作不定式符号，后面跟了动词原形。\n\n### 2. 动名词的构成\n- **规则**：在动词原形后加 `-ing`。\n- **特殊情况**：\n  - 以不发音的 `e` 结尾，去 `e` 加 `-ing`：`come` -> `coming`, `write` -> `writing`。\n  - 以“辅音+元音+辅音”结尾的重读闭音节，双写末尾辅音再加 `-ing`：`run` -> `running`, `swim` -> `swimming`。\n\n### 3. 关于本题的特别说明\n在真实的英语交流和写作中，表达“期待收到你的来信/消息”，最地道、最常用的说法是 `I'm looking forward to hearing from you.`。本题的答案 `coming` 是一个基于试卷限制的推论，不应作为常规用法来学习和模仿。", "socratic_tracks": [{"title": "固定搭配的用法", "steps": [{"question": "“look forward to” 这个短语是什么意思？你以前见过吗？", "hint": "想想你写信结尾时，想表达“期待”会怎么说。", "takeaway": "`look forward to` 是一个固定短语，意思是“期待、盼望”。"}, {"question": "这个短语里的 `to` 很特殊，你知道它后面应该跟什么形式的词吗？是 `do` 还是 `doing`？", "hint": "对比 `want to do` 和 `listen to music`。这里的 `to` 更像后者，是一个介词。", "takeaway": "`look forward to` 中的 `to` 是介词，后面必须跟名词或动名词 (v-ing)。"}]}, {"title": "动词词形变化", "steps": [{"question": "如果我们从词库中选择了动词 `come`，根据 `look forward to` 的规则，它应该变成什么形式？", "hint": "介词后面跟的动词需要加上 `-ing`。", "takeaway": "动词 `come` 需要变为动名词 `coming` 才能用在介词 `to` 之后。"}, {"question": "`come` 变成 `coming` 的拼写规则是怎样的？", "hint": "结尾是“辅音+不发音e”的动词，变-ing时要怎么处理字母e？", "takeaway": "以不发音的 `e` 结尾的动词，变 `-ing` 时要去 `e` 加 `-ing`，所以是 `coming`。"}]}, {"title": "语境与批判性思维", "steps": [{"question": "这句话 “I'm looking forward to ... from you” 是想表达什么愿望？", "hint": "作者给 Linda 写了信，他会期待什么？", "takeaway": "作者期待收到 Linda 的回复或消息。"}, {"question": "在标准英语里，我们通常用哪个词来表达“收到某人的消息”？", "hint": "这个词是 h-e-a-r。", "takeaway": "最地道的表达是 `hearing from you`。"}, {"question": "既然单词表里没有 `hear`，我们看看 `come`。你觉得出题人想用 `coming from you` 表达什么可能的意思？", "hint": "想象一下，一封信 (a letter) 是 `come from` Linda 的。", "takeaway": "尽管不地道，但在没有更优选择时，`coming` 可能是被用来指代“有信件/消息从你那里传来”这个动作。"}]}]}}, {"number": "4", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "careful", "explanation_md": "此题考查形容词在具体语境中的应用。\n1.  **句子结构分析**：空格位于`be`动词之后，应填入一个形容词作表语，构成`be + 形容词`的结构。\n2.  **上下文语境**：前文提到杰克让“我”试着做航模，后文`but I still broke it`（但我还是把它弄坏了）表明了不好的结果。\n3.  **逻辑推断**：因此，可以推断杰克在“我”动手前提醒“我”要“小心、仔细”。\n4.  **词汇选择**：方框中的形容词`careful`（小心的，仔细的）完全符合此语境。\n5.  **最终形式**：`be careful`是固定搭配，意为“当心”，故直接填入原形`careful`。", "knowledge_expansion_md": "### 知识点拓展：形容词 vs. 副词 (careful vs. carefully)\n\n1.  **形容词 (Adjective) `careful`**：\n    *   **功能**：修饰名词或代词，或在`be`动词等系动词后作表语，说明主语的状态或特征。\n    *   **句型**：`be careful` (当心) / `a careful student` (一个细心的学生)。\n    *   **例句**：`You should be careful when you cross the street.` (过马路时你应当小心。)\n\n2.  **副词 (Adverb) `carefully`**：\n    *   **功能**：修饰动词、形容词、其他副词或整个句子，说明动作的方式、程度等。\n    *   **句型**：`do sth. carefully` (小心地做某事)。\n    *   **例句**：`Please listen carefully.` (请仔细听。)\n\n**易错点**：学生常在系动词后误用副词。请牢记“**系动词后用形容词**”这一规则。例如，我们说 `He looks happy` (他看起来很高兴)，而不是 `He looks happily`。", "socratic_tracks": [{"title": "语境逻辑推理", "steps": [{"question": "根据后文“我还是把它弄坏了”，你觉得在动手之前，朋友会对你说什么？", "hint": "是会让你“开心点”，还是让你“小心点”？", "takeaway": "通过理解上下文的因果关系，可以准确推断出所需词汇的含义。"}, {"question": "从方框中找到表示“小心、仔细”的词。", "hint": "这个词以字母 'c' 开头。", "takeaway": "在备选词中，`careful` 是唯一符合“小心”这一语义的词。"}]}, {"title": "语法结构分析", "steps": [{"question": "观察空格前面的 `to be`，这是一个什么结构？`be` 动词后面通常跟什么词性的词？", "hint": "想一想 `be happy`, `be quiet` 这些短语的构成。", "takeaway": "`be` 动词后面通常跟形容词，构成系表结构，说明主语的状态。"}, {"question": "方框中有哪些形容词？哪个形容词放在这里意思才通顺？", "hint": "方框中的形容词有 `careful` 和 `happy`。", "takeaway": "结合语法和语境，只有形容词 `careful` 是正确的选择。"}]}, {"title": "词形辨析", "steps": [{"question": "你知道 `careful` 的副词形式是什么吗？", "hint": "通常在形容词词尾加 `-ly` 可以构成副词。", "takeaway": "`careful` (形容词) 的副词形式是 `carefully`。"}, {"question": "为什么这个空不能填 `carefully`，而必须用 `careful`？", "hint": "想一想，`be` 动词后面是跟形容词还是副词？可以说 `I am quickly` 吗？", "takeaway": "系动词 `be` 后面必须跟形容词作表语，不能跟副词。"}]}]}}, {"number": "5", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "with", "explanation_md": "此题考查介词的固定搭配。\n1.  **句子分析**：句子 `He was not angry __5__ me` 意为“他没有生我的气”。\n2.  **固定搭配**：在英语中，表达“生某人的气”通常使用固定短语 `be angry with somebody`。\n3.  **词汇选择**：方框中提供了介词 `with`，正好可以构成这个固定搭配。\n4.  **语境确认**：根据上文“我”弄坏了杰克的航模并道歉，杰克没有生气，这个语境与 `He was not angry with me` 完全吻合。\n5.  **最终答案**：因此，填入介词 `with`。", "knowledge_expansion_md": "### 知识点拓展：`be angry with/at/about` 的用法\n\n`angry` 是一个常用的形容词，表示“生气的，愤怒的”。它后面跟不同的介词，可以表达不同的含义，这是学习的重点。\n\n1.  **`be angry with sb.`**: 生某人的气。\n    *   这是最常见的用法，`with` 后面接“人”。\n    *   **例句**：`My teacher was angry with me for being late.` (老师因我迟到而生我的气。)\n\n2.  **`be angry at sb.`**: 生某人的气。\n    *   与 `be angry with sb.` 意思基本相同，在美式英语中更常用。\n    *   **例句**：`Please don't be angry at me.` (请不要生我的气。)\n\n3.  **`be angry at/about sth.`**: 因某事而生气。\n    *   当生气的原因是“事”而不是“人”时，用介词 `at` 或 `about`。\n    *   **例句**：`She was angry about the delay.` (她对延误感到生气。)\n\n**记忆技巧**：“**对人用 with/at，对事用 at/about**”。在小升初阶段，掌握 `be angry with sb.` 和 `be angry about sth.` 是最基本的要求。", "socratic_tracks": [{"title": "固定搭配识别", "steps": [{"question": "当你想表达“生某人的气”时，`angry` 这个词后面习惯跟哪个介词？", "hint": "这是一个非常常见的短语，比如“妈妈生我的气了”：`My mom is angry ___ me.`", "takeaway": "“生某人的气”的固定搭配是 `be angry with somebody`。"}, {"question": "现在，请在方框里的词中找到这个介词。", "hint": "这个词以 'w' 开头，有四个字母。", "takeaway": "方框中 `with` 是唯一符合该固定搭配的介词。"}]}, {"title": "介词功能理解", "steps": [{"question": "在 `He was not angry ___ me` 这句话里，空格处为什么要填一个词？这个词起什么作用？", "hint": "如果没有这个词，`angry me` 连在一起是什么意思？形容词能直接修饰人称代词宾格吗？", "takeaway": "介词用于连接形容词和它所涉及的对象，表明它们之间的关系。"}, {"question": "如果方框里有 `for`，能填 `for` 吗？`be angry for me` 和 `be angry with me` 有什么区别？", "hint": "`for` 有“为了”的意思。`angry for me` 可能是“为了我而（对别人生气）”。", "takeaway": "必须选择能准确表达“生气的对象是‘我’”的介词，即 `with`，而不是其他可能引起歧义的介词。"}]}, {"title": "相关搭配拓展", "steps": [{"question": "除了 `be angry with sb.`，你还知道哪些“be + 形容词 + 介词”的短语？", "hint": "想想“对...擅长”、“对...感到骄傲”、“对...感兴趣”怎么说？", "takeaway": "英语中有大量“be + adj. + prep.”的固定搭配，如 `be good at`, `be proud of`, `be interested in`。"}, {"question": "本篇短文中还出现了另一个类似的搭配，你能找到吗？", "hint": "在文章的最后一句找找看。", "takeaway": "文末的 `be proud of` (为……感到骄傲) 也是一个重要的固定搭配。"}]}]}}, {"number": "6", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "wrote", "explanation_md": "此题考查动词在特定时态下的正确形式。\n1.  **时间状语判断时态**：句子以 `On Monday` (在周一) 开头。根据上一段的 `Last Sunday` (上周日)，可知 `On Monday` 指的是过去的具体某一天，因此本句应使用一般过去时。\n2.  **动词意义选择**：句子的宾语是 `a letter` (一封信)，与之搭配最合理的动作是“写信”。\n3.  **词汇选择**：从方框中选择动词 `write` (写)。\n4.  **动词形式变化**：因为需要使用一般过去时，所以要将动词 `write` 变为其过去式。\n5.  **不规则动词变位**：`write` 是一个不规则动词，其过去式是 `wrote`。\n6.  **最终答案**：综合以上分析，应填入 `wrote`。", "knowledge_expansion_md": "### 知识点拓展：一般过去时与不规则动词\n\n**1. 一般过去时 (Simple Past Tense)**\n*   **功能**：表示在过去某个具体时间发生并完成的动作或存在的状态。\n*   **标志词**：`yesterday`, `last night/week/year`, `... ago`, `in 2010`，以及像本题中由上下文决定的过去时间 `On Monday`。\n*   **结构**：主语 + 动词的过去式 (V-ed / 不规则过去式)。\n\n**2. 不规则动词 (Irregular Verbs)**\n*   英语中有很多动词的过去式和过去分词不是通过加 `-ed` 构成的，需要专门记忆。\n*   **`write` 的变化**：\n    *   原形 (Infinitive): `write`\n    *   过去式 (Past Simple): `wrote`\n    *   过去分词 (Past Participle): `written`\n*   **常见不规则动词举例**：\n    *   `go` -> `went` -> `gone`\n    *   `see` -> `saw` -> `seen`\n    *   `make` -> `made` -> `made`\n    *   `say` -> `said` -> `said`\n\n**易错点**：学生在做题时，常常因为忽略了时间状语而忘记将动词变为过去式，或者不熟悉不规则动词的变位而出错。平时加强对不规则动词的背诵和应用练习至关重要。", "socratic_tracks": [{"title": "时态判断", "steps": [{"question": "这句话发生在什么时候？你是从哪个词看出来的？", "hint": "看看句首的时间状语。再结合上文的 `Last Sunday`。", "takeaway": "时间状语 `On Monday` 表明动作发生在过去，句子应使用一般过去时。"}, {"question": "在一般过去时的句子中，谓语动词应该使用什么形式？", "hint": "比如，表达“我昨天去了公园”，是说 `I go to the park yesterday` 还是 `I went to the park yesterday`？", "takeaway": "一般过去时句子的谓语动词需要使用其过去式形式。"}]}, {"title": "动词选择与变形", "steps": [{"question": "句子的宾语是 `a letter` (一封信)，应该用方框里的哪个动词来搭配？", "hint": "我们通常对信件做什么动作？是“拜访(visit)”信，还是“写(write)”信？", "takeaway": "根据动词与宾语的搭配关系，应选择动词 `write`。"}, {"question": "我们已经确定要用 `write`，并且时态是过去时。那么 `write` 的过去式是什么？", "hint": "`write` 是一个不规则动词，它的过去式不是加 `-ed`。", "takeaway": "`write` 的过去式是 `wrote`，需要特别记忆。"}]}, {"title": "句型结构", "steps": [{"question": "`write a letter to him` 是“给他写一封信”，这个短语还有别的表达方式吗？", "hint": "试着把 `him` 放在 `a letter` 前面，看看句子结构如何变化。", "takeaway": "可以使用双宾语结构 `write him a letter`，意思相同。"}, {"question": "你能用 `make` 这个词也造一个类似的双宾语结构的句子吗？比如“给我妈妈做一张卡片”。", "hint": "`make a card for my mom` 或者 `make my mom a card`。", "takeaway": "很多动词如 `write`, `give`, `buy`, `make` 都可以使用双宾语结构，即 `动词 + 间接宾语(人) + 直接宾语(物)`。"}]}]}}, {"number": "7", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "happy", "explanation_md": "此题考查在特定情感语境下形容词的选择。\n1.  **句子结构分析**：`I was so ___ to hear that.` 这是一个 `be + so + 形容词 + to do sth.` 的句型，用来表达做某事时强烈的感受。\n2.  **上下文语境**：`that` 指代的是上文杰克说的话：“我们是好朋友。一个好朋友比一个玩具更重要。”\n3.  **情感判断**：杰克不仅原谅了“我”，还强调了友谊的珍贵。听到这样的话，“我”的感受应该是积极的、正面的。\n4.  **词汇选择**：方框中的形容词 `happy` (高兴的，快乐的) 最能表达这种积极的情感。\n5.  **语意确认**：`I was so happy to hear that.` (听到那番话我太高兴了。) 语意通顺，完全符合故事情节的发展。\n6.  **最终答案**：因此，应填入 `happy`。", "knowledge_expansion_md": "### 知识点拓展：`be + adj. + to do sth.` 句型\n\n这是一个非常重要的句型，用于表达主语因做某事而产生某种感觉或状态。其中的不定式 `to do sth.` 作原因状语，解释形容词所描述情感或状态的来源。\n\n**1. 结构**：\n`主语 + be + (so/very/too...) + 形容词 + to do sth.`\n\n**2. 常用形容词**：\n这个句型常与表示情感、情绪或心理状态的形容词连用。\n*   **积极情感**：`happy`, `glad`, `pleased` (高兴的), `excited` (兴奋的), `delighted` (欣喜的), `lucky` (幸运的)\n*   **消极情感**：`sad`, `sorry` (悲伤的，遗憾的), `afraid` (害怕的)\n*   **其他状态**：`surprised` (惊讶的), `ready` (准备好的), `free` (有空的)\n\n**3. 举例**：\n*   `I'm glad to see you.` (见到你很高兴。)\n*   `She was surprised to find the door open.` (她惊讶地发现门开着。)\n*   `He is sorry to hear the bad news.` (听到这个坏消息他很难过。)\n\n**易错点**：学生需要准确理解上下文，判断主语的情感状态，从而选择最恰当的形容词。", "socratic_tracks": [{"title": "情感与语境判断", "steps": [{"question": "这句话里的 `that` 指的是什么？", "hint": "往前面找，`that` 指代的是 Jack 刚说完的话。", "takeaway": "`that` 指代的是 Jack 所说的“朋友比玩具更重要”这番话。"}, {"question": "听到朋友这样说，你（文中的“我”）会是什么心情？是高兴还是难过？", "hint": "朋友原谅了你，还非常看重你们的友谊。", "takeaway": "在这种情况下，主人公的心情必然是积极和高兴的。"}, {"question": "根据这个心情，应该从方框里选择哪个词？", "hint": "找到表示“高兴”的形容词。", "takeaway": "方框中的 `happy` 是最符合这种积极心境的词。"}]}, {"title": "句型结构分析", "steps": [{"question": "观察句子 `I was so ___ to hear that.`，空格里应该填什么词性的词？", "hint": "在 `be` 动词和副词 `so` 之后，通常跟什么词？", "takeaway": "在 `be so ...` 结构中，通常填入形容词来描述主语的状态。"}, {"question": "这个句型 `be + 形容词 + to do sth.` 有什么作用？", "hint": "想一想 `I'm happy to see you.` 这句话里，`to see you` 是用来干什么的？", "takeaway": "这个句型用来表达做某事（to do sth.）所引起的情感（形容词）。"}]}, {"title": "词汇辨析与应用", "steps": [{"question": "方框里除了 `happy`，还有一个形容词 `careful`。为什么这里不能填 `careful`？", "hint": "`I was so careful to hear that.` (我如此小心地听到那件事。) 这句话在逻辑上说得通吗？", "takeaway": "情感描述需符合逻辑，`careful` (小心的) 与 `hear` (听到) 这个动作及上下文情感不匹配。"}, {"question": "你能用 `sad` (悲伤的) 来仿写一个 `be + adj. + to do` 的句子吗？", "hint": "比如，听到一个坏消息感到悲伤。", "takeaway": "仿写句子，如 `I was sad to hear the bad news.`，有助于巩固句型掌握。"}]}]}}, {"number": "8", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "later", "explanation_md": "本题考查副词比较级的用法。空格前的 “but” 表示转折，说明“有时”的情况与“通常6:30起床”不同。空格前的 “a little bit” 意为“一点点”，常用来修饰比较级。结合句意，此处应表达“比平时起得晚一点”。`late` (晚) 的比较级是 `later` (更晚)，因此填 `later` 最符合语境和语法。", "knowledge_expansion_md": "### 副词比较级与易混词辨析\n\n1.  **比较级形式**：单音节和部分双音节的形容词/副词，其比较级通常在词尾加 `-er`。例如：`late` (晚) -> `later` (更晚)，`early` (早) -> `earlier` (更早)，`fast` (快) -> `faster` (更快)。\n\n2.  **`a little bit` + 比较级**：这是一个常用结构，表示“（比……）……一点点”，用来表达细微的差别。例如：`a little bit taller` (高一点点)，`a little bit more expensive` (贵一点点)。\n\n3.  **`late` vs. `lately`**：\n    *   `late` (adj./adv.) 意为“晚的；迟的”或“晚地；迟地”，指时间上的晚。例：`He came to the party late.` (他聚会迟到了。)\n    *   `lately` (adv.) 意为“最近；近来”，相当于 `recently`，通常与现在完成时或一般现在时连用。例：`Have you seen him lately?` (你最近见到他了吗？)", "socratic_tracks": [{"title": "语境逻辑推断", "steps": [{"question": "句子中的 `but` (但是) 这个词起到了什么作用？它暗示了前后两个分句之间是什么关系？", "hint": "`but` 通常用于连接两个意思相反或相对的句子。前半句说“我通常6:30起床”。", "takeaway": "`but` 表示转折，说明“有时”的情况与“通常”的情况不同。"}, {"question": "既然情况不同，那么“有时”起床的时间和“通常”的6:30相比，可能是更早还是更晚？", "hint": "想一想，如果睡懒觉，是起得早还是晚？", "takeaway": "根据生活常识，周末或假期有时会起得比平时晚一些。"}, {"question": "结合短语 `a little bit` (一点点)，我们应该用哪个词的什么形式来表达“比平时晚一点点”这个意思？", "hint": "方框中的 `late` 是“晚”的意思，它的比较级是什么？", "takeaway": "使用 `late` 的比较级 `later` 来表示“更晚”，最符合逻辑。"}]}, {"title": "词形变化规则", "steps": [{"question": "空格前的短语 `a little bit` 是什么意思？它通常用来修饰什么类型的词？", "hint": "比如，我们可以说 `a little bit bigger` (大一点点)，`bigger` 是什么形式？", "takeaway": "`a little bit` 意为“一点点”，常用于修饰形容词或副词的比较级。"}, {"question": "假设我们从方框中选了 `late` 这个词，它的比较级形式是什么？", "hint": "这是一个以 `e` 结尾的单音节词，它的比较级是直接加 `-r` 还是 `-er`？", "takeaway": "`late` 的比较级是 `later`。"}, {"question": "根据“`a little bit` + 比较级”这个语法结构，我们应该在空格里填入什么？", "hint": "将我们分析出的词形和结构组合起来。", "takeaway": "因此，空格处应填入 `later`，构成 `a little bit later`。"}]}, {"title": "易混词辨析", "steps": [{"question": "`late` 和 `lately` 这两个词长得很像，它们的意思和用法有什么区别？", "hint": "一个指时间点上的“晚”，一个指时间段上的“最近”。试着用它们造句，比如“他迟到了”和“他最近很忙”。", "takeaway": "`late` 指时间上的“晚”，而 `lately` 指“最近”，相当于 `recently`。"}, {"question": "我们正在分析的这个句子是想表达“我最近起床晚了一点”，还是“我有时起床会晚一点”？", "hint": "注意句中的时间状语 `sometimes` (有时)。", "takeaway": "句中的 `sometimes` 表明这是在描述一个习惯或频率，而不是特指“最近”发生的事。"}, {"question": "所以，这个空应该用 `late` 的相关形式还是 `lately`？", "hint": "既然不是“最近”的意思，就应该排除 `lately`。", "takeaway": "应该使用表示“晚”的 `late` 的比较级 `later`，而不是 `lately`。"}]}]}}, {"number": "9", "item_type": "cloze", "context_note": "", "stem": "", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "breakfast", "explanation_md": "本题考查名词的辨析和使用。空格位于冠词 `a` 和形容词 `quick` 之后，因此需要填入一个单数名词。后面的句子 `I have bread and milk` (我吃面包喝牛奶) 描述了早餐的具体内容。因此，空格处应填入表示“早餐”的名词 `breakfast`。整个句子的意思是“在吃完一顿快速的早餐后，我吃了面包、喝了牛奶”，后半句是对 `a quick breakfast` 的具体解释和补充说明，逻辑上是通顺的。", "knowledge_expansion_md": "### 名词用法与句子结构\n\n1.  **词性判断**：在 `a/an + 形容词 + ___` 结构中，空格处一定需要一个名词。例如 `a beautiful girl`, `an interesting story`。\n\n2.  **固定搭配**：关于“早餐”，有一些常见的固定搭配：\n    *   `have/eat breakfast`: 吃早餐\n    *   `make/cook breakfast`: 做早餐\n    *   `for breakfast`: 作为早餐 (e.g., `I had eggs for breakfast.`) \n\n3.  **同位解释结构**：在英语中，有时一个名 代词 + 名词**：`my`, `your`, `his`, `her`, `its`, `our`, `their` 这类表示所属关系的物主代词，后面必须跟名词。例如：`my book`, `her cats`。\n\n2.  **可数名词的复数**：`friend` 是可数名词，其复数形式是规则的，在词尾加 `-s` 变成 `friends`。大多数可数名词的复数都是加 `-s` 或 `-es`。\n\n3.  **单数 vs. 复数**：在句子中，何时使用单数，何时使用复数，需要根据具体语境判断。\n    *   如果明确指代一个，用单数：`I have a friend.`\n    *   如果指代多个，用复数：`I have many friends.`\n    *   在泛指或描述普遍情况时，若无特殊说明，通常使用复数形式更能体现一般性。本题中 `go to school with my friends` (和我的朋友们一起上学) 比 `with my friend` (和一个朋友一起上学) 更能描述一种日常状态。", "socratic_tracks": [{"title": "语法结构分析", "steps": [{"question": "空格前面的 `my` 是一个什么词？它在句子中有什么作用？", "hint": "`my` 的意思是“我的”，它表示所属关系。这类词后面通常会跟什么？", "takeaway": "`my` 是物主代词，后面必须跟一个名词。"}, {"question": "根据 `go to school with...` 的意思，这个名词应该指代什么？", "hint": "介词 `with` 在这里是“和...一起”的意思，所以后面应该是一个或一些人。", "takeaway": "空格需要一个表示人的名词。"}]}, {"title": "名词的数", "steps": [{"question": "假设我们从方框里选了 `friend` 这个词。它是一个可数名词还是不可数名词？", "hint": "你能数一个朋友，两个朋友吗？如果可以，就是可数名词。", "takeaway": "`friend` 是可数名词。"}, {"question": "可数名词在使用时要注意什么？", "hint": "它不能单独使用，前面要么有冠词（a/an/the），要么用复数形式，或者前面有物主代词等限定词。", "takeaway": "可数名词有单数和复数之分，需要根据语境决定用哪种形式。"}, {"question": "在这个句子里，填 `friend` (一个朋友) 还是 `friends` (多个朋友) 更合适？为什么？", "hint": "这句话描述的是一个日常习惯。通常是和“一个特定的朋友”上学，还是和“朋友们”上学更具普遍性？", "takeaway": "在没有特指的情况下，使用复数形式 `friends` 表示泛指的“朋友们”，更符合日常表达习惯。"}]}, {"title": "语境与常识", "steps": [{"question": "这篇短文描述的是什么？", "hint": "回顾一下全文，讲了起床、吃早饭、去上学。", "takeaway": "短文描述的是一个学生的晨间日常活动。"}, {"question": "根据你的生活经验，学生们通常会和谁一起去上学？", "hint": "可能是父母、兄弟姐妹，也可能是同学或朋友。", "takeaway": "和朋友一起上学是非常普遍的情况。"}, {"question": "结合方框中可能出现的词，以及“和...一起上学”这个情景，填入哪个词最符合逻辑和常识？", "hint": "`friend` (朋友) 是最符合这个情景的词之一。", "takeaway": "选择 `friends` 不仅语法正确，也完全符合学生日常生活的真实情景。"}]}]}}]}], "content_markdown": "## 成都某北京第二外国语学院成都附属中学初2026级新初一入学真卷英语\n\n**满分:50分 时间:40分钟**\n\n### I. 句型转换。(共10分)\n\n1. Linda has some volleyballs. (改为否定句)\nLinda __________ __________ volleyballs.\n2. I have a class today. (改为复数句)\n__________ some __________ today.\n3. Are you late for school? (作否定回答)\nNo, __________. Jack __________ f   function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function isTypeCardId(t) {
    return typeof t === "string" && /^tc:\d+$/.test(t);
  }
  function parseTypeCardIndex(t) {
    const m = /^tc:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  /** 首页大题卡：sec:N 或 tc:N（exam_meta.type_cards 合并多节） */
  function isPaperShardId(t) {
    return isSectionShardId(t) || isTypeCardId(t);
  }
  function getTypeCards() {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const tc = meta.type_cards;
    return Array.isArray(tc) && tc.length ? tc : null;
  }
  function rowsForPaperShard(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      if (!cards || idx < 0 || idx >= cards.length) return [];
      const secs = cards[idx].sections;
      if (!Array.isArray(secs)) return [];
      const out = [];
      secs.forEach((si) => {
        (state.bySection["sec:" + si] || []).forEach((r) => out.push(r));
      });
      return out;
    }
    if (isSectionShardId(t)) return state.bySection[t] || [];
    return state.byType[t] || [];
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  /** exam_meta.section_card_overrides[si]：可选 title（首页/顶栏标题）、range_text（首页副标题题号，缺省则按大题顺序累加） */
  function getSectionCardOverride(si) {
    const meta = EXAM.exam_meta;
    if (!meta) return null;
    const arr = meta.section_card_overrides;
    if (!Array.isArray(arr) || si < 0 || si >= arr.length) return null;
    const o = arr[si];
    if (!o || typeof o !== "object") return null;
    return o;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isTypeCardId(t)) {
      const idx = parseTypeCardIndex(t);
      const cards = getTypeCards();
      const sp = cards && cards[idx];
      if (sp && String(sp.title || "").trim()) return String(sp.title).trim();
      return "大题 " + (idx >= 0 ? idx + 1 : "");
    }
    if (isSectionShardId(t)) {
      const si = parseSectionShardIndex(t);
      const ov = getSectionCardOverride(si);
      if (ov && String(ov.title || "").trim()) return String(ov.title).trim();
      return sectionShardLabel(t);
    }
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const mapCnNum = {
      一: "A",
      二: "B",
      三: "C",
      四: "D",
      五: "E",
      六: "F",
      七: "G",
      八: "H",
      九: "I",
      十: "J",
    };
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mSee = firstLine.match(
      /^See\s+Passage\s*[（(]([一二三四五六七八九十]+)[）)]\s*[.。]?\s*$/i,
    );
    if (mSee) {
      const L = mapCnNum[mSee[1]];
      if (L) return "Passage " + L;
    }
    const mHeadCn = firstLine.match(/^[（(]([一二三四五六七八九十]+)[）)]/);
    if (mHeadCn) {
      const L = mapCnNum[mHeadCn[1]];
      if (L) return "Passage " + L;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const L = mapCnNum[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** 如「See Passage (一).」：指向大题说明中的篇，本身不含正文 */
  function isSeePassageOnlyReference(text) {
    const t = String(text || "").trim();
    if (!t || t.indexOf("\n") >= 0) return false;
    return /^See\s+Passage\s*[（(][一二三四五六七八九十0-9]+[）)]\s*[.。]?$/i.test(t);
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (isSeePassageOnlyReference(t)) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;

  function sectionInstructionHasClozeInlineBlanks(ins) {
    const s = String(ins || "");

    if (/[a-zA-Z]?__\d+__/.test(s)) return true;
    /* 补全对话 / 短文填空：文中「1. _____」「2. _____」 */
    if (/\d+\.\s*_{3,}/.test(s)) return true;
    /* 任务型阅读 / 首字母填空：「45. w_____」「46. S_____」 */

  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !sectionInstructionHasClozeInlineBlanks(ins)) return false;
    return g.rows.every((r) => {

      return getObjectiveChoiceLayout(r, it).letters.length === 0;

  function collectClozeInlineBlankMatches(s) {
    const str = String(s || "");
    const hits = [];
    const reParen = /\(\d+\)[^_\n\r]*_{3,}/g;
    const reLetterNum = /[a-zA-Z]?__\d+__/g;
    const reNumDotBlank = /\d+\.\s*_{3,}/g;
    const reNumDotLetterUnd = /\d+\.\s+[A-Za-z]?_{3,}/g;
    let m;
    while ((m = reParen.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reLetterNum.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotBlank.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    while ((m = reNumDotLetterUnd.exec(str)) !== null) {
      hits.push({ i: m.index, len: m[0].length, m0: m[0] });
    }
    hits.sort((a, b) => a.i - b.i);
    const merged = [];
    let lastEnd = -1;
    hits.forEach((h) => {
      if (h.i < lastEnd) return;
      merged.push(h);
      lastEnd = h.i + h.len;
    });
    return merged;
  }

  function clozeInlineMatchToNum(m0) {
    const a = /^\((\d+)\)/.exec(m0);
    if (a) return a[1];
    const b = /__(\d+)__/.exec(m0);
    if (b) return b[1];
    const c = /^(\d+)\.\s*_{3,}/.exec(m0);
    if (c) return c[1];
    const d = /^(\d+)\.\s+[A-Za-z]?_{3,}/.exec(m0);
    return d ? d[1] : "";
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const hits = collectClozeInlineBlankMatches(s);
    let out = "";
    let li = 0;
    hits.forEach((h) => {
      out += esc(s.slice(li, h.i)).replace(/\n/g, "<br>");
      li = h.i + h.len;
      const num = clozeInlineMatchToNum(h.m0);
      const rk = num ? rowByNum[num] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(h.m0).replace(/\n/g, "<br>");
      }
    });
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "").trim();
    if (!s) return "";
    const paras = s.split(/\n\n+/).map((x) => x.trim()).filter(Boolean);
    const bodyHtml = paras
      .map((para) => {
        const hits = collectClozeInlineBlankMatches(para);
        let out = "";
        let li = 0;
        hits.forEach((h) => {
          out += esc(para.slice(li, h.i)).replace(/\n/g, "<br>");
          li = h.i + h.len;
          const num = clozeInlineMatchToNum(h.m0);
          const rk = num ? rowByNum[num] : null;
          out += rk ? "<span class='exam-blank'>&nbsp;</span>" : esc(h.m0).replace(/\n/g, "<br>");
        });
        out += esc(para.slice(li)).replace(/\n/g, "<br>");
        return "<p class='exam-para'>" + out + "</p>";

      .join("");
    return "<div class='exam-cloze-inline-pdf'>" + bodyHtml + "</div>";

  /** PDF：文中空题型 — 词汇方框（若有）+ 正文框分段，贴近纸笔卷面 */

  function clozeAnswerWordFromItem(it) {

    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";

  function clozeNumToAnswerMap(detailsPairs) {

      const it = row.it;

      if (!n) return;
      const w = clozeAnswerWordFromItem(it);

      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
