<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    /* 阅读填表：材料 + HTML 表格作答 */
    .reading-table-fill-wrap {
      margin-bottom: 0.5rem;
    }
    .reading-table-fill-hd {
      margin: 0 0 0.65rem;
      font-size: 1.02rem;
      color: var(--accent);
      font-weight: 600;
    }
    .reading-fill-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .reading-fill-table th,
    .reading-fill-table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
    }
    .reading-fill-table thead th {
      background: #eef5f0;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
    }
    .reading-fill-table .reading-fill-num {
      width: 2.75rem;
      text-align: center;
      font-weight: 700;
      background: #f7faf7;
    }
    .reading-fill-table .reading-fill-cell .stem {
      margin: 0;
      line-height: 1.55;
    }
    .reading-fill-table .blank-line input {
      min-width: 6.5rem;
    }
    .reading-table-fill-layout {
      align-items: start;
    }

    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 阅读判断 T/F：同一行 T / F */
    .opts.opts-tf-pair {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
    }
    .reading-q-card .opts.opts-tf-pair {
      grid-template-columns: unset;
    }
    .opts.opts-tf-pair .opt-tf {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.35rem 0.5rem;
    }
    .opts.opts-tf-pair .opt-tf-slash {
      color: var(--muted);
      font-weight: 600;
      user-select: none;
      padding: 0 0.1rem;
    }
    .opts.opts-tf-pair .opt-tf-letter {
      font-weight: 700;
      font-size: 1.06rem;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;

  <script type="application/json" id="exam-embed">{"school_or_title": "初一入学考试英语试卷 · 第20套", "exam_meta": {"full_score_text": "满分:50分", "time_text": "时间:40分钟", "type_cards": [{"sections": [0], "title": "1. 句型转换", "range_text": "第1-5题"}, {"sections": [1], "title": "2. 用所给词的正确形式填空", "range_text": "第1-5题"}, {"sections": [2], "title": "3. 首字母填空", "range_text": "第1-5题"}, {"sections": [3], "title": "4. 补全对话", "range_text": "第1-10题"}, {"sections": [4], "title": "5. 短文填空（选词填空）", "range_text": "第1-10题"}]}, "sections": [{"section_title": "I. 句型转换。(共10分)", "section_instruction": "", "items": [{"number": "1", "item_type": "sentence_transform", "context_note": "", "stem": "Linda has some volleyballs. (改为否定句)\nLinda __________ __________ volleyballs.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "doesn't|have", "explanation_md": "原句 “Linda has some volleyballs.” 是一个现在简单时的肯定句，主语是第三人称单数 `Linda`，谓语动词是 `has`。\n要将其改为否定句，需要借助助动词 `does` 的否定形式 `doesn't` (或 `does not`)。\n助动词 `doesn't` 后面必须跟动词原形，所以 `has` 要变回其原形 `have`。\n因此，句子变为 “Linda doesn't have volleyballs.”。\n虽然在否定句中 `some` 通常会变为 `any`，但本题的横线只要求填写动词部分。", "knowledge_expansion_md": "### `have/has` 作实义动词的句型变换\n\n当 `have` 表示“拥有”时，是实义动词，其句型变换需要借助助动词 `do/does`。\n\n1.  **肯定句**：主语 + `have`/`has` + ...\n    *   `I have a book.`\n    *   `He has a car.`\n\n2.  **否定句**：主语 + `don't`/`doesn't` + `have` + ...\n    *   `I don't have a book.`\n    *   `He doesn't have a car.` (注意：`has` 变为原形 `have`)\n\n3.  **一般疑问句**：`Do`/`Does` + 主语 + `have` + ...?\n    *   `Do you have a book?`\n    *   `Does he have a car?`\n\n**易错点**：\n*   忘记在 `doesn't` 后将 `has` 变回原形 `have`。\n*   与 `have got` 结构混淆。`He has got a car.` 的否定句是 `He hasn't got a car.`，因为此处的 `has` 是助动词。", "socratic_tracks": [{"title": "动词 `have` 的否定句", "steps": [{"question": "原句 “Linda has some volleyballs” 中的动词是什么？它用于什么人称？", "hint": "句子的主语是 Linda，是第三人称单数。", "takeaway": "动词是 `has`，是 `have` 用于第三人称单数的现在时形式。"}, {"question": "当一个句子含有 `has` 这样的实义动词时，我们如何将它变成否定句？需要借助什么词？", "hint": "想想 “He likes apples.” 的否定句是 “He doesn't like apples.”。", "takeaway": "对于实义动词的否定，需要根据主语人称，使用助动词 `don't` 或 `doesn't`。"}, {"question": "主语是 `Linda`，我们应该用 `don't` 还是 `doesn't`？", "hint": "`Linda` 可以用代词 `she` 替换。", "takeaway": "主语是第三人称单数，所以用 `doesn't`。"}, {"question": "在 `doesn't` 之后，原来的动词 `has` 应该变成什么形式？", "hint": "助动词后面要跟动词的原形。", "takeaway": "助动词 `doesn't` 后面必须跟动词原形，所以 `has` 要变回 `have`。"}]}, {"title": "`some` 与 `any` 的用法", "steps": [{"question": "原句中有一个词 `some`，它通常用在什么类型的句子中？", "hint": "“I have some books.” 这是一个肯定句。", "takeaway": "`some` 通常用于肯定句中，表示“一些”。"}, {"question": "当我们把这个句子变成否定句或疑问句时，`some` 通常会变成哪个词？", "hint": "比如 “I don't have ___ friends here.” 或者 “Do you have ___ questions?”", "takeaway": "在否定句和疑问句中，`some` 通常要变为 `any`。"}]}, {"title": "分析题目结构", "steps": [{"question": "我们已经知道完整的否定句是 “Linda doesn't have any volleyballs.”。为什么这道题的答案只填 `doesn't` 和 `have`？", "hint": "观察一下题目给出的横线数量和横线后的单词。", "takeaway": "题目只为动词部分留了两个空位，所以我们只需填写核心的动词变化部分。"}, {"question": "如果题目是 “Linda __________ __________ __________ volleyballs.”，三个空，你会怎么填？", "hint": "考虑一下 `some` 到 `any` 的变化。", "takeaway": "三个空的情况下，最完整的答案是 `doesn't have any`。"}]}]}}, {"number": "2", "item_type": "sentence_transform", "context_note": "", "stem": "I have a class today. (改为复数句)\n__________ some __________ today.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "We|classes", "explanation_md": "题目要求将原句 “I have a class today.” 改为复数句。\n“改为复数句”意味着句子的主语及相关部分都要变为复数形式。\n首先，第一人称单数主语 `I` (我) 对应的复数形式是 `We` (我们)。\n其次，宾语 `a class` (一节课) 是单数名词，其复数形式是在词尾加 `-es`，变为 `classes`。\n在单数变复数时，不定冠词 `a` 通常会被表示“一些”的 `some` 替代，或者直接省略。本题提示中给出了 `some`。\n动词 `have` 在主语是 `We` 时保持不变。\n因此，完整的复数句是 “We have some classes today.”，根据题目横线位置，应填入 `We` 和 `classes`。", "knowledge_expansion_md": "### 句子单数变复数规则\n\n将一个句子从单数形式变为复数形式，需要注意以下几个方面的同步变化：\n\n1.  **主语变化**：\n    *   人称代词：`I` → `We`, `He/She/It` → `They`。(`You` 单复数同形)\n    *   指示代词：`This` → `These`, `That` → `Those`。\n    *   名词：`A boy` → `Boys` / `Some boys`。\n\n2.  **谓语动词变化 (主谓一致)**：\n    *   Be动词：`is` → `are`, `am` → `are`, `was` → `were`。\n    *   实义动词：第三人称单数形式（如 `has`, `goes`, `likes`）需变回原形（`have`, `go`, `like`）。\n\n3.  **宾语/表语名词变化**：\n    *   单数名词变为复数名词，注意规则变化（加-s/-es）和不规则变化（如 `child`→`children`）。\n\n4.  **限定词变化**：\n    *   不定冠词 `a/an` 必须去掉，可以换成 `some`, `these`, `those`，或直接省略。", "socratic_tracks": [{"title": "人称代词的单复数", "steps": [{"question": "原句的主语是 “I”，表示“我”，这是一个单数还是复数？", "hint": "想想你自己在说话。", "takeaway": "“I” 是第一人称单数。"}, {"question": "如果不止你一个人，而是“我们”，应该用哪个英文单词来表示？", "hint": "“I and my friends” 可以用一个词来代替。", "takeaway": "“I” 对应的复数形式是 “We”。"}]}, {"title": "名词的单复数", "steps": [{"question": "原句中的 “a class” 表示“一节课”，是单数。它的复数形式是什么？", "hint": "以 -s, -x, -ch, -sh, -ss 结尾的名词，变复数通常加什么？", "takeaway": "以 -ss 结尾的 `class`，其复数形式是加 `-es`，变为 `classes`。"}, {"question": "原句中的不定冠词 “a” 在变成复数句后，为什么可以用 “some” 替换？", "hint": "“a” 或 “an” 只能用在单数名词前，表示“一个”。", "takeaway": "“a/an”只用于单数可数名词前；变为复数后，常用 `some` 来表示“一些”，或者直接省略。"}]}, {"title": "句子主谓一致", "steps": [{"question": "当主语从 “I” 变成 “We” 之后，动词 “have” 需要变化吗？", "hint": "回忆一下动词 `have` 的现在时形式：I have, you have, he/she/it has, we have, they have.", "takeaway": "主语是 “We” 时，动词仍然是 `have`，不需要变化。"}, {"question": "如果原句是 “He has a class”，要求改成复数句，主语和动词应该怎么变？", "hint": "“He” 的复数是 “They”。", "takeaway": "“He has” 变成复数句时，主语是 “They”，动词要从 `has` 变为 `have`，即 “They have classes”。"}]}]}}, {"number": "3", "item_type": "sentence_transform", "context_note": "", "stem": "Are you late for school? (作否定回答)\nNo, __________. Jack __________ for school.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "I'm not|isn't late", "explanation_md": "题目要求对一般疑问句 “Are you late for school?” 作出否定回答。\n第一部分是直接回答。问题中的主语是 `you`，在回答时通常应变为 `I`。与 `I` 搭配的be动词是 `am`。否定简略回答的标准格式是 “No, 主语 + be动词/助动词 + not.”，因此第一空应填 “I'm not” (或 I am not)。\n第二部分是关于 `Jack` 的陈述。在 “No” 的否定语境下，最合乎逻辑的补充信息是陈述另一个相关的否定事实，即 Jack 也没有迟到。\n“Jack is late for school” (Jack迟到了) 的否定句是 “Jack isn't late for school” (Jack没迟到)。\n因此，第二个空应填入 “isn't late”。整个回答连起来是：“不，我没迟到。杰克也没迟到。”", "knowledge_expansion_md": "### Be动词引导的一般疑问句及其回答\n\n1.  **句型**：`Be` (Am/Is/Are) + 主语 + ...?\n\n2.  **回答格式**：\n    *   肯定回答: `Yes, 主语代词 + be.` (例如: Yes, I am. / Yes, he is. / Yes, they are.)\n    *   否定回答: `No, 主语代词 + be + not.` (例如: No, I'm not. / No, he isn't. / No, they aren't.)\n\n3.  **人称和Be动词的转换**：回答时要特别注意人称和be动词形式的相应变化。\n    *   `Are you...?` → `Yes, I am. / No, I'm not.` (当 `you` 指单数“你”时)\n    *   `Are you...?` → `Yes, we are. / No, we aren't.` (当 `you` 指复数“你们”时)\n    *   `Is he...?` → `Yes, he is. / No, he isn't.`\n\n4.  **上下文逻辑**：在补全对话或句子时，要考虑上下文的逻辑连贯性。本题中，以 `No` 开头的否定回答为整个语境定下了否定的基调，后续的句子在没有转折词（如 `but`）的情况下，通常会延续这一否定逻辑。", "socratic_tracks": [{"title": "Be动词疑问句的回答", "steps": [{"question": "看到以 “Are you...?” 开头的问题，如果你的回答是“不，我不是”，英文应该怎么说？", "hint": "问题中的主语是 `you`，回答时主语应该变成什么？对应的 be 动词是什么？", "takeaway": "当问题是 “Are you...?” 时，针对“你”的否定简答是 “No, I'm not.”。"}, {"question": "为什么不能回答 “No, I aren't.”？", "hint": "主语 `I` 后面应该跟哪个be动词？", "takeaway": "主语 `I` 对应的be动词是 `am`，而不是 `are`，所以否定缩写是 `I'm not`。"}]}, {"title": "陈述句的否定形式", "steps": [{"question": "我们来看第二句话 “Jack __________ for school.”。如果我们想表达“Jack上学迟到了”，应该怎么说？", "hint": "“迟到”的表达是 `be late for`。主语是 Jack。", "takeaway": "肯定句是 “Jack is late for school.”。"}, {"question": "那么，如何将这个肯定句变成否定句，来表达“Jack没有迟到”？", "hint": "含有be动词的句子，变否定句非常简单，只需要在be动词后面加一个词。", "takeaway": "含有be动词的句子，变否定句只需在be动词 `is` 后面加 `not`，变成 `is not` 或缩写 `isn't`。"}]}, {"title": "理解上下文逻辑", "steps": [{"question": "整个回答是以 “No” 开始的，这为对话设定了什么基调？", "hint": "是肯定的基调还是否定的基调？", "takeaway": "“No” 设定了一个否定的基调。"}, {"question": "在这个否定基调下，第二句话说“Jack也没迟到”是不是比说“（但是）Jack迟到了”更通顺自然？", "hint": "想一想，如果没有 “but” 这样的转折词，句子前后逻辑应该是一致的。", "takeaway": "在没有转折词的情况下，延续前文的否定逻辑是更自然、更符合题目要求的选择。"}]}]}}, {"number": "4", "item_type": "sentence_transform", "context_note": "", "stem": "Bill has a baseball bat and a baseball. (改为一般疑问句,并作出否定回答)\n__________ __________ __________ a baseball bat or a baseball?\n__________, he __________.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "Does|Bill|have|No|doesn't", "explanation_md": "本题要求将陈述句改为一般疑问句，并作出否定回答。\n第一步，改造问句。原句 “Bill has a baseball bat and a baseball.” 的主语 `Bill` 是第三人称单数，谓语是实义动词 `has`。将其改为一般疑问句，需在句首加助动词 `Does`，同时谓语动词 `has` 需恢复原形 `have`。此外，在疑问句中，连接并列成分的 `and` 通常改为 `or`。所以问句是 “Does Bill have a baseball bat or a baseball?”，前三空依次填 `Does`, `Bill`, `have`。\n第二步，作否定回答。针对以 `Does` 开头的一般疑问句，其否定简答形式为 “No, 主语代词 + doesn't.”。本句主语 `Bill` 是男性，代词为 `he`。因此，否定回答是 “No, he doesn't.”，后两空依次填 `No`, `doesn't`。", "knowledge_expansion_md": "### 实义动词陈述句变一般疑问句及回答\n\n这是一个非常基础且重要的句型转换，核心在于助动词 `Do/Does` 的使用。\n\n1.  **变疑问句规则**：\n    *   **判断动词**：首先看句子中的动词。如果是 `be` 动词或情态动词，直接提前。如果是实义动词（如 `like`, `go`, `have`），则需要借助助动词。\n    *   **选择助动词**：根据主语的人称和数，选择 `Do` 或 `Does`。主语为第三人称单数（he, she, it, a name）时用 `Does`，其他用 `Do`。\n    *   **动词恢复原形**：一旦使用了助动词 `Does`，原句中的动词第三人称单数形式（如 `has`, `goes`, `likes`）必须变回原形（`have`, `go`, `like`）。这是最常见的失分点。\n    *   **`and` 变 `or`**：在肯定句中表示并列的 `and`，在疑问句和否定句中常转为 `or`。\n\n2.  **简略回答规则**：\n    *   回答必须与提问所用的词（be动词、情态动词、助动词）保持一致。\n    *   `Do you...?` → `Yes, I do. / No, I don't.`\n    *   `Does he...?` → `Yes, he does. / No, he doesn't.`\n    *   **易错点**：不能回答 `Yes, he do.` 或 `No, he don't.`，助动词要和主语匹配。也不能用 `hasn't` 回答 `Does...have...?` 的问题。", "socratic_tracks": [{"title": "`have/has` 作实义动词的疑问句", "steps": [{"question": "原句 “Bill has a baseball bat...” 中，动词是什么？它是一个be动词，还是一个实义动词？", "hint": "这个词表示“拥有”，有实际的意义。", "takeaway": "动词是 `has`，是实义动词 `have` 的第三人称单数形式。"}, {"question": "把含有实义动词的陈述句变成一般疑问句，需要在句首加什么词？", "hint": "想想 “He likes dogs” 怎么问 “他喜欢狗吗？”", "takeaway": "需要根据主语人称，在句首加助动词 `Do` 或 `Does`。"}, {"question": "主语是 `Bill`（第三人称单数），应该用 `Do` 还是 `Does`？原句的动词 `has` 又该如何变化？", "hint": "助动词已经承担了人称和时态变化，后面的动词就要“打回原形”。", "takeaway": "主语是第三人称单数，所以用 `Does` 开头，并且 `has` 必须变回动词原形 `have`。"}]}, {"title": "`and` 与 `or` 的区别", "steps": [{"question": "原句用 `and` 连接了两样东西，表示比尔两样都有。在疑问句中，为什么 `and` 变成了 `or`？", "hint": "问句 “Does he have A or B?” 是在询问他是否有 A “或者” 有 B。", "takeaway": "在一般疑问句和否定句中，我们通常用 `or` 来代替 `and`，表示“或者”，询问或否定任何一个可能性。"}, {"question": "如果问句用 `and`，即 “Does Bill have a baseball bat and a baseball?”，和用 `or` 的问句有什么细微差别？", "hint": "用 `and` 的问句更侧重于“是否两样东西*都*有”。", "takeaway": "用 `and` 的问句是在确认是否“两者都有”，而用 `or` 的问句是在询问“两者中是否有任何一个”。在句型转换中，`and` 变 `or` 是标准操作。"}]}, {"title": "一般疑问句的否定简答", "steps": [{"question": "我们已经构造了问句 “Does Bill have...?”，现在需要做出否定回答。否定回答应该以哪个词开头？", "hint": "是或不是？", "takeaway": "否定回答以 `No` 开头。"}, {"question": "“No” 的后面应该跟什么？", "hint": "标准格式是“主语代词 + 助动词的否定形式”。", "takeaway": "后面跟主语 `Bill` 的代词 `he`，以及助动词 `Does` 的否定形式 `doesn't`。"}, {"question": "为什么不能回答 “No, he hasn't.”？", "hint": "回答要用问句里出现的那个助动词或be动词。", "takeaway": "因为问句是用助动词 `Does` 提问的，所以回答也必须用 `does` 或 `doesn't`，这叫“怎么问，怎么答”。"}]}]}}, {"number": "5", "item_type": "sentence_transform", "context_note": "", "stem": "play, let's, class, sports, with, after, our, friends(!)(连词成句)\n____________________", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "Let's play sports with our friends after class!", "explanation_md": "本题考查连词成句，需要根据所给词汇和标点符号，组成一个语法正确、逻辑通顺的句子。\n1.  首先，`Let's` 是 `Let us` 的缩写，提示这是一个表示建议的祈使句，其基本结构是 `Let's + 动词原形`。\n2.  在所给词中，动词是 `play`，因此句子核心是 `Let's play`。\n3.  `play` 后面通常跟宾语，这里是 `sports`，构成 `play sports`（做运动）。\n4.  `with our friends`（和我们的朋友们）和 `after class`（下课后）是两个介词短语，作状语，修饰动作发生的方式和时间。\n5.  按照一般语序，可以组成 `Let's play sports with our friends after class.`。\n6.  最后，根据题目给出的 `(!)` 提示，句末应使用感叹号，以表达更强的建议或兴奋的语气。", "knowledge_expansion_md": "### 1. `Let's` 句型及其变体\n`Let's` 开头的句子是祈使句的一种，用于向对方（包括自己在内）提出建议。其结构为 `Let's + 动词原形`。\n- **肯定句**: `Let's go home.` (我们回家吧。)\n- **否定句**: `Let's not talk about it.` (我们别谈那件事了。)\n\n### 2. 提出建议的其他方式\n除了 `Let's`，还有多种表达建议的方式：\n- **`Shall we...?`**: `Shall we play sports?` (我们去做运动好吗？)\n- **`How about/What about...?`**: `How about playing sports?` (去做运动怎么样？) 注意 `about` 是介词，后面跟动词的-ing形式。\n- **`Why don't we...?`**: `Why don't we play sports?` (我们为什么不去做运动呢？) 这是一种委婉的建议。\n\n### 3. 状语的语序\n当一个句子中有多个状语时，其语序比较灵活，但通常遵循“方式状语 → 地点状语 → 时间状语”的原则。在本题中，`with our friends` (方式) 和 `after class` (时间) 放在句末，`Let's play sports after class with our friends!` 也是正确的。", "socratic_tracks": [{"title": "句子主干识别", "steps": [{"question": "看到这些零散的词，你首先会找哪个词来作为句子的“骨架”？", "hint": "一个完整的句子通常需要一个动作。哪个词是表示动作的？", "takeaway": "在连词成句中，首先要找到核心的动词，并确定句子的基本类型。"}, {"question": "我们找到了动词 `play`。再看看有没有像 `Let's` 这样能决定句子类型的特殊词汇？", "hint": "`Let's` 开头的句子是用来做什么的？它的结构有什么特点？", "takeaway": "`Let's` 决定了这是一个提建议的祈使句，其后必须跟动词原形。"}, {"question": "确定了 `Let's play` 这个核心后，`sports` 应该放在哪里？", "hint": "`play` 是一个及物动词，意思是“玩；打”，它需要一个宾语来表示“玩什么”。", "takeaway": "动词和它的宾语通常紧密相连，构成了句子的主干部分 `Let's play sports`。"}]}, {"title": "状语的安放", "steps": [{"question": "句子主干 `Let's play sports` 已经确定，剩下的 `with our friends` 和 `after class` 是什么成分？它们在句子中起什么作用？", "hint": "想一想，“和朋友们一起”和“下课后”是在描述动作的时间、地点还是方式？", "takeaway": "介词短语在句中常作状语，用来补充说明动作发生的时间、地点、方式等信息。"}, {"question": "这两个状语应该放在句子的哪个位置？是句首、句中还是句末？", "hint": "状语的位置比较灵活，但通常放在哪里最自然？", "takeaway": "状语通常放在所修饰的动词之后或句末，使句子意思更完整。"}]}, {"title": "标点与语气", "steps": [{"question": "题目最后给了一个 `(!)` 的提示，这是什么意思？", "hint": "这个符号在写作中叫什么？它应该放在一句话的什么位置？", "takeaway": "括号里的标点提示是句末必须使用的标点符号，这里是感叹号。"}, {"question": "为什么用感叹号比用句号在这里更合适？", "hint": "对比一下 “我们去运动吧。” 和 “我们去运动吧！” 这两句话的语气有什么不同？", "takeaway": "使用感叹号可以表达更强烈的感情，如兴奋、热情或强烈的建议，符合 `Let's` 句型的语境。"}]}]}}]}, {"section_title": "II. 用所给词的正确形式填空。(共10分)", "section_instruction": "", "items": [{"number": "1", "item_type": "fill_blank", "context_note": "", "stem": "My father _____ sports every morning. He loves _____ sports very much. (do)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "does|doing", "explanation_md": "本题考查动词在不同句子结构中的正确形式。\n1.  第一个空所在句子的主语是 `My father`，是第三人称单数。时间状语 `every morning` 表明这是一个经常性、习惯性的动作，应使用一般现在时。因此，动词 `do` 需要变为第三人称单数形式 `does`。\n2.  第二个空在动词 `loves` 后面。`love` 作为谓语动词，其后如果再跟一个动词作宾语，通常需要将该动词变为动名词形式（-ing形式）。因此，`do` 应变为 `doing`。\n3.  所以，两个空应分别填入 `does` 和 `doing`。", "knowledge_expansion_md": "### 1. 一般现在时第三人称单数\n当主语是第三人称单数（如 `he`, `she`, `it`, `my father`, `the dog` 等）时，一般现在时中的谓语动词需要进行变化，规则如下：\n- **一般情况**：在动词原形后加 `-s`，如 `work` -> `works`。\n- **以 s, x, ch, sh 结尾**：加 `-es`，如 `watch` -> `watches`。\n- **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-es`，如 `study` -> `studies`。\n- **特殊变化**：`go` -> `goes`，`do` -> `does`，`have` -> `has`。\n\n### 2. 动词后接动名词（-ing）作宾语\n英语中有一类动词，后面只能跟动名词作宾语，常见的有：`enjoy` (喜欢), `finish` (完成), `mind` (介意), `practice` (练习), `suggest` (建议), `avoid` (避免), `keep` (坚持)。\n另一类动词，如 `love`, `like`, `hate`, `start`, `begin`，后面既可以跟动名词（-ing），也可以跟不定式（to do），在很多情况下意义差别不大。例如 `He loves doing sports.` 和 `He loves to do sports.` 都很常用。", "socratic_tracks": [{"title": "时态判断与主谓一致", "steps": [{"question": "看第一个句子，`every morning` 这个时间短语告诉我们，这个动作是什么时候发生的？", "hint": "是只发生一次，还是每天都发生？这对应什么时态？", "takeaway": "`every morning` 是典型的一般现在时的时间标志，表示习惯性动作。"}, {"question": "这个句子的主语是 `My father`，这是第几人称？是单数还是复数？", "hint": "`My father` 可以用代词 `he` 来替换。", "takeaway": "`My father` 是第三人称单数主语。"}, {"question": "在一般现在时中，当主语是第三人称单数时，动词 `do` 应该变成什么样子？", "hint": "回想一下动词第三人称单数变化的特殊规则。", "takeaway": "主语为第三人称单数时，一般现在时的动词 `do` 需变为 `does`。"}]}, {"title": "非谓语动词形式", "steps": [{"question": "看第二个空，它前面的动词是什么？", "hint": "在 `_____ sports very much` 前面，有一个表示“爱”的词。", "takeaway": "第二个空的前面是谓语动词 `loves`。"}, {"question": "当一个动词（比如 `do`）跟在 `love` 后面作宾语时，`do` 的形式应该怎么变？", "hint": "想一想你平时怎么说“我喜欢游泳”？是 `I like swim` 还是 `I like swimming`？", "takeaway": "在 `love`, `like`, `enjoy` 等表示喜好的动词后面，通常跟动名词（-ing形式）作宾语。"}]}, {"title": "词汇搭配", "steps": [{"question": "在英语中，“做运动”除了用 `do sports`，还有没有其他常见的说法？", "hint": "比如“打”篮球，“踢”足球，这些“打”和“踢”可以用哪个词来总称？", "takeaway": "`play sports` 和 `do sports` 都可以表示“做运动”，`play` 侧重竞技性、球类运动，`do` 的范围更广。"}, {"question": "这道题给了动词 `do`，用在这里合适吗？", "hint": "`do sports` 是一个固定搭配吗？", "takeaway": "`do sports` 是一个非常地道的固定搭配，因此我们只需关注其语法形式的变化即可。"}]}]}}, {"number": "2", "item_type": "fill_blank", "context_note": "", "stem": "—Does Mary _____ a computer at school?\n—Yes, she does. She _____ one and she can study on it. (have)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "have|has", "explanation_md": "本题考查动词 `have` 在一般现在时中的不同形式。\n1.  第一个空位于一个由 `Does` 开头的一般疑问句中。一般疑问句的结构是 `Do/Does + 主语 + 动词原形 + ...?`。助动词 `Does` 已经承担了时态和人称的功能，所以后面的实义动词必须使用原形。因此，第一个空应填 `have`。\n2.  第二个空位于一个陈述句中，主语是 `She`，为第三人称单数。在一般现在时中，当主语是第三人称单数时，动词 `have` 需用其特殊形式 `has`。\n3.  句意为：“玛丽在学校有电脑吗？”“是的，她有。她有一台，并且可以在上面学习。”", "knowledge_expansion_md": "### 1. 助动词 `do/does` 的用法\n`do` 和 `does` 是帮助构成一般现在时的疑问句和否定句的助动词，它们本身没有实际意义。\n- **关键规则**：一旦句中出现了助动词 `do`, `does` 或 `did`，其后的主要动词必须使用**动词原形**。\n- **疑问句**: `Does she have a computer?` (她有电脑吗？)\n- **否定句**: `She doesn't have a computer.` (她没有电脑。)\n- **易错点**: 错误地写成 `*Does she has a computer?` 或 `*She doesn't has a computer.` 是初学者常见的错误。\n\n### 2. `have` 和 `has` 的区别\n`have` 和 `has` 都是动词 `have`（有）在一般现在时下的形式。\n- **`has`**：仅用于主语是**第三人称单数**时（`he`, `she`, `it`, `Mary`, `the teacher` 等）。例: `He has a new bike.`\n- **`have`**：用于其他所有人称（`I`, `you`, `we`, `they`）以及复数主语。例: `We have a big classroom.`", "socratic_tracks": [{"title": "疑问句中的动词形式", "steps": [{"question": "观察第一个空所在的句子，它以哪个词开头？这说明它是什么类型的句子？", "hint": "以 `Do` 或 `Does` 开头的句子，通常需要用 `Yes` 或 `No` 来回答。", "takeaway": "以 `Does` 开头的句子是一般现在时的一般疑问句。"}, {"question": "在一个有助动词 `Does` 的句子里，后面的主要动词应该用什么形式？", "hint": "助动词 `Does` 已经告诉我们主语是第三人称单数了，那么后面的动词还需要再变化吗？", "takeaway": "助动词 `do/does` 后面的动词必须使用原形，所以这里应该填 `have`。"}]}, {"title": "陈述句中的主谓一致", "steps": [{"question": "看第二个空所在的句子，它的主语是谁？", "hint": "句子的第一个词是 `She`。", "takeaway": "第二个空所在句子的主语是 `She`，即第三人称单数。"}, {"question": "当主语是第三人称单数，并且时态是一般现在时，动词“有”应该用 `have` 还是 `has`？", "hint": "回忆一下 `have` 的第三人称单数形式的特殊变化。", "takeaway": "在一般现在时中，当主语是第三人称单数时，动词 `have` 必须变为 `has`。"}]}, {"title": "上下文与对话逻辑", "steps": [{"question": "这是一个对话。回答 `Yes, she does.` 是对前面问题的肯定回答。这个回答确认了什么信息？", "hint": "`Yes, she does.` 是 `Yes, she does have a computer at school.` 的省略形式。", "takeaway": "这个回答确认了“玛丽在学校有电脑”这一事实。"}, {"question": "既然确认了她有电脑，那么第二句话 `She _____ one...` 就是在具体陈述这个事实。根据我们之前对主谓一致的分析，这里应该怎么填？", "hint": "用正确的动词形式来陈述“她拥有一台电脑”这个事实。", "takeaway": "上下文逻辑要求我们用一个肯定陈述句来描述事实，结合主语 `She`，所以使用 `has`。"}]}]}}, {"number": "3", "item_type": "fill_blank", "context_note": "", "stem": "It's not _____ (easy) for me _____ (get) a photo of Yao Ming.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "easy|to get", "explanation_md": "本题考查的是一个非常重要的固定句型：`It is + 形容词 + for sb. + to do sth.`。\n1.  这个句型的意思是“对某人来说做某事是……的”。句首的 `It` 是形式主语，真正的主语是后面的不定式短语 `to do sth.`。\n2.  第一个空需要填入一个形容词，来描述做某件事的性质。根据括号中给出的 `easy`，它本身就是形容词，可以直接填入，构成 `It's not easy`。\n3.  第二个空是这个句型结构的核心部分，即不定式短语。不定式的结构是 `to + 动词原形`。因此，根据括号中的 `get`，应填入 `to get`。\n4.  整个句子的意思是：“对我来说，得到一张姚明的照片是不容易的。”", "knowledge_expansion_md": "### 1. 形式主语 `It` 的句型\n当一个句子的主语是一个很长的不定式短语（to do）或动名词短语（doing）时，为了避免句子头重脚轻，我们常常用 `It` 放在句首作形式主语，而把真正的主语放在句子后面。本题就是典型的 `It is + adj. + for sb. + to do sth.` 结构。\n\n### 2. `for sb.` vs. `of sb.` 的辨析\n在这个句型中，不定式前的介词用 `for` 还是 `of` 取决于前面的形容词。\n- **用 `for`**：当形容词是描述**事情**的特征、性质时，用 `for`。这类形容词包括：`easy` (容易的), `hard` (困难的), `difficult` (困难的), `important` (重要的), `necessary` (必要的), `possible` (可能的)。\n  - 例: `It's important for us to learn English well.` (对我们来说学好英语很重要。)\n- **用 `of`**：当形容词是描述**人**的品格、性格、特点时，用 `of`。这类形容词包括：`kind` (好心的), `nice` (好的), `good` (好的), `clever` (聪明的), `wise` (明智的), `stupid` (愚蠢的), `polite` (有礼貌的)。\n  - 例: `It's very kind of you to help me.` (你帮我真是太好了。)", "socratic_tracks": [{"title": "识别固定句型", "steps": [{"question": "当你看到一个句子以 `It's...` 开头，中间有 `for sb.`，句末还有一个动词时，你首先会想到哪个英语句型？", "hint": "这个句型通常用来表达“做某事对某人来说怎么样”。", "takeaway": "这很可能是 `It is + 形容词 + for sb. + to do sth.` 的固定句型。"}, {"question": "在这个句型中，`It` 真正指的是什么？", "hint": "“得到一张姚明的照片是不容易的。”这句话里，“不容易”的是什么？", "takeaway": "`It` 是形式主语，它指代的是后面 `to get a photo of Yao Ming` 这件具体的事情。"}]}, {"title": "动词不定式", "steps": [{"question": "在这个固定句型 `It is ... for sb. to do sth.` 中，`to do sth.` 是什么成分？它有什么固定的形式吗？", "hint": "这个部分叫做“动词不定式短语”，它的构成是固定的。", "takeaway": "`to do sth.` 是动词不定式，它的标准形式是 `to + 动词原形`。"}, {"question": "那么根据这个规则，题目中括号里的动词 `get` 应该变成什么形式填入第二个空？", "hint": "直接套用 `to + 动词原形` 的公式。", "takeaway": "动词 `get` 在这里应使用不定式形式 `to get`。"}]}, {"title": "形容词的作用", "steps": [{"question": "在第一个空中，我们需要填入 `easy` 的某种形式。`easy` 是什么词性的词？", "hint": "它用来描述事物“容易的”或“不容易的”状态。", "takeaway": "`easy` 是一个形容词。"}, {"question": "在这个 `It is ... for sb. to do sth.` 句型中，第一个空就是要放一个形容词。那么 `easy` 需要变化吗？比如变成副词 `easily` 或者比较级 `easier`？", "hint": "句型结构是 `It is + 形容词`。这里没有比较，也没有修饰动词，只是简单描述。", "takeaway": "此处只需填入形容词原形 `easy`，因为它直接作 `is` 的表语，描述主语 `It`（即 to get a photo... 这件事）的性质。"}]}]}}, {"number": "4", "item_type": "fill_blank", "context_note": "", "stem": "John loves _____ soccer with his friends. He _____ it after class every day. (play)", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "playing|plays", "explanation_md": "1. 第一个空考察固定搭配 `love doing sth.`，意为“喜欢做某事”，因此填动名词 `playing`。\n2. 第二个空所在句子中有时间状语 `every day`（每天），表示一个经常性、习惯性的动作，应用一般现在时。\n3. 主语 `He` 是第三人称单数，所以动词 `play` 需要使用第三人称单数形式 `plays`。", "knowledge_expansion_md": "### 动词后接非谓语动词\n\n1.  **只接动名词 (doing) 的常见动词**：`enjoy` (享受), `finish` (完成), `mind` (介意), `practise` (练习), `keep` (坚持), `avoid` (避免)。\n    *   例：`He enjoys playing football.`\n2.  **只接不定式 (to do) 的常见动词**：`want` (想要), `hope` (希望), `decide` (决定), `plan` (计划), `agree` (同意)。\n    *   例：`She wants to be a doctor.`\n3.  **接两者均可，含义差别不大的动词**：`like` (喜欢), `love` (爱), `hate` (讨厌), `start` (开始), `begin` (开始), `continue` (继续)。\n    *   例：`I love singing.` / `I love to sing.`\n\n### 一般现在时第三人称单数\n\n当主语是 `he`, `she`, `it` 或单个的人名、地名等单数名词时，动词需要变化：\n*   **一般情况**：直接在动词后加 `-s`，如 `play` -> `plays`。\n*   **以 s, x, ch, sh, o 结尾**：加 `-es`，如 `go` -> `goes`, `watch` -> `watches`。\n*   **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-es`，如 `study` -> `studies`。", "socratic_tracks": [{"title": "动词搭配：love doing", "steps": [{"question": "在英语中，动词 `love` 后面如果跟另一个动词，这个动词通常会变成什么形式？", "hint": "回想一下“我喜欢游泳”怎么说？是 `I love swim` 吗？", "takeaway": "动词 `love` 后面常跟动词的-ing形式（动名词）来表示喜爱做某事。"}, {"question": "除了-ing形式，`love` 后面还可以跟哪种形式？", "hint": "想想 `want to do sth.` 这个结构，`love` 也可以这样用吗？", "takeaway": "`love` 后面也可以跟 `to do` 形式（不定式），两者在多数情况下意思相近。"}]}, {"title": "时态判断：一般现在时", "steps": [{"question": "看到句子中的 `every day`（每天），你觉得这个动作是过去发生的、正在发生的，还是经常发生的？", "hint": "“每天”意味着这个动作是一种习惯。", "takeaway": "`every day` 是一个标志词，表示习惯性或重复性的动作，需要使用一般现在时。"}]}, {"title": "主谓一致：第三人称单数", "steps": [{"question": "第二个空的主语是谁？是“我”、“你”还是“他/她/它”？", "hint": "主语是 `He`。", "takeaway": "句子的主语 `He` 是第三人称单数。"}, {"question": "在一般现在时中，如果主语是第三人称单数，动词需要发生什么变化？", "hint": "对比一下 `I play` 和 `He play`，后者听起来对吗？", "takeaway": "当主语是第三人称单数时，一般现在时的动词词尾通常需要加-s或-es。"}]}]}}, {"number": "5", "item_type": "fill_blank", "context_note": "", "stem": "That _____ (sound) great! Let's play computer _____ (game) together!", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "sounds|games", "explanation_md": "1. 第一个空 `That _____ (sound) great!` 中，`sound` 是一个感官系动词，意为“听起来”。主语 `That` 是第三人称单数，因此动词 `sound` 需要用第三人称单数形式 `sounds`。\n2. `great` 是形容词，用作表语，说明主语 `That` 的状态，符合“主+系+表”结构。\n3. 第二个空 `computer _____ (game)` 中，`computer game` 是“电脑游戏”的意思。根据语境 `Let's play... together!`（我们一起玩吧！），通常指玩多种游戏或泛指游戏这项活动，所以使用可数名词 `game` 的复数形式 `games` 更为常见和地道。", "knowledge_expansion_md": "### 感官系动词 (Linking Verbs)\n\n这类动词本身有一定词义，但主要起连接主语和表语的作用，说明主语的状态、特征等。它们后面通常跟**形容词**作表语，而不是副词。\n*   **常见感官系动词**：`look` (看起来), `sound` (听起来), `smell` (闻起来), `taste` (尝起来), `feel` (感觉起来)。\n*   **例句**：`The music sounds beautiful.` (音乐听起来很美。) `This cake tastes delicious.` (这个蛋糕尝起来很美味。)\n*   **易错点**：不要在系动词后使用副词。错误：`It looks beautifully.` 正确：`It looks beautiful.`\n\n### 名词的数\n\n*   **可数名词**：有单数和复数形式。`game` 是可数名词，其复数形式是 `games`。\n*   **不可数名词**：没有复数形式，如 `water`, `information`, `advice`。\n*   在 `play` 后面接表示球类、棋类或游戏的名词时，如果泛指该项运动，名词前通常不加冠词，如 `play football`, `play chess`。但如果特指游戏，或表示种类数量，则需要考虑单复数和冠词，如 `play a game`, `play computer games`。", "socratic_tracks": [{"title": "系动词用法", "steps": [{"question": "在 `That _____ great!` 这个句子里，动词 `sound` 是什么作用？", "hint": "它连接了主语 `That` 和形容词 `great`，用来描述主语听起来怎么样。", "takeaway": "`sound` 在这里是系动词，意为“听起来”，用来连接主语和表语。"}, {"question": "为什么 `sound` 后面要加 `s`？", "hint": "看看句子的主语 `That`，它是单数还是复数？", "takeaway": "主语 `That` 是第三人称单数，所以系动词 `sound` 也要用第三人称单数形式 `sounds`。"}]}, {"title": "名词的单复数", "steps": [{"question": "“我们一起玩电脑游戏吧！” 这句话里，你觉得是玩一个特定的游戏，还是泛指玩游戏这个活动？", "hint": "通常提出一起玩的建议时，指的是游戏这个大类，或者可能会玩好几个。", "takeaway": "在泛指玩某种游戏或表示玩多个游戏时，通常使用名词的复数形式。"}, {"question": "那么，`game` 这个可数名词应该变成什么形式？", "hint": "可数名词的复数形式最常见的变化是什么？", "takeaway": "可数名词 `game` 的复数形式是直接加-s，变为 `games`。"}]}, {"title": "祈使句型 Let's", "steps": [{"question": "`Let's play...` 这个句型是用来做什么的？", "hint": "说话的人想邀请听话的人一起做某事。", "takeaway": "`Let's...` 是一个提出建议的常用句型，意为“让我们做某事吧”。"}, {"question": "`Let's` 是哪两个词的缩写？它后面的动词有什么要求？", "hint": "`Let's` = `Let us`。想一想 `let sb. do sth.` 这个结构。", "takeaway": "`Let's` 是 `Let us` 的缩写，后面必须跟动词原形。"}]}]}}]}, {"section_title": "III. 首字母填空。(共10分)", "section_instruction": "", "items": [{"number": "1", "item_type": "fill_blank", "context_note": "", "stem": "After school, I always play sports like football and basketball with my c_____.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "classmates", "explanation_md": "1.  根据句意“放学后，我总是和我的____一起踢足球、打篮球”，空格处需要填写一个表示同伴的名词。\n2.  结合语境“放学后”(After school) 和体育活动，最合理的人是“同学”。\n3.  题目给出了首字母 `c`，符合单词 `classmates` (同学)。\n4.  介词 `with` 后面通常接复数名词表示“和……们一起”，因此使用复数形式 `classmates`。", "knowledge_expansion_md": "### 根据语境推断词义\n\n在首字母填空题中，语境是解题的关键。你需要：\n1.  **通读句子**：理解句子大意和场景。本题场景是“校园活动”。\n2.  **分析逻辑**：谁会“放学后一起运动”？最常见的是同学、朋友。\n3.  **结合首字母**：在可能的答案中，找到符合首字母 `c` 的词，即 `classmates`。\n\n### 校园相关词汇\n\n*   **人物**: `teacher` (老师), `student` (学生), `classmate` (同学), `principal` (校长), `monitor` (班长)\n*   **地点**: `classroom` (教室), `playground` (操场), `library` (图书馆), `gym` (体育馆), `canteen` (食堂)\n*   **活动**: `have a class/lesson` (上课), `do homework` (做作业), `play sports` (做运动), `take an exam` (参加考试)\n\n### 复合名词\n\n`classmate` 是一个复合名词，由 `class` (班级) + `mate` (伙伴) 构成。类似的词还有 `schoolmate` (校友), `roommate` (室友), `teammate` (队友)。复合名词变复数时，通常只在最后一个词的词尾加 `-s`。", "socratic_tracks": [{"title": "语境线索分析", "steps": [{"question": "这句话描述了什么时间、什么地点的什么活动？", "hint": "时间是 `After school`，活动是 `play sports`。", "takeaway": "这是一个关于“放学后进行体育活动”的场景。"}, {"question": "在这样的场景下，`I` (我) 最可能和谁一起活动？", "hint": "想一想你在学校里，放学后会和谁一起玩？", "takeaway": "根据校园生活常识，最可能一起活动的是“同学”或“朋友”。"}]}, {"title": "首字母猜词", "steps": [{"question": "哪个表示“同学”的单词是以字母 `c` 开头的？", "hint": "这个词由“班级”和“伙伴”两个词组合而成。", "takeaway": "以 `c` 开头的表示“同学”的单词是 `classmate`。"}, {"question": "为什么这里要用复数形式 `classmates` 而不是单数 `classmate`？", "hint": "介词 `with` 后面通常表示和某人“们”一起，而且句中提到了足球、篮球两种集体运动。", "takeaway": "因为是和一群人一起进行集体运动，所以需要使用名词的复数形式。"}]}, {"title": "复合词的构成", "steps": [{"question": "`classmate` 这个词可以拆分成哪两个部分？", "hint": "第一个部分是 `class`，第二个部分是 `mate`。", "takeaway": "`classmate` 是一个由 `class` (班级) 和 `mate` (伙伴) 构成的复合词。"}, {"question": "你能举出其他由 `mate` 构成的复合词吗？", "hint": "比如，住在同一个房间的伙伴叫什么？在同一个队伍里的伙伴呢？", "takeaway": "类似的复合词还有 `roommate` (室友) 和 `teammate` (队友)。"}]}]}}, {"number": "2", "item_type": "fill_blank", "context_note": "", "stem": "Playing baseball is i_____. I love playing it.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "interesting", "explanation_md": "1.  本题考查形容词。第一句 `Playing baseball is i_____.` 意为“打棒球是_____的。”\n2.  第二句 `I love playing it.` (我喜欢打棒球) 为第一句提供了关键线索，表明说话人对打棒球持积极、正面的态度。\n3.  因此，空格处需要填一个以字母 `i` 开头的褒义形容词。\n4.  `interesting` (有趣的) 符合首字母要求和语境，说明打棒球这项活动是“令人感觉有趣的”。", "knowledge_expansion_md": "### -ing 形容词 vs. -ed 形容词\n\n这是一对非常重要的形容词形式，也是常见的易错点。\n\n*   **-ing 形容词 (如 `interesting`, `exciting`, `boring`)**\n    *   **作用**：描述事物或人的**性质、特征**，表示“**令人……的**”。\n    *   **主语**：通常是**物**或**事**，也可以是**人**。\n    *   **例句**：`The movie is interesting.` (这部电影很有趣。) `He is an interesting person.` (他是个有趣的人。)\n\n*   **-ed 形容词 (如 `interested`, `excited`, `bored`)**\n    *   **作用**：描述**人**的**感受、情绪**，表示“**感到……的**”。\n    *   **主语**：通常是**人**。\n    *   **例句**：`I am interested in the movie.` (我对这部电影感兴趣。) `The students are excited.` (学生们感到很兴奋。)\n\n在本题中，主语是 `Playing baseball` (打棒球这件事)，是事物，所以用 `-ing` 形式的 `interesting` 来描述它的性质。", "socratic_tracks": [{"title": "上下文逻辑推理", "steps": [{"question": "看到第二句话 `I love playing it.`，你觉得说话人认为打棒球怎么样？", "hint": "`love` 是一个表达非常强烈正面情感的词。", "takeaway": "后文的 `love` 表明，说话人认为打棒球是一件非常好的、正面的事情。"}, {"question": "那么，第一句话中用来形容“打棒球”的词，应该是一个表示“好”的词，还是“坏”的词？", "hint": "既然喜欢，那描述它的词也应该是积极的。", "takeaway": "根据逻辑，空格处需要填入一个褒义形容词来形容打棒球这项活动。"}]}, {"title": "形容词辨析：-ing vs. -ed", "steps": [{"question": "这个空是用来形容“打棒球”这件事，还是形容“人”的感受？", "hint": "句子的主语是 `Playing baseball`，这是一件事。", "takeaway": "这个形容词是用来描述事物本身的特性。"}, {"question": "当形容词用来描述事物的特性，表示“令人感到……”时，词尾通常是什么？", "hint": "比如，一部“令人兴奋的”电影是 `an exciting movie`。", "takeaway": "描述事物性质、表示“令人……”的形容词，通常以-ing结尾。"}, {"question": "那什么时候用 `-ed` 结尾的形容词呢？比如 `interested`？", "hint": "想一想“我对……感兴趣”怎么说？主语是谁？", "takeaway": "描述人的感受、表示“感到……”的形容词，通常以-ed结尾，主语是人。"}]}, {"title": "词汇联想与拼写", "steps": [{"question": "你能想到哪些以 `i` 开头，并且是褒义的形容词？", "hint": "可以形容一本书、一部电影或一项活动很有趣的词是什么？", "takeaway": "符合语境和首字母的词是 `interesting` (有趣的)。"}, {"question": "你能试着拼写 `interesting` 吗？", "hint": "它可以拆成 `in-ter-est-ing` 几个部分来记。", "takeaway": "掌握 `interesting` 的正确拼写是得分的关键。"}]}]}}, {"number": "3", "item_type": "fill_blank", "context_note": "", "stem": "W_____ TV is fun for Bill. He likes it a lot.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "Watching", "explanation_md": "本题考查动名词作主语的用法。句子缺少主语，谓语动词是单数形式 `is`。根据句意“___电视对Bill来说很有趣”以及首字母W提示，可知这里指的是“看电视”这个动作。在英语中，若要将一个动作作为句子的主语，通常需要使用动词的动名词形式（v-ing）。因此，应将动词 `watch` 变为 `Watching` 填入句首，构成“Watching TV”这一动名词短语，充当句子主语。", "knowledge_expansion_md": "### 动名词（Gerund）作主语\n\n1.  **定义**：动名词是由“动词+ing”构成的一种非谓语动词，它具有名词的词性和功能，可以在句子中作主语、宾语、表语等。\n2.  **作主语的特点**：当动名词或动名词短语作主语时，通常被看作一个单数概念的整体，因此谓语动词要用第三人称单数形式。例如：\n    *   `Reading is a good habit.` (读书是一个好习惯。)\n    *   `Playing computer games too much is bad for your eyes.` (玩太多电脑游戏对你的眼睛不好。)\n3.  **与不定式作主语的比较**：动词不定式（to do）也可以作主语，且通常可以与动名词互换，但动名词作主语在口语中更常见、更自然。例如：`To see is to believe.` 相当于 `Seeing is believing.` (百闻不如一见。)\n4.  **易错点**：切勿用动词原形直接作主语。错误示例：`Watch TV is fun.`", "socratic_tracks": [{"title": "句子成分分析", "steps": [{"question": "这个句子 “___ TV is fun for Bill” 缺少了哪个主要成分？", "hint": "一个完整的句子通常包含主语和谓语。看看谓语动词 `is` 在哪里。", "takeaway": "句子缺少位于谓语动词 `is` 前面的主语。"}, {"question": "什么词性的词或短语可以充当句子的主语？", "hint": "想一想 “An apple is red.” 和 “He is a student.” 中的主语是什么词。", "takeaway": "名词、代词或具有名词功能的短语（如动名词短语）可以作主语。"}]}, {"title": "动名词的构成与功能", "steps": [{"question": "根据首字母W和后面的TV，我们可以推断出这里想表达的动作是什么？", "hint": "我们用眼睛“看”电视，这个“看”的英文动词是什么？", "takeaway": "想表达的动作是 “watch TV”（看电视）。"}, {"question": "如何将 “watch TV” 这个动词短语变成一个名词性的短语，以便在句子中作主语？", "hint": "英语中有一种常见的语法，即在动词后面加上-ing，使其具有名词的功能。", "takeaway": "需要将动词 `watch` 变成动名词 `Watching`，构成动名词短语 `Watching TV` 作主语。"}]}, {"title": "主谓一致原则", "steps": [{"question": "当一个动作（比如“看电视”）作为主语时，我们应该把它看作是单数还是复数？", "hint": "“看电视”这件事本身是一件抽象的事情，是一整个概念。", "takeaway": "当动名词短语作主语时，通常被视为单数概念。"}, {"question": "既然主语是单数，那么后面的be动词应该用 `is` 还是 `are`？", "hint": "回顾一下be动词的单复数用法：`he is`, `they are`。", "takeaway": "主语是单数，谓语动词也应用单数形式，这与题干中的 `is` 完全吻合。"}]}]}}, {"number": "4", "item_type": "fill_blank", "context_note": "", "stem": "—Can you answer the question? —Sorry, it's d_____ for me.", "options": {"A": "", "B": "", "C": "", "D": ""}, "answer_area_hint": "", "teaching": {"correct_answer": "difficult", "explanation_md": "本题考查在语境中选择合适的形容词。这是一段对话，提问方问：“你能回答这个问题吗？”回答方以“Sorry”（对不起）开头，这暗示他无法回答。因此，空格处需要填入一个形容词来解释无法回答的原因。根据首字母 'd' 和上下文逻辑，可以判断出这个问题对他来说是“困难的”。`difficult` 意为“困难的”，符合语境。完整的句子是 “Sorry, it's difficult for me.”（对不起，这对我来说很难。）", "knowledge_expansion_md": "### 形容词作表语及相关词汇\n\n1.  **形容词作表语**：在 `主语 + be动词 + 形容词` 的结构中，形容词作表语，用来说明主语的性质、状态或特征。这里的 `it's` 是 `it is` 的缩写，`difficult` 就是作表语的形容词，说明主语 `it`（指代 a a a a a a a a a a a a a a a a a a a a a a
