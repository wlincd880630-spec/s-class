ay":"favorite 是美式拼写，favourite 是英式拼写，两者都对，但考试中建议使用教材上的版本。"}]},{"title":"句式辨析","steps":[{"question":"为什么这个问题用 'Which' 开头，而不是 'What'？","hint":"想一想 'Which' 和 'What' 在提问时，范围上有什么不同？","takeaway":"'Which' 通常用于在有限的、明确的选项中进行选择，而 'What' 用于范围更广、不确定的情况。"},{"question":"我们如何用另一种方式来问同样的问题？","hint":"使用动词 'like' 和副词 'best'。","takeaway":"我们可以说 “Which festival do you like best?” 来表达相同的意思。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"How do people c_____ Halloween?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"celebrate","explanation_md":"本题考查动词词义和一般现在时。句意为“人们如何庆祝万圣节？”。根据句意和首字母 'c' 的提示，可以确定动词是 'celebrate'（庆祝）。在由 'do' 引导的一般现在时疑问句中，行为动词应使用原形。因此，空中应填写动词原形 'celebrate'。","knowledge_expansion_md":"1.  **词汇家族 `celebrate`**:\n    *   `celebrate` (v.): 庆祝。例如：`We celebrated his birthday with a cake.` (我们用蛋糕庆祝了他的生日。)\n    *   `celebration` (n.): 庆祝；庆典。例如：`The Spring Festival is a time for family celebration.` (春节是家庭庆典的时刻。)\n    *   `celebrity` (n.): 名人。这个词虽然长得像，但意思完全不同，需要注意区分。\n\n2.  **与节日相关的动词**:\n    *   `celebrate`: 最常用的“庆祝”动词。\n    *   `observe`: 较正式的“庆祝，纪念”，指遵循传统习俗。例如：`How do you observe the New Year?`\n    *   `mark`: 标记，纪念（某一事件）。例如：`This ceremony marks the 100th anniversary of the school.`","socratic_tracks":[{"title":"动词形式判断","steps":[{"question":"观察这个问句的结构：'How do people c_____ ...?'。助动词 'do' 后面应该跟什么形式的动词？","hint":"回想一下一般现在时疑问句的构成：Do/Does + 主语 + ...?","takeaway":"在含有助动词 do/does/did 的疑问句或否定句中，后面的动词必须使用原形。"},{"question":"如果主语换成 'he'，这个句子会怎么变？","hint":"主语是第三人称单数时，助动词 'do' 会变成什么？","takeaway":"句子会变成 'How does he celebrate Halloween?'，但 celebrate 依然是动词原形。"}]},{"title":"语境与词义","steps":[{"question":"这个句子是关于 'Halloween'（万圣节）的。对于一个节日，人们通常会做什么？","hint":"比如过生日、过新年，我们用什么动词来描述这些活动？","takeaway":"对于节日、生日等特殊日子，我们通常会“庆祝”它。"},{"question":"表示“庆祝”的、以 'c' 开头的英文单词是什么？","hint":"这个词的拼写是 c-e-l-e-b-r-a-t-e。","takeaway":"表示“庆祝”的动词是 celebrate。"}]},{"title":"词汇拓展","steps":[{"question":"我们学会了动词 celebrate，那它的名词形式“庆祝”或“庆典”怎么说？","hint":"词尾通常会变成 -ion。","takeaway":"celebrate 的名词形式是 celebration。"},{"question":"如果我们要用一个句子来描述春节是一个盛大的庆典，可以怎么说？","hint":"The Spring Festival is a big _____.","takeaway":"我们可以说：'The Spring Festival is a big celebration.'"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"He often eats vegetables and fruits to keep _____ (健康).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"healthy","explanation_md":"本题考查根据中文提示填写正确的单词形式。中文提示为“健康”，在句子中需要一个词来修饰主语的状态。动词“keep”意为“保持”，后面常跟形容词作表语，构成“keep + adj.”结构，表示“保持某种状态”。因此，此处应填写“健康”的形容词形式“healthy”。整个短语“keep healthy”意为“保持健康”，符合句意。","knowledge_expansion_md":"### 词性辨析：health vs. healthy vs. healthily\n- **health** 是名词，意为“健康；健康状况”。例如：`Health is more important than wealth.` (健康比财富更重要。)\n- **healthy** 是形容词，意为“健康的”，可以修饰人或物。例如：`He is a healthy boy.` (他是个健康的男孩。) `Eating vegetables is healthy.` (吃蔬菜是健康的/有益健康的。)\n- **healthily** 是副词，意为“健康地”，用来修饰动词。例如：`We should eat healthily.` (我们应该吃得健康。)\n\n### 固定搭配：keep + 形容词\n“keep”后面跟形容词是一种常见的用法，表示“保持……的状态”。\n- `keep quiet` 保持安静\n- `keep warm` 保持温暖\n- `keep calm` 保持冷静\n- `keep busy` 保持忙碌","socratic_tracks":[{"title":"词性辨析","steps":[{"question":"观察句子结构 `... to keep _____`，这里的 `keep` 是什么意思？它后面通常跟什么词性的词？","hint":"想想我们常说的“保持安静” (keep quiet)，`quiet` 是什么词性？","takeaway":"`keep` 在这里是“保持”的意思，后面常跟形容词来表示保持某种状态。"},{"question":"中文提示是“健康”，它的名词形式和形容词形式分别是什么？","hint":"名词是“健康”这个概念，形容词是“健康的”。","takeaway":"“健康”的名词是 `health`，形容词是 `healthy`。"},{"question":"根据前面的分析，这个空应该填入名词还是形容词？","hint":"我们需要一个形容词来搭配 `keep`，表示“保持健康”。","takeaway":"为了构成 `keep + 形容词` 的结构，此处应填 `healthy`。"}]},{"title":"固定搭配","steps":[{"question":"除了 `keep healthy`，你还知道哪些表示“保持健康”的英文短语？","hint":"试着用 `stay` 这个词来表达。","takeaway":"`stay healthy` 也是“保持健康”的常用表达。"},{"question":"如果我们想用名词 `health` 来表达类似的意思，可以怎么说？","hint":"可以借助介词 `in`，比如 `in good ...`。","takeaway":"我们可以说 `keep in good health` 或 `stay in good health`，意思也是保持健康。"}]},{"title":"近义词辨析","steps":[{"question":"`healthy` 和 `healthful` 都有“有益健康”的意思，它们在使用上有什么区别吗？","hint":"一个常用来形容人，一个常用来形容物（如食物、活动）。","takeaway":"传统上，`healthy` 形容人或生物本身是健康的，而 `healthful` 形容食物或生活方式是有益健康的。"},{"question":"那为什么我们常听到 `a healthy diet` (健康的饮食) 这种说法呢？","hint":"在现代英语中，`healthy` 的用法有所扩展。","takeaway":"在现代英语中，`healthy` 也可以用来指食物或习惯有益健康，并且比 `healthful` 更常用。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"My new dress is made of _____ (丝绸).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"silk","explanation_md":"本题考查根据中文提示填写表示材料的词汇。中文提示为“丝绸”。句型 `be made of...` 用于说明一件物品是由什么材料制成的，并且原材料的物理性质在成品中依然可见。因此，我们需要填写“丝绸”对应的英文单词。`silk` 就是“丝绸”的英文表达，作为材料时是不可数名词。所以，此处应填写 `silk`。","knowledge_expansion_md":"### 介词短语辨析：be made of / from / in / by\n- **be made of**: “由……制成”，强调原材料在成品中依然可见，物理变化。例如：`The desk is made of wood.` (桌子是木头做的。)\n- **be made from**: “由……制成”，强调原材料在加工后形态或性质已改变，化学变化。例如：`Paper is made from wood.` (纸是由木材造的。)\n- **be made in**: “在……制造”，强调产地。例如：`This car is made in China.` (这辆车是中国制造。)\n- **be made by**: “由……制造”，强调制造者。例如：`The cake was made by my mother.` (这个蛋糕是我妈妈做的。)\n\n### 常见材料词汇\n- `cotton` 棉\n- `wool` 羊毛\n- `leather` 皮革\n- `plastic` 塑料\n- `glass` 玻璃\n- `metal` 金属\n- `wood` 木头\n- `stone` 石头","socratic_tracks":[{"title":"核心词汇","steps":[{"question":"题干中的中文提示“丝绸”指的是什么？","hint":"它是一种光滑、柔软的布料，常用来做裙子、围巾等。","takeaway":"“丝绸”是一种高级的纺织材料。"},{"question":"你知道“丝绸”的英文单词是什么吗？","hint":"这个单词以字母 `s` 开头，发音类似 /sɪlk/。","takeaway":"“丝绸”的英文单词是 `silk`。"}]},{"title":"关键句型","steps":[{"question":"句子中的 `is made of` 是什么意思？","hint":"它用来描述这件裙子是用什么东西做成的。","takeaway":"`be made of` 用来表示物品的制作材料。"},{"question":"`be made of` 和 `be made from` 有什么区别？例如，我们说“酒是由葡萄酿成的”，应该用哪个？","hint":"想一想，在酒里面我们还能直接看到葡萄吗？原材料的样子是不是改变了？","takeaway":"`be made from` 用于原材料经过化学变化、形态已改变的情况，如 `Wine is made from grapes.`。"},{"question":"那我们说“这件裙子是中国制造的”，应该用哪个介词替换 `of`？","hint":"这里强调的是“产地”。","takeaway":"表示产地时用 `be made in`，例如 `made in China`。"}]},{"title":"词汇拓展","steps":[{"question":"除了丝绸 (silk)，你还知道哪些常见的衣物材料？比如我们夏天穿的T恤常用什么材料？","hint":"一种从植物（棉花）中提取的材料，英文是 `c` 开头。","takeaway":"棉是 `cotton`。"},{"question":"冬天我们穿的毛衣，通常是什么材料做的？","hint":"来自绵羊身上的毛。","takeaway":"羊毛是 `wool`。"},{"question":"皮鞋和皮夹克呢？","hint":"来自动物的皮肤，经过加工制成。","takeaway":"皮革是 `leather`。"}]}]}}]},{"section_title":"IV. 句型转换。(共 10 分)","section_instruction":"","items":[{"number":"1","item_type":"sentence_transform","context_note":"","stem":"I collect toys because they are beautiful. (对画线部分提问)\n_____ you collect toys?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Why do","explanation_md":"本题要求对划线部分进行提问。划线部分 `because they are beautiful` 是一个原因状语从句，意为“因为它们很漂亮”。针对原因提问，应使用疑问词 `Why` (为什么)。原句主干 `I collect toys` 是一般现在时的陈述句。在构成特殊疑问句时，主语 `I` 需相应地转换成 `you`。同时，一般现在时的疑问句需要借助助动词 `do` 或 `does`，主语是 `you` 时用 `do`。因此，完整的问句结构是“Why + do + you + collect toys?”。题干若为一处横线，应整体填写 **Why do**（与完整问句 Why do you collect toys? 开头的两词一致，两词之间有空格）。","knowledge_expansion_md":"### 对原因状语从句提问\n对 `because` 引导的原因状语从句提问，是特殊疑问句的一种常见考点。\n1.  **使用 `Why`**：这是最标准的提问方式。\n    - 句式：`Why + 一般疑问句?`\n    - 示例：`He is absent because he is ill.` → `Why is he absent?`\n    - 示例：`They went home because it was late.` → `Why did they go home?`\n2.  **使用 `What ... for`**：这是一种更口语化的提问方式，意思与 `Why` 相近。\n    - 句式：`What + 助动词 + 主语 + 动词 + for?`\n    - 示例：`I collect toys because they are beautiful.` → `What do you collect toys for?`\n\n### 一般现在时疑问句的构成\n- **一般疑问句**：`Do/Does + 主语 + 动词原形 ...?`\n- **特殊疑问句**：`特殊疑问词 + do/does + 主语 + 动词原形 ...?`\n切记，当主语是第三人称单数时用 `does`，其他情况用 `do`。","socratic_tracks":[{"title":"选择疑问词","steps":[{"question":"划线部分 `because they are beautiful` 在句子中表达了什么信息？是时间、地点、还是原因？","hint":"`because` 这个词的中文意思是什么？","takeaway":"划线部分是原因状语从句，解释了“为什么”要收集玩具。"},{"question":"当我们想对“原因”提问时，应该用哪个英文疑问词开头？","hint":"“为什么”的英文是什么？","takeaway":"对原因提问，我们通常使用疑问词 `Why`。"}]},{"title":"变换句子结构","steps":[{"question":"去掉原因部分，原句主干是 `I collect toys`。这是一个陈述句，请把它变成一个一般疑问句。","hint":"一般现在时的句子，主语是 `I`（提问时变成 `you`），需要借助哪个助动词？","takeaway":"原句主干变成一般疑问句是 `Do you collect toys?`。"},{"question":"现在，请把疑问词 `Why` 和刚才得到的一般疑问句 `Do you collect toys?` 组合成一个完整的特殊疑问句。","hint":"特殊疑问句的结构通常是：特殊疑问词 + 一般疑问句语序。","takeaway":"组合后的完整问句是 `Why do you collect toys?`。"}]},{"title":"注意人称变化","steps":[{"question":"在原句 `I collect toys...` 中，主语是谁？","hint":"句子的第一个单词。","takeaway":"原句主语是 `I` (我)。"},{"question":"当别人根据你说的这句话向你提问时，他会怎么称呼你？用 `I` 还是 `you`？","hint":"想象一个对话场景：A说“我收集玩具”，B会问“你为什么收集玩具？”","takeaway":"在问答转换中，陈述句中的主语 `I` 在疑问句中通常要相应地变为 `you`。"}]}]}},{"number":"2","item_type":"sentence_transform","context_note":"","stem":"Let's play the piano, _____? (完成反义疑问句)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"shall we","explanation_md":"本题考查反义疑问句的特殊用法。反义疑问句通常遵循“前肯后否，前否后肯”的原则，但有一些特殊情况需要记忆。当陈述部分是以 `Let's` 开头的祈使句时，无论陈述部分是肯定还是否定形式（尽管 `Let's not...` 很少见），其后的疑问部分都固定为 `shall we?`。`Let's` 是 `Let us` 的缩写，用于提出建议，邀请对方一起做某事，因此用 `shall we?` 来征求对方的意见，意为“我们……，好吗？”。","knowledge_expansion_md":"### 特殊反义疑问句汇总\n1.  **Let's...**: 陈述部分以 `Let's` 开头，疑问部分用 `shall we?`\n    - `Let's go to the park, shall we?`\n2.  **Let us... (请求允许)**: 陈述部分是 `Let us/me...`，表示请求允许，疑问部分用 `will you?` 或 `won't you?`\n    - `Let us use the phone, will you?` (请让我们用一下电话，好吗？)\n3.  **祈使句**: 陈述部分是肯定的祈使句，疑问部分通常用 `will you?` 或 `won't you?`。\n    - `Open the window, will you?`\n    陈述部分是否定的祈使句，疑问部分用 `will you?`。\n    - `Don't be late, will you?`\n4.  **I am...**: 陈述部分是 `I am...`，疑问部分用 `aren't I?`\n    - `I am your teacher, aren't I?`\n5.  **含有半否定词**: 陈述部分含有 `never, seldom, hardly, few, little` 等词时，句子被视为否定，疑问部分用肯定形式。\n    - `He seldom comes here, does he?`","socratic_tracks":[{"title":"识别句子类型","steps":[{"question":"观察句子 `Let's play the piano`，它是在陈述一个事实，还是在提出一个建议？","hint":"`Let's` 的意思是“让我们一起……”。","takeaway":"这是一个以 `Let's` 开头的祈使句，用于提出建议。"},{"question":"对于这种提出建议的 `Let's` 句型，它的反义疑问句有一个固定的、特殊的搭配，你还记得是什么吗？","hint":"这个搭配用来询问对方的意见，表示“……好吗？”","takeaway":"以 `Let's` 开头的祈使句，其反义疑问句固定为 `shall we?`。"}]},{"title":"区分 `Let's` 和 `Let us`","steps":[{"question":"`Let's` 是哪两个词的缩写？","hint":"它包含“我们”的意思。","takeaway":"`Let's` 是 `Let us` 的缩写。"},{"question":"那么，`Let's go.` 和 `Let us go.` 的意思和用法完全一样吗？它们后面的反义疑问句也一样吗？","hint":"想一想，`Let us go.` 有没有可能是对看守说“请让我们走”，这时“我们”并不包含听话的看守。","takeaway":"`Let's` 表建议（包含听话人），反义疑问是 `shall we?`；而 `Let us` 表请求允许（不包含听话人），反义疑问是 `will you?`。"}]},{"title":"反思一般规则","steps":[{"question":"对于一个普通的陈述句，比如 `You like piano.`，它的反义疑问句是什么？","hint":"遵循“前肯后否”的原则。","takeaway":"`You like piano, don't you?`"},{"question":"为什么 `Let's play the piano` 不能也用 `don't we` 这样的形式呢？","hint":"因为它不是一个普通的陈述句，而是一个特殊的祈使句。","takeaway":"祈使句、`I am...` 等句型有特殊的反义疑问句规则，需要作为特例专门记忆，不能套用一般规则。"}]}]}},{"number":"3","item_type":"sentence_transform","context_note":"","stem":"some, in, there, shop, the, music, CDs, are. (连词成句)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"There are some music CDs in the shop.","explanation_md":"本题考查连词成句，需要将给定的单词组成一个语法正确、逻辑通顺的句子。\n1.  观察单词，发现 `there` 和 `are`，可以判断本句考查 `There be` 句型，表示“某地有某物”。\n2.  `There be` 句型中，`be` 动词的形式由其后的名词（逻辑主语）的单复数决定。`CDs` 是复数名词，所以用 `are`。\n3.  将 `some`, `music`, `CDs` 组合成名词短语 `some music CDs`（一些音乐CD）。\n4.  将 `in`, `the`, `shop` 组合成介词短语 `in the shop`（在商店里），表示地点。\n5.  按照 `There be + 名词短语 + 地点状语` 的基本结构，将各部分组合起来，构成完整句子。","knowledge_expansion_md":"**`There be` 句型详解**\n\n`There be` 句型是英语中非常重要的一个句型，用于表示“某地/某时存在某人/某物”，其核心是“存在”。\n\n1.  **基本结构**: `There + be + (逻辑)主语 + 地点/时间状语`。\n    *   `There` 是引导词，没有实际意义，但占据主语的位置。\n    *   `be` 动词是谓语，其单复数形式（`is`, `are`）取决于后面紧跟的名词。\n    *   名词或名词短语是句子的“逻辑主语”。\n2.  **`be` 动词的选择**:\n    *   若逻辑主语是**单数名词**或**不可数名词**，用 `There is`。例如: `There is a book on the desk.` / `There is some water in the bottle.`\n    *   若逻辑主语是**复数名词**，用 `There are`。例如: `There are many students in the classroom.`\n    *   **就近原则**: 当有多个并列的逻辑主语时，`be` 动词的形式通常与离它最近的一个主语保持一致。例如: `There is a pen and two pencils in the box.`\n3.  **各种句式变换**:\n    *   **否定句**: 在 `be` 动词后加 `not`。例如: `There is not (isn't) a book on the desk.`\n    *   **一般疑问句**: 将 `be` 动词提到句首。例如: `Are there any CDs in the shop?` (注意 `some` 在否定句和疑问句中通常变为 `any`)\n    *   **特殊疑问句**: `特殊疑问词 + be + there + ...?` 例如: `How many CDs are there in the shop?`","socratic_tracks":[{"title":"There be 句型识别","steps":[{"question":"看到单词 “there” 和 “are”，你首先会想到英语中哪个表示“有”的常用句型？","hint":"这个句型不是表示“拥有”，而是表示“存在”。","takeaway":"看到 “there” 和 “be” 动词，要优先考虑 “There be” 句型。"},{"question":"“There be” 句型的基本语序是怎样的？表示“什么东西”和“在什么地方”的成分应该怎么放？","hint":"中文说“在商店里有一些音乐CD”，英文的语序和中文有什么不同？","takeaway":"“There be” 句型的标准语序是：There be + 物品/人 (逻辑主语) + 地点/时间状语。"}]},{"title":"名词词组构成","steps":[{"question":"题目中有 “some”, “music”, “CDs” 这几个词，它们应该如何组合成一个有意义的词组？哪个是核心名词？","hint":"“CDs” 是核心名词，其他词都是用来修饰它的。","takeaway":"多个词修饰名词时，通常遵循“限定词 (some) + 描述性词 (music) + 核心名词 (CDs)”的顺序。"},{"question":"为什么是 “some music CDs” 而不是 “music some CDs”？","hint":"“some” 这种表示数量的词，在名词词组中通常放在什么位置？","takeaway":"限定词（如 a/an, the, some, my）必须放在名词词组的最前面。"}]},{"title":"主谓一致","steps":[{"question":"为什么这个句子用 “are” 而不是 “is”？判断的依据是什么？","hint":"在 “There be” 句型中，be 动词的形式由它后面的名词决定。","takeaway":"在 “There be” 句型中，be 动词的单复数形式由其后的逻辑主语决定，这里 “CDs” 是复数，所以用 “are”。"},{"question":"如果我们要说“商店里有一张音乐CD”，这个句子应该怎么说？","hint":"把复数的 “CDs” 变成单数 “a music CD”，那么 “are” 应该变成什么？","takeaway":"当逻辑主语变为单数时，be 动词也要相应地变为 “is”，即 “There is a music CD in the shop.”。"}]}]}},{"number":"4","item_type":"sentence_transform","context_note":"","stem":"They have lunch at home. (对画线部分提问)\n_____ they have lunch?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Where do","explanation_md":"本题考查对划线部分提问，属于特殊疑问句的转换。\n1.  分析划线部分：`at home` 是一个介词短语，表示地点“在家”。\n2.  确定疑问词：针对地点进行提问，应使用特殊疑问词 `Where` (在哪里)。\n3.  分析原句时态和结构：原句 `They have lunch` 是主语为 `They` 的一般现在时陈述句，谓语动词是实义动词 `have`。\n4.  构成疑问句：一般现在时的句子（除主语为第三人称单数外），在变为疑问句时需要借助助动词 `do`，并将其置于主语之前。\n5.  组合句子：按照“特殊疑问词 + 助动词 + 主语 + 谓语动词原形 + ...?”的结构，得到 `Where do they have lunch?`。\n6.  题干若为一处横线，应整体填写 **Where do**（与完整问句 Where do they have lunch? 开头的两词一致）。","knowledge_expansion_md":"**特殊疑问句的构成规则**\n\n特殊疑问句是对句子中某一特定成分（如时间、地点、人物、原因等）进行提问，需要用具体的疑问词开头，不能用 `Yes` 或 `No` 回答。\n\n1.  **基本结构**: `特殊疑问词 + 一般疑问句语序`\n\n2.  **常用特殊疑问词**:\n    *   `Who`: 对主语、宾语或表语（人）提问。\n    *   `What`: 对主语、宾语或表语（物）提问。\n    *   `Where`: 对地点状语提问。\n    *   `When`: 对时间状语提问。\n    *   `Why`: 对原因状语提问。\n    *   `How`: 对方式、程度、健康状况等提问。\n    *   `Which`: 对特定范围内的选择提问。\n\n3.  **构成步骤**:\n    *   **第一步**: 判断划线部分是什么成分，选择合适的疑问词。\n    *   **第二步**: 将原句去掉划线部分后，改写为一般疑问句。\n        *   若句中有 `be` 动词或情态动词，将其提前。\n        *   若句中只有实义动词，需借助助动词 `do/does/did`，并置于主语前，同时实义动词变为原形。\n    *   **第三步**: 将疑问词放在一般疑问句的句首。\n\n**特别注意**: 如果是对**主语**提问，语序通常不变，只需用 `Who` 或 `What` 替换主语即可，其后的谓语动词通常视为第三人称单数处理。例如：`Tom broke the window.` -> `Who broke the window?`","socratic_tracks":[{"title":"选择正确的疑问词","steps":[{"question":"划线部分 “at home” 在句子中告诉我们什么信息？是时间、地点、还是方式？","hint":"“at home” 的意思是“在家里”，这是一个具体的地方。","takeaway":"划线部分 “at home” 是地点状语。"},{"question":"对于表示地点的信息进行提问，我们应该使用哪个以 'W' 开头的疑问词？","hint":"询问“在哪里？”的英文单词是什么？","takeaway":"询问地点需要使用特殊疑问词 “Where”。"}]},{"title":"构建疑问句语序","steps":[{"question":"原句 “They have lunch” 是一个陈述句。如果想把它变成一个“是/否”问题（一般疑问句），应该怎么做？","hint":"这个句子有 be 动词（am/is/are）或情态动词（can/will）吗？如果没有，我们需要添加什么来帮助提问？","takeaway":"对于只含实义动词的一般现在时陈述句，变一般疑问句需在句首加助动词 “do” 或 “does”。"},{"question":"主语是 “They”，我们应该用 “do” 还是 “does”？","hint":"“does” 只用于主语是第三人称单数（he/she/it/Tom）的情况。","takeaway":"当主语不是第三人称单数时，应使用助动词 “do”。"},{"question":"现在我们有了疑问词 “Where” 和一般疑问句的结构 “Do they have lunch?”，如何把它们组合成一个完整的特殊疑问句？","hint":"疑问词通常放在句子的最前面。","takeaway":"特殊疑问句的正确语序是“特殊疑问词 + 一般疑问句”，即 “Where do they have lunch?”。"}]},{"title":"助动词与动词原形","steps":[{"question":"在问句 “Where do they have lunch?” 中，为什么动词用 “have” 而不是 “has”？","hint":"助动词 “do” 后面跟的动词应该是什么形式？","takeaway":"使用了助动词 do/does/did 后，其后的谓语动词必须使用原形。"},{"question":"如果原句是 “He has lunch at home.”，对划线部分提问，句子会变成什么样？","hint":"主语变成了 “He”（第三人称单数），助动词应该用哪个？“has” 又该如何变化？","takeaway":"当主语是第三人称单数时，助动词用 “does”，原动词 “has” 也要变回原形 “have”，所以句子是 “Where does he have lunch?”。"}]}]}},{"number":"5","item_type":"sentence_transform","context_note":"","stem":"We are having a nice day. (改为感叹句)\n_____ nice day we are having!","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"What a","explanation_md":"本题考查将陈述句改为感叹句。\n1.  感叹句主要有两种引导词：`What` 和 `How`。\n2.  判断使用 `What` 还是 `How` 的关键是看感叹的对象。原句 `We are having a nice day.` 中，感叹的核心是名词短语 `a nice day`。\n3.  当感叹的中心是**名词**时，用 `What` 引导。\n4.  `What` 引导的感叹句结构为：`What (+ a/an/adj.) + 名词 (+ 主语 + 谓语)!`\n5.  由于 `day` 是可数名词单数，且前面有形容词 `nice` 修饰，因此 `What` 后面必须加上不定冠词 `a`。\n6.  所以，完整的感叹句是 `What a nice day we are having!`；题干若为一处横线，应整体填写 **What a**。","knowledge_expansion_md":"**`What` 和 `How` 引导的感叹句辨析**\n\n`What` 和 `How` 都可以引导感叹句，但用法不同，关键在于它们修饰的词性不同。\n\n1.  **`What` 修饰名词**\n    `What` 用于感叹名词，其后紧跟一个名词或名词短语。可以记作“**What 名**”。\n    *   **结构 1**: `What + a/an + 形容词 + 可数名词单数 (+ 主语 + 谓语)!`\n        > e.g., `What a lovely dog (it is)!`\n    *   **结构 2**: `What + 形容词 + 可数名词复数 (+ 主语 + 谓语)!`\n        > e.g., `What interesting books (they are)!`\n    *   **结构 3**: `What + 形容词 + 不可数名词 (+ 主语 + 谓语)!`\n        > e.g., `What beautiful weather (it is)!`\n\n2.  **`How` 修饰形容词或副词**\n    `How` 用于感叹形容词或副词所表达的程度。可以记作“**How 形/副**”。\n    *   **结构 1**: `How + 形容词 (+ 主语 + 谓语)!`\n        > e.g., `How lovely the dog is!`\n    *   **结构 2**: `How + 副词 + 主语 + 谓语!`\n        > e.g., `How fast he runs!`\n\n**快速判断方法**：找到句中被感叹的中心词。如果是名词，就用 `What`；如果是形容词或副词，就用 `How`。例如，对于 `The day is nice.`，感叹 `nice` 就用 `How nice the day is!`；感叹 `a nice day` 就用 `What a nice day it is!`。","socratic_tracks":[{"title":"选择 What 还是 How","steps":[{"question":"英语中，表达感叹的句子通常由哪两个词开头？","hint":"一个以 W 开头，一个以 H 开头。","takeaway":"引导感叹句的词主要是 “What” 和 “How”。"},{"question":"我们如何决定用 “What” 还是 “How”？看看原句 “We are having a nice day”，我们感叹的重点是一个形容词（nice），还是一个名词词组（a nice day）？","hint":"如果感叹的是一个“东西”或“事情”（名词），通常用 “What”。如果感叹的是“怎么样”（形容词/副词），通常用 “How”。","takeaway":"当感叹的中心是名词（如本题的 day）时，我们用 “What” 来引导感叹句。"}]},{"title":"感叹句的结构","steps":[{"question":"确定用 “What” 之后，我们来看它后面的结构。被感叹的名词 “day” 是一个可数名词还是不可数名词？是单数还是复数？","hint":"我们可以说 “one day, two days”，所以它是...","takeaway":"“day” 是一个可数名词单数。"},{"question":"当用 “What” 感叹一个可数名词单数时，并且这个名词前有形容词修饰，我们还需要在形容词前加一个什么词？","hint":"参考原句中的 “a nice day”，这个 “a” 在感叹句中需要保留吗？","takeaway":"当用 “What” 感叹一个可数名词单数时，需要在形容词前加上不定冠词 “a” 或 “an”。"},{"question":"所以，感叹句的开头部分应该是什么？","hint":"把 “What” 和 “a” 组合起来。","takeaway":"根据句型 “What + a/an + 形容词 + 名词”，感叹句的开头是 “What a”。"}]},{"title":"句子成分的保留与省略","steps":[{"question":"感叹句的后半部分 “we are having” 是从原句中来的，它在感叹句中是必须的吗？","hint":"如果我只说 “What a nice day!”，你能听懂我的意思吗？","takeaway":"在口语或非正式语境中，感叹句的主谓部分（如 “we are having”）常常可以省略，使句子更简洁。"},{"question":"比较 “What a nice day!” 和 “What a nice day we are having!”，后者多出来的部分有什么作用？","hint":"“we are having” 明确了是谁在经历这个好日子。","takeaway":"加上主谓部分使句子结构更完整，并明确了感叹的主体，但省略主谓的感叹句更简洁有力。"}]}]}}]},{"section_title":"V. 根据汉语意思完成句子 (共 10 分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"她的外套和她的帽子不相配。\nHer hat doesn't _____ her coat.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"match","explanation_md":"本题考查根据中文意思填入恰当的动词。\n1.  分析中文句意：“她的外套和她的帽子不相配。” 这里的“相配”指的是颜色、款式或风格上的搭配。\n2.  寻找对应英文词汇：在英语中，动词 `match` 专门用来表示“（颜色、款式等）相配，相称”。\n3.  分析句子结构：`Her hat doesn't _____ her coat.` 这是一个一般现在时的否定句。\n4.  确定动词形式：句中已经有助动词 `doesn't` (does not)，助动词后面必须跟动词原形。\n5.  因此，空格处应填入 `match` 的原形。","knowledge_expansion_md":"**词义辨析：`match`, `fit`, `suit`**\n\n这三个动词都与“合适”有关，但在用法上有明确区别，是易混淆点。\n\n*   **`match` (v.)**: 指颜色、图案、款式、风格等方面的**搭配、协调**。\n    > e.g., Your tie `matches` your shirt perfectly. (你的领带和你的衬衫很配。)\n    > 本题中，帽子和外套就是款式、颜色上的搭配问题，所以用 `match`。\n\n*   **`fit` (v.)**: 指尺寸、大小、形状的**合身、合适**。\n    > e.g., These shoes don't `fit` me. They are too small. (这双鞋不合我的脚。太小了。)\n\n*   **`suit` (v.)**: 指**适合**某人的风格、气质、身份、需要或场合，使其看起来更好看或更得体。常有“使某人增色”的意味。\n    > e.g., The color red doesn't `suit` her. (红色不适合她穿。)\n    > e.g., This job `suits` him well. (这份工作很适合他。)\n\n**记忆口诀**：`match` 配颜色，`fit` 合尺寸，`suit` 衬气质。","socratic_tracks":[{"title":"理解核心词义","steps":[{"question":"中文“不相配”可以有很多种情况，比如大小不合适，或者颜色不搭。你认为“外套和帽子不相配”更偏向于哪一种？","hint":"我们通常会说一件衣服的颜色和另一件搭不搭，或者风格配不配。","takeaway":"“外套和帽子不相配”通常指的是颜色或款式上的不搭配。"},{"question":"英语中，哪个动词专门用来表示颜色、款式上的“搭配”或“相称”？","hint":"这个词以 'm' 开头，它作名词时还有“比赛”或“火柴”的意思。","takeaway":"表达颜色、款式相配最常用的动词是 “match”。"}]},{"title":"关注语法细节","steps":[{"question":"看到句子中的 “doesn't”，你知道它是什么吗？它对后面的动词有什么要求？","hint":"“doesn't” 是 “does not” 的缩写，“does” 是一个助动词。","takeaway":"“doesn't” 是助动词的否定形式，它后面必须跟动词原形。"},{"question":"句子的主语是 “Her hat”，是第三人称单数。那么，我们填入的动词 “match” 需要在词尾加 “-es” 吗？为什么？","hint":"助动词 “does” 已经承担了人称和时态的变化。","takeaway":"因为助动词 “does” 已经体现了第三人称单数，所以后面的实义动词 “match” 必须使用原形，不能加 “-es”。"}]},{"title":"词汇辨析与拓展","steps":[{"question":"如果我想说“这件衬衫大小不合身”，我应该用 “match” 还是另一个词？","hint":"哪个词是专门指尺寸、大小的合适？","takeaway":"表示尺寸大小的“合身”应该用 “fit”。"},{"question":"如果我想说“蓝色很衬你”，表示这个颜色让你看起来很好看，我应该用哪个词？","hint":"这个词是 s-u-i-t。","takeaway":"表示适合某人气质、风格，使其增色的“适合”应该用 “suit”。"},{"question":"除了 “match”，还有一个动词短语也可以表示“和……搭配”，你知道是什么吗？","hint":"由 “go” 和一个介词组成。","takeaway":"动词短语 “go with” 也可以表示“与……相配”，意思与 “match” 相近。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"篮子里还有一些西红柿。\nThere are some tomatoes _____ in the basket.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"left","explanation_md":"本题考查 `There be` 句型和过去分词作后置定语的用法。中文“还有”在此处意为“剩下、剩余”。英文中常用动词 `leave` 的过去分词 `left` 来表达此意。`left` 在这里作形容词，修饰名词 `tomatoes`，且需要后置，构成 `tomatoes left`，意为“剩下的西红柿”。整个句子 `There are some tomatoes left in the basket.` 意为“篮子里还有一些剩下的西红柿。”","knowledge_expansion_md":"### 1. There be 句型\n`There be` 句型是英语中最常用的句型之一，表示“某地（或某时）有某物”，其结构为 `There is/are + 名词 + 地点/时间状语`。`be` 动词的单复数形式由其后的名词决定。\n- `There is a book on the desk.` (名词为单数，用 is)\n- `There are some apples in the fridge.` (名词为复数，用 are)\n\n### 2. 过去分词作后置定语\n过去分词 (past participle) 单独或与副词等构成短语，放在名词后面作定语时，通常表示被动或完成的意义。这相当于一个省略了 `which is/are` 的定语从句。\n- `the tomatoes left in the basket` = `the tomatoes which are left in the basket`\n- `a letter written in English` (一封用英语写的信)\n- `the food cooked by my mother` (我妈妈做的食物)","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"题目中的中文“还有”是什么意思？是“也”的意思，还是“剩下”的意思？","hint":"想象一下，篮子里原来有很多西红柿，拿走了一些，现在“还有”一些。这是描述一种什么样的状态？","takeaway":"这里的“还有”指的是“剩余、剩下”的状态。"},{"question":"在英语中，哪个词可以表示“剩下”的，并且可以放在名词后面修饰它？","hint":"想一想动词 `leave` (v. 留下，剩下) 的哪种形式可以作形容词，表示“被剩下的”？","takeaway":"动词 `leave` 的过去分词 `left` 可以作形容词，表示“被剩下的”。"}]},{"title":"句子结构","steps":[{"question":"这个英语句子的主干结构是什么？","hint":"这是一个以 `There` 开头的句子，通常被称为什么句型？","takeaway":"这是 `There be` 句型，用来表示“某地有某物”。"},{"question":"我们要填的这个词是用来修饰 `tomatoes` 的。这个修饰词为什么放在 `tomatoes` 的后面，而不是像 `some good tomatoes` 那样放在前面？","hint":"单个形容词通常前置，但 `left` 是一个由动词变来的词，它单独修饰名词时，习惯上后置。","takeaway":"`left` 作为后置定语，修饰前面的名词 `tomatoes`，这是过去分词作定语的常见用法。"}]},{"title":"词性分析","steps":[{"question":"我们要在 `tomatoes` 后面填一个词，这个词在句子中起什么作用？","hint":"它是不是用来描述 `tomatoes` 的状态或属性的？","takeaway":"我们需要一个起形容词作用的词，来作定语修饰 `tomatoes`。"},{"question":"动词 `leave` 的意思是“离开”或“留下”。我们如何把它变成一个形容词，来表达“被留下的”这种被动状态？","hint":"动词有三种主要形式：原形、过去式和过去分词。哪一种形式常用来表示被动或完成的意义，并可以作形容词？","takeaway":"动词的过去分词可以作形容词，表示被动意义，因此我们用 `leave` 的过去分词 `left`。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"每年孩子们都为万圣节做他们自己的南瓜灯。\nEvery year children make their own _____ for Halloween.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"pumpkin lanterns","explanation_md":"本题考查名词词组的翻译。根据中文意思“南瓜灯”，我们可以将其拆分为“南瓜”和“灯”。“南瓜”的英文是 `pumpkin`，“灯”或“灯笼”的英文是 `lantern`。因此，“南瓜灯”可以直译为 `pumpkin lantern`。句子的主语是 `children`（孩子们），是复数，他们制作“自己的”灯，从逻辑上讲，应该是制作了不止一个南瓜灯，所以 `lantern` 需要使用复数形式 `lanterns`。因此，正确答案是 `pumpkin lanterns`。","knowledge_expansion_md":"### 1. 复合名词的复数形式\n当一个复合名词由两个名词组成时（如 `pumpkin lantern`），通常只将最后一个名词变为复数。例如：\n- `apple tree` -> `apple trees`\n- `school bus` -> `school buses`\n- `bedroom` -> `bedrooms`\n\n### 2. 万圣节 (Halloween) 相关词汇\n- `jack-o'-lantern`: 南瓜灯的更地道说法，源于爱尔兰传说。\n- `trick or treat`: 不给糖就捣蛋（万圣节儿童挨家挨户索要糖果的习俗）。\n- `costume`: （化装）服饰。\n- `witch`: 女巫。\n- `ghost`: 鬼魂。\n- `skeleton`: 骷髅。\n- `vampire`: 吸血鬼。\n\n### 3. `make` 的用法\n`make` 在这里是“制作”的意思，是一个非常基础和常用的动词。`make sth.` 意为“制作某物”。例如：`make a cake` (做蛋糕), `make a kite` (做风筝)。","socratic_tracks":[{"title":"核心词汇翻译","steps":[{"question":"题目中需要我们翻译的核心中文词组是什么？","hint":"看一下中文句子，孩子们为万圣节制作了什么？","takeaway":"需要翻译的核心词组是“南瓜灯”。"},{"question":"“南瓜”和“灯”分别用英语怎么说？","hint":"一种橙色的圆形蔬菜，和一种用来照明的、有外罩的灯。","takeaway":"“南瓜”是 `pumpkin`，“灯”或“灯笼”是 `lantern`。"},{"question":"那么“南瓜灯”这个复合词应该如何组合？","hint":"参考“苹果树”是 `apple tree` 的构词方式。","takeaway":"将两个词组合，`pumpkin` 在前修饰 `lantern`，构成 `pumpkin lantern`。"}]},{"title":"名词单复数判断","steps":[{"question":"句子的主语 `children` 是单数还是复数？","hint":"它的单数形式是 `child`。","takeaway":"`children` 是复数，表示“孩子们”。"},{"question":"既然是复数的“孩子们”在制作他们“自己的”南瓜灯，从逻辑上推断，他们制作的南瓜灯是一个还是多个？","hint":"这是一个描述普遍习俗的句子，通常指大家都会做，总数是多个。","takeaway":"逻辑上应该是制作了多个南瓜灯，所以名词需要用复数形式。"},{"question":"复合名词 `pumpkin lantern` 的复数形式是什么？","hint":"通常我们只把复合名词的最后一个单词变成复数。","takeaway":"`pumpkin lantern` 的复数形式是 `pumpkin lanterns`。"}]},{"title":"文化背景知识","steps":[{"question":"这个句子提到了哪个西方节日？制作南瓜灯是这个节日的什么活动？","hint":"句末提到了 `for Halloween`。","takeaway":"句子提到了万圣节(Halloween)，制作南瓜灯是万圣节的传统习俗。"},{"question":"除了 `pumpkin lantern`，你知道南瓜灯在英语里有没有一个更地道、更专门的说法吗？","hint":"这个说法和爱尔兰的一个传说有关，以一个常见的男孩名字 `Jack` 开头。","takeaway":"南瓜灯更地道的说法是 `jack-o'-lantern`。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"他经常去吃肯德基, 他非常喜欢汉堡包。\nHe _____ hamburgers _____ _____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"likes|very|much","explanation_md":"本题考查对“非常喜欢”的表达。中文“他非常喜欢汉堡包”需要翻译并填入 `he _____ hamburgers _____ _____` 的结构中。首先，“喜欢”的动词是 `like`。因为主语是 `he`（第三人称单数），且描述的是一个经常性的喜好（一般现在时），所以动词要用第三人称单数形式 `likes`。其次，“非常”用来修饰动词 `like` 时，常用副词短语 `very much`，并置于句末。因此，三个空依次填入 `likes`, `very`, `much`，构成 `He likes hamburgers very much.`。","knowledge_expansion_md":"### 1. 表达“喜欢”的多种方式\n英语中有很多表达“喜欢”和“爱好”的词组，可以根据喜爱程度和语境选用：\n- `like sth./doing sth.`: 普通的喜欢。 *I like reading.* \n- `love sth./doing sth.`: 热爱，程度比 `like` 深。 *She loves dancing.*\n- `enjoy sth./doing sth.`: 享受做某事带来的乐趣。 *We enjoy the party.*\n- `be fond of sth./doing sth.`: 喜爱，对...有兴趣（多指长期的兴趣爱好）。 *My grandpa is fond of fishing.*\n- `be keen on sth./doing sth.`: 热衷于...。 *He is keen on collecting stamps.*\n- `be crazy about sth.`: 对...着迷/疯狂。 *The kids are crazy about video games.*\n\n### 2. `very` vs. `very much`\n- `very` 是副词，通常用来修饰**形容词**或**副词**，表示“很，非常”。例如：`very good` (非常好), `run very fast` (跑得非常快)。\n- `very much` 是一个副词短语，通常用来修饰**动词**，表示“非常”，常放在句末。例如：`Thank you very much.` (非常感谢你), `I miss you very much.` (我非常想你)。","socratic_tracks":[{"title":"动词形式选择","steps":[{"question":"句子后半部分要表达“他喜欢汉堡包”，核心动词是哪个词？","hint":"“喜欢”最常用的英文单词是什么？","takeaway":"核心动词是 `like`。"},{"question":"句子的主语是 `He`，这是第几人称单数？","hint":"`I` 是第一人称，`you` 是第二人称。","takeaway":"`He` 是第三人称单数。"},{"question":"当主语是第三人称单数，并且我们在描述一个事实或习惯（一般现在时）时，动词 `like` 需要做什么变化？","hint":"动词词尾需要加上 `-s` 或 `-es`。","takeaway":"动词需要使用第三人称单数形式，即 `likes`。"}]},{"title":"副词用法辨析","steps":[{"question":"中文里的“非常”在句中是修饰哪个词？是“汉堡包”还是“喜欢”？","hint":"“非常”是用来描述喜欢这个动作的程度。","takeaway":"“非常”是用来修饰动词“喜欢”的。"},{"question":"当我们要用“非常”来修饰动词 `like` 时，应该用 `very` 还是 `very much`？","hint":"想一想“非常感谢你”是 `Thank you very.` 还是 `Thank you very much.`？","takeaway":"修饰动词时，我们通常用 `very much` 这个短语。"},{"question":"`very much` 这个短语一般放在句子的什么位置？","hint":"参考 `I like English very much.` 这个例子。","takeaway":"`very much` 作为状语，通常放在句子的末尾。"}]},{"title":"句型结构分析","steps":[{"question":"英语句子的基本语序是什么？","hint":"一个完整的句子通常包含主语、谓语、宾语等部分。","takeaway":"英语句子的基本语序是“主语 + 谓语 + 宾语”。"},{"question":"根据“主-谓-宾”的语序，`he`, `likes`, `hamburgers` 应该如何排列？","hint":"谁 (主语) -> 做了什么 (谓语) -> 动作的对象 (宾语)。","takeaway":"语序是 `He likes hamburgers`。"},{"question":"现在，我们把表示程度的状语 `very much` 加进去，应该放在哪里？","hint":"这个状语是修饰整个动作的，通常放在句末。","takeaway":"完整的句子是 `He likes hamburgers very much`，`very much` 放在宾语之后。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"我们一周打三次篮球。\nWe _____ basketball _____ a week.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"play|three times","explanation_md":"本题考查频率的表达方式和球类运动的固定搭配。中文“打篮球”在英文中是固定短语 `play basketball`，因此第一个空填动词 `play`。中文“一周三次”是对动作频率的描述，其中“三次”是 `three times`，“一周”是 `a week`，组合起来就是 `three times a week`。题目中 `a week` 已经给出，所以第二个空填 `three times`。整个句子连起来就是 `We play basketball three times a week.`。","knowledge_expansion_md":"### 1. 频率的表达方式\n英语中表达频率有多种方式：\n- **具体次数**: `once` (一次), `twice` (两次), `three times` (三次), `four times` (四次)... \n  常与 `a day/week/month/year` 等连用，构成频率状语，如 `once a week` (一周一次)。\n- **频率副词**: `always` (总是), `usually` (通常), `often` (经常), `sometimes` (有时), `seldom`/`rarely` (很少), `never` (从不)。这些副词通常放在实义动词前，be动词、情态动词或助动词之后。\n- **提问频率**: 使用 `How often...?` 来提问。例如：`How often do you go swimming?` (你多久去游一次泳？)\n\n### 2. 球类运动的表达\n在英语中，表达进行某种球类、棋类或牌类运动时，动词 `play` 后面直接跟该运动的名称，名词前**不加**定冠词 `the`。\n- `play basketball` (打篮球)\n- `play football` (踢足球)\n- `play chess` (下国际象棋)\n\n与之对比，在表达演奏某种乐器时，动词 `play` 后面通常需要**加上**定冠词 `the`。\n- `play the piano` (弹钢琴)\n- `play the guitar` (弹吉他)","socratic_tracks":[{"title":"动词短语搭配","steps":[{"question":"中文的“打篮球”这个动作，在英语里通常用哪个动词短语来表达？","hint":"“玩”或“进行”一项运动，最常用的动词是 `play`。","takeaway":"“打篮球”的固定搭配是 `play basketball`。"},{"question":"在 `play basketball` 这个短语中，为什么 `basketball` 前面没有 `the`？","hint":"对比一下 `play the piano` (弹钢琴) 和 `play football` (踢足球) 的用法。","takeaway":"在表示球类和棋类运动时，`play` 后面直接加运动名称，不加定冠词 `the`。"}]},{"title":"频率表达法","steps":[{"question":"“一次”、“两次”、“三次”用英语分别怎么说？","hint":"前两个有特殊的单词，从第三个开始就有规律了。","takeaway":"分别是 `once`, `twice`, `three times`。"},{"question":"那么，如何表达“一周三次”这个频率呢？","hint":"把“三次”(`three times`) 和“一周”(`a week`) 组合起来。","takeaway":"“一周三次”的英文表达是 `three times a week`。"},{"question":"如果想问别人“你多久打一次篮球？”，应该用哪个疑问词开头来提问？","hint":"我们用 `How...?` 来提问频率。","takeaway":"询问频率时，我们用 `How often...?` 来提问。"}]},{"title":"句子成分分析","steps":[{"question":"在 `We play basketball three times a week.` 这个句子中，`We` 是什么成分？`play basketball` 呢？","hint":"谁做了什么事？","takeaway":"`We` 是主语，`play` 是谓语动词，`basketball` 是宾语。"},{"question":"`three times a week` 在这个句子中是做什么用的？它是什么成分？","hint":"它回答了“多久做一次”的问题，是用来描述动作的。","takeaway":"`three times a week` 是时间状语，用来描述动作发生的频率。"},{"question":"这种表示具体频率的时间状语，通常放在句子的什么位置？","hint":"它可以在句首，也可以在句末，但放在句末更常见。","takeaway":"表示具体次数的频率状语（如 `once a week`, `three times a month`）通常放在句末。"}]}]}}]},{"section_title":"VI. 阅读理解。 (共 20 分)","section_instruction":"A\nDo you know anything about the way of shopping in Western countries? People there usually make shopping lists first and then they go shopping. Most people like to go to supermarkets because they can get almost(几乎) everything in one supermarket. For example, they can buy many styles of clothes, food and sports things. And the things in supermarkets are cheaper. When they get into the supermarket, they carry a basket. Then they buy things and put them in the basket. After getting everything they want, they pay the money. Most people go to the supermarket once a week.","items":[{"number":"1","item_type":"reading","context_note":"Passage A","stem":"People like to go to supermarkets for _____ reasons.","options":{"A":"three","B":"two","C":"one","D":"many"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查对文章开头关键句的理解。题干问人们喜欢去超市的“原因”在文中有几条。\n\n原文中有明确表述：“Most people like to go to supermarkets because they can get almost (几乎) everything in one supermarket.”其中 `because` 直接引出人们喜欢去超市的原因：在一家超市里几乎可以买到所有东西。从题干与选项设置来看，这是在概括“原因”的条数——此处由 `because` 给出的是**一条**直接原因，因此选项 **C（one）** 最符合文意。\n\n选项 A（three）、B（two）表示具体数字，文中并未按“第一、第二、第三”或“两个原因”来列举对应数量，不能凭主观猜测去选。选项 D（many）表示“许多（条）原因”，容易让人误以为后文还会并列多条原因，但本句结构是“喜欢去超市 + because + 一条具体说明”，与“many reasons”的概括并不一致，故不选 D。","knowledge_expansion_md":"### 阅读中 “原因” 题的小技巧\n\n1. **先找因果词**：`because`, `so`, `since`, `as`, `thanks to` 等后面往往跟着原因或结果。\n2. **分清“一条”还是“多条”**：若只有一个 `because` 从句集中说明主句的原因，且没有再用 `First… Second…` 或并列多个 `because` 分述，通常不要把原因数随意扩大为 “many” 或具体 2、3，除非原文明确写出。\n3. **选项与原文要能对读**：含具体数字的选项，必须在文中有对应依据才可入选。","socratic_tracks":[{"title":"定位因果句","steps":[{"question":"文章里哪一句说明“人们为什么喜欢去超市”？句子里有没有表示“原因”的连接词？","hint":"注意 `because` 前面的主句与后面的从句各说了什么。","takeaway":"定位到 “… like to go to supermarkets because …” 这一句，原因由 `because` 从句直接给出。"},{"question":"这个 `because` 从句是在列举多个互不相关的原因，还是在说明一个核心原因？","hint":"从句里说的是“在一家超市几乎能买到所有东西”，这是一条完整的说明。","takeaway":"此处更像“一条主要原因”的展开，而不是并列多条独立原因。"}]},{"title":"对照选项","steps":[{"question":"四个选项里，哪一个表示“一个（原因）”，且与上文分析一致？","hint":"A、B 是具体数字；C 是 one；D 是 many。","takeaway":"选 C（one）与原文因果结构最吻合。"}]}]}},{"number":"2","item_type":"reading","context_note":"Passage A","stem":"Things in supermarkets are _____.","options":{"A":"cheaper","B":"more expensive","C":"better","D":"more"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对文章细节信息的定位。题目询问超市里东西的特点。根据文章中的句子“And the things in supermarkets are cheaper.”（并且超市里的东西更便宜），可以明确得知超市的商品价格更便宜。因此，正确答案是A。","knowledge_expansion_md":"本题涉及形容词比较级的用法，这是小升初英语的重点语法。\n\n1.  **规则变化**：\n    *   单音节词和少数双音节词：词尾加 `-er` (e.g., cheap -> cheaper, big -> bigger)。\n    *   以 `-y` 结尾的双音节词：变 `y` 为 `i` 再加 `-er` (e.g., easy -> easier)。\n    *   多音节词和部分双音节词：词前加 `more` (e.g., expensive -> more expensive)。\n2.  **不规则变化**：\n    *   good -> better\n    *   bad -> worse\n    *   many/much -> more\n    *   little -> less\n\n在阅读中，比较级常用于对比事物，是重要的考点。看到比较级，就要思考作者在比较什么，比较的结果是什么。","socratic_tracks":[{"title":"关键信息提取","steps":[{"question":"题目问的是超市里“东西(things)”的特点。关于这些东西，文章最可能提到的是哪个方面？是价格、质量还是数量？","hint":"回想一下上一题，人们去超市的原因之一可能是什么？价格是一个很重要的因素。","takeaway":"抓住问题中的关键词，回原文定位或推测相关信息是解题的关键。"},{"question":"根据常识，超市吸引人的一个重要原因是价格。那么，它的价格通常是“更便宜”还是“更贵”？","hint":"对比一下超市和街边小店的价格。","takeaway":"利用生活常识进行辅助判断，可以快速筛选选项。"}]},{"title":"形容词比较级","steps":[{"question":"选项 A 'cheaper' 是哪个单词的比较级形式？它是什么意思？","hint":"它的原形是 cheap (便宜的)。","takeaway":"'cheaper' 意思是“更便宜的”。"},{"question":"选项 B 'more expensive' 是什么意思？它和 'cheaper' 是什么关系？","hint":"expensive 意为“昂贵的”。","takeaway":"'more expensive' (更贵的) 与 'cheaper' (更便宜的) 意思相反。"},{"question":"选项 C 'better' 是哪个词的不规则比较级？","hint":"它的原形是 'good'。","takeaway":"掌握常见的不规则形容词比较级（如 good-better, bad-worse）非常重要。"}]},{"title":"排除法应用","steps":[{"question":"为什么选项 B 'more expensive' (更贵) 通常不是人们去超市的原因？","hint":"人们购物时通常希望省钱，而不是花更多的钱。","takeaway":"不符合生活常理的选项通常是错误的。"},{"question":"为什么选项 C 'better' (更好) 和 D 'more' (更多) 不如 A 'cheaper' 准确？","hint":"文章可能没有说所有东西质量都更好，而 'more' 后面没有跟形容词，意思不完整，也不能概括所有商品。","takeaway":"在阅读理解中，要选择最具体、最符合原文描述的选项。"}]}]}},{"number":"3","item_type":"reading","context_note":"Passage A","stem":"People can buy _____ from supermarkets.","options":{"A":"food","B":"milk","C":"clothes","D":"A, B and C"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查对文章细节的整合与推理。根据文章句子“For example, they can buy many styles of clothes, food and sports things.”可知，人们可以在超市买到衣服（clothes）和食物（food），因此选项A和C正确。牛奶（milk）是食物的一种，也属于可购买的范畴。因此，选项A、B、C的描述都正确，应选择概括最全面的D选项。","knowledge_expansion_md":"在做阅读选择题时，会遇到一种特殊的选项，即“以上都对”或“以上都错”（如 'A and B', 'A, B and C'）。处理这类问题时，需要遵循以下步骤：\n\n1.  **逐一验证**：将每个子选项（A, B, C等）带回原文，一一核对它们是否正确。\n2.  **不可遗漏**：必须确保所有子选项都在原文中能找到依据。只要有一个子选项是错误的，那么这个汇总选项就是错误的。\n3.  **选择最全面的答案**：如果多个独立选项（如A, B, C）都是正确的，那么应该选择那个能概括所有正确信息的汇总选项（如D）。\n\n这种题型考验的是学生的细心和全面性。","socratic_tracks":[{"title":"信息整合","steps":[{"question":"题目问在超市能买到什么。请看选项A 'food'，你觉得文章会提到吗？","hint":"超市最基本的功能就是卖食物。","takeaway":"文章很可能提到了超市卖食物。"},{"question":"再看选项B 'milk' 和 C 'clothes'。大型超市里通常有这些东西吗？","hint":"牛奶是常见的食品，很多大超市也有服装区。","takeaway":"文章为了说明商品种类丰富，很可能列举了这些具体的例子。"},{"question":"如果文章真的提到了 food, milk 和 clothes，那么 A, B, C 都是对的。这时，你应该选择哪一个选项？","hint":"看看选项D是什么。它写着 'A, B and C'。","takeaway":"当多个选项都正确时，要选择那个能包含所有正确信息的、最全面的选项。"}]},{"title":"词汇分类","steps":[{"question":"我们来看 'food' (食物) 和 'milk' (牛奶) 这两个词，它们之间有什么关系？","hint":"哪个词的范围更大？哪个更具体？","takeaway":"'food' 是一个大类，而 'milk' 是 'food' 的一个具体例子。"},{"question":"既然 'milk' 属于 'food'，如果文章只提到了 'milk'，我们可以认为它也支持了选项A 'food' 吗？","hint":"是的，通过具体例子可以推断出其所属的大类。","takeaway":"理解词汇的上下义关系（如“水果”和“苹果”）有助于进行阅读推理。"}]},{"title":"题型特点","steps":[{"question":"你注意到选项D的格式 'A, B and C' 了吗？这种选项被称为“汇总型选项”。当你看到它时，应该提醒自己做什么？","hint":"不能只找到一个对的就选，需要检查每一个。","takeaway":"遇到汇总型选项，必须逐一检查所有子选项的正确性。"},{"question":"假设文章只提到了 food 和 milk，没有提到 clothes。那么选项D还正确吗？这时应该选什么？","hint":"如果C是错的，那么D 'A, B and C' 也是错的。你需要找一个只包含A和B的选项，或者在A和B中选一个更概括的。","takeaway":"汇总型选项要求所有部分都必须正确，否则该选项整体就是错误的。"}]}]}},{"number":"4","item_type":"reading","context_note":"Passage A","stem":"After people put the things in the basket, they go _____.","options":{"A":"home","B":"to the checkout(收银台)","C":"out","D":"to another shop"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对事件发生顺序的理解。题目询问“在人们把东西放进购物篮之后，他们去哪里”。这需要根据购物的流程来判断。正常的超市购物流程是：进入超市 -> 拿购物篮或推车 -> 挑选商品放入篮中 -> **去收银台付款** -> 离开超市回家。因此，在“把东西放进购物篮”之后，下一步就是去“收银台”（checkout）付款。选项B完全符合这个逻辑顺序。选项A（回家）、C（出去）都发生在付款之后，而D（去另一家商店）与当前购物流程无关。","knowledge_expansion_md":"理解表示时间顺序和流程的关键词是阅读记叙文和说明文的基础。常见词汇和短语有：\n\n*   **开始**: `First`, `To begin with`, `At the beginning`\n*   **中间过程**: `Then`, `Next`, `After that`, `Later`, `Second`\n*   **结束**: `Finally`, `In the end`, `At last`\n\n题目中的 `After ...` (在...之后) 就是一个明确的时间顺序提示词。看到这类词，就要在头脑中构建一个时间线，理清事件的先后关系。同时，掌握特定场景（如购物、看病、邮寄）的流程词汇（如 `basket`, `checkout`, `pay`, `receipt`）也至关重要。","socratic_tracks":[{"title":"过程顺序理解","steps":[{"question":"题目中的关键词 'After' 是什么意思？它提示我们要注意什么？","hint":"After a, b. 意思是做完 a 之后，再做 b。","takeaway":"'After' 提示我们要关注事件的先后顺序。"},{"question":"在超市购物，把所有想买的东西都放进购物篮里了，这是购物的结束吗？接下来必须要做什么才能把东西带回家？","hint":"你买东西需要付钱吗？","takeaway":"购物流程中，挑选商品之后、离开商店之前，必须经过付款环节。"}]},{"title":"场景词汇","steps":[{"question":"选项B中的 'checkout' 是什么意思？括号里的中文“收银台”给了你什么提示？","hint":"这是超市里一个付钱的地方。","takeaway":"Checkout 指的是超市的收银台，是付款的地方。"},{"question":"请描述一下 'basket' (购物篮) 和 'checkout' (收银台) 在购物流程中的先后关系。","hint":"你是先用篮子装东西，还是先去收银台？","takeaway":"购物时，我们先用购物篮挑选和盛放商品，然后去收银台付款。"}]},{"title":"逻辑与常识","steps":[{"question":"我们用生活常识来判断一下。在超市选好了东西，为什么不能直接回家 (go home)？","hint":"如果你不付钱就把东西带走，会发生什么？","takeaway":"不付款就将商品带离商店是不允许的，这违反了购物规则和法律。"},{"question":"为什么选项 C (out) 和 D (to another shop) 也是不合逻辑的？","hint":"你还没有为你篮子里的东西付款，不能就这么离开。","takeaway":"在完成当前商店的付款流程之前，直接离开或去下一家商店都是不合逻辑的行为。"}]}]}},{"number":"5","item_type":"reading","context_note":"Passage A","stem":"Most people usually go to the supermarket _____ a week.","options":{"A":"three times","B":"once","C":"twice","D":"many times"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对文章细节信息的定位。根据文章最后一句“Most people go to the supermarket once a week.”（大多数人一周去一次超市），题目询问人们通常去超市的频率。选项B“once”（一次）与原文信息“once a week”直接对应。因此，正确答案是B。","knowledge_expansion_md":"### 频度副词的辨析\n\n在英语中，描述动作发生频率的词或词组称为频度副词（Adverbs of Frequency）。它们可以分为两类：\n\n1.  **明确频度副词**：表示确切的频率，如：\n    *   `once` (一次), `twice` (两次), `three times` (三次)\n    *   `every day/week/month` (每天/周/月)\n    *   `once a week` (一周一次)\n\n2.  **不明确频度副词**：表示大概的频率，如：\n    *   `always` (总是, 100%)\n    *   `usually` (通常, ~90%)\n    *   `often` (经常, ~70%)\n    *   `sometimes` (有时, ~50%)\n    *   `seldom/rarely` (很少, ~10%)\n    *   `never` (从不, 0%)\n    *   `many times` (很多次)\n\n**解题技巧**：在阅读理解中，要仔细辨别题目是考查直接信息还是概括性信息。当原文提供了非常具体的信息（如 `once a week`），而选项中恰好有与之对应的关键词（如 `once`）时，这通常是正确答案。除非题目有特殊要求，否则应选择最直接、最忠于原文的选项。","socratic_tracks":[{"title":"细节定位","steps":[{"question":"题目问的是“大多数人通常去超市_____”。文章中关于频率是怎么说的？","hint":"找到文章最后一句。","takeaway":"原文明确指出 “Most people go to the supermarket once a week.”"},{"question":"“once a week” 是什么意思？","hint":"意思是“一周一次”。","takeaway":"关键信息是“一次”（once）。"},{"question":"对比选项，哪个选项与原文的“一次”最匹配？","hint":"选项B就是 “once” (一次)。","takeaway":"当原文有直接对应的细节时，应优先选择该细节选项。"}]},{"title":"排除干扰项","steps":[{"question":"原文提到“一次”，那么选项A “three times” (三次) 和 C “twice” (两次) 正确吗？","hint":"原文没有提到三次或两次。","takeaway":"与原文信息不符的选项可以首先排除。"},{"question":"选项D “many times” (很多次) 为什么不是本题的最佳答案？","hint":"虽然“一周一次”长期来看是“很多次”，但题目中有更精确、更直接的答案。","takeaway":"在阅读理解中，当有直接信息支撑的选项时，通常优于需要进一步推理和概括的选项。选项B是直接信息，选项D是推理信息。"}]}]},"correct_answer":"B"}]},{"section_title":"VI. 阅读理解 B 篇（接上文）","section_instruction":"B\nSkin-diving(轻装潜水) is a new sport today. This sport takes you into a wonderful new world. It is like a visit to the moon. When you are under the water, it is easy for you to climb big rocks, because you are no longer heavy.\nHere, under water, everything is blue and green. During the day, there is plenty of light. When fish swim nearby, you can catch them with your hands.\nWhen you have tanks of air on your back, you can stay in deep water for a long time. But you must be careful when you dive in deep water.\nCatching fish is one of the most interesting parts of this sport. Besides, there are more uses for skin-diving. You can clean ships without taking them out of water. You can get many things from the deep sea.\nNow you see that skin-diving is both useful and interesting.","items":[{"number":"6","item_type":"reading","context_note":"Passage B","stem":"Skin-diving can take you to _____.","options":{"A":"deep water","B":"the mountains","C":"a new world of land","D":"the moon"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节定位题。题目问“潜水能带你去哪里？”。根据文章第三段“When you have tanks of air on your back, you can stay in deep water for a long time.”（当你背上气瓶时，你可以在深水里待很长时间。）以及第四段“You can get many things from the deep sea.”（你可以从深海里获得很多东西。），可知潜水活动可以到达“深水”（deep water）区域。选项 B 和 C 明显与水下活动无关。选项 D 提到了“月球”，但原文是“It is like a visit to the moon.”（它就像一次月球之旅），这是一种比喻，用来形容水下失重的感觉，并非真的能去月球。因此，最符合事实的地点是 A。","knowledge_expansion_md":"### 区分事实与比喻 (Literal vs. Figurative Language)\n\n在阅读理解中，区分作者的字面描述和比喻性语言非常重要。\n\n*   **字面语言 (Literal Language)**：词语的含义就是其最基本、最直接的意思。例如，`The water is blue.` (水是蓝色的。)\n*   **比喻语言 (Figurative Language)**：词语的含义超出了其字面意思，用来创造更生动的画面或感觉。常见的比喻有：\n    *   **明喻 (Simile)**：使用 `like` 或 `as` 进行比较。例如本文中的 `It is like a visit to the moon.`\n    *   **暗喻 (Metaphor)**：不使用 `like` 或 `as`，直接将一物比作另一物。例如本文中的 `It can take you to a new world.`\n\n本题的提问方式 `take you to _____` 是在询问一个实际可以到达的地点。因此，我们需要寻找文中的事实性、字面性的描述，而不是比喻性的说法。","socratic_tracks":[{"title":"细节定位","steps":[{"question":"题目问“潜水能带你去哪里？”。文章中有没有提到和“水”或“深度”相关的词？","hint":"仔细阅读第三段和第四段。","takeaway":"文章提到了 “under water” (在水下)、“deep water” (深水) 和 “deep sea” (深海)。"},{"question":"既然文章明确提到了 “deep water” 和 “deep sea”，那么选项 A “deep water” (深水) 是否是一个可以去到的地方？","hint":"原文直接提到了这个词组。","takeaway":"是的，原文明确指出潜水可以到达深水区。"}]},{"title":"理解比喻","steps":[{"question":"文章第一段说 “It is like a visit to the moon.” 这是否意味着潜水真的能带我们去月球？","hint":"注意 “like” 这个词。它在这里是什么用法？","takeaway":"“like” 在这里表示“像……一样”，是一个比喻，说明水下的感觉和在月球上很相似。"},{"question":"既然是比喻，那么选项 D “the moon” 是一个正确答案吗？","hint":"题目问的是“能带你去哪里”，通常指一个实际的地点。","takeaway":"D 选项描述的是一种感觉或体验，而不是一个实际能到达的地点，因此不正确。"}]},{"title":"排除干扰项","steps":[{"question":"我们来看选项 B “the mountains” (山脉) 和 C “a new world of land” (一个新的陆地世界)。文章内容和这两项有关系吗？","hint":"Skin-diving 是在水里还是在陆地上进行的活动？","takeaway":"Skin-diving 是水下活动，所以和山脉、陆地世界无关，可以排除 B 和 C。"},{"question":"现在只剩下 A “deep water” 和 D “the moon”。我们已经分析过 D 是一个比喻。那么 A 呢？潜水活动是否可以发生在深水区？","hint":"回顾第三段和第四段，看看文章是否直接提到了 'deep water' 或 'deep sea'。","takeaway":"这说明潜水者可以去到深水区，所以 “deep water” 是一个潜水可以到达的合理地点。"},{"question":"比较 A 和 D，哪个是描述潜水能带你去的实际地点？","hint":"一个是实际环境，一个是比喻性的感受。","takeaway":"“deep water” 是一个实际的地点，而 “the moon” 只是一个比喻，因此 A 是最佳答案。"}]}]}},{"number":"7","item_type":"reading","context_note":"Passage B","stem":"During the day, _____ under water.","options":{"A":"there is no light at all","B":"there is plenty of light","C":"there is a new world of land","D":"it is like a visit to the moon"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节定位题。题干问的是“白天在水下的情况”。我们可以在文章第二段找到直接对应的句子：“During the day, there is plenty of light.”（白天，有充足的光线。）这句话与选项 B “there is plenty of light”（有充足的光线）的意思完全一致。其他选项中，A 是反义干扰，C 和 D 则是与问题无关的错误信息。","knowledge_expansion_md":"### 阅读技巧：关键词定位法\n\n在做阅读理解的细节题时，“关键词定位法”是一种非常高效的策略。\n\n1.  **识别题干关键词**：从题干中找出最核心、最具体、最不容易被替换的词语。本题的关键词是 `During the day` 和 `under water`。\n2.  **快速扫描原文**：带着关键词快速浏览文章，寻找与关键词相同或相似的词语或句子。\n3.  **定位并精读**：一旦找到相关句子，就要仔细阅读该句及其上下文，确保理解准确。\n4.  **匹配选项**：将理解后的原文信息与各个选项进行比对，选出最符合原文意思的一项。\n\n### 词汇拓展\n*   `plenty of`: 充足的，大量的。可同时修饰可数名词和不可数名词，与 `a lot of` / `lots of` 类似。例如：`plenty of books`, `plenty of water`。\n*   `light`: 在此作不可数名词，意为“光，光线”。作可数名词时，意为“灯”。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"题干中最重要的关键词是哪些？","hint":"题干问的是“白天在水下”的情况。","takeaway":"关键词是 “During the day” 和 “under water”。"},{"question":"带着这些关键词，在文章中寻找对应的句子。","hint":"快速浏览文章，寻找包含 “During the day” 的句子。","takeaway":"文章第二段写道：“During the day, there is plenty of light.”"},{"question":"这句话的意思和哪个选项完全一样？","hint":"对比原文和四个选项。","takeaway":"原文句子和选项 B 的意思完全吻合。"}]},{"title":"辨析近义与反义","steps":[{"question":"选项 B 说 “there is plenty of light” (有充足的光线)。“plenty of” 是什么意思？","hint":"想想你什么时候会用这个词组，比如 “I have plenty of time.”","takeaway":"“plenty of” 意思是“大量的，充足的”。"},{"question":"选项 A 说 “there is no light at all” (一点光都没有)。这和选项 B 是什么关系？","hint":"一个是“充足”，一个是“完全没有”。","takeaway":"选项 A 和选项 B 是意思完全相反的反义选项。"},{"question":"原文说 “there is plenty of light”，那么我们应该选择哪个选项？","hint":"找到原文的直接证据后，选择与之意思相同的选项，排除意思相反的选项。","takeaway":"原文直接支持了选项 B，并否定了选项 A。"}]},{"title":"排除无关信息","steps":[{"question":"题干问的是“白天水下的光线情况”。我们来看看选项 C 和 D。","hint":"选项 C “there is a new world of land” (有一个新的陆地世界) 和光线有关吗？文章是怎么描述水下世界的？","takeaway":"选项 C 描述的是地点，与光线无关，且与文章水下世界的事实相悖。"},{"question":"选项 D “it is like a visit to the moon” (它就像访问月球) 和光线有关吗？文章在哪一部分提到了这个比喻？","hint":"回到原文，找到提到 “moon” 的句子，看看它的上下文。","takeaway":"这个比喻出现在第一段，是用来形容水下失重的感觉，与第二段描述的光线无关。"},{"question":"为什么在做题时，准确理解每个选项并判断其与问题的关联性很重要？","hint":"有些选项可能来自原文，但它们回答的不是当前这个问题。","takeaway":"做阅读题不仅要看选项信息是否正确，更要看它是否回答了题干的问题。"}]}]}},{"number":"8","item_type":"reading","context_note":"Passage B","stem":"You can climb big rocks under water easily because _____.","options":{"A":"you are very heavy","B":"you are as heavy as on the land","C":"you are very thin","D":"you are not so heavy as on the land"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道考查因果关系的细节题。题干用 “because” 提问，意在寻找“在水下可以轻松攀爬大石头”的原因。根据文章第一段的描述：“...it is easy for you to climb big rocks, because you are no longer heavy.”（……你可以轻松地攀爬大石头，因为你不再重了。）原文清晰地呈现了“因”和“果”：原因是在水下感觉更轻（不再重了），结果是可以轻松攀爬。选项 D “you are not so heavy as on the land”（你不如在陆地上那么重）是对原文原因“you are no longer heavy”的正确解读。因此，D是正确答案。","knowledge_expansion_md":"### 语法点：同级比较结构\n\n本题的核心是理解同级比较结构及其否定形式。\n\n1.  **肯定形式: `as + 形容词/副词原级 + as`**\n    *   含义：“和……一样……”\n    *   例句：`He is as tall as his brother.` (他和他的哥哥一样高。)\n\n2.  **否定形式: `not as/so + 形容词/副词原级 + as`**\n    *   含义：“不如……那么……”\n    *   例句：`This book is not as/so interesting as that one.` (这本书不如那本书有趣。)\n    *   注意：在否定句中，第一个 `as` 既可以用 `as` 也可以用 `so`，但 `so` 更常见一些。\n\n本题中的 `you are not so heavy as on the land` 就是一个典型的否定比较句，意思是“你（在水下）不如在陆地上那么重”，准确解释了水下运动更轻松的原因（即水的浮力作用）。","socratic_tracks":[{"title":"寻找因果关系","steps":[{"question":"题目用 “because” 提问，是在问什么？","hint":"“because” 引导的是原因。","takeaway":"题目在寻找一个原因（reason/cause）。"},{"question":"题干中的结果是 “You can climb big rocks under water easily”。在原文中找到这句话，看看它的前一句或后一句是不是在解释原因。","hint":"仔细阅读第一段。","takeaway":"原文是先说结果后说原因：“...it is easy for you to climb big rocks, because you are no longer heavy.”"},{"question":"那么，能轻松爬上大石头的原因是什么？","hint":"原因就在结果的后面，由 'because' 引导。","takeaway":"原因是“在水下你不再重了”。"}]},{"title":"语法结构解析","steps":[{"question":"选项 D “you are not so heavy as on the land” 是一个什么句型？","hint":"注意句中的 “not so...as...”。","takeaway":"这是一个 “not so/as...as...” 的同级比较否定结构。"},{"question":"这个结构是什么意思？它是在比较哪两种情况下的体重？","hint":"它比较的是 “under water” (在水下) 和 “on the land” (在陆地上) 的体重。","takeaway":"这个句型表示“不如……”，它说明在水下的体重不如在陆地上的重。"},{"question":"选项 B “you are as heavy as on the land” 又是什么意思？它和选项 D 有什么区别？","hint":"选项 B 使用了 “as...as...” 肯定结构。","takeaway":"选项 B 表示“和……一样重”，与选项 D 的“不如……重”意思正好相反。"}]},{"title":"排除错误选项","steps":[{"question":"选项 A 说 “you are very heavy” (你很重)。这和原文的说法一致吗？","hint":"原文说的是 'you are no longer heavy' (你不再重了)。","takeaway":"选项 A 与原文意思完全相反，可以排除。"},{"question":"选项 C 说 “you are very thin” (你很瘦)。文章中有没有提到你的体型是胖还是瘦？","hint":"文章只提到了 “heavy” (重)，这是一个关于重量的词，而不是关于体型 “thin” (瘦) 或 “fat” (胖) 的词。","takeaway":"选项 C 属于无中生有，文章并未提及，可以排除。"},{"question":"为什么区分 “heavy” (重) 和 “thin” (瘦) 在这里很重要？","hint":"它们描述的是不同的物理属性。水中的浮力影响的是你的重量感，而不是你的胖瘦。","takeaway":"理解词汇的准确含义是正确解题的关键，“heavy” 指重量，而 “thin” 指体型，两者不能混淆。"}]}]}},{"number":"9","item_type":"reading","context_note":"Passage B","stem":"With tanks of air on your back, you can _____.","options":{"A":"catch fish near your hands","B":"stay under water for a long time","C":"climb big rocks","D":"have more fun"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目问：背着气瓶，你可以做什么？根据文章第三段的直接描述：“When you have tanks of air on your back, you can stay in deep water for a long time.”（当你背上气瓶时，你可以在深水里待很长时间。）因此，B选项“在水下待很长时间”是正确的。选项A（用手抓鱼）和C（爬大石头）是潜水时可以做的活动，但文章并未将它们与使用气瓶直接关联。选项D（获得更多乐趣）是潜水带来的整体感受，不如B具体和直接。","knowledge_expansion_md":"### 词汇拓展：潜水装备\n*   **skin-diving**: 自由潜水，通常指使用潜水面镜、呼吸管和脚蹼的潜水活动，不携带水下呼吸装置。\n*   **scuba diving**: 水肺潜水，即题目中提到的背着气瓶（tanks of air）的潜水方式。SCUBA 是 \"Self-Contained Underwater Breathing Apparatus\" 的缩写。\n*   **snorkel**: 呼吸管\n*   **flippers / fins**: 脚蹼\n*   **wetsuit**: 潜水服\n\n### 语法点：介词 'with' 的用法\n在题干 \"With tanks of air on your back...\" 中，介词 `with` 表示“使用，借着，以...”，引导方式状语，意为“通过使用气瓶”。例如：\n*   I write with a pen. (我用钢笔写字。)\n*   He opened the door with a key. (他用钥匙打开了门。)","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"题干中的核心词组是什么，它指向了哪种潜水装备？","hint":"注意描述“在你背上的”和“空气”的词语。","takeaway":"题干关键词是 “tanks of air on your back”（背上的气瓶），它指的是水肺潜水装置。"},{"question":"这个装备最主要的功能是什么？是帮助你抓鱼，还是让你能在水下呼吸？","hint":"想一想，人类在水下最根本的需求是什么？","takeaway":"气瓶的核心功能是提供氧气，解决人在水下的呼吸问题。"},{"question":"既然能在水下呼吸，这对你在水下活动的时间有什么直接影响？","hint":"对比一下，如果你只能憋气，能待多久？有了气瓶呢？","takeaway":"能够在水下呼吸，意味着你可以在水下停留更长的时间。"}]},{"title":"选项含义辨析","steps":[{"question":"请逐一解释 A, B, C, D 四个选项的中文意思。","hint":"A: 抓鱼；B: 待很长时间；C: 爬石头；D: 更多乐趣。","takeaway":"A是抓手边的鱼，B是在水下待很长时间，C是爬大石头，D是获得更多乐趣。"},{"question":"哪个选项最直接地描述了“气瓶”这一工具带来的能力？","hint":"“获得更多乐趣”是一个结果，而不是工具的直接功能。气瓶是通过实现什么功能，才让你获得乐趣的？","takeaway":"“在水下待很长时间”是气瓶带来的直接能力，而“获得乐趣”是这种能力带来的结果。"}]},{"title":"排除法应用","steps":[{"question":"我们来看C选项 “climb big rocks”（爬大石头）。根据文章第一段，这项活动和潜水有关吗？","hint":"第一段说 'it is easy for you to climb big rocks' when you are 'under the water'。","takeaway":"是的，在水下爬大石头是潜水活动的一部分。但这是因为你在水下感觉更轻，而不是因为你背了气瓶。所以C不是气瓶带来的直接能力。"},{"question":"再看A选项 “catch fish near your hands”（抓你手边的鱼）。背气瓶的主要目的就是为了抓鱼吗？","hint":"抓鱼只是潜水时可能做的一件事，但气瓶最根本的作用是什么？","takeaway":"抓鱼不是气瓶的主要目的，气瓶是为了呼吸，所以A选项不准确。"},{"question":"最后比较B和D。D选项“have more fun”（获得更多乐趣）和B选项“stay under water for a long time”（在水下待很久）哪个是原因，哪个是结果？","hint":"是因为能在水下待得久，所以才获得了更多乐趣，对吗？","takeaway":"B是原因和直接功能，D是其带来的结果，题目问的是工具的功能，因此B更优。"}]}]}},{"number":"10","item_type":"reading","context_note":"Passage B","stem":"Which of the following is NOT true?","options":{"A":"Skin-diving is a new sport.","B":"The only use of skin-diving is to have more fun.","C":"Skin-diving is like visiting the moon.","D":"Skin-diving is not only interesting but useful."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道“选非题”（NOT true question），要求选出描述不正确的一项。我们需要逐一核对选项。\nA选项：文章第一句说“Skin-diving is a new sport today.”，所以A是正确的。\nC选项：文章第一段说“It is like a visit to the moon.”，所以C是正确的。\nD选项：文章最后一句说“Now you see that skin-diving is both useful and interesting.”，这与D选项意思相同，所以D是正确的。\nB选项：文章第四段提到潜水有其他用途（more uses），比如“clean ships”（清洁船只），并总结说它“both useful and interesting”（既有用又有趣）。因此，“唯一的用途是获得乐趣”（The only use... is to have more fun）的说法是错误的，因为它忽略了“有用”的方面。所以B选项不正确。","knowledge_expansion_md":"### 解题技巧：如何应对“选非题” (NOT True Questions)\n1.  **定位原文**：首先尝试在文章中找到与A、B、C、D四个选项相关的信息。\n2.  **寻找“绝对词”**：要特别警惕选项中出现的绝对化词语，如 `only` (唯一), `all` (所有), `never` (从不), `every` (每个), `must` (必须)。包含这些词的选项往往是为了设置陷阱，很可能是错误答案。\n3.  **判断“相对词”**：与绝对词相反，含有 `some` (一些), `may` (可能), `sometimes` (有时), `often` (经常) 等相对化词语的选项，表述留有余地，正确的可能性更高。\n4.  **正反对比**：注意选项之间是否存在逻辑矛盾。如此题中的B和D，一个说“唯一用途”，一个说“不仅...而且...”，两者相互对立，答案很可能就在其中之一。\n5.  **常识判断**：在无法完全确定时，可以借助常识进行辅助判断。一项运动的用途仅仅是为了好玩，这种说法本身就不太符合常理。","socratic_tracks":[{"title":"识别“绝对词”陷阱","steps":[{"question":"请阅读B选项 “The only use of skin-diving is to have more fun.” 你有没有发现哪个词让这句话的语气非常绝对，不留余地？","hint":"是哪个词表示“仅仅、唯一”的意思？","takeaway":"关键词是 “only”（唯一的），它使这个陈述变得非常绝对。"},{"question":"为什么在“判断哪项不正确”的题目中，含有 “only” 的句子很可能是答案？","hint":"想一想，一项活动（比如潜水）的用途真的只有一种吗？会不会还有其他用途，比如科学研究、水下作业等？","takeaway":"因为它排除了所有其他的可能性，而现实世界中事物的功能往往是多样的，所以这种绝对的表述很容易出错。"}]},{"title":"选项对比与逻辑推理","steps":[{"question":"我们来比较一下B选项和D选项。B说潜水的“唯一”用途是好玩。D说潜水“不仅”有趣“而且”有用。这两个说法能同时成立吗？","hint":"如果一件事物“不仅...而且...”，那它的用途会是“唯一”的吗？","takeaway":"这两个选项的观点是相互矛盾的，不可能同时为真。"},{"question":"在阅读文章时，作者通常会更倾向于哪种描述方式？是说一项活动只有单一的好处，还是会介绍它的多方面价值？","hint":"介绍性文章通常希望全面地展示事物。","takeaway":"文章通常会介绍事物的多方面价值，因此D选项的描述比B选项更符合一般逻辑。"},{"question":"既然B和D矛盾，而D的可能性更高，那么作为“选非题”，我们应该选择哪个答案？","hint":"题目要求我们选出“NOT true”（不正确）的一项。","takeaway":"因为D选项更可能是正确的，那么与之矛盾的B选项就是不正确的，所以选B。"}]},{"title":"理解比喻修辞","steps":[{"question":"来看C选项 “Skin-diving is like visiting the moon.” 这句话是真的说潜水就是去月球吗？","hint":"注意 “like” 这个词，它在这里是“喜欢”还是“像”？","takeaway":"这不是字面意思，而是一个比喻，意思是潜水的感觉“像”去月球一样。"},{"question":"作者为什么会用这样的比喻来描述潜水？","hint":"水下的世界和陆地有什么不同？月球和地球有什么不同？它们有什么共同的感受？","takeaway":"因为水下世界对我们来说很陌生、新奇，甚至有失重感，这与探索太空或月球的感受有相似之处。"},{"question":"所以，如果文章中出现了类似的描述，那么C选项在文中的语境下就是一个“真实”的陈述，对吗？","hint":"它描述的是一种作者想要传达的感受。","takeaway":"是的，它描述的是一种感受，在文章语境下是成立的，因此不是“NOT true”的选项。"}]}]}}]},{"section_title":"VII. 书面表达。 (共 15 分)","section_instruction":"某英文网站进行了一次中学生健康情况调查, 发现很多中学生的健康状况令人担忧。主要原因有: 饮食结构不合理, 体育锻炼不足等。为此, 他们发起了题为“How to Keep Fit”的征文活动, 请你根据当前实际情况, 结合本学期所学知识, 以“How to Keep Fit”为题写一篇英语短文, 说明如何保持身体健康。不少于100词。","items":[{"number":"1","item_type":"writing","context_note":"","stem":"How to Keep Fit","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"请在此处书写作文。","teaching":{"correct_answer":"Keeping fit is very important for us students. First, we should have a balanced diet. Eating more fruits and vegetables is good for our health. We should eat less junk food. Second, doing exercise is a great way to stay healthy. We can run, swim or play ball games. Also, we need enough sleep every night. If we follow these tips, we can be stronger and have more energy for our studies.","explanation_md":"本篇范文是一篇关于“如何保持健康”的建议类短文。文章采用了清晰的“总—分—总”结构。开头第一句点明主旨，强调保持健康的重要性。中间部分从三个方面展开：均衡饮食（balanced diet）、坚持锻炼（doing exercise）和充足睡眠（enough sleep），并使用了“First”、“Second”、“Also”等连接词，使文章条理清晰。结尾部分总结了保持健康的好处，即可以更强壮、更有精力学习。全文语言简洁流畅，内容充实，符合题目要求。","knowledge_expansion_md":"### 写作结构：建议类作文万能公式\n建议类作文通常可以遵循“总—分—总”的结构：\n1.  **总起 (Introduction)**：开门见山，点明主题。常用句型：\n    *   `It is important/necessary for sb. to do sth.` (做某事对某人很重要/必要)\n    *   `Here is some advice on how to...` (这里有一些关于如何...的建议)\n2.  **分述 (Body)**：分点阐述具体的建议，通常2-3点。常用连接词和句型：\n    *   **连接词**：`First/Firstly...`, `Second/Secondly...`, `Thirdly/Finally...`, `Also...`, `What's more...`\n    *   **建议句型**：`We should/shouldn't...`, `You'd better (not) do...`, `Try to do...`, `It's a good idea to do...`\n3.  **总结 (Conclusion)**：重申观点或总结好处。常用句型：\n    *   `If we follow these tips, we will...` (如果我们遵循这些建议，我们将会...)\n    *   `In a word, ...` (总而言之，...)\n\n### 话题词汇：健康生活\n*   **饮食**：`balanced diet` (均衡饮食), `junk food` (垃圾食品), `fast food` (快餐), `vegetables` (蔬菜), `fruits` (水果), `plenty of water` (大量的水)\n*   **锻炼**：`do/take exercise`, `work out`, `keep moving`, `play sports`, `go jogging` (去慢跑)\n*   **习惯**：`get enough sleep/rest` (获得足够睡眠/休息), `stay up late` (熬夜), `good/bad habits` (好/坏习惯)","socratic_tracks":[{"title":"搭建“总-分-总”结构","steps":[{"question":"一篇关于“如何做某事”的作文，开头第一句最好写什么？","hint":"直接告诉读者这篇文章要讲什么，或者为什么这件事很重要。","takeaway":"开头应开门见山，点明主题，例如“Keeping fit is very important.”"},{"question":"为了让你的几条建议显得条理清晰，你可以使用哪些词语来引导每一条建议？","hint":"想一想表示顺序的词，比如“第一”、“第二”、“此外”。","takeaway":"使用“First”、“Second”、“Also”等连接词可以使文章结构清晰，逻辑连贯。"},{"question":"文章的结尾通常写什么内容？","hint":"对全文进行总结，或者说明做到这些建议后会有的好结果。","takeaway":"结尾可以总结观点或展望未来，说明按建议做的好处，使文章更完整。"}]},{"title":"运用核心句型","steps":[{"question":"想提出“应该做某事”的建议，除了用 “We should...”，你还能想到哪些不同的句型？","hint":"试试用 “It's a good idea to...” 或者 “Doing something is a good way to...”","takeaway":"掌握多种建议句型，如“We should...”、“It's a good idea to...”、“Doing sth. is a great way to...”，可以避免表达单一。"},{"question":"如何表达“不应该做某事”？比如“不应该熬夜”。","hint":"可以在 should 后面加 not，或者用 “try not to do something”。","takeaway":"表达否定建议时，可以使用“We should not...”或“You'd better not...”，例如“We should not stay up late.”"}]},{"title":"丰富文章内容","steps":[{"question":"关于“保持健康”，除了“运动”，你还能想到生活中其他重要的方面吗？","hint":"我们每天吃什么？每天晚上做什么？","takeaway":"可以从饮食（diet）、运动（exercise）、睡眠（sleep）等多个角度构思内容，使文章更全面。"},{"question":"在说“多运动”这一点时，怎样让它更具体？","hint":"举出一些你喜欢的运动作为例子。","takeaway":"通过举例可以让观点更具体，例如在“do exercise”后加上“such as running, swimming or playing ball games”。"},{"question":"在说“均衡饮食”时，除了说要吃什么，还可以补充说不该吃什么吗？","hint":"健康的对立面是什么？比如薯片、可乐属于什么食品？","takeaway":"从正反两方面来说明一个观点，能让内容更丰富，例如“eat more vegetables and fruits”和“eat less junk food”。"}]}]}}]}],"content_markdown":"# 成都某实验外国语学校初2025级新初一入学直卷英语（一）\n\n**满分：100分**\n**时间：60分钟**\n\n---\n\n### I. 单项选择 (共 15 分)\n\n1.  —How long did you watch TV last night?\n    —About two hours. _____\n    A. At\n    B. Till\n    C. On\n    D. In\n2.  —Why does the boy have few friends?\n    —Because he is _____.\n    A. rude\n    B. kind\n    C. polite\n    D. careful\n3.  —Don't be so _____. Father is writing a report.\n    —Sorry, I didn't know that.\n    A. careless\n    B. quiet\n    C. noisy\n    D. brave\n4.  —Do you like the goldfish?\n    —Yes. I like watching it _____.\n    A. bark\n    B. bite\n    C. move\n    D. bubble\n5.  —How much does the goldfish _____?\n    —About 200 grams.\n    A. brush\n    B. weight\n    C. weigh\n    D. look\n6.  —Don't read _____ the sun. It's bad for eyesight.\n    —I see. Thank you.\n    A. in\n    B. on\n    C. under\n    D. below\n7.  It's hot in the room. Let's sleep with the windows _____.\n    A. closing\n    B. closed\n    C. opened\n    D. open\n8.  —What should I do if I want someone to do something for me?\n    —You should _____ \"please\".\n    A. talk\n    B. speak\n    C. say\n    D. tell\n9.  —You can keep a goldfish as a pet. It is quiet ____ lovely.\n    —That's right. It never barks _____ bites at anyone.\n    A. and; or\n    B. but; or\n    C. and; and\n    D. or; and\n10. —Look, our Chinese teacher is coming _____ a book in his hand.\n    —Oh, yes. Let's stop talking and prepare for his class.\n    A. with\n    B. by\n    C. through\n    D. over\n11. —I'm going to the supermarket.\n    —_____ I go with you?\n    A. Must\n    B. Can\n    C. Need\n    D. Should\n12. —_____ do you go to the library?\n    —Twice a week.\n    A. How long\n    B. How often\n    C. How much\n    D. How many\n13. —What's the date today?\n    —It's _____.\n    A. June second\n    B. the June second\n    C. June the second\n    D. second June\n14. —Is there _____ in the classroom?\n    —No, there isn't.\n    A. something\n    B. anything\n    C. nothing\n    D. everything\n15. —What's your father?\n    —He is _____.\n    A. a doctor\n    B. tall and strong\n    C. at home\n    D. fine\n\n### II. 完形填空 (共 20 分)\n\nSam had a dog. Its name was Ted. It was very helpful, but it ate too much. So he didn't like it. He wanted to __1__ it. He __2__ Ted and put it in a small boat. He rowed the boat to the __3__ of a big river. Just as he __4__ the poor animal into the river, the boat began to go down. __5__ the man and Ted __6__ into the river.\nTed was able to swim, __7__ Sam couldn't. The dog hit the rope(绳子) and broke(破坏) it. It tried its best to swim to __8__ Sam. The man was saved, so he was very thankful for the dog and he didn't want to kill the dog __9__. From then on, he gave the dog as __10__ as it wanted.\n\n1.  A. sell\n    B. buy\n    C. beat\n    D. kill\n2.  A. tied\n    B. pulled\n    C. pushed\n    D. closed\n3.  A. front\n    B. foot\n    C. side\n    D. middle\n4.  A. threw\n    B. carried\n    C. sent\n    D. brought\n5.  A. Neither\n    B. Nor\n    C. Each\n    D. Both\n6.  A. fell\n    B. swam\n    C. lost\n    D. jumped\n7.  A. because\n    B. but\n    C. so\n    D. when\n8.  A. kill\n    B. help\n    C. meet\n    D. hit\n9.  A. any more\n    B. any more\n    C. no longer\n    D. not more\n10. A. little\n    B. much\n    C. many\n    D. much\n\n### III. 根据首字母或汉语提示完成单词或句子。(共 10 分)\n\n1. Look! She is d_____ up as a Monkey King.\n2. Which is your f_____ festival?\n3. How do people c_____ Hall-oween?\n4. He often eats vegetables and fruits to keep _____ (健康).\n5. My new dress is made of _____ (丝绸).\n\n### IV. 句型转换。(共 10 分)\n\n1. I collect toys because they are beautiful. (对画线部分提问)\n   _____ you collect toys?\n2. Let's play the piano, _____? (完成反义疑问句)\n3. some, in, there, shop, the, music, CDs, are. (连词成句)\n4. They have lunch at home. (对画线部分提问)\n   _____ they have lunch?\n5. We are having a nice day. (改为感叹句)\n   _____ nice day we are having!\n\n### V. 根据汉语意思完成句子 (共 10 分)\n\n1. 她的外套和她的帽子不相配。\n   Her hat doesn't _____ her coat.\n2. 篮子里还有一些西红柿。\n   There are some tomatoes _____ in the basket.\n3. 每年孩子们都为万圣节做他们自己的南瓜灯。\n   Every year children make their own _____ for Halloween.\n4. 他经常去吃肯德基, 他非常喜欢汉堡包。\n5. 我们一周打三次篮球。\n\n### VI. 阅读理解。 (共 20 分)\n\n**A**\n\nDo you know anything about the way of shopping in Western countries? People there usually make shopping lists first and then they go shopping. Most people like to go to supermarkets because they can get almost(几乎) everything in one supermarket. For example, they can buy many styles of clothes, food and sports things. And the things in supermarkets are cheaper. When they get into the supermarket, they carry a basket. Then they buy things and put them in the basket. After getting everything they want, they pay the money. Most people go to the supermarket once a week.\n\n1.  People like to go to supermarkets for _____ reasons.\n    A. three\n    B. two\n    C. one\n    D. many\n2.  Things in supermarkets are _____.\n    A. cheaper\n    B. more expensive\n    C. better\n    D. more\n3.  People can buy _____ from supermarkets.\n    A. food\n    B. milk\n    C. clothes\n    D. A, B and C\n4.  After people put the things in the basket, they go _____.\n    A. home\n    B. to the checkout(收银台)\n    C. out\n    D. to another shop\n5.  Most people usually go to the supermarket _____.\n    A. three times\n    B. once\n    C. twice\n    D. many times\n\n**B**\n\nSkin-diving(轻装潜水) is a new sport today. This sport takes you into a wonderful new world. It is like a visit to the moon. When you are under the water, it is easy for you to climb big rocks, because you are no longer heavy.\nHere, under water, everything is blue and green. During the day, there is plenty of light. When fish swim nearby, you can catch them with your hands.\nWhen you have tanks of air on your back, you can stay in deep water for a long time. But you must be careful when you dive in deep water.\nCatching fish is one of the most interesting parts of this sport. Besides, there are more uses for skin-diving. You can clean ships without taking them out of water. You can get many things from the deep sea.\nNow you see that skin-diving is both useful and interesting.\n\n6.  Skin-diving can take you to _____.\n    A. deep water\n    B. the mountains\n    C. a new world of land\n    D. the moon\n7.  During the day, _____ under water.\n    A. there is no light at all\n    B. there is plenty of light\n    C. there is a new world of land\n    D. it is like a visit to the moon\n8.  You can climb big rocks under water easily because _____.\n    A. you are very heavy\n    B. you are as heavy as on the land\n    C. you are very thin\n    D. you are not so heavy as on the land\n9.  With tanks of air on your back, you can _____.\n    A. catch fish near your hands\n    B. stay under water for a long time\n    C. climb big rocks\n    D. have more fun\n10. Which of the following is NOT true?\n    A. Skin-diving is a new sport.\n    B. The only use of skin-diving is to have more fun.\n    C. Skin-diving is like visiting the moon.\n    D. Skin-diving is not only interesting but useful.\n\n### VII. 书面表达。 (共 15 分)\n\n某英文网站进行了一次中学生健康情况调查, 发现很多中学生的健康状况令人担忧。主要原因有: 饮食结构不合理, 体育锻炼不足等。为此, 他们发起了题为“How to Keep Fit”的征文活动, 请你根据当前实际情况, 结合本学期所学知识, 以“How to Keep Fit”为题写一篇英语短文, 说明如何保持身体健康。不少于100词。\n\n**How to Keep Fit**\n","proofread_notes":"1.  **格式规范**：对 `exam_meta` 中的中文标点和空格进行了规范化处理；`school_or_title` 中的“初 2025 级”已修正为“初2025级”。\n2.  **内容修正**：\n    *   IV.3 句型转换题，原题干混杂了题目和答案，已修正为清晰的连词成句指令。\n    *   V.4 和 V.5 完成句子题，原题干包含完整的英文答案，已修正，仅保留中文提示作为题干。\n    *   所有题目的 `item_type` 均已根据题型规范化（如阅读理解题型统一为 `reading`）。\n    *   阅读理解题（VI）已遵循规范，将短文置于 `section_instruction` 中，后续小题不再重复。\n3.  **试卷原文质量问题**：\n    *   I.1 题干不完整（`—About two hours. _____`），无法构成一个有明确答案的问题，已按原样保留。\n    *   II.9 完形填空题的 A、B 选项均为“any more”，已按原样保留。\n    *   II.10 完形填空题的 B、D 选项均为“much”，已按原样保留。","set_number":8,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_08\\page_017.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_08\\page_018.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":46},{"step":2,"name":"verify","items":51,"check_passed":false,"issues_count":7},{"step":3,"name":"polish","items":51}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T13:15:06.456982+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  async function deepseekChat(userContent, maxTokens) {
    if (!hasDeepseekKey()) {
      throw new Error("未配置 DeepSeek API Key");
    }
    const r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + INLINE_CFG.deepseekKey,
      },
      body: JSON.stringify({
        model: "deepseek-v4-flash",
        messages: [{ role: "user", content: userContent }],
        temperature: 0.2,
        max_tokens: maxTokens || 4096,
      }),
    });
    let data = {};
    try { data = await r.json(); } catch (e) { /* ignore */ }
    if (!r.ok) {
      const msg = (data.error && data.error.message) || data.detail || r.statusText || "请求失败";
      throw new Error(msg);
    }
    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return (c || "").trim();
  }

  function esc(s) {

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    const raw = String(stem || "").replace(/\r\n/g, "\n");
    const lines = raw.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    let html = "";
    chunks.forEach((ch) => {
      if (ch.kind === "text") {
        html +=
          "<div class='writing-stem-text'>" + esc(ch.text).replace(/\n/g, "<br>") + "</div>";
      } else {
        html += markdownPipeTableLinesToHtml(ch.lines);
      }
    });
    return html;
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);

      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphs(String(passage || "").trim());
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    return formatPassageParagraphsExam(String(passage || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    return false;
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const t = String(fullText || "");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        const singleLetterLn = new RegExp("^\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterLn.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "reading") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupDetailsByReadingPassage(details) {

      if (row.type !== "reading") {
