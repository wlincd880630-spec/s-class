<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    a.btn.secondary.answers-link {
      display: inline-block; font: inherit; cursor: pointer;
      border-radius: 10px; padding: 0.45rem 1rem; font-weight: 600;
      background: #fff; border: 1px solid var(--border); color: var(--ink);
      text-decoration: none;
    }
    a.btn.secondary.answers-link:hover { border-color: var(--accent); color: var(--accent); }

    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第08套","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟","type_card_order":"paper_sections"},"sections":[{"section_title":"I. 单项选择 (共 15 分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"—How long did you watch TV last night?\n—About two hours. _____","options":{"A":"At","B":"Till","C":"On","D":"In"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查在特定语境下对时间介词的理解。问句“How long...?”提问的是持续时间，答句“About two hours”已经给出了时长。因此，空格部分很可能是一个被省略的补充说明，即动作持续到什么时间点。例如，完整的句子可能是“I watched TV till midnight.”（我一直看电视到午夜）。在四个选项中，只有“till”（直到……为止）可以表示一个动作的终点时间，符合对话的潜在语境。其他选项：“at”表示具体时间点，“on”用于日期，“in”用于某段时间内，均不符合此处可能被省略的句意。","knowledge_expansion_md":"### 时间介词辨析\n\n1.  **for vs. since**: 两者都用于回答 `How long` 的提问。\n    *   `for` + 一段时间 (a period of time)，例如：`for two hours` (持续了两小时)。\n    *   `since` + 一个时间点 (a point in time)，例如：`since 10 o'clock` (从十点钟开始到现在)。\n\n2.  **till vs. until**: 两者意思相同，都表示“直到……为止”，可以互换使用，`until` 稍显正式。它们强调一个动作或状态持续到某个时间点结束。例如：`The shop is open until 9 p.m.`\n\n3.  **at, on, in**: 这是最基础的时间介词，用法需牢记。\n    *   `at` 用于精确的时间点：`at 8 a.m.`, `at noon`, `at night`。\n    *   `on` 用于具体的某一天或日期：`on Monday`, `on my birthday`, `on May 1st`。\n    *   `in` 用于较长的时间段：`in the morning`, `in July`, `in 2024`, `in summer`。","socratic_tracks":[{"title":"提问方式与介词选择","steps":[{"question":"问题 \"How long\" 是在问什么？","hint":"是问“多长时间”还是“什么时候”？","takeaway":"\"How long\" 提问的是动作持续多长的一段时间。"},{"question":"回答 \"About two hours\" 已经完整回答了 \"How long\" 的问题。那么后面的空格和选项可能是用来补充什么信息的？","hint":"想想看，描述一段持续的动作，除了说它持续了多久，还可以说什么？比如，它什么时候结束？","takeaway":"空格和选项很可能是用来补充说明这个动作结束的时间点。"},{"question":"在 A, B, C, D 四个介词中，哪一个最常用来表示一个动作持续到某个时间点为止？","hint":"比如，“我一直工作到午夜”用英语怎么说？\"I worked ___ midnight.\"","takeaway":"介词 \"till\" (或 \"until\") 用来表示动作的终点时间。"}]},{"title":"时间介词辨析","steps":[{"question":"我们什么时候会用介词 \"at\" 来谈论时间？能举个例子吗？","hint":"比如约在“五点钟”见面。","takeaway":"\"At\" 用于表示一个具体的时间点，如 at 5 o'clock, at noon。"},{"question":"那介词 \"on\" 和 \"in\" 呢？它们通常用在什么样的时间表达前面？","hint":"想想你的生日是在“某一天”还是在“某一年”？","takeaway":"\"On\" 用于具体的某一天或日期 (on Monday)，而 \"in\" 用于较长的时间段，如月份、年份 (in July, in 2024)。"},{"question":"比较 \"till\" 和 \"at\"，如果说“我看到十点”，用 \"I watched TV at 10 p.m.\" 和 \"I watched TV till 10 p.m.\" 有什么区别？","hint":"\"at 10 p.m.\" 是指“在十点钟”这个时间点上发生了看的动作，还是说一直看到了十点钟？","takeaway":"\"at 10 p.m.\" 表示动作发生的瞬间，而 \"till 10 p.m.\" 表示动作一直持续到十点才结束。"}]},{"title":"对话语境与解题技巧","steps":[{"question":"这道题的对话结构看起来有点奇怪，对吗？问答已经完整了，后面却跟着选项。","hint":"在考试中遇到这种题目，我们应该怎么办？","takeaway":"当题目结构不寻常时，要考虑它是否是一道考查补充信息的省略句题目。"},{"question":"既然是补充信息，那么补充的信息需要和前面的对话内容相关。对话内容是“昨晚看电视看了两小时”，补充什么信息最合理？","hint":"是补充看了什么节目，还是补充看到几点？哪个和时间关联更紧密？","takeaway":"补充动作的结束时间点（比如“直到午夜”）是与时长“两小时”最相关的补充信息。"},{"question":"根据这个推断，哪个介词最能引出“结束时间点”？","hint":"回顾一下 at, on, in, till 的用法。","takeaway":"只有 \"till\" (until) 专门用于表示动作的持续和结束，因此是最佳答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"—Why does the boy have few friends?\n—Because he is _____.","options":{"A":"rude","B":"kind","C":"polite","D":"careful"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这道题考查根据因果关系选择合适的形容词。问句“Why does the boy have few friends?”意为“为什么这个男孩几乎没有朋友？”。“few friends”暗示了一种不理想的、负面的情况。因此，回答“Because he is ...”（因为他……）需要给出一个负面的原因。我们来分析选项：A. rude (粗鲁的) 是负面品质；B. kind (善良的) 和 C. polite (有礼貌的) 都是正面品质，通常会让人有很多朋友；D. careful (小心的) 是中性或偏正面的品质。只有“粗鲁”是导致“几乎没有朋友”的直接、合理的负面原因。","knowledge_expansion_md":"### 1. 关键词 `few` vs. `a few`\n这是一个非常重要的知识点，两者都修饰可数名词复数，但含义和语气完全不同。\n*   **few**: 否定含义，表示“很少，几乎没有”，强调数量之少，带有消极、遗憾的语气。例如：`He has few friends.` (他没什么朋友，很孤单)。\n*   **a few**: 肯定含义，表示“有一些，几个”，强调虽然不多但还是有的，是中性或积极的语气。例如：`He has a few friends.` (他有几个朋友)。\n同理，`little` (几乎没有的，用于不可数名词) 和 `a little` (有一点的，用于不可数名词) 也有类似的区别。\n\n### 2. 性格品质类形容词\n*   **褒义词 (Positive)**: `kind` (善良的), `polite` (有礼貌的), `friendly` (友好的), `helpful` (乐于助人的), `brave` (勇敢的), `honest` (诚实的), `generous` (慷慨的), `hard-working` (勤奋的)。\n*   **贬义词 (Negative)**: `rude` (粗鲁的), `lazy` (懒惰的), `selfish` (自私的), `dishonest` (不诚实的), `mean` (刻薄的)。","socratic_tracks":[{"title":"因果逻辑推理","steps":[{"question":"问题 \"Why does the boy have few friends?\" 是在问什么？","hint":"\"Why\" 是问原因，“few friends”是什么意思？","takeaway":"问题在询问“为什么那个男孩几乎没有朋友”的原因。"},{"question":"“几乎没有朋友”是一个好的结果还是一个不好的结果？","hint":"你希望有很多朋友还是几乎没有朋友？","takeaway":"这是一个负面的情况，所以原因也应该是一个负面的特质或行为。"},{"question":"四个选项中，哪个词描述的是一个负面的性格品质？","hint":"`kind` (善良的), `polite` (有礼貌的), `careful` (小心的) 是褒义词还是贬义词？`rude` (粗鲁的) 呢？","takeaway":"\"rude\" (粗鲁的) 是一个负面品质，是导致没有朋友的直接原因。"}]},{"title":"性格形容词辨析","steps":[{"question":"你能分别解释一下 `rude`, `kind`, `polite`, `careful` 这四个词的意思吗？","hint":"试着用一个简单的场景来描述每个词。比如，一个 `polite` 的人会说什么？一个 `rude` 的人会做什么？","takeaway":"`rude`是粗鲁无礼，`kind`是善良友好，`polite`是有礼貌，`careful`是小心谨慎。"},{"question":"`rude` 和 `polite` 之间是什么关系？","hint":"如果一个人不 `polite`，他可能就是...？","takeaway":"`rude` 和 `polite` 是一对反义词。"},{"question":"为什么一个 `kind` 或者 `polite` 的人通常不会“几乎没有朋友”？","hint":"人们喜欢和什么样的人交朋友？","takeaway":"因为善良和礼貌是受欢迎的品质，通常会吸引朋友，而不是赶走他们。"}]},{"title":"关键词 \"few\" 的理解","steps":[{"question":"\"few friends\" 和 \"a few friends\" 有什么区别？","hint":"一个朋友对你说 \"I have a few friends\"，另一个说 \"I have few friends\"，哪一个听起来更孤独？","takeaway":"\"a few friends\" 意思是“有几个朋友”，是中性的；而 \"few friends\" 意思是“几乎没有朋友”，带有负面、消极的含义。"},{"question":"既然题干用了 \"few\"，这暗示了男孩的社交状况是怎样的？","hint":"是“朋友不多，但有几个”还是“朋友少得可怜”？","takeaway":"\"few\" 强调了朋友数量的稀少，暗示了一种不理想的、负面的社交状态。"},{"question":"理解了 \"few\" 的负面含义后，如何帮助我们更快地在选项中找到答案？","hint":"一个负面的结果，应该由一个什么样的原因导致？","takeaway":"负面的结果需要一个负面的原因来解释，这让我们能迅速锁定负面词汇 \"rude\"。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"—Don't be so _____. Father is writing a report.\n—Sorry, I didn't know that.","options":{"A":"careless","B":"quiet","C":"noisy","D":"brave"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考查在特定情境中选择恰当的形容词。第一句话是祈使句“Don't be so _____.”（别那么……），后面给出了原因：“Father is writing a report.”（爸爸正在写报告）。写报告需要一个安静的环境。因此，说话人是在制止某种会破坏安静环境的行为。第二句话的回答“Sorry, I didn't know that.”（对不起，我不知道。）也表明对方之前的行为是不恰当的。分析选项：A. careless (粗心的)；B. quiet (安静的)；C. noisy (吵闹的)；D. brave (勇敢的)。只有“noisy”（吵闹的）是与“需要安静”这一情景直接冲突的行为。因此，选择C。","knowledge_expansion_md":"### 1. 祈使句的用法\n祈使句用于提出请求、建议、命令或警告。其否定形式通常以 `Don't` 开头。\n*   肯定形式：`Be quiet, please.` (请安静。)\n*   否定形式：`Don't be noisy.` (不要吵闹。)\n\n### 2. 通过上下文线索解题\n在做选择题时，要善于寻找上下文中的“线索词”（clues）。\n*   **线索1**: `Father is writing a report.` 这句话暗示了场景需求——需要**安静**。\n*   **线索2**: `Don't be so...` 这句话表明要制止一种与场景需求**相反**的行为。\n*   **线索3**: `Sorry...` 这句话确认了被制止的行为是**不恰当**的。\n综合这三条线索，可以轻松锁定答案为 `noisy`。\n\n### 3. 相关词汇\n*   反义词：`noisy` (吵闹的) ↔ `quiet` (安静的)\n*   近义词：`loud` (大声的) 也是 `noisy` 的近义词，但 `noisy` 更侧重于令人不悦的、混乱的噪音。","socratic_tracks":[{"title":"根据语境推断词义","steps":[{"question":"句中 \"Father is writing a report\" 告诉我们一个什么样的情景？","hint":"一个人在写报告时，通常需要什么样的环境？是需要热闹还是需要安静？","takeaway":"写报告是一项需要专注的工作，因此需要一个安静的环境。"},{"question":"\"Don't be so ___.\" 是一个什么样的句子？它想让对方做什么？","hint":"\"Don't\" 开头的句子是祈使句，表示“不要做某事”。","takeaway":"这是一个祈使句，要求对方停止某种与当前环境不符的行为。"},{"question":"结合爸爸需要安静工作这个情景，说话人最可能要求对方“不要”怎么样？","hint":"在需要安静时，最不应该做的事情是什么？","takeaway":"最可能的要求是“不要吵闹”，因此空格处应该填 \"noisy\"。"}]},{"title":"形容词反义词辨析","steps":[{"question":"选项中的 `quiet` 和 `noisy` 是什么关系？","hint":"一个是“安静的”，另一个是“吵闹的”。","takeaway":"`quiet` 和 `noisy` 是一对反义词。"},{"question":"为什么我们不能选 `quiet`？如果填 `quiet`，\"Don't be so quiet\" 是什么意思？","hint":"“别那么安静”——这是鼓励对方发出声音，这和爸爸需要安静写报告的场景矛盾吗？","takeaway":"选择 `quiet` 会使句意与情景完全相反，逻辑不通。"},{"question":"`careless` (粗心的) 和 `brave` (勇敢的) 为什么不合适？","hint":"“粗心”或“勇敢”会直接影响到写报告需要的“安静”吗？","takeaway":"`careless` 和 `brave` 与当前场景的核心需求（安静）没有直接关联。"}]},{"title":"理解对话功能","steps":[{"question":"第二个人回答 \"Sorry, I didn't know that.\" 这句话说明了什么？","hint":"当我们说“对不起”时，通常是因为我们做错了什么事。","takeaway":"这句道歉表明第二个人承认自己之前的行为是错误的或不恰当的。"},{"question":"他的行为“不恰当”在哪里？","hint":"结合第一句话，他的行为打扰到了正在写报告的爸爸。","takeaway":"他的不当行为就是制造了噪音，打扰了别人。"},{"question":"那么，第一句话中 \"Don't be so ___.\" 空格里的词应该描述的是哪种行为？","hint":"描述一种会打扰别人工作的行为。","takeaway":"空格里的词必须是描述那个被道歉的行为，也就是 \"noisy\" (吵闹)。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"—Do you like the goldfish?\n—Yes. I like watching it _____.","options":{"A":"bark","B":"bite","C":"move","D":"bubble"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考查与动物相关的动词搭配。对话的语境是关于“goldfish”（金鱼）。第二个人说“I like watching it _____.”（我喜欢看它……），空格处需要填入一个金鱼会做的、且人们喜欢观赏的动作。我们来分析选项：A. bark (狗叫)，这是狗的动作；B. bite (咬)，虽然鱼会咬东西，但这通常不是人们观赏的重点；C. move (移动，游动)，鱼在水里游动，这是人们观赏金鱼时的主要乐趣；D. bubble (冒泡)，金鱼偶尔会吐泡泡，但“游动”是更具代表性、更普遍的观赏性动作。因此，“move”是最佳答案。","knowledge_expansion_md":"### 1. 感官动词的用法：`see/watch/hear/feel sb./sth. do/doing sth.`\n这个结构非常常用，表示“看见/观察/听见/感觉到某人/某物做某事”。\n*   **+ do (动词原形)**: 表示看到了动作的全过程或结果。例：`I saw him cross the street.` (我看见他穿过了马路)。\n*   **+ doing (现在分词)**: 表示看到动作正在进行。例：`I saw him crossing the street.` (我看见他正在过马路)。\n本题中 `watching it move` 和 `watching it moving` 都是正确的，前者更侧重于看它游动这个行为本身，后者强调动作的持续性。\n\n### 2. 动物与它们的动作/声音 (Collocations)\n*   `Dogs bark.` (狗吠)\n*   `Cats meow.` (猫喵喵叫)\n*   `Birds sing/chirp.` (鸟唱歌/啾啾叫)\n*   `Lions roar.` (狮子吼)\n*   `Fish swim/move.` (鱼游泳/移动)\n*   `Horses neigh.` (马嘶鸣)\n*   `Bees buzz.` (蜜蜂嗡嗡叫)","socratic_tracks":[{"title":"动词与主语搭配","steps":[{"question":"这道题的空格需要填一个什么词性的词？它描述的是谁的动作？","hint":"\"I like watching it ___.\" 这里的 \"it\" 指的是什么？","takeaway":"需要填一个动词原形，描述的是 \"the goldfish\" (金鱼) 的动作。"},{"question":"我们来逐个分析选项。金鱼会 \"bark\" (狗叫) 吗？","hint":"想想什么动物会叫？","takeaway":"不会，\"bark\" 是狗的叫声，所以 A 选项错误。"},{"question":"金鱼会 \"move\" (移动/游动) 吗？人们观赏金鱼时，主要是在看它的什么？","hint":"金鱼在鱼缸里是静止的还是在游来游去？","takeaway":"金鱼会在水里游动，观赏其优美的动态是养金鱼的一大乐趣，所以 \"move\" 是非常合适的。"}]},{"title":"感官动词用法","steps":[{"question":"\"watch it ___\" 是一个什么样的语法结构？","hint":"\"watch\" 是一个感官动词，后面跟了宾语 \"it\"，宾语后面的动词应该用什么形式？","takeaway":"这是“感官动词 + 宾语 + 动词原形”的结构，表示“看到/观察到某人/某物做了某事”。"},{"question":"除了 `watch`，你还能想到哪些类似的动词？","hint":"比如“看见”、“听见”、“感觉”等。","takeaway":"常见的感官动词还有 see, hear, feel, notice 等。"},{"question":"如果我想强调我看到金鱼“正在”游动，这个句子可以怎么改？","hint":"动词的什么形式可以表示“正在进行”？","takeaway":"可以用现在分词形式，即 \"I like watching it moving.\"，强调动作的持续性。"}]},{"title":"最佳选项选择","steps":[{"question":"我们来看看 B 选项 `bite` (咬) 和 D 选项 `bubble` (冒泡)。金鱼会做这两个动作吗？","hint":"金鱼吃东西时会咬，呼吸或在水面时也可能吐泡泡。","takeaway":"金鱼理论上可以做这两个动作，所以 B 和 D 在事实上是可能的。"},{"question":"既然 B, C, D 描述的动作金鱼都可能做，为什么 C (`move`) 是最佳答案？","hint":"从人们观赏金鱼的普遍乐趣来看，是更喜欢看它咬东西、吐泡泡，还是看它优美地游动？","takeaway":"\"move\" (游动) 是观赏金鱼时最核心、最普遍的活动，最能概括金鱼的动态美。"},{"question":"在回答 \"Do you like the goldfish?\" 这个问题时，用一个最能代表其特点的动作来回答，是不是更符合逻辑？","hint":"就像问“你喜欢小鸟吗？”，回答“是的，我喜欢听它唱歌”比“我喜欢看它喝水”更具代表性。","takeaway":"选择最具有代表性且最符合普遍认知的动作 \"move\" 是最恰当的。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"—How much does the goldfish _____?\n—About 200 grams.","options":{"A":"brush","B":"weight","C":"weigh","D":"look"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查词义与词性辨析。问句意为“这条金鱼有多重？”，回答是“大约200克”。这是一个询问重量的场景。句子结构为“How much does + 主语 + 动词原形?”，因此横线处需要填一个动词原形。选项 C `weigh` 是动词，意为“重达；称……的重量”，符合句意和语法要求。选项 B `weight` 是名词，意为“重量”，词性不符。选项 A `brush` (刷) 和 D `look` (看) 词义不符。","knowledge_expansion_md":"### 核心辨析：`weigh` vs. `weight`\n\n1.  **`weigh`** 是一个**动词**，表示“重达……”或“称重”。\n    *   作不及物动词，表示“有……重”：`The bag weighs 5 kilograms.` (这个包重5公斤。)\n    *   作及物动词，表示“给……称重”：`Could you weigh these apples for me?` (你能帮我称一下这些苹果吗？)\n\n2.  **`weight`** 是一个**名词**，表示“重量”。\n    *   `What is your weight?` (你的体重是多少？)\n    *   `He is trying to lose weight.` (他正在努力减肥。)\n\n### 提问重量的两种主要句型：\n*   `How much does + 主语 + weigh?`\n*   `What is + a/the/所有格 + weight of + 主语?`\n\n例如，询问“你有多重？”可以说：\n*   `How much do you weigh?`\n*   `What is your weight?`","socratic_tracks":[{"title":"词性辨析","steps":[{"question":"观察句子 \"How much does the goldfish ___?\"，特别是助动词 \"does\"，你认为横线处应该填什么词性的词？","hint":"助动词 do/does/did 后面跟的动词是什么形式？","takeaway":"在一般疑问句或特殊疑问句中，助动词 do/does/did 后面的实义动词必须使用原形。"},{"question":"现在看选项 B \"weight\" 和 C \"weigh\"，你知道它们分别是什么词性吗？","hint":"一个以 't' 结尾，一个没有。可以想想 \"What's your weight?\" 和 \"I weigh 50kg.\" 这两个句子。","takeaway":"`weight` 是名词，意为“重量”；`weigh` 是动词，意为“重达，称重”。"},{"question":"结合前两步的结论，哪个选项才是正确的？","hint":"我们需要一个动词原形来完成这个问句。","takeaway":"句子需要一个动词原形，所以只能选择 `weigh`。"}]},{"title":"句意理解","steps":[{"question":"看到回答是 \"About 200 grams\" (大约200克)，你认为问句是在问关于金鱼的什么信息？","hint":"\"gram\" (克) 是一个什么单位？","takeaway":"回答是关于重量的，所以问句一定是在询问重量。"},{"question":"在英语中，哪个动词是专门用来表示“重达……”或“称重”的？","hint":"这个词和名词“重量” (weight) 非常相似。","takeaway":"动词 `weigh` 就是用来表示“重达”或“称重”的。"}]},{"title":"固定句型","steps":[{"question":"除了用 \"How much does ... weigh?\" 来提问重量，你还知道其他句型吗？","hint":"尝试用名词 \"weight\" 来构造一个问句。","takeaway":"提问重量的另一个常用句型是 \"What is the weight of ...?\"。"},{"question":"那么，我们可以把原题 \"How much does the goldfish weigh?\" 替换成什么句子，而意思保持不变？","hint":"使用 \"What is...\" 和名词 \"weight\"。","takeaway":"可以将原句替换为 \"What is the weight of the goldfish?\"。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Don't read _____ the sun. It's bad for eyesight.\n—I see. Thank you.","options":{"A":"in","B":"on","C":"under","D":"below"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查介词的固定搭配。句意为“不要在太阳下看书，这对视力有害。” “在太阳下”或“在阳光里”在英语中是一个固定的表达，用 `in the sun`。这里的 `in` 表示“在……范围里”，可以理解为“沐浴在阳光中”。选项 C `under the sun` 也是一个固定短语，但它是一个习语，意为“在世界上；普天之下”，与本题语境不符。选项 B `on` (在表面上) 和 D `below` (在...下方) 都不符合习惯用法。","knowledge_expansion_md":"### 介词固定搭配拓展\n\n英语中有很多与自然环境相关的介词固定搭配，需要特别记忆：\n\n*   **`in the sun`**: 在阳光下，晒太阳。\n    *   例句：`Many people like to lie on the beach in the sun.` (很多人喜欢躺在沙滩上晒太阳。)\n*   **`in the shade`**: 在阴凉处。（与 `in the sun` 相对）\n    *   例句：`It's too hot. Let's sit in the shade of that tree.` (太热了，我们去那棵树的树荫下坐坐吧。)\n*   **`in the rain`**: 在雨中。\n    *   例句：`Don't play outside in the rain, you will get wet.` (别在雨里玩，你会淋湿的。)\n*   **`in the wind`**: 在风中。\n    *   例句：`The leaves are dancing in the wind.` (树叶在风中飞舞。)\n\n### 易混淆短语\n*   **`under the sun`**: 这是一个习语 (idiom)，意思是“世界上，天下”，指代一切事物。\n    *   例句：`We talked about everything under the sun.` (我们无所不谈。)\n    *   它并不是字面意义上的“在太阳底下”。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"中文里我们常说“在太阳底下”，你觉得它在英语里最可能对应哪个介词短语？","hint":"想象一下，你是被阳光整个“包裹”在里面，用哪个介词可以表达“在...里面”的感觉？","takeaway":"英语中用 `in the sun` 来表达“在阳光下”，这是一个固定搭配。"},{"question":"为什么不能用 `under the sun` 呢？它看起来也很像“在太阳底下”。","hint":"有些短语的意思不能只看字面。`under the sun` 是一个有特殊含义的习语，想想“普天之下”这个词。","takeaway":"`under the sun` 是一个习语，意思是“世界上的任何事物”，而不是指物理位置。"}]},{"title":"语境推断","steps":[{"question":"句子的后半部分 “It's bad for eyesight” (对视力不好) 给了我们什么线索？","hint":"在什么样的光线下看书会对视力不好？","takeaway":"这句话提示我们，看书的环境是光线过强，也就是在阳光直射下。"},{"question":"结合这个线索，哪个选项最能表达“在阳光直射下”这个场景？","hint":"哪个介词短语有“沐浴在阳光中”的含义？","takeaway":"固定搭配 `in the sun` 最能准确描述在阳光直射下的场景。"}]},{"title":"介词辨析","steps":[{"question":"我们来比较一下 `in`, `on`, `under` 这三个常用介词。它们表示的空间关系有什么不同？","hint":"想想 `in the box`, `on the table`, `under the bed`。","takeaway":"`in` 表示在内部，`on` 表示在表面，`under` 表示在正下方。"},{"question":"那么，对于“太阳”这个巨大的发光体，我们是“在它的内部范围里”看书，还是“在它的表面上”或“在它的正下方”看书？","hint":"阳光照射下来，形成一个光的范围。","takeaway":"我们是在阳光照射的范围内，所以用 `in` 来表达最合逻辑和习惯。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"It's hot in the room. Let's sleep with the windows _____.","options":{"A":"closing","B":"closed","C":"opened","D":"open"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查 “with” 复合结构。该结构为 “with + 宾语 + 宾语补足语”，用来表示一种伴随的状态。句意是“房间里很热，我们开着窗户睡觉吧”。这里的宾语是 `the windows`，横线处需要一个词来描述窗户的状态。`open` 是形容词，意为“开着的”，作宾补表示状态，符合句意。因此 `with the windows open` 意为“窗户开着”。选项 B `closed` (关着的) 与句意相反。选项 A `closing` (正在关闭) 和 C `opened` (被打开的动作) 均不符合此处对静态描述的要求。通常描述“门/窗开着”的状态时，使用形容词 `open`。","knowledge_expansion_md":"### 核心语法点：`with` 复合结构\n\n`with` 复合结构的形式是 `with + 名词/代词 + 补足语`，在句中常作状语，表示伴随情况、方式或原因。补足语可以是多种形式：\n\n1.  **形容词**：表示宾语的状态。\n    *   `He fell asleep with the door open.` (他睡着了，门还开着。)\n2.  **副词**：`She walked away with her head down.` (她低着头走开了。)\n3.  **介词短语**：`The teacher came in with a book in his hand.` (老师手里拿着一本书走了进来。)\n4.  **现在分词 (v-ing)**：表示宾语正在进行的主动动作。\n    *   `He stood there with his heart beating fast.` (他站在那里，心跳得很快。)\n5.  **过去分词 (v-ed)**：表示宾语承受的被动动作或已完成的状态。\n    *   `She listened with her eyes closed.` (她闭着眼睛听着。)\n\n### `open` vs. `opened` vs. `closed`\n\n*   `open` (adj.): 开着的 (状态)。`The supermarket is open.`\n*   `opened` (v-ed): 被打开 (动作)。`The door was opened by a stranger.` 在 `with` 结构中，`opened` 很少用来直接描述状态。\n*   `closed` (adj. / v-ed): 关着的 (状态)。`The bank is closed.` 也可以表示被动动作 `The window was closed.`","socratic_tracks":[{"title":"with 复合结构","steps":[{"question":"观察句子 \"Let's sleep with the windows ___.\"，你认为 \"with\" 在这里引导了一个什么样的结构？","hint":"注意 `with` 后面有名词 `the windows`，而横线上的词是用来修饰这个名词的。","takeaway":"这是一个 “with + 宾语 + 宾语补足语” 的复合结构，用来描述伴随的状态。"},{"question":"根据句意“房间里很热”，这个宾语补足语应该描述窗户处于一个什么样的状态？","hint":"热的时候，我们是希望开窗还是关窗睡觉？","takeaway":"为了让房间凉快，宾补应该描述窗户“开着”的状态。"}]},{"title":"状态描述词辨析","steps":[{"question":"选项 `open` 和 `opened` 都可以和“开”有关，但它们在用法上有什么区别？","hint":"一个是形容词，一个是动词的过去分词。一个多用于描述状态，一个多用于描述动作。","takeaway":"`open` 是形容词，主要用来描述“开着的”这种状态；`opened` 是过去分词，常表示“被打开”这个动作。"},{"question":"当我们要说“门是开着的”，我们通常说 \"The door is open.\" 还是 \"The door is opened.\"？","hint":"这是一个描述当前状态的句子。","takeaway":"描述“开着”的状态时，我们习惯用形容词 `open`。"},{"question":"那么，在 `with the windows ___` 这个结构中，要表达“窗户开着”的状态，应该用哪个词？","hint":"选择那个能作形容词、表示状态的词。","takeaway":"应该使用形容词 `open` 来描述窗户开着的状态。"}]},{"title":"分词用法辨析","steps":[{"question":"我们再看看选项 A `closing` 和 B `closed`。它们分别是现在分词和过去分词，表示的意义有什么不同？","hint":"现在分词表示主动、进行；过去分词表示被动、完成。","takeaway":"`closing` 表示“正在关闭”，是一个进行中的动作；`closed` 表示“已经关闭的”或“被关上的”，是一个完成的状态。"},{"question":"结合句意“房间里很热”，睡觉时窗户“正在关闭”(`closing`)或者“已经关闭”(`closed`)符合逻辑吗？","hint":"热的时候需要通风。","takeaway":"无论是“正在关闭”还是“已经关闭”都与“房间热”的语境相悖，不合逻辑。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"—What should I do if I want someone to do something for me?\n—You should _____ \"please\".","options":{"A":"talk","B":"speak","C":"say","D":"tell"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查四个表示“说”的近义动词的用法辨析。句意为“如果你想让别人帮你做事，你应该说‘请’”。横线后面是具体的、被引用的内容 `\"please\"`。动词 `say` 的基本用法就是 `say something`，后面直接跟说话的具体内容（单词、短语或句子），因此 `say \"please\"` 完全正确。`talk` 侧重交流，常与 `to/with/about` 连用。`speak` 侧重说话能力或语言，如 `speak English`。`tell` 侧重告诉，其结构通常是 `tell somebody something`（告诉某人某事），后面需要跟一个指代“人”的间接宾语。","knowledge_expansion_md":"### 四个“说”的用法总结\n\n这四个动词是初中英语的重点和难点，它们的区别主要体现在搭配和侧重点上：\n\n1.  **`say` (说内容)**\n    *   用法：`say sth.` / `say sth. to sb.` / `say that...`\n    *   特点：后面直接跟说话的**内容**。\n    *   例：`She said, \"I'm happy.\"` (她说：“我很高兴。”) `Don't forget to say 'thank you'.` (别忘了说“谢谢”。)\n\n2.  **`speak` (说语言/发言)**\n    *   用法：`speak a language` / `speak to sb.` / `speak at a meeting`\n    *   特点：侧重说话的**能力**、**方式**或在**正式场合发言**。\n    *   例：`He speaks three languages.` (他会说三种语言。) `May I speak to Mr. Wang?` (我可以和王先生通话吗？)\n\n3.  **`talk` (说谈话)**\n    *   用法：`talk to/with sb.` / `talk about sth.`\n    *   特点：侧重两人或多人之间的**交流、谈话**，通常是不及物动词。\n    *   例：`What are you talking about?` (你们在谈论什么？)\n\n4.  **`tell` (说故事/告诉)**\n    *   用法：`tell sb. sth.` / `tell sb. to do sth.` / `tell a story/lie/joke`\n    *   特点：侧重**传达信息、讲述**，后面常跟双宾语（人和事）。\n    *   例：`Can you tell me the time?` (你能告诉我时间吗？) `My mom told me to clean my room.` (我妈妈叫我去打扫房间。)","socratic_tracks":[{"title":"核心用法辨析","steps":[{"question":"这四个表示“说”的动词中，哪一个最常用来引出别人说的原话或者具体内容？","hint":"比如，转述别人说的话时，我们常用 \"He said, '...'\"。","takeaway":"`say` 的核心功能就是引出说话的具体内容。"},{"question":"那么，`tell` 的核心用法是什么？它后面通常跟什么？","hint":"想想“告诉我一个故事” (tell me a story) 这个短语。","takeaway":"`tell` 的核心用法是“告诉某人某事”，即 `tell sb sth`，后面常跟人和事作双宾语。"},{"question":"根据这个区别，本题中横线后面是具体内容 `\"please\"`，前面没有“某人”，应该用哪个动词？","hint":"这是一个 `verb + sth` 的结构。","takeaway":"后面直接跟说话内容，应该用 `say`。"}]},{"title":"宾语分析","steps":[{"question":"在句子 \"You should ___ 'please'\" 中，横线后引号里的 'please' 在句子中充当什么成分？","hint":"它是一个动词所作用的对象。","takeaway":"引号里的 `\"please\"` 是动词的直接宾语。"},{"question":"我们来试试把四个选项都放进去。`talk \"please\"`, `speak \"please\"`, `say \"please\"`, `tell \"please\"`，根据你学过的知识，哪个搭配是正确的？","hint":"`talk` 和 `speak` 后面不直接跟这种引用的单词；`tell` 后面要跟人。","takeaway":"只有 `say` 可以直接跟一个引用的单词作宾语，构成 `say \"please\"` 这种用法。"}]},{"title":"场景应用","steps":[{"question":"当老师教你一个新单词时，他会说：“跟我读/说这个词”。比如，\"Say 'apple'.\"。这里为什么用 `say`？","hint":"因为老师让你发出 'apple' 这个词的具体读音和内容。","takeaway":"当要求某人说出某个具体的词或短语时，我们使用 `say`。"},{"question":"回到题目，这里是建议别人在请求帮助时，要说出哪个礼貌用语？","hint":"引号里的词是什么？","takeaway":"题目建议别人说出 `please` 这个词。"},{"question":"那么，根据刚才的分析，要表达“说出‘请’这个词”，应该用哪个动词？","hint":"和 \"Say 'apple'\" 是完全一样的语法结构。","takeaway":"同样地，表达“说出‘请’”也应该用 `say`，即 `say \"please\"`。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—You can keep a goldfish as a pet. It is quiet ____ lovely.\n—That's right. It never barks _____ bites at anyone.","options":{"A":"and; or","B":"but; or","C":"and; and","D":"or; and"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查并列连词 `and`, `or`, `but` 的用法。\n- 第一个空，`quiet` (安静的) 和 `lovely` (可爱的) 都是描述金鱼的正面特征，两者是并列、递进的关系，因此使用 `and`，表示“又...又...”。\n- 第二个空，句子前面有否定词 `never` (从不)，构成否定句。在否定句中连接两个并列的动词时，通常使用 `or`，表示“（两者）都不”，即“既不...也不...”。\n- 综上所述，第一个空用 `and`，第二个空用 `or`。","knowledge_expansion_md":"### 并列连词 `and`, `but`, `or` 的用法辨析\n\n1.  **`and` (和，并且)**：用于连接词性相同、结构一致的词、短语或句子，表示并列、递进或顺承关系。\n    *   *He is tall and handsome.* (他既高又帅。)\n\n2.  **`but` (但是)**：表示转折或对比关系，前后内容通常相反或不同。\n    *   *The book is short, but it is interesting.* (这本书很短，但很有趣。)\n\n3.  **`or` (或者，否则)**：表示选择关系，意为“或者...或者...”。\n    *   *Would you like tea or coffee?* (你想喝茶还是咖啡？)\n\n#### **易错点：`or` 在否定句中的特殊用法**\n\n在否定句中，`or` 用于连接两个或多个并列成分，表示“（全部）都不”，相当于 `and ... not` 的概念。这是一个非常重要的考点。\n\n*   *He can't sing or dance.* (他既不会唱歌也不会跳舞。) = *He can't sing and he can't dance.*\n*   *I don't like apples or bananas.* (我不喜欢苹果，也不喜欢香蕉。)\n\n如果否定句中误用 `and`，如 *He can't sing and dance*，通常会被理解为“他不能同时又唱歌又跳舞”，但可能单独会其中一项，这与“两者都不会”的含义有很大区别。","socratic_tracks":[{"title":"并列关系连词 and","steps":[{"question":"“quiet”（安静的）和“lovely”（可爱的）这两个词都是在描述金鱼的什么特点？它们之间是矛盾的还是相似的？","hint":"想一想，一个东西可以同时既安静又可爱吗？","takeaway":"`and` 用于连接两个性质相似或并列的词语。"},{"question":"如果用 `but` (但是) 来连接，句子变成 “It is quiet but lovely”，听起来通顺吗？为什么？","hint":"`but` 通常用于表示转折，前后意思相反。安静和可爱并不矛盾。","takeaway":"`but` 用于连接有转折或对比关系的词语，此处不适用。"}]},{"title":"否定句中的 or","steps":[{"question":"“It never barks ... bites” 这句话因为有 `never`，所以是肯定句还是否定句？","hint":"`never` 的意思是“从不”，是一个否定词。","takeaway":"含有 `never`, `not` 等词的句子是否定句。"},{"question":"在否定句中，如果我们想表达“它既不会叫，也不会咬人”，应该用哪个词来连接 “barks” 和 “bites”？","hint":"回忆一下“我不喜欢苹果也不喜欢香蕉”的英文表达：I don't like apples ___ bananas.","takeaway":"在否定句中，`or` 用来连接并列成分，表示“两者都不”的含义。"}]},{"title":"逻辑关系辨析","steps":[{"question":"第一句话中，“安静”和“可爱”是金鱼的两个优点，它们是并列存在的。我们应该用什么连词来表示这种“又...又...”的关系？","hint":"就像说“他又高又帅” (He is tall and handsome)。","takeaway":"`and` 表示并列和递进关系。"},{"question":"第二句话中，金鱼“不会叫”和“不会咬人”是它不会做的两件事。在否定语境下，连接这两个行为的词是什么？","hint":"思考一下“非A非B”的表达方式，即“既不A也不B”。","takeaway":"否定句中用 `or` 表示“也不”的逻辑关系。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—Look, our Chinese teacher is coming _____ a book in his hand.\n—Oh, yes. Let's stop talking and prepare for his class.","options":{"A":"with","B":"by","C":"through","D":"over"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查介词的用法，特别是表示伴随状态的介词。\n- 句意为：“看，我们的语文老师手里拿着一本书走过来了。”\n- `with` 是一个介词，可以表示“带着”、“伴随着”或“身上有...”，用来描述某人或某物所处的状态或携带的物品。\n- `with a book in his hand` 是一个介词短语，在句中作伴随状语，修饰谓语动词 `is coming`，表示老师走过来时“手里拿着书”这个伴随的动作或状态。\n- 其他选项：`by` (通过某种方式/在旁边)、`through` (穿过)、`over` (在...上方) 均不符合句意。","knowledge_expansion_md":"### 介词 `with` 的核心用法\n\n介词 `with` 的用法非常灵活，其核心含义是“伴随”。\n\n1.  **表示伴随（和...一起）**：这是最基本的用法。\n    *   *She lives with her parents.* (她和父母住在一起。)\n\n2.  **表示拥有或携带（带着，身上有...）**：常用于描述人的外貌、特征或携带的物品。本题即为此用法。\n    *   *a girl with blue eyes* (一个蓝眼睛的女孩)\n    *   *He came in with a smile on his face.* (他微笑着走进来。)\n\n3.  **表示使用工具或方法（用...）**\n    *   *Please write with a pen, not a pencil.* (请用钢笔写，不要用铅笔。)\n\n4.  **`with` 复合结构作伴随状语**：这是 `with` 的一个高级用法，结构为 `with + 名词/代词 + 形容词/副词/介词短语/分词`，在句中说明主句动作发生时伴随的情况。\n    *   *The teacher entered the classroom, with a book in his hand.* (老师走进教室，手里拿着一本书。) (介词短语)\n    *   *He stood there with his eyes closed.* (他闭着眼睛站在那里。) (过去分词)","socratic_tracks":[{"title":"理解句意与场景","steps":[{"question":"这句话想描述一个什么样的画面？老师走过来的时候，他还有什么别的特征或状态？","hint":"注意后半句 `a book in his hand` (手里有本书)。","takeaway":"句子描述了老师走过来时，手里还拿着一本书的伴随状态。"},{"question":"在英语中，要表达“带着”某个东西或处于某种状态，最常用的介词是哪个？","hint":"比如，“一个戴着红帽子的女孩”是 `a girl ___ a red hat`。","takeaway":"`with` 是表达“带着”或“伴随”的核心介词。"}]},{"title":"介词功能排除","steps":[{"question":"我们能说 `coming by a book` 吗？`by` 通常表示什么意思？","hint":"想一想 `by bus` (乘公交车) 或者 `stand by the window` (站在窗边)。","takeaway":"`by` 常表示方式、途径或在旁边，与“手里拿着”的语境不符。"},{"question":"`coming through a book` (穿过一本书) 或者 `coming over a book` (越过一本书) 在这里讲得通吗？","hint":"想象一下这些动作，它们符合老师走过来的场景吗？","takeaway":"`through` 和 `over` 表示的是空间位置关系，与句意不符。"}]},{"title":"伴随状语结构","steps":[{"question":"短语 `a book in his hand` 和主句的动作 `is coming` 是什么关系？是同时发生的吗？","hint":"老师是一边走过来，一边手里拿着书的。","takeaway":"这个短语描述的是与主句动作同时发生的一种伴随情况。"},{"question":"这种“主语 + 动作 + with + 名词 + 状态描述”的结构，在语法上叫什么？","hint":"它用来补充说明主句动作发生时伴随的状态。","takeaway":"这是 `with` 引导的复合结构，在句中作伴随状语。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"—I'm going to the supermarket.\n—_____ I go with you?","options":{"A":"Must","B":"Can","C":"Need","D":"Should"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查情态动词的用法，需要根据对话语境选择最合适的词。\n- 第一人说：“我正要去超市。”\n- 第二人想和他一起去，这是一个请求。`Can I ...?` 是一个非常常用且礼貌的句型，用来请求对方的许可，意为“我能/可以...吗？”\n- “Can I go with you?” 意为“我能和你一起去吗？”，完全符合此处的对话语境。\n- `Must I...?` (我必须...吗？) 询问必要性，不符。\n- `Need I...?` (我有必要...吗？) 语气较正式，不常用。\n- `Should I...?` (我应该...吗？) 用于征求建议，而这里更侧重于请求许可。","knowledge_expansion_md":"### 请求许可的常见情态动词\n\n在英语中，请求别人允许自己做某事时，有几个常用的情态动词，它们的礼貌程度有所不同：\n\n1.  **`Can I...?`**\n    *   最常用，通用性强，适用于大多数口语和非正式场合。\n    *   *Can I use your pen?* (我能用一下你的钢笔吗？)\n\n2.  **`Could I...?`**\n    *   比 `Can I...?` 更加委婉、礼貌。\n    *   *Could I have a look at your newspaper?* (我可以看一下您的报纸吗？)\n\n3.  **`May I...?`**\n    *   最正式、最礼貌的表达，常用于对长辈、老师或陌生人等需要表示尊敬的场合。\n    *   *May I come in?* (我可以进来吗？)\n\n#### **易混情态动词辨析**\n\n*   **`Can` vs. `Should`**：`Can I...?` 是请求许可（permission），而 `Should I...?` 是征求建议（advice）。\n    *   *Can I go with you?* (我能和你去吗？—— 等待对方同意或拒绝)\n    *   *Should I go with you?* (我应该和你去吗？—— 等待对方给建议，比如“去吧，路上有个伴”或“别了，我很快就回来”)\n*   **`Must` vs. `Need`**：`Must I...?` 询问是否有强制性义务。`Need I...?` 询问是否有必要，语气比 `Must I...?` 弱。","socratic_tracks":[{"title":"分析对话意图","steps":[{"question":"当朋友说他要去超市，你想一起去时，你的目的是什么？是命令他？询问他？还是请求他？","hint":"你希望得到对方的同意。","takeaway":"说话者的意图是向对方提出一个礼貌的请求。"},{"question":"在英语中，哪个情态动词最常用来表达“我能...吗？”这种请求？","hint":"想一想在课堂上，你想借同桌的橡皮时会怎么说。","takeaway":"`Can I...?` 是请求许可最常用的句型。"}]},{"title":"情态动词含义辨析","steps":[{"question":"如果用 `Must`，句子 “Must I go with you?” 翻译成中文是什么意思？这符合说话人的意图吗？","hint":"“我必须和你一起去吗？”听起来像是被强迫，而不是自己想去。","takeaway":"`Must` 表示义务和必须，不符合主动请求的语境。"},{"question":"如果用 `Should`，句子 “Should I go with you?” 表达了什么意思？它和 `Can I...?` 的区别在哪里？","hint":"“我应该和你去吗？”是在询问对方的看法，征求建议。","takeaway":"`Should` 用于征求建议，而 `Can` 用于请求许可，侧重点不同。"}]},{"title":"功能句式归纳","steps":[{"question":"除了 `Can I...?`，你还知道哪些表示请求许可的说法？它们有什么不同？","hint":"试着用 `May` 或 `Could`，想一想它们的礼貌程度。","takeaway":"`May I...?` 和 `Could I...?` 也是请求许可的常用句式，且比 `Can I...?` 更为礼貌和正式。"},{"question":"在这个朋友间的轻松对话场景中，`Can`, `Could`, `May` 哪个最自然、最常用？","hint":"`May` 比较正式，`Could` 比 `Can` 更委婉一些。","takeaway":"在口语和非正式场合，`Can` 是请求许可最自然、最常见的选择。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"—_____ do you go to the library?\n—Twice a week.","options":{"A":"How long","B":"How often","C":"How much","D":"How many"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查特殊疑问词组的用法。\n- 对话的回答是 “Twice a week”，意为“一周两次”。这是一个明确表示动作发生频率的词组。\n- 题目要求我们选择一个用来提问“频率”的疑问词组。\n- `How often` 的意思正是“多久一次”，专门用来对频率进行提问。\n- 因此，问句 “How often do you go to the library?” (你多久去一次图书馆？) 与回答 “Twice a week.” 完美匹配。\n- `How long` (多久) 提问时间长度，回答如 `for two hours`。\n- `How much` (多少) 提问不可数名词数量或价格。\n- `How many` (多少) 提问可数名词数量。","knowledge_expansion_md":"### “How”开头的特殊疑问词组辨析\n\n以 `How` 开头的疑问词组非常丰富，是考试的重点，需要准确区分它们的用法。\n\n1.  **`How often` (多久一次)**：提问频率。\n    *   *—How often do you see your grandparents? —Once a month.* (—你多久看一次爷爷奶奶？—一个月一次。)\n\n2.  **`How long` (多久)**：提问时间段的长度。\n    *   *—How long did you wait for him? —For about an hour.* (—你等了他多久？—大约一个小时。)\n\n3.  **`How soon` (多久以后)**：提问“再过多久（会发生某事）”，常与将来时连用，回答常用 `in + 时间段`。\n    *   *—How soon will the bus come? —In five minutes.* (—公交车还有多久来？—五分钟后。)\n\n4.  **`How far` (多远)**：提问距离。\n    *   *—How far is your home from school? —About 2 kilometers.* (—你家离学校多远？—大约2公里。)\n\n5.  **`How much` (多少)**：提问价格或不可数名词的数量。\n    *   *How much is the ticket?* (票多少钱？)\n    *   *How much time do we have?* (我们有多少时间？)\n\n6.  **`How many` (多少)**：提问可数名词复数的数量。\n    *   *How many apples did you eat?* (你吃了多少个苹果？)","socratic_tracks":[{"title":"从回答反推问题","steps":[{"question":"回答 “Twice a week” (一周两次) 告诉了我们关于“去图书馆”这件事的什么信息？","hint":"是去了多长时间，还是去的次数？","takeaway":"回答是关于动作发生的频率或次数。"},{"question":"在英语中，专门用来提问“频率”或“多久一次”的疑问词组是什么？","hint":"这个词组的字面意思是“多经常”。","takeaway":"`How often` 是用来提问频率的固定搭配。"}]},{"title":"辨析“How”家族","steps":[{"question":"如果我想问“你在图书馆待了多久？”，应该用哪个疑问词组？","hint":"这个问题关心的是时间的长度，而不是次数。","takeaway":"`How long` 用来提问时间长度。"},{"question":"如果我想问“图书馆里有多少本书？”，应该用哪个疑问词组？","hint":"“书”是可数名词。","takeaway":"`How many` 用来提问可数名词的数量。"},{"question":"如果我想问“去图书馆要花多少钱？”，应该用哪个疑问词组？","hint":"这个问题关心的是价格。","takeaway":"`How much` 用来提问价格或不可数名词的数量。"}]},{"title":"频率的表达方式","steps":[{"question":"除了 “Twice a week”，你还能想到哪些可以回答 `How often` 问题的词或短语？","hint":"想一想表示“总是”、“通常”、“有时”、“从不”的词。","takeaway":"表示频率的词有 `always`, `usually`, `often`, `sometimes`, `never` 等频率副词，以及 `once/twice/three times a day` 等词组。"},{"question":"如果回答是 “For two hours” (持续了两小时)，那么提问的句子应该用哪个疑问词组开头？","hint":"回答的是一个时间段的长度。","takeaway":"回答是 `for + 时间段` 时，问句通常用 `How long`。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"—What's the date today?\n—It's _____.","options":{"A":"June second","B":"the June second","C":"June the second","D":"second June"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查日期的表达方式。在英语中，表达“几月几日”时，常用“月份+序数词”的结构。选项 A “June second” (六月二日) 是一个完全正确且非常普遍的说法，尤其是在美式口语中。选项 C “June the second” 也是正确的，但在日常对话中，序数词前的 “the” 常常被省略。选项 B 和 D 的语序或冠词用法是错误的。因此，A 是最简洁且常见正确的答案。","knowledge_expansion_md":"### 英语日期的表达法\n\n1.  **美式英语 (AmE) 常用格式:** `月份 + 序数词`\n    *   写法: June 2nd, 2024\n    *   读法: June second, twenty twenty-four.\n\n2.  **英式英语 (BrE) 常用格式:** `the + 序数词 + of + 月份`\n    *   写法: 2nd June, 2024\n    *   读法: the second of June, twenty twenty-four.\n\n3.  **通用/稍正式格式:** `月份 + the + 序数词`\n    *   读法: June the second.\n\n**易错点:**\n*   表示“日”必须使用序数词 (first, second, third, fourth...)，而不是基数词 (one, two, three, four...)。\n*   在“月份 + 序数词”结构中，口语里通常省略 “the”，但在 “the + 序数词 + of + 月份” 结构中，“the” 不可省略。","socratic_tracks":[{"title":"日期表达法","steps":[{"question":"英语中表达“几月几日”有哪几种常见顺序？","hint":"想想月份和代表“日”的序数词，哪个在前，哪个在后？","takeaway":"英语中表达日期主要有“月+日”和“日+月”两种顺序。"},{"question":"当我们用“月+日”的顺序时，这个“日”应该用什么类型的词？基数词还是序数词？","hint":"是 one, two, three... 还是 first, second, third...?","takeaway":"表达日期时，“日”必须使用序数词。"},{"question":"在“月份+序数词”的结构中，序数词前面是否必须加 \"the\"？","hint":"比较一下 \"June second\" 和 \"June the second\" 这两种说法的区别。","takeaway":"在“月份+序数词”结构中，冠词 \"the\" 常常在口语中被省略，两种形式都被接受，但省略的形式更常见。"}]},{"title":"序数词的用法","steps":[{"question":"看看选项中的 \"second\"，这个词是什么类型的词？","hint":"它是表示顺序的词。","takeaway":"\"second\" 是序数词，表示“第二”或“（每月的）第二天”。"},{"question":"序数词通常和哪个冠词一起使用来表示特指？","hint":"比如，“第一个男孩”怎么说？","takeaway":"序数词前通常要加定冠词 \"the\"。"},{"question":"为什么选项 A \"June second\" 没有 \"the\" 却是正确的？","hint":"考虑一下这是否是一个特殊的、约定俗成的用法。","takeaway":"在“月份+序数词”的日期表达中，\"the\" 习惯上可以省略，这是一种固定用法。"}]},{"title":"选项排除法","steps":[{"question":"我们先看选项 D \"second June\"。这种语序对吗？如果不对，正确的应该是什么？","hint":"试着用 \"of\" 来连接 \"second\" 和 \"June\"。","takeaway":"\"second June\" 语序错误，正确的表达是 \"the second of June\"。"},{"question":"再看选项 B \"the June second\"。定冠词 \"the\" 应该放在哪里？","hint":"\"the\" 是用来修饰序数词 \"second\" 的，还是月份 \"June\" 的？","takeaway":"定冠词 \"the\" 应该放在序数词 \"second\" 前，而不是月份 \"June\" 前，所以 B 错误。"},{"question":"现在剩下 A \"June second\" 和 C \"June the second\"。两者都是正确的说法，为什么我们通常会选择 A？","hint":"考虑在日常对话中，哪种说法更简洁、更常用。","takeaway":"在日常对话中，\"June second\" 是一个非常普遍且简洁的正确表达方式。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"—Is there _____ in the classroom?\n—No, there isn't.","options":{"A":"something","B":"anything","C":"nothing","D":"everything"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查不定代词的用法。句子 \"Is there _____ in the classroom?\" 是一个一般疑问句。根据语法规则，不定代词 \"anything\" 通常用于疑问句和否定句中，表示“任何东西”。而 \"something\" 通常用于肯定句中。\"nothing\" 本身带否定含义，用于肯定句式表达否定意义，不能用于此疑问句结构。\"everything\" 意为“每样东西”，语意不符。结合语境和回答 \"No, there isn't.\"，应选择 \"anything\"。","knowledge_expansion_md":"### 不定代词 `some-`, `any-`, `no-`, `every-` 的用法辨析\n\n1.  **`some-` 系列 (something, someone, somebody):** 通常用于**肯定句**。\n    *   例: `I have something for you.` (我有些东西给你。)\n\n2.  **`any-` 系列 (anything, anyone, anybody):** 通常用于**否定句**和**疑问句**。\n    *   例: `I don't have anything.` (我什么都没有。) `Do you have anything to say?` (你有什么话要说吗？)\n\n3.  **`no-` 系列 (nothing, no one, nobody):** 本身具有否定意义，用于**肯定句结构**中表达否定概念，避免双重否定。\n    *   例: `There is nothing in the box.` (盒子里什么也没有。) = `There isn't anything in the box.`\n\n4.  **`every-` 系列 (everything, everyone, everybody):** 表示整体概念，“每一……”，作主语时谓语动词用单数。\n    *   例: `Everything is ready.` (一切都准备好了。)\n\n**特殊情况:** 当疑问句表示**请求、建议**或**期待得到肯定回答**时，可以用 `some-` 系列。\n*   例: `Would you like something to eat?` (你希望对方接受，所以用 `something`。)","socratic_tracks":[{"title":"不定代词辨析","steps":[{"question":"这个句子 \"Is there _____ in the classroom?\" 是什么类型的句子？肯定句、否定句还是疑问句？","hint":"句首是 \"Is\"，句尾是问号。","takeaway":"这是一个一般疑问句。"},{"question":"在一般疑问句中，我们通常用 `some` 系列的词（如 something）还是 `any` 系列的词（如 anything）？","hint":"回想一下 \"Do you have any questions?\" 这句话。","takeaway":"在一般疑问句和否定句中，我们通常使用 `any` 系列的不定代词。"}]},{"title":"语境与逻辑","steps":[{"question":"看看对话的回答 \"No, there isn't.\" 这说明了什么？","hint":"这个回答是对问句的否定。","takeaway":"回答表明教室里是空的，什么也没有。"},{"question":"那么问句应该是在询问“教室里有‘任何’东西吗？”还是“教室里有‘某个’东西吗？”","hint":"哪种问法更符合得到“不，没有”这种回答的逻辑？","takeaway":"询问“有没有任何东西”是更符合逻辑的提问方式，因此用 `anything`。"},{"question":"为什么不能用 C 选项 \"nothing\"？\"nothing\" 也是“没有东西”的意思。","hint":"试着把 \"nothing\" 填进去读一下：\"Is there nothing in the classroom?\" 这句话是什么意思？它的回答会是 \"No, there isn't\" 吗？","takeaway":"\"Is there nothing...?\" 意为“难道什么都没有吗？”，是一个否定疑问句，与题干的回答不匹配。"}]},{"title":"`some` 和 `any` 的特殊用法","steps":[{"question":"我们学过 `some` 用于肯定句，`any` 用于否定和疑问句。这个规则是绝对的吗？","hint":"想一想你请别人喝东西时会怎么说？\"Would you like any drink?\" 还是 \"Would you like some drink?\"","takeaway":"这个规则不是绝对的，存在一些特殊情况。"},{"question":"在什么情况下，疑问句里会用 `something` 而不是 `anything`？","hint":"当你提问时，你心里是希望或猜测对方会给出肯定回答吗？","takeaway":"当我们提出请求、建议，或者期待得到肯定回答时，疑问句中也可以使用 `some` 系列的词。"},{"question":"那么，本题的 \"Is there _____ in the classroom?\" 属于我们刚刚讨论的特殊情况吗？","hint":"提问者是在提出建议，还是在单纯地询问信息？","takeaway":"本题是一个纯粹的信息询问，不属于建议或请求的特殊情况，因此应使用 `anything`。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—What's your father?\n—He is _____.","options":{"A":"a doctor","B":"tall and strong","C":"at home","D":"fine"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查询问职业的特殊疑问句及其回答。问句 \"What's your father?\" 是一个固定句型，用来询问“你父亲是做什么工作的？”。对应的回答应该是说明职业。选项 A \"a doctor\"（一名医生）是职业，符合题意。选项 B “高大强壮”是描述外貌，回答的是 \"What is your father like?\"；选项 C “在家”是描述地点，回答的是 \"Where is your father?\"；选项 D “很好”是描述状态，回答的是 \"How is your father?\"。","knowledge_expansion_md":"### 英语中不同功能问句的辨析\n\n1.  **询问职业:**\n    *   `What is sb.?` (e.g., What are you? I'm a student.)\n    *   `What does sb. do?` (e.g., What does your mother do? She's a teacher.)\n    *   `What is sb.'s job?` (e.g., What is his job? He is an engineer.)\n\n2.  **询问外貌、性格:**\n    *   `What is sb. like?` (某人怎么样？)\n    *   回答: `He is kind and humorous.` (他很友善且幽默。)\n\n3.  **询问健康、近况:**\n    *   `How is sb.?` (某人好吗？)\n    *   回答: `He is fine, thank you.` (他很好，谢谢。)\n\n4.  **询问地点:**\n    *   `Where is sb.?` (某人在哪里？)\n    *   回答: `He is at work.` (他在上班。)\n\n**注意:** 回答职业时，如果职业是可数名词单数，前面通常需要加不定冠词 `a` 或 `an`。","socratic_tracks":[{"title":"\"What is...?\" 句型辨析","steps":[{"question":"看到问句 \"What's your father?\"，你觉得它是在问你父亲的什么信息？是名字、年龄、还是别的？","hint":"试着对比一下 \"Who is he?\" 和 \"What is he?\"。","takeaway":"\"What is sb.?\" 是一个固定句型，用来询问某人的职业。"},{"question":"既然是问职业，那么四个选项中，哪一个是在描述职业？","hint":"医生、高大强壮、在家、很好，哪个是职业名称？","takeaway":"\"a doctor\" (一名医生) 是唯一表示职业的选项。"}]},{"title":"功能性问句区分","steps":[{"question":"如果我想知道你父亲的外貌特征，比如高矮胖瘦，我应该怎么用英语提问？","hint":"这个问题关注的是 \"like\" (像什么样)。","takeaway":"我应该问 \"What is your father like?\"。"},{"question":"如果我想关心一下你父亲的身体状况或近况，我应该怎么问？","hint":"这个问题关注的是 \"how\" (怎么样)。","takeaway":"我应该问 \"How is your father?\"。"},{"question":"那么，\"What's your father?\" 和上面这两个问题有什么根本区别？","hint":"思考 \"what\" 在这里问的是身份、本质，而不是状态或特征。","takeaway":"\"What's your father?\" 询问的是社会身份，即职业，而其他问题询问的是个人特征或状态。"}]},{"title":"冠词的正确使用","steps":[{"question":"看到正确答案是 \"He is a doctor.\"，为什么 \"doctor\" 前面要加一个 \"a\"？","hint":"\"doctor\" 是可数名词还是不可数名词？是单数还是复数？","takeaway":"\"doctor\" 是一个可数名词的单数形式。"},{"question":"当我们泛指一个可数名词单数时，名词前面需要加什么？","hint":"想想“一个苹果”怎么说。","takeaway":"泛指一个可数名词单数时，前面需要加不定冠词 \"a\" 或 \"an\"。"},{"question":"那么，在回答所有关于职业的问题时，是不是都需要注意这个规则？","hint":"比如回答 \"I am a student.\" \"She is an engineer.\"","takeaway":"是的，在用可数名词单数形式回答职业时，必须在前面加上不定冠词 \"a\" 或 \"an\"。"}]}]}}]},{"section_title":"II. 完形填空 (共 20 分)","section_instruction":"Sam had a dog. Its name was Ted. It was very helpful, but it ate too much. So he didn't like it. He wanted to __1__ it. He __2__ Ted and put it in a small boat. He rowed the boat to the __3__ of a big river. Just as he __4__ the poor animal into the river, the boat began to go down. __5__ the man and Ted __6__ into the river.\nTed was able to swim, __7__ Sam couldn't. The dog hit the rope(绳子) and broke(破坏) it. It tried its best to swim to __8__ Sam. The man was saved, so he was very thankful for the dog and he didn't want to kill the dog __9__. From then on, he gave the dog as __10__ as it wanted.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"1. (根据题意填空)","options":{"A":"sell","B":"buy","C":"beat","D":"kill"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词词义辨析。根据上文 “So he didn't like it.” (所以他不喜欢它) 以及后文他将狗带到河中央的行为，可以推断出他想摆脱这只狗。在四个选项中，D “kill” (杀死) 最能表达这种极端的意图。选项 A “sell” (卖掉) 也是一种处理方式，但不如 “kill” 更符合后续在河中丢弃这一危险行为的逻辑。B “buy” (买) 与文意相反。C “beat” (打) 只是虐待，而 Sam 的计划是彻底让狗消失。因此，D 是最符合上下文逻辑的答案。","knowledge_expansion_md":"### 动词词义与语境推断\n\n在完形填空中，动词的选择不仅要看词义，更要看是否符合人物的动机和故事的发展逻辑。\n\n1.  **`kill`**: 意为“杀死”，表示终结生命，是一个含义非常强烈的词。在故事中，当主人公采取极端行动时（如带到河中央），这个词往往是符合逻辑的选择。\n\n2.  **`sell`**: 意为“卖掉”。虽然也是一种“摆脱”的方式，但它是一个交易行为，与后文在河里丢弃的暴力行为在情感和逻辑上不完全一致。\n\n3.  **`beat`**: 意为“打，敲打”。这是一种虐待行为，但并不直接等同于“除掉”或“使其消失”的计划。\n\n4.  **`buy`**: 意为“买”，与上下文“不喜欢，想摆脱”的逻辑完全相反。\n\n**解题技巧**：做完形填空时，要像侦探一样，根据上文的“因”（如 “he didn't like it”）和下文的“行”（如 “rowed the boat to the middle of a big river”），来推断中间缺失的“意图”。","socratic_tracks":[{"title":"人物动机分析","steps":[{"question":"根据文章第一段，Sam 为什么不喜欢他的狗 Ted？","hint":"文章说 “it ate too much”。","takeaway":"Sam 不喜欢狗是因为它吃得太多了。"},{"question":"当一个人非常不喜欢一个宠物，并想摆脱它时，可能会有哪些想法？","hint":"可以送人、卖掉，或者采取更极端的手段。","takeaway":"处理不想要的宠物有多种方式，从温和到极端。"},{"question":"结合后文 Sam 把狗带到河中央的行为，你认为他的意图是什么？是想卖掉它，还是想更彻底地解决问题？","hint":"在河中央丢弃是一个非常危险和决绝的行为。","takeaway":"Sam 的行为表明他的意图非常极端，因此 “kill” (杀死) 是最符合这种意图的动词。"}]},{"title":"动词词义辨析","steps":[{"question":"请解释 `kill`, `sell`, `beat`, `buy` 四个词的基本意思。","hint":"思考它们分别描述了什么行为。","takeaway":"`kill` 是杀死，`sell` 是卖，`beat` 是打，`buy` 是买。"},{"question":"为什么 `buy` 和 `beat` 在这里明显不合适？","hint":"Sam 不喜欢狗，所以不会买它。打它和想把它彻底弄走是两回事。","takeaway":"`buy` 与动机相反，`beat` 不符合“彻底摆脱”的计划。"},{"question":"在 `sell` 和 `kill` 之间，为什么 `kill` 更符合故事的逻辑走向？","hint":"考虑一下“在河中央丢弃”这个行为的性质。","takeaway":"“在河中央丢弃”是一个致命的行为，直接指向 “kill” 的意图，而不是 “sell” 的交易行为。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"2. (根据题意填空)","options":{"A":"tied","B":"pulled","C":"pushed","D":"closed"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析。根据上下文，Sam 准备把狗 Ted 放到船里带走处理掉。为了在船上能控制住狗，防止它挣扎或逃跑，Sam 很有可能先把它“绑起来”。选项 A “tied” (绑，系) 最符合这一逻辑。选项 B “pulled” (拉)，C “pushed” (推) 描述的是移动的动作，但不如“绑起来”更能体现出控制和约束的意图。选项 D “closed” (关闭) 词义不符。因此，A 是最佳答案。","knowledge_expansion_md":"### 动词词义辨析与时态\n\n1.  **词义辨析**：\n    *   `tie`: 用绳、带等将物体系、拴、捆、扎在一起。例如：`tie your shoelaces` (系好你的鞋带)。\n    *   `pull`: 向自己的方向用力拉。例如：`pull the door open` (把门拉开)。\n    *   `push`: 向远离自己的方向用力推。例如：`push the button` (按按钮)。\n    *   `close`: 关闭（门、窗、书本等）。\n2.  **动词时态**：完形填空题中，动词的时态需要与上下文保持一致。本文是记叙文，讲述过去发生的事情，所以主要使用一般过去时。`tie` 的过去式是 `tied`。\n3.  **常用搭配**：`tie sth to sth` (把某物系在另一物上) 是一个非常常见的搭配，例如本题中的 `tied his own small boat to a post`。","socratic_tracks":[{"title":"动作逻辑推理","steps":[{"question":"Sam 要把狗带到船上，他的目的是什么？","hint":"回顾第一空，他想除掉这只狗。","takeaway":"Sam 的目的不友好，他需要完全控制住这只狗。"},{"question":"为了在船上控制住一只狗，最有效、最直接的动作是什么？","hint":"想一想绳子可以用来做什么。","takeaway":"用绳子把狗“绑起来”（tie）是控制它的有效方法。"},{"question":"为什么 `pull` (拉) 或 `push` (推) 不如 `tie` (绑) 好？","hint":"拉和推只是让狗移动，但狗仍然可以自由活动和反抗。","takeaway":"`pull` 和 `push` 不包含“约束”或“限制”的含义，而 `tie` 恰恰是这个意思，最符合 Sam 的目的。"}]},{"title":"动词时态与词义","steps":[{"question":"故事发生在过去，所以动词应该用什么时态？","hint":"注意文中其他动词，如 `had`, `was`, `wanted`。","takeaway":"故事使用一般过去时叙述，所以动词要用过去式。"},{"question":"这四个选项 `tied`, `pulled`, `pushed`, `closed` 都是过去式。请说出它们的原形和意思。","hint":"它们的原形分别是 `tie`, `pull`, `push`, `close`。","takeaway":"`tie` (绑), `pull` (拉), `push` (推), `close` (关闭)。理解了原形词义，才能在上下文中做出正确判断。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"3. (根据题意填空)","options":{"A":"front","B":"foot","C":"side","D":"middle"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查方位名词辨析。根据上下文，Sam 的目的是要丢弃他的狗。他划船到了一条大河里。为了确保狗无法游回岸边，他最可能去的地方是河的“中央”。选项 D “middle” (中间，中央) 最符合 Sam 的意图。划到河边 (side) 或河的前端 (front) 再扔，狗很容易就能游上岸。选项 B “foot” (底部，山脚) 不用于形容河流。因此，D 是最佳答案。","knowledge_expansion_md":"### 方位名词的用法\n\n1.  **基本方位词**：`front` (前面), `back` (后面), `side` (侧面), `top` (顶部), `bottom` (底部)。\n2.  **`foot` vs. `bottom`**：\n    *   `foot`: 通常指某物的下端或支撑部分，常用于山、楼梯、床等。例如：`at the foot of the mountain` (在山脚下)，`at the foot of the bed` (在床尾)。\n    *   `bottom`: 通常指容器或空间的最低部分。例如：`at the bottom of the sea` (在海底)，`at the bottom of the box` (在盒子底部)。船没有 `foot`。\n3.  **`middle` 的用法**：`in the middle of sth` 表示“在……的中间”，指被环绕的中心位置，通常无法从外部直接“到达”。例如：`in the middle of the room` (在房间中央)。\n4.  **船的部位**：船头叫 `bow`，船尾叫 `stern`。","socratic_tracks":[{"title":"场景与动机推理","steps":[{"question":"Sam 划船到河里是为了做什么？","hint":"他的计划是让狗消失。","takeaway":"Sam 的目的是要丢弃狗，并且不让它回来。"},{"question":"如果你想在河里丢弃一样东西，让它很难被找回或回到岸边，你会选择河的哪个位置？河边、河中央还是其他地方？","hint":"哪个位置离岸最远？","takeaway":"河中央 (the middle of the river) 是离两岸最远的地方，最适合执行这个计划。"},{"question":"为什么不能选 `side` (边上)？","hint":"如果 Sam 在河边就把狗扔下去，会发生什么？","takeaway":"在河边，狗可以轻易地游上岸，这与 Sam 的目的相悖。"}]},{"title":"名词词义辨析","steps":[{"question":"请解释 `front`, `foot`, `side`, `middle` 这四个词作为方位名词时的意思。","hint":"`front`是前面，`side`是旁边，`middle`是中间。`foot`呢？","takeaway":"`front` (前面), `side` (旁边), `middle` (中间), `foot` (底部，山脚，床脚等)。"},{"question":"为什么 `foot` 这个词不能用来描述河流？","hint":"我们常说 `at the foot of the mountain` (在山脚下)，但有 `at the foot of the river` 这种说法吗？","takeaway":"`foot` 通常指物体的支撑部分或下端，不适用于河流。这是一个词语搭配错误。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"4. (根据题意填空)","options":{"A":"threw","B":"carried","C":"sent","D":"brought"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析。根据上下文 “Just as he __4__ the poor animal into the river...” (就在他把这只可怜的动物……进河里的时候)，这里需要一个表示“扔”或“丢”的动作。选项 A “threw” (扔，其原形为 throw) 完美地描述了这个动作。选项 B “carried” (搬运)，C “sent” (送)，D “brought” (带来) 均不符合将动物丢入河中的具体动作描述。因此，A 是正确答案。","knowledge_expansion_md":"### `bring` vs. `take` 的区别\n\n这是一个非常重要且常见的易错点。区分的关键在于动作的方向性：\n\n1.  **`bring` (带来)**: 表示将某人或某物从别处移动到**说话者所在**或**叙事中心点**的位置。方向是“来”。\n    *   `Bring me that book.` (把那本书拿给我。)\n    *   `She brought her friend to the party.` (她把朋友带到了派对上。叙事中心是派对)\n\n2.  **`take` (带走)**: 表示将某人或某物从**说话者所在**或**叙事中心点**移动到别处。方向是“去”。\n    *   `Please take these files to the manager's office.` (请把这些文件带到经理办公室去。)\n    *   `Don't forget to take your umbrella.` (别忘了带伞。指从家里带出去)\n\n在本题中，岸边是安全的终点，是叙事的回归点，所以用 `brought ... back to the bank`。","socratic_tracks":[{"title":"动作与介词搭配","steps":[{"question":"这个空后面的介词短语是什么？","hint":"是 `into the river`。","takeaway":"`into the river` 表示“进入河里”，前面的动词需要能与这个方向性的动作搭配。"},{"question":"在 `threw`, `carried`, `sent`, `brought` 中，哪个动词最常与 `into` 搭配来表示“丢进去”的动作？","hint":"想象一下扔一个球到水里。","takeaway":"`throw sth into ...` 是一个非常常见的搭配，意为“把某物扔进……”。"},{"question":"为什么 `brought` (带来) 在这里是错误的？","hint":"`brought` 的方向是“带来”，而 Sam 的动作是“丢出去”。","takeaway":"`brought` 的动作方向与语境完全相反。"}]},{"title":"动词词义辨析","steps":[{"question":"请区分 `threw` (扔) 和 `carried` (搬运) 的意思。","hint":"一个强调抛掷的动作，一个强调支撑重量的移动。","takeaway":"`threw` 是一个瞬间的抛掷动作，而 `carried` 是一个持续的搬运过程。在“丢进河里”的瞬间，`threw` 更准确。"},{"question":"`sent` (送) 通常用在什么情境下？","hint":"比如寄信、派人出差等。","takeaway":"`sent` 含有“派遣、发送”的意思，用在动物身上非常奇怪，不符合语境。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"5. (根据题意填空)","options":{"A":"Neither","B":"Nor","C":"Each","D":"Both"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查不定代词的用法。根据上下文，船下沉了 (“the boat began to go down”)，这导致船上的人（the man）和狗（Ted）都掉进了河里。这里需要一个词来指代“两者都”。选项 D “Both” (两者都) 符合此意，后面常跟复数动词。这句话的完整结构是 “Both the man and Ted fell into the river.”。选项 A “Neither” (两者都不)，与事实相反。选项 C “Each” (每个) 强调整体中的个体，不符合此处语境。选项 B “Nor” 是连词，用法不符。因此，D 是正确答案。","knowledge_expansion_md":"### 表示“两者”或“多个”的代词辨析\n\n1.  **`Both`**: 指“两者都”，作主语时，谓语动词用复数。\n    *   `Both (of) the boys are my friends.`\n    *   `Both he and she were happy.`\n\n2.  **`Neither`**: 指“两者都不”，是 `not either` 的意思。作主语时，谓语动词理论上用单数，但在口语中也常用复数。\n    *   `Neither of them is/are ready.` (他们俩都没准备好。)\n    *   `Neither the man nor the girl was hurt.`\n\n3.  **`Either`**: 指“两者中任意一个”。作主语时，谓语动词用单数。\n    *   `Either of the books is fine.` (两本书哪本都行。)\n\n4.  **`Each`**: 指“（两个或两个以上中的）每一个”，强调个体。作主语时，谓语动词用单数。\n    *   `Each student has a book.`\n\n5.  **`All`**: 指“（三个或三个以上）所有”，作主语时，谓语动词用复数。\n    *   `All the students are here.`","socratic_tracks":[{"title":"不定代词的指代对象","steps":[{"question":"这个句子描述的对象是谁和谁？","hint":"回顾一下故事，船上只有 Sam 和他的狗 Ted。","takeaway":"描述的对象是“the man”和“Ted”，一共是两个。"},{"question":"在 `Both`, `Neither`, `Either` 中，哪一个词表示“两个人/物都...”？","hint":"`Neither` 是否定，`Either` 是二选一。","takeaway":"表示“两者都”的肯定含义的词是 `Both`。"}]},{"title":"逻辑关系判断","steps":[{"question":"根据前一句 “the boat began to go down” (船开始下沉)，我们可以推断出人和狗的遭遇吗？","hint":"船沉了，船上的人和动物会怎么样？","takeaway":"合乎逻辑的推断是，他们都掉进了水里。"},{"question":"为什么不能选 `Neither`？","hint":"`Neither` 这个词本身是什么含义？是肯定还是否定？","takeaway":"`Neither` 意为“两者都不”，是一个否定词，与“都掉进水里”的逻辑相矛盾。"}]},{"title":"Each vs. Both 的区别","steps":[{"question":"`Each` 和 `Both` 都可以指代多者，但用法上有什么区别？","hint":"`Both` 强调整体性，`Each` 强调个体性。`Both` 后跟复数动词，`Each` 后跟单数动词。","takeaway":"`Both` 强调整体（“两个一起都”），而 `Each` 强调个体（“每一个都”），且语法结构不同。"},{"question":"如果句子是 `___ of them was given a life jacket.`，应该填 `Each` 还是 `Both`？","hint":"注意动词 `was` 是单数形式。","takeaway":"`Each` 作主语时谓语动词用单数，而 `Both` 作主语时谓语动词用复数，所以这里应该填 `Each`。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"6. (根据题意填空)","options":{"A":"fell","B":"swam","C":"lost","D":"jumped"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析。根据上下文推断，此处描述的是一个意外落水的场景。选项 A `fell` 意为“掉落”，符合意外滑倒而掉入水中的语境。选项 B `swam` 意为“游泳”，与落水的紧急情况不符。选项 C `lost` 意为“丢失，迷路”，词义不符。选项 D `jumped` 意为“跳”，通常指主观、有意识的动作，与意外感相悖。因此，选择 `fell` 最能准确描述当时的情景。","knowledge_expansion_md":"### 动词过去式及词义辨析\n\n1.  **不规则动词过去式**：本题中的 `fell` (fall), `swam` (swim), `lost` (lose) 都是不规则动词的过去式，需要特别记忆。`jump` 是规则动词，过去式为 `jumped`。\n2.  **`fall` vs. `jump`**：\n    *   `fall`: 通常指无意识、非自愿的下落，如 `fall down` (摔倒), `fall off a bike` (从自行车上摔下来)。\n    *   `jump`: 通常指有意识、主动的跳跃动作，如 `jump into the river` (跳进河里)。\n3.  **固定搭配**：`fall into...` 意为“掉进……里”，是一个常见的搭配。","socratic_tracks":[{"title":"动词词义辨析","steps":[{"question":"想象一下，如果有人不小心滑倒掉进了河里，用哪个词来描述“掉进去”这个动作最贴切？","hint":"这个动作是主动的还是被动的？是故意的还是意外的？","takeaway":"`fall` 这个词强调了非自愿或意外的下落动作。"},{"question":"为什么 `jumped`（跳）在这里不合适？它和 `fell`（掉落）有什么核心区别？","hint":"想想你跳高和你不小心摔倒，这两个动作的发出者意图有什么不同？","takeaway":"`jump` 强调主观意愿，而 `fall` 强调客观发生的意外。"}]},{"title":"不规则动词过去式","steps":[{"question":"这四个选项都是动词的过去式，你知道它们的原形分别是什么吗？","hint":"例如，`went` 的原形是 `go`。尝试回忆一下 `fell`, `swam`, `lost`, `jumped` 的原形。","takeaway":"四个选项的原形分别是 `fall`, `swim`, `lose`, `jump`。"},{"question":"在这些动词中，哪个是规则动词，哪个是不规则动词？你是怎么判断的？","hint":"过去式以 `-ed` 结尾的通常是规则动词。","takeaway":"掌握常见不规则动词的过去式（如 fall-fell, swim-swam）是完形填空和写作的基础。"}]},{"title":"上下文逻辑推断","steps":[{"question":"完形填空需要根据上下文来选择。虽然我们没看到全文，但可以推测一个“落水”的场景。在这个场景里，是“意外落水”的故事更常见，还是“主动跳水”？","hint":"故事往往需要一些波折和冲突，比如“意外”的发生。","takeaway":"通过对故事情节的合理推断，可以帮助我们锁定最符合逻辑的选项。"},{"question":"如果前文是“He saw the fish in the river and excitedly ___ in.”（他看到河里的鱼，兴奋地___进去了），那么这里填 `jumped` 合适吗？为什么？","hint":"“兴奋地”这个词表明了人物的情绪和意图。","takeaway":"上下文中的形容词或副词（如 excitedly）是判断人物行为动机、选择正确动词的重要线索。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"7. 但是","options":{"A":"because","B":"but","C":"so","D":"when"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查并列连词的用法。根据上下文，空格前的句子“Ted was able to swim”（泰德会游泳）和空格后的句子“Sam couldn't”（萨姆不会）表达的是两种相反的情况，构成了转折关系。选项 B `but` 意为“但是”，用于连接两个表示转折或对比的句子，符合句意。选项 A `because` 表原因，C `so` 表结果，D `when` 表时间，均不符合此处的逻辑关系。因此，正确答案是 `but`。","knowledge_expansion_md":"### 并列连词的用法\n\n1.  **并列连词**: 用于连接语法地位相同的词、短语或句子。常见的并列连词有 `and` (和), `but` (但是), `or` (或者), `so` (所以)。\n2.  **`but` 的用法**: 表示转折或对比关系。连接的两个部分在意义上是相反或相对的。例：`He is old, but he is very healthy.` (他年纪大了，但是身体很健康。)\n3.  **`so` 的用法**: 表示因果关系中的“结果”。前面的句子是原因，后面的句子是结果。例：`It was raining, so I took an umbrella.` (天在下雨，所以我带了把伞。)","socratic_tracks":[{"title":"逻辑关系判断","steps":[{"question":"“Ted was able to swim”(泰德会游泳) 和 “Sam couldn't”(萨姆不会) 这两件事之间是什么关系？是因果、结果还是转折？","hint":"一个会，一个不会，这是不是一种对比或相反的情况？","takeaway":"分析句子间的逻辑关系是选择连词的关键。这里是转折/对比关系。"},{"question":"在 `because`, `but`, `so`, `when` 这四个词中，哪一个词是用来表达转折或对比关系的？","hint":"想一想“但是”这个词在中文里的作用。","takeaway":"`but` 用于表达转折或对比关系。"}]},{"title":"连词词义辨析","steps":[{"question":"我们来确认一下这四个连词的意思：`because`, `but`, `so`, `when`。","hint":"because - 因为, but - 但是, so - 所以, when - 当……时候。","takeaway":"掌握常用连词的基本含义是解题基础。"},{"question":"把 `but` 填进去读一下：“泰德会游泳，但是萨姆不会。” 这句话通顺吗？","hint":"非常通顺，完全符合逻辑。","takeaway":"将选项代入原句验证是检查答案的有效方法。"},{"question":"再试试 `because` 和 `so`，它们符合句意吗？","hint":"“泰德会游泳，因为萨姆不会”？“泰德会游泳，所以萨姆不会”？这两种说法都不合逻辑。","takeaway":"通过排除法可以快速剔除错误选项。"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"8. 帮助","options":{"A":"kill","B":"help","C":"meet","D":"hit"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在特定语境中动词的选择。根据上文，Sam 掉进河里并且不会游泳，处于危险之中。他的狗 Ted 会游泳，于是游向他。在这种情况下，狗的行为应该是救助主人。选项 B `help` 意为“帮助”，符合故事情节的发展。选项 A `kill` (杀死) 和 D `hit` (打) 与狗救主人的行为完全相反。选项 C `meet` (遇见) 只是一个中性的动作，不能体现出救助的意图。因此，`help` 是最佳选择。","knowledge_expansion_md":"### 动词词义与语境情感\n\n1.  **根据上下文情感基调选择词语**：完形填空短文通常有明确的情感基调（积极、消极、客观等）。本文很可能是一个宣扬善良、勇敢的积极故事，因此在选择动词时，应优先考虑符合这种情感色彩的词语。\n2.  **`help` 的用法**：\n    *   `help sb. (to) do sth.`：帮助某人做某事。`to` 可以省略。例：`He helped the old man (to) cross the road.`\n    *   `help sb. with sth.`：在某方面帮助某人。例：`Can you help me with my English?`\n3.  **近义词辨析**：\n    *   `help`: 最普通的用词，指“帮助”。\n    *   `assist`: 较正式的用词，指“协助，辅助”。\n    *   `save`: 指“拯救，挽救”，通常用于危急关头，使其脱离危险或死亡。\n    *   `rescue`: 词义与 `save` 相近，也指“营救，救援”，常指从紧急的、危险的困境中救出。","socratic_tracks":[{"title":"情感与逻辑判断","steps":[{"question":"在主人 Sam 掉进河里有危险时，你觉得他的狗 Ted 最可能会做什么？","hint":"想一想故事里，狗通常是人类什么样的朋友？","takeaway":"故事中的角色行为通常符合其角色设定和故事的整体价值观。狗救主人是常见的情节。"},{"question":"四个选项 `kill`, `help`, `meet`, `hit`，哪个词最能体现狗对主人的“忠诚”和“帮助”？","hint":"分析每个词的正面或负面含义。","takeaway":"完形填空不仅考查词汇量，也考查基于常识和情感逻辑的判断能力。"}]},{"title":"动词词义辨析","steps":[{"question":"请分别解释 `kill`, `help`, `meet`, `hit` 这四个词的中文意思。","hint":"即使是最简单的词，也要确保理解其准确含义。","takeaway":"准确理解选项中每个单词的核心词义，是做出正确选择的第一步。"},{"question":"在“狗尽力游去___它的主人”这个句子里，为什么 `meet` (遇见) 不如 `help` (帮助) 好？","hint":"“遇见”只是一个事实，而“帮助”是一个带有目的性的行动。哪个更能推动故事情节发展？","takeaway":"在紧急情况下，需要选择一个表示“行动”而非仅仅“状态”的动词。"}]},{"title":"故事线索预测","steps":[{"question":"故事的前文设置了一个“问题”：主人 Sam 掉进水里，有危险。那么，故事接下来最可能的发展方向是什么？","hint":"一般故事的结构是：设置问题 -> 解决问题。","takeaway":"根据“冲突-发展-解决”的故事模型，可以预测接下来的情节走向是“解决问题”。"},{"question":"狗 Ted 的行为，是为了让问题被解决，还是让问题更严重？","hint":"从狗“tried its best”（尽力）这个短语可以看出它的意图是积极的。","takeaway":"预测角色的行为导向（解决问题），就能锁定代表该导向的动词（如 `help`, `save`）。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"9. 不再","options":{"A":"any more","B":"any more","C":"no longer","D":"not more"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查副词词组的辨析。句意为“他不想再杀死这只狗了”。表示“不再”的常用表达有 `no longer` 和 `not ... any more`。`not ... any more` 用于否定句中，`any more` 置于句末，句中已有否定词 `not` (在此处为 `didn't`)。本句结构为 `he didn't want to kill the dog ___`，前面已有否定词 `didn't`，因此句末应使用 `any more`。选项 A/B `any more` 符合语法和句意。`no longer` 本身含有否定意义，通常与肯定动词连用，放在句中，例如 `He no longer wanted to kill the dog.`，不能与 `didn't` 同时使用。选项 D `not more` 意为“不多于”，不符合句意。因此，正确答案是 `any more`。","knowledge_expansion_md":"### `no longer` vs. `not ... any more`\n\n这两个词组都意为“不再”，表示时间上的终止，但在用法和位置上有所区别。\n\n1.  **`no longer`**:\n    *   是一个副词词组，语气较为正式。\n    *   **位置**：通常位于句中。在 be 动词之后；在行为动词之前；在第一个助动词之后。\n    *   例：\n        *   `She is no longer a student.` (她不再是学生了。)\n        *   `He no longer works here.` (他不再在这里工作了。)\n        *   `I can no longer wait for him.` (我不能再等他了。)\n\n2.  **`not ... any more`**:\n    *   语气较为口语化。\n    *   **位置**：`not` 用来否定谓语动词，而 `any more` 通常放在句子的末尾。\n    *   例：\n        *   `She isn't a student any more.`\n        *   `He doesn't work here any more.`\n        *   `I can't wait for him any more.`\n\n**易错点**：不能将 `no longer` 和 `not` 连用，因为这会造成双重否定。错误：`He does not no longer live here.`","socratic_tracks":[{"title":"`no longer` 与 `not...any more`","steps":[{"question":"在英语中，如果我们想表达“不再做某事了”，通常有哪两种说法？","hint":"一个是以 `no` 开头，一个是以 `not` 开头。","takeaway":"表示“不再”的两种核心结构是 `no longer` 和 `not ... any more`。"},{"question":"这两种说法在使用上有什么关键区别？它们和动词的肯定/否定形式如何搭配？","hint":"`no longer` 本身带否定，`any more` 不带。","takeaway":"`no longer` 与肯定动词连用；`not ... any more` 与否定动词连用。"},{"question":"观察本题的句子 `...he didn't want to kill the dog ___`。谓语动词 `want` 是肯定形式还是否定形式？","hint":"注意 `didn't`。","takeaway":"句中已有否定词 `didn't`，所以谓语是否定的。"},{"question":"既然已经是 `not ...` 的结构，那么表示“不再”应该在句末用哪个词？","hint":"`not ... any more` 是一个固定搭配。","takeaway":"应该用 `any more` 来构成 `not ... any more` 的结构。"}]},{"title":"排除法应用","steps":[{"question":"为什么不能选 `no longer`？把它放进去试试看：`he didn't want to kill the dog no longer.`","hint":"`didn't` 和 `no longer` 都是否定意义，放在一起会怎么样？","takeaway":"双重否定在英语中通常是错误的用法，且不符合句意。"},{"question":"选项 A 和 B 都是 `any more`，它们都符合要求。选项 D `not more` 是什么意思？","hint":"`more` 的意思是“更多”。`not more` 就是“不多于...”。比如 `not more than 5 people`。","takeaway":"`not more` 表示数量上的“不多于”，与 `no longer` / `not ... any more` 表示时间上的“不再”是完全不同的概念。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"10. 许多","options":{"A":"little","B":"much","C":"many","D":"much"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查 `as ... as` 结构中数量词的用法。句意为“从那时起，他给这只狗吃它想吃的那么多东西”。这里暗指给狗食物（food），food 是不可数名词。`as much as ...` 意为“和……一样多”，用来修饰不可数名词。`as many as ...` 用来修饰可数名词。选项 B/D `much` 用于修饰不可数名词，符合句意。选项 C `many` 修饰可数名词，不符。选项 A `little` 意为“很少”，放在 `as ... as` 结构中（as little as）表示“只……那么少”，与故事结尾主人感激狗、不再吝啬的情感不符。因此，正确答案是 `much`。","knowledge_expansion_md":"本题考查基础的数量词用法，这是小升初阶段的重点和易错点。\n\n1.  **修饰不可数名词**: \n    *   `much` (许多，大量)，常用于否定句和疑问句，如：`I don't have much time.`\n    *   `little` (很少，几乎没有)，表否定意味，如：`There is little water left.`\n    *   `a little` (有一点)，表肯定意味，如：`I have a little money.`\n\n2.  **修饰可数名词复数**:\n    *   `many` (许多)，如：`There are many students in the classroom.`\n    *   `few` (很少，几乎没有)，表否定意味，如：`He has few friends.`\n    *   `a few` (有几个)，表肯定意味，如：`She bought a few apples.`\n\n3.  **通用修饰词 (可数与不可数均可)**:\n    *   `a lot of / lots of` (许多)，常用于肯定句，比 `much/many` 更口语化。\n    *   `some` (一些)，用于肯定句和表请求的疑问句。\n    *   `any` (任何)，用于否定句和一般疑问句。","socratic_tracks":[{"title":"识别句型","steps":[{"question":"看到 `as ___ as` 这个结构，你想到了什么句型？","hint":"这是一个表示同等比较的句型。","takeaway":"`as ... as` 用于同级比较，表示“和……一样”。"}]},{"title":"判断修饰对象","steps":[{"question":"在句子 `he gave the dog as ___ as it wanted` 中，狗想要的东西（暗指食物）是可数名词还是不可数名词？","hint":"故事开头说狗 `ate too much`，这里的 `much` 修饰的是什么？","takeaway":"这里的 `much` 修饰的是不可数的“食物”，所以我们需要一个修饰不可数名词的词。"},{"question":"在 `many`, `much`, `little` 这三个词中，哪些可以修饰不可数名词？","hint":"回忆一下“many books”和“much water”这两个例子。","takeaway":"`much` 和 `little` 都可以修饰不可数名词。"}]},{"title":"语境与词义","steps":[{"question":"根据故事结尾，主人 Sam 对狗的态度是怎样的？他是会多给它吃的，还是少给它吃的？","hint":"他非常感激狗，不再想杀死它了。","takeaway":"主人的态度发生了积极的转变，他会善待狗。"},{"question":"`as much as it wanted` 和 `as little as it wanted` 分别是什么意思？哪个更符合主人转变后的态度？","hint":"`much` 是“多”，`little` 是“少”。","takeaway":"`as much as it wanted` 意为“它想要多少就给多少”，体现了主人的慷慨和感激。`as little as it wanted` 意为“只给它想要的那么一点点”，不符合语境。因此 `much` 是正确选择。"}]}]}}]},{"section_title":"III. 根据首字母或汉语提示完成单词或句子。(共 10 分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"Look! She is d_____ up as a Monkey King.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"dressing","explanation_md":"本题考查现在进行时和固定短语。句子开头的 'Look!' 是一个标志词，表明动作正在发生，因此谓语动词要用现在进行时（be + v-ing形式）。'dress up as' 是一个固定短语，意为“装扮成……”。结合这两点，主语 'She' 后面跟 'is'，因此空中需要填写 'dress' 的-ing形式，即 'dressing'。","knowledge_expansion_md":"1.  **固定搭配 `dress up`**:\n    *   `dress up`: 意为“盛装打扮，穿上好衣服”，例如：`You don't need to dress up for the party. It's very casual.` (你不用为聚会盛装打扮，这很随意。)\n    *   `dress up as somebody/something`: 意为“化装/装扮成……”，常用于晚会、节日等场合，例如：`The children dressed up as ghosts for Halloween.` (孩子们在万圣节装扮成了鬼怪。)\n\n2.  **现在进行时 (Present Continuous)**:\n    *   结构: `主语 + am/is/are + 动词-ing形式`。\n    *   用法: 表示说话时正在进行的动作。\n    *   标志词: `Look!`, `Listen!`, `now`, `at the moment` 等。","socratic_tracks":[{"title":"判断时态","steps":[{"question":"句子开头有一个词 'Look!'，它在提醒我们什么？","hint":"当别人让你“看！”的时候，通常是让你注意一个正在发生的事情。","takeaway":"'Look!' 是一个信号，提示我们句子描述的动作正在发生，应该使用现在进行时。"},{"question":"现在进行时的构成是怎样的？","hint":"它由一个助动词和一个动词的主要形式构成。","takeaway":"现在进行时的结构是“be动词 (am/is/are) + 动词的-ing形式”。"}]},{"title":"固定搭配","steps":[{"question":"看到“... up as a Monkey King”（扮成美猴王），你首先会想到哪个动词短语？","hint":"这个短语和“穿衣服”有关，表示“装扮”。","takeaway":"“装扮成……”的固定搭配是 `dress up as...`。"},{"question":"我们已经确定了动词是 dress，也确定了时态是现在进行时。那么，应该在横线上填什么呢？","hint":"将动词 dress 变成 -ing 形式。","takeaway":"根据现在进行时的规则，我们需要将动词 dress 变为 dressing，构成 is dressing。"}]},{"title":"词形变化","steps":[{"question":"为什么这里不能直接填动词原形 dress？","hint":"看看主语 'She' 后面的 'is'。'is' 后面能直接跟动词原形吗？","takeaway":"在 'be' 动词后面，动词需要变化形式，不能使用原形，这里应使用-ing形式构成进行时态。"},{"question":"如果把句子改成 “She often _____ up as a Monkey King.”，空中应该填什么？","hint":"“often” 表示经常性的动作，应该用什么时态？主语是 'She'，动词需要做什么变化？","takeaway":"如果是一般现在时，主语是第三人称单数，动词要加 -s，所以应该填 dresses。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"Which is your f_____ festival?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"favorite","explanation_md":"本题考查形容词词义和拼写。根据句意“哪一个是你（最喜欢的）节日？”，我们需要一个表示“最喜爱的”的形容词。结合首字母 'f' 提示，可以确定单词是 'favorite'。'favorite' 是一个常见词，用来询问或表达偏好。","knowledge_expansion_md":"1.  **拼写差异**: `favorite` 是美式英语拼写，`favourite` 是英式英语拼写。两者都正确，但在国内教材和考试中，美式拼写更为常见。\n\n2.  **词性**: `favorite` 既可以作形容词，也可以作名词。\n    *   作形容词：`My favorite color is blue.` (我最喜欢的颜色是蓝色。)\n    *   作名词：`Which of these is your favorite?` (这些当中哪个是你的最爱？)\n\n3.  **同义表达**: 询问偏好除了用 `favorite`，还可以用 `like ... best`。\n    *   `Which is your favorite festival?` = `Which festival do you like best?`\n    *   `What is your favorite food?` = `What food do you like best?`","socratic_tracks":[{"title":"语境推断","steps":[{"question":"这个问句 “Which is your f_____ festival?” 是想了解关于节日的什么信息？","hint":"它在问“你的”节日，通常是问你的偏好。","takeaway":"这个句子是在询问“你最喜欢哪个节日”。"},{"question":"那么，哪个以 'f' 开头的单词可以表达“最喜欢的”这个意思？","hint":"这个词在问“你最喜欢的颜色/食物”时也会用到。","takeaway":"表示“最喜爱的”并且以 'f' 开头的词是 favorite。"}]},{"title":"词汇拼写","steps":[{"question":"你能拼写出 favorite 这个单词吗？","hint":"fa-vo-rite，注意元音字母 a, o, i, e。","takeaway":"favorite 的正确拼写是 f-a-v-o-r-i-t-e。"},{"question":"你见过这个单词的其他拼写方式吗？比如 favourite？","hint":"想一想 color 和 colour 的区别。","takeaw
