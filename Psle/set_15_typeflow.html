<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第15套","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟"},"sections":[{"section_title":"I. 选出与其他三项不同类的一项。(共5分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"1. teachers' office","options":{"A":"teachers' office","B":"sunny","C":"music room","D":"art room"},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查词语分类。选项A“teachers' office”（教师办公室）、C“music room”（音乐室）和D“art room”（美术室）都是名词词组，指的是学校里的特定场所。而选项B“sunny”（晴朗的）是一个形容词，用来描述天气状况。因此，B项在词性和词义类别上均与其他三项不同，故选B。","knowledge_expansion_md":"### 词性与分类\n\n在英语中，辨别单词的词性（Part of Speech）是理解和运用词汇的基础。这道题就是典型的“词性/语义分类”题。\n\n1.  **名词 (Noun)**: 表示人、事、物、地点或抽象概念的词。如本题中的 `teachers' office`, `music room`, `art room` 都是地点名词。\n2.  **形容词 (Adjective)**: 用来修饰名词，描述其性质、状态或特征。如本题中的 `sunny`，常用来修饰 `day`, `weather` 等。\n\n### 相关词汇拓展\n\n*   **学校场所**: `classroom` (教室), `library` (图书馆), `playground` (操场), `gym` (体育馆), `lab` (实验室), `canteen` (食堂)。\n*   **天气形容词**: `rainy` (下雨的), `cloudy` (多云的), `windy` (有风的), `snowy` (下雪的), `foggy` (有雾的)。","socratic_tracks":[{"title":"词性分析法","steps":[{"question":"“teachers' office”, “music room”, “art room” 这三个词组描述的是什么？是动作、物品、还是地方？","hint":"想想它们是不是可以触摸到的实体空间。","takeaway":"它们都是表示“地点”的名词词组。"},{"question":"“sunny” 这个词是用来描述什么的？比如我们可以说 “a sunny ___”？","hint":"我们可以说“一个晴朗的天气”或“晴天”。","takeaway":"“sunny” 是一个形容词，用来修饰名词，通常描述天气。"},{"question":"比较一下，一个形容词和三个表示地点的名词词组，哪个与众不同？","hint":"一个描述性质，三个指代场所，它们的词性完全不同。","takeaway":"“sunny” 因其词性是形容词而与其他三个名词词组不同。"}]},{"title":"语义归类法","steps":[{"question":"如果我们要给 “teachers' office”, “music room”, “art room” 找一个共同的主题，会是什么？","hint":"想想这些地方通常在哪里能找到。","takeaway":"它们都属于“学校里的场所”这一类别。"},{"question":"“sunny” 属于哪个主题？是关于学校场所吗？","hint":"“sunny” 是描述天空状况的。","takeaway":"“sunny” 属于“天气状况”这一类别。"},{"question":"那么，在这四个选项中，哪个选项的主题与其他三个不同？","hint":"一个是天气，三个是学校场所。","takeaway":"“sunny” 因为属于天气类别，所以与其他三个学校场所类的选项不同。"}]},{"title":"功能与用途法","steps":[{"question":"“teachers' office” 是用来做什么的？“music room” 和 “art room” 呢？","hint":"老师在办公室工作，我们在音乐室上音乐课，在美术室上美术课。","takeaway":"这三个选项都描述了具有特定功能活动的物理空间。"},{"question":"“sunny” 描述的是一个可以进去活动的空间吗？","hint":"不，它描述的是一种自然状态。","takeaway":"“sunny” 描述的是一种天气状态，而不是一个功能性场所。"},{"question":"从“是否为功能性场所”这个角度看，哪个选项是特殊的？","hint":"那个描述天气状态的词。","takeaway":"“sunny” 不是一个功能性场所，因此与其他三个选项不同。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"2. cold","options":{"A":"cold","B":"warm","C":"lunch","D":"hot"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查词语分类。选项A“cold”（冷的）、B“warm”（温暖的）和D“hot”（热的）都是形容词，用来描述物体的温度或天气状况。而选项C“lunch”（午餐）是一个名词，指的是一天中的一顿正餐。因此，C项在词性和词义类别上均与其他三项不同，故选C。","knowledge_expansion_md":"### 词性与语义分类\n\n这类题目要求学生对词汇有准确的掌握，不仅要知道词义，还要了解其所属的类别和词性。\n\n1.  **温度/天气形容词**: `cold`, `warm`, `hot`, `cool` (凉爽的), `chilly` (寒冷的), `freezing` (极冷的)。\n2.  **餐食名词**: `breakfast` (早餐), `lunch` (午餐), `dinner`/`supper` (晚餐), `brunch` (早午餐), `snack` (点心)。\n\n### 易错点\n\n*   有些词具有多种词性。例如 `cold` 既可以是形容词（a cold day），也可以是名词（I have a cold. 我感冒了）。但在本题的语境中，它与 `warm` 和 `hot` 并列，显然是作为形容词来理解的。","socratic_tracks":[{"title":"语义分类法","steps":[{"question":"“cold”, “warm”, “hot” 这三个词都可以用来描述什么？","hint":"比如天气怎么样，或者水怎么样。","takeaway":"它们都用来描述“温度”或“天气”。"},{"question":"“lunch” 是用来描述温度的吗？它是什么意思？","hint":"“lunch” 是中午吃的那顿饭。","takeaway":"“lunch” 是一个名词，指“午餐”，属于“一日三餐”的类别。"},{"question":"比较这四个词，哪个词的意义类别与其他三个不同？","hint":"一个是关于吃饭的，三个是关于温度的。","takeaway":"“lunch” 因为属于“餐食”类别，而与其他三个“温度”形容词不同。"}]},{"title":"词性辨析法","steps":[{"question":"在 “a cold day”, “a warm day”, “a hot day” 中，“cold”, “warm”, “hot” 是什么词性？","hint":"它们都用来修饰名词 “day”。","takeaway":"它们都是形容词，用来修饰名词。"},{"question":"“lunch” 是什么词性？我们能说 “a lunch day” 吗？","hint":"“lunch” 是一个名词，指代一顿饭。","takeaway":"“lunch” 是一个名词，表示一个具体事物。"},{"question":"从词性角度看，哪个选项与其他三个不同？","hint":"名词和形容词是不同的词性。","takeaway":"“lunch” 是名词，而其他三个主要是形容词，因此它在词性上是不同的。"}]},{"title":"造句应用法","steps":[{"question":"试着用 “The weather is ___.” 这个句型来填空，看看哪些词可以填进去？","hint":"“The weather is cold/warm/hot.” 都可以。","takeaway":"“cold”, “warm”, “hot” 都可以作表语，描述天气状况。"},{"question":"我们能说 “The weather is lunch.” 吗？为什么？","hint":"不能，这句话不通顺，天气不可能是午餐。","takeaway":"“lunch” 是一个名词，不能用来描述天气状况。"},{"question":"通过这个造句练习，你发现哪个词的用法与其他三个格格不入？","hint":"“lunch” 不能用在这个句子里。","takeaway":"“lunch” 在句子中的功能和用法与其他三个词完全不同，因此是不同类的一项。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"3. under","options":{"A":"under","B":"near","C":"behind","D":"ago"},"answer_area_hint":"( )","teaching":{"correct_answer":"D","explanation_md":"本题考查词性与词义分类。选项A“under”（在...下面）、B“near”（在...附近）和C“behind”（在...后面）都是方位介词，用来表示物体的位置关系，回答的是关于“在哪里(where)”的问题。而选项D“ago”（以前）是一个时间副词，通常与表示时间段的词语连用，表示多久以前，回答的是关于“什么时候(when)”的问题。因此，D项在词性和功能上均与其他三项不同，故选D。","knowledge_expansion_md":"### 介词 vs. 副词\n\n这道题目的关键是区分方位介词和时间副词。\n\n1.  **方位介词 (Prepositions of Place)**: 表示位置、方向。后面通常跟名词或代词，构成介词短语作状语或表语。例如：\n    *   `under the table` (在桌下)\n    *   `near the school` (在学校附近)\n    *   `behind me` (在我后面)\n    *   其他常见方位介词：`in`, `on`, `in front of`, `between`, `next to`。\n\n2.  **时间副词 (Adverbs of Time)**: 表示时间。`ago` 是一个特殊的时间副词，其结构固定为 **“时间段 + ago”**，且通常与一般过去时连用。\n    *   `two days ago` (两天前)\n    *   `a long time ago` (很久以前)\n\n### `ago` 与 `before` 的区别\n\n*   `ago`: 必须与具体的时间段连用，以现在为基点，表示“...以前”。\n*   `before`: 用法更灵活。可以单独作副词（I've seen this movie before.），也可以作介词（before lunch），或连词（before you go）。","socratic_tracks":[{"title":"词性与功能","steps":[{"question":"“under”, “near”, “behind” 这类词通常用在什么词前面？比如 “under the table”, “near the school”。","hint":"它们后面通常会跟一个名词，表示位置关系。","takeaway":"它们是介词，用来引出地点状语，表示方位。"},{"question":"“ago” 这个词怎么用？我们能说 “ago the table” 吗？","hint":"不能，我们通常说 “two days ago”, “a long time ago”。","takeaway":"“ago” 是副词，通常放在表示时间长度的词组后面，表示“……以前”。"},{"question":"一个是时间副词，另外三个是地点介词，哪个是不同类的？","hint":"时间副词和地点介词功能完全不同。","takeaway":"“ago” 在词性和功能上都与表示地点的介词 “under”, “near”, “behind” 不同。"}]},{"title":"提问类型","steps":[{"question":"“under the desk”, “near the park”, “behind the door” 这些词组回答的是 “Where...?” (在哪里？) 还是 “When...?” (什么时候？) 的问题？","hint":"它们回答的是“在哪里？”。","takeaway":"“under”, “near”, “behind” 引导的短语都用于回答关于地点(Where)的问题。"},{"question":"“three days ago” 这个词组回答的是 “Where...?” 还是 “When...?” 的问题？","hint":"它回答的是“什么时候？”。","takeaway":"“ago” 用于构成时间短语，回答关于时间(When)的问题。"},{"question":"从回答问题的类型来看，哪个词与其他三个不同？","hint":"一个回答时间，三个回答地点。","takeaway":"“ago” 与时间相关，而其他三个与地点相关，因此它与众不同。"}]},{"title":"句子结构","steps":[{"question":"观察句子 “The cat is under the bed.” 我们可以把 “under” 换成 “near” 或 “behind” 吗？句子还通顺吗？","hint":"可以，“The cat is near/behind the bed.” 都是正确的句子。","takeaway":"“under”, “near”, “behind” 在句子中可以互换，都作地点状语。"},{"question":"我们能说 “The cat is ago the bed.” 吗？或者 “I saw him ago.”？","hint":"都不能，“ago” 的用法不是这样的。正确的说法是 “I saw him two days ago.”。","takeaway":"“ago” 不能像地点介词一样直接放在句中表示位置，它有固定的“时间段 + ago”结构。"},{"question":"在句子结构中的位置和用法上，哪个词是独特的？","hint":"“ago” 的用法很特别，不能和其他三个互换。","takeaway":"“ago” 在句子结构中的用法与其他三个介词完全不同，因此是不同类的一项。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"4. pear","options":{"A":"pear","B":"dog","C":"apple","D":"strawberry"},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查名词的分类。选项A“pear”（梨）、C“apple”（苹果）和D“strawberry”（草莓）都属于水果（fruit）类别。而选项B“dog”（狗）属于动物（animal）类别。由于所属的大的概念范畴不同，因此B项与其他三项不是同一类。故选B。","knowledge_expansion_md":"### 词汇分类学习法\n\n将单词按其所属的类别（Category）进行归纳和记忆，是扩大词汇量的有效方法。这也是小升初英语考试中常见的考点。\n\n*   **水果 (Fruit)**: `banana` (香蕉), `orange` (橙子), `grape` (葡萄), `watermelon` (西瓜), `peach` (桃子), `mango` (芒果)。\n*   **动物 (Animal)**: `cat` (猫), `bird` (鸟), `fish` (鱼), `tiger` (老虎), `monkey` (猴子), `elephant` (大象)。\n*   **蔬菜 (Vegetable)**: `potato` (土豆), `tomato` (西红柿), `cabbage` (卷心菜), `carrot` (胡萝卜)。\n*   **交通工具 (Vehicle)**: `car` (汽车), `bus` (公交车), `bike` (自行车), `train` (火车), `plane` (飞机)。\n\n平时学习新单词时，可以养成按类别整理的习惯，有助于形成知识网络。","socratic_tracks":[{"title":"语义归类法","steps":[{"question":"“pear”, “apple”, “strawberry” 这三个词有什么共同点？它们都属于哪一类食物？","hint":"想想它们是不是都长在植物上，可以吃。","takeaway":"它们都属于“水果”这一类别。"},{"question":"“dog” 属于“水果”吗？它属于哪一类？","hint":"“dog” 不是水果，它是一种动物。","takeaway":"“dog” 属于“动物”这一类别。"},{"question":"比较这四个选项，哪个选项的类别与其他三个不同？","hint":"一个是动物，三个是水果。","takeaway":"“dog” 因为属于动物类别，而与其他三个水果类的选项不同。"}]},{"title":"来源与属性","steps":[{"question":"“pear”, “apple”, “strawberry” 是从哪里来的？它们是动物还是植物？","hint":"它们都长在树上或植物上。","takeaway":"这三种都是植物的果实。"},{"question":"“dog” 是植物吗？","hint":"当然不是，狗是动物。","takeaway":"“dog” 是一种动物，不是植物。"},{"question":"从“是动物还是植物”这个角度来看，哪个选项是与众不同的？","hint":"狗是动物，其他是植物的一部分。","takeaway":"“dog” 作为动物，其生物来源与其他三个源于植物的果实完全不同。"}]},{"title":"概念层级法","steps":[{"question":"如果我们说“水果”是一个大概念，那么 “pear”, “apple”, “strawberry” 是不是这个大概念下的小例子？","hint":"是的，它们都是水果的具体种类。","takeaway":"“pear”, “apple”, “strawberry” 都是“水果”这个上位概念下的具体实例。"},{"question":"“dog” 是“水果”这个概念下的例子吗？它属于哪个大概念？","hint":"不是，它属于“动物”或“宠物”这个大概念。","takeaway":"“dog” 是“动物”这个上位概念下的一个实例。"},{"question":"哪个词不属于“水果”这个共同的上位概念？","hint":"“dog”。","takeaway":"“dog” 不属于“水果”这一概念范畴，因此与其他三项不同。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"5. chair","options":{"A":"chair","B":"grandmother","C":"brother","D":"sister"},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查词汇分类。选项B“grandmother”（祖母）、C“brother”（兄弟）和D“sister”（姐妹）都属于“家庭成员 (family members)”这一类别。而选项A“chair”的意思是“椅子”，属于“家具 (furniture)”类别。因此，A项与其他三项的类别不同，故选A。","knowledge_expansion_md":"这类“选出不同类的一项”的题目，在英语中称为“Odd One Out”，主要考察学生对词汇的归纳和分类能力。常见的分类维度有：\n\n*   **物品类别**：如文具 (stationery)、食物 (food)、水果 (fruit)、蔬菜 (vegetable)、家具 (furniture)、服装 (clothing)。\n*   **人物关系/职业**：如家庭成员 (family members)、职业 (jobs/professions)。\n*   **场所地点**：如学校里的场所 (classroom, library)、城市里的建筑 (hospital, bank)。\n*   **词性**：有时也会考察词性不同，如三个名词一个动词。\n\n解答此类题目的关键是：首先准确理解每个单词的含义，然后找出其中三个单词的共同属性或所属类别，最后确定那个不具备此属性的单词。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"请问 A, B, C, D 四个选项的中文意思分别是什么？","hint":"A 是我们用来坐的家具，B、C、D 都是我们的亲人。","takeaway":"准确理解每个单词的中文意思，是解题的第一步。"},{"question":"在 grandmother, brother, sister 这三个词之间，你能找到一个共同点吗？","hint":"想一想他们在你家里的身份。","takeaway":"这三个词都属于“家庭成员”这一类别。"},{"question":"那么，chair (椅子) 属于“家庭成员”吗？它应该属于哪一类？","hint":"椅子是人，还是物品？","takeaway":"chair 是“家具”，不属于“家庭成员”，因此它与其他三项不同类。"}]},{"title":"分类思维","steps":[{"question":"如果我们要给 B、C、D 这三个词贴上一个共同的“标签”，这个标签应该叫什么？","hint":"就像给“苹果”、“香蕉”、“梨”贴上“水果”的标签一样。","takeaway":"B、C、D 的共同标签是“家庭成员 (family members)”。"},{"question":"那么，选项A“chair”能贴上“家庭成员”这个标签吗？如果不能，它应该属于哪个标签？","hint":"我们把桌子、床、椅子放在一起，它们共同的标签是什么？","takeaway":"选项A“chair”属于“家具 (furniture)”这个类别。"},{"question":"通过比较这两个标签，你现在能解释为什么选项A是正确答案了吗？","hint":"一个类别是“人”，另一个类别是“物”。","takeaway":"因为选项A所属的类别（家具）与其他三项（家庭成员）完全不同。"}]},{"title":"举一反三","steps":[{"question":"除了“家庭成员”和“家具”，你还能想到哪些常见的英语单词分类？","hint":"想想我们每天吃的、用的、看到的。","takeaway":"常见的词汇分类还有：食物、动物、颜色、文具、交通工具等。"},{"question":"我们来做个练习：从 'apple', 'banana', 'pen', 'orange' 中选出不同类的一项。","hint":"哪三个是能吃的水果？哪一个是用来写字的？","takeaway":"'pen' (钢笔) 是文具，而其他三个都是水果，所以 'pen' 是不同类的。"},{"question":"这个练习告诉我们，解决这类问题的核心方法是什么？","hint":"先找到“大多数”的共同点，再找出那个“例外”。","takeaway":"掌握词汇和其所属类别是解决此类问题的关键。"}]}]}}]},{"section_title":"II. 词组互译。(共15分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"合上书","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"Close the book","explanation_md":"本题考查祈使句的翻译。“合上”这个动作在英语中常用动词 `close` 表示。“书”的英文是 `book`。这是一个指令，通常指代师生双方都知道的、正在使用的那本书，所以用定冠词 `the` 来特指，即 `the book`。整个词组是一个祈使句，以动词原形开头，所以完整的翻译是 `Close the book`。翻译成 `Close your book` 也是正确的。","knowledge_expansion_md":"**1. 祈使句 (Imperative Sentence)**\n祈使句用于表达命令、请求、建议等，通常省略主语 `you`，以动词原形开头。例如：\n*   `Stand up.` (起立)\n*   `Be quiet.` (请安静)\n其否定形式在动词原形前加 `Don't`。例如：`Don't talk.` (不要说话)。\n\n**2. 常见的课堂用语**\n*   `Open your book.` (打开书)\n*   `Listen to the teacher.` (听老师讲)\n*   `Look at the blackboard.` (看黑板)\n*   `Work in pairs.` (两人一组活动)\n\n**3. `close` vs `shut`**\n`close` 和 `shut` 都有“关闭”的意思，很多时候可以互换，如 `close/shut the window`。但 `close` 更常用，语气更中性、温和。`shut` 的语气稍强，有时含有“砰地关上”或“彻底关闭”的意味。","socratic_tracks":[{"title":"核心动词翻译","steps":[{"question":"“合上”这个动作，在英语里我们应该用哪个单词来表达？","hint":"“打开”是 `open`，那么它的反义词是什么？","takeaway":"“合上”或“关闭”通常用动词 `close` 来表达。"},{"question":"“书”的英文单词是什么？","hint":"我们每天阅读的东西。","takeaway":"“书”的英文是 `book`。"}]},{"title":"句子结构分析","steps":[{"question":"“合上书”这句话是在做什么？是陈述一个事实，还是在发出一个指令？","hint":"想象一下老师在课堂上说这句话的场景。","takeaway":"这是一个指令，在英语中我们用祈使句来表达。"},{"question":"英语的祈使句有什么结构特点？它通常以什么词开头？","hint":"回想一下 `Sit down.` (坐下) 这个句子。","takeaway":"祈使句通常以动词的原形开头，省略了主语 `you`。"}]},{"title":"冠词的妙用","steps":[{"question":"在 `book` 前面，我们需不需要加一个像 `a` 或 `the` 这样的词？","hint":"老师说“合上书”，是指随便哪一本书，还是大家正在看的那本特定的书？","takeaway":"通常是指特定的书，所以需要在名词前加上限定词。"},{"question":"那么应该用 `a` 还是 `the` 呢？它们有什么区别？","hint":"`a` 表示泛指“一（本）”，`the` 表示特指“那（本）”。","takeaway":"定冠词 `the` 用来特指说话双方都明确知道的事物。"},{"question":"现在，请把动词、冠词和名词按正确顺序组合成一个完整的指令。","hint":"祈使句的结构是：动词原形 + 其他成分。","takeaway":"最终的正确翻译是 `Close the book`。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"Happy New Year!","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"新年快乐！","explanation_md":"本题考查固定祝福语的翻译。`Happy New Year!` 是英语中用于庆祝新年的标准祝福语。其中，`Happy` 意为“快乐的”，`New` 意为“新的”，`Year` 意为“年”。`New Year` 组合起来就是“新年”。按照中文的表达习惯，我们将 `Happy New Year!` 翻译为“新年快乐！”。","knowledge_expansion_md":"**1. 节日祝福语的常见结构**\n英语中很多节日祝福语都遵循 `Happy / Merry + 节日名称` 的格式。这是一个非常实用的句式。\n*   `Happy Birthday!` (生日快乐！)\n*   `Happy Thanksgiving!` (感恩节快乐！)\n*   `Happy Women's Day!` (妇女节快乐！)\n\n**2. `Happy` 与 `Merry` 的区别**\n*   `Happy` 的适用范围非常广，可用于几乎所有节日和值得庆祝的场合。\n*   `Merry` 主要用于圣诞节，`Merry Christmas!` (圣诞快乐！) 是最传统、最地道的说法。虽然 `Happy Christmas` 也有人使用，但远不如 `Merry Christmas` 普遍。`Merry` 带有更强的“欢乐、喜庆”的意味。\n\n**3. 回应祝福**\n当别人对你说 `Happy New Year!` 时，你可以简单地回应 `Happy New Year!` 或者 `The same to you.` (也祝你一样快乐)。","socratic_tracks":[{"title":"拆解祝福语","steps":[{"question":"我们来逐个翻译 `Happy`, `New`, `Year` 这三个单词。","hint":"`Happy` 是你过生日时的心情，`New` 与 `old` (旧的) 相对，`Year` 是一年的时间单位。","takeaway":"这三个词分别表示“快乐的”、“新的”、“年”。"},{"question":"把这三个词的意思组合起来，`Happy New Year` 的字面意思是什么？","hint":"按照英文词语的顺序直接翻译。","takeaway":"字面意思是“快乐的新年”。"},{"question":"在中文里，我们通常如何表达这个祝福？哪种说法更自然？","hint":"过年时，你见到亲朋好友会说什么祝福的话？","takeaway":"我们通常说“新年快乐！”，这更符合中文的表达习惯。"}]},{"title":"祝福语的万能公式","steps":[{"question":"观察 `Happy New Year!` 和 `Happy Birthday!`，你发现了它们有什么共同的结构吗？","hint":"它们都以哪个单词开头？后面跟着的是什么？","takeaway":"它们都以 `Happy` 开头，后面跟着一个表示节日或特殊日子的名词。"},{"question":"如果我想祝老师“教师节快乐”，按照这个结构，我应该怎么说？（教师节是 Teachers' Day）","hint":"将公式中的“节日名称”替换成 `Teachers' Day`。","takeaway":"可以说 `Happy Teachers' Day!`。"},{"question":"这个结构告诉我们，学习英语祝福语有什么小窍门？","hint":"记住一个模板，然后替换关键词。","takeaway":"掌握 `Happy + 节日` 这个常用句式，就可以轻松表达多种节日祝福。"}]},{"title":"Merry vs. Happy","steps":[{"question":"我们祝别人生日快乐说 `Happy Birthday`，那祝圣诞快乐最常见的说法是什么？","hint":"想一想你听过的圣诞歌曲里是怎么唱的。","takeaway":"最常见的说法是 `Merry Christmas!`。"},{"question":"为什么圣诞节常用 `Merry` 而不是 `Happy` 呢？","hint":"这是一个语言传统和习惯。`Merry` 这个词在过去更常用，带有“欢快、热闹”的氛围。","takeaway":"`Merry Christmas` 是一个流传已久的传统用法，虽然 `Happy Christmas` 也能被理解，但前者更地道。"},{"question":"那么，在用于节日祝福时，`Happy` 和 `Merry` 哪个适用范围更广？","hint":"除了圣诞节，其他节日我们一般用哪个词？","takeaway":"`Happy` 的适用范围更广，几乎可以用于所有节日和庆祝场合。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"新年","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"New Year","explanation_md":"本题考查节日名称的翻译。“新”的英文形容词是 `new`，“年”的英文名词是 `year`。将两者组合起来，就是 `New Year`。需要注意的是，“新年”作为一个特定的节日名称，属于专有名词。在英语中，专有名词的每个实词首字母都需要大写，因此正确答案是 `New Year`。","knowledge_expansion_md":"**1. 专有名词大写规则**\n在英语中，特定的名称，如人名、地名、国籍、语言、月份、星期、节日等，都需要大写首字母。如果专有名词由多个单词组成，通常每个实词（名词、动词、形容词等）的首字母都要大写。\n*   节日: `Children's Day` (儿童节), `National Day` (国庆节)\n*   月份: `January`, `February`\n*   星期: `Monday`, `Tuesday`\n*   国家/语言: `China`, `Chinese`\n\n**2. `New Year` vs. `the new year` 的区别**\n*   `New Year` (首字母大写): 特指“新年”这个节日，通常指1月1日及其庆祝期间。例如: `What's your plan for New Year?` (你新年有什么计划？)\n*   `the new year` (首字母小写): 泛指“新的一年”，即从现在开始的未来一整年。例如: `I want to learn swimming in the new year.` (我希望在新的一年里学会游泳。)","socratic_tracks":[{"title":"核心词汇翻译","steps":[{"question":"“新”这个汉字，对应的英文单词是什么？","hint":"与 `old` (旧的) 相对的词。","takeaway":"“新”的英文是 `new`。"},{"question":"“年”这个汉字，对应的英文单词是什么？","hint":"一年有12个月，这个“年”的单位用英语怎么说？","takeaway":"“年”的英文是 `year`。"},{"question":"把这两个英文单词按照中文顺序组合起来，“新年”就是什么？","hint":"直接将 `new` 和 `year` 放在一起。","takeaway":"组合起来就是 `New Year`。"}]},{"title":"大写字母规则","steps":[{"question":"“新年”是一个普通的词组，还是一个特定节日的名称？","hint":"它和“圣诞节”、“儿童节”是同一类吗？","takeaway":"“新年”是一个特定节日的名称，属于专有名词。"},{"question":"在英语书写中，遇到专有名词时，我们对它的首字母有什么特殊要求？","hint":"观察一下 `China`, `Tom`, `Christmas` 这些词的开头。","takeaway":"专有名词的首字母通常需要大写。"},{"question":"所以，在书写 `New Year` 时，我们应该注意什么细节？","hint":"检查 `New` 和 `Year` 这两个词的首字母。","takeaway":"作为节日名称，`New` 和 `Year` 的首字母都应该大写。"}]},{"title":"概念辨析","steps":[{"question":"当我说 “Happy New Year!” 的时候，大写的 `New Year` 指的是什么？","hint":"它指的是一个具体的节日，还是泛指未来的365天？","takeaway":"大写的 `New Year` 特指“新年”这个节日，尤其是1月1日。"},{"question":"如果我说 “I will work harder in the new year.”，这里小写的 `the new year` 又指的是什么？","hint":"它指的是一个时间段，还是一个节日庆典？","takeaway":"小写的 `the new year` 泛指“接下来的一整年”。"},{"question":"通过比较，你能总结出大写的 `New Year` 和小写的 `the new year` 的核心区别吗？","hint":"一个指特定的节日，一个指一段未来的时间。","takeaway":"是否大写决定了它是指特定的节日还是泛指新的一年。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"在右边","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"on the right","explanation_md":"本题考查方位介词短语的表达。在英语中，表示“在左边”或“在右边”时，我们通常使用固定搭配`on the left/right`。这里的介词是 `on`，并且方位名词前需要使用定冠词 `the`，因为“左”和“右”是相对于特定参照物而言的确定方向。因此，“在右边”的正确翻译是 `on the right`。","knowledge_expansion_md":"### 方位介词短语拓展\n\n1.  **on the left/right**: 这是最基础的左右方位表达。例如：`The supermarket is on the right.` (超市在右边。)\n2.  **in the middle**: 表示“在中间”。例如：`There is a table in the middle of the room.` (房间中间有一张桌子。)\n3.  **与 at 的区别**: `at the right` 并不常用，但在某些特定语境下，`at` 可以表示在一个具体的“点”上，如 `turn right at the corner` (在拐角处向右转)。但一般表示“在右边”这个区域时，都用 `on`。\n4.  **其他方位介词**: 学习方位时，还需要掌握 `in` (在...里面), `on` (在...上面), `under` (在...下面), `behind` (在...后面), `in front of` (在...前面), `next to` (在...旁边) 等。","socratic_tracks":[{"title":"介词的选择","steps":[{"question":"当我们要表达“在...的表面上”或者“在...的一侧”时，通常会选用哪个介词？是 `in`, `on`, 还是 `at`？","hint":"想象一下地图上的一个点，或者墙上的一幅画，我们会说 `a picture on the wall`。","takeaway":"表示“在左/右边”时，我们固定使用介词 `on`。"},{"question":"那么，与“在右边”相对的“在左边”应该怎么说呢？","hint":"结构和“在右边”是完全一样的，只是换一个表示方向的词。","takeaway":"“在左边”是 `on the left`，这组词组结构对称，便于记忆。"}]},{"title":"冠词的用法","steps":[{"question":"为什么在 `right` 前面要用定冠词 `the`，而不是不定冠词 `a` 或者干脆不用冠词？","hint":"定冠词 `the` 用来指代特定的、独一无二的或谈话双方都明确的事物。在一个空间里，“右边”是唯一的吗？","takeaway":"在表示方位时，“左边”和“右边”是确定的概念，因此需要使用定冠词 `the`。"},{"question":"如果我们说 “He has a right to know.” (他有权知道)，这里的 `right` 前面为什么用 `a` 呢？","hint":"这里的 `right` 是名词，意思不再是“右边”，而是“权利”。“权利”是可数名词吗？","takeaway":"词义不同，语法功能也不同。作为方位时用 `on the right`，作为“权利”时是可数名词，可以说 `a right`。"}]},{"title":"词组的实际应用","steps":[{"question":"如果想用一句话告诉别人“洗手间在右边”，你会怎么说？","hint":"句子的基本结构是 “The ... is ...”。请把“洗手间 (restroom/toilet)”和“在右边”填进去。","takeaway":"我们可以说：`The restroom is on the right.`"},{"question":"那如果是一个祈使句，比如“请在右边签名”，又该怎么表达呢？","hint":"祈使句通常以动词原形开头。“签名”是 `sign`。","takeaway":"我们可以说：`Please sign on the right.` 这说明 `on the right` 可以作地点状语，灵活地用于各种句型。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"去公园","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"go to the park","explanation_md":"本题考查动词短语的翻译。中文“去”通常翻译为动词 `go`。“去某个地方”在英语中常用结构“`go to` + 地点名词”来表达，介词 `to` 在此表示方向。`Park`（公园）是一个具体的地点，在日常语境中，当我们说“去公园”时，通常指某个特定的、大家熟知的公园，所以前面要用定冠词 `the`。因此，“去公园”翻译为 `go to the park`。","knowledge_expansion_md":"### “go to + 地点”结构拓展\n\n1.  **基本用法**: `go to + 地点` 是表示“去某地”最常见的结构。\n    *   `go to school` 去上学\n    *   `go to the cinema` 去看电影\n    *   `go to the library` 去图书馆\n2.  **特殊情况：go home**: `home` 在这里作副词，意为“到家；在家”，副词前不需要加介词 `to`。所以我们说 `go home` (回家)，而不是 `go to home`。类似的副词还有 `here` (这里), `there` (那里), `abroad` (国外)，如 `go there` (去那里), `go abroad` (出国)。\n3.  **go + V-ing**: 这个结构表示“去做某项活动”，特别是娱乐或体育活动。\n    *   `go shopping` 去购物\n    *   `go swimming` 去游泳\n    *   `go fishing` 去钓鱼","socratic_tracks":[{"title":"核心动词与介词","steps":[{"question":"中文的“去”通常对应英语中的哪个动词？","hint":"这是一个表示“移动”的基础动词。","takeaway":"“去”最直接的翻译是动词 `go`。"},{"question":"当我们说“去”一个具体的地方时，动词 `go` 后面需要加一个表示方向的介词，是哪个？","hint":"从A到B，我们会说 `from A to B`。","takeaway":"表达“去某地”时，固定结构是 `go to` + 地点。"}]},{"title":"冠词的选择","steps":[{"question":"为什么公园 `park` 前面通常用 `the`，而不是 `a`？","hint":"当我们和朋友说“我们去公园吧”，通常是指我们附近那个常去的公园，还是世界上任意一个公园？","takeaway":"在日常对话中，`park` 通常是特指的，即谈话双方都知道的那个公园，所以用定冠词 `the`。"},{"question":"在什么情况下，我们可能会用 `a park` 呢？","hint":"想一想，如果是在描述一个城市，说“这个城市有一个公园”，这里的“一个公园”是特指吗？","takeaway":"当泛指“一个公园”这种事物时，会用不定冠词 `a`，例如：`There is a park near my home.` (我家附近有一个公园。)"}]},{"title":"特殊用法辨析","steps":[{"question":"我们已经知道“去公园”是 `go to the park`，“去学校”是 `go to school`，那么“回家”是 `go to home` 吗？","hint":"这是一个非常常见的易错点，`home` 这个词比较特殊。","takeaway":"“回家”的正确说法是 `go home`，中间没有 `to`。"},{"question":"为什么 `go home` 中间不需要 `to` 呢？","hint":"想一想 `home` 在这里的词性。介词 (如 `to`) 后面通常跟名词，如果 `home` 不是名词呢？","takeaway":"在此用法中，`home` 是一个副词，表示“到家”，副词前不需要加介词。"},{"question":"除了 `home`，还有哪些类似的词和 `go` 搭配时也不需要 `to`？","hint":"想想表示“这里”、“那里”、“楼上”、“国外”的词。","takeaway":"`go here` (来这里), `go there` (去那里), `go upstairs` (上楼), `go abroad` (出国) 都不需要加 `to`，因为这些词都是副词。"}]}]}},{"number":"6","item_type":"fill_blank","context_note":"","stem":"a cup of tea","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"一杯茶","explanation_md":"本题考查英语量词短语的翻译。`a cup of` 是一个常见的量词结构，用来计量不可数名词。`a` 意为“一”，`cup` 意为“杯”，`of` 在这里连接量词和它所修饰的名词。`tea` 是“茶”的意思，是一个不可数名词。将这几部分组合起来，`a cup of tea` 的意思就是“一杯茶”。","knowledge_expansion_md":"### 不可数名词的量词表达\n\n英语中很多物质名词（如液体、粉末、抽象概念）是不可数的，不能直接用 `a/an` 或数字来修饰。我们需要借助“量词短语”来表示它们的数量。常见结构是 `a/an + 量词 + of + 不可数名词`。\n\n1.  **用容器作量词**: \n    *   `a glass of` water/milk (一杯水/牛奶)\n    *   `a bottle of` juice/coke (一瓶果汁/可乐)\n    *   `a bowl of` rice/soup (一碗米饭/汤)\n2.  **用形状或单位作量词**:\n    *   `a piece of` paper/bread/news (一张纸/一片面包/一则新闻)\n    *   `a slice of` cake/pizza (一片蛋糕/披萨)\n    *   `a bar of` chocolate/soap (一块巧克力/肥皂)\n3.  **复数形式**: 当数量大于一时，量词本身要变为复数，而后面的不可数名词保持不变。例如：`two cups of tea`, `three pieces of paper`。","socratic_tracks":[{"title":"量词结构分析","steps":[{"question":"在短语 `a cup of tea` 中，`tea` (茶) 是可数名词还是不可数名词？","hint":"我们能说 `one tea, two teas` 吗？通常我们说“一杯茶”、“一壶茶”。","takeaway":"`Tea` (茶) 作为一种物质，是不可数名词。"},{"question":"对于不可数名词，我们如何表达它的数量？`a cup of` 在这里起到了什么作用？","hint":"我们不能直接说 `a tea`，所以需要一个东西来“装”它或者“计量”它。","takeaway":"`a cup of` 是一个量词短语，用来计量不可数名词 `tea` 的份量。"}]},{"title":"核心词义理解","steps":[{"question":"单词 `cup` 的中文意思是什么？","hint":"它是一种用来喝热饮的带柄容器。","takeaway":"`cup` 的意思是“杯子”。"},{"question":"单词 `a` 在这里表示什么？","hint":"它用在单数名词前，表示数量。","takeaway":"`a` 表示数量“一”。"},{"question":"将 `a` (一), `cup` (杯), `of` (的), `tea` (茶) 组合起来，最通顺的中文翻译是什么？","hint":"按照中文的表达习惯来组织这些词。","takeaway":"`a cup of tea` 的标准翻译是“一杯茶”。"}]},{"title":"知识迁移与拓展","steps":[{"question":"如果我们想说“一杯水”，应该怎么用英语表达？","hint":"“水”是 `water`，通常用什么杯子喝水？","takeaway":"可以说 `a cup of water`，但更常用 `a glass of water` (`glass` 指玻璃杯)。"},{"question":"那如果我想表达“两杯茶”，这个短语应该如何变化？","hint":"数量从“一”变成了“二”(`two`)，哪个词需要变成复数形式？是 `cup` 还是 `tea`？","takeaway":"当数量大于一时，量词 `cup` 需要变成复数 `cups`，而不可数名词 `tea` 保持不变，所以是 `two cups of tea`。"}]}]}},{"number":"7","item_type":"fill_blank","context_note":"","stem":"write a letter","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"写一封信","explanation_md":"本题考查动宾短语的翻译。`write` 是一个动词，意思是“写”。`letter` 是一个名词，意思是“信”。前面的 `a` 是不定冠词，表示“一（个/封）”，用在单数可数名词前。因此，`a letter` 的意思是“一封信”。整个短语 `write a letter` 是一个“动词+宾语”的结构，直译过来就是“写一封信”。","knowledge_expansion_md":"### 动宾短语 (Verb-Object Phrases) 拓展\n\n动宾短语是英语中最基本的结构之一，由一个及物动词 (transitive verb) 和它的宾语 (object) 构成。\n\n1.  **常见动宾短语**: \n    *   `read a book` (读一本书)\n    *   `play football` (踢足球)  *注意：球类运动前通常不加冠词*\n    *   `watch TV` (看电视) *注意：watch TV 是固定搭配*\n    *   `do my homework` (做我的作业)\n    *   `have lunch` (吃午饭)\n2.  **冠词的使用**: 宾语如果是单数可数名词，前面通常需要一个限定词，如不定冠词 `a/an` (泛指)、定冠词 `the` (特指) 或物主代词 `my/your/his` 等。例如：`write a letter` (写一封信), `write the letter` (写那封信), `write his letter` (写他的信)。\n3.  **动词 `write` 的其他搭配**: `write` 后面可以跟很多不同的宾语，构成不同意思的短语。例如：`write a story` (写一个故事), `write an email` (写一封电子邮件), `write your name` (写你的名字)。","socratic_tracks":[{"title":"短语结构分析","steps":[{"question":"在 'write a letter' 这个短语中，哪个词是表示动作的动词？","hint":"哪个词是你在做的事情？","takeaway":"动词是 'write'，意思是“写”。"},{"question":"那么，'a letter' 在这个短语里扮演什么角色？","hint":"它是被“写”出来的东西，是动作的对象。","takeaway":"'a letter' 是动词 'write' 的宾语，即动作的承受者。"},{"question":"一个动词加上它的宾语，构成了动宾短语。所以 'write a letter' 的整体意思是什么？","hint":"把“写”和“一封信”合在一起。","takeaway":"这个短语的意思是“写一封信”。"}]},{"title":"冠词 'a' 的作用","steps":[{"question":"为什么在 'letter' 前面要加一个 'a'？","hint":"'letter' (信) 是可数名词还是不可数名词？","takeaway":"'letter' 是可数名词，它的单数形式在句子中不能单独出现，前面需要有冠词等限定词。"},{"question":"冠词 'a' 在这里具体是什么意思？它和 'the' 有什么区别？","hint":"'a' 表示泛指，即任何一封信；'the' 表示特指，即双方都知道的那封信。","takeaway":"'a' 是不定冠词，相当于中文里的“一”，表示泛指“一封信”。"}]},{"title":"动词 'write' 的拓展","steps":[{"question":"除了 'write a letter'，我们还可以 'write' 什么别的东西？试着说出“写一个故事”。","hint":"“故事”的英文是 'story'。","takeaway":"“写一个故事”是 'write a story'。"},{"question":"那“写一封电子邮件”怎么说？","hint":"“电子邮件”是 'email'，注意它的首字母发音是元音音素。","takeaway":"“写一封电子邮件”是 'write an email'，因为 email 以元音音素开头，所以用 an。"},{"question":"如果我们想表达“给某人写信”，应该怎么说？比如“给我妈妈写一封信”。","hint":"可以在短语后面加上 'to + 某人'。","takeaway":"可以说 'write a letter to my mother'，介词 to 在这里引出接收者。"}]}]}},{"number":"8","item_type":"fill_blank","context_note":"","stem":"flower shop","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"花店","explanation_md":"本题考查名词词组的翻译。\n1. `flower` 是名词，意思是“花，鲜花”。\n2. `shop` 是名词，意思是“商店”。\n3. 将两个词组合在一起，`flower shop` 指的是“卖花的商店”，即“花店”。\n4. 这是一个典型的“名词+名词”构成的复合名词，第一个名词说明第二个名词的种类或用途。","knowledge_expansion_md":"在英语中，两个名词可以组合在一起构成一个新的名词，称为复合名词（Compound Noun）。\n\n**结构**：`名词1 + 名词2`\n\n**功能**：名词1通常用来修饰名词2，说明其材料、用途、种类或属性。\n\n**示例**：\n*   `bookshop` / `book store`：书店（卖书的商店）\n*   `coffee shop`：咖啡店（喝咖啡的店）\n*   `shoe shop`：鞋店（卖鞋的商店）\n*   `bus stop`：公交车站（巴士停靠的地方）\n*   `classroom`：教室（上课的房间）\n\n**注意**：复合名词的写法不一，有的合写（如 `classroom`），有的分写（如 `flower shop`），有的用连字符（较少见）。在小升初阶段，掌握常见的分写和合写形式即可。","socratic_tracks":[{"title":"词义拆解法","steps":[{"question":"我们先看第一个单词 `flower`，它在中文里是什么意思？","hint":"春天公园里会开很多五颜六色的……？","takeaway":"`flower` 的意思是“花”或“鲜花”。"},{"question":"再看第二个单词 `shop`，它是什么意思？","hint":"我们去买东西的地方，比如 `bookshop` (书店)，`shop` 指的是什么？","takeaway":"`shop` 的意思是“商店”。"},{"question":"把“花”和“商店”这两个意思合在一起，`flower shop` 指的是一个什么样的地方？","hint":"这个商店是卖什么的？","takeaway":"`flower shop` 就是卖花的商店，中文里我们称之为“花店”。"}]},{"title":"复合名词结构","steps":[{"question":"你观察一下 `flower shop` 和 `bookshop` (书店) 这类词组，它们在结构上有什么共同点？","hint":"它们都是由几个名词组成的？第一个词和第二个词是什么关系？","takeaway":"它们都是由两个名词组成的，第一个名词用来描述第二个名词的用途或种类。"},{"question":"按照这个规律，在 `flower shop` 中，`flower` 是用来做什么的？","hint":"`flower` 是在说明 `shop` 的什么信息？","takeaway":"`flower` 说明了这是一个卖“花”的 `shop`（商店）。"}]},{"title":"举一反三","steps":[{"question":"知道了 `flower shop` 是花店，那如果我想说“水果店”，应该怎么表达？","hint":"“水果”的英文是 `fruit`，“商店”是 `shop`。","takeaway":"“水果店”可以说成 `fruit shop`。"},{"question":"非常好！那“玩具店”呢？","hint":"“玩具”的英文是 `toy`。","takeaway":"“玩具店”就是 `toy shop`。"}]}]}},{"number":"9","item_type":"fill_blank","context_note":"","stem":"fly kites (fly a kite)","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"放风筝","explanation_md":"本题考查动宾词组的翻译。\n1. `fly` 在这里是动词，意为“放飞”，而不是它更常见的“飞翔”之意。\n2. `kite` 是名词，意为“风筝”。\n3. `fly a kite` 是一个固定的动宾搭配，表示“放风筝”这个动作。\n4. 括号中的 `fly kites` 是复数形式，可以指放多个风筝，或泛指“放风筝”这项活动，翻译时通常都译为“放风筝”。","knowledge_expansion_md":"**动词 `fly` 的用法**\n\n`fly` 是一个不规则动词，过去式是 `flew`，过去分词是 `flown`。\n\n1.  **不及物动词 (vi.)**：意为“飞，飞翔”，主语自己发出动作。\n    *   `Birds can fly.` (鸟会飞。)\n\n2.  **及物动词 (vt.)**：意为“放飞；驾驶（飞机）”，主语使宾语飞。\n    *   `He likes to fly a kite.` (他喜欢放风筝。)\n    *   `She can fly a plane.` (她会开飞机。)\n\n**关于 `a kite` vs. `kites`**\n*   `fly a kite`：强调放一个风筝，是具体的一次动作。\n*   `fly kites`：泛指“放风筝”这项爱好或活动，或者指同时放飞多个风筝。\n在翻译成中文时，两者通常都可以译为“放风筝”。","socratic_tracks":[{"title":"动词多义性","steps":[{"question":"单词 `fly` 最常见的意思是什么？比如在句子 `A bird can fly.` 中。","hint":"想一想鸟儿在天空中的动作。","takeaway":"`fly` 的常见意思是“飞”或“飞翔”。"},{"question":"在词组 `fly a kite` 中，`fly` 后面跟了一个名词 `a kite`（风筝）。这里的 `fly` 还是主语自己在“飞”吗？还是“让”某个东西飞？","hint":"是人在飞，还是人在让风筝飞？","takeaway":"在这里，`fly` 的意思是“使……飞”，即“放飞”。"},{"question":"所以，把“放飞”和“风筝”(`kite`) 结合起来，`fly a kite` 是什么意思？","hint":"这是一个非常常见的户外活动。","takeaway":"`fly a kite` 的意思就是“放风筝”。"}]},{"title":"固定搭配","steps":[{"question":"英语中很多活动都用“动词+名词”的固定搭配来表达，比如“踢足球”是 `play football`。你还能想到其他类似的例子吗？","hint":"想想“看电视”、“唱歌”、“画画”怎么说？","takeaway":"类似的搭配还有 `watch TV`, `sing a song`, `draw a picture` 等。"},{"question":"那么，“放风筝”这个活动，我们用哪个动词来搭配“风筝”(`kite`) 呢？","hint":"我们是让风筝“飞”起来，所以动词应该和“飞”有关。","takeaway":"“放风筝”的固定搭配就是 `fly a kite`。"}]},{"title":"单复数辨析","steps":[{"question":"题目中同时给出了 `fly a kite` 和 `fly kites`，`a kite` 和 `kites` 在数量上有什么不同？","hint":"`a` 表示“一个”，名词结尾的 `s` 通常表示什么？","takeaway":"`a kite` 是单数，指一个风筝；`kites` 是复数，指多个风筝。"},{"question":"虽然有单复数之分，但它们翻译成中文时，意思有很大差别吗？比如当你说“我喜欢放风筝”时，会特意区分是一个还是多个吗？","hint":"中文在表达习惯上，通常不会在“风筝”上区分数量。","takeaway":"在翻译成中文时，两者通常都笼统地翻译为“放风筝”，泛指这项活动。"}]}]}},{"number":"10","item_type":"fill_blank","context_note":"","stem":"ride a bicycle","options":{},"answer_area_hint":"__________","teaching":{"correct_answer":"骑自行车","explanation_md":"本题考查常见动宾词组的翻译。\n1. `ride` 是一个动词，基本意思是“骑”。\n2. `a bicycle` 是名词词组，意思是“一辆自行车”。\n3. `ride a bicycle` 是一个固定的动宾搭配，字面意思就是“骑一辆自行车”，通常直接翻译为“骑自行车”。\n4. `bicycle` 在口语中常被简称为 `bike`，所以 `ride a bike` 也是完全相同的意思。","knowledge_expansion_md":"**动词 `ride` 的用法**\n\n`ride` 是一个不规则动词，其变化形式为：`ride` (原形) - `rode` (过去式) - `ridden` (过去分词)。\n\n`ride` 主要用于以下两种情况：\n1.  **骑跨式**：指骑在某个东西上，双腿分跨两侧。\n    *   `ride a bicycle/bike` (骑自行车)\n    *   `ride a horse` (骑马)\n    *   `ride a motorbike` (骑摩托车)\n\n2.  **乘坐式**：指作为乘客乘坐交通工具。\n    *   `ride a bus` (乘坐公交车)\n    *   `ride the subway` (乘坐地铁)\n    *   `ride in a car` (坐小汽车)\n\n**易混淆点**：\n*   `ride a car` 的说法不常见，一般说 `drive a car` (开车) 或 `ride in a car` (坐车)。\n*   `ride a bus` 和 `take a bus` 意思相近，都可以表示“乘坐公交车”。","socratic_tracks":[{"title":"核心动词用法","steps":[{"question":"动词 `ride` 是什么意思？它通常和哪些交通工具或动物一起使用？","hint":"想一想马、摩托车、自行车，我们用什么动词来表示驾驭它们的动作？","takeaway":"`ride` 的意思是“骑”，常用于 `ride a horse` (骑马) 或 `ride a bike` (骑自行车)。"},{"question":"`bicycle` 是“自行车”，那么把 `ride` 和 `a bicycle` 组合在一起，是什么意思？","hint":"就是“骑”这个动作加上“自行车”这个工具。","takeaway":"`ride a bicycle` 就是“骑自行车”。"}]},{"title":"词汇替换与简化","steps":[{"question":"`bicycle` 这个词有点长，在日常口语中，有没有更简单、更常见的说法？","hint":"这个词以 `b` 开头，只有四个字母。","takeaway":"`bicycle` 的简称是 `bike`。"},{"question":"那么，`ride a bicycle` 用这个简称可以怎么说？它们的意思一样吗？","hint":"只需要把 `bicycle` 替换成 `bike`。","takeaway":"也可以说 `ride a bike`，意思完全相同，都是“骑自行车”。"}]},{"title":"搭配拓展","steps":[{"question":"除了骑自行车，动词 `ride` 还可以用来表示“乘坐”公共交通工具。比如“坐公交车”怎么说？","hint":"“公交车”的英文是 `bus`。","takeaway":"“乘坐公交车”可以说 `ride a bus`。"},{"question":"那“骑马”呢？这个用法和“骑自行车”非常类似。","hint":"“马”的英文是 `horse`。","takeaway":"“骑马”就是 `ride a horse`。"},{"question":"我们开车用 `drive a car`，那如果是作为乘客坐在小汽车里，可以用 `ride` 吗？","hint":"这时人是在车“里面”，而不是“骑”在上面，所以需要加一个介词。","takeaway":"作为乘客坐车，我们通常说 `ride in a car`。"}]}]}}]},{"section_title":"III. 选择填空。(共20分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"— _____ is his football? \n—It's under the bed.","options":{"A":"Where","B":"Who","C":"What","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查特殊疑问词的用法。\n1. 首先分析答句：`It's under the bed.` 意为“它在床底下”。\n2. `under the bed` 是一个表示地点的状语，说明了物品的位置。\n3. 针对“地点”或“位置”进行提问，应该使用特殊疑问词 `Where`（在哪里）。\n4. 选项 A `Where` 意为“在哪里”；选项 B `Who` 意为“谁”，用来问人；选项 C `What` 意为“什么”，用来问事物。\n5. 因此，只有 `Where` 符合语境，构成的问句是 `Where is his football?`（他的足球在哪里？），与答句完美对应。","knowledge_expansion_md":"**常见特殊疑问词（Wh-words）用法总结**\n\n特殊疑问词用于对句中某一部分（如主语、宾语、状语等）进行提问，回答时不能用 `Yes` 或 `No`。\n\n*   **`Where`**：问地点、位置。答语常包含 `in`, `on`, `under`, `near`, `here`, `there` 等介词或副词。\n    *   `— Where is my pen? — It's on the desk.`\n*   **`Who`**：问人物、身份。通常用来提问主语或宾语。\n    *   `— Who is that girl? — She is my sister.`\n*   **`What`**：问事物、职业、姓名等。\n    *   `— What is this? — It's an apple.`\n    *   `— What's your name? — My name is Tom.`\n*   **`When`**：问时间。答语常包含具体时间点或时间段。\n    *   `— When do you go to school? — At 7:30.`\n*   **`Why`**：问原因。答语常以 `Because...` 开头。\n    *   `— Why are you late? — Because I missed the bus.`\n*   **`How`**：问方式、方法、程度、健康状况等。\n    *   `— How are you? — I'm fine, thank you.`\n\n**解题技巧**：做这类选择题，最有效的方法是“看答句，找线索”。答句的内容直接决定了问句所使用的疑问词。","socratic_tracks":[{"title":"从答案反推问题","steps":[{"question":"我们先来看回答 `It's under the bed.`，这句话告诉了我们关于足球的什么信息？是它的颜色、主人还是位置？","hint":"`under the bed` 的中文意思是“在床底下”，这是一个……？","takeaway":"这个回答告诉了我们足球的“位置”或“地点”。"},{"question":"既然回答是关于“地点”的，那么在英语中，我们应该用哪个疑问词来提问“在哪里”？","hint":"在 `Where`, `Who`, `What` 三个选项中，哪一个和地点有关？","takeaway":"询问地点的疑问词是 `Where`。"}]},{"title":"疑问词功能辨析","steps":[{"question":"如果我们要用选项 B 的 `Who` 来提问，那么回答应该是什么样的？","hint":"`Who` 是问“谁”，所以回答应该是关于某个人的。","takeaway":"如果用 `Who` 提问，回答可能是 `He is my brother.` (他是我哥哥)。"},{"question":"如果我们要用选项 C 的 `What` 来提问，回答又应该是什么样的？","hint":"`What` 是问“什么”，所以回答应该是关于某个事物或信息的。","takeaway":"如果用 `What` 提问，比如 `What is it?`，回答可能是 `It is a football.` (它是一个足球)。"},{"question":"对比一下，本题的回答是 `It's under the bed.`，它既不是人，也不是对“是什么”的回答，所以应该选哪个？","hint":"通过排除法，去掉不符合的选项。","takeaway":"回答是关于地点的，所以只能选择提问地点的 `Where`。"}]},{"title":"构建完整对话","steps":[{"question":"让我们把选项 A `Where` 填入空格，读一下完整的问句。","hint":"把 `Where` 放在句首，然后读 `is his football?`","takeaway":"完整的问句是 `Where is his football?` (他的足球在哪里？)。"},{"question":"现在，把问句和答句连起来读一遍：`— Where is his football? — It's under the bed.` 这个对话听起来通顺吗？","hint":"一问一答，意思能对上吗？","takeaway":"问“在哪里”，答“在床底下”，问答匹配，逻辑通顺，因此 `Where` 是正确答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"—Thank you very much! \n—_____","options":{"A":"You're right","B":"All right","C":"You are welcome","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查日常交际用语中如何回应感谢。当对方说“Thank you very much!”（非常感谢你！）时，最礼貌和常见的回应是表达“不客气”。选项 C “You are welcome”正是“不客气，不用谢”的意思，符合语境。选项 A “You're right”意为“你说得对”，用于赞同对方观点。选项 B “All right”意为“好的，行”，用于表示同意或接受建议。因此，只有 C 是正确答案。","knowledge_expansion_md":"在英语中，回应感谢的方式有很多种，可以根据语境和与对方的熟悉程度来选择使用：\n\n*   **通用且礼貌**: \n    *   `You're welcome.` (不客气)\n    *   `My pleasure.` / `It's my pleasure.` (我的荣幸)\n*   **非正式/口语化**: \n    *   `Not at all.` (别客气)\n    *   `Don't mention it.` (别提了)\n    *   `No problem.` (没问题)\n    *   `Anytime.` (随时乐意效劳)\n\n**易错点**：中国学生容易受到中文“没事”的影响而误用 `It's nothing`。虽然 `It's nothing` 也可以表示“没什么”，但在回应感谢时，`No problem` 或 `Not at all` 更为地道和常见。","socratic_tracks":[{"title":"情景交际：感谢与应答","steps":[{"question":"当别人对你说“谢谢”时，从礼貌的角度出发，我们通常会怎么回应？","hint":"想象一下在中文里，别人说“谢谢”，你会说“不客气”还是“你说得对”？","takeaway":"回应感谢时，我们通常会表达“不客气”或“我很乐意帮忙”的意思。"},{"question":"现在看看三个选项，哪一个选项是“不客气”的英文表达？","hint":"这是小学阶段学习的最基础的回答“谢谢”的方式。","takeaway":"“You are welcome”是“不客气”的标准英语表达。"}]},{"title":"选项含义辨析","steps":[{"question":"选项 A “You're right”是什么意思？它通常用在什么样的对话情景中？","hint":"当你的朋友说“今天天气真好”，而你也这么觉得时，你会怎么说？","takeaway":"“You're right”意为“你说得对”，用于表示同意对方的观点或陈述。"},{"question":"选项 B “All right”又是什么意思呢？它适合用在什么情景？","hint":"如果妈妈问你：“我们现在去公园，好吗？”，你可以怎么回答？","takeaway":"“All right”意为“好的，行”，常用于表示同意、接受安排或表示情况尚可。"},{"question":"比较一下，A 和 B 的意思适合用来回应“谢谢”吗？","hint":"回应感谢需要表达“不用谢”的含义，而 A 和 B 都没有这个意思。","takeaway":"“You're right”和“All right”的含义与回应感谢的语境不符。"}]},{"title":"拓展学习：更多“不客气”","steps":[{"question":"除了 “You are welcome”，你还知道或听过哪些表达“不客气”的方式吗？","hint":"可以想想在电影、动画片或者英文歌曲里听到的说法。","takeaway":"英语中有很多种方式来回应感谢，可以使我们的表达更丰富。"},{"question":"比如 “My pleasure” 这个说法，你觉得它表达的情感是怎样的？","hint":"“pleasure” 这个词本身是“荣幸、乐事”的意思。","takeaway":"“My pleasure”是一种非常礼貌且友好的回应，强调“帮助你是我很乐意做的事”。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"Which season do you like _____?","options":{"A":"better","B":"good","C":"best","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词最高级的用法。问句 “Which season do you like _____?” 意为“你最喜欢哪个季节？”。这里的选择范围是所有季节（通常是四个），即在三者或三者以上中进行比较，需要使用形容词的最高级形式。`good`（好的）的比较级是 `better`（更好的），最高级是 `best`（最好的）。因此，空格处应填 `best`。选项 A `better` 用于两者之间的比较。选项 B `good` 是原级，不用于比较。","knowledge_expansion_md":"形容词和副词有三种形式：原级、比较级和最高级。\n\n*   **原级 (Original Form)**: 用于描述事物自身，或用于 `as...as...` 结构中表示同等比较。例如：`This book is good.`\n*   **比较级 (Comparative Form)**: 用于两者之间的比较，常与 `than` 连用。例如：`This book is better than that one.`\n*   **最高级 (Superlative Form)**: 用于三者或三者以上范围内的比较，表示“最...”，常与 `the` 连用，并常跟 `in/of` 短语限定范围。例如：`This is the best book in our library.`\n\n**不规则变化**：\n*   good/well - better - best\n*   bad/ill - worse - worst\n*   many/much - more - most\n*   little - less - least","socratic_tracks":[{"title":"形容词最高级用法","steps":[{"question":"这个问题是在问你喜欢哪个季节。通常一年有几个季节？","hint":"春、夏、秋、冬，一共是四个。","takeaway":"这个问题是在四个季节中进行选择，也就是在多者中选一。"},{"question":"当我们在三个或更多的事物中进行比较，要选出“最...”的一个时，应该用形容词的什么形式？","hint":"比较两个人用比较级，那比较一个班的同学呢？","takeaway":"在三者或三者以上中进行比较，需要使用形容词的最高级形式。"},{"question":"“good”（好的）这个词的最高级形式是什么？","hint":"它的比较级是 “better”。想一想“最好”怎么说。","takeaway":"“good”的最高级是“best”，所以这里应该填“best”。"}]},{"title":"比较级 vs. 最高级","steps":[{"question":"选项 A “better” 是形容词的什么形式？它通常用在什么情况下？","hint":"“better” 的意思是“更好”，通常是两者相比得出的结论。","takeaway":"“better”是比较级，用于两者之间的比较。"},{"question":"如果题目是 “Which do you like better, spring or summer?”，为什么这里用 “better”？","hint":"注意题目中明确给出了几个选项？是春天和夏天两个。","takeaway":"当在两个明确的选项中进行选择时，我们通常使用比较级。"},{"question":"回到原题，“Which season do you like _____?”，为什么用最高级“best”比用比较级“better”更合适？","hint":"题目没有限定在两个季节里选，而是泛指所有季节。","takeaway":"当问题在一个大于二的隐含范围内（如此处指所有季节）进行选择时，应用最高级。"}]},{"title":"特殊疑问词 “Which”","steps":[{"question":"疑问词 “Which” 通常用来提问什么？","hint":"比如你面前有红色和蓝色两支笔，我会问你：“Which one do you want?”","takeaway":"“Which” 用于在有限的、特定的范围内进行选择。"},{"question":"当 “Which” 后面跟一个单数名词（如本题的 “season”）时，它是在暗示两者选择还是多者选择？","hint":"题目没有说“在...和...之中，你喜欢哪个季节”，而是直接问“你喜欢哪个季节”。","takeaway":"当 “Which” 引导的选择范围没有被明确限定为两者时，它通常指代一个类别中的所有成员。"},{"question":"既然是在所有季节中选出你“喜欢”的，那么这种“喜欢”的程度应该是怎样的？","hint":"是从所有选项中选出你最喜欢的那一个。","takeaway":"在多者中进行选择，自然是选出“最”喜欢的一个，因此需要使用最高级。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"The red car is _____ than the black one.","options":{"A":"nice","B":"nicer","C":"very nice","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词比较级的用法。句中出现了关键词 “than”，意为“比...”，是形容词比较级的标志性词语。这表明句子正在对“红色的车”（the red car）和“黑色的车”（the black one）进行比较。因此，我们需要使用形容词 “nice” 的比较级形式。`nice` 的比较级是 `nicer`。选项 A `nice` 是原级，选项 C `very nice` 是“原级+修饰词”，都不能用于 `...than...` 的比较结构中。","knowledge_expansion_md":"形容词比较级用于比较两者，其基本结构为：**A + be动词 + 形容词比较级 + than + B**。\n\n**形容词比较级的构成规则**：\n1.  **单音节词**：\n    *   一般在词尾加 `-er`，如 `tall - taller`。\n    *   以 `e` 结尾的，直接加 `-r`，如 `nice - nicer`。\n    *   重读闭音节（一个元音+一个辅音结尾）的，双写末尾辅音字母再加 `-er`，如 `big - bigger`, `hot - hotter`。\n2.  **双音节词**：\n    *   以 `y` 结尾的，变 `y` 为 `i` 再加 `-er`，如 `happy - happier`。\n    *   部分以 `-er`, `-ow`, `-le` 结尾的词，加 `-er`，如 `clever - cleverer`。\n    *   其他多数双音节词和所有多音节词，在词前加 `more`，如 `famous - more famous`, `beautiful - more beautiful`。\n\n**易错点**：不能将 `more` 和 `-er` 同时使用，例如 `more nicer` 是错误的。","socratic_tracks":[{"title":"比较级的标志 “than”","steps":[{"question":"仔细观察这个句子，你有没有发现一个表示“比较”的关键词？","hint":"这个词的中文意思是“比...”，连接了两个被比较的事物。","takeaway":"句子中的 “than” 是进行比较的明确标志。"},{"question":"当我们看到 “than” 时，它前面的形容词应该使用什么形式？是原级、比较级还是最高级？","hint":"“than” 引导的句型结构是“A 比 B 更...”，这个“更”字就对应了比较级。","takeaway":"看到 “than” 就要用形容词的比较级形式。"},{"question":"那么，形容词 “nice” 的比较级形式是什么？","hint":"对于以字母 “e” 结尾的单音节形容词，我们通常直接在词尾加 “-r”。","takeaway":"“nice” 的比较级是 “nicer”。"}]},{"title":"形容词三种形式的用法","steps":[{"question":"选项 A “nice” 是形容词的原级。它通常用在什么样的句子里？","hint":"比如，单纯描述一辆车很好看，我们会说：“The red car is nice.”","takeaway":"形容词原级用于直接描述事物，或者用在 “as...as...” 的同级比较结构中。"},{"question":"选项 C “very nice” 为什么不对？“very” 是用来修饰什么的？","hint":"“very” 的意思是“很”，用来加强形容词的语气。它能和表示“比...”的 “than” 一起用吗？","takeaway":"“very” 只能修饰形容词或副词的原级，不能修饰比较级，也不能直接用在 “than” 之前。"},{"question":"如果我们想表达“红色的车比黑色的车好得多”，应该怎么说？","hint":"我们可以用一些词来修饰比较级，比如 `much`, `a lot`, `far`。","takeaway":"要加强比较的程度，可以在比较级前加 `much` 或 `far`，例如 “much nicer” 或 “far nicer”。"}]},{"title":"比较级构成方法回顾","steps":[{"question":"我们知道 “nice” 的比较级是 “nicer”。那 “big” 的比较级是什么？为什么它的变化规则和 “nice” 不一样？","hint":"注意 “big” 这个词的结尾是“一个元音字母 + 一个辅音字母”。","takeaway":"“big” 是重读闭音节词，其比较级需要双写末尾辅音字母再加 “-er”，所以是 “bigger”。"},{"question":"那 “happy” 的比较级呢？它的结尾有什么特点？","hint":"“happy” 以“辅音字母 + y”结尾。","takeaway":"以“辅音字母 + y”结尾的形容词，需要变 “y” 为 “i” 再加 “-er”，所以是 “happier”。"},{"question":"像 “beautiful” 这样的长单词，它的比较级又该如何构成？","hint":"对于多音节的形容词，我们通常不在词尾做变化。","takeaway":"多音节形容词的比较级通常是在单词前面加上 “more”，所以是 “more beautiful”。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"It's very hot _____ summer in Beijing.","options":{"A":"on","B":"at","C":"in","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查时间介词的正确使用。在英语中，不同的时间介词与不同类型的时间名词搭配。介词 `in` 用于表示一段较长的时间，如年份（in 2024）、月份（in May）、季节（in summer）以及泛指的上午/下午/晚上（in the morning）。句子中的 `summer`（夏天）是一个季节，属于较长的时间段，因此应该使用介词 `in`。`on` 用于具体的某一天或日期。`at` 用于具体的时刻。","knowledge_expansion_md":"英语中三个最常用的时间介词 `in`, `on`, `at` 的用法可以总结为“由大到小”的规律：\n\n*   **in (在...里)**：用于较长的时间段。\n    *   **世纪**: in the 21st century\n    *   **年份**: in 1999\n    *   **季节**: in spring, in summer, in autumn, in winter\n    *   **月份**: in January\n    *   **泛指的一天中的某部分**: in the morning, in the afternoon, in the evening (但注意用 `at night`)\n\n*   **on (在...时/天)**：用于具体某一天或日期。\n    *   **星期**: on Monday, on weekends\n    *   **具体日期**: on June 1st\n    *   **特定的某一天**: on my birthday, on Christmas Day\n\n*   **at (在...时刻)**：用于精确的时间点。\n    *   **具体时刻**: at 8 o'clock, at 10:30 AM\n    *   **一些固定的时间点**: at noon, at night, at midnight\n    *   **节日期间**: at Christmas (指圣诞节期间，而 `on Christmas Day` 指圣诞节当天)","socratic_tracks":[{"title":"时间介词 “in” 的用法","steps":[{"question":"句子中的时间词 “summer” (夏天) 是指一个精确的时间点，还是一段持续的时间？","hint":"夏天通常会持续两三个月。","takeaway":"“summer” 是一个季节，代表一段较长的时间。"},{"question":"当我们谈论季节、月份、年份这些比较长的时间段时，通常用哪个介词？","hint":"回想一下“在五月”是 “in May”，“在2024年”是 “in 2024”。","takeaway":"介词 “in” 常用于表示季节、月份、年份等较长的时间段。"}]},{"title":"介词 “on” 和 “at” 的辨析","steps":[{"question":"介词 “on” 通常用在什么样的时间名词前面？","hint":"想一想“在星期一”或者“在我的生日那天”应该怎么说。","takeaway":"“on” 用于具体的某一天或日期前，例如 on Monday, on May 1st。"},{"question":"那么介词 “at” 又用在什么样的时间名词前面呢？","hint":"想一想“在8点钟”或者“在中午”应该怎么说。","takeaway":"“at” 用于表示具体的时刻，例如 at 8 o'clock, at noon。"},{"question":"根据 “on” 和 “at” 的用法，它们适合用在 “summer” 前面吗？","hint":"“summer” 既不是一个具体的日期，也不是一个精确的时刻。","takeaway":"“on” 和 “at” 都不适用于表示 “summer” 这样的季节。"}]},{"title":"介词用法口诀记忆","steps":[{"question":"为了方便记忆，我们常说“年、月、季节、上下午用 in”。你能用“春天”和“早上”分别举个例子吗？","hint":"在春天，在早上。","takeaway":"我们可以说 “in spring” 和 “in the morning”，这都遵循了用 “in” 的规则。"},{"question":"口诀的下一句是“具体日期、星期几用 on”。你能用“周三”和“六一儿童节”举个例子吗？","hint":"在周三，在六月一日。","takeaway":"我们可以说 “on Wednesday” 和 “on June 1st”，这都遵循了用 “on” 的规则。"},{"question":"口诀的最后是“具体时刻用 at”。你能用“午夜”和“七点半”举个例子吗？","hint":"在午夜，在七点三十分。","takeaway":"我们可以说 “at midnight” 和 “at 7:30”，这都遵循了用 “at” 的规则。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Can you sing the song in English? \n—No, I _____.","options":{"A":"can't","B":"mustn't","C":"needn't","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这是一道关于情态动词的问答题。问句 “Can you...?” 是用来询问对方是否具备某种能力或请求许可。根据对话语境，回答 “No” 表示否定，因此需要使用 “can” 的否定形式 “can't”（can not），表示“我不会”。选项 B “mustn't” 意为“禁止，不许”，选项 C “needn't” 意为“不必”，均不符合题意。因此，正确的回答是 “No, I can't.”。","knowledge_expansion_md":"### 情态动词问答的“原词应答”原则与特例\n\n1.  **一般原则**：大多数情况下，用什么情态动词提问，就用相应的情态动词来回答。\n    *   `—Can you swim? —Yes, I can. / No, I can't.`\n    *   `—Will he come? —Yes, he will. / No, he won't.`\n\n2.  **常见特例**：\n    *   **`May I ...?`** (请求许可): 肯定回答用 `Yes, you may.` 或 `Yes, you can.`。否定回答通常用 `No, you can't.` (不可以) 或 `No, you mustn't.` (禁止，语气更强)，一般不用 `may not`。\n    *   **`Must I ...?`** (询问必要性): 肯定回答用 `Yes, you must.`。否定回答表示“不必”，应用 `No, you needn't.` 或 `No, you don't have to.`，而不能用 `mustn't` (禁止)。\n\n3.  **情态动词辨析**：\n    *   `can/can't`: 表示能力 (会/不会)、许可 (可以/不可以)。\n    *   `must/mustn't`: 表示义务/命令 (必须)、禁止 (不准)。\n    *   `need/needn't`: 表示必要性 (需要/不必)。","socratic_tracks":[{"title":"情态动词的问答配对","steps":[{"question":"请看问句，它是用哪个词开头的？这个词通常是用来问什么的？","hint":"这个词是 C-A-N，通常用来问“能不能”、“会不会”。","takeaway":"问句以情态动词 `Can` 开头，询问的是能力。"},{"question":"回答是 “No”，表示否定。那么，我们应该用 `can` 的肯定形式还是否定形式来回答呢？","hint":"“不，我...” 后面应该跟“会”还是“不会”？","takeaway":"否定回答需要使用情态动词的否定形式。"},{"question":"`can` 的否定形式是什么？在 A, B, C 三个选项中，哪一个是正确的？","hint":"`can` 的否定形式是 `can not`，缩写为 `can't`。","takeaway":"用 `Can` 提问，否定回答用 `can't`，这是最直接的配对规则。"}]},{"title":"辨析 can't, mustn't, needn't","steps":[{"question":"题目问的是“你会用英语唱这首歌吗？”。如果你的回答是“不”，你最想表达的意思是“我不会唱”、“我不被允许唱”还是“我没必要唱”？","hint":"这个问题是关于你的歌唱能力的。","takeaway":"语境是关于个人能力，所以回答也应围绕“会”或“不会”。"},{"question":"`can't`, `mustn't`, `needn't` 这三个词分别是什么意思？哪个词是“不会”的意思？","hint":"可以回忆一下：`must` 是“必须”，`need` 是“需要”。","takeaway":"`can't` 表示“不能/不会”，`mustn't` 表示“禁止”，`needn't` 表示“不必”。"},{"question":"那么，为了准确表达“我不会”这个意思，应该选择哪个选项？","hint":"选择与“不会”意思相同的那个词。","takeaway":"理解情态动词的准确含义是正确选择的关键。"}]},{"title":"模拟生活对话","steps":[{"question":"如果有人问你 “Can you play the piano?”，但你并不会弹钢琴，你会怎么回答？","hint":"用我们刚刚学到的 `can` 的问答方式来回答。","takeaway":"在实际交流中，`Can you...?` 的否定回答就是 `No, I can't.`。"},{"question":"如果图书馆的牌子上写着 “You mustn't eat here.”，这是什么意思？","hint":"`mustn't` 表示一种强烈的禁止。","takeaway":"`mustn't` 用于表达“禁止，不准许”，表示规则或命令。"},{"question":"如果妈妈说 “It's Sunday. You needn't get up early.”，这是说你“必须早起”、“不准早起”还是“不必早起”？","hint":"`needn't` 表示没有必要做某事。","takeaway":"`needn't` 用于表达“不必”，表示缺乏必要性。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"—What did you do last weekend? \n—I did my homework and _____ TV.","options":{"A":"watch","B":"watched","C":"am watching","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"这是一道考查动词时态的题目。问句中的关键词 “did” 和时间状语 “last weekend”（上周末）明确指出，对话讨论的是过去发生的事情，因此整个句子都应使用一般过去时。回答中，连词 “and” 连接了两个并列的动作：“did my homework” 和 “_____ TV”。根据并列结构时态一致的原则，既然第一个动词 “did” 是过去式，那么第二个动词也必须是过去式。动词 “watch” 的过去式是 “watched”。因此，正确答案是 B。","knowledge_expansion_md":"### 一般过去时与并列结构\n\n1.  **一般过去时的标志**：\n    *   **时间状语**：`yesterday`, `last night/week/month/year`, `two days ago`, `in 2010`, `just now` 等表示过去的时间词或短语。\n    *   **上下文**：问句或前文使用了过去时态（如本题中的 `did`），后续的陈述也应保持一致。\n\n2.  **一般过去时的构成**：\n    *   **规则动词**：在动词原形后加 `-ed`。例如：`watch` -> `watched`, `play` -> `played`, `study` -> `studied`。\n    *   **不规则动词**：有其特定的过去式形式，需要专门记忆。例如：`do` -> `did`, `go` -> `went`, `see` -> `saw`, `eat` -> `ate`。\n\n3.  **并列连词与时态一致**：\n    *   当连词 `and`, `but`, `or`, `so` 等连接两个或多个并列的谓语动词时，这些动词的时态通常需要保持一致，以确保句子逻辑清晰、结构平衡。\n    *   **例句**：`He came in, took off his coat, and sat down.` (他走进来，脱下外套，然后坐下。) 三个动词 `came`, `took`, `sat` 都是过去式。","socratic_tracks":[{"title":"抓住时态的“信号灯”","steps":[{"question":"在问句 “What did you do last weekend?” 中，有哪些词可以告诉我们这件事是什么时候发生的？","hint":"注意句中的助动词和表示时间的短语。","takeaway":"助动词 `did` 和时间状语 `last weekend` 都是过去时的明确信号。"},{"question":"既然是发生在“上周末”的事情，我们应该用什么时态来描述这个动作？","hint":"描述过去发生的事情，通常用什么时态？","takeaway":"描述过去特定时间发生的动作，应使用一般过去时。"},{"question":"动词 “watch” 的一般过去时形式是什么？","hint":"这是一个规则动词，想一想规则动词变过去式的方法。","takeaway":"规则动词的过去式通常是在原形后加 `-ed`，所以 `watch` 变为 `watched`。"}]},{"title":"“and”连接的好朋友","steps":[{"question":"在答句中，连词 “and” 连接了哪两个动作？","hint":"“and” 前面是“做作业”，后面是“看电视”。","takeaway":"`and` 连接了 `did my homework` 和 `_____ TV` 这两个并列的动作。"},{"question":"“and” 前面的动词 “did” 是什么时态？","hint":"`did` 是哪个动词的过去式？","takeaway":"`did` 是 `do` 的过去式，表明第一个动作发生在过去。"},{"question":"“and” 就像一座天平，两边的结构和时态最好保持一致。既然前面的动词是过去式，那么后面的动词也应该是...？","hint":"为了保持平衡，后面的动词时态应该和前面一样。","takeaway":"并列连词 `and` 连接的动词，时态需要保持一致。"}]},{"title":"逐个击破干扰项","steps":[{"question":"我们来看看选项 A “watch”。这是动词的什么形式？它可以用在描述“上周末”的句子里吗？","hint":"`watch` 是动词原形，通常用于一般现在时或情态动词后。","takeaway":"动词原形 `watch` 与过去的时间 `last weekend` 不匹配。"},{"question":"再看选项 C “am watching”。这是什么时态？它表示什么时候的动作？","hint":"带有 `be` 动词和 `-ing` 的是进行时。","takeaway":"`am watching` 是现在进行时，表示“现在正在看”，与过去的时间不符。"},{"question":"排除了 A 和 C，剩下的 B 选项 “watched” 是什么时态？它符合题意吗？","hint":"`watched` 是过去式。","takeaway":"通过排除法，可以确认只有过去式 `watched` 符合句子的时态要求。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"I like drawing pictures and she _____.","options":{"A":"like to sing","B":"likes singing","C":"like singing","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查两个核心知识点：主谓一致和动词 `like` 的用法。首先，句子的后半部分主语是 `she`，这是一个第三人称单数代词。在一般现在时中，当主语是第三人称单数时，谓语动词需要使用其单数形式，即在动词原形后加 `-s`。因此，`like` 应变为 `likes`，这样就可以排除选项 A 和 C。其次，动词 `like` 后面可以跟动名词（doing 形式）或动词不定式（to do 形式）作宾语。选项 B `likes singing` 不仅主谓一致正确，而且与前半句的 `like drawing` 在结构上形成了平行，使得句子更加优美、对称。因此，B 是最佳答案。","knowledge_expansion_md":"### 主谓一致与 `like` 的用法\n\n1.  **主谓一致的核心——第三人称单数**：\n    *   在一般现在时中，当主语是 `he`, `she`, `it`, 单个人名/地名，或单个可数名词/不可数名词时，谓语动词要加 `-s` 或 `-es`。\n    *   **动词变化规则**：\n        *   一般情况加 `-s`：`like` -> `likes`, `work` -> `works`。\n        *   以 `s, x, ch, sh, o` 结尾的加 `-es`：`go` -> `goes`, `watch` -> `watches`。\n        *   以“辅音字母 + y”结尾的，变 `y` 为 `i` 再加 `-es`：`study` -> `studies`。\n\n2.  **`like doing` vs `like to do`**：\n    *   `like doing sth.` (动名词): 更侧重于描述一种长期、习惯性的爱好或享受某个过程。例：`I like swimming.` (我喜欢游泳这项运动)。\n    *   `like to do sth.` (不定式): 更多指某次具体的、特定的喜好，或一种想法、选择。例：`I like to swim in the morning.` (我喜欢在早上游泳)。\n    *   在很多日常对话中，两者可以互换，但了解其细微差别有助于更精确地表达。\n\n3.  **并列结构的平行性 (Parallelism)**：\n    *   使用 `and`, `but`, `or` 等连词连接的成分，在语法结构上最好保持一致，这是一种高级的写作技巧。\n    *   例：`My hobbies are reading books and listening to music.` (都是动名词短语)","socratic_tracks":[{"title":"主语和动词的“握手”规则","steps":[{"question":"请看空格前的那个词 `she`。它在句子中做什么成分？是第几人称？是单数还是复数？","hint":"`she` 是“她”的意思，是句子的主语。","takeaway":"句子的主语是 `she`，即第三人称单数。"},{"question":"当主语是第三人称单数，并且句子描述的是一个普遍的喜好（一般现在时）时，后面的动词 `like` 应该有什么变化？","hint":"想一想“三单”动词的变化规则。","takeaway":"主语为第三人称单数时，一般现在时的谓语动词需加 `-s` 或 `-es`。"},{"question":"根据这个规则，`like` 应该变成 `likes`。现在看看 A, B, C 三个选项，哪些可以被直接排除了？","hint":"找出动词不是 `likes` 的选项。","takeaway":"主谓不一致的选项 A 和 C 是错误的，可以直接排除。"}]},{"title":"“喜欢做某事”的表达","steps":[{"question":"在英语中，如果想在动词 `like` 后面再加一个动作，比如“唱歌”(sing)，这个动词 `sing` 需要变成什么形式？","hint":"有两种常见的形式，一种是加 `-ing`，一种是前面加 `to`。","takeaway":"动词 `like` 后面可以跟动名词（`doing`）或不定式（`to do`）。"},{"question":"那么，`likes singing` 和 `likes to sing` 这两种说法在语法上都正确吗？","hint":"是的，它们都表示“喜欢唱歌”。","takeaway":"从语法搭配上讲，`likes singing` 和 `likes to sing` 都是正确的。"},{"question":"结合上一个“主谓一致”的结论，哪个选项是唯一正确的选择？","hint":"哪个选项既满足主谓一致，又满足 `like` 的搭配规则？","takeaway":"综合考虑主谓一致和 `like` 的用法，只有 `likes singing` 符合所有条件。"}]},{"title":"让句子更优美的“对称”魔法","steps":[{"question":"我们来看句子的前半部分 “I like drawing pictures”。这里 `like` 后面跟的是什么形式的词？","hint":"注意 `drawing` 是 `draw` 的什么形式？","takeaway":"前半句使用了 `like + doing` (动名词) 的结构。"},{"question":"连词 `and` 连接了句子的两部分。为了让整个句子读起来更通顺、结构更平衡，后半句最好也使用什么结构？","hint":"前面是 `like drawing`，后面最好也是 `likes ...ing`。","takeaway":"在 `and` 连接的并列结构中，保持形式上的平行或对称，能让句子更地道。"},{"question":"因此，从“平行结构”这个角度看，`likes singing` 和 `likes to sing` 哪个是更好的选择？","hint":"选择与 `like drawing` 结构更相似的那个。","takeaway":"选择 `likes singing` 不仅语法正确，而且符合平行结构的原则，是最佳答案。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"Wu Ming is a girl. She _____ long hair.","options":{"A":"has","B":"was","C":"have","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查动词 `have` 表示“拥有”的用法以及主谓一致。句子的意思是“她有长头发”，是在描述人物的外貌特征。在英语中，表示“拥有”某物时，我们使用实义动词 `have`。本句的主语是 `She`（她），是第三人称单数。根据一般现在时的主谓一致原则，当主语是第三人称单数时，动词 `have` 必须使用其特殊形式 `has`。选项 B `was` 是 `be` 动词的过去式，意为“是”，用于描述身份或状态，不符合句意。选项 C `have` 用于第一人称（I/we）、第二人称（you）和复数主语（they），不能用于 `She`。因此，正确答案是 A。","knowledge_expansion_md":"### `have/has` (拥有) vs `be` (是)\n\n1.  **`have/has` 表示“拥有”**：\n    *   作为实义动词，`have/has` 用来表示主语拥有某个物品、身体部位、亲属关系等。\n    *   **用法**：\n        *   主语为 `I`, `you`, `we`, `they` 或复数名词时，用 `have`。例：`We have a big classroom.`\n        *   主语为 `he`, `she`, `it` 或单数名词时，用 `has`。例：`The dog has four legs.`\n\n2.  **`be` 动词 (am/is/are) 表示“是”**：\n    *   `be` 动词用来连接主语和表语，说明主语的身份、性质、状态或位置。\n    *   **用法**：\n        *   `I` 用 `am`。例：`I am a student.`\n        *   `he`, `she`, `it` 或单数名词用 `is`。例：`She is happy.`\n        *   `you`, `we`, `they` 或复数名词用 `are`。例：`They are in the park.`\n\n3.  **描述外貌的两种句型**：\n    *   **`主语 + be + 形容词`**: 用来描述人的高矮、胖瘦、长相等特征。例：`He is tall.` (他很高。)\n    *   **`主语 + have/has + (形容词) + 名词`**: 用来描述人拥有的身体部位。例：`She has long hair.` (她有长头发。) `He has big eyes.` (他有大眼睛。)","socratic_tracks":[{"title":"“是”还是“有”？","steps":[{"question":"句子 “She _____ long hair.” 是想表达“她是长头发”还是“她拥有长头发”？","hint":"长头发是她身体的一部分，是她“拥有”的。","takeaway":"描述身体部位时，我们用“拥有”而不是“是”。"},{"question":"在英语中，哪个动词表示“拥有”？","hint":"这个词有两个常见形式，一个是 h-a-v-e。","takeaway":"表示“拥有”的动词是 `have`。"},{"question":"选项 B `was` 是什么意思？它符合“拥有”这个意思吗？","hint":"`was` 是 `is` 的过去式。","takeaway":"`was` 意为“是”，与句意不符，因此可以排除。"}]},{"title":"`have` 的变形记","steps":[{"question":"我们确定了要用表示“拥有”的动词 `have`。那么请看句子的主语是谁？","hint":"句子的开头就是主语。","takeaway":"句子的主语是 `She`。"},{"question":"`She` 是第几人称？是单数还是复数？","hint":"`She` 指“她”，是一个人。","takeaway":"`She` 是第三人称单数。"},{"question":"当主语是第三人称单数时，动词 `have` 应该变成什么特殊形式？","hint":"它不是简单地加-s，而是一个不规则的变化。","takeaway":"动词 `have` 在主语是第三人称单数时，要变为 `has`。"}]},{"title":"描述外貌的句型","steps":[{"question":"如果想说“他很高”，应该用 `He is tall.` 还是 `He has tall.`？","hint":"`tall` (高的) 是一个形容词，用来描述状态。","takeaway":"描述人的特征用 `be + 形容词` 的句型。"},{"question":"如果想说“他有蓝色的眼睛”，应该用 `He is blue eyes.` 还是 `He has blue eyes.`？","hint":"`blue eyes` (蓝色的眼睛) 是一个名词短语，是他“拥有”的。","takeaway":"描述人拥有的身体部位用 `have/has + 名词` 的句型。"},{"question":"回到原题，“她有长头发”，应该用 `She is long hair.` 还是 `She has long hair.`？","hint":"套用我们刚刚总结的规律。","takeaway":"正确描述“有长头发”的句型是 `She has long hair.`。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"He is going _____ artist in the future.","options":{"A":"to be a","B":"to be an","C":"an","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查 be going to 结构和不定冠词的用法。\n1.  句子 “He is going...” 提示了这是一个表示将来计划的句子，应该使用 “be going to do sth.” 结构，意思是“将要做某事”。这里的动词原形是 be，所以应该是 “to be”。\n2.  横线后面是名词 “artist”（艺术家），它是一个可数名词单数，表示职业，前面需要加不定冠词 a 或 an。\n3.  “artist” 的首字母 a 是元音，发音为 /ɑː/（元音音素），所以它前面应该用不定冠词 an。\n4.  综合以上两点，正确的形式是 “to be an”。","knowledge_expansion_md":"### 1. be going to 结构\n- **用法**：表示事先经过考虑、有计划或有迹象表明将要发生的动作。常翻译为“打算做某事”或“即将发生”。\n- **结构**：主语 + be (am/is/are) + going to + 动词原形。\n- **与 will 的区别**：\n  - `be going to` 强调**计划和意图**。例：*I am going to visit my grandparents next week.* (我已经计划好了)\n  - `will` 常用于表示**临时的决定、预测或承诺**。例：*The phone is ringing. I'll get it.* (临时决定)\n\n### 2. 不定冠词 a/an 的用法\n- **基本规则**：不定冠词用在单数可数名词前，表示“一个”。\n  - `a` 用在以**辅音音素**开头的单词前。例：*a book, a car, a university* (university /juːnɪˈvɜːsəti/ 以辅音 /j/ 开头)。\n  - `an` 用在以**元音音素**开头的单词前。例：*an apple, an egg, an hour* (hour /aʊə(r)/ 的 h 不发音，以元音 /aʊ/ 开头)。\n- **关键**：判断用 a 还是 an 的依据是单词的**发音**，而不是**拼写**。","socratic_tracks":[{"title":"将来时态结构","steps":[{"question":"看到句子中的 'is going' 和 'in the future'，你认为这个句子想表达什么时间发生的事？","hint":"“in the future” 是“在将来”的意思。","takeaway":"这个句子使用 'be going to' 结构来表达一个将来的计划或打算。"},{"question":"'be going to' 是一个固定短语，它后面应该跟什么形式的动词？","hint":"想一想“我打算去游泳”怎么说：I am going to ___ (swim).","takeaway":"'be going to' 后面必须跟动词原形（infinitive），所以这里需要 'to be'。"}]},{"title":"不定冠词 a/an","steps":[{"question":"横线后面的单词 'artist' 是一个表示职业的名词，它前面需要加冠词吗？","hint":"当我们说“他是一名医生”时，英文是 'He is a doctor'。","takeaway":"在表示职业的单数可数名词前，通常需要加不定冠词 a 或 an。"},{"question":"那么在 'artist' 前面，我们应该用 'a' 还是 'an' 呢？判断的依据是什么？","hint":"关键是看单词开头的发音，是元音发音还是辅音发音。","takeaway":"判断用 a 还是 an 的依据是单词开头的音素，'artist' 以元音音素 /ɑː/ 开头，所以用 an。"}]},{"title":"选项排除","steps":[{"question":"为什么选项 C 'an' 是不完整的？","hint":"只填 'an' 的话，句子变成了 'He is going an artist...'，这个句子结构通顺吗？","takeaway":"缺少了动词 'to be'，句子结构不完整，'be going to' 是一个固定搭配。"},{"question":"为什么选项 A 'to be a' 是错误的？","hint":"请读一下 'a artist'，再读一下 'an artist'，哪个更顺口？为什么？","takeaway":"选项 A 错在冠词的使用上，'artist' 以元音音素开头，必须使用 'an' 而不是 'a'。"}]}]}}]},{"section_title":"IV. 把下列英文句子与所对应的中文意思代号填到括号里。(共10分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"有多少件礼物？","options":{"A":"How many balloons?","B":"How many gifts?","C":"How many bears?","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考察对疑问句和核心名词的翻译。\n1.  中文句子“有多少件礼物？”是一个询问数量的问句。\n2.  “有多少”对应英文中的“How many”，用于提问可数名词的数量。\n3.  句子的核心词汇是“礼物”，其英文单词是“gift”。因为“How many”后面要跟名词的复数形式，所以应该是“gifts”。\n4.  将以上两部分组合起来，就是“How many gifts?”。\n5.  选项A意为“有多少个气球？”，选项C意为“有多少只熊？”，均与题意不符。","knowledge_expansion_md":"### 1. \"How many\" vs. \"How much\"\n- **How many**: 用于提问**可数名词**的数量，后面跟名词的**复数形式**。\n  - 例：*How many books do you have?* (你有多少本书？)\n- **How much**: 用于提问**不可数名词**的数量或事物的**价格**。\n  - 例：*How much water is in the bottle?* (瓶子里有多少水？)\n  - 例：*How much is this T-shirt?* (这件T恤多少钱？)\n\n### 2. 常见物品名词（复数形式）\n- `gift` -> `gifts` (礼物)\n- `balloon` -> `balloons` (气球)\n- `bear` -> `bears` (熊)\n- `candle` -> `candles` (蜡烛)\n- `card` -> `cards` (卡片)\n- `flower` -> `flowers` (花)\n- `present` -> `presents` (礼物，与gift同义)","socratic_tracks":[{"title":"疑问词辨析","steps":[{"question":"中文“有多少”是用来问什么的？","hint":"当我们问“有多少个苹果”时，我们想知道的是苹果的...","takeaway":"“有多少”是用来询问数量的。"},{"question":"在英语中，询问可数事物的数量时，我们用哪个疑问短语开头？","hint":"询问“多少钱”用 'How much'，那询问“多少个”呢？","takeaway":"询问可数名词的数量时，我们用 'How many'。"}]},{"title":"核心词汇匹配","steps":[{"question":"题目中的核心物品“礼物”用英语怎么说？","hint":"生日时收到的东西叫什么？","takeaway":"“礼物”的英文是 'gift' 或 'present'。"},{"question":"在使用 'How many' 提问时，后面的名词应该用单数形式还是复数形式？","hint":"既然是问“多少个”，数量很可能不止一个。","takeaway":"'How many' 后面必须跟可数名词的复数形式，所以是 'gifts'。"}]},{"title":"排除错误选项","steps":[{"question":"选项 A 'How many balloons?' 翻译成中文是什么意思？","hint":"'balloon' 是派对上常见的一种装饰品，可以吹起来飘在空中。","takeaway":"选项 A 的意思是“有多少个气球？”，与题意不符。"},{"question":"选项 C 'How many bears?' 翻译成中文是什么意思？","hint":"'bear' 是一种动物，比如泰迪熊 (teddy bear)。","takeaway":"选项 C 的意思是“有多少只熊？”，也与题意不符。"},{"question":"排除了 A 和 C 之后，哪个是正确答案？","hint":"剩下的选项 B 'How many gifts?' 完美匹配了“有多少件礼物？”的意思。","takeaway":"通过排除法，可以确认选项 B 是唯一正确的答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"Zip, 这是你的礼物。","options":{"A":"This is for you, Zip.","B":"This is Zip.","C":"Here it is.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考察赠送礼物时的情景对话表达。\n1.  中文句子“Zip, 这是你的礼物。”包含两个部分：称呼对象“Zip”和表达“这是给你的礼物”。\n2.  选项 A “This is for you, Zip.” 意为“Zip，这是给你的。”，其中 “for you” 明确表达了“为你准备的，给你的”这层含义，并且句末的 “, Zip” 是对 Zip 的称呼，完全符合题意，是一种非常地道和礼貌的表达方式。\n3.  选项 B “This is Zip.” 意为“这位是Zip”，用于向他人介绍Zip，场景不符。\n4.  选项 C “Here it is.” 意为“给你”或“东西在这里”，常用于递交物品，但它没有体现出称呼“Zip”，也不如选项A中“for you”所表达的“为你准备”的心意强烈。","knowledge_expansion_md":"### 1. 赠送物品时的常用表达\n- **This is for you. / This is a gift for you.** (这是给你的。/ 这是给你的礼物。) -> 强调这是特意为你准备的。\n- **I got something for you.** (我给你带了点东西。) -> 比较口语化和亲切的说法。\n- **Here you are. / Here you go.** (给你。) -> 多用于日常递交物品，如找零、递文件等，也可以用于送礼物，但不如 'for you' 有心意。\n- **Here it is.** (东西在这儿。/ 给你。) -> 当对方在找某物，你找到了并递给他时常用。\n\n### 2. 呼格 (Vocative)\n- 在句子中，用于称呼某人或某物的词语就是呼格。\n- 在英文写作中，呼格通常用逗号与句子的其他部分隔开。\n- 它可以放在句首、句中或句末。\n  - 句首：*Zip, this is for you.*\n  - 句末：*This is for you, Zip.*\n  - 句中：*This, Zip, is for you.* (较少见)","socratic_tracks":[{"title":"理解句子功能","steps":[{"question":"“Zip, 这是你的礼物”这句话是在什么场景下说的？说话的人想做什么？","hint":"想象一下生日派对上，朋友拿出礼物对你说...","takeaway":"这句话的功能是“赠送礼物”，即把一件东西送给一个叫 Zip 的人。"},{"question":"一个完整的赠送礼物的表达，需要包含哪些信息？","hint":"对谁说？送的是什么？","takeaway":"需要包含称呼（对谁说）和赠送的意图（这是给你的）。"}]},{"title":"辨析选项含义","steps":[{"question":"选项 B 'This is Zip.' 是什么意思？用在什么场合？","hint":"当你向妈妈介绍你的新朋友 Zip 时，你会怎么说？","takeaway":"'This is Zip.' 的意思是“这位是Zip”，用于介绍人物，与送礼物无关。"},{"question":"选项 C 'Here it is.' 是什么意思？它和题目的意思完全一样吗？","hint":"你帮同桌找到了他丢失的橡皮，递给他时可以怎么说？","takeaway":"'Here it is.' 意为“给你”，但缺少了对 Zip 的称呼，不如选项 A 贴切。"},{"question":"现在来看选项 A 'This is for you, Zip.'，它是否完整地表达了题目的意思？","hint":"'for you' 是“给你的”意思，句末还有称呼。","takeaway":"选项 A 既有赠送的意图 'for you'，又明确了对象 'Zip'，是最佳选项。"}]},{"title":"地道口语表达","steps":[{"question":"在英语中，把东西递给别人时，最常用的两个短语是什么？","hint":"以 'Here' 开头，在商店购物结账后，店员递给你商品时常说。","takeaway":"最常用的是 'Here you are.' 和 'Here you go.'。"},{"question":"那么 'Here you are.' 和 'This is for you.' 在送礼物时有什么细微差别吗？","hint":"哪个听起来更像是特意准备的惊喜？","takeaway":"'This is for you.' 更能强调这份礼物是“为你而准备”的心意，比单纯的递交动作 'Here you are.' 情感更丰富。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"生日快乐！","options":{"A":"Happy New Year!","B":"Thank you!","C":"Happy birthday!","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考察最基础的节日祝福语的英文表达。\n1.  中文“生日快乐！”是祝贺别人生日的固定用语。\n2.  在英文中，与“生日快乐”完全对应的表达就是“Happy birthday!”。\n3.  选项 A “Happy New Year!” 的意思是“新年快乐！”，用于庆祝新年。\n4.  选项 B “Thank you!” 的意思是“谢谢你！”，通常是别人对自己说出祝福后，自己作出的感谢回应。\n5.  因此，只有选项 C 是正确的翻译。","knowledge_expansion_md":"### 1. 常见的英文祝福语 (Greetings & Wishes)\
