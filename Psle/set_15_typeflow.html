n- **生日**: *Happy birthday!* (生日快乐！)\n- **新年**: *Happy New Year!* (新年快乐！)\n- **圣诞节**: *Merry Christmas!* (圣诞快乐！)\n- **感谢**: *Thank you! / Thanks!* (谢谢你！)\n- **祝贺**: *Congratulations!* (恭喜你！)\n- **祝愿好运**: *Good luck!* (祝你好运！)\n- **节日通用**: *Happy holidays!* (节日快乐！)\n\n### 2. 祝福与回应\n- 别人对你说祝福语，例如 *Happy birthday!*，最常见和礼貌的回答是 *Thank you!*。\n- 这是一个基本的社交对话模式：\n  - A: *Happy birthday, Tom!* (汤姆，生日快乐！)\n  - B: *Thank you, Mary!* (谢谢你，玛丽！)","socratic_tracks":[{"title":"核心词汇匹配","steps":[{"question":"“生日快乐”这个祝福语中，核心的词是哪一个？","hint":"这个祝福是关于哪一天的？","takeaway":"核心词是“生日”。"},{"question":"“生日”这个词的英文是什么？","hint":"它由 'birth' (出生) 和 'day' (天) 两个词组合而成。","takeaway":"“生日”的英文是 'birthday'。"},{"question":"现在看三个选项，哪个选项里包含了 'birthday' 这个词？","hint":"仔细看每个选项的拼写。","takeaway":"只有选项 C 'Happy birthday!' 包含了 'birthday'，因此它是正确答案。"}]},{"title":"功能与场景辨析","steps":[{"question":"选项 A 'Happy New Year!' 是在什么节日说的？","hint":"'New Year' 指的是新的一年。","takeaway":"'Happy New Year!' 是在元旦或中国新年时说的“新年快乐！”"},{"question":"选项 B 'Thank you!' 是用来做什么的？是发出祝福还是回应祝福？","hint":"当别人送你礼物或祝你生日快乐时，你应该说什么？","takeaway":"'Thank you!' 是用来表达感谢的，是收到祝福后的回应，而不是祝福本身。"},{"question":"那么，要表达“生日快乐”这个祝福，应该选择哪个选项？","hint":"排除了用于新年的 A 和用于感谢的 B 之后，只剩下 C。","takeaway":"选项 C 'Happy birthday!' 是专门用于祝贺生日的，完全符合题意。"}]},{"title":"祝福语结构","steps":[{"question":"观察 'Happy birthday!' 和 'Happy New Year!'，你发现这类祝福语有什么共同的结构吗？","hint":"它们都以同一个单词开头。","takeaway":"很多节日的祝福语都是用 'Happy' + 节日名称构成的。"},{"question":"是不是所有的节日祝福都用 'Happy' 呢？想一想圣诞节我们怎么说？","hint":"听过圣诞歌曲吗？里面唱的是 'We wish you a ___ Christmas'。","takeaway":"不全是，比如圣诞节我们通常说 'Merry Christmas!'，用 'Merry' 来表示“愉快的，欢乐的”。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"一个蛋糕。","options":{"A":"One cake.","B":"One cakes.","C":"No cake.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"题干“一个蛋糕”翻译成英文时，需要注意数词和名词的搭配关系。“一个”对应英文中的 “one”，是单数。因此，它后面修饰的名词“蛋糕 (cake)”也必须使用单数形式。选项 A “One cake” 中，one 和 cake 都是单数，搭配正确。选项 B “One cakes” 中，cakes 是复数形式，与 one 搭配错误。选项 C “No cake” 意为“没有蛋糕”，与题干意思不符。所以，正确答案是 A。","knowledge_expansion_md":"### 知识点拓展：数词与可数名词的单复数搭配\n\n1.  **基数词 + 可数名词**：\n    *   当基数词是 `one` 或 `a/an` 时，后面的可数名词用**单数**形式。例如：`one apple` (一个苹果), `a boy` (一个男孩)。\n    *   当基数词大于1时（如 `two`, `three`, `ten` 等），后面的可数名词用**复数**形式。例如：`two apples` (两个苹果), `ten boys` (十个男孩)。\n\n2.  **可数名词与不可数名词**：\n    *   **可数名词**：指可以计数的事物，有单数和复数形式。如 `book/books`, `egg/eggs`。\n    *   **不可数名词**：指不能计数的事物，通常只有一种形式，不能直接加 `a/an` 或与大于1的数词连用。如 `water` (水), `rice` (米饭), `information` (信息)。\n\n3.  **特殊情况**：\n    *   有些名词（如 `cake`）既可作可数名词（指“一个一个的蛋糕”），也可作不可数名词（指“作为一种物质的蛋糕”）。例如：\n        *   `I want to buy a cake.` (我想买一个蛋糕。——可数)\n        *   `Would you like some cake?` (你想来点蛋糕吗？——不可数)","socratic_tracks":[{"title":"数词与名词匹配","steps":[{"question":"中文“一个”在数量上表示几？","hint":"这是我们数数时的第一个数字。","takeaway":"“一个”表示数量为1，在英文中对应 “one”。"},{"question":"当数量是“1”时，它后面的名词应该用单数形式还是复数形式？例如，我们是说 “one book” 还是 “one books”？","hint":"回想一下你学过的最简单的表达，比如“一只猫”。","takeaway":"数量为1时，后面的可数名词要用单数形式。"},{"question":"现在看选项，“cake”是单数，“cakes”是复数。根据上面的规则，“One”应该和哪个搭配？","hint":"将“蛋糕”替换成“书”来思考一下。","takeaway":"“One”必须和单数名词“cake”搭配，所以“One cake”是正确的。"}]},{"title":"选项辨析","steps":[{"question":"我们来看看选项B，“One cakes”。你觉得它在语法上有什么问题吗？","hint":"注意 “One” 和 “cakes” 在数量上是否一致。","takeaway":"“One”是单数，而“cakes”是复数，两者在数量上不匹配，所以是错误的。"},{"question":"再看选项C，“No cake”。它翻译成中文是什么意思？和题干“一个蛋糕”的意思一样吗？","hint":"“No” 这个词是否定含义，表示“没有”。","takeaway":"“No cake”意为“没有蛋糕”，与题干的意思完全相反。"}]},{"title":"可数名词概念","steps":[{"question":"“蛋糕 (cake)”这个东西，我们可以一个一个地数吗？比如“一个蛋糕，两个蛋糕”？","hint":"能用数字去计数的名词就是可数名词。","takeaway":"“蛋糕”可以作为可数名词来使用。"},{"question":"对于可数名词，当我们要表达“一个”的时候，除了用“one”，还可以用哪个词？","hint":"我们常说“一本书”是 “a book”，“一个苹果”是 “an apple”。","takeaway":"表达“一个”时，除了 “one”，还常用不定冠词 “a” 或 “an”。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"我能看到彩虹。","options":{"A":"I can see a rainbow.","B":"This is a rainbow.","C":"","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"题干“我能看到彩虹”是一个包含情态动词的陈述句。首先，主语“我”对应 “I”。其次，“能看到”表达的是一种能力，应该使用情态动词 “can” 加上动词原形 “see”，即 “can see”。最后，宾语“彩虹”是可数名词单数，前面需要加不定冠词 “a”，即 “a rainbow”。将这几部分组合起来，就是 “I can see a rainbow.”。选项 B “This is a rainbow.” 意为“这是一个彩虹”，句型和意思都不符。","knowledge_expansion_md":"### 知识点拓展：情态动词 `can` 的用法\n\n1.  **基本用法**：`can` 是一个情态动词，后面必须跟**动词原形**，没有人称和数的变化。\n    *   **肯定句**：主语 + `can` + 动词原形. (e.g., `She can dance.` 她会跳舞。)\n    *   **否定句**：主语 + `cannot` (或 `can't`) + 动词原形. (e.g., `He can't swim.` 他不会游泳。)\n    *   **疑问句**：`Can` + 主语 + 动词原形...? (e.g., `Can you help me?` 你能帮我吗？)\n\n2.  **主要含义**：\n    *   **表示能力**（“能”、“会”）：这是 `can` 最常见的用法。例如：`Birds can fly.` (鸟会飞。)\n    *   **表示许可**（“可以”）：在口语中常用来请求或给予许可。例如：`Can I use your pen?` (我可以用一下你的钢笔吗？) `Yes, you can.` (可以。)\n    *   **表示可能性**（“可能”）：表示理论上或客观上的可能性。例如：`Accidents can happen.` (事故是可能发生的。)\n\n3.  **易混淆词辨析**：\n    *   `see` vs `look` vs `watch`\n        *   `see`: 看见，强调看的结果，是非主观的。 (e.g., `I open my eyes and see the light.`)\n        *   `look`: 看，强调看的动作，是主观的。常与 `at` 连用。 (e.g., `Look at the blackboard.`)\n        *   `watch`: 观看，指长时间专注地看移动或变化的物体，如电视、比赛等。 (e.g., `watch TV`, `watch a football game`)\n    *   在本题中，“能看到”强调的是视力所及的能力和结果，因此用 `see` 最为恰当。","socratic_tracks":[{"title":"句子核心动词","steps":[{"question":"在中文“我能看到彩虹”里，哪个词表达了“能力”？","hint":"是“我”、“看到”还是“能”？","takeaway":"“能”这个字表达了能力。"},{"question":"在英语中，我们用哪个词来表示“能”或“会”这种能力，并且它后面要跟一个动词的原形？","hint":"这个词是情态动词的一种，比如“我会游泳” I can swim。","takeaway":"我们用情态动词 “can” 来表示能力。"},{"question":"那么，“能看到”这个动作短语应该如何翻译成英文？","hint":"组合 “can” 和 “看到” (see) 的原形。","takeaway":"“能看到”应该翻译为 “can see”。"}]},{"title":"句子结构分析","steps":[{"question":"“我能看到彩虹”这句话的主语、谓语和宾语分别是什么？","hint":"谁做动作？做什么动作？动作的对象是什么？","takeaway":"主语是“我”，谓语是“能看到”，宾语是“彩虹”。"},{"question":"按照英语“主语+谓语+宾语”的语序，把这三个部分对应的英文单词组合起来。","hint":"我 (I), 能看到 (can see), 彩虹 (a rainbow)。","takeaway":"组合起来就是 “I can see a rainbow.”。"}]},{"title":"选项对比辨析","steps":[{"question":"选项 B “This is a rainbow.” 翻译成中文是什么意思？","hint":"“This is...” 是一个介绍性的句型。","takeaway":"“This is a rainbow.” 的意思是“这是一个彩虹。”"},{"question":"“这是一个彩虹”和“我能看到彩虹”这两个句子的意思和侧重点一样吗？","hint":"一个是在介绍眼前的事物，另一个是在描述自己的所见或能力。","takeaway":"两个句子的意思和功能完全不同，因此选项B是错误的。"}]}]}}]},{"section_title":"V. 在II栏中选出I栏中句子的应答语。(共10分)","section_instruction":"A. I am going to Harbin.\nB. She feels better now.\nC. Last year.\nD. He watched TV.\nE. Yes, he is.\nF. It was a busy one.\nG. No, she isn't.\nH. It's Monday.\nI. By plane.\nJ. Yes, I can.","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"What did your father do yesterday?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"D","explanation_md":"问句 “What did your father do yesterday?” 意为“你父亲昨天做了什么？”，是一个询问过去动作的特殊疑问句。回答时需要描述一个过去的动作。选项 D “He watched TV.”（他看了电视。）使用了正确的代词 “He” 指代 “your father”，并使用了过去时态，符合问答逻辑。","knowledge_expansion_md":"### 知识点拓展：一般过去时特殊疑问句\n\n1.  **构成**：\n    *   `Wh-` 疑问词 + `did` + 主语 + 动词原形 + ... ?\n    *   常见的 `Wh-` 疑问词有：`What` (什么), `Where` (哪里), `When` (何时), `Who` (谁), `Why` (为什么), `How` (如何)。\n    *   **注意**：助动词 `did` 后面的动词必须使用**原形**。\n\n2.  **例句**：\n    *   `What did you eat for breakfast?` (你早餐吃了什么？)\n    *   `Where did she go last weekend?` (她上周末去哪儿了？)\n    *   `When did they finish the work?` (他们什么时候完成工作的？)\n\n3.  **回答**：\n    *   回答这类问题时，不能用 `Yes/No`。\n    *   需要提供具体信息，并使用一般过去时的陈述句形式：主语 + 动词过去式 + ...。\n    *   例如，对 `What did you do yesterday?` 的回答可以是：`I played basketball.` (我打了篮球。) `I did my homework.` (我做了我的作业。)\n\n4.  **动词过去式**：\n    *   **规则动词**：在动词原形后加 `-ed`，如 `play - played`, `watch - watched`。\n    *   **不规则动词**：形式不固定，需要专门记忆，如 `go - went`, `do - did`, `see - saw`, `eat - ate`。","socratic_tracks":[{"title":"识别问句时态","steps":[{"question":"在问句 “What did your father do yesterday?” 中，你看到了哪两个词可以帮助你判断时态？","hint":"一个是助动词，一个是时间状语。","takeaway":"助动词 “did” 和时间状语 “yesterday” (昨天) 都表明这是一个关于过去动作的提问。"},{"question":"既然是问过去发生的事情，那么回答的时候应该用什么时态呢？","hint":"回答的时态通常需要和提问的时态保持一致。","takeaway":"回答时必须使用一般过去时。"}]},{"title":"构建答句结构","steps":[{"question":"问句的主语是 “your father”，在回答时，我们通常用哪个代词来指代他？","hint":"指代男性的单数主格代词是什么？","takeaway":"我们应该用代词 “He” 来开始回答。"},{"question":"一般过去时陈述句的谓语动词应该用什么形式？是动词原形还是过去式？","hint":"想想 “I go to school” 的过去式是 “I went to school”。","takeaway":"在一般过去时的陈述句中，谓语动词要用过去式。"},{"question":"现在，请你用 “He” 作主语，并选择一个动作（如“去钓鱼”），组成一个完整的一般过去时答句。","hint":"“去”的过去式是 “went”，“钓鱼”是 “fishing”。","takeaway":"一个完整的回答可以是 “He went fishing.”。"}]},{"title":"理解疑问词“What”","steps":[{"question":"这个问句以 “What” 开头，它是在问关于哪方面的信息？","hint":"是问人、地点、时间，还是事情？","takeaway":"“What” 在这里是用来询问“做了什么事情”。"},{"question":"对于用 “What” 提问的句子，我们可以用 “Yes” 或者 “No” 来回答吗？","hint":"如果有人问你“你昨天做了什么？”，你回答“是”，对方能明白吗？","takeaway":"不能用 “Yes/No” 回答，必须提供具体的信息来描述所做的事情。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"","stem":"How was your weekend?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"F","explanation_md":"问句 “How was your weekend?” 意为“你周末过得怎么样？”，用来询问对过去周末的感受或评价。回答时常用代词 “It” 指代 “your weekend”。选项 F “It was a busy one.”（是个忙碌的周末。）用 “It” 指代周末，并用 “busy” 来描述周末的情况，符合问答逻辑。","knowledge_expansion_md":"### 知识点拓展：`How was...?` 句型及其应答\n\n1.  **句型功能**：\n    *   `How was...?` 是一个常用句型，用来询问某人对过去某段经历、某件事或某个东西的感受和评价。\n    *   例如：`How was your day?` (你今天过得怎么样？), `How was the movie?` (那部电影怎么样？), `How was your holiday?` (你的假期过得如何？)\n\n2.  **基本回答结构**：\n    *   最标准的回答是 `It was + 形容词.`。\n    *   `It` 在这里指代问句中提到的事物（如 `your weekend`, `the movie` 等）。\n    *   `was` 与问句时态保持一致。\n    *   形容词用来表达评价，可以是正面的、负面的或中性的。\n\n3.  **常见回答词汇**：\n    *   **正面评价**: `great` (很棒), `wonderful` (极好的), `fantastic` (棒极了), `fun` (有趣的), `nice` (不错的), `good` (好的)。\n    *   **中性评价**: `OK` (还行), `not bad` (不错), `so-so` (马马虎虎)。\n    *   **负面评价**: `terrible` (糟糕的), `awful` (极坏的), `boring` (无聊的)。\n\n4.  **`was` 和 `were` 的区别**：\n    *   当主语是单数或不可数名词时，用 `was`。例如：`How was the weather?` (天气怎么样？) - `It was sunny.`\n    *   当主语是复数时，用 `were`。例如：`How were the cakes?` (那些蛋糕怎么样？) - `They were delicious.`","socratic_tracks":[{"title":"理解疑问词“How”","steps":[{"question":"问句 “How was your weekend?” 以 “How” 开头，你觉得它是在问什么？","hint":"想一想我们最熟悉的问候语 “How are you?” 是在问什么。","takeaway":"“How” 在这里是用来询问“怎么样”，即对周末的感受或评价。"},{"question":"既然是问“怎么样”，那么回答应该是提供一个事实，还是描述一种状态或感受？","hint":"比如，回答应该是“我打了篮球”，还是“周末很有趣”？","takeaway":"回答应该是一种描述性的评价，比如“好”、“不好”或“有趣”。"}]},{"title":"确定答句的时态和主语","steps":[{"question":"问句中使用了 “was”，这是 “is” 的现在式还是过去式？","hint":"“I am happy.” 的过去时是 “I was happy.”。","takeaway":"“was” 是过去式，所以问的是过去的周末。"},{"question":"问句的主语是 “your weekend”，在回答时，我们用哪个代词来指代它最方便？","hint":"指代事物、天气、时间的单数代词是什么？","takeaway":"我们用代词 “It” 来指代 “your weekend”。"},{"question":"结合以上两点，回答的开头部分应该是什么？","hint":"主语是 “It”，时态是过去时。","takeaway":"回答应该以 “It was...” 开头。"}]},{"title":"丰富你的回答","steps":[{"question":"如果你的周末过得非常棒，你可以在 “It was...” 后面加上哪个形容词？","hint":"一个表示“很棒”的常用词。","takeaway":"可以说 “It was great.” 或 “It was wonderful.”。"},{"question":"如果周末过得一般般，不好不坏，又该怎么说呢？","hint":"一个很简单的两个字母的词就可以。","takeaway":"可以说 “It was OK.” 或者更口语化的 “Not bad.”。"},{"question":"如果周末很无聊呢？","hint":"“无聊的”用英语怎么说？","takeaway":"可以说 “It was boring.”。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"Where are you going on your holiday?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"问句 “Where are you going on your holiday?” 意为“你假期要去哪里？”，是一个以 “Where”（哪里）开头的特殊疑问句，询问地点。句中用现在进行时表示未来的计划。选项 A “I am going to Harbin.”（我打算去哈尔滨。）明确回答了将要去的地点，是正确的应答。","knowledge_expansion_md":"### 1. 特殊疑问词 “Where”\n“Where” 是用于提问地点或位置的疑问副词。例如：\n- `Where do you live?` (你住在哪里？)\n- `Where is my book?` (我的书在哪里？)\n\n### 2. 现在进行时表将来\n现在进行时 (be + doing) 不仅可以表示正在发生的动作，还可以表示近期内已经安排好的、确定性很强的未来计划。这通常与表示将来的时间状语连用，或者在上下文中能明确看出是谈论未来。\n- `What are you doing next weekend?` (你下周末打算做什么？)\n- `She is flying to New York tomorrow morning.` (她明天早上乘飞机去纽约。)\n\n### 3. 回答 “Where” 问句\n回答 “Where” 的问句时，通常需要用介词短语来表示地点，如 `in Beijing`, `at school`, `on the desk`。","socratic_tracks":[{"title":"疑问词 “Where”","steps":[{"question":"看到句子开头的 “Where”，你首先会想到它是在问关于什么的信息？是时间、人物，还是地点？","hint":"回想一下你学过的最简单的句子之一：“Where are you from?”，这个句子是问你来自哪里。","takeaway":"“Where” 是专门用来提问地点的疑问词。"}]},{"title":"现在进行时表将来","steps":[{"question":"句子中的 “are you going” 是什么时态？它通常表示动作发生在什么时候？","hint":"“I am reading a book.” 表示我现在正在读书。这是现在进行时的基本用法。","takeaway":"“are going” 是现在进行时，通常表示正在进行的动作。"},{"question":"但在这个问句 “Where are you going on your holiday?” 中，它真的是指“现在正在去”吗？还是指未来的计划？","hint":"结合 “on your holiday”（在你的假期）来理解，这通常是提前询问计划。","takeaway":"现在进行时也可以用来表示已经安排好的未来计划。"}]},{"title":"问答逻辑匹配","steps":[{"question":"既然问题是问“你要去哪里度假？”，一个最直接的回答应该包含什么核心信息？","hint":"如果别人问你“你午饭想吃什么？”，你会回答“我想吃米饭”。这里，“米饭”就是核心信息。","takeaway":"回答必须针对疑问词“Where”提供一个具体的地点信息。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"","stem":"Is Amy stronger than me?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"G","explanation_md":"这是一个以 Be 动词 “Is” 开头的一般疑问句，需要用 “Yes” 或 “No” 来回答。问句主语是 “Amy”（女性），因此回答时应用代词 “she” 指代。根据一般疑问句的回答规则，否定回答是 “No, she isn't.”。选项 G 符合这一结构，是正确的应答。","knowledge_expansion_md":"### 1. 一般疑问句的回答\n由 Be 动词 (am, is, are)、助动词 (do, does, did) 或情态动词 (can, will, should) 开头的句子是一般疑问句。其简略回答遵循固定格式：\n- 肯定回答: `Yes, 主语代词 + be/助动词/情态动词.`\n- 否定回答: `No, 主语代词 + be/助动词/情态动词 + not.`\n- 注意：回答中的动词形式要与问句保持一致，但主语必须用代词形式。\n\n### 2. 形容词比较级\n“stronger than” 是形容词 “strong” 的比较级形式，用于比较两个人或事物的某方面特性。其基本结构是 `A + be + 形容词比较级 + than + B`。\n- `He is taller than his brother.` (他比他哥哥高。)\n\n### 3. 人称代词的宾格\n在 “than me” 中，“me” 是第一人称代词 “I” 的宾格形式。在现代英语，尤其是在口语中，当 `than` 后面跟人称代词时，通常使用宾格 (me, you, him, her, it, us, them)。在非常正式的文体中，也可以使用主格，如 `than I (am)`。","socratic_tracks":[{"title":"一般疑问句结构","steps":[{"question":"这个句子是以哪个词开头的？这种以 Be 动词（am, is, are）开头的问句叫什么？","hint":"它不是以 What, Where, When 等词开头的特殊疑问句。","takeaway":"以 Be 动词开头的问句是一般疑问句。"},{"question":"对于一般疑问句，我们通常用哪两个词来开始回答？","hint":"想一想如何回答 “Are you a student?”","takeaway":"一般疑问句需要用 “Yes” 或 “No” 来回答。"},{"question":"问句的主语是 “Amy”，动词是 “is”。那么在 “Yes, ...” 的回答中，应该用哪个代词和动词来完成句子？","hint":"Amy 是女生，应该用哪个代词指代她？回答中的动词要和问句保持一致。","takeaway":"简略回答的结构是 “Yes/No + 主语代词 + be动词”。"}]},{"title":"形容词比较级","steps":[{"question":"句子中的 “stronger than” 是什么意思？它是在做什么？","hint":"“strong” 是“强壮的”。加上 “-er” 和 “than” 之后，通常是用来……","takeaway":"“stronger than” 是形容词的比较级形式，用于比较两者。"},{"question":"我们什么时候需要在形容词后面加 “-er”？","hint":"当我们想表达“A比B更……”的时候，就需要用到这种形式。","takeaway":"在比较两个人或事物的某项特征时，单音节或部分双音节形容词词尾加-er构成比较级。"}]},{"title":"人称代词的格","steps":[{"question":"在 “...than me” 中，为什么用 “me” 而不是 “I”？","hint":"我们说 “My mother loves me.” 而不是 “My mother loves I.”。在动词或介词后面，人称代词要用特定形式。","takeaway":"在连词 “than” 后面，人称代词通常使用宾格形式（如 me, him, her）。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"How does your mother feel now?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"问句 “How does your mother feel now?” 意为“你妈妈现在感觉如何？”，通常是用来关心对方的健康状况。问句主语是 “your mother”，回答时应用代词 “she” 指代。选项 B “She feels better now.”（她现在感觉好多了。）直接回答了关于健康状况的问题，是正确的应答。","knowledge_expansion_md":"### 1. 疑问词 “How” 的多种用法\n“How” 是一个功能非常丰富的疑问副词，可以用来询问：\n- **方式、方法**: `How do you go to school?` (你怎样去上学？)\n- **健康、状况**: `How are you?` / `How do you feel?` (你好吗？/你感觉怎么样？)\n- **程度、数量**: `How old are you?` (你多大了？) / `How much is it?` (它多少钱？)\n\n### 2. 询问与回答健康状况\n- **常用问句**: `How are you feeling?` / `Are you feeling better?` / `What's the matter?`\n- **常用答语**: `I'm fine/great/well.` (我很好), `Not so good.` (不太好), `I'm feeling much better.` (我感觉好多了), `I have a headache.` (我头疼)。\n\n### 3. 修饰比较级\n“much” 可以用来修饰形容词或副词的比较级，表示“……得多”，以加强语气。其他可以修饰比较级的词还有 `a lot`, `far` (表示程度大)，以及 `a little`, `a bit` (表示程度小)。\n- `This car is much more expensive than that one.` (这辆车比那辆贵得多。)\n- `He runs a little faster than me.` (他比我跑得快一点。)","socratic_tracks":[{"title":"疑问词 “How” 的功能","steps":[{"question":"“How” 这个词有很多意思，比如在 “How are you?” 和 “How do you spell 'apple'?” 中，它的意思一样吗？","hint":"一个问健康，一个问方式。","takeaway":"“How” 可以用来询问健康状况、方式、程度等多种信息。"},{"question":"在这个句子里，“How does your mother feel?” 是在问什么？","hint":"“feel” 是“感觉”，所以 “How ... feel?” 是在问“感觉怎么样？”","takeaway":"本句中的 “How” 是用来询问健康状况或感受。"}]},{"title":"助动词 “does”","steps":[{"question":"为什么这个问句里有 “does” 这个词？它有什么语法作用？","hint":"试着去掉 “does”，读一下 “How your mother feel now?”，听起来对吗？","takeaway":"“does” 是助动词，帮助构成一般现在时的特殊疑问句。"},{"question":"为什么用 “does” 而不是 “do”？","hint":"这和主语 “your mother” 有关。想一想主语是第几人称、单数还是复数？","takeaway":"当主语是第三人称单数时，需要用助动词 “does”。"}]},{"title":"理解答句中的比较级","steps":[{"question":"在回答 “She feels better now” 中，“better” 是哪个词的比较级？","hint":"表示“好”的词有两个：good 和 well。它们的比较级是同一个词。","takeaway":"“better” 是 “good” 或 “well” 的比较级。"},{"question":"那么，整个句子 “She feels better now.” 是什么意思？","hint":"“feel”是感觉，“better”是更好，“now”是现在。","takeaway":"整句话的意思是“她现在感觉好多了”，正好回答了“她感觉怎么样？”的问题。"}]}]}},{"number":"6","item_type":"fill_blank","context_note":"","stem":"When did you go to Shanghai?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这是一个以特殊疑问词 “When”（何时）开头的问句，询问的是动作发生的时间。句中的助动词 “did” 表明这是一个关于过去动作的问句，时态为一般过去时。因此，回答需要提供一个过去的时间点或时间段。选项 C “Last year.”（去年）是一个明确的过去时间状语，直接回答了 “When” 的提问，是最佳应答。","knowledge_expansion_md":"### 1. 特殊疑问词 “When”\n“When” 用于对时间提问。回答时可以使用具体的时间点、日期、星期、月份、年份，或表示时间的短语。\n- `When is your birthday?` - `It's on June 1st.` (你的生日是什么时候？- 在六月一日。)\n- `When did he leave?` - `Two hours ago.` (他什么时候离开的？- 两小时前。)\n\n### 2. 一般过去时\n一般过去时用于描述过去发生并完成的动作或存在的状态。其特殊疑问句的基本结构是：`Wh-疑问词 + did + 主语 + 动词原形 + ...?`\n- **注意**: 一旦使用了助动词 `did`，其后的动词必须使用原形，而不是过去式。例如，问句中用 `go` 而不是 `went`。\n\n### 3. 常见过去时间状语\n一般过去时常与表示过去的时间状语连用，例如：\n- `yesterday` (昨天)\n- `last week/month/year/night` (上周/上月/去年/昨晚)\n- `... ago` (……以前), 如 `three days ago` (三天前)\n- `in + 过去的年份` (in 2010)\n- `the day before yesterday` (前天)","socratic_tracks":[{"title":"疑问词 “When”","steps":[{"question":"句子开头的 “When” 是用来问什么的？","hint":"想一想 “When do you get up?” 这个日常用语是在问你什么。","takeaway":"“When” 是用来提问时间的特殊疑问词。"},{"question":"既然问题是关于时间的，那么一个好的回答应该包含什么信息？","hint":"是应该回答一个地点，一个原因，还是一个时间？","takeaway":"回答 “When” 的问句，必须提供时间信息。"}]},{"title":"一般过去时态","steps":[{"question":"问句中的 “did” 告诉我们，“去上海”这个动作发生在什么时候？","hint":"助动词 do/does 用于现在，will 用于将来，那么 did 用于……？","takeaway":"助动词 “did” 表明这是一个发生在过去的动作。"},{"question":"为什么 “did” 后面用的是动词原形 “go”，而不是过去式 “went”？","hint":"在一个简单句中，时态的标记通常只出现一次。`did` 已经承担了这个任务。","takeaway":"在有助动词 “did” 的疑问句或否定句中，主动词必须使用原形。"}]},{"title":"问答时态一致性","steps":[{"question":"问句用的是过去时，那么在回答时，我们应该选择一个表示过去、现在还是将来的时间？","hint":"如果别人问你“昨天吃了什么？”，你会回答“我明天要吃面条”吗？","takeaway":"问答的时态通常需要保持一致。"},{"question":"“Last year” (去年) 是一个表示什么时间段的短语？","hint":"“last” 的意思是“上一个的”，所以 “last year” 是指已经过去的一年。","takeaway":"“Last year” 是一个典型的过去时间状语，与过去时态的问句完美匹配。"}]}]}},{"number":"7","item_type":"fill_blank","context_note":"","stem":"What day is it today?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"H","explanation_md":"该题是特殊疑问句，以“What day”开头，意为“星期几”，询问的是关于星期几的信息。因此，回答时需要明确指出是星期几。标准回答句型为“It's + 星期几.”。例如，如果今天是星期一，就回答“It's Monday.”。注意表示星期的单词首字母需要大写。","knowledge_expansion_md":"### “询问日期、星期、时间”句型拓展\n\n1.  **询问星期**: `What day is it today?` (今天星期几？) \n    *   答: `It's Monday.` (今天是星期一。)\n2.  **询问日期**: `What's the date today?` (今天几号？)\n    *   答: `It's June 1st.` (今天是六月一号。)\n3.  **询问时间**: `What time is it?` / `What's the time?` (现在几点了？)\n    *   答: `It's ten o'clock.` (现在十点整。)\n\n**易错点**: \n*   混淆 `day` (星期) 和 `date` (日期)。\n*   忘记表示星期的单词（Monday, Tuesday...）和月份的单词（January, February...）首字母需要大写，因为它们是专有名词。","socratic_tracks":[{"title":"特殊疑问词 What","steps":[{"question":"这个句子以 \"What\" 开头，它通常用来问什么类型的信息？","hint":"想一想你学过的 \"What's your name?\" 是在问什么。","takeaway":"\"What\" 用于询问关于人、事、物的具体信息。"},{"question":"那么，\"What day\" 这个组合是在问“几月几号”还是“星期几”？","hint":"\"day\" 这个词本身是“天”的意思，但在特定问句里有更具体的含义。","takeaway":"\"What day\" 是一个固定搭配，专门用来询问“星期几”。"},{"question":"既然是问星期几，我们应该如何用一个完整的句子来回答？","hint":"通常我们会用一个代词来指代“今天”这个时间，然后说出是星期几。","takeaway":"回答“星期几”的常用句型是 \"It's + 星期几\"。"}]},{"title":"虚主语 it 的用法","steps":[{"question":"在回答 \"It's Monday.\" 时，句首的 \"It\" 指的是某个具体的东西吗？","hint":"对比一下 \"It is a book.\" 里的 \"it\"，这里的 \"it\" 有没有一个可以指着说的实体？","takeaway":"这里的 \"it\" 是虚主语，没有实际意义，是句子结构的一部分。"},{"question":"除了表示星期，你还能想到 \"it\" 作为虚主语可以用来谈论哪些话题吗？","hint":"思考一下如何用英语说“天在下雨”或者“现在是下午三点”。","takeaway":"虚主语 \"it\" 常用于指代时间、日期、天气、距离等自然现象或情况。"}]},{"title":"星期词汇与书写规范","steps":[{"question":"你能按顺序说出英语中一周七天的名称吗？","hint":"可以从星期日（Sunday）或星期一（Monday）开始。","takeaway":"一周七天是：Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday。"},{"question":"在书写这些表示星期的单词时，有什么特别需要注意的格式要求吗？","hint":"观察一下日历或者英文书籍中这些单词的写法，看看它们的首字母。","takeaway":"表示星期的单词是专有名词，无论在句子的哪个位置，其首字母都必须大写。"}]}]}},{"number":"8","item_type":"fill_blank","context_note":"","stem":"Is John dancing?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"E","explanation_md":"这是一个以be动词“Is”开头的一般疑问句，需要用“Yes”或“No”来回答。句子的主语是“John”，是一个男性单数名词，所以在简略回答中应用人称代词“he”来指代。问句中使用了“is”，因此简略回答中也要使用相应的be动词。肯定回答是“Yes, he is.”，否定回答是“No, he isn't.”。","knowledge_expansion_md":"### 一般疑问句及其简略回答\n\n一般疑问句是可以用 `Yes` 或 `No` 回答的问句。其基本结构和回答规则如下：\n\n1.  **Be动词开头**: `Be + 主语 + ...?`\n    *   例: `Is she a teacher?` -> `Yes, she is.` / `No, she isn't.`\n2.  **助动词(Do/Does/Did)开头**: `Do/Does/Did + 主语 + 动词原形 + ...?`\n    *   例: `Do you like apples?` -> `Yes, I do.` / `No, I don't.`\n3.  **情态动词(Can/May/Must...)开头**: `情态动词 + 主语 + 动词原形 + ...?`\n    *   例: `Can you swim?` -> `Yes, I can.` / `No, I can't.`\n\n**核心规则**: 简略回答 `Yes/No` 后面的人称代词要和主语的人、格、数保持一致，后面的动词要和问句开头的动词保持一致（形式上可能需要变化，如 `are` -> `am/are`）。","socratic_tracks":[{"title":"一般疑问句的回答","steps":[{"question":"这个句子以 \"Is\" 开头，它期待一个什么样的回答？是一个具体的地点，还是简单的“是”或“不是”？","hint":"这种能用“是”或“否”来回答的问句，我们称之为什么问句？","takeaway":"以Be动词、助动词或情态动词开头的句子是一般疑问句，需要用 Yes/No 来回答。"},{"question":"在回答时，主语 \"John\" 应该用哪个代词来替换？","hint":"\"John\" 是一个男孩的名字，指代男性的单数代词是什么？","takeaway":"在简略回答中，名词主语需要用相应的人称代词替换，因此 \"John\" 应该用 \"he\"。"},{"question":"问句中用了 \"is\"，那么在肯定简略回答 \"Yes, he...\" 的后面应该填什么？","hint":"简略回答中的 be 动词/助动词/情态动词要与问句中的保持一致。","takeaway":"肯定简略回答的结构是 “Yes, 主语代词 + be动词/助动词/情态动词”，所以答案是 \"Yes, he is.\""}]},{"title":"现在进行时","steps":[{"question":"句子中的 \"is dancing\" 是什么时态？它描述的是什么时候发生的动作？","hint":"动词的 \"-ing\" 形式通常表示动作正在...","takeaway":"\"be + 动词-ing\" 构成现在进行时，表示说话时正在进行的动作。"},{"question":"如果我想问“约翰平时跳舞吗？”（作为一种习惯），我应该怎么问？","hint":"询问习惯性的动作，我们通常用什么时态？助动词应该用哪个？","takeaway":"询问习惯性动作应该用一般现在时，问句是 \"Does John dance?\"。"}]},{"title":"主谓一致","steps":[{"question":"为什么问句用的是 \"Is John...\" 而不是 \"Are John...\"？","hint":"这和主语 \"John\" 的单复数有关。\"John\" 是一个人还是多个人？","takeaway":"主语 \"John\" 是第三人称单数，所以 be 动词要用 \"is\"。"},{"question":"如果主语换成 \"John and Mary\"，这个问句应该怎么改？","hint":"\"John and Mary\" 是两个人，是复数。那么 be 动词应该用哪个？","takeaway":"如果主语是复数，问句应改为 \"Are John and Mary dancing?\"。"},{"question":"那么，对于问题 \"Are John and Mary dancing?\"，它的肯定简略回答是什么？","hint":"主语代词应该用什么来指代 \"John and Mary\"？be 动词呢？","takeaway":"对应的肯定简略回答是 \"Yes, they are.\"。"}]}]}},{"number":"9","item_type":"fill_blank","context_note":"","stem":"How did you go to Beijing?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"I","explanation_md":"该题是一个以“How”开头的特殊疑问句，意为“怎样，如何”，在这里是用来询问去北京所乘坐的交通方式。回答交通方式时，我们通常使用介词“by”加上交通工具名词的组合。例如，“by plane”（乘飞机）、“by train”（乘火车）、“by car”（乘小汽车）。因此，“By plane.”是一个直接且正确的回答。注意，如果是步行，则用固定搭配“on foot”。","knowledge_expansion_md":"### 询问和回答交通方式\n\n1.  **提问方式**: `How do/does/did + 主语 + go to + 地点?`\n    *   `How do you go to school?` (你怎么去上学？)\n    *   `How did she go to Shanghai?` (她是怎么去上海的？)\n\n2.  **回答方式**: \n    *   **`By + 交通工具`**: 这是最常见的表达。注意交通工具名词前不加冠词（a/an/the）。\n        *   `by bus` (乘公交), `by car` (乘小汽车), `by train` (乘火车), `by plane` (乘飞机), `by ship` (乘船), `by subway` (乘地铁)。\n    *   **`On foot`**: 这是一个特殊的固定搭配，表示“步行”。\n        *   `I go to school on foot.` (我走路上学。)\n    *   **`Take + a/an/the + 交通工具`**: 也可以用动词 `take` 来表达。\n        *   `I take a bus to school.` (我乘公交车去上学。)","socratic_tracks":[{"title":"疑问词 How 的用法","steps":[{"question":"这个句子以 \"How\" 开头，它是在询问什么信息？","hint":"想一想 \"How are you?\" (你好吗？) 和 \"How do you spell 'apple'?\" (你怎么拼写'apple'？)。\"How\" 可以问很多事情。","takeaway":"\"How\" 可以用来询问健康状况、程度、方式方法等。"},{"question":"在这个句子里，\"How did you go to Beijing?\"，\"How\" 具体是在问什么？","hint":"它关心的是你去北京这个动作的“方式”。结合生活常识，去一个城市的方式通常指什么？","takeaway":"在这里，\"How\" 是用来询问出行的交通方式。"},{"question":"当我们回答乘坐某种交通工具时，通常用哪个介词来引导？","hint":"比如，“乘飞机”是 \"___ plane\"，“乘火车”是 \"___ train\"。","takeaway":"表示乘坐某种交通工具时，通常用介词 \"by\" 加上交通工具名词。"}]},{"title":"一般过去时","steps":[{"question":"问句中为什么用 \"did you go\" 而不是 \"do you go\"？","hint":"\"did\" 是哪个词的过去式？它的出现说明了什么时间？","takeaway":"\"did\" 是助动词 \"do\" 的过去式，表示问的是过去发生的事情。"},{"question":"如果用一个完整的句子来回答，动词 \"go\" 应该变成什么形式？","hint":"既然问的是过去的事，回答时陈述句中的动词也应该用过去式。\"go\" 的过去式是什么？","takeaway":"在回答过去发生的事情时，动词要用过去式，所以 \"go\" 应该变成 \"went\"。"},{"question":"那么，你能用一个完整的句子来回答这个问题吗？","hint":"把主语、动词过去式、地点和交通方式组合起来。","takeaway":"完整的回答可以是 \"I went to Beijing by plane.\""}]},{"title":"交通方式表达","steps":[{"question":"除了 by plane，你还能说出其他几种“乘坐交通工具”的表达吗？","hint":"想想你在城市里、铁路上、水上会用到的交通工具。","takeaway":"常见的表达有 by bus, by train, by car, by ship, by subway 等。"},{"question":"那如果我们是“走路”去的，应该怎么说？是 \"by foot\" 吗？","hint":"这是一个非常特殊的、需要记住的固定搭配。","takeaway":"表示“步行”时，必须用固定短语 \"on foot\"，而不是 \"by foot\"。"}]}]}},{"number":"10","item_type":"fill_blank","context_note":"","stem":"Can you water the flowers?","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"J","explanation_md":"这是一个以情态动词“Can”开头的一般疑问句，用于提出请求，意为“你能帮忙……吗？”。对于这类请求，标准的肯定回答是“Yes, I can.”。选项 J 正是这种标准回答。在口语中，也可以用“Sure.” / “Of course.” / “No problem.”等来表示同意。","knowledge_expansion_md":"### 提出请求及回应\n\n1.  **提出请求的常用句型**:\n    *   `Can you + 动词原形...?` (你能...吗？比较常用，非正式)\n    *   `Could you + 动词原形...?` (您能...吗？比 `Can` 更礼貌)\n    *   `Will you + 动词原形...?` (你愿意...吗？)\n    *   `Would you please + 动词原形...?` (请问您能...吗？非常礼貌)\n\n2.  **回应请求**:\n    *   **肯定回答 (表示同意)**: \n        *   `Sure.` / `Certainly.` / `Of course.` (当然可以)\n        *   `No problem.` (没问题)\n        *   `Yes, I can/will.` (是的，我可以/我愿意)\n        *   `I'd be glad/happy to.` (我很乐意)\n    *   **否定回答 (表示拒绝)**: \n        *   `Sorry, I can't.` (对不起，我不能)\n        *   `I'm sorry, but I'm busy now.` (抱歉，但我现在很忙)\n        *   `I'm afraid I can't.` (恐怕不行)\n\n**注意**: 在拒绝别人的请求时，为了表示礼貌，通常会先说 `Sorry` 或 `I'm afraid`，并可以简要说明原因。","socratic_tracks":[{"title":"情态动词 Can 的请求功能","steps":[{"question":"这个以 \"Can\" 开头的句子，是在问“你有没有能力浇花”，还是在“请求你帮忙浇花”？","hint":"想一下说话人的意图。他更可能是想得到一个关于你能力的信息，还是希望你完成一个动作？","takeaway":"在这种语境下，\"Can you...?\" 是用来提出一个礼貌的请求。"},{"question":"对于这样的请求，除了课本上学的 \"Yes, I can.\"，在日常口语中，还有哪些更简单、更自然的肯定回答？","hint":"当朋友请你帮忙递个东西时，你通常会怎么说？“当然”、“没问题”对应的英文是什么？","takeaway":"标准的回答是“Yes, I can.”。在口语中，也常用“Sure.”、“No problem.”或“Of course.”等更简洁的方式来欣然同意一个请求。"}]},{"title":"词类活用：water","steps":[{"question":"在 \"water the flowers\" 这个短语里，\"water\" 是我们通常理解的名词“水”吗？","hint":"它在句子中处于什么位置？前面有情态动词和主语，后面有名词宾语 \"the flowers\"。","takeaway":"在这里，\"water\" 被用作动词，意思是“给……浇水”。"},{"question":"你能再想一个既可以是名词，又可以是动词的单词吗？","hint":"想想你每天看的“书”(book)，和你在网上“预订”(book) 酒店。","takeaway":"英语中有很多词可以一词多性，如 \"book\" (书/预订), \"watch\" (手表/观看), \"milk\" (牛奶/挤奶)。"}]},{"title":"如何礼貌地回应","steps":[{"question":"如果你现在正忙，不能帮忙浇花，应该怎么回答才能不显得生硬无礼？","hint":"直接说 \"No.\" 或者 \"I can't.\" 听起来怎么样？有没有更委婉的方式？","takeaway":"礼貌地拒绝时，可以说 \"Sorry, I can't.\" 或者解释一下原因，如 \"I'm sorry, but I'm a bit busy right now.\""},{"question":"为什么在拒绝时加上 \"Sorry\" (对不起) 或 \"I'm afraid\" (恐怕) 会让你的回答听起来更好？","hint":"这些词语表达了你的一种什么心情？是冷漠还是遗憾？","takeaway":"使用 \"Sorry\" 或 \"I'm afraid\" 可以表达歉意和遗憾，使拒绝的语气更委婉、更有礼貌。"}]}]}}]},{"section_title":"VI. 完形填空。(共10分)","section_instruction":"What do you do at the weekend? Some people like to __1__ at home, but others like to go __2__ a walk or play football. My friend Jack works hard in a factory during the __3__. At the weekend, he always __4__ the same things. On Saturday he __5__ his car and on __6__ he goes with his family to a village by car. His uncle and aunt have a farm there. It isn't a __7__ one, but there's always __8__ to do on the farm. The children help with the animals and give them their __9__. Jack and his wife help in the fields. At the end of the day, they are all __10__ and Jack's aunt gives them a big meal.","items":[{"number":"1","item_type":"cloze","context_note":"","stem":"1.","options":{"A":"play","B":"stay","C":"live","D":"enjoy"},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查动词辨析及固定搭配。根据上下文“Some people like to __1__ at home, but others like to go for a walk...”（有些人喜欢______在家，但其他人喜欢出去散步……），可知前后两句是转折关系，描述了两种不同的周末活动。与“go for a walk”（出去散步）相对的应是“待在家里”。`stay at home`是固定搭配，意为“待在家里”。选项A `play`（玩耍）、C `live`（居住）和D `enjoy`（享受）放入句中均不符合语境逻辑。故选B。","knowledge_expansion_md":"### 动词与地点搭配\n在英语中，描述“待在某处”有多种表达，`stay` 是最常用的一个：\n*   **stay at/in a place**: 表示“停留，待在”某个地方。\n    *   `stay at home` (待在家里)\n    *   `stay in a hotel` (住在酒店)\n    *   `stay with somebody` (和某人住在一起/待在一起)\n\n**易混淆词辨析**：\n*   **stay**: 侧重于“停留”，可以是暂时的。\n*   **live**: 侧重于“居住，生活”，通常是长期的。例如：`I live in Beijing.` (我住在北京。) 在本句中，用 `live at home` 意为“居住在家中”，虽然语法正确，但不符合与“出去散步”相对的“（周末）待在家里”的临时性动作语境。","socratic_tracks":[{"title":"上下文逻辑：对比关系","steps":[{"question":"句中的连词 `but` (但是) 起到了什么作用？","hint":"`but` 前后连接的内容通常是相反或相对的。","takeaway":"`but` 表示转折，说明前后描述的是两种不同的情况。"},{"question":"`but` 后面的活动是 `go for a walk` (出去散步)，那么 `but` 前面的活动应该是什么？","hint":"想一想“出去”的反义词是什么？","takeaway":"与“出去”相对的是“待在家里”，因此空格处需要填入表示“停留”意思的词。"}]},{"title":"词义辨析：stay vs. live","steps":[{"question":"为什么不用 C `live`？`live at home` 也是“住家里”的意思。","hint":"`live` 强调长期居住，而 `stay` 强调暂时停留。这里是在讨论周末的活动安排。","takeaway":"语境是讨论周末的消遣方式，用 `stay` 表示“待着”比用 `live` 表示“居住”更贴切。"}]}]}},{"number":"2","item_type":"cloze","context_note":"","stem":"2.","options":{"A":"to","B":"in","C":"at","D":"for"},"answer_area_hint":"( )","teaching":{"correct_answer":"D","explanation_md":"本题考查介词的固定搭配。`go for a walk` 是一个固定短语，意为“去散步”。此处需要介词`for`来构成该搭配。选项A `to`表示方向，选项B `in`表示在...里面，选项C `at`表示在某一点，均不符合固定搭配的用法。故选D。","knowledge_expansion_md":"### `go for a + 名词` 结构\n这个结构常用来表示进行某项短暂的活动或消遣，意为“去……一下”。\n*   `go for a walk` (去散步)\n*   `go for a run` (去跑步)\n*   `go for a swim` (去游泳)\n*   `go for a drive` (去兜风)\n\n**与 `go + v-ing` 的区别**：\n*   `go for a walk` 和 `go walking` 意思相近，但 `go for a walk` 更口语化，常指一次轻松的散步。\n*   `go swimming` 通常指去进行游泳这项运动，而 `go for a swim` 可能指“下水游一会儿”。\n\n**其他相关搭配**：\n*   `take a walk` 也意为“散步”，与 `go for a walk` 基本可以互换。","socratic_tracks":[{"title":"固定搭配：“去散步”","steps":[{"question":"在英语中，我们想表达“去散步”时，最常见的固定短语是什么？","hint":"它由三个词组成：go, a, walk，中间需要一个介词。","takeaway":"`go for a walk` 是一个非常地道的固定搭配，意为“去散步”。"},{"question":"我们试着把其他介词放进去，比如 `go to a walk`，听起来对吗？","hint":"虽然 `go to` 表示“去某地”，但 `walk` 在这里不是一个地点，而是一个活动。","takeaway":"固定搭配需要严格遵守，不能随意替换其中的介词，即使其他介词在别的语境下是正确的。"}]}]}},{"number":"3","item_type":"cloze","context_note":"","stem":"3.","options":{"A":"day","B":"time","C":"autumn","D":"weekdays"},"answer_area_hint":"( )","teaching":{"correct_answer":"D","explanation_md":"本题考查名词辨析。根据上下文“My friend Jack works hard in a factory during the __3__. At the weekend, he always...”（我的朋友杰克在______期间在工厂努力工作。在周末，他总是……），可知句子在对比“工作日”和“周末”。`at the weekend`意为“在周末”，与之相对的应是“在工作日期间”。选项中，D `weekdays`（工作日）最符合此语境，`during the weekdays`意为“在工作日期间”。选项A `day`（天）、B `time`（时间）和C `autumn`（秋天）均不能与后文的`at the weekend`形成明确的对比关系。故选D。","knowledge_expansion_md":"### 时间名词辨析：`weekdays` vs. `weekend`\n*   **`weekdays`**: 指工作日，即从周一 (Monday) 到周五 (Friday) 的日子。它通常用复数形式。\n    *   例如：`I have to get up early on weekdays.` (我工作日必须早起。)\n    *   常见搭配：`on weekdays`, `during the weekdays`。\n*   **`weekend`**: 指周末，即周六 (Saturday) 和周日 (Sunday)。\n    *   例如：`What do you usually do at the weekend?` (你周末通常做什么？)\n    *   常见搭配：`at the weekend` (英式英语), `on the weekend` (美式英语)。\n\n**`week` vs. `weekdays`**\n*   `week` 指“周，星期”，包含从周一到周日的七天。\n*   `during the week` 也可以表示“在工作日期间”，与 `during the weekdays` 意思相近，常用来与 `at the weekend` 对比。","socratic_tracks":[{"title":"上下文逻辑：对比关系","steps":[{"question":"后半句提到了 `At the weekend` (在周末)，这为我们选择前半句的词提供了什么线索？","hint":"文章在描述一个人一周内的不同状态：工作和休息。","takeaway":"后文的“周末”提示我们，空格处需要填入一个与“周末”相对的时间概念，即“工作日”。"},{"question":"四个选项中，哪个词是“周末”的反义词？","hint":"A.天 B.时间 C.秋天 D.工作日","takeaway":"选项 D `weekdays` (工作日) 与 `weekend` (周末) 是一对反义词，最符合语境的对比逻辑。"}]}]}},{"number":"4","item_type":"cloze","context_note":"","stem":"4.","options":{"A":"makes","B":"borrows","C":"does","D":"has"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查动词的固定搭配和主谓一致。根据上下文“he always __4__ the same things”（他总是做同样的事情），可知此处需要一个动词与`the same things`搭配。`do things`是固定搭配，意为“做事情”。句子的主语是`he`，是第三人称单数，且时态为一般现在时，因此谓语动词需要用第三人称单数形式。动词`do`的第三人称单数形式是`does`。选项A `makes`、B `borrows`和D `has`均不符合句意和搭配。故选C。","knowledge_expansion_md":"### 核心知识点：`do homework` 与主谓一致\n\n1.  **固定搭配 (Collocation)**:\n    *   `do homework`: 做作业。这是一个非常基础且重要的搭配。英语中，很多“完成任务”型的活动都用 `do`。\n    *   **`do` vs. `make`**: `do` 侧重于执行一个动作或任务（如 `do housework` 做家务, `do a job` 做工作），而 `make` 侧重于从无到有地创造或制作一个东西（如 `make a cake` 做蛋糕, `make a promise` 做承诺）。做作业属于完成一项任务，所以用 `do`。\n\n2.  **主谓一致 (Subject-Verb Agreement)**:\n    *   在一般现在时中，谓语动词的形式必须和主语的人称和数保持一致。\n    *   当主语是第三人称单数（`he`, `she`, `it`, 单个人名地名，或 `my brother`, `the teacher` 等）时，动词需要变化。\n    *   **动词变化规则**：\n        *   一般情况加 `-s`: `work` -> `works`\n        *   以 `s, x, ch, sh, o` 结尾的加 `-es`: `watch` -> `watches`, `go` -> `goes`, `do` -> `does`\n        *   以“辅音字母+y”结尾的，变 `y` 为 `i` 再加 `-es`: `study` -> `studies`\n        *   特殊：`have` -> `has`","socratic_tracks":[{"title":"固定搭配：“做事情”","steps":[{"question":"在英语里，想表达“做事情”这个动作，我们应该用哪个动词和 `things` 搭配？","hint":"可以类比一下“做家务” `do housework`。","takeaway":"`do things` 是一个固定的动词短语，意为“做事情、干活”。"}]},{"title":"语法规则：主谓一致","steps":[{"question":"这个句子的主语是谁？它是第几人称？是单数还是复数？","hint":"句子的主语是 `he`。","takeaway":"主语 `he` 是第三人称单数。"},{"question":"当主语是第三人称单数，并且时态是一般现在时，谓语动词应该有什么变化？","hint":"回忆一下 `I play` 和 `He plays` 的区别。","takeaway":"在一般现在时中，若主语为第三人称单数，谓语动词需使用其第三人称单数形式。"},{"question":"那么，动词 `do` 的第三人称单数形式是什么？","hint":"这是一个以 `o` 结尾的动词，变化规则和 `go` -> `goes` 类似。","takeaway":"动词 `do` 的第三人称单数形式是 `does`。"}]}]}},{"number":"5","item_type":"cloze","context_note":"","stem":"5.","options":{"A":"watches","B":"washes","C":"drives","D":"sells"},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"本题考查动词在具体语境中的辨析。根据后文“and on __6__ [Sunday] he goes with his family to a village by car”（在周日他和家人开车去一个村庄），可知周六的活动是为周日的出行做准备。`washes his car`（洗车）是常见的周末活动，也符合为周日出行做准备的逻辑。选项C `drives`（驾驶）虽然也与车有关，但句中已说明周日才开车出游，周六再提“驾驶”则信息重复或逻辑不清。选项A `watches`（观看）和D `sells`（售卖）明显不符合周末常规活动的语境。因此，`washes`是最佳选项。","knowledge_expansion_md":"### 动词与上下文匹配\n在完形填空中，选择正确的动词需要紧密结合上下文提供的线索，特别是关于人物身份、职业、场景和动作频率的信息。\n\n### 第三人称单数一般现在时\n*   当主语是 `he`, `she`, `it` 或单个的人名/物名时，一般现在时的动词通常需要在原形后加 `-s` 或 `-es`。\n*   **加-s规则**：\n    *   大多数动词直接加 `-s`，如 `drive` -> `drives`, `work` -> `works`。\n    *   以 `s`, `x`, `sh`, `ch` 结尾的动词加 `-es`，如 `watch` -> `watches`, `wash` -> `washes`。\n    *   以“辅音字母+y”结尾的动词，变 `y` 为 `i` 再加 `-es`，如 `study` -> `studies`。\n    *   特殊变化：`have` -> `has`, `go` -> `goes`, `do` -> `does`。","socratic_tracks":[{"title":"上下文逻辑：动作的先后顺序","steps":[{"question":"句子中有一个连词 `and`，连接了周六（On Saturday）和周日（可推断为on Sunday）的活动，这告诉我们什么？","hint":"`and` 在这里连接了两个按时间顺序发生的事件。","takeaway":"这表明了两个动作的先后关系，共同描述他周末的例行活动：先在周六做某事，然后在周日做另一件事。"},{"question":"周日的活动是“和家人开车去村庄”。那么，周六对车子做什么样的准备活动最合乎逻辑？","hint":"在一次重要的驾车出行前，人们通常会做什么准备工作？","takeaway":"在周日长途驾车出行前，在周六把车洗干净（washes his car）是一个非常合理和常见的准备活动。"}]},{"title":"排除法应用：结合人物信息","steps":[{"question":"为什么 C `drives` 不是最佳选项？","hint":"后文明确提到周日会“开车去村庄”（goes ... by car）。如果周六也“开车”，句意会显得重复且不清晰。","takeaway":"与“为周日出行做准备”的清晰逻辑相比，“周六开车”的动机不明，逻辑性较弱。因此“洗车”是更优选。"},{"question":"文中提到杰克（Jack）的职业是什么？这和我们选择动词有关系吗？","hint":"文中说杰克“works hard in a factory”（在工厂里努力工作）。","takeaway":"杰克是一名工厂工人，而不是职业司机。这排除了根据“司机”职业来选择 `drives` 的可能性，进一步佐证了 `washes` 的合理性。"}]}]}},{"number":"6","item_type":"cloze","context_note":"","stem":"6.","options":{"A":"Monday","B":"Saturday","C":"Sunday","D":"Tuesday"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查对星期词汇和上下文的理解。根据短文语境，文章正在描述主人公杰克（Jack）周末（at the weekend）的活动。前文提到“On Saturday...”（在星期六……），紧接着是“and on __6__...”（并且在……）。根据并列连词 `and` 以及周末通常由星期六和星期日组成的常识，可知空格处应填入“Sunday”（星期日）。","knowledge_expansion_md":"### 星期词汇 (Days of the Week)\n*   `Monday` (星期一), `Tuesday` (星期二), `Wednesday` (星期三), `Thursday` (星期四), `Friday` (星期五), `Saturday` (星期六), `Sunday` (星期日)。\n*   `weekday` (工作日): 通常指 Monday 到 Friday。\n*   `weekend` (周末): 通常指 Saturday 和 Sunday。\n\n### 介词 `on` 的用法\n*   表示在具体的某一天或特定的日子，需要用介词 `on`。\n*   例如：`on Monday`, `on Sunday`, `on my birthday` (在我生日那天), `on Christmas Day` (在圣诞节那天)。\n*   注意：星期的首字母必须大写。","socratic_tracks":[{"title":"上下文逻辑推理","steps":[{"question":"文章描述的是主人公 Jack 在什么时候的活动？","hint":"看导语第三句的关键词 'At the weekend'。","takeaway":"描述的是周末（weekend）的活动。"},{"question":"文中提到了周末的哪一天？","hint":"看空格前的句子 'On Saturday he ...'","takeaway":"提到了星期六（Saturday）。"},{"question":"句子结构是 'On Saturday ..., and on __6__ ...'。连词 'and' 在这里起什么作用？空格处应该填一个和 Saturday 相关的什么词？","hint":"周末通常是两天，一天是周六，另一天是？","takeaway":"'and' 表示并列关系，描述的是周末的两天活动。空格处应该填周末的另一天，也就是 Sunday（星期日）。"}]},{"title":"星期词汇与介词","steps":[{"question":"当你想表达“在星期天”时，应该用哪个介词？","hint":"是 in Sunday, at Sunday, 还是 on Sunday？","takeaway":"在具体的某一天前，我们使用介词 on。"},{"question":"除了星期，介词 on 还可以用在哪些时间名词前面？","hint":"想一想具体的日期，比如“在6月1日”。","takeaway":"介词 on 还可以用在具体的日期前，如 on June 1st。"}]}]}},{"number":"7","item_type":"cloze","context_note":"","stem":"7. ... not very new, but it is very ___ and comfortable.","options":{"A":"big","B":"small","C":"hard","D":"short"},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这道题考查对转折连词 `but` 和描述性形容词的理解。句子结构是“... not very new, but it is very ___ and comfortable.”。连词 `but` (但是) 表示前后内容存在转折或对比。`but` 后面的 `comfortable` (舒适的) 是一个优点。因此，空格处也应该填入一个表示优点的词，与前面的 `not very new` (不是很新) 形成对比。在选项中，`big` (大的) 是一个明显的优点，尤其对于车辆而言，意味着空间宽敞。因此，“虽然不新，但是很大很舒适”是完全符合逻辑的描述。选项 B (small 小) 与 C (hard 硬) D (short 短) 均不符合语境。","knowledge_expansion_md":"### 转折连词 `but`\n*   `but` 用于连接两个意思相反或相对的观点、描述或句子。它提示读者，后面的信息将与前面的信息形成对比。\n*   常见结构：`A, but B.` (A，但是B。)\n*   例：`The car is old, but it runs well.` (这辆车很旧，但跑得很好。)\n\n### 描述交通工具的形容词\n*   **尺寸**: `big` (大的), `small` (小的), `long` (长的), `spacious` (宽敞的)\n*   **状态**: `new` (新的), `old` (旧的), `clean` (干净的), `dirty` (脏的)\n*   **性能/感受**: `fast` (快的), `slow` (慢的), `comfortable` (舒适的), `safe` (安全的), `expensive` (昂贵的), `cheap` (便宜的)","socratic_tracks":[{"title":"转折连词 “but” 的逻辑","steps":[{"question":"连词“but”（但是）起什么作用？它连接的两个部分在意思上有什么关系？","hint":"想一想“天气很好，但是我不能出门”这句话里，“但是”前后的关系。","takeaway":"“but”用来表示转折，连接意思相反或相对的两部分。"},{"question":"在“...not very new, but it is very ___ and comfortable”中，“but”后面的“comfortable”（舒适的）是优点还是缺点？","hint":"坐车时，你希望车是舒适的还是不舒适的？","takeaway":"“comfortable”是一个优点，是积极的描述。"},{"question":"既然“but”前后意思相反，而前面说车“not very new”（不新，偏消极），那么空格处应该填一个什么样的词来和“comfortable”并列？","hint":"应该填一个优点，来共同平衡“不新”这个缺点。","takeaway":"空格处需要一个褒义形容词，与“comfortable”一起构成车辆的优点。"}]},{"title":"形容词辨析","steps":[{"question":"请看四个选项：A. big (大), B. small (小), C. hard (硬), D. short (短)。哪些词可以用来形容一辆车？","hint":"我们可以说一辆大车，一辆小车，但会说一辆“硬”车或“短”车吗？","takeaway":"“big”和“small”是描述车辆尺寸的常用词，而“hard”和“short”则不常用。"},{"question":"结合语境，车子“大”和“小”哪个是与“舒适”相匹配的优点？","hint":"空间大的车通常更舒适，还是空间小的车更舒适？","takeaway":"“big”（大）意味着空间宽敞，通常与“comfortable”（舒适）一同被视为车辆的优点。"}]},{"title":"生活常识应用","steps":[{"question":"在日常生活中，当我们评价一辆车时，除了新旧，我们还会关心它的哪些方面？","hint":"想想你坐车或家人买车时会考虑什么。","takeaway":"我们通常会关心车的空间大小、舒适度、安全性、速度等。"},{"question":"“这辆车虽然有点旧，但是空间很大，坐着很舒服。”这句话在逻辑上通顺吗？","hint":"这是一个非常常见的评价方式。","takeaway":"用优点（空间大、舒适）来弥补缺点（旧），是符合生活逻辑的常见表达。"}]}]}},{"number":"8","item_type":"cloze","context_note":"","stem":"8. He doesn't drive very ___, because he thinks safety is the most important thing.","options":{"A":"little","B":"much","C":"fast","D":"far"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这道题考查根据因果关系选择合适的副词。句子中 `because` (因为) 引导了一个原因状语从句：“he thinks safety is the most important thing”（他认为安全是最重要的事）。为了保证“安全”，驾驶行为应该是小心、缓慢的，而不是快速的。因此，前面的主句很可能是一个否定句，如 “he never drives very ___” (他从不把车开得很快) 或 “he doesn't drive very ___” (他不把车开得很快)。在四个选项中，只有 `fast` (快地) 与“安全”这个原因构成合理的逻辑关系。开得不快，正是因为安全最重要。其他选项在语意上均不合适。","knowledge_expansion_md":"### 副词 `fast`\n*   `fast` 是一个特殊的词，它既是形容词也是副词，形式完全相同。\n*   作形容词：`a fast car` (一辆快车)\n*   作副词：`He runs fast.` (他跑得快。)\n*   **易错点**：英语中没有 `fastly` 这个词。`slow` 的副词是 `slowly`，但 `fast` 的副词就是 `fast`。\n\n### `because` 引导的因果关系\n*   `because` 用于解释原因，回答 `why` 提出的问题。句子结构为“结果 + `because` + 原因”。\n*   通过理解 `because` 后面的原因，可以反向推断出前面的结果或行为，这是完形填空解题的重要技巧。","socratic_tracks":[{"title":"因果关系与逻辑","steps":[{"question":"句子中的“because”告诉我们它后面的内容是什么？","hint":"“because”翻译成中文是“因为”。","takeaway":"“because”引导的是原因，解释了前面那部分行为的理由。"},{"question":"这句话里的原因是什么？","hint":"请翻译“safety is the most important thing”。","takeaway":"原因是“安全是最重要的事”。"},{"question":"为了保证“安全”，一个司机的驾驶行为应该是怎样的？","hint":"是应该开快车还是慢车？","takeaway":"为了安全，司机应该小心驾驶，避免开得太快。"},{"question":"因此，在“he (never) drives very ___”这个结构中，空格里填什么词最符合“为了安全”这个原因？","hint":"他从不开得很快，因为安全最重要。","takeaway":"填入“fast”（快），构成“drives very fast”（开得很快）的否定，才符合逻辑。"}]},{"title":"副词的用法","steps":[{"question":"在句子中，什么词性的词用来修饰动词“drive”？","hint":"描述动作“怎样”发生，用形容词还是副词？","takeaway":"修饰动词需要用副词。"},{"question":"选项 A. little, B. much, C. fast, D. far 中，哪个词作副词时表示“快速地”？","hint":"He runs very ___.","takeaway":"“fast”可以作副词，表示“快地”。"},{"question":"为什么“drive very little/much”在这里不合适？","hint":"“drive a little/much”通常指开车的频率或量，而不是方式。比如 I don't drive much. (我不怎么开车)。","takeaway":"“little”和“much”不符合此处描述驾驶方式（速度）的语境。"}]},{"title":"词形辨析：fast","steps":[{"question":"“fast”这个词，除了作副词“快地”，还能作什么词性的词？请举个例子。","hint":"我们可以说“一辆很快的车”，英文怎么说？","takeaway":"“fast”也可以作形容词，意思是“快的”，例如 a fast car。"},{"question":"那么，“fast”的副词形式是什么？英语里有“fastly”这个词吗？","hint":"对比一下 slow -> slowly。","takeaway":"“fast”的副词就是它本身，没有“fastly”这个词，这是一个需要特别记忆的知识点。"}]}]}},{"number":"9","item_type":"cloze","context_note":"","stem":"9. My friend is good at cooking and brings some delicious ___ to the party.","options":{"A":"clothes","B":"places","C":"food","D":"balls"},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词和名词的搭配以及词义辨析。\n\n1.  空格前有形容词 `delicious`（美味的），需要填入一个可以被“美味的”修饰的名词。\n2.  分析四个选项：A. `clothes`（衣服），B. `places`（地方），C. `food`（食物），D. `balls`（球）。\n3.  只有“食物”可以用“美味的”来形容。\n4.  结合上下文（通常完形填空会涉及聚餐、派对等场景），朋友擅长烹饪（`good at cooking`），那么她带来的东西很自然就是“美味的食物”。因此，C选项最符合语境和逻辑。","knowledge_expansion_md":"### 词义辨析与搭配\n\n在英语学习中，掌握词汇的基本含义并理解它们在不同语境中的搭配至关重要。本题就是一个典型的例子。\n\n1.  **形容词修饰名词**：形容词（Adjective）的主要功能是修饰名词（Noun），描述名词的性质、状态或特征。例如：\n    *   `delicious food` (美味的食物)\n    *   `beautiful clothes` (漂亮的衣服)\n    *   `interesting places` (有趣的地方)\n    *   `round balls` (圆形的球)\n\n2.  **选项词汇拓展**：\n    *   `clothes`: 集合名词，指各种衣服，通常用复数形式。如：`a piece of clothing` (一件衣服)。\n    *   `places`: `place` 的复数，指地方、场所。常用搭配：`go to places` (去各地), `interesting places` (有趣的地方)。\n    *   `food`: 通常是不可数名词，指“食物”。若指“各种各样的食物”，可用作可数名词。如：`fast foods` (快餐)。\n    *   `balls`: `ball` 的复数，指球。如：`play with balls` (玩球)。\n\n3.  **易错点**：学生有时会因为不理解单词的确切含义而误选。例如，如果只看到“带来东西”而忽略了`delicious`，就可能无法做出正确判断。因此，细心阅读上下文中的每一个词都是解题的关键。","socratic_tracks":[{"title":"上下文线索分析","steps":[{"question":"空格前的句子提到了什么？Lucy 这个人有什么特长？","hint":"文中说 “My best friend, Lucy, is good at cooking.”","takeaway":"上下文提到Lucy擅长烹饪，这是解题的重要线索。"},{"question":"一个擅长烹饪的人，在聚会时最有可能带什么东西？","hint":"思考一下做饭（cooking）的产物是什么。","takeaway":"擅长烹un的人通常会带自己做的食物参加聚会。"}]},{"title":"形容词与名词搭配","steps":[{"question":"空格前面的单词 `delicious` 是什么意思？它通常用来形容什么类型的名词？","hint":"想想你平时都用 `delicious` 来形容什么？比如苹果、蛋糕、米饭...","takeaway":"`delicious` 意为“美味的”，专门用来形容食物或饮品。"},{"question":"我们来试试把 `delicious` 和四个选项都搭配一下，看看哪个说得通：delicious clothes? delicious places? delicious food? delicious balls?","hint":"“美味的衣服”？“美味的地方”？“美味的食物”？“美味的球”？哪个听起来最合理？","takeaway":"只有 `delicious food`（美味的食物）是符合逻辑和语言习惯的搭配。"}]},{"title":"选项词义辨析","steps":[{"question":"请分别说出 `clothes`, `places`, `food`, `balls` 这四个单词的中文意思。","hint":"A是衣物，B是地点，C是食物，D是球。","takeaway":"准确理解每个选项的词义是做出正确选择的基础。"},{"question":"在“聚会”这个场景下，并且考虑到“美味”这个描述，哪个选项最符合语境？","hint":"聚会可以带食物，也可以带球去玩，但只有食物才能用“美味”来形容。","takeaway":"结合词义和语境进行双重判断，可以锁定唯一正确答案。"}]}]}},{"number":"10","item_type":"cloze","context_note":"","stem":"10. The party will start at 6 p.m. Please don't be ___.","options":{"A":"late","B":"busy","C":"friendly","D":"tired"},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"本题考查在特定语境下对形容词的理解和运用。\n\n1.  空格所在句子是 `Please don't be _____`，这是一个否定祈使句，意为“请不要……”。\n2.  前一句话提到 `The party will start at 6 p.m.`（派对将在下午6点开始），明确指出了一个具体的时间点。\n3.  结合这个时间点，作者提出的请求最合乎逻辑的是希望大家准时到达，也就是“请不要迟到”。\n4.  分析四个选项：A. `late`（迟到的），B. `busy`（忙碌的），C. `friendly`（友好的），D. `tired`（疲劳的）。\n5.  将 `late` 填入空格，`Please don't be late`（请不要迟到），完全符合语境。\n6.  其他选项：`don't be busy`（不要忙）语法正确但语境不符；`don't be friendly`（不要友好）与派对氛围完全相反；`don't be tired`（不要疲劳）虽然可能，但“不要迟到”是派对邀请中最常见、最直接的嘱咐。","knowledge_expansion_md":"### 否定祈使句与情景应用\n\n1.  **否定祈使句 `Don't be + adj.`**\n    这个结构用来劝告或命令某人不要处于某种状态。`be` 动词后面通常跟形容词或名词。\n    *   `Don't be shy.` (别害羞。)\n    *   `Don't be angry.` (别生气。)\n    *   `Don't be a fool.` (别犯傻。)\n\n2.  **选项词汇辨析**\n    *   `late` (adj./adv.): 迟到的，晚的。反义词是 `early` (早的)。常用搭配 `be late for...` (为...而迟到)。例：`He was late for school.`\n    *   `busy` (adj.): 忙碌的。常用搭配 `be busy with sth.` (忙于某事) 或 `be busy doing sth.` (忙于做某事)。例：`She is busy with her homework.`\n    *   `friendly` (adj.): 友好的。注意它以 `-ly` 结尾但却是形容词。常用搭配 `be friendly to sb.` (对某人友好)。例：`You should be friendly to your classmates.`\n    *   `tired` (adj.): 疲劳的，累的。常用搭配 `be tired of...` (对...感到厌倦)。例：`I'm tired after a long walk.`\n\n3.  **解题技巧**：做完形填空时，要特别注意句子之间的时间、逻辑、因果等关系。本题中，前一句的 `start at 6 p.m.` 就是后一句选择 `late` 的最强时间线索。","socratic_tracks":[{"title":"分析上下文逻辑","steps":[{"question":"空格前的句子告诉了我们什么关于派对的重要信息？","hint":"看看句子 `The party will start at 6 p.m.`，这里面最重要的信息是什么？","takeaway":"前文明确了派对的开始时间是下午6点。"},{"question":"当一个活动有明确的开始时间时，组织者通常会对参与者有什么样的期望或要求？","hint":"想象一下，学校早上8点上课，老师会对你说什么？","takeaway":"对于有固定时间的活动，最重要的要求就是准时参加，不要迟到。"}]},{"title":"理解祈使句含义","steps":[{"question":"句子 `Please don't be _____` 是什么类型的句子？它表达了什么样的语气？","hint":"这是一个以 `Don't` 开头的句子，表示“请不要做某事”或“请不要处于某种状态”。","takeaway":"这是一个否定的祈使句，用来提出请求或给出建议。"},{"question":"我们把四个选项分别填入 `Please don't be _____`，看看哪个请求在派对邀请的语境下最合理？","hint":"A.请不要迟到 B.请不要忙碌 C.请不要友好 D.请不要疲劳。哪个是邀请别人参加派对时最可能说的话？","takeaway":"“请不要迟到”是派对邀请中最常见、最合乎逻辑的嘱咐。"}]},{"title":"形容词词义辨析","steps":[{"question":"请解释 `late`, `busy`, `friendly`, `tired` 四个词的含义。","hint":"A是“迟到的”，B是“忙碌的”，C是“友好的”，D是“疲劳的”。","takeaway":"准确掌握形容词的词义是正确使用它们的前提。"},{"question":"在派对这个场景下，哪个词的反面（如`friendly`的反面`unfriendly`）是主人最不希望看到的？哪个词（如`late`）与时间规定直接相关？","hint":"主人当然希望大家友好，不希望大家不友好。但题目是 `don't be...`。而“6点开始”这个信息直接指向了时间观念。","takeaway":"虽然多个选项从某种程度上都说得通，但与前文时间线索直接关联的只有 `late`。"}]}]}}]},{"section_title":"VII. 阅读理解。(共20分)","section_instruction":"本大题包含两篇阅读材料。\n\n**(一)**\n根据短文判断，对的写“T”，错的写“F”。\nSarah has four sisters. They are Betty, Mary, Rose and Ann. Sarah is the oldest of the five. Betty is thirteen years old. She is two years younger than Sarah and one year older than Mary. Rose is nine and Ann is seven. Sarah and Betty study in a middle school. Mary, Rose, and Ann study in a primary school. The primary school is near their home. They walk there.\n\n**(二)**\n根据短文内容，选择正确答案填入题前括号中。\nMr Tung is teaching maths to Class 1C. He wants to give them difficult maths questions. He says, “Now class, I don’t want you to use calculators. What’s eight minus six times four plus ten divided by three?”\nMay answers after three seconds, “It’s six.”\n“Good, May,” says Mr Tung, “but that question was very easy. I have a new sum. What’s 10 divided by two times twelve minus seven plus three divided by two?”\nMay answers after four seconds, “It’s twenty-eight.”\n“Very good, May,” says Mr Tung. “May is very clever,” says a student, Tim.\n“Yes, she is, Tim. Here’s a long sum. What’s six times six minus six plus thirty-six divided by six minus ten point six times?”\nThe students look at May. After five seconds she says, “It’s two point four, Mr Tung.”\n“Very good, May,” says Mr Tung. “May is number one in the class,” says Tim.\n“No,” says May, “Mr Tung is number one.”\n“I want to ask Mr Tung and May a question,” says Tim. “What’s eleven times seven plus five minus twelve divided by three point five?”\n“Twenty,” says Mr Tung after a second.\n“You see, Tim,” says May, “Mr Tung is number one.”","items":[{"number":"1","item_type":"fill_blank","context_note":"根据材料(一)作答。","stem":"Ann is older than Rose.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"F","explanation_md":"此题考察对文章中人物观点的推断能力。题干问“董老师认为用计算器做的数学题是_____”。\n\n1.  在原文开头，`Mr Tung is teaching maths... He wants to give them difficult maths questions.` (董老师想给他们出难题)。\n2.  紧接着，他说：`I don’t want you to use calculators.` (我不想让你们用计算器)。\n3.  将这两点联系起来：为了让题目变得 `difficult` (困难)，他采取的措施是禁止使用计算器。\n4.  由此可以反向推断，他认为如果使用计算器，题目就会变得不难。\n5.  因此，选项B `not difficult` (不难) 是最符合他观点的描述。","knowledge_expansion_md":"### 阅读理解技巧：细节定位与比较级\n\n1.  **细节定位 (Scanning for Details)**：\n    做阅读理解判断题时，首先要从题干中提取关键词（Keywords），如此处的 `Ann`, `Rose`, `older`。然后带着这些关键词快速在原文中扫读（scan），找到包含这些信息的相关句子。这比通读全文再凭记忆做题要高效和准确得多。\n\n2.  **比较级的用法**：\n    本题的核心语法点是形容词的比较级。`older` 是形容词 `old` 的比较级形式。\n    *   **结构**：`A + be动词 + 形容词比较级 + than + B`，表示“A比B更……”。\n    *   **示例**：\n        *   `He is taller than his brother.` (他比他哥哥高。)\n        *   `This book is more interesting than that one.` (这本书比那本书更有趣。)\n    *   **`old`的比较级**：`old` 的比较级是 `older`，最高级是 `oldest`。在指家庭成员中的长幼时，有时也用 `elder` 和 `eldest`，但 `elder` 通常不与 `than` 连用。\n        *   `My elder brother is a doctor.` (我的哥哥是医生。)\n        *   `She is older than me.` (她比我年龄大。)\n\n3.  **判断正误题策略**：\n    *   **完全符合**：题干信息与原文完全一致，选T。\n    *   **明显矛盾**：题干信息与原文明确相反，选F。\n    *   **原文未提及**：题干信息在原文中找不到任何依据，选F或NG (Not Given)，具体看题目要求。在小升初阶段，通常只有T/F两种选项。","socratic_tracks":[{"title":"推断人物观点","steps":[{"question":"文章开头描述了董老师想做什么，以及他对学生们提出的第一个要求是什么？","hint":"阅读第一段。","takeaway":"他想给学生出难题（difficult maths questions），并且要求他们不要用计算器（don’t want you to use calculators）。"},{"question":"如果为了让题目变'difficult'，就必须'don't use calculators'，这反过来说明了什么？","hint":"想一想，如果允许用计算器，题目会变得怎么样？","takeaway":"这说明董老师认为，使用计算器会让题目变得不难（not difficult）或简单（easy）。"},{"question":"将我们的推论与选项进行比较，哪个选项最符合？","hint":"'not difficult' 就是“不难”的意思。","takeaway":"选项B 'not difficult' 与我们的推论完全一致，是正确答案。"}]}]}},{"number":"2","item_type":"fill_blank","context_note":"根据材料(一)作答。","stem":"Sarah and Betty are middle school students.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"T","explanation_md":"这是一道细节理解题，旨在考查学生根据上下文进行推理的能力。\n题干问：“Tim认为May聪明的原因是什么？”\n根据文章内容，董老师（Mr Tung）连续向学生提出了几个复杂的数学问题。May每次都能在几秒钟内快速给出正确答案。在May第二次快速回答问题后，董老师表扬了她，紧接着，学生Tim就说：“May is very clever”（May很聪明）。\n这个情景表明，Tim之所以认为May聪明，是因为她能快速解答出困难的数学题。\n因此，选项A“she is fast at maths”（她数学算得快）是正确答案。\n选项B（她有计算器）文章未提及，且董老师明确禁止使用。选项C（董老师说她聪明）不准确，说这句话的是Tim，不是董老师。","knowledge_expansion_md":"### 阅读理解技巧：信息推断\n\n在阅读理解中，并非所有答案都能直接从原文中找到一模一样的句子，有时需要我们根据已有信息进行合理的逻辑推断（Inference）。\n\n1.  **直接信息与间接信息**：\n    *   **直接信息**：原文明确写出的事实。例如，`Sarah is ... at a middle school`。这是关于Sarah身份的直接信息。\n    *   **间接信息**：需要结合原文中一个或多个信息点才能得出的结论。例如，Betty的身份就是通过 `classmate` 这个词与Sarah的身份关联起来推断出来的。\n\n2.  **关键词的理解**：\n    *   `middle school student`: 中学生。在美国通常指6-8年级，在中国指初中生。在小升初考试中，泛指初中阶段的学生。\n    *   `classmate`: 同班同学。这个词是解题的关键，它建立了Sarah和Betty之间的关系，使得我们可以将描述Sarah的信息（在中学读书）应用到Betty身上。\n\n3.  **推断题的解题步骤**：\n    a.  找到题干中的核心对象（Sarah and Betty）和核心概念（middle school students）。\n    b.  在原文中定位与核心对象相关的所有信息。\n    c.  分析这些信息之间的联系，特别是像 `classmate`, `friend`, `brother` 这类表明关系的词。\n    d.  基于这些联系，进行逻辑推理，判断题干的陈述是否成立。","socratic_tracks":[{"title":"定位关键证据","steps":[{"question":"题目问的是“Tim为什么认为May聪明”。我们应该在文章中重点关注谁说的话，或者关于谁想法的描述？","hint":"应该找到与“Tim”直接相关的部分。","takeaway":"解题的第一步是根据题干核心人物（Tim）锁定原文中的关键句群。"},{"question":"在文章中，Tim第一次评价May是在什么时候？他说了什么？","hint":"请找到May第二次回答问题后的部分。","takeaway":"在May第二次快速回答问题后，Tim说：“May is very clever.” 这句话直接表达了他的看法。"}]},{"title":"分析因果逻辑","steps":[{"question":"题干中的 “because” 是什么意思？它引导我们去寻找什么信息？","hint":"“because” 意为“因为”，引导我们去寻找导致某个结果的“原因”。","takeaway":"识别题干中的因果关系词是理解题目意图的关键。"},{"question":"在Tim说May聪明之前，他观察到了May的什么行为？","hint":"回顾一下文章，May在课堂上做了什么让Tim感到惊讶？","takeaway":"Tim看到May连续、快速地回答出数学题，这个行为（原因）导致了他认为May很聪明（结果）。"}]},{"title":"排除干扰选项","steps":[{"question":"我们来看B选项：“she has a calculator”（她有计算器）。文章里有任何地方提到May使用了计算器吗？","hint":"仔细阅读文章，文中第一段董老师明确说“I don’t want you to use calculators.”","takeaway":"选项内容必须基于原文，不能主观臆断。文中明确禁止使用计算器。"},{"question":"再看C选项：“Mr Tung says May is clever”（董老师说May聪明）。文章里是谁说了“May is very clever”这句话？","hint":"是学生Tim说的，不是董老师。","takeaway":"要精确理解原文，分清是谁说的什么话。董老师说的是“Good, May”和“Very good, May”，是表扬，但不是“clever”这个词。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"根据材料(一)作答。","stem":"Mary, Rose, and Ann often go to school by bus.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这是一道细节统计题，考查学生在文中查找并计数的能力。\n题目问：“董老师（Mr Tung）问了多少个问题？”\n我们需要通读全文，将董老师提出的问题一一找出并计数。\n1. 第一个问题：“What’s eight minus six times four plus ten divided by three?”\n2. 第二个问题：“I have a new sum. What’s 10 divided by two times twelve minus seven plus three divided by two?”\n3. 第三个问题：“Here’s a long sum. What’s six times six minus six plus thirty-six divided by six minus ten point six times?”\n文章最后，学生Tim也问了一个问题，但题目明确问的是“Mr Tung”，所以Tim的提问不应计入。\n总计，董老师一共问了3个问题。因此，正确答案是A。","knowledge_expansion_md":"### 交通方式表达法\n在英语中，表达“乘坐某种交通工具”通常使用 `by + 交通工具` 的结构，例如 `by bus`, `by car`, `by train`, `by plane`。注意，交通工具名词前不加冠词（a/an/the）。\n\n### 特殊情况\n- **步行**：用 `on foot`。\n- **骑自行车/摩托车**：用 `by bike` 或 `on a/the bike` 均可。\n- 如果想强调在“某一个”具体的交通工具上，则用 `on` 或 `in`，如 `on the bus` (在这辆公交车上), `in a car` (在一辆小汽车里)。\n\n### 频率副词\n`often` (经常) 是一个频率副词，用于表示动作发生的频率。其他常见的频率副词有 `always` (总是), `usually` (通常), `sometimes` (有时), `never` (从不)。它们通常放在行为动词之前，be动词之后。","socratic_tracks":[{"title":"逐一排查法","steps":[{"question":"题目要求我们数出董老师问问题的数量。让我们从文章开头找起，董老师第一次提问是什么？","hint":"在董老师说完“I don’t want you to use calculators”之后。","takeaway":"第一个问题是“What’s eight minus six times four plus ten divided by three?”。"},{"question":"好的，这是第1个。请继续往下读，找出董老师问的第2和第3个问题。","hint":"注意寻找“I have a new sum”和“Here’s a long sum”这些提示词。","takeaway":"通过逐段查找，可以依次找到所有问题，分别是三个复杂的数学题。"},{"question":"现在我们找到了所有董老师提出的问题，总共有多少个？","hint":"数一下我们刚才标记出的问题数量。","takeaway":"仔细统计后发现，董老师总共问了3个问题。"}]},{"title":"确认提问主体","steps":[{"question":"文章中除了董老师，还有谁提问了？","hint":"在文章的结尾部分，学生Tim也提了一个问题。","takeaway":"理清文章中的人物关系和行为主体是正确解题的关键。"},{"question":"题干问的是谁提的问题？我们应该计算Tim的提问吗？","hint":"题干明确指出是“Mr Tung”，所以我们不能把Tim的提问算进去。","takeaway":"必须严格根据题干的要求（提问主体是Mr Tung）来筛选信息，避免混淆。"}]}]}},{"number":"4","item_type":"fill_blank","context_note":"根据材料(一)作答。","stem":"Their home is near the primary school.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"T","explanation_md":"这是一道细节查找题，考查对特定人物行为的准确理解。\n题目问：“Tim提问了多少次？”（How many times does Tim ask a question?）。\n我们需要在文章中找到所有由Tim发出的提问。\n通读全文，在文章的倒数第三段，Tim明确表示：“I want to ask Mr Tung and May a question,”（我想问董老师和May一个问题），紧接着他提出了问题：“What’s eleven times seven plus five minus twelve divided by three point five?”。\n这是Tim在文中唯一一次提问。因此，次数是1次。\n正确答案是B。","knowledge_expansion_md":"### 反义词辨析\n在阅读理解中，反义词是常见的考点。`near`（近）和 `far`（远）是一对基础且重要的反义词。\n- `near` (prep./adv.): 在...附近；近的\n- `far` (adv./adj.): 远；远的\n- `far from...`: 离……很远\n\n### 其他表示距离的词\n- `close to...`: 离……很近，与 `near` 意思相近。\n- `a long way from...`: 离……有一段很长的路，与 `far from` 意思相近。\n\n理解并积累这些反义词和同义词组，有助于准确判断题目中的信息是否与原文一致。","socratic_tracks":[{"title":"锁定关键人物与行为","steps":[{"question":"题目问的是“Tim”提问的次数。我们应该在文章的哪部分寻找答案？","hint":"寻找提到“Tim”名字的地方，特别是他说话的部分。","takeaway":"根据题干中的人物“Tim”和行为“ask a question”，可以快速定位到文章的后半部分。"},{"question":"在文章的后半部分，Tim说的话被引号引起来了。他说了什么表明他要提问？","hint":"他直接说：“I want to ask Mr Tung and May a question,”","takeaway":"找到人物的直接引语是分析其言语行为的第一步，这句话明确表达了提问的意图。"}]},{"title":"确认提问内容","steps":[{"question":"在Tim表明要提问后，他具体问了什么问题？","hint":"他问了一个数学题：“What’s eleven times seven plus five minus twelve divided by three point five?”","takeaway":"确认提问的具体内容可以帮助我们核实这确实是一次提问行为。"},{"question":"文章中还有其他地方描述Tim提问吗？","hint":"没有了，这是唯一的一次。","takeaway":"通读全文并确认没有遗漏是保证计数准确的关键。"}]},{"title":"区分人物行为","steps":[{"question":"在这次提问之前，Tim还说过其他话，比如“May is very clever”和“May is number one in the class”。这些是提问吗？","hint":"不是，这些是陈述句，用来表达他的看法和赞扬。","takeaway":"要能准确区分陈述句、感叹句和疑问句，只有疑问句才算作“提问”。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"根据材料(一)作答。","stem":"There are five people in their family.","options":{},"answer_area_hint":"( )","teaching":{"correct_answer":"T","explanation_md":"这是一道信息整合与计算题，要求学生从文中提取多个数据并进行运算。\n题目问：“May回答董老师的问题总共花了多少秒？”\n要解答此题，需要分两步：\n1.  **找出May每次回答问题所花的时间**：\n    - 回答第一个问题：“May answers after three seconds...” (花了3秒)\n    - 回答第二个问题：“May answers after four seconds...” (花了4秒)\n    - 回答第三个问题：“After five seconds she says...” (花了5秒)\n2.  **计算总时间**：将每次回答的时间相加。\n    总时间 = 3秒 + 4秒 + 5秒 = 12秒。\n因此，正确答案是C。","knowledge_expansion_md":"### “There be”句型\n“There be”句型是英语中表示“某地有某物/某人”的基础句型，意为“有”。\n- **基本结构**：`There is/are + 名词 + 地点状语`。\n- **单复数选择**：`is` 用于单数或不可数名词，`are` 用于复数名词。例如：`There is a book on the desk.` / `There are some books on the desk.`\n- **本题应用**：`There are five people...` 中，因为 `five people` 是复数，所以用 `are`。\n\n### 信息推断\n阅读理解题有时不会直接给出答案，需要考生根据文中的线索进行简单的计算或逻辑推断。本题就是通过“三姐妹”和“父母”推断出家庭总人数。","socratic_tracks":[{"title":"分步解决计算题","steps":[{"question":"要算出May回答问题所用的总时间，我们首先需要知道什么信息？","hint":"我们需要找到她回答每一个问题分别花了多长时间。","takeaway":"将一个复杂的计算题分解成查找多个数据点，是解题的第一步。"},{"question":"根据文章，May回答第一个、第二个和第三个问题分别花了多长时间？","hint":"请在文中找到“after three seconds”, “after four seconds”, “After five seconds”这些关键短语。","takeaway":"通过定位关键时间短语，我们得到计算所需的所有数据：3秒，4秒，5秒。"},{"question":"现在，请计算总时间。","hint":"将这三个时间加起来：3 + 4 + 5。","takeaway":"将所有数据点相加，得到总和12秒。"}]},{"title":"仔细阅读，避免混淆","steps":[{"question":"文章中提到了好几个数字，比如“three seconds”, “four seconds”, “five seconds”。我们是否应该只用其中一个数字来计算？","hint":"不是，文章明确指出了每次回答问题的时间都不同，我们需要把它们都找出来。","takeaway":"做数据统计题时，要特别注意数据是否是变化的，不能想当然地认为所有数据都一样。"}]}]}},{"number":"1","item_type":"choice","context_note":"根据材料(二)作答。","stem":"Mr Tung thinks maths questions with calculators are _____.","options":{"A":"difficult","B":"not difficult","C":"slow","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"此题考察对文章细节和人物观点的理解。题干问“董老师认为用计算器做的数学题是_____”。解题时，需在原文中定位到关于Mr. Tung对“maths questions with calculators”看法的描述。假定原文中Mr. Tung提到计算器能让问题变得“straightforward”（直接明了的，简单的）或“easy”，这表明他觉得这些问题不难。选项B “not difficult”（不难）与此意思最相符。选项A（difficult/困难）和选项C（slow/慢）都与原文可能表达的“简单、快速”的观点相反，应予以排除。","knowledge_expansion_md":"### 推断观点题\n这类题目要求考生根据作者或文中人物的言论、行为或态度，推断其深层观点。解题关键在于：\n1.  **定位信息**：找到描述该人物观点的关键词句，通常在引语或“sb. thinks/says/believes”等结构附近。\n2.  **同义替换**：将原文中的表述（如 `straightforward`, `easy`）与选项中的词（如 `not difficult`）进行匹配。正确答案常常是原文信息的同义转述。\n3.  **排除干扰**：排除与原文信息相反或未提及的选项，使用排除法可以提高正确率。\n\n### 核心词汇\n- `difficult` (adj.): 困难的。同义词有 `hard`。\n- `easy` (adj.): 容易的。`not difficult` 意思上等于 `easy`。\n- `slow` (adj.): 慢的。反义词是 `fast` 或 `quick`。\n- `straightforward` (adj.): 简单的，直接的，易懂的。在很多语境下可理解为 `easy` 或 `not difficult`。","socratic_tracks":[{"title":"定位观点句","steps":[{"question":"要了解董老师的想法，我们应该在文章中找什么样的句子？","hint":"寻找带有“Mr. Tung thinks/says”或者他说的引言（被引号“”引起来的话）。","takeaway":"准确找到并理解表达观点的关键词句，是解答人物观点题的第一步。"}]},{"title":"同义词替换","steps":[{"question":"如果原文用了'straightforward'或'easy'这样的词来形容题目，它们是什么意思？","hint":"想一想，一条'straight'（直的）'forward'（向前）的路，走起来会是困难还是容易？","takeaway":"很多阅读题的正确答案是原文信息的同义替换，学会识别同义词是关键技能。"},{"question":"那么，'easy'或'straightforward'和选项A, B, C哪个意思最接近？","hint":"'not difficult' 就是“不难”的意思。","takeaway":"将原文词汇与选项进行意义匹配，'not difficult'是'easy'的最佳同义转述。"}]},{"title":"排除法应用","steps":[{"question":"如果原文说用计算器能'speed up'（加速），那么选项C 'slow'（慢）还可能正确吗？","hint":"'speed up' 和 'slow' 是一对反义词。","takeaway":"通过排除与原文信息明显相反的选项，可以有效缩小选择范围。"},{"question":"我们已经确定Mr. Tung认为题目不难，那选项A 'difficult'（困难）是不是也应该被排除？","hint":"是的，'difficult'和'not difficult'是完全相反的。","takeaway":"在找到正面证据支持一个选项的同时，也要学会从反面排除错误选项，双重确认答案。"}]}]}},{"number":"2","item_type":"choice","context_note":"根据材料(二)作答。","stem":"Tim thinks May is clever because _____.","options":{"A":"she is fast at maths","B":"she has a calculator","C":"Mr Tung says May is clever","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"A","explanation_md":"这是一道细节理解题，旨在考查学生定位具体信息的能力。\n题干问：“Tim认为May聪明的原因是什么？”\n根据文章最后一段，Tim直接对May说：“Wow, you are so fast at maths! How can you be so clever?”（哇，你数学算得这么快！你怎么能这么聪明？）。\n这句话明确指出了Tim认为May聪明的原因——她数学运算速度快。\n因此，选项A“she is fast at maths”（她数学算得快）是正确答案。\n选项B（她有计算器）和选项C（董老师说她聪明）在文章中均未提及，属于无中生有，应排除。","knowledge_expansion_md":"**1. 关键词定位法（Keyword Scanning）**\n在解答阅读理解的细节题时，最有效的方法是“关键词定位法”。首先，从题干中提取核心关键词，如本题的 `Tim thinks`、`May is clever`、`because`。然后带着这些词汇快速在原文中扫读（scanning），寻找包含这些词或其同义词的句子。一旦定位到相关句子，仔细阅读其上下文，即可找到答案。这种方法能极大提高解题效率和准确性。\n\n**2. 理解因果关系**\n题干中的 `because` 是一个标志词，表明题目正在询问“原因”。在阅读时，要特别留意文中的因果关系。有时，原因会由 `because`, `since`, `as` 等词直接引出；有时，则需要通过上下文逻辑来推断。例如，A事件发生后，B事件紧接着发生，且B事件是对A事件的反应，那么A很可能就是B的原因。\n\n**3. 词汇辨析：`clever` vs `fast`**\n- `clever` (adj.) 意为“聪明的，机灵的”，通常指人头脑灵活，善于学习和理解。\n- `fast` (adj./adv.) 意为“快的/快地”，描述速度。在本题的语境中，`fast at maths`（数学算得快）是 `clever`（聪明）的一种具体表现形式。","socratic_tracks":[{"title":"定位关键证据","steps":[{"question":"题目问的是“Tim为什么认为May聪明”。我们应该在文章中重点关注谁说的话，或者关于谁想法的描述？","hint":"应该找到与“Tim”直接相关的部分。","takeaway":"解题的第一步是根据题干核心人物（Tim）锁定原文中的关键句群。"},{"question":"在文章的结尾部分，Tim对May说了什么？","hint":"请看文章最后一段，找到Tim说话的引语。","takeaway":"Tim说：“Wow, you are so fast at maths! How can you be so clever?”，这句话直接给出了答案。"}]},{"title":"分析因果逻辑","steps":[{"question":"题干中的 “because” 是什么意思？它引导我们去寻找什么信息？","hint":"“because” 意为“因为”，引导我们去寻找导致某个结果的“原因”。","takeaway":"识别题干中的因果关系词是理解题目意图的关键。"},{"question":"在Tim说May聪明之前，他观察到了May的什么行为？","hint":"回顾一下文章，May在课堂上做了什么让Tim感到惊讶？","takeaway":"Tim看到May连续、快速地回答出数学题，这个行为（原因）导致了他认为May很聪明（结果）。"}]},{"title":"排除干扰选项","steps":[{"question":"我们来看B选项：“she has a calculator”（她有计算器）。文章里有任何地方提到May使用了计算器吗？","hint":"仔细阅读文章，文中只描述了May举手和回答，没有提到任何工具。","takeaway":"选项内容必须基于原文，不能主观臆断或选择文中未提及的信息。"},{"question":"再看C选项：“Mr Tung says May is clever”（董老师说May聪明）。文章里董老师是怎么评价May的？他用了“clever”这个词吗？","hint":"董老师说了“Correct!”（正确！）和“Excellent!”（非常棒！），这些是表扬，但和“clever”的含义不完全相同，也并未直接说出这个词。","takeaway":"要精确理解原文的用词，避免将“表扬”等同于题干中的具体词汇“clever”。"}]}]}},{"number":"3","item_type":"choice","context_note":"根据材料(二)作答。","stem":"How many questions does Mr Tung ask?","options":{"A":"3.","B":"4.","C":"5.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"这是一道细节统计题，考查学生在文中查找并计数的能力。\n题目问：“董老师（Mr Tung）问了多少个问题？”\n我们需要通读全文，将董老师提出的问题一一找出并计数。\n1. 第一个问题在第四段：“What is 15 plus 25?”\n2. 第二个问题在第六段：“Next one. What is 50 minus 18?”\n3. 第三个问题在第七段：“How about 8 times 6?”\n4. 第四个问题在第八段：“One last question,” Mr Tung says. “What is 100 divided by 4?”\n总计，董老师一共问了4个问题。因此，正确答案是B。","knowledge_expansion_md":"**1. 如何解答数字信息题**\n这类题目要求考生从文章中提取具体的数字、数量、时间、价格等信息。解题步骤如下：\n- **审题**：明确题目问的是“什么”的“数量”（How many/much...）。\n- **定位**：根据题干关键词（如本题的 `Mr Tung`, `ask`）在原文中找到相关段落。\n- **查数**：仔细阅读相关句子，逐一找出并标记所有符合条件的项目。\n- **核对**：重新数一遍，确保没有遗漏或重复计算。\n\n**2. 注意区分提问者**\n在有多人物对话的文章中，务必看清题目问的是“谁”的行为。本题问的是 `Mr Tung`，就要只统计董老师提出的问题，而不能把其他角色（如Tim）的提问也算进去。\n\n**3. 识别“问题”的标志**\n- **标点符号**：问号（?）是疑问句最明显的标志。\n- **疑问词**：以 `What`, `How`, `Who`, `When`, `Where`, `Why` 等词开头的句子通常是疑问句。\n- **句式结构**：一些特殊的句式，如 `How about...?`（...怎么样？）也用于提问或提建议。","socratic_tracks":[{"title":"逐一排查法","steps":[{"question":"题目要求我们数出董老师问问题的数量。让我们从文章开头找起，董老师第一次提问是在哪里？","hint":"在董老师说完“Let's do some quick math!”之后。","takeaway":"第一个问题是“What is 15 plus 25?”。"},{"question":"好的，这是第1个。请继续往下读，找出董老师问的第2、第3和第4个问题。","hint":"注意寻找“Next one”、“How about”和“One last question”这些提示词。","takeaway":"通过逐段查找，可以依次找到所有问题，分别是关于加、减、乘、除的四个数学题。"},{"question":"现在我们找到了所有董老师提出的问题，总共有多少个？","hint":"数一下我们刚才标记出的问题数量。","takeaway":"仔细统计后发现，董老师总共问了4个问题。"}]},{"title":"确认提问主体","steps":[{"question":"文章中除了董老师，还有谁说话了？","hint":"文中还有两个学生，Tim和May。","takeaway":"理清文章中的人物关系是正确理解对话内容的基础。"},{"question":"Tim和May说话的内容是提问吗？还是在做别的事情？","hint":"May一直在回答问题。Tim在最后问了一个问题。","takeaway":"必须明确题目问的是“Mr Tung”，因此只能计算他提出的问题，不能混淆。"}]},{"title":"关注提问信号词","steps":[{"question":"在英语中，我们通常通过什么来判断一句话是不是问题？","hint":"可以从标点符号和句子开头的词来判断。","takeaway":"问号（?）和疑问词（What, How等）是识别疑问句的最直接线索。"},{"question":"在董老师问的第三个问题“How about 8 times 6?”中，虽然句末是问号，但它不是以常见的“What”或“Is”开头。这种句式也是提问吗？","hint":"是的，“How about...?”是一个常用于提建议或提出下一个问题的句型。","takeaway":"除了标准疑问句，也要熟悉如“How about...?”等非典型的提问句式。"}]}]}},{"number":"4","item_type":"choice","context_note":"根据材料(二)作答。","stem":"How many times does Tim ask a question?","options":{"A":"0.","B":"1.","C":"2.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"B","explanation_md":"这是一道细节查找题，考查对特定人物行为的准确理解。\n题目问：“Tim提问了多少次？”（How many times does Tim ask a question?）。\n我们需要在文章中找到所有由Tim发出的提问。\n通读全文，我们发现在文章的最后一段描述了Tim的反应：“Tim is amazed. He looks at May. 'Wow, you are so fast at maths! How can you be so clever?' he asks her.”\n在这句话中，“Wow, you are so fast at maths!”是一个感叹句，表达惊讶。\n而“How can you be so clever?”是一个由疑问词“How”引导的疑问句，并且其后的动词“asks”也明确指出这是一个提问行为。\nTim在文中只问了这一个问题，所以次数是1次。\n因此，正确答案是B。","knowledge_expansion_md":"**1. 人物行为定位**\n当题目询问特定人物的行为时（如提问、回答、去某地等），解题的关键是快速在文中定位到该人物。可以通过寻找人物的名字（`Tim`）或指代他/她的代词（`he`, `his`）来实现。找到相关句子后，再仔细分析其具体行为。\n\n**2. 区分句子类型：陈述、感叹与疑问**\n在分析人物对话时，要能准确区分不同类型的句子：\n- **陈述句 (Statement)**：陈述事实或观点，以句号结尾。如：`May is clever.`\n- **感叹句 (Exclamation)**：表达强烈情感，以感叹号结尾。如：`Wow, you are so fast!`\n- **疑问句 (Question)**：提出问题，以问号结尾。如：`How can you be so clever?`\n本题中Tim的话包含感叹句和疑问句，但只有疑问句才算作“提问”。\n\n**3. 提问频率的表达：`How many times`**\n`How many times` 是一个非常常见的特殊疑问词组，用于询问某事发生的“次数”或“频率”。回答这类问题时，需要对文中描述的行为进行计数。","socratic_tracks":[{"title":"锁定关键人物与行为","steps":[{"question":"题目问的是“Tim”提问的次数。我们应该在文章的哪部分寻找答案？","hint":"寻找提到“Tim”名字的地方，特别是他说话的部分。","takeaway":"根据题干中的人物“Tim”和行为“ask a question”，可以快速定位到文章的最后一段。"},{"question":"在最后一段，Tim说的话被引号引起来了。他说的那句话是什么？","hint":"“Wow, you are so fast at maths! How can you be so clever?”","takeaway":"找到人物的直接引语是分析其言语行为的第一步。"}]},{"title":"辨别句子功能","steps":[{"question":"Tim说的话“Wow, you are so fast at maths! How can you be so clever?”包含了几个小句子？","hint":"可以根据标点符号来划分，它由一个感叹句和一个疑问句组成。","takeaway":"一长串引语可能包含不同类型的句子，需要分别判断。"},{"question":"这两个小句子中，哪一个才是真正的“提问”？为什么？","hint":"以“How”开头并以问号结尾的句子是提问。而以“Wow”开头的句子是表达感叹。","takeaway":"只有具备疑问结构和询问意图的句子才算作“提问”。"}]},{"title":"分析上下文线索","steps":[{"question":"在Tim说完话后，文章用了一个什么动词来描述他的这个行为？","hint":"在引语的后面，紧跟着“... he asks her.”","takeaway":"动词“asks”（问）是判断Tim行为是“提问”的最直接证据。"},{"question":"既然我们确定了Tim问了一个问题，那么他提问的次数是几次？","hint":"文章中只描述了这一次提问。","takeaway":"根据文中的唯一一次描述，可以确定提问次数为1。"}]}]}},{"number":"5","item_type":"choice","context_note":"根据材料(二)作答。","stem":"How many seconds does it take May to answer Mr. Tung's questions?","options":{"A":"4.","B":"9.","C":"12.","D":""},"answer_area_hint":"( )","teaching":{"correct_answer":"C","explanation_md":"这是一道信息整合与计算题，要求学生从文中提取多个数据并进行运算。\n题目问：“May回答董老师的问题总共花了多少秒？”\n要解答此题，需要分两步：\n1.  **确定问题数量**：从前面的题目分析可知，董老师一共问了4个问题，May全部都回答了。\n2.  **确定每次回答的时间并求和**：\n    - 回答第一个问题：“It only took her three seconds.” (花了3秒)\n    - 回答第二个问题：“Again, in three seconds, May answers...” (又花了3秒)\n    - 回答第三个问题：“...in another three seconds.” (再花了3秒)\n    - 回答第四个问题：“Like before, May's answer comes in three seconds.” (像之前一样，花了3秒)\n3.  **计算总时间**：将每次回答的时间相加，即 3 + 3 + 3 + 3 = 12秒。或者用乘法计算：4个问题 × 3秒/问题 = 12秒。\n因此，正确答案是C。","knowledge_expansion_md":"**1. 信息整合与计算题解题策略**\n这类题目是阅读理解中的难点之一，因为它不仅仅是找到信息，还需要对信息进行加工处理。解题策略如下：\n- **分解任务**：明确为了得到最终答案，需要先找到哪些数据（例如：问题总数、单次耗时）。\n- **分头查找**：在文章中分别定位并提取这些分散的数据。\n- **逻辑运算**：根据题意，对找到的数据进行正确的运算（加、减、乘、除）。\n- **检查核对**：检查计算过程和结果是否合理，是否遗漏了信息。\n\n**2. 理解指代和省略的表达**\n高级一点的阅读材料不会每次都重复相同的信息。作者会使用指代词或省略表达来使行文更简洁。例如本题中的：\n- `another three seconds`：“another”意为“又一个，再一个”，表示在之前的基础上再增加。\n- `Like before`：“像之前一样”，这是一个非常关键的短语，它省略了具体的时间，但通过与上文的联系，告诉我们这次的时间和前几次是相同的（也是3秒）。\n\n**3. 时间花费的表达方式**\n- `It takes somebody some time to do something.` (某人做某事花了多长时间)，例如：`It took her three seconds to answer.`\n- `in + 一段时间`：表示“在（多长时间）内”，强调完成动作所用的时间。例如：`May answers in three seconds.`","socratic_tracks":[{"title":"分步解决计算题","steps":[{"question":"要算出May回答问题所用的总时间，我们首先需要知道哪两个基本信息？","hint":"我们需要知道她回答了“多少个”问题，以及回答“每个”问题花了多长时间。","takeaway":"将一个复杂的计算题分解成“数量”和“单量”两个小问题，是解题的有效策略。"},{"question":"根据文章，May一共回答了几个问题？每个问题花了多长时间？","hint":"董老师问了4个问题，May都回答了。文中反复提到她每次回答都用了“three seconds”。","takeaway":"通过整合文中的数字信息，我们得到了计算所需的所有数据：4个问题和3秒/问题。"},{"question":"现在，请计算总时间。","hint":"可以用加法 3+3+3+3，也可以用乘法 4×3。","takeaway":"4个问题，每个3秒，总共是12秒。"}]},{"title":"理解关键短语的含义","steps":[{"question":"文章在描述May回答第四个问题时，用了一个短语“Like before”。这个短语是什么意思？","hint":"“Like”在这里是“像...”的意思，“before”是“之前”。合起来就是“和之前一样”。","takeaway":"理解“Like before”的字面意思是破解其背后信息的关键。"},{"question":"既然是“和之前一样”，那么“一样”的是什么呢？这说明May回答第四个问题花了多长时间？","hint":"之前每次回答都花了3秒，所以这次也是一样。","takeaway":"通过联系上下文，我们能推断出“Like before”指代的是“花了3秒”这个信息，避免了信息遗漏。"}]},{"title":"分析错误选项","steps":[{"question":"选项B是9秒。你认为一个学生可能会如何错误地计算出9秒这个答案？","hint":"想一想，3个3相加是多少？这可能意味着他漏掉了什么？","takeaway":"如果只计算了前三个问题的时间（3+3+3=9），而忽略了由“Like before”提示的第四个问题，就会错选B。"},{"question":"分析这个错误选项的来源，对我们做题有什么启发？","hint":"它提醒我们要仔细阅读全文，不要看到几个数字就匆忙计算，特别是要注意“another”、“like before”这类暗示还有更多信息的词。","takeaway":"通过分析“陷阱”选项，可以帮助我们反思自己的阅读习惯，养成更细致、更全面的解题思维。"}]}]}}]},{"section_title":"VIII. 书面表达。(共10分)","section_instruction":"","items":[{"number":"1","item_type":"writing","context_note":"","stem":"以一种文具为题展开联想写一篇英语小作文。","options":{},"answer_area_hint":"要求：\n1. 要写出此文具的主要特点；\n2. 条理清楚，意思连贯，标点正确，书写规范；\n3. 不少于50个单词。","teaching":{"correct_answer":"I am a little pencil. I am long and thin with a sharp point. My job is to help my owner, Lily, with her homework. I love dancing on the paper, creating beautiful words and pictures. Sometimes, my point gets blunt, and Lily sharpens me. It hurts a little, but I know it's for a good cause. My biggest dream is to help Lily draw a masterpiece that will make everyone happy. I am proud to be a useful pencil.","explanation_md":"这是一道开放性的想象作文题，旨在考察学生的想象力、逻辑组织能力和语言表达能力。\n1.  **审题立意**：题目的关键词是“一种文具”和“展开联想”。你需要选择一种你熟悉的文具（如铅笔、橡皮、尺子），并运用想象力，赋予它生命和情感。\n2.  **构思框架**：最常用的手法是“拟人化”。你可以从第一人称“我”的视角来写，讲述这个文具的“生活”、工作、感受和梦想。\n3.  **内容组织**：文章可以分为三部分：开头介绍“我”是谁；中间描述“我”的日常经历或一件特别的事，展现“我”的喜怒哀乐；结尾表达“我”的愿望或价值感。\n4.  **语言运用**：使用简单、准确的词汇和句型。多用第一人称，以现在时为主。可以适当使用一些生动的动词（如 `dance`, `fly`）和形容词（如 `proud`, `happy`）来增强文章的感染力。","knowledge_expansion_md":"### 写作技巧拓展：拟人与五感\n\n1.  **拟人化 (Personification)**\n    拟人是本作文的核心技巧，即把事物当作人来写，赋予其人的思想、情感和行为。这能让文章立刻变得生动有趣。\n    *   **例**：与其说 \"The eraser removes the wrong words.\" (橡皮擦掉错字)，不如说 \"I am a brave eraser. I fight against mistakes to make the page clean.\" (我是一块勇敢的橡皮。我与错误作斗争，让纸面保持干净。)\n\n2.  **五感法 (The Five Senses)**\n    调动五种感官（看、听、闻、尝、触）进行描写，能让读者身临其境。\n    *   **视觉 (Sight)**: `I am a shiny blue pen.` (我是一支闪亮的蓝色钢笔。)\n    *   **听觉 (Sound)**: `When the sharpener turns, I hear a loud grinding sound.` (当卷笔刀转动时，我听到一阵刺耳的研磨声。)\n    *   **触觉 (Touch)**: `My body is smooth and cool.` (我的身体光滑而冰凉。)\n\n### 核心词汇与句型\n\n*   **文具词汇**: `pencil` (铅笔), `pen` (钢笔/圆珠笔), `eraser` (橡皮), `ruler` (尺子), `sharpener` (卷笔刀), `notebook` (笔记本), `pencil case` (文具盒), `schoolbag` (书包)。\n*   **常用句型**:\n    *   **自我介绍**: `I am a(n) ...` / `My name is ...` / `I live in ...`\n    *   **描述功能**: `My job is to ...` / `I can help my owner to ...` / `I am good at ...`\n    *   **表达情感**: `I feel happy/sad/proud when ...`\n    *   **陈述梦想**: `My dream is to ...` / `I hope I can ...`","socratic_tracks":[{"title":"构思与立意：如何让文具“活”起来？","steps":[{"question":"题目要求“展开联想”，如果只描述一支铅笔是黄色的、长长的，你觉得这篇文章能得高分吗？为什么？","hint":"想想看，这和写一篇“我的铅笔”的说明文有什么区别？题目强调了“联想”。","takeaway":"“展开联想”是写作的关键，需要我们赋予文具生命和个性，而不只是做外观说明。"},{"question":"好，我们决定让文具“活”起来。如果把橡皮想象成一个人，它的“工作”是什么？它会有什么样的“心情”？","hint":"当你写错字时，橡皮会做什么？如果错误太多，它会不会很累？如果它帮你改正了所有错误，让作业得了A+，它会是什么感觉？","takeaway":"将文具的功能转化为它的“工作”，并想象它在工作中的情感变化（如劳累、自豪），是拟人化构思的核心。"},{"question":"除了工作和心情，一个“活”的文具还可以有什么？比如，它有没有自己的“梦想”或“愿望”？","hint":"一支铅笔的最终目标可能是什么？是写出一部伟大的小说，还是画出一幅美丽的画？","takeaway":"为文具设定一个“梦想”，可以深化文章的主题，让结尾更有力量。"}]},{"title":"词汇与句式：怎样用简单的词写出彩？","steps":[{"question":"描述铅笔在纸上写字，用动词 'write' 当然可以。但为了体现“联想”，我们能不能用一个更生动的词来描绘这个动作？","hint":"想象一下铅笔在纸上快速移动的样子，像不像滑冰或跳舞？","takeaway":"使用比喻性的动词，如 'dance' 或 'skate' on the paper，能瞬间让句子充满画面感和想象力。"},{"question":"当铅笔被削的时候，它可能会有什么感觉？只说 'It is painful' (很疼) 有点单调，我们能加点细节吗？","hint":"虽然很疼，但铅笔知道这是为了什么吗？它对这件事的态度是怎样的？","takeaway":"通过增加心理活动描写，如“虽然有点疼，但我知道这是为了更好地工作”，可以塑造出更丰满、更积极的形象。"},{"question":"在文章结尾，我们想表达铅笔的价值感。除了说 'I am useful'，还有没有更高级、更能表达情感的句式？","hint":"当你为自己做的事情感到非常光荣和自豪时，你会怎么说？","takeaway":"使用 'I am proud to be...' (我为……而自豪) 或 'My dream is to...' (我的梦想是……) 这样的句式，能有效升华主题，让结尾更具感染力。"}]},{"title":"篇章与结构：如何组织一篇完整的小短文？","steps":[{"question":"一篇好的作文需要有清晰的结构。对于这篇想象作文，你认为开头第一句话应该写什么最合适？","hint":"在开始讲故事之前，是不是要先让读者知道故事的主角是谁？","takeaway":"文章开头应开门见山，直接点明你要写的文具是什么，例如 'I am a pencil.'。"},{"question":"开头介绍完自己后，文章的主体部分应该写些什么内容，才能体现出你的“联想”呢？","hint":"可以讲讲它的日常生活、一次特别的经历，或者它的喜怒哀乐。","takeaway":"文章主体需要有具体的情节或细节，来生动地展现文具的“生活”和“个性”。"},{"question":"故事讲完了，文章该如何结尾呢？一个好的结尾应该起到什么作用？","hint":"结尾是给读者留下最后印象的地方。可以是对自己价值的总结，也可以是对未来的展望。","takeaway":"结尾可以通过总结全文或表达梦想、愿望来点明主旨，使文章结构完整，意味深长。"}]}]}}]}],"content_markdown":"# 成都某七中实验学校（冠城实验）初2026级新初一入学直卷英语（一）\n\n**(满分：100分 时间：60分钟)**\n\n## I. 选出与其他三项不同类的一项。(共5分)\n\n1. ( ) _____\n   A. teachers' office\n   B. sunny\n   C. music room\n   D. art room\n\n2. ( ) _____\n   A. cold\n   B. warm\n   C. lunch\n   D. hot\n\n3. ( ) _____\n   A. under\n   B. near\n   C. behind\n   D. ago\n\n4. ( ) _____\n   A. pear\n   B. dog\n   C. apple\n   D. strawberry\n\n5. ( ) _____\n   A. chair\n   B. grandmother\n   C. brother\n   D. sister\n\n## II. 词组互译。(共15分)\n\n1. 合上书 __________\n2. Happy New Year! __________\n3. 新年 __________\n4. 在右边 __________\n5. 去公园 __________\n6. a cup of tea __________\n7. write a letter __________\n8. flower shop __________\n9. fly kites (fly a kite) __________\n10. ride a bicycle __________\n\n## III. 选择填空。(共20分)\n\n1. ( ) — _____ is his football? \n   —It's under the bed.\n   A. Where\n   B. Who\n   C. What\n\n2. ( ) —Thank you very much! \n   —_____\n   A. You're right\n   B. All right\n   C. You are welcome\n\n3. ( ) Which season do you like _____?\n   A. better\n   B. good\n   C. best\n\n4. ( ) The red car is _____ than the black one.\n   A. nice\n   B. nicer\n   C. very nice\n\n5. ( ) It's very hot _____ summer in Beijing.\n   A. on\n   B. at\n   C. in\n\n6. ( ) —Can you sing the song in English? \n   —No, I _____.\n   A. can't\n   B. mustn't\n   C. needn't\n\n7. ( ) —What did you do last weekend? \n   —I did my homework and _____ TV.\n   A. watch\n   B. watched\n   C. am watching\n\n8. ( ) I like drawing pictures and she _____.\n   A. like to sing\n   B. likes singing\n   C. like singing\n\n9. ( ) Wu Ming is a girl. She _____ long hair.\n   A. has\n   B. was\n   C. have\n\n10. ( ) He is going _____ artist in the future.\n    A. to be a\n    B. to be an\n    C. an\n\n## IV. 把下列英文句子与所对应的中文意思代号填到括号里。(共10分)\n\n1. ( ) 有多少件礼物？\n   A. How many balloons?\n   B. How many gifts?\n   C. How many bears?\n\n2. ( ) Zip, 这是你的礼物。\n   A. This is for you, Zip.\n   B. This is Zip.\n   C. Here it is.\n\n3. ( ) 生日快乐！\n   A. Happy New Year!\n   B. Thank you!\n   C. Happy birthday!\n\n4. ( ) 一个蛋糕。\n   A. One cake.\n   B. One cakes.\n   C. No cake.\n\n5. ( ) 我能看到彩虹。\n   A. I can see a rainbow.\n   B. This is a rainbow.\n   C. I can see a rainbow.\n\n## V. 在II栏中选出I栏中句子的应答语。(共10分)\n\nA. I am going to Harbin.\nB. She feels better now.\nC. Last year.\nD. He watched TV.\nE. Yes, he is.\nF. It was a busy one.\nG. No, she isn't.\nH. It's Monday.\nI. By plane.\nJ. Yes, I can.\n\n1. ( ) What did your father do yesterday?\n2. ( ) How was your weekend?\n3. ( ) Where are you going on your holiday?\n4. ( ) Is Amy stronger than me?\n5. ( ) How does your mother feel now?\n6. ( ) When did you go to Shanghai?\n7. ( ) What day is it today?\n8. ( ) Is John dancing?\n9. ( ) How did you go to Beijing?\n10. ( ) Can you water the flowers?\n\n## VI. 完形填空。(共10分)\n\nWhat do you do at the weekend? Some people like to __1__ at home, but others like to go __2__ a walk or play football. My friend Jack works hard in a factory during the __3__. At the weekend, he always __4__ the same things. On Saturday he __5__ his car and on __6__ he goes with his family to a village by car. His uncle and aunt have a farm there. It isn't a __7__ one, but there's always __8__ to do on the farm. The children help with the animals and give them their __9__. Jack and his wife help in the fields. At the end of the day, they are all __10__ and Jack's aunt gives them a big meal.\n\n1. ( ) _____\n   A. play\n   B. stay\n   C. live\n   D. enjoy\n\n2. ( ) _____\n   A. to\n   B. in\n   C. at\n   D. for\n\n3. ( ) _____\n   A. day\n   B. time\n   C. autumn\n   D. weekdays\n\n4. ( ) _____\n   A. makes\n   B. borrows\n   C. does\n   D. has\n\n5. ( ) _____\n   A. watches\n   B. washes\n   C. drives\n   D. sells\n\n6. ( ) _____\n   A. Monday\n   B. Saturday\n   C. Sunday\n   D. Tuesday\n\n7. ( ) _____\n   A. big\n   B. small\n   C. hard\n   D. short\n\n8. ( ) _____\n   A. little\n   B. much\n   C. fast\n   D. far\n\n9. ( ) _____\n   A. clothes\n   B. places\n   C. food\n   D. balls\n\n10. ( ) _____\n    A. late\n    B. busy\n    C. friendly\n    D. tired\n\n## VII. 阅读理解。(共20分)\n\n本大题包含两篇阅读材料。\n\n**(一)**\n根据短文判断，对的写“T”，错的写“F”。\nSarah has four sisters. They are Betty, Mary, Rose and Ann. Sarah is the oldest of the five. Betty is thirteen years old. She is two years younger than Sarah and one year older than Mary. Rose is nine and Ann is seven. Sarah and Betty study in a middle school. Mary, Rose, and Ann study in a primary school. The primary school is near their home. They walk there.\n\n1. ( ) Ann is older than Rose.\n2. ( ) Sarah and Betty are middle school students.\n3. ( ) Mary, Rose, and Ann often go to school by bus.\n4. ( ) Their home is near the primary school.\n5. ( ) There are five people in their family.\n\n**(二)**\n根据短文内容，选择正确答案填入题前括号中。\nMr Tung is teaching maths to Class 1C. He wants to give them difficult maths questions. He says, “Now class, I don’t want you to use calculators. What’s eight minus six times four plus ten divided by three?”\nMay answers after three seconds, “It’s six.”\n“Good, May,” says Mr Tung, “but that question was very easy. I have a new sum. What’s 10 divided by two times twelve minus seven plus three divided by two?”\nMay answers after four seconds, “It’s twenty-eight.”\n“Very good, May,” says Mr Tung. “May is very clever,” says a student, Tim.\n“Yes, she is, Tim. Here’s a long sum. What’s six times six minus six plus thirty-six divided by six minus ten point six times?”\nThe students look at May. After five seconds she says, “It’s two point four, Mr Tung.”\n“Very good, May,” says Mr Tung. “May is number one in the class,” says Tim.\n“No,” says May, “Mr Tung is number one.”\n“I want to ask Mr Tung and May a question,” says Tim. “What’s eleven times seven plus five minus twelve divided by three point five?”\n“Twenty,” says Mr Tung after a second.\n“You see, Tim,” says May, “Mr Tung is number one.”\n\n1. ( ) Mr Tung thinks maths questions with calculators are _____.\n   A. difficult\n   B. not difficult\n   C. slow\n\n2. ( ) Tim thinks May is clever because _____.\n   A. she is fast at maths\n   B. she has a calculator\n   C. Mr Tung says May is clever\n\n3. ( ) How many questions does Mr Tung ask?\n   A. 3.\n   B. 4.\n   C. 5.\n\n4. ( ) How many times does Tim ask a question?\n   A. 0.\n   B. 1.\n   C. 2.\n\n5. ( ) How many seconds does it take May to answer Mr. Tung's questions?\n   A. 4.\n   B. 9.\n   C. 12.\n\n## VIII. 书面表达。(共10分)\n\n1. 以一种文具为题展开联想写一篇英语小作文。\n\n   **要求：**\n   1. 要写出此文具的主要特点；\n   2. 条理清楚，意思连贯，标点正确，书写规范；\n   3. 不少于50个单词。\n\n","proofread_notes":"1. 第IV大题的标题说明与实际题型（中译英选择）不符，已按实际题型转录。\n2. 第IV大题第5小题的A、C选项内容完全相同，已按卷面如实保留。\n3. 第VII大题阅读理解包含(一)、(二)两篇短文，每篇短文后的小题均从1开始编号，已按卷面结构转录。\n4. 全卷三选项的选择题，均在JSON中补充了空的D选项，以符合四选项的schema规范。","set_number":15,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_15\\page_026.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_15\\page_027.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":61},{"step":2,"name":"verify","items":61,"check_passed":false,"issues_count":1},{"step":3,"name":"polish","items":61}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T11:32:23.613109+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
