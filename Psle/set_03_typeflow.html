<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    a.btn.secondary.answers-link {
      display: inline-block; font: inherit; cursor: pointer;
      border-radius: 10px; padding: 0.45rem 1rem; font-weight: 600;
      background: #fff; border: 1px solid var(--border); color: var(--ink);
      text-decoration: none;
    }
    a.btn.secondary.answers-link:hover { border-color: var(--accent); color: var(--accent); }

    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {

    .exam-item {

    .exam-item-row {

    /* 词汇变形填空等：加长题干横线，便于手写 */

    /* 阅读/单选等：默认 2×2；按选项数单列等分对齐 */
    .exam-opts-row {

    .exam-opts-row.exam-opts-bank {

    /* 阅读理解 PDF：选项纵向排列，字母与正文对齐，避免三列过窄、英文被拆字换行 */
    .exam-item-reading .exam-opts-row {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第03套","exam_meta":{"full_score_text":"满分:100分","time_text":"时间:60分钟","type_card_order":"paper"},"sections":[{"section_title":"一、用 is, am 或 are 填空。(共9分)","section_instruction":"","items":[{"number":"1","item_type":"fill_blank_be","context_note":"","stem":"Excuse me. What _____ this in English?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"is","explanation_md":"本题考查 be 动词在特殊疑问句中的用法。\n1.  句子的主语是指示代词 “this”，意为“这个”，是单数形式。\n2.  be 动词需要和主语的数保持一致，即“主谓一致”原则。\n3.  对于第三人称单数主语（如 he, she, it, this, that），be 动词的现在时形式是 “is”。\n4.  因此，本句 “What _____ this in English?” 的横线处应填 “is”。","knowledge_expansion_md":"### be 动词 (am, is, are) 的基本用法\n\nbe 动词是英语中最基本也最重要的动词之一，中文意思有“是、在”等。其现在时有三种形式：am, is, are。\n\n**用法口诀：**\n> 我 (I) 用 am，你 (you) 用 are，\n> 单数用 is (he, she, it, this, a book)，\n> 复数都用 are (we, they, these, books)。\n\n**常见句型：**\n1.  **陈述句**：主语 + be 动词 + ...\n    *   `I am a student.`\n    *   `This is an apple.`\n    *   `They are doctors.`\n2.  **一般疑问句**：Be 动词 + 主语 + ...?\n    *   `Are you a student?`\n    *   `Is this an apple?`\n3.  **特殊疑问句**：疑问词 + be 动词 + 主语 + ...?\n    *   `What is this?`\n    *   `Where are my keys?`\n\n**易错点**：初学者容易混淆 is 和 are，关键在于准确判断主语是单数还是复数。","socratic_tracks":[{"title":"主谓一致原则","steps":[{"question":"在这个问句中，我们是在问关于什么东西？哪个词是句子的主语？","hint":"“What”是疑问词，它询问的对象才是主语。句子里用哪个词来指代“这个东西”？","takeaway":"这个句子的主语是指示代词 “this”。"},{"question":"“this” 指的是一个东西还是多个东西？","hint":"想一想 “this” 和 “these” 的区别。","takeaway":"“this” 是单数形式，指代一个东西。"},{"question":"根据主语是单数，我们应该选择 am, is, 还是 are 呢？","hint":"回想一下 be 动词的用法口诀：我用 am，你用 are，单数 is，复数 are。","takeaway":"单数主语 “this” 应该搭配 be 动词 “is”。"}]},{"title":"特殊疑问句结构","steps":[{"question":"这是一个什么类型的句子？是陈述一件事，还是提出一个问题？","hint":"看看句子的开头和结尾。它以 “What” 开头，以问号 “?” 结尾。","takeaway":"这是一个由疑问词 “What” 引导的特殊疑问句。"},{"question":"在 “What” 引导的特殊疑问句中，be 动词通常放在主语的前面还是后面？","hint":"比较一下陈述句 “This is a pen.” 和疑问句 “What is this?” 的语序。","takeaway":"在特殊疑问句中，be 动词通常紧跟在疑问词后面，位于主语 “this” 之前。"}]},{"title":"be 动词辨析","steps":[{"question":"be 动词的三个现在时形式 am, is, are 分别和哪些主语搭配？","hint":"试着用 I, you, he, they 分别和这三个词造个简单的句子。","takeaway":"I 搭配 am；you, we, they 以及所有复数名词搭配 are；he, she, it 以及所有单数名词搭配 is。"},{"question":"既然句子的主语是 “this”，它属于哪一类？","hint":"“this” 是指“这个”，是一个单数概念，可以被 “it” 替换。","takeaway":"“this” 属于第三人称单数范畴。"},{"question":"所以，根据搭配规则，我们最终应该选择哪个 be 动词？","hint":"第三人称单数应该用哪个 be 动词？","takeaway":"主语 “this” 是第三人称单数，因此必须使用 “is”。"}]}]}},{"number":"2","item_type":"fill_blank_be","context_note":"","stem":"_____ this your coat, Mr Green? —Yes, it _____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Is|is","explanation_md":"本题考查 be 动词在一般疑问句及其简略回答中的用法。\n1.  **第一个空**：这是一个一般疑问句，询问“这是你的外套吗？”。主语是 “this your coat”，核心词是 “coat”，是单数。一般疑问句需要将 be 动词提到句首，因此应使用 “Is”。因为是句首，首字母需大写。\n2.  **第二个空**：这是对上述问题的肯定简略回答。回答的主语 “it” 指代上文的 “your coat”，是单数。肯定简略回答的结构为 “Yes, 主语 + be 动词.”，因此 be 动词应用 “is”。","knowledge_expansion_md":"### 一般疑问句及其简略回答\n\n当一个陈述句中含有 be 动词时，可以很方便地将其变为一般疑问句（Yes/No Question）。\n\n**构成方法**：\n*   将陈述句中的 be 动词（am, is, are）提到句首。\n*   句末的句号（.）改为问号（?）。\n*   例：`This is your coat.` → `Is this your coat?`\n\n**简略回答**：\n对这类问题，通常使用简略形式回答，结构固定。\n*   **肯定回答**：`Yes, 主语人称代词 + be 动词.`\n    *   `Is this your coat?` → `Yes, it is.` (注意：主语用 `it` 代替 `this coat`)\n    *   `Are they students?` → `Yes, they are.`\n*   **否定回答**：`No, 主语人称代词 + be 动词 + not.` (be 动词和 not 常缩写)\n    *   `Is he a doctor?` → `No, he is not.` / `No, he isn't.`\n    *   `Are you ready?` → `No, I am not.` (注意：`am not` 没有官方缩写形式 `amn't`)\n\n**易错点**：简略回答中的主语必须使用人称代词（I, you, he, she, it, we, they），不能直接用名词或指示代词（如 this, that）。","socratic_tracks":[{"title":"一般疑问句构成","steps":[{"question":"观察第一个句子，句尾是问号，且没有疑问词（如 What, Where），这通常是什么类型的疑问句？","hint":"这种需要用 Yes 或 No 来回答的问句叫什么？","takeaway":"这是一个一般疑问句。"},{"question":"这个一般疑问句的主语是什么？是单数还是复数？","hint":"句子在问“这件外套”是不是你的，主语是 “this your coat”。","takeaway":"主语是 “this your coat”，是单数概念。"},{"question":"对于单数主语，be 动词构成的一般疑问句应该用哪个词开头？并且需要注意什么书写格式？","hint":"把陈述句 “This is your coat.” 变成疑问句，并注意句首单词的大小写。","takeaway":"be 动词一般疑问句需将 be 动词提到句首，因此用 “Is”，且首字母大写。"}]},{"title":"简略回答规则","steps":[{"question":"看到 “Yes”，我们知道这是一个肯定回答。回答中的主语 “it” 指代的是什么？","hint":"问题问的是什么东西？回答里的 “it” 就是指那个东西。","takeaway":"主语 “it” 指代的是前面提到的 “your coat”。"},{"question":"“it” 是第几人称？是单数还是复数？","hint":"“it” 翻译成“它”，通常指代单个事物或动物。","takeaway":"“it” 是第三人称单数代词。"},{"question":"在肯定简略回答中，第三人称单数主语 “it” 后面应该跟哪个 be 动词？","hint":"回忆简略回答的固定结构：Yes, 主语 + be 动词。","takeaway":"肯定简略回答中，主语 “it” 后面要用 “is”。"}]},{"title":"上下文逻辑","steps":[{"question":"这道题是一个独立的句子还是一个对话？","hint":"观察破折号 “—” 的作用，它连接了问句和答句。","takeaway":"这是一个一问一答的简短对话。"},{"question":"问句和答句在时态和动词形式上通常需要保持一致。问句用 “Is” 提问，那么回答时，如果没有特殊情况，应该使用哪个 be 动词来对应？","hint":"用 “Is...?” 问，通常用 “...is.” 来回答。","takeaway":"问答之间 be 动词形式的对应关系，帮助我们确认第二个空应该填 “is”。"}]}]}},{"number":"3","item_type":"fill_blank_be","context_note":"","stem":"What _____ these? _____ they maps?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"are|Are","explanation_md":"本题考查 be 动词在不同疑问句中的使用，以及大小写规范。\n1.  **第一个空**：这是一个以 “What” 开头的特殊疑问句。主语是 “these”（这些），是复数指示代词。根据主谓一致原则，be 动词应用复数形式 “are”。\n2.  **第二个空**：这是一个一般疑问句。主语是 “they”（它们），是复数人称代词。be 动词同样应用复数形式 “are”。由于这个词位于句首，其首字母必须大写，因此应填 “Are”。","knowledge_expansion_md":"### 复数形式的 be 动词用法\n\n`are` 是 be 动词的复数形式，用于第二人称 `you` 和所有复数主语。\n\n**常见复数主语：**\n*   **复数人称代词**：`we` (我们), `they` (他们/她们/它们)\n*   **复数指示代词**：`these` (这些), `those` (那些)\n*   **复数名词**：`books` (书本), `apples` (苹果), `people` (人们)\n*   **由 and 连接的多个单数主语**：`Tom and Jerry` (汤姆和杰瑞)\n\n**句型示例：**\n*   `These are my books.` (陈述句)\n*   `Are they your parents?` (一般疑问句)\n*   `What are those?` (特殊疑问句)\n\n**易错点：句首大写**\n在英语书写中，每个句子的第一个单词的首字母都必须大写。这在填空题中尤其需要注意，如果空格位于句首，即使是 `is` 或 `are` 这样的小词，也要大写成 `Is` 或 `Are`。","socratic_tracks":[{"title":"主谓一致 (复数)","steps":[{"question":"在第一个句子 “What _____ these?” 中，主语是哪个词？","hint":"句子在问“这些”是什么。","takeaway":"主语是 “these”。"},{"question":"“these” 是单数还是复数？","hint":"它和 “this” 有什么区别？“these” 指的是多个事物。","takeaway":"“these” 是复数形式。"},{"question":"对于复数主语，我们应该用 “is” 还是 “are”？","hint":"复数用 are。","takeaway":"复数主语 “these” 应该搭配 be 动词 “are”。"}]},{"title":"疑问句辨析与转换","steps":[{"question":"看第二个句子 “_____ they maps?”，它的主语是什么？是单数还是复数？","hint":"主语是 “they”，意为“它们”。","takeaway":"主语是 “they”，是复数代词。"},{"question":"这是一个一般疑问句还是特殊疑问句？","hint":"它不是以 Wh- 疑问词（如 What, Where）开头的。","takeaway":"这是一个一般疑问句，询问“它们是地图吗？”。"},{"question":"那么，对于主语是 “they” 的一般疑问句，应该用哪个 be 动词放在句首？","hint":"把陈述句 “They are maps.” 变成疑问句。","takeaway":"应该将复数 be 动词 “are” 提到句首。"}]},{"title":"书写规范：大小写","steps":[{"question":"观察第二个空的位置，它在一个句子的什么地方？","hint":"它前面是一个问号，这标志着前一个句子的结束。","takeaway":"第二个空位于一个新句子的开头。"},{"question":"英语句子开头的第一个单词有什么书写规则？","hint":"想一想你写作文时，每句话的第一个字母是怎么写的。","takeaway":"英语中，每个句子的首字母都必须大写。"},{"question":"结合我们刚才的分析，知道要填 “are”，那么根据书写规则，最终应该填什么？","hint":"把 “are” 的首字母 a 大写。","takeaway":"因为位于句首，所以必须填写首字母大写的 “Are”。"}]}]}},{"number":"4","item_type":"fill_blank_be","context_note":"","stem":"This _____ your bike. Where _____ my bike?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"is|is","explanation_md":"本题考查 be 动词在陈述句和特殊疑问句中的一致用法。\n1.  **第一个空**：这是一个陈述句 “This _____ your bike.”。主语是 “This”（这个），是单数指示代词。根据主谓一致原则，be 动词应用单数形式 “is”。\n2.  **第二个空**：这是一个由 “Where” 引导的特殊疑问句 “Where _____ my bike?”。句子的主语是 “my bike”（我的自行车），是一个单数名词。因此，be 动词也应该用单数形式 “is”。","knowledge_expansion_md":"### 如何准确找到句子的主语？\n\n正确使用 be 动词的关键是准确判断主语的单复数。对于初学者来说，在疑问句中找主语可能比在陈述句中更困难。\n\n*   **陈述句**：主语通常在句首，位于动词之前。例：`This` is my book. (`This` 是主语)\n*   **一般疑问句**：主语位于 be 动词之后。例：Is `this` your book? (`this` 是主语)\n*   **特殊疑问句**：主语通常也位于 be 动词之后。例：Where is `my book`? (`my book` 是主语)\n\n**注意**：疑问词（如 What, Where, Who）本身不是主语（除非 Who/What 在句中就作主语用，如 `Who is he?` 中 `he` 是主语，但 `Who is coming?` 中 `Who` 是主语）。在 `Where is my bike?` 这类句子中，`Where` 是状语，询问地点，真正的主语是 `my bike`。","socratic_tracks":[{"title":"判断句子类型与主语","steps":[{"question":"这道题包含几个句子？它们分别是什么类型的句子？","hint":"观察标点符号。第一个句子以句号结尾，第二个以问号结尾。","takeaway":"这道题包含两个句子：一个陈述句和一个特殊疑问句。"},{"question":"在第一个陈述句 “This _____ your bike.” 中，主语是什么？是单数还是复数？","hint":"主语通常是句子的发出者或描述的对象，这里是 “This”。","takeaway":"主语 “This” 是单数，所以第一个空填 “is”。"},{"question":"在第二个特殊疑问句 “Where _____ my bike?” 中，主语是什么？是单数还是复数？","hint":"句子问的是“我的自行车”在哪里，所以主语是 “my bike”，而不是 “Where”。","takeaway":"主语 “my bike” 是单数，所以第二个空也填 “is”。"}]},{"title":"主谓一致原则的应用","steps":[{"question":"决定用 am, is, 还是 are 的核心规则是什么？","hint":"动词的形式由谁来决定？","takeaway":"核心规则是“主谓一致”，即动词形式必须和主语的人称和单复数保持一致。"},{"question":"第一个句子的主语 “This” 应该搭配哪个 be 动词？","hint":"“This” 是第三人称单数。","takeaway":"主语 “This” 搭配 “is”。"},{"question":"第二个句子的主语 “my bike” 应该搭配哪个 be 动词？","hint":"“my bike” 可以用代词 “it” 来替换，也是第三人称单数。","takeaway":"主语 “my bike” 同样搭配 “is”。"}]},{"title":"不同句型中的语序","steps":[{"question":"在第一个陈述句中，be 动词 “is” 放在主语 “This” 的前面还是后面？","hint":"陈述句的基本结构是“主语+动词...”。","takeaway":"在陈述句中，be 动词放在主语后面。"},{"question":"在第二个特殊疑问句中，be 动词 “is” 放在主语 “my bike” 的前面还是后面？","hint":"回忆特殊疑问句的语序：疑问词+be动词+主语...?","takeaway":"在特殊疑问句中，be 动词要放在主语前面。"},{"question":"为什么两个空都填 “is”，但它们在句子中的位置却不同？","hint":"回顾一下陈述句和疑问句的结构区别。","takeaway":"句子的类型决定了主语和动词的相对位置，但动词本身的形式始终由主语的单复数决定。"}]}]}},{"number":"5","item_type":"fill_blank_be","context_note":"","stem":"I _____ in Class Eleven. What class _____ you in?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"am|are","explanation_md":"本题考查 be 动词在一般现在时中的基本用法。第一空的主语是第一人称单数 “I”，应搭配 “am”。第二空是在特殊疑问句中，主语是第二人称 “you”，应搭配 “are”。be 动词需要根据主语的人称和数进行相应的变化。因此，完整的句子是 “I am in Class Eleven. What class are you in?”。","knowledge_expansion_md":"### Be 动词现在时用法总结\n\nbe 动词是英语中最基础也最重要的动词之一，其现在时形式根据主语的人称和数变化，口诀是：“我(I)用 am，你(you)用 are，is 连着他(he)、她(she)、它(it)，单数名词用 is，复数名词全用 are。”\n\n**1. 基本形式与搭配：**\n*   **am**: 只与第一人称单数 `I` 搭配。 (e.g., `I am a student`.)\n*   **is**: 与第三人称单数 `he`, `she`, `it` 以及所有单数名词或不可数名词搭配。 (e.g., `He is a doctor`. `The book is new`. `Water is important`.)\n*   **are**: 与第二人称 `you`，第一人称复数 `we`，第三人称复数 `they` 以及所有复数名词搭配。 (e.g., `You are right`. `We are friends`. `The apples are red`.)\n\n**2. 常见句型：**\n*   肯定句: 主语 + be + ...\n*   否定句: 主语 + be + not + ... (缩写: isn't, aren't, I'm not)\n*   一般疑问句: Be + 主语 + ...?\n*   特殊疑问句: 疑问词 + be + 主语 + ...?","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"看到主语 “I”，你的第一反应是搭配哪个 be 动词呢？","hint":"在做自我介绍时，我们说“我是...”，英文是怎么表达的？","takeaway":"主语 “I” 在现在时中永远和 “am” 搭配。"},{"question":"再看第二个句子，它的主语是 “you”，又应该搭配哪个 be 动词？","hint":"问候别人“你好吗？”时，我们说 “How ___ you?”","takeaway":"主语 “you” 在现在时中总是和 “are” 搭配，无论指一个人还是多个人。"}]},{"title":"Be动词的功能","steps":[{"question":"“我在十一班”这句话是在描述一个动作，还是在说明一种身份或状态？","hint":"这句话没有表达“做”什么，而是在表达“是”什么状态。","takeaway":"Be 动词用于连接主语和表语，说明主语的身份、性质、状态或位置。"},{"question":"我们学过的 be 动词的现在时形式有哪几种？它们分别是什么？","hint":"总共有三种形式，分别对应不同的主语。","takeaway":"Be 动词的现在时有 am, is, are 三种形式，需要根据主语来选择。"}]},{"title":"疑问句的语序","steps":[{"question":"第二个句子 “What class _____ you in?” 是一个陈述句还是疑问句？","hint":"看看句子的开头和结尾，它以疑问词 “What” 开头，以问号 “?” 结尾。","takeaway":"这是一个由特殊疑问词引导的特殊疑问句。"},{"question":"在含有 be 动词的特殊疑问句中，主语 “you” 和 be 动词的位置是怎样的？","hint":"对比一下陈述句 “You are in Class Eleven.” 和疑问句 “What class are you in?”。","takeaway":"在特殊疑问句中，be 动词通常要提到主语的前面。"}]}]}}]},{"section_title":"二、单项填空。(共30分)","section_instruction":"","items":[{"number":"6","item_type":"choice","context_note":"","stem":"—What's your name, please? —_____","options":{"A":"It's Tom","B":"My name is Tom","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查询问姓名的情景交际。问句 “What's your name, please?” 是一个标准的询问姓名的方式。选项 B “My name is Tom” (我的名字是汤姆) 是对这个问题最直接、最标准、最礼貌的回答。选项 A “It's Tom” 虽然在语法上没有错误，但在回答“你叫什么名字”时显得不够正式和直接，它更多用于电话中确认身份或指代第三方等特定情景。因此，在初次见面或较为正式的场合，B 选项是最佳选择。","knowledge_expansion_md":"### 询问与回答姓名的方式\n\n**1. 提问方式：**\n*   **常用:** `What's your name?`\n*   **更礼貌:** `May I have your name, please?` 或 `Could you tell me your name, please?`\n\n**2. 回答方式：**\n*   **最标准:** `My name is [Tom].` (最正式、最完整的回答)\n*   **常用:** `I'm [Tom].` (比 `My name is...` 稍微口语化一些，也非常普遍)\n*   **非正式/特定情景:** `It's [Tom].` 这种说法不常用作自我介绍。常见于以下情景：\n    *   **电话中:** (A: Who is speaking? B: It's Tom.)\n    *   **有人敲门:** (A: Who is it? B: It's me, Tom!)\n    *   **指认照片中的人:** (A: Who is this in the picture? B: It's Tom.)\n\n**易错点：** 很多学生会混淆 `My name is...` 和 `It's...` 的使用场景。在小升初阶段的考试中，回答 `What's your name?` 时，选择 `My name is...` 或 `I'm...` 是最稳妥、最符合规范的。","socratic_tracks":[{"title":"问答匹配","steps":[{"question":"问句 “What's your name?” 是在问什么信息？","hint":"注意关键词 “your name”。","takeaway":"这个问题在询问对方的名字。"},{"question":"对比选项 A 和 B，哪个回答中的主语和问句中的 “your name” 对应得更直接？","hint":"问句中的 “your name” (你的名字) 对应回答中的 “My name” (我的名字)。","takeaway":"“My name is Tom” 直接回应了提问，是教科书式的标准答案。"}]},{"title":"代词 'It' 的用法","steps":[{"question":"在选项 A “It's Tom” 中，代词 “It” 在这里可以被理解成指代什么？","hint":"它可以被理解为 “My name”。","takeaway":"在这个回答中，“It” 用来指代 “my name”。"},{"question":"虽然语法上说得通，但在日常自我介绍中，用 “It's...” 和用 “My name is...” 哪个更常见、更得体？","hint":"回想一下，你在学校里是如何学习做自我介绍的？","takeaway":"“My name is...” 是更标准、更正式的自我介绍方式。"}]},{"title":"情景交际","steps":[{"question":"想象一下，你第一次见到一位新朋友，他问你 “What's your name?”，你怎么回答会显得更礼貌、更清晰？","hint":"使用完整的句子通常比省略的句子更正式、更清楚。","takeaway":"在初次见面等较为正式的场合，使用完整的句子 “My name is...” 更为得体。"},{"question":"那么 “It's Tom” 这种回答在什么情况下比较常用呢？","hint":"比如有人敲门，你问 “Who is it?”，门外的人会怎么回答？或者打电话时，对方问是谁。","takeaway":"“It's...” 常用于电话中或确认身份等非面对面的特定情景。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"—Hello, Lin Tao. How are you? —_____","options":{"A":"Hello. Li Ming. How are you?","B":"Good morning, Li Ming.","C":"Thank you.","D":"Fine, thank you."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查问候语 “How are you?” 的标准应答。当别人用 “How are you?” (你好吗？) 向你问好时，这是一种关心你近况的表达。最礼貌和恰当的回答是先说明自己的状况，然后向对方表示感谢。选项 D “Fine, thank you.” (我很好，谢谢你。) 完美地符合了这个交际模式。“Fine” 回答了问题，“thank you” 表达了礼貌。其他选项均不符合该问答逻辑。","knowledge_expansion_md":"### 英语问候与应答全攻略\n\n**1. 问候语 “How are you?” 及其应答**\n*   **功能**：询问对方的身体或精神状态，是日常最频繁使用的问候语。\n*   **标准应答**：\n    *   `Fine, thank you/thanks.` (我很好，谢谢)\n    *   `I'm fine, thank you.`\n    *   `Very well, thank you.`\n*   **其他常见应答**：\n    *   积极的：`Great!`, `Pretty good.`, `Couldn't be better!`\n    *   一般的：`Not bad.`, `I'm OK.`, `So-so.`\n*   **礼貌的后续**：回答之后，通常会反问对方，以示关心和礼貌，如 `And you?` 或 `How about you?`\n\n**2. 易混淆的问候语**\n*   **`How do you do?`**: 这是一个非常正式的问候语，通常只在第一次与某人见面时使用。它的标准回答是重复一遍 `How do you do?`，而不是回答自己的状况。\n*   **`What's up?` / `How's it going?`**: 这是非常口语化和非正式的问候，常见于朋友和熟人之间。回答也相对随意，可以是 `Not much.` `Pretty good.` 等。\n\n**3. 选项分析**\n*   A: `Hello. Li Ming. How are you?` - 没有回答问题，反而直接反问，不礼貌。\n*   B: `Good morning, Li Ming.` - 只是打了招呼，没有回答“你好吗”。\n*   C: `Thank you.` - 只是道谢，没有回答问题，是不完整的应答。","socratic_tracks":[{"title":"功能意念","steps":[{"question":"“How are you?” 这句话的功能是什么？是想知道一个事实，还是在表达一种问候？","hint":"朋友见面时会说这句话。","takeaway":"“How are you?” 是用来询问对方近况的日常问候语。"},{"question":"既然是问候，我们应该如何回应才算礼貌？","hint":"别人关心你，你是不是应该先回答他的问题，然后表示感谢？","takeaway":"礼貌的回应包含两部分：回答自己的状态 + 向对方表示感谢。"},{"question":"看看四个选项，哪个选项同时做到了这两点？","hint":"“Fine” 是回答状态，“thank you” 是表示感谢。","takeaway":"“Fine, thank you.” 是最符合礼貌回应结构的标准答案。"}]},{"title":"情景对话","steps":[{"question":"想象你在学校走廊上遇到了你的老师，老师对你说：“Hello. How are you?”，你应该怎么回答？","hint":"这是一个需要礼貌且正确回答的场景。","takeaway":"在日常对话中，对别人的问候要做出直接且礼貌的回应。"},{"question":"为什么不能选 A “Hello. Li Ming. How are you?”？","hint":"对方已经问你了，你应该先回答，而不是立即把问题抛回去。","takeaway":"在回答问题前就反问对方，既不礼貌，也没有完成自己的应答部分。"}]},{"title":"选项辨析","steps":[{"question":"选项 C “Thank you” 是什么意思？它能单独用来回答“你好吗”这个问题吗？","hint":"“Thank you” 的意思是“谢谢你”。如果只说谢谢，对方不知道你到底好不好。","takeaway":"“Thank you” 只是表达感谢，本身不能回答关于状态的问题，是不完整的应答。"},{"question":"选项 B “Good morning, Li Ming.” 是在什么场合下使用的？它回答了问题吗？","hint":"“Good morning” 是上午见面时的问候语。","takeaway":"“Good morning” 只是一个招呼，它没有回答 “How are you?” 这个问题。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"—That is _____ ruler. It is not _____ eraser.","options":{"A":"/; an","B":"a; an","C":"the; the","D":"/; the"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题主要考查不定冠词 “a” 和 “an” 的用法。不定冠词用于泛指单数可数名词。其使用规则取决于名词开头的读音，而非字母。第一空的名词是 “ruler”，其读音以辅音 /r/ 开头，所以前面用 “a”。第二空的名词是 “eraser”，其读音以元音 /ɪ/ 开头，所以前面用 “an”。尽管题干的第一个句子结构有些不规范，但根据冠词的核心用法，可以确定正确的选择是 “a” 和 “an” 的组合。","knowledge_expansion_md":"### 不定冠词 a/an 的核心用法与易错点\n\n不定冠词 `a/an` 用在单数可数名词前，表示“一个”或“一类”。\n\n**核心规则：**\n*   **`a`** 用在以 **辅音音素** 开头的单词前。\n    *   e.g., `a book`, `a car`, `a dog`\n*   **`an`** 用在以 **元音音素** 开头的单词前。\n    *   e.g., `an apple`, `an egg`, `an orange`\n\n**重要易错点：关注发音，而非字母！**\n1.  **元音字母开头发辅音：** 有些以元音字母 (a, e, i, o, u) 开头的单词，其发音却是以辅音开头的，此时用 `a`。\n    *   `a university` ( /juː/ 是辅音)\n    *   `a European country` ( /jʊ/ 是辅音)\n    *   `a one-way street` ( /w/ 是辅音)\n2.  **辅音字母开头发元音：** 有些以辅音字母开头的单词，其发音却是以元音开头的（通常是因为首字母不发音），此时用 `an`。\n    *   `an hour` (h 不发音，/aʊ/ 是元音)\n    *   `an honest man` (h 不发音，/ɒ/ 是元音)\n    *   `an FBI agent` (读字母 F /ef/ 时，开头是元音)","socratic_tracks":[{"title":"不定冠词 a/an 用法","steps":[{"question":"我们什么时候用 “a”，什么时候用 “an”？它们的选择标准是什么？","hint":"仔细听单词开头的第一个音，是像 a, e, i, o, u 一样的元音，还是像 b, c, d, f 一样的辅音？","takeaway":"“a” 用在以辅音音素开头的单词前，“an” 用在以元音音素开头的单词前。"},{"question":"单词 “ruler” 的读音 /ruːlər/ 是以什么音素开头的？应该用 “a” 还是 “an”？","hint":"听 /r/ 这个音，它是一个辅音。","takeaway":"“ruler” 以辅音音素 /r/ 开头，所以前面用 “a”。"},{"question":"单词 “eraser” 的读音 /ɪˈreɪsər/ 是以什么音素开头的？应该用 “a” 还是 “an”？","hint":"听 /ɪ/ 这个音，它是一个元音。","takeaway":"“eraser” 以元音音素 /ɪ/ 开头，所以前面用 “an”。"}]},{"title":"关注发音而非字母","steps":[{"question":"“university” 这个词，首字母是元音字母 'u'，但为什么我们说 “a university” 而不是 “an university”？","hint":"请读出 “university” /juːnɪˈvɜːrsəti/，注意听第一个音是什么。","takeaway":"“university” 的开头是辅音音素 /j/，所以用 “a”。"},{"question":"“hour” 这个词，首字母是辅音字母 'h'，但为什么我们说 “an hour” 而不是 “a hour”？","hint":"在 “hour” /aʊər/ 这个单词里，字母 'h' 发音了吗？","takeaway":"“hour” 中的 'h' 不发音，单词以元音音素 /aʊ/ 开头，所以用 “an”。"},{"question":"通过这两个例子，我们能总结出判断用 “a” 还是 “an” 的黄金法则是什么吗？","hint":"是看单词的拼写，还是听单词的读音？","takeaway":"判断使用 “a” 还是 “an” 的唯一依据是单词开头的读音，而不是拼写。"}]},{"title":"句子成分分析","steps":[{"question":"我们来看第二个句子 “It is not _____ eraser”。在这个句子里，“eraser” 是一个可数名词还是不可数名词？","hint":"你能说 “one eraser, two erasers” 吗？","takeaway":"“eraser” 是一个可数名词。"},{"question":"当一个单数可数名词在句子中被泛指（即不特指某一个）时，它前面通常需要加什么词？","hint":"比如，我们不会只说 “This is book”，而会说 “This is a book”。","takeaway":"泛指一个单数可数名词时，前面需要加不定冠词 “a” 或 “an”。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Is that your watch over there? —No, it's _____.","options":{"A":"my","B":"this","C":"my father's","D":"mine"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查在具体交际情境中选择语义连贯、语法正确的表达。\n\n对话含义是：“——那边那是你的手表吗？——不，不是我的，（是我爸爸的）。这里的 **No** 否定的是对方的猜测（即认为手表“属于你”），接下来需要补充**真实的归属信息**。\n\n选项 **C. my father's** 等于 **my father's watch**（承前省略已出现的 *watch*），既符合 **it's + 名词所有格** 的结构，又与上文 **No** 相呼应：**不是我的 → 是我父亲的**，语义正确。\n\n选项 **D. mine** 虽可作为名词性物主代词单独使用（相当于 *my watch*），语法形式无误，但语境中已经用 **No** 否定了“是你的手表”，随后再说 **it's mine**（是我的）会造成前后语义冲突，因此不合适。\n\n选项 **A. my** 为形容词性物主代词，后面必须接名词，不可单独用在 **it's** 之后。选项 **B. this** 与手表归属话题不符。","knowledge_expansion_md":"### 物主代词：形容词性 vs. 名词性\n\n英语的物主代词分为两类：\n\n1.  **形容词性物主代词 (Possessive Adjectives)**：`my`, `your`, `his`, `her`, `its`, `our`, `their`。\n    *   特点：必须放在名词前，起修饰作用，不能单独使用。\n    *   记忆口诀：“形后有名”，形容词性物主代词后面一定要跟名词。\n    *   例句：`This is my book.` (这是我的书。)\n\n2.  **名词性物主代词 (Possessive Pronouns)**：`mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n    *   特点：可独立使用，本身已包含名词的含义，相当于“形容词性物主代词 + 名词”。\n    *   记忆口诀：“名后无名”，名词性物主代词后面不再跟名词。\n    *   例句：`This book is mine.` (这本书是我的。) `mine` = `my book`\n\n**易错点**：学生常常混淆 `my` 和 `mine`。务必记住它们在句子中的位置和功能不同。同时注意，名词所有格（如 `my father's`）在用法上类似于名词性物主代词，可以单独使用，表示“我父亲的（东西）”。","socratic_tracks":[{"title":"对话里的 No 否定什么？","steps":[{"question":"问句问的是“是你的手表吗”。回答 No，主要是在否定什么？","hint":"是在否认这块手表属于你，还是在否认“它是手表”？","takeaway":"No 否定的是“属于你”（your），接下来应给出正确的归属。"},{"question":"为什么可以说 it's my father's？","hint":"前面一直在谈 watch；father's 后面能否补上 watch？","takeaway":"my father's 相当于 my father's watch，承前省略名词，语法与语义都成立。"},{"question":"如果填 mine（是我的），和 No 放在一起有什么问题？","hint":"No 已否定“是你的”；再说 it's mine 意味着什么？","takeaway":"会与“不是我的”这一交际意图冲突，语义上不连贯。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"—What _____ do you speak? —I speak Chinese.","options":{"A":"language","B":"science","C":"subject","D":"color"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道词义辨析与搭配题。解题的关键在于理解回答句“I speak Chinese.”（我说中文）。这句话表明了所使用的“语言”。因此，问题应该是在询问“什么语言”。四个选项中，A: language（语言），B: science（科学），C: subject（科目），D: colour（颜色）。只有 `language` 与动词 `speak`（说）和名词 `Chinese`（中文）在语意上能够合理搭配，构成问句“What language do you speak?”（你说什么语言？）。","knowledge_expansion_md":"### 动词与名词的搭配 (Collocations)\n\n在英语学习中，掌握动词和名词的固定搭配至关重要，这能让语言表达更地道、准确。\n\n*   **speak + a language**: 说某种语言\n    *   `She can speak three languages.` (她会说三种语言。)\n*   **study / learn + a subject**: 学习某门科目\n    *   `My favorite subject is science.` (我最喜欢的科目是科学。)\n*   **do / conduct + science**: 做科研\n    *   `Scientists do experiments.` (科学家做实验。)\n\n### 特殊疑问词 `What` 的用法\n\n`What` 用于提问具体信息，其后可以跟名词，构成“What + 名词”的结构，对事物的种类、属性等进行提问。\n*   `What time is it?` (几点了？)\n*   `What size do you wear?` (你穿多大号？)\n*   `What colour is your car?` (你的车是什么颜色的？)","socratic_tracks":[{"title":"动词与名词搭配","steps":[{"question":"题干中的关键动词是什么？","hint":"你用嘴巴做什么动作？","takeaway":"关键动词是 'speak' (说)。"},{"question":"我们通常会 'speak' 什么东西？是 'speak' 颜色，还是 'speak' 科学，还是 'speak' 语言？","hint":"想一想你平时会怎么用'说'这个词。","takeaway":"动词 'speak' 通常和表示语言的名词搭配。"},{"question":"那么四个选项中，哪一个词是‘语言’的意思？","hint":"language, science, subject, colour 分别是什么意思？","takeaway":"只有 'language' 是‘语言’，所以是正确答案。"}]},{"title":"根据回答推断问题","steps":[{"question":"我们先看回答句：'I speak Chinese.' 这句话告诉了我们什么信息？","hint":"Chinese 是什么？","takeaway":"回答是'我说中文'，其中'中文'是一种语言。"},{"question":"既然回答是关于'语言'的，那么问题应该问的是什么呢？","hint":"问题应该询问对方所使用的语言种类。","takeaway":"问题应该在问‘什么语言’。"},{"question":"那么，'什么语言'用英语怎么表达？","hint":"‘什么’是 'What'，‘语言’是 'language'。","takeaway":"‘什么语言’就是 'What language'，所以空格里应该填 'language'。"}]},{"title":"词义辨析","steps":[{"question":"我们来分辨一下这几个词的意思。'subject' 是什么意思？","hint":"你在学校里学习语文、数学、英语，这些都是你的...？","takeaway":"'subject' 的意思是‘科目’。"},{"question":"Chinese (中文) 可以是一个 'subject' 吗？","hint":"语文课是不是一门科目？","takeaway":"是的，Chinese 可以作为一门科目。"},{"question":"那为什么这里不能选 'subject' 呢？","hint":"注意动词是 'speak' (说)，而不是 'study' (学习)。","takeaway":"我们'说'一种语言 (speak a language)，但'学习'一门科目 (study a subject)，动词搭配不同。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"Thanks _____ your present.","options":{"A":"of","B":"from","C":"for","D":"to"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道考查固定搭配的介词题。“Thanks for...”是一个非常常用的固定短语，意思是“为……而感谢”，用来表达对某人或某事的感激之情。句中“your present”（你的礼物）是感谢的原因，因此介词应该用 `for` 来引出这个原因。整个句子的意思是“谢谢你的礼物”。其他介词不符合该固定搭配的用法。","knowledge_expansion_md":"### 固定搭配 `Thank...for...`\n\n`Thank somebody for something / doing something` 是一个核心短语，意为“为某事/做某事而感谢某人”。\n*   `Thank you for your help.` (谢谢你的帮助。)\n*   `He thanked me for inviting him.` (他感谢我邀请他。)\n*   `Thanks for everything.` (谢谢你做的一切。)\n\n### `Thanks to` vs. `Thanks for`\n\n这两个短语虽然形近，但意义和用法有很大区别，是常见的易混点。\n\n*   **`Thanks for`** + 名词/动名词: 表示“为……而感谢”，表达的是主观的感激。是直接的道谢。\n    *   `Thanks for coming.` (谢谢你的到来。)\n\n*   **`Thanks to`** + 名词: 表示“多亏了；由于”，用来引出某事发生的原因，这个原因通常是积极的，但有时也可用于讽刺。它强调的是因果关系。\n    *   `Thanks to your advice, I passed the exam.` (多亏了你的建议，我通过了考试。)\n    *   `Thanks to the traffic jam, I was late.` (都怪这堵车，我迟到了。——讽刺用法)","socratic_tracks":[{"title":"固定搭配 \"Thanks for\"","steps":[{"question":"当你想谢谢别人送你的礼物时，你会怎么说？'谢谢你的礼物'。","hint":"这是一个非常日常的表达。","takeaway":"我们通常会说 'Thanks for your present' 或 'Thank you for your present'。"},{"question":"在这个固定短语中，表示‘为了什么而感谢’时，我们用的是哪个介词？","hint":"回想一下 'Thank you for your help' 这句话。","takeaway":"表示感谢的原因时，我们固定使用介词 'for'。"}]},{"title":"介词功能辨析","steps":[{"question":"我们来想一想，介词 'for' 有什么常见的功能？","hint":"比如 'a gift for you' (给你的礼物), 'wait for me' (等我)。","takeaway":"介词 'for' 可以表示目的、原因、对象等。"},{"question":"在这道题 'Thanks _____ your present' 中，'your present' 是感谢的什么？","hint":"是因为收到了礼物，所以才感谢。","takeaway":"'your present' 是感谢的原因。"},{"question":"那么，哪个介词最适合用来引出感谢的原因呢？","hint":"在 'thanks' 这个词后面，表示原因的介词是什么？","takeaway":"在表达感谢时，用 'for' 来引出感谢的原因。"}]},{"title":"区分 \"Thanks to\"","steps":[{"question":"你见过 'Thanks to' 这个短语吗？它是什么意思？","hint":"比如：'Thanks to him, we won the game.' (____他，我们赢了比赛。)","takeaway":"'Thanks to' 的意思是‘多亏了，幸亏’，用来引出原因。"},{"question":"那么 'Thanks to your present' 和 'Thanks for your present' 意思一样吗？","hint":"一个是‘多亏了你的礼物’，一个是‘为你的礼物而感谢’。感受一下语气的不同。","takeaway":"它们的意思和用法不同。'Thanks for' 是直接表达感谢，而 'Thanks to' 是引出一个原因或结果。"},{"question":"根据题意'谢谢你的礼物'，我们应该选择哪一个？","hint":"这里是直接表达感谢，而不是说‘多亏了你的礼物才发生了某事’。","takeaway":"直接表达感谢应该用 'Thanks for'。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"Is _____ your aunt? What's _____ name?","options":{"A":"he; his","B":"she; her","C":"he; her","D":"she; his"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查人称代词和物主代词的正确使用，关键在于前后文的指代一致。第一个空，根据后面的名词 `aunt`（阿姨/姑姑）可知，谈论的对象是一位女性，因此作主语时应用人称代词 `she`。第二个空，`What's _____ name?` 是在询问这位 `aunt` 的名字，即“她的名字”。表示“她的”，应该用形容词性物主代词 `her` 来修饰名词 `name`。因此，两个空应分别填 `she` 和 `her`，正确答案是B。","knowledge_expansion_md":"### 人称代词与物主代词的对应关系\n\n在英语中，代词的使用必须与其指代的名词在“性”（男/女/物）和“数”（单/复）上保持一致。以下是主格人称代词和形容词性物主代词的对应表，需要熟练掌握：\n\n| 主格 (Subject) | 含义 | 形容词性物主代词 (Possessive Adj.) | 含义 |\n| :--- | :--- | :--- | :--- |\n| I | 我 | my | 我的 |\n| you | 你/你们 | your | 你的/你们的 |\n| he | 他 | his | 他的 |\n| **she** | **她** | **her** | **她的** |\n| it | 它 | its | 它的 |\n| we | 我们 | our | 我们的 |\n| they | 他们/她们/它们 | their | 他们的/她们的/它们的 |\n\n**易错点**：\n*   **性别混淆**：`he` (他) vs. `she` (她)；`his` (他的) vs. `her` (她的)。\n*   **`her` 的双重身份**：`her` 既可以作宾格（如 `I love her.`），也可以作形容词性物主代词（如 `This is her book.`）。需要根据其在句子中的功能来判断。","socratic_tracks":[{"title":"根据名词判断性别","steps":[{"question":"我们看第一个句子里的关键词 'aunt'。'aunt' 指的是男性还是女性？","hint":"比如你妈妈的姐妹，我们叫她什么？","takeaway":"'aunt' 指的是女性长辈。"},{"question":"既然指的是女性，那么用来指代她的主语人称代词应该用 'he' 还是 'she'？","hint":"'he' 指他，'she' 指她。","takeaway":"指代女性应该用 'she'，所以第一个空填 'she'。"}]},{"title":"物主代词的性数一致","steps":[{"question":"我们已经确定了谈论的对象是 'aunt' (she)。第二个问题是 'What's _____ name?'，这是在问谁的名字？","hint":"是在问这位 aunt 的名字。","takeaway":"这是在问‘她的’名字。"},{"question":"表示‘她的’，我们应该用哪个词来修饰 'name'？是 'his' 还是 'her'？","hint":"'his' 是‘他的’，'her' 是‘她的’。","takeaway":"表示‘她的’应该用 'her'。"},{"question":"所以，把两个空的答案合起来，应该选择哪个选项？","hint":"第一个空是 'she'，第二个空是 'her'。","takeaway":"正确答案是 'she; her'。"}]},{"title":"代词的功能","steps":[{"question":"在 'Is _____ your aunt?' 这句话里，横线上需要一个什么成分的词？","hint":"这个句子缺了主语还是宾语？","takeaway":"这个疑问句缺少主语，需要一个主格人称代词。"},{"question":"在 'What's _____ name?' 这句话里，横线上需要一个什么样的词？","hint":"这个词放在名词 'name' 的前面，用来修饰它，表示‘谁的’。","takeaway":"这里需要一个形容词性物主代词来修饰名词。"},{"question":"结合我们对 'aunt' 是女性的判断，请选出正确的主格人称代词和形容词性物主代词。","hint":"女性的主格是 'she'，形容词性物主代词是 'her'。","takeaway":"因此，我们选择 'she' 和 'her'。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"The movie is very _____ and I like it.","options":{"A":"boring","B":"interested","C":"interesting","D":"difficult"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查-ing和-ed结尾的形容词的区别。-ing结尾的形容词（如interesting）常用来描述事物的性质或特点，意为“令人……的”；-ed结尾的形容词（如interested）常用来描述人的感受，意为“感到……的”。题干中，横线处是用来修饰主语“The movie”（电影），描述电影的特点，所以应该用-ing形式的形容词。根据后半句“and I like it”（我喜欢它），可知这部电影是“有趣的”，故选择interesting。","knowledge_expansion_md":"### -ing 形容词 vs. -ed 形容词\n\n这是英语中非常重要且常见的考点。区分它们的关键在于理解它们描述的对象和含义：\n\n1.  **-ing 形容词**：修饰**事物**或**人**，描述其本身具有的、能引起某种情感的**特质**。常翻译为“令人……的”。\n    *   公式：`物/人 + be + -ing adj.` (e.g., The story is **exciting**.)\n    *   公式：`an -ing + n.` (e.g., an **exciting** story)\n\n2.  **-ed 形容词**：修饰**人**（或有情感的动物），描述其**内心感受**。常翻译为“感到……的”。\n    *   公式：`人 + be + -ed adj.` (e.g., I am **excited** about the story.)\n\n**常见易混淆词对：**\n*   `interesting` (有趣的) vs. `interested` (感兴趣的)\n*   `boring` (无聊的) vs. `bored` (感到无聊的)\n*   `exciting` (令人兴奋的) vs. `excited` (感到兴奋的)\n*   `surprising` (令人惊讶的) vs. `surprised` (感到惊讶的)\n*   `tiring` (令人疲惫的) vs. `tired` (感到疲惫的)","socratic_tracks":[{"title":"-ing 与 -ed 形容词辨析","steps":[{"question":"这个空是用来形容什么的？是形容“我”的感受，还是形容“电影”的特点？","hint":"看看句子主语 “The movie is...”，这是在对什么进行描述？","takeaway":"这个空是用来修饰主语“电影”的，描述它的特点。"},{"question":"当我们形容一个事物（比如电影、书）的特点时，我们通常用以 -ing 结尾的形容词还是以 -ed 结尾的形容词？","hint":"想一想“一个有趣的故事”是 an interesting story 还是 an interested story？","takeaway":"形容事物的特点，用 -ing 结尾的形容词；形容人的感受，用 -ed 结尾的形容词。"}]},{"title":"上下文逻辑推理","steps":[{"question":"句子后半部分说 “and I like it”（我喜欢它），这说明这部电影给人的感觉是积极的还是消极的？","hint":"“like” 是“喜欢”的意思，是一种正向的情感。","takeaway":"“I like it” 表明我们需要一个带有积极含义的词。"},{"question":"我们来看四个选项：boring, interested, interesting, difficult。哪个词是积极的，并且能用来形容电影？","hint":"boring (无聊的) 是消极的。interested (感兴趣的) 是形容人的感受。difficult (困难的) 用来形容电影不常见。","takeaway":"interesting (有趣的) 是最符合句意的积极词汇，并且可以修饰电影。"}]},{"title":"主语与表语一致性","steps":[{"question":"这个句子的主语是 The movie，它是一个“物”还是一个“人”？","hint":"电影是一种事物。","takeaway":"主语 The movie 是“物”。"},{"question":"interested 和 interesting，哪一个通常用来修饰“物”？","hint":"我们说 “I am interested in the movie.” (我对电影感兴趣)，还是 “The movie is interested.”？","takeaway":"interesting 用来修饰物，表示“事物是有趣的”；interested 用来修饰人，表示“人是感兴趣的”。"},{"question":"所以，既然主语是 The movie，表语形容词应该选择哪一个？","hint":"主语和表语在逻辑上要匹配。","takeaway":"主语是物，表语应该用-ing形式的形容词，所以选 interesting。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"_____ your brother _____ a soccer ball?","options":{"A":"Do; has","B":"Do; have","C":"Does; has","D":"Does; have"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查一般现在时的一般疑问句构成。句子的主语是 “your brother”，是第三人称单数。对于第三人称单数作主语的一般疑问句，句首需要用助动词 “Does” 来提问，因此可以排除A和B选项。当句中使用了助动词 “Does” 后，其后的主要动词必须使用原形。动词 “has” 的原形是 “have”。所以正确的结构是 “Does + 主语 + have...?”，故选择D。","knowledge_expansion_md":"### 一般现在时态的疑问句和否定句\n\n一般现在时态中，当谓语动词是实义动词时，我们需要借助助动词 `do` 或 `does` 来构成疑问句和否定句。\n\n1.  **主语为第一、二人称或复数名词 (I, you, we, they, the students...)**\n    *   否定句：`主语 + don't (do not) + 动词原形...`\n        *   e.g., They **don't have** a car.\n    *   一般疑问句：`Do + 主语 + 动词原形...?`\n        *   e.g., **Do** you **have** a soccer ball?\n\n2.  **主语为第三人称单数 (he, she, it, your brother, Mike...)**\n    *   否定句：`主语 + doesn't (does not) + 动词原形...`\n        *   e.g., He **doesn't have** a car.\n    *   一般疑问句：`Does + 主语 + 动词原形...?`\n        *   e.g., **Does** he **have** a soccer ball?\n\n**核心要点**：一旦句子中出现了助动词 `does` 或 `doesn't`，后面的动词就必须“打回原形”，不能再使用第三人称单数形式（如 `has`, `plays`）。可以记作“助动词扛起了人称和数的变化，后面的动词就轻松了”。","socratic_tracks":[{"title":"一般疑问句的助动词","steps":[{"question":"这个句子的主语是 “your brother”。它是第几人称？是单数还是复数？","hint":"“your brother” 可以用代词 “he” 来代替。","takeaway":"主语是第三人称单数。"},{"question":"当主语是第三人称单数时，构成一般疑问句应该用哪个助动词开头，是 Do 还是 Does？","hint":"回想一下，“他喜欢苹果”是 He likes apples. 变成疑问句是 “Does he like apples?”。","takeaway":"主语是第三人称单数时，一般疑问句要用助动词 Does 开头。"}]},{"title":"助动词后的动词形式","steps":[{"question":"当我们使用了助动词 Do, Does, 或 Did 之后，它们后面的主要动词应该用什么形式？","hint":"回忆一下 “He doesn't like apples.” 这里的 like 是什么形式？","takeaway":"助动词 Do/Does/Did 后面必须跟动词原形。"},{"question":"那么，表示“有”的动词 “has” 和 “have”，哪一个是它的原形？","hint":"动词不定式是 to have，去掉 to 就是原形。","takeaway":"“have” 是动词原形，“has” 是它的第三人称单数形式。"},{"question":"所以，在 “Does your brother...” 这个结构后面，我们应该填 “has” 还是 “have”？","hint":"助动词 Does 已经承担了第三人称单数的标志，后面的动词要“返璞归真”。","takeaway":"既然前面用了 Does，后面就必须用动词原形 have。"}]},{"title":"排除法解题","steps":[{"question":"看到主语是 “your brother” (第三人称单数)，我们首先可以排除哪两个选项？为什么？","hint":"第三人称单数作主语时，一般疑问句的助动词是什么？","takeaway":"可以排除 A 和 B，因为它们的助动词是 Do，而第三人称单数主语需要用 Does。"},{"question":"现在只剩下 C (Does; has) 和 D (Does; have)。它们唯一的区别是什么？","hint":"对比一下第二个空，一个是 has，一个是 have。","takeaway":"它们的区别在于助动词 Does 后面的动词形式。"},{"question":"根据“助动词后跟动词原形”的规则，C 和 D 哪个是正确的？","hint":"has 是第三人称单数形式，have 才是原形。","takeaway":"助动词 Does 后面要用动词原形 have，所以 D 是正确答案。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—Let's _____ basketball. —Good idea!","options":{"A":"plays","B":"to play","C":"play","D":"playing"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查祈使句中 “Let's” 的用法。“Let's” 是 “Let us” 的缩写，意为“让我们”，用于提出建议，构成建议性的祈使句。其基本结构是 “Let's + 动词原形 + ...”。选项A “plays” 是动词的第三人称单数形式，B “to play” 是不定式，D “playing” 是现在分词或动名词形式，均不符合语法要求。只有C “play” 是动词原形，所以是正确答案。","knowledge_expansion_md":"### 提出建议的常用句型\n\n在英语中，除了 `Let's...`，还有很多方式可以用来提出建议：\n\n1.  **Let's + 动词原形...**\n    *   e.g., **Let's go** to the park.\n    *   回答：Good idea! / OK. / All right.\n\n2.  **Shall we + 动词原形...?**\n    *   e.g., **Shall we go** to the park?\n    *   回答：Yes, let's. / No, let's not.\n\n3.  **How about / What about + V-ing / 名词?**\n    *   e.g., **How about going** to the park? / **What about** a walk in the park?\n\n4.  **Why don't you / we + 动词原形...?** (名为疑问，实为建议)\n    *   e.g., **Why don't we go** to the park?\n\n5.  **Would you like to + 动词原形...?** (更委婉的邀请或建议)\n    *   e.g., **Would you like to go** to the park?\n\n**注意**：`let` 作为使役动词，其结构是 `let sb. do sth.` (让某人做某事)，后面的动词始终用原形。例如：`My mom lets me play` outside for an hour. (我妈妈让我到外面玩一小时。)","socratic_tracks":[{"title":"Let's 的用法","steps":[{"question":"“Let's” 是哪两个词的缩写？它是什么意思？","hint":"L-e-t u-s. 它的意思是“让我们……”。","takeaway":"“Let's” 是 “Let us” 的缩写，意思是“让我们”，用于提出建议。"},{"question":"在 “Let's” 后面，我们应该跟一个什么形式的动词？是加-s，加-ing，带to，还是什么都不加的原形？","hint":"想一个你最熟悉的例子，比如 “Let's go!”。这里的 “go” 是什么形式？","takeaway":"“Let's” 后面必须跟动词原形。"}]},{"title":"使役动词 let","steps":[{"question":"动词 “let” 的意思是“让”。它后面如果跟了一个人（宾语），再跟一个动作，这个动作应该用什么形式？","hint":"比如“让我看看”是 “Let me see” 还是 “Let me to see”？","takeaway":"“let” 的结构是 “let somebody do something”，即 let + 宾语 + 动词原形。"},{"question":"在 “Let's play basketball” 这个句子里，“us” 是宾语，那么后面的动词 “play” 应该用什么形式？","hint":"套用 “let sb. do sth.” 的公式。","takeaway":"根据公式，“let us” 后面应该跟动词原形 “play”。"}]},{"title":"祈使句的构成","steps":[{"question":"“Let's...” 开头的句子属于哪种句型？是陈述句、疑问句还是祈使句？","hint":"这种句子是在提出请求、命令或建议。","takeaway":"“Let's...” 开头的句子是祈使句的一种，表示建议。"},{"question":"我们学过的其他祈使句，比如“打开门”，通常用什么形式的动词开头？","hint":"“Open the door.” 或者 “Be quiet.”","takeaway":"肯定祈使句通常以动词原形开头。"},{"question":"“Let's...” 句型是祈使句的特殊形式，它也遵循了使用动词原形的规则。那么，根据这个规则，let 后面的动词应该是什么形式？","hint":"“let sb. do sth.” 是一个固定搭配，do 就是动词原形。","takeaway":"在 “Let's...” 句型中，let 后面的动词也必须使用原形。"}]}]}},{"number":"16","item_type":"choice","context_note":"","stem":"Mike doesn't play sports. He only _____ them on TV.","options":{"A":"sees","B":"watches","C":"looks at","D":"finds"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查表示“看”的几个近义动词的辨析。`see` 意为“看见”，强调看的结果，常指无意地看到。`watch` 意为“观看，注视”，强调看的过程，常指聚精会神地、持续地看动态的画面，如看电视、看比赛、看表演等。`look at` 意为“看”，强调“看”这个动作，指把目光投向某个方向。`find` 意为“找到，发现”。根据句意“他只在电视上_____它们（体育运动）”，应该是指“观看”体育比赛的过程，所以用 `watch` 最合适。主语是 “He”，是第三人称单数，所以动词用第三人称单数形式 `watches`。","knowledge_expansion_md":"### “看”的家族：see, watch, look at\n\n这三个动词都与“看”有关，但在用法和侧重点上有明显区别：\n\n1.  **look at**: 强调“看”的**动作**。它是一个有意识的行为，指把视线转向某个目标。\n    *   e.g., **Look at** the blackboard, please. (请看黑板。)\n    *   e.g., Why are you **looking at** me like that? (你为什么那样看着我？)\n\n2.  **see**: 强调“看”的**结果**，即“看见”。它既可以是有意识的，也可以是无意识的（瞥见）。\n    *   e.g., I opened the window and **saw** a bird. (我打开窗户，看见了一只鸟。)\n    *   `see a film/movie` 通常指去电影院看电影。\n    *   `see a doctor` 指看病。\n\n3.  **watch**: 强调“看”的**过程**。指在一段时间内，聚精会神地观看移动或变化的东西，如电视、比赛、表演等。\n    *   e.g., We like to **watch** football games on weekends. (我们喜欢在周末看足球比赛。)\n    *   e.g., I'm **watching** my favorite TV show. (我正在看我最喜欢的电视节目。)\n\n**简单记忆法**：`look at` 是个动作，`see` 是个结果，`watch` 是个过程。","socratic_tracks":[{"title":"动词词义辨析","steps":[{"question":"句子说 Mike 不做运动，他只在电视上看体育比赛。这里的“看”是一种什么样的“看”？是无意中瞥见，还是有意识地盯着看，还是持续地观看一个过程？","hint":"在电视上看体育比赛，通常会花一段时间，并且会很专注。","takeaway":"在电视上看体育比赛，是一种持续、专注的“观看”过程。"},{"question":"see, watch, look at 这三个表示“看”的词，哪一个最能表达“持续、专注地观看”？","hint":"see 是“看见”，look at 是“朝...看”，watch 是“观看”。","takeaway":"watch 最适合表示观看电视、比赛等持续进行的活动。"}]},{"title":"固定搭配应用","steps":[{"question":"当我们说“看电视”时，英语里最常用的动词是什么？","hint":"想一想你平时怎么说“我喜欢看电视”。“I like to ___ TV.”","takeaway":"“看电视”的固定搭配是 `watch TV`。"},{"question":"句中的 “them” 指代的是前文的 “sports”。那么“在电视上看体育运动”和“看电视”是不是类似的情景？","hint":"都是通过电视屏幕观看一个节目或活动。","takeaway":"是的，它们是同一种情景，都应该使用动词 `watch`。"}]},{"title":"主谓一致语法","steps":[{"question":"确定了要用动词 `watch` 之后，我们来看看它的形式。这个句子的主语是谁？","hint":"“He only _____ them on TV.”","takeaway":"句子的主语是 “He”。"},{"question":"主语 “He” 是第三人称单数。在一般现在时中，谓语动词应该有什么变化？","hint":"动词词尾通常要加 -s 或 -es。","takeaway":"当主语是第三人称单数时，动词需要使用第三人称单数形式。"},{"question":"动词 `watch` 的第三人称单数形式是什么？","hint":"以 -ch 结尾的动词，变第三人称单数时加 -es。","takeaway":"动词 `watch` 的第三人称单数形式是 `watches`。"}]}]}},{"number":"17","item_type":"choice","context_note":"","stem":"I need to write a lost note. Can you _____ me _____?","options":{"A":"take; a pencil","B":"bring; some books","C":"take; some papers","D":"bring; a pen"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词辨析和生活常识。根据题干“I need to write a lost note”（我需要写一张寻物启事），可知说话者需要书写工具，因此排除B和C。动词“bring”意为“带来”，指将物品拿到说话者这里；动词“take”意为“带走”，指将物品从说话者这里拿开。因为是请求对方给自己拿来一支笔，动作方向是朝向说话者的，所以应该用“bring”。因此，正确答案是D。","knowledge_expansion_md":"### 动词 bring vs. take\n\n这两个动词都与“带”有关，但方向相反，是初学者常见的易错点。\n\n1.  **bring (带来)**: 表示将某物或某人从别处移动到说话者所在的位置或谈话的中心点。方向是“来”。\n    *   *例句：* `Please bring your books to my office.` (请把你的书带到我的办公室来。)\n    *   *例句：* `Don't forget to bring me a souvenir from Paris.` (别忘了从巴黎给我带个纪念品回来。)\n\n2.  **take (带走)**: 表示将某物或某人从说话者所在的位置或谈话的中心点移动到别处。方向是“去”。\n    *   *例句：* `Please take these files to the meeting room.` (请把这些文件带到会议室去。)\n    *   *例句：* `I'll take my umbrella with me.` (我会带上我的雨伞。)","socratic_tracks":[{"title":"动词方向辨析","steps":[{"question":"当你想让别人给你拿个东西时，这个东西是朝你移动，还是远离你移动？","hint":"想象一下，你坐在这里，朋友给你递过来一支笔。笔的移动方向是怎样的？","takeaway":"物品是朝向说话者移动的。"},{"question":"在英语中，表示“带来”（朝向说话者）的动词是 bring 还是 take？","hint":"想一想“欢迎来到中国”是 Welcome to China，这里的“来”是 come。bring 和 come 在方向上类似。","takeaway":"表示“带来”的动词是 bring，而“带走”是 take。"}]},{"title":"语境与物品匹配","steps":[{"question":"题干中说“I need to write a lost note”，这是要做什么？","hint":"关键词是 'write'，意思是“写”。","takeaway":"说话者需要写一张寻物启事或便条。"},{"question":"写字需要什么工具？看看四个选项提供的物品，哪些是合适的？","hint":"books (书), papers (纸), pencil (铅笔), pen (钢笔)。","takeaway":"写字需要笔（pen）或铅笔（pencil）。"},{"question":"结合我们对动词 bring/take 的理解，哪个选项既符合动作方向，又提供了正确的工具？","hint":"我们需要一个表示“带来”的动词和一个书写工具。","takeaway":"选项D “bring me a pen” (给我带来一支笔) 是最符合语境和语法要求的。"}]},{"title":"词汇理解","steps":[{"question":"“a lost note”是什么意思？","hint":"lost 是 lose 的过去分词，意为“丢失的”。note 在这里指“便条，启事”。","takeaway":"“a lost note”指的是“一张寻物启事”或“遗失的便条”。"},{"question":"为什么选项C中的 'some papers' (一些纸) 虽然也和写字有关，但不是最佳答案？","hint":"通常请求帮助时，会先要最关键的工具。没有笔，有纸也无法写。","takeaway":"在需要写字的场景下，直接请求书写工具（笔）比请求纸张更常见和直接。"}]}]}},{"number":"18","item_type":"choice","context_note":"","stem":"He wants _____ the art club.","options":{"A":"to join","B":"join","C":"joins","D":"joining"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查非谓语动词的用法。动词“want”后面跟动词作宾语时，需要使用不定式形式，即“to + 动词原形”。这个结构是“want to do something”，意为“想要做某事”。题干中主语是“He”，谓语动词是“wants”，后面需要跟宾语。选项中只有A“to join”是正确的不定式形式。B是动词原形，C是第三人称单数，D是动名词，均不符合“want”的用法。","knowledge_expansion_md":"### 动词后接不定式 vs. 动名词\n\n在英语中，当一个动词后面需要跟另一个动词作宾语时，后一个动词需要变成非谓语形式，主要是**不定式 (to do)** 或**动名词 (doing)**。\n\n1.  **只接不定式 (to do) 的常见动词**：\n    *   `want to do` (想要做)\n    *   `need to do` (需要做)\n    *   `hope to do` (希望做)\n    *   `plan to do` (计划做)\n    *   `decide to do` (决定做)\n    *   `learn to do` (学习做)\n    *   `agree to do` (同意做)\n\n2.  **只接动名词 (doing) 的常见动词**：\n    *   `enjoy doing` (喜欢做)\n    *   `finish doing` (完成做)\n    *   `mind doing` (介意做)\n    *   `practice doing` (练习做)\n    *   `keep doing` (持续做)\n    *   `avoid doing` (避免做)\n\n3.  **两者都可接，意义差别不大**：`like`, `love`, `hate`, `start`, `begin`, `continue`。\n    *   *例句：* `I like to swim.` / `I like swimming.` (我喜欢游泳。)\n\n4.  **两者都可接，但意义不同**：`stop`, `remember`, `forget`。\n    *   `stop to do` (停下来去做另一件事) vs. `stop doing` (停止正在做的事)\n    *   *例句：* `He stopped to smoke.` (他停下来，开始抽烟。) vs. `He stopped smoking.` (他戒烟了。)","socratic_tracks":[{"title":"核心句型：want to do","steps":[{"question":"当你想用英语表达“我想要去公园”时，你会怎么说？'I want ___ go to the park.'","hint":"在 'want' 和 'go' 之间需要加一个词。","takeaway":"我们会说 'I want to go to the park'，用 'to' 连接两个动词。"},{"question":"这个 'to go' 在语法上叫什么？它由什么构成？","hint":"它由 'to' 和一个动词的...形式构成？","takeaway":"这叫动词不定式，由 'to + 动词原形' 构成。"},{"question":"所以，'want' 这个动词后面如果跟另一个动词，应该使用什么结构？","hint":"回顾一下“想要去公园”的例子。","takeaway":"动词 'want' 后面要跟动词不定式，即 'want to do something'。"}]},{"title":"动词形式辨析","steps":[{"question":"一个简单的句子中，通常有几个作谓语的动词？","hint":"比如 'He runs fast.' 中有几个谓语动词？","takeaway":"一个简单句通常只有一个谓语动词。"},{"question":"在这道题 'He wants _____ the art club.' 中，谓语动词是哪个？","hint":"哪个词表达了主语 'He' 的主要动作？","takeaway":"谓语动词是 'wants'。"},{"question":"既然 'wants' 已经是谓语动词，那么后面的动词 'join' 还能用原形(join)或第三人称单数(joins)吗？","hint":"一个句子不能有两个谓语动词。","takeaway":"不能，所以 'join' 必须变成非谓语形式，如不定式或动名词。"}]},{"title":"词汇与搭配","steps":[{"question":"你知道 'join a club' 是什么意思吗？","hint":"'join' 意为“加入”，'club' 是“俱乐部”。","takeaway":"'join a club' 的意思是“加入一个俱乐部”。"},{"question":"除了 'art club' (美术俱乐部)，你还能说出其他类型的俱乐部吗？","hint":"想想学校里可能有的兴趣小组，比如关于音乐、体育、阅读的。","takeaway":"还有 music club (音乐俱乐部), sports club (体育俱乐部), reading club (读书俱乐部) 等。"}]}]}},{"number":"19","item_type":"choice","context_note":"","stem":"—How does your father go to work every day? —_____ taxi.","options":{"A":"In","B":"By","C":"On","D":"With"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查表示交通方式的介词用法。问句“How does your father go to work?”是在询问出行的方式。回答出行方式时，我们通常使用“by + 交通工具名词”的结构，意为“乘坐/通过……（交通工具）”。在这个结构中，交通工具名词前不加冠词（如a, an, the）或所有格形容词（如my, his）。因此，“乘坐出租车”的正确表达是“By taxi”。","knowledge_expansion_md":"### 表示交通方式的介词\n\n表示交通方式时，介词的选用有固定规则：\n\n1.  **`by` + 交通工具名词 (不加冠词)**: 这是最通用的表达方式，强调出行的“方法”。\n    *   `by car` (乘小汽车), `by bus` (乘公交车), `by train` (乘火车), `by plane` (乘飞机), `by ship` (乘船), `by subway` (乘地铁)。\n    *   特殊：`on foot` (步行)，不能用 `by foot`。\n\n2.  **`in` + a/an/the/所有格 + 交通工具**: 用于小型、私人的交通工具内部，强调“在……里面”。\n    *   `in a car`, `in a taxi`, `in his car`。\n\n3.  **`on` + a/an/the/所有格 + 交通工具**: 用于大型公共交通工具或骑跨式的交通工具，强调“在……上面”。\n    *   `on a bus`, `on a train`, `on a plane` (可以站立或走动)。\n    *   `on a bike`, `on a horse`, `on a motorcycle` (骑跨)。\n\n**总结**：当回答 `How` 引导的提问时，通常用 `by` 来概括交通方式；当描述具体情景时，会用 `in` 或 `on`。","socratic_tracks":[{"title":"核心用法：by + 交通工具","steps":[{"question":"问句 'How ... go to work?' 是在问什么？","hint":"疑问词 'How' 通常用来询问方式或方法。","takeaway":"问句是在询问“如何去上班”，即询问交通方式。"},{"question":"当我们要表达“乘坐某种交通工具”这种方式时，最常用的介词是什么？","hint":"比如，“乘飞机”是 ___ plane，“乘公交车”是 ___ bus。","takeaway":"表达交通方式最常用的介词是 'by'。"},{"question":"在使用 'by + 交通工具' 这个结构时，交通工具名词前面需要加 'a' 或者 'the' 吗？","hint":"我们是说 'by car' 还是 'by a car'？","takeaway":"在 'by + 交通工具' 结构中，名词前通常不加任何冠词。"}]},{"title":"介词辨析：in, on, by","steps":[{"question":"我们什么时候会用介词 'in' 来谈论交通工具？","hint":"想想你坐在爸爸的车里，你会说 'I'm ___ my father's car.'","takeaway":"当我们在一个较小的、封闭的交通工具“里面”时，用 'in'，如 'in a car', 'in a taxi'。"},{"question":"那什么时候用 'on' 呢？","hint":"想想你骑自行车或乘坐公共汽车时的状态。","takeaway":"当我们乘坐大型公共交通工具（如 bus, train）或骑跨式交通工具（如 bike, horse）时，用 'on'。"},{"question":"对比一下 'By taxi' 和 'In a taxi'，它们在意思和用法上有什么不同？","hint":"一个回答 'How' 的问题，一个描述具体位置。","takeaway":"'By taxi' 强调“乘坐出租车”这种出行方式，而 'In a taxi' 强调“在出租车里”这个具体状态。"}]},{"title":"特殊情况：步行","steps":[{"question":"如果我们是走路去某个地方，应该用哪个介词短语来表达？","hint":"它不使用 'by'，是一个特殊的固定搭配。","takeaway":"表达“步行”时，我们用固定短语 'on foot'。"},{"question":"可以说 'by foot' 吗？","hint":"这是一个常见的错误。","takeaway":"不可以，'by foot' 是错误的用法，必须用 'on foot'。"}]}]}},{"number":"20","item_type":"choice","context_note":"","stem":"Yesterday after class I _____ my homework.","options":{"A":"do","B":"did","C":"make","D":"made"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查一般过去时和动词搭配。首先，句子中的时间状语“Yesterday”（昨天）明确指出动作发生在过去，因此谓语动词需要使用一般过去时。其次，考查固定搭配“做作业”，在英语中应使用动词“do”，即“do homework”。结合这两点，我们需要找到动词“do”的过去式。动词“do”的过去式是“did”。因此，正确答案是B。","knowledge_expansion_md":"### 一般过去时与动词搭配 (do vs. make)\n\n1.  **一般过去时 (Simple Past Tense)**:\n    *   **用途**: 表示过去某个特定时间发生并完成的动作或存在的状态。\n    *   **标志词**: `yesterday`, `last week/month/year`, `... ago` (如 `two days ago`), `in 2010`, `just now` 等。\n    *   **构成**: 谓语动词使用过去式。规则动词加 `-ed`，不规则动词需要特殊记忆 (如 `go-went`, `do-did`, `see-saw`)。\n\n2.  **动词搭配：do vs. make**:\n    这两个词都可译为“做”，但用法不同，需要通过固定搭配来记忆。\n    *   **do**: 常用于指代工作、任务、活动或重复性的行为。\n        *   `do homework` (做作业)\n        *   `do housework` (做家务)\n        *   `do sports` (做运动)\n        *   `do one's best` (尽力)\n        *   `do business` (做生意)\n    *   **make**: 常用于指创造、制造、产生出新的事物或结果。\n        *   `make a cake` (做蛋糕)\n        *   `make a mistake` (犯错误)\n        *   `make friends` (交朋友)\n        *   `make a noise` (制造噪音)\n        *   `make a decision` (做决定)","socratic_tracks":[{"title":"时态判断","steps":[{"question":"句子中有一个词告诉我们动作发生的时间，是哪个词？","hint":"找一个表示“昨天”、“上周”这类过去的词。","takeaway":"时间状语是 'Yesterday' (昨天)。"},{"question":"既然动作发生在昨天，那么动词应该使用什么时态？","hint":"描述过去发生的事情，用现在时、过去时还是将来时？","takeaway":"描述过去发生的动作，应该使用一般过去时。"}]},{"title":"动词搭配：do/make homework","steps":[{"question":"在英语中，“做作业”这个短语，是用动词 'do' 还是 'make'？","hint":"这是一个非常常见的固定搭配。","takeaway":"“做作业”的固定搭配是 'do homework'。"},{"question":"为什么不能用 'make homework'？'make' 和 'do' 有什么区别？","hint":"'make' 强调从无到有地“制造”，而 'do' 强调“完成”一项任务或活动。","takeaway":"'make' 侧重创造，而 'do' 侧重执行，做作业属于执行任务，所以用 'do'。"}]},{"title":"综合应用与排除","steps":[{"question":"我们已经知道要用过去时，并且要用动词 'do'。那么 'do' 的过去式是什么？","hint":"'do' 是一个不规则动词，它的过去式不是加 '-ed'。","takeaway":"动词 'do' 的过去式是 'did'。"},{"question":"现在看看四个选项，为什么A, C, D都是错的？","hint":"A 'do' 时态不对；C 'make' 和 D 'made' 动词搭配不对。","takeaway":"A时态错误，C和D动词选择错误，只有B 'did' 同时满足了过去时态和正确动词搭配两个条件。"}]}]}}]},{"section_title":"三、完形填空。(共10分)","section_instruction":"A boy and a girl catch a bird and (21)_____ it in a birdcage(鸟笼). They like it (22)_____ and (23)_____ it every day. A cat sees the bird and wants (24)_____ her supper. (25)_____ the bird is in the cage. She can't catch it. So she is very (26)_____.\nOne day, she opens the door of the cage, (27)_____ she wants to catch it. But the bird flies away. The cat (28)_____ and she has (29)_____ to eat. The two children (30)_____ and see the bird isn't in it. They are very angry and put the cat into the cage.","items":[{"number":"21","item_type":"cloze","context_note":"","stem":"A boy and a girl catch a bird and _____ it in a birdcage(鸟笼).","options":{"A":"take","B":"put","C":"carry","D":"bring"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词词义辨析。句意为“一个男孩和一个女孩抓到一只鸟，并把它放进一个鸟笼里”。`put ... in ...` 是固定搭配，意为“把……放进……”，符合句意。选项 A `take` (拿走)、C `carry` (搬运) 和 D `bring` (带来) 均不符合语境。","knowledge_expansion_md":"### 动词辨析：take, bring, carry, fetch\n\n这组动词都与“带”或“拿”有关，但在方向和方式上有所区别，是小升初考试的常见考点。\n\n- **take (带走)**: 表示从说话人所在地“拿走”或“带走”到别处，方向是“离开”。例如：`Don't forget to take your umbrella when you leave.` (你离开时别忘了带伞。)\n- **bring (带来)**: 表示从别处“拿来”或“带来”到说话人所在地，方向是“靠近”。例如：`Please bring me a cup of tea.` (请给我带杯茶来。)\n- **carry (携带, 搬运)**: 强调“负重”或“支撑”并移动某物，不特指方向。例如：`He was carrying a heavy box.` (他正扛着一个重箱子。)\n- **fetch (去取来)**: 表示“去某个地方，然后把某物或某人取回”，包含“一去一回”两个动作。例如：`Can you fetch the newspaper for me?` (你能帮我去取一下报纸吗？)\n\n在本题语境中，“take a prize”是一个固定搭配，意为“获奖”，等同于“win a prize”。","socratic_tracks":[{"title":"词义辨析：take vs. bring","steps":[{"question":"我们常说的 `bring` 和 `take` 最主要的区别是什么？","hint":"想一想它们表示的动作方向，一个是“来”，一个是“去”。","takeaway":"`bring` 表示“带来”，朝向说话者；`take` 表示“带走”，远离说话者。"},{"question":"在这道题里，奖品现在在哪里？主人公希望它去哪里？","hint":"奖品在比赛组织方那里，主人公希望通过比赛为班级赢得它。","takeaway":"主人公需要去赛场“拿走”奖品，然后“带回”班级。"},{"question":"虽然 `bring` 也有“带来”的意思，但在比赛语境中，表示“赢得奖项”有没有更固定的说法？","hint":"想想我们说“他得了一等奖”时，英语里最常用的动词是什么。","takeaway":"在竞赛中，“take a prize”是“赢得奖项”的地道固定搭配。"}]},{"title":"语境逻辑分析","steps":[{"question":"根据上下文，主人公说“I want to __ the first prize for my class”时，他最想表达的核心意思是“搬运”奖杯，还是“赢得”比赛？","hint":"他正在参加一场比赛，目标是为班级争光。","takeaway":"他想表达的核心意思是“赢得”比赛和奖项。"},{"question":"那么，在 A, B, C, D 四个选项中，哪个动词含有“赢得、获得”的意思？","hint":"查阅字典可以发现，`take` 除了“拿走”，还有“获得、赢得（奖项）”的含义。","takeaway":"动词 `take` 在特定语境下可以表示“赢得”。"}]},{"title":"固定搭配的力量","steps":[{"question":"在英语中，当我们谈论在比赛或抽奖中获得奖品时，除了 `win a prize`，还有什么常见的说法吗？","hint":"这个说法在选项中出现了。","takeaway":"`take a prize` 是一个非常常见的固定搭配，意思就是 `win a prize`。"},{"question":"为什么学习固定搭配很重要？","hint":"它能让我们的语言听起来更像母语者，也更容易理解他们的表达。","takeaway":"掌握固定搭配能让我们的英语表达更准确、更地道。"}]}]}},{"number":"22","item_type":"cloze","context_note":"","stem":"They like it _____ and (23)_____ it every day.","options":{"A":"well","B":"very","C":"much","D":"very much"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查副词的用法。句意为“他们非常喜欢它”。修饰动词 `like` 并表示“非常”的程度，常用副词短语 `very much`。选项 B `very` 不能直接修饰动词；选项 C `much` 单独使用时常用于否定句和疑问句；选项 A `well` 意为“好地”，不符合句意。因此 `very much` 是最佳选项。","knowledge_expansion_md":"### 副词用法辨析：very, much, very much\n\n- **very**: 是程度副词，意为“很，非常”。它的核心功能是修饰**形容词**和**副词**的原级。\n  - 例如：`This book is very interesting.` (这本书非常有趣。) `He runs very fast.` (他跑得非常快。)\n  - **注意**：`very` 不能直接修饰动词。我们不能说 `I very like it.`\n\n- **much**: 意为“很，非常，……得多”。用法比较多样：\n  1.  修饰**动词**，常用于否定句和疑问句中。例如：`He doesn't talk much.` (他话不多。) `Do you miss her much?` (你很想她吗？)\n  2.  修饰**形容词或副词的比较级**。例如：`This is much better.` (这个好多了。)\n  3.  修饰某些具有形容词性质的过去分词，如 `much needed`, `much appreciated`。\n\n- **very much**: 是一个固定的副词短语，可以看作 `much` 的加强版。它的用法很灵活：\n  1.  修饰**动词**，在肯定句、否定句、疑问句中都非常常用。例如：`Thank you very much.` (非常感谢你。) `I like it very much.` (我非常喜欢它。)\n  2.  放在句末，加强整个句子的语气。","socratic_tracks":[{"title":"词性分析","steps":[{"question":"在这句话 `I thank them __.` 中，`thank` 是什么词性？","hint":"它是一个表示动作的词。","takeaway":"`thank` 在这里是动词，意为“感谢”。"},{"question":"我们想表达“非常”感谢，那么需要用什么词性的词来修饰动词 `thank` 呢？","hint":"修饰动词的词叫什么？","takeaway":"我们需要用副词或副词短语来修饰动词。"}]},{"title":"副词用法：very vs. much","steps":[{"question":"我们能说 `I very like English.` 吗？为什么？","hint":"想一想 `very` 通常跟在什么词前面，比如 `very good`, `very fast`。","takeaway":"不能，因为 `very` 是程度副词，通常修饰形容词和副词，不能直接修饰动词。"},{"question":"那 `much` 可以修饰动词吗？比如 `I like English much.` 这句话听起来自然吗？","hint":"`much` 修饰动词在肯定句中比较少见，通常用在什么类型的句子里？","takeaway":"`much` 可以修饰动词，但常用于否定句和疑问句；在肯定句中，我们更倾向于使用 `very much`。"},{"question":"所以，结合 `very` 和 `much` 的用法，哪个选项是修饰动词 `thank` 的最佳选择？","hint":"哪个短语既可以修饰动词，又在肯定句中非常常用？","takeaway":"`very much` 是修饰动词、表达“非常”之意的标准用法。"}]},{"title":"常用表达","steps":[{"question":"当你得到别人的帮助，想要表达强烈的感谢时，你会怎么说？","hint":"除了 `Thank you.`，你还会加上什么词来加强语气？","takeaway":"我们通常会说 `Thank you very much.`。"},{"question":"这个常用的表达 `Thank you very much.` 告诉我们，`very much` 可以用来做什么？","hint":"它在句子中起到了什么作用？","takeaway":"它告诉我们 `very much` 这个短语可以用来修饰感谢的动作，表达“非常”的程度。"}]}]}},{"number":"23","item_type":"cloze","context_note":"","stem":"They like it (22)_____ and _____ it every day.","options":{"A":"look","B":"watch","C":"have a look","D":"have a look at"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词词义辨析。句意为“他们非常喜欢它，并且每天都观看它”。`watch` 意为“观看，注视”，常指观看活动的或变化的事物，符合语境中孩子们每天观察笼中鸟的情景。`watch` 是及物动词，可以直接跟宾语 `it`。选项 A `look` 和 C `have a look` 是不及物动词/短语，后面需要加 `at` 才能接宾语。选项 D `have a look at` 意为“看一看”，但 `watch` 更强调持续性的观看，更符合 `every day` 的语境。","knowledge_expansion_md":"### “看”的动词家族：look, see, watch, have a look at\n\n这几个词都与“看”有关，但含义和用法有细微差别。\n\n- **look**: 强调“看”这个动作本身，是有意识地把目光投向某个方向。它是不及物动词，如果要表明看的对象，必须加介词 `at`。\n  - `look at the picture.` (看这幅画。)\n  - 相关的动词短语：`look for` (寻找), `look after` (照顾), `look up` (查阅)。\n\n- **see**: 强调“看见”这个结果，即视觉上感知到某物存在。它通常是及物动词。\n  - `I looked, but I saw nothing.` (我看了，但什么也没看见。)\n\n- **watch**: 强调在一段时间内“注视、观察”，对象通常是活动的、变化的。它是及物动词。\n  - `watch TV`, `watch a football game` (看电视，看足球赛)。\n\n- **have a look at**: 这是一个固定短语，相当于 `look at`，但语气更随意、口语化，意为“看一看”。\n  - `Let's have a look at your new car.` (让我们看看你的新车吧。)","socratic_tracks":[{"title":"动词用法：及物与不及物","steps":[{"question":"我们能说 “Let's look the basketball court” 吗？如果不能，是为什么？","hint":"“look”这个词后面可以直接跟上“看的对象”吗？还是需要一个“小帮手”？","takeaway":"不能，因为 `look` 是不及物动词，后面跟宾语时必须加上介词 `at`。"},{"question":"那么选项 A `look` 和 C `have a look` 为什么不对？","hint":"`have a look` 和 `look` 在这一点上的用法是相同的。","takeaway":"因为它们后面都缺少了连接宾语 `the basketball court` 所必需的介词 `at`。"}]},{"title":"近义词辨析：look vs. watch","steps":[{"question":"“看照片”和“看电影”，你觉得用 `look at` 和 `watch` 分别对应哪个更合适？为什么？","hint":"照片是静止的，电影是动态的，并且会持续一段时间。","takeaway":"`look at` 适合看静止的东西，而 `watch` 适合观看持续一段时间的、动态的活动。"},{"question":"在这道题里，作者是想让读者“长时间盯着”球场，还是只是“把目光转过去看一眼”？","hint":"比赛还没开始，作者只是在转换场景，介绍环境。","takeaway":"作者只是想引导读者“看一看”球场这个地方，而不是长时间观察上面的活动。"},{"question":"因此，在 `watch` 和 `have a look at` 之间，哪个更符合这种“扫一眼、看一看”的语境？","hint":"`have a look at` 语气更随意，更侧重于“看”这个动作本身。","takeaway":"`have a look at` 更符合“让我们看看球场吧”这种引导注意力的语境。"}]},{"title":"固定短语结构","steps":[{"question":"在 `Let's ...` 这个句型后面，应该跟动词的什么形式？","hint":"例如：`Let's go.` `Let's play.`","takeaway":"`Let's` 后面应该跟动词原形。"},{"question":"选项 D `have a look at` 是一个短语，它的核心动词是什么？是原形吗？","hint":"这个短语的第一个词是什么？","takeaway":"核心动词是 `have`，是原形，所以 `Let's have a look at...` 在结构上是完全正确的。"}]}]}},{"number":"24","item_type":"cloze","context_note":"","stem":"A cat sees the bird and wants _____ her supper.","options":{"A":"have it for","B":"has it for","C":"to have it for","D":"to has it for"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查非谓语动词中的动词不定式。句子的主干是 `A cat ... wants ...`，动词 `want` 后面如果跟另一个动词作宾语，必须使用不定式形式，即 `want to do something`（想要做某事）。这里猫“想要把它当作晚餐”，所以是 `wants to have it for her supper`。选项中，只有 C `to have it for` 符合 `to + 动词原形` 的结构。选项 A 和 B 缺少 `to`；选项 D 中 `has` 不是动词原形，是错误的。","knowledge_expansion_md":"### 动词不定式作宾语：`want to do something`\n\n在英语中，当一个动词后面需要跟另一个动词来表达更完整的意义时，后面的动词需要变成非谓语动词形式，常见的是动词不定式（to do）和动名词（doing）。\n\n**`want` 后面必须跟动词不定式（to do）作宾语**，表示“想要做某事”。这是一个非常重要且基础的语法规则。\n\n**结构**: `主语 + want + to + 动词原形 + (其他)`\n\n**常见的跟不定式作宾语的动词还有**：\n- `hope to do` (希望做某事)\n- `plan to do` (计划做某事)\n- `decide to do` (决定做某事)\n- `need to do` (需要做某事)\n- `learn to do` (学习做某事)\n- `try to do` (尽力做某事)\n- `agree to do` (同意做某事)\n\n**易错点**：\n1.  忘记加 `to`，例如：`I want go home.` (错误)\n2.  `to` 后面用了非原形动词，例如：`He wants to goes home.` (错误) 或 `She wants to going home.` (错误)\n\n无论主语是第几人称，`to` 后面永远跟动词原形。例如：`I want to have...`, `He wants to have...`","socratic_tracks":[{"title":"动词搭配规则","steps":[{"question":"当你想表达“想要做某事”时，在动词 `want` 后面，我们通常会加上另一个动词，这个动词需要变成什么形式？","hint":"回想一下“我想回家”用英语怎么说：`I want ___ go home.` 空格里需要填什么？","takeaway":"动词 `want` 后面跟另一个动作时，需要使用 `to do` 的形式，即动词不定式。"},{"question":"根据这个规则，我们可以首先排除哪些选项？","hint":"哪些选项不符合 `to do` 的结构？","takeaway":"选项 A 和 B 没有 `to`，所以可以首先排除。"}]},{"title":"不定式结构","steps":[{"question":"我们已经知道需要用 `to do` 的形式。那么，不定式中的 `do` 指的是动词的哪一种形式？","hint":"是 `go`, `goes`, `went`, `going` 中的哪一个？","takeaway":"不定式 `to do` 中的 `do` 必须是动词的原形。"},{"question":"动词 `have` 的原形是什么？它的第三人称单数形式又是什么？","hint":"当主语是 `He/She/It` 时，我们用哪个形式？","takeaway":"`have` 的原形是 `have`，第三人称单数形式是 `has`。"},{"question":"那么，在剩下的 C 和 D 两个选项中，哪个符合 `to + 动词原形` 的规则？","hint":"比较 `to have` 和 `to has`。","takeaway":"只有 `to have` 符合不定式的构成规则，所以选项 C 是正确的形式。"}]},{"title":"排除法解题","steps":[{"question":"我们来看看这道题的句子 `I want __ supper...` 和选项。即使选项 C `to have it for` 看起来有点奇怪，我们为什么仍然能确定它是答案？","hint":"从语法结构的角度思考，而不是句子的最终意思。","takeaway":"因为只有选项 C 的动词形式 `to have` 满足 `want to do` 这一核心语法规则。"},{"question":"这告诉我们在做选择题时，当遇到看似不完美的选项时，应该怎么做？","hint":"比较所有选项，选择语法上最正确或最合适的一个。","takeaway":"在考试中，应优先选择语法结构正确的选项，即使它带有一些可能造成语义困惑的附加词。"}]}]}},{"number":"25","item_type":"cloze","context_note":"","stem":"_____ the bird is in the cage. She can't catch it.","options":{"A":"But","B":"And","C":"So","D":"Then"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查连词的用法和上下文逻辑关系。前文提到“猫看见了鸟，想把它当晚餐”，表达了猫的意图。后文“鸟在笼子里，她抓不到它”描述了一个与猫的意图相反的、受阻碍的现实情况。因此，这里需要一个表示转折关系的连词。选项 A `But` (但是) 表示转折，符合语境。选项 B `And` (并且) 表并列，C `So` (所以) 表因果，D `Then` (然后) 表顺承，均不符合此处的逻辑。","knowledge_expansion_md":"在英语中，连词是连接单词、短语或句子的重要词类。小升初阶段需要重点掌握以下四种逻辑关系的连词：\n1.  **并列关系 (And)**：用于连接两个或多个在语法上或逻辑上对等的部分。例如：He likes reading and swimming.\n2.  **转折关系 (But)**：用于连接两个意思相反或相对的部分。例如：She is very tired, but she can't sleep.\n3.  **因果关系 (So)**：用于引出结果，“所以”。例如：It's late, so we must go home.\n4.  **选择关系 (Or)**：用于提供两种或多种选择，“或者”。例如：Would you like tea or coffee?","socratic_tracks":[{"title":"句子逻辑分析","steps":[{"question":"我们来分析一下空格前后的两句话。第一句“它努力扇动翅膀”和第二句“它仍然掉到了地上”，这两件事之间是什么关系？","hint":"想一想，努力扇动翅膀通常期望的结果是什么？是飞起来还是掉下去？","takeaway":"努力扇动翅膀（原因）却导致了掉在地上（意外结果），这是一种事与愿违的转折关系。"},{"question":"在 A, B, C, D 四个选项中，哪一个词是专门用来表达“但是”、“可是”这种转折意思的？","hint":"试着用中文“并且”、“所以”、“然后”、“但是”分别代入句子，看哪个最通顺。","takeaway":"连词 “But” 用于连接两个意思相反或相对的句子，表示转折关系。"}]},{"title":"排除法应用","steps":[{"question":"我们试试用“So”（所以）。“因为它努力扇动翅膀，所以它掉到了地上。”这个逻辑说得通吗？","hint":"“So”表示因果关系，努力扇翅膀应该是飞起来的原因，而不是掉下去的原因。","takeaway":"这里的因果逻辑不成立，因此排除 “So”。"},{"question":"再试试用“And”（并且）。“它努力扇动翅膀，并且它掉到了地上。” 这两件事是平等的、并列的吗？","hint":"“And”通常连接两个相似或连续的动作，比如“他又唱又跳”。但这里的两件事有强烈的反差。","takeaway":"前后两句存在明显的反差，而非简单的并列，因此排除 “And”。"},{"question":"最后看“Then”（然后）。它表示动作的先后顺序，用在这里可以吗？","hint":"虽然时间上是先扇翅膀后掉下来，但这句话更想强调的是努力和失败之间的矛盾，而不仅仅是时间顺序。","takeaway":"“Then”只强调了时间顺序，却忽略了最重要的逻辑转折，因此“But”是最佳选项。"}]},{"title":"连词功能辨析","steps":[{"question":"请分别说出 And, But, So, Or 这四个词最基本的意思和用法。","hint":"可以分别用它们造一个简单的句子，比如：我喜欢苹果__香蕉。我很累__我不想睡。","takeaway":"And (和，并列), But (但是，转折), So (所以，因果), Or (或者，选择) 是四个功能完全不同的连词。"},{"question":"在写故事或描述一件事情时，如果想让情节出现意想不到的变化，你会倾向于使用哪个连词？","hint":"哪个词能制造出“然而”、“可是”的戏剧效果？","takeaway":"“But” 是制造情节转折、表达意料之外情况的常用词，能增强故事的吸引力。"}]}]}},{"number":"26","item_type":"cloze","context_note":"","stem":"26.","options":{"A":"angry","B":"sad","C":"glad","D":"tired"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考察根据上下文选择合适的形容词。根据上文，猫看到了鸟笼里的小鸟，想把它当晚餐，但因为它在笼子里，所以抓不到（She can't catch it）。因为无法得到想要的东西，猫的心情会很糟糕。选项中，B“sad”（伤心的，难过的）可以用来描述这种失望、不快的心情。A“angry”（生气的）也有可能，但在没有更激烈情节的情况下，“sad”更能表达一种无可奈何的沮丧感。C“glad”（高兴的）与事实相反。D“tired”（疲劳的）描述身体状态，与此处的情感语境不符。","knowledge_expansion_md":"在完形填空中，情感类形容词的辨析是一个常见考点。解题时，需要准确理解上下文所营造的氛围和主人公的遭遇。\n- `sad` (伤心的): 通常因坏消息、失败或失去而产生的情感。\n- `angry` (生气的): 通常因感到不公、被侵犯或事情出错而产生，情绪较为激烈。\n- `glad` (高兴的): 与 `happy` 类似，通常因好消息、成功或得到满足而产生。\n- `tired` (疲劳的): 描述身体或精神上的疲惫感，是一种状态而非纯粹的情感。\n- `excited` (兴奋的): 情绪高涨，通常对即将发生的好事充满期待。\n- `worried` (担心的): 对可能发生的不好的事情感到不安。\n在做题时，要区分是描述身体状态还是心理情感，并结合具体情境做出最佳选择。","socratic_tracks":[{"title":"角色情感推断","steps":[{"question":"上一句话说，猫想吃小鸟，但是结果怎么样了？","hint":"原文是“She can't catch it.”","takeaway":"猫没有抓到它想吃的鸟。"},{"question":"当你非常想得到一个东西，但就是得不到时，你会有什么感觉？","hint":"是高兴，还是不高兴？","takeaway":"通常会感到不高兴、失望或沮丧。"},{"question":"在四个选项中，哪个词最适合描述这种失望、难过的心情？","hint":"A. 生气的, B. 伤心的, C. 高兴的, D. 疲劳的。","takeaway":"“sad”（伤心的）符合猫因愿望落空而感到沮丧的情境。"}]}]}},{"number":"27","item_type":"cloze","context_note":"","stem":"(27)_____ she wants to catch it. But the bird flies away.","options":{"A":"but","B":"and","C":"so","D":"or"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查并列连词 **and** 表示**顺承、追加一层动作或意图**。\n\n前文写到猫打开了鸟笼的门；本句 **..., she opens the door of the cage, (27)_____ she wants to catch it.** 空格位于逗号之后，连接与前一分句并列的另一层意思：开门之后，**她还想抓住小鸟**。填入 **and** 后意为：“有一天，她打开了鸟笼的门，**并且还想抓住小鸟**。”语义连贯：开门不是放了小鸟，而是为进一步抓捕创造条件。\n\n后一句 **But the bird flies away.** 用 **But** 引出转折——“可是小鸟飞走了”，与前文的企图形成对照。\n\n选项 **A. but** 若放在逗号后直接接 *she wants...*，更多表示与前文的对比而非并列追加，与本句“开门 → 仍想抓鸟”的顺承关系不如 **and** 贴切。**C. so** 强调因果（因此），**D. or** 表示选择，均不符合语境。","knowledge_expansion_md":"### 并列连词 and / but / so / or（完形常见）\n\n- **and**：表示**并列或顺承**，前后信息同属一层意思或按顺序追加。例：`She opened the door, and she called his name.`（她打开门，叫他的名字。）\n- **but**：表示**转折**，前后形成对照或出乎意料。例：`She opened the door, but the room was empty.`\n- **so**：表示**结果**（所以）。例：`It was late, so we left.`\n- **or**：表示**选择**。例：`Stay or go?\n\n**第27题**：空格处用 **and**，连接“打开门”与“还想抓住小鸟”，表示顺承、追加一层意图；下一句 **But the bird flies away.** 再用 **but** 交代转折。","socratic_tracks":[]}},{"number":"28","item_type":"cloze","context_note":"","stem":"28.","options":{"A":"can to fly","B":"can fly","C":"can't to fly","D":"can't fly"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考察情态动词“can”的用法。首先，从语法上，情态动词后必须跟动词原形，不能带“to”，所以A和C选项错误。其次，从故事情节来看，前一句说“But the bird flies away”（但是小鸟飞走了）。猫没能抓住小鸟，是因为猫不具备飞行的能力。因此，应该选择表示“不能飞”的D选项“can't fly”。B选项“can fly”（能飞）与常识和故事情节都相悖。","knowledge_expansion_md":"情态动词 (Modal Verbs) 是小升初英语语法的核心考点之一，必须牢记其基本规则：\n1.  **基本结构**：`主语 + 情态动词 + 动词原形`。例如：`I can swim.` `He should study.`\n2.  **无人称变化**：情态动词本身不因主语是第三人称单数而变化。错误：`He cans swim.` 正确：`He can swim.`\n3.  **否定形式**：直接在情态动词后加 `not`。例如：`cannot` (可缩写为 `can't`), `should not` (可缩写为 `shouldn't`)。\n4.  **疑问句形式**：将情态动词提到主语前面。例如：`Can you help me?` `Must I finish it today?`\n**易错点**：最大的易错点就是在情态动词后误加 `to`，或者忘记使用动词原形。一定要记住“情态动词后动词打回原形，不带to”这个口诀。","socratic_tracks":[{"title":"语法与逻辑双重判断","steps":[{"question":"情态动词（比如 can, must, should）后面跟的动词是什么形式？能带 to 吗？","hint":"我们说“I can swim.”，不说“I can to swim.”","takeaway":"情态动词后跟动词原形，不带 to。因此可以排除 A 和 C。"},{"question":"故事里，小鸟飞走了。猫为什么追不上飞走的小鸟？","hint":"猫有翅膀吗？它会飞吗？","takeaway":"因
