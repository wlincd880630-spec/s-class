为猫不会飞。"},{"question":"所以，在剩下的 B 'can fly' 和 D 'can't fly' 中，应该选哪个来描述猫的能力？","hint":"“不会飞”用英语怎么说？","takeaway":"应该选择 D 'can't fly'，既符合语法也符合故事逻辑。"}]}]}},{"number":"29","item_type":"cloze","context_note":"","stem":"29.","options":{"A":"no way","B":"some way","C":"any way","D":"not way"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题考查特定语境下不定代词的用法。根据四个选项分析，`not way` 语法错误，首先排除。`some way` 通常用于肯定句，`any way` 常用于否定句和疑问句。`no way` 意为“没办法，绝不可能”，可以独立使用或用于句子中加强否定语气。在故事性的完形填空中，角色常会陷入“毫无办法”的困境，因此 `no way` 符合常见故事情节的逻辑，表示“没有办法（做某事）”。","knowledge_expansion_md":"### `some`, `any`, `no` 的用法辨析\n\n1.  **`some` (一些)**: 通常用于**肯定句**中。\n    *   例: `I need some help.` (我需要一些帮助。)\n    *   特例: 在表示**请求、建议**或**期望得到肯定回答**的疑问句中，也可用 `some`。\n        *   例: `Would you like some coffee?` (你想来点咖啡吗？)\n\n2.  **`any` (任何)**: 通常用于**否定句**和**疑问句**中。\n    *   例: `I don't have any questions.` (我没有任何问题。)\n    *   例: `Do you have any brothers?` (你有兄弟吗？)\n\n3.  **`no` (没有)**: 相当于 `not a` 或 `not any`，本身带有否定意义，因此句子中不能再使用 `not` 等否定词。\n    *   例: `There is no water in the bottle.` = `There isn't any water in the bottle.` (瓶子里没有水了。)\n\n4.  **`no way`**: 既可以作为固定短语，表示“绝不，不可能”，也可以在句子中作 `no` + `way` 的结构，表示“没有方法”。\n    *   例: `— Can I borrow your car? — No way!` (“我能借你的车吗？”“门儿都没有！”)\n    *   例: `There was no way to open the door.` (没有办法打开那扇门。)","socratic_tracks":[{"title":"some, any, no 的用法","steps":[{"question":"我们通常在什么样的句子里用 `some`？在什么样的句子里用 `any`？","hint":"回忆一下这两个句子：`I have some apples.` 和 `I don't have any apples.`","takeaway":"`some` 通常用于肯定句，而 `any` 通常用于否定句和疑问句。"},{"question":"`no` 和 `not any` 有什么关系？比如 `I have no money` 和 `I don't have any money`。","hint":"比较一下这两个句子的意思是否相同？一个句子中能同时出现 `not` 和 `no` 吗？","takeaway":"`no` 本身就含有否定意义，相当于 `not a` 或 `not any`，所以用了 `no` 的句子动词要用肯定形式。"}]},{"title":"固定搭配 “no way”","steps":[{"question":"当你的朋友告诉你一个非常令人惊讶的消息时，你可能会脱口而出哪个词组来表示“不可能吧！”？","hint":"这个词组由两个很简单的单词组成，表示强烈的怀疑或拒绝。","takeaway":"“No way!” 是一个常用的口语表达，意思是“不可能！”或“门儿都没有！”"},{"question":"在 `There is no way to do something.` 这个句型中，`no way` 是什么意思？","hint":"比如：`There is no way to fly without wings.` (没有翅膀...飞行)","takeaway":"`There is no way to do something` 意味着“没有办法做某事”或“做某事是不可能的”。"}]},{"title":"语境与逻辑推断","steps":[{"question":"我们先看四个选项，有没有哪个在语法上本身就是错误的？","hint":"我们常说 `not a problem`，但会说 `not way` 吗？","takeaway":"我们可以先排除语法错误的选项，比如 `not way` 是不正确的表达。"},{"question":"在讲故事的时候，主角是不是经常会遇到一些困难，甚至感觉走投无路了？","hint":"想一想英雄电影里的情节，主角总是一帆风顺吗？","takeaway":"故事中常有“毫无办法”或“陷入绝境”的情节，因此 `no way` 是叙事中非常常见的表达。"}]}]}},{"number":"30","item_type":"cloze","context_note":"","stem":"30.","options":{"A":"come back to home","B":"come back home","C":"come to home","D":"back home"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查副词 `home` 的用法。当 `home` 作“到家，回家”讲时，它是一个地点副词，前面不需要加介词 `to`。`come back` 意为“回来”，所以“回到家”正确的表达是 `come back home`。选项 A `come back to home` 和 C `come to home` 中的 `to` 是多余的，因此是错误的。选项 D `back home` 意为“回到家里”，但它不是一个完整的动词短语，通常需要和 `go`, `be` 等动词连用，而 `come back home` 本身就是一个完整的动作表达。","knowledge_expansion_md":"### `home` 的词性与用法\n\n`home` 是一个特殊的词，既可以作名词，也可以作副词。\n\n1.  **作副词**: 表示“到家，在家”，此时它前面**不能**加 `to`, `at` 等介词。\n    *   常见的动词搭配有：`go home` (回家), `come home` (回家), `get home` (到家), `arrive home` (到家), `stay home` (待在家)。\n    *   例: `What time did you get home last night?` (你昨晚几点到家的？)\n    *   与 `home` 用法类似的副词还有 `here` (这里), `there` (那里), `upstairs` (楼上), `downtown` (市中心), `abroad` (国外) 等。\n        *   例: `Let's go there.` (我们去那里吧。) `He went abroad.` (他出国了。)\n\n2.  **作名词**: 表示“家，住宅，家庭”，此时可以和介词搭配使用，前面也常有物主代词 (`my`, `his`) 或冠词 (`a`, `the`) 修饰。\n    *   例: `This is my home.` (这是我的家。)\n    *   例: `He is at home now.` (他现在在家。) (注意：`at home` 是固定搭配)\n    *   例: `Welcome to our home!` (欢迎来到我们家！)","socratic_tracks":[{"title":"副词 `home` 的用法","steps":[{"question":"我们说“去学校”是 `go to school`，为什么说“回家”却是 `go home`，没有 `to` 呢？","hint":"想一想 `here` (这里) 和 `there` (那里) 这两个词，我们说 `come here` 还是 `come to here`？","takeaway":"因为 `home` 在这里作副词，表示“到家里”，副词前通常不加介词 `to`。"},{"question":"除了 `home`, `here`, `there`，你还能想到其他类似的表示地点的副词吗？","hint":"比如“去楼上”、“去国外”怎么说？","takeaway":"还有 `upstairs`, `downstairs`, `downtown`, `abroad` 等词作副词时，前面也不加 `to`。"}]},{"title":"`home` 的词性辨析","steps":[{"question":"`My home is big.` 和 `Let's go home.` 这两个句子里的 `home` 词性一样吗？","hint":"第一个句子中，`home` 前面有 `my`，它在句子里作什么成分？第二个句子中，`home` 修饰动词 `go`，它又作什么成分？","takeaway":"在 `My home is big` 中，`home` 是名词，意为“家”；在 `Let's go home` 中，`home` 是副词，意为“到家里”。"},{"question":"那什么时候 `home` 前面可以加 `to` 呢？比如 `Welcome to our home.` 这句话为什么是对的？","hint":"在这句话里，`home` 是名词还是副词？它前面有什么词？","takeaway":"当 `home` 作名词，并且前面有 `my`, `his` 等限定词时，它指代一个具体的“住宅”，这时可以根据动词需要搭配介词。"}]},{"title":"动词短语辨析","steps":[{"question":"`come back` 是什么意思？`back home` 又是什么意思？","hint":"`come back` 是一个动作，`back home` 描述的是一个地点或状态。","takeaway":"`come back` 是动词短语，意为“回来”；`back home` 是副词短语，意为“在家里”或“回到家里”。"},{"question":"为什么 `come back home` 是最佳选项，而单独的 `back home` 不是？","hint":"一个完整的句子需要动词。看看选项，哪个提供了一个完整的动作？","takeaway":"`come back home` 包含了一个完整的动作（回来）和方向（到家），构成了一个意思清晰的谓语部分。"}]}]}}]},{"section_title":"四、阅读理解。(共18分)","section_instruction":"A\nAn old tiger lives in the forest. He doesn't want to look for food now. He often tells other animals to get him something to eat.\nHe sees a monkey and says, \"I'm hungry, Monkey. Go to the village and get me a fat pig.\"\n\"Oh, Tiger,\" says the monkey, \"I can't do that now. There is another tiger over there. He also wants a fat pig. He will not let me get anything for you to eat. I am afraid of him.\"\n\"What?\" cries the old tiger. \"Show me that tiger. I will eat him.\"\n\"Come with me,\" says the monkey.\nThe monkey and the tiger get to the bridge over the river. \"Now look down at the water,\" says the monkey. \"Do you see it? The tiger?\"\n\"Yes, I do,\" cries the old tiger. \"I will eat him up!\" With these words, the tiger jumps into the river.","items":[{"number":"31","item_type":"reading","context_note":"Passage A","stem":"How many tigers and monkeys are there in the story?","options":{"A":"Two tigers and one monkey.","B":"Two tigers and two monkeys.","C":"Only one tiger and one monkey.","D":"Two monkeys and one tiger."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节理解题。根据故事情节，故事中只有一只老老虎和一只猴子。猴子为了欺骗老虎，让他看水中的倒影，并谎称水里有“另一只老虎”。但这只“老虎”只是倒影，并非真实存在的动物。因此，故事中实际只有一只老虎和一只猴子。","knowledge_expansion_md":"### 阅读理解技巧：推断题 (Inference)\n\n推断题要求读者根据文章中给出的信息，推断出作者没有直接说明的事实、含义或结论。这类题目的答案无法在原文中直接找到原话。\n\n1.  **寻找线索**：仔细阅读与问题相关的句子，甚至上下文的其他题目，寻找暗示性的词语和信息。\n2.  **结合常识**：将文中的线索与自己的背景知识和生活常识（如寓言故事的常见模式）相结合。\n3.  **逻辑推理**：基于线索和常识，进行合理的逻辑推理。例如，从“看水中倒影”推断出“第二只老虎”是不存在的。\n4.  **区分事实与观点**：注意区分文章的客观事实（故事里有几只动物）和角色的主观想法（老虎认为有几只老虎）。题目通常问的是客观事实。\n\n**常见寓言模式**：很多寓言故事都遵循“以智取胜”的模式，即一个体型小或力量弱的角色（如猴子、兔子、狐狸）通过智慧战胜一个强大但愚笨的角色（如老虎、狮子、狼）。了解这一模式有助于快速把握故事核心。","socratic_tracks":[{"title":"识别关键信息","steps":[{"question":"这种 `How many...?` 的问题，在阅读时应该寻找什么样的词？","hint":"比如，文章中会不会直接写 `There was one tiger and one monkey.`？或者有没有提到数字的词？","takeaway":"要快速定位文中的数字（one, two, three...）和与问题相关的名词（tigers, monkeys）。"},{"question":"如果文章没有直接说出数量，我们该怎么办？","hint":"我们可以根据故事情节来推断。想一想，一个角色和他的“倒影”互动，那一共是几个角色？","takeaway":"当直接信息缺失时，需要根据上下文和情节发展进行逻辑推理。"}]},{"title":"寓言故事结构","steps":[{"question":"在很多关于动物的寓言故事里，猴子通常扮演什么样的角色？老虎呢？","hint":"想想《猴子捞月》的故事，猴子聪明吗？老虎在故事里通常是“山中之王”，有什么特点？","takeaway":"猴子通常是聪明、机智的象征，而老虎则代表着强大但有时会显得愚笨或傲慢。"},{"question":"知道了这种典型的角色设定，对我们理解一个“猴子与老虎”的故事有什么帮助？","hint":"一个聪明的主角和一个强大的对手，这通常是一个“以弱胜强”的故事。这种故事需要很多角色吗？","takeaway":"这种“一对一”的斗智斗勇结构，暗示了故事的核心角色可能就是一只猴子和一只老虎。"}]},{"title":"排除干扰选项","steps":[{"question":"让我们看看选项 A `Two tigers and one monkey`。为什么这个选项很有迷惑性？","hint":"结合我们推测的“老虎看倒影”的情节，老虎自己看到了什么？","takeaway":"因为如果老虎在水中看到了自己的倒影，他会误以为有“两只老虎”，这可能成为一个干扰项。"},{"question":"那么，我们如何确定正确答案是“一只”而不是“两只”老虎呢？","hint":"问题问的是故事里“有”多少动物，而不是某个角色“以为”有多少动物。","takeaway":"解答阅读题时，必须区分客观事实和角色主观认知，题目问的是故事的客观角色数量。"}]}]}},{"number":"32","item_type":"reading","context_note":"Passage A","stem":"Why does the tiger tell the other animals to get him food? Because _____.","options":{"A":"only they can look for some food","B":"he is old and they are afraid of him","C":"he gets to the bridge with the tiger","D":"he tells the tiger to jump into the water"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道因果关系题。根据文章第一句“An old tiger lives in the forest. He doesn't want to look for food now.”，可知老虎“老了”，不想自己找食物。他能命令猴子，说明他很强大，动物们都怕他。因此，选项B“他老了，并且动物们都怕他”是老虎让其他动物为他找食物的完整原因。选项A不合逻辑；选项C和D是故事的后续情节，与问题无关。","knowledge_expansion_md":"### 阅读理解技巧：因果关系题\n\n这类题目主要考察对文章中事件之间逻辑关系的理解，常见提问词为 `Why`, `What is the reason for...?`, `Because of...`。\n\n**解题步骤**：\n1.  **定位问题**：在原文中找到题目所询问的事件或行为（如“老虎让其他动物找食物”）。\n2.  **寻找原因**：在该事件的上下文寻找表示原因的信号词，如 `because`, `since`, `as`, `for` 等。有时原因并没有明确的信号词，需要通过上下文逻辑来判断。\n3.  **分析选项**：\n    *   **匹配原因**：判断哪个选项与原文中找到的原因一致或含义相近。\n    *   **排除干扰项**：\n        *   **答非所问**：选项是原文内容，但回答的不是题目所问的问题（如用结果回答原因）。\n        *   **逻辑错误**：选项内容与常识或文章逻辑相悖。\n        *   **事实错误**：选项内容与原文信息不符。\n\n在本题中，即使没有原文，也可以通过逻辑分析各个选项的合理性，从而选出最佳答案。","socratic_tracks":[{"title":"理解因果关系","steps":[{"question":"这个问题以 `Why` 开头，它在问什么？","hint":"`Why are you late?` `Because I missed the bus.` 这个对话给了你什么启发？","takeaway":"`Why` 问的是原因，所以答案必须是一个能够解释某个行为或事件为什么会发生的理由。"},{"question":"让我们看看选项 C 和 D。它们是在解释“为什么老虎让别人找食物”，还是在描述故事里发生的另外一件事？","hint":"`he gets to the bridge` (他到了桥上) 和 `he tells the tiger to jump` (他告诉老虎跳下去) 是原因还是事件？","takeaway":"选项 C 和 D 描述的是故事中的其他情节或事件，而不是老虎命令别人的“原因”。"}]},{"title":"分析角色动机","steps":[{"question":"想象一下，一个“森林之王”命令其他小动物给他找吃的，你觉得他可能是个什么样的国王？","hint":"他是勤劳的还是懒惰的？是善良的还是霸道的？","takeaway":"他很可能是一个霸道、有权势，甚至可能有点懒惰或年迈的统治者。"},{"question":"选项 B 提到了“他老了”和“动物们怕他”。这两点如何共同解释了他的行为？","hint":"“老了”会影响他自己做什么？“怕他”会影响小动物们怎么做？","takeaway":"“老了”是他需要别人帮助的动机，“怕他”是别人被迫帮助他的原因，两者结合构成了完整的逻辑链。"}]},{"title":"运用常识与逻辑","steps":[{"question":"让我们看选项 A: `only they can look for some food` (只有他们能找到食物)。你觉得这个说法符合常理吗？","hint":"老虎是食肉动物，以捕猎为生。它会比其他小动物更难找到食物吗？","takeaway":"不符合常理，老虎本身就是顶级的捕食者，所以这个原因是不成立的。"},{"question":"通过排除不合逻辑的选项 A 和描述无关事件的选项 C、D，我们能得到什么结论？","hint":"当三个选项都不合理或不相关时，剩下的那一个很可能就是正确答案。","takeaway":"在做阅读理解时，运用生活常识和逻辑推理来评估选项的合理性，是排除错误答案的有效方法。"}]}]}},{"number":"33","item_type":"reading","context_note":"Passage A","stem":"The monkey _____.","options":{"A":"goes to the village to get a pig","B":"knows there is another tiger","C":"gets to the bridge with the tiger","D":"tells the tiger to jump into the water"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节理解题，需要选出符合原文事实的描述。根据文章中的句子“The monkey and the tiger get to the bridge over the river.”，选项C是完全符合原文的正确陈述。选项A（去村里牵猪）和B（知道有另一只老虎）都与事实相反。选项D（告诉老虎跳进水里）在字面上是错误的，因为猴子只是让老虎“看水里”（look down at the water），是老虎自己决定跳下去的。因此，C是唯一准确无误的答案。","knowledge_expansion_md":"### 寓言故事中的角色分析与情节理解\n\n1.  **角色原型 (Character Archetypes)**：在寓言故事中，动物往往具有象征意义。猴子通常代表“机智”(clever/witty)，而老虎则常代表“凶猛”但“愚蠢”(fierce but foolish)。理解这些基本设定有助于快速把握故事主线。\n2.  **情节发展 (Plot Development)**：阅读时要注意故事的起因、经过、高潮和结局。本题的选项中，(C)是经过，(D)是导致结局的高潮部分。题目问“The monkey _____.”，通常考查主角最主要或最关键的动作。\n3.  **动词辨析**：选项中的动词 `goes`, `knows`, `gets`, `tells` 都是关键。`tells` 在这里不仅仅是“告诉”，更带有“唆使”、“命令”的意味，是推动情节的关键动作。\n4.  **排除法 (Process of Elimination)**：根据常识和故事逻辑，可以轻松排除A选项。B选项是解谜的关键，猴子知道水里*没有*另一只老虎，这正是它的计谋所在，所以B是错误的。在C和D之间，D是更核心、更具决定性的动作。","socratic_tracks":[{"title":"故事逻辑推理","steps":[{"question":"在寓言故事里，像猴子这样的小动物要战胜老虎这样的大动物，通常会依靠什么？","hint":"是依靠力量，还是依靠别的东西？","takeaway":"在寓言故事中，弱小角色往往依靠智慧而非力量来战胜强大的对手。"},{"question":"那么，这四个选项中，哪一个最能体现猴子运用了“智慧”或“计谋”？","hint":"想一想，“去村里牵猪”、“知道有另一只老虎”、“和老虎到桥上”、“叫老虎跳水”，哪个是计谋？","takeaway":"“告诉老虎跳进水里”是猴子实施计谋的关键步骤，最能体现其智慧。"}]},{"title":"选项细节辨析","steps":[{"question":"我们来看B选项：“猴子知道有另一只老虎”。如果水里真的有另一只老虎，这对猴子是好事还是坏事？","hint":"多一只老虎，猴子不是更危险了吗？","takeaway":"如果真的有另一只老虎，猴子的处境会更危险，这不符合它自救的逻辑。"},{"question":"所以，猴子是真的“知道有另一只老虎”，还是它在“假装”有另一只老虎来欺骗老虎？","hint":"水里出现的“老虎”其实是什么？","takeaway":"猴子是利用老虎水中的倒影，让老虎误以为有另一只老虎，所以B选项的表述是错误的。"},{"question":"既然是猴子设下的骗局，那么它的哪个行为是这个骗局的最后一步，并直接导致了老虎上当？","hint":"是把老虎带到桥上，还是唆使它采取行动？","takeaway":"唆使老虎跳入水中是猴子计谋的收尾动作，是整个计划的“临门一脚”。"}]},{"title":"关键动词分析","steps":[{"question":"请注意四个选项开头的动词：goes, knows, gets, tells。哪个动词最能表示一个角色对另一个角色施加影响？","hint":"哪个词语表达了“让别人做某事”的意思？","takeaway":"动词 `tell` (在这里是 `tells`) 常常用来表达一方让另一方做某事，具有很强的主动性和影响性。"},{"question":"在“猴子智取老虎”这个故事框架下，猴子最关键的动作是自己做什么，还是影响老虎做什么？","hint":"猴子的目标是让老虎自己“解决”自己。","takeaway":"猴子智慧的体现不在于它自己做了什么，而在于它成功地影响和操控了老虎的行为。"}]}]}},{"number":"34","item_type":"reading","context_note":"Passage A","stem":"Which of the following is RIGHT?","options":{"A":"The monkey eats up the tiger.","B":"The tiger eats up another tiger.","C":"The tiger jumps into the water.","D":"The tiger is clever."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考察对故事结局的判断。根据故事的最后一句话“With these words, the tiger jumps into the river.”，故事的直接结果就是老虎真的跳进了水里。选项A（猴子吃掉老虎）和B（老虎吃掉另一只老虎）都不符合常识和故事逻辑，水里并没有另一只老虎。选项D（老虎很聪明）与整个故事中老虎被轻易欺骗的行为完全相反。所以，唯一正确的事实陈述是C（老虎跳进了水里）。","knowledge_expansion_md":"### 阅读理解中的事实判断与因果关系\n\n1.  **事实判断题 (Factual Questions)**：这类题目要求从文中找出直接陈述或可以推断出的事实。做题的关键是“回归原文”，找到支持选项的证据。本题中，猴子告诉老虎跳水（原因），老虎的行动（结果）就是跳水。\n2.  **因果关系 (Cause and Effect)**：很多故事都是由一连串的因果链条构成的。上一个问题（3-3-2）问的是“因”（猴子的计谋），这个问题（3-3-3）问的是“果”（计谋导致的结果）。理解这种逻辑关系有助于快速定位答案。\n3.  **辨别“事实”与“想法”**：选项B“老虎吃掉另一只老虎”是老虎被骗时脑中的“想法”或“意图”，但不是客观发生的“事实”。阅读时要分清角色的主观认知和故事的客观现实。\n4.  **反向推理 (Reverse Reasoning)**：选项D“老虎很聪明”是一个评价。我们可以通过老虎在故事中的行为（被倒影欺骗）来判断这个评价是否正确。它的行为证明了它很“愚蠢”(foolish)，所以D是错误的。","socratic_tracks":[{"title":"因果逻辑链","steps":[{"question":"回顾上一题，猴子为了战胜老虎，对老虎说了什么？","hint":"猴子让老虎去做一件事情。","takeaway":"猴子告诉（唆使）老虎跳进水里。"},{"question":"故事里的老虎被描绘成一个怎样的角色，是聪明还是愚蠢？","hint":"它会被猴子轻易欺骗吗？","takeaway":"故事里的老虎是强大但愚蠢的，容易上当。"},{"question":"那么，一个愚蠢的老虎听到猴子让它跳水攻击“另一个老虎”后，最可能发生什么？","hint":"它会听从猴子的“建议”吗？","takeaway":"愚蠢的老虎会相信猴子的话，并真的跳进水里，这正是故事的高潮和结果。"}]},{"title":"排除干扰选项","steps":[{"question":"我们来看选项A“猴子吃掉了老虎”。从体型和力量上看，这可能发生吗？","hint":"寓言故事虽然有想象成分，但也遵循一定的基本逻辑。","takeaway":"猴子吃掉老虎不符合生物常识，在寓言中也极不合理，可以首先排除。"},{"question":"再看选项B“老虎吃掉了另一只老虎”。水里真的有“另一只老虎”吗？","hint":"猴子利用的是什么？","takeaway":"水里只有老虎的倒影，所以老虎不可能吃掉一个真实存在的老虎。"},{"question":"最后看选项D“老虎很聪明”。如果老虎很聪明，它会被一个简单的倒影骗到吗？","hint":"聪明的人或动物会怎么做？","takeaway":"老虎的行为恰恰证明了它不聪明，所以D是错误的。"}]},{"title":"寻找事实陈述","steps":[{"question":"这道题要求我们选出“RIGHT”（正确的）一项。这意味着我们要找一个在故事中真实发生过的事件。","hint":"选项A、B、D都存在逻辑或事实上的问题。","takeaway":"做事实判断题时，要区分什么是角色的想法、什么是作者的评价、什么是真实发生的动作。"},{"question":"在猴子的计谋成功后，哪个动作是必然发生的？","hint":"老虎上当了，它会怎么做？","takeaway":"老虎跳入水中是猴子计谋成功的直接体现，是故事中确凿发生的事实。"}]}]}}]},{"section_title":"","section_instruction":"B\nMrs Green is going to give a birthday party to Mary. Mary is her daughter. She will be ten years old. A lot of her friends are coming to the party. Twenty of them are girls.\nMrs Green is getting ready for the party. Mrs White is helping her.\n\"That's a big nice cake,\" says Mrs White to Mrs Green.\n\"Thank you very much.\"\nMrs Green is going shopping now. She is going to buy fruit for the party. Mrs Green buys a lot of pears, apples, oranges and bananas. Then she goes home.\nIt's five o'clock in the afternoon. Everything is ready. Now the first girl is arriving. The party is going to begin in thirty minutes.","items":[{"number":"35","item_type":"writing","context_note":"Passage B","stem":"Who is Mrs Green going to give a birthday party to?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Her daughter, Mary.","explanation_md":"这道题是典型的细节信息查找题。问题是“Who is Mrs Green going to give a birthday party to?”（格林夫人要为谁举办生日派对？）。关键词是“Who”（谁），询问的是人。我们需要在短文中找到派对的举办者（Mrs Green）和派对的主角。根据上下文推断，文章中会提到类似“a party for my daughter, Mary”这样的信息。因此，答案就是“她的女儿，玛丽”。","knowledge_expansion_md":"### W-H类问题解答技巧\n\n1.  **理解疑问词 (Question Words)**：\n    *   `Who`: 问“谁”，答案是人名或身份。\n    *   `What`: 问“什么”，答案是事物或动作。\n    *   `When`: 问“何时”，答案是时间。\n    *   `Where`: 问“何地”，答案是地点。\n    *   `Why`: 问“为何”，答案是原因。\n    *   `How`: 问“如何”，答案是方式、程度或状态。\n\n2.  **定位关键词 (Scanning for Keywords)**：阅读问题后，快速在原文中寻找与问题相关的核心词汇。本题的关键词是 `Mrs Green`, `birthday party`。\n\n3.  **注意介词搭配**：问题中用了 `give a party to`，虽然在日常英语中 `give a party for` 更常见，表示“为……举办派对”，但两者都指向派对的主角。要理解介词在这里的功能，即连接动作和接收者。\n\n4.  **构建完整答案**：虽然有时只写一个名字（如 `Mary`）也能得分，但更规范、更准确的回答是提供完整的身份信息，如“Her daughter, Mary”，这能更好地展示你的阅读理解能力。","socratic_tracks":[{"title":"疑问词解析","steps":[{"question":"问题开头的第一个词是什么？它在问什么类型的信息？","hint":"这个词是 'Who'。","takeaway":"疑问词 'Who' 用来提问关于人的信息，比如姓名或身份。"},{"question":"整个问题“Who is Mrs Green going to give a birthday party to?”是在问关于哪个人的信息？","hint":"是问派对的组织者，还是派对的客人，还是派对的主角？","takeaway":"这个问题是在问谁是这次生日派对的主角，也就是为谁庆祝生日。"}]},{"title":"文本信息定位","steps":[{"question":"为了回答这个问题，你应该在文章中寻找哪些关键词？","hint":"可以从问题中找词，比如 `Mrs Green`, `party`。","takeaway":"解答细节题的第一步是带着问题中的关键词回到原文中定位相关句子。"},{"question":"假设你在文中找到了这样一句话：'I am happy to hold a birthday party for my daughter, Mary.' 这里的 'I' 指的是谁？","hint":"文章的上下文通常会告诉我们 'I' 或 'my' 是谁。","takeaway":"文中的 'I' 和 'my' 指的就是 Mrs Green，因为是她在组织派对。"},{"question":"那么，根据 'a party for my daughter, Mary' 这句话，派对是为谁举办的？","hint":"直接翻译 'my daughter, Mary'。","takeaway":"派对是为“我的女儿，玛丽”举办的，也就是格林夫人的女儿玛丽。"}]},{"title":"答案组织与表达","steps":[{"question":"我们现在知道了派对是为玛丽举办的，她也是格林夫人的女儿。如何用英语简洁并准确地回答这个问题？","hint":"问题问 'Who'，答案应该是一个表示人的名词或代词短语。","takeaway":"直接回答核心信息是最高效的方式。"},{"question":"只回答 'Mary' 可以吗？回答 'Her daughter' 可以吗？哪种更好？或者有没有更好的方式？","hint":"想一想哪种方式提供的信息最完整、最没有歧义。","takeaway":"将身份和名字结合起来，回答 'Her daughter, Mary'，是最为清晰和完整的答案。"}]}]}},{"number":"36","item_type":"writing","context_note":"Passage B","stem":"How old is Mary?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"She will be ten years old.","explanation_md":"这道题考察对具体数字信息的提取能力。问题是“How old is Mary?”（玛丽多大了？）。关键词是“How old”，询问年龄。我们需要在短文中找到与玛丽（Mary）年龄相关的数字。根据文章第二句“She will be ten years old.”（她将满十岁），我们可以直接找到答案。因此，完整的回答是“She will be ten years old.”。","knowledge_expansion_md":"### 如何询问和回答年龄\n\n1.  **提问方式**：最常见的方式是 `How old is/are ...?`\n    *   `How old are you?`\n    *   `How old is your brother?`\n\n2.  **回答方式**：\n    *   完整句：`She is 12 years old.` (最正式)\n    *   省略 `years old`：`She is 12.` (常用)\n    *   非正式口语：`She's 12.`\n\n3.  **基数词与序数词 (Cardinal vs. Ordinal Numbers)**：\n    *   回答年龄用**基数词** (Cardinal Numbers): one, two, three, ..., twelve。\n    *   描述生日用**序数词** (Ordinal Numbers): first, second, third, ..., twelfth。\n    *   阅读时需要能够转换：看到 `12th birthday` 就要知道年龄是 `12`。\n\n4.  **相关表达**：\n    *   `turn + 年龄`: 表示“将要满……岁”。例如: `She is turning 12.` 意味着她即将12岁，或者生日过后就12岁了。","socratic_tracks":[{"title":"关键信息识别","steps":[{"question":"这个问题以 'How old' 开头，它在询问什么信息？","hint":"想一想 'How old are you?' 是什么意思。","takeaway":"'How old' 是用来询问年龄的特定疑问词组。"},{"question":"那么，要在文章中回答这个问题，我们需要寻找什么类型的词？","hint":"年龄通常用什么来表示？","takeaway":"回答 'How old' 的问题，我们需要在文中定位与人物相关的数字。"}]},{"title":"间接信息转换","steps":[{"question":"如果文章没有直接说 'Mary is 10 years old'，还可能用什么方式告诉我们她的年龄？","hint":"想一想过生日的时候我们会怎么说。","takeaway":"文章可能会通过描述生日是“第几个”生日来间接透露年龄。"},{"question":"如果文章说 'It's for her tenth (10th) birthday'，这表示玛丽几岁了？","hint":"第10个生日，是过完就10岁了，还是11岁了？","takeaway":"序数词 'tenth (10th)' 对应基数词 'ten (10)'，所以 '10th birthday' 意味着年龄是10岁。"},{"question":"如果文章说 'She is turning 10' 呢？","hint":"'turn' 在这里是“转变”的意思。","takeaway":"'Turning 10' 也是指年龄即将或刚刚变为10岁，同样指向数字10。"}]},{"title":"规范回答句式","steps":[{"question":"我们找到了年龄是10。现在，如何用一个完整的英语句子来回答问题 'How old is Mary?'","hint":"用主语 'She' 来代替 'Mary'，然后使用 'be' 动词。","takeaway":"完整的回答句式是 '主语 + be动词 + 年龄'。"},{"question":"只回答数字 '10' 可以吗？回答 'She is 10.' 和 'She is 10 years old.' 有什么区别？","hint":"想一想哪个更完整、更正式。","takeaway":"虽然 '10' 或 'She is 10' 在口语中可以接受，但在书面回答中，'She is 10 years old.' 是最完整和规范的表达。"}]}]}},{"number":"37","item_type":"writing","context_note":"Passage B","stem":"What does Mrs Green buy for the party?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"She buys a lot of pears, apples, oranges and bananas.","explanation_md":"本题为细节理解题，询问格林夫人为派对买了什么。问题以“What”开头，要求回答具体物品。根据文章中的关键信息“Mrs Green buys a lot of pears, apples, oranges and bananas.”，我们可以直接找到她购买的物品。注意，文章虽然提到了蛋糕（cake），但并未说明是格林夫人在这次购物时买的。回答时，应使用完整的句子，并注意问句使用了一般现在时（does...buy），因此答句动词要用第三人称单数形式“buys”。","knowledge_expansion_md":"### 1. Wh-特殊疑问句的回答\n特殊疑问句是以 `what`, `when`, `where`, `who`, `why`, `how` 等词开头的疑问句，要求提供具体信息，不能用 `Yes` 或 `No` 回答。\n- **解题技巧**：首先识别疑问词（本题是 `What`），明确提问方向（问物品）；然后在文章中定位与问题主语（Mrs Green）和谓语（buy）相关的关键词，找到对应信息。\n- **回答规范**：尽量使用完整的句子作答，保持与问题时态一致。例如，本题问句是一般现在时，答句也用一般现在时。\n\n### 2. 第三人称单数\n在一般现在时中，如果主语是第三人称单数（如 `he`, `she`, `it`, `Mrs Green`, `Tom`），谓语动词需要进行相应变化，通常是在动词末尾加 `-s` 或 `-es`。例如：`buy` -> `buys`, `go` -> `goes`, `watch` -> `watches`。","socratic_tracks":[{"title":"时态一致性","steps":[{"question":"观察问题 “What **does** Mrs Green **buy**...?”，它用的是什么时态？","hint":"助动词 `does` 是哪个时态的标志？","takeaway":"问句使用了一般现在时来提问。"},{"question":"既然问句是一般现在时，那么在回答时，主语是“She”（指代 Mrs Green），动词“buy”应该变成什么形式？","hint":"想一想主语是第三人称单数时，一般现在时动词的变化规则。","takeaway":"回答时主语是第三人称单数，所以动词要用三单形式 `buys`。"}]},{"title":"阅读策略：定位关键词","steps":[{"question":"为了准确回答这个问题，你认为应该在文章中寻找哪些最关键的词？","hint":"问题的主角是谁？她做了什么动作？","takeaway":"我们应该在文章中快速定位 “Mrs Green” 和 “buy” 这两个关键词。"},{"question":"找到包含这些关键词的句子后，句子的哪个部分是回答 “What”（什么）这个问题的答案？","hint":"“What” 关心的是动作（buy）的对象。","takeaway":"我们需要关注动词 “buy” 后面的宾语，也就是她购买的具体物品。"}]},{"title":"回答的完整性","steps":[{"question":"如果我们只回答 “Apples, bananas, and a big cake.”，这个答案在考试中可能会被扣分吗？为什么？","hint":"这是一个简答题，不是填空题。完整的交流是怎样的？","takeaway":"在回答阅读理解的简答题时，通常需要用一个完整的句子来作答，这样更规范、更清晰。"},{"question":"如何将名词短语 “apples, bananas, and a big cake” 扩展成一个完整的回答句？","hint":"一个完整的句子需要包含主语和谓语。谁（主语）做了什么（谓语）？","takeaway":"我们需要加上主语（She）和谓语动词（buys），构成 “主-谓-宾” 的完整句子结构。"}]}]}},{"number":"38","item_type":"writing","context_note":"Passage B","stem":"When is the party going to begin?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"It is going to begin at 5:30 p.m.","explanation_md":"本题为细节理解题，询问派对何时开始。问题以“When”开头，要求回答具体时间。根据文章中的关键信息“It's five o'clock in the afternoon.”以及“The party is going to begin in thirty minutes.”，我们可以推算出派对的开始时间是下午五点半（5:30 p.m.）。回答时，可以使用与问题中相同的“be going to”结构。注意在具体时刻前要使用介词“at”。","knowledge_expansion_md":"### 1. 询问与回答时间\n- **提问**：常用 `When` 或 `What time` 提问时间。\n- **回答**：回答时需注意时间介词的正确使用。\n  - `at` 用于具体时刻，如 `at 7 o'clock`, `at noon`。\n  - `on` 用于具体的某一天或日期，如 `on Sunday`, `on May 1st`。\n  - `in` 用于较长的时间段，如月份、年份、季节，如 `in July`, `in 2024`, `in the evening`。\n\n### 2. 表示将来的方式\n- **`will + 动词原形`**：常用于表示临时的决定、预测或客观的将来。例：`The party will begin at 7:00 p.m.` (陈述一个事实)。\n- **`be going to + 动词原形`**：常用于表示事先计划好的、打算要做的事情。例：`We are going to have a party.` (我们计划要开派对)。\n- 在回答本题时，两种方式通常可以互换，但使用 `be going to` 更能呼应问题中可能存在的计划性。","socratic_tracks":[{"title":"时间介词的运用","steps":[{"question":"在表达“在七点钟”这个具体时刻时，我们应该用哪个介词，是 `in`, `on` 还是 `at`？","hint":"回忆一下关于钟点的时间表达法。","takeaway":"在具体的钟点前，我们必须使用介词 `at`。"},{"question":"你能分别用 `in`, `on`, `at` 各造一个表示时间的短语吗？","hint":"`in` + 较长时间段, `on` + 某一天, `at` + 某个时刻。","takeaway":"熟练掌握 `in`, `on`, `at` 的用法区别是关键：at a time, on a day, in a period。"}]},{"title":"未来时态的选择","steps":[{"question":"文章中说 “The party **will begin**...”，这里用的是 `will`。如果问题是 “When **is** the party **going to begin**?”，我们回答时可以用 `will` 吗？可以用 `is going to` 吗？","hint":"`will` 和 `be going to` 都可以表示将来，但侧重点略有不同。","takeaway":"两者都可以使用，但用 `is going to` 来回答 `is...going to` 的问题，在结构上更对应、更自然。"},{"question":"为什么在回答时，我们可以用代词 “It” 来代替 “The party”？","hint":"代词有什么作用？","takeaway":"使用代词可以避免重复，让语言更简洁流畅。"}]},{"title":"阅读策略：识别提问词","steps":[{"question":"这个问题以 “When” 开头，它是在问关于什么的信息？","hint":"想一想 `What`, `When`, `Where` 的区别。","takeaway":"“When” 是用来提问时间的特定疑问词。"},{"question":"因此，在阅读文章寻找答案时，你应该重点关注哪一类词语？","hint":"是人名、地名，还是与时间、日期、时刻相关的表达？","takeaway":"我们应该在文章中快速寻找包含数字、o'clock、a.m./p.m.、日期或星期等表示时间的词语。"}]}]}},{"number":"39","item_type":"writing","context_note":"Passage B","stem":"How many girls are there at the party?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"There are twenty girls.","explanation_md":"本题为细节理解题，询问派对上有多少个女孩。问题以“How many”开头，要求回答可数名词的数量。根据文章中的关键信息“A lot of her friends are coming to the party. Twenty of them are girls.”，我们可以得知女孩的数量是二十个。回答这类问题时，最常用和最规范的句型是“There be”句型。因为“twenty girls”是复数，所以应该用“There are...”。","knowledge_expansion_md":"### 1. `How many` vs. `How much`\n- **`How many`** 用于提问**可数名词**的数量，其后跟名词的复数形式。例：`How many books do you have?`\n- **`How much`** 用于提问**不可数名词**的数量。例：`How much water is there in the bottle?`\n- 本题中 `girl` 是可数名词，所以用 `How many` 提问。\n\n### 2. `There be` 句型\n- `There be` 句型表示“某地（或某时）有某人/某物”，是英语中最基本的句型之一。\n- **结构**：`There is + 单数名词/不可数名词` 或 `There are + 复数名词`。\n- **回答 `How many` 的问题**：用 `There are...` 回答 `How many... are there?` 的问题是最常见的结构。例如：Q: `How many students are there in your class?` A: `There are fifty students in my class.`","socratic_tracks":[{"title":"句型结构：There be","steps":[{"question":"问题 “How many girls are there...?” 中，`are there` 是一个什么句型的疑问形式？","hint":"想一想表示“某地有某物”的经典句型。","takeaway":"这是 `There be` 句型的倒装疑问形式。"},{"question":"既然问题使用了 `There be` 句型的疑问式，那么用什么句型来回答最地道、最完整？","hint":"用陈述句的形式来回答疑问句。","takeaway":"使用 `There are...` 的陈述句形式来回答是最规范和自然的。"},{"question":"为什么用 `There are` 而不是 `There is`？","hint":"这取决于后面的名词是单数还是复数。","takeaway":"因为女孩的数量是二十个（twenty girls），是复数，所以必须用 `are`。"}]},{"title":"数量词辨析","steps":[{"question":"为什么这个问题用 “How many” 而不是 “How much” 来提问？","hint":"“girl” 这个词可以一个一个地数吗？","takeaway":"“girl” 是可数名词，所以必须用 “How many” 来提问其数量。"},{"question":"如果我们想问派对上有多少果汁（juice），应该用 “How many” 还是 “How much”？","hint":"“juice” 是可数名词还是不可数名词？","takeaway":"“juice” 是不可数名词，所以应该用 “How much” 来提问。"}]},{"title":"阅读策略：提取数字信息","steps":[{"question":"要回答 “How many girls” 这个问题，你需要在文章中寻找哪两种信息的组合？","hint":"我们需要知道对象（是谁）和数量（有多少）。","takeaway":"我们需要在文章中找到同时提到 “girls” 和一个具体数字的句子。"},{"question":"文章中是如何告诉我们女孩数量的？","hint":"在描述来参加派对的朋友时。","takeaway":"文章通过句子“Twenty of them are girls.”（她们中有二十个是女孩）来给出信息，我们需要从中准确提取出所需信息。"}]}]}}]},{"section_title":"五、根据所给单词的适当形式填空。(共8分)","section_instruction":"","items":[{"number":"40","item_type":"fill_blank_word_form","context_note":"","stem":"In our school, we have many _____ (club).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"clubs","explanation_md":"本题考查名词单复数和限定词的搭配。空格前的单词是“many”，意为“许多”，它专门用来修饰可数名词。被“many”修饰的名词必须使用其复数形式。括号中给出的单词是“club”（俱乐部），是一个可数名词的单数形式。因此，需要将其变为复数形式“clubs”。整个句子的意思是“在我们的学校，我们有许多俱乐部”。","knowledge_expansion_md":"### 1. 数量限定词 (Quantifiers)\n英语中有很多词用来表示数量，它们需要和不同类型的名词搭配：\n- **修饰可数名词复数**：`many` (许多), `a few` (一些), `several` (几个)。例：`many friends`, `a few questions`。\n- **修饰不可数名词**：`much` (许多), `a little` (一点)。例：`much money`, `a little milk`。\n- **通用（可修饰可数名词复数和不可数名词）**：`a lot of / lots of` (许多), `some` (一些), `any` (任何)。例：`a lot of books / a lot of water`。\n\n### 2. 名词复数变化规则\n- **规则变化**：\n  - 大多数名词直接在词尾加 `-s`。如：`club` -> `clubs`, `book` -> `books`。\n  - 以 `s, x, z, ch, sh` 结尾的名词，加 `-es`。如：`bus` -> `buses`, `box` -> `boxes`。\n  - 以“辅音字母 + y”结尾的名词，变 `y` 为 `i` 再加 `-es`。如：`baby` -> `babies`。\n  - 以“元音字母 + y”结尾的名词，直接加 `-s`。如：`boy` -> `boys`。\n- **不规则变化**：\n  - `man` -> `men`, `woman` -> `women`, `child` -> `children`, `foot` -> `feet`, `tooth` -> `teeth`, `mouse` -> `mice`。","socratic_tracks":[{"title":"限定词与名词搭配","steps":[{"question":"看到空格前的单词 “many”，你首先会想到它后面应该跟什么类型的名词？","hint":"我们说 “many books” 还是 “many water”？","takeaway":"“many” 后面必须跟可数名词的复数形式。"},{"question":"如果把 “many” 换成 “one”，空格里应该填什么？如果换成 “much” 呢？","hint":"“one” 后面跟单数，“much” 后面跟不可数名词。","takeaway":"若用 “one”，应填 `club`；若用 “much”，则无法与 `club` 搭配，因为 `club` 是可数名词。"}]},{"title":"名词复数规则","steps":[{"question":"括号里给的单词 “club” 是可数名词还是不可数名词？是单数还是复数？","hint":"我们可以说 “one club, two clubs” 吗？","takeaway":"“club” 是一个可数名词的单数形式。"},{"question":"那么 “club” 的复数形式是什么？它遵循的是哪种变化规则？","hint":"这是最常见、最普遍的名词变复数规则。","takeaway":"“club” 是一个规则名词，其复数形式直接在词尾加 -s，变成 “clubs”。"}]},{"title":"语境逻辑推断","steps":[{"question":"从整个句子的意思 “In our school, we have many _____” 来看，一个学校里通常是只有一个俱乐部，还是有很多个不同的俱乐部？","hint":"想想你自己的学校，是不是有篮球社、音乐社、美术社等等？","takeaway":"根据生活常识，一个学校通常会有许多俱乐部，所以复数形式在逻辑上是正确的。"},{"question":"这种从逻辑上的推断，是否也验证了我们从语法上（many + 复数）得出的结论？","hint":"语法和逻辑通常是相辅相成的。","takeaway":"语法规则和句子所要表达的实际意义是高度一致的，通过逻辑推断可以帮助我们检查语法选择的正确性。"}]}]}},{"number":"41","item_type":"fill_blank_word_form","context_note":"","stem":"Helen can _____ (speak) three languages.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"speak","explanation_md":"本题考查情态动词的用法。句子中出现了情态动词 `can`，意为“能够”。情态动词（如 `can`, `must`, `should` 等）有一个重要的语法规则，即其后必须跟动词原形（infinitive without 'to'）。因此，括号中的动词 `speak` 无需做任何形式上的改变，直接使用其原形即可。整个句子意为“海伦会说三种语言”。","knowledge_expansion_md":"### 情态动词 + 动词原形\n\n情态动词是一类特殊的助动词，用于表达说话人的语气、情感、态度，如能力、许可、必须、推测等。常见的情态动词有：\n\n*   **`can / could`** (能力, 许可)\n*   **`may / might`** (许可, 推测)\n*   **`must`** (必须, 强烈的推测)\n*   **`should / ought to`** (应该, 建议)\n*   **`will / would`** (意愿, 将要)\n\n**核心用法**：\n1.  **后跟动词原形**：`Subject + modal verb + verb (base form) + ...`\n    *   例如：`You should finish your homework.` (你应当完成你的作业。)\n2.  **人称无变化**：情态动词本身不因主语的人称和数的变化而改变形式。第三人称单数后也不加 `-s`。\n    *   正确：`He can swim.`\n    *   错误：`He cans swim.`\n3.  **否定与疑问**：否定形式直接在情态动词后加 `not` (如 `cannot`, `should not`)；疑问句则将情态动词提到句首。","socratic_tracks":[{"title":"情态动词的识别","steps":[{"question":"在这个句子 `Helen can _____ (speak) three languages.` 中，你看到了哪个表示“能力”或“可能性”的词？","hint":"这个词是 c 开头的，我们经常用它来说“我能做某事”。","takeaway":"句子中的 `can` 是一个情态动词，表示“能够”。"},{"question":"当句子里出现了 `can`, `must`, `should` 这样的情态动词后，它后面的动词应该使用什么形式呢？","hint":"回想一下你常说的句子，比如 `I can swim.` 或者 `You should go.`，这里的 `swim` 和 `go` 是什么形式？","takeaway":"情态动词后面必须跟动词的原形。"}]},{"title":"动词原形的应用","steps":[{"question":"动词 `speak` 的“原形”是什么？","hint":"“原形”就是这个动词最基本、未经任何改变的形式。","takeaway":"动词 `speak` 的原形就是 `speak` 本身。"},{"question":"为什么在这里我们不需要把 `speak` 变成 `speaks` 或者 `speaking` 呢？","hint":"看看 `speak` 前面紧跟着的那个词是什么，它有什么语法作用？","takeaway":"因为 `speak` 前面有情态动词 `can`，所以它必须保持原形。"}]},{"title":"句子结构分析","steps":[{"question":"这个句子的主语是谁？谓语动词是哪个部分？","hint":"主语是动作的发出者，谓语是描述主语动作或状态的部分。","takeaway":"主语是 `Helen`，谓语是由 `can` 和 `speak` 共同组成的谓语部分 `can speak`。"},{"question":"在 `can speak` 这个组合中，`can` 起到了什么作用？","hint":"它是在帮助主要动词 `speak` 表达更完整的意思，比如“能够说”。","takeaway":"`can` 作为助动词（情态动词），辅助主要动词 `speak` 构成谓语，并决定了主要动词必须使用原形。"}]}]}},{"number":"42","item_type":"fill_blank_word_form","context_note":"","stem":"The Whites have four _____ (child), two daughters and two sons.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"children","explanation_md":"本题考查名词的复数形式。句子中的 `four` (四) 是一个大于一的数词，因此它后面修饰的名词必须使用复数形式。`child` (孩子) 是一个不规则变化的名词，它的复数形式不是直接加 `-s`，而是 `children`。句末的 `two daughters and two sons` (两个女儿和两个儿子) 也印证了总共有四个孩子，需要使用复数。","knowledge_expansion_md":"### 英语名词的复数变化\n\n英语中可数名词分为单数和复数形式。其变化规则主要有两大类：\n\n**1. 规则变化**\n*   **一般情况**：直接在词尾加 `-s`。如：`book` -> `books`, `dog` -> `dogs`。\n*   **以 s, x, sh, ch 结尾**：加 `-es`。如：`bus` -> `buses`, `box` -> `boxes`, `watch` -> `watches`。\n*   **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-es`。如：`baby` -> `babies`, `city` -> `cities`。\n*   **以 f 或 fe 结尾**：多数变 `f/fe` 为 `ves`。如：`leaf` -> `leaves`, `wife` -> `wives`。\n\n**2. 不规则变化 (需特殊记忆)**\n*   **元音变化**：`man` -> `men`, `woman` -> `women`, `foot` -> `feet`, `tooth` -> `teeth`, `mouse` -> `mice`。\n*   **以 -en 结尾**：`child` -> `children`, `ox` -> `oxen`。\n*   **单复数同形**：`sheep` (羊), `deer` (鹿), `fish` (鱼，也可为 fishes), `Chinese` (中国人), `Japanese` (日本人)。\n\n**易错点**：学生常会混淆规则与不规则变化，对不规则名词误用规则，如将 `child` 变为 `childs`，这是错误的。","socratic_tracks":[{"title":"数词与名词复数","steps":[{"question":"当你在句子中看到 `one`, `two`, `three`, `four` 这样的数词时，它们后面的名词形式会怎么变化？","hint":"想一想 `one apple` 和 `two apples` 的区别。","takeaway":"当数词大于一时，其后跟的可数名词需要使用复数形式。"},{"question":"这道题中的数词是 `four`，那么它后面的名词 `child` 应该用单数还是复数？","hint":"`four` 明显大于一。","takeaway":"数词 `four` 要求其后的名词 `child` 必须使用复数形式。"}]},{"title":"不规则名词复数","steps":[{"question":"我们知道大多数名词变复数是加 `-s`，比如 `dog` -> `dogs`。你觉得 `child` 的复数是 `childs` 吗？","hint":"这是一个非常常见的词，但它的变化很特殊，不遵循一般规律。","takeaway":"`child` 是一个不规则名词，它的复数形式不是直接加 `-s`。"},{"question":"那么，`child` 正确的复数形式是什么？","hint":"这个词的复数形式以 `-en` 结尾。","takeaway":"`child` 的不规则复数形式是 `children`。"}]},{"title":"利用上下文线索","steps":[{"question":"除了 `four` 这个词，句子后面还有没有其他线索能帮助我们判断？","hint":"看看括号后面的部分：`two daughters and two sons`。","takeaway":"句子后半部分的 `two daughters and two sons` (两个女儿和两个儿子) 是对前面内容的解释。"},{"question":"“两个女儿和两个儿子”加起来总共是几个人？这个信息说明了什么？","hint":"2 + 2 = 4。这四个人的总称是什么？","takeaway":"总共有四个孩子，这进一步确认了 `child` 必须使用复数形式 `children`。"}]}]}},{"number":"43","item_type":"fill_blank_word_form","context_note":"","stem":"My pen pal _____ (live) in Japan.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"lives","explanation_md":"本题考查一般现在时中第三人称单数的主谓一致问题。首先，句子描述的是“我的笔友住在日本”这一客观事实，应使用一般现在时。其次，句子的主语是 `My pen pal` (我的笔友)，这是一个单数名词，属于第三人称（既不是 `I` 也不是 `you`），即“他”或“她”。在一般现在时中，当主语是第三人称单数时，谓语动词需要在原形的基础上加 `-s` 或 `-es`。因此，动词 `live` 应变为 `lives`。","knowledge_expansion_md":"### 主谓一致：一般现在时的第三人称单数\n\n主谓一致是英语语法的基础原则，即句子的谓语动词必须在“人称”和“数”上与主语保持一致。\n\n在**一般现在时**中，主谓一致主要体现在：\n*   当主语是**第一人称** (`I`), **第二人称** (`you`), 或**复数形式** (`we`, `they`, `the students` 等) 时，谓语动词使用**原形**。\n    *   `I live in China.`\n    *   `They live in China.`\n*   当主语是**第三人称单数** (`he`, `she`, `it`, `my pen pal`, `the cat` 等) 时，谓语动词需要在原形后**加 `-s` 或 `-es`**。\n\n**动词变化规则**：\n1.  **一般情况**：直接加 `-s` (如 `live` -> `lives`, `work` -> `works`)。\n2.  **以 s, x, ch, sh, o 结尾**：加 `-es` (如 `watch` -> `watches`, `go` -> `goes`)。\n3.  **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-es` (如 `study` -> `studies`)。\n4.  **特殊**：`have` -> `has`。\n\n**易错点**：在否定句和疑问句中，借助助动词 `does` 后，主要动词要恢复原形。例如：`He lives in Japan.` -> `Does he live in Japan?` / `He doesn't live in Japan.`","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"这个句子 `My pen pal _____ (live) in Japan.` 是在描述一个一次性的动作，还是一个长期存在的事实或状态？","hint":"笔友住在某个国家，通常是一个持续性的状态。","takeaway":"句子描述的是一个事实状态，应该使用一般现在时。"}]},{"title":"分析主语人称和数","steps":[{"question":"这个句子的主语是谁？是 `My pen pal`。","hint":"主语是执行动作的人或物。","takeaway":"句子的主语是 `My pen pal`。"},{"question":"`My pen pal` (我的笔友) 是指一个人还是多个人？","hint":"从 `pen pal` 这个词本身看，它是单数形式。","takeaway":"`My pen pal` 是单数。"},{"question":"这个单数主语可以用 `I`, `you`, `he`, `she` 中的哪一个来代指？","hint":"“我的笔友”不是“我”也不是“你”，而是“他”或“她”。","takeaway":"`My pen pal` 是第三人称单数主语。"}]},{"title":"应用主谓一致规则","steps":[{"question":"在一般现在时中，如果主语是第三人称单数，谓语动词需要发生什么变化？","hint":"想想 `He play...` 还是 `He plays...` 哪个是正确的？","takeaway":"当主语是第三人称单数时，一般现在时的谓语动词词尾要加 `-s` 或 `-es`。"},{"question":"那么，根据这个规则，动词 `live` 应该如何变化以匹配主语 `My pen pal`？","hint":"`live` 属于一般情况，直接在词尾添加一个字母即可。","takeaway":"动词 `live` 应该变为 `lives`。"}]}]}},{"number":"44","item_type":"fill_blank_word_form","context_note":"","stem":"I want to eat _____ (a) apple.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"an","explanation_md":"本题考查不定冠词 `a` 和 `an` 的正确使用。不定冠词 `a/an` 都表示“一个”，用于可数名词单数前。选择 `a` 还是 `an` 的依据是其后紧跟的单词的**第一个音素**是元音还是辅音。单词 `apple` 的发音是 `/ˈæpl/`，其开头发的是元音音素 `/æ/`。因此，在 `apple` 前面应该使用 `an`，而不是 `a`。整个短语是 `an apple`。","knowledge_expansion_md":"### 不定冠词 a/an 的用法辨析\n\n不定冠词 `a` 和 `an` 的核心区别在于其后所跟单词的**首音素**，而非首字母。\n\n1.  **`an` 用于元音音素开头的单词前。**\n    *   `an apple` (/æ/ 音素)\n    *   `an egg` (/e/ 音素)\n    *   `an orange` (/ɒ/ 音素)\n\n2.  **`a` 用于辅音音素开头的单词前。**\n    *   `a book` (/b/ 音素)\n    *   `a cat` (/k/ 音素)\n    *   `a dog` (/d/ 音素)\n\n**特别注意：发音决定一切！**\n\n*   **首字母为元音，但发辅音**：这类词前面用 `a`。\n    *   `a university` (university 的 `u` 发 /j/ 音)\n    *   `a useful tool` (useful 的 `u` 发 /j/ 音)\n    *   `a one-way street` (one 的 `o` 发 /w/ 音)\n    *   `a European country` (European 的 `Eu` 发 /j/ 音)\n\n*   **首字母为辅音，但不发音（即以元音音素开头）**：这类词前面用 `an`。\n    *   `an hour` (hour 的 `h` 不发音，以 /aʊ/ 音开头)\n    *   `an honest person` (honest 的 `h` 不发音，以 /ɒ/ 音开头)\n    *   `an honor` (honor 的 `h` 不发音，以 /ɒ/ 音开头)","socratic_tracks":[{"title":"不定冠词的功能","steps":[{"question":"在英语中，`a` 和 `an` 这两个词有什么作用？它们都表示什么意思？","hint":"当我们想说“一个苹果”或“一本书”时，就会用到它们。","takeaway":"`a` 和 `an` 都是不定冠词，表示“一个”，用在单数可数名词前。"},{"question":"既然 `a` 和 `an` 意思相同，为什么要有两种形式呢？它们的使用时机有什么不同？","hint":"试着读一下 `a apple` 和 `an apple`，哪个更顺口？","takeaway":"使用 `a` 还是 `an` 取决于其后单词的读音，目的是为了发音流畅。"}]},{"title":"发音决定规则","steps":[{"question":"决定用 `a` 还是 `an` 的标准，是看单词的第一个字母，还是听单词的第一个发音？","hint":"想想 `hour` (小时) 和 `university` (大学) 这两个词的例子。","takeaway":"判断用 `a` 还是 `an` 的唯一标准是其后单词的第一个音素是元音还是辅音。"},{"question":"单词 `apple` 的读音 `/ˈæpl/` 是以什么音素开头的？是元音还是辅音？","hint":"英语中的元音音素包括 /æ/, /e/, /i:/, /ɒ/, /u:/ 等。","takeaway":"`apple` 以元音音素 /æ/ 开头。"},{"question":"根据“元音音素前用 an”的规则，`apple` 前面应该用什么冠词？","hint":"既然是元音开头，就应该用 `an`。","takeaway":"在 `apple` 前面应该用 `an`。"}]},{"title":"易混淆词辨析","steps":[{"question":"单词 `hour` (小时) 的首字母是 `h`，是辅音字母，但为什么我们说 `an hour`？","hint":"你读 `hour` 的时候，`h` 这个音发出来了吗？","takeaway":"因为 `hour` 中的 `h` 不发音，单词实际以元音音素 /aʊ/ 开头，所以用 `an`。"},{"question":"单词 `university` (大学) 的首字母是 `u`，是元音字母，但为什么我们说 `a university`？","hint":"听一下 `university` 的读音 `/juːnɪˈvɜːsəti/`，开头的音像不像 `you` 这个词的音？","takeaway":"因为 `university` 的 `u` 发的是辅音音素 /j/，所以用 `a`。"}]}]}},{"number":"45","item_type":"fill_blank_word_form","context_note":"","stem":"Please come and _____ (help) me.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"help","explanation_md":"这是一个以 \"Please\" 开头的祈使句，表示礼貌的请求。祈使句中的动词需要使用原形。句中的连词 \"and\" 连接了两个并列的动词 \"come\" 和 \"(help)\"，它们的形式必须保持一致。因为 \"come\" 是动词原形，所以括号里的 \"help\" 也应使用其原形 \"help\"。","knowledge_expansion_md":"### 祈使句及其构成\n\n1.  **定义**：祈使句用于表达命令、请求、建议、祝愿等，其主语通常是第二人称 `you`，但常常被省略。\n2.  **肯定结构**：通常以动词原形开头。为了使语气更委婉，可在句首或句末加上 `please`。\n    *   `Open the door.` (开门。)\n    *   `Please be quiet.` (请保持安静。)\n3.  **否定结构**：在动词原形前加 `Don't`。\n    *   `Don't touch it.` (别碰它。)\n4.  **并列动词**：当使用 `and` 连接两个或多个动词来表示连续或并列的动作时，这些动词的形式要保持一致。在祈使句中，它们都应是原形。\n    *   `Go and wash your hands.` (去洗手。)\n    *   `Please come and help us.` (请过来帮助我们。)","socratic_tracks":[{"title":"祈使句的动词形式","steps":[{"question":"这个句子以什么词开头？它表达了什么语气？","hint":"看看句首的 'Please'，它通常用在什么类型的句子中？","takeaway":"句子以 'Please' 开头，表示礼貌的请求，属于祈使句。"},{"question":"在祈使句中，动词通常用什么形式？","hint":"想一想我们让别人做某事时怎么说，比如 'Sit down'。","takeaway":"祈使句中的动词要使用原形。"},{"question":"所以，根据祈使句的规则，'help' 应该用什么形式？","hint":"动词原形就是词典里的基本形式。","takeaway":"因此，括号里的动词 'help' 应该保持原形不变。"}]},{"title":"并列连词 'and' 的用法","steps":[{"question":"句子中的 'and' 连接了哪两个词？","hint":"看看 'and' 前后的词。","takeaway":"'and' 连接了动词 'come' 和 'help'。"},{"question":"当 'and' 连接两个动词时，这两个动词的形式有什么关系？","hint":"它们应该是“好兄弟”，形式上应该一样还是不一样？","takeaway":"并列连词 'and' 连接的两个动词形式应该保持一致。"},{"question":"既然 'come' 是动词原形，那么 'help' 应该是什么形式？","hint":"和 'come' 保持一致。","takeaway":"所以 'help' 也必须使用动词原形。"}]},{"title":"常见结构 'come and do'","steps":[{"question":"这句话请求对方做哪几个动作？","hint":"请过来...我。中间还少了一个动作。","takeaway":"这句话请求对方做两个动作：过来和帮助。"},{"question":"在英语中，有一个常见的结构 'come and do something'，你知道它是什么意思吗？","hint":"比如 'come and see' 的意思是“过来看看”。","takeaway":"这个结构表示“过来做某事”。"},{"question":"在这个 'come and do sth.' 结构中，'and' 后面的动词用什么形式？","hint":"观察 'come and see' 中的 'see' 是什么形式。","takeaway":"在 'come and do sth.' 结构中，'and' 后的动词总是使用原形。"}]}]}},{"number":"46","item_type":"fill_blank_word_form","context_note":"","stem":"She _____ (have) a dictionary.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"has","explanation_md":"这是一个描述当前所属情况的陈述句，应使用一般现在时。句子的主语是 \"She\"（她），属于第三人称单数。在一般现在时中，当主语是第三人称单数时，谓语动词需要使用其第三人称单数形式。动词 \"have\" 的第三人称单数形式是 \"has\"，这是一个特殊变化，需要牢记。因此，横线上应填写 \"has\"。","knowledge_expansion_md":"### 一般现在时中的主谓一致\n\n1.  **一般现在时**：用于表示经常性、习惯性的动作，或描述客观事实、真理和当前状态。\n2.  **主谓一致**：动词的形式必须和主语的人称和数保持一致。\n3.  **第三人称单数 (三单)**：当主语是 `he`, `she`, `it`, 单个人名（如 `Tom`），或单个事物（如 `the book`）时，动词需要变化。\n    *   **常规变化**：\n        *   大多数动词直接加 `-s`：`work` -> `works`, `play` -> `plays`。\n        *   以 `s, x, ch, sh, o` 结尾的动词加 `-es`：`go` -> `goes`, `watch` -> `watches`。\n        *   以“辅音字母 + y”结尾的动词，变 `y` 为 `i` 再加 `-es`：`study` -> `studies`。\n    *   **特殊变化**：`have` 的三单形式是 `has`。这是最常见的易错点，必须特殊记忆，不能写成 `haves`。","socratic_tracks":[{"title":"主谓一致原则","steps":[{"question":"这个句子的主语是谁？是单数还是复数？","hint":"看看句子的第一个词 'She'。","takeaway":"主语是 'She'，是第三人称单数。"},{"question":"当主语是第三人称单数时，它后面的动词需要发生什么变化吗？","hint":"想一想 'I walk' 和 'He walks' 的区别。","takeaway":"当主语是第三人称单数且句子是一般现在时，动词需要用第三人称单数形式。"},{"question":"那么，动词 'have' 的第三人称单数形式是什么？","hint":"这是一个特殊的动词变化，不是直接加-s。","takeaway":"动词 'have' 的第三人称单数形式是 'has'。"}]},{"title":"时态判断","steps":[{"question":"这句话 '她有一本字典' 是在描述一个过去、现在还是将来的情况？","hint":"这是在描述她目前拥有的东西，是一个当前的状态。","takeaway":"这句话描述的是当前的状态，应该使用一般现在时。"},{"question":"在一般现在时中，动词的形式由什么决定？","hint":"想想主语是 'I', 'you', 'we', 'they' 和 'he', 'she', 'it' 时，动词有什么不同。","takeaway":"在一般现在时中，动词的形式主要由主语的人称和数决定。"},{"question":"结合主语 'She' 和一般现在时，括号里的 'have' 应该变成什么？","hint":"主语是第三人称单数，动词要用三单形式。","takeaway":"因此，'have' 应该变为其三单形式 'has'。"}]},{"title":"特殊动词变化","steps":[{"question":"在英语中，表示“拥有”的动词是什么？","hint":"题目括号里已经给出了这个词。","takeaway":"表示“拥有”的基本动词是 'have'。"},{"question":"当主语是 'He', 'She' 或 'It' 时，动词 'have' 会变成什么？是直接加 's' 变成 'haves' 吗？","hint":"这是一个不规则的变化，想一想你平时是怎么说的。","takeaway":"不，'have' 的第三人称单数形式是 'has'，这是一个需要特殊记忆的规则。"},{"question":"所以，当主语是 'She' 时，我们应该用 'have' 还是 'has'？","hint":"运用我们刚刚总结的特殊规则。","takeaway":"主语是 'She'，所以应该填写 'has'。"}]}]}},{"number":"47","item_type":"fill_blank_word_form","context_note":"","stem":"There isn't _____ (some) tea in the cup.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"any","explanation_md":"这是一个否定句，判断的依据是句中有否定词 \"isn't\" (is not)。在英语中，表示“一些”的词 `some` 和 `any` 用法不同。`some` 通常用于肯定句中，而 `any` 通常用于否定句和疑问句中。根据“some用于肯定句，any用于否定句和疑问句”这一基本规则，本题是否定句，因此应将 `some` 改为 `any`。整个句子的意思是“杯子里一点茶也没有”。","knowledge_expansion_md":"### `some` 和 `any` 的用法辨析\n\n1.  **基本规则**：\n    *   `some` (一些): 通常用于**肯定句**。可修饰可数名词复数和不可数名词。\n        *   `I need some water.` (我需要一些水 - 不可数)\n        *   `There are some students in the classroom.` (教室里有一些学生 - 可数)\n    *   `any` (一些，任何): 通常用于**否定句**和**疑问句**。\n        *   `I don't have any money.` (我没有任何钱 - 否定句)\n        *   `Do you have any questions?` (你有什么问题吗？- 疑问句)\n\n2.  **特殊用法**：\n    *   **`some` 用于疑问句**：当提出请求或建议，并期待对方给予肯定回答时，疑问句中可用 `some`。\n        *   `Would you like some coffee?` (你想喝点咖啡吗？- 表建议)\n        *   `Could you give me some help?` (你能帮我一下吗？- 表请求)\n    *   **`any` 用于肯定句**：当 `any` 意为“任何一个”时，可以用于肯定句，表示强调，无限制的选择。\n        *   `You can call me at any time.` (你可以在任何时候给我打电话。)","socratic_tracks":[{"title":"句子类型判断","steps":[{"question":"请仔细看这个句子，你有没有发现一个表示“不”或“没有”的词？","hint":"看看 'isn't' 是哪两个词的缩写？","takeaway":"句中有 'isn't'，它是 'is not' 的缩写，所以这是一个否定句。"},{"question":"在英语中，表示'一些'的词 'some' 和 'any' 在肯定句和否定句中通常是如何使用的？","hint":"哪个词喜欢和 'not' 在一起？","takeaway":"'some' 通常用在肯定句中，而 'any' 通常用在否定句和疑问句中。"},{"question":"既然这是一个否定句，那么括号里的 'some' 应该换成哪个词？","hint":"选择那个喜欢和 'not' 搭配的词。","takeaway":"因此，在否定句中，我们应该使用 'any'。"}]},{"title":"some/any 用法辨析","steps":[{"question":"我们什么时候用 'some' 来表示'一些'？能举个例子吗？","hint":"比如，你想说'我有一些苹果'。","takeaway":"'some' 用于肯定句，例如 'I have some apples'。"},{"question":"那我们什么时候用 'any' 呢？能举个例子吗？","hint":"比如，你想问'你有什么问题吗？'或者说'我没有任何问题'。","takeaway":"'any' 用于疑问句和否定句，例如 'Do you have any questions?' 或 'I don't have any questions'。"},{"question":"回到原题 'There isn't _____ tea...'，根据我们刚才的讨论，这里应该填 'some' 还是 'any'？","hint":"判断一下这个句子是肯定句、否定句还是疑问句。","takeaway":"因为 'isn't' 表示否定，所以应该填 'any'。"}]},{"title":"从句意理解","steps":[{"question":"这句话 'There isn't ... tea in the cup' 想要表达什么意思？","hint":"中文意思是“杯子里没...茶”。","takeaway":"它想表达“杯子里一点茶都没有”的意思。"},{"question":"在英语的否定句中，要表达“一点也（没有）”这个概念，我们通常在 'not' 后面用哪个词来加强语气？","hint":"是 'not some' 还是 'not any'？","takeaway":"我们用 'not any' 这个结构来表示“一点也（没有）”。"},{"question":"所以，为了表达“杯子里一点茶也没有”，横线上应该填什么？","hint":"使用 'not any' 结构。","takeaway":"因此，横线上应该填 'any'，构成 'isn't any'。"}]}]}}]},{"section_title":"六、连词成句。(共10分)","section_instruction":"","items":[{"number":"48","item_type":"sentence_transform","context_note":"","stem":"are, brothers, those, my (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Those are my brothers.","explanation_md":"这是一道连词成句题，需要将给定的单词按照正确的语法顺序排列成一个完整的句子。给定的词有 `are`, `brothers`, `those`, `my`，以及一个句号，提示这是一个陈述句。`those` 是指示代词，意为“那些”，常作复数主语。`are` 是 be 动词的复数形式。`my brothers` 是一个名词短语，意为“我的兄弟们”。根据英语“主语 + be动词 + 表语”的句子结构，正确的语序是 \"Those are my brothers.\"。最后，注意句首单词 `Those` 的首字母需要大写，句末要加上句号。","knowledge_expansion_md":"### 连词成句的技巧\n\n1.  **找主谓**：先找出句子的主语（动作的发出者，通常是名词或代词）和谓语（动词）。在本题中，`those` 是主语，`are` 是谓语动词。\n2.  **定句式**：根据标点符号判断句子类型。句号 `.` 表示是陈述句，基本结构是“主语+谓语+其他”。\n3.  **理顺关系**：\n    *   **指示代词**：`this/that` (单数) vs `these/those` (复数)。`those` 是复数，所以谓语动词要用 `are`。\n    *   **所有格**：`my` 是形容词性物主代词，必须放在名词 `brothers` 前面，形成 `my brothers` 这一名词短语。\n4.  **组合成句**：将各个部分按“主-谓-表”的顺序组合：`Those` (主语) + `are` (谓语/系动词) + `my brothers` (表语)。\n5.  **检查格式**：确保句首单词首字母大写，句末有正确的标点符号。","socratic_tracks":[{"title":"寻找句子主干","steps":[{"question":"在一个句子中，我们首先要找的是什么？通常是人或物。","hint":"在 'are, brothers, those, my' 这些词中，哪个词可以作为一句话的开头，来指代一些人？","takeaway":"指示代词 'those' (那些) 很适合做主语。"},{"question":"找到了主语 'Those'，接下来应该找什么？一个句子必须有的成分是什么？","hint":"每个完整的句子都需要一个动作或状态，也就是动词。","takeaway":"主语后面通常是谓语动词，这里是 be 动词 'are'。"},{"question":"现在我们有了 'Those are...' (那些是...)，'是'什么呢？把剩下的词 'my' 和 'brothers' 组合一下。","hint":"'my' 是'我的'，'brothers' 是'兄弟们'，它们应该怎么组合？","takeaway":"剩下的 'my' 和 'brothers' 组成 'my brothers' (我的兄弟们)，作为表语，说明主语 'Those' 是谁。"},{"question":"最后，把主语、动词和表语连起来，并注意大小写和标点，完整的句子是什么？","hint":"句首大写，句末句号。","takeaway":"完整的句子是 'Those are my brothers.'。"}]},{"title":"指示代词的用法","steps":[{"question":"单词 'those' 是什么意思？它指代的是单数还是复数？","hint":"想想 'this' (这个), 'that' (那个), 'these' (这些)。","takeaway":"'those' 意为'那些'，指代复数的人或物。"},{"question":"当 'those' 作主语时，后面的 be 动词应该用 'is' 还是 'are'？","hint":"复数主语要搭配复数动词。","takeaway":"因为 'those' 是复数，所以 be 动词要用 'are'。"},{"question":"现在我们有了 'Those are...'，再把剩下的 'my' 和 'brothers' 填进去，句子就完整了。请说出完整句子。","hint":"把 'my brothers' 放在 'are' 后面。","takeaway":"所以句子是 'Those are my brothers.'。"}]},{"title":"词性分析法","steps":[{"question":"我们来分析一下这几个词的词性：'are', 'brothers', 'those', 'my'。","hint":"'are' 是动词，'brothers' 是名词，'those' 是代词，'my' 是形容词性物主代词。","takeaway":"确定每个词的词性有助于我们判断它们在句子中的位置。"},{"question":"一个陈述句通常以什么词性的词开头？","hint":"通常是名词或代词作主语。","takeaway":"陈述句通常以名词或代词作主语开头，这里 'those' 是最合适的。"},{"question":"形容词性物主代词 'my' 后面必须跟什么词？","hint":"'my' 不能单独使用，它需要修饰一个东西。","takeaway":"'my' 后面必须跟一个名词，所以 'my' 和 'brothers' 要放在一起，组成 'my brothers'。"},{"question":"现在我们有 'Those', 'are', 和 'my brothers' 三个部分，按照主谓表的顺序排列它们。","hint":"主语 (Those) + 动词 (are) + 表语 (my brothers)。","takeaway":"正确的句子顺序是 'Those are my brothers.'。"}]}]}},{"number":"49","item_type":"sentence_transform","context_note":"","stem":"table, backpack, the, my, is, under (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"My backpack is under the table.","explanation_md":"这是一个描述物品位置的陈述句，遵循英语最基本的“主-谓-表”结构。\n1.  首先确定句子的主语（动作或状态的发出者），这里是“我的背包”，即 `My backpack`。\n2.  然后找到谓语动词，这里是 be 动词 `is`。\n3.  最后是说明位置的表语部分，由介词短语 `under the table`（在桌子下面）充当。\n4.  将这三部分按“主语+谓语+表语”的顺序组合，并注意句首单词 `My` 需要大写，句末使用句号。","knowledge_expansion_md":"### 1. 英语基本句型：主谓表结构\n- 结构为：**主语 + be动词 (am/is/are) + 表语**。\n- 表语是用来描述主语的身份、状态、性质或特征的成分，可以由名词、形容词、介词短语等充当。\n- 例：`I am a student.` (名词作表语) / `She is happy.` (形容词作表语) / `The keys are on the desk.` (介词短语作表语)\n\n### 2. 表示位置的介词 (Prepositions of Place)\n- `under`: 在...正下方，无接触。例：`The cat is under the bed.`\n- `on`: 在...表面上，有接触。例：`The book is on the table.`\n- `in`: 在...内部/范围内。例：`The pencils are in the box.`\n- `behind`: 在...后面。\n- `near`: 在...附近。\n\n### 3. 物主代词 (Possessive Adjectives)\n- `my` (我的), `your` (你的/你们的), `his` (他的), `her` (她的), `its` (它的), `our` (我们的), `their` (他们的)。\n- 它们必须和名词连用，表示所属关系，如 `my backpack`。","socratic_tracks":[{"title":"句子核心成分","steps":[{"question":"这个句子想要说明什么？是谁或什么东西，在哪里？","hint":"句子里提到了 `backpack` (背包) 和 `table` (桌子)，还有 `under` (在...下面)。","takeaway":"句子要表达的是“我的背包在桌子下面”。"},{"question":"那么，这个句子的“主角”（主语）是谁？","hint":"是“我的背包”还是“桌子”？想一想是谁“在”桌子下面。","takeaway":"句子的主语是 `my backpack` (我的背包)。"}]},{"title":"介词短语的作用","steps":[{"question":"句子中哪个词告诉我们背包和桌子的位置关系？","hint":"这是一个表示“在...下面”的词。","takeaway":"`under` 这个词表明了“在...下面”的位置关系。"},{"question":"像 `under the table` 这样由“介词+名词”构成的短语叫什么？它在句子中起什么作用？","hint":"它描述了地点，说明了主语 `my backpack` 的位置。","takeaway":"这叫介词短语，在这里作表语，说明主语所在的位置。"}]},{"title":"陈述句语序","steps":[{"question":"一个简单的英语陈述句，最基本的语序是什么？","hint":"回想一下“我是学生”的英文表达 `I am a student.` 的词语顺序。","takeaway":"英语陈述句的基本语序是“主语+谓语(+其他成分)”。"},{"question":"根据这个语序，请将主语 `My backpack`、谓语 `is` 和地点 `under the table` 组合起来。","hint":"主语 + 动词 + 地点。","takeaway":"正确的句子顺序是 `My backpack is under the table.`。"}]}]}},{"number":"50","item_type":"sentence_transform","context_note":"","stem":"number, phone, your, is, what (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"What is your phone number?","explanation_md":"这是一个询问具体信息的特殊疑问句。\n1.  首先要识别出疑问词，这里是 `What` (什么)，特殊疑问句通常以疑问词开头。\n2.  确定句子的主语，即被提问的对象，这里是 `your phone number` (你的电话号码)。\n3.  找到谓语动词，这里是 be 动词 `is`。\n4.  特殊疑问句的基本结构是“疑问词 + be动词/助动词 + 主语 + ...?”，因此，正确的语序是 `What is your phone number?`。","knowledge_expansion_md":"### 1. 特殊疑问句 (Wh-questions)\n- 用于询问特定信息，不能用 Yes/No 回答。由疑问词引导。\n- 常见疑问词：`What` (什么), `Who` (谁), `Where` (哪里), `When` (何时), `Why` (为什么), `How` (怎样)。\n- **基本结构**：**疑问词 + be动词/助动词 + 主语 + ...?**\n- 例：`Where are you from?` / `When is your birthday?`\n\n### 2. 复合名词 (Compound Nouns)\n- `phone number` 是一个复合名词，由两个名词组成，但作为一个整体表示一个意思“电话号码”。\n- 类似的例子还有 `school bag` (书包), `ice cream` (冰淇淋), `bedroom` (卧室)。在连词成句时，需要将它们看作一个不可分割的整体。\n\n### 3. `What is...?` 句型\n- 这是非常基础且常用的句型，用于询问事物的名称、信息等。\n- `What is your name?` (询问姓名)\n- `What is this?` (询问这是什么)\n- `What is your favorite color?` (询问最喜欢的颜色)","socratic_tracks":[{"title":"识别疑问句类型","steps":[{"question":"看到句末的问号 `(?)` 和单词 `what`，你认为这是一个什么类型的问句？","hint":"这种问句需要回答具体信息，而不是简单的“是”或“不是”。","takeaway":"这是一个由 `What` 引导的特殊疑问句。"},{"question":"在特殊疑问句中，疑问词 `What` 通常放在句子的哪个位置？","hint":"参考你学过的其他问句，比如 `What's your name?`。","takeaway":"特殊疑问句中，疑问词通常放在句首。"}]},{"title":"确定句子主语","steps":[{"question":"这个句子是在问关于“什么”的信息？","hint":"看看 `phone` 和 `number` 这两个词，它们可以组合成一个词组。","takeaway":"句子是在问“电话号码” (`phone number`)。"},{"question":"是谁的电话号码呢？哪个词告诉我们了？","hint":"`your` 是“你的”。","takeaway":"句子的主语是 `your phone number` (你的电话号码)。"}]},{"title":"特殊疑问句语序","steps":[{"question":"我们已经知道疑问词是 `What`，主语是 `your phone number`。那么动词 `is` 应该放在哪里？","hint":"回忆一下特殊疑问句的公式：疑问词 + be动词 + 主语?","takeaway":"在 `What is ...?` 句型中，be动词 `is` 应该放在疑问词和主语之间。"},{"question":"现在，请按照“疑问词 + be动词 + 主语”的顺序把这些词组合起来。","hint":"`What` ... `is` ... `your phone number`?","takeaway":"正确的句子就是 `What is your phone number?`。"}]}]}},{"number":"51","item_type":"sentence_transform","context_note":"","stem":"this, black, how, much, is, T-shirt (?)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"How much is this black T-shirt?","explanation_md":"这是一个询问价格的特殊疑问句。\n1.  首先识别出用于提问价格的固定疑问词组 `How much` (多少钱)，它必须放在句首。\n2.  确定被询问价格的物品，即句子的主语。这里是 `this black T-shirt` (这件黑色的T恤)。注意形容词 `black` 要放在名词 `T-shirt` 前面。\n3.  找到谓语动词，这里是 be 动词 `is`。\n4.  根据特殊疑问句“疑问词组 + be动词 + 主语?”的结构，将各部分组合起来，得到 `How much is this black T-shirt?`。","knowledge_expansion_md":"### 1. `How much` vs. `How many`\n- `How much` 用于提问**价格**或**不可数名词**的数量。\n  - 问价格: `How much is the book?`\n  - 问数量: `How much water is in the bottle?`\n- `How many` 用于提问**可数名词复数**的数量。\n  - 问数量: `How many apples do you have?`\n\n### 2. 形容词的顺序\n- 当一个名词被多个词修饰时，词序通常是：**限定词 > 形容词 > 名词**。\n- 在本题中，`this` 是限定词（指示代词），`black` 是形容词，`T-shirt` 是名词，所以顺序是 `this black T-shirt`。\n- 多个形容词之间也有大致的顺序，一般为：描绘性形容词 > 大小/形状 > 年龄 > 颜色 > 国籍 > 材料。例如：`a beautiful small old black Chinese wooden table`。\n\n### 3. `T-shirt` 的书写\n- `T-shirt` 是一个复合词，因为它的形状像字母 `T` 而得名。注意 `T` 必须大写，并且中间有连字符 `-`。","socratic_tracks":[{"title":"关键疑问词组","steps":[{"question":"在这些词中，哪两个词组合在一起是用来问“多少钱”的？","hint":"这是一个以 `How` 开头的常用词组。","takeaway":"`how` 和 `much` 组合成 `How much`，是用来询问价格的固定词组。"},{"question":"作为一个整体，`How much` 应该放在句子的哪个位置？","hint":"它和 `What`, `Where` 一样，都是疑问词（组）。","takeaway":"疑问词组 `How much` 应该放在句首。"}]},{"title":"名词与修饰词","steps":[{"question":"这个句子是在问什么东西的价格？","hint":"找一找表示衣物的名词。","takeaway":"是在问 `T-shirt` (T恤) 的价格。"},{"question":"句子中还有哪些词是用来描述这件T恤的？它们的正确顺序是怎样的？","hint":"有 `this` (这件) 和 `black` (黑色的)。在英语中，形容词通常放在名词前面。","takeaway":"修饰词的顺序是 `this black T-shirt`，即“这件黑色的T恤”。"}]},{"title":"组装完整问句","steps":[{"question":"我们已经确定了疑问词组 `How much` 和主语 `this black T-shirt`。剩下的动词 `is` 应该放在哪里？","hint":"参考特殊疑问句的结构：疑问词 + be动词 + 主语?","takeaway":"动词 `is` 应该放在疑问词组和主语之间。"},{"question":"现在，请将 `How much`, `is`, 和 `this black T-shirt` 按照正确的语序排列。","hint":"疑问词组 + 动词 + 主语。","takeaway":"组合起来就是 `How much is this black T-shirt?`。"}]}]}},{"number":"52","item_type":"sentence_transform","context_note":"","stem":"has, she, a, cat, blue (.)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"She has a blue cat.","explanation_md":"这是一个描述“某人拥有某物”的陈述句，遵循“主-谓-宾”结构。\n1.  首先确定句子的主语，即动作的发出者，这里是 `She` (她)。\n2.  然后找到谓语动词。表示“拥有”的动词是 `have`，但因为主语 `She` 是第三人称单数，所以要用 `has`。\n3.  最后是宾语，即被拥有的对象，这里是 `a blue cat` (一只蓝色的猫)。\n4.  注意形容词 `blue` 要放在名词 `cat` 前面，冠词 `a` 放在最前面。\n5.  将各部分按“主语+谓语+宾语”的顺序组合，得到 `She has a blue cat.`。","knowledge_expansion_md":"### 1. `have` 的第三人称单数形式 `has`\n- 在一般现在时中，当主语是第三人称单数（如 `he`, `she`, `it`, `Tom`, `my mother` 等）时，动词 `have` 需变为 `has`。\n- 其他人称（`I`, `you`, `we`, `they`）则使用原形 `have`。\n- 例：`I have a dog.` vs. `He has a dog.`\n\n### 2. 形容词作定语的位置\n- 在英语中，单个形容词作定语修饰名词时，通常放在名词的前面。这与中文的习惯一致。\n- 结构：**冠词 + 形容词 + 名词**\n- 例：`a blue cat` (一只蓝色的猫), `an interesting book` (一本有趣的书)。\n- 错误示例：`a cat blue` (这是典型的中式英语错误)。\n\n### 3. 不定冠词 `a` 和 `an`\n- `a` 和 `an` 都表示“一个”，用在单数可数名词前。\n- `a` 用在以**辅音音素**开头的单词前。例：`a cat`, `a blue car`, `a university` (university /juː/ 开头是辅音)。\n- `an` 用在以**元音音素**开头的单词前。例：`an apple`, `an orange`, `an hour` (hour /aʊər/ 开头是元音)。","socratic_tracks":[{"title":"主谓宾结构","steps":[{"question":"这个句子想表达谁拥有什么？","hint":"找一找表示人和动物的词。","takeaway":"句子想表达 `She` (她) 拥有 `cat` (猫)。"},{"question":"在英语陈述句中，“谁”、“做了什么”、“什么东西”这三部分的顺序是怎样的？","hint":"这就是我们常说的“主语”、“谓语”、“宾语”的顺序。","takeaway":"英语陈述句的基本结构是“主语+谓语+宾语” (SVO)。"}]},{"title":"动词的正确形式","steps":[{"question":"句子中表示“拥有”的动词是哪个？","hint":"它是 `have` 的一种形式。","takeaway":"是 `has`。"},{"question":"为什么这里用 `has` 而不是 `have`？","hint":"想一想主语 `She` 是第几人称，是单数还是复数？","takeaway":"因为主语 `She` 是第三人称单数，所以动词要用 `has` 的形式。"}]},{"title":"形容词与冠词的位置","steps":[{"question":"句子中哪些词是用来描述这只猫的？","hint":"有一个表示颜色的词和一个表示数量的词。","takeaway":"`a` (一只) 和 `blue` (蓝色的)。"},{"question":"在名词 `cat` 前面，`a` 和 `blue` 应该怎么排序？","hint":"我们是说“一只蓝色的猫”还是“蓝色的一只猫”？","takeaway":"正确的语序是冠词 `a` 在前，形容词 `blue` 居中，名词 `cat` 在后，构成 `a blue cat`。"}]}]}}]},{"section_title":"八、用完整的句子回答下列问题。(共5分)","section_instruction":"","items":[{"number":"63","item_type":"writing","context_note":"","stem":"Can you play the violin?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Yes, I can. I have been playing the violin for three years. I enjoy it very much because I love classical music. OR No, I can't, but I would love to learn it someday because it sounds so beautiful.","explanation_md":"此题考查对用情态动词 `can` 提问的回答能力。问题是“你会拉小提琴吗？”\n1.  首先，需要用 `Yes` 或 `No` 明确回答。\n2.  根据题目“用完整的句子回答”的要求，不能只答 `Yes/No`，而应使用 `Yes, I can.` 或 `No, I can't.` 这样的完整简答句。\n3.  为了展示更好的语言能力，可以在基本回答后进行扩展，例如说明自己学习了多久、是否喜欢，或者虽然不会但想学的原因等。\n4.  参考范文给出了肯定和否定两种情况下的优秀回答范例，都做到了信息完整且丰富。","knowledge_expansion_md":"### 情态动词 `Can` 的用法\n\n`Can` 是最常用的情态动词之一，其后必须跟动词原形。\n\n1.  **表示能力**：意为“能，会”。这是本题的考点。\n    *   例：*Birds can fly.* (鸟会飞。)\n    *   否定：*I can't swim.* (我不会游泳。)\n\n2.  **表示可能性**：意为“可能”。\n    *   例：*It can be very cold in winter.* (冬天可能会很冷。)\n\n3.  **表示允许或许可**：意为“可以”。\n    *   例：*You can use my pen.* (你可以用我的钢笔。)\n    *   提问：*Can I ask a question?* (我可以问个问题吗？)\n\n#### `Can you...?` 问句的回答\n\n*   这是一个一般疑问句，需要用 `Yes` 或 `No` 回答。\n*   标准简答形式为：*Yes, + 主语 + can.* / *No, + 主语 + can't.*\n*   例如，对 *Can you speak English?* 的回答：\n    *   简答：*Yes, I can.* / *No, I can't.*\n    *   详细回答：*Yes, I can speak a little English.* (是的，我会说一点英语。)","socratic_tracks":[{"title":"情态动词问答","steps":[{"question":"这个问题是用哪个词开头的？它在询问什么？","hint":"“Can” 这个词通常用来询问“能不能”、“会不会”。","takeaway":"问题以 `Can` 开头，是在询问对方是否具备拉小提琴的能力。"},{"question":"那么，回答这个问题时，肯定和否定回答的核心词应该是什么？","hint":"用什么来提问，就用什么来回答。肯定回答用 `can`，否定回答用 `can't`。","takeaway":"对于用情态动词 `can` 提问的问题，要用 `can` 或 `can't` 来做出相应回答。"}]},{"title":"构建完整句子","steps":[{"question":"如果只回答 “Yes” 或者 “No”，这个回答符合题目要求吗？为什么？","hint":"请仔细阅读大题的要求：“用完整的句子回答下列问题”。","takeaway":"只回答 Yes/No 是不完整的，不符合题目要求。"},{"question":"一个完整的简短回答应该是什么样的？","hint":"在 Yes/No 后面，需要加上主语和助动词/情态动词来构成一个完整的句子。","takeaway":"完整的简答形式是 “Yes, I can.” 或 “No, I can't.”。"},{"question":"如何让你的回答更上一层楼，展示你的英语水平？","hint":"在做出简短回答后，可以补充一些细节，比如你从什么时候开始学的，或者你为什么喜欢/不喜欢它。","takeaway":"在基本回答的基础上增加细节（如时间、原因、感受）是展示英语表达能力的好方法。"}]},{"title":"乐器词汇与搭配","steps":[{"question":"“play the violin” 这个短语中，为什么乐器 “violin” 前面要加 “the”？","hint":"想一想其他乐器，比如 “play the piano”, “play the guitar”。这是一个规律吗？","takeaway":"在英语中，动词 `play` 表示“演奏”某种乐器时，乐器名词前通常要加定冠词 `the`。"},{"question":"除了小提琴（violin），你还知道哪些其他乐器的英文名称？","hint":"钢琴、吉他、鼓、笛子……这些用英语怎么说？","takeaway":"积累乐器相关词汇，如 piano（钢琴）、guitar（吉他）、drums（鼓）、flute（笛子），可以丰富你的表达。"}]}]}},{"number":"64","item_type":"writing","context_note":"","stem":"Do you like English or maths? Why?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I like English better. I think it's an interesting and useful language. Learning English allows me to watch original movies and talk to people from different countries. It feels like opening a window to a new world.","explanation_md":"此题考查选择性问题及陈述理由的能力。问题是“你喜欢英语还是数学？为什么？”\n1.  这是一个选择疑问句（A or B），不能用 `Yes/No` 回答，必须在“英语”和“数学”中做出选择。\n2.  回答时，可以使用 `I like...` 或 `I prefer...` 等句型来表达偏好。\n3.  问题中的 `Why?` 要求你必须给出理由，这是得分的关键。你需要解释为什么你更喜欢所选的科目。\n4.  理由要具体、有说服力，例如可以从学科的趣味性、实用性、个人感受等方面展开。\n5.  范文清晰地表达了选择 (I like English better)，并从多个角度（有趣、有用、看电影、与人交流）阐述了原因，结构完整，内容充实。","knowledge_expansion_md":"### 如何回答选择疑问句及陈述理由\n\n1.  **选择疑问句 (Alternative Questions)**\n    *   这类问题通常用 `or` 连接两个或多个选项，要求回答者从中选择。\n    *   结构：一般疑问句 + `or` + 选项？ (e.g., *Do you want tea or coffee?*)\n    *   回答时不能用 `Yes/No`，必须明确说出你的选择。例：*I'd like some tea, please.*\n\n2.  **表达偏好 (Expressing Preferences)**\n    *   `I like A.` (我喜欢A。)\n    *   `I like A better than B.` (和B比，我更喜欢A。)\n    *   `I prefer A to B.` (比起B，我更喜欢A。) 注意这里用介词 `to`。\n    *   `My favorite is A.` (我最喜欢的是A。)\n\n3.  **陈述理由 (Giving Reasons)**\n    *   最常用的连词是 `because`，引导原因状语从句。\n    *   例：*I like English because it is interesting.*\n    *   也可以用 `The reason is that...` (原因是……) 或者 `This is because...` (这是因为……)。\n    *   为了使理由更充分，可以从不同方面展开，使用 `First... Second...` 或者 `Also...` 等连接词。","socratic_tracks":[{"title":"选择疑问句","steps":[{"question":"看到 “English or maths”，你知道这是一个什么类型的问句吗？","hint":"它提供了两个选项让你选择一个。","takeaway":"这是一个包含 `or` 的选择疑问句，要求在两者中做出选择。"},{"question":"回答这种选择疑问句时，能用 “Yes” 或 “No” 来回答吗？为什么？","hint":"如果你回答 “Yes”，别人知道你选的是英语还是数学吗？","takeaway":"回答选择疑问句时不能用 Yes/No，必须明确指出你选择的选项。"}]},{"title":"陈述理由","steps":[{"question":"题目中的 “Why?” 要求你做什么？","hint":"它在询问你做出选择的原因。","takeaway":"`Why?` 要求我们必须解释做出选择的理由。"},{"question":"我们通常用哪个词来引导一个表示原因的句子？","hint":"“因为”在英语里最常见的说法是什么？","takeaway":"回答 `Why` 的提问时，常用 `because` 来引导原因状语从句。"},{"question":"想一想，喜欢一个学科可以有哪些理由？","hint":"可以从“有趣”、“有用”、“老师好”、“我擅长”等方面思考。","takeaway":"陈述理由时，可以从趣味性、实用性、个人感受等多个角度展开，使内容更丰富。"}]},{"title":"表达偏好","steps":[{"question":"除了说 “I like English”，有没有其他更地道的说法来表达“我更喜欢英语”？","hint":"试着用 `better` (更) 或者 `prefer` (更喜欢) 这两个词。","takeaway":"可以使用 `I like English better.` 或 `I prefer English to maths.` 来更准确地表达偏好。"},{"question":"如果我想说“我两个都喜欢”，应该怎么表达呢？","hint":"“两者都”在英语里可以用哪个词来表示？","takeaway":"可以用 `both` 来表达两者都喜欢，例如 `I like both English and maths.`。"}]}]}},{"number":"65","item_type":"writing","context_note":"","stem":"What sports do you like?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I like many sports, but my favorite is basketball. I often play basketball with my friends after school. I think it's an exciting game and it helps me stay healthy. It also teaches me the importance of teamwork.","explanation_md":"此题考查对特殊疑问句的回答能力，具体是询问个人喜好。\n1.  问题以 `What` 开头，询问“什么运动”，因此回答时需要具体列出运动的名称。\n2.  可以直接回答 `I like...` 并列举运动，如 `I like swimming and running.`。\n3.  为了使回答更充实，可以像范文一样，先总说，再突出最爱的一个 (`my favorite is...`)。\n4.  进一步地，可以补充细节，如：你和谁一起运动 (with my friends)、运动的频率 (often)、运动的地点 (after school)、以及喜欢这项运动的原因（exciting, stay healthy, teamwork）。\n5.  这样的回答不仅切题，还能充分展示你的词汇量和句子组织能力。","knowledge_expansion_md":"### 运动话题相关表达\n\n1.  **动词搭配**：谈论运动时，`play`, `go`, `do` 的用法有区别。\n    *   **play** + 球类、棋类、团队性运动：*play football, play basketball, play chess*\n    *   **go** + 以-ing结尾的运动（通常是室外的、可单独进行的）：*go swimming, go running, go skiing, go fishing*\n    *   **do** + 体操、武术、瑜伽等（通常是室内的、无需器械或有固定套路的）：*do kung fu, do gymnastics, do yoga*\n\n2.  **表达频率的副词 (Adverbs of Frequency)**：可以用来描述你做运动的频繁程度。\n    *   *always* (总是), *usually* (通常), *often* (经常), *sometimes* (有时), *seldom/rarely* (很少), *never* (从不)\n    *   也可以用短语：*every day* (每天), *once a week* (一周一次), *twice a month* (一月两次)\n\n3.  **表达好处的词汇和句型**：\n    *   *keep/stay healthy* (保持健康)\n    *   *build my body* (强身健体)\n    *   *make me relaxed* (让我放松)\n    *   *learn about teamwork* (学习团队合作)","socratic_tracks":[{"title":"Wh-疑问句","steps":[{"question":"这个问题以 “What” 开头，它在询问什么类型的信息？","hint":"它不是在问“是”或“不是”，而是想知道具体的内容。","takeaway":"回答 `What` 引导的特殊疑问句，需要提供具体的信息，也就是你喜欢的运动项目。"},{"question":"回答 “What sports do you like?” 时，可以直接说出运动名称吗？","hint":"比如只回答 “Basketball.”，这样礼貌和完整吗？","takeaway":"为了使回答完整且礼貌，应该使用完整的句子，如 “I like basketball.”。"}]},{"title":"词汇与搭配","steps":[{"question":"谈论不同的运动时，我们通常用 `play`, `go`, `do` 这三个动词。你知道它们分别和哪些运动搭配吗？","hint":"比如篮球是 `play basketball`，那游泳呢？功夫呢？","takeaway":"掌握 `play`+球类, `go`+V-ing, `do`+武术/体操 的搭配规则，是地道表达的关键。"},{"question":"试着用正确的动词说出：打网球，去滑冰，练柔道。","hint":"网球是 ball game，滑冰是 -ing 运动，柔道是 martial art。","takeaway":"正确的搭配是：`play tennis`, `go skating`, `do judo`。"}]},{"title":"丰富回答内容","steps":[{"question":"除了说出你喜欢的运动，你还可以补充哪些信息让你的回答更有趣？","hint":"比如，你和谁一起做这项运动？多久一次？为什么喜欢它？","takeaway":"通过增加时间、地点、人物、原因等细节，可以让回答更生动、更具说服力。"},{"question":"我们来试着描述一下为什么喜欢一项运动。比如，打篮球有什么好处？","hint":"对身体有什么好处？对精神或性格有什么好处？","takeaway":"可以说 “It helps me stay healthy.” (它帮我保持健康) 和 “It teaches me about teamwork.” (它教会我团队合作)。"}]}]}},{"number":"66","item_type":"writing","context_note":"","stem":"When did you start to learn English?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I started to learn English when I was five years old, in my first year of kindergarten. My parents thought it was important to start early. At first, we learned through songs and games, which was a lot of fun. I have been learning for seven years now, and I find it more and more interesting. I hope I can speak English fluently with foreigners one day.","explanation_md":"本题旨在考察学生能否使用正确的时态和句型，就个人经历进行回答。\n1.  **识别问题关键点**：问题是 “When did you start...?”，关键词是 “When”（何时）和 “did start”（过去开始）。\n2.  **确定核心时态**：问句使用了过去时 “did”，因此回答的主句应使用一般过去时，即 “I started...”。\n3.  **提供具体信息**：回答“When”的问题，需要给出一个明确的时间点，例如 “when I was five years old”、“three years ago” 或 “in Grade One”。\n4.  **拓展内容**：为了展示更好的语言能力，可以在回答核心问题的基础上，增加一些细节，如开始学习英语的原因、方式、感受或学习时长等，使回答更丰满。","knowledge_expansion_md":"### 1. 核心语法：一般过去时\n一般过去时用于描述过去发生且已经结束的动作或状态。其标志词常为 `yesterday`, `last week`, `... ago`, `in 2010`, `just now` 等。\n- **问句形式**：`Did + 主语 + 动词原形 ...?`\n  *例：Did you finish your homework?*\n- **肯定回答**：`主语 + 动词过去式 ...`\n  *例：I started to learn English at the age of five.*\n\n### 2. 时态的延伸：现在完成进行时\n如果你想表达“从过去开始，一直持续到现在的动作”，可以使用现在完成时或现在完成进行时，这能体现出更高的语法水平。\n- **句型**：`主语 + have/has been + doing + for/since ...`\n- **应用**：在回答完 “I started...” 之后，可以补充一句：`I have been learning English for seven years.` (我学英语已经七年了。) 这表明学习状态的持续性。\n\n### 3. 表达“时间点”的多种方式\n- `at the age of + 年龄`: at the age of six\n- `when + 从句`: when I was in kindergarten\n- `... years/months ago`: three years ago\n- `in + 年份/年级`: in 2018 / in Grade One","socratic_tracks":[{"title":"问句与答句的时态一致性","steps":[{"question":"看到题目中的 “did”，它在提示我们什么时态？","hint":"想想 do/does 的过去式是什么？","takeaway":"“did” 是过去时态的助动词，表示问题是关于过去发生的事情。"},{"question":"既然问题是关于过去的，那么回答时，动词 “start” 应该用什么形式？是 “I start...”，还是 “I started...”？","hint":"回答需要和提问的时态保持一致。","takeaway":"问句是过去时，答句的核心动词也应该使用相应的过去式。"},{"question":"如果你想表达“从过去开始，一直学到现在”这个持续的状态，可以用什么更高级的时态来补充说明呢？","hint":"想想表示“已经”和“正在”的组合时态。","takeaway":"使用现在完成进行时（I have been learning...）可以准确表达从过去持续到现在的动作，使语言更地道。"}]},{"title":"如何具体描述“时间”","steps":[{"question":"题目问 “When”（何时），最直接的回答是给出一个时间。除了说 “在我五岁的时候”，你还能想到哪些表达方式？","hint":"可以从“...年前”或者“在我上...年级的时候”等角度思考。","takeaway":"描述过去的时间点，可以用 “... ago”, “when I was...”, “at the age of...” 等多种句式。"},{"question":"假设你今年12岁，6岁开始学英语，那么你是几年前开始学的？试着用 “... ago” 这个词组来表达。","hint":"用现在的年龄减去开始时的年龄。","takeaway":"“... ago” 是一个非常实用的词组，可以准确地从现在回溯过去的时间，例如 “six years ago”。"}]},{"title":"让回答更丰满的技巧","steps":[{"question":"只回答 “I started learning English when I was five.” 虽然正确，但略显简单。想让回答更出色，我们还能补充哪些信息？","hint":"围绕“学英语”这件事，可以聊聊原因、方式、感受、时长等。","takeaway":"在回答核心问题的基础上，增加相关的细节是展示语言组织能力和获取高分的关键。"},{"question":"比如，你可以补充一句你最初是怎么学英语的。是通过上课，还是通过看动画片？","hint":"描述具体的学习场景，例如 “My teacher taught me some English songs.”","takeaway":"补充具体的学习方式或经历，能让你的回答更具个性和说服力。"}]}]}},{"number":"67","item_type":"writing","context_note":"","stem":"What are you going to do this summer vacation?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"This summer vacation, I am going to have a very busy but exciting time. First, I plan to take a swimming class because I want to learn a new skill. Then, my family and I will travel to Qingdao for a week to enjoy the sea and the beautiful beaches. Besides that, I will also spend some time reading my favorite books and preparing for the new semester. I can't wait for the vacation to start!","explanation_md":"本题旨在考察学生对未来计划的表达能力。\n1.  **识别问题关键点**：问题是 “What are you going to do...?”，关键词是 “What”（做什么）和 “are you going to”（将来计划）。\n2.  **确定核心时态/句型**：问句使用了 “be going to” 结构，因此回答时应主要使用 “I am going to...” 或 “I will...” 来描述将来的计划。\n3.  **构思内容**：回答“What”的问题，需要列举具体的活动。可以从不同方面构思，如学习（reading books）、旅行（traveling）、发展兴趣（learning to swim）、休闲（visiting friends）等。\n4.  **组织答案**：为了使回答条理清晰，可以使用 “First...”, “Then...”, “Also...” 等过渡词来连接不同的活动。\n5.  **润色结尾**：在列举完计划后，可以加上一句总结性或表达情感的话，如 “I think it will be a meaningful vacation.” 或 “I'm looking forward to it!” 使回答更完整。","knowledge_expansion_md":"### 1. 核心语法：表达将来计划的三种方式\n- **`be going to + 动词原形`**：表示事先已经想好、计划好的事情。这是本题最直接的回答句型。\n  *例：I'm going to visit my grandparents.*\n- **`will + 动词原形`**：也可以表示计划和意愿，与 `be going to` 在很多情境下可以互换。\n  *例：I will read three books this summer.*\n- **`现在进行时（be doing）`**：表示已经安排好的、确定会发生的未来活动，常与具体的时间状语连用。\n  *例：We are flying to Sanya next Monday.*\n\n### 2. 丰富内容的词汇库\n- **旅行类**：`go on a trip to...`, `travel with my family`, `visit the beach/mountains`, `see the sights`\n- **学习类**：`take a summer course`, `prepare for the next semester`, `read some interesting books`, `learn a new skill` (e.g., `learn to play the guitar`, `learn coding`)\n- **兴趣爱好类**：`do some sports` (e.g., `play basketball`, `go swimming`), `watch movies`, `hang out with friends`, `do some painting`\n\n### 3. 使回答更有条理的过渡词\n- **开头**: `First of all,` / `To begin with,`\n- **中间**: `Second,` / `Then,` / `Next,` / `After that,` / `Also,` / `Besides,`\n- **结尾**: `Finally,` / `Last but not least,`","socratic_tracks":[{"title":"如何正确表达“将来计划”","steps":[{"question":"题目中的 “are you going to” 是在问你关于什么时间的安排？","hint":"这个句型是我们在英语中谈论未来时最常用的句型之一。","takeaway":"“be going to” 结构是用来询问将来打算和计划的。"},{"question":"那么，在回答时，你应该使用什么句型来描述你的计划呢？","hint":"模仿问题的句型来回答通常是最安全和最准确的方式。","takeaway":"使用 “I am going to...” 来回答是完全正确的，也可以使用 “I will...” 来表达意愿和计划。"}]},{"title":"丰富你的“暑假活动”","steps":[{"question":"一个精彩的暑假通常包含哪些类型的活动？试着从“动”和“静”两个方面来想。","hint":"“动”可以是旅行、运动；“静”可以是阅读、学习新技能。","takeaway":"将不同类型的活动（如旅行、学习、运动、休闲）组合起来，能让你的回答内容更丰富、有趣。"},{"question":"如果说 “I am going to study”，这个表达是不是有点太笼统了？怎样能让它更具体、更生动？","hint":"“学习”具体是学习什么？比如，读什么书？学什么课？","takeaway":"用具体的活动（如 “read Harry Potter”）代替笼统的词（如 “study”），能让你的描述更有画面感。"},{"question":"除了说 “travel”，你还能想到哪些更具体的关于旅行的表达？","hint":"比如，去哪里旅行？和谁一起？去那里做什么？","takeaway":"细节决定成败。描述活动时，加入地点、同伴、目的等细节，能让你的回答更具说服力。"}]},{"title":"让回答更有条理","steps":[{"question":"如果你计划了三件事，直接说 “I will do A. I will do B. I will do C.” 听起来会不会有点单调和重复？","hint":"想想我们写作文时，段落之间是如何连接的。","takeaway":"简单地罗列观点会显得语言能力不足，我们需要用一些词来把它们串联起来。"},{"question":"我们可以用哪些词来表示“首先”、“然后”、“另外”？","hint":"比如 F____, T____, A____。","takeaway":"使用 “First”, “Then/Next”, “Also/Besides” 等过渡词，能让你的回答逻辑清晰，结构井然。"},{"question":"在说完所有计划后，加上一句 “I can't wait for the vacation!” 会有什么效果？","hint":"这句话表达了什么情绪？放在结尾合适吗？","takeaway":"用一句表达期盼或总结的话来结尾，能让你的回答更完整，并能有效调动听者的情绪共鸣。"}]}]}}]}],"content_markdown":"# 成都嘉祥外国语学校(成华校区) 2026级新初一入学真卷英语(二)\n\n**满分:100分 时间:60分钟**\n\n## 一、用 is, am 或 are 填空。(共9分)\n\n1. Excuse me. What _____ this in English?\n2. _____ this your coat, Mr Green? —Yes, it _____.\n3. What _____ these? _____ they maps?\n4. This _____ your bike. Where _____ my bike?\n5. I _____ in Class Eleven. What class _____ you in?\n\n## 二、单项填空。(共30分)\n\n6. —What's your name, please? —_____\n\tA. It's Tom\n\tB. My name is Tom\n\tC. \n\tD. \n7. —Hello, Lin Tao. How are you? —_____\n\tA. Hello. Li Ming. How are you?\n\tB. Good morning, Li Ming.\n\tC. Thank you.\n\tD. Fine, thank you.\n8. —_____ is that ruler. It is not _____ eraser.\n\tA. /; an\n\tB. a; an\n\tC. the; the\n\tD. /; the\n9. —Is that your watch over there? —No, it's _____.\n\tA. my\n\tB. this\n\tC. my father's\n\tD. mine\n10. —What _____ do you speak? —I speak Chinese.\n\tA. language\n\tB. science\n\tC. subject\n\tD. colour\n11. Thanks _____ your present.\n\tA. of\n\tB. from\n\tC. for\n\tD. to\n12. Is _____ your aunt? What's _____ name?\n\tA. he; his\n\tB. she; her\n\tC. he; her\n\tD. she; his\n13. The movie is very _____ and I like it.\n\tA. boring\n\tB. interested\n\tC. interesting\n\tD. difficult\n14. _____ your brother _____ a soccer ball?\n\tA. Do; has\n\tB. Do; have\n\tC. Does; has\n\tD. Does; have\n15. —Let's _____ basketball. —Good idea!\n\tA. plays\n\tB. to play\n\tC. play\n\tD. playing\n16. Mike doesn't play sports. He only _____ them on TV.\n\tA. sees\n\tB. watches\n\tC. looks at\n\tD. finds\n17. I need to write a lost note. Can you _____ me _____?\n\tA. take; a pencil\n\tB. bring; some books\n\tC. take; some papers\n\tD. bring; a pen\n18. He wants _____ the art club.\n\tA. to join\n\tB. join\n\tC. joins\n\tD. joining\n19. —How does your father go to work every day? —_____ taxi.\n\tA. In\n\tB. By\n\tC. On\n\tD. With\n20. Yesterday after class I _____ my homework.\n\tA. do\n\tB. did\n\tC. make\n\tD. made\n\n## 三、完形填空。(共10分)\n\nA boy and a girl catch a bird and (21)_____ it in a birdcage(鸟笼). They like it (22)_____ and (23)_____ it every day. A cat sees the bird and wants (24)_____ her supper. (25)_____ the bird is in the cage. She can't catch it. So she is very (26)_____.\nOne day, she opens the door of the cage. She (27)_____ wants to catch it. But the bird flies away. The cat (28)_____ and she has (29)_____ to eat. The two children (30)_____ and see the bird isn't in it. They are very angry and put the cat into the cage.\n\n21. \n\tA. take\n\tB. put\n\tC. carry\n\tD. bring\n22. \n\tA. well\n\tB. very\n\tC. much\n\tD. very much\n23. \n\tA. look\n\tB. watch\n\tC. have a look\n\tD. have a look at\n24. \n\tA. have it for\n\tB. has it for\n\tC. to have it for\n\tD. to has it for\n25. \n\tA. But\n\tB. And\n\tC. So\n\tD. Then\n26. \n\tA. angry\n\tB. sad\n\tC. glad\n\tD. tired\n27. \n\tA. but\n\tB. and\n\tC. so\n\tD. or\n28. \n\tA. can to fly\n\tB. can fly\n\tC. can't to fly\n\tD. can't fly\n29. \n\tA. no way\n\tB. some way\n\tC. any way\n\tD. not way\n30. \n\tA. come back to home\n\tB. come back home\n\tC. come to home\n\tD. back home\n\n## 四、阅读理解。(共18分)\n\n**A**\nAn old tiger lives in the forest. He doesn't want to look for food now. He often tells other animals to get him something to eat.\nHe sees a monkey and says, \"I'm hungry, Monkey. Go to the village and get me a fat pig.\"\n\"Oh, Tiger,\" says the monkey, \"I can't do that now. There is another tiger over there. He also wants a fat pig. He will not let me get anything for you to eat. I am afraid of him.\"\n\"What?\" cries the old tiger. \"Show me that tiger. I will eat him.\"\n\"Come with me,\" says the monkey.\nThe monkey and the tiger get to the bridge over the river. \"Now look down at the water,\" says the monkey. \"Do you see it? The tiger?\"\n\"Yes, I do,\" cries the old tiger. \"I will eat him up!\" With these words, the tiger jumps into the river.\n\n31. How many tigers and monkeys are there in the story?\n\tA. Two tigers and one monkey.\n\tB. Two tigers and two monkeys.\n\tC. Only one tiger and one monkey.\n\tD. Two monkeys and one tiger.\n32. Why does the tiger tell the other animals to get him food? Because _____.\n\tA. only they can look for some food\n\tB. he is old and they are afraid of him\n\tC. he gets to the bridge with the tiger\n\tD. he tells the tiger to jump into the water\n33. The monkey _____.\n\tA. goes to the village to get a pig\n\tB. knows there is another tiger\n\tC. gets to the bridge with the tiger\n\tD. tells the tiger to jump into the water\n34. Which of the following is RIGHT?\n\tA. The monkey eats up the tiger.\n\tB. The tiger eats up another tiger.\n\tC. The tiger jumps into the water.\n\tD. The tiger is clever.\n\n**B**\nMrs Green is going to give a birthday party to Mary. Mary is her daughter. She will be ten years old. A lot of her friends are coming to the party. Twenty of them are girls.\nMrs Green is getting ready for the party. Mrs White is helping her.\n\"That's a big nice cake,\" says Mrs White to Mrs Green.\n\"Thank you very much.\"\nMrs Green is going shopping now. She is going to buy fruit for the party. Mrs Green buys a lot of pears, apples, oranges and bananas. Then she goes home.\nIt's five o'clock in the afternoon. Everything is ready. Now the first girl is arriving. The party is going to begin in thirty minutes.\n\n35. Who is Mrs Green going to give a birthday party to?\n36. How old is Mary?\n37. What does Mrs Green buy for the party?\n38. When is the party going to begin?\n39. How many girls are there at the party?\n\n## 五、根据所给单词的适当形式填空。(共8分)\n\n40. In our school, we have many _____ (club).\n41. Helen can _____ (speak) three languages.\n42. The Whites have four _____ (child), two daughters and two sons.\n43. My pen pal _____ (live) in Japan.\n44. I want to eat _____ (a) apple.\n45. Please come and _____ (help) me.\n46. She _____ (have) a dictionary.\n47. There isn't _____ (some) tea in the cup.\n\n## 六、连词成句。(共10分)\n\n48. are, brothers, those, my (.)\n49. table, backpack, the, my, is, under (.)\n50. number, phone, your, is, what (?)\n51. this, black, how, much, is, T-shirt (?)\n52. has, she, a, cat, blue (.)\n\n## 七、根据上下文和首字母，补全一词。(共10分)\n\nA: Can I help you?\nB: (53) Y_____, I want a pair of pants.\nA: What (54) c_____ do you (55) w_____?\nB: Black.\nA: Here (56) a_____. (57) H_____ are they?\nB: (58) H_____ (59) m_____ are they?\nA: 35 dollars.\nB: I'll take them. (60) T_____ you.\nA: You're (61) w_____.\n\n## 八、用完整的句子回答下列问题。(共5分)\n\n63. Can you play the violin?\n64. Do you like English or maths? Why?\n65. What sports do you like?\n66. When did you start to learn English?\n67. What are you going to do this summer vacation?","proofread_notes":"1. 第6题原为两选项，已按四选项题型补全 C、D 空选项。\n2. 阅读理解B篇（35-39题）原 item_type 为 'reading'，因题型为简答题，已修正为 'writing' 以准确描述作答方式。\n3. 第七大题含9个小题（53-61），但总分标注为“共10分”，此差异源自试卷，予以保留。\n4. 试卷题号从61题直接跳至63题，缺少62题，已按原卷保留此跳号。","set_number":3,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_03\\page_010.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_03\\page_011.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":66},{"step":2,"name":"verify","items":66,"check_passed":false,"issues_count":7},{"step":3,"name":"polish","items":66}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T12:10:57.405315+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
  <script>
  const EXAM = JSON.parse(document.getElementById("exam-embed").textContent);

  const INLINE_CFG = {
    deepseekKey: "sk-daa16008e81843deba6fefe9dce51465",
    azureKey: "8d055d682fcd4af98a51828e04542cd4",
    azureRegion: "southeastasia",
  };

  let modalWordForTts = "";

  function hasDeepseekKey() {
    const k = String(INLINE_CFG.deepseekKey || "").trim();
    return k.length >= 8;
  }

  async function deepseekChat(userContent, maxTokens) {
    if (!hasDeepseekKey()) {
      throw new Error("未配置 DeepSeek API Key");
    }
    const r = await fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + INLINE_CFG.deepseekKey,
      },
      body: JSON.stringify({
        model: "deepseek-v4-flash",
        messages: [{ role: "user", content: userContent }],
        temperature: 0.2,
        max_tokens: maxTokens || 4096,
      }),
    });
    let data = {};
    try { data = await r.json(); } catch (e) { /* ignore */ }
    if (!r.ok) {
      const msg = (data.error && data.error.message) || data.detail || r.statusText || "请求失败";
      throw new Error(msg);
    }
    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return (c || "").trim();
  }

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    choice: "单项选择",
    cloze: "完形填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",
    fill_blank_be: "用 am / is / are 填空",
    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "choice",
    "cloze",
    "reading",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",
    "fill_blank",
    "other",
  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  const state = {
    flat: [],
    byType: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
    });
  }

  function typeLabel(t) { return TYPE_LABELS[t] || t || "其他"; }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
