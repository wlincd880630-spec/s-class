<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第04套","exam_meta":{"full_score_text":"满分:50分","time_text":"时间:60分钟","type_card_order":"paper"},"sections":[{"section_title":"I. 语音辨识。(共5分)","section_instruction":"判断下列单词划线部分是否相同。","items":[{"number":"1","item_type":"phonetics","context_note":"","stem":"A. \u003cu>a\u003c/u>pple B. c\u003cu>a\u003c/u>ke","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查字母 'a' 在不同单词中的发音。在单词 `apple` 中，字母 'a' 位于重读闭音节，发短元音 /æ/。在单词 `cake` 中，字母 'a' 处于“元音-辅音-e”结构中，发其字母本身的音，即长元音 /eɪ/。由于 /æ/ 和 /eɪ/ 是两个不同的音素，因此这两个单词中 'a' 的发音不同。","knowledge_expansion_md":"字母 'a' 是英语中发音规则最复杂的元音字母之一，其常见发音有：\n1.  **在重读闭音节中发 /æ/**，例如：`cat`, `bag`, `map`。\n2.  **在重读开音节或“a-辅音-e”结构中发 /eɪ/**，例如：`paper`, `name`, `face`。\n3.  **在 `w` 或 `wh` 之后常发 /ɒ/**，例如：`watch`, `what`, `want`。\n4.  **在 `l` 前面有时发 /ɔː/**，例如：`ball`, `talk`, `small`。\n5.  **在非重读音节中发弱化音 /ə/**，例如：`about`, `banana`, `again`。\n掌握这些基本规则是辨别发音题的关键。","socratic_tracks":[{"title":"字母 a 的发音规则","steps":[{"question":"请读一下 `apple` 这个单词，你觉得里面的 'a' 是怎么发音的？你还能想到其他有这个发音的单词吗？","hint":"嘴巴张大，舌头放平，像在说“啊”但更扁一点。想想“猫”(cat)、“包”(bag)。","takeaway":"在重读闭音节中，字母 'a' 通常发短元音 /æ/。"},{"question":"再读一下 `cake` 这个单词，它的 'a' 发音和 `apple` 一样吗？你觉得是什么导致了发音不同？","hint":"注意单词末尾的 'e'，它虽然不发音，但会影响前面元音的发音。","takeaway":"在“a-辅音-e”结构中，字母 'a' 发长元音 /eɪ/。"}]},{"title":"开音节与闭音节","steps":[{"question":"你知道什么是闭音节吗？看看 `apple` (/ˈæp.əl/) 的第一个音节 `ap`，它是以什么结尾的？","hint":"闭音节通常是以一个或多个辅音字母结尾，且元音发短音的音节。","takeaway":"以辅音结尾的音节是闭音节，其中的元音字母通常发短元音。"},{"question":"那什么是开音节呢？`cake` 这个词虽然只有一个音节，但它的元音发音符合开音节的规则，为什么呢？","hint":"想一想单词末尾不发音的 'e' 起到了什么作用？它让元音 'a' 发出了它自己的名字音。这种结构我们称之为“相对开音节”。","takeaway":"在相对开音节（元音-辅音-e）中，元音字母发其字母音（长元音）。"}]},{"title":"单词对比辨音","steps":[{"question":"我们来对比 `hat` (帽子) 和 `hate` (讨厌) 这两个词，你觉得它们的读音有什么不同？","hint":"仔细听元音 'a' 的部分，一个短促，一个悠长。","takeaway":"`hat` 中的 'a' 发 /æ/，而 `hate` 中的 'a' 发 /eɪ/。"},{"question":"那么 `apple` 和 `cake` 的发音差异，是不是和 `hat` 与 `hate` 的差异很像？","hint":"将 `apple` 的 /æ/ 音与 `hat` 对应，将 `cake` 的 /eɪ/ 音与 `hate` 对应。","takeaway":"`apple` 和 `cake` 中元音 'a' 的发音不同，分别是 /æ/ 和 /eɪ/。"}]}]}},{"number":"2","item_type":"phonetics","context_note":"","stem":"A. g\u003cu>ir\u003c/u>l B. n\u003cu>ur\u003c/u>se","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"本题考查元音组合 'ir' 和 'ur' 的发音。在单词 `girl` 中，字母组合 'ir' 发长元音 /ɜː/。在单词 `nurse` 中，字母组合 'ur' 同样发长元音 /ɜː/。因此，这两个单词中划线部分的读音是相同的。","knowledge_expansion_md":"在英语中，有多个字母组合都可以发长元音 /ɜː/，这个音被称为“卷舌元音”。常见的组合有：\n1.  **ir**: `bird`, `shirt`, `first`, `circle`\n2.  **ur**: `turn`, `burn`, `purple`, `Thursday`\n3.  **er**: `her`, `serve`, `person` (通常在重读音节中)\n4.  **ear**: `learn`, `earth`, `search`\n5.  **or** (在 w 之后): `word`, `work`, `world`\n将这些发音相同的组合归类记忆，可以有效提高辨音能力。","socratic_tracks":[{"title":"元音组合 ir/ur 的发音","steps":[{"question":"`girl` 这个单词里的 'ir' 是怎么发音的？你还能想到其他包含 'ir' 并且发这个音的单词吗？","hint":"比如“鸟”(bird)，“衬衫”(shirt)。","takeaway":"字母组合 'ir' 在重读音节中通常发长元音 /ɜː/。"},{"question":"那 `nurse` 这个单词里的 'ur' 又是怎么发音的呢？它和 `girl` 里的 'ir' 发音一样吗？","hint":"试着读一下“转弯”(turn)，“燃烧”(burn)。","takeaway":"字母组合 'ur' 在重读音节中也发长元音 /ɜː/，与 'ir' 的发音相同。"}]},{"title":"归纳发 /ɜː/ 的组合","steps":[{"question":"除了 'ir' 和 'ur'，你还知道哪些字母组合可以发 /ɜː/ 这个音吗？想想“她”(her)这个词。","hint":"'er' 组合也可以发这个音。","takeaway":"字母组合 'er' 在重读音节中也可以发 /ɜː/ 音。"},{"question":"我们再看几个词：`learn` (学习), `work` (工作)。它们的元音部分发音是不是也是 /ɜː/？","hint":"`learn` 中的 'ear' 和 `work` 中 'w' 后面的 'or' 都发这个音。","takeaway":"'ear' 和 'wor' 组合有时也发 /ɜː/ 音，这是一个重要的发音规律。"}]},{"title":"单词对比辨音","steps":[{"question":"听一听 `bird` (鸟) 和 `word` (单词) 这两个词，它们的元音发音一样吗？","hint":"仔细听 `b` 和 `d` 中间的元音，以及 `w` 和 `d` 中间的元音。","takeaway":"`bird` 中的 'ir' 和 `word` 中的 'or' 都发 /ɜː/ 音，所以元音发音相同。"},{"question":"那么 `girl` 和 `nurse` 的元音发音呢？是不是也和 `bird`, `word` 一样？","hint":"比较 `girl` /ɜː/ 和 `nurse` /ɜː/。","takeaway":"`girl` 和 `nurse` 的核心元音发音都是 /ɜː/，因此它们是相同的。"}]}]}},{"number":"3","item_type":"phonetics","context_note":"","stem":"A. h\u003cu>o\u003c/u>me B. d\u003cu>o\u003c/u>g","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查字母 'o' 在不同单词中的发音。在单词 `home` 中，字母 'o' 处于“元音-辅音-e”结构中，发双元音 /əʊ/。在单词 `dog` 中，字母 'o' 位于重读闭音节，发短元音 /ɒ/。由于 /əʊ/ 和 /ɒ/ 是两个不同的音素，因此这两个单词中 'o' 的发音不同。","knowledge_expansion_md":"字母 'o' 的发音规则也比较多样，主要包括：\n1.  **在重读闭音节中发 /ɒ/**，例如：`hot`, `box`, `stop`, `clock`。\n2.  **在重读开音节或“o-辅音-e”结构中发 /əʊ/**，例如：`go`, `no`, `note`, `hope`, `stone`。\n3.  **在字母 `m, n, v, th` 前有时发 /ʌ/**，例如：`come`, `son`, `love`, `mother`。\n4.  **字母组合 `oo`** 有两种主要发音：长音 /uː/ (如 `food`) 和短音 /ʊ/ (如 `book`)。\n5.  **在非重读音节中发弱化音 /ə/**，例如：`today`, `lesson`, `carrot`。","socratic_tracks":[{"title":"字母 o 的发音规则","steps":[{"question":"`home` 这个单词里的 'o' 是怎么发音的？它为什么会这样发音？","hint":"注意单词末尾不发音的 'e'，它改变了前面元音 'o' 的读法。","takeaway":"在“o-辅音-e”结构中，字母 'o' 通常发双元音 /əʊ/。"},{"question":"`dog` 这个单词里的 'o' 又是怎么发音的呢？它和 `home` 里的 'o' 发音一样吗？","hint":"`dog` 是一个典型的闭音节单词，想想 `hot`, `box` 里的 'o' 是怎么读的。","takeaway":"在重读闭音节中，字母 'o' 通常发短元音 /ɒ/，与 /əʊ/ 不同。"}]},{"title":"开音节与闭音节（o）","steps":[{"question":"`dog` 是一个闭音节单词，它的元音 'o' 发短音 /ɒ/。你能举出更多 'o' 发 /ɒ/ 音的闭音节单词吗？","hint":"想想一些常见的三字母单词，比如“锅”(pot)、“顶部”(top)。","takeaway":"闭音节中的 'o' 通常发短元音 /ɒ/。"},{"question":"`home` 这个词因为末尾的 'e' 构成了相对开音节，所以 'o' 发长音 /əʊ/。那如果一个单词本身就是开音节，比如 `go`，它的 'o' 怎么发音？","hint":"`go` 的音节以元音 'o' 结尾，没有辅音把它“关起来”。","takeaway":"在开音节中，字母 'o' 也发长元音 /əʊ/。"}]},{"title":"单词对比辨音","steps":[{"question":"我们来对比 `hop` (单脚跳) 和 `hope` (希望) 这两个词，它们的读音有什么关键区别？","hint":"重点听元音 'o' 的部分。","takeaway":"`hop` 中的 'o' 发 /ɒ/，而 `hope` 中的 'o' 发 /əʊ/。"},{"question":"那么 `dog` 和 `home` 的发音差异，是不是和 `hop` 与 `hope` 的差异是同一种类型？","hint":"`dog` 对应 `hop` 的发音类型，`home` 对应 `hope` 的发音类型。","takeaway":"`dog` 和 `home` 中元音 'o' 的发音不同，分别是 /ɒ/ 和 /əʊ/。"}]}]}},{"number":"4","item_type":"phonetics","context_note":"","stem":"A. f\u003cu>oo\u003c/u>d B. l\u003cu>oo\u003c/u>k","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查字母组合 'oo' 的两种常见发音。在单词 `food` 中，'oo' 发长元音 /uː/。而在单词 `look` 中，'oo' 发短元音 /ʊ/。虽然两个单词都含有 'oo' 组合，但它们的发音一个是长的、一个是短的，因此是不同的。","knowledge_expansion_md":"字母组合 'oo' 的发音是英语初学者的一个难点，主要有两种情况：\n1.  **发长元音 /uː/**：发音时嘴唇收圆，舌后部抬高，音长而饱满。例如：`food`, `boot`, `pool`, `moon`, `room`, `zoo`。\n2.  **发短元音 /ʊ/**：发音时嘴唇放松，舌后部抬起，音短而急促。常出现在字母 `k` 前。例如：`look`, `book`, `cook`, `good`, `foot`, `wood`。\n**特殊情况**：在 `blood` 和 `flood` 中，'oo' 发 /ʌ/ 音，需要特殊记忆。","socratic_tracks":[{"title":"字母组合 oo 的两种发音","steps":[{"question":"`food` 这个单词里的 'oo' 是怎么发音的？你还能想到其他发这个长音的 'oo' 单词吗？","hint":"比如“月亮”(moon)、“房间”(room)。这个音比较长。","takeaway":"字母组合 'oo' 可以发长元音 /uː/。"},{"question":"`look` 这个单词里的 'oo' 又是怎么发音的呢？它和 `food` 里的 'oo' 发音一样吗？","hint":"比如“书”(book)、“好的”(good)。这个音比较短促。","takeaway":"字母组合 'oo' 也可以发短元音 /ʊ/，它与 /uː/ 是不同的。"}]},{"title":"探寻 oo 发音的规律","steps":[{"question":"我们来看一组单词：`book`, `cook`, `look`, `took`。它们有什么共同点？","hint":"注意 'oo' 后面的字母，以及它们的发音。","takeaway":"当 'oo' 后面跟着字母 'k' 时，通常发短元音 /ʊ/。"},{"question":"再来看一组单词：`moon`, `soon`, `noon`。它们又有什么共同点呢？","hint":"注意 'oo' 后面的字母，以及它们的发音。","takeaway":"当 'oo' 后面跟着字母 'n' 时，通常发长元音 /uː/。虽然这不是绝对规则，但能帮助我们记忆。"}]},{"title":"特殊情况与易错点","steps":[{"question":"你知道 `good` 和 `food` 的 'oo' 发音不同。那 `blood` (血) 和 `flood` (洪水) 这两个词里的 'oo' 怎么发音呢？","hint":"它的发音和 `cup`, `bus` 里的 'u' 是一样的。","takeaway":"在 `blood` 和 `flood` 中，'oo' 发 /ʌ/ 音，这是一个非常特殊的例外。"},{"question":"既然 'oo' 的发音规则不唯一，我们应该如何学习和记忆呢？","hint":"除了寻找规律，还有什么更可靠的方法？","takeaway":"学习 'oo' 发音的最佳方法是多听、多读、多积累，将发音相似的单词分组记忆。"}]}]}},{"number":"5","item_type":"phonetics","context_note":"","stem":"A. sh\u003cu>e\u003c/u> B. b\u003cu>e\u003c/u>","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"本题考查字母 'e' 在单音节开音节词中的发音。在单词 `she` /ʃiː/ 中，字母 'e' 位于词尾，构成开音节，发长元音 /iː/。在单词 `be` /biː/ 中，字母 'e' 同样位于词尾，构成开音节，发长元音 /iː/。因此，这两个单词中划线部分的读音是相同的。","knowledge_expansion_md":"### 长元音 /iː/ 的发音与拼写\n\n1.  **发音要领**：舌尖抵下齿，舌前部尽量抬高，口型扁平，嘴角向两侧拉开，与中文“一”的发音相似但更长、更紧张。\n2.  **常见拼写组合**：\n    *   `e`：在 `he`, `she`, `me`, `be` 等单音节词末尾。\n    *   `ee`：在 `see`, `three`, `meet`, `week` 中。\n    *   `ea`：在 `eat`, `read`, `sea`, `teacher` 中。\n    *   `ie`：在 `piece`, `field` 中。\n3.  **易混淆音**：需注意与短元音 /ɪ/（如 `ship`, `it`, `sit`）的区别。/iː/ 是长而紧张的音，/ɪ/ 是短而放松的音。例如，`sheep` /ʃiːp/（绵羊）和 `ship` /ʃɪp/（船）就是一对典型的最小音差对。","socratic_tracks":[{"title":"音标识别","steps":[{"question":"请分别读出单词 'she' 和 'be'，你听到的元音部分发音是相同的吗？","hint":"试着拉长读这两个单词的元音，感受一下口型和舌头的位置。","takeaway":"单词 'she' 和 'be' 含有相同的元音/iː/。"},{"question":"这个发音听起来像我们熟悉的哪个英文字母的发音？","hint":"想想字母表中的 'E' 或者 'B', 'C', 'D' 等字母本身的发音。","takeaway":"这个音就是字母 'E' 的名称音，用音标 /iː/ 表示。"},{"question":"音标 /iː/ 后面为什么有一个冒号“:”？它代表什么意思？","hint":"对比一下 'ship' /ʃɪp/ 和 'sheep' /ʃiːp/ 的发音时长。","takeaway":"音标中的冒号“:”通常表示这是一个长元音。"}]},{"title":"拼写规律","steps":[{"question":"在 'she' 和 'be' 中，是哪个字母发出了 /iː/ 的音？","hint":"观察这两个单词的拼写。","takeaway":"在这些单词中，是字母 'e' 发出了 /iː/ 的音。"},{"question":"你还能想到哪些单词中的 'ee' 或 'ea' 组合也发这个 /iː/ 音吗？","hint":"想想“看见”、“遇见”、“吃”、“读”这些单词怎么说。","takeaway":"字母组合 'ee' (如 see, meet) 和 'ea' (如 eat, read) 也可以发 /iː/ 音。"}]},{"title":"音素辨析","steps":[{"question":"请听辨 'leave' (离开) 和 'live' (居住) 这两个词，它们的元音发音一样吗？","hint":"一个音更长更紧张，一个音更短更放松。","takeaway":"'leave' 的元音是长元音 /iː/，而 'live' 的元音是短元音 /ɪ/。"},{"question":"为什么准确区分 /iː/ 和 /ɪ/ 很重要？","hint":"想一想，如果把 'I want to leave' 说成了 'I want to live' 会有什么后果？","takeaway":"准确区分长短元音是避免语意混淆、实现有效沟通的关键。"}]}]}}]},{"section_title":"II. 单项选择。(共10分)","section_instruction":"","items":[{"number":"6","item_type":"choice","context_note":"","stem":"What did you do _____?","options":{"A":"last weekend","B":"next weekend","C":"now","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查一般过去时。问句中的助动词 `did` 是 `do` 的过去式，表明整个句子是关于过去发生的动作。因此，时间状语也必须是表示过去的时间。选项 A `last weekend` (上周末) 表示过去；选项 B `next weekend` (下周末) 表示将来；选项 C `now` (现在) 表示现在。故只有 A 符合题意。","knowledge_expansion_md":"### 一般过去时的时间状语\n\n一般过去时用于描述在过去某个特定时间发生并完成的动作或存在的状态。其标志之一就是与表示过去的时间状语连用。\n\n1.  **常见时间状语**：\n    *   `yesterday` (昨天)\n    *   `last` + 时间名词：`last night` (昨晚), `last week` (上周), `last month` (上个月), `last year` (去年)\n    *   时间段 + `ago`：`two days ago` (两天前), `a long time ago` (很久以前)\n    *   `in` + 过去的年份/月份：`in 2010`, `in May` (指过去的五月)\n    *   `just now` (刚才)\n\n2.  **时态一致性**：动词的时态必须与时间状语所表示的时间相匹配。这是英语语法中的一个核心原则。\n    *   过去时动词 (`did`, `was`, `went`) ↔ 过去时间状语 (`yesterday`, `last week`)\n    *   将来时动词 (`will`, `be going to`) ↔ 将来时间状语 (`tomorrow`, `next month`)\n    *   现在时动词 (`do`, `is`, `go`) ↔ 现在时间状语 (`now`, `every day`)","socratic_tracks":[{"title":"时态判断","steps":[{"question":"看到句子中的 'did'，你首先会想到什么时态？","hint":"'did' 是哪个动词的过去式？","takeaway":"助动词 'did' 是一般过去时的明确标志。"},{"question":"既然问句是过去时，那么回答或者描述时间的词语应该是什么时间的？","hint":"动作发生在过去，那么时间也应该在过去。","takeaway":"动词时态需要和时间状语保持一致。"}]},{"title":"时间状语辨析","steps":[{"question":"请分别说出三个选项 'last weekend', 'next weekend', 'now' 指的是什么时间？","hint":"'last' 是“上一个”，'next' 是“下一个”，'now' 是“现在”。","takeaway":"这三个选项分别代表了过去、将来和现在。"},{"question":"根据我们刚才对时态的判断，哪个选项是唯一正确的选择？","hint":"我们需要一个表示过去时间的词。","takeaway":"只有 'last weekend' (上周末) 是表示过去的时间，符合题意。"}]},{"title":"句式变换","steps":[{"question":"如果我想用 'next weekend' 来提问，应该如何修改原句 'What did you do'？","hint":"将来时态通常用什么助动词？","takeaway":"询问将来的计划，应使用 'What will you do?' 或 'What are you going to do?'。"},{"question":"那如果我想用 'now' 来提问，句子又该怎么变呢？","hint":"询问“现在正在做什么”应该用什么时态？","takeaway":"询问现在正在进行的动作，应使用现在进行时 'What are you doing?'。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"The teachers' office is on the _____ floor.","options":{"A":"one","B":"two","C":"second","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查基数词和序数词的用法区别。在描述楼层、日期、名次等顺序时，需要使用序数词。选项 A `one` 和选项 B `two` 都是基数词，用于表示数量或计数。选项 C `second` 是序数词，意为“第二”，用于表示顺序。因此，说“在二楼”应该用 `on the second floor`。","knowledge_expansion_md":"### 基数词 (Cardinal Numbers) vs. 序数词 (Ordinal Numbers)\n\n1.  **基数词**：表示数量的多少，回答 `How many...?` 的提问。例如：`one`, `two`, `three`, `ten`, `one hundred`。\n    *   例句：`I have two brothers.` (我有两个兄弟。)\n\n2.  **序数词**：表示顺序的先后，回答 `Which one...?` 的提问。常用于楼层、日期、世纪、章节、名次等。\n    *   例句：`His birthday is on May the first.` (他的生日在五月一日。)\n\n3.  **构成规则**：\n    *   **基本规则**：大多数在基数词后加 `-th`，如 `four` → `fourth`, `six` → `sixth`。\n    *   **特殊变化**：`one` → `first`, `two` → `second`, `three` → `third`。这个规律适用于所有以 1, 2, 3 结尾的数字（如 `twenty-first`），但 11, 12, 13 除外（`eleventh`, `twelfth`, `thirteenth`）。\n    *   **拼写变化**：`five` → `fifth`, `eight` → `eighth`, `nine` → `ninth`, `twelve` → `twelfth`。\n    *   **整十变化**：以 `-y` 结尾的整十数，变 `-y` 为 `-ie` 再加 `-th`，如 `twenty` → `twentieth`。\n\n4.  **冠词**：序数词前通常要加定冠词 `the`。","socratic_tracks":[{"title":"词类辨析","steps":[{"question":"当我们数数时，我们会说 'one, two, three...'。这些词叫什么词？","hint":"它们是表示数目的基础，所以叫“基数词”。","takeaway":"表示数量的词如 'one', 'two' 是基数词。"},{"question":"当我们要说“第一名”、“第二名”时，我们用的是 'first', 'second'。这些表示顺序的词又叫什么？","hint":"它们是表示顺序的词，所以叫“序数词”。","takeaway":"表示顺序的词如 'first', 'second' 是序数词。"},{"question":"描述“第几层楼”是在数楼的数量，还是在说楼的顺序位置？","hint":"我们是在给楼层排序，而不是计算总共有几层楼。","takeaway":"描述楼层需要用表示顺序的序数词。"}]},{"title":"用法场景","steps":[{"question":"除了楼层，你还能想到哪些地方必须用序数词吗？","hint":"想想你的生日日期，或者比赛的名次。","takeaway":"序数词常用于日期、名次、世纪和章节等场景。"},{"question":"我们说“6月1日”是 'June 1st'。那“6月2日”和“6月3日”怎么说？","hint":"套用 'second' 和 'third'。","takeaway":"日期表达需要使用序数词，如 'June 2nd' (second), 'June 3rd' (third)。"}]},{"title":"构成规律","steps":[{"question":"我们知道 'two' 变成 'second'。那 'one' 和 'three' 对应的序数词是什么？","hint":"这是最特殊的三个变化。","takeaway":"'one' 对应 'first'，'three' 对应 'third'。"},{"question":"对于大部分其他数字，比如 'four'，它的序数词是怎么构成的？","hint":"在后面加上两个字母。","takeaway":"大多数序数词是在基数词后加 '-th' 构成的，如 'fourth'。"},{"question":"在使用序数词时，它的前面通常需要加哪一个冠词？","hint":"例如 'the first prize', 'the second floor'。","takeaway":"序数词前通常要加定冠词 'the'。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"I'm hungry. I'd like some _____.","options":{"A":"juice","B":"bread","C":"rices","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词的分类（可数与不可数）以及词义的逻辑选择。首先，根据 `I'm hungry` (我饿了) 的语境，说话者想吃的应该是食物。选项 B `bread` (面包) 是食物，而选项 A `juice` (果汁) 是饮品，所以 `bread` 更符合逻辑。其次，从语法上看，选项 C `rices` 是错误的，因为 `rice` (米饭) 是不可数名词，没有复数形式。`bread` 也是不可数名词，与 `some` 搭配使用完全正确。","knowledge_expansion_md":"### 可数名词与不可数名词\n\n英语名词分为可数名词和不可数名词，它们的用法有很大区别。\n\n1.  **不可数名词 (Uncountable Nouns)**：\n    *   **定义**：指不能按个体计数的物质、概念等。如 `water` (水), `bread` (面包), `rice` (米饭), `information` (信息), `advice` (建议), `money` (钱)。\n    *   **特点**：\n        *   没有复数形式，不能在词尾加 `-s`。\n        *   不能与不定冠词 `a/an` 连用。\n        *   可以用 `some`, `any`, `much`, `a little` 等词修饰。\n    *   **量化**：若要表示具体数量，需借助量词，如 `a piece of bread` (一片面包), `a glass of juice` (一杯果汁), `a bowl of rice` (一碗米饭)。\n\n2.  **可数名词 (Countable Nouns)**：\n    *   **定义**：指可以按个体计数的名词。如 `apple` (苹果), `book` (书), `student` (学生)。\n    *   **特点**：\n        *   有单数和复数形式（通常加 `-s` 或 `-es`）。\n        *   单数形式前可用 `a/an` 或 `one`。\n        *   复数形式可用 `some`, `any`, `many`, `a few` 等词修饰。\n\n**易错点**：很多在中文里可数的概念，在英文里是不可数的，如 `bread`, `advice`, `furniture` (家具)。需要特别记忆。","socratic_tracks":[{"title":"语法：可数与不可数","steps":[{"question":"我们能说 'one rice, two rices' 吗？为什么选项 C 'rices' 是错误的？","hint":"像米、水、沙子这类东西，我们通常不一个一个地数。","takeaway":"'Rice' 是不可数名词，没有复数形式 'rices'。"},{"question":"那么 'bread' 和 'juice' 是可数还是不可数名词呢？","hint":"我们通常说“一片面包”或“一杯果汁”，而不是“一个面包”或“一个果汁”。","takeaway":"'Bread' 和 'juice' 在通常情况下也是不可数名词。"},{"question":"既然 'bread' 和 'juice' 都是不可数名词，为什么它们可以和 'some' 搭配？","hint":"'some' 这个词既可以修饰可数名词复数，也可以修饰不可数名词。","takeaway":"'Some' 可以和不可数名词连用，表示“一些”。"}]},{"title":"逻辑：语境推断","steps":[{"question":"句子开头说 'I'm hungry'。一个饥饿的人最需要的是什么？","hint":"是吃的食物，还是喝的饮料？","takeaway":"饥饿时，人们通常需要食物来充饥。"},{"question":"在 'juice' (果汁) 和 'bread' (面包) 中，哪一个是固体食物，哪一个是饮品？","hint":"想一想它们的形态。","takeaway":"'Bread' 是食物，而 'juice' 是饮品。"},{"question":"结合语境和词义，哪个选项是最佳答案？","hint":"选择最能解决“饥饿”问题的选项。","takeaway":"根据 'I'm hungry' 的语境，选择食物 'bread' 是最合乎逻辑的。"}]},{"title":"词汇：量词的使用","steps":[{"question":"既然我们不能说 'a bread'，那如果想表达“一片面包”，应该怎么说？","hint":"我们需要一个单位词，比如“片”。","takeaway":"我们可以用量词 'a slice of' 或 'a piece of' 来数面包，如 'a slice of bread'。"},{"question":"同样地，如何表达“一杯果汁”和“一碗米饭”？","hint":"想想装它们的容器。","takeaway":"我们可以用 'a glass of juice' 和 'a bowl of rice' 来量化不可数名词。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Did she see a film?\n—_____","options":{"A":"Yes, I did","B":"Yes, she did","C":"No, she did","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查一般疑问句的简短回答。问句 `Did she see a film?` 的主语是 `she`，助动词是 `did`。根据英语语法规则，简短回答必须与问句的主语和助动词保持一致。因此，肯定回答应为 `Yes, she did.`。选项A的主语`I`错误。选项C的回答方式`No, she did`在语法上是错误的，正确的否定回答应为`No, she didn't`。","knowledge_expansion_md":"### 一般疑问句的简短回答\n\n一般疑问句是可以用 “Yes” 或 “No” 来回答的问句。其简短回答的基本结构是：\n\n*   **肯定回答**：`Yes, + 主语代词 + 助动词/be动词/情态动词.`\n*   **否定回答**：`No, + 主语代词 + 助动词/be动词/情态动词 + not.`\n\n**关键原则**：\n1.  **人称一致**：回答中的主语必须与问句中的主语人称保持一致或相应转换（如问句是 `you`，回答可以是 `I` 或 `we`）。本题问的是 `she`，回答也必须是 `she`。\n2.  **动词一致**：回答中使用的动词形式必须与问句的助动词、be动词或情态动词相匹配。\n    *   `Do/Does/Did...?` -> 回答用 `do/does/did` 或 `don't/doesn't/didn't`。\n    *   `Is/Am/Are...?` -> 回答用 `is/am/are` 或 `isn't/am not/aren't`。\n    *   `Can/Will/May...?` -> 回答用 `can/will/may` 或 `can't/won't/may not`。\n3.  **前后逻辑一致**：`Yes` 后面必须跟肯定形式，`No` 后面必须跟否定形式。不能出现 `Yes, she didn't.` 或 `No, she did.` 这种前后矛盾的回答。","socratic_tracks":[{"title":"问答主语一致性","steps":[{"question":"请看问句 “Did she see a film?”，这个句子是在问关于谁的事情？","hint":"注意句子中的人称代词。","takeaway":"问句的主语是 “she”，所以回答也应该是关于 “she” 的。"},{"question":"那么在 A、B、C 三个选项中，哪些选项的主语是正确的？","hint":"选项A的主语是 “I”，选项B和C的主语是 “she”。","takeaway":"根据主语一致原则，我们可以排除主语为 “I” 的选项A。"}]},{"title":"助动词的正确使用","steps":[{"question":"这个问句是以哪个词开头的？它是什么类型的词？","hint":"“Did” 是 “do” 的过去式，它在这里帮助构成疑问句。","takeaway":"这是一个以助动词 “did” 开头的一般疑问句。"},{"question":"对于用助动词 “did” 提问的句子，它的简短回答应该包含哪个词？","hint":"回答时需要重复使用问句中的助动词。","takeaway":"用什么助动词提问，就用什么助动词回答，所以回答中应该包含 “did” 或 “didn't”。"}]},{"title":"肯定与否定回答的结构","steps":[{"question":"我们来看选项C “No, she did”。如果用 “No” 开头，表示这是一个否定回答。那么后面的动词形式应该是肯定的还是否定的？","hint":"“No” 本身就表示“不”，后面的内容需要和它保持一致。","takeaway":"用 “No” 开头的否定回答，后面的助动词也必须使用否定形式。"},{"question":"那么，“did”的否定形式是什么？选项C的表达正确吗？","hint":"did + not = didn't","takeaway":"“did”的否定形式是“didn't”，所以选项C “No, she did” 是错误的，正确的否定回答是 “No, she didn't”。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"I watched some children's shows _____ TV.","options":{"A":"in","B":"on","C":"at","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查介词的固定搭配。在英语中，表示“在电视上”、“通过电视”观看节目，或者“在广播里”、“通过收音机”收听节目，以及“在互联网上”浏览信息，都使用介词 `on`。这是一个固定的用法，需要记忆。因此，正确的表达是 `on TV`。","knowledge_expansion_md":"### 介词 on, in, at 的用法区分\n\n`on`, `in`, `at` 是英语中最常见也最容易混淆的介词。除了本题考查的固定搭配外，它们在表示位置和时间上也有基本规律。\n\n1.  **on (在……上)**\n    *   **表示位置**：指在一个物体的**表面**上。例如：`on the desk` (在书桌上), `on the wall` (在墙上)。电视节目可以理解为呈现在“屏幕”这个表面上，所以用 `on TV`。\n    *   **表示媒介**：指通过某种媒介。例如：`on TV`, `on the radio`, `on the internet`, `on the phone`。\n    *   **表示时间**：指具体的**某一天或日期**。例如：`on Monday` (在周一), `on my birthday` (在我生日那天)。\n\n2.  **in (在……里)**\n    *   **表示位置**：指在一个**立体空间内部**。例如：`in the box` (在盒子里), `in the room` (在房间里)。也用于较大的地理范围，如城市、国家：`in Chengdu` (在成都)。\n    *   **表示时间**：指一段**较长的时间**，如月、年、季节。例如：`in May` (在五月), `in 2024` (在2024年), `in summer` (在夏天)。\n\n3.  **at (在……点)**\n    *   **表示位置**：指一个**具体的地点或小地方**。例如：`at the bus stop` (在公交车站), `at the door` (在门口)。\n    *   **表示时间**：指**精确的时刻**。例如：`at 8 o'clock` (在8点钟), `at noon` (在中午)。","socratic_tracks":[{"title":"介词与媒介","steps":[{"question":"当我们说通过某种电子设备（比如电视、收音机、网络）获取信息时，你认为信息是在设备的“里面”还是“表面”上，或者是在一个“点”上？","hint":"想一想，我们常说的“上网”英文怎么说？是 `in the internet` 还是 `on the internet`？","takeaway":"我们通常说 `on the internet`，这说明英语中习惯用 `on` 来表示通过某种媒介。"},{"question":"根据这个规律，当我们要表达“在电视上”看节目时，应该选择哪个介词？","hint":"电视和网络、收音机一样，都属于信息传播的媒介。","takeaway":"表示“在电视上”时，也应该使用介词 `on`，构成固定搭配 `on TV`。"}]},{"title":"空间概念辨析","steps":[{"question":"介词 `in` 通常表示什么样的空间关系？你能举个例子吗？","hint":"想象一个苹果在一个盒子里面。","takeaway":"`in` 通常表示“在……内部”，强调被包围的关系，如 `in the box`。"},{"question":"介词 `on` 通常表示什么样的空间关系？你能举个例子吗？","hint":"想象一本书在桌子表面上。","takeaway":"`on` 通常表示“在……表面”，强调接触关系，如 `on the table`。"},{"question":"电视节目是出现在电视机的“内部”还是“屏幕表面”？根据这个理解，哪个介词更合适？","hint":"我们看到的是屏幕上显示的画面。","takeaway":"因为电视节目呈现在屏幕这个“表面”上，所以用 `on` 来描述是最符合逻辑的。"}]},{"title":"固定搭配的记忆","steps":[{"question":"在英语中，是不是所有的词组都可以按照字面意思和语法规则去推导？","hint":"想想 `look after` (照顾) 和 `look for` (寻找)，它们的意思和 `look` (看) 的本意有关，但不能直接推断。","takeaway":"英语中存在大量固定搭配（collocations），需要我们作为整体来学习和记忆。"},{"question":"那么，`on TV` 是一个可以靠逻辑推导的短语，还是一个需要我们记住的固定搭配？","hint":"虽然用“表面”的逻辑可以帮助理解，但它已经成为了一个约定俗成的用法。","takeaway":"`on TV` 是一个非常稳固的固定搭配，把它和 `on the radio`, `on the internet` 一起打包记忆效果更好。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"He is taller than both _____ us.","options":{"A":"of","B":"and","C":"with","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这道题考查代词 `both` 的固定用法。`both` 意为“两者都”，当它后面跟代词时，通常使用 `both of + 代词宾格` 的结构。在这里，“我们俩”的正确表达是 `both of us`。整个句子的意思是“他比我们俩都高”。选项B和C都不能与 `both` 构成正确的搭配。","knowledge_expansion_md":"### `both`, `either`, `neither` 的用法\n\n这三个词都用于指代“两者”，但含义和用法不同。\n\n1.  **both (两者都)**：表示肯定含义。\n    *   `both + 复数名词`: `Both students are clever.`\n    *   `both of + the/my/your... + 复数名词`: `Both of my parents are doctors.`\n    *   `both of + 代词宾格 (us, you, them)`: `Both of them passed the exam.` (本题考点)\n    *   `代词主格 + both`: `We both like English.`\n    *   `both A and B`: `He can speak both English and French.`\n\n2.  **either (两者中的任意一个)**：表示二选一。\n    *   `either + 单数名词`: `You can take either road.`\n    *   `either of + the/my/your... + 复数名词`: `Either of the books is fine.` (谓语动词通常用单数)\n    *   `either of + 代词宾格 (us, you, them)`: `I don't like either of them.`\n    *   `either A or B`: `You can choose either tea or coffee.`\n\n3.  **neither (两者都不)**：表示否定含义，相当于 `not ... either`。\n    *   `neither + 单数名词`: `Neither answer is correct.` (谓语动词用单数)\n    *   `neither of + the/my/your... + 复数名词`: `Neither of his parents was at home.` (谓语动词通常用单数)\n    *   `neither of + 代词宾格 (us, you, them)`: `Neither of us knows the way.`\n    *   `neither A nor B`: `He likes neither tea nor coffee.`\n\n**易错点**：在 `both of us/you/them` 中，`of` 在非正式语境中有时可以省略，但在正式文体和考试中，`both of...` 是更规范的用法。","socratic_tracks":[{"title":"both 的核心结构","steps":[{"question":"`both` 这个词是什么意思？它通常用来指代几个人或物？","hint":"想一想 `both hands` 是什么意思？","takeaway":"`both` 的意思是“两者都”，专门用于指代两个人或物。"},{"question":"当 `both` 后面想连接一个代词，比如“我们”、“他们”时，我们通常会用一个什么样的结构来连接它们？","hint":"试着造句：“他们俩都是我的朋友”。`Both ___ them are my friends.` 空格里填什么？","takeaway":"`both of + 代词宾格` 是一个固定结构，用来表示“...两人/两者都”。"}]},{"title":"排除错误选项","steps":[{"question":"我们来看选项B `and`。`both ... and ...` 是一个很常见的搭配，为什么这里不能用 `and`？","hint":"`both ... and ...` 通常连接两个并列的、不同的事物，比如 `both Tom and Jerry`。这里的 `us` 只是一个词。","takeaway":"`both ... and ...` 结构需要连接两个并列的成分，而 `both and us` 结构不成立。"},{"question":"再来看选项C `with`。`with us` 的意思是“和我们在一起”，把它放进句子里读一下：“He is taller than both with us.” 这句话通顺吗？","hint":"这个句子在语法上和逻辑上都讲不通。","takeaway":"`both with us` 无法构成有意义的语法结构，因此是错误的。"}]},{"title":"代词形式辨析","steps":[{"question":"在 `both of ...` 结构中，后面的代词应该用主格（如 we, they）还是宾格（如 us, them）？","hint":"`of` 是一个介词，介词后面的人称代词要用什么格？","takeaway":"介词后面的人称代词必须使用宾格，所以是 `both of us`，而不是 `both of we`。"},{"question":"那么，`both of us` 在句子中充当什么成分？","hint":"它位于 `than` 的后面，是比较的对象。","takeaway":"在这里，`both of us` 作为介词 `than` 的宾语，共同构成比较状语的一部分。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"Mike is _____ than you.","options":{"A":"short","B":"shorter","C":"old","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查形容词比较级的用法。句中的关键词 `than` (比) 表明这是一个比较句，用于比较两个人或物。在进行两者之间的比较时，形容词需要使用其比较级形式。`short` (矮的) 是形容词原级，其比较级形式是 `shorter` (更矮的)。因此，正确的句子是 “Mike is shorter than you.” (迈克比你更矮)。选项A和C都是形容词原级，不能直接用于 `than` 之前进行比较。","knowledge_expansion_md":"### 形容词比较级的构成与使用\n\n**1. 比较级的使用场景**\n当比较**两者**在某个方面的差异时，使用形容词的比较级。其标志词通常是 `than`。\n基本句型：`主语A + be动词 + 形容词比较级 + than + 主语B.`\n\n**2. 比较级的构成规则**\n*   **规则变化**：\n    *   **单音节词**：词尾直接加 `-er`。如：`short -> shorter`, `tall -> taller`。\n    *   **以e结尾的单音节词**：词尾直接加 `-r`。如：`nice -> nicer`。\n    *   **重读闭音节词**（即“辅-元-辅”结尾）：双写末尾辅音字母，再加 `-er`。如：`big -> bigger`, `hot -> hotter`。\n    *   **以“辅音字母+y”结尾的双音节词**：变 `y` 为 `i`，再加 `-er`。如：`happy -> happier`, `easy -> easier`。\n    *   **多音节词和部分双音节词**：在形容词前加 `more`。如：`beautiful -> more beautiful`, `interesting -> more interesting`。\n*   **不规则变化**：\n    *   `good/well -> better`\n    *   `bad/ill -> worse`\n    *   `many/much -> more`\n    *   `little -> less`\n    *   `far -> farther/further`\n\n**易错点**：\n*   见到 `than` 却忘记使用比较级，误用原级。\n*   混淆比较级和最高级（以 `-est` 结尾或前面加 `most`）。最高级用于三者及以上的比较。","socratic_tracks":[{"title":"识别比较句标志","steps":[{"question":"在这个句子中，你看到了哪个词，让你觉得这是一个在做比较的句子？","hint":"这个词通常跟在比较级形容词的后面，用来引出比较的对象。","takeaway":"关键词 `than` 是比较句的明确标志。"},{"question":"既然这是一个比较两个人的句子，那么句子中的形容词应该使用什么形式？是原级、比较级还是最高级？","hint":"比较两个人或物的高矮、大小等，我们用的是哪种形式？","takeaway":"在含有 `than` 的比较句中，必须使用形容词的比较级形式。"}]},{"title":"形容词的形式变化","steps":[{"question":"请看选项A `short` 和选项B `shorter`。它们在意思和形式上有什么不同？","hint":"一个表示“矮的”状态，另一个表示“更矮的”比较结果。","takeaway":"`short` 是形容词原级，而 `shorter` 是其比较级形式。"},{"question":"根据我们第一步得出的结论（需要用比较级），应该选择 `short` 还是 `shorter`？","hint":"将符合语法规则的选项填入句子中。","takeaway":"我们必须选择比较级形式 `shorter` 来满足比较句的语法要求。"}]},{"title":"分析选项的有效性","steps":[{"question":"我们来看选项C `old`。这个词本身能填入空格吗？为什么？","hint":"请注意 `old` 是什么形式？是原级还是比较级？","takeaway":"`old` 是形容词原级，不符合 `... than ...` 比较句的语法结构，所以不能选。"},{"question":"如果选项C是 `older`，那么这个选项可以选吗？","hint":"`older` 是 `old` 的比较级，从语法上看，`Mike is older than you` 是一个完全正确的句子。","takeaway":"如果选项C是 `older`，那么B和C在语法上都正确。但在单选题中，通常只有一个选项在所给的条件下是唯一正确的，这道题的选项设置清晰地考查了原级和比较级的区别。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"—_____ are you?\n—I am 52 kilograms.","options":{"A":"How tall","B":"How old","C":"How heavy","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"该题考查特殊疑问词组的用法。回答是“I am 52 kilograms.”（我是52公斤），其中“kilograms”（公斤）是重量单位。因此，问题应该是询问体重。选项A “How tall” 用来询问身高；选项B “How old” 用来询问年龄；选项C “How heavy” 用来询问体重。根据问答匹配的原则，只有C选项符合题意。","knowledge_expansion_md":"本题涉及 “How + 形容词/副词” 引导的特殊疑问句，用于对事物的程度、状态或特征进行提问。\n\n**常见结构及用法：**\n- **How tall...?** 问身高，回答常用 `...meters/centimeters tall`。\n- **How old...?** 问年龄，回答常用 `...years old`。\n- **How heavy...?** 问体重，回答常用 `...kilograms/pounds`。\n- **How long...?** 问长度或时间长度，如 `How long is the river?` / `How long is the movie?`\n- **How far...?** 问距离，如 `How far is it from here to the school?`\n- **How much...?** 问价格或不可数名词的数量，如 `How much is the book?` / `How much water is there?`\n- **How many...?** 问可数名词的数量，如 `How many students are there?`","socratic_tracks":[{"title":"特殊疑问词 'How' 的用法","steps":[{"question":"看到回答是“52 kilograms”（52公斤），你觉得这个回答是关于什么信息的？是身高、年龄还是体重？","hint":"“kilogram”是“公斤”的意思，是一种计量单位。","takeaway":"回答是关于体重的。"},{"question":"那么，在英语中，我们用哪个疑问词组来询问别人的体重呢？","hint":"想一想“高”怎么问（How tall），“年龄”怎么问（How old）。","takeaway":"询问体重用“How heavy”。"},{"question":"请你说出选项 A “How tall” 和 B “How old” 分别是用来问什么的？","hint":"“tall”是“高”的意思，“old”是“老，大”的意思。","takeaway":"“How tall”问身高，“How old”问年龄，都与本题的回答不匹配。"}]},{"title":"从回答中找线索","steps":[{"question":"在回答“I am 52 kilograms.”中，哪个词是解题的关键？","hint":"哪个词告诉了我们数字“52”的单位？","takeaway":"关键词是“kilograms”（公斤），它直接表明了信息的类型是重量。"},{"question":"既然回答是关于重量的，那么问题也应该是关于什么的？","hint":"对话中的问题和回答必须在逻辑上相互关联。","takeaway":"问题和回答的内容必须匹配，所以问题也必须是关于重量的。"},{"question":"现在请看三个选项，哪一个选项的含义是“多重”？","hint":"“heavy”这个形容词是什么意思？","takeaway":"只有“How heavy”是用来询问重量的，因此是正确答案。"}]},{"title":"生活中的 'How' 问句","steps":[{"question":"如果想问你的新朋友多大年龄，你会用英语怎么说？","hint":"年龄的英文是 age，但我们通常用另一个词来提问。","takeaway":"你会问：“How old are you?”"},{"question":"如果想知道从你家到学校有多远，你会怎么问？","hint":"“远”的英文是“far”。","takeaway":"你会问：“How far is it from your home to school?”"},{"question":"通过这些例子，我们可以总结出“How + 形容词”这个结构是用来做什么的吗？","hint":"比如问高度、重量、距离、年龄等。","takeaway":"“How + 形容词/副词”结构可以用来询问事物的程度、状态或特征。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"Your feet are bigger than _____.","options":{"A":"me","B":"my","C":"mine","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"该题考查物主代词的用法。句子 “Your feet are bigger than _____.” 意为“你的脚比我的大。”，这是一个比较句。完整的说法是 “Your feet are bigger than my feet.”。为了避免重复，“my feet” 可以用名词性物主代词 “mine” 来代替。选项A “me” 是人称代词宾格。选项B “my” 是形容词性物主代词，后面必须跟名词。因此，只有选项C “mine” (名词性物主代词，相当于 my feet) 是正确的。","knowledge_expansion_md":"本题的核心是区分**形容词性物主代词**和**名词性物主代词**。\n\n1.  **形容词性物主代词 (Adjectival Possessive Pronouns)**\n    - 包括 `my`, `your`, `his`, `her`, `its`, `our`, `their`。\n    - 它们必须放在名词前，起修饰作用，表明物品的归属。\n    - 结构：**形容词性物主代词 + 名词**。例如：`This is my book.`\n\n2.  **名词性物主代词 (Nominal Possessive Pronouns)**\n    - 包括 `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n    - 它们本身就具有名词的性质，可以独立使用，在句子中充当主语、宾语或表语。\n    - 结构：**名词性物主代词 = 形容词性物主代词 + 名词**。例如：`This book is mine.` (`mine` = `my book`)\n\n**易错点**：在比较结构中，当比较的对象是双方的所属物时，为了避免重复，通常使用名词性物主代词。例如：`His bike is newer than mine.` (mine = my bike)","socratic_tracks":[{"title":"物主代词的两种形态","steps":[{"question":"这个句子 “Your feet are bigger than _____” 是在比较哪两样东西？","hint":"句子开头是“Your feet”（你的脚）。","takeaway":"这句话是在比较“你的脚”和“我的脚”的大小。"},{"question":"“我的脚”用英语怎么说？","hint":"“我的”是“my”，“脚”是“feet”。","takeaway":"“我的脚”是“my feet”。"},{"question":"为了避免重复，我们需要一个词来代替“my feet”。在选项中，哪个词可以独立使用并表示“我的东西”？","hint":"“my”后面必须跟名词，而“mine”可以单独使用。","takeaway":"“mine”是名词性物主代词，相当于“my feet”，可以独立使用。"}]},{"title":"比较句的省略","steps":[{"question":"“than”在这里引导的是一个比较。这个句子的完整、未省略的形式应该是什么？","hint":"比较的是“你的脚”和“我的脚”。","takeaway":"句子的完整形式是“Your feet are bigger than my feet (are)”。"},{"question":"为了让句子更简洁，我们通常会省略重复出现的部分。在这个完整句中，哪个词是重复的？","hint":"比较的对象都是“脚”。","takeaway":"我们可以省略重复出现的名词“feet”。"},{"question":"当我们要表达“my feet”但又省略掉“feet”时，“my”应该变成什么形式？","hint":"有一种代词专门用来表示“我的某个东西”，而不用把那个东西说出来。","takeaway":"形容词性物主代词“my”加上被省略的名词“feet”，就等于名词性物主代词“mine”。"}]},{"title":"辨析 me, my, mine","steps":[{"question":"“me”是什么词？它在句子中通常放在什么位置？例如“He helps me.”","hint":"“me”是“我”的宾格形式。","takeaway":"“me”是人称代词宾格，通常用作动词或介词的宾语。"},{"question":"“my”是什么词？它有什么使用特点？例如“This is my pen.”","hint":"“my”后面是不是总跟着一个东西？","takeaway":"“my”是形容词性物主代词，意思是“我的”，后面必须跟一个名词。"},{"question":"“mine”又是什么词？它和“my”有什么关系？例如“The pen is mine.”","hint":"“The pen is mine.” 和 “The pen is my pen.” 哪个更自然？","takeaway":"“mine”是名词性物主代词，意思是“我的东西”，它本身就包含了名词，不能再跟名词。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—Are these tomatoes?\n—Yes, _____.","options":{"A":"these are","B":"they aren't","C":"they are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"该题考查一般疑问句的简略回答。问句“Are these tomatoes?”是一个以 be 动词开头的一般疑问句，意为“这些是西红柿吗？”。回答以“Yes”开头，表示肯定。在简略回答中，主语必须使用人称代词来代替原句中的主语。原句主语“these tomatoes”是复数，应用人称代词“they”来指代。因此，不能使用“these”或“tomatoes”。简略回答的结构是“Yes/No, 主语人称代词 + 助动词/be动词/情态动词”。本题中，问句用了“Are”，所以回答也用“are”。综上，正确的肯定简略回答是“Yes, they are.”。","knowledge_expansion_md":"本题涉及**一般疑问句的简略回答 (Short Answers)**，这是英语初学者必须掌握的基本规则。\n\n**核心规则：**\n1.  **回答结构**：`Yes,` / `No,` + `主语人称代词` + `助动词/be动词/情态动词`。\n2.  **主语替换**：简略回答中的主语必须是人称代词 (`I`, `you`, `he`, `she`, `it`, `we`, `they`)，不能使用原句中的名词或指示代词 (`this`, `that`, `these`, `those`)。\n    - `this`/`that` 或单数名词 -> `it`\n    - `these`/`those` 或复数名词 -> `they`\n3.  **动词一致**：回答中使用的动词形式要与问句中的动词相对应。\n    - 问句用 `be` 动词 (`is`, `are`)，回答也用 `be` 动词。\n    - 问句用 `do`/`does`/`did`，回答也用 `do`/`does`/`did`。\n    - 问句用情态动词 (`can`, `will`)，回答也用相应的情态动词。\n\n**常见错误**：\n- `Are these your books?` 错误回答: `Yes, these are.` 正确回答: `Yes, they are.`\n- `Is Tom a student?` 错误回答: `Yes, Tom is.` 正确回答: `Yes, he is.`","socratic_tracks":[{"title":"一般疑问句的简答规则","steps":[{"question":"这是一个以“Are”开头的问句，我们称之为什么类型的问句？应该如何回答？","hint":"这种问题通常用“是”或“不是”来回答。","takeaway":"这是一般疑问句，需要用“Yes”或“No”来回答。"},{"question":"在简略回答中，主语“these tomatoes”应该用哪个代词来代替？","hint":"“tomatoes”是复数，并且是指物品。","takeaway":"复数名词（无论指人或物）都应用代词“they”来指代。"},{"question":"为什么不能选 A “these are”？简略回答的格式有什么特殊要求吗？","hint":"简答句中的主语部分有什么要求？","takeaway":"在简略回答中，主语必须使用人称代词（如 it, they），而不能用指示代词（如 this, these）。"}]},{"title":"代词的正确替换","steps":[{"question":"问句中的主语是什么？是单数还是复数？","hint":"“these”和名词复数形式“tomatoes”都表明了数量。","takeaway":"问句的主语是“these tomatoes”，是一个复数概念。"},{"question":"在英语中，当我们不想重复提及某个名词时，会用什么词来代替它？","hint":"比如用“he”代替“Tom”，用“it”代替“the book”。","takeaway":"我们会使用代词。"},{"question":"那么，用来代替复数名词“these tomatoes”（这些西红柿）的代词是哪个？","hint":"“it”指代单数，那么指代复数的词是？","takeaway":"代替复数名词（无论指人还是物）的代词是“they”。"}]},{"title":"肯定与否定要一致","steps":[{"question":"回答的开头是“Yes”，这表明了什么？","hint":"“Yes”和“No”分别表达什么意思？","takeaway":"“Yes”表明这是一个肯定回答。"},{"question":"既然是肯定回答，那么后面的部分应该是肯定的还是否定的？","hint":"肯定就是“are”，否定就是“are not”。","takeaway":"回答的后半部分也必须是肯定的，以保持逻辑一致。"},{"question":"比较选项 B 和 C，哪个是肯定形式，哪个是否定形式？哪个与开头的“Yes”匹配？","hint":"“aren't”是“are not”的缩写。","takeaway":"“they are”是肯定形式，与“Yes”匹配；而“they aren't”是否定形式，不能与“Yes”一起使用。"}]}]}}]},{"section_title":"III. 完形填空。(共10分)","section_instruction":"How often do you help others? Here is a story of Luke Cameron. As an American, he was born __16__ 1988. He had a good friend called Jack. It was __17__ that Jack died from cancer(癌症) one year ago. After that, Luke began to do at least a good thing for __18__ every day.\nHe helped the __19__ man cross the streets, bought gifts for some kids on their birthdays and __20__ the food to the poor people. He __21__ bought meals for several people at McDonald's, and even paid for a stranger's petrol(汽油). He said he __22__ about $4,700 on good things last year.\nIn these days, we usually think about ourselves and forget to think about others. In fact, we are too selfish(自私的). We should help others and it can make our world __23__ more beautiful and warmer.\n“__24__ is better for me than to help others,” Luke said to the reporters __25__.","items":[{"number":"16","item_type":"cloze","context_note":"Cloze test passage","stem":"As an American, he was born __16__ 1988.","options":{"A":"at","B":"in","C":"on","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"该题考查时间介词的用法。空格后面是年份“1988”。在英语中，表示在某一个具体的年份，需要使用介词“in”。介词“at”通常用于表示具体的时间点，如“at 5 o'clock”（在5点）。介词“on”通常用于表示具体的某一天或日期，如“on Monday”（在星期一）或“on May 1st”（在5月1日）。因此，根据“in + 年份”的规则，本题应选择B。","knowledge_expansion_md":"本题的核心是掌握时间介词 **in, on, at** 的基本用法，可以形象地记为一个“金字塔”结构，范围由大到小：\n\n- **in (用于较长时间段)**：\n  - **世纪**：`in the 21st century`\n  - **年代**：`in the 1990s` (在20世纪90年代)\n  - **年份**：`in 1988`\n  - **季节**：`in spring` / `in summer`\n  - **月份**：`in October`\n  - **泛指的上/下午/晚上**：`in the morning` / `in the afternoon` / `in the evening`\n\n- **on (用于具体的某一天)**：\n  - **具体日期**：`on October 1st, 1988`\n  - **星期几**：`on Sunday`\n  - **特定节日当天**：`on Christmas Day`\n  - **特指的早/午/晚**：`on a cold morning` (在一个寒冷的早晨)\n\n- **at (用于精确的时间点)**：\n  - **具体时刻**：`at 8:30 a.m.`\n  - **固定时间点**：`at noon` (在中午), `at midnight` (在午夜), `at night` (在夜晚)\n  - **节日期间**：`at Christmas` (在圣诞节期间，不特指当天)\n  - **固定短语**：`at the beginning of...`, `at the end of...`","socratic_tracks":[{"title":"时间介词 'in, on, at' 的金字塔法则","steps":[{"question":"空格后面是“1988”，这是一个什么类型的时间信息？","hint":"它是一个具体的时刻，还是某一天，还是一个年份？","takeaway":"“1988”是一个年份，表示一个长达366天的时间段。"},{"question":"在表示“在某年”时，我们应该用哪个介词？你可以想一个包含年份的英语句子吗？","hint":"比如“我出生在2010年”，英语是“I was born ___ 2010.”","takeaway":"表示年份、月份、季节这样比较长的时间，我们通常用介词“in”。"},{"question":"那么“at”和“on”通常用在什么样的时间前面呢？","hint":"“on”用于比“年”更具体的时间，“at”用于比“天”更具体的时间。","takeaway":"“on”用于具体某一天（如 on Monday），“at”用于最精确的时间点（如 at 8 o'clock）。"}]},{"title":"从 '出生' 这个动作看时间","steps":[{"question":"句子里说“he was born”（他出生），题目给出的时间信息“1988”是一个宽泛的时间范围还是一个精确的时间点？","hint":"一年有365或366天。","takeaway":"年份“1988”是一个宽泛的时间范围。"},{"question":"如果要说他出生在“早上8点”，应该用哪个介词？","hint":"这是一个非常精确的时间点。","takeaway":"精确到时刻用“at”，如“at 8 a.m.”。"},{"question":"如果要说他出生在“5月1日”，应该用哪个介词？","hint":"这是一个具体到“天”的时间。","takeaway":"精确到某一天用“on”，如“on May 1st”。"},{"question":"现在题目只给出了年份“1988”，这是一个更宽泛的时间范围，我们应该用哪个介词？","hint":"在 in, on, at 中，哪一个表示的时间范围最大？","takeaway":"对于年份、月份等较长的时间段，我们使用表示范围最大的介词“in”。"}]},{"title":"排除法解题","steps":[{"question":"让我们看看选项A“at”。我们会在“at 1988”这样用吗？“at”通常后面跟什么样的时间？","hint":"比如“at 5 o'clock”, “at noon”。","takeaway":"“at”通常用于具体时刻，所以“at 1988”是错误的，排除A。"},{"question":"再看看选项C“on”。我们会在“on 1988”这样用吗？“on”后面一般跟什么？","hint":"比如“on Monday”, “on my birthday”。","takeaway":"“on”通常用于具体某一天或日期，所以“on 1988”也是错误的，排除C。"},{"question":"排除了A和C，只剩下B。用“in 1988”听起来熟悉吗？它符合我们学过的规则吗？","hint":"回忆一下表示“在某年”的固定用法。","takeaway":"“in”用于年份、月份、季节，因此“in 1988”是唯一正确的用法。"}]}]}},{"number":"17","item_type":"cloze","context_note":"Cloze test passage","stem":"It was __17__ that Jack died from cancer(癌症) one year ago.","options":{"A":"unpleasant","B":"unhealthy","C":"unlucky","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查形容词词义辨析。句意为：“一年前杰克因癌症去世，这真是不幸。” 描述因病去世这件事，用“不幸的”来形容最为贴切。选项 A “unpleasant”意为“不愉快的”，语气较弱，不足以形容死亡的悲剧性。选项 B “unhealthy”意为“不健康的”，通常形容人或生活方式，不能用来形容“死亡”这个事件本身。因此，选项 C “unlucky”（不幸的）最符合语境。","knowledge_expansion_md":"### 形容词词义辨析与语境选择\n\n在英语学习中，精确理解形容词的词义和适用语境至关重要。以 `un-` 前缀的否定形容词为例：\n\n*   **unlucky**: 意为“不幸的，运气不好的”，通常用来评价一个人的遭遇或一件由坏运气导致的事件。例如：`an unlucky accident` (一次不幸的事故)，`He was unlucky to lose the game.` (他输了比赛，真不幸。)\n*   **unpleasant**: 意为“令人不快的，讨厌的”，多指主观上或感官上的不悦体验。例如：`an unpleasant smell` (难闻的气味)，`an unpleasant meeting` (一次不愉快的会面)。\n*   **unhealthy**: 意为“不健康的，对健康有害的”，用于描述人、身体状况、生活习惯或食物等。例如：`an unhealthy diet` (不健康的饮食)，`Smoking is an unhealthy habit.` (吸烟是一个不健康的习惯)。\n\n**易错点**：学生容易混淆 `unlucky` 和 `unpleasant`。关键区别在于 `unlucky` 强调的是“运气”和“命运”层面的不幸，而 `unpleasant` 强调的是“感受”和“体验”层面的不快。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"这句话描述了“杰克因癌症去世”这件事。你觉得这件事的性质是什么？是让人感觉不舒服，还是对身体不好，还是运气不好？","hint":"死亡，尤其因疾病而死亡，通常被看作是一种命运多舛或运气不佳的表现。","takeaway":"“因癌症去世”本质上是一件非常不幸的、运气不好的事。"},{"question":"现在我们来看三个选项：unpleasant (不愉快的), unhealthy (不健康的), unlucky (不幸的)。哪个词最能准确地形容“不幸”这个概念？","hint":"直接翻译这三个词的意思，然后与你刚才对事件性质的判断进行匹配。","takeaway":"`unlucky` (不幸的) 这个词最能准确描述因病去世这一不幸事件的性质。"}]},{"title":"语法搭配","steps":[{"question":"这个句子是 `It was ... that ...` 结构。这里的 `It` 指代的是什么？","hint":"这是一个形式主语结构，`It` 指代的是后面 `that` 引导的整个从句。","takeaway":"`It` 指代的是 “Jack died from cancer one year ago” 这整件事。"},{"question":"既然我们要形容的是“一件事”，那么 `unhealthy` (不健康的) 这个词合适吗？我们通常说“一件事不健康”吗？","hint":"想一想，我们一般说“不健康的食物”、“不健康的生活方式”或“某人身体不健康”。","takeaway":"`unhealthy` 通常形容具体的人或事物，而不是用来评价一个事件，因此不适用。"},{"question":"那么 `unpleasant` (不愉快的) 和 `unlucky` (不幸的) 呢？虽然死亡是“不愉快”的，但为什么 `unlucky` 更好？","hint":"`unpleasant` 更多是主观感受，比如一次尴尬的谈话。而 `unlucky` 是对事件客观性质的评价，指命运不好。","takeaway":"用 `unlucky` 来评价“因病去世”这一事件，比 `unpleasant` 更为深刻和贴切，强调了其悲剧性和命运的不公。"}]},{"title":"排除法应用","steps":[{"question":"我们先看 B 选项 `unhealthy`。为什么它肯定不对？","hint":"句子的主语是 `It`，指代整个事件。事件本身有“健康”或“不健康”的属性吗？","takeaway":"`unhealthy` 用来形容人或生活习惯，不能形容“死亡”这个事件，所以排除B。"},{"question":"再看 A 选项 `unpleasant`。死亡当然是“不愉快”的，为什么它不是最佳答案？","hint":"比较一下“一次不愉快的谈话”和“一个人的死亡”，`unpleasant` 这个词的感情色彩和强度足够吗？","takeaway":"`unpleasant` 语气太弱，无法表达出死亡事件的悲剧色彩，而 `unlucky` 则能体现出“厄运”、“不幸”的含义，更为恰当。"}]}]}},{"number":"18","item_type":"cloze","context_note":"Cloze test passage","stem":"After that, Luke began to do at least a good thing for __18__ every day.","options":{"A":"person","B":"people","C":"peoples","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查名词的单复数用法。句意为：“从那以后，卢克开始每天至少为人们做一件好事。”这里的“人们”是泛指他人，是一个复数概念。选项 A “person”是单数形式，指“一个人”，语法上应为 `for a person`，但与句意“为人们”不符。选项 C “peoples”意为“民族，种族”，与语境无关。选项 B “people”意为“人们”，是 `person` 的不规则复数形式，符合泛指他人的语境。因此，正确答案是 B。","knowledge_expansion_md":"### `person`, `people`, `peoples` 的用法辨析\n\n这三个词都与“人”有关，但用法和含义有明确区别，是初中英语的重点和易错点。\n\n1.  **person**: 可数名词，单数形式，意为“一（个）人”。\n    *   例：`There is only one person in the office.` (办公室里只有一个人。)\n    *   其复数形式可以是 `persons` 或 `people`。`persons` 多用于法律、官方等正式书面语中，强调个体。例如：`This elevator can hold a maximum of 10 persons.` (该电梯最多可容纳10人。)\n\n2.  **people**: 通常用作 `person` 的复数，意为“人们”，本身就是复数概念。\n    *   例：`Many people are waiting for the bus.` (很多人在等公交车。)\n    *   `people` 也可以作单数名词，意为“民族”。此时，它是一个可数名词。例如：`The Chinese are a hard-working people.` (中华民族是一个勤劳的民族。)\n\n3.  **peoples**: 是 `people` 作“民族”讲时的复数形式，意为“多个民族”。\n    *   例：`There are many different peoples living in Asia.` (亚洲居住着许多不同的民族。)\n\n在小升初和初中阶段，主要掌握 `person` (单数) 和 `people` (复数，人们) 的对应用法即可。","socratic_tracks":[{"title":"名词单复数","steps":[{"question":"句子说“每天为__做一件好事”，你觉得这里指的是为“一个人”还是泛指的“人们/他人”？","hint":"养成做好事的习惯，通常是帮助任何需要帮助的人，而不是特指某一个。","takeaway":"这里的语境是泛指“为他人”或“为人们”做好事，是一个复数的概念。"},{"question":"在 `person`, `people`, `peoples` 这三个词中，哪一个通常用来表示复数的“人们”？","hint":"`person` 是单数，那它的复数是什么？","takeaway":"`people` 是 `person` 最常用的复数形式，意为“人们”。"}]},{"title":"词义辨析","steps":[{"question":"`people` 和 `peoples` 这两个词看起来很像，它们的意思有什么不同吗？","hint":"想一想“中国人民”(the Chinese people) 和 “中国的各个民族”(the peoples of China) 这两个说法的区别。","takeaway":"`people` 通常指“人们”，而 `peoples` 指“（多个）民族”。"},{"question":"在这个“做好事”的语境里，对象应该是“人们”还是“民族”？","hint":"做好事通常是帮助具体的人，而不是一个抽象的民族概念。","takeaway":"做好事的对象是“人们”，而不是“民族”，所以应该用 `people`。"}]},{"title":"语法规则","steps":[{"question":"我们能选 A 选项 `person` 吗？为什么不行？","hint":"`person` 是一个可数名词的单数形式。当它在句子中单独出现时，前面通常需要什么词来修饰它？","takeaway":"可数名词单数形式不能单独使用，前面通常需要冠词（如 a/an, the）或限定词（如 my, this）。"},{"question":"如果想表达“为一个人做好事”，这句话应该怎么说？","hint":"在 `person` 前面加上一个表示“一个”的词。","takeaway":"如果用 `person`，句子需要写成 `for a person`。但根据上下文，泛指的 `for people` 更为合适。"}]}]}},{"number":"19","item_type":"cloze","context_note":"Cloze test passage","stem":"He helped the __19__ man cross the streets...","options":{"A":"young","B":"strong","C":"old","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查在语境中选择恰当的形容词。句意为：“他帮助__的人过马路……” 这句话是主人公做好事的一个具体例子。根据生活常识，“扶老人过马路”是好人好事的典型行为。选项 A “young”（年轻的）和选项 B “strong”（强壮的）的人通常不需要别人帮助过马路。因此，选项 C “old”（年老的）最符合语境和常识，构成固定搭配 `help the old`（帮助老人）。","knowledge_expansion_md":"### 语境与常识在完形填空中的应用\n\n完形填空题不仅考查词汇和语法，更重要的是考查在上下文中进行逻辑推理和运用常识的能力。本题就是一个典型的例子。\n\n1.  **利用生活常识**：很多题目描述的是日常情景，解题时可以调用自己的生活经验。例如，提到“过马路需要帮助”，我们首先想到的就是老人、小孩或残疾人。\n\n2.  **寻找篇章线索**：本句是前文 `do at least a good thing` (至少做一件好事) 的具体例证。因此，所选的答案必须能构成一个公认的“好事”。“扶老人过马路”是典范，而扶年轻人或强壮的人过马路则不具代表性。\n\n3.  **固定搭配 `the + adj.`**：`the` 加上一个形容词，可以表示一类人。这是英语中一个重要的语法点。\n    *   `the old` = 老年人\n    *   `the young` = 年轻人\n    *   `the poor` = 穷人\n    *   `the rich` = 富人\n    *   `the disabled` = 残疾人\n    *   `the sick` = 病人\n    这个结构在句中通常作复数看待。","socratic_tracks":[{"title":"语境与常识","steps":[{"question":"这句话描述的是一件“好事”。在日常生活中，你认为什么样的人在过马路时最可能需要别人的帮助？","hint":"想一想，行动比较方便的人和行动不太方便的人，哪一类更需要帮助？","takeaway":"通常是年老的、年幼的或身体不便的人过马路时需要帮助。"},{"question":"根据这个常识，`young` (年轻的), `strong` (强壮的), `old` (年老的) 这三个选项中，哪一个填入句子后最符合逻辑？","hint":"年轻人和强壮的人一般可以自己过马路。","takeaway":"`old` (年老的) 是最符合生活常识和语境的选择。"}]},{"title":"篇章逻辑","steps":[{"question":"这句话是用来举例说明主人公 Luke 是如何“做好事”的。一个好的例子应该有什么特点？","hint":"这个例子应该能让读者马上就明白“哦，这确实是件好事”。","takeaway":"一个好的例子应该是典型的、有代表性的，能被广泛认同为是好事。"},{"question":"比较一下“扶年轻人过马路”、“扶强壮的人过马路”和“扶老人过马路”，哪一个是最典型的“好人好事”的例子？","hint":"回想一下我们从小到大听到的关于助人为乐的故事，最常见的场景是什么？","takeaway":"“扶老人过马路”是助人为乐的经典范例，因此 `old` 是构成典型例子的最佳答案。"}]},{"title":"词汇拓展","steps":[{"question":"在英语中，我们想表达“某一类人”，除了用 `old people` 这样的说法，还有没有更简洁的方式？","hint":"试着用 `the` 加上一个形容词来表达。","takeaway":"我们可以用 `the + 形容词` 的结构来指代一类人，例如 `the old` 就等于 `old people`。"},{"question":"你能用这种结构说出“穷人”和“年轻人”吗？","hint":"穷的形容词是 `poor`，年轻的形容词是 `young`。","takeaway":"“穷人”是 `the poor`，“年轻人”是 `the young`。"},{"question":"所以，`helped the old man` 和 `helped the old` 在意思上有什么细微差别？","hint":"一个指具体的某个人，一个指一类人。","takeaway":"`helped the old man` 是帮助了一位特定的老人，而 `helped the old` 泛指帮助了老年人这个群体。"}]}]}},{"number":"20","item_type":"cloze","context_note":"Cloze test passage","stem":"...bought gifts for some kids on their birthdays and __20__ the food to the poor people.","options":{"A":"gave out","B":"gave in","C":"gave up","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词短语辨析。句意为：“……为一些孩子在生日时买礼物，并且把食物__给穷人。”连词 `and` 连接了两个并列的动作，都属于“做好事”。前一个动作是“买礼物”，后一个动作也应是类似的给予行为。选项 A `gave out` 意为“分发，派发”，`gave out the food to the poor people` 意为“把食物分发给穷人”，符合语境。选项 B `gave in` 意为“屈服，让步”。选项 C `gave up` 意为“放弃”。这两个选项放入句中均不合逻辑。因此，正确答案是 A。","knowledge_expansion_md":"### 动词短语 `give` 的用法辨析\n\n由 `give` 构成的动词短语是考试的热点，意思千差万别，需要重点记忆。\n\n*   **give out**: 分发，派发（通常指分发给一群人）；（体力、能量等）耗尽。\n    *   例1：`The teacher will give out the books.` (老师将要发书。)\n    *   例2：`After running for an hour, my legs gave out.` (跑了一小时后，我的腿没劲了。)\n*   **give in**: 屈服，投降，让步。\n    *   例：`The government refused to give in to the terrorists' demands.` (政府拒绝向恐怖分子的要求屈服。)\n*   **give up**: 放弃（某个习惯、努力或所有物）。\n    *   例：`You should give up smoking.` (你应该戒烟。)\n*   **give away**: 赠送，捐赠；泄露（秘密）。\n    *   例：`She gave away all her old clothes to charity.` (她把自己所有的旧衣服都捐给了慈善机构。)\n*   **give back**: 归还。\n    *   例：`Don't forget to give back the book you borrowed.` (别忘了归还你借的书。)\n\n在本题语境中，`give away` 也是一个可能的近义词，但选项中并未出现。","socratic_tracks":[{"title":"动词短语辨析","steps":[{"question":"这句话通过 `and` 连接了两个动作，第一个是“给孩子们买礼物”。那么第二个动作对“食物”和“穷人”做的，应该是什么性质的行为？","hint":"`and` 连接的两个部分在逻辑上是并列的，性质相似。买礼物是“给予”的行为。","takeaway":"第二个动作也应该是“给予”或“帮助”的行为，即把食物送给穷人。"},{"question":"我们来看三个选项：`gave out` (分发), `gave in` (屈服), `gave up` (放弃)。哪一个短语的意思是“给予”或“分发”？","hint":"逐一翻译这三个短语的意思，看哪个符合“送出食物”的场景。","takeaway":"`gave out` 的意思是“分发”，完全符合将食物送给穷人的语境。"}]},{"title":"介词搭配","steps":[{"question":"请注意空格后面的介词 `to`。`... the food to the poor people`。这个 `to` 告诉我们什么信息？","hint":"`to` 在这里表示动作的方向和接收者。","takeaway":"介词 `to` 表明食物被传送到了穷人那里。"},{"question":"现在我们把三个选项和 `... sth to sb` 这个结构组合一下：`give out sth to sb`, `give in sth to sb`, `give up sth to sb`。哪个搭配是正确的，并且意思通顺？","hint":"`give in` 后面一般直接跟 `to sb/sth` (向...屈服)。`give up sth` (放弃某物) 后面一般不跟 `to sb`。","takeaway":"只有 `give out something to somebody` (把某物分发给某人) 这个结构是完全正确且符合句意的。"}]},{"title":"逻辑关系","steps":[{"question":"句子中的连词 `and` 起到了什么作用？","hint":"它连接了两个并列的成分，说明主人公做了不止一件好事。","takeaway":"`and` 连接了两个并列的动词短语，描述了 Luke 做的两件好事。"},{"question":"既然是并列的好事，那么“屈服食物给穷人” (`gave in`) 或者“放弃食物给穷人” (`gave up`) 听起来合乎逻辑吗？","hint":"“屈服”和“放弃”这两个词本身带有消极或无奈的意味，不像是主动行善。","takeaway":"`gave in` 和 `gave up` 的词义与“做好事”的积极语境相悖。"},{"question":"那么，哪个选项的动作是积极主动的“给予”行为？","hint":"“分发”是一个主动的、中性的，并且在这里是积极的动作。","takeaway":"`gave out` (分发) 是唯一一个能体现主动行善的选项。"}]}]}},{"number":"21","item_type":"cloze","context_note":"Cloze test passage","stem":"He __21__ bought meals for several people at McDonald's...","options":{"A":"either","B":"too","C":"also","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查副词辨析。`also`, `too`, `either` 都有“也”的意思，但用法不同。\n1.  `also` 是副词，意为“也，而且”，通常用于肯定句和疑问句中，常置于行为动词之前，be动词、助动词或情态动词之后。\n2.  `too` 是副词，意为“也”，通常用于肯定句和疑问句中，一般放在句末，有时也可用在主语之后，用逗号隔开。\n3.  `either` 是副词，意为“也”，用于否定句句末，表示“也不”。\n本句是肯定句，且空格位于行为动词 `bought` 之前，因此选择 `also` 最为恰当。","knowledge_expansion_md":"### 表示“也”的副词用法辨析\n\n在英语中，`also`, `too`, `as well`, `either` 都可以表示“也”，但它们在句中的位置和使用语境有所区别，是小升初阶段的常见考点。\n\n| 副词 | 常见位置 | 语境 | 示例 |\n| :--- | :--- | :--- | :--- |\n| **also** | 行为动词前；be动词/助动词/情态动词后 | 肯定句/疑问句，语气较正式 | He can play the piano. He can **also** sing. |\n| **too** | 句末 | 肯定句/疑问句，较口语化 | I like apples, and my sister likes them, **too**. |\n| **as well** | 句末 | 肯定句，比 `too` 稍正式，常见于英式英语 | She speaks French, and English **as well**. |\n| **either** | 句末 | 否定句 | He doesn't like fish. I don't like it, **either**. |\n\n**易错点提醒**：\n学生常常混淆 `also` 和 `too` 的位置。一个简单的记忆方法是：“also 站中间，too/either/as well 待句尾”。在选择题中，首先判断句子的肯定或否定，若为否定句，基本锁定 `either`；若为肯定句，再根据空格位置判断使用 `also` 还是 `too`。","socratic_tracks":[{"title":"副词位置辨析","steps":[{"question":"请观察句子中空格的位置，它在主语 `He` 和动词 `bought` 的哪个地方？","hint":"是在句子的开头、中间还是结尾？","takeaway":"空格位于句中，在行为动词 `bought` 之前。"},{"question":"我们学过的表示“也”的 `also` 和 `too`，它们在句子中的常见位置有什么不同？","hint":"回想一下你平时写的句子，比如“我也喜欢苹果”，`too` 一般放在哪里？","takeaway":"副词 `also` 常置于行为动词前，而 `too` 常置于句末。"},{"question":"根据这个位置规则，`also` 和 `too` 哪个更适合填入这个空格？","hint":"空格在动词 `bought` 前面。","takeaway":"空格在动词前，所以应该选择 `also`。"}]},{"title":"肯定与否定语境","steps":[{"question":"这句话 “He __ bought meals...” 是一个肯定句还是否定句？","hint":"句子里有 `not` 或者 `no` 这样的否定词吗？","takeaway":"这是一个肯定句，因为它没有包含任何否定词。"},{"question":"在选项 `either`, `too`, `also` 中，哪一个词专门用于否定句，表示“也不”？","hint":"当别人说 “I don't like it.”，你想说“我也不喜欢”时，会用哪个词？","takeaway":"`either` 用于否定句中表示“也”，不适用于此处的肯定句。"},{"question":"排除了 `either` 之后，再结合副词位置的知识，就能确定最终答案了。","hint":"剩下的 `also` 和 `too` 哪个放在动词前面？","takeaway":"综合考虑肯定句语境和词语位置，`also` 是唯一正确的选项。"}]},{"title":"语篇连贯性","steps":[{"question":"从上下文来看，这句话描述的是主人公做的另一件好事。用哪个词可以自然地引出这个附加的、并列的动作？","hint":"这个词需要有“另外”、“而且”的含义，来连接前文提到的善举。","takeaway":"我们需要一个表示“行为追加”的副词来使上下文连贯。"},{"question":"在 `also`, `too`, `either` 中，哪个词最常用来在句子中间引出一个补充信息或并列行为？","hint":"例如：He is smart, and he is also very kind.","takeaway":"`also` 非常适合在句中连接并列的观点或行为，强调补充信息。"}]}]}},{"number":"22","item_type":"cloze","context_note":"Cloze test passage","stem":"He said he __22__ about $4,700 on good things last year.","options":{"A":"paid","B":"cost","C":"spent","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查表示“花费”的动词用法辨析。\n1.  `spend` 的主语必须是人，常见结构为 `sb. spend money/time on sth.` (在某物上花费) 或 `sb. spend money/time (in) doing sth.` (花费时间/金钱做某事)。\n2.  `pay` 的主语通常是人，常见结构为 `sb. pay money for sth.` (为某物付钱)。注意介词是 `for`。\n3.  `cost` 的主语必须是物或事，常见结构为 `sth. cost sb. money/time` (某物花费了某人多少钱/时间)。\n本句主语是 `He` (人)，且句子结构是 `... money on good things`，介词是 `on`。因此，只有 `spend` 的过去式 `spent` 符合此句型。","knowledge_expansion_md":"### “花费”动词家族：spend, pay, cost, take\n\n这四个动词都与“花费”有关，但主语和搭配结构各不相同，是初中英语的重点和高频考点。\n\n| 动词 | 主语 | 结构与搭配 | 示例 |\n| :--- | :--- | :--- | :--- |\n| **spend** | 人 | `spend money/time on sth.`\u003cbr>`spend money/time (in) doing sth.` | I **spent** 10 yuan **on** this book.\u003cbr>She **spent** two hours (in) finishing her homework. |\n| **pay** | 人 | `pay money for sth.`\u003cbr>`pay sb. (money)` | He **paid** 50 dollars **for** the ticket. | \n| **cost** | 物/事 | `sth. cost (sb.) money/time` | The book **cost** me 10 yuan. | \n| **take** | It (形式主语) | `It takes (sb.) time to do sth.` | It **took** me two hours **to finish** my homework. |\n\n**记忆口诀**：\n- 人 spend on/in doing，物 cost 钱和时间。\n- 人 pay for 为什么，It takes 时间 to do 事。\n\n通过这个口诀，可以快速区分它们在不同句子结构中的应用。","socratic_tracks":[{"title":"关键主语分析","steps":[{"question":"请找出这个句子的主语是什么？是人还是物？","hint":"“He said he...” 后面的从句主语是谁？","takeaway":"句子的主语是 `he`，是一个人。"},{"question":"在表示“花费”的动词 `cost`, `spend`, `pay` 中，哪一个的主语通常是“物”或“事情”？","hint":"我们常说 “The book cost me 10 yuan.”，主语是 The book。","takeaway":"动词 `cost` 的主语通常是物或事，因此可以首先排除它。"}]},{"title":"固定搭配辨析","steps":[{"question":"排除了 `cost` 之后，我们剩下 `paid` 和 `spent`。请看空格后面的介词是什么？","hint":"在 `about $4,700` 之后，连接 `good things` 的词是哪个？","takeaway":"空格后面的介词是 `on`。"},{"question":"动词 `pay` 和 `spend` 在表示“为...而花费”时，分别习惯搭配哪个介词？","hint":"回想一下“为午餐付钱”和“在书上花钱”的英文表达。","takeaway":"`pay` 的固定搭配是 `pay for sth.`，而 `spend` 的固定搭配是 `spend on sth.`。"},{"question":"根据句中的介词 `on`，我们应该选择 `paid` 还是 `spent`？","hint":"哪个动词和 `on` 是好朋友？","takeaway":"因为句中有介词 `on`，所以必须选择 `spent`。"}]},{"title":"句型转换练习","steps":[{"question":"如果我们想用 `cost` 这个词来表达同样的意思，应该怎么改写这个句子？主语应该是什么？","hint":"`cost` 的主语是物或事。这里的“事”是什么？","takeaway":"可以用 `Doing good things` 或 `It` 作主语，句子可以改为：Doing good things cost him about $4,700."},{"question":"同样地，如果想用 `pay` 这个词，我们需要改变句子中的哪个部分？","hint":"想想 `pay` 的固定搭配是什么？","takeaway":"需要将介词 `on` 改为 `for`，句子就变成：He paid about $4,700 for good things."}]}]}},{"number":"23","item_type":"cloze","context_note":"Cloze test passage","stem":"...it can make our world __23__ more beautiful and warmer.","options":{"A":"many","B":"much","C":"little","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词比较级的修饰语。空格后面的 `more beautiful and warmer` 是形容词 `beautiful` 和 `warmer` 的比较级形式。我们需要一个副词来修饰比较级，以加强或减弱其程度。\n1.  `many` 用于修饰可数名词的复数，如 `many books`，不能修饰形容词比较级。\n2.  `much` 可以用作副词，修饰形容词或副词的比较级，表示“...得多”，例如 `much better` (好得多)。\n3.  `little` 也可以修饰比较级，但表示“稍微，略微”，通常用 `a little` 的形式，如 `a little more expensive` (贵一点)。\n根据句意“它能让我们的世界美丽和温暖得多”，`much` 符合语境，表示善行带来的巨大积极影响。因此，正确答案是 `much`。","knowledge_expansion_md":"### 形容词/副词比较级的修饰语\n\n在英语中，我们不能使用 `very` 来修饰比较级（例如，不能说 `very taller`）。要表示“...得多”或“甚至更...”等程度，需要使用特定的副词。这些词是小升初和初中阶段的重点。\n\n**常见的比较级修饰语：**\n\n*   **表示程度深、差异大：**\n    *   `much` (…得多): *This car is **much** more expensive.*\n    *   `far` (…得多): *He is **far** stronger than his brother.*\n    *   `a lot` (…得多，较口语): *I feel **a lot** better today.*\n\n*   **表示程度浅、差异小：**\n    *   `a little` (一点儿): *She is **a little** taller than me.*\n    *   `a bit` (一点儿，较口语): *Could you speak **a bit** more slowly?*\n\n*   **表示“甚至，还”：**\n    *   `even` (甚至更): *It's cold today, but it will be **even** colder tomorrow.*\n    *   `still` (还更): *The second book was good, but the first one was **still** better.*\n\n**核心易错点**：切记 `very` 只能修饰原级（`very beautiful`），不能修饰比较级（`very more beautiful` 是错误的）。而 `much` 既可以修饰比较级（`much more beautiful`），也可以在特定情况下修饰原级（如 `much too beautiful`），但用法不同。","socratic_tracks":[{"title":"被修饰词的形态","steps":[{"question":"请观察空格后面的词组 `more beautiful and warmer`。它们是形容词的什么形式？原级、比较级还是最高级？","hint":"这些词是由 `more + 形容词` 或 `形容词+er` 构成的。","takeaway":"它们是形容词的比较级形式。"},{"question":"我们学过哪些词可以放在比较级的前面，来表示“...得多”或者“...一点”？","hint":"比如，想说“高得多”，我们会用 `____ taller`？","takeaway":"我们可以用 `much`, `far`, `a lot`, `a little`, `even` 等词来修饰比较级。"},{"question":"选项中的 `many`, `much`, `little`，哪一个或哪些可以用来修饰比较级？","hint":"`many` 通常修饰什么词？比如 `many apples`。","takeaway":"`much` 和 `little` (通常作 `a little`) 可以修饰比较级，而 `many` 不可以。"}]},{"title":"语境与词义匹配","steps":[{"question":"根据文章的整体基调，作者是想说善行能让世界发生巨大的积极变化，还是微小的变化？","hint":"文章在赞扬主人公的行为。","takeaway":"作者想强调善行带来的巨大、显著的积极影响。"},{"question":"在可以修饰比较级的 `much`（...得多）和 `little`（几乎不）/`a little`（...一点）之间，哪个词更能表达这种“巨大影响”？","hint":"一个是大大增强，一个是稍微增强。","takeaway":"`much` 表示程度深，最符合语境，能够有力地强调善行的作用。"}]},{"title":"易错点排除法","steps":[{"question":"当我们想说“非常漂亮”时，我们用 `very beautiful` 还是 `much beautiful`？","hint":"这是一个非常基础的用法。","takeaway":"我们用 `very` 来修饰形容词原级，说 `very beautiful`。"},{"question":"那么，当我们想说“漂亮得多”时，也就是修饰比较级 `more beautiful`，还能用 `very` 吗？","hint":"你听过 `very more beautiful` 这种说法吗？","takeaway":"绝对不行，`very` 不能用来修饰比较级，这是一个常见的语法错误。"},{"question":"既然不能用 `very`，我们应该用哪个词来代替它，表达“...得多”的含义呢？","hint":"在今天的选项中就有一个正确的词。","takeaway":"我们必须使用 `much`, `far`, `a lot` 等词来修饰比较级，以表示程度的加深。"}]}]}},{"number":"24","item_type":"cloze","context_note":"Cloze test passage","stem":"“__24__ is better for me than to help others,”...","options":{"A":"Nothing","B":"Something","C":"Everything","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查不定代词在特定句型中的逻辑含义。句子结构是 `__ is better for me than to help others`，意为“对我来说，__ 比帮助别人更好”。\n1.  `Nothing` 意为“没有什么事”。`Nothing is better... than...` 是一个经典句型，表示“没有什么比...更好了”，即强调后者是最好的。代入后意为“对我来说，没有什么比帮助别人更好了”，完全符合语境中主人公乐于助人的形象。\n2.  `Something` 意为“某件事”。代入后意为“有某件事比帮助别人更好”，这与主人公的奉献精神相矛盾。\n3.  `Everything` 意为“每件事”。代入后意为“每件事都比帮助别人更好”，这意味着帮助别人是最差的事，与文意完全相反。\n因此，只有 `Nothing` 符合逻辑和语境。","knowledge_expansion_md":"### 句型 “否定词 + 比较级 = 最高级”\n\n这是一个非常重要且高级的句型，通过使用否定形式来表达强烈的肯定，即最高级的含义。掌握它能让你的英语表达更地道、更有力。\n\n**基本结构**：\n`否定词 + 比较级 + than ...`\n\n**常见形式**：\n1.  **`Nothing is + 形容词比较级 + than ...`**\n    *   `Nothing is more important than health.` (没什么比健康更重要了。) \n    *   等同于：`Health is the most important thing.` (健康是最重要的事。)\n\n2.  **`Nobody/No one is + 形容词比较级 + than ...`**\n    *   `Nobody in our class is taller than Tom.` (我们班没人比汤姆更高了。)\n    *   等同于：`Tom is the tallest in our class.` (汤姆是我们班最高的。)\n\n3.  **`I have never seen a + 形容词比较级 + 名词 + than ...`**\n    *   `I have never seen a more beautiful girl than Mary.` (我从未见过比玛丽更漂亮的女孩了。)\n    *   等同于：`Mary is the most beautiful girl I have ever seen.` (玛丽是我见过最漂亮的女孩。)\n\n**解题技巧**：当在选择题中看到 `Nothing/Nobody` 与比较级结合的选项时，要立刻反应出它可能在表达最高级的含义，然后判断这个最高级含义是否符合语境。","socratic_tracks":[{"title":"逻辑推理与语境","steps":[{"question":"这句话是一个比较句，它在比较 `__` 和 `to help others` (帮助别人) 这两件事。根据文章内容，说话人认为“帮助别人”是一件好事还是坏事？","hint":"整篇文章都在讲述主人公做的好事。","takeaway":"说话人认为“帮助别人”是一件非常好、非常有价值的事。"},{"question":"如果填入 `Something` (有某件事) 或 `Everything` (每件事)，句子就变成了“有某件事/每件事都比帮助别人更好”。这符合说话人的想法吗？","hint":"如果别的都更好，那他为什么还要去帮助别人呢？","takeaway":"这完全不符合逻辑，与文章主旨相矛盾，因此可以排除 B 和 C。"},{"question":"那么填入 `Nothing` (没什么事) 呢？`Nothing is better than to help others` 翻译成中文是什么意思？","hint":"“没有东西比...更好”，说明“...”是最好的。","takeaway":"这句话的意思是“没什么比帮助别人更好了”，即帮助别人是最好的事，完全符合语境。"}]},{"title":"句型：否定+比较级=最高级","steps":[{"question":"你见过 `Nothing is more important than...` 这样的句子吗？它实际上想表达什么意思？","hint":"“没什么比...更重要”，反过来说明什么最重要？","takeaway":"这个句型用比较级的形式，表达了最高级的含义。"},{"question":"那么，请尝试把 `Nothing is more important than health.` 这句话用最高级 `the most important` 来改写。","hint":"主语应该是什么？","takeaway":"可以改写为：`Health is the most important thing.`"},{"question":"现在，让我们回到原题。`Nothing is better for me than to help others.` 这句话，实际上就等同于 `To help others is the ______ thing for me.` 空格里该填什么？","hint":"`better` 对应的最高级是什么？","takeaway":"这句话等同于 `To help others is the best thing for me.`（帮助别人对我来说是最好的事）。"}]},{"title":"不定代词词义辨析","steps":[{"question":"请分别解释 `Nothing`, `Something`, `Everything` 这三个词的基本含义。","hint":"它们分别代表“零”、“某个”和“全部”。","takeaway":"`Nothing` 指“无物”，`Something` 指“某物/某事”，`Everything` 指“万物/每件事”。"},{"question":"将这三个词逐一带入句子 `__ is better than to help others.`，然后分别翻译成通顺的中文。","hint":"A: 没什么比帮助别人更好。B: 有件事比帮助别人更好。C: 每件事都比帮助别人更好。","takeaway":"通过翻译，可以直观地感受到三个选项带来的截然不同的逻辑含义。"},{"question":"比较这三个翻译后的句子，哪一个最符合一个乐善好施的人会说的话？","hint":"一个热爱帮助别人的人，会把这件事看得至高无上。","takeaway":"只有“没什么比帮助别人更好”这句话，才符合主人公的身份和心境。"}]}]}},{"number":"25","item_type":"cloze","context_note":"Cloze test passage","stem":"...Luke said to the reporters __25__.","options":{"A":"successfully","B":"happily","C":"quickly","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在特定语境中选择合适的副词。句意为“卢克……对记者们说”。选项A“successfully”意为“成功地”，通常修饰具有明确成功标准的动作，如完成任务；选项C“quickly”意为“迅速地”，强调速度。选项B“happily”意为“高兴地”，用来描述说话者的心情。在多数语境下，如获奖或宣布好消息后接受采访，说话者心情是愉快的。因此，“高兴地”说是最符合人物情感和常见情景的选项。","knowledge_expansion_md":"### 副词的用法与辨析\n\n1.  **副词的功能**：副词主要用来修饰动词、形容词、其他副词或整个句子，说明动作的方式、地点、时间、程度等。本题考查的是修饰动词`said`的方式副词。\n2.  **方式副词的构成**：多数方式副词由“形容词 + -ly”构成，例如 `happy -> happily`, `quick -> quickly`, `successful -> successfully`。\n3.  **不规则形式**：部分副词形式特殊，如 `good` (adj.) -> `well` (adv.), `fast` (adj.) -> `fast` (adv.), `hard` (adj.) -> `hard` (adv.)。\n4.  **词义辨析**：做这类题时，必须理解每个副词的精确含义，并结合上下文的逻辑和情感色彩来判断。`successfully` 侧重结果，`happily` 侧重情感，`quickly` 侧重速度。在没有明确上下文提示速度或成功时，描述人物情感的副词往往是更普遍的选择。","socratic_tracks":[{"title":"副词的功能","steps":[{"question":"这个句子中，我们需要填一个词来描述哪个动作？","hint":"看看横线前面的动词是什么。","takeaway":"我们需要一个副词来修饰动词“said”，说明“说”这个动作是怎样进行的。"},{"question":"A, B, C三个选项都是什么词性？它们通常用来做什么？","hint":"这些词大多以-ly结尾。","takeaway":"这三个选项都是副词，用来修饰动词，描述动作的方式。"}]},{"title":"词义辨析","steps":[{"question":"“happily”是什么意思？它描述的是动作的哪个方面？","hint":"想一想形容词“happy”的意思。","takeaway":"“happily”意为“高兴地”，描述的是执行动作时的主观心情。"},{"question":"“successfully”和“quickly”又分别描述了动作的哪个方面？","hint":"“success”是成功，“quick”是快。","takeaway":"“successfully”描述动作的结果是成功的，“quickly”描述动作的速度是快的。"},{"question":"在描述“说话”这个动作时，我们更常描述说话人的心情、速度还是结果？","hint":"想象一下新闻采访的画面，记者通常会关注被采访者的情绪。","takeaway":"描述说话时的心情（如高兴地）在日常表达中非常常见且合乎逻辑。"}]},{"title":"语境逻辑推断","steps":[{"question":"根据文章，Luke 对帮助别人这件事持什么态度？","hint":"他每天都做好事，并且说 “Nothing is better for me than to help others” (没什么比帮助别人更好了)。","takeaway":"他对帮助别人充满热情，并从中感到快乐和满足。"},{"question":"因此，当他向记者说出这句话时，用哪个副词来描述他的状态最合适？","hint":"他的心情应该与他所说的话的内容一致。","takeaway":"用 `happily` (高兴地) 最符合他快乐满足的心情。文中没有线索表明他说话很快或是在强调“成功地”说出这句话。"}]}]}}]},{"section_title":"IV. 阅读判断。正确的写“T”,错误的写“F”。(共5分)","section_instruction":"After school, Linda and Mary went home together. They washed the clothes and cleaned the room. Then they did their homework. It was very late. They were very tired, but they were happy. Because they could help their mother. Their mother was ill, but she was happy, too.","items":[{"number":"26","item_type":"reading","context_note":"Reading passage about Linda and Mary","stem":"After school, Linda and Mary played games together.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查对文章细节的理解和判断。题目陈述为：“放学后，琳达和玛丽一起玩了游戏。”（After school, Linda and Mary played games together.）根据原文，“They washed the clothes and cleaned the room. Then they did their homework.”（她们洗了衣服，打扫了房间，然后做了作业。）原文详细列举了她们放学后做的事情，其中并不包括“玩游戏”。因此，题目的陈述与原文内容不符，是错误的。","knowledge_expansion_md":"### 阅读判断题解题技巧\n\n1.  **关键词定位**：做阅读判断题时，首先要找出题干中的关键词，如本题的 `played games`。然后带着关键词回到原文中快速寻找相关信息句。\n2.  **注意否定信息**：要对文中的否定词（如 `not`, `no`, `never`, `didn't`, `hardly` 等）和具有否定意义的词（如 `instead of`, `rather than`）保持高度敏感。这些词往往是判断正误的关键。\n3.  **辨别“绝对”与“部分”**：注意题干或原文中表示绝对性的词（如 `all`, `every`, `only`）和表示部分性的词（如 `some`, `may`, `often`）。绝对化的表述常成为考点。\n4.  **区分“未提及”与“错误”**：如果原文完全没有提到相关信息，应判断为“未提及”（Not Mentioned），而不是“错误”（False）。但在中小学T/F判断题中，若题干做出了一个原文未支持的肯定性陈述，通常判断为“错误”（F）。","socratic_tracks":[{"title":"事实核对与排除"
