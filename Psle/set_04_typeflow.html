,"steps":[{"question":"题目说琳达和玛丽放学后做了什么？","hint":"找到题干中的动词词组。","takeaway":"题目说她们“played games together”（一起玩了游戏）。"},{"question":"现在，回到原文，看看文章是怎么描述她们放学后做的事情的？","hint":"仔细阅读文章中描述她们活动的句子。","takeaway":"原文说：“They washed the clothes and cleaned the room. Then they did their homework.”（她们洗了衣服，打扫了房间。然后她们做了作业。）"},{"question":"比较一下题目和原文的描述。原文提到的活动清单里，包含“玩游戏”这一项吗？","hint":"原文列举的活动有洗衣服、打扫房间、做作业。","takeaway":"不包含。原文只提到了洗衣服、打扫房间和做作业。因此，题目中“玩游戏”的说法与原文事实不符，是错误的。"}]}]}},{"number":"27","item_type":"reading","context_note":"Reading passage about Linda and Mary","stem":"Linda's father was ill.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查对文章关键信息的准确判断。题目陈述为：“琳达的爸爸生病了。”（Linda's father was ill.）而根据原文，“Their mother was ill, but she was happy, too.”（她们的妈妈生病了，但是她也很高兴。）原文明确指出生病的是妈妈（mother），而不是爸爸（father）。因此，题目的陈述与原文内容不符，是错误的。","knowledge_expansion_md":"### 阅读理解中的信息提取策略\n\n1.  **直接信息提取**：这是阅读理解中最基础的能力。答案通常可以在文章的某一句话中直接找到。做题时，通过定位关键词，找到原文对应句，进行比对即可。\n2.  **关注关键名词**：在阅读时，要特别注意句子中的主语和宾语，分清动作的发出者和承受者。本题的关键就在于区分 `father` 和 `mother` 这两个不同的家庭成员。\n3.  **同义词/同义转述**：有时题干不会完全使用原文的词句，而是进行同义转述。例如，本题中的 `ill`，在其他题目中可能会被替换为 `sick`，或者描述为 `was not well`。理解并积累同义词汇是提高阅读能力的重要一环。","socratic_tracks":[{"title":"关键信息核对","steps":[{"question":"这道题目的核心判断信息是关于谁生病了？","hint":"看题干的主语。","takeaway":"题目说的是“琳达的爸爸”（Linda's father）生病了。"},{"question":"我们回到原文，文章中提到有家人生病了，具体是谁？","hint":"找到原文中含有 `ill` 这个词的句子。","takeaway":"原文说：“Their mother was ill...”（她们的妈妈生病了……）。"},{"question":"既然文章说的是妈妈生病，而题目说的是爸爸生病，那么这个题目陈述是正确的还是错误的？","hint":"“爸爸”和“妈妈”是同一个人吗？","takeaway":"是错误的。这属于典型的“张冠李戴”，题目陈述与原文事实不符。"}]}]}},{"number":"28","item_type":"reading","context_note":"Reading passage about Linda and Mary","stem":"They didn't do their homework.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查对文章细节的准确判断，特别是对否定信息的辨识。题目陈述为：“她们没有做作业。”（They didn't do their homework.）这是一个否定陈述。然而，根据原文，“Then they did their homework.”（然后她们做了作业。）原文使用了肯定的陈述，明确指出她们“做”了作业。因此，题目的否定陈述与原文的肯定事实完全相反，是错误的。","knowledge_expansion_md":"### 如何处理阅读中的肯定与否定信息\n\n1.  **识别否定标记**：做题时要对题干和原文中的各类否定形式高度警惕。这包括：\n    *   **显性否定**：`not`, `no`, `never`, `don't`, `didn't`。\n    *   **半否定词**：`hardly`, `seldom`, `rarely` (几乎不)。\n    *   **具有否定意义的介词/连词**：`without` (没有), `instead of` (而不是)。\n2.  **肯定与否定的转换**：理解肯定陈述与否定陈述之间的逻辑对立关系。例如，“做了作业” (`did their homework`) 就隐含了“不是没有做作业” (`it's not true that they didn't do their homework`)。\n3.  **注意转折词**：`Instead`（相反地）, `but`（但是）, `however`（然而）等转折词后面的内容往往是作者强调的重点，也常常是与前文内容相反的事实，是解题的重要线索。","socratic_tracks":[{"title":"肯定与否定的对立","steps":[{"question":"题目是怎么描述她们和作业的关系的？注意看有没有否定词。","hint":"找到 `didn't` 这个词。","takeaway":"题目用否定句说“她们没有做作业”（They didn't do their homework）。"},{"question":"文章又是怎么描述她们和作业的关系的？","hint":"找到文章中含有 `homework` 的那句话。","takeaway":"文章用肯定句说“Then they did their homework.”（然后她们做了作业。）"},{"question":"“没有做”（didn't do）和“做了”（did）这两个描述是矛盾的还是相符的？","hint":"一个是否定，一个是肯定。","takeaway":"这两个描述是完全矛盾的，因此题目陈述是错误的。"}]}]}},{"number":"29","item_type":"reading","context_note":"Reading passage about Linda and Mary","stem":"They cleaned the room.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"本题考查对文章细节的直接理解。题目陈述为：“她们打扫了房间。”（They cleaned the room.）根据原文第二句，“They washed the clothes and cleaned the room.”（她们洗了衣服，打扫了房间。）原文明确提到了她们打扫了房间。因此，题目的陈述与原文信息完全一致，是正确的。","knowledge_expansion_md":"1.  **动词过去式**：本题的关键动词是 `cleaned`，是 `clean` 的过去式，表示动作发生在过去。规则动词的过去式通常是在动词原形后加 `-ed`，例如 `work-worked`, `watch-watched`。\n2.  **同义词替换**：在阅读理解中，题目常会用原文词汇的同义词或同义短语来设置。例如，文中的 `tidied up the room` (整理房间) 和题目中的 `cleaned the room` (打扫房间) 意思相近，可以互换。\n3.  **人称代词**：`They` 是主格人称代词，指代“他们/她们/它们”，在这里指代上文提到的 Linda 和 Mary 两个人。","socratic_tracks":[{"title":"阅读细节定位","steps":[{"question":"要判断这句话的对错，我们应该在文章中寻找什么样的信息？","hint":"关注句子中的关键人物（They）和关键动作（cleaned the room）。","takeaway":"我们需要在文章中找到描述 Linda 和 Mary 是否“打扫了房间”（cleaned the room）的句子。"},{"question":"请在原文中找到这个句子。","hint":"就在文章的开头部分。","takeaway":"原文第二句就是：“They washed the clothes and cleaned the room.”"},{"question":"既然原文直接说了她们“cleaned the room”，那么题目“They cleaned the room.”是对还是错？","hint":"题目的陈述和原文的一部分完全一样。","takeaway":"这句话在原文中可以找到直接证据，是完全正确的事实陈述。"}]}]}},{"number":"30","item_type":"reading","context_note":"Reading passage about Linda and Mary","stem":"Their mother was not happy.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"本题考查对文章细节的理解，特别是人物情感的判断。题目陈述为：“她们的妈妈不高兴。”（Their mother was not happy.）而根据原文最后一句，“Their mother was ill, but she was happy, too.”（她们的妈妈生病了，但是她也很高兴。）原文明确指出妈妈是“高兴的”（happy）。因此，题目的陈述与原文内容直接相反，是错误的。","knowledge_expansion_md":"1.  **be动词的否定句**：`was not happy` 是be动词的一般过去时否定形式。其结构为：主语 + was/were + not + 形容词/名词等。例如：`He was not at home.` (他当时不在家)。`was not` 可以缩写为 `wasn't`。\n2.  **情感类词汇**：`not happy` (不高兴) 的同义表达有 `unhappy`, `sad` (伤心), `angry` (生气), `upset` (心烦意乱的)。在阅读中，作者可能通过这些直接的词汇，也可能通过描述人物的动作（如 `frowned` 皱眉）或语言来暗示其情感。\n3.  **所有格**：`Their` 是 `they` 的形容词性物主代词，意为“他们的/她们的/它们的”，后面必须跟名词，如 `their mother` (她们的妈妈)。","socratic_tracks":[{"title":"转折与否定","steps":[{"question":"题目说妈妈的心情是怎样的？","hint":"注意 `not` 这个否定词。","takeaway":"题目说她“不高兴”（was not happy）。"},{"question":"我们去原文最后一句看看，原文是怎么描述妈妈的心情的？","hint":"找到原文中描述 mother 情感的词。","takeaway":"原文说：'...but she was happy, too.'（但是她也很高兴。）"},{"question":"“不高兴”（not happy）和“高兴”（happy）是相同的意思还是相反的意思？","hint":"一个有 not，一个没有。","takeaway":"是完全相反的意思。因此题目的陈述是错误的。"},{"question":"原文中的 'but' (但是) 这个词起到了什么作用？","hint":"转折词通常用来强调后面的内容。","takeaway":"'but' 是一个转折词，它提示我们后面的情况（happy）与前面的情况（ill）形成了对比，并且强调了妈妈“高兴”这个事实。"}]}]}}]},{"section_title":"V. 多任务混合阅读。(共10分)","section_instruction":"Dragon Boat Festival, also called(被称作) Duanwu Festival, is usually in June. On May 5th of the Chinese lunar calendar(中国农历) we make zongzi and share zongzi with parents, grandparents and friends. We also go out and watch dragon boat races(比赛). We see films about the great poet—Qu Yuan.\nMid-Autumn Festival is also a traditional(传统的) Chinese festival. It's on August 15th of the Chinese lunar calendar. People will get together and have a big meal. People will have a lot of food and rice in the evening. Mothers are going to make mooncakes. Grandparents will tell the story about Chang'e. Children will watch cartoons about the moon and read a poem about “FAMILY”. People will be happy all day.","items":[{"number":"31","item_type":"reading","context_note":"Reading passage on festivals","stem":"Duanwu Festival is on May 5th of the Chinese lunar calendar.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"此题为文化常识判断题。题目意为“端午节是在中国农历的五月五日”。这是一个基本事实，端午节（Duanwu Festival / Dragon Boat Festival）确实是中国及其他亚洲地区庆祝的一个传统节日，其日期固定在农历五月初五。阅读文章作为信息来源，极大概率会陈述这一正确信息。因此，该陈述为真（T）。","knowledge_expansion_md":"1.  **日期表达**：在英语中，表示具体某一天时，介词用 `on`。日期的表达通常用“月+日（序数词）”，如 `on May 5th` (读作 on May the fifth)。\n2.  **序数词**：表示顺序的词叫序数词。从4开始，大部分序数词由“基数词+th”构成，但要注意特殊变化，如 `one-first(1st)`, `two-second(2nd)`, `three-third(3rd)`, `five-fifth(5th)`。\n3.  **农历与公历**：`lunar calendar` 指的是“农历”或“阴历”，是根据月亮运行周期制定的。我们日常使用的日历是 `solar calendar` 或 `Gregorian calendar`（公历/阳历）。很多中国传统节日，如春节（Spring Festival）和中秋节（Mid-Autumn Festival），都使用农历日期。","socratic_tracks":[{"title":"日期表达法","steps":[{"question":"题目中 “on May 5th” 的 “on” 是什么作用？如果只说“在五月”，应该用哪个介词？","hint":"英语中，表示“在具体某一天”用 on，表示“在某一月”或“在某一年”用 in。","takeaway":"介词 on 用于具体的某一天，而 in 用于月份、年份等更长的时间段。"},{"question":"“5th” 这个词是怎么来的？“第一”、“第二”、“第三”又该怎么说？","hint":"这类表示顺序的词叫序数词，前三个有特殊形式。","takeaway":"“5th”是序数词fifth的缩写。第一(1st)、第二(2nd)、第三(3rd)分别是first, second, third。"}]},{"title":"东西方日历","steps":[{"question":"“lunar calendar” 是指我们平时说的阳历还是阴历？","hint":"“Lunar” 这个词和月亮（moon）有关。","takeaway":"“lunar calendar” 指的是“阴历”或“农历”，是根据月亮运行周期制定的。"},{"question":"我们现在常用的日历，比如1月1日元旦，是基于哪种日历？它的英文是什么？","hint":"这种日历是根据地球绕太阳的运动来计算的。","takeaway":"我们常用的日历是“阳历”或“公历”，英文是 “solar calendar” 或 “Gregorian calendar”。"}]},{"title":"节日文化知识","steps":[{"question":"“Duanwu Festival” 是中国的哪个传统节日？这个节日有什么习俗？","hint":"这个节日我们会吃粽子、赛龙舟。","takeaway":"“Duanwu Festival” 就是端午节，习俗有吃粽子（eating zongzi）和赛龙舟（dragon boat racing）。"},{"question":"你知道春节和中秋节的英文名称吗？","hint":"春节是 “Spring...”，中秋节是 “Mid-...”","takeaway":"春节是 “Spring Festival” 或 “Chinese New Year”，中秋节是 “Mid-Autumn Festival”。"}]}]}},{"number":"32","item_type":"reading","context_note":"Reading passage on festivals","stem":"“Big meal” means(意思是) “breakfast”.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"F","explanation_md":"此题考察在语境中理解词义的能力。题目意为“‘big meal’的意思是‘早餐’”。“Breakfast” 指“早餐”，是一天中的第一餐。而 “big meal”（大餐）在节日的语境下，通常指为庆祝而准备的、比平时更丰盛、更多人参与的正餐，如午餐或晚餐（例如年夜饭）。早餐通常不具备“大餐”在节日里的这种庆祝和丰盛的含义。因此，将节日的 “big meal” 等同于 “breakfast” 是不正确的，故判断为错误（F）。","knowledge_expansion_md":"1.  **词义辨析**：需要区分不同“餐”的词汇：`breakfast` (早餐), `lunch` (午餐), `dinner` (晚餐，正餐), `supper` (晚餐，晚饭), `feast` (盛宴)。`A big meal` 可以指分量大的一餐，但在特定语境（如节日）下，它更接近 `feast` 的含义。\n2.  **语境的重要性**：词或短语的意义不是孤立的，很大程度上取决于它所在的上下文（context）。脱离“节日”这个语境，“a big meal”可能只是指“一顿吃得多的饭”，但在节日背景下，它被赋予了“盛宴、团圆饭”的文化内涵。\n3.  **文化常识**：了解中西方文化中节日的庆祝方式有助于理解。无论是中国的年夜饭，还是西方的感恩节大餐，节日里的“大餐”通常都是指晚餐。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"“breakfast” 指的是一天中的哪一餐？这个单词有什么有趣的来源吗？","hint":"想一想这个单词的构成: break (打破) + fast (禁食)。","takeaway":"“Breakfast” 指的是早餐，即打破一夜禁食后的第一餐。"},{"question":"“big meal” 从字面上看是什么意思？在节日的语境下，它通常指代什么样的餐食？","hint":"节日的餐食会比平时的更丰盛、更重要吗？通常是午餐还是晚餐？","takeaway":"“Big meal” 指“大餐”，在节日语境下通常指菜肴丰盛、具有庆祝意义的正餐（午餐或晚餐），而不是早餐。"}]},{"title":"语境推断","steps":[{"question":"为什么在判断 “big meal” 的意思时，考虑“节日”这个背景很重要？","hint":"一个词或短语的意思会随着它出现的环境（语境）而改变吗？","takeaway":"语境（如“节日”）为我们理解词义提供了关键线索，它能让词语产生特定的含义。"},{"question":"如果一个人早上吃了很多东西，我们能说他吃了一顿 “big breakfast” 吗？这和题目中的 “big meal” 是一回事吗？","hint":"“big breakfast” 强调的是早餐分量大，而题目中的 “big meal” 在节日背景下有更丰富的文化含义。","takeaway":"“a big breakfast”是可能的，但它不等于“big meal”在节日语境下的特定含义——“盛宴”，因此题目中的等同是错误的。"}]},{"title":"逻辑与常识","steps":[{"question":"根据你的生活常识，中国传统节日里的“大餐”通常是早餐、午餐还是晚餐？","hint":"想想春节的年夜饭、中秋的团圆饭是在什么时候吃。","takeaway":"根据常识，中国节日的“大餐”或“盛宴”通常是晚餐，是一天中最重要的一餐。"},{"question":"那么， “‘Big meal’ means ‘breakfast’” 这个陈述符合常识和逻辑吗？","hint":"早餐和节日大餐的性质、时间和重要性一样吗？","takeaway":"将节日的“大餐”等同于“早餐”不符合文化常识和基本逻辑，因此这个陈述是错误的。"}]}]}},{"number":"33","item_type":"reading","context_note":"Reading passage on festivals","stem":"People will have a good day on Mid-Autumn Festival.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"T","explanation_md":"这道题是判断正误题，题干意为“人们在中秋节会过得很愉快”。根据我们对中秋节的文化背景了解，这是一个家人团聚、赏月、吃月饼的传统佳节。阅读文章中通常会描述这些充满幸福感的活动。因此，可以合理推断出人们在这一天会过得很愉快，所以该陈述为“正确”（True）。在没有找到明确相反信息的情况下，基于对节日氛围的常规描述，此判断成立。","knowledge_expansion_md":"### 主旨推断与情感态度判断\n\n在阅读理解中，有些题目不直接考察文中的某个句子，而是考察对文章整体或段落大意的理解和推断。本题就是典型的情感态度判断题。\n\n1.  **寻找关键词**：留意文中描述性、评价性的词语，尤其是形容词和副词，如 `happy`, `wonderful`, `enjoy`, `reunion`, `delicious`。这些词语直接或间接地表达了情感色彩。\n2.  **理解文化背景**：了解文章所涉及话题的文化背景（如中国节日的寓意）有助于做出更准确的推断。\n3.  **区分事实与观点**：事实（Fact）是客观存在的陈述，而观点（Opinion）是作者或文中人物的主观看法或感受。本题的“have a good day”属于一种主观感受和评价，需要通过文中的事实描述来支撑。","socratic_tracks":[{"title":"细节与推断","steps":[{"question":"题干说人们在中秋节会“过得很愉快”（have a good day）。你觉得文章里会一字不差地出现这句话吗？","hint":"作者更可能通过描述具体的活动来展示人们的心情，而不是直接给出结论。","takeaway":"阅读理解不仅要找完全匹配的句子，更要学会根据文中的细节描述进行合理的推断。"},{"question":"如果文章描述了“家庭团聚”、“吃美味的月饼”、“一起赏月”，这些活动通常会带给人什么样的感觉？","hint":"想一想，当你和家人一起做这些事情时，你的心情是怎样的？","takeaway":"通过理解具体活动（如 family reunion）所蕴含的情感，我们可以推断出人物的心情和文章的整体氛围。"}]},{"title":"情感词汇","steps":[{"question":"除了 `happy` 之外，你还能想到哪些词可以用来描述一个“好日子”或愉快的心情？","hint":"可以想想“精彩的”、“有趣的”、“放松的”这些词用英语怎么说。","takeaway":"积累如同义词 `wonderful`, `enjoyable`, `pleasant`, `fantastic` 等积极情感的词汇，有助于我们快速把握文章的情感基调。"},{"question":"反过来，如果文章描述的是一个“糟糕的日子”，可能会用哪些词？","hint":"比如“悲伤的”、“无聊的”、“困难的”。","takeaway":"通过对比，我们可以更深刻地理解词语的感情色彩，并将其应用于阅读判断中。"}]},{"title":"文化背景知识","steps":[{"question":"你知道中秋节在中国文化里最重要的寓意是什么吗？","hint":"想想中秋节的月亮是什么形状的，它象征着什么？","takeaway":"中秋节在文化中象征着“团圆”（reunion），这本身就是一个非常积极和美好的寓意。"},{"question":"了解这个文化背景对我们做这道题有什么帮助？","hint":"当我们知道中秋节是个象征团圆的快乐节日时，即使文章没有明说，我们也能做出正确的判断。","takeaway":"将语言学习与文化知识相结合，可以帮助我们更深层次地理解文章内容并做出准确判断。"}]}]}},{"number":"34","item_type":"reading","context_note":"Reading passage on festivals","stem":"When is Mid-Autumn Festival?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"On the 15th day of the 8th lunar month.","explanation_md":"这是一道细节信息题，询问中秋节的具体日期。问题以 “When” 开头，要求回答时间。在介绍节日的文章中，通常会明确说明节日的日期。根据常识和文章通常的写法，中秋节是在农历八月十五。因此，在阅读时，我们需要定位到关键词 “Mid-Autumn Festival”，然后在其附近寻找包含月份和日期的信息。标准答案是 “On the 15th day of the 8th lunar month.”（在农历八月十五日）。","knowledge_expansion_md":"### 如何在英文中表达日期\n\n1.  **基本结构**：通常使用“介词 + 月份 + 序数词”或“介词 + the + 序数词 + of + 月份”。\n    *   `on August 15th`\n    *   `on the 15th of August`\n\n2.  **序数词**：表示日期的“号”要用序数词，而不是基数词。注意不规则变化：\n    *   1st (first), 2nd (second), 3rd (third)\n    *   以-ty结尾的整十，如 20th (twentieth)\n    *   非整十，如 21st (twenty-first), 32nd (thirty-second)\n\n3.  **农历 vs. 阳历**：\n    *   我们日常使用的公历是 `solar calendar`。\n    *   中国传统节日使用的农历是 `lunar calendar`。`Lunar` 的意思是“月亮的”。所以中秋节的日期是 `the 15th day of the 8th lunar month`。\n\n4.  **时间介词**：\n    *   `on` 用于具体某一天或星期几：`on Monday`, `on my birthday`, `on May 1st`。\n    *   `in` 用于较长的时间，如月份、年份、季节：`in May`, `in 2024`, `in summer`。\n    *   `at` 用于具体时刻：`at 8 o'clock`, `at noon`。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"看到问题开头的 “When”，你应该在文章中寻找哪一类信息？","hint":"“When” 是用来提问时间的疑问词。","takeaway":"以 “When” 开头的特殊疑问句，其答案一定是和时间、日期相关的信息。"},{"question":"除了 “When”，题干中还有哪个关键词可以帮助我们快速在文章中找到答案？","hint":"这个节日的名称是什么？","takeaway":"在问题中找到核心名词（如 Mid-Autumn Festival），然后在文章中快速扫描定位这个词，答案通常就在它的前后。"}]},{"title":"时间介词的运用","steps":[{"question":"如果我想说“在五月”，应该用 `in May` 还是 `on May`？","hint":"对于月份、年份等比较长的时间段，我们用 `in`。","takeaway":"介词 `in` 用于表示“在某月、某年、某季节”。"},{"question":"那如果我想说“在五月一日”，具体到某一天了，又该用哪个介词呢？","hint":"当时间精确到“天”时，介词会发生变化。","takeaway":"介词 `on` 用于表示“在具体某一天或星期几”。"}]},{"title":"农历与序数词","steps":[{"question":"我们平时说的“一月、二月”是阳历。那像春节、中秋节这样的传统节日，用的是什么历法？它的英文怎么说？","hint":"这种历法是根据月亮的变化来计算的，月亮的英文是 `moon`。","takeaway":"中国的农历是 `lunar calendar`，其中 `lunar` 意为“月亮的”。"},{"question":"在说“十五号”时，我们用 `fifteen` 还是 `fifteenth`？这两者有什么区别？","hint":"`fifteen` 是“十五”，`fifteenth` 是“第十五”。","takeaway":"在英文中表达日期“几号”时，必须使用序数词（如 1st, 2nd, 3rd, 4th...），而不是基数词。"}]}]}},{"number":"35","item_type":"reading","context_note":"Reading passage on festivals","stem":"What will people eat on Dragon Boat Festival?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Zongzi / Rice dumplings","explanation_md":"这是一道细节信息题，询问人们在端午节吃什么。问题以 “What” 开头，并且有明确的关键词 “eat” 和 “Dragon Boat Festival”。解题时，我们应在文章中快速定位 “Dragon Boat Festival” 这个词组。在它附近，寻找与 “eat” (吃) 或 “food” (食物) 相关的内容。文章中很可能会出现类似 “People eat zongzi on this day.” 的句子。Zongzi (粽子) 是端午节的传统食物，它的另一种英文说法是 rice dumplings (米饭饺子/团子)。","knowledge_expansion_md":"### 中国节日与特色食物\n\n在英语学习中，介绍中国传统文化是一个常见话题。了解主要节日的特色食物及其英文表达非常重要。\n\n*   **Spring Festival (春节)**: `dumplings` (饺子), `spring rolls` (春卷), `fish` (鱼, 寓意年年有余), `niangao` (年糕, rice cake)\n*   **Lantern Festival (元宵节)**: `tangyuan` or `yuanxiao` (汤圆/元宵, sweet rice balls)\n*   **Dragon Boat Festival (端午节)**: `zongzi` (粽子, sticky rice dumplings wrapped in bamboo leaves)\n*   **Mid-Autumn Festival (中秋节)**: `mooncake` (月饼)\n\n**表达方式**：\n当你想介绍某个节日的食物时，可以说：\n`People eat [food name] during the [festival name].`\n`[Food name] is the traditional food for [festival name].`","socratic_tracks":[{"title":"信息检索策略","steps":[{"question":"看到这个问题 “What will people eat on Dragon Boat Festival?”，你会首先在文章里找哪个词？","hint":"先找最核心、最具体的信息点，也就是节日的名称。","takeaway":"解决细节题的第一步是定位题干中的核心关键词（如 Dragon Boat Festival）。"},{"question":"找到了“Dragon Boat Festival”之后，你会在它周围寻找哪些词来帮助你找到答案？","hint":"问题问的是“吃什么”，所以要找和“吃”或“食物”相关的词。","takeaway":"定位核心关键词后，再根据疑问词（如 What...eat）寻找相关的动词或名词（如 eat, food, taste）。"}]},{"title":"文化词汇的翻译","steps":[{"question":"“粽子”在英文里为什么可以直接说 `zongzi`？","hint":"想一想“寿司”`sushi`，“披萨”`pizza`，这些词有什么共同点？","takeaway":"对于具有浓厚文化特色的事物，英文常直接采用其源语言的发音作为外来词，如 `zongzi`。"},{"question":"如果一个外国人没见过粽子，只告诉他 `zongzi` 他可能不明白。我们通常会怎么补充说明？","hint":"描述一下它的材料和样子，比如它是用米做的。","takeaway":"为了便于理解，我们常常会在拼音词后加上解释性的英文，如 `zongzi (rice dumplings)`。"}]},{"title":"举一反三","steps":[{"question":"我们学会了如何找“端午节吃什么”。如果问题换成“中秋节人们做什么？(What do people do on Mid-Autumn Festival?)”，你的解题思路会变吗？","hint":"解题的方法和步骤是一样的，只是关键词变了。","takeaway":"掌握了“定位关键词-寻找相关信息”的方法，就可以解答所有类似的细节题。"},{"question":"那么，根据你对中秋节的了解，人们会吃什么？它的英文是什么？","hint":"中秋节的月亮又圆又亮，人们吃的食物也和月亮有关。","takeaway":"学以致用，将阅读方法和文化知识结合起来，中秋节吃月饼 `mooncake`。"}]}]}}]},{"section_title":"VI. 话题作文。(共10分)","section_instruction":"","items":[{"number":"36","item_type":"writing","context_note":"","stem":"请根据下面的参考词汇，描述一下你上周末的活动。\n要求：条理清楚，语句通顺，书写规范，无语法错误，不少于5句话。\n参考词汇：had a good weekend, went to a park, went there by bike, went fishing, felt very happy...","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"I had a very good weekend. Last Saturday, I went to the park with my family. We went there by bike, and the ride was very relaxing. In the park, we went fishing by the beautiful lake. I was so excited when I caught a small fish! At the end of the day, I felt very happy because I had a wonderful time with my family.","explanation_md":"这篇范文符合题目所有要求。首先，文章以“I had a very good weekend”作为主题句，总起全文。接着，按照时间顺序和活动逻辑，依次描述了“去公园”、“骑车去”、“钓鱼”等活动细节，自然地使用了所有参考词汇。句子之间使用了 `and`, `because` 等连词，使行文流畅。最后，以“I felt very happy”结尾，总结了感受，与开头相呼应。全文使用了正确的一般过去时态，符合描述过去活动的要求，且句子数量和内容丰满度都达到了标准。","knowledge_expansion_md":"### 记叙文写作三要素\n\n写好一篇描述过去活动的记叙文，需要掌握以下三个关键点：\n\n1.  **时态统一 (Tense)**：描述发生在过去的活动，全文的核心时态应为**一般过去时**。要特别注意动词过去式的变化，包括规则变化（如 `play-played`）和不规则变化（如 `go-went`, `have-had`, `feel-felt`）。\n\n2.  **结构清晰 (Structure)**：一篇好的小短文应该有清晰的结构，通常是“总-分-总”。\n    *   **总 (Beginning)**：用一句话概括主题，如 `I had a good weekend.`\n    *   **分 (Middle)**：按时间顺序或逻辑顺序，用2-3句话描述具体做了什么、和谁、在哪里等细节。\n    *   **总 (End)**：用一句话总结感受或升华主题，如 `I felt very happy.`\n\n3.  **内容充实 (Details & Cohesion)**：不要只罗列活动，要添加细节让文章更生动。可以使用5W1H（Who, What, When, Where, Why, How）来丰富句子。同时，使用简单的连词（如 `and`, `so`, `because`, `then`）将句子连接起来，使文章成为一个有机的整体，而不是句子的简单堆砌。","socratic_tracks":[{"title":"确定核心时态","steps":[{"question":"题目要求你描述“上周末”（last weekend）的活动，这件事是发生在过去、现在还是将来？","hint":"“last” 这个词的意思是“上一个”，表示过去的时间。","takeaway":"描述过去发生的事情，必须使用一般过去时。"},{"question":"那么，参考词汇中的动词 `go`, `have`, `feel` 在你的作文里应该写成什么形式？","hint":"想一想这些动词的过去式是什么。它们是规则动词还是不规则动词？","takeaway":"写作时要特别注意不规则动词的过去式，如 `go` 变成 `went`，`have` 变成 `had`，`feel` 变成 `felt`。"}]},{"title":"搭建文章结构","steps":[{"question":"一篇短文最好怎样开头，才能让读者一眼就知道你要写什么？","hint":"从参考词汇中找一句总起性的话。","takeaway":"用一个主题句（Topic Sentence）来开始文章，例如 `I had a good weekend.`，可以起到开门见山的作用。"},{"question":"有了开头和结尾（感受），中间部分应该写些什么？按照什么顺序写会比较清楚？","hint":"想一想你做事情的先后顺序：是先到达公园，还是先开始钓鱼？","takeaway":"文章主体部分应按照时间顺序或活动发展的逻辑顺序来组织，让叙述条理清晰。"},{"question":"如何让你的句子之间连接得更自然，而不是一句一句地往外蹦？","hint":"在句子之间加一些表示“然后”、“和”、“因为”的词。","takeaway":"使用 `and`, `then`, `because`, `so` 等简单的连词，可以让你的文章更流畅、更有逻辑性。"}]},{"title":"丰富句子细节","steps":[{"question":"“I went to a park.” 这个句子很正确，但有点简单。我们可以添加什么信息让它更具体、更有趣？","hint":"可以加上和谁一起去的（Who?），什么时候去的（When?）。","takeaway":"通过添加人物、时间、地点等细节，可以把一个简单的句子变得更丰满，如：`Last Saturday, I went to the park with my father.`"},{"question":"“I went fishing.” 也很棒。钓鱼时发生了什么特别的事吗？你的心情有什么变化？","hint":"比如，你钓到鱼了吗？钓到鱼的时候感觉怎么样？","takeaway":"在描述活动时，加入具体事件和相应的情感变化，能让你的文章更生动，更能吸引读者。"}]}]}}]}],"content_markdown":"## 成都某外国语学校初2026级新初一入学真卷英语\n**(满分:50分 时间:60分钟)**\n\n### I. 语音辨识。(共5分)\n**判断下列单词画线部分发音是(T)否(F)相同。**\n\n1. A. apple B. cake\n2. A. girl B. nurse\n3. A. home B. dog\n4. A. food B. look\n5. A. she B. be\n\n### II. 单项选择。(共10分)\n\n6. What did you do _____?\n   A. last weekend\n   B. next weekend\n   C. now\n\n7. The teachers' office is on the _____ floor.\n   A. one\n   B. two\n   C. second\n\n8. I'm hungry. I'd like some _____.\n   A. juice\n   B. bread\n   C. rices\n\n9. —Did she see a film?\n   —_____\n   A. Yes, I did\n   B. Yes, she did\n   C. No, she did\n\n10. I watched some children's shows _____ TV.\n    A. in\n    B. on\n    C. at\n\n11. He is taller than both _____ us.\n    A. of\n    B. and\n    C. with\n\n12. Mike is _____ than you.\n    A. short\n    B. shorter\n    C. old\n\n13. —_____ are you?\n    —I am 52 kilograms.\n    A. How tall\n    B. How old\n    C. How heavy\n\n14. Your feet are bigger than _____.\n    A. me\n    B. my\n    C. mine\n\n15. —Are these tomatoes?\n    —Yes, _____.\n    A. these are\n    B. they aren't\n    C. they are\n\n### III. 完形填空。(共10分)\nHow often do you help others? Here is a story of Luke Cameron. As an American, he was born __16__ 1988. He had a good friend called Jack. It was __17__ that Jack died from cancer(癌症) one year ago. After that, Luke began to do at least a good thing for __18__ every day.\nHe helped the __19__ man cross the streets, bought gifts for some kids on their birthdays and __20__ the food to the poor people. He __21__ bought meals for several people at McDonald's, and even paid for a stranger's petrol(汽油). He said he __22__ about $4,700 on good things last year.\nIn these days, we usually think about ourselves and forget to think about others. In fact, we are too selfish(自私的). We should help others and it can make our world __23__ more beautiful and warmer.\n“__24__ is better for me than to help others,” Luke said to the reporters __25__.\n\n16. \n    A. at\n    B. in\n    C. on\n\n17. \n    A. unpleasant\n    B. unhealthy\n    C. unlucky\n\n18. \n    A. person\n    B. people\n    C. peoples\n\n19. \n    A. young\n    B. strong\n    C. old\n\n20. \n    A. gave out\n    B. gave in\n    C. gave up\n\n21. \n    A. either\n    B. too\n    C. also\n\n22. \n    A. paid\n    B. cost\n    C. spent\n\n23. \n    A. many\n    B. much\n    C. little\n\n24. \n    A. Nothing\n    B. Something\n    C. Everything\n\n25. \n    A. successfully\n    B. happily\n    C. quickly\n\n### IV. 阅读判断。正确的写“T”,错误的写“F”。(共5分)\nAfter school, Linda and Mary went home together. They washed the clothes and cleaned the room. Then they did their homework. It was very late. They were very tired, but they were happy. Because they could help their mother. Their mother was ill, but she was happy, too.\n\n26. After school, Linda and Mary played games together.\n27. Linda's father was ill.\n28. They didn't do their homework.\n29. They cleaned the room.\n30. Their mother was not happy.\n\n### V. 多任务混合阅读。(共10分)\nDragon Boat Festival, also called(被称作) Duanwu Festival, is usually in June. On May 5th of the Chinese lunar calendar(中国农历) we make zongzi and share zongzi with parents, grandparents and friends. We also go out and watch dragon boat races(比赛). We see films about the great poet—Qu Yuan.\nMid-Autumn Festival is also a traditional(传统的) Chinese festival. It's on August 15th of the Chinese lunar calendar. People will get together and have a big meal. People will have a lot of food and rice in the evening. Mothers are going to make mooncakes. Grandparents will tell the story about Chang'e. Children will watch cartoons about the moon and read a poem about “FAMILY”. People will be happy all day.\n\n**判断下面句子的对错。对的在括号中画“√”,错的画“X”。**\n\n31. Duanwu Festival is on May 5th of the Chinese lunar calendar.\n32. “Big meal” means(意思是) “breakfast”.\n33. People will have a good day on Mid-Autumn Festival.\n\n**根据短文内容,回答下面问题。**\n\n34. When is Mid-Autumn Festival?\n35. What will people eat on Dragon Boat Festival?\n\n### VI. 话题作文。(共10分)\n\n36. 请根据下面的参考词汇,描述一下你上周末的活动。\n   要求:条理清楚,语句通顺,书写规范,无语法错误,不少于5句话。\n   参考词汇:had a good weekend, went to a park, went there by bike, went fishing, felt very happy...\n","proofread_notes":"The original paper contains watermarks and QR codes (e.g., for video explanations), which have been omitted as they are not part of the exam content. In the phonetics section (Questions 1-5), the specific letters to be compared for pronunciation were originally underlined; this formatting was not captured by OCR and is absent from the question stems.","set_number":4,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_04\\page_012.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"step   /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {

      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
    });
  }

  function typeLabel(t) { return TYPE_LABELS[t] || t || "其他"; }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    return false;
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const t = String(fullText || "");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (!mp) return t.trim();
      bodyStart = mp.index + mp[0].length;
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "reading") {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (readingPassageGroupKey(String(r2.it.context_note || "").trim()) !== key) break;
          j++;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  /** 大题说明里 (53) Y_____ 式文中空，小题无 stem、无 A–D（首字母填空对话等） */
  function isClozeInlineFillSectionGroup(g) {
    if (!g || !g.rows || !g.rows.length) return false;
    const ins = String(g.instruction || "").trim();
    if (!ins || !/\(\d+\)[^_\n\r]*_{3,}/.test(ins)) return false;
    return g.rows.every((r) => {
      const it = r.it;
      if (String(it.stem || "").trim()) return false;
      return getObjectiveChoiceLayout(r, it).letters.length === 0;
    });
  }

  function htmlClozeInstructionWithInlineBlanks(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;
    let out = "";
    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      out += esc(s.slice(li, m.index)).replace(/\n/g, "<br>");
      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      if (rk) {
        out +=
          "<span class='blank-line cloze-inline-blank'><input type='text' class='blank-input' data-k='" +
          esc(rk.key) +
          "' data-bi='0' autocomplete='off' /></span>";
      } else {
        out += esc(m[0]).replace(/\n/g, "<br>");
      }
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text cloze-inline-passage'>" + out + "</div>";
  }

  function buildClozeInlinePassagePdfHtml(ins, rows) {
    const rowByNum = Object.create(null);
    rows.forEach((r) => {
      const n = String(r.it.number || "").trim();
      if (n) rowByNum[n] = r;
    });
    const s = String(ins || "");
    const re = /\(\d+\)[^_\n\r]*_{3,}/g;

    let li = 0;
    let m;
    while ((m = re.exec(s)) !== null) {

      li = m.index + m[0].length;
      const nm = /^\((\d+)\)/.exec(m[0]);
      const rk = nm ? rowByNum[nm[1]] : null;
      out += rk
        ? "<span class='exam-blank'>&nbsp;</span>"
        : esc(m[0]).replace(/\n/g, "<br>");
    }
    out += esc(s.slice(li)).replace(/\n/g, "<br>");
    return "<div class='cloze-passage-text'>" + out + "</div>";

  function groupDetailsByClozeSection(details) {
    const groups = [];

    while (i < details.length) {

      }
      groups.push({ passage: details[i].row.section_instruction || "", details: details.slice(i, j) });
      i = j;

  function clozeAnswerWordFromItem(it) {
    const teach = it.teaching || {};
    const opts = it.options && typeof it.options === "object" ? it.options : {};
    const caRaw = String(teach.correct_answer || "").trim();
    if (!caRaw) return "（未录入）";
    const caUp = caRaw.toUpperCase().charAt(0);
    if ("ABCD".indexOf(caUp) >= 0) {
      const tx = String(opts[caUp] || "").trim();
      if (tx) return tx;
    }
    return caRaw;
  }

  function clozeNumToAnswerMap(detailsPairs) {
    const map = Object.create(null);
    detailsPairs.forEach(({ row }) => {
      const it = row.it;
      const n = String(it.number || "").trim();
      if (!n) return;
      const w = clozeAnswerWordFromItem(it);
      map[n] = w;
      const pi = parseInt(n, 10);
      if (!isNaN(pi)) map[String(pi)] = w;
    });
    return map;
  }

  function nextClozePlaceholderAtStart(fragment) {
    const tries = [
      /^__\((\d+)\)__/.exec(fragment),
      /^__(\d+)__/.exec(fragment),
      /^\((\d+)\)_{3,}/.exec(fragment),
      /^\((\d+)\)[^_\n\r]*_{3,}/.exec(fragment),
      /^(\d+)\s+_{3,}/.exec(fragment),
    ];
    let best = null;
    tries.forEach((m) => {
      if (!m) return;
      const cand = { len: m[0].length, num: m[1] };
      if (!best || cand.len > best.len) best = cand;
    });
    return best;
  }

  function buildClozeFilledPassageHtml(passage, detailsPairs) {
    const map = clozeNumToAnswerMap(detailsPairs);
    function wordFor(num) {
      if (map[num] != null) return map[num];
      const p = parseInt(num, 10);
      if (!isNaN(p) && map[String(p)] != null) return map[String(p)];
      return "（？）";
    }
    let html = "";
    let pos = 0;
    let foundPh = false;
    while (pos < passage.length) {
      const rest = passage.slice(pos);
      const ph = nextClozePlaceholderAtStart(rest);
      if (!ph) {
        const ch = passage[pos];
        if (ch === "\n") html += "<br>";
        else html += esc(ch);
        pos++;
        continue;
      }
      foundPh = true;
      const w = wordFor(ph.num);
      html += "<span class='cloze-filled-ans' data-blank='" + esc(ph.num) + "'>" + esc(w) + "</span>";
      pos += ph.len;
    }
    if (!foundPh && /_{3,}/.test(passage) && detailsPairs.length) {
      const chunks = passage.split(/_{3,}/);
      if (chunks.length === detailsPairs.length + 1) {
        const sorted = detailsPairs.slice().sort((a, b) => {
          const na = parseInt(a.row.it.number, 10);
          const nb = parseInt(b.row.it.number, 10);
          return (isNaN(na) ? 0 : na) - (isNaN(nb) ? 0 : nb);
        });
        let h = esc(chunks[0]).replace(/\n/g, "<br>");
        for (let i = 0; i < sorted.length; i++) {
          const w = clozeAnswerWordFromItem(sorted[i].row.it);
          h += "<span class='cloze-filled-ans'>" + esc(w) + "</span>";
          h += esc(chunks[i + 1]).replace(/\n/g, "<br>");
        }
        return formatPassageHtmlParagraphs(h);
      }
    }
    return formatPassageHtmlParagraphs(html);
  }

  function renderStemHtml(stem, qkey, opt) {
    opt = opt || {};
    const seg = (chunk) =>
      opt.allowUnderline ? stemHtmlWithAllowedUnderline(chunk) : esc(chunk).replace(/\n/g, "<br>");
    if (!stem) return "<p class='stem'></p>";
    const parts = stem.split(/_{3,}/g);
    if (parts.length === 1) {
      return "<p class='stem'>" + seg(stem) + "</p>";
    }
    let h = "<p class='stem'>";
    parts.forEach((chunk, i) => {
      h += seg(chunk);
      if (i < parts.length - 1) {
        h += "<span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='" + i + "' autocomplete='off' /></span>";
      }
    });
    h += "</p>";
    return h;
  }

  /** 从 section_instruction 解析补全对话方框 A. … G. …（行首匹配） */
  function dialogueBankOptionsFromSection(row) {
    const ins = String(row.section_instruction || "");
    const out = {};
    const re = /^([A-G])\.\s*(.+)$/gm;
    let m;
    while ((m = re.exec(ins)) !== null) {
      out[m[1].toUpperCase()] = m[2].trim();
    }
    return out;
  }

  function isClozeDialoguePlaceholderStem(stem) {
    return /^\s*\d+\.?\s*$/.test(String(stem || ""));
  }

  /** 补全对话大题：练习/PDF/讲解中整段不展示 */
  function isClozeDialogueCompletionSection(row) {
    return /补全对话/.test(String((row && row.section_title) || ""));
  }

  function visibleClozeQuizRows(rows) {
    return (rows || []).filter((r) => !isClozeDialogueCompletionSection(r));
  }

  /** 左侧已有文章的完形小题：仅展示对齐的 A–D，不重复题干与选项词 */
  function isPassageClozeAbcdLayout(row, it) {
    if (!row || row.type !== "cloze") return false;
    if (isClozeDialogueCompletionSection(row)) return false;
    if (isClozeDialoguePlaceholderStem(it && it.stem)) return false;
    const raw = it && it.options && typeof it.options === "object" ? it.options : {};
    const n = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim()).length;
    return n >= 2;
  }

  /** 大题标题/说明是否像「阅读判断」正误题 */
  function sectionLooksTrueFalse(row) {
    if (/判断/.test(String(row.section_title || ""))) return true;
    const ins = String(row.section_instruction || "");
    if (/判断[^\n]{0,48}正\s*\(?T\)?|正\s*\(?T\)?[^\n]{0,24}误\s*\(?F\)?/i.test(ins)) return true;
    if (/True\s*\(\s*T\s*\)|False\s*\(\s*F\s*\)/i.test(ins)) return true;
    /* 语音辨识等：「是(T)否(F)相同」 */
    if (/是\s*\(?T\)?\s*否\s*\(?F\)?/i.test(ins)) return true;
    if (/判断/.test(ins) && /(画线|划线)部分/.test(ins) && /是否相同/.test(ins)) return true;
    return false;
  }

  /**
   * 客观题选项：A–D、补全对话从 section_instruction 解析的 A–G 方框、T/F、阅读判断隐式 T/F
   */
  function getObjectiveChoiceLayout(row, it) {
    const raw = it && typeof it.options === "object" && it.options ? it.options : {};
    const typ = row.type;
    const abcd = ["A", "B", "C", "D"].filter((L) => String(raw[L] || "").trim());
    if (abcd.length) return { letters: abcd, opts: raw };
    if (typ === "cloze") {
      const bank = dialogueBankOptionsFromSection(row);
      const bankLetters = Object.keys(bank).sort();
      if (bankLetters.length >= 2) return { letters: bankLetters, opts: bank };
    }
    const tfKeys = ["T", "F"].filter((L) => String(raw[L] || "").trim());
    if (tfKeys.length >= 2) return { letters: ["T", "F"], opts: raw };
    if (tfKeys.length === 1) return { letters: tfKeys, opts: raw };
    const stem = String(it.stem || "").trim();
    if (
      stem &&
      sectionLooksTrueFalse(row) &&
      (typ === "reading" || typ === "choice" || typ === "other" || typ === "phonetics")
    ) {
      const insTf = String(row.section_instruction || "");
      const phoneticOther =
        typ === "phonetics" ||
        (typ === "other" && (/发音/i.test(insTf) || /画线部分/i.test(insTf) || /划线部分/i.test(insTf)));
      return {
        letters: ["T", "F"],
        opts: phoneticOther
          ? { T: "（相同）", F: "（不相同）" }
          : { T: "（正确）", F: "（错误）" },
      };
    }
    return { letters: [], opts: raw };
  }

  function htmlQuizRadioOptions(letters, opts, qkey) {
    let h = "";
    letters.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  /** 完形练习页：A→B→C 纵向，仅输出有内容的项 */
  function htmlQuizRadioOptionsAbcdGrid(letters, opts, qkey) {
    const order = ["A", "B", "C", "D"];
    let h = "";
    order.forEach((L) => {
      const tx = String(opts[L] || "").trim();
      if (!letters.includes(L) || !tx) return;
      const id = "r-" + qkey.replace(/:/g, "-") + "-" + L;
      h += "<label class='cloze-opt-abcd cloze-opt-abcd-full'><input type='radio' name='k-" + esc(qkey) + "' value='" + esc(L) + "' id='" + id + "' />";
      h += "<span><strong>" + esc(L) + "</strong> " + esc(tx).replace(/\n/g, "<br>") + "</span></label>";
    });
    return h;
  }

  function quizOptsGridClass(letters, opts) {
    let c = 0;
    letters.forEach((L) => {
      if (String(opts[L] || "").trim()) c++;
    });
    if (c <= 1) return "opts";
    if (c > 4) return "opts opts-bank";
    return "opts opts-cols-" + c;
  }

  function renderTransformStemHtml(stem, qkey) {
    if (!stem) {
      return "<p class='stem'><span class='blank-line'><input type='text' data-k='" + esc(qkey) + "' data-bi='0' autocomplete='off' /></span></p>";
    }
    if (/_{3,}/.test(stem)) return renderStemHtml(stem, qkey);
    return (
      "<p class='stem'>" +
      esc(stem).replace(/\n/g, "<br>") +
      " <span class='blank-line'><input type='text' data-k='" +
      esc(qkey) +
      "' data-bi='0' autocomplete='off' placeholder='作答' /></span></p>"
    );
  }

  function parseTransformAnswerParts(ca) {
    return String(ca || "").split("|").map((s) => s.trim());
  }

  /** 讲解页：句型转换题干，用正确答案填入空格并高亮（与完形「填入答案」样式一致） */
  function buildTransformFilledStemHtml(stem, ca) {
    const parts = parseTransformAnswerParts(ca);
    const stemStr = String(stem || "");
    const blankPh = "—";
    const spanAns = (w) =>
      "<span class='cloze-filled-ans'>" + esc(w && String(w).trim() ? w : blankPh) + "</span>";

    if (!stemStr.trim()) {
      const w = String(ca || "").trim() || parts.filter(Boolean).join(" | ") || blankPh;
      return "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" + spanAns(w) + "</div>";
    }

    if (/_{3,}/.test(stemStr)) {
      const chunks = stemStr.split(/_{3,}/);
      let h = "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>";
      const n = chunks.length - 1;
      for (let i = 0; i < chunks.length; i++) {
        h += esc(chunks[i]).replace(/\n/g, "<br>");
        if (i < n) {
          const w = i < parts.length ? parts[i] : "";
          h += spanAns(w);
        }
      }
      h += "</div>";
      return h;
    }

    const tail =
      String(ca || "").trim() ||
      (parts.length ? parts.filter(Boolean).join(" | ") : "") ||
      blankPh;
    return (
      "<div class='stem tf-filled-stem' style='margin-bottom:0.75rem'>" +
      esc(stemStr).replace(/\n/g, "<br>") +
      " " +
      spanAns(tail) +
      "</div>"
    );
  }

  function renderOpenAnswerStem(stem, qkey, rowType, quizType) {
    const isTf = rowType === "sentence_transform" || quizType === "sentence_transform";
    if (isTf) return renderTransformStemHtml(stem, qkey);
    return renderStemHtml(stem, qkey) + "<textarea class='area' data-k='" + esc(qkey) + "' rows='6' placeholder='在此作答（多空用 | 分隔）'></textarea>";
  }

  /** 按真题卷面顺序：自上而下扫 sections→items，题型首次出现顺序（与 buildFlat 的 state.flat 一致） */
  function typesInPaperAppearanceOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const t = row.type;
      if (seen[t]) return;
      if (!(state.byType[t] || []).length) return;
      seen[t] = true;
      out.push(t);
    });
    return out;
  }

  function orderedTypesList() {
    const paper =
      EXAM.exam_meta &&
      String(EXAM.exam_meta.type_card_order || "").toLowerCase() === "paper";
    if (paper) {
      return typesInPaperAppearanceOrder();
    }
    return Object.keys(state.byType)
      .filter((x) => (state.byType[x] || []).length > 0)
      .sort((a, b) => {
        const ia = TYPE_ORDER.indexOf(a);
        const ib = TYPE_ORDER.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
  }

  /** 生成某题型答题区 HTML（供页面与 PDF 共用） */
  function buildQuizBodyHtml(t) {
    const rows = state.byType[t] || [];
    const readingGroups = t === "reading" ? groupReadingByPassage(rows) : [];
    const writingGroups = t === "writing" ? groupWritingByPassage(rows) : [];
    let html = "";
    if (t === "cloze" && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((g) => {
        if (isClozeDialogueCompletionSection(g.rows[0])) return;
        if (isClozeInlineFillSectionGroup(g)) {
          const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
          html +=
            "<div class='pdf-cloze-unit cloze-inline-fill-unit'><div class='cloze-passage-card card'>" +
            "<h2>" +
            esc(gTitle) +
            "</h2>" +
            htmlClozeInstructionWithInlineBlanks(g.instruction, g.rows) +
            "</div></div>";
          return;
        }
        const ins = g.instruction.trim();
        const gTitle = String(g.rows[0].section_title || "").trim() || "阅读材料";
        const sp = splitSectionHintAndBody(ins);
        const hintTop = sp.hint
          ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
          : "";
        const mainIns = sp.body || ins;
        const passageHtml = ins
          ? "<div class='cloze-passage-card card'><h2>" +
            esc(gTitle) +
            "</h2>" +
            hintTop +
            "<div class='cloze-passage-text'>" +
            formatPassageParagraphs(mainIns) +
            "</div></div>"
          : "<div class='cloze-passage-card card'><p class='muted'>（本篇暂无导语，请仅根据右侧选项作答。）</p></div>";
        let rightCol =
          "<div class='cloze-options-col'><h2 class='card' style='margin:0 0 0.75rem;padding:0.65rem 0.85rem;font-size:1rem;'>答题区</h2>";
        g.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          const diaGap = isClozeDialoguePlaceholderStem(it.stem);
          rightCol +=
            "<div class='card q-block cloze-opt-card" +
            (diaGap ? " cloze-dialogue-gap-card" : "") +
            "' data-qkey='" +
            esc(qkey) +
            "'><div class='q'>";
          if (diaGap) {
            rightCol += "<div class='cloze-dialogue-gap-badge'>" + esc(num) + ".</div>";
          } else {
            rightCol += "<div class='q-head'><span class='q-num'>第 " + esc(num) + " 空</span><span class='tag'>cloze</span></div>";
          }
          const layoutC = getObjectiveChoiceLayout(row, it);
          const lettersC = layoutC.letters;
          const optsC = layoutC.opts;
          const abcdOnly = isPassageClozeAbcdLayout(row, it);
          if (lettersC.length) {
            if (!diaGap && !abcdOnly) {
              rightCol += renderStemHtml(it.stem, qkey);
            }
            if (abcdOnly) {
              rightCol += "<div class='opts opts-cloze-abcd'>";
              rightCol += htmlQuizRadioOptionsAbcdGrid(lettersC, optsC, qkey);
            } else {
              rightCol += "<div class='" + quizOptsGridClass(lettersC, optsC) + "'>";
              rightCol += htmlQuizRadioOptions(lettersC, optsC, qkey);
            }
            rightCol += "</div>";
          } else {
            rightCol += renderStemHtml(it.stem, qkey);
          }
          rightCol += "</div></div>";
        });
        rightCol += "</div>";
        html +=
          "<div class='pdf-cloze-unit'><div class='cloze-quiz-layout'><div class='cloze-passage-col'>" +
          passageHtml +
          "</div>" +
          rightCol +
          "</div></div>";
      });
    } else if (t === "reading" && readingGroups.some((g) => g.passage)) {
      readingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtml;
          if (g.fromSection) {
            const sp = splitSectionHintAndBody(g.passage);
            const hintHtml = sp.hint
              ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
              : "";
            const mainText = sp.body || g.passage;
            passageHtml =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              hintHtml +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(mainText) + "</div></div>";
          } else {
            const ph = splitReadingPassageHeading(g.passage);
            passageHtml =
              "<div class='reading-passage-card card'><h2>" + esc(ph.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(ph.text) + "</div></div>";
          }
          let rightCol = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            rightCol += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            rightCol += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            rightCol += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR = getObjectiveChoiceLayout(row, it);
            const lettersR = layoutR.letters;
            const optsR = layoutR.opts;
            if (lettersR.length) {
              rightCol += renderStemHtml(it.stem, qkey);
              rightCol += "<div class='" + quizOptsGridClass(lettersR, optsR) + "'>";
              rightCol += htmlQuizRadioOptions(lettersR, optsR, qkey);
              rightCol += "</div>";
            } else {
              rightCol += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            rightCol += "</div></div>";
          });
          rightCol += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtml +
            "</div>" +
            rightCol +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const it = row.it;
            const qkey = row.key;
            const num = String(it.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkey) + "'><div class='q'>";
            html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
            html += "<span class='tag'>" + esc(t) + "</span></div>";
            const layoutR2 = getObjectiveChoiceLayout(row, it);
            const lettersR2 = layoutR2.letters;
            const optsR2 = layoutR2.opts;
            if (lettersR2.length) {
              html += renderStemHtml(it.stem, qkey);
              html += "<div class='" + quizOptsGridClass(lettersR2, optsR2) + "'>";
              html += htmlQuizRadioOptions(lettersR2, optsR2, qkey);
              html += "</div>";
            } else {
              html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
            }
            html += "</div></div>";
          });
        }
      });
    } else if (t === "writing" && writingGroups.some((g) => g.passage)) {
      writingGroups.forEach((g) => {
        if (g.passage) {
          let passageHtmlW;
          if (g.fromSection) {
            const spw = splitSectionHintAndBody(g.passage);
            const hintHtmlW = spw.hint
              ? "<p class='muted' style='margin:0 0 0.75rem;line-height:1.55'>" + esc(spw.hint).replace(/\n/g, "<br>") + "</p>"
              : "";
            const mainTextW = spw.body || g.passage;
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>阅读材料</h2>" +
              hintHtmlW +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(mainTextW) + "</div></div>";
          } else {
            const phw = splitReadingPassageHeading(g.passage);
            passageHtmlW =
              "<div class='reading-passage-card card'><h2>" + esc(phw.title) + "</h2>" +
              "<div class='reading-passage-text'>" + formatPassageParagraphs(phw.text) + "</div></div>";
          }
          let rightColW = "<div class='reading-questions-col'>";
          g.rows.forEach((row) => {
            const itw = row.it;
            const qkeyW = row.key;
            const numW = String(itw.number);
            rightColW += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyW) + "'><div class='q'>";
            rightColW +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numW) +
              " 题</span>";
            rightColW += "<span class='tag'>" + esc(t) + "</span></div>";
            rightColW += renderOpenAnswerStem(itw.stem, qkeyW, row.type, t);
            rightColW += "</div></div>";
          });
          rightColW += "</div>";
          html +=
            "<div class='pdf-reading-unit'><div class='reading-quiz-layout'><div class='reading-passage-col'>" +
            passageHtmlW +
            "</div>" +
            rightColW +
            "</div></div>";
        } else {
          g.rows.forEach((row) => {
            const itx = row.it;
            const qkeyX = row.key;
            const numX = String(itx.number);
            html += "<div class='card q-block reading-q-card' data-qkey='" + esc(qkeyX) + "'><div class='q'>";
            html +=
              "<div class='q-head'><span class='q-num'>" +
              esc(row.section_title) +
              " · 第 " +
              esc(numX) +
              " 题</span>";
            html += "<span class='tag'>" + esc(t) + "</span></div>";
            html += renderOpenAnswerStem(itx.stem, qkeyX, row.type, t);
            html += "</div></div>";
          });
        }
      });
    } else if (isFillBlankQuizType(t) && rows.length) {
      groupFillBlankBySectionInstruction(rows).forEach((fg) => {
        if (fg.instruction) {
          const sp = splitSectionHintAndBody(fg.instruction);
          const hintPart = sp.hint
            ? "<p class='muted' style='margin:0 0 0.65rem;line-height:1.55'>" + esc(sp.hint).replace(/\n/g, "<br>") + "</p>"
            : "";
          const bankSrc = sp.body || fg.instruction;
          html +=
            "<div class='card word-bank-card' style='margin-bottom:1rem'>" +
            "<h2 style='margin:0 0 0.5rem;font-size:1rem;color:var(--accent)'>题目说明与词汇方框</h2>" +
            hintPart +
            "<div class='word-bank-box' style='font-family:Literata,Georgia,serif;font-size:1.06rem;line-height:1.65;padding:0.75rem 0.9rem;background:#f7faf7;border-radius:10px;border:1px dashed var(--border)'>" +
            esc(bankSrc).replace(/\n/g, "<br>") +
            "</div></div>";
        }
        fg.rows.forEach((row) => {
          const it = row.it;
          const qkey = row.key;
          const num = String(it.number);
          html += "<div class='card q-block' data-qkey='" + esc(qkey) + "'><div class='q'>";
          html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
          html += "<span class='tag'>" + esc(t) + "</span></div>";
          html += renderStemHtml(it.stem, qkey);
          html += "</div></div>";
        });
      });
    } else {
      if (t === "phonetics" && rows.length) {
        const insPh = String(rows[0].section_instruction || "").trim();
        if (insPh) {
          html +=
            "<div class='card' style='margin-bottom:1rem;padding:0.75rem 1rem'><p class='muted' style='margin:0;line-height:1.55'>" +
            esc(insPh).replace(/\n/g, "<br>") +
            "</p></div>";
        }
      }
      const stemOptPh = t === "phonetics" ? { allowUnderline: true } : null;
      rows.forEach((row) => {
        const it = row.it;
        const qkey = row.key;
        const num = String(it.number);
        html +=
          "<div class='card q-block" +
          (t === "reading" ? " reading-q-card" : "") +
          "' data-qkey='" +
          esc(qkey) +
          "'><div class='q'>";
        html += "<div class='q-head'><span class='q-num'>" + esc(row.section_title) + " · 第 " + esc(num) + " 题</span>";
        html += "<span class='tag'>" + esc(t) + "</span></div>";

        if (t === "reading" && (it.context_note || "").trim()) {
          html += "<div class='passage'>" + formatPassageParagraphs(it.context_note) + "</div>";
        }

        const layoutG = getObjectiveChoiceLayout(row, it);
        const lettersG = layoutG.letters;
        const optsG = layoutG.opts;
        if (lettersG.length) {
          html += renderStemHtml(it.stem, qkey, stemOptPh || undefined);
          html += "<div class='" + quizOptsGridClass(lettersG, optsG) + "'>";
          html += htmlQuizRadioOptions(lettersG, optsG, qkey);
          html += "</div>";
        } else {
          html += renderOpenAnswerStem(it.stem, qkey, row.type, t);
        }
        html += "</div></div>";
      });
    }
    return html;
  }

  /** 阅读材料中允许 &lt;u&gt;…&lt;/u&gt; 显示为下划线，其余 HTML 剥离 */
  function examSanitizePassageRich(p) {
    let t = String(p || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t.replace(/@@UON@@/g, "<u>").replace(/@@UOFF@@/g, "</u>");
  }

  function formatPassageParagraphsExam(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    return s
      .split(/\n+/)
      .map((x) => x.trim())
      .filter(Boolean)
      .map((para) => "<p class='exam-para'>" + examSanitizePassageRich(para).replace(/\n/g, "<br>") + "</p>")
      .join("");
  }

  function buildExamPaperStemPlain(stem, allowUnderline) {
    const s = String(stem || "");
    if (allowUnderline) {
      return stemHtmlWithAllowedUnderline(s).replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
    }
    return esc(s)
      .replace(/\n/g, "<br>")
      .replace(/_{3,}/g, "<span class='exam-blank'>&nbsp;</span>");
  }

  function buildExamPaperOptionsHtmlWithLayout(letters, opts) {
    const parts = [];
    letters.forEach((L) => {
      const tx = String((opts && opts[L]) || "").trim();
      if (!tx) return;
      parts.push("<span class='exam-opt-chip'><b>" + esc(L) + ".</b> " + esc(tx).replace(/\n/g, " ") + "</span>");
    });
    if (!parts.length) return "";
    const n = parts.length;
    const cls = n <= 4 ? "exam-opts-cols-" + n : "exam-opts-bank";
    return "<div class='exam-opts-row " + cls + "'>" + parts.join("") + "</div>";
  }

  /** 完形 PDF：多行表格，每行「题号 | A | B | C | (D)」，列对齐 */
  function buildExamPaperClozePdfGrid(rows) {
    if (!rows || !rows.length) return "";
    const hasD = rows.some((row) => {
      const o = getObjectiveChoiceLayout(row, row.it).opts;
      return String((o && o.D) || "").trim();
    });
    const order = hasD ? ["A", "B", "C", "D"] : ["A", "B", "C"];
    let h =
      "<div class='exam-cloze-pdf-grid" + (hasD ? " exam-cloze-pdf-grid-4opt" : "") + "'>";
    rows.forEach((row) => {
      const it = row.it;

  function collectTypeAnswers() {
    const t = state.currentType;
    const rows = state.byType[t] || [];
    const out = {};
    rows.forEach((row) => {
      const k = row.key;
      const kEsc = k.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      let block = document.querySelector(".q-block[data-qkey=\"" + kEsc + "\"]");
      if (!block) {
        const inlineInp = document.querySelector(
          "#quizBody .cloze-inline-passage input[data-k=\"" + kEsc + "\"]",
        );
        if (inlineInp) {
          out[k] = String(inlineInp.value || "").trim();
          return;
        }
        return;
      }
      const r = block.querySelector("input[type=radio]:checked");
      if (r) {
        out[k] = r.value;
        return;
      }
      const blankOne = block.querySelector("input.blank-input[data-k]");
      if (blankOne) {
        out[k] = blankOne.value.trim();
        return;
      }
      const blanks = block.querySelectorAll("input[data-k][data-bi]");
      if (blanks.length) {
        const bits = [];
        blanks.forEach((b) => bits.push(b.value.trim()));
        out[k] = bits.join("|");
        return;
      }
      const ta = block.querySelector("textarea[data-k]");
      if (ta) out[k] = ta.value.trim();
    });
    return out;
  }

  function normLetter(x) {
    return String(x || "").trim().toUpperCase().charAt(0);
  }
  function normPipe(x) {
    return String(x || "")
      .split("|")
      .map((s) => s.trim().toLowerCase())
      .join("|");
  }

  function judge(row, userAns) {
    const it = row.it;
    const teach = it.teaching || {};
    const ca = teach.correct_answer || "";
    const typ = row.type;
    if (typ === "writing") return { open: true, ok: null, ca, userAns };
    if (["choice", "cloze", "reading", "other", "phonetics"].includes(typ)) {
      const ok = ca && normLetter(userAns) === normLetter(ca);
      return { open: false, ok, ca, userAns };
    }
    const ok = ca && normPipe(userAns) === normPipe(ca);
    return { open: false, ok, ca, userAns };
  }

  function wrapEnglishWords(container) {
    if (!container || container.nodeType !== 1) return;
    const skip = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "PRE"]);
    function walk(node) {
      if (node.nodeType === 1) {
        if (skip.has(node.tagName)) return;
        if (node.classList && node.classList.contains("wlink")) return;
        Array.from(node.childNodes).forEach(walk);
        return;
      }
      if (node.nodeType !== 3) return;
      const text = node.textContent;
      if (!text || !/\b[A-Za-z]/.test(text)) return;
      const parent = node.parentNode;
      if (!parent) return;
      const frag = document.createDocumentFragment();
      const re = /(\b[A-Za-z]+(?:[-'][A-Za-z]+)*\b)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const sp = document.createElement("span");
        sp.className = "wlink";
        sp.textContent = m[1];
        sp.title = "点击查看词义";
        frag.appendChild(sp);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      parent.replaceChild(frag, node);
    }
    try {
      walk(container);
    } catch (err) {
      console.warn("wrapEnglishWords:", err);
    }
  }
