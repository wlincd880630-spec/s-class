<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第01套完形填空 · 漫画版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,480;0,8..60,600;1,8..60,480&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="set_01_comic/comic-reader.css" />
</head>
<body>
  <div class="topbar no-print">
    <div class="brand">
      <span class="kicker">S-Class · PSLE Set 01</span>
      <strong>完形填空 漫画版</strong>
    </div>
    <div class="top-actions">
      <a class="btn" href="set_01_typeflow.html">← 题型页</a>
      <a class="btn teal" href="set_01_cloze_copy.html">词汇描红抄写</a>
      <a class="btn" href="set_01_reading_comic.html">阅读漫画</a>
      <button type="button" class="btn" id="btnToggleZh">全部显示中文</button>
      <button type="button" class="btn gold" id="btnPdf" title="在打印对话框中选择「另存为 PDF」。仅含本篇完形课文。">导出 PDF 笔记册</button>
    </div>
  </div>

  <div class="wrap">
    <section class="print-cover" id="printCover" aria-hidden="true"></section>

    <header class="hero screen-only">
      <h1>Shop with One Boy Each Time</h1>
      <p>完形填空课文按正确答案填好后，完整呈现于页首「完整课文」，再按句拆成分镜。第 9 空为 <strong>tired</strong>：到家已经七点，妈妈真的累了。每句可点词、朗读，也可点「金字塔」逐词叠加跟读。导出 PDF 只含英文图文和空白笔记线。</p>
      <div class="hint-row">
        <span class="chip">完整课文</span>
        <span class="chip">一句一格</span>
        <span class="chip">金字塔朗读</span>
        <span class="chip">本篇 PDF</span>
      </div>
    </header>

    <div id="comicRoot"></div>
  </div>

  <div id="selBar" class="no-print" role="toolbar" aria-label="选中词组">
    <button type="button" id="selLookup">查词组</button>
    <button type="button" id="selSpeak">朗读</button>
  </div>

  <div id="modal" aria-hidden="true">
    <div class="box">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0.5rem">
        <h3 id="modalWord">词汇</h3>
        <button type="button" class="btn primary" id="modalTts">朗读</button>
      </div>
      <p id="modalBody"></p>
      <button type="button" class="btn" id="modalClose">关闭</button>
    </div>
  </div>

  <script>window.PSLE_COMIC_PASS = "c";</script>
  <script src="set_01_comic/comic-data.js"></script>
  <script src="set_01_comic/comic-reader.js"></script>
</body>
</html>
