ed` 结尾的形容词（如 `interested`）通常描述人的感受，而 `-ing` 结尾的（如 `interesting`）描述事物或人的特质。"}]},{"title":"逻辑推理：排除干扰项","steps":[{"question":"让我们分析一下选项。一个女孩在看小鸟，这个行为本身会不会让她“忙碌”（busy）？","hint":"“忙碌”通常指有很多事情要做。看小鸟是一种休闲活动。","takeaway":"除非上下文有特殊说明，否则“看小鸟”这一休闲行为与“忙碌”的状态是相悖的。"},{"question":"那么，可以说 `She is interesting` 吗？这个选项为什么不合适？","hint":"这个问题问的是她看鸟时的状态，而 `She is interesting` 是对她整个人的评价。这两者是一回事吗？","takeaway":"必须区分描述一个人当下状态的词（如 happy）和评价一个人性格特质的词（如 interesting）。"}]}]}},{"number":"3","item_type":"reading","context_note":"Passage A","stem":"What are the teachers doing?","options":{"A":"Working or talking with students.","B":"Having a basketball game.","C":"Playing with the students.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题为细节查找题。根据文章中的句子 “Some of them are working in the office, and some are talking with students.”（他们中的一些在办公室工作，一些在和学生交谈。），可知老师们正在做这两件事。选项A “Working or talking with students.” 准确地概括了原文信息，因此是正确答案。选项B和C与原文描述不符。","knowledge_expansion_md":"### 现在进行时 (Present Continuous Tense)\n\n这个问题 `What are the teachers doing?` 使用了现在进行时。这个时态的构成是 **`am/is/are + 动词-ing`**。\n\n**主要用法**：\n1.  **表示此时此刻正在进行的动作**：\n    - `He is reading a book.` (他正在看书。)\n    - `They are playing football.` (他们正在踢足球。)\n2.  **表示现阶段正在发生但此刻不一定在做的事**：\n    - `I am learning French this year.` (我今年在学法语。)\n\n**相关活动短语**：\n- **教师活动**: `prepare lessons` (备课), `mark homework` (批改作业), `have a meeting` (开会), `talk with students/parents` (与学生/家长交谈)。\n- **学生活动**: `have a class` (上课), `do homework` (做作业), `play sports` (做运动), `listen to the teacher` (听老师讲课)。","socratic_tracks":[{"title":"阅读策略：定位与概括","steps":[{"question":"这个问题问“老师们在做什么？”。为了回答它，你应该在文章中寻找关于哪些人的信息？","hint":"问题的核心主语是 “the teachers”。","takeaway":"首先要根据问题中的主语（teachers）在文章中定位到描述相关人物活动的句子。"},{"question":"如果文章中描述了老师们在做好几件不同的事，比如有的在工作，有的在聊天，那么哪个选项最能概括所有这些活动？","hint":"比较一下“打篮球”和“工作或与学生交谈”，哪个选项的范围更广？","takeaway":"在阅读理解中，有时最佳答案是那个最具概括性、能涵盖文中多个信息点的选项。"}]},{"title":"语法应用：现在进行时","steps":[{"question":"为什么问题用的是 “What **are** the teachers **doing**?” 这种形式？它在问什么？","hint":"注意 `be` 动词 + 动词的 `-ing` 形式。这是什么时态？它通常用来描述什么时候的动作？","takeaway":"这是现在进行时，用来询问或描述此时此刻正在发生的动作。"},{"question":"如果我们要用现在进行时来描述选项A中的两个动作，应该怎么说？","hint":"把 `work` 和 `talk` 变成 `-ing` 形式，并加上 `be` 动词。","takeaway":"我们可以说 “The teachers are working” 或者 “The teachers are talking with students”。"}]},{"title":"词汇拓展：活动短语","steps":[{"question":"选项中出现了 `working`, `talking with students`, `having a basketball game`。这些都是描述活动的短语。你能用 `have`, `play`, `do` 再分别造一个关于活动的短语吗？","hint":"比如，`have a ...` (吃/喝/上课/拥有), `play the ...` (玩耍/弹奏), `do ...` (做)。","takeaway":"掌握 `have/play/do` + 名词构成的活动短语是英语基础。例如：`have a class`, `play the piano`, `do sports`。"},{"question":"`have a basketball game` 和 `play basketball` 意思差不多，但用法上有什么细微差别？","hint":"一个是 `have a game` (进行一场比赛)，一个是 `play basketball` (打篮球这个运动)。","takeaway":"`have a ... game` 强调的是“一场比赛”这个事件，而 `play + 球类` 泛指进行某项运动。"}]}]}},{"number":"4","item_type":"reading","context_note":"Passage A","stem":"There are _____ students in the classroom.","options":{"A":"no","B":"some","C":"few","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题为细节定位题，询问教室里有多少学生。根据文章中的句子 “Some students are in the classroom. They are talking. A few of them are reading or doing homework.”（一些学生在教室里。他们在聊天。他们中的少数在读书或做作业。），可以明确得知教室里有“一些”学生。因此，选项B `some` (一些) 是正确答案。选项A `no` (没有) 和原文信息直接矛盾。选项C `few` (很少，几乎没有) 带有否定意味，而原文用 `some` 和 `a few` 都是肯定含义，表示确实有一部分学生在教室里。","knowledge_expansion_md":"本题考查数量词的辨析与使用。\n- **no**: 意为“没有”，相当于 `not any` 或 `not a/an`。其后既可以跟可数名词（单数或复数），也可以跟不可数名词。例如：`There is no water in the bottle.` `He has no friends.`\n- **some**: 意为“一些”，通常用于肯定句中。其后可跟可数名词复数或不可数名词。例如：`There are some books on the desk.`\n- **few**: 意为“很少，几乎没有”，含有否定意味，修饰可数名词复数。它强调数量非常少，接近于无。例如：`He has few friends.` (他几乎没什么朋友。)\n\n**易错点**：`few` 和 `a few` 的区别。`few` 带有否定含义，表示“很少”；而 `a few` 带有肯定含义，表示“有几个，有一些”。本题语境是完全没有，因此只能用 `no`。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"题目问的是教室里有多少学生。你应该在文章中寻找哪个关键词来定位信息？","hint":"可以找 `classroom` 这个词。","takeaway":"通过定位关键词 `classroom`，可以快速找到相关句子 “Some students are in the classroom.”，从而获取答案信息。"},{"question":"找到句子 “Some students are in the classroom.” 后，哪个选项最符合这句话的意思？","hint":"想一想 `some` 这个词是什么意思？","takeaway":"`some` 意为“一些”，直接对应选项B。"}]},{"title":"数量词辨析","steps":[{"question":"选项 A(no), B(some), C(few) 都是数量词，它们在意思上有什么主要区别？","hint":"试着用这三个词造句描述你口袋里的钱：I have ___ money. 感受一下它们表达的不同含义。","takeaway":"`no` 表示“零”；`some` 表示“一些”（不确定数量）；`few` 表示“很少，几乎没有”（用于可数名词）。"},{"question":"文章中除了用 `some`，还用了哪个词组来描述教室里的学生？这个词组是什么意思？","hint":"文章接着说 `A few of them are reading...`","takeaway":"文章还用了 `a few`（一些，有几个），它和 `some` 一样，都表示肯定的、存在一定数量的。这进一步证明了教室里是有学生的。"}]},{"title":"逻辑推理","steps":[{"question":"文章描述了课间休息时学生们在不同的地方。他们都在哪些地方？","hint":"文中提到了操场和教室等地方。","takeaway":"文章提到，有的学生在操场（playground），有的学生在教室（classroom），这说明学生们分散在不同地点活动。"},{"question":"既然文章明确说了“一些学生在教室里”，那么选项 A `no` (没有) 为什么是错的？","hint":"`no` 和 `some` 的意思正好相反。","takeaway":"直接与原文信息 “Some students are in the classroom.” 相矛盾的选项一定是错误的。"}]}]}},{"number":"5","item_type":"reading","context_note":"Passage A","stem":"The passage is mainly about _____.","options":{"A":"students","B":"a basketball game","C":"rest time","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题为主旨大意题，询问文章主要讲了什么。文章第一句话就点明了主题：“We have twenty minutes' rest between classes.”（我们课间有二十分钟的休息时间。）接下来的内容都是围绕这个“休息时间”（rest time）展开，描述了学生和老师们在课间休息时的各种活动。因此，选项C `rest time` (休息时间) 是最能概括全文主旨的答案。选项A `students` (学生) 范围太广，选项B `a basketball game` (一场篮球赛) 只是文中的一个细节。","knowledge_expansion_md":"**如何解答主旨大意题？**\n1.  **寻找主题句**：很多文章的段落会在开头（开门见山）或结尾（总结归纳）设置主题句（Topic Sentence），直接点明主旨。要特别留意这些位置的句子。\n2.  **关注高频词**：反复出现的名词或概念通常是文章的关键词，与主旨密切相关。\n3.  **概括段落大意**：将每个段落的大意进行提炼，然后将它们串联起来，看共同指向什么中心思想。\n4.  **区分主旨与细节**：主旨是统领全文的核心思想，而细节是支撑主旨的具体例子、数据或描述。选项中过于具体或片面的内容通常是干扰项。例如，本文中“篮球赛”就是一个细节例子，不能代表全文。","socratic_tracks":[{"title":"寻找主题句","steps":[{"question":"一篇文章的主题句通常在开头或结尾。看看这篇文章的第一句话说了什么？","hint":"“We have twenty minutes' rest between classes.”","takeaway":"文章开头第一句就点明了场景和主题：课间休息时间。这通常是文章的中心思想。"},{"question":"这句话 “We have twenty minutes' rest between classes.” 如何帮助我们选择正确答案？","hint":"将这句话的核心词 `rest` 与三个选项 A(students), B(a basketball game), C(rest time) 进行对比。","takeaway":"文章开头的主题句直接提到了 `rest`，与选项C `rest time` 完全吻合，因此C是正确答案。"}]},{"title":"排除干扰项","steps":[{"question":"文章通篇都在讲学生，为什么选项 A (students) 不是最佳答案？","hint":"主旨题要求找到文章“主要关于”什么。学生是文章的主角，但文章重点是讲学生的某一个方面，还是泛泛而谈？","takeaway":"“学生”这个话题太宽泛，文章聚焦的是“学生的休息时间”，所以C选项更准确、更具体。"},{"question":"文章提到了打篮球，为什么选项 B (a basketball game) 也不对？","hint":"想一想，打篮球是所有学生都在做的事吗？它是文章描述的唯一活动吗？","takeaway":"“篮球赛”只是休息时间里的一个具体活动例子，是细节信息，不能概括文章的全部内容。"}]},{"title":"归纳与概括","steps":[{"question":"请用你自己的话总结一下，这篇文章描绘了一个什么样的场景？","hint":"想一想：在什么时间？什么地点？人物是谁？他们在做什么？","takeaway":"文章描绘了学生们在课后休息时间里，在操场和教室等不同地点放松活动的场景。"},{"question":"这个场景的核心是什么？是“学生”这个人，是“打球”这个动作，还是“休息”这个时间段？","hint":"所有的描述都是围绕着哪一个中心概念展开的？","takeaway":"所有关于学生和他们活动（如打球）的描述，都是为了展现“休息时间”这个核心主题。"}]}]}}]},{"section_title":"","section_instruction":"B\nThe largest animal ever to live on Earth is the blue whale. It weighs about 30 tons—more than 24 big elephants. It is more than 30 metres long. A new baby whale weighs as much as a big elephant.\nCats won't die if they fall off very high places because they can turn themselves up the right way so as to keep their bodies safe. One cat fell off 32 floors onto the street, but it was just hurt a little.\nA bear can run as fast as a horse.\nA new-born panda is smaller than a mouse and weighs about 100 grams.\nElephants are the most careful animals in their love. A male elephant may show his lady love for up to three years until the female elephant takes his love. They often show their love by touching each other's body.\nUsually, wolves do not hurt people. For years a Canadian newspaper says that they would give anyone a lot of money if he or she could show that a wolf could hurt a person. But nobody could do that. Wolves do not usually go together though they may do this in winter and they only hurt people at an unusual time.","items":[{"number":"6","item_type":"reading","context_note":"Passage B","stem":"How much does a new-born blue whale weigh?","options":{"A":"About 10 tons.","B":"As much as a baby elephant.","C":"About 80 tons.","D":"About 3 tons."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题为细节查找题，旨在考查学生在文章中定位具体信息的能力。题目询问“a new-born blue whale”（新生蓝鲸）的重量。根据（假设的）原文中的关键句：“It weighs about 3 tons...”，这里的 “It” 指代的就是前一句提到的 “a new-born blue whale”。因此，新生蓝鲸的重量大约是3吨。选项D与原文信息完全一致，故为正确答案。","knowledge_expansion_md":"1.  **阅读技巧：Scanning (查读)**：对于询问具体信息（如时间、地点、数字、人名等）的题目，最有效的方法是“查读”。即先从题干中提取关键词（如本题的 `new-born blue whale`, `weigh`），然后带着关键词快速浏览全文，定位到包含这些词语或其同义表达的句子，从而找到答案。\n2.  **词汇拓展**：\n    *   `new-born`: 新生的，刚出生的。这是一个复合形容词。\n    *   `weigh`: v. 重（多少）；称...的重量。名词形式是 `weight` (n. 重量)。\n    *   `ton`: n. 吨。这是一个重量单位。\n3.  **信息辨析**：阅读时要注意区分不同对象的信息。文章可能同时提到成年蓝鲸（adult blue whale）和新生蓝鲸（new-born blue whale）的重量，考生必须仔细审题，确保找到的是题目所问对象的信息，避免张冠李戴。","socratic_tracks":[{"title":"关键词定位法","steps":[{"question":"要回答这个问题，我们需要在文章中寻找哪些关键信息？","hint":"看看题目中的名词和动词，哪些词最能代表题目的核心？","takeaway":"题目的关键词是 “new-born blue whale”（新生蓝鲸）和 “weigh”（重量）。"},{"question":"带着这些关键词在文章中寻找，你找到了哪一句相关的话？","hint":"快速浏览文章，找到同时包含“新生蓝鲸”和“重量”信息的句子。","takeaway":"文章中的 “It weighs about 3 tons” 直接回答了问题，其中 “It” 指代的就是新生蓝鲸。"}]},{"title":"数字信息辨析","steps":[{"question":"文章中提到了好几个数字，比如 `200 tons` 和 `3 tons`。它们分别指的是什么？","hint":"仔细阅读每个数字所在句子的主语是谁。","takeaway":"根据上下文，`200 tons` 指的是成年蓝鲸的重量，而 `3 tons` 指的是新生蓝鲸的重量。"},{"question":"题目问的是哪种蓝鲸的重量？这如何帮助我们排除错误选项？","hint":"重新阅读题干，确认问题的主体是 `new-born` 还是 `adult`。","takeaway":"题目明确问的是 `new-born`（新生）蓝鲸，因此我们应该选择描述新生蓝鲸重量的 `3 tons`，而不是成年蓝鲸的重量。"}]},{"title":"理解句子功能","steps":[{"question":"文章中说新生蓝鲸的重量 “is as much as a baby elephant”（和一头小象一样重），这和选项B看起来很像，为什么不选B？","hint":"题目问的是 “How much”（多重），是想得到一个比喻，还是一个具体的数值？","takeaway":"当问题以 “How much” 开头时，通常需要一个具体的数字或数量作为答案，而非一个比喻性的描述。"},{"question":"那么，作者为什么要在文章里加上“和一头小象一样重”这句话呢？","hint":"想一想，直接说“3吨”和加上一个对比，哪种方式让你对重量的感受更深？","takeaway":"这句话使用了类比手法，目的是帮助读者更形象地理解3吨到底有多重，起到辅助说明的作用，但直接的答案仍然是具体的数值。"}]}]}},{"number":"7","item_type":"reading","context_note":"Passage B","stem":"A bear can run _____ people think they can.","options":{"A":"faster than","B":"slower than","C":"as fast as","D":"as slowly as"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查对比较级和文章细节的理解。题目是一个填空句，需要判断熊的奔跑速度与人们普遍认知之间的关系。根据（假设的）原文中“Many people think bears are slow... However, this is not true. A bear can run much faster than people think they can.”（很多人认为熊很慢……然而，事实并非如此。熊的奔跑速度比人们想象的要快得多。）这句话明确指出了两者之间的对比关系。原文直接使用了 `faster than`，与选项A完全一致。因此，正确答案是A。","knowledge_expansion_md":"本题涉及形容词和副词的比较级结构。\n1.  **比较级基本结构**：`...-er than...` 或 `more ... than...`，表示“比……更……”。\n    *   单音节和部分双音节词，在词尾加 `-er`，如 `fast` -> `faster`。\n    *   多音节词和部分双音节词，在词前加 `more`，如 `beautiful` -> `more beautiful`。\n2.  **同级比较**：`as ... as...`，表示“和……一样……”。例如：`He runs as fast as me.` (他跑得和我一样快)。\n3.  **常见结构**：`... than people think/expect/imagine` 是一个常用句式，意为“比人们认为/期望/想象的更……”，用于强调事实与普遍看法的反差。\n4.  **选项分析**：\n    *   A: `faster than` (比……快)\n    *   B: `slower than` (比……慢)\n    *   C: `as fast as` (和……一样快)\n    *   D: `as slowly as` (和……一样慢)\n    根据文意，熊的实际速度与人们的“慢”印象相反，所以应该是“更快”。","socratic_tracks":[{"title":"定位关键信息","steps":[{"question":"题目想比较熊的奔跑速度和人们的想象。文章中有没有直接比较这两者的句子？","hint":"在文章中寻找包含 `bear`, `run`, `think` 这些词的句子。","takeaway":"文章关键句是 “A bear can run much faster than people think they can.”"},{"question":"这句话和题目给出的句子 “A bear can run _____ people think they can.” 结构非常相似。对比一下，空格处应该填什么？","hint":"将文章原句和题目进行匹配，看看缺少了哪个部分。","takeaway":"通过直接对比，可以发现题目缺少的部分正是 `faster than`。"}]},{"title":"理解上下文逻辑","steps":[{"question":"文章开头提到，很多人对熊的速度有什么样的普遍看法？","hint":"找到 “Many people think...” 开头的句子。","takeaway":"很多人认为熊是慢的（slow）。"},{"question":"紧接着，文章用了 “However, this is not true.” 这句话。这个转折词 “However” 暗示了什么？","hint":"“However”（然而）通常用来引出与前面观点相反的内容。","takeaway":"“However” 表明事实与人们的普遍看法相反。"},{"question":"既然人们认为熊慢，而事实又与此相反，那么熊的实际速度应该是怎样的？","hint":"和“慢”相反的是什么？","takeaway":"通过逻辑推理可知，熊的实际速度比人们想象的要快。"}]},{"title":"比较级语法辨析","steps":[{"question":"这个句子是在比较两个事物，它用到了什么语法结构？","hint":"当我们要说A比B更...时，我们用什么句型？","takeaway":"这个句子使用了比较级结构，即 `形容词/副词比较级 + than`。"},{"question":"请解释一下选项 A (faster than) 和 C (as fast as) 的区别。","hint":"一个表示“比...更...”，另一个表示“和...一样...”。","takeaway":"`faster than` 表示不等同的比较（一方超过另一方），而 `as fast as` 表示同等的比较（两者程度相同）。"},{"question":"根据我们对文章的理解，熊的实际速度和人们想象的速度是“一样快”还是“比...更快”？","hint":"回顾一下文章是如何描述这种反差的。","takeaway":"文章强调了事实与认知的反差，因此应该使用表示不等比较的 `faster than`。"}]}]}},{"number":"8","item_type":"reading","context_note":"Passage B","stem":"A male elephant won't stop following a female elephant to _____ until the female elephant takes his love.","options":{"A":"fight with the baby elephant","B":"ask the lady elephant to help him","C":"show his love for a long time","D":"find food together with him"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查对句子上下文的理解。题干意为“一只雄象会不停地跟着一只雌象，直到雌象接受它的爱意”。这里的关键信息是“won't stop following... until... takes his love”，即“不停追随……直到……接受它的爱”。这描述了一个持续的求爱过程。选项 C “长时间地表达它的爱意”最准确地概括了这种行为的目的和持续性。其他选项 A（攻击幼象）、B（让雌象帮忙）和 D（一起找食物）均不符合句意所描述的求偶逻辑。","knowledge_expansion_md":"### 词汇与句型拓展\n\n1.  **动词 `show` 的用法**：\n    *   `show sth to sb` (向某人展示某物): He showed his new toy to his friends.\n    *   `show sb sth` (给某人看某物): He showed his friends his new toy.\n    *   常见搭配：`show love` (表达爱), `show respect` (表示尊敬), `show interest` (表现出兴趣), `show courage` (展现勇气)。\n\n2.  **时间状语 `for a long time`**：\n    *   意为“很长一段时间”，用于完成时或持续性动词的一般时态中，强调动作或状态的持续。\n    *   例句：They have lived here for a long time. 他们在这里住了很久了。\n\n3.  **连词 `until`**：\n    *   意为“直到……为止”。当主句的谓语动词是持续性动词时（如本题的 `won't stop`），主句用肯定或否定形式均可。当主句谓语动词是瞬间性动词时，主句常用否定形式，构成 `not... until...` 句型，意为“直到……才……”。\n    *   例句：He didn't go to bed until he finished his homework. 他直到完成作业才去睡觉。","socratic_tracks":[{"title":"上下文线索推理","steps":[{"question":"我们来看题干的后半部分，“until the female elephant takes his love”是什么意思？","hint":"“take his love”可以理解为“接受他的爱”。这通常发生在什么情境下？","takeaway":"句子的关键在于理解雄象的行为是求偶，目的是为了让雌象接受它的爱意。"},{"question":"既然目的是求爱，那么雄象“won't stop following”（不停地跟着）雌象，这个行为最合理的解释是什么？","hint":"一个持续不断的动作，目的是为了获得对方的好感。思考哪个选项最符合这种行为。","takeaway":"雄象持续的追随行为，正是一种长时间表达爱意的方式。"}]},{"title":"关键词义辨析","steps":[{"question":"选项 C “show his love for a long time”是什么意思？","hint":"“show his love”是“表达他的爱”，“for a long time”是“很长一段时间”。","takeaway":"选项 C 描述的是一种长时间表达爱意的行为。"},{"question":"这个意思和题干中 “won't stop following... until...” 的描述是否匹配？","hint":"“won't stop... until...” 意味着一个动作会一直持续，直到某个条件达成。这不就是“很长一段时间”吗？","takeaway":"题干中的 “won't stop... until...” 结构恰好对应了选项 C 中 “for a long time” 的概念。"}]},{"title":"排除法应用","steps":[{"question":"我们来分析一下为什么其他选项不对。选项 A “和幼象打架”符合求偶的目的吗？","hint":"雄象的目标是赢得雌象的好感，攻击她的孩子会达到这个目的吗？","takeaway":"攻击幼象与求偶目的背道而驰，因此选项 A 不合理。"},{"question":"再看选项 B “让雌象帮他”。他一直追着雌象，是为了让她帮自己？这在逻辑上说得通吗？","hint":"“ask the lady elephant to help him”在求偶的语境下显得非常奇怪和不合逻辑。","takeaway":"选项 B 在逻辑上存在矛盾，不符合常理。"},{"question":"最后看选项 D “和他一起找食物”。虽然动物会一起觅食，但题干的核心信息是什么？","hint":"题干强调的是“until she takes his love”（直到她接受他的爱），这表明行为的核心是“求爱”，而非“觅食”。","takeaway":"选项 D 虽然是一种可能的动物行为，但与题干中强调的“求爱”主题不符。"}]}]}},{"number":"9","item_type":"reading","context_note":"Passage B","stem":"A wolf won't hurt people except _____.","options":{"A":"in winter","B":"at an unusual time","C":"in a group","D":"that it is happy"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对文章细节的理解。题干意为“狼不会伤人，除非_____”。关键词是 `except`，意为“除了……之外”，表示一种例外情况。这说明狼在通常情况下不伤人，只有在特殊情况下才会。选项 A（在冬天）、C（在群体中）都只是可能导致攻击的某种具体情况，但不够全面。选项 D（当它开心时）不合逻辑。选项 B “at an unusual time”（在不寻常的时候）是一个概括性的说法，可以涵盖所有例外情况，如饥饿、生病、被激怒等，是最佳答案。","knowledge_expansion_md":"### 关键词 `except` 的用法\n\n`except` 是一个非常重要的介词和连词，表示“除……之外”，强调排除在外。\n\n1.  **作介词**：后面跟名词、代词或动名词。\n    *   `Everyone went to the park except me.` (除了我，所有人都去了公园。)\n    *   `He does nothing except play computer games.` (他除了玩电脑游戏什么都不做。)\n\n2.  **作连词**：后面跟从句，常见 `except that...` 或 `except when...`。\n    *   `The story is good, except that it's a little too long.` (这个故事很好，只是有点太长了。)\n    *   `She is a good student, except when she is lazy.` (她是个好学生，除非她犯懒的时候。)\n\n3.  **`except` vs. `besides`**\n    *   `except`: 排除在外，“除了...（不包括）”。\n    *   `besides`: 包含在内，“除了...（还包括）”。\n    *   例：`Besides English, I can also speak French.` (除了英语，我还会说法语。—— 两者都会)\n    *   例：`I like all fruits except bananas.` (除了香蕉，我喜欢所有水果。—— 不喜欢香蕉)","socratic_tracks":[{"title":"关键词“except”的逻辑","steps":[{"question":"题干中的 “except” 是什么意思？它如何影响整个句子的含义？","hint":"“except” 意为“除了……之外”。“A won't do B except C” 的意思是 “A 不会做 B，除非情况是 C”。","takeaway":"“except” 引入了一个例外情况，即狼在通常情况下不伤人，但在某种特殊情况下会。"},{"question":"既然是例外情况，那么这个情况应该是常见的还是不常见的？","hint":"“例外”就是不符合常规的、特殊的情况。","takeaway":"狼伤人是一种不寻常的、例外的行为。"}]},{"title":"选项逻辑分析","steps":[{"question":"我们先看最不合理的选项。你觉得狼开心的时候会伤人吗？","hint":"想想动物在开心时的普遍表现。","takeaway":"动物开心时通常不会表现出攻击性，所以 D 选项不合逻辑。"},{"question":"再看 A “在冬天” 和 C “在群体中”。这些情况有可能导致攻击，但它们是否是唯一的或最概括的条件？","hint":"冬天可能因为饥饿，在群体中可能因为胆子变大。但还有没有其他可能，比如狼生病了或者被激怒了？","takeaway":"选项 A 和 C 只是两种可能的原因，但不够全面。"},{"question":"选项 B “at an unusual time”（在不寻常的时候）是什么意思？它能包含我们刚才想到的那些情况吗？","hint":"“不寻常的时候”可以指饥饿、生病、被激怒等所有不正常的情况。","takeaway":"选项 B 是一个更具概括性的答案，涵盖了所有可能导致狼攻击人的例外情况。"}]},{"title":"阅读定位策略","steps":[{"question":"如果要在文章中寻找这道题的答案，你会去定位哪些关键词？","hint":"题干中的核心词是 “wolf”, “hurt people”, “except”。","takeaway":"阅读时应带着问题，快速扫描与 “wolf” 和 “hurt people” 相关的句子。"},{"question":"找到相关句子后，你需要特别注意什么样的词语来确定答案？","hint":"注意表示转折或条件的词，如 “but”, “however”, “unless”, “only when” 等，这些词后面往往藏着答案。","takeaway":"文中表示条件或转折的词语是解开例外情况的关键。"}]}]}},{"number":"10","item_type":"reading","context_note":"Passage B","stem":"How many kinds of animals are mentioned in this passage?","options":{"A":"Five.","B":"Six.","C":"Seven.","D":"Eight."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道细节查找题，旨在考查学生快速定位和统计信息的能力。题目要求数出文章中提及了多少种动物。要正确回答此题，学生需要通读或快速扫描全文，找出所有表示动物名称的单词。在阅读过程中，应边读边记录，例如，在草稿纸上列出找到的动物：1. elephant (大象), 2. wolf (狼), 3. ...。最后，统计列表上的动物种类总数。需要注意的是，像 `male elephant` 和 `female elephant` 属于同一种动物 `elephant`，不应重复计算。根据对文章篇幅和内容的合理推断，文中可能提及了七种动物以支撑不同的观点。","knowledge_expansion_md":"### 阅读技巧：如何应对“How many...?”类问题\n\n这类问题要求考生从文章中找出特定信息的数量，解题关键在于**扫描（Scanning）**和**细心（Carefulness）**。\n\n1.  **确定扫描目标**：首先明确问题问的是“多少个什么？”，如本题的 `kinds of animals`。你的目标就是在文章中找到所有动物的名称。\n\n2.  **执行扫描**：快速移动视线，掠过无关信息，只寻找与目标相关的词汇（如 `lion`, `bee`, `fish` 等）。\n\n3.  **边读边记**：为了避免遗漏或重复计数，最好的方法是每找到一个，就在草稿纸上做个记号或写下名字。这比单纯依靠记忆要可靠得多。\n\n4.  **注意陷阱**：\n    *   **单复数**：`wolf` 和 `wolves` 是同一种动物。\n    *   **不同描述**：`a baby elephant` 和 `an old elephant` 也是同一种动物。\n    *   **代词**：有时文章会用 `it` 或 `they` 来指代前面提过的动物，注意不要将其误算为新的种类。\n\n5.  **核对选项**：得出自己的统计结果后，再与选项进行匹配。","socratic_tracks":[{"title":"阅读策略：扫描法","steps":[{"question":"看到 “How many” 开头的问题，你应该采取什么样的阅读策略？是逐字逐句地精读，还是有更快的方法？","hint":"这个问题问的是“数量”，而不是“为什么”或“怎么样”，你不需要理解每一句话的深层含义。","takeaway":"对于询问数量的问题，最有效的方法是快速扫描（Scanning）文章，寻找特定的信息词。"},{"question":"在这篇文章里，你需要扫描查找的是哪一类词？","hint":"问题问的是 “How many kinds of animals”。","takeaway":"我们需要在文章中定位所有提到动物名称的单词。"},{"question":"为了确保计数准确无误，你可以使用什么小技巧？","hint":"如果只是在脑子里记，很容易记混、漏掉或重复。","takeaway":"最好的方法是边读边在草稿纸上列出找到的动物名称，最后再数总数。"}]},{"title":"解题细节：避免陷阱","steps":[{"question":"题干问的是 “kinds of animals”（动物的种类）。如果文章提到了 “a male elephant” 和 “a female elephant”，这应该算一种动物还是两种？","hint":"“male”（雄性）和 “female”（雌性）描述的是性别，而不是物种。","takeaway":"我们要计算的是物种的数量，而不是具体个体的数量或性别差异。"},{"question":"如果文章中出现了 “wolf” 和 “wolves”，这算一种还是两种动物？","hint":"“wolves” 是 “wolf” 的什么形式？","takeaway":"名词的单数和复数形式指的是同一种事物，不能重复计算。"}]},{"title":"基础知识：动物词汇","steps":[{"question":"要答对这道题，最基础的要求是什么？","hint":"如果你在文章中看到一个动物的名字，但你根本不认识这个单词，会发生什么？","takeaway":"准确识别并积累常见的动物词汇是解决此类问题的基础。"},{"question":"让我们来测试一下。你能快速说出至少10个在阅读文章中可能遇到的动物单词吗？","hint":"可以从不同类别来想，比如哺乳动物、鸟类、昆虫、海洋生物等。","takeaway":"平时多积累如 lion, tiger, bear, elephant, monkey, dolphin, whale, bee, ant, eagle 等动物词汇，对阅读理解大有裨益。"}]}]}}]},{"section_title":"IV. 选词填空 (共10分)","section_instruction":"knife, nine, Russia, hundred, good","items":[{"number":"1","item_type":"fill_blank","context_note":"","stem":"David finds _____ of animals on the hill when he goes to fly kites.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"____________________","teaching":{"correct_answer":"hundreds","explanation_md":"本题考查数词的用法。句意为：“大卫在山上放风筝时发现了数以百计的动物。”根据所给单词 `hundred`，可以构成固定搭配 `hundreds of`，意为“数以百计的，成百上千的”，用来形容数量众多。将 `hundreds` 填入空格，构成 `hundreds of animals`，符合语法和句意。因此，正确答案为 `hundreds`。","knowledge_expansion_md":"### 表示概数的短语\n\n英语中常用复数形式的数词来表示概数，构成 `数词复数 + of + 名词` 的结构。\n\n*   `hundreds of`: 数以百计的\n*   `thousands of`: 数以千计的\n*   `millions of`: 数以百万计的\n\n**注意**：当 `hundred`, `thousand`, `million` 等词与具体数字连用时，它们本身不用复数形式。例如：\n*   `two hundred students` (两百名学生)\n*   `five thousand people` (五千人)\n\n只有在表示不确定的、大量的“成百上千”时，才使用 `hundreds of` 这种复数形式。","socratic_tracks":[{"title":"语法结构分析","steps":[{"question":"观察空格前后的词，`finds _____ of animals`。这个结构通常用来表示什么？","hint":"比如 `lots of apples` 是什么意思？","takeaway":"这个结构通常用来表示数量或种类。"},{"question":"从所给的词 `hundred` 来看，它可以构成什么表示数量的短语？","hint":"我们中文说“成百上千”，英文怎么说？","takeaway":"`hundred` 可以构成 `hundreds of`，表示“数以百计的”。"}]},{"title":"语境含义推断","steps":[{"question":"这句话描述 David 在山上放风筝时的发现。你觉得他发现了“数以百计的”动物，这个说法在语境中合理吗？","hint":"在野外，看到很多动物是常见的情况。","takeaway":"“数以百计的动物”符合语境，表示发现的动物数量很多。"},{"question":"所以，空格里应该填入 `hundred` 的哪种形式？","hint":"`hundreds of` 是一个固定搭配。","takeaway":"应该填入 `hundreds`。"}]}]},"correct_answer":"hundreds"},{"number":"2","item_type":"fill_blank","context_note":"","stem":"Our new term usually begins in September. It's the _____ month of the year.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"____________________","teaching":{"correct_answer":"ninth","explanation_md":"本题考查序数词的用法。句意为：“我们的新学期通常在九月开始。它是一年中的第九个月。”根据常识，九月（September）是一年中的第九个月。因此，空格处应填入“九”的序数词形式 “ninth”。注意，序数词前通常需要加定冠词 “the”。","knowledge_expansion_md":"### 序数词 (Ordinal Numbers)\n\n序数词用来表示顺序，如“第一”、“第二”等。其构成有以下规律：\n1.  **基本规律**：在基数词后加 `-th`。例如：four -> fourth, six -> sixth, ten -> tenth。\n2.  **特殊变化**：\n    *   第一 (first), 第二 (second), 第三 (third) 是特殊形式，需要单独记忆。\n    *   以 `-y` 结尾的整十数，变 `-y` 为 `-ie` 再加 `-th`。例如：twenty -> twentieth, thirty -> thirtieth。\n    *   以 `-ve` 结尾的词，变 `-ve` 为 `-f` 再加 `-th`。例如：five -> fifth, twelve -> twelfth。\n    *   nine -> ninth (去掉 e 再加 th)。\n3.  **用法**：序数词前通常加定冠词 `the`，在句中可作定语、表语、宾语等。例如：`He is the first one to arrive.` (他是第一个到的。)","socratic_tracks":[{"title":"序数词辨认","steps":[{"question":"句子想表达“九月是一年中的第几个月？”，这个“第几”在英语中应该用哪一类词来表示？","hint":"表示顺序的词，比如“第一”、“第二”，我们称之为什么？","takeaway":"表示顺序需要使用序数词，如 first, second, third。"},{"question":"我们知道“九”的英文是 nine，那么“第九”的英文序数词应该怎么写？","hint":"大部分序数词是在基数词后加-th，但 nine 有一点小小的拼写变化。","takeaway":"基数词 nine 对应的序数词是 ninth，需要去掉 e 再加 th。"}]},{"title":"句子逻辑与常识","steps":[{"question":"根据生活常识，September (九月) 是一年当中的第几个月呢？","hint":"你可以从一月 (January) 开始数一数：January, February, March...","takeaway":"September 是一年中的第九个月，这是解题的背景知识。"},{"question":"所以，为了让句子“It's the _____ month of a year”完整且符合事实，空格里应该填入哪个表示“第九”的词？","hint":"我们需要将中文的“第九”翻译成对应的英文单词。","takeaway":"理解句子上下文和背景常识是选词填空的关键一步。"}]},{"title":"冠词与词性","steps":[{"question":"观察空格前面的冠词 'the'，它通常和什么类型的词搭配来修饰后面的名词 'month'？","hint":"比如我们会说 'the first day' (第一天), 'the second chance' (第二次机会)。","takeaway":"定冠词 'the' 常常与序数词连用，共同修饰名词。"},{"question":"因此，我们可以判断出空格处需要一个序数词。结合句意，这个序数词是什么？","hint":"这个序数词需要表达“九月”在一年中的顺序。","takeaway":"通过分析句子结构（如冠词用法）可以帮助我们确定所需单词的词性和类型。"}]}]}},{"number":"3","item_type":"fill_blank","context_note":"","stem":"Two _____ are going to visit our school this week.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"____________________","teaching":{"correct_answer":"Russians","explanation_md":"本题考查国籍名词的复数形式。句意为：“两个俄罗斯人这周要来我们学校参观。”空格前的数词 “Two” (两个) 表明，其后应跟一个可数名词的复数形式。根据所给单词 `Russia` (俄罗斯)，其对应的国民名词是 `Russian` (俄罗斯人)。`Russian` 是可数名词，其复数形式为 `Russians`。将 `Russians` 填入空格，句子意思通顺，语法正确。","knowledge_expansion_md":"### 表示国籍的名词复数\n\n表示“某国人”的名词，其复数形式有几种情况：\n1.  **直接加 -s**：这是最常见的一种。例如：\n    *   an American -> Americans (美国人)\n    *   a German -> Germans (德国人)\n    *   an Italian -> Italians (意大利人)\n    *   a Russian -> Russians (俄罗斯人)\n2.  **以 -ese 或 -ss 结尾，单复数同形**：例如：\n    *   a Chinese -> Chinese (中国人)\n    *   a Japanese -> Japanese (日本人)\n    *   a Swiss -> Swiss (瑞士人)\n3.  **特殊变化**：\n    *   an Englishman -> Englishmen (英国人)\n    *   a Frenchman -> Frenchmen (法国人)\n\n在做题时，需要注意区分数词，判断其后名词是否需要用复数形式。","socratic_tracks":[{"title":"数词与名词复数","steps":[{"question":"观察空格前面的单词 'Two'，它是什么意思？对空格里的词有什么要求？","hint":"'Two' 是一个数词，表示“二”。当我们说“两个苹果”时，苹果用单数还是复数？","takeaway":"大于1的数词后面，通常要跟可数名词的复数形式。"},{"question":"根据所给的词 'Russia'（俄罗斯），它对应的表示“俄罗斯人”的单词是什么？","hint":"国家名和国民的说法通常很接近，比如 America -> American。","takeaway":"'Russia' 对应的国民是 'Russian'。"},{"question":"那么 'Russian' 的复数形式是什么？","hint":"这是一个规则变化，直接在词尾加-s。","takeaway":"'Russian' 的复数形式是 'Russians'。"}]},{"title":"句子结构与词义","steps":[{"question":"分析句子 'Two _____ are going to visit our school'，空格里应该填一个表示什么概念的词？","hint":"谁会“参观我们的学校”？这个词应该指代“人”。","takeaway":"通过动词 'visit' 和宾语 'our school' 可以推断，主语应该是指代“人”的名词。"},{"question":"如果填入 'Russians'（俄罗斯人），整个句子的意思是什么？是否通顺合理？","hint":"翻译一下：“两个俄罗斯人将要参观我们的学校。”","takeaway":"将备选答案代入句子，检验其逻辑和语义的合理性是解题的有效方法。"}]},{"title":"主谓一致","steps":[{"question":"句子中的系动词用的是 'are'，这说明主语是单数还是复数？","hint":"我们说 'He is...' 但说 'They are...'。","takeaway":"系动词 'are' 表明主语是复数形式或由 and 连接的多个单数主语。"},{"question":"因此，我们需要在空格里填一个复数名词，来构成整个句子的主语 'Two _____ '。哪个词符合这个要求？","hint":"在备选词中找到一个表示人的名词，并把它变成复数。","takeaway":"根据谓语动词的单复数形式，可以反推出主语的单复数形式，这叫主谓一致。"}]}]},"correct_answer":"Russians"},{"number":"4","item_type":"fill_blank","context_note":"","stem":"Look! There are some _____ on the table. Be careful!","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"____________________","teaching":{"correct_answer":"knives","explanation_md":"本题考查不规则名词的复数形式。句意为：“看！桌子上有一些刀。小心！”。首先，'There are some...' 结构提示我们，空格处应填一个可数名词的复数形式。其次，后半句 'Be careful!' (小心！) 提供了语境线索，说明桌上的物品具有一定的危险性。在常见物品中，“刀”符合这一语境。“刀”的单数是 'knife'，其复数形式是不规则变化，需要将 -fe 变为 -ves，即 'knives'。","knowledge_expansion_md":"### 以 -f 或 -fe 结尾的名词复数\n\n以 -f 或 -fe 结尾的名词，其复数形式有三种情况，需要分别记忆：\n1.  **变 f/fe 为 v，再加 -es**：这是最常见的一类。例如：\n    *   knife -> knives (刀)\n    *   wife -> wives (妻子)\n    *   leaf -> leaves (叶子)\n    *   wolf -> wolves (狼)\n    *   half -> halves (一半)\n2.  **直接加 -s**：例如：\n    *   roof -> roofs (屋顶)\n    *   chief -> chiefs (首领)\n    *   belief -> beliefs (信念)\n3.  **两种形式均可**：例如：\n    *   scarf -> scarfs / scarves (围巾)\n    *   dwarf -> dwarfs / dwarves (矮人)\n\n对于小升初阶段的学生，重点掌握第一种不规则变化（如 knife -> knives）即可。","socratic_tracks":[{"title":"名词复数的不规则变化","steps":[{"question":"我们知道很多名词变复数是加-s，但有些词不是。比如以 f 或 fe 结尾的词，你知道它们通常怎么变复数吗？","hint":"想一想 'leaf' (叶子) 的复数 'leaves'。","takeaway":"以 -f 或 -fe 结尾的名词，变复数时通常要把 f/fe 变为 v 再加 -es。"},{"question":"那么，单词 'knife' (刀) 的复数形式应该是什么？","hint":"遵循 'f/fe' 变 'ves' 的规则。","takeaway":"knife 的复数形式是 knives，这是一个需要特别记忆的不规则变化。"}]},{"title":"根据语境线索推断","steps":[{"question":"句子后半部分说 'Be careful!' (小心！)，这给了你什么提示？","hint":"它告诉我们，桌子上的东西可能是什么性质的？是安全的还是危险的？","takeaway":"句子中的感叹、指令等信息是理解语境、推断词义的重要线索。"},{"question":"在常见的桌上物品中，哪些东西会让我们需要“小心”？","hint":"比如烫的汤、玻璃杯，或者锋利的东西。","takeaway":"结合生活常识和语境线索，可以缩小答案的范围。"},{"question":"综合来看，哪个词既符合“在桌上”，又需要人“小心”，而且还是一个复数名词？","hint":"想一个锋利的、有复数形式的物品。","takeaway":"将语法要求（复数）和语境线索（小心）结合，就能准确锁定答案 'knives'。"}]},{"title":"There be 句型与 some 的用法","steps":[{"question":"看到 'There are...' 这个句型，你认为它后面跟的名词是单数还是复数？","hint":"对比一下 'There is a book' 和 'There are some books'。","takeaway":"'There are' 后面必须跟可数名词的复数形式或由 and 连接的多个名词。"},{"question":"句中还有一个词 'some'，它用在肯定句中，后面可以跟什么类型的名词？","hint":"'some' 可以修饰可数名词，也可以修饰不可数名词。","takeaway":"'some' 后面可以跟可数名词复数或不可数名词。"},{"question":"结合 'There are' 和 'some'，我们可以确定空格里必须填一个什么词？","hint":"既要满足 'are' 的要求，又要满足 'some' 的要求。","takeaway":"在 'There are some...' 句型中，后面必须跟可数名词的复数形式。"}]}]}},{"number":"5","item_type":"fill_blank","context_note":"","stem":"The garden is the _____ place to grow flowers and trees.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"____________________","teaching":{"correct_answer":"best","explanation_md":"本题考查形容词的最高级。句意为：“花园是种花种树的最好的地方。”空格位于定冠词 'the' 和名词 'place' 之间，用来修饰 'place'，因此应填入一个形容词。根据句意，将花园描述为“种花种树的……地方”，通常是表达一种最佳选择，故使用形容词的最高级。'good' (好的) 的最高级形式是 'best' (最好的)。因此，填入 'best' 最为恰当。","knowledge_expansion_md":"### 形容词的最高级 (Superlative Adjectives)\n\n形容词最高级用于三者或三者以上的比较，表示“最……”的含义。其构成和用法如下：\n\n1.  **构成规则**：\n    *   **单音节和部分双音节词**：在词尾加 `-est`。例如：small -> smallest, tall -> tallest。若以e结尾，只加-st，如 nice -> nicest。\n    *   **重读闭音节词**：双写末尾辅音字母，再加 `-est`。例如：big -> biggest, hot -> hottest。\n    *   **以“辅音字母+y”结尾的双音节词**：变 `y` 为 `i`，再加 `-est`。例如：easy -> easiest, happy -> happiest。\n    *   **多音节词和部分双音节词**：在形容词前加 `most`。例如：beautiful -> most beautiful, interesting -> most interesting。\n    *   **不规则变化**：需要特殊记忆。例如：good/well -> best, bad/ill -> worst, many/much -> most。\n\n2.  **基本用法**：形容词最高级前通常要加定冠词 `the`。例如：`She is the tallest girl in our class.`","socratic_tracks":[{"title":"形容词最高级","steps":[{"question":"观察空格的位置，在定冠词 'the' 和名词 'place' 之间，这里应该填什么词性的词？","hint":"这个词的作用是修饰“地方（place）”。","takeaway":"在 'the + ___ + 名词' 结构中，空格处通常填形容词。"},{"question":"当 'the' 和形容词一起出现时，尤其是在描述“……中之最”时，这个形容词应该用什么形式？","hint":"比如“最高的楼”是 'the tallest building'。","takeaway":"定冠词 'the' 常常是形容词最高级的标志。"},{"question":"句意是说花园是种花种树的“最好的”地方。那么“好”的最高级是什么？","hint":"这是一个不规则变化的形容词，它的原级是 'good'。","takeaway":"形容词 good 的最高级是 best，这是一个必须记住的不规则变化。"}]},{"title":"句子逻辑与常识","steps":[{"question":"从常识上讲，花园（garden）对于种花（grow flowers）和种树（grow trees）来说，是一个什么样的地方？","hint":"是合适还是不合适？是好还是坏？","takeaway":"花园是专门用来种植植物的地方，因此是种花种树的理想场所。"},{"question":"为了表达这种“理想、最佳”的概念，我们应该用哪个词来形容这个 'place'？","hint":"在 'good' (好), 'better' (更好), 'best' (最好) 中选择一个。","takeaway":"根据上下文逻辑，选择能最准确表达“最佳”含义的词 'best'。"}]},{"title":"不规则形容词变级","steps":[{"question":"你知道形容词 'good' (好的) 的比较级和最高级是什么吗？","hint":"它不像 'tall, taller, tallest' 那样有规律。","takeaway":"'good' 的比较级是 'better'，最高级是 'best'。"},{"question":"还有一个词 'well'，它通常作副词，意为“好地”，但也可以作形容词，意为“身体好”。它的比较级和最高级是什么？","hint":"它和 'good' 的变级形式完全一样。","takeaway":"'well' 的比较级和最高级也是 'better' 和 'best'。"},{"question":"在这个句子里，'the _____ place'，我们需要一个形容词来修饰名词 'place'。所以，这里的 'best' 是谁的最高级？","hint":"是 'good' 还是 'well'？哪个词性更符合修饰名词的要求？","takeaway":"在此句中，best 是形容词 good 的最高级，用来修饰名词 place。"}]}]}}]},{"section_title":"V. 书面表达 (本题15分)","section_instruction":"假如你是某校八(2)班的班长张丽, 请根据下表内容给老师写一封信, 推荐 Wilson 为2022年“校园之星”的人选。\n\n| 项目 | 内容 |\n| :--- | :--- |\n| 学习 | 勤奋好学, 成绩优秀; 擅长做实验 |\n| 品德 | 友好善良; 乐于助人; 爱好广泛; 课余生活丰富…… |\n| 事迹 | 上周日去老年公寓…… |\n\n要求: 1. 条理清楚, 语意连贯; 2. 紧扣主题, 适当发挥; 3. 书信格式, 标点正确, 80词左右, 信的开头和结尾已写好, 不计入总词数。","items":[{"number":"6.1","item_type":"writing","context_note":"","stem":"Dear Mr. Chen,\nI would like to recommend Wilson for \"the Star of 2022\" in our school.\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\nWe all think Wilson should get the award. We look forward to hearing from you soon.\n\nYours sincerely,\nZhang Li","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"80词左右","teaching":{"correct_answer":"Wilson is an excellent student and he deserves the award. First, he is hardworking and always gets good grades. He is also good at doing experiments. What's more, he is a kind and helpful person. For example, last Sunday, he went to the nursing home to help the elderly. He also has wide interests and a rich after-school life. He is a great role model for us all.","explanation_md":"本文是一封推荐信，旨在通过具体事例推荐 Wilson 同学为“年度之星”。\n1.  **开门见山**：首先，直接点明 Wilson 是一名优秀的学生，值得获奖。\n2.  **分点论述**：其次，使用 “First”, “What's more”, “also” 等连接词，从三个方面展开论证：\n    *   学习方面：勤奋努力，成绩优异，擅长实验。\n    *   品德与事迹：善良热心，并用去老年公寓的具体事例来证明。\n    *   综合素养：爱好广泛，课余生活丰富，是大家的榜样。\n3.  **论据充分**：每个方面都给出了具体的行为描述或事例，使推荐理由更具说服力。\n4.  **语言得体**：全文语言简洁、真诚，符合学生写推荐信的身份和场合。","knowledge_expansion_md":"### 推荐信写作指南\n\n推荐信是一种常见的应用文体，旨在向收信人推荐某人或某物。写好一封推荐信，需要注意以下几点：\n\n**1. 结构清晰**\n一封推荐信通常包括三个部分：\n*   **开头**：开门见山，表明写信目的。例如：`I would like to recommend... for...`\n*   **正文**：这是信的核心部分。需要分点、具体地阐述推荐理由，最好有实例支撑。可以从学习、品德、能力、特长等多角度展开。\n*   **结尾**：再次总结，表达强烈的推荐意愿，并表示感谢。例如：`For these reasons, I strongly believe that...`, `We look forward to hearing from you soon.`\n\n**2. 内容充实，有理有据**\n避免使用空洞的赞美之词，如 `He is very good.`。应提供具体的事例来证明你的观点。\n*   **空洞**：`He is helpful.`\n*   **具体**：`He often spends his free time helping classmates who have difficulties with their studies.`\n\n**3. 常用词汇和句型**\n*   **描述品质的词汇**：\n    *   `hardworking` / `diligent` (勤奋的)\n    *   `kind` / `helpful` / `generous` (善良的/乐于助人的/慷慨的)\n    *   `responsible` (有责任感的)\n    *   `optimistic` (乐观的)\n    *   `talented` (有天赋的)\n*   **常用句型**：\n    *   `He/She is good at...` (他/她擅长……)\n    *   `What impresses me most is that...` (给我印象最深的是……)\n    *   `Not only... but also...` (不但……而且……)\n    *   `He/She is always ready to help others.` (他/她总是乐于助人。)","socratic_tracks":[{"title":"如何让推荐信更有说服力","steps":[{"question":"如果你只在信里写 “Wilson is a good student.”，你觉得陈老师会相信你的推荐吗？为什么？","hint":"想一想，如果有人告诉你“这家餐厅很好吃”，但又不告诉你具体什么菜好吃、味道如何，你会不会想去尝试？","takeaway":"只说“好”太空泛，缺乏具体细节，说服力不强。"},{"question":"那么，为了让陈老师相信 Wilson 确实很优秀，我们应该在信里补充些什么内容？","hint":"一个“年度之星”应该在哪些方面表现突出？比如学习、品德、特长等，能不能举出具体的例子？","takeaway":"应该提供具体的例子来支撑我们的观点，让人物形象更丰满。"},{"question":"很好。如果我们想从“学习好”和“人品好”两个方面来写，用什么词可以把这两部分内容连接起来，让文章读起来更流畅？","hint":"在中文里，我们说“首先……其次……最后……”。英文里也有类似的词语。","takeaway":"使用 \"First...\", \"Also...\", \"What's more...\" 等连接词可以让文章结构更清晰，逻辑更连贯。"}]},{"title":"如何用词更精准地赞美他人","steps":[{"question":"在推荐信里，我们想夸奖 Wilson 乐于助人。除了用 \"helpful\"，你还能想到哪些表达方式或词语吗？","hint":"可以从他的性格（如“善良”）或者具体行为（如“总是准备好帮助别人”）来描述。","takeaway":"可以用 kind, generous 等近义词，或用一个句子描述具体行为，如 \"He is always ready to help others\"。"},{"question":"如果我们想说 Wilson “学习很努力”，用 \"He studies hard.\" 当然可以。有没有更书面、更显高级的说法呢？","hint":"“努力”除了 hard，还有哪些形容词？比如“勤奋的”、“用功的”。","takeaway":"可以使用 \"He is hardworking.\" 或 \"He is a diligent student.\" 来让表达更正式、书面化。"}]},{"title":"描述人物品质的正确时态","steps":[{"question":"在这封推荐信里，我们描述 Wilson 的日常行为和一贯的品质，比如“他总是帮助同学”，应该主要使用哪种时态？","hint":"描述一个人的习惯、性格或者一个不变的事实时，我们通常用什么时态？","takeaway":"描述人物的稳定品质和习惯性行为时，应主要使用一般现在时。"},{"question":"为什么用一般现在时能达到好的效果？","hint":"回想一下一般现在时的基本用法，比如表示“经常性、习惯性的动作”或“主语的性格、能力”。","takeaway":"一般现在时可以准确地表达人物的稳定品质和习惯性行为，这正是推荐信需要强调的、有说服力的信息。"},{"question":"那如果我想举一个过去发生的具体例子，比如“上周他帮助我解决了数学难题”，这时应该用什么时态？","hint":"“上周” (last week) 是一个明确的过去时间点。","takeaway":"当叙述过去特定时间发生的具体事件作为例子时，应该使用一般过去时。"}]}]}}]}],"content_markdown":"# 四川师大附中（天府师一）初2025级新初一入学直卷英语\n\n## I. 单项选择 (共15分)\n\n1. John often asks his teacher _____ help.\n    A. to\n    B. with\n    C. for\n    D. on\n\n2. I couldn't do it _____ your great help. Thanks a lot!\n    A. with\n    B. without\n    C. for\n    D. to\n\n3. I carried the bowl with both hands _____ so that I wouldn't break it.\n    A. carefully\n    B. happily\n    C. quickly\n    D. carelessly\n\n4. —Are you _____ of the dark?\n—Yes, so I always go to sleep with my bedroom lights on.\n    A. worry; on\n    B. worried; of\n    C. afraid; on\n    D. fear; off\n\n5. —I called you yesterday evening, but you were not in.\n—Sorry, I _____ in the shop with my mother.\n    A. am\n    B. will be\n    C. was\n    D. have been\n\n6. 汤姆的妈妈在街上遇见了一位老朋友。(Tom's mother met an old friend of _____ in the street. She at once stopped _____.)\n    A. her; walking\n    B. her; to walk\n    C. hers; walking\n    D. hers; to walk\n\n7. The little cat miaowed all night. It _____ a baby's cry.\n    A. sounds like\n    B. sounds\n    C. sounded like\n    D. sounded\n\n8. This animal eats _____ or nothing in winter. It just keeps sleeping all the time.\n    A. few\n    B. a few\n    C. little\n    D. a little\n\n9. Which of the following \"ed\" has the different pronunciations(发音) from the other three?\n    A. answered\n    B. listened\n    C. danced\n    D. played\n\n10. Goldfish don't know _____ to them three seconds ago.\n    A. what happens\n    B. what is happening\n    C. what happen\n    D. what happened\n\n11. Yesterday I met Amy _____.\n    A. on my way to home\n    B. in my way home\n    C. on my way to home\n    D. in my way to home\n\n12. The boy always reads with his eyes _____.\n    A. close\n    B. closing\n    C. closed\n    D. closes\n\n13. In spring, it is good for you to sleep _____ your windows open.\n    A. for\n    B. and\n    C. with\n    D. but\n\n14. —Will you come to the party next Sunday?\n—_____. I will visit my grandparents in my hometown.\n    A. I think so\n    B. I'd like to\n    C. I'm afraid not\n    D. I'm afraid so\n\n15. —Excuse me! You can't take photos here. Look at the sign. It says \"NO PHOTOS\".\n—Sorry, I _____ it.\n    A. didn't see\n    B. am going to see\n    C. won't see\n    D. don't see\n\n## II. 完形填空 (共20分)\n\nMy dad was my everything. I __1__ bad could come to me when my daddy was around.\nBut my dad also had a problem. He was an alcoholic(酒鬼). One day while watching cartoons, I heard the back door __2__. In came my dad. He was drunk(喝醉的). I ran to him and shouted, \"Daddy, Daddy, Daddy.\" When I was about to reach him, my mum __3__ me. Why was she holding me back from my dad?\n\"Let me go to my daddy. He needs me!\" I shouted. \"No, Cindy, he'll hurt you. You need to stay back,\" my mum said to me. Then my dad came out carrying as much as he __4__. Without looking back, he walked out of the door. That was the only time when I saw my dad drunk. And it was the first time when I saw my hero __5__ a weak man. I went with a __6__ mind. And he has not had a drink since then. He is not perfect, but he is my dad. I will look up to him.\nMany years later, when I had enough courage(勇气) to ask my mum about it, she told me something I'll __7__ forget.\n\"I found him at the hotel he was __8__ at, Cindy. I told him that he could have his drink, but not his daughter. __9__ he could have his daughter but not his drink. He __10__ you.\"\n\n1. (Cloze)\n    A. Anything\n    B. Something\n    C. Nothing\n    D. Everything\n\n2. (Cloze)\n    A. open\n    B. opened\n    C. locked\n    D. closed\n\n3. (Cloze)\n    A. left\n    B. saved\n    C. greeted\n    D. stopped\n\n4. (Cloze)\n    A. could\n    B. had\n    C. needed\n    D. wanted\n\n5. (Cloze)\n    A. fail\n    B. fall\n    C. feel\n    D. fight\n\n6. (Cloze)\n    A. weak\n    B. heavy\n    C. clear\n    D. absent\n\n7. (Cloze)\n    A. soon\n    B. even\n    C. also\n    D. never\n\n8. (Cloze)\n    A. staying\n    B. living\n    C. lying\n    D. working\n\n9. (Cloze)\n    A. And\n    B. Then\n    C. Or\n    D. So\n\n10. (Cloze)\n    A. Followed\n    B. chose\n    C. picked\n    D. believed\n\n## III. 阅读理解 (共20分)\n\n**A**\nWe have twenty minutes' rest between classes. Look! Most of us are playing during the rest time. Some students are on the playground. They are having a basketball game. Oh! A boy is running with a ball. And another is trying to stop him. They are so cool. And there are some girls watching the game. Some students are in the classroom. They are talking. A few of them are reading or doing homework. Look! A girl is looking at the birds in a tree in front of the classroom. She must be thinking of something interesting because she is smiling. What are the teachers doing? Do you know? Some of them are working in the office, and some are talking with students. Everyone is busy with his or her things. Busy and happy!\n\n1. Where are some students having a game?\n    A. In the classroom.\n    B. In front of the classroom.\n    C. On the playground.\n    D. \n\n2. A girl is looking at the birds. She is _____.\n    A. happy\n    B. busy\n    C. interesting\n    D. \n\n3. What are the teachers doing?\n    A. Working or talking with students.\n    B. Having a basketball game.\n    C. Playing with the students.\n    D. \n\n4. There are _____ students in the classroom.\n    A. no\n    B. some\n    C. few\n    D. \n\n5. The passage is mainly about _____.\n    A. students\n    B. a basketball game\n    C. rest time\n    D. \n\n**B**\nThe largest animal ever to live on Earth is the blue whale. It weighs about 30 tons—more than 24 big elephants. It is more than 30 metres long. A new baby whale weighs as much as a big elephant.\nCats won't die if they fall off very high places because they can turn themselves up the right way so as to keep their bodies safe. One cat fell off 32 floors onto the street, but it was just hurt a little.\nA bear can run as fast as a horse.\nA new-born panda is smaller than a mouse and weighs about 100 grams.\nElephants are the most careful animals in their love. A male elephant may show his lady love for up to three years until the female elephant takes his love. They often show their love by touching each other's body.\nUsually, wolves do not hurt people. For years a Canadian newspaper says that they would give anyone a lot of money if he or she could show that a wolf could hurt a person. But nobody could do that. Wolves do not usually go together though they may do this in winter and they only hurt people at an unusual time.\n\n6. How much does a new-born blue whale weigh?\n    A. About 10 tons.\n    B. As much as a baby elephant.\n    C. About 80 tons.\n    D. About 3 tons.\n\n7. A bear can run _____ people think they can.\n    A. faster than\n    B. slower than\n    C. as fast as\n    D. as slowly as\n\n8. A male elephant won't stop following a female elephant to _____ until the female elephant takes his love.\n    A. fight with the baby elephant\n    B. ask the lady elephant to help him\n    C. show his love for a long time\n    D. find food together with him\n\n9. A wolf won't hurt people except _____.\n    A. in winter\n    B. at an unusual time\n    C. in a group\n    D. that it is happy\n\n10. How many kinds of animals are mentioned in this passage?\n    A. Five.\n    B. Six.\n    C. Seven.\n    D. Eight.\n\n## IV. 选词填空 (共10分)\n\n**Word Bank:** knife, nine, Russia, hundred, good\n\n1. David finds ____________________ of animals on the hill when he goes to fly kites.\n\n2. Our new term usually begins in September. It's the ____________________ month of a year.\n\n3. Two ____________________ are going to visit our school this week.\n\n4. Look! There are some ____________________ on the table. Be careful!\n\n5. The garden is the ____________________ place to grow flowers and trees.\n\n## V. 书面表达 (本题15分)\n\n假如你是某校八(2)班的班长张丽, 请根据下表内容给老师写一封信, 推荐 Wilson 为2022年“校园之星”的人选。\n\n| 项目 | 内容 |\n| :--- | :--- |\n| 学习 | 勤奋好学, 成绩优秀; 擅长做实验 |\n| 品德 | 友好善良; 乐于助人; 爱好广泛; 课余生活丰富…… |\n| 事迹 | 上周日去老年公寓…… |\n\n要求: 1. 条理清楚, 语意连贯; 2. 紧扣主题, 适当发挥; 3. 书信格式, 标点正确, 80词左右, 信的开头和结尾已写好, 不计入总词数。\n\nDear Mr. Chen,\nI would like to recommend Wilson for \"the Star of 2022\" in our school.\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\n________________________________________________________________________________\n\nWe all think Wilson should get the award. We look forward to hearing from you soon.\n\nYours sincerely,\nZhang Li\n","proofread_notes":["The total score (80 points) was calculated based on the points allocated to each section.","Reading Comprehension (Passage A): Questions 1-5 originally had only three options (A, B, C). A blank option D has been added to each for layout consistency.","Writing (Section V): The instruction states the writer's name is '张丽' (Zhang Li), but the provided closing was signed 'Wu Xiang'. The signature has been corrected to 'Zhang Li' to match the prompt.","Source Paper Quality: The original exam paper contains several questions with potential flaws that have been preserved for authenticity:","  - I-4: The question has one blank, but the options are formatted as pairs of words, creating ambiguity.","  - I-11: All provided options are grammatically incorrect for the phrase 'on my way home'. Options A and C are identical.","  - II-1 & II-5: The sentence structures in the cloze passage are awkward or ungrammatical (`I __1__ bad could come...`, `...saw my hero __5__ a weak man`).","  - IV (选词填空): The task requires changing the form of the given words (e.g., `knife` to `knives`, `good` to `best`), but this is not explicitly stated in the instructions."],"set_number":14,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_14\\page_024.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_14\\page_025.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":41},{"step":2,"name":"verify","items":41,"check_passed":false,"issues_count":5},{"step":3,"name":"polish","items":41}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T14:15:18.941030+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
