<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第14套","exam_meta":{"full_score_text":"满分80分","time_text":""},"sections":[{"section_title":"I. 单项选择 (共15分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"John often asks his teacher _____ help.","options":{"A":"to","B":"with","C":"for","D":"on"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查固定搭配。句意为“约翰经常向他的老师求助”。在英语中，表达“请求”或“寻求”某物，常用`ask for sth.`这一结构。而`ask sb. for sth.`意为“向某人请求某物”。在本句中，John (某人) 向 his teacher (某人) 请求 help (某物)，因此需要使用介词`for`。其他选项均不符合该搭配习惯。","knowledge_expansion_md":"### `ask` 的用法拓展\n\n动词 `ask` 有多种常见搭配，表达不同含义，需要重点区分：\n\n1.  **`ask for sth.`**: 请求/寻求某物。\n    *   *e.g., The child is asking for a toy.* (那个孩子在要一个玩具。)\n2.  **`ask sb. for sth.`**: 向某人请求某物。\n    *   *e.g., If you need money, you can ask your parents for some.* (如果你需要钱，可以向你父母要一些。)\n3.  **`ask sb. to do sth.`**: 请求/要求某人做某事。\n    *   *e.g., The teacher asked me to answer the question.* (老师叫我回答这个问题。)\n4.  **`ask (sb.) a question`**: 问（某人）一个问题。\n    *   *e.g., May I ask you a question?* (我可以问你一个问题吗？)\n\n**易错点**：注意区分 `ask for help` (请求帮助，help为名词) 和 `ask sb. to help` (请某人帮忙，help为动词原形)。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"在英语中，当我们想表达“请求”或“寻求”某个东西时，动词 'ask' 后面通常会跟哪个介词？","hint":"回忆一下“请求建议”(ask for advice) 或者“要钱”(ask for money) 这些常用短语。","takeaway":"`ask for sth.` 是一个固定搭配，表示“请求/寻求某物”。"},{"question":"那么，要表达“请求帮助”，我们应该用哪个词组？","hint":"将上面结构中的 `sth.` (某物) 替换成 `help` (帮助)。","takeaway":"`ask for help` 就是“请求帮助”的正确表达。"}]},{"title":"介词辨析","steps":[{"question":"我们来看选项A 'to'。`ask sb. to do sth.` 是一个正确的结构，但这里的 'help' 是动词吗？","hint":"在 `ask his teacher for help` 中，`help` 是一个名词，指“帮助”这件事。","takeaway":"此处的 `help` 是名词，所以 `ask...to help` 的结构不适用。"},{"question":"再看选项B 'with'。它通常表示“和...一起”或“用...”。句子“John asks his teacher with help”意思通顺吗？","hint":"翻译一下：“约翰用帮助来请求他的老师。” 这听起来很奇怪。","takeaway":"介词 `with` 在此会造成语义不通，不符合表达习惯。"}]},{"title":"语境理解","steps":[{"question":"这句话描述了一个什么样的场景？John 和他的老师之间发生了什么？","hint":"John 是学生，当他遇到困难时，他会怎么做？","takeaway":"这是一个学生向老师寻求帮助的常见场景。"},{"question":"在这个场景中，学生向老师“要”帮助，这个“为了得到...”的意图，用哪个介词最能体现出来？","hint":"介词 `for` 常常带有“为了...”或“寻求...”的目的性。","takeaway":"介词 `for` 准确地表达了“为了寻求帮助”这一目的，最符合语境。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"I couldn't do it _____ your great help. Thanks a lot!","options":{"A":"with","B":"without","C":"for","D":"to"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查介词在语境中的应用。句意为：“没有你的巨大帮助，我不可能完成它。非常感谢！”后半句的“Thanks a lot!”（非常感谢）是解题的关键，它表明“你的帮助”是事情成功的必要条件。前半句“I couldn't do it”是一个否定句，意为“我做不到”。因此，整个句子的逻辑是“（如果）没有你的帮助，我就做不到”。介词`without`意为“没有”，恰好符合此处的逻辑关系。若使用`with`（有），则句意变为“有了你的帮助，我做不到”，与后文的感谢自相矛盾。","knowledge_expansion_md":"### `with` 和 `without` 的对立用法\n\n`with` 和 `without` 是一对反义介词，常用于表达条件、伴随等情况，理解它们的对立关系是关键。\n\n1.  **`with`**: 表示“有；带有；使用；和...一起”。\n    *   *e.g., With your support, we can succeed.* (有了你的支持，我们就能成功。) - 表示条件\n    *   *e.g., He came into the room with a book in his hand.* (他手里拿着一本书走进房间。) - 表示伴随\n\n2.  **`without`**: 表示“没有”。\n    *   *e.g., You can't make an omelet without breaking eggs.* (不打破鸡蛋就做不成煎蛋卷。) - 表示条件\n    *   *e.g., He left without saying goodbye.* (他没说再见就走了。) - 表示伴随\n\n### 含蓄虚拟条件句\n\n本题的句子 `I couldn't do it without your great help.` 是一个典型的由介词短语 `without...` 引导的**含蓄虚拟条件句**。它相当于一个完整的条件状语从句：*If I hadn't had your great help, I couldn't have done it.* (如果当时没有你的巨大帮助，我就不可能完成它了。) 在小升初阶段，我们不需要掌握完整的虚拟语气语法，但要能理解这种“如果没有...就会...”的逻辑关系。","socratic_tracks":[{"title":"逻辑推理","steps":[{"question":"看到句子末尾的“Thanks a lot!”，你觉得说话人想表达什么情绪？","hint":"他在感谢对方。","takeaway":"说话人是在对“你的帮助”表达感激之情。"},{"question":"既然是感谢，那么“your great help”（你的巨大帮助）对“do it”（做成这件事）是起到了积极作用还是消极作用？","hint":"当然是积极作用，是必不可少的。","takeaway":"“你的帮助”是事情成功的关键。"},{"question":"“I couldn't do it”是“我做不到”。要把“你的帮助”和“我做不到”联系起来，表达出“你的帮助”是关键，中间应该填“有”还是“没有”？","hint":"应该是“没有”你的帮助，我才“做不到”。","takeaway":"此处的逻辑是“（如果）没有...，就（会）...”，所以需要表示“没有”的词。"}]},{"title":"介词辨析","steps":[{"question":"让我们试试填入A选项 'with'。句子变成 'I couldn't do it with your great help.' 这句话是什么意思？","hint":"翻译过来是：“有了你的巨大帮助，我做不到。”","takeaway":"使用 `with` 会导致句子逻辑矛盾，与后文的感谢不符。"},{"question":"现在试试填入B选项 'without'。句子变成 'I couldn't do it without your great help.' 这句话又是什么意思？","hint":"翻译过来是：“没有你的巨大帮助，我做不到。”","takeaway":"使用 `without` 强调了“帮助”的必要性，与后文的感谢逻辑一致。"}]},{"title":"句型结构","steps":[{"question":"“I couldn't do it”这部分，你觉得它是在描述一个过去真实发生的事实，还是在做一个假设？","hint":"既然事情已经做完了（所以才感谢），那么“couldn't do it”应该是一种与事实相反的假设。","takeaway":"`couldn't` 在这里表达了一种虚拟的、与事实相反的可能性。"},{"question":"那么，这个假设的条件是什么？哪个介词可以引出这样一个表示“缺乏某种条件”的短语？","hint":"比如“没有水，鱼会死” (Without water, fish would die)。","takeaway":"`without` + 名词/名词短语可以用来引出一个含蓄的否定条件。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"I carried the bowl with both hands _____ so that I wouldn't break it.","options":{"A":"carefully","B":"happily","C":"quickly","D":"carelessly"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查副词的词义辨析和语境逻辑。句意为：“我用双手_____地端着碗，这样我就不会打碎它了。”句中的`so that I wouldn't break it`是一个目的状语从句，解释了前半句动作的目的，即“为了不打碎它”。为了实现这个目的，端碗的动作方式必须是小心的、谨慎的。四个选项都是副词，用来修饰动词`carried`（端着）。选项A `carefully`（小心地）正好符合这个逻辑。选项B `happily`（开心地）和C `quickly`（快速地）与目的无直接关系，而选项D `carelessly`（粗心地）则与目的完全相反。","knowledge_expansion_md":"### 目的状语从句 `so that`\n\n`so that` 引导的从句用来解释主句动作的目的，意为“为了；以便于”。从句中常使用情态动词，如 `can`, `could`, `will`, `would`, `may`, `might`。\n\n*   *e.g., Speak louder so that everyone can hear you.* (大声点说，这样大家都能听见你。)\n*   *e.g., He got up early so that he could catch the first bus.* (他起得很早，为的是能赶上第一班公交车。)\n\n### 副词的作用与构成\n\n*   **作用**：副词（adverb）在句中主要用来修饰动词、形容词、其他副词或整个句子，说明动作或状态的特征，如方式、地点、时间、程度等。本题中的四个选项都是**方式副词**，回答了 `how` (怎样地) 的问题。\n*   **构成**：很多副词由“形容词 + -ly”构成，如 `careful` → `carefully`，`quick` → `quickly`。\n\n### 反义词辨析\n\n在词汇题中，注意 `carefully` (小心地) 和 `carelessly` (粗心地) 这类反义词。准确理解词义是解题的关键，有时一个词的前缀或后缀就能完全改变其含义。","socratic_tracks":[{"title":"逻辑与语境","steps":[{"question":"句子中 `so that I wouldn't break it` 这部分告诉了我们什么信息？","hint":"它解释了前面动作的目的：不想把碗打碎。","takeaway":"这部分是目的状语从句，揭示了动作的目的。"},{"question":"如果你的目标是“不打碎碗”，你应该用什么样的方式去端碗？","hint":"应该非常小心、谨慎。","takeaway":"动作的方式必须服务于其目的。"},{"question":"四个选项中，哪个词最能描述这种“小心、谨慎”的方式？","hint":"`carefully` 就是“小心地”。","takeaway":"`carefully` 是唯一符合该目的逻辑的副词。"}]},{"title":"词义辨析","steps":[{"question":"我们看看D选项 `carelessly`，它的意思是“粗心地”。如果用它填空，句子“我粗心地端着碗，为了不打碎它”讲得通吗？","hint":"这显然是自相矛盾的。","takeaway":"`carelessly` 与目的从句的含义正好相反，是逻辑错误。"},{"question":"再看B `happily` (开心地) 和C `quickly` (快速地)。端碗时的心情或者速度，和“不打碎碗”有必然的联系吗？","hint":"心情没关系。快速地端碗反而可能更容易打碎。","takeaway":"`happily` 和 `quickly` 与句子的核心逻辑关联不大，甚至 `quickly` 可能与目的背道而驰。"}]},{"title":"语法功能","steps":[{"question":"题干中横线部分需要一个什么词性的词？它在句子里起什么作用？","hint":"它在动词 `carried` 后面，应该是用来修饰这个动作的。","takeaway":"空格处需要一个副词来修饰动词 `carried`，说明端碗的方式。"},{"question":"选项A, B, C, D 都是以 `-ly` 结尾，它们通常是什么词性？","hint":"它们都是副词。","takeaway":"这四个选项都是由形容词加 `-ly` 构成的副词，在语法上都可以修饰动词。"},{"question":"既然语法上都可行，我们选择的最终依据是什么？","hint":"就要看哪个词的意思最符合整个句子的逻辑。","takeaway":"在语法都正确的情况下，词义和语境逻辑是解题的关键。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"—Are you _____ of the dark?\n—Yes, so I always go to sleep with my bedroom lights on.","options":{"A":"worry; on","B":"worried; of","C":"afraid; on","D":"fear; off"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题是一个情景对话，考查固定搭配和语境理解。第一个空考查表达“害怕”的短语。`be afraid of...` 是固定搭配，意为“害怕……”，符合题意。`be worried about` 意为“为……担心”，介词不符。`Are you fear of...` 语法错误。因此第一个空应填`afraid`。第二个空根据回答“Yes”和前半句“害怕黑暗”来判断。既然害怕黑暗，那么睡觉时就会采取措施来消除恐惧，所以应该是“开着灯”睡觉。`with my bedroom lights on` 意为“在卧室灯开着的情况下”，其中 `on` 是副词，表示“开着”的状态。因此，结合两个空，选项C是唯一正确的答案。","knowledge_expansion_md":"### 表达“害怕”的多种方式\n\n1.  **`be afraid of sth./doing sth.`**: 害怕某事/做某事 (最常用)。\n    *   *e.g., She is afraid of spiders.* (她害怕蜘蛛。)\n2.  **`be scared of sth./doing sth.`**: 害怕某事/做某事 (与 `afraid of` 意思相近)。\n    *   *e.g., I'm scared of speaking in public.* (我害怕在公共场合演讲。)\n3.  **`fear sth.`**: `fear` 作及物动词，直接跟宾语。\n    *   *e.g., Do you fear the dark?* (你害怕黑暗吗？)\n4.  **`have a fear of sth.`**: `fear` 作名词。\n    *   *e.g., He has a great fear of heights.* (他有严重的恐高症。)\n\n### `with` 复合结构\n\n`with + 名词 + (to be) + 形容词/副词/介词短语/分词` 是一种常见的伴随状语结构，用来补充说明主句动作发生时伴随的状态或情况。\n\n*   *e.g., He fell asleep with the TV on.* (他开着电视睡着了。)\n*   *e.g., She stood there with tears in her eyes.* (她站在那里，眼里含着泪水。)\n\n### `on` 和 `off` 作为状态副词\n\n*   `on` 可以表示“接通；开着”。 *e.g., The light is on.*\n*   `off` 可以表示“断开；关着”。 *e.g., Please turn the radio off.*","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"当你想用英语说“我害怕某样东西”时，你会想到哪个以 'be' 动词开头的形容词短语？","hint":"想想“我害怕蛇”怎么说？'I am ... snakes.'","takeaway":"`be afraid of...` 是表达“害怕……”最常用的固定搭配。"},{"question":"让我们看看其他选项。`worry` 和 `fear` 为什么不适合填在第一个空里？","hint":"`worry` 后面一般跟 `about`。`fear` 是动词或名词，放在 `Are you...` 后面语法不对。","takeaway":"必须使用符合 `be + 形容词 + of` 结构的词，只有 `afraid` 符合。"}]},{"title":"语境逻辑","steps":[{"question":"回答是 'Yes, so I always go to sleep with my bedroom lights on.' 这句话告诉我们什么信息？","hint":"回答者确实害怕黑暗，所以他开着灯睡觉。","takeaway":"回答者的行为（开灯睡觉）证实了他对黑暗的恐惧。"},{"question":"既然回答者是开着灯睡觉，那么第二个空应该填 `on` 还是 `off`？","hint":"`on` 表示“开着”，`off` 表示“关着”。","takeaway":"`on` 表示“开着”的状态，符合语境。"},{"question":"结合第一步和第二步的分析，哪个选项同时满足了“害怕”的正确表达和“开灯”的语境？","hint":"第一个空是 `afraid`，第二个空是 `on`。","takeaway":"只有选项C `afraid; on` 完全符合对话的语法和逻辑。"}]},{"title":"语法结构","steps":[{"question":"来看 'with my bedroom lights on' 这个短语。你觉得它在句子里是什么成分？","hint":"它描述了“睡觉”时的一种状态。","takeaway":"这是一个 `with` 引导的复合结构，作伴随状语。"},{"question":"在这个结构 `with + 名词 + ...` 中，最后这个词 `on` 是什么词性？它在描述 `lights` 的什么？","hint":"它描述了灯的状态，是“开着”的。它像一个形容词，但又是 `on`。","takeaway":"这里的 `on` 是一个副词，但起到了形容词的作用，描述名词 `lights` 的状态。"},{"question":"你能再想一个类似的例子吗？比如“他闭着眼睛听音乐”。","hint":"He listened to the music with his eyes closed.","takeaway":"`with + 名词 + 状态` 结构是表达伴随情况的常用句型。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"—I called you yesterday evening, but you were not in.\n—Sorry, I _____ in the shop with my mother.","options":{"A":"am","B":"will be","C":"was","D":"have been"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"该对话的时间状语是 `yesterday evening`（昨天晚上），这是一个明确的过去时间点。因此，句子的谓语动词需要使用一般过去时。选项 A `am` 是一般现在时，选项 B `will be` 是一般将来时，选项 D `have been` 是现在完成时，都不符合语境。只有选项 C `was` 是第一人称单数 `I` 对应的一般过去时形式，表示“当时是……”，符合题意。","knowledge_expansion_md":"### 一般过去时 vs. 现在完成时\n\n**一般过去时 (Simple Past Tense)**\n- **用法**: 表示在过去某个具体时间点发生并完成的动作或存在的状态。\n- **标志词**: `yesterday`, `last night/week/year`, `... ago`, `in 1999`, `just now` 等。\n- **例句**: `I visited my grandparents last weekend.` (我上周末去看了我的祖父母。)\n\n**现在完成时 (Present Perfect Tense)**\n- **用法**: \n  1. 表示过去发生但对现在有影响或结果的动作。\n  2. 表示从过去开始并持续到现在的动作或状态。\n- **标志词**: `already`, `yet`, `ever`, `never`, `for...`, `since...` 等。\n- **例句**: `I have finished my homework.` (我已经做完作业了。——强调现在可以玩了)\n\n**易错点**: 当句子中出现明确的过去时间状语时，不能使用现在完成时，必须使用一般过去时。例如，错误：`I have seen him yesterday.` 正确：`I saw him yesterday.`","socratic_tracks":[{"title":"动词时态判断","steps":[{"question":"对话中提到了一个什么具体的时间？","hint":"请仔细阅读第一句话的结尾部分。","takeaway":"对话的时间背景是 “yesterday evening”（昨天晚上）。"},{"question":"“yesterday evening” 指的是过去、现在还是将来？","hint":"“yesterday” 是“昨天”的意思。","takeaway":"这是一个明确的过去时间点。"},{"question":"既然是描述过去某个特定时间点发生的事情，我们应该用什么时态的动词？","hint":"思考一下 be 动词描述过去状态时应该用什么形式。","takeaway":"描述过去特定时间发生的事，应使用一般过去时。"}]},{"title":"选项辨析","steps":[{"question":"选项 A “am” 是什么时态？通常用在什么情况下？","hint":"想想 “I am a student.” 这句话。","takeaway":"“am” 是一般现在时，用于描述当前的状态或事实。"},{"question":"选项 B “will be” 是什么时态？表示什么时间？","hint":"“will” 这个词通常和什么时间有关？","takeaway":"“will be” 是一般将来时，用于描述将来的事情。"},{"question":"选项 D “have been” 是什么时态？它和一般过去时有什么区别？","hint":"现在完成时强调的是过去动作对现在的影响，或者动作持续到现在，通常不和具体过去时间点连用。","takeaway":"“have been” 是现在完成时，不用于指明具体过去时间点的动作。"}]},{"title":"上下文逻辑","steps":[{"question":"第一个人说“我昨天晚上给你打电话，但你不在家”，这是在描述什么时候的事？","hint":"注意 “called” 和 “were” 这两个动词的形式。","takeaway":"第一个人的话描述的是过去发生的事情。"},{"question":"第二个人回答“对不起，我……” 是在解释为什么当时不在家。这个解释应该发生在什么时间？","hint":"解释的原因应该和打电话的时间是同步的。","takeaway":"解释也应该是在描述昨天晚上那个时间点的情况。"},{"question":"所以，为了和上文的 “yesterday evening” 保持时态一致，空格处应该填入一个表示过去状态的词。哪个选项符合？","hint":"在 am, will be, was, have been 中，哪个是 be 动词的过去式？","takeaway":"只有 “was” 是一般过去时，符合上下文的逻辑和时态要求。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"汤姆的妈妈在街上遇见了一位老朋友。(Tom's mother met an old friend of _____ in the street. She at once stopped _____.)","options":{"A":"her; walking","B":"her; to walk","C":"hers; walking","D":"hers; to walk"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考察两个知识点：双重所有格和 `stop` 的用法。\n1.  第一个空：“她的一位老朋友”的英语表达是 `an old friend of hers`。这是双重所有格结构，`of` 后面必须使用名词性物主代词（`mine`, `yours`, `his`, `hers` 等），因此排除 A 和 B。\n2.  第二个空：考察 `stop doing sth.` 和 `stop to do sth.` 的区别。\n    - `stop walking` 意为“停止走路”（停止正在进行的动作）。\n    - `stop to walk` 意为“停下来去走路”（停下正在做的事，为了开始另一件事）。\n3.  根据语境“在街上遇见了一位老朋友”，她“立刻停下来”，这里的“停下来”是为了进行下一步的社交活动，比如和朋友走向同一个方向或走向朋友。因此，用不定式 `to walk` 表示目的，即“停下来为了走”，逻辑是通顺的。所以选择 D。","knowledge_expansion_md":"### 1. 双重所有格 (Double Possessive)\n- **结构**: `a/an/some/this/that + 名词 + of + 名词性物主代词`。\n- **名词性物主代词**: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n- **含义**: 强调“……的众多……中的一个/一些”，等同于 `one of my/your/his... + 名词`。\n- **例句**: `a friend of mine` = `one of my friends` (我的一个朋友)。\n- **注意**: 不能与形容词性物主代词（`my`, `your`, `her` 等）混用。\n\n### 2. `stop doing` vs. `stop to do`\n- **`stop doing sth.`**: 停止做某事（停止正在进行的动作）。`doing` 是动名词，作 `stop` 的宾语。\n  - **例句**: `The baby stopped crying.` (婴儿停止了哭泣。)\n- **`stop to do sth.`**: 停下来去做某事（停止当前动作，目的是做另一件事）。`to do` 是不定式，作目的状语。\n  - **例句**: `He stopped to drink some water.` (他停下来去喝了点水。)\n- **易错点**: 混淆两者含义是常见错误。解题关键是判断 `stop` 后面的动作是“被停止的动作”还是“要做的目的”。","socratic_tracks":[{"title":"双重所有格","steps":[{"question":"我们想表达“她的一个朋友”，如果用 `her friends`，可以说 `one of her friends`。题干中用的是 `an old friend of _____` 结构，你知道这是什么语法现象吗？","hint":"这种结构中，of 后面需要一个代词来表示“她的”，但不能用 `her`。","takeaway":"这叫双重所有格，of 后面要用名词性物主代词。"},{"question":"那么，对应人称代词 `she`，它的名词性物主代词是什么？","hint":"“这本书是她的”可以说 “The book is hers.”","takeaway":"对应的名词性物主代词是 `hers`。"}]},{"title":"stop 的用法辨析","steps":[{"question":"动词 `stop` 后面可以跟 `doing` 和 `to do` 两种形式，你知道它们的意思有什么不同吗？","hint":"一个是“停止正在做的事”，另一个是“停下来，为了去做另一件事”。","takeaway":"`stop doing` 是停止做某事，`stop to do` 是停下来去做某事。"},{"question":"想象一个场景：你在路上走，突然看到一家冰淇淋店，你停下来买冰淇淋。用英语怎么说 “stopped...”？","hint":"你停下来的“目的”是买冰淇淋。表示目的应该用哪种形式？","takeaway":"应该说 `stopped to buy ice cream`。"},{"question":"回到题目，汤姆妈妈遇见朋友后，“立刻停下来”。这里的“走(walk)”是她停下来的目的，还是她停止的动作？","hint":"遇见朋友后，她停下当前的事，是为了进行新的活动（如和朋友一起走）。因此，“走”是一个目的。","takeaway":"因此，这里应该使用不定式 `to walk` 来表示目的。"}]},{"title":"语境逻辑推理","steps":[{"question":"如果选 C，句子 “She at once stopped walking” 是什么意思？这个场景合理吗？","hint":"`stop doing` 是停止正在做的事。","takeaway":"意思是“她立刻停止了走路”。这个场景是合理的，她停下脚步和朋友说话。"},{"question":"如果选 D，句子 “She at once stopped to walk” 是什么意思？这个场景合理吗？","hint":"`stop to do` 是停下来去做另一件事。","takeaway":"意思是“她立刻停下来，为了去走路”。这个场景也是合理的，比如她停下正在做的事（如骑车、看橱窗），为了和朋友一起走。"},{"question":"两个选项在不同情景下都可能成立，为什么 D 是更优选项？","hint":"不定式作目的状语是 `stop` 用法的一个重要考点。遇见朋友后，人的行为通常是带有目的性的，`stop to do` 恰好能表达这种目的。","takeaway":"使用 `to walk` 表示她停下来是为了进行一项新的活动，这在逻辑上通顺，并且考察了不定式作目的状语这一重要语法点。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"The little cat miaowed all night. It _____ a baby's cry.","options":{"A":"sounds like","B":"sounds","C":"sounded like","D":"sounded"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"首先，根据第一句话 “The little cat miaowed all night”，动词 `miaowed` (喵喵叫) 是一般过去时，表明整个事件发生在过去。因此，第二句话的动词也应该使用一般过去时，可以排除选项 A 和 B。\n其次，本题考察感官动词 `sound` 的用法。当 `sound` 后面接名词或名词短语（如此处的 “a baby's cry”）时，需要加上介词 `like`，构成 `sound like` 结构，意为“听起来像……”。如果 `sound` 后面接形容词，则不需要 `like`，例如 “It sounded strange” (它听起来很奇怪)。\n综上所述，既要满足过去时态，又要满足 `sound like + 名词` 的结构，所以正确答案是 `sounded like`。","knowledge_expansion_md":"### 感官连系动词 (Sensory Linking Verbs)\n\n这类动词用于连接主语和表语，描述主语给人的感觉，主要包括 `look` (看起来), `sound` (听起来), `smell` (闻起来), `taste` (尝起来), `feel` (感觉起来)。\n\n#### 用法规则:\n1.  **`感官动词 + 形容词`**: 动词后直接跟形容词，修饰主语。\n    - `You look happy today.` (你今天看起来很高兴。)\n    - `The music sounds beautiful.` (这音乐听起来很美。)\n\n2.  **`感官动词 + like + 名词/代词/从句`**: 当后面跟的是名词、代词或从句时，必须加上介词 `like`。\n    - `He looks like his father.` (他看起来像他父亲。)\n    - `It sounds like a good plan.` (这听起来像个好计划。)\n\n**易错点**: 忘记在名词前加 `like` 是常见错误。例如，错误地说 “It sounds a good idea.”，正确应为 “It sounds like a good idea.”。","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"请看题干的第一句话 “The little cat miaowed all night.”，这句话描述的是什么时候发生的事情？","hint":"注意动词 `miaowed` 是 `miaow` 的什么形式？","takeaway":"`miaowed` 是过去式，所以这句话描述的是过去发生的事。"},{"question":"第二句话 “It _____ a baby's cry.” 是对第一句话中猫叫声的描述，那么第二句话应该用什么时态？","hint":"描述同一件过去的事情，时态应该保持一致。","takeaway":"第二句话也应该使用一般过去时。"},{"question":"根据这个时态判断，我们可以排除哪些选项？","hint":"`sounds` 和 `sounds like` 是现在时。","takeaway":"我们可以排除 A 和 B，答案在 C 和 D 之间。"}]},{"title":"sound 的用法","steps":[{"question":"动词 `sound` 的意思是“听起来”。它后面可以直接跟名词吗？比如，可以说 “It sounds a story” 吗？","hint":"想想我们说“听起来像个故事”时，英语是怎么表达的。","takeaway":"`sound` 后面不能直接跟名词，需要借助一个介词。"},{"question":"那么，当 `sound` 后面要跟一个名词（比如本题的 “a baby's cry”）时，应该在中间加上哪个词？","hint":"这个词是“像”的意思。","takeaway":"应该加上介词 `like`，构成 `sound like` 的结构。"}]},{"title":"综合应用与排除","steps":[{"question":"我们已经知道，句子需要用过去时，并且 `sound` 后面需要加 `like` 再接名词。现在我们来看看剩下的选项 C 和 D。","hint":"选项 C 是 `sounded like`，选项 D 是 `sounded`。","takeaway":"选项 C 和 D 都是过去时。"},{"question":"空格后面是 “a baby's cry”，这是一个名词短语。根据我们刚才讨论的 `sound` 的用法，C 和 D 哪个是正确的？","hint":"`sound` 后面接名词需要 `like`。","takeaway":"只有 `sounded like` 符合 `sound like + 名词` 的结构。"},{"question":"所以，结合时态和用法两方面的考虑，最终的正确答案是什么？","hint":"既是过去时，又符合 `sound like + n.` 结构。","takeaway":"正确答案是 C: `sounded like`。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"This animal eats _____ or nothing in winter. It just keeps sleeping all the time.","options":{"A":"few","B":"a few","C":"little","D":"a little"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"首先，分析修饰的对象。动物吃的是食物 (food)，这是一个不可数名词。`few` 和 `a few` 用于修饰可数名词，因此排除 A 和 B。\n其次，辨析 `little` 和 `a little`。`little` 意为“很少，几乎没有”，含否定意味；`a little` 意为“有一点”，含肯定意味。\n然后，分析语境。短语 “_____ or nothing” 意为“很少或什么都没有”，其中的 “or nothing” 强烈暗示了否定的意味。后半句 “It just keeps sleeping all the time”（它一直在睡觉）也说明这只动物在冬天几乎不吃东西。\n最后，`little or nothing` 是一个固定搭配，表示“极少，近乎于无”。因此，应选择带有否定意味的 `little`。","knowledge_expansion_md":"### `few`, `a few`, `little`, `a little` 的用法辨析\n\n这四个词都表示“少”，但用法和含义有明确区别，是考试的热点。\n\n| 修饰词   | 修饰名词类型 | 含义             | 感情色彩 | 例句                                           |\n| -------- | ------------ | ---------------- | -------- | ---------------------------------------------- |\n| **few**  | 可数名词复数 | 很少，几乎没有   | 否定     | `He has few friends.` (他几乎没什么朋友。)      |\n| **a few**| 可数名词复数 | 有一些，有几个   | 肯定     | `He has a few friends.` (他有几个朋友。)        |\n| **little**| 不可数名词   | 很少，几乎没有   | 否定     | `There is little water left.` (几乎没剩什么水了。) |\n| **a little**| 不可数名词   | 有一点，有一些   | 肯定     | `There is a little water left.` (还剩一点水。)   |\n\n#### 常见固定搭配\n- `little or nothing`: 极少，几乎没有。\n- `few or no` + 可数名词: 极少，几乎没有。例如: `There were few or no people on the street.`\n- `little by little`: 一点一点地，逐渐地。\n- `quite a few`: 相当多 (后接可数名词)。\n- `quite a little`: 相当多 (后接不可数名词，主要用于美式英语)。","socratic_tracks":[{"title":"可数与不可数","steps":[{"question":"这个动物吃东西，“eats _____”，这里的空格是用来形容“食物”的数量。你认为“食物 (food)”是可数名词还是不可数名词？","hint":"我们通常说 `some food`，而不是 `a food` 或 `many foods` (除非指不同种类的食物)。","takeaway":"在这里，“食物”是不可数名词。"},{"question":"`few`, `a few`, `little`, `a little` 这四个词中，哪些是用来修饰不可数名词的？","hint":"可以记作：`f` 开头的修饰可数名词，`l` 开头的修饰不可数名词。","takeaway":"`little` 和 `a little` 用来修饰不可数名词，因此可以排除 `few` 和 `a few`。"}]},{"title":"肯定与否定","steps":[{"question":"我们现在要在 `little` 和 `a little` 中选择。你知道它们在含义上有什么区别吗？","hint":"一个表示“几乎没有”，另一个表示“还有一点”。哪个是偏向否定的？","takeaway":"`little` 含有否定意味（很少，几乎没有），而 `a little` 含有肯定意味（有一些）。"},{"question":"看看句子后半部分 “It just keeps sleeping all the time” (它一直在睡觉)。这暗示它吃得多还是吃得少？","hint":"冬眠的动物通常不怎么进食。","takeaway":"这暗示它吃得非常少。"},{"question":"再看 “_____ or nothing” 这个短语，“or nothing” 的意思是“或者什么都没有”。这加强了肯定的意味还是否定的意味？","hint":"“什么都没有”是一种完全的否定。","takeaway":"“or nothing” 极大地加强了否定的意味。"},{"question":"综合来看，我们应该选择表示肯定意味的 `a little` 还是表示否定意味的 `little`？","hint":"整个句子的语境都是“非常少，近乎没有”。","takeaway":"应该选择含有否定意味的 `little`。"}]},{"title":"固定搭配","steps":[{"question":"在英语中，有些词语经常一起出现，形成固定搭配。你见过 “little or nothing” 这个短语吗？","hint":"它的意思是“很少或者干脆没有”。","takeaway":"`little or nothing` 是一个常见的固定搭配。"},{"question":"知道了这是一个固定搭配，是不是就可以直接选出答案了？","hint":"固定搭配就像一个词组，通常不能随意替换其中的单词。","takeaway":"是的，`little or nothing` 是固定用法，所以直接选择 `little` 即可。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"Which of the following \"ed\" has a different pronunciation from the other three?","options":{"A":"answered","B":"listened","C":"danced","D":"played"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查动词过去式-ed结尾的三种发音规则。动词词尾的发音决定了-ed的发音。A选项answered(/d/)、B选项listened(/d/)和D选项played(/d/)的词尾分别是元音、浊辅音/n/和元音，属于浊音或元音，因此-ed发/d/。C选项danced的词尾是清辅音/s/，因此-ed发/t/。所以，danced的发音与其他三者不同。","knowledge_expansion_md":"动词过去式-ed结尾有三种发音规则，取决于动词原形末尾的音素：\n1.  在清辅音（/p/, /k/, /f/, /s/, /ʃ/, /tʃ/等）后，-ed发/t/。例如：`stopped`, `looked`, `laughed`, `danced`。\n2.  在浊辅音（/b/, /g/, /v/, /z/, /ʒ/, /dʒ/, /l/, /m/, /n/, /ŋ/等）和元音后，-ed发/d/。例如：`loved`, `called`, `played`, `answered`。\n3.  在/t/和/d/音后，-ed发/ɪd/或/əd/。例如：`wanted`, `needed`, `decided`。\n\n**易错点**：学生容易根据字母而非发音来判断。例如，`laugh`结尾是字母`gh`，但发音是/f/（清辅音），所以`laughed`发/t/音。","socratic_tracks":[{"title":"-ed发音规则","steps":[{"question":"动词过去式的-ed结尾有几种不同的发音？","hint":"试着读一下 wanted, played, worked 这三个词，感受一下它们结尾的发音有什么不同？","takeaway":"-ed结尾有/t/, /d/, /ɪd/三种发音。"},{"question":"这三种发音分别在什么情况下使用？判断的依据是什么？","hint":"关键是看动词原形末尾的音是清辅音、浊辅音还是元音。","takeaway":"-ed的发音取决于动词原形末尾音标的清浊属性。"},{"question":"我们来判断一下 dance 这个词末尾的音标是什么？是清辅音还是浊辅音？","hint":"发/s/音时，把手放在喉咙上，感受一下声带是否振动。","takeaway":"dance以清辅音/s/结尾，所以-ed发/t/。"}]},{"title":"选项逐一分析","steps":[{"question":"我们来读一下 A 选项 answered，它的动词原形 answer 以什么音结尾？","hint":"answer 的最后一个音是 /r/，这是一个元音。","takeaway":"answer以元音结尾，所以-ed发/d/。"},{"question":"用同样的方法，分析一下 B 选项 listened 和 D 选项 played 的词尾发音。","hint":"listen 以 /n/ 结尾，play 以 /eɪ/ 结尾，它们是浊辅音还是元音？","takeaway":"listened 和 played 分别以浊辅音和元音结尾，所以-ed都发/d/。"},{"question":"现在对比 A, B, D 和 C，哪个发音是不同的？","hint":"A, B, D 的-ed都发/d/，而 C 的-ed发/t/。","takeaway":"C选项的danced发音与众不同，是本题的答案。"}]},{"title":"清浊辅音辨析","steps":[{"question":"你知道如何区分清辅音和浊辅音吗？有什么小技巧？","hint":"试着把手放在喉咙上，发音时感受一下声带是否振动。","takeaway":"发浊辅音时声带振动，发清辅音时声带不振动。"},{"question":"让我们来试试 dance 结尾的 /s/ 音和 listen 结尾的 /n/ 音，哪个让你的声带振动了？","hint":"发/s/时像蛇一样嘶嘶作响，发/n/时像在说“嗯”。","takeaway":"/n/是浊辅音（声带振动），/s/是清辅音（声带不振动）。"},{"question":"根据这个“清配清，浊配浊”的原则，清辅音/s/后面应该跟/t/还是/d/？","hint":"/t/是清辅音，/d/是浊辅音。","takeaway":"清辅音/s/后面应该跟清辅音/t/，这叫“清清上口”。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"Goldfish don't know _____ to them three seconds ago.","options":{"A":"what happens","B":"what is happening","C":"what happen","D":"what happened"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查宾语从句中的时态选择。句子的主干是 \"Goldfish don't know...\"，后面跟一个由 \"what\" 引导的宾语从句。从句中有一个明确的过去时间状语 \"three seconds ago\"（三秒钟前），它表示从句描述的动作发生在过去。因此，从句的谓语动词需要使用一般过去时。四个选项中，只有 D 选项 \"what happened\" 是一般过去时，故为正确答案。","knowledge_expansion_md":"本题涉及宾语从句的时态问题。宾语从句的时态通常受主句时态影响（主从时态一致），但当从句中有自身明确的时间状语时，从句的时态由其自身的时间状语决定，不受主句时态的限制。\n\n1.  **从句有独立时间状语**：从句时态由自身时间状语决定。\n    *   `He tells me that he went to Beijing yesterday.` (主句现在时，从句过去时)\n    *   `I know what will happen tomorrow.` (主句现在时，从句将来时)\n2.  **从句表述的是客观真理或普遍事实**：从句永远用一般现在时。\n    *   `The teacher told us that the earth moves around the sun.` (主句过去时，从句现在时)\n3.  **无独立时间状语且非客观真理**：遵循主从时态一致原则。主句为现在时，从句可用任何所需时态；主句为过去时，从句必须用相应的过去时态（过去完成时、一般过去时、过去将来时等）。","socratic_tracks":[{"title":"宾语从句时态","steps":[{"question":"这个句子中，金鱼不知道的“内容”是什么？这个“内容”在句子结构中充当什么成分？","hint":"\"don't know\" 后面跟着一个由 \"what\" 引导的句子，这个句子是 \"know\" 的...？","takeaway":"\"what ... ago\" 是动词 \"know\" 的宾语从句。"},{"question":"宾语从句中的动作发生在什么时候？你是从哪个词看出来的？","hint":"句末有一个表示时间的词组 \"three seconds ago\"。","takeaway":"时间状语 \"three seconds ago\" 明确指出动作发生在过去。"},{"question":"既然动作发生在过去，那么宾语从句应该用什么时态？","hint":"描述过去发生的动作，我们通常用一般...时。","takeaway":"宾语从句中含有明确的过去时间状语，因此要用一般过去时。"}]},{"title":"关键词“ago”","steps":[{"question":"\"ago\" 这个词是什么意思？它通常和什么时态一起使用？","hint":"比如 \"I saw him two days ago.\" 这句话是什么时态？","takeaway":"\"ago\" 意为“...以前”，是一般过去时的标志性时间状语。"},{"question":"看到 \"three seconds ago\"，我们应该立刻想到从句的动词要用什么形式？","hint":"动词的过去式形式。","takeaway":"看到 \"ago\" 就要选择动词的过去式。"},{"question":"那么，在 happen, happens, is happening, happened 这几个选项中，哪一个是 happen 的过去式？","hint":"happen 是一个规则动词，过去式通常加-ed。","takeaway":"happened 是 happen 的过去式，因此是正确答案。"}]},{"title":"主从时态一致性辨析","steps":[{"question":"主句 \"Goldfish don't know\" 用的是什么时态？","hint":"don't know 是 do not know 的缩写，do/does 是一般现在时的标志。","takeaway":"主句用的是一般现在时。"},{"question":"主句是现在时，从句是不是也必须用现在时？这种想法对吗？","hint":"想一想，我们现在谈论昨天发生的事，应该怎么说？\"I know what you did yesterday.\" 这里主句和从句时态一样吗？","takeaway":"宾语从句的时态由其自身的时间状语决定，不一定和主句时态保持一致。"},{"question":"所以，即使主句是 \"don't know\" (现在时)，从句因为有 \"ago\" 这个词，也必须用什么时态？","hint":"再次回顾 \"ago\" 的用法，它是过去时间的标志。","takeaway":"宾语从句的时态具有相对独立性，必须根据其自身语境来确定。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"Yesterday I met Amy _____.","options":{"A":"on my way to home","B":"in my way home","C":"on my way home","D":"in my way to home"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查固定搭配 \"on one's way home\"，意为“在某人回家的路上”。在这个短语中，\"home\" 是一个副词，表示“向家里”的方向，因此其前面不需要加介词 \"to\"。我们常说 \"go home\" 而不是 \"go to home\" 也是同理。因此，包含 \"to home\" 的选项 A 和 D 都是错误的。选项 B 使用了介词 \"in\"，\"in one's way\" 意为“挡住某人的路，妨碍某人”，不符合句意。因此，正确的表达是 C 选项 \"on my way home\"。","knowledge_expansion_md":"**1. `on one's way to + 地点名词` vs. `on one's way + 地点副词`**\n*   当目的地是名词时，需要用介词 `to`。例如：`on my way to school` (在我去学校的路上), `on her way to the library` (在她去图书馆的路上)。\n*   当目的地是副词时，如 `home`(家), `here`(这里), `there`(那里), `abroad`(国外)，前面不加 `to`。例如：`on my way home`, `on his way there`。\n\n**2. 辨析 `in the way`, `on the way`, `by the way`**\n*   `in the way`: 挡路，妨碍。例如：`Please move the chair, it's in the way.` (请把椅子挪开，它挡路了。)\n*   `on the way`: 在路上。例如：`I'm on the way, I'll be there in 10 minutes.` (我在路上了，10分钟后到。)\n*   `by the way`: 顺便说一下，用于转换话题。例如：`By the way, have you seen my keys?` (顺便问一下，你看到我的钥匙了吗？)","socratic_tracks":[{"title":"固定搭配 on one's way","steps":[{"question":"“在回家的路上”用英语怎么说？这是一个非常常见的短语。","hint":"我们常说 \"on the way to school\" (在去学校的路上)，那么“回家”该怎么说呢？","takeaway":"“在某人回家的路上”的固定搭配是 \"on one's way home\"。"},{"question":"为什么 \"on my way home\" 里面没有介词 \"to\"，而 \"on my way to school\" 里面有 \"to\" 呢？","hint":"想一想 home 和 school 的词性在这里有什么不同？","takeaway":"在这个短语里，home是副词，而school是名词，副词前不需加介词to。"}]},{"title":"home 的词性","steps":[{"question":"我们常说 \"go home\"，为什么不说 \"go to home\"？","hint":"对比一下 \"go to school\", \"go to the park\" 和 \"go home\" 的区别。","takeaway":"\"home\" 在这里作副词，意为“回家地”，所以前面不加 \"to\"。"},{"question":"除了 home，还有哪些类似的词也作地点副词使用，前面不加 to？","hint":"比如“去那里”、“来这里”、“去国外”。","takeaway":"here (这里), there (那里), abroad (国外) 等词作副词时，前面也不加 to。"}]},{"title":"介词 in 和 on 的辨析","steps":[{"question":"选项 B 和 D 用了介词 \"in\"，\"in my way\" 是什么意思？","hint":"如果有东西 \"in your way\"，你会怎么做？是不是会把它移开？","takeaway":"\"in one's way\" 的意思是“挡路、妨碍”，与“在...的路上”意思不同。"},{"question":"那么，表达“在...的路上”应该用哪个介词？","hint":"回忆一下我们刚才讨论的固定搭配。","takeaway":"表达“在...的路上”应该用介词 \"on\"，构成 \"on one's way\"。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"The boy always reads with his eyes _____.","options":{"A":"close","B":"closing","C":"closed","D":"closes"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 \"with\" 的复合结构，即 \"with + 宾语 + 宾语补足语\"，用来表示伴随的动作或状态。在这个结构中，宾语是 \"his eyes\"，后面的部分是宾语补足语，用来描述眼睛的状态。我们需要判断宾语 \"his eyes\" 和动词 \"close\" 之间的逻辑关系。因为“眼睛”是“被闭上”的，或者说处于“闭着”的状态，二者之间是被动关系，所以应该使用过去分词 \"closed\" 作宾语补足语。因此，\"with his eyes closed\" 意为“闭着眼睛”。","knowledge_expansion_md":"**“with” 复合结构详解:** `with + n. / pron. + complement`\n该结构在句中作状语，表示伴随情况。补语（complement）的形式多样，取决于其与宾语的逻辑关系：\n1.  **+ 过去分词 (-ed):** 表示宾语承受的被动动作或所处的状态。这是本题的考点。\n    *   `She listened to the music with her eyes closed.` (她闭着眼睛听音乐。) -> 眼睛“被”闭上。\n2.  **+ 现在分词 (-ing):** 表示宾语正在主动进行的动作。\n    *   `The man was watching TV with his dog sleeping beside him.` (那个男人在看电视，他的狗睡在旁边。) -> 狗“正在”睡觉。\n3.  **+ 形容词/副词/介词短语:** 表示宾语所处的状态或特征。\n    *   `He fell asleep with the light on.` (他开着灯睡着了。) (on是副词)\n    *   `The teacher came in with a book in his hand.` (老师手里拿着一本书走了进来。) (in his hand是介词短语)","socratic_tracks":[{"title":"with复合结构","steps":[{"question":"这个句子想表达“那个男孩总是闭着眼睛读书”，其中“闭着眼睛”是一种伴随的状态。英语中用什么结构来表达这种伴随状态？","hint":"题干中给出了 \"with his eyes...\" 的开头。","takeaway":"我们可以使用 \"with + 名词 + 补语\" 的复合结构来表示伴随状态。"},{"question":"在这个结构中，补语部分需要描述名词 \"his eyes\" 的状态。我们应该用动词的什么形式来描述？","hint":"补语可以是形容词、副词、介词短语，也可以是分词（-ing或-ed形式）。","takeaway":"在这里，我们需要用动词 \"close\" 的某种分词形式来作 \"his eyes\" 的补语。"}]},{"title":"主动 vs. 被动","steps":[{"question":"我们来判断一下“眼睛”和“闭上”这个动作之间的关系。是“眼睛”主动去“闭上”，还是“眼睛”被“闭上”？","hint":"一个人闭上眼睛，是人控制眼睛，还是眼睛自己决定闭上？","takeaway":"“眼睛”是动作“闭上”的承受者，它们之间是被动关系。"},{"question":"当名词和动作之间是被动关系时，我们应该用现在分词（-ing）还是过去分词（-ed）？","hint":"-ing 形式通常表示主动和进行，-ed 形式通常表示被动和完成。","takeaway":"表示被动关系或已完成的状态时，应该使用过去分词(-ed)。"},{"question":"所以，\"close\" 这个词应该变成什么形式？","hint":"close的过去分词是什么？","takeaway":"应该使用过去分词 \"closed\"。"}]},{"title":"分词作补语辨析","steps":[{"question":"让我们看一个用现在分词的例子：`He sat there with tears running down his face.` (他坐在那里，泪流满面)。这里的 \"tears\" 和 \"run\" 是什么关系？","hint":"是“眼泪”主动地“流下来”。","takeaway":"\"tears\" 和 \"run\" 是主动关系，所以用现在分词 \"running\"。"},{"question":"现在回到原题 `with his eyes _____ (close)`。对比上一个例子，\"eyes\" 和 \"close\" 是主动关系吗？","hint":"眼睛不能自己执行“闭上”这个动作。","takeaway":"\"eyes\" 和 \"close\" 是被动关系，所以不能用现在分词 \"closing\"。"},{"question":"通过对比，我们能总结出在with复合结构中，什么时候用-ing，什么时候用-ed作宾语补足语吗？","hint":"关键看宾语和动作之间的逻辑关系：是宾语发出动作，还是承受动作。","takeaway":"宾语是动作的发出者用-ing（主动），宾语是动作的承受者用-ed（被动）。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"In spring, it is good for you to sleep _____ your windows open.","options":{"A":"for","B":"and","C":"with","D":"but"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 “with + 宾语 + 宾语补足语” 这一复合结构，用来表示伴随的状态或情况。\n\n句意为：“春天，开着窗户睡觉对你有好处。”\n\n“with your windows open” 意为 “在窗户开着的情况下”，在句中作状语，修饰动词 “sleep”，描述睡觉时伴随的状态。\n\n其他选项：\n- A. for (为了)\n- B. and (和)\n- D. but (但是)\n\n均不符合该结构和句意，因此正确答案是 C。","knowledge_expansion_md":"### “with” 复合结构详解\n\n“with + 宾语 + 宾语补足语” 结构在句中常作状语，表示伴随、原因、方式或条件。宾语补足语（宾补）的形式多样，可以是：\n\n1.  **形容词**：*He fell asleep with the window **open**.* (他开着窗户睡着了。)\n2.  **副词**：*She stood there with her coat **on**.* (她穿着外套站在那里。)\n3.  **介词短语**：*The teacher came in with a book **in his hand**.* (老师手里拿着一本书走了进来。)\n4.  **现在分词 (doing)**：表示宾语正在进行的动作，宾语是动作的发出者。\n    *He likes to sleep with music **playing**.* (他喜欢听着音乐睡觉。)\n5.  **过去分词 (done)**：表示宾语所承受的动作或已完成的状态，宾语是动作的承受者。\n    *The man was sent to the hospital with his leg **broken**.* (那个男人腿断了，被送往医院。)\n\n**易错点**：注意区分现在分词和过去分词作宾补。判断宾语与分词之间是主动关系还是被动关系是关键。例如，在 *with his eyes **closed*** 中，眼睛是“被闭上”的，所以用过去分词。","socratic_tracks":[{"title":"“with”复合结构","steps":[{"question":"句子中 “your windows open” 这部分是用来描述什么的？","hint":"它是在描述 “sleep”（睡觉）这个动作发生时的一种状态吗？","takeaway":"“your windows open” 描述了 “sleep” 这个动作发生时伴随的状态。"},{"question":"在英语中，哪个介词常被用来引出一个名词（宾语）和它的状态（宾补），来表示“伴随着……”的情况？","hint":"想象一下你“带着”一个开着窗户的状态睡觉。中文里的“带着”或“伴随”在英语里常用哪个词表达？","takeaway":"介词 “with” 可以引出宾语和宾语补足语，构成复合结构，表示伴随状态。"}]},{"title":"介词功能辨析","steps":[{"question":"我们来试试其他选项。如果用 “for”，句子 “sleep for your windows open” 通顺吗？“for” 通常表示什么意思？","hint":"“for” 常表示“为了”某个目的或“持续”一段时间。","takeaway":"用 “for” 在这里不符合逻辑，我们不是“为了”开窗而睡觉。"},{"question":"那 “and” 呢？“sleep and your windows open” 听起来像两个并列的动作，对吗？","hint":"“and” 连接的是两个地位对等的成分，但“睡觉”和“窗户开着”一个是主动行为，一个是客观状态，它们的关系是主次伴随，而不是并列。","takeaway":"“and” 连接并列成分，而本句需要表达的是主次分明的伴随关系，因此不适用。"}]},{"title":"语境与句意理解","steps":[{"question":"这句话想要表达的中文核心意思是什么？","hint":"试着翻译一下：“春天，……对你有好处。” 空缺部分是“开着窗户睡觉”。","takeaway":"句子的核心是表达“在开着窗户这种状态下睡觉”。"},{"question":"在英语中，要表达“带着某种状态”或“附带着某种情况”，我们通常用哪个词？","hint":"回想一下“一个戴着红帽子的女孩”是怎么说的？—— “a girl with a red hat”。","takeaway":"“with” 常用于表示伴随、拥有或附带某种状态，非常适合本题语境。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"—Will you come to the party next Sunday?\n—_____. I will visit my grandparents in my hometown.","options":{"A":"I think so","B":"I'd like to","C":"I'm afraid not","D":"I'm afraid so"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查情景交际中的委婉拒绝。\n\n问句是 “Will you come to the party next Sunday?”（下周日你会来参加派对吗？），这是一个一般疑问句。\n\n答语的后半句 “I will visit my grandparents in my hometown.”（我要去老家看望我的祖父母。）解释了不能参加派对的原因。\n\n因此，空格处需要填入一个表示委婉拒绝的表达。“I'm afraid not.” 意为“恐怕不行”，是对一般疑问句的否定回答，语气委婉，完全符合语境。\n\n- A. I think so (我想是的) - 表示同意，与后文矛盾。\n- B. I'd like to (我愿意去) - 表达意愿，但通常后接 “but” 才构成完整的拒绝，单独使用不完整。\n- D. I'm afraid so (恐怕是的) - 用于确认不好的消息，不适用于回答“你是否会来”这类问题。","knowledge_expansion_md":"### “I'm afraid so” vs. “I'm afraid not”\n\n这两个句型是英语口语中非常实用且礼貌的表达，常用于传递坏消息或表达否定的看法。\n\n1.  **I'm afraid not.**\n    -   意为“恐怕不行/不是”，是 **No** 的委婉说法。\n    -   用于否定地回答一个一般疑问句或陈述一个否定的事实。\n    -   例：— Can you help me with this box? (你能帮我搬这个箱子吗？)\n        — **I'm afraid not.** I have to leave now. (恐怕不行，我现在得走了。)\n\n2.  **I'm afraid so.**\n    -   意为“恐怕是的/是这样”，是 **Yes** 的委婉说法，但通常用于确认一个**不好的、令人不悦**的事实。\n    -   例：— Is the flight cancelled? (航班取消了吗？)\n        — **I'm afraid so.** (恐怕是的。)\n\n**易错点**：学生容易混淆两者的使用场景。关键在于判断回答是肯定的还是否定的。如果是对一个坏消息的肯定确认，用 `so`；如果是对一个请求或邀请的否定拒绝，用 `not`。","socratic_tracks":[{"title":"上下文逻辑推断","steps":[{"question":"看到回答的第二句话 “I will visit my grandparents...”，你觉得说话人能去参加派对吗？","hint":"“我要去看望祖父母”通常是作为不能做某事的理由。","takeaway":"这句话是解释为什么不能参加派对的原因。"},{"question":"既然不能去，那么空格处应该填入一个表示同意的回答，还是一个表示拒绝的回答？","hint":"为了让对话逻辑通顺，回答应该是否定的。","takeaway":"空格处需要一个委婉的否定回答来引出后面的理由。"}]},{"title":"“I'm afraid”用法辨析","steps":[{"question":"“I'm afraid not” 和 “I'm afraid so” 的意思有什么根本不同？","hint":"一个相当于委婉的 “No”，另一个相当于委婉的 “Yes”。","takeaway":"“I'm afraid not” 用于否定，而 “I'm afraid so” 用于肯定不好的事情。"},{"question":"提问者问 “Will you come...?” (你会来吗？)。回答者因为有事不能来，他实际上想表达的是 “No, I won't.”。应该用哪个委婉的表达来替代？","hint":"选择表示“恐怕不行”的那个。","takeaway":"“I'm afraid not” 是对 “Will you come?” 的最恰当的委婉否定回答。"}]},{"title":"干扰项排除","steps":[{"question":"为什么不能选 B “I'd like to”（我乐意去）？它也能表达一种遗憾。","hint":"“I'd like to” 后面通常会紧跟一个 “but” 来引出转折，例如 “I'd like to, but I can't.”。单独使用在这里显得话没说完。","takeaway":"“I'd like to” 表达了意愿，但作为完整的拒绝通常需要 “but” 连接原因，因此不是最佳选项。"},{"question":"那 A “I think so”（我想是的）呢？为什么它和上下文矛盾？","hint":"“I think so” 意味着你认为你会去，但这与后面的理由“我要去看望祖父母”在逻辑上是冲突的。","takeaway":"“I think so” 表示肯定，与后文给出的不去参加的理由完全矛盾。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"—Excuse me! You can't take photos here. Look at the sign. It says \"NO PHOTOS\".\n—Sorry, I _____ it.","options":{"A":"didn't see","B":"am going to see","C":"won't see","D":"don't see"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词时态的选择，特别是根据对话语境判断动作发生的时间。\n\n对话中，第一个人提醒第二个人不能在此拍照，并指出了警示牌。\n\n第二个人回答 “Sorry, I _____ it.”（对不起，我……它。）。这里的道歉表明，“没看见”这个动作是发生在被提醒**之前**的。对于过去发生的动作，我们应该使用一般过去时。\n\n- A. **didn't see**：一般过去时的否定形式，意为“（刚才）没看见”，符合语境。\n- B. am going to see：将来时，意为“将要看见”，不合逻辑。\n- C. won't see：将来时，意为“将不会看见”，不合逻辑。\n- D. don't see：一般现在时，意为“（现在）看不见”，在道歉的语境下显得不礼貌或不合情理。","knowledge_expansion_md":"### 对话中的时态选择\n\n在没有明确时间状语（如 yesterday, last week）的对话中，正确选择时态的关键是**理解上下文的逻辑和动作发生的时间点**。\n\n1.  **一般过去时 (Simple Past)**：用于描述在过去某个时间点或时间段内发生并完成的动作。在本题中，“没看见标志”这个动作发生在说话人提醒之前，是一个已经过去的事件，因此用一般过去时来解释原因最为恰当。\n    *   例：— Why were you late? (你为什么迟到了？)\n        — Sorry, I **missed** the bus. (对不起，我错过了公交车。)\n\n2.  **一般现在时 (Simple Present)**：通常表示经常性、习惯性的动作或当前的状态、事实。如果在题中用 “I don't see it”，则表示“我现在（即使你指给我）也看不见它”，这与道歉的态度不符，也通常不符合事实。\n\n3.  **现在完成时 (Present Perfect)**：有时也用于解释当前状况的原因，强调过去动作对现在造成的影响。例如 “I have lost my key, so I can't open the door.” 在本题中，虽然 “I haven't seen it” 语法也通，但 “I didn't see it” 更侧重于描述“刚才没注意”这一具体过去行为，是更直接、更常见的口语表达。","socratic_tracks":[{"title":"动作发生时间判断","steps":[{"question":"对话中，第二个人说“对不起”，他是在为一件已经发生的事道歉，还是将要发生的事道歉？","hint":"他拍照这个行为已经被第一个人看到了，所以是已经发生的事。","takeaway":"他是在为过去的行为道歉。"},{"question":"他解释说“我……它（标志）”。那么“没看见标志”这个动作，是发生在对方提醒他之前，还是之后？","hint":"正因为之前没看见，所以他才拍照，才会被提醒。","takeaway":"“没看见标志”这个动作发生在过去，因此谓语动词应该使用过去时态。"}]},{"title":"不同时态的含义","steps":[{"question":"如果选择 D 选项 “don't see”，这句话 “Sorry, I don't see it.” 在这个场景下听起来是什么感觉？","hint":"一般现在时表示“现在”的状态。意思是“对不起，我现在看不见它。” 这像是在反驳对方。","takeaway":"使用一般现在时 “don't see” 在道歉语境下显得不真诚且不合逻辑。"},{"question":"那 B “am going to see” 和 C “won't see” 呢？它们都表示将来，用在这里解释一个已经犯的错误，说得通吗？","hint":"“对不起，我将要看见它”或“我将不会看见它”，这能解释你为什么刚才拍照了吗？","takeaway":"用将来时来解释一个已经发生的错误，在逻辑上是完全不通的。"}]},{"title":"情景模拟与表达","steps":[{"question":"想象一下，你在一个安静的图书馆里手机响了，管理员过来提醒你。你道歉时会怎么解释？","hint":"你可能会说：“对不起，我忘了调静音了。”","takeaway":"在中文里，我们也会用一个表示过去发生的动作（忘了）来解释当前的情况。"},{"question":"“我忘了”或“我没看见”这种发生在过去的、用来解释当前状况的简单动作，在英语中最常用哪种时态来表达？","hint":"描述过去某个时间点完成的动作，用什么时态？","takeaway":"这种情况在英语口语中最常使用一般过去时，如 “I forgot” 或 “I didn't see”。"}]}]}}]},{"section_title":"II. 完形填空 (共20分)","section_instruction":"My dad was my everything. I __1__ bad could come to me when my daddy was around.\nBut my dad also had a problem. He was an alcoholic(酒鬼). One day while watching cartoons, I heard the back door __2__. In came my dad. He was drunk(喝醉的). I ran to him and shouted, \"Daddy, Daddy, Daddy.\" When I was about to reach him, my mum __3__ me. Why was she holding me back from my dad?\n\"Let me go to my daddy. He needs me!\" I shouted. \"No, Cindy, he'll hurt you. You need to stay back,\" my mum said to me. Then my dad came out carrying as much as he __4__. Without looking back, he walked out of the door. That was the only time when I saw my dad drunk. And it was the first time when I saw my hero __5__ a weak man. I went with a __6__ mind. And he has not had a drink since then. He is not perfect, but he is my dad. I will look up to him.\nMany years later, when I had enough courage(勇气) to ask my mum about it, she told me something I'll __7__ forget.\n\"I found him at the hotel he was __8__ at, Cindy. I told him that he could have his drink, but not his daughter. __9__ he could have his daughter but not his drink. He __10__ you.\"","items":[{"number":"1","item_type":"cloze","context_note":"Cloze Passage","stem":"I __1__ bad could come to me when my daddy was around.","options":{"A":"Anything","B":"Something","C":"Nothing","D":"Everything"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查不定代词的用法。根据前文“My dad was my everything.”（爸爸是我的全部），可知作者对父亲充满崇拜和信任，感觉有父亲在身边就非常安全。因此，此处要表达的是“当爸爸在身边时，没有什么坏事会发生在我身上”。\n\n1.  **逻辑分析**：上下文语境表明作者在父亲身边有强烈的安全感，因此推断没有坏事会发生。\n2.  **词义辨析**：\n    -   `Nothing` 意为“什么也没有，没有任何东西”，本身含有否定意义，符合“没有什么坏事”的语境。虽然句子 “I Nothing bad could come...” 在语法上不完美，但在选择题中，`Nothing` 是唯一符合逻辑和语义的选择。\n    -   `Something` (一些东西) 和 `Everything` (所有东西) 与逻辑不符。\n    -   `Anything` (任何东西) 通常用于否定句或疑问句中。本句是肯定句结构，若要表达否定概念，应使用 `nothing`。","knowledge_expansion_md":"### 不定代词 `some-`, `any-`, `no-`, `every-` 的用法\n\n这类由 `some`, `any`, `no`, `every` 与 `thing`, `one`, `body` 复合而成的代词，用法有规律可循。\n\n| | -thing (物) | -one / -body (人) | 主要用法 |\n| :--- | :--- | :--- | :--- |\n| **some-** | something | someone/somebody | 用于**肯定句**中。|\n| **any-** | anything | anyone/anybody | 用于**否定句**和**疑问句**中。|\n| **no-** | nothing | no one/nobody | 本身带否定含义，用于**肯定句结构**，表达否定意义。|\n| **every-**| everything| everyone/everybody| 表示“所有，全部”，有单数意义，谓语动词用单数。|\n\n**特殊用法：**\n1.  当疑问句期待**肯定回答**，或在表示**请求、建议**的疑问句中，常用 `something`。\n    *   *Would you like **something** to drink?* (你想喝点什么吗？) (期待对方接受)\n2.  当 `anything` 用于**肯定句**时，意为“任何事情，无论什么”。\n    *   *You can do **anything** you want.* (你可以做任何你想做的事。)\n\n**易错点**：一个句子中不能出现双重否定。因为 `nothing`, `no one` 等词本身已是否定，所以不能与 `not` 同时使用。\n-   错误：*I did**n't** see **nothing**.*\n-   正确：*I saw **nothing**.* 或 *I did**n't** see **anything**.*","socratic_tracks":[{"title":"上下文逻辑推断","steps":[{"question":"根据第一句话 “My dad was my everything.”，作者对爸爸是什么感觉？","hint":"当某人是你的“全部”时，你通常会非常信任和依赖他。","takeaway":"作者非常崇拜和信任她的父亲，和他在一起时感到很安全。"},{"question":"既然和爸爸在一起很安全，那么作者会觉得有坏事发生，还是没有坏事发生？","hint":"安全感意味着免于危险和坏事。","takeaway":"作者觉得没有坏事会发生在她身上。"},{"question":"四个选项中，哪个词是“没有任何东西”或“没什么事”的意思？","hint":"`some-` 表示“一些”，`every-` 表示“所有”，`any-` 表示“任何”，`no-` 表示“没有”。","takeaway":"`Nothing` 是唯一表示“什么也没有”的选项，最符合上下文逻辑。"}]}]}},{"number":"2","item_type":"cloze","context_note":"Cloze Passage","stem":"I heard the back door __2__.","options":{"A":"open","B":"opened","C":"locked","D":"closed"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查感官动词 `hear` 的用法。句意为“我听到后门……”。根据后文“In came my dad.”（我爸爸进来了），可以推断爸爸是打开门进来的，所以“我”听到的是门“打开”的动作。\n\n- `hear somebody/something do something` 是固定用法，意为“听到某人/某物做了某事（强调动作的全过程）”。此处 `hear the back door open` 意为“听到后门开了”。\n- 选项A `open` 是动词原形，符合 `hear sth. do` 的语法结构。\n- 选项B `opened` 是过去式或过去分词，不符合此语法结构。\n- 选项C `locked`（锁着的）和D `closed`（关着的）描述的是状态，且与后文“爸爸进来了”的语境矛盾。\n\n因此，正确答案是A。","knowledge_expansion_md":"### 感官动词 `see`, `hear`, `watch`, `feel` 的用法\n\n这类动词后面可以跟宾语和宾语补足语，构成复合宾语结构。宾语补足语可以是**动词原形**或**现在分词(-ing)**，两者有细微区别：\n\n1.  **+ do sth (动词原形)**: 表示看到或听到了动作的**全过程**，或动作已经完成。\n    *   *I saw him **leave** the room.* (我看到他离开了房间。强调“离开”这个动作完成了。)\n    *   *We heard the glass **break**.* (我们听见玻璃碎了。)\n\n2.  **+ doing sth (现在分词)**: 表示看到或听到了动作**正在进行**。\n    *   *I saw him **leaving** the room.* (我看到他正在离开房间。强调“正在离开”这个状态。)\n    *   *When I passed by, I heard them **singing**.* (我经过时，听到他们在唱歌。)\n\n在本题中，`hear the back door open` (听到门开了) 和 `hear the back door opening` (听到门正在打开) 都是可以的，但选项中只提供了 `open`，因此选择A。","socratic_tracks":[{"title":"语法结构分析","steps":[{"question":"动词 `hear` (听到) 是一个感官动词，它的后面跟宾语后，通常可以接哪两种形式的动词作补充？","hint":"想一想 `I hear him sing` 和 `I hear him singing`。","takeaway":"感官动词 `hear` 后面可以跟动词原形（do）或现在分词（doing）。"},{"question":"根据这个语法规则，选项A `open` 和 B `opened` 哪个可能正确？","hint":"`open` 是动词原形。","takeaway":"选项A `open` 符合 `hear sth do` 的结构。"}]},{"title":"上下文逻辑推理","steps":[{"question":"根据空格后面的句子 “In came my dad.” (我爸爸进来了)，门是处于什么状态？","hint":"人要进来，门必须是打开的。","takeaway":"爸爸进来了，说明门被打开了。"},{"question":"所以，作者听到的是门“打开”的动作，还是门“关上”或“锁上”的动作？","hint":"结合爸爸进来的结果来判断。","takeaway":"作者听到的是门“打开”的动作，因此 `open` 在意思上是正确的，而 `closed` 和 `locked` 与语境矛盾。"}]}]}},{"number":"3","item_type":"cloze","context_note":"Cloze Passage","stem":"When I was about to reach him, my mum __3__ me.","options":{"A":"left","B":"saved","C":"greeted","D":"stopped"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查动词词义辨析。句意为“当我正要跑到他身边时，我妈妈……我。”根据后文“Why was she holding me back from my dad?”（她为什么拉着我不让我去爸爸那里？），可知妈妈“拦住”了“我”。\n\n- `stopped` 意为“阻止，拦住”，`stopped me` 即“拦住了我”，完全符合语境。\n- `left` (离开) me，意为“离开我，丢下我”，不符合语境。\n- `saved` (拯救) me，意为“救了我”，虽然妈妈的动机可能是为了保护“我”，但 `stopped` 更直接地描述了当时的动作。\n- `greeted` (问候) me，意为“问候我”，与当时紧张的气氛不符。\n\n因此，正确答案是D。","knowledge_expansion_md":"### 重点动词辨析：`stop`\n\n`stop` 是一个常用但有多重含义和用法的动词。\n\n1.  **stop sb/sth**: 阻止某人/某物；拦住\n    *   例：`The police stopped the car.` (警察拦停了那辆车。)\n    *   本题中的 `my mum stopped me` 就属于此用法。\n\n2.  **stop doing sth**: 停止做某事（中断正在进行的动作）。\n    *   例：`Please stop making noise.` (请不要再制造噪音了。)\n\n3.  **stop to do sth**: 停下来去做另一件事。\n    *   例：`He stopped to tie his shoelace.` (他停下来去系鞋带。)\n\n4.  **stop sb from doing sth**: 阻止某人做某事。\n    *   例：`The rain stopped us from going out.` (雨阻止了我们出门。) \n    *   本题的语境也可以理解为 `My mum stopped me from going to my dad.`","socratic_tracks":[{"title":"寻找上下文线索","steps":[{"question":"在空格后面，作者问了一个问题来表达她的困惑，那个问题是什么？","hint":"找到以 “Why” 开头的句子。","takeaway":"问题是 “Why was she holding me back from my dad?”"},{"question":"短语 `holding me back` 是什么意思？","hint":"`hold back` 的意思是拉住、阻止、抑制。","takeaway":"它的意思是“拉住我，不让我靠近爸爸”。"},{"question":"既然妈妈“拉住我”，那么四个选项 `left`(离开), `saved`(拯救), `greeted`(问候), `stopped`(阻止) 中，哪个词的意思和 `holding me back` 最接近？","hint":"哪个词最能描述“拉住不让走”这个动作？","takeaway":"`stopped` (阻止，拦住) 的意思最贴切。"}]}]}},{"number":"4","item_type":"cloze","context_note":"Cloze Passage","stem":"Then my dad came out carrying as much as he __4__.","options":{"A":"could","B":"had","C":"needed","D":"wanted"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查情态动词的用法和固定搭配。句意为“然后我爸爸走了出来，身上带着他能带的全部东西。”\n\n- `as much as one could` 是一个固定搭配，意为“尽可能多地”，表示尽了最大努力。此处 `carrying as much as he could` 意为“带着他所能带走的所有东西”，暗示他正在离家出走。\n- 选项A `could` 在这里表示“能够”，符合语法和语境。\n- 选项B `had` (有)、C `needed` (需要)、D `wanted` (想要) 均不能与 `as much as he...` 构成通顺且符合逻辑的表达。\n\n因此，正确答案是A。","knowledge_expansion_md":"### 常见情态动词用法回顾\n\n情态动词本身有一定的词义，但没有人称和数的变化，其后必须跟动词原形。\n\n*   **can/could**: 表示能力（能/会）、许可（可以）、可能性（可能）。`could` 是 `can` 的过去式，也可表示更委婉的语气。\n    *   *He **can** swim.* (能力)\n    *   *You **can** go now.* (许可)\n    *   *He **could** be at home.* (可能性)\n\n*   **must/have to**: 表示必须。`must` 侧重主观意愿，`have to` 侧重客观需要。\n    *   *I **must** finish my work today.* (我主观认为必须)\n    *   *I **have to** go to school on weekdays.* (规定)\n\n*   **need**: 作为情态动词时，多用于否定句和疑问句，意为“需要”。\n    *   *You **needn't** worry.* (你不需要担心。)\n\n在本题中，`as much as he could` 是一个常见的固定结构，强调数量或程度达到了极限。","socratic_tracks":[{"title":"识别固定搭配","steps":[{"question":"句子中有一个结构 `as much as ...`，它常常用来表示“与……一样多”。当后面跟一个主语和动词时，通常表示“尽可能多地……”。你见过类似的短语吗？","hint":"例如，“尽你所能”可以说 `as much as you can`。","takeaway":"这是一个常见的固定搭配，形式为 `as much as one can/could`。"},{"question":"根据这个固定搭配，空格处应该填入哪个词？","hint":"这个句子描述的是过去发生的事情（came out），所以应该用 `can` 的过去式。","takeaway":"应该填入 `could`，构成 `as much as he could`。"}]},{"title":"验证其他选项","steps":[{"question":"为什么不能选 `wanted`？`as much as he wanted` (他想要多少就多少) 听起来也对。","hint":"想一想语境：他喝醉了，正在离家。这里的重点是他带走了“所有他能带走的东西”，还是“所有他想要的东西”？","takeaway":"上下文暗示他是在一种决绝的状态下离开，带走了所有能带走的东西，强调的是能力的极限，而非愿望。因此 `could` 比 `wanted` 更贴切地描绘了这种情景。"}]}]}},{"number":"5","item_type":"cloze","context_note":"Cloze Passage","stem":"And it was the first time when I saw my hero __5__ a weak man.","options":{"A":"fail","B":"fall","C":"feel","D":"fight"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词在特定语境中的理解。句意为“这是我第一次看到我的英雄……一个软弱的人。” 此处描述的是作者心中英雄般的父亲形象的崩塌。\n\n- 在此情境中，作者看到曾经是英雄的父亲因酗酒而变得软弱，这是一种英雄形象的“崩塌”或“失败”。\n- 选项A `fail` 意为“失败”。虽然 “see someone fail someone/something” 不是标准语法结构，但在文学描述中，可以理解为作者看到英雄形象的“失败”，他辜负了“英雄”这个称号。在所有选项中，`fail` 最能表达这种形象破灭的抽象含义。\n- 其他选项：B `fall`（摔倒）、C `feel`（感觉）、D `fight`（打架）的词义与此处抽象的语境不符。\n\n因此，选项A是在特定文学语境下表达“形象破灭”的最佳选择。","knowledge_expansion_md":"### 动词的引申义 (Extended Meaning)\n\n在英语学习中，除了掌握动词的基本词义，理解其在特定语境下的引申义也非常重要，尤其是在文学作品和描述性文章中。\n\n*   **基本义**: `fail` - to not succeed in what you are trying to achieve or are expected to do. (做某事失败；考试不及格)\n*   **引申义**: `fail` - to stop working properly; to become weak; to disappoint someone. (失灵；衰退；辜负)\n\n例如：\n*   *His eyesight is **failing**.* (他的视力正在衰退。) - 表示“变弱”\n*   *Words **failed** me.* (我一时语塞。) - 表示“不够用”\n*   *He **failed** his family.* (他辜负了他的家人。) - 表示“辜负期望”\n\n在本题中，`fail` 可以被理解为父亲作为“英雄”的形象衰退或失败了。","socratic_tracks":[{"title":"理解人物情感与关系","steps":[{"question":"在这件事发生之前，爸爸在作者心中是什么形象？","hint":"文章开头说 “My dad was my everything.”，并且作者称他为 “my hero”。","takeaway":"在作者心中，爸爸是一个无所不能的英雄。"},{"question":"在这件事中，作者看到了爸爸的哪一面？","hint":"他喝醉了，并且要离家出走。","takeaway":"作者看到了他软弱、失控的一面，称他为 “a weak man”。"}]},{"title":"探究词语的引申义","steps":[{"question":"从“英雄”到“软弱的人”，这种巨大的转变可以被看作是英雄形象的一种“什么”？","hint":"一个完美的形象不再完美了，可以说是……","takeaway":"可以看作是英雄形象的“失败”或“破灭”。"},{"question":"四个选项 `fail`, `fall`, `feel`, `fight` 中，哪个词的基本意思是“失败”？","hint":"考试不及格就是 `fail an exam`。","takeaway":"`fail` 的基本意思就是“失败”。因此，它可以引申为此处“英雄形象的失败”。"}]}]}},{"number":"6","item_type":"cloze","context_note":"Cloze Passage","stem":"","options":{"A":"weak","B":"heavy","C":"clear","D":"absent"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词词义辨析。根据上文，作者的父亲喝醉了，并且离开了家，这让作者第一次看到自己心中的英雄变成了“一个虚弱的男人”（a weak man）。因此，作者的心情是沉重的、悲伤的。`a heavy mind` 或 `a heavy heart` 都可以用来表达这种沉重的心情。因此，B选项 `heavy`（沉重的）最符合语境。\n\n- A `weak`：虚弱的\n- C `clear`：清晰的\n- D `absent`：心不在焉的","knowledge_expansion_md":"### 形容词与情感表达\n\n英语中常用一些形容词来比喻性地表达情感和心境。\n\n1.  **`heavy` (沉重的)**\n    *   `a heavy heart / mind`: 心情沉重。这是非常地道的表达，用来描述悲伤、担忧或沮丧的心情。\n    *   例句: `She left the hospital with a heavy heart.` (她心情沉重地离开了医院。)\n\n2.  **`clear` (清晰的)**\n    *   `a clear mind`: 头脑清晰。\n    *   `a clear conscience`: 问心无愧。\n\n3.  **`absent` (心不在焉的)**\n    *   `absent-minded`: 形容人健忘的、心不在焉的。\n\n在本题的语境下，作者目睹了令人伤心的一幕，所以用 `heavy` 来形容其心情最为贴切。","socratic_tracks":[{"title":"上下文情感分析","steps":[{"question":"在空格前的句子里，作者刚刚经历了什么事？","hint":"她的英雄父亲（my hero）变成了一个虚弱的人（a weak man），并且离开了家。","takeaway":"作者目睹了父亲醉酒后虚弱的一面并离开了家，这是一个令人伤心的场景。"},{"question":"经历了这样一件伤心事，作者的心情会是怎样的？","hint":"是高兴、平静，还是悲伤、沉重？","takeaway":"作者的心情应该是悲伤和沉重的。"},{"question":"在四个选项中，哪个词可以用来形容“沉重”的心情？","hint":"A. weak (虚弱的), B. heavy (沉重的), C. clear (清晰的), D. absent (心不在焉的)。","takeaway":"`heavy` 可以用来形容心情的沉重，常用搭配有 `a heavy heart` 或 `a heavy mind`。"}]}]},"correct_answer":"B"},{"number":"7","item_type":"cloze","context_note":"Cloze Passage","stem":"","options":{"A":"soon","B":"even","C":"also","D":"never"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题考查副词词义辨析。空格所在句意为“她告诉了我一件我将__忘记的事情”。根据语境，母亲讲述的是一件对作者意义重大、印象深刻的事情，所以作者“永远不会”忘记。`never`（从不，永不）符合这种强烈的语气。`I'll never forget` 是一个常用表达，意为“我永远不会忘记”。因此，D选项 `never` 最符合语境。\n\n- A `soon`：很快\n- B `even`：甚至\n- C `also`：也","knowledge_expansion_md":"### 副词 `never` 的用法\n\n`never` 是一个表示否定频率的副词，意为“从不；决不；永不”，语气非常强烈。\n\n1.  **基本用法**：常与一般现在时或现在完成时连用，放在行为动词前，be动词或助动词后。\n    *   `He never tells a lie.` (他从不撒谎。)\n    *   `I have never been to Beijing.` (我从没去过北京。)\n\n2.  **固定搭配**：`never forget` (永不忘记) 是一个非常常见的搭配，用来强调某人或某事记忆深刻。\n    *   `I will never forget your kindness.` (我永远不会忘记你的好意。)\n\n3.  **与其他副词的区别**：\n    *   `soon` (很快): 表示时间上的短暂。\n    *   `even` (甚至): 用于加强语气，强调出乎意料。\n    *   `also` (也): 用于补充信息，表示并列。","socratic_tracks":[{"title":"语境与语气判断","steps":[{"question":"从文章来看，母亲要讲的这件事对作者来说是小事还是大事？","hint":"文章开头就说“My dad was my everything”，这说明父亲对作者非常重要。母亲要讲的正是关于父亲的一个重要决定。","takeaway":"这是一件对作者意义重大的事情。"},{"question":"对于一件意义重大的事，我们是会“很快忘记”还是“永远不忘”？","hint":"越是重要的记忆，越是难以忘记。","takeaway":"人们倾向于永远记住重要的事情。"},{"question":"四个选项中，哪个词最能表达“永远不”这个强烈的含义？","hint":"A. soon (很快), B. even (甚至), C. also (也), D. never (永不)。","takeaway":"`never` 是表达“永不”的唯一正确选项，构成了固定搭配 `never forget`。"}]}]},"correct_answer":"D"},{"number":"8","item_type":"cloze","context_note":"Cloze Passage","stem":"","options":{"A":"staying","B":"living","C":"lying","D":"working"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查动词词义辨析及固定搭配。空格所在句意为“我在他__的旅馆里找到了他”。描述在旅馆、酒店等地方短暂居住，最常用的动词是 `stay`。`staying at a hotel` 是一个固定搭配，意为“待在/住在旅馆”。因此，A选项 `staying` 最符合语境。\n\n- B `living`：居住，通常指长期定居。\n- C `lying`：躺着。\n- D `working`：工作。","knowledge_expansion_md":"### 动词辨析：`stay` vs. `live`\n\n`stay` 和 `live` 都可以表示“居住”，但在用法和含义上有明显区别。\n\n1.  **`stay` (停留，暂住)**\n    *   通常指在某个地方**短期**停留。\n    *   常用于旅馆、朋友家等临时住所。\n    *   固定搭配: `stay at a hotel`, `stay with a friend`.\n    *   例句: `We are staying at the Hilton Hotel for three nights.` (我们将在希尔顿酒店住三晚。)\n\n2.  **`live` (居住，生活)**\n    *   通常指在某个地方**长期**定居，把那里当作家。\n    *   常用于城市、国家或某个固定地址。\n    *   固定搭配: `live in a city`, `live at No. 10 Downing Street`.\n    *   例句: `My grandparents live in the countryside.` (我的祖父母住在乡下。)\n\n根据本题语境，父亲是在“旅馆”（hotel）里，这显然是一个临时住所，因此用 `staying` 最为恰当。","socratic_tracks":[{"title":"固定搭配识别","steps":[{"question":"当我们想表达“在旅馆里住”时，英语中最常见的说法是什么？","hint":"这是一个非常常用的短语，涉及到动词和介词的搭配。","takeaway":"最地道和常见的表达是 `stay at a hotel`。"},{"question":"根据这个固定搭配，空格处应该填入哪个词的现在分词形式？","hint":"四个选项中哪个是 `stay` 的正确形式？","takeaway":"应该选择 `staying`。"}]},{"title":"近义词辨析","steps":[{"question":"`live` 和 `stay` 都有“住”的意思，它们在使用上有什么区别？","hint":"想一想，一个是长期的家，一个是临时的落脚点。","takeaway":"`live` 指的是长期居住、定居，而 `stay` 指的是短期停留、暂住。"},{"question":"住在“旅馆”（hotel）里，是长期行为还是短期行为？","hint":"旅馆是为旅行者提供临时住宿的地方。","takeaway":"住在旅馆通常是短期的。"},{"question":"因此，`living` 和 `staying` 哪个更适合描述在旅馆里的状态？","hint":"选择表示“短期停留”的词。","takeaway":"`staying` 更符合在旅馆暂住的语境。"}]}]},"correct_answer":"A"},{"number":"9","item_type":"cloze","context_note":"Cloze Passage","stem":"","options":{"A":"And","B":"Then","C":"Or","D":"So"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查连词的逻辑关系。空格前的句子是“他可以喝酒，但不能拥有他的女儿”，空格后的句子是“他可以拥有他的女儿，但不能喝酒”。这两句话是母亲提供给父亲的两个互不相容的选择，即“要么……要么……”。连接这种选择关系的连词是 `Or`（或者）。因此，C选项 `Or` 最符合语境。\n\n- A `And`：并且，表并列。\n- B `Then`：然后，表顺序。\n- D `So`：所以，表因果。","knowledge_expansion_md":"### 常用逻辑连词的功能\n\n连词是连接句子、理清逻辑的关键。学会在写作和阅读中识别并使用正确的连词非常重要。\n\n1.  **并列关系 (Addition)**: `and` (并且)\n    *   `He could have his drink, and he could have his daughter.` (他既可以喝酒，也可以拥有女儿。——与原文逻辑相反)\n\n2.  **转折关系 (Contrast)**: `but` (但是), `however` (然而)\n    *   `He could have his drink, but not his daughter.` (原文已使用)\n\n3.  **因果关系 (Cause and Effect)**: `so` (所以), `because` (因为)\n    *   `He could have his drink, so he couldn't have his daughter.` (他可以喝酒，所以他不能拥有女儿。——逻辑不完整)\n\n4.  **选择关系 (Choice)**: `or` (或者), `either... or...` (要么...要么...)\n    *   `He could have his drink, or he could have his daughter.` (他可以喝酒，或者他可以拥有女儿。——符合原文逻辑)\n\n在本题中，母亲给出了一个二选一的最后通牒，因此使用表示选择关系的 `Or` 是唯一正确的。","socratic_tracks":[{"title":"句子间逻辑关系分析","steps":[{"question":"请读一下空格前后的两个分句。它们之间是什么关系？","hint":"“你可以有A，但不能有B” 和 “你可以有B，但不能有A”。这是在提供选项吗？","takeaway":"这两个分句是在陈述一个二选一的抉择，它们是两种对立的可能性。"},{"question":"在英语中，当我们想连接两个或多个选择时，通常使用哪个连词？","hint":"比如，“你想喝茶还是咖啡？”","takeaway":"表示选择关系时，我们使用 `or`。"},{"question":"将 `Or` 放入空格处，读一读整个句子，看看是否通顺。","hint":"`...he could have his drink, but not his daughter. Or he could have his daughter but not his drink.`","takeaway":"使用 `Or` 后，句子逻辑清晰，准确地表达了母亲给出的选择，因此是正确答案。"}]}]},"correct_answer":"C"},{"number":"10","item_type":"cloze","context_note":"Cloze Passage","stem":"","options":{"A":"Followed","B":"chose","C":"picked","D":"believed"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词词义辨析。根据上文，母亲给了父亲一个选择：要么选择酒，要么选择女儿（`he could have his drink, but not his daughter. Or he could have his daughter but not his drink.`）。空格所在句是“He __10__ you.”（他__了你），这是母亲在揭晓父亲最终的决定。`chose` 是 `choose`（选择）的过去式，表示父亲在两者中“选择”了女儿。因此，B选项 `chose` 最符合语境。\n\n- A `Followed`：跟随\n- C `picked`：挑选，常指较为随意的挑选\n- D `believed`：相信","knowledge_expansion_md":"### 词义辨析：choose, pick, select\n\n- **choose**: 最常用词，指根据个人喜好或判断做出选择，强调做出决定的过程。它是不规则动词，变化为 `choose - chose - chosen`。\n- **pick**: 较口语化，常指从一群人或物中“挑选”出一个，有时带有随意性。例如：`Pick a card.` (随便抽张牌)。\n- **select**: 较为正式，指经过仔细考虑和比较后，系统地、慎重地“挑选”出最好的。例如：`The committee will select the best candidate.` (委员会将选出最佳候选人)。\n\n### 易错点\n\n学生容易混淆 `choose` 的过去式 `chose` 和过去分词 `chosen`。请记住：\n- `chose` (过去式)单独作谓语，如：`He chose the blue one.`\n- `chosen` (过去分词)用于完成时或被动语态，如：`Have you chosen?` / `He was chosen as the leader.`","socratic_tracks":[{"title":"近义词辨析","steps":[{"question":"`choose` 和 `pick` 都有“选择”的意思，它们在使用上有什么细微的区别吗？","hint":"想一想，我们说“挑选”一个苹果和“选择”一条人生道路，感觉一样吗？一个更随意，一个更慎重。","takeaway":"`choose` 强调经过思考、做出更重要的决定，而 `pick` 更侧重于从一堆东西里随手挑选。"},{"question":"那么 `select` 和 `choose` 又有什么不同呢？","hint":"想象一下，一个评奖委员会在“选择”获奖者，用哪个词听起来更正式、更严谨？","takeaway":"`select` 比 `choose` 更正式，通常指经过仔细比较后系统地、慎重地挑选。"}]},{"title":"动词时态与形态","steps":[{"question":"题目中的四个选项 `Followed`, `chose`, `picked`, `believed` 在时态上有什么共同点？","hint":"看看它们的词尾或者形态，它们是动词的原形吗？","takeaway":"它们都是动词的过去式，表示动作发生在过去。"},{"question":"`chose` 这个词的原形是什么？它的过去分词呢？","hint":"这是一个不规则动词。它的变化规律是 A-O-O 模式，但拼写有点特殊。想一想 `choose`, `___`, `chosen`。","takeaway":"不规则动词 `choose` 的变化形式是 `choose - chose - chosen`，需要特别记忆。"}]},{"title":"解题思路：语境推断","steps":[{"question":"在做完形填空时，如果遇到几个意思相近的词，我们应该怎么判断哪个是正确答案？","hint":"除了词语本身的意思，还有什么能帮助我们？比如句子的其他部分，或者整篇文章的基调。","takeaway":"我们需要仔细分析上下文，理解句子想表达的完整意思、语境和逻辑关系。"},{"question":"比如，如果一个句子说的是一个很重要的决定，像“选择”未来的职业，用 `chose` 还是 `picked` 更合适？","hint":"哪个词听起来更正式、更慎重？","takeaway":"在正式或重要的选择中，`chose` 通常是比 `picked` 更恰当的词。"}]}]}}]},{"section_title":"III. 阅读理解 (共20分)","section_instruction":"A\nWe have twenty minutes' rest between classes. Look! Most of us are playing during the rest time. Some students are on the playground. They are having a basketball game. Oh! A boy is running with a ball. And another is trying to stop him. They are so cool. And there are some girls watching the game. Some students are in the classroom. They are talking. A few of them are reading or doing homework. Look! A girl is looking at the birds in a tree in front of the classroom. She must be thinking of something interesting because she is smiling. What are the teachers doing? Do you know? Some of them are working in the office, and some are talking with students. Everyone is busy with his or her things. Busy and happy!","items":[{"number":"1","item_type":"reading","context_note":"Passage A","stem":"Where are some students having a game?","options":{"A":"In the classroom.","B":"In front of the classroom.","C":"On the playground.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题为细节定位题，询问学生们在何处玩游戏。根据小升初阅读常见校园场景，文章中很可能出现了类似“On the playground, some students are having a game.”（在操场上，一些学生正在玩游戏。）的描述。`On the playground` 明确指出了地点是“操场上”，因此选项C是正确答案。选项A和B分别指“在教室里”和“在教室前”，与操场游戏场景不符。","knowledge_expansion_md":"### 地点介词的使用\n\n在英语中，表示地点的介词 `in`, `on`, `at` 用法有别：\n\n- **in**: 表示在三维或有边界的“空间内部”。\n  - `in the classroom` (在教室里)\n  - `in the box` (在盒子里)\n  - `in Beijing` (在北京)\n\n- **on**: 表示在物体的“表面上”或与平面接触。\n  - `on the playground` (在操场上)\n  - `on the desk` (在书桌上)\n  - `on the wall` (在墙上)\n\n- **at**: 表示一个具体的“点”或较小的场所。\n  - `at the door` (在门口)\n  - `at school` (在上学，在学校)\n  - `at home` (在家)\n\n**特别注意**：我们说 `in the classroom` (在教室里)，但说 `on the playground` (在操场上)，因为教室被视为一个封闭空间，而操场被视为一个开阔的平面。","socratic_tracks":[{"title":"阅读策略：关键词定位","steps":[{"question":"当你看到这个问题 “Where are some students having a game?”，你应该在文章中寻找哪些关键词？","hint":"问题的核心词是什么？地点（Where），学生（students），游戏（game）。","takeaway":"带着问题中的关键词（如 students, game, where）去文章中快速定位相关信息，是高效的阅读方法。"},{"question":"找到包含这些关键词的句子后，你需要特别关注哪个词或短语来回答 “Where”（在哪里）这个问题？","hint":"想一想，回答“在哪里”的通常是什么样的词？比如“在...上/里/旁”。","takeaway":"找到描述地点的介词短语（如 on the playground, in the classroom）是回答 “where” 问题的关键。"}]},{"title":"词汇拓展：校园地点","steps":[{"question":"题目选项中出现了 `classroom` (教室) 和 `playground` (操场)，你还能说出学校里其他的地点吗？","hint":"比如，我们吃饭的地方、看书的地方、开大会的地方？","takeaway":"熟悉校园场景词汇（如 library 图书馆, canteen 食堂, gym 体育馆, office 办公室）对于理解校园主题文章至关重要。"},{"question":"我们通常用什么动词来搭配这些地点，描述在这些地方做的事情？比如，在图书馆做什么？","hint":"在图书馆是“读书”还是“吃饭”？","takeaway":"将地点名词与相应的活动动词联系起来记忆，可以帮助我们更好地理解和表达。例如：`read books in the library`。"}]},{"title":"语法辨析：地点介词","steps":[{"question":"为什么我们说 `in the classroom` 和 `on the playground`？`in` 和 `on` 在表示地点时有什么区别？","hint":"想一想 `classroom` 是一个封闭的空间，而 `playground` 是一个开阔的平面。","takeaway":"`in` 通常用于表示在三维、封闭的空间内部，而 `on` 用于表示在某个平面或表面上。"},{"question":"那么，我们说“在学校”用 `at school`，说“在北京”用 `in Beijing`，这又是为什么呢？","hint":"想一想“学校”和一个“城市”在空间大小和概念上的区别。","takeaway":"`at` 常用于指代一个功能性的地点（如学校、家），而 `in` 用于指代较大的地理范围（如城市、国家）。"}]}]}},{"number":"2","item_type":"reading","context_note":"Passage A","stem":"A girl is looking at the birds. She is _____.","options":{"A":"happy","B":"busy","C":"interesting","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题为推理判断题，需要根据描述推断人物的情感状态。题目描述“一个女孩正在看鸟”，这通常是一种轻松愉快的休闲活动。文章中很可能通过“脸上带着微笑 (with a smile)”或“愉快地 (happily)”等细节来暗示她的心情。选项A `happy` (开心的) 最符合这种情景。选项B `busy` (忙碌的) 和选项C `interesting` (有趣的，常用于形容事物或人本身有意思) 与“看鸟”这一休闲活动的常见情感不符。","knowledge_expansion_md":"### 形容词辨析：-ing vs. -ed\n\n很多学生容易混淆以 `-ing` 和 `-ed` 结尾的形容词。\n\n- **-ing 形容词**: 描述事物或人的特质，表示“令人...的”，具有主动意义。\n  - `interesting` (有趣的，令人感兴趣的): `The book is interesting.` (这本书很有趣。)\n  - `exciting` (令人兴奋的): `The game is exciting.` (比赛很刺激。)\n\n- **-ed 形容词**: 描述人的感受或状态，表示“感到...的”，具有被动意义。\n  - `interested` (感兴趣的): `I am interested in the book.` (我对这本书感兴趣。)\n  - `excited` (感到兴奋的): `The fans are excited.` (粉丝们很兴奋。)\n\n在本题中，`interesting` 用来形容女孩 `She is interesting`，意为“她是一个有趣的人”，而不是描述她看鸟时的感受。如果想表达她对鸟感兴趣，应该说 `She is interested in the birds`。","socratic_tracks":[{"title":"阅读策略：情感推断","steps":[{"question":"题目问女孩的感觉如何，但文章可能没有直接说 “She is happy”。我们怎么能知道她的感受呢？","hint":"我们可以从文章对她行为或表情的描述中寻找线索。","takeaway":"阅读理解不仅要看懂字面意思，还要根据文中的线索（如动作、表情、语气）进行合理的推断。"},{"question":"比如，如果文章说她“脸上带着微笑”(with a smile on her face)，或者她在“唱歌”(singing)，这通常暗示了什么情绪？","hint":"微笑和唱歌通常是开心、难过还是忙碌的表现？","takeaway":"描述性的细节（如微笑、唱歌、哭泣）是推断人物情感的关键线索。"}]},{"title":"词义辨析：描述人与物","steps":[{"question":"选项 A `happy` 和 B `busy` 都是形容人的状态或感觉。那 C `interesting` 呢？它和前两者有什么不同？","hint":"`interesting` 是说她“感到有趣”还是她“这个人很有趣”？","takeaway":"描述人的情感状态要用 `happy`, `sad` 等词，而 `interesting` 通常用来评价人或事物的特质，意为“令人感兴趣的”。"},{"question":"如果我们想说“她对鸟儿很感兴趣”，应该用 `interesting` 还是 `interested`？为什么？","hint":"哪个词是描述人的感受（感到...的），哪个词是描述事物的属性（令人...的）？","takeaway":"`-
