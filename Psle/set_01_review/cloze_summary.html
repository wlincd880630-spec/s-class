<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第01套 · 词汇词组句型总结与练习</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef3f0; --card: #fbfcfa; --ink: #1c2420; --muted: #5c6860;
      --accent: #2d6a4f; --accent-soft: #d8f3e3; --border: #c8d5cc;
      --shadow: rgba(28, 36, 32, 0.07); --ok: #1b7a45; --bad: #a33a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(800px 360px at 0% 0%, rgba(149,213,178,.35), transparent 55%),
        linear-gradient(145deg, #e4ebe6, var(--bg) 45%, #dde8e2);
      line-height: 1.55; min-height: 100vh;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
    a.back { color: var(--accent); font-weight: 700; text-decoration: none; font-size: .92rem; }
    a.back:hover { text-decoration: underline; }
    .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-top: 1rem; }
    h1 { font-family: "Literata", Georgia, serif; font-size: clamp(1.4rem, 3.5vw, 1.9rem); margin: .35rem 0 .55rem; }
    .lead { color: var(--muted); margin: 0 0 1rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.1rem;
      position: sticky; top: 0; z-index: 10; padding: .5rem 0;
      background: rgba(238,243,240,.92); backdrop-filter: blur(8px);
    }
    .btn {
      border: none; border-radius: 10px; padding: .48rem .9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; font-size: .86rem; text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #fff; color: var(--accent); border: 1px solid var(--border); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
    .progress { margin-left: auto; font-weight: 700; color: var(--accent); align-self: center; font-size: .9rem; }

    .unit {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.1rem 1.15rem 1.25rem; margin-bottom: 1rem;
      box-shadow: 0 8px 22px var(--shadow);
    }
    .unit-head {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem .65rem;
      margin-bottom: .55rem;
    }
    .unit-num {
      width: 1.7rem; height: 1.7rem; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: .82rem; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .unit-term {
      font-family: "Literata", Georgia, serif; font-size: 1.2rem; font-weight: 700; color: var(--accent);
    }
    .unit-tag {
      font-size: .72rem; font-weight: 700; letter-spacing: .04em;
      padding: .18rem .45rem; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    .unit-mean { margin: 0 0 .55rem; color: var(--ink); }
    .unit-tip { margin: 0 0 .85rem; font-size: .9rem; color: var(--muted); }
    .ex {
      background: #f4f8f5; border-left: 3px solid var(--accent);
      padding: .65rem .85rem; border-radius: 0 10px 10px 0; margin-bottom: .95rem;
    }
    .ex-label { font-size: .72rem; font-weight: 700; color: var(--accent); letter-spacing: .05em; margin-bottom: .2rem; }
    .ex-en { font-family: "Literata", Georgia, serif; font-size: 1.02rem; margin: 0; }
    .ex-zh { margin: .25rem 0 0; font-size: .88rem; color: var(--muted); }

    .practice {
      border: 1px solid var(--border); border-radius: 12px; padding: .8rem .85rem;
      margin-top: .7rem; background: #fbfcfa;
    }
    .practice h3 {
      margin: 0 0 .45rem; font-size: .92rem; color: var(--accent);
      font-family: "Literata", Georgia, serif;
    }
    .prompt { margin: 0 0 .55rem; font-size: .92rem; color: var(--muted); }
    .make-input {
      width: 100%; min-height: 2.8rem; resize: vertical;
      border: 1px solid var(--border); border-radius: 10px;
      padding: .55rem .7rem; font: inherit; line-height: 1.45;
    }
    .make-input:focus { outline: 2px solid rgba(45,106,79,.28); border-color: var(--accent); }
    .hint {
      display: none; margin-top: .55rem; padding: .55rem .7rem;
      background: #eef6f1; border-radius: 8px; font-size: .9rem;
    }
    .hint.show { display: block; }
    .hint strong { color: var(--accent); }

    .chips {
      display: flex; flex-wrap: wrap; gap: .4rem; margin: .35rem 0 .55rem; min-height: 2.2rem;
    }
    .chip {
      border: 1px solid var(--border); background: #fff; border-radius: 999px;
      padding: .35rem .7rem; font-weight: 600; font-size: .9rem; cursor: pointer;
      font-family: inherit; color: var(--ink);
    }
    .chip:hover { border-color: var(--accent); background: #f4f8f5; }
    .chip.used { opacity: .35; pointer-events: none; }
    .slot-box {
      min-height: 2.6rem; border: 1.5px dashed var(--border); border-radius: 10px;
      padding: .4rem .5rem; display: flex; flex-wrap: wrap; gap: .35rem;
      margin-bottom: .55rem; background: #fff;
    }
    .slot-box .chip { background: var(--accent-soft); border-color: #a7d4b8; }
    .slot-empty { color: var(--muted); font-size: .88rem; align-self: center; padding: .2rem .35rem; }
    .feedback { margin-top: .5rem; font-weight: 700; font-size: .9rem; min-height: 1.3em; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; }

    /* 纸质 PDF：屏幕隐藏，打印时显示 */
    .pdf-cover,
    .print-only,
    .print-word-hints,
    .print-lines,
    .print-answer-line { display: none; }

    @media print {
      @page { size: A4; margin: 14mm 12mm; }
      body {
        background: #fff !important;
        color: #000;
        font-size: 11pt;
        line-height: 1.45;
      }
      .wrap { max-width: none; padding: 0; margin: 0; }
      .toolbar, a.back, .actions, .chips, .slot-box, .feedback,
      .make-input, .hint, .progress, .screen-only { display: none !important; }
      .eyebrow { color: #000; margin-top: 0; letter-spacing: .04em; }
      h1 {
        font-size: 16pt; margin: .2rem 0 .4rem;
        border-bottom: 2px solid #000; padding-bottom: .35rem;
      }
      .lead { color: #333; font-size: 10.5pt; margin-bottom: .65rem; }
      .pdf-cover {
        display: block !important;
        margin: 0 0 .85rem; padding: 0 0 .55rem;
        border-bottom: 1px solid #999; font-size: 10.5pt;
      }
      .pdf-cover .row {
        display: flex; flex-wrap: wrap; gap: .55rem 1.4rem; margin-top: .4rem;
      }
      .pdf-cover .blank {
        display: inline-block; min-width: 7.5rem;
        border-bottom: 1px solid #000; height: 1.05em; vertical-align: bottom;
      }
      .unit {
        background: #fff !important; box-shadow: none !important;
        border: 1px solid #bbb !important; border-radius: 0 !important;
        padding: .65rem .7rem .75rem; margin-bottom: .7rem;
        break-inside: avoid; page-break-inside: avoid;
      }
      .unit-num {
        background: #fff !important; color: #000 !important;
        border: 1.5px solid #000; border-radius: 0; width: 1.45rem; height: 1.45rem;
        font-size: .78rem;
      }
      .unit-term { color: #000 !important; font-size: 12.5pt; }
      .unit-tag {
        background: #fff !important; color: #000 !important;
        border: 1px solid #666; border-radius: 0; font-size: .68rem;
      }
      .unit-mean { margin-bottom: .3rem; }
      .unit-tip { color: #333; margin-bottom: .45rem; font-size: 9.5pt; }
      .ex {
        background: #fff !important; border-left: 2px solid #000;
        border-radius: 0; padding: .4rem .55rem; margin-bottom: .55rem;
      }
      .ex-label { color: #000; }
      .ex-zh { color: #333; }
      .practice {
        background: #fff !important; border: 1px solid #ccc !important;
        border-radius: 0 !important; padding: .5rem .55rem; margin-top: .45rem;
      }
      .practice h3 { color: #000 !important; font-size: 10.5pt; margin-bottom: .3rem; }
      .prompt { color: #222; font-size: 10pt; margin-bottom: .35rem; }
      .print-only { display: block !important; }
      .print-word-hints {
        display: block !important;
        font-size: 10.5pt; line-height: 1.55;
        margin: .25rem 0 .4rem; padding: .4rem .5rem;
        border: 1px solid #999; background: #fff !important; color: #000;
      }
      .print-lines {
        display: block !important;
        border: none !important; border-bottom: 1.2pt solid #000 !important;
        height: 8.5mm; margin: 3px 0 5px; width: 100%;
      }
      .print-answer-line {
        display: block !important;
        border: none !important; border-bottom: 1.35pt solid #000 !important;
        min-height: 8mm; margin: .35rem 0 .15rem; width: 100%;
        position: relative; padding-left: 2em; box-sizing: border-box;
      }
      .print-answer-line::before {
        content: "答："; font-size: 10pt; color: #333;
        position: absolute; left: 0; bottom: 2px;
      }
    }
  </style>
</head>

  <script>
  const UNITS = [
    {
      term: "shop for",
      tag: "词组",
      mean: "为买……而购物（后面接要买的东西）",
      tip: "用法：shop for + 名词。想说“去买衣服”，用 shop for clothes，不是 shop clothes。",
      exampleEn: "Mum takes the boys to shop for clothes and school things.",
      exampleZh: "妈妈带男孩们去买衣服和文具。",
      makePrompt: "用 shop for 写一句：妈妈周末去商场买水果。",
      makeHint: "Mum goes to the shopping centre to shop for fruit at the weekend.",
      scramble: ["We", "shop", "for", "new", "shoes", "before", "school", "starts", "."],
      answer: "We shop for new shoes before school starts."
    },
    {
      term: "It takes ... to do",
      tag: "句型",
      mean: "做某事花费（某人）多少时间",
      tip: "用法：It takes (sb.) + 时间 + to do sth.。主语常用 It，不是人直接接 take 时间。",
      exampleEn: "It doesn't take a long time for the kids to go here and there.",
      exampleZh: "孩子们用不了多久就会到处乱跑。",
      makePrompt: "用 It takes ... to ... 写一句：我骑自行车到学校要十五分钟。",
      makeHint: "It takes me fifteen minutes to ride to school.",
      scramble: ["It", "takes", "her", "ten", "minutes", "to", "walk", "home", "."],
      answer: "It takes her ten minutes to walk home."
    },
    {
      term: "size",
      tag: "词汇",
      mean: "尺寸；号码（衣服、鞋等）",
      tip: "买衣服时说“不知道尺码”用 size。可以说 What's your size? / I don't know my size.",
      exampleEn: "Jim would like a new shirt, but he doesn't know his size.",
      exampleZh: "吉姆想要一件新衬衫，但他不知道自己的尺码。",
      makePrompt: "用 size 写一句：这双鞋对我来说尺码不对。",
      makeHint: "This pair of shoes is the wrong size for me.",
      scramble: ["Do", "you", "know", "your", "shirt", "size", "?"],
      answer: "Do you know your shirt size?"
    },
    {
      term: "thirsty",
      tag: "词汇",
      mean: "口渴的（形容词）",
      tip: "be thirsty = 口渴。口渴想喝水；饿了用 hungry。",
      exampleEn: "Bob is thirsty, so he buys three bottles of cola.",
      exampleZh: "鲍勃口渴了，所以他买了三瓶可乐。",
      makePrompt: "用 thirsty 写一句：跑步之后我很渴，想喝水。",
      makeHint: "After running, I am very thirsty and want some water.",
      scramble: ["The", "boys", "are", "thirsty", "after", "shopping", "."],
      answer: "The boys are thirsty after shopping."
    },
    {
      term: "on sale",
      tag: "词组",
      mean: "打折；促销",
      tip: "on sale = 打折卖。for sale = 待售（在卖）。两词别混。",
      exampleEn: "The cola bottles are on sale today.",
      exampleZh: "这些可乐今天打折。",
      makePrompt: "用 on sale 写一句：这些书包正在打折，很便宜。",
      makeHint: "These schoolbags are on sale and they are cheap.",
      scramble: ["The", "shoes", "are", "on", "sale", "this", "week", "."],
      answer: "The shoes are on sale this week."
    },
    {
      term: "look at",
      tag: "词组",
      mean: "看；注视（某物）",
      tip: "look at = 看正在眼前的东西；look for = 寻找丢失/未见的东西。",
      exampleEn: "Bob is looking at a pair of shoes.",
      exampleZh: "鲍勃正在看一双鞋。",
      makePrompt: "用 look at 写一句：请看黑板上的图片。",
      makeHint: "Please look at the picture on the blackboard.",
      scramble: ["Please", "look", "at", "the", "map", "carefully", "."],
      answer: "Please look at the map carefully."
    },
    {
      term: "happily",
      tag: "用法",
      mean: "高兴地；开心地（副词）",
      tip: "happy 是形容词；happily 是副词，常修饰动词：talk / smile / sing happily。",
      exampleEn: "Tom sees his classmate and talks with him happily.",
      exampleZh: "汤姆看见同学，开心地和他说话。",
      makePrompt: "用 happily 写一句：孩子们在公园里开心地玩耍。",
      makeHint: "The children play happily in the park.",
      scramble: ["They", "sing", "happily", "at", "the", "party", "."],
      answer: "They sing happily at the party."
    },
    {
      term: "choose",
      tag: "词汇",
      mean: "挑选；选择（从多个里选一个）",
      tip: "choose A from B = 从 B 中选 A。不是 show（展示）。",
      exampleEn: "Tom is choosing a schoolbag from different colours.",
      exampleZh: "汤姆正在从不同颜色中挑选书包。",
      makePrompt: "用 choose 写一句：我想选一件蓝色的外套。",
      makeHint: "I want to choose a blue coat.",
      scramble: ["She", "will", "choose", "a", "red", "pencil", "."],
      answer: "She will choose a red pencil."
    },
    {
      term: "afraid",
      tag: "词汇",
      mean: "害怕的；担心的",
      tip: "be afraid = 害怕。be afraid of sth. / be afraid to do sth.。",
      exampleEn: "Mum is afraid when she cannot find her boys.",
      exampleZh: "妈妈找不到孩子们时很害怕。",
      makePrompt: "用 afraid 写一句：小女孩晚上一个人在家会害怕。",
      makeHint: "The little girl is afraid when she stays at home alone at night.",
      scramble: ["Don't", "be", "afraid", "of", "speaking", "English", "."],
      answer: "Don't be afraid of speaking English."
    },
    {
      term: "write",
      tag: "词汇",
      mean: "写；书写",
      tip: "write 用笔写；say 用嘴说。可以说 write a rule / write a letter。",
      exampleEn: "Mum picks up a pen and writes a new rule.",
      exampleZh: "妈妈拿起笔，写下一条新规定。",
      makePrompt: "用 write 写一句：请在本子上写下你的名字。",
      makeHint: "Please write your name in your notebook.",
      scramble: ["Please", "write", "your", "name", "on", "the", "paper", "."],
      answer: "Please write your name on the paper."
    },
    {
      term: "pay ... for",
      tag: "词组",
      mean: "为……付款",
      tip: "人 + pay + 钱 + for + 物。主语是人，不是物。",
      exampleEn: "Mum pays a lot of money for the school things.",
      exampleZh: "妈妈为这些文具付了很多钱。",
      makePrompt: "用 pay ... for 写一句：他花了五十元买这本书。",
      makeHint: "He pays fifty yuan for this book.",
      scramble: ["I", "pay", "twenty", "yuan", "for", "the", "bag", "."],
      answer: "I pay twenty yuan for the bag."
    },
    {
      term: "look for",
      tag: "词组",
      mean: "寻找",
      tip: "找不到东西时用 look for；眼前看着某个东西用 look at。",
      exampleEn: "Mum is looking for Tom in the shopping centre.",
      exampleZh: "妈妈在商场里找汤姆。",
      makePrompt: "用 look for 写一句：我在找我的钥匙。",
      makeHint: "I am looking for my keys.",
      scramble: ["They", "are", "looking", "for", "their", "teacher", "."],
      answer: "They are looking for their teacher."
    },
    {
      term: "spend",
      tag: "词汇",
      mean: "花费（时间/金钱）——主语是人",
      tip: "sb. spends money/time on sth. / (in) doing sth.。人作主语。",
      exampleEn: "Mum spends a lot of money on school things.",
      exampleZh: "妈妈在文具上花了很多钱。",
      makePrompt: "用 spend 写一句：我每天花一小时做作业。",
      makeHint: "I spend one hour doing my homework every day.",
      scramble: ["She", "spends", "two", "hours", "on", "English", "every", "day", "."],
      answer: "She spends two hours on English every day."
    },
    {
      term: "cost",
      tag: "词汇",
      mean: "花费；值……钱——主语是物",
      tip: "sth. costs (sb.) money。物作主语，不能说 I cost 20 yuan。",
      exampleEn: "The schoolbag costs her fifty yuan.",
      exampleZh: "这个书包花了她五十元。",
      makePrompt: "用 cost 写一句：这双鞋花了我一百元。",
      makeHint: "These shoes cost me one hundred yuan.",
      scramble: ["The", "book", "costs", "twenty", "yuan", "."],
      answer: "The book costs twenty yuan."
    },
    {
      term: "quickly / easily",
      tag: "用法",
      mean: "快地 / 容易地（副词）",
      tip: "quick → quickly；easy → easily（改 y 为 i + ly）。副词修饰动词。",
      exampleEn: "Bob runs quickly. Tom finishes the work easily.",
      exampleZh: "鲍勃跑得很快。汤姆轻松完成工作。",
      makePrompt: "用 easily 写一句：这个问题我能很容易地回答。",
      makeHint: "I can answer this question easily.",
      scramble: ["Please", "write", "the", "words", "quickly", "."],
      answer: "Please write the words quickly."
    },
    {
      term: "write / cut / eat / see with",
      tag: "搭配",
      mean: "用……做某事（with + 工具）",
      tip: "write with a pen；cut with a knife；eat with chopsticks；see with your eyes。",
      exampleEn: "Please write with a pencil. We eat with chopsticks.",
      exampleZh: "请用铅笔写。我们用筷子吃饭。",
      makePrompt: "用 write with 写一句：孩子们用钢笔写字。",
      makeHint: "The children write with a pen.",
      scramble: ["We", "see", "with", "our", "eyes", "."],
      answer: "We see with our eyes."
    },
    {
      term: "drink / drank / drinking",
      tag: "时态",
      mean: "喝——原形 / 过去式 / 现在分词",
      tip: "drink → drank → drunk；现在进行时用 drinking。",
      exampleEn: "Bob is drinking cola now. He drank too much cola yesterday.",
      exampleZh: "鲍勃现在正在喝可乐。他昨天喝了太多可乐。",
      makePrompt: "用 drank 写一句：昨天他们喝了三瓶水。",
      makeHint: "They drank three bottles of water yesterday.",
      scramble: ["Look", "!", "He", "is", "drinking", "water", "now", "."],
      answer: "Look! He is drinking water now."
    }
  ];

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function norm(s) {
    return String(s)
      .trim()
      .replace(/\s+/g, " ")
      .replace(/\s+([?.!,])/g, "$1")
      .replace(/[?.!,]+$/g, "")
      .toLowerCase();
  }

  const storageKey = "psle-set01-summary-progress-v2";
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (e) {}

  function saveProgress() {
    localStorage.setItem(storageKey, JSON.stringify(progress));
    updateProgress();
  }

  function updateProgress() {
    const total = UNITS.length * 2;
    let n = 0;
    UNITS.forEach((_, i) => {
      if (progress[i + "-make"]) n++;
      if (progress[i + "-order"]) n++;
    });
    document.getElementById("progress").textContent = "完成 " + n + " / " + total;
  }

  function render() {
    const root = document.getElementById("units");
    root.innerHTML = "";
    UNITS.forEach((u, idx) => {
      const el = document.createElement("section");
      el.className = "unit";
      el.dataset.idx = String(idx);

      const bank = shuffle(u.scramble.map((w, i) => ({ w, i })));
      const printHints = bank.map((x) => x.w).join(" / ");

      el.innerHTML =
        '<div class="unit-head">' +
          '<span class="unit-num">' + (idx + 1) + "</span>" +
          '<span class="unit-term">' + esc(u.term) + "</span>" +
          '<span class="unit-tag">' + esc(u.tag) + "</span>" +
        "</div>" +
        '<p class="unit-mean">' + esc(u.mean) + "</p>" +
        '<p class="unit-tip">' + esc(u.tip) + "</p>" +
        '<div class="ex">' +
          '<div class="ex-label">例句</div>' +
          '<p class="ex-en">' + esc(u.exampleEn) + "</p>" +
          '<p class="ex-zh">' + esc(u.exampleZh) + "</p>" +
        "</div>" +
        '<div class="practice make">' +
          "<h3>① 造句练习</h3>" +
          '<p class="prompt">' + esc(u.makePrompt) + "</p>" +
          '<textarea class="make-input screen-only" rows="2" placeholder="在这里写出你的句子…"></textarea>' +
          '<div class="print-lines" aria-hidden="true"></div>' +
          '<div class="print-lines" aria-hidden="true"></div>' +
          '<div class="actions screen-only">' +
            '<button type="button" class="btn btn-secondary btn-show-hint">看参考句</button>' +
            '<button type="button" class="btn btn-primary btn-save-make">我写好了</button>' +
          "</div>" +
          '<div class="hint screen-only"><strong>参考：</strong> ' + esc(u.makeHint) + "</div>" +
        "</div>" +
        '<div class="practice order">' +
          "<h3>② 句子排序</h3>" +
          '<p class="prompt screen-only">点击下方单词，按正确顺序排出完整句子（可再点已选词撤销）。</p>' +
          '<p class="prompt print-only">根据单词提示，写出正确语序的完整句子。</p>' +
          '<div class="print-word-hints"><strong>单词提示：</strong>' + esc(printHints) + "</div>" +
          '<div class="print-answer-line" aria-hidden="true"></div>' +
          '<div class="slot-box screen-only" data-role="slot"><span class="slot-empty">点选单词组成句子…</span></div>' +
          '<div class="chips screen-only" data-role="bank"></div>' +
          '<div class="actions screen-only">' +
            '<button type="button" class="btn btn-primary btn-check-order">检查排序</button>' +
            '<button type="button" class="btn btn-ghost btn-reset-order">重置</button>' +
          "</div>" +
          '<div class="feedback screen-only" data-role="fb"></div>' +
        "</div>";

      const bankEl = el.querySelector('[data-role="bank"]');
      const slotEl = el.querySelector('[data-role="slot"]');
      const fbEl = el.querySelector('[data-role="fb"]');
      const makeInput = el.querySelector(".make-input");
      const hintEl = el.querySelector(".hint");

      if (progress[idx + "-make-text"]) makeInput.value = progress[idx + "-make-text"];

      const selected = [];

      function paintSlot() {
        slotEl.innerHTML = "";
        if (!selected.length) {
          slotEl.innerHTML = '<span class="slot-empty">点选单词组成句子…</span>';
          return;
        }
        selected.forEach((item, si) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = item.w;
          b.addEventListener("click", () => {
            selected.splice(si, 1);
            paintSlot();
            paintBank();
            fbEl.textContent = "";
            fbEl.className = "feedback";
          });
          slotEl.appendChild(b);
        });
      }

      function paintBank() {
        bankEl.innerHTML = "";
        bank.forEach((item) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (selected.includes(item) ? " used" : "");
          b.textContent = item.w;
          b.addEventListener("click", () => {
            if (selected.includes(item)) return;
            selected.push(item);
            paintSlot();
            paintBank();
            fbEl.textContent = "";
            fbEl.className = "feedback";
          });
          bankEl.appendChild(b);
        });
      }

      paintBank();
      paintSlot();

      el.querySelector(".btn-show-hint").addEventListener("click", () => {
        hintEl.classList.toggle("show");
      });

      el.querySelector(".btn-save-make").addEventListener("click", () => {
        const v = makeInput.value.trim();
        if (!v) {
          alert("先写出你的句子再点「我写好了」哦。");
          return;
        }
        progress[idx + "-make"] = true;
        progress[idx + "-make-text"] = v;
        saveProgress();
        hintEl.classList.add("show");
        el.querySelector(".btn-save-make").textContent = "已保存 ✓";
      });

      el.querySelector(".btn-check-order").addEventListener("click", () => {
        const got = selected.map((x) => x.w).join(" ").replace(/\s+([?.!,])/g, "$1");
        if (!selected.length) {
          fbEl.textContent = "先点选单词组成句子。";
          fbEl.className = "feedback bad";
          return;
        }
        if (norm(got) === norm(u.answer)) {
          fbEl.textContent = "排序正确！";
          fbEl.className = "feedback ok";
          progress[idx + "-order"] = true;
          saveProgress();
        } else {
          fbEl.textContent = "还不对，再试一次。提示：回想例句语序。";
          fbEl.className = "feedback bad";
        }
      });

      el.querySelector(".btn-reset-order").addEventListener("click", () => {
        selected.length = 0;
        paintSlot();
        paintBank();
        fbEl.textContent = "";
        fbEl.className = "feedback";
      });

      if (progress[idx + "-make"]) {
        el.querySelector(".btn-save-make").textContent = "已保存 ✓";
      }

      root.appendChild(el);
    });
    updateProgress();
  }

  render();

  document.getElementById("btnPdf").addEventListener("click", () => {
    window.print();
  });
  </script>
</body>
</html>
