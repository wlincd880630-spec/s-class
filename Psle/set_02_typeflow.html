<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 12pt;
      font-weight: 700;
      margin: 0 0 3mm;
      text-align: left;
    }
    .exam-direction {
      font-family: "SimSun", "Songti SC", serif;
      font-size: 10.5pt;
      margin: 0 0 2.5mm;
      text-indent: 2em;
    }
    .exam-subhead {
      font-weight: 700;
      font-size: 11pt;
      margin: 2mm 0 1.5mm;
    }
    /* 小标题/说明与正文框不分页（避免「标题在上页、正文在下页」） */
    .exam-passage-titled-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 4mm;
    }
    .exam-passage-titled-wrap .exam-direction {
      margin-bottom: 1mm;
    }
    .exam-passage-titled-wrap .exam-subhead {
      margin-bottom: 1mm;
    }
    /* 阅读/完形文章整块不跨页（过长时由浏览器在块前整体移到下一页） */
    .exam-passage-block {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px solid #222;
      text-align: justify;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exam-passage-block .exam-para {
      margin: 0 0 0.55em;
      text-indent: 2em;
    }
    .exam-passage-block .exam-para:first-child { margin-top: 0; }
    .exam-passage-block .exam-para:last-child { margin-bottom: 0; }
    .exam-word-bank {
      margin: 2mm 0 4mm;
      padding: 3mm 4mm;
      border: 1px dashed #000;

  <script type="application/json" id="exam-embed">{"school_or_title":"初一入学考试英语试卷 · 第02套","exam_meta":{"full_score_text":"满分：100分","time_text":"时间：60分钟"},"sections":[{"section_title":"I. 单项选择 (共30分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"The dinosaur is _____ the rabbit.","options":{"A":"bigger","B":"bigger than","C":"big","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词的比较级用法。\n句子中出现了“恐龙（dinosaur）”和“兔子（rabbit）”两个比较对象，因此需要使用形容词的比较级形式。\n形容词`big`的比较级是`bigger`。\n在比较两个事物时，标准的句型结构是“形容词比较级 + than”，意为“比……更……”。\n因此，空格处应填入`bigger than`，构成完整的比较句“The dinosaur is bigger than the rabbit.”（恐龙比兔子大）。","knowledge_expansion_md":"### 形容词比较级用法详解\n\n1.  **使用场景**：当比较两个人或事物在某方面程度的差异时，使用形容词的比较级。\n\n2.  **基本句型**：`主语A + be动词 + 形容词比较级 + than + 主语B`。\n\n3.  **构成规则**：\n    *   **单音节词**：\n        *   一般在词尾加 `-er`，如 `tall` → `taller`。\n        *   以不发音的 `e` 结尾，直接加 `-r`，如 `nice` → `nicer`。\n        *   重读闭音节（辅音+元音+辅音），双写末尾辅音再加 `-er`，如 `big` → `bigger`，`hot` → `hotter`。\n    *   **双音节词**：\n        *   以 `-y` 结尾，变 `y` 为 `i` 再加 `-er`，如 `happy` → `happier`。\n        *   其他多数双音节词和所有多音节词，在词前加 `more`，如 `beautiful` → `more beautiful`。\n    *   **不规则变化**：需要特殊记忆，如 `good` → `better`，`bad` → `worse`，`many/much` → `more`。\n\n4.  **常见错误**：\n    *   在比较级后忘记加 `than`，如：`He is taller me.` (错误)\n    *   在 `more` 形式的比较级后又加 `-er`，如：`This book is more interestinger.` (错误)","socratic_tracks":[{"title":"比较级结构","steps":[{"question":"这个句子是在描述一个东西，还是在比较两个东西？","hint":"看看句子中提到了几种动物？","takeaway":"句子中提到了恐龙和兔子，是在进行比较。"},{"question":"当比较两个事物时，形容词应该用什么形式？","hint":"比如，比较你和你的朋友谁更高，你会说 'I am tall... your friend' 还是 'I am taller than your friend'?","takeaway":"比较两者时，需要使用形容词的比较级形式。"},{"question":"形容词 'big' 的比较级是什么？完整的比较结构又是什么样的？","hint":"比较级后面通常会跟一个词来引出比较的对象。","takeaway":"big的比较级是bigger，完整的比较结构是 'bigger than'。"}]},{"title":"选项辨析","steps":[{"question":"我们来看A选项 'bigger'。如果填入句子变成 'The dinosaur is bigger the rabbit.'，你觉得通顺吗？缺少了什么？","hint":"这句话翻译成中文是‘恐龙是更大 兔子’，听起来对吗？","takeaway":"单独使用 'bigger' 缺少了连接词 'than'，无法构成完整的比较句。"},{"question":"再看C选项 'big'。如果填入句子变成 'The dinosaur is big the rabbit.'，这又是什么问题？","hint":"'big' 是形容词原级，通常用来描述单个事物，比如 'The dinosaur is big.'。","takeaway":"形容词原级不能直接用于比较两个事物。"},{"question":"为什么B选项 'bigger than' 是最合适的？","hint":"它是否同时满足了‘比较级形式’和‘完整结构’这两个条件？","takeaway":"'bigger than' 既用了比较级，又带了 'than'，构成了完整的比较结构。"}]},{"title":"词义与逻辑","steps":[{"question":"句子中的 'dinosaur' (恐龙) 和 'rabbit' (兔子) 在体型上有什么区别？","hint":"想一想你看过的图片或电影，哪个动物更大？","takeaway":"根据常识，恐龙比兔子大得多。"},{"question":"所以，我们需要一个词来表达‘比……更大’的意思。哪个选项能表达这个意思？","hint":"逐个看选项，'bigger' 是‘更大’，'bigger than' 是‘比……更大’，'big' 是‘大’。","takeaway":"选项 'bigger than' 准确地表达了‘比……更大’的比较关系。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"We went to Hainan _____ the winter holiday.","options":{"A":"of","B":"over","C":"with","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查表示时间的介词用法。\n句意为“我们在寒假期间去了海南”。空格处需要一个介词来表示“在……期间”。\n`over` 在这里可以表示“在（假期、周末等）期间”，是一个固定搭配，如 `over the holiday`, `over the weekend`，强调度过了整个时间段。\n`of` 通常表示“……的”，用于表达所属关系，不符合句意。\n`with` 通常表示“和……一起”，用于表达伴随关系，不符合句意。\n因此，`over` 是最符合语境和习惯用法的答案。","knowledge_expansion_md":"### 表示时间的介词辨析\n\n英语中，表示时间的介词非常丰富，需要根据其后的时间名词来选择：\n\n1.  **in**: 用于较长的时间段。\n    *   年份、月份、季节：`in 2024`, `in May`, `in summer`\n    *   泛指的“在早上/下午/晚上”：`in the morning/afternoon/evening`\n\n2.  **on**: 用于具体某一天或特定日期。\n    *   星期：`on Monday`\n    *   具体日期：`on June 1st`\n    *   特定日子的早晚：`on Sunday morning`\n\n3.  **at**: 用于精确的时间点或某些固定短语。\n    *   具体时刻：`at 8 o'clock`\n    *   固定表达：`at noon` (在中午), `at night` (在夜晚), `at the weekend` (在周末，英式用法)\n\n4.  **during / over**: 都可表示“在……期间”，后接表示一段时间的名词。\n    *   `during` 强调事件发生在那个时间段之内。例：`He called during the meeting.` (他在会议期间打来电话。)\n    *   `over` 常用于假期、周末等，带有“度过”的意味。例：`What did you do over the summer holiday?` (你暑假期间做了什么？) `over the weekend` (在周末，美式用法居多)。\n\n5.  **易混淆点**：`on holiday` vs `in/during/over the holiday`\n    *   `on holiday` (不加`the`) 是一个固定短语，表示“在度假中”的状态。例：`They are on holiday in Spain.`\n    *   `in/during/over the holiday` (加`the`) 表示“在假期期间”这个时间状语。例：`We visited our grandparents over the holiday.`","socratic_tracks":[{"title":"介词功能辨析","steps":[{"question":"这个句子想表达什么意思？是‘我们和寒假一起去海南’，还是‘我们在寒假这段时间里去海南’？","hint":"句子的核心是‘去海南’这个动作发生的时间。","takeaway":"句子想表达的是动作发生的时间，即在寒假期间。"},{"question":"我们来分析一下选项。'with' 通常表示‘和...一起’，用在这里合适吗？","hint":"人可以和人一起，但可以和‘假期’一起去某个地方吗？","takeaway":"'with' 表示伴随，不适用于表示时间段，因此C不正确。"},{"question":"'of' 通常表示‘...的’，表示所属关系，用在这里合适吗？","hint":"比如 'the door of the room' (房间的门)。这里是‘寒假的我们’吗？","takeaway":"'of' 表示所属，不符合句意，因此A不正确。"},{"question":"那么'over'在这里是什么意思呢？它能表示‘在...期间’吗？","hint":"想一想你有没有听过 'What did you do over the weekend?' (你周末做了什么？)","takeaway":"'over' 可以用来表示在某个假期或时间段内，是本题的正确用法。"}]},{"title":"固定搭配","steps":[{"question":"在英语中，表示‘在假期里’，我们常用哪些介词？","hint":"除了 'over'，还有一个词和它意思很接近，以 'd' 开头。","takeaway":"我们常用 'during' 或 'over' 来表示‘在假期期间’。"},{"question":"既然 'over' 是一个常用搭配，你能再举一个使用 'over' 表示时间段的例子吗？","hint":"除了假期，还有一个我们经常度过的时间段，就是周末。","takeaway":"另一个常见的例子是 'over the weekend' (在周末期间)。"}]},{"title":"时间介词家族","steps":[{"question":"如果我们想说‘在五月’，应该用哪个介词？in, on, 还是 at?","hint":"月份是一段比较长的时间。","takeaway":"对于月份、年份、季节等较长的时间，我们用 'in'。"},{"question":"如果我们想说‘在星期一’，应该用哪个介词？","hint":"星期一是一个具体的天。","takeaway":"对于具体的某一天或日期，我们用 'on'。"},{"question":"如果我们想说‘在八点钟’，又该用哪个介词？","hint":"八点钟是一个精确的时间点。","takeaway":"对于具体的时间点，我们用 'at'。"},{"question":"这道题中的'the winter holiday'是一个时间点，还是一段持续的时间？","hint":"寒假是只有一瞬间，还是会持续很多天？","takeaway":"'the winter holiday' 是一段持续的时间，所以不能用 'at'，而 'over' 或 'during' 更合适。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"I will play _____ or play _____ in the afternoon.","options":{"A":"football; the basketball","B":"the piano; basketball","C":"piano; the football","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查冠词 `the` 在特定短语中的用法，主要涉及乐器和球类运动。\n英语中有一个固定的语法规则：\n1.  表达“弹奏某种乐器”时，乐器名词前必须加定冠词 `the`，构成 `play the + 乐器` 的结构。因此，应为 `play the piano`。\n2.  表达“进行某种球类运动或体育活动”时，运动名词前通常不加任何冠词，构成 `play + 球类运动` 的结构。因此，应为 `play basketball`。\n根据这两条规则，只有B选项 `the piano; basketball` 的用法是完全正确的。","knowledge_expansion_md":"### 冠词在特定短语中的用法总结\n\n冠词（`a`, `an`, `the`）的用法非常灵活，但在一些固定短语中，其使用与否是固定的，需要专门记忆。\n\n**一、必须使用定冠词 `the` 的情况**\n\n*   **弹奏乐器**：`play the piano`, `play the guitar`, `play the violin`。\n*   **独一无二的事物**：`the sun`, `the moon`, `the earth`, `the sky`。\n*   **方位名词**：`in the east`, `on the left`。\n*   **序数词和形容词最高级前**：`the first day`, `the best student`。\n*   **某些固定短语**：`in the morning/afternoon/evening`, `in the end`。\n\n**二、通常不使用冠词（零冠词）的情况**\n\n*   **球类、棋类运动**：`play football`, `play basketball`, `play chess`。\n*   **一日三餐**：`have breakfast`, `eat lunch`, `make dinner`。\n*   **学科名称**：`study English`, `like math`, `be good at history`。\n*   **大多数节日、星期、月份**：`at Christmas`, `on Monday`, `in July`。\n*   **交通方式**：`by bike`, `by bus`, `by car`, `on foot`。\n*   **泛指的复数名词或不可数名词**：`I like dogs.` (我喜欢狗这类动物), `Water is important.` (水是重要的)。\n\n**注意**：当这些名词被特指时，仍然需要加 `the`。例如：`The breakfast you made was delicious.` (你做的那顿早餐很好吃。)","socratic_tracks":[{"title":"乐器前的冠词","steps":[{"question":"当你想说‘弹钢琴’时，英语应该怎么表达？是 'play piano' 还是 'play the piano'？","hint":"在英语中，弹奏乐器是一个固定用法，乐器被看作是一种特定的物件。","takeaway":"在表示弹奏某种乐器时，乐器名称前需要加定冠词 'the'。"},{"question":"根据这个规则，我们来检查一下题目中的三个选项，哪几个选项关于钢琴的说法是正确的？","hint":"找到包含 'piano' 的选项，看看它前面有没有 'the'。","takeaway":"只有B选项中的 'play the piano' 是正确的用法。"}]},{"title":"球类运动前的冠词","steps":[{"question":"当你想说‘打篮球’时，英语应该怎么表达？是 'play basketball' 还是 'play the basketball'？","hint":"球类运动通常被看作是一种活动名称，而不是指某个特定的球。","takeaway":"在表示进行某种球类运动时，运动名称前通常不加冠词。"},{"question":"根据这个规则，我们再来检查一下题目中的三个选项，哪几个选项关于球类运动的说法是正确的？","hint":"找到包含 'football' 或 'basketball' 的选项，看看它们前面有没有 'the'。","takeaway":"A选项的 'play football' 和B选项的 'play basketball' 是正确的用法。"}]},{"title":"综合判断与排除","steps":[{"question":"我们已经知道了两个规则：'play the + 乐器' 和 'play + 球类'。现在我们用这两个规则来筛选答案。","hint":"一个选项必须同时满足两个部分的正确用法。","takeaway":"我们需要找到一个选项，前半部分符合乐器规则，后半部分符合球类规则。"},{"question":"我们来逐一排除。A选项 'football; the basketball' 错在哪里？","hint":"检查后半部分 'play the basketball'。","takeaway":"A选项后半部分错误，球类运动前不应加 'the'。"},{"question":"C选项 'piano; the football' 错在哪里？","hint":"这个选项两个部分都有问题。","takeaway":"C选项前半部分乐器前少了 'the'，后半部分球类运动前多了 'the'。"},{"question":"为什么B选项 'the piano; basketball' 是唯一正确的答案？","hint":"它是否完美地符合了我们总结的两条规则？","takeaway":"B选项 'play the piano' 和 'play basketball' 的用法完全正确，因此是正确答案。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"Before I couldn't ride a bike, but now I _____ to school by bike every weekend.","options":{"A":"go hiking","B":"go cycling","C":"go boating","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查动词短语的辨析和对上下文的理解。\n句子的前半部分“Before I couldn't ride a bike”意为“以前我不会骑自行车”。\n`but`表示转折，说明现在的情况与过去相反。后半句“now I _____ to school by bike every weekend”意为“但是现在我每个周末____骑自行车去学校”。\n空格处需要填入一个表示“骑自行车”的动作短语，来呼应后面的交通方式`by bike`。\n选项A `go hiking` 意为“去徒步旅行”。\n选项B `go cycling` 意为“去骑自行车（活动）”。\n选项C `go boating` 意为“去划船”。\n根据句意，只有`go cycling`符合逻辑，表示现在会骑车了，并且每个周末都进行这项活动。","knowledge_expansion_md":"### `go + V-ing` 结构详解\n\n`go + V-ing` 是一个非常常见的英语结构，通常用来表示**去进行某项体育运动或休闲活动**。这里的 `go` 是实义动词，后面的 `V-ing` 形式作宾语，但它更像一个固定的短语。\n\n**1. 常见搭配**：\n*   **户外运动**：`go hiking` (徒步), `go cycling` (骑行), `go running` (跑步), `go climbing` (爬山)\n*   **水上运动**：`go swimming` (游泳), `go fishing` (钓鱼), `go boating` (划船), `go surfing` (冲浪)\n*   **冰雪运动**：`go skiing` (滑雪), `go skating` (滑冰)\n*   **其他活动**：`go shopping` (购物), `go dancing` (跳舞)\n\n**2. 同义表达辨析**：\n*   `go cycling` vs. `ride a bike`\n    *   `go cycling` 更侧重于将骑行作为一种**运动或爱好**。例：`We go cycling in the park on Sundays.` (我们周日在公园骑车锻炼。)\n    *   `ride a bike` 既可以指运动，也可以单纯指**骑车这个动作或交通方式**。例：`I ride a bike to school every day.` (我每天骑自行车上学。)\n    *   在本题中，`I go cycling to school by bike` 语法上略有重复，但 `go cycling` 是选项中唯一正确的动作，可以理解为“我去学校的方式是骑行”。更自然的表达是 `I cycle to school` 或 `I ride my bike to school`。\n\n**3. 语法要点**：\n*   该结构中的 `go` 可以根据时态和人称进行变化，如 `goes`, `went`, `going`。\n*   例：`She goes swimming every morning.` (她每天早上去游泳。) `We went shopping yesterday.` (我们昨天去购物了。)","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"句子中有一个很重要的转折词 'but'。它连接了哪两个相反的情况？","hint":"看看 'but' 前后分别描述了什么时间点和什么能力？","takeaway":"'but' 连接了‘以前不会骑车’和‘现在会骑车’这两个相反的情况。"},{"question":"在句子的后半段，有一个关键短语 'by bike'，它是什么意思？","hint":"'by' 在这里是介词，表示交通方式。","takeaway":"'by bike' 的意思是‘通过骑自行车的方式’。"},{"question":"那么，空格里应该填入一个什么样的动作，才能和 'by bike' 的意思匹配？","hint":"这个动作应该和自行车有关。","takeaway":"空格处需要填入一个表示‘骑自行车’的动词短语。"}]},{"title":"词义辨析","steps":[{"question":"我们来看A选项 'go hiking'。'hike' 是什么意思？这项活动需要自行车吗？","hint":"'hiking' 通常是在山里或乡间走路。","takeaway":"'go hiking' 是徒步旅行，与自行车无关。"},{"question":"再看C选项 'go boating'。'boat' 是什么？这项活动在哪里进行？","hint":"'boat' 是小船，通常在水上活动。","takeaway":"'go boating' 是划船，与自行车无关。"},{"question":"最后看B选项 'go cycling'。'cycle' 作为动词是什么意思？","hint":"这个词和 'bicycle' (自行车) 很像。","takeaway":"'go cycling' 就是骑自行车，完全符合题意。"}]},{"title":"'go + V-ing' 句型拓展","steps":[{"question":"题目中的 'go cycling' 是一个 'go + 动词-ing' 形式的短语。你还能想到其他类似的短语吗？比如夏天去水里玩？","hint":"swim 的-ing形式是什么？","takeaway":"一个常见的例子是 'go swimming' (去游泳)。"},{"question":"如果冬天去雪地上玩呢？","hint":"滑雪的英文是 'ski'。","takeaway":"我们可以说 'go skiing' (去滑雪)。"},{"question":"这个 'go + V-ing' 结构通常用来表达什么样的活动？","hint":"想一想游泳、滑雪、骑行这些活动的共同点。","takeaway":"这个结构常用于表示去进行某项体育运动或休闲娱乐活动。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"—_____ you go to the supermarket yesterday?\n—No, I read books in the library.","options":{"A":"Did","B":"Do","C":"Does","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"句中的时间状语 `yesterday` (昨天) 表明动作发生在过去，因此整个句子应使用一般过去时。一般过去时的一般疑问句结构为：“Did + 主语 + 动词原形 + ...?”。题干中主语是 `you`，动词原形是 `go`，所以需要用助动词 `Did` 来引导问句。选项 `Do` 和 `Does` 用于一般现在时，不符合题意。因此，正确答案是 A。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n一般过去时用于表示过去某个时间发生的动作或存在的状态。\n\n**1. 标志词:**\n常见的过去时间状语有 `yesterday`, `last night`, `last week`, `two days ago`, `in 2010`, `just now` 等。\n\n**2. 句子结构:**\n*   **肯定句:** 主语 + 动词过去式 + ...\n    *   `I went to the supermarket yesterday.`\n*   **否定句:** 主语 + `didn't` (did not) + 动词原形 + ...\n    *   `I didn't go to the supermarket yesterday.`\n*   **一般疑问句:** `Did` + 主语 + 动词原形 + ...?\n    *   `Did you go to the supermarket yesterday?`\n\n**3. 易错点:**\n在构成否定句和疑问句时，一旦使用了助动词 `did` 或 `didn't`，后面的谓语动词必须使用**动词原形**，不能再用过去式。这是一个非常重要的规则，也是小升初考试中的高频考点。","socratic_tracks":[{"title":"抓住时间线索","steps":[{"question":"句子中哪个词告诉我们这件事是什么时候发生的？","hint":"看看句子的末尾，有没有表示时间的词？","takeaway":"句末的 `yesterday` (昨天) 是一个明确的过去时间标志。"},{"question":"既然是发生在过去的事情，我们应该用什么时态来提问呢？","hint":"表示现在的时态叫一般现在时，那表示过去的呢？","takeaway":"对于过去发生的动作，我们应该使用一般过去时。"}]},{"title":"一般过去时的问句结构","steps":[{"question":"在一般过去时中，当我们想问一个“是或不是”的问题时，句首应该用哪个词来引导？","hint":"想一想，一般现在时用 Do/Does，那过去时用什么呢？","takeaway":"一般过去时的一般疑问句需要用助动词 `Did` 开头。"},{"question":"用了助动词 `Did` 之后，后面的动词 `go` 应该用什么形式？","hint":"助动词已经承担了表示“过去”的任务，那么主动词还需要变化吗？","takeaway":"在含有 `Did` 或 `didn't` 的句子中，主动词必须使用原形。"}]},{"title":"辨析不同助动词","steps":[{"question":"选项 B 的 `Do` 和选项 C 的 `Does` 通常用在什么时态的问句里？","hint":"比如，我们平时会问 'Do you like apples?' 或 'Does he like apples?'","takeaway":"`Do` 和 `Does` 用于构成一般现在时的一般疑问句。"},{"question":"为什么这个题目不能用 `Do` 或者 `Does` 呢？","hint":"回顾一下我们第一步找到的时间线索是什么？","takeaway":"因为句中有 `yesterday`，表示过去，所以不能使用表示现在时态的 `Do` 或 `Does`。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"Miss Liu is so kind and funny. We all like _____.","options":{"A":"she","B":"her","C":"him","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"在句子 `We all like _____` 中，`like` (喜欢) 是一个及物动词，后面需要跟一个宾语来表示喜欢的对象。人称代词作宾语时，需要使用宾格形式。选项 A `she` 是主格，通常作主语。选项 B `her` 是宾格，可以作动词或介词的宾语。选项 C `him` 也是宾格，但它指代男性。根据第一句话可知，我们喜欢的对象是 `Miss Liu` (刘女士)，是女性，所以应该用指代女性的宾格 `her`。","knowledge_expansion_md":"### 人称代词的主格和宾格\n\n人称代词在句子中充当不同成分时，需要使用不同的“格”。这是英语语法的基础，也是易错点。\n\n**1. 主格 (Subjective Case):** 在句子中作主语，是动作的发出者。\n*   `I`, `you`, `he`, `she`, `it`, `we`, `they`\n*   例: `**She** is a teacher.` (她是一位老师。)\n\n**2. 宾格 (Objective Case):** 在句子中作宾语，是动作的承受者，通常放在及物动词或介词后面。\n*   `me`, `you`, `him`, `her`, `it`, `us`, `them`\n*   例: `We like **her**.` (我们喜欢她。) / `Listen to **me**.` (听我说。)\n\n**3. 判断方法 (主前宾后):**\n*   通常在动词**之前**的是主语，用主格。\n*   通常在动词或介词**之后**的是宾语，用宾格。\n\n**4. 易错点:**\n*   主格和宾格混淆，例如误用 `Me like English.` (应为 `I like English.`)。\n*   性别指代错误，例如用 `him` 指代女性。","socratic_tracks":[{"title":"分析句子成分","steps":[{"question":"在 'We all like _____' 这个句子中，谁是发出 'like' (喜欢) 这个动作的人？","hint":"是谁在喜欢？","takeaway":"`We` (我们) 是句子的主语，是动作的发出者。"},{"question":"那么，'like' (喜欢) 这个动作的对象是谁？横线处需要填什么成分？","hint":"我们喜欢的是谁？这个词是动作的承受者。","takeaway":"横线处需要填入被喜欢的人，也就是动作的宾语。"}]},{"title":"代词的格","steps":[{"question":"当人称代词在句子中作宾语时，它需要用什么形式？是主格还是宾格？","hint":"比如，我们说 'He likes me'，还是 'He likes I'？","takeaway":"人称代词作宾语时，必须使用宾格形式。"},{"question":"选项 A `she` 是主格还是宾格？选项 B `her` 呢？","hint":"回忆一下代词的变形：'I-me', 'he-him', 'she-?'","takeaway":"`she` 是主格，`her` 是宾格，所以我们应该在宾格中选择。"}]},{"title":"确定指代对象","steps":[{"question":"这个横线上要填的代词，指的是句子中的哪个人？","hint":"第一句话 'Miss Liu is so kind and funny.' 介绍了谁？","takeaway":"这个代词指的是 `Miss Liu`。"},{"question":"`Miss Liu` 是男性还是女性？","hint":"`Miss` 这个称呼通常用在什么性别的人名前？","takeaway":"`Miss Liu` 是女性。"},{"question":"那么，在选项 B `her` 和选项 C `him` 中，哪一个是指代女性的宾格代词？","hint":"`him` 对应的主格是 `he`，`her` 对应的主格是 `she`。","takeaway":"`her` 是指代女性的宾格形式，因此是正确答案。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"—What _____?\n—I fell off the wall last night.","options":{"A":"happen","B":"happened","C":"happening","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查一般过去时的特殊疑问句。根据答语 “I fell off the wall last night.” (我昨晚从墙上摔下来了)，我们可以判断问句是在询问一件过去发生的事情。答语中的 `fell` 是 `fall` 的过去式，`last night` (昨晚) 也是明确的过去时间标志。因此，问句也应该使用一般过去时。动词 `happen` (发生) 的过去式是 `happened`。在这个特殊疑问句中，`What` 本身就是作主语，询问“什么事情发生了”，所以直接用 “What + 动词过去式” 的结构。因此，正确的句子是 “What happened?”。","knowledge_expansion_md":"### `who`, `what`, `which` 作主语的特殊疑问句\n\n这是一个特殊的语法点，与普通特殊疑问句结构不同。\n\n**1. 标准结构 (疑问词作宾语/状语等):**\n*   疑问词 + 助动词(do/does/did) + 主语 + 动词原形 + ...?\n*   例: `What **did** you **do** last night?` (昨晚你做了什么？) 这里 `you` 是主语。\n\n**2. 特殊结构 (疑问词作主语):**\n*   疑问词(who/what/which) + 谓语动词 + ...?\n*   在这种结构中，因为疑问词本身就是主语，所以**不需要**助动词 `do/does/did`，谓语动词根据时态直接变化。\n*   **一般现在时:** `Who **likes** English?` (谁喜欢英语？)\n*   **一般过去时:** `What **happened**?` (发生了什么事？) / `Who **broke** the window?` (谁打破了窗户？)\n\n**3. 如何判断:**\n*   试着回答问题。如果回答的内容是疑问词所提问的对象，那么疑问词就是主语。\n*   问: `What happened?` 答: `An accident happened.` (`An accident` 回答了 `What`，所以 `What` 是主语)。\n*   问: `What did you see?` 答: `I saw an accident.` (`I` 是主语，`an accident` 是宾语，回答了 `What`，所以 `What` 是宾语)。","socratic_tracks":[{"title":"从回答找线索","steps":[{"question":"看到回答 'I fell off the wall last night'，你能找到哪些表示过去时间的线索？","hint":"看看动词和表示时间的词。","takeaway":"动词 `fell` (fall的过去式) 和时间状语 `last night` (昨晚) 都表明这是过去发生的事。"},{"question":"既然回答是关于过去的事情，那么提问 'What ____?' 应该用什么时态呢？","hint":"提问和回答的时态通常是匹配的。","takeaway":"问题也应该使用一般过去时来询问过去发生的事情。"}]},{"title":"动词形式的选择","steps":[{"question":"动词 'happen' (发生) 的一般过去时形式是什么？","hint":"它是一个规则动词，通常在词尾加什么？","takeaway":"`happen` 的过去式是 `happened`。"},{"question":"为什么不能选 'happen' (原形) 或 'happening' (现在分词)？","hint":"原形不能单独作谓语表示过去，而 'happening' 前面通常需要 be 动词 (如 is/was) 构成进行时态。","takeaway":"时态不符，`happen` 是原形，`happening` 缺少be动词，只有 `happened` 是一般过去时。"}]},{"title":"当What是主角时","steps":[{"question":"在 'What happened?' 这个问句里，是谁或者什么 'happen' (发生) 了？","hint":"我们是在问“什么事”发生了，还是在问“你”发生了？","takeaway":"我们问的是 'What' (什么事) 发生了，所以 'What' 在这里是句子的主语。"},{"question":"当疑问词 'What' 或 'Who' 自己当主语时，我们还需要助动词 'did' 吗？比如，是问 'What did happen?' 还是 'What happened?'","hint":"对比一下 'Who came?' (谁来了？) 和 'Who did you see?' (你看见谁了？)。","takeaway":"当疑问词作主语时，不需要助动词 `did`，直接在疑问词后面跟动词的过去式。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"You're _____ than me.","options":{"A":"old","B":"older","C":"big","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查形容词的比较级。句中的关键词 `than` (比) 是一个明确的标志，表明这是一个比较级的句子，用来比较两个人或事物。比较级的基本句型是：“主语 + be动词 + 形容词比较级 + than + 比较对象”。`old` (老的) 是形容词原级，其比较级形式是 `older`。选项 A `old` 和选项 C `big` 都是形容词原级，不能直接用在 `than` 前面。因此，为了构成一个完整的比较级句子，应该选择 `older`。完整的句子是 \"You're older than me.\" (你比我年龄大)。","knowledge_expansion_md":"### 形容词的比较级 (Comparative Adjectives)\n\n形容词的比较级用于比较两者之间的差异，标志词是 `than`。\n\n**1. 构成规则:**\n*   **单音节词:** 一般在词尾加 `-er` (e.g., `old` -> `older`, `tall` -> `taller`)。\n*   **以e结尾的单音节词:** 只加 `-r` (e.g., `nice` -> `nicer`)。\n*   **重读闭音节词 (元音+辅音结尾):** 双写末尾辅音字母，再加 `-er` (e.g., `big` -> `bigger`, `hot` -> `hotter`)。\n*   **以“辅音字母+y”结尾的双音节词:** 变 `y` 为 `i`，再加 `-er` (e.g., `happy` -> `happier`, `busy` -> `busier`)。\n*   **多音节词和部分双音节词:** 在词前加 `more` (e.g., `beautiful` -> `more beautiful`, `interesting` -> `more interesting`)。\n*   **不规则变化:** `good` -> `better`, `bad` -> `worse`, `many/much` -> `more`, `far` -> `farther/further`。\n\n**2. 易错点:**\n*   看到 `than` 却忘记使用比较级，误用原级。\n*   比较级的拼写错误，特别是双写规则和变y为i规则。\n*   将 `-er` 和 `more` 混用，例如 `more older` (错误)。","socratic_tracks":[{"title":"识别句子类型","steps":[{"question":"在句子 'You're _____ than me.' 中，有一个非常关键的词，它告诉我们这是一个什么类型的句子？","hint":"哪个词的意思是 '比...'？","takeaway":"关键词 `than` 表明这是一个比较句。"},{"question":"在比较两个人或事物的句子里，形容词应该使用什么形式？是原级、比较级还是最高级？","hint":"比如，'你比我高'，'高' 这个词应该怎么说？'tall' 还是 'taller'？","takeaway":"在含有 `than` 的比较句中，形容词必须使用比较级形式。"}]},{"title":"形容词的变形","steps":[{"question":"我们来看看选项 A 的 'old'。它的比较级形式是什么？","hint":"对于 'old' 这样的单音节词，我们通常在词尾加什么来变成比较级？","takeaway":"`old` 的比较级是 `older`。"},{"question":"那选项 C 的 'big' 呢？它的比较级是什么？为什么和 'old' 的变化有点不一样？","hint":"看看 'big' 的结尾 'i-g'，一个元音字母加一个辅音字母，这叫重读闭音节。","takeaway":"`big` 的比较级是 `bigger`，需要双写末尾的辅音字母再加-er。"}]},{"title":"排除错误选项","steps":[{"question":"为什么我们不能直接选 A 'old' 或者 C 'big' 填入 'You're _____ than me.' 这个句子？","hint":"回顾一下第一步，`than` 要求形容词是什么形式？","takeaway":"因为 `old` 和 `big` 都是形容词原级，而 `than` 前面必须用比较级。"},{"question":"那么，形容词原级 'old' 可以用在什么样的句子里呢？","hint":"比如，只是描述一个人的状态，或者说两个人一样大。","takeaway":"原级可以用于简单描述 (He is old.) 或同级比较 (He is as old as me.)。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"Bill _____ ill. He didn't _____ to school.","options":{"A":"was; go","B":"do; did","C":"is; go","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查时态的一致性以及助动词的用法。根据第二句中的 “didn't” 可知，整个句子描述的是过去发生的事情，因此时态应为一般过去时。第一空需要用 be 动词的过去式，主语 Bill 是第三人称单数，所以用 “was”。第二句是过去时的否定句，助动词 “didn't” 后面必须跟动词原形，所以用 “go”。综合来看，选择 A。","knowledge_expansion_md":"### 1. 一般过去时\n一般过去时用于描述过去某个时间发生的动作或存在的状态。时间状语常有 yesterday, last week, in 2010, ... ago 等。\n\n### 2. 助动词 did/didn't\n在一般过去时的否定句和疑问句中，我们需要借助助动词 `did`。其基本规则是“助动词后跟动词原形”。\n- **否定句**: `主语 + didn't + 动词原形 + ...` (e.g., He didn't come.)\n- **一般疑问句**: `Did + 主语 + 动词原形 + ...?` (e.g., Did you see him?)\n\n### 3. Be 动词的过去式\nBe 动词在一般过去时中有两种形式：`was` 和 `were`。\n- 当主语是第一人称单数 (I) 或第三人称单数 (he, she, it, Bill) 时，用 `was`。\n- 当主语是第二人称 (you) 或复数 (we, they, the students) 时，用 `were`。","socratic_tracks":[{"title":"时态一致性","steps":[{"question":"看到第二句话里的 “didn't”，你能判断出这句话描述的是什么时候发生的事情吗？","hint":"did 是哪个动词的过去式？","takeaway":"“didn't” 表明整个语境是过去时。"},{"question":"既然我们知道了是过去发生的事，那么第一句话描述 Bill 生病的状态，应该用什么时态呢？","hint":"是现在生病 (is) 还是过去生病 (was)？","takeaway":"为了保持上下文时态一致，第一句话也应该使用一般过去时。"},{"question":"主语 “Bill” 是第三人称单数，动词 “be” 的过去式应该用 “was” 还是 “were”？","hint":"回忆一下 be 动词的过去式用法：I/he/she/it 用 was，you/we/they 用 were。","takeaway":"主语是单数时，be动词的过去式用 was。"}]},{"title":"助动词 did 的用法","steps":[{"question":"在否定句 “He didn't _____ to school” 中，“didn't” 是一个什么词？它有什么作用？","hint":"它帮助主要动词构成否定形式，这类词叫什么？","takeaway":"“didn't” 是助动词，用来构成一般过去时的否定句。"},{"question":"助动词 “didn't” 后面跟的动词应该是什么形式？是过去式 (went) 还是原形 (go)？","hint":"记住口诀“助动词后用原形”。","takeaway":"助动词 did/didn't 后面必须跟动词原形。"}]},{"title":"选项排除法","steps":[{"question":"我们先看第二个空。在 “didn't” 后面，我们应该填 “go” 还是 “did”？为什么？","hint":"助动词后面动词要用什么形式？","takeaway":"“didn't” 后面必须用动词原形 “go”，所以可以排除选项 B。"},{"question":"剩下 A 和 C。它们第一个词分别是 “was” 和 “is”。根据第二句的 “didn't”，整个句子应该是什么时态？","hint":"“didn't” 是现在时还是过去时？","takeaway":"“didn't” 表示过去时，所以第一句也应该是过去时，因此排除使用 “is” 的选项 C。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"The boy eats _____ meat every day, so he is fat.","options":{"A":"many","B":"much","C":"a few","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查量词的用法。首先需要判断名词 “meat”（肉）是可数名词还是不可数名词。“meat” 是物质名词，属于不可数名词。在选项中，“many” 和 “a few” 都用来修饰可数名词，因此排除。 “much” 用来修饰不可数名词，表示“许多，大量”。根据后半句 “so he is fat”（所以他很胖）的语境，可以推断他吃了很多肉。因此，选择 “much” 符合语法和句意。","knowledge_expansion_md":"### 量词的分类与使用\n英语中的量词（Quantifiers）用来表示名词的数量，通常需要根据名词的可数性来选择。\n\n1.  **只修饰可数名词**: `many` (许多), `a few` (一些，几个), `few` (很少，几乎没有), `several` (几个), `a number of` (许多)。\n    *   e.g., `many` apples, `a few` students.\n\n2.  **只修饰不可数名词**: `much` (许多), `a little` (一些), `little` (很少，几乎没有), `a great deal of` (大量)。\n    *   e.g., `much` time, `a little` water.\n\n3.  **既可修饰可数名词也可修饰不可数名词**: `a lot of / lots of` (许多), `plenty of` (充足的), `some` (一些), `any` (任何)。\n    *   e.g., `a lot of` books, `a lot of` money.\n\n**易错点**: `much` 通常多用于否定句和疑问句中，在肯定句中更常用 `a lot of`。但在本题中，`much` 放在 `eats` 后面直接作宾语的修饰语，且为了强调数量之多，使用 `much` 是完全正确的。","socratic_tracks":[{"title":"名词的可数性","steps":[{"question":"题目中的名词 “meat” (肉) 是可数名词还是不可数名词？你能给它加上 -s 变成复数吗？","hint":"我们通常说 “some meat”，而不是 “one meat, two meats”。","takeaway":"“meat” 是一个不可数名词。"},{"question":"既然 “meat” 是不可数名词，那么在 A, B, C 三个选项中，哪些是用来修饰不可数名词的呢？","hint":"回忆一下 “many”, “much”, “a few” 分别修饰哪类名词。","takeaway":"“much” 用来修饰不可数名词，而 “many” 和 “a few” 用来修饰可数名词。"}]},{"title":"量词辨析","steps":[{"question":"“many”, “much”, “a few” 这三个词在意思上有什么区别？哪个表示“许多”，哪个表示“一些”？","hint":"“many” 和 “much” 都表示“多”，而 “a few” 表示“少量的，一些”。","takeaway":"“many” 和 “much” 意为“许多”，而 “a few” 意为“几个，一些”。"},{"question":"根据后半句 “so he is fat” (所以他很胖)，你觉得这个男孩吃的肉是多还是少？","hint":"肥胖通常和吃得“多”还是“少”有关？","takeaway":"句意表明男孩吃了很多肉。"},{"question":"结合上两步的分析，既要表示“许多”，又要修饰不可数名词 “meat”，我们应该选择哪个词？","hint":"哪个词同时满足“量大”和“修饰不可数”两个条件？","takeaway":"“much” 既表示量大，又可以修饰不可数名词，是正确答案。"}]},{"title":"常见量词搭配","steps":[{"question":"你能分别用 “many”, “much”, “a few” 造一个短语吗？比如 “many” 后面可以跟什么名词？","hint":"想想你身边可以用“个”来数的东西。","takeaway":"我们可以说 “many books” (许多书), “a few friends” (几个朋友)。"},{"question":"那 “much” 后面一般跟什么样的名词呢？比如时间、金钱、水。","hint":"这些名词通常没有复数形式。","takeaway":"我们可以说 “much time” (许多时间), “much money” (很多钱), “much water” (许多水)。"},{"question":"现在回到题目，“meat” 更像是 “books” 这类还是 “water” 这类？所以应该用哪个词来修饰？","hint":"“meat” 无法用具体的数字来数。","takeaway":"“meat” 属于不可数名词，因此应该用 “much” 来修饰。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"The children are _____ about the _____ football game. They're shouting _____ in the playground.","options":{"A":"excited; exciting; excitedly","B":"exciting; excited; excitedly","C":"excitedly; exciting; excited","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查-ed/-ing结尾的形容词以及副词的辨析。\n1.  第一个空描述孩子们(The children)的感受，主语是人，应用-ed结尾的形容词，意为“感到兴奋的”，所以是 `excited`。\n2.  第二个空修饰名词“足球比赛”(football game)，描述事物的性质，应用-ing结尾的形容词，意为“令人兴奋的”，所以是 `exciting`。\n3.  第三个空修饰动词“呐喊”(shouting)，说明动作的方式，需要用副词，意为“兴奋地”，所以是 `excitedly`。\n综上，正确答案为A。","knowledge_expansion_md":"### 词性辨析：-ed形容词, -ing形容词, 副词\n\n1.  **-ed 形容词**: 通常由动词的过去分词转化而来，用来**描述人或动物的感受、情绪**。可以理解为“感到...的”。\n    *   `I am interested in history.` (我对历史感兴趣。)\n    *   `The cat was frightened.` (那只猫受到了惊吓。)\n\n2.  **-ing 形容词**: 通常由动词的现在分词转化而来，用来**描述事物或人的性质、特征**，说明其“令人...的”。\n    *   `History is an interesting subject.` (历史是一门有趣的学科。)\n    *   `The noise was frightening.` (那噪音令人恐惧。)\n    *   **记忆口诀**: 人感-ed，物令-ing。\n\n3.  **副词 (-ly)**: 大多数副词由形容词加-ly构成，用来修饰动词、形容词、其他副词或整个句子，表示动作的方式、程度、时间、地点等。\n    *   `He speaks English fluently.` (他流利地说英语。) - 修饰动词\n    *   `She is extremely smart.` (她极其聪明。) - 修饰形容词","socratic_tracks":[{"title":"-ed/-ing 形容词辨析","steps":[{"question":"第一个空是描述孩子们的心情，还是描述他们本身具有的某种特质？","hint":"是孩子们“感到”兴奋，还是他们“令人”兴奋？","takeaway":"-ed 结尾的形容词通常用来描述人或动物的感受。"},{"question":"第二个空是描述足球比赛给人的感觉，还是描述足球比赛自身的感受？","hint":"一场比赛本身会有“感觉”吗？它应该是“怎么样”的比赛？","takeaway":"-ing 结尾的形容词通常用来描述事物或人的性质，说明其“令人...”。"},{"question":"所以，描述孩子们“感到兴奋”应该用哪个词？描述“令人兴奋的”比赛又该用哪个词？","hint":"记忆口诀：人感-ed，物令-ing。","takeaway":"孩子们是 “excited”，比赛是 “exciting”。"}]},{"title":"形容词与副词的功能","steps":[{"question":"看看第三个空，它前面的词是 “shouting” (呐喊)，这是一个动词。我们需要一个词来描述“怎样地”呐喊，应该用什么词性的词？","hint":"修饰动词的词是形容词还是副词？","takeaway":"副词用来修饰动词，说明动作发生的方式。"},{"question":"“excited”, “exciting”, “excitedly” 这三个词中，哪一个是副词？","hint":"副词通常有什么样的结尾？","takeaway":"以 -ly 结尾的 “excitedly” 是副词。"}]},{"title":"句子结构与词性","steps":[{"question":"在第一句话 “The children are _____” 中，“are” 是一个系动词，后面的词是做什么成分的？","hint":"系动词后面通常跟什么词来说明主语的状态？","takeaway":"系动词后跟形容词作表语，说明主语 “The children” 的状态。"},{"question":"在短语 “the _____ football game” 中，空格里的词是用来修饰哪个词的？","hint":"这个词放在名词 “game” 的前面。","takeaway":"空格里的词作定语，修饰名词 “game”。"},{"question":"在第三句话 “They're shouting _____” 中，空格里的词是修饰主语 “They” 还是修饰动词 “shouting”？","hint":"是“他们是兴奋的”还是“他们兴奋地喊叫”？","takeaway":"空格里的词作状语，修饰动词 “shouting”，说明动作的方式。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"Sandy is ill today. She only eats _____ rice and soup.","options":{"A":"a little","B":"many","C":"a few","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查量词的辨析。句中的名词 “rice”（米饭）和 “soup”（汤）都是物质名词，属于不可数名词。选项中，“many”（许多）和 “a few”（一些，几个）都只能用来修饰可数名词，因此不适用。而 “a little” 用来修饰不可数名词，表示“一点，少量”。根据句意 “Sandy今天病了。她只吃...”，可以推断她吃得很少。因此，选择 “a little” 最符合语法和语境。","knowledge_expansion_md":"### a little / little 与 a few / few 的辨析\n这四者都表示“少”，但用法和含义有细微差别。\n\n1.  **修饰对象不同**:\n    *   `a little` 和 `little` 修饰**不可数名词** (e.g., water, time, money)。\n    *   `a few` 和 `few` 修饰**可数名词复数** (e.g., books, friends, days)。\n\n2.  **感情色彩不同**:\n    *   带 `a` 的 (`a little`, `a few`) 具有**肯定**含义，表示“虽然不多，但还是有一些”。\n        *   `I have a little money, so I can buy a coffee.` (我有点钱，可以买杯咖啡。)\n    *   不带 `a` 的 (`little`, `few`) 具有**否定**含义，表示“很少，几乎没有”。\n        *   `I have little money, so I can't buy a coffee.` (我几乎没钱，买不了咖啡。)\n\n**总结**: 先判断名词可数与否，再根据语境判断是肯定还是否定含义。","socratic_tracks":[{"title":"名词的可数性","steps":[{"question":"题目中 Sandy 吃的东西是 “rice” 和 “soup”。请问这两个名词是可数的还是不可数的？","hint":"我们能说 “one rice, two rices” 或者 “one soup, two soups” 吗？","takeaway":"“rice” 和 “soup” 都是不可数名词。"},{"question":"既然是不可数名词，那么选项 A, B, C 中，哪些可以用来修饰不可数名词？","hint":"回忆一下 “many”, “a few”, “a little” 的用法规则。","takeaway":"“a little” 修饰不可数名词，而 “many” 和 “a few” 修饰可数名词。"}]},{"title":"语境与词义","steps":[{"question":"句子的第一部分说 “Sandy is ill today” (Sandy今天病了)。你觉得一个生病的人通常胃口怎么样？吃得多还是吃得少？","hint":"生病时，食欲通常会下降。","takeaway":"生病的人通常吃得很少。"},{"question":"句子中还有一个词 “only” (只，仅仅)。这个词暗示了她吃的量是多还是少？","hint":"“only” 带有“仅仅这么点”的意味。","takeaway":"“only” 强调了数量之少。"},{"question":"结合以上分析，我们需要一个表示“少量”的词，并且能修饰不可数名词，应该选择哪个？","hint":"“many” 是“许多”， “a few” 是“几个”， “a little” 是“一点点”。","takeaway":"“a little” 既表示少量，又能修饰不可数名词，完全符合语境。"}]},{"title":"a little 与 a few 的区别","steps":[{"question":"“a little” 和 “a few” 中文意思上很接近，都是“一点/一些”。它们在使用上最关键的区别是什么？","hint":"想一想它们后面跟的名词有什么不同。","takeaway":"“a little” 后面跟不可数名词，“a few” 后面跟可数名词复数。"},{"question":"请用 “a little” 和 “a few” 分别造一个短语。","hint":"一个用水，一个用苹果。","takeaway":"我们可以说 “a little water” (一点水) 和 “a few apples” (几个苹果)。"},{"question":"现在回到题目中的 “rice and soup”，它们更像 “water” 还是 “apples”？所以应该用哪个？","hint":"“rice” 和 “soup” 都是物质名词，无法单个计数。","takeaway":"“rice” 和 “soup” 是不可数名词，所以必须用 “a little”。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"—_____ you _____ a parrot show in the park yesterday?\n—Yes, that's interesting.","options":{"A":"Do; see","B":"Did; look at","C":"Did; watch","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"1.  **判断时态**：句中的时间状语 `yesterday` (昨天) 表明这是一个发生在过去的动作，因此疑问句需要用一般过去时。\n2.  **疑问句结构**：一般过去时的一般疑问句结构是 “Did + 主语 + 动词原形...?”。因此，第一个空应填 `Did`，第二个空应为动词原形。\n3.  **动词辨析**：`watch` 意为“观看，观赏”，通常指观看表演、比赛、电视等持续一段时间的活动。`look at` 意为“看”，强调看的动作。`see` 意为“看见”，强调看的结果。\n4.  **选择**：观看“鹦鹉表演 (a parrot show)” 是一种持续性的观赏活动，所以用 `watch` 最为恰当。综合判断，选择 C。","knowledge_expansion_md":"### 知识点拓展：see, look at, watch 的用法辨析\n\n这三个动词都与“看”有关，但在用法和含义上有明显区别，是考试中的高频考点。\n\n*   **`see`**\n    *   **含义**：看见，注意到。强调“看”的结果，常指无意识、偶然地看到。\n    *   **例句**：`I opened the curtains and saw snow outside.` (我拉开窗帘，看见了外面的雪。)\n    *   **固定搭配**：`see a film/movie` (看电影)，`see a doctor` (看病)。\n\n*   **`look at`**\n    *   **含义**：看，瞧。强调“看”的动作，指有意识地将目光投向某个目标。\n    *   **例句**：`Look at the picture on the wall.` (看墙上的那幅画。)\n    *   **注意**：`look` 是不及物动词，后面要加介词 `at` 才能接宾语。\n\n*   **`watch`**\n    *   **含义**：观看，注视。指聚精会神地、持续一段时间地观看移动或变化的东西。\n    *   **例句**：`We are watching a football match.` (我们正在看一场足球比赛。)\n    *   **适用对象**：电视(TV)、比赛(match/game)、表演(show/performance)等。","socratic_tracks":[{"title":"一般过去时疑问句","steps":[{"question":"句子中有一个词明确告诉我们事情发生的时间，是哪个词？","hint":"找一找表示“昨天”、“今天”或“明天”之类的词。","takeaway":"句中的 `yesterday` (昨天) 决定了整个句子要使用一般过去时。"},{"question":"在一般过去时中，如果要提问“你...了吗？”，句首应该用哪个助动词？","hint":"一般现在时用 `Do/Does`，那么过去时呢？","takeaway":"一般过去时的一般疑问句，无论主语是谁，都用助动词 `Did` 开头。"},{"question":"使用了助动词 `Did` 之后，后面的主要动词应该用什么形式？","hint":"想一想口诀：“前有 `did`，后跟原形”。","takeaway":"助动词 `Did` 出现后，后面的谓语动词必须使用原形。"}]},{"title":"三个“看”的辨析","steps":[{"question":"“看表演”这个动作，是强调“偶然看见”，还是强调“有意识地注视一个过程”？","hint":"看表演和看比赛、看电视类似，都是持续一段时间的活动。","takeaway":"观看表演、比赛等活动，强调的是一个持续观赏的过程。"},{"question":"`see`, `look at`, `watch` 这三个词中，哪一个最适合表达“持续观赏一个过程”？","hint":"我们常说 `watch TV`，这里的 `watch` 就是这个意思。","takeaway":"动词 `watch` 专门用来指聚精会神地观看动态的或持续进行的活动。"}]},{"title":"逻辑与语境","steps":[{"question":"对话的回答是 “Yes, that's interesting.” (是的，那很有趣)。这个回答暗示了提问者想知道的是什么？","hint":"回答者对表演内容做出了评价，说明他/她完整地看了表演。","takeaway":"回答暗示了提问者在询问对方是否完整地“观赏”了表演，而不仅仅是“看到”。"},{"question":"结合这个语境，`watch a show` (观看表演) 和 `see a show` (看见一个表演) 哪个更符合对话的意图？","hint":"`see` 可能只是瞥一眼，而 `watch` 才会有“有趣”的观后感。","takeaway":"从语境推断，使用 `watch`更能体现对话双方讨论的是观赏体验。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"The mouse _____ the lion _____ out from the net at last.","options":{"A":"help; get","B":"help; got","C":"helped; get","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"1.  **判断时态**：句末的短语 `at last` (最后，终于) 通常用于描述一个故事或事件的结局，表明整个动作发生在过去。因此，句子的主要谓语动词 `help` 应用一般过去时，即 `helped`。这可以排除 A 和 B 选项。\n2.  **掌握动词用法**：本题考察 `help` 的一个重要用法：`help sb. (to) do sth.`，意为“帮助某人做某事”。\n3.  **分析句子结构**：在这个句型中，`sb.` 后面的动词（即宾语补足语）可以用带 `to` 的不定式，也可以用不带 `to` 的动词原形。\n4.  **确定答案**：本句中，老鼠(The mouse)帮助狮子(the lion)“出来(get out)”，`get` 应使用动词原形。因此，第二个空填 `get`。综合来看，正确答案是 C。","knowledge_expansion_md":"### 知识点拓展：`help` 的用法及相关使役动词\n\n**1. `help` 的核心用法**\n\n*   `help sb. (to) do sth.` (帮助某人做某事)\n    *   这是 `help` 最常见的用法，后面的 `to` 可以省略，尤其在口语和美式英语中。省略 `to` 更为普遍。\n    *   例：`My brother helped me (to) finish my project.` (我哥哥帮我完成了我的项目。)\n*   `help sb. with sth.` (在某方面帮助某人)\n    *   `with` 后面跟名词，指明帮助的内容。\n    *   例：`Could you help me with my English?` (你能在英语方面帮帮我吗？)\n\n**2. 使役动词与感官动词 (宾补用动词原形)**\n\n`help` 属于半使役动词。英语中还有一类动词，要求其后的宾语补足语必须使用不带 `to` 的动词原形。可以记一个口诀：“**三使四看一听半帮助**”。\n\n*   **三使**：`make` (使，迫使), `let` (让), `have` (叫，让)\n    *   `The teacher made him stand up.` (老师让他站起来。)\n*   **四看**：`see`, `watch`, `notice`, `observe` (看见，观察到)\n    *   `I saw him cross the street.` (我看见他穿过了马路。)\n*   **一听**：`hear`\n    *   `Did you hear someone open the door?` (你听见有人开门了吗？)\n*   **半帮助**：`help` (其后的 `to` 可有可无)\n\n**注意**：当这些动词用于被动语态时，原来省略的 `to` 需要被还原。例如：`He was made to stand up.`","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"句子结尾的 `at last` (最后) 这个词组，通常暗示事件发生在什么时候？","hint":"它和 `in the end` 意思相近，常用于故事的结尾，总结已经发生的事情。","takeaway":"`at last` 表明整个事件发生在过去，所以句子要用一般过去时。"},{"question":"既然是过去时，那么第一个动词 `help` 应该变成什么形式？","hint":"思考 `help` 的过去式是什么。","takeaway":"在一般过去时中，谓语动词 `help` 应使用其过去式 `helped`。"}]},{"title":"掌握 `help` 的句型","steps":[{"question":"我们常说“帮助某人做某事”，在英语中 `help` 后面应该怎么连接另一个动作？","hint":"比如“帮我开门”，是 `help me open the door` 还是 `help me opened the door`？","takeaway":"`help` 的经典句型是 `help somebody do something`。"},{"question":"在这个句型中，第二个动词除了用原形，还可以用哪种形式？","hint":"想一想不定式 `to do`。","takeaway":"`help somebody` 后面可以跟动词原形，也可以跟带 `to` 的不定式，即 `help sb. (to) do sth.`。"}]},{"title":"分析句子成分","steps":[{"question":"在这个句子中，谁是发出“帮助”这个动作的主体？","hint":"通常，一句话最开始的名词是主语。","takeaway":"句子的主语是 `The mouse` (老鼠)。"},{"question":"老鼠帮助的对象是谁？它帮助这个对象完成了什么动作？","hint":"找到 `help` 后面的名词（宾语）和动词（宾语补足语）。","takeaway":"老鼠帮助的对象是 `the lion` (狮子)，帮助它做的动作是 `get out` (出来)。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"We should _____ our homework first.","options":{"A":"finish","B":"finishes","C":"finished","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"1.  **识别关键词**：本题的关键点在于识别单词 `should`。\n2.  **理解词性**：`should` 是一个情态动词，意为“应该”，用于提出建议、表达责任或义务。\n3.  **掌握语法规则**：情态动词（如 `can`, `must`, `may`, `should` 等）有一个非常重要的语法规则：其后面必须跟动词原形（base form of the verb）。\n4.  **分析选项**：\n    *   A. `finish` 是动词原形。\n    *   B. `finishes` 是动词的第三人称单数形式。\n    *   C. `finished` 是动词的过去式或过去分词。\n5.  **得出结论**：根据“情态动词 + 动词原形”的规则，`should` 后面只能跟 `finish`。因此，正确答案是 A。","knowledge_expansion_md":"### 知识点拓展：情态动词 (Modal Verbs)\n\n情态动词是一类特殊的助动词，用来表达说话人的语气、情感、态度，如可能性、必要性、允许、建议等。它们有几个共同的特点：\n\n1.  **无人称和数的变化**：情态动词的形式是固定的，不会因为主语是第三人称单数而变化。例如：`I can`, `He can` (错误：`He cans`)。\n\n2.  **后跟动词原形**：情态动词后面必须跟不带 `to` 的动词原形。\n    *   `You must be quiet.` (你必须保持安静。)\n    *   `She may come later.` (她可能会晚点来。)\n\n3.  **构成否定和疑问**：\n    *   **否定句**：在情态动词后直接加 `not`。例如：`cannot` (can't), `should not` (shouldn't)。\n    *   **疑问句**：将情态动词提到主语之前。例如：`Can you swim?`\n\n4.  **常见的情态动词及其基本含义**：\n    *   `can/could`: 表示能力、许可 (“能，可以”)\n    *   `may/might`: 表示许可、可能性 (“可以，可能”)\n    *   `must`: 表示必须、必要性 (“必须”)\n    *   `should/ought to`: 表示建议、义务 (“应该”)\n    *   `will/would`: 表示意愿、将来 (“将要，愿意”)\n\n**易错点**：初学者最容易犯的错误就是在主语为第三人称单数时，忘记情态动词后跟动词原形的规则，而错误地在动词后加 `-s`。例如，错误地写出 `He should finishes his homework.`。","socratic_tracks":[{"title":"识别情态动词","steps":[{"question":"句子中的 `should` 是什么类型的词？它表达了什么样的语气或含义？","hint":"这个词和 `can` (能), `must` (必须) 属于同一类词，用来表达建议、能力等。","takeaway":"`should` 是一个情态动词，意思是“应该”，用来提出建议。"}]},{"title":"掌握情态动词的规则","steps":[{"question":"像 `should`, `can`, `must` 这样的情态动词，它们后面连接的动词应该使用什么形式？","hint":"回忆一下你说“我会游泳”时，是说 `I can swim` 还是 `I can swims`？","takeaway":"情态动词后面必须跟动词原形，这是一个固定规则。"},{"question":"那么，在 `finish`, `finishes`, `finished` 这三个选项中，哪一个是动词原形？","hint":"动词原形就是它在字典里的基本形态，没有任何时态、人称或语态的变化。","takeaway":"`finish` 是动词原形，因此是本题的正确选择。"}]},{"title":"排除法应用","steps":[{"question":"我们来看选项 B `finishes`。这个形式通常在什么情况下使用？","hint":"想一想一般现在时，当主语是 `he`, `she`, `it` 的时候。","takeaway":"`finishes` 是动词的第三人称单数形式，用于一般现在时，但不能跟在情态动词后面。"},{"question":"那选项 C `finished` 呢？它又是什么形式，通常用在什么时态里？","hint":"比如描述昨天做完的事：`I finished my homework yesterday.`","takeaway":"`finished` 是动词的过去式，用于一般过去时，同样不能跟在情态动词后面。"}]}]}}]},{"section_title":"II. 用单词的适当形式填空 (共30分)","section_instruction":"","items":[{"number":"16","item_type":"fill_blank","context_note":"","stem":"_____ (do) you go swimming? —Yes, I did.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Did","explanation_md":"1.  **分析句子类型**：这是一个一问一答的对话，问句部分不完整，需要填空。\n2.  **寻找关键线索**：解题的关键在于答语 “Yes, I did.”。\n3.  **判断时态**：答语中的 `did` 是助动词 `do` 的过去式。简略回答中使用 `did`，表明问句所询问的动作发生在过去，因此问句必须使用一般过去时。\n4.  **应用语法规则**：一般过去时的一般疑问句结构为：“Did + 主语 + 动词原形...?”。\n5.  **完成填空**：题干中已经有主语 `you` 和动词原形 `go`，因此，句首的助动词应该填 `Did`。","knowledge_expansion_md":"### 知识点拓展：通过答语判断问句时态和形式\n\n在英语对话填空中，答语往往是判断问句形式和时态的最直接线索。学会从答语反推问句是重要的解题技巧。\n\n**1. 一般疑问句的问与答**\n\n| 答语形式 | 问句时态 | 问句助动词 | 示例 |\n| :--- | :--- | :--- | :--- |\n| `Yes, I do.` / `No, I don't.` | 一般现在时 | `Do` | `Do you like apples?` |\n| `Yes, he does.` / `No, he doesn't.` | 一般现在时 | `Does` | `Does he play football?` |\n| `Yes, I did.` / `No, I didn't.` | 一般过去时 | `Did` | `Did you go to the park?` |\n| `Yes, I am.` / `No, I'm not.` | 现在进行时 | `Are` | `Are you reading a book?` |\n| `Yes, he was.` / `No, he wasn't.` | 过去进行时 | `Was` | `Was he sleeping?` |\n| `Yes, I can.` / `No, I can't.` | 包含情态动词 | `Can` | `Can you help me?` |\n\n**2. 核心规律**\n\n*   简略回答用什么助动词（或be动词、情态动词），一般疑问句的句首就用相应的动词。\n*   注意回答中的人称 `I` 对应问句中的 `you`，回答中的 `we` 也可能对应问句中的 `you`。\n*   本题答语是 `Yes, I did.`，直接告诉我们问句应该以 `Did` 开头。","socratic_tracks":[{"title":"从回答反推问题","steps":[{"question":"看到回答是 “Yes, I did.”，你首先注意到了哪个词？","hint":"这个回答里有一个非常关键的助动词。","takeaway":"回答中的 `did` 是最重要的线索。"},{"question":"这个 `did` 告诉我们提问者问的是关于什么时候的事情？","hint":"`did` 是 `do` 的现在式还是过去式？","takeaway":"`did` 表明这是一个关于过去动作的问答，所以问句要用一般过去时。"}]},{"title":"一般过去时疑问句结构","steps":[{"question":"既然我们知道了要用一般过去时提问，那么这种一般疑问句的结构是怎样的？","hint":"句首用什么词？主语后面的动词用什么形式？","takeaway":"一般过去时的一般疑问句结构是 “Did + 主语 + 动词原形...?”。"},{"question":"对照这个结构，看看题目中的句子 `_____ you go swimming?`，横线上应该填什么？","hint":"句子已经有了主语 `you` 和动词原形 `go`，还缺少什么成分？","takeaway":"句子缺少位于句首的助动词 `Did`。"}]},{"title":"助动词 `do` 的变形","steps":[{"question":"括号里给了提示词 `(do)`。这个词在构成疑问句时有很多形式，比如 `Do`, `Does`, `Did`。我们应该如何选择？","hint":"选择的依据是时态和主语人称。","takeaway":"时态决定了是用现在时 (`Do/Does`) 还是过去时 (`Did`)。"},{"question":"根据我们刚才从答语中得到的时态信息，应该选择 `do` 的哪种形式？","hint":"答语是 `I did`，问句和答语的时态应该保持一致。","takeaway":"因为是过去时，所以助动词 `do` 应该使用其过去式 `Did`。"}]}]}},{"number":"17","item_type":"fill_blank","context_note":"","stem":"My father is 2 years _____ (young) than my mother.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"younger","explanation_md":"该句中出现了关键词 `than`，表示“比”，这是比较级的典型标志。因此，需要将括号内的形容词 `young`（年轻的）变为其比较级形式。`young` 是一个单音节形容词，其比较级的构成规则是在词尾直接添加 `-er`。所以，正确的填空形式是 `younger`。整个句子的意思是“我爸爸比我妈妈年轻两岁”。","knowledge_expansion_md":"### 形容词比较级的构成规则\n\n1.  **单音节词和少数双音节词**：通常在词尾加 `-er`。\n    *   例如：`tall` → `taller`, `long` → `longer`, `clever` → `cleverer`。\n2.  **以不发音的 `e` 结尾的词**：直接加 `-r`。\n    *   例如：`nice` → `nicer`, `large` → `larger`。\n3.  **重读闭音节且末尾为“一元一辅”的词**：双写末尾的辅音字母，再加 `-er`。\n    *   例如：`big` → `bigger`, `hot` → `hotter`, `thin` → `thinner`。\n4.  **以“辅音字母 + y”结尾的词**：变 `y` 为 `i`，再加 `-er`。\n    *   例如：`heavy` → `heavier`, `happy` → `happier`。\n5.  **多音节词和部分双音节词**：在词前加 `more`。\n    *   例如：`beautiful` → `more beautiful`, `interesting` → `more interesting`。\n6.  **不规则变化**：需要特殊记忆。\n    *   `good/well` → `better`, `bad/ill` → `worse`, `many/much` → `more`, `little` → `less`, `far` → `farther/further`。","socratic_tracks":[{"title":"识别比较级标志","steps":[{"question":"在这个句子中，有没有哪个词暗示了我们需要进行比较？","hint":"请注意空格后面的单词 `than`，它在英语中通常有什么作用？","takeaway":"单词 `than` 是构成比较级句子的核心标志，意为“比……”。"}]},{"title":"形容词比较级变形","steps":[{"question":"既然确定了是比较级，那么形容词 `young` 应该如何变化？","hint":"回想一下，像 `young` 这样的单音节形容词，变成比较级是加 `-er` 还是在前面加 `more`？","takeaway":"对于单音节形容词，其比较级形式通常是在词尾直接加上 `-er`。"}]},{"title":"句意理解与应用","steps":[{"question":"“My father is 2 years younger than my mother.” 这句话的中文意思是什么？","hint":"`younger than` 的意思是“比……年轻”。`2 years` 是具体的年龄差距。","takeaway":"理解比较级句子的含义是准确运用语法的前提。"},{"question":"如果我们想反过来说，“我妈妈比我爸爸大两岁”，应该用 `old` 这个词怎么表达？","hint":"`old` 的比较级是什么？句子结构和原句非常相似。","takeaway":"掌握比较级能让我们从不同角度灵活地描述事物间的差异。"}]}]}},{"number":"18","item_type":"fill_blank","context_note":"","stem":"—How _____ is he? —1.75 metres. He's _____ than you. (tall)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"tall|taller","explanation_md":"这是一组对话，包含两个填空。第一个空是提问句，根据回答“1.75 metres”（1.75米），可知是在询问身高，固定搭配是 `How tall`。因此第一个空填 `tall`。第二个空所在的句子 `He's _____ than you.` 中有比较级的标志词 `than`，表示“他比你……”，因此需要使用形容词 `tall` 的比较级。`tall` 是单音节词，比较级是在词尾加 `-er`，变为 `taller`。所以两个空依次填 `tall` 和 `taller`。","knowledge_expansion_md":"### `How` + 形容词/副词的特殊疑问句\n\n`How` 可以与多种形容词或副词连用，对事物的特定属性或程度进行提问，构成常见的特殊疑问句句型：\n\n*   `How tall ...?` (问身高)\n*   `How old ...?` (问年龄)\n*   `How heavy ...?` (问体重)\n*   `How long ...?` (问长度或时长)\n*   `How far ...?` (问距离)\n*   `How much ...?` (问价格或不可数名词的数量)\n*   `How many ...?` (问可数名词的数量)\n*   `How often ...?` (问频率)\n\n### 比较级核心句型\n`主语 + be动词/系动词 + 形容词比较级 + than + 比较对象` 是最基础和核心的比较级句型。例如：`He is taller than you.`","socratic_tracks":[{"title":"提问身高的句型","steps":[{"question":"看到回答是 “1.75 metres”，这是在描述一个人的什么特征？","hint":"“metres”（米）是长度单位，通常用来衡量身高。","takeaway":"根据答语中的单位或信息，可以反推出问句所提问的内容。"},{"question":"在英语中，我们用哪个固定的疑问词组来询问身高？","hint":"想一想我们学过的 `How old` 问年龄，`How much` 问价格。","takeaway":"用 `How tall` 来提问身高是一个固定搭配。"}]},{"title":"比较级的判断与构成","steps":[{"question":"在第二个句子 `He's _____ than you.` 中，哪个词告诉我们这里需要进行比较？","hint":"注意 `than` 这个词，它在比较句中起着关键作用。","takeaway":"`than` 是比较级的标志词，看到它就要想到使用形容词的比较级形式。"},{"question":"那么，`tall` 这个词的比较级应该怎么写？","hint":"`tall` 是一个单音节词，它的变化规则是什么？","takeaway":"单音节形容词 `tall` 的比较级是在词尾加 `-er`，变成 `taller`。"}]},{"title":"原级与比较级的区别","steps":[{"question":"为什么同一个词 `tall`，在第一个空填原形，在第二个空却要填比较级 `taller`？","hint":"分析一下这两个空所在的句子结构有什么不同？一个是在 `How ...?` 句型中作表语，一个是在 `... than ...` 句型中作表语。","takeaway":"形容词的形式取决于其在句子中的语法功能，提问属性时用原级，进行比较时用比较级。"}]}]}},{"number":"19","item_type":"fill_blank","context_note":"","stem":"Chen Jie is _____ (heavy) than Amy.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"heavier","explanation_md":"句中的 `than` 是一个明确的信号，表明这是一个比较句，意为“陈洁比艾米……”。因此，我们需要将括号中的形容词 `heavy`（重的）转换成其比较级形式。`heavy` 是一个以“辅音字母 + y”结尾的双音节词。根据语法规则，这类形容词在变为比较级时，需要先将词尾的 `y` 变为 `i`，然后再加 `-er`。所以，`heavy` 的比较级是 `heavier`。","knowledge_expansion_md":"### 以 `-y` 结尾的形容词变比较级/最高级\n\n这是一个常见的拼写变化规则，需要特别注意：\n\n1.  **辅音字母 + y**：变 `y` 为 `i`，再加 `-er` (比较级) / `-est` (最高级)。\n    *   `heavy` → `heavier` → `heaviest`\n    *   `busy` → `busier` → `busiest`\n    *   `happy` → `happier` → `happiest`\n    *   `easy` → `easier` → `easiest`\n    *   `early` → `earlier` → `earliest`\n\n2.  **元音字母 + y**：直接加 `-er` / `-est`。（这种情况较少见）\n    *   `grey` → `greyer` → `greyest`\n\n**易错点**：学生在初学时容易忘记变 `y` 为 `i`，直接写成 `heavyer`，这是错误的。一定要记住“辅音+y，变y为i”这个口诀。","socratic_tracks":[{"title":"识别比较句结构","steps":[{"question":"这个句子是在单纯描述陈洁，还是在将她和艾米进行比较？你是从哪个词看出来的？","hint":"句子中有一个词连接了“陈洁”和“艾米”这两个比较对象。","takeaway":"`than` 是连接比较双方的介词，是比较级句型的核心标志。"}]},{"title":"形容词的拼写变化","steps":[{"question":"要将 `heavy` 变成比较级，它的词尾应该怎么变化？","hint":"观察 `heavy` 的结尾是“辅音字母v + y”。这类词的变化有什么特殊规则吗？","takeaway":"以“辅音字母+y”结尾的形容词，变比较级时需改 `y` 为 `i` 再加 `-er`。"},{"question":"你能根据这个规则，说说 `happy` 的比较级是什么吗？","hint":"`happy` 也是以“辅音字母p + y”结尾的。","takeaway":"掌握一类词的变化规则，就能触类旁通，解决一系列类似的问题。"}]},{"title":"比较级的意义","steps":[{"question":"填入 `heavier` 后，`Chen Jie is heavier than Amy.` 这句话是什么意思？","hint":"`heavy` 是“重”的意思，`heavier than` 就是“比……重”。","takeaway":"比较级用来描述两者在某一方面的程度差异。"},{"question":"如果艾米比陈洁重，我们应该怎么说？","hint":"只需要交换比较的双方，或者使用反义词 `light`（轻的）。","takeaway":"灵活运用比较级和反义词可以使语言表达更加丰富。"}]}]}},{"number":"20","item_type":"fill_blank","context_note":"","stem":"He _____ (not watch) television last night.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"didn't watch","explanation_md":"这个句子中有一个非常关键的时间状语 `last night`（昨晚），它表明动作发生在过去，因此整个句子应使用一般过去时。题干要求填入 `(not watch)` 的适当形式，这说明需要构成一个否定句。一般过去时的否定句结构是 `主语 + did not (didn't) + 动词原形`。这里的动词是 `watch`，其原形就是 `watch`。因此，空格处应填入 `didn't watch` 或 `did not watch`。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense) 详解\n\n**1. 功能**：表示过去某个特定时间发生并完成的动作，或过去存在的状态。\n\n**2. 时间状语**：常与 `yesterday`, `last night/week/month/year`, `... ago` (例如 `two days ago`), `in 1999`, `just now` 等表示过去时间的词或短语连用。\n\n**3. 句子结构**：\n*   **肯定句**：`主语 + 动词过去式 (+ 其他)`\n    *   `He watched television last night.`\n*   **否定句**：`主语 + did not (didn't) + 动词原形 (+ 其他)`\n    *   `He didn't watch television last night.`\n*   **一般疑问句**：`Did + 主语 + 动词原形 (+ 其他)?`\n    *   `Did he watch television last night?`\n\n**核心易错点**：在构成否定句和疑问句时，一旦使用了助动词 `did` 或 `didn't`，其后的动词必须恢复为**原形**。很多学生会错误地写成 `didn't watched` 或 `Did he watched...?`，这是需要反复练习和纠正的重点。","socratic_tracks":[{"title":"判断句子时态","steps":[{"question":"请在句子中找出一个表示时间的词或短语。","hint":"看看句子的结尾部分，`last night` 是什么意思？","takeaway":"时间状语 `last night`（昨晚）是判断句子应使用一般过去时的关键线索。"}]},{"title":"过去时否定句的构成","steps":[{"question":"既然是一般过去时，它的否定句需要借助哪个特殊的“助手”词（助动词）？","hint":"一般现在时的否定句用 `don't/doesn't`，那么一般过去时呢？","takeaway":"一般过去时的否定句需要使用助动词 `did not` 或其缩写形式 `didn't`。"},{"question":"使用了助动词 `didn't` 之后，后面的动词 `watch` 应该用什么形式？是过去式 `watched` 还是原形 `watch`？","hint":"助动词 `did` 已经表示了“过去”，所以后面的动词就不需要再变化了。","takeaway":"在一般过去时的否定句和疑问句中，助动词 `did` 出现后，实义动词必须使用原形。"}]},{"title":"句型转换练习","steps":[{"question":"如果这句话是肯定句，不是否定句，应该怎么说？“He _____ television last night.”","hint":"一般过去时的肯定句，需要把动词变成过去式。`watch` 的过去式是什么？","takeaway":"一般过去时的肯定句谓语动词要用过去式，规则动词通常加 `-ed`。"},{"question":"现在，请试着把肯定句 “He watched television last night.” 改成一个一般疑问句。","hint":"把助动词 `Did` 放在句首，然后主语，再然后是动词原形。","takeaway":"熟练掌握一般过去时肯定句、否定句和疑问句之间的转换，是学好该时态的关键。"}]}]}},{"number":"21","item_type":"fill_blank","context_note":"","stem":"_____ you _____ (visit) your aunt last weekend?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Did|visit","explanation_md":"句子末尾的时间状语 “last weekend”（上周末）表明这是一个发生在过去的动作，因此需要使用一般过去时。这是一个一般疑问句，一般过去时的一般疑问句结构是 “Did + 主语 + 动词原形 + ...?”。因此，第一个空应填助动词 “Did”，第二个空应填动词 “visit” 的原形。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n一般过去时用于表示过去某个时间发生的动作或存在的状态。\n\n**标志词**: `yesterday`, `last night/week/month/year`, `... ago`, `the day before yesterday`, `in 2010` 等。\n\n**句子结构**:\n- **肯定句**: 主语 + 动词过去式 + ...\n- **否定句**: 主语 + `did not` (`didn't`) + 动词原形 + ...\n- **一般疑问句**: `Did` + 主语 + 动词原形 + ...?\n- **特殊疑问句**: 特殊疑问词 + `did` + 主语 + 动词原形 + ...?\n\n**易错点**: 在否定句和疑问句中，使用了助动词 `did` 或 `didn't` 之后，后面的动词**必须用原形**，不能再用过去式。例如，错误说法：`Did you visited...?` 正确说法：`Did you visit...?`","socratic_tracks":[{"title":"抓住时间线索","steps":[{"question":"句子中哪个词或词组告诉我们这件事是什么时候发生的？","hint":"看看句子的末尾，有没有表示时间的词？","takeaway":"句中的时间状语是判断时态的关键钥匙。"},{"question":"“last weekend”（上周末）表示的是现在、过去还是将来？","hint":"“last” 是“上一个”的意思。","takeaway":"表示过去的时间状语，决定了句子要使用一般过去时。"},{"question":"既然是一般过去时，那么括号里的动词 “visit” 应该如何变化呢？","hint":"想一想一般过去时的疑问句结构是什么样的。","takeaway":"在一般过去时的疑问句中，动词需要使用原形。"}]},{"title":"一般过去时的问句变形","steps":[{"question":"这是一个陈述句还是疑问句？你是怎么知道的？","hint":"观察句子的末尾有什么标点符号。","takeaway":"句末的问号（?）表明这是一个疑问句。"},{"question":"对于一般过去时的动作，我们通常用哪个特殊的“助动词”来帮助提问？","hint":"这个词通常放在句子的开头。","takeaway":"一般过去时的一般疑问句需要用助动词 “Did” 开头。"},{"question":"当我们使用了助动词 “Did” 之后，括号里的动词 “visit” 应该用什么形式？是过去式 “visited” 还是原形 “visit”？","hint":"助动词已经承担了表示“过去”的任务。","takeaway":"一般过去时的疑问句要用 “Did” 开头，且后面的动词要恢复原形。"}]},{"title":"助动词与实义动词的分工","steps":[{"question":"在这个问句中，哪个词是真正表示“拜访”这个动作的？","hint":"这个词我们称之为“实义动词”。","takeaway":"“visit” 是句中的实义动词，表示具体动作。"},{"question":"哪个词是来帮助构成疑问句，本身没有实际意义，只是辅助的？","hint":"这个词我们称之为“助动词”。","takeaway":"第一个空需要填的 “Did” 是助动词，帮助构成疑问句。"},{"question":"既然助动词 “Did” 已经承担了表示“过去”的任务，那么实义动词 “visit” 还需要变化吗？","hint":"一个句子里，时态的标志通常只出现一次。","takeaway":"在一般过去时的疑问句和否定句中，助动词 did/didn't 负责时态，实义动词保持原形。"}]}]}},{"number":"22","item_type":"fill_blank","context_note":"","stem":"My parents _____ (be) doctors.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"are","explanation_md":"本句描述的是一个当前的事实或职业，因此应使用一般现在时。句子的主语是 “My parents”（我的父母），这是一个复数名词。be动词在一般现在时中有三种形式：am, is, are。当主语是复数或第二人称 “you” 时，be动词应使用 “are”。","knowledge_expansion_md":"### be动词的用法 (一般现在时)\n\nbe动词在一般现在时中，有人称和数的变化，需要和主语保持一致，这叫做“主谓一致”。\n\n- **第一人称单数 (I)**: `am` (我是)\n- **第三人称单数 (he, she, it, a single person/thing)**: `is` (他/她/它是)\n- **其他人称 (we, you, they, plural nouns)**: `are` (我们是, 你/你们是, 他们是)\n\n**记忆口诀**: 我用am，你用are，is连着他她它；单数is，复数are。\n\n**功能**: be动词常用于连接主语和表语，说明主语的身份、状态、性质、特征或位置。例如：\n- I **am** a student. (身份)\n- She **is** happy. (状态)\n- The book **is** on the desk. (位置)","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"这个句子的主语是谁？","hint":"想一想句子是在说谁是医生。","takeaway":"句子的主语是 “My parents”。"},{"question":"主语 “My parents” 是指一个人还是多个人？是单数还是复数？","hint":"“parents” 是 “parent” 的复数形式。","takeaway":"“My parents” 是复数，指我的父母两个人。"},{"question":"当主语是复数时，be动词应该用 am, is, 还是 are？","hint":"回想一下口诀：单数is，复数are。","takeaway":"动词的形式必须和主语的单复数保持一致，复数主语要用 “are”。"}]},{"title":"判断时态","steps":[{"question":"这个句子是在讲一个过去发生的故事，还是在描述一个现在的情况？","hint":"“我的父母是医生”是在描述他们的职业。","takeaway":"描述当前的事实、职业或状态时，应使用一般现在时。"},{"question":"在一般现在时中，be动词有哪几种形式？","hint":"一共有三种。","takeaway":"be动词在一般现在时中有 am, is, are 三种形式。"},{"question":"结合主语是复数，时态是现在时，我们应该填be动词的哪种具体形式？","hint":"为复数主语选择合适的be动词形式。","takeaway":"对于复数主语 “My parents”，在一般现在时中应使用 “are”。"}]},{"title":"be动词的功能","steps":[{"question":"句子里除了主语 “My parents” 和表语 “doctors”，还缺少什么成分来把它们连接起来，表达“是”的意思？","hint":"这个词在英语中非常基础和重要。","takeaway":"be动词在句中起着连接主语和表语、表明身份或状态的重要作用。"},{"question":"“是” 这个意思，在英语里通常用哪个动词来表达？","hint":"这个动词会根据主语和时态发生变化。","takeaway":"be动词是表达“是”这个概念最核心的动词。"}]}]}},{"number":"23","item_type":"fill_blank","context_note":"","stem":"I _____ (watch) my clothes the day before yesterday.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"watched","explanation_md":"句中的时间状语 “the day before yesterday”（前天）表明动作发生在过去，因此应使用一般过去时。这是一个肯定陈述句，一般过去时的肯定句结构是 “主语 + 动词过去式 + ...”。动词 “watch” 是一个规则动词，其过去式是在词尾加 “-ed”。因此，空中应填 “watched”。","knowledge_expansion_md":"### 规则动词过去式的构成\n\n大多数动词的过去式和过去分词都是规则的，通过在动词原形后加 `-ed` 构成，但有一些拼写上的小规则：\n\n1.  **一般情况**: 直接在词尾加 `-ed`。\n    - `watch` -> `watched`\n    - `work` -> `worked`\n2.  **以不发音的 `e` 结尾**: 直接加 `-d`。\n    - `live` -> `lived`\n    - `hope` -> `hoped`\n3.  **以“辅音字母 + y”结尾**: 变 `y` 为 `i`，再加 `-ed`。\n    - `study` -> `studied`\n    - `carry` -> `carried`\n4.  **重读闭音节且末尾只有一个辅音字母**: 双写该辅音字母，再加 `-ed`。\n    - `stop` -> `stopped`\n    - `plan` -> `planned`\n\n**注意**: 题目中的 “watch my clothes”（看着我的衣服）搭配略显奇怪，更常见的搭配是 “wash my clothes”（洗我的衣服）。但无论动词是 `watch` 还是 `wash`，它们都是规则动词，过去式变化规则相同 (`watched`/`washed`)。","socratic_tracks":[{"title":"时间状语定乾坤","steps":[{"question":"句子中哪个词组告诉我们动作发生的时间？","hint":"找一找表示“昨天”、“前天”之类的词。","takeaway":"时间状语 “the day before yesterday” 是判断时态的关键。"},{"question":"“the day before yesterday” 是指哪一天？它表示过去、现在还是将来？","hint":"“yesterday” 是昨天，那么 “the day before” 呢？","takeaway":"“the day before yesterday” 意为“前天”，明确表示动作发生在过去。"},{"question":"既然是过去发生的动作，动词 “watch” 应该变成什么形式？","hint":"表示过去发生的动作，动词要用过去式。","takeaway":"一般过去时态的句子，谓语动词要使用过去式。"}]},{"title":"规则动词的变形","steps":[{"question":"动词 “watch” 变成过去式，是属于规则变化还是不规则变化？","hint":"大部分动词的过去式都是在词尾加-ed。","takeaway":"“watch” 是一个规则动词。"},{"question":"对于像 “watch” 这样的一般规则动词，我们通常在词尾加上什么来表示过去式？","hint":"这是一个非常常见的结尾。","takeaway":"规则动词的过去式是在词尾加 -ed 构成的。"}]},{"title":"句子结构分析","steps":[{"question":"这个句子是在提问，还是在陈述一件事情？","hint":"看句末的标点符号。","takeaway":"这是一个陈述句，因为它以句号结尾（虽然题干中省略了）。"},{"question":"在一般过去时的肯定陈述句中，主语后面直接跟的是动词的什么形式？","hint":"例如，“我昨天去了公园” I _____ (go) to the park yesterday.","takeaway":"一般过去时肯定句的核心结构就是“主语 + 动词过去式”。"},{"question":"所以，主语 “I” 后面应该填入 “watch” 的过去式，也就是什么？","hint":"给 watch 加上过去式的标志。","takeaway":"“watch” 的过去式是 “watched”。"}]}]}},{"number":"24","item_type":"fill_blank","context_note":"","stem":"I went _____ (fish) with my parents last weekend.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"fishing","explanation_md":"这是一个固定搭配 “go fishing”，意为“去钓鱼”。句型 “go + v-ing” 常用来表示参加某种娱乐或体育活动。句中的 “went” 是 “go” 的过去式，表示动作发生在 “last weekend”（上周末）。因此，括号中的动词 “fish” 需要变为动名词形式 “fishing” 来构成这个固定搭配。","knowledge_expansion_md":"### 固定搭配 \"go + v-ing\"\n\n这是一个非常常见的结构，用来表示进行某项活动，特别是户外、娱乐或体育活动。这里的 `v-ing` 形式是动名词 (gerund)，在句中作宾语，表示所进行的活动内容。\n\n**常见例子**:\n- `go shopping` (去购物)\n- `go swimming` (去游泳)\n- `go hiking` (去远足)\n- `go skiing` (去滑雪)\n- `go skating` (去滑冰)\n- `go boating` (去划船)\n- `go camping` (去露营)\n\n**易错点**: 不要将此结构中的 `v-ing` 与现在进行时混淆。在 `go + v-ing` 中，`go` 是谓语动词，而 `v-ing` 是动名词作宾语；在现在进行时中，`be + v-ing` 整个是谓语部分。","socratic_tracks":[{"title":"“go + 活动”的固定搭配","steps":[{"question":"你平时会说“去游泳”、“去购物”吗？在英语里，这类表达有什么规律吗？","hint":"比如，“去游泳”是 go swimming，“去购物”是 go shopping。","takeaway":"英语中常用 “go + 动词-ing形式” 来表示进行某项活动。"},{"question":"根据这个规律，“去钓鱼”应该怎么说？","hint":"将动词 fish 按照规律变化。","takeaway":"“去钓鱼”的固定搭配是 “go fishing”。"},{"question":"句中的 “went” 是什么？它影响 “fishing” 的形式吗？","hint":"“went” 是 “go” 的过去式。","takeaway":"“went” 只是改变了 “go” 的时态，但 “go + v-ing” 这个搭配结构本身不变，所以后面依然是 “fishing”。"}]},{"title":"动词形式分析","steps":[{"question":"这个句子的主要动词（谓语）是什么？","hint":"哪个词表示了“去”这个动作？","takeaway":"句子的谓语动词是 “went”。"},{"question":"一个简单句里通常只有一个谓语动词。既然 “went” 已经是谓语了，后面的 “fish” 还能直接用原形吗？","hint":"一个山不容二虎，一个简单句不容两个谓语动词。","takeaway":"当一个动词（如 go）后面跟着另一个表示动作的词时，后一个词通常需要改变形式，成为非谓语动词。"},{"question":"在 “go” 这个动词后面，表示活动内容的 “fish” 应该变成什么形式？","hint":"回想一下 “go swimming” 的例子。","takeaway":"在 “go” 后面，表示活动的动词要变成 -ing 形式（动名词）。"}]},{"title":"词性辨析","steps":[{"question":"在 “go fishing” 这个短语里，“fishing” 是在做一个持续的动作，还是指“钓鱼”这项活动本身？","hint":"我们是“去”做“钓鱼”这件事。","takeaway":"在这里，“fishing” 指的是“钓鱼”这项活动，功能上像一个名词。"},{"question":"当一个动词被用作名词，指代一件事情或活动时，我们把它叫做什么？","hint":"它既有动词的根，又有名字的性质。","takeaway":"这种由动词变化而来，起名词作用的词叫做“动名词”。"},{"question":"动名词通常是什么形式？","hint":"想想 swimming, shopping, reading...","takeaway":"动名词的形式是“动词原形 + ing”。"}]}]}},{"number":"25","item_type":"fill_blank","context_note":"","stem":"—Whose ruler is it? —It's _____. (I)","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"mine","explanation_md":"本题考查名词性物主代词的用法。问句“Whose ruler is it?”意为“这是谁的尺子？”，回答时需要表明物品的归属。括号中给出的词是人称代词主格“I”（我），因此需要转换成对应的名词性物主代词“mine”（我的），表示“它是我的（尺子）”。名词性物主代词后面不需要再跟名词。","knowledge_expansion_md":"英语中的物主代词分为两种：\n1.  **形容词性物主代词**：my, your, his, her, its, our, their。它们在句中起形容词的作用，后面必须跟名词，如：`This is my ruler.`\n2.  **名词性物主代词**：mine, yours, his, hers, its, ours, theirs。它们在句中起名词的作用，可以单独使用，其本身就等于“形容词性物主代词 + 名词”，如：`This ruler is mine.` (mine = my ruler)。\n\n| 人称代词主格 | 形容词性物主代词 | 名词性物主代词 |\n| :--- | :--- | :--- |\n| I (我) | my (我的) | mine (我的) |\n| you (你/你们) | your (你的/你们的) | yours (你的/你们的) |\n| he (他) | his (他的) | his (他的) |\n| she (她) | her (她的) | hers (她的) |\n| it (它) | its (它的) | its (它的) |\n| we (我们) | our (我们的) | ours (我们的) |\n| they (他们) | their (他们的) | theirs (他们的) |","socratic_tracks":[{"title":"物主代词的种类","steps":[{"question":"空格处需要填一个表示“我的”的词，你知道英语中有哪两种表示“我的”的词吗？","hint":"想想“我的书”(my book) 和“这本书是我的”(The book is mine) 这两种表达有什么不同。","takeaway":"表示“我的”有两个词：my 是形容词性物主代词，后面要跟名词；mine 是名词性物主代词，可以单独使用。"},{"question":"那么在这道题 “It's _____.” 中，空格后面还有名词吗？","hint":"看看空格后面是不是句号了。","takeaway":"空格后面没有名词，所以不能用 my。"},{"question":"既然不能用 my，那我们应该选择哪个词来表示“它是我的”呢？","hint":"选择那个可以单独使用的表示“我的”的词。","takeaway":"当表示“我的（东西）”且后面不跟名词时，应使用名词性物主代词 mine。"}]},{"title":"句意与提问词","steps":[{"question":"问句 “Whose ruler is it?” 是在问什么？","hint":"关键词是 “Whose”，它是用来问什么的？","takeaway":"“Whose” 用来提问物品的所有权，即“谁的”。"},{"question":"回答一个关于“谁的”的问题，答案应该包含什么信息？","hint":"如果别人问你“这是谁的书”，你会怎么回答？","takeaway":"答案需要明确指出物品的主人。"},{"question":"根据括号里的提示词 (I)，这个尺子的主人是谁？如何用一个词来表达“我的”这个归属关系？","hint":"这个词需要能代替“my ruler”。","takeaway":"用名词性物主代词 mine 来回答，表示“我的尺子”。"}]},{"title":"代词家族辨析","steps":[{"question":"我们学过和“我”相关的代词有 I, me, my, mine，它们分别在什么时候使用？","hint":"I 做主语，me 做宾语，my 是“我的...”，mine 也是“我的”。","takeaway":"I, me, my, mine 分别是人称代词主格、宾格，形容词性物主代词和名词性物主代词。"},{"question":"在这句话 “It's _____.” 中，主语是 It，谓语是 is，空格处应该是什么成分？","hint":"这个成分用来解释主语 It 是什么，我们称之为什么？","takeaway":"空格处是表语，用来描述主语的身份或状态。"},{"question":"I, me, my, mine 这四个词中，哪些可以作表语？为什么本题只能填 mine？","hint":"My 不能单独作表语，它需要修饰名词。I 和 me 的格不正确。所以只剩下...","takeaway":"名词性物主代词 mine 可以独立作表语，表示“我的东西”，符合本题语境。"}]}]}},{"number":"26","item_type":"fill_blank","context_note":"","stem":"Look! The little boy _____ (cross) the busy road by himself.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"is crossing","explanation_md":"本题考查现在进行时。句首的“Look!”（看！）是一个标志性词语，提示我们这个动作正在发生，因此需要使用现在进行时。现在进行时的结构是“主语 + be动词 + 动词-ing形式”。本句的主语是“The little boy”（小男孩），是第三人称单数，所以be动词用“is”。动词“cross”的-ing形式是“crossing”。因此，正确答案是“is crossing”。","knowledge_expansion_md":"现在进行时（Present Continuous Tense）主要用来表示：\n1.  **说话时正在进行的动作**。常与`now`, `Look!`, `Listen!`等词连用。例如：`Listen! Someone is singing.`\n2.  **当前一段时间内正在进行的动作**，但说话时不一定在进行。例如：`I am reading a new book these days.` (我这些天在读一本新书)\n\n**构成**：主语 + be (am/is/are) + 动词-ing\n\n**动词-ing形式的变化规则**：\n*   一般情况：直接在动词后加-ing，如 `cross` -> `crossing`。\n*   以不发音的e结尾：去掉e再加-ing，如 `write` -> `writing`。\n*   以重读闭音节结尾，且末尾只有一个辅音字母：双写该辅音字母再加-ing，如 `run` -> `running`, `swim` -> `swimming`。\n*   以-ie结尾：变-ie为y再加-ing，如 `lie` -> `lying`。","socratic_tracks":[{"title":"时态判断","steps":[{"question":"看到句子开头的 “Look!”，你觉得这个动作是每天都发生，还是现在正在发生？","hint":"“看！”这个词是在提醒你注意什么？","takeaway":"“Look!” 是一个信号，表示动作正在眼前发生，应该使用现在进行时。"},{"question":"现在进行时的基本结构是什么？","hint":"它由两部分组成，一个be动词和一个变化了的动词。","takeaway":"现在进行时的结构是 “be动词 + 动词的-ing形式”。"}]},{"title":"主谓一致","steps":[{"question":"确定了要用现在进行时，那么be动词应该用 am, is, 还是 are 呢？","hint":"这取决于句子的主语是谁。","takeaway":"be动词的形式由主语的人称和数来决定。"},{"question":"本句的主语是 “The little boy”，它是单数还是复数？是第几人称？","hint":"“小男孩”是一个人，不是“我”也不是“你”。","takeaway":"主语 “The little boy” 是第三人称单数。"},{"question":"当主语是第三人称单数时，现在进行时中的be动词应该用哪一个？","hint":"回想一下be动词的用法口诀：“我用am，你用are，is连着他她它”。","takeaway":"主语是第三人称单数时，be动词要用 is。"}]},{"title":"动词形式变化","steps":[{"question":"现在进行时需要把动词变成-ing形式，你知道动词 cross 应该怎么变吗？","hint":"直接在后面加上-ing就可以了吗？还是需要什么特殊变化？","takeaway":"动词 cross 的-ing形式是 crossing。"},{"question":"为什么 cross 不用像 run -> running 那样双写末尾的字母呢？","hint":"观察一下 cross 和 run 在拼写上的区别，特别是结尾的字母。","takeaway":"双写规则适用于“元音+辅音”结尾的重读闭音节，而 cross 以双辅音ss结尾，不符合该规则，所以直接加-ing。"}]}]}},{"number":"27","item_type":"fill_blank","context_note":"","stem":"_____ your parents _____ (read) newspapers every day?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Do|read","explanation_md":"本题考查一般现在时的疑问句形式。句末的“every day”（每天）是典型的一般现在时的时间状语，表示习惯性、规律性的动作。本句是一个疑问句，主语是“your parents”（你的父母），是复数形式。在一般现在时中，当主语是复数或第一、二人称时，构成疑问句需要在句首加助动词“Do”，且句中谓语动词使用原形。因此，第一个空填“Do”，第二个空填动词原形“read”。","knowledge_expansion_md":"一般现在时（Simple Present Tense）的疑问句构成规则：\n1.  **当句中有be动词(am/is/are)时**：直接将be动词提到主语前。例如：`She is a teacher.` -> `Is she a teacher?`\n2.  **当句中有情态动词(can/may/must等)时**：直接将情态动词提到主语前。例如：`You can swim.` -> `Can you swim?`\n3.  **当句中只有实义动词时**：需要借助助动词`do`或`does`。\n    *   主语为第三人称单数（he, she, it, a single name等）时，用`Does`开头，动词用原形。例如：`He reads books.` -> `Does he read books?`\n    *   主语为其他人称（I, you, we, they, plural nouns等）时，用`Do`开头，动词用原形。例如：`They read books.` -> `Do they read books?`\n\n本题主语`your parents`是复数，属于“其他人称”范畴，故使用`Do`。","socratic_tracks":[{"title":"判断时态","steps":[{"question":"句子中有一个表示时间的短语 “every day”，它是什么意思？","hint":"这个短语表示动作发生的频率。","takeaway":"“every day” 意为“每天”，表示一个习惯性、规律性的动作。"},{"question":"当一个动作是习惯性、规律性地发生时，我们应该使用什么时态来描述它？","hint":"是表示“现在正做”，还是“通常都做”？","takeaway":"描述习惯性、规律性的动作，应使用一般现在时。"}]},{"title":"选择助动词","steps":[{"question":"这是一个问句，并且谓语动词是 read (实义动词)，我们需要借助什么词来提问？","hint":"一般现在时的疑问句，需要用什么词开头？","takeaway":"一般现在时的疑问句需要借助助动词 Do 或 Does。"},{"question":"那我们应该用 Do 还是 Does 呢？这取决于什么？","hint":"看看句子的主语是单数还是复数。","takeaway":"助动词用 Do 还是 Does 取决于主语的人称和数。"},{"question":"本句的主语是 “your parents”，它是单数还是复数？","hint":"parents 是 parent 的复数形式，指父母双方。","takeaway":"主语 “your parents” 是复数，所以助动词应该用 Do。"}]},{"title":"动词形式","steps":[{"question":"在一般现在时的疑问句中，一旦我们用了助动词 Do 或 Does，后面的动词应该
