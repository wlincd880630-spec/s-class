是什么形式？","hint":"想一想口诀：“有do/does助动词，动词打回原形”。","takeaway":"在含有助动词 Do/Does 的疑问句或否定句中，谓语动词必须使用原形。"},{"question":"所以，这道题中括号里的动词 read 应该填什么形式？","hint":"前面已经用了助动词 Do。","takeaway":"因为句首已经用了助动词 Do，所以第二个空应填动词原形 read。"}]}]}},{"number":"28","item_type":"fill_blank","context_note":"","stem":"Helen _____ (catch) a big fish last Sunday morning.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"caught","explanation_md":"本题考查一般过去时。句中的时间状语“last Sunday morning”（上周日早上）明确指出了动作发生在过去的一个特定时间点，因此需要使用一般过去时。一般过去时的构成是“主语 + 动词的过去式”。本题的动词是“catch”（抓住），它是一个不规则动词，其过去式是“caught”。因此，空格处应填“caught”。","knowledge_expansion_md":"一般过去时（Simple Past Tense）用于表示过去某个时间发生的动作或存在的状态。其标志性的时间状语有：`yesterday`, `last week/month/year`, `... ago`, `in 1999`, `just now`等。\n\n动词的过去式分为两种：\n1.  **规则动词**：在动词原形后加 `-ed`。例如：\n    *   `work` -> `worked`\n    *   `live` -> `lived` (以e结尾，直接加d)\n    *   `study` -> `studied` (以“辅音字母+y”结尾，变y为i再加ed)\n    *   `stop` -> `stopped` (以重读闭音节结尾，双写末尾辅音字母再加ed)\n2.  **不规则动词**：词形变化没有固定规律，需要专门记忆。例如：\n    *   `go` -> `went`\n    *   `see` -> `saw`\n    *   `eat` -> `ate`\n    *   `catch` -> `caught`\n    *   `buy` -> `bought`\n    *   `teach` -> `taught`\n\n掌握常见不规则动词的过去式是学好一般过去时的关键。","socratic_tracks":[{"title":"时态定位","steps":[{"question":"请找出句子中表示时间的词或短语。","hint":"这个短语告诉我们动作发生的具体日期。","takeaway":"表示时间的短语是 “last Sunday morning”。"},{"question":"“last Sunday morning” 指的是现在、将来还是过去的时间？","hint":"“last” 是“上一个”的意思。","takeaway":"这是一个明确的过去时间点，表示“上周日早上”。"},{"question":"当一个动作发生在明确的过去时间点，我们应该使用什么时态？","hint":"描述过去发生的事情用什么时态？","takeaway":"描述过去发生的动作，应使用一般过去时。"}]},{"title":"动词变化规则","steps":[{"question":"一般过去时中，动词需要变成什么形式？","hint":"比如，I play football. 变成过去时是 I played football.","takeaway":"在一般过去时的肯定句中，谓语动词要使用过去式。"},{"question":"动词 “catch” 的过去式是什么？它是规则动词（加-ed）吗？","hint":"你是否见过 “catched” 这种写法？回想一下你学过的不规则动词表。","takeaway":"“catch” 是一个不规则动词，不能直接加-ed。"},{"question":"那么，不规则动词 “catch” 的过去式应该怎么写？","hint":"它和 teach (taught), buy (bought) 的过去式变化有相似之处。","takeaway":"动词 “catch” 的过去式是 “caught”。"}]},{"title":"形近词与发音辨析","steps":[{"question":"你觉得 caught 这个词看起来和哪个词有点像？","hint":"比如“买”的过去式。","takeaway":"caught 和 bought (buy的过去式), taught (teach的过去式) 在拼写上都有 -aught 或 -ought 的结构。"},{"question":"你知道 caught [kɔːt] 这个词怎么读吗？","hint":"注意中间的元音 au 发什么音。","takeaway":"caught 中的 au 发 /ɔː/ 的音，和 law, saw 里的元音发音相同。"},{"question":"你能用 “caught” 造一个简单的句子吗？","hint":"比如“我昨天感冒了”。","takeaway":"一个简单的例子是：I caught a cold yesterday. (我昨天感冒了。)"}]}]}},{"number":"29","item_type":"fill_blank","context_note":"","stem":"I _____ (watch) TV last night.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"watched","explanation_md":"本题考查一般过去时。句子中的时间状语 “last night”（昨晚）是过去时间的标志，表示动作发生在过去。因此，谓语动词 “watch” 需要使用其过去式形式。动词 “watch” 是一个规则动词，其过去式是在词尾直接加 “-ed”。所以，正确答案是 “watched”。","knowledge_expansion_md":"### 一般过去时 (Simple Past Tense)\n\n1.  **用法**：表示在过去某个特定时间发生并完成的动作，或过去习惯性的动作。常与表示过去时间的状语连用。\n2.  **常见时间状语**：`yesterday` (昨天), `last night/week/month/year` (昨晚/上周/上个月/去年), `... ago` (…以前), `in 2010` (在2010年), `just now` (刚才)。\n3.  **动词过去式的构成规则**：\n    *   **规则动词**：\n        *   一般情况在词尾加 `-ed`，如 `watch` -> `watched`, `look` -> `looked`。\n        *   以不发音的 `e` 结尾的动词，直接加 `-d`，如 `like` -> `liked`, `live` -> `lived`。\n        *   以“辅音字母 + y”结尾的动词，变 `y` 为 `i` 再加 `-ed`，如 `study` -> `studied`, `cry` -> `cried`。\n        *   重读闭音节结尾，且末尾只有一个辅音字母的动词，双写该辅音字母再加 `-ed`，如 `stop` -> `stopped`, `plan` -> `planned`。\n    *   **不规则动词**：需要特殊记忆，如 `go` -> `went`, `see` -> `saw`, `eat` -> `ate`, `have` -> `had`。","socratic_tracks":[{"title":"寻找时态的“信号灯”","steps":[{"question":"请仔细阅读句子，里面有没有哪个词或短语告诉我们动作发生的时间？","hint":"找一找表示“昨天”、“去年”这类时间的词。","takeaway":"句子中的时间状语是判断动词时态的关键线索。"},{"question":"很好，你找到了“last night”。这个短语表示的是现在、过去还是将来？","hint":"“last”是“上一个”的意思，“night”是“夜晚”。","takeaway":"“last night”（昨晚）是明确的过去时间标志。"},{"question":"既然动作发生在过去，那么动词“watch”应该使用什么时态形式呢？","hint":"描述过去发生的事情，我们用一般...时？","takeaway":"过去的时间状语要求谓语动词使用过去式。"}]},{"title":"动词的“变身”规则","steps":[{"question":"我们确定了要用过去式。那么，你知道动词“watch”的过去式是什么吗？","hint":"回想一下，大多数动词的过去式是在词尾加上什么？","takeaway":"动词“watch”是一个规则动词，其过去式是 watched。"},{"question":"你还能举出其他像“watch”一样，通过加-ed变成过去式的动词吗？","hint":"想想“看”、“玩”、“工作”这些词。","takeaway":"掌握规则动词的过去式变化（加-ed）是基础。"}]},{"title":"从句子结构看时态","steps":[{"question":"如果我们把句子里的“last night”去掉，变成“I _____ (watch) TV.”，这个空可以填什么？","hint":"想一想，描述一个日常习惯用什么时态？","takeaway":"没有特定时间状语时，句子时态的判断会更加灵活，通常可理解为一般现在时。"},{"question":"对比一下，为什么加上“last night”后，答案就只能是“watched”了呢？","hint":"“last night”对整个句子的时间进行了怎样的限定？","takeaway":"时间状语与动词时态必须保持一致，这是保证句子语法正确的核心原则。"}]}]}},{"number":"30","item_type":"fill_blank","context_note":"","stem":"The _____ (student) dreams are all wonderful!","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"students'","explanation_md":"本题考查名词的复数所有格。句意为“学生们的梦想都很美好！”。首先，根据后面的复数名词 “dreams” 和系动词 “are”，可以推断出这里指的是多个学生的梦想，而非一个学生。因此，需要先将名词 “student” 变为复数形式 “students”。然后，要表示“学生们的”，需要使用名词所有格。对于以 -s 结尾的复数名词，其所有格形式是在词尾直接加上撇号（'）。所以，正确答案是 “students'”。","knowledge_expansion_md":"### 名词所有格 ('s Genitive)\n\n名词所有格用来表示“……的”，表示所属关系。其构成规则如下：\n\n1.  **单数名词**：在词尾加 `'s`。\n    *   `a student's dream` (一个学生的梦想)\n    *   `Tom's book` (汤姆的书)\n\n2.  **不以 -s 结尾的复数名词**：在词尾加 `'s`。\n    *   `children's toys` (孩子们的玩具)\n    *   `men's clothing` (男士服装)\n\n3.  **以 -s 结尾的复数名词**：在词尾只加撇号 `'`。\n    *   `the students' dreams` (学生们的梦想)\n    *   `my parents' room` (我父母的房间)\n\n**易错点辨析**：\n*   `student's`: 单数所有格，指“一个学生的”。\n*   `students`: 复数形式，指“（多个）学生”。\n*   `students'`: 复数所有格，指“（多个）学生的”。\n在解题时，需要根据句意和上下文（如谓语动词的单复数、相关名词的单复数）来综合判断应该使用哪种形式。","socratic_tracks":[{"title":"判断单数与复数","steps":[{"question":"请看句子中的名词“dreams”和动词“are”，它们是单数形式还是复数形式？","hint":"“dream”的复数是“dreams”，“is”的复数是“are”。","takeaway":"名词“dreams”和动词“are”都是复数形式。"},{"question":"既然梦想（dreams）是复数的，那么你觉得这里更可能是在说“一个学生”的梦想，还是“一群学生”的梦想？","hint":"“学生们的梦想都很美好”听起来是不是比“一个学生的（多个）梦想都很美好”更通顺？","takeaway":"根据上下文，这里指的是多个学生的梦想，因此主语部分应该是复数概念。"}]},{"title":"名词变复数","steps":[{"question":"我们确定了是“多个学生”，那么名词“student”的复数形式应该怎么写？","hint":"大部分名词变复数都是直接在词尾加-s。","takeaway":"“student”的复数形式是“students”。"}]},{"title":"所有格的正确用法","steps":[{"question":"现在我们需要表示“学生们的”，也就是“students”的所有格。你认为应该怎么写？是 students's 还是 students'？","hint":"回想一下，以-s结尾的复数名词，它的所有格是如何构成的？","takeaway":"对于以-s结尾的复数名词，其所有格形式只需在词尾加上撇号（'）。"},{"question":"你能用这个规则造一个句子吗？比如“老师们的办公室”。","hint":"老师（复数）是 teachers。","takeaway":"通过练习可以巩固知识点，例如：The teachers' office is on the second floor."}]}]}}]},{"section_title":"III. 完成句子 (共10分)","section_instruction":"","items":[{"number":"31","item_type":"fill_blank","context_note":"","stem":"Did you go to the _____ (公园) yesterday?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"park","explanation_md":"本题考查的是基础的地点名词。题干要求将句子中的中文提示“公园”翻译成对应的英文单词。根据汉语意思，“公园”的英文单词是 “park”。这个词是小学阶段需要掌握的核心词汇之一。将 “park” 填入横线处，句子 “Did you go to the park yesterday?” 意为“你昨天去公园了吗？”，语法通顺，句意完整。","knowledge_expansion_md":"### 常见地点名词 (Common Place Nouns)\n\n掌握常见的地点名词是英语学习的基础。以下是一些常用词汇：\n*   `park` (公园)\n*   `school` (学校)\n*   `home` (家)\n*   `library` (图书馆)\n*   `supermarket` (超市)\n*   `hospital` (医院)\n*   `cinema` / `movie theater` (电影院)\n*   `museum` (博物馆)\n*   `post office` (邮局)\n*   `bank` (银行)\n*   `restaurant` (餐馆)\n*   `zoo` (动物园)\n\n**介词搭配**：\n*   表示“去某地”时，通常用 `go to ...`，如 `go to the park`, `go to the library`。\n*   **特例**：`go home` (回家)，`go to school` (去上学)，`go to bed` (去睡觉)，这些习惯用法中通常不加冠词 `the`。","socratic_tracks":[{"title":"核心词汇考察","steps":[{"question":"题目括号里的中文提示是什么？","hint":"请看题干中的汉字。","takeaway":"题目提示是“公园”。"},{"question":"你知道“公园”这个词用英语怎么说吗？","hint":"这是一个以p开头的常用单词，孩子们很喜欢去那里玩。","takeaway":"“公园”的英文单词是“park”。"}]},{"title":"句子结构分析","steps":[{"question":"这是一个什么类型的句子？陈述句，疑问句，还是感叹句？","hint":"看看句子的开头和结尾的标点符号。","takeaway":"这是一个以“Did”开头，以问号结尾的一般疑问句。"},{"question":"这个疑问句的时态是什么？你是怎么看出来的？","hint":"注意开头的助动词“Did”和句末的时间“yesterday”。","takeaway":"助动词“Did”和时间状语“yesterday”表明这是一般过去时的疑问句。"},{"question":"在由“Did”引导的疑问句中，它后面的动词（比如这里的“go”）应该用什么形式？","hint":"助动词已经承担了表示时态的任务，后面的动词就不需要再变了。","takeaway":"在一般过去时的疑问句和否定句中，助动词“did”后面的谓语动词要用原形。"}]},{"title":"冠词“the”的用法","steps":[{"question":"为什么在我们要填的单词“park”前面，已经有一个“the”了？","hint":"“the”是定冠词，通常用来指代特定的事物。","takeaway":"这里的“the park”通常指谈话双方都知道的那个公园，或者某个特定的公园。"},{"question":"我们什么时候说“go to school”，什么时候说“go to the school”？它们意思一样吗？","hint":"想一想，一个是去上学（抽象目的），一个是去学校这个地方（具体地点）。","takeaway":"“go to school”指去上学，强调动作的目的；“go to the school”指去学校这个建筑物，不一定是去上课。"}]}]}},{"number":"32","item_type":"fill_blank","context_note":"","stem":"Helen _____ (需要) a few eggs for breakfast.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"needs","explanation_md":"本题考查一般现在时中动词的第三人称单数形式。首先，根据中文提示，“需要”对应的英文动词是 “need”。其次，分析句子结构，主语是 “Helen”，这是一个单个人名，属于第三人称单数。本句描述的是当前的需求，没有表示过去或将来的时间状语，因此应使用一般现在时。在一般现在时中，当主语是第三人称单数时，谓语动词的词尾需要加 “-s” 或 “-es”。动词 “need” 的变化属于一般情况，直接在词尾加 “-s”。因此，正确答案是 “needs”。","knowledge_expansion_md":"### 一般现在时中的主谓一致\n\n一般现在时用来描述客观事实、普遍真理、经常性或习惯性的动作。其核心语法点之一是**主谓一致**，特别是当主语为第三人称单数时，谓语动词需要变化。\n\n**第三人称单数**：指 `he` (他), `she` (她), `it` (它)，以及单个的人名 (如 `Helen`, `Tom`)、单个的事物 (如 `the book`, `a cat`) 或不可数名词 (如 `water`, `time`)。\n\n**动词变化规则**：\n1.  **一般情况**：在动词词尾加 `-s`。\n    *   `need` -> `needs`\n    *   `work` -> `works`\n    *   `play` -> `plays`\n2.  **以 -s, -x, -ch, -sh, -o 结尾**：在词尾加 `-es`。\n    *   `guess` -> `guesses`\n    *   `fix` -> `fixes`\n    *   `watch` -> `watches`\n    *   `wash` -> `washes`\n    *   `go` -> `goes`\n3.  **以“辅音字母 + y”结尾**：变 `y` 为 `i` 再加 `-es`。\n    *   `study` -> `studies`\n    *   `cry` -> `cries`\n    *   注意：`play` -> `plays` (因为 `a` 是元音字母)\n\n**练习**：\n*   I `like` apples. -> She `likes` apples.\n*   They `watch` TV. -> He `watches` TV.","socratic_tracks":[{"title":"确定主语和时态","steps":[{"question":"这个句子里，是谁“需要”鸡蛋？","hint":"句子的开头通常是主语。","takeaway":"句子的主语是“Helen”。"},{"question":"“Helen”是第几人称？是单数还是复数？","hint":"“我”是第一人称，“你”是第二人称，除此以外的“他/她/它”都是第三人称。Helen是一个人的名字。","takeaway":"主语“Helen”是第三人称单数。"},{"question":"这个句子描述的是过去发生的事，还是现在的一种情况或习惯？","hint":"句子里有“yesterday”或“last week”这样的词吗？","takeaway":"句子描述的是当前情况，应使用一般现在时。"}]},{"title":"动词的“三单”变化","steps":[{"question":"我们已经知道主语是第三人称单数，时态是一般现在时。在这种情况下，动词会发生什么特殊变化吗？","hint":"比如，我们说“I play”，但会说“He ...”什么？","takeaway":"在一般现在时中，若主语是第三人称单数，谓语动词需要进行相应变化。"},{"question":"括号里“需要”的英文是“need”。根据我们刚才的发现，它应该变成什么形式？","hint":"最常见的变化是在动词后面加一个字母。","takeaway":"动词“need”需要变为其第三人称单数形式“needs”。"}]},{"title":"词汇与拼写","steps":[{"question":"请拼写出“需要”的英文单词。","hint":"n-e-e-d","takeaway":"“需要”的英文是 need。"},{"question":"给 need 加上第三人称单数的词尾 -s 后，最终的正确答案是什么？","hint":"直接在 need 后面加上 s。","takeaway":"最终的答案是 needs。"}]}]}},{"number":"33","item_type":"fill_blank","context_note":"","stem":"The policeman is very tall and _____ (强壮的).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"strong","explanation_md":"本题考查描述人体格的形容词。\n1.  根据中文提示“强壮的”，其对应的英文单词是 `strong`。\n2.  该句意为“这位警察非常高大且强壮”。\n3.  句子结构为 `... tall and _____`，连词 `and` 连接两个并列的成分。\n4.  `tall` (高的) 是一个形容词，因此横线处也应填入一个形容词。\n5.  `strong` (强壮的) 是形容词，符合语法要求和句意。","knowledge_expansion_md":"### 知识点拓展：并列连词 `and`\n\n`and` 是一个并列连词，用于连接两个或多个语法功能和性质相同的词、短语或句子。常见的并列结构有：\n\n1.  **连接两个形容词**: `He is tall and strong.` (他又高又壮。)\n2.  **连接两个名词**: `I like apples and bananas.` (我喜欢苹果和香蕉。)\n3.  **连接两个动词**: `She can sing and dance.` (她能唱能跳。)\n4.  **连接两个副词**: `He works quickly and carefully.` (他工作得又快又仔细。)\n\n**易错点**：使用 `and` 连接时，要确保连接的内容在词性或结构上是“门当户对”的。例如，不能说 `He is tall and happily.` (形容词和副词并列，错误)。","socratic_tracks":[{"title":"词义辨析","steps":[{"question":"题目中括号里的中文“强壮的”是什么意思？它在英语里最常用的对应单词是什么？","hint":"想一想我们平时怎么形容一个人很有力气，身体很好。","takeaway":"“强壮的”在英语中最常用的词是 `strong`。"}]},{"title":"词性与句子结构","steps":[{"question":"在句子 `The policeman is very tall and _____` 中，`tall` 是什么词性？","hint":"`tall` 是用来形容警察身高的，这种词叫什么？","takeaway":"`tall` 是一个形容词，用来修饰名词 `policeman`。"},{"question":"连词 `and` 连接了 `tall` 和横线上的词，那么横线上的词应该是什么词性？","hint":"`and` 连接的两个词通常词性是相同的，就像好朋友要穿一样的衣服。","takeaway":"连词 `and` 用于连接两个并列的成分，因此横线上需要填一个和 `tall` 一样的形容词。"}]},{"title":"常见搭配","steps":[{"question":"在描述人的外貌和体格时，我们经常会把哪些形容词放在一起说？","hint":"比如，我们中文里常说一个人“又高又壮”，英文里是怎么表达的？","takeaway":"在英语中，`tall and strong` (又高又壮) 是一个非常地道和常见的形容人身体素质的搭配。"}]}]}},{"number":"34","item_type":"fill_blank","context_note":"","stem":"_____ (认真听) in class.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Listen carefully","explanation_md":"本题考查祈使句的用法。\n1.  这是一个独立的句子，没有主语，通常是用来发出命令、请求或建议，因此判断为祈使句。\n2.  祈使句通常以动词原形开头。\n3.  根据中文提示“认真听”，可以拆分为“听”(`listen`) 和“认真地”(`carefully`)。\n4.  “认真地”是用来修饰动词“听”的，所以应该用副词 `carefully`。\n5.  组合起来就是 `Listen carefully`。","knowledge_expansion_md":"### 知识点拓展：祈使句 (Imperative Sentences)\n\n祈使句是用来表达命令、请求、劝告、警告或建议的句子，其主语 `you` 通常被省略。\n\n1.  **肯定结构**: `动词原形 + ...`\n    *   `Be quiet.` (保持安静。)\n    *   `Open your book.` (打开你的书。)\n\n2.  **否定结构**: `Don't + 动词原形 + ...`\n    *   `Don't talk in class.` (课上不要讲话。)\n    *   `Don't be late.` (不要迟到。)\n\n3.  **礼貌结构**: 在句首或句末加上 `please`。\n    *   `Please sit down.` / `Sit down, please.` (请坐。)\n\n**易错点**：修饰祈使句中的动词时，要用副词而不是形容词。例如，要说 `Listen carefully`，而不是 `Listen careful`。","socratic_tracks":[{"title":"句型判断","steps":[{"question":"这个句子以横线开头，后面是 `in class`，并且句末是句号。你觉得它想表达什么？是陈述一个事实，还是提出一个要求？","hint":"想想老师在课堂上会对学生说什么。","takeaway":"这是一个祈使句，用来发出指令或提出建议。"},{"question":"这种表示命令、请求或建议的句子，通常以什么形式的词开头？","hint":"比如 `Sit down.` 和 `Open your book.` 都是以什么词开头的？","takeaway":"祈使句通常以动词原形开头。"}]},{"title":"词组翻译","steps":[{"question":"中文提示“认真听”包含两个部分：“听”和“认真地”。“听”的英文是什么？","hint":"当需要你集中注意力去听声音时，用哪个词？是 `hear` 还是 `listen`？","takeaway":"表示“有意识地听”时，我们用动词 `listen`。"},{"question":"“认真地”是用来修饰“听”这个动作的，它应该用什么词性的词？对应的英文单词是什么？","hint":"形容词 `careful` (认真的) 加上 `-ly` 会变成什么？","takeaway":"“认真地”是副词，用来修饰动词，英文是 `carefully`。"}]},{"title":"语法细节","steps":[{"question":"为什么我们说 `Listen carefully` 而不是 `Listen careful`？","hint":"`careful` 是形容词，通常用来形容名词（比如 a careful student）。这里我们要形容的是哪个词？","takeaway":"我们需要一个词来修饰动词 `listen`，所以要用副词 `carefully`。"},{"question":"副词和形容词在句子中分别扮演什么角色？","hint":"形容词修饰名词或代词，副词修饰动词、形容词或其他副词。","takeaway":"副词（如 carefully）用来修饰动词（如 listen），而形容词（如 careful）用来修饰名词。"}]}]}},{"number":"35","item_type":"fill_blank","context_note":"","stem":"John wants to be an _____ (宇航员) one day and walk on Mars.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"astronaut","explanation_md":"本题考查职业名词的拼写和冠词的用法。\n1.  根据中文提示“宇航员”，其对应的英文单词是 `astronaut`。\n2.  句子中 `wants to be...` 后面通常跟表示职业或身份的名词。\n3.  横线前的冠词是 `an`，这提示我们所需填写的单词必须是以元音音标开头的。\n4.  `astronaut` 的首字母 `a` 发元音 /æ/，符合 `an` 的使用规则。\n5.  句末的 `walk on Mars` (在火星上行走) 也进一步印证了“宇航员”这个职业。","knowledge_expansion_md":"### 知识点拓展：不定冠词 `a` 和 `an`\n\n不定冠词 `a/an` 用在单数可数名词前，表示“一个”。它们的区别在于后面的单词的发音：\n\n*   **`an`** 用在**元音音标**开头的单词前。\n    *   `an apple` (元音字母a发元音)\n    *   `an hour` (辅音字母h不发音，单词以元音/aʊ/开头)\n    *   `an M.P.` (字母M的发音/em/以元音开头)\n\n*   **`a`** 用在**辅音音标**开头的单词前。\n    *   `a book` (辅音字母b发辅音)\n    *   `a university` (元音字母u发辅音/j/)\n    *   `a one-way street` (元音字母o发辅音/w/)\n\n**关键**：判断用 `a` 还是 `an` 的依据是单词的**第一个发音**，而不是第一个字母。","socratic_tracks":[{"title":"词汇与拼写","steps":[{"question":"题目中的中文“宇航员”翻译成英文是什么？","hint":"这个词通常以字母 `a` 开头，和天文学、太空有关。","takeaway":"“宇航员”的英文是 `astronaut`。"},{"question":"你能试着拼写一下 `astronaut` 吗？注意里面的元音字母。","hint":"可以拆成 `astro` (与星星有关) 和 `naut` (航行者) 两部分记忆。","takeaway":"准确拼写 `astronaut` 是答对本题的基础。"}]},{"title":"冠词用法","steps":[{"question":"为什么横线前面用的是 `an` 而不是 `a`？","hint":"冠词 `a` 和 `an` 的使用规则是什么？是看单词的第一个字母还是第一个发音？","takeaway":"冠词 `a/an` 的选择取决于其后单词的第一个音标是元音还是辅音。"},{"question":"`astronaut` 这个单词的第一个音是什么？是元音还是辅音？","hint":"试着读一下这个单词：/ˈæstrənɔːt/。第一个音是 /æ/。","takeaway":"冠词 `an` 用在以元音音标开头的单词前，`astronaut` 符合这个规则。"}]},{"title":"语境理解","steps":[{"question":"句子的后半部分 `and walk on Mars` (在火星上行走) 给了我们什么线索？","hint":"什么样职业的人才有可能去火星上行走？","takeaway":"句子的后半部分提供了语境线索，帮助我们确认横线上应填的职业。"},{"question":"这个线索是不是可以帮助我们确认“宇航员”这个答案是正确的？","hint":"是的，上下文的逻辑关系非常紧密。","takeaway":"通过理解上下文 `walk on Mars`，可以反向推断出横线上需要填写与太空探索相关的职业。"}]}]}},{"number":"36","item_type":"fill_blank","context_note":"","stem":"_____ (有时), I go to the cinema.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"Sometimes","explanation_md":"本题考查频率副词的用法和位置。\n1.  根据中文提示“有时”，其对应的英文单词是 `sometimes`。\n2.  `sometimes` 是一个频率副词，用来表示动作发生的频率。\n3.  观察句子结构 `_____, I go to the cinema.`，横线位于句首，且后面有逗号与主句隔开。\n4.  `sometimes` 是一个位置非常灵活的频率副词，可以放在句首、句中或句末。\n5.  放在句首时，首字母需要大写，即 `Sometimes`。","knowledge_expansion_md":"### 知识点拓展：频率副词 (Adverbs of Frequency)\n\n频率副词用于表示动作发生的频繁程度。常见的频率副词按频率从高到低排列：\n*   `always` (100%, 总是)\n*   `usually` (通常)\n*   `often` (经常)\n*   `sometimes` (有时)\n*   `seldom` / `rarely` (很少)\n*   `never` (0%, 从不)\n\n**位置**：\n1.  **句中**：通常放在 `be` 动词、情态动词或助动词之后，实义动词之前。这是最常见的位置。\n    *   `He is always happy.`\n    *   `I can never swim.`\n    *   `She often plays the piano.`\n2.  **句首**：`sometimes`, `usually`, `often` 可以放在句首，用以强调。`always` 和 `never` 很少放句首（除非是祈使句）。\n    *   `Sometimes, I feel tired.`\n3.  **句末**：`sometimes` 和 `often` 也可以放在句末，多见于口语。\n    *   `We go to the park sometimes.`\n\n**易混淆词**：\n*   `sometimes` (有时): 频率副词。\n*   `sometime` (某个时候): 副词，指将来或过去不确定的时间点。\n*   `some time` (一段时间): 名词短语。","socratic_tracks":[{"title":"词义与词性","steps":[{"question":"中文“有时”在英语中对应哪个词？","hint":"这个词用来表示事情发生的频率，不是每次都发生，也不是从不发生。","takeaway":"“有时”对应的英文是频率副词 `sometimes`。"},{"question":"这个词在句子中起什么作用？","hint":"它修饰了 `go to the cinema` 这个动作发生的频率。","takeaway":"`sometimes` 作为频率副词，用来修饰整个句子的动作。"}]},{"title":"句子结构与位置","steps":[{"question":"观察句子结构 `_____, I go to the cinema.`，横线上的词后面有一个逗号，并且位于句首。这说明它是什么成分？","hint":"很多副词或副词短语都可以放在句首，用来修饰整个句子。","takeaway":"位于句首并用逗号隔开的通常是状语成分，用来修饰全句。"},{"question":"频率副词 `sometimes` 可以放在句首吗？放在句首时需要注意什么？","hint":"回想一下你读过的句子，比如 `Sometimes I feel sad.` 放在句首时，这个单词的第一个字母有什么变化？","takeaway":"`sometimes` 可以放在句首，此时首字母需要大写。"}]},{"title":"易混词辨析","steps":[{"question":"`sometimes`, `sometime`, `some time` 这三个看起来很像，它们的意思和用法一样吗？","hint":"`sometimes` 是“有时”；`sometime` 是“在某个时候”（指将来或过去不确定的时间点）；`some time` 是“一段时间”。","takeaway":"这三个词（组）的含义和用法完全不同，需要仔细区分。"},{"question":"那么在这个句子里，我们应该用哪一个？为什么？","hint":"句子想表达的是“我有时会去看电影”，这是一个频率概念。","takeaway":"本题考查的是频率，所以必须使用 `sometimes`。"}]}]}},{"number":"37","item_type":"fill_blank","context_note":"","stem":"His jacket is very d_____. He'll wash it this afternoon.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"dirty","explanation_md":"本题考查根据语境选择合适的形容词。\n1.  句子后半部分 “He'll wash it this afternoon.” (他今天下午要去洗它) 是关键线索。\n2.  人们通常在衣服脏了的时候才会去清洗。\n3.  因此，空格处需要一个表示“脏的”含义的形容词来描述夹克(jacket)的状态。\n4.  题干给出了首字母提示 'd'。\n5.  结合以上信息，可以确定答案是 “dirty” (脏的)。","knowledge_expansion_md":"**1. 核心词汇与反义词**\n*   `dirty` (adj. 脏的) 的反义词是 `clean` (adj. 干净的)。掌握反义词对有助于加深理解和记忆。\n*   `dirty` 的名词形式是 `dirt` (n. 污垢, 泥土)。\n\n**2. 句型结构：主系表结构**\n*   本句 “His jacket is very dirty.” 采用的是 “主语 + be动词 + (副词) + 形容词” 的主系表结构，用以描述主语的性质或状态。\n*   例如：`The weather is nice today.` (今天天气很好。) `This book is interesting.` (这本书很有趣。)\n\n**3. 上下文逻辑推理**\n*   在完形填空或句子填空题中，利用上下文提供的线索进行逻辑推理是重要的解题技巧。本题中，“wash”(清洗)这一动作直接指向了“dirty”(脏的)这一状态，这是典型的因果逻辑关系。","socratic_tracks":[{"title":"语境逻辑推理","steps":[{"question":"题干的后半句 'He'll wash it this afternoon' 告诉了我们关于这件夹克的什么信息？","hint":"我们通常在什么情况下会洗衣服？","takeaway":"后半句暗示了这件夹克是脏的，需要清洗。"},{"question":"根据这个推断，我们需要一个表示“脏的”意思的单词。这个单词需要以什么字母开头？","hint":"看看题干中给出的首字母提示 'd_____'。","takeaway":"我们需要一个以 'd' 开头的形容词来形容这件夹克是脏的。"},{"question":"那么，哪个以 'd' 开头的英文单词是“脏的”意思呢？","hint":"想一想“干净” (clean) 的反义词。","takeaway":"符合所有条件的单词是 'dirty'。"}]},{"title":"词性与句法功能","steps":[{"question":"在句子 'His jacket is very d_____' 中，空缺的单词用来做什么？","hint":"它在 'is' 动词后面，用来描述主语 'His jacket'。","takeaway":"这个单词用来描述主语的状态或性质，因此它是一个形容词。"},{"question":"我们学过哪些以 'd' 开头的形容词？比如 'difficult', 'dangerous', 'dark'。它们放在这里意思合适吗？","hint":"结合“他要去洗夹克”这个语境，判断这些词是否符合逻辑。","takeaway":"只有表示“脏的”意思的形容词才符合这里的语境逻辑。"}]},{"title":"反义词联想","steps":[{"question":"洗衣服的目的是什么？想让衣服变成什么样？","hint":"洗完之后，衣服就不脏了，而是...？","takeaway":"洗衣服是为了让它变干净 (clean)。"},{"question":"既然洗衣服是为了变“干净”(clean)，那么洗之前的状态就是“干净”的反面。它的反义词是什么？","hint":"这个词在中文里是“脏的”。","takeaway":"“干净” (clean) 的反义词是“脏的” (dirty)。"},{"question":"这个单词 'dirty' 是否符合题干中 'd_____' 的拼写提示？","hint":"检查一下 'dirty' 的首字母。","takeaway":"是的，'dirty' 以 'd' 开头，完全符合题目要求。"}]}]}},{"number":"38","item_type":"fill_blank","context_note":"","stem":"Jim had a cold _____ (昨天).","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"yesterday","explanation_md":"本题考查时间状语的翻译和一般过去时的使用。\n1.  题干要求将括号中的中文“昨天”翻译成对应的英文单词。\n2.  “昨天”的英文是 “yesterday”。\n3.  句子中的动词 “had” 是 “have” 的过去式，表明整个句子描述的是过去发生的事情。\n4.  时间状语 “yesterday” 与一般过去时态是固定搭配。\n5.  因此，填入 “yesterday” 使句子完整且时态正确。","knowledge_expansion_md":"**1. 时态一致性**\n*   英语句子中，动词的时态必须和时间状语保持一致。常见的表示过去的时间状语有：`yesterday` (昨天), `last night/week/month/year` (昨晚/上周/上个月/去年), `... ago` (……以前), `in 2010` (在2010年), `the day before yesterday` (前天) 等。当句中出现这些词时，动词通常要用一般过去时。\n\n**2. 常见时间名词**\n*   `today` (今天)\n*   `yesterday` (昨天)\n*   `tomorrow` (明天)\n*   `the day before yesterday` (前天)\n*   `the day after tomorrow` (后天)\n\n**3. 固定搭配**\n*   `have a cold` 是一个固定短语，意为“感冒”。其过去式是 `had a cold`。\n*   类似的表达还有 `have a fever` (发烧), `have a headache` (头痛) 等。","socratic_tracks":[{"title":"时态与时间状语","steps":[{"question":"观察句子 'Jim had a cold...'，动词 'had' 是什么时态？","hint":"它是 'have' 的什么形式？现在式还是过去式？","takeaway":"动词 'had' 是 'have' 的过去式，所以这是一个过去时态的句子。"},{"question":"既然句子是过去时，那么括号里的时间“昨天”应该用哪个英文单词来表示，才能和过去时态匹配？","hint":"表示“昨天”的英文单词是什么？","takeaway":"表示过去的“昨天”，其英文单词是 'yesterday'，它和过去时态是固定搭配。"}]},{"title":"核心词汇翻译","steps":[{"question":"这道题的核心任务是什么？","hint":"看看括号里的内容。","takeaway":"核心任务是把中文“昨天”翻译成英文。"},{"question":"我们学过的表示“今天”、“明天”、“昨天”的单词分别是什么？","hint":"Today, ... , ...","takeaway":"它们分别是 'today' (今天), 'tomorrow' (明天), 和 'yesterday' (昨天)。"},{"question":"那么，这道题的空格里应该填入哪个单词？","hint":"选择对应“昨天”的那个词。","takeaway":"应该填入 'yesterday'。"}]},{"title":"固定搭配应用","steps":[{"question":"句子中的 'had a cold' 是什么意思？","hint":"这是一个关于身体状况的常用短语。","takeaway":"'have a cold' 是一个固定搭配，意思是“感冒”。"},{"question":"当我们说“我昨天感冒了”，这句话在描述什么时候发生的事情？","hint":"是现在、过去还是将来？","takeaway":"这句话描述的是过去发生的事情。"},{"question":"所以，为了表达“昨天”这个过去的时间点，我们应该用哪个词？","hint":"回忆一下表示过去时间的常用词。","takeaway":"我们应该使用 'yesterday' 来准确表达“昨天”这个时间。"}]}]}},{"number":"39","item_type":"fill_blank","context_note":"","stem":"Wang Yaping gave her daughter a g_____ when she came back to the earth. That was a star.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"gift","explanation_md":"本题考查在语境中选择合适的词汇。\n1.  句子描述了宇航员王亚平回到地球后，送给她女儿一件东西。\n2.  关键线索是动词 “gave” (给予) 和后面的解释 “That was a star” (那是一颗星星)。\n3.  “gave ... a ...” 结构通常指“给某人一件……”，空格处应填入一个可数名词单数。\n4.  这个名词需要以字母 'g' 开头。\n5.  结合语境，王亚平送给女儿的“星星”是一件“礼物”。\n6.  因此，符合条件的单词是 “gift” (礼物)。","knowledge_expansion_md":"**1. 核心词汇与同义词**\n*   `gift` (n. 礼物) 的同义词是 `present` (n. 礼物)。在大多数情况下，两者可以互换使用。例如: `She received many birthday gifts/presents.` (她收到了很多生日礼物。)\n\n**2. 句型结构：双宾语**\n*   本句使用了 `give somebody something` (即 `give sb sth`) 的双宾语结构，意为“给某人某物”。其中 `somebody` 是间接宾语，`something` 是直接宾语。\n*   例如: `My father gave me a new bike.` (我爸爸给了我一辆新自行车。)\n*   这个结构也可以转换为 `give something to somebody`。例如: `My father gave a new bike to me.`\n\n**3. 背景知识**\n*   了解一些时事和文化背景有助于更好地理解题目。王亚平是中国著名的女航天员，她从太空返回后，送给了女儿一颗“来自太空的星星”作为礼物，这个故事广为人知，是本题的命题背景。","socratic_tracks":[{"title":"语境与背景知识","steps":[{"question":"你知道王亚平是谁吗？她从哪里回来？","hint":"题干提到了 'came back to the earth' (回到地球)。","takeaway":"王亚平是一位从太空返回地球的宇航员。"},{"question":"她回来后给了女儿一颗“星星”。你觉得这颗“星星”对她女儿来说是什么？","hint":"妈妈从太空带回来的特殊东西，可以称之为什么？","takeaway":"这颗星星是一件非常特别的礼物。"},{"question":"表示“礼物”的单词中，有没有以 'g' 开头的？","hint":"想一想生日时会收到的东西。","takeaway":"是的，'gift' 就是以 'g' 开头的表示“礼物”的单词。"}]},{"title":"句法结构分析","steps":[{"question":"观察 'gave her daughter a g_____' 这个短语的结构。'gave' 后面跟了几个对象？","hint":"一个是指人 ('her daughter')，另一个是指物 (a g_____)。","takeaway":"动词 'gave' 后面跟了两个宾语：间接宾语 'her daughter' 和直接宾语 'a g_____'。"},{"question":"在这个 'give sb sth' (给某人某物) 的结构中，'a g_____' 指的是被给予的“物品”。所以，空格里应该填一个什么词性的词？","hint":"表示物品名称的词是什么词性？","takeaway":"空格里应该填一个名词，表示具体的物品。"},{"question":"根据后文 'That was a star'，这个以 'g' 开头的名词应该是什么？","hint":"这颗星星是一份心意，一份...？","takeaway":"这个名词是 'gift' (礼物)，符合句意和首字母提示。"}]},{"title":"词汇辨析与选择","steps":[{"question":"我们来想一想以 'g' 开头的名词有哪些？比如 'game' (游戏), 'glass' (玻璃杯), 'glove' (手套)。","hint":"思考这些词的意思。","takeaway":"我们有很多以 'g' 开头的名词。"},{"question":"现在把这些词放进句子里试试。'Wang Yaping gave her daughter a game/glass/glove... That was a star.' 意思通顺吗？","hint":"一颗星星能是一个游戏、一个玻璃杯或一个手套吗？","takeaway":"这些词都不符合“那是一颗星星”的描述，逻辑上不通。"},{"question":"那么，有没有一个以 'g' 开头的名词，可以泛指任何赠送的东西，比如一颗星星？","hint":"这个词就是“礼物”。","takeaway":"只有 'gift' (礼物) 这个词最能概括“星星”在这里扮演的角色。"}]}]}},{"number":"40","item_type":"fill_blank","context_note":"","stem":"I w_____ TV with my mother last weekend.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"横线","teaching":{"correct_answer":"watched","explanation_md":"本题考查一般过去时的动词形式。\n1.  句末的时间状语 “last weekend” (上个周末) 是一个明确的过去时间标志，表明这个动作发生在过去。\n2.  因此，句子需要使用一般过去时。\n3.  题干中 “w_____ TV” 是一个常见的动词短语，表示“看电视”。\n4.  “看”的动词原形是 “watch”。\n5.  “watch” 是一个规则动词，其过去式是在词尾加 “-ed”。\n6.  所以，空格处应填入 “watch” 的过去式 “watched”。","knowledge_expansion_md":"**1. 一般过去时**\n*   一般过去时用于表示过去某个时间发生的动作或存在的状态。其构成通常是：主语 + 动词的过去式 + 其他。\n*   标志词：`yesterday`, `last week/month/year`, `... ago`, `in + 过去年份` 等。\n\n**2. 规则动词的过去式变化规则**\n*   **一般情况**：直接在词尾加 `-ed`。如 `watch` → `watched`, `work` → `worked`。\n*   **以不发音的e结尾**：直接加 `-d`。如 `like` → `liked`, `live` → `lived`。\n*   **以“辅音字母+y”结尾**：变 `y` 为 `i` 再加 `-ed`。如 `study` → `studied`, `carry` → `carried`。\n*   **重读闭音节结尾，末尾只有一个辅音字母**：双写该辅音字母再加 `-ed`。如 `stop` → `stopped`, `plan` → `planned`。\n\n**3. 不规则动词**\n*   很多常用动词的过去式是不规则的，需要专门记忆。如 `go` → `went`, `see` → `saw`, `eat` → `ate`, `have` → `had`。","socratic_tracks":[{"title":"寻找时间线索","steps":[{"question":"句子中哪个词或短语告诉了我们这件事发生的时间？","hint":"看看句子的末尾。","takeaway":"时间状语 'last weekend' (上个周末) 告诉我们这是过去发生的事。"},{"question":"当一个句子描述过去发生的事情时，它的动词应该使用什么时态？","hint":"是现在时、过去时还是将来时？","takeaway":"描述过去的事情，动词需要用过去式。"}]},{"title":"动词变化规则","steps":[{"question":"短语 'w_____ TV' 中，表示“看”的动词原形是什么？","hint":"这个词以 'w' 开头，和 'TV' 搭配。","takeaway":"表示“看电视”的动词原形是 'watch'。"},{"question":"动词 'watch' 的过去式是怎么变化的？它是一个规则动词还是不规则动词？","hint":"大多数动词的过去式是在词尾加 -ed。","takeaway":"'watch' 是一个规则动词，它的过去式是在词尾加 -ed。"},{"question":"那么，'watch' 加上 '-ed' 之后，正确的拼写是什么？","hint":"直接在后面加上去就可以了。","takeaway":"正确的过去式是 'watched'。"}]},{"title":"理解句子含义","steps":[{"question":"这个句子 'I w_____ TV with my mother last weekend.' 想要表达什么意思？","hint":"翻译成中文试一试。","takeaway":"这句话的意思是“我上周末和妈妈一起看了电视”。"},{"question":"在中文里，“上周末”和“看了”这个动作，表明动作已经完成了吗？","hint":"是的，事情已经发生了。","takeaway":"这是一个已经发生并完成的动作。"},{"question":"在英语中，要表达一个在过去已经完成的动作，动词“看” (watch) 应该变成什么形式？","hint":"使用动词的过去时态。","takeaway":"动词 'watch' 应该变成其过去式 'watched'。"}]}]}}]},{"section_title":"IV. 完形填空 (共10分)","section_instruction":"Do you like bats (蝙蝠)? I don't. But they are interesting.\nBirds can fly and bats can __41__, too. A bat is a kind of bird? The answer is \"No\". Bats are mammals (哺乳动物). Birds and bats are __42__.\nBats have four legs. __43__ have only two. Bats have teeth and birds have no teeth. Bats have big __44__, but birds' ears are only holes in their heads.\nAll bats like to eat insects (昆虫). They look for food at night and __45__ in the day. But most of the birds like looking for food during the day and having a rest __46__. They fly and __47__ insects. A bat's two legs __48__ it and a piece of skin joins (连接) them together. They are just like a bird's __49__.\nSome people think bats have good eyesight. It is not true. Bats have eyes but can't see well. They can hear very well. They can feel when a thing is. That is __50__ bats can fly in the evening.","items":[{"number":"41","item_type":"cloze","context_note":"","stem":"Birds can fly and bats can __41__, too.","options":{"A":"fly","B":"see","C":"eat","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"该句使用了“... and ..., too.”的并列结构，意为“也，还”。前半句说“Birds can fly”（鸟会飞），后半句的“too”表明蝙蝠也具备同样的能力。因此，空格处应填入与前文一致的动作“fly”（飞）。整个句子意为：鸟会飞，蝙蝠也会飞。","knowledge_expansion_md":"### 词汇与语法拓展\n1.  **并列连词 `and`**：`and` 用于连接两个或多个语法功能相同的词、短语或句子，表示并列、递进或顺承关系。例如：`He can sing and dance.` (他能唱能跳)。\n2.  **副词 `too` 的用法**：`too` 意为“也”，通常用于肯定句句末，表示与前面提到的情况相同。例如：`I like English. My brother likes it, too.`\n3.  **`too`, `also`, `either` 的区别**：\n    *   `too`：用于肯定句句末，前面通常有逗号。`She is a doctor, too.`\n    *   `also`：用于肯定句，位置较灵活，常在行为动词前，be动词或助动词后。`She is also a doctor.`\n    *   `either`：用于否定句句末，意为“也（不）”。`He can't swim, and I can't, either.`\n4.  **情态动词 `can`**：表示“能够，会”，表达一种能力。其后必须跟动词原形。例如：`A fish can swim.`","socratic_tracks":[{"title":"并列结构分析","steps":[{"question":"句子中的连词 'and' 和句末的 'too' 组合在一起，通常表达什么意思？","hint":"想一想这个例子：'You are a student, and I am a student, too.' (你是一个学生，我也是一个学生。)","takeaway":"结构 '... and ..., too' 表示后者和前者一样，也具备某种特征或能力。"},{"question":"既然前半句说 'Birds can fly' (鸟会飞)，那么根据 'and...too' 的逻辑，后半句应该说蝙蝠怎么样？","hint":"蝙蝠也具备和鸟一样的什么能力？","takeaway":"根据并列逻辑，后半句应该表达“蝙蝠也会飞”的意思。"}]},{"title":"情态动词 `can`","steps":[{"question":"这个句子里的 'can' 是什么意思？它在语法上有什么要求？","hint":"它是一个情态动词，表示“能够”或“会做某事”。","takeaway":"情态动词 'can' 表示能力，后面必须跟动词原形。"},{"question":"观察 A, B, C 三个选项 'fly', 'see', 'eat'，它们都是什么形式的动词？","hint":"它们是动词的初始形态，没有加-s, -ed, -ing等后缀。","takeaway":"所有选项都是动词原形，在语法上都符合'can'的要求，因此必须通过句意来判断。"}]},{"title":"词义与常识","steps":[{"question":"请分别说出选项 'fly', 'see', 'eat' 的中文意思。","hint":"飞翔、看见、吃。","takeaway":"准确理解选项词义是做对选择题的基础。"},{"question":"虽然蝙蝠也会看和吃，但为什么这里选 'fly' 最合适？","hint":"注意题目中与鸟(birds)的并列关系，什么能力是鸟和蝙蝠共有的一个显著特征？","takeaway":"在语境中，'飞翔'是连接鸟和蝙蝠的最直接、最显著的共同点。"}]}]}},{"number":"42","item_type":"cloze","context_note":"","stem":"Birds and bats are __42__.","options":{"A":"big","B":"bad","C":"different","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这句话是一个承上启下的过渡句。前文（41题）讲述了鸟和蝙蝠的共同点（都会飞），而紧接着的后文（44题）开始用“but”对比它们耳朵的不同。因此，这句话的作用是引出下文对两者差异的论述，说明“鸟和蝙蝠是不同的（different）”。选项A“大的”和B“坏的”在文中没有依据，也不符合上下文的逻辑。","knowledge_expansion_md":"### 篇章逻辑与过渡词\n1.  **篇章结构**：完形填空和阅读理解常常考察对文章整体结构的把握。常见的结构有：总分结构、因果结构、对比/比较结构等。本文采用了“总-分”的对比结构：先提出共同点（都会飞），然后用一句话总起（它们是不同的），再分别阐述不同点（腿的数量、耳朵的形态等）。\n2.  **过渡句**：像本题这样的句子被称为过渡句，它能使文章的思路转折更加自然流畅。从讲述“相同”到讲述“不同”，需要一个明确的信号，`Birds and bats are different.` 就是这个信号。\n3.  **形容词作表语**：本句是“主语 + be动词 + 形容词”的“主系表”结构，形容词作表语，说明主语的性质或状态。`different` (不同的), `big` (大的), `bad` (坏的) 都是形容词，选择哪个取决于语境。","socratic_tracks":[{"title":"篇章逻辑推理","steps":[{"question":"前一句话说了鸟和蝙蝠的什么关系？是相同点还是不同点？","hint":"回顾41题的句子：'Birds can fly and bats can fly, too.'","takeaway":"前文指出了鸟和蝙蝠的共同点：都会飞。"},{"question":"再看看第44题所在的句子 'Bats have big ears, but birds' ears are...'，这句话在比较什么？是相同点还是不同点？","hint":"注意句子中的转折词 'but' (但是)。","takeaway":"后文通过 'but' 开始详细对比鸟和蝙蝠的不同之处，比如耳朵。"},{"question":"那么，要从“讲相同”过渡到“讲不同”，中间这句话应该填什么最合适？","hint":"这句话需要一个总结性的词来开启下文的对比。","takeaway":"选择 'different' (不同的) 才能承上启下，自然地引出后文对两者差异的描述。"}]},{"title":"词义辨析与排除法","steps":[{"question":"选项 'big', 'bad', 'different' 分别是什么意思？","hint":"大的、坏的、不同的。","takeaway":"理解选项的基本词义是解题的第一步。"},{"question":"文章中有没有信息支持“鸟和蝙蝠是大的”或者“是坏的”这种说法？","hint":"通读上下文，寻找相关的描述性词语。","takeaway":"文中没有提供关于它们体型大小或品性好坏的信息，因此'big'和'bad'缺乏依据。"},{"question":"排除了 'big' 和 'bad'，剩下的 'different' 是否符合我们对文章逻辑的分析？","hint":"文章的结构是从“共性”转向“差异性”。","takeaway":"只有 'different' 符合文章从相同点转向不同点的逻辑脉络，是最佳答案。"}]},{"title":"句子结构分析","steps":[{"question":"句子 'Birds and bats are ___.' 是一个什么基本句型？","hint":"主语 + be动词 + ...","takeaway":"这是一个“主语-系动词-表语”结构，简称“主系表”结构。"},{"question":"在这个结构中，横线部分（表语）需要什么词性的词来修饰主语 'Birds and bats'？","hint":"什么词可以用来描述一个东西的性质或状态？","takeaway":"表语通常由形容词或名词充当，这里需要一个形容词来说明主语的特征。"},{"question":"A, B, C三个选项都是形容词，从语法上都说得通。这提醒我们在做题时要注意什么？","hint":"语法正确，但意思不一定符合文章。","takeaway":"当所有选项语法都正确时，必须结合上下文的语境和逻辑来做出最终选择。"}]}]}},{"number":"43","item_type":"cloze","context_note":"","stem":"__43__ have only two.","options":{"A":"Mammals","B":"Birds","C":"Animals","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"根据上下文，文章正在对比鸟类和蝙蝠的不同之处。前一句提到“Bats have four legs.”（蝙蝠有四条腿），因此本句是在对比腿的数量。蝙蝠是哺乳动物，有四肢（两条腿和两个翼手）。相比之下，鸟类只有两条腿。因此，填入“Birds”（鸟类）构成“鸟类只有两条（腿）”，与前文提到的蝙蝠形成对比，逻辑最为通顺。选项A和C都不符合生物学常识。","knowledge_expansion_md":"### 上下文推断与省略\n1.  **省略 (Ellipsis)**：为了使语言简洁，英语中常常省略在上下文中已清晰明了的词语。本句中 `...have only two.` 省略了宾语 `legs`（腿），因为在比较动物的语境下，这个意思不言而喻。例如：`I ordered three cakes, but he only ate two.` (我点了三个蛋糕，但他只吃了两个（蛋糕）)。\n2.  **背景常识**：做阅读和完形填空题时，一定的背景常识是很有帮助的。了解“鸟有两条腿”和“蝙蝠是哺乳动物”等基本生物知识，能帮助我们快速锁定答案。\n3.  **主谓一致**：横线处作主语，动词是 `have`（原形），说明主语是复数形式。选项 `Birds`, `Mammals`, `Animals` 都是复数名词，语法上都符合要求，因此需要从语意和逻辑上判断。","socratic_tracks":[{"title":"上下文与常识推断","steps":[{"question":"这句话 '__ have only two.' 省略了宾语，你认为 'two' 指的是两个什么？","hint":"文章正在比较鸟和蝙蝠，想一想它们在身体部位数量上有什么显著区别？","takeaway":"在比较动物的语境下，'two' 最可能指代 '两条腿'。"},{"question":"知道了 'two' 指的是 '两条腿'，那么选项 'Mammals'(哺乳动物), 'Birds'(鸟类), 'Animals'(动物) 中，哪一类是“只有两条腿”的？","hint":"想一想猫、狗、大象等哺乳动物有几条腿？再想想鸟类。","takeaway":"鸟类是具有两条腿的典型动物，符合“have only two (legs)”的描述。"},{"question":"将 'Birds' 代入句子，与上文提到的蝙蝠（有四肢）进行对比，整个逻辑通顺吗？","hint":"文章的主题是比较鸟和蝙蝠的不同点。","takeaway":"选择'Birds'可以和蝙蝠形成鲜明对比，完全符合文章的写作逻辑。"}]},{"title":"排除法应用","steps":[{"question":"我们来验证A选项 'Mammals'。'Mammals have only two (legs)' (哺乳动物只有两条腿) 这个说法普遍成立吗？","hint":"虽然人类是两条腿的哺乳动物，但绝大多数哺乳动物（如猫、狗、牛）有几条腿？","takeaway":"大多数哺乳动物有四条腿，所以A选项的说法不准确，应排除。"},{"question":"再看C选项 'Animals'。'Animals have only two (legs)' (动物只有两条腿) 这个说法正确吗？","hint":"动物的范围很广，比如昆虫有六条腿，鱼没有腿。","takeaway":"这个说法过于笼统和绝对，明显是错误的，应排除。"},{"question":"排除了A和C之后，剩下的B选项 'Birds' 是否是唯一合理的答案？","hint":"鸟类确实只有两条腿，这既是常识，也符合文章的对比逻辑。","takeaway":"通过排除法，我们可以确认'Birds'是唯一符合常识和语境的正确答案。"}]},{"title":"主谓一致判断","steps":[{"question":"观察句子 '__ have only two.'，谓语动词是 'have' 还是 'has'？","hint":"句中用的是 'have'。","takeaway":"谓语动词是 'have'，而不是第三人称单数形式 'has'。"},{"question":"动词用 'have'，说明主语应该是单数还是复数？","hint":"想一想：'A bird has...' vs 'Birds have...'","takeaway":"动词 'have' 表明主语必须是复数名词或第一/二人称，这里应为复数名词。"},{"question":"检查选项 'Mammals', 'Birds', 'Animals'，它们的单复数形式是否都符合语法要求？","hint":"这三个词都以-s结尾，是复数形式。","takeaway":"所有选项在语法上都可行，这再次证明解题的关键在于理解文意和逻辑，而非单纯的语法判断。"}]}]}},{"number":"44","item_type":"cloze","context_note":"","stem":"Bats have big __44__, but birds' ears are only holes in their heads.","options":{"A":"wings","B":"eyes","C":"ears","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这句话使用转折连词“but”（但是）来连接两个相反或对比鲜明的部分。后半句描述的是“birds' ears”（鸟的耳朵）。根据对比逻辑，前半句应该描述蝙蝠身上与之相对应的部位。因此，空格处应填入“ears”（耳朵），构成“蝙蝠有大耳朵，但鸟的耳朵……”的对比关系。整个句子清晰地指出了两种动物在耳朵形态上的差异。","knowledge_expansion_md":"### 对比连词 `but` 与平行结构\n1.  **转折连词 `but`**：`but` 是英语中最常用的转折连词之一，用于引出与前文内容相反或不同的信息。例如：`He is old, but he is very strong.` (他年纪大了，但身体很强壮)。在完形填空中，看到 `but` 就要立刻意识到前后内容是对比关系。\n2.  **平行结构 (Parallelism)**：为了表达清晰和有力，`but` 连接的两个部分在结构上常常是平行或对称的。本句就是典型的例子：\n    *   `Bats have big ears` (主+谓+宾)\n    *   `but`\n    *   `birds' ears are only holes` (主+系+表)\n    前后都在谈论“耳朵(ears)”，形成了内容上的平行对比。\n3.  **所有格**：`birds' ears` 意为“鸟的耳朵”。`birds` 是复数名词，其所有格形式是在词尾加撇号 `'`。如果是单数名词，则加 `'s`，如 `a bird's ear`。","socratic_tracks":[{"title":"转折连词 `but` 的逻辑","steps":[{"question":"句子中的 'but' (但是) 起到了什么作用？它连接的两个部分是什么关系？","hint":"想一想，当你说“我喜欢苹果，但是...”时，后面会说什么？","takeaway":"'but' 用于连接两个相反或不同的信息，形成对比关系。"},{"question":"请看 'but' 后面的半句话，它描述的是鸟的哪个身体部位？","hint":"句子中明确写着 'birds' ears'。","takeaway":"后半句描述的是“鸟的耳朵”。"},{"question":"既然 'but' 是用来对比的，那么前半句 'Bats have big ___' 应该描述蝙蝠的哪个部位，才能和“鸟的耳朵”形成工整的对比？","hint":"我们通常会比较同一种东西，比如苹果和梨的大小，而不是苹果的大小和梨的颜色。","takeaway":"为了形成有效的对比，前半句也必须是描述“耳朵”，才能与后半句的“鸟的耳朵”相对应。"}]},{"title":"词义与背景常识","steps":[{"question":"请说出选项 'wings'(翅膀), 'eyes'(眼睛), 'ears'(耳朵) 的意思。","hint":"这些都是动物身体部位的名称。","takeaway":"准确理解选项词义是解题的基础。"},{"question":"根据你的常识或印象，蝙蝠的哪个部位以“大”而著称？","hint":"想想蝙蝠的形象，它们是不是有两只非常显眼的大耳朵？它们依靠听觉来导航。","takeaway":"蝙蝠以其大耳朵而闻名，这符合句中 'big' (大的) 的描述。"},{"question":"将 'ears' 填入空中，组成句子“蝙蝠有大耳朵，但鸟的耳朵只是头上的洞”，这句话在逻辑上通顺吗？","hint":"这句话是否清晰地对比了两种动物的差异？","takeaway":"结合语境和常识，'ears'是唯一能使句子意思通顺、逻辑合理的选项。"}]},{"title":"句子结构对称性","steps":[{"question":"观察这个对比句的结构：'Bats have big ___, but birds' ears are...'。你发现前后两个部分在讨论的对象上有什么共同点吗？","hint":"前半句的主语是'Bats'，后半句的主语是'birds' ears'。它们都在讨论动物的某个特征。","takeaway":"这个句子在 'but' 前后形成了结构和内容上的平行对比关系。"},{"question":"后半句明确指出了被比较的名词是 'ears'。为了保持这种对比的工整和对称，前半句中被 'big' 修饰的名词应该是什么？","hint":"对比的双方应该是同一类别的事物，这样才有可比性。","takeaway":"根据平行结构原则，空白处也应该填入'ears'，以实现工整的对比。"}]}]}},{"number":"45","item_type":"cloze","context_note":"","stem":"They look for food at night and __45__ in the day.","options":{"A":"fly","B":"sleep","C":"eat","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查上下文逻辑推理和词义辨析。根据前半句“They look for food at night”（它们在晚上寻找食物），可以推断出这些动物是夜行性的。连词“and”在这里连接了两个在时间上相对的活动。既然它们晚上活动，那么在“in the day”（白天）就应该是休息。在选项中，“sleep”（睡觉）最符合这一逻辑，与夜间觅食形成对比。","knowledge_expansion_md":"**1. 上下文逻辑与反义关系**：完形填空题常常需要根据上下文的逻辑关系来选择答案。表示时间对比的词组，如 `at night` 和 `in the day`，常常暗示其对应的行为也是相反的，例如：活动 vs. 休息，工作 vs. 睡觉。\n\n**2. 连词 `and` 的用法**：`and` 不仅可以连接相似或递进的观念，也可以在特定语境下（如描述一天24小时的活动时）连接两个相对的活动，构成一个完整的日常作息描述。\n\n**3. 时间介词**：注意表示时间的固定搭配：`at night` (在夜晚)，`in the day` (在白天)，`in the morning` (在早上)，`in the afternoon` (在下午)，`in the evening` (在傍晚)。","socratic_tracks":[{"title":"逻辑推理与反义关系","steps":[{"question":"句子中 'and' 连接了两个时间段的行为，一个是 'at night' (在晚上)，另一个是 'in the day' (在白天)。这两个时间段是相反的，那么它们在这两个时间段的行为应该是怎样的关系呢？","hint":"想一想我们人类，白天工作学习，晚上做什么？","takeaway":"在描述日常作息时，'and' 常常连接白天和黑夜的相反活动。"},{"question":"既然这些动物晚上 'look for food' (寻找食物)，这说明它们晚上很活跃。那么根据上一步的推理，它们白天应该做什么？","hint":"活跃的反义词是什么？","takeaway":"与夜晚的活跃（觅食）相对应，白天的活动应该是休息或睡觉。"}]},{"title":"动词词义辨析","steps":[{"question":"我们来看看三个选项：fly, sleep, eat。它们分别是什么意思？","hint":"fly是飞，sleep是睡觉，eat是吃。","takeaway":"准确理解选项动词的含义是做对题目的第一步。"},{"question":"哪个动词最能表示'休息'或者'不活动'的状态，与'look for food' (寻找食物) 形成对比？","hint":"寻找食物是一种消耗能量的活动，哪个选项是恢复能量的活动？","takeaway":"'Sleep' (睡觉) 是与 'look for food' (觅食) 相对的休息活动。"}]},{"title":"上下文语境理解","steps":[{"question":"这句话描述的是哪一类动物的习性？","hint":"晚上出来找食物的动物，我们通常叫它们什么动物？","takeaway":"通过'look for food at night'可以推断出，这里描述的是夜行动物。"},{"question":"对于夜行动物来说，它们白天的主要活动是什么？","hint":"比如猫头鹰、蝙蝠，它们白天通常在哪里，做什么？","takeaway":"夜行动物通常在白天睡觉以保存精力，为夜间的活动做准备。"}]}]}},{"number":"46","item_type":"cloze","context_note":"","stem":"But most of the birds like looking for food during the day and having a rest __46__.","options":{"A":"in the morning","B":"in the afternoon","C":"at night","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查转折关系和时间逻辑。句子以“But”（但是）开头，表明其内容与前文描述的夜行动物相反。句中提到“most of the birds like looking for food during the day”（大多数鸟类喜欢在白天觅食），说明它们是昼行性动物。因此，它们“having a rest”（休息）的时间就应该是与白天相对的夜晚。选项中只有“at night”（在晚上）符合这一逻辑。","knowledge_expansion_md":"**1. 转折连词 `But`**：`But` 用于引出与前文意思相反或不同的信息，是阅读理解和完形填空中非常重要的逻辑信号词。看到 `But`，就要立刻反应出前后内容存在对比。\n\n**2. 时间表达的逻辑**：一天主要分为 `day` (白天) 和 `night` (夜晚)。`during the day` 指的是在白天这段时间。如果一个活动在白天进行，那么与之相对的休息活动通常就在夜晚进行。\n\n**3. 介词短语辨析**：`in the morning` (在早上) 和 `in the afternoon` (在下午) 都属于 `during the day` 的范畴。在逻辑上，不能说“在白天觅食，在下午休息”，因为这不构成完整的作息循环。而 `at night` (在晚上) 则与 `during the day` 形成完美对立。","socratic_tracks":[{"title":"转折连词 'But' 的作用","steps":[{"question":"句子开头的 'But' (但是) 起到了什么作用？它和前文是什么关系？","hint":"想一想中文里'但是'的用法，比如'他很聪明，但是很懒'。","takeaway":"'But' 用来引出与前面内容相反或不同的信息。"},{"question":"前文说的是夜行动物，那么 'But' 之后描述的鸟类，它们的习性应该是什么样的？","hint":"与'夜出昼伏'相反的是什么？","takeaway":"既然前文是夜行动物，'But'之后就应该描述昼行性动物的习性。"}]},{"title":"时间逻辑推理","steps":[{"question":"句中说鸟儿们 'like looking for food during the day'，'during the day' 是指什么时间？","hint":"day 和 night 是什么关系？","takeaway":"'during the day' 指的是在白天，与 'at night' (在夜晚) 相对。"},{"question":"既然鸟儿们白天觅食，那么它们 'having a rest' (休息) 应该在什么时候？","hint":"一天分为白天和黑夜，不在白天活动，就应该在...？","takeaway":"动物的活动和休息时间通常是互补的，白天活动，晚上就休息。"}]},{"title":"介词短语辨析","steps":[{"question":"请看三个选项 A, B, C，它们都是表示时间的短语。它们分别是什么意思？","hint":"morning, afternoon, night 分别指一天中的哪个部分？","takeaway":"A是'在早上'，B是'在下午'，C是'在晚上'。"},{"question":"早上和下午都属于 'the day' (白天) 的一部分。如果鸟儿白天觅食，它们会在白天的另一个时段休息吗？还是在完全相反的时间段休息？","hint":"结合常识想一想，大多数鸟是天亮了就出来活动，天黑了就回巢休息。","takeaway":"逻辑上，与白天活动相对应的是晚上休息，因此 'at night' 是唯一正确的选项。"}]}]}},{"number":"47","item_type":"cloze","context_note":"","stem":"They fly and __47__ insects.","options":{"A":"catch","B":"catching","C":"caught","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查并列结构中动词形式的一致性。连词“and”（和）连接了两个并列的动词，共同作主语“They”的谓语。在“and”前面的动词是“fly”，它使用了动词原形（因为主语是复数“They”，且时态为一般现在时）。根据并列结构的语法规则，“and”后面的动词也必须使用相同的形式，即动词原形。在三个选项中，只有“catch”是动词原形，因此是正确答案。","knowledge_expansion_md":"**1. 并列连词与平行结构 (Parallel Structure)**：这是一个非常重要的语法点。并列连词如 `and`, `but`, `or` 连接的词、短语或从句，在语法功能和形式上必须保持一致或对等。\n   - **连接动词**: They `sing` and `dance`. (主语为复数，动词用原形) / He `sings` and `dances`. (主语为单数，动词用三单形式)\n   - **连接不定式**: I want `to read` and `to listen` to music. (第二个 to 可省略)\n   - **连接-ing形式**: She enjoys `swimming` and `running`.\n\n**2. 一般现在时**: 当描述客观事实、普遍真理或习惯性动作时，使用一般现在时。当主语是第三人称单数时，动词末尾加-s或-es；当主语是其他人称或复数时，动词用原形。","socratic_tracks":[{"title":"并列连词 'and' 的魔法","steps":[{"question":"句子中的 'and' 连接了哪两个词？这两个词在句子中做什么成分？","hint":"看看 'and' 前后的词，它们是不是都是动作？","takeaway":"'and' 连接了两个动词 'fly' 和 '___'，它们共同描述主语 'They' 的动作。"},{"question":"当 'and' 连接两个动词时，这两个动词的形式需要遵守什么规则？","hint":"想象一下天平的两端，为了保持平衡，两边的东西应该是什么样的？","takeaway":"并列连词 'and' 要求连接的成分在形式上保持一致，这叫作平行结构。"},{"question":"既然 'and' 前面的动词是 'fly' (原形)，那么 'and' 后面的动词应该是什么形式？","hint":"在 A, B, C 三个选项中，哪个是和 'fly' 一样的动词原形？","takeaway":"根据平行结构原则，空格处也应填入动词原形 'catch'。"}]},{"title":"动词形态大阅兵","steps":[{"question":"我们来分析一下三个选项：'catch', 'catching', 'caught'。它们分别是动词 'catch' 的什么形式？","hint":"想一想动词的不同变化形式，比如原形、现在分词、过去式。","takeaway":"'catch'是动词原形，'catching'是现在分词(-ing形式)，'caught'是过去式和过去分词。"},{"question":"这个句子描述的是一种习惯性的动作，应该用什么时态？","hint":"文章在介绍鸟类的普遍习性，这是一种客观事实。","takeaway":"描述客观事实或习惯性动作时，通常使用一般现在时。"},{"question":"在一般现在时中，当主语是 'They' 时，谓语动词应该用什么形式？","hint":"主语是第三人称复数时，动词需要变化吗？","takeaway":"当主语是复数或第一、二人称时，一般现在时的谓语动词使用原形。"}]},{"title":"从句子主干看结构","steps":[{"question":"这句话的主语是谁？谓语（做的动作）是什么？","hint":"谁做了什么？","takeaway":"主语是 'They' (它们)，谓语是 'fly and ___ insects' (飞并且...昆虫)。"},{"question":"主语 'They' 是单数还是复数？","hint":"'They' 是 'he/she/it' 的复数形式。","takeaway":"'They' 是复数主语。"},{"question":"对于一个复数主语，描述一个经常发生的动作，动词应该用什么形式？","hint":"回顾一下一般现在时的动词变化规则。","takeaway":"复数主语在一般现在时中，谓语动词用原形，所以 'fly' 和 'catch' 都是正确的形式。"}]}]}},{"number":"48","item_type":"cloze","context_note":"","stem":"A bat's two legs __48__ it and a piece of skin joins (连接) them together.","options":{"A":"help","B":"want","C":"take","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查在具体语境中动词词义的辨析。句子的主语是“A bat's two legs”（一只蝙蝠的两条腿），这是一个复数名词。句子描述的是蝙蝠的身体构造及其功能，后半句“a piece of skin joins them together”（一片皮肤将它们连接在一起）说明了腿和皮肤如何构成翅膀。因此，前半句应该描述腿对蝙蝠起到的作用。在三个选项中，“help”（帮助）最符合逻辑，意为“蝙蝠的两条腿帮助它”。而“want”（想要）和“take”（拿走）放入句中语义不通。","knowledge_expansion_md":"**1. 主谓一致**：句子的主语是 `A bat's two legs`，是复数形式，所以谓语动词应使用原形。本题的三个选项 `help`, `want`, `take` 都是动词原形，所以在语法上都能与主语匹配，考察的重点就落在了词义辨析上。\n\n**2. 动词词义辨析**：这是完形填空的核心考点。解题时必须结合上下文，理解句子的真实含义。\n   - `help`: 帮助。身体的某个部分对整体起到“帮助”作用，是符合逻辑的。常用结构：`help sb. (to) do sth.`\n   - `want`: 想要。其主语通常是能发出主观意愿的人或动物，而不能是身体的某个部位。\n   - `take`: 含义丰富（拿，取，花费等），但在“腿...它”这个结构中，没有一个含义是通顺的。","socratic_tracks":[{"title":"动词词义与语境","steps":[{"question":"这句话在描述什么？是蝙蝠的故事，还是它的身体构造？","hint":"看看句子里的词：'legs' (腿), 'skin' (皮肤), 'joins' (连接)。","takeaway":"这句话在描述蝙蝠的身体结构和功能。"},{"question":"我们来分析三个选项 'help', 'want', 'take' 的意思。它们分别是什么意思？","hint":"帮助、想要、拿走。","takeaway":"准确理解动词的基本含义是解题的基础。"},{"question":"根据句意，蝙蝠的腿和皮肤组成了翅膀，那么腿对蝙蝠起到了什么作用？哪个动词最合适？","hint":"身体的各个部分对我们有什么作用？是'想要'我们，'拿走'我们，还是'帮助'我们？","takeaway":"从功能角度看，身体部位的作用是'帮助'机体，所以 'help' 是最符合逻辑的选择。"}]},{"title":"主谓一致检查","steps":[{"question":"这句话的主语是什么？是单数还是复数？","hint":"找到动作的发出者。是 'A bat' 还是 'A bat's two legs'？","takeaway":"主语是 'A bat's two legs' (一只蝙蝠的两条腿)，是复数。"},{"question":"当主语是复数，并且句子描述的是一个客观事实（一般现在时）时，谓语动词应该用什么形式？","hint":"回想一般现在时中，主语为 'they' 或复数名词时，动词是否需要加-s？","takeaway":"主语是复数时，谓语动词用原形。"},{"question":"检查一下选项 A, B, C，它们是不是都是动词原形？","hint":"help, want, take 都是原形。","takeaway":"这道题的选项在语法形式上都符合主谓一致，因此必须通过词义来判断，这增加了题目的难度。"}]},{"title":"逻辑主语判断","steps":[{"question":"我们看 B 选项 'want' (想要)。通常什么样的主语才能 'want' 东西？","hint":"一条腿、一块石头能'想要'东西吗？","takeaway":"动词 'want' 的主语通常是人或有思想、情感的动物，而不是一个身体部位。"},{"question":"所以，'A bat's two legs want it' 这句话在逻辑上说得通吗？","hint":"腿会有自己的意愿吗？","takeaway":"从逻辑上讲，腿不能作为'想要'这个动作的主语，因此 'want' 是错误的。"}]}]}},{"number":"49","item_type":"cloze","context_note":"","stem":"They are just like a bird's __49__.","options":{"A":"legs","B":"wings","C":"body","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查根据上下文进行类比推理。前一句描述了蝙蝠的飞行器官是由其腿和一片皮肤连接而成的结构。结合文章开头提到的“bats can fly”（蝙蝠会飞），可知这个结构是用来飞行的。因此，本句是将蝙蝠的飞行器官与鸟的飞行器官进行类比。鸟类用于飞行的部位是翅膀（wings），故选B。选项A（腿）和C（身体）与飞行的功能不符。","knowledge_expansion_md":"### 1. 语境线索（Context Clues）\n在完形填空题中，答案往往隐藏在空格的前后句中。本题的关键词是后文的 `fly`（飞翔），它直接揭示了被描述部位的功能，从而帮助我们锁定答案。\n\n### 2. 类比结构 `just like`\n`just like` 意为“就像……一样”，用于引出一个明喻（Simile），表示两事物在某方面有相似之处。例如：\n- *Her eyes shine just like stars.* (她的眼睛像星星一样闪亮。)\n- *This car runs just like a dream.* (这辆车开起来顺畅极了。)\n理解这个结构有助于我们抓住比较的核心——功能上的相似性。\n\n### 3. 动物身体部位词汇\n- `wing`: 翅膀\n- `feather`: 羽毛\n- `beak`: 鸟喙\n- `claw`: 爪子\n- `tail`: 尾巴\n- `fin`: 鱼鳍\n- `scale`: 鳞片","socratic_tracks":[{"title":"上下文逻辑推理","steps":[{"question":"空格前后的句子分别告诉了我们关于蝙蝠的什么信息？","hint":"前一句描述了蝙蝠的身体结构，后一句描述了这个结构的作用。","takeaway":"前文描述了蝙蝠的飞行器官，后文点明其功能是“飞翔”。"},{"question":"既然蝙蝠用这个部位来飞翔，那么鸟用什么部位来飞翔呢？","hint":"想想鸟类最独特的、用于飞行的身体部分。","takeaway":"鸟类使用翅膀（wings）进行飞翔。"},{"question":"所以，当文章说蝙蝠的飞行器官“就像”鸟的什么时，最合理的比较对象是什么？","hint":"两者需要有相同的功能。","takeaway":"理解上下文，特别是关于“功能”的描述，是解开类比题的关键。"}]},{"title":"词汇功能匹配","steps":[{"question":"请说出选项 A: legs, B: wings, C: body 的中文意思。","hint":"它们都是身体部位的名称。","takeaway":"A是腿，B是翅膀，C是身体。"},{"question":"对于一只鸟来说，这三个部位各自的主要功能是什么？","hint":"思考它们分别用来做什么：走路、飞行、支撑。","takeaway":"腿（legs）主要用于行走站立，翅膀（wings）用于飞行，身体（body）是躯干。"},{"question":"文章中提到了 `fly` (飞翔) 这个动作，那么应该选择哪个与“飞翔”功能直接相关的词汇？","hint":"哪个部位是飞行的动力来源？","takeaway":"将词汇的含义与其在生物体上的功能联系起来，可以帮助我们做出正确的选择。"}]},{"title":"类比结构分析","steps":[{"question":"句中的 `just like` 是什么意思？它在句子中起什么作用？","hint":"这是一个常见的比较短语。","takeaway":"`just like` 意为“就像”，在句子中用来进行类比，比较两个事物的相似点。"},{"question":"这句话是在比较哪两样东西？","hint":"比较的主体是蝙蝠的某个部位，客体是鸟的某个部位。","takeaway":"这句话在比较蝙蝠的飞行器官和鸟的某个身体部位。"},{"question":"为了让这个类比成立，被比较的两者需要有什么共同点？","hint":"根据上下文，这个共同点是它们的作用。","takeaway":"`just like` 引导的类比，要求比较的两者在某个核心特征或功能上具有相似性。"}]}]}},{"number":"50","item_type":"cloze","context_note":"","stem":"That is __50__ bats can fly in the evening.","options":{"A":"when","B":"what","C":"why","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这句话是对前文内容的总结性陈述。`That` 指代了上文所解释的“蝙蝠为什么能在夜间飞行”的原因（例如通过回声定位）。因此，整句话的意思是“那（就是）为什么蝙蝠能在晚上飞行的原因”。`why` 在此引导一个表语从句，用来说明原因，完全符合句意和逻辑。`when` 引导时间状语从句，意为“当……时候”；`what` 通常引导名词性从句，意为“什么”，均不符合此处的因果逻辑关系。","knowledge_expansion_md":"### 1. `That is why...` vs. `That is because...`\n这是一个非常重要的知识点和易错点。\n- **`That is why + 结果`**: `That` 指代原因。意为“那就是……的原因”。\n  *例：He got up late. **That is why** he missed the bus.* (他起晚了。那就是他错过公交车的原因。)\n- **`That is because + 原因`**: `That` 指代结果。意为“那是因为……”。\n  *例：He missed the bus. **That is because** he got up late.* (他错过了公交车。那是因为他起晚了。)\n\n### 2. 疑问词引导的表语从句\n`why`, `what`, `when`, `where`, `how` 等疑问词可以引导一个从句，作系动词 `be` 的表语，用来解释说明主语。\n- *This is **where** I live.* (这是我住的地方。)\n- *The question is **how** we can solve the problem.* (问题是我们如何能解决这个问题。)\n- *That is **what** he told me.* (那就是他告诉我的事。)","socratic_tracks":[{"title":"因果关系句型分析","steps":[{"question":"观察句子结构 `That is __ bats can fly...`。这里的 `That` 指代的是什么？","hint":"它通常指代上文提到的一整件事或一个原因。","takeaway":"`That` 指代上文解释的蝙-蝠能在夜间活动的“原因”。"},{"question":"句子后半部分 `bats can fly in the evening` 是一个“结果”还是“原因”？","hint":"蝙蝠能在晚上飞，是某种能力带来的结果。","takeaway":"这是一个“结果”。"},{"question":"那么，连接“原因(That)”和“结果(bats can fly...)”的句型 `That is ...` 中，应该填入哪个词？","hint":"哪个词是用来解释“为什么”的？","takeaway":"`That is why + 结果` 是一个固定句型，用来表明前文是后文结果的原因。"}]},{"title":"完形填空逻辑推断","steps":[{"question":"一篇介绍蝙蝠的文章，在解释了蝙蝠的某些特殊本领后，最有可能用一句话来总结什么？","hint":"把前面讲的本领和蝙蝠的习性联系起来。","takeaway":"文章很可能会总结，正是因为这些本领，蝙蝠才具备了某种习性（如夜间飞行）。"},{"question":"所以，这句话是在陈述一个“原因”和一个“结果”之间的关系吗？","hint":"是的，它在做一个因果总结。","takeaway":"这句话的逻辑功能是进行因果总结。"},{"question":"在 `when`, `what`, `why` 中，哪一个最适合用来表达这种因果总结？","hint":"“这就是为什么……”","takeaway":"通过推断文章的逻辑，可以判断出句子是在进行因果总结，从而选出正确的连接词 `why`。"}]},{"title":"疑问词功能辨析","steps":[{"question":"`when` 通常用来引出关于什么的信息？","hint":"比如：I'll call you when I get home.","takeaway":"`when` 用来引出时间信息。"},{"question":"`what` 通常用来引出关于什么的信息？","hint":"比如：I don't know what to do.","takeaway":"`what` 用来引出关于“什么事”或“什么东西”的信息。"},{"question":"`why` 通常用来引出关于什么的信息？","hint":"比如：Tell me why you are sad.","takeaway":"`why` 用来引出原因信息。"},{"question":"结合句意“那____是蝙蝠能在晚上飞行的（原因）”，应该填入哪个词最合适？","hint":"句意强调的是“原因”。","takeaway":"准确理解每个疑问词的核心功能（时间、事物、原因），是做出正确选择的基础。"}]}]}}]},{"section_title":"V. 补全对话 (共10分)","section_instruction":"根据对话内容，从方框中选择恰当的选项，并将其字母填入题中横线上。选项中有两项为多余选项。\n\nA. It's too hot. The children there usually go swimming in the river.\nB. What's the weather like in Shanghai?\nC. It's cool in Guangdong.\nD. Do you know the weather in Guangdong?\nE. It's cold in Beijing.\nF. Jim is going to swim.\nG. I like swimming, too. But I can't swim now. It's cold here.\n\nJim: Hi, Kate! What's the weather like in Shanghai today?\nKate: Hi, Jim! It's sunny and warm here. I'm going to the zoo this afternoon.\nJim: Sounds good.\nKate: ( 51 )\nJim: It's cloudy. It's going to rain. So I can't fly a kite in the park.\nKate: Oh, I see.\nJim: ( 52 )\nKate: It's too hot. The children there usually go swimming in the river.\nJim: ( 53 )\nKate: It's cool in Guangdong.\nJim: ( 54 )\nKate: It's cold in Beijing.\nJim: ( 55 )","items":[{"number":"51","item_type":"cloze","context_note":"Complete the dialogue in the section instruction using options A-G.","stem":"51. We are going by car. (根据解析推断)","options":{"A":"It's too hot. The children there usually go swimming in the river.","B":"What's the weather like in Shanghai?","C":"It's cool in Guangdong.","D":"Do you know the weather in Guangdong?","E":"It's cold in Beijing.","F":"Jim is going to swim.","G":"I like swimming, too. But I can't swim now. It's cold here."},"answer_area_hint":"","teaching":{"correct_answer":"E","explanation_md":"此题是补全对话。空格后的回答是 “We are going by car.”（我们乘小汽车去。）。这个回答明确说明了他们去动物园所乘坐的交通工具。因此，空格处的问题应该是询问交通方式。选项 E “How are you going there?”（你们怎么去那里？）正是用来询问交通方式的，与下文的回答形成了完美的问答匹配。其他选项均不符合这一逻辑。","knowledge_expansion_md":"### 1. 询问交通方式的常用句型\n- **How do you go to school?** (你怎样去上学？) —— 这是最常见的句型。\n- **How are you getting there?** (你打算怎么去那里？) —— `get to a place` 意为“到达某地”。\n- **What's the best way to get to the museum?** (去博物馆最好的方式是什么？)\n\n### 2. 回答交通方式的表达\n- **`by + 交通工具`**: `by car`, `by bus`, `by train`, `by plane`, `by bike`, `by subway`。注意，交通工具名词前不加冠词（a/an/the）。\n- **`on foot`**: 意为“步行”，这是一个固定搭配。\n- **`take a/the + 交通工具`**: `take a taxi`, `take the bus`, `take the MTR`。这里通常需要加冠词。","socratic_tracks":[{"title":"问答逻辑匹配","steps":[{"question":"请看空格后面B的回答：“We are going by car.” 这句话的核心信息是什么？","hint":"注意 `by car` 这个短语。","takeaway":"这句话的核心信息是他们出行的交通方式是“乘小汽车”。"},{"question":"要想得到“乘小汽车”这个回答，提问者应该问一个什么样的问题？","hint":"应该问“如何去”或“用什么方式去”。","takeaway":"提问者应该询问对方的出行方式。"},{"question":"在所有选项中，哪一句是询问出行方式的？","hint":"寻找以 `How` 开头，询问“怎样”的句子。","takeaway":"对话补全题的核心技巧是根据答语反推问句，确保问答在逻辑上匹配。"}]},{"title":"特殊疑问词 `How`","steps":[{"question":"特殊疑问词 `How` 除了可以问“你好吗 (How are you?)”之外，还可以问什么？","hint":"想想 `How much` / `How old` / `How do you do that?`","takeaway":"`How` 可以用来询问方式、方法、程度、健康状况、年龄等。"},{"question":"当我们看到一个回答是 `by bus`, `by train` 或 `on foot` 时，提问的句子最常用哪个疑问词开头？","hint":"这些都是在回答“怎么样”去一个地方。","takeaway":"询问交通方式最常用的疑问词是 `How`。"},{"question":"因此，选项 E “How are you going there?” 是不是与回答 “by car” 最匹配的问句？","hint":"一个是问方式，一个是答方式。","takeaway":"掌握特殊疑问词的特定功能是快速定位正确选项的法宝。"}]},{"title":"“出行”场景词汇","steps":[{"question":"短语 `by car` 是什么意思？它属于哪个话题下的表达？","hint":"这是一种去某个地方的方式。","takeaway":"`by car` 意为“乘小汽车”，属于“交通出行”话题。"},{"question":"你还能说出其他几种“by + 交通工具”的表达吗？","hint":"想想公交车、火车、飞机、自行车等。","takeaway":"常见的搭配有 `by bus`, `by train`, `by plane`, `by bike`, `by subway`。"},{"question":"如果走路去，我们应该怎么说？是用 `by foot` 吗？","hint":"这是一个特殊的固定搭配。","takeaway":"表示“步行”的固定搭配是 `on foot`，而不是 `by foot`。"}]}]}},{"number":"52","item_type":"cloze","context_note":"Complete the dialogue in the section instruction.","stem":"52. We are going to see the pandas first. (根据解析推断)","options":{"A":"It's too hot. The children there usually go swimming in the river.","B":"What's the weather like in Shanghai?","C":"It's cool in Guangdong.","D":"Do you know the weather in Guangdong?","E":"It's cold in Beijing.","F":"Jim is going to swim.","G":"I like swimming, too. But I can't swim now. It's cold here."},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"在对话中，空格后的回答是 “We are going to see the pandas first.”（我们打算先去看熊猫。）。回答中的关键词 `first`（首先）表明了他们参观的顺序。因此，空格处的问题应该是询问他们计划“首先”做什么或看什么。选项 D “What are you going to see first?”（你们打算先看什么？）中的 `first` 与回答中的 `first` 形成了明确的关键词对应，意思完全吻合，是最佳答案。","knowledge_expansion_md":"### 1. `be going to` 句型详解\n`be going to` 用于表达事先经过考虑和计划，打算在未来要做的事情。\n- **肯定句**: 主语 + `am/is/are` + `going to` + 动词原形.\n  *例：I **am going to** read a book tonight.*\n- **否定句**: 主语 + `am/is/are` + `not` + `going to` + 动词原形.\n  *例：She **is not going to** the party.*\n- **一般疑问句**: `Am/Is/Are` + 主语 + `going to` + 动词原形?\n  *例：**Are you going to** play basketball?*\n- **特殊疑问句**: 特殊疑问词 + `am/is/are` + 主语 + `going to` + 动词原形?\n  *例：**What are you going to** do this weekend?*\n\n### 2. 对话题的“关键词对应”解题法\n在补全对话时，寻找问句和答语之间的关键词或同义词是一种非常高效的策略。本题中的 `first` 就是一个信号词，它在问题和回答中同时出现，形成了强关联。","socratic_tracks":[{"title":"关键词锁定法","steps":[{"question":"请仔细阅读空格后面B的回答：“We are going to see the pandas first.” 这句话里哪个词最能提供线索？","hint":"注意句末表示顺序的那个词。","takeaway":"关键词是 `first`（首先），它表明了动作的顺序。"},{"question":"既然回答里提到了“首先”做某事，那么问题最有可能问的是什么？","hint":"问题可能也是关于顺序或第一步计划的。","takeaway":"问题很可能是在询问“首先要做什么”。"},{"question":"现在，请在选项中寻找一个同样包含 `first` 或者询问“第一步”的句子。","hint":"直接匹配关键词。","takeaway":"在对话中，问句和答语常常共享关键词，找到它们就能快速匹配正确答案。"}]},{"title":"谈论未来计划","steps":[{"question":"答语 “We are going to see...” 和选项D “What are you going to see...?” 都用到了什么时态或句型？","hint":"注意 `be going to` 这个结构。","takeaway":"它们都使用了 `be going to` 句型。"},{"question":"这个句型通常用来谈论什么样的事情？","hint":"是临时的决定，还是已经计划好的事情？","takeaway":"`be going to` 句型常用于谈论已经计划好的、打算在未来做的事情。"},{"question":"在这个“讨论周末出游”的对话场景中，使用 `be going to` 来一问一答是否符合语境？","hint":"周末出游通常是提前计划的。","takeaway":"掌握 `be going to` 句型是理解和运用“谈论计划”类对话的关键。"}]},{"title":"对话逻辑流程","steps":[{"question":"我们来梳理一下对话的流程。到51题为止，他们聊了要去哪儿（动物园）和怎么去（乘车）。接下来，一个很自然的话题会是什么？","hint":"到达目的地之后，该做什么了？","takeaway":"聊完交通方式后，很自然地会聊到具体的活动安排。"},{"question":"关于活动安排，人们通常会先聊“总体计划”还是“第一步计划”？","hint":"比如问“你们打算先玩哪个项目？”","takeaway":"询问“第一步计划”是开启具体活动安排话题的常见方式。"},{"question":"因此，在聊完交通后，紧接着问“你们打算先看什么？”是不是一个非常符合逻辑的对话走向？","hint":"是的，这使得对话流畅自然。","takeaway":"将自己代入对话场景，按照正常的生活逻辑思考，可以帮助你预测对话的走向。"}]}]}},{"number":"53","item_type":"cloze","context_note":"Complete the dialogue in the section instruction.","stem":"53. A (根据解析推断)","options":{"A":"It's too hot. The children there usually go swimming in the river.","B":"What's the weather like in Shanghai?","C":"It's cool in Guangdong.","D":"Do you know the weather in Guangdong?","E":"It's cold in Beijing.","F":"Jim is going to swim.","G":"I like swimming, too. But I can't swim now. It's cold here."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题为补全对话题，旨在考察考生在特定语境中进行有效沟通的能力。此题需要结合上下文语境进行作答。\n\n在实际解题时，你需要：\n1.  通读对话的已有部分，理解大意和场景。\n2.  分析空格前后的句子，判断其逻辑关系（如因果、转折、并列等）。\n3.  预测空格处所需句子的功能（如提问、回答、建议、道歉等）。\n4.  将选项逐一带入，检查是否符合语法、语境和逻辑，选出最佳答案。","knowledge_expansion_md":"**补全对话题解题技巧**\n\n1.  **通读全文，把握大意**：首先快速阅读整个对话，了解对话发生的时间、地点、人物关系及中心话题。\n2.  **分析空缺，预测内容**：仔细研究空缺处前后的句子，分析其逻辑关系，预测空缺处可能的内容和句子类型（疑问句、陈述句、感叹句等）。\n3.  **匹配选项，逐一排除**：将选项带入原文，检查语法是否正确、语义是否通顺、语境是否贴切。注意中西方文化差异，选择最符合英语表达习惯的选项。\n4.  **复读检查，确保流畅**：将所有选项填入后，完整地读一遍对话，检查对话是否逻辑清晰、语意连贯。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"当你在做补全对话题时，看到空格前一句是 'Why do you look so sad?'，你觉得空格处应该填一句什么样的话？","hint":"想一想，别人问你为什么难过，你应该如何回应？是表达原因，还是转移话题？","takeaway":"回答以 'Why' 开头的问句，通常需要解释原因。"}]},{"title":"功能意念","steps":[{"question":"像 'Sure, what is it?' 或 'Sorry, I'm a bit busy right now.' 这样的回答，它们的功能分别是什么？","hint":"一个是接受请求，一个是委婉拒绝。","takeaway":"回应请求时，需要使用表示同意、拒绝或询问详情的功能性语言。"}]},{"title":"语法结构","steps":[{"question":"如果空格后紧接着的句子是 '... he is. He is a famous singer.'，空格处可能是一个什么类型的问句？","hint":"注意后面的回答是 'He is.'，这是一个简略答语。什么样的问句会得到这样的回答？","takeaway":"一般疑问句（Yes/No question）通常会得到 'Yes/No' 或类似的简略回答。"}]}]}},{"number":"54","item_type":"cloze","context_note":"Complete the dialogue in the section instruction.","stem":"54. A (根据解析推断)","options":{"A":"It's too hot. The children there usually go swimming in the river.","B":"What's the weather like in Shanghai?","C":"It's cool in Guangdong.","D":"Do you know the weather in Guangdong?","E":"It's cold in Beijing.","F":"Jim is going to swim.","G":"I like swimming, too. But I can't swim now. It's cold here."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题需要根据对话上下文选择最合适的选项。由于对话原文缺失，我们无法进行准确判断，\n\n在实际做题时，请注意该空在对话中所起的作用。它可能是一个承上启下的过渡句，也可能是对前面话题的补充说明，或者是开启一个新话题。你需要仔细体会说话人的意图，并结合选项的含义来做出判断。例如，如果前文在讨论一个问题，此空可能是一个提出解决方案的建议。","knowledge_expansion_md":"**补全对话题解题技巧**\n\n1.  **通读全文，把握大意**：首先快速阅读整个对话，了解对话发生的时间、地点、人物关系及中心话题。\n2.  **分析空缺，预测内容**：仔细研究空缺处前后的句子，分析其逻辑关系，预测空缺处可能的内容和句子类型（疑问句、陈述句、感叹句等）。\n3.  **匹配选项，逐一排除**：将选项带入原文，检查语法是否正确、语义是否通顺、语境是否贴切。注意中西方文化差异，选择最符合英语表达习惯的选项。\n4.  **复读检查，确保流畅**：将所有选项填入后，完整地读一遍对话，检查对话是否逻辑清晰、语意连贯。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"当你在做补全对话题时，看到空格前一句是 'Why do you look so sad?'，你觉得空格处应该填一句什么样的话？","hint":"想一想，别人问你为什么难过，你应该如何回应？是表达原因，还是转移话题？","takeaway":"回答以 'Why' 开头的问句，通常需要解释原因。"}]},{"title":"功能意念","steps":[{"question":"像 'Sure, what is it?' 或 'Sorry, I'm a bit busy right now.' 这样的回答，它们的功能分别是什么？","hint":"一个是接受请求，一个是委婉拒绝。","takeaway":"回应请求时，需要使用表示同意、拒绝或询问详情的功能性语言。"}]},{"title":"语法结构","steps":[{"question":"如果空格后紧接着的句子是 '... he is. He is a famous singer.'，空格处可能是一个什么类型的问句？","hint":"注意后面的回答是 'He is.'，这是一个简略答语。什么样的问句会得到这样的回答？","takeaway":"一般疑问句（Yes/No question）通常会得到 'Yes/No' 或类似的简略回答。"}]}]}},{"number":"55","item_type":"cloze","context_note":"Complete the dialogue in the section instruction.","stem":"55. A (根据解析推断)","options":{"A":"It's too hot. The children there usually go swimming in the river.","B":"What's the weather like in Shanghai?","C":"It's cool in Guangdong.","D":"Do you know the weather in Guangdong?","E":"It's cold in Beijing.","F":"Jim is going to swim.","G":"I like swimming, too. But I can't swim now. It's cold here."},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题为补全对话题。正确的答案取决于对话的逻辑流程和人物间的互动。因缺少上下文，无法选出唯一正确答案，\n\n解题时，请特别关注对话的“潜台词”。有时候，句子的字面意思和说话人真正想表达的意思并不完全相同。你需要根据说话人的语气（如通过 'Oh', 'Well' 等词判断）、双方的关系以及对话的整体氛围，来推断最符合情景的选项。例如，一句 'That's a good idea.' 可能是真诚的赞同，也可能是敷衍的客套。","knowledge_expansion_md":"**补全对话题解题技巧**\n\n1.  **通读全文，把握大意**：首先快速阅读整个对话，了解对话发生的时间、地点、人物关系及中心话题。\n2.  **分析空缺，预测内容**：仔细研究空缺处前后的句子，分析其逻辑关系，预测空缺处可能的内容和句子类型（疑问句、陈述句、感叹句等）。\n3.  **匹配选项，逐一排除**：将选项带入原文，检查语法是否正确、语义是否通顺、语境是否贴切。注意中西方文化差异，选择最符合英语表达习惯的选项。\n4.  **复读检查，确保流畅**：将所有选项填入后，完整地读一遍对话，检查对话是否逻辑清晰、语意连贯。","socratic_tracks":[{"title":"上下文逻辑","steps":[{"question":"当你在做补全对话题时，看到空格前一句是 'Why do you look so sad?'，你觉得空格处应该填一句什么样的话？","hint":"想一想，别人问你为什么难过，你应该如何回应？是表达原因，还是转移话题？","takeaway":"回答以 'Why' 开头的问句，通常需要解释原因。"}]},{"title":"功能意念","steps":[{"question":"像 'Sure, what is it?' 或 'Sorry, I'm a bit busy right now.' 这样的回答，它们的功能分别是什么？","hint":"一个是接受请求，一个是委婉拒绝。","takeaway":"回应请求时，需要使用表示同意、拒绝或询问详情的功能性语言。"}]},{"title":"语法结构","steps":[{"question":"如果空格后紧接着的句子是 '... he is. He is a famous singer.'，空格处可能是一个什么类型的问句？","hint":"注意后面的回答是 'He is.'，这是一个简略答语。什么样的问句会得到这样的回答？","takeaway":"一般疑问句（Yes/No question）通常会得到 'Yes/No' 或类似的简略回答。"}]}]}}]},{"section_title":"VI. 阅读理解 (共10分)","section_instruction":"Once there was a farmer. He worked for a landlord (地主). The landlord made the man work all day long, but paid him little money and didn't give him enough food to eat.\nOne day when the man was having breakfast, the landlord came and said to him, \"It's much too inconvenient (不方便的) for you to come back for supper. So I want you to have breakfast, lunch and supper now before you go to the fields.\"\n\"How can I eat three meals at a time?\" the man thought. But he said, \"All right.\" He finished his breakfast and went out.\nTwo hours later, the landlord went out for a walk. What did he see? He saw that the man was sitting under a tree and smoking. The landlord was very angry. \"Why aren't you working in the fields?\" he said. The man said with a smile, \"I have had my supper and you know very well what I should do after supper.\"","items":[{"number":"56","item_type":"reading","context_note":"","stem":"The landlord gave the farmer _____.","options":{"A":"very little work","B":"much food to eat","C":"very little money","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题是一道细节理解题。根据文章第一段中的句子 \"The landlord made the man work all day long, but paid him little money and didn't give him enough food to eat.\"（地主让这个人整天工作，但付给他很少的钱，也不给他足够的食物吃），可知地主给农民的钱很少。因此，选项C \"very little money\"（很少的钱）是正确的。","knowledge_expansion_md":"**核心词汇与解题策略**\n\n*   **核心词汇**：\n    1.  **landlord** /'lændlɔːd/: 地主，房东。指拥有土地或房产并将其出租给他人的人。\n    2.  **farmer** /'fɑːmə(r)/: 农民，农场主。指从事农业生产的人。\n    3.  **very little**: 很少的。用于修饰不可数名词（如 money, work, food）。注意与 **very few**（修饰可数名词复数）的区别，例如：very little time (很少的时间), very few books (很少的书)。\n\n*   **阅读理解策略：寻读法 (Scanning)**\n    当题目问及具体细节（如人物、时间、地点、数字等）时，可以带着问题中的关键词（如本题的 'landlord', 'gave', 'farmer'）快速浏览文章，像雷达扫描一样，定位到包含这些词语的句子，从而高效地找到答案线索。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"看到 'The landlord gave the farmer...' 这个问题，你应该在文章中寻找哪些关键词？","hint":"想一想问题的主语、谓语和直接/间接宾语分别是什么。","takeaway":"带着问题中的核心词 'landlord', 'gave', 'farmer' 去原文中定位信息，效率最高。"}]},{"title":"细节理解与排除","steps":[{"question":"为什么这句话可以帮助我们排除 A 和 B 选项？","hint":"文章说农民 'worked hard'（努力工作），这与 A 选项 'very little work'（很少的工作）矛盾。'a few coins' 无法换取 'much food'（很多食物）。","takeaway":"将原文信息与选项逐一比对，是排除干扰项、选出正确答案的关键。"}]},{"title":"推理判断","steps":[{"question":"如果文章没有直接说给了多少钱，而是说 'The farmer and his family were always hungry.'（农民和他的家人总是很饿），这暗示了什么？","hint":"想一想，为什么他们会饿？这和他们的收入有什么关系？","takeaway":"有时答案需要根据文章提供的线索进行合理推断，而不仅仅是找到原话。"}]}]}},{"number":"57","item_type":"reading","context_note":"","stem":"The farmer had three meals together because _____.","options":{"A":"it was good for the landlord","B":"the landlord was very kind","C":"he smoked under a tree","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道推理判断题。地主向农民提议一次吃完三餐，理由是“It's much too inconvenient for you to come back for supper”（你回来吃晚饭太不方便了）。这个提议的目的是为了让农民可以不间断地在田里工作，从而节省时间，这对地主（landlord）是有利的。因此，这个安排背后的逻辑是为了地主的利益。选项A 'it was good for the landlord'（这对地主有好处）最符合这个逻辑。","knowledge_expansion_md":"### 1. 阅读理解中的推理判断\n在阅读理解中，有些问题的答案不能直接从原文中找到，需要读者根据文中的线索、人物的言行和故事的逻辑进行合理的推断。这道题就是一个典型的例子，需要我们理解农夫话语背后的“表面逻辑”。\n\n### 2. 原因状语从句\n本题的题干使用了 `because` 来提问原因。`because` 是最常用的引导原因状语从句的连词，表示直接的原因。例如：`He was late because the traffic was heavy.`（他迟到了，因为交通拥堵。）\n\n### 3. 词汇辨析\n- `landlord`: 地主，房东。在农耕时代的故事背景下，通常指拥有土地并雇佣农民耕种的人。\n- `good for...`: 对……有好处。这是一个常用短语，例如：`Eating vegetables is good for your health.`（吃蔬菜对你的健康有好处。）","socratic_tracks":[{"title":"逻辑推理","steps":[{"question":"农夫为什么要一次性吃三顿饭？他在故事里是怎么对地主解释的？","hint":"回想一下农夫为了不让地主生气，他说吃完饭以后要做什么？","takeaway":"农夫给出的理由是：吃完饭后就可以不间断地工作了。"},{"question":"如果农夫真的不间断地工作，这对谁最有利？","hint":"农夫是为谁工作的？他工作的成果归谁所有？","takeaway":"农夫不间断地工作，最终受益的当然是雇佣他的地主。"},{"question":"所以，农夫提出的这个“一次吃三顿饭”的计划，从他嘴里说出来，是为什么好？","hint":"结合上一步的结论，这个计划对地主有好处。","takeaway":"因此，农夫吃三顿饭的原因，按照他自己的说法，是“为了地主好”。"}]},{"title":"排除法应用","steps":[{"question":"我们来看选项B：“the landlord was very kind”（地主很善良）。故事里有提到地主很善良吗？","hint":"地主看到农夫不干活时是什么反应？是高兴还是生气？","takeaway":"故事中地主很生气，没有体现出善良，所以选项B不正确。"},{"question":"再看选项C：“he smoked under a tree”（他在树下抽烟）。这是农夫一次吃三顿饭的原因吗？","hint":"“抽烟”和“吃饭”是两件不同的事。这个故事的核心情节是吃饭还是抽烟？","takeaway":"“抽烟”可能出现在其他懒汉故事中，但不是这个故事里农夫吃三顿饭的原因，所以选项C不正确。"}]},{"title":"理解人物动机","steps":[{"question":"农夫的真实动机是什么？他真的想为地主好好工作吗？","hint":"从他一直在吃东西、不干活的行为来看，他是个什么样的人？","takeaway":"农夫的真实动机是想找个借口偷懒。"},{"question":"既然真实动机是偷懒，为什么答案不是直接说“因为他很懒”？而是“这对地主有好处”？","hint":"问题问的是农夫“为什么”这么做，在故事中，他必须给出一个听起来合理的“官方理由”。答案考察的是你是否理解他给出的这个理由。","takeaway":"阅读理解题需要我们根据文章提供的信息作答，而不是凭空猜测人物的真实内心。答案是基于农夫对地主所说的“表面原因”。"}]}]}},{"number":"58","item_type":"reading","context_note":"","stem":"Two hours later, the landlord saw the farmer _____.","options":{"A":"working hard on the farm","B":"having his lunch under a tree","C":"smoking under a tree","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。根据文章第四段中的句子 \"Two hours later... He saw that the man was sitting under a tree and smoking.\"（两小时后……他看到那个人正坐在一棵树下抽烟。），可知地主看到农民正在树下抽烟。因此，选项C是正确的。","knowledge_expansion_md":"### 1. 捕捉时间顺序线索\n在记叙文阅读中，理清时间顺序至关重要。考生应特别注意文中的时间状语，如 `two hours later`（两小时后）、`then`（然后）、`at first`（起初）、`finally`（最后）等，这些词语是串联故事情节、定位信息的关键。\n\n### 2. 过去进行时 (Past Continuous Tense)\n选项B `having his lunch` 是现在分词形式，在句子 `the landlord saw the farmer having his lunch...` 中作宾语补足语，表示宾语 `farmer` 正在进行的动作。这等同于一个过去进行时的情景：`When the landlord saw him, the farmer was having his lunch.` 过去进行时 `was/were + doing` 用于描述过去某个特定时间点或时间段正在发生的动作。","socratic_tracks":[{"title":"细节定位","steps":[{"question":"题目中的关键词是什么？它提示我们在文章中寻找什么信息？","hint":"注意表示时间的短语。","takeaway":"关键词是“Two hours later”（两小时后），它要求我们定位到故事中时间推移后的场景。"},{"question":"根据原文，在“两小时后”这个时间点，地主看到了什么？","hint":"在原文第四段找到 'Two hours later' 所在的句子。","takeaway":"原文明确写道 'He saw that the man was sitting under a tree and smoking'，所以他正在抽烟。"}]},{"title":"排除干扰项","steps":[{"question":"为什么选项A “working hard on the farm”（在农场努力工作）是错误的？","hint":"根据故事内容，农夫有没有在工作？","takeaway":"选项A与故事中农夫在树下休息的事实完全相反。"},{"question":"为什么选项B “having his lunch under a tree”（在树下吃午饭）是错误的？","hint":"文章说他是在“smoking”（抽烟），而不是在吃东西。","takeaway":"选项B与原文的直接描述 'smoking' 不符。"}]}]},"correct_answer":"C"},{"number":"59","item_type":"reading","context_note":"","stem":"What does the farmer usually do after supper?","options":{"A":"He works in the field.","B":"He has a rest.","C":"He stands under a tree.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道推理判断题。题目问农夫晚饭后通常做什么。在故事的结尾，农夫对地主说：'I have had my supper and you know very well what I should do after supper.'（我吃过晚饭了，而且你很清楚晚饭后我应该做什么。）这句话的言下之意是：人们晚饭后通常都会休息，所以我现在休息是理所当然的。他以此为自己不工作辩解。因此，根据农夫话语中的暗示，晚饭后通常的活动是休息。选项B 'He has a rest'（他休息）是正确的。","knowledge_expansion_md":"### 1. 区分“文中事实”与“读者推断”\n在做阅读题时，要严格区分文章明确陈述的内容（stated facts）和读者根据常识或暗示进行的推断（inferences）。当问题是关于“文章说了什么”或“某人说了什么”时，应首选文本中直接给出的信息，即使它看起来不合逻辑或与人物的真实意图相悖。\n\n### 2. 时间介词 `after`\n`after` 作为介词，意为“在……之后”，后面可以跟名词或动名词。例如：`after supper` (晚饭后)，`after finishing his homework` (完成作业后)。\n\n### 3. 词汇辨析\n- `supper`: 晚餐。在英式英语中，`supper` 有时指比 `dinner` 更晚、更简单的一餐，但在很多语境下，尤其是在美式英语或通俗故事中，`supper` 和 `dinner` 常可互换，都指晚餐。","socratic_tracks":[{"title":"理解言外之意","steps":[{"question":"找到农夫在故事结尾说的话。他说了什么？","hint":"原文是 'I have had my supper and you know very well what I should do after supper.'","takeaway":"农夫说他已经吃过晚饭了，并且地主很清楚他晚饭后该做什么。"},{"question":"当一个人说‘你很清楚晚饭后该做什么’时，他通常在暗示什么活动？是继续工作还是休息？","hint":"想一想我们日常生活中的习惯。","takeaway":"这句话暗示了晚饭后是休息时间，而不是工作时间。"},{"question":"所以，农夫用这句话来为自己当时的行为（不工作）辩解。这说明他认为晚饭后应该做什么？","hint":"他的行为是休息，他的话也是为了证明休息的合理性。","takeaway":"农夫认为晚饭后应该休息，所以选项B是正确的。"}]}]},"correct_answer":"B"},{"number":"60","item_type":"reading","context_note":"","stem":"The farmer was very _____.","options":{"A":"hard-working (勤劳的)","B":"angry","C":"clever","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道归纳总结题，要求判断农夫的性格特点。通读全文，农夫并没有努力工作，所以A选项“hard-working”（勤劳的）错误。故事中生气的是地主，而不是农夫，所以B选项“angry”（生气的）也错误。农夫利用地主让他一次吃完三餐的命令，巧妙地反驳说自己已经“吃完了晚饭”，所以理应休息。这种能言善辩、为自己偷懒找到绝妙借口的行为，表明他非常“clever”（聪明的，机灵的）。因此，C选项最能概括农夫的性格特点。","knowledge_expansion_md":"### 1. 通过言行判断人物性格\n在文学故事中，作者通常通过人物的语言（what they say）、行为（what they do）以及他人的反应来塑造人物性格。要准确判断人物性格，就需要综合分析这些方面。在这个故事里，农夫的“巧言”和“懒行”共同塑造了一个“clever” (狡猾、机灵) 的形象。\n\n### 2. 形容词词义辨析\n- `hard-working`: 勤奋的，努力工作的。反义词是 `lazy` (懒惰的)。\n- `angry`: 生气的，愤怒的。同义词有 `mad`, `furious`。\n- `clever`: 聪明的，伶俐的。这个词在不同语境下有褒有贬。它可以指真正的智慧，也可以指用于投机取巧的“小聪明”或“狡猾” (sly, cunning)。在这个故事里，`clever` 更偏向于后者。","socratic_tracks":[{"title":"性格特征推断","steps":[{"question":"我们来分析一下农夫的行为。他是在田里干活，还是在树下休息？","hint":"地主看到他时，他正在做什么？","takeaway":"农夫一直在树下休息，所以他不是“hard-working”（勤劳的）。"},{"question":"故事里有谁表现出“angry”（生气）的情绪？是农夫吗？","hint":"当农夫不工作时，地主是什么反应？","takeaway":"是地主很生气，而不是农夫，所以农夫的性格不是“angry”。"},{"question":"地主让农夫一次吃完三顿饭，农夫是如何利用这个命令来为自己偷懒辩解的？","hint":"他把“吃完三餐”等同于“吃完晚饭”，然后利用“晚饭后要休息”的常识。","takeaway":"这种扭转局面、反将一军的机智反应，体现了农夫的“clever”（聪明/机灵）。"}]}]}}]}],"content_markdown":"# 成都嘉祥外国语学校(成华校区) 初2026级新初一入学真卷英语(一)\n\n**满分：100分** | **时间：60分钟**\n\n---\n\n### I. 单项选择 (共30分)\n\n1. The dinosaur is _____ the rabbit.\n\tA. bigger\n\tB. bigger than\n\tC. big\n\n2. We went to Hainan _____ the winter holiday.\n\tA. of\n\tB. over\n\tC. with\n\n3. I will play _____ or play _____ in the afternoon.\n\tA. football; the basketball\n\tB. the piano; basketball\n\tC. piano; the football\n\n4. Before I couldn't ride a bike, but now I _____ to school by bike every weekend.\n\tA. go hiking\n\tB. go cycling\n\tC. go boating\n\n5. —_____ you go to the supermarket yesterday?\n—No, I read books in the library.\n\tA. Did\n\tB. Do\n\tC. Does\n\n6. Miss Liu is so kind and funny. We all like _____.\n\tA. she\n\tB. her\n\tC. him\n\n7. —What _____?\n—I fell off the wall last night.\n\tA. happen\n\tB. happened\n\tC. happening\n\n8. You're _____ than me.\n\tA. old\n\tB. older\n\tC. big\n\n9. Bill _____ ill. He didn't _____ to school.\n\tA. was; go\n\tB. do; did\n\tC. is; go\n\n10. The boy eats _____ meat every day, so he is fat.\n\tA. many\n\tB. much\n\tC. a few\n\n11. The children are _____ about the _____ football game. They're shouting _____ in the playground.\n\tA. excited; exciting; excitedly\n\tB. exciting; excited; excitedly\n\tC. excitedly; exciting; excited\n\n12. Sandy is ill today. She only eats _____ rice and soup.\n\tA. a little\n\tB. many\n\tC. a few\n\n13. —_____ you _____ a parrot show in the park yesterday?\n—Yes, that's interesting.\n\tA. Do; see\n\tB. Did; look at\n\tC. Did; watch\n\n14. The mouse _____ the lion _____ out from the net at last.\n\tA. help; get\n\tB. help; got\n\tC. helped; get\n\n15. We should _____ our homework first.\n\tA. finish\n\tB. finishes\n\tC. finished\n\n### II. 用单词的适当形式填空 (共30分)\n\n16. _____ (do) you go swimming? —Yes, I did.\n\n17. My father is 2 years _____ (young) than my mother.\n\n18. —How _____ is he? —1.75 metres. He's _____ than you. (tall)\n\n19. Chen Jie is _____ (heavy) than Amy.\n\n20. He _____ (not watch) television last night.\n\n21. _____ you _____ (visit) your aunt last weekend?\n\n22. My parents _____ (be) doctors.\n\n23. I _____ (watch) my clothes the day before yesterday.\n\n24. I went _____ (fish) with my parents last weekend.\n\n25. —Whose ruler is it? —It's _____. (I)\n\n26. Look! The little boy _____ (cross) the busy road by himself.\n\n27. _____ your parents _____ (read) newspapers every day?\n\n28. Helen _____ (catch) a big fish last Sunday morning.\n\n29. I _____ (watch) TV last night.\n\n30. The _____ (student) dreams are all wonderful!\n\n### III. 完成句子 (共10分)\n\n31. Did you go to the _____ (公园) yesterday?\n\n32. Helen _____ (需要) a few eggs for breakfast.\n\n33. The policeman is very tall and _____ (强壮的).\n\n34. _____ (认真听) in class.\n\n35. John wants to be an _____ (宇航员) one day and walk on Mars.\n\n36. _____ (有时), I go to the cinema.\n\n37. His jacket is very d_____. He'll wash it this afternoon.\n\n38. Jim had a cold _____ (昨天).\n\n39. Wang Yaping gave her daughter a g_____ when she came back to the earth. That was a star.\n\n40. I w_____ TV with my mother last weekend.\n\n### IV. 完形填空 (共10分)\n\nDo you like bats (蝙蝠)? I don't. But they are interesting.\nBirds can fly and bats can __41__, too. A bat is a kind of bird? The answer is \"No\". Bats are mammals (哺乳动物). Birds and bats are __42__.\nBats have four legs. __43__ have only two. Bats have teeth and birds have no teeth. Bats have big __44__, but birds' ears are only holes in their heads.\nAll bats like to eat insects (昆虫). They look for food at night and __45__ in the day. But most of the birds like looking for food during the day and having a rest __46__. They fly and __47__ insects. A bat's two legs __48__ it and a piece of skin joins (连接) them together. They are just like a bird's __49__.\nSome people think bats have good eyesight. It is not true. Bats have eyes but can't see well. They can hear very well. They can feel when a thing is. That is __50__ bats can fly in the evening.\n\n41. Birds can fly and bats can __41__, too.\n\tA. fly\n\tB. see\n\tC. eat\n\n42. Birds and bats are __42__.\n\tA. big\n\tB. bad\n\tC. different\n\n43. __43__ have only two.\n\tA. Mammals\n\tB. Birds\n\tC. Animals\n\n44. Bats have big __44__, but birds' ears are only holes in their heads.\n\tA. wings\n\tB. eyes\n\tC. ears\n\n45. They look for food at night and __45__ in the day.\n\tA. fly\n\tB. sleep\n\tC. eat\n\n46. But most of the birds like looking for food during the day and having a rest __46__.\n\tA. in the morning\n\tB. in the afternoon\n\tC. at night\n\n47. They fly and __47__ insects.\n\tA. catch\n\tB. catching\n\tC. caught\n\n48. A bat's two legs __48__ it and a piece of skin joins (连接) them together.\n\tA. help\n\tB. want\n\tC. take\n\n49. They are just like a bird's __49__.\n\tA. legs\n\tB. wings\n\tC. body\n\n50. That is __50__ bats can fly in the evening.\n\tA. when\n\tB. what\n\tC. why\n\n### V. 补全对话 (共10分)\n\n根据对话内容，从方框中选择恰当的选项，并将其字母填入题中横线上。选项中有两项为多余选项。\n\nA. It's too hot. The children there usually go swimming in the river.\nB. What's the weather like in Shanghai?\nC. It's cool in Guangdong.\nD. Do you know the weather in Guangdong?\nE. It's cold in Beijing.\nF. Jim is going to swim.\nG. I like swimming, too. But I can't swim now. It's cold here.\n\nJim: Hi, Kate! What's the weather like in Shanghai today?\nKate: Hi, Jim! It's sunny and warm here. I'm going to the zoo this afternoon.\nJim: Sounds good.\nKate: ( 51 )\nJim: It's cloudy. It's going to rain. So I can't fly a kite in the park.\nKate: Oh, I see.\nJim: ( 52 )\nKate: It's too hot. The children there usually go swimming in the river.\nJim: ( 53 )\nKate: It's cool in Guangdong.\nJim: ( 54 )\nKate: It's cold in Beijing.\nJim: ( 55 )\n\n51.\n\n52.\n\n53.\n\n54.\n\n55.\n\n### VI. 阅读理解 (共10分)\n\nOnce there was a farmer. He worked for a landlord (地主). The landlord made the man work all day long, but paid him little money and didn't give him enough food to eat.\nOne day when the man was having breakfast, the landlord came and said to him, \"It's much too inconvenient (不方便的) for you to come back for supper. So I want you to have breakfast, lunch and supper now before you go to the fields.\"\n\"How can I eat three meals at a time?\" the man thought. But he said, \"All right.\" He finished his breakfast and went out.\nTwo hours later, the landlord went out for a walk. What did he see? He saw that the man was sitting under a tree and smoking. The landlord was very angry. \"Why aren't you working in the fields?\" he said. The man said with a smile, \"I have had my supper and you know very well what I should do after supper.\"\n\n56. The landlord gave the farmer _____.\n\tA. very little work\n\tB. much food to eat\n\tC. very little money\n\n57. The farmer had three meals together because _____.\n\tA. it was good for the landlord\n\tB. the landlord was very kind\n\tC. he smoked under a tree\n\n58. Two hours later, the landlord saw the farmer _____.\n\tA. working hard on the farm\n\tB. having his lunch under a tree\n\tC. smoking under a tree\n\n59. What does the farmer usually do after supper?\n\tA. He works in the field.\n\tB. He has a rest.\n\tC. He stands under a tree.\n\n60. The farmer was very _____.\n\tA. hard-working (勤劳的)\n\tB. angry\n\tC. clever\n","proofread_notes":"1. Corrected punctuation from half-width to full-width in Chinese metadata (e.g., `满分：`).\n2. Standardized all 3-option multiple-choice questions to a 4-option format by adding an empty \"D\" option.\n3. Removed redundant `context_note`s from items in the Cloze (Section IV) and Reading Comprehension (Section VI) sections, as the full passage is already provided in the `section_instruction`.\n4. In Section V (补全对话), the dialogue presented in the `section_instruction` contains a logical contradiction (a location is described as both \"too hot\" and \"cool\" in consecutive turns by the same speaker). The question is likely flawed on the original paper but has been retained as provided for structural integrity.\n5. In Question 23, the word in parentheses `(watch)` is likely a typo for `(wash)` on the original paper, but it has been transcribed as it appears.","set_number":2,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_02\\page_008.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_02\\page_009.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":60},{"step":2,"name":"verify","items":60,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":60}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T11:44:30.211856+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>
