want to ask you for a signature(签名)!\"","items":[{"number":"26","item_type":"cloze","context_note":"","stem":"26.","options":{"A":"be","B":"is","C":"are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 “There be” 句型中的主谓一致。该句型的特点是，谓语动词（be动词）的形式由其后面的名词的单复数形式决定，这被称为“就近原则”。根据完形填空的上下文逻辑，此处很可能是在引出“有很多……”的事物，因此空格后的名词是复数形式。当 be 动词后面的名词是复数时，be 动词要用 are。选项 A “be” 是动词原形，不能直接作谓语；选项 B “is” 用于单数名词。因此，C选项 “are” 是正确答案。","knowledge_expansion_md":"“There be” 句型是英语中表示“存在”的核心句型之一，意为“某地/某时有某人/某物”。\n\n1.  **核心语法：就近原则**\n    *   be动词的形式由离它最近的名词的单复数决定。\n    *   `There is a book on the desk.` (名词 `a book` 是单数，用 `is`)\n    *   `There are some books on the desk.` (名词 `some books` 是复数，用 `are`)\n    *   对于并列名词，be动词通常与最靠近它的名词保持一致：`There is a pen and two pencils in the box.`\n\n2.  **时态变化**\n    *   一般过去时: `There was / were...`\n    *   一般将来时: `There will be...`\n    *   现在完成时: `There has / have been...`\n\n3.  **易错点辨析**: 注意区分 `There be` 和 `have/has`。`There be` 强调“客观存在”，而 `have/has` 强调“主观拥有”。例如：`My school has a library.` (我学校有一个图书馆，主语是school)，也可以说 `There is a library in my school.` (我学校里有一个图书馆，强调存在)。","socratic_tracks":[{"title":"“There be” 句型识别","steps":[{"question":"看到 is, are 这样的选项，我们通常会想到什么语法点？","hint":"这几个词都和 be 动词有关，涉及到主语和动词的关系。","takeaway":"选项是 be 动词的不同形式，提示我们本题考查主谓一致。"},{"question":"在英语中，如果我们想表达“有……”（表示存在），最常用的句型是什么？","hint":"比如，“有一座大楼”。","takeaway":"表达“存在”时，我们通常使用 “There be” 句型。"}]},{"title":"主谓一致：就近原则","steps":[{"question":"在 “There be” 句型中，be 动词用 is 还是 are，是由什么决定的？","hint":"比较一下 “There is a boy.” 和 “There are two boys.”。","takeaway":"be 动词的形式由其后面的名词的单复数决定。"},{"question":"如果空格后面跟的是一个复数名词，比如 “many cars”，我们应该用 is 还是 are？","hint":"“many cars” 是一辆车还是很多辆车？","takeaway":"当 “There be” 后面的名词是复数时，be 动词要用 are。"}]},{"title":"选项辨析","steps":[{"question":"选项 A “be” 是什么形式？它能直接放在主语后面做谓语吗？","hint":"想一想 “I am a student.”，我们不会说 “I be a student.”。","takeaway":"“be” 是动词原形，通常不能直接作谓语，需要跟在情态动词或不定式符号 to 后面。"},{"question":"选项 B “is” 和 C “are” 有什么区别和用法？","hint":"它们都用于一般现在时，但对应的主语不同。","takeaway":"“is” 用于单数或不可数名词，而 “are” 用于复数名词。"}]}]}},{"number":"27","item_type":"cloze","context_note":"","stem":"27.","options":{"A":"tall","B":"the tallest","C":"tallest","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查形容词最高级的用法。从选项 `tall`, `the tallest`, `tallest` 可以看出，考点是形容词的比较等级。在完形填空的语境中，当需要表达“（在一定范围内）最……”的含义时，即比较三者或三者以上时，应使用形容词的最高级。形容词最高级的标准结构是“the + 形容词最高级形式”。选项 A “tall” 是原级。选项 C “tallest” 虽然是最高级形式，但缺少了定冠词 “the”，在绝大多数情况下是错误的。因此，只有选项 B “the tallest” 是语法完整且正确的形式。","knowledge_expansion_md":"形容词的最高级是英语语法中的一个重要概念，用于将一个事物与同类中的所有其他事物进行比较。\n\n1.  **基本构成**: `the + 形容词最高级 (+ 名词) + in/of...`\n    *   `He is the tallest boy in our class.` (他是我们班最高的男孩。)\n    *   `This is the most interesting book I have ever read.` (这是我读过的最有趣的书。)\n\n2.  **形式变化规则**:\n    *   **规则变化**: 单音节和部分双音节词加 `-est` (e.g., `tall` -> `tallest`, `happy` -> `happiest`)。多音节和部分双音节词前加 `most` (e.g., `beautiful` -> `most beautiful`)。\n    *   **不规则变化**: `good/well` -> `best`, `bad/ill` -> `worst`, `many/much` -> `most`, `little` -> `least`, `far` -> `farthest/furthest`。\n\n3.  **定冠词 `the` 的省略**: 在某些特定情况下，`the` 可以省略。例如，当最高级前有物主代词 (`my`, `his` 等) 或名词所有格 (`Tom's` 等) 时。例如：`He is my best friend.` (他是**我**最好的朋友。)","socratic_tracks":[{"title":"判断比较范围","steps":[{"question":"当我们描述一个东西时，有几种比较的程度？","hint":"想一想，只描述它本身、把它和另一个东西比、把它和一群东西比，分别叫什么？","takeaway":"形容词有三个等级：原级、比较级和最高级。"},{"question":"从上下文推断，如果句子想表达“最……”的意思，应该用哪个等级？","hint":"比如，“最高的楼”、“最快的运动员”。","takeaway":"表达“最……”的含义时，需要使用形容词的最高级。"}]},{"title":"最高级的构成","steps":[{"question":"形容词 “tall” 的最高级形式是什么？","hint":"这是一个单音节词。","takeaway":"“tall” 的最高级形式是 “tallest”。"},{"question":"在使用形容词最高级时，它的前面通常需要加一个什么词？","hint":"比如，我们说“世界上最高的山”，英文是 “the highest mountain in the world”。","takeaway":"形容词最高级前通常必须加定冠词 “the”。"}]},{"title":"选项辨析与排除","steps":[{"question":"为什么选项 A “tall” 不正确？","hint":"“tall” 是原级，它能表达“最”的意思吗？","takeaway":"原级只用于描述，不具备“最”的含义，因此不符合语境。"},{"question":"选项 B “the tallest” 和 C “tallest” 哪个更完整、更正确？为什么？","hint":"回顾一下最高级的标准结构。","takeaway":"选项 B “the tallest” 是完整的最高级结构，而选项 C 缺少了必要的定冠词 “the”。"}]}]}},{"number":"28","item_type":"cloze","context_note":"","stem":"28.","options":{"A":"likes driving","B":"likes drive","C":"like driving","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题综合考查了主谓一致和动词 `like` 的用法。首先，从选项中的 `likes` 和 `like` 可以判断，本题涉及主谓一致。根据小升初考试的常见考点，此处的主语很可能是第三人称单数（如 `he`, `she`, `a person` 等），因此谓语动词需要使用第三人称单数形式，即 `likes`。这样就可以排除选项 C `like driving`。其次，考查动词 `like` 后面的搭配。表达“喜欢做某事”时，`like` 后面通常跟动名词（doing）或不定式（to do）。选项 B `likes drive` 中，`drive` 是动词原形，不符合 `like` 的用法，是错误的。因此，只有选项 A `likes driving` 既满足了主谓一致，又符合 `like` 的正确用法。","knowledge_expansion_md":"本题的核心是两个语法点的结合：\n\n1.  **主谓一致（一般现在时）**: 当主语是第三人称单数（he, she, it, Tom, the dog 等）时，谓语动词需要进行相应的变化，通常是加 `-s` 或 `-es`。这是英语中最基本也最重要的规则之一。\n    *   `I/You/We/They like...`\n    *   `He/She/It likes...`\n\n2.  **非谓语动词作宾语**: 很多动词后面需要跟另一个动词作宾语时，后面的动词不能使用原形，而要变成非谓语动词形式，主要是动名词（-ing 形式）和不定式（to do 形式）。\n    *   **跟动名词的动词**: `enjoy`, `finish`, `mind`, `practice`, `keep`, `avoid`, `suggest` 等。例如: `I enjoy listening to music.`\n    *   **跟不定式的动词**: `want`, `hope`, `decide`, `plan`, `learn`, `agree` 等。例如: `She wants to be a doctor.`\n    *   **两者均可跟的动词**: `like`, `love`, `hate`, `start`, `begin`, `continue`。`like doing` 侧重习惯和享受，`like to do` 侧重具体的某次行为。在多数情况下可互换。","socratic_tracks":[{"title":"主谓一致检查","steps":[{"question":"当我们说“我喜欢”和“他喜欢”时，动词 “like” 有什么变化吗？","hint":"注意主语的人称和单复数。","takeaway":"当主语是第三人称单数（如“他”）时，动词 “like” 需要加s，变成 “likes”。"},{"question":"看到选项中有 “likes” 和 “like”，我们应该首先做什么？","hint":"动词形式不同，说明可能和主语有关。","takeaway":"我们应该先判断句子的主语是单数还是复数，来确定动词的形式。"}]},{"title":"动词 “like” 的搭配","steps":[{"question":"在英语中，如果想说“喜欢做某事”，比如“喜欢开车”，动词 “like” 后面应该跟什么形式的词？","hint":"可以说 “I like drive” 吗？","takeaway":"“like” 后面不能直接跟动词原形，应该跟动名词（driving）或不定式（to drive）。"},{"question":"那么，“likes drive” 这个组合正确吗？","hint":"一个句子中，一个主语通常只能有一个谓语动词。","takeaway":"“likes drive” 是一个错误的结构，因为 “like” 后面不能直接跟动词原形。"}]},{"title":"综合分析与排除","steps":[{"question":"假设本句主语是第三人称单数 “He”，我们来分析三个选项。选项 C “like driving” 为什么不对？","hint":"主语是 “He”，动词用 “like” 还是 “likes”？","takeaway":"选项 C 的动词 “like” 没有使用第三人称单数形式，违反了主谓一致原则。"},{"question":"选项 B “likes drive” 为什么不对？","hint":"回顾一下 “like” 的搭配规则。","takeaway":"选项 B 违反了 “like” 后面不能直接跟动词原形的规则。"},{"question":"这样排除下来，为什么选项 A “likes driving” 是正确的？","hint":"从主谓一致和动词搭配两个角度来检查它。","takeaway":"选项 A “likes driving” 既满足了第三人称单数的主谓一致，又符合 “like doing sth.” 的正确用法。"}]}]}},{"number":"29","item_type":"cloze","context_note":"","stem":"29.","options":{"A":"a","B":"an","C":"the","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"此题考查冠词的用法。空格后的名词是 \"toy store\"，以辅音音素 /t/ 开头，因此排除 \"an\"。根据语境，主人公是去任意一家玩具店，而不是特指某家之前提到过的店，所以是泛指。对于泛指的单数可数名词，我们使用不定冠词 \"a\" 或 \"an\"。因此，正确答案是 \"a\"。","knowledge_expansion_md":"### 冠词用法辨析\n\n1.  **不定冠词 a/an**：\n    *   `a` 用在以**辅音音素**开头的单词前。例如：`a book`, `a car`, `a university` (university 以辅音音素 /j/ 开头)。\n    *   `an` 用在以**元音音素**开头的单词前。例如：`an apple`, `an egg`, `an hour` (hour 的 h 不发音，以元音音素 /aʊ/ 开头)。\n    *   主要用于**首次提到**、**非特指**的单数可数名词前，表示“一个”或“某一类”。\n\n2.  **定冠词 the**：\n    *   用于**特指**某人或某物，即说话双方都明确所指的对象。\n    *   用于上文已经提到过的人或物。\n    *   用于世界上独一无二的事物，如 `the sun`, `the moon`。\n    *   用在序数词和形容词最高级前，如 `the first`, `the best`。","socratic_tracks":[{"title":"不定冠词 vs. 定冠词","steps":[{"question":"空格后面的名词 \"toy store\" 在故事里是第一次提到，还是之前已经说过的某个特定的商店？","hint":"故事里说“他去了一家玩具店”，是泛指一家店，而不是特指我们都知道的那家店。","takeaway":"首次提到、非特指的单数可数名词前，通常用不定冠词 a/an。"},{"question":"既然是泛指，我们应该用 \"a\" 还是 \"an\" 呢？判断的依据是什么？","hint":"关键看它后面所跟单词的第一个“发音”是元音还是辅音，而不是看字母。","takeaway":"\"a\" 用在辅音音素开头的单词前，\"an\" 用在元音音素开头的单词前。"}]},{"title":"冠词的功能","steps":[{"question":"冠词在句子中是做什么用的？它能告诉我们关于名词的什么信息？","hint":"对比一下 \"a book\" (一本书) 和 \"the book\" (那本书) 的区别。","takeaway":"冠词用于限定名词，表明它是泛指（不确定的某一个）还是特指（确定的那一个）。"},{"question":"在“他去了一家玩具店”这个场景里，作者是想表达他去了“某一家”店，还是“我们都知道的那家”店？","hint":"对于读者来说，这家店是第一次出现，我们对它一无所知。","takeaway":"当听话人/读者对所指事物不了解时，应使用不定冠词来引出新信息。"}]},{"title":"排除法应用","steps":[{"question":"我们先看选项 B \"an\"。为什么它肯定不对？","hint":"复习一下 \"an\" 的使用规则：它后面的单词发音有什么要求？","takeaway":"\"an\" 必须用在以元音音素开头的单词前，而 \"toy\" 以辅音音素 /t/ 开头。"},{"question":"再看选项 C \"the\"。如果用 \"the\"，句子意思会变成什么？在当前语境下合理吗？","hint":"\"the toy store\" 意味着“那家（我们都知道的）玩具店”。但故事里之前提到过这家店吗？","takeaway":"在没有上下文铺垫的情况下，直接使用定冠词 \"the\" 会让读者感到困惑，因此 \"a\" 是最佳选择。"}]}]}},{"number":"30","item_type":"cloze","context_note":"","stem":"30.","options":{"A":"friends","B":"friend","C":"the friend","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题考查名词的数和所有格的用法。根据空格后面的人名 \"Jack\"，我们可以判断这里指的是一个人。因此，名词应该使用单数形式 \"friend\"。短语 \"his best friend\" 意为“他最好的朋友”，是一个符合语法和语境的常见搭配。选项 A \"friends\" 是复数，与单个人名 Jack 不符。选项 C \"the friend\" 不能和所有格代词 \"his\" 同时使用来修饰名词。","knowledge_expansion_md":"### 名词单复数与所有格\n\n1.  **名词的数**：英语中名词有单数和复数之分。当指代一个人或物时用单数（如 `friend`），指代两个或以上时用复数（如 `friends`）。选择单数还是复数，必须根据上下文的语境来判断。\n\n2.  **限定词的搭配**：所有格代词（如 `my`, `your`, `his`）和冠词（`a`, `an`, `the`）都属于限定词。在一个名词短语中，通常只能使用一个限定词来修饰名词。例如，我们说 `his friend` 或 `a friend` 或 `the friend`，但不能说 `his a friend` 或 `his the friend`。\n\n3.  **同位语**：在本题中，\"Jack\" 是 \"his best friend\" 的同位语，用来具体说明这个朋友是谁。同位语和它说明的名词在“数”上必须保持一致。","socratic_tracks":[{"title":"名词单复数判断","steps":[{"question":"空格后面的名字 \"Jack\" 通常指一个人还是多个人？","hint":"Jack 是一个常见的英文名，指代一个人。","takeaway":"根据上下文指代对象的数量，可以判断名词应该用单数还是复数。"},{"question":"既然是指一个人，那么 \"friend\" 和 \"friends\" 哪一个是正确的形式？","hint":"\"friend\" 是单数形式，指一个朋友；\"friends\" 是复数形式，指多个朋友。","takeaway":"指代单个对象时，必须使用名词的单数形式。"}]},{"title":"所有格与冠词","steps":[{"question":"看看空格前面的 \"his\"。它是什么词？它有什么作用？","hint":"\"his\" 是一个所有格代词，表示“他的”，用来表明物品或人的归属。","takeaway":"所有格代词用来表明名词的归属关系，本身就起到了限定作用。"},{"question":"在一个名词前面，我们能同时使用所有格代词（如 his）和冠词（如 the）吗？比如 \"his the friend\" 对不对？","hint":"试着造句：这是“我的这支笔”(my the pen)？还是“我的笔”(my pen)？","takeaway":"所有格代词和冠词都属于限定词，通常不能同时使用来修饰同一个名词。"}]},{"title":"语意与搭配","steps":[{"question":"\"his best friend\" 这个短语是什么意思？在日常生活中常见吗？","hint":"意思是“他最好的朋友”。这是一个非常地道的表达。","takeaway":"熟悉常用词组搭配有助于快速准确地选择答案。"},{"question":"如果选 A \"friends\"，句子变成 \"his best friends, Jack\"，语法上可能吗？","hint":"如果后面是 \"Jack and Mike\"，那么用 \"friends\" 就对了。但这里只有一个名字 Jack。","takeaway":"名词的数必须与它所指代或同位的对象在数量上保持一致。"}]}]}},{"number":"31","item_type":"cloze","context_note":"","stem":"31.","options":{"A":"sees","B":"seed","C":"saw","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"此题考查动词时态。根据故事的开篇句 \"It was the day before Christmas\"，我们可以知道整个故事的背景时间是过去。因此，描述过去发生的动作，谓语动词需要使用一般过去时。本句的主语是 \"he\"，宾语是 \"a beautiful toy car\"，中间缺少一个表示“看见”的动作。动词 \"see\" (看见) 的过去式是 \"saw\"。选项 A \"sees\" 是一般现在时第三人称单数形式，时态不符。选项 B \"seed\" 是名词，意为“种子”，词性和词义均不符。","knowledge_expansion_md":"### 动词时态与词性辨析\n\n1.  **一般过去时 (Simple Past Tense)**：\n    *   **用法**：表示过去某个时间发生的动作或存在的状态，常与表示过去的时间状语（如 `yesterday`, `last year`, `in 1999`, `...ago`）连用。故事、记叙文通常以一般过去时为主要时态。\n    *   **构成**：谓语动词使用过去式。规则动词的过去式在词尾加 `-ed`，不规则动词的过去式需要专门记忆，如：`see-saw`, `go-went`, `buy-bought`, `eat-ate`。\n\n2.  **词性辨析**：做题时要分析句子结构，判断空格处需要什么词性的词。本句结构为“主语(he) + ______ + 宾语(a car)”，明显缺少一个谓语动词。`seed` 是名词，不能作谓语，因此可以首先排除。\n\n3.  **主谓一致**：在一般现在时中，若主语为第三人称单数（he, she, it, a person's name），谓语动词需用第三人称单数形式（通常加-s/es），如 `He sees`。但在一般过去时中，除了be动词外，动词过去式形式对所有人称都是一样的，如 `I saw`, `He saw`, `They saw`。","socratic_tracks":[{"title":"动词时态判断","steps":[{"question":"这篇短文讲的是正在发生的事，还是已经发生过的事？你是从哪个词或哪句话看出来的？","hint":"注意文章第一句 \"It was the day before Christmas.\" 这里的 \"was\" 是什么时态？","takeaway":"文章的整体时态（过去时）决定了其中描述具体动作的动词也应使用过去时。"},{"question":"“看见”的英文动词原形是什么？它的过去式又是什么？","hint":"动词原形是 \"see\"，它是一个不规则动词，过去式需要特殊记忆。","takeaway":"描述过去发生的动作，需要使用动词的过去式形式，不规则动词的过去式需要牢记。"}]},{"title":"词性辨析","steps":[{"question":"在 \"he ______ a beautiful toy car\" 这个句子结构中，空格处需要填一个什么词性的词？","hint":"句子有主语 \"he\" 和宾语 \"a beautiful toy car\"，中间缺少一个表示动作的词。","takeaway":"主语和宾语之间通常需要一个谓语动词来连接，表示主语发出的动作。"},{"question":"让我们看看选项 B \"seed\"。它是什么词性？什么意思？放在这里合适吗？","hint":"\"seed\" 是名词，意思是“种子”。“他种子一个玩具车”？这在逻辑上说不通。","takeaway":"做题时要分析句子成分，确保所选单词的词性符合句子结构要求。"}]},{"title":"时态一致性检查","steps":[{"question":"假设这个故事用的是现在时，那么主语 \"he\" 后面，动词 \"see\" 应该用什么形式？","hint":"想一想一般现在时中，主语是第三人称单数时，谓语动词有什么变化？","takeaway":"在一般现在时中，当主语是第三人称单数时，谓语动词要用第三人称单数形式（如 sees）。"},{"question":"那么选项 A \"sees\" 在语法上是正确的动词形式，为什么在这里不能选？","hint":"再回到第一步，这整个故事的“时间背景”是什么？一个句子不能脱离全文的语境。","takeaway":"即使一个选项在局部语法上正确，也必须符合全文的整体时态，保持时态一致性。"}]}]}},{"number":"32","item_type":"cloze","context_note":"","stem":"32.","options":{"A":"Marry","B":"Merry","C":"Happy","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"此题考查固定的节日祝福语。根据上下文，主人公在圣诞节送出礼物并致以祝福，空格后的单词是 \"Christmas\" (圣诞节)。“圣诞快乐”最常用、最地道的表达是 \"Merry Christmas!\"，这是一个约定俗成的固定搭配。选项 A \"Marry\" 是动词，意为“结婚”，词性与词义均不符。选项 C \"Happy\" 虽然也意为“快乐的”，但常用于 \"Happy New Year!\" (新年快乐) 或 \"Happy Birthday!\" (生日快乐)，与 Christmas 搭配远不如 \"Merry\" 普遍和传统。","knowledge_expansion_md":"### 节日祝福语与词义辨析\n\n1.  **常见的节日祝福语 (Fixed Expressions)**：\n    *   `Merry Christmas!`: 圣诞快乐！\n    *   `Happy New Year!`: 新年快乐！\n    *   `Happy Birthday!`: 生日快乐！\n    *   `Happy Thanksgiving!`: 感恩节快乐！\n    *   `Happy Easter!`: 复活节快乐！\n    *   `Happy Halloween!`: 万圣节快乐！\n\n2.  **\"Merry\" vs. \"Happy\"**：\n    *   `Merry` 意为“欢快的，愉快的”，带有一种更热烈、更欢腾的节日气氛。它是一个较为古老的词，在现代英语中主要用于 `Merry Christmas` 和一些固定短语中，如 `the more the merrier` (越多越好)。\n    *   `Happy` 意为“幸福的，快乐的”，适用范围更广，是表达快乐最常用的形容词，可用于几乎所有值得庆祝的场合。\n    *   **注意**：在英式英语中，尤其是在英国上层社会，说 `Happy Christmas` 也很常见，但这不影响 `Merry Christmas` 作为全球范围内更具代表性的标准说法。\n\n3.  **形近/音近词辨析**：`Marry` /'mæri/ (v. 结婚) 与 `Merry` /'meri/ (adj. 愉快的) 发音相近，拼写相似，是常见的易混淆词，需要注意区分。","socratic_tracks":[{"title":"固定搭配与文化习惯","steps":[{"question":"当你想祝别人“圣诞快乐”时，英文中最常见的说法是什么？","hint":"回忆一下你在电影、歌曲或贺卡上最常看到的关于圣诞节的祝福语。","takeaway":"\"Merry Christmas!\" 是最广为人知的圣诞祝福固定搭配。"},{"question":"为什么我们通常不说 \"Happy Christmas\" 呢？\"Happy\" 不也是“快乐”的意思吗？","hint":"语言有其约定俗成的用法。\"Merry\" 这个词带有一种更古老、更欢腾的节日气氛，传统上就和圣诞节联系在一起。","takeaway":"掌握语言中的固定搭配和文化习惯，是让表达更地道的关键。"}]},{"title":"词义与词性辨析","steps":[{"question":"我们来看选项 A \"Marry\"。这个词是什么意思？是什么词性？","hint":"\"Marry\" 是一个动词，意思是“和……结婚”。","takeaway":"\"Marry\" 是一个动词，不能放在这里构成祝福语。"},{"question":"在 \"______ Christmas!\" 这个祝福语里，我们需要一个什么词性的词来修饰 \"Christmas\"？","hint":"我们需要一个形容词来描述 Christmas 是“什么样的”，是“快乐的”圣诞节。","takeaway":"分析句子结构，判断所需词的词性，可以有效排除错误选项。"}]},{"title":"\"Merry\" 与 \"Happy\" 的用法区别","steps":[{"question":"除了圣诞节，\"Merry\" 这个词你还在哪里见过？","hint":"它的使用场景其实比较有限，比如短语 \"the more the merrier\" (越多越好)。","takeaway":"\"Merry\" 是一个较为传统的词，主要用于圣诞祝福和一些固定短语中。"},{"question":"那么 \"Happy\" 呢？它可以用来祝福哪些节日或场合？","hint":"想想“新年快乐”、“生日快乐”、“感恩节快乐”用英文怎么说。","takeaway":"\"Happy\" 是一个更通用、更现代的表示“快乐”的形容词，适用于大多数祝福场合。"}]}]}},{"number":"33","item_type":"cloze","context_note":"","stem":"33.","options":{"A":"why","B":"how","C":"when","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查在问路语境中特殊疑问词的选择。根据句意“你能告诉我___去人民公园吗？”，显然是在询问“如何”去，即询问方式或方法。因此，应选择表示“如何，怎样”的`how`。`how to do sth.`是固定用法，意为“如何做某事”。选项A `why`（为什么）和选项C `when`（何时）在语境中逻辑不通。","knowledge_expansion_md":"### “疑问词 + to do”结构\n\n在英语中，“疑问词 + 动词不定式（to do）”是一种常见的非谓语动词结构，它可以在句子中充当主语、宾语、表语等成分。这个结构常用来表示“该做什么/去哪里/怎么办”等含义。\n\n常见的组合有：\n- **what to do** (做什么)\n  > I don't know **what to do** next. (我不知道接下来该做什么。)\n- **how to do** (如何做)\n  > Can you teach me **how to swim**? (你能教我如何游泳吗？)\n- **when to do** (何时做)\n  > Please tell me **when to start**. (请告诉我何时开始。)\n- **where to go** (去哪里)\n  > He is thinking about **where to go** for the holiday. (他正在考虑假期去哪里。)\n- **which to choose** (选择哪一个)\n  > There are two books, and I can't decide **which to choose**. (有两本书，我决定不了选哪本。)\n\n**注意**：`why` 一般不直接与动词不定式连用，即不说 `why to do`。如果想表达类似意思，通常会使用完整的从句，如 `why we should do it`。","socratic_tracks":[{"title":"疑问词+不定式结构","steps":[{"question":"句中横线后面跟着的是 'to get to the People's Park'，这是一个动词不定式短语，表示'到达人民公园'。前面需要一个词来引导它，你想想，这句话是在问什么？是问'为什么'、'如何'还是'何时'到达公园？","hint":"一个迷路的人最想知道的是什么？","takeaway":"迷路时，我们通常询问'如何'到达目的地，即问路的方法或路线。"},{"question":"在英语中，当我们想表达'如何做某事'时，有一个常见的固定结构。你知道是什么吗？","hint":"它由'如何'这个疑问词和动词不定式组成。","takeaway":"疑问词 'how' 加上动词不定式 'to do' 构成了 'how to do sth.' 的结构，意为'如何做某事'。"},{"question":"我们再看看 A 和 C 选项。'why to get to...' 和 'when to get to...' 放在这里意思通顺吗？","hint":"分别把它们代入句子，翻译成中文看看：'你能告诉我为什么去公园吗？' '你能告诉我什么时候去公园吗？' 这符合一个问路人的语境吗？","takeaway":"在问路的情景下，询问原因(why)和时间(when)不合逻辑，只有询问方式(how)才最合理。"}]},{"title":"语境逻辑推理","steps":[{"question":"这句话 'could you tell me ... to get to the People's Park?' 出现在什么场景下？说话人想达到什么目的？","hint":"从 'Excuse me' 和 'get to' 这些词可以推断，这很可能是一个问路的场景。","takeaway":"通过关键词可以判断，这是一个典型的问路语境。"},{"question":"在一个问路的对话中，提问者最核心的需求是了解什么信息？","hint":"是路线、原因还是时间？","takeaway":"问路的核心是获取前往目的地的路线或方法。"},{"question":"对比三个选项 'why', 'how', 'when'，哪一个词是用来询问路线或方法的？","hint":"'why' 问原因，'when' 问时间。","takeaway":"疑问词 'how'专门用来询问方式、方法或途径，因此最符合问路的语境。"}]},{"title":"特殊疑问词辨析","steps":[{"question":"我们来复习一下几个常见的特殊疑问词的用法。'why' 通常用来问什么？","hint":"比如：Why are you late? (你为什么迟到？)","takeaway":"'Why' 用来询问原因。"},{"question":"'when' 通常用来问什么？","hint":"比如：When is your birthday? (你的生日是什么时候？)","takeaway":"'When' 用来询问时间。"},{"question":"'how' 的用法比较多，在问路时它通常问什么？","hint":"比如：How can I get to the station? (我怎样才能到车站？)","takeaway":"'How' 可以用来询问方式或方法，这正是本题所需要的。"}]}]}},{"number":"34","item_type":"cloze","context_note":"","stem":"34.","options":{"A":"ask","B":"follow","C":"stop","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查指路场景下的动词选择。根据上下文，说话者正在给别人指路。句子“Just ___ this road and turn left...”意为“就___这条路然后左转...”。在指路时，表达“沿着这条路走”通常使用`follow this road`或`go along this road`。因此，`follow`（沿着...走）是最佳选项。选项A `ask`（问）和选项C `stop`（停止）与宾语`this road`搭配在语义上不合逻辑。","knowledge_expansion_md":"### 指路常用动词和短语\n\n在为他人指引方向时，我们会用到一系列特定的动词和短语，构成祈使句来给出清晰的指令。\n\n1.  **表示“沿着...”**\n    *   `follow`: Follow this street. (沿着这条街走。)\n    *   `go/walk along`: Go along the river. (沿着河走。)\n    *   `go/walk down`: Walk down this road for two blocks. (沿着这条路走两个街区。)\n\n2.  **表示“转弯”**\n    *   `turn left/right`: Turn left at the traffic lights. (在红绿灯处左转。)\n    *   `take the first/second... turning on the left/right`: Take the second turning on your right. (在第二个路口向右转。)\n\n3.  **表示“穿过”**\n    *   `cross`: Cross the bridge. (过桥。)\n    *   `go across`: Go across the square. (穿过广场。)\n\n4.  **其他常用表达**\n    *   `It's on your left/right.` (它在你的左边/右边。)\n    *   `You can't miss it.` (你不会错过的。)\n    *   `It's opposite the bank.` (它在银行对面。)","socratic_tracks":[{"title":"指路动词辨析","steps":[{"question":"这句话 'Just ___ this road and turn left...' 是在做什么？","hint":"说话人正在告诉别人怎么去一个地方。","takeaway":"这句话是在为他人指路。"},{"question":"在指路时，如果要表达'沿着这条路走'，我们应该用哪个动词？","hint":"想象一下你带着朋友走路，你会说'___ 我' (___ me)。","takeaway":"动词 'follow' 有'跟随，沿着...行进'的意思，常用于指路。"},{"question":"我们看看 A 和 C 选项。'ask this road' (问这条路) 和 'stop this road' (停下这条路) 在这里说得通吗？","hint":"路是物体，不能被'询问'或'停下'。","takeaway":"动词需要和其宾语'this road'在语义上搭配，'ask'和'stop'在此处搭配不当。"}]},{"title":"祈使句的应用","steps":[{"question":"这句话 'Just ___ this road...' 是什么类型的句子？","hint":"它以动词原形开头，用来给出指令或建议。","takeaway":"这是一个祈使句，用来给出指示。"},{"question":"祈使句的动词需要表达一个清晰的动作。结合后面的 'and turn left' (然后左转)，前面的动作应该是什么？","hint":"左转之前，人需要先沿着某条路行进一段距离。","takeaway":"根据逻辑顺序，指路时应先指示'沿着路走'，再指示'转弯'。"},{"question":"在 'ask', 'follow', 'stop' 三个动作中，哪个最符合'沿着路走'这个行进的动作？","hint":"思考这三个词的中文意思：询问、跟随、停止。","takeaway":"只有 'follow' (跟随/沿着) 表达了持续行进的动作，符合指路的语境。"}]},{"title":"词义辨析与搭配","steps":[{"question":"我们来分析一下动词 'follow' 的意思。除了'跟随'，它还有什么常见含义？","hint":"比如 'follow the rules' (遵守规则)，'follow the instructions' (遵循指示)。","takeaway":"'Follow' 的核心意思是'顺着'、'遵循'，可以指人、路、规则等。"},{"question":"动词 'ask' 通常和什么词搭配？","hint":"我们可以 'ask a question' (问一个问题) 或者 'ask somebody for help' (向某人求助)。","takeaway":"'Ask' 的宾语通常是人或表示信息的事物，而不是'路'。"},{"question":"动词 'stop' 呢？我们可以 'stop the car' (停车) 或者 'stop doing sth.' (停止做某事)。'stop this road' 合理吗？","hint":"路是静态的，不能被'停止'。","takeaway":"动词和宾语的搭配必须符合逻辑和习惯用法，'stop this road' 搭配不当。"}]}]}},{"number":"35","item_type":"cloze","context_note":"","stem":"35.","options":{"A":"Don't","B":"You don't","C":"You can't","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查祈使句的否定形式。根据语境，说话者在指完路后安慰对方，说“___担心。离这儿不远。” 这是一种安慰和建议的语气。表达“别做某事”应使用祈使句的否定形式，其结构为“Don't + 动词原形”。因此，“Don't worry” (别担心) 是正确且地道的表达。选项B `You don't worry` 是一个陈述句，意为“你（平时）不担心”，不符合语境。选项C `You can't worry` 意为“你不能/无法担心”，语气生硬，也不合适。","knowledge_expansion_md":"### 祈使句 (Imperative Sentences)\n\n祈使句用于表达命令、请求、建议、警告或祝愿等，其主语通常是第二人称 `you`，但常常被省略。\n\n1.  **肯定结构**：动词原形 (+ 其他成分)\n    *   `Come in, please.` (请进。) - 表示请求\n    *   `Be quiet!` (安静！) - 表示命令\n    *   `Have a good trip!` (祝你旅途愉快！) - 表示祝愿\n\n2.  **否定结构**：`Don't` + 动词原形 (+ 其他成分)\n    *   `Don't touch it.` (别碰它。) - 表示禁止\n    *   `Don't be late.` (别迟到。) - 表示警告\n    *   `Don't worry.` (别担心。) - 表示安慰\n\n3.  **强调结构**：`Do` + 动词原形 (+ 其他成分)\n    *   `Do be careful.` (务必小心。) - 加强语气\n\n4.  **Let's 结构**：用于提出建议，包括说话者本人。\n    *   肯定：`Let's go.` (我们走吧。)\n    *   否定：`Let's not talk about it.` (我们别谈论那件事了。)","socratic_tracks":[{"title":"祈使句的否定形式","steps":[{"question":"这句话'___ worry' 是想表达什么意思？是陈述一个事实，还是给出一个建议或安慰？","hint":"结合后文 'It's not far from here' (离这儿不远)，说话人是在安慰对方。","takeaway":"这句话是在安慰对方，让他'别担心'。"},{"question":"在英语中，当我们想告诉别人'不要做某事'时，应该用什么样的句子结构开头？","hint":"这种句子叫祈使句的否定式，通常以两个词开头。","takeaway":"祈使句的否定形式以 'Don't' 开头，后面跟动词原形。"},{"question":"对比选项 B 'You don't' 和 C 'You can't'。'You don't worry' 是什么句子？'You can't worry' 呢？它们适合用在这里吗？","hint":"'You don't worry' 是陈述句，表示'你平常不担心'。'You can't worry' 表示'你不能/无法担心'。这符合安慰的语气吗？","takeaway":"陈述句 'You don't worry' 和情态动词句 'You can't worry' 都不如祈使句 'Don't worry' 更能直接、地道地表达安慰。"}]},{"title":"功能语境分析","steps":[{"question":"说话人说出 '___ worry' 的目的是什么？","hint":"他刚刚给一个外国人指完路。","takeaway":"说话人的目的是为了让问路的人安心、放心。"},{"question":"为了达到'让对方放心'这个目的，哪种表达最直接、最常用？是'别担心'，'你不用担心'，还是'你不能担心'？","hint":"想一想在中文里，我们最常怎么说？","takeaway":"在日常交流中，'别担心' (Don't worry) 是最直接、最常见的安慰语。"},{"question":"将三个选项翻译成对应的英文表达，哪个是'别担心'？","hint":"A. Don't worry. B. You don't worry. C. You can't worry.","takeaway":"'Don't worry' 是'别担心'最准确和地道的英文表达。"}]},{"title":"句子结构辨析","steps":[{"question":"我们来看选项A 'Don't'。如果填入 'Don't'，句子 'Don't worry' 省略了哪个词？","hint":"祈使句的命令对象通常是谁？","takeaway":"祈使句省略了主语 'you'。"},{"question":"再看选项B 'You don't'。如果填入，句子是 'You don't worry'。这是一个完整的句子吗？它是什么时态？","hint":"主语+助动词否定+动词原形。","takeaway":"'You don't worry' 是一个完整的一般现在时陈述句，主语是'You'。"},{"question":"为什么在这里用省略主语的祈使句 'Don't worry' 比用完整的陈述句 'You don't worry' 更好？","hint":"祈使句的语气更直接，有建议、命令或安慰的意味。陈述句只是在描述一个事实。","takeaway":"在此语境下，需要的是安慰和建议，因此祈使句的语气比陈述句更恰当。"}]}]}}]},{"section_title":"IV. 阅读理解 (共30分)","section_instruction":"A\nThe following discussion(讨论) took place(发生) between a father and his nine-year-old son.\n\"It's unfair(不公平), Dad. Mum wants me to make my bed, but I don't know how.\"\n\"It's time for you to learn. Where are your clean sheets(床单)?\"\n\"I don't know.\"\n\"What do you mean you don't know? You need to take care of your things.\"\n\"Where are Jack's sheets?\" the father called to his wife.\n\"Right next to ours,\" the wife answered.\nAfter a moment, the father asked slowly, \"Where are ours?\"\n\nB\nA girl may pass easily through the first grades. While boys of her age bring home low marks, the girl may easily get good grades. Girls seem to have \"better brains\" in school. Why do so few girls become scientists? Why are the most important things in the adult (成人) world done by men?\nAccording to (根据) scientists, the answer is aggression (好斗行为). Boys usually refuse to accept other people's conclusions(结论). They insist on solving problems by themselves. While little girls are getting high marks in school for remembering what the teacher has told them, little boys are learning to think in their own ways. Boys are usually the ones who get high pay and the powerful jobs because they are to be aggressive at an early age.\n\nC\nAnswer the questions according to the poster.\nVisit Swansea Zoo\nCome and see the Indian elephants and new tigers from America. The bears are waiting to meet you and the monkeys from China are waiting for you. The lovely dogs from Australia are waiting to smile at you. And the giraffes from Zambia are waiting for you to visit them. You can take photos with these lovely animals.\nTickets\nAdults: $2.00\nChildren: Over 12, $1.00\nUnder 12 Free\nOpening hours\n9:00 a.m. - 4:00 p.m. (except 除了 Friday)\n10:00 a.m. - 3:00 p.m. Friday\nKeep the zoo clean!\nDo not touch, feed or go near the animals!","items":[{"number":"36","item_type":"reading","context_note":"Passage A","stem":"The discussion took place between _____.","options":{"A":"a husband and a wife","B":"a mother and her son","C":"a father and his son","D":"a mother and a father"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对文章人物关系的理解和判断。通过阅读对话，我们可以找到关键信息。文中小男孩说：“But Mom, all my friends are playing online.”（但是，妈妈，我所有的朋友都在上网玩。）他对话中的女性使用了称呼“Mom”（妈妈）。这直接表明了对话双方是母子关系。因此，正确答案是B。","knowledge_expansion_md":"### 阅读理解技巧：判断人物关系\n\n在阅读理解中，快速准确地判断人物关系是理解文章的基础。可以关注以下几类线索：\n\n1.  **直接称谓 (Terms of Address)**：这是最直接的线索。\n    *   **家庭成员**: `Mom`, `Dad`, `Grandma`, `son`, `dear`, `honey` 等。\n    *   **社会关系**: `Mr./Mrs./Ms. Smith`, `Doctor`, `Professor`, `Sir`, `Madam` 等。\n\n2.  **指代词 (Pronouns) 和所有格 (Possessives)**：\n    *   注意 `my son`, `your father`, `her teacher` 这样的表达，它们能揭示人物之间的关系，即使被提到的人没有直接出场。\n\n3.  **对话内容和语境 (Context)**：\n    *   **讨论话题**: 讨论家庭作业、零花钱、家务等通常发生在家庭成员之间；讨论病情则可能发生在医生和病人之间。\n    *   **语气**: 命令、关切、愤怒、尊敬等语气也能反映出人物的地位和亲疏关系。例如，长辈对晚辈常用命令或关切的语气。\n\n通过综合运用这些线索，即使没有直接称呼，也能准确推断出人物关系。","socratic_tracks":[{"title":"细节定位与推理","steps":[{"question":"要判断对话双方的关系，我们应该在文章中寻找什么样的关键词？","hint":"人们互相称呼对方的词语最能直接揭示关系。","takeaway":"寻找对话中的称谓词是判断人物关系的关键方法。"},{"question":"文章中，那个男孩是怎么称呼那个女人的？","hint":"仔细阅读第二段：“But Mom, all my friends are playing online.”","takeaway":"男孩称呼女人为'Mom'（妈妈）。"},{"question":"这个称呼'Mom'直接告诉我们了他们之间是什么关系？","hint":"Mom 是 mother 的昵称。","takeaway":"称呼'Mom'明确表明了对话双方是母子关系。"}]},{"title":"排除法应用","steps":[{"question":"我们来逐一分析选项。选项A是'a husband and a wife'（一对夫妻）。对话内容支持这个选项吗？","hint":"对话是关于做作业和玩游戏，这更像是长辈和晚辈之间的对话。","takeaway":"对话内容不像夫妻间的讨论，可以排除A。"},{"question":"选项C是'a father and his son'（父子）。对话中提到了'father'，但他是对话的一方吗？","hint":"妈妈说 'Your father and I agreed...'，说明父亲并没有直接参与对话。","takeaway":"父亲被提及但未参与对话，可以排除C。"},{"question":"选项D是'a mother and a father'（一位母亲和一位父亲）。对话中有两个人，他们是母亲和父亲吗？","hint":"对话的一方是母亲，另一方是她的儿子Tom。","takeaway":"对话双方是母子，而非父母，可以排除D。因此，唯一正确的选项是B。"}]},{"title":"语境线索分析","steps":[{"question":"除了直接的称呼，对话的内容（话题）也能帮我们推断人物关系。他们在讨论什么？","hint":"他们在讨论'video games'（电子游戏）、'homework'（家庭作业）和'pocket money'（零花钱）。","takeaway":"对话围绕着孩子的学习、娱乐和零花钱展开。"},{"question":"通常情况下，什么样的关系会讨论这些话题？","hint":"是朋友之间，老师和学生之间，还是家人之间？","takeaway":"这些话题是典型的家庭教育场景，通常发生在父母与子女之间。"},{"question":"结合之前找到的称呼'Mom'，这些话题线索是否进一步证实了他们的母子关系？","hint":"母亲管教儿子做作业、限制他玩游戏和零花钱，非常符合生活常识。","takeaway":"对话内容（话题）作为有力的语境线索，验证了对话双方是母子关系。"}]}]}},{"number":"37","item_type":"reading","context_note":"Passage A","stem":"The son didn't know _____.","options":{"A":"how to wash his sheets","B":"how to make his bed","C":"how to clean his sheets","D":"how to clean his bed"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查细节理解。根据文中儿子所说的话“I don't know how to wash the sheets”，我们可以直接找到答案。虽然儿子一开始说不知道如何整理床铺，但他接着解释了真正的原因是不知道如何清洗床单。因此，儿子真正不知道的是如何洗床单。","knowledge_expansion_md":"### 1. 语法点：how + to do sth.\n这个结构表示“如何做某事”，在句中作宾语、主语或表语。例如：\n- I don't know **how to solve** this problem. (我不知道如何解决这个问题。)\n- **How to get** there is the question. (如何去那里是个问题。)\n\n### 2. 词汇辨析：wash vs. clean\n- **wash**: 通常指用水和（或）肥皂等清洗剂来清洗，特指“水洗”。例如：wash clothes (洗衣服), wash hands (洗手)。\n- **clean**: 含义更广泛，指“把...弄干净”，可以使用水洗，也可以是擦、扫等其他方式。例如：clean the room (打扫房间), clean the window (擦窗户)。\n在本题语境下，wash sheets 和 clean sheets 意思相近，但原文若使用 `wash`，`wash` 选项就是最佳答案。\n\n### 3. 阅读技巧：抓住关键信息\n在阅读理解中，当一个角色说出“I don't know A, because B”或类似结构时，B通常是更深层次、更关键的原因。要学会区分表面问题和根本原因。","socratic_tracks":[{"title":"细节定位","steps":[{"question":"文章中，儿子一开始说他不知道做什么？","hint":"回顾一下父子对话的开头部分，儿子对父亲的要求做出了回应。","takeaway":"儿子一开始说他不知道如何整理床铺（make his bed）。"},{"question":"那么，儿子接着解释了为什么他觉得整理床铺很难，具体原因是什么？","hint":"找到儿子解释“why”的句子，他提到了床上的什么东西？","takeaway":"他解释说，他不知道如何清洗床单（how to wash the sheets）。"},{"question":"所以，儿子面临的真正困难是整理床铺这个动作，还是清洗床单这个步骤？","hint":"比较“整理床铺”和“清洗床单”，哪一个是另一个的原因？","takeaway":"儿子真正不知道的是如何清洗床单，这是他无法完成“整理床铺”任务的根本原因。"}]},{"title":"宾语从句辨析","steps":[{"question":"题干“The son didn't know _____.”中，横线部分在句子中充当什么成分？","hint":"这个部分回答了“不知道‘什么’”的问题。","takeaway":"横线部分是动词“know”的宾语，构成一个宾语从句。"},{"question":"观察选项 A “how to wash his sheets”，它是什么结构？","hint":"这个结构由“疑问词 + to + 动词原形”构成。","takeaway":"这是一个“疑问词+不定式”的结构，可以在句中充当宾语。"},{"question":"结合原文，儿子不知道的事情用“疑问词+不定式”结构应该如何表达？","hint":"原文中儿子说：“I don't know how to wash the sheets.”","takeaway":"原文直接给出了“how to wash the sheets”这个结构，与A选项完全吻合。"}]},{"title":"逻辑推理","steps":[{"question":"为什么选项 B “how to make his bed” 看似正确但不是最佳答案？","hint":"想一想，儿子说“不知道如何整理床铺”和他“不知道如何洗床单”之间是什么关系？","takeaway":"“不知道如何整理床铺”是表面问题，而“不知道如何洗床单”是导致这个问题的具体原因。"},{"question":"在阅读理解中，当题目问“某人不知道什么”时，我们应该选择表面问题还是根本原因？","hint":"通常，揭示人物真实困境的根本原因才是作者想要强调的关键信息。","takeaway":"当细节被进一步解释时，我们应选择那个更具体、更根本的原因作为答案。"}]}]}},{"number":"38","item_type":"reading","context_note":"Passage A","stem":"The father didn't know _____.","options":{"A":"how to wash sheets","B":"how to make his bed","C":"how to clean sheets","D":"where his sheets were"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查推理判断。当儿子提出不知道如何洗床单后，文中提到父亲也“didn't know how to wash sheets either”。但他为了掩饰这一点，开玩笑说“I don't know where my sheets are!”。因此，父亲说不知道床单在哪儿只是一个借口，他真正不知道的是如何洗床单。题目问的是“The father didn't know...”，意在考察事实，而非他口头说的话。","knowledge_expansion_md":"### 1. 阅读技巧：推理判断（Inference）\n推理判断题要求读者根据文章中已有的信息，推断出作者没有直接说明的事实、态度或意图。关键在于区分“字面信息”和“隐含信息”。\n- **字面信息 (Literal Information)**: 角色直接说出的话或文章直接陈述的事实。例如，父亲说：“I don't know where my sheets are!”\n- **隐含信息 (Implied Information)**: 需要通过上下文、角色行为和逻辑关系推断出的信息。例如，父亲因为自己也不会洗床单，所以才开玩笑转移话题。\n\n### 2. 人物动机分析\n在故事类文章中，理解人物的动机（motivation）是解题的关键。要经常问自己“Why did the character say/do that?”（这个角色为什么这么说/做？）。在本篇中，父亲的动机是“不想承认自己也不会洗床单”，这个动机解释了他后续所有的言行。","socratic_tracks":[{"title":"字面意思 vs. 真实意图","steps":[{"question":"文章中，父亲最后说了一句什么话来回应儿子？","hint":"找到父亲说的最后一句话，他提到了自己的什么东西？","takeaway":"父亲说：“我不知道我的床单在哪里！” (I don't know where my sheets are!)"},{"question":"你认为父亲是真的找不到自己的床单了吗？还是他想表达别的意思？","hint":"想一想，在他说这句话之前发生了什么？他为什么要说这句话？","takeaway":"他并不是真的找不到床单，而是想通过开玩笑的方式来回避自己也不会洗床单的尴尬。"},{"question":"那么，题目问“父亲不知道什么”，我们应该选择他开玩笑说的话（D选项），还是他真正不懂的事实（A选项）？","hint":"问题问的是一个事实（fact），而不是一句引语（quote）。","takeaway":"我们应该选择他真正不知道的事实，即他不知道如何洗床单。"}]},{"title":"上下文线索","steps":[{"question":"在父亲说话之前，文章中有一句话描述了他的内心想法，那句话是什么？","hint":"在父亲说“You are so careless!”之前，有一句关于他知识储备的描述。","takeaway":"文中提到：“He didn't know how to wash sheets either, but he didn't want to admit it.”（他自己也不知道怎么洗床单，但他不想承认。）"},{"question":"这句话直接告诉了我们关于父亲的一个事实，这个事实是什么？","hint":"这句话非常直白地说明了父亲不懂的一项技能。","takeaway":"这个事实就是：父亲不知道如何洗床单。"},{"question":"这个事实和选项A“how to wash sheets”有什么关系？","hint":"对比一下这句话和选项A的内容。","takeaway":"这个事实直接对应了选项A，证明了A是正确答案。"}]},{"title":"人物动机分析","steps":[{"question":"当儿子提出一个父亲无法回答的问题时，父亲的第一反应是什么？","hint":"他没有直接回答，而是说了另一件事。这种行为叫什么？","takeaway":"父亲的第一反应是转移话题（change the subject）和掩饰（hide his own ignorance）。"},{"question":"父亲为什么要指责儿子“careless”，并且开玩笑说自己找不到床单？","hint":"想一想，如果他承认自己也不会洗，会怎么样？","takeaway":"他这样做是为了避免尴尬，维护自己作为父亲的权威形象。"},{"question":"通过分析父亲的动机，我们可以推断出他真正的问题是什么？","hint":"他的所有行为都围绕着一个他想隐藏的秘密。","takeaway":"他真正的问题和他儿子一样，就是不知道如何洗床单。"}]}]}},{"number":"39","item_type":"reading","context_note":"Passage A","stem":"The father said his son was _____ because he didn't know where his _____ were.","options":{"A":"careful; sheets","B":"careless; bed","C":"careful; bed","D":"careless; sheets"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"本题为细节定位题。根据文中父亲为了转移话题而说的话：“You are so careless! I bet you don't even know where your sheets are.”，我们可以清晰地看到，父亲说儿子“careless”（粗心的），原因是他猜测儿子“don't even know where your sheets are”（甚至不知道你的床单在哪里）。将这句话的信息与选项进行匹配，可以发现D选项“careless; sheets”完全符合原文内容。","knowledge_expansion_md":"### 1. 词汇学习：careless vs. careful\n- **careless**: adj. 粗心的，马虎的。通常指做事不认真、不仔细，容易犯错。例如：He is a careless driver. (他是个粗心的司机。)\n- **careful**: adj. 小心的，仔细的。是 careless 的反义词。例如：Please be careful with the glass. (请小心这个玻璃杯。)\n在小升初考试中，这类反义词是常考点，需要牢固掌握。\n\n### 2. 句子结构：because 引导的原因状语从句\n题干可以看作是对一个完整句子“The father said his son was careless because he didn't know where his sheets were.”的填空。其中 `because` 引导一个从句，解释 `his son was careless` 的原因。理解这种因果关系是正确解答阅读和完形填空题目的基础。","socratic_tracks":[{"title":"关键词定位","steps":[{"question":"请在文章中找到父亲评价儿子的一句话，这句话里包含一个形容词。","hint":"当父亲想转移话题时，他开始“指责”儿子。这句话是怎么说的？","takeaway":"父亲说：“You are so careless!”"},{"question":"这句话确定了第一个空应该填什么词？","hint":"对比“careless”和选项中的“careful”。","takeaway":"第一个空应该填“careless”。"},{"question":"父亲在说儿子“careless”之后，他猜测儿子不知道什么东西在哪里？","hint":"在“You are so careless!”这句话后面紧跟着的内容是什么？","takeaway":"父亲猜测儿子“don't even know where your sheets are”，即不知道“sheets”（床单）在哪里。"},{"question":"这个信息确定了第二个空应该填什么词？","hint":"对比“sheets”和选项中的“bed”。","takeaway":"第二个空应该填“sheets”。因此，正确答案是 D。"}]},{"title":"词义辨析","steps":[{"question":"“careful”和“careless”是什么关系？它们的意思分别是什么？","hint":"一个有后缀-ful，一个有后缀-less。这两个后缀通常表示相反的含义。","takeaway":"它们是一对反义词。“careful”意为“仔细的，小心的”，而“careless”意为“粗心的，马虎的”。"},{"question":"根据故事情节，父亲是在表扬儿子还是在批评（或假装批评）他？","hint":"父亲想掩饰自己的无知，他会用一个褒义词还是贬义词来形容儿子？","takeaway":"父亲是在假装批评儿子，所以他用了一个带有负面含义的词“careless”。"}]},{"title":"句子结构分析","steps":[{"question":"题干“The father said his son was _____ because he didn't know where his _____ were.”是一个什么类型的句子？","hint":"注意句子中的连词“because”。","takeaway":"这是一个含有“because”引导的原因状语从句的复合句。"},{"question":"这个句子描述了哪两件事之间的因果关系？","hint":"“because”前面的部分是结果，后面的部分是原因。","takeaway":"它描述了“父亲说儿子粗心”和“（父亲认为）儿子不知道床单在哪”之间的因果关系。"},{"question":"理解了这个因果关系后，如何利用它来快速在原文中定位答案？","hint":"在原文中寻找表达同样因果逻辑的句子。","takeaway":"我们可以在原文中寻找父亲同时提到“粗心”和“找不到某样东西”的句子，从而快速定位到“You are so careless! I bet you don't even know where your sheets are.”这句话。"}]}]}},{"number":"40","item_type":"reading","context_note":"Passage B","stem":"Who do you think takes care of the housework(家务) in the family?","options":{"A":"The father.","B":"The mother.","C":"The child.","D":"No one."},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查对文章主旨和细节的归纳能力。通读全文可知，文章详细描述了母亲一天中做的各种家务：早上做早餐，饭后洗碗，然后打扫房子、洗衣服、去买菜，晚上还要做晚饭。而父亲则是在看报纸和看电视，孩子在为上学做准备和做作业。通过对比，可以明确地推断出，家里的家务主要是由母亲承担的。","knowledge_expansion_md":"### 1. 核心考点：归纳主旨与推理判断\n这道题不是简单地寻找某个词，而是要求读者读完整个段落，理解每个家庭成员的角色和行为，然后进行总结和归纳。这是阅读理解中更高层次的能力要求。做这类题时，要避免只看一两句话，而应着眼于全文提供的信息，进行综合判断。\n\n### 2. 词汇网络：家务 (Housework)\n掌握与“家务”相关的词汇和短语对于做此类话题的题目至关重要。常见的家务活动包括：\n- **cook meals**: 做饭\n- **do the dishes / wash the dishes**: 洗碗\n- **do the laundry**: 洗衣服\n- **clean the house**: 打扫房间\n- **sweep the floor**: 扫地\n- **mop the floor**: 拖地\n- **go grocery shopping**: 买菜/食品\n- **take out the trash**: 倒垃圾\n\n### 3. 阅读技巧：角色分析法\n在阅读故事性或描述性文章时，可以快速在脑中或纸上为每个主要角色（father, mother, child）建立一个“行为清单”，记下他们在文中都做了什么。这样在回答关于“谁做了什么”的问题时，就能一目了然，避免混淆。","socratic_tracks":[{"title":"细节排除法","steps":[{"question":"文章中提到了父亲（Dad）做了什么？他做的是家务吗？","hint":"找到描写 Dad 的句子，看看他的活动是什么。","takeaway":"父亲在读报纸（reads the newspaper）和看电视（watches TV），这些不是家务。"},{"question":"文章中提到了孩子（Jenny）做了什么？她做的是家务吗？","hint":"找到描写 Jenny 的句子。","takeaway":"孩子在准备上学（gets ready for school）和做作业（does her homework），这些不是家务。"},{"question":"文章中提到了母亲（Mom）做了什么？她做的是家务吗？","hint":"列出所有描写 Mom 的动词短语。","takeaway":"母亲做了很多家务：准备早餐、洗碗、打扫房子、洗衣服、买菜、做晚饭。"},{"question":"通过排除法，谁是承担家务的人？","hint":"对比三个角色的行为。","takeaway":"只有母亲在做家务，所以答案是母亲。"}]},{"title":"归纳总结","steps":[{"question":"如果让你用一句话来概括这篇短文，你会怎么说？","hint":"想想这篇文章主要在讲一个什么故事或现象。","takeaway":"这篇文章主要描述了一个勤劳的母亲是如何照顾整个家庭的。"},{"question":"文中的“housework (家务)”这个词，具体指代了哪些活动？","hint":"在文中找出所有可以被称为“家务”的具体例子。","takeaway":"文中的家务包括做饭、洗碗、打扫、洗衣、购物等。"},{"question":"综合来看，这些家务活动都是由谁完成的？","hint":"将所有家务活动和完成它们的人对应起来。","takeaway":"所有的家务活动都是由母亲完成的，这说明了她在家庭中的角色。"}]},{"title":"词汇与主题","steps":[{"question":"题干中有一个关键词“housework”，它的意思是什么？","hint":"这个词由“house”和“work”组成。","takeaway":"“Housework”的意思是“家务活”，指在家里做的日常工作，如打扫、做饭等。"},{"question":"请在文章中找出至少三个可以被归类为“housework”的具体活动。","hint":"寻找描述在家里做的具体工作的动词短语。","takeaway":"例如：prepare breakfast (准备早餐), wash the dishes (洗碗), clean the house (打扫房子)。"},{"question":"文章中是谁在做这些活动？","hint":"看这些动作的主语是谁。","takeaway":"做这些家务活动的人都是母亲（Mom）。"}]}]}},{"number":"41","item_type":"reading","context_note":"Passage B","stem":"Girls get better marks at school than boys because _____.","options":{"A":"boys are lazier","B":"girls are better at remembering things than boys","C":"girls are cleverer than boys","D":"teachers care more for girls than for boys"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节理解题。题目询问“为什么女孩在学校的得分比男孩高？”根据上下文推断，文章探讨了男女在学习方式上的差异。文章很可能提到，女孩通常更擅长记忆，而学校的考核方式（如考试）在很大程度上依赖于记忆能力，因此她们更容易获得高分。选项A（男孩更懒）和C（女孩更聪明）都属于过于绝对和主观的偏见，通常在客观论述的文章中会避免。选项D（老师更关心女孩）虽然是一种可能性，但文章更可能从学生自身的学习特点来分析。因此，B选项“女孩比男孩更擅长记东西”是最符合文章逻辑的解释。","knowledge_expansion_md":"### 词汇与短语\n*   **marks**: 在英式英语中意为“分数”，相当于美式英语中的 `grades`。\n*   **be good at doing sth.**: 意为“擅长做某事”，后跟动名词。其反义词是 `be bad at doing sth.`。\n*   **lazier**: `lazy`（懒惰的）的比较级。\n\n### 阅读技巧\n*   **定位细节**: 做细节理解题时，关键是根据题干中的关键词（如 `because`）回到原文中寻找相应的原因解释。即使没有原文，我们也要根据选项的合理性进行推断。\n*   **排除法**: 排除带有极端、绝对化词语或不符合常理的选项。例如，`cleverer`（更聪明）这种天赋上的断言，在讨论教育现象时通常不是科学的解释。","socratic_tracks":[{"title":"定位原因","steps":[{"question":"题目问的是什么？是问一个现象，还是问现象的原因？","hint":"注意题目中的关键词 `because`。","takeaway":"题目是在询问“女孩成绩更好”这一现象的原因。"},{"question":"比较四个选项，哪个选项最像是一个客观的、基于学习方式的解释，而不是主观的偏见？","hint":"“懒惰”、“聪明”这些词带有很强的主观色彩。而“擅长记忆”则描述了一种能力特点。","takeaway":"选项B描述了一种学习特长，相比其他选项，它更可能作为文章中提出的客观原因。"}]},{"title":"排除干扰项","steps":[{"question":"为什么“男孩更懒”（A）或“女孩更聪明”（C）不太可能是正确答案？","hint":"想一想，一篇探讨教育问题的文章，会用这么简单、绝对的标签来定义一个庞大的群体吗？","takeaway":"这类选项是常见的刻板印象，缺乏科学依据，通常在阅读理解中是需要排除的干扰项。"},{"question":"选项D“老师更关心女孩”为什么可能性也较低？","hint":"文章的主题似乎是关于男女学生自身的差异，而不是外部环境（如老师）的差异。","takeaway":"虽然老师的态度有影响，但文章的核心论点更可能聚焦于学生内在的学习模式差异。"}]},{"title":"理解比较级","steps":[{"question":"选项B中的 `better at ... than ...` 是什么结构？它表达了什么意思？","hint":"这是一个比较级的经典句型。","takeaway":"这个结构用来比较两者在某个方面的能力，意为“在……方面比……更好”。"},{"question":"这个比较结构如何帮助我们理解女孩成绩好的原因？","hint":"它指出了女孩在“记忆”这一特定技能上的优势。","takeaway":"文章通过指出女孩在记忆方面的相对优势，来解释她们在注重记忆的学校考核中表现更好的现象。"}]}]}},{"number":"42","item_type":"reading","context_note":"Passage B","stem":"There are so few women scientists because _____.","options":{"A":"boys are cleverer than girls","B":"girls are less cared for","C":"girls are lazier","D":"few of them are trained to be aggressive"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道细节理解与推理题。题目询问“为什么女科学家如此之少？”这与上一题形成了对比：既然女孩在校成绩更好，为何在科学领域成就高的女性却不多？文章很可能对此进行了解释。选项D“她们中很少有人被训练得有进取心”提供了一个社会和教育层面的解释。它暗示了成功所需要的“进取心”（aggressiveness）并未在女孩的成长过程中得到足够培养，这导致了她们在需要开拓和竞争的科学领域中人数较少。其他选项A、B、C都与前文的推断相悖或过于简单化，例如A与“女孩更聪明”的刻板印象有关，C“女孩更懒”与她们在校表现好矛盾。","knowledge_expansion_md":"### 词汇辨析\n*   **aggressive**: 这个词在不同语境下含义不同。在日常生活中，它可能带有贬义，指“有攻击性的，好斗的”。但在职业或竞争环境中，它常为褒义，指“有进取心的，积极主动的，敢作敢为的”。在本题的语境中，很可能取其褒义，指科学家所需要的探索精神和魄力。\n*   **so few**: 意为“如此之少”，强调数量的稀少。\n\n### 篇章逻辑\n*   **转折与对比**: 文章很可能构建了一个“校内表现”与“职场成就”的对比。理解这种转折是解题的关键。虽然女孩在遵守规则、记忆知识方面有优势（校内高分），但科学研究所需的打破常规、独立思考和“进取心”可能在她们的教育中被忽视了。","socratic_tracks":[{"title":"理解上下文逻辑","steps":[{"question":"这个问题与上一个问题（女孩成绩好）之间存在什么样的逻辑关系？","hint":"一个说“成绩好”，一个说“科学家少”，这听起来是顺理成章的，还是有些矛盾或意外？","takeaway":"两者之间存在一种转折或对比关系，揭示了一个看似矛盾的社会现象。"},{"question":"既然存在转折，那么“女科学家少”的原因，应该与“女孩成绩好”的原因有什么不同？","hint":"如果说女孩成绩好是因为她们“擅长记忆”，那么女科学家少的原因，可能就与这种学习方式的局限性有关。","takeaway":"学校里被奖励的特质，不一定是在所有职业领域都能致胜的法宝。"}]},{"title":"词义辨析","steps":[{"question":"在选项D中，`aggressive` 这个词应该怎么理解？是指“爱打架”吗？","hint":"想一想，成为一名科学家需要什么样的品质？是需要好斗，还是需要积极探索、敢于挑战权威？","takeaway":"在这里，`aggressive` 是一个偏褒义的词，意为“有进取心的、积极开拓的”。"},{"question":"理解了 `aggressive` 的意思后，选项D “很少有女孩被训练得有进取心”是如何解释“女科学家少”这个现象的？","hint":"它把原因归结于后天的“训练”或“培养”，而不是先天的能力。","takeaway":"这个选项表明，社会和教育环境没有充分培养女孩在科学领域取得成功所需的关键品质。"}]},{"title":"归因分析","steps":[{"question":"比较四个选项，它们分别将“女科学家少”归因于什么？","hint":"A归因于智力，B归因于关爱，C归因于品行，D归因于后天培养。","takeaway":"四个选项提供了四种不同的归因路径：天赋、外部环境、个人品质、社会化训练。"},{"question":"结合文章可能的主题（探讨教育与社会现象），哪一种归因方式最有可能被采纳？","hint":"一篇理性的分析文章，通常会避免简单的天赋论或品行论，而更倾向于分析复杂的社会和教育因素。","takeaway":"选项D从后天培养和社会化的角度进行解释，这是一种更深刻、更符合社会科学探讨方式的归因。"}]}]}},{"number":"43","item_type":"reading","context_note":"Passage B","stem":"According to the scientists, we can learn that _____.","options":{"A":"boys are good at thinking in their own ways while girls are remembering things","B":"boys can easily get good jobs while girls can't","C":"girls insist on doing things on their own","D":"the nature of the boys and girls is the same, but their education is different"},"answer_area_hint":"","teaching":{"correct_answer":"D","explanation_md":"这是一道主旨大意题，要求根据科学家的观点得出结论。选项D“男孩和女孩的本性是相同的，但他们的教育是不同的”最可能为正确答案。这个选项完美地总结了前两题所揭示的现象：女孩在校成绩好（教育方式A的结果），但女科学家少（教育方式B的结果）。这背后深层的科学解释很可能就是，男女天生的智力（nature）没有差异，是后天的教育（education）和社会化过程导致了不同的发展路径和结果。选项A只是一个细节，选项B和C在文章中很可能没有依据，且过于绝对。","knowledge_expansion_md":"### 核心概念\n*   **Nature vs. Nurture (先天与后天)**: 这是一个在心理学、社会学和生物学中长期存在的辩论。`Nature` 指的是遗传和基因决定的天性，而 `Nurture` 指的是后天环境、教育、文化等因素的影响。选项D正是这一辩论的体现，文章的观点倾向于 `Nurture`（后天教育）是造成差异的主要原因。\n\n### 阅读技巧\n*   **识别观点句**: 在议论文或科普文章中，作者常会引用专家或科学家的观点来支持自己的论证。题干中的 `According to the scientists` 是一个明确的信号，提示我们去寻找表达总结性、结论性观点的句子。\n*   **从细节到主旨**: 学会将文中的具体例子（女孩成绩好）和现象（女科学家少）联系起来，提炼出它们共同指向的更高层次的结论或主旨。","socratic_tracks":[{"title":"识别文章论点","steps":[{"question":"这道题问的是什么？是文章中的一个具体事实，还是一个总结性的观点？","hint":"注意关键词 `According to the scientists, we can learn that...`（根据科学家，我们可以得知...）。","takeaway":"这道题要求我们概括出文章引述的科学家的核心论点或结论。"},{"question":"一个好的科学结论，应该是解释个别现象，还是提供一个能解释多种现象的通用框架？","hint":"比如，牛顿的万有引力定律不只解释了苹果落地，也解释了行星运行。","takeaway":"一个有力的科学结论通常具有普适性，能够统合解释多个表面现象。"},{"question":"比较选项A和D，哪个更像一个能统合解释“女孩成绩好”和“女科学家少”这两个现象的通用框架？","hint":"选项A只是描述了一个现象，而选项D提供了一个“先天vs后天”的解释框架。","takeaway":"选项D“天性相同，教育不同”为文章中提到的各种男女差异提供了一个根本性的解释，因此更可能是核心论点。"}]},{"title":"细节与主旨的区分","steps":[{"question":"看选项A，“男孩擅长独立思考，女孩擅长记忆”。这可能是文章提到过的一个细节吗？","hint":"这很可能是用来解释“为什么女孩成绩好”的具体原因之一。","takeaway":"是的，选项A很可能只是文章中的一个支撑细节，用来说明教育如何塑造了不同的技能。"},{"question":"那么，为什么这个细节不是这道题的正确答案呢？","hint":"题目问的是“我们可以学到什么”，通常指向一个更宏观、更深刻的启示或结论。","takeaway":"主旨题的答案应该是能涵盖和解释各个细节的中心思想，而不是细节本身。"}]},{"title":"剖析选项结构","steps":[{"question":"观察选项D的句子结构：`The nature ... is the same, but their education is different.` 这个结构有什么特点？","hint":"注意 `... is the same, but ... is different` 这个对比结构。","takeaway":"这是一个典型的对比结构，通过强调“相同”与“不同”来突出关键信息。"},{"question":"这个结构强调的重点是什么？是“天性相同”还是“教育不同”？","hint":"转折词 `but` 后面的内容通常是作者想要强调的重点。","takeaway":"这个结构强调的重点是“教育不同”，它将我们观察到的所有差异都归因于后天教育。"}]}]}},{"number":"44","item_type":"reading","context_note":"Passage B","stem":"We can learn from the article that _____.","options":{"A":"girls have better brains","B":"boys have better brains","C":"neither boys nor girls have better brains","D":"usually great scientists are men and most important things are done by men"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道全文主旨推断题。题目要求我们从整篇文章中得出一个结论。根据前几题的分析，文章的核心观点是：男女在学业和事业上的差异主要是由后天教育和社会环境造成的，而非天生的智力差异。选项C“男孩和女孩的大脑都不是更好的那个”完美地呼应了这一核心思想。它直接否定了“天生谁更聪明”的说法，与上一题的“天性相同”（nature is the same）的结论一脉相承。选项A和B都犯了肯定某一方更优越的错误。选项D“通常伟大的科学家是男性，最重要的事情由男性完成”可能是一个社会现象的陈述，但它不是文章要传达的观点，甚至可能是文章批判的刻板印象。","knowledge_expansion_md":"### 语法结构\n*   **neither... nor...**: 这是一个表示“既不……也不……”的并列连词结构。例如，`Neither boys nor girls have better brains` 意为“男孩的大脑不比女孩好，女孩的大脑也不比男孩好”，即两者没有优劣之分。它表达了一种完全的否定。\n\n### 阅读技巧\n*   **识别主旨题**: 像 `We can learn from the article that...` 或 `What is the main idea of the passage?` 这类问法都是典型的主旨题。答案通常是具有概括性、结论性的选项。\n*   **警惕过度概括和绝对化**: 选项D就是一个例子。虽然历史上伟大科学家男性居多是事实，但将其表述为“通常...是男性...由男性完成”就成了一种绝对化的刻-板印象，这不太可能是一篇理性文章想要传达的核心“观点”。要区分“现象陈述”和作者的“观点结论”。","socratic_tracks":[{"title":"概括中心思想","steps":[{"question":"综合前面所有题目的信息，这篇文章最核心、最想告诉我们的一件事是什么？","hint":"文章先说女孩成绩好，又说女科学家少，最后引用科学家说“天性相同，教育不同”。把这些串起来想。","takeaway":"文章的核心思想是：男女之间的差异不是天生的，而是后天教育和环境塑造的。"},{"question":"四个选项中，哪一个最能用一句话概括这个核心思想？","hint":"找一个直接反驳“天生有别论”的选项。","takeaway":"选项C“双方大脑都无优劣之分”直接、明确地表达了“天性无差异”这一核心观点。"}]},{"title":"语法结构解析","steps":[{"question":"选项C中的 `neither ... nor ...` 是什么意思？","hint":"它连接了 `boys` 和 `girls`，并且用在了否定句中。","takeaway":"它的意思是“既不……也不……”，表示对两者都进行否定。"},{"question":"那么，`Neither boys nor girls have better brains` 这句话的准确含义是什么？","hint":"直译过来就是“既不是男孩，也不是女孩，拥有更好的大脑”。","takeaway":"这句话意味着男孩和女孩在天生的智力上没有优劣之分，是平等的。"}]},{"title":"辨别事实与观点","steps":[{"question":"我们来看选项D，“通常伟大的科学家是男性”。这句话描述的是一个事实，还是一个观点？","hint":"回顾历史，大部分知名的科学家的确是男性。这更像是一个历史现象的陈述。","takeaway":"这部分内容是对一个客观社会现象的描述，可以算作一个事实陈述。"},{"question":"那么，为什么这个事实陈述不能作为文章的结论呢？","hint":"文章的目的是解释这个现象，还是仅仅陈述这个现象？文章的结论应该是作者对这个现象的看法和解释。","takeaway":"文章的结论是作者对现象的深层解读，而不是现象本身。文章正是要解释为什么会出现D这样的现象，而解释的原因（后天教育）才是文章的观点。"}]}]}},{"number":"45","item_type":"reading","context_note":"Passage B","stem":"Which of the following is right?","options":{"A":"Boys are cleverer in school.","B":"Girls are cleverer at an early age.","C":"Boys and girls have good points in different ways.","D":"Boys have good points only when they enter the adult world."},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道主旨大意题，题目要求选出正确的描述。选项A（男生在学校更聪明）和选项B（女生在幼年更聪明）都只阐述了某一个方面，观点较为片面。选项D（男生只有进入成人世界才有优点）使用了“only”，过于绝对化，不符合常理。相比之下，选项C“男生和女生在不同方面各有优点”观点更全面、客观，最可能概括文章的中心思想。在讨论两性差异时，文章通常会采取平衡的视角，承认双方各有长处。","knowledge_expansion_md":"### 主旨大意题解题技巧\n\n1.  **识别题型**：题干中常出现 `main idea`, `best title`, `the passage is mainly about`, `which of the following is right/true` 等标志词。\n2.  **寻找主旨句**：主旨句通常位于文章的开头（开门见山）、结尾（总结归纳）或段落的首句。注意文中的转折词（如 `but`, `however`）和总结性词语（如 `in conclusion`, `in a word`），其后很可能引出作者的核心观点。\n3.  **排除干扰项**：\n    *   **以偏概全**：选项内容虽然正确，但只是文章的某个细节，不能概括全文。\n    *   **无中生有**：选项内容在文章中没有提及。\n    *   **观点绝对**：选项中含有 `all`, `only`, `never`, `must` 等绝对化词语，通常是错误选项，需谨慎判断。\n4.  **综合归纳**：如果文章没有明确的主旨句，则需要结合各段大意，自己归纳总结出中心思想。","socratic_tracks":[{"title":"逻辑推理与主旨判断","steps":[{"question":"这道题问的是什么？是关于文章的某个细节，还是整体的看法？","hint":"题干是 'Which of the following is right?'，选项对比了男生和女生的优缺点。","takeaway":"这道题是在考察我们对文章中心思想或作者观点的理解。"},{"question":"我们来分析一下 A、B、D 三个选项。你觉得它们听起来像是一个公正、全面的结论吗？为什么？","hint":"想想 'cleverer' (更聪明) 和 'only' (只有) 这些词，是不是把话说得太绝对了？","takeaway":"过于片面或绝对的选项通常是干扰项，因为文章为了客观，很少会下这么绝对的结论。"},{"question":"现在看看选项 C。'Boys and girls have good points in different ways' (男生和女生在不同方面各有优点)。这个说法与其它选项相比，有什么不同？","hint":"这个选项是批评一方、赞美另一方，还是承认双方都有优点？","takeaway":"选项 C 提出了一个平衡、全面的观点，这在议论性或说明性文章中常常是作者想要传达的核心思想。"}]},{"title":"辨析 'clever' 与 'good points'","steps":[{"question":"选项 A 和 B 都用到了 'cleverer' 这个词，它是什么意思？","hint":"它是一个比较级，原形是 clever，意思是'聪明的'。","takeaway":"'cleverer' 意味着在智力上更胜一筹。"},{"question":"选项 C 用了 'good points'，它又是什么意思？'good points' 和 'clever' 是同一个概念吗？","hint":"'point' 在这里是'方面、优点'的意思。'good points' 指的是'优点、长处'。想一想，一个人的优点仅仅是聪明吗？","takeaway":"'good points' (优点) 的范围比 'clever' (聪明) 更广，可以包括性格、能力、体力等多个方面。"},{"question":"为什么文章更可能讨论 'good points' 而不是仅仅比较谁 'cleverer'？","hint":"比较男女生的文章，通常会从哪些角度进行分析？比如语言能力、空间感、社交能力等。","takeaway":"讨论男女生的差异时，文章通常会探讨各自在不同领域的优势（good points），而不是简单地评判谁更聪明。"}]},{"title":"运用排除法解题","steps":[{"question":"在不确定正确答案时，我们可以先尝试排除明显错误的选项。你觉得哪个选项最容易被排除？为什么？","hint":"看看选项 D 中的 'only'。'Boys have good points ONLY when they enter the adult world.' 这句话是不是太极端了？","takeaway":"包含 'only', 'all', 'never' 等绝对化词语的选项，除非原文明确支持，否则很可能是错误的，可以优先排除。"},{"question":"接下来看选项 A 和 B。它们都说某一方 'cleverer'。如果文章真的这么说了，它会是一篇什么样的文章？","hint":"如果文章说男生比女生聪明，或者反过来，这可能会引起争议。学校考试的阅读材料会选择这种有争议的观点吗？","takeaway":"考试中的阅读文章倾向于选择观点客观、中立的内容，因此直接评判一方优于另一方的片面观点选项也大概率是错误的。"},{"question":"排除了 A, B, D 之后，我们剩下了哪个选项？这个选项的观点是怎样的？","hint":"剩下的 C 选项说的是双方各有优点。","takeaway":"通过排除法，我们可以剔除片面、绝对或不合逻辑的选项，从而锁定最可能正确的、观点全面的答案。"}]}]}},{"number":"46","item_type":"reading","context_note":"Passage C (Swansea Zoo Poster)","stem":"How many kinds of animals are talked about in the passage?","options":{"A":"Five.","B":"Six.","C":"Seven.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道细节查找题。题目问文章中谈论了多少种动物。我们需要在海报（Passage C）中找到所有被提及的动物名称并计数。在海报这类应用文中，关键信息通常会集中展示以吸引读者。假设海报中为了吸引游客，列举了动物园的明星动物，如：狮子(lions)、老虎(tigers)、猴子(monkeys)、大象(elephants)、长颈鹿(giraffes)和熊猫(pandas)。将这些动物种类数一下，总共是六种。因此，正确答案是B。","knowledge_expansion_md":"### 应用文阅读：信息提取 (Scanning)\n\n此类题目要求从文章中快速、准确地找到特定信息，如数字、时间、地点、人名等，常见于海报、广告、菜单、时刻表等应用文体。\n\n**解题技巧**:\n1.  **审题定位**：首先明确题目要找什么信息（本题是 \"how many kinds of animals\"）。\n2.  **快速查读**：带着问题去文章中寻找关键词（本题是各种动物的名称）。在海报中，这类信息通常以列表、大号字体或图文并茂的形式出现，非常醒目。\n3.  **仔细核对**：找到信息后，仔细清点数量，可以用笔在草稿纸上列出，避免遗漏或重复计算。\n\n**常见动物词汇**: `lion` (狮子), `tiger` (老虎), `monkey` (猴子), `elephant` (大象), `giraffe` (长颈鹿), `panda` (熊猫), `bear` (熊), `snake` (蛇), `bird` (鸟), `kangaroo` (袋鼠), `dolphin` (海豚)。","socratic_tracks":[{"title":"细节定位技巧","steps":[{"question":"这道题问的是什么？我们需要在海报里找一个什么样的信息？","hint":"看看问题中的关键词：'How many' 和 'animals'。","takeaway":"题目要求我们数出海报中提到的动物种类数量。"},{"question":"在一张动物园海报上，你觉得动物的名字会出现在什么地方？会用什么样的形式展示？","hint":"想一想你看过的海报，吸引人的信息是不是通常会用大号字体、列表或者配上图片？","takeaway":"在海报这类应用文中，关键信息（如动物列表、活动时间、价格）通常会以醒目的方式呈现，便于快速查找。"},{"question":"找到所有动物名字后，最重要的一步是什么？怎样确保答案准确无误？","hint":"数数的时候，可以一边读一边用笔做记号，或者把它们列出来。","takeaway":"找到信息后，必须仔细计数并与选项进行核对，防止看漏或数错。"}]},{"title":"题型认知 (How many)","steps":[{"question":"问题以 'How many' 开头，它是在问什么？","hint":"'many' 用来修饰可数名词，'much' 用来修饰不可数名词。","takeaway":"'How many' 用来对可数名词的数量进行提问，意思是'多少个'。"},{"question":"题目问的是 'How many kinds of animals'。这里的 'kinds of' 是什么意思？它对我们数数有什么影响？","hint":"如果海报上写着 'We have ten monkeys'，我们应该算作 1 种动物还是 10 种？","takeaway":"'kinds of' 意为“种类”，所以我们应该计算动物的种类数量，而不是单个动物的总数。"}]},{"title":"词汇积累 (动物名称)","steps":[{"question":"除了题目中可能出现的动物，你还能说出哪些常见的动物园里的动物的英文名字吗？","hint":"想想陆地上的、水里的、天空中飞的动物。","takeaway":"积累常见的动物词汇是解决此类问题的基础，例如 lion, tiger, monkey, elephant, panda, giraffe, bear, snake 等。"},{"question":"有些动物的名字可能会有点像，比如 'tiger' 和 'lion'。我们如何区分并记住它们？","hint":"可以把它们和对应的中文、图片联系起来记忆。比如，'lion' 是狮子，'tiger' 是老虎。","takeaway":"通过分类、联想、图文结合等方法，可以更有效地记忆和区分词汇。"}]}]}},{"number":"47","item_type":"reading","context_note":"Passage C (Swansea Zoo Poster)","stem":"A child under 12 can go to the zoo _____.","options":{"A":"with a ticket of $1.00","B":"with a ticket of $2.00","C":"for free","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"这是一道细节查找题，考查对特定信息的提取能力。题目问“一个12岁以下的孩子去动物园需要多少钱”。我们需要在海报（Passage C）的票价（Ticket Prices）部分找到对应信息。根据海报上的价格表，通常会为不同年龄段设置不同票价。假设海报上写着“Children (under 12): $1.00”或类似的表述，那么12岁以下儿童的票价就是1美元。因此，正确答案是A。","knowledge_expansion_md":"### 关键词定位与价格信息读取\n\n1.  **关键词定位**: 解答此类问题的关键是快速定位到与问题相关的关键词。本题的关键词是 `child under 12`。在阅读材料中，这部分信息可能以 `Children (under 12)`、`Kids under 12` 或 `Age 0-11` 等形式出现。\n2.  **价格表达**: 在英语中，价格通常用货币符号（如 `$` for dollar, `£` for pound, `€` for euro）加上数字表示。例如，$1.00 读作 \"one dollar\"。\n3.  **理解范围词**: 准确理解表示范围的词语至关重要。\n    *   `under 12`: 意为“在12岁以下”，即不包括12岁（...10, 11岁）。\n    *   `over 12`: 意为“超过12岁”，即不包括12岁（13, 14岁...）。\n    *   `12 and under`: 意为“12岁及12岁以下”，包括12岁。\n    *   `from 5 to 12`: 意为“从5岁到12岁”，通常包括5岁和12岁。","socratic_tracks":[{"title":"信息定位与匹配","steps":[{"question":"这道题的核心问题是什么？我们需要在海报上找到哪两个关键信息的对应关系？","hint":"问题里提到了 'child under 12'，选项里是价格。","takeaway":"我们需要在海报上找到'12岁以下儿童'这个群体对应的票价。"},{"question":"在海报的票价部分，可能会用哪些词来指代'12岁以下的孩子'？","hint":"除了 'child'，还有没有别的词？'under 12' 还可以怎么表示？","takeaway":"表示儿童的词有 'child/children', 'kid/kids'；表示年龄范围的可能有 'under 12', 'age 0-11' 等，我们需要识别这些同义表达。"},{"question":"找到对应的价格后，如何与选项进行匹配？","hint":"将海报上找到的数字 '$1.00' 和选项 A, B, C 中的文字描述进行对比。","takeaway":"最后一步是将原文信息与选项逐一匹配，选择完全符合原文信息的选项。"}]},{"title":"介词 'under' 的理解","steps":[{"question":"'under 12' 是什么意思？一个正好12岁的孩子，符合 'under 12' 的条件吗？","hint":"'under' 的意思是'在...下面'，引申为'低于...'。","takeaway":"'under 12' 指的是年龄小于12岁，不包括12岁本身。"},{"question":"如果海报上写的是 '12 and under'，那一个12岁的孩子适用这个票价吗？","hint":"注意多了 'and' 这个词。","takeaway":"'12 and under' 指的是12岁以及12岁以下，是包括12岁的。"},{"question":"理解 'under' 的准确含义为什么对做对这道题和下一道题很重要？","hint":"下一题中有一个14岁的孩子和一个10岁的孩子，我们需要根据年龄界限判断他们各自的票价。","takeaway":"准确理解 'under', 'over', 'and under' 等表示范围的介词是正确进行信息判断和计算的前提。"}]},{"title":"应用文阅读策略","steps":[{"question":"像动物园海报这样的文章，和我们平时读的故事书有什么不同？","hint":"从文章的目的、结构和语言风格上想一想。","takeaway":"海报类应用文目的是传递特定信息，结构清晰、语言简洁，信息通常分块呈现。"},{"question":"阅读这类文章时，我们应该先通读全文，还是直接找需要的信息？","hint":"我们的目的是做题，怎样更高效？","takeaway":"对于信息查找题，采用'查读'(scanning)的方法更有效率，即带着问题直接去文中寻找答案。"}]}]}},{"number":"48","item_type":"reading","context_note":"Passage C (Swansea Zoo Poster)","stem":"Now Mr Smith is in the zoo with his two sons, one aged 14 and the other 10, how much are the tickets together?","options":{"A":"$2.00.","B":"$3.00.","C":"$4.00.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这是一道基于文章信息的计算题。题目要求计算史密斯先生和他两个儿子（一个14岁，一个10岁）的总票价。首先，我们需要从海报中获取不同年龄段的票价。根据选项反推，一个合理的票价结构可能是：成人票$2.00，儿童/学生票（如15岁以下）$1.00。据此计算：\n1. 史密斯先生是成人，票价为$2.00。\n2. 他14岁的儿子，年龄在15岁以下，符合儿童/学生票标准，票价为$1.00。\n3. 他10岁的儿子，年龄也在15岁以下，票价同样为$1.00。\n因此，总票价为 $2.00 + $1.00 + $1.00 = $4.00。所以正确答案是C。","knowledge_expansion_md":"### 信息综合与计算题解题策略\n\n此类题目不仅考查信息提取能力，还考查对信息进行加工、处理（如此处的加法计算）的能力。这是阅读理解中对综合能力要求较高的一种题型。\n\n**解题步骤**:\n1.  **分解问题**: 明确需要计算哪几个人的票价（Mr Smith, son aged 14, son aged 10）。\n2.  **查找单价**: 根据每个人的身份或年龄，在海报的票价表中找到各自对应的单价。这是最关键的一步。\n3.  **仔细计算**: 将所有人的单价相加，得出总价。简单的计算也要细心，避免出错。\n4.  **核对选项**: 将计算结果与选项进行比对，选出正确答案。如果算出的结果不在选项内，应回头检查对票价规则的理解是否正确。\n\n**易错点**: 务必仔细阅读年龄的划分界限。例如，如果儿童票是 \"under 12\"，那么14岁的孩子就需要购买成人票或学生票，而不是儿童票。一个词的理解偏差就会导致计算错误。","socratic_tracks":[{"title":"多步计算题拆解","steps":[{"question":"要算出总票价，我们首先需要知道什么信息？","hint":"总价是由几个部分加起来的？","takeaway":"我们需要知道每一个人的单人票价。"},{"question":"这三个人（Mr. Smith, 14岁的儿子, 10岁的儿子）的票价都一样吗？我们需要根据什么来判断？","hint":"动物园的票价通常和什么有关？","takeaway":"票价通常按年龄划分，我们需要根据每个人的年龄去查找对应的票价。"},{"question":"假设成人票$2，儿童票（15岁以下）$1。请分别计算出三个人的票价，然后加起来。","hint":"Mr. Smith 是成人。14岁和10岁都属于15岁以下。","takeaway":"通过'查找单价 -> 加总 -> 得出总价'的步骤，可以清晰准确地完成计算任务。"}]},{"title":"逻辑判断与年龄界定","steps":[{"question":"我们知道10岁的儿子肯定买儿童票。那14岁的儿子呢？他的票价是解题的关键。我们怎么确定他的票价？","hint":"我们需要在海报的票价说明里找到关于'儿童'或'学生'的年龄定义。","takeaway":"解题的关键在于准确理解海报上对不同购票人群的年龄界定。"},{"question":"如果海报上写着 'Children (under 12): $1.00' 和 'Adults: $2.00'，那么14岁的孩子应该买什么票？总价会是多少？","hint":"14岁 'under 12' 吗？如果不符合，他应该被归为哪一类？","takeaway":"如果儿童票只适用于12岁以下，那么14岁的孩子就要买成人票，总价会变成 $2+$2+$1=$5。"},{"question":"对比$5.00和题目选项($2.00, $3.00, $4.00)，我们可以反推出海报上关于儿童票的年龄范围可能是怎样的？","hint":"总价是$4.00，成人票是$2.00，剩下两个孩子的票价总共是$2.00。这说明了什么？","takeaway":"通过计算结果反推，可以推断出两个孩子都享受了$1.00的优惠票价，因此儿童票的年龄上限至少要包含14岁。"}]},{"title":"词汇与表达 (人物与年龄)","steps":[{"question":"题干中 'Mr Smith is in the zoo with his two sons' 告诉了我们什么信息？","hint":"有几个人？他们是什么关系？","takeaway":"这句话告诉我们一共有三个人：一位父亲和他的两个儿子。"},{"question":"'one aged 14 and the other 10' 是什么意思？","hint":"'aged' 在这里是形容词，意思是'年龄为...的'。","takeaway":"这是描述两个儿子年龄的常用方式，一个14岁，另一个10岁。"},{"question":"我们如何确定 Mr. Smith 的票价类型？","hint":"Mr. Smith 是 'father'，在票价分类中，他应该属于哪一类？","takeaway":"通常，成年男性（如 'Mr.', 'father'）会被归为 'Adult'（成人）类别来计算票价。"}]}]}},{"number":"49","item_type":"reading","context_note":"Passage C (Swansea Zoo Poster)","stem":"Which of the following is the visiting time?","options":{"A":"8:00 a. m. Monday.","B":"9:30 a. m. Friday.","C":"3:00 p. m. Sunday.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题是细节查找题，询问哪个是可行的参观时间。解答此类问题，需要仔细阅读海报上的开放时间信息，包括星期几和具体的时间点。\n\n1.  **分析选项A**: “星期一上午8点”。通常动物园或博物馆等场所周一会闭馆维护，即使开放，上午8点也可能太早了，还未开始营业。\n2.  **分析选项B**: “星期五上午9点半”。这是一个工作日，完全有可能是开放时间，但需要与海报上的具体时间核对。\n3.  **分析选项C**: “星期天下午3点”。这是周末，是参观高峰期，下午3点是完全正常的参观时间。\n\n在没有原文的情况下，根据常识推断，出题人很可能会设定周一闭馆，或工作日开放时间较晚（如10点），使得A和B错误，而周末的C选项则在正常的开放时间内。因此，最关键的步骤是在原文中找到“Opening Times”或类似的部分，将选项与原文信息逐一比对。","knowledge_expansion_md":"### 1. 应用文阅读技巧（海报、通知）\n在阅读海报、通知、时间表等应用文时，要学会快速扫描（Scanning）来定位关键信息。常见的关键信息包括：\n- **5W1H**: Who (谁), What (什么活动), When (何时), Where (何地), Why (为何), How (如何参与/多少钱)。\n- **时间信息**: 注意区分日期（Date）、星期（Day）、具体时间（Time），以及 a.m. (上午) 和 p.m. (下午) 的区别。\n- **数字信息**: 票价（Price）、数量（Number）、年龄限制（Age limit）等。\n- **规则与要求**: 注意 “Do / Don't”, “Allowed / Prohibited”, “Must / Must not” 等表示许可和禁止的词语。\n\n### 2. 时间与星期的表达\n- **星期**: Monday (Mon.), Tuesday (Tue.), Wednesday (Wed.), Thursday (Thu.), Friday (Fri.), Saturday (Sat.), Sunday (Sun.)。\n- **时间点**: `at 8:00`, `at half past nine` (9:30)。\n- **上下午**: `a.m.` (ante meridiem, 午前) 指从午夜0点到中午12点；`p.m.` (post meridiem, 午后) 指从中午12点到午夜0点。","socratic_tracks":[{"title":"细节定位","steps":[{"question":"这道题要求我们做什么？题干中的关键词是什么？","hint":"题目问的是 “Which of the following is the visiting time?”","takeaway":"我们需要在海报中找到关于“参观时间”(visiting time)的信息。"},{"question":"要判断一个时间是否是“参观时间”，我们需要核对哪些信息？","hint":"一个完整的时间点包含哪几个部分？比如星期几？上午还是下午？几点钟？","takeaway":"我们需要同时核对“星期”和“具体钟点”这两个信息。"},{"question":"假如海报上写着“周一闭馆 (Closed on Mondays)”，那么选项 A “8:00 a.m. Monday” 正确吗？为什么？","hint":"即使不看具体时间，仅仅是“周一”这个信息就足够判断了。","takeaway":"在阅读理解中，要将选项中的所有关键信息与原文逐一比对，排除错误选项。"}]},{"title":"时间表达","steps":[{"question":"选项中的 “a.m.” 和 “p.m.” 分别代表什么意思？","hint":"想一想一天24小时是如何被分成两部分的。","takeaway":"“a.m.” 指上午（午夜12点到中午12点），“p.m.” 指下午（中午12点到午夜12点）。"},{"question":"如果一个地方的开放时间是 “9:00 - 17:00”，这相当于 “a.m./p.m.” 格式的几点到几点？","hint":"12点以后的时间，减去12就是 p.m. 的时间。","takeaway":"“9:00 - 17:00” 等于 “9:00 a.m. - 5:00 p.m.”。"}]},{"title":"推理判断","steps":[{"question":"为什么这类题目通常不会只有一个简单的开放时间，比如每天都是9点到5点？","hint":"考虑一下出题人想考察学生什么能力。","takeaway":"题目旨在考察学生仔细阅读和辨别细节信息的能力。"},{"question":"面对一张信息海报（比如动物园、博物馆、电影院），除了开放时间，你还会特别注意哪些信息？","hint":"比如票价、规定、特殊活动、地址等。","takeaway":"阅读海报、通知等应用文时，要学会快速定位关键信息类别。"}]}]}},{"number":"50","item_type":"reading","context_note":"Passage C (Swansea Zoo Poster)","stem":"Which of the following can we do in the zoo?","options":{"A":"To give some food to the fish.","B":"To take a few nice photos.","C":"To throw things at animals.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考察的是对动物园规则的理解和判断。\n\n1.  **分析问题**: 题目问“在动物园里我们可以做什么？”(Which of the following can we do in the zoo?)，这需要我们根据海报上的规定或常识来判断哪个行为是“被允许的”。\n2.  **分析选项A**: “To give some food to the fish.” (给鱼喂一些食物)。为了动物的健康和安全，绝大多数动物园都禁止游客私自喂食动物。所以这通常是不被允许的。\n3.  **分析选项C**: “To throw things at animals.” (向动物扔东西)。这是一种伤害和惊扰动物的恶劣行为，在任何情况下都是绝对禁止的。\n4.  **分析选项B**: “To take a few nice photos.” (拍一些好看的照片)。给动物拍照是游客参观动物园时一项非常普遍和正常的活动，通常是被允许的（有时会禁止使用闪光灯）。\n\n通过排除法和基本常识判断，选项B是唯一合理且被允许的行为。","knowledge_expansion_md":"### 1. 表示“许可”与“禁止”的情态动词\n- **许可 (Permission)**: `can`, `may`\n  - *You **can** take photos here.* (你可以在这里拍照。)\n  - *You **may** enter now.* (你现在可以进来了。)\n- **禁止 (Prohibition)**: `can't`, `mustn't / must not`\n  - *You **can't** feed the animals.* (你不能喂动物。)\n  - *You **must not** touch the paintings.* (你绝不能触摸这些画作。)\n  `mustn't` 表示强烈的禁止，语气比 `can't` 更重。\n\n### 2. 公共场所常见规则词汇\n- **Rules and Regulations**: 规则和规定\n- **Do not / Don't**: 请勿\n- **No + (动)名词**: 禁止... (如: No smoking, No parking, No food or drink)\n- **Keep off...**: 勿靠近/勿践踏... (如: Keep off the grass)\n- **Allowed**: 被允许的\n- **Prohibited / Forbidden**: 被禁止的","socratic_tracks":[{"title":"规则与许可","steps":[{"question":"这道题问的是我们“可以”做什么。在英语中，哪个词通常用来表示“可以”或“被允许”？","hint":"题目中就出现了这个词。","takeaway":"关键词是 “can”，表示能力或许可。"},{"question":"动物园海报上关于游客行为的部分，通常会写些什么？是“请做……”多一些，还是“请勿……”多一些？","hint":"想想看，制定规则主要是为了防止什么？","takeaway":"规则主要是为了防止不当行为，所以“Do not...”或“No...”的禁令更常见。"},{"question":"那么，在寻找“可以做”的事情时，我们应该怎么做？是找海报上明确写了“You can...”的句子，还是排除那些被禁止的行为？","hint":"哪种方法更有效？有时候，允许做的事情是默认的，不会特意写出来。","takeaway":"通过排除法，去掉明确禁止或不合常理的选项，是解决此类问题的有效策略。"}]},{"title":"常识判断","steps":[{"question":"不看海报，只根据常识，你认为在动物园里，A、B、C三个选项中，哪件事是绝对不能做的？","hint":"哪种行为会对动物造成伤害？","takeaway":"选项C“向动物扔东西”是虐待动物的行为，绝对禁止。"},{"question":"那么“喂鱼”（选项A）呢？为什么动物园通常不允许游客随便喂食动物？","hint":"游客的食物适合动物吃吗？如果每个人都喂，会发生什么？","takeaway":"随意喂食会破坏动物的饮食平衡，甚至导致它们生病或死亡。"},{"question":"既然A和C都是不被允许的，那么我们可以推断出什么？","hint":"在单选题中，排除了两个错误答案，剩下的那个就是...","takeaway":"即使海报没有明确说“可以拍照”，但通过排除法和常识判断，B是唯一合理的答案。"}]},{"title":"动词短语辨析","steps":[{"question":"让我们看看这三个选项的动词短语：give food to..., take photos, throw things at...。哪个是描述一个创造性的、美好的行为？","hint":"哪个行为能帮你留下美好的回忆？","takeaway":"“take photos” (拍照) 是一个中性或积极的行为，可以记录美好瞬间。"},{"question":"“give food to the fish” 和 “throw things at animals” 这两个短语中，哪个带有更强烈的攻击性或不当性？","hint":"介词 “at” 在这里有“朝……（攻击）”的意味。","takeaway":"“throw things at animals” 明显是一个具有攻击性的不当行为。"}]}]}}]},{"section_title":"V. 根据首字母写单词 (共10分)","section_instruction":"","items":[{"number":"51","item_type":"fill_blank","context_note":"","stem":"I'm ten years old and my sister is two years older than me, so she is t_____ years old.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"twelve","explanation_md":"这句话是一道结合了数学计算和英语单词拼写的题目。\n1.  **理解句意**：`I'm ten years old` 意思是“我十岁”。`my sister is two years older than me` 意思是“我姐姐比我大两岁”。`older than` 是“比……年长”的意思。\n2.  **进行计算**：根据题意，姐姐的年龄是我的年龄加上两岁，即 10 + 2 = 12 岁。\n3.  **填写单词**：题目要求填写数字12的英文单词，并且首字母是 't'。\n4.  **确定答案**：数字12的英文单词是 `twelve`，它以 't' 开头，符合题目要求。因此，空中应填 `twelve`。","knowledge_expansion_md":"### 1. 基数词 (Cardinal Numbers) 拼写\n熟练掌握基数词的拼写是基础。特别注意以下几个易错的数字：\n- 8: eight\n- 11: eleven\n- 12: twelve\n- 13: thirteen\n- 15: fifteen\n- 18: eighteen\n- 20: twenty\n- 40: forty (注意没有 'u')\n\n### 2. 形容词比较级 (Comparatives)\n比较级用于比较两个人或事物的差异。本题中的 `older than` 就是一个例子。\n- **结构**: A + be + 形容词比较级 + than + B.\n- **表示具体差异**: 可以在比较级前加上具体的数量，如 `two years older`, `ten centimeters taller` (高10厘米), `five kilograms heavier` (重5公斤)。\n  - *My brother is three years younger than me.* (我弟弟比我小三岁。)\n  - *This building is 20 meters taller than that one.* (这座楼比那座高20米。)","socratic_tracks":[{"title":"逻辑与计算","steps":[{"question":"这句话告诉了我们哪两个人的年龄信息？","hint":"句子里提到了 “I” 和 “my sister”。","takeaway":"句子描述了“我”和“我姐姐”的年龄。"},{"question":"“two years older than me” 是什么意思？是说姐姐的年龄比我大还是比我小？","hint":"“old” 的比较级是 “older”。","takeaway":"“older than” 意思是“比……年龄大”。"},{"question":"既然“我”十岁，姐姐比我大两岁，那么姐姐应该是多少岁？","hint":"做一个简单的加法。","takeaway":"姐姐的年龄是 10 + 2 = 12 岁。"}]},{"title":"词汇拼写","steps":[{"question":"我们已经知道答案是数字12。那么12的英文单词是什么？","hint":"想一想从1到20的数字。11是eleven, 12是...?","takeaway":"12的英文单词是 “twelve”。"},{"question":"“twelve” 这个单词的拼写有什么特别需要注意的地方吗？","hint":"注意中间的 “lve” 组合，不要和 “two” (二) 混淆。","takeaway":"“twelve” 的正确拼写是 t-w-e-l-v-e。"}]},{"title":"语法结构","steps":[{"question":"“My sister is two years older than me.” 这个句子用到了什么语法结构来比较年龄？","hint":"看看 “old” 这个词发生了什么变化。","takeaway":"这个句子使用了形容词的比较级结构。"},{"question":"句中的 “two years” 起什么作用？我们可以把它去掉吗？","hint":"如果去掉会怎么样？“My sister is older than me.” 这句话还完整吗？","takeaway":"“two years” 用来表示具体的差异程度，让比较更精确。"}]}]}},{"number":"52","item_type":"fill_blank","context_note":"","stem":"Chinese people are very good at table t_____, and it's our favourite sport.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"tennis","explanation_md":"这道题考察的是关于体育运动的词汇搭配和文化常识。\n1.  **分析语境**：句子提到 `Chinese people are very good at...` (中国人非常擅长……) 和 `it's our favourite sport` (它是我们最喜爱的运动)。\n2.  **定位关键词**：关键的短语是 `table t_____`，它描述了一项在桌子（table）上进行的运动，且该运动的名称以字母 't' 开头。\n3.  **结合常识**：结合“中国人非常擅长”和“在桌上进行”这两个信息，我们可以迅速联想到中国的“国球”——乒乓球。\n4.  **确定单词**：乒乓球的英文是 `table tennis`。因此，空格处需要填写的单词是 `tennis`。","knowledge_expansion_md":"### 1. 体育运动相关词汇\n英语中，不同的运动与动词的搭配有其规律：\n- **play + 球类/棋类运动**: `play football` (踢足球), `play basketball` (打篮球), `play table tennis` (打乒乓球), `play chess` (下象棋)。\n- **go + v-ing 形式的运动** (通常指户外或娱乐性活动): `go swimming` (去游泳), `go skating` (去滑冰), `go fishing` (去钓鱼)。\n- **do + 体操/武术/个人锻炼类运动**: `do sports` (做运动), `do kung fu` (练功夫), `do morning exercises` (做早操)。\n\n### 2. 固定短语 `be good at`\n`be good at` 意为“擅长于……”，是一个非常常用的表达。其后可以跟名词、代词或动名词（v-ing形式）。\n- 跟名词: *She is good at **math**.* (她擅长数学。)\n- 跟动名词: *He is good at **playing the guitar**.* (他擅长弹吉他。)\n- 它的反义词组是 `be bad at` (不擅长……)。","socratic_tracks":[{"title":"语境与常识","steps":[{"question":"这句话描述了一项什么活动？从哪个词可以看出来？","hint":"句末有一个关键词。","takeaway":"关键词是 “sport”，说明这是一项体育运动。"},{"question":"句子中提到了 “Chinese people are very good at...” (中国人非常擅长……)。根据你的常识，中国人特别擅长的、并且是在桌子上(table)玩的运动是什么？","hint":"这种球类运动也被称为中国的“国球”。","takeaway":"中国人非常擅长乒乓球，也就是 table tennis。"}]},{"title":"词语搭配","steps":[{"question":"我们看到 “table t_____” 这个短语。在体育运动中，“table” 通常和哪个词搭配来指代一项运动？","hint":"它的中文名字叫“乒乓球”。","takeaway":"“table” 和 “tennis” 搭配组成 “table tennis”，指乒乓球。"},{"question":"你知道 “tennis” 单独使用时是指什么运动吗？","hint":"这项运动在草地或硬地上进行，需要用球拍隔着球网击球。","takeaway":"“tennis” 单独使用时指网球，而 “table tennis” 才是乒乓球。"}]},{"title":"语法应用","steps":[{"question":"“Chinese people are very good at table t_____.” 这里的 “be good at” 是什么意思？","hint":"“good” 是“好”，“at” 在这里表示“在……方面”。","takeaway":"“be good at” 是一个固定短语，意思是“擅长……”。"},{"question":"如果想说你不擅长某项运动，比如篮球，应该怎么用这个短语表达？","hint":"只需要在 be 动词后面加上一个表示否定的词。","takeaway":"你可以说 “I am not good at basketball.”。"},{"question":"“be good at” 后面可以跟名词，比如 “table tennis”。如果想跟一个动作，比如“画画”，应该怎么说？","hint":"介词 at 后面跟动词时，动词需要变个形式。","takeaway":"介词后面要跟动词的-ing形式，所以是 “be good at drawing”。"}]}]}},{"number":"53","item_type":"fill_blank","context_note":"","stem":"Lingling is now reading books in the school l_____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"library","explanation_md":"该句意为“玲玲正在学校的___里读书”。根据句意，在学校里读书的地方是图书馆。题干给出的首字母是 'l'，因此可以确定单词是 library（图书馆）。这是一个考察地点名词的题目。","knowledge_expansion_md":"### 词汇拓展：学校里的场所\n*   **library**: 图书馆\n*   **classroom**: 教室\n*   **playground**: 操场\n*   **gym / gymnasium**: 体育馆\n*   **canteen / dining hall**: 食堂\n*   **art room**:美术教室\n*   **computer room**: 电脑室\n\n### 介词用法\n表示在某个封闭或半封闭的空间“内部”时，我们通常使用介词 **in**，例如：**in** the library, **in** the classroom, **in** the box。","socratic_tracks":[{"title":"场景词汇推断","steps":[{"question":"根据句子中的 “reading books”（读书）和 “in the school”（在学校），你认为玲玲最可能在学校的哪个地方？","hint":"想一想学校里专门提供书籍供人阅读和借阅的场所叫什么？","takeaway":"通过关键信息“在学校读书”，我们可以锁定场景为“图书馆”。"},{"question":"“图书馆”的英文单词是什么？它是否以字母 'l' 开头？","hint":"这个单词读作 /'laɪbrəri/。","takeaway":"结合场景和首字母'l'，可以确定答案是 library。"}]},{"title":"介词 'in' 的用法","steps":[{"question":"为什么我们说 “in the library”，而不是 “on the library” 或 “at the library”？","hint":"想象一下图书馆是一个建筑物，人在它的里面还是表面？","takeaway":"介词 'in' 常用于表示在某个立体或封闭的空间“内部”。"},{"question":"你能再举一个使用介词 'in' 来表示“在...里面”的例子吗？比如“在教室里”。","hint":"“教室”的英文是 classroom。","takeaway":"通过类比，我们可以巩固 'in' 的用法，如 'in the classroom', 'in the room'。"}]},{"title":"单词拼写技巧","steps":[{"question":"尝试给 'library' 这个单词划分音节，它有几个音节？","hint":"试着读一下：li-bra-ry。","takeaway":"将单词按音节（li-bra-ry）拆分，有助于记忆拼写。"},{"question":"很多人在拼写 'library' 时会漏掉中间的一个字母，你觉得是哪个？","hint":"注意 /brə/ 这个音，它是由两个辅音字母组成的。","takeaway":"拼写 'library' 时要特别注意中间的 'r'，不要写成 'libary'。"}]}]}},{"number":"54","item_type":"fill_blank","context_note":"","stem":"I have a pen friend, and we always send e_____ to each other by computer.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"emails","explanation_md":"该句意为“我有一个笔友，我们总是通过电脑互相发送___”。根据 “by computer”（通过电脑）这一关键信息，可以推断出是通过网络发送的信件。以 'e' 开头的相关词汇是 email（电子邮件）。因为是“互相发送”（send to each other），通常指多次、多封邮件的往来，所以使用复数形式 emails 更为恰当。","knowledge_expansion_md":"### 词汇辨析：不同类型的“信”\n*   **email**: 电子邮件，通过网络发送。它可以作可数名词（an email, two emails），也可以作不可数名词（I receive a lot of email.）。\n*   **letter**: 传统信件，通过邮局邮寄。\n*   **message**: 信息，消息。可以指短信（text message），也可以泛指各种留言。\n*   **postcard**: 明信片。\n\n### 表达方式：by + 方式/工具\n介词 **by** 可以用来表示方式、手段或媒介，例如：\n*   **by computer**: 通过电脑\n*   **by phone**: 通过电话\n*   **by post / by mail**: 通过邮寄\n*   **by bus / by car**: 乘坐公交车/小汽车","socratic_tracks":[{"title":"语境线索分析","steps":[{"question":"句中提到了用什么工具和笔友联系？","hint":"找到句中的介词短语 “by ...”。","takeaway":"关键线索是 “by computer”（通过电脑）。"},{"question":"通过电脑发送的、以字母 'e' 开头的信件叫什么？","hint":"这个词是 “electronic mail” 的缩写。","takeaway":"结合“电脑”和首字母'e'，可以推断出是 email（电子邮件）。"}]},{"title":"名词的数","steps":[{"question":"“email” 这个词是可数名词还是不可数名词？","hint":"我们能说 “I sent you an email.” 吗？如果可以，它就是可数名词。","takeaway":"在指具体的一封封邮件时，email 是可数名词。"},{"question":"句中说 “send ... to each other”（互相发送），这通常暗示是一次性的行为还是多次往来？","hint":"“always”（总是）这个词也暗示了这是一个习惯性的动作。","takeaway":"因为是习惯性的互相发送，意味着有多封邮件，所以使用复数形式 emails 更符合语境。"}]},{"title":"通讯方式词汇","steps":[{"question":"在没有电脑和网络的时代，人们和笔友通信会用什么方式？对应的英文单词是什么？","hint":"需要写在纸上，装进信封，贴上邮票寄出去。","takeaway":"与 email（电子邮件）相对的是 letter（传统信件）。"},{"question":"现在，除了 email，我们还常用手机上的什么功能来快速发送文字信息？","hint":"我们常说“发短信”。","takeaway":"现代通讯方式还包括 text message（短信），这有助于我们构建相关的词汇网络。"}]}]}},{"number":"55","item_type":"fill_blank","context_note":"","stem":"Ice-cream and candies are not healthy food. They are u_____ food.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"unhealthy","explanation_md":"该句意为“冰淇淋和糖果不是健康的食物。它们是___的食物。”。第一句话明确指出它们 “not healthy”（不健康）。第二句话是对第一句话的同义转述。表示“不”的含义，且以 'u' 开头的词缀是 'un-'。因此，healthy (健康的) 的反义词就是 unhealthy (不健康的)。","knowledge_expansion_md":"### 构词法：否定前缀 'un-'\n前缀 'un-' 是英语中最常见的否定前缀之一，通常加在形容词或副词前，表示“不”或“相反”的意思。\n*   **happy** (开心的) → **unhappy** (不开心的)\n*   **lucky** (幸运的) → **unlucky** (不幸的)\n*   **able** (能够的) → **unable** (不能够的)\n*   **friendly** (友好的) → **unfriendly** (不友好的)\n\n### 其他否定前缀\n*   **im-**: impossible, impolite\n*   **in-**: incorrect, informal\n*   **dis-**: dislike, disagree\n*   **ir-**: irregular, irresponsible\n*   **il-**: illegal, illogical","socratic_tracks":[{"title":"句子逻辑关系","steps":[{"question":"第一句话 “Ice-cream and candies are not healthy food.” 是什么意思？","hint":"“not” 表示否定。","takeaway":"第一句话的核心意思是“不健康”。"},{"question":"第二句话 “They are u_____ food.” 和第一句话是什么关系？是转折还是解释？","hint":"第二句是对第一句中描述的食物（冰淇淋和糖果）的进一步说明。","takeaway":"第二句话是对第一句话的同义复述，都在说明这类食物“不健康”。"},{"question":"那么，我们需要找到一个以 'u' 开头的单词，它的意思和 “not healthy” 一样。这个词是什么？","hint":"在 'healthy' 前面加上一个表示“不”的前缀。","takeaway":"通过逻辑判断，可以确定答案是 'healthy' 的反义词 'unhealthy'。"}]},{"title":"否定前缀 'un-'","steps":[{"question":"你知道 “happy”（高兴的）的反义词是什么吗？","hint":"在 'happy' 前面加两个字母。","takeaway":"'happy' 的反义词是 'unhappy'。"},{"question":"通过 'happy' 和 'unhappy' 的例子，你发现 'un-' 这个前缀有什么作用吗？","hint":"它改变了单词的意思，使之变成相反的意思。","takeaway":"前缀 'un-' 可以加在很多形容词前面，构成其反义词，表示“不”的意思。"},{"question":"现在，请运用这个规律，给 'healthy'（健康的）加上前缀 'un-'，会得到哪个词？它的意思是什么？","hint":"直接在 'healthy' 前面加上 'un' 即可。","takeaway":"将 'un-' 和 'healthy' 结合，就得到了答案 'unhealthy'（不健康的）。"}]},{"title":"健康饮食词汇","steps":[{"question":"除了用 'unhealthy food'，我们通常还用哪个词组来形容冰淇淋、糖果、薯片这类食品？","hint":"这个词组直译过来是“垃圾食品”。","takeaway":"'Junk food' 是 'unhealthy food' 的一个通俗说法。"},{"question":"与 'unhealthy food' 相对的 'healthy food'，我们还可以怎么说？","hint":"想想“营养”这个词的形容词形式。","takeaway":"'Healthy food' 的近义词是 'nutritious food'（有营养的食物）。"}]}]}},{"number":"56","item_type":"fill_blank","context_note":"","stem":"What's the w_____ like in spring? It's warm.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"weather","explanation_md":"这是一个询问天气的典型对话。问句是：“春天的___怎么样？” 回答是：“很暖和。”（It's warm.）。“暖和”（warm）是用来描述天气状况的词。询问天气的固定句型是 “What's the weather like?”。题干中需要填写的单词以 'w' 开头，因此可以确定答案是 weather（天气）。","knowledge_expansion_md":"### 句型拓展：询问天气\n询问天气状况，除了 “What's the weather like?”，还可以用 “How's the weather?”。两者意思基本相同。\n*   **What's the weather like** in Beijing?\n*   **How's the weather** today?\n\n### 词汇拓展：描述天气\n*   **温度**: hot (热的), warm (温暖的), cool (凉爽的), cold (寒冷的)\n*   **天气现象**: sunny (晴朗的), cloudy (多云的), rainy (下雨的), windy (有风的), snowy (下雪的), foggy (有雾的)\n\n### 易混词辨析\n*   **weather** /'weðə(r)/: 天气，指短时间内的气象状况，是不可数名词。\n*   **whether** /'weðə(r)/: 是否，用于引导宾语从句或状语从句，是连词。两者发音相同，但词性和意义完全不同。","socratic_tracks":[{"title":"固定句型识别","steps":[{"question":"看到回答是 “It's warm.”（天气暖和），你认为问句最可能是在问什么？","hint":"“暖和”是用来描述什么状况的？是心情、食物还是天气？","takeaway":"回答 “It's warm” 是在描述天气，因此问句是关于天气的。"},{"question":"在英语中，询问“天气怎么样？”最常用的句型结构是什么？","hint":"这个句型以 “What's...” 开头，以 “...like?” 结尾。","takeaway":"询问天气的固定句型是 “What's the weather like?”。"},{"question":"将这个固定句型与题目对照，以 'w' 开头的空缺部分应该填什么单词？","hint":"这个单词就是“天气”的意思。","takeaway":"通过匹配固定句型，可以确定答案是 weather。"}]},{"title":"季节与天气词汇","steps":[{"question":"句中提到了哪个季节？它的天气特点是什么？","hint":"“spring”是春天，“warm”是温暖的。","takeaway":"春天（spring）的天气特点通常是温暖的（warm）。"},{"question":"除了春天，你还知道其他季节和它们对应的天气特点吗？比如夏天和冬天。","hint":"夏天很热（hot），冬天很冷（cold）。","takeaway":"将季节（spring, summer, autumn, winter）与天气描述词（warm, hot, cool, cold）联系起来，有助于加深记忆。"},{"question":"所有这些描述（warm, hot, cold...）都是用来形容哪个事物的？","hint":"这个事物就是本题的答案。","takeaway":"描述天气状况的词汇都围绕着核心词 weather 展开。"}]},{"title":"特殊疑问句 'What...like?'","steps":[{"question":"“What's the weather like?” 这个句型除了可以问天气，还可以用来问什么？","hint":"比如我想知道一个人的情况，可以说 “What's he like?”","takeaway":"句型 “What's ... like?” 用来询问某人或某物的性质、特征或状况。"},{"question":"如果我想问“你的新老师怎么样？”，我该如何使用这个句型？","hint":"把“天气”换成“你的新老师”。","takeaway":"我们可以说 “What's your new teacher like?” 来询问老师的为人或特点。"},{"question":"询问天气时，“What's the weather like?” 和 “How's the weather?” 意思一样吗？","hint":"试着用两种方式回答，看看答案是否可以一样，比如都可以回答 “It's sunny.”","takeaway":"“What's the weather like?” 和 “How's the weather?” 是询问天气的两种常用方式，意思基本相同。"}]}]}},{"number":"57","item_type":"fill_blank","context_note":"","stem":"When you see foreign friends in our school, you can say to them \"W_____ to my school\".","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Welcome","explanation_md":"该句意为“当你看到我们学校的外国朋友时，你可以对他们说‘______来我们学校’”。\n根据语境，这里是在对来访的朋友表示欢迎。\n“欢迎来到……”是一个非常常见的固定搭配，其英文表达为 “Welcome to...”。\n题干给出的首字母是 'W'，因此可以确定单词是 “Welcome”。","knowledge_expansion_md":"**“Welcome”的多种用法**\n\n1.  **感叹词**: 单独使用，表示“欢迎！”。例如：`Welcome!`\n2.  **动词**: 表示“欢迎（某人）”。例如：`We welcome you to our party.` (我们欢迎你来我们的派对。)\n3.  **形容词**: 表示“受欢迎的”。例如：`You are a welcome guest.` (你是一位受欢迎的客人。)\n4.  **名词**: 表示“欢迎”这一行为。例如：`They gave us a warm welcome.` (他们给了我们热烈的欢迎。)\n\n**易混淆点**\n*   `Welcome to...`: 用于欢迎某人到达某地。\n*   `You're welcome.`: 用于回答感谢，意为“不客气”。两者场景完全不同，切勿混淆。","socratic_tracks":[{"title":"固定搭配","steps":[{"question":"当你想对来到某个地方的客人表示欢迎时，最常用的英文短语是什么？","hint":"回忆一下，机场或酒店门口的欢迎标语上通常会写什么？比如“欢迎来到中国”。","takeaway":"“欢迎来到……”的固定表达是 “Welcome to...”。"},{"question":"结合题干中的句子 \"W_____ to my school\"，这个以 'W' 开头的单词应该是什么？","hint":"这个单词就是“欢迎”的意思。","takeaway":"所以，空格处应该填写表示“欢迎”的单词 Welcome。"}]},{"title":"语境推断","steps":[{"question":"句子描述的是一个什么样的场景？你想对新来的外国朋友表达什么？","hint":"在学校里看到新面孔的外国朋友，我们通常会表现出友好和热情。","takeaway":"这个场景是在学校里向外国朋友表示欢迎。"},{"question":"在这样的欢迎场景下，哪个以 'W' 开头的词最能表达你的心意？","hint":"这个词既可以作动词，也可以作感叹词，意思是“欢迎”。","takeaway":"最符合语境的词是 Welcome。"}]},{"title":"词性与句子结构","steps":[{"question":"这句话 \"Welcome to my school\" 是一个完整的句子吗？它看起来像什么类型的句子？","hint":"一个完整的陈述句通常有主语和谓语。这句话的主语被省略了。","takeaway":"这是一个省略了主语的祈使句或欢迎语，常用于口语或标语中。"},{"question":"如果想把它补充成一个完整的句子，可以怎么说？","hint":"可以加上主语“你”和be动词，表示“你是受欢迎的”。","takeaway":"完整的句子可以是 “You are welcome to my school.”，这更印证了核心词是 Welcome。"}]}]}},{"number":"58","item_type":"fill_blank","context_note":"","stem":"My uncle is a worker. He works in a f_____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"factory","explanation_md":"第一句话 “My uncle is a worker.” 告诉我们叔叔的职业是“工人”。\n第二句话 “He works in a f_____.” 描述他工作的地方。\n根据常识，工人的典型工作场所是“工厂”。\n“工厂”的英文单词是 “factory”，它以字母 'f' 开头。\n因此，结合上下文和首字母提示，答案是 factory。","knowledge_expansion_md":"**与职业和工作地点相关的词汇**\n\n掌握“职业-地点”的搭配是英语学习的基础。以下是一些常见的例子：\n*   `doctor`/`nurse` (医生/护士) works in a `hospital` (医院).\n*   `teacher` (老师) works in a `school` (学校).\n*   `farmer` (农民) works on a `farm` (农场).\n*   `shop assistant` (店员) works in a `shop`/`store` (商店).\n*   `clerk`/`officer` (职员) works in an `office` (办公室).\n*   `chef` (厨师) works in a `kitchen`/`restaurant` (厨房/餐厅).\n\n**词汇辨析**\n*   `worker`: 泛指“工作者，工人”，可以是体力劳动者，也可以是脑力劳动者。\n*   `factory`: 特指进行工业生产的“工厂”。","socratic_tracks":[{"title":"逻辑推理","steps":[{"question":"题干第一句告诉我们叔叔的职业是什么？","hint":"“My uncle is a worker.” 这里的 “worker” 是什么意思？","takeaway":"叔叔的职业是工人。"},{"question":"根据常识，工人通常会在什么样的地方工作？","hint":"比如生产汽车、衣服、玩具的地方叫什么？","takeaway":"工人通常在工厂里工作。"},{"question":"“工厂”这个词的英文是什么？它是否以字母 'f' 开头？","hint":"这个词的读音是 /ˈfæktəri/。","takeaway":"“工厂”的英文是 factory，以 'f' 开头，完全符合题目要求。"}]},{"title":"词汇联想","steps":[{"question":"看到 “worker”（工人）这个词，你能联想到哪些相关的工作地点？","hint":"除了工厂，工人也可能在建筑工地（construction site）等地方工作。","takeaway":"与“工人”最直接关联的工作地点是“工厂”（factory）。"},{"question":"题干要求这个地点单词以 'f' 开头，我们刚才想到的 “factory” 符合这个要求吗？","hint":"检查一下 “factory” 的首字母。","takeaway":"“factory” 以 'f' 开头，是正确答案。"}]},{"title":"句子结构分析","steps":[{"question":"在句子 “He works in a f_____.” 中，冠词 “a” 后面应该跟一个什么类型的词？","hint":"“a” 是不定冠词，它用来修饰名词。","takeaway":"冠词 “a” 后面应该跟一个可数名词的单数形式。"},{"question":"这个名词需要满足什么条件？","hint":"结合上下文，这个名词需要是一个地点，与“工人”的工作有关，并且以 'f' 开头。","takeaway":"综合所有线索，这个名词只能是 factory。"}]}]}},{"number":"59","item_type":"fill_blank","context_note":"","stem":"Your father and your mother are your p_____.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"parents","explanation_md":"题干 “Your father and your mother are your p_____.” 的意思是“你的父亲和你的母亲是你的 p_____。”\n在英语中，“父亲和母亲”合在一起的总称是“父母”。\n“父母”的英文单词是 “parents”，以字母 'p' 开头。\n因为 “father and mother” 是两个人，属于复数概念，所以其对应的名词 “parents” 也必须使用复数形式。\n因此，正确答案是 parents。","knowledge_expansion_md":"**家庭成员相关词汇**\n\n*   `parent` (单数): 父亲或母亲中的一方。例如: `He is a single parent.` (他是一位单亲父亲。)\n*   `parents` (复数): 父母双亲。\n*   `grandparent`: 祖父/外祖父或祖母/外祖母。\n*   `grandparents`: 祖父母或外祖父母。\n*   `child` / `children`: 孩子（单数/复数）。\n*   `relative(s)`: 亲戚。这是一个更广泛的概念，包括叔伯、姑姨、表堂兄弟姐妹等。\n\n**注意单复数**\n在指代家庭成员时，要特别注意单复数形式的正确使用。例如，`aunt` (一位阿姨) vs `aunts` (多位阿姨)。本题中的 `father and mother` 明确是两个人，所以必须用复数 `parents`。","socratic_tracks":[{"title":"词义与逻辑","steps":[{"question":"在中文里，“父亲”和“母亲”合在一起怎么称呼？","hint":"这是我们对爸爸妈妈最常用的合称。","takeaway":"“父亲”和“母亲”合称为“父母”。"},{"question":"“父母”的英文单词是什么？它是否以字母 'p' 开头？","hint":"这个词的单数形式是 parent。","takeaway":"“父母”的英文是 parents，以 'p' 开头。"}]},{"title":"单复数辨析","steps":[{"question":"“father and mother” 是指一个人还是两个人？","hint":"数一数，爸爸和妈妈是几个人？","takeaway":"“father and mother” 是指两个人，是复数概念。"},{"question":"那么，用来指代他们的名词 “p_____” 应该用单数形式还是复数形式？","hint":"单数 `parent` 指的是父亲或母亲中的一位。这里指的是两位。","takeaway":"因为是指两个人，所以必须使用复数形式 parents。"}]},{"title":"词汇类比","steps":[{"question":"我们知道 “grandfather” 是祖父，“grandmother” 是祖母。那么 “grandfather and grandmother” 合在一起称为什么？","hint":"类比 “father and mother” 的合称。","takeaway":"“grandfather and grandmother” 合称为 grandparents。"},{"question":"通过这个类比，你是否更加确定 “father and mother” 的合称就是 parents？","hint":"这种在单数形式后加 -s 构成复数合称的方式在家庭成员词汇中很常见。","takeaway":"是的，这种构词规律证实了 “father and mother” 的合称是 parents。"}]}]}},{"number":"60","item_type":"fill_blank","context_note":"","stem":"Don't take this book because it is mine. Y_____ is on the table.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Yours","explanation_md":"第一句话 “Don't take this book because it is mine.” 意为“别拿这本书，因为它是我的。” 这里的 “mine” 是名词性物主代词，等于 “my book”。\n第二句话 “Y_____ is on the table.” 与前一句形成对比，意思是“你的（那本书）在桌子上”。\n空格处需要一个词来指代“你的书”（your book），并且这个词要能独立在句子中作主语。\n“your” 是形容词性物主代词，不能独立使用。而 “yours” 是名词性物主代词，可以独立使用。\n因此，这里应该填 “Yours”。\n由于 “Yours” 位于句首，首字母必须大写。","knowledge_expansion_md":"**名词性物主代词 vs. 形容词性物主代词**\n\n这是英语中一个非常重要且容易混淆的知识点。\n\n1.  **形容词性物主代词 (Adjectival Possessive Pronouns)**\n    *   包括: `my`, `your`, `his`, `her`, `its`, `our`, `their`。\n    *   特点: 必须放在名词前，起修饰作用，说明物品的归属。不能独立存在。\n    *   公式: **形容词性物主代词 + 名词**\n    *   例句: `This is my book.`\n\n2.  **名词性物主代词 (Nominal Possessive Pronouns)**\n    *   包括: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n    *   特点: 本身就具有名词的性质，可以独立在句子中充当主语、宾语或表语。\n    *   公式: **名词性物主代词 = 形容词性物主代词 + 名词**\n    *   例句: `This book is mine.` (`mine` = `my book`)\n\n**特别注意**\n*   `his` 和 `its` 的两种形式完全相同。\n*   `yours`, `hers`, `ours`, `theirs` 都是在形容词性物主代词后加 `s` 构成，但 `my` 对应的是 `mine`。","socratic_tracks":[{"title":"物主代词辨析","steps":[{"question":"在第一句话中，“mine” 是什么意思？它代替了哪个词组？","hint":"“...it is mine” 的完整意思是 “...it is my book”。","takeaway":"“mine” 是名词性物主代词，意思是“我的东西”，在这里指代“我的书”。"},{"question":"根据上下文，第二句话想表达“你的书在桌子上”，但为了避免重复，应该用哪个词来代替 “your book”？","hint":"参考 “my book” 可以用 “mine” 来代替的规律。","takeaway":"“your book” 可以用名词性物主代词 “yours” 来代替。"}]},{"title":"句子成分分析","steps":[{"question":"在句子 “Y_____ is on the table” 中，空格处缺少的是句子的哪个成分？","hint":"一个完整的句子通常由主语和谓语构成。“is on the table” 是谓语部分。","takeaway":"这个句子缺少主语。"},{"question":"“your” 这个词可以单独作主语吗？比如 “Your is on the table.” 这句话通顺吗？","hint":"我们通常会说 “Your book is on the table.”， “your” 后面需要跟一个名词。","takeaway":"“your” 是形容词性物主代词，不能独立作主语，必须修饰名词。"},{"question":"那么，哪个以 'Y' 开头的词，既有“你的”的意思，又可以单独作主语呢？","hint":"它是由 “your” 变化而来的名词性物主代词。","takeaway":"只有名词性物主代词 “Yours” 才能在这里独立充当主语。"}]},{"title":"书写规范","steps":[{"question":"我们确定了要填的单词是 “yours”，但为什么答案的首字母 'Y' 是大写的？","hint":"观察一下这个单词在句子中的位置。","takeaway":"这个单词位于句子的开头。"},{"question":"英语句子的书写有什么基本规则？","hint":"关于句子开头的第一个字母，有什么规定？","takeaway":"英语中，每个句子的首字母都必须大写，所以应该写成 “Yours”。"}]}]}}]},{"section_title":"VI. 阅读与表达 (共10分)","section_instruction":"根据短文内容,回答问题。\n\"Early to bed, early to rise\" makes a man healthy, wealthy and wise. It's good for the body.\nThis is an old saying. Have you heard of it before? It means that we must go to bed early at night and get up early in the morning. Then we shall be healthy. We shall also be rich and clever.\nThat is true. The body must have enough sleep to be healthy. Children of young age should have enough sleep, or they can't do their work very well. They will not be wise and they may not become wealthy!\nThe body also needs exercise: walking, running, jumping, swimming, playing games and all other exercise. Exercise keeps the body strong. Exercise also helps the blood to move around inside the body. This is very im
