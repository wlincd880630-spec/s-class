portant. Our blood takes food to all parts of our body. The head also needs blood. Exercise helps us to think better.","items":[{"number":"61","item_type":"reading","context_note":"","stem":"What does \"Early to bed, early to rise\" mean?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"It means going to bed early and getting up early.","explanation_md":"本题考察对英语谚语的理解能力。题目中的 \"Early to bed, early to rise\" 是一句广为人知的谚语，询问它的含义。根据字面意思分析，\"early to bed\" 指“早点上床睡觉”，\"early to rise\" 指“早点起床”。因此，这句谚语的核心意思就是建议人们养成早睡早起的好习惯。回答时，直接解释其字面含义即可。","knowledge_expansion_md":"### 谚语拓展与理解\n\n1.  **完整谚语**：这句谚语的完整形式是 \"Early to bed and early to rise, makes a man healthy, wealthy, and wise.\"（早睡早起，使人健康、富有和聪明。）这揭示了人们认为早睡早起能带来的三大好处。\n2.  **相关谚语**：\n    *   \"An apple a day keeps the doctor away.\" (一天一苹果，医生远离我。)\n    *   \"Health is better than wealth.\" (健康胜于财富。)\n3.  **语法结构**：\"Early to bed, early to rise\" 是一个省略结构，形式上是两个不定式短语并列，简洁有力。在理解这类结构时，需要根据语境补全其表达的建议或劝告的含义。","socratic_tracks":[{"title":"谚语字面义解读","steps":[{"question":"我们来拆解一下 \"Early to bed, early to rise\" 这句话。\"Early\" 是什么意思？","hint":"想一想 \"early morning\" (清晨) 这个词组。","takeaway":"\"Early\" 的意思是“早的”或“早地”。"},{"question":"那么，\"to bed\" 和 \"to rise\" 在这里分别指什么动作？","hint":"\"go to bed\" 是“去睡觉”，\"the sun rises\" 是“太阳升起”。","takeaway":"\"To bed\" 指上床睡觉，\"to rise\" 指起床。"},{"question":"把这些意思组合起来，\"Early to bed, early to rise\" 的直接意思是什么？","hint":"把“早”、“睡觉”、“起床”这几个意思连成一句话。","takeaway":"这句话的字面意思就是“早睡早起”。"}]},{"title":"词汇辨析：rise vs raise","steps":[{"question":"在这句谚语里，\"rise\" 是“起床”的意思。它是一个不及物动词，表示主语自己升起或起来。你能想到另一个和它长得很像的词 \"raise\" 吗？它们有什么区别？","hint":"想一想“举手”是 \"raise your hand\" 还是 \"rise your hand\"？","takeaway":"\"rise\" 是不及物动词，主语自己升起；\"raise\" 是及物动词，表示举起某个东西。"},{"question":"请用 \"rise\" 描述太阳升起的句子。","hint":"主语是太阳 (The sun)。","takeaway":"我们可以说：The sun rises in the east. (太阳从东方升起)。"},{"question":"请用 \"raise\" 造一个句子，表示“提出问题”。","hint":"“问题”是 a question。","takeaway":"我们可以说：Please raise your hand if you have a question. (如果你有问题，请举手)。"}]},{"title":"文化内涵与引申","steps":[{"question":"为什么人们会推崇“早睡早起”？你认为这背后体现了什么样的价值观？","hint":"想一想，早起的人通常被认为是勤奋的还是懒惰的？","takeaway":"“早睡早起”体现了勤奋、自律和珍惜时间的价值观。"},{"question":"这句谚语的完整版是 \"...makes a man healthy, wealthy, and wise.\" 这对我们理解它的含义有什么帮助？","hint":"healthy (健康), wealthy (富有), wise (聪明) 都是好的品质。","takeaway":"完整版谚语直接点明了早睡早起被认为能带来的具体好处，即有益于健康、财富和智慧。"}]}]}},{"number":"62","item_type":"reading","context_note":"","stem":"What must the body have to be healthy?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"It must have enough sleep, healthy food and exercise.","explanation_md":"本题是一个细节查找题，旨在考察学生从（假定的）文章中提取关键信息的能力。问题是“身体要保持健康必须拥有什么？”。关键词是 \"must have\"（必须拥有）和 \"healthy\"（健康）。根据常识和这类健康主题文章的普遍内容，保持健康通常需要三个基本要素：充足的睡眠、健康的饮食和适当的锻炼。因此，一个全面的答案应该包含这几点。在实际考试中，需要根据原文内容来精确回答。","knowledge_expansion_md":"### 重点语法与词汇\n\n1.  **情态动词 `must`**：`must` 表示“必须”，表达非常强烈的必要性或义务。在回答由 `must` 提出的问题时，答案通常也需要指出那些必不可少的条件。\n    *   与 `should`（应该，建议）相比，`must` 的语气更强硬。\n    *   其否定形式 `mustn't` 表示“禁止，不准”。\n2.  **健康话题词汇**：\n    *   **睡眠**: `enough sleep` (充足的睡眠), `good rest` (好的休息), `go to bed early` (早睡)\n    *   **饮食**: `healthy food` (健康食品), `balanced diet` (均衡饮食), `nutrition` (营养), `vitamins` (维生素)\n    *   **运动**: `exercise` (锻炼), `do sports` (做运动), `stay active` (保持活跃)\n3.  **回答 `What` 问句**：对于以 `What` 开头的特殊疑问句，回答时需要提供具体的信息、事物或活动，直接针对 `What` 所询问的内容。","socratic_tracks":[{"title":"情态动词 'must' 的理解","steps":[{"question":"题目中的 \"must\" 是什么意思？它表达了什么样的要求？","hint":"想象一下，老师说 \"You must finish your homework.\" 这是建议还是命令？","takeaway":"\"must\" 表达的是“必须”，是一种非常强烈的、不可或缺的要求。"},{"question":"如果把题目中的 \"must\" 换成 \"should\"，变成 \"What should the body have...?\"，问题的侧重点有什么不同？","hint":"\"should\" 的意思是“应该”，通常用来提建议。","takeaway":"用 \"should\" 提问是在寻求建议，而用 \"must\" 是在询问必不可少的条件。"},{"question":"所以，当我们回答这个用 \"must\" 提问的问题时，我们应该给出哪些最重要的、最基本的东西？","hint":"想一想维持生命和健康最离不开的是什么？","takeaway":"回答时应聚焦于那些维持健康最核心、最基础的要素。"}]},{"title":"定位关键信息","steps":[{"question":"这个问题问的是“身体保持健康必须拥有什么？”。要在文章中找到答案，你会先找哪些关键词？","hint":"问题里的核心名词和形容词是什么？","takeaway":"我们会优先寻找 \"body\", \"healthy\", \"must\" 或意思相近的词。"},{"question":"在文章中找到包含这些关键词的句子后，下一步该做什么？","hint":"找到句子后，是直接抄写整句，还是需要处理一下？","takeaway":"找到相关句子后，需要仔细阅读并提炼出能直接回答问题核心内容的词或短语。"}]},{"title":"拓展健康词汇","steps":[{"question":"除了我们答案中提到的睡眠、食物和运动，你还能想到其他对健康有益的事情吗？","hint":"想一想心情、卫生等方面。","takeaway":"保持愉快的心情 (stay happy) 和良好的个人卫生 (good hygiene) 对健康也很重要。"},{"question":"在“健康饮食”方面，你能具体说出一些健康的食物 (healthy food) 和不健康的食物 (unhealthy food) 吗？","hint":"水果、蔬菜 vs 糖果、油炸食品。","takeaway":"健康食物包括 fruits, vegetables, milk；不健康食物包括 junk food, candy, fried chicken。"},{"question":"在“运动”方面，除了 \"exercise\" 和 \"do sports\"，还有哪些词或短语可以表达“锻炼身体”？","hint":"比如让身体动起来，或者保持身材。","takeaway":"我们还可以用 \"work out\", \"keep fit\", \"stay active\" 等来表达锻炼身体。"}]}]}},{"number":"63","item_type":"reading","context_note":"","stem":"What will happen to children of young age who don't have enough sleep?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"They may not grow well and may not do well in their studies.","explanation_md":"本题考察对因果关系的理解和信息提取能力。问题是“年龄小的孩子如果睡眠不足会怎么样？”。这是一个典型的询问后果的问题。关键词是 \"children of young age\"（年幼的孩子）和 \"don't have enough sleep\"（睡眠不足）。我们需要在（假定的）文章中找到描述这种情况会导致的结果的句子。答案通常会涉及身体发育（grow well）和学习表现（do well in studies）两个方面，因为这两点是睡眠对儿童影响最大的方面。使用 `may` 表示一种可能性，是比较准确和常见的表述方式。","knowledge_expansion_md":"### 因果关系与将来时态\n\n1.  **表示因果关系的句型**：\n    *   `If ..., ... will/may ...` (如果...，将会/可能会...)\n    *   `... because ...` (...因为...)\n    *   `A leads to B.` (A导致B。)\n    *   `The result of A is B.` (A的结果是B。)\n2.  **将来时态 `will` 和情态动词 `may`**：\n    *   `will` 用于预测将来肯定会发生的事情。例如：`If you don't water the plant, it will die.`\n    *   `may` 用于预测将来**可能**会发生的事情，语气不如 `will` 肯定。在描述睡眠不足的后果时，使用 `may` 更为科学严谨。例如：`Lack of sleep may lead to health problems.`\n3.  **关键短语**：\n    *   `of young age` = `young`，用来修饰 `children`。\n    *   `have enough sleep` 的反义词是 `don't have enough sleep` 或 `lack of sleep` (缺乏睡眠)。\n    *   `do well in...` 意为“在...方面做得好”。","socratic_tracks":[{"title":"识别因果关系","steps":[{"question":"这个问题 \"What will happen to children... who don't have enough sleep?\" 是在问什么？","hint":"它问的是一个条件（睡眠不足）会带来一个什么样的结果。","takeaway":"这个问题在询问“因”（睡眠不足）导致的“果”（会发生什么）。"},{"question":"在阅读文章时，哪些词或句子结构会提示我们接下来要讲的是结果？","hint":"比如“因此”、“所以”、“会导致”...","takeaway":"我们可以关注 `as a result`, `so`, `...will lead to...` 等表示因果关系的标志词。"},{"question":"找到描述结果的句子后，我们应该如何组织答案？","hint":"直接回答问题，说明会发生什么。","takeaway":"我们应该直接陈述睡眠不足所带来的后果，构成一个完整的句子。"}]},{"title":"语法：'will' 和 'may'","steps":[{"question":"问题中使用了 \"will happen\"，这是什么时态？它表示什么？","hint":"这和现在、过去、将来哪个时间有关？","takeaway":"这是将来时态，用来预测将来会发生的事情。"},{"question":"在我们的参考答案中，使用了 \"may not grow well\"。用 \"may\" 和用 \"will\" 有什么区别？","hint":"哪个语气更肯定？\"It will rain.\" 和 \"It may rain.\" 的区别是什么？","takeaway":"\"will\" 表示确定性较高的预测，而 \"may\" 表示可能性，语气更委婉、不那么绝对。"},{"question":"为什么在描述睡眠不足的后果时，用 \"may\" 可能比用 \"will\" 更合适？","hint":"是不是每个睡眠不足的孩子都一定会长不高、学习不好？还是说他们有这个风险？","takeaway":"因为这些后果是一种较高的可能性或风险，而不是百分之百必然发生的结果，所以用 \"may\" 更科学、更严谨。"}]},{"title":"短语解析","steps":[{"question":"我们来分析一下问题中的短语 \"children of young age\"。它是什么意思？","hint":"它和 \"young children\" 意思一样吗？","takeaway":"\"children of young age\" 就是“年幼的孩子”，是 \"young children\" 的一种稍正式的说法。"},{"question":"另一个关键短语是 \"don't have enough sleep\"。你能用一个名词词组来表达同样的意思吗？","hint":"“缺乏”这个词怎么说？","takeaway":"我们可以用 \"lack of sleep\" (睡眠的缺乏) 来表达同样的意思。"}]}]}},{"number":"64","item_type":"reading","context_note":"","stem":"What keeps the body strong?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Enough sleep and regular exercise keep the body strong.","explanation_md":"本题同样是信息提取题，但侧重点有所不同。问题是“什么能让身体保持强壮？”。关键词是 \"keeps...strong\"。与上一题问“健康”（healthy）相比，本题的“强壮”（strong）更侧重于身体的力量和活力。因此，在（假定的）文章中，与“强壮”相关的答案最可能是指向能增强体魄的活动和习惯。充足的睡眠有助于身体恢复和生长，而规律的锻炼则直接增强肌肉和骨骼。因此，结合这两点是最佳答案。","knowledge_expansion_md":"### 核心句型与词汇辨析\n\n1.  **核心句型 `keep + O. + adj.`**：这个句型意为“使...保持...状态”，非常常用。\n    *   `O.` 是宾语 (Object)，`adj.` 是宾语补足语 (Adjective)，用来描述宾语的状态。\n    *   例句：`Please keep the room clean.` (请保持房间干净。)\n    *   `Reading keeps my mind sharp.` (阅读使我的头脑保持敏锐。)\n2.  **词汇辨析：`strong` vs `healthy`**\n    *   `healthy` (健康的)：指身体机能正常，没有疾病。范围较广，是整体状态。\n    *   `strong` (强壮的)：通常指有力量的，肌肉发达的，身体结实的。更侧重于物理力量和抵抗力。\n    *   一个人可以是 `healthy` 但不 `strong`，但一个 `strong` 的人通常也是 `healthy` 的。\n3.  **回答 `What` 作主语的问句**：本题句型是 `What keeps...?`，`What` 在句中充当主语。回答时，只需将 `What` 替换成相应的人、事或物即可构成一个完整的陈述句。例如，若答案是 `Exercise`，则陈述句为 `Exercise keeps the body strong.`","socratic_tracks":[{"title":"句型分析：'keep sb./sth. + adj.'","steps":[{"question":"我们来看一下题目中的 \"keeps the body strong\" 这个结构。这里的 \"keeps\" 是什么意思？","hint":"想一想 \"keep quiet\" (保持安静) 这个短语。","takeaway":"\"keeps\" 在这里是“使……保持”的意思。"},{"question":"这个句型是 \"keep + 名词 + 形容词\"。你能模仿 \"keeps the body strong\" 再造一个句子吗？比如，让房间保持干净。","hint":"名词是 the room，形容词是 clean。","takeaway":"我们可以说：I keep my room clean. (我保持我的房间干净。)"},{"question":"所以，\"What keeps the body strong?\" 这个问题实际上是在问什么？","hint":"把 \"What\" 替换成“什么东西”。","takeaway":"这个问题是在问：“是什么东西让我们的身体保持强壮？”"}]},{"title":"词义辨析：strong vs. healthy","steps":[{"question":"我们前面有一道题问的是如何保持 \"healthy\" (健康)，这道题问的是如何保持 \"strong\" (强壮)。这两个词的意思完全一样吗？","hint":"一个不常生病的老奶奶是 healthy 还是 strong？一个举重运动员呢？","takeaway":"不完全一样。\"healthy\" 侧重于没有疾病、身体机能好，而 \"strong\" 侧重于有力量、结实。"},{"question":"那么，想要变得 \"strong\"，除了健康的饮食和睡眠，通常还需要特别做什么？","hint":"什么活动可以锻炼肌肉？","takeaway":"想要变得强壮，通常需要进行体育锻炼 (exercise) 或运动 (sports)。"},{"question":"因此，在回答这个问题时，我们应该更侧重于寻找文章中提到的哪些方面？","hint":"是关于心情的，还是关于身体活动的？","takeaway":"我们应该更侧重于寻找与力量、能量和体育活动相关的内容。"}]},{"title":"回答主语为'What'的问句","steps":[{"question":"观察这个问句 \"What keeps the body strong?\"。你觉得这个句子的主语是哪个词？","hint":"动词是 keeps，谁发出了 keeps 这个动作？","takeaway":"这个句子的主语是疑问词 \"What\" 本身。"},{"question":"当我们回答这类问题时，我们的答案其实就是用来替换那个 \"What\" 的。如果答案是 \"Exercise\"，那么替换后会形成一句什么话？","hint":"把 \"What\" 换成 \"Exercise\" 读一下。","takeaway":"替换后就是 \"Exercise keeps the body strong.\" (锻炼使身体保持强壮)。"},{"question":"所以，回答这类问题的简单方法是什么？","hint":"找到能替换 \"What\" 并使句子通顺合理的名词或短语。","takeaway":"回答这类问题的关键是找到那个能充当主语并完成句子动作的“东西”。"}]}]}},{"number":"65","item_type":"reading","context_note":"","stem":"What takes food to all parts of our body?","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"Blood","explanation_md":"这道题考察在阅读语篇中获取特定信息的能力。问题是：“什么把食物带到我们身体的各个部位？”根据我们关于人体的基本生物学知识，血液在循环系统中流动，负责将食物消化后产生的营养物质和氧气输送到全身各处。因此，在相关的科普阅读文章中，我们能够找到信息点，即血液（Blood）承担了这项运输功能。","knowledge_expansion_md":"**1. 词汇拓展：人体与健康**\n*   **Circulatory System (循环系统):** 包括 heart (心脏), blood (血液), blood vessels (血管)。\n*   **Nutrients (营养物质):** 从 food (食物) 中获取的物质，为身体提供能量。\n*   **Oxygen (氧气):** 身体机能所必需的气体，也由血液输送。\n*   **Digest (消化):** 胃 (stomach) 的主要功能。\n\n**2. 语法分析：特殊疑问句**\n*   本题是一个由 `What` 引导的特殊疑问句，并且是就主语提问。\n*   结构为：`What + 动词（第三人称单数）+ ...?`\n*   回答这类问题时，通常直接用一个名词或名词短语来替代 `What` 的位置，构成一个陈述句。例如：`Blood takes food to all parts of our body.`","socratic_tracks":[{"title":"阅读策略：定位关键信息","steps":[{"question":"看到 “What” 开头的提问，你觉得它在问关于什么类型的信息？是问时间、地点还是某个事物？","hint":"想一想 What, Where, When, Who 这些疑问词各自的含义。","takeaway":"“What” 通常用来提问关于“什么事物”或“什么东西”。"},{"question":"问题中有哪些关键词可以帮助我们在文章中快速找到答案？","hint":"注意那些最核心的名词和动词，比如“食物”、“带到”、“身体各部位”。","takeaway":"通过定位问题中的关键词“food”、“takes”、“parts of our body”，可以快速在原文中找到相关句子。"},{"question":"如果文章里说“血液负责运输营养”，这能回答“什么把食物带到全身”这个问题吗？为什么？","hint":"想一想“营养”和“食物”之间的关系。","takeaway":"能够回答，因为“营养”正是从“食物”中来的，运输营养就是运输食物的精华部分。"}]},{"title":"背景知识：人体循环系统","steps":[{"question":"我们吃完饭后，食物进入了胃里。但我们的脚趾头和手指头为什么也能获得能量呢？","hint":"身体里一定有某种“快递系统”在工作。","takeaway":"食物的能量需要通过一个遍布全身的系统来输送。"},{"question":"我们身体里红色的、一直在流动的液体是什么？它的主要工作是什么？","hint":"受伤时，你会看到它流出来。","takeaway":"这种液体是血液，它的主要工作之一就是在全身循环，进行物质运输。"},{"question":"那么，结合以上两点，我们身体里负责运送食物（营养）的“快递员”是谁？","hint":"就是那个遍布全身的“快递系统”里的主要物质。","takeaway":"血液就是将食物（营养）运送到身体各部位的载体。"}]},{"title":"词汇与语法：理解动词 “take”","steps":[{"question":"在这个句子里，“What takes food to all parts of our body?”，动词 “take” 是什么意思？","hint":"想象一下你“take a book to school”的场景，你是如何移动这本书的？","takeaway":"在这里，“take” 的意思是“携带、运送、拿(到/去)”。"},{"question":"你能用 “take” 的这个意思再造一个句子吗？比如描述公交车的功能。","hint":"公交车每天都把我们从家“运送”到学校。","takeaway":"例如：“The school bus takes me to school every day.”"},{"question":"所以，这个问题其实是在问：执行“运送食物”这个动作的主体是什么？","hint":"回答这个问题，就是找出那个“运送者”。","takeaway":"理解动词“take”的含义是准确把握问题意图的关键。"}]}]}}]},{"section_title":"VII. 书面表达 (共15分)","section_instruction":"假如你是 Sally, 请给你的笔友 John 写一封信, 介绍你的新学校。\n注意: 开头已给出, 全文80词左右。","items":[{"number":"66","item_type":"writing","context_note":"","stem":"Dear John,\nHow are you recently?\nI'm writing to introduce my new school to you.","options":{"A":"","B":"","C":"","D":""},"answer_area_hint":"","teaching":{"correct_answer":"My new school is called Chengdu Experimental School. It's very big and beautiful, with a large library and a swimming pool. The teachers here are kind and patient, and I've already made some new friends. We have many interesting subjects and clubs. I like it here very much. Hope to hear from you soon!","explanation_md":"这是一篇给朋友的信，目的是介绍自己的新学校。写作时，首先要注意书信的格式和非正式、友好的语气。内容上，应围绕“新学校”这一主题展开，可以从学校环境（大、漂亮）、设施（图书馆、游泳池）、师生（老师和蔼、交到新朋友）以及学习生活（有趣的课程和社团）等多个方面进行描述。最后，以表达自己的喜爱之情和期待朋友回信来结尾，使信件内容完整、情感真挚。","knowledge_expansion_md":"**1. 写作结构：描述性段落**\n*   **总起句 (Topic Sentence):** 开头先对学校做总体介绍，如 `My new school is great.`\n*   **细节支撑 (Supporting Details):** 分点具体描述，可遵循“由远及近”或“由整体到局部”的顺序。例如，先说校园大，再说具体的设施；先说老师，再说同学。\n*   **结尾句 (Concluding Sentence):** 总结自己的感受，如 `I really enjoy my school life here.`\n\n**2. 常用句型与词汇**\n*   **描述环境:** `It is big/beautiful/modern.` `There is a large playground.` `It has a new library.`\n*   **描述人物:** `The teachers are kind/patient/helpful.` `My classmates are friendly.`\n*   **描述活动:** `We have interesting classes.` `I joined the basketball club.`\n*   **表达情感:** `I like...` `I enjoy...` `It's fun to...`\n\n**3. 书信格式**\n*   虽然本题只要求写正文，但完整的书信还包括 `Dear [Name],` (称呼) 和 `Yours,/Best wishes,` (结束语) 以及自己的署名。","socratic_tracks":[{"title":"写作构思：如何介绍一所学校","steps":[{"question":"如果要你向朋友介绍你的新学校，你会从哪几个方面来介绍呢？","hint":"想一想学校里有什么？比如，看的见的建筑，和看不见的人与活动。","takeaway":"介绍学校可以从硬件设施、师生情况、课程活动和个人感受等方面展开。"},{"question":"怎样安排这些介绍的顺序，能让你的朋友听起来更清晰、更有条理？","hint":"通常是先给一个总体印象，然后再说具体的细节。","takeaway":"可以采用“总-分-总”的结构：先总体评价，然后分点细说，最后总结感受。"},{"question":"在信的结尾，除了说“再见”，还能说些什么让你的朋友感觉更亲切？","hint":"写信是双向的交流，你介绍了自己的情况，是不是也想听听对方的？","takeaway":"结尾时可以表达对朋友的问候或期待对方回信，如“What about you?”或“Write back soon!”"}]},{"title":"语言运用：丰富你的表达","steps":[{"question":"除了用 “good” 或 “nice”，你还能想到哪些更具体的词来形容你的学校、老师和课程？","hint":"学校可以是“大的(big)”“现代的(modern)”，老师可以是“和蔼的(kind)”，课程可以是“有趣的(interesting)”。","takeaway":"使用更精确的形容词能让你的描述更加生动具体。"},{"question":"介绍学校有什么设施时，除了 “The school has...”，你还能用什么句型？","hint":"想想 “这里有...” 应该怎么说？","takeaway":"可以使用 “There is/are...” 句型来介绍某地有什么，使句式更多样化。"},{"question":"如何将“老师很好”和“我交了新朋友”这两件事自然地连接起来？","hint":"可以使用一些表示“并且”、“而且”的连词。","takeaway":"使用 `and`, `also`, `what's more` 等连词可以让句子之间的衔接更流畅。"}]},{"title":"任务达成：紧扣题目要求","steps":[{"question":"这封信是写给谁的？你应该用什么样的语气和语言风格？","hint":"信的开头是 “Dear John,”，John 是你的朋友。","takeaway":"写给朋友的信，应该使用非正式的、口语化的友好语气。"},{"question":"题干中已经给出了信的开头，它的主要目的是什么？","hint":"读一读开头最后一句：“I'm writing to introduce my new school to you.”","takeaway":"这封信的核心任务是“介绍新学校”，所有内容都应围绕这个中心展开。"},{"question":"一篇优秀的作文不仅要内容充实，还要注意什么？","hint":"想一想老师批改作文时会关注哪些方面，比如单词拼写、句子通顺等。","takeaway":"完成写作后，要检查单词拼写、语法和标点符号，确保没有明显错误。"}]}]}}]}],"content_markdown":"# 成都七中实验学校(冠城实验)2026级新初一入学考试英语试卷(二)\n\n**满分**: 100分\n**时间**: 60分钟\n\n### I. 单项选择 (共20分)\n\n1. There are two _____ in our school.\n    A. library\n    B. libraries\n    C. Librarys\n    D. \n2. There aren't _____ apples in the basket, but there are some on the table.\n    A. some\n    B. any\n    C. a\n    D. \n3. —Is there a dining hall in your school?\n   —_____\n    A. Yes, there are.\n    B. No, there is.\n    C. Yes, there is.\n    D. \n4. Look, my grandfather is _____.\n    A. on the left of\n    B. next\n    C. on right of\n    D. \n5. —Have you got a dictionary?\n   —_____\n    A. Yes, I do.\n    B. Yes, I got.\n    C. Yes, I have.\n    D. \n6. —Where are _____?\n   —They are on the chair.\n    A. Tony's books\n    B. Tony's book\n    C. Tony books\n    D. \n7. He _____ any aunts or uncles.\n    A. doesn't has got\n    B. haven't got\n    C. hasn't got\n    D. \n8. —How many computers _____ in your classroom?\n   —There are two.\n    A. are there\n    B. are you have\n    C. does you have\n    D. \n9. —Where _____ you _____?\n   —I'm from Beijing.\n    A. are; from\n    B. do; from\n    C. are; come\n    D. \n10. _____ father is a doctor. What about _____ father?\n    A. His; your\n    B. Her; you's\n    C. His; you\n    D. \n11. There are _____ students in our class. They are 19 boys and 21 girls.\n    A. forty\n    B. fourty\n    C. fourteen\n    D. \n12. Water is healthy drink, _____ Cake isn't healthy drink.\n    A. and\n    B. but\n    C. or\n    D. \n13. Can I have _____ water?\n    A. these\n    B. some\n    C. one\n    D. \n14. Lingling is in _____.\n    A. Class Four, Grade One\n    B. Grade One, Class Four\n    C. Class Four, Grade one\n    D. \n15. What's your _____ fruit?\n    A. very like\n    B. favourite\n    C. much like\n    D. \n16. She can't _____ in the lake.\n    A. swimming\n    B. swiming\n    C. swim\n    D. \n17. There _____ a cat and two dogs in my home.\n    A. be\n    B. is\n    C. are\n    D. \n18. He _____ hamburgers.\n    A. like eat\n    B. likes eating\n    C. like to eats\n    D. \n19. The office building _____ the classrooms.\n    A. behind\n    B. behinds\n    C. is behind\n    D. \n20. _____ there any apples in the kitchen?\n    A. Is\n    B. Be\n    C. Are\n    D. \n\n### II. 智力测验 (共5分)\n\n21. Paris is the capital of _____.\n    A. the USA\n    B. the UK\n    C. France\n    D. Australia\n22. About _____ percent of the earth's surface is covered with water.\n    A. 29\n    B. 82\n    C. 71\n    D. 100\n23. A car travels at a rate of 50 miles per hour. How long will it take to travel 300 miles?\n    A. 250 hours\n    B. 6 hours\n    C. 1/6 hours\n    D. 15,000 hours\n24. The red car is _____ than the black one.\n    A. nice\n    B. nicer\n    C. very nice\n    D. nicest\n25. \"The number of seconds in one day,\" _____ \"The number of minutes in one week.\"\n    A. >\n    B. \u003c\n    C. =\n    D. We don't know\n\n### III. 完形填空 (共10分)\n\nNBA is the most famous basketball game in the world. There __26__ a Chinese player in this game. His name is Yao Ming. He is __27__ player in this game. In his spare time, he __28__ cars. On last Christmas, he drove __29__ old car to visit one of his __30__. On his way, he __31__ a policeman following him. Finally, he stopped and said to the policeman, \"__32__ Christmas, sir. Is there anything wrong with me?\". \"No, of course not,\" answered the policeman. \"Then __33__ did you __34__ me?\" asked Yao. \"__35__ be angry,\" said the policeman. \"You did nothing wrong, I only want to ask you for a signature(签名)!\"\n\n26. \n    A. be\n    B. is\n    C. are\n    D. \n27. \n    A. tall\n    B. the tallest\n    C. tallest\n    D. \n28. \n    A. likes driving\n    B. likes drive\n    C. like driving\n    D. \n29. \n    A. a\n    B. an\n    C. the\n    D. \n30. \n    A. friends\n    B. friend\n    C. the friend\n    D. \n31. \n    A. sees\n    B. seed\n    C. saw\n    D. \n32. \n    A. Marry\n    B. Merry\n    C. Happy\n    D. \n33. \n    A. why\n    B. how\n    C. when\n    D. \n34. \n    A. ask\n    B. follow\n    C. stop\n    D. \n35. \n    A. Don't\n    B. You don't\n    C. You can't\n    D. \n\n### IV. 阅读理解 (共30分)\n\n**A**\nThe following discussion(讨论) took place(发生) between a father and his nine-year-old son.\n\"It's unfair(不公平), Dad. Mum wants me to make my bed, but I don't know how.\"\n\"It's time for you to learn. Where are your clean sheets(床单)?\"\n\"I don't know.\"\n\"What do you mean you don't know? You need to take care of your things.\"\n\"Where are Jack's sheets?\" the father called to his wife.\n\"Right next to ours,\" the wife answered.\nAfter a moment, the father asked slowly, \"Where are ours?\"\n\n**B**\nA girl may pass easily through the first grades. While boys of her age bring home low marks, the girl may easily get good grades. Girls seem to have \"better brains\" in school. Why do so few girls become scientists? Why are the most important things in the adult (成人) world done by men?\nAccording to (根据) scientists, the answer is aggression (好斗行为). Boys usually refuse to accept other people's conclusions(结论). They insist on solving problems by themselves. While little girls are getting high marks in school for remembering what the teacher has told them, little boys are learning to think in their own ways. Boys are usually the ones who get high pay and the powerful jobs because they are to be aggressive at an early age.\n\n**C**\nAnswer the questions according to the poster.\nVisit Swansea Zoo\nCome and see the Indian elephants and new tigers from America. The bears are waiting to meet you and the monkeys from China are waiting for you. The lovely dogs from Australia are waiting to smile at you. And the giraffes from Zambia are waiting for you to visit them. You can take photos with these lovely animals.\nTickets\nAdults: $2.00\nChildren: Over 12, $1.00\nUnder 12 Free\nOpening hours\n9:00 a.m. - 4:00 p.m. (except 除了 Friday)\n10:00 a.m. - 3:00 p.m. Friday\nKeep the zoo clean!\nDo not touch, feed or go near the animals!\n\n36. The discussion took place between _____.\n    A. a husband and a wife\n    B. a mother and her son\n    C. a father and his son\n    D. a mother and a father\n37. The son didn't know _____.\n    A. how to wash his sheets\n    B. how to make his bed\n    C. how to clean his sheets\n    D. how to clean his bed\n38. The father didn't know _____.\n    A. how to wash sheets\n    B. how to make his bed\n    C. how to clean sheets\n    D. where his sheets were\n39. The father said his son was _____ because he didn't know where his _____ were.\n    A. careful; sheets\n    B. careless; bed\n    C. careful; bed\n    D. careless; sheets\n40. Who do you think takes care of the housework(家务) in the family?\n    A. The father.\n    B. The mother.\n    C. The child.\n    D. No one.\n41. Girls get better marks at school than boys because _____.\n    A. boys are lazier\n    B. girls are better at remembering things than boys\n    C. girls are cleverer than boys\n    D. teachers care more for girls than for boys\n42. There are so few women scientists because _____.\n    A. boys are cleverer than girls\n    B. girls are less cared for\n    C. girls are lazier\n    D. few of them are trained to be aggressive\n43. According to the scientists, we can learn that _____.\n    A. boys are good at thinking in their own ways while girls are remembering things\n    B. boys can easily get good jobs while girls can't\n    C. girls insist on doing things on their own\n    D. the nature of the boys and girls is the same, but their education is different\n44. We can learn from the article that _____.\n    A. girls have better brains\n    B. boys have better brains\n    C. neither boys nor girls have better brains\n    D. usually great scientists are men and most important things are done by men\n4f. Which of the following is right?\n    A. Boys are cleverer in school.\n    B. Girls are cleverer at an early age.\n    C. Boys and girls have good points in different ways.\n    D. Boys have good points only when they enter the adult world.\n46. How many kinds of animals are talked about in the passage?\n    A. Five.\n    B. Six.\n    C. Seven.\n    D. \n47. A child under 12 can go to the zoo _____.\n    A. with a ticket of $1.00\n    B. with a ticket of $2.00\n    C. for free\n    D. \n48. Now Mr Smith is in the zoo with his two sons, one aged 14 and the other 10, how much are the tickets together?\n    A. $2.00.\n    B. $3.00.\n    C. $4.00.\n    D. \n49. Which of the following is the visiting time?\n    A. 8:00 a. m. Monday.\n    B. 9:30 a. m. Friday.\n    C. 3:00 p. m. Sunday.\n    D. \n50. Which of the following can we do in the zoo?\n    A. To give some food to the fish.\n    B. To take a few nice photos.\n    C. To throw things at animals.\n    D. \n\n### V. 根据首字母写单词 (共10分)\n\n51. I'm ten years old and my sister is two years older than me, so she is t_____ years old.\n\n52. Chinese people are very good at table t_____, and it's our favourite sport.\n\n53. Lingling is now reading books in the school l_____.\n\n54. I have a pen friend, and we always send e_____ to each other by computer.\n\n55. Ice-cream and candies are not healthy food. They are u_____ food.\n\n56. What's the w_____ like in spring? It's warm.\n\n57. When you see foreign friends in our school, you can say to them \"W_____ to my school\".\n\n58. My uncle is a worker. He works in a f_____.\n\n59. Your father and your mother are your p_____.\n\n60. Don't take this book because it is mine. Y_____ is on the table.\n\n### VI. 阅读与表达 (共10分)\n\n根据短文内容,回答问题。\n\"Early to bed, early to rise\" makes a man healthy, wealthy and wise. It's good for the body.\nThis is an old saying. Have you heard of it before? It means that we must go to bed early at night and get up early in the morning. Then we shall be healthy. We shall also be rich and clever.\nThat is true. The body must have enough sleep to be healthy. Children of young age should have enough sleep, or they can't do their work very well. They will not be wise and they may not become wealthy!\nThe body also needs exercise: walking, running, jumping, swimming, playing games and all other exercise. Exercise keeps the body strong. Exercise also helps the blood to move around inside the body. This is very important. Our blood takes food to all parts of our body. The head also needs blood. Exercise helps us to think better.\n\n61. What does \"Early to bed, early to rise\" mean?\n\n62. What must the body have to be healthy?\n\n63. What will happen to children of young age who don't have enough sleep?\n\n64. What keeps the body strong?\n\n65. What takes food to all parts of our body?\n\n### VII. 书面表达 (共15分)\n\n假如你是 Sally, 请给你的笔友 John 写一封信, 介绍你的新学校。\n注意: 开头已给出, 全文80词左右。\n\n66. Dear John,\n    How are you recently?\n    I'm writing to introduce my new school to you.\n\n","proofread_notes":"1. 原卷有多处彩色水印，部分文字识别困难，已尽力还原。\n2. 单选题和完形填空题部分选项不足四个，已补充空字符串以符合 A/B/C/D 四选项规范。\n3. 题号 4 题干 `Look, my grandfather is _____.` 缺少上下文（如图片），导致语义不完整，但为忠于原卷，保留了原样。\n4. 题号 12 题干 `Water is healthy drink, _____ Cake isn't healthy drink.` 存在语法错误（如缺少冠词），为忠于原卷，未作修改。\n5. 原卷保留了一些拼写错误，如 11(B) `fourty` (应为 forty), 16(B) `swiming` (应为 swimming), 32(A) `Marry` (应为 Merry)，均按原样保留。\n6. 阅读理解 C 部分前有一段无关联的中文“岩朗-拉姆·诺瑞德”，已删除。\n7. 题号 40 的内容与文章 B 无关，似乎应对应文章 A。为忠于原卷结构，未作调整，但这可能是原卷的排版错误。\n8. 写作题（题号 66）的中文说明原为“介绍你的小学”，与英文提示及考试背景（新初一）不符，已修正为“介绍你的新学校”。","set_number":16,"source_images":["C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_16\\page_028.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_16\\page_029.png","C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow\\set_16\\page_030.png"],"pipeline":{"mode":"publication_from_images","workflow":"C:\\Users\\wl88i\\Desktop\\小升初试卷\\set_image_workflow","log":{"steps":[{"step":1,"name":"extract","items":66},{"step":2,"name":"verify","items":66,"check_passed":true,"issues_count":0},{"step":3,"name":"polish","items":66}]},"second_text_pass":false},"teaching_meta":{"enriched_at_utc":"2026-03-29T11:57:33.355365+00:00","vertex_model_requested":"gemini-2.5-pro","stub":false}}</script>

  let modalWordForTts = "";

    return k.length >= 8;

  async function deepseekChat(userContent, maxTokens) {
    if (!hasDeepseekKey()) {
      throw new Error("未配置 DeepSeek API Key");

    const r = await fetch("https://api.deepseek.com/chat/completions", {

      credentials: "omit",
      headers: {
        "Content-Type": "application/json",

    let data = {};

      throw new Error(msg);

    const c = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    return (c || "").trim();

  function xmlEscapeTts(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  const TYPE_LABELS = {
    phonetics: "语音辨识",
    choice: "单项选择",
    cloze: "完形填空",
    grammar_fill: "语法填空",
    reading: "阅读理解",
    sentence_transform: "句型转换",
    writing: "书面表达",
    fill_blank: "词汇填空",

    fill_blank_word_form: "词汇变形填空",
    other: "其他题型",
  };
  const TYPE_ORDER = [
    "phonetics",

    "grammar_fill",
    "sentence_transform",
    "writing",
    "fill_blank_be",
    "fill_blank_word_form",

  ];

  function isFillBlankQuizType(t) {
    return t === "fill_blank" || t === "fill_blank_be" || t === "fill_blank_word_form";
  }

  function isClozeLikeQuizType(t) {
    return t === "cloze" || t === "grammar_fill";
  }

  function isSectionShardId(t) {
    return typeof t === "string" && /^sec:\d+$/.test(t);
  }
  function parseSectionShardIndex(t) {
    const m = /^sec:(\d+)$/.exec(String(t || ""));
    return m ? parseInt(m[1], 10) : -1;
  }
  const SECTION_ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  function sectionRomanFromIndex(si) {
    if (si >= 0 && si < SECTION_ROMAN.length) return SECTION_ROMAN[si];
    return String(si + 1);
  }
  function sectionShardLabel(shardId) {
    const si = parseSectionShardIndex(shardId);
    if (si < 0) return String(shardId || "");
    const sec = (EXAM.sections || [])[si];
    const st = sec && String(sec.section_title || "").trim();
    if (st) return st;
    const rows = state.bySection[shardId] || [];
    const st2 = rows.length ? String(rows[0].section_title || "").trim() : "";
    if (st2) return st2;
    const rt = rows[0] && rows[0].type;
    const typeHint = rt && TYPE_LABELS[rt] ? "（" + TYPE_LABELS[rt] + "）" : "";
    return "第 " + sectionRomanFromIndex(si) + " 部分" + typeHint;
  }
  function sectionRowsRenderKind(rows) {
    if (!rows || !rows.length) return "empty";
    const t0 = rows[0].type;
    for (let ri = 1; ri < rows.length; ri++) {
      if (rows[ri].type !== t0) return "mixed";
    }
    if (t0 === "reading") return "reading";
    if (isClozeLikeQuizType(t0)) return "cloze";
    if (isFillBlankQuizType(t0)) return "fill_blank";
    return t0;
  }
  function sectionRowsPrimaryType(rows) {
    if (!rows || !rows.length) return "other";
    return rows[0].type;
  }
  function sectionsInPaperOrder() {
    const seen = Object.create(null);
    const out = [];
    (state.flat || []).forEach((row) => {
      const id = "sec:" + row.si;
      if (seen[id]) return;
      if (!(state.bySection[id] || []).length) return;
      seen[id] = true;
      out.push(id);
    });
    return out;
  }

  const state = {
    flat: [],
    byType: {},
    bySection: {},
    currentType: null,
    answers: {},
    elapsed: 0,
    timerId: null,
    lastResults: [],
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /** 语音辨识题干：仅允许 &lt;u&gt;…&lt;/u&gt; 标画线部分，其余 HTML 剥离 */
  function stemHtmlWithAllowedUnderline(raw) {
    let t = String(raw || "");
    t = t.replace(/<\s*u\s*>/gi, "@@UON@@").replace(/<\s*\/\s*u\s*>/gi, "@@UOFF@@");
    t = t.replace(/<[^>]+>/g, "");
    t = esc(t);
    return t
      .replace(/@@UON@@/g, "<u class=\"phonetic-ul\">")
      .replace(/@@UOFF@@/g, "</u>")
      .replace(/\n/g, "<br>");
  }

  function writingStemHasPipeTable(stem) {
    return /^\s*\|/m.test(String(stem || ""));
  }

  function splitMarkdownPipeRow(line) {
    return String(line || "")
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim());
  }

  function isMarkdownTableSeparatorRow(line) {
    const cells = splitMarkdownPipeRow(line);
    return cells.length > 0 && cells.every((c) => /^[\s\-:|]+$/.test(c));
  }

  /** GitHub 风格 | 表格 | 行 → HTML（用于书面表达题干） */
  function markdownPipeTableLinesToHtml(tableLines) {
    const lines = tableLines || [];
    if (lines.length < 2) return "";
    const rowCells = lines.map(splitMarkdownPipeRow);
    let bodyStart = 0;
    let thead = "";
    if (lines.length >= 2 && isMarkdownTableSeparatorRow(lines[1])) {
      thead =
        "<thead><tr>" +
        rowCells[0].map((c) => "<th>" + esc(c) + "</th>").join("") +
        "</tr></thead>";
      bodyStart = 2;
    }
    let body = "<tbody>";
    for (let r = bodyStart; r < rowCells.length; r++) {
      body +=
        "<tr>" + rowCells[r].map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>";
    }
    body += "</tbody>";
    return '<table class="writing-prompt-table">' + thead + body + "</table>";
  }

  /** 将正文与 GitHub 风格 | 表格 | 行块拆成交替片段（书面题干 / 大题说明共用） */
  function partitionMarkdownTextAndPipeTables(raw) {
    const str = String(raw || "").replace(/\r\n/g, "\n");
    const lines = str.split("\n");
    const chunks = [];
    let textBuf = [];
    let i = 0;
    function flushText() {
      if (!textBuf.length) return;
      const t = textBuf.join("\n").trim();
      if (t) chunks.push({ kind: "text", text: t });
      textBuf = [];
    }
    while (i < lines.length) {
      if (/^\s*\|/.test(lines[i])) {
        flushText();
        const tbl = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          tbl.push(lines[i]);
          i++;
        }
        if (tbl.length >= 2) chunks.push({ kind: "table", lines: tbl });
        else textBuf.push.apply(textBuf, tbl);
      } else {
        textBuf.push(lines[i]);
        i++;
      }
    }
    flushText();
    return chunks;
  }

  function writingMixedMarkdownToHtml(raw, renderTextChunk) {
    let html = "";
    partitionMarkdownTextAndPipeTables(raw).forEach((ch) => {
      if (ch.kind === "text") html += renderTextChunk(ch.text);
      else html += markdownPipeTableLinesToHtml(ch.lines);
    });
    return html;
  }

  /** 书面表达题干：正文段落 + Markdown 管道表格 → HTML */
  function writingPromptToHtml(stem) {
    return writingMixedMarkdownToHtml(
      stem,
      (t) =>
        "<div class='writing-stem-text'>" + esc(t).replace(/\n/g, "<br>") + "</div>",
    );
  }

  /**
   * 试卷 JSON 里阅读/完形文章通常用「单个 \\n」分段，没有空行。
   * 按换行拆成多段，每段独立 &lt;p&gt;，段间距由 .passage-para 控制。
   */
  function formatPassageParagraphs(raw) {
    const s = String(raw == null ? "" : raw).replace(/\r\n/g, "\n").trim();
    if (!s) return "";
    const parts = s.split(/\n+/);
    const out = [];
    for (let pi = 0; pi < parts.length; pi++) {
      const t = parts[pi].trim();
      if (!t) continue;
      out.push("<p class='passage-para'>" + esc(t).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("");
  }

  /** 完形讲解等：源码换行已变成 br，按每个 br 拆成段落（与 formatPassageParagraphs 一致） */
  function formatPassageHtmlParagraphs(html) {
    if (!html) return html;
    const parts = String(html).split(/(?:<br\s*\/?>\s*)+/i);
    const trimmed = parts.map((p) => p.replace(/^[\s\u00a0]+|[\s\u00a0]+$/g, "")).filter(Boolean);
    if (!trimmed.length) return html;
    return trimmed.map((p) => "<p class='passage-para'>" + p + "</p>").join("");
  }

  function itemKey(si, ii) { return si + ":" + ii; }

  function buildFlat() {
    state.flat = [];
    (EXAM.sections || []).forEach((sec, si) => {
      (sec.items || []).forEach((it, ii) => {
        if (!String(it.number || "").trim()) {
          it.number = String(si + 1) + "." + String(ii + 1);
        }
        const typ = (it.item_type || "other").trim() || "other";
        state.flat.push({
          si, ii, it, key: itemKey(si, ii), type: typ,
          section_title: sec.section_title || "",
          section_instruction: sec.section_instruction || "",
        });
      });
    });
    state.byType = {};
    state.bySection = {};
    state.flat.forEach((row) => {
      if (!state.byType[row.type]) state.byType[row.type] = [];
      state.byType[row.type].push(row);
      const sid = "sec:" + row.si;
      if (!state.bySection[sid]) state.bySection[sid] = [];
      state.bySection[sid].push(row);
    });
  }

  function typeLabel(t) {
    if (isSectionShardId(t)) return sectionShardLabel(t);
    return TYPE_LABELS[t] || t || "其他";
  }

  function showView(name) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    document.getElementById("view-" + name).classList.add("active");
  }

  function splitReadingPassageHeading(body) {
    const raw = String(body || "").trim();
    if (!raw) return { title: "阅读材料", text: "" };
    const lines = raw.split("\n");
    const first = (lines[0] || "").trim();
    if (/^Passage\s+[A-Z]\b/i.test(first) || /^阅读\s*[A-ZＡ-Ｚ]/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: first, text: rest || raw };
    }
    if (/^[A-Z]$/i.test(first)) {
      const rest = lines.slice(1).join("\n").trim();
      return { title: "Passage " + first.toUpperCase(), text: rest || raw };
    }
    return { title: "阅读材料", text: raw };
  }

  /** 大题说明里常见「说明 + 空行 + 方框词/短文」，拆成提示与正文（阅读问答 / 选词填空） */
  function splitSectionHintAndBody(sectionInstruction) {
    const raw = String(sectionInstruction || "").trim();
    if (!raw) return { hint: "", body: "" };
    const parts = raw.split(/\n\n+/);
    if (parts.length >= 2) {
      return { hint: parts[0].trim(), body: parts.slice(1).join("\n\n").trim() };
    }
    return { hint: "", body: raw };
  }

  /**
   * 阅读/书面左侧材料来自整段 section_instruction（fromSection）时，全文即正文。
   * 若仍走 splitSectionHintAndBody，首段会被当成灰色「导语」，与后续段落样式不一致（如 set_05 Passage A/B）。
   */
  function passageHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(
        s,
        (t) =>
          "<div class='writing-stem-text writing-section-from-instruction'>" +
          esc(t).replace(/\n/g, "<br>") +
          "</div>",
      );
    }
    return formatPassageParagraphs(s);
  }

  function passageExamHtmlFromSectionInstruction(passage) {
    const s = String(passage || "").trim();
    if (!s) return "";
    if (writingStemHasPipeTable(s)) {
      return writingMixedMarkdownToHtml(s, (t) => formatPassageParagraphsExam(t));
    }
    return formatPassageParagraphsExam(s);
  }

  function isReadingPassageLetterKey(key) {
    return /^Passage\s+[A-Z]$/i.test(String(key || "").trim());
  }

  /** 首题带全文、后续题仅「Passage A」时，用篇名归一化分组（与 JSON 常见格式一致） */
  function readingPassageGroupKey(note) {
    const raw = String(note || "").trim();
    if (!raw) return "";
    const firstLine = (raw.split("\n")[0] || "").trim();
    const m = firstLine.match(/^Passage\s+([A-Z])\b/i);
    if (m) return "Passage " + m[1].toUpperCase();
    const m2 = firstLine.match(/^阅读\s*([A-Za-zＡ-Ｚ])/i);
    if (m2) {
      const ch = String(m2[1]).replace(/Ａ/gi, "A").replace(/Ｂ/gi, "B").replace(/Ｃ/gi, "C").charAt(0).toUpperCase();
      return "Passage " + ch;
    }
    const mcn = firstLine.match(/^根据材料[（(]([一二三四五六七八九十]+)[）)]/);
    if (mcn) {
      const mapCn = {
        一: "A",
        二: "B",
        三: "C",
        四: "D",
        五: "E",
        六: "F",
        七: "G",
        八: "H",
        九: "I",
        十: "J",
      };
      const L = mapCn[mcn[1]];
      if (L) return "Passage " + L;
    }
    return raw;
  }

  function pickReadingPassageBody(rows) {
    let best = "";
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.indexOf("\n") >= 0 && n.length > best.length) best = n;
    }
    if (best) return best;
    for (let ri = 0; ri < rows.length; ri++) {
      const n = String(rows[ri].it.context_note || "").trim();
      if (n.length > best.length) best = n;
    }
    return best;
  }

  /** context_note 仅为篇名标签、无正文时，用大题 section_instruction 作为阅读/书面材料 */
  function isTrivialReadingPassageBody(text) {
    const t = String(text || "").trim();
    if (!t) return true;
    if (/^Passage\s+[A-Z]$/i.test(t)) return true;
    /* set_16 等：Passage C (Swansea Zoo Poster) 单行篇名 */
    if (
      /^Passage\s+[A-Z]\b/i.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 500
    )
      return true;
    if (/^阅读\s*[A-ZＡ-Ｚ]$/i.test(t)) return true;
    /* set_04 等：context_note 为单行英文篇名，如 "Reading passage about Linda and Mary" */
    if (/^Reading passage\b/i.test(t) && t.indexOf("\n") < 0 && t.length < 220) return true;
    /* set_07 等：单行篇名 "Passage about …"，正文在大题 section_instruction */
    if (/^Passage\s+/i.test(t) && t.indexOf("\n") < 0 && t.length < 320) return true;
    /* set_15 等：context_note 为「根据材料(一)作答。」，正文在大题 section_instruction 的 (一)(二) 篇 */
    if (
      /^根据材料[（(][一二三四五六七八九十0-9]+[）)]/.test(t) &&
      t.indexOf("\n") < 0 &&
      t.length < 120
    )
      return true;
    return false;
  }

  /** 真题中阅读 A/B 小题可能标为 choice / 填空判断，但 context_note 含 Passage A|B，应与 reading 一样聚篇展示 */
  function isPassageKeyedQuizRow(row) {
    if (row.type === "reading") return true;
    if (row.type !== "choice" && !isFillBlankQuizType(row.type)) return false;
    return !!readingPassageGroupKey(String(row.it.context_note || "").trim());
  }

  /**
   * 大题说明里多篇用 Markdown 标题 **A** / **B** 分隔（如 set_05），按 Passage A|B 只取对应正文。
   */
  function extractReadingBlockForPassageLetter(fullText, passageKey) {
    const pk = String(passageKey || "").trim();
    const mPk = /^Passage\s+([A-Z])$/i.exec(pk);
    if (!mPk) return String(fullText || "").trim();
    const letter = mPk[1].toUpperCase();
    const t = String(fullText || "");
    const cnDigit = { A: "一", B: "二", C: "三", D: "四" };
    const dig = cnDigit[letter];
    if (dig) {
      const mdCn = new RegExp("\\*\\*\\s*[（(]" + dig + "[）)]\\s*\\*\\*", "m");
      const mc = mdCn.exec(t);
      if (mc) {
        const bodyStartCn = mc.index + mc[0].length;
        const tailCn = t.slice(bodyStartCn);
        let endCn = tailCn.length;
        const order = "一二三四五六七八九十";
        const di = order.indexOf(dig);
        if (di >= 0 && di < order.length - 1) {
          const nextD = order[di + 1];
          const nxMd = tailCn.search(new RegExp("\\*\\*\\s*[（(]" + nextD + "[）)]\\s*\\*\\*"));
          if (nxMd >= 0) endCn = nxMd;
        }
        const outCn = tailCn.slice(0, endCn).trim();
        if (outCn.length >= 15) return outCn;
      }
    }
    const escL = letter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const mdHdr = new RegExp("\\*\\*\\s*" + escL + "\\s*\\*\\*", "i");
    const mm = mdHdr.exec(t);
    let bodyStart;
    if (mm) {
      bodyStart = mm.index + mm[0].length;
    } else {
      const plain = new RegExp("(?:^|[\\r\\n])\\s*Passage\\s+" + escL + "\\b", "i");
      const mp = plain.exec(t);
      if (mp) {
        bodyStart = mp.index + mp[0].length;
      } else {
        /* set_16 等：篇首为单独一行的 A / B / C，非 Passage A 字样 */
        const singleLetterHdr = new RegExp("(?:^|[\\r\\n])\\s*" + escL + "\\s*(?:\\r?\\n)+", "i");
        const ms = singleLetterHdr.exec(t);
        if (ms) bodyStart = ms.index + ms[0].length;
        else return t.trim();
      }
    }
    const tail = t.slice(bodyStart);
    let end = tail.length;
    const mdNext = tail.search(/\*\*\s*[A-Za-z]\s*\*\*/);
    if (mdNext >= 0) end = mdNext;
    const nc = letter.charCodeAt(0) + 1;
    if (nc <= "Z".charCodeAt(0)) {
      const nL = String.fromCharCode(nc);
      const nEsc = nL.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const reNextSep = new RegExp("\\r?\\n\\s*" + nEsc + "\\s*\\r?\\n");
      const nx = tail.search(reNextSep);
      if (nx >= 0 && nx < end) end = nx;
      const rePassageNext = new RegExp("\\r?\\n\\s*Passage\\s+" + nEsc + "\\b", "i");
      const nxp = tail.search(rePassageNext);
      if (nxp >= 0 && nxp < end) end = nxp;
    }
    const out = tail.slice(0, end).trim();
    return out.length >= 15 ? out : t.trim();
  }

  function passageOrSectionBodyForSlice(slice, bodyFromPick) {
    const sec0 = slice.length ? String(slice[0].section_instruction || "").trim() : "";
    if (isTrivialReadingPassageBody(bodyFromPick) && sec0.length > 80) {
      const cn = slice.length ? String(slice[0].it.context_note || "").trim() : "";
      const pk = readingPassageGroupKey(cn);
      let passage = sec0;
      if (/^Passage\s+[A-Z]$/i.test(pk)) {
        const part = extractReadingBlockForPassageLetter(sec0, pk);
        if (part.length >= 15) passage = part;
      }
      return { passage, fromSection: true };
    }
    return { passage: bodyFromPick, fromSection: false };
  }

  function groupReadingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (!isPassageKeyedQuizRow(row)) {
        groups.push({ passage: "", rows: [row] });
        i++;
        continue;
      }
      const passage = String(row.it.context_note || "").trim();
      const secIns = String(row.section_instruction || "").trim();
      if (!passage && secIns.length > 60 && row.type === "reading") {
        let j = i + 1;
        while (j < rows.length) {
          const r2 = rows[j];
          if (r2.type !== "reading") break;
          if (String(r2.it.context_note || "").trim()) break;
          if (String(r2.section_instruction || "").trim() !== secIns) break;
          j++;
        }
        groups.push({ passage: secIns, rows: rows.slice(i, j), fromSection: true });
        i = j;
        continue;
      }
      const key = readingPassageGroupKey(passage);
      if (key) {
        let j = i + 1;
        const secIns0 = String(row.section_instruction || "").trim();
        const keyIsLetter = isReadingPassageLetterKey(key);
        while (j < rows.length) {
          const r2 = rows[j];
          if (!isPassageKeyedQuizRow(r2)) break;
          const k2 = readingPassageGroupKey(String(r2.it.context_note || "").trim());
          if (k2 === key) {
            j++;
            continue;
          }
          if (
            !keyIsLetter &&
            isReadingPassageLetterKey(k2) &&
            String(r2.section_instruction || "").trim() === secIns0
          ) {
            j++;
            continue;
          }
          break;
        }
        const slice = rows.slice(i, j);
        const body = pickReadingPassageBody(slice);
        const ps = passageOrSectionBodyForSlice(slice, body);
        groups.push({ passage: ps.passage, rows: slice, fromSection: !!ps.fromSection });
        i = j;
      } else {
        groups.push({ passage: "", rows: [row] });
        i++;
      }
    }
    return groups;
  }

  function groupWritingByPassage(rows) {
    const groups = [];
    let i = 0;
    while (i < rows.length) {
      const row = rows[i];
      if (row.type !== "writing") {
        groups.push({ passage: "", rows: [row] });
