<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按题型学习 · 套题</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #fbfcfa;
      --ink: #1c2420;
      --muted: #5c6860;
      --accent: #2d6a4f;
      --accent-soft: #95d5b2;
      --border: #c8d5cc;
      --ok: #1b7a3d;
      --ok-bg: #d8f5e0;
      --bad: #b42318;
      --bad-bg: #fde8e6;
      --warn: #9a6b2d;
      --warn-bg: #fff4e0;
      --shadow: rgba(28, 36, 32, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(145deg, #e4ebe6 0%, var(--bg) 40%, #dde8e2 100%);
      min-height: 100vh;
    }
    .view { display: none; max-width: 920px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .view.active { display: block; }
    #view-quiz.view-cloze-wide,
    #view-quiz.view-reading-wide {
      max-width: 1220px;
    }
    .reading-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 880px) {
      .reading-quiz-layout {
        grid-template-columns: 1fr;
      }
      .reading-questions-col {
        position: static !important;
        max-height: none !important;
      }
      .reading-passage-card {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-passage-col { min-width: 0; }
    .reading-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .reading-passage-card h2 { margin-top: 0; }
    .reading-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.24rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .reading-questions-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .reading-q-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .reading-q-card .q-head { margin-bottom: 0.45rem; }
    .reading-learn-layout {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(280px, 1fr);
      gap: 1.25rem;
      align-items: start;
      margin-bottom: 1.25rem;
    }
    @media (max-width: 880px) {
      .reading-learn-layout {
        grid-template-columns: 1fr;
      }
      .reading-learn-passage {
        position: static !important;
        max-height: none !important;
      }
    }
    .reading-learn-passage {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-quiz-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 400px);
      gap: 1.35rem;
      align-items: start;
    }
    @media (max-width: 880px) {
      .cloze-quiz-layout {
        grid-template-columns: 1fr;
      }
      .cloze-options-col {
        position: static !important;
        max-height: none !important;
      }
    }
    .cloze-passage-col {
      min-width: 0;
    }
    .cloze-passage-card {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow: auto;
    }
    .cloze-passage-text {
      font-family: "Literata", Georgia, serif;
      white-space: normal;
      font-size: 1.22rem;
      line-height: 1.82;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .cloze-inline-fill-unit .cloze-passage-card {
      position: static;
      max-height: none;
    }
    .cloze-inline-blank .blank-input {
      min-width: 4.2em;
      max-width: 12em;
      vertical-align: baseline;
    }
    .cloze-options-col {
      position: sticky;
      top: 4.5rem;
      max-height: calc(100vh - 5.5rem);
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .cloze-opt-card {
      padding: 0.75rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    /* 补全对话（题干仅为题号占位）：不显示「第 n 空」与说明段落，仅题号 + 选项 */
    .cloze-dialogue-gap-card .q {
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .cloze-dialogue-gap-badge {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }
    /* 阅读：选项纵向单列，A→B→C 自上而下 */
    .reading-q-card .opts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      align-items: start;
    }
    .reading-q-card .opts label {
      padding: 0.35rem 0.45rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .reading-q-card .opts.opts-cols-2,
    .reading-q-card .opts.opts-cols-3,
    .reading-q-card .opts.opts-cols-4 {
      grid-template-columns: 1fr;
    }
    .reading-q-card .opts.opts-bank {
      grid-template-columns: 1fr;
    }
    /* 完形：题号与 A–D 同一行横向排列、垂直对齐 */
    .cloze-opt-card .q {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.75rem;
      margin: 0.55rem 0 0.7rem;
      padding-left: 0.55rem;
    }
    .cloze-opt-card .q-head {
      margin-bottom: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.5rem;
    }
    .cloze-opt-card .opts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
      flex: 1 1 auto;
      min-width: 0;
    }
    .cloze-opt-card .opts label {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 0.2rem 0.25rem;
      font-size: 0.98rem;
      margin: 0;
      min-width: 0;
    }
    .cloze-opt-card .opts label strong {
      display: inline-block;
      min-width: 1.15em;
      flex-shrink: 0;
      font-weight: 700;
    }
    .cloze-opt-card .opts input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-card .opts.opts-cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .cloze-opt-card .opts.opts-bank {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr));
      column-gap: 0.55rem;
      row-gap: 0.35rem;
      align-items: start;
    }
    /* 完形填空（练习页）：A B C 自上而下纵向排列 */
    .cloze-opt-card .opts.opts-cloze-abcd {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 0.35rem;
      align-items: start;
      justify-items: stretch;
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      margin: 0;
      padding: 0.25rem 0.2rem;
      min-width: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full input {
      margin-top: 0.22em;
      flex-shrink: 0;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full span {
      min-width: 0;
      font-size: 0.98rem;
      line-height: 1.35;
    }
    .cloze-opt-abcd.cloze-opt-abcd-full strong {
      font-weight: 700;
    }
    .cloze-learn-block .cloze-learn-passage {
      font-family: "Literata", Georgia, serif;
      font-size: 1.14rem;
      line-height: 1.85;
      letter-spacing: 0.01em;
      color: var(--ink);
      background: #f7faf7;
      padding: 1rem 1.15rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-top: 0.25rem;
    }
    .cloze-filled-ans {
      font-weight: 700;
      color: #0f3d26;
      background: linear-gradient(180deg, transparent 58%, rgba(149, 213, 178, 0.65) 58%);
      padding: 0 0.15em;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    h2.cloze-learn-subhd {
      margin: 1.35rem 0 0.5rem;
      font-size: 1.08rem;
      color: var(--accent);
      font-family: "Literata", Georgia, serif;
      border-bottom: 2px solid rgba(45, 106, 79, 0.2);
      padding-bottom: 0.35rem;
    }
    header.flow {
      position: sticky; top: 0; z-index: 40;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.65rem 1rem; margin: -1rem -1rem 1rem;
      background: rgba(251, 252, 250, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    header.flow h1 {
      margin: 0; flex: 1 1 200px; font-size: 1.05rem; font-weight: 700;
      color: var(--accent); font-family: "Literata", Georgia, serif;
    }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted);
      padding: 0.35rem 0.75rem; background: #fff; border-radius: 10px; border: 1px solid var(--border);
    }
    button.btn {
      font: inherit; cursor: pointer; border: none; border-radius: 10px;
      padding: 0.45rem 1rem; font-weight: 600;
    }
    button.primary { background: linear-gradient(135deg, var(--accent), #1b4d3a); color: #fff; }
    button.secondary { background: #fff; border: 1px solid var(--border); color: var(--ink); }
    button.ghost { background: transparent; border: 1px dashed var(--border); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .type-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.5rem;
    }
    .type-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.15rem 1.2rem; box-shadow: 0 12px 36px var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .type-card:hover { transform: translateY(-2px); box-shadow: 0 16px 44px var(--shadow); }
    .type-card h2 { margin: 0 0 0.35rem; font-size: 1.1rem; color: var(--accent); font-family: "Literata", serif; }
    .type-card .meta { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem 1.15rem; margin-bottom: 1.1rem; box-shadow: 0 8px 28px var(--shadow);
    }
    .card h2 { margin: 0 0 0.65rem; font-size: 1.05rem; color: var(--accent); font-family: "Literata", serif; border-bottom: 2px solid rgba(45, 106, 79, 0.15); padding-bottom: 0.35rem; }
    .passage {
      font-family: "Literata", Georgia, serif; white-space: normal; font-size: 0.95rem;
      line-height: 1.65; background: #f4f8f5; padding: 0.85rem 1rem; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem;
    }
    /* 段与段之间约一整行空白（与各行 line-height 对齐） */
    .passage-para {
      margin: 0;
      line-height: inherit;
    }
    .reading-passage-text .passage-para,
    .cloze-passage-text .passage-para {
      margin-bottom: 1.82em;
    }
    .passage > .passage-para {
      margin-bottom: 1.65em;
    }
    .cloze-learn-passage .passage-para {
      margin-bottom: 1.85em;
    }
    .passage-para:last-child {
      margin-bottom: 0 !important;
    }
    .reading-passage-text > .passage-para:first-child,
    .cloze-passage-text > .passage-para:first-child,
    .passage > .passage-para:first-child {
      margin-top: 0;
    }
    .q { margin: 1rem 0 1.25rem; padding-left: 0.75rem; border-left: 4px solid rgba(45, 106, 79, 0.3); }
    .q-head { display: flex; flex-wrap: wrap; gap: 0.35rem 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
    .q-num { font-weight: 700; color: var(--accent); }
    .tag { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: #e8efe9; padding: 0.12rem 0.45rem; border-radius: 4px; }
    .stem { font-family: "Literata", Georgia, serif; margin: 0.35rem 0 0.5rem; }
    .phonetic-ul {
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 0.09em;
      font-weight: 600;
    }
    .writing-stem { margin: 0.35rem 0 0.6rem; }
    .writing-stem-text {
      font-family: "Literata", Georgia, serif;
      line-height: 1.6;
      margin: 0.4rem 0;
    }
    .writing-prompt-table {
      width: 100%;
      max-width: 36rem;
      border-collapse: collapse;
      margin: 0.55rem 0 0.75rem;
      font-family: "Literata", Georgia, serif;
      font-size: 0.98rem;
      line-height: 1.45;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .writing-prompt-table th,
    .writing-prompt-table td {
      border: 1px solid var(--border);
      padding: 0.45rem 0.65rem;
      text-align: left;
      vertical-align: top;
    }
    .writing-prompt-table thead th {
      background: rgba(45, 106, 79, 0.08);
      font-weight: 700;
      color: var(--accent);
    }
    .writing-prompt-table tbody tr:nth-child(even) {
      background: rgba(45, 106, 79, 0.03);
    }
    .exam-writing-stem-wrap .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-prompt-table {
      max-width: none;
    }
    .reading-passage-text .writing-section-from-instruction {
      margin: 0.35rem 0 0.5rem;
    }
    .opts label {
      display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.4rem 0.5rem;
      border-radius: 8px; cursor: pointer;
    }
    .opts label:hover { background: rgba(45, 106, 79, 0.06); }
    .opts input { margin-top: 0.35rem; }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem 1rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem 0.85rem;
      align-items: start;
    }
    .card.q-block:not(.cloze-opt-card):not(.reading-q-card) .opts.opts-cols-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem 0.75rem;
      align-items: start;
    }
    .blank-line { display: inline-block; min-width: 5rem; border-bottom: 2px solid var(--accent-soft); margin: 0 0.12rem; }
    .blank-line input { width: 100%; border: none; background: transparent; font: inherit; padding: 0.12rem; }
    .area { width: 100%; min-height: 6rem; font: inherit; padding: 0.55rem 0.65rem; border-radius: 10px; border: 1px solid var(--border); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-bad { background: var(--bad-bg); color: var(--bad); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .pill-open { background: var(--warn-bg); color: var(--warn); font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; font-size: 0.82rem; }
    .ans-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0.5rem 0; align-items: flex-start; }
    .ans-box { flex: 1 1 220px; padding: 0.5rem 0.65rem; border-radius: 10px; font-size: 0.92rem; }
    .ans-you { border: 2px solid var(--bad); background: #fff8f7; }
    .ans-you.ok { border-color: var(--ok); background: #f4fff7; }
    .ans-key { border: 2px solid var(--accent-soft); background: #f0faf3; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .panel { display: none; margin-top: 0.5rem; padding: 0.75rem; background: #f4faf6; border-radius: 12px; border: 1px solid #b8d4c4; }
    .panel.open { display: block; }
    .md { font-size: 0.92rem; line-height: 1.6; }
    .md p { margin: 0.35rem 0; }
    .soc-track { margin: 0.75rem 0; padding: 0.75rem; background: #fff; border-radius: 12px; border: 1px solid var(--border); }
    .soc-track h4 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
    .soc-step { margin: 0.5rem 0; padding: 0.5rem 0.6rem; background: #fafcfb; border-radius: 8px; border-left: 3px solid var(--accent-soft); }
    .soc-step .qtext { font-weight: 600; margin-bottom: 0.25rem; }
    .hint { font-size: 0.88rem; color: var(--muted); display: none; margin-top: 0.35rem; }
    .hint.show { display: block; }
    .takeaway { font-size: 0.88rem; color: var(--ok); margin-top: 0.35rem; font-weight: 600; display: none; }
    .takeaway.show { display: block; }
    .wlink {
      cursor: pointer; border-bottom: 1px dotted var(--accent); color: #1e5c40;
      user-select: text; -webkit-user-select: text;
    }
    #modal {
      display: none; position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 1rem;
    }
    #modal.open { display: flex; }
    #modal .box {
      background: var(--card); max-width: 440px; width: 100%; border-radius: 16px;
      padding: 1.1rem; border: 1px solid var(--border);
    }
    .breadcrumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .opt-review { font-size: 0.88rem; margin: 0.35rem 0 0.5rem; padding: 0.45rem 0.55rem; background: #f7faf8; border-radius: 8px; border: 1px solid #dce8e0; }

    #printHost {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    html.pdf-printing #printHost {
      position: relative;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0 10mm;
      font-size: 11pt;
      line-height: 1.45;
      color: #000;
      background: #fff;
    }
    html.pdf-printing .view,
    html.pdf-printing #modal {
      display: none !important;
    }

    /* —— 标准纸笔试卷版式（仅 #printHost 内，与网页练习样式无关）—— */
    .exam-paper-doc {
      font-family: "Times New Roman", "SimSun", "Songti SC", serif;
      font-size: 11pt;
      line-height: 1.55;
      color: #000;
      text-align: left;
    }
    .exam-paper-masthead {
      text-align: center;
      margin-bottom: 8mm;
      break-after: page;
      page-break-after: always;
    }
    .exam-paper-title {
      font-family: "SimHei", "SimSun", "Songti SC", serif;
      font-size: 16pt;
      font-weight: 700;
      margin: 0 0 4mm;
      letter-spacing: 0.12em;
    }
    .exam-paper-meta-line {
      font-size: 11pt;
      margin: 2mm 0 5mm;
    }
    .exam-meta-gap { margin-left: 2em; }
    .exam-paper-student-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em 3em;
      font-size: 10.5pt;
      margin: 4mm 0 6mm;
      padding: 3mm 0;
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
    }
    /* 不同题型各占新页（封面后第一题型自然从新页起，其后每题型强制分页） */
    .exam-paper-section {
      margin-top: 0;
      padding-top: 5mm;
      border-top: 1.5pt solid #000;
      break-inside: auto;
    }
    .exam-paper-section:not(:first-of-type) {
      break-before: page;
      page-break-before: always;
    }
    .exam-paper-section:first-of-type {
      border-top: none;
      padding-top: 0;
    }
    .exam-big-title {

  <script type="application/json" id="exam-embed">{"school_or_title":"成都七中实验学校(冠城实验)2026级新初一入学考试英语试卷(二)","exam_meta":{"full_score_text":"满分: 100分","time_text":"时间: 60分钟"},"sections":[{"section_title":"I. 单项选择 (共20分)","section_instruction":"","items":[{"number":"1","item_type":"choice","context_note":"","stem":"There are two _____ in our school.","options":{"A":"library","B":"libraries","C":"Librarys","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"题干中的关键词是 \"two\"（两个），这表明它后面的名词需要使用复数形式。名词 \"library\"（图书馆）是一个可数名词。它的复数形式是 \"libraries\"。选项A是单数形式，不符合题意。选项C \"Librarys\" 是一个错误的拼写，以辅音字母加y结尾的名词，变复数时应变y为i再加es。因此，正确答案是B。","knowledge_expansion_md":"本题考察名词的复数变化规则，特别是以 “辅音字母+y” 结尾的名词。\n\n**名词变复数规则总结：**\n1.  **一般情况**：直接在词尾加 -s，如：book → books, cat → cats。\n2.  **以 s, x, sh, ch 结尾**：在词尾加 -es，如：bus → buses, box → boxes, brush → brushes, watch → watches。\n3.  **以“辅音字母+y”结尾**：变 y 为 i，再加 -es，如：city → cities, baby → babies, story → stories。\n4.  **以“元音字母+y”结尾**：直接加 -s，如：boy → boys, day → days, toy → toys。\n5.  **以 f 或 fe 结尾**：多为变 f/fe 为 v，再加 -es，如：leaf → leaves, wife → wives。（也有例外，如：roof → roofs）\n6.  **不规则变化**：man → men, woman → women, child → children, foot → feet, tooth → teeth, mouse → mice。\n\n**易错点**：学生容易混淆“辅音+y”和“元音+y”的规则，或者忘记不规则名词的复数形式。","socratic_tracks":[{"title":"数量词与名词单复数","steps":[{"question":"看到句子开头的 \"There are two...\"，你首先会想到后面的名词应该是什么形式？","hint":"\"two\" 是数字几？它表示一个还是多个？","takeaway":"数词 \"two\" 决定了其后必须跟一个复数名词。"},{"question":"既然需要复数名词，那么 \"library\" 的正确复数形式是什么？","hint":"这个单词以字母 'y' 结尾，想想以 'y' 结尾的名词变复数的规则。","takeaway":"以辅音字母加 'y' 结尾的名词，变复数时需要变 'y' 为 'i' 再加 'es'。"}]},{"title":"There be 句型的主谓一致","steps":[{"question":"\"There is\" 和 \"There are\" 在用法上有什么根本区别？","hint":"观察一下它们后面通常跟什么类型的名词（单数、复数、可数、不可数）。","takeaway":"\"There is\" 用于单数或不可数名词，而 \"There are\" 用于复数名词。"},{"question":"本题中已经给出了 \"There are\"，这对我们选择正确答案有什么帮助？","hint":"\"are\" 是 be 动词的复数形式，它要求后面的主语也必须是复数。","takeaway":"句型 \"There are\" 强制要求后面的名词必须是复数形式，这直接排除了单数选项。"}]},{"title":"名词复数拼写规则辨析","steps":[{"question":"为什么选项 C \"Librarys\" 是错误的？","hint":"英语中名词变复数，是不是所有词都是直接加 's'？回忆一下以 'y' 结尾的词的特殊规则。","takeaway":"直接加 's' 形成 \"Librarys\" 的拼写方式不符合以辅音字母加 'y' 结尾的名词变复数的规则。"},{"question":"你能举出另一个和 \"library\" 变复数规则完全相同的单词吗？比如 \"family\"（家庭）或者 \"story\"（故事）。","hint":"这些词都是以辅音字母 + 'y' 结尾的。","takeaway":"通过类比 family → families, story → stories，可以加深对 \"辅音+y\" 结尾变 \"y\" 为 \"i\" 加 \"es\" 规则的理解和记忆。"}]}]}},{"number":"2","item_type":"choice","context_note":"","stem":"There aren't _____ apples in the basket, but there are some on the table.","options":{"A":"some","B":"any","C":"a","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查不定代词 \"some\" 和 \"any\" 的用法。句中出现了 \"aren't\"（are not），这是一个否定标志，说明这是一个否定句。在否定句和一般疑问句中，通常使用 \"any\" 来表示“任何”或“一些”。\"some\" 一般用于肯定句中。选项C \"a\" 用于修饰单数可数名词，而题中的 \"apples\" 是复数名词。因此，只有 \"any\" 符合该否定句的语法要求。","knowledge_expansion_md":"**some 和 any 的核心用法辨析：**\n\n1.  **some (一些)**\n    *   主要用于**肯定句**中，修饰可数名词复数或不可数名词。\n        *   例：I have **some** books. (我有一些书。)\n        *   例：There is **some** water in the bottle. (瓶子里有一些水。)\n    *   用于**表示请求或建议的疑问句**中，希望得到对方肯定回答时。\n        *   例：Would you like **some** coffee? (你想来点咖啡吗？)\n        *   例：Can I have **some** juice, please? (我能要些果汁吗？)\n\n2.  **any (任何一个/一些)**\n    *   主要用于**否定句**和**疑问句**中。\n        *   例：I don't have **any** brothers. (我没有任何兄弟。)\n        *   例：Is there **any** milk in the fridge? (冰箱里有牛奶吗？)\n    *   用于**肯定句**中表示“任何一个都行”，有强调意味。\n        *   例：You can take **any** seat you like. (你可以坐任何你喜欢的座位。)\n\n**易错点**：机械地认为 \"some\" 用于肯定句，\"any\" 用于否定句和疑问句，而忽略了 \"some\" 在请求/建议性问句中的用法，以及 \"any\" 在肯定句中表示“任何”的特殊用法。","socratic_tracks":[{"title":"识别句子类型","steps":[{"question":"请看题干的前半句 \"There aren't _____ apples in the basket\"。你看到了哪个词可以帮你判断这是什么类型的句子（肯定句/否定句/疑问句）？","hint":"注意 \"aren't\" 这个词，它是哪两个词的缩写？","takeaway":"\"aren't\" 是 \"are not\" 的缩写，所以这是一个否定句。"},{"question":"在英语中，当我们需要在否定句里表达“一些”或“任何”时，通常会用哪个词？","hint":"回想一下 \"some\" 和 \"any\" 的基本用法规则。","takeaway":"在否定句和疑问句中，我们通常使用 \"any\"。"}]},{"title":"排除法应用","steps":[{"question":"我们来分析一下为什么不能选A选项 \"some\"。\"some\" 通常用在什么句子里？","hint":"比如，你想说“我有一些朋友”，你会说 \"I have some friends.\" 这是一个肯定句。","takeaway":"\"some\" 主要用于肯定句，而本题是否定句，所以不适用。"},{"question":"再看看C选项 \"a\"。为什么它也是错的？","hint":"观察 \"a\" 后面的名词 \"apples\"。它是单数还是复数？\"a\" 可以用来修饰复数名词吗？","takeaway":"\"a\" 只能修饰单数可数名词，而 \"apples\" 是复数，因此 \"a\" 是错误的。"}]},{"title":"语境与逻辑","steps":[{"question":"句子后半部分说 \"...but there are some on the table.\"（但是桌子上有一些）。这里的 \"but\"（但是）起到了什么作用？","hint":"\"but\" 表示转折，说明前后情况是相反或相对的。","takeaway":"\"but\" 提示了前后内容的对比：篮子里没有，而桌子上有。"},{"question":"后半句是肯定句，用了 \"some\"。这是否反过来印证了前半句作为否定句，应该使用与 \"some\" 对应的 \"any\" 呢？","hint":"一个说“有”，一个说“没有”，在句式上形成了鲜明的对比。","takeaway":"后半句肯定句用 \"some\"，与前半句否定句用 \"any\" 形成了完美的语法和逻辑配对，使得句意通顺连贯。"}]}]}},{"number":"3","item_type":"choice","context_note":"","stem":"—Is there a dining hall in your school?\n—_____","options":{"A":"Yes, there are.","B":"No, there is.","C":"Yes, there is.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 \"There be\" 句型的一般疑问句及其简略回答。问句是 \"Is there a dining hall...?\"，这是一个以 \"Is\" 开头的一般疑问句，并且主语是单数名词 \"a dining hall\"。对于这种问句，回答时必须与问句保持人称和数的一致性。肯定回答是 \"Yes, there is.\"，否定回答是 \"No, there isn't.\"。选项A的 \"are\" 与问句的 \"is\" 不一致。选项B中，\"No\" 后面应该跟否定形式 \"isn't\"，而不是肯定形式 \"is\"。因此，只有选项C是完全正确的回答。","knowledge_expansion_md":"**一般疑问句的简略回答规则：**\n\n英语中，对一般疑问句（Yes/No questions）的简略回答有一个基本原则：**用什么（助动词/be动词/情态动词）问，就用什么答，并注意人称和单复数的变化。**\n\n1.  **Be动词提问**: \n    *   `Is he a doctor?` → `Yes, he is.` / `No, he isn't.`\n    *   `Are they students?` → `Yes, they are.` / `No, they aren't.`\n    *   `Is there a book?` → `Yes, there is.` / `No, there isn't.`\n\n2.  **助动词 (do/does/did) 提问**:\n    *   `Do you like English?` → `Yes, I do.` / `No, I don't.`\n    *   `Does she work here?` → `Yes, she does.` / `No, she doesn't.`\n\n3.  **情态动词 (can/will/should等) 提问**:\n    *   `Can you swim?` → `Yes, I can.` / `No, I can't.`\n    *   `Will it rain?` → `Yes, it will.` / `No, it won't.`\n\n**核心易错点**：\n*   **前后不一致**：回答中的动词与问句中的动词不匹配，如用 `are` 回答 `is` 的提问。\n*   **肯定/否定混淆**：`Yes` 后面跟了否定形式（如 `Yes, he isn't.`），或者 `No` 后面跟了肯定形式（如 `No, he is.`），这在逻辑上是矛盾的。","socratic_tracks":[{"title":"问答动词一致性","steps":[{"question":"请看问句 \"Is there a dining hall...?\"，它是用哪个动词开头的？","hint":"看句子的第一个词。","takeaway":"问句是以 be 动词 \"Is\" 开头的。"},{"question":"根据“用什么问，用什么答”的原则，当别人用 \"Is\" 来问你时，你的回答里应该包含哪个动词？","hint":"回答要和提问相呼应。","takeaway":"用 \"Is\" 提问，回答时也应该使用 \"is\" 或其否定形式 \"isn't\"。"},{"question":"现在看看选项A \"Yes, there are.\"，它为什么是错的？","hint":"比较一下问句的 \"is\" 和回答的 \"are\"。","takeaway":"回答中的 \"are\" 与问句中的 \"is\" 在单复数上不一致，因此是错误的。"}]},{"title":"回答逻辑一致性","steps":[{"question":"一个回答的开头是 \"Yes\" 或 \"No\"，这决定了后面半句的基调。如果开头是 \"No\"，表示否定，那么后面的句子应该是肯定形式还是否定形式？","hint":"比如，中文里我们说“不，它不是”，而不会说“不，它是”。","takeaway":"如果回答以 \"No\" 开头，后面的句子必须是相应的否定形式。"},{"question":"基于这个逻辑，请分析一下为什么选项B \"No, there is.\" 是错误的。","hint":"\"No\" 是否定，而 \"there is\" 是肯定形式。","takeaway":"选项B中，\"No\" 和 \"there is\" 在肯定/否定上是矛盾的，正确的否定回答应该是 \"No, there isn't.\"。"}]},{"title":"There be 句型问答","steps":[{"question":"问句 \"Is there a dining hall...?\" 问的是“有没有一个食堂？”。如果学校有，最简单直接的肯定回答是什么？","hint":"直接用问句的结构来回答。","takeaway":"对 \"Is there...?\" 的标准肯定回答就是 \"Yes, there is.\"。"},{"question":"如果问句是 \"Are there any dining halls...?\"，那么正确的肯定回答应该变成什么？","hint":"问句中的动词从 \"Is\" 变成了 \"Are\"。","takeaway":"如果问句是 \"Are there...?\"，那么正确的肯定回答就应该是 \"Yes, there are.\"，这体现了主谓一致的原则。"}]}]}},{"number":"4","item_type":"choice","context_note":"","stem":"Look, my grandfather is _____.","options":{"A":"on the left of","B":"next","C":"on right of","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查表示方位的介词短语。我们来逐一分析选项：\n- 选项A \"on the left of\" 意为“在……的左边”，这是一个结构上正确的介词短语，但它通常需要跟一个宾语（如 on the left of the tree）。\n- 选项B \"next\" 意为“旁边”，但它通常需要和 \"to\" 连用构成 \"next to\"，单独使用不完整。\n- 选项C \"on right of\" 是一个错误的表达，正确的说法是 \"on the right of\"，缺少了定冠词 \"the\"。\n\n比较三个选项，选项B和C存在明确的语法或结构错误。选项A虽然使得整个句子在没有上下文的情况下显得不完整（因为它缺少宾语），但短语本身是正确的。在选择题中，我们应选择错误最少或本身结构正确的选项。因此，A是最佳答案。","knowledge_expansion_md":"**表示方位和位置的常用介词短语：**\n\n1.  **左右方位**\n    *   `on the left/right`：在左边/右边。（作为副词短语，后面不跟宾语）\n        *   *My seat is on the left.*\n    *   `on the left/right of + sth./sb.`：在某物/某人的左边/右边。\n        *   *The bank is on the left of the school.*\n    *   `to the left/right of + sth./sb.`：同上，常可互换。\n\n2.  **邻近关系**\n    *   `next to + sth./sb.`：紧挨着，在……旁边。\n        *   *I sat next to my best friend.*\n    *   `near + sth./sb.`：在……附近（不一定紧挨着）。\n        *   *There is a park near my house.*\n\n3.  **其他重要方位**\n    *   `in front of`：在……（外部）前面。\n    *   `in the front of`：在……（内部）的前部。\n    *   `behind`：在……后面。\n    *   `between A and B`：在A和B两者之间。\n    *   `among`：在（三者或以上）……中间。\n\n**易错点**：\n*   在 `on the left/right of` 中遗漏定冠词 `the`。\n*   将 `next to` 拆开，只使用 `next` 来表达“在旁边”。\n*   混淆 `in front of` 和 `in the front of`。","socratic_tracks":[{"title":"方位短语的固定搭配","steps":[{"question":"当你想表达“在……的右边”时，正确的英文短语是什么？","hint":"这个短语里包含 \"on\", \"right\", \"of\"，还缺一个很小的但很重要的词。","takeaway":"正确的表达是 \"on the right of\"，定冠词 \"the\" 是必不可少的。"},{"question":"根据这个规则，为什么选项C \"on right of\" 是错误的？","hint":"对比一下你刚才想到的正确短语和选项C。","takeaway":"选项C因为缺少了定冠词 \"the\"，所以是一个语法错误的短语。"}]},{"title":"“旁边”的正确说法","steps":[{"question":"如果想表达“A在B的旁边”，用 \"next\" 这个词应该怎么构成短语？","hint":"\"next\" 后面需要加一个介词才能连接宾语B。","takeaway":"表示“在……旁边”的固定搭配是 \"next to\"。"},{"question":"那么，为什么选项B \"next\" 在这个句子中不合适？","hint":"题干的横线在句末，后面没有其他词了。","takeaway":"选项B只给出了 \"next\"，缺少了 \"to\"，因此是不完整的，不能独立构成“在旁边”的意思。"}]},{"title":"选择最佳答案的策略","steps":[{"question":"我们已经确定选项B和C都有明显的语法错误。现在看选项A \"on the left of\"，这个短语本身有没有语法错误？","hint":"作为一个短语结构，\"on the left of\" 是不是一个标准用法？","takeaway":"短语 \"on the left of\" 本身是完全正确的。"},{"question":"虽然把A填入句子后，句子 \"My grandfather is on the left of.\" 看起来不完整，但在B和C都有明确语法错误的情况下，我们应该如何选择？","hint":"在选择题中，有时需要“优中选优”，有时则需要“矮子里面拔将军”。","takeaway":"当其他选项存在明确的语法或结构性错误时，我们应该选择那个本身结构正确但可能在当前语境下不完美的选项。"}]}]}},{"number":"5","item_type":"choice","context_note":"","stem":"—Have you got a dictionary?\n—_____","options":{"A":"Yes, I do.","B":"Yes, I got.","C":"Yes, I have.","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查的是对以 “Have you got...?” 开头的疑问句的简略回答。\n“Have you got...?” 是一个一般疑问句，意为“你有……吗？”，其功能与 “Do you have...?” 相同。\n回答这类由助动词开头的疑问句时，要遵循“问答一致”的原则，即问句用什么助动词，答语就用相应的助动词。\n问句以 “Have” 开头，因此肯定简答应为 “Yes, I have.”，否定简答为 “No, I haven't.”。\n选项 A “Yes, I do.” 是对 “Do you have...?” 的回答。\n选项 B “Yes, I got.” 语法不正确，简略回答中不能单独使用实义动词 “got”。","knowledge_expansion_md":"**知识点拓展：`have got` vs. `have`**\n\n1.  **含义与用法**：`have got` 和 `have` 都表示“拥有”，在肯定句中可以互换，`have got` 在英式英语中更口语化。\n    *   `I have a pen.` = `I've got a pen.` (我有一支钢笔。)\n    *   `He has a brother.` = `He's got a brother.` (他有一个兄弟。)\n\n2.  **否定与疑问形式**：这是两者最大的区别。\n    *   **`have got` 结构**：`have/has` 担当助动词的角色。\n        *   否定句：`I haven't got a pen.` / `He hasn't got a brother.`\n        *   疑问句：`Have you got a pen?` / `Has he got a brother?`\n    *   **`have` 结构**：`have` 是实义动词，需要借助助动词 `do/does`。\n        *   否定句：`I don't have a pen.` / `He doesn't have a brother.`\n        *   疑问句：`Do you have a pen?` / `Does he have a brother?`\n\n3.  **常见错误**：切勿将两种结构混用。\n    *   错误：`Do you have got a pen?`\n    *   错误：`I don't have got a pen.`\n    *   错误：`I haven't a pen.` (在现代英语中，尤其美式英语中，这种用法很少见，应说 `I don't have a pen.` 或 `I haven't got a pen.`)","socratic_tracks":[{"title":"问答一致原则","steps":[{"question":"请观察问句 “Have you got a dictionary?”，它是用哪个词开始的？","hint":"注意句子的第一个词。","takeaway":"问句是以助动词 “Have” 开头的。"},{"question":"对于用助动词开头的疑问句，我们在做简略回答时，应该使用哪个词？","hint":"想一想，如果别人问你 “Can you swim?”，你会怎么回答 “Yes, I ...”？","takeaway":"简略回答时，要使用与问句相同的助动词。"},{"question":"那么，对于 “Have you got...?” 的肯定回答，应该是 “Yes, I do.” 还是 “Yes, I have.”？","hint":"问句用 “Have”，回答就用 “have”。","takeaway":"问句以 “Have” 开头，所以肯定简答要用 “Yes, I have.”。"}]},{"title":"have got 结构","steps":[{"question":"在 “Have you got...?” 这个句型中，“have” 是助动词还是实义动词（表示“有”）？","hint":"如果它是实义动词，疑问句应该用 “Do you have...?”。既然它自己跑到了句首，说明它是什么词？","takeaway":"在 “have got” 结构中，“have” 是助动词，而 “got” 是动词过去分词。"},{"question":"既然 “have” 是助动词，那么在简略回答中，我们应该保留助动词还是动词的其他部分？","hint":"参考回答 “Is he a student?” -> “Yes, he is.”。我们保留了哪个词？","takeaway":"简略回答的结构是“主语 + 助动词”，所以应该保留 “have”。"}]},{"title":"排除错误选项","steps":[{"question":"选项 A “Yes, I do.” 是对哪种问句的回答？","hint":"什么问句我们会用 “do” 来回答？","takeaway":"“Yes, I do.” 是对以 “Do you...?” 开头的问句的回答。"},{"question":"选项 B “Yes, I got.” 为什么是错误的？","hint":"简略回答的格式通常是 “Yes, 主语 + 助动词.”。“got” 是助动词吗？","takeaway":"“got” 不是助动词，不能单独用于构成简略回答。"}]}]}},{"number":"6","item_type":"choice","context_note":"","stem":"—Where are _____?\n—They are on the chair.","options":{"A":"Tony's books","B":"Tony's book","C":"Tony books","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查名词所有格和主谓一致。\n首先，根据答语 “They are on the chair.”，我们可以获取两个关键信息。\n第一，代词 “They” 指代的是复数名词。\n第二，系动词 “are” 也用于复数主语。\n因此，问句中横线处需要填入一个表示复数意义的名词短语。\n选项 A “Tony's books” 意为“托尼的书（们）”，是复数形式，符合题意。\n选项 B “Tony's book” 意为“托尼的书”，是单数形式，与答语中的 “They are” 不符。\n选项 C “Tony books” 是错误的表达，表示“托尼的”需要使用所有格形式 “Tony's”。","knowledge_expansion_md":"**知识点拓展：名词所有格与数的一致性**\n\n1.  **名词所有格 (`'s`)**\n    *   **用法**：表示“……的”，用来表示人或事物的所属关系。\n    *   **规则**：\n        *   单数名词和不以-s结尾的复数名词，在词尾加 `'s`。例如：`Tom's cat` (汤姆的猫), `the children's toys` (孩子们的玩具)。\n        *   以-s结尾的复数名词，在词尾只加 `'`。例如：`the students' desks` (学生们的课桌)。\n        *   表示两者或多者共同拥有时，在最后一个名词后加 `'s`。例如：`Tom and Jerry's house` (汤姆和杰瑞共同的家)。\n        *   表示各自拥有时，分别在每个名词后加 `'s`。例如：`Tom's and Jerry's rooms` (汤姆的房间和杰瑞的房间)。\n\n2.  **数的一致性 (Agreement)**\n    *   **主谓一致**：主语的数（单数或复数）决定了谓语动词的形式。例如：`The book is...` vs. `The books are...`。\n    *   **代词与先行词一致**：代词（如 he, she, it, they）必须与其指代的名词（先行词）在“数”上保持一致。本题中，答语的 `They` 必须指代一个复数名词，即 `books`。","socratic_tracks":[{"title":"从答语中寻找线索","steps":[{"question":"请看答句 “They are on the chair.”。这里的 “They” 指的是一个东西还是多个东西？","hint":"“They” 是 “他/她/它们” 的复数形式。","takeaway":"“They” 指的是多个东西，是复数概念。"},{"question":"动词 “are” 通常和单数主语还是复数主语连用？","hint":"我们说 “He is...” 还是 “He are...”？我们说 “They is...” 还是 “They are...”？","takeaway":"动词 “are” 用于复数主语。"},{"question":"既然答语讨论的是复数，那么问句中横线处应该填一个单数名词还是复数名词？","hint":"问的和答的必须是同一样东西。","takeaway":"问句中必须填入一个复数名词，才能与答语的 “They are” 对应。"}]},{"title":"名词所有格的用法","steps":[{"question":"我们想表达“托尼的”这个意思，应该用 “Tony” 还是 “Tony's”？","hint":"想一想“我的老师”是 “my teacher”，那么“露西的”是 “Lucy's”。","takeaway":"表示“某人的”所属关系，通常在人名后加 `'s`。"},{"question":"对比选项 A “Tony's books” 和选项 C “Tony books”，哪个是正确的表达方式？为什么？","hint":"“Tony books” 这种结构在英语中通常是不正确的，除非 “Tony” 是一个品牌名。","takeaway":"选项 C “Tony books” 缺少表示所属关系的所有格符号 `'s`，是错误的。"}]},{"title":"区分单数与复数","steps":[{"question":"现在我们只剩下选项 A “Tony's books” 和 B “Tony's book”。请问 “book” 和 “books” 哪个是单数，哪个是复数？","hint":"名词变复数，通常在词尾加 -s。","takeaway":"“book” 是单数，指一本书；“books” 是复数，指多本书。"},{"question":"结合我们第一步得出的结论——问句需要一个复数名词，那么应该选择 A 还是 B？","hint":"我们需要的是“多本书”。","takeaway":"因为答语是复数，所以必须选择表示复数的选项 A “Tony's books”。"}]}]}},{"number":"7","item_type":"choice","context_note":"","stem":"He _____ any aunts or uncles.","options":{"A":"doesn't has got","B":"haven't got","C":"hasn't got","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 “have got” 结构在第三人称单数作主语时的否定形式。\n句子的主语是 “He”，是第三人称单数。\n表示“拥有”的 “have got” 结构，当主语是第三人称单数（如 he, she, it）时，需要使用 “has got”。\n在 “have got / has got” 结构中，“have / has” 是助动词，其否定形式直接在后面加 “not”。\n因此，“has got” 的否定形式是 “has not got”，缩写为 “hasn't got”。\n选项 A “doesn't has got” 语法错误，助动词 “doesn't” 后面应跟动词原形 “have”，且不能与 “got” 混用。\n选项 B “haven't got” 用于主语为 I, you, we, they 等非第三人称单数的情况，与主语 “He” 不匹配。","knowledge_expansion_md":"**知识点拓展：`have got` 的主谓一致与否定形式**\n\n`have got` 是一个常用的动词短语，意为“拥有”，尤其在英式英语的口语中非常普遍。在使用时，必须注意其形式随主语人称和数的变化。\n\n1.  **主谓一致**：\n    *   当主语是第一人称 (I)、第二人称 (you) 或复数 (we, they, the students) 时，用 `have got`。\n        *   `We have got a big classroom.`\n    *   当主语是第三人称单数 (he, she, it, Tom) 时，用 `has got`。\n        *   `She has got long hair.`\n\n2.  **否定形式**：\n    *   在 `have got` / `has got` 中，`have` / `has` 是助动词，变否定时直接在其后加 `not`。\n    *   `have not got` -> `haven't got`\n    *   `has not got` -> `hasn't got`\n\n3.  **与 `don't/doesn't have` 的对比**：\n    *   `He hasn't got any uncles.` = `He doesn't have any uncles.` (他没有任何叔叔或舅舅。)\n    *   `They haven't got a car.` = `They don't have a car.` (他们没有车。)\n    *   **易错点**：千万不要写成 `He doesn't have got...` 或 `He don't has got...` 这种混合形式。","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"这个句子的主语是什么？它在人称和数上有什么特点？","hint":"句子的第一个词是 “He”。","takeaway":"主语是 “He”，属于第三人称单数。"},{"question":"当主语是第三人称单数时，动词 “have” 应该变成什么形式？","hint":"我们说 “I have a book”，但说 “She ___ a book”。","takeaway":"当主语是第三人称单数时，动词 “have” 要变为 “has”。"},{"question":"因此，对于主语 “He”，我们应该用 “haven't got” 还是 “hasn't got”？","hint":"“hasn't” 是 “has not” 的缩写。","takeaway":"主语是 “He”，所以必须使用 “has” 的形式，即 “hasn't got”。"}]},{"title":"have got 的否定结构","steps":[{"question":"在 “have got” 这个短语中，哪一部分是助动词？","hint":"在疑问句 “Have you got...?” 中，是 “have” 提前了，所以 “have” 是助动词。","takeaway":"在 “have got” 结构中，“have” 或 “has” 充当助动词。"},{"question":"我们如何将一个包含助动词的句子变成否定句？","hint":"想一想 “I can swim.” 的否定句是 “I can't swim.”。我们对助动词 “can” 做了什么？","takeaway":"将助动词变为否定句，只需在助动词后面加上 “not”。"},{"question":"那么，“He has got...” 的否定形式应该是什么？","hint":"在助动词 “has” 后面加上 “not”。","takeaway":"“He has got...” 的否定形式是 “He has not got...”，缩写为 “He hasn't got...”。"}]},{"title":"排除语法错误","steps":[{"question":"我们来看选项 A “doesn't has got”。助动词 “doesn't” 后面应该跟什么形式的动词？","hint":"比如 “He doesn't like...” 还是 “He doesn't likes...”？","takeaway":"助动词 “do/does/did” 后面必须跟动词原形。"},{"question":"那么，“doesn't has” 这个组合本身对吗？如果不对，应该是什么？","hint":"“has” 的原形是什么？","takeaway":"“doesn't has” 是错误的，正确的形式应该是 “doesn't have”。"},{"question":"即使是 “doesn't have”，我们能说 “doesn't have got” 吗？","hint":"“doesn't have” 和 “hasn't got” 是两种独立的、表达相同意思的否定方式。","takeaway":"不能将 “do/does” 助动词与 “have got” 结构混用，所以 “doesn't have got” 是错误的。"}]}]}},{"number":"8","item_type":"choice","context_note":"","stem":"—How many computers _____ in your classroom?\n—There are two.","options":{"A":"are there","B":"are you have","C":"does you have","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查 “There be” 句型的特殊疑问句形式。\n答语是 “There are two.”，这表明对话使用了 “There be” 句型来描述某地有什么东西。\n因此，提问也应该使用 “There be” 句型。\n当对 “There be” 句型中的可数名词数量进行提问时，基本结构是 “How many + 复数名词 + are there + 地点?”。\n本题中，“computers” 是可数名词复数，所以应该用 “are there”。\n完整的问句是 “How many computers are there in your classroom?” (在你的教室里有多少台电脑？)。\n选项 B 和 C 都是错误的语法结构。如果用 “have” 提问，正确的问法是 “How many computers do you have?”，但这与答语的句型不匹配。","knowledge_expansion_md":"**知识点拓展：`There be` 句型 vs. `have/has`**\n\n1.  **`There be` 句型**\n    *   **核心功能**：表示“存在”，即“某地/某时有某物/某人”。强调的是“存在”这一事实。\n    *   **结构**：`There + be动词 (is/are/was/were...) + 名词 (主语) + 地点/时间状语`。\n    *   **疑问句**：\n        *   一般疑问句：`Is/Are there...?`\n        *   特殊疑问句 (对数量)：`How many/much ... is/are there...?`\n    *   **示例**：`There is a tree in front of the house.` (房子前面有一棵树。)\n\n2.  **`have/has`**\n    *   **核心功能**：表示“拥有”，即“某人/某物拥有……”。强调的是“所属”关系。\n    *   **结构**：`主语 (所有者) + have/has + 名词 (被拥有的东西)`。\n    *   **疑问句**：\n        *   一般疑问句：`Do/Does ... have...?`\n        *   特殊疑问句 (对数量)：`How many/much ... do/does ... have?`\n    *   **示例**：`He has a new car.` (他有一辆新车。)\n\n3.  **辨析**：\n    *   问“教室里有多少电脑？”是问电脑在教室这个地方的“存在”，应用 `There be` 句型。\n    *   问“你有多少电脑？”是问你“拥有”多少电脑，应用 `have`。","socratic_tracks":[{"title":"从答语反推问句","steps":[{"question":"请看答句 “There are two.”。这个句子是什么句型？它通常用来表达什么意思？","hint":"这个句型以 “There” 开头，后面跟了一个 be 动词。","takeaway":"这是 “There be” 句型，用来表达“某地有某物”。"},{"question":"既然回答用的是 “There be” 句型，那么提问时最可能用的是什么句型？","hint":"问句和答句的结构通常是对应的。","takeaway":"提问时也应该使用 “There be” 句型。"}]},{"title":"There be 句型的疑问结构","steps":[{"question":"我们知道肯定句是 “There are computers in the classroom.”。如果想把它变成一般疑问句，应该怎么变？","hint":"把 be 动词 “are” 移动到句首。","takeaway":"一般疑问句是 “Are there computers in the classroom?”。"},{"question":"现在我们想对 “computers” 的数量提问，需要用 “How many” 开头。那么 “How many computers” 后面应该跟什么样的语序？","hint":"特殊疑问词后面要跟一般疑问句的语序。","takeaway":"“How many computers” 后面应该跟一般疑问语序 “are there”。"},{"question":"所以，把这些部分组合起来，正确的问句是什么？","hint":"How many computers + are there + in your classroom?","takeaway":"完整的问句是 “How many computers are there in your classroom?”，因此横线处应填 “are there”。"}]},{"title":"辨析 have 与 There be","steps":[{"question":"选项 B “are you have” 和 C “does you have” 为什么是错误的？","hint":"B 中 be 动词和实义动词混用；C 中助动词 “does” 和主语 “you” 不匹配。","takeaway":"选项 B 和 C 存在明显的语法错误。"},{"question":"如果我想用 “have” 来问“你有多少台电脑”，正确的说法是什么？","hint":"用助动词 “do” 还是 “does” 来帮助 “have” 构成疑问句？主语是 “you”。","takeaway":"用 “have” 提问应该是 “How many computers do you have?”。"},{"question":"“How many computers do you have?” 和 “How many computers are there in your classroom?” 这两个问题有什么不同？为什么前者不适合本题？","hint":"前者问“你拥有”，后者问“教室里存在”。再看看答句 “There are two.”。","takeaway":"前者问“拥有”，后者问“存在”。答句是关于“存在”的，所以问句也必须是关于“存在”的。"}]}]}},{"number":"9","item_type":"choice","context_note":"","stem":"—Where _____ you _____?\n—I'm from Beijing.","options":{"A":"are; from","B":"do; from","C":"are; come","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查询问国籍或来源地的常用句型。\n回答是 “I'm from Beijing.”（我来自北京），其中 “I'm” 是 “I am” 的缩写，使用了 be 动词。\n根据回答可以推断，问句也应该使用 be 动词的结构。\n询问某人来自哪里，正确的句型是 “Where + be动词 + 主语 + from?”。\n本题中主语是 “you”，所以 be 动词应该用 “are”。\n因此，完整的问句是 “Where are you from?”，故选 A。","knowledge_expansion_md":"询问某人来自哪里的两种常用表达：\n1.  **Where are you from?** 这是 “be from” 结构，回答是 “I am from + 地点.”。\n2.  **Where do you come from?** 这是 “come from” 结构，因为 come 是实义动词，所以疑问句需要助动词 do/does，回答是 “I come from + 地点.”。\n\n**易错点**：\n学生常常将这两种句型混淆，写出错误的句子，例如：\n-   *Where are you come from?* (错误，be动词和实义动词原形不能同时作谓语)\n-   *Where do you from?* (错误，from是介词，前面缺少动词)\n\n**总结**：记住 “be from” 和 “come from” 是两个整体，变疑问句时，前者提前 be 动词，后者借助助动词 do/does。","socratic_tracks":[{"title":"“be from”句型结构","steps":[{"question":"看到回答 “I'm from Beijing”，句中的 “'m” 是哪个词的缩写？它是什么类型的动词？","hint":"“I'm” 完整形式是 “I am”。am, is, are 属于哪一类动词？","takeaway":"“'m” 是 “am” 的缩写，它是一个 be 动词。"},{"question":"既然回答使用了 “be from” 结构，那么提问时，当主语是 “you” 的时候，应该用哪个 be 动词来构成问句？","hint":"be 动词有人称和数的变化，I 用 am，you 用 are，he/she/it 用 is。","takeaway":"回答是 “am from”，提问时主语是 “you”，所以应该用 be 动词 “are” 构成问句 “Where are you from?”。"}]},{"title":"辨析“be from”与“come from”","steps":[{"question":"除了 “Where are you from?”，我们还学过哪种表达“你来自哪里”的问法？","hint":"想一想动词 “come”（来）。","takeaway":"另一种常用问法是 “Where do you come from?”。"},{"question":"比较 “Where are you from?” 和 “Where do you come from?”，它们的助动词为什么不同？","hint":"“from” 是介词，而 “come” 是什么词性的词？实义动词的疑问句需要什么来帮忙？","takeaway":"“be from” 中的 “be” 是系动词，本身可以提前构成疑问句；而 “come from” 中的 “come” 是实义动词，需要助动词 “do/does” 来构成疑问句。"},{"question":"那么，题目中的 “Where ___ you ___?” 填入 C 选项 “are; come” 对吗？为什么？","hint":"在一个简单句的谓语部分，be 动词和动词原形能直接放在一起吗（进行时等特殊时态除外）？","takeaway":"be 动词和实义动词原形不能直接一起作谓语，所以 “are come” 是错误的搭配。"}]},{"title":"从回答反推问题","steps":[{"question":"答句是 “I'm from Beijing.”，请把这个句子变成一般疑问句。","hint":"含有 be 动词的句子，变一般疑问句的方法是把 be 动词提到句首。","takeaway":"一般疑问句是 “Are you from Beijing?”。"},{"question":"现在我们想对 “Beijing” 这个地点进行提问，应该用什么疑问词？","hint":"问地点用哪个以 'W' 开头的词？","takeaway":"对地点提问，应该用疑问词 “Where”（哪里）。"},{"question":"把疑问词 “Where” 和刚才的一般疑问句 “Are you from Beijing?” 结合起来，去掉回答部分 “Beijing”，正确的特殊疑问句是什么？","hint":"特殊疑问句的结构是：特殊疑问词 + 一般疑问句语序。","takeaway":"正确的问句是 “Where are you from?”。"}]}]}},{"number":"10","item_type":"choice","context_note":"","stem":"_____ father is a doctor. What about _____ father?","options":{"A":"His; your","B":"Her; you's","C":"His; you","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查形容词性物主代词的用法。\n形容词性物主代词用来修饰名词，表示“某人的”。\n第一个空在名词 “father” 前面，需要一个形容词性物主代词，选项中的 “His”（他的）符合要求。\n第二个空同样在名词 “father” 前面，也需要一个形容词性物主代词。\n选项 A 中的 “your”（你的）是形容词性物主代词，用法正确。\n选项 B 中的 “you's” 是错误形式，英语中没有这种写法。\n选项 C 中的 “you” 是人称代词主格或宾格，不能用来修饰名词。\n因此，只有 A 选项的两个词都符合语法规则。","knowledge_expansion_md":"本题重点考察**物主代词**的两种形式：\n1.  **形容词性物主代词 (Possessive Adjectives)**: `my`, `your`, `his`, `her`, `its`, `our`, `their`。\n    -   特点：像形容词一样，必须放在名词前面，共同构成名词短语。\n    -   公式：**形容词性物主代词 + 名词**。例：`This is my book.`\n2.  **名词性物主代词 (Possessive Pronouns)**: `mine`, `yours`, `his`, `hers`, `its`, `ours`, `theirs`。\n    -   特点：像名词一样，可独立使用，其本身就等于“形容词性物主代词+名词”。\n    -   公式：**名词性物主代词 = 形容词性物主代词 + 名词**。例：`This book is mine.` (`mine` = `my book`)\n\n**易错点**：\n-   混淆两种物主代词的用法，特别是当名词在上下文中已出现时。例如：`This is my pen. What about yours?` (这里的 `yours` = `your pen`)\n-   拼写错误：`you's` (应为 `your`/`yours`)，`her's` (应为 `hers`)。","socratic_tracks":[{"title":"形容词性物主代词","steps":[{"question":"“father” 是一个名词，表示“父亲”。在名词前面，我们通常用什么词性的词来修饰它，表示“谁的”？","hint":"比如“我的书”是 “my book”，“my” 是什么词？","takeaway":"我们需要用形容词性物主代词来表示所有关系，放在名词前面作定语。"},{"question":"那么，在 “____ father” 这个结构中，两个横线上都应该填入哪一类词？","hint":"结合上一个问题，这类词的功能是像形容词一样修饰名词。","takeaway":"两个横线上都必须填入一个形容词性物主代词。"}]},{"title":"选项辨析","steps":[{"question":"我们来看第二个空 “What about ____ father?”。请看 B 选项的 “you's”，你见过这种用法吗？表示“你的”应该用哪个词？","hint":"想一想“你的名字”怎么说？是 “you's name” 还是 “your name”？","takeaway":"“you's” 是错误的表达，表示“你的”形容词性物主代词是 “your”。"},{"question":"再看 C 选项的 “you”。可以说 “you father” 吗？为什么？","hint":"“you” 是人称代词，比如 “You are a student.”。它能直接放在名词前修饰名词吗？","takeaway":"“you” 是人称代词，不能作定语修饰名词，所以 “you father” 是错误的。"},{"question":"排除了 B 和 C 后，A 选项的 “His” 和 “your” 都是什么词？放在这里合适吗？","hint":"“His father” (他的父亲), “your father” (你的父亲)。","takeaway":"“His” 和 “your” 都是形容词性物主代词，用法完全正确。"}]},{"title":"句意与逻辑","steps":[{"question":"句子的第一部分 “____ father is a doctor.” 描述了一个人的父亲的职业。这是一个陈述句。","hint":"比如我们可以说 “His father is a doctor.”（他的父亲是医生）。","takeaway":"这句话介绍了一个事实。"},{"question":"句子的第二部分 “What about ____ father?” 是在做什么？","hint":"“What about...?” 是一个常用的提问句型，意思是“……怎么样呢？”","takeaway":"这是在向对话的另一方（你）反问，询问你父亲的情况。"},{"question":"那么，为了表达“他的父亲”和“你的父亲”，我们应该分别选择哪个词？","hint":"“他的”是 his，“你的”是 your。","takeaway":"因此，选择 “His” 和 “your” 最符合对话的逻辑和语法。"}]}]}},{"number":"11","item_type":"choice","context_note":"","stem":"There are _____ students in our class. They are 19 boys and 21 girls.","options":{"A":"forty","B":"fourty","C":"fourteen","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查数字的英文拼写以及简单的数学计算。\n首先，根据题干信息 “They are 19 boys and 21 girls”（他们是19个男孩和21个女孩），我们需要计算出班级的总学生人数。\n将男生人数和女生人数相加：19 + 21 = 40。\n然后，我们需要找出数字 40 对应的正确英文单词。\n选项 A “forty” 是 40 的正确拼写。\n选项 B “fourty” 是一个常见的拼写错误。\n选项 C “fourteen” 是数字 14。\n因此，正确答案是 A。","knowledge_expansion_md":"本题涉及基数词的拼写，这是一项基础且重要的英语技能。以下是一些基数词拼写的常见易错点：\n-   **four (4) vs. forty (40)**：数字4是 `four`，但40是 `forty`，没有 `u`。这是一个特殊的拼写变化，需要特别记忆。\n-   **-teen vs. -ty**：以 `-teen` 结尾的词表示“十几”（如 `fourteen` 14, `sixteen` 16），重音通常在后。以 `-ty` 结尾的词表示“几十”（如 `forty` 40, `sixty` 60），重音通常在前。\n-   **其他特殊变化**：\n    -   `three` (3) -> `thirteen` (13), `thirty` (30)\n    -   `five` (5) -> `fifteen` (15), `fifty` (50)\n    -   `eight` (8) -> `eighteen` (18), `eighty` (80) (注意只用一个t)\n\n同时，题目也运用了 **There be** 句型：`There are forty students in our class.` (我们班有四十名学生)，用来表示某地“存在”某人或某物。","socratic_tracks":[{"title":"逻辑计算","steps":[{"question":"题目说班里有 “19 boys and 21 girls”，这句话告诉了我们什么信息？","hint":"这句话给出了男生和女生各自的人数。","takeaway":"我们知道了班级由19个男生和21个女生组成。"},{"question":"那么，要得到班级的总学生人数，我们应该怎么做？","hint":"把男生和女生的人数加起来。","takeaway":"我们需要进行加法运算：19 + 21。"},{"question":"19 + 21 等于多少？","hint":"可以先把 19 看作 (20 - 1)，那么 (20 - 1) + 21 = 20 + 20 = 40。","takeaway":"19 + 21 = 40，所以班里总共有 40 名学生。"}]},{"title":"数字拼写辨析","steps":[{"question":"我们已经知道总数是 40。现在看选项，哪个是 40 的正确英文拼写？","hint":"回想一下数字 4 (four) 和 14 (fourteen) 的拼写，但 40 是一个特例。","takeaway":"选项 A “forty” 是 40 的正确拼写。"},{"question":"为什么 B 选项 “fourty” 是错的？它看起来很像 “four” (4) + “ty”。","hint":"这是一个非常特殊的拼写规则，需要特别记忆，不能想当然地组合。","takeaway":"数字 40 的拼写是 “forty”，不包含字母 “u”，这是一个常见的易错点。"},{"question":"C 选项 “fourteen” 是数字几？它和 “forty” 在拼写和读音上有什么区别？","hint":"注意后缀 “-teen” 和 “-ty” 的区别。","takeaway":"“fourteen” 是 14，后缀 “-teen” 表示十几；而 “forty” 是 40，后缀 “-ty” 表示几十。"}]},{"title":"“There be”句型应用","steps":[{"question":"句子的开头 “There are...” 是什么句型？它有什么作用？","hint":"这个句型用来描述某个地方“有”什么东西或人。","takeaway":"这是 “There be” 句型，用来表示“存在”。"},{"question":"为什么这里用 “There are” 而不是 “There is”？","hint":"看它后面的名词 “students” 是单数还是复数？","takeaway":"因为 “students” 是复数名词，所以 be 动词要用 “are”。"},{"question":"如果班里只有一名学生，这句话应该怎么说？","hint":"名词用单数，be 动词也要用单数形式。","takeaway":"应该说 “There is one student in our class.”。"}]}]}},{"number":"12","item_type":"choice","context_note":"","stem":"Water is healthy drink, _____ Cake isn't healthy drink.","options":{"A":"and","B":"but","C":"or","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查并列连词的辨析和使用。\n句子的前半部分 “Water is healthy drink”（水是健康的饮品）表达了一个肯定的观点。\n句子的后半部分 “Cake isn't healthy drink”（蛋糕不是健康的饮品）表达了一个否定的观点。\n前后两个分句的内容形成了明显的对比或转折关系。\n选项 A “and” 表示“和”，用于连接相似或并列的观点。\n选项 B “but” 表示“但是”，用于连接相反或转折的观点。\n选项 C “or” 表示“或者”，用于表示选择。\n由于前后两句意思相反，最适合的连词是 “but”。","knowledge_expansion_md":"本题考察的是**并列连词 (Coordinating Conjunctions)** 的基础用法，它们用于连接单词、短语或分句。\n-   **and (和，并且)**：用于连接并列、递进或顺承关系。表示两件事都成立。\n    *例：He likes singing **and** dancing.* (他喜欢唱歌和跳舞。)\n-   **but (但是，可是)**：用于连接转折或对比关系。表示前后情况相反或不同。\n    *例：I want to go, **but** I don't have time.* (我想去，但是我没有时间。)\n-   **or (或者，否则)**：用于连接选择关系。表示在两者或多者中选其一。\n    *例：Would you like tea **or** coffee?* (你想要茶还是咖啡？)\n\n**语法提示**：\n虽然本题为了突出考点简化了句子，但在标准书面语中，单数可数名词前通常需要冠词。规范的句子应为：`Water is a healthy drink, but cake isn't a healthy drink.`","socratic_tracks":[{"title":"连词的功能","steps":[{"question":"观察这个句子，它由两个部分组成。中间的横线需要一个词来把它们连接起来，这类词叫什么？","hint":"and, but, or 都属于这类词，它们的作用是“连接”。","takeaway":"我们需要一个连词来连接这两个分句。"},{"question":"“and”, “but”, “or” 这三个连词在意思上有什么不同？请分别用“和”、“但是”、“或者”来对应一下。","hint":"试着用这三个中文词造句，感受它们的不同：我喜欢苹果__香蕉。我喜欢苹果，__不喜欢梨。你想要苹果__梨？","takeaway":"“and” 表示并列，“but” 表示转折，“or” 表示选择。"}]},{"title":"句子逻辑分析","steps":[{"question":"我们来分析前半句 “Water is healthy drink” (水是健康的饮品)，它表达了一个怎样的观点？是肯定的还是否定的？","hint":"“healthy” 是“健康的”，这是一个正面的词。","takeaway":"前半句表达了一个肯定的观点。"},{"question":"再看后半句 “Cake isn't healthy drink” (蛋糕不是健康的饮品)，它表达的观点和前半句是相似的还是相反的？","hint":"注意 “is” 和 “isn't” 的区别。","takeaway":"后半句表达了一个否定的、与前半句相反的观点。"},{"question":"当我们要连接两个意思相反或相对的句子时，应该用哪个连词？","hint":"想一想中文里我们怎么说：“水是健康的，____蛋糕不是。”","takeaway":"连接相反观点的句子时，我们应该使用表示转折的连词 “but”。"}]},{"title":"从句子成分看关系","steps":[{"question":"第一个分句的主语是什么？它有什么特点？","hint":"主语是 “Water”，特点是 “healthy”。","takeaway":"第一个主语是“水”，它的属性是“健康的”。"},{"question":"第二个分句的主语是什么？它的特点又是什么？","hint":"主语是 “Cake”，特点是 “isn't healthy”。","takeaway":"第二个主语是“蛋糕”，它的属性是“不健康的”。"},{"question":"一个主语具有某种属性，而另一个主语不具有该属性。这是一种什么逻辑关系？","hint":"这种关系是相同、选择还是对比？","takeaway":"这是一种典型的对比关系，因此需要使用表示对比或转折的连词 “but”。"}]}]}},{"number":"13","item_type":"choice","context_note":"","stem":"Can I have _____ water?","options":{"A":"these","B":"some","C":"one","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查量词的用法。题干中的名词 `water` (水) 是一个不可数名词，不能用数词直接修饰。\n- 选项 A `these` (这些) 用于修饰复数可数名词，例如 `these books`，不能修饰 `water`。\n- 选项 C `one` (一个) 用于修饰单数可数名词，例如 `one apple`，也不能修饰 `water`。\n- 选项 B `some` (一些) 既可以修饰复数可数名词，也可以修饰不可数名词。\n- 此外，虽然 `some` 常用于肯定句，但在表示请求、建议或邀请的疑问句中（如本题 `Can I have...?`），也习惯使用 `some`，表示希望得到肯定的答复。因此，B 是正确答案。","knowledge_expansion_md":"### `some` 和 `any` 的用法辨析\n\n`some` 和 `any` 都表示“一些”，但用法不同：\n\n1.  **`some` 的用法**：\n    *   通常用于**肯定句**中。例如：`I have some friends.`\n    *   用于表示**请求、邀请或建议**的疑问句中，期待对方给予肯定回答。例如：`Would you like some coffee?` (你想喝点咖啡吗？) / `Can I borrow some money?` (我能借些钱吗？)\n\n2.  **`any` 的用法**：\n    *   通常用于**否定句**和**一般疑问句**中。例如：`I don't have any pets.` / `Do you have any questions?`\n    *   当 `any` 用于**肯定句**时，意思变为“任何的”，带有强调语气。例如：`You can take any book you like.` (你可以拿任何一本你喜欢的书。)\n\n**易错点**：学生容易混淆在疑问句中 `some` 和 `any` 的使用场景。关键在于判断句子的意图：是单纯询问信息（用 `any`），还是带有请求/邀请的意味（用 `some`）。","socratic_tracks":[{"title":"名词的可数性","steps":[{"question":"我们来分析一下句子里的核心名词 `water`（水）。你觉得它是一个可数名词还是不可数名词？我们能说 “one water, two waters” 吗？","hint":"想想我们平时怎么说“一杯水”或者“一些水”，会直接用数字去数“水”本身吗？","takeaway":"`water` 是不可数名词，不能直接用数字来计数。"},{"question":"既然 `water` 是不可数名词，那么选项 A `these` 和 C `one` 还能用吗？它们通常修饰什么样的名词？","hint":"`these` 是 `this` 的复数，意思是“这些”；`one` 是数字“一”。","takeaway":"`these` 修饰复数可数名词，`one` 修饰单数可数名词，因此它们都不能用来修饰 `water`。"}]},{"title":"some 的用法","steps":[{"question":"我们学过 `some` 和 `any` 的基本区别，`some` 一般用在什么句子里？","hint":"比如，“我有一些书”用英语怎么说？","takeaway":"`some` 通常用在肯定句中。"},{"question":"但这道题 `Can I have _____ water?` 是一个疑问句，为什么还能用 `some` 呢？这个疑问句是在单纯地问问题，还是在请求什么东西？","hint":"说话的人是想知道世界上有没有水，还是他自己想得到一些水？","takeaway":"这是一个表示“请求”的疑问句，而不仅仅是询问信息。"},{"question":"在表示请求（比如 Can I...?）或邀请（比如 Would you like...?）的疑问句中，我们习惯用 `some` 还是 `any`？","hint":"回忆一下“你想来点茶吗？”这句话的英文表达。","takeaway":"在表示请求或邀请并期待肯定回答的疑问句中，我们习惯使用 `some`。"}]},{"title":"量词搭配","steps":[{"question":"除了 `some`，我们还有什么方法可以表示一定数量的“水”呢？比如想说“一杯水”或“两瓶水”？","hint":"我们需要借助一些表示容器或单位的词。","takeaway":"我们可以用“数词 + 量词 + of + 不可数名词”的结构，如 `a glass of water` 或 `two bottles of water`。"},{"question":"对比一下 `a glass of water` 和 `some water`，它们在意思上有什么不同？","hint":"一个指明了具体的量，另一个则是一个比较模糊的量。","takeaway":"`a glass of water` 指的是具体的“一杯水”，而 `some water` 指的是不确定数量的“一些水”。"}]}]}},{"number":"14","item_type":"choice","context_note":"","stem":"Lingling is in _____.","options":{"A":"Class Four, Grade One","B":"Grade One, Class Four","C":"Class Four, Grade one","D":""},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题考查英语中“班级”和“年级”的表达顺序及书写规范。\n1.  **表达顺序**：与中文“从大到小”（先年级后班级）的习惯不同，英语在表达此类层级关系时，遵循“从小到大”的原则。班级（Class）是比年级（Grade）更小的单位，所以要先说班级，后说年级。因此，“一年级四班”应表达为 `Class Four, Grade One`。\n2.  **书写规范**：`Class Four` 和 `Grade One` 都是特指某个班级和年级的专有名词，因此每个实词的首字母都需要大写。\n\n- 选项 A `Class Four, Grade One` 顺序正确，大小写规范。\n- 选项 B `Grade One, Class Four` 顺序错误，是中文语序的直接翻译。\n- 选项 C `Class Four, Grade one` 中 `one` 未大写，不符合专有名词的书写规范。","knowledge_expansion_md":"### 英语中的“从小到大”原则\n\n英语在表达许多包含层级关系的信息时，都遵循“从小到大”的顺序，这与中文的“从大到小”原则正好相反。熟记这一差异对英语学习至关重要。\n\n1.  **姓名**：名 + 姓 (Given Name + Family Name)\n    *   `Tom Smith` (汤姆·史密斯)\n\n2.  **地址**：门牌号 -> 街道 -> 城市 -> 省份 -> 国家\n    *   `No. 123, Renmin Road, Chengdu, Sichuan, China` (中国四川省成都市人民路123号)\n\n3.  **时间**：时刻 -> 上/下午 -> 星期 -> 月份 -> 年份\n    *   `at 3 p.m. on Monday, May 20th, 2024` (2024年5月20日星期一下午3点)\n\n4.  **职位/头衔**：先说具体职位，再说所属部门/公司\n    *   `the manager of the Sales Department` (销售部经理)\n\n掌握这一核心原则，可以帮助我们更地道、更准确地使用英语进行表达。","socratic_tracks":[{"title":"中英文表达顺序差异","steps":[{"question":"在中文里，我们说“一年级四班”，是先说大的单位“年级”，还是先说小的单位“班级”？","hint":"想一想，“年级”和“班级”哪个包含的范围更广？","takeaway":"中文的表达顺序是“从大到小”，先说年级，再说班级。"},{"question":"那么，在英语中，表达地址或类似的层级关系时，顺序和中文一样吗？比如写英文信封上的地址。","hint":"英文地址是先写国家名，还是先写门牌号和街道名？","takeaway":"英语的表达顺序与中文相反，遵循“从小到大”的原则。"},{"question":"根据“从小到大”的原则，`Class` (班级) 和 `Grade` (年级) 应该哪个在前，哪个在后？","hint":"班级是年级的一部分，所以班级是更小的单位。","takeaway":"英语中应先说 `Class`（小单位），再说 `Grade`（大单位）。"}]},{"title":"专有名词的大写规则","steps":[{"question":"请仔细观察选项 A 和选项 C，它们之间唯一的区别是什么？","hint":"注意 `Grade One` 和 `Grade one` 的写法。","takeaway":"区别在于 `one` 这个词的首字母是否大写。"},{"question":"当我们说“一年级”或“四班”时，我们是在泛指任何一个年级或班级，还是在特指某一个具体的集体？","hint":"这就像“成都七中实验学校”一样，是一个特定的名称。","takeaway":"`Class Four` 和 `Grade One` 都是专有名词，指代特定的集体。"},{"question":"在英语中，专有名词的书写有什么规定？","hint":"想想你的英文名、国家名、月份等单词的首字母。","takeaway":"专有名词中每个实词的首字母都必须大写，因此 `Grade One` 是正确的写法。"}]},{"title":"排除法应用","steps":[{"question":"让我们先看选项 B `Grade One, Class Four`。这个顺序符合我们刚刚讨论的哪个语言的习惯？","hint":"“年级”在前，“班级”在后。","takeaway":"这个顺序是中文的表达习惯，在英语中是错误的，因此可以排除B。"},{"question":"再看选项 C `Class Four, Grade one`。它的顺序正确吗？书写上有什么问题？","hint":"顺序是“班级，年级”，但注意 `one` 的大小写。","takeaway":"它的顺序正确，但 `one` 没有大写，不符合专有名词的书写规范，因此可以排除C。"},{"question":"排除了 B 和 C 之后，剩下的选项 A 是否在顺序和大小写方面都符合英语的规范？","hint":"检查 `Class Four, Grade One` 的顺序和大小写。","takeaway":"选项 A 顺序正确（从小到大），大小写也规范（专有名词首字母大写），是正确答案。"}]}]}},{"number":"15","item_type":"choice","context_note":"","stem":"What's your _____ fruit?","options":{"A":"very like","B":"favourite","C":"much like","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查询问喜好的句型和词性。句子意为“你最喜欢的水果是什么？”\n- 句子的结构是 `What's your _____ fruit?`，其中 `your` 是形容词性物主代词，`fruit` 是名词。空格处需要一个形容词来修饰名词 `fruit`。\n- 选项 A `very like` 和选项 C `much like` 都是“副词+动词”的结构，不能作定语修饰名词，语法错误。\n- 选项 B `favourite` 是一个形容词，意为“最喜爱的”，可以放在名词 `fruit` 前作定语，构成 `your favourite fruit`（你最喜爱的水果），完全符合句意和语法结构。\n- 因此，正确答案是 B。","knowledge_expansion_md":"### `favourite` vs `like`\n\n`favourite` 和 `like` 都与“喜欢”有关，但词性和用法完全不同，是初学者常见的混淆点。\n\n1.  **`favourite`**:\n    *   **词性**：形容词（最喜爱的）或名词（最喜爱的人或物）。\n    *   **用法**：\n        *   作形容词，修饰名词：`My favourite color is blue.` (我最喜欢的颜色是蓝色。)\n        *   作名词：`What's your favourite?` (你最喜欢的是什么？) / `Blue is my favourite.` (蓝色是我的最爱。)\n\n2.  **`like`**:\n    *   **词性**：动词（喜欢）或介词（像）。在本语境下主要讨论动词用法。\n    *   **用法**：\n        *   作动词，后面跟名词或动名词：`I like apples.` (我喜欢苹果。) / `I like swimming.` (我喜欢游泳。)\n        *   要表达“非常喜欢”，需用副词修饰：`I like apples very much.`\n\n**提问“最喜欢”的两种句型**：\n- `What's your favourite + 名词?` (e.g., `What's your favourite subject?`)\n- `Which + 名词 + do you like best/most?` (e.g., `Which subject do you like best?`)","socratic_tracks":[{"title":"句子成分与词性分析","steps":[{"question":"在短语 `your _____ fruit` 中，`your` (你的) 和 `fruit` (水果) 分别是什么词性的单词？","hint":"`your` 用来表明“谁的”，`fruit` 是一个东西的名称。","takeaway":"`your` 是形容词性物主代词，`fruit` 是名词。"},{"question":"那么，夹在 `your` 和 `fruit` 中间的这个词，应该起到什么作用？它应该是什么词性？","hint":"这个词是用来描述 `fruit` 的，比如“红色的水果”、“好吃的水果”。","takeaway":"空格处需要一个形容词，作定语来修饰名词 `fruit`。"},{"question":"现在看三个选项：`very like`, `favourite`, `much like`。哪一个词是形容词？","hint":"`like` 是动词“喜欢”，`favourite` 的意思是“最喜爱的”。","takeaway":"只有 `favourite` 是形容词，可以直接放在名词前修饰它。"}]},{"title":"辨析 `like` 和 `favourite`","steps":[{"question":"如果我想表达“我喜欢水果”，应该用 `like` 还是 `favourite`？","hint":"“喜欢”是一个动作。","takeaway":"应该用动词 `like`，说成 `I like fruit`。"},{"question":"如果我想说“苹果是我最喜欢的水果”，应该怎么表达？","hint":"这里“最喜欢的”是用来形容“水果”的。","takeaway":"应该用形容词 `favourite`，说成 `Apple is my favourite fruit`。"},{"question":"总结一下，`like` 和 `favourite` 在用法上最根本的区别是什么？","hint":"一个表示动作，一个用来描述事物。","takeaway":"`like` 是一个动词，而 `favourite` 是一个形容词（或名词）。"}]},{"title":"理解提问方式","steps":[{"question":"这句话 `What's your _____ fruit?` 翻译成中文是什么意思？","hint":"它在询问关于水果的个人偏好。","takeaway":"它想问的是“你最喜欢的水果是什么？”"},{"question":"我们能说 `What's your very like fruit?` 吗？为什么听起来很奇怪？","hint":"`like` 是动词，不能像形容词一样放在名词前面。","takeaway":"动词不能直接修饰名词，`very like fruit` 的语序是错误的。"},{"question":"除了用 `What's your favourite...?`，你还能想到其他方式来问“你最喜欢的水果是哪一个”吗？","hint":"可以尝试用动词 `like` 和疑问词 `which` 来造句。","takeaway":"我们也可以问 `Which fruit do you like best?`"}]}]}},{"number":"16","item_type":"choice","context_note":"","stem":"She can't _____ in the lake.","options":{"A":"swimming","B":"swiming","C":"swim","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查情态动词 `can` 的用法。`can't` 是情态动词 `can` 的否定形式，意为“不能”或“不会”。\n\n情态动词（如 `can`, `must`, `should`, `may` 等）有一个非常重要的语法规则：其后面必须跟动词原形（verb in its base form）。\n\n- 选项 A `swimming` 是动词的现在分词（-ing形式），不符合要求。\n- 选项 B `swiming` 是 `swimming` 的错误拼写，可以直接排除。\n- 选项 C `swim` 是动词“游泳”的原形。\n\n因此，只有 `swim` 可以跟在 `can't` 后面，构成 `She can't swim in the lake.`（她不可以在湖里游泳）。","knowledge_expansion_md":"### 情态动词 (Modal Verbs) 用法小结\n\n情态动词是一类特殊的助动词，用于表达说话者的能力、许可、义务、推测等语气。它们有一些共同的语法特征：\n\n1.  **无人称和数的变化**：情态动词本身不随主语是第几人称或单复数而改变形式。主语是 `he/she/it` 时，情态动词结尾不加 `-s`。\n    *   正确：`He can swim.`\n    *   错误：`He cans swim.`\n\n2.  **后跟动词原形**：情态动词后面必须直接跟动词原形，动词不能是带 `to` 的不定式、`-ing` 形式或过去式。\n    *   正确：`You should go.`\n    *   错误：`You should to go / going / went.`\n\n3.  **否定和疑问形式**：\n    *   **否定**：直接在情态动词后加 `not`。例如：`cannot (can't)`, `must not (mustn't)`, `should not (shouldn't)`。\n    *   **疑问**：将情态动词提到句首。例如：`Can you help me?`\n\n**常见情态动词**：`can/could`, `may/might`, `must`, `shall/should`, `will/would`。","socratic_tracks":[{"title":"情态动词的基本规则","steps":[{"question":"句子中的 `can't` 是什么类型的词？它表达了什么意思？","hint":"`can` 表示“能够，可以”，`can't` 是它的否定形式。这类词我们称之为情态动词。","takeaway":"`can't` 是情态动词，表示“不能”或“不会”。"},{"question":"回想一下我们学过的情态动词，比如 `must` (必须), `should` (应该)。它们后面跟的动词是什么形式？","hint":"想一想 `You must go.` 和 `I can fly.` 这两个句子中，`go` 和 `fly` 是什么形式？","takeaway":"情态动词后面必须跟动词原形。"},{"question":"那么，在 `swimming`, `swiming`, `swim` 这三个选项中，哪一个是动词“游泳”的原形？","hint":"动词原形就是动词在字典里最基本、不加任何词尾变化的形式。","takeaway":"`swim` 是动词原形，所以是正确答案。"}]},{"title":"动词形式辨析","steps":[{"question":"我们来看选项 A `swimming`。动词加 `-ing` 通常是什么形式？用在什么时态里？","hint":"比如，`I am swimming now.` (我现在正在游泳。)","takeaway":"`swimming` 是现在分词形式，常用于进行时态，不能直接跟在情态动词后面。"},{"question":"选项 B `swiming` 是一个正确的单词吗？","hint":"仔细拼写一下 `swim` 的-ing形式，看看结尾的字母 `m` 是否需要双写。","takeaway":"`swiming` 是 `swimming` 的错误拼写，可以直接排除。"},{"question":"最后看选项 C `swim`。它是什么形式？是否满足 `can't` 后面的语法要求？","hint":"它没有任何添加的词尾，是动词最原始的样子。","takeaway":"`swim` 是动词原形，完全符合情态动词 `can't` 后面的语法要求。"}]},{"title":"举一反三","steps":[{"question":"我们已经知道 `can't` 后面要跟动词原形。那么，如果我想说“他必须走”，应该说 `He must go.` 还是 `He must goes.`？","hint":"`must` 也是情态动词，主语是 `He`（第三人称单数）。","takeaway":"情态动词没有人称变化，后面也跟动词原形，所以是 `He must go.`。"},{"question":"如果我想把 `She can swim.` 变成一个问句，应该怎么变？","hint":"对于包含情态动词的句子，如何构成疑问句？","takeaway":"直接将情态动词提到句首，变成 `Can she swim?`。"},{"question":"通过这几个例子，你能总结出情态动词的两个关键特点吗？","hint":"一个关于它自身的形式，一个关于它后面的动词形式。","takeaway":"情态动词自身无人称和数的变化，并且其后必须跟动词原形。"}]}]}},{"number":"17","item_type":"choice","context_note":"","stem":"There _____ a cat and two dogs in my home.","options":{"A":"be","B":"is","C":"are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查 `There be` 句型中的主谓一致原则。`There be` 句型的基本含义是“某地有某物”。当 `be` 动词后跟有多个并列主语时，`be` 动词的形式遵循“就近原则”。也就是说，`be` 动词的单复数形式由离它最近的那个名词的单复数来决定。本题中，紧跟在横线后面的是 `a cat`，是一个单数名词，因此 `be` 动词应使用单数形式 `is`。","knowledge_expansion_md":"### `There be` 句型与“就近原则”\n\n1.  **基本结构**：`There be + 名词 + 地点/时间状语`，表示“存在”。\n2.  **就近原则 (Principle of Proximity)**：当主语是由 `and`, `or`, `either...or...`, `neither...nor...`, `not only...but also...` 连接的两个或多个名词/代词时，谓语动词的形式通常与离它最近的主语保持一致。\n    *   `There is a cat and two dogs in my home.` (动词 `is` 与 `a cat` 一致)\n    *   `There are two dogs and a cat in my home.` (动词 `are` 与 `two dogs` 一致)\n3.  **注意**：在口语中，如果第一个名词是单数，有时人们也习惯性地使用 `There's`，即使后面跟着复数名词，如 `There's a cat and two dogs`。但在标准书面语和考试中，严格遵守“就近原则”是必要的。","socratic_tracks":[{"title":"There be 句型","steps":[{"question":"这个句子是想表达“谁做了什么”，还是“某个地方有什么东西”？","hint":"观察句子的开头 `There`，它通常引导哪种句型？","takeaway":"以 `There` 开头的句子通常是 `There be` 句型，表示“某地有某物”。"},{"question":"在 `There be` 句型中，动词 `be` 的形式（is/are）由谁来决定？","hint":"是由句首的 `There` 决定，还是由它后面的名词决定？","takeaway":"`be` 动词的形式由其后面的名词的单复数决定。"}]},{"title":"主谓一致：就近原则","steps":[{"question":"这个句子里，横线后面提到了哪些东西？它们的数量是单数还是复数？","hint":"请看 `a cat` 和 `two dogs`。","takeaway":"句中提到了“一只猫”（单数）和“两只狗”（复数）。"},{"question":"当 `be` 动词后面跟着好几个名词时，它应该跟哪个名词保持一致呢？","hint":"是跟第一个，还是跟第二个，还是跟全部？想一想“就近”是什么意思。","takeaway":"动词遵循“就近原则”，即与离它最近的那个名词的单复数保持一致。"},{"question":"那么，根据“就近原则”，这个空应该填 `is` 还是 `are`？","hint":"离横线最近的名词是 `a cat`。","takeaway":"因为 `a cat` 是单数，所以应该用 `is`。"}]},{"title":"选项分析","steps":[{"question":"选项 A `be` 是动词原形，它能直接用在这个句子中作谓语吗？","hint":"我们说“我是一个学生”是 `I be a student` 还是 `I am a student`？","takeaway":"动词原形 `be` 不能直接作谓语，必须根据主语和时态进行变化，所以 A 错误。"},{"question":"选项 B `is` 和选项 C `are` 分别用在什么情况下？","hint":"哪个用于单数名词，哪个用于复数名词？","takeaway":"`is` 用于单数或不可数名词，`are` 用于复数名词。"},{"question":"结合本题的“就近原则”，应该选择 `is` 还是 `are`？","hint":"横线后面紧跟着的是单数名词 `a cat`。","takeaway":"因为要和单数名词 `a cat` 匹配，所以正确答案是 `is`。"}]}]}},{"number":"18","item_type":"choice","context_note":"","stem":"He _____ hamburgers.","options":{"A":"like eat","B":"likes eating","C":"like to eats","D":""},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"本题考查两个核心语法点：一般现在时中第三人称单数的主谓一致，以及动词 `like` 的用法。首先，句子的主语是 `He`（他），是第三人称单数。在一般现在时中，谓语动词需要加 `-s` 或 `-es`，所以 `like` 应变为 `likes`。其次，动词 `like` 后面若跟另一个动词，该动词需使用非谓语形式，即动名词（doing）或不定式（to do）。综合来看，选项 B `likes eating` 既满足了主谓一致，又符合 `like doing sth.` 的用法，因此是正确答案。","knowledge_expansion_md":"### 动词 `like` 的用法及主谓一致\n\n1.  **主谓一致（第三人称单数）**：在一般现在时中，当主语是 `he`, `she`, `it`, 单个人名（如 `Tom`），或单个事物（如 `the dog`）时，谓语动词通常要在词尾加 `-s` 或 `-es`。例如：`He runs fast.`, `She watches TV.`\n\n2.  **`like` 的用法**：\n    *   `like doing sth.`：表示一种习惯性的爱好或享受过程。例如：`I like swimming.` (我喜欢游泳这项运动)。\n    *   `like to do sth.`：多表示一次性的、具体的或有选择性的“喜欢做”。例如：`I like to swim in the sea when I'm on vacation.` (度假时我喜欢去海里游泳)。\n    *   在小升初阶段，`like doing` 和 `like to do` 通常可互换，都表示“喜欢做某事”。\n\n3.  **常见错误结构**：一个简单句中不能连续出现两个谓语动词。`He like eat` 是典型的错误，正确的必须是 `He likes eating` 或 `He likes to eat`。","socratic_tracks":[{"title":"主谓一致","steps":[{"question":"这个句子的主语是谁？是第几人称？是单数还是复数？","hint":"句子的第一个单词是 `He`。","takeaway":"主语是 `He`，属于第三人称单数。"},{"question":"当主语是第三人称单数，并且描述一个习惯性动作时，谓语动词 `like` 应该有什么变化？","hint":"动词词尾需要加 `-s` 吗？","takeaway":"在一般现在时中，主语为第三人称单数时，谓语动词需加 `-s`，所以 `like` 要变成 `likes`。"}]},{"title":"动词 `like` 的用法","steps":[{"question":"“喜欢”和“吃”是两个动词，它们能直接放在一起吗？比如 `likes eat`？","hint":"一个简单句子里，通常只有一个主动词（谓语动词）。","takeaway":"一个句子不能有两个谓语动词，第二个动词需要变成非谓语形式。"},{"question":"动词 `like` 后面如果再跟一个动词，这个动词可以变成哪两种形式？","hint":"想一想动词的 `-ing` 形式和 `to do` 形式。","takeaway":"`like` 后面可以跟动名词（doing）或不定式（to do）。"}]},{"title":"排除法解题","steps":[{"question":"看选项 A `like eat` 和 C `like to eats`，它们在 `like` 的形式上有什么共同的错误？","hint":"主语是 `He`，`like` 的形式对吗？","takeaway":"选项 A 和 C 中的 `like` 都没有变成第三人称单数形式 `likes`，因此都是错误的。"},{"question":"再看选项 C `like to eats`，除了 `like` 形式不对，`to eats` 这个结构本身对吗？","hint":"不定式符号 `to` 后面应该跟动词的什么形式？","takeaway":"`to` 后面必须跟动词原形，所以 `to eats` 是错误的，应该是 `to eat`。"},{"question":"现在分析选项 B `likes eating`，它是否同时满足了主谓一致和 `like` 的用法规则？","hint":"检查 `likes` 的形式和 `eating` 的形式是否都正确。","takeaway":"`likes` 符合第三人称单数，`eating` 是 `like` 后面可以跟的动名词形式，所以 B 完全正确。"}]}]}},{"number":"19","item_type":"choice","context_note":"","stem":"The office building _____ the classrooms.","options":{"A":"behind","B":"behinds","C":"is behind","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查英语句子的基本结构。一个完整的陈述句必须包含主语和谓语。本句的主语是 `The office building`（办公楼），但缺少谓语部分。选项 A `behind` 是一个介词，表示“在……后面”，它不能独立充当谓语。选项 B `behinds` 是一个不存在的错误词形。选项 C `is behind` 包含了系动词 `is` 和介词 `behind`，共同构成了句子的谓语，表示“（办公楼）在……后面”，使得句子结构完整，意思通顺。因此，C 是正确答案。","knowledge_expansion_md":"### 句子基本结构：主语 + 系动词 + 表语\n\n1.  **句子成分**：一个完整的英文句子必须有主语（Subject）和谓语（Predicate）。谓语的核心是动词。\n2.  **系动词 (Linking Verb)**：`be` 动词 (`am`, `is`, `are`, `was`, `were`) 是最常见的系动词。它们本身没有实际动作意义，主要作用是连接主语和其后的表语，说明主语的身份、状态、性质或位置。\n3.  **表语 (Predicative)**：跟在系动词后面，说明主语情况的词或短语。表语可以是名词、形容词，也可以是介词短语。\n    *   `He is a doctor.` (表语是名词)\n    *   `The flowers are beautiful.` (表语是形容词)\n    *   `The book is on the desk.` (表语是介词短语)\n4.  **常见错误**：汉语中常省略相当于“是”的动词，如“我在家”，但英语中必须有系动词，不能说 `I at home.`，而应说 `I am at home.`。本题就是考察学生是否掌握了这一区别。","socratic_tracks":[{"title":"句子成分完整性","steps":[{"question":"一个完整的英文句子，最少需要哪两个部分？","hint":"想一想，一句话总得有“谁/什么”和“怎么样/做什么”。","takeaway":"一个完整的句子必须有主语和谓语。"},{"question":"在这个句子里，`The office building` 是什么成分？","hint":"这句话是在说关于谁/什么的事情？","takeaway":"`The office building` 是句子的主语。"},{"question":"那么，横线上应该填入什么成分来让这个句子完整？","hint":"有了主语，还缺少什么？","takeaway":"横线上缺少谓语，而谓语的核心必须是一个动词。"}]},{"title":"词性辨析","steps":[{"question":"选项 A `behind` 是什么词性？它能单独作谓语动词吗？","hint":"像 `in`, `on`, `at`, `behind` 这类表示位置的词，叫什么词？","takeaway":"`behind` 是介词，不能单独作谓语。"},{"question":"我们想用介词短语 `behind the classrooms` 来描述主语的位置，应该在它前面加一个什么词来连接主语？","hint":"这个词就像一座桥，连接主语和它的状态/位置。","takeaway":"需要在介词短语前加上一个系动词，如 `is` 或 `are`。"},{"question":"主语 `The office building` 是单数还是复数？应该用 `is` 还是 `are`？","hint":"“办公楼”是一座还是多座？","takeaway":"主语是单数，所以应该用系动词 `is`。"}]},{"title":"选项排除","steps":[{"question":"为什么选项 A `behind` 是错的？","hint":"如果填入 `behind`，这个句子还缺什么重要成分？","takeaway":"填入 `behind` 会导致句子缺少谓语动词，句子不完整。"},{"question":"选项 B `behinds` 这个词对吗？介词有第三人称单数形式吗？","hint":"我们学过 `in` 的第三人称单数是 `ins` 吗？","takeaway":"介词没有词形变化，`behinds` 是一个错误的词，所以 B 错误。"},{"question":"为什么选项 C `is behind` 是正确的？","hint":"分析一下 `is behind` 这个组合在句子中充当了什么成分，是否让句子完整了？","takeaway":"`is behind` 构成了完整的谓语，连接了主语和地点状语，使句子结构正确、意义完整。"}]}]}},{"number":"20","item_type":"choice","context_note":"","stem":"_____ there any apples in the kitchen?","options":{"A":"Is","B":"Be","C":"Are","D":""},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"本题考查 `There be` 句型的一般疑问句形式。`There be` 句型的陈述句是 `There is/are...`，变为一般疑问句时，需要将系动词 `is` 或 `are` 提到句首。选择 `Is` 还是 `Are` 取决于其后的名词的单复数形式。在本句中，名词是 `any apples`，其中 `apples` 是可数名词 `apple` 的复数形式。因此，系动词需要使用复数形式 `Are`。完整的问句是 `Are there any apples in the kitchen?`（厨房里有苹果吗？）。","knowledge_expansion_md":"### `There be` 句型的一般疑问句\n\n`There be` 句型的一般疑问句遵循“be 动词提前”的规则。\n\n1.  **结构**：\n    *   `Is there + 单数名词/不可数名词 ...?`\n        *   例：`Is there a pen on the desk?` (桌上有支钢笔吗？)\n        *   例：`Is there any water in the bottle?` (瓶子里有水吗？)\n    *   `Are there + (any) + 复数名词 ...?`\n        *   例：`Are there any people in the room?` (房间里有人吗？)\n\n2.  **`any` 和 `some` 的区别**：`any` 常用于否定句和疑问句中，表示“任何；一些”。`some` 常用于肯定句中，表示“一些”。\n\n3.  **简略回答**：\n    *   对 `Is there...?` 的回答：`Yes, there is.` / `No, there isn't.`\n    *   对 `Are there...?` 的回答：`Yes, there are.` / `No, there aren't.`\n    *   注意回答时要用 `is/are`，与提问保持一致，不能混淆。","socratic_tracks":[{"title":"疑问句结构","steps":[{"question":"这个句子以横线开头，以问号结尾，它是什么类型的句子？","hint":"陈述句、疑问句、祈使句、感叹句，是哪一种？","takeaway":"这是一个一般疑问句。"},{"question":"`There are some apples.` 这个陈述句，如果想把它变成“有苹果吗？”的疑问句，应该把哪个词移到最前面？","hint":"对于包含 `be` 动词的句子，变疑问句通常是移动 `be` 动词。","takeaway":"需要把 `be` 动词（is/are）提到句首，构成 `Is/Are there...?` 的结构。"}]},{"title":"主谓一致判断","steps":[{"question":"我们要决定用 `Is` 还是 `Are`，应该看句子里的哪个词？","hint":"动词的形式由谁的单复数决定？","takeaway":"应该看名词 `any apples` 的单复数形式。"},{"question":"`apples` 是单数还是复数？","hint":"这个词的词尾有 `-s`。","takeaway":"`apples` 是 `apple` 的复数形式。"},{"question":"既然名词是复数，那么开头的 `be` 动词应该用 `Is` 还是 `Are`？","hint":"`Is` 用于单数，`Are` 用于复数。","takeaway":"对应复数名词 `apples`，应该使用 `Are`。"}]},{"title":"选项辨析与排除","steps":[{"question":"选项 B `Be` 是动词原形，它能用在一般疑问句的开头吗？","hint":"我们问“你是学生吗？”会说 `Be you a student?` 吗？","takeaway":"一般疑问句的句首不能直接使用动词原形 `Be`，所以 B 错误。"},{"question":"选项 A `Is` 用在什么情况下？这个句子里的名词 `apples` 符合这种情况吗？","hint":"`Is there` 后面通常跟单数名词或不可数名词。","takeaway":"`Is` 用于单数，而 `apples` 是复数，所以 A 错误。"},{"question":"为什么只有选项 C `Are` 是正确的？","hint":"从疑问句结构和主谓一致两方面来确认。","takeaway":"`Are` 不仅构成了正确的疑问句结构，也与复数名词 `apples` 在数上保持了一致。"}]}]}}]},{"section_title":"II. 智力测验 (共5分)","section_instruction":"","items":[{"number":"21","item_type":"choice","context_note":"","stem":"Paris is the capital of _____.","options":{"A":"the USA","B":"the UK","C":"France","D":"Australia"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考查的是世界地理常识。\n- 题干意为“巴黎是_____的首都”。\n- Paris (巴黎) 是法国 (France) 的首都，这是世界著名的地理知识点。\n- 选项A，the USA (美国) 的首都是 Washington, D.C. (华盛顿特区)。\n- 选项B，the UK (英国) 的首都是 London (伦敦)。\n- 选项D，Australia (澳大利亚) 的首都是 Canberra (堪培拉)。\n- 因此，正确答案是C。","knowledge_expansion_md":"**1. 核心词汇：**\n   - `capital` (n.) 首都；大写字母；资本。在本题中意为“首都”。\n\n**2. 常见国家与首都：**\n   - China (中国) - Beijing (北京)\n   - Japan (日本) - Tokyo (东京)\n   - Russia (俄罗斯) - Moscow (莫斯科)\n   - Canada (加拿大) - Ottawa (渥太华)\n\n**3. 国名前的冠词用法：**\n   - 大多数专有名词国名前不加定冠词 `the`，如 `France`, `Australia`, `China`。\n   - 但对于一些由普通名词构成的复数国名或缩写国名，通常需要加 `the`。例如：\n     - `the USA` (the United States of America，美利坚合众国)\n     - `the UK` (the United Kingdom，联合王国)\n     - `the Philippines` (菲律宾群岛)","socratic_tracks":[{"title":"地理常识","steps":[{"question":"题目问的是巴黎是哪个国家的首都。你知道巴黎是哪个国家的著名城市吗？","hint":"埃菲尔铁塔、卢浮宫都在这个城市。","takeaway":"巴黎是法国的首都。"},{"question":"那你知道其他选项中的国家，它们的首都分别是什么吗？比如美国的首都？","hint":"美国的首都不是它最著名的城市纽约，而是华盛顿特区。","takeaway":"掌握常见国家的首都是一项重要的文化常识。"}]},{"title":"词汇辨析","steps":[{"question":"句子中的 'capital' 是什么意思？","hint":"一个国家的政治中心通常被称为 'capital'。","takeaway":"`capital` 在这里指“首都”。"},{"question":"`capital` 这个词还有其他意思吗？比如在经济或写作中？","hint":"想想 'capital letter' 和 'invest capital'。","takeaway":"`capital` 还可以表示“大写字母”或“资本、资金”。"}]},{"title":"冠词用法","steps":[{"question":"观察选项 A 和 B，'the USA' 和 'the UK'，为什么这两个国家名前面有 'the'？","hint":"想想这两个国家名字的全称是什么？它们是缩写或含有普通名词（如'kingdom', 'states'）吗？","takeaway":"由普通名词构成的复数国名或缩写国名，前面通常要加定冠词 the。"},{"question":"那选项 C 和 D 的 'France' 和 'Australia' 前面为什么没有 'the' 呢？","hint":"它们是单一的、专有的国家名称吗？","takeaway":"大多数单一的专有名词国名前不加冠词 the。"}]}]}},{"number":"22","item_type":"choice","context_note":"","stem":"About _____ percent of the earth's surface is covered with water.","options":{"A":"29","B":"82","C":"71","D":"100"},"answer_area_hint":"","teaching":{"correct_answer":"C","explanation_md":"这道题考查的是关于地球的科学常识。\n- 题干意为“地球表面大约有百分之_____被水覆盖”。\n- 根据科学知识，地球表面约71%是海洋和水域，约29%是陆地。\n- 因此，人们常说地球是一个“水球”。\n- 选项A的29%是陆地所占的大约比例。\n- 选项B和D的数值明显不符合常识。\n- 所以，正确答案是71%。","knowledge_expansion_md":"**1. 核心词汇与短语：**\n   - `percent` (n.) 百分之...，通常与具体数字连用，如 `71 percent`。\n   - `surface` (n.) 表面，`the earth's surface` 意为“地球表面”。\n   - `be covered with` 被...覆盖，为被动语态结构，常用于描述地理或自然现象。例如：`The mountains are covered with snow.` (群山被雪覆盖。)\n\n**2. 百分比的表达：**\n   - `percent` 和 `percentage` 的区别：`percent` 前面必须有具体数字；`percentage` (n.) 意为“百分比，比例”，用法更灵活，如 `a high percentage` (一个很高的百分比)。\n\n**3. 副词 `about` 的用法：**\n   - `about` 在这里意为“大约，将近”，相当于 `around` 或 `approximately`，表示数值并非绝对精确。","socratic_tracks":[{"title":"科学常识","steps":[{"question":"我们常说地球是一个“水球”，你知道地球上是水多还是陆地多吗？","hint":"回想一下你在地理课或科学课上学到的知识，或者看看地球仪的颜色分布。","takeaway":"地球表面大部分是水。"},{"question":"既然水比陆地多，那水的占比肯定超过50%。那具体大约是多少呢？你知道陆地大约占多少吗？","hint":"陆地面积大约是29%。那么水面面积就是100%减去29%。","takeaway":"地球表面约71%是水，29%是陆地。"}]},{"title":"词汇与短语","steps":[{"question":"句子中的 'is covered with' 是什么意思？它是什么语态？","hint":"主语 'the earth's surface' 和动词 'cover' 之间是什么关系？是地球表面主动去覆盖水，还是被水覆盖？","takeaway":"`is covered with` 意为“被……覆盖”，是被动语态。"},{"question":"我们还能用什么词或短语替换 'with' 吗？比如 'be covered by' 或者 'be covered in'？","hint":"这三个介词在很多情况下可以互换，但 'with' 和 'in' 更常用于表示覆盖物是均匀遍布的。","takeaway":"在表达“被……覆盖”时，`be covered with/in/by` 都可以使用，但 `with` 最为常见。"}]},{"title":"数字与单位","steps":[{"question":"题目中的 'percent' 是什么意思？它和 'percentage' 有什么区别？","hint":"`percent` 通常跟在具体数字后面，如 '71 percent'。而 'percentage' 是一个名词，表示“百分比，比例”，如 'What is the percentage of water?'。","takeaway":"`percent` 是“百分之…”，前面必须有具体数字；`percentage` 是名词“百分比”。"},{"question":"我们如何用英语读出 '71%' 这个符号？","hint":"直接把数字和 'percent' 这个词连起来读。","takeaway":"'71%' 读作 'seventy-one percent'。"}]}]}},{"number":"23","item_type":"choice","context_note":"","stem":"A car travels at a rate of 50 miles per hour. How long will it take to travel 300 miles?","options":{"A":"250 hours","B":"6 hours","C":"1/6 hours","D":"15,000 hours"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这是一道用英语表述的数学应用题。\n- 题干意为：一辆汽车以每小时50英里的速度行驶。行驶300英里需要多长时间？\n- 题目给出了速度 (rate) 和路程 (distance)，要求计算时间 (time)。\n- 我们可以使用公式：时间 = 路程 ÷ 速度。\n- 路程是 300 英里 (miles)。\n- 速度是每小时 50 英里 (50 miles per hour)。\n- 进行计算：300 ÷ 50 = 6。\n- 因此，所需时间为 6 小时 (6 hours)。","knowledge_expansion_md":"**1. 核心词汇：**\n   - `travel` (v.) 行驶，旅行\n   - `rate` (n.) 速率，速度 (在此处等于 `speed`)\n   - `per` (prep.) 每\n   - `hour` (n.) 小时\n   - `mile` (n.) 英里 (长度单位，1英里 ≈ 1.6公里)\n   - `How long` 提问“多长时间”\n\n**2. 跨学科解题能力：**\n   - 此类题目被称为“应用题”(word problem)，考验学生在英语语境下提取关键数学信息（数字、单位、问题）并进行正确计算的能力。\n\n**3. 核心公式：**\n   - 路程、速度和时间的关系是小学数学的基础。\n   - `Distance = Speed × Time` (路程 = 速度 × 时间)\n   - `Time = Distance / Speed` (时间 = 路程 ÷ 速度)\n   - `Speed = Distance / Time` (速度 = 路程 ÷ 时间)","socratic_tracks":[{"title":"数学逻辑","steps":[{"question":"这个问题要求我们计算什么？是路程、速度还是时间？","hint":"问题以 'How long' 开头，这是在询问时长。","takeaway":"问题要求计算行驶所需的时间。"},{"question":"计算时间需要哪两个已知条件？题目中给出了吗？","hint":"时间、速度、路程三者之间有固定的关系。题目给出了速度（50 miles per hour）和路程（300 miles）。","takeaway":"计算时间需要知道路程和速度。"},{"question":"那么，如何用给出的路程和速度来计算时间呢？","hint":"想一想，每小时走50英里，要走300英里，需要几个小时？应该用除法还是乘法？","takeaway":"时间等于路程除以速度，即 300 除以 50。"}]},{"title":"关键词汇理解","steps":[{"question":"短语 '50 miles per hour' 是什么意思？","hint":"`per` 的意思是“每一”，`hour` 是“小时”。","takeaway":"`50 miles per hour` 指的是速度为“每小时50英里”。"},{"question":"这里的 'rate' 指的是什么？它和 'speed' 有什么关系？","hint":"在描述物体运动时，这两个词意思非常相近。","takeaway":"在这里 'rate' 就是 'speed'（速度）的同义词。"}]},{"title":"提问方式解析","steps":[{"question":"问题开头的 'How long' 是在问什么？","hint":"它可以问物体的长度，也可以问时间的长度。","takeaway":"`How long` 在这里是用来询问“多长时间”。"},{"question":"如果我们想问“多远”，应该用哪个疑问词组？","hint":"询问距离或路程，我们用 'far'。","takeaway":"询问距离用 'How far'，询问时长用 'How long'。"}]}]}},{"number":"24","item_type":"choice","context_note":"","stem":"The red car is _____ than the black one.","options":{"A":"nice","B":"nicer","C":"very nice","D":"nicest"},"answer_area_hint":"","teaching":{"correct_answer":"B","explanation_md":"这道题考查形容词的比较级用法。\n- 句中出现了关键词 `than`，意为“比”，是比较级的标志。\n- 这句话是在比较“红色的车”和“黑色的车”两者。\n- 当比较两者时，需要使用形容词的比较级形式。\n- 形容词 `nice` (好的) 是一个以-e结尾的单音节词，其比较级是在词尾加 `-r`，变为 `nicer`。\n- 选项A `nice` 是原级，用于描述或同级比较 (as nice as)。\n- 选项C `very nice` 是“原级”的加强形式，不能用于`...than...`结构。\n- 选项D `nicest` 是最高级，用于三者或三者以上的比较，通常与 `the` 连用。\n- 因此，只有 `nicer` 符合语法结构，构成“...比...更...”的含义。","knowledge_expansion_md":"**1. 形容词比较级的构成规则：**\n   - **单音节词:** 词尾加 `-er` (如 `long` -> `longer`)。以 `e` 结尾的加 `-r` (如 `nice` -> `nicer`)。\n   - **重读闭音节词:** 双写末尾辅音字母再加 `-er` (如 `big` -> `bigger`)。\n   - **“辅音字母+y”结尾的双音节词:** 变 `y` 为 `i` 再加 `-er` (如 `happy` -> `happier`)。\n   - **多音节词和部分双音节词:** 前面加 `more` (如 `beautiful` -> `more beautiful`)。\n   - **不规则变化:** `good` -> `better`, `bad` -> `worse`, `many/much` -> `more`。\n\n**2. 比较级基本句型：**\n   - `A + be动词 + 形容词比较级 + than + B.`\n   - 例如: `He is taller than his brother.` (他比他哥哥高。)\n\n**3. 易错点：**\n   - 不能将 `-er` 和 `more` 同时使用，例如 `more nicer` 是错误的。\n   - 注意 `than` 后面的代词要用宾格，如 `He is taller than me.` (口语) 或 `He is taller than I am.` (正式)。","socratic_tracks":[{"title":"语法结构分析","steps":[{"question":"你在句子中看到了哪个词，可以提示我们这里需要进行比较？","hint":"哪个词的意思是“比...”？","takeaway":"句子中的 `than` 表明这是一个比较句。"},{"question":"既然是比较句，那么形容词 'nice' 应该使用什么形式？是原级、比较级还是最高级？","hint":"两者之间进行比较，用比较级。三者或以上进行比较，用最高级。","takeaway":"含有 `than` 的句子，通常需要使用形容词的比较级形式。"}]},{"title":"形容词变级规则","steps":[{"question":"你知道形容词 'nice' 的比较级和最高级分别是什么吗？","hint":"`nice` 是一个以字母 'e' 结尾的单音节词。","takeaway":"`nice` 的比较级是 `nicer`，最高级是 `nicest`。"},{"question":"为什么选项 C 'very nice' 是错的？它不也是表达“很好”的意思吗？","hint":"`very` 用来修饰形容词原级，表示程度深，但它不能用在 `...than...` 的比较结构中。","takeaway":"`very` 只能修饰形容词原级，不能用于比较级句型。"}]},{"title":"句意与逻辑","steps":[{"question":"这个句子在比较哪两个东西？","hint":"找到 `than` 前后的名词。","takeaway":"句子在比较 'the red car' 和 'the black one'。"},{"question":"句尾的 'one' 指代的是什么？为什么要用 'one'？","hint":"为了避免重复说 'the black car'，我们用一个代词来代替。","takeaway":"`one` 在这里是代词，指代前面提到过的名词 `car`，以避免重复。"}]}]}},{"number":"25","item_type":"choice","context_note":"","stem":"\"The number of seconds in one day,\" _____ \"The number of minutes in one week.\"","options":{"A":">","B":"\u003c","C":"=","D":"We don't know"},"answer_area_hint":"","teaching":{"correct_answer":"A","explanation_md":"本题是一道结合了英语阅读和数学计算的逻辑题。首先，我们需要计算出“一天中的秒数”：1天 = 24小时，1小时 = 60分钟，1分钟 = 60秒，所以一天有 24 × 60 × 60 = 86,400 秒。然后，我们计算“一周中的分钟数”：1周 = 7天，1天 = 24小时，1小时 = 60分钟，所以一周有 7 × 24 × 60 = 10,080 分钟。最后，比较这两个数值，86,400 大于 10,080。因此，应该填入大于号 “>”。","knowledge_expansion_md":"这道题属于“智力测验”类型，旨在考察学生在英语语境下进行逻辑推理和信息处理的能力。它涉及到的核心知识点包括：\n\n1.  **时间单位词汇**: `second` (秒), `minute` (分钟), `hour` (小时), `day` (天), `week` (周)。熟练掌握这些词汇及其换算关系是解题的基础。\n2.  **数学比较符号的英文表达**: \n    *   `>`: greater than (大于)\n    *   `\u003c`: less than (小于)\n    *   `=`: equal to (等于)\n3.  **阅读理解**: 准确理解题干中 \"The number of...\" 的含义，即要求我们计算并比较的是“数量”而非其他。\n\n这类题目提醒我们，英语学习不仅仅是背单词和学语法，更是培养用英语获取信息、分析问题和解决问题能力的过程。","socratic_tracks":[{"title":"关键信息提取","steps":[{"question":"题目要求我们比较的是哪两个事物？","hint":"请仔细阅读两个引号内的英文短语。","takeaway":"题目要求比较“一天中的秒数”和“一周中的分钟数”。"},{"question":"这两个短语 \"The number of seconds in one day\" 和 \"The number of minutes in one week\" 的核心计算单位分别是什么？","hint":"找到表示时间单位的名词。","takeaway":"核心计算单位分别是秒 (seconds) 和分钟 (minutes)。"}]},{"title":"单位换算与计算","steps":[{"question":"我们如何计算“一天中的秒数”？需要用到哪些时间单位换算关系？","hint":"想一想，一天有多少小时？一小时有多少分钟？一分钟有多少秒？","takeaway":"一天中的秒数 = 24小时/天 × 60分钟/小时 × 60秒/分钟 = 86,400秒。"},{"question":"同样地，我们如何计算“一周中的分钟数”？","hint":"一周有几天？一天有多少小时？一小时有多少分钟？","takeaway":"一周中的分钟数 = 7天/周 × 24小时/天 × 60分钟/小时 = 10,080分钟。"}]},{"title":"逻辑比较与符号选择","steps":[{"question":"现在我们得到了两个数字：86,400 和 10,080。我们应该如何比较它们的大小？","hint":"这是一个简单的整数大小比较。","takeaway":"86,400 明显大于 10,080。"},{"question":"选项 A, B, C 中的符号 >、\u003c、= 分别代表什么意思？我们应该选择哪一个？","hint":"> 代表“大于”，\u003c 代表“小于”，= 代表“等于”。","takeaway":"因为 86,400 大于 10,080，所以我们应该选择代表“大于”的符号 >，即选项A。"}]}]}}]},{"section_title":"III. 完形填空 (共10分)","section_instruction":"NBA is the most famous basketball game in the world. There __26__ a Chinese player in this game. His name is Yao Ming. He is __27__ player in this game. In his spare time, he __28__ cars. On last Christmas, he drove __29__ old car to visit one of his __30__. On his way, he __31__ a policeman following him. Finally, he stopped and said to the policeman, \"__32__ Christmas, sir. Is there anything wrong with me?\". \"No, of course not,\" answered the policeman. \"Then __33__ did you __34__ me?\" asked Yao. \"__35__ be angry,\" said the policeman. \"You did nothing wrong, I only
