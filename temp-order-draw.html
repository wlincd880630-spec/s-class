<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>顺序抽取 | S-Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ink: #0a1628;
      --teal: #14b8a6;
      --teal-dim: #0d9488;
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.18);
      --surface: #f4f7fb;
      --white: #ffffff;
      --muted: #64748b;
      --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(20, 184, 166, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(245, 158, 11, 0.12), transparent 50%),
        var(--surface);
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal-dim);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .back-link:hover { color: var(--teal); }

    .temp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: #b45309;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .hero-card {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero-card h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--white);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 16px 48px rgba(10, 22, 40, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }

    .setup-panel label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .setup-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .setup-row input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 2px solid rgba(15, 23, 42, 0.1);
      border-radius: 14px;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      transition: border-color 0.2s;
    }

    .setup-row input:focus {
      outline: none;
      border-color: var(--teal);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s var(--ease), box-shadow 0.2s;
    }

    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dim) 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 12px 32px rgba(20, 184, 166, 0.45);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.06);
      color: var(--ink);
    }

    .hint {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Slot machine ── */
    .draw-area { display: none; }
    .draw-area.active { display: block; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.1);
      color: var(--teal-dim);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .slot-wrap {
      position: relative;
      margin: 0 auto 24px;
      max-width: 280px;
    }

    .slot-frame {
      position: relative;
      height: 160px;
      border-radius: 20px;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      overflow: hidden;
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.08),
        0 20px 50px rgba(10, 22, 40, 0.25);
    }

    .slot-frame::before,
    .slot-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 2;
      pointer-events: none;
    }

    .slot-frame::before {
      top: 0;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95), transparent);
    }

    .slot-frame::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(15, 23, 42, 0.95), transparent);
    }

    .slot-highlight {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 64px;
      transform: translateY(-50%);
      border: 2px solid rgba(20, 184, 166, 0.6);
      border-radius: 12px;
      background: rgba(20, 184, 166, 0.08);
      z-index: 1;
      pointer-events: none;
      box-shadow: 0 0 24px rgba(20, 184, 166, 0.2);
    }

    .slot-reel {
      position: absolute;
      left: 0;
      right: 0;
      top: 48px;
      will-change: transform;
    }

    .slot-item {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .slot-item.placeholder { color: rgba(255, 255, 255, 0.25); font-size: 1.4rem; }

    .draw-btn-wrap { text-align: center; margin-bottom: 28px; }

    .btn-draw {
      min-width: 200px;
      padding: 18px 32px;
      font-size: 1.1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
    }

    .btn-draw:hover:not(:disabled) {
      box-shadow: 0 14px 36px rgba(245, 158, 11, 0.5);
    }

    .btn-draw.spinning i { animation: spin 0.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
    }

    .results-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .results-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--surface);
      animation: pop-in 0.4s var(--ease);
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .results-list .draw-no {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .results-list .order-no {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--teal-dim);
      min-width: 48px;
      text-align: center;
    }

    .results-list li.latest {
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.12), rgba(245, 158, 11, 0.1));
      border: 1px solid rgba(20, 184, 166, 0.2);
    }

    .results-list li.latest .order-no {
      color: var(--gold);
      font-size: 1.8rem;
    }

    .empty-results {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .complete-banner {
      display: none;
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.12), rgba(20, 184, 166, 0.06));
      border: 1px solid rgba(20, 184, 166, 0.2);
    }

    .complete-banner.show { display: block; }

    .complete-banner strong {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 4px;
      color: var(--teal-dim);
    }

    /* ── Expired ── */
    .expired-panel {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }

    .expired-panel.show { display: block; }

    .expired-panel i {
      font-size: 3rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .expired-panel h2 { margin: 0 0 8px; }
    .expired-panel p { margin: 0 0 20px; color: var(--muted); }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .confetti span {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall 1.2s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }

    @media (max-width: 480px) {
      .setup-row { flex-direction: column; }
      .slot-frame { height: 140px; }
      .slot-item { font-size: 2rem; height: 56px; }
      .slot-highlight { height: 56px; }
      .slot-reel { top: 42px; }
    }
  </style>
<script src="scripts/site-nav.js" defer></script>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <a class="back-link" href="index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
      <span class="temp-badge"><i class="fas fa-clock"></i> 今日 16:00 后失效</span>
    </div>

    <div id="expired-panel" class="expired-panel panel">
      <i class="fas fa-hourglass-end"></i>
      <h2>抽签已结束</h2>
      <p>本页面为临时功能，已于今日 16:00 自动关闭。</p>
      <a class="btn btn-primary" href="index.html">返回首页</a>
    </div>

    <div id="main-content">
      <div class="hero-card">
        <h1><i class="fas fa-dice"></i> 顺序抽取</h1>
        <p>设置人数后，轮流点击抽取，已抽到的顺序不会重复</p>
      </div>

      <div id="setup-panel" class="panel setup-panel">
        <label for="total-input">一共要抽几个顺序？</label>
        <div class="setup-row">
          <input type="number" id="total-input" min="2" max="50" value="6" inputmode="numeric">
          <button type="button" class="btn btn-primary" id="btn-start"><i class="fas fa-play"></i> 开始</button>
        </div>
        <p class="hint">例如 6 位同学，就输入 6。每人上台点击「抽取顺序」，随机获得 1～6 中的一个，已被抽走的号码作废。</p>
      </div>

      <div id="draw-area" class="draw-area panel">
        <div class="status-bar">
          <span class="status-pill"><i class="fas fa-users"></i> 共 <span id="total-count">6</span> 人</span>
          <span class="status-pill"><i class="fas fa-ticket"></i> 剩余 <span id="remain-count">6</span> 个</span>
        </div>

        <div class="complete-banner" id="complete-banner">
          <strong><i class="fas fa-check-circle"></i> 全部抽完！</strong>
          <span>顺序已全部确定，可截图保存或重新开始</span>
        </div>

        <div class="slot-wrap">
          <div class="slot-frame">
            <div class="slot-highlight"></div>
            <div class="slot-reel" id="slot-reel"></div>
          </div>
        </div>

        <div class="draw-btn-wrap">
          <button type="button" class="btn btn-draw" id="btn-draw">
            <i class="fas fa-hand-pointer"></i> 抽取顺序
          </button>
        </div>

        <h3 class="results-title"><i class="fas fa-list-ol"></i> 已抽取结果</h3>
        <ul class="results-list" id="results-list"></ul>
        <p class="empty-results" id="empty-results">还没有人抽取，请上台点击按钮</p>

        <div class="actions-row">
          <button type="button" class="btn btn-ghost" id="btn-reset"><i class="fas fa-redo"></i> 重新开始</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var EXPIRE_AT = new Date('2026-07-31T16:00:00+08:00').getTime();
      var STORAGE_KEY = 'sclass-temp-order-draw-v1';

      function isExpired() {
        return Date.now() >= EXPIRE_AT;
      }

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function clearState() {
        localStorage.removeItem(STORAGE_KEY);
      }

      if (isExpired()) {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('expired-panel').classList.add('show');
        return;
      }

      var setupPanel = document.getElementById('setup-panel');
      var drawArea = document.getElementById('draw-area');
      var totalInput = document.getElementById('total-input');
      var btnStart = document.getElementById('btn-start');
      var btnDraw = document.getElementById('btn-draw');
      var btnReset = document.getElementById('btn-reset');
      var slotReel = document.getElementById('slot-reel');
      var resultsList = document.getElementById('results-list');
      var emptyResults = document.getElementById('empty-results');
      var totalCountEl = document.getElementById('total-count');
      var remainCountEl = document.getElementById('remain-count');
      var completeBanner = document.getElementById('complete-banner');

      var state = loadState();
      var spinning = false;

      function getItemHeight() {
        var probe = slotReel.querySelector('.slot-item');
        return probe ? probe.offsetHeight : (window.innerWidth <= 480 ? 56 : 64);
      }

      function clampTotal(n) {
        return Math.max(2, Math.min(50, Math.floor(n) || 2));
      }

      function initPool(total) {
        var pool = [];
        for (var i = 1; i <= total; i++) pool.push(i);
        return pool;
      }

      function startDraw(total) {
        total = clampTotal(total);
        state = {
          total: total,
          remaining: initPool(total),
          results: []
        };
        saveState(state);
        showDrawUI();
      }

      function showDrawUI() {
        setupPanel.style.display = 'none';
        drawArea.classList.add('active');
        renderAll();
        renderReelIdle();
      }

      function renderAll() {
        if (!state) return;
        totalCountEl.textContent = state.total;
        remainCountEl.textContent = state.remaining.length;
        renderResults();
        var done = state.remaining.length === 0;
        btnDraw.disabled = done || spinning;
        completeBanner.classList.toggle('show', done);
      }

      function renderResults() {
        resultsList.innerHTML = '';
        if (!state.results.length) {
          emptyResults.style.display = 'block';
          return;
        }
        emptyResults.style.display = 'none';
        state.results.slice().reverse().forEach(function (item, idx) {
          var li = document.createElement('li');
          if (idx === 0) li.classList.add('latest');
          li.innerHTML =
            '<span class="draw-no">第 ' + item.round + ' 位抽取</span>' +
            '<span class="order-no">' + item.order + '</span>';
          resultsList.appendChild(li);
        });
      }

      function renderReelIdle() {
        slotReel.style.transition = 'none';
        slotReel.innerHTML = '<div class="slot-item placeholder">?</div>';
        slotReel.style.transform = 'translateY(0)';
      }

      function buildReelSequence(finalOrder, total) {
        var items = [];
        var len = 24 + Math.floor(Math.random() * 8);
        for (var i = 0; i < len; i++) {
          items.push(Math.floor(Math.random() * total) + 1);
        }
        items.push(finalOrder);
        return items;
      }

      function renderReelItems(items) {
        slotReel.innerHTML = items.map(function (n) {
          return '<div class="slot-item">' + n + '</div>';
        }).join('');
      }

      function fireConfetti() {
        var wrap = document.createElement('div');
        wrap.className = 'confetti';
        var colors = ['#14b8a6', '#f59e0b', '#0d9488', '#fbbf24', '#5eead4'];
        for (var i = 0; i < 36; i++) {
          var s = document.createElement('span');
          s.style.left = Math.random() * 100 + '%';
          s.style.top = '-10px';
          s.style.background = colors[i % colors.length];
          s.style.animationDelay = (Math.random() * 0.4) + 's';
          s.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
          wrap.appendChild(s);
        }
        document.body.appendChild(wrap);
        setTimeout(function () { wrap.remove(); }, 2000);
      }

      function pickRandom() {
        var idx = Math.floor(Math.random() * state.remaining.length);
        return state.remaining.splice(idx, 1)[0];
      }

      function animateDraw(finalOrder, callback) {
        spinning = true;
        btnDraw.disabled = true;
        btnDraw.classList.add('spinning');

        var items = buildReelSequence(finalOrder, state.total);
        renderReelItems(items);
        slotReel.style.transition = 'none';
        slotReel.style.transform = 'translateY(0)';

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var itemH = getItemHeight();
            var offset = (items.length - 1) * itemH;
            slotReel.style.transition = 'transform 2.8s cubic-bezier(0.12, 0.8, 0.2, 1)';
            slotReel.style.transform = 'translateY(-' + offset + 'px)';
          });
        });

        setTimeout(function () {
          spinning = false;
          btnDraw.classList.remove('spinning');
          fireConfetti();
          callback();
        }, 3000);
      }

      btnStart.addEventListener('click', function () {
        startDraw(Number(totalInput.value));
      });

      btnDraw.addEventListener('click', function () {
        if (!state || spinning || !state.remaining.length) return;
        var order = pickRandom();
        var round = state.results.length + 1;
        animateDraw(order, function () {
          state.results.push({ round: round, order: order });
          saveState(state);
          renderAll();
        });
      });

      btnReset.addEventListener('click', function () {
        if (!confirm('确定要清空所有结果并重新设置人数吗？')) return;
        clearState();
        state = null;
        drawArea.classList.remove('active');
        setupPanel.style.display = 'block';
        renderReelIdle();
        resultsList.innerHTML = '';
        emptyResults.style.display = 'block';
        completeBanner.classList.remove('show');
      });

      totalInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') btnStart.click();
      });

      if (state && state.total && Array.isArray(state.remaining)) {
        showDrawUI();
      }
    })();
  </script>
</body>
</html>
