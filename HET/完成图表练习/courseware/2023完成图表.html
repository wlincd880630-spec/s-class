<!DOCTYPE html>

  <title>完成图表 · 2023 · 地图发展史（The History of Maps）</title>
  <style>
    :root {

      aspect-ratio: 16/9; border: 1px solid var(--ng-line); border-radius: 4px; overflow: hidden;
      background: linear-gradient(168deg, #14110e 0%, #1f1a15 38%, #0b0a08 100%);

    .deck { width: 100%; height: 100%; display: flex; flex-direction: column; padding: clamp(14px,1.6vw,28px) clamp(18px,2.2vw,36px); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;

    .brand { font-size: clamp(14px,1.35vw,20px); color: var(--ng-gold); font-weight: 700; letter-spacing: .04em; }

    .card { background: var(--ng-card); border: 1px solid var(--ng-line); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 6px; font-size: 16px; color: #fff; }

    .mono { font-family: ui-monospace, Consolas, monospace; color: #cfe8e4; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .reading-scroll p { font-size: 13px; margin-bottom: 8px; }

      margin: 0 0 6px;
      font-weight: 600;
    }
    .slide-body.is-reading-slide .slide-body-inner {

      min-height: min(54vh, calc((100vh - 140px) / 1.575));
    }
    .reading-slide-wrap {

      flex-direction: column;

    .read-float-toolbar {

    .read-sentence-actions button.btn-mini,
    button.tts.btn-mini.sent-tts,
    button.rephrase-btn.btn-mini {

    }
    button.rephrase-btn.btn-mini,

    button.tts.btn-mini.sent-tts {

    }
    button.tts.btn-mini.speaking { opacity: 1; background: rgba(201,162,77,.3); border-color: var(--ng-gold); color: var(--ng-gold); }
    .rephrase-out {

    .rephrase-en { color: #e8dfd0; margin: 0 0 4px; }

    }
    .socratic-out {

    }
    .socratic-progress { margin: 0 0 8px; font-size: 13px; color: var(--ng-gold); font-weight: 700; }

    }
    .socratic-a[hidden] { display: none !important; }
    .socratic-btns { display: flex; flex-wrap: wrap; gap: 8px; }

    .socratic-btns button:disabled { opacity: .4; cursor: not-allowed; }
    .topbar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .topbar-controls select {
      background: rgba(0,0,0,.35);
      color: var(--ng-cream);
      border: 1px solid var(--ng-line);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
      font-size: 13px;
    }
  #ttsBadge { font-size: 11px; color: var(--ng-muted); max-width: 140px; line-height: 1.3; }
    .lookup-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 80;
    }
    .lookup-backdrop.show { opacity: 1; pointer-events: auto; }
    .lookup-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(720px, 96vw);
      background: #1a1612; border-left: 1px solid var(--ng-line);
      transform: translateX(100%); transition: transform .25s ease; z-index: 90;
      display: flex; flex-direction: column;
      box-shadow: -8px 0 40px rgba(0,0,0,.5);
    }
    .lookup-panel.open { transform: translateX(0); }
    .lookup-panel header {
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
      padding: 14px 18px; border-bottom: 1px solid var(--ng-line);
    }
    .lookup-panel header h2 { margin: 0; font-size: 32px; color: var(--ng-gold); }

      padding: 18px 20px;
      font-size: 28px; line-height: 1.65; color: #e8dfd0;

    .lookup-panel .lookup-body::-webkit-scrollbar { width: 12px; }

    .lookup-head { margin: 0 0 12px; color: #fff; font-size: 40px; }

    .chart-box, .chart-exam-wrap {
      --chart-fs: 11px;
      --chart-fs-sm: 10px;
      --chart-lh: 1.45;
      --chart-blank-min: 9em;

r.", "An important part of maps is the imaginary lines of longitude, latitude and the equator."]}, {"index": 5, "text": "Mercator took the globe and made it flat, but to do this he had to make the areas further north and south larger, while the areas nearer the middle stay about the right size. The reason for this is that the Earth is like a ball, but a map is flat. It is easy to find places, but some people said it was unfair because places including Canada, the UK and Europe appeared much bigger than they really were.", "sentences": ["Mercator took the globe and made it flat, but to do this he had to make the areas further north and south larger, while the areas nearer the middle stay about the right size.", "The reason for this is that the Earth is like a ball, but a map is flat.", "It is easy to find places, but some people said it was unfair because places including Canada, the UK and Europe appeared much bigger than they really were."]}, {"index": 6, "text": "In the 19th and 20th centuries, modern technology allowed map makers to produce maps showing locations exactly.", "sentences": ["In the 19th and 20th centuries, modern technology allowed map makers to produce maps showing locations exactly."]}, {"index": 7, "text": "Today, many people view maps on their phones. Researchers are working to map the floor of the oceans and to locate every tree on Earth. Scientists are also trying to map the past by using the James Webb Space Telescope (JWST). This invention will collect light from stars and may find the secrets about the beginning of the universe.", "sentences": ["Today, many people view maps on their phones.", "Researchers are working to map the floor of the oceans and to locate every tree on Earth.", "Scientists are also trying to map the past by using the James Webb Space Telescope (JWST).", "This invention will collect light from stars and may find the secrets about the beginning of the universe."]}];

    function wrapWordsHtml(sentence) {
      const esc = (x) => String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

        if (!tok || /^\\s+$/.test(tok)) return esc(tok);

    function renderRephraseBilingual(outEl, data) {
      const en = data.en || data.english || "";

    }

    function parseRephraseJson(raw) {
      const data = tryParseLookupJson(raw);

    async function rephraseSentence(sentence, outEl, btn) {
      const isLoading = outEl.querySelector(".lookup-muted");
      if (!outEl.hidden && outEl.innerHTML.trim() && !isLoading) {
        outEl.hidden = true;
        if (btn) btn.title = "英中改写";
        return;
      }
      const cacheKey = "rp2|" + sentence;
      const cached = cacheGet("rephrase", cacheKey);
      if (cached) {
        renderRephraseBilingual(outEl, parseRephraseJson(cached));
        if (btn) btn.title = "再点隐藏改写";
        return;
      }
      btn.disabled = true;
      outEl.hidden = false;
      outEl.innerHTML = "<span class='lookup-muted'>生成中英对照…</span>";
      try {
        const raw = await deepseekChat(
          "你是初中英语教师。只输出 JSON，不要 markdown：{\"en\":\"更简单易懂的英文改写句\",\"zh\":\"该句准确简体中文翻译\"}",
          "原句：\n" + sentence,
          0.45
        );
        cacheSet("rephrase", cacheKey, raw);
        const data = parseRephraseJson(raw);
        renderRephraseBilingual(outEl, data);
        if (btn) btn.title = "再点隐藏改写";
        if (data.en) await playTts(data.en, null);

        outEl.innerHTML = `<span class='lookup-bad'>${escapeHtml(e.message)}</span>`;

    async function translateSentence(sentence, zhEl, btn) {

    async function translateParagraph(paragraph, stageEl, btn) {
      let box = stageEl.querySelector(".read-para-zh");

      const cacheKey = "tp|" + paragraph.slice(0, 200);

      btn.disabled = true;
      try {

        if (!zh) {

    function parseSocraticItems(raw) {
      const t = String(raw || "").trim();
      const m = t.match(/\[[\s\S]*\]/);
      try {
        const arr = JSON.parse(m ? m[0] : t);
        if (!Array.isArray(arr)) return [];
        return arr.map((item) => ({
          question_en: item.question_en || item.question || item.q || "",
          question_zh: item.question_zh || item.question_zh_hint || "",
          answer_zh: item.answer_zh || item.answer || item.a || "",
          quote_en: item.quote_en || item.answer_quote_en || item.evidence_en || "",
        })).filter((x) => x.question_en || x.question_zh);
      } catch (e) {
        const lines = t.split(/\n+/).map((line) => line.replace(/^\s*\d+[.)、]\s*/, "").trim()).filter(Boolean);
        return lines.map((q) => ({ question_en: q, question_zh: "", answer_zh: "", quote_en: "" }));
      }
    }

    function socraticZhBlock(cur) {
      if (!cur.question_zh) return "";
      return `
        <div class="socratic-zh-reveal" role="button" tabindex="0" aria-expanded="false" title="点击显示/隐藏中文译文">
          <span class="socratic-zh-hint">中文译文（点击展开）</span>
          <div class="socratic-zh-body" hidden>${escapeHtml(cur.question_zh)}</div>
        </div>`;
    }

    function renderSocraticStep(outEl) {
      const items = outEl._socraticItems || [];
      const i = outEl._socraticIdx || 0;
      const shown = !!outEl._socraticAnsShown;
      const total = items.length;
      if (!total) {
        outEl.innerHTML = "<p class='lookup-muted'>未生成有效问题</p>";
        return;
      }
      const cur = items[i];
      const isLast = i >= total - 1;
      const qMain = escapeHtml(cur.question_en || cur.question_zh);
      const quote = cur.quote_en
        ? `<p class="socratic-quote"><span class="bilingual-tag">原文</span>${escapeHtml(cur.quote_en)}</p>` : "";
      outEl.innerHTML = `
        <p class="socratic-progress">Question ${i + 1} / ${total}</p>
        <p class="socratic-q"><span class="socratic-tag">Q</span>${qMain}</p>
        ${socraticZhBlock(cur)}
        <div class="socratic-a" id="socratic-ans-${outEl.id}" ${shown ? "" : "hidden"}>
          <p style="margin:0 0 6px;"><span class="socratic-tag">答</span><span style="color:var(--ng-gold);font-size:12px;">（中文）</span></p>
          <p style="margin:0;line-height:1.7;">${escapeHtml(cur.answer_zh || "（暂无）")}</p>
          ${quote}
        </div>
        <div class="socratic-btns">
          <button type="button" class="nav socratic-show-ans" ${shown ? "disabled" : ""}>显示答案</button>
          <button type="button" class="nav socratic-next" ${shown ? "" : "disabled"}>${isLast ? "完成" : "下一题"}</button>
        </div>`;
    }

    function initSocraticUI(outEl, items) {
      outEl._socraticItems = items;
      outEl._socraticIdx = 0;
      outEl._socraticAnsShown = false;
      renderSocraticStep(outEl);
    }

    async function loadSocraticQuestions(pi, paragraph, outEl, btn) {
      const cacheKey = "soc4|" + pi + "|" + paragraph.slice(0, 120);
      const cached = cacheGet("socratic", cacheKey);
      if (cached) {
        outEl.hidden = false;
        initSocraticUI(outEl, parseSocraticItems(cached));
        return;
      }
      btn.disabled = true;
      outEl.hidden = false;
      outEl.innerHTML = "<p class='lookup-muted'>生成苏格拉底式问题…</p>";
      try {
        const raw = await deepseekChat(
          "你是初中英语阅读教师。只输出 JSON 数组（2到3项），不要 markdown。每项：question_en（英文苏格拉底式问题，主句，完整问句）、question_zh（该问题的简体中文翻译，辅助）、answer_zh（简体中文答案与解析）、quote_en（答案依据的英文原文短句，须从段落摘录）。",

    const SENTENCES_PER_READ_SLIDE = 3;

    function buildReadingSlides() {
      if (!PASSAGE_STRUCTURE || !PASSAGE_STRUCTURE.length) return;
      PASSAGE_STRUCTURE.forEach((block, pi) => {
        const totalParas = PASSAGE_STRUCTURE.length;
        const allSentences = block.sentences || [];
        const chunks = [];
        for (let i = 0; i < allSentences.length; i += SENTENCES_PER_READ_SLIDE) {
          chunks.push({ start: i, list: allSentences.slice(i, i + SENTENCES_PER_READ_SLIDE) });
        }
        if (!chunks.length) chunks.push({ start: 0, list: [] });
        chunks.forEach((chunk, ci) => {
          const isLastChunk = ci === chunks.length - 1;
          const partTag = chunks.length > 1 ? ` · ${ci + 1}/${chunks.length}` : "";
          const navLabel = chunks.length > 1 ? `阅读${pi + 1}-${ci + 1}` : `阅读${pi + 1}`;
          const sentHtml = chunk.list.map((s, li) => {
            const si = chunk.start + li;
            return `

        });
      });

    function normalize(s) {
      return String(s||"").trim().toLowerCase().replace(/\s+/g," ");
    }
    function wordCount(s) {
      const t = String(s||"").trim();
      if (!t) return 0;
      return t.split(/\s+/).filter(Boolean).length;
    }
    function matchBlank(num, user) {
      const u = normalize(user);
      if (!u) return false;
      if (WORD_LIMIT && wordCount(user) > WORD_LIMIT) return false;
      const main = normalize(PRACTICE_ANS[num]);
      if (u === main) return true;
      const alts = ALT_ANS[num] || ALT_ANS[String(num)] || [];
      return alts.some((a) => normalize(a) === u);
    }
    function renderChart(raw, mode) {
      return raw.replace(/__(\d+)__/g, (_, n) => {

        if (mode === "study") return `<span class="blank blank-study">(${num})</span>`;
        return `<input class="practice-input" data-num="${num}" placeholder="(${num})" />`;
      });
    }

      <h2 class="slide-h2 slide-h2-sm">图表填空 · 口头作答</h2>
      <div class="chart-box">${renderChart(CHART_RAW, "study")}</div>`, { section: "practice", label: "半独立" });

    add(`<div class="tag">独立作答</div>
      <h2 class="slide-h2">独立作答（答案隐藏）</h2>
      
      <div class="chart-box">${renderChart(CHART_RAW, "practice")}</div>
      <div class="row-audio"><button type="button" class="nav" id="checkPracticeBtn">一键核对</button></div>
      <p id="practiceScore" class="score">先独立填写，再点击核对。</p>`, { section: "practice", label: "独立作答" });

    add(`<div class="tag">答案</div>
      <h2 class="slide-h2 slide-h2-sm">答案复盘</h2>
      <div class="chart-box">${renderChart(CHART_RAW, "key")}</div>
      <div class="card"><h3>快速核对</h3><p class="mono">76 places · 77 stars · 78 math · 79 corrections · 80 technology</p></div>`, { section: "practice", label: "答案" });

    let idx = 0;
    function fillNav() {
      const scroll = document.getElementById("courseNavScroll");
      scroll.innerHTML = navSections.map((s) =>
        `<button type="button" class="nav-section-link" data-slide-index="${s.index}">${escapeHtml(s.label)}</button>`
      ).join("");
      scroll.querySelectorAll(".nav-section-link").forEach((btn) => {
        btn.addEventListener("click", () => {
          idx = Number(btn.getAttribute("data-slide-index"));
          render();
        });
      });
    }
    function syncNav() {
      document.querySelectorAll(".nav-section-link").forEach((btn) => {
        const i = Number(btn.getAttribute("data-slide-index"));
        const pos = navSections.findIndex((s) => s.index === i);
        const next = pos < navSections.length - 1 ? navSections[pos + 1].index : slides.length;
        btn.classList.toggle("is-active", idx >= i && idx < next);
      });
    }
    function render() {
      const root = document.getElementById("slideRoot");
      root.innerHTML = slides[idx].html;
      const slideBody = document.querySelector(".slide-body");
      if (slideBody) slideBody.classList.toggle("is-reading-slide", !!root.querySelector(".reading-slide-wrap"));
      document.getElementById("progress").textContent = `Slide ${idx + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === slides.length - 1;
      if (root.querySelector(".reading-para-stage")) bindReadingSlide(root);
      document.querySelectorAll("#checkPracticeBtn").forEach((btn) => {
        btn.onclick = () => {
          let ok = 0, total = 0;
          document.querySelectorAll(".practice-input").forEach((inp) => {
            const n = Number(inp.getAttribute("data-num"));
            total++;
            if (matchBlank(n, inp.value)) { ok++; inp.style.borderBottomColor = "var(--ok)"; }
            else inp.style.borderBottomColor = "var(--bad)";
          });
          const el = document.getElementById("practiceScore");
          if (el) {
            let msg = `得分：<strong>${ok}</strong> / ${total}`;
            if (WORD_LIMIT) msg += ` · 每空≤${WORD_LIMIT}词`;
            el.innerHTML = msg;
          }
        };
      });
      syncNav();
    }
    fillNav();
    document.getElementById("navToggle").addEventListener("click", () => {
      document.getElementById("courseNav").classList.toggle("is-collapsed");
    });
    document.getElementById("prevBtn").addEventListener("click", () => { idx = Math.max(0, idx-1); render(); });
    document.getElementById("nextBtn").addEventListener("click", () => { idx = Math.min(slides.length-1, idx+1); render(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
      if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
    });
    document.getElementById("lookupClose")?.addEventListener("click", closeLookupPanel);
    document.getElementById("lookupBackdrop")?.addEventListener("click", closeLookupPanel);
    refreshTtsBadge();
    render();

  </script>
<script src="../../../scripts/annotate-board.js" defer></script>
</body>
</html>
