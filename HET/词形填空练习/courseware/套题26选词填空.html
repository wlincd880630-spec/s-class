    function playAzureTTS(text) {
      var AZURE_SPEECH_KEY = hetAzureSpeechKey();
      if (!AZURE_SPEECH_KEY) return Promise.reject(new Error("未配置 Azure Speech Key。"));
      const endpoint = `https://${AZURE_SPEECH_REGION}.tts.speech.microsoft.com/cognitiveservices/v1`;
      const voice = document.getElementById("voiceSel")?.value || "en-GB-RyanNeural";
      const g = voiceGenderAndLang(voice);
      const cacheKey = `${voice}|${text}|${AZURE_TTS_PROSODY_RATE}`;
      if (audioCache.has(cacheKey)) return playUrl(audioCache.get(cacheKey));
      const ssml = `<?xml version="1.0" encoding="utf-8"?>
<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${g.lang}">
  <voice name="${voice}">
    <prosody rate="${AZURE_TTS_PROSODY_RATE}">${escapeSsmlText(text)}</prosody>
  </voice>
</speak>`;
      return fetch(endpoint, {
        method: "POST",
        headers: {
          "Ocp-Apim-Subscription-Key": AZURE_SPEECH_KEY,
          "Content-Type": "application/ssml+xml",
          "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3",
        },
        body: ssml,
      }).then((res) => {
        if (!res.ok) return res.text().then((t) => {
          var hint = res.status === 401 ? " （密钥无效/过期或未授权；请配置有效的 het-azure-speech-key 或使用预录音频）" : "";
          throw new Error(`Azure ${res.status}${hint}: ${(t || "").slice(0, 120)}`);
        });
        return res.blob();
      }).then((blob) => {
        const u = URL.createObjectURL(blob);
        audioCache.set(cacheKey, u);
        return playUrl(u);
      });
    }
    async function playTts(text) {
      const key = __hetNorm(text);
      var manifestLoaded = false;

        const map = await __hetEnsureManifest();
        manifestLoaded = true;
        const rel = map.get(key);
        if (rel && __hetResolvedAssetsBase) {
          const url = __hetResolvedAssetsBase + String(rel).replace(/^\/+/g, "");
          await playUrl(url);
          return;
        }
      } catch (e) {
        console.warn("[het-cloze] 预录音频:", e && e.message ? e.message : e);
      }
      var ak = hetAzureSpeechKey();
      if (!ak) {
        if (!manifestLoaded) {
          throw new Error(
            "无法加载预录音频索引 manifest.json（常见原因：COS 上该路径 404、被 CORS 拦截、或对象键与课件默认地址不一致）。默认尝试：" +
              HET_CLOZE_ASSETS_BASE_COS +
              "manifest.json 。请在 COS 控制台核对对象键是否包含 s-class/HET/词形填空练习/courseware/Assets/manifest.json；若实际上传目录不同，可在控制台执行：window.__HET_CLOZE_ASSETS_BASE__='https://你的桶域名/你的Assets前缀/' 再刷新。"
          );
        }
        throw new Error(
          "manifest 已加载，但未找到与朗读文案完全一致的预录条目（标点、空格、大小写须与 manifest 中 text 相同）：「" +

    function bindVocabInteractions(root) {
      root.querySelectorAll(".spell-zone").forEach((zone) => {
        const word = zone.getAttribute("data-spell") || "";
        const chars = [...word];
        const chips = zone.querySelectorAll(".letter-chip");
        let idx = 0;
        const countEl = zone.querySelector(".spell-count");
        const noteTarget = zone.getAttribute("data-reveal-note");
        const revealNext = () => {
          if (idx >= chars.length) return;
          const ch = chars[idx];
          chips[idx].textContent = ch === " " ? "·" : ch;
          chips[idx].classList.remove("blind");
          chips[idx].classList.add("shown");
          idx++;
          if (countEl) countEl.textContent = String(idx);
          if (noteTarget && idx >= chars.length) {
            const box = document.getElementById(noteTarget);
            if (box) box.classList.add("show");
          }
        };
        zone.addEventListener("click", (e) => {
          if (e.target.closest("button") || e.target.closest("a")) return;
          revealNext();
        });
      });
      root.querySelectorAll(".usage-strip").forEach((strip) => {
        const reveal = () => {
          const body = strip.querySelector(".usage-strip-body");
          if (body) body.classList.add("show");
          strip.classList.add("is-revealed");
        };
        strip.addEventListener("click", (e) => { if (!e.target.closest("button")) reveal(); });
        strip.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
        });
      });
      root.querySelectorAll(".practice-input").forEach((inp) => {
        inp.addEventListener("input", () => { inp.style.borderBottomColor = "var(--ng-gold)"; });
      });
      root.querySelectorAll(".exam-blank").forEach((blank) => {
        const toggle = () => blank.classList.toggle("is-revealed");
        blank.addEventListener("click", toggle);
        blank.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
      });
      root.querySelectorAll("#checkPracticeBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const inputs = [...root.querySelectorAll(".practice-input")];
          let ok = 0;
          inputs.forEach((inp) => {
            const n = Number(inp.dataset.num);
            const user = (inp.value || "").trim().toLowerCase().replace(/\s+/g, " ");
            const ans = (PRACTICE_ANS[n] || "").trim().toLowerCase().replace(/\s+/g, " ");

          const total = inputs.length;
          const score = root.querySelector("#practiceScore");

    function spellBlock(word, revealNoteId) {

      const noteAttr = revealNoteId ? ` data-reveal-note="${escapeHtml(revealNoteId)}"` : "";
      const hint = revealNoteId
        ? `点击词区逐字母显示；全部显示后自动出现拼写提示 · <span class="spell-count">0</span> / ${chars.length}`
        : `点击词区逐字母显示 · <span class="spell-count">0</span> / ${chars.length}`;
      return `<div class="spell-zone" data-spell="${escapeHtml(word)}" tabindex="0"${noteAttr}>
        <div class="letter-row">${chips}</div>
        <p class="footnote" style="margin:6px 0 0;">${hint}</p>

    function renderPassage(raw, answerList, mode) {
      const parts = raw.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p).replace(/\n/g, "<br/>");
        const num = Number(m[1]);
        const ans = answerList[num] || "";
        if (mode === "key") return `<span class="blank">${escapeHtml(ans)}</span>`;
        if (mode === "study") return `<span class="blank">(${num})</span>`;
        return `<input class="practice-input" data-num="${num}" placeholder="(${num})" />`;
      }).join("");
    }

                    "q": "主格形式（谁）",
                    "answer": "who",
                    "readAloud": "who",
                    "note": "关系代词主格，也是考点变形",
                    "exampleSentence": "Who is the man standing over there?",
                    "exampleZh": "站在那边的那个人是谁？",
                    "induct": {
                        "title": "关系代词主格/宾格",
                        "peers": [
                            "which",
                            "that",
                            "whose",
                            "what",
                            "where",
                            "when"
                        ],
                        "tip": "who 作主语，whom 作宾语"
                    }
                },
                {
                    "q": "所有格形式（谁的）",
                    "answer": "whose",
                    "readAloud": "whose",
                    "note": "所有格，表示所属关系",
                    "exampleSentence": "Whose book is this?",
                    "exampleZh": "这是谁的书？",
                    "induct": {
                        "title": "所有格代词",
                        "peers": [
                            "his",
                            "her",
                            "its",
                            "our",
                            "their",
                            "my"
                        ],
                        "tip": "whose 既可作疑问词也可作关系代词"
                    }
                },
                {
                    "q": "缩略形式（who is / who has）",
                    "answer": "who's",
                    "readAloud": "who's",
                    "note": "口语中常用缩略形式",
                    "exampleSentence": "Who's coming to the party tonight?",
                    "exampleZh": "今晚谁来参加派对？",
                    "induct": {
                        "title": "缩略形式",
                        "peers": [
                            "he's",
                            "it's",
                            "that's",
                            "what's",
                            "there's"
                        ],
                        "tip": "注意与 whose 区分"
                    }
                }
            ],
            "examTarget": {
                "form": "who",
                "examExamples": [
                    {
                        "readSentence": "______ is the girl that won the prize?",
                        "readSentenceZh": "获奖的女孩是谁？",
                        "blankAnswer": "Who"
                    },
                    {
                        "readSentence": "The man ______ you met yesterday is my uncle.",
                        "readSentenceZh": "你昨天遇到的那个人是我叔叔。",
                        "blankAnswer": "whom"
                    },
                    {
                        "readSentence": "______ car is parked outside?",
                        "readSentenceZh": "谁的车停在外面？",
                        "blankAnswer": "Whose"
                    },
                    {
                        "readSentence": "______ going to help me with this?",
                        "readSentenceZh": "谁会帮我做这个？",
                        "blankAnswer": "Who's"
                    }
                ],
                "note": "套题26 · 考点为 who，但需掌握 whom / whose / who's 整族变形"
            }
        }
    ]

    const slides = [];
    function add(html, meta) { slides.push({ html, meta: meta || null }); }
    function pushVocabProgram(units, articleTag) {
      units.forEach((u) => {
        const parts = slidesFromUnit(u, articleTag);
        parts.forEach((html, i) => add(html, i === 0 ? { vocabStart: { article: articleTag, headword: u.headword } } : null));
      });
    }

    add(`<div class="tag">课程地图</div>
      <h1 class="slide-title">短文填空 · 套题26 · 矮墙上的匿名箴言</h1>
      <p>本套结构：背景输入 → 词汇四步流 → 证据链 → 半独立练习 → 独立作答 → 答案复盘。Step3 派生配套例句均<strong>不复述本题英文原文</strong>。</p>
      <div class="card"><h3>本题节奏</h3>
        <ol>
          <li>记叙 · 邻里和解 · 善意传递</li>
          <li>方框 12 词 · 语篇 10 空；干扰项：<strong>do / instruction</strong></li>
          <li>复盘：<span class="mono">1 silence · 2 added · 3 who · 4 herself · 5 knew · 6 completely · 7 inspired · 8 valuable · 9 invited · 10 unknown</span></li>
        </ol>
      </div>`);

    add(`<div class="tag">背景导入</div>
      <h2 class="slide-h2">记叙 · 邻里和解 · 善意传递</h2>
      <p>关注词性槽与证据链；核对答案清单见复盘页。</p>
      <div class="row-audio"><button type="button" class="tts" data-text="Brave teens rehearse plain sentences until tricky passages feel friendly.">听迁移句（自编）</button></div>`);

    add(`<div class="tag">方框词</div>
      <h2 class="slide-h2">词库（12 词 · 10 空）</h2>
      <p class="mono">add / complete / do / her / himself / inspiration / instruction / invite / know / silent / value / whom</p>
      <div class="card"><h3>策略提示</h3><p>先标出十大槽位，再回填变形；干扰项勿强行代入。</p></div>`);

    pushVocabProgram(VOCAB_UNITS, "本题");

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位梳理（1–5）</h2>
      <div class="sense">结合词性、搭配与比较结构判定前五空；口述证据后再书写。</div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位梳理（6–10）</h2>
      <div class="sense">处理后五空：注意被动、不定式、比较级、名动形转换。</div>`);

    add(`<div class="tag">半独立</div>
      <h2 class="slide-h2">语篇填空（编号提示 · 1–10）</h2>
      <p>只显示编号，先判定词性与词形。</p>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "study")}</div>
      <p class="bank">词库：${WORD_BANK.join(" / ")}</p>`);

    add(`<div class="tag">独立作答</div>
      <h2 class="slide-h2">独立作答页（答案隐藏）</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "practice")}</div>
      <div class="row-audio" style="margin-top:10px;"><button type="button" class="nav" id="checkPracticeBtn">一键核对</button></div>
      <p id="practiceScore" class="score">先独立填写，再点击核对。</p>`);

    add(`<div class="tag">答案</div>
      <h2 class="slide-h2">答案与词形</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "key")}</div>
      <div class="card"><h3>快速核对清单</h3><p class="mono">1 silence · 2 added · 3 who · 4 herself · 5 knew · 6 completely · 7 inspired · 8 valuable · 9 invited · 10 unknown</p></div>`);

    const vocabNavEntries = [];
    let idx = 0;

    function fillCourseNav() {
      const scroll = document.getElementById("courseNavScroll");
      const list = vocabNavEntries.map((e) => `<li><button type="button" class="nav-vocab-link" data-slide-index="${e.index}">${escapeHtml(e.headword)}</button></li>`).join("");
      scroll.innerHTML = `<div class="course-nav-h">本题词汇流（12 词族 · 方框 12 词）</div><ul class="course-nav-list">${list}</ul>`;
      scroll.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-slide-index"));
          if (!Number.isNaN(i)) { idx = i; render(); }
        });
      });
    }

    function syncNavActive() {
      const sorted = [...vocabNavEntries].sort((a, b) => a.index - b.index);
      document.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        const i = Number(btn.getAttribute("data-slide-index"));
        const pos = sorted.findIndex((e) => e.index === i);
        const nextStart = pos >= 0 && pos < sorted.length - 1 ? sorted[pos + 1].index : slides.length;
        btn.classList.toggle("is-active", idx >= i && idx < nextStart);
      });
    }

    function render() {
      const root = document.getElementById("slideRoot");
      root.innerHTML = `<div class="slide-body-inner">${slides[idx].html}</div>`;
      document.getElementById("progress").textContent = `Slide ${idx + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === slides.length - 1;
      bindTtsButtons(root);
      bindVocabInteractions(root);
      if (typeof bindClozePracticeLookup === "function") bindClozePracticeLookup(root, PASSAGE);
      syncNavActive();
    }

    slides.forEach((s, i) => {
      if (s.meta && s.meta.vocabStart) {
        vocabNavEntries.push({ index: i, article: s.meta.vocabStart.article, headword: s.meta.vocabStart.headword });
      }
    });
    fillCourseNav();

    document.getElementById("navToggle").addEventListener("click", () => {
      const nav = document.getElementById("courseNav");
      const btn = document.getElementById("navToggle");
      const collapsed = nav.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      btn.textContent = collapsed ? "展开" : "目录";
    });
    document.getElementById("prevBtn").addEventListener("click", () => { idx = Math.max(0, idx - 1); render(); });
    document.getElementById("nextBtn").addEventListener("click", () => { idx = Math.min(slides.length - 1, idx + 1); render(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") document.getElementById("nextBtn").click();
      if (e.key === "ArrowLeft" || e.key === "PageUp") document.getElementById("prevBtn").click();
    });

    refreshTtsBadge();
    render();
  </script>
</body>
</html>
