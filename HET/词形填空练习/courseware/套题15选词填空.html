<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>短文填空 · 套题15 · 父女和解回忆 · 词形课件</title>
  <style>
    :root {
      --ng-bg0: #0c0b09;
      --ng-gold: #c9a24d;
      --ng-gold-dim: #8a7035;
      --ng-cream: #ebe4d6;
      --ng-muted: #a89f8f;
      --ng-card: rgba(28, 24, 20, 0.92);
      --ng-line: rgba(201, 162, 77, 0.35);
      --ng-accent: #4a7c7c;
      --ok: #66c38a;
      --bad: #e28585;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--ng-bg0);
      color: var(--ng-cream);
      font-family: "Source Sans 3", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100%;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      padding: 12px;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(201, 162, 77, 0.12), transparent 55%),
        radial-gradient(900px 500px at 110% 30%, rgba(74, 124, 124, 0.12), transparent 50%),
        var(--ng-bg0);
      gap: 0;
    }
    .course-nav {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      flex-shrink: 0;
      width: min(230px, 30vw);
      max-height: min(96vh, calc(100vh - 24px));
      align-self: center;
      border: 1px solid var(--ng-line);
      border-radius: 4px;
      background: rgba(20, 17, 14, 0.94);
      overflow: hidden;
      transition: width .22s ease;
    }
    .course-nav.is-collapsed { width: 40px; }
    .course-nav-edge {
      flex-shrink: 0;
      width: 40px;
      border: none;
      border-right: 1px solid var(--ng-line);
      background: rgba(28, 24, 20, 0.95);
      color: var(--ng-gold);
      font-size: 18px;
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: .15em;
      font-weight: 700;
      padding: 8px 0;
    }
    .course-nav-edge:hover { background: rgba(201, 162, 77, 0.12); }
    .course-nav-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .course-nav.is-collapsed .course-nav-panel { display: none; }
    .course-nav-heading {
      margin: 0;
      padding: 10px 12px 6px;
      font-size: clamp(11px, 1vw, 13px);
      color: var(--ng-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(201, 162, 77, 0.2);
    }
    .course-nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px 12px;
    }
    .course-nav-scroll::-webkit-scrollbar { width: 5px; }
    .course-nav-scroll::-webkit-scrollbar-thumb {
      background: rgba(201, 162, 77, .35);
      border-radius: 99px;
    }
    .course-nav-h {
      font-size: clamp(11px, .95vw, 13px);
      color: var(--ng-accent);
      font-weight: 700;
      margin: 0 6px 6px;
      padding-bottom: 4px;
      border-bottom: 1px dashed rgba(74, 124, 124, .45);
    }
    .course-nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .course-nav-list li { margin: 0; }
    button.nav-vocab-link {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0 0 3px;
      padding: 7px 10px;
      font: inherit;
      font-size: clamp(12px, 1.05vw, 15px);
      color: #e8dfd0;
      background: rgba(0, 0, 0, .2);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }
    button.nav-vocab-link:hover {
      border-color: rgba(201, 162, 77, .35);
      background: rgba(201, 162, 77, .08);
    }
    button.nav-vocab-link.is-active {
      color: var(--ng-gold);
      border-color: rgba(201, 162, 77, .55);
      background: rgba(201, 162, 77, .12);
      font-weight: 700;
    }
    .deck-stage {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .deck-shell {
      width: min(100vw - 24px, calc((100vh - 24px) * 16 / 9));
      height: min(100vh - 24px, calc((100vw - 24px) * 9 / 16));
      aspect-ratio: 16 / 9;
      border: 1px solid var(--ng-line);
      border-radius: 4px;
      overflow: hidden;
      background: linear-gradient(168deg, #14110e 0%, #1f1a15 38%, #0b0a08 100%);
      box-shadow: 0 0 0 3px rgba(201, 162, 77, .15), 0 28px 90px rgba(0, 0, 0, .65);
    }
    .deck {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 1.6vw, 28px) clamp(18px, 2.2vw, 36px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--ng-line);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .brand {
      font-size: clamp(14px, 1.35vw, 20px);
      color: var(--ng-gold);
      letter-spacing: .04em;
      font-weight: 700;
      text-transform: uppercase;
    }
    .progress {
      font-size: clamp(12px, 1.1vw, 15px);
      color: var(--ng-muted);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    select, button {
      font: inherit;
      border-radius: 3px;
    }
    select {
      background: var(--ng-card);
      color: var(--ng-cream);
      border: 1px solid var(--ng-line);
      padding: 6px 10px;
      font-size: clamp(11px, 1vw, 14px);
    }
    button.nav {
      background: linear-gradient(180deg, #2a241c, #1a1612);
      color: var(--ng-cream);
      border: 1px solid var(--ng-gold-dim);
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button.nav:hover { border-color: var(--ng-gold); color: #fff; }
    button.nav:disabled { opacity: .35; cursor: not-allowed; }
    .slide-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 8px 6px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .slide-body::-webkit-scrollbar { width: 6px; }
    .slide-body::-webkit-scrollbar-thumb {
      background: rgba(201, 162, 77, .35);
      border-radius: 99px;
    }
    .slide-body-inner {
      width: calc(100% / 1.75);
      max-width: calc(100% / 1.75);
      transform: scale(1.75);
      transform-origin: center center;
      box-sizing: border-box;
      flex: 0 0 auto;
    }
    h1.slide-title {
      font-size: clamp(22px, 2.6vw, 40px);
      margin: 0 0 10px;
      line-height: 1.15;
      color: #f3ead8;
    }
    h2.slide-h2 {
      font-size: clamp(18px, 2vw, 30px);
      margin: 0 0 8px;
      color: var(--ng-gold);
    }
    p, li {
      font-size: clamp(14px, 1.25vw, 20px);
      line-height: 1.45;
      margin: 0 0 10px;
      color: #e8dfd0;
    }
    .tag {
      display: inline-block;
      font-size: clamp(11px, .95vw, 14px);
      padding: 3px 10px;
      border: 1px solid var(--ng-line);
      color: var(--ng-gold);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .card {
      background: var(--ng-card);
      border: 1px solid var(--ng-line);
      border-radius: 6px;
      padding: clamp(10px, 1.1vw, 16px);
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: clamp(15px, 1.35vw, 22px);
      color: #fff;
    }
    .mono {
      font-family: ui-monospace, Consolas, monospace;
      font-size: .95em;
      color: #cfe8e4;
    }
    .sense {
      font-size: clamp(13px, 1.15vw, 18px);
      color: #d7cfc2;
      border-left: 3px solid var(--ng-accent);
      padding-left: 12px;
      margin: 8px 0 12px;
    }
    .row-audio {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    button.tts {
      background: rgba(74, 124, 124, .25);
      border: 1px solid rgba(74, 124, 124, .65);
      color: #dff5f3;
      padding: 6px 12px;
      cursor: pointer;
      font-size: clamp(12px, 1.05vw, 16px);
    }
    button.tts:hover { background: rgba(74, 124, 124, .4); }
    button.tts:disabled { opacity: .5; cursor: wait; }
    .hidden-reveal {
      display: none;
      margin-top: 6px;
      padding: 10px;
      background: rgba(0,0,0,.25);
      border-radius: 4px;
      border: 1px dashed rgba(201, 162, 77, .35);
    }
    .hidden-reveal.show { display: block; }
    .spell-zone {
      display: inline-block;
      min-width: min(96%, 520px);
      padding: 12px 14px;
      margin: 10px 0;
      border: 1px dashed var(--ng-line);
      border-radius: 6px;
      cursor: pointer;
      background: rgba(0,0,0,.2);
      user-select: none;
    }
    .spell-zone:focus { outline: 2px solid var(--ng-gold); outline-offset: 2px; }
    .letter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      justify-content: center;
      min-height: 2.2em;
    }
    .letter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.15em;
      font-family: ui-monospace, Consolas, monospace;
      font-size: clamp(17px, 1.9vw, 28px);
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .letter-chip.blind { color: #5c574e; background: rgba(255,255,255,.04); }
    .letter-chip.shown { color: var(--ng-gold); background: rgba(201,162,77,.12); }
    .usage-strip {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px dashed var(--ng-line);
      border-radius: 6px;
      cursor: pointer;
      background: rgba(0,0,0,.15);
    }
    .usage-strip:focus { outline: 2px solid var(--ng-gold); outline-offset: 2px; }
    .usage-strip.is-revealed {
      border-style: solid;
      border-color: rgba(201, 162, 77, .4);
      background: rgba(0,0,0,.22);
    }
    .usage-strip-hint {
      margin: 0;
      font-size: clamp(12px, 1.05vw, 16px);
      color: var(--ng-muted);
      line-height: 1.4;
    }
    .usage-strip.is-revealed .usage-strip-hint { display: none; }
    .usage-sentence-zh-persistent {
      margin: 8px 0 0;
      font-size: clamp(13px, 1.1vw, 17px);
      color: #c8bba8;
      line-height: 1.55;
      padding: 8px 10px;
      background: rgba(0, 0, 0, .2);
      border-radius: 4px;
      border-left: 3px solid rgba(201, 162, 77, .45);
    }
    .exam-sentence-zh {
      margin: 10px 0 0;
      font-size: clamp(13px, 1.1vw, 17px);
      color: #c8bba8;
      line-height: 1.55;
    }
    .exam-blank-card {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px dashed var(--ng-line);
      border-radius: 6px;
      background: rgba(0,0,0,.15);
      line-height: 1.65;
      font-size: clamp(14px, 1.15vw, 18px);
    }
    .exam-blank {
      display: inline-flex;
      align-items: baseline;
      gap: 0;
      cursor: pointer;
      color: var(--ng-gold);
      border-bottom: 2px solid rgba(201, 162, 77, .72);
      padding: 0 2px;
      user-select: none;
    }
    .exam-blank:focus {
      outline: 2px solid var(--ng-gold);
      outline-offset: 2px;
      border-radius: 3px;
    }
    .exam-blank-mask { letter-spacing: .04em; }
    .exam-blank-ans { display: none; font-weight: 700; }
    .exam-blank.is-revealed .exam-blank-mask { display: none; }
    .exam-blank.is-revealed .exam-blank-ans { display: inline; }
    details.card.grammar-induct-details {
      margin-top: 12px;
      border-left: 3px solid var(--ng-accent);
      background: rgba(74, 124, 124, .08);
    }
    .grammar-induct-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 14px;
      user-select: none;
    }
    .grammar-induct-summary::-webkit-details-marker { display: none; }
    .grammar-induct-summary::marker { content: ""; }
    .grammar-induct-summary .grammar-induct-title {
      margin: 0;
      font-size: clamp(14px,1.2vw,18px);
      color: var(--ng-gold);
      font-weight: 700;
    }
    .grammar-induct-hint { font-size: clamp(11px,.95vw,14px); color: #8ebdb8; }
    .grammar-induct-hint-open { display: none; }
    details[open].grammar-induct-details > .grammar-induct-summary .grammar-induct-hint-closed { display: none; }
    details[open].grammar-induct-details > .grammar-induct-summary .grammar-induct-hint-open { display: inline; }
    .grammar-induct-inner {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(201, 162, 77, .2);
    }
    .passage {
      font-size: clamp(13px,1.15vw,18px);
      line-height: 1.5;
      color: #efe6d8;
    }
    .passage .blank {
      display: inline-block;
      min-width: 2.8em;
      border-bottom: 2px solid var(--ng-gold);
      margin: 0 2px;
      text-align: center;
      color: var(--ng-gold);
      font-weight: 700;
      font-family: ui-monospace, Consolas, monospace;
    }
    .bank {
      font-size: clamp(12px,1.05vw,16px);
      color: var(--ng-muted);
      margin-top: 8px;
    }
    .practice-input {
      width: 7.2em;
      border: none;
      border-bottom: 2px solid var(--ng-gold);
      background: transparent;
      color: #fff;
      text-align: center;
      font: inherit;
      font-family: ui-monospace, Consolas, monospace;
      outline: none;
      margin: 0 2px;
    }
    .practice-input::placeholder { color: #7f7566; }
    .score {
      font-size: clamp(12px, 1vw, 15px);
      color: var(--ng-muted);
      margin-top: 4px;
    }
    .score .ok { color: var(--ok); font-weight: 700; }
    .score .bad { color: var(--bad); font-weight: 700; }
    .toast {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      background: rgba(180, 40, 40, .92);
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      max-width: 92%;
      text-align: center;
      z-index: 20;
    }
    .toast.show { display: block; }
    .footnote {
      font-size: clamp(11px,.95vw,14px);
      color: var(--ng-muted);
      margin-top: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 720px) {
      .app { flex-direction: column; align-items: stretch; }
      .course-nav {
        width: 100% !important;
        max-height: min(220px, 32vh);
        align-self: stretch;
      }
      .course-nav.is-collapsed { width: 100% !important; max-height: 48px; }
      .course-nav-edge {
        writing-mode: horizontal-tb;
        width: auto;
        min-width: 72px;
        padding: 10px 12px;
      }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="course-nav" id="courseNav" aria-label="词汇目录">
      <button type="button" class="course-nav-edge" id="navToggle" aria-expanded="true" aria-controls="courseNavPanel" title="折叠/展开目录">目录</button>
      <div class="course-nav-panel" id="courseNavPanel">
        <p class="course-nav-heading">词汇流 · 点击跳转 Step1</p>
        <div class="course-nav-scroll" id="courseNavScroll"></div>
      </div>
    </aside>

    <div class="deck-stage">
      <div class="deck-shell">
        <div class="deck">
          <div class="topbar">
            <div class="brand">Word Forms Lab · Cloze</div>
            <div class="progress" id="progress">—</div>
            <div class="controls">
              <span id="ttsBadge" class="footnote" style="margin-right:6px;max-width:min(42vw,220px);line-height:1.25;"></span>
              <label class="footnote" style="margin:0;display:flex;align-items:center;gap:6px;">
                朗读声音
                <select id="voiceSel" aria-label="朗读声音">
                  <option value="en-US-AvaNeural" selected>Ava（美）</option>
                  <option value="en-US-JennyNeural">Jenny（美）</option>
                  <option value="en-US-GuyNeural">Guy（美）</option>
                  <option value="en-GB-SoniaNeural">Sonia（英）</option>
                </select>
              </label>
              <button type="button" class="nav" id="prevBtn">上一页</button>
              <button type="button" class="nav" id="nextBtn">下一页</button>
            </div>
          </div>
          <div class="slide-body" id="slideRoot"></div>
          <div class="toast" id="toast" role="status"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function hetAzureSpeechKey() {
      try {
        if (typeof window !== "undefined" && window.__HET_AZURE_SPEECH_KEY__)
          return String(window.__HET_AZURE_SPEECH_KEY__).trim();
      } catch (_) {}
      try {
        var k = localStorage.getItem("het-azure-speech-key") || localStorage.getItem("AZURE_SPEECH_KEY");
        return (k || "").trim();
      } catch (_) {
        return "";
      }
    }
    const AZURE_SPEECH_REGION = "eastus2";
    const AZURE_TTS_PROSODY_RATE = "-15%";
    const audioCache = new Map();
    let currentTtsAudio = null;
    const HET_CLOZE_ASSETS_BASE_COS = "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/HET/词形填空练习/courseware/Assets/";
    let __hetResolvedAssetsBase = null;
    let __hetManifestMap = null;
    function __hetNorm(s) {
      return String(s || "").replace(/\s+/g, " ").trim();
    }
    async function __hetEnsureManifest() {
      if (__hetManifestMap) return __hetManifestMap;
      var bases = [];
      try {
        if (typeof window !== "undefined" && window.__HET_CLOZE_ASSETS_BASE__)
          bases.push(String(window.__HET_CLOZE_ASSETS_BASE__).replace(/\/?$/, "/"));
      } catch (_) {}
      bases.push(HET_CLOZE_ASSETS_BASE_COS);
      try {
        bases.push(new URL("Assets/", window.location.href).href);
      } catch (_) {}
      var lastErr = null;
      for (var bi = 0; bi < bases.length; bi++) {
        var base = bases[bi];
        try {
          var res = await fetch(base + "manifest.json", { cache: "force-cache" });
          if (!res.ok) continue;
          var data = await res.json();
          __hetResolvedAssetsBase = base;
          __hetManifestMap = new Map();
          for (const ent of Object.values(data)) {
            const t = __hetNorm(ent.text);
            if (t && ent.file) __hetManifestMap.set(t, ent.file);
          }
          return __hetManifestMap;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("无法加载 manifest.json（检查 COS / 同目录 Assets / CORS）");
    }


    function refreshTtsBadge() {
      const el = document.getElementById("ttsBadge");
      if (!el) return;
      el.textContent = "朗读：预录音频优先（COS / 课件旁 Assets）；否则需 Azure 密钥";
    }
    function escapeSsmlText(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    }
    function voiceGenderAndLang(voiceName) {
      if (voiceName.indexOf("Guy") !== -1) return { gender: "Male", lang: "en-US" };
      if (voiceName.indexOf("Sonia") !== -1 || voiceName.indexOf("en-GB") !== -1) return { gender: "Female", lang: "en-GB" };
      return { gender: "Female", lang: "en-US" };
    }
    function playUrl(url) {
      if (currentTtsAudio) { currentTtsAudio.pause(); currentTtsAudio = null; }
      const a = new Audio(url);
      currentTtsAudio = a;
      return a.play();
    }
    function playAzureTTS(text) {
      var AZURE_SPEECH_KEY = hetAzureSpeechKey();
      if (!AZURE_SPEECH_KEY) return Promise.reject(new Error("未配置 Azure Speech Key。"));
      const endpoint = `https://${AZURE_SPEECH_REGION}.tts.speech.microsoft.com/cognitiveservices/v1`;
      const voice = document.getElementById("voiceSel")?.value || "en-US-AvaNeural";
      const g = voiceGenderAndLang(voice);
      const cacheKey = `${voice}|${text}|${AZURE_TTS_PROSODY_RATE}`;
      if (audioCache.has(cacheKey)) return playUrl(audioCache.get(cacheKey));
      const ssml = `<?xml version="1.0" encoding="utf-8"?>
<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${g.lang}">
  <voice name="${voice}">
    <prosody rate="${AZURE_TTS_PROSODY_RATE}">${escapeSsmlText(text)}</prosody>
  </voice>
</speak>`;
      return fetch(endpoint, {
        method: "POST",
        headers: {
          "Ocp-Apim-Subscription-Key": AZURE_SPEECH_KEY,
          "Content-Type": "application/ssml+xml",
          "X-Microsoft-OutputFormat": "audio-16khz-128kbitrate-mono-mp3",
        },
        body: ssml,
      }).then((res) => {
        if (!res.ok) return res.text().then((t) => {

    function bindVocabInteractions(root) {
      root.querySelectorAll(".spell-zone").forEach((zone) => {
        const word = zone.getAttribute("data-spell") || "";
        const chars = [...word];
        const chips = zone.querySelectorAll(".letter-chip");
        let idx = 0;
        const countEl = zone.querySelector(".spell-count");
        const noteTarget = zone.getAttribute("data-reveal-note");
        const revealNext = () => {
          if (idx >= chars.length) return;
          const ch = chars[idx];
          chips[idx].textContent = ch === " " ? "·" : ch;
          chips[idx].classList.remove("blind");
          chips[idx].classList.add("shown");
          idx++;
          if (countEl) countEl.textContent = String(idx);
          if (noteTarget && idx >= chars.length) {
            const box = document.getElementById(noteTarget);
            if (box) box.classList.add("show");
          }
        };
        zone.addEventListener("click", (e) => {
          if (e.target.closest("button") || e.target.closest("a")) return;
          revealNext();
        });
      });
      root.querySelectorAll(".usage-strip").forEach((strip) => {
        const reveal = () => {
          const body = strip.querySelector(".usage-strip-body");
          if (body) body.classList.add("show");
          strip.classList.add("is-revealed");
        };
        strip.addEventListener("click", (e) => { if (!e.target.closest("button")) reveal(); });
        strip.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
        });
      });
      root.querySelectorAll(".practice-input").forEach((inp) => {
        inp.addEventListener("input", () => { inp.style.borderBottomColor = "var(--ng-gold)"; });
      });
      root.querySelectorAll(".exam-blank").forEach((blank) => {
        const toggle = () => blank.classList.toggle("is-revealed");
        blank.addEventListener("click", toggle);
        blank.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
      });
      root.querySelectorAll("#checkPracticeBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const inputs = [...root.querySelectorAll(".practice-input")];
          let ok = 0;
          inputs.forEach((inp) => {
            const n = Number(inp.dataset.num);
            const user = (inp.value || "").trim().toLowerCase().replace(/\s+/g, " ");
            const ans = (PRACTICE_ANS[n] || "").trim().toLowerCase().replace(/\s+/g, " ");
            if (!user) return;
            if (user === ans) { ok++; inp.style.borderBottomColor = "var(--ok)"; }
            else inp.style.borderBottomColor = "var(--bad)";
          });
          const total = inputs.length;
          const score = root.querySelector("#practiceScore");
          if (score) score.innerHTML = `已答对 <span class="ok">${ok}</span> / ${total}。${ok === total ? "全部正确！" : "请继续检查词形。"}`

    }

    function spellBlock(word, revealNoteId) {

      const noteAttr = revealNoteId ? ` data-reveal-note="${escapeHtml(revealNoteId)}"` : "";
      const hint = revealNoteId
        ? `点击词区逐字母显示；全部显示后自动出现拼写提示 · <span class="spell-count">0</span> / ${chars.length}`
        : `点击词区逐字母显示 · <span class="spell-count">0</span> / ${chars.length}`;
      return `<div class="spell-zone" data-spell="${escapeHtml(word)}" tabindex="0"${noteAttr}>
        <div class="letter-row">${chips}</div>
        <p class="footnote" style="margin:6px 0 0;">${hint}</p>
      </div>`;
    }

    function renderPassage(raw, answerList, mode) {
      const parts = raw.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p).replace(/\n/g, "<br/>");
        const num = Number(m[1]);
        const ans = answerList[num] || "";
        if (mode === "key") return `<span class="blank">${escapeHtml(ans)}</span>`;
        if (mode === "study") return `<span class="blank">(${num})</span>`;
        return `<input class="practice-input" data-num="${num}" placeholder="(${num})" />`;
      }).join("");
    }

      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "key")}</div>
      <div class="card"><h3>快速核对清单</h3><p class="mono">1 behavior · 2 lost · 3 fifth · 4 Strangely · 5 best · 6 realized · 7 preparing · 8 actions · 9 important · 10 arguments</p></div>`);

    const vocabNavEntries = [];
    let idx = 0;

    function fillCourseNav() {
      const scroll = document.getElementById("courseNavScroll");
      const list = vocabNavEntries.map((e) => `<li><button type="button" class="nav-vocab-link" data-slide-index="${e.index}">${escapeHtml(e.headword)}</button></li>`).join("");
      scroll.innerHTML = `<div class="course-nav-h">本题词汇流（12 词族 · 方框 12 词）</div><ul class="course-nav-list">${list}</ul>`;
      scroll.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-slide-index"));
          if (!Number.isNaN(i)) { idx = i; render(); }
        });
      });
    }

    function syncNavActive() {
      const sorted = [...vocabNavEntries].sort((a, b) => a.index - b.index);
      document.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        const i = Number(btn.getAttribute("data-slide-index"));
        const pos = sorted.findIndex((e) => e.index === i);
        const nextStart = pos >= 0 && pos < sorted.length - 1 ? sorted[pos + 1].index : slides.length;
        btn.classList.toggle("is-active", idx >= i && idx < nextStart);
      });
    }

    function render() {
      const root = document.getElementById("slideRoot");
      root.innerHTML = `<div class="slide-body-inner">${slides[idx].html}</div>`;
      document.getElementById("progress").textContent = `Slide ${idx + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === slides.length - 1;
      bindTtsButtons(root);
      bindVocabInteractions(root);
      syncNavActive();
    }

    slides.forEach((s, i) => {
      if (s.meta && s.meta.vocabStart) {
        vocabNavEntries.push({ index: i, article: s.meta.vocabStart.article, headword: s.meta.vocabStart.headword });
      }
    });
    fillCourseNav();

    document.getElementById("navToggle").addEventListener("click", () => {
      const nav = document.getElementById("courseNav");
      const btn = document.getElementById("navToggle");
      const collapsed = nav.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      btn.textContent = collapsed ? "展开" : "目录";
    });
    document.getElementById("prevBtn").addEventListener("click", () => { idx = Math.max(0, idx - 1); render(); });
    document.getElementById("nextBtn").addEventListener("click", () => { idx = Math.min(slides.length - 1, idx + 1); render(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") document.getElementById("nextBtn").click();
      if (e.key === "ArrowLeft" || e.key === "PageUp") document.getElementById("prevBtn").click();
    });

    refreshTtsBadge();
    render();
  </script>
</body>
</html>
