    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function blankSentence(sentence, answer) {
      const ans = String(answer || "").trim();
      if (!ans) return escapeHtml(sentence);
      const re = new RegExp(ans.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      if (!re.test(sentence)) return `${escapeHtml(sentence)} <span class="blank">__________</span>`;
      return escapeHtml(sentence).replace(re, "__________");
    }
    function renderPassage(mode) {
      const parts = PASSAGE.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p);
        const num = Number(m[1]);
        if (mode === "key") return `<span class="blank">${escapeHtml(PRACTICE_ANS[num] || "")}</span>`;
        return `<span class="blank">(${num})</span>`;
      }).join("");
    }

    document.getElementById("wordBank").textContent = WORD_BANK.join(" · ");
    document.getElementById("passagePractice").innerHTML = renderPassage("practice");
    document.getElementById("passageKey").innerHTML = renderPassage("key");
    document.getElementById("quickKeys").innerHTML = `<strong>答案键：</strong>${Object.keys(PRACTICE_ANS).sort().map((k) => `${k} ${PRACTICE_ANS[k]}`).join(" · ")}`;

    const tocList = document.getElementById("tocList");
    const vocabRoot = document.getElementById("vocabRoot");

    VOCAB_UNITS.forEach((u) => {
      const id = `v_${u.headword}`;
      const li = document.createElement("li");
      li.innerHTML = `<a href="#${id}">${escapeHtml(u.headword)}</a>`;
      tocList.appendChild(li);

      const examples = (u.examTarget && Array.isArray(u.examTarget.examExamples) && u.examTarget.examExamples.length)
        ? u.examTarget.examExamples
        : (u.examTarget ? [{ readSentence: u.examTarget.readSentence, readSentenceZh: u.examTarget.readSentenceZh, blankAnswer: u.examTarget.form }] : []);

      const usageHtml = (u.usages || []).map((x) => `
        <div class="usage">
          <div class="label">${escapeHtml(x.label || "")}</div>
          <p class="en">${escapeHtml(x.sentence || "")}</p>
          <p class="zh">【译文】${escapeHtml(x.sentenceZh || "")}</p>
          <p class="explain">${escapeHtml(x.explain || "")}</p>
          <p class="rephrase"><strong>Rephrase：</strong>${escapeHtml(x.rephrase || "")}</p>
        </div>
      `).join("");

      const derivHtml = (u.derivatives || []).map((d) => `
        <div class="deriv">
          <p class="q">${escapeHtml(d.q || "")}</p>
          <p class="ans">→ ${escapeHtml(d.answer || "")}</p>
          <p class="note">拼写提示：${escapeHtml(d.note || "")}</p>
          ${d.exampleSentence ? `<p class="en" style="margin-top:10px;"><strong>Step3 配套例句：</strong>${escapeHtml(d.exampleSentence)}</p><p class="zh">【译文】${escapeHtml(d.exampleZh || "")}</p>` : ""}
          ${(d.induct && Array.isArray(d.induct.peers) && d.induct.peers.length) ? `
          <div class="induct">
            <div class="title">${escapeHtml(d.induct.title || "归纳 · 同类构词")}</div>
            <p class="peers">${d.induct.peers.map((w) => escapeHtml(w)).join(" · ")}</p>
            <p class="note">${escapeHtml(d.induct.tip || "")}</p>
          </div>` : ""}
        </div>
      `).join("");

      const examHtml = examples.map((ex) => `
        <div class="exam">
          <p class="line">${blankSentence(ex.readSentence || "", ex.blankAnswer || (u.examTarget && u.examTarget.form) || "")}</p>
          <p class="key">【答案】${escapeHtml(ex.blankAnswer || (u.examTarget && u.examTarget.form) || "")}</p>
          <p class="zh">【译文】${escapeHtml(ex.readSentenceZh || "")}</p>
        </div>
      `).join("");

      const article = document.createElement("article");
      article.className = "vocab";
      article.id = id;
      article.innerHTML = `
        <h2>${escapeHtml(u.headword)}</h2>
        <span class="tag">套题 47｜2023 年高新区二诊 · 词汇流</span>
        <h3>Step 1 · 释义（A2）</h3>
        <p class="def">${escapeHtml(u.defA2 || "")}</p>
        <h3>Step 2 · 常见用法</h3>
        ${usageHtml}
        <h3>Step 3 · 派生词与归纳</h3>
        ${derivHtml}
        <h3>Step 4 · 考点例句（适当形式）</h3>
        ${examHtml}
        ${(u.examTarget && u.examTarget.note) ? `<p class="zh">${escapeHtml(u.examTarget.note)}</p>` : ""}
      `;
      vocabRoot.appendChild(article);
    });
  </script>
