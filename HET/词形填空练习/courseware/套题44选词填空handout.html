    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function blankSentence(sentence, answer) {
      const ans = String(answer || "").trim();
      if (!ans) return escapeHtml(sentence);
      const re = new RegExp(ans.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      if (!re.test(sentence)) return `${escapeHtml(sentence)} <span class="blank">__________</span>`;
      return escapeHtml(sentence).replace(re, "__________");
    }
    function renderPassage(mode) {
      const parts = PASSAGE.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p);
        const num = Number(m[1]);
        if (mode === "key") return `<span class="blank">${escapeHtml(PRACTICE_ANS[num] || "")}</span>`;
        return `<span class="blank">(${num})</span>`;
      }).join("");
    }
