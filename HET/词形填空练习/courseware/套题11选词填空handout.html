    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function blankSentence(sentence, answer) {
      const ans = String(answer || "").trim();
      if (!ans) return escapeHtml(sentence);
      const re = new RegExp(ans.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      if (!re.test(sentence)) return `${escapeHtml(sentence)} <span class="blank">__________</span>`;
      return escapeHtml(sentence).replace(re, "__________");
    }
    function renderPassage(mode) {
      const parts = PASSAGE.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p);
        const num = Number(m[1]);
        if (mode === "key") return `<span class="blank">${escapeHtml(PRACTICE_ANS[num] || "")}</span>`;
        return `<span class="blank">(${num})</span>`;
      }).join("");
    }

          <p class="ans">→ ${escapeHtml(d.answer || "")}</p>
          <p class="note">拼写提示：${escapeHtml(d.note || "")}</p>
          ${d.exampleSentence ? `<p class="en" style="margin-top:10px;"><strong>Step3 配套例句：</strong>${escapeHtml(d.exampleSentence)}</p><p class="zh">【译文】${escapeHtml(d.exampleZh || "")}</p>` : ""}
          ${(d.induct && Array.isArray(d.induct.peers) && d.induct.peers.length) ? `
          <div class="induct">
            <div class="title">${escapeHtml(d.induct.title || "归纳 · 同类构词")}</div>
            <p class="peers">${d.induct.peers.map((w) => escapeHtml(w)).join(" · ")}</p>
            <p class="note">${escapeHtml(d.induct.tip || "")}</p>
          </div>` : ""}
        </div>
      `).join("");

      const examHtml = examples.map((ex) => `
        <div class="exam">
          <p class="line">${blankSentence(ex.readSentence || "", ex.blankAnswer || (u.examTarget && u.examTarget.form) || "")}</p>
          <p class="key">【答案】${escapeHtml(ex.blankAnswer || (u.examTarget && u.examTarget.form) || "")}</p>
          <p class="zh">【译文】${escapeHtml(ex.readSentenceZh || "")}</p>
        </div>
      `).join("");

      const article = document.createElement("article");
      article.className = "vocab";
      article.id = id;
      article.innerHTML = `
        <h2>${escapeHtml(u.headword)}</h2>
        <span class="tag">套题11 · 词汇流</span>
        <h3>Step 1 · 释义（A2）</h3>
        <p class="def">${escapeHtml(u.defA2 || "")}</p>
        <h3>Step 2 · 常见用法</h3>
        ${usageHtml}
        <h3>Step 3 · 派生词与归纳</h3>
        ${derivHtml}
        <h3>Step 4 · 考点例句（适当形式）</h3>
        ${examHtml}
        ${(u.examTarget && u.examTarget.note) ? `<p class="zh">${escapeHtml(u.examTarget.note)}</p>` : ""}
      `;
      vocabRoot.appendChild(article);
    });
  </script>
</body>
</html>
