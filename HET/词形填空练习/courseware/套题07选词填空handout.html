    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function blankSentence(sentence, answer) {
      const ans = String(answer || "").trim();
      if (!ans) return escapeHtml(sentence);
      const re = new RegExp(ans.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      if (!re.test(sentence)) return `${escapeHtml(sentence)} <span class="blank">__________</span>`;
      return escapeHtml(sentence).replace(re, "__________");
    }
    function renderPassage(mode) {
      const parts = PASSAGE.split(/(__\d+__)/g);
      return parts.map((p) => {
        const m = /^__(\d+)__$/.exec(p);
        if (!m) return escapeHtml(p);
        const num = Number(m[1]);
        if (mode === "key") return `<span class="blank">${escapeHtml(PRACTICE_ANS[num] || "")}</span>`;
        return `<span class="blank">(${num})</span>`;
      }).join("");
    }

    document.getElementById("wordBank").textContent = WORD_BANK.join(" · ");
    document.getElementById("passagePractice").innerHTML = renderPassage("practice");
    document.getElementById("passageKey").innerHTML = renderPassage("key");
    document.getElementById("quickKeys").innerHTML = `<strong>答案键：</strong>${Object.keys(PRACTICE_ANS).sort().map((k) => `${k} ${PRACTICE_ANS[k]}`).join(" · ")}`;

        : (u.examTarget ? [{ readSentence: u.examTarget.readSentence, readSentenceZh: u.examTarget.readSentenceZh, blankAnswer: u.examTarget.form }] : []);

      const usageHtml = (u.usages || []).map((x) => `

          <div class="label">${escapeHtml(x.label || "")}</div>

          <p class="zh">【译文】${escapeHtml(x.sentenceZh || "")}</p>

          <p class="rephrase"><strong>Rephrase：</strong>${escapeHtml(x.rephrase || "")}</p>
        </div>
      `).join("");

      const derivHtml = (u.derivatives || []).map((d) => `
        <div class="deriv">
          <p class="q">${escapeHtml(d.q || "")}</p>

          <div class="induct">
            <div class="title">${escapeHtml(d.induct.title || "归纳 · 同类构词")}</div>

            <p class="note">${escapeHtml(d.induct.tip || "")}</p>
          </div>` : ""}
        </div>
      `).join("");

      const examHtml = examples.map((ex) => `
        <div class="exam">
          <p class="line">${blankSentence(ex.readSentence || "", ex.blankAnswer || (u.examTarget && u.examTarget.form) || "")}</p>

        </div>
      `).join("");

      const article = document.createElement("article");
