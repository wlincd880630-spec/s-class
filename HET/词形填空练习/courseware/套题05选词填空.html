  <script>
    function hetAzureSpeechKey() {
      var HET_AZURE_SPEECH_KEY_FALLBACK =
        "C42UQWeDcluYanbo17WrtUnPhk0vkZy2uQHPTCGDzY6CdEXx99NzJQQJ99BIACqBBLyXJ3w3AAAYACOGjkyu";

        if (k) return k;
      } catch (_) {}

    }
    const AZURE_SPEECH_REGION = "southeastasia";

    let __hetResolvedAssetsBase = null;
    let __hetManifestMap = null;
    function __hetNorm(s) {
      var t = String(s || "")
        .replace(/\uFEFF/g, "")
        .replace(/\u00A0|\u3000/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      return t
        .replace(/\uFF1B/g, ";")
        .replace(/\uFF1A/g, ":")
        .replace(/\uFF0C/g, ",")
        .replace(/\uFF08/g, "(")
        .replace(/\uFF09/g, ")")

    }
    async function __hetEnsureManifest() {
      if (__hetManifestMap) return __hetManifestMap;
      var bases = [];
      try {
        if (typeof window !== "undefined" && window.__HET_CLOZE_ASSETS_BASE__)
          bases.push(String(window.__HET_CLOZE_ASSETS_BASE__).replace(/\/?$/, "/"));
      } catch (_) {}
      bases.push(HET_CLOZE_ASSETS_BASE_COS);
      bases.push(HET_CLOZE_ASSETS_BASE_COS.replace(/Assets\/$/, "assets/"));
      try {
        [HET_CLOZE_ASSETS_BASE_COS, HET_CLOZE_ASSETS_BASE_COS.replace(/Assets\/$/, "assets/")].forEach(function (root) {
          var _u = new URL(root);
          var _parts = _u.pathname.split("/").filter(function (x) { return x; });
          var _enc = "/" + _parts.map(function (seg) { return encodeURIComponent(seg); }).join("/") + "/";
          bases.push(_u.origin + _enc);
        });
      } catch (_) {}
      try {
        bases.push(new URL("Assets/", window.location.href).href);
      } catch (_) {}
      try {
        bases.push(new URL("assets/", window.location.href).href);
      } catch (_) {}
      var lastErr = null;
      for (var bi = 0; bi < bases.length; bi++) {
        var base = bases[bi];
        try {
          var res = await fetch(base + "manifest.json", { cache: "no-cache" });
          if (!res.ok) continue;
          var data = await res.json();
          __hetResolvedAssetsBase = base;
          __hetManifestMap = new Map();
          for (const ent of Object.values(data)) {

          }

    }
    function voiceGenderAndLang(voiceName) {

    function bindVocabInteractions(root) {
      root.querySelectorAll(".spell-zone").forEach((zone) => {
        const word = zone.getAttribute("data-spell") || "";
        const chars = [...word];
        const chips = zone.querySelectorAll(".letter-chip");
        let idx = 0;
        const countEl = zone.querySelector(".spell-count");
        const noteTarget = zone.getAttribute("data-reveal-note");
        const revealNext = () => {
          if (idx >= chars.length) return;
          const ch = chars[idx];
          chips[idx].textContent = ch === " " ? "·" : ch;
          chips[idx].classList.remove("blind");
          chips[idx].classList.add("shown");
          idx++;
          if (countEl) countEl.textContent = String(idx);
          if (noteTarget && idx >= chars.length) {
            const box = document.getElementById(noteTarget);
            if (box) box.classList.add("show");
          }
        };
        zone.addEventListener("click", (e) => {
          if (e.target.closest("button") || e.target.closest("a")) return;
          revealNext();
        });
      });
      root.querySelectorAll(".usage-strip").forEach((strip) => {
        const reveal = () => {
          const body = strip.querySelector(".usage-strip-body");
          if (body) body.classList.add("show");
          strip.classList.add("is-revealed");

        strip.addEventListener("click", (e) => { if (!e.target.closest("button")) reveal(); });

        inp.addEventListener("input", () => { inp.style.borderBottomColor = "var(--ng-gold)"; });

      }).join("");

                    "sentenceZh": "她在写作比赛中赢得了一个奖项。",
                    "explain": "win 作动词，后接奖品。",
                    "rephrase": "She got a prize in the writing competition."
                },
                {
                    "label": "获胜",
                    "sentence": "If you try your best, you can win.",
                    "sentenceZh": "如果你尽力，你就能赢。",
                    "explain": "win 作动词，不及物用法。",
                    "rephrase": "If you try your best, you can be the winner."
                }
            ],
            "derivatives": [
                {
                    "q": "动名词 winning",
                    "answer": "winning",
                    "readAloud": "winning",
                    "note": "win → winning (双写 n + ing)",
                    "exampleSentence": "Winning the first prize made her very happy.",
                    "exampleZh": "赢得一等奖让她非常开心。",
                    "induct": {
                        "title": "动词变动名词规则",
                        "peers": [
                            "run → running",

                            "get → getting",
                            "put → putting",
                            "begin → beginning",

            "examTarget": {
                "form": "winning",
                "examExamples": [
                    {
                        "readSentence": "Winning the match was the best moment of the year for the team.",

                ],
                "note": "套题05 · 考点：win 的动名词形式 winning 作主语或宾语，表示「赢得」的动作。"

    const slides = [];
    function add(html, meta) { slides.push({ html, meta: meta || null }); }
    function pushVocabProgram(units, articleTag) {
      units.forEach((u) => {
        const parts = slidesFromUnit(u, articleTag);
        parts.forEach((html, i) => add(html, i === 0 ? { vocabStart: { article: articleTag, headword: u.headword } } : null));
      });
    }

    add(`<div class="tag">课程地图</div>
      <h1 class="slide-title">短文填空 · 套题05 · 英式幽默与 understatement</h1>
      <p>本套结构：背景输入 → 词汇四步流 → 证据链 → 半独立练习 → 独立作答 → 答案复盘。讲解与自编例句均<strong>不复述本题英文原文</strong>，侧重中考可迁移规则与跨文化阅读。</p>
      <div class="card"><h3>本题节奏</h3>
        <ol>
          <li>把握文化说明类语篇：对比英式 / 美式笑点，讽刺（irony）与<strong>轻描淡写 understatement</strong>。</li>
          <li>词汇四步流：Step1 听音/拼写/A2释义；Step2 常见用法；Step3 派生归纳（含配套例句）；Step4 词形测试。</li>
          <li>方框 12 词含 <strong>2 个干扰项</strong>（consider / we）；语篇实填 10 空（1–10）。</li>
          <li>复盘记忆：<code>British → Britain</code>、<code>power → powerful</code>、反身代词、副词修饰分词、比较级、动名词平行、情绪形容词、副词强化、<code>difficult to understand</code>。</li>
        </ol>
      </div>`);

    add(`<div class="tag">背景导入</div>
      <h2 class="slide-h2">跨文化幽默 · 反讽语气 · 中考阅读观点段</h2>
      <p>此类说明文常在<strong>对比、举例、委婉评价</strong>之间切换；命题热衷考派生词、反身代词、比较级与<strong>形容词 + to do</strong>结构。要注意“字面轻快、内核严肃”的语气标记词。</p>
      <div class="card"><h3>读前问题</h3>
        <p>同样是开玩笑，为什么有的文化偏好“冷脸包袱”？当你听到 “Not very pleasant.”，说话人真实情绪更接近哪一种刻度？</p></div>
      <div class="row-audio"><button type="button" class="tts" data-text="Keeping a straight face can be another punchline when humor hides worry.">听一句跨文化观察句（自编）</button></div>`);

    add(`<div class="tag">方框词</div>
      <h2 class="slide-h2">词库（12 词 · 10 空）</h2>
      <p class="mono">bad / British / consider / fun / hope / pleasure / power / they / total / understand / we / win</p>
      <div class="card"><h3>策略提示</h3>
        <p>先标槽：<code>in ___</code> 地名 → British 的国名派生；并列形容词修饰 people → power 的形容词；<code>takes ___ seriously</code> → 反身代词；<code>treated ___</code> → 副词；<code>even ___</code> → 比较级；与 <code>doing clever things</code> 平行 → 动名词；<code>feel ___</code> → 情绪形容词；引号 understatement → pleasant；<code>gone ___ wrong</code> → total 的副词；<code>difficult ___</code> → <code>to understand</code>。</p></div>`);

    pushVocabProgram(VOCAB_UNITS, "本题");

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位一：国名 · 权势人物描写 · 反身代词</h2>
      <div class="sense">第一空：<code>in ___</code> 表地点，British → Britain。第二空：与 important people 并列，需形容词 powerful（power）。第三空：<code>take ___ seriously</code> 指“把自己看得过重”，they → themselves。</div>
      <div class="row-audio"><button type="button" class="tts" data-text="Powerful hosts introduced Britain politely before the culture fair began.">听同构句（自编）</button></div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位二：副词修饰分词 · 比较级 · 动名词平行</h2>
      <div class="sense">第四空：<code>is treated ___</code>，bad → badly 修饰过去分词。第五空：<code>it's even ___</code>，fun → funnier 比较级。第六空：与 <code>doing clever things</code> 并列，win → winning。</div>
      <div class="row-audio"><button type="button" class="tts" data-text="The shy comic was treated badly online until classmates defended him.">听同构句（自编）</button></div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位三：情绪形容词 · understatement 与 pleasant</h2>
      <div class="sense">第七空：<code>feel ___</code>，hope → hopeless 描写他人感受与英式笑点反差。第八空：引语 <code>Not very ___</code>，pleasure → pleasant，典型轻描淡写。</div>
      <div class="grid-2">
        <div class="card"><h3>可迁移结构</h3><p>Not very pleasant · a tiny problem · a bit windy</p></div>
        <div class="card"><h3>易错点</h3><p>勿把 pleasant 写成 pleasure 填在形容词槽；hopeless 与 hopeful 先辨语境。</p></div>
      </div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">槽位四：totally 强化 · difficult to understand</h2>
      <div class="sense">第九空：<code>gone ___ wrong</code>，total → totally 修饰形容词。第十空：<code>make it difficult ___ British humor</code>，形容词 + to do → to understand。</div>
      <div class="grid-2">
        <div class="card"><h3>干扰项</h3><p><code>consider</code> 易被误放入理解槽，但本文难点结构为 <code>difficult to understand</code>。<code>we</code> 看似贴合文化自述，但各空已有更贴合的派生形式。</p></div>
        <div class="card"><h3>写作迁移</h3><p>写“文化差异、幽默、社交语气”话题，可迁移 understatement、difficult to understand、feel hopeless 等地道搭配。</p></div>
      </div>`);

    add(`<div class="tag">半独立</div>
      <h2 class="slide-h2">语篇填空（编号提示 · 1–10）</h2>
      <p>只显示编号，先判定词性与词形，再口头给出证据。</p>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "study")}</div>
      <p class="bank">词库：${WORD_BANK.join(" / ")}</p>`);

    add(`<div class="tag">独立作答</div>
      <h2 class="slide-h2">独立作答页（答案隐藏）</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "practice")}</div>
      <div class="row-audio" style="margin-top:10px;">
        <button type="button" class="nav" id="checkPracticeBtn">一键核对</button>
      </div>
      <p id="practiceScore" class="score">先独立填写，再点击核对。</p>`);

    add(`<div class="tag">答案</div>
      <h2 class="slide-h2">答案与词形</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "key")}</div>
      <div class="card"><h3>快速核对清单</h3>
        <p class="mono">1 Britain · 2 powerful · 3 themselves · 4 badly · 5 funnier · 6 winning · 7 hopeless · 8 pleasant · 9 totally · 10 to understand</p>
      </div>`);

    const vocabNavEntries = [];
    let idx = 0;

    function fillCourseNav() {
      const scroll = document.getElementById("courseNavScroll");
      const list = vocabNavEntries.map((e) => `<li><button type="button" class="nav-vocab-link" data-slide-index="${e.index}">${escapeHtml(e.headword)}</button></li>`).join("");
      scroll.innerHTML = `<div class="course-nav-h">本题词汇流（12 词族 · 方框 12 词）</div><ul class="course-nav-list">${list}</ul>`;
      scroll.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-slide-index"));
          if (!Number.isNaN(i)) { idx = i; render(); }
        });
      });
    }

    function syncNavActive() {
      const sorted = [...vocabNavEntries].sort((a, b) => a.index - b.index);
      document.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        const i = Number(btn.getAttribute("data-slide-index"));
        const pos = sorted.findIndex((e) => e.index === i);
        const nextStart = pos >= 0 && pos < sorted.length - 1 ? sorted[pos + 1].index : slides.length;
        btn.classList.toggle("is-active", idx >= i && idx < nextStart);
      });
    }

    function render() {
      const root = document.getElementById("slideRoot");
      root.innerHTML = `<div class="slide-body-inner">${slides[idx].html}</div>`;
      document.getElementById("progress").textContent = `Slide ${idx + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === slides.length - 1;
      bindTtsButtons(root);
      bindVocabInteractions(root);
      if (typeof bindClozePracticeLookup === "function") bindClozePracticeLookup(root, PASSAGE);
      syncNavActive();
    }

    slides.forEach((s, i) => {
      if (s.meta && s.meta.vocabStart) {
        vocabNavEntries.push({ index: i, article: s.meta.vocabStart.article, headword: s.meta.vocabStart.headword });
      }
    });
    fillCourseNav();

    document.getElementById("navToggle").addEventListener("click", () => {
      const nav = document.getElementById("courseNav");
      const btn = document.getElementById("navToggle");
      const collapsed = nav.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      btn.textContent = collapsed ? "展开" : "目录";
    });
    document.getElementById("prevBtn").addEventListener("click", () => { idx = Math.max(0, idx - 1); render(); });
    document.getElementById("nextBtn").addEventListener("click", () => { idx = Math.min(slides.length - 1, idx + 1); render(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") document.getElementById("nextBtn").click();
      if (e.key === "ArrowLeft" || e.key === "PageUp") document.getElementById("prevBtn").click();
    });

    refreshTtsBadge();
    render();
  </script>
