  <script>
    function hetAzureSpeechKey() {

    let __hetResolvedAssetsBase = null;
    let __hetManifestMap = null;
    function __hetNorm(s) {
      var t = String(s || "")
        .replace(/\uFEFF/g, "")
        .replace(/\u00A0|\u3000/g, " ")
        .replace(/\s+/g, " ")

      return t

    async function __hetEnsureManifest() {
      if (__hetManifestMap) return __hetManifestMap;
      var bases = [];
      try {
        if (typeof window !== "undefined" && window.__HET_CLOZE_ASSETS_BASE__)
          bases.push(String(window.__HET_CLOZE_ASSETS_BASE__).replace(/\/?$/, "/"));
      } catch (_) {}
      bases.push(HET_CLOZE_ASSETS_BASE_COS);

      try {
        [HET_CLOZE_ASSETS_BASE_COS, HET_CLOZE_ASSETS_BASE_COS.replace(/Assets\/$/, "assets/")].forEach(function (root) {
          var _u = new URL(root);
          var _parts = _u.pathname.split("/").filter(function (x) { return x; });
          var _enc = "/" + _parts.map(function (seg) { return encodeURIComponent(seg); }).join("/") + "/";
          bases.push(_u.origin + _enc);
        });

      try {
        bases.push(new URL("Assets/", window.location.href).href);
      } catch (_) {}
      try {
        bases.push(new URL("assets/", window.location.href).href);

      var lastErr = null;

        const revealNext = () => {
          if (idx >= chars.length) return;
          const ch = chars[idx];
          chips[idx].textContent = ch === " " ? "·" : ch;
          chips[idx].classList.remove("blind");
          chips[idx].classList.add("shown");

      <div class="card"><h3>本题节奏</h3>

          <li>先建立语义场：讨论的不是算术对错，而是<strong>规则—质疑—反例—适用范围</strong>的论证链。</li>
          <li>词汇四步流：Step1 听音/拼写/A2释义；Step2 常见用法；Step3 派生归纳；Step4 词形测试。</li>
          <li>方框 12 词中，<strong>2 词为高质量干扰项</strong>；语篇实填 10 空（71–80），需据槽位与搭配排除。</li>
          <li>复盘时把“可迁移规则”写下来：介词后形式、比较级、后置定语、评注副词等。</li>
        </ol>
      </div>`);

    add(`<div class="tag">背景导入</div>
      <h2 class="slide-h2">数学课堂里的论证意识</h2>
      <p>文本触及<strong>公理化直觉</strong>与<strong>情境建模</strong>：何时坚持常规加法模型？何时必须改写对象（咖啡预算、沙堆、双重否定）？语言题考查的不是背诵公式，而是<strong>把推理说清楚</strong>所需的词汇—语法接口。</p>
      <div class="card"><h3>读前问题</h3>
        <p>当老师只说“就是这样”，你失去的究竟是答案本身，还是<strong>追问理由的权利</strong>？若要把追问说清楚，你需要哪些语言手段（让步、比较、评注、限定可能性）？</p></div>
      <div class="row-audio"><button type="button" class="tts" data-text="The point of a proof is to show not only that a claim is true, but under which assumptions it remains true.">听一句方法论语境</button></div>`);

    add(`<div class="tag">方框词</div>
      <h2 class="slide-h2">词库（12 词 · 10 空）</h2>
      <p class="mono">accept / basic / correct / disappoint / follow / little / much / need / other / possible / three / zero</p>
      <div class="card"><h3>策略提示</h3>
        <p>先标出每个空格的<strong>语法槽位</strong>（补语、情态后原形、比较级、过去分词定语、评注副词、形容词修饰 answers 等），再把词库按<strong>词性簇</strong>分组比对；遇 than、instead of、must、numbers 等<strong>触发词</strong>优先收敛候选。</p></div>`);

    pushVocabProgram(VOCAB_UNITS, "本题");

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">为什么是 follow（空 72）？</h2>
      <div class="sense">从句逻辑主语为 <strong>everyone</strong>，情态动词 <strong>must</strong> 后接动词原形；表示人人都须<strong>遵守</strong>规则，故填 <strong>follow</strong>。</div>
      <div class="grid-2">
        <div class="card"><h3>同类结构</h3><p>We must follow the rules. / Visitors must follow the signs.</p></div>
        <div class="card"><h3>易错点</h3><p>若以 rules 作主语写成 *rules that must follow*，主谓不通；语篇已改为 everyone must follow，槽位与语义一致。</p></div>
      </div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">为什么是 accepting（空 73）？</h2>
      <div class="sense">前有介词短语 instead of，后有副词 simply；of 为介词，槽位要求<strong>动名词</strong>而非原形 accept。</div>
      <div class="grid-2">
        <div class="card"><h3>同类结构</h3><p>instead of repeating / instead of proving / instead of checking</p></div>
        <div class="card"><h3>易错点</h3><p>勿因句意“接受”就填 accept；须与介词后形式一致。</p></div>
      </div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">为什么是 more（空 74）？</h2>
      <div class="sense">比较触发词 <strong>than</strong> 要求比较级；词库基形 much → <strong>more</strong>，与“合并预算后购买力上升”的算术隐喻一致。</div>
      <div class="row-audio"><button type="button" class="tts" data-text="Pooling resources can yield much more than separate budgets.">听同构句</button></div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">为什么是 other（空 76）？</h2>
      <div class="sense">叙事对举 <strong>one pile … the other (pile)</strong>：语篇在空前给出 <strong>the</strong>，槽位填 <strong>other</strong> 构成 <strong>the other</strong>，指两堆沙中的另一堆。</div>
      <div class="grid-2">
        <div class="card"><h3>同类结构</h3><p>one pen and the other pen / one answer … the other answer</p></div>
        <div class="card"><h3>易错点</h3><p>勿写成 *on top of other*（缺 the）；another 强调“再一”时多不接 one … the other 对举。</p></div>
      </div>`);

    add(`<div class="tag">证据链</div>
      <h2 class="slide-h2">为什么是 Basically（空 79）？</h2>
      <div class="sense">逗号后切入<strong>研究方法论</strong>议论：需<strong>句首评注副词</strong>概括立场；basic → <strong>Basically</strong>，大写并统领全句。</div>
      <div class="row-audio"><button type="button" class="tts" data-text="Basically, we distinguish what is proved from what is assumed.">听同构句</button></div>`);

    add(`<div class="tag">半独立</div>
      <h2 class="slide-h2">语篇填空（编号提示 · 71–80）</h2>
      <p>先判定槽位与搭配，再考虑词形；词库含 2 个干扰项，勿强行用完每个词。</p>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "study")}</div>
      <p class="bank">词库：${WORD_BANK.join(" / ")}</p>`);

    add(`<div class="tag">独立作答</div>
      <h2 class="slide-h2">独立作答页（答案隐藏）</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "practice")}</div>
      <div class="row-audio" style="margin-top:10px;">
        <button type="button" class="nav" id="checkPracticeBtn">一键核对</button>
      </div>
      <p id="practiceScore" class="score">先独立填写，再点击核对。</p>`);

    add(`<div class="tag">答案</div>
      <h2 class="slide-h2">答案与词形</h2>
      <div class="passage">${renderPassage(PASSAGE, PRACTICE_ANS, "key")}</div>
      <div class="card"><h3>快速核对清单</h3>
        <p class="mono">71 disappointed · 72 follow · 73 accepting · 74 more · 75 needed · 76 other · 77 zero · 78 correct · 79 Basically · 80 possible</p>
      </div>`);

    const vocabNavEntries = [];
    let idx = 0;

    function fillCourseNav() {
      const scroll = document.getElementById("courseNavScroll");
      const list = vocabNavEntries.map((e) => `<li><button type="button" class="nav-vocab-link" data-slide-index="${e.index}">${escapeHtml(e.headword)}</button></li>`).join("");
      scroll.innerHTML = `<div class="course-nav-h">本题词汇流（12 词族 · 方框 12 词）</div><ul class="course-nav-list">${list}</ul>`;
      scroll.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-slide-index"));
          if (!Number.isNaN(i)) { idx = i; render(); }
        });
      });
    }

    function syncNavActive() {
      const sorted = [...vocabNavEntries].sort((a, b) => a.index - b.index);
      document.querySelectorAll(".nav-vocab-link").forEach((btn) => {
        const i = Number(btn.getAttribute("data-slide-index"));
        const pos = sorted.findIndex((e) => e.index === i);
        const nextStart = pos >= 0 && pos < sorted.length - 1 ? sorted[pos + 1].index : slides.length;
        btn.classList.toggle("is-active", idx >= i && idx < nextStart);
      });
    }

    function render() {
      const root = document.getElementById("slideRoot");
      root.innerHTML = `<div class="slide-body-inner">${slides[idx].html}</div>`;
      document.getElementById("progress").textContent = `Slide ${idx + 1} / ${slides.length}`;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === slides.length - 1;
      bindTtsButtons(root);
      bindVocabInteractions(root);
      if (typeof bindClozePracticeLookup === "function") bindClozePracticeLookup(root, PASSAGE);
      syncNavActive();
    }

    slides.forEach((s, i) => {
      if (s.meta && s.meta.vocabStart) {
        vocabNavEntries.push({ index: i, article: s.meta.vocabStart.article, headword: s.meta.vocabStart.headword });
      }
    });
    fillCourseNav();

    document.getElementById("navToggle").addEventListener("click", () => {
      const nav = document.getElementById("courseNav");
      const btn = document.getElementById("navToggle");
      const collapsed = nav.classList.toggle("is-collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      btn.textContent = collapsed ? "展开" : "目录";
    });
    document.getElementById("prevBtn").addEventListener("click", () => { idx = Math.max(0, idx - 1); render(); });
    document.getElementById("nextBtn").addEventListener("click", () => { idx = Math.min(slides.length - 1, idx + 1); render(); });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown") document.getElementById("nextBtn").click();
      if (e.key === "ArrowLeft" || e.key === "PageUp") document.getElementById("prevBtn").click();
    });

    refreshTtsBadge();
    render();
  </script>
</body>
</html>
