<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-soft: #334155;
  --accent: #38bdf8;
  --accent2: #fbbf24;
  --accent3: #34d399;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #475569;
  --ok: #22c55e;
  --bad: #ef4444;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "DM Sans", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.hero {
  position: relative;
  min-height: 220px;
  overflow: hidden;
  border-bottom: 3px solid var(--accent);
}
.hero img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  opacity: .85;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, rgba(15,23,42,.92) 0%, rgba(15,23,42,.55) 55%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2rem clamp(1rem, 4vw, 3rem);
}
.hero h1 {
  font-size: clamp(1.4rem, 4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -.02em;
}
.hero h1 span { color: var(--accent2); }
.hero p { color: var(--muted); margin-top: .5rem; max-width: 36rem; font-size: .95rem; }
.badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.badge {
  font-size: .72rem;
  padding: .25rem .65rem;
  border-radius: 999px;
  background: rgba(56,189,248,.15);
  border: 1px solid rgba(56,189,248,.35);
  color: var(--accent);
}
.wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem clamp(1rem, 3vw, 1.5rem) 3rem; }
.tabs {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  padding: .75rem 0;
  border-bottom: 1px solid var(--line);
}
.tab {
  flex: 1;
  min-width: 100px;
  padding: .65rem 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-card);
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  font-size: .88rem;
  transition: .2s;
  text-align: center;
}
.tab:hover { border-color: var(--accent); color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  border-color: transparent;
  color: #fff;
}
.panel { display: none; animation: fadeIn .35s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.card h2 {
  font-size: 1.1rem;
  margin-bottom: .75rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}
.card h2 .num {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: #0f172a;
  font-size: .8rem;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
}
.source-tag { font-size: .68rem; color: var(--muted); background: var(--bg-soft); padding: .15rem .45rem; border-radius: 4px; margin-left: auto; }
.grammar-body { font-size: .9rem; color: var(--muted); }
.grammar-body strong { color: var(--accent2); }
.example-box {
  margin-top: .75rem;
  padding: .75rem 1rem;
  background: rgba(15,23,42,.6);
  border-left: 3px solid var(--accent3);
  border-radius: 0 8px 8px 0;
  font-size: .88rem;
}
.mini-q { margin-top: .85rem; padding-top: .85rem; border-top: 1px dashed var(--line); }
.mini-q label {
  display: block;
  margin: .35rem 0;
  padding: .45rem .75rem;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  font-size: .88rem;
  transition: .15s;
}
.mini-q label:hover { background: var(--bg-soft); }
.mini-q input { margin-right: .5rem; }
.mini-q label.correct { border-color: var(--ok); background: rgba(34,197,94,.12); }
.mini-q label.wrong { border-color: var(--bad); background: rgba(239,68,68,.1); }
.vocab-header {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin-bottom: 1rem;
}
.vocab-header img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
.vocab-search {
  flex: 1;
  min-width: 200px;
  padding: .6rem 1rem;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text);
  font-size: .9rem;
}
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: .75rem;
}
.vocab-card {
  perspective: 800px;
  height: 110px;
  cursor: pointer;
}
.vocab-inner {
  position: relative;
  width: 100%; height: 100%;
  transition: transform .5s;
  transform-style: preserve-3d;
}
.vocab-card.flipped .vocab-inner { transform: rotateY(180deg); }
.vocab-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: var(--radius);
  padding: .85rem 1rem;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.vocab-front { background: linear-gradient(145deg, #1e3a5f, #1e293b); }
.vocab-back {
  background: linear-gradient(145deg, #134e4a, #1e293b);

}
.vocab-en { font-weight: 700; font-size: .95rem; color: var(--accent); }
.vocab-zh { font-size: .88rem; margin-top: .25rem; }
.vocab-src { font-size: .65rem; color: var(--muted); margin-top: .35rem; }
.test-sec { margin-bottom: 1.5rem; }
.test-sec h3 {

.q-block {

  background: rgba(15,23,42,.5);
  border-radius: var(--radius);

.q-stem { font-size: .92rem; margin-bottom: .6rem; }
.q-num { color: var(--accent); font-weight: 700; margin-right: .35rem; }
.q-opts label {
  display: block;
  padding: .45rem .7rem;
  margin: .3rem 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: .88rem;
  border: 1px solid transparent;
}
.q-opts label:hover { background: var(--bg-soft); }
.q-opts input { margin-right: .45rem; }
.blank-input {
  border: none;
  border-bottom: 2px solid var(--accent);
  background: transparent;
  color: var(--accent2);
  font-weight: 600;
  width: 7rem;
  padding: .2rem .4rem;
  font-size: .9rem;
  text-align: center;
}
.blank-input.wide { width: 11rem; }
.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin: .75rem 0;
  padding: .6rem;
  background: var(--bg-soft);
  border-radius: 8px;
}
.word-bank span {
  padding: .25rem .55rem;
  background: var(--bg-card);
  border-radius: 6px;
  font-size: .8rem;
  border: 1px solid var(--line);
}
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.match-item {
  padding: .5rem .75rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  cursor: pointer;
  font-size: .85rem;
  transition: .15s;
}
.match-item.selected { border-color: var(--accent); background: rgba(56,189,248,.15); }
.match-item.matched { opacity: .45; pointer-events: none; border-color: var(--ok); }
.match-item.bad { border-color: var(--bad); animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: .75rem;
  align-items: center;
  margin-bottom: 1rem;
}
.btn {
  padding: .55rem 1.2rem;
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  cursor: pointer;
  font-size: .88rem;
  transition: .2s;
}
.btn-primary { background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.score-panel {
  text-align: center;
  padding: 1.5rem;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #1e3a5f, #312e81);
  border: 1px solid var(--accent);
  margin-top: 1rem;
  display: none;
}
.score-panel.show { display: block; animation: fadeIn .4s; }
.score-big { font-size: 2.5rem; font-weight: 700; color: var(--accent2); }
.progress-bar {
  height: 6px;
  background: var(--bg-soft);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 1rem;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  width: 0%;
  transition: width .4s;
}
.reading-passage {
  font-size: .88rem;
  color: var(--muted);
  padding: 1rem;
  background: var(--bg-soft);
  border-radius: 8px;
  margin-bottom: .75rem;
  line-height: 1.75;
}
.reading-passage em { color: var(--text); font-style: normal; }
footer {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--muted);
  font-size: .8rem;
}
@media (max-width: 600px) {
  .match-grid { grid-template-columns: 1fr; }
  .hero img { height: 180px; }
}
</style>

<script>
const GRAMMAR = [
  { title: "词形变换（名/动/形/副）", source: "三套卷 B 卷", tip: "B 卷短文填空每年必考 <strong>10 题词形变化</strong>：名词复数、形容词最高级、副词、过去式、现在分词等。", ex: "The two volumes <u>arrived</u> (arrive) in Beijing. · It is one of the <u>oldest</u> (old) kinds of texts.", q: "Scientists made an important ______ (discover) last year.", opts: ["discovery","discovering","discovered"], ans: 0 },
  { title: "动词短语辨析", source: "真题+白卷", tip: "完形与完成短文常考 <strong>短语动词</strong>：stick to, give up, throw away, end up, make up for, connect with。", ex: "Many classmates <u>threw away</u> scratch paper. · Don't <u>give up</u> on your dreams.", q: "Small actions can ______ a big difference.", opts: ["make","do","take"], ans: 0 },
  { title: "连词与逻辑衔接", source: "三套卷", tip: "<strong>Although / However / Besides / Because / But</strong> 连接句子，注意转折与递进。", ex: "<u>Although</u> it was hard, he didn't give up. · <u>However</u>, further study is still needed.", q: "______ the weather was bad, we still enjoyed the trip.", opts: ["Although","Because","So"], ans: 0 },
  { title: "固定搭配与介词", source: "三套卷", tip: "<strong>full of, a symbol of, on purpose, be famous for, arrive in/at</strong> 等需整体记忆。", ex: "The park is <u>full of</u> green trees. · Birds <u>nest in</u> holes in trees.", q: "The panda is ______ China.", opts: ["a symbol of","afraid of","full of"], ans: 0 },
  { title: "比较级与最高级", source: "白卷+真题", tip: "BMI 表格题、B 卷填空常考 <strong>more/less/most/oldest</strong> 及 irregular forms。", ex: "one of the <u>oldest</u> kinds · birds sang <u>earlier</u> in bright areas", q: "This is one of the ______ (popular) theme parks in China.", opts: ["most popular","more popular","popular"], ans: 0 },
  { title: "时态（过去/完成/进行）", source: "三套卷", tip: "叙事文多用<strong>一般过去时</strong>；after doing 用动名词；has returned 现在完成。", ex: "In 2023, Dr. Pease <u>set up</u> a microphone. · They <u>have finally returned</u> to China.", q: "After ______ (reach) America, it passed through more hands.", opts: ["reaching","reached","reach"], ans: 0 },
  { title: "被动语态与系表结构", source: "黑卷+白卷", tip: "<strong>be + done</strong>：was covered with, were shown to the public；系表 + 形容词。", ex: "The notebook <u>was covered with</u> watercolor stains. · The volumes <u>were shown</u> to the public.", q: "The Chu Silk Manuscript ______ (divide) into three parts.", opts: ["was divided","divided","is dividing"], ans: 0 },

  { title: "状语从句（让步/方式）", source: "真题", tip: "<strong>Even though</strong> 尽管；<strong>with patience</strong> 耐心地（方式状语）。", ex: "<u>Even though</u> he faced difficulties, Su Shi stayed positive. · He solved problems <u>with patience</u>.", q: "______ it was difficult, she didn't lose heart.", opts: ["Even though","So that","As if"], ans: 0 },
  { title: "交际用语与情景应答", source: "听力 A", tip: "听句子选答语：问候、感谢、道歉、建议、祝贺等<strong>固定应答句</strong>。", ex: "— How are you doing? — <u>Not bad, thanks.</u> · — Good luck! — <u>Thank you!</u>", q: "— You've got this! — ______", opts: ["Thanks! I'll try my best.","I'm sorry to hear that.","It doesn't matter."], ans: 0 }

  ["good manners","文明礼仪","真题"],["park city","公园城市","真题"],["knocker-uppers","敲窗叫醒人","真题"],["oversleep","睡过头","真题"],["low spirits","情绪低落","真题"],["independently","独立地","真题"],["form memories","形成记忆","真题"],["customer review","顾客评价","真题"],["classical music","古典音乐","真题"],["rainforest","雨林","真题"],
  ["make up for","弥补","黑卷"],["a symbol of","……的象征","黑卷"],["know it by heart","熟记于心","黑卷"],["speech contest","演讲比赛","黑卷"],["learn from","从……中学习","黑卷"],["spicy hot pot","麻辣火锅","黑卷"],["reunion dinner","团圆饭","黑卷"],["face-changing performance","变脸表演","黑卷"],["acupuncture","针灸","黑卷"],["Traditional Chinese Medicine","中医","黑卷"],

const TEST = {

    { stem: "Su Shi stayed positive ______ he faced many difficulties.", opts: ["even though","so that","as if"], ans: 0 },

// ─── 渲染语法 ───
const grammarPanel = document.getElementById("panel-grammar");
GRAMMAR.forEach((g, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2><span class="num">${i + 1}</span>${g.title}<span class="source-tag">${g.source}</span></h2>
    <div class="grammar-body">${g.tip}</div>
    <div class="example-box">${g.ex}</div>
    <div class="mini-q" data-gi="${i}">
      <p style="font-size:.85rem;margin-bottom:.4rem">✏️ 即时小测：${g.q}</p>
      ${g.opts.map((o, j) => `<label><input type="radio" name="gq${i}" value="${j}"> ${o}</label>`).join("")}
    </div>`;
  grammarPanel.appendChild(card);
});
grammarPanel.querySelectorAll(".mini-q").forEach(el => {
  el.addEventListener("change", e => {
    if (e.target.type !== "radio") return;
    const gi = +el.dataset.gi;
    const ans = GRAMMAR[gi].ans;
    el.querySelectorAll("label").forEach((lab, j) => {
      lab.classList.remove("correct", "wrong");
      if (+e.target.value === j) lab.classList.add(j === ans ? "correct" : "wrong");
      else if (j === ans) lab.classList.add("correct");
    });
    updateProgress();
  });
});

const vocabGrid = document.getElementById("vocabGrid");

  vocabGrid.innerHTML = "";
  const f = filter.toLowerCase();
  VOCAB.filter(v => !f || v[0].toLowerCase().includes(f) || v[1].includes(filter)).forEach(v => {
    const card = document.createElement("div");
    card.className = "vocab-card";
    card.innerHTML = `<div class="vocab-inner">
      <div class="vocab-face vocab-front"><div class="vocab-en">${v[0]}</div><div class="vocab-src">${v[2]}</div></div>
      <div class="vocab-face vocab-back"><div class="vocab-zh">${v[1]}</div><div class="vocab-src">点击翻转</div></div>
    </div>`;
    card.onclick = () => card.classList.toggle("flipped");
    vocabGrid.appendChild(card);
  });
}

document.getElementById("vocabSearch").oninput = e => renderVocab(e.target.value);

// 匹配题逻辑
(function initMatch() {
  const pairs = TEST.match;
  const enItems = pairs.map((p, i) => ({ id: i, text: p[0], side: "en" }));
  const zhItems = pairs.map((p, i) => ({ id: i, text: p[1], side: "zh" }));
  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  const all = shuffle([...enItems, ...zhItems]);
  const grid = document.getElementById("matchGrid");
  let sel = null, matched = 0;
  all.forEach(item => {
    const div = document.createElement("div");
    div.className = "match-item";
    div.textContent = item.text;
    div.dataset.id = item.id;
    div.dataset.side = item.side;
    div.onclick = () => {
      if (div.classList.contains("matched")) return;
      if (!sel) { sel = div; div.classList.add("selected"); return; }
      if (sel === div) { div.classList.remove("selected"); sel = null; return; }
      if (sel.dataset.side === div.dataset.side) { sel.classList.remove("selected"); sel = div; div.classList.add("selected"); return; }
      if (sel.dataset.id === div.dataset.id) {
        sel.classList.add("matched"); div.classList.add("matched");
        sel.classList.remove("selected");
        matched++;
        document.getElementById("matchScore").value = matched;
      } else {
        div.classList.add("bad"); sel.classList.add("bad");
        setTimeout(() => { div.classList.remove("bad","selected"); sel.classList.remove("bad","selected"); sel = null; }, 400);
        return;
      }
      sel = null;
    };
    grid.appendChild(div);
  });
})();

// ─── Tab 切换 ───
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
    updateProgress();
  };
});

function updateProgress() {
  let done = 0, total = 50;
  document.querySelectorAll(".mini-q input:checked").forEach(() => done++);
  document.querySelectorAll('#testBody input[type="radio"]:checked').forEach(() => {});
  const fill = document.getElementById("progressFill");
  const tab = document.querySelector(".tab.active").dataset.tab;
  if (tab === "grammar") {
    const gDone = document.querySelectorAll(".mini-q input:checked").length;
    fill.style.width = (gDone / 10 * 100) + "%";
  } else if (tab === "vocab") {
    fill.style.width = "100%";
  } else {
    fill.style.width = "30%";
  }
}

document.getElementById("btnSubmit").onclick = () => {
  let score = 0, total = 50;
  document.querySelectorAll('#testBody .q-block[data-type="choice"]').forEach(block => {
    const ans = +block.dataset.ans;
    const checked = block.querySelector('input[type="radio"]:checked');
    if (checked && +checked.value === ans) score++;
  });
  document.querySelectorAll('#testBody .q-block[data-type="blank"]').forEach(block => {
    const ans = JSON.parse(block.dataset.ans);
    const inp = block.querySelector("input");
    const v = (inp.value || "").trim().toLowerCase();
    if (ans.some(a => a.toLowerCase() === v)) score++;
  });
  const bankAns = JSON.parse(document.querySelector('[data-type="bank"]').dataset.ans);
  ["bank0","bank1","bank2"].forEach((id, i) => {
    const v = (document.getElementById(id).value || "").trim();
    if (v.toLowerCase() === bankAns[i].toLowerCase()) score++;
  });
  document.querySelectorAll('#testBody .q-block[data-type="tf"]').forEach(block => {
    const ans = block.dataset.ans === "true";
    const checked = block.querySelector('input[type="radio"]:checked');
    if (checked && (checked.value === "true") === ans) score++;
  });
  score += parseInt(document.getElementById("matchScore").value, 10) || 0;
  const pct = Math.round(score / total * 100);
  document.getElementById("scoreNum").textContent = score + " / " + total;
  document.getElementById("scoreMsg").textContent =
    pct >= 90 ? "优秀！中考题型掌握扎实 🎉" :
    pct >= 75 ? "良好！再巩固词形填空和阅读细节" :
    pct >= 60 ? "及格！建议重刷词汇卡片与语法要点" :
    "继续加油！先过一遍 80 词再做题";
  document.getElementById("scorePanel").classList.add("show");
  document.getElementById("progressFill").style.width = "100%";
};

document.getElementById("btnReset").onclick = () => {
  document.querySelectorAll('#testBody input').forEach(i => { i.checked = false; i.value = ""; });
  document.getElementById("scorePanel").classList.remove("show");
  document.getElementById("matchScore").value = "0";
  document.querySelectorAll(".match-item").forEach(m => m.classList.remove("matched","selected","bad"));
};
updateProgress();
