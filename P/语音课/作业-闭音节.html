<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课后作业 · 闭音节（一题一页 · Azure）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comic+Neue:wght@400;700&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fff8f0;
      --peach: #ffd4c8;
      --blush: #ff9aa8;
      --mint: #b8e8d0;
      --sky: #a8d8f0;
      --lilac: #d4c4f7;
      --ink: #3d3545;
      --ink-soft: #6b6170;
      --card: #fffefb;
      --shadow: rgba(61, 53, 69, 0.12);
      --ok: #2d8a5e;
      --bad: #c44d4d;
      --font-display: "Comic Neue", "Nunito", system-ui, sans-serif;
      --font-body: "Nunito", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100%;
      background: linear-gradient(165deg, var(--cream) 0%, #ffe8ec 38%, #e8f6ff 100%);
      background-attachment: fixed;
      padding: clamp(0.6rem, 2vw, 1.2rem);
      line-height: 1.6;
    }
    .shell {
      max-width: 640px;
      margin: 0 auto;
      min-height: calc(100vh - 1.5rem);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .hero {
      text-align: center;
      margin-bottom: 0.75rem;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4.2vw, 1.75rem);
      font-weight: 800;
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255, 154, 168, 0.45);
    }
    .hero p {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin-top: 0.25rem;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .progress-text {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--ink-soft);
    }
    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
      justify-content: center;
      max-width: 100%;
    }
    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(61, 53, 69, 0.18);
      transition: transform 0.2s, background 0.2s;
    }
    .dots i.on { background: var(--blush); transform: scale(1.35); }
    .dots i.done { background: var(--mint); }
    .card {
      flex: 1;
      background: var(--card);
      border-radius: 28px;
      border: 3px solid var(--ink);
      box-shadow: 8px 8px 0 var(--shadow);
      padding: clamp(1.1rem, 4vw, 1.65rem);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -25%;
      width: 55%;
      height: 80%;
      background: radial-gradient(circle, rgba(255, 212, 200, 0.55), transparent 70%);
      pointer-events: none;
    }
    .card-inner { position: relative; z-index: 1; }
    .q-label {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 0.5rem;
    }
    .q-body {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 3.5vw, 1.28rem);
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 1rem;
    }
    .q-body .q-line {
      display: block;
    }
    .q-body .q-line.q-zh {
      margin-bottom: 0.5rem;
    }
    .q-body .q-line.q-en {
      font-family: var(--font-body);
      font-size: 0.94em;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
    }
    .intro-desc {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink-soft);
      line-height: 1.55;
      margin-bottom: 0.75rem;
    }
    .intro-desc .q-line.q-en {
      margin-top: 0.35rem;
    }
    .opts label {
      display: block;
      margin: 0.4rem 0;
      padding: 0.65rem 0.85rem;
      border-radius: 16px;
      border: 2px solid rgba(61, 53, 69, 0.2);
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.45;
      transition: border-color 0.15s, background 0.15s;
    }
    .opts label:hover {
      border-color: var(--ink);
      background: rgba(184, 232, 208, 0.35);
    }
    .opts input { margin-right: 0.5rem; vertical-align: middle; }
    .ipa-grid { display: grid; gap: 0.65rem; margin-top: 0.5rem; }
    .ipa-row {
      display: grid;
      grid-template-columns: 2.5rem 1fr;
      gap: 0.5rem;
      align-items: center;
    }
    .ipa-row .letter {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      text-align: center;
      background: var(--peach);
      border-radius: 12px;
      border: 2px solid var(--ink);
      padding: 0.2rem;
    }
    .ipa-row select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border-radius: 12px;
      border: 2px solid var(--ink);
      font-weight: 700;
      font-size: clamp(1.2rem, 4.2vw, 1.55rem);
      font-family: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
      background: #fff;
      line-height: 1.35;
    }
    .ipa-row select option {
      font-size: 1.15rem;
      font-family: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
    }
    #explain-body .ipa-inline {
      font-family: "Noto Sans", "Segoe UI", "Lucida Sans Unicode", sans-serif;
      font-size: 1.2em;
      font-weight: 800;
    }
    .btn {
      font-family: var(--font-body);
      font-weight: 800;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 0.55rem 1.35rem;
      background: linear-gradient(180deg, var(--mint), #9dd9b8);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--shadow);
      font-size: 0.95rem;
      margin-top: 0.85rem;
    }
    .btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
    .btn-secondary { background: linear-gradient(180deg, var(--sky), #8bc8e8); }
    .btn-pink { background: linear-gradient(180deg, var(--blush), #ff7a8c); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.15); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 1rem; }
    .explain {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 248, 220, 0.95), rgba(255, 228, 210, 0.9));
      border: 2px dashed rgba(61, 53, 69, 0.25);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      display: none;
    }
    .explain.show { display: block; }
    .explain h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ok); margin-bottom: 0.35rem; }
    .explain.bad h4 { color: var(--bad); }
    .muted { font-size: 0.82rem; font-weight: 700; color: var(--ink-soft); margin-top: 0.5rem; }
    .section-lab {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 3px dashed rgba(61, 53, 69, 0.15);
    }
    .word-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.65rem 0; }
    .word-tabs button {
      font-weight: 800;
      padding: 0.35rem 0.65rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .word-tabs button.is-on { background: var(--peach); box-shadow: 2px 2px 0 var(--shadow); }
    .letters {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: center;
      gap: 0.08rem;
      margin: 0.65rem 0;
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 6vw, 2.6rem);
    }
    .letters .ch {
      padding: 0.2rem 0.28rem;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--cream);
      cursor: pointer;
      user-select: none;
      min-width: 1.1em;
      text-align: center;
    }
    .letters .ch.vowel-pick { background: var(--peach); }
    .letters .ch.vowel-ans { outline: 3px solid var(--ok); }
    .gap {
      width: clamp(0.5rem, 2.2vw, 0.75rem);
      min-width: 14px;
      align-self: stretch;
      min-height: 2.5rem;
      cursor: pointer;
      border-radius: 6px;
      position: relative;
    }
    .gap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 10%;
      bottom: 10%;
      width: 4px;
      transform: translateX(-50%);
      background: rgba(61, 53, 69, 0.32);
      border-radius: 3px;
    }
    .gap:hover::after {
      width: 6px;
      background: var(--ink);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
    }
    .gap.sel {
      background: rgba(168, 216, 240, 0.85);
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px var(--ink);
    }
    .gap.sel::after {
      width: 8px;
      top: 6%;
      bottom: 6%;
      background: var(--ink);
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 2px 10px rgba(61, 53, 69, 0.35);
    }
    .gap.ok { background: rgba(45, 138, 94, 0.35); }
    .gap.ok::after {
      width: 7px;
      background: var(--ok);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }
    .gap.bad { background: rgba(196, 77, 77, 0.28); }
    .gap.bad::after {
      width: 6px;
      background: var(--bad);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }
    .lab-step { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 2px dashed rgba(61, 53, 69, 0.12); }
    .lab-step h3 { font-size: 0.95rem; margin-bottom: 0.35rem; }
    .score-bar {
      height: 1rem;
      border: 2px solid var(--ink);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      margin: 0.45rem 0;
    }
    .score-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--sky)); width: 0%; transition: width 0.35s ease; }
    .phoneme-grid { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.45rem; }
    .phoneme-grid th, .phoneme-grid td { border: 2px solid var(--ink); padding: 0.22rem 0.3rem; text-align: center; }
    .phoneme-grid th { background: var(--mint); }
    .ph-low { background: rgba(196, 77, 77, 0.12); }
    .ph-mid { background: rgba(255, 154, 168, 0.3); }
    .ph-high { background: rgba(184, 232, 208, 0.55); }
    .rec-pulse {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--bad);
      margin-right: 0.35rem;
      animation: pulse 1s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pass-counter { font-weight: 900; font-size: 0.98rem; color: var(--ok); margin: 0.45rem 0; }
    .pill {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: var(--lilac);
      font-size: 0.72rem;
      font-weight: 800;
      margin-left: 0.35rem;
    }
    .hidden { display: none !important; }
    .word-stage {
      margin: 0.75rem 0;
      padding: 0.65rem 0.5rem;
      border-radius: 20px;
      border: 3px solid var(--ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 248, 240, 0.88));
      box-shadow: 4px 4px 0 var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .word-stage.pulse-ok {
      animation: stage-pop 0.55s ease;
    }
    @keyframes stage-pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.03); box-shadow: 6px 6px 0 var(--mint); }
      100% { transform: scale(1); }
    }
    .ch.vowel-bad-pick {
      background: rgba(196, 77, 77, 0.22) !important;
      border-color: var(--bad) !important;
    }
    .ch.vowel-missed {
      outline: 3px dashed var(--bad);
      outline-offset: 2px;
    }
    .gap.gap-locked {
      opacity: 0.38;
      pointer-events: none;
      cursor: not-allowed;
      filter: grayscale(0.25);
    }
    .lab-hint-line {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--ink-soft);
      margin: 0.35rem 0 0.15rem;
    }
    .lab-step-cue {
      font-size: clamp(0.88rem, 2.8vw, 0.98rem);
      font-weight: 800;
      line-height: 1.55;
      margin: 0 0 0.75rem;
      padding: 0.6rem 0.85rem;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(184, 232, 208, 0.45), rgba(168, 216, 240, 0.35));
      border: 2px solid rgba(61, 53, 69, 0.18);
      color: var(--ink);
    }
    .lab-step-cue strong { color: var(--ink); }
    .lab-read-block.hidden-until-gap { display: none; }
    .lab-read-block.visible { display: block; }
    .lab-word-ref {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-soft);
      text-align: center;
      margin: -0.35rem 0 0.5rem;
    }
    .lab-progress {
      font-weight: 900;
      font-size: 0.95rem;
      text-align: center;
      margin: 0.2rem 0 0.65rem;
      color: var(--ink);
    }
    .reading-score-highlight {
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 4vw, 1.55rem);
      font-weight: 800;
      text-align: center;
      margin: 0.5rem 0 0.35rem;
      padding: 0.45rem 0.65rem;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(184, 232, 208, 0.65), rgba(168, 216, 240, 0.5));
      border: 2px solid var(--ink);
    }
    .lab-all-done {
      text-align: center;
      padding: 1rem 0.5rem;
    }
    .lab-all-done .big { font-size: 1.2rem; font-weight: 900; margin-bottom: 0.5rem; }
    .lab-all-done .btn-start-dict {
      margin-top: 0.85rem;
    }
    .hw-report {
      text-align: left;
      max-width: 100%;
      margin: 0 auto;
    }
    .hw-report-title {
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 3.8vw, 1.45rem);
      font-weight: 900;
      text-align: center;
      margin-bottom: 0.85rem;
      color: var(--ink);
    }
    .hw-report-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }
    .hw-report-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 248, 240, 0.9));
      border: 2px solid var(--ink);
      border-radius: 16px;
      padding: 0.55rem 0.65rem;
      box-shadow: 3px 3px 0 var(--shadow);
    }
    .hw-report-card .lbl {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      margin-bottom: 0.2rem;
    }
    .hw-report-card .val {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.35;
    }
    .hw-report-foot {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      line-height: 1.55;
      text-align: center;
      margin-top: 0.35rem;
    }
    .dict-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
      margin: 0.75rem 0;
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 5vw, 1.95rem);
      font-weight: 800;
    }
    .dict-slot {
      width: 1.2em;
      min-width: 1.75rem;
      height: 1.45em;
      border: 3px solid var(--ink);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      text-transform: lowercase;
    }
    .dict-slot.empty { color: rgba(61, 53, 69, 0.22); }
    .dict-keyboard {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 0.32rem;
      width: 100%;
      max-width: 100%;
      margin: 0.55rem 0 0.35rem;
    }
    @media (max-width: 540px) {
      .dict-keyboard { grid-template-columns: repeat(7, 1fr); }
    }
    .dict-key {
      font-family: var(--font-body);
      font-weight: 800;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 0.42rem 0.15rem;
      background: linear-gradient(180deg, #fff, var(--cream));
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .dict-key:hover { filter: brightness(1.03); }
    .dict-key:active { transform: translateY(1px); }
    .dict-key:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .dict-feedback {
      margin-top: 0.65rem;
      padding: 0.65rem 0.85rem;
      border-radius: 16px;
      font-weight: 800;
      font-size: 0.92rem;
      text-align: center;
      display: none;
    }
    .dict-feedback.show { display: block; }
    .dict-feedback.ok {
      background: rgba(184, 232, 208, 0.55);
      border: 2px solid var(--ok);
      color: var(--ink);
    }
    .dict-feedback.bad {
      background: rgba(196, 77, 77, 0.15);
      border: 2px solid var(--bad);
      color: var(--ink);
    }
    .teacher-toolbar {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 0.65rem;
      padding: 0.55rem 0.75rem;
      border-radius: 16px;
      border: 2px dashed rgba(61, 53, 69, 0.22);
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 800;
    }
    body.teacher-mode .teacher-toolbar {
      border-color: rgba(61, 53, 69, 0.45);
      background: rgba(212, 196, 247, 0.35);
    }
    .teacher-toolbar .teacher-only {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem 0.65rem;
      flex: 1;
      min-width: 0;
    }
    body.teacher-mode .teacher-toolbar .teacher-only {
      display: flex;
    }
    .teacher-toolbar label.chk-teach {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      user-select: none;
    }
    .teacher-toolbar select {
      flex: 1;
      min-width: 12rem;
      padding: 0.4rem 0.5rem;
      border-radius: 10px;
      border: 2px solid var(--ink);
      font-weight: 700;
      font-size: 0.8rem;
    }
    .teacher-toolbar .btn-tiny {
      font-family: var(--font-body);
      font-weight: 800;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 0.35rem 0.65rem;
      background: var(--lilac);
      cursor: pointer;
      font-size: 0.78rem;
    }
    .teacher-toolbar .btn-tiny:hover { filter: brightness(1.05); }
    .dots.teacher-on i { cursor: pointer; }
    .dots.teacher-on i:hover { transform: scale(1.5); background: var(--sky) !important; }
    .opts label.opt-label {
      display: flex;
      align-items: flex-start;
      gap: 0.4rem;
    }
    .opts label.opt-label input { margin-top: 0.35rem; flex-shrink: 0; }
    .opt-letter { flex-shrink: 0; font-weight: 800; padding-top: 0.15rem; }
    .opt-body { flex: 1; min-width: 0; }
    .opt-body .opt-line-opt { display: block; line-height: 1.45; }
    .opt-body .opt-line-opt.opt-en {
      font-weight: 700;
      font-size: 0.92rem;
    }
    .opt-body .opt-line-opt.opt-zh {
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--ink-soft);
      margin-top: 0.2rem;
    }
  </style>
  <link rel="stylesheet" href="../../scripts/drawing-overlay.css?v=1" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <h1>🌸 课后作业 · 闭音节</h1>
      <p id="hero-sub">一题一页 · 提交后查看解析 · 对应课件 The Magic of Syllables · 闭音节</p>
    </header>

    <div class="teacher-toolbar" id="teacher-toolbar" aria-label="教师模式工具栏">
      <label class="chk-teach" title="需输入密码验证"><input type="checkbox" id="chk-teacher" />教师模式（密码）</label>

                return a + b;

            : null;
        var vowels = lab.filter(function (e) {
          return e.step === "vowel_submit";
        });
        var vowelOk = 0;
        vowels.forEach(function (e) {
          if (e.vowelCorrect) vowelOk++;
        });
        var gaps = lab.filter(function (e) {
          return e.step === "gap_submit";
        });
        var gapOk = 0;
        gaps.forEach(function (e) {
          if (e.gapCorrect) gapOk++;
        });
        var dict = log.dictationEvents || [];
        var subs = dict.filter(function (e) {
          return e.step === "dictation_submit";
        });
        var dictCorrect = 0;
        subs.forEach(function (e) {
          if (e.correct) dictCorrect++;
        });
        return {
          deckTotal: deckQuiz.length,
          deckCorrect: deckCorrect,
          readCount: reads.length,
          readPass80: readPass80,
          avgPron: avgPron,
          vowelOk: vowelOk,
          vowelTotal: vowels.length,
          gapOk: gapOk,
          gapTotal: gaps.length,
          dictTotal: subs.length,
          dictCorrect: dictCorrect,
          startedAt: log.startedAt || "",
          runId: log.runId || ""
        };
      }

      function normalizeMcOption(opt) {
        if (opt == null) return { en: "", zh: "" };
        if (typeof opt === "string") return { en: opt, zh: "" };
        if (typeof opt === "object") {
          return {
            en: opt.en != null ? String(opt.en) : "",
            zh: opt.zh != null ? String(opt.zh) : ""
          };
        }
        return { en: String(opt), zh: "" };

          o.zh +

      function shuffleInPlace(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      var LAB_WORDS = LAB_POOL.slice(0, Math.min(LAB_WORD_TOTAL, LAB_POOL.length));

          var ii = DICTATION_LAB_INDICES[d];
          if (ii >= 0 && ii < LAB_WORDS.length) out.push(LAB_WORDS[ii]);
        }
        if (!out.length) {
          var cap = Math.min(8, LAB_WORDS.length);
          for (var j = 0; j < cap; j++) out.push(LAB_WORDS[j]);
        }
        return out;
      }
      var DICTATION_WORDS = buildDictationWords();

      /** 打乱选择题选项，返回 { labels, correctIdx }；labels 为 { en, zh } */
      function shuffleMcOptions(item) {
        var pairs = item.options.map(function (opt, i) {
          return { opt: normalizeMcOption(opt), isAns: i === item.correct };
        });
        shuffleInPlace(pairs);
        var correctIdx = -1;
        for (var k = 0; k < pairs.length; k++) {
          if (pairs[k].isAns) correctIdx = k;
        }
        return {
          labels: pairs.map(function (p) {
            return p.opt;
          }),
          correctIdx: correctIdx
        };
      }

      function speakAzure(text) {
        var vn = AEN;
        var tLive = String(text || "").trim();
        var tKey = tLive.toLowerCase();
        if (typeof window !== "undefined" && window.hasLocalTtsMp3 && window.hasLocalTtsMp3(tKey, vn)) {
          return window.playLocalTtsMp3(tKey, vn).catch(function () {
            return speakAzureLive(tLive);
          });
        }
        return speakAzureLive(tLive);
      }

      function speakWithBrowserTts(text) {
        return new Promise(function (resolve, reject) {
          if (!window.speechSynthesis || typeof SpeechSynthesisUtterance !== "function") {
            reject(new Error("browser tts unavailable"));
            return;
          }
          try { speechSynthesis.cancel(); } catch (e) {}
          var u = new SpeechSynthesisUtterance(String(text || ""));
          u.lang = "en-GB";
          u.rate = 0.9;
          u.onend = function () { resolve(); };
          u.onerror = function () { reject(new Error("browser tts failed")); };
          speechSynthesis.speak(u);
        });
      }

      function speakAzureLive(text) {
        return new Promise(function (resolve, reject) {
          function fallback() {
            speakWithBrowserTts(text).then(resolve).catch(reject);
          }
          if (typeof SpeechSDK === "undefined") {
            fallback();
            return;
          }
          var lastErr = null;
          var keys = getAzureKeys();
          var region = getAzureRegion();
          function tryKey(ki) {
            if (ki >= keys.length) {
              console.warn("Azure TTS failed, falling back to browser", lastErr);
              fallback();
              return;
            }
            var sc = SpeechSDK.SpeechConfig.fromSubscription(keys[ki], region);
            sc.speechSynthesisVoiceName = AEN;
            var syn = new SpeechSDK.SpeechSynthesizer(sc, undefined);
            syn.speakTextAsync(
              text,
              function (r) {
                try { syn.close(); } catch (e) {}
                if (r.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted) resolve();
                else {
                  lastErr = new Error(r.errorDetails || "fail");
                  tryKey(ki + 1);
                }
              },
              function (err) {
                try { syn.close(); } catch (e2) {}
                lastErr = err;
                tryKey(ki + 1);
              }
            );
          }
          tryKey(0);
        });
      }

      function numOr0(v) {
        var n = Number(v);
        return n > 0 || v === 0 ? n : 0;
      }

      /** Azure PA JSON 常把分放在 PronunciationAssessment.AccuracyScore / PronScore，而非顶层 */
      function extractAssessmentScore(obj) {
        if (obj == null || typeof obj !== "object") return null;
        var pa = obj.PronunciationAssessment || obj.pronunciationAssessment;
        var order = ["AccuracyScore", "PronScore", "PronunciationScore", "accuracyScore", "pronScore", "pronunciationScore", "FluencyScore"];
        for (var i = 0; i < order.length; i++) {
          var k = order[i];
          if (obj[k] != null && obj[k] !== "") {
            var n = Number(obj[k]);
            if (!isNaN(n)) return n;
          }
        }
        if (pa && typeof pa === "object") {
          for (var j = 0; j < order.length; j++) {
            var k2 = order[j];
            if (pa[k2] != null && pa[k2] !== "") {
              var n2 = Number(pa[k2]);
              if (!isNaN(n2)) return n2;
            }
          }
        }
        return null;
      }

      function scoreFromWordOrPhoneme(obj) {
        var s = extractAssessmentScore(obj);
        return s != null ? s : 0;
      }

      function phonemeSymbol(p) {
        if (!p || typeof p !== "object") return "";
        return (
          p.Phoneme ||
          p.phoneme ||
          p.Phone ||
          p.phone ||
          p.IPA ||
          p.ipa ||
          p.Display ||
          ""
        );
      }

      function collectPhonemeRowsFromWord(w) {
        var raw = w.Phonemes || w.phonemes;
        if (raw && raw.length) {
          return raw.map(function (p) {
            return { ph: phonemeSymbol(p), score: scoreFromWordOrPhoneme(p) };
          });
        }
        var sylls = w.Syllables || w.syllables;
        if (!sylls || !sylls.length) return [];
        var out = [];
        sylls.forEach(function (sy) {
          var ps = sy.Phonemes || sy.phonemes || [];
          ps.forEach(function (p) {
            out.push({ ph: phonemeSymbol(p), score: scoreFromWordOrPhoneme(p) });
          });
        });
        return out;
      }

      function wordRowFromApiWord(w) {
        if (!w) return null;
        var wordText = w.Word || w.word || "";
        var wScore = extractAssessmentScore(w);
        if (wScore === null || wScore === undefined || isNaN(wScore)) {
          var n1 = Number(w.PronunciationScore != null ? w.PronunciationScore : w.pronunciationScore);
          var n2 = Number(w.AccuracyScore != null ? w.AccuracyScore : w.accuracyScore);
          if (!isNaN(n1)) wScore = n1;
          else if (!isNaN(n2)) wScore = n2;
          else wScore = 0;
        }
        return {
          word: wordText,
          score: wScore,
          phonemes: collectPhonemeRowsFromWord(w)
        };
      }

      function deepFindPronAssessment(obj, depth) {
        if (!obj || typeof obj !== "object" || depth > 10) return null;
        if (obj.PronunciationAssessment && typeof obj.PronunciationAssessment === "object") return obj.PronunciationAssessment;
        if (obj.pronunciationAssessment && typeof obj.pronunciationAssessment === "object") return obj.pronunciationAssessment;
        if (obj.PronScore != null || obj.AccuracyScore != null || obj.pronScore != null) return obj;
        for (var k in obj) {
          if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
          var f = deepFindPronAssessment(obj[k], depth + 1);
          if (f && (f.PronScore != null || f.AccuracyScore != null || f.pronScore != null)) return f;
        }
        return null;
      }

      function applySpeechRecognitionTimeouts(sc) {
        try {
          sc.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs, "15000");
          sc.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, "4000");
        } catch (eT) {}
        try {
          if (SpeechSDK.OutputFormat && SpeechSDK.OutputFormat.Detailed != null) {
            sc.outputFormat = SpeechSDK.OutputFormat.Detailed;
          }
        } catch (eO) {}
      }

      function parsePronunciationJson(result) {
        var words = [];
        var overall = { pron: 0, accuracy: 0, fluency: 0, completeness: 0 };
        if (result && result.__browserFallback) {
          var sc0 = Math.max(0, Math.min(100, Number(result.__matchScore) || 0));
          return {
            overall: { pron: sc0, accuracy: sc0, fluency: sc0, completeness: sc0 },
            words: [{ word: result.text || "", score: sc0, phonemes: [] }]
          };
        }
        try {
          if (SpeechSDK.PronunciationAssessmentResult && SpeechSDK.PronunciationAssessmentResult.fromResult) {
            var pa = SpeechSDK.PronunciationAssessmentResult.fromResult(result);
            overall.pron = numOr0(pa.pronunciationScore) || numOr0(pa.pronScore);
            overall.accuracy = numOr0(pa.accuracyScore);
            overall.fluency = numOr0(pa.fluencyScore);
            overall.completeness = numOr0(pa.completenessScore);
            var detail = pa.detailResult;
            if (typeof detail === "string") {
              try {
                detail = JSON.parse(detail);
              } catch (eD) {
                detail = null;
              }
            }
            if (detail && detail.Words && detail.Words.length) {
              words = detail.Words.map(wordRowFromApiWord).filter(function (r) {
                return r && (r.word || r.phonemes.length);
              });
            }
          }
        } catch (e1) {}

        try {
          var jsonStr = result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult);
          if (!jsonStr) jsonStr = result.properties.getProperty("JsonResult");
          if (!jsonStr && result.json) jsonStr = typeof result.json === "string" ? result.json : JSON.stringify(result.json);
          if (!jsonStr) {
            if (overall.pron || overall.accuracy) return { overall: overall, words: words };
            return { overall: overall, words: words };
          }
          var jo = JSON.parse(jsonStr);
          var nb = (jo.NBest && jo.NBest[0]) || (jo.nBest && jo.nBest[0]) || jo;
          var p = (nb && (nb.PronunciationAssessment || nb.pronunciationAssessment)) || deepFindPronAssessment(jo, 0);
          if (p) {
            if (!overall.pron) overall.pron = numOr0(p.PronScore) || numOr0(p.pronunciationScore) || numOr0(p.pronScore);
            if (!overall.accuracy) overall.accuracy = numOr0(p.AccuracyScore) || numOr0(p.accuracyScore);
            if (!overall.fluency) overall.fluency = numOr0(p.FluencyScore) || numOr0(p.fluencyScore);
            if (!overall.completeness) overall.completeness = numOr0(p.CompletenessScore) || numOr0(p.completenessScore);
            var nested = p.PronunciationAssessment || p.pronunciationAssessment;
            if (nested && typeof nested === "object") {
              if (!overall.pron) overall.pron = extractAssessmentScore(p) || overall.pron;
              if (!overall.accuracy) overall.accuracy = numOr0(nested.AccuracyScore) || overall.accuracy;
            }
          }
          var wlist = (nb && (nb.Words || nb.words)) || [];
          if (wlist.length) {
            var fromJson = wlist
              .map(wordRowFromApiWord)
              .filter(function (r) {
                return r && (r.word || r.phonemes.length);
              });
            if (fromJson.length) words = fromJson;
          }
        } catch (e2) {}

        if (!overall.pron && overall.accuracy) overall.pron = overall.accuracy;
        return { overall: overall, words: words };
      }

      function scoreClass(s) {
        if (s >= 85) return "ph-high";
        if (s >= 60) return "ph-mid";
        return "ph-low";
      }

      function ensureMicrophoneAccess() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          return Promise.reject(new Error("当前浏览器不支持麦克风。请使用 Chrome / Edge，并允许网站录音权限。"));
        }
        return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          try {
            stream.getTracks().forEach(function (t) { t.stop(); });
          } catch (e) {}
        });
      }

      function normalizeWordForMatch(s) {
        return String(s || "")
          .toLowerCase()
          .replace(/[^a-z']/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function browserMatchScore(referenceWord, transcript) {
        var ref = normalizeWordForMatch(referenceWord);
        var hyp = normalizeWordForMatch(transcript);
        if (!ref || !hyp) return 0;
        if (ref === hyp) return 92;
        if (hyp.indexOf(ref) >= 0 || ref.indexOf(hyp) >= 0) return 78;
        // simple edit distance ratio
        var a = ref, b = hyp;
        var m = a.length, n = b.length;
        var dp = [];
        for (var i = 0; i <= m; i++) {
          dp[i] = [i];
          for (var j = 1; j <= n; j++) dp[i][j] = i === 0 ? j : 0;
        }
        for (i = 1; i <= m; i++) {
          for (j = 1; j <= n; j++) {
            var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
            dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
          }
        }
        var dist = dp[m][n];
        var ratio = 1 - dist / Math.max(m, n, 1);
        return Math.max(0, Math.round(ratio * 100));
      }

      function beginBrowserPronunciationSession(referenceWord, onStarted, onFail) {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          onFail(new Error("Azure 录音不可用，且本浏览器不支持语音识别。请换 Chrome/Edge，或更新 Azure 密钥。"));
          return;
        }
        try {
          var rec = new SR();
          rec.lang = "en-GB";
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;
          state.labLastResult = null;
          state.labBrowserTranscript = "";
          state.labReferenceWord = referenceWord;
          rec.onresult = function (ev) {
            var text = "";
            for (var i = 0; i < ev.results.length; i++) {
              text += ev.results[i][0].transcript || "";
            }
            state.labBrowserTranscript = String(text || "").trim();
          };
          rec.onerror = function (ev) {
            console.warn("browser speech error", ev && ev.error);
          };
          rec.onstart = function () {
            state.activeRecognizer = { __browser: true, rec: rec };
            state.listening = true;
            onStarted();
          };
          rec.start();
        } catch (err) {
          onFail(err || new Error("无法启动浏览器录音"));
        }
      }

      /** 长词实验室：连续识别，由学生点「开始录音」→ 朗读 →「结束录音并评测」 */
      function beginLabPronunciationSession(referenceWord, onStarted, onFail) {
        state.labLastResult = null;
        state.labBrowserTranscript = "";
        state.labReferenceWord = referenceWord;
        ensureMicrophoneAccess()
          .then(function () {
            if (typeof SpeechSDK === "undefined") {
              beginBrowserPronunciationSession(referenceWord, onStarted, onFail);
              return;
            }
            var keys = getAzureKeys();
            var region = getAzureRegion();
            if (!keys.length) {
              beginBrowserPronunciationSession(referenceWord, onStarted, onFail);
              return;
            }
            var ki = 0;
            var lastErr = null;
            function tryKey() {
              if (ki >= keys.length) {
                console.warn("Azure recording failed, falling back to browser STT", lastErr);
                beginBrowserPronunciationSession(referenceWord, onStarted, onFail);
                return;
              }
              try {
                var sc = SpeechSDK.SpeechConfig.fromSubscription(keys[ki], region);
                sc.speechRecognitionLanguage = "en-GB";
                applySpeechRecognitionTimeouts(sc);
                var audio = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
                var recognizer = new SpeechSDK.SpeechRecognizer(sc, audio);
                var pa = new SpeechSDK.PronunciationAssessmentConfig(
                  referenceWord,
                  SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
                  SpeechSDK.PronunciationAssessmentGranularity.Phoneme,
                  true
                );
                if (typeof pa.enableProsodyAssessment === "function") pa.enableProsodyAssessment();
                pa.applyTo(recognizer);
                recognizer.recognized = function (s, e) {
                  if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
                    state.labLastResult = e.result;
                  }
                };
                recognizer.startContinuousRecognitionAsync(
                  function () {
                    state.activeRecognizer = recognizer;
                    state.listening = true;
                    onStarted();
                  },
                  function (err) {
                    lastErr = err;
                    try { recognizer.close(); } catch (e0) {}
                    ki++;
                    tryKey();
                  }
                );
              } catch (err2) {
                lastErr = err2;
                ki++;
                tryKey();
              }
            }
            tryKey();
          })
          .catch(function (err) {
            var msg = (err && err.message) || "";
            var name = (err && err.name) || "";
            if (name === "NotAllowedError" || /permission|denied/i.test(msg)) {
              onFail(new Error("麦克风权限被拒绝。请点击地址栏锁图标，允许本站使用麦克风后重试。"));
            } else if (name === "NotFoundError" || /device not found|no.*microphone/i.test(msg)) {
              onFail(new Error("未检测到麦克风设备。请接入麦克风后重试，或换一台有麦克风的电脑/平板。"));
            } else if (name === "NotReadableError") {
              onFail(new Error("麦克风被其他程序占用。请关闭其他占用麦克风的应用后重试。"));
            } else {
              onFail(new Error("无法使用麦克风：" + (msg || "请允许麦克风权限后重试。")));
            }
          });
      }

      function endLabPronunciationSession(onDone) {
        var rec = state.activeRecognizer;
        if (!rec) {
          onDone(new Error("当前未在录音。"));
          return;
        }
        state.activeRecognizer = null;
        if (rec.__browser) {
          try { rec.rec.stop(); } catch (eB) {}
          state.listening = false;
          var transcript = state.labBrowserTranscript || "";
          var score = browserMatchScore(state.labReferenceWord || "", transcript);
          if (!transcript) {
            onDone(new Error("未识别到语音。请再试：先点「开始录音」，朗读后点「结束录音并评测」。"));
            return;
          }
          onDone(null, {
            text: transcript,
            __browserFallback: true,
            __matchScore: score,
            properties: { getProperty: function () { return null; } }
          });
          return;
        }
        var saved = rec;
        saved.stopContinuousRecognitionAsync(
          function () {
            state.listening = false;
            try { saved.close(); } catch (e1) {}
            var r = state.labLastResult;
            state.labLastResult = null;
            if (r) onDone(null, r);
            else {
              onDone(new Error("未识别到语音。请再试：先点「开始录音」，朗读后点「结束录音并评测」。"));
            }
          },
          function (err) {
            state.listening = false;
            try { saved.close(); } catch (e2) {}
            onDone(err || new Error("结束录音失败"));
          }
        );
      }

      function stopAssessmentEarly() {
        var rec = state.activeRecognizer;
        if (!rec) {
          state.listening = false;
          return;
        }
        state.activeRecognizer = null;
        state.labLastResult = null;
        if (rec.__browser) {
          try { rec.rec.stop(); } catch (eB2) {}
          state.listening = false;
          return;
        }
        try {
          rec.stopContinuousRecognitionAsync(
            function () {
              state.listening = false;
              try { rec.close(); } catch (e3) {}
            },
            function () {
              state.listening = false;
              try { rec.close(); } catch (e4) {}
            }
          );
        } catch (e5) {
          try { rec.close(); } catch (e6) {}
          state.listening = false;
        }
      }

                : "分数已出。请先点「TTS 示范跟读」听标准发音，再点「下一词」查看完成页。";

      function initLab() {
        var tabs = document.getElementById("word-tabs");
        tabs.innerHTML = "";
        if (teacherMode) {
          tabs.style.display = "flex";
          LAB_WORDS.forEach(function (meta, i) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = meta.word;
            if (i === state.wordIndex) b.classList.add("is-on");
            b.addEventListener("click", function () {
              state.wordIndex = i;
              state.labAdvancing = false;
              tabs.querySelectorAll("button").forEach(function (x, j) {
                x.classList.toggle("is-on", j === i);
              });
              renderLab();
            });
            tabs.appendChild(b);
          });
        } else {
          tabs.style.display = "none";
        }
        renderLab();
      }

      function startDictationPhase() {
        dictationOpened = true;
        document.getElementById("lab-section").classList.add("hidden");
        document.getElementById("dictation-section").classList.remove("hidden");
        state.dictationIndex = 0;
        state.dictationCompleteLogged = false;
        state.dictationAdvancing = false;
        var hp = document.getElementById("hero-sub");
        if (hp) hp.textContent = "听写练习 · 听 TTS 后点击字母拼写";
        logDictationEvent({
          step: "lab_to_dictation",
          dictationWordCount: DICTATION_WORDS.length,
          words: DICTATION_WORDS.map(function (m) {
            return m.word;
          })
        });
        initDictation();
      }

      function initDictation() {
        var tabs = document.getElementById("dict-tabs");
        if (!tabs) return;
        tabs.innerHTML = "";
        if (teacherMode) {
          tabs.classList.remove("hidden");
          tabs.style.display = "flex";
          DICTATION_WORDS.forEach(function (meta, i) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = String(i + 1);
            b.setAttribute("title", "教师跳转 · 第 " + (i + 1) + " 题：" + meta.word);
            b.setAttribute("aria-label", "跳到听写第 " + (i + 1) + " 题");
            if (i === state.dictationIndex) b.classList.add("is-on");
            b.addEventListener("click", function () {
              state.dictationIndex = i;
              state.dictationAdvancing = false;
              tabs.querySelectorAll("button").forEach(function (x, j) {
                x.classList.toggle("is-on", j === i);
              });
              renderDictation();
            });
            tabs.appendChild(b);
          });
        } else {
          tabs.classList.add("hidden");
          tabs.style.display = "";
        }
        renderDictation();
      }

      function renderDictation() {
        var root = document.getElementById("dict-root");
        var dp = document.getElementById("dict-progress");
        if (!root || !dp) return;
        root.innerHTML = "";
        if (state.dictationIndex >= DICTATION_WORDS.length) {
          dp.textContent = "听写 · 已全部完成 · 请看下方学习报告";
          root.innerHTML = buildHwReportHtml();
          if (!state.dictationCompleteLogged) {
            state.dictationCompleteLogged = true;
            logDictationEvent({ step: "dictation_all_complete", totalWords: DICTATION_WORDS.length });
          }
          var hp = document.getElementById("hero-sub");
          if (hp) hp.textContent = "已完成 · 学习小结见下方";
          return;
        }

        var meta = DICTATION_WORDS[state.dictationIndex];
        var w = meta.word;
        var pageEnteredAt = Date.now();
        dp.textContent =
          "听写 " +
          (state.dictationIndex + 1) +
          " / " +
          DICTATION_WORDS.length +
          " · 听 TTS 后凭记忆拼写";

        logDictationEvent({
          step: "dictation_word_enter",
          word: w,
          dictIndex: state.dictationIndex,
          expectedLength: w.length
        });

        var cue = document.createElement("p");
        cue.className = "lab-step-cue";
        cue.innerHTML =
          "<strong>听写步骤</strong> · ① 点 <strong>TTS 朗读</strong> 听单词 · ② 点击下方字母依次拼写（可点「删一格」改错）· ③ 点 <strong>提交</strong> 判对错 · 随后自动进入下一词。";
        root.appendChild(cue);

        var answer = "";

        var slotRow = document.createElement("div");
        slotRow.className = "dict-slots";
        slotRow.setAttribute("aria-label", "拼写格子");
        function redrawSlots() {
          slotRow.innerHTML = "";
          var i;
          for (i = 0; i < w.length; i++) {
            (function (ix) {
              var s = document.createElement("span");
              s.className = "dict-slot" + (ix >= answer.length ? " empty" : "");
              s.textContent = ix < answer.length ? answer[ix] : "·";
              slotRow.appendChild(s);
            })(i);
          }
        }
        redrawSlots();
        root.appendChild(slotRow);

        var rowTop = document.createElement("div");
        rowTop.className = "btn-row";
        rowTop.style.marginTop = "0.35rem";
        var btnTts = document.createElement("button");
        btnTts.type = "button";
        btnTts.className = "btn btn-pink";
        btnTts.textContent = "🔊 TTS 朗读单词";
        rowTop.appendChild(btnTts);
        root.appendChild(rowTop);

        var kb = document.createElement("div");
        kb.className = "dict-keyboard";
        var letters = "abcdefghijklmnopqrstuvwxyz".split("");
        var letterBtns = [];
        function setKbDisabled(dis) {
          letterBtns.forEach(function (b) {
            b.disabled = dis;
          });
          btnBack.disabled = dis;
          btnSubmit.disabled = dis;
          btnTts.disabled = dis;
        }

        letters.forEach(function (ch) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "dict-key";
          b.textContent = ch.toUpperCase();
          b.addEventListener("click", function () {
            if (state.dictationAdvancing || roundSubmitted) return;
            if (answer.length >= w.length) return;
            answer += ch;
            redrawSlots();
          });
          kb.appendChild(b);
          letterBtns.push(b);
        });
        root.appendChild(kb);

        var rowAct = document.createElement("div");
        rowAct.className = "btn-row";
        var btnBack = document.createElement("button");
        btnBack.type = "button";
        btnBack.className = "btn btn-secondary";
        btnBack.textContent = "删一格";
        var btnSubmit = document.createElement("button");
        btnSubmit.type = "button";
        btnSubmit.className = "btn";
        btnSubmit.textContent = "提交";
        rowAct.appendChild(btnBack);
        rowAct.appendChild(btnSubmit);
        root.appendChild(rowAct);

        var fb = document.createElement("div");
        fb.className = "dict-feedback";
        fb.id = "dict-feedback";
        root.appendChild(fb);

        var roundSubmitted = false;

        btnBack.addEventListener("click", function () {
          if (state.dictationAdvancing || roundSubmitted) return;
          if (!answer.length) return;
          answer = answer.slice(0, -1);
          redrawSlots();
        });

        btnTts.addEventListener("click", function () {
          if (state.dictationAdvancing || btnTts.disabled) return;
          logDictationEvent({
            step: "dictation_tts",
            word: w,
            dictIndex: state.dictationIndex
          });
          speakAzure(w).catch(function (err) {
            console.warn("dictation TTS", w, err);
            alert("TTS 失败，请检查密钥或网络，或用本地服务器打开页面。\n" + ((err && err.message) || ""));
          });
        });

        btnSubmit.addEventListener("click", function () {
          if (state.dictationAdvancing || roundSubmitted) return;
          if (answer.length !== w.length) {
            fb.className = "dict-feedback show bad";
            fb.textContent = "请填满所有拼写格子后再提交。";
            return;
          }
          roundSubmitted = true;
          var ok = wordKey(answer) === wordKey(w);
          var durationMs = Date.now() - pageEnteredAt;
          logDictationEvent({
            step: "dictation_submit",
            word: w,
            dictIndex: state.dictationIndex,
            studentAnswer: answer,
            correct: ok,
            durationMs: durationMs
          });
          fb.className = "dict-feedback show " + (ok ? "ok" : "bad");
          fb.textContent = ok
            ? "✓ 拼写正确！即将进入下一词…"
            : teacherMode
              ? "未完全正确 · 参考拼写：" + w + " · 即将进入下一词…"
              : "未完全正确。可回想刚才的朗读再核对，即将进入下一词…";
          setKbDisabled(true);
          state.dictationAdvancing = true;
          var nextI = state.dictationIndex + 1;
          setTimeout(function () {
            state.dictationAdvancing = false;
            state.dictationIndex = nextI;
            initDictation();
          }, 2200);
        });
      }

      document.getElementById("dots").addEventListener("click", function (e) {
        if (!teacherMode) return;
        var t = e.target;
        if (t.tagName !== "I") return;
        var children = [].slice.call(e.currentTarget.children);
        var ii = children.indexOf(t);
        if (ii >= 0) jumpToDeck(ii);
      });

      (function initTeacherUi() {

        }

          }
        }
        chk.addEventListener("change", function () {
          if (chk.checked) {
            var pw = prompt("请输入教师密码");
            if (pw !== TEACHER_PASSWORD) {
              chk.checked = false;
              alert("密码错误，无法开启教师模式。");
              return;
            }
            persistTeacher(true);
            setTeacherMode(true);
          } else {
            persistTeacher(false);
            setTeacherMode(false);
          }
        });
        sel.addEventListener("change", function () {
          jumpToDeck(Number(sel.value));
        });
        document.getElementById("teacher-prev").addEventListener("click", function () {
          jumpToDeck(idx - 1);
        });
        document.getElementById("teacher-next").addEventListener("click", function () {
          jumpToDeck(idx + 1);
        });
        document.getElementById("teacher-lab").addEventListener("click", function () {
          finishDeck();
        });
        document.getElementById("teacher-dict").addEventListener("click", function () {
          document.getElementById("deck-card").classList.add("hidden");
          document.querySelector(".progress-wrap").classList.add("hidden");
          document.getElementById("lab-section").classList.add("hidden");
          dictationOpened = true;
          labOpened = true;
          state.dictationIndex = 0;
          state.dictationCompleteLogged = false;
          state.dictationAdvancing = false;
          var hp2 = document.getElementById("hero-sub");
          if (hp2) hp2.textContent = "教师预览 · 听写测验";
          document.getElementById("dictation-section").classList.remove("hidden");
          logDictationEvent({
            step: "teacher_open_dictation",
            dictationWordCount: DICTATION_WORDS.length
          });
          initDictation();
        });
        if (teacherStorageOk()) {
          chk.checked = true;
          setTeacherMode(true);
        }
        fillTeacherJump();
      })();

      renderDeck();
    })();
  </script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
