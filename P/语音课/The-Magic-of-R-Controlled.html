<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Magic of Syllables — R-Controlled · Bossy R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fffdd0;
      --pink: #ffb7b2;
      --mint: #b2e2f2;
      --lilac: #d1d1f7;
      --ink: #3d3a45;
      --ink-soft: #6b6578;
      --white: #fffef8;
      --shadow: rgba(61, 58, 69, 0.18);
      --rc-accent: #7e57c2;
      --rc-accent-dark: #4527a0;
      --vowel-red: #c62828;
      --font-display: "Comic Sans MS", "Finger Paint", "Comic Neue", cursive, sans-serif;
      --font-body: "Comic Sans MS", "Comic Neue", system-ui, sans-serif;
      /* 所有页白底卡片统一最大宽度，避免翻页时宽窄不一 */
      --slide-card-max: min(100%, 58rem);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      font-weight: 400;
      color: var(--ink);
      background: var(--cream);
      background-image:
        repeating-linear-gradient(125deg, rgba(255, 183, 178, 0.22) 0 2px, transparent 2px 14px),
        repeating-linear-gradient(-125deg, rgba(178, 226, 242, 0.25) 0 2px, transparent 2px 18px),
        radial-gradient(ellipse 90% 70% at 15% 20%, rgba(209, 209, 247, 0.45), transparent 55%),
        radial-gradient(ellipse 80% 50% at 85% 75%, rgba(255, 253, 208, 0.9), transparent 50%);
      overflow: hidden;
    }
    .deck {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.6rem 0.85rem 0.4rem;
    }
    /* 占满导航条上方剩余高度，避免每页内容多少不同导致白框高度忽大忽小 */
    #slides-mount {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
    }
    .slide {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 0.5rem 0.15rem;
      animation: slideIn 0.45s ease;
    }
    .slide.active {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-inner {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: var(--slide-card-max);
      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--white);
      border: 4px solid var(--ink);
      border-radius: 28px 18px 32px 22px / 22px 28px 20px 30px;
      box-shadow: 6px 6px 0 var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      padding: clamp(0.85rem, 2.5vw, 1.6rem);
      position: relative;
      background-image:
        repeating-linear-gradient(135deg, transparent, transparent 10px, rgba(61, 58, 69, 0.04) 10px, rgba(61, 58, 69, 0.04) 11px),
        repeating-linear-gradient(-55deg, transparent, transparent 16px, rgba(255, 183, 178, 0.08) 16px, rgba(255, 183, 178, 0.08) 17px);
    }
    .slide-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 4.5vw, 2rem);
      text-align: center;
      color: var(--ink);
      margin-bottom: 0.4rem;
      text-shadow: 2px 2px 0 var(--pink), 4px 4px 0 rgba(178, 226, 242, 0.6);
      line-height: 1.15;
    }
    /* Magic E「Let’s Practice Together」英文主标题 */
    .slide-inner.cact-lesson .slide-title-lp {
      font-size: clamp(1.15rem, 3.6vw, 1.65rem);
      margin-bottom: 0.3rem;
    }
    .rc-demo-kicker {
      text-align: center;
      font-size: clamp(0.78rem, 2vw, 0.9rem);
      font-weight: 700;
      color: var(--ink-soft);
      margin: -0.15rem 0 0.2rem;
      line-height: 1.4;
    }
    .slide-sub {
      text-align: center;
      font-size: clamp(0.85rem, 2.1vw, 1.02rem);
      color: var(--ink-soft);
      margin-bottom: 0.65rem;
      font-weight: 700;
      line-height: 1.5;
    }
    .btn {
      font-family: var(--font-body);
      font-weight: 700;
      padding: 0.45rem 1.1rem;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffe566, #ffd54f);
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--shadow);
      font-size: 0.92rem;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
    .speak {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      margin-left: 0.35rem;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--mint);
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      transition: transform 0.12s;
    }
    .speak:hover { transform: scale(1.08); }
    .nav-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.15rem 0.15rem;
    }
    .dots { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: center; flex: 1; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--ink); opacity: 0.22; border: 2px solid var(--ink); cursor: pointer;
    }
    .dot.on { opacity: 1; background: var(--pink); }

    /* 配图占位：3D 粘土风 / 疯狂动物城式或高端彩铅绘本 */
    .wm-visual-wrap {
      width: 100%;
      max-width: 11rem;
      aspect-ratio: 1;
      margin: 0.35rem auto;
      border-radius: 16px;
      border: 3px dashed var(--rc-accent);
      background: linear-gradient(145deg, rgba(178, 226, 242, 0.35), rgba(209, 209, 247, 0.4));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.45rem;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--rc-accent-dark);
      line-height: 1.35;
    }

    .rc-review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .rc-review-card {
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 0.65rem;
      background: linear-gradient(180deg, #fff9c4, #e1f5fe);
      box-shadow: 4px 4px 0 var(--shadow);
      text-align: center;
    }
    .rc-syl-line {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 1.65rem);
      font-weight: 900;
      margin: 0.35rem 0;
    }
    .rc-syl-line .s1 { color: #1565c0; }
    .rc-syl-line .s2 { color: #c62828; }
    .rc-syl-line .sep { color: var(--ink-soft); margin: 0 0.15em; }

    /* 一页一词 · 居中布局 */
    .rc-one-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 28rem;
      margin: 0 auto;
    }
    /* 辨析页：仿 Magic E「or not」——宽板 + 5×2 大卡 */
    .hw-syl-slide-inner.hw-syl-slide--challenge {
      width: 100%;
      max-width: none;
      align-items: stretch;
      box-sizing: border-box;
    }
    .hw-syl-slide-inner.hw-syl-slide--challenge > .slide-title {
      margin-bottom: 0.5rem;
    }
    .me-on-page.rc-bossy-or-not {
      max-width: min(100%, 58rem);
      width: 100%;
      margin: 0.35rem auto 0;
      padding: 0.65rem 0.75rem 0.75rem;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: linear-gradient(180deg, #e8f5e9, #fffde7);
      box-shadow: 5px 5px 0 var(--shadow);
      box-sizing: border-box;
    }
    .me-on-page.rc-bossy-or-not .me-on-lead {
      text-align: center;
      font-weight: 800;
      line-height: 1.5;
      font-size: clamp(0.88rem, 2.1vw, 1rem);
      margin-bottom: 0.55rem;
      color: var(--ink-soft);
    }
    /* 须高于后面通用 .me-on-grid，否则会被 auto-fill 覆盖 */
    .me-on-grid.rc-me-grid-10 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.65rem;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }
    @media (max-width: 720px) {
      .me-on-grid.rc-me-grid-10 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (min-width: 721px) and (max-width: 960px) {
      .me-on-grid.rc-me-grid-10 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    .rc-bossy-or-not .me-card,
    .rc-bossy-or-not .me-card-inner {
      min-height: 13rem;
    }
    .rc-bossy-or-not .me-face:not(.me-face-back) {
      border-color: #2e7d32;
      background: linear-gradient(165deg, #fff9c4 0%, #c8e6c9 100%);
      overflow: hidden;
      padding: 0.45rem 0.35rem 0.5rem;
      justify-content: flex-start;
    }
    .rc-bossy-or-not .me-doodle {
      width: 100%;
      max-width: 6.75rem;
      aspect-ratio: 1;
      margin: 0.15rem auto 0.35rem;
      border-radius: 14px;
      border: 2px dashed rgba(61, 58, 69, 0.35);
      background: rgba(255, 255, 255, 0.55);
      overflow: hidden;
      flex-shrink: 0;
    }
    .rc-bossy-or-not .me-doodle .rc-slide-imagen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }
    .rc-bossy-or-not .me-card-word {
      font-size: clamp(1.15rem, 2.6vw, 1.45rem);
      margin-top: 0.1rem;
      padding: 0 0.15rem;
      line-height: 1.2;
      word-break: break-word;
    }
    .rc-bossy-or-not .me-face .speak {
      width: 2.1rem;
      height: 2.1rem;
      margin: 0.2rem 0 0;
      font-size: 0.88rem;
      flex-shrink: 0;
    }
    .rc-bossy-or-not .me-card-hint {
      margin-top: auto;
      font-size: 0.62rem;
      padding-top: 0.2rem;
    }
    .rc-bossy-or-not .me-reason {
      font-size: 0.72rem;
    }
    .rc-bossy-or-not .me-verdict {
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    }
    .me-reset-row {
      display: flex;
      justify-content: center;
      margin-top: 0.65rem;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .rc-one-slide .wm-visual-wrap {
      max-width: 13rem;
      font-size: 0.72rem;
    }
    .rc-one-slide .wm-visual-wrap.rc-visual-has-img {
      border-style: solid;
      border-color: var(--ink);
      padding: 0.25rem;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .rc-slide-imagen {
      display: block;
      width: 100%;
      max-width: 12.5rem;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }
    .rc-one-head {
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 6vw, 2.35rem);
      font-weight: 900;
      margin: 0.35rem 0 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    /* 与 Magic E / 开音节课件一致：师生活动 — 元音点击 + 剪刀划分 */
    .hw-syl-slide-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: none;
      margin: 0;
      padding-bottom: 0.35rem;
      flex: 1 1 auto;
      min-height: 0;
    }
    /* 老师演示：仿 Magic E「Let’s Practice」双栏 */
    .slide-inner.cact-lesson {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .cact-lesson .slide-sub { text-align: center; }
    .rc-demo-lesson-root {
      width: 100%;
      margin-top: 0.35rem;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* Magic E「Let’s Practice Together」同款：左右等宽双栏 */
    .cact-lesson-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem 0.85rem;
      align-items: stretch;
      min-height: 0;
      flex: 1 1 auto;
    }
    @media (max-width: 720px) {
      .cact-lesson-grid { grid-template-columns: 1fr; }
    }
    .cact-lesson-left {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
    }
    .cact-lesson-left .cact-hero {
      flex: 1;
      margin: 0;
      min-height: min(52vh, 22rem);
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
    }
    .cact-lesson-right {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 3px dashed var(--ink-soft);
      border-radius: 16px;
      background: rgba(255, 253, 208, 0.5);
      padding: 0.5rem 0.55rem 0.55rem;
    }
    .cact-flow-hint {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--ink-soft);
      text-align: center;
      margin: 0 0 0.4rem;
      line-height: 1.45;
    }
    .cact-flow-hint[hidden] { display: none !important; }
    .cact-flow-scroll {
      flex: 1;
      min-height: 12rem;
      max-height: min(52vh, 26rem);
      overflow-y: auto;
      padding-right: 0.2rem;
      margin-bottom: 0.45rem;
    }
    .cact-flow-panels { display: flex; flex-direction: column; gap: 0.5rem; }
    .cact-flow-panel {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      padding: 0.5rem 0.55rem;
      animation: rcCactPanelIn 0.4s ease;
      box-shadow: 3px 3px 0 var(--shadow);
    }
    .cact-flow-panel[hidden] { display: none !important; }
    @keyframes rcCactPanelIn {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .cact-flow-panel-inner { text-align: left; }
    .cact-flow-badge {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink), var(--mint));
      border: 2px solid var(--ink);
      margin-bottom: 0.35rem;
    }
    .cact-flow-sub {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-soft);
      margin: 0 0 0.3rem;
    }
    .cact-flow-body {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.55;
      color: var(--ink);
      margin: 0;
    }
    .cact-flow-body strong { font-weight: 800; }
    /* 右侧：朗读 / 重看（与 Magic E 右侧「下一步」区分，置于步骤区与底栏之间） */
    .cact-demo-toolbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0 0.25rem;
      border-top: 2px dashed rgba(61, 58, 69, 0.2);
    }
    .cact-demo-toolbar .hw-syl-btn-row {
      margin-top: 0;
      justify-content: center;
    }
    .cact-next-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.45rem 0.65rem;
      padding-top: 0.15rem;
      border-top: 2px dashed rgba(61, 58, 69, 0.2);
    }
    .cact-flow-progress {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink-soft);
    }
    .cact-img-wrap {
      width: min(160px, 42vw);
      aspect-ratio: 1;
      border-radius: 14px;
      border: 3px solid var(--ink);
      overflow: hidden;
      background: linear-gradient(180deg, #e8eaf6, #fffde7);
      flex-shrink: 0;
      margin: 0 auto;
    }
    .cact-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cact-lesson .cact-step-line.muted {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--ink-soft);
      margin-bottom: 0.25rem;
    }
    .cact-btn-next { min-width: 7rem; }
    .hw-syl-word-panel {
      margin: 0.45rem auto 0.35rem;
      min-width: min(100%, 28rem);
      text-align: center;
    }
    .hw-syl-slide-inner .cact-chars-row {
      font-size: clamp(1.55rem, 7vw, 2.65rem);
      gap: 0.08rem;
    }
    .hw-syl-slide-inner .cact-chars-row .cact-ch {
      padding: 0.18rem 0.14rem;
      min-width: 0.52em;
      border-radius: 6px;
      transition: background 0.25s, box-shadow 0.25s;
    }
    .hw-syl-slide-inner .cact-chars-row .cact-ch.is-vowel-hl {
      background: linear-gradient(180deg, #fff59d, #ffee58);
      box-shadow: 0 0 0 3px var(--ink);
    }
    /* R-controlled：与元音同组高亮的 R（同用 is-vowel-hl） */
    .hw-syl-slide-inner .cact-chars-row .cact-ch.cact-r-boss {
      cursor: pointer;
    }
    /* 初始不占宽：rep|tile 等词中间不先拉开；点划或显示虚线后再给插槽宽度 */
    .hw-syl-slide-inner .cact-slot {
      position: relative;
      min-height: 2.85rem;
      width: 0;
      min-width: 0;
      overflow: visible;
      margin: 0;
    }
    .hw-syl-slide-inner .cact-slot.is-cut-guide-visible {
      width: 0.48rem;
      min-width: 0.4rem;
      margin: 0 0.04rem;
    }
    .hw-syl-slide-inner .cact-slot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        180deg,
        var(--ink-soft),
        var(--ink-soft) 4px,
        transparent 4px,
        transparent 7px
      );
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
    }
    .hw-syl-slide-inner .cact-slot.is-cut-guide-visible::after {
      opacity: 0.4;
      visibility: visible;
    }
    .hw-syl-slide-inner .cact-scissor {
      font-size: clamp(1.35rem, 5vw, 2rem);
      top: -2.35rem;
    }
    .hw-syl-slide-inner .cact-scissor.run {
      animation: cact-scissor-cut-hw 1.12s cubic-bezier(0.45, 0, 0.2, 1) forwards;
    }
    @keyframes cact-scissor-cut-hw {
      0% { top: -2.35rem; opacity: 1; }
      92% { top: calc(100% + 0.12rem); opacity: 1; }
      100% { top: calc(100% + 0.12rem); opacity: 0.72; }
    }
    .hw-syl-slide-inner .cact-split-row {
      margin-top: 0.4rem;
      font-size: clamp(1.2rem, 4.5vw, 1.95rem);
      gap: 0.55rem;
    }
    .hw-syl-slide-inner .cact-split-row span.rc-split-boss {
      background: linear-gradient(180deg, #ffe082, #ffab40);
      box-shadow: 0 0 0 2px var(--ink);
    }
    .hw-syl-slot-clickable {
      cursor: pointer;
    }
    /* 零宽插槽仍保留可点区域（不撑开 rep 与 tile 间距） */
    .hw-syl-slide-inner .cact-slot.hw-syl-slot-clickable::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2.25rem;
      transform: translateX(-50%);
      z-index: 2;
    }
    .hw-syl-slot-clickable:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .hw-syl-btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    .hw-syl-reset-btn {
      font-size: 0.86rem;
      padding: 0.4rem 0.85rem;
      background: rgba(255, 255, 255, 0.9);
      border: 2px dashed var(--ink-soft);
      box-shadow: 3px 3px 0 var(--shadow);
    }
    .rc-interactive-root {
      width: 100%;

      function isVowelLetter(ch) {
        return ch && "aeiou".indexOf(ch.toLowerCase()) >= 0;
      }

      /** 在 boss 音节（或未配置 boss 时在全部音节）内找相邻 V+R，返回 [[元音下标, r下标], ...] */
      function collectBossVRPairs(word, parts, bossParts) {
        var pairs = [];
        var bp = bossParts || {};
        var hasBossKey = false;
        for (var key in bp) {
          if (bp[key]) {
            hasBossKey = true;
            break;
          }
        }
        var cum = 0;
        for (var pi = 0; pi < parts.length; pi++) {
          var part = parts[pi];
          var scan = !hasBossKey || bp[pi];
          if (scan) {
            for (var j = 0; j < part.length - 1; j++) {
              if (isVowelLetter(part[j]) && part[j + 1].toLowerCase() === "r") {
                pairs.push([cum + j, cum + j + 1]);
              }
            }
          }
          cum += part.length;
        }
        return pairs;
      }

      function cutAfterFromParts(word, parts) {
        if (!parts || parts.length <= 1) return null;
        var joined = parts.join("");
        if (joined !== word) {
          if (joined.toLowerCase() !== String(word).toLowerCase()) {
            console.warn("音节 parts 与单词不完全一致", word, parts);
          }
        }
        var cuts = [];
        var cum = 0;
        for (var i = 0; i < parts.length - 1; i++) {
          cum += parts[i].length;
          cuts.push(cum - 1);
        }
        return cuts.length === 1 ? cuts[0] : cuts;
      }

      function appendSyllableCharRowFlexible(panel, word, cutAfter) {
        if (cutAfter == null) {
          appendSyllableCharRowNoCut(panel, word);

        if (Array.isArray(cutAfter)) {
          if (cutAfter.length <= 1) {
            appendSyllableCharRow(panel, word, cutAfter[0]);

      function revealSplitInstant(wpanel) {
        var charsRow = wpanel.querySelector(".cact-chars-row");
        var splitRow = wpanel.querySelector(".cact-split-row");
        if (charsRow) charsRow.style.display = "none";
        if (splitRow) splitRow.classList.add("is-on");
        wpanel.querySelectorAll(".cact-slot").forEach(function (sl) {
          sl.classList.add("is-cut-guide-visible");
        });
      }

      function runScissorAnimation(root, done) {
        var charsRow = root.querySelector(".cact-chars-row");
        var splitRow = root.querySelector(".cact-split-row");
        var scissor = root.querySelector(".cact-scissor");
        var cutSlot = root.querySelector(".cact-slot");
        if (!charsRow || !splitRow || !scissor) {
          if (typeof done === "function") done();
          return;
        }
        if (cutSlot) cutSlot.classList.add("is-cut-guide-visible");
        var cutDone = false;
        function finish() {
          if (cutDone) return;
          cutDone = true;
          charsRow.style.display = "none";
          splitRow.classList.add("is-on");
          if (typeof done === "function") done();
        }
        scissor.classList.remove("run");
        void scissor.offsetWidth;
        scissor.classList.add("run");
        var t = window.setTimeout(finish, 1380);
        scissor.addEventListener(
          "animationend",
          function onEnd() {
            window.clearTimeout(t);
            finish();
          },
          { once: true }
        );
      }

      function resetHomeworkCutState(wpanel) {
        var charsRow = wpanel.querySelector(".cact-chars-row");
        var splitRow = wpanel.querySelector(".cact-split-row");
        wpanel.querySelectorAll(".cact-scissor").forEach(function (sci) {
          sci.classList.remove("run");
        });
        wpanel.querySelectorAll(".cact-slot").forEach(function (cutSlot) {
          cutSlot.classList.remove("is-cut-guide-visible");
        });
        if (charsRow) charsRow.style.display = "";
        if (splitRow) splitRow.classList.remove("is-on");
      }

      /** 音节划分：字母行 + 剪刀 + Bossy R 高亮（可复用于普通页与老师演示双栏） */
      function createRcWordPanelCore(meta) {
        var wpanel = document.createElement("div");
        wpanel.className = "cact-word-panel hw-syl-word-panel";

        var cutAfter = cutAfterFromParts(meta.word, meta.parts);
        appendSyllableCharRowFlexible(wpanel, meta.word, cutAfter);

        var splitRow = document.createElement("div");
        splitRow.className = "cact-split-row";
        splitRow.setAttribute("aria-label", "划分后的音节");
        var bossParts = meta.bossParts || {};
        meta.parts.forEach(function (p, i) {
          var sp = document.createElement("span");
          sp.textContent = p;
          if (bossParts[i]) sp.classList.add("rc-split-boss");
          splitRow.appendChild(sp);
        });
        wpanel.appendChild(splitRow);

        var vrPairs = collectBossVRPairs(meta.word, meta.parts, bossParts);
        var charByIdx = {};
        wpanel.querySelectorAll(".cact-ch[data-word-idx]").forEach(function (el) {
          charByIdx[el.getAttribute("data-word-idx")] = el;
        });
        var pairedVowelIdx = {};
        vrPairs.forEach(function (pair) {
          var vEl = charByIdx[String(pair[0])];
          var rEl = charByIdx[String(pair[1])];
          if (!vEl || !rEl) return;
          rEl.classList.add("cact-r-boss");
          function syncVRToggle(ev) {
            ev.stopPropagation();
            var show = !vEl.classList.contains("is-vowel-hl");
            vEl.classList.toggle("is-vowel-hl", show);
            rEl.classList.toggle("is-vowel-hl", show);
          }
          vEl.addEventListener("click", syncVRToggle);
          rEl.addEventListener("click", syncVRToggle);
          pairedVowelIdx[String(pair[0])] = true;
          vEl.title = "点击：元音与 R 一起高亮/取消（R-controlled）";
          rEl.title = "点击：与元音一起高亮/取消（R-controlled）";
        });
        wpanel.querySelectorAll(".cact-vowel").forEach(function (el) {
          var idx = el.getAttribute("data-word-idx");
          if (idx != null && pairedVowelIdx[idx]) return;
          el.style.cursor = "pointer";
          el.title = "点击高亮/取消该元音";
          el.addEventListener("click", function (ev) {
            ev.stopPropagation();
            el.classList.toggle("is-vowel-hl");
          });
        });

        var cutSlots = wpanel.querySelectorAll(".cact-slot");
        var multiCut = cutSlots.length > 1;
        var cutBusy = false;
        var cutDone = false;

        function tryPlayCut() {
          if (cutBusy || cutDone) return;
          cutBusy = true;
          if (cutSlots.length === 0) {
            revealSplitInstant(wpanel);
            cutBusy = false;
            cutDone = true;
            return;
          }
          if (multiCut) {
            revealSplitInstant(wpanel);
            cutBusy = false;
            cutDone = true;
          } else {
            runScissorAnimation(wpanel, function () {
              cutBusy = false;
              cutDone = true;
            });
          }
        }

        function resetCutState() {
          resetHomeworkCutState(wpanel);
          cutDone = false;
          cutBusy = false;
        }

        cutSlots.forEach(function (cutSlot) {
          cutSlot.classList.add("hw-syl-slot-clickable");
          cutSlot.setAttribute("role", "button");
          cutSlot.setAttribute("tabindex", "0");
          cutSlot.setAttribute("aria-label", "音节划分点，点击播放划分");
          cutSlot.title = multiCut ? "点任意剪刀位置揭示全词划分" : "点此播放音节划分动画";
          cutSlot.addEventListener("click", function (ev) {
            ev.stopPropagation();
            tryPlayCut();
          });
          cutSlot.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              tryPlayCut();
            }
          });
        });

        function highlightAllVowels() {
          wpanel.querySelectorAll(".cact-vowel").forEach(function (el) {
            el.classList.add("is-vowel-hl");
          });
        }

        function highlightBossVRPairs() {
          vrPairs.forEach(function (pair) {
            var vEl = charByIdx[String(pair[0])];
            var rEl = charByIdx[String(pair[1])];
            if (vEl) vEl.classList.add("is-vowel-hl");
            if (rEl) rEl.classList.add("is-vowel-hl");
          });
        }

        return {
          wpanel: wpanel,
          tryPlayCut: tryPlayCut,
          resetCutState: resetCutState,
          highlightAllVowels: highlightAllVowels,
          highlightBossVRPairs: highlightBossVRPairs,
          cutSlots: cutSlots,
          multiCut: multiCut,
          hasNoCutSlots: cutSlots.length === 0,
          meta: meta
        };
      }

      function bindRcDemoNextFlow(root, panelsRoot, nextBtn, progressEl, hintEl, stepDefs) {
        var cur = -1;
        var busy = false;
        var total = stepDefs.length;
        var panels = [];

        function setProgress() {
          if (progressEl) {
            progressEl.textContent = "第 " + (cur + 1) + " / " + total + " 步";
          }
        }

        function atEnd() {
          nextBtn.disabled = true;
          nextBtn.textContent = "已完成 ✓";
        }

        stepDefs.forEach(function (def) {
          var el = document.createElement("div");
          el.className = "cact-flow-panel";
          el.setAttribute("hidden", "");
          el.innerHTML = def.html;
          panelsRoot.appendChild(el);
          panels.push(el);
        });

        function release() {
          busy = false;
          nextBtn.disabled = false;
          if (cur >= total - 1) atEnd();
        }

        function goNext() {
          if (busy) return;
          if (cur >= total - 1) return;
          cur++;
          if (hintEl && cur === 0) hintEl.hidden = true;
          var p = panels[cur];
          if (p) {
            p.hidden = false;
            try {
              p.scrollIntoView({ behavior: "smooth", block: "nearest" });
            } catch (eScroll) {}
          }
          setProgress();
          var stepDef = stepDefs[cur];
          if (stepDef && typeof stepDef.onEnter === "function") {
            busy = true;
            nextBtn.disabled = true;
            stepDef.onEnter(function () {
              release();
            }, root);
          } else {
            if (cur >= total - 1) atEnd();
          }
        }

        if (progressEl) {
          progressEl.textContent = "0 / " + total + " 步（点击下一步）";
        }
        nextBtn.addEventListener("click", goNext);
      }

      function wireBossRMorphIfNeeded(slideEl) {
        var stage = slideEl.querySelector("[data-bossr-morph]");
        if (!stage || stage.dataset.wired === "1") return;
        stage.dataset.wired = "1";
        var playBtn = stage.querySelector(".rc-bossr-play");
        var resetBtn = stage.querySelector(".rc-bossr-reset");
        var rEl = stage.querySelector(".rc-cc-r");
        function markAfterSpeak() {
          stage.querySelectorAll(".rc-bossr-speak-after").forEach(function (b) {
            b.removeAttribute("disabled");
            b.setAttribute("aria-disabled", "false");
          });
        }
        function play() {
          if (stage.classList.contains("is-morphed")) return;
          stage.classList.add("is-morphed");
          if (rEl) {
            var done = function () {
              rEl.removeEventListener("animationend", done);
              markAfterSpeak();
            };
            rEl.addEventListener("animationend", done);
            window.setTimeout(function () {
              if (!stage.classList.contains("is-morphed")) return;
              markAfterSpeak();
            }, 1300);
          } else {
            markAfterSpeak();
          }
        }
        function resetMorph() {
          stage.classList.remove("is-morphed");
          if (rEl) void rEl.offsetWidth;
          stage.querySelectorAll(".rc-bossr-speak-after").forEach(function (b) {
            b.setAttribute("disabled", "disabled");
            b.setAttribute("aria-disabled", "true");
          });
        }
        if (playBtn) {
          playBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            play();
          });
        }
        if (resetBtn) {
          resetBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            resetMorph();
          });
        }
      }

        var root =
          sec.querySelector(".rc-interactive-root") || sec.querySelector(".rc-demo-lesson-root");
        if (!root || interactiveWired[slideIdx]) return;
        var def = SLIDE_DEFS[slideIdx];
        if (def.t === "word") {
          interactiveWired[slideIdx] = true;
          if (def.demoCactLesson) {
            buildRcDemoLessonMount(root, def);
          } else {
            buildRcInteractivePanel(root, {
              word: def.word,
              parts: def.parts,
              speak: def.speak || def.word,
              bossParts: def.boss || {}
            });
          }
        }
      }

      function buildBossRMorphHTML(def) {
        var sb = esc(def.speakBefore);
        var sa = esc(def.speakAfter);
        return (
          '<div class="slide-inner hw-syl-slide-inner">' +
          '<h1 class="slide-title">' +
          esc(def.title) +
          "</h1>" +
          '<p class="slide-sub">' +
          def.sub +
          "</p>" +
          '<div class="rc-bossr-morph-stage" data-bossr-morph="1">' +
          '<div class="rc-boss-label" style="margin-bottom:0.25rem">Bossy R · 霸道的 R</div>' +
          '<div class="rc-bossr-wordline" aria-label="' +
          esc(def.wordlineAria) +
          '">' +
          '<span class="rc-cc-ch">' +
          esc(def.l1) +
          "</span>" +
          '<span class="rc-cc-ch rc-cc-vowel">' +
          esc(def.vowel) +
          "</span>" +
          '<span class="rc-cc-slot"><span class="rc-cc-r" aria-hidden="true">R</span></span>' +
          '<span class="rc-cc-ch">' +
          esc(def.l2) +
          "</span>" +
          "</div>" +
          '<div class="rc-bossr-imgstack">' +
          bossMorphImgCell(def.imgBeforeAria, def.imgBeforeLines || "", def.imgBeforeSrc, "rc-cc-img-before") +
          bossMorphImgCell(def.imgAfterAria, def.imgAfterLines || "", def.imgAfterSrc, "rc-cc-img-after") +
          "</div>" +
          '<div class="rc-bossr-toolbar">' +
          '<button type="button" class="btn rc-bossr-play">演示变化</button>' +
          '<button type="button" class="btn hw-syl-reset-btn rc-bossr-reset">重来</button>' +
          '<button type="button" class="speak" data-speak="' +
          sb +
          '" aria-label="朗读 ' +
          sb +
          '">&#128266;</button>' +
          '<button type="button" class="speak rc-bossr-speak-after" data-speak="' +
          sa +
          '" aria-label="朗读 ' +
          sa +
          '" disabled aria-disabled="true">&#128266;</button>' +
          "</div>" +
          '<p class="muted" style="margin-top:0.55rem;font-size:0.78rem;font-weight:700">' +
          def.hintLine +
          "</p>" +
          "</div></div>"
        );
      }

      function buildSlideHTML(def) {
        if (def.t === "rule") {
          return (
            '<div class="slide-inner">' +
            '<h1 class="slide-title">' +
            def.title +
            "</h1>" +
            '<p class="slide-sub">' +
            def.sub +
            "</p>" +
            '<div class="rc-one-slide">' +
            def.html +
            "</div></div>"
          );
        }
        if (def.t === "bossRMorph") {
          return buildBossRMorphHTML(def);
        }
        if (def.t === "challengeGrid") {
          var gridCards = "";
          def.items.forEach(function (it) {
            gridCards += oneChallengeCard(it);
          });
          return (
            '<div class="slide-inner hw-syl-slide-inner hw-syl-slide--challenge">' +
            '<h1 class="slide-title">' +
            esc(def.title) +
            "</h1>" +
            '<div class="me-on-page rc-bossy-or-not">' +
            '<p class="me-on-lead">' +
            def.sub +
            "</p>" +
            '<div class="me-on-grid rc-me-grid-10" role="list" aria-label="辨析单词卡片">' +
            gridCards +
            "</div>" +
            '<div class="me-reset-row">' +
            '<button type="button" class="btn rc-challenge-reset-all">全部翻回正面</button>' +
            "</div></div></div>"
          );
        }
        if (def.t === "practice") {
          return (
            '<div class="slide-inner">' +
            '<h1 class="slide-title">' +
            esc(def.title) +
            "</h1>" +
            '<p class="slide-sub">' +
            def.sub +
            "</p>" +
            '<div class="rc-practice-host" data-practice-index="' +
            def.practiceIndex +
            '"></div></div>'
          );
        }
        if (def.t === "word" && def.demoCactLesson) {
          return (
            '<div class="slide-inner hw-syl-slide-inner cact-lesson">' +
            '<h1 class="slide-title slide-title-lp" lang="en">Let\u2019s Practice Together</h1>' +
            '<p class="slide-sub">读单词 · <strong>' +
            esc(def.word) +
            "</strong></p>" +
            '<p class="rc-demo-kicker">' +
            esc(def.title) +
            "</p>" +
            '<div class="rc-demo-lesson-root"></div></div>'
          );
        }
        var speakKey = def.speak || def.word;
        var hideV = def.hideVisual === true;
        var hideHead = def.hideWordHead === true;
        var visBlock = !hideV ? wmVisualForDef(def) : "";
        var headBlock =
          !hideHead
            ? '<div class="rc-one-head">' +
              esc(def.word) +
              ' <button type="button" class="speak" data-speak="' +
              esc(speakKey) +
              '" aria-label="朗读 ' +
              esc(speakKey) +
              '">&#128266;</button></div>'
            : "";
        return (
          '<div class="slide-inner hw-syl-slide-inner">' +
          '<h1 class="slide-title">' +
          esc(def.title) +
          "</h1>" +
          '<p class="slide-sub">' +
          def.sub +
          "</p>" +
          '<div class="rc-one-slide">' +
          visBlock +
          headBlock +
          '<div class="rc-interactive-root"></div>' +
          (def.extra || "") +
          (def.foot || "") +
          "</div></div>"
        );
      }

      var slidesMount = document.getElementById("slides-mount");
      SLIDE_DEFS.forEach(function (def, idx) {
        var sec = document.createElement("section");
        sec.className = "slide" + (idx === 0 ? " active" : "");
        sec.setAttribute("data-slide", String(idx));
        sec.innerHTML = buildSlideHTML(def);
        slidesMount.appendChild(sec);
      });

      var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
      var total = slides.length;
      var cur = 0;
      var dotsEl = document.getElementById("dots");

      function rebuildDots() {
        dotsEl.innerHTML = "";
        for (var d = 0; d < total; d++) {
          (function (i) {
            var dot = document.createElement("button");
            dot.type = "button";
            dot.className = "dot" + (i === cur ? " on" : "");
            dot.setAttribute("aria-label", "第 " + (i + 1) + " 页，共 " + total + " 页");
            dot.addEventListener("click", function () {
              go(i);
            });
            dotsEl.appendChild(dot);
          })(d);
        }
      }

      function go(n) {
        cur = Math.max(0, Math.min(total - 1, n));
        slides.forEach(function (s, i) {
          s.classList.toggle("active", i === cur);
        });
        Array.prototype.forEach.call(dotsEl.querySelectorAll(".dot"), function (dot, i) {
          dot.classList.toggle("on", i === cur);
        });
        var active = slides[cur];
        ensureInteractiveMount(cur);
        wireBossRMorphIfNeeded(active);
        var ph = active.querySelector("[data-practice-index]");
        if (ph) {
          mountPracticeHost(ph, Number(ph.getAttribute("data-practice-index")));
        }
      }

      rebuildDots();

      slidesMount.addEventListener("click", function (e) {
        if (e.target.closest(".speak[data-speak]")) {
          var sb = e.target.closest(".speak[data-speak]");
          if (sb.disabled) return;
          speak(sb.getAttribute("data-speak") || "").catch(function () {});
          return;
        }
        if (e.target.closest(".rc-challenge-reset-all")) {
          var slideReset = e.target.closest(".slide");
          if (slideReset) {
            slideReset.querySelectorAll(".me-card.is-flipped").forEach(function (c) {
              c.classList.remove("is-flipped");
            });
          }
          return;
        }
        if (
          e.target.closest(".cact-slot") ||
          e.target.closest(".cact-vowel") ||
          e.target.closest(".cact-ch.cact-r-boss")
        ) {
          return;
        }
        var mc = e.target.closest(".me-card");
        if (mc && !e.target.closest(".btn")) {
          mc.classList.toggle("is-flipped");
        }
      });

      slidesMount.addEventListener("keydown", function (e) {
        var mc = e.target.closest(".me-card");
        if (!mc) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          mc.classList.toggle("is-flipped");
        }
      });

      document.getElementById("btn-prev").addEventListener("click", function () {
        go(cur - 1);
      });
      document.getElementById("btn-next").addEventListener("click", function () {
        go(cur + 1);
      });
      document.addEventListener("keydown", function (e) {
        if (e.target.matches("input, textarea, select")) return;
        if (e.key === "ArrowRight" || e.key === "PageDown") {
          e.preventDefault();
          go(cur + 1);
        }
        if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          go(cur - 1);
        }
      });

      go(0);
    })();
  </script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
