<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../scripts/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PET 讲义导出 | S-Class</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">← 工作室</a>
    </div>
    <div class="toolbar">
      <div class="field"><label>单元</label><select id="unitSel"></select></div>
      <div class="field"><label>类型</label>
        <select id="typeSel">
          <option value="handout">单词 / 词组 / 语法讲义</option>
          <option value="passage">文章精读</option>
          <option value="games">复习游戏纸质卷</option>
        </select>
      </div>
      <div class="field"><label>难度（仅纸质卷）</label>
        <select id="levelSel">
          <option value="easy">基础</option>
          <option value="standard" selected>标准</option>
          <option value="challenge">挑战</option>
        </select>
      </div>
      <div class="field wide handout-only">
        <label>例句级别（可多选）</label>
        <div class="level-picks" id="exLevels"></div>
      </div>
      <div class="field wide handout-only">
        <label>语法练习级别（可多选）</label>
        <div class="level-picks" id="grLevels"></div>
      </div>
      <div class="field handout-only">
        <label>每档语法题（随机抽）</label>
        <select id="drillCountSel">
          <option value="3">3 题</option>
          <option value="5" selected>5 题</option>
          <option value="8">8 题</option>
          <option value="0">全部题库</option>
        </select>
      </div>
      <div class="field handout-only">
        <label>每档例句（随机抽）</label>
        <select id="exCountSel">
          <option value="1" selected>1 句</option>
          <option value="2">2 句</option>
          <option value="0">全部</option>
        </select>
      </div>
      <button class="btn btn-indigo" id="exportBtn">导出 PDF</button>
      <a class="btn btn-amber" id="goRead" href="read.html" style="display:none">打开文章学习</a>
    </div>
    <p class="note" id="status">正在读取本单元数据…</p>
    <p class="note" id="hint">讲义题库已预生成（语法每档 18 题）。导出时按年级随机抽取例句和语法题，避免把整本题库打进 PDF。</p>
    <iframe id="preview" title="讲义预览" style="display:none;width:100%;min-height:88vh;margin-top:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff"></iframe>
  </div>
  <script src="js/catalog.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/usage-format.js"></script>
  <script src="js/print.js"></script>
  <script>
    (function () {
      var q = PETStudio.parseQuery();
      var sel = document.getElementById("unitSel");
      PETStudio.UNITS.forEach(function (u) {
        var o = document.createElement("option");
        o.value = u.id; o.textContent = "Unit " + u.id + " · " + u.title;
        sel.appendChild(o);
      });
      if (q.unit) sel.value = q.unit;
      if (q.type) document.getElementById("typeSel").value = q.type;
      if (q.level) document.getElementById("levelSel").value = q.level;
      var bag = null;
      var statusEl = document.getElementById("status");
      var exportBtn = document.getElementById("exportBtn");
      var GRADES = [
        { id: "j1", label: "初一" },
        { id: "j2", label: "初二" },
        { id: "j3", label: "初三" },
        { id: "s1", label: "高一" },
        { id: "s2", label: "高二" },
        { id: "s3", label: "高三" }
      ];
      function fillLevels(boxId) {
        var box = document.getElementById(boxId);
        box.innerHTML = GRADES.map(function (lv) {
          return '<label class="level-pick on"><input type="checkbox" value="' + lv.id + '" checked> ' + lv.label + "</label>";
        }).join("");
        Array.prototype.forEach.call(box.querySelectorAll("label"), function (lab) {
          var inp = lab.querySelector("input");
          inp.onchange = function () {
            lab.className = "level-pick" + (inp.checked ? " on" : "");
          };
        });
      }
      fillLevels("exLevels");
      fillLevels("grLevels");
      function selectedLevels(boxId) {
        var out = [];
        Array.prototype.forEach.call(document.querySelectorAll("#" + boxId + " input:checked"), function (inp) {
          out.push(inp.value);
        });
        return out;
      }
      function syncTypeHint() {
        var type = document.getElementById("typeSel").value;
        var handout = type === "handout";
        Array.prototype.forEach.call(document.querySelectorAll(".handout-only"), function (el) {
          el.style.display = handout ? "" : "none";
        });
        var learn = document.getElementById("goRead");
        if (learn) {
          learn.style.display = type === "passage" ? "" : "none";
          learn.href = "read.html?unit=" + sel.value;
        }
      }
      document.getElementById("typeSel").onchange = syncTypeHint;
      syncTypeHint();
      function setBusy(busy, label) {
        exportBtn.disabled = busy;
        exportBtn.textContent = label || "导出 PDF";
      }
      function load() {
        statusEl.textContent = "正在读取 Unit " + sel.value + " …";
        PETStudio.loadUnit(sel.value).then(function (b) {
          bag = b;
          statusEl.textContent =
            "已载入 单词 " + b.vocab.length + " · 词组 " + b.colloc.length + " · 语法 " + b.grammar.length +
            " · 文章 " + (b.passages || []).length + " 篇。讲义将打开排版页，再选「另存为 PDF」。";
        }).catch(function (e) {
          statusEl.textContent = "读取失败：" + e.message;
        });
      }
      sel.onchange = function () {
        syncTypeHint();
        load();
      };
      load();
      function exportHandout() {
        if (!bag) return;
        var exLv = selectedLevels("exLevels");
        var grLv = selectedLevels("grLevels");
        if (!exLv.length && !grLv.length) {
          statusEl.textContent = "请至少选择一个例句级别或语法级别。";
          return;
        }
        var drillN = Number(document.getElementById("drillCountSel").value);
        var exN = Number(document.getElementById("exCountSel").value);
        setBusy(true, "载入讲义…");
        PETStudio.enrichHandout(bag, {
          filters: {
            exampleLevels: exLv,
            grammarLevels: grLv,
            examplePerLevel: exN,
            exercisePerLevel: drillN
          },
          onProgress: function (msg) { statusEl.textContent = msg; }
        }).then(function (enriched) {
          if (enriched.handoutWarning) {
            statusEl.textContent = "讲义降级：" + enriched.handoutWarning;
          } else {
            statusEl.textContent = "已从题库随机抽取。例句 " + exLv.length + " 档 · 语法 " + grLv.length + " 档" +
              (drillN > 0 ? " · 每档 " + drillN + " 题" : " · 全题库") + "。正在打开排版页…";
          }
          var doc = PETStudio.handoutDocument(enriched);
          var preview = document.getElementById("preview");
          preview.style.display = "block";
          preview.srcdoc = doc;
          PETStudio.printHandout(enriched);
          setBusy(false);
        }).catch(function (e) {
          statusEl.textContent = "导出失败：" + (e.message || e);
          setBusy(false);
        });
      }
      exportBtn.onclick = function () {
        if (!bag) return;
        var t = document.getElementById("typeSel").value;
        var preview = document.getElementById("preview");
        if (t === "handout") {
          exportHandout();
        } else if (t === "passage") {
          setBusy(true, "正在生成封面二维码…");
          PETStudio.passageDocument(bag).then(function (doc) {
            preview.style.display = "block";
            preview.srcdoc = doc;
            return PETStudio.printPassage(bag);
          }).then(function () {
            statusEl.textContent = "已打开文章排版页。封面二维码指向学习页（点读 / 查词 / 结构 / 翻译）。";
            setBusy(false);
          }).catch(function (e) {
            statusEl.textContent = "导出失败：" + (e.message || e);
            setBusy(false);
          });
        } else {
          preview.style.display = "none";
          PETStudio.printGames(bag, document.getElementById("levelSel").value);
        }
      };
    })();
  </script>
</body>
</html>
