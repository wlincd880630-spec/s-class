<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../scripts/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PET 讲义导出 | S-Class</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">← 工作室</a>
    </div>
    <div class="toolbar">
      <div class="field"><label>单元</label><select id="unitSel"></select></div>
      <div class="field"><label>类型</label>
        <select id="typeSel">
          <option value="handout">单词 / 词组 / 语法讲义</option>
          <option value="passage">文章精读</option>
          <option value="games">复习游戏纸质卷</option>
        </select>
      </div>
      <div class="field"><label>难度（仅纸质卷）</label>
        <select id="levelSel">
          <option value="easy">基础</option>
          <option value="standard" selected>标准</option>
          <option value="challenge">挑战</option>
        </select>
      </div>
      <button class="btn btn-indigo" id="exportBtn">生成并导出 PDF</button>
      <button class="btn btn-ghost" id="refreshBtn" type="button">重新生成讲义内容</button>
    </div>
    <p class="note" id="status">正在读取本单元数据…</p>
    <p class="note" id="hint">讲义会用 DeepSeek 重写词汇三条例句（中考 / 高一 / 高二）和语法课件（用法 + 分层练习），不含课文原句。首次约需一分钟，之后使用本机缓存。</p>
    <iframe id="preview" title="讲义预览" style="display:none;width:100%;min-height:88vh;margin-top:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff"></iframe>
  </div>
  <script src="js/catalog.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/print.js"></script>
  <script>
    (function () {
      var q = PETStudio.parseQuery();
      var sel = document.getElementById("unitSel");
      PETStudio.UNITS.forEach(function (u) {
        var o = document.createElement("option");
        o.value = u.id; o.textContent = "Unit " + u.id + " · " + u.title;
        sel.appendChild(o);
      });
      if (q.unit) sel.value = q.unit;
      if (q.type) document.getElementById("typeSel").value = q.type;
      if (q.level) document.getElementById("levelSel").value = q.level;
      var bag = null;
      var statusEl = document.getElementById("status");
      var exportBtn = document.getElementById("exportBtn");
      var refreshBtn = document.getElementById("refreshBtn");
      function syncTypeHint() {
        refreshBtn.style.display = document.getElementById("typeSel").value === "handout" ? "" : "none";
      }
      document.getElementById("typeSel").onchange = syncTypeHint;
      syncTypeHint();
      function setBusy(busy, label) {
        exportBtn.disabled = busy;
        refreshBtn.disabled = busy;
        if (label) exportBtn.textContent = label;
        else exportBtn.textContent = "生成并导出 PDF";
      }
      function load() {
        statusEl.textContent = "正在读取 Unit " + sel.value + " …";
        PETStudio.loadUnit(sel.value).then(function (b) {
          bag = b;
          statusEl.textContent =
            "已载入 单词 " + b.vocab.length + " · 词组 " + b.colloc.length + " · 语法 " + b.grammar.length +
            " · 文章 " + (b.passages || []).length + " 篇。讲义将打开排版页，再选「另存为 PDF」。";
        }).catch(function (e) {
          statusEl.textContent = "读取失败：" + e.message;
        });
      }
      sel.onchange = load;
      load();
      function exportHandout(force) {
        if (!bag) return;
        setBusy(true, "生成中…");
        statusEl.textContent = force ? "正在重新调用 DeepSeek…" : "准备生成讲义…";
        PETStudio.enrichHandout(bag, {
          force: !!force,
          onProgress: function (msg) { statusEl.textContent = msg; }
        }).then(function (enriched) {
          if (enriched.handoutWarning) {
            statusEl.textContent = "DeepSeek 部分失败，已用本地内容降级：" + enriched.handoutWarning;
          } else if (enriched.handoutFromCache) {
            statusEl.textContent = "已使用缓存讲义。配图完整显示；例句为中考/高一/高二；语法不含课文。";
          } else {
            statusEl.textContent = "讲义已生成并缓存。正在打开排版页…";
          }
          var doc = PETStudio.handoutDocument(enriched);
          var preview = document.getElementById("preview");
          preview.style.display = "block";
          preview.srcdoc = doc;
          PETStudio.printHandout(enriched);
          setBusy(false);
        }).catch(function (e) {
          statusEl.textContent = "导出失败：" + (e.message || e);
          setBusy(false);
        });
      }
      exportBtn.onclick = function () {
        if (!bag) return;
        var t = document.getElementById("typeSel").value;
        if (t === "handout") exportHandout(false);
        else if (t === "passage") PETStudio.printPassage(bag);
        else PETStudio.printGames(bag, document.getElementById("levelSel").value);
      };
      refreshBtn.onclick = function () {
        if (!bag) return;
        document.getElementById("typeSel").value = "handout";
        exportHandout(true);
      };
    })();
  </script>
</body>
</html>
