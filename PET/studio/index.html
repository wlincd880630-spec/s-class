<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../scripts/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PET 跨单元复习游戏 | S-Class</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
  <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
  <script src="../../scripts/pet-speech-helper.js"></script>
  <script src="../../scripts/site-nav.js" defer></script>
</head>
<body class="studio mix">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../index.html">← PET 课程</a>
    </div>
    <section class="hero">
      <div class="hero-copy">
        <div class="kicker">Mixed Review</div>
        <h1 id="unitTitle">跨单元混合复习</h1>
        <p>勾选多个单元，再点选要练的单词 / 词组，用同一套九种游戏混合复习。各单元讲义 PDF、文章 PDF 请在 PET 课程页对应单元里导出。</p>
      </div>
      <img src="img/hub-hero.jpg" alt="">
    </section>

    <div id="pickerPanel">
      <div class="toolbar mix-bar">
        <button class="btn btn-ghost" type="button" id="allUnits">全选单元</button>
        <button class="btn btn-ghost" type="button" id="noUnits">取消单元</button>
        <button class="btn btn-ghost" type="button" id="selVisible">全选当前列表</button>
        <button class="btn btn-ghost" type="button" id="clearSel">清空已选词</button>
        <span class="hint" id="mixCount">已选 0 个单词 · 0 个词组</span>
        <button class="btn btn-teal" type="button" id="startMix" disabled>至少再选 4 个词</button>
      </div>
      <p class="note" id="mixStatus">勾选单元，再点选要练的单词 / 词组。</p>
      <div class="mix-chips" id="unitChips"></div>
      <div class="mix-filter">
        <input id="mixSearch" type="search" placeholder="搜索单词 / 中文 / 单元">
        <button type="button" class="kind-btn on" data-kind="all">全部</button>
        <button type="button" class="kind-btn" data-kind="vocab">单词</button>
        <button type="button" class="kind-btn" data-kind="phrase">词组</button>
      </div>
      <div class="mix-list" id="wordList"></div>
    </div>

    <div id="playPanel" hidden>
      <div class="toolbar">
        <button class="btn btn-ghost" type="button" id="editMix">改选单词</button>
        <div class="field"><label>难度分层</label>
          <select id="levelSel">
            <option value="easy">基础 Easy</option>
            <option value="standard" selected>标准 Standard</option>
            <option value="challenge">挑战 Challenge</option>
          </select>
        </div>
        <button class="btn btn-indigo" id="printGamesBtn">导出纸质复习卷</button>
        <button class="btn btn-rose" id="aiPaperBtn">DeepSeek 加题卷</button>
      </div>
      <div id="playRoot"></div>
    </div>
  </div>
  <script src="js/catalog.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/usage-format.js"></script>
  <script src="js/print.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/games.js"></script>
  <script src="js/mix.js"></script>
</body>
</html>
