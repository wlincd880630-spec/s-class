<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../scripts/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PET 文章学习 | S-Class</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/read.css">
  <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
  <script src="../../scripts/pet-speech-helper.js"></script>
  <script src="../../scripts/site-nav.js" defer></script>
</head>
<body class="studio read">
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="../index.html">← PET 课程</a>
      <a class="back" id="pdfLink" href="print.html?type=passage">文章 PDF</a>
    </div>
    <section class="read-hero">
      <div class="read-hero-copy">
        <div class="kicker">Close Reading</div>
        <h1 id="unitTitle">文章学习</h1>
        <p id="unitSub">点读单词与句子，查词、看结构、学语法、看翻译。扫文章 PDF 上的二维码即可打开本页。</p>
      </div>
      <img id="heroImg" src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/PET/studio/img/hub-hero.jpg" alt="">
    </section>
    <div class="read-toolbar">
      <div class="field">
        <label>单元</label>
        <select id="unitSel"></select>
      </div>
      <button class="btn btn-indigo" type="button" id="readAllBtn">全文朗读</button>
      <a class="btn btn-rose" id="goPdf">导出文章 PDF</a>
      <span class="hint">点击单词查词点读 · 右侧按钮翻译 / 结构语法</span>
    </div>
    <p class="status-note" id="status">正在读取文章…</p>
    <div id="article"></div>
  </div>
  <div class="lookup-pop" id="lookupPop"></div>
  <script src="js/catalog.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/print.js"></script>
  <script src="js/read.js"></script>
</body>
</html>
