
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="../../scripts/auth-check.js"></script>
    <script src="../studio/js/entry.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>passages.json | S-Class</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
    <script src="../../scripts/pet-passage-speech.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        /* 核心修复 1: 强制高度适配，防止 iOS 滚动溢出 */
        html, body { 
            font-family: 'Nunito', 'Noto Sans SC', sans-serif; 
            background-color: #F8FAFC; 
            height: 100vh; /* 兼容旧设备 */
            height: 100dvh; /* 核心：动态视口高度 */
            width: 100%;
            overflow: hidden; /* 禁止整体滚动，交给 main 滚动 */
        }

        /* 核心修复 2: 底部安全区域 padding */
        .safe-pb {
            padding-bottom: constant(safe-area-inset-bottom); /* iOS 11.0 */
            padding-bottom: env(safe-area-inset-bottom); /* iOS 11.2+ */
        }
        
        /* 录音呼吸灯动画 */
        .recording-active { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; border-color: #EF4444; background-color: #FEF2F2; color: #EF4444; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        /* 平滑过渡 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* 隐藏滚动条 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="../../scripts/s-class-tracker.js"></script>
</head>
<body class="text-slate-800 flex flex-col">
    <div id="app" class="flex flex-col h-full max-w-lg mx-auto bg-white shadow-2xl relative w-full">
        
        <header class="bg-white z-10 px-4 py-3 border-b border-gray-100 shadow-sm shrink-0">
            <h1 class="text-center font-bold text-slate-800 truncate mb-3">passages.json</h1>
            <div class="flex gap-2 overflow-x-auto hide-scrollbar">
                <button v-for="(p, idx) in lessonData" :key="idx" @click="switchPassage(idx)"
                    :class="['whitespace-nowrap px-4 py-2 rounded-xl text-sm font-bold transition-all', 
                             currentPassageIdx === idx ? 'bg-indigo-600 text-white shadow-md ring-2 ring-indigo-200' : 'bg-gray-50 text-gray-500 hover:bg-gray-100']">
                    {{ p.title }}
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 bg-slate-50 overscroll-contain">
            
            <div class="flex justify-between items-center mb-4 px-1">
                <span class="text-xs font-bold text-indigo-400 tracking-widest uppercase">Sentence {{ currentSentenceIdx + 1 }} / {{ currentPassage.sentences.length }}</span>
                <div class="w-24 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                    <div class="h-full bg-indigo-500 transition-all duration-300" :style="'width: ' + ((currentSentenceIdx + 1) / currentPassage.sentences.length * 100) + '%'"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6 relative">
                <div class="absolute -top-3 left-4 bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded text-xs font-bold">TEXT</div>
                <p class="text-xl md:text-2xl font-medium leading-relaxed text-slate-800 mt-2">{{ currentSentence }}</p>
            </div>

            <transition-group name="fade" tag="div" class="space-y-3">
                <div v-if="sttEn" key="en-fb" class="bg-white border-l-4 border-blue-400 rounded-r-xl p-3 shadow-sm">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-bold text-blue-500 uppercase">Your Reading</span>
                    </div>
                    <p class="text-sm text-slate-600">{{ sttEn }}</p>
                </div>

                <div v-if="sttCn" key="cn-fb" class="bg-white border-l-4 border-purple-400 rounded-r-xl p-3 shadow-sm">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-bold text-purple-500 uppercase">Your Translation</span>
                    </div>
                    <p class="text-sm text-slate-600">{{ sttCn }}</p>
                </div>

                <div v-if="evaluation" key="ai-eval" class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-4 border border-amber-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-3 border-b border-amber-200 pb-2">
                        <span class="text-xl">👩‍🏫</span>
                        <span class="text-amber-800 font-bold text-sm">AI Teacher Feedback</span>
                    </div>
                    <div v-html="renderMarkdown(evaluation)" class="prose prose-sm text-slate-700 leading-relaxed"></div>
                </div>
            </transition-group>

            <div class="h-10"></div>
        </main>

        <footer class="bg-white border-t border-gray-100 p-4 pb-4 safe-pb shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-20 shrink-0">
            
            <div class="flex items-center justify-between mb-4 px-2">
                <button @click="prevSentence" :disabled="currentSentenceIdx===0" class="p-2 text-gray-300 hover:text-indigo-600 disabled:opacity-20 transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"></path></svg>
                </button>
                
                <button @click="playTTS" :disabled="isPlaying" 
                    class="flex items-center gap-2 px-6 py-2 bg-slate-100 text-slate-600 rounded-full text-sm font-bold active:scale-95 transition hover:bg-slate-200">
                    <span v-if="isPlaying" class="animate-pulse">🔊 Playing...</span>
                    <span v-else>🎧 Listen Standard</span>
                </button>

                <button @click="nextSentence" :disabled="currentSentenceIdx===currentPassage.sentences.length-1" class="p-2 text-gray-300 hover:text-indigo-600 disabled:opacity-20 transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 9l3 3m0 0l-3 3m3-3H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
            </div>

            <div class="grid grid-cols-5 gap-3 h-14">
                <button @click="toggleRecord('en')" 
                    :class="['col-span-2 rounded-2xl font-bold flex flex-col justify-center items-center leading-none transition-all active:scale-95 border', 
                    isRecordingEn ? 'recording-active' : 'bg-white border-gray-200 text-slate-600 hover:bg-gray-50']">
                    <span class="text-xl mb-1">{{ isRecordingEn ? '⏹️' : '🎙️' }}</span>
                    <span class="text-[10px] font-bold">{{ isRecordingEn ? 'STOP' : 'READ' }}</span>
                </button>

                <button @click="evaluate" :disabled="!sttEn || isEvaluating"
                    class="col-span-1 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-200 flex justify-center items-center text-2xl active:scale-90 transition-transform disabled:bg-gray-200 disabled:shadow-none disabled:text-gray-400">
                    <span v-if="isEvaluating" class="animate-spin text-lg">⏳</span>
                    <span v-else>✨</span>
                </button>

                <button @click="toggleRecord('cn')" 
                    :class="['col-span-2 rounded-2xl font-bold flex flex-col justify-center items-center leading-none transition-all active:scale-95 border', 
                    isRecordingCn ? 'recording-active' : 'bg-white border-gray-200 text-slate-600 hover:bg-gray-50']">
                    <span class="text-xl mb-1">{{ isRecordingCn ? '⏹️' : '🇨🇳' }}</span>
                    <span class="text-[10px] font-bold">{{ isRecordingCn ? 'STOP' : 'TRANS' }}</span>
                </button>
            </div>
        </footer>

    </div>

    <script>
        const { createApp } = Vue;
        const AZURE_KEY = "4SJbskufsk2tiu5jq1kzlJwTDw2eVPYd8e7HvDhb3lX6ZmItWOnxJQQJ99CHACqBBLyXJ3w3AAAYACOGxnpO";
        const AZURE_REGION = "southeastasia";
        const DEEPSEEK_KEY = "sk-daa16008e81843deba6fefe9dce51465";

        createApp({
            data() {
                return {
                    lessonData: [{"title": "Passage 1", "sentences": ["Traveling abroad has always been one of the most popular ways to spend free time for many people.", "Traveling gives you a chance to Learn something new and sometimes even changes your world view.", "We work hard for half of the year or even a whole year to take our Loved ones to experience something we never tried and to refresh our brain.", "Have you ever wonder why we do that?", "Visit Your Family Some of our relatives might have moved to another city or country.", "It can be a nearby town or another side of the world.", "No matter where they are you will want to visit them at some point.", "What really good about family visits is that you can see how differently people can live comparing to your city, and can also explore new culture and traditions.", "Spend Time with Your Friends It's getting boring just meeting your friends in local areas.", "Why not plan a trip away from the routine we Live in every day?", "Traveling brings us happiness and a bunch of memories, and going somewhere with your friends makes it much brighter.", "Find a Suitable Weather No matter where you live you might complain about the weather sometimes.", "If it's too hot, you can choose a cold country to go for skiing.", "If it's too cold, find a beautiful seaside with comfortable beaches for you to sunbathe, and a warm sea to swim in.", "Explore Somewhere New We usually choose popular locations to travel based on our friends' advice or internet recommendations.", "But what if I tell you that less known destinations can also be magnificent.", "When we travel to popular places, we frequently face some common problems.", "There are crowds of people, long queues that affect the level of your comfort.", "Here is a solution that people rarely follow — to reduce the risk of the crowded locations, choose a much less famous place to travel.", "Generally, unpopular places aren't that expensive.", "This applies to hostels, public transport, food and even shopping centers.", "However, if there is an exact place you're dreaming to visit and you won't trade it for anything.", "In this case, you should choose a date on your calendar when it's not a common break time for most people to travel.", "It's really going to save your time, money and most importantly, nerves.", "Now we know that it's necessary to travel around to relax yourself, and it would be absolutely amazing to explore something new.", "Then, don't forget to find reasons for your next trip!"]}, {"title": "Passage 2", "sentences": ["It's always challenging to break away from mainstream and choose an unusual journey.", "Sometimes we just want to do something a little different and book an unusual holiday to a new destination.", "When you choose less popular places to visit, you never have huge expectations; that's why these trips actually turn out to be amazing.", "When we talk about traveling, we think about trips by car, plane or on foot and this is not surprising because they are used to be the most popular ways to travel.", "But these days things are changing.", "Although train trips are generally forgotten, they have a lot of advantages.", "First of all, it is safer than other vehicle and there are no stressful traffic jams.", "Trains are much cheaper than planes.", "If you're a young backpacker, this is the best choice for you.", "Some of them don't even need reservations; you can come to the train station and buy a ticket.", "Modern trains are extremely comfortable and provide all the stuff you need for the ride.", "Despite the advantages, train trips have both pros and cons.", "Train travel takes a longer time compared to air travel.", "Trains cannot take you from door to door, and you cannot stop to enjoy the beautiful views when you travel by car.", "Here is an example of a train journey.", "You can't imagine how marvellous it can be to cross a whole country by train.", "The Indian Pacific gives you the views of two oceans on one of the world's longest and greatest train trips.", "You will be able to see the Indian Ocean in the west coast and the Pacific Ocean in the east.", "The train will give you a chance to cross southern Australia with the full length of 4,352 km from Sydney to Perth and in the opposite direction.", "The three-day train journey isn't very popular but the Great Southern Rail is going to attract more and more tourists.", "Taking the train, you will be able to see the beautiful Blue Mountains, treeless lands of the Nullarbor, and Australian wildlife.", "It's worth mentioning that the journey also has the longest straight railway track in the world (478 km).", "During the journey, passengers are offered to take part in some off-train sightseeing tours on stops at Broken Hill, Adelaide and the gold rich city Kalgoorlie.", "You'll have a lot of opportunities to enjoy Australian landscapes and admire the wonderful views of mountains."]}],
                    currentPassageIdx: 0,
                    currentSentenceIdx: 0,
                    isPlaying: false,
                    isRecordingEn: false,
                    isRecordingCn: false,
                    sttEn: "",
                    sttCn: "",
                    isEvaluating: false,
                    evaluation: "",
                    recognizer: null
                }
            },
            computed: {
                currentPassage() { return this.lessonData[this.currentPassageIdx] },
                currentSentence() { return this.currentPassage ? this.currentPassage.sentences[this.currentSentenceIdx] : "" }
            },
            methods: {
                switchPassage(idx) { this.currentPassageIdx = idx; this.currentSentenceIdx = 0; this.clearState(); },
                clearState() { this.sttEn = ""; this.sttCn = ""; this.evaluation = ""; },
                prevSentence() { if(this.currentSentenceIdx > 0) { this.currentSentenceIdx--; this.clearState(); } },
                nextSentence() { if(this.currentSentenceIdx < this.currentPassage.sentences.length - 1) { this.currentSentenceIdx++; this.clearState(); } },
                renderMarkdown(text) { return marked.parse(text); },

                playTTS() {
                    this.isPlaying = true;
                    (window.azureSpeak || function(t,o){o.onEnd();})(this.currentSentence, {
                        voice: "en-GB-RyanNeural",
                        onEnd: () => { this.isPlaying = false; }
                    });
                },

                toggleRecord(lang) {
                    const isEn = lang === 'en';
                    if ((isEn && this.isRecordingEn) || (!isEn && this.isRecordingCn)) { this.stopRecord(); return; }
                    this.stopRecord();
                    if (isEn) this.isRecordingEn = true; else this.isRecordingCn = true;
                    const vm = this;
                    (window.azureRecognizeOnce || function(){ vm.stopRecord(); })(isEn ? "en-GB" : "zh-CN",
                        (text) => { if (isEn) vm.sttEn = text; else vm.sttCn = text; vm.stopRecord(); },
                        (err) => { console.error(err); vm.stopRecord(); },
                        { onRecognizer: (r) => { vm.recognizer = r; } }
                    );
                },

                stopRecord() {
                    if (this.recognizer) { this.recognizer.close(); this.recognizer = null; }
                    this.isRecordingEn = false;
                    this.isRecordingCn = false;
                },

                async evaluate() {
                    this.isEvaluating = true;
                    // Prompt 优化：更简洁的反馈
                    const prompt = `Task: English Tutor. 
Target Sentence: "${this.currentSentence}"
Student Reading: "${this.sttEn}"
Student Translation: "${this.sttCn}"
Rules: 
1. Give a Pronunciation Score (0-100).
2. Check if the translation captures the meaning.
3. Provide the standard translation.
Output in concise Chinese Markdown.`;
                    try {
                        const res = await fetch("https://api.deepseek.com/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${DEEPSEEK_KEY}` },
                            body: JSON.stringify({ model: "deepseek-v4-flash", messages: [{ role: "user", content: prompt }] })
                        });
                        const data = await res.json();
                        this.evaluation = data.choices[0].message.content;
                    } catch (e) { this.evaluation = "评价服务连接失败"; } finally { this.isEvaluating = false; }
                }
            }
        }).mount('#app');
    </script>

<script>
(function(){
  var _sc_sent = false;
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "hidden" && !_sc_sent && typeof SClass !== "undefined") {
      _sc_sent = true;
      var unitNum = (location.pathname.match(/Unit(\d+)_passage/) || [])[1] || "";
      SClass.sendReport({ contentName: document.title.split("|")[0].trim(), page_label: unitNum ? ("PET Unit " + unitNum + " Passage") : document.title.split("|")[0].trim() });
    }
  });
})();
</script>
</body>
</html>
