<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}

    /* ── 跳过按钮 ── */
    .btn-skip{background:rgba(156,163,175,.1);color:#9ca3af;border:1px dashed rgba(156,163,175,.3);font-size:.82rem;padding:7px 14px;margin-bottom:10px;width:100%;border-radius:var(--radius-sm);transition:all .18s;cursor:pointer}
    .btn-skip:hover{background:rgba(251,191,36,.1);color:#fbbf24;border-color:rgba(251,191,36,.4)}
    .skip-badge{display:inline-block;font-size:.7rem;background:rgba(156,163,175,.15);color:#9ca3af;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>
</head>

  <script>window.VOCAB_DATA={"units":[{"unit":6,"source":"D:\\2026\\初中\\人教版英语八年级下单词表\\人教版英语八年级下单词表.pdf","words":[{"word":"hug","ipa":"/hʌɡ/","image_prompts":["Two teddy bears embracing each other tightly, soft fur visible","A large, fluffy blanket wrapped around a steaming mug of hot chocolate"],"image_desc_en":"Visuals representing a warm embrace and comfort.","image_desc_cn":"拥抱和舒适感的视觉表现。","meaning_cn":"拥抱","usage":"v. (过去式 hugged, 过去分词 hugged); n.","collocations":"give a hug, warm hug, tight hug","preposition_combos":"hug someone tightly","examples":[{"en":"I want to hug my parents when I see them later.","cn":"我稍后见到父母时想拥抱他们。"},{"en":"She gave her friend a big hug after the good news.","cn":"听到好消息后，她给了朋友一个大大的拥抱。"}],"socratic_questions":[{"question":"当你感到特别开心或者安慰某人时，你会做什么动作来表达你的情感？","answer_hint":"这个动作通常包含用双臂环绕对方。"}],"fill_blank":{"sentences":["After winning the game, the team members gave each other a joyful ___."],"options":["hug","handshake","wave","nod"],"correct_index":0},"audio":"audio/hug.mp3","audio_ex0":"audio/hug_ex0.mp3","audio_ex1":"audio/hug_ex1.mp3","img1":"images/hug_1.png","img2":"images/hug_2.png"},{"word":"embarrassed","ipa":"/ɪmˈbærəst/","image_prompts":["A spotlight shining on an empty stage, a single microphone stand","A crumpled test paper with a large red 'F' written on it, lying on a desk"],"image_desc_en":"A spotlight on an empty stage; a failed test.","image_desc_cn":"空荡荡舞台上的聚光灯；不及格的试卷。","meaning_cn":"adj. 尴尬的，难堪的","usage":"adj. feeling or showing embarrassment","collocations":"feel embarrassed, look embarrassed, be embarrassed about","preposition_combos":"embarrassed about/by/at","examples":[{"en":"I felt embarrassed when I forgot my lines during the play.","cn":"戏剧表演时，我忘记台词，感到很尴尬。"},{"en":"She was embarrassed about her poor performance on the exam.","cn":"她对自己在考试中的糟糕表现感到难堪。"}],"socratic_questions":[{"question":"想象一下，你在全班面前演讲，突然忘记了要说什么，你会是什么感觉？","answer_hint":"这种感觉是觉得自己做错了事，有点丢脸。"}],"fill_blank":{"sentences":["He felt ___ when he realized he was wearing mismatched socks.","She was ___ to admit that she had made a mistake."],"options":["embarrassed","embarrassing","embarrass","embarrassment"],"correct_index":0},"audio":"audio/embarrassed.mp3","audio_ex0":"audio/embarrassed_ex0.mp3","audio_ex1":"audio/embarrassed_ex1.mp3","img1":"images/embarrassed_1.png","img2":"images/embarrassed_2.png"},{"word":"confused","ipa":"/kənˈfjuːzd/","image_prompts":["A maze with many paths, some leading to dead ends, overhead view","A tangled ball of yarn with multiple colors, close-up shot"],"image_desc_en":"A maze and tangled yarn, representing a state of confusion.","image_desc_cn":"迷宫和缠绕的纱线，代表困惑的状态。","meaning_cn":"adj. 困惑的；糊涂的","usage":"形容词 adj.","collocations":"be confused about, feel confused, look confused","preposition_combos":"confused about/by/with","examples":[{"en":"I felt confused after the teacher explained the math problem again.","cn":"老师又解释了一遍数学题，我还是感到很困惑。"},{"en":"She looked confused when she saw the unexpected birthday party.","cn":"当她看到意想不到的生日派对时，她看起来很困惑。"}],"socratic_questions":[{"question":"当你听不懂老师讲课的内容时，你感觉怎么样？","answer_hint":"描述一种不理解、摸不着头脑的状态。"}],"fill_blank":{"sentences":["He was ___ by the complicated instructions for assembling the furniture."],"options":["confused","exciting","boring","amused"],"correct_index":0},"audio":"audio/confused.mp3","audio_ex0":"audio/confused_ex0.mp3","audio_ex1":"audio/confused_ex1.mp3","img2":"images/confused_2.png","img1":"images/confused_1.png"},{"word":"formal","ipa":"/ˈfɔːrml/","image_prompts":["A black tie event with elegant decorations and sophisticated attire","A courtroom setting with a judge's bench and official documents"],"image_desc_en":"Illustrations representing a black tie event and a courtroom, symbolizing formality.","image_desc_cn":"描绘一个需要穿黑领结的活动和一个法庭的插图，象征着正式。","meaning_cn":"正式的，官方的","usage":"adj. ","collocations":"formal education, formal occasion, formal agreement","preposition_combos":"in a formal way","examples":[{"en":"We need to wear formal clothes for the graduation ceremony.","cn":"我们需要穿着正式的服装参加毕业典礼。"},{"en":"The meeting followed a formal agenda to ensure efficiency.","cn":"会议遵循正式的议程以确保效率。"}],"socratic_questions":[{"question":"参加毕业典礼或者重要的颁奖典礼，着装应该是什么样的？","answer_hint":"这种场合需要遵守一定的着装规范，不能过于随意。"}],"fill_blank":{"sentences":["The school has a ___ dress code for special events."],"options":["formal","casual","funny","simple"],"correct_index":0},"audio":"audio/formal.mp3","audio_ex0":"audio/formal_ex0.mp3","audio_ex1":"audio/formal_ex1.mp3","img1":"images/formal_1.png","img2":"images/formal_2.png"},{"word":"curry","ipa":"/ˈkʌri/","image_prompts":["A bowl of yellow curry with rice and vegetables, steam rising","Various spices arranged on a wooden table, including turmeric, cumin, and coriander"],"image_desc_en":"A bowl of curry and spices.","image_desc_cn":"一碗咖喱和各种香料。","meaning_cn":"n. 咖喱；咖喱粉；v. 用咖喱调味","usage":"n. (复数 curries) ; v. (过去式 curried, 过去分词 curried)","collocations":"chicken curry, vegetable curry, curry powder","preposition_combos":"curry with rice, curry for dinner","examples":[{"en":"My mom makes delicious chicken curry, and I love it.","cn":"我妈妈做的咖喱鸡肉非常美味，我喜欢它。"},{"en":"Let's use some curry powder to spice up the potatoes.","cn":"我们用一些咖喱粉来给土豆增加风味吧。"}],"socratic_questions":[{"question":"如果你想给米饭增加一种浓郁的异国风味，你会选择什么调料？","answer_hint":"这种调料通常是黄色或棕色的，并且混合了多种香料。"}],"fill_blank":{"sentences":["She likes to add a little ___ to her soup for extra flavor."],"options":["curry","salt","sugar","pepper"],"correct_index":0},"audio":"audio/curry.mp3","audio_ex0":"audio/curry_ex0.mp3","audio_ex1":"audio/curry_ex1.mp3","img1":"images/curry_1.png","img2":"images/curry_2.png"},{"word":"rude","ipa":"/ruːd/","image_prompts":["A door slammed shut with excessive force, shaking the frame","A loud, blaring car horn in a quiet residential neighborhood"],"image_desc_en":"Illustrations depicting impolite or inconsiderate actions.","image_desc_cn":"描绘粗鲁或不体谅行为的插图。","meaning_cn":"粗鲁的，无礼的","usage":"adj.","collocations":"be rude to, rude behavior, rude comment","preposition_combos":"rude to sb","examples":[{"en":"It is rude to talk with your mouth full of food.","cn":"嘴里塞满食物说话是很粗鲁的。"},{"en":"He made a rude comment about her new hairstyle yesterday.","cn":"他昨天对她的新发型做了个粗鲁的评论。"}],"socratic_questions":[{"question":"如果你看到有人打断别人说话，你会觉得他怎么样？","answer_hint":"这个词形容缺乏礼貌，不尊重他人的行为。"}],"fill_blank":{"sentences":["It's considered ___ to interrupt someone when they are speaking."],"options":["rude","polite","kind","generous"],"correct_index":0},"audio":"audio/rude.mp3","audio_ex0":"audio/rude_ex0.mp3","audio_ex1":"audio/rude_ex1.mp3","img1":"images/rude_1.png"},{"word":"uncommon","ipa":"/ʌnˈkɒmən/","image_prompts":["A collection of ordinary pebbles with one brightly colored, uniquely shaped stone","A field of green grass with a single, vibrant purple flower standing out"],"image_desc_en":"Illustrations showing something not frequently seen or found.","image_desc_cn":"展示不常见或罕见事物的插图。","meaning_cn":"不常见的，罕见的","usage":"adj.","collocations":"uncommon ability, uncommon occurrence, relatively uncommon","preposition_combos":"uncommon for","examples":[{"en":"It is uncommon to see snow in this area during summer.","cn":"在这个地区，夏天看到雪是不常见的。"},{"en":"She has an uncommon talent for playing the piano beautifully.","cn":"她有一种不常见的才能，能把钢琴弹得很美。"}],"socratic_questions":[{"question":"如果一个现象发生的频率很低，我们通常会用什么词来形容它？","answer_hint":"这个词表示某事不是经常发生的，比较少见。"}],"fill_blank":{"sentences":["It's ___ to find such a well-preserved ancient artifact."],"options":["uncommon","common","usual","typical"],"correct_index":0},"audio":"audio/uncommon.mp3","audio_ex0":"audio/uncommon_ex0.mp3","audio_ex1":"audio/uncommon_ex1.mp3","img1":"images/uncommon_1.png","img2":"images/uncommon_2.png"},{"word":"palm","ipa":"/pɑːm/","image_prompts":["A close-up of a hand showing the lines on the palm, soft lighting","A tropical beach with tall palm trees swaying in the breeze, sunny day"],"image_desc_en":"A hand's palm and tropical palm trees.","image_desc_cn":"手掌和热带棕榈树。","meaning_cn":"n. 手掌；棕榈树","usage":"n. (pl. palms); v. (过去式 palmed, 过去分词 palmed)","collocations":"palm tree, in the palm of your hand","preposition_combos":"in the palm of","examples":[{"en":"I felt a tickle in the palm of my hand.","cn":"我感到手掌心里有点痒。"},{"en":"The island is famous for its beautiful palm trees.","cn":"这个岛屿以其美丽的棕榈树而闻名。"}],"socratic_questions":[{"question":"当你伸出手时，你用来拿东西的身体部位是什么？或者，哪种树经常在热带海滩上看到？","answer_hint":"一个用来抓握，另一个是热带植物。"}],"fill_blank":{"sentences":["She read my future by looking at the lines on my ___."],"options":["palm","ankle","elbow","wrist"],"correct_index":0},"audio":"audio/palm.mp3","audio_ex0":"audio/palm_ex0.mp3","audio_ex1":"audio/palm_ex1.mp3","img1":"images/palm_1.png","img2":"images/palm_2.png"},{"word":"namaste","ipa":"/ˈnɑːməsteɪ/","image_prompts":["Hands pressed together in a prayer position, soft lighting, focus on hands","A sign with the word 'Namaste' written in elegant script, against a backdrop of a peaceful sunset"],"image_desc_en":"Hands in prayer position; 'Namaste' sign at sunset.","image_desc_cn":"双手合十祈祷姿势；日落背景下的“Namaste”标志。","meaning_cn":"合十礼；您好（印度的一种问候方式）","usage":"n. / interj.","collocations":"offer namaste, greet with namaste","preposition_combos":"with namaste","examples":[{"en":"She greeted her yoga teacher with a respectful 'namaste'.","cn":"她用尊敬的“合十礼”问候她的瑜伽老师。"},{"en":"We bowed our heads and said 'namaste' at the end of class.","cn":"在课的结尾，我们低下头并说了“合十礼”。"}],"socratic_questions":[{"question":"在瑜伽课结束时，你通常会用什么手势和语言来表达尊重和感谢？","answer_hint":"这是一种源自印度的问候方式，通常伴随着双手合十的动作。"}],"fill_blank":{"sentences":["The monk offered a gentle ___ to the visitors, welcoming them.","We greeted each other with a warm ___ after the yoga session."],"options":["namaste","hello","goodbye","salute"],"correct_index":0},"audio":"audio/namaste.mp3","audio_ex0":"audio/namaste_ex0.mp3","audio_ex1":"audio/namaste_ex1.mp3","img1":"images/namaste_1.png","img2":"images/namaste_2.png"},{"word":"fork","ipa":"/fɔːrk/","image_prompts":["A stainless steel fork resting on a white ceramic plate","A close-up of a fork piercing a piece of grilled steak"],"image_desc_en":"Images depicting a fork on a plate and piercing steak.","image_desc_cn":"展示餐盘上的叉子和叉子叉牛排的图片。","meaning_cn":"n. 叉子","usage":"n. (复数 forks); v. (过去式 forked, 过去分词 forked)","collocations":"use a fork, fork in the road","preposition_combos":"with a fork","examples":[{"en":"Please use a fork to eat your noodles; it's more polite.","cn":"请用叉子吃你的面条；这样更有礼貌。"},{"en":"I need a fork to eat this cake; a spoon is not suitable.","cn":"我需要一把叉子来吃这个蛋糕；用勺子不合适。"}],"socratic_questions":[{"question":"吃意大利面时，除了筷子和勺子，还可以用什么餐具？","answer_hint":"一种有尖齿的餐具，用于叉起食物。"}],"fill_blank":{"sentences":["She used a ___ to pick up the salad from her plate."],"options":["fork","spoon","knife","chopstick"],"correct_index":0},"audio":"audio/fork.mp3","audio_ex0":"audio/fork_ex0.mp3","audio_ex1":"audio/fork_ex1.mp3","img2":"images/fork_2.png","img1":"images/fork_1.png"},{"word":"Indian","ipa":"/ˈɪndiən/","image_prompts":["A map of India with its flag colors highlighted, geographic details","A variety of spices arranged on a wooden table, vibrant colors and textures"],"image_desc_en":"A map of India and various spices.","image_desc_cn":"印度地图和各种香料。","meaning_cn":"印度的；印度人的；印度语的","usage":"adj.","collocations":"Indian food, Indian culture, Indian Ocean","preposition_combos":"from India, in India","examples":[{"en":"We tried some delicious Indian food at the new restaurant downtown.","cn":"我们在市中心的新餐厅尝试了一些美味的印度食物。"},{"en":"She is studying Indian history at the university this semester.","cn":"她这学期在大学学习印度历史。"}],"socratic_questions":[{"question":"如果你想描述一个来自新德里的人，你会用哪个形容词？","answer_hint":"这个形容词用来描述与印度有关的事物或人。"}],"fill_blank":{"sentences":["The Taj Mahal is a famous ___ landmark located in Agra."],"options":["Indian","Italian","American","British"],"correct_index":0},"audio":"audio/Indian.mp3","audio_ex0":"audio/Indian_ex0.mp3","audio_ex1":"audio/Indian_ex1.mp3","img2":"images/Indian_2.png","img1":"images/Indian_1.png"},{"word":"manner","ipa":"/ˈmænər/","image_prompts":["A table setting with elegant silverware and neatly folded napkins, indicating proper etiquette","A series of well-written thank-you notes, each with a different colored envelope"],"image_desc_en":"Illustrations representing proper etiquette and polite behavior.","image_desc_cn":"代表适当礼仪和礼貌行为的插图。","meaning_cn":"n. 方式；礼貌，规矩","usage":"n. (pl. manners)","collocations":"in a manner; good manners; bad manners","preposition_combos":"in a ... manner","examples":[{"en":"She dealt with the difficult situation in a calm manner.","cn":"她以冷静的方式处理了那个棘手的情况。"},{"en":"It is important to teach children good manners at a young age.","cn":"从小教导孩子良好的礼仪非常重要。"}],"socratic_questions":[{"question":"当你在公共场合吃饭时，应该注意什么？","answer_hint":"这个词指的是你在社交场合表现出的行为规范。"}],"fill_blank":{"sentences":["He has a strange ___ of speaking; it's hard to understand him."],"options":["manner","matter","machine","material"],"correct_index":0},"audio":"audio/manner.mp3","audio_ex0":"audio/manner_ex0.mp3","audio_ex1":"audio/manner_ex1.mp3","img1":"images/manner_1.png","img2":"images/manner_2.png"},{"word":"table manners","ipa":"/ˈteɪbl ˈmænərz/","image_prompts":["A neatly set dining table with a fork and knife placed correctly on either side of a plate, a folded napkin beside the plate","An overhead shot of a place setting with a diagram showing the proper use of each utensil, a wine glass, and a water glass"],"image_desc_en":"Proper table setting and etiquette.","image_desc_cn":"餐桌礼仪和正确的餐具摆放。","meaning_cn":"餐桌礼仪","usage":"n. (plural)","collocations":"good table manners, bad table manners, teach table manners","preposition_combos":"at the table","examples":[{"en":"It's important to have good table manners when eating out.","cn":"在外面吃饭时，拥有良好的餐桌礼仪非常重要。"},{"en":"My parents taught me table manners when I was a child.","cn":"我小时候，我的父母教我餐桌礼仪。"}],"socratic_questions":[{"question":"在正式场合，如何正确使用刀叉和餐巾？","answer_hint":"这与用餐时应遵守的礼节有关。"}],"fill_blank":{"sentences":["Knowing ___ is crucial when attending formal dinners with important guests."],"options":["table manners","body language","communication skills","social media"],"correct_index":0},"audio":"audio/table_manners.mp3","audio_ex0":"audio/table_manners_ex0.mp3","audio_ex1":"audio/table_manners_ex1.mp3","img1":"images/table_manners_1.png","img2":"images/table_manners_2.png"},{"word":"confusing","ipa":"/kənˈfjuːzɪŋ/","image_prompts":["A maze with many paths, some leading to dead ends, overhead view","A complex flowchart with arrows pointing in multiple directions, labeled 'Process'"],"image_desc_en":"A maze and a complex flowchart represent something confusing.","image_desc_cn":"一个迷宫和一个复杂的流程图，代表令人困惑的事物。","meaning_cn":"adj. 令人困惑的，难以理解的","usage":"形容词 confuse 的现在分词形式，表示某事物或情况使人感到困惑。","collocations":"confusing situation, confusing question, confusing instructions","preposition_combos":"confusing to","examples":[{"en":"The teacher's explanation was very confusing, so I asked questions.","cn":"老师的解释非常令人困惑，所以我问了问题。"},{"en":"This math problem is really confusing; I need some help.","cn":"这道数学题真令人困惑；我需要一些帮助。"}],"socratic_questions":[{"question":"当你读到一段文字，完全不明白它在说什么时，你会用什么词来形容这段文字？","answer_hint":"这段文字让你感到迷茫，无法理解。"}],"fill_blank":{"sentences":["The instructions for the game were so ___ that nobody could play it."],"options":["confusing","excited","interesting","boring"],"correct_index":0},"audio":"audio/confusing.mp3","audio_ex0":"audio/confusing_ex0.mp3","audio_ex1":"audio/confusing_ex1.mp3","img2":"images/confusing_2.png","img1":"images/confusing_1.png"},{"word":"unless","ipa":"/ənˈles/","image_prompts":["A closed gate with a sign that reads 'No Entry'","A dark cloud covering a sunny landscape, suggesting a condition"],"image_desc_en":"A closed gate and a dark cloud symbolizing a condition.","image_desc_cn":"紧闭的大门和乌云象征着某种条件。","meaning_cn":"除非，如果不","usage":"连词 conj.","collocations":"unless otherwise stated, unless necessary, unless required","preposition_combos":"","examples":[{"en":"I won't go to the party unless you go with me.","cn":"除非你和我一起去，否则我不会去参加聚会。"},{"en":"She will fail the exam unless she studies very hard.","cn":"除非她非常努力地学习，否则她考试会不及格。"}],"socratic_questions":[{"question":"如果明天下雨，我们就不去野餐。什么情况下我们会去野餐？","answer_hint":"需要一个表示“只有在…情况下”的词。"}],"fill_blank":{"sentences":["We will stay at home ___ the weather improves tomorrow."],"options":["unless","if","because","although"],"correct_index":0},"audio":"audio/unless.mp3","audio_ex0":"audio/unless_ex0.mp3","audio_ex1":"audio/unless_ex1.mp3","img1":"images/unless_1.png","img2":"images/unless_2.png"},{"word":"proper","ipa":"/ˈprɒpər/","image_prompts":["A neatly arranged dining table with silverware and a tablecloth, soft lighting","A graduation ceremony with students wearing gowns and caps, formal setting"],"image_desc_en":"A well-organized dining table; a graduation ceremony.","image_desc_cn":"组织良好的餐桌；毕业典礼。","meaning_cn":"合适的，恰当的；正确的，得体的","usage":"adj. properly (adv.)","collocations":"proper noun, proper way, proper behavior","preposition_combos":"proper for","examples":[{"en":"It is proper to thank your teachers for their help.","cn":"感谢老师的帮助是合适的。"},{"en":"He didn't wear proper shoes for hiking in the mountains.","cn":"他没有穿合适的鞋子去山区徒步。"}],"socratic_questions":[{"question":"在正式场合，什么样的穿着和行为是符合要求的？","answer_hint":"考虑在特定情境下，什么是最适合或最得体的。"}],"fill_blank":{"sentences":["It's important to follow the ___ procedures when applying for a visa."],"options":["proper","improper","easy","hard"],"correct_index":0},"audio":"audio/proper.mp3","audio_ex0":"audio/proper_ex0.mp3","audio_ex1":"audio/proper_ex1.mp3","img1":"images/proper_1.png"},{"word":"sit up","ipa":"/ˌsɪt ˈʌp/","image_prompts":["A person's silhouette in bed, pillows propped up, indicating an upright position","A mechanical doll with a lever, demonstrating the action of straightening from a lying position"],"image_desc_en":"Illustrations showing the action of sitting upright from a lying position.","image_desc_cn":"图示展示了从躺着的状态坐直的动作。","meaning_cn":"坐起来；（通常指从躺着或靠着的状态）坐直","usage":"v. (过去式 sat up, 过去分词 sat up)","collocations":"sit up straight, sit up in bed","preposition_combos":"sit up from","examples":[{"en":"I told him to sit up straight during the exam.","cn":"我告诉他在考试时要坐直。"},{"en":"She had to sit up late to finish her homework.","cn":"她不得不熬夜完成作业。"}],"socratic_questions":[{"question":"当你躺在床上看书，觉得脖子不舒服，你会怎么做？","answer_hint":"这个动作是从躺着到直立的状态转变。"}],"fill_blank":{"sentences":"The doctor told him to ___ straight to improve his posture.","options":["sit up","stand up","lie down","bend over"],"correct_index":0},"audio":"audio/sit_up.mp3","audio_ex0":"audio/sit_up_ex0.mp3","audio_ex1":"audio/sit_up_ex1.mp3","img1":"images/sit_up_1.png","img2":"images/sit_up_2.png"},{"word":"keep off","ipa":"/kiːp ɒf/","image_prompts":["A sign with footprints crossed out on a lawn, indicating 'keep off the grass'","A barrier tape surrounding a freshly painted bench, preventing people from touching it"],"image_desc_en":"A sign indicating 'keep off' and a barrier tape preventing contact.","image_desc_cn":"指示“禁止进入”的标志和防止接触的警戒带。","meaning_cn":"不接近；远离；勿踩","usage":"v. (kept off, kept off) to avoid going onto or touching something","collocations":"keep off the grass, keep off the topic","preposition_combos":"keep off (from)","examples":[{"en":"Please keep off the grass; it has just been watered.","cn":"请勿踩踏草坪；刚浇过水。"},{"en":"We should keep off the topic of politics at dinner.","cn":"我们晚饭时应该避开政治话题。"}],"socratic_questions":[{"question":"如果你看到一块牌子，上面画着一个被划掉的脚印，这表示什么？","answer_hint":"这个牌子是让你不要靠近或踩踏某个区域。"}],"fill_blank":{"sentences":["The sign says to ___ the wet paint on the wall."],"options":["keep off","look at","clean up","turn on"],"correct_index":0},"audio":"audio/keep_off.mp3","audio_ex0":"audio/keep_off_ex0.mp3","audio_ex1":"audio/keep_off_ex1.mp3","img1":"images/keep_off_1.png","img2":"images/keep_off_2.png"},{"word":"elbow","ipa":"/ˈelboʊ/","image_prompts":["A close-up of a human arm bending at the elbow joint, skin texture visible","A pipe fitting with a 90-degree elbow shape, connecting two sections of metal pipe"],"image_desc_en":"Images depicting a human elbow joint and a pipe fitting elbow.","image_desc_cn":"图片分别展示了人的肘关节和一个管道弯头。","meaning_cn":"n. 肘部；（管子的）弯头","usage":"n. (pl. elbows)","collocations":"at the elbow, elbow grease, elbow room","preposition_combos":"on the elbow, with the elbow","examples":[{"en":"She accidentally hit her elbow on the corner of the desk.","cn":"她不小心把肘部撞到了桌子的角上。"},{"en":"The plumber used an elbow to connect the pipes under the sink.","cn":"水管工用一个弯头连接了水槽下面的管道。"}],"socratic_questions":[{"question":"当你手臂弯曲时，中间突出的关节是什么？","answer_hint":"是手臂可以弯曲的关键部位，位于上下臂之间。"}],"fill_blank":{"sentences":["He leaned on the table, resting his ___ on the surface."],"options":["elbow","knee","ankle","wrist"],"correct_index":0},"audio":"audio/elbow.mp3","audio_ex0":"audio/elbow_ex0.mp3","audio_ex1":"audio/elbow_ex1.mp3","img1":"images/elbow_1.png","img2":"images/elbow_2.png"},{"word":"serving","ipa":"/ˈsɜːrvɪŋ/","image_prompts":["A silver platter with a slice of cake on it, ready to be served","A tennis ball being served over a net, motion blur"],"image_desc_en":"A portion of food ready to be given or the act of delivering a ball in sports.","image_desc_cn":"一份准备好的食物，或体育运动中发球的动作。","meaning_cn":"n. 一份食物；v. (serve的现在分词) 服务，发球","usage":"n. / v. (serve v. (过去式 served, 过去分词 served))","collocations":"a serving of, self-serving","preposition_combos":"serving at, serving on","examples":[{"en":"This restaurant is famous for serving delicious and fresh seafood.","cn":"这家餐厅以提供美味新鲜的海鲜而闻名。"},{"en":"He is serving the volleyball with great power and accuracy.","cn":"他正以极大的力量和准确性发排球。"}],"socratic_questions":[{"question":"在餐厅里，服务员会给你什么？或者在排球比赛中，运动员会做什么动作开始比赛？","answer_hint":"考虑食物的量词，或者体育比赛中开始的动作。"}],"fill_blank":{"sentences":["She is ___ a large piece of cake to her friend."],"options":["serving","served","serve","serves"],"correct_index":0},"audio":"audio/serving.mp3","audio_ex0":"audio/serving_ex0.mp3","audio_ex1":"audio/serving_ex1.mp3","img1":"images/serving_1.png","img2":"images/serving_2.png"},{"word":"chopstick","ipa":"/ˈtʃɒpstɪk/","image_prompts":["A pair of wooden chopsticks resting on a ceramic bowl filled with rice","Close-up of bamboo chopsticks picking up noodles from a steaming bowl"],"image_desc_en":"Images depicting chopsticks used for eating.","image_desc_cn":"描绘使用筷子吃饭的图像。","meaning_cn":"筷子","usage":"n. (复数 chopsticks)","collocations":"use chopsticks, a pair of chopsticks","preposition_combos":"with chopsticks","examples":[{"en":"I am not good at using chopsticks to eat noodles.","cn":"我不擅长用筷子吃面条。"},{"en":"These are my favorite chopsticks because they are easy to hold.","cn":"这些是我最喜欢的筷子，因为它们很容易握住。"}],"socratic_questions":[{"question":"在东亚，人们通常用什么工具来夹起食物送入口中，而不是刀叉？","answer_hint":"这是一种细长的、通常成对使用的餐具，用于夹取食物。"}],"fill_blank":{"sentences":["Could you pass me a pair of ___? I want to eat noodles."],"options":["chopsticks","forks","spoons","knives"],"correct_index":0},"audio":"audio/chopstick.mp3","audio_ex0":"audio/chopstick_ex0.mp3","audio_ex1":"audio/chopstick_ex1.mp3","img1":"images/chopstick_1.png","img2":"images/chopstick_2.png"},{"word":"serving chopsticks","ipa":"/ˈsɜːrvɪŋ ˈtʃɑːpstɪks/","image_prompts":["A pair of long wooden chopsticks resting on a ceramic serving dish filled with colorful vegetables.","Close-up of extra-long chopsticks picking up noodles from a large bowl, steam rising."],"image_desc_en":"Serving chopsticks used to pick up food from a shared dish.","image_desc_cn":"用于从共享菜肴中夹取食物的公筷。","meaning_cn":"公筷","usage":"noun (复数 serving chopsticks)","collocations":"use serving chopsticks, a pair of serving chopsticks","preposition_combos":"with serving chopsticks, for serving chopsticks","examples":[{"en":"We should use serving chopsticks to keep our food safe.","cn":"我们应该使用公筷来保证食物的安全。"},{"en":"Please pass me the serving chopsticks; I want some vegetables.","cn":"请把公筷递给我；我想夹一些蔬菜。"}],"socratic_questions":[{"question":"在聚餐时，为了卫生，我们不直接用自己的筷 ,"preposition_combos":"embarrassing for","examples":[{"en":"It was an embarrassing moment when I forgot her name again.","cn":"我又一次忘记她的名字，那真是令人尴尬的时刻。"},{"en":"Making spelling mistakes in public can be quite embarrassing for anyone.","cn":"在公共场合犯拼写错误对任何人来说都可能相当尴尬。"}],"socratic_questions":[{"question":"想象一下，你不小心在全班同学面前摔倒了，你会感觉怎么样？","answer_hint":"描述的是一种出丑，想找一个形容词表示这种感觉。"}],"fill_blank":{"sentences":["It was an ___ experience to realize I had the wrong presentation slides."],"options":["embarrassing","embarrassed","embarrass","embarrassment"],"correct_index":0},"audio":"audio/embarrassing.mp3","audio_ex0":"audio/embarrassing_ex0.mp3","audio_ex1":"audio/embarrassing_ex1.mp3","img1":"images/embarrassing_1.png","img2":"images/embarrassing_2.png"},{"word":"be used to","ipa":"/biː juːzd tuː/","image_prompts":["A well-worn leather armchair in a cozy living room, a book resting on the armrest","A pair of worn hiking boots covered in mud, resting on a porch"],"image_desc_en":"Objects showing familiarity and comfort.","image_desc_cn":"展示熟悉和舒适的物品。","meaning_cn":"习惯于，适应于","usage":"v. 表示习惯于某种事物或某种状态。","collocations":"be used to doing sth; be used to sth","preposition_combos":"be used to + 名词/动名词","examples":[{"en":"I am used to waking up early for school every day.","cn":"我习惯了每天早起上学。"},{"en":"She is used to the noise because she lives near the airport.","cn":"她习惯了噪音，因为她住在机场附近。"}],"socratic_questions":[{"question":"如果你每天都做同一件事，你会怎么样？","answer_hint":"表示对某事已经习以为常，不再感到不适应。"}],"fill_blank":{"sentences":["They ___ living in the countryside after spending years in the city."],"options":["are used to","used to","use to","are use to"],"correct_index":0},"audio":"audio/be_used_to.mp3","audio_ex0":"audio/be_used_to_ex0.mp3","audio_ex1":"audio/be_used_to_ex1.mp3","img1":"images/be_used_to_1.png","img2":"images/be_used_to_2.png"},{"word":"cultural","ipa":"/ˈkʌltʃərəl/","image_prompts":["An exhibit in a museum displaying artifacts from different civilizations, showcasing diverse traditions","A as happy to ___ her old friend after many years."],"options":["heard from","heard of","listened to","spoken to"],"correct_index":0},"audio":"audio/hear_from.mp3","audio_ex0":"audio/hear_from_ex0.mp3","audio_ex1":"audio/hear_from_ex1.mp3","img1":"images/hear_from_1.png","img2":"images/hear_from_2.png"},{"word":"custom","ipa":"/ˈkʌstəm/","image_prompts":["A traditional Japanese tea ceremony with participants in kimonos","A brightly decorated Day of the Dead altar with candles and offerings"],"image_desc_en":"Traditional practices or ceremonies specific to a culture or group.","image_desc_cn":"特定文化或群体的传统习俗或仪式。","meaning_cn":"风俗，习俗","usage":"n. (customs)","collocations":"local custom, ancient custom, follow a custom","preposition_combos":"according to custom","examples":[{"en":"It is a local custom to give gifts during the festival.","cn":"在节日期间赠送礼物是当地的风俗。"},{"en":"We should respect the customs of different countries when traveling.","cn":"旅行时我们应该尊重不同国家的风俗。"}],"socratic_questions":[{"question":"在特定地区或人群中，人们世代相传并遵守的行为或庆祝方式是什么？","answer_hint":"它指的是一种长期存在的社会行为模式。"}],"fill_blank":{"sentences":["It's a local ___ to eat mooncakes during the Mid-Autumn Festival."],"options":["custom","habit","rule","law"],"correct_index":0},"audio":"audio/custom.mp3","audio_ex0":"audio/custom_ex0.mp3","audio_ex1":"audio/custom_ex1.mp3","img1":"images/custom_1.png","img2":"images/custom_2.png"},{"word":"occasion","ipa":"/əˈkeɪʒən/","image_prompts":["A calendar page with a specific date circled in red, signifying a special event","A formal invitation card with elegant script, indicating a significant event"],"image_desc_en":"A circled date on a calendar and a formal invitation.","image_desc_cn":"日历上被圈出的日期和正式的邀请函。","meaning_cn":"场合，时机，事件","usage":"n.","collocations":"on occasion, special occasion, take the occasion","preposition_combos":"on the occasion of","examples":[{"en":"This is a good occasion to thank all of you.","cn":"这是一个感谢你们所有人的好时机。"},{"en":"We met on several occasions during our trip ollocations":"whether or not, whether...or","preposition_combos":"depends on whether","examples":[{"en":"I'm not sure whether I can go to the party tonight.","cn":"我不确定今晚是否能去参加聚会。"},{"en":"We will go hiking whether it rains or not tomorrow.","cn":"无论明天下雨与否，我们都会去徒步旅行。"}],"socratic_questions":[{"question":"当你面临两个选择，但不确定哪个更好时，你会用哪个词来表达这种不确定性？","answer_hint":"这个词表示存在两种或多种可能性，需要做出选择。"}],"fill_blank":{"sentences":["I don't know ___ she will come to school tomorrow or stay at home."],"options":["whether","weather","if","that"],"correct_index":0},"audio":"audio/whether.mp3","audio_ex0":"audio/whether_ex0.mp3","audio_ex1":"audio/whether_ex1.mp3","img1":"images/whether_1.png","img2":"images/whether_2.png"},{"word":"married","ipa":"/ˈmærid/","image_prompts":["Two wedding rings intertwined on a silk cushion, soft focus","A vintage photograph of a wedding cake with multiple tiers, buttercream frosting"],"image_desc_en":"Wedding rings and a wedding cake.","image_desc_cn":"结婚戒指和结婚蛋糕。","meaning_cn":"已婚的；结婚的 v. (过去式 married, 过去分词 married)","usage":"adj. / v.","collocations":"get married, be married to","preposition_combos":"married to","examples":[{"en":"My parents got married in a small church in the countryside.","cn":"我的父母在乡下的一间小教堂里结婚了。"},{"en":"She has been married to him for over twenty years.","cn":"她和他结婚已经超过二十年了。"}],"socratic_questions":[{"question":"描述一对新人交换戒指的场景，他们之间是什么关系？","answer_hint":"他们通过法律或仪式结合在一起，成为伴侣。"}],"fill_blank":{"sentences":["They are a ___ couple and seem very happy together."],"options":["married","marry","marrying","marriage"],"correct_index":0},"audio":"audio/married.mp3","audio_ex0":"audio/married_ex0.mp3","audio_ex1":"audio/married_ex1.mp3","img1":"images/married_1.png","img2":"images/married_2.png"},{"word":"merci","ipa":"/mɜːrˈsiː/","image_prompts":["An elegant script of 'merci' written with a fountain pen on parchment paper","A pile of thank-you cards tied with a ribbon, each card displaying 'merci'"],"image_desc_en":"Illustrations representing 'merci' through thank-you notes and elegant script.","image_desc_cn":"通过感谢信和优雅的文字来表示“merci”的插图。","meaning_cn":"谢谢 (法语)","usage":"interj. (法语) 谢谢","collocations":"dire merci, un grand merci","preposition_combos":"merci à","examples":[{"en":"Merci beaucoup for your help with my difficult math problem.","cn":"非常感谢你帮助我解决困难的数学问题。"},{"en":"I said 'merci' to the kind stranger who found my lost wallet.","cn":"我对找到我丢失钱包的好心陌生人说了“谢谢”。"}],"socratic_questions":[{"question":"如果你在法国收到礼物，你会说什么来表达感谢？","answer_hint":"这是一个法语词汇，表示感谢。"}],"fill_blank":{"sentences":["She said ___ to the waiter for bringing her the delicious meal."],"options":["merci","hello","goodbye","please"],"correct_index":0},"audio":"audio/merci.mp3","audio_ex0":"audio/merci_ex0.mp3","audio_ex1":"audio/merci_ex1.mp3","img1":"images/merci_1.png","img2":"images/merci_2.png"},{"word":"go a long way","ipa":"/ɡoʊ ə lɔŋ ˈweɪ/","image_prompts":["A winding road stretching far into the distance, vanishing point perspective","A small sapling growing into a tall, strong tree over many years, time-lapse"],"image_desc_en":"A winding road stretching into the distance; a sapling growing into a tall tree.","image_desc_cn":"一条蜿蜒的道路延伸到远方；一棵树苗长成一棵高大的树。","meaning_cn":"对...有很大帮助；有很大影响；进展顺利","usage":"v. phr. (过去式 went a long way, 过去分词 gone a long way)","collocations":"go a long way towards, go a long way in","preposition_combos":"towards, in","examples":[{"en":"Practicing English every day will go a long way toward improving skills.","cn":"每天练习英语将对提高技能有很大帮助。"},{"en":"His hard work went a long way in helping the team win.","cn":"他的努力对帮助团队获胜有很大影响。"}],"socratic_questions":[{"question":"如果你每天坚持锻炼，对你的健康会有什么积极作用？","answer_hint":"这个短语表示某事对结果产生了显著的积极影响或帮助。"}],"fill_blank":{"sentences":["Your kindness will ___ towards making everyone feel welcome."],"options":["go a long way","go away","go along","go by"],"correct_index":0},"audio":"audio/go_a_long_way.mp3","audio_ex0":"audio/go_a_long_way_ex0.mp3","audio_ex1":"audio/go_a_long_way_ex1.mp3","img1":"images/go_a_long_way_1.png","img2":"images/go_a_long_way_2.png"},{"word":"au revoir","ipa":"/ˌɔː rəˈvwɑːr/","image_prompts":["A handwritten note with 'Au revoir' written in elegant script on parchment paper","A vintage postcard with a Parisian scene and 'Au revoir' stamped on it"],"image_desc_en":"A farewell message in French.","image_desc_cn":"法语的告别语。","meaning_cn":"再见（法语）","usage":"interj. (法语)","collocations":"say au revoir, bid au revoir","preposition_combos":"au revoir to","examples":[{"en":"She said 'au revoir' to her friends before leaving for Paris.","cn":"她在去巴黎之前对朋友们说了“再见”。"},{"en":"We waved and shouted 'au revoir' as the train pulled away.","cn":"当火车开走时，我们挥手并喊着“再见”。"}],"socratic_questions":[{"question":"如果你要用一句法语来表达“再见”，你会说什么？","answer_hint":"这是一个在法语中常用的告别用语，表示希望很快再次见面。"}],"fill_blank":{"sentences":["After a wonderful trip, they said ___ to France with smiles."],"options":["au revoir","hello","good morning","good night"],"correct_index":0},"audio":"audio/au_revoir.mp3","audio_ex0":"audio/au_revoir_ex0.mp3","audio_ex1":"audio/au_revoir_ex1.mp3","img1":"images/au_revoir_1.png","img2":"images/au_revoir_2.png"},{"word":"get along","ipa":"/ɡet əˈlɔːŋ/","image_prompts":["Two puzzle pieces fitting perfectly together, seamless connection","A group of colorful gears turning smoothly in sync, mechanical harmony"],"image_desc_en":"Puzzle pieces fitting together; gears turning smoothly.","image_desc_cn":"拼图碎片完美契合；齿轮平稳转动。","meaning_cn":"相处融洽，进展顺利","usage":"v. (过去式 got along, 过去分词 got along)","collocations":"get along with someone, get along well, get along fine","preposition_combos":"get along with","examples":[{"en":"It's important to get along with your classmates at school.","cn":"在学校里，和你的同学相处融洽是很重要的。"},{"en":"Do you get along well with your family members at home?","cn":"你在家和你的家人相处得好吗？"}],"socratic_questions":[{"question":"当你和朋友在一起时，没有争吵，总是开心地玩耍，这是什么状态？","answer_hint":"描述的是一种和谐、友好的关系。"}],"fill_blank":{"sentences":["It's not always easy to ___ with everyone you meet."]," 如果一个地方有很多坏人，或者自然灾害频发，你会觉得怎么样？","answer_hint":"这个地方让人感到有危险，可能会受到伤害。"}],"fill_blank":{"sentences":["The old building was considered ___ after the earthquake."],"options":["unsafe","safety","safely","safe"],"correct_index":0},"audio":"audio/unsafe.mp3","audio_ex0":"audio/unsafe_ex0.mp3","audio_ex1":"audio/unsafe_ex1.mp3","img1":"images/unsafe_1.png","img2":"images/unsafe_2.png"},{"word":"informal","ipa":"/ɪnˈfɔːrml/","image_prompts":["A group of friends laughing together in a park, wearing casual clothing","A handwritten note on a piece of paper with a smiley face drawn on it"],"image_desc_en":"Illustrations depicting a relaxed social gathering and a casual handwritten note.","image_desc_cn":"描绘轻松社交聚会和随意手写便条的插图。","meaning_cn":"非正式的，不拘礼节的","usage":"adj.","collocations":"informal setting, informal conversation, informal clothes","preposition_combos":"in an informal way","examples":[{"en":"The party had an informal atmosphere, so everyone felt relaxed.","cn":"聚会气氛很轻松，所以每个人都感到放松。"},{"en":"We had an informal chat about our hobbies during the break.","cn":"休息期间，我们随意地聊了聊各自的爱好。"}],"socratic_questions":[{"question":"如果你和朋友们在公园里玩耍，穿着随意，说话也很轻松，这是什么场合？","answer_hint":"这种场合不需要正式的礼仪和服装。"}],"fill_blank":{"sentences":["The meeting was quite ___, allowing for open and relaxed discussion."],"options":["informal","formal","serious","official"],"correct_index":0},"audio":"audio/informal.mp3","audio_ex0":"audio/informal_ex0.mp3","audio_ex1":"audio/informal_ex1.mp3","img2":"images/informal_2.png"},{"word":"improper","ipa":"/ɪmˈprɒpər/","image_prompts":["A formal dining table set with silverware placed incorrectly, napkins crumpled","A sign indicating 'No Littering' next to a pile of trash overflowing from a bin"],"image_desc_en":"Incorrectly set table and overflowing trash can.","image_desc_cn":"餐桌餐具摆放错误和垃圾桶溢出。","meaning_cn":"不正确的，不适当的","usage":"adj.","collocations":"improper behavior, improper use, improper conduct","preposition_combos":"improper for, improper in","examples":[{"en":"It is improper to speak loudly in the library, so be quiet.","cn":"在图书馆大声说话是不合适的，所以请安静。"},{"en":"Using school computers for games is an improper use of resources.","cn":"用学校电脑玩游戏是不恰当的资源使用。"}],"socratic_questions":[{"question":"如果你在正式场合穿运动服，别人会怎么评价你的穿着？","answer_hint":"考虑与场合不符，不符合规范。"}],"fill_blank":{"sentences":["It's ___ to cheat on a test; it's against the rules."],"options":["improper","proper","easy","difficult"],"correct_index":0},"audio":"audio/improper.mp3","audio_ex0":"audio/improper_ex0.mp3","audio_ex1":"audio/improper_ex1.mp3","img1":"images/improper_1.png","img2":"images/improper_2.png"},{"word":"jeans","ipa":"/dʒiːnz/","image_prompts":["A neatly folded stack of blue denim jeans on a wooden shelf.","A pair of blue jeans hanging on a clothesline, blowing gently in the wind."],"image_desc_en":"A stack of jeans or a pair of jeans on a clothesline.","image_desc_cn":"一叠牛仔裤或挂在晾衣绳上的一条牛仔裤。","meaning_cn":"牛仔裤","usage":"n. (pl.)","collocations":"a pair of jeans, blue jeans, wear jeans","preposition_combos":"in jeans","examples":[{"en":"He likes to wear jeans and a T-shirt to school.","cn":"他喜欢穿牛仔裤和T恤衫去学校。"},{"en":"Are those new jeans? They look really good on you.","cn":"这是新的牛仔裤吗？你穿起来真好看。"}],"socratic_questions":[{"question":"描述一种由粗斜纹棉布制成的，通常是蓝色的裤子。","answer_hint":"这种裤子休闲舒适，适合日常穿着。"}],"fill_blank":{"sentences":["She always wears ___ when she goes hiking in the mountains."],"options":["jeans","skirts","shorts","dresses"],"correct_index":0},"audio":"audio/jeans.mp3","audio_ex0":"audio/jeans_ex0.mp3","audio_ex1":"audio/jeans_ex1.mp3","img1":"images/jeans_1.png","img2":"images/jeans_2.png"},{"word":"marry","ipa":"/ˈmæri/","image_prompts":["Two interlocking gold rings on a velvet cushion, soft focus","A wedding cake with two miniature figures on top, floral decorations"],"image_desc_en":"Images related to wedding and commitment.","image_desc_cn":"与婚礼和承诺相关的图像。","meaning_cn":"结婚，结合","usage":"v. (married, married)","collocations":"marry someone; get married; marry for love","preposition_combos":"marry to","examples":[{"en":"They plan to marry next summer in a beautiful garden.","cn":"他们计划明年夏天在一个美丽的花园里结婚。"},{"en":"She doesn't want to marry until she finishes her studies.","cn":"她不想在完成学业之前结婚。"}],"socratic_questions":[{"question":"两个人决定一起生活，并举行了婚礼，这是什么行为？","answer_hint":"这个词表示两个人正式结合，开始共同生活。"}],"fill_blank":{"sentences":["Do you think they will ___ after dating for so long?"],"options":["marry","divorce","argue","separate"],"correct_index":0},"audio":"audio/marry.mp3","audio_ex0":"audio/marry_ex0.mp3","audio_ex1":"audio/marry_ex1.mp3","img1":"images/marry_1.png","img2":"images/marry_2.png"},{"word":"congratulate","ipa":"/kənˈɡrætʃuleɪt/","image_prompts":["A golden trophy with confetti falling around it, celebratory atmosphere","A greeting card with 'Congratulations' written in elegant script, surrounded by flowers"],"image_desc_en":"Images depicting celebration and a congratulatory message.","image_desc_cn":"描绘庆祝和祝贺信息的图像。","meaning_cn":"祝贺，恭喜","usage":"v. (过去式 congratulated, 过去分词 congratulated); congratulation n.","collocations":"congratulate someone on something","preposition_combos":"on","examples":[{"en":"I want to congratulate you on your excellent exam results.","cn":"我想祝贺你取得的优异考试成绩。"},{"en":"We should congratulate her on winning the first prize in the contest.","cn":"我们应该祝贺她在比赛中获得一等奖。"}],"socratic_questions":[{"question":"当你的朋友取得了好成绩或完成了某项了不起的成就时，你会对他说什么？","answer_hint":"这个词表达了对他人的喜悦和赞赏。"}],"fill_blank":{"sentences":["We should ___ him on his success in the school project."],"options":["congratulate","apologize","thank","blame"],"correct_index":0},"audio":"audio/congratulate.mp3","audio_ex0":"audio/congratulate_ex0.mp3","audio_ex1":"audio/congratulate_ex1.mp3","img1":"images/congratulate_1.png","img2":"images/congratulate_2.png"},{"word":"Asian","ipa":"/ˈeɪʒn/","image_prompts":["A map highlighting the continent of Asia in vibrant colors","A collection of diverse cultural artifacts from various countries in Asia, such as a kimono, a pagoda, and a silk scarf"],"image_desc_en":"A map of Asia and Asian cultural artifacts.","image_desc_cn":"亚洲地图和亚洲文化文物。","meaning_cn":"亚洲的；亚洲人的","usage":"adj. relating to Asia or its people; n. a person from Asia","collocations":"Asian culture, Asian cuisine, Asian countries","preposition_combos":"from Asian countries","examples":[{"en":"She is an Asian student who studies very hard at school.","cn":"她是一名亚洲学生，在学校学习非常努力。"},{"en":"Many people enjoy eating Asian food because it is very delicious.","cn":"许多人喜欢吃亚洲食物，因为它非常美味。"}],"socratic_questions":[{"question":"如果一个人来自中国、日本或韩国，我们可以用哪个词来描述他们的种族或文化背景？","answer_hint":"这个词指的是亚洲大陆。"}],"fill_blank":{"sentences":["The restaurant serves delicious ___ dishes from different countries.","She is an ___ girl, and she loves her culture."],"options":["Asian","Europe","Africa","America"],"correct_index":0},"audio":"audio/Asian.mp3","audio_ex0":"audio/Asian_ex0.mp3","audio_ex1":"audio/Asian_ex1.mp3","img1":"images/Asian_1.png","img2":"images/Asian_2.png"},{"word":"tradition","ipa":"/trəˈdɪʃn/","image_prompts":["A family gathering around a decorated dining table during a holiday feast, candles lit","A black and white photograph of a historical ceremony with people in traditional clothing"],"image_desc_en":"A family gathering around a decorated dining table during a holiday feast, candles lit. A black and white photograph of a historical ceremony with people in traditional clothing.","image_desc_cn":"节日盛宴时，家人围坐在装饰好的餐桌旁，点着蜡烛。一张历史仪式的黑白照片，人们穿着传统服装。","meaning_cn":"传统；习俗","usage":"n.","collocations":"cultural tradition, family tradition, long-standing tradition","preposition_combos":"in the tradition of, according to tradition","examples":[{"en":"It's a tradition in my family to eat dumplings on New Year's Day.","cn":"在我的家庭，新年第一天吃饺子是一个传统。"},{"en":"The school has a tradition of holding a sports day every year.","cn":"学校每年都有举办运动会的传统。"}],"socratic_questions":[{"question":"过春节时，你家每年都会做什么？这种世代相传的行为可以称为什么？","answer_hint":"它指的是代代相传的习惯或信仰。"}],"fill_blank":{"sentences":["It is a long-standing ___ in our town to celebrate the harvest festival."],"options":["tradition","modern","invention","habit"],"correct_index":0},"audio":"audio/tradition.mp3","audio_ex0":"audio/tradition_ex0.mp3","audio_ex1":"audio/tradition_ex1.mp3","img1":"images/tradition_1.png","img2":"images/tradition_2.png"},{"word":"firstly","ipa":"/ˈfɜːrstli/","image_prompts":["A numbered list starting with '1' in bold, followed by a short phrase","A signpost with multiple directions, the first direction highlighted"],"image_desc_en":"Illustrations representing 'first' in a sequence or order.","image_desc_cn":"表示序列或顺序中“第一”的插图。","meaning_cn":"首先，第一","usage":"adv.","collocations":"firstly, secondly, thirdly; firstly, but","preposition_combos":"firstly in; firstly with","examples":[{"en":"Firstly, I want to thank everyone for coming to the meeting.","cn":"首先，我想感谢大家来参加会议。"},{"en":"Firstly, we need to gather all the necessary information for the project.","cn":"首先，我们需要收集项目所需的所有必要信息。"}],"socratic_questions":[{"question":"当你想列出几个要点，并且想从最重要的开始说起，你会用哪个词来引出第一个要点？","answer_hint":"这个词表示在顺序上是第一位的，用于引导听众或读者。"}],"fill_blank":{"sentences":["___, let's discuss the main issues of the project.","___, we should consider the cost of the materials."],"options":["Firstly","Finally","However","Therefore"],"correct_index":0},"audio":"audio/firstly.mp3","audio_ex0":"audio/firstly_ex0.mp3","audio_ex1":"audio/firstly_ex1.mp3","img1":"images/firstly_1.png","img2":"images/firstly_2.png"},{"word":"secondly","ipa":"/ˈsekəndli/","image_prompts":["A list of instructions numbered 1, then an arrow pointing to number 2 with emphasis","A flow chart showing the first step completed, then highlighting the second step"],"image_desc_en":"Illustrations showing the order of steps, emphasizing the second step in a process.","image_desc_cn":"图示步骤顺序，强调流程中的第二步。","meaning_cn":"第二，其次","usage":"adv.","collocations":"firstly, secondly, thirdly","preposition_combos":"","examples":[{"en":"Firstly, we need to plan; secondly, we should gather materials.","cn":"首先，我们需要计划；其次，我们应该收集材料。"},{"en":"I think, firstly, it's too expensive; secondly, it's not useful.","cn":"我认为，首先，它太贵了；其次，它没有用。"}],"socratic_questions":[{"question":"当你在陈述一系列理由或步骤时，如果已经说了第一个，接下来要说什么来引出第二个？","answer_hint":"这个词表示在顺序上是第二个。"}],"fill_blank":{"sentences":"We must consider the cost; _____, we need to check the quality.","options":["secondly","finally","initially","simply"],"correct_index":0},"audio":"audio/secondly.mp3","audio_ex0":"audio/secondly_ex0.mp3","audio_ex1":"audio/secondly_ex1.mp3"},{"word":"thirdly","ipa":"/ˈθɜːrdli/","image_prompts":["A list with three items, the third item highlighted with a bright color","A stack of papers, the third page slightly pulled out to show its position"],"image_desc_en":"Illustrations representing the third item in a sequence or list.","image_desc_cn":"表示序列或列表中第三项的插图。","meaning_cn":"第三，第三点","usage":"adv. 用于列举第三个原因、论点或步骤","collocations":"firstly, secondly, finally","preposition_combos":"N/A","examples":[{"en":"Firstly, study hard; secondly, ask questions; thirdly, review often.","cn":"首先，努力学习；其次，提出问题；第三，经常复习。"},{"en":"Firstly, plan your trip; secondly, book hotels; thirdly, pack bags.","cn":"首先，计划你的旅行；其次，预订酒店；第三，打包行李。"}],"socratic_questions":[{"question":"当你给出三个理由时，这是用来介绍第三个理由的词。","answer_hint":"这个词表示顺序中的第三个位置。"}],"fill_blank":{"sentences":["Firstly, we need food; secondly, water; ___, shelter is necessary."],"options":["thirdly","secondly","finally","initially"],"correct_index":0},"audio":"audio/thirdly.mp3","audio_ex0":"audio/thirdly_ex0.mp3","audio_ex1":"audio/thirdly_ex1.mp3","img1":"images/thirdly_1.png","img2":"images/thirdly_2.png"},{"word":"correctly","ipa":"/kəˈrektli/","image_prompts":["A math equation solved with all the steps clearly shown and a checkmark at the end","A target with an arrow hitting the bullseye, indicating precision and accuracy"],"image_desc_en":"A math equation solved correctly and a bullseye hit accurately.","image_desc_cn":"正确解答的数学方程式和精准命中的靶心。","meaning_cn":"正确地，准确地","usage":"adv.","collocations":"answer correctly, spell correctly, pronounce correctly","preposition_combos":"N/A","examples":[{"en":"He answered all the questions correctly in the English exam.","cn":"他在英语考试中正确地回答了所有问题。"},{"en":"If you spell the word correctly, you will get extra points.","cn":"如果你正确地拼写这个单词，你将会得到额外的分数。"}],"socratic_questions":[{"question":"当你在考试中完全答对一道难题时，你会怎么描述你的答案？","answer_hint":"这个词表示答案是完全准确，没有错误的。"}],"fill_blank":{"sentences":["She answered the question ___ after carefully reading the text."],"options":["correctly","quick","slowly","loudly"],"correct_index":0},"audio":"audio/correctly.mp3","audio_ex0":"audio/correctly_ex0.mp3","audio_ex1":"audio/correctly_ex1.mp3","img2":"images/correctly_2.png"},{"word":"receive","ipa":"/rɪˈsiːv/","image_prompts":["A hand reaching out to catch a falling gift box tied with a ribbon","An envelope with a heart stamp being delivered into a mailbox"],"image_desc_en":"Illustrations depicting the act of receiving a gift and mail.","image_desc_cn":"描绘收到礼物和邮件的插图。","meaning_cn":"收到，接到","usage":"v. (received, received)","collocations":"receive a letter, receive an award, receive guests","preposition_combos":"receive from","examples":[{"en":"Did you receive my message about the school trip change?","cn":"你收到我关于学校旅行变更的消息了吗？"},{"en":"I hope to receive good grades on my final exams soon.","cn":"我希望很快收到期末考试的好成绩。"}],"socratic_questions":[{"question":"如果你参加了一个比赛，结果公布时，你会怎么样？","answer_hint":"这个词表示你得到了比赛的结果，通常是好消息。"}],"fill_blank":{"sentences":["She will ___ a scholarship if her grades stay high."],"options":["receive","give","send","reject"],"correct_index":0},"audio":"audio/receive.mp3","audio_ex0":"audio/receive_ex0.mp3","audio_ex1":"audio/receive_ex1.mp3","img1":"images/receive_1.png","img2":"images/receive_2.png"},{"word":"sign-off","ipa":"/ˈsaɪn.ɔːf/","image_prompts":["A document with a signature at the bottom, indicating approval","A television screen displaying the end of a broadcast day, static noise"],"image_desc_en":"A signature on a document; a static television screen.","image_desc_cn":"文件底部的签名；电视屏幕上的静态画面。","meaning_cn":"批准，认可；（电视或广播）停播","usage":"n. / v. (过去式 signed-off, 过去分词 signed-off)","collocations":"sign-off on, final sign-off","preposition_combos":"sign-off on","examples":[{"en":"The manager gave the sign-off on the new marketing campaign.","cn":"经理批准了新的营销活动。"},{"en":"The TV station will sign-off at midnight every day.","cn":"这家电视台每天午夜停播。"}],"socratic_questions":[{"question":"当你完成一项任务，需要上级确认并允许继续进行下一步，这叫做什么？","answer_hint":"这表示最终的批准和许可，可以开始下一步。"}],"fill_blank":{"sentences":["The project needed a final ___ from the director before it could start."],"options":["sign-off","sign-in","sign","signal"],"correct_index":0},"audio":"audio/sign-off.mp3","audio_ex0":"audio/sign-off_ex0.mp3","audio_ex1":"audio/sign-off_ex1.mp3","img1":"images/sign-off_1.png","img2":"images/sign-off_2.png"},{"word":"main","ipa":"/meɪn/","image_prompts":["A large highway with multiple lanes merging into a central route, daytime","A central power station with cooling towers and electrical transmission lines"],"image_desc_en":"Illustrations representing the primary or central aspect of something.","image_desc_cn":"表示某事物主要或中心方面的插图。","meaning_cn":"主要的，最重要的","usage":"adj.","collocations":"main idea, main reason, main street, main course","preposition_combos":"main in","examples":[{"en":"The main reason for his success is hard work and dedication.","cn":"他成功的主要原因是努力和奉献。"},{"en":"Our main goal is to improve the environment in our community.","cn":"我们的主要目标是改善我们社区的环境。"}],"socratic_questions":[{"question":"如果一个故事有很多情节，哪个情节对理解整个故事最关键？","answer_hint":"这个情节是故事的核心，没有它故事就不完整。"}],"fill_blank":{"sentences":["The ___ character in the book is a brave young woman."],"options":["main","minor","small","tiny"],"correct_index":0},"audio":"audio/main.mp3","audio_ex0":"audio/main_ex0.mp3","audio_ex1":"audio/main_ex1.mp3","img1":"images/main_1.png","img2":"images/main_2.png"},{"word":"false","ipa":"/fɔːls/","image_prompts":["A broken compass pointing in the wrong direction, surrounded by fog","A counterfeit banknote with blurry details, lying on a dark surface"],"image_desc_en":"A broken compass and a counterfeit banknote.","image_desc_cn":"一个损坏的指南针和一张伪钞。","meaning_cn":"错误的，虚假的","usage":"adj.","collocations":"false alarm, false teeth, false statement","preposition_combos":"false to (承诺)","examples":[{"en":"The news report contained some false information about the event.","cn":"那篇新闻报道包含了一些关于这次活动的虚假信息。"},{"en":"It is false to say that all students dislike exams.","cn":"说所有学生都不喜欢考试是错误的。"}],"socratic_questions":[{"question":"如果一个陈述与事实不符，我们通常会说它是怎么样的？","answer_hint":"这个词表示与真实情况相反。"}],"fill_blank":{"sentences":["The witness gave a ___ statement to the police yesterday."],"options":["false","true","honest","accurate"],"correct_index":0},"audio":"audio/false.mp3","audio_ex0":"audio/false_ex0.mp3","audio_ex1":"audio/false_ex1.mp3","img1":"images/false_1.png","img2":"images/false_2.png"},{"word":"impression","ipa":"/ɪmˈpreʃən/","image_prompts":["A footprint left in wet sand on a beach, clear and distinct","A deep tire track in muddy ground, showing the tread pattern"],"image_desc_en":"A mark or effect left on something.","image_desc_cn":"留在某物上的痕迹或效果。","meaning_cn":"印象；印记","usage":"n.","collocations":"make an impression, first impression, lasting impression","preposition_combos":"impression on/of","examples":[{"en":"His speech made a strong impression on the audience that day.","cn":"那天他的演讲给听众留下了深刻的印象。"},{"en":"The movie left a lasting impression on me because of its story.","cn":"这部电影因为它的故事给我留下了深刻的印象。"}],"socratic_questions":[{"question":"当你第一次见到某人或某物时，你脑海中会形成什么？","answer_hint":"这通常是基于最初的观察和感受。"}],"fill_blank":{"sentences":["My first ___ of the new school was very positive and welcoming."],"options":["impression","expression","oppression","possession"],"correct_index":0},"audio":"audio/impression.mp3","audio_ex0":"audio/impression_ex0.mp3","audio_ex1":"audio/impression_ 年夏天和我的家人一起去巴黎。"},{"en":"She studied French literature when she was in Paris last year.","cn":"去年她在巴黎的时候学习了法国文学。"}],"socratic_questions":[{"question":"哪个城市以埃菲尔铁塔和卢浮宫而闻名，经常出现在浪漫电影的背景中？","answer_hint":"它是法国的首都，也是一个文化和时尚中心。"}],"fill_blank":{"sentences":["They plan to spend a week in ___ during their European vacation."],"options":["Paris","London","Rome","Berlin"],"correct_index":0},"audio":"audio/Paris.mp3","audio_ex0":"audio/Paris_ex0.mp3","audio_ex1":"audio/Paris_ex1.mp3","img1":"images/Paris_1.png","img2":"images/Paris_2.png"},{"word":"shake","ipa":"/ʃeɪk/","image_prompts":["A glass of water with ripples on the surface, caused by an earthquake","Two hands gripping and trembling, suggesting nervousness or fear"],"image_desc_en":"A glass of rippling water and trembling hands.","image_desc_cn":"水面波纹和颤抖的手","meaning_cn":"摇动；震动","usage":"v. (shook, shaken) to move something quickly backwards and forwards or up and down","collocations":"shake hands, shake one's head, shake with fear","preposition_combos":"shake with","examples":[{"en":"I shake my head when I hear such a silly idea.","cn":"当我听到这么愚蠢的想法时，我摇了摇头。"},{"en":"The earthquake made the whole building shake for a minute.","cn":"地震使整栋建筑摇晃了一分钟。"}],"socratic_questions":[{"question":"如果你不同意某人的观点，你会怎么做来表达你的否定？","answer_hint":"这个动作通常用头部来完成，表示不赞同。"}],"fill_blank":{"sentences":["Please ___ the bottle well before you pour the juice out."],"options":["shake","pour","mix","stir"],"correct_index":0},"audio":"audio/shake.mp3","audio_ex0":"audio/shake_ex0.mp3","audio_ex1":"audio/shake_ex1.mp3","img1":"images/shake_1.png","img2":"images/shake_2.png"},{"word":"bow","ipa":"/baʊ/","image_prompts":["A colorful ribbon tied into a decorative bow on a gift box","A wooden bow used for archery, with an arrow nocked and ready to fire"],"image_desc_en":"A decorative ribbon bow and an archery bow.","image_desc_cn":"装饰性的丝带蝴蝶结和射箭用的弓。","meaning_cn":"n. 弓；蝴蝶结；v. 鞠躬","usage":"n. (复数 bows)；v. (过去式 bowed, 过去分词 bowed)","collocations":"take a bow, bow to ","meaning_cn":"拳头","usage":"n.","collocations":"clench one's fist, make a fist","preposition_combos":"with a fist","examples":[{"en":"He clenched his fist in anger, ready to defend himself.","cn":"他愤怒地握紧拳头，准备自卫。"},{"en":"She shook her fist at the sky during the thunderstorm.","cn":"她在雷雨中朝天空挥舞拳头。"}],"socratic_questions":[{"question":"当你非常生气或想表达力量时，你会把手握成什么形状？","answer_hint":"这个形状是手的一种紧握状态，通常表达愤怒或决心。"}],"fill_blank":{"sentences":["The boxer raised his ___ in victory after winning the match."],"options":["fist","hand","arm","leg"],"correct_index":0},"audio":"audio/fist.mp3","audio_ex0":"audio/fist_ex0.mp3","audio_ex1":"audio/fist_ex1.mp3","img1":"images/fist_1.png","img2":"images/fist_2.png"},{"word":"rub","ipa":"/rʌb/","image_prompts":["A hand rubbing a shiny apple to polish it, creating a gleam","A person's hand rubbing lotion onto dry skin, leaving a smooth texture"],"image_desc_en":"A hand polishing an apple; a hand applying lotion.","image_desc_cn":"一只手擦亮一个苹果；一只手涂抹润肤露。","meaning_cn":"摩擦，揉搓","usage":"v. (rubbed, rubbed)","collocations":"rub against, rub down, rub in","preposition_combos":"rub with, rub on","examples":[{"en":"Please rub the cream on your hands before you go out.","cn":"出门前请在手上擦些护手霜。"},{"en":"I often rub my eyes when I feel very tired in class.","cn":"上课时感到非常疲倦时，我经常揉眼睛。"}],"socratic_questions":[{"question":"当你觉得眼睛里进了沙子，你会怎么做？","answer_hint":"这个动作通常是用手在眼睛周围进行的。"}],"fill_blank":{"sentences":["She gently ___ the stain on the table with a damp cloth."],"options":["rubbed","scratched","hit","kicked"],"correct_index":0},"audio":"audio/rub.mp3","audio_ex0":"audio/rub_ex0.mp3","audio_ex1":"audio/rub_ex1.mp3","img1":"images/rub_1.png","img2":"images/rub_2.png"},{"word":"kiss","ipa":"/kɪs/","image_prompts":["Two chocolate candies shaped like lips, slightly melted together","A lipstick stain on a white tissue paper, soft focus"],"image_desc_en":"Visual representations of a kiss, such as chocolate lips and a lipstick stain.","image_desc_cn":"亲吻的视觉表现，例如巧克力嘴唇和口红印 function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}

    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");

    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{

        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;

        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function prevWord() {
  if (wordIndex <= 0) return;
  wordIndex--;
  saveProgress();
  startWord();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}


/* ── 跳过功能（学生自主跳过已认识的单词） ── */
let skippedWords = new Set(JSON.parse(localStorage.getItem('pep_vocab_skipped_'+STORAGE_KEY)||'[]'));
function skipWord() {
  const w = allWords[wordIndex];
  if (!w?.word) { nextWord(); return; }
  skippedWords.add(w.word);
  try { localStorage.setItem('pep_vocab_skipped_'+STORAGE_KEY, JSON.stringify([...skippedWords])); } catch(e) {}
  wordStartTime = Date.now();
  const btn = document.getElementById('p1-skip');
  if (btn) {
    btn.innerHTML = '✓ 已跳过'; btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-forward-step"></i> 跳过（已认识）'; btn.disabled = false; }, 500);
  }
  nextWord();
}
