,"fill_blank":{"sentences":["The ___ rescued the family from the burning house quickly."],"options":["firefighter","policeman","doctor","teacher"],"correct_index":0},"audio":"audio/firefighter.mp3","audio_ex0":"audio/firefighter_ex0.mp3","audio_ex1":"audio/firefighter_ex1.mp3","img2":"images/firefighter_2.png","img1":"images/firefighter_1.png"},{"word":"volunteer","ipa":"/ˌvɑːlənˈtɪr/","image_prompts":["Hands planting seedlings in a garden, gardening tools nearby","A group of people painting a community center wall with bright colors"],"image_desc_en":"Illustrations depicting acts of volunteering, such as planting and painting.","image_desc_cn":"描绘志愿行为的插图，例如种植和绘画。","meaning_cn":"志愿者；自愿做","usage":"n. / v. (过去式 volunteered, 过去分词 volunteered)","collocations":"volunteer work, volunteer organization, volunteer to do","preposition_combos":"volunteer for, volunteer at","examples":[{"en":"She is a volunteer at the local animal shelter every week.","cn":"她每周都在当地的动物收容所做志愿者。"},{"en":"Many students volunteer to help clean up the school campus.","cn":"许多学生自愿帮助清理学校校园。"}],"socratic_questions":[{"question":"如果你主动提出帮助图书馆整理书籍，你是什么身份？","answer_hint":"这个词指主动提供服务，不求回报的人。"}],"fill_blank":{"sentences":["He decided to ___ his time to teach children in rural areas."],"options":["volunteer","force","require","order"],"correct_index":0},"audio":"audio/volunteer.mp3","audio_ex0":"audio/volunteer_ex0.mp3","audio_ex1":"audio/volunteer_ex1.mp3","img1":"images/volunteer_1.png","img2":"images/volunteer_2.png"},{"word":"terribly","ipa":"/ˈterəbli/","image_prompts":["A cracked mirror reflecting a distorted image, dark and unsettling","A wilting flower with drooping petals, brown and decaying"],"image_desc_en":"A cracked mirror and a wilting flower represent something terribly wrong.","image_desc_cn":"一面破裂的镜子和一朵枯萎的花代表着非常糟糕的事情。","meaning_cn":"非常地，极其地；糟糕地，可怕地","usage":"adv.","collocations":"terribly sorry, terribly wrong, terribly difficult","preposition_combos":"terribly at, terribly for","examples":[{"en":"I felt terribly sorry for the lost dog in the street.","cn":"我为街上那只走失的狗感到非常难过。"},{"en":"The exam was terribly difficult, and many students failed it.","cn":"这次考试非常难，很多学生都没通过。"}],"socratic_questions":[{"question":"如果你不小心打碎了朋友最喜欢的杯子，你心里会是什么感觉？","answer_hint":"表达程度很深，并且带有负面情绪。"}],"fill_blank":{"sentences":["I am ___ sorry for breaking your favorite vase; I'll replace it."],"options":["terribly","slightly","happily","easily"],"correct_index":0},"audio":"audio/terribly.mp3","audio_ex0":"audio/terribly_ex0.mp3","audio_ex1":"audio/terribly_ex1.mp3","img1":"images/terribly_1.png","img2":"images/terribly_2.png"},{"word":"alarm","ipa":"/əˈlɑːrm/","image_prompts":["A vintage brass alarm clock with the bells on top, set to 6 AM","A smartphone displaying a loud alarm notification with a snooze button"],"image_desc_en":"Images depicting a classic alarm clock and a smartphone alarm notification.","image_desc_cn":"描绘经典闹钟和智能手机闹钟通知的图像。","meaning_cn":"n. 警报；闹钟；v. 使惊恐；报警","usage":"n. (pl. alarms) ; v. (过去式 alarmed, 过去分词 alarmed)","collocations":"set the alarm, raise the alarm, false alarm","preposition_combos":"alarm at, alarm about","examples":[{"en":"I set the alarm for 6 a.m. so I wouldn't miss the bus.","cn":"我把闹钟设在早上六点，这样我就不会错过公共汽车了。"},{"en":"The fire alarm went off, and everyone left the building quickly.","cn":"火警警报响了，每个人都迅速离开了大楼。"}],"socratic_questions":[{"question":"当你需要早上按时起床时，你会使用什么设备来提醒你？","answer_hint":"它会发出声音，确保你不会睡过头。"}],"fill_blank":{"sentences":["I forgot to set the ___ last night, so I woke up late."],"options":["alarm","alert","signal","clock"],"correct_index":0},"audio":"audio/alarm.mp3","audio_ex0":"audio/alarm_ex0.mp3","audio_ex1":"audio/alarm_ex1.mp3","img1":"images/alarm_1.png","img2":"images/alarm_2.png"},{"word":"alarm clock","ipa":"/əˈlɑːrm klɒk/","image_prompts":["A vintage twin bell alarm clock with the hands pointing to 6:00 AM, resting on a wooden nightstand","A digital alarm clock displaying '7:30' with a bright red light, next to a pair of eyeglasses"],"image_desc_en":"Two different types of alarm clocks.","image_desc_cn":"两种不同类型的闹钟。","meaning_cn":"闹钟","usage":"n.","collocations":"set the alarm clock, turn off the alarm clock","preposition_combos":"on the alarm clock","examples":[{"en":"I set my alarm clock for 7 a.m. every weekday.","cn":"我每个工作日都把闹钟设在早上七点。"},{"en":"The loud alarm clock woke me up from a deep sleep.","cn":"响亮的闹钟把我从沉睡中吵醒。"}],"socratic_questions":[{"question":"什么东西可以帮助你按时起床，避免上学迟到？","answer_hint":"它是一种设备，可以发出声音提醒你时间。"}],"fill_blank":{"sentences":["I always set my ___ ___ before I go to bed."],"options":["alarm clock","wall clock","time watch","hour glass"],"correct_index":0},"audio":"audio/alarm_clock.mp3","audio_ex0":"audio/alarm_clock_ex0.mp3","audio_ex1":"audio/alarm_clock_ex1.mp3","img1":"images/alarm_clock_1.png","img2":"images/alarm_clock_2.png"},{"word":"go off","ipa":"/ɡoʊ ɔf/","image_prompts":["A red alarm clock with the hands pointing to 6:00 AM, loud sound waves emanating from it","A display of fireworks exploding in the night sky, colorful bursts of light"],"image_desc_en":"Alarm clock ringing; fireworks exploding.","image_desc_cn":"闹钟响起；烟花爆炸。","meaning_cn":"（闹钟）响；（炸弹）爆炸；（食物）变质","usage":"v. (过去式 went off, 过去分词 gone off)","collocations":"go off suddenly, go off without warning","preposition_combos":"go off at","examples":[{"en":"The alarm clock will go off at 7 a.m. tomorrow.","cn":"明早闹钟会在早上七点响。"},{"en":"The bomb went off in the city center, causing great damage.","cn":"炸弹在市中心爆炸，造成巨大破坏。"}],"socratic_questions":[{"question":"如果你设置了一个时间，然后一个设备开始发出声音，它在做什么？","answer_hint":"这个短语表示设备开始发出声音，通常是设定的时间到了。"}],"fill_blank":{"sentences":["The fire alarm will ___ if there is too much smoke."],"options":["go off","go on","go by","go through"],"correct_index":0},"audio":"audio/go_off.mp3","audio_ex0":"audio/go_off_ex0.mp3","audio_ex1":"audio/go_off_ex1.mp3","img1":"images/go_off_1.png","img2":"images/go_off_2.png"},{"word":"review","ipa":"/rɪˈvjuː/","image_prompts":["A stack of textbooks with a magnifying glass on top, open notebook nearby","A checklist with completed tasks, marked with checkmarks, on a clipboard"],"image_desc_en":"Textbooks and checklist representing the act of reviewing.","image_desc_cn":"课本和清单，代表复习的行为。","meaning_cn":"复习；回顾","usage":"v. (reviewed, reviewed); n.","collocations":"review notes, conduct a review, thorough review","preposition_combos":"review for (exam), review of (literature)","examples":[{"en":"We should review the grammar rules before the English test.","cn":"我们应该在英语考试前复习语法规则。"},{"en":"The teacher asked us to review our notes every evening.","cn":"老师要求我们每天晚上复习笔记。"}],"socratic_questions":[{"question":"考试前，你会做什么来确保你记住了所有的知识点？","answer_hint":"这个行为可以帮助你重新熟悉之前学过的东西。"}],"fill_blank":{"sentences":["I need to ___ my science notes before the quiz tomorrow."],"options":["review","revise","read","remember"],"correct_index":0},"audio":"audio/review.mp3","audio_ex0":"audio/review_ex0.mp3","audio_ex1":"audio/review_ex1.mp3","img1":"images/review_1.png","img2":"images/review_2.png"},{"word":"sudden","ipa":"/ˈsʌdn/","image_prompts":["A flash of lightning illuminating a dark sky during a thunderstorm","A car braking abruptly on a wet road, leaving skid marks"],"image_desc_en":"Sudden lightning and a car's sudden stop.","image_desc_cn":"突然的闪电和汽车的突然停止。","meaning_cn":"突然的， неожиданный","usage":"adj. suddenly (adv.)","collocations":"sudden change, sudden increase, sudden stop","preposition_combos":"sudden in","examples":[{"en":"The sudden rain made us run for cover quickly.","cn":"突如其来的雨让我们赶紧跑去躲雨。"},{"en":"There was a sudden change in the weather this morning.","cn":"今天早上天气突然发生了变化。"}],"socratic_questions":[{"question":"如果你正在走路，然后毫无预兆地开始下雨，你会用什么词来形容这场雨？","answer_hint":"这个词描述的是没有预料到的、立即发生的事件。"}],"fill_blank":{"sentences":["The car came to a ___ stop, nearly causing an accident."],"options":["sudden","slow","gradual","gentle"],"correct_index":0},"audio":"audio/sudden.mp3","audio_ex0":"audio/sudden_ex0.mp3","audio_ex1":"audio/sudden_ex1.mp3","img1":"images/sudden_1.png","img2":"images/sudden_2.png"},{"word":"all of a sudden","ipa":"/ˌɔːl əv ə ˈsʌdn/","image_prompts":["A dark sky with lightning striking unexpectedly","A calm lake surface disrupted by a large splash, indicating something suddenly falling into the water"],"image_desc_en":"Sudden lightning strike; Splash in a calm lake.","image_desc_cn":"突然的闪电；平静湖面上的水花。","meaning_cn":"突然，忽然","usage":"短语，表示事情发生得很快且出乎意料。","collocations":"appear all of a sudden, stop all of a sudden","preposition_combos":"无","examples":[{"en":"The music stopped all of a sudden, and everyone looked surprised.","cn":"音乐突然停止了，每个人看起来都很惊讶。"},{"en":"All of a sudden, a cat jumped onto the table and ate the fish.","cn":"突然，一只猫跳到桌子上吃了鱼。"}],"socratic_questions":[{"question":"你正在安静地看书，没有任何预兆，房间里的灯灭了。你会用什么短语来描述灯灭这件事？","answer_hint":"强调事情发生得非常快，没有任何准备的时间。"}],"fill_blank":{"sentences":["___, the rain started pouring down, and we had to run for cover."],"options":["All of a sudden","In general","For example","As usual"],"correct_index":0},"audio":"audio/all_of_a_sudden.mp3","audio_ex0":"audio/all_of_a_sudden_ex0.mp3","audio_ex1":"audio/all_of_a_sudden_ex1.mp3","img1":"images/all_of_a_sudden_1.png","img2":"images/all_of_a_sudden_2.png"},{"word":"thunder","ipa":"/ˈθʌndər/","image_prompts":["A dark stormy sky with bright lightning bolts and rolling dark clouds","A sound wave graphic emanating from a lightning strike, visualized as a powerful burst"],"image_desc_en":"Visualizations of thunder: a stormy sky and a sound wave graphic.","image_desc_cn":"雷声的视觉化：暴风雨的天空和声波图。","meaning_cn":"n. 雷声；v. 打雷","usage":"n. ; v. (过去式 thundered, 过去分词 thundered)","collocations":"a clap of thunder, thunder and lightning","preposition_combos":"thunder with rain","examples":[{"en":"We heard the loud thunder during the heavy rain last night.","cn":"昨晚大雨时，我们听到了巨大的雷声。"},{"en":"It began to thunder as we were walking home from school.","cn":"当我们放学回家时，开始打雷了。"}],"socratic_questions":[{"question":"在暴风雨天气中，闪电之后通常会听到什么声音？","answer_hint":"这种声音通常很大，并且伴随着闪电。"}],"fill_blank":{"sentences":["The dog was scared by the loud ___ during the storm."],"options":["thunder","wind","rain","sun"],"correct_index":0},"audio":"audio/thunder.mp3","audio_ex0":"audio/thunder_ex0.mp3","audio_ex1":"audio/thunder_ex1.mp3","img1":"images/thunder_1.png","img2":"images/thunder_2.png"},{"word":"by the time","ipa":"/baɪ ðə taɪm/","image_prompts":["A digital clock showing 11:59 PM, with fireworks in the background","A calendar page flipping to the next month, marked with a deadline"],"image_desc_en":"A clock nearing midnight; a calendar flipping to a new month.","image_desc_cn":"接近午夜的钟表；日历翻到新的一页。","meaning_cn":"到...的时候","usage":"conj. (引导时间状语从句)","collocations":"by the time + clause","preposition_combos":"N/A","examples":[{"en":"By the time I arrived, the movie had already started.","cn":"到我到达的时候，电影已经开始了。"},{"en":"By the time she finishes school, she will be eighteen.","cn":"到她完成学业的时候，她就十八岁了。"}],"socratic_questions":[{"question":"如果我计划在某个时间点做某事，但在此之前发生了另一件事，我应该用什么短语来表达这个时间关系？","answer_hint":"这个短语表示一个动作在另一个动作发生之前或同时完成。"}],"fill_blank":{"sentences":["___ we got to the station, the train had left."],"options":["By the time","In time","At the time","For the time"],"correct_index":0},"audio":"audio/by_the_time.mp3","audio_ex0":"audio/by_the_time_ex0.mp3","audio_ex1":"audio/by_the_time_ex1.mp3","img1":"images/by_the_time_1.png","img2":"images/by_the_time_2.png"},{"word":"usual","ipa":"/ˈjuːʒuəl/","image_prompts":["A cup of coffee and a newspaper on a breakfast table, representing a typical morning routine","A row of identical houses in a suburban neighborhood, suggesting commonality"],"image_desc_en":"A typical morning routine and a row of identical houses.","image_desc_cn":"典型的早晨例行公事和一排排相同的房屋。","meaning_cn":"通常的，平常的","usage":"adj.","collocations":"as usual, the usual thing","preposition_combos":"usual for","examples":[{"en":"It is usual for students to study hard before exams.","cn":"学生在考试前努力学习是很正常的。"},{"en":"The weather is warmer than usual this year in July.","cn":"今年七月的天气比往常更暖和。"}],"socratic_questions":[{"question":"描述一种你经常做的，几乎每天都会重复的事情。","answer_hint":"这件事发生的频率很高，已经成为你生活的一部分。"}],"fill_blank":{"sentences":["It's ___ to see many people walking in the park on weekends."],"options":["usual","unusual","rare","strange"],"correct_index":0},"audio":"audio/usual.mp3","audio_ex0":"audio/usual_ex0.mp3","audio_ex1":"audio/usual_ex1.mp3","img1":"images/usual_1.png","img2":"images/usual_2.png"},{"word":"out of breath","ipa":"/ˌaʊt əv ˈbreθ/","image_prompts":["A stopwatch next to an oxygen mask, indicating exertion","A deflated balloon lying on the ground, symbolizing lack of air"],"image_desc_en":"A visual representation of being winded or gasping for air.","image_desc_cn":"气喘吁吁或喘不过气的视觉表现。","meaning_cn":"上气不接下气，喘不过气","usage":"形容词短语 adj. ","collocations":"be out of breath, get out of breath","preposition_combos":"无","examples":[{"en":"I was out of breath after running to catch the school bus.","cn":"我跑着去赶校车后，上气不接下气。"},{"en":"After climbing the stairs, she was completely out of breath.","cn":"爬完楼梯后，她完全喘不过气来。"}],"socratic_questions":[{"question":"当你剧烈运动后，感觉呼吸困难，你会怎么形容这种状态？","answer_hint":"描述运动后呼吸急促，需要停下来休息的状态。"}],"fill_blank":{"sentences":["He was ___ ___ ___ after the intense basketball game."],"options":["out of breath","in the mood","full of energy","on the ball"],"correct_index":0},"audio":"audio/out_of_breath.mp3","audio_ex0":"audio/out_of_breath_ex0.mp3","audio_ex1":"audio/out_of_breath_ex1.mp3","img1":"images/out_of_breath_1.png","img2":"images/out_of_breath_2.png"},{"word":"rainstorm","ipa":"/ˈreɪnstɔːrm/","image_prompts":["A flooded street with cars partially submerged after a heavy rainstorm","Dark storm clouds gathering over a field with heavy rain pouring down"],"image_desc_en":"A scene depicting heavy rainfall and flooding, and dark storm clouds with pouring rain.","image_desc_cn":"描绘大雨和洪水的场景，以及乌云密布、大雨倾盆的景象。","meaning_cn":"暴雨","usage":"n. (复数 rainstorms)","collocations":"severe rainstorm, sudden rainstorm","preposition_combos":"during a rainstorm, after a rainstorm","examples":[{"en":"The sudden rainstorm made it difficult to see the road clearly.","cn":"突如其来的暴雨使我们很难看清道路。"},{"en":"We had to stay indoors because of the severe rainstorm outside.","cn":"因为外面的严重暴雨，我们不得不待在室内。"}],"socratic_questions":[{"question":"如果天空突然变得很黑，并且开始下非常大的雨，这通常被称为什么？","answer_hint":"描述的是一种非常强烈的降雨天气。"}],"fill_blank":{"sentences":["The power went out during the heavy ___ last night."],"options":["rainstorm","sunshine","breeze","snowfall"],"correct_index":0},"audio":"audio/rainstorm.mp3","audio_ex0":"audio/rainstorm_ex0.mp3","audio_ex1":"audio/rainstorm_ex1.mp3","img1":"images/rainstorm_1.png","img2":"images/rainstorm_2.png"},{"word":"as a result","ipa":"/æz ə rɪˈzʌlt/","image_prompts":["A domino effect with the last domino falling over","A graph showing a steep increase after a significant event"],"image_desc_en":"Domino effect and a graph showing a steep increase.","image_desc_cn":"多米诺骨牌效应和一个显示急剧增长的图表。","meaning_cn":"因此，结果是","usage":"短语 adv.","collocations":"as a result of","preposition_combos":"of","examples":[{"en":"He studied hard; as a result, he got a good grade.","cn":"他努力学习；因此，他取得了不错的成绩。"},{"en":"The rain was heavy; as a result, the game was canceled.","cn":"雨下得很大；结果，比赛被取消了。"}],"socratic_questions":[{"question":"如果因为一个原因导致了后面的事情发生，你会怎么表达这种因果关系？","answer_hint":"强调前因后果，表示由某个原因直接导致的最终情况。"}],"fill_blank":{"sentences":["She missed the bus; ___ , she was late for school."],"options":["as a result","in addition","for example","on the other hand"],"correct_index":0},"audio":"audio/as_a_result.mp3","audio_ex0":"audio/as_a_result_ex0.mp3","audio_ex1":"audio/as_a_result_ex1.mp3","img1":"images/as_a_result_1.png","img2":"images/as_a_result_2.png"},{"word":"unlucky","ipa":"/ʌnˈlʌki/","image_prompts":["A black cat walking under a ladder, dramatic shadows","A cracked mirror lying on the floor, shards of glass scattered around"],"image_desc_en":"An image representing bad fortune or a lack of success.","image_desc_cn":"代表坏运气或缺乏成功的图像。","meaning_cn":"adj. 不吉利的；倒霉的","usage":"adj. (比较级 unluckier, 最高级 unluckiest)","collocations":"unlucky number, unlucky day, feel unlucky","preposition_combos":"unlucky in love","examples":[{"en":"It was an unlucky day for me; I failed the math exam.","cn":"对我来说，这是倒霉的一天；我数学考试不及格了。"},{"en":"Some people think that Friday the 13th is an unlucky date.","cn":"有些人认为 13 号星期五是不吉利的日子。"}],"socratic_questions":[{"question":"如果你考试前打破了镜子，你可能会觉得今天怎么样？","answer_hint":"这个词形容遭遇不顺或坏运气。"}],"fill_blank":{"sentences":["It was very ___ of me to forget my keys at home today."],"options":["unlucky","lucky","happy","careful"],"correct_index":0},"audio":"audio/unlucky.mp3","audio_ex0":"audio/unlucky_ex0.mp3","audio_ex1":"audio/unlucky_ex1.mp3","img1":"images/unlucky_1.png","img2":"images/unlucky_2.png"},{"word":"Phuket","ipa":"/puːˈkɛt/","image_prompts":["Aerial view of a tropical island with white sand beaches and turquoise water, Phuket","Longtail boats anchored in a bay with limestone cliffs in the background, Phuket"],"image_desc_en":"A tropical island with beaches and boats.","image_desc_cn":"一个拥有海滩和船只的热带岛屿。","meaning_cn":"普吉岛（泰国岛屿）","usage":"n.","collocations":"visit Phuket, Phuket beach, Phuket island","preposition_combos":"in Phuket, to Phuket, from Phuket","examples":[{"en":"We plan to visit Phuket for our summer vacation this year.","cn":"我们计划今年暑假去普吉岛旅行。"},{"en":"Phuket is a popular tourist destination known for its beautiful beaches.","cn":"普吉岛是一个受欢迎的旅游目的地，以其美丽的海滩而闻名。"}],"socratic_questions":[{"question":"如果你想去泰国的一个以美丽海滩和岛屿闻名的度假胜地，你会选择哪里？","answer_hint":"这个地方是泰国最大的岛屿，以其迷人的海滩和风景而闻名。"}],"fill_blank":{"sentences":["Have you ever been to ___? It's a beautiful island in Thailand."],"options":["Phuket","Bali","Hawaii","Maldives"],"correct_index":0},"audio":"audio/Phuket.mp3","audio_ex0":"audio/Phuket_ex0.mp3","audio_ex1":"audio/Phuket_ex1.mp3","img1":"images/Phuket_1.png","img2":"images/Phuket_2.png"},{"word":"Indonesia","ipa":"/ˌɪndəˈniːʒə/","image_prompts":["An aerial view of lush green islands scattered across a turquoise sea","A vibrant batik fabric with intricate patterns and rich colors"],"image_desc_en":"Illustrations of Indonesia's geography and culture.","image_desc_cn":"印度尼西亚的地理和文化的插图。","meaning_cn":"印度尼西亚","usage":"n. (专有名词)","collocations":"visit Indonesia, Indonesian islands, the people of Indonesia","preposition_combos":"in Indonesia, from Indonesia, to Indonesia","examples":[{"en":"Many tourists choose to visit Indonesia during their summer vacation.","cn":"许多游客选择在暑假期间去印度尼西亚旅游。"},{"en":"Indonesia is a country that has many beautiful islands and beaches.","cn":"印度尼西亚是一个拥有许多美丽岛屿和海滩的国家。"}],"socratic_questions":[{"question":"哪个东南亚国家以其众多的岛屿和火山而闻名？","answer_hint":"这个国家的名字以 'Indo-' 开头，并且以其丰富的文化多样性而闻名。"}],"fill_blank":{"sentences":["Bali is a famous island in ___."],"options":["Indonesia","Malaysia","Thailand","Singapore"],"correct_index":0},"audio":"audio/Indonesia.mp3","audio_ex0":"audio/Indonesia_ex0.mp3","audio_ex1":"audio/Indonesia_ex1.mp3","img1":"images/Indonesia_1.png","img2":"images/Indonesia_2.png"},{"word":"Japan","ipa":"/dʒəˈpæn/","image_prompts":["A map highlighting the islands of Japan with cherry blossom petals scattered around","A serene landscape of Mount Fuji with traditional Japanese architecture in the foreground"],"image_desc_en":"A map of Japan with cherry blossoms and a view of Mount Fuji with traditional buildings.","image_desc_cn":"一张标有日本岛屿的地图，周围散落着樱花花瓣；以及富士山宁静的风景，前景是传统的日本建筑。","meaning_cn":"日本","usage":"n.","collocations":"visit Japan, travel to Japan, in Japan","preposition_combos":"to Japan, in Japan, from Japan","examples":[{"en":"I want to visit Japan because I love its culture.","cn":"我想去日本，因为我喜欢它的文化。"},{"en":"She bought a beautiful kimono when she traveled to Japan.","cn":"她去日本旅游时买了一件漂亮的和服。"}],"socratic_questions":[{"question":"哪个国家以其樱花、寿司和动漫而闻名？","answer_hint":"这个国家是一个位于亚洲东部的岛国。"}],"fill_blank":{"sentences":["My family plans to travel to ___ next summer vacation."],"options":["Japan","Germany","France","Canada"],"correct_index":0},"audio":"audio/Japan.mp3","audio_ex0":"audio/Japan_ex0.mp3","audio_ex1":"audio/Japan_ex1.mp3","img1":"images/Japan_1.png","img2":"images/Japan_2.png"}]}]};</script>

function updateProgress() {

/* ═══════════════════════════════════════════════
   Unit 加载
═══════════════════════════════════════════════ */
async function selectUnit(n) {
  currentUnit = n; wordIndex = 0;
  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
}
async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {
  unitData = VOCAB_DATA ? (VOCAB_DATA.units||[]).find(u=>(u.unit||u)===n) : null;
  if (!unitData?.words?.length) { alert("该单元无单词数据"); throw new Error("no data"); }
  allWords = unitData.words.filter(w=>w.word&&!w.error);
  saveProgress();
}

/* ═══════════════════════════════════════════════
   学习流程：startWord / showCurrentWord
═══════════════════════════════════════════════ */
function startWord() {
  if (wordIndex >= allWords.length) { alert("🎉 本单元已全部完成！"); showPage("unit-select"); return; }
  const w = allWords[wordIndex];
  if (!w?.word) { wordIndex++; startWord(); return; }
  if (wordIndex > 0 && wordIndex % PER_REVIEW === 0) {
    reviewBatch = allWords.slice(wordIndex - PER_REVIEW, wordIndex).filter(w => !skippedWords.has(w.word));
    if (reviewBatch.length === 0) { showCurrentWord(); return; }
    reviewIdx = 0;
    startReview();
    return;
  }
  showCurrentWord();
}
function showCurrentWord() {
  updateProgress();
  wordStartTime = Date.now();
  const w = allWords[wordIndex];
  document.getElementById("p1-word").textContent = w.word;
  document.getElementById("p1-ipa").textContent  = w.ipa || "";
  document.getElementById("p1-score").style.display = "none";
  document.getElementById("p1-next").disabled = true;
  const prevBtn = document.getElementById("p1-prev");
  if (prevBtn) prevBtn.disabled = wordIndex <= 0;
  showPage("p1-pronounce");
  saveProgress();
}

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  if (w.audio) { new Audio(mediaUrl(w.audio)).play().catch(()=>{}); return; }
  synthesizer?.speakTextAsync(w.word, ()=>{}, e=>console.error(e));
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
  rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}
function speakWord(word) {

function closeWordModal() {

}

/* ═══════════════════════════════════════════════
   P4 例句

function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function prevWord() {
  if (wordIndex <= 0) return;
  wordIndex--;
  saveProgress();
  startWord();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}


/* ── 跳过功能（学生自主跳过已认识的单词） ── */
let skippedWords = new Set(JSON.parse(localStorage.getItem('pep_vocab_skipped_'+STORAGE_KEY)||'[]'));
function skipWord() {
  const w = allWords[wordIndex];
  if (!w?.word) { nextWord(); return; }
  skippedWords.add(w.word);
  try { localStorage.setItem('pep_vocab_skipped_'+STORAGE_KEY, JSON.stringify([...skippedWords])); } catch(e) {}
  wordStartTime = Date.now();
  const btn = document.getElementById('p1-skip');
  if (btn) {
    btn.innerHTML = '✓ 已跳过'; btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-forward-step"></i> 跳过（已认识）'; btn.disabled = false; }, 500);
  }
  nextWord();
}

function setReviewDots(active) {
  ["rd1","rd2","rd3"].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el){ if(i<active-1) el.className="step-dot done"; else if(i===active-1) el.className="step-dot active"; else el.className="step-dot"; }
  });
}
function setReviewChip(word) {
  document.getElementById("review-chip-word").textContent = word||"";
}

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
  setReviewDots(1);
  showPage("p-review");
  showSocraticQuestion();
  saveProgress();
}

function showSocraticQuestion() {
  const w = reviewOrders ? reviewBatch[reviewOrders.socratic[reviewIdx]] : reviewBatch[reviewIdx];
  const q = (w.socratic_questions||[])[0];
  if (!q) { reviewStep2(); return; }
  document.getElementById("review-socratic-q").textContent = q.question||"";
  const opts = document.getElementById("review-socratic-opts"); opts.innerHTML="";
  [...reviewBatch].sort(()=>Math.random()-.5).map(x=>x.word).forEach(wo=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=wo;
    b.onclick=()=>{
      opts.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=wo.toLowerCase()===w.word.toLowerCase();
      reviewLogs.push({ type:"socratic", word:w.word, question:q.question||"", userAnswer:wo, correct:w.word, ok });
      b.classList.add(ok?"correct":"wrong");
      if(!ok) opts.querySelectorAll(".opt-btn").forEach(x=>{ if(x.textContent.toLowerCase()===w.word.toLowerCase()) x.classList.add("correct"); });
      const fb=document.getElementById("review-socratic-fb");
      fb.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb.style.display="block";
      fb.textContent=ok?"✓ 正确！"+(q.answer_hint?"  "+q.answer_hint:""):"✗ 答案是「"+w.word+"」"+(q.answer_hint?"  "+q.answer_hint:"");
      document.getElementById("review-socratic-next").disabled=false;
    };
    opts.appendChild(b);
  });
  document.getElementById("review-socratic-fb").style.display="none";
  document.getElementById("review-socratic-next").disabled=true;
}

function reviewStep2() {
  reviewStep = 2;
  document.getElementById("review-step1").style.display="none";
  document.getElementById("review-step2").style.display="block";
  setReviewDots(2);
  showPage("p-review");
  saveProgress();
  const w = reviewOrders ? reviewBatch[reviewOrders.fill[reviewIdx]] : reviewBatch[reviewIdx];
  const fb=w.fill_blank||{};

  }
  qDiv.innerHTML+='<p style="font-size:.85rem;color:var(--sub);margin-bottom:10px">'+(sent?"选出正确的词填入空白：":"选出最符合词义的选项：")+"</p>";
  const div=document.getElementById("review-fill-opts"); div.innerHTML="";

function goToTranslationStep() {

/* ═══════════════════════════════════════════════
   翻译朗读 + DeepSeek 评价（持续识别，手动开始/停止）
═══════════════════════════════════════════════ */
function toggleTransRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("review-trans-record");

  if (transRecording) {
    // ── 停止录音 ──
    transRecording = false;
    btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
    btn.classList.remove("recording");
    if (window._transRec) {
      window._transRec.stopContinuousRecognitionAsync(
        async () => {
          const text = (window._transFullText||"").trim();
          const resultDiv = document.getElementById("review-trans-result");
          if (!text) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--sub)">未识别到语音，请重试</div>`;
    return;
  }
          await evaluateTranslation(window._transSentence||"", text, window._transRefCn||"");
        },
        e => console.error("stop err:", e)
      );
    }
    return;
  }

  // ── 开始录音 ──
  transRecording = true;
  window._transFullText = "";
  btn.innerHTML = '<i class="fas fa-stop"></i> 点击停止录音';
  btn.classList.add("recording");
  document.getElementById("review-trans-result").style.display = "none";

  const zhCfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  zhCfg.speechRecognitionLanguage = "zh-CN";
  const rec = new SpeechSDK.SpeechRecognizer(zhCfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  window._transRec = rec;

  // 实时显示识别到的片段
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._transFullText += e.result.text;
      const resultDiv = document.getElementById("review-trans-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text2)">
        识别中：<span style="color:var(--text)">${window._transFullText}</span>
      </div>`;
    }
  };

  rec.startContinuousRecognitionAsync(
    () => {},
    e => {
      transRecording = false;
      btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
      btn.classList.remove("recording");
      console.error("start err:", e);
    }
  );
}

async function evaluateTranslation(enText, studentCn, refCn) {
  const resultDiv=document.getElementById("review-trans-result");
  resultDiv.style.display="block";
  resultDiv.innerHTML=`<div class="eval-loading"><span class="spin">⟳</span> DeepSeek 正在评价…</div>`;
  document.getElementById("review-trans-next").disabled=false;
  try {
    const prompt=`你是初中英语翻译评价专家，帮助八年级学生提升英译中能力。
英文原句：${enText}
参考中文：${refCn||"（无）"}
学生朗读的中文翻译：${studentCn}

请用JSON格式返回评价，包含这些字段：
- score: 整数0-100（语义准确度）
- correct: 翻译正确/较好的部分（简洁，1句）
- issues: 主要问题或遗漏（1-2句，没有则写"无明显问题"）
- standard: 最佳参考翻译（1句）
- tip: 针对性的学习建议（1句，结合初中生水平）`;

    const resp=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-v4-flash",
        messages:[{role:"user",content:prompt}],
        response_format:{type:"json_object"},
        temperature:0.3,max_tokens:400
      })
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    const data=await resp.json();
    const ev=JSON.parse(data.choices[0].message.content);
    const s=ev.score??0;
    reviewLogs.push({ type:"translation", word:window._dictWord?.word||"", en:enText, studentCn, score:s, correct:ev.correct||"", issues:ev.issues||"", standard:ev.standard||"" });
    const cls=s>=80?"eval-score-hi":s>=55?"eval-score-mid":"eval-score-lo";
    resultDiv.innerHTML=`
      <div class="eval-card">
        <div class="eval-score-row">
          <div class="eval-score-circle ${cls}">${s}</div>
          <div>
            <div style="font-size:.75rem;font-weight:800;color:var(--sub);letter-spacing:.05em;margin-bottom:4px">DEEPSEEK 评分</div>
            <div style="font-size:.85rem;color:var(--sub)">你说的：<span style="color:var(--text)">${studentCn}</span></div>
          </div>
        </div>
        ${ev.correct?`<div class="eval-row"><span class="eval-lbl">✓ 正确</span><span class="eval-val" style="color:var(--green)">${ev.correct}</span></div>`:""}
        ${ev.issues?`<div class="eval-row"><span class="eval-lbl">⚠ 问题</span><span class="eval-val" style="color:#fca5a5">${ev.issues}</span></div>`:""}
        <div class="eval-row"><span class="eval-lbl">📝 标准</span><span class="eval-val">${ev.standard||refCn||"—"}</span></div>
        ${ev.tip?`<div class="eval-tip">💡 ${ev.tip}</div>`:""}
      </div>`;
  } catch(e) {
    resultDiv.innerHTML=`<div class="eval-card"><p style="color:var(--sub);font-size:.88rem">评价暂不可用：${e.message}</p></div>`;
    console.error("DeepSeek eval:", e);
  }
}

function escapeHtml(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatDateTime(d) {
  if (!d) return "-";
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)+" "+
    ("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)+":"+("0"+x.getSeconds()).slice(-2);
}
function formatDuration(ms) {
  if (!ms||ms<0) return "0s";
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if (h>0) return h+"h "+m%60+"min "+s%60+"s";
  if (m>0) return m+"min "+s%60+"s";
  return s+"s";
}
function buildReportDetailsHtml() {
  let html = "";
  if (Object.keys(wordTimings).length > 0) {
    html += "<h3 style=\"font-size:14px;margin:12px 0 8px;color:#333;\">⏱️ 每个单词学习时间</h3>";
    html += "<table style=\"border-collapse:collapse;width:100%;font-size:13px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:6px;text-align:left;\">单词</th><th style=\"border:1px solid #ddd;padding:6px;text-align:left;\">学习时长</th></tr>";
    Object.entries(wordTimings).forEach(([w,t])=>{
      html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(w)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(t/1000).toFixed(1)+" 秒</td></tr>";
    });
    html += "</table>";
  }
  if (reviewLogs.length > 0) {
    html += "<h3 style=\"font-size:14px;margin:16px 0 8px;color:#333;\">📋 复习阶段做题过程与结果</h3>";
    const socraticLogs = reviewLogs.filter(r=>r.type==="socratic");
    const fillLogs = reviewLogs.filter(r=>r.type==="fill");
    const transLogs = reviewLogs.filter(r=>r.type==="translation");
    if (socraticLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🧠 情景联想</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">题目</th><th style=\"border:1px solid #ddd;padding:5px;\">学生答案</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      socraticLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.question.substring(0,50)+(r.question.length>50?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userAnswer)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correct)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (fillLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">✏️ 句子填空</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">句子</th><th style=\"border:1px solid #ddd;padding:5px;\">学生选择</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      fillLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.sentence.substring(0,40)+(r.sentence.length>40?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correctChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (transLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🌏 翻译朗读 · AI评价</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">英文</th><th style=\"border:1px solid #ddd;padding:5px;\">学生翻译</th><th style=\"border:1px solid #ddd;padding:5px;\">得分</th><th style=\"border:1px solid #ddd;padding:5px;\">标准参考</th></tr>";
      transLogs.forEach(r=>{ html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.en.substring(0,35)+(r.en.length>35?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.studentCn.substring(0,25)+(r.studentCn.length>25?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+r.score+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml((r.standard||"").substring(0,30))+"</td></tr>"; });
      html += "</table>";
    }
  }
  if (!html) html = "<p style=\"color:#999;\">暂无学习数据（需完成部分单词学习或复习后发送）</p>";
  return html;
}
function sendLearningReport() {
  if (reportSent) { alert("报告已发送过"); return; }
  const hasData = Object.keys(wordTimings).length > 0 || reviewLogs.length > 0;
  if (!hasData) { alert("暂无学习数据，请先完成部分单词学习或复习后再发送报告"); return; }
  if (typeof emailjs === "undefined") { alert("邮件服务未加载，请刷新页面后重试"); return; }
  const endTime = new Date();
  const startT = sessionStartTime || endTime;
  const durationMs = endTime - startT;
  const studentName = localStorage.getItem("authing-user") || localStorage.getItem("current-user") || "未登录";
  const contentName = "人教版词汇 Unit" + currentUnit + " - " + (document.title || "词汇学习");
  const choiceLogs = reviewLogs.filter(r=>r.type==="socratic"||r.type==="fill");
  const transLogs = reviewLogs.filter(r=>r.type==="translation");
  const reviewCorrect = choiceLogs.filter(r=>r.ok).length;
  const reviewTotal = choiceLogs.length;
  const avgTransScore = transLogs.length ? Math.round(transLogs.reduce((a,x)=>a+x.score,0)/transLogs.length) : null;
  const score = reviewTotal ? reviewCorrect : (avgTransScore!==null ? avgTransScore : 0);
  const total = reviewTotal || (avgTransScore!==null ? 100 : 0);
  const accuracy = total > 0 ? Math.round((reviewTotal ? reviewCorrect/reviewTotal : avgTransScore/100) * 100) + "%" : "-";
  const templateParams = {
    student_name: studentName,
    content_name: contentName,
    page_url: location.href,
    page_url_display: contentName,
    start_time: formatDateTime(startT),
    end_time: formatDateTime(endTime),
    duration: formatDuration(durationMs),
    score: score,
    total: total,
    accuracy: accuracy,
    details_html: buildReportDetailsHtml()
  };
  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
      .then(() => { reportSent = true; alert("✅ 学习报告已发送给老师"); })
      .catch(() => { alert("❌ 报告发送失败，请检查网络后重试"); });
  } catch (e) { alert("发送失败：" + (e.message || "未知错误")); }
}
