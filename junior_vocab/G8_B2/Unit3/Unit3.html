<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}

    /* ── 跳过按钮 ── */
    .btn-skip{background:rgba(156,163,175,.1);color:#9ca3af;border:1px dashed rgba(156,163,175,.3);font-size:.82rem;padding:7px 14px;margin-bottom:10px;width:100%;border-radius:var(--radius-sm);transition:all .18s;cursor:pointer}
    .btn-skip:hover{background:rgba(251,191,36,.1);color:#fbbf24;border-color:rgba(251,191,36,.4)}
    .skip-badge{display:inline-block;font-size:.7rem;background:rgba(156,163,175,.15);color:#9ca3af;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>
  <link rel="stylesheet" href="../../../scripts/drawing-overlay.css?v=1" />
</head>
<body>
  <script>window.VOCAB_DATA={"units":[{"unit":3,"source":"D:\\2026\\人教版英语八年级下单词表\\人教版英语八年级下单词表.pdf","words":[{"word":"referee","ipa":"/ˌrefəˈriː/","image_prompts":["A whistle hanging on a black and white striped shirt, sports field background","A hand holding up a yellow card during a soccer game, blurred stadium"],"image_desc_en":"A referee's whistle and yellow card, representing authority in sports.","image_desc_cn":"裁判的哨子和黄牌，代表体育运动中的权威。","meaning_cn":"裁判员","usage":"n. (复数 referees); v. (过去式 refereed, 过去分词 refereed)","collocations":"head referee, assistant referee, game referee","preposition_combos":"referee in, referee for","examples":[{"en":"The referee made a fair decision during the basketball match.","cn":"在篮球比赛中，裁判做出了公正的判决。"},{"en":"He refereed many football games at the local sports center.","cn":"他在当地体育中心裁判了很多足球比赛。"}],"socratic_questions":[{"question":"在足球比赛中，谁负责监督比赛规则并做出判决？","answer_hint":"这个人确保比赛公平进行，并且有权做出决定。"}],"fill_blank":{"sentences":["The ___ blew his whistle to signal the end of the game."],"options":["referee","player","coach","spectator"],"correct_index":0},"audio":"audio/referee.mp3","audio_ex0":"audio/referee_ex0.mp3","audio_ex1":"audio/referee_ex1.mp3","img2":"images/referee_2.png","img1":"images/referee_1.png"},{"word":"take back","ipa":"/teɪk bæk/","image_prompts":["A hand reaching out to reclaim a book from a shelf, soft lighting","A receipt lying on a store counter next to a returned item, blurred background"],"image_desc_en":"A hand taking back a book; a returned item with a receipt.","image_desc_cn":"一只手拿回一本书；一张收据和一件退回的商品。","meaning_cn":"收回；退回","usage":"v. (过去式 took back, 过去分词 taken back) 表示将某物归还或撤回说过的话。","collocations":"take back a statement, take back goods","preposition_combos":"take sth. back to (a place)","examples":[{"en":"I have to take this shirt back to the store tomorrow.","cn":"我明天必须把这件衬衫退回商店。"},{"en":"He decided to take back what he said about her skills.","cn":"他决定收回他之前对她技能的评价。"}],"socratic_questions":[{"question":"如果你买的东西不合适，你会怎么做？或者，如果你说错了话，你会怎么做？","answer_hint":"需要把东西还给商家，或者撤回之前说过的话。"}],"fill_blank":{"sentences":["I had to ___ the library book ___ because it was overdue."],"options":["take back","bring in","give away","throw out"],"correct_index":0},"audio":"audio/take_back.mp3","audio_ex0":"audio/take_back_ex0.mp3","audio_ex1":"audio/take_back_ex1.mp3","img1":"images/take_back_1.png","img2":"images/take_back_2.png"},{"word":"decision","ipa":"/dɪˈsɪʒən/","image_prompts":["A forked road with signs pointing in different directions, under a cloudy sky","A judge's gavel resting on a stack of legal documents, courtroom setting"],"image_desc_en":"A visual representation of making a choice and a symbol of legal judgment.","image_desc_cn":"选择的视觉表现和法律判决的象征。","meaning_cn":"决定，决策","usage":"名词 n.","collocations":"make a decision, good decision, important decision","preposition_combos":"decision about/on","examples":[{"en":"It was a difficult decision to make, but I did it.","cn":"这是一个很难做的决定，但我还是做了。"},{"en":"The final decision rests with the school principal this time.","cn":"最终的决定权在于这次的校长。"}],"socratic_questions":[{"question":"当你面临多个选项，需要从中选择一个时，你正在做什么？","answer_hint":"这个过程涉及权衡利弊，最终确定一个行动方案。"}],"fill_blank":{"sentences":["Making a quick ___ is sometimes necessary in emergencies."],"options":["decision","decide","decided","deciding"],"correct_index":0},"audio":"audio/decision.mp3","audio_ex0":"audio/decision_ex0.mp3","audio_ex1":"audio/decision_ex1.mp3","img1":"images/decision_1.png","img2":"images/decision_2.png"},{"word":"score","ipa":"/skɔːr/","image_prompts":["A scoreboard displaying numbers in a sports stadium, bright lights","A musical sheet with notes and symbols indicating a high-pitched melody"],"image_desc_en":"A scoreboard and a musical sheet.","image_desc_cn":"一个记分牌和一张乐谱。","meaning_cn":"得分；乐谱","usage":"n. 得分，分数；乐谱 v. (scored, scored) 得分，记分","collocations":"high score, musical score","preposition_combos":"score in","examples":[{"en":"Our team managed to score three goals in the second half.","cn":"我们队在下半场设法得了三个球。"},{"en":"The film's score was composed by a famous musician.","cn":"这部电影的乐谱是由一位著名的音乐家创作的。"}],"socratic_questions":[{"question":"在体育比赛中，用来记录双方表现的数据是什么？演奏音乐时，演奏者依据什么来演奏？","answer_hint":"一个表示比赛结果，一个表示音乐的构成。"}],"fill_blank":{"sentences":["She managed to ___ a high grade on her English exam."],"options":["score","mark","grade","point"],"correct_index":0},"audio":"audio/score.mp3","audio_ex0":"audio/score_ex0.mp3","audio_ex1":"audio/score_ex1.mp3","img2":"images/score_2.png","img1":"images/score_1.png"},{"word":"proud","ipa":"/praʊd/","image_prompts":["A gold medal displayed on a velvet cushion, spotlight shining","A peacock displaying its vibrant feathers in a lush garden"],"image_desc_en":"A feeling of deep satisfaction from one's own achievements or the achievements of those with whom one is associated.","image_desc_cn":"因某人或与某人相关的人的成就而感到深深的满足。","meaning_cn":"自豪的，骄傲的","usage":"adj. proudly (adv.)","collocations":"proud of, feel proud, very proud","preposition_combos":"proud of","examples":[{"en":"My parents are very proud of my good grades in school.","cn":"我的父母为我在学校取得的好成绩感到非常自豪。"},{"en":"She felt proud when her team won the basketball game.","cn":"当她的队伍赢得篮球比赛时，她感到很自豪。"}],"socratic_questions":[{"question":"当你完成一个非常困难的任务时，你心里会是什么感觉？","answer_hint":"这种感觉是因为你做得很好，或者别人做得很好。"}],"fill_blank":{"sentences":["He felt very ___ when he received the award for his invention."],"options":["proud","sad","angry","nervous"],"correct_index":0},"audio":"audio/proud.mp3","audio_ex0":"audio/proud_ex0.mp3","audio_ex1":"audio/proud_ex1.mp3","img1":"images/proud_1.png","img2":"images/proud_2.png"},{"word":"proud of","ipa":"/praʊd ɒv/","image_prompts":["A golden trophy displayed on a shelf, bathed in warm light","A graduation cap and diploma lying on a table, sunlight streaming through a window"],"image_desc_en":"A trophy and a graduation cap, symbolizing achievement and pride.","image_desc_cn":"奖杯和毕业帽，象征着成就和自豪。","meaning_cn":"以...为荣，为...感到自豪","usage":"adj. feeling pleased and satisfied about something you own or have done, or are connected with","collocations":"be proud of sb/sth, feel proud of, very proud of","preposition_combos":"proud of + 名词/代词/动名词","examples":[{"en":"She is very proud of her excellent performance in the exam.","cn":"她为自己在考试中的出色表现感到非常自豪。"},{"en":"We are all proud of our school's achievements in sports.","cn":"我们都为我们学校在体育方面的成就感到自豪。"}],"socratic_questions":[{"question":"当你完成了一件非常棒的事情，或者你的朋友取得了很大的进步，你心里会是什么感觉？","answer_hint":"这种感觉是积极的，表示你对某人或某事感到非常满意和高兴。"}],"fill_blank":{"sentences":["My parents are very ___ me because I got good grades.","She is ___ her ability to speak English fluently."],"options":["proud of","afraid of","interested in","worried about"],"correct_index":0},"audio":"audio/proud_of.mp3","audio_ex0":"audio/proud_of_ex0.mp3","audio_ex1":"audio/proud_of_ex1.mp3","img1":"images/proud_of_1.png","img2":"images/proud_of_2.png"},{"word":"coach","ipa":"/koʊtʃ/","image_prompts":["A large bus with comfortable seats parked at a bus station, luggage compartment open","A whistle hanging around the neck of a clipboard resting on a sports field, cones in background"],"image_desc_en":"A bus and a sports coach's equipment","image_desc_cn":"一辆巴士和运动教练的装备","meaning_cn":"n. 教练；长途汽车 v. 训练，指导","usage":"n. (复数 coaches) ; v. (过去式 coached, 过去分词 coached)","collocations":"football coach, travel by coach, coach a team","preposition_combos":"coach in (a sport), coach for (a team)","examples":[{"en":"Our school hired a new basketball coach last week.","cn":"我们学校上周聘请了一位新的篮球教练。"},{"en":"The coach helped the team improve their skills quickly.","cn":"教练帮助球队迅速提高了他们的技能。"}],"socratic_questions":[{"question":"在体育运动中，谁负责指导和训练运动员？或者，如果我们要长途旅行，通常会乘坐什么交通工具？","answer_hint":"这个词既可以指体育运动中的指导者，也可以指一种大型交通工具。"}],"fill_blank":{"sentences":["The travel ___ arrived late due to the heavy rain."],"options":["coach","ship","plane","taxi"],"correct_index":0},"audio":"audio/coach.mp3","audio_ex0":"audio/coach_ex0.mp3","audio_ex1":"audio/coach_ex1.mp3","img1":"images/coach_1.png","img2":"images/coach_2.png"},{"word":"as well","ipa":"/æz wel/","image_prompts":["Two identical gift boxes wrapped in colorful paper, side by side","A plate with a slice of cake, and another plate with a similar slice of cake next to it"],"image_desc_en":"Two items are present, indicating 'also' or 'in addition'.","image_desc_cn":"两件物品同时存在，表示“也”、“此外”。","meaning_cn":"也，同样","usage":"adv.","collocations":"as well as","preposition_combos":null,"examples":[{"en":"He speaks English fluently, and he speaks French as well.","cn":"他英语说得很流利，法语也说得很好。"},{"en":"She enjoys reading novels, and she likes watching movies as well.","cn":"她喜欢读小说，也喜欢看电影。"}],"socratic_questions":[{"question":"如果一个人喜欢游泳，而且他也喜欢跑步，你会怎么表达他同样喜欢跑步？","answer_hint":"表示除了游泳之外，跑步也是他喜欢的项目。"}],"fill_blank":{"sentences":["She ordered pizza, and she got a drink ___ ___."],"options":["as well","too much","so that","in order"],"correct_index":0},"audio":"audio/as_well.mp3","audio_ex0":"audio/as_well_ex0.mp3","audio_ex1":"audio/as_well_ex1.mp3","img1":"images/as_well_1.png","img2":"images/as_well_2.png"},{"word":"bit","ipa":"/bɪt/","image_prompts":["A small metal drill bit used for woodworking, shavings around the hole","A tiny chocolate bit on top of a vanilla ice cream scoop, close-up"],"image_desc_en":"A small piece or a tool.","image_desc_cn":"小块，少量；钻头。","meaning_cn":"少量，一点；（钻头等的）头","usage":"n. 一点，少量；小块；钻头","collocations":"a bit of, every bit","preposition_combos":"bit by bit","examples":[{"en":"I ate a bit of cake after dinner last night.","cn":"我昨晚晚饭后吃了一小块蛋糕。"},{"en":"He needs a bit more time to finish his homework.","cn":"他需要多一点时间来完成他的作业。"}],"socratic_questions":[{"question":"如果你想吃蛋糕，但又不想吃太多，你会怎么说？","answer_hint":"表示“少量”的含义。"}],"fill_blank":{"sentences":["She felt a ___ nervous before her final exam."],"options":["bit","lots","much","many"],"correct_index":0},"audio":"audio/bit.mp3","audio_ex0":"audio/bit_ex0.mp3","audio_ex1":"audio/bit_ex1.mp3","img1":"images/bit_1.png","img2":"images/bit_2.png"},{"word":"a bit","ipa":"/ə bɪt/","image_prompts":["A small pile of sand on a beach, with a few grains scattered around","A thermometer showing a slight increase in temperature from a baseline"],"image_desc_en":"A small amount or degree of something.","image_desc_cn":"少量，一点儿。","meaning_cn":"一点儿，稍微","usage":"adv. 稍微地；n. 一点，少量","collocations":"a bit of, a bit more, feel a bit","preposition_combos":"a bit + of","examples":[{"en":"I'm feeling a bit tired after the long school day.","cn":"经过漫长的一天学习后，我感觉有点累。"},{"en":"Could you turn the music down a bit, please?","cn":"请你把音乐声音调小一点，好吗？"}],"socratic_questions":[{"question":"如果你觉得有点冷，你会怎么说？","answer_hint":"表达程度轻微，不是完全冷，而是“有点”。"}],"fill_blank":{"sentences":["The soup needs ___ more salt to improve its taste."],"options":["a bit","a lot","many","few"],"correct_index":0},"audio":"audio/a_bit.mp3","audio_ex0":"audio/a_bit_ex0.mp3","audio_ex1":"audio/a_bit_ex1.mp3","img1":"images/a_bit_1.png","img2":"images/a_bit_2.png"},{"word":"repeat","ipa":"/rɪˈpiːt/","image_prompts":["An audio player with a 'repeat' button highlighted, playing the same song again","A handwritten note saying 'Please repeat' next to a microphone on a desk"],"image_desc_en":"An audio player repeating a song and a note asking to repeat something.","image_desc_cn":"一个音频播放器重复播放一首歌，以及一张纸条要求重复某事。","meaning_cn":"重复，复述","usage":"v. (repeated, repeated) to say or do something again; n. an act of repeating something","collocations":"repeat a word, repeat an action, repeat after","preposition_combos":"repeat after","examples":[{"en":"Could you please repeat the question? I didn't hear it clearly.","cn":"你能重复一下这个问题吗？我没听清楚。"},{"en":"The teacher asked the students to repeat the new words loudly.","cn":"老师要求学生们大声重复这些新单词。"}],"socratic_questions":[{"question":"如果别人说的话你没听清，你会怎么礼貌地请他再说一遍？","answer_hint":"你需要请求对方再次说一遍相同的内容。"}],"fill_blank":{"sentences":["The instructions were unclear, so I had to ___ them.","The teacher asked the student to ___ the sentence after her."],"options":["repeat","revise","review","recite"],"correct_index":0},"audio":"audio/repeat.mp3","audio_ex0":"audio/repeat_ex0.mp3","audio_ex1":"audio/repeat_ex1.mp3","img1":"images/repeat_1.png","img2":"images/repeat_2.png"},{"word":"pull together","ipa":"/pʊl təˈɡɛðər/","image_prompts":["A group of ropes tied together, each rope a different color, symbolizing unity","Gears interlocking and turning smoothly, representing teamwork and collaboration"],"image_desc_en":"Visual representations of unity and teamwork.","image_desc_cn":"象征团结和团队合作的视觉表现。","meaning_cn":"齐心协力，团结合作","usage":"v. to work together in a determined way to achieve something","collocations":"pull together as a team, pull together to overcome","preposition_combos":"pull together for, pull together with","examples":[{"en":"We need to pull together if we want to win the game.","cn":"如果我们想赢得比赛，我们需要齐心协力。"},{"en":"The community had to pull together after the earthquake.","cn":"地震后，社区不得不团结合作。"}],"socratic_questions":[{"question":"当团队遇到困难，需要共同努力克服时，你会用什么词来形容这种行为？","answer_hint":"这个词强调的是团队成员共同努力，朝着同一个目标前进。"}],"fill_blank":{"sentences":["The whole class had to ___ to finish the project on time."],"options":["pull together","give up","fall apart","stand by"],"correct_index":0},"audio":"audio/pull_together.mp3","audio_ex0":"audio/pull_together_ex0.mp3","audio_ex1":"audio/pull_together_ex1.mp3","img1":"images/pull_together_1.png"},{"word":"solution","ipa":"/səˈluːʃn/","image_prompts":["A lightbulb illuminating above a maze, representing a breakthrough","A chemical beaker with a clear liquid, all substances fully dissolved"],"image_desc_en":"A lightbulb above a maze; a beaker with dissolved substances.","image_desc_cn":"迷宫上方的一个灯泡；一个装有溶解物质的烧杯。","meaning_cn":"n. 解决方案；解答","usage":"n. (pl. solutions)","collocations":"find a solution, offer a solution, simple solution","preposition_combos":"solution to","examples":[{"en":"We need to find a quick solution to this difficult problem.","cn":"我们需要找到一个解决这个难题的快速方案。"},{"en":"The best solution is to recycle more and waste less.","cn":"最好的解决办法是多回收利用，减少浪费。"}],"socratic_questions":[{"question":"当遇到数学难题时，我们通常会寻找什么？","answer_hint":"这个词指的是解决问题或困境的方法。"}],"fill_blank":{"sentences":["The teacher provided a clear ___ to the complex math problem."],"options":["solution","question","answer","reason"],"correct_index":0},"audio":"audio/solution.mp3","audio_ex0":"audio/solution_ex0.mp3","audio_ex1":"audio/solution_ex1.mp3","img1":"images/solution_1.png","img2":"images/solution_2.png"},{"word":"though","ipa":"/ðoʊ/","image_prompts":["A winding road through a dense forest, sunlight filtering through the trees","A closed book with a bookmark sticking out, placed on a wooden table"],"image_desc_en":"A road through a forest and a closed book.","image_desc_cn":"穿过森林的道路和一本合上的书。","meaning_cn":"虽然，尽管；可是，不过","usage":"连词 conj. / 副词 adv.","collocations":"even though, as though","preposition_combos":"","examples":[{"en":"Though it rained, we still had a great time at the park.","cn":"虽然下雨了，我们在公园里仍然玩得很开心。"},{"en":"She felt nervous, though she tried to hide it from others.","cn":"她感到紧张，虽然她试图对别人隐瞒。"}],"socratic_questions":[{"question":"如果一件事情发生了，但是结果却出乎意料，你会用哪个词来连接这两件事？","answer_hint":"这个词表示转折或让步，引导一个与主要观点相反的信息。"}],"fill_blank":{"sentences":["___ it was late, they continued to study for the exam."],"options":["Though","Because","If","When"],"correct_index":0},"audio":"audio/though.mp3","audio_ex0":"audio/though_ex0.mp3","audio_ex1":"audio/though_ex1.mp3","img1":"images/though_1.png","img2":"images/though_2.png"},{"word":"even though","ipa":"/ˈiːvən ðoʊ/","image_prompts":["A winding road leading up a steep mountain, overcast sky","A single flower blooming in a crack in a concrete wall, resilience"],"image_desc_en":"A challenging path or a resilient flower, showing contrast with difficulty.","image_desc_cn":"一条通往陡峭山顶的蜿蜒道路，或是一朵在水泥墙缝隙中盛开的花朵，展示了与困难的对比。","meaning_cn":"即使，虽然","usage":"连词 conj.","collocations":"even though + clause","preposition_combos":null,"examples":[{"en":"Even though it rained, we still enjoyed our school trip.","cn":"即使下雨了，我们仍然很享受我们的学校旅行。"},{"en":"Even though I studied hard, I didn't pass the exam.","cn":"即使我努力学习了，我也没有通过考试。"}],"socratic_questions":[{"question":"在某种情况下，某件事发生了，但结果却出乎意料或与预期相反。你会用哪个词来表达这种转折关系？","answer_hint":"这个词组表示一种让步关系，即承认一个事实，但强调另一个不同的结果。"}],"fill_blank":{"sentences":["___ it was late, they continued to work on the project."],"options":["Even though","Because","However","Therefore"],"correct_index":0},"audio":"audio/even_though.mp3","audio_ex0":"audio/even_though_ex0.mp3","audio_ex1":"audio/even_though_ex1.mp3","img2":"images/even_though_2.png","img1":"images/even_though_1.png"},{"word":"apologize","ipa":"/əˈpɑːlədʒaɪz/","image_prompts":["A handwritten note saying 'I'm sorry' with a wilted flower next to it","A cracked vase with water spilled around it, indicating regret"],"image_desc_en":"A note expressing regret and a damaged vase symbolizing the need for an apology.","image_desc_cn":"一张表达歉意的便条和一只象征需要道歉的破损花瓶。","meaning_cn":"道歉","usage":"v. (过去式 apologized, 过去分词 apologized)","collocations":"apologize to (someone) for (something)","preposition_combos":"apologize to, apologize for","examples":[{"en":"I must apologize to my teacher for being late to class.","cn":"我必须为上课迟到向我的老师道歉。"},{"en":"She apologized for the mistake she made on the test.","cn":"她为考试中犯的错误道歉了。"}],"socratic_questions":[{"question":"当你做错事，想要表达你的后悔和请求原谅时，你会做什么？","answer_hint":"这个行为通常包含说'对不起'，以减轻对方的不满。"}],"fill_blank":{"sentences":["You should ___ to your friend for breaking his favorite toy."],"options":["apologize","appreciate","advise","announce"],"correct_index":0},"audio":"audio/apologize.mp3","audio_ex0":"audio/apologize_ex0.mp3","audio_ex1":"audio/apologize_ex1.mp3","img2":"images/apologize_2.png","img1":"images/apologize_1.png"},{"word":"go wrong","ipa":"/ɡoʊ rɔŋ/","image_prompts":["A complex machine with gears jammed and smoke coming out, indicating malfunction","A GPS navigation screen showing a rerouting message with a red exclamation mark"],"image_desc_en":"Images depicting malfunction and navigation error.","image_desc_cn":"描绘故障和导航错误的图像。","meaning_cn":"出错，出问题","usage":"v. (过去式 went wrong, 过去分词 gone wrong)","collocations":"something go wrong, what went wrong, nothing can go wrong","preposition_combos":"go wrong with","examples":[{"en":"If anything goes wrong, please let me know immediately.","cn":"如果出了什么问题，请立即告诉我。"},{"en":"I hope nothing will go wrong during our school trip tomorrow.","cn":"我希望明天的学校旅行一切顺利。"}],"socratic_questions":[{"question":"如果你计划好的事情最终没有按计划进行，你会怎么描述这种情况？","answer_hint":"强调事情没有按照预期的方式发展，出现了偏差。"}],"fill_blank":{"sentences":["Sometimes, even with careful planning, things can ___ unexpectedly."],"options":["go wrong","go right","turn left","turn right"],"correct_index":0},"audio":"audio/go_wrong.mp3","audio_ex0":"audio/go_wrong_ex0.mp3","audio_ex1":"audio/go_wrong_ex1.mp3","img2":"images/go_wrong_2.png","img1":"images/go_wrong_1.png"},{"word":"joyful","ipa":"/ˈdʒɔɪfl/","image_prompts":["A field of sunflowers in full bloom under a bright sun, vibrant colors","A group of colorful balloons floating in the air, tied together with ribbons"],"image_desc_en":"Sunflowers blooming and colorful balloons symbolize happiness.","image_desc_cn":"盛开的向日葵和彩色气球象征着快乐。","meaning_cn":"快乐的，喜悦的","usage":"adj. joyfully (adv.), joyfulness (n.)","collocations":"joyful occasion, joyful smile, joyful heart","preposition_combos":"joyful about/at","examples":[{"en":"The children were joyful when they received their gifts.","cn":"孩子们收到礼物时非常快乐。"},{"en":"It was a joyful day for the whole family.","cn":"对整个家庭来说，这是个快乐的日子。"}],"socratic_questions":[{"question":"想象一下你赢得了一场比赛，你感觉如何？","answer_hint":"描述一种非常开心的情绪。"}],"fill_blank":{"sentences":["She felt ___ when she heard the good news from school."],"options":["joyful","sad","angry","worried"],"correct_index":0},"audio":"audio/joyful.mp3","audio_ex0":"audio/joyful_ex0.mp3","audio_ex1":"audio/joyful_ex1.mp3","img1":"images/joyful_1.png","img2":"images/joyful_2.png"},{"word":"thankful","ipa":"/ˈθæŋkfəl/","image_prompts":["A heart-shaped balloon floating upwards with a banner that reads 'Gratitude'","A cornucopia overflowing with colorful fruits and vegetables, autumn leaves scattered around"],"image_desc_en":"Images representing gratitude and abundance.","image_desc_cn":"代表感恩和富足的图像。","meaning_cn":"adj. 感谢的，感激的","usage":"adj. feeling or expressing gratitude; appreciative","collocations":"be thankful for, thankful to someone","preposition_combos":"thankful for","examples":[{"en":"I am thankful for my family's support during the exam period.","cn":"我感谢我的家人在考试期间给予的支持。"},{"en":"She was thankful to her friends who helped her move houses.","cn":"她感谢帮助她搬家的朋友们。"}],"socratic_questions":[{"question":"当你收到一份期待已久的礼物时，你心里会是什么感觉？","answer_hint":"这种感觉表达了你对给予者的感激之情。"}],"fill_blank":{"sentences":["We are all ___ for the teachers' hard work and dedication."],"options":["thankful","thank","thanks","thanking"],"correct_index":0},"audio":"audio/thankful.mp3","audio_ex0":"audio/thankful_ex0.mp3","audio_ex1":"audio/thankful_ex1.mp3","img1":"images/thankful_1.png","img2":"images/thankful_2.png"},{"word":"negative","ipa":"/ˈneɡətɪv/","image_prompts":["A black and white film negative showing a landscape scene, bright areas dark and vice versa","A thermometer displaying a temperature below zero degrees Celsius, frost forming on the glass"],"image_desc_en":"A film negative and a sub-zero thermometer.","image_desc_cn":"一张底片和一个零度以下的温度计。","meaning_cn":"adj. 否定的；消极的","usage":"adj. adv. negatively n. negativity","collocations":"negative attitude, negative effect, test negative","preposition_combos":"negative about","examples":[{"en":"He has a negative attitude towards the new school rules.","cn":"他对新的学校规章制度持消极态度。"},{"en":"The test results were negative, which was a great relief.","cn":"测试结果是阴性的，这让人松了一口气。"}],"socratic_questions":[{"question":"如果某人总是抱怨并且不相信事情会好转，你会如何形容他的心态？","answer_hint":"描述的是一种不乐观、不积极的心情。"}],"fill_blank":{"sentences":["Her constant ___ comments made it hard to stay positive."],"options":["negative","positive","neutral","happy"],"correct_index":0},"audio":"audio/negative.mp3","audio_ex0":"audio/negative_ex0.mp3","audio_ex1":"audio/negative_ex1.mp3","img1":"images/negative_1.png","img2":"images/negative_2.png"},{"word":"bully","ipa":"/ˈbʊli/","image_prompts":["A cartoon depiction of a large shadow looming over a smaller figure, representing intimidation","A digital illustration of a cracked smartphone screen after being thrown on the ground"],"image_desc_en":"Intimidation and damage representing the act of bullying.","image_desc_cn":"代表欺凌行为的恐吓和破坏。","meaning_cn":"欺负，恃强凌弱；欺凌者","usage":"v. (过去式 bullied, 过去分词 bullied)；n.","collocations":"bully someone into doing something; school bully","preposition_combos":"bully at","examples":[{"en":"Don't bully others; treat everyone with respect and kindness.","cn":"不要欺负别人；要尊重和友善地对待每一个人。"},{"en":"The school has a zero-tolerance policy for any form of bully.","cn":"学校对任何形式的欺凌行为都采取零容忍政策。"}],"socratic_questions":[{"question":"如果有人总是用更强壮的身体或更大的权力去伤害或威胁弱小的人，这种行为叫什么？","answer_hint":"这个词形容的是一种不公平的压迫行为，通常发生在力量不对等的情况下。"}],"fill_blank":{"sentences":["It's wrong to ___ someone just because they are different."],"options":["bully","encourage","support","befriend"],"correct_index":0},"audio":"audio/bully.mp3","audio_ex0":"audio/bully_ex0.mp3","audio_ex1":"audio/bully_ex1.mp3","img1":"images/bully_1.png","img2":"images/bully_2.png"},{"word":"shout at","ipa":"/ʃaʊt æt/","image_prompts":["A megaphone with sound waves emanating from it, directed towards a distant target.","A person's silhouette with an angry expression, a speech bubble with large, bold text above."],"image_desc_en":"A megaphone projecting sound and an angry silhouette with a speech bubble.","image_desc_cn":"一个扩音器发出声音，以及一个愤怒轮廓带着文字泡。","meaning_cn":"冲...喊叫；对...大声呵斥","usage":"v. (过去式 shouted, 过去分词 shouted)","collocations":"shout angrily at, shout loudly at","preposition_combos":"shout at sb, shout at the top of one's voice","examples":[{"en":"Don't shout at me; I can hear you perfectly well.","cn":"别对我大喊大叫；我能听得很清楚。"},{"en":"The teacher had to shout at the noisy students to quiet them.","cn":"老师不得不对吵闹的学生大喊，让他们安静下来。"}],"socratic_questions":[{"question":"当某人做了让你非常生气的事情，你会提高音量并表达不满，这个行为是什么？","answer_hint":"这个行为不仅仅是说话，而是带着愤怒的情绪大声说话。"}],"fill_blank":{"sentences":["It's not polite to ___ people, even if they make mistakes."],"options":["shout at","whisper to","talk with","smile at"],"correct_index":0},"audio":"audio/shout_at.mp3","audio_ex0":"audio/shout_at_ex0.mp3","audio_ex1":"audio/shout_at_ex1.mp3","img1":"images/shout_at_1.png","img2":"images/shout_at_2.png"},{"word":"behave","ipa":"/bɪˈheɪv/","image_prompts":["A well-trained dog sitting patiently with a treat on its nose, waiting for permission","A classroom setting with students raising their hands politely to answer questions"],"image_desc_en":"A dog behaving well; students behaving politely in class.","image_desc_cn":"表现良好的狗；在课堂上表现礼貌的学生。","meaning_cn":"表现，举止；守规矩","usage":"v. (behaved, behaved)","collocations":"behave well/badly; behave oneself","preposition_combos":"behave towards","examples":[{"en":"You should behave well in public places, showing respect to others.","cn":"在公共场所你应该表现良好，对他人表示尊重。"},{"en":"If you behave yourself, you will be rewarded with extra playtime.","cn":"如果你守规矩，你将会得到额外的玩耍时间作为奖励。"}],"socratic_questions":[{"question":"如果你在图书馆里大声喧哗，你的父母可能会说什么？","answer_hint":"他们会希望你更加注意你的言行举止。"}],"fill_blank":{"sentences":["Children should learn to ___ politely when they meet new people."],"options":["behave","behavior","behaving","behaved"],"correct_index":0},"audio":"audio/behave.mp3","audio_ex0":"audio/behave_ex0.mp3","audio_ex1":"audio/behave_ex1.mp3","img1":"images/behave_1.png","img2":"images/behave_2.png"},{"word":"differently","ipa":"/ˈdɪfrəntli/","image_prompts":["A kaleidoscope with various patterns and colors, each section unique","Two winding roads diverging in a forest, one paved and one dirt"],"image_desc_en":"Kaleidoscope patterns and diverging roads.","image_desc_cn":"万花筒图案和分岔的道路。","meaning_cn":"不同地，差异地","usage":"adv. (形容词 different 的副词形式)","collocations":"think differently, act differently, look differently","preposition_combos":"differently from/than","examples":[{"en":"We all see the world differently, based on our experiences.","cn":"我们都根据自己的经历，以不同的方式看待世界。"},{"en":"The twins behaved differently after they went to different schools.","cn":"这对双胞胎上了不同的学校后，行为举止变得不一样了。"}],"socratic_questions":[{"question":"如果两幅画，一幅是抽象风格，一幅是写实风格，它们的呈现方式是怎样的？","answer_hint":"强调呈现方式上的差异，而非内容。"}],"fill_blank":{"sentences":["Although they are sisters, they dress very ___."],"options":["differently","different","difference","differs"],"correct_index":0},"audio":"audio/differently.mp3","audio_ex0":"audio/differently_ex0.mp3","audio_ex1":"audio/differently_ex1.mp3","img1":"images/differently_1.png","img2":"images/differently_2.png"},{"word":"physics","ipa":"/ˈfɪzɪks/","image_prompts":["A chalkboard covered with complex equations and diagrams related to motion and energy.","An apple falling from a tree, illustrating the concept of gravity."],"image_desc_en":"Illustrations of physics concepts: equations on a chalkboard and an apple falling.","image_desc_cn":"物理概念的图示：黑板上的方程式和苹果掉落。","meaning_cn":"物理学","usage":"名词 n. (不可数名词)","collocations":"study physics, theoretical physics, applied physics","preposition_combos":"in physics","examples":[{"en":"She is very interested in physics and wants to study it.","cn":"她对物理学很感兴趣，并且想学习它。"},{"en":"Our school offers a physics course for senior students.","cn":"我们学校为高年级学生开设了物理课程。"}],"socratic_questions":[{"question":"哪个学科研究物质、能量及其相互作用的规律？","answer_hint":"这个学科是自然科学的一个重要分支，与运动、力、电磁等现象有关。"}],"fill_blank":{"sentences":["He is taking a course in ___ to understand the universe better."],"options":["physics","chemistry","biology","geography"],"correct_index":0},"audio":"audio/physics.mp3","audio_ex0":"audio/physics_ex0.mp3","audio_ex1":"audio/physics_ex1.mp3","img1":"images/physics_1.png","img2":"images/physics_2.png"},{"word":"lie","ipa":"/laɪ/","image_prompts":["A crumpled piece of paper on a desk, abandoned and forgotten","A GPS navigation screen showing an incorrect route, leading astray"],"image_desc_en":"A crumpled paper and a GPS showing the wrong way.","image_desc_cn":"一张揉皱的纸和显示错误路线的GPS。","meaning_cn":"v. 躺；说谎 n. 谎言","usage":"v. (过去式 lay, 过去分词 lain)；n. (复数 lies)","collocations":"tell a lie, lie in bed","preposition_combos":"lie on","examples":[{"en":"I like to lie on the grass and watch clouds.","cn":"我喜欢躺在草地上看云。"},{"en":"He told a lie about his homework to the teacher.","cn":"他向老师撒了关于作业的谎。"}],"socratic_questions":[{"question":"当你疲惫时，你会做什么来放松身体？或者，为了避免麻烦，你可能会说什么？","answer_hint":"一个表示休息的动作，另一个是不真实的话语。"}],"fill_blank":{"sentences":["Don't ___ to me; I want to know the truth."],"options":["lie","lay","lied","lain"],"correct_index":0},"audio":"audio/lie.mp3","audio_ex0":"audio/lie_ex0.mp3","audio_ex1":"audio/lie_ex1.mp3","img1":"images/lie_1.png","img2":"images/lie_2.png"},{"word":"awake","ipa":"/əˈweɪk/","image_prompts":["An alarm clock ringing loudly on a bedside table, sunlight streaming through the window","A cup of steaming coffee next to an open book on a morning desk"],"image_desc_en":"An alarm clock ringing and a cup of coffee in the morning.","image_desc_cn":"闹钟响起和早晨的一杯咖啡。","meaning_cn":"醒着的；醒来","usage":"adj. / v. (awoke, awoken)","collocations":"wide awake, stay awake, wake up","preposition_combos":"awake to","examples":[{"en":"I am usually awake before 7 a.m. on weekdays.","cn":"工作日我通常在早上七点之前醒来。"},{"en":"The loud music kept me awake all night long.","cn":"吵闹的音乐让我整晚都没睡着。"}],"socratic_questions":[{"question":"当你早上睁开眼睛，不再处于睡眠状态时，你是什么状态？","answer_hint":"描述的是从睡眠状态到清醒状态的转变。"}],"fill_blank":{"sentences":["I found it hard to stay ___ during the long lecture."],"options":["awake","asleep","sleepy","wake"],"correct_index":0},"audio":"audio/awake.mp3","audio_ex0":"audio/awake_ex0.mp3","audio_ex1":"audio/awake_ex1.mp3","img1":"images/awake_1.png","img2":"images/awake_2.png"},{"word":"wake up","ipa":"/weɪk ʌp/","image_prompts":["An alarm clock ringing loudly on a bedside table, sunlight streaming through the window","A cup of steaming coffee next to a newspaper on a kitchen counter, early morning light"],"image_desc_en":"Alarm clock ringing and coffee in the morning.","image_desc_cn":"闹钟响起和早晨的咖啡。","meaning_cn":"醒来，叫醒","usage":"v. (过去式 woke up, 过去分词 woken up)","collocations":"wake up early, wake up late, wake sb up","preposition_combos":"wake up at, wake up to","examples":[{"en":"I usually wake up at 6:30 a.m. on weekdays.","cn":"我通常在工作日的早上6:30醒来。"},{"en":"My mom has to wake me up every morning.","cn":"我妈妈每天早上都必须叫醒我。"}],"socratic_questions":[{"question":"闹钟响了之后，你会做什么？","answer_hint":"描述从睡眠状态进入清醒状态的过程。"}],"fill_blank":{"sentences":["I need to ___ early tomorrow for my important exam."],"options":["wake up","get up","sleep in","lie down"],"correct_index":0},"audio":"audio/wake_up.mp3","audio_ex0":"audio/wake_up_ex0.mp3","audio_ex1":"audio/wake_up_ex1.mp3","img1":"images/wake_up_1.png","img2":"images/wake_up_2.png"},{"word":"relaxed","ipa":"/rɪˈlækst/","image_prompts":["A hammock strung between two palm trees on a tropical beach, gentle waves","A steaming cup of herbal tea next to a book on a soft, comfortable sofa"],"image_desc_en":"Visuals representing calmness and ease.","image_desc_cn":"代表平静和放松的视觉效果。","meaning_cn":"放松的；轻松的","usage":"adj. 形容词；v. relax (过去式 relaxed, 过去分词 relaxed)","collocations":"feel relaxed, relaxed atmosphere, relaxed attitude","preposition_combos":"relaxed about","examples":[{"en":"After the exam, I felt so relaxed and happy.","cn":"考试之后，我感到非常放松和快乐。"},{"en":"The beach is a relaxed place for a summer vacation.","cn":"海滩是一个放松的暑假去处。"}],"socratic_questions":[{"question":"当你完成一项困难的任务后，你的身体和心情会是什么状态？","answer_hint":"描述一种没有压力和紧张的状态。"}],"fill_blank":{"sentences":["She felt very ___ after her yoga class."],"options":["relaxed","relaxing","tense","stressful"],"correct_index":0},"audio":"audio/relaxed.mp3","audio_ex0":"audio/relaxed_ex0.mp3","audio_ex1":"audio/relaxed_ex1.mp3","img1":"images/relaxed_1.png","img2":"images/relaxed_2.png"},{"word":"normal","ipa":"/ˈnɔːrml/","image_prompts":["A row of identical houses in a suburban neighborhood, under a clear blue sky","A thermometer showing a reading of 37 degrees Celsius, indicating a typical body temperature"],"image_desc_en":"Illustrations representing typical or standard situations and measurements.","image_desc_cn":"代表典型或标准情况和测量的插图。","meaning_cn":"正常的，标准的","usage":"adj. normally adv.","collocations":"normal life, normal temperature, back to normal","preposition_combos":"normal for","examples":[{"en":"It's normal to feel nervous before an important exam.","cn":"考试前感到紧张是很正常的。"},{"en":"Our school day starts at 8 am, which is normal.","cn":"我们学校早上八点开始上课，这很正常。"}],"socratic_questions":[{"question":"当你感冒时，退烧后你的体温会恢复到什么状态？","answer_hint":"描述的是一种常见的、不特殊的状态。"}],"fill_blank":{"sentences":["It's ___ for students to feel a bit stressed before exams."],"options":["normal","strange","difficult","easy"],"correct_index":0},"audio":"audio/normal.mp3","audio_ex0":"audio/normal_ex0.mp3","audio_ex1":"audio/normal_ex1.mp3","img1":"images/normal_1.png","img2":"images/normal_2.png"},{"word":"from time to time","ipa":"/frɒm taɪm tuː taɪm/","image_prompts":["A calendar with some dates circled randomly, indicating occasional events","A clock with its hands moving erratically, suggesting irregular intervals"],"image_desc_en":"A calendar with circled dates and a clock with erratic movement, showing occasional events.","image_desc_cn":"日历上随机圈出一些日期，时钟指针不规则移动，表示偶尔发生的事件。","meaning_cn":"有时，不时","usage":"adv. 偶尔，不时","collocations":"visit from time to time, call from time to time","preposition_combos":"from time to time","examples":[{"en":"We visit our grandparents from time to time during holidays.","cn":"我们会在假期里不时地去看望我们的祖父母。"},{"en":"She calls me from time to time to check on my progress.","cn":"她不时地打电话给我，询问我的进展。"}],"socratic_questions":[{"question":"如果你不是经常做某事，而是偶尔才做，你会用哪个短语来描述？","answer_hint":"这个短语表示事情发生的频率不高，但也不是完全没有。"}],"fill_blank":{"sentences":["I go to the library ___ to read some new books."],"options":["from time to time","every day","once a week","never"],"correct_index":0},"audio":"audio/from_time_to_time.mp3","audio_ex0":"audio/from_time_to_time_ex0.mp3","audio_ex1":"audio/from_time_to_time_ex1.mp3","img1":"images/from_time_to_time_1.png","img2":"images/from_time_to_time_2.png"},{"word":"clear the air","ipa":"/klɪr ðə er/","image_prompts":["A stuffy room with a window being opened, fresh air flowing in, dust particles visible in sunlight","Two hands shaking firmly after a tense meeting, representing resolution"],"image_desc_en":"A room being ventilated and a handshake after a disagreement.","image_desc_cn":"房间通风和争执后的握手。","meaning_cn":"消除误会；缓和紧张气氛","usage":"idiom","collocations":"clear the air between, try to clear the air","preposition_combos":"with","examples":[{"en":"Let's clear the air and talk about what really happened yesterday.","cn":"让我们消除误会，谈谈昨天到底发生了什么。"},{"en":"I think we need to clear the air after that argument.","cn":"我认为在那次争吵之后，我们需要缓和一下气氛。"}],"socratic_questions":[{"question":"如果朋友之间因为一些小事产生了误会，你觉得应该怎么做才能让大家重归于好？","answer_hint":"需要主动沟通，把事情说清楚，解除彼此之间的隔阂。"}],"fill_blank":{"sentences":["After the heated debate, they decided to ___ and discuss their differences calmly."],"options":["clear the air","make a mess","sweep the floor","stir the pot"],"correct_index":0},"audio":"audio/clear_the_air.mp3","audio_ex0":"audio/clear_the_air_ex0.mp3","audio_ex1":"audio/clear_the_air_ex1.mp3","img1":"images/clear_the_air_1.png","img2":"images/clear_the_air_2.png"},{"word":"present","ipa":"/ˈpreznt/","image_prompts":["A beautifully wrapped gift box with a ribbon on a table","A stage with a spotlight shining on a microphone, ready for a performance"],"image_desc_en":"A wrapped gift and a stage with a microphone.","image_desc_cn":"包装好的礼物和带有麦克风的舞台。","meaning_cn":"n. 礼物；现在 adj. 出席的；现在的 v. 赠送，提出","usage":"n. (复数 presents) ; adj.; v. (过去式 presented, 过去分词 presented)","collocations":"birthday present, at present, present a speech","preposition_combos":"present to","examples":[{"en":"I received a lovely present from my best friend yesterday.","cn":"我昨天收到了我最好的朋友送的一份可爱的礼物。"},{"en":"The teacher asked who was present at the meeting today.","cn":"老师问今天谁出席了会议。"}],"socratic_questions":[{"question":"如果你生日，朋友会给你什么？或者，开会时，你需要做什么？","answer_hint":"前者是收到的东西，后者是人需要到场。"}],"fill_blank":{"sentences":["She will ___ her ideas at the meeting tomorrow morning."],"options":["present","presents","presented","presenting"],"correct_index":0},"audio":"audio/present.mp3","audio_ex0":"audio/present_ex0.mp3","audio_ex1":"audio/present_ex1.mp3","img1":"images/present_1.png","img2":"images/present_2.png"},{"word":"standard","ipa":"/ˈstændərd/","image_prompts":["A metal ruler measuring a wooden plank to ensure it meets a specific length requirement","A certificate with a gold seal indicating adherence to quality guidelines"],"image_desc_en":"A ruler measuring a plank; a certificate with a gold seal.","image_desc_cn":"一把尺子测量木板；带有金色印章的证书。","meaning_cn":"标准的，规范的；标准","usage":"adj. n.","collocations":"standard of living, standard procedure, meet the standard","preposition_combos":"to a standard, by standard","examples":[{"en":"This school has a very high academic standard for all students.","cn":"这所学校对所有学生都有很高的学术标准。"},{"en":"The hotel room was clean and met our standard expectations.","cn":"酒店房间很干净，符合我们的标准预期。"}],"socratic_questions":[{"question":"描述一个大家都认可的衡量事物好坏的尺度或规则。","answer_hint":"这个词表示普遍接受的衡量基准。"}],"fill_blank":{"sentences":["The new regulations set a higher ___ for environmental protection."],"options":["standard","ordinary","common","level"],"correct_index":0},"audio":"audio/standard.mp3","audio_ex0":"audio/standard_ex0.mp3","audio_ex1":"audio/standard_ex1.mp3","img1":"images/standard_1.png"},{"word":"award","ipa":"/əˈwɔːrd/","image_prompts":["A golden trophy on a velvet cushion, spotlight shining","A framed certificate hanging on a wall, ornate design"],"image_desc_en":"Images depicting a trophy and a certificate, representing an award.","image_desc_cn":"描绘奖杯和证书的图像，代表奖励。","meaning_cn":"奖励，奖品；授予","usage":"n. 奖品，奖项; v. (awarded, awarded) 授予，颁发","collocations":"receive an award, win an award, award a prize","preposition_combos":"award for","examples":[{"en":"She received an award for her excellent performance in the competition.","cn":"她因在比赛中的出色表现而获得了奖励。"},{"en":"The school will award prizes to the top students this semester.","cn":"学校将在这个学期给优秀学生颁发奖品。"}],"socratic_questions":[{"question":"在比赛或考试中取得好成绩后，你会得到什么？","answer_hint":"通常是物质或荣誉上的肯定。"}],"fill_blank":{"sentences":["The best student will receive an ___ at the end of the year."],"options":["award","excuse","advice","example"],"correct_index":0},"audio":"audio/award.mp3","audio_ex0":"audio/award_ex0.mp3","audio_ex1":"audio/award_ex1.mp3","img2":"images/award_2.png","img1":"images/award_1.png"},{"word":"look on the bright side","ipa":"/lʊk ɒn ðə braɪt saɪd/","image_prompts":["A sunny landscape with vibrant colors and a rainbow arching across the sky","A glass half-full with sparkling water, reflecting light and bubbles"],"image_desc_en":"A positive and optimistic view of a situation.","image_desc_cn":"对情况持积极乐观的态度。","meaning_cn":"往好处看，看到光明面","usage":"短语","collocations":"always look on the bright side, try to look on the bright side","preposition_combos":"look on sth","examples":[{"en":"Even though it rained, we looked on the bright side and played indoors.","cn":"即使下雨了，我们还是往好处看，在室内玩耍。"},{"en":"When you fail, look on the bright side; you can learn from mistakes.","cn":"当你失败时，往好处看；你可以从错误中学习。"}],"socratic_questions":[{"question":"当遇到困难或挫折时，你会选择关注事情的积极方面，而不是消极方面，你会怎么说？","answer_hint":"这个短语表示关注事物好的一面，保持乐观。"}],"fill_blank":{"sentences":["When things get tough, try to ___ and stay positive."],"options":["look on the bright side","give up easily","feel disappointed","ignore the problem"],"correct_index":0},"audio":"audio/look_on_the_bright_side.mp3","audio_ex0":"audio/look_on_the_bright_side_ex0.mp3","audio_ex1":"audio/look_on_the_bright_side_ex1.mp3","img2":"images/look_on_the_bright_side_2.png","img1":"images/look_on_the_bright_side_1.png"},{"word":"get across","ipa":"/ɡet əˈkrɒs/","image_prompts":["A bridge spanning a wide river, sunlight reflecting on the water","A message in a bottle floating on the ocean, reaching a distant shore"],"image_desc_en":"A bridge over a river; a message in a bottle reaching a shore.","image_desc_cn":"一座横跨河流的桥梁；一个漂流瓶到达岸边。","meaning_cn":"（使）被理解；（使）通过","usage":"v. (过去式 got, 过去分词 gotten/got) to successfully communicate ideas or information; to move from one side to the other","collocations":"get across a message, get across the river","preposition_combos":"get across to","examples":[{"en":"He tried to get his point across, but nobody listened.","cn":"他试图使他的观点被理解，但是没有人听。"},{"en":"We need a boat to get across the wide river quickly.","cn":"我们需要一条船来快速通过这条宽阔的河流。"}],"socratic_questions":[{"question":"当你试图解释一个复杂的想法，希望别人明白你的意思，你会怎么做？","answer_hint":"这个短语表示成功地传达信息或观点。"}],"fill_blank":{"sentences":["It's hard to ___ the importance of practicing English every day."],"options":["get across","get around","get over","get through"],"correct_index":0},"audio":"audio/get_across.mp3","audio_ex0":"audio/get_across_ex0.mp3","audio_ex1":"audio/get_across_ex1.mp3","img1":"images/get_across_1.png","img2":"images/get_across_2.png"},{"word":"clearly","ipa":"/ˈklɪrli/","image_prompts":["A perfectly polished mirror reflecting a sharp, distinct image of a vase of flowers","A high-definition photograph of a mountain range, every detail crisp and visible"],"image_desc_en":"Two images representing clarity and distinctness.","image_desc_cn":"两张图片代表清晰和明确。","meaning_cn":"清楚地，明显地","usage":"adv. (形容词 clear 的副词形式)","collocations":"speak clearly, see clearly, understand clearly","preposition_combos":"无","examples":[{"en":"I can hear you clearly now that the music is off.","cn":"音乐关掉后，我现在能清楚地听到你说话了。"},{"en":"She explained the math problem clearly, so everyone understood it.","cn":"她清楚地解释了数学问题，所以每个人都理解了。"}],"socratic_questions":[{"question":"如果某人说话声音很大，而且发音标准，你能怎么样听到他？","answer_hint":"强调容易理解，没有混淆或模糊之处。"}],"fill_blank":{"sentences":["He spoke very ___ during the presentation, so everyone understood him."],"options":["clearly","clear","cloudy","quietly"],"correct_index":0},"audio":"audio/clearly.mp3","audio_ex0":"audio/clearly_ex0.mp3","audio_ex1":"audio/clearly_ex1.mp3","img1":"images/clearly_1.png","img2":"images/clearly_2.png"},{"word":"pressure","ipa":"/ˈpreʃər/","image_prompts":["A gauge measuring high pressure in a pipe system, steam escaping","A hand squeezing a stress ball, the ball deformed under force"],"image_desc_en":"Illustrations depicting the concept of pressure.","image_desc_cn":"描绘压力概念的插图。","meaning_cn":"压力；压迫","usage":"名词 n.；动词 v. (过去式 pressured, 过去分词 pressured)","collocations":"under pressure, put pressure on","preposition_combos":"pressure on","examples":[{"en":"I felt a lot of pressure before the important English exam.","cn":"重要的英语考试前，我感到很大的压力。"},{"en":"The school puts pressure on students to get good grades.","cn":"学校给学生施加压力，让他们取得好成绩。"}],"socratic_questions":[{"question":"当你面临重要考试或比赛时，你通常会感受到什么？","answer_hint":"这种感觉让你紧张，觉得必须做得很好。"}],"fill_blank":{"sentences":["She felt a lot of ___ to finish the project on time."],"options":["pressure","pleasure","treasure","leisure"],"correct_index":0},"audio":"audio/pressure.mp3","audio_ex0":"audio/pressure_ex0.mp3","audio_ex1":"audio/pressure_ex1.mp3","img1":"images/pressure_1.png","img2":"images/pressure_2.png"},{"word":"purpose","ipa":"/ˈpɜːrpəs/","image_prompts":["A detailed blueprint of a complex machine with annotations highlighting its function","A compass pointing towards a distant mountain peak under a clear sky, symbolizing direction"],"image_desc_en":"A blueprint showing function and a compass pointing to a goal.","image_desc_cn":"一份显示功能的蓝图和指向目标的指南针。","meaning_cn":"目的，意图","usage":"n.","collocations":"on purpose, achieve a purpose, main purpose","preposition_combos":"for the purpose of","examples":[{"en":"The main purpose of the trip is to learn about culture.","cn":"这次旅行的主要目的是了解文化。"},{"en":"She did it on purpose to make him angry at school.","cn":"她故意这样做，为了让他在学校生气。"}],"socratic_questions":[{"question":"你做一件事之前，心中想达成的目标是什么？","answer_hint":"这个目标就是你做这件事的理由和动机。"}],"fill_blank":{"sentences":["The ___ of this meeting is to discuss our next project."],"options":["purpose","reason","cause","excuse"],"correct_index":0},"audio":"audio/purpose.mp3","audio_ex0":"audio/purpose_ex0.mp3","audio_ex1":"audio/purpose_ex1.mp3","img1":"images/purpose_1.png","img2":"images/purpose_2.png"},{"word":"on purpose","ipa":"/ˌɒn ˈpɜːrpəs/","image_prompts":["A hand reaching out to knock over a neatly arranged stack of books on a table.","A footprint deliberately placed in a freshly poured concrete surface."],"image_desc_en":"Deliberately causing a disruption or making a mark.","image_desc_cn":"故意造成干扰或留下痕迹。","meaning_cn":"故意地，有目的地","usage":"adv. 故意地","collocations":"do something on purpose","preposition_combos":"on","examples":[{"en":"He broke the vase on purpose, knowing it was expensive.","cn":"他故意打碎了花瓶，因为知道它很贵。"},{"en":"She didn't spill the milk by accident; she did it on purpose.","cn":"她不是不小心洒了牛奶；她是故意的。"}],"socratic_questions":[{"question":"如果某人明明知道后果，还特意去做某事，这是什么行为？","answer_hint":"强调行为的预谋性和有意性。"}],"fill_blank":{"sentences":["I don't think he did it by mistake; he did it ___."],"options":["on purpose","by chance","accidentally","in general"],"correct_index":0},"audio":"audio/on_purpose.mp3","audio_ex0":"audio/on_purpose_ex0.mp3","audio_ex1":"audio/on_purpose_ex1.mp3","img1":"images/on_purpose_1.png","img2":"images/on_purpose_2.png"},{"word":"cut... in half","ipa":"/kʌt ɪn hɑːf/","image_prompts":["A chef's knife slicing a ripe tomato precisely in half on a wooden cutting board","A laser beam precisely dividing a glowing apple into two equal halves"],"image_desc_en":"Illustrations of cutting something in half.","image_desc_cn":"将某物切成两半的图示。","meaning_cn":"把...切成两半","usage":"v. (cut, cut) 将...切成两半","collocations":"cut an apple in half, cut a cake in half","preposition_combos":"cut in half","examples":[{"en":"I will cut the sandwich in half and share it with you.","cn":"我会把三明治切成两半，然后和你分享。"},{"en":"She cut the paper in half to make two smaller pieces.","cn":"她把纸切成两半，做成两张小一点的纸。"}],"socratic_questions":[{"question":"如果你想把一个苹果分成完全相等的两份，你会怎么做？","answer_hint":"需要一个动作，使苹果分成两个相等的部分。"}],"fill_blank":{"sentences":["He ___ the pizza ___ ___ and gave a piece to his friend."],"options":["cut ... in half","cut ... in two","broke ... in half","divided ... into"],"correct_index":0},"audio":"audio/cut_in_half.mp3","audio_ex0":"audio/cut_in_half_ex0.mp3","audio_ex1":"audio/cut_in_half_ex1.mp3","img1":"images/cut_in_half_1.png","img2":"images/cut_in_half_2.png"},{"word":"put oneself in sb's shoes","ipa":"","image_prompts":["A pair of worn leather shoes placed on a map, symbolizing empathy and understanding different perspectives","A set of footprints leading up a steep hill, representing the challenges and experiences of another person"],"image_desc_en":"","image_desc_cn":"","meaning_cn":"设身处地为某人着想","usage":"idiom","collocations":"try to understand, show empathy, consider feelings","preposition_combos":"","examples":[{"en":"Try to put yourself in his shoes; he's under a lot of stress.","cn":"试着设身处地为他着想；他压力很大。"},{"en":"If you put yourself in her shoes, you'd understand her decision.","cn":"如果你设身处地为她着想，你就会理解她的决定。"}],"socratic_questions":[{"question":"当你尝试理解别人的感受和处境时，你会做什么？","answer_hint":"想象自己处于那个人的位置，感受他们的经历。"}],"fill_blank":{"sentences":["To understand her anger, you should ___ in her shoes."],"options":["put yourself","put her","put him","put them"],"correct_index":0},"audio":"audio/put_oneself_in_sbs_shoes.mp3","audio_ex0":"audio/put_oneself_in_sbs_shoes_ex0.mp3","audio_ex1":"audio/put_oneself_in_sbs_shoes_ex1.mp3","img1":"images/put_oneself_in_sbs_shoes_1.png","img2":"images/put_oneself_in_sbs_shoes_2.png"},{"word":"shut","ipa":"/ʃʌt/","image_prompts":["A wooden door completely closed, a dark room behind it","A metal gate with a padlock, preventing entry"],"image_desc_en":"Illustrations of a closed door and a locked gate.","image_desc_cn":"紧闭的木门和锁着的金属门。","meaning_cn":"关闭","usage":"v. (shut, shut); adj.","collocations":"shut down, shut up, shut out","preposition_combos":"shut in, shut out","examples":[{"en":"Please shut the window; it's getting cold in the room.","cn":"请关上窗户，房间里越来越冷了。"},{"en":"The shop will shut at 6 p.m. on Sundays.","cn":"这家商店星期天下午六点关门。"}],"socratic_questions":[{"question":"当你不想让外面的声音传进来时，你会做什么？","answer_hint":"这个动作是把一个东西合上，让它不再是打开的状态。"}],"fill_blank":{"sentences":["Remember to ___ the door when you leave the classroom."],"options":["shut","open","close","enter"],"correct_index":0},"audio":"audio/shut.mp3","audio_ex0":"audio/shut_ex0.mp3","audio_ex1":"audio/shut_ex1.mp3","img2":"images/shut_2.png","img1":"images/shut_1.png"},{"word":"shut... away","ipa":"/ʃʌt əˈweɪ/","image_prompts":["A wooden door with multiple locks and chains, dark room interior","A dusty old book locked inside a glass display case, museum setting"],"image_desc_en":"A door locked shut and a book locked away.","image_desc_cn":"一扇锁上的门和一本锁起来的书。","meaning_cn":"把...关起来；隔离","usage":"v. (过去式 shut, 过去分词 shut) to keep someone or something separate from other people or things","collocations":"shut oneself away, shut away from the world","preposition_combos":"shut away from","examples":[{"en":"He shut himself away in his room to study for exams.","cn":"他把自己关在房间里，为了考试而学习。"},{"en":"She shut the cat away when guests arrived at the house.","cn":"当客人到达时，她把猫关了起来。"}],"socratic_questions":[{"question":"想象一下，为了专心准备重要的事情，你会怎么做？","answer_hint":"需要一个动词短语，表示把自己与外界隔离开来。"}],"fill_blank":{"sentences":["During the holidays, he often ___ himself ___ to read novels."],"options":["shuts...away","shut...away","shutted...away","shut...in"],"correct_index":1},"audio":"audio/shut_away.mp3","audio_ex0":"audio/shut_away_ex0.mp3","audio_ex1":"audio/shut_away_ex1.mp3","img1":"images/shut_away_1.png","img2":"images/shut_away_2.png"},{"word":"lastly","ipa":"/ˈlæstli/","image_prompts":["A series of numbered steps leading to a final destination, focus on the last step","A graduation ceremony with a speaker concluding their speech, 'Finally' displayed on a screen"],"image_desc_en":"Illustrations representing the concept of 'lastly' as the final step or concluding remark.","image_desc_cn":"用图例表示“lastly”的概念，作为最后一步或结论性评论。","meaning_cn":"最后，最终","usage":"adv.","collocations":"lastly but not least","preposition_combos":"N/A","examples":[{"en":"Firstly, add the eggs; secondly, the flour; lastly, the milk.","cn":"首先，加入鸡蛋；其次，加入面粉；最后，加入牛奶。"},{"en":"We discussed budget, schedule, and, lastly, the marketing strategy.","cn":"我们讨论了预算、时间表，以及最后，营销策略。"}],"socratic_questions":[{"question":"在演讲或写作中，当你想要总结所有要点并给出最终结论时，你会用哪个词？","answer_hint":"这个词表示事情发生的顺序中的最后一个。"}],"fill_blank":{"sentences":["___, I want to thank everyone for their hard work on this project."],"options":["Lastly","Firstly","Suddenly","Quickly"],"correct_index":0},"audio":"audio/lastly.mp3","audio_ex0":"audio/lastly_ex0.mp3","audio_ex1":"audio/lastly_ex1.mp3","img1":"images/lastly_1.png"},{"word":"plenty","ipa":"/ˈplenti/","image_prompts":["A large harvest of apples overflowing from a wooden crate, autumn leaves scattered around","A buffet table laden with various dishes, plates stacked high, abundant food"],"image_desc_en":"Abundant quantity or amount.","image_desc_cn":"大量的数量或金额。","meaning_cn":"大量，充足","usage":"n.","collocations":"plenty of time, plenty of food, more than plenty","preposition_combos":"plenty of","examples":[{"en":"We have plenty of time to finish the project well.","cn":"我们有充足的时间来好好完成这个项目。"},{"en":"There's plenty of food for everyone at the party tonight.","cn":"今晚的聚会有足够的食物供大家享用。"}],"socratic_questions":[{"question":"如果你有很多时间准备考试，你会用哪个词来形容你的时间状况？","answer_hint":"这个词表示“足够多”或“超过所需”。"}],"fill_blank":{"sentences":["There is ___ of space in the new classroom for activities."],"options":["plenty","few","lack","bit"],"correct_index":0},"audio":"audio/plenty.mp3","audio_ex0":"audio/plenty_ex0.mp3","audio_ex1":"audio/plenty_ex1.mp3","img1":"images/plenty_1.png","img2":"images/plenty_2.png"},{"word":"plenty of","ipa":"/ˈplenti əv/","image_prompts":["A large bowl overflowing with ripe red apples, autumn harvest theme","A field filled with blooming sunflowers stretching to the horizon, vibrant yellow"],"image_desc_en":"Abundance of apples and sunflowers.","image_desc_cn":"大量的苹果和向日葵。","meaning_cn":"大量的，充足的","usage":"短语，表示某物的数量或程度足够多","collocations":"plenty of time, plenty of food, plenty of space","preposition_combos":"plenty of sth.","examples":[{"en":"We have plenty of time to finish the project well.","cn":"我们有充足的时间把这个项目做好。"},{"en":"There's plenty of food for everyone at the party tonight.","cn":"今晚的聚会有足够的食物给每个人。"}],"socratic_questions":[{"question":"如果你有很多时间做某事，你会用哪个短语来表达“很多”？","answer_hint":"这个短语表示数量或程度足够，甚至超过需要。"}],"fill_blank":{"sentences":["There is ___ sunshine during the summer months here."],"options":["plenty of","a little","few","less"],"correct_index":0},"audio":"audio/plenty_of.mp3","audio_ex0":"audio/plenty_of_ex0.mp3","audio_ex1":"audio/plenty_of_ex1.mp3","img1":"images/plenty_of_1.png","img2":"images/plenty_of_2.png"},{"word":"feel blue","ipa":"/fiːl bluː/","image_prompts":["A single, wilted blue flower lying on a gray stone surface, desaturated colors","A dark rain cloud with heavy raindrops falling onto a deserted street, somber atmosphere"],"image_desc_en":"Images depicting sadness and melancholy.","image_desc_cn":"描绘悲伤和忧郁的图像。","meaning_cn":"感到忧郁，感到沮丧","usage":"idiom","collocations":"feel a bit blue, feel really blue, feel blue about","preposition_combos":"blue about","examples":[{"en":"I often feel blue when the weather is cloudy and rainy.","cn":"当天气多云下雨时，我经常感到忧郁。"},{"en":"She felt blue after failing the exam, but she'll try again.","cn":"考试不及格后她感到沮丧，但她会再次尝试。"}],"socratic_questions":[{"question":"如果你经历了一些不愉快的事情，心情会怎样？用一个颜色来形容。","answer_hint":"这个颜色通常与悲伤和低落的情绪相关联。"}],"fill_blank":{"sentences":["He ___ ___ after his favorite team lost the game."],"options":["felt blue","feels blue","feeling blue","feel blue"],"correct_index":0},"audio":"audio/feel_blue.mp3","audio_ex0":"audio/feel_blue_ex0.mp3","audio_ex1":"audio/feel_blue_ex1.mp3","img1":"images/feel_blue_1.png","img2":"images/feel_blue_2.png"},{"word":"on top of the world","ipa":"/ˌɒn ˈtɒp əv ðə ˈwɜːld/","image_prompts":["A mountain peak with a flag waving in the wind, clear blue sky","A person standing on a high diving board, arms raised in victory"],"image_desc_en":"Feeling extremely happy and successful.","image_desc_cn":"感觉非常快乐和成功。","meaning_cn":"非常高兴，非常成功，感觉棒极了","usage":"idiom","collocations":"feel on top of the world, be on top of the world","preposition_combos":"on top of","examples":[{"en":"After passing the exam, I felt on top of the world.","cn":"考试通过后，我感觉棒极了。"},{"en":"Winning the game made our team feel on top of the world.","cn":"赢得比赛让我们队感觉棒极了。"}],"socratic_questions":[{"question":"当你取得巨大成功或完成一项艰巨任务时，你的感受是什么？","answer_hint":"形容一种极度快乐和满足的状态。"}],"fill_blank":{"sentences":["She felt ___ after receiving the good news."],"options":["on top of the world","under the weather","down in the dumps","out of sorts"],"correct_index":0},"audio":"audio/on_top_of_the_world.mp3","audio_ex0":"audio/on_top_of_the_world_ex0.mp3","audio_ex1":"audio/on_top_of_the_world_ex1.mp3","img1":"images/on_top_of_the_world_1.png","img2":"images/on_top_of_the_world_2.png"},{"word":"all smiles","ipa":"/ɔːl smaɪlz/","image_prompts":["A collection of yellow smiley face stickers arranged in a grid pattern","A field of sunflowers with their faces turned towards the sun, bright and cheerful"],"image_desc_en":"Smiley face stickers and a field of sunflowers.","image_desc_cn":"笑脸贴纸和向日葵田。","meaning_cn":"满面笑容","usage":"短语 phr. expressing happiness or pleasure","collocations":"be all smiles, greet with all smiles","preposition_combos":"at all smiles, with all smiles","examples":[{"en":"She was all smiles when she received the acceptance letter.","cn":"当她收到录取通知书时，她满面笑容。"},{"en":"He greeted us with all smiles after winning the game.","cn":"赢得比赛后，他满面笑容地迎接我们。"}],"socratic_questions":[{"question":"如果你看到一个人脸上充满了喜悦，嘴角上扬，眼睛里闪着光，你会怎么形容他/她的表情？","answer_hint":"这个短语形容一个人非常高兴，脸上洋溢着幸福的表情。"}],"fill_blank":{"sentences":["After hearing the good news, she was ___."],"options":["all smiles","in tears","very sad","quite angry"],"correct_index":0},"audio":"audio/all_smiles.mp3","audio_ex0":"audio/all_smiles_ex0.mp3","audio_ex1":"audio/all_smiles_ex1.mp3","img1":"images/all_smiles_1.png","img2":"images/all_smiles_2.png"},{"word":"in low spirits","ipa":"ɪn loʊ ˈspɪrɪts","image_prompts":["A wilted flower in a vase, petals drooping downwards, desaturated colors","A dark rain cloud hovering over a grey, still lake, no wind"],"image_desc_en":"A wilted flower and a dark rain cloud symbolize sadness.","image_desc_cn":"枯萎的花朵和乌云象征着悲伤。","meaning_cn":"情绪低落，意志消沉","usage":"短语，形容词性","collocations":"be in low spirits, feel in low spirits","preposition_combos":"无","examples":[{"en":"She was in low spirits after failing the important exam.","cn":"重要的考试没通过后，她情绪很低落。"},{"en":"He's been in low spirits since his favorite team lost.","cn":"自从他最喜欢的队伍输了以后，他一直情绪低落。"}],"socratic_questions":[{"question":"如果你考试没考好，或者你喜欢的球队输了，你会感觉怎么样？","answer_hint":"描述的是一种不开心、沮丧的心情。"}],"fill_blank":{"sentences":["After the argument, she was ___ and didn't want to talk."],"options":["in low spirits","in high spirits","on cloud nine","over the moon"],"correct_index":0},"audio":"audio/in_low_spirits.mp3","audio_ex0":"audio/in_low_spirits_ex0.mp3","audio_ex1":"audio/in_low_spirits_ex1.mp3","img1":"images/in_low_spirits_1.png","img2":"images/in_low_spirits_2.png"},{"word":"ring","ipa":"/rɪŋ/","image_prompts":["A golden ring with a large diamond on a velvet cushion","A set of metal rings used in gymnastics, hanging from the ceiling"],"image_desc_en":"Illustrations depicting a piece of jewelry and gymnastic equipment.","image_desc_cn":"描绘珠宝和体操器材的插图。","meaning_cn":"n. 戒指；铃声 v. (rang, rung) 响","usage":"n. 指环；铃声，钟声；圈，环 v. (rang, rung) 鸣，响；按铃","collocations":"wedding ring, ring a bell, give sb. a ring","preposition_combos":"ring at the door, ring for help","examples":[{"en":"She wears a beautiful silver ring on her left hand.","cn":"她左手戴着一枚漂亮的银戒指。"},{"en":"Did you hear the phone ring just a few minutes ago?","cn":"你刚才听到电话铃响了吗？"}],"socratic_questions":[{"question":"结婚时，通常会交换什么信物？","answer_hint":"通常是戴在手指上的，象征承诺。"}],"fill_blank":{"sentences":["I heard the doorbell ___ , but nobody was there when I opened it."],"options":["ring","ringing","rang","sung"],"correct_index":2},"audio":"audio/ring.mp3","audio_ex0":"audio/ring_ex0.mp3","audio_ex1":"audio/ring_ex1.mp3","img1":"images/ring_1.png","img2":"images/ring_2.png"},{"word":"enter","ipa":"/ˈentər/","image_prompts":["A grand doorway with light streaming through, inviting passage","A keyboard with the 'Enter' key highlighted in bright blue"],"image_desc_en":"Illustrations depicting the concept of 'enter', showing a doorway and an 'Enter' key.","image_desc_cn":"描绘“进入”概念的插图，展示了一个门口和一个“回车”键。","meaning_cn":"进入；开始","usage":"v. (entered, entered)","collocations":"enter a room, enter a competition, enter into","preposition_combos":"enter into (a discussion), enter for (a contest)","examples":[{"en":"Did you enter the school singing competition last year?","cn":"你去年参加学校的歌唱比赛了吗？"},{"en":"Please enter quietly when you come into the classroom.","cn":"当你进入教室时，请安静地进来。"}],"socratic_questions":[{"question":"想象你走到一扇门前，准备做什么？","answer_hint":"这个动作表示从外面到里面。"}],"fill_blank":{"sentences":["She decided to ___ the art contest with her latest painting."],"options":["enter","entered","entering","entrance"],"correct_index":0},"audio":"audio/enter.mp3","audio_ex0":"audio/enter_ex0.mp3","audio_ex1":"audio/enter_ex1.mp3","img2
