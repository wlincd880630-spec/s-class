<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit2 词汇测试（至 stomachache）</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f1a;
      --surface: #161829;
      --surface2: #1e2137;
      --border: rgba(255,255,255,0.07);
      --primary: #7c6df0;
      --accent: #22d3c5;
      --green: #4ade80;
      --red: #f87171;
      --amber: #fbbf24;
      --text: #e2e8f0;
      --sub: #94a3b8;
      --radius: 16px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 0.9rem; color: var(--sub); margin-top: 4px; }
    
    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--primary), #5a4dd4);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(124,109,240,.35);
      transition: all .2s;
    }
    .btn-pdf:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(124,109,240,.45);
    }
    
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(34,211,197,.2);
      color: var(--accent);
      font-size: 0.85rem;
    }
    
    .question {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--border);
    }
    .question:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    
    .q-num {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--sub);
      margin-bottom: 10px;
    }
    
    .q-prompt {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    
    .audio-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-play {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(251,191,36,.15);
      color: var(--amber);
      border: 1px solid rgba(251,191,36,.3);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-play:hover { background: rgba(251,191,36,.25); }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all .18s;
      font-family: inherit;
    }
    .opt:hover:not(.disabled) {
      border-color: var(--primary);
      background: rgba(124,109,240,.08);
    }
    .opt.disabled { cursor: default; opacity: 0.8; }
    .opt.correct {
      background: rgba(74,222,128,.12) !important;
      border-color: var(--green) !important;
      color: var(--green) !important;
    }
    .opt.wrong {
      background: rgba(248,113,113,.12) !important;
      border-color: var(--red) !important;
      color: var(--red) !important;
    }
    
    .fill-blank { font-weight: 700; color: var(--accent); }
    
    .score-box {
      text-align: center;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 24px;
    }
    .score-box h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .score-box .score { font-size: 2rem; font-weight: 800; color: var(--accent); }
    
    @media print {
      body { background: #fff; color: #1a1a1a; }
      .header, .btn-pdf, .btn-play, .audio-wrap .btn-play { display: none !important; }
      .section { 
        background: #fff; 
        border: 1px solid #ddd; 
        page-break-inside: avoid;
        box-shadow: none;
      }
      .section-title { color: #1a1a1a; border-color: #ddd; }
      .question { border-color: #eee; }
      .q-prompt { color: #1a1a1a; }
      .opt {
        background: #f8f8f8 !important;
        border-color: #ddd !important;
        color: #1a1a1a !important;
        -webkit-print-color-adjust: exact;
      }
      .opt.correct { border-left: 4px solid #22c55e !important; }
      .fill-blank { color: #1a1a1a; text-decoration: underline; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Unit 2 词汇测试</h1>
        <p>测试范围：careless ～ stomachache（共34个词）</p>
      </div>
      <button class="btn-pdf" onclick="window.print()" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        导出 PDF / 打印
      </button>
    </div>

    <!-- Section 1: 听音选词 -->
    <section class="section">
      <h2 class="section-title"><span class="num">1</span>根据单词发音，选择正确的拼写</h2>
      <div id="s1-questions"></div>
    </section>

    <!-- Section 2: 场景描述选词 -->
    <section class="section">
      <h2 class="section-title"><span class="num">2</span>根据场景描述，选择被描述的单词</h2>
      <div id="s2-questions"></div>
    </section>

    <!-- Section 3: 例句填空 -->
    <section class="section">
      <h2 class="section-title"><span class="num">3</span>选词填空（基于 Unit2 例句）</h2>
      <div id="s3-questions"></div>
    </section>

    <div class="score-box" id="score-box" style="display:none">
      <h3>测验完成</h3>
      <p class="score" id="score-display">0 / 0</p>
      <p id="score-pct"></p>
    </div>
  </div>

  <script>
    const MEDIA_BASE = "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/junior_vocab/G8_B2/Unit2/";
    function mediaUrl(path) {
      if (!path) return "";
      if (path.startsWith("http")) return path;
      var p = path.replace(/^Unit2\/?/, "").replace(/^\//, "");
      return MEDIA_BASE + (p ? p : "");
    }

    const AUDIO_MAP = {
      "careless":"Unit2/audio/careless.mp3","runny":"Unit2/audio/runny.mp3","cough":"Unit2/audio/cough.mp3",
      "bruised":"Unit2/audio/bruised.mp3","take a seat":"Unit2/audio/take_a_seat.mp3",
      "take sb's temperature":"Unit2/audio/take_sbs_temperature.mp3","test":"Unit2/audio/test.mp3",
      "flu":"Unit2/audio/flu.mp3","medicine":"Unit2/audio/medicine.mp3","mask":"Unit2/audio/mask.mp3",
      "stop ... from doing":"Unit2/audio/stop__from_doing.mp3","virus":"Unit2/audio/virus.mp3",
      "description":"Unit2/audio/description.mp3","patient":"Unit2/audio/patient.mp3",
      "injury":"Unit2/audio/injury.mp3","illness":"Unit2/audio/illness.mp3","knife":"Unit2/audio/knife.mp3",
      "safety":"Unit2/audio/safety.mp3","clear":"Unit2/audio/clear.mp3","pain":"Unit2/audio/pain.mp3",
      "what's more":"Unit2/audio/whats_more.mp3","brightness":"Unit2/audio/brightness.mp3",
      "environment":"Unit2/audio/environment.mp3","cross":"Unit2/audio/cross.mp3",
      "catch fire":"Unit2/audio/catch_fire.mp3","themselves":"Unit2/audio/themselves.mp3",
      "fry":"Unit2/audio/fry.mp3","turn on":"Unit2/audio/turn_on.mp3","stove":"Unit2/audio/stove.mp3",
      "happily":"Unit2/audio/happily.mp3","ourselves":"Unit2/audio/ourselves.mp3",
      "sore":"Unit2/audio/sore.mp3","throat":"Unit2/audio/throat.mp3","stomachache":"Unit2/audio/stomachache.mp3"
    };

    // Section 1: 听音选拼写 (答案, 选项数组) - 高迷惑性：同音词、形近词、易混拼写
    const S1 = [
      ["careless", ["careles","careless","carelessness","carelessly"]],
      ["runny", ["runy","runny","runney","rainy"]],
      ["cough", ["coff","cough","couph","cought"]],
      ["bruised", ["bruized","bruised","breeze","broosed"]],
      ["flu", ["flue","flu","flew","floo"]],
      ["virus", ["virous","virus","vyrus","virius"]],
      ["patient", ["pashent","patient","patience","pacient"]],
      ["injury", ["injery","injury","injurey","injurie"]],
      ["environment", ["enviornment","environment","enviroment","envirement"]],
      ["stove", ["stov","stove","strove","stoev"]],
      ["sore", ["soar","sore","soer","sor"]],
      ["stomachache", ["stomache","stomachache","stomachack","stomachake"]]
    ];

    // Section 2: 场景描述选词 (场景, 答案, 选项)
    const S2 = [
      ["如果你不小心把门忘了锁，别人可能说你太___了。","careless",["careless","carefully","careful","carelessness"]],
      ["感冒时鼻子会流出液体，这种状态叫___ nose。","runny",["runny","dry","wet","blocked"]],
      ["喉咙不舒服时会发出很大的声音，那是在___。","cough",["cough","sneeze","yawn","breathe"]],
      ["从自行车上摔下来后，腿上可能出现青紫色，那是___了。","bruised",["bruised","broken","scratched","bleeding"]],
      ["等候时工作人员常说：Please ___。","take a seat",["take a seat","take a break","have a rest","sit down"]],
      ["护士见医生前会先量体温，即 ___。","take sb's temperature",["take sb's temperature","check your heart","give medicine","ask questions"]],
      ["科学家要___新药以确保安全。","test",["test","take","try","use"]],
      ["冬季很多人会得___，发烧咳嗽。","flu",["flu","cold","fever","headache"]],
      ["生病恢复健康需要服用___。","medicine",["medicine","food","water","exercise"]],
      ["流感季节很多人戴___防护。","mask",["mask","hat","glasses","gloves"]],
      ["大雨___我们去公园。","stop ... from doing",["stop ... from doing","help ... to","allow ... to","let ... to"]],
      ["电脑感染___后可能损坏文件。","virus",["virus","program","document","software"]],
      ["用语言解释某事物的样子是在做___。","description",["description","prescription","subscription","instruction"]],
      ["医生对病人很___，耐心解答问题。","patient",["patient","impatient","patience","impatience"]],
      ["足球比赛中受到严重___可能无法继续。","injury",["injury","energy","ability","illness"]],
      ["身体不适发烧咳嗽，可能是得了___。","illness",["illness","happiness","fitness","wellness"]],
      ["切苹果需要锋利的___。","knife",["knife","fork","spoon","plate"]],
      ["骑自行车戴头盔是为了___。","safety",["safety","speed","comfort","style"]],
      ["老师___表示作业必须按时完成。","clear",["clear","clearly","cleaned","clearing"]],
      ["摔倒后腿上一阵剧___。","pain",["pain","gain","main","rain"]],
      ["食物美味；___，服务也很棒。","what's more",["what's more","however","therefore","instead"]],
      ["屏幕的___可以在设置里调节。","brightness",["brightness","darkness","color","size"]],
      ["保护___让子孙后代能享受。","environment",["environment","adventure","equipment","government"]],
      ["过马路时要小心___ the street。","cross",["cross","pass","walk","run"]],
      ["干燥的草在炎热天气容易___。","catch fire",["catch fire","fall down","cool down","break up"]],
      ["他们___建造了整个树屋。","themselves",["themselves","himself","herself","itself"]],
      ["用油在平底锅___鸡蛋。","fry",["fry","boil","bake","steam"]],
      ["进黑暗房间要___ the light。","turn on",["turn on","turn off","look at","find"]],
      ["厨房里用来做饭的煤气___。","stove",["stove","oven","fridge","sink"]],
      ["孩子们在公园里___地玩耍。","happily",["happily","sadly","angrily","quietly"]],
      ["我们___装饰了教室。","ourselves",["ourselves","themselves","himself","herself"]],
      ["长跑后腿很___。","sore",["sore","happy","tired","strong"]],
      ["感冒时___会疼，影响唱歌。","throat",["throat","head","stomach","nose"]],
      ["吃太多冰淇淋会___。","stomachache",["stomachache","headache","toothache","backache"]]
    ];

    // Section 3: 例句填空 (句子含 ___, 答案, 选项)
    const S3 = [
      ["It was ___ of you to leave the door unlocked.","careless",["careless","careful","carefully","care"]],
      ["I have a ___ nose because I caught a cold yesterday.","runny",["runny","dry","wet","blocked"]],
      ["She started to ___ loudly after inhaling the dust.","cough",["cough","sneeze","yawn","breathe"]],
      ["His leg was badly ___ after he fell off his bike.","bruised",["bruised","broken","hurt","injured"]],
      ["Please ___ while I find your file.","take a seat",["take a seat","sit down","have a rest","wait"]],
      ["The nurse will ___ before you see the doctor.","take your temperature",["take your temperature","check you","help you","ask you"]],
      ["We will have a math ___ next week in class.","test",["test","exam","lesson","class"]],
      ["Many students catch the ___ during the cold winter months.","flu",["flu","cold","virus","fever"]],
      ["You should take this ___ three times a day after meals.","medicine",["medicine","pill","drug","vitamin"]],
      ["During the flu season, many people wear a ___.","mask",["mask","hat","glove","cap"]],
      ["The heavy rain ___ us ___ going to the park.","stop ... from",["stop ... from","prevent ... from","keep ... from","help ... to"]],
      ["I caught a bad ___ and had to stay home from school.","virus",["virus","cold","flu","fever"]],
      ["The book gives a vivid ___ of life in the countryside.","description",["description","explanation","instruction","direction"]],
      ["The doctor was very ___ with all of her patients today.","patient",["patient","patience","impatient","calm"]],
      ["He suffered a serious ___ during the football match.","injury",["injury","hurt","pain","illness"]],
      ["His ___ kept him away from school for almost two weeks.","illness",["illness","sickness","disease","health"]],
      ["He used a ___ to cut the apple into smaller pieces.","knife",["knife","fork","spoon","tool"]],
      ["The school teaches us about road ___ to avoid accidents.","safety",["safety","safe","security","protection"]],
      ["The teacher made it ___ that homework must be done on time.","clear",["clear","clearly","clean","clearly"]],
      ["I felt a sharp ___ in my leg after the fall.","pain",["pain","ache","hurt","sore"]],
      ["The food was delicious; ___, the service was excellent.","what's more",["what's more","however","therefore","besides"]],
      ["The ___ of the sun made me close my eyes quickly.","brightness",["brightness","light","bright","darkness"]],
      ["We should protect the ___ for future generations.","environment",["environment","nature","world","planet"]],
      ["We should ___ the street at the traffic lights carefully.","cross",["cross","pass","walk","run"]],
      ["The dry grass will easily ___ in the summer heat.","catch fire",["catch fire","burn","fire","flame"]],
      ["They built the treehouse by ___, it was impressive.","themselves",["themselves","themself","ourselves","himself"]],
      ["I like to ___ eggs for breakfast on weekends.","fry",["fry","cook","boil","bake"]],
      ["Please ___ the lights; it's getting dark.","turn on",["turn on","open","switch","turn"]],
      ["She cooked dinner on the gas ___ in the kitchen.","stove",["stove","oven","fire","cooker"]],
      ["The children played ___ in the park all afternoon.","happily",["happily","happy","sad","quiet"]],
      ["We can decorate the classroom by ___ for the party.","ourselves",["ourselves","themselves","himself","yourselves"]],
      ["She has a ___ throat, so she can't sing today.","sore",["sore","sick","painful","hurt"]],
      ["I have a sore ___, so I can't sing well today.","throat",["throat","head","stomach","mouth"]],
      ["I have a terrible ___ because I ate too much ice cream.","stomachache",["stomachache","stomach","headache","toothache"]]
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderS1() {
      const box = document.getElementById("s1-questions");
      S1.forEach((item, qi) => {
        const [ans, opts] = item;
        const shuffled = shuffle([...opts]);
        const q = document.createElement("div");
        q.className = "question";
        q.innerHTML = `
          <div class="q-num">第 ${qi + 1} 题</div>
          <div class="q-prompt">听发音，选择正确的拼写：</div>
          <div class="audio-wrap">
            <button class="btn-play" type="button" data-audio="${AUDIO_MAP[ans] || ''}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              播放发音
            </button>
          </div>
          <div class="options"></div>
        `;
        const optDiv = q.querySelector(".options");
        shuffled.forEach((o, i) => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = o;
          btn.dataset.correct = (o === ans) ? "1" : "0";
          btn.dataset.ans = ans;
          optDiv.appendChild(btn);
        });
        box.appendChild(q);
      });
    }

    function renderS2() {
      const box = document.getElementById("s2-questions");
      S2.forEach((item, qi) => {
        const [scene, ans, opts] = item;
        const shuffled = shuffle([...opts]);
        const q = document.createElement("div");
        q.className = "question";
        q.innerHTML = `
          <div class="q-num">第 ${qi + 1} 题</div>
          <div class="q-prompt">${scene}</div>
          <div class="options"></div>
        `;
        const optDiv = q.querySelector(".options");
        shuffled.forEach((o) => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = o;
          btn.dataset.correct = (o === ans) ? "1" : "0";
          optDiv.appendChild(btn);
        });
        box.appendChild(q);
      });
    }

    function renderS3() {
      const box = document.getElementById("s3-questions");
      S3.forEach((item, qi) => {
        const [sent, ans, opts] = item;
        const shuffled = shuffle([...opts]);
        const blank = sent.replace("___", "<span class='fill-blank'>______</span>");
        const q = document.createElement("div");
        q.className = "question";
        q.innerHTML = `
          <div class="q-num">第 ${qi + 1} 题</div>
          <div class="q-prompt">${blank}</div>
          <div class="options"></div>
        `;
        const optDiv = q.querySelector(".options");
        shuffled.forEach((o) => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = o;
          btn.dataset.correct = (o === ans) ? "1" : "0";
          optDiv.appendChild(btn);
        });
        box.appendChild(q);
      });
    }

    function init() {
      renderS1();
      renderS2();
      renderS3();

      document.querySelectorAll(".btn-play").forEach(btn => {
        btn.onclick = function() {
          const path = this.dataset.audio;
          if (path) new Audio(mediaUrl(path)).play().catch(() => {});
        };
      });

      let total = 0, correct = 0;
      document.querySelectorAll(".opt").forEach(opt => {
        total++;
        opt.onclick = function() {
          if (this.classList.contains("disabled")) return;
          const opts = this.closest(".options").querySelectorAll(".opt");
          opts.forEach(o => { o.classList.add("disabled"); });
          const isCorrect = this.dataset.correct === "1";
          if (isCorrect) correct++;
          this.classList.add(isCorrect ? "correct" : "wrong");
          if (isCorrect) {
            opts.forEach(o => {
              if (o !== this && o.dataset.correct === "1") o.classList.add("correct");
            });
          } else {
            opts.forEach(o => {
              if (o.dataset.correct === "1") o.classList.add("correct");
            });
          }
          updateScore();
        };
      });

      function updateScore() {
        const done = document.querySelectorAll(".opt.disabled").length;
        const right = document.querySelectorAll(".opt.correct").length;
        if (done >= total) {
          const box = document.getElementById("score-box");
          const disp = document.getElementById("score-display");
          const pct = document.getElementById("score-pct");
          box.style.display = "block";
          disp.textContent = right + " / " + total;
          pct.textContent = "正确率 " + Math.round((right / total) * 100) + "%";
        }
      }
    }

    init();
  </script>
</body>
</html>
