<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>

</head>

","img1":"images/full_1.png","img2":"images/full_2.png"},{"word":"full name","ipa":"/fʊl neɪm/","image_prompts":["A passport with a person's full name printed on the cover","A school ID card showing the full name in capital letters"],"image_desc_en":"A close-up of a passport and an ID card, both displaying a complete full name in clear black text.","image_desc_cn":"一本护照和一张学生证的近景，上面都用清晰的黑色字体显示了完整的全名。","meaning_cn":"全名（包括姓和名）","usage":"用于正式场合或表格中，表示一个人的完整姓名，通常包括名（given name）和姓（family name）。","collocations":["write your full name","full name on the form","give your full name"],"preposition_combos":["under one's full name","with one's full name"],"examples":[{"en":"Please write your full name on the top line.","cn":"请在第一行写上你的全名。"},{"en":"My full name is on the cover of this book.","cn":"我的全名写在这本书的封面上。"}],"socratic_questions":[{"question":"Why do we need to write our full name on a passport instead of just a first name?","answer_hint":"Because a full name helps identify a person exactly and avoids confusion with others who share the same first name."}],"fill_blank":{"sentences":["Please write your ___ on the form before you hand it in.","The teacher asked everyone to say their ___ at the beginning of class.","You need to put your ___ on the test paper."],"options":["A. full name","B. first name","C. last name","D. nickname"],"correct_index":0},"audio":"audio/full_name.mp3","audio_ex0":"audio/full_name_ex0.mp3","audio_ex1":"audio/full_name_ex1.mp3","img1":"images/full_name_1.png","img2":"images/full_name_2.png"},{"word":"grade","ipa":"/ɡreɪd/","image_prompts":["A report card with an A+ grade on a desk","A stack of graded papers with red marks on a table"],"image_desc_en":"A close-up of a report card showing a high grade with a red pen next to it on a wooden desk.","image_desc_cn":"一张成绩单的特写，显示高分，旁边有一支红笔放在木桌上。","meaning_cn":"年级；等级；成绩","usage":"grade 可指学校的年级，也可指作业或考试的分数等级。","collocations":["good grade","high grade","grade point average"],"preposition_combos":["in grade","grade on"],"examples":[{"en":"She got a good grade on the math test.","cn":"她在数学考试中取得了好成绩。"},{"en":"My brother is in the seventh grade this year.","cn":"我哥哥今年上七年级。"}],"socratic_questions":[{"question":"Why do teachers give grades on homework?","answer_hint":"To show how well a student understands the lesson."}],"fill_blank":{"sentences":["My sister is in the eighth ___ this year.","The teacher gave a high ___ for my project."],"options":["A. grade","B. class","C. score","D. level"],"correct_index":0},"audio":"audio/grade.mp3","audio_ex0":"audio/grade_ex0.mp3","audio_ex1":"audio/grade_ex1.mp3","img1":"images/grade_1.png","img2":"images/grade_2.png"},{"word":"last name","ipa":"/læst neɪm/","image_prompts":["A library card with the surname printed at the bottom","A passport page showing the family name field"],"image_desc_en":"A close-up of a library card with the word 'Smith' written under 'Last Name'.","image_desc_cn":"一张借书卡的特写，在“姓氏”一栏下写着“Smith”。","meaning_cn":"姓氏","usage":"用于指代一个人的家族姓氏，常与 first name（名字）相对。","collocations":["write your last name","last name first"],"preposition_combos":["under one's last name","with a common last name"],"examples":[{"en":"Please write your last name on the top line.","cn":"请在第一行写上你的姓氏。"},{"en":"My last name is Wang, and my first name is Lei.","cn":"我姓王，名字叫雷。"}],"socratic_questions":[{"question":"Why do we put last name after first name in some forms?","answer_hint":"In English, the family name often comes last, but in some cultures it comes first."}],"fill_blank":{"sentences":["On the form, you need to fill in your ___ first.","A. first name B. last name C. middle name D. full name"],"options":["A","B","C","D"],"correct_index":1},"audio":"audio/last_name.mp3","audio_ex0":"audio/last_name_ex0.mp3","audio_ex1":"audio/last_name_ex1.mp3","img1":"images/last_name_1.png","img2":"images/last_name_2.png"},{"word":"classmate","ipa":"/ˈklɑːs.meɪt/","image_prompts":["Two desks side by side with a shared pencil case in the middle","A row of backpacks hanging on hooks in a classroom"],"image_desc_en":"Two wooden desks placed next to each other, with a blue pencil case and a notebook lying between them, under a window with sunlight.","image_desc_cn":"两张并排的木桌，中间放着一个蓝色铅笔盒和一本笔记本，窗户透进阳光。","meaning_cn":"同班同学","usage":"指在同一班级学习的人，常用于描述学校中一起上课的伙伴。","collocations":["my classmate","new classmate","classmate project"],"preposition_combos":["classmate from","classmate in"],"examples":[{"en":"My classmate and I share a desk in the classroom.","cn":"我和我的同班同学在教室里共用一张课桌。"},{"en":"The new classmate sits next to the window.","cn":"新来的同班同学坐在窗户旁边。"}],"socratic_questions":[{"question":"Why do you think a classmate is different from a friend?","answer_hint":"A classmate is someone in the same class, but a friend can be from any class or place."}],"fill_blank":{"sentences":["My ___ and I do homework together after school.","The teacher asks a ___ to help clean the board.","I meet my ___ at the school gate every morning."],"options":["A. classmate","B. teacher","C. parent","D. doctor"],"correct_index":0},"audio":"audio/classmate.mp3","audio_ex0":"audio/classmate_ex0.mp3","audio_ex1":"audio/classmate_ex1.mp3","img1":"images/classmate_1.png","img2":"images/classmate_2.png"},{"word":"class teacher","ipa":"/klɑːs ˈtiːtʃər/","image_prompts":["A classroom with a desk and a stack of notebooks","A whiteboard with lesson notes and a pointer"],"image_desc_en":"A classroom desk with a stack of notebooks and a red pen, next to a whiteboard with lesson notes and a pointer.","image_desc_cn":"一张教室课桌上放着一叠笔记本和一支红笔，旁边是一块写有课程笔记的白板和一根教鞭。","meaning_cn":"班主任；班级教师","usage":"class teacher 指负责管理一个班级的教师，常用于学校语境。","collocations":["our class teacher","class teacher meeting","new class teacher"],"preposition_combos":["talk to the class teacher","ask the class teacher for help"],"examples":[{"en":"Our class teacher checks homework every morning.","cn":"我们的班主任每天早上检查作业。"},{"en":"The class teacher will hold a meeting next Monday.","cn":"班主任下周一将开一个会议。"}],"socratic_questions":[{"question":"Why does a class teacher need to check homework?","answer_hint":"To see if students understand the lesson and help them improve."}],"fill_blank":{"sentences":["Our ___ checks our homework every day.","The ___ will talk to us about the school trip."],"options":["A. class teacher","B. math book","C. school bag","D. pencil case"],"correct_index":0},"audio":"audio/class_teacher.mp3","audio_ex0":"audio/class_teacher_ex0.mp3","audio_ex1":"audio/class_teacher_ex1.mp3","img1":"images/class_teacher_1.png","img2":"images/class_teacher_2.png"},{"word":"hot pot","ipa":"/hɒt pɒt/","image_prompts":["A steaming metal pot on a table with raw vegetables and meat slices around it","A bubbling red broth in a ceramic pot with chopsticks and a ladle nearby"],"image_desc_en":"A metal pot filled with boiling soup and ingredients sits on a table, with plates of raw food and dipping sauces around it.","image_desc_cn":"一个装满沸腾汤底和食材的金属锅放在桌上，周围摆着生食盘和蘸料。","meaning_cn":"火锅","usage":"名词，指一种将食材放入沸腾汤底中煮熟食用的中式烹饪方式。","collocations":"have hot pot, eat hot pot, hot pot restaurant, hot pot soup base","preposition_combos":"hot pot with friends, hot pot at home, ingredients for hot pot","examples":[{"en":"We often have hot pot at home in winter.","cn":"冬天我们经常在家吃火锅。"},{"en":"The hot pot soup base is very spicy today.","cn":"今天的火锅汤底非常辣。"}],"socratic_questions":[{"question":"Why do people usually eat hot pot in cold weather?","answer_hint":"Because the hot soup keeps the body warm and the meal is shared."},{"question":"What ingredients can you put into a hot pot?","answer_hint":"Meat, vegetables, tofu, mushrooms, and noodles."}],"fill_blank":{"sentences":["My family likes to have ___ together on weekends."],"options":["A. hot pot","B. cold drink","C. ice cream","D. sandwich"],"correct_index":0},"audio":"audio/hot_pot.mp3","audio_ex0":"audio/hot_pot_ex0.mp3","audio_ex1":"audio/hot_pot_ex1.mp3","img1":"images/hot_pot_1.png","img2":"images/hot_pot_2.png"},{"word":"Wood","ipa":"/wʊd/","imag 市，常与 in, from, to 等介词连用。","collocations":["Singapore is a small country.","fly to Singapore","live in Singapore"],"preposition_combos":["in Singapore","from Singapore","to Singapore"],"examples":[{"en":"My pen pal comes from Singapore.","cn":"我的笔友来自新加坡。"},{"en":"Singapore is a clean and green city.","cn":"新加坡是一个干净又绿色的城市。"}],"socratic_questions":[{"question":"If you want to visit a warm country in Southeast Asia, why might you choose Singapore?","answer_hint":"Because Singapore has a modern city, good food, and a warm climate all year."}],"fill_blank":{"sentences":["My aunt lives in ___.","The plane from Beijing to ___ takes about six hours."],"options":["A. Singapore","B. China","C. Japan","D. India"],"correct_index":0},"audio":"audio/Singapore.mp3","audio_ex0":"audio/Singapore_ex0.mp3","audio_ex1":"audio/Singapore_ex1.mp3","img1":"images/Singapore_1.png","img2":"images/Singapore_2.png"},{"word":"the Great Wall","ipa":"/ðə ɡreɪt wɔːl/","image_prompts":["A long stone wall winding over green mountains under a blue sky","A watchtower on a stone wall with autumn leaves around it"],"image_desc_en":"A long stone wall stretches across green hills under a clear blue sky, with a watchtower visible in the distance.","image_desc_cn":"一道长长的石墙在蓝天下的青山上蜿蜒伸展，远处可见一座烽火台。","meaning_cn":"长城","usage":"专有名词，通常与定冠词 the 连用，首字母大写。","collocations":"visit the Great Wall, walk on the Great Wall, see the Great Wall","preposition_combos":"on the Great Wall, at the Great Wall, along the Great Wall","examples":[{"en":"We plan to visit the Great Wall next Sunday.","cn":"我们计划下周日去参观长城。"},{"en":"Many tourists take photos on the Great Wall.","cn":"许多游客在长城上拍照。"}],"socratic_questions":[{"question":"Why do we say 'the Great Wall' instead of just 'Great Wall'?","answer_hint":"Because it is a unique landmark, so we use 'the' before its name."}],"fill_blank":{"sentences":["My family wants to visit ___ next summer.","___ is one of the most famous places in China.","We took many pictures on ___."],"options":["A. the Great Wall","B. a Great Wall","C. Great Wall","D. the great wall"],"correct_index":0},"audio":"audio/the_Great_Wall.mp3","audio_ex0":"audio/the_Great_Wall_ex0.mp3","audio_ex1":"audio/the_Great_Wall_ex1.mp3","img1":"images/the_Great_Wall_1.png","img2":"images/the_Great_Wall_2.png"},{"word":"London","ipa":"/ˈlʌndən/","image_prompts":["A red double-decker bus on a rainy street","A view of the River Thames with Big Ben in the background"],"image_desc_en":"A red double-decker bus driving past a tall clock tower beside a wide river under a grey sky.","image_desc_cn":"一辆红色双层巴士驶过宽阔河流旁的高大钟楼，天空灰蒙蒙的。","meaning_cn":"伦敦（英国首都）","usage":"专有名词，指英国的首都城市。","collocations":["visit London","in London","London Bridge"],"preposition_combos":["in London","from London","to London"],"examples":[{"en":"My pen friend lives in London, England.","cn":"我的笔友住在英国伦敦。"},{"en":"The train from London arrives at noon.","cn":"从伦敦来的火车中午到达。"}],"socratic_questions":[{"question":"Why is London a famous city in the world?","answer_hint":"Because it has many famous places like Big Ben and the River Thames."}],"fill_blank":{"sentences":["The capital of the UK is ___.","My uncle will fly to ___ next Monday."],"options":["A. London","B. Paris","C. Tokyo","D. Beijing"],"correct_index":0},"audio":"audio/London.mp3","audio_ex0":"audio/London_ex0.mp3","audio_ex1":"audio/London_ex1.mp3","img1":"images/London_1.png","img2":"images/London_2.png"},{"word":"first name","ipa":"/fɜːrst neɪm/","image_prompts":["A form with a blank labeled 'First Name' above a line","A passport page showing the first name field filled in","An ID card with the first name highlighted in a box"],"image_desc_en":"A close-up of a white paper form with the words 'First Name' printed in black above an empty underline.","image_desc_cn":"一张白色表格的特写，上方印有黑色文字 'First Name'，下面有一条空白下划线。","meaning_cn":"名（名字中排在姓氏前面的部分）","usage":"用于指代一个人的个人名字，通常在姓氏之前。","collocations":"write your first name, first name and last name, first name only","preposition_combos":"with a first name, under first name","examples":[{"en":"Please write your first name on the top line.","cn":"请在第一行写上你的名。"},{"en":"My first name is Tom, and my last name is Green.","cn":"我的名是汤姆，姓是格林。"}],"socratic_questions":[{"question":"If a form asks for 'first name', which part of your full name do you fill in?","answer_hint":"The part that comes before your family name, like 'Emma' in 'Emma Smith'."}],"fill_blank":{"sentences":["On the form, you need to write your ___ in the first box."],"options":["A. first name","B. last name","C. middle name","D. full name"],"correct_index":0},"audio":"audio/first_name.mp3","audio_ex0":"audio/first_name_ex0.mp3","audio_ex1":"audio/first_name_ex1.mp3","img1":"images/first_name_1.png","img2":"images/first_name_2.png"},{"word":"mistake","ipa":"/mɪˈsteɪk/","image_prompts":["A notebook with a crossed-out wrong answer and a correct one written beside it","A math worksheet with a red circle around an incorrect calculation"],"image_desc_en":"A close-up of a notebook page showing a crossed-out wrong number and the correct number rewritten next to it, with a red pen nearby.","image_desc_cn":"笔记本页面的特写，显示一个被划掉的错误数字和旁边重写的正确数字，旁边有一支红笔。","meaning_cn":"错误；失误","usage":"名词，指在行为、判断或理解中出现的错误。","collocations":["make a mistake","common mistake","correct a mistake"],"preposition_combos":["mistake in","mistake about"],"examples":[{"en":"I made a mistake in my homework last night.","cn":"我昨晚在作业中犯了一个错误。"},{"en":"It is a common mistake to spell this word wrong.","cn":"拼错这个词是一个常见的错误。"}],"socratic_questions":[{"question":"If you find a mistake in your test, what should you do next?","answer_hint":"You should correct it and learn from it."}],"fill_blank":{"sentences":["Please check your answers carefully to avoid any ___.","The teacher helped me find the ___ in my sentence.","Everyone can learn from a ___ if they try."],"options":["A. mistake","B. mistakes","C. mistaken","D. mistaking"],"correct_index":0},"audio":"audio/mistake.mp3","audio_ex0":"audio/mistake_ex0.mp3","audio_ex1":"audio/mistake_ex1.mp3","img1":"images/mistake_1.png","img2":"images/mistake_2.png"},{"word":"country","ipa":"/ˈkʌntri/","image_prompts":["A world map with several countries highlighted in different colors","A passport and a suitcase on a wooden table with a globe in the background"],"image_desc_en":"A colorful world map showing different countries with borders and capital city markers.","image_desc_cn":"一张彩色世界地图，显示不同国家的边界和首都标记。","meaning_cn":"国家；乡村","usage":"可数名词，指一个独立的政治地理区域，也可指乡村地区。","collocations":["home country","foreign country","country music","country road"],"preposition_combos":["in a country","from a country","across the country"],"examples":[{"en":"China is a large country with a long history.","cn":"中国是一个历史悠久的大国。"},{"en":"My uncle lives in the country near a big lake.","cn":"我叔叔住在大湖附近的乡村。"}],"socratic_questions":[{"question":"If you want to learn about a new country, what three things would you look at first?","answer_hint":"Possible answers: its capital city, language, and flag."}],"fill_blank":{"sentences":["Japan is an island ___ in East Asia.","They drove through the ___ to reach the farm."],"options":["country","city","river","mountain"],"correct_index":0},"audio":"audio/country.mp3","audio_ex0":"audio/country_ex0.mp3","audio_ex1":"audio/country_ex1.mp3","img1":"images/country_1.png","img2":"images/country_2.png"},{"word":"same","ipa":"/seɪm/","image_prompts":["Two identical red apples on a wooden table","Two matching blue notebooks stacked on a desk"],"image_desc_en":"Two identical red apples placed side by side on a wooden table.","image_desc_cn":"两个相同的红苹果并排放在木桌上。","meaning_cn":"相同的；同样的","usage":"形容词，常与 the 连用，表示两个或以上事物完全一致。","collocations":"the same as, look the same, at the same time","preposition_combos":"the same as","examples":[{"en":"My schoolbag is the same as yours.","cn":"我的书包和你的相同。"},{"en":"We go to school at the same time.","cn":"我们在同一时间上学。"}],"socratic_questions":[{"question":"If two books have the same cover but different pages, are they the same book?","answer_hint":"No, because the content is different. 'Same' means everything is identical."}],"fill_blank":{"sentences":["My pencil case is the ___ as my friend's.","A. different","B. same","C. new","D. old"],"options":["A","B","C","D"],"correct_index":1},"audio":"audio/same.mp3","audio_ex0":"audio/same_ex0.mp3","audio_ex1":"audio/same_ex1.mp3","img1":"images/same_1.png","img2":"images/same_2.png"},{"word":"twin","ipa":"/twɪn/","image_prompts":["Two identical red apples on a wooden table","A pair of matching blue school bags side by side"],"image_desc_en":"Two identical red apples placed next to each other on a wooden table.","image_desc_cn":"两个一模一样的红苹果并排放在木桌上。","meaning_cn":"双胞胎之一；成对的，双胞胎的","usage":"twin 作名词指双胞胎之一，作形容词表示成双的、双胞胎的。","collocations":"twin sister, twin brother, twin beds, twin towers","preposition_combos":"twin of (…的双胞胎之一)","examples":[{"en":"My twin sister and I share the same birthday.","cn":"我和我的双胞胎妹妹同一天生日。"},{"en":"The hotel room has two twin beds by the window.","cn":"酒店房间的窗边有两张单人床。"}],"socratic_questions":[{"question":"If two books look exactly the same, can we call them twin books? Why?","answer_hint":"Yes, because 'twin' means two things that are very similar or come in a pair."}],"fill_blank":{"sentences":["My ___ brother and I are both in Grade 7."],"options":["A. twin","B. twin's","C. twins","D. twinning"],"correct_index":0},"audio":"audio/twin.mp3","audio_ex0":"audio/twin_ex0.mp3","audio_ex1":"audio/twin_ex1.mp3","img1":"images/twin_1.png","img2":"images/twin_2.png"},{"word":"both","ipa":"/boʊθ/","image_prompts":["Two books on a desk, one red and one blue","Two apples in a bowl, one green and one red"],"image_desc_en":"Two apples in a bowl, one green and one red, with a label saying 'both' underneath.","image_desc_cn":"碗里有两个苹果，一个绿色一个红色，下方标签写着“both”。","meaning_cn":"两者；两个都","usage":"both 用于指代两个人或事物，常与 and 连用构成 both...and... 结构，表示“两者都”。","collocations":"both sides, both hands, both parents, both answers","preposition_combos":"both of","examples":[{"en":"Both of my pens are blue.","cn":"我的两支钢笔都是蓝色的。"},{"en":"She can both sing and dance well.","cn":"她既能唱又能跳得很好。"}],"socratic_questions":[{"question":"If you have two erasers, one white and one pink, how do you say they are all on the table?","answer_hint":"Use 'both' to talk about the two erasers together."}],"fill_blank":{"sentences":["___ of my hands are clean.","___ of my hands are clean."],"options":["Both","All","Every","Each"],"correct_index":0},"audio":"audio/both.mp3","audio_ex0":"audio/both_ex0.mp3","audio_ex1":"audio/both_ex1.mp3","img1":"images/both_1.png","img2":"images/both_2.png"},{"word":"band","ipa":"/bænd/","image_prompts":["A stage with musical instruments like drums, guitars, and microphones under colorful lights","A row of music stands with sheet music and a conductor's baton on a wooden floor"],"image_desc_en":"A stage with musical instruments arranged on stands, microphones set up, and colorful stage lights shining down.","image_desc_cn":"一个舞台上摆放着乐器架、麦克风，彩色舞台灯光照射下来。","meaning_cn":"乐队；带子；一伙人","usage":"可数名词，常指演奏流行音乐、摇滚乐等的乐队，也可指带状物或一群有共同目的的人。","collocations":["rock band","school band","marching band","rubber band"],"preposition_combos":["in a band","join a band","play in a band"],"examples":[{"en":"My brother plays the guitar in a rock band.","cn":"我哥哥在一个摇滚乐队里弹吉他。"},{"en":"The school band will give a concert next Friday.","cn":"学校乐队下周五将举办一场音乐会。"}],"socratic_questions":[{"question":"If you want to start a band, what instruments do you need?","answer_hint":"You might need a guitar, drums, keyboard, and a microphone."},{"question":"Why do people use a rubber band in daily life?","answer_hint":"To hold things together, like papers or a bunch of pencils."}],"fill_blank":{"sentences":["Tom wants to join the school ___ because he loves music.","A rubber ___ can hold these cards together.","The ___ played three songs at the party."],"options":["A. band","B. hand","C. land","D. sand"],"correct_index":0},"audio":"audio/band.mp3","audio_ex0":"audio/band_ex0.mp3","audio_ex1":"audio/band_ex1.mp3","img1":"images/band_1.png","img2":"images/band_2.png"},{"word":"pot","ipa":"/pɒt/","image_prompts":["A clay pot on a wooden table in a kitchen","A metal pot with a lid on a stove"],"image_desc_en":"A brown clay pot sits on a wooden table in a bright kitchen, with a green plant growing out of it.","image_desc_cn":"一个棕色陶罐放在明亮厨房的木桌上，里面长着一株绿色植物。","meaning_cn":"罐；锅；壶","usage":"名词，指用于烹饪、盛放食物或种植植物的容器。","collocations":["cooking pot","flower pot","pot of tea"],"preposition_combos":["in a pot","out of the pot","into the pot"],"examples":[{"en":"Mom put the soup in a big pot on the stove.","cn":"妈妈把汤放进炉子上的大锅里。"},{"en":"There is a small flower pot on the window sill.","cn":"窗台上有一个小花盆。"}],"socratic_questions":[{"question":"Why do we use a pot instead of a plate to cook soup?","answer_hint":"Because a pot has high sides and can hold liquid without spilling."}],"fill_blank":{"sentences":["Please put the water into the ___ and boil it.","The plant needs a bigger ___ to grow well."],"options":["A. pot","B. cup","C. plate","D. bowl"],"correct_index":0},"audio":"audio/pot.mp3","audio_ex0":"audio/pot_ex0.mp3","audio_ex1":"audio/pot_ex1.mp3","img1":"images/pot_1.png","img2":"images/pot_2.png"},{"word":"a lot","ipa":"/ə lɒt/","image_prompts":["A pile of books on a desk","A jar full of coins next to a piggy bank"],"image_desc_en":"A large pile of colorful books stacked on a wooden desk, with a lamp beside them.","image_desc_cn":"一张木桌上堆着一大堆彩色书籍，旁边有一盏台灯。","meaning_cn":"很多；大量","usage":"常用于修饰动词，表示程度或数量大，也可修饰比较级。","collocations":["like a lot","help a lot","eat a lot"],"preposition_combos":[],"examples":[{"en":"I have a lot of homework today.","cn":"我今天有很多家庭作业。"},{"en":"She reads a lot in the library.","cn":"她在图书馆读了很多书。"}],"socratic_questions":[{"question":"If you say 'I like apples a lot', what does 'a lot' tell us?","answer_hint":"It tells us the degree of liking is high, meaning 'very much'."}],"fill_blank":{"sentences":["There are ___ of flowers in the garden.","She studies ___ every evening."],"options":["a lot","a lot of","lots","lot"],"correct_index":0},"audio":"audio/a_lot.mp3","audio_ex0":"audio/a_lot_ex0.mp3","audio_ex1":"audio/a_lot_ex1.mp3","img1":"images/a_lot_1.png","img2":"images/a_lot_2.png"},{"word":"tofu","ipa":"/ˈtoʊfuː/","image_prompts":["A white block of tofu on a wooden cutting board","A bowl of tofu soup with green onions and soy sauce"],"image_desc_en":"A white block of tofu on a wooden cutting board, with a small bowl of soy sauce beside it.","image_desc_cn":"一块白色豆腐放在木砧板上，旁边有一小碗酱油。","meaning_cn":"豆腐","usage":"可数名词（常作不可数名词，表示食物）","collocations":"tofu soup, fried tofu, tofu salad, soft tofu","preposition_combos":"tofu with vegetables, tofu in soup, tofu for dinner","examples":[{"en":"I like to eat tofu with vegetables for lunch.","cn":"我午餐喜欢吃豆腐配蔬菜。"},{"en":"My mother makes delicious tofu soup at home.","cn":"我妈妈在家做美味的豆腐汤。"}],"socratic_questions":[{"question":"Why do people often put tofu in soup instead of eating it dry?","answer_hint":"Because tofu absorbs the flavor of the soup and becomes softer and tastier."}],"fill_blank":{"sentences":["I want to eat ___ for dinner tonight.","She puts ___ in the salad to make it healthy.","___ is a popular food in Chinese cooking."],"options":["A. tofu","B. bread","C. rice","D. meat"],"correct_index":0},"audio":"audio/tofu.mp3","audio_ex0":"audio/tofu_ex0.mp3","audio_ex1":"audio/tofu_ex1.mp3","img1":"images/tofu_1.png","img2":"images/tofu_2.png"},{"word":"parrot","ipa":"/ˈpærət/","image_prompts":["A colorful parrot sitting on a wooden perch in a cage","A parrot eating a piece of fruit on a branch"],"image_desc_en":"A bright green and yellow parrot with a curved beak stands on a tree branch.","image_desc_cn":"一只亮绿色和黄色的鹦鹉，弯弯的喙，站在树枝上。","meaning_cn":"鹦鹉","usage":"名词，指一种色彩鲜艳、能模仿人说话的鸟。","collocations":"talking parrot, pet parrot, parrot cage, parrot food","preposition_combos":"parrot in a cage, parrot on a perch, parrot with colorful feathers","examples":[{"en":"The parrot can say hello in English.","cn":"这只鹦鹉会用英语说你好。"},{"en":"My uncle keeps a parrot in his living room.","cn":"我叔叔在客厅里养了一只鹦鹉。"}],"socratic_questions":[{"question":"Why do people often teach parrots to speak?","answer_hint":"Because parrots can imitate human sounds and words."}],"fill_blank":{"sentences":["The colorful ___ can repeat what you say.","I saw a green ___ in the pet shop yesterday."],"options":["parrot","pencil","panda","piano"],"correct_index":0},"audio":"audio/parrot.mp3","audio_ex0":"audio/parrot_ex0.mp3","audio_ex1":"audio/parrot_ex1.mp3","img1":"images/parrot_1.png","img2":"images/parrot_2.png"},{"word":"guitar","ipa":"/ɡɪˈtɑːr/","image_prompts":["A wooden guitar leaning against a wall in a music room","A guitar on a stand next to a music sheet and a metronome"],"image_desc_en":"A brown acoustic guitar placed on a wooden floor beside a stack of sheet music.","image_desc_cn":"一把棕色原声吉他放在木地板上，旁边有一叠乐谱。","meaning_cn":"吉他","usage":"可数名词，指一种弦乐器。","collocations":["play the guitar","acoustic guitar","electric guitar","guitar lesson"],"preposition_combos":["play on a guitar","learn to play the guitar"],"examples":[{"en":"My brother plays the guitar every evening after dinner.","cn":"我哥哥每天晚饭后弹吉他。"},{"en":"She bought a new acoustic guitar for her music class.","cn":"她为音乐课买了一把新的原声吉他。"}],"socratic_questions":[{"question":"Why do you think a guitar is often used in folk music?","answer_hint":"Because it is portable and can produce both melody and chords."},{"question":"What is the difference between an acoustic guitar and an electric guitar?","answer_hint":"An acoustic guitar uses a hollow body to amplify sound, while an electric guitar needs an amplifier."}],"fill_blank":{"sentences":["He can play the ___ very well.","She practices the ___ every morning.","The ___ has six strings."],"options":["A. guitar","B. piano","C. violin","D. drum"],"correct_index":0},"audio":"audio/guitar.mp3","audio_ex0":"audio/guitar_ex0.mp3","audio_ex1":"audio/guitar_ex1.mp3","img1":"images/guitar_1.png","img2":"images/guitar_2.png"},{"word":"tennis","ipa":"/ˈtenɪs/","image_prompts":["A yellow tennis ball resting on a green court with white lines","Two tennis rackets crossed on a wooden bench beside a net"],"image_desc_en":"A bright yellow tennis ball sits on the green court, with white boundary lines and a net in the background.","image_desc_cn":"一个亮黄色的网球放在绿色球场上，背景有白色边界线和球网。","meaning_cn":"网球（运动）","usage":"tennis 是不可数名词，常与 play 搭配表示打网球。","collocations":"play tennis, tennis ball, tennis racket, tennis court, tennis match","preposition_combos":"on the tennis court, with a tennis racket","examples":[{"en":"We play tennis on the school court every Saturday.","cn":"我们每周六在学校球场打网球。"},{"en":"My brother bought a new tennis racket last week.","cn":"我哥哥上周买了一个新网球拍。"}],"socratic_questions":[{"question":"Why do you need a net to play tennis?","answer_hint":"The net divides the court and players hit the ball over it."},{"question":"What kind of ball is used in tennis?","answer_hint":"A small, round, yellow ball covered with soft felt."}],"fill_blank":{"sentences":["My sister likes to ___ tennis after school.","We need a racket and a ball to play ___.","The ___ match will start at three o'clock."],"options":["A. play","B. hit","C. throw","D. kick"],"correct_index":0},"audio":"audio/tennis.mp3","audio_ex0":"audio/tennis_ex0.mp3","audio_ex1":"audio/tennis_ex1.mp3","img1":"images/tennis_1.png","img2":"images/tennis_2.png"},{"word":"page","ipa":"/peɪdʒ/","image_prompts":["An open book with a bookmark on the right page","A page of a notebook with handwritten notes and a pencil beside it"],"image_desc_en":"A close-up of an open book showing a page with text and a bookmark placed at the top corner.","image_desc_cn":"一本打开的书，展示一页有文字的书页，书签放在上角。","meaning_cn":"页；页码","usage":"名词，指书、笔记本、文件等的一面或一页。","collocations":["turn the page","on page 10","next page"],"preposition_combos":["on page","at page"],"examples":[{"en":"Please open your book to page 12.","cn":"请打开你的书到第12页。"},{"en":"There is a picture on the next page.","cn":"下一页有一张图片。"}],"socratic_questions":[{"question":"If you are reading a book and want to find a map, where do you look?","answer_hint":"You look at the page number or the table of contents to find the correct page."}],"fill_blank":{"sentences":["Please turn to ___ 5 in your textbook.","The story continues on the next ___.","How many ___ does this book have?"],"options":["A. page","B. paper","C. pen","D. pencil"],"correct_index":0},"audio":"audio/page.mp3","audio_ex0":"audio/page_ex0.mp3","audio_ex1":"audio/page_ex1.mp3","img1":"images/page_1.png","img2":"images/page_2.png"},{"word":"even","ipa":"/ˈiːvən/","image_prompts":["A perfectly flat table surface with a ruler showing no gaps","Two identical pencils placed side by side on a desk, both the same length"],"image_desc_en":"A smooth, level wooden tabletop with a metal ruler lying flat, showing no bumps or curves.","image_desc_cn":"一张光滑平整的木桌桌面，上面平放着一把金属直尺，没有凸起或弯曲。","meaning_cn":"甚至；平坦的；相等的","usage":"常用于加强语气，表示出乎意料或强调程度；也可作形容词表示表面平整或数量相等。","collocations":["even better","even more","even if","even though"],"preposition_combos":[],"examples":[{"en":"The road is so even that bikes ride smoothly.","cn":"这条路非常平坦，自行车骑起来很顺畅。"},{"en":"Even a small cup can hold enough water for a plant.","cn":"甚至一个小杯子也能装足够浇一棵植物的水。"}],"socratic_questions":[{"question":"If a table is not even, what problem might happen when you put a book on it?","answer_hint":"The book might slide off or not stay flat because the surface is uneven."}],"fill_blank":{"sentences":["The two pieces of wood are ___ in length, so they fit perfectly.","___ a tiny seed can grow into a big tree with enough sunlight."],"options":["even","ever","every","event"],"correct_index":0},"audio":"audio/even.mp3","audio_ex0":"audio/even_ex0.mp3","audio_ex1":"audio/even_ex1.mp3","img1":"images/even_1.png","img2":"images/even_2.png"},{"word":"hey","ipa":"/heɪ/","image_prompts":["A speech bubble with the word 'Hey' above a ringing phone on a desk","A bright yellow sticky note with 'Hey!' written on it, stuck on a laptop screen"],"image_desc_en":"A speech bubble with 'Hey' floating above a ringing phone on a wooden desk, next to a coffee mug.","image_desc_cn":"一个写着“Hey”的对话框漂浮在木桌上响铃的电话上方，旁边有一个咖啡杯。","meaning_cn":"嘿；喂（用于引起注意或打招呼）","usage":"用于非正式场合，呼唤某人或表示惊讶、提醒。","collocations":"say hey, hey there, hey you","preposition_combos":"无固定介词搭配","examples":[{"en":"Hey, can you pass me that blue pen?","cn":"嘿，你能把那支蓝色钢笔递给我吗？"},{"en":"Hey, look at the big red bus outside.","cn":"嘿，看外面那辆红色大巴士。"}],"socratic_questions":[{"question":"Why do we use 'hey' instead of 'hello' in some situations?","answer_hint":"Because 'hey' is more casual and friendly, often used with friends or to get someone's attention quickly."}],"fill_blank":{"sentences":["___ , don't forget to bring your notebook tomorrow."],"options":["A. Hey","B. Goodbye","C. Sorry","D. Thanks"],"correct_index":0},"audio":"audio/hey.mp3","audio_ex0":"audio/hey_ex0.mp3","audio_ex1":"audio/hey_ex1.mp3","img1":"images/hey_1.png","img2":"images/hey_2.png"},{"word":"play the guitar","ipa":"/pleɪ ðə ɡɪˈtɑːr/","image_prompts":["A wooden guitar resting on a music stand in a bright room","A guitar leaning against a stack of sheet music on a desk"],"image_desc_en":"A wooden acoustic guitar placed on a soft cloth, with a pick nearby on a table.","image_desc_cn":"一把木吉他放在软布上，旁边桌上有一枚拨片。","meaning_cn":"弹吉他","usage":"表示演奏吉他这一乐器，play后接乐器时通常加定冠词the。","collocations":["play the guitar well","learn to play the guitar","play the guitar in a band"],"preposition_combos":["play the guitar for someone","play the guitar with a pick"],"examples":[{"en":"My brother can play the guitar very well.","cn":"我哥哥吉他弹得很好。"},{"en":"She wants to learn to play the guitar this summer.","cn":"她今年夏天想学弹吉他。"}],"socratic_questions":[{"question":"Why do we say 'play the guitar' but not 'play guitar' in formal English?","answer_hint":"Because 'the' is used before musical instruments when talking about playing them as a skill or activity."},{"question":"What other instruments can we use with 'play the'?","answer_hint":"Piano, violin, drums, flute, etc."}],"fill_blank":{"sentences":["Tom can ___ the guitar for the school show.","Does your sister ___ the guitar every evening?"],"options":["A. play","B. plays","C. playing","D. played"],"correct_index":0},"audio":"audio/play_the_guitar.mp3","audio_ex0":"audio/play_the_guitar_ex0.mp3","audio_ex1":"audio/play_the_guitar_ex1.mp3","img1":"images/play_the_guitar_1.png","img2":"images/play_the_guitar_2.png"},{"word":"would","ipa":"/wʊd/","image_prompts":["A closed book with a question mark on the cover, next to a cup of tea","A calendar with a circled date and a clock showing a future time"],"image_desc_en":"A closed book with a question mark on the cover and a cup of tea beside it on a wooden table.","image_desc_cn":"一本封面带有问号的合上的书，旁边木桌上放着一杯茶。","meaning_cn":"会；愿意（表示礼貌请求、意愿或虚拟语气）","usage":"情态动词，后接动词原形，常用于礼貌请求、假设或过去习惯。","collocations":"would like, would you please, would rather","preposition_combos":"would like to, would rather than","examples":[{"en":"Would you like some water or juice?","cn":"你想要一些水还是果汁？"},{"en":"I would go to the park if it stops raining.","cn":"如果雨停了，我会去公园。"}],"socratic_questions":[{"question":"If you want to ask a friend politely for help, which word can you use before 'help'?","answer_hint":"Use 'would' to make the request polite, like 'Would you help me?'"}],"fill_blank":{"sentences":["___ you like a cup of hot milk before bed?"],"options":["A. Would","B. Will","C. Do","D. Did"],"correct_index":0},"audio":"audio/would.mp3","audio_ex0":"audio/would_ex0.mp3","audio_ex1":"audio/would_ex1.mp3","img1":"images/would_1.png","img2":"images/would_2.png"},{"word":"information","ipa":"/ˌɪnfərˈmeɪʃn/","image_prompts":["A computer screen showing a webpage with text and icons","A library shelf with books and a sign reading 'Information Desk'"],"image_desc_en":"A computer monitor displays a webpage filled with text, images, and navigation links, representing digital information.","image_desc_cn":"一台电脑显示器显示一个充满文字、图片和导航链接的网页，代表数字信息。","meaning_cn":"信息；资料；情报","usage":"不可数名词，表示关于某人或某事的事实或细节。","collocations":["useful information","information desk","information technology"],"preposition_combos":["information about","information on"],"examples":[{"en":"You can find useful information about the city online.","cn":"你可以在网上找到关于这个城市的有用信息。"},{"en":"The library has a lot of information on science topics.","cn":"图书馆有很多关于科学主题的信息。"}],"socratic_questions":[{"question":"Why do we say 'some information' instead of 'an information'?","answer_hint":"Because 'information' is an uncountable noun and cannot be used with 'a' or 'an'."},{"question":"If you need information about a school, where can you look?","answer_hint":"You can look on the school's website, at the information desk, or in a brochure."}],"fill_blank":{"sentences":["Can you give me some ___ about the bus schedule?","We need more ___ before making a decision."],"options":["A. informations","B. information","C. an information","D. information's"],"correct_index":1},"audio":"audio/information.mp3","audio_ex0":"audio/information_ex0.mp3","audio_ex1":"audio/information_ex1.mp3","img1":"images/information_1.png","img2":"images/information_2.png"},{"word":"hobby","ipa":"/ˈhɒbi/","image_prompts":["A paintbrush and a palette on a wooden table","A stack of books and a magnifying glass on a desk","A pair of gardening gloves next to a small potted plant"],"image_desc_en":"A paintbrush and a palette with colorful paints on a wooden table, with a sketchbook nearby.","image_desc_cn":"一张木桌上放着画笔和调色板，旁边有一本素描本。","meaning_cn":"爱好；业余爱好","usage":"可数名词，指在空闲时间经常做的活动。","collocations":"have a hobby, take up a hobby, favorite hobby","preposition_combos":"hobby of + doing sth.","examples":[{"en":"My hobby is reading books about space.","cn":"我的爱好是阅读关于太空的书。"},{"en":"She has a hobby of collecting stamps.","cn":"她有一个集邮的爱好。"}],"socratic_questions":[{"question":"What do you call an activity you enjoy doing in your free time?","answer_hint":"It starts with 'h' and rhymes with 'lobby'."},{"question":"If you like drawing, what can you say drawing is for you?","answer_hint":"Use the word 'hobby' in a short sentence."}],"fill_blank":{"sentences":["Reading is a good ___ for students.","My father's ___ is fishing on weekends.","Do you have any ___ like painting or cycling?"],"options":["A. hobby","B. homework","C. habit","D. holiday"],"correct_index":0},"audio":"audio/hobby.mp3","audio_ex0":"audio/hobby_ex0.mp3","audio_ex1":"audio/hobby_ex1.mp3","img1":"images/hobby_1.png","img2":"images/hobby_2.png"},{"word":"green","ipa":"/ɡriːn/","image_prompts":["A green apple on a wooden table","A green traffic light against a blue sky","A green leaf with water droplets"],"image_desc_en":"A bright green leaf with water droplets on a dark background.","image_desc_cn":"深色背景上一片带有水滴的鲜绿色叶子。","meaning_cn":"绿色的；青葱的","usage":"形容词，描述颜色或未成熟的状态。","collocations":"green light, green leaves, green grass","preposition_combos":"green with (envy), green in (color)","examples":[{"en":"The green light means you can go.","cn":"绿灯意味着你可以走。"},{"en":"These green apples taste very sour.","cn":"这些绿苹果尝起来很酸。"}],"socratic_questions":[{"question":"Why do we say 'green light' for permission?","answer_hint":"Because a green traffic light allows cars to move forward."}],"fill_blank":{"sentences":["The grass is ___ in spring."],"options":["A. green","B. red","C. blue","D. yellow"],"correct_index":0},"audio":"audio/green.mp3","audio_ex0":"audio/green_ex0.mp3","audio_ex1":"audio/green_ex1.mp3","img1":"images/green_1.png","img2":"images/green_2.png"},{"word":"UK","ipa":"/ˌjuːˈkeɪ/","image_prompts":["A red double-decker bus on a rainy street in London","A map of the British Isles with the UK highlighted in blue"],"image_desc_en":"A red double-decker bus parked beside a black street lamp under a grey sky.","image_desc_cn":"一辆红色双层巴士停在黑色路灯旁，天空灰暗。","meaning_cn":"英国（大不列颠及北爱尔兰联合王国）","usage":"UK 是 United Kingdom 的缩写，用作专有名词，通常前面加定冠词 the。","collocations":["the UK government","live in the UK","visit the UK"],"preposition_combos":["in the UK","from the UK","to the UK"],"examples":[{"en":"My pen friend lives in the UK.","cn":"我的笔友住在英国。"},{"en":"The UK has four countries: England, Scotland, Wales and Northern Ireland.","cn":"英国有四个国家：英格兰、苏格兰、威尔士和北爱尔兰。"}],"socratic_questions":[{"question":"Why do we say 'the UK' instead of just 'UK'?","answer_hint":"Because UK is short for 'United Kingdom', and we use 'the' before names that include a common noun like 'kingdom'."}],"fill_blank":{"sentences":["London is the capital city of ___.","___ is an island country in Europe.","My uncle moved to ___ last year."],"options":["A. the UK","B. the USA","C. the UN","D. the UAE"],"correct_index":0},"audio":"audio/UK.mp3","audio_ex0":"audio/UK_ex0.mp3","audio_ex1":"audio/UK_ex1.mp3","img1":"images/UK_1.png","img2":"images/UK_2.png"},{"word":"US","ipa":"/ʌs/","image_prompts":["A map of the United States with a star marking the capital","A passport and a small flag of the United States on a desk"],"image_desc_en":"A map of the United States with a star marking the capital, next to a passport and a small flag on a wooden desk.","image_desc_cn":"一张标有首都星标的美国地图，旁边放着一本护照和一面小国旗在木桌上。","meaning_cn":"我们（宾格）","usage":"作动词或介词的宾语，表示“我们”","collocations":["tell us","help us","with us","for us"],"preposition_combos":["to us","from us","with us","for us"],"examples":[{"en":"The teacher gives us a new book today.","cn":"老师今天给了我们一本新书。"},{"en":"Can you come to the park with us?","cn":"你能和我们一起去公园吗？"}],"socratic_questions":[{"question":"If you want to say 'the book belongs to us', which word should you use before 'book'?","answer_hint":"Use 'our' because it shows possession."},{"question":"In 'She sits between you and ___', should you use 'we' or 'us'?","answer_hint":"Use 'us' because it comes after the preposition 'between'."}],"fill_blank":{"sentences":["The map shows the way for ___.","Please wait for ___ at the school gate.","The story is about ___ and our friends."],"options":["A. we","B. us","C. our","D. ours"],"correct_index":1},"audio":"audio/US.mp3","audio_ex0":"audio/US_ex0.mp3","audio_ex1":"audio/US_ex1.mp3","img1":"images/US_1.png","img2":"images/US_2.png"}]}]};

  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}

  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{

        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>

      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;

        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}

/* ═══════════════════════════════════════════════
   复习流程
═══════════════════════════════════════════════ */
function setReviewDots(active) {
  ["rd1","rd2","rd3"].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el){ if(i<active-1) el.className="step-dot done"; else if(i===active-1) el.className="step-dot active"; else el.className="step-dot"; }
  });
}
function setReviewChip(word) {
  document.getElementById("review-chip-word").textContent = word||"";
}

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
  setReviewDots(1);
  showPage("p-review");
  showSocraticQuestion();
  saveProgress();
}

function showSocraticQuestion() {
  const w = reviewOrders ? reviewBatch[reviewOrders.socratic[reviewIdx]] : reviewBatch[reviewIdx];
  const q = (w.socratic_questions||[])[0];
  if (!q) { reviewStep2(); return; }
  document.getElementById("review-socratic-q").textContent = q.question||"";
  const opts = document.getElementById("review-socratic-opts"); opts.innerHTML="";
  [...reviewBatch].sort(()=>Math.random()-.5).map(x=>x.word).forEach(wo=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=wo;
    b.onclick=()=>{
      opts.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=wo.toLowerCase()===w.word.toLowerCase();
      reviewLogs.push({ type:"socratic", word:w.word, question:q.question||"", userAnswer:wo, correct:w.word, ok });
      b.classList.add(ok?"correct":"wrong");
      if(!ok) opts.querySelectorAll(".opt-btn").forEach(x=>{ if(x.textContent.toLowerCase()===w.word.toLowerCase()) x.classList.add("correct"); });
      const fb=document.getElementById("review-socratic-fb");
      fb.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb.style.display="block";
      fb.textContent=ok?"✓ 正确！"+(q.answer_hint?"  "+q.answer_hint:""):"✗ 答案是「"+w.word+"」"+(q.answer_hint?"  "+q.answer_hint:"");
      document.getElementById("review-socratic-next").disabled=false;
    };
    opts.appendChild(b);
  });
  document.getElementById("review-socratic-fb").style.display="none";
  document.getElementById("review-socratic-next").disabled=true;
}

function reviewStep2() {
  reviewStep = 2;
  document.getElementById("review-step1").style.display="none";
  document.getElementById("review-step2").style.display="block";
  setReviewDots(2);
  showPage("p-review");
  saveProgress();
  const w = reviewOrders ? reviewBatch[reviewOrders.fill[reviewIdx]] : reviewBatch[reviewIdx];
  const fb=w.fill_blank||{};
  const sents=fb.sentences||[], opts=fb.options||[], ci=fb.correct_index??0;
  const sent=(sents[0]||"").trim();
  const qDiv=document.getElementById("review-fill-q"); qDiv.innerHTML="";
  if(sent){
    const d=document.createElement("div"); d.className="fill-sent";
    d.innerHTML=sent.replace(/___/g,"<mark>___</mark>");
    qDiv.appendChild(d);
  }
  qDiv.innerHTML+='<p style="font-size:.85rem;color:var(--sub);margin-bottom:10px">'+(sent?"选出正确的词填入空白：":"选出最符合词义的选项：")+"</p>";
  const div=document.getElementById("review-fill-opts"); div.innerHTML="";
  const choices=opts.length?opts:sents;
  choices.forEach((t,i)=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=t;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=i===ci;
      reviewLogs.push({ type:"fill", word:w.word, sentence:sent, userChoice:t, correctChoice:choices[ci]||"", ok });
      b.classList.add(ok?"correct":"wrong");
      const fb2=document.getElementById("review-fill-fb");
      fb2.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb2.style.display="block";
      fb2.textContent=ok?"✓ 正确！":"✗ 正确答案："+(choices[ci]||"");
      document.getElementById("review-fill-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("review-fill-fb").style.display="none";
  document.getElementById("review-fill-next").disabled=true;
}

function goToTranslationStep() {
  reviewStep = 3;
  document.getElementById("review-step2").style.display="none";
  document.getElementById("review-step4").style.display="block";
  setReviewDots(3);
  saveProgress();
  window._dictWord = reviewOrders ? reviewBatch[reviewOrders.translation[reviewIdx]] : reviewBatch[reviewIdx];
  const exs=window._dictWord.examples||[];
  window._transSentence = exs[0]?.en||exs[Math.floor(Math.random()*exs.length)]?.en||"";
  const _ex = (window._dictWord?.examples||[]).find(e=>e.en===window._transSentence)
              || (window._dictWord?.examples||[])[0] || {};
  window._transRefCn = _ex.cn || "";
  document.getElementById("review-trans-en").textContent = window._transSentence || "（无例句）";
  document.getElementById("review-trans-result").style.display="none";
}

/* ═══════════════════════════════════════════════
   翻译朗读 + DeepSeek 评价（持续识别，手动开始/停止）
═══════════════════════════════════════════════ */
function toggleTransRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("review-trans-record");

  if (transRecording) {
    // ── 停止录音 ──
    transRecording = false;
    btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
    btn.classList.remove("recording");
    if (window._transRec) {
      window._transRec.stopContinuousRecognitionAsync(
        async () => {
          const text = (window._transFullText||"").trim();
          const resultDiv = document.getElementById("review-trans-result");
          if (!text) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--sub)">未识别到语音，请重试</div>`;
    return;
  }
          await evaluateTranslation(window._transSentence||"", text, window._transRefCn||"");
        },
        e => console.error("stop err:", e)
      );
    }
    return;
  }

  // ── 开始录音 ──
  transRecording = true;
  window._transFullText = "";
  btn.innerHTML = '<i class="fas fa-stop"></i> 点击停止录音';
  btn.classList.add("recording");
  document.getElementById("review-trans-result").style.display = "none";

  const zhCfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  zhCfg.speechRecognitionLanguage = "zh-CN";
  const rec = new SpeechSDK.SpeechRecognizer(zhCfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  window._transRec = rec;

  // 实时显示识别到的片段
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._transFullText += e.result.text;
      const resultDiv = document.getElementById("review-trans-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text2)">
        识别中：<span style="color:var(--text)">${window._transFullText}</span>
      </div>`;
    }
  };

  rec.startContinuousRecognitionAsync(
    () => {},
    e => {
      transRecording = false;
      btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
      btn.classList.remove("recording");
      console.error("start err:", e);
      alert("无法启动中文语音识别：" + (e?.message || e));
    }
  );
}

async function evaluateTranslation(enText, studentCn, refCn) {
  const resultDiv=document.getElementById("review-trans-result");
  resultDiv.style.display="block";
  resultDiv.innerHTML=`<div class="eval-loading"><span class="spin">⟳</span> DeepSeek 正在评价…</div>`;
  document.getElementById("review-trans-next").disabled=false;
  try {
    const prompt=`你是初中英语翻译评价专家，帮助八年级学生提升英译中能力。
英文原句：${enText}
参考中文：${refCn||"（无）"}
学生朗读的中文翻译：${studentCn}

请用JSON格式返回评价，包含这些字段：
- score: 整数0-100（语义准确度）
- correct: 翻译正确/较好的部分（简洁，1句）
- issues: 主要问题或遗漏（1-2句，没有则写"无明显问题"）
- standard: 最佳参考翻译（1句）
- tip: 针对性的学习建议（1句，结合初中生水平）`;

    const resp=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-v4-flash",
        messages:[{role:"user",content:prompt}],
        response_format:{type:"json_object"},
        temperature:0.3,max_tokens:400
      })
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    const data=await resp.json();
    const ev=JSON.parse(data.choices[0].message.content);
    const s=ev.score??0;
    reviewLogs.push({ type:"translation", word:window._dictWord?.word||"", en:enText, studentCn, score:s, correct:ev.correct||"", issues:ev.issues||"", standard:ev.standard||"" });
    const cls=s>=80?"eval-score-hi":s>=55?"eval-score-mid":"eval-score-lo";
    resultDiv.innerHTML=`
      <div class="eval-card">
        <div class="eval-score-row">
          <div class="eval-score-circle ${cls}">${s}</div>
          <div>
            <div style="font-size:.75rem;font-weight:800;color:var(--sub);letter-spacing:.05em;margin-bottom:4px">DEEPSEEK 评分</div>
            <div style="font-size:.85rem;color:var(--sub)">你说的：<span style="color:var(--text)">${studentCn}</span></div>
          </div>
        </div>
        ${ev.correct?`<div class="eval-row"><span class="eval-lbl">✓ 正确</span><span class="eval-val" style="color:var(--green)">${ev.correct}</span></div>`:""}
        ${ev.issues?`<div class="eval-row"><span class="eval-lbl">⚠ 问题</span><span class="eval-val" style="color:#fca5a5">${ev.issues}</span></div>`:""}
        <div class="eval-row"><span class="eval-lbl">📝 标准</span><span class="eval-val">${ev.standard||refCn||"—"}</span></div>
        ${ev.tip?`<div class="eval-tip">💡 ${ev.tip}</div>`:""}
      </div>`;
  } catch(e) {
    resultDiv.innerHTML=`<div class="eval-card"><p style="color:var(--sub);font-size:.88rem">评价暂不可用：${e.message}</p></div>`;
    console.error("DeepSeek eval:", e);
  }
}

function finishReview() {
  reviewIdx++;
  if (reviewIdx < reviewBatch.length) {
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display=id==="review-step1"?"block":"none";
    });
    setReviewDots(1);
    document.getElementById("review-socratic-opts").innerHTML="";
    document.getElementById("review-socratic-fb").style.display="none";
    document.getElementById("review-socratic-next").disabled=true;
    showSocraticQuestion();
  } else {
    saveProgress();
    showCurrentWord();
  }
}
