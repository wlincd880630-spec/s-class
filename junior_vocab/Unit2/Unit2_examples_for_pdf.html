  <style>
    :root {

      --border: #ddd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--zh-font);
      color: var(--text);
      background: #fff;
      font-size: 11pt;
      line-height: 1.5;
    }
    .no-print { margin-bottom: 1rem; }
    .no-print button {
      font-family: var(--zh-font);
      padding: 10px 20px;
      font-size: 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .no-print button:hover { background: #1d4ed8; }
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 12mm;
      margin: 0 auto 8mm auto;
      background: #fff;
    }
    .page-title {
      font-size: 14pt;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6mm;
      color: var(--text);
      border-bottom: 2px solid var(--border);
      padding-bottom: 4mm;
    }
    .row {
      display: flex;
      align-items: stretch;
      min-height: 22mm;
      margin-bottom: 4mm;
      border-bottom: 1px solid #eee;
      page-break-inside: avoid;
      position: relative;
    }
    .row.row-deleted { display: none !important; }
    .row-del {
      flex-shrink: 0;
      padding: 2mm 3mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-del button {
      font-family: var(--zh-font);
      width: 24px;
      height: 24px;
      padding: 0;
      font-size: 14px;
      line-height: 1;
      color: #999;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .row-del button:hover { color: #c00; background: #fee; border-color: #f88; }
    .col-en, .col-zh {
      padding: 3mm 4mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .col-en {
      flex: 1;
      min-width: 0;
      border-right: 1px solid var(--border);
      font-family: var(--en-font);
      font-size: 10.5pt;
      font-weight: 500;
      color: var(--text);
      line-height: 1.55;
    }
    .col-en .struct {
      margin-top: 2mm;
      font-size: 8pt;
      font-family: var(--zh-font);
      color: var(--muted);
      line-height: 1.5;
      overflow-wrap: break-word;
    }
    .col-zh {
      flex: 1;
      min-width: 0;
      font-size: 10.5pt;
      color: var(--text);
    }
    .col-zh .cn { margin-bottom: 2mm; }
    .col-zh .hint {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 9pt;
      color: var(--hint);
      letter-spacing: 0.4em;
      word-spacing: 0.7em;
    }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .row-del { display: none !important; }
      .row.row-deleted { display: none !important; }
      .page {
        margin: 0;
        padding: 0.8cm;
        min-height: 0;
        height: auto;
        box-shadow: none;
        page-break-after: always;
        overflow: visible;
      }
      .page:last-child { page-break-after: auto; }
      .row { page-break-inside: avoid; }
    }
  </style>
</head>

      var perPage = 9;
