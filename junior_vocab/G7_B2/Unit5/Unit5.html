/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}
function speakWord(word) {
  if (!synthesizer) { alert("语音服务未初始化"); return; }
  const w = String(word || "").trim();
  if (!w) return;
  synthesizer.speakTextAsync(w, ()=>{}, e=>console.error("TTS:", e));
}

}

/* ═══════════════════════════════════════════════
   P4 例句
═══════════════════════════════════════════════ */
function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function prevWord() {
  if (wordIndex <= 0) return;
  wordIndex--;
  saveProgress();
  startWord();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}


/* ── 跳过功能（学生自主跳过已认识的单词） ── */
let skippedWords = new Set(JSON.parse(localStorage.getItem('pep_vocab_skipped_'+STORAGE_KEY)||'[]'));
function skipWord() {
  const w = allWords[wordIndex];
  if (!w?.word) { nextWord(); return; }
  skippedWords.add(w.word);
  try { localStorage.setItem('pep_vocab_skipped_'+STORAGE_KEY, JSON.stringify([...skippedWords])); } catch(e) {}
  wordStartTime = Date.now();
  const btn = document.getElementById('p1-skip');
  if (btn) {
    btn.innerHTML = '✓ 已跳过'; btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-forward-step"></i> 跳过（已认识）'; btn.disabled = false; }, 500);
  }
  nextWord();
}

   复习流程
═══════════════════════════════════════════════ */
function setReviewDots(active) {
  ["rd1","rd2","rd3"].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el){ if(i<active-1) el.className="step-dot done"; else if(i===active-1) el.className="step-dot active"; else el.className="step-dot"; }
  });
}
function setReviewChip(word) {
  document.getElementById("review-chip-word").textContent = word||"";
}

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
  setReviewDots(1);
  showPage("p-review");
  showSocraticQuestion();
  saveProgress();
}

function showSocraticQuestion() {
  const w = reviewOrders ? reviewBatch[reviewOrders.socratic[reviewIdx]] : reviewBatch[reviewIdx];
  const q = (w.socratic_questions||[])[0];
  if (!q) { reviewStep2(); return; }
  document.getElementById("review-socratic-q").textContent = q.question||"";
  const opts = document.getElementById("review-socratic-opts"); opts.innerHTML="";
  [...reviewBatch].sort(()=>Math.random()-.5).map(x=>x.word).forEach(wo=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=wo;
    b.onclick=()=>{
      opts.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=wo.toLowerCase()===w.word.toLowerCase();
      reviewLogs.push({ type:"socratic", word:w.word, question:q.question||"", userAnswer:wo, correct:w.word, ok });
      b.classList.add(ok?"correct":"wrong");
      if(!ok) opts.querySelectorAll(".opt-btn").forEach(x=>{ if(x.textContent.toLowerCase()===w.word.toLowerCase()) x.classList.add("correct"); });
      const fb=document.getElementById("review-socratic-fb");
      fb.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb.style.display="block";
      fb.textContent=ok?"✓ 正确！"+(q.answer_hint?"  "+q.answer_hint:""):"✗ 答案是「"+w.word+"」"+(q.answer_hint?"  "+q.answer_hint:"");
      document.getElementById("review-socratic-next").disabled=false;
    };
    opts.appendChild(b);
  });
  document.getElementById("review-socratic-fb").style.display="none";
  document.getElementById("review-socratic-next").disabled=true;
}

function reviewStep2() {
  reviewStep = 2;
  document.getElementById("review-step1").style.display="none";
  document.getElementById("review-step2").style.display="block";
  setReviewDots(2);
  showPage("p-review");
  saveProgress();
  const w = reviewOrders ? reviewBatch[reviewOrders.fill[reviewIdx]] : reviewBatch[reviewIdx];
  const fb=w.fill_blank||{};
  const sents=fb.sentences||[], opts=fb.options||[], ci=fb.correct_index??0;
  const sent=(sents[0]||"").trim();
  const qDiv=document.getElementById("review-fill-q"); qDiv.innerHTML="";
  if(sent){
    const d=document.createElement("div"); d.className="fill-sent";
    d.innerHTML=sent.replace(/___/g,"<mark>___</mark>");
    qDiv.appendChild(d);
  }
  qDiv.innerHTML+='<p style="font-size:.85rem;color:var(--sub);margin-bottom:10px">'+(sent?"选出正确的词填入空白：":"选出最符合词义的选项：")+"</p>";
  const div=document.getElementById("review-fill-opts"); div.innerHTML="";
  const choices=opts.length?opts:sents;
  choices.forEach((t,i)=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=t;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=i===ci;
      reviewLogs.push({ type:"fill", word:w.word, sentence:sent, userChoice:t, correctChoice:choices[ci]||"", ok });
      b.classList.add(ok?"correct":"wrong");
      const fb2=document.getElementById("review-fill-fb");
      fb2.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb2.style.display="block";
      fb2.textContent=ok?"✓ 正确！":"✗ 正确答案："+(choices[ci]||"");
      document.getElementById("review-fill-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("review-fill-fb").style.display="none";
  document.getElementById("review-fill-next").disabled=true;
}

function goToTranslationStep() {
  reviewStep = 3;
  document.getElementById("review-step2").style.display="none";
  document.getElementById("review-step4").style.display="block";
  setReviewDots(3);
  saveProgress();
  window._dictWord = reviewOrders ? reviewBatch[reviewOrders.translation[reviewIdx]] : reviewBatch[reviewIdx];
  const exs=window._dictWord.examples||[];
  window._transSentence = exs[0]?.en||exs[Math.floor(Math.random()*exs.length)]?.en||"";
  const _ex = (window._dictWord?.examples||[]).find(e=>e.en===window._transSentence)
              || (window._dictWord?.examples||[])[0] || {};
  window._transRefCn = _ex.cn || "";
  document.getElementById("review-trans-en").textContent = window._transSentence || "（无例句）";
  document.getElementById("review-trans-result").style.display="none";
}

/* ═══════════════════════════════════════════════
   翻译朗读 + DeepSeek 评价（持续识别，手动开始/停止）
═══════════════════════════════════════════════ */
function toggleTransRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("review-trans-record");

  if (transRecording) {
    // ── 停止录音 ──
    transRecording = false;
    btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
    btn.classList.remove("recording");
    if (window._transRec) {
      window._transRec.stopContinuousRecognitionAsync(
        async () => {
          const text = (window._transFullText||"").trim();
          const resultDiv = document.getElementById("review-trans-result");
          if (!text) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--sub)">未识别到语音，请重试</div>`;
    return;
  }
          await evaluateTranslation(window._transSentence||"", text, window._transRefCn||"");
        },
        e => console.error("stop err:", e)
      );
    }
    return;
  }

  // ── 开始录音 ──
  transRecording = true;
  window._transFullText = "";
  btn.innerHTML = '<i class="fas fa-stop"></i> 点击停止录音';
  btn.classList.add("recording");
  document.getElementById("review-trans-result").style.display = "none";

  const zhCfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  zhCfg.speechRecognitionLanguage = "zh-CN";
  const rec = new SpeechSDK.SpeechRecognizer(zhCfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  window._transRec = rec;

  // 实时显示识别到的片段
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._transFullText += e.result.text;
      const resultDiv = document.getElementById("review-trans-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text2)">
        识别中：<span style="color:var(--text)">${window._transFullText}</span>
      </div>`;
    }
  };

  rec.startContinuousRecognitionAsync(
    () => {},
    e => {
      transRecording = false;
      btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
      btn.classList.remove("recording");
      console.error("start err:", e);
    }
  );
}

async function evaluateTranslation(enText, studentCn, refCn) {
  const resultDiv=document.getElementById("review-trans-result");
  resultDiv.style.display="block";
  resultDiv.innerHTML=`<div class="eval-loading"><span class="spin">⟳</span> DeepSeek 正在评价…</div>`;
  document.getElementById("review-trans-next").disabled=false;
  try {
    const prompt=`你是初中英语翻译评价专家，帮助八年级学生提升英译中能力。
英文原句：${enText}
参考中文：${refCn||"（无）"}
学生朗读的中文翻译：${studentCn}

请用JSON格式返回评价，包含这些字段：
- score: 整数0-100（语义准确度）
- correct: 翻译正确/较好的部分（简洁，1句）
- issues: 主要问题或遗漏（1-2句，没有则写"无明显问题"）
- standard: 最佳参考翻译（1句）
- tip: 针对性的学习建议（1句，结合初中生水平）`;

    const resp=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-v4-flash",
        messages:[{role:"user",content:prompt}],
        response_format:{type:"json_object"},
        temperature:0.3,max_tokens:400
      })
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    const data=await resp.json();
    const ev=JSON.parse(data.choices[0].message.content);
    const s=ev.score??0;
    reviewLogs.push({ type:"translation", word:window._dictWord?.word||"", en:enText, studentCn, score:s, correct:ev.correct||"", issues:ev.issues||"", standard:ev.standard||"" });
    const cls=s>=80?"eval-score-hi":s>=55?"eval-score-mid":"eval-score-lo";
    resultDiv.innerHTML=`
      <div class="eval-card">
        <div class="eval-score-row">
          <div class="eval-score-circle ${cls}">${s}</div>
          <div>
            <div style="font-size:.75rem;font-weight:800;color:var(--sub);letter-spacing:.05em;margin-bottom:4px">DEEPSEEK 评分</div>
            <div style="font-size:.85rem;color:var(--sub)">你说的：<span style="color:var(--text)">${studentCn}</span></div>
          </div>
        </div>
        ${ev.correct?`<div class="eval-row"><span class="eval-lbl">✓ 正确</span><span class="eval-val" style="color:var(--green)">${ev.correct}</span></div>`:""}
        ${ev.issues?`<div class="eval-row"><span class="eval-lbl">⚠ 问题</span><span class="eval-val" style="color:#fca5a5">${ev.issues}</span></div>`:""}
        <div class="eval-row"><span class="eval-lbl">📝 标准</span><span class="eval-val">${ev.standard||refCn||"—"}</span></div>
        ${ev.tip?`<div class="eval-tip">💡 ${ev.tip}</div>`:""}
      </div>`;
  } catch(e) {
    resultDiv.innerHTML=`<div class="eval-card"><p style="color:var(--sub);font-size:.88rem">评价暂不可用：${e.message}</p></div>`;
    console.error("DeepSeek eval:", e);
  }
}

}

function escapeHtml(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatDateTime(d) {
  if (!d) return "-";
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)+" "+
    ("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)+":"+("0"+x.getSeconds()).slice(-2);
}
function formatDuration(ms) {
  if (!ms||ms<0) return "0s";
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if (h>0) return h+"h "+m%60+"min "+s%60+"s";
  if (m>0) return m+"min "+s%60+"s";
  return s+"s";
}
function buildReportDetailsHtml() {

      html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(w)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(t/1000).toFixed(1)+" 秒</td></tr>";
    });
    html += "</table>";
  }
  if (reviewLogs.length > 0) {
    html += "<h3 style=\"font-size:14px;margin:16px 0 8px;color:#333;\">📋 复习阶段做题过程与结果</h3>";
    const socraticLogs = reviewLogs.filter(r=>r.type==="socratic");
    const fillLogs = reviewLogs.filter(r=>r.type==="fill");
    const transLogs = reviewLogs.filter(r=>r.type==="translation");
    if (socraticLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🧠 情景联想</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">题目</th><th style=\"border:1px solid #ddd;padding:5px;\">学生答案</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      socraticLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.question.substring(0,50)+(r.question.length>50?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userAnswer)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correct)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (fillLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">✏️ 句子填空</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">句子</th><th style=\"border:1px solid #ddd;padding:5px;\">学生选择</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      fillLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.sentence.substring(0,40)+(r.sentence.length>40?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correctChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (transLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🌏 翻译朗读 · AI评价</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">英文</th><th style=\"border:1px solid #ddd;padding:5px;\">学生翻译</th><th style=\"border:1px solid #ddd;padding:5px;\">得分</th><th style=\"border:1px solid #ddd;padding:5px;\">标准参考</th></tr>";
      transLogs.forEach(r=>{ html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.en.substring(0,35)+(r.en.length>35?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.studentCn.substring(0,25)+(r.studentCn.length>25?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+r.score+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml((r.standard||"").substring(0,30))+"</td></tr>"; });
      html += "</table>";
    }
  }
  if (!html) html = "<p style=\"color:#999;\">暂无学习数据（需完成部分单词学习或复习后发送）</p>";
  return html;
}
function sendLearningReport() {
  if (reportSent) { alert("报告已发送过"); return; }
  const hasData = Object.keys(wordTimings).length > 0 || reviewLogs.length > 0;
  if (!hasData) { alert("暂无学习数据，请先完成部分单词学习或复习后再发送报告"); return; }
  if (typeof emailjs === "undefined") { alert("邮件服务未加载，请刷新页面后重试"); return; }
  const endTime = new Date();
  const startT = sessionStartTime || endTime;
  const durationMs = endTime - startT;
  const studentName = localStorage.getItem("authing-user") || localStorage.getItem("current-user") || "未登录";
  const contentName = "人教版词汇 Unit" + currentUnit + " - " + (document.title || "词汇学习");
  const choiceLogs = reviewLogs.filter(r=>r.type==="socratic"||r.type==="fill");
  const transLogs = reviewLogs.filter(r=>r.type==="translation");
  const reviewCorrect = choiceLogs.filter(r=>r.ok).length;
  const reviewTotal = choiceLogs.length;
  const avgTransScore = transLogs.length ? Math.round(transLogs.reduce((a,x)=>a+x.score,0)/transLogs.length) : null;
  const score = reviewTotal ? reviewCorrect : (avgTransScore!==null ? avgTransScore : 0);
  const total = reviewTotal || (avgTransScore!==null ? 100 : 0);
  const accuracy = total > 0 ? Math.round((reviewTotal ? reviewCorrect/reviewTotal : avgTransScore/100) * 100) + "%" : "-";
  const templateParams = {
    student_name: studentName,
    content_name: contentName,
    page_url: location.href,
    page_url_display: contentName,
    start_time: formatDateTime(startT),
    end_time: formatDateTime(endTime),
    duration: formatDuration(durationMs),
    score: score,
    total: total,
    accuracy: accuracy,
    details_html: buildReportDetailsHtml()
  };
  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
      .then(() => { reportSent = true; alert("✅ 学习报告已发送给老师"); })
      .catch(() => { alert("❌ 报告发送失败，请检查网络后重试"); });
  } catch (e) { alert("发送失败：" + (e.message || "未知错误")); }
}
