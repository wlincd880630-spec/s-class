<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}

    /* ── 跳过按钮 ── */
    .btn-skip{background:rgba(156,163,175,.1);color:#9ca3af;border:1px dashed rgba(156,163,175,.3);font-size:.82rem;padding:7px 14px;margin-bottom:10px;width:100%;border-radius:var(--radius-sm);transition:all .18s;cursor:pointer}
    .btn-skip:hover{background:rgba(251,191,36,.1);color:#fbbf24;border-color:rgba(251,191,36,.4)}
    .skip-badge{display:inline-block;font-size:.7rem;background:rgba(156,163,175,.15);color:#9ca3af;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>
<script src="../../../scripts/site-nav.js" defer></script>
</head>

  <script>window.VOCAB_DATA={"units":[{"unit":5,"source":"D:\\2026\\初中\\人教版英语七年级下单词表\\人教版英语七年级下.pdf","words":[{"word":"right now","ipa":"/ˌraɪt ˈnaʊ/","image_prompts":["A digital clock displaying the current time with emphasis on the seconds ticking","A flashing neon sign that says 'URGENT' with an arrow pointing downwards"],"image_desc_en":"Illustrations representing the immediacy and urgency of the present moment.","image_desc_cn":"表示现在这一刻的即时性和紧迫性的插图。","meaning_cn":"立刻，马上","usage":"adv.","collocations":"do it right now, start right now, leave right now","preposition_combos":"N/A","examples":[{"en":"I need your answer right now; there is no time to wait.","cn":"我现在就需要你的答案；没有时间等待了。"},{"en":"The teacher wants us to finish this exercise right now.","cn":"老师要我们现在立刻完成这个练习。"}],"socratic_questions":[{"question":"如果有人催促你立刻开始做某事，你会用哪个词来表达“现在”？","answer_hint":"这个词强调事情必须立即发生，没有延迟。"}],"fill_blank":{"sentences":["We have to leave for the airport ___ if we want to catch our flight."],"options":["right now","later","soon","eventually"],"correct_index":0},"audio":"audio/right_now.mp3","audio_ex0":"audio/right_now_ex0.mp3","audio_ex1":"audio/right_now_ex1.mp3"},{"word":"ride","ipa":"/raɪd/","image_prompts":["A bicycle leaning against a tree in a park, sunlight filtering through leaves","A saddle on a horse's back, stirrups hanging down, ready for use"],"image_desc_en":"A bicycle and a saddle on a horse.","image_desc_cn":"一辆自行车和马背上的马鞍。","meaning_cn":"v. 骑；乘 n. 骑；乘车","usage":"v. (rode, ridden); n.","collocations":"go for a ride, ride a bike, ride a horse","preposition_combos":"ride on","examples":[{"en":"I like to ride my bike to school every day.","cn":"我喜欢每天骑自行车去学校。"},{"en":"Did you ride the new roller coaster at the amusement park?","cn":"你乘坐了游乐园里新的过山车吗？"}],"socratic_questions":[{"question":"如果你坐在自行车上，用脚蹬着踏板前进，这个动作是什么？","answer_hint":"这个词表示用某种交通工具，坐在上面并控制它。"}],"fill_blank":{"sentences":["She enjoys going for a ___ in the countryside on weekends."],"options":["ride","walk","swim","run"],"correct_index":0},"audio":"audio/ride.mp3","audio_ex0":"audio/ride_ex0.mp3","audio_ex1":"audio/ride_ex1.mp3"},{"word":"moment","ipa":"/ˈmoʊmənt/","image_prompts":["A golden pocket watch showing a specific time, gears visible","A shooting star streaking across a night sky, leaving a bright trail"],"image_desc_en":"A brief period of time.","image_desc_cn":"短暂的时间。","meaning_cn":"n. 片刻，瞬间","usage":"n. (复数 moments)","collocations":"at the moment, just a moment, any moment","preposition_combos":"in a moment","examples":[{"en":"I will be there in a moment; please wait patiently.","cn":"我马上就到；请耐心等待。"},{"en":"This is a special moment that I will always remember.","cn":"这是一个我将永远铭记的特殊时刻。"}],"socratic_questions":[{"question":"当你看到烟花绽放时，描述那种时间很短的感觉。","answer_hint":"强调时间非常短暂，转瞬即逝。"}],"fill_blank":{"sentences":["Wait a ___ , I need to find my keys before we leave."],"options":["moment","minute","hour","day"],"correct_index":0},"audio":"audio/moment.mp3","audio_ex0":"audio/moment_ex0.mp3","audio_ex1":"audio/moment_ex1.mp3"},{"word":"at the moment","ipa":"/æt ðə ˈmoʊmənt/","image_prompts":["A clock showing the current time with emphasis on the second hand","A calendar page highlighted on today's date, with a pen resting on it"],"image_desc_en":"A clock and a calendar highlighting the present time.","image_desc_cn":"时钟和日历突出显示当前时间。","meaning_cn":"此刻，现在","usage":"adverbial phrase","collocations":"available at the moment, busy at the moment","preposition_combos":"N/A","examples":[{"en":"I am busy at the moment, but I'll call you later.","cn":"我现在很忙，但我稍后会给你打电话。"},{"en":"She is not available at the moment; can I take a message?","cn":"她现在不在，需要我留言吗？"}],"socratic_questions":[{"question":"如果有人问你现在在做什么，你会用什么短语来表达“现在”这个时间点？","answer_hint":"这个短语强调的是说话的当下，正在进行的状态。"}],"fill_blank":{"sentences":["I can't talk right ___ , I'm in a meeting."],"options":["at the moment","in the past","for a while","in the future"],"correct_index":0},"audio":"audio/at_the_moment.mp3","audio_ex0":"audio/at_the_moment_ex0.mp3","audio_ex1":"audio/at_the_moment_ex1.mp3"},{"word":"work on","ipa":"/wɜːrk ɒn/","image_prompts":["A mechanic's hands repairing a vintage car engine, tools scattered around","A student hunched over a desk, intensely focused on solving a complex math problem"],"image_desc_en":"Hands repairing an engine; a student solving a problem.","image_desc_cn":"修理引擎的手；学生解决问题。","meaning_cn":"致力于，从事于；改进，修改","usage":"v. (过去式 worked on, 过去分词 worked on)","collocations":"work on a project, work on a solution, work on skills","preposition_combos":"work on + project/problem/skill","examples":[{"en":"I need to work on my English grammar for the exam.","cn":"我需要为了考试而努力提高我的英语语法。"},{"en":"The team will work on the new project next month.","cn":"团队下个月将致力于这个新项目。"}],"socratic_questions":[{"question":"为了提高你的某项技能或完成某项任务，你需要投入时间和精力做什么？","answer_hint":"这个短语表示为了达到目标而付出努力。"}],"fill_blank":{"sentences":["She needs to ___ her presentation before the meeting."],"options":["work on","look at","give up","think about"],"correct_index":0},"audio":"audio/work_on.mp3","audio_ex0":"audio/work_on_ex0.mp3","audio_ex1":"audio/work_on_ex1.mp3"},{"word":"dragon","ipa":"/ˈdræɡən/","image_prompts":["A majestic, serpentine dragon statue coiled around a stone pillar, ancient temple background","Intricate dragon kite soaring high in a clear blue sky, long flowing tail"],"image_desc_en":"A mythical creature often depicted as a large, winged reptile.","image_desc_cn":"一种神话生物，通常被描绘成大型、有翅膀的爬行动物。","meaning_cn":"龙","usage":"n. (pl. dragons)","collocations":"Chinese dragon, fire-breathing dragon, dragon boat","preposition_combos":"dragon in, dragon on","examples":[{"en":"The dragon is a symbol of power and good fortune in China.","cn":"龙在中国是力量和好运的象征。"},{"en":"Many stories feature a brave knight fighting a fierce dragon.","cn":"许多故事都描述了勇敢的骑士与凶猛的龙战斗。"}],"socratic_questions":[{"question":"在中国的文化中，什么动物象征着皇权和吉祥？","answer_hint":"这个动物通常被认为能带来好运，并且外形像蛇，但有爪子和鳞片。"}],"fill_blank":{"sentences":["The Chinese ___ is a symbol of strength and good luck."],"options":["dragon","tiger","lion","eagle"],"correct_index":0},"audio":"audio/dragon.mp3","audio_ex0":"audio/dragon_ex0.mp3","audio_ex1":"audio/dragon_ex1.mp3"},{"word":"festival","ipa":"/ˈfestɪvl/","image_prompts":["A vibrant street filled with colorful lanterns and decorations, celebrating a traditional event","A table laden with traditional food and drinks, prepared for a cultural celebration"],"image_desc_en":"Colorful decorations and traditional food associated with a celebration.","image_desc_cn":"与庆祝活动相关的彩色装饰品和传统食物。","meaning_cn":"节日","usage":"n. (festivals)","collocations":"annual festival, music festival, film festival","preposition_combos":"at a festival, during the festival","examples":[{"en":"The Spring Festival is the most important festival in China.","cn":"春节是中国最重要的节日。"},{"en":"We always have a big family dinner during the festival.","cn":"节日期间我们总会举办盛大的家庭聚餐。"}],"socratic_questions":[{"question":"过年的时候，人们通常会做什么特别的事情来庆祝？","answer_hint":"这个词指的是一个特殊的庆祝日子。"}],"fill_blank":{"sentences":["The town holds a music ___ every summer, attracting many visitors."],"options":["festival","concert","party","show"],"correct_index":0},"audio":"audio/festival.mp3","audio_ex0":"audio/festival_ex0.mp3","audio_ex1":"audio/festival_ex1.mp3"},{"word":"hold","ipa":"/hoʊld/","image_prompts":["A pair of hands gently cradling a fragile glass ball, soft light","A strong metal clamp holding two wooden planks together tightly"],"image_desc_en":"Illustrations depicting the action of holding something gently and firmly.","image_desc_cn":"展示轻轻地和牢固地握住某物的动作的插图。","meaning_cn":"握住，拿着；容纳","usage":"v. (held, held); n.","collocations":"hold a meeting, hold on tight, hold back tears","preposition_combos":"hold on to, hold up","examples":[{"en":"Please hold this book for me while I tie my shoes.","cn":"请帮我拿着这本书，我系一下鞋带。"},{"en":"This bottle can hold about 500 milliliters of water.","cn":"这个瓶子大约能装500毫升的水。"}],"socratic_questions":[{"question":"如果你需要别人帮你拿着东西，你会用哪个动词来表达？","answer_hint":"这个词表示用手或其他方式支撑或携带某物。"}],"fill_blank":{"sentences":["Can you ___ the door open for me, please?"],"options":["hold","push","close","leave"],"correct_index":0},"audio":"audio/hold.mp3","audio_ex0":"audio/hold_ex0.mp3","audio_ex1":"audio/hold_ex1.mp3"},{"word":"hold on","ipa":"/hoʊld ɒn/","image_prompts":["A hand gripping a subway pole tightly as the train brakes suddenly","A digital timer counting down with the words 'Please Wait' displayed prominently"],"image_desc_en":"A hand holding a pole; a timer showing 'Please Wait'.","image_desc_cn":"一只手抓住杆子；一个显示“请等待”的计时器。","meaning_cn":"等一下；坚持住","usage":"v. (held on, held on) 表示稍等片刻或坚持不放弃。","collocations":"hold on a minute, hold on tight","preposition_combos":"hold on to (something)","examples":[{"en":"Please hold on a second, I'll check the schedule for you.","cn":"请稍等一下，我帮你查一下时间表。"},{"en":"Hold on! We can still win the game if we try harder.","cn":"坚持住！如果我们更努力，我们仍然可以赢得比赛。"}],"socratic_questions":[{"question":"如果有人告诉你“别挂断电话”，你会怎么理解？","answer_hint":"表示让对方稍作等待，不要结束通话。"}],"fill_blank":{"sentences":["Please ___ a moment while I find the information you need."],"options":["hold on","give up","hurry up","look at"],"correct_index":0},"audio":"audio/hold_on.mp3","audio_ex0":"audio/hold_on_ex0.mp3","audio_ex1":"audio/hold_on_ex1.mp3"},{"word":"voice","ipa":"/vɔɪs/","image_prompts":["A microphone on a stand in a recording studio, sound waves emanating","A speech bubble with musical notes inside, indicating singing"],"image_desc_en":"A microphone capturing sound; a speech bubble with musical notes.","image_desc_cn":"麦克风捕捉声音；带有音符的语音气泡。","meaning_cn":"n. 声音；嗓音 v. (voiced, voiced) 发声；表达","usage":"n. 声音；嗓音；v. (voiced, voiced) 发声；表达","collocations":"in a loud voice, lose one's voice, voice an opinion","preposition_combos":"with a voice","examples":[{"en":"Her voice was soft, but it carried clearly across the room.","cn":"她的声音很轻柔，但清晰地传遍了整个房间。"},{"en":"He decided to voice his concerns about the project's deadline.","cn":"他决定表达他对项目截止日期的担忧。"}],"socratic_questions":[{"question":"如果你想在会议上分享你的想法，你会用什么来表达？","answer_hint":"这个词指的是你用来表达想法的声音。"}],"fill_blank":{"sentences":["She used her ___ to sing a beautiful song at the concert."],"options":["voice","noise","sound","music"],"correct_index":0},"audio":"audio/voice.mp3","audio_ex0":"audio/voice_ex0.mp3","audio_ex1":"audio/voice_ex1.mp3"},{"word":"race","ipa":"/reɪs/","image_prompts":["A checkered flag waving at a car racing event, motion blur","A group of colorful running shoes lined up at a starting line on a track"],"image_desc_en":"Checkered flag at a car race; running shoes at a starting line.","image_desc_cn":"赛车比赛中的格子旗；跑道起跑线上的跑步鞋。","meaning_cn":"n. 比赛；种族 v. (raced, raced) 参加比赛；竞速","usage":"n. 比赛；种族; v. (raced, raced) 参加比赛；竞速","collocations":"car race, horse race, human race","preposition_combos":"race against time, race for","examples":[{"en":"The school will hold a sports race next month, I will join.","cn":"学校下个月将举行运动比赛，我会参加。"},{"en":"Many runners raced to the finish line in the marathon event.","cn":"许多赛跑者在马拉松比赛中竞速冲向终点线。"}],"socratic_questions":[{"question":"如果你想知道谁跑得最快，你会组织什么活动？","answer_hint":"这个活动通常在操场或体育馆举行，参与者努力成为第一名。"}],"fill_blank":{"sentences":["The students will ___ against each other in the relay event."],"options":["race","play","walk","compete"],"correct_index":0},"audio":"audio/race.mp3","audio_ex0":"audio/race_ex0.mp3","audio_ex1":"audio/race_ex1.mp3"},{"word":"darling","ipa":"/ˈdɑːrlɪŋ/","image_prompts":["A heart-shaped pendant with a sparkling gemstone in the center, soft lighting","A handwritten letter tied with a silk ribbon, vintage paper and calligraphy"],"image_desc_en":"A heart pendant and a love letter.","image_desc_cn":"心形吊坠和情书。","meaning_cn":"亲爱的，心爱的人 (n.); 亲爱的 (adj.)","usage":"n. / adj.","collocations":"my darling, darling child","preposition_combos":"无","examples":[{"en":"My darling, I miss you so much when I am away.","cn":"亲爱的，我不在的时候非常想你。"},{"en":"She calls her cat 'darling' and treats it like a baby.","cn":"她叫她的猫“亲爱的”，像对待婴儿一样对待它。"}],"socratic_questions":[{"question":"当你非常喜欢或爱一个人时，你会怎么称呼他们？","answer_hint":"这个词表达了喜爱和亲昵之情。"}],"fill_blank":{"sentences":["He always calls his girlfriend '___' when they are together."],"options":["darling","stranger","friend","classmate"],"correct_index":0},"audio":"audio/darling.mp3","audio_ex0":"audio/darling_ex0.mp3","audio_ex1":"audio/darling_ex1.mp3"},{"word":"somebody","ipa":"/ˈsʌmbədi/","image_prompts":["A silhouette of a person standing in a crowd, highlighted by a spotlight","A question mark formed by a group of people, viewed from above"],"image_desc_en":"Illustrations representing an unknown or unspecified person.","image_desc_cn":"代表未知或未指明的人的插图。","meaning_cn":"某人，有人","usage":"pron.","collocations":"somebody else, somebody's","preposition_combos":"about somebody, for somebody","examples":[{"en":"Did somebody call me while I was out of the office?","cn":"我不在办公室的时候有人给我打电话吗？"},{"en":"I think somebody left their umbrella in the classroom today.","cn":"我觉得今天有人把伞落在教室里了。"}],"socratic_questions":[{"question":"如果你看到地上有一件遗失的物品，你会说这是谁的？","answer_hint":"指代一个身份不明的人。"}],"fill_blank":{"sentences":["I heard ___ knocking at the door late last night."],"options":["somebody","anybody","nobody","everybody"],"correct_index":0},"audio":"audio/somebody.mp3","audio_ex0":"audio/somebody_ex0.mp3","audio_ex1":"audio/somebody_ex1.mp3"},{"word":"could","ipa":"/kʊd/","image_prompts":["A vintage key unlocking an ornate wooden door, soft lighting","A faded photograph of a bicycle leaning against a brick wall"],"image_desc_en":"A key unlocking a door; a bicycle against a wall.","image_desc_cn":"一把钥匙解锁一扇门；一辆靠墙的自行车。","meaning_cn":"能够；可以 (情态动词 can 的过去式)","usage":"情态动词 v. (过去式 could, 过去分词 could)","collocations":"could be, could have, could do","preposition_combos":"could with","examples":[{"en":"I could play basketball after school if I finished my homework.","cn":"如果我完成了作业，放学后我就可以打篮球。"},{"en":"She said she could help me with my English project later.","cn":"她说她晚些时候可以帮我 take a message because she wasn't in the office.","cn":"我不得不记录一个留言，因为她不在办公室。"}],"socratic_questions":[{"question":"如果有人打电话找你的朋友，但你的朋友不在，你会做什么？","answer_hint":"你需要记录下重要的信息，以便你的朋友回来后知道。"}],"fill_blank":{"sentences":["Please ___ for Mr. Smith, he's in a meeting right now."],"options":["take a message","send a letter","make a call","write a note"],"correct_index":0},"audio":"audio/take_a_message.mp3","audio_ex0":"audio/take_a_message_ex0.mp3","audio_ex1":"audio/take_a_message_ex1.mp3"},{"word":"leave a message","ipa":"/liːv ə ˈmesɪdʒ/","image_prompts":["A digital voice recorder with a blinking red light, placed on a wooden desk","A sticky note with handwritten text 'Call me back!' attached to a telephone"],"image_desc_en":"A voice recorder and a sticky note on a telephone, representing leaving a message.","image_desc_cn":"录音设备和电话上的便签，代表留言。","meaning_cn":"留言","usage":"v. 说给某人让其转告","collocations":"leave a message for someone; leave someone a message","preposition_combos":"leave a message with","examples":[{"en":"Please leave a message after the beep if I am not here.","cn":"如果我不在，请在哔声后留言。"},{"en":"I will leave a message for her to call you back soon.","cn":"我会给她留言，让她尽快给你回电话。"}],"socratic_questions":[{"question":"当你打电话给朋友，但对方没有接听时，你会怎么做，以便让他知道你打过电话？","answer_hint":"你需要留下一些信息，让对方知道是谁打来的，以及为什么打来。"}],"fill_blank":{"sentences":["Could you ___ for me if she's not available?"],"options":["leave a message","send an email","write a letter","make a call"],"correct_index":0},"audio":"audio/leave_a_message.mp3","audio_ex0":"audio/leave_a_message_ex0.mp3","audio_ex1":"audio/leave_a_message_ex1.mp3"},{"word":"call back","ipa":"/kɔːl bæk/","image_prompts":["A phone ringing on a desk with a notepad beside it","An unanswered phone with a missed call notification on the screen"],"image_desc_en":"A ringing phone and a missed call notification, suggesting a return call.","image_desc_cn":"响铃的电话和未接来电通知，暗示回电。","meaning_cn":"回电话","usage":"v. 回电话","collocations":"call someone back, call back later","preposition_combos":"call back to","examples":[{"en":"I'll call you back as soon as I finish my homework.","cn":"我做完作业后会尽快给你回电话。"},{"en":"Could you please call me back when you have some free time?","cn":"你方便的时候可以给我回个电话吗？"}],"socratic_questions":[{"question":"如果你接到一个未接来电，之后你会做什么？","answer_hint":"你需要再次拨打那个电话。"}],"fill_blank":{"sentences":["She said she would ___ me ___ after the meeting."],"options":["call back","call on","call off","call at"],"correct_index":0},"audio":"audio/call_back.mp3","audio_ex0":"audio/call_back_ex0.mp3","audio_ex1":"audio/call_back_ex1.mp3"},{"word":"kick","ipa":"/kɪk/","image_prompts":["A soccer ball being kicked with force, dust rising from the ground","A pair of sneakers kicking a pile of autumn leaves, leaves scattering"],"image_desc_en":"A soccer ball being kicked and autumn leaves scattering after being kicked.","image_desc_cn":"足球被踢的瞬间，以及秋叶被踢散的场景。","meaning_cn":"踢","usage":"v. (kicked, kicked); n.","collocations":"kick a ball, kick off, kick against","preposition_combos":"kick at","examples":[{"en":"He can kick the ball very far in the football match.","cn":"在足球比赛中，他能把球踢得很远。"},{"en":"She tried to kick the door open, but it was too strong.","cn":"她试图把门踢开，但是门太结实了。"}],"socratic_questions":[{"question":"如果你想用脚使劲地碰到一个东西，你会做什么？","answer_hint":"用脚发力，使物体移动或受力。"}],"fill_blank":{"sentences":["The player tried to ___ the ball into the goal, but missed."],"options":["kick","throw","catch","hit"],"correct_index":0},"audio":"audio/kick.mp3","audio_ex0":"audio/kick_ex0.mp3","audio_ex1":"audio/kick_ex1.mp3"},{"word":"wow","ipa":"/waʊ/","image_prompts":["A burst of colorful fireworks exploding in the night sky, sparkling trails","An open gift box with a bright light shining out, surrounded by confetti"],"image_desc_en":"Fireworks exploding and a gift box shining brightly.","image_desc_cn":"烟花绽放和一个礼品盒闪耀着光芒。","meaning_cn":"（表示惊叹）哇，喔","usage":"interj. (感叹词)","collocations":"wow factor, wow effect","preposition_combos":"wow at","examples":[{"en":"Wow, your painting is so beautiful! I really like it.","cn":"哇，你的画真漂亮！我真的很喜欢。"},{"en":"Wow, this new game is amazing! I can't stop playing it.","cn":"哇，这个新游戏太棒了！我停不下来。"}],"socratic_questions":[{"question":"当你看到非常令人惊讶或印象深刻的事情时，你会发出什么声音？","answer_hint":"这个声音表达了强烈的惊喜和赞叹。"}],"fill_blank":{"sentences":["___! That magic trick was truly incredible to watch."],"options":["Wow","Hello","Goodbye","Sorry"],"correct_index":0},"audio":"audio/wow.mp3","audio_ex0":"audio/wow_ex0.mp3","audio_ex1":"audio/wow_ex1.mp3"},{"word":"online","ipa":"/ˌɒnˈlaɪn/","image_prompts":["A glowing computer screen displaying a webpage with various icons and links.","A network of interconnected nodes representing a digital connection."],"image_desc_en":"A computer screen showing a webpage and a network diagram.","image_desc_cn":"电脑屏幕显示网页和网络图。","meaning_cn":"在线的；联网的","usage":"adj. / adv.","collocations":"online shopping, online course, go online","preposition_combos":"on online platforms","examples":[{"en":"I often shop online because it saves a lot of time.","cn":"我经常在网上购物，因为它节省了很多时间。"},{"en":"She takes an online English course to improve her skills.","cn":"她参加了一个在线英语课程来提高她的技能。"}],"socratic_questions":[{"question":"如果你想在家里通过电脑学习新知识，你会怎么做？","answer_hint":"强调通过网络连接进行学习。"}],"fill_blank":{"sentences":["Many students prefer to study ___ using digital resources."],"options":["online","offline","outside","inside"],"correct_index":0},"audio":"audio/online.mp3","audio_ex0":"audio/online_ex0.mp3","audio_ex1":"audio/online_ex1.mp3"},{"word":"shuttlecock","ipa":"/ˈʃʌtəlˌkɑːk/","image_prompts":["A white shuttlecock with green feathers resting on badminton racket strings","Close-up of a damaged shuttlecock with bent feathers on a wooden badminton court"],"image_desc_en":"A shuttlecock, also known as a badminton birdie, is a high-drag projectile used in the sport of badminton.","image_desc_cn":"羽毛球，也称为毽子，是一种用于羽毛球运动的高阻力抛射物。","meaning_cn":"羽毛球","usage":"n. (复数 shuttlecocks)","collocations":"hit a shuttlecock, badminton shuttlecock","preposition_combos":"with a shuttlecock","examples":[{"en":"He hit the shuttlecock over the net during the badminton game.","cn":"在羽毛球比赛中，他将羽毛球击过网。"},{"en":"The white shuttlecock flew quickly across the school gymnasium.","cn":"白色的羽毛球快速飞过学校体育馆。"}],"socratic_questions":[{"question":"在羽毛球运动中，我们需要用球拍击打什么东西，让它在空中飞行？","answer_hint":"这种东西通常是白色的，底部是半球形，上面有羽毛。"}],"fill_blank":{"sentences":["The badminton player served the ___ high into the air."],"options":["shuttlecock","baseball","tennis","basketball"],"correct_index":0},"audio":"audio/shuttlecock.mp3","audio_ex0":"audio/shuttlecock_ex0.mp3","audio_ex1":"audio/shuttlecock_ex1.mp3"},{"word":"sight","ipa":"/saɪt/","image_prompts":["A pair of binoculars pointed towards a distant mountain range, clear blue sky","A scenic overlook with a metal railing, vast valley below filled with colorful trees"],"image_desc_en":"Binoculars viewing a mountain range; scenic overlook of a valley.","image_desc_cn":"望远镜观察山脉；山谷的风景瞭望台。","meaning_cn":"视力；景象，风景","usage":"n.","collocations":"catch sight of, at first sight, a beautiful sight","preposition_combos":"in sight, out of sight","examples":[{"en":"The mountain's peak was a wonderful sight to see.","cn":"山顶是一个值得一看的美丽景象。"},{"en":"My grandma's sight is getting worse as she gets older.","cn":"我奶奶的视力随着年龄的增长越来越差。"}],"socratic_questions":[{"question":"当你站在山顶，看到远处连绵的山脉和广阔的森林，你觉得这是什么？","answer_hint":"描述的是眼睛所能看到的壮丽景色。"}],"fill_blank":{"sentences":["The fireworks were a beautiful ___ on New Year's Eve."],"options":["sight","sound","touch","smell"],"correct_index":0},"audio":"audio/sight.mp3","audio_ex0":"audio/sight_ex0.mp3","audio_ex1":"audio/sight_ex1.mp3"},{"word":"exam","ipa":"/ɪɡˈzæm/","image_prompts":["A neatly arranged desk with a pen and a closed test booklet","A close-up of a multiple-choice question sheet with bubbles filled in"],"image_desc_en":"A test setting and a multiple-choice sheet.","image_desc_cn":"考试场景和一张选择题答题卡。","meaning_cn":"考试","usage":"n. (复数 exams); v. (过去式：examined, 过去分词：examined)","collocations":"take an exam, pass an exam, fail an exam","preposition_combos":"exam in (subject), exam on (topic)","examples":[{"en":"I have an important math exam next week at school.","cn":"我下周在学校有一个重要的数学考试。"},{"en":"Did you pass your English exam last term successfully?","cn":"你上学期顺利通过英语考试了吗？"}],"socratic_questions":[{"question":"为了评估你对所学知识的掌握程度，老师通常会组织什么活动？","answer_hint":"这个活动通常包含一系列问题，你需要给出答案。"}],"fill_blank":{"sentences":["She studied hard to prepare for the final ___."],"options":["exam","exercise","game","lesson"],"correct_index":0},"audio":"audio/exam.mp3","audio_ex0":"audio/exam_ex0.mp3","audio_ex1":"audio/exam_ex1.mp3"},{"word":"hope","ipa":"/hoʊp/","image_prompts":["A small green plant sprouting from cracked, dry earth, sunlight shining on it","An anchor resting on a sandy seabed, a faint light filtering from the surface"],"image_desc_en":"A symbol of optimism and anticipation for a positive outcome.","image_desc_cn":"对积极结果的乐观和期待的象征。","meaning_cn":"v. 希望；n. 希望","usage":"v. (hoped, hoped); n. (hopes)","collocations":"hope for, hope that, give hope, lose hope","preposition_combos":"hope for something","examples":[{"en":"I hope our team can win the basketball game tomorrow.","cn":"我希望我们的队伍明天能赢得篮球比赛。"},{"en":"There is still hope that we can solve this difficult problem.","cn":"我们仍然有希望解决这个难题。"}],"socratic_questions":[{"question":"当你遇到困难，但仍然相信事情会变好，你感觉如何？","answer_hint":"表达对未来美好结果的期待和信心。"}],"fill_blank":{"sentences":["We ___ that the weather will be sunny for our picnic."],"options":["hope","wish","imagine","think"],"correct_index":0},"audio":"audio/hope.mp3","audio_ex0":"audio/hope_ex0.mp3","audio_ex1":"audio/hope_ex1.mp3"},{"word":"forward","ipa":"/ˈfɔːrwərd/","image_prompts":["An arrow pointing ahead on a winding road, suggesting progress","A chess pawn advancing on a chessboard, strategic movement"],"image_desc_en":"An arrow pointing ahead and a chess pawn moving forward.","image_desc_cn":"一个指向前方的箭头和一个向前移动的棋子。","meaning_cn":"adv. 向前；adj. 前面的","usage":"adv.; adj.","collocations":"move forward, look forward to","preposition_combos":"forward to","examples":[{"en":"The car moved forward slowly in the heavy traffic jam.","cn":"在严重的交通堵塞中，汽车缓慢地向前移动。"},{"en":"She is looking forward to her birthday party next week.","cn":"她期待着下周的生日聚会。"}],"socratic_questions":[{"question":"如果你非常期待某件事情的发生，你会怎么表达这种期待？","answer_hint":"这个词表示期待未来的事情，并且带有积极的情感。"}],"fill_blank":{"sentences":["He leaned ___ to hear the speaker better in the noisy hall."],"options":["forward","backwards","aside","downward"],"correct_index":0},"audio":"audio/forward.mp3","audio_ex0":"audio/forward_ex0.mp3","audio_ex1":"audio/forward_ex1.mp3"},{"word":"look forward to","ipa":"/lʊk ˈfɔːrwərd tuː/","image_prompts":["A calendar with a specific date circled in red, a magnifying glass focusing on it","A gift box wrapped with a ribbon, anticipation radiating from its presence"],"image_desc_en":"Anticipation and excitement for a future event or gift.","image_desc_cn":"对未来事件或礼物的期待和兴奋。","meaning_cn":"期待，盼望","usage":"v. phr. (looking forward to, looked forward to, looked forward to) 注意 to 是介词，后接名词或动名词","collocations":"look forward to doing sth.","preposition_combos":"look forward to + noun/gerund","examples":[{"en":"I look forward to the school trip next month with my friends.","cn":"我期待下个月和朋友们一起去学校旅行。"},{"en":"She looks forward to hearing good news about her exam results.","cn":"她期待听到关于她考试成绩的好消息。"}],"socratic_questions":[{"question":"如果你知道下周有一个你非常喜欢的活动，你会是什么心情？","answer_hint":"表达对未来事件的积极期待。"}],"fill_blank":{"sentences":["We ___ ___ ___ seeing you at the party next weekend."],"options":["look forward to","are looking at","looked back on","look up to"],"correct_index":0},"audio":"audio/look_forward_to.mp3","audio_ex0":"audio/look_forward_to_ex0.mp3","audio_ex1":"audio/look_forward_to_ex1.mp3"},{"word":"skate","ipa":"/skeɪt/","image_prompts":["A pair of roller skates with colorful wheels on a smooth pavement","An ice skate blade reflecting light on a frozen pond surface"],"image_desc_en":"Images depicting roller skates and ice skates.","image_desc_cn":"描绘轮滑鞋和冰鞋的图像。","meaning_cn":"v. 溜冰；滑冰；n. 溜冰鞋；滑冰鞋","usage":"v. (skated, skated); n. (pl. skates)","collocations":"ice skate, roller skate, skate park","preposition_combos":"skate on","examples":[{"en":"I like to skate in the park every weekend with friends.","cn":"我喜欢每个周末和朋友们在公园里滑冰。"},{"en":"She learned to skate when she was only five years old.","cn":"她五岁的时候就学会了滑冰。"}],"socratic_questions":[{"question":"想象一下，穿着特殊的鞋子在冰面或平地上快速移动，这项运动叫什么？","answer_hint":"这种运动需要穿特制的鞋子，可以在冰上或陆地上进行。"}],"fill_blank":{"sentences":["They often go to the ice rink to ___ during the winter holidays."],"options":["skate","ski","swim","run"],"correct_index":0},"audio":"audio/skate.mp3","audio_ex0":"audio/skate_ex0.mp3","audio_ex1":"audio/skate_ex1.mp3"},{"word":"happen","ipa":"/ˈhæpən/","image_prompts":["A series of dominoes falling in a chain reaction, viewed from above","A calendar page with a circled date, representing an event taking place"],"image_desc_en":"Dominoes falling; A circled date on a calendar.","image_desc_cn":"多米诺骨牌倒塌；日历上被圈出的日期。","meaning_cn":"发生","usage":"v. (happened, happened)","collocations":"happen to do sth; happen again; happen quickly","preposition_combos":"happen in; happen at; happen to","examples":[{"en":"Did anything interesting happen at school during the day today?","cn":"今天白天在学校里发生了什么有趣的事情吗？"},{"en":"I hope nothing bad will happen when I am traveling alone.","cn":"我希望我独自旅行时不会发生任何不好的事情。"}],"socratic_questions":[{"question":"如果一件意料之外的事情发生了，我们可以用哪个词来描述？","answer_hint":"这个词表示某事发生或出现，通常是偶然的。"}],"fill_blank":{"sentences":["What will ___ if we don't finish our homework on time?"],"options":["happen","happening","happened","happens"],"correct_index":0},"audio":"audio/happen.mp3","audio_ex0":"audio/happen_ex0.mp3","audio_ex1":"audio/happen_ex1.mp3"},{"word":"zone","ipa":"/zoʊn/","image_prompts":["A map divided into different colored areas, each labeled with a specific purpose","A construction area with yellow tape and warning signs, indicating a restricted area"],"image_desc_en":"Different areas or regions designated for specific purposes or restrictions.","image_desc_cn":"为特定目的或限制而划分的不同区域或地带。","meaning_cn":"区域，地带","usage":"n. / v. (过去式 zoned, 过去分词 zoned)","collocations":"safe zone, war zone, time zone","preposition_combos":"in the zone","examples":[{"en":"This area is a quiet zone, so please keep silent here.","cn":"这个区域是安静区，所以请在这里保持安静。"},{"en":"The city is divided into different zones for different purposes.","cn":"这个城市被划分为不同的区域以用于不同的目的。"}],"socratic_questions":[{"question":"如果一个地方被特别规划为某种用途，比如工业生产或住宅居住，你会怎么称呼这个地方？","answer_hint":"这个词指的是为了特定目的而划分的区域。"}],"fill_blank":{"sentences":["The park has a special play ___ for young children."],"options":["zone","area","place","spot"],"correct_index":0},"audio":"audio/zone.mp3","audio_ex0":"audio/zone_ex0.mp3","audio_ex1":"audio/zone_ex1.mp3"},{"word":"time zone","ipa":"/ˈtaɪm zoʊn/","image_prompts":["A world map divided into colored sections, each representing a different time zone","Several clocks on a wall, each showing a different time, labeled with city names"],"image_desc_en":"A visual representation of different time zones across the globe.","image_desc_cn":"世界各地不同时区的视觉呈现。","meaning_cn":"时区","usage":"n. (复数 time zones)","collocations":"different time zones, local time zone, cross a time zone","preposition_combos":"in a time zone, across time zones","examples":[{"en":"Traveling to New York means entering a different time zone.","cn":"去纽约旅行意味着进入不同的时区。"},{"en":"Our online meeting is difficult because of the time zone difference.","cn":"由于时区差异，我们的在线会议很困难。"}],"socratic_questions":[{"question":"如果北京是中午 12 点，纽约是晚上 11 点，这是什么原因造成的？","answer_hint":"地球是圆的，不同地区看到太阳的时间不一样。"}],"fill_blank":{"sentences":["When you fly from Beijing to London, you cross several ___."],"options":["time zones","countries","cities","rivers"],"correct_index":0},"audio":"audio/time_zone.mp3","audio_ex0":"audio/time_zone_ex0.mp3","audio_ex1":"audio/time_zone_ex1.mp3"},{"word":"around the world","ipa":"/əˈraʊnd ðə wɜːrld/","image_prompts":["A vintage globe with a highlighted route circling the entire sphere","A collage of famous landmarks from different continents, arranged in a circular pattern"],"image_desc_en":"Representing global travel and international scope.","image_desc_cn":"代表全球旅行和国际范围。","meaning_cn":"在世界各地，遍及全球","usage":"短语，表示在地球的各个地方。","collocations":"travel around the world, famous around the world, known around the world","preposition_combos":"around the world in","examples":[{"en":"She wants to travel around the world after graduation.","cn":"她毕业后想环游世界。"},{"en":"This famous song is known around the world by many people.","cn":"这首著名的歌曲被世界各地的人们所熟知。"}],"socratic_questions":[{"question":"如果你想去地球上所有的大洲和国家，你会怎么描述你的旅行？","answer_hint":"这个短语表示访问地球上的每一个地方。"}],"fill_blank":{"sentences":["The news about the pandemic spread very quickly ___."],"options":["around the world","in the city","at school","on the street"],"correct_index":0},"audio":"audio/around_the_world.mp3","audio_ex0":"audio/around_the_world_ex0.mp3","audio_ex1":"audio/around_the_world_ex1.mp3"},{"word":"rush","ipa":"/rʌʃ/","image_prompts":["A blurred image of a train speeding through a station platform","A crowd of people moving quickly through an airport terminal, motion blur"],"image_desc_en":"Depicts the sense of hurried movement and urgency.","image_desc_cn":"描绘了匆忙的移动和紧迫感。","meaning_cn":"v. 冲，奔；匆忙做 n. 匆忙，仓促","usage":"v. (rushed, rushed); n.","collocations":"rush hour, rush to conclusions, in a rush","preposition_combos":"rush into, rush out of, rush to","examples":[{"en":"We must not rush to a decision about the school trip.","cn":"我们不能匆忙决定关于学校旅行的事情。"},{"en":"There was a big rush to get the exam papers marked.","cn":"有一阵匆忙去批改考试试卷。"}],"socratic_questions":[{"question":"如果你时间不够，需要快速完成某事，你会怎么做？","answer_hint":"这个词表示快速行动或完成某事。"}],"fill_blank":{"sentences":["Don't ___ to answer the questions before reading them carefully."],"options":["rush","wait","stop","begin"],"correct_index":0},"audio":"audio/rush.mp3","audio_ex0":"audio/rush_ex0.mp3","audio_ex1":"audio/rush_ex1.mp3"},{"word":"in a hurry","ipa":"/ɪn ə ˈhʌri/","image_prompts":["A blurred image of a clock with hands spinning rapidly, indicating time pressure","A steaming cup of coffee next to a briefcase on a table, suggesting a rushed morning"],"image_desc_en":"Images depicting a sense of urgency and time pressure.","image_desc_cn":"描绘紧迫感和时间压力的图像。","meaning_cn":"匆忙，赶时间","usage":"短语。表示某人正在匆忙地做某事，没有足够的时间。","collocations":"be in a hurry, always in a hurry, often in a hurry","preposition_combos":"in a hurry to do something, in a hurry for something","examples":[{"en":"She was in a hurry to catch the school bus this morning.","cn":"今天早上她急着赶校车。"},{"en":"I am always in a hurry when I have a test at school.","cn":"当我在学校有考试时，我总是很匆忙。"}],"socratic_questions":[{"question":"如果你看到某人快速地跑向车站，并且不停地看手表，他可能是什么状态？","answer_hint":"这个人可能需要快速到达某地，时间很紧。"}],"fill_blank":{"sentences":["He was ___ to finish his homework before dinner time."],"options":["in a hurry","on time","at ease","at leisure"],"correct_index":0},"audio":"audio/in_a_hurry.mp3","audio_ex0":"audio/in_a_hurry_ex0.mp3","audio_ex1":"audio/in_a_hurry_ex1.mp3"},{"word":"shine","ipa":"/ʃaɪn/","image_prompts":["A polished silver trophy reflecting light, creating a bright glare","Sunlight streaming through a stained glass window, casting colorful patterns"],"image_desc_en":"Illustrations depicting reflected light and bright sunlight.","image_desc_cn":"描绘反射光和明亮阳光的插图。","meaning_cn":"v. 发光；照耀 n. 光泽","usage":"v. (shone/shined, shone/shined); n.","collocations":"shine brightly, sunshine, shoe shine","preposition_combos":"shine on","examples":[{"en":"The sun will shine brightly tomorrow, so we can go hiking.","cn":"明天太阳会灿烂地照耀，所以我们可以去徒步旅行。"},{"en":"Her shoes have a beautiful shine after she cleaned them well.","cn":"她的鞋子在仔细擦拭后，焕发出美丽的光泽。"}],"socratic_questions":[{"question":"描述一下太阳光照耀在湖面上，波光粼粼的景象。","answer_hint":"描述的是光线很亮，并且在发光。"}],"fill_blank":{"sentences":["The stars ___ brightly in the night sky during the summer vacation."],"options":["shine","shining","shines","shined"],"correct_index":0},"audio":"audio/shine.mp3","audio_ex0":"audio/shine_ex0.mp3","audio_ex1":"audio/shine_ex1.mp3"},{"word":"brightly","ipa":"/ˈbraɪtli/","image_prompts":["A lighthouse shining brightly across a dark, stormy sea, strong beam","A room illuminated brightly by sunlight streaming through a large window, dust motes visible"],"image_desc_en":"A lighthouse shines across a stormy sea; a sunlit room.","image_desc_cn":"灯塔照亮风暴海面；阳光照亮的房间。","meaning_cn":"明亮地；鲜艳地","usage":"adv. (比较级 more brightly, 最高级 most brightly)","collocations":"shine brightly, burn brightly, lit brightly","preposition_combos":"brightly lit with","examples":[{"en":"The stars shone brightly in the clear night sky above us.","cn":"星星在晴朗的夜空中明亮地闪耀。"},{"en":"The room was brightly decorated with colorful balloons for the party.","cn":"房间里装饰着色彩鲜艳的气球，为聚会增添了光彩。"}],"socratic_questions":[{"question":"如果你希望房间的光线更强，你会怎么形容灯光的状态？","answer_hint":"描述光线很强，很耀眼的状态。"}],"fill_blank":{"sentences":["The sun was shining so ___ that I needed sunglasses."],"options":["brightly","bright","brighter","brightness"],"correct_index":0},"audio":"audio/brightly.mp3","audio_ex0":"audio/brightly_ex0.mp3","audio_ex1":"audio/brightly_ex1.mp3"},{"word":"colourful","ipa":"/ˈkʌlərfʊl/","image_prompts":["A vibrant rainbow stretching across a clear blue sky after a rain shower","A collection of assorted candies in various bright colours displayed in glass jars"],"image_desc_en":"Images depicting vibrant colours, such as a rainbow and colourful candies.","image_desc_cn":"描绘鲜艳色彩的图像，例如彩虹和色彩缤纷的糖果。","meaning_cn":"色彩鲜艳的，多姿多彩的","usage":"adj. (副词 colourfully)","collocations":"colourful clothes, colourful flowers, colourful history","preposition_combos":"in colourful patterns","examples":[{"en":"The garden was full of colourful flowers in the spring.","cn":"春天，花园里开满了色彩鲜艳的花朵。"},{"en":"She wore a colourful scarf that matched her bright personality.","cn":"她戴了一条色彩鲜艳的围巾，与她开朗的性格很相配。"}],"socratic_questions":[{"question":"如果你想描述一个东西有很多不同的鲜艳颜色，你会用什么词？","answer_hint":"这个词形容某物拥有多种鲜艳的颜色。"}],"fill_blank":{"sentences":["The parade was very ___ with flags and costumes of many hues."],"options":["colourful","colorless","dark","plain"],"correct_index":0},"audio":"audio/colourful.mp3","audio_ex0":"audio/colourful_ex0.mp3","audio_ex1":"audio/colourful_ex1.mp3"},{"word":"slowly","ipa":"/ˈsloʊli/","image_prompts":["A snail crawling across a green leaf, dew drops visible","A melting ice cube dripping water into a glass, time-lapse effect"],"image_desc_en":"Illustrations depicting the concept of slowness.","image_desc_cn":"描绘缓慢概念的插图。","meaning_cn":"缓慢地，慢吞吞地","usage":"adv.","collocations":"move slowly, speak slowly, grow slowly","preposition_combos":"slowly but surely","examples":[{"en":"The old clock ticked slowly, marking the passage of time.","cn":"老钟缓慢地滴答作响，标志着时间的流逝。"},{"en":"He walked slowly down the street, enjoying the peaceful evening.","cn":"他缓慢地走在街上，享受着宁静的夜晚。"}],"socratic_questions":[{"question":"如果你看到一个蜗牛在爬行，你会用什么词来形容它的速度？","answer_hint":"描述速度很慢的状态。"}],"fill_blank":{"sentences":["The turtle moved ___ across the sandy beach towards the ocean."],"options":["slowly","quickly","suddenly","happily"],"correct_index":0},"audio":"audio/slowly.mp3","audio_ex0":"audio/slowly_ex0.mp3","audio_ex1":"audio/slowly_ex1.mp3"},{"word":"such","ipa":"/sʌtʃ/","image_prompts":["A collection of various colorful candies arranged in a pleasing pattern","A display of diverse books with different covers and sizes on a bookshelf"],"image_desc_en":"Various items showing diversity and variety.","image_desc_cn":"展示多样性和差异性的各种物品。","meaning_cn":"这样的，如此的","usage":"adj. / adv.","collocations":"such as, such a, such kind of","preposition_combos":"such as","examples":[{"en":"It was such a hot day that we went swimming.","cn":"天气太热了，我们去游泳了。"},{"en":"She has such beautiful eyes that everyone notices her.","cn":"她有如此美丽的眼睛，每个人都会注意到她。"}],"socratic_questions":[{"question":"如果你想表达程度很深，或者描述某种类型，你会用哪个词？","answer_hint":"这个词可以用来强调程度，或者引出例子。"}],"fill_blank":{"sentences":["It was ___ a great movie that I watched it twice."],"options":["such","so","very","too"],"correct_index":0},"audio":"audio/such.mp3","audio_ex0":"audio/such_ex0.mp3","audio_ex1":"audio/such_ex1.mp3"},{"word":"such as","ipa":"/sʌtʃ æz/","image_prompts":["A display of various fruits, including apples, bananas, and oranges","A shelf filled with different types of books, including novels, biographies, and textbooks"],"image_desc_en":"Examples of different items displayed together.","image_desc_cn":"展示放在一起的不同物品的例子。","meaning_cn":"例如，比如","usage":"短语，用来列举例子","collocations":"include such as, things such as","preposition_combos":"N/A","examples":[{"en":"We enjoy outdoor activities such as hiking and camping in summer.","cn":"我们喜欢户外活动，比如夏天徒步旅行和露营。"},{"en":"Many countries, such as China and France, have rich histories.","cn":"许多国家，比如中国和法国，都有着丰富的历史。"}],"socratic_questions":[{"question":"当你想要给出几个例子来说明你的观点时，你会用哪个短语来引出这些例子？","answer_hint":"这个短语用来引入一些例子，帮助读者更好地理解。"}],"fill_blank":{"sentences":["I like fruits ___ ___ apples and bananas."],"options":["such as","like to","as for","so that"],"correct_index":0},"audio":"audio/such_as.mp3","audio_ex0":"audio/such_as_ex0.mp3","audio_ex1":"audio/such_as_ex1.mp3"},{"word":"painting","ipa":"/ˈpeɪntɪŋ/","image_prompts":["A colorful landscape painting hanging on a white wall in a gallery","Various paintbrushes and tubes of paint arranged around a half-finished canvas"],"image_desc_en":"A landscape painting and art supplies.","image_desc_cn":"一幅风景画和绘画用品。","meaning_cn":"绘画；画作","usage":"n. (复数 paintings); v. (paint 的现在分词)","collocations":"oil painting, watercolor painting, abstract painting","preposition_combos":"painting of, painting on","examples":[{"en":"She enjoys painting landscapes in her free time after school.","cn":"她放学后喜欢在空闲时间画风景画。"},{"en":"The museum has a famous painting that everyone wants to see.","cn":"博物馆里有一幅著名的画作，每个人都想看。"}],"socratic_questions":[{"question":"如果你用颜料和刷子在画布上创作艺术作品，你正在做什么？","answer_hint":"这个词指的是创作艺术作品的行为，也指创作完成的作品。"}],"fill_blank":{"sentences":["He is good at art, especially ___ with bright colors."],"options":["painting","singing","dancing","writing"],"correct_index":0},"audio":"audio/painting.mp3","audio_ex0":"audio/painting_ex0.mp3","audio_ex1":"audio/painting_ex1.mp3"},{"word":"market","ipa":"/ˈmɑːrkɪt/","image_prompts":["A bustling outdoor market with colorful stalls selling fruits and vegetables","A digital display showing stock market trends with upward pointing arrows"],"image_desc_en":"A vibrant outdoor market and a stock market display.","image_desc_cn":"一个充满活力的户外市场和一个股票市场显示屏。","meaning_cn":"市场；集市","usage":"n. (markets)；v. (marketed, marketed)","collocations":"farmers' market, stock market, job market","preposition_combos":"at the market, in the market","examples":[{"en":"We went to the market to buy fresh vegetables and fruits.","cn":"我们去市场买了新鲜的蔬菜和水果。"},{"en":"The company plans to market its new product online next month.","cn":"这家公司计划下个月在线上销售他们的新产品。"}],"socratic_questions":[{"question":"如果你想买很多新鲜的食物，你会去哪里？","answer_hint":"这个地方通常有很多摊位，人们在那里买卖东西。"}],"fill_blank":{"sentences":["The farmers sell their produce at the local ___ every Saturday."],"options":["market","shop","store","mall"],"correct_index":0},"audio":"audio/market.mp3","audio_ex0":"audio/market_ex0.mp3","audio_ex1":"audio/market_ex1.mp3"},{"word":"side","ipa":"/saɪd/","image_prompts":["A soccer ball rolling along the side of a green field, blurred motion","The side view of a modern, glass-walled building reflecting the sky"],"image_desc_en":"Illustrations depicting the side of a soccer field and a building.","image_desc_cn":"描绘足球场边线和建筑物侧面的插图。","meaning_cn":"n. 边，侧面","usage":"n. (pl. sides)","collocations":"on the side, side effect, take sides","preposition_combos":"on the side of","examples":[{"en":"He stood on the side of the road, waiting for a bus.","cn":"他站在路边，等公共汽车。"},{"en":"Which side of the argument do you agree with most?","cn":"你最同意争论的哪一方？"}],"socratic_questions":[{"question":"一场辩论赛中，你会支持哪一方的观点？","answer_hint":"需要选择一个立场或阵营。"}],"fill_blank":{"sentences":["She parked her car on the ___ of the street."],"options":["side","center","top","bottom"],"correct_index":0},"audio":"audio/side.mp3","audio_ex0":"audio/side_ex0.mp3","audio_ex1":"audio/side_ex1.mp3"},{"word":"side by side","ipa":"/ˌsaɪd baɪ ˈsaɪd/","image_prompts":["Two identical potted plants placed next to each other on a windowsill, bathed in sunlight","Two bicycles parked closely together against a brick wall, casting long shadows"],"image_desc_en":"Two objects positioned very close to each other.","image_desc_cn":"两个物体非常靠近彼此放置。","meaning_cn":"肩并肩；并排地","usage":"adv. phr.","collocations":"walk side by side, sit side by side, stand side by side","preposition_combos":"with","examples":[{"en":"They walked side by side along the beach, enjoying the sunset.","cn":"他们肩并肩地沿着沙滩走，欣赏着日落。"},{"en":"The two houses stand side by side on a quiet street.","cn":"这两栋房子并排坐落于一条安静的街道上。"}],"socratic_questions":[{"question":"如果两个人非常靠近地一起行走，你会用什么短语来描述他们的状态？","answer_hint":"表示他们之间的位置关系非常接近，几乎是挨着的。"}],"fill_blank":{"sentences":"The students sat ___ during the exam, which was not allowed.","options":["side by side","far away","independently","quietly"],"correct_index":0},"audio":"audio/side_by_side.mp3","audio_ex0":"audio/side_by_side_ex0.mp3","audio_ex1":"audio/side_by_side_ex1.mp3"},{"word":"subway","ipa":"/ˈsʌˌbweɪ/","image_prompts":["A brightly lit subway station platform with yellow tactile paving","A subway train speeding through a dark tunnel, motion blur"],"image_desc_en":"Images depicting a subway station platform and a subway train in a tunnel.","image_desc_cn":"描绘地铁站台和隧道中地铁列车的图像。","meaning_cn":"地铁","usage":"n. (pl. subways)","collocations":"take the subway, subway station, subway line","preposition_combos":"on the subway, in the subway, to the subway","examples":[{"en":"I take the subway to school because it's very fast.","cn":"我乘坐地铁去学校，因为它非常快。"},{"en":"The subway station is near my home, so it's convenient.","cn":"地铁站离我家很近，所以很方便。"}],"socratic_questions":[{"question":"如果你想避开地面拥堵的交通，选择哪种交通工具在地下穿梭？","answer_hint":"这种交通工具在地下运行，可以快速到达目的地。"}],"fill_blank":{"sentences":["The fastest way to get downtown is by taking the ___."],"options":["subway","bus","taxi","bike"],"correct_index":0},"audio":"audio/subway.mp3","audio_ex0":"audio/subway_ex0.mp3","audio_ex1":"audio/subway_ex1.mp3"},{"word":"bright","ipa":"/braɪt/","image_prompts":["A brightly lit room with sunlight streaming through a large window","A collection of colorful crayons arranged in a neat row on a white table"],"image_desc_en":"A room filled with sunlight and colorful crayons.","image_desc_cn":"充满阳光的房间和彩色蜡笔。","meaning_cn":"明亮的；聪明的","usage":"adj. brighter, brightest; adv. brightly","collocations":"bright future, bright idea, bright color","preposition_combos":"bright in","examples":[{"en":"The sun is very bright today, so wear sunglasses.","cn":"今天阳光很明媚，所以戴上太阳镜。"},{"en":"She is a bright student and always gets good grades.","cn":"她是个聪明的学生，总是取得好成绩。"}],"socratic_questions":[{"question":"当你看到阳光灿烂，光线很强的时候，你会用什么词来形容？","answer_hint":"描述光线强度高的状态。"}],"fill_blank":{"sentences":["The stars are very ___ in the night sky tonight."],"options":["bright","dark","cloudy","dim"],"correct_index":0},"audio":"audio/bright.mp3","audio_ex0":"audio/bright_ex0.mp3","audio_ex1":"audio/bright_ex1.mp3"},{"word":"drop","ipa":"/drɒp/","image_prompts":["A single raindrop falling into a puddle, creating ripples","A glass bottle falling from a table, shattering on the floor"],"image_desc_en":"A raindrop falling; a bottle shattering.","image_desc_cn":"雨滴落下；瓶子破碎。","meaning_cn":"v. 落下；掉落 n. 滴；滴落","usage":"v. (dropped, dropped); n.","collocations":"drop a hint, drop by, drop out","preposition_combos":"drop from, drop into, drop on","examples":[{"en":"Please don't drop litter in the park; keep it clean.","cn":"请不要在公园里乱扔垃圾；保持清洁。"},{"en":"The price of the phone may drop after the new model comes.","cn":"新款手机上市后，这款手机的价格可能会下降。"}],"socratic_questions":[{"question":"如果你不小心没拿稳，东西会怎么样？","answer_hint":"描述物体失去支撑，向下运动的状态。"}],"fill_blank":{"sentences":["I accidentally ___ my phone into the toilet yesterday."],"options":["dropped","lifted","carried","threw"],"correct_index":0},"audio":"audio/drop.mp3","audio_ex0":"audio/drop_ex0.mp3","audio_ex1":"audio/drop_ex1.mp3"},{"word":"drop off","ipa":"/drɒp ɔːf/","image_prompts":["A car stopping in front of a school gate, a backpack on the sidewalk","A package being placed on a doorstep, a delivery notification on a phone screen"],"image_desc_en":"A car dropping someone off at school; a package being dropped off at a house.","image_desc_cn":"一辆车在学校门口停车，有人下车；一个包裹被放在家门口。","meaning_cn":"放下，卸下；（让…）下车","usage":"v. (过去式 dropped off, 过去分词 dropped off)","collocations":"drop off a package, drop off at school, drop off to sleep","preposition_combos":"drop off at, drop off in","examples":[{"en":"Could you drop me off near the library after school today?","cn":"今天放学后你能让我在图书馆附近下车吗？"},{"en":"I need to drop off this book at my friend's house.","cn":"我需要把这本书放在我朋友家。"}],"socratic_questions":[{"question":"你开车送朋友回家，到达目的地后你会做什么？","answer_hint":"朋友从车里出来，结束行程。"}],"fill_blank":{"sentences":["My dad will ___ me ___ at the bus station tomorrow morning."],"options":["drop off","pick up","look after","take away"],"correct_index":0},"audio":"audio/drop_off.mp3","audio_ex0":"audio/drop_off_ex0.mp3","audio_ex1":"audio/drop_off_ex1.mp3"},{"word":"passenger","ipa":"/ˈpæsɪndʒər/","image_prompts":["An airplane seat with a travel pillow and a blanket neatly arranged","A train station platform with suitcases and bags waiting to be loaded"],"image_desc_en":"Imagery related to travel and transportation, suggesting people on a journey.","image_desc_cn":"与旅行和交通相关的图像，暗示旅途中的人们。","meaning_cn":"乘客","usage":"n.","collocations":"bus passenger, train passenger, plane passenger","preposition_combos":"passenger on, passenger in","examples":[{"en":"Each passenger is allowed to carry one bag onto the plane.","cn":"每位乘客允许携带一个包上飞机。"},{"en":"The bus driver helped an elderly passenger with her luggage.","cn":"公交车司机帮助一位年长的乘客搬运行李。"}],"socratic_questions":[{"question":"如果你乘坐公共汽车、火车或飞机，你会怎么称呼其他和你一起旅行的人？","answer_hint":"这些人不是司机或乘务员，而是和你一样使用交通工具的人。"}],"fill_blank":{"sentences":["The train was full of ____ heading home for the holidays."],"options":["passengers","drivers","conductors","vehicles"],"correct_index":0},"audio":"audio/passenger.mp3","audio_ex0":"audio/passenger_ex0.mp3","audio_ex1":"audio/passenger_ex1.mp3"},{"word":"central","ipa":"/ˈsentrəl/","image_prompts":["A map highlighting the downtown area of a city with a bright circle","A compass pointing directly to the center of a target"],"image_desc_en":"Illustrations representing the core or middle point.","image_desc_cn":"代表核心或中间点的插图。","meaning_cn":"中心的；主要的","usage":"adj.","collocations":"central location, central idea, central government","preposition_combos":"central to","examples":[{"en":"The park is central to our community, a place for everyone.","cn":"这个公园是我们社区的中心，是每个人的场所。"},{"en":"The central library is a great resource for all students here.","cn":"中央图书馆是所有学生的宝贵资源。"}],"socratic_questions":[{"question":"如果一个地点位于城市的最重要和最方便到达的地方，你会怎么形容它的位置？","answer_hint":"这个词形容位置在中间，方便到达。"}],"fill_blank":{"sentences":["The ___ heating system keeps the entire building warm in winter."],"options":["central","sudden","private","public"],"correct_index":0},"audio":"audio/central.mp3","audio_ex0":"audio/central_ex0.mp3","audio_ex1":"audio/central_ex1.mp3"},{"word":"explain","ipa":"/ɪkˈspleɪn/","image_prompts":["A diagram with arrows and labels clarifying a complex process","A teacher's hand pointing to a detailed equation on a whiteboard"],"image_desc_en":"A diagram explaining a process; a teacher explaining an equation.","image_desc_cn":"解释过程的图表；老师解释方程式。","meaning_cn":"解释，说明","usage":"v. (explained, explained  驾驶；驱动力","usage":"v. (过去式 drove, 过去分词 driven); n.","collocations":"drive a car, drive someone crazy, drive force","preposition_combos":"drive to (a place), drive at (a speed)","examples":[{"en":"I can drive my bike to school if the weather is good.","cn":"如果天气好的话，我可以骑自行车去学校。"},{"en":"My parents often drive me to the library on weekends.","cn":"我的父母经常在周末开车送我去图书馆。"}],"socratic_questions":[{"question":"如果你需要操作方向盘和踏板来控制车辆，你正在做什么？","answer_hint":"这个词表示控制车辆移动。"}],"fill_blank":{"sentences":["She will ___ her new car to the beach this summer vacation."],"options":["drive","drives","driving","driven"],"correct_index":0},"audio":"audio/drive.mp3","audio_ex0":"audio/drive_ex0.mp3","audio_ex1":"audio/drive_ex1.mp3"},{"word":"rush hour","ipa":"/ˈrʌʃ aʊər/","image_prompts":["A congested highway with cars bumper to bumper, brake lights glowing red","A crowded train platform with people waiting to board, blurred motion"],"image_desc_en":"A scene depicting heavy traffic and crowded public transport.","image_desc_cn":"描绘交通拥堵和拥挤公共交通的场景。","meaning_cn":"高峰时段，交通拥堵时段","usage":"n. (不可数名词)","collocations":"during rush hour, avoid rush hour, heavy rush hour traffic","preposition_combos":"in rush hour","examples":[{"en":"The traffic is always bad in rush hour on weekdays.","cn":"工作日高峰时段的交通总是很糟糕。"},{"en":"I try to avoid driving during the morning rush hour.","cn":"我尽量避免在早高峰时段开车。"}],"socratic_questions":[{"question":"在一天中的某些时间，道路上的车辆特别多，公共交通工具也很拥挤，这是什么时间？","answer_hint":"描述的是一天中交通最繁忙的时段。"}],"fill_blank":{"sentences":["The train is very crowded during the morning ___ ___."],"options":["rush hour","happy time","free time","quiet hour"],"correct_index":0},"audio":"audio/rush_hour.mp3","audio_ex0":"audio/rush_hour_ex0.mp3","audio_ex1":"audio/rush_hour_ex1.mp3"},{"word":"Dragon Boat Festival","ipa":"/ˈdræɡən boʊt ˈfestɪvl/","image_prompts":["A long, narrow boat decorated with dragon heads racing on a river, paddles moving in sync","Sticky rice dumplings wrapped in bamboo leaves, tied with colorful string, displayed on a wooden table"],"image_desc_en":"Dragon boat race and zongzi.","image_desc_cn":"赛龙舟和粽子。","meaning_cn":"端午节","usage":"n. (复数 Dragon Boat Festivals)","collocations":"celebrate the Dragon Boat Festival, Dragon Boat Festival holiday","preposition_combos":"during the Dragon Boat Festival, for the Dragon Boat Festival","examples":[{"en":"We always eat zongzi during the Dragon Boat Festival.","cn":"端午节期间我们总是吃粽子。"},{"en":"Many people watch dragon boat races at the Dragon Boat Festival.","cn":"很多人在端午节观看赛龙舟。"}],"socratic_questions":[{"question":"哪个节日有吃粽子、赛龙舟的习俗？","answer_hint":"这个节日的名字里包含一种神话生物和一种水上交通工具。"}],"fill_blank":{"sentences":["People in China celebrate the ___ with dragon boat races and zongzi."],"options":["Dragon Boat Festival","Mid-Autumn Festival","Spring Festival","Christmas"],"correct_index":0},"audio":"audio/Dragon_Boat_Festival.mp3","audio_ex0":"audio/Dragon_Boat_Festival_ex0.mp3","audio_ex1":"audio/Dragon_Boat_Festival_ex1.mp3"},{"word":"Nairobi","ipa":"/naɪˈroʊbi/","image_prompts":["A vibrant cityscape with modern buildings and lush green parks under a clear sky","A map highlighting the location of a major city in East Africa, surrounded by savanna"],"image_desc_en":"A bustling city in East Africa known for its wildlife and urban environment.","image_desc_cn":"东非一座繁华的城市，以野生动物和城市环境而闻名。","meaning_cn":"内罗毕（肯尼亚首都）","usage":"n. ","collocations":"visit Nairobi, Nairobi National Park, Nairobi city center","preposition_combos":"in Nairobi, to Nairobi, from Nairobi","examples":[{"en":"We plan to visit Nairobi during our trip to Kenya.","cn":"我们计划在肯尼亚旅行期间访问内罗毕。"},{"en":"Nairobi is a major economic hub in East Africa.","cn":"内罗毕是东非主要的经济中心。"}],"socratic_questions":[{"question":"如果我想去东非旅行，并且想参观一个既有城市风貌又有野生动物的地方，我可能会去哪个城市？","answer_hint":"这个城市是肯尼亚的首都，并且附近有一个著名的国家公园。"}],"fill_blank":{"sentences":["My uncle lives in ___, the capital of Kenya."],"options":["Nairobi","Cairo","Tokyo","London"],"correct_index":0},"audio":"audio/Nairobi.mp3","audio_ex0":"aud async function selectUnit(n) {
  currentUnit = n; wordIndex = 0;
  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");

async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {
  unitData = VOCAB_DATA ? (VOCAB_DATA.units||[]).find(u=>(u.unit||u)===n) : null;
  if (!unitData?.words?.length) { alert("该单元无单词数据"); throw new Error("no data"); }
  allWords = unitData.words.filter(w=>w.word&&!w.error);
  saveProgress();
}

/* ═══════════════════════════════════════════════
   学习流程：startWord / showCurrentWord
═══════════════════════════════════════════════ */
function startWord() {
  if (wordIndex >= allWords.length) { alert("🎉 本单元已全部完成！"); showPage("unit-select"); return; }
  const w = allWords[wordIndex];
  if (!w?.word) { wordIndex++; startWord(); return; }
  if (wordIndex > 0 && wordIndex % PER_REVIEW === 0) {
    reviewBatch = allWords.slice(wordIndex - PER_REVIEW, wordIndex).filter(w => !skippedWords.has(w.word));
    if (reviewBatch.length === 0) { showCurrentWord(); return; }
    reviewIdx = 0;
    startReview();
    return;
  }
  showCurrentWord();
}
function showCurrentWord() {
  updateProgress();
  wordStartTime = Date.now();
  const w = allWords[wordIndex];
  document.getElementById("p1-word").textContent = w.word;
  document.getElementById("p1-ipa").textContent  = w.ipa || "";

   P1 发音
═══════════════════════════════════════════════ */
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  if (w.audio) { new Audio(mediaUrl(w.audio)).play().catch(()=>{}); return; }
  synthesizer?.speakTextAsync(w.word, ()=>{}, e=>console.error(e));
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
  rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}
