  <script>window.VOCAB_DATA={"units":[{"unit":8,"source":"D:\\2026\\初中\\人教版英语七年级下单词表\\人教版英语七年级下.pdf","words":[{"word":"quickly","ipa":"/ˈkwɪkli/","image_prompts":["A cheetah running across the savanna, dust cloud behind it","Stopwatch with the hand moving rapidly, blurred background"],"image_desc_en":"A cheetah running fast and a stopwatch showing rapid movement.","image_desc_cn":"猎豹快速奔跑和秒表显示快速移动。","meaning_cn":"迅速地，快速地","usage":"adv.","collocations":"quickly learn, quickly finish, very quickly","preposition_combos":"quickly after, quickly before","examples":[{"en":"She quickly finished her homework and went out to play.","cn":"她迅速完成了作业，然后出去玩了。"},{"en":"The bus moved quickly through the city streets this morning.","cn":"今天早上公共汽车在城市街道上行驶得很快。"}],"socratic_questions":[{"question":"如果时间很紧，你会怎么做才能按时完成任务？","answer_hint":"需要用一个副词来描述完成任务的速度。"}],"fill_blank":{"sentences":["He ate his lunch very ___ because he was late for class."],"options":["quickly","slowly","quietly","carefully"],"correct_index":0},"audio":"audio/quickly.mp3","audio_ex0":"audio/quickly_ex0.mp3","audio_ex1":"audio/quickly_ex1.mp3"},{"word":"smile","ipa":"/smaɪl/","image_prompts":["A close-up of a sunflower with a bright yellow face, petals radiating outwards","A crescent moon in a dark blue night sky, stars twinkling around it"],"image_desc_en":"A happy expression conveyed through a sunflower and a crescent moon.","image_desc_cn":"通过向日葵和新月表达的快乐表情。","meaning_cn":"微笑","usage":"n. / v. (过去式 smiled, 过去分词 smiled)","collocations":"bright smile, warm smile, give a smile, force a smile","preposition_combos":"smile at","examples":[{"en":"She gave a warm smile when she saw her friend.","cn":"当她看到她的朋友时，她露出了温暖的微笑。"},{"en":"It's polite to smile at people you meet.","cn":"对你遇到的人微笑是有礼貌的。"}],"socratic_questions":[{"question":"当你感到快乐或友好时，你会做什么表情？","answer_hint":"这个表情通常会让你嘴角上扬。"}],"fill_blank":{"sentences":["He gave a shy ___ when she complimented his new haircut."],"options":["smile","laugh","cry","shout"],"correct_index":0},"audio":"audio/smile.mp3","audio_ex0":"audio/smile_ex0.mp3","audio_ex1":"audio/smile_ex1.mp3"},{"word":"all over","ipa":"/ˌɔːl ˈoʊvər/","image_prompts":["Confetti scattered across a polished dance floor after a celebration","A map of the world with highlighted areas indicating widespread distribution"],"image_desc_en":"Confetti scattered on a dance floor; a world map showing distribution.","image_desc_cn":"舞池地面上散落的五彩纸屑；一张显示分布范围的世界地图。","meaning_cn":"遍及；到处","usage":"短语 adv.","collocations":"all over the world, all over again","preposition_combos":"all over with","examples":[{"en":"The news about the concert spread all over the school quickly.","cn":"关于演唱会的消息迅速传遍了整个学校。"},{"en":"I searched all over my room, but I couldn't find my keys.","cn":"我把房间翻了个遍，但是没找到我的钥匙。"}],"socratic_questions":[{"question":"如果你想表达某个消息或者事物传播到了每个角落，你会用什么短语？","answer_hint":"这个短语表示“遍及”、“到处”的意思，强调范围的广泛性。"}],"fill_blank":{"sentences":["The rain poured ___ the city, making driving difficult."],"options":["all over","over","above","under"],"correct_index":0},"audio":"audio/all_over.mp3","audio_ex0":"audio/all_over_ex0.mp3","audio_ex1":"audio/all_over_ex1.mp3"},{"word":"ugly","ipa":"/ˈʌɡli/","image_prompts":["A dilapidated, abandoned building with broken windows and peeling paint","A wilted, brown rose with torn petals lying on a cracked sidewalk"],"image_desc_en":"Illustrations representing something unpleasant or unattractive in appearance.","image_desc_cn":"表示外表令人不快或没有吸引力的插图。","meaning_cn":"adj. 丑陋的，难看的","usage":"adj. (uglier, ugliest)","collocations":"ugly building, ugly truth, ugly weather","preposition_combos":"ugly to","examples":[{"en":"That old building is really ugly, I don't like it.","cn":"那栋旧建筑真丑，我不喜欢它。"},{"en":"The weather today is ugly, so we stay at home.","cn":"今天天气很糟糕，所以我们待在家里。"}],"socratic_questions":[{"question":"如果你看到一个让你感到不舒服或者不喜欢的建筑，你会用什么词来形容它的外貌？","answer_hint":"这个词形容外表不美观，让人感觉不舒服。"}],"fill_blank":{"sentences":["The painting was so ___ that nobody wanted to buy it."],"options":["ugly","beautiful","colorful","expensive"],"correct_index":0},"audio":"audio/ugly.mp3","audio_ex0":"audio/ugly_ex0.mp3","audio_ex1":"audio/ugly_ex1.mp3"},{"word":"duckling","ipa":"/ˈdʌklɪŋ/","image_prompts":["A group of small, fluffy yellow ducklings swimming in a pond, ripples on water","A single yellow duckling standing on green grass near a pond's edge, soft focus"],"image_desc_en":"Images of a small, young duck.","image_desc_cn":"小鸭子的图片。","meaning_cn":"小鸭","usage":"名词 n. 小鸭","collocations":"baby duckling, yellow duckling, swim with ducklings","preposition_combos":"duckling in water, duckling on grass","examples":[{"en":"The mother duck swam with her five little ducklings in the lake.","cn":"母鸭带着她的五只小鸭在湖里游泳。"},{"en":"A small yellow duckling followed its mother closely across the yard.","cn":"一只黄色的小鸭子紧紧地跟着它的母亲穿过院子。"}],"socratic_questions":[{"question":"如果你看到一只小鸟，它在水里游，而且妈妈也是水禽，它是什么？","answer_hint":"这种鸟是鸭子的宝宝，体型很小。"}],"fill_blank":{"sentences":["The little ___ followed its mother into the pond for a swim."],"options":["duckling","kitten","puppy","lamb"],"correct_index":0},"audio":"audio/duckling.mp3","audio_ex0":"audio/duckling_ex0.mp3","audio_ex1":"audio/duckling_ex1.mp3"},{"word":"real","ipa":"/riːəl/","image_prompts":["A photograph of a genuine diamond ring on a velvet cushion","A close-up of a freshly printed hundred dollar bill with security features visible"],"image_desc_en":"A genuine diamond ring and a real hundred dollar bill.","image_desc_cn":"一枚真正的钻戒和一张真的百元美钞。","meaning_cn":"真实的，真正的","usage":"adj. really adv.","collocations":"real life, real world, real problem","preposition_combos":"real in","examples":[{"en":"This is a real problem that we need to solve quickly.","cn":"这是一个真正的问题，我们需要尽快解决。"},{"en":"Is this story based on a real event or just fiction?","cn":"这个故事是基于真实事件还是仅仅是虚构的？"}],"socratic_questions":[{"question":"你如何区分一件艺术品的复制品和原作？","answer_hint":"原作具有独特性和真实性，而复制品是模仿的。"}],"fill_blank":{"sentences":["Is this a ___ diamond, or is it a fake one?"],"options":["real","fake","false","untrue"],"correct_index":0},"audio":"audio/real.mp3","audio_ex0":"audio/real_ex0.mp3","audio_ex1":"audio/real_ex1.mp3"},{"word":"laugh at","ipa":"/læf æt/","image_prompts":["A cartoon image of a group of hyenas with exaggerated smiles, surrounding a small, overturned tricycle.","A spotlight shining on a single banana peel lying on a stage, empty theater seats in the background."],"image_desc_en":"Hyenas laughing at a tricycle; a banana peel on stage.","image_desc_cn":"鬣狗嘲笑三轮车；舞台上的香蕉皮。","meaning_cn":"嘲笑，取笑","usage":"v. to make fun of someone or something","collocations":"laugh at someone's mistake, laugh at a joke","preposition_combos":"","examples":[{"en":"It's not nice to laugh at others when they make mistakes.","cn":"嘲笑别人犯错是不好的行为。"},{"en":"The whole class started to laugh at his funny accent.","cn":"全班开始嘲笑他滑稽的口音。"}],"socratic_questions":[{"question":"如果有人摔倒了，你觉得指着他大声喧哗合适吗？","answer_hint":"这个行为表达的是一种不尊重和取乐的态度。"}],"fill_blank":{"sentences":["Don't ___ people just because they are different from you."],"options":["laugh at","look at","shout at","smile at"],"correct_index":0},"audio":"audio/laugh_at.mp3","audio_ex0":"audio/laugh_at_ex0.mp3","audio_ex1":"audio/laugh_at_ex1.mp3"},{"word":"go away","ipa":"/ɡoʊ əˈweɪ/","image_prompts":["A sign with the words 'Go Away' in bold red letters on a wooden door","Footprints disappearing into the sand on a beach, waves washing them away"],"image_desc_en":"Images showing the concept of leaving or disappearing.","image_desc_cn":"展示离开或消失概念的图片。","meaning_cn":"离开；走开","usage":"v. (过去式 went away, 过去分词 gone away)","collocations":"tell someone to go away, go away for the weekend","preposition_combos":"go away from","examples":[{"en":"I told him to go away, but he wouldn't listen.","cn":"我让他走开，但他不听。"},{"en":"We will go away for a week during the summer holiday.","cn":"我们将在暑假期间离开一周。"}],"socratic_questions":[{"question":"如果你不想被打扰，你会对别人说什么？","answer_hint":"表达让他人离开的请求。"}],"fill_blank":{"sentences":["Please ___ if you don't want to help me with this task."],"options":["go away","come here","stay still","look out"],"correct_index":0},"audio":"audio/go_away.mp3","audio_ex0":"audio/go_away_ex0.mp3","audio_ex1":"audio/go_away_ex1.mp3"},{"word":"search","ipa":"/sɜːrtʃ/","image_prompts":["A magnifying glass over a map, highlighting a specific location","A computer screen displaying a search engine results page with various links"],"image_desc_en":"Illustrations depicting the act of searching, either physically or digitally.","image_desc_cn":"描绘搜索行为的插图，无论是物理搜索还是数字搜索。","meaning_cn":"v. 搜索，搜寻；n. 搜索，搜寻","usage":"v. (searched, searched); n.","collocations":"search for, search through, in search of","preposition_combos":"search for something, search through a place","examples":[{"en":"I will search online for information about famous scientists.","cn":"我会在网上搜索关于著名科学家的信息。"},{"en":"The police will search the building for any evidence now.","cn":"警察现在将搜查这栋大楼寻找任何证据。"}],"socratic_questions":[{"question":"如果你想找到丢失的钥匙，你会做什么？","answer_hint":"需要仔细地查看各个地方，试图找到它。"}],"fill_blank":{"sentences":["They will ___ the forest for the missing hiker tomorrow."],"options":["search","find","look","see"],"correct_index":0},"audio":"audio/search.mp3","audio_ex0":"audio/search_ex0.mp3","audio_ex1":"audio/search_ex1.mp3"},{"word":"search for","ipa":"/sɜːrtʃ fɔːr/","image_prompts":["A magnifying glass hovering over a map, highlighting a specific location","A digital search bar on a computer screen with a blinking cursor"],"image_desc_en":"Magnifying glass over a map; search bar on a screen.","image_desc_cn":"地图上的放大镜；屏幕上的搜索栏。","meaning_cn":"寻找，搜索","usage":"v. 寻找，搜索","collocations":"search for clues, search for information, search for a solution","preposition_combos":"search for sth in/on/at...","examples":[{"en":"We should search for more information about the history project.","cn":"我们应该搜索更多关于历史项目的信息。"},{"en":"Many students search for a good way to improve their English.","cn":"许多学生都在寻找提高英语的好方法。"}],"socratic_questions":[{"question":"如果你丢失了重要的东西，你会做什么？","answer_hint":"这个词表示努力去找到某物。"}],"fill_blank":{"sentences":["The police continue to ___ the missing person in the forest."],"options":["search for","look at","wait for","care about"],"correct_index":0},"audio":"audio/search_for.mp3","audio_ex0":"audio/search_for_ex0.mp3","audio_ex1":"audio/search_for_ex1.mp3"},{"word":"hen","ipa":"/hen/","image_prompts":["A brown hen standing in a farmyard, surrounded by scattered grains","A hen sitting on a nest of eggs in a straw-filled coop"],"image_desc_en":"Image of a hen in a farmyard and a hen on a nest.","image_desc_cn":"农家院里的母鸡和鸡窝里的母鸡的图片。","meaning_cn":"母鸡","usage":"n.","collocations":"mother hen, farm hen, laying hen","preposition_combos":"the hen in the coop, the hen on the farm","examples":[{"en":"The hen laid an egg in the nest this morning.","cn":"今天早上母鸡在窝里下了一个蛋。"},{"en":"The farmer keeps many hens for their eggs and meat.","cn":"农民饲养许多母鸡来获取鸡蛋和肉。"}],"socratic_questions":[{"question":"农场里，什么动物会咯咯叫并下蛋？","answer_hint":"这种动物是鸟类，通常在农场里饲养，以获取鸡蛋。"}],"fill_blank":{"sentences":["The ___ clucked loudly in the barnyard, looking for food."],"options":["hen","dog","cat","cow"],"correct_index":0},"audio":"audio/hen.mp3","audio_ex0":"audio/hen_ex0.mp3","audio_ex1":"audio/hen_ex1.mp3"},{"word":"hopefully","ipa":"/ˈhoʊpfəli/","image_prompts":["A person looking up at a clear, sunny sky with a slight smile.","A small plant growing out of dry soil, reaching towards sunlight."],"image_desc_en":"Expressing hope or optimism about a future event.","image_desc_cn":"表达对未来事件的希望或乐观。","meaning_cn":"充满希望地；但愿","usage":"adv.","collocations":"hopefully succeed, hopefully arrive, hopefully improve","preposition_combos":"N/A","examples":[{"en":"Hopefully, the weather will be nice for our school trip tomorrow.","cn":"但愿明天我们学校旅行的天气会很好。"},{"en":"Hopefully, I will pass the exam if I study hard enough.","cn":"但愿我足够努力学习就能通过考试。"}],"socratic_questions":[{"question":"你对即将到来的假期有什么期待？用一个词表达你乐观的心情。","answer_hint":"这个词表示你相信好的事情会发生。"}],"fill_blank":{"sentences":["___, our team will win the basketball game this afternoon."],"options":["Hopefully","Sadly","Angrily","Quickly"],"correct_index":0},"audio":"audio/hopefully.mp3","audio_ex0":"audio/hopefully_ex0.mp3","audio_ex1":"audio/hopefully_ex1.mp3"},{"word":"purr","ipa":"/pɜːr/","image_prompts":["A close-up of a sleeping cat with a soft, vibrating throat","Sound waves radiating from a cat's chest, visualized as gentle ripples"],"image_desc_en":"Illustrations depicting the sound and physical sensation of a cat purring.","image_desc_cn":"描绘猫咪发出咕噜声的声音和身体感觉的插图。","meaning_cn":"（猫）发出咕噜声","usage":"v. (过去式 purred, 过去分词 purred)","collocations":"soft purr, loud purr","preposition_combos":"purr with contentment","examples":[{"en":"The kitten will purr if you stroke its soft fur gently.","cn":"如果你轻轻抚摸小猫柔软的毛，它会发出咕噜声。"},{"en":"I could hear my cat purr as it slept on my bed.","cn":"我能听到我的猫在我的床上睡觉时发出的咕噜声。"}],"socratic_questions":[{"question":"当你抚摸一只放松的猫时，它会发出什么声音？","answer_hint":"这个声音通常表示猫很舒服和快乐。"}],"fill_blank":{"sentences":["The cat began to ___ loudly when I scratched behind its ears."],"options":["purr","bark","meow","growl"],"correct_index":0},"audio":"audio/purr.mp3","audio_ex0":"audio/purr_ex0.mp3","audio_ex1":"audio/purr_ex1.mp3"},{"word":"lay","ipa":"/leɪ/","image_prompts":["A hen sitting on a nest of eggs in a straw-filled coop","A blueprint spread out on a drafting table with pencils and rulers"],"image_desc_en":"A hen laying eggs and a blueprint being laid out.","image_desc_cn":"一只母鸡正在下蛋，以及一张蓝图正在被铺开。","meaning_cn":"v. 放置；产卵","usage":"v. (过去式 laid, 过去分词 laid)","collocations":"lay the table, lay eggs, lay the foundation","preposition_combos":"lay on, lay down, lay out","examples":[{"en":"Please lay your books on the desk before the exam starts.","cn":"考试开始前，请把你的书放在桌子上。"},{"en":"Hens lay eggs every morning if they are well fed.","cn":"如果喂养得好，母鸡每天早上都会下蛋。"}],"socratic_questions":[{"question":"如果你想把书放到桌子上，你会做什么动作？或者，农场里的鸡会做什么？","answer_hint":"这个词表示把东西放到某个地方的动作，或者鸟类产卵的行为。"}],"fill_blank":{"sentences":["She carefully ___ the baby down in the crib before leaving the room."],"options":["laid","lied","lain","laying"],"correct_index":0},"audio":"audio/lay.mp3","audio_ex0":"audio/lay_ex0.mp3","audio_ex1":"audio/lay_ex1.mp3"},{"word":"swan","ipa":"/swɒn/","image_prompts":["A white swan gracefully gliding on a calm lake, reflection visible","A close-up of a swan's elegant neck forming a question mark shape"],"image_desc_en":"Images depicting a swan on a lake and a swan's neck forming a question mark.","image_desc_cn":"图片描绘了湖上的天鹅和天鹅颈部形成问号的形状。","meaning_cn":"天鹅","usage":"n. (复数 swans)","collocations":"black swan, white swan, swan lake","preposition_combos":"of swans, on a swan","examples":[{"en":"A beautiful swan swam gracefully across the clear lake today.","cn":"今天，一只美丽的天鹅优雅地游过清澈的湖面。"},{"en":"The park is famous for its swans and other water birds.","cn":"这个公园以它的天鹅和其他水鸟而闻名。"}],"socratic_questions":[{"question":"如果你看到一种脖子很长，全身雪白的鸟在湖里游动，它是什么？","answer_hint":"这种鸟通常被认为是优雅和美丽的象征，经常出现在童话故事里。"}],"fill_blank":{"sentences":["The ballet '___ Lake' is a very famous performance."],"options":["Swan","Duck","Goose","Eagle"],"correct_index":0},"audio":"audio/swan.mp3","audio_ex0":"audio/swan_ex0.mp3","audio_ex1":"audio/swan_ex1.mp3"},{"word":"feather","ipa":"/ˈfeðər/","image_prompts":["A single white feather floating gently in the air, sunlight shining through it","Close-up of a collection of colorful feathers of different sizes and shapes"],"image_desc_en":"A feather is a light, fluffy structure that covers a bird's body.","image_desc_cn":"羽毛是一种轻盈蓬松的结构，覆盖在鸟类的身体上。","meaning_cn":"羽毛","usage":"n. (复数 feathers)","collocations":"light as a feather, a bird of a feather","preposition_combos":"with a feather","examples":[{"en":"The bird dropped a colorful feather as it flew away quickly.","cn":"鸟儿快速飞走时掉落了一根彩色的羽毛。"},{"en":"Her new dress was decorated with a delicate white feather pattern.","cn":"她的新裙子装饰着精致的白色羽毛图案。"}],"socratic_questions":[{"question":"如果你想形容一个东西非常轻，你会用什么自然物体来比喻？","answer_hint":"这种东西通常从鸟身上掉落，质地非常轻盈。"}],"fill_blank":{"sentences":["The pillow was so soft, it felt like sleeping on a giant ___."],"options":["feather","stone","brick","metal"],"correct_index":0},"audio":"audio/feather.mp3","audio_ex0":"audio/feather_ex0.mp3","audio_ex1":"audio/feather_ex1.mp3"},{"word":"to sb","ipa":"/tuː ˈsʌmbɒdi/","image_prompts":["A gift box wrapped with a ribbon, a small card attached with 'Thank You' written on it","A hand pointing towards a silhouette of a person, spotlight shining on the silhouette"],"image_desc_en":"A gift given to someone; pointing towards an individual.","image_desc_cn":"给予某人的礼物；指向一个个体。","meaning_cn":"给某人","usage":"介词短语。表示给予、告知或提及的对象。","collocations":"give sth to sb, explain sth to sb, talk to sb","preposition_combos":"","examples":[{"en":"I need to send this letter to my best friend.","cn":"我需要把这封信寄给我的最好的朋友。"},{"en":"Please explain the rules of the game to the new players.","cn":"请向新队员解释游戏规则。"}],"socratic_questions":[{"question":"如果你想把一个秘密告诉你的朋友，你会怎么说？","answer_hint":"你需要一个介词来连接动词和接受秘密的人。"}],"fill_blank":{"sentences":"Did you give the book ___ your brother?","options":["to","with","for","at"],"correct_index":0},"audio":"audio/to_sb.mp3","audio_ex0":"audio/to_sb_ex0.mp3","audio_ex1":"audio/to_sb_ex1.mp3"},{"word":"size","ipa":"/saɪz/","image_prompts":["A measuring tape showing different lengths, indicating dimensions","Various boxes stacked, each a different dimension, illustrating scale"],"image_desc_en":"Illustrations of dimensions and scale using measuring tape and boxes.","image_desc_cn":"用卷尺和不同尺寸的盒子说明尺寸和规模。","meaning_cn":"尺寸，大小","usage":"n. 尺寸，大小; v. (sized, sized) 测量尺寸，按尺寸排列","collocations":"size of, in size, average size","preposition_combos":"of size","examples":[{"en":"What size shoes do you wear for sports activities?","cn":"你运动时穿多大码的鞋？"},{"en":"The size of the classroom is perfect for thirty students.","cn":"这间教室的大小对于三十个学生来说很合适。"}],"socratic_questions":[{"question":"描述一下篮球和乒乓球的区别时，除了重量，你还会想到什么？","answer_hint":"需要考虑它们占据空间的大小，也就是一个关键的物理属性。"}],"fill_blank":{"sentences":["The ___ of the new library is much larger than the old one."],"options":["size","color","shape","age"],"correct_index":0},"audio":"audio/size.mp3","audio_ex0":"audio/size_ex0.mp3","audio_ex1":"audio/size_ex1.mp3"},{"word":"believe","ipa":"/bɪˈliːv/","image_prompts":["A brain with glowing gears turning inside, representing strong conviction","A hand reaching out to touch a bright star in a dark sky, symbolizing faith"],"image_desc_en":"A brain with gears and a hand reaching for a star, symbolizing faith.","image_desc_cn":"大脑中的齿轮和伸向星星的手，象征着信念。","meaning_cn":"相信，认为","usage":"v. (过去式 believed, 过去分词 believed); n. belief","collocations":"believe in; hard to believe; make believe","preposition_combos":"believe in","examples":[{"en":"I believe that honesty is the best policy in life.","cn":"我相信诚实是生活中最好的处世之道。"},{"en":"Do you believe it will rain tomorrow based on the forecast?","cn":"你相信根据天气预报明天会下雨吗？"}],"socratic_questions":[{"question":"当你听到一个故事，你觉得它是真的还是假的？你会用哪个词来表达你的判断？","answer_hint":"这个词表示你对某件事的真实性有信心。"}],"fill_blank":{"sentences":["I ___ that we can solve this problem together as a team."],"options":["believe","doubt","imagine","forget"],"correct_index":0},"audio":"audio/believe.mp3","audio_ex0":"audio/believe_ex0.mp3","audio_ex1":"audio/believe_ex1.mp3"},{"word":"only if","ipa":"/ˈoʊnli ɪf/","image_prompts":["A single key unlocking a treasure chest filled with gold coins","A signpost with a single, brightly lit path leading forward, the other paths are dark"],"image_desc_en":"A key unlocking treasure; a single lit path.","image_desc_cn":"一把钥匙解锁宝藏；一条被照亮的道路。","meaning_cn":"只有，只有在…的情况下","usage":"连词短语。表示唯一的条件。","collocations":"only if + clause","preposition_combos":null,"examples":[{"en":"I can go to the party only if I finish my homework.","cn":"只有我完成作业，我才能去参加聚会。"},{"en":"She will succeed only if she works very hard every day.","cn":"只有她每天努力工作，她才会成功。"}],"socratic_questions":[{"question":"什么情况下你才能得到你想要的奖励？你需要满足什么条件？","answer_hint":"强调得到奖励的唯一条件。"}],"fill_blank":{"sentences":["You can borrow my book ___ you promise to return it soon."],"options":["only if","even if","as if","if only"],"correct_index":0},"audio":"audio/only_if.mp3","audio_ex0":"audio/only_if_ex0.mp3","audio_ex1":"audio/only_if_ex1.mp3"},{"word":"fisherman","ipa":"/ˈfɪʃərmən/","image_prompts":["A lone fishing boat on a calm lake at sunrise, fishing nets visible","A collection of fishing rods and tackle boxes arranged neatly on a wooden dock"],"image_desc_en":"Images depicting fishing equipment and a boat on a lake.","image_desc_cn":"描绘渔具和湖上小船的图像。","meaning_cn":"渔夫，渔民","usage":"n. (复数 fishermen)","collocations":"local fisherman, experienced fisherman","preposition_combos":"fisherman on, fisherman in","examples":[{"en":"The fisherman told us stories about his life at sea.","cn":"渔夫给我们讲了他海上生活的故事。"},{"en":"A local fisherman caught a large fish near the river bank.","cn":"一位当地渔民在河岸附近捕到了一条大鱼。"}],"socratic_questions":[{"question":"在海边或者河边，以捕鱼为生的人，我们称他们为什么？","answer_hint":"这个职业的人专门捕捉水里的生物，以此为生。"}],"fill_blank":{"sentences":["The old ___ spent his days casting nets into the deep sea."],"options":["fisherman","teacher","driver","farmer"],"correct_index":0},"audio":"audio/fisherman.mp3","audio_ex0":"audio/fisherman_ex0.mp3","audio_ex1":"audio/fisherman_ex1.mp3"},{"word":"fishermen","ipa":"/ˈfɪʃərmən/","image_prompts":["A group of fishing boats on a calm sea at sunrise, nets visible","Several fishing rods cast into a lake from a wooden dock, tackle boxes nearby"],"image_desc_en":"Images depict fishing boats and rods, representing the activity of fishermen.","image_desc_cn":"图片描绘了渔船和鱼竿，代表了渔民的活动。","meaning_cn":"渔民（复数）","usage":"fisherman n. (复数 fishermen)","collocations":"local fishermen, experienced fishermen, group of fishermen","preposition_combos":"fishermen on, fishermen in, fishermen near","examples":[{"en":"The fishermen returned to the harbor with a large catch today.","cn":"今天渔民们带着大量的渔获回到了港口。"},{"en":"Local fishermen depend on the sea for their livelihood and income.","cn":"当地渔民依靠大海来维持生计和收入。"}],"socratic_questions":[{"question":"谁是那些经常在海上或湖上捕鱼的人？","answer_hint":"这些人以捕鱼为生或爱好。"}],"fill_blank":{"sentences":["The ___ set out early to catch fish before the storm arrived."],"options":["fishermen","farmers","teachers","drivers"],"correct_index":0},"audio":"audio/fishermen.mp3","audio_ex0":"audio/fishermen_ex0.mp3","audio_ex1":"audio/fishermen_ex1.mp3"},{"word":"fishing","ipa":"/ˈfɪʃɪŋ/","image_prompts":["A calm lake with a fishing rod propped up on the shore, early morning light","A fishing net filled with various types of fish, glistening scales"],"image_desc_en":"Images depicting the activity of catching fish with a rod and net.","image_desc_cn":"描绘用鱼竿和渔网捕鱼的活动图像。","meaning_cn":"钓鱼；捕鱼","usage":"n. 钓鱼；捕鱼；adj. 钓鱼的","collocations":"go fishing, fishing rod, fishing trip","preposition_combos":"fishing in (the river), fishing for (trout)","examples":[{"en":"My grandpa enjoys fishing in the river every weekend.","cn":"我的爷爷喜欢每个周末在河里钓鱼。"},{"en":"They are planning a fishing trip to the lake next month.","cn":"他们计划下个月去湖边钓鱼旅行。"}],"socratic_questions":[{"question":"如果你想在河边放松身心，并且尝试捕捉水中的生物，你会做什么？","answer_hint":"这项活动通常需要鱼竿和鱼饵，目的是捕捉鱼类。"}],"fill_blank":{"sentences":["He spends most of his free time ___ by the lake."],"options":["fishing","to fish","fished","fish"],"correct_index":0},"audio":"audio/fishing.mp3","audio_ex0":"audio/fishing_ex0.mp3","audio_ex1":"audio/fishing_ex1.mp3"},{"word":"come out","ipa":"/kʌm aʊt/","image_prompts":["A butterfly emerging from its chrysalis, wings unfolding","Sunlight breaking through dark storm clouds after a rain shower"],"image_desc_en":"A butterfly emerging from its chrysalis and sunlight breaking through clouds.","image_desc_cn":"蝴蝶从蛹中羽化而出，阳光穿透云层。","meaning_cn":"出现；显现；出版","usage":"短语动词。表示从隐藏或不为人知的状态变为可见或公开。","collocations":"come out of, come out with","preposition_combos":"come out + of (from), come out + with","examples":[{"en":"The sun will come out soon after the heavy rain stops.","cn":"大雨停止后，太阳很快就会出来。"},{"en":"Her new book will come out next month, so exciting!","cn":"她的新书下个月就要出版了，真令人兴奋！"}],"socratic_questions":[{"question":"如果乌云散去，我们通常会看到什么？","answer_hint":"描述的是从隐藏状态变为可见。"}],"fill_blank":{"sentences":["The truth will ___ eventually, no matter how hard you try to hide it."],"options":["come out","go away","turn up","break down"],"correct_index":0},"audio":"audio/come_out.mp3","audio_ex0":"audio/come_out_ex0.mp3","audio_ex1":"audio/come_out_ex1.mp3"},{"word":"genie","ipa":"/ˈdʒiːni/","image_prompts":["A shimmering, translucent blue smoke forming the shape of a powerful being, ancient lamp nearby","An ornate golden lamp with swirling patterns, a wisp of magical smoke escaping from its spout"],"image_desc_en":"A magical being or a lamp from which a magical being emerges.","image_desc_cn":"一个魔法生物，或是一个魔法生物从中出现的灯。","meaning_cn":"（神话中的）精灵，神怪","usage":"n. (复数 genies 或 genii)","collocations":"magic genie, grant wishes, genie in a bottle","preposition_combos":"genie from","examples":[{"en":"The story tells of a genie who grants three wishes.","cn":"这个故事讲述了一个能实现三个愿望的精灵。"},{"en":"He felt like a genie trapped inside a small bottle.","cn":"他感觉自己像一个被困在小瓶子里的精灵。"}],"socratic_questions":[{"question":"如果你找到一个旧灯，擦拭后出现一个能满足你愿望的生物，那是什么？","answer_hint":"这个生物通常被描述为具有魔法力量，并居住在灯里。"}],"fill_blank":{"sentences":["The old lamp contained a powerful ___ who could grant wishes."],"options":["genie","giant","wizard","dragon"],"correct_index":0},"audio":"audio/genie.mp3","audio_ex0":"audio/genie_ex0.mp3","audio_ex1":"audio/genie_ex1.mp3"},{"word":"die","ipa":"/daɪ/","image_prompts":["A withered flower lying on dry soil, petals scattered","A flickering candle flame about to extinguish, smoke rising"],"image_desc_en":"Representations of ceasing to live or function.","image_desc_cn":"代表停止生命或功能的状态。","meaning_cn":"死亡；消亡","usage":"v. (died, died)","collocations":"die of, die from, die out","preposition_combos":"die of disease, die from injury","examples":[{"en":"Plants will die if they don't get enough water and sunlight.","cn":"如果植物没有足够的水和阳光，它们就会死亡。"},{"en":"Many species of animals may die out because of pollution.","cn":"许多动物物种可能会因为污染而灭绝。"}],"socratic_questions":[{"question":"如果一个人或动物停止呼吸并且身体不再活动，会发生什么？","answer_hint":"这个词描述了生命终止的状态。"}],"fill_blank":{"sentences":["If you don't water the plants, they will ___."],"options":["die","grow","bloom","live"],"correct_index":0},"audio":"audio/die.mp3","audio_ex0":"audio/die_ex0.mp3","audio_ex1":"audio/die_ex1.mp3"},{"word":"make a promise","ipa":"/meɪk ə ˈprɒmɪs/","image_prompts":["A hand writing 'I promise' on a notepad with a pen","Two hands shaking over a contract with a seal"],"image_desc_en":"A commitment to fulfill a task or keep one's word.","image_desc_cn":"承诺履行一项任务或遵守诺言。","meaning_cn":"承诺，许诺","usage":"v. 做出承诺","collocations":"keep a promise, break a promise","preposition_combos":"promise to do sth, promise sb sth","examples":[{"en":"I make a promise to study hard for the exam next week.","cn":"我承诺下周努力学习备考。"},{"en":"She made a promise to her friend that she would help.","cn":"她向她的朋友承诺她会帮忙。"}],"socratic_questions":[{"question":"当你非常认真地告诉别人你会做到某事时，你在做什么？","answer_hint":"这个行为表示你给出了保证，你会尽力完成。"}],"fill_blank":{"sentences":["He ___ to visit his grandparents every weekend."],"options":["made a promise","told a story","gave advice","sent a letter"],"correct_index":0},"audio":"audio/make_a_promise.mp3","audio_ex0":"audio/make_a_promise_ex0.mp3","audio_ex1":"audio/make_a_promise_ex1.mp3"},{"word":"someone","ipa":"/ˈsʌmwʌn/","image_prompts":["A silhouette standing in a doorway, light streaming from behind","A single spotlight shining on an empty stage, creating a sense of mystery"],"image_desc_en":"A silhouette or a spotlight representing an unknown person.","image_desc_cn":"用剪影或聚光灯代表一个未知的人。","meaning_cn":"某人，有人","usage":"代词 pronoun","collocations":"someone else, someone special, someone important","preposition_combos":"about someone, for someone, to someone, with someone","examples":[{"en":"Is there someone who can help me with this difficult math problem?","cn":"有没有人可以帮我解决这个困难的数学问题？"},{"en":"I think someone left their umbrella in the classroom after school.","cn":"我想有人放学后把雨伞落在了教室里。"}],"socratic_questions":[{"question":"如果你在街上看到一个需要帮助的人，你会怎么称呼他/她？","answer_hint":"指代一个不确定身份的人。"}],"fill_blank":{"sentences":["Did ___ call while I was out, or was it just the wind?"],"options":["someone","anyone","everyone","no one"],"correct_index":0},"audio":"audio/someone.mp3","audio_ex0":"audio/someone_ex0.mp3","audio_ex1":"audio/someone_ex1.mp3"},{"word":"set","ipa":"/set/","image_prompts":["A collection of colorful building blocks arranged neatly on a wooden table","A table meticulously set with plates, silverware, and glasses for a formal dinner"],"image_desc_en":"Building blocks and a formally set table.","image_desc_cn":"积木和布置好的餐桌。","meaning_cn":"设置，放置；一套","usage":"v. (过去式 set, 过去分词 set)；n.","collocations":"set up, set off, a set of","preposition_combos":"set about, set aside","examples":[{"en":"Please set the table before dinner; we are all hungry.","cn":"请在晚餐前摆好桌子；我们都很饿了。"},{"en":"She has a set of beautiful stamps from different countries.","cn":"她有一套来自不同国家的精美邮票。"}],"socratic_questions":[{"question":"如果你要开始一场游戏，你需要做什么准备？或者，描述一下你购买的包含多个相同物品的东西。","answer_hint":"游戏开始前的准备动作，或者多个物品构成一个整体。"}],"fill_blank":{"sentences":["They ___ a new record for the fastest time in the race."],"options":["set","sat","sit","setting"],"correct_index":0},"audio":"audio/set.mp3","audio_ex0":"audio/set_ex0.mp3","audio_ex1":"audio/set_ex1.mp3"},{"word":"rich","ipa":"/rɪtʃ/","image_prompts":["A treasure chest overflowing with gold coins and jewels, sparkling light","A vast, green landscape with fertile soil and abundant crops, sunny day"],"image_desc_en":"A treasure chest full of gold and a fertile landscape.","image_desc_cn":"装满黄金的宝箱和肥沃的土地。","meaning_cn":"富有的；富饶的","usage":"adj. richer, richest","collocations":"rich in, become rich, rich and famous","preposition_combos":"rich in (something)","examples":[{"en":"The soil here is rich, which is good for growing plants.","cn":"这里的土壤很肥沃，这对植物生长有好处。"},{"en":"He is a rich man who owns many companies in the city.","cn":"他是一个富人，在城市里拥有许多公司。"}],"socratic_questions":[{"question":"如果你有很多钱，可以买很多东西，你会用哪个词来形容你的经济状况？","answer_hint":"这个词形容拥有大量财富。"}],"fill_blank":{"sentences":["The country is ___ in natural resources like oil and gas."],"options":["rich","poor","empty","lacking"],"correct_index":0},"audio":"audio/rich.mp3","audio_ex0":"audio/rich_ex0.mp3","audio_ex1":"audio/rich_ex1.mp3"},{"word":"powerful","ipa":"/ˈpaʊərfl/","image_prompts":["A large waterfall cascading down a rocky cliff, mist rising from the base","A wind turbine spinning rapidly against a bright blue sky, generating electricity"],"image_desc_en":"Illustrations of a waterfall and a wind turbine, representing strength and energy.","image_desc_cn":"瀑布和风力涡轮机的插图，代表力量和能量。","meaning_cn":"adj. 强大的，有力的","usage":"adj. (比较级 more powerful, 最高级 most powerful); 副词 powerfully","collocations":"powerful engine, powerful leader, powerful effect","preposition_combos":"powerful in","examples":[{"en":"The engine in that car is very powerful and fast.","cn":"那辆车的发动机非常强大，速度很快。"},{"en":"A powerful storm caused damage to many homes in the town.","cn":"一场强大的风暴对镇上许多房屋造成了破坏。"}],"socratic_questions":[{"question":"什么词可以形容一个国家的军事实力很强，或者一个人的影响力很大？","answer_hint":"这个词表示一种巨大的力量或影响力，能产生显著的效果。"}],"fill_blank":{"sentences":["The president gave a ___ speech that inspired many people."],"options":["powerful","powerless","powerfully","power"],"correct_index":0},"audio":"audio/powerful.mp3","audio_ex0":"audio/powerful_ex0.mp3","audio_ex1":"audio/powerful_ex1.mp3"},{"word":"upset","ipa":"/ʌpˈset/","image_prompts":["A spilled glass of milk on a table, milk spreading across the surface","A crumpled letter on a desk, surrounded by scattered papers"],"image_desc_en":"Spilled milk and a crumpled letter symbolizing emotional distress.","image_desc_cn":"洒出的牛奶和揉皱的信纸，象征着情绪上的不安。","meaning_cn":"adj. 难过的，沮丧的；v. 使难过，使沮丧","usage":"adj. / v. (过去式 upset, 过去分词 upset)","collocations":"get upset, be upset about","preposition_combos":"upset about/by","examples":[{"en":"She was upset about failing the math exam last week.","cn":"她因为上周数学考试不及格而感到难过。"},{"en":"Don't upset yourself over such a small mistake; learn from it.","cn":"不要因为这样的小错误而让自己难过；从中学习。"}],"socratic_questions":[{"question":"如果你得知自己最喜欢的球队输掉了重要的比赛，你会感到怎么样？","answer_hint":"这种感觉通常表示失望和难过。"}],"fill_blank":{"sentences":["He was very ___ when he heard the bad news."],"options":["upset","happy","excited","calm"],"correct_index":0},"audio":"audio/upset.mp3","audio_ex0":"audio/upset_ex0.mp3","audio_ex1":"audio/upset_ex1.mp3"},{"word":"upon","ipa":"/əˈpɒn/","image_prompts":["A stack of books placed neatly on a wooden table, sunlight streaming through a window","A small bird perched on a branch of a blossoming cherry tree, soft focus background"],"image_desc_en":"Books stacked on a table; a bird on a branch.","image_desc_cn":"堆叠在桌上的书；树枝上的一只鸟。","meaning_cn":"在...之上；紧接着","usage":"prep.","collocations":"once upon a time, depend upon, call upon","preposition_combos":"rely upon, insist upon","examples":[{"en":"The cat jumped upon the table to reach the food.","cn":"猫跳到桌子上够食物。"},{"en":"Success depends upon hard work and a bit of luck.","cn":"成功取决于努力工作和一点运气。"}],"socratic_questions":[{"question":"如果你想表达一个东西在另一个东西的表面，你会用哪个介词？","answer_hint":"这个词表示位置关系，强调在...之上。"}],"fill_blank":{"sentences":["The responsibility lies ___ each of us to protect the environment."],"options":["upon","under","below","beside"],"correct_index":0},"audio":"audio/upon.mp3","audio_ex0":"audio/upon_ex0.mp3","audio_ex1":"audio/upon_ex1.mp3"},{"word":"once upon a time","ipa":"/ˌwʌns əˌpɒn ə ˈtaɪm/","image_prompts":["An open storybook with illustrations of a castle and a dragon","A vintage clock with hands pointing to a very early hour, surrounded by stars"],"image_desc_en":"A storybook and a vintage clock.","image_desc_cn":"故事书和老式时钟。","meaning_cn":"很久以前，从前","usage":"短语，用于故事的开头","collocations":"begin with once upon a time","preposition_combos":"N/A","examples":[{"en":"Once upon a time, there was a small village by the sea.","cn":"很久以前，海边有一个小村庄。"},{"en":"The fairy tale began with 'Once upon a time' as usual.","cn":"这个童话故事像往常一样以“很久以前”开头。"}],"socratic_questions":[{"question":"当你开始讲一个童话故事时，通常会用什么短语来引出故事的背景？","answer_hint":"这个短语表示故事发生在遥远的过去，是一个常见的开场白。"}],"fill_blank":{"sentences":["___, in a land far away, lived a brave knight."],"options":["Once upon a time","In the future","Every day","Last year"],"correct_index":0},"audio":"audio/once_upon_a_time.mp3","audio_ex0":"audio/once_upon_a_time_ex0.mp3","audio_ex1":"audio/once_upon_a_time_ex1.mp3"},{"word":"bite","ipa":"/baɪt/","image_prompts":["A set of sharp teeth marks left on a red apple","A dog's teeth sinking into a chew toy, slight indentation visible"],"image_desc_en":"Illustrations of teeth marks on an apple and a dog biting a chew toy.","image_desc_cn":"苹果上的牙印和狗咬玩具的插图。","meaning_cn":"咬","usage":"v. (过去式 bit, 过去分词 bitten)","collocations":"take a bite, bite into","preposition_combos":"bite at, bite on","examples":[{"en":"The dog might bite if you pull its tail too hard.","cn":"如果你用力拉它的尾巴，狗可能会咬你。"},{"en":"I took a big bite of the juicy, ripe peach.","cn":"我咬了一大口多汁成熟的桃子。"}],"socratic_questions":[{"question":"如果你吃东西时用牙齿做什么动作？","answer_hint":"这个动作通常是快速且用力的，用牙齿切割或穿透食物。"}],"fill_blank":{"sentences":["Mosquitoes can ___ you and leave itchy bumps on your skin."],"options":["bite","kick","touch","smell"],"correct_index":0},"audio":"audio/bite.mp3","audio_ex0":"audio/bite_ex0.mp3","audio_ex1":"audio/bite_ex1.mp3"},{"word":"bite through","ipa":"/baɪt θruː/","image_prompts":["A beaver's teeth having gnawed completely through a thick log, wood chips scattered around","A set of metal pliers cutting through a thick wire, sparks flying"],"image_desc_en":"Illustrations of something being cut or gnawed completely through.","image_desc_cn":"某物被完全切断或咬穿的插图。","meaning_cn":"咬穿；切断","usage":"v. (过去式 bit through, 过去分词 bitten through)","collocations":"bite through a rope, bite through a wire","preposition_combos":"bite through with","examples":[{"en":"The mouse tried to bite through the bag of rice.","cn":"老鼠试图咬穿米袋。"},{"en":"Can this tool bite through such a thick piece of metal?","cn":"这个工具能切断这么厚的金属片吗？"}],"socratic_questions":[{"question":"如果你用牙齿或工具，最终将某物完全分割开，你会怎么描述这个动作？","answer_hint":"这个动作表示完全穿透并分割开。"}],"fill_blank":{"sentences":["The dog managed to ___ the thick leather leash.","The dog managed to ___ the thick leather leash."],"options":["bite through","chew on","look at","jump over"],"correct_index":0},"audio":"audio/bite_through.mp3","audio_ex0":"audio/bite_through_ex0.mp3","audio_ex1":"audio/bite_through_ex1.mp3"},{"word":"net","ipa":"/net/","image_prompts":["A fishing net hanging on a wooden dock, sunlight reflecting on the water","A volleyball net stretched tightly between two poles on a sandy beach"],"image_desc_en":"A fishing net and a volleyball net.","image_desc_cn":"渔网和排球网。","meaning_cn":"n. 网；adj. 净的","usage":"n. (复数 nets); adj.","collocations":"fishing net, internet, safety net","preposition_combos":"in the net, on the net","examples":[{"en":"The fisherman cast his net into the sea early this morning.","cn":"渔夫今天早上很早就把他的网撒到海里了。"},{"en":"The net income of the company increased last year because of sales.","cn":"由于销售额的增长，公司去年的净收入增加了。"}],"socratic_questions":[{"question":"捕鱼时，需要用什么工具才能把鱼捞上来？","answer_hint":"这种工具通常是网状的，可以用来捕捉水中的生物。"}],"fill_blank":{"sentences":["The volleyball player jumped high to spike the ball over the ___."],"options":["net","court","line","ground"],"correct_index":0},"audio":"audio/net.mp3","audio_ex0":"audio/net_ex0.mp3","audio_ex1":"audio/net_ex1.mp3"},{"word":"hunter","ipa":"/ˈhʌntər/","image_prompts":["A camouflaged tent in a dense forest, hunting gear nearby","A footprint in the mud near a forest stream, animal tracks visible"],"image_desc_en":"Images depicting hunting equipment and tracks in a forest.","image_desc_cn":"描绘森林中狩猎设备和踪迹的图像。","meaning_cn":"猎人，狩猎者","usage":"n. (复数 hunters)","collocations":"animal hunter, treasure hunter","preposition_combos":"hunter with a gun","examples":[{"en":"The brave hunter tracked the deer through the dense forest.","cn":"勇敢的猎人追踪着鹿穿过茂密的森林。"},{"en":"My uncle is a skilled hunter who knows a lot about animals.","cn":"我的叔叔是一位技术娴熟的猎人，他非常了解动物。"}],"socratic_questions":[{"question":"在森林里，谁会追踪动物并试图捕获它们？","answer_hint":"这个人以捕猎动物为生或爱好。"}],"fill_blank":{"sentences":["The ___ waited patiently in the woods for the deer to appear."],"options":["hunter","farmer","teacher","doctor"],"correct_index":0},"audio":"audio/hunter.mp3","audio_ex0":"audio/hunter_ex0.mp3","audio_ex1":"audio/hunter_ex1.mp3"},{"word":"promise","ipa":"/ˈprɒmɪs/","image_prompts":["A pinky promise gesture with intertwined fingers, soft lighting","A sealed envelope with a wax stamp depicting clasped hands, antique paper background"],"image_desc_en":"Illustrations depicting a pinky promise and a sealed promise.","image_desc_cn":"描绘了拉钩承诺和密封承诺的插图。","meaning_cn":"承诺，诺言；答应，允诺","usage":"n. 承诺，诺言; v. (promised, promised) 答应，允诺","collocations":"make a promise, keep a promise, break a promise","preposition_combos":"promise to do sth, promise sb sth, promise that...","examples":[{"en":"I promise to return your book before the end of the week.","cn":"我保证这周末之前还你的书。"},{"en":"She made a promise to herself to study harder this term.","cn":"她向自己承诺这学期要更努力学习。"}],"socratic_questions":[{"question":"如果你向朋友保证保守秘密，你会怎么做？","answer_hint":"需要一个动词，表示你给出了保证，不会泄露秘密。"}],"fill_blank":{"sentences":["He made a ___ to help me with my homework tomorrow."],"options":["promise","suggestion","question","request"],"correct_index":0},"audio":"audio/promise.mp3","audio_ex0":"audio/promise_ex0.mp3","audio_ex1":"audio/promise_ex1.mp3"},{"word":"long ago","ipa":"/lɔŋ əˈɡoʊ/","image_prompts":["An ancient scroll with faded ink and cracked edges, resting on a dusty wooden table","A sepia-toned photograph of a horse-drawn carriage on a cobblestone street"],"image_desc_en":"Images representing a distant past.","image_desc_cn":"代表遥远过去的图像。","meaning_cn":"很久以前","usage":"adv. 很久以前","collocations":"many years long ago, not so long ago","preposition_combos":"from long ago","examples":[{"en":"Dinosaurs lived on Earth long ago, before humans existed.","cn":"恐龙在人类存在之前很久就生活在地球上了。"},{"en":"My grandparents met each other long ago at a summer camp.","cn":"我的祖父母很久以前在一个夏令营相遇。"}],"socratic_questions":[{"question":"如果我们要描述一个非常遥远的过去，你会用什么短语？","answer_hint":"这个短语表示时间上非常久远。"}],"fill_blank":{"sentences":["___, people used horses for transportation instead of cars."],"options":["Long ago","Recently","Tomorrow","Quickly"],"correct_index":0},"audio":"audio/long_ago.mp3","audio_ex0":"audio/long_ago_ex0.mp3","audio_ex1":"audio/long_ago_ex1.mp3"},{"word":"war","ipa":"/wɔːr/","image_prompts":["A chessboard with pieces arranged as if in a strategic battle, pieces scattered","A torn and faded flag hanging limply from a broken flagpole, overcast sky"],"image_desc_en":"Images depicting conflict and destruction.","image_desc_cn":"描绘冲突和破坏的图像。","meaning_cn":"战争","usage":"n. (wars) / v. (warred, warred)","collocations":"declare war, wage war, end a war","preposition_combos":"war against, war between, in war","examples":[{"en":"The long war caused suffering for many families in the region.","cn":"这场漫长的战争给该地区的许多家庭带来了苦难。"},{"en":"Countries should work together to prevent another world war.","cn":"各国应该共同努力，防止再次发生世界大战。"}],"socratic_questions":[{"question":"如果两个国家之间发生了大规模的武装冲突，导致人员伤亡和财产损失，这通常被称为什么？","answer_hint":"这个词指的是国家或团体之间使用武力解决争端的状态。"}],"fill_blank":{"sentences":["The two nations were at ___ for many years, causing great damage."],"options":["war","peace","agreement","friendship"],"correct_index":0},"audio":"audio/war.mp3","audio_ex0":"audio/war_ex0.mp3","audio_ex1":"audio/war_ex1.mp3"},{"word":"neighbour","ipa":"/ˈneɪbər/","image_prompts":["Houses side by side in a suburban street, neatly trimmed lawns","A friendly wave between two houses across a shared fence"],"image_desc_en":"Houses next to each other, representing the concept of neighborhood.","image_desc_cn":"相邻的房屋，代表邻里概念。","meaning_cn":"邻居","usage":"n. (美拼 neighbor)","collocations":"good neighbour, close neighbour, next-door neighbour","preposition_combos":"with a neighbour, to a neighbour","examples":[{"en":"Our new neighbour is very kind and always helps us.","cn":"我们的新邻居非常友善，总是帮助我们。"},{"en":"I often chat with my neighbour about gardening tips.","cn":"我经常和我的邻居聊天，交流园艺技巧。"}],"socratic_questions":[{"question":"住在你家附近，经常和你打招呼的人，你会怎么称呼他们？","answer_hint":"指住在附近的人，彼此之间有一定联系。"}],"fill_blank":{"sentences":["My family has a very good relationship with our ___."],"options":["neighbour","stranger","tourist","customer"],"correct_index":0},"audio":"audio/neighbour.mp3","audio_ex0":"audio/neighbour_ex0.mp3","audio_ex1":"audio/neighbour_ex1.mp3"},{"word":"wise","ipa":"/waɪz/","image_prompts":["An owl perched on a branch wearing spectacles, surrounded by books","A chess board with pieces strategically positioned, representing foresight"],"image_desc_en":"An owl with glasses and a chess board showing strategic thinking.","image_desc_cn":"戴眼镜的猫头鹰和展示战略思维的棋盘。","meaning_cn":"明智的，聪明的","usage":"adj. wiser, wisest; wisely (adv.)","collocations":"wise decision, wise choice, wise man, be wise to","preposition_combos":"wise about, wise beyond","examples":[{"en":"It was a wise decision to save money for the future.","cn":"为未来存钱是一个明智的决定。"},{"en":"She is a wise woman who always gives good advice.","cn":"她是一位聪明的女士，总是给出很好的建议。"}],"socratic_questions":[{"question":"如果你面临一个重要的选择，你会选择听取谁的意见？","answer_hint":"这个人应该有经验，并且能给出合理的建议。"}],"fill_blank":{"sentences":["It is ___ to study hard for your exams."],"options":["wise","easy","difficult","silly"],"correct_index":0},"audio":"audio/wise.mp3","audio_ex0":"audio/wise_ex0.mp3","audio_ex1":"audio/wise_ex1.mp3"},{"word":"emperor","ipa":"/ˈempərər/","image_prompts":["A golden crown resting on a velvet cushion in a royal treasury","An ancient scroll depicting a ruler sitting on a throne, surrounded by advisors"],"image_desc_en":"Illustrations depicting symbols of royalty and ancient rulers.","image_desc_cn":"描绘皇室象征和古代统治者的插图。","meaning_cn":"皇帝","usage":"n. (复数 emperors)","collocations":"ancient emperor, powerful emperor, the emperor of China","preposition_combos":"emperor of","examples":[{"en":"The emperor built a grand palace that took many years to complete.","cn":"这位皇帝建造了一座宏伟的宫殿，花费了许多年才完成。"},{"en":"The old emperor ruled the vast land with wisdom and justice.","cn":"这位老皇帝以智慧和公正统治着广袤的土地。"}],"socratic_questions":[{"question":"古代中国谁拥有最高的权力，可以决定所有人的命运？","answer_hint":"这个词指的是一个国家的最高统治者，拥有至高无上的权力。"}],"fill_blank":{"sentences":["The ancient Roman ___ was known for his powerful military strategies."],"options":["emperor","president","minister","general"],"correct_index":0},"audio":"audio/emperor.mp3","audio_ex0":"audio/emperor_ex0.mp3","audio_ex1":"audio/emperor_ex1.mp3"},{"word":"lie","ipa":"/laɪ/","image_prompts":["A crumpled piece of paper on a desk, discarded and forgotten","A compass pointing in the wrong direction, indicating a false path"],"image_desc_en":"A crumpled paper and a misleading compass.","image_desc_cn":"一张揉皱的纸和指向错误方向的指南针。","meaning_cn":"v. 躺；说谎 n. 谎言","usage":"v. (过去式 lay, 过去分词 lain)；n. (复数 lies)","collocations":"tell a lie, lie in bed, lie to someone","preposition_combos":"lie about, lie to","examples":[{"en":"I like to lie on the grass and watch the clouds.","cn":"我喜欢躺在草地上看云。"},{"en":"He told a lie about his homework to avoid trouble.","cn":"他为了避免麻烦，说了关于作业的谎言。"}],"socratic_questions":[{"question":"如果你为了逃避惩罚而编造了一个故事，你做了什么？","answer_hint":"这个行为是不真实的，目的是为了欺骗。"}],"fill_blank":{"sentences":["It is wrong to ___ to your parents about your grades."],"options":["lie","lay","lied","lying"],"correct_index":0},"audio":"audio/lie.mp3","audio_ex0":"audio/lie_ex0.mp3","audio_ex1":"audio/lie_ex1.mp3"},{"word":"pretend","ipa":"/prɪˈtend/","image_prompts":["A child's drawing of a dragon with bright colors and exaggerated features","A stage with a spotlight shining on an empty costume rack"],"image_desc_en":"A drawing of a fantasy creature; an empty costume rack on a stage.","image_desc_cn":"一幅充满奇幻色彩的生物绘画；舞台上一个空荡荡的服装架。","meaning_cn":"假装，伪装","usage":"v. (pretended, pretended)","collocations":"pretend to be; pretend to do","preposition_combos":"pretend at","examples":[{"en":"Let's pretend we are astronauts exploring a new planet together.","cn":"让我们假装我们是宇航员，一起探索一颗新的星球吧。"},{"en":"He likes to pretend that he is a famous football player.","cn":"他喜欢假装自己是个著名的足球运动员。"}],"socratic_questions":[{"question":"如果孩子们在玩游戏时，说“我是超人！”，他们正在做什么？","answer_hint":"他们不是真的超人，而是在游戏中扮演一个角色。"}],"fill_blank":{"sentences":["The children ___ to be pirates searching for buried treasure on the beach."],"options":["pretended","imagined","wished","hoped"],"correct_index":0},"audio":"audio/pretend.mp3","audio_ex0":"audio/pretend_ex0.mp3","audio_ex1":"audio/pretend_ex1.mp3"},{"word":"official","ipa":"/əˈfɪʃl/","image_prompts":["A government building with flags waving, representing authority","A document stamped with a seal, indicating authenticity and approval"],"image_desc_en":"Illustrations representing authority and authenticity.","image_desc_cn":"代表权威和真实性的插图。","meaning_cn":"官方的；正式的","usage":"adj. ","collocations":"official announcement, official website, official language","preposition_combos":"official for","examples":[{"en":"The official language of Canada is both English and French.","cn":"加拿大的官方语言是英语和法语。"},{"en":"We received an official letter from the school about the trip.","cn":"我们收到了学校关于这次旅行的正式信函。"}],"socratic_questions":[{"question":"如果某个消息是由政府或学校发布的，我们可以称它为什么样的消息？","answer_hint":"这个词表示信息来自权威机构，具有权威性。"}],"fill_blank":{"sentences":["The school made an ___ announcement about the new rules."],"options":["official","private","secret","personal"],"correct_index":0},"audio":"audio/official.mp3","audio_ex0":"audio/official_ex0.mp3","audio_ex1":"audio/official_ex1.mp3"},{"word":"silly","ipa":"/ˈsɪli/","image_prompts":["A rubber chicken wearing oversized glasses, comical expression","A cartoon brain with a thought bubble showing a banana peel"],"image_desc_en":"Visuals representing foolishness and absurdity.","image_desc_cn":"代表愚蠢和荒谬的视觉效果。","meaning_cn":"adj. 愚蠢的，傻的","usage":"adj. ","collocations":"silly mistake, silly question, feel silly","preposition_combos":"be silly about","examples":[{"en":"It was a silly mistake, but it cost us the game.","cn":"那是个愚蠢的错误，但它让我们输掉了比赛。"},{"en":"Don't be silly! You are the best student in our class.","cn":"别傻了！你是我们班上最好的学生。"}],"socratic_questions":[{"question":"如果有人做了不合逻辑或不明智的事情，你会怎么形容他/她？","answer_hint":"这个词形容缺乏常识或判断力。"}],"fill_blank":{"sentences":["That's a ___ question to ask during a serious discussion."],"options":["silly","serious","smart","difficult"],"correct_index":0},"audio":"audio/silly.mp3","audio_ex0":"audio/silly_ex0.mp3","audio_ex1":"audio/silly_ex1.mp3"},{"word":"decide","ipa":"/dɪˈsaɪd/","image_prompts":["A forked road with a sign pointing in two different directions, overcast sky","A judge's gavel hitting a wooden block, legal documents scattered around"],"image_desc_en":"Forked road and a judge's gavel","image_desc_cn":"岔路和法官的槌子","meaning_cn":"决定，下决心","usage":"v. (过去式 decided, 过去分词 decided)","collocations":"decide on, decide against, decide to do","preposition_combos":"decide on/upon sth","examples":[{"en":"We must decide which book to read for our English class.","cn":"我们必须决定英语课读哪本书。"},{"en":"Did you decide to join the school's art club this year?","cn":"你决定今年加入学校的美术社团了吗？"}],"socratic_questions":[{"question":"如果你有两个同样吸引人的选项，你需要做什么来选择其中一个？","answer_hint":"这个词表示在几个选项中做出选择的过程。"}],"fill_blank":{"sentences":["Have you ___ where to go for our summer vacation this year?"],"options":["decided","deciding","decide","decides"],"correct_index":0},"audio":"audio/decide.mp3","audio_ex0":"audio/decide_ex0.mp3","audio_ex1":"audio/decide_ex1.mp3"},{"word":"praise","ipa":"/preɪz/","image_prompts":["A golden trophy on a velvet cushion, spotlight shining","A certificate of achievement framed and hanging on a wall"],"image_desc_en":"A golden trophy and a framed certificate, symbolizing recognition.","image_desc_cn":"一个金色奖杯和一个装裱好的证书，象征着认可。","meaning_cn":"赞扬，表扬","usage":"v. (过去式 praised, 过去分词 praised); n.","collocations":"praise for, high praise, sing the praises of","preposition_combos":"praise sb. for sth.","examples":[{"en":"The teacher gave him praise for his hard work in math.","cn":"老师表扬了他努力学习数学。"},{"en":"Her parents always praise her efforts, not just her success.","cn":"她的父母总是赞扬她的努力，而不仅仅是她的成功。"}],"socratic_questions":[{"question":"如果你在考试中取得了优异的成绩，你的父母可能会对你做什么？","answer_hint":"他们会表达对你的认可和高兴。"}],"fill_blank":{"sentences":["The coach ___ the team's excellent performance after the game."],"options":["praised","ignored","criticized","avoided"],"correct_index":0},"audio":"audio/praise.mp3","audio_ex0":"audio/praise_ex0.mp3","audio_ex1":"audio/praise_ex1.mp3"},{"word":"afraid","ipa":"/əˈfreɪd/","image_prompts":["A small, trembling leaf clinging to a branch during a thunderstorm.","A darkened hallway with shadows cast by a flickering candle."],"image_desc_en":"Illustrations depicting fear through natural elements and unsettling scenes.","image_desc_cn":"通过自然元素和令人不安的场景来描绘恐惧的插图。","meaning_cn":"害怕的，恐惧的","usage":"adj. ","collocations":"be afraid of, be afraid to do sth","preposition_combos":"afraid of","examples":[{"en":"I am afraid of making mistakes in the final exam.","cn":"我害怕在期末考试中犯错误。"},{"en":"She is afraid to speak in front of a large crowd.","cn":"她害怕在很多人面前讲话。"}],"socratic_questions":[{"question":"如果你看到一条蛇，你可能会有什么感觉？","answer_hint":"描述的是一种不舒服，想要远离的情绪。"}],"fill_blank":{"sentences":["He was ___ of the dark and asked for a nightlight."],"options":["afraid","happy","excited","bored"],"correct_index":0},"audio":"audio/afraid.mp3","audio_ex0":"audio/afraid_ex0.mp3","audio_ex1":"audio/afraid_ex1.mp3"},{"word":"suddenly","ipa":"/ˈsʌdənli/","image_prompts":["A dark room with a light bulb flickering on unexpectedly.","A winding road disappearing into thick fog that appears very quickly."],"image_desc_en":"Illustrations depicting something happening unexpectedly and quickly.","image_desc_cn":"描绘突然且快速发生的事情的插图。","meaning_cn":"突然地","usage":"adv.","collocations":"suddenly appear, suddenly stop, quite suddenly","preposition_combos":"suddenly at","examples":[{"en":"The bus suddenly stopped, and everyone looked surprised.","cn":"公共汽车突然停了下来，每个人看起来都很惊讶。"},{"en":"It suddenly began to rain, so we ran inside quickly.","cn":"突然开始下雨，所以我们迅速跑进室内。"}],"socratic_questions":[{"question":"你正在安静地看书，发生了什么让你意想不到的事情？","answer_hint":"强调事情发生的时间很短，没有任何预兆。"}],"fill_blank":{"sentences":["The music ___ stopped playing during the school performance."],"options":["suddenly","slowly","quietly","carefully"],"correct_index":0},"audio":"audio/suddenly.mp3","audio_ex0":"audio/suddenly_ex0.mp3","audio_ex1":"audio/suddenly_ex1.mp3"},{"word":"at first","ipa":"/æt fɜːrst/","image_prompts":["A seedling emerging from the soil, representing a new beginning","A blurry photograph of a distant finish line, suggesting a long race ahead"],"image_desc_en":"A seedling emerging and a blurry finish line.","image_desc_cn":"一颗发芽的种子和模糊的终点线。","meaning_cn":"起初，最初","usage":"adv. 最初，起先","collocations":"at first sight, at first glance","preposition_combos":"at first in","examples":[{"en":"At first, I found the math problem very difficult to solve.","cn":"起初，我发现这道数学题很难解。"},{"en":"She was nervous at first, but then she felt more relaxed.","cn":"她起初很紧张，但后来她感觉更放松了。"}],"socratic_questions":[{"question":"当你开始学习一项新技能时，你通常会感到怎么样？","answer_hint":"描述的是事情的初始阶段。"}],"fill_blank":{"sentences":["___, I didn't like the book, but now I love it."],"options":["At first","Finally","Suddenly","Therefore"],"correct_index":0},"audio":"audio/at_first.mp3","audio_ex0":"audio/at_first_ex0.mp3","audio_ex1":"audio/at_first_ex1.mp3"},{"word":"truth","ipa":"/truːθ/","image_prompts":["A beam of light shining through a dark room, illuminating dust particles","A scale balancing perfectly with 'honesty' on one side and 'lies' on the other"],"image_desc_en":"Visual representations of truth, such as light overcoming darkness and balanced scales.","image_desc_cn":"真理的视觉表现，例如光战胜黑暗和平衡的秤。","meaning_cn":"真相，事实","usage":"n. (复数 truths)","collocations":"tell the truth, face the truth, the whole truth","preposition_combos":"in truth, to tell the truth","examples":[{"en":"The truth is that I don't like playing computer games.","cn":"事实是我不喜欢玩电脑游戏。"},{"en":"It is important to always tell the truth to your parents.","cn":"永远对你的父母说实话是很重要的。"}],"socratic_questions":[{"question":"如果有人问你是否打破了花瓶，即使是你做的，你会怎么回答？","answer_hint":"需要诚实地面对发生的事情，不隐瞒。"}],"fill_blank":{"sentences":["The ___ about the missing book is that I borrowed it."],"options":["truth","lie","story","reason"],"correct_index":0},"audio":"audio/truth.mp3","audio_ex0":"audio/truth_ex0.mp3","audio_ex1":"audio/truth_ex1.mp3"},{"word":"tell the truth","ipa":"/tel ðə truːθ/","image_prompts":["A wooden sign with the words 'Tell the Truth' carved into it, spotlight shining on the sign","A long nose puppet with a sign saying 'I always tell the truth'"],"image_desc_en":"A sign or puppet representing honesty.","image_desc_cn":"代表诚实的标志或木偶。","meaning_cn":"说实话","usage":"v. 说实话","collocations":"always tell the truth, try to tell the truth","preposition_combos":"tell the truth about","examples":[{"en":"It is important to tell the truth in any situation.","cn":"在任何情况下，说实话都很重要。"},{"en":"He decided to tell the truth about what he had done.","cn":"他决定说出他所做的事情的真相。"}],"socratic_questions":[{"question":"如果你打破了朋友的杯子，你应该怎么做？","answer_hint":"要诚实地承认你的错误，而不是隐瞒。"}],"fill_blank":{"sentences":["You should always ___ even when it's difficult."],"options":["tell the truth","tell a story","tell a lie","tell a joke"],"correct_index":0},"audio":"audio/tell_the_truth.mp3","audio_ex0":"audio/tell_the_truth_ex0.mp3","audio_ex1":"audio/tell_the_truth_ex1.mp3"},{"word":"make money","ipa":"/meɪk ˈmʌni/","image_prompts":["A stack of neatly arranged banknotes of various denominations","A piggy bank overflowing with coins, symbolizing savings and financial gain"],"image_desc_en":"Visuals representing the concept of earning and accumulating wealth.","image_desc_cn":"代表挣钱和积累财富的概念的视觉效果。","meaning_cn":"挣钱，赚钱","usage":"v. (made money, made money) to earn income or profit","collocations":"make a lot of money, make good money, make easy money","preposition_combos":"make money from, make money on","examples":[{"en":"He works hard every day to make money for his family.","cn":"他每天努力工作，为他的家庭挣钱。"},{"en":"Many people want to make money online through various platforms.","cn":"许多人想通过各种平台在网上赚钱。"}],"socratic_questions":[{"question":"如果你通过工作或投资获得了收入，你会怎么描述这个过程？","answer_hint":"这个过程指的是获得经济上的收益。"}],"fill_blank":{"sentences":["She hopes to ___ ___ by selling her handmade crafts at the market."],"options":["make money","lose money","save money","spend money"],"correct_index":0},"audio":"audio/make_money.mp3","audio_ex0":"audio/make_money_ex0.mp3","audio_ex1":"audio/make_money_ex1.mp3"},{"word":"true","ipa":"/truː/","image_prompts":["A compass pointing directly north, indicating accuracy and truth","A judge's gavel resting on a stack of legal documents, symbolizing justice and truth"],"image_desc_en":"A compass pointing north; a gavel on legal documents.","image_desc_cn":"指南针指向北方；法槌放在法律文件上。","meaning_cn":"adj. 真实的；正确的","usage":"adj. (truer, truest) 真实的，正确的","collocations":"true story, true friend, true love","preposition_combos":"true to (忠于)","examples":[{"en":"Is it true that our school will have a sports day?","cn":"我们学校要开运动会是真的吗？"},{"en":"It's true that regular exercise is good for your health.","cn":"经常锻炼对你的健康有好处是真的。"}],"socratic_questions":[{"question":"当有人告诉你一个消息，你想确认它是否属实，你会怎么问？","answer_hint":"这个词表示消息的真实性。"}],"fill_blank":{"sentences":["It's ___ that learning English well needs lots of practice."],"options":["true","truth","false","lie"],"correct_index":0},"audio":"audio/true.mp3","audio_ex0":"audio/true_ex0.mp3","audio_ex1":"audio/true_ex1.mp3"},{"word":"hate","ipa":"/heɪt/","image_prompts":["A wilted rose with thorns, lying on a dark surface","A shattered mirror reflecting a distorted image"],"image_desc_en":"A wilted rose and a shattered mirror.","image_desc_cn":"一朵枯萎的玫瑰和一个破碎的镜子。","meaning_cn":"憎恨，厌恶","usage":"v. (hated, hated) to dislike someone or something very much; n. hatred","collocations":"hate doing something, hate to do something, hate someone's guts","preposition_combos":"hate for","examples":[{"en":"I really hate getting up early on school days.","cn":"我真的很讨厌在上学日早起。"},{"en":"Some students hate exams because they feel too much pressure.","cn":"一些学生讨厌考试，因为他们感到太大的压力。"}],"socratic_questions":[{"question":"当你非常不喜欢某件事或某个人时，你会用什么词来表达这种感觉？","answer_hint":"这个词表示强烈的厌恶感，比不喜欢更强烈。"}],"fill_blank":{"sentences":["She ___ to do her homework every night after school."],"options":["hates","liked","enjoyed","loved"],"correct_index":0},"audio":"audio/hate.mp3","audio_ex0":"audio/hate_ex0.mp3","audio_ex1":"audio/hate_ex1.mp3"},{"word":"get out","ipa":"/ɡɛt aʊt/","image_prompts":["A car parked in a driveway with the door open, suggesting someone is exiting.","A hand reaching for a doorknob on a wooden door, implying leaving a room."],"image_desc_en":"A car with an open door and a hand reaching for a doorknob.","image_desc_cn":"一辆车门打开的汽车和一只伸向门把手的手。","meaning_cn":"离开，出去","usage":"v. (过去式 got out, 过去分词 gotten out)","collocations":"get out of bed, get out of the car, get out of here","preposition_combos":"get out of","examples":[{"en":"I need to get out of the house for some fresh air.","cn":"我需要出去呼吸一些新鲜空气。"},{"en":"Please get out of the car. We have arrived at school.","cn":"请下车。我们已经到达学校了。"}],"socratic_questions":[{"question":"如果你想离开一个房间或者车辆，你会做什么？","answer_hint":"这个短语表示从某个地方离开。"}],"fill_blank":{"sentences":["We should ___ of the classroom after the bell rings."],"options":["get out","get in","stay in","look out"],"correct_index":0},"audio":"audio/get_out.mp3","audio_ex0":"audio/get_out_ex0.mp3","audio_ex1":"audio/get_out_ex1.mp3"},{"word":"king","ipa":"/kɪŋ/","image_prompts":["A golden crown resting on a velvet cushion, ornate details","A chess piece shaped like a king, standing tall on a chessboard"],"image_desc_en":"A golden crown and a chess king piece.","image_desc_cn":"一顶金色的皇冠和一个国际象棋中的国王棋子。","meaning_cn":"国王，君主","usage":"n.","collocations":"king of the jungle, crowned king","preposition_combos":"king in","examples":[{"en":"The lion is often called the king of the jungle.","cn":"狮子通常被称为丛林之王。"},{"en":"He felt like a king when he won the chess tournament.","cn":"当他赢得国际象棋比赛时，他感觉自己像个国王。"}],"socratic_questions":[{"question":"在古代，谁统治着一个国家，拥有最高的权力？","answer_hint":"这个词指的是国家的最高统治者，通常是男性。"}],"fill_blank":{"sentences":["The ___ ruled the country with wisdom and fairness."],"options":["king","queen","president","mayor"],"correct_index":0},"audio":"audio/king.mp3","audio_ex0":"audio/king_ex0.mp3","audio_ex1":"audio/king_ex1.mp3"},{"word":"artist","ipa":"/ˈɑːrtɪst/","image_prompts":["A paint palette with various colors of paint and brushes","A sculpture made of clay on a rotating stand in a studio"],"image_desc_en":"A paint palette and a clay sculpture.","image_desc_cn":"一个调色板和粘土雕塑。","meaning_cn":"艺术家，美术家","usage":"n. (复数 artists)","collocations":"famous artist, local artist, talented artist","preposition_combos":"artist of","examples":[{"en":"The artist used bright colors in her beautiful landscape painting.","cn":"这位艺术家在她美丽的风景画中使用了明亮的颜色。"},{"en":"He is a talented artist who creates amazing sculptures from metal.","cn":"他是一位才华横溢的艺术家，用金属创作出令人惊叹的雕塑。"}],"socratic_questions":[{"question":"谁擅长绘画、雕塑或音乐等艺术创作？","answer_hint":"这个人专注于创造美的作品，可能以艺术为生。"}],"fill_blank":{"sentences":["The young ___ displayed her paintings at the local community center."],"options":["artist","scientist","engineer","teacher"],"correct_index":0},"audio":"audio/artist.mp3","audio_ex0":"audio/artist_ex0.mp3","audio_ex1":"audio/artist_ex1.mp3"},{"word":"anyone","ipa":"/ˈeniwʌn/","image_prompts":["A silhouette of a crowd, some figures highlighted with question marks above them","A single spotlight shining on an empty stage, no one present"],"image_desc_en":"Illustrations representing the concept of 'anyone' or 'any person'.","image_desc_cn":"表示“任何人”或“任何一个人”概念的插图。","meaning_cn":"任何人","usage":"代词 pronoun","collocations":"anyone else, anyone who","preposition_combos":"without anyone knowing","examples":[{"en":"Does anyone know the answer to this difficult question?","cn":"有谁知道这个难题的答案吗？"},{"en":"If anyone calls, please tell them I will be back soon.","cn":"如果有人打电话来，请告诉他们我很快回来。"}],"socratic_questions":[{"question":"如果你想知道是否有人能帮忙，你会怎么问？","answer_hint":"你需要一个词来表示“任何一个人”。"}],"fill_blank":{"sentences":["Is there ___ who can help me with my homework tonight?"],"options":["anyone","someone","everyone","no one"],"correct_index":0},"audio":"audio/anyone.mp3","audio_ex0":"audio/anyone_ex0.mp3","audio_ex1":"audio/anyone_ex1.mp3"},{"word":"instead of","ipa":"/ɪnˈsted ɒv/","image_prompts":["A road fork with a sign pointing to two different destinations, one crossed out","A gift box wrapped with ribbon, with a card saying 'Alternative Choice'"],"image_desc_en":"Illustrations representing choosing one option over another.","image_desc_cn":"表示选择一个选项而不是另一个选项的插图。","meaning_cn":"代替，而不是","usage":"prep. 短语","collocations":"use instead of, choose instead of","preposition_combos":"instead of + noun/gerund","examples":[{"en":"I stayed home instead of going to the school party last night.","cn":"昨晚我待在家里，而不是去学校参加聚会。"},{"en":"We took a bus instead of a taxi to save some money.","cn":"为了省钱，我们乘公共汽车而不是出租车。"}],"socratic_questions":[{"question":"如果你本来计划做A，但最后做了B，你会用哪个短语来表达你没有做A？","answer_hint":"这个短语表示放弃原计划，选择另一个选项。"}],"fill_blank":{"sentences":["She drank water ___ soda because it's healthier for her body."],"options":["instead of","because of","in addition to","as well as"],"correct_index":0},"audio":"audio/instead_of.mp3","audio_ex0":"audio/instead_of_ex0.mp3","audio_ex1":"audio/instead_of_ex1.mp3"},{"word":"succeed in doing sth","ipa":"/səkˈsiːd ɪn ˈduːɪŋ ˌsʌmθɪŋ/","image_prompts":["A trophy on a shelf, surrounded by certificates and medals","A plant growing from a small seed into a large, healthy tree"],"image_desc_en":"A trophy and a growing plant represent achieving a goal.","image_desc_cn":"奖杯和生长的植物代表着成功实现目标。","meaning_cn":"成功做成某事","usage":"v. to achieve something that you have been trying to do","collocations":"succeed in life, succeed in business, hope to succeed","preposition_combos":"succeed in + field/area","examples":[{"en":"She hopes to succeed in passing the important final exam.","cn":"她希望成功通过重要的期末考试。"},{"en":"They succeeded in raising enough money for the school trip.","cn":"他们成功地为学校旅行筹集了足够的钱。"}],"socratic_questions":[{"question":"经过努力，你最终完成了目标，你会用哪个短语来表达这种状态？","answer_hint":"这个短语强调经过努力最终达成目标。"}],"fill_blank":{"sentences":["He will ___ finishing his project if he works hard."],"options":["succeed in","fail to","give up","delay"],"correct_index":0},"audio":"audio/succeed_in_doing_sth.mp3","audio_ex0":"audio/succeed_in_doing_sth_ex0.mp3","audio_ex1":"audio/succeed_in_doing_sth_ex1.mp3"},{"word":"himself","ipa":"/hɪmˈself/","image_prompts":["A mirror reflecting a suited mannequin","A shadow cast by a lone tree in a field at sunset"],"image_desc_en":"Reflection or shadow representing the self.","image_desc_cn":"代表自我的倒影或影子。","meaning_cn":"他自己","usage":"代词 pron. (反身代词)","collocations":"by himself, to himself","preposition_combos":"by himself","examples":[{"en":"He completed the difficult project all by himself last week.","cn":"他上周独自完成了这个困难的项目。"},{"en":"The student taught himself to play the guitar in his room.","cn":"那个学生在自己的房间里自学了吉他。"}],"socratic_questions":[{"question":"如果一个人独自完成了一项任务，没有别人的帮助，我们用哪个词来表示“他”完成了这件事？","answer_hint":"这个词强调动作的执行者和承受者是同一个人。"}],"fill_blank":{"sentences":["He blamed ___ for the mistake, even though it wasn't his fault."],"options":["himself","him","herself","themselves"],"correct_index":0},"audio":"audio/himself.mp3","audio_ex0":"audio/himself_ex0.mp3","audio_ex1":"audio/himself_ex1.mp3"},{"word":"in the end","ipa":"/ɪn ðə end/","image_prompts":["A finish line with a checkered flag waving, symbolizing completion","A winding road leading to a bright, hopeful horizon"],"image_desc_en":"A finish line and a winding road, representing the final outcome.","image_desc_cn":"终点线和蜿蜒的道路，代表最终结果。","meaning_cn":"最终，最后","usage":"短语，表示最终的结果或结论。","collocations":"in the end, decide; in the end, succeed; in the end, fail","preposition_combos":"N/A","examples":[{"en":"We faced many problems, but in the end, we succeeded.","cn":"我们面临许多问题，但最终我们成功了。"},{"en":"I thought I would fail, but in the end, I passed.","cn":"我以为我会失败，但最终我通过了。"}],"socratic_questions":[{"question":"经过长时间的努力和尝试，事情的最终结果是什么？","answer_hint":"强调事情的最终结果，而不是过程。"}],"fill_blank":{"sentences":["___, after many tries, she managed to solve the difficult problem."],"options":["In the end","At first","However","Therefore"],"correct_index":0},"audio":"audio/in_the_end.mp3","audio_ex0":"audio/in_the_end_ex0.mp3","audio_ex1":"audio/in_the_end_ex1.mp3"}]}]};</script>
