<body>
  <script>window.VOCAB_DATA={"units":[{"unit":4,"source":"D:\\2026\\初中\\人教版英语七年级下单词表\\人教版英语七年级下.pdf","words":[{"word":"watermelon","ipa":"/ˈwɔːtərmelən/","image_prompts":["A sliced watermelon on a wooden cutting board, seeds visible","A pile of watermelons in a field, green vines and leaves surrounding them"],"image_desc_en":"A sliced watermelon and a pile of watermelons.","image_desc_cn":"切开的西瓜和一堆西瓜。","meaning_cn":"西瓜","usage":"名词 n.","collocations":"eat watermelon, watermelon juice, watermelon seeds","preposition_combos":"watermelon in","examples":[{"en":"I love to eat watermelon in the summer because it's refreshing.","cn":"我喜欢夏天吃西瓜，因为它很清爽。"},{"en":"We bought a big watermelon for the picnic at the park.","cn":"我们买了一个大西瓜去公园野餐。"}],"socratic_questions":[{"question":"夏天常吃的一种圆形绿色水果，里面是红色的，有很多黑色的籽，是什么？","answer_hint":"这种水果水分很多，吃起来很甜，是夏日解暑佳品。"}],"fill_blank":{"sentences":["She enjoyed a slice of cool, sweet ___ on a hot day."],"options":["watermelon","apple","orange","banana"],"correct_index":0},"audio":"audio/watermelon.mp3","audio_ex0":"audio/watermelon_ex0.mp3","audio_ex1":"audio/watermelon_ex1.mp3","img1":"images/watermelon_1.png","img2":"images/watermelon_2.png"},{"word":"cabbage","ipa":"/ˈkæbɪdʒ/","image_prompts":["A vibrant green cabbage head freshly harvested from a garden, dew drops","A close-up shot of shredded cabbage being prepared for coleslaw, bright lighting"],"image_desc_en":"Images depicting a fresh cabbage head and shredded cabbage.","image_desc_cn":"展示新鲜卷心菜和卷心菜丝的图片。","meaning_cn":"卷心菜，洋白菜","usage":"n. (复数 cabbages)","collocations":"shredded cabbage, cabbage soup, pickled cabbage","preposition_combos":"cabbage in, cabbage with","examples":[{"en":"My mom often makes delicious dishes with fresh cabbage from the market.","cn":"我妈妈经常用从市场上买来的新鲜卷心菜做美味的菜肴。"},{"en":"She added some shredded cabbage to the salad for extra crunch.","cn":"她在沙拉里加了一些卷心菜丝，以增加口感。"}],"socratic_questions":[{"question":"如果你想做一道凉拌菜，需要一种绿色的、叶子紧密包裹在一起的蔬菜，你会选择什么？","answer_hint":"这种蔬菜常用来做沙拉或炒菜，味道清淡。"}],"fill_blank":{"sentences":["The farmer grew a lot of ___ in his garden this year."],"options":["cabbage","tomato","potato","onion"],"correct_index":0},"audio":"audio/cabbage.mp3","audio_ex0":"audio/cabbage_ex0.mp3","audio_ex1":"audio/cabbage_ex1.mp3","img1":"images/cabbage_1.png","img2":"images/cabbage_2.png"},{"word":"mutton","ipa":"/ˈmʌtn/","image_prompts":["A cooked leg of mutton on a silver platter, garnished with rosemary","Raw mutton chops displayed on a butcher's counter, pink and marbled"],"image_desc_en":"A cooked leg of mutton and raw mutton chops.","image_desc_cn":"烹饪好的羊腿和生的羊排。","meaning_cn":"羊肉","usage":"n. 羊肉","collocations":"roast mutton, leg of mutton, mutton chop","preposition_combos":"mutton with","examples":[{"en":"I prefer chicken to mutton because it is less fatty.","cn":"我喜欢鸡肉胜过羊肉，因为它脂肪更少。"},{"en":"The restaurant serves delicious roast mutton every Sunday evening.","cn":"这家餐厅每个星期天晚上供应美味的烤羊肉。"}],"socratic_questions":[{"question":"如果你想吃红肉，但又不是牛肉或猪肉，你会选择什么？","answer_hint":"这是一种常见的肉类，来自成年的羊。"}],"fill_blank":{"sentences":["The chef decided to prepare a hearty stew with tender pieces of ___."],"options":["mutton","chicken","beef","pork"],"correct_index":0},"audio":"audio/mutton.mp3","audio_ex0":"audio/mutton_ex0.mp3","audio_ex1":"audio/mutton_ex1.mp3","img1":"images/mutton_1.png","img2":"images/mutton_2.png"},{"word":"cookie","ipa":"/ˈkʊki/","image_prompts":["A stack of chocolate chip cookies on a wooden plate, crumbs scattered around","A single gingerbread cookie shaped like a star, decorated with icing"],"image_desc_en":"A sweet baked treat, often small and round.","image_desc_cn":"一种甜的烘焙食品，通常小而圆。","meaning_cn":"饼干","usage":"n. (复数 cookies)","collocations":"chocolate chip cookie, oatmeal cookie, fortune cookie","preposition_combos":"a cookie with, a cookie for","examples":[{"en":"I ate a chocolate cookie after finishing my homework yesterday.","cn":"昨天完成作业后，我吃了一块巧克力饼干。"},{"en":"She baked some cookies for the class party last weekend.","cn":"上周末她为班级聚会烤了一些饼干。"}],"socratic_questions":[{"question":"如果你想吃一种甜点，它是烘烤的，而且通常很小，你会选择什么？","answer_hint":"这种食物通常是圆形的，而且有很多不同的口味。"}],"fill_blank":{"sentences":["My mom always makes delicious ___ for us on weekends."],"options":["cookies","candies","fruits","vegetables"],"correct_index":0},"audio":"audio/cookie.mp3","audio_ex0":"audio/cookie_ex0.mp3","audio_ex1":"audio/cookie_ex1.mp3","img1":"images/cookie_1.png","img2":"images/cookie_2.png"},{"word":"onion","ipa":"/ˈʌnjən/","image_prompts":["A cross-section of an onion showing its layered structure, bright studio lighting","A pile of onions in a burlap sack at a farmer's market, rustic setting"],"image_desc_en":"Images depicting the layered structure and a pile of onions.","image_desc_cn":"展示洋葱的层次结构和一堆洋葱的图片。","meaning_cn":"洋葱","usage":"n. (复数 onions)","collocations":"raw onion, fried onion, onion soup, onion rings","preposition_combos":"with onion, without onion, of onion","examples":[{"en":"I added some chopped onion to the salad for extra flavor.","cn":"我在沙拉里加了一些切碎的洋葱，以增加风味。"},{"en":"The chef is preparing a delicious onion soup for the guests.","cn":"厨师正在为客人准备美味的洋葱汤。"}],"socratic_questions":[{"question":"什么蔬菜切开时会让你流泪，而且它有很多层？","answer_hint":"这种蔬菜常用于烹饪，味道浓郁。"}],"fill_blank":{"sentences":["She cried while cutting the ___ for the stew."],"options":["onion","potato","carrot","garlic"],"correct_index":0},"audio":"audio/onion.mp3","audio_ex0":"audio/onion_ex0.mp3","audio_ex1":"audio/onion_ex1.mp3","img1":"images/onion_1.png","img2":"images/onion_2.png"},{"word":"dumpling","ipa":"/ˈdʌmplɪŋ/","image_prompts":["A plate of steaming dumplings with soy sauce and chopsticks","Close-up of a dumpling being dipped into a bowl of vinegar, steam rising"],"image_desc_en":"A plate of dumplings and a dumpling being dipped in vinegar.","image_desc_cn":"一盘饺子和一只蘸醋的饺子。","meaning_cn":"饺子","usage":"n. (复数 dumplings)","collocations":"eat dumplings, make dumplings, steamed dumplings, fried dumplings","preposition_combos":"dumplings with (filling), dumplings in (soup)","examples":[{"en":"We usually eat dumplings during the Spring Festival in my family.","cn":"我们家通常在春节期间吃饺子。"},{"en":"She learned how to make delicious pork dumplings from her grandma.","cn":"她从奶奶那里学会了如何制作美味的猪肉饺子。"}],"socratic_questions":[{"question":"过春节时，北方人常吃什么用面皮包着肉和蔬菜的食物？","answer_hint":"这是一种传统食物，形状像耳朵，煮着吃或蒸着吃。"}],"fill_blank":{"sentences":["My favorite food is ___ , especially when they are homemade."],"options":["dumplings","noodles","sandwiches","salads"],"correct_index":0},"audio":"audio/dumpling.mp3","audio_ex0":"audio/dumpling_ex0.mp3","audio_ex1":"audio/dumpling_ex1.mp3","img1":"images/dumpling_1.png","img2":"images/dumpling_2.png"},{"word":"coffee","ipa":"/ˈkɒfi/","image_prompts":["A steaming cup of dark coffee on a wooden table, morning sunlight","Coffee beans scattered around a vintage coffee grinder, rustic setting"],"image_desc_en":"Images depicting coffee beans and a cup of coffee.","image_desc_cn":"描绘咖啡豆和一杯咖啡的图像。","meaning_cn":"咖啡","usage":"n. (复数 coffees)","collocations":"cup of coffee, coffee shop, coffee break","preposition_combos":"coffee with milk, coffee in a mug","examples":[{"en":"I usually drink a cup of coffee every morning before school.","cn":"我通常每天上学前喝一杯咖啡。"},{"en":"This coffee shop is a nice place to meet friends and chat.","cn":"这家咖啡店是和朋友见面聊天的好地方。"}],"socratic_questions":[{"question":"如果你感到疲倦，想要提神醒脑，你会选择喝什么？","answer_hint":"这种饮料通常是棕色的，并且含有咖啡因。"}],"fill_blank":{"sentences":["She ordered a strong ___ to help her stay awake during the exam."],"options":["coffee","tea","juice","water"],"correct_index":0},"audio":"audio/coffee.mp3","audio_ex0":"audio/coffee_ex0.mp3","audio_ex1":"audio/coffee_ex1.mp3","img1":"images/coffee_1.png","img2":"images/coffee_2.png"},{"word":"bean","ipa":"/biːn/","image_prompts":["A pile of raw green beans on a wooden table, natural light","A close-up of coffee beans in a burlap sack, warm tones"],"image_desc_en":"Images of green beans and coffee beans.","image_desc_cn":"绿豆和咖啡豆的图片。","meaning_cn":"豆，豆荚","usage":"n. (复数 beans)","collocations":"coffee bean, bean sprout, green bean","preposition_combos":"beans in","examples":[{"en":"I like to eat green beans with my dinner every day.","cn":"我每天晚饭都喜欢吃青豆。"},{"en":"These coffee beans have a strong aroma that I really enjoy.","cn":"这些咖啡豆有一种我非常喜欢的浓郁香味。"}],"socratic_questions":[{"question":"你早餐吃的食物，通常是长条状，绿色，富含纤维？","answer_hint":"食物是植物的种子，通常在豆荚里。"}],"fill_blank":{"sentences":["She added a handful of dried ___ to the soup for extra flavor."],"options":["beans","apples","oranges","grapes"],"correct_index":0},"audio":"audio/bean.mp3","audio_ex0":"audio/bean_ex0.mp3","audio_ex1":"audio/bean_ex1.mp3","img1":"images/bean_1.png","img2":"images/bean_2.png"},{"word":"chip","ipa":"/tʃɪp/","image_prompts":["A close-up of a single potato chip with visible salt crystals","A broken ceramic tile with a small piece missing from the edge"],"image_desc_en":"A potato chip and a chipped tile.","image_desc_cn":"薯片和有缺口的瓷砖。","meaning_cn":"n. 碎片；薯片 v. 削下","usage":"n. (复数 chips)；v. (chipped, chipped)","collocations":"computer chip, chocolate chip, potato chip","preposition_combos":"chip off","examples":[{"en":"She ate a bag of potato chips during the movie.","cn":"她在看电影时吃了一包薯片。"},{"en":"A small chip of wood flew off when he hit it.","cn":"当他击打木头时，一小块木屑飞了出来。"}],"socratic_questions":[{"question":"如果你不小心把瓷砖边缘碰掉了一小块，留下的会是什么？","answer_hint":"指很小的一块碎片。"}],"fill_blank":{"sentences":["He accidentally ___ a piece off the glass while cleaning it."],"options":["chipped","broke","smashed","cracked"],"correct_index":0},"audio":"audio/chip.mp3","audio_ex0":"audio/chip_ex0.mp3","audio_ex1":"audio/chip_ex1.mp3","img1":"images/chip_1.png","img2":"images/chip_2.png"},{"word":"fish and chips","ipa":"/fɪʃ ænd ˈtʃɪps/","image_prompts":["A plate of golden fried fish and crispy chips, viewed from above","Newspaper wrapping containing fish and chips, seaside background"],"image_desc_en":"A popular British takeaway dish consisting of fried fish and chips.","image_desc_cn":"一种受欢迎的英国外卖食品，由炸鱼和薯条组成。","meaning_cn":"炸鱼和薯条","usage":"n. (复数 fish and chips)","collocations":"order fish and chips, eat fish and chips","preposition_combos":"with fish and chips, for fish and chips","examples":[{"en":"Let's buy fish and chips for dinner at the seaside.","cn":"我们去海边买炸鱼和薯条当晚餐吧。"},{"en":"I often eat fish and chips when I visit London.","cn":"我去伦敦的时候经常吃炸鱼和薯条。"}],"socratic_questions":[{"question":"如果你在英国海边，想吃一种用油炸的鱼和土豆条，它叫什么？","answer_hint":"这是英国很受欢迎的快餐，通常用报纸包着。"}],"fill_blank":{"sentences":["We had ___ for lunch at the restaurant near the beach."],"options":["fish and chips","pizza","salad","noodles"],"correct_index":0},"audio":"audio/fish_and_chips.mp3","audio_ex0":"audio/fish_and_chips_ex0.mp3","audio_ex1":"audio/fish_and_chips_ex1.mp3","img1":"images/fish_and_chips_1.png","img2":"images/fish_and_chips_2.png"},{"word":"salad","ipa":"/ˈsæləd/","image_prompts":["A glass bowl filled with a colorful mix of fresh lettuce, tomatoes, cucumbers, and carrots, drizzled with light vinaigrette","An overhead shot of a variety of salad ingredients arranged on a wooden cutting board: romaine lettuce, bell peppers, red onion, avocado"],"image_desc_en":"A bowl of fresh salad ingredients.","image_desc_cn":"一碗新鲜的沙拉食材。","meaning_cn":"沙拉","usage":"n.","collocations":"green salad, fruit salad, chicken salad","preposition_combos":"salad with, salad for","examples":[{"en":"I usually have a salad for lunch to stay healthy.","cn":"我通常午餐吃沙拉以保持健康。"},{"en":"She made a big salad with fresh vegetables from her garden.","cn":"她用花园里新鲜的蔬菜做了一大份沙拉。"}],"socratic_questions":[{"question":"如果你想吃一道凉拌的菜，里面有生菜、番茄和黄瓜，你会选择什么？","answer_hint":"这是一种常见的健康菜肴，主要由生的蔬菜组成。"}],"fill_blank":{"sentences":["He ordered a chicken ___ for a light and refreshing meal."],"options":["salad","soup","sandwich","pizza"],"correct_index":0},"audio":"audio/salad.mp3","audio_ex0":"audio/salad_ex0.mp3","audio_ex1":"audio/salad_ex1.mp3","img1":"images/salad_1.png","img2":"images/salad_2.png"},{"word":"porridge","ipa":"/ˈpɒrɪdʒ/","image_prompts":["A bowl of steaming oatmeal with berries and nuts on a wooden table","A close-up shot of creamy rice porridge with green onions and ginger"],"image_desc_en":"A bowl of porridge, such as oatmeal or rice porridge.","image_desc_cn":"一碗粥，比如燕麦粥或米粥。","meaning_cn":"粥","usage":"n. (不可数名词)","collocations":"eat porridge, a bowl of porridge, rice porridge, oat porridge","preposition_combos":"porridge with milk, porridge for breakfast","examples":[{"en":"She eats a bowl of porridge every morning before school.","cn":"她每天早上上学前都吃一碗粥。"},{"en":"This porridge is too thick; can you add some more water?","cn":"这粥太稠了，你能再加点水吗？"}],"socratic_questions":[{"question":"如果你想吃一种用谷物煮成的，通常在早餐时食用的食物，你会选择什么？","answer_hint":"这种食物通常很粘稠，而且很暖和。"}],"fill_blank":{"sentences":["He likes to add honey to his ___ to make it sweeter."],"options":["porridge","soup","salad","sandwich"],"correct_index":0},"audio":"audio/porridge.mp3","audio_ex0":"audio/porridge_ex0.mp3","audio_ex1":"audio/porridge_ex1.mp3","img1":"images/porridge_1.png","img2":"images/porridge_2.png"},{"word":"waiter","ipa":"/ˈweɪtər/","image_prompts":["A person's hand holding a notepad and pen, taking an order in a restaurant","A silver tray with a covered dish on it, being carried through a busy restaurant"],"image_desc_en":"Images depicting a waiter taking orders and serving food in a restaurant.","image_desc_cn":"描绘服务员在餐厅里点餐和上菜的图像。","meaning_cn":"服务员","usage":"n. (复数 waiters)","collocations":"call a waiter, tip the waiter","preposition_combos":"waiter at/in","examples":[{"en":"The waiter brought our food quickly, which was very nice of him.","cn":"服务员很快给我们上了菜，他真是太好了。"},{"en":"We asked the waiter for the bill after we finished eating dinner.","cn":"我们吃完晚饭后，请服务员结账。"}],"socratic_questions":[{"question":"在餐厅里，谁会为你点餐，并把食物端到你的桌子上？","answer_hint":"这个人通常在餐厅工作，负责服务顾客。"}],"fill_blank":{"sentences":["The ___ at the restaurant was very helpful and friendly to us."],"options":["waiter","cook","driver","teacher"],"correct_index":0},"audio":"audio/waiter.mp3","audio_ex0":"audio/waiter_ex0.mp3","audio_ex1":"audio/waiter_ex1.mp3","img1":"images/waiter_1.png","img2":"images/waiter_2.png"},{"word":"What about","ipa":"/wʌt əˈbaʊt/","image_prompts":["A question mark drawn in chalk on a blackboard surrounded by various colorful school supplies","A thought bubble above a stack of books, containing a question mark and several possible answers"],"image_desc_en":"Illustrations representing considering options or making suggestions.","image_desc_cn":"表示考虑选项或提出建议的插图。","meaning_cn":"怎么样；如何","usage":"短语。用于提出建议或询问对某事的看法。","collocations":"What about doing something; What about going somewhere","preposition_combos":"What about + noun/gerund","examples":[{"en":"What about going to the library after school today?","cn":"今天放学后去图书馆怎么样？"},{"en":"What about this new English learning method we just learned?","cn":"我们刚刚学到的这个新的英语学习方法怎么样？"}],"socratic_questions":[{"question":"如果你想知道朋友对某个计划的看法，你会怎么问？","answer_hint":"用于提出建议或询问意见。"}],"fill_blank":{"sentences":["___ going to the cinema this weekend? I heard there's a new movie."],"options":["What about","How about","Why not","If so"],"correct_index":0},"audio":"audio/What_about.mp3","audio_ex0":"audio/What_about_ex0.mp3","audio_ex1":"audio/What_about_ex1.mp3","img1":"images/What_about_1.png","img2":"images/What_about_2.png"},{"word":"taste","ipa":"/teɪst/","image_prompts":["A spoonful of colorful spices, vibrant and aromatic","A close-up of a tongue with visible taste buds, glistening surface"],"image_desc_en":"Images depicting the sensation of taste and the organ responsible for it.","image_desc_cn":"描绘味觉和负责味觉的器官的图像。","meaning_cn":"v. 品尝；n. 味道","usage":"v. (tasted, tasted); n.","collocations":"have a taste of, bad taste, in good taste","preposition_combos":"taste of","examples":[{"en":"This cake tastes delicious; I want another piece of it.","cn":"这块蛋糕味道真好吃；我还想再来一块。"},{"en":"I had a taste of the soup, and it needed more salt.","cn":"我尝了一口汤，发现需要加更多的盐。"}],"socratic_questions":[{"question":"当你吃东西时，你用什么来感受食物的 flavor？","answer_hint":"这个词指的是你用舌头感知食物的方式。"}],"fill_blank":{"sentences":["The coffee had a bitter ___ that I didn't enjoy at all."],"options":["taste","smell","look","sound"],"correct_index":0},"audio":"audio/taste.mp3","audio_ex0":"audio/taste_ex0.mp3","audio_ex1":"audio/taste_ex1.mp3","img1":"images/taste_1.png","img2":"images/taste_2.png"},{"word":"anything","ipa":"/ˈenɪθɪŋ/","image_prompts":["A collection of various objects scattered on a table, representing a wide range of possibilities","An open doorway leading to a brightly lit room filled with unknown items"],"image_desc_en":"A variety of items or an open doorway to represent any possibility.","image_desc_cn":"各种物品或敞开的门，代表任何可能性。","meaning_cn":"任何事物；任何东西","usage":"pron.","collocations":"anything else, anything like, anything but","preposition_combos":"anything about, anything for, anything with","examples":[{"en":"Is there anything I can do to help you with that?","cn":"有什么我可以帮忙你的吗？"},{"en":"I don't want anything from you, just leave me alone.","cn":"我不想从你那里得到任何东西，就让我一个人待着。"}],"socratic_questions":[{"question":"如果你被允许选择教室里的所有东西，但只能选一样，你会选______？","answer_hint":"这个词表示你可以选择任何事物。"}],"fill_blank":{"sentences":["Do you need ___ from the store when I go later?"],"options":["anything","nothing","everything","something"],"correct_index":0},"audio":"audio/anything.mp3","audio_ex0":"audio/anything_ex0.mp3","audio_ex1":"audio/anything_ex1.mp3","img1":"images/anything_1.png","img2":"images/anything_2.png"},{"word":"dish","ipa":"/dɪʃ/","image_prompts":["A stack of clean white ceramic dishes on a kitchen counter, soft lighting","A colorful ceramic dish filled with a variety of fresh fruits, overhead shot"],"image_desc_en":"A stack of clean dishes and a fruit-filled dish.","image_desc_cn":"一摞干净的盘子和一个装满水果的盘子。","meaning_cn":"n. 盘子；菜肴","usage":"n. (复数 dishes)；v. (过去式 dished, 过去分词 dished)","collocations":"wash the dishes, a delicious dish","preposition_combos":"dish of","examples":[{"en":"This dish is very delicious, and I want to learn how to cook it.","cn":"这道菜非常美味，我想学习如何烹饪它。"},{"en":"After dinner, I helped my mom wash the dishes in the kitchen.","cn":"晚饭后，我帮妈妈在厨房洗盘子。"}],"socratic_questions":[{"question":"吃完饭后，我们需要清洗什么东西来保持厨房的整洁？","answer_hint":"通常是用来盛放食物的器皿。"}],"fill_blank":{"sentences":["She ordered a vegetarian ___ at the restaurant because she doesn't eat meat."],"options":["dish","plate","bowl","cup"],"correct_index":0},"audio":"audio/dish.mp3","audio_ex0":"audio/dish_ex0.mp3","audio_ex1":"audio/dish_ex1.mp3","img1":"images/dish_1.png","img2":"images/dish_2.png"},{"word":"choice","ipa":"/tʃɔɪs/","image_prompts":["A menu with several dishes listed, each with a checkbox next to it","A road diverging into three different paths, each leading to a distinct landscape"],"image_desc_en":"A selection from multiple options.","image_desc_cn":"从多个选项中进行选择。","meaning_cn":"n. 选择，选择权；选择的东西","usage":"n. (复数 choices)","collocations":"make a choice, have no choice, a wide choice","preposition_combos":"choice between, choice of","examples":[{"en":"I had no choice but to accept their offer at last.","cn":"我最终别无选择，只能接受他们的提议。"},{"en":"The shop offers a wide choice of ice cream flavors today.","cn":"这家商店今天提供了多种冰淇淋口味的选择。"}],"socratic_questions":[{"question":"如果你面对多个方案，需要从中选取一个，你会做什么？","answer_hint":"这个过程涉及在不同可能性之间做出决定。"}],"fill_blank":{"sentences":["Making a healthy ___ is important for your overall well-being."],"options":["choice","choose","chose","chosen"],"correct_index":0},"audio":"audio/choice.mp3","audio_ex0":"audio/choice_ex0.mp3","audio_ex1":"audio/choice_ex1.mp3","img1":"images/choice_1.png","img2":"images/choice_2.png"},{"word":"meal","ipa":"/miːl/","image_prompts":["A beautifully arranged dining table with various dishes, silverware, and glasses, soft lighting","A close-up shot of a plate filled with a colorful and nutritious assortment of food"],"image_desc_en":"A plate of food or a dining table set for a meal.","image_desc_cn":"一盘食物或一张摆好餐具的餐桌，准备用餐。","meaning_cn":"餐，一餐饭","usage":"n.","collocations":"have a meal, prepare a meal, balanced meal","preposition_combos":"at a meal, for a meal","examples":[{"en":"We always have a big meal together on Spring Festival.","cn":"我们总是在春节一起吃一顿丰盛的饭。"},{"en":"She prepared a simple meal of soup and bread for us.","cn":"她为我们准备了一顿简单的饭，有汤和面包。"}],"socratic_questions":[{"question":"你一天中通常会吃几次饭？","answer_hint":"考虑一天中进食的不同时段，以及每次进食的食物种类。"}],"fill_blank":{"sentences":["He skipped his lunch ___ because he was too busy with work."],"options":["meal","snack","drink","dessert"],"correct_index":0},"audio":"audio/meal.mp3","audio_ex0":"audio/meal_ex0.mp3","audio_ex1":"audio/meal_ex1.mp3","img1":"images/meal_1.png","img2":"images/meal_2.png"},{"word":"pork","ipa":"/pɔːrk/","image_prompts":["A roasted pork loin on a wooden cutting board, herbs sprinkled around","Several uncooked pork chops arranged on butcher paper, ready to be seasoned"],"image_desc_en":"Images depicting pork meat, both cooked and uncooked.","image_desc_cn":"描绘猪肉的图片，包括熟的和未熟的。","meaning_cn":"猪肉","usage":"n. 猪肉","collocations":"roast pork, pork chop, pork belly","preposition_combos":"pork with, pork in","examples":[{"en":"I prefer chicken to pork because it is healthier for me.","cn":"我更喜欢鸡肉而不是猪肉，因为它对我来说更健康。"},{"en":"She cooked a delicious meal with rice and some slices of pork.","cn":"她用米饭和一些猪肉片做了一顿美味的饭。"}],"socratic_questions":[{"question":"如果想吃红烧肉，我们需要买什么肉？","answer_hint":"红烧肉的主要成分是某种动物的肉。"}],"fill_blank":{"sentences":["He ordered a dish of sweet and sour ___ at the restaurant."],"options":["pork","beef","lamb","fish"],"correct_index":0},"audio":"audio/pork.mp3","audio_ex0":"audio/pork_ex0.mp3","audio_ex1":"audio/pork_ex1.mp3","img1":"images/pork_1.png","img2":"images/pork_2.png"},{"word":"strawberry","ipa":"/ˈstrɔːberi/","image_prompts":["A close-up of a ripe, red strawberry with tiny seeds visible on its surface","A basket filled with fresh strawberries, green leaves still attached, on a wooden table"],"image_desc_en":"Images depicting a ripe strawberry and a basket of strawberries.","image_desc_cn":"描绘成熟草莓和一篮草莓的图像。","meaning_cn":"草莓","usage":"n. (复数 strawberries)","collocations":"fresh strawberry, strawberry jam, strawberry flavor","preposition_combos":"with strawberry, of strawberry","examples":[{"en":"I love to eat fresh strawberry with milk in the morning.","cn":"我喜欢早上吃新鲜的草莓加牛奶。"},{"en":"She made a delicious strawberry cake for her friend's birthday party.","cn":"她为她朋友的生日聚会做了一个美味的草莓蛋糕。"}],"socratic_questions":[{"question":"什么红色的小水果，表面有很多小点点，味道甜甜的，经常用来做蛋糕？","answer_hint":"它是一种常见的水果，通常是红色的，并且可以生吃。"}],"fill_blank":{"sentences":["She added some sliced ___ to her yogurt for a healthy snack."],"options":["strawberry","blueberry","banana","orange"],"correct_index":0},"audio":"audio/strawberry.mp3","audio_ex0":"audio/strawberry_ex0.mp3","audio_ex1":"audio/strawberry_ex1.mp3","img1":"images/strawberry_1.png","img2":"images/strawberry_2.png"},{"word":"menu","ipa":"/ˈmenjuː/","image_prompts":["A neatly designed restaurant menu with various food and drink options listed, soft lighting","A digital tablet displaying a restaurant's menu with high-quality images of the dishes"],"image_desc_en":"A restaurant menu displaying food options.","image_desc_cn":"展示食物选项的餐厅菜单。","meaning_cn":"菜单","usage":"n. (复数 menus)","collocations":"order from the menu, read the menu, a varied menu","preposition_combos":"on the menu","examples":[{"en":"The restaurant has a new menu with many delicious dishes.","cn":"这家餐厅有新的菜单，上面有很多美味的菜肴。"},{"en":"I can't decide what to order; the menu is so long!","cn":"我决定不了点什么，菜单太长了！"}],"socratic_questions":[{"question":"你去餐厅吃饭，需要看什么才能知道有什么菜可以点？","answer_hint":"上面列出了所有菜品和价格，帮助你选择。"}],"fill_blank":{"sentences":["Can I see the ___ before I decide what to order, please?"],"options":["menu","bill","recipe","list"],"correct_index":0},"audio":"audio/menu.mp3","audio_ex0":"audio/menu_ex0.mp3","audio_ex1":"audio/menu_ex1.mp3","img2":"images/menu_2.png","img1":"images/menu_1.png"},{"word":"customer","ipa":"/ˈkʌstəmər/","image_prompts":["A shopping cart filled with groceries, a receipt lying on top","A line of people waiting at a checkout counter in a supermarket"],"image_desc_en":"A shopping cart and a checkout line.","image_desc_cn":"购物车和结账队伍。","meaning_cn":"顾客，客户","usage":"n.","collocations":"satisfied customer, loyal customer, potential customer","preposition_combos":"customer of","examples":[{"en":"The shop assistant helped a customer find the right size.","cn":"店员帮助一位顾客找到了合适的尺码。"},{"en":"Good service is important to keep every customer happy.","cn":"良好的服务对于保持每位顾客的满意度非常重要。"}],"socratic_questions":[{"question":"你去商店买东西，谁会为你提供服务？","answer_hint":"是购买商品或服务的人。"}],"fill_blank":{"sentences":["The restaurant always tries to provide excellent service to every ___."],"options":["customer","seller","manager","worker"],"correct_index":0},"audio":"audio/customer.mp3","audio_ex0":"audio/customer_ex0.mp3","audio_ex1":"audio/customer_ex1.mp3","img1":"images/customer_1.png","img2":"images/customer_2.png"},{"word":"serve","ipa":"/sɜːrv/","image_prompts":["A tennis ball being hit with a racket during a serve, motion blur","A waiter carrying a tray with food and drinks in a restaurant, blurred background"],"image_desc_en":"Illustrations depicting the act of serving in tennis and in a restaurant.","image_desc_cn":"展示网球运动中的发球动作和餐厅服务员上菜的场景。","meaning_cn":"v. 服务；发球","usage":"v. (served, served)","collocations":"serve food; serve customers; serve as","preposition_combos":"serve with; serve for","examples":[{"en":"I will serve food at the party, and you can help me.","cn":"我将在聚会上提供食物，你可以帮助我。"},{"en":"She can serve the ball very well during the tennis match.","cn":"在网球比赛中，她能很好地发球。"}],"socratic_questions":[{"question":"在餐厅里，工作人员会做什么来满足顾客的需求？在网球比赛开始时，运动员需要做什么？","answer_hint":"这两个场景都需要提供某种帮助或开始一个动作。"}],"fill_blank":{"sentences":["The waiter will ___ us our drinks and appetizers soon."],"options":["serve","eat","cook","order"],"correct_index":0},"audio":"audio/serve.mp3","audio_ex0":"audio/serve_ex0.mp3","audio_ex1":"audio/serve_ex1.mp3","img1":"images/serve_1.png","img2":"images/serve_2.png"},{"word":"waitress","ipa":"/ˈweɪtrəs/","image_prompts":["A person's hand holding a notepad and pen, ready to take an order in a restaurant","A tray with various drinks and snacks on it, ready to be served in a cafe"],"image_desc_en":"Illustrations depicting order taking and serving in a restaurant.","image_desc_cn":"描绘在餐厅中点餐和服务的插图。","meaning_cn":"女服务员","usage":"n. (复数 waitresses)","collocations":"friendly waitress, experienced waitress","preposition_combos":"waitress at/in","examples":[{"en":"The waitress brought us the menu as soon as we sat down.","cn":"我们一坐下，女服务员就给我们拿来了菜单。"},{"en":"Our waitress was very kind and helpful during the whole meal.","cn":"用餐期间，我们的女服务员非常友善和乐于助人。"}],"socratic_questions":[{"question":"在餐厅里，谁会为你点餐并上菜？","answer_hint":"这个人在餐厅工作，专门负责为顾客提供服务。"}],"fill_blank":{"sentences":["The ___ smiled as she poured coffee into my cup this morning."],"options":["waitress","waiter","chef","customer"],"correct_index":0},"audio":"audio/waitress.mp3","audio_ex0":"audio/waitress_ex0.mp3","audio_ex1":"audio/waitress_ex1.mp3","img1":"images/waitress_1.png","img2":"images/waitress_2.png"},{"word":"sir","ipa":"/sɜːr/","image_prompts":["A formal letter addressed to 'Sir' with a wax seal","A vintage top hat and monocle displayed on a velvet cushion"],"image_desc_en":"Images depicting formality and respect, associated with the term 'Sir'.","image_desc_cn":"图片描绘了与“Sir”一词相关的正式和尊敬的场景。","meaning_cn":"先生；阁下（用于尊称）","usage":"n. (复数 sirs)","collocations":"Yes, sir; No, sir; Dear sir","preposition_combos":"to sir","examples":[{"en":"Yes, sir, I will complete the assignment before the deadline.","cn":"是的，先生，我会在截止日期前完成作业。"},{"en":"Excuse me, sir, could you please tell me the way to library?","cn":"打扰一下，先生，请问您能告诉我图书馆怎么走吗？"}],"socratic_questions":[{"question":"当你需要礼貌地称呼一位男士，尤其是在正式场合，你会怎么称呼他？","answer_hint":"这个称呼表达了尊重和礼貌。"}],"fill_blank":{"sentences":["The student answered, \"Yes, ___,\" to the teacher's question politely."],"options":["sir","madam","miss","teacher"],"correct_index":0},"audio":"audio/sir.mp3","audio_ex0":"audio/sir_ex0.mp3","audio_ex1":"audio/sir_ex1.mp3","img1":"images/sir_1.png","img2":"images/sir_2.png"},{"word":"go with","ipa":"/ɡoʊ wɪθ/","image_prompts":["A red tie paired with a blue suit, fashion coordination","A slice of pizza next to a glass of cola on a checkered tablecloth"],"image_desc_en":"Matching items or flavors that complement each other.","image_desc_cn":"互相搭配、互补的物品或口味。","meaning_cn":"搭配；与...相配；赞同","usage":"v. 搭配, 赞同","collocations":"go well with, go along with","preposition_combos":"go with sb, go with sth","examples":[{"en":"This blue shirt will go well with your new grey pants.","cn":"这件蓝色衬衫会和你的新灰色裤子很搭。"},{"en":"I don't go with that idea; it seems too risky to me.","cn":"我不赞同那个想法；对我来说它似乎太冒险了。"}],"socratic_questions":[{"question":"如果你要选择一件上衣来配你的新裙子，你会考虑什么？","answer_hint":"考虑颜色、款式是否协调，即是否“搭配”。"}],"fill_blank":{"sentences":["Does this scarf ___ my coat, or should I choose another one?"],"options":["go with","go to","go by","go for"],"correct_index":0},"audio":"audio/go_with.mp3","audio_ex0":"audio/go_with_ex0.mp3","audio_ex1":"audio/go_with_ex1.mp3","img1":"images/go_with_1.png","img2":"images/go_with_2.png"},{"word":"instead","ipa":"/ɪnˈsted/","image_prompts":["A red apple on a wooden table, with a pear blurred in the background, suggesting a choice","A sign pointing to a hiking trail, with another trail overgrown and less visible"],"image_desc_en":"Representing a choice or alternative.","image_desc_cn":"代表一种选择或替代。","meaning_cn":"代替，而不是","usage":"adv.","collocations":"instead of","preposition_combos":"of","examples":[{"en":"I wanted tea, but I had coffee instead this morning.","cn":"我想要茶，但今天早上我喝了咖啡代替。"},{"en":"She stayed home instead of going to the school trip.","cn":"她待在家里，而不是去参加学校旅行。"}],"socratic_questions":[{"question":"如果你原本计划做A，但后来做了B，你会用哪个词来表达“不做A，而做B”？","answer_hint":"这个词表示放弃原计划，选择另一个选项。"}],"fill_blank":{"sentences":["He used a pen ___ of a pencil to finish his test."],"options":["instead","beside","beyond","without"],"correct_index":0},"audio":"audio/instead.mp3","audio_ex0":"audio/instead_ex0.mp3","audio_ex1":"audio/instead_ex1.mp3","img2":"images/instead_2.png","img1":"images/instead_1.png"},{"word":"pear","ipa":"/peər/","image_prompts":["A still life photograph of a ripe pear on a wooden table, soft lighting","A close-up shot of a pear tree branch laden with green pears, sunny day"],"image_desc_en":"A ripe pear and a pear tree branch with pears.","image_desc_cn":"一个成熟的梨和一个结满梨的梨树枝。","meaning_cn":"梨","usage":"n. (复数 pears)","collocations":"eat a pear, pear tree, pear juice","preposition_combos":"of pear","examples":[{"en":"I like to eat a fresh pear after my lunch.","cn":"我喜欢午饭后吃一个新鲜的梨。"},{"en":"She brought a basket of pears to the school picnic.","cn":"她带了一篮梨去学校野餐。"}],"socratic_questions":[{"question":"什么水果通常是绿色或黄色，形状像灯泡，味道甜美？","answer_hint":"这是一种常见的水果，可以生吃或用于制作甜点。"}],"fill_blank":{"sentences":["She peeled the ___ and offered it to her friend."],"options":["pear","apple","banana","orange"],"correct_index":0},"audio":"audio/pear.mp3","audio_ex0":"audio/pear_ex0.mp3","audio_ex1":"audio/pear_ex1.mp3","img1":"images/pear_1.png","img2":"images/pear_2.png"},{"word":"too much","ipa":"/tuː mʌtʃ/","image_prompts":["A overflowing plate of food, with utensils struggling to contain the excess","A digital scale displaying a weight far beyond its maximum capacity, error message flashing"],"image_desc_en":"Illustrations showing excessive amounts or quantities.","image_desc_cn":"展示过量的物品或数量的插图。","meaning_cn":"太多，过量","usage":"adv. 表示超过需要的量或程度。","collocations":"too much sugar, too much noise, too much work","preposition_combos":"too much of","examples":[{"en":"I think I ate too much at the party last night.","cn":"我觉得我昨晚在聚会上吃得太多了。"},{"en":"There is too much traffic on the road during rush hour.","cn":"高峰时段路上交通太拥堵了。"}],"socratic_questions":[{"question":"当你感到非常饱，甚至不舒服时，你会怎么描述你吃的量？","answer_hint":"描述超过了你需要的食物量。"}],"fill_blank":{"sentences":["He spends ___ time playing video games instead of studying."],"options":["too much","much too","a lot","very much"],"correct_index":0},"audio":"audio/too_much.mp3","audio_ex0":"audio/too_much_ex0.mp3","audio_ex1":"audio/too_much_ex1.mp3","img1":"images/too_much_1.png","img2":"images/too_much_2.png"},{"word":"sugar","ipa":"/ˈʃʊɡər/","image_prompts":["A pile of white granulated sugar spilling onto a dark wooden surface","Close-up of sugar crystals sparkling under bright light, macro photography"],"image_desc_en":"Images depicting granulated sugar and sugar crystals.","image_desc_cn":"描绘砂糖和糖晶体的图像。","meaning_cn":"糖","usage":"n. 不可数名词","collocations":"add sugar, sugar content, sugar cane","preposition_combos":"sugar in","examples":[{"en":"Too much sugar is not good for your teeth and health.","cn":"太多的糖对你的牙齿和健康不好。"},{"en":"Could you pass me the sugar, please? I need it for my coffee.","cn":"请你把糖递给我好吗？我咖啡里需要加糖。"}],"socratic_questions":[{"question":"什么东西是甜的，可以加在咖啡或茶里？","answer_hint":"它是一种白色或棕色的晶体，能增加食物的甜度。"}],"fill_blank":{"sentences":["I like to add a little ___ to my tea to make it sweeter."],"options":["sugar","salt","pepper","spice"],"correct_index":0},"audio":"audio/sugar.mp3","audio_ex0":"audio/sugar_ex0.mp3","audio_ex1":"audio/sugar_ex1.mp3","img1":"images/sugar_1.png","img2":"images/sugar_2.png"},{"word":"improve","ipa":"/ɪmˈpruːv/","image_prompts":["A before-and-after picture showing a messy room becoming tidy and organized","A graph showing an upward trend, indicating progress and growth"],"image_desc_en":"Before-and-after room; upward trending graph.","image_desc_cn":"整理前后的房间；上升趋势的图表。","meaning_cn":"提高，改进","usage":"v. (improved, improved); n. improvement","collocations":"improve skills, improve performance, improve quality","preposition_combos":"improve on, improve in","examples":[{"en":"We should improve our study habits to get better grades.","cn":"我们应该改进学习习惯以取得更好的成绩。"},{"en":"Regular exercise can improve your health and make you stronger.","cn":"有规律的锻炼可以改善你的健康，让你更强壮。"}],"socratic_questions":[{"question":"如果你想让某件事变得更好，你会怎么做？","answer_hint":"这个词表示使某事物变得更好或更有效率。"}],"fill_blank":{"sentences":["To ___ your English, you need to practice speaking every day."],"options":["improve","avoid","ignore","refuse"],"correct_index":0},"audio":"audio/improve.mp3","audio_ex0":"audio/improve_ex0.mp3","audio_ex1":"audio/improve_ex1.mp3","img2":"images/improve_2.png","img1":"images/improve_1.png"},{"word":"habit","ipa":"/ˈhæbɪt/","image_prompts":["A well-worn path through a grassy field, indicating a repeated route","A stack of books on a desk, each labeled with a day of the week, symbolizing a study routine"],"image_desc_en":"A path showing repeated use and books representing a routine.","image_desc_cn":"一条显示重复使用的路径和代表例行程序的书籍。","meaning_cn":"习惯","usage":"n.","collocations":"good habit, bad habit, form a habit, break a habit","preposition_combos":"habit of (doing something)","examples":[{"en":"Reading before bed is a good habit to develop early.","cn":"睡前阅读是一个应该尽早养成的良好习惯。"},{"en":"He has a habit of biting his nails when he's nervous.","cn":"他有一个紧张时咬指甲的习惯。"}],"socratic_questions":[{"question":"你每天早上做的第一件事是什么？这种行为经常重复吗？","answer_hint":"这个行为是每天重复的，并且已经成为你生活的一部分。"}],"fill_blank":{"sentences":["She has a ___ of always arriving late for meetings."],"options":["habit","hobby","talent","skill"],"correct_index":0},"audio":"audio/habit.mp3","audio_ex0":"audio/habit_ex0.mp3","audio_ex1":"audio/habit_ex1.mp3","img1":"images/habit_1.png","img2":"images/habit_2.png"},{"word":"fast food","ipa":"/ˌfæst ˈfuːd/","image_prompts":["A stack of greasy burgers and fries on a checkered tablecloth","A variety of colorful, processed snacks arranged on a conveyor belt"],"image_desc_en":"Images depicting unhealthy, quickly prepared meals and snacks.","image_desc_cn":"描绘不健康的、快速准备的餐食和零食的图像。","meaning_cn":"快餐","usage":"n. (不可数名词)","collocations":"eat fast food, avoid fast food, fast food restaurant","preposition_combos":"fast food from","examples":[{"en":"Eating too much fast food is bad for your health.","cn":"吃太多快餐对你的健康有害。"},{"en":"I try to avoid fast food because it's usually unhealthy.","cn":"我尽量避免快餐，因为它通常不健康。"}],"socratic_questions":[{"question":"如果你想快速获得食物，但又不想自己做饭，你会选择什么？","answer_hint":"这种食物通常很快就能做好，而且在很多地方都能买到。"}],"fill_blank":{"sentences":["He eats ___ almost every day after school."],"options":["fast food","healthy food","fresh fruit","home cooking"],"correct_index":0},"audio":"audio/fast_food.mp3","audio_ex0":"audio/fast_food_ex0.mp3","audio_ex1":"audio/fast_food_ex1.mp3","img1":"images/fast_food_1.png","img2":"images/fast_food_2.png"},{"word":"salt","ipa":"/sɔːlt/","image_prompts":["A pile of coarse sea salt crystals on a dark wooden surface, macro photography","Salt shaker pouring salt onto a freshly cooked tomato, steam rising"],"image_desc_en":"A pile of salt crystals and salt being poured on a tomato.","image_desc_cn":"一堆盐晶体和盐被倒在番茄上。","meaning_cn":"盐","usage":"n. / v. (过去式 salted, 过去分词 salted)","collocations":"sea salt, table salt, add salt, salt water","preposition_combos":"with salt, in salt","examples":[{"en":"Please pass me the salt; this soup needs more flavor.","cn":"请把盐递给我，这汤需要更多的味道。"},{"en":"They salt the roads in winter to prevent ice from forming.","cn":"他们在冬天往路上撒盐，以防止结冰。"}],"socratic_questions":[{"question":"如果你想让食物更有味道，你会加什么白色的晶体？","answer_hint":"这种白色晶体可以调味，让食物更咸。"}],"fill_blank":{"sentences":["She added a pinch of ___ to the boiling water for the pasta."],"options":["salt","sugar","pepper","flour"],"correct_index":0},"audio":"audio/salt.mp3","audio_ex0":"audio/salt_ex0.mp3","audio_ex1":"audio/salt_ex1.mp3","img1":"images/salt_1.png","img2":"images/salt_2.png"},{"word":"fat","ipa":"/fæt/","image_prompts":["A golden retriever dog with a slightly rounded belly, lying on a checkered blanket","A jar of cooking oil with visible layers of solidified fat, cool temperature"],"image_desc_en":"Illustrations depicting a plump dog and solidified cooking oil.","image_desc_cn":"描绘了一只肥胖的狗和凝固的食用油的插图。","meaning_cn":"adj. 肥胖的；脂肪的；n. 脂肪","usage":"adj. 肥胖的，脂肪的; n. 脂肪","collocations":"fat chance, fat content, fat tissue","preposition_combos":"fat on","examples":[{"en":"My cat is a little fat because it eats too much.","cn":"我的猫有点胖，因为它吃得太多了。"},{"en":"This cake is very fat, so I can't eat too much.","cn":"这块蛋糕脂肪含量很高，所以我不能吃太多。"}],"socratic_questions":[{"question":"如果你看到一个人或者动物，体型比较圆润，你会用什么词来形容？","answer_hint":"描述体型，与瘦相反。"}],"fill_blank":{"sentences":["The doctor told him to eat less ___ to stay healthy."],"options":["fat","salt","sugar","protein"],"correct_index":0},"audio":"audio/fat.mp3","audio_ex0":"audio/fat_ex0.mp3","audio_ex1":"audio/fat_ex1.mp3","img2":"images/fat_2.png","img1":"images/fat_1.png"},{"word":"put on","ipa":"/pʊt ɒn/","image_prompts":["A coat hanging on a hook, a hand reaching to grab it","A pair of shoes neatly placed on a doormat, ready to be worn"],"image_desc_en":"A coat being put on, shoes ready to be worn.","image_desc_cn":"穿上外套，准备穿的鞋子。","meaning_cn":"穿上；戴上；上演；增加（体重）","usage":"v. (过去式 put, 过去分词 put) to dress oneself in something; to apply something to your skin; to stage a performance; to gain weight","collocations":"put on clothes, put on weight, put on a show, put on makeup","preposition_combos":"put on (a hat), put on (a play)","examples":[{"en":"I always put on my coat before going outside in winter.","cn":"冬天出门前我总是穿上我的外套。"},{"en":"She will put on a play for us at the school party.","cn":"她将在学校聚会上为我们上演一出戏。"}],"socratic_questions":[{"question":"天气冷了，你要做什么来保暖？或者，剧院里正在做什么？","answer_hint":"需要穿衣服或增加衣物，或者表演节目。"}],"fill_blank":{"sentences":["He likes to ___ his new shoes when he goes to school."],"options":["put on","take off","look at","try on"],"correct_index":0},"audio":"audio/put_on.mp3","audio_ex0":"audio/put_on_ex0.mp3","audio_ex1":"audio/put_on_ex1.mp3","img1":"images/put_on_1.png","img2":"images/put_on_2.png"},{"word":"weight","ipa":"/weɪt/","image_prompts":["A set of iron dumbbells on a gym floor, sweat droplets visible","A digital scale displaying a numerical value, isolated on white"],"image_desc_en":"Visuals representing heaviness and measurement of mass.","image_desc_cn":"代表重量和质量测量的视觉效果。","meaning_cn":"重量，分量","usage":"n. 动词 v. (过去式 weighted, 过去分词 weighted)","collocations":"lose weight, gain weight, heavy weight, light weight","preposition_combos":"under the weight of","examples":[{"en":"The weight of her backpack made her shoulders ache after school.","cn":"她背包的重量使她的肩膀放学后感到疼痛。"},{"en":"He wanted to lose weight before the summer vacation started.","cn":"他想在暑假开始前减肥。"}],"socratic_questions":[{"question":"当你搬起一个箱子，感觉它很沉，你在感受它的什么？","answer_hint":"描述的是箱子本身的沉重程度。"}],"fill_blank":{"sentences":["The doctor advised him to control his ___ by eating healthy food."],"options":["weight","height","speed","temperature"],"correct_index":0},"audio":"audio/weight.mp3","audio_ex0":"audio/weight_ex0.mp3","audio_ex1":"audio/weight_ex1.mp3","img1":"images/weight_1.png","img2":"images/weight_2.png"},{"word":"hamburger","ipa":"/ˈhæmbɜːrɡər/","image_prompts":["A close-up shot of a juicy hamburger with melted cheese and fresh toppings","A stack of hamburgers wrapped in paper on a checkered picnic blanket"],"image_desc_en":"A hamburger is a sandwich consisting of a cooked patty of ground meat, usually beef, placed inside a sliced bread roll or bun.","image_desc_cn":"汉堡包是一种由煮熟的碎肉馅饼（通常是牛肉）制成的三明治，放在切片的面包卷或小圆面包中。","meaning_cn":"汉堡包","usage":"n.","collocations":"order a hamburger, eat a hamburger, a beef hamburger","preposition_combos":"hamburger with","examples":[{"en":"I usually order a hamburger with fries when I eat out.","cn":"我通常在外面吃饭时点一份汉堡包和薯条。"},{"en":"She made a delicious hamburger for lunch with fresh tomatoes.","cn":"她用新鲜的西红柿做了一个美味的汉堡包当午餐。"}],"socratic_questions":[{"question":"如果你想吃一种夹着肉饼的面包，你会选择什么？","answer_hint":"这是一种常见的快餐，通常搭配薯条和饮料。"}],"fill_blank":{"sentences":["He ordered a ___ and a soda at the fast food restaurant."],"options":["hamburger","sandwich","pizza","salad"],"correct_index":0},"audio":"audio/hamburger.mp3","audio_ex0":"audio/hamburger_ex0.mp3","audio_ex1":"audio/hamburger_ex1.mp3","img1":"images/hamburger_1.png","img2":"images/hamburger_2.png"},{"word":"cause","ipa":"/kɔːz/","image_prompts":["A domino effect with the first domino falling and causing the others to fall","A cracked dam with water gushing out, indicating the cause of the flood"],"image_desc_en":"Domino effect and a cracked dam.","image_desc_cn":"多米诺骨牌效应和一个破裂的水坝。","meaning_cn":"导致，引起；原因","usage":"v. (caused, caused)；n.","collocations":"cause damage, cause trouble, main cause, direct cause","preposition_combos":"cause of","examples":[{"en":"Smoking can cause serious health problems, so you should quit it.","cn":"吸烟会导致严重的健康问题，所以你应该戒烟。"},{"en":"The heavy rain caused the river to flood the nearby town.","cn":"大雨导致河流淹没了附近的城镇。"}],"socratic_questions":[{"question":"如果一个事件是另一个事件发生的原因，我们用什么词来描述这种关系？","answer_hint":"这个词既可以作动词，表示“导致”，也可以作名词，表示“原因”。"}],"fill_blank":{"sentences":["What was the main ___ of the car accident on the highway?"],"options":["cause","reason","result","effect"],"correct_index":0},"audio":"audio/cause.mp3","audio_ex0":"audio/cause_ex0.mp3","audio_ex1":"audio/cause_ex1.mp3","img1":"images/cause_1.png","img2":"images/cause_2.png"},{"word":"heart","ipa":"/hɑːrt/","image_prompts":["A anatomical heart model on a white background, detailed texture","A heart-shaped chocolate box with assorted chocolates inside, top-down view"],"image_desc_en":"Images representing the anatomical heart and a heart-shaped chocolate box.","image_desc_cn":"图片分别代表解剖学上的心脏和一个心形巧克力盒。","meaning_cn":"n. 心脏；内心；感情","usage":"n. (复数 hearts)","collocations":"break one's heart, by heart, close to one's heart","preposition_combos":"in one's heart, with all one's heart","examples":[{"en":"She has a kind heart and always helps others in need.","cn":"她有一颗善良的心，总是帮助需要帮助的人。"},{"en":"He learned the poem by heart for the school performance.","cn":"他用心记住了这首诗，为了学校的演出。"}],"socratic_questions":[{"question":"当你非常喜欢某人或某事时，你会用哪个身体器官来形容你的感受？","answer_hint":"这个器官通常被认为是情感的中心。"}],"fill_blank":{"sentences":["He wears his ___ on his sleeve, always showing his emotions."],"options":["heart","head","hand","foot"],"correct_index":0},"audio":"audio/heart.mp3","audio_ex0":"audio/heart_ex0.mp3","audio_ex1":"audio/heart_ex1.mp3","img2":"images/heart_2.png"},{"word":"balanced","ipa":"/ˈbælənst/","image_prompts":["A stack of smooth stones carefully balanced on top of each other, zen garden","A scale with equal weights on both sides, perfectly level, equilibrium"],"image_desc_en":"A stack of balanced stones and a balanced scale.","image_desc_cn":"平衡的石头堆和平衡的秤。","meaning_cn":"adj. 平衡的；均衡的","usage":"adj.","collocations":"well-balanced, balanced diet, balanced lifestyle","preposition_combos":"balanced on","examples":[{"en":"A balanced diet is important for students' health and academic performance.","cn":"均衡的饮食对学生的健康和学习成绩很重要。"},{"en":"The teacher gave a balanced view of the issue during the debate.","cn":"老师在辩论中对这个问题给出了平衡的看法。"}],"socratic_questions":[{"question":"描述一种状态，在这种状态下，天平的两端重量相等，或者一个人在晃动时没有摔倒。","answer_hint":"这种状态形容事物稳定，各方面力量均等。"}],"fill_blank":{"sentences":["She kept the book ___ on her head while walking across the room."],"options":["balanced","balance","balancing","to balance"],"correct_index":0},"audio":"audio/balanced.mp3","audio_ex0":"audio/balanced_ex0.mp3","audio_ex1":"audio/balanced_ex1.mp3","img1":"images/balanced_1.png","img2":"images/balanced_2.png"},{"word":"too","ipa":"/tuː/","image_prompts":["A plate overflowing with food, excessive portion size","A thermometer showing a very high temperature, extreme heat"],"image_desc_en":"An overflowing plate and a very high temperature thermometer.","image_desc_cn":"一个满溢的盘子和一个显示非常高温度的温度计。","meaning_cn":"也，太，非常","usage":"adv.","collocations":"too much, too many, too late, only too","preposition_combos":"too...for","examples":[{"en":"It's too hot to play outside during the summer holiday.","cn":"在暑假期间，天气太热了，不适合在外面玩。"},{"en":"I ate too much cake, and now I feel a little sick.","cn":"我吃了太多的蛋糕，现在感觉有点不舒服。"}],"socratic_questions":[{"question":"如果你想表达某件事超出正常或可接受的范围，你会用哪个词？","answer_hint":"这个词表示过量或附加。"}],"fill_blank":{"sentences":["This bag is ___ heavy for me to carry alone to school."],"options":["too","to","two","through"],"correct_index":0},"audio":"audio/too.mp3","audio_ex0":"audio/too_ex0.mp3","audio_ex1":"audio/too_ex1.mp3","img1":"images/too_1.png","img2":"images/too_2.png"},{"word":"sleepy","ipa":"/ˈsliːpi/","image_prompts":["A fluffy kitten yawning widely on a soft blanket, eyes half-closed","A digital clock displaying 3:00 AM with blurry numbers and a dark room in the background"],"image_desc_en":"A kitten yawning; a clock at 3 AM.","image_desc_cn":"打哈欠的小猫；凌晨三点的闹钟。","meaning_cn":"困倦的，想睡的","usage":"adj.","collocations":"feel sleepy, get sleepy, look sleepy","preposition_combos":"sleepy after, sleepy from","examples":[{"en":"I feel sleepy after studying for the English test all night.","cn":"我通宵复习英语考试后感到困倦。"},{"en":"The baby looks sleepy; it's time for her afternoon nap.","cn":"宝宝看起来很困；该睡午觉了。"}],"socratic_questions":[{"question":"当你需要睡觉或者很难保持清醒时，你会用哪个词来形容自己？","answer_hint":"这个词形容一种想睡觉的状态。"}],"fill_blank":{"sentences":["After the long hike, we all felt very ___ and went to bed early."],"options":["sleepy","energetic","excited","hungry"],"correct_index":0},"audio":"audio/sleepy.mp3","audio_ex0":"audio/sleepy_ex0.mp3","audio_ex1":"audio/sleepy_ex1.mp3","img1":"images/sleepy_1.png","img2":"images/sleepy_2.png"},{"word":"after all","ipa":"/ˌæftər ˈɔːl/","image_prompts":["A winding road leading to a distant mountain range under a clear sky, suggesting a journey's conclusion","A trophy displayed on a shelf, signifying achievement despite initial doubts"],"image_desc_en":"A scenic view and a trophy representing eventual success.","image_desc_cn":"风景和奖杯，代表最终的成功。","meaning_cn":"毕竟，终究","usage":"adv. 用于强调某事是最终的事实或结果","collocations":"not after all, after all is said and done","preposition_combos":"N/A","examples":[{"en":"I didn't get the job after all, but I learned a lot.","cn":"我最终没有得到那份工作，但我学到了很多。"},{"en":"She decided not to sell her house after all; she loves it.","cn":"她最终决定不卖她的房子；她很喜欢它。"}],"socratic_questions":[{"question":"你最初认为某事会发生，但最终结果却不同，你会用什么短语来表达这个转变？","answer_hint":"这个短语表示尽管有之前的预期，但实际情况有所不同。"}],"fill_blank":{"sentences":["I thought it would rain, but ___ the sun came out."],"options":["after all","therefore","however","instead"],"correct_index":0},"audio":"audio/after_all.mp3","audio_ex0":"audio/after_all_ex0.mp3","audio_ex1":"audio/after_all_ex1.mp3","img1":"images/after_all_1.png","img2":"images/after_all_2.png"},{"word":"away","ipa":"/əˈweɪ/","image_prompts":["A bird flying away from its nest, leaving a trail of feathers","A road sign pointing away from a city skyline, towards a mountain range"],"image_desc_en":"Images depicting movement or direction away from a place or object.","image_desc_cn":"描绘远离某个地点或物体的移动或方向的图像。","meaning_cn":"离开，远离","usage":"adv.","collocations":"go away, far away, put away, throw away","preposition_combos":"away from","examples":[{"en":"Please put your toys away after you finish playing with them.","cn":"玩完玩具后，请把它们收起来。"},{"en":"The loud music drove the neighbors away from their homes.","cn":"嘈杂的音乐把邻居们从家里赶走了。"}],"socratic_questions":[{"question":"如果你不想让某人靠近，你会怎么做？","answer_hint":"表示距离上的分离或方向上的离开。"}],"fill_blank":{"sentences":["She quickly walked ___ when she saw the dark clouds approaching."],"options":["away","around","near","towards"],"correct_index":0},"audio":"audio/away.mp3","audio_ex0":"audio/away_ex0.mp3","audio_ex1":"audio/away_ex1.mp3","img1":"images/away_1.png","img2":"images/away_2.png"},{"word":"poor","ipa":"/pʊr/","image_prompts":["A dilapidated house with broken windows and overgrown weeds","An empty wallet lying on a cracked sidewalk, fallen leaves scattered around"],"image_desc_en":"A dilapidated house and an empty wallet.","image_desc_cn":"一间破旧的房子和一个空钱包。","meaning_cn":"贫穷的，差的","usage":"adj. ","collocations":"poor health, poor quality, poor performance","preposition_combos":"poor in (缺乏)","examples":[{"en":"Many people in that area are too poor to buy food.","cn":"那个地区的很多人太穷了，买不起食物。"},{"en":"The student's poor performance on the test worried the teacher.","cn":"学生在考试中表现不佳，这让老师很担心。"}],"socratic_questions":[{"question":"如果你没有足够的钱来满足基本生活需求，你会用哪个词来形容你的经济状况？","answer_hint":"描述经济状况不好，缺乏资源。"}],"fill_blank":{"sentences":["The soil was so ___ that nothing would grow in the garden."],"options":["poor","rich","fertile","damp"],"correct_index":0},"audio":"audio/poor.mp3","audio_ex0":"audio/poor_ex0.mp3","audio_ex1":"audio/poor_ex1.mp3","img1":"images/poor_1.png","img2":"images/poor_2.png"},{"word":"result","ipa":"/rɪˈzʌlt/","image_prompts":["A graph showing an upward trend, indicating positive outcomes","A trophy on a table, symbolizing achievement and success"],"image_desc_en":"A graph showing an upward trend and a trophy on a table.","image_desc_cn":"一个显示上升趋势的图表和一个桌子上的奖杯。","meaning_cn":"结果，成果","usage":"n. v. (过去式 resulted, 过去分词 resulted)","collocations":"as a result, result in, good result, bad result","preposition_combos":"result of, result from","examples":[{"en":"The exam result will be announced next week, so be patient.","cn":"考试结果下周公布，请耐心等待。"},{"en":"Hard work will result in success if you never give up.","cn":"如果你永不放弃，努力工作将会带来成功。"}],"socratic_questions":[{"question":"经过努力学习后，你最想知道的是什么？","answer_hint":"你希望了解努力的最终体现。"}],"fill_blank":{"sentences":["The ___ of the experiment was surprising to all the scientists."],"options":["result","reason","cause","purpose"],"correct_index":0},"audio":"audio/result.mp3","audio_ex0":"audio/result_ex0.mp3","audio_ex1":"audio/result_ex1.mp3","img1":"images/result_1.png","img2":"images/result_2.png"},{"word":"article","ipa":"/ˈɑːrtɪkl/","image_prompts":["A newspaper page with a headline and several paragraphs of text.","A research paper with charts and graphs, lying on a desk."],"image_desc_en":"Illustrations depicting a newspaper article and a research paper.","image_desc_cn":"展示报纸文章和研究论文的插图。","meaning_cn":"文章，报道","usage":"n. (复数 articles)","collocations":"a news article, an online article, write an article","preposition_combos":"article about, article on","examples":[{"en":"I read an interesting article about space travel last week.","cn":"我上周读了一篇关于太空旅行的有趣文章。"},{"en":"She wrote an article for the school newspaper about sports.","cn":"她为学校报纸写了一篇关于体育运动的文章。"}],"socratic_questions":[{"question":"如果你在报纸或杂志上看到一段文字，通常称它为什么？","answer_hint":"通常指报纸或杂志上的一篇报道或评论。"}],"fill_blank":{"sentences":["He submitted an ___ to the journal about climate change effects."],"options":["article","novel","poem","story"],"correct_index":0},"audio":"audio/article.mp3","audio_ex0":"audio/article_ex0.mp3","audio_ex1":"audio/article_ex1.mp3","img1":"images/article_1.png","img2":"images/article_2.png"},{"word":"common","ipa":"/ˈkɒmən/","image_prompts":["A field of dandelions, a very widespread plant","A simple brick house in a suburban neighborhood, repeated design"],"image_desc_en":"Dandelions in a field; a typical suburban house.","image_desc_cn":"田野里的蒲公英；郊区一栋典型的房子。","meaning_cn":"常见的，普通的","usage":"adj.","collocations":"common knowledge, common sense, common mistake","preposition_combos":"common in/among","examples":[{"en":"It is common to see students wearing uniforms at school.","cn":"在学校里看到学生穿校服是很常见的。"},{"en":"Having hobbies in common helps build stronger friendships easily.","cn":"拥有共同的爱好有助于更容易地建立更牢固的友谊。"}],"socratic_questions":[{"question":"描述一种在你的学校里经常发生的事情。","answer_hint":"考虑那些每天都能看到或听到的事情。"}],"fill_blank":{"sentences":["It's ___ for people to feel nervous before an important exam."],"options":["common","rare","strange","unique"],"correct_index":0},"audio":"audio/common.mp3","audio_ex0":"audio/common_ex0.mp3","audio_ex1":"audio/common_ex1.mp3","img1":"images/common_1.png","img2":"images/common_2.png"},{"word":"among","ipa":"/əˈmʌŋ/","image_prompts":["A winding path through a dense forest, sunlight filtering through the trees","A collection of colorful pebbles scattered on a sandy beach, different sizes"],"image_desc_en":"A path through a forest; pebbles on a beach.","image_desc_cn":"穿过森林的小路；沙滩上的鹅卵石。","meaning_cn":"在...之中","usage":"prep. 表示在三个或更多的人或物之间","collocations":"among friends, among other things, live among","preposition_combos":"among + the/these/those + 名词","examples":[{"en":"The old house stands quietly among the tall, green trees.","cn":"那栋老房子静静地矗立在高大的绿树之中。"},{"en":"She felt safe and happy among her close friends at school.","cn":"在学校里，她和亲密的朋友们在一起感到安全和快乐。"}],"socratic_questions":[{"question":"如果有很多树，一栋房子在这些树的围绕下，我们可以怎么描述房子和树的关系？","answer_hint":"房子不是只有两棵树，而是被很多树包围着。"}],"fill_blank":{"sentences":["He is very popular ___ his classmates because he is helpful."],"options":["among","between","with","at"],"correct_index":0},"audio":"audio/among.mp3","audio_ex0":"audio/among_ex0.mp3","audio_ex1":"audio/among_ex1.mp3","img1":"images/among_1.png","img2":"images/among_2.png"},{"word":"soft","ipa":"/sɒft/","image_prompts":["A fluffy white cloud floating in a blue sky, diffused sunlight","A cashmere scarf draped over a wooden chair, gentle folds"],"image_desc_en":"Images depicting gentleness and lack of hardness.","image_desc_cn":"描绘温柔和不坚硬的图像。","meaning_cn":"adj. 柔软的；温柔的","usage":"adj. (softer, softest) ","collocations":"soft music, soft voice, soft drink","preposition_combos":"soft to the touch","examples":[{"en":"The pillow is very soft, making it comfortable to sleep on.","cn":"这个枕头非常柔软，睡在上面很舒服。"},{"en":"She has a soft voice, so it's hard to hear her.","cn":"她的声音很小，所以很难听到她说话。"}],"socratic_questions":[{"question":"当你触摸棉花糖或小猫的毛时，感觉如何？","answer_hint":"描述的是一种触感，与坚硬、粗糙相反。"}],"fill_blank":{"sentences":["The baby's skin is so ___ and delicate."],"options":["soft","rough","hard","tough"],"correct_index":0},"audio":"audio/soft.mp3","audio_ex0":"audio/soft_ex0.mp3","audio_ex1":"audio/soft_ex1.mp3","img1":"images/soft_1.png","img2":"images/soft_2.png"},{"word":"soft drink","ipa":"/ˌsɔːft ˈdrɪŋk/","image_prompts":["A variety of colorful, fizzy soft drinks in glass bottles on a picnic blanket","An ice-cold can of soda with condensation droplets, sitting on a table"],"image_desc_en":"Images of colorful soft drinks in bottles and a can of soda.","image_desc_cn":"瓶装的彩色软饮料和一罐苏打水的图像。","meaning_cn":"软饮料，不含酒精的饮料","usage":"n. (复数 soft drinks)","collocations":"order a soft drink, popular soft drink, different kinds of soft drinks","preposition_combos":"soft drink with ice, soft drink for lunch","examples":[{"en":"I usually order a soft drink when I eat fast food.","cn":"我通常在吃快餐时点一杯软饮料。"},{"en":"Many students like to have a soft drink during lunch break.","cn":"许多学生喜欢在午休时间喝一杯软饮料。"}],"socratic_questions":[{"question":"如果你想喝一种甜的、冰镇的、但不含酒精的饮料，你会选择什么？","answer_hint":"这种饮料通常是碳酸的，有多种口味。"}],"fill_blank":{"sentences":["She prefers a ___ to coffee in the afternoon."],"options":["soft drink","strong tea","hot milk","black coffee"],"correct_index":0},"audio":"audio/soft_drink.mp3","audio_ex0":"audio/soft_drink_ex0.mp3","audio_ex1":"audio/soft_drink_ex1.mp3","img1":"images/soft_drink_1.png","img2":"images/soft_drink_2.png"},{"word":"enough","ipa":"/ɪˈnʌf/","image_prompts":["A glass filled with water to the brim, but not overflowing","A plate with a sufficient amount of food, leaving no room for more"],"image_desc_en":"Sufficient quantity or amount.","image_desc_cn":"足够的数量或数额。","meaning_cn":"足够的，充分的","usage":"adj. / adv. / pron.","collocations":"enough money, enough time, enough food","preposition_combos":"enough for","examples":[{"en":"Is there enough time to finish the exam carefully, please?","cn":"请问有足够的时间仔细完成考试吗？"},{"en":"I think I have enough books for my long summer vacation.","cn":"我想我有足够的书来度过漫长的暑假。"}],"socratic_questions":[{"question":"如果你觉得你已经吃饱了，不能再吃任何东西了，你会说什么？","answer_hint":"表示数量或程度已经达到所需的水平。"}],"fill_blank":{"sentences":["Do you have ___ information to make a good decision on this matter?"],"options":["enough","few","many","less"],"correct_index":0},"audio":"audio/enough.mp3","audio_ex0":"audio/enough_ex0.mp3","audio_ex1":"audio/enough_ex1.mp3","img1":"images/enough_1.png","img2":"images/enough_2.png"},{"word":"thirsty","ipa":"/ˈθɜːrsti/","image_prompts":["A cracked, dry riverbed under a scorching sun, parched earth","A glass of water with condensation on a wooden table, sunlight shining through"],"image_desc_en":"Illustrations depicting the feeling of needing water.","image_desc_cn":"描绘需要喝水的感觉的插图。","meaning_cn":"口渴的","usage":"adj.","collocations":"feel thirsty, get thirsty, make someone thirsty","preposition_combos":"thirsty for (knowledge/adventure)","examples":[{"en":"After the long run, I felt very thirsty for water.","cn":"长跑之后，我感到非常口渴，想喝水。"},{"en":"The hot weather made everyone in the classroom thirsty.","cn":"炎热的天气让教室里的每个人都感到口渴。"}],"socratic_questions":[{"question":"当你运动完或者天气很热的时候，你最想做什么？","answer_hint":"这种情况下，身体会发出需要补充水分的信号。"}],"fill_blank":{"sentences":["After playing basketball, he was so ___ that he drank two bottles of water."],"options":["thirsty","hungry","sleepy","angry"],"correct_index":0},"audio":"audio/thirsty.mp3","audio_ex0":"audio/thirsty_ex0.mp3","audio_ex1":"audio/thirsty_ex1.mp3","img1":"images/thirsty_1.png","img2":"images/thirsty_2.png"},{"word":"Gongbao chicken","ipa":"/ˌɡɔŋˈbaʊ ˈtʃɪkɪn/","image_prompts":["A plate of Gongbao chicken with peanuts and chili peppers, viewed from above","Close-up of a single piece of Gongbao chicken with visible sauce and peanuts"],"image_desc_en":"A plate of Gongbao chicken, a popular Chinese dish.","image_desc_cn":"一份宫保鸡丁，一道受欢迎的中国菜。","meaning_cn":"宫保鸡丁","usage":"n. (不可数名词)","collocations":"order Gongbao chicken, eat Gongbao chicken, make Gongbao chicken","preposition_combos":"Gongbao chicken with peanuts, Gongbao chicken for dinner","examples":[{"en":"I often order Gongbao chicken when I eat at that restaurant.","cn":"我在那家餐馆吃饭时经常点宫保鸡丁。"},{"en":"My mom can make delicious Gongbao chicken for our family.","cn":"我妈妈可以为我们家做美味的宫保鸡丁。"}],"socratic_questions":[{"question":"如果你想点一道包含鸡肉、花生和辣椒的中国菜，你会选择什么？","answer_hint":"这道菜以其独特的风味和口感而闻名。"}],"fill_blank":{"sentences":["Let's have ___ for dinner tonight; it's my favorite dish."],"options":["Gongbao chicken","sweet and sour pork","Mapo tofu","dumplings"],"correct_index":0},"audio":"audio/Gongbao_chicken.mp3","audio_ex0":"audio/Gongbao_chicken_ex0.mp3","audio_ex1":"audio/Gongbao_chicken_ex1.mp3","img1":"images/Gongbao_chicken_1.png","img2":"images/Gongbao_chicken_2.png"},{"word":"America","ipa":"/əˈmerɪkə/","image_prompts":["A map highlighting the United States of America, with state borders clearly defined","The Statue of Liberty silhouetted against a vibrant sunset sky"],"image_desc_en":"A map of the USA and the Statue of Liberty.","image_desc_cn":"美国的地图和自由女神像。","meaning_cn":"美国","usage":"n.","collocations":"North America, South America, Central America, in America","preposition_combos":"in America, to America, from America","examples":[{"en":"My family plans to travel to America during the summer vacation.","cn":"我的家庭计划在暑假期间去美国旅行。"},{"en":"Many people from different countries immigrate to America each year.","cn":"每年都有许多来自不同国家的人移民到美国。"}],"socratic_questions":[{"question":"哪个国家拥有好莱坞和硅谷，并且以自由女神像而闻名？","answer_hint":"这个国家位于北美洲，是世界上的一个主要大国。"}],"fill_blank":{"sentences":["She dreams of studying in ___ and experiencing a different culture."],"options":["America","Europe","Asia","Africa"],"correct_index":0},"audio":"audio/America.mp3","audio_ex0":"audio/America_ex0.mp3","audio_ex1":"audio/America_ex1.mp3","img1":"images/America_1.png","img2":"images/America_2.png"},{"word":"Dongpo pork","ipa":"/dɔŋˈpoʊ pɔrk/","image_prompts":["A close-up shot of braised pork belly with a shiny, reddish-brown glaze, served on a white plate","A steaming bowl of rice topped with a thick slice of braised pork belly, chopsticks resting on the side"],"image_desc_en":"Braised pork belly, a famous Chinese dish.","image_desc_cn":"红烧肉，一道著名的中国菜。","meaning_cn":"东坡肉","usage":"n. (不可数名词)","collocations":"order Dongpo pork, taste Dongpo pork, famous Dongpo pork","preposition_combos":"Dongpo pork with rice, Dongpo pork for dinner","examples":[{"en":"I want to try the Dongpo pork in that Hangzhou restaurant.","cn":"我想尝尝那家杭州餐馆的东坡肉。"},{"en":"My mom makes delicious Dongpo pork for our family dinner.","cn":"我妈妈为我们的家庭晚餐做了美味的东坡肉。"}],"socratic_questions":[{"question":"如果你想品尝一道用猪肉制作，且以著名诗人命名的杭州特色菜，你会选择什么？","answer_hint":"这道菜色泽红亮，肥而不腻，相传是苏轼发明的。"}],"fill_blank":{"sentences":["We had ___ ___ at a local restaurant during our trip to Hangzhou."],"options":["Dongpo pork","Peking duck","Kung Pao chicken","Mapo tofu"],"correct_index":0},"audio":"audio/Dongpo_pork.mp3","audio_ex0":"audio/Dongpo_pork_ex0.mp3","audio_ex1":"audio/Dongpo_pork_ex1.mp3","img1":"images/Dongpo_pork_1.png","img2":"images/Dongpo_pork_2.png"}]}]};</script>

/* ═══════════════════════════════════════════════

}
function updateProgress() {

/* ═══════════════════════════════════════════════
   Unit 加载
═══════════════════════════════════════════════ */
async function selectUnit(n) {
  currentUnit = n; wordIndex = 0;
  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
}
async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {
  unitData = VOCAB_DATA ? (VOCAB_DATA.units||[]).find(u=>(u.unit||u)===n) : null;
  if (!unitData?.words?.length) { alert("该单元无单词数据"); throw new Error("no data"); }
  allWords = unitData.words.filter(w=>w.word&&!w.error);
  saveProgress();
}

/* ═══════════════════════════════════════════════
   学习流程：startWord / showCurrentWord
═══════════════════════════════════════════════ */
function startWord() {
  if (wordIndex >= allWords.length) { alert("🎉 本单元已全部完成！"); showPage("unit-select"); return; }
  const w = allWords[wordIndex];
  if (!w?.word) { wordIndex++; startWord(); return; }
  if (wordIndex > 0 && wordIndex % PER_REVIEW === 0) {
    reviewBatch = allWords.slice(wordIndex - PER_REVIEW, wordIndex).filter(w => !skippedWords.has(w.word));
    if (reviewBatch.length === 0) { showCurrentWord(); return; }
    reviewIdx = 0;
    startReview();
    return;
  }
  showCurrentWord();
}
function showCurrentWord() {
  updateProgress();
  wordStartTime = Date.now();
  const w = allWords[wordIndex];
  document.getElementById("p1-word").textContent = w.word;
  document.getElementById("p1-ipa").textContent  = w.ipa || "";
  document.getElementById("p1-score").style.display = "none";
  document.getElementById("p1-next").disabled = true;
  const prevBtn = document.getElementById("p1-prev");
  if (prevBtn) prevBtn.disabled = wordIndex <= 0;
  showPage("p1-pronounce");
  saveProgress();
}

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  if (w.audio) { new Audio(mediaUrl(w.audio)).play().catch(()=>{}); return; }
  synthesizer?.speakTextAsync(w.word, ()=>{}, e=>console.error(e));
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
  rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

/* ═══════════════════════════════════════════════
   例句：任意词汇点击查词（基于语境）& 朗读
═══════════════════════════════════════════════ */
function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}
function speakWord(word) {
  if (!synthesizer) { alert("语音服务未初始化"); return; }
  const w = String(word || "").trim();
  if (!w) return;
  synthesizer.speakTextAsync(w, ()=>{}, e=>console.error("TTS:", e));
}
function closeWordModal() {
  document.getElementById("word-modal").classList.remove("show");
}

   P4 例句
═══════════════════════════════════════════════ */
function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function prevWord() {
  if (wordIndex <= 0) return;
  wordIndex--;
  saveProgress();
  startWord();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}


/* ── 跳过功能（学生自主跳过已认识的单词） ── */
let skippedWords = new Set(JSON.parse(localStorage.getItem('pep_vocab_skipped_'+STORAGE_KEY)||'[]'));
function skipWord() {
  const w = allWords[wordIndex];
  if (!w?.word) { nextWord(); return; }
  skippedWords.add(w.word);
  try { localStorage.setItem('pep_vocab_skipped_'+STORAGE_KEY, JSON.stringify([...skippedWords])); } catch(e) {}
  wordStartTime = Date.now();
  const btn = document.getElementById('p1-skip');
  if (btn) {
    btn.innerHTML = '✓ 已跳过'; btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-forward-step"></i> 跳过（已认识）'; btn.disabled = false; }, 500);
  }
  nextWord();
}

   复习流程
