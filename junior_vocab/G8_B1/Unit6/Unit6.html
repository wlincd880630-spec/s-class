  <script>window.VOCAB_DATA={"units":[{"unit":6,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"bath","ipa":"/bɑːθ/","image_prompts":["A white porcelain bathtub filled with warm water and white foam bubbles, a rubber duck floating on the surface, soft steam rising in a clean bathroom with blue tiles.","A wooden bathtub in a natural hot spring setting, surrounded by smooth stones and green bamboo leaves, clear water reflecting the sky."],"image_desc_en":"A bathtub with foam and a rubber duck; a wooden bathtub in a hot spring.","image_desc_cn":"一个带泡沫和橡皮鸭的浴缸；一个在温泉中的木制浴缸。","meaning_cn":"洗澡；浴缸；沐浴","usage":"n. (可数名词，常用单数形式，如 take a bath / have a bath)","collocations":"take a bath, have a bath, hot bath, bubble bath","preposition_combos":"in the bath, after a bath","examples":[{"en":"After the long run, I took a hot bath to relax.","cn":"长跑之后，我洗了个热水澡来放松。"},{"en":"My cat always sits outside the bathroom when I have a bath.","cn":"我洗澡时，我的猫总是坐在浴室外面。"}],"socratic_questions":[{"question":"你运动完一身汗，回家后最想做什么来清洁身体、放松肌肉？","answer_hint":"这个词指在浴缸里泡水清洁，不是淋浴，也不是游泳。"}],"fill_blank":{"sentences":["After the camping trip, everyone needed a hot ___ to get clean."],"options":["bath","shower","swim","walk"],"correct_index":0},"audio":"audio/bath.mp3","audio_ex0":"audio/bath_ex0.mp3","audio_ex1":"audio/bath_ex1.mp3"},{"word":"miss","ipa":"/mɪs/","image_prompts":["A calendar with a red circle around a past date, a wilted flower placed on the desk next to it, soft morning light through a window.","An empty chair at a dining table with a single plate and a cup of cold tea, a clock showing late evening."],"image_desc_en":"A calendar with a circled date and a wilted flower; an empty chair at a table with cold tea.","image_desc_cn":"一张日历上圈着日期并放着一朵枯萎的花；餐桌旁一把空椅子和冷茶。","meaning_cn":"想念；错过；未击中","usage":"v. (过去式 missed, 过去分词 missed)","collocations":"miss the bus, miss a chance, miss someone, miss a goal","preposition_combos":"miss out on, miss by (e.g., miss by one point)","examples":[{"en":"I missed the early bus and had to walk to school.","cn":"我错过了早班公交车，不得不步行去学校。"},{"en":"She misses her best friend who moved to another city.","cn":"她想念搬到另一个城市的最好的朋友。"}],"socratic_questions":[{"question":"你早上起晚了，跑到车站时公交车刚好开走，你没能赶上它，用哪个词？","answer_hint":"这个词表示没能赶上或没能抓住，也用于表达思念某人。"}],"fill_blank":{"sentences":["If you run fast, you won't ___ the last train."],"options":["miss","catch","find","lose"],"correct_index":0},"audio":"audio/miss.mp3","audio_ex0":"audio/miss_ex0.mp3","audio_ex1":"audio/miss_ex1.mp3"},{"word":"be tired of","ipa":"/biː ˈtaɪərd əv/","image_prompts":["A stack of identical textbooks piled high on a desk, a clock showing late night, a half-empty coffee cup with cold liquid.","A treadmill with a worn-out belt and dust on the display screen, a wilted plant in the corner of a gym."],"image_desc_en":"A tall stack of textbooks with a late-night clock and cold coffee; a dusty treadmill with a wilted plant.","image_desc_cn":"一摞高高的教科书、深夜的钟和冷咖啡；一台布满灰尘的跑步机和枯萎的植物。","meaning_cn":"厌倦；对……感到厌烦","usage":"短语动词 (be tired of + n./doing)","collocations":"be tired of waiting, be tired of the same food, be tired of homework","preposition_combos":"tired of (后接名词或动名词)","examples":[{"en":"I am tired of eating noodles for breakfast every day.","cn":"我厌倦了每天早餐吃面条。"},{"en":"The class is tired of the same math exercises every week.","cn":"全班都厌倦了每周做同样的数学练习。"}],"socratic_questions":[{"question":"你连续一周每天吃同样的午餐，现在看到那个饭盒就觉得没胃口，你是什么感觉？","answer_hint":"这个短语表示因为重复或太久而产生厌烦情绪，不是身体累，而是心理上不想再继续。"}],"fill_blank":{"sentences":["After three hours of waiting, the children ___ ___ ___ the long line."],"options":["were tired of","were excited about","were good at","were afraid of"],"correct_index":0},"audio":"audio/be_tired_of.mp3","audio_ex0":"audio/be_tired_of_ex0.mp3","audio_ex1":"audio/be_tired_of_ex1.mp3"},{"word":"able","ipa":"/ˈeɪbl/","image_prompts":["A small sapling growing out of a crack in a concrete pavement, sunlight shining on its green leaves, showing strength and possibility.","A completed 1000-piece jigsaw puzzle on a wooden table, the last piece being placed into the center, a magnifying glass nearby."],"image_desc_en":"A sapling growing through concrete; a completed jigsaw puzzle with the last piece being placed.","image_desc_cn":"一棵从混凝土裂缝中长出的小树苗；一幅完成的拼图，最后一块正在放入。","meaning_cn":"能够；有能力的","usage":"adj. (常用 be able to do sth.)","collocations":"be able to do, able to finish, able to solve","preposition_combos":"able to (后接动词原形)","examples":[{"en":"With enough practice, you will be able to play the piano well.","cn":"通过足够的练习，你将能够弹好钢琴。"},{"en":"She was able to finish the test before the bell rang.","cn":"她能够在铃响前完成测试。"}],"socratic_questions":[{"question":"你经过一个月的练习，终于可以连续跳绳100次而不中断，你具备了这种能力，用哪个词？","answer_hint":"这个词表示具备做某事的能力或条件，后面常跟 to do。"}],"fill_blank":{"sentences":["With the new map app, we were ___ to find the museum easily."],"options":["able","unable","possible","sure"],"correct_index":0},"audio":"audio/able.mp3","audio_ex0":"audio/able_ex0.mp3","audio_ex1":"audio/able_ex1.mp3"},{"word":"stick","ipa":"/stɪk/","image_prompts":["A wooden stick lying on a pile of autumn leaves, sunlight filtering through trees","A glue stick half-used on a white desk next to a torn piece of paper"],"image_desc_en":"A wooden stick on autumn leaves; a glue stick on a desk with torn paper.","image_desc_cn":"一根木棍躺在秋叶堆上；一支用了一半的胶棒放在白色桌面上，旁边有撕破的纸。","meaning_cn":"v. 粘贴；卡住；坚持 n. 棍子；枝条","usage":"v. (过去式 stuck, 过去分词 stuck) / n. (可数名词)","collocations":"stick to, stick with, stick out, glue stick","preposition_combos":"stick to (坚持/粘在), stick in (卡在), stick on (贴在)","examples":[{"en":"I stuck a note on the fridge for my mom.","cn":"我在冰箱上贴了一张便条给妈妈。"},{"en":"The key stuck in the lock and would not move.","cn":"钥匙卡在锁里动不了了。"}],"socratic_questions":[{"question":"你想把一张照片贴到日记本上，需要用什么动作？","answer_hint":"这个动作表示用胶水或胶带固定，不是钉或夹。"}],"fill_blank":{"sentences":["The stamp won't ___ on the envelope because it's wet."],"options":["stick","stay","stand","strike"],"correct_index":0},"audio":"audio/stick.mp3","audio_ex0":"audio/stick_ex0.mp3","audio_ex1":"audio/stick_ex1.mp3"},{"word":"stick to sth","ipa":"/stɪk tuː ˈsʌmθɪŋ/","image_prompts":["A daily planner with a red pen marking each completed task, a coffee cup beside it","A running track with white lane lines and a pair of worn running shoes at the start line"],"image_desc_en":"A planner with red checkmarks and a coffee cup; a track with lane lines and worn shoes.","image_desc_cn":"一本计划表上红色笔勾出已完成任务，旁边有咖啡杯；一条跑道上有白色分道线和一双旧跑鞋。","meaning_cn":"坚持（做某事）；遵守（计划、原则等）","usage":"动词短语 (过去式 stuck to, 过去分词 stuck to)","collocations":"stick to a plan, stick to a diet, stick to the rules","preposition_combos":"stick to (后接名词或动名词)","examples":[{"en":"You should stick to your study plan every day.","cn":"你应该每天坚持你的学习计划。"},{"en":"He stuck to his decision even when others disagreed.","cn":"即使别人不同意，他也坚持自己的决定。"}],"socratic_questions":[{"question":"你定了一个每天背20个单词的计划，但第三天就想放弃。你需要做什么？","answer_hint":"这个短语强调不改变、不放弃，和‘坚持’意思一样。"}],"fill_blank":{"sentences":["If you want to improve your English, you must ___ your daily practice."],"options":["stick to","give up","look for","put off"],"correct_index":0},"audio":"audio/stick_to_sth.mp3","audio_ex0":"audio/stick_to_sth_ex0.mp3","audio_ex1":"audio/stick_to_sth_ex1.mp3"},{"word":"resolution","ipa":"/ˌrezəˈluːʃn/","image_prompts":["A calendar on a wall with January 1 circled in red and a list of goals written below","A notebook open to a page with bullet points: 'Exercise 3 times a week, Read 2 books a month'"],"image_desc_en":"A wall calendar with Jan 1 circled and a goal list; a notebook with bullet-pointed goals.","image_desc_cn":"墙上日历中1月1日被红笔圈出，下方列着目标清单；一本笔记本上写着要点式目标。","meaning_cn":"n. 决心；决定；决议","usage":"n. (可数名词，复数 resolutions)","collocations":"make a resolution, New Year's resolution, keep a resolution","preposition_combos":"resolution to do sth, resolution about sth","examples":[{"en":"My New Year's resolution is to exercise more often.","cn":"我的新年决心是多锻炼。"},{"en":"She made a resolution to finish her homework before dinner.","cn":"她下定决心在晚饭前完成作业。"}],"socratic_questions":[{"question":"新年到了，你决定今年要早睡早起。这个决定叫什么？","answer_hint":"这个词常和‘新年’搭配，表示一个正式或郑重的决定。"}],"fill_blank":{"sentences":["Tom made a ___ to save money for a new bike."],"options":["resolution","decision","promise","plan"],"correct_index":0},"audio":"audio/resolution.mp3","audio_ex0":"audio/resolution_ex0.mp3","audio_ex1":"audio/resolution_ex1.mp3"},{"word":"have","ipa":"/hæv/","image_prompts":["A kitchen table with a plate of pancakes, a glass of orange juice, and a fork","A bookshelf filled with colorful books, a small globe on the shelf edge"],"image_desc_en":"A table with pancakes and orange juice; a bookshelf with books and a globe.","image_desc_cn":"一张餐桌上有煎饼和橙汁；一个书架上摆满彩色书籍，边缘放着小地球仪。","meaning_cn":"v. 有；拥有；吃；喝；进行（活动）","usage":"v. (过去式 had, 过去分词 had; 第三人称单数 has)","collocations":"have breakfast, have a good time, have a test, have to","preposition_combos":"have + 名词（无固定介词搭配，但常接 for + 餐名）","examples":[{"en":"We usually have lunch at twelve o'clock.","cn":"我们通常十二点吃午饭。"},{"en":"She has a new bicycle that her parents gave her.","cn":"她有一辆父母给她的新自行车。"}],"socratic_questions":[{"question":"你早上饿了，想描述你吃了面包和牛奶，该用哪个动词？","answer_hint":"这个动词既可以表示‘拥有’，也可以表示‘吃/喝’。"}],"fill_blank":{"sentences":["I usually ___ a glass of milk before going to bed."],"options":["have","eat","drink","take"],"correct_index":0},"audio":"audio/have.mp3","audio_ex0":"audio/have_ex0.mp3","audio_ex1":"audio/have_ex1.mp3"},{"word":"mini-goal","ipa":"/ˈmɪni ɡoʊl/","image_prompts":["A whiteboard with a large goal written at the top and three smaller checkboxes labeled Step 1, Step 2, Step 3 below it, marker lines connecting them","A staircase made of wooden blocks, each block labeled with a small task like 'read 10 pages' and a tiny flag on the top block"],"image_desc_en":"A whiteboard with a large goal at the top and three smaller checkboxes labeled Step 1, Step 2, Step 3 below, connected by marker lines.","image_desc_cn":"一块白板，顶部写有大目标，下方有三个标有步骤1、2、3的小复选框，用马克笔线条连接。","meaning_cn":"小目标；阶段性目标","usage":"名词 n. (可数，复数 mini-goals)","collocations":"set a mini-goal, achieve a mini-goal, break into mini-goals","preposition_combos":"mini-goal for, mini-goal of","examples":[{"en":"I set a mini-goal to finish my math homework before dinner.","cn":"我设定了一个小目标，在晚饭前完成数学作业。"},{"en":"Breaking a big task into mini-goals makes it easier to start.","cn":"把大任务分解成小目标会让开始变得更容易。"}],"socratic_questions":[{"question":"你想提高英语成绩，但觉得背100个单词太难了。如果先只背10个，这10个单词可以叫什么？","answer_hint":"这个词由“迷你”和“目标”组成，表示一个很小的、容易完成的目标。"}],"fill_blank":{"sentences":["To finish the project on time, we should break it into several ___."],"options":["mini-goals","dreams","problems","reasons"],"correct_index":0},"audio":"audio/mini-goal.mp3","audio_ex0":"audio/mini-goal_ex0.mp3","audio_ex1":"audio/mini-goal_ex1.mp3"},{"word":"achieve","ipa":"/əˈtʃiːv/","image_prompts":["A gold trophy sitting on a wooden podium with a red ribbon tied around its base, soft spotlight from above","A stack of books with a graduation cap on top, a certificate leaning against the books"],"image_desc_en":"A gold trophy on a wooden podium with a red ribbon, lit by a soft spotlight from above.","image_desc_cn":"一个金色奖杯放在木质领奖台上，底座系着红丝带，上方有柔和的聚光灯。","meaning_cn":"实现；达到；取得","usage":"动词 v. (过去式 achieved, 过去分词 achieved)","collocations":"achieve a goal, achieve success, achieve a dream","preposition_combos":"achieve in, achieve through","examples":[{"en":"She worked hard to achieve her dream of winning the race.","cn":"她努力实现了赢得比赛的梦想。"},{"en":"You can achieve good grades if you study every day.","cn":"如果你每天学习，就能取得好成绩。"}],"socratic_questions":[{"question":"你每天练习弹钢琴，最后终于能在音乐会上演奏一首完整的曲子。这个结果可以用哪个词描述？","answer_hint":"这个词表示通过努力最终成功完成某件事，常和“目标”“梦想”搭配。"}],"fill_blank":{"sentences":["With enough practice, you can ___ anything you set your mind to."],"options":["achieve","forget","avoid","destroy"],"correct_index":0},"audio":"audio/achieve.mp3","audio_ex0":"audio/achieve_ex0.mp3","audio_ex1":"audio/achieve_ex1.mp3"},{"word":"physical","ipa":"/ˈfɪzɪkəl/","image_prompts":["A set of dumbbells and a yoga mat on a wooden floor, a water bottle beside them","A bicycle parked next to a running track with white lane markings, morning sunlight"],"image_desc_en":"A set of dumbbells and a yoga mat on a wooden floor with a water bottle beside them.","image_desc_cn":"一组哑铃和一张瑜伽垫放在木地板上，旁边有一个水瓶。","meaning_cn":"身体的；物理的；体力的","usage":"形容词 adj. (副词形式 physically)","collocations":"physical health, physical activity, physical education","preposition_combos":"physical for, physical in","examples":[{"en":"Doing physical exercise every morning helps me stay healthy.","cn":"每天早上做体育锻炼有助于我保持健康。"},{"en":"The school has a new gym for physical education classes.","cn":"学校有一个新的体育馆用于体育课。"}],"socratic_questions":[{"question":"老师让你多运动，比如跑步、游泳，这些和身体有关的活动可以用哪个形容词？","answer_hint":"这个词和“身体”有关，常用来描述运动、健康或体力活动。"}],"fill_blank":{"sentences":["Regular ___ activity can improve your mood and energy levels."],"options":["physical","mental","musical","digital"],"correct_index":0},"audio":"audio/physical.mp3","audio_ex0":"audio/physical_ex0.mp3","audio_ex1":"audio/physical_ex1.mp3"},{"word":"health","ipa":"/helθ/","image_prompts":["A fresh green salad in a white bowl with cherry tomatoes and cucumber slices, natural light","A glass of water and an apple on a wooden table next to a small potted plant"],"image_desc_en":"A fresh green salad in a white bowl with cherry tomatoes and cucumber slices under natural light.","image_desc_cn":"一碗新鲜绿色沙拉放在白色碗里，有樱桃番茄和黄瓜片，在自然光下。","meaning_cn":"健康；健康状况","usage":"名词 n. (不可数；形容词形式 healthy)","collocations":"good health, in poor health, health problem, health care","preposition_combos":"health of, for health","examples":[{"en":"Eating fruits and vegetables is important for your health.","cn":"吃水果和蔬菜对你的健康很重要。"},{"en":"The doctor gave us some advice about keeping good health.","cn":"医生给了我们一些关于保持良好健康的建议。"}],"socratic_questions":[{"question":"你最近总是熬夜，妈妈很担心你的身体状态。她担心的是你的什么？","answer_hint":"这个词指身体没有生病、状态良好的情况，常和“保持”“关心”搭配。"}],"fill_blank":{"sentences":["Drinking enough water every day is good for your ___."],"options":["health","wealth","height","weight"],"correct_index":0},"audio":"audio/health.mp3","audio_ex0":"audio/health_ex0.mp3","audio_ex1":"audio/health_ex1.mp3"},{"word":"healthily","ipa":"/ˈhelθɪli/","image_prompts":["A wooden cutting board with fresh vegetables and a glass of water, bright natural light from a window","A bowl of oatmeal topped with berries and nuts on a white tablecloth, steam rising gently"],"image_desc_en":"A wooden cutting board with fresh vegetables and a glass of water, bright natural light from a window","image_desc_cn":"一块木砧板上放着新鲜蔬菜和一杯水，明亮的自然光从窗户照入","meaning_cn":"健康地","usage":"adv. (副词，由形容词 healthy + -ly 构成)","collocations":"eat healthily, live healthily, grow healthily","preposition_combos":"无固定介词搭配","examples":[{"en":"To pass the exam, you should eat healthily and sleep well.","cn":"为了通过考试，你应该健康饮食并睡好觉。"},{"en":"The plants in the garden grow healthily under the warm sun.","cn":"花园里的植物在温暖的阳光下健康生长。"}],"socratic_questions":[{"question":"小明最近总吃炸鸡和薯条，你觉得他这样饮食方式对身体好吗？应该用什么词来描述正确的饮食方式？","answer_hint":"这个词强调“以健康的方式”，不是单纯说“健康”这个状态，而是修饰动作“吃”。"}],"fill_blank":{"sentences":["My grandmother always tells me to eat ___ and exercise every day."],"options":["healthily","healthy","health","unhealthy"],"correct_index":0},"audio":"audio/healthily.mp3","audio_ex0":"audio/healthily_ex0.mp3","audio_ex1":"audio/healthily_ex1.mp3"},{"word":"take up","ipa":"/teɪk ʌp/","image_prompts":["A pair of running shoes placed on a gym floor next to a water bottle, laces untied","An open guitar case on a wooden floor with a guitar leaning inside, sheet music nearby"],"meaning_cn":"开始从事（某项活动或爱好）","usage":"v. (动词短语，过去式 took up, 过去分词 taken up)","collocations":"take up a hobby, take up a sport, take up photography","preposition_combos":"take up + 名词（活动/爱好）","examples":[{"en":"I plan to take up swimming this summer to get stronger.","cn":"我计划今年夏天开始学游泳来变得更强壮。"},{"en":"She decided to take up painting after visiting the art museum.","cn":"参观艺术博物馆后，她决定开始学绘画。"}],"socratic_questions":[{"question":"你的朋友最近觉得放学后很无聊，想学点新东西，比如弹吉他或打篮球。你会建议他“开始做”哪件事？用什么短语表达“开始做”这个意思？","answer_hint":"这个短语由两个词组成，表示“开始从事一项新的活动”，不是“拿起”物品的意思。"}],"fill_blank":{"sentences":["My brother wants to ___ a new hobby like playing the piano."],"options":["take up","take off","take away","take down"],"correct_index":0},"audio":"audio/take_up.mp3","audio_ex0":"audio/take_up_ex0.mp3","audio_ex1":"audio/take_up_ex1.mp3"},{"word":"photography","ipa":"/fəˈtɒɡrəfi/","image_prompts":["A vintage camera on a wooden table with a roll of film and a developed photo showing a landscape","A close-up of a camera lens reflecting a sunset sky, with a blurred background of trees"],"meaning_cn":"摄影；摄影艺术","usage":"n. (不可数名词)","collocations":"digital photography, wildlife photography, photography club","preposition_combos":"in photography, photography of + 对象","examples":[{"en":"Our school photography club meets every Friday afternoon in Room 201.","cn":"我们学校摄影社每周五下午在201教室活动。"},{"en":"He showed us his photography of the mountains during the trip.","cn":"他向我们展示了旅行中拍摄的山景照片。"}],"socratic_questions":[{"question":"学校要办一个社团展览，你想展示用相机拍下的校园美景。这个用相机记录画面的活动叫什么？","answer_hint":"这个词以 -graphy 结尾，指的是“用相机拍摄照片的艺术或活动”，不是指相机本身。"}],"fill_blank":{"sentences":["I joined the school ___ club to learn how to take better pictures."],"options":["photography","photograph","photographer","photo"],"correct_index":0},"audio":"audio/photography.mp3","audio_ex0":"audio/photography_ex0.mp3","audio_ex1":"audio/photography_ex1.mp3"},{"word":"self-improvement","ipa":"/ˌself ɪmˈpruːvmənt/","image_prompts":["An open notebook on a desk with a pen and a list titled 'Goals', a small plant beside it","A stack of books on a shelf with titles like 'Learn New Skills' and 'Be Better', soft lamp light"],"meaning_cn":"自我提升；自我完善","usage":"n. (不可数名词，由 self- + improvement 构成)","collocations":"self-improvement plan, self-improvement book, focus on self-improvement","preposition_combos":"for self-improvement, through self-improvement","examples":[{"en":"Reading books every day is a great way for self-improvement.","cn":"每天读书是自我提升的好方法。"},{"en":"She made a self-improvement plan to learn English and exercise more.","cn":"她制定了一个自我提升计划，包括学英语和多锻炼。"}],"socratic_questions":[{"question":"你想在新学期让自己变得更好，比如提高成绩、学会新技能。这种让自己进步的过程叫什么？","answer_hint":"这个词由“自己”和“改进”两个部分合成，强调个人主动让自己变得更好，不是别人帮你。"}],"fill_blank":{"sentences":["Setting small goals every week helps with ___."],"options":["self-improvement","selfishness","self-confidence","self-service"],"correct_index":0},"audio":"audio/self-improvement.mp3","audio_ex0":"audio/self-improvement_ex0.mp3","audio_ex1":"audio/self-improvement_ex1.mp3"},{"word":"confident","ipa":"/ˈkɒnfɪdənt/","image_prompts":["A neatly stacked pile of exam papers with a red A+ mark on top, bright sunlight streaming across the desk","A microphone standing alone on an empty stage with a single spotlight shining down, no person visible"],"image_desc_en":"A pile of exam papers with a red A+ mark on top, bright sunlight on a desk","image_desc_cn":"一叠考试卷，最上面一张有红色A+标记，明亮的阳光照在书桌上","meaning_cn":"自信的；有信心的","usage":"adj. (比较级 more confident, 最高级 most confident; 副词 confidently)","collocations":"feel confident, be confident about, confident smile","preposition_combos":"confident about, confident in","examples":[{"en":"She felt confident before the math exam because she studied hard.","cn":"她在数学考试前感到自信，因为她努力学习。"},{"en":"A confident speaker uses clear words and a strong voice.","cn":"自信的演讲者使用清晰的词语和有力的声音。"}],"socratic_questions":[{"question":"小明复习了整整一周，走进考场时心里很踏实，觉得自己一定能考好。这种心态用一个形容词怎么描述？","answer_hint":"这个词表示对自己能力有把握、不紧张，和‘相信’有关。"}],"fill_blank":{"sentences":["She is ___ that she can finish the project on time."],"options":["confident","nervous","worried","shy"],"correct_index":0},"audio":"audio/confident.mp3","audio_ex0":"audio/confident_ex0.mp3","audio_ex1":"audio/confident_ex1.mp3"},{"word":"organized","ipa":"/ˈɔːrɡənaɪzd/","image_prompts":["A neatly arranged desk with color-coded folders, labeled binders, and a tidy pencil holder","A calendar on a wall with each day filled in different colors, showing a structured weekly schedule"],"image_desc_en":"A clean desk with color-coded folders and binders, and a wall calendar with a structured weekly schedule.","image_desc_cn":"一张整洁的桌子，上面有颜色分类的文件夹和活页夹，以及墙上显示结构化周计划的日历。","meaning_cn":"有条理的；有组织的（adj.）","usage":"adj. (organized) 形容人或事物安排有序、系统化。动词原形：organize (v.)；过去式/过去分词：organized (v.)；名词：organization (n.)","collocations":"well-organized; organized person; organized event","preposition_combos":"organized by; organized into","examples":[{"en":"She keeps her schoolbag very organized with separate folders.","cn":"她用分开的文件夹把书包整理得很有条理。"},{"en":"An organized study plan helps you prepare for exams.","cn":"有条理的学习计划有助于你准备考试。"}],"socratic_questions":[{"question":"如果你的书桌很乱，找不到笔和书，而同桌的书桌每样东西都放得整整齐齐，你会怎么形容同桌？","answer_hint":"这个词表示“有条理的”，形容做事或物品摆放很有秩序。"}],"fill_blank":{"sentences":["A ___ student always finishes homework on time."],"options":["organized","lazy","noisy","careless"],"correct_index":0},"audio":"audio/organized.mp3","audio_ex0":"audio/organized_ex0.mp3","audio_ex1":"audio/organized_ex1.mp3"},{"word":"wisely","ipa":"/ˈwaɪzli/","image_prompts":["A piggy bank with a few coins next to a calculator, symbolizing saving money carefully","A library shelf with a single open book and a lamp, suggesting thoughtful reading choice"],"image_desc_en":"A piggy bank with coins and a calculator, and a library shelf with an open book under a lamp.","image_desc_cn":"一个存钱罐旁边放着几枚硬币和一个计算器，以及图书馆书架上在台灯下打开的一本书。","meaning_cn":"明智地；聪明地（adv.）","usage":"adv. (wisely) 修饰动词，表示以明智、有智慧的方式行事。形容词：wise (adj.)；名词：wisdom (n.)","collocations":"use wisely; spend wisely; choose wisely","preposition_combos":"无固定介词搭配","examples":[{"en":"You should spend your pocket money wisely on useful things.","cn":"你应该明智地把零花钱花在有用的东西上。"},{"en":"He wisely decided to review the notes before the test.","cn":"他明智地决定在考试前复习笔记。"}],"socratic_questions":[{"question":"考试前，有的同学通宵玩游戏，有的同学早早睡觉养足精神。哪种做法更聪明？可以用哪个副词来形容？","answer_hint":"这个词表示“明智地”，形容做出好的、聪明的决定。"}],"fill_blank":{"sentences":["To save time, she ___ chose the shortest route to school."],"options":["wisely","quickly","loudly","angrily"],"correct_index":0},"audio":"audio/wisely.mp3","audio_ex0":"audio/wisely_ex0.mp3","audio_ex1":"audio/wisely_ex1.mp3"},{"word":"possible","ipa":"/ˈpɑːsəbl/","image_prompts":["A calendar with a circled date and a checkmark, indicating a deadline that can be met","A puzzle piece fitting perfectly into a gap, showing that completion is achievable"],"image_desc_en":"A calendar with a circled date and checkmark, and a puzzle piece fitting into a gap.","image_desc_cn":"一个日历上圈出日期并打勾，以及一块拼图完美嵌入空缺中。","meaning_cn":"可能的（adj.）","usage":"adj. (possible) 表示某事可以发生或做到。副词：possibly (adv.)；名词：possibility (n.)；反义词：impossible (adj.)","collocations":"as soon as possible; it is possible to; make it possible","preposition_combos":"possible for; possible with","examples":[{"en":"It is possible to finish the project before Friday.","cn":"在周五之前完成这个项目是可能的。"},{"en":"Please reply to the email as soon as possible.","cn":"请尽快回复这封邮件。"}],"socratic_questions":[{"question":"老师布置了一个很难的任务，你觉得完不成，但同桌说“只要努力，这件事是______的”。这里缺什么词？","answer_hint":"这个词表示“可能的”，强调事情有希望实现。"}],"fill_blank":{"sentences":["Is it ___ to learn English well in one year?"],"options":["possible","impossible","important","popular"],"correct_index":0},"audio":"audio/possible.mp3","audio_ex0":"audio/possible_ex0.mp3","audio_ex1":"audio/possible_ex1.mp3"},{"word":"paragraph","ipa":"/ˈpærəɡrɑːf/","image_prompts":["An open notebook with three distinct blocks of text separated by blank lines, each block starting with an indentation","A page from a textbook with a highlighted section labeled 'Paragraph 2' in the margin"],"image_desc_en":"An open notebook with three distinct blocks of text separated by blank lines, each block starting with an indentation","image_desc_cn":"一本打开的笔记本，有三块文字被空行隔开，每块开头有缩进","meaning_cn":"段落","usage":"n. (复数 paragraphs)","collocations":"write a paragraph, first paragraph, main idea of the paragraph","preposition_combos":"in the paragraph, paragraph about","examples":[{"en":"Each paragraph should have one main idea.","cn":"每个段落应该有一个主要观点。"},{"en":"Read the second paragraph and answer the question.","cn":"阅读第二段并回答问题。"}],"socratic_questions":[{"question":"写作文时，老师要求你把内容分成几个部分，每个部分讲一个意思，开头要空两格。这些部分叫什么？","answer_hint":"这个词指文章中由几个句子组成的一个完整单元，通常有缩进。"}],"fill_blank":{"sentences":["The first ___ of the article describes the writer's hobby."],"options":["paragraph","sentence","word","page"],"correct_index":0},"audio":"audio/paragraph.mp3","audio_ex0":"audio/paragraph_ex0.mp3","audio_ex1":"audio/paragraph_ex1.mp3"},{"word":"introduce","ipa":"/ˌɪntrəˈdjuːs/","image_prompts":["A hand holding a name card with a name written on it, placed on a desk next to a cup of coffee","A book cover with a title and author name, and a speech bubble saying 'Meet the author'"],"image_desc_en":"A hand holding a name card with a name written on it, placed on a desk next to a cup of coffee","image_desc_cn":"一只手拿着写有名字的名片，放在咖啡杯旁边的桌子上","meaning_cn":"介绍；引进","usage":"v. (过去式 introduced, 过去分词 introduced)","collocations":"introduce oneself, introduce a new topic, introduce a friend","preposition_combos":"introduce sb. to sb., introduce sth. into","examples":[{"en":"Let me introduce my best friend to you.","cn":"让我把我的好朋友介绍给你。"},{"en":"The teacher introduced a new game in class today.","cn":"老师今天在课堂上介绍了一个新游戏。"}],"socratic_questions":[{"question":"新学期班里来了新同学，你想让他认识大家，你会怎么做？用一个动词描述这个动作。","answer_hint":"这个词表示让两个人互相认识，或者把新事物展示给别人。"}],"fill_blank":{"sentences":["Can you ___ yourself to the new classmates?"],"options":["introduce","invite","include","imagine"],"correct_index":0},"audio":"audio/introduce.mp3","audio_ex0":"audio/introduce_ex0.mp3","audio_ex1":"audio/introduce_ex1.mp3"},{"word":"meaning","ipa":"/ˈmiːnɪŋ/","image_prompts":["A dictionary open to a page with a word circled and a definition highlighted in yellow","A road sign with an arrow and a question mark drawn next to it, symbolizing the need to understand the sign's message"],"image_desc_en":"A dictionary open to a page with a word circled and a definition highlighted in yellow","image_desc_cn":"一本打开的词典，一个单词被圈出，定义被黄色高亮标记","meaning_cn":"意义；含义","usage":"n. (复数 meanings; 形容词 meaningful, 副词 meaningfully)","collocations":"the meaning of life, real meaning, understand the meaning","preposition_combos":"meaning of sth.","examples":[{"en":"What is the meaning of this new word?","cn":"这个新单词的意思是什么？"},{"en":"The gift has a special meaning for our family.","cn":"这份礼物对我们家有着特殊的意义。"}],"socratic_questions":[{"question":"读英语文章时遇到生词，你查词典想知道它代表什么。词典里给出的解释叫什么？","answer_hint":"这个词指一个词、符号或行为所表达的内容或概念。"}],"fill_blank":{"sentences":["Can you guess the ___ of the word from the sentence?"],"options":["meaning","spelling","sound","letter"],"correct_index":0},"audio":"audio/meaning.mp3","audio_ex0":"audio/meaning_ex0.mp3","audio_ex1":"audio/meaning_ex1.mp3"},{"word":"fail","ipa":"/feɪl/","image_prompts":["A red F grade written on a white test paper with a broken pencil lying next to it","A wilted plant in a cracked pot with dry soil, no water droplets visible"],"image_desc_en":"A red F grade on a test paper with a broken pencil; a wilted plant in a cracked pot.","image_desc_cn":"试卷上红色的F等级和一支断铅笔；裂口花盆中枯萎的植物。","meaning_cn":"失败；未能做到；不及格","usage":"v. (过去式 failed, 过去分词 failed)","collocations":"fail an exam, fail to do sth, fail the test","preposition_combos":"fail in (sth), fail to (do)","examples":[{"en":"I hope I will not fail the math exam this time.","cn":"我希望这次数学考试不会不及格。"},{"en":"He failed to finish his homework on time yesterday.","cn":"他昨天没能按时完成作业。"}],"socratic_questions":[{"question":"小明复习了很久，但考试结果还是不如意，成绩单上有个红色的字母。这个结果叫什么？","answer_hint":"这个词表示没有达到目标或标准，常与考试或任务搭配。"}],"fill_blank":{"sentences":["She ___ the driving test because she was too nervous."],"options":["passed","failed","took","prepared"],"correct_index":1},"audio":"audio/fail.mp3","audio_ex0":"audio/fail_ex0.mp3","audio_ex1":"audio/fail_ex1.mp3"},{"word":"yourself","ipa":"/jɔːrˈself/","image_prompts":["A mirror reflecting a clear image of a single backpack on a chair, no person visible","A handwritten note on a desk saying 'Believe in you' with a small star sticker"],"image_desc_en":"A mirror showing a backpack on a chair; a note saying 'Believe in you' on a desk.","image_desc_cn":"镜子中映出椅子上的背包；桌上写着‘相信自己’的便签和星星贴纸。","meaning_cn":"你自己","usage":"pron.","collocations":"by yourself, teach yourself, enjoy yourself, believe in yourself","preposition_combos":"by yourself, for yourself","examples":[{"en":"You can learn to play the guitar by yourself online.","cn":"你可以自己在网上学弹吉他。"},{"en":"Please take good care of yourself during the trip.","cn":"旅途中请好好照顾自己。"}],"socratic_questions":[{"question":"老师鼓励大家独立完成项目，不要总依赖别人。这个‘自己’用英语怎么说？","answer_hint":"这是一个反身代词，指代‘你’本人，常用于鼓励或提醒。"}],"fill_blank":{"sentences":["You should believe in ___ and try your best."],"options":["myself","yourself","himself","herself"],"correct_index":1},"audio":"audio/yourself.mp3","audio_ex0":"audio/yourself_ex0.mp3","audio_ex1":"audio/yourself_ex1.mp3"},{"word":"engineer","ipa":"/ˌendʒɪˈnɪr/","image_prompts":["A blueprint of a bridge spread on a wooden table with a calculator and a hard hat","A model of a wind turbine on a desk next to a laptop showing a 3D design software"],"image_desc_en":"A bridge blueprint on a table with a calculator and hard hat; a wind turbine model beside a laptop with 3D design.","image_desc_cn":"桌上桥梁蓝图、计算器和安全帽；笔记本电脑旁的风力涡轮机模型和3D设计软件。","meaning_cn":"工程师","usage":"n. (复数 engineers)","collocations":"civil engineer, software engineer, mechanical engineer, become an engineer","preposition_combos":"engineer in (field), engineer for (company)","examples":[{"en":"My uncle works as a software engineer in a big company.","cn":"我叔叔在一家大公司做软件工程师。"},{"en":"The engineer designed a new bridge for the city last year.","cn":"这位工程师去年为城市设计了一座新桥。"}],"socratic_questions":[{"question":"有人设计高楼、桥梁或电脑程序，这种职业叫什么？","answer_hint":"这个词指运用科学和数学知识解决实际问题、设计建造的人。"}],"fill_blank":{"sentences":["He wants to be an ___ and build robots in the future."],"options":["artist","engineer","doctor","teacher"],"correct_index":1},"audio":"audio/engineer.mp3","audio_ex0":"audio/engineer_ex0.mp3","audio_ex1":"audio/engineer_ex1.mp3"},{"word":"fashion","ipa":"/ˈfæʃn/","image_prompts":["A row of colorful dresses hanging on a rack in a boutique, soft lighting on fabric textures","A stack of fashion magazines with glossy covers showing seasonal clothing trends"],"image_desc_en":"A row of colorful dresses on a rack in a boutique, soft lighting highlighting fabric textures.","image_desc_cn":"精品店里一排彩色连衣裙挂在衣架上，柔和灯光凸显面料纹理。","meaning_cn":"时尚；时装","usage":"n. (可数/不可数)","collocations":"in fashion, out of fashion, fashion show, fashion magazine","preposition_combos":"fashion for, fashion in","examples":[{"en":"This simple dress is always in fashion for school parties.","cn":"这条简单的裙子在学校派对上总是很时尚。"},{"en":"She bought a fashion magazine to learn about new styles.","cn":"她买了一本时尚杂志来了解新款式。"}],"socratic_questions":[{"question":"你看到同学们都在穿某种颜色的运动鞋，这种颜色最近很流行，可以用哪个词来形容这种流行趋势？","answer_hint":"这个词指流行的风格或趋势，常和'in'或'out of'搭配使用。"}],"fill_blank":{"sentences":["Long hair is no longer in ___ this year in our school."],"options":["fashion","style","design","trend"],"correct_index":0},"audio":"audio/fashion.mp3","audio_ex0":"audio/fashion_ex0.mp3","audio_ex1":"audio/fashion_ex1.mp3"},{"word":"designer","ipa":"/dɪˈzaɪnər/","image_prompts":["A sketchbook open on a desk with pencil drawings of a chair and a lamp, ruler nearby","A sewing machine with a half-finished blue fabric on a wooden table, thread spools around"],"image_desc_en":"A sketchbook open on a desk with pencil drawings of a chair and a lamp, a ruler nearby.","image_desc_cn":"桌上摊开的速写本上有椅子和台灯的铅笔草图，旁边放着一把尺子。","meaning_cn":"设计师","usage":"n. (可数)","collocations":"fashion designer, graphic designer, interior designer, designer clothes","preposition_combos":"designer of","examples":[{"en":"The fashion designer showed new clothes at the spring show.","cn":"这位时装设计师在春季秀上展示了新衣服。"},{"en":"My cousin wants to become a designer of video games.","cn":"我表弟想成为一名电子游戏设计师。"}],"socratic_questions":[{"question":"有人专门为手机App设计好看的图标和界面，这种职业叫什么？","answer_hint":"这个词指创造新物品外观或功能的人，比如服装、家具或软件界面。"}],"fill_blank":{"sentences":["The ___ created a beautiful logo for our school club."],"options":["designer","teacher","doctor","driver"],"correct_index":0},"audio":"audio/designer.mp3","audio_ex0":"audio/designer_ex0.mp3","audio_ex1":"audio/designer_ex1.mp3"},{"word":"director","ipa":"/dəˈrektər/","image_prompts":["A clapperboard on a film set with a camera and lighting equipment in the background","A large whiteboard with a timeline and sticky notes for a school play rehearsal schedule"],"image_desc_en":"A clapperboard on a film set with a camera and lighting equipment in the background.","image_desc_cn":"电影片场的一块场记板，背景是摄像机和灯光设备。","meaning_cn":"导演；主任","usage":"n. (可数)","collocations":"film director, school director, music director, director of","preposition_combos":"director of","examples":[{"en":"The film director asked the actors to practice the scene again.","cn":"电影导演让演员们再排练一遍这场戏。"},{"en":"Our school director gave a speech at the opening ceremony.","cn":"我们学校的主任在开幕式上发表了讲话。"}],"socratic_questions":[{"question":"学校文艺汇演时，有一个人负责指挥演员站位、安排灯光和音乐，这个人是什么角色？","answer_hint":"这个词指负责指导整个项目或演出的人，比如电影、戏剧或学校活动。"}],"fill_blank":{"sentences":["The ___ of the movie won an award for best picture."],"options":["director","actor","writer","singer"],"correct_index":0},"audio":"audio/director.mp3","audio_ex0":"audio/director_ex0.mp3","audio_ex1":"audio/director_ex1.mp3"},{"word":"musician","ipa":"/mjuˈzɪʃn/","image_prompts":["A violin resting on a music stand with sheet music open, bow placed beside it","A set of drumsticks on a snare drum with scattered sheet music on a wooden floor"],"image_desc_en":"A violin resting on a music stand with open sheet music, a bow placed beside it.","image_desc_cn":"一把小提琴放在乐谱架上，乐谱翻开，琴弓放在旁边。","meaning_cn":"音乐家","usage":"n. (可数)","collocations":"professional musician, street musician, musician in a band","preposition_combos":"musician from, musician with","examples":[{"en":"The street musician played a beautiful song on his guitar.","cn":"街头音乐家用吉他弹奏了一首优美的歌曲。"},{"en":"Many young musicians practice hard to join the school band.","cn":"许多年轻音乐家刻苦练习，想加入学校乐队。"}],"socratic_questions":[{"question":"一个人能熟练演奏钢琴或小提琴，并且经常在音乐会上表演，他可以被称为什么？","answer_hint":"这个词指以演奏乐器或唱歌为职业或爱好的人。"}],"fill_blank":{"sentences":["The ___ played the piano so well that everyone clapped."],"options":["musician","doctor","teacher","farmer"],"correct_index":0},"audio":"audio/musician.mp3","audio_ex0":"audio/musician_ex0.mp3","audio_ex1":"audio/musician_ex1.mp3"},{"word":"fireman","ipa":"/ˈfaɪərmən/","image_prompts":["A red fire truck parked in front of a burning building with water spraying from a hose, smoke rising into the sky","A yellow fire helmet resting on a wooden bench next to a coiled fire hose and a fire extinguisher"],"image_desc_en":"A fireman's helmet and equipment on a bench, with a fire truck in the background","image_desc_cn":"消防员的头盔和设备放在长凳上，背景是消防车","meaning_cn":"消防员（单数）","usage":"n. (可数名词，复数 firemen)","collocations":"brave fireman, fireman's uniform, call a fireman","preposition_combos":"fireman at the station, fireman with a hose","examples":[{"en":"The fireman quickly put out the kitchen fire.","cn":"消防员迅速扑灭了厨房火灾。"},{"en":"A fireman needs to stay calm in danger.","cn":"消防员在危险中需要保持冷静。"}],"socratic_questions":[{"question":"如果家里发生火灾，你会拨打119求助哪种职业的人？","answer_hint":"这个职业的人负责灭火和救援，穿着防护服，使用消防车和水管。"}],"fill_blank":{"sentences":["The ___ saved a cat from the tall tree."],"options":["fireman","teacher","doctor","pilot"],"correct_index":0},"audio":"audio/fireman.mp3","audio_ex0":"audio/fireman_ex0.mp3","audio_ex1":"audio/fireman_ex1.mp3"},{"word":"firemen","ipa":"/ˈfaɪərmən/","image_prompts":["Three yellow helmets lined up on a shelf inside a fire station, with a red fire truck visible through the open garage door","A row of coiled fire hoses hanging on a wall in a fire station, with boots placed neatly below"],"image_desc_en":"Multiple firemen helmets and equipment in a fire station","image_desc_cn":"消防站里多个消防员的头盔和设备","meaning_cn":"消防员（复数）","usage":"n. (fireman 的复数形式)","collocations":"two firemen, firemen in action, firemen's training","preposition_combos":"firemen from the station, firemen with ladders","examples":[{"en":"The firemen arrived at the burning house in five minutes.","cn":"消防员们在五分钟内到达了着火的房子。"},{"en":"All firemen must practice using the hose every week.","cn":"所有消防员必须每周练习使用水管。"}],"socratic_questions":[{"question":"一场大火需要多名专业人员一起扑救，这些人的复数称呼是什么？","answer_hint":"这个词是 fireman 的复数形式，表示不止一位消防员。"}],"fill_blank":{"sentences":["The ___ worked together to control the forest fire."],"options":["firemen","fireman","policemen","doctors"],"correct_index":0},"audio":"audio/firemen.mp3","audio_ex0":"audio/firemen_ex0.mp3","audio_ex1":"audio/firemen_ex1.mp3"},{"word":"AI","ipa":"/ˌeɪ ˈaɪ/","image_prompts":["A glowing blue circuit board shaped like a human brain on a dark desk, with small lights blinking","A laptop screen displaying a chat interface with a robot icon and flowing text lines"],"image_desc_en":"A circuit board brain and a laptop with AI chat interface","image_desc_cn":"电路板大脑和显示AI聊天界面的笔记本电脑","meaning_cn":"人工智能（缩写）","usage":"n. (不可数名词，缩写自 Artificial Intelligence)","collocations":"AI technology, use AI, AI program, AI assistant","preposition_combos":"AI in education, AI for learning","examples":[{"en":"AI can help students practice English pronunciation at home.","cn":"人工智能可以帮助学生在家练习英语发音。"},{"en":"Many schools now use AI to create study plans.","cn":"许多学校现在使用人工智能来制定学习计划。"}],"socratic_questions":[{"question":"现在有一种技术能让电脑像人一样思考和学习，比如帮你翻译句子或推荐歌曲，它叫什么？","answer_hint":"这是 Artificial Intelligence 的缩写，两个大写字母，常出现在科技新闻中。"}],"fill_blank":{"sentences":["___ can help doctors find diseases faster."],"options":["AI","A.I.","Ai","ai"],"correct_index":0},"audio":"audio/AI.mp3","audio_ex0":"audio/AI_ex0.mp3","audio_ex1":"audio/AI_ex1.mp3"},{"word":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","image_prompts":["An open book with a glowing light bulb above it on a wooden table, surrounded by pencils and notes","A chessboard with pieces arranged in a complex pattern, a clock ticking beside it"],"image_desc_en":"A book with a light bulb and a chessboard with pieces","image_desc_cn":"一本书和灯泡，以及摆有棋子的棋盘","meaning_cn":"智力；情报；智能","usage":"n. (不可数名词)","collocations":"high intelligence, artificial intelligence, use intelligence, develop intelligence","preposition_combos":"intelligence in solving problems, intelligence of a machine","examples":[{"en":"Reading books can improve your intelligence over time.","cn":"读书可以逐渐提高你的智力。"},{"en":"The robot showed great intelligence in finding the exit.","cn":"机器人在寻找出口时展现了很高的智能。"}],"socratic_questions":[{"question":"一个人很聪明，能快速解决难题，这种能力叫什么？","answer_hint":"这个词和“聪明”有关，也出现在“人工智能”这个短语中。"}],"fill_blank":{"sentences":["Puzzles and games can help develop a child's ___."],"options":["intelligence","muscle","height","weight"],"correct_index":0},"audio":"audio/intelligence.mp3","audio_ex0":"audio/intelligence_ex0.mp3","audio_ex1":"audio/intelligence_ex1.mp3"},{"word":"essay","ipa":"/ˈeseɪ/","image_prompts":["A neatly typed page on a wooden desk with a red pen and a cup of coffee beside it, soft morning light","A stack of handwritten papers with blue ink on a white table, a dictionary open nearby"],"image_desc_en":"A typed page on a desk with a red pen and coffee cup, soft morning light.","image_desc_cn":"一张打印好的作文纸放在木桌上，旁边有红笔和咖啡杯，晨光柔和。","meaning_cn":"n. 文章；短文；散文；论文","usage":"n. (可数名词，复数 essays)","collocations":"write an essay, essay topic, short essay, essay contest","preposition_combos":"essay on/about sth","examples":[{"en":"I need to write an essay about my summer vacation.","cn":"我需要写一篇关于暑假的作文。"},{"en":"Her essay on environmental protection won first prize.","cn":"她关于环境保护的作文获得了一等奖。"}],"socratic_questions":[{"question":"老师让你写一篇关于‘我的梦想’的短文，大概300词，这种文体叫什么？","answer_hint":"这个词通常指学校布置的短文或作文，不是诗歌或小说。"}],"fill_blank":{"sentences":["She spent two hours finishing her ___ on Chinese history."],"options":["essay","novel","poem","diary"],"correct_index":0},"audio":"audio/essay.mp3","audio_ex0":"audio/essay_ex0.mp3","audio_ex1":"audio/essay_ex1.mp3"},{"word":"classic","ipa":"/ˈklæsɪk/","image_prompts":["An old leather-bound book with gold lettering on a library shelf, dust particles in sunlight","A vintage black-and-white film poster on a brick wall with faded edges"],"image_desc_en":"An old leather-bound book with gold lettering on a library shelf, dust in sunlight.","image_desc_cn":"一本旧皮装书，烫金书名放在图书馆书架上，阳光中飘着灰尘。","meaning_cn":"adj. 经典的；典型的；n. 经典作品","usage":"adj. (无比较级) / n. (可数名词，复数 classics)","collocations":"classic novel, classic example, classic style, modern classic","preposition_combos":"a classic of literature","examples":[{"en":"This classic novel is still popular among young readers.","cn":"这本经典小说在年轻读者中仍然很受欢迎。"},{"en":"The teacher gave us a classic example of cause and effect.","cn":"老师给我们举了一个因果关系的经典例子。"}],"socratic_questions":[{"question":"有一本书出版了几十年，至今还被很多人阅读和推荐，我们通常怎么形容它？","answer_hint":"这个词表示经过时间考验、具有持久价值的作品或事物。"}],"fill_blank":{"sentences":["The movie is a ___ of science fiction from the 1980s."],"options":["classic","new","boring","short"],"correct_index":0},"audio":"audio/classic.mp3","audio_ex0":"audio/classic_ex0.mp3","audio_ex1":"audio/classic_ex1.mp3"},{"word":"keep on doing sth","ipa":"/kiːp ɒn ˈduːɪŋ ˈsʌmθɪŋ/","image_prompts":["A clock on a wall with its hands spinning fast, a stack of books growing taller beside it","A treadmill with worn-out shoes on it, a water bottle half-empty, sweat drops on the floor"],"image_desc_en":"A clock with fast-spinning hands and a growing stack of books beside it.","image_desc_cn":"墙上时钟指针快速旋转，旁边一摞书越堆越高。","meaning_cn":"继续做某事；坚持做某事","usage":"v. (keep on doing sth，过去式 kept on doing sth，过去分词 kept on doing sth)","collocations":"keep on trying, keep on practicing, keep on working","preposition_combos":"keep on + v-ing","examples":[{"en":"You should keep on practicing English every day.","cn":"你应该坚持每天练习英语。"},{"en":"Even though it was hard, he kept on running.","cn":"尽管很难，他仍然坚持跑步。"}],"socratic_questions":[{"question":"你背单词背到一半觉得很累，但你想提醒自己不要停下来，应该用哪个短语？","answer_hint":"这个短语强调‘持续进行某个动作，不中断’。"}],"fill_blank":{"sentences":["If you want to improve, you must ___ ___ practicing every day."],"options":["keep on","give up","put off","look for"],"correct_index":0},"audio":"audio/keep_on_doing_sth.mp3","audio_ex0":"audio/keep_on_doing_sth_ex0.mp3","audio_ex1":"audio/keep_on_doing_sth_ex1.mp3"},{"word":"make sure","ipa":"/meɪk ʃʊr/","image_prompts":["A checklist on a clipboard with a red checkmark next to each item, a pen lying on top","A locked padlock on a metal door, a key hanging on a hook nearby"],"image_desc_en":"A clipboard checklist with red checkmarks and a pen on top.","image_desc_cn":"一块带检查清单的书写板，每项旁有红色对勾，上面放着一支笔。","meaning_cn":"确保；确认；查明","usage":"v. (make sure，过去式 made sure，过去分词 made sure)","collocations":"make sure that..., make sure of sth, make sure to do sth","preposition_combos":"make sure of sth / make sure that + 从句","examples":[{"en":"Please make sure you lock the door before leaving.","cn":"离开前请确保锁好门。"},{"en":"Make sure to bring your ID card to the exam.","cn":"确保带身份证去考试。"}],"socratic_questions":[{"question":"考试前你检查了两次铅笔和橡皮，你是在做什么？","answer_hint":"这个短语表示‘确认某事无误或已经完成’。"}],"fill_blank":{"sentences":["___ ___ you have all the materials before the test starts."],"options":["Make sure","Look for","Think about","Give up"],"correct_index":0},"audio":"audio/make_sure.mp3","audio_ex0":"audio/make_sure_ex0.mp3","audio_ex1":"audio/make_sure_ex1.mp3"},{"word":"try one","ipa":"/traɪ wʌn/","image_prompts":["A single red apple on a wooden table with a bite taken out, bright natural light","A closed book with a bookmark sticking out, resting on a desk next to a cup of tea"],"image_desc_en":"A single red apple with a bite taken out on a wooden table, bright natural light; a closed book with a bookmark on a desk next to a cup of tea","image_desc_cn":"一个被咬了一口的红苹果放在木桌上，明亮自然光；一本带书签的合上的书放在桌旁，旁边有一杯茶","meaning_cn":"尝试一个；试一下","usage":"v. (过去式 tried, 过去分词 tried) 尝试；试","collocations":"try one's best, try one's luck, try one's hand at","preposition_combos":"try for, try on, try out","examples":[{"en":"You should try one of these fresh cookies.","cn":"你应该尝一块这些新鲜饼干。"},{"en":"I will try one more time to solve the math problem.","cn":"我会再试一次解这道数学题。"}],"socratic_questions":[{"question":"朋友带来一盒新口味的饼干，你想尝一块，该用什么短语表达？","answer_hint":"用'try one'表示尝试其中一个，强调数量为一。"}],"fill_blank":{"sentences":["Why not ___ of these delicious cakes?"],"options":["try one","try two","try all","try none"],"correct_index":0},"audio":"audio/try_one.mp3","audio_ex0":"audio/try_one_ex0.mp3","audio_ex1":"audio/try_one_ex1.mp3"},{"word":"literature","ipa":"/ˈlɪtərətʃər/","image_prompts":["A stack of classic novels with worn covers on a wooden shelf, soft library lighting","An open poetry book with a dried flower pressed between pages, on a windowsill"],"image_desc_en":"A stack of classic novels with worn covers on a wooden shelf, soft library lighting; an open poetry book with a dried flower pressed between pages on a windowsill","image_desc_cn":"一堆经典小说放在木书架上，封面磨损，柔和图书馆灯光；一本打开的诗集，书页间夹着一朵干花，放在窗台上","meaning_cn":"文学；文学作品","usage":"n. 不可数名词","collocations":"classic literature, modern literature, English literature, literature class","preposition_combos":"literature about, literature from","examples":[{"en":"We read classic literature in our English class.","cn":"我们在英语课上阅读经典文学。"},{"en":"This library has a large collection of world literature.","cn":"这个图书馆有大量的世界文学收藏。"}],"socratic_questions":[{"question":"英语课上老师让大家读《小王子》和《老人与海》，这些书属于哪一类？","answer_hint":"这些是文学作品，用'literature'表示文学或文学作品的总称。"}],"fill_blank":{"sentences":["She enjoys reading Chinese ___ in her free time."],"options":["literature","science","history","math"],"correct_index":0},"audio":"audio/literature.mp3","audio_ex0":"audio/literature_ex0.mp3","audio_ex1":"audio/literature_ex1.mp3"},{"word":"athlete","ipa":"/ˈæθliːt/","image_prompts":["A pair of running shoes on a track with worn soles, morning sunlight","A gold medal hanging on a ribbon against a blurred stadium background"],"image_desc_en":"A pair of running shoes on a track with worn soles, morning sunlight; a gold medal hanging on a ribbon against a blurred stadium background","image_desc_cn":"一双跑鞋放在跑道上，鞋底磨损，晨光照射；一枚金牌挂在绶带上，背景是模糊的体育场","meaning_cn":"运动员","usage":"n. 可数名词 (复数 athletes)","collocations":"professional athlete, Olympic athlete, school athlete, athlete training","preposition_combos":"athlete in, athlete from","examples":[{"en":"The athlete trains every day to improve her speed.","cn":"这位运动员每天训练以提高速度。"},{"en":"Many young athletes dream of winning a gold medal.","cn":"许多年轻运动员梦想赢得金牌。"}],"socratic_questions":[{"question":"学校运动会上，参加跑步比赛的同学每天放学后都去操场练习，他们被称为什么？","answer_hint":"参加体育比赛的人叫'athlete'，强调运动训练和比赛身份。"}],"fill_blank":{"sentences":["The ___ broke the school record in the 100-meter race."],"options":["athlete","teacher","doctor","driver"],"correct_index":0},"audio":"audio/athlete.mp3","audio_ex0":"audio/athlete_ex0.mp3","audio_ex1":"audio/athlete_ex1.mp3"},{"word":"photographer","ipa":"/fəˈtɒɡrəfər/","image_prompts":["A camera on a tripod in a field of wildflowers, golden sunset light","A stack of printed photographs on a wooden table, showing landscapes and cityscapes"],"image_desc_en":"A camera on a tripod in a field of wildflowers, golden sunset light; a stack of printed photographs on a wooden table, showing landscapes and cityscapes","image_desc_cn":"一台相机放在三脚架上，位于野花丛中，金色夕阳；一堆打印照片放在木桌上，展示风景和城市景观","meaning_cn":"摄影师；摄影者","usage":"n. 可数名词 (复数 photographers)","collocations":"professional photographer, amateur photographer, wildlife photographer, travel photographer","preposition_combos":"photographer for, photographer of","examples":[{"en":"The photographer took amazing pictures of the sunset.","cn":"摄影师拍下了令人惊叹的日落照片。"},{"en":"My uncle is a photographer for a nature magazine.","cn":"我叔叔是一家自然杂志的摄影师。"}],"socratic_questions":[{"question":"学校摄影社团的同学经常带着相机去公园拍花和鸟，他们被称为什么？","answer_hint":"拍照的人叫'photographer'，强调摄影作为职业或爱好。"}],"fill_blank":{"sentences":["The ___ captured the beauty of the old bridge in his photo."],"options":["photographer","painter","writer","singer"],"correct_index":0},"audio":"audio/photographer.mp3","audio_ex0":"audio/photographer_ex0.mp3","audio_ex1":"audio/photographer_ex1.mp3"},{"word":"painter","ipa":"/ˈpeɪntər/","image_prompts":["A paintbrush resting on a wooden palette with fresh oil paints in red, blue, and yellow, natural light from a window","A half-finished landscape painting on an easel in a bright studio, paint tubes scattered on a table"],"image_desc_en":"A paintbrush on a palette with colorful paints; a landscape painting on an easel with paint tubes.","image_desc_cn":"画笔和调色板上的彩色颜料；画架上的风景画和散落的颜料管。","meaning_cn":"画家；油漆工","usage":"n. (可数名词) 指从事绘画艺术的人或粉刷墙壁的工人","collocations":"a famous painter, a house painter, become a painter","preposition_combos":"painter of (e.g., a painter of landscapes)","examples":[{"en":"My uncle is a painter who loves to paint mountains.","cn":"我叔叔是一位喜欢画山的画家。"},{"en":"The painter used bright colors for the school wall.","cn":"油漆工用明亮的颜色粉刷学校墙壁。"}],"socratic_questions":[{"question":"小明在美术课上用画笔和颜料画了一幅风景画，大家说他将来可以成为什么职业？","answer_hint":"这个职业和画画有关，用画笔和颜料创作作品。"}],"fill_blank":{"sentences":["The ___ mixed blue and yellow to make green on the canvas."],"options":["painter","teacher","doctor","driver"],"correct_index":0},"audio":"audio/painter.mp3","audio_ex0":"audio/painter_ex0.mp3","audio_ex1":"audio/painter_ex1.mp3"},{"word":"businessman","ipa":"/ˈbɪznəsmæn/","image_prompts":["A leather briefcase open on a polished wooden desk, papers and a laptop inside, a cup of coffee beside it","A stack of dollar bills and a calculator on a glass office table, a pen and a notepad nearby"],"image_desc_en":"An open briefcase with papers and laptop on a desk; a stack of money and calculator on a glass table.","image_desc_cn":"桌上打开的公文包里有文件和笔记本电脑；玻璃桌上的钞票和计算器。","meaning_cn":"商人；企业家","usage":"n. (可数名词) 指从事商业活动的人，尤指男性","collocations":"a successful businessman, become a businessman, a local businessman","preposition_combos":"businessman from (e.g., a businessman from Shanghai)","examples":[{"en":"That businessman often travels to different cities for work.","cn":"那位商人经常去不同的城市出差。"},{"en":"My father wants to be a businessman and open his own shop.","cn":"我父亲想成为一名商人，开一家自己的店。"}],"socratic_questions":[{"question":"李叔叔每天穿着西装去办公室，经常开会和谈生意，他从事什么职业？","answer_hint":"这个职业和做生意、谈合同有关，经常在办公室或出差。"}],"fill_blank":{"sentences":["The ___ signed a contract to sell 100 computers to the school."],"options":["businessman","painter","actress","lawyer"],"correct_index":0},"audio":"audio/businessman.mp3","audio_ex0":"audio/businessman_ex0.mp3","audio_ex1":"audio/businessman_ex1.mp3"},{"word":"actress","ipa":"/ˈæktrəs/","image_prompts":["A theater stage with red curtains and a spotlight shining on a single microphone stand","A movie clapperboard with the words 'Scene 1 Take 2' written on it, a film camera in the background"],"image_desc_en":"A stage with red curtains and a spotlight; a clapperboard with film camera in background.","image_desc_cn":"红色幕布的舞台和聚光灯；写着场次的场记板和背景中的摄影机。","meaning_cn":"女演员","usage":"n. (可数名词) 指在戏剧、电影或电视中扮演角色的女性","collocations":"a famous actress, become an actress, a movie actress","preposition_combos":"actress in (e.g., an actress in a film)","examples":[{"en":"The young actress practiced her lines every day after school.","cn":"那位年轻女演员每天放学后练习台词。"},{"en":"She dreams of becoming an actress in Hollywood one day.","cn":"她梦想有一天成为好莱坞的女演员。"}],"socratic_questions":[{"question":"小红在学校的戏剧节上扮演了白雪公主，大家都说她演得很好，她将来可能成为什么？","answer_hint":"这个职业是在舞台上或电影里扮演角色，而且是女性。"}],"fill_blank":{"sentences":["The ___ won an award for her role in the movie."],"options":["actress","actor","painter","businessman"],"correct_index":0},"audio":"audio/actress.mp3","audio_ex0":"audio/actress_ex0.mp3","audio_ex1":"audio/actress_ex1.mp3"},{"word":"lawyer","ipa":"/ˈlɔːjər/","image_prompts":["A wooden gavel on a polished judge's bench next to a stack of law books with gold lettering","A pair of reading glasses on an open legal document with a pen and a cup of tea on a desk"],"image_desc_en":"A gavel on a judge's bench with law books; glasses on an open legal document with a pen.","image_desc_cn":"法官席上的木槌和法律书籍；眼镜放在打开的法律文件上，旁边有笔。","meaning_cn":"律师","usage":"n. (可数名词) 指提供法律咨询或代表客户出庭的专业人士","collocations":"a good lawyer, become a lawyer, hire a lawyer","preposition_combos":"lawyer for (e.g., a lawyer for the company)","examples":[{"en":"The lawyer explained the rules of the contract to us.","cn":"律师向我们解释了合同的规则。"},{"en":"My cousin works as a lawyer in a big city office.","cn":"我的表姐在大城市的一家事务所做律师。"}],"socratic_questions":[{"question":"王叔叔在法庭上帮别人辩护，他穿着西装，手里拿着很多法律文件，他是什么职业？","answer_hint":"这个职业和法律有关，在法庭上为别人辩护或提供法律建议。"}],"fill_blank":{"sentences":["The ___ helped the family win the case in court."],"options":["lawyer","doctor","teacher","painter"],"correct_index":0},"audio":"audio/lawyer.mp3","audio_ex0":"audio/lawyer_ex0.mp3","audio_ex1":"audio/lawyer_ex1.mp3"},{"word":"law","ipa":"/lɔː/","image_prompts":["A gavel resting on a wooden judge's bench with an open law book beside it, courtroom setting","A stack of thick legal documents tied with red ribbon on a polished oak table, soft natural light"],"image_desc_en":"A gavel on a wooden bench with an open law book, courtroom setting.","image_desc_cn":"木制法官席上的法槌和一本打开的法律书，法庭场景。","meaning_cn":"法律；法规","usage":"n. (可数名词，常作单数或复数 laws)","collocations":"break the law, obey the law, pass a law, by law","preposition_combos":"under the law, against the law","examples":[{"en":"It is against the law to drive without a license.","cn":"无证驾驶是违法的。"},{"en":"Our school has a strict law about using phones in class.","cn":"我们学校有关于课堂上使用手机的严格规定。"}],"socratic_questions":[{"question":"小明在街上骑自行车闯红灯，交警叔叔说他的行为违反了城市里的什么规则？","answer_hint":"这个词指国家或地方制定的正式规则，违反会有惩罚，不是校规或家规。"}],"fill_blank":{"sentences":["Driving after drinking alcohol is against the ___ in most countries."],"options":["law","rule","habit","order"],"correct_index":0},"audio":"audio/law.mp3","audio_ex0":"audio/law_ex0.mp3","audio_ex1":"audio/law_ex1.mp3"},{"word":"ahead","ipa":"/əˈhɛd/","image_prompts":["A winding road stretching far into the distance with a small signpost reading 'Next Town 5 km' at the foreground","A row of green traffic lights glowing brightly against a dark night sky, empty intersection"],"image_desc_en":"A winding road stretching into the distance with a signpost, indicating forward direction.","image_desc_cn":"一条蜿蜒伸向远方的道路，前景有路标，指示前方方向。","meaning_cn":"在前面；向前；提前","usage":"adv.","collocations":"go ahead, look ahead, ahead of time, ahead of schedule","preposition_combos":"ahead of","examples":[{"en":"Finish your homework ahead of time so you can relax later.","cn":"提前完成作业，这样你之后可以放松。"},{"en":"The finish line is just 100 meters ahead on the track.","cn":"终点线就在跑道前方100米处。"}],"socratic_questions":[{"question":"运动会跑步比赛时，你看到终点线还在你前方很远，老师喊你继续努力，该用哪个词描述终点线的位置？","answer_hint":"这个词表示在空间或时间上处于更靠前的位置，不是后面也不是旁边。"}],"fill_blank":{"sentences":["If you want to get good seats, you should arrive ___ of the show time."],"options":["ahead","behind","beside","below"],"correct_index":0},"audio":"audio/ahead.mp3","audio_ex0":"audio/ahead_ex0.mp3","audio_ex1":"audio/ahead_ex1.mp3"},{"word":"put out","ipa":"/pʊt aʊt/","image_prompts":["A fire extinguisher spraying white foam onto a small campfire, flames shrinking and smoke rising","A hand placing a lit candle upside down into a jar, the flame suffocating and disappearing"],"image_desc_en":"A fire extinguisher spraying foam onto a campfire, flames shrinking with smoke.","image_desc_cn":"灭火器向篝火喷射泡沫，火焰缩小并冒烟。","meaning_cn":"扑灭；熄灭；关掉（灯）","usage":"v. (短语动词，及物，可分开用 put sth out) (过去式 put out, 过去分词 put out)","collocations":"put out a fire, put out the lights, put out a cigarette","preposition_combos":"put out + 宾语","examples":[{"en":"Please put out the lights before you leave the classroom.","cn":"离开教室前请关灯。"},{"en":"The firefighters worked hard to put out the big forest fire.","cn":"消防员们努力扑灭了那场森林大火。"}],"socratic_questions":[{"question":"野餐结束后，你们用沙子盖住了篝火的余烬，让火不再燃烧，这个动作叫什么？","answer_hint":"这是一个由两个词组成的动词短语，意思是让火或光停止存在。"}],"fill_blank":{"sentences":["Remember to ___ the candles before going to bed."],"options":["put out","take out","turn on","pick up"],"correct_index":0},"audio":"audio/put_out.mp3","audio_ex0":"audio/put_out_ex0.mp3","audio_ex1":"audio/put_out_ex1.mp3"},{"word":"design","ipa":"/dɪˈzaɪn/","image_prompts":["A sketchbook open to a page with detailed pencil drawings of a modern chair, ruler and eraser nearby","A blueprint of a small house spread on a drafting table, with compass and colored pencils"],"image_desc_en":"A sketchbook open to pencil drawings of a modern chair with drafting tools nearby.","image_desc_cn":"一本打开的速写本，上面有现代椅子的铅笔素描，旁边有绘图工具。","meaning_cn":"设计；构思","usage":"v. (过去式 designed, 过去分词 designed) / n. (可数名词，设计图/方案)","collocations":"design a poster, design a website, fashion design, by design","preposition_combos":"design for, design of","examples":[{"en":"Our art class will design a poster for the school music festival.","cn":"我们的美术课将为学校音乐节设计一张海报。"},{"en":"The design of this new library includes a large reading area.","cn":"这个新图书馆的设计包含一个大的阅读区。"}],"socratic_questions":[{"question":"学校要举办科技节，需要一张漂亮的海报来宣传，美术老师让大家先画出海报的草图，这个创作过程叫什么？","answer_hint":"这个词指在制作之前先构思并画出方案，可以是动词也可以是名词。"}],"fill_blank":{"sentences":["Who ___ the logo for our school sports team?"],"options":["designed","drew","painted","wrote"],"correct_index":0},"audio":"audio/design.mp3","audio_ex0":"audio/design_ex0.mp3","audio_ex1":"audio/design_ex1.mp3"},{"word":"bridge","ipa":"/brɪdʒ/","image_prompts":["A stone arch bridge over a calm river with autumn trees reflected in the water, no people","A wooden bridge crossing a small stream in a forest, sunlight filtering through leaves, no people"],"image_desc_en":"A stone arch bridge over a calm river with autumn trees reflected in the water, no people","image_desc_cn":"一座石拱桥横跨平静的河流，秋树倒映在水中，无人","meaning_cn":"桥；桥梁；沟通","usage":"n. (可数名词) 桥；v. (过去式 bridged, 过去分词 bridged) 架桥；弥合差距","collocations":"build a bridge, cross a bridge, bridge the gap","preposition_combos":"bridge over, bridge between","examples":[{"en":"We need to build a bridge over the river.","cn":"我们需要在河上建一座桥。"},{"en":"This activity can bridge the gap between teachers and students.","cn":"这项活动可以弥合师生之间的隔阂。"}],"socratic_questions":[{"question":"你想连接河的两岸，方便大家通行，需要建造什么结构？","answer_hint":"这个词指横跨河流或道路的建筑物，也比喻连接不同事物。"}],"fill_blank":{"sentences":["The old stone ___ has stood here for over a hundred years."],"options":["bridge","tunnel","tower","wall"],"correct_index":0},"audio":"audio/bridge.mp3","audio_ex0":"audio/bridge_ex0.mp3","audio_ex1":"audio/bridge_ex1.mp3"},{"word":"final","ipa":"/ˈfaɪnəl/","image_prompts":["A calendar page with December 31 circled in red, a clock showing midnight, no people","A stack of exam papers with a red checkmark on the top sheet, no people"],"image_desc_en":"A calendar page with December 31 circled in red, a clock showing midnight, no people","image_desc_cn":"一张日历页，12月31日被红圈标出，时钟指向午夜，无人","meaning_cn":"最后的；最终的；决赛","usage":"adj. 最后的；n. (可数名词) 决赛；期末考试","collocations":"final exam, final decision, final match","preposition_combos":"final for, final in","examples":[{"en":"The final exam will cover all units this term.","cn":"期末考试将涵盖本学期所有单元。"},{"en":"Our team won the final match last Saturday.","cn":"我们队上周六赢了决赛。"}],"socratic_questions":[{"question":"学期结束前，你要参加一次最重要的考试，它叫什么？","answer_hint":"这个词表示‘最后的’，常用来描述学期末的考试或比赛的最后一轮。"}],"fill_blank":{"sentences":["She is preparing hard for the ___ exam next week."],"options":["final","midterm","daily","weekly"],"correct_index":0},"audio":"audio/final.mp3","audio_ex0":"audio/final_ex0.mp3","audio_ex1":"audio/final_ex1.mp3"},{"word":"confidence","ipa":"/ˈkɒnfɪdəns/","image_prompts":["A trophy on a wooden shelf with a golden shine, soft spotlight from above, no people","A stack of books with a glowing light bulb on top, library background, no people"],"image_desc_en":"A trophy on a wooden shelf with a golden shine, soft spotlight from above, no people","image_desc_cn":"木架上的奖杯闪着金光，上方有柔和聚光灯，无人","meaning_cn":"信心；自信；信任","usage":"n. (不可数名词) 信心；自信","collocations":"have confidence in, build confidence, lose confidence","preposition_combos":"confidence in","examples":[{"en":"Practice can help you build confidence in speaking English.","cn":"练习能帮你建立说英语的信心。"},{"en":"She has great confidence in her ability to solve problems.","cn":"她对自己解决问题的能力很有信心。"}],"socratic_questions":[{"question":"你相信自己能做好一件事，这种内心的感觉叫什么？","answer_hint":"这个词表示对自己或他人的信任和把握，常与‘have’或‘build’搭配。"}],"fill_blank":{"sentences":["With enough practice, you will gain ___ in your math skills."],"options":["confidence","knowledge","experience","courage"],"correct_index":0},"audio":"audio/confidence.mp3","audio_ex0":"audio/confidence_ex0.mp3","audio_ex1":"audio/confidence_ex1.mp3"},{"word":"draw to a close","ipa":"/drɔː tuː ə kləʊz/","image_prompts":["A sunset over a calm sea, the sun half below the horizon, orange and purple sky, no people","An hourglass with most sand in the bottom bulb, wooden table, no people"],"image_desc_en":"A sunset over a calm sea, the sun half below the horizon, orange and purple sky, no people","image_desc_cn":"平静海面上的日落，太阳半沉入地平线，橙紫色天空，无人","meaning_cn":"接近尾声；即将结束","usage":"短语动词 (draw 的过去式 drew, 过去分词 drawn) 表示某事逐渐结束","collocations":"draw to a close, draw near to a close","preposition_combos":"无固定介词搭配","examples":[{"en":"The summer vacation is drawing to a close next week.","cn":"暑假下周就要结束了。"},{"en":"As the concert drew to a close, everyone felt happy.","cn":"音乐会接近尾声时，大家都感到开心。"}],"socratic_questions":[{"question":"暑假快要结束了，你该收拾心情准备开学。这个‘快要结束’怎么说？","answer_hint":"这是一个短语，字面意思是‘拉向结束’，常用于描述活动或时期逐渐结束。"}],"fill_blank":{"sentences":["The school year is ___ ___ ___ ___, and students are preparing for exams."],"options":["drawing to a close","starting over","going on","breaking up"],"correct_index":0},"audio":"audio/draw_to_a_close.mp3","audio_ex0":"audio/draw_to_a_close_ex0.mp3","audio_ex1":"audio/draw_to_a_close_ex1.mp3"},{"word":"form","ipa":"/fɔːrm/","image_prompts":["A blank paper form with empty rectangular fields and a pen lying on a wooden desk, soft natural lighting","A stack of printed application forms clipped together on a clipboard, with a coffee cup nearby"],"image_desc_en":"A blank paper form with empty rectangular fields and a pen lying on a wooden desk, soft natural lighting","image_desc_cn":"一张空白表格，带有矩形空白栏，一支笔放在木桌上，柔和的自然光","meaning_cn":"表格；形成","usage":"n. / v. (过去式 formed, 过去分词 formed)","collocations":"fill in a form, form a habit, in the form of","preposition_combos":"form of, form into","examples":[{"en":"Please fill in this form with your name and address.","cn":"请用你的姓名和地址填写这张表格。"},{"en":"Good study habits form over time with practice.","cn":"良好的学习习惯通过练习会逐渐形成。"}],"socratic_questions":[{"question":"老师发了一张纸，上面有很多空白栏需要你写名字、班级和电话，这张纸叫什么？","answer_hint":"这个词指需要填写信息的书面文件，比如报名表或登记表。"}],"fill_blank":{"sentences":["Before the trip, we need to ___ a study group to prepare together."],"options":["form","break","find","draw"],"correct_index":0},"audio":"audio/form.mp3","audio_ex0":"audio/form_ex0.mp3","audio_ex1":"audio/form_ex1.mp3"},{"word":"relationship","ipa":"/rɪˈleɪʃnʃɪp/","image_prompts":["Two intertwined tree roots growing together in a forest, sunlight filtering through leaves","A pair of hands exchanging a small gift wrapped in brown paper, blurred background of a cozy room"],"image_desc_en":"Two intertwined tree roots growing together in a forest, sunlight filtering through leaves","image_desc_cn":"森林中两条交织在一起的树根，阳光透过树叶洒下","meaning_cn":"关系；联系","usage":"n.","collocations":"build a relationship, close relationship, family relationship","preposition_combos":"relationship with, relationship between","examples":[{"en":"A good relationship with classmates makes school life happier.","cn":"与同学的良好关系让学校生活更快乐。"},{"en":"Trust is important in any close relationship.","cn":"在任何亲密关系中，信任都很重要。"}],"socratic_questions":[{"question":"你和好朋友之间互相理解、互相帮助，这种联系叫什么？","answer_hint":"这个词描述两个人或事物之间的连接或纽带，比如朋友之间或家人之间。"}],"fill_blank":{"sentences":["The ___ between teachers and students should be based on respect."],"options":["relationship","distance","competition","silence"],"correct_index":0},"audio":"audio/relationship.mp3","audio_ex0":"audio/relationship_ex0.mp3","audio_ex1":"audio/relationship_ex1.mp3"},{"word":"push-up","ipa":"/ˈpʊʃ ʌp/","image_prompts":["A gym mat on a wooden floor with two handprints pressed into the surface, a water bottle nearby","A set of dumbbells and a stopwatch on a fitness bench, with a diagram showing arm movement for push-ups"],"image_desc_en":"A gym mat on a wooden floor with two handprints pressed into the surface, a water bottle nearby","image_desc_cn":"木地板上的健身垫，表面有两个手印，旁边放着一个水瓶","meaning_cn":"俯卧撑","usage":"n. (可数名词，复数 push-ups)","collocations":"do push-ups, twenty push-ups, push-up challenge","preposition_combos":"push-up on, push-up with","examples":[{"en":"He can do thirty push-ups without stopping for a rest.","cn":"他能不停歇地做三十个俯卧撑。"},{"en":"Doing push-ups every morning helps build arm strength.","cn":"每天早上做俯卧撑有助于增强手臂力量。"}],"socratic_questions":[{"question":"体育课上，老师让大家趴在地上，用手臂把身体撑起来再放下，这个动作叫什么？","answer_hint":"这是一个锻炼上肢力量的常见动作，身体像一条直线上下移动。"}],"fill_blank":{"sentences":["Our coach asked us to do twenty ___ before the warm-up run."],"options":["push-ups","sit-ups","jump ropes","stretches"],"correct_index":0},"audio":"audio/push-up.mp3","audio_ex0":"audio/push-up_ex0.mp3","audio_ex1":"audio/push-up_ex1.mp3"},{"word":"energeti 样重要的是，蓝队在比赛中表现出色。"}],"socratic_questions":[{"question":"你在总结发言时，想强调最后一个要点和前面的同样重要，该用什么短语开头？","answer_hint":"这个短语以‘最后’开头，但强调‘不次要’，常用于列举的结尾。"}],"fill_blank":{"sentences":["___, we must not forget to turn off the lights before leaving."],"options":["First of all","In addition","Last but not least","For example"],"correct_index":2},"audio":"audio/last_but_not_least.mp3","audio_ex0":"audio/last_but_not_least_ex0.mp3","audio_ex1":"audio/last_but_not_least_ex1.mp3"}]}]};</script>

function playAudioPath(path, fallbackText) {
  if (!path && fallbackText) { speakWord(fallbackText); return; }
  const urls = [];
  if (path) {
    if (path.startsWith("http")) urls.push(path);
    else {
      const rel = path.replace(/^Unit\d+\/?/, "");
      if (rel) urls.push(rel);
      const cos = mediaUrl(path);
      if (cos && urls.indexOf(cos) < 0) urls.push(cos);
    }
  }
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { if (fallbackText) speakWord(fallbackText); return; }
    const a = new Audio(urls[i++]);
    a.play().catch(tryNext);
  }
  tryNext();
}
function playWord() {

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}

      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {

function speakWord(word) {

      u.lang = "en-GB";
      window.speechSynthesis.speak(u);
    }
  }
  if (!synthesizer) { fallbackWebSpeech(); return; }
  synthesizer.speakTextAsync(w, function(result) {
    if (result && SpeechSDK.ResultReason.Canceled === result.reason && SpeechSDK.CancellationDetails) {
      var d = SpeechSDK.CancellationDetails.fromResult(result);
      if (d.reason === SpeechSDK.CancellationReason.Error) { console.warn("TTS Error:", d.errorDetails); fallbackWebSpeech(); }
    }
  }, function(e) { console.error("TTS:", e); fallbackWebSpeech(); });
}

    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
        rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
      alert("无法启动例句朗读评分：" + (err?.message || err));
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
