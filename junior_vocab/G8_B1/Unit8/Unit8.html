  <script>window.VOCAB_DATA={"units":[{"unit":8,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"communication","ipa":"/kəˌmjuːnɪˈkeɪʃən/","image_prompts":["Two walkie-talkies on a wooden table with antennas extended, red light blinking on one device","A smartphone screen showing a group chat interface with multiple colorful message bubbles and emojis"],"image_desc_en":"Two walkie-talkies on a wooden table with antennas extended, red light blinking on one device","image_desc_cn":"两个对讲机放在木桌上，天线伸出，其中一个红灯闪烁","meaning_cn":"交流；沟通；通讯","usage":"n. (不可数名词)","collocations":"good communication, communication skills, means of communication","preposition_combos":"communication with, communication between","examples":[{"en":"Good communication with parents helps solve many family problems.","cn":"与父母良好的沟通有助于解决许多家庭问题。"},{"en":"Email is a fast means of communication in modern life.","cn":"电子邮件是现代生活中一种快速的通讯方式。"}],"socratic_questions":[{"question":"你和朋友因为误会吵架了，你觉得缺少什么才导致这个问题？这个词不是‘对话’也不是‘争吵’。","answer_hint":"这个词强调信息传递和理解的过程，不是具体的对话动作。"}],"fill_blank":{"sentences":["Effective ___ is important for team projects at school."],"options":["communication","competition","celebration","conversation"],"correct_index":0},"audio":"audio/communication.mp3","audio_ex0":"audio/communication_ex0.mp3","audio_ex1":"audio/communication_ex1.mp3"},{"word":"face to face","ipa":"/feɪs tə feɪs/","image_prompts":["Two empty chairs facing each other in a bright living room with a coffee table between them","A pair of eyeglasses placed on a desk, directly opposite a small potted plant on the other side"],"image_desc_en":"Two empty chairs facing each other in a bright living room with a coffee table between them","image_desc_cn":"两把空椅子面对面放在明亮的客厅里，中间有一张咖啡桌","meaning_cn":"面对面地","usage":"adv. / adj. (常作状语或定语)","collocations":"talk face to face, meet face to face, face-to-face communication","preposition_combos":"无固定介词搭配","examples":[{"en":"We decided to talk face to face instead of texting.","cn":"我们决定面对面交谈而不是发短信。"},{"en":"A face-to-face meeting is better than a phone call.","cn":"面对面会议比打电话更好。"}],"socratic_questions":[{"question":"你和朋友在网上吵架了，你觉得哪种方式最能消除误会？不是打电话也不是发消息。","answer_hint":"这个词描述两个人直接见面、没有中间媒介的交流方式。"}],"fill_blank":{"sentences":["Sometimes it's better to discuss problems ___."],"options":["face to face","side by side","back to back","hand in hand"],"correct_index":0},"audio":"audio/face_to_face.mp3","audio_ex0":"audio/face_to_face_ex0.mp3","audio_ex1":"audio/face_to_face_ex1.mp3"},{"word":"text message","ipa":"/tekst ˈmesɪdʒ/","image_prompts":["A smartphone lying on a desk, screen showing a blue message bubble with the words 'See you at 5'","A white envelope with a small phone icon printed on it, next to a keyboard"],"image_desc_en":"A smartphone lying on a desk, screen showing a blue message bubble with the words 'See you at 5'","image_desc_cn":"一部智能手机放在桌上，屏幕显示蓝色消息气泡，写着‘5点见’","meaning_cn":"短信；文字消息","usage":"n. (可数名词，复数 text messages)","collocations":"send a text message, receive a text message, reply to a text message","preposition_combos":"text message from, text message to","examples":[{"en":"I sent a text message to remind my friend about the test.","cn":"我发了一条短信提醒朋友考试的事。"},{"en":"She received a text message with the homework assignment.","cn":"她收到了一条带有作业内容的短信。"}],"socratic_questions":[{"question":"你放学后想告诉妈妈晚点回家，但不想打电话，你会用什么方式？这个词不是‘邮件’也不是‘语音’。","answer_hint":"这个词指手机上用文字发送的短信息，通常不超过几百字。"}],"fill_blank":{"sentences":["He quickly typed a ___ to his classmate about the project."],"options":["text message","phone call","letter","postcard"],"correct_index":0},"audio":"audio/text_message.mp3","audio_ex0":"audio/text_message_ex0.mp3","audio_ex1":"audio/text_message_ex1.mp3"},{"word":"sign","ipa":"/saɪn/","image_prompts":["A red octagonal stop sign at a street corner with white letters 'STOP' and a metal pole","A yellow triangular warning sign with a black exclamation mark on a mountain road"],"image_desc_en":"A red octagonal stop sign at a street corner with white letters 'STOP' and a metal pole","image_desc_cn":"街角一个红色八角形停车标志，白色字母‘STOP’，金属杆支撑","meaning_cn":"标志；指示牌；迹象；手势","usage":"n. (可数名词) / v. (过去式 signed, 过去分词 signed)","collocations":"traffic sign, road sign, sign language, sign a document","preposition_combos":"sign for, sign of","examples":[{"en":"The traffic sign shows that we must turn left here.","cn":"交通标志显示我们必须在这里左转。"},{"en":"Dark clouds are a sign that rain is coming soon.","cn":"乌云是即将下雨的迹象。"}],"socratic_questions":[{"question":"你在马路上看到一个红色的八角形牌子，上面写着‘停’，这是什么？不是‘灯’也不是‘地图’。","answer_hint":"这个词指用来传递信息或指示的牌子、符号或手势。"}],"fill_blank":{"sentences":["The ___ at the park entrance says 'No smoking'."],"options":["sign","signal","symbol","sight"],"correct_index":0},"audio":"audio/sign.mp3","audio_ex0":"audio/sign_ex0.mp3","audio_ex1":"audio/sign_ex1.mp3"},{"word":"speaker","ipa":"/ˈspiːkər/","image_prompts":["A black wireless speaker on a wooden table, sound waves visualized as concentric rings in the air","A podium with a microphone and a glass of water in an empty conference room, spotlight on the podium"],"image_desc_en":"A black wireless speaker on a wooden table with visible sound wave rings around it.","image_desc_cn":"一个黑色无线音箱放在木桌上，周围有可见的声波环。","meaning_cn":"n. 演讲者；扬声器","usage":"n. (复数 speakers)","collocations":"guest speaker, loud speaker, main speaker","preposition_combos":"speaker at (a conference), speaker on (a topic)","examples":[{"en":"The guest speaker talked about saving the environment for an hour.","cn":"特邀演讲者就环境保护讲了一个小时。"},{"en":"Please turn up the speaker so everyone can hear the music.","cn":"请把扬声器音量调大，这样大家都能听到音乐。"}],"socratic_questions":[{"question":"学校举办英语演讲比赛，台上站着一个人正在对着话筒讲话，这个人的身份是什么？","answer_hint":"这个词既可以指发出声音的设备，也可以指在台上讲话的人。"}],"fill_blank":{"sentences":["The ___ gave a wonderful speech about teamwork at the school assembly."],"options":["speaker","singer","teacher","player"],"correct_index":0},"audio":"audio/speaker.mp3","audio_ex0":"audio/speaker_ex0.mp3","audio_ex1":"audio/speaker_ex1.mp3"},{"word":"rehearsal","ipa":"/rɪˈhɜːrsl/","image_prompts":["An empty theater stage with chairs arranged in a semicircle, sheet music scattered on the floor","A whiteboard with a rehearsal schedule written in marker, a clock showing 6:30 PM on the wall"],"image_desc_en":"An empty theater stage with chairs in a semicircle and sheet music on the floor.","image_desc_cn":"一个空荡荡的剧院舞台，椅子摆成半圆形，地上散落着乐谱。","meaning_cn":"n. 排练；彩排","usage":"n. (可数名词，复数 rehearsals)","collocations":"dress rehearsal, rehearsal room, rehearsal schedule","preposition_combos":"rehearsal for (a play), at rehearsal","examples":[{"en":"We have a rehearsal for the school play every Friday afternoon.","cn":"我们每周五下午为校园剧进行排练。"},{"en":"The dress rehearsal went smoothly without any mistakes.","cn":"带妆彩排进行得很顺利，没有任何失误。"}],"socratic_questions":[{"question":"下周就要上台表演了，今天全班同学放学后留在音乐教室反复练习歌曲和动作，这个活动叫什么？","answer_hint":"这个词指的是正式演出前的练习过程，不是正式演出。"}],"fill_blank":{"sentences":["The choir had a long ___ before the concert to make sure everything was perfect."],"options":["rehearsal","meeting","party","class"],"correct_index":0},"audio":"audio/rehearsal.mp3","audio_ex0":"audio/rehearsal_ex0.mp3","audio_ex1":"audio/rehearsal_ex1.mp3"},{"word":"show sb around","ipa":"/ʃoʊ ˈsʌmbədi əˈraʊnd/","image_prompts":["A red arrow sign pointing to a school building entrance, a welcome mat on the ground","An open door with a hallway visible inside, a map of the building pinned on a bulletin board"],"image_desc_en":"A red arrow sign pointing to a school building entrance with a welcome mat.","image_desc_cn":"一个红色箭头标志指向学校建筑入口，门口有欢迎垫。","meaning_cn":"v. 带领某人参观","usage":"v. (短语动词，show 的过去式 showed，过去分词 shown)","collocations":"show a visitor around, show a friend around the campus","preposition_combos":"show someone around + 地点","examples":[{"en":"My friend will show me around the new library after school.","cn":"我的朋友放学后会带我参观新图书馆。"},{"en":"The guide showed the tourists around the old castle yesterday.","cn":"导游昨天带领游客参观了那座古老的城堡。"}],"socratic_questions":[{"question":"新学期来了一个新同学，你作为班长带他走遍教学楼、操场和食堂，让他熟悉校园，这个动作叫什么？","answer_hint":"这个短语包含两个部分，一个是‘展示’，一个是‘各处’，合起来就是带人到处看看。"}],"fill_blank":{"sentences":["Could you please ___ the new student ___ the school?"],"options":["show...around","take...out","bring...in","look...for"],"correct_index":0},"audio":"audio/show_sb_around.mp3","audio_ex0":"audio/show_sb_around_ex0.mp3","audio_ex1":"audio/show_sb_around_ex1.mp3"},{"word":"show interest in sth","ipa":"/ʃoʊ ˈɪntrəst ɪn ˈsʌmθɪŋ/","image_prompts":["A magnifying glass resting on an open science textbook with a diagram of a plant cell","A stack of colorful travel brochures on a table, a globe in the background"],"image_desc_en":"A magnifying glass on an open science textbook showing a plant cell diagram.","image_desc_cn":"一个放大镜放在打开的科普课本上，显示植物细胞图。","meaning_cn":"v. 对某事表现出兴趣","usage":"v. (短语动词，show 的过去式 showed，过去分词 shown；interest 为不可数名词)","collocations":"show great interest in, show little interest in, show no interest in","preposition_combos":"show interest in + 名词/动名词","examples":[{"en":"She showed great interest in learning how to cook Chinese food.","cn":"她对学习做中餐表现出极大的兴趣。"},{"en":"Many students show interest in the school's new robotics club.","cn":"许多学生对学校新成立的机器人社团表现出兴趣。"}],"socratic_questions":[{"question":"你的同桌看到一本关于太空探索的书，立刻凑过去翻看，还问了很多问题，这说明他对太空什么？","answer_hint":"这个短语由‘展示’和‘兴趣’组成，后面用介词‘在……方面’。"}],"fill_blank":{"sentences":["Tom ___ great ___ in painting after visiting the art museum."],"options":["showed...interest in","had...fun with","took...part in","felt...worried about"],"correct_index":0},"audio":"audio/show_interest_in_sth.mp3","audio_ex0":"audio/show_interest_in_sth_ex0.mp3","audio_ex1":"audio/show_interest_in_sth_ex1.mp3"},{"word":"listener","ipa":"/ˈlɪs.ən.ər/","image_prompts":["A pair of wireless earphones resting on a wooden desk next to a steaming coffee mug, soft morning light","A vintage radio with a glowing dial and a small sign that says 'LISTENER' on the front, placed on a shelf"],"image_desc_en":"A pair of earphones on a desk with a coffee mug, or a vintage radio with a 'LISTENER' sign.","image_desc_cn":"一副耳机放在桌上，旁边有咖啡杯；或一台老式收音机，前面有‘听众’标志。","meaning_cn":"听众；倾听者","usage":"n. (可数名词，复数 listeners)","collocations":"good listener, radio listener, careful listener","preposition_combos":"listener to (music/radio)","examples":[{"en":"A good listener always makes friends feel understood and valued.","cn":"一个好的倾听者总能让朋友感到被理解和重视。"},{"en":"The radio show has millions of listeners around the country every night.","cn":"这个广播节目每晚有全国数百万听众。"}],"socratic_questions":[{"question":"当你的朋友向你倾诉烦恼时，你安静地听，不打断，别人会怎么形容你？","answer_hint":"这个词强调‘听’这个动作的执行者，而不是‘说话者’或‘观察者’。"}],"fill_blank":{"sentences":["She is a patient ___ who never interrupts others."],"options":["listener","speaker","writer","reader"],"correct_index":0},"audio":"audio/listener.mp3","audio_ex0":"audio/listener_ex0.mp3","audio_ex1":"audio/listener_ex1.mp3"},{"word":"point","ipa":"/pɔɪnt/","image_prompts":["A sharp red arrow pointing at a specific number on a whiteboard with math equations","A compass needle pointing north on a map spread across a wooden table"],"image_desc_en":"A red arrow pointing at a number on a whiteboard, or a compass needle pointing north on a map.","image_desc_cn":"红色箭头指向白板上的数字；或指南针指针指向地图上的北方。","meaning_cn":"点；要点；指向；表明","usage":"n. / v. (过去式 pointed, 过去分词 pointed)","collocations":"point out, point at, main point, point of view","preposition_combos":"point to, point at, point out","examples":[{"en":"Please point to the correct answer on the blackboard.","cn":"请指向黑板上的正确答案。"},{"en":"The main point of the story is to be honest with friends.","cn":"这个故事的主旨是对朋友要诚实。"}],"socratic_questions":[{"question":"老师让你在图表上找出温度最高的那一天，你需要做什么动作？","answer_hint":"这个动作是用手指或指示物‘指向’某个具体位置，而不是‘画’或‘写’。"}],"fill_blank":{"sentences":["Can you ___ to the capital city on this map?"],"options":["point","draw","write","read"],"correct_index":0},"audio":"audio/point.mp3","audio_ex0":"audio/point_ex0.mp3","audio_ex1":"audio/point_ex1.mp3"},{"word":"surely","ipa":"/ˈʃʊr.li/","image_prompts":["A clear blue sky with a bright sun and a wooden sign that reads 'SURELY' in bold letters","A completed jigsaw puzzle with the last piece being placed, all pieces perfectly fitted"],"image_desc_en":"A bright blue sky with a sun and a 'SURELY' sign, or a completed jigsaw puzzle with the last piece placed.","image_desc_cn":"晴朗蓝天和太阳下写着‘肯定’的木牌；或最后一块拼图完美嵌入的完整拼图。","meaning_cn":"肯定地；无疑地","usage":"adv. (副词，修饰动词或整个句子)","collocations":"surely will, surely know, surely can","preposition_combos":"无固定介词搭配","examples":[{"en":"If you practice every day, you will surely improve your English.","cn":"如果你每天练习，你的英语肯定会提高。"},{"en":"The sun will surely rise again tomorrow morning.","cn":"明天早上太阳肯定会再次升起。"}],"socratic_questions":[{"question":"你非常确定明天会下雨，你会用什么词来表达这种‘毫无疑问’的语气？","answer_hint":"这个词表示‘肯定地’，比‘maybe’或‘probably’语气强得多，表示完全相信。"}],"fill_blank":{"sentences":["With enough hard work, you will ___ succeed in the exam."],"options":["surely","maybe","never","hardly"],"correct_index":0},"audio":"audio/surely.mp3","audio_ex0":"audio/surely_ex0.mp3","audio_ex1":"audio/surely_ex1.mp3"},{"word":"continue","ipa":"/kənˈtɪn.juː/","image_prompts":["A marathon runner's bib number pinned to a running shoe on a track, with a long road stretching ahead","A clock showing 11:59 with a hand moving toward 12:00, symbolizing time moving forward without stopping"],"image_desc_en":"A running shoe with a bib on a track and a long road ahead, or a clock hand moving toward 12:00.","image_desc_cn":"跑鞋上别着号码布，前方是长长的跑道；或时钟指针走向12点，象征时间不停前进。","meaning_cn":"继续；持续","usage":"v. (过去式 continued, 过去分词 continued)","collocations":"continue to do, continue doing, continue with","preposition_combos":"continue with, continue to","examples":[{"en":"After a short break, the class will continue the discussion.","cn":"短暂休息后，课堂将继续讨论。"},{"en":"The rain may continue for the whole weekend.","cn":"雨可能会持续整个周末。"}],"socratic_questions":[{"question":"你正在写作文，下课铃响了，但你还差一段没写完，老师让你‘接着写’，用哪个动词？","answer_hint":"这个词表示‘不停下来，接着做下去’，而不是‘开始’或‘结束’。"}],"fill_blank":{"sentences":["Please ___ reading the text from where you stopped."],"options":["continue","stop","start","finish"],"correct_index":0},"audio":"audio/continue.mp3","audio_ex0":"audio/continue_ex0.mp3","audio_ex1":"audio/continue_ex1.mp3"},{"word":"impolite","ipa":"/ˌɪmpəˈlaɪt/","image_prompts":["A hand with a finger pointing directly at a camera lens, harsh shadows, red background","A plate of food with a fork stabbing aggressively into a piece of meat, crumbs scattered"],"image_desc_en":"A hand pointing rudely at a camera lens with a red warning background.","image_desc_cn":"一只手粗鲁地指向相机镜头，红色警告背景。","meaning_cn":"不礼貌的","usage":"adj. (比较级 more impolite, 最高级 most impolite)","collocations":"impolite behavior, impolite to do sth","preposition_combos":"impolite to (sb)","examples":[{"en":"It is impolite to talk with your mouth full of food.","cn":"嘴里塞满食物说话是不礼貌的。"},{"en":"His impolite words made everyone in the room feel angry.","cn":"他不礼貌的话让房间里每个人都感到生气。"}],"socratic_questions":[{"question":"在餐厅里，有人大声打电话，不顾周围人感受。这种行为可以用什么形容词来描述？","answer_hint":"这个词描述的是缺乏基本礼貌、让人不舒服的行为，与'礼貌'相反。"}],"fill_blank":{"sentences":["It is ___ to interrupt others when they are speaking."],"options":["impolite","polite","important","impossible"],"correct_index":0},"audio":"audio/impolite.mp3","audio_ex0":"audio/impolite_ex0.mp3","audio_ex1":"audio/impolite_ex1.mp3"},{"word":"personal","ipa":"/ˈpɜːrsənl/","image_prompts":["A closed diary with a small padlock on a wooden desk, soft sunlight from a window","A toothbrush and a tube of toothpaste placed neatly on a bathroom sink"],"image_desc_en":"A locked diary on a wooden desk with soft window light.","image_desc_cn":"一本带小锁的日记本放在木桌上，窗外柔光照射。","meaning_cn":"个人的；私人的","usage":"adj. (副词 personally)","collocations":"personal information, personal opinion, personal space","preposition_combos":"personal to (sb)","examples":[{"en":"You should not ask others about their personal information.","cn":"你不应该询问他人的个人信息。"},{"en":"This diary contains my personal thoughts and feelings.","cn":"这本日记包含我个人的想法和感受。"}],"socratic_questions":[{"question":"在网上注册账号时，网站要求填写姓名、地址和电话号码。这些信息属于什么类型？","answer_hint":"这个词指只属于某个人自己、不愿公开的信息或物品。"}],"fill_blank":{"sentences":["Please keep your ___ belongings safe at school."],"options":["personal","public","popular","physical"],"correct_index":0},"audio":"audio/personal.mp3","audio_ex0":"audio/personal_ex0.mp3","audio_ex1":"audio/personal_ex1.mp3"},{"word":"argue with sb","ipa":"/ˈɑːrɡjuː wɪð ˈsʌmbədi/","image_prompts":["Two speech bubbles with angry symbols like lightning bolts between them, red background","A broken pencil lying on a torn piece of paper with crossed-out words"],"image_desc_en":"Two speech bubbles with lightning bolts between them on a red background.","image_desc_cn":"两个对话气泡之间带有闪电符号，红色背景。","meaning_cn":"与某人争论/争吵","usage":"v. (过去式 argued, 过去分词 argued)","collocations":"argue with sb about/over sth","preposition_combos":"argue with (sb) about/over (sth)","examples":[{"en":"My sister and I often argue with each other about small things.","cn":"我和姐姐经常为小事争吵。"},{"en":"It is useless to argue with a person who never listens.","cn":"和一个从不听的人争论是没用的。"}],"socratic_questions":[{"question":"你和朋友因为看什么电影意见不同，声音越来越大，气氛变得紧张。你们在做什么？","answer_hint":"这个短语表示双方因意见不合而发生口角，通常带有情绪。"}],"fill_blank":{"sentences":["Don't ___ your parents about homework every day."],"options":["argue with","agree with","play with","talk with"],"correct_index":0},"audio":"audio/argue_with_sb.mp3","audio_ex0":"audio/argue_with_sb_ex0.mp3","audio_ex1":"audio/argue_with_sb_ex1.mp3"},{"word":"argue with sb","audio":"audio/argue_with_sb.mp3"},{"word":"move on","ipa":"/muːv ɒn/","image_prompts":["A calendar page being torn off, revealing a new month with a sunrise behind it, no people","A suitcase with a 'next destination' tag on a train station platform, train departing in background"],"image_desc_en":"A calendar page being torn off, revealing a new month with a sunrise behind it.","image_desc_cn":"一张日历页被撕下，露出新的一月和背后的日出。","meaning_cn":"继续前进；继续做别的事；放下过去","usage":"动词短语 (phrasal verb) (过去式 moved on, 过去分词 moved on)","collocations":"move on to something, move on from something, time to move on","preposition_combos":"move on to, move on from","examples":[{"en":"After the exam, we should move on to the next topic.","cn":"考试之后，我们应该继续下一个话题。"},{"en":"It's hard to move on after losing a game.","cn":"输掉比赛后很难继续前进。"}],"socratic_questions":[{"question":"小明考试没考好，一直闷闷不乐。朋友劝他别再想这次失败，开始准备下一次考试。朋友会用什么短语劝他？","answer_hint":"表示‘放下过去，继续前进’的动词短语，由‘移动’和‘在…上’组成。"}],"fill_blank":{"sentences":["It's time to ___ from the past and focus on the future."],"options":["move on","give up","look back","stay up"],"correct_index":0},"audio":"audio/move_on.mp3","audio_ex0":"audio/move_on_ex0.mp3","audio_ex1":"audio/move_on_ex1.mp3"},{"word":"sincere","ipa":"/sɪnˈsɪər/","image_prompts":["A handwritten thank-you note on cream paper with a red heart stamp, lying on a wooden desk","Two hands clasped together in a handshake, with a soft warm light glowing around them"],"image_desc_en":"A handwritten thank-you note on cream paper with a red heart stamp, lying on a wooden desk.","image_desc_cn":"一张手写的感谢信放在奶油色纸上，带有红色爱心印章，置于木桌上。","meaning_cn":"真诚的；诚挚的","usage":"形容词 adj. (副词 sincerely)","collocations":"sincere apology, sincere thanks, sincere friend, sincere smile","preposition_combos":"sincere about, sincere in","examples":[{"en":"She gave a sincere apology for breaking the vase.","cn":"她为打碎花瓶真诚地道了歉。"},{"en":"A sincere smile can make others feel warm.","cn":"一个真诚的微笑能让别人感到温暖。"}],"socratic_questions":[{"question":"你弄丢了同桌的橡皮，你非常抱歉，想表达自己不是假装的，而是真心觉得对不起。应该用哪个形容词描述你的道歉？","answer_hint":"这个词表示‘发自内心的、不虚假的’，常用来形容道歉、感谢或微笑。"}],"fill_blank":{"sentences":["Please accept my ___ thanks for your help."],"options":["sincere","simple","silent","sudden"],"correct_index":0},"audio":"audio/sincere.mp3","audio_ex0":"audio/sincere_ex0.mp3","audio_ex1":"audio/sincere_ex1.mp3"},{"word":"find out","ipa":"/faɪnd aʊt/","image_prompts":["A magnifying glass on top of an open book with highlighted text, library shelf background","A puzzle piece being placed into a nearly complete jigsaw puzzle on a table"],"image_desc_en":"A magnifying glass on top of an open book with highlighted text, library shelf background.","image_desc_cn":"一个放大镜放在一本打开的书上，文字被高亮，背景是图书馆书架。","meaning_cn":"查明；弄清；发现（真相）","usage":"动词短语 (phrasal verb) (过去式 found out, 过去分词 found out)","collocations":"find out the truth, find out the answer, find out about","preposition_combos":"find out about, find out that","examples":[{"en":"Please find out the train schedule before we leave.","cn":"请在我们出发前查一下火车时刻表。"},{"en":"I need to find out who broke the window.","cn":"我需要查明是谁打破了窗户。"}],"socratic_questions":[{"question":"你的手机不见了，你想通过打电话或问同学来‘弄清楚’手机在哪里。应该用哪个短语？","answer_hint":"这个短语由‘找到’和‘出来’组成，意思是‘通过努力得知某个信息或真相’。"}],"fill_blank":{"sentences":["Can you ___ what time the movie starts?"],"options":["find out","look for","give out","put out"],"correct_index":0},"audio":"audio/find_out.mp3","audio_ex0":"audio/find_out_ex0.mp3","audio_ex1":"audio/find_out_ex1.mp3"},{"word":"pay","ipa":"/peɪ/","image_prompts":["A cash register drawer open with coins and a receipt, a credit card on the counter","A wallet with several banknotes partially pulled out, on a café table next to a coffee cup"],"image_desc_en":"A cash register drawer open with coins and a receipt, a credit card on the counter.","image_desc_cn":"一个打开的收银机抽屉，里面有硬币和收据，柜台上有一张信用卡。","meaning_cn":"支付；付款；付出代价","usage":"动词 v. (过去式 paid, 过去分词 paid)","collocations":"pay for, pay attention, pay a bill, pay back","preposition_combos":"pay for, pay to, pay with","examples":[{"en":"I will pay for the tickets with my pocket money.","cn":"我会用我的零花钱买票。"},{"en":"You must pay attention to the teacher in class.","cn":"你必须在课堂上注意听老师讲课。"}],"socratic_questions":[{"question":"你去商店买了一支笔，需要给收银员钱。这个动作叫什么？","answer_hint":"这个词表示‘用钱交换商品或服务’，后面常接‘for’表示为什么付钱。"}],"fill_blank":{"sentences":["How much did you ___ for that book?"],"options":["pay","cost","spend","take"],"correct_index":0},"audio":"audio/pay.mp3","audio_ex0":"audio/pay_ex0.mp3","audio_ex1":"audio/pay_ex1.mp3"},{"word":"attention","ipa":"/əˈtenʃn/","image_prompts":["A bright red arrow pointing at a single word in the middle of a white page, surrounded by blurred text","A magnifying glass focusing sunlight onto a dry leaf, smoke starting to rise"],"image_desc_en":"A red arrow pointing to a word on a page, with other text blurred; a magnifying glass focusing sunlight on a leaf.","image_desc_cn":"一个红色箭头指向页面上的一个单词，周围文字模糊；一个放大镜将阳光聚焦在树叶上，开始冒烟。","meaning_cn":"n. 注意力；关注","usage":"n. (不可数名词)","collocations":"pay attention to, draw attention, catch one's attention, full attention","preposition_combos":"attention to (sth.)","examples":[{"en":"The teacher asked for our full attention during the exam.","cn":"老师要求我们在考试期间全神贯注。"},{"en":"A loud noise outside caught everyone's attention in class.","cn":"外面的一声巨响吸引了课堂上所有人的注意。"}],"socratic_questions":[{"question":"课堂上大家都在低头看书，突然窗外飞进一只鸟，所有同学都抬头去看。这时，鸟得到了什么？","answer_hint":"大家的目光和心思都集中到了鸟身上，这个词表示‘集中关注’的意思。"}],"fill_blank":{"sentences":["Please pay ___ to the safety instructions before the experiment."],"options":["attention","attentive","attend","attending"],"correct_index":0},"audio":"audio/attention.mp3","audio_ex0":"audio/attention_ex0.mp3","audio_ex1":"audio/attention_ex1.mp3"},{"word":"pay attention","ipa":"/peɪ əˈtenʃn/","image_prompts":["A pair of glasses resting on an open textbook with a yellow highlighter marking a sentence","A traffic light showing red with a sign below reading 'STOP' in bold letters"],"image_desc_en":"Glasses on an open textbook with a highlighted sentence; a red traffic light with a STOP sign.","image_desc_cn":"一副眼镜放在打开的书本上，句子被荧光笔标记；红灯和写着‘STOP’的标牌。","meaning_cn":"v. 注意；留心","usage":"v. (短语动词，后接to)","collocations":"pay attention to details, pay close attention, pay no attention","preposition_combos":"pay attention to (sb./sth.)","examples":[{"en":"You must pay attention to the road signs while driving.","cn":"开车时你必须注意路标。"},{"en":"She always pays attention to the teacher's instructions in class.","cn":"她在课堂上总是注意听老师的指令。"}],"socratic_questions":[{"question":"做化学实验时，老师反复强调要看清量筒上的刻度。老师希望你对刻度做什么？","answer_hint":"这是一个短语，意思是‘把心思放在……上’，和‘看’不同，更强调用心。"}],"fill_blank":{"sentences":["When crossing the street, you should ___ ___ ___ the traffic lights."],"options":["pay attention to","take care of","look for","think about"],"correct_index":0},"audio":"audio/pay_attention.mp3","audio_ex0":"audio/pay_attention_ex0.mp3","audio_ex1":"audio/pay_attention_ex1.mp3"},{"word":"be yourself","ipa":"/biː jɔːrˈself/","image_prompts":["A single sunflower standing tall among a field of identical daisies, all facing the sun","A plain white T-shirt hanging on a wooden hanger, with a handwritten tag that says 'original'"],"image_desc_en":"A sunflower standing out among daisies; a plain white T-shirt with an 'original' tag.","image_desc_cn":"一朵向日葵在雏菊中挺立；一件纯白T恤挂着写有‘original’的标签。","meaning_cn":"v. 做自己；保持本色","usage":"v. (短语动词，常用祈使句或情态动词后)","collocations":"just be yourself, learn to be yourself, try to be yourself","preposition_combos":"无固定介词搭配","examples":[{"en":"Don't copy others; just be yourself in the talent show.","cn":"不要模仿别人，在才艺展示中做你自己就好。"},{"en":"My best advice for a new school is to be yourself.","cn":"我给新学校的最好建议就是做你自己。"}],"socratic_questions":[{"question":"朋友要去参加面试，很紧张，想模仿别人的说话方式。你会建议他怎么做？","answer_hint":"这个短语鼓励人展现真实的自己，而不是假装成别人。"}],"fill_blank":{"sentences":["Don't worry about what others think; just ___ ___ in the speech competition."],"options":["be yourself","be careful","be quiet","be late"],"correct_index":0},"audio":"audio/be_yourself.mp3","audio_ex0":"audio/be_yourself_ex0.mp3","audio_ex1":"audio/be_yourself_ex1.mp3"},{"word":"offer","ipa":"/ˈɒfə(r)/","image_prompts":["A hand extending a cup of hot tea on a wooden table, steam rising gently","A help sign with a phone number on a bulletin board next to a stack of free books"],"image_desc_en":"A hand offering a cup of tea on a table; a help sign with a phone number next to free books.","image_desc_cn":"一只手递出一杯茶放在木桌上，热气升腾；公告板上的帮助告示和免费书籍。","meaning_cn":"v. 提供；主动提出；n. 提议；出价","usage":"v. (过去式 offered, 过去分词 offered); n. (可数名词)","collocations":"offer help, offer advice, job offer, special offer","preposition_combos":"offer sth. to sb., offer to do sth.","examples":[{"en":"He offered to carry the heavy box for the old lady.","cn":"他主动提出帮老太太搬重箱子。"},{"en":"The store has a special offer on school bags this week.","cn":"这家商店本周对书包有特价优惠。"}],"socratic_questions":[{"question":"同学搬不动一摞书，你走过去说‘我来帮你吧’。你做了什么动作？","answer_hint":"这个词表示‘主动提出帮助’，不是‘命令’或‘请求’。"}],"fill_blank":{"sentences":["My neighbor ___ to water my plants while I was on vacation."],"options":["offered","asked","told","refused"],"correct_index":0},"audio":"audio/offer.mp3","audio_ex0":"audio/offer_ex0.mp3","audio_ex1":"audio/offer_ex1.mp3"},{"word":"reasonable","ipa":"/ˈriːznəbl/","image_prompts":["A price tag showing $15 on a high-quality backpack, next to a similar tag showing $50, with a balanced scale icon between them","A clock showing 10:00 PM with a lamp on and an open textbook, but the lamp is turned off halfway, suggesting a fair bedtime"],"image_desc_en":"A price tag with a reasonable amount and a balanced scale; a lamp turned off at a fair hour with a textbook.","image_desc_cn":"一个标有合理价格的价签和天平；一盏在合理时间关闭的台灯和一本教科书。","meaning_cn":"adj. 合理的；公平的；适度的","usage":"adj. (比较级 more reasonable, 最高级 most reasonable)","collocations":"reasonable price, reasonable time, reasonable person","preposition_combos":"reasonable for, reasonable about","examples":[{"en":"The price of this book is very reasonable for students.","cn":"这本书的价格对学生来说非常合理。"},{"en":"My mom set a reasonable time for me to play games.","cn":"我妈妈给我设定了一个合理的玩游戏时间。"}],"socratic_questions":[{"question":"你想买一个篮球，但标价500元，你觉得太贵了。你希望价格怎么样？","answer_hint":"这个词表示价格不高不低，公平恰当，不是太贵也不是太便宜。"}],"fill_blank":{"sentences":["The teacher gave us a ___ amount of homework for the weekend."],"options":["reasonable","expensive","difficult","boring"],"correct_index":0},"audio":"audio/reasonable.mp3","audio_ex0":"audio/reasonable_ex0.mp3","audio_ex1":"audio/reasonable_ex1.mp3"},{"word":"social","ipa":"/ˈsoʊʃl/","image_prompts":["A group of colorful speech bubbles floating above a round table with four empty chairs in a bright room","A calendar with several circled dates labeled 'club meeting' and 'party', with a handshake icon next to them"],"image_desc_en":"Colorful speech bubbles above a table with chairs; a calendar with social event dates and a handshake icon.","image_desc_cn":"桌子上方彩色对话气泡和椅子；日历上标有社交活动日期和握手图标。","meaning_cn":"adj. 社交的；社会的","usage":"adj. (无比较级)","collocations":"social life, social skills, social event","preposition_combos":"social with","examples":[{"en":"Joining a club can improve your social skills greatly.","cn":"加入社团可以大大提升你的社交技能。"},{"en":"The school dance is a big social event every year.","cn":"学校舞会是每年一次的大型社交活动。"}],"socratic_questions":[{"question":"你刚转学，想认识新朋友，需要多参加什么类型的活动？","answer_hint":"这个词描述与人交往、集体活动的性质，比如聚会、社团活动。"}],"fill_blank":{"sentences":["Having good ___ skills helps you make friends easily."],"options":["social","math","sports","reading"],"correct_index":0},"audio":"audio/social.mp3","audio_ex0":"audio/social_ex0.mp3","audio_ex1":"audio/social_ex1.mp3"},{"word":"medium","ipa":"/ˈmiːdiəm/","image_prompts":["Three coffee cups in a row: a small espresso cup, a medium-sized mug, and a large travel mug, with labels underneath","A pizza box with three size circles drawn on it: small, medium, large, with the medium circle highlighted in red"],"image_desc_en":"Three cups of different sizes with a medium one labeled; a pizza box with small, medium, large circles, medium highlighted.","image_desc_cn":"三个不同大小的杯子，中等大小有标签；披萨盒上画有小、中、大三个圆圈，中等被标红。","meaning_cn":"adj. 中等的；n. 媒介；方法","usage":"adj. (无比较级) / n. (复数 media 或 mediums)","collocations":"medium size, medium heat, medium rare","preposition_combos":"medium of, medium for","examples":[{"en":"I ordered a medium pizza for our family dinner tonight.","cn":"我为今晚的家庭晚餐点了一个中份披萨。"},{"en":"Please cook the steak on medium heat for ten minutes.","cn":"请用中火把牛排煎十分钟。"}],"socratic_questions":[{"question":"你想买一件T恤，但不确定选S号还是L号，你觉得哪个尺寸最合适？","answer_hint":"这个词表示不大不小、介于两者之间的尺寸。"}],"fill_blank":{"sentences":["She chose a ___ -sized backpack for her school trip."],"options":["medium","small","large","tiny"],"correct_index":0},"audio":"audio/medium.mp3","audio_ex0":"audio/medium_ex0.mp3","audio_ex1":"audio/medium_ex1.mp3"},{"word":"social media","ipa":"/ˈsoʊʃl ˈmiːdiə/","image_prompts":["A smartphone screen showing icons of a blue bird, a camera, and a message bubble, with a notification badge on each","A laptop keyboard with a glowing screen showing a feed of photos and like heart icons, a cup of coffee beside it"],"image_desc_en":"A smartphone with social app icons and notifications; a laptop screen showing a photo feed with like hearts.","image_desc_cn":"智能手机上显示社交应用图标和通知；笔记本电脑屏幕显示照片流和点赞心形图标。","meaning_cn":"n. 社交媒体","usage":"n. (不可数，常作单数)","collocations":"use social media, post on social media, social media platform","preposition_combos":"on social media, through social media","examples":[{"en":"Many students use social media to share their hobbies.","cn":"很多学生用社交媒体分享自己的爱好。"},{"en":"Social media helps us keep in touch with old friends.","cn":"社交媒体帮助我们与老朋友保持联系。"}],"socratic_questions":[{"question":"你想看朋友最近旅行的照片，除了直接打电话，还可以去哪里看？","answer_hint":"这是一个由两个词组成的短语，指在网络上分享信息和照片的平台。"}],"fill_blank":{"sentences":["He spends too much time on ___ every day."],"options":["social media","homework","sports","sleep"],"correct_index":0},"audio":"audio/social_media.mp3","audio_ex0":"audio/social_media_ex0.mp3","audio_ex1":"audio/social_media_ex1.mp3"},{"word":"trust","ipa":"/trʌst/","image_prompts":["A locked metal safe with a golden key inserted, soft warm light illuminating the keyhole","Two hands clasped together in a handshake silhouette against a sunset sky, no people visible"],"image_desc_en":"A locked safe with a key inserted, or two hands shaking in silhouette at sunset.","image_desc_cn":"一个插着钥匙的锁着的保险箱，或日落时分握手的剪影。","meaning_cn":"信任；信赖","usage":"n. / v. (过去式 trusted, 过去分词 trusted)","collocations":"trust sb/sth; have trust in; build trust","preposition_combos":"trust in; trust with","examples":[{"en":"I trust my best friend to keep my secret.","cn":"我相信我最好的朋友会保守我的秘密。"},{"en":"The team built trust through hard work together.","cn":"团队通过共同努力建立了信任。"}],"socratic_questions":[{"question":"你和朋友约好互相保守秘密，你相信他不会说出去。这种‘相信’用哪个词？","answer_hint":"这个词强调对他人可靠性的信心，不是简单的‘相信事实’（believe）。"}],"fill_blank":{"sentences":["You can ___ her to finish the project on time."],"options":["trust","force","allow","teach"],"correct_index":0},"audio":"audio/trust.mp3","audio_ex0":"audio/trust_ex0.mp3","audio_ex1":"audio/trust_ex1.mp3"},{"word":"keep","ipa":"/kiːp/","image_prompts":["A glass jar filled with colorful marbles on a shelf, lid tightly closed","A diary with a small padlock on a wooden desk, a pen lying beside it"],"image_desc_en":"A jar of marbles with a closed lid, or a locked diary on a desk.","image_desc_cn":"一个盖着盖子的弹珠罐，或书桌上带小锁的日记本。","meaning_cn":"保持；保留；继续","usage":"v. (过去式 kept, 过去分词 kept)","collocations":"keep doing; keep + adj.; keep a secret; keep a record","preposition_combos":"keep from; keep on; keep up with","examples":[{"en":"Please keep quiet during the exam in the hall.","cn":"考试期间请在礼堂保持安静。"},{"en":"I keep a diary to record my daily life.","cn":"我写日记来记录我的日常生活。"}],"socratic_questions":[{"question":"考试时老师要求大家不要说话，这个‘保持安静’的‘保持’用哪个动词？","answer_hint":"这个词表示维持某种状态或动作的持续，后面常接形容词或doing。"}],"fill_blank":{"sentences":["She ___ a photo of her family in her wallet."],"options":["keeps","throws","forgets","breaks"],"correct_index":0},"audio":"audio/keep.mp3","audio_ex0":"audio/keep_ex0.mp3","audio_ex1":"audio/keep_ex1.mp3"},{"word":"local","ipa":"/ˈloʊkl/","image_prompts":["A small bakery with a wooden sign reading 'Fresh Bread' on a quiet street corner","A map of a town with a red pin marking a park, surrounded by tiny street names"],"image_desc_en":"A small bakery on a street corner, or a town map with a red pin on a park.","image_desc_cn":"街角的小面包店，或一张标有红色图钉的城镇地图。","meaning_cn":"当地的；本地的","usage":"adj. / n. (复数 locals)","collocations":"local food; local community; local news","preposition_combos":"local to (较少用)","examples":[{"en":"We bought fresh fruit from the local market.","cn":"我们从当地市场买了新鲜水果。"},{"en":"The local library holds a reading club every week.","cn":"当地图书馆每周举办读书俱乐部。"}],"socratic_questions":[{"question":"你想推荐一家学校附近的面包店，这家店不是连锁店，是‘本地的’，用哪个形容词？","answer_hint":"这个词指属于某个特定小区域的，不是全国或全球性的。"}],"fill_blank":{"sentences":["The ___ newspaper reports events in our town."],"options":["local","national","international","ancient"],"correct_index":0},"audio":"audio/local.mp3","audio_ex0":"audio/local_ex0.mp3","audio_ex1":"audio/local_ex1.mp3"},{"word":"face-to-face","ipa":"/ˌfeɪs tə ˈfeɪs/","image_prompts":["Two empty chairs facing each other across a small round table with a coffee cup on it","A video call screen showing two empty chairs in different rooms, a laptop in the middle"],"image_desc_en":"Two chairs facing each other with a coffee cup on a table, or a laptop showing two empty chairs on a video call.","image_desc_cn":"两把椅子面对面摆放，桌上放着一杯咖啡；或笔记本电脑屏幕显示视频通话中的两把空椅子。","meaning_cn":"面对面地","usage":"adv. / adj.","collocations":"face-to-face meeting; talk face-to-face; face-to-face communication","preposition_combos":"无固定介词搭配","examples":[{"en":"We had a face-to-face talk about our plan.","cn":"我们就计划进行了面对面交谈。"},{"en":"Face-to-face communication is better than texting.","cn":"面对面交流比发短信更好。"}],"socratic_questions":[{"question":"你和朋友吵架了，你觉得发信息说不清楚，最好‘当面’谈一谈。这个‘当面’用哪个短语？","answer_hint":"这个短语字面意思是‘脸对脸’，强调直接见面，不是通过手机或网络。"}],"fill_blank":{"sentences":["It is important to have a ___ meeting to solve the problem."],"options":["face-to-face","online","written","phone"],"correct_index":0},"audio":"audio/face-to-face.mp3","audio_ex0":"audio/face-to-face_ex0.mp3","audio_ex1":"audio/face-to-face_ex1.mp3"},{"word":"professor","ipa":"/prəˈfesər/","image_prompts":["A wooden desk in a university lecture hall with a stack of research papers and a coffee mug, chalkboard in background with complex formulas","A leather-bound book titled 'Advanced Physics' on a mahogany bookshelf, reading glasses resting on top, soft library lighting"],"image_desc_en":"A university lecture hall desk with research papers and a coffee mug, chalkboard with formulas behind.","image_desc_cn":"大学讲堂书桌上放着研究论文和咖啡杯，背后黑板上有公式。","meaning_cn":"教授","usage":"n. (可数名词) 教授","collocations":"university professor, history professor, professor of English","preposition_combos":"professor at (a university), professor of (a subject)","examples":[{"en":"The history professor gave a lecture about ancient Rome yesterday.","cn":"历史教授昨天做了一个关于古罗马的讲座。"},{"en":"My uncle is a famous professor at a medical school.","cn":"我叔叔是一所医学院的著名教授。"}],"socratic_questions":[{"question":"你在大学里遇到一位学识渊博、专门研究某个学科的老师，通常怎么称呼他？","answer_hint":"这个词指大学里最高级别的教师，比‘teacher’更正式、更专业。"}],"fill_blank":{"sentences":["The ___ asked us to read three books before next class."],"options":["professor","doctor","coach","driver"],"correct_index":0},"audio":"audio/professor.mp3","audio_ex0":"audio/professor_ex0.mp3","audio_ex1":"audio/professor_ex1.mp3"},{"word":"speech","ipa":"/spiːtʃ/","image_prompts":["A wooden podium with a microphone on an empty stage, spotlight shining down, red curtain in background","A typed manuscript on a lectern with handwritten notes in red ink, a glass of water beside it"],"image_desc_en":"A wooden podium with a microphone on an empty stage under a spotlight, red curtain behind.","image_desc_cn":"空舞台上木制讲台带麦克风，聚光灯照射，红色幕布在后方。","meaning_cn":"演讲；说话的能力","usage":"n. (可数/不可数名词) 演讲；言语","collocations":"give a speech, make a speech, freedom of speech","preposition_combos":"speech about/on (a topic), speech to (an audience)","examples":[{"en":"Our class president will give a speech at the school assembly.","cn":"我们班长将在学校集会上发表演讲。"},{"en":"The winner's speech was short but very touching.","cn":"获胜者的演讲简短但非常感人。"}],"socratic_questions":[{"question":"你在全校师生面前站在台上说一段话，表达自己的想法，这叫什么？","answer_hint":"这个词强调‘说出来的话’，通常是在正式场合对一群人说的。"}],"fill_blank":{"sentences":["She prepared a short ___ for the graduation ceremony."],"options":["speech","song","letter","dance"],"correct_index":0},"audio":"audio/speech.mp3","audio_ex0":"audio/speech_ex0.mp3","audio_ex1":"audio/speech_ex1.mp3"},{"word":"argue","ipa":"/ˈɑːrɡjuː/","image_prompts":["Two crumpled pieces of paper on a wooden table, one with 'YES' and one with 'NO' written in red ink, a broken pencil between them","A whiteboard with two opposing opinion columns written in different colored markers, eraser marks smudging both sides"],"image_desc_en":"Two crumpled papers marked 'YES' and 'NO' on a table with a broken pencil between them.","image_desc_cn":"桌子上两张皱巴巴的纸分别写着‘是’和‘否’，中间有一支断铅笔。","meaning_cn":"争论；争吵","usage":"v. (过去式 argued, 过去分词 argued) 争论","collocations":"argue with someone, argue about/over something","preposition_combos":"argue with (sb), argue about/over (sth)","examples":[{"en":"My friends often argue about which movie is the best.","cn":"我的朋友们经常争论哪部电影最好看。"},{"en":"Don't argue with your parents over small things.","cn":"不要为小事和父母争吵。"}],"socratic_questions":[{"question":"你和同学对一道数学题的答案有不同看法，你们开始大声说出各自的理由，这叫什么？","answer_hint":"这个词表示双方意见不合，用语言表达不同观点，比‘talk’更激烈。"}],"fill_blank":{"sentences":["The two brothers often ___ about which TV show to watch."],"options":["argue","agree","sing","sleep"],"correct_index":0},"audio":"audio/argue.mp3","audio_ex0":"audio/argue_ex0.mp3","audio_ex1":"audio/argue_ex1.mp3"},{"word":"make up","ipa":"/meɪk ʌp/","image_prompts":["Two puzzle pieces fitting together on a wooden table, golden light shining on the joined seam","A broken ceramic vase repaired with gold lacquer (kintsugi style), sitting on a white shelf"],"image_desc_en":"Two puzzle pieces fitting together on a wooden table with golden light on the seam.","image_desc_cn":"木桌上两块拼图拼合在一起，金色光线照在接缝处。","meaning_cn":"和解；编造；组成","usage":"v. (过去式 made up, 过去分词 made up) 和解；编造；组成","collocations":"make up with someone, make up a story, make up a team","preposition_combos":"make up with (sb), make up for (sth)","examples":[{"en":"After the fight, they decided to make up and be friends again.","cn":"吵架之后，他们决定和好，重新做朋友。"},{"en":"She had to make up a story to explain why she was late.","cn":"她不得不编个故事来解释为什么迟到。"}],"socratic_questions":[{"question":"你和好朋友吵架后，两人互相道歉、重新和好，这个动作叫什么？","answer_hint":"这是一个短语动词，表示‘和好’或‘编造’，由两个词组成。"}],"fill_blank":{"sentences":["They had a small quarrel but soon ___ ___ and played together."],"options":["made up","gave up","stood up","woke up"],"correct_index":0},"audio":"audio/make_up.mp3","audio_ex0":"audio/make_up_ex0.mp3","audio_ex1":"audio/make_up_ex1.mp3"},{"word":"in person","ipa":"/ɪn ˈpɜːrsən/","image_prompts":["A handwritten letter on a wooden desk with a stamp, next to a laptop showing a video call screen, contrasting physical presence with digital communication","A theater stage with red curtains and a single microphone on a stand, empty seats in the audience, representing live performance attendance"],"image_desc_en":"A handwritten letter on a wooden desk with a stamp, next to a laptop showing a video call screen, contrasting physical presence with digital communication","image_desc_cn":"一张木桌上放着一封手写信和邮票，旁边是一台显示视频通话屏幕的笔记本电脑，对比实体到场与数字交流","meaning_cn":"亲自；本人","usage":"adv. (副词短语，修饰动词，表示亲自做某事)","collocations":"meet in person, attend in person, see in person, apply in person","preposition_combos":"无固定介词搭配，常直接跟在动词后","examples":[{"en":"I want to thank the teacher in person for her help.","cn":"我想亲自感谢老师的帮助。"},{"en":"You should hand in the form in person before Friday.","cn":"你应该在周五前亲自交表格。"}],"socratic_questions":[{"question":"你有一份重要的申请要交，是让别人代交还是自己跑一趟？哪种方式更能体现诚意？","answer_hint":"强调亲自到场、面对面，而不是通过电话或别人转交。"}],"fill_blank":{"sentences":["She decided to meet the famous writer ___ at the book fair."],"options":["in person","on phone","by email","in group"],"correct_index":0},"audio":"audio/in_person.mp3","audio_ex0":"audio/in_person_ex0.mp3","audio_ex1":"audio/in_person_ex1.mp3"},{"word":"prefer","ipa":"/prɪˈfɜːr/","image_prompts":["A cup of hot tea next to a glass of iced cola on a sunny windowsill, steam rising from the tea, a small arrow pointing to the tea cup","A library shelf with a thick novel and a thin comic book side by side, a hand reaching toward the novel"],"image_desc_en":"A cup of hot tea next to a glass of iced cola on a sunny windowsill, steam rising from the tea, a small arrow pointing to the tea cup","image_desc_cn":"阳光明媚的窗台上放着一杯热茶和一杯冰可乐，茶冒着热气，一个小箭头指向茶杯","meaning_cn":"更喜欢；偏好","usage":"v. (过去式 preferred, 过去分词 preferred) 常见搭配：prefer A to B / prefer doing A to doing B / prefer to do","collocations":"prefer tea to coffee, prefer reading to watching TV, prefer to stay home","preposition_combos":"prefer A to B (比起B更喜欢A)","examples":[{"en":"I prefer cycling to school because it keeps me fit.","cn":"我更喜欢骑自行车上学，因为它让我保持健康。"},{"en":"Most students prefer group study over studying alone.","cn":"大多数学生更喜欢小组学习而不是独自学习。"}],"socratic_questions":[{"question":"周末你有两个选择：去图书馆安静看书，或者去操场打篮球。你更倾向哪一个？为什么？","answer_hint":"表示在两者中选一个更喜欢的，用 prefer...to... 结构。"}],"fill_blank":{"sentences":["She ___ walking in the park to sitting at home all day."],"options":["prefers","hates","forgets","stops"],"correct_index":0},"audio":"audio/prefer.mp3","audio_ex0":"audio/prefer_ex0.mp3","audio_ex1":"audio/prefer_ex1.mp3"},{"word":"calm","ipa":"/kɑːm/","image_prompts":["A still lake surface reflecting a clear blue sky, no ripples, surrounded by pine trees at sunrise","A single white candle burning steadily on a dark wooden table, wax dripping slowly, soft warm glow"],"image_desc_en":"A still lake surface reflecting a clear blue sky, no ripples, surrounded by pine trees at sunrise","image_desc_cn":"平静的湖面倒映着清澈的蓝天，没有涟漪，四周是日出时的松树","meaning_cn":"平静的；冷静的；使平静","usage":"adj. / v. (过去式 calmed, 过去分词 calmed) 形容词：保持冷静；动词：使……平静下来","collocations":"keep calm, stay calm, calm down, calm oneself","preposition_combos":"calm down (冷静下来)；calm sb. down (使某人平静)","examples":[{"en":"Take a deep breath and try to stay calm before the exam.","cn":"考试前深呼吸，尽量保持冷静。"},{"en":"The soft music helped calm my nerves before the speech.","cn":"轻柔的音乐帮助我在演讲前平静了紧张情绪。"}],"socratic_questions":[{"question":"明天就要期末考试了，你心跳很快，手心出汗。这时候你应该怎么做才能让自己不紧张？","answer_hint":"描述一种不慌张、平稳的状态，或者让这种状态发生。"}],"fill_blank":{"sentences":["The teacher asked everyone to ___ down and listen carefully."],"options":["calm","run","shout","jump"],"correct_index":0},"audio":"audio/calm.mp3","audio_ex0":"audio/calm_ex0.mp3","audio_ex1":"audio/calm_ex1.mp3"},{"word":"worry about","ipa":"/ˈwɜːri əˈbaʊt/","image_prompts":["A desk calendar with a red circle around a date, a clock showing late hour, scattered crumpled paper balls around a trash bin","A thermometer showing high fever temperature next to a bottle of medicine and a glass of water on a bedside table"],"image_desc_en":"A desk calendar with a red circle around a date, a clock showing late hour, scattered crumpled paper balls around a trash bin","image_desc_cn":"一本台历上红色圆圈标出一个日期，时钟显示很晚的时间，垃圾桶周围散落着揉皱的纸团","meaning_cn":"担心；忧虑","usage":"v. (短语动词) 过去式 worried about, 过去分词 worried about","collocations":"worry about exams, worry about health, worry about the future, don't worry about","preposition_combos":"worry about + 名词/代词/动名词","examples":[{"en":"Don't worry about the test; you have prepared well.","cn":"别担心考试，你已经准备得很好了。"},{"en":"She always worries about her little brother when he is late.","cn":"她弟弟晚归时她总是担心。"}],"socratic_questions":[{"question":"你的好朋友明天要参加演讲比赛，他反复练习但还是害怕出错。你该怎么安慰他？","answer_hint":"表达对某件事感到不安、焦虑，常用短语搭配 about。"}],"fill_blank":{"sentences":["There is no need to ___ ___ the result if you tried your best."],"options":["worry about","care for","think of","look for"],"correct_index":0},"audio":"audio/worry_about.mp3","audio_ex0":"audio/worry_about_ex0.mp3","audio_ex1":"audio/worry_about_ex1.mp3"},{"word":"expression","ipa":"/ɪkˈspreʃn/","image_prompts":["A close-up of a paintbrush leaving a bold red stroke on a white canvas, paint splatters around","A chalkboard filled with mathematical equations and a single large question mark drawn in yellow chalk"],"image_desc_en":"A paintbrush leaving a bold red stroke on a white canvas with paint splatters; a chalkboard with equations and a large yellow question mark.","image_desc_cn":"画笔在白色画布上留下醒目的红色笔触，周围有颜料飞溅；一块写满数学方程式的黑板，上面有一个黄色的大问号。","meaning_cn":"表达；表情；措辞","usage":"n. (可数名词) 表达；表情；措辞","collocations":"facial expression, an expression of thanks, beyond expression","preposition_combos":"expression of, expression on one's face","examples":[{"en":"Her facial expression showed she was very surprised.","cn":"她的面部表情表明她非常惊讶。"},{"en":"This poem is a beautiful expression of love.","cn":"这首诗是爱的美丽表达。"}],"socratic_questions":[{"question":"当你在作文中想描述一个人看到惊喜礼物时的神态，你会用哪个词来指代他脸上的样子？","answer_hint":"这个词可以指脸上显示的情绪，比如惊讶或快乐，常和facial搭配。"}],"fill_blank":{"sentences":["His ___ showed that he didn't understand the question."],"options":["expression","impression","pressure","discussion"],"correct_index":0},"audio":"audio/expression.mp3","audio_ex0":"audio/expression_ex0.mp3","audio_ex1":"audio/expression_ex1.mp3"},{"word":"chance","ipa":"/tʃɑːns/","image_prompts":["A golden lottery ticket lying on a wooden table next to a cup of coffee, morning sunlight streaming in","A pair of dice resting on a green felt table, one showing six dots, the other showing one dot"],"image_desc_en":"A golden lottery ticket on a wooden table with coffee and morning sunlight; two dice on green felt showing six and one.","image_desc_cn":"一张金色彩票放在木桌上，旁边有一杯咖啡，晨光洒入；一对骰子落在绿色毛毡桌上，一个显示六点，一个显示一点。","meaning_cn":"机会；可能性；偶然","usage":"n. (可数/不可数名词) 机会；可能性；偶然","collocations":"by chance, take a chance, have a chance to do","preposition_combos":"chance of, chance for, chance to do","examples":[{"en":"I had a chance to visit the science museum last weekend.","cn":"上周末我有机会参观了科学博物馆。"},{"en":"There is a good chance of rain tomorrow afternoon.","cn":"明天下午很有可能下雨。"}],"socratic_questions":[{"question":"如果你在考试前突然得知可以补考一次，你会用哪个词来形容这个难得的机遇？","answer_hint":"这个词表示可以做某事的时机或可能性，常与have或take搭配。"}],"fill_blank":{"sentences":["I hope I get a ___ to travel to Beijing this summer."],"options":["chance","change","choice","charge"],"correct_index":0},"audio":"audio/chance.mp3","audio_ex0":"audio/chance_ex0.mp3","audio_ex1":"audio/chance_ex1.mp3"},{"word":"meeting","ipa":"/ˈmiːtɪŋ/","image_prompts":["A long wooden conference table with notebooks and water glasses, a whiteboard with colorful markers in the background","A round table with four chairs in a bright room, a clock on the wall showing 3:00 PM"],"image_desc_en":"A long wooden conference table with notebooks and water glasses, a whiteboard with markers; a round table with four chairs and a clock showing 3:00 PM.","image_desc_cn":"一张长木会议桌，上面有笔记本和水杯，背景是带彩色马克笔的白板；一张圆桌配四把椅子，墙上的钟显示下午3点。","meaning_cn":"会议；会面；集合","usage":"n. (可数名词) 会议；会面；集合","collocations":"have a meeting, attend a meeting, class meeting","preposition_combos":"meeting with, meeting about, at a meeting","examples":[{"en":"We will have a class meeting on Friday afternoon.","cn":"我们将在周五下午开班会。"},{"en":"The sports club meeting starts at four o'clock.","cn":"体育俱乐部的会议四点开始。"}],"socratic_questions":[{"question":"班长通知大家放学后留下来讨论运动会的事情，这种集体讨论活动叫什么？","answer_hint":"这个词指一群人聚在一起讨论事情，常与have或hold搭配。"}],"fill_blank":{"sentences":["The school ___ will be held in the library tomorrow."],"options":["meeting","eating","sleeping","running"],"correct_index":0},"audio":"audio/meeting.mp3","audio_ex0":"audio/meeting_ex0.mp3","audio_ex1":"audio/meeting_ex1.mp3"},{"word":"difficulty","ipa":"/ˈdɪfɪkəlti/","image_prompts":["A tangled pile of earphone wires on a white desk, a pair of scissors nearby","A jigsaw puzzle with one piece missing in the center, scattered pieces on a wooden table"],"image_desc_en":"A tangled pile of earphone wires on a white desk with scissors nearby; a jigsaw puzzle missing one center piece, pieces scattered on wood.","image_desc_cn":"白色桌上一团缠绕的耳机线，旁边有一把剪刀；一个拼图缺了中心一块，碎片散落在木桌上。","meaning_cn":"困难；难题；困境","usage":"n. (可数/不可数名词) 困难；难题；困境","collocations":"have difficulty (in) doing, with difficulty, face difficulties","preposition_combos":"difficulty in, difficulty with, without difficulty","examples":[{"en":"She had difficulty finishing the math homework on time.","cn":"她按时完成数学作业有困难。"},{"en":"He climbed the mountain with great difficulty.","cn":"他非常艰难地爬上了山。"}],"socratic_questions":[{"question":"当你做一道复杂的物理题时，感觉怎么想都想不出答案，这种状态可以用哪个词描述？","answer_hint":"这个词表示做某事时遇到的障碍或麻烦，常与have或with搭配。"}],"fill_blank":{"sentences":["I have ___ understanding this English grammar rule."],"options":["difficulty","difference","confidence","importance"],"correct_index":0},"audio":"audio/difficulty.mp3","audio_ex0":"audio/difficulty_ex0.mp3","audio_ex1":"audio/difficulty_ex1.mp3"},{"word":"right","ipa":"/raɪt/","image_prompts":["A wooden arrow sign pointing to the right on a foggy forest path, moss on the post","A hand-drawn checkmark in green ink on a white paper, symbol of correct answer"],"image_desc_en":"A directional sign pointing right or a green checkmark on paper.","image_desc_cn":"指向右边的路标或纸上的绿色对勾。","meaning_cn":"正确的；右边的；权利；向右","usage":"adj. / n. / adv. (比较级 righter, 最高级 rightest)","collocations":"right answer, right side, human rights, turn right","preposition_combos":"on the right, to the right of","examples":[{"en":"Turn right at the second traffic light, please.","cn":"请在第二个红绿灯处右转。"},{"en":"Every student has the right to ask questions.","cn":"每个学生都有提问的权利。"}],"socratic_questions":[{"question":"考试时你选了一个选项，老师批改后画了一个对勾，这个对勾表示什么？","answer_hint":"表示答案正确，即“right”的意思。"}],"fill_blank":{"sentences":["Please turn ___ at the next corner to reach the library."],"options":["right","left","straight","back"],"correct_index":0},"audio":"audio/right.mp3","audio_ex0":"audio/right_ex0.mp3","audio_ex1":"audio/right_ex1.mp3"},{"word":"line","ipa":"/laɪn/","image_prompts":["A long queue of shopping carts lined up outside a supermarket entrance, metal handles reflecting sunlight","A straight white line painted on a dark asphalt road, stretching to the horizon under a blue sky"],"image_desc_en":"A queue of carts or a painted road line.","image_desc_cn":"一排购物车或道路上的一条白线。","meaning_cn":"线；排；队伍；台词","usage":"n. (复数 lines) / v. (过去式 lined, 过去分词 lined)","collocations":"wait in line, draw a line, line up, read between the lines","preposition_combos":"in line, on the line, out of line","examples":[{"en":"We had to wait in line for twenty minutes.","cn":"我们不得不排队等了二十分钟。"},{"en":"Please draw a straight line under the title.","cn":"请在标题下面画一条直线。"}],"socratic_questions":[{"question":"在食堂打饭时，大家一个接一个地站着，这种排列叫什么？","answer_hint":"这种一个接一个的排列就是“line”（队伍）。"}],"fill_blank":{"sentences":["The teacher asked us to stand in a straight ___."],"options":["line","circle","square","row"],"correct_index":0},"audio":"audio/line.mp3","audio_ex0":"audio/line_ex0.mp3","audio_ex1":"audio/line_ex1.mp3"},{"word":"drop sb a line","ipa":"/drɒp ˈsʌmbədi ə laɪn/","image_prompts":["An envelope with a red wax seal lying on a wooden table next to a fountain pen","A smartphone screen showing a text message composition with a paper airplane send icon"],"image_desc_en":"An envelope with wax seal or a phone screen with a message icon.","image_desc_cn":"带火漆封的信封或显示短信图标的手机屏幕。","meaning_cn":"给某人写信/发短信（非正式）","usage":"动词短语 (过去式 dropped, 过去分词 dropped)","collocations":"drop me a line, drop a line to","preposition_combos":"drop a line to sb","examples":[{"en":"Drop me a line when you arrive in Beijing.","cn":"你到北京后给我写封信。"},{"en":"I will drop you a line about the party details.","cn":"我会发短信告诉你派对细节。"}],"socratic_questions":[{"question":"暑假你和朋友分开，你想让他到了新地方后联系你，你会怎么说？","answer_hint":"用“drop sb a line”表示写信或发消息联系，很口语化。"}],"fill_blank":{"sentences":["Please ___ when you have time to chat."],"options":["drop me a line","call me back","visit me","send a gift"],"correct_index":0},"audio":"audio/drop_sb_a_line.mp3","audio_ex0":"audio/drop_sb_a_line_ex0.mp3","audio_ex1":"audio/drop_sb_a_line_ex1.mp3"},{"word":"detail","ipa":"/ˈdiːteɪl/","image_prompts":["A magnifying glass over a complex blueprint showing tiny measurements and annotations","A close-up photo of a woven fabric pattern with visible threads and color variations"],"image_desc_en":"A magnifying glass on a blueprint or a close-up of fabric threads.","image_desc_cn":"放大镜下的蓝图细节或织物特写。","meaning_cn":"细节；详情","usage":"n. (复数 details) / v. (过去式 detailed, 过去分词 detailed)","collocations":"in detail, pay attention to detail, go into detail","preposition_combos":"in detail, with detail","examples":[{"en":"Please describe your plan in more detail.","cn":"请更详细地描述你的计划。"},{"en":"The report includes every small detail of the event.","cn":"报告包含了活动的每一个小细节。"}],"socratic_questions":[{"question":"写作文时，老师让你把场景写得更具体，比如颜色、声音，这些具体内容叫什么？","answer_hint":"这些具体的内容就是“detail”（细节）。"}],"fill_blank":{"sentences":["The teacher asked us to read the instructions in ___."],"options":["detail","speed","silence","anger"],"correct_index":0},"audio":"audio/detail.mp3","audio_ex0":"audio/detail_ex0.mp3","audio_ex1":"audio/detail_ex1.mp3"},{"word":"reunion","ipa":"/riːˈjuːniən/","image_prompts":["A large round dining table covered with a white tablecloth, multiple empty plates and chopsticks arranged around it, warm yellow lighting from a hanging lamp above","A stack of old photo albums tied with a red ribbon on a wooden shelf, dust particles floating in a beam of sunlight"],"image_desc_en":"A dining table set for a family gathering with many plates and chopsticks under a warm lamp; a stack of old photo albums tied with a red ribbon on a dusty shelf.","image_desc_cn":"一张摆满碗筷、暖灯照耀下的团圆饭桌；一摞用红丝带捆扎的旧相册放在落灰的木架上。","meaning_cn":"n. 团圆；重聚","usage":"n. (可数名词，常与 family 连用)","collocations":"family reunion, class reunion, have a reunion","preposition_combos":"reunion with, reunion of","examples":[{"en":"Our family reunion dinner on New Year's Eve is always warm.","cn":"我们除夕夜的团圆饭总是很温馨。"},{"en":"The class reunion brought many old friends back together.","cn":"这次班级重聚让许多老朋友又聚在了一起。"}],"socratic_questions":[{"question":"春节时，全家人从各地赶回老家一起吃年夜饭，这种场景叫什么？","answer_hint":"强调分开后又聚在一起，尤其是家庭或班级的团聚。"}],"fill_blank":{"sentences":["The ___ dinner was held at a big restaurant near the train station."],"options":["reunion","meeting","party","conference"],"correct_index":0},"audio":"audio/reunion.mp3","audio_ex0":"audio/reunion_ex0.mp3","audio_ex1":"audio/reunion_ex1.mp3"},{"word":"seriously","ipa":"/ˈsɪriəsli/","image_prompts":["A pair of round eyeglasses resting on an open textbook with a red pen placed next to it, bright desk lamp illuminating the page","A whiteboard covered with dense math equations and a red 'IMPORTANT' stamp mark in the corner"],"image_desc_en":"Eyeglasses on an open textbook with a red pen under a bright desk lamp; a whiteboard full of math equations with a red 'IMPORTANT' stamp.","image_desc_cn":"一副眼镜放在摊开的课本和红笔旁，台灯明亮；一块写满数学公式的白板，角落有红色‘重要’印章。","meaning_cn":"adv. 认真地；严重地","usage":"adv. (形容词 serious → 副词 seriously)","collocations":"take seriously, seriously consider, seriously ill","preposition_combos":"think seriously about, take something seriously","examples":[{"en":"You should take your homework seriously every day.","cn":"你应该每天认真对待你的家庭作业。"},{"en":"The doctor said the patient was seriously injured in the accident.","cn":"医生说病人在事故中受了重伤。"}],"socratic_questions":[{"question":"老师提醒你要用心对待每一次考试复习，不要马虎，应该用什么词来形容这种态度？","answer_hint":"表示‘认真地’，强调态度严肃、不敷衍。"}],"fill_blank":{"sentences":["If you don't study ___, you may fail the final exam."],"options":["seriously","happily","quickly","loudly"],"correct_index":0},"audio":"audio/seriously.mp3","audio_ex0":"audio/seriously_ex0.mp3","audio_ex1":"audio/seriously_ex1.mp3"},{"word":"training","ipa":"/ˈtreɪnɪŋ/","image_prompts":["A pair of running shoes placed on a rubber track with white lane markings, morning sunlight casting long shadows","A set of dumbbells neatly arranged on a metal rack in a gym, water bottle and towel on a bench nearby"],"image_desc_en":"Running shoes on a rubber track with lane markings under morning sunlight; dumbbells on a rack with a water bottle and towel on a gym bench.","image_desc_cn":"一双跑鞋放在有白色跑道的橡胶跑道上，晨光投下长影；哑铃整齐排列在健身房架子上，旁边长凳上有水瓶和毛巾。","meaning_cn":"n. 训练；培训","usage":"n. (不可数名词，动词 train → 名词 training)","collocations":"training program, training session, physical training","preposition_combos":"training for, training in","examples":[{"en":"The soccer team has training every afternoon after school.","cn":"足球队每天下午放学后都有训练。"},{"en":"Good training helps you improve your skills step by step.","cn":"好的训练能帮助你一步步提高技能。"}],"socratic_questions":[{"question":"为了在校运动会上取得好成绩，你每天放学后都去操场跑步、做俯卧撑，这个过程叫什么？","answer_hint":"指为了提升某项能力而进行的系统练习，常与体育或技能相关。"}],"fill_blank":{"sentences":["The basketball team's ___ starts at 4 p.m. every Tuesday."],"options":["training","meeting","party","class"],"correct_index":0},"audio":"audio/training.mp3","audio_ex0":"audio/training_ex0.mp3","audio_ex1":"audio/training_ex1.mp3"},{"word":"nervous","ipa":"/ˈnɜːrvəs/","image_prompts":["A tightly clenched fist with white knuckles resting on a wooden desk, soft lamp light","A stack of unopened exam papers with a single drop of sweat on the envelope, gray background"],"image_desc_en":"A clenched fist on a desk; a sweaty exam envelope.","image_desc_cn":"桌上紧握的拳头；带汗渍的考试信封。","meaning_cn":"紧张的；焦虑不安的","usage":"adj. (比较级 more nervous, 最高级 most nervous)","collocations":"feel nervous, get nervous, nervous about","preposition_combos":"nervous about (sth./doing sth.)","examples":[{"en":"I always feel nervous before a big math exam.","cn":"在大考数学前我总是感到紧张。"},{"en":"She was too nervous to speak in front of the class.","cn":"她太紧张了，不敢在全班面前说话。"}],"socratic_questions":[{"question":"明天要上台演讲，你的手心出汗、心跳加快，这种状态叫什么？","answer_hint":"这个词描述的是考试或公开场合前的不安感，和‘焦虑’类似但更侧重临场反应。"}],"fill_blank":{"sentences":["He felt ___ when the teacher called his name."],"options":["nervous","excited","angry","bored"],"correct_index":0},"audio":"audio/nervous.mp3","audio_ex0":"audio/nervous_ex0.mp3","audio_ex1":"audio/nervous_ex1.mp3"},{"word":"stranger","ipa":"/ˈstreɪndʒər/","image_prompts":["A closed front door with a shadowy silhouette visible through the frosted glass, night time","An empty park bench with a single lost glove lying on it, autumn leaves scattered"],"image_desc_en":"A shadow behind a frosted door; a lost glove on a bench.","image_desc_cn":"磨砂门后的影子；长椅上的孤手套。","meaning_cn":"陌生人；外地人","usage":"n. (可数名词，复数 strangers)","collocations":"a complete stranger, talk to strangers, stranger danger","preposition_combos":"stranger to (sb./sth.)","examples":[{"en":"Never accept candy from a stranger on the street.","cn":"绝不要接受街上陌生人给的糖果。"},{"en":"He was a stranger to this small town and got lost easily.","cn":"他对这个小镇很陌生，容易迷路。"}],"socratic_questions":[{"question":"你在公园里看到一个从未见过的人，你该怎么称呼他？","answer_hint":"这个词指你不认识、不了解的人，和‘朋友’相反。"}],"fill_blank":{"sentences":["A ___ asked me for directions to the library."],"options":["stranger","teacher","friend","neighbor"],"correct_index":0},"audio":"audio/stranger.mp3","audio_ex0":"audio/stranger_ex0.mp3","audio_ex1":"audio/stranger_ex1.mp3"},{"word":"tip","ipa":"/tɪp/","image_prompts":["A small coin placed on a restaurant receipt next to an empty coffee cup, warm lighting","A handwritten note saying 'Add salt slowly' taped to a kitchen counter, with a salt shaker"],"image_desc_en":"A coin on a receipt; a note with cooking advice on a counter.","image_desc_cn":"收据上的硬币；厨房台面上的烹饪建议便条。","meaning_cn":"小费；提示；尖端","usage":"n. (可数名词，复数 tips) / v. (过去式 tipped, 过去分词 tipped) 给…小费；倾倒","collocations":"leave a tip, useful tip, tip of the finger, tip over","preposition_combos":"tip for (doing sth.), tip on (sth.)","examples":[{"en":"My dad left a five-dollar tip for the waiter.","cn":"我爸爸给服务员留了五美元小费。"},{"en":"Here is a useful tip for keeping your room tidy.","cn":"这里有一条保持房间整洁的实用建议。"}],"socratic_questions":[{"question":"在餐厅吃完饭，你觉得服务很好，额外放一点钱在桌上，这笔钱叫什么？","answer_hint":"这个词既指给服务员的额外报酬，也指一条好建议。"}],"fill_blank":{"sentences":["Can you give me a ___ on how to solve this puzzle?"],"options":["tip","trip","top","tap"],"correct_index":0},"audio":"audio/tip.mp3","audio_ex0":"audio/tip_ex0.mp3","audio_ex1":"audio/tip_ex1.mp3"},{"word":"carefully","ipa":"/ˈkerəfəli/","image_prompts":["A pair of tweezers holding a single grain of rice over a white plate, macro photography","A glass vase being placed on a high shelf with a soft cloth underneath, steady hands"],"image_desc_en":"Tweezers holding a rice grain; a vase placed on a shelf with cloth.","image_desc_cn":"镊子夹着一粒米；用布垫着把花瓶放上架子。","meaning_cn":"小心地；仔细地","usage":"adv. (比较级 more carefully, 最高级 most carefully) 由形容词 careful + -ly 构成","collocations":"read carefully, listen carefully, drive carefully, handle carefully","preposition_combos":"无固定介词搭配，常修饰动词","examples":[{"en":"Please read the exam questions carefully before answering.","cn":"请在作答前仔细阅读考试题目。"},{"en":"She carefully wrapped the gift in colorful paper.","cn":"她小心地用彩纸把礼物包好。"}],"socratic_questions":[{"question":"做化学实验时，老师要求你慢慢倒液体，避免洒出来，这个动作应该怎么做？","answer_hint":"这个词描述的是‘非常专注、避免出错’地做某件事，和‘粗心’相反。"}],"fill_blank":{"sentences":["You should ___ check your homework for mistakes."],"options":["carefully","quickly","loudly","angrily"],"correct_index":0},"audio":"audio/carefully.mp3","audio_ex0":"audio/carefully_ex0.mp3","audio_ex1":"audio/carefully_ex1.mp3"},{"word":"sincerely","ipa":"/sɪnˈsɪrli/","image_prompts":["A handwritten thank-you note on cream paper, a fountain pen resting beside it, soft sunlight on the desk","A red heart-shaped seal stamp on an envelope, wax dripping slightly, on a wooden table"],"image_desc_en":"A handwritten thank-you note on cream paper with a fountain pen beside it, soft sunlight illuminating the desk.","image_desc_cn":"一张奶油色纸上的手写感谢信，旁边放着一支钢笔，柔和的阳光照亮桌面。","meaning_cn":"真诚地；由衷地","usage":"adv.","collocations":"sincerely hope, sincerely believe, sincerely apologize, yours sincerely","preposition_combos":"","examples":[{"en":"I sincerely hope you will enjoy the birthday gift.","cn":"我真诚地希望你会喜欢这份生日礼物。"},{"en":"She sincerely thanked her friend for the help.","cn":"她真诚地感谢朋友的帮助。"}],"socratic_questions":[{"question":"你在给朋友写感谢信时，想表达发自内心的感谢，应该用哪个副词？","answer_hint":"这个词强调感情的真实和诚恳，常用于书信结尾或表达强烈愿望。"}],"fill_blank":{"sentences":["I ___ hope our team can win the basketball game."],"options":["sincerely","hardly","quickly","loudly"],"correct_index":0},"audio":"audio/sincerely.mp3","audio_ex0":"audio/sincerely_ex0.mp3","audio_ex1":"audio/sincerely_ex1.mp3"},{"word":"opening","ipa":"/ˈoʊpənɪŋ/","image_prompts":["A wooden door slightly ajar, a sliver of golden light streaming through the gap onto a dark floor","A red theater curtain being pulled apart, revealing a bright stage with spotlights"],"image_desc_en":"A wooden door slightly ajar with a sliver of golden light streaming through the gap onto a dark floor.","image_desc_cn":"一扇木门微微敞开，一缕金色光线从门缝照在黑暗的地板上。","meaning_cn":"开口；开始；开幕","usage":"n.","collocations":"grand opening, opening ceremony, opening hours, opening night","preposition_combos":"at the opening of, during the opening","examples":[{"en":"The grand opening of the new library is next Monday.","cn":"新图书馆的盛大开幕仪式在下周一。"},{"en":"The opening of the movie was very exciting.","cn":"电影的开头非常激动人心。"}],"socratic_questions":[{"question":"学校新图书馆第一次向学生开放的那天，我们称之为什么仪式？","answer_hint":"这个词表示一个事件或场所的首次公开亮相，常与'grand'搭配。"}],"fill_blank":{"sentences":["We arrived early for the ___ of the art exhibition."],"options":["opening","closing","ending","middle"],"correct_index":0},"audio":"audio/opening.mp3","audio_ex0":"audio/opening_ex0.mp3","audio_ex1":"audio/opening_ex1.mp3"},{"word":"closing","ipa":"/ˈkloʊzɪŋ/","image_prompts":["A metal gate with a padlock being shut at sunset, long shadows on the ground","A bookstore window with a 'CLOSED' sign hanging on the glass, lights off inside"],"image_desc_en":"A metal gate with a padlock being shut at sunset, long shadows stretching on the ground.","image_desc_cn":"日落时分一扇带挂锁的铁门正在关闭，地面上拖着长长的影子。","meaning_cn":"关闭；结束；结尾","usage":"n.","collocations":"closing time, closing ceremony, closing remarks, closing date","preposition_combos":"at the closing of, before closing","examples":[{"en":"The closing ceremony of the sports meet was wonderful.","cn":"运动会的闭幕式非常精彩。"},{"en":"Please hand in your homework before the closing of school.","cn":"请在放学之前交上作业。"}],"socratic_questions":[{"question":"运动会最后一天，所有运动员集合在操场上举行什么仪式？","answer_hint":"这个词表示一个活动的最后部分，与'opening'相对。"}],"fill_blank":{"sentences":["The store's ___ time is 9:00 PM every day."],"options":["closing","opening","starting","working"],"correct_index":0},"audio":"audio/closing.mp3","audio_ex0":"audio/closing_ex0.mp3","audio_ex1":"audio/closing_ex1.mp3"},{"word":"sentence","ipa":"/ˈsentəns/","image_prompts":["A chalkboard with a neatly written English sentence underlined in white chalk, an eraser nearby","A stack of vocabulary flashcards on a desk, each card showing one complete sentence in blue ink"],"image_desc_en":"A chalkboard with a neatly written English sentence underlined in white chalk, an eraser resting on the tray.","image_desc_cn":"一块黑板上用白粉笔工整地写着一个英文句子并画了下划线，板擦放在粉笔槽上。","meaning_cn":"句子；判决","usage":"n.","collocations":"complete sentence, topic sentence, sentence structure, make a sentence","preposition_combos":"in a sentence, sentence about","examples":[{"en":"Please write a complete sentence to answer the question.","cn":"请写一个完整的句子来回答问题。"},{"cn":"每个段落都应该有一个主题句。","en":"Every paragraph should have a topic sentence."}],"socratic_questions":[{"question":"英语考试中，老师要求你写一个包含主语和谓语的完整结构，这叫什么？","answer_hint":"这个词是语言的基本单位，表达一个完整的意思，以句号结束。"}],"fill_blank":{"sentences":["Can you make a ___ using the word 'environment'?"],"options":["sentence","word","letter","paragraph"],"correct_index":0},"audio":"audio/sentence.mp3","audio_ex0":"audio/sentence_ex0.mp3","audio_ex1":"audio/sentence_ex1.mp3"},{"word":"date","ipa":"/deɪt/","image_prompts":["A wall calendar with a red circle around the 15th day, a small clock icon next to it","A digital wristwatch display showing the month and day numbers in bright green LED"],"image_desc_en":"A wall calendar with a red circle around the 15th day, a small clock icon next to it","image_desc_cn":"一本挂历，15号被红圈标出，旁边有一个小钟表图标","meaning_cn":"日期；约会；约会对象；枣","usage":"n. (可数名词) / v. (过去式 dated, 过去分词 dated)","collocations":"set a date, out of date, date back to, blind date","preposition_combos":"date with, date from","examples":[{"en":"Please write the correct date on the top of your test paper.","cn":"请在你的试卷顶部写上正确的日期。"},{"en":"The museum has a special event on that date next month.","cn":"博物馆在下个月的那个日期有一个特别活动。"}],"socratic_questions":[{"question":"你想和朋友约好下周六一起去看电影，你需要先确认什么信息？","answer_hint":"需要确认具体的某一天，即日期。"}],"fill_blank":{"sentences":["What is the ___ of your school's sports day this year?"],"options":["date","time","place","weather"],"correct_index":0},"audio":"audio/date.mp3","audio_ex0":"audio/date_ex0.mp3","audio_ex1":"audio/date_ex1.mp3"},{"word":"clause","ipa":"/klɔːz/","image_prompts":["An open grammar textbook with a highlighted sentence containing a subject and a verb underlined in red","A whiteboard with a simple sentence diagram showing a main clause and a subordinate clause connected by a line"],"image_desc_en":"An open grammar textbook with a highlighted sentence containing a subject and a verb underlined in red","image_desc_cn":"一本打开的语法书，一个包含主语和谓语的句子被红色高亮并划线","meaning_cn":"从句；条款","usage":"n. (可数名词)","collocations":"main clause, subordinate clause, relative clause, contract clause","preposition_combos":"clause in, clause about","examples":[{"en":"A complete sentence must have at least one main clause.","cn":"一个完整的句子必须至少有一个主句。"},{"en":"The teacher asked us to find the clause that starts with 'because'.","cn":"老师让我们找出以 'because' 开头的从句。"}],"socratic_questions":[{"question":"英语老师让你分析一个长句，说它由两个部分用连词连接，其中一个部分不能单独成句。这个部分叫什么？","answer_hint":"不能独立成句的部分，在语法中称为从句。"}],"fill_blank":{"sentences":["In the sentence 'I know that he is right', the part 'that he is right' is a ___."],"options":["clause","phrase","word","letter"],"correct_index":0},"audio":"audio/clause.mp3","audio_ex0":"audio/clause_ex0.mp3","audio_ex1":"audio/clause_ex1.mp3"},{"word":"misunderstanding","ipa":"/ˌmɪsʌndərˈstændɪŋ/","image_prompts":["Two speech bubbles with crossed-out words and a large red X between them on a gray background","A handwritten note on a desk with a word crossed out and a question mark drawn next to it"],"image_desc_en":"Two speech bubbles with crossed-out words and a large red X between them on a gray background","image_desc_cn":"两个对话气泡，中间有被划掉的词和一个大大的红色叉号","meaning_cn":"误解；误会","usage":"n. (可数名词或不可数名词) / v. misunderstand (过去式 misunderstood, 过去分词 misunderstood)","collocations":"clear up a misunderstanding, cause a misunderstanding, avoid misunderstanding","preposition_combos":"misunderstanding about, misunderstanding between","examples":[{"en":"A simple misunderstanding can sometimes hurt a good friendship.","cn":"一个简单的误会有时会伤害一段好的友谊。"},{"en":"We had a small misunderstanding about the time of the meeting.","cn":"我们对会议时间有一个小小的误会。"}],"socratic_questions":[{"question":"你和朋友约好三点在校门口见，但你等了半小时他都没来，后来发现他以为是四点。这是什么情况？","answer_hint":"双方对时间理解不同，这就是一个误会。"}],"fill_blank":{"sentences":["They had a ___ because he thought she said 'Tuesday' but she said 'Thursday'."],"options":["misunderstanding","agreement","discussion","celebration"],"correct_index":0},"audio":"audio/misunderstanding.mp3","audio_ex0":"audio/misunderstanding_ex0.mp3","audio_ex1":"audio/misunderstanding_ex1.mp3"},{"word":"event","ipa":"/ɪˈvent/","image_prompts":["A large outdoor stage with colorful banners and a banner reading 'School Fair' in the background","A row of gold, silver, and bronze medals on a wooden podium with a number 1, 2, 3"],"image_desc_en":"A large outdoor stage with colorful banners and a banner reading 'School Fair' in the background","image_desc_cn":"一个大型户外舞台，挂着彩色横幅，背景横幅上写着 '学校游园会'","meaning_cn":"事件；活动；比赛项目","usage":"n. (可数名词)","collocations":"sports event, main event, special event, current events","preposition_combos":"event in, event at, event on","examples":[{"en":"The school's annual music event will be held in the gymnasium.","cn":"学校一年一度的音乐活动将在体育馆举行。"},{"cn":"跑步比赛是运动会中最受欢迎的项目之一。","en":"The running race is one of the most popular events in the sports meet."}],"socratic_questions":[{"question":"学校下个月要举办一个大型活动，有表演、比赛和美食摊位。这个大型活动叫什么？","answer_hint":"有组织、有计划的集体活动，称为事件或活动。"}],"fill_blank":{"sentences":["The 100-meter dash is the first ___ of the school sports day."],"options":["event","class","lesson","subject"],"correct_index":0},"audio":"audio/event.mp3","audio_ex0":"audio/event_ex0.mp3","audio_ex1":"audio/event_ex1.mp3"},{"word":"take place","ipa":"/teɪk pleɪs/","image_prompts":["A calendar on a wall with a red circle around a date, a clock showing 3 PM, and a banner reading 'School Sports Day' hanging above","A stage with red curtains and a microphone stand, spotlights shining down, and a sign saying 'Talent Show' on the floor"],"image_desc_en":"A calendar with a marked date and a clock, or a stage with a talent show sign.","image_desc_cn":"日历上标记的日期和时钟，或带有才艺表演标志的舞台。","meaning_cn":"发生；举行","usage":"动词短语 (过去式 took place, 过去分词 taken place)","collocations":"event takes place, competition takes place, meeting takes place","preposition_combos":"take place in/on/at (地点/时间)","examples":[{"en":"The school art festival will take place next Friday afternoon.","cn":"学校艺术节将在下周五下午举行。"},{"en":"Our final exam usually takes place in early January.","cn":"我们的期末考试通常在1月初进行。"}],"socratic_questions":[{"question":"你想说学校的运动会将在下个月举行，但不想用‘hold’这个词，因为它是被动语态。哪个短语可以表示‘发生、举行’？","answer_hint":"这个短语由两个词组成，字面意思是‘占据一个地方’，常用来描述事件的发生。"}],"fill_blank":{"sentences":["The class meeting will ___ in Room 201 tomorrow morning."],"options":["take place","take off","take care","take part"],"correct_index":0},"audio":"audio/take_place.mp3","audio_ex0":"audio/take_place_ex0.mp3","audio_ex1":"audio/take_place_ex1.mp3"},{"word":"cost","ipa":"/kɒst/","image_prompts":["A price tag hanging on a new backpack with the number $35.99 written on it, on a store shelf","A receipt from a supermarket showing a total of $12.50, with coins and a wallet next to it"],"image_desc_en":"A price tag on a backpack or a supermarket receipt with coins.","image_desc_cn":"背包上的价格标签或超市收据和硬币。","meaning_cn":"花费；成本；代价","usage":"v. (过去式 cost, 过去分词 cost) / n.","collocations":"cost money, cost time, low cost, high cost","preposition_combos":"cost (sb) + 金额; at the cost of","examples":[{"en":"This new dictionary cost me thirty yuan at the bookstore.","cn":"这本新词典在书店花了我30元。"},{"en":"The cost of the school trip is fifty dollars per student.","cn":"学校旅行的费用是每个学生50美元。"}],"socratic_questions":[{"question":"你想说‘这本书花了我20块钱’，但不想用‘spend’（因为主语是人）。哪个动词的主语可以是物品，表示‘花费多少钱’？","answer_hint":"这个动词的过去式和原形一样，常用来询问或说明物品的价格。"}],"fill_blank":{"sentences":["How much does this ticket ___ for the concert?"],"options":["cost","spend","pay","take"],"correct_index":0},"audio":"audio/cost.mp3","audio_ex0":"audio/cost_ex0.mp3","audio_ex1":"audio/cost_ex1.mp3"},{"word":"opportunity","ipa":"/ˌɒpəˈtjuːnəti/","image_prompts":["An open door with sunlight streaming through, a golden key lying on the floor in front of it","A blank application form on a desk with a pen, a sign reading 'Volunteer Program' in the background"],"image_desc_en":"An open door with sunlight and a key, or a blank application form with a volunteer sign.","image_desc_cn":"一扇敞开的门，阳光和钥匙，或一张空白申请表和志愿者标志。","meaning_cn":"机会；时机","usage":"n. (可数名词，复数 opportunities)","collocations":"have an opportunity, miss an opportunity, golden opportunity, job opportunity","preposition_combos":"opportunity to do sth; opportunity for sth","examples":[{"en":"This summer camp is a great opportunity to learn English.","cn":"这个夏令营是学习英语的好机会。"},{"en":"Don't miss the opportunity to join the async function selectUnit(n) {

  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
}
async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {

}
