<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>
</head>

  <script>window.VOCAB_DATA={"units":[{"unit":3,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"compare","ipa":"/kəmˈpeər/","image_prompts":["Two apples side by side on a wooden table, one red and one green, with a measuring tape between them","A split-screen image showing a sunny beach on the left and a snowy mountain on the right, with a large equal sign in the middle"],"image_desc_en":"Two apples side by side on a wooden table, one red and one green, with a measuring tape between them","image_desc_cn":"木桌上并排放着两个苹果，一个红色一个绿色，中间有一把卷尺","meaning_cn":"比较，对比","usage":"v. (过去式 compared, 过去分词 compared)","collocations":"compare A with B, compare A to B","preposition_combos":"compare with, compare to","examples":[{"en":"I often compare my test scores with my best friend's.","cn":"我经常把我的考试成绩和我最好朋友的比较。"},{"en":"The teacher asked us to compare the two poems in class.","cn":"老师让我们在课堂上比较这两首诗。"}],"socratic_questions":[{"question":"你想知道两本词典哪本更好，你会做什么动作？","answer_hint":"这个动作是把两个东西放在一起看异同，就是‘比较’的意思。"}],"fill_blank":{"sentences":["Please ___ your answers with your partner's before handing in."],"options":["compare","complete","collect","correct"],"correct_index":0},"audio":"audio/compare.mp3","audio_ex0":"audio/compare_ex0.mp3","audio_ex1":"audio/compare_ex1.mp3"},{"word":"shy","ipa":"/ʃaɪ/","image_prompts":["A small kitten hiding behind a large green plant pot, only its tail visible","A closed book with a bookmark sticking out, placed on a quiet library desk in soft sunlight"],"image_desc_en":"A small kitten hiding behind a large green plant pot, only its tail visible","image_desc_cn":"一只小猫躲在大绿植花盆后面，只露出尾巴","meaning_cn":"害羞的，腼腆的","usage":"adj. (比较级 shyer, 最高级 shyest)","collocations":"feel shy, too shy to do, shy smile","preposition_combos":"shy of, shy about","examples":[{"en":"She felt too shy to speak in front of the class.","cn":"她太害羞了，不敢在全班面前发言。"},{"en":"The new student gave a shy wave from the back row.","cn":"新来的学生从后排害羞地挥了挥手。"}],"socratic_questions":[{"question":"你第一次上台演讲时，心跳很快，不敢看观众，这种状态叫什么？","answer_hint":"这种紧张、不敢表现自己的感觉，就是‘害羞’。"}],"fill_blank":{"sentences":["My little sister is too ___ to order food by herself."],"options":["shy","lazy","loud","proud"],"correct_index":0},"audio":"audio/shy.mp3","audio_ex0":"audio/shy_ex0.mp3","audio_ex1":"audio/shy_ex1.mp3"},{"word":"lazy","ipa":"/ˈleɪzi/","image_prompts":["A cat curled up sleeping on a pile of unopened books under a desk lamp","A half-finished homework sheet lying on a messy desk next to a smartphone with a game screen"],"image_desc_en":"A cat curled up sleeping on a pile of unopened books under a desk lamp","image_desc_cn":"一只猫蜷缩在一堆未打开的书上睡觉，台灯下","meaning_cn":"懒惰的，懒散的","usage":"adj. (比较级 lazier, 最高级 laziest; 副词 lazily)","collocations":"lazy afternoon, lazy habit, too lazy to do","preposition_combos":"lazy about","examples":[{"en":"He is too lazy to clean his room on weekends.","cn":"他太懒了，周末都不打扫房间。"},{"en":"A lazy cat slept on the sofa all afternoon.","cn":"一只懒猫在沙发上睡了一整个下午。"}],"socratic_questions":[{"question":"周末你只想躺着玩手机，不想写作业，这种状态用一个词形容是什么？","answer_hint":"不想动、不想做事，就是‘懒惰’的表现。"}],"fill_blank":{"sentences":["Don't be so ___; finish your homework before dinner."],"options":["lazy","busy","shy","smart"],"correct_index":0},"audio":"audio/lazy.mp3","audio_ex0":"audio/lazy_ex0.mp3","audio_ex1":"audio/lazy_ex1.mp3"},{"word":"loud","ipa":"/laʊd/","image_prompts":["A red alarm clock ringing on a bedside table with visible sound waves drawn around it","A construction site with a yellow jackhammer hitting concrete, dust flying up"],"image_desc_en":"A red alarm clock ringing on a bedside table with visible sound waves drawn around it","image_desc_cn":"红色闹钟在床头柜上响着，周围画有可见的声波","meaning_cn":"大声的，响亮的；吵闹的","usage":"adj. (比较级 louder, 最高级 loudest; 副词 loudly)","collocations":"loud music, loud voice, loud noise","preposition_combos":"loud in","examples":[{"en":"The loud music from the party kept me awake all night.","cn":"派对上吵闹的音乐让我整晚睡不着。"},{"en":"Please speak in a loud voice so everyone can hear you.","cn":"请大声说话，这样每个人都能听到你。"}],"socratic_questions":[{"question":"图书馆里有人大声打电话，你会用什么词形容他的声音？","answer_hint":"声音很大、很吵，就是‘大声的’。"}],"fill_blank":{"sentences":["The ___ thunder scared the dog under the bed."],"options":["loud","soft","quiet","sweet"],"correct_index":0},"audio":"audio/loud.mp3","audio_ex0":"audio/loud_ex0.mp3","audio_ex1":"audio/loud_ex1.mp3"},{"word":"rainfall","ipa":"/ˈreɪnfɔːl/","image_prompts":["A rain gauge on a wooden post showing 50 mm of water after a heavy storm, surrounded by wet grass","A puddle on a dirt road with ripples from falling raindrops, dark clouds in the sky"],"image_desc_en":"A rain gauge filled with water after a storm, with wet grass around it.","image_desc_cn":"暴雨后装满水的雨量计，周围是湿漉漉的草地。","meaning_cn":"降雨量","usage":"n. (不可数名词)","collocations":"heavy rainfall, annual rainfall, average rainfall","preposition_combos":"rainfall in (地区/月份), rainfall of (数量)","examples":[{"en":"The annual rainfall in this city is about 800 mm.","cn":"这个城市的年降雨量约为800毫米。"},{"en":"Heavy rainfall caused the river to rise quickly.","cn":"强降雨导致河水迅速上涨。"}],"socratic_questions":[{"question":"气象预报说今天会有很多雨水，你想知道具体下了多少毫米，应该查什么数据？","answer_hint":"这个词指降水的总量，不是雨滴本身，而是测量出的数值。"}],"fill_blank":{"sentences":["The ___ in July was much higher than last year."],"options":["rainfall","raincoat","rainbow","raindrop"],"correct_index":0},"audio":"audio/rainfall.mp3","audio_ex0":"audio/rainfall_ex0.mp3","audio_ex1":"audio/rainfall_ex1.mp3"},{"word":"per","ipa":"/pɜːr/","image_prompts":["A speed limit sign on a road showing '60 km per hour' with a blurred car in the background","A grocery store shelf with a price tag reading '$2 per kilogram' on a bag of apples"],"image_desc_en":"A speed limit sign indicating 60 kilometers per hour on a roadside.","image_desc_cn":"路边限速标志，显示每小时60公里。","meaning_cn":"每，每一","usage":"prep. (介词)","collocations":"per day, per person, per hour, per cent","preposition_combos":"per + 单位名词","examples":[{"en":"The ticket costs $10 per person for the show.","cn":"这场演出的门票每人10美元。"},{"en":"We can finish about five math problems per minute.","cn":"我们每分钟大约能完成五道数学题。"}],"socratic_questions":[{"question":"你想知道每个学生需要交多少活动费，老师告诉你一个数字，这个数字是按什么单位计算的？","answer_hint":"这个词表示‘每个’，后面常跟时间或人数单位。"}],"fill_blank":{"sentences":["The bus can carry 50 passengers ___ trip."],"options":["per","for","with","by"],"correct_index":0},"audio":"audio/per.mp3","audio_ex0":"audio/per_ex0.mp3","audio_ex1":"audio/per_ex1.mp3"},{"word":"millimeter","ipa":"/ˈmɪlɪmiːtər/","image_prompts":["A digital caliper measuring a thin metal wire, display showing 0.5 millimeter","A stack of 100 sheets of paper with a label '10 millimeters' on a desk, next to a ruler"],"image_desc_en":"A digital caliper measuring a thin wire, with the display showing 0.5 millimeter.","image_desc_cn":"数显卡尺测量一根细金属丝，显示屏显示0.5毫米。","meaning_cn":"毫米","usage":"n. (可数名词，复数 millimeters)","collocations":"one millimeter, a few millimeters, millimeter by millimeter","preposition_combos":"millimeter in diameter, millimeter of (物质)","examples":[{"en":"The screw is 3 millimeters in diameter and 20 long.","cn":"这颗螺丝直径3毫米，长20毫米。"},{"en":"Move the camera just one millimeter to the left.","cn":"把相机向左移动仅仅一毫米。"}],"socratic_questions":[{"question":"组装模型时，零件需要精确到很小的长度单位，厘米太大，应该用什么单位？","answer_hint":"这个词是‘毫米’的全称，比厘米小10倍，用于精细测量。"}],"fill_blank":{"sentences":["The gap between the two parts is less than one ___."],"options":["millimeter","kilometer","centimeter","meter"],"correct_index":0},"audio":"audio/millimeter.mp3","audio_ex0":"audio/millimeter_ex0.mp3","audio_ex1":"audio/millimeter_ex1.mp3"},{"word":"pleasant","ipa":"/ˈpleznt/","image_prompts":["A bright sunny day with a clear blue sky, green grass, and a single white daisy in the foreground, soft natural lighting","A cup of hot tea on a wooden table next to an open book, steam rising gently, warm golden hour light"],"image_desc_en":"A sunny meadow with a single daisy, or a steaming tea cup beside an open book in warm light.","image_desc_cn":"阳光明媚的草地上有一朵雏菊，或一杯热茶旁放着一本打开的书，光线温暖。","meaning_cn":"令人愉快的，舒适的","usage":"adj. (比较级 pleasanter / more pleasant, 最高级 pleasantest / most pleasant)","collocations":"pleasant weather, pleasant experience, pleasant smile, pleasant voice","preposition_combos":"pleasant to someone, pleasant for someone","examples":[{"en":"The weather today is very pleasant for a picnic.","cn":"今天的天气非常适合野餐。"},{"en":"She has a pleasant voice that makes everyone calm.","cn":"她有一副令人愉快的嗓音，让每个人都平静下来。"}],"socratic_questions":[{"question":"你周末去公园散步，阳光温暖，微风拂面，鸟语花香。你会用什么词形容这种感受？","answer_hint":"这个词描述让人感到舒适、开心、放松的环境或事物，不是‘美丽’或‘有趣’，而是‘舒服’。"}],"fill_blank":{"sentences":["The garden looks very ___ with all the colorful flowers."],"options":["pleasant","angry","noisy","boring"],"correct_index":0},"audio":"audio/pleasant.mp3","audio_ex0":"audio/pleasant_ex0.mp3","audio_ex1":"audio/pleasant_ex1.mp3"},{"word":"difference","ipa":"/ˈdɪfrəns/","image_prompts":["Two apples side by side on a wooden table, one red and one green, with a small arrow pointing between them","A ruler measuring two pencils of different lengths on a white desk, clear contrast in size"],"image_desc_en":"A red apple and a green apple with an arrow between them, or a ruler comparing two pencils of different lengths.","image_desc_cn":"一个红苹果和一个绿苹果，中间有箭头；或一把尺子测量两支不同长度的铅笔。","meaning_cn":"差异，不同之处","usage":"n. (可数名词，复数 differences)","collocations":"make a difference, tell the difference, big difference, cultural difference","preposition_combos":"difference between A and B, difference in something","examples":[{"en":"Can you tell the difference between these two pictures?","cn":"你能看出这两幅画的不同之处吗？"},{"en":"A small effort can make a big difference to the environment.","cn":"一个小小的努力可以对环境产生很大的不同。"}],"socratic_questions":[{"question":"你面前有两支笔，一支蓝色一支红色，长度也不一样。你要怎么描述它们之间的关系？","answer_hint":"这个词强调两者之间‘不一样’的地方，不是‘相同’或‘相似’。"}],"fill_blank":{"sentences":["There is a big ___ between summer and winter in this city."],"options":["difference","similarity","pleasure","mirror"],"correct_index":0},"audio":"audio/difference.mp3","audio_ex0":"audio/difference_ex0.mp3","audio_ex1":"audio/difference_ex1.mp3"},{"word":"alike","ipa":"/əˈlaɪk/","image_prompts":["Two identical white coffee mugs on a shelf, same shape and size, side by side","A pair of matching sneakers placed neatly on a shoe rack, both white with blue stripes"],"image_desc_en":"Two identical white mugs on a shelf, or a pair of matching sneakers with blue stripes.","image_desc_cn":"两个一模一样的白色马克杯放在架子上，或一双带有蓝色条纹的匹配运动鞋。","meaning_cn":"相似的，相同的；同样地","usage":"adj. (只作表语，不作定语) / adv.","collocations":"look alike, treat alike, think alike, very alike","preposition_combos":"alike in something","examples":[{"en":"The two houses look so alike that I often get lost.","cn":"这两栋房子看起来太像了，我经常迷路。"},{"en":"All the books on this shelf are alike in color.","cn":"这个架子上所有的书颜色都一样。"}],"socratic_questions":[{"question":"你看到两片树叶，形状和颜色几乎一模一样，很难区分。你会怎么形容它们？","answer_hint":"这个词表示‘非常相像’，但不是‘相同’（same），也不是‘不同’（different）。"}],"fill_blank":{"sentences":["The twins are so ___ that their teacher cannot tell them apart."],"options":["alike","different","pleasant","mirror"],"correct_index":0},"audio":"audio/alike.mp3","audio_ex0":"audio/alike_ex0.mp3","audio_ex1":"audio/alike_ex1.mp3"},{"word":"mirror","ipa":"/ˈmɪrər/","image_prompts":["A rectangular mirror hanging on a white wall, reflecting a window with sunlight streaming in","A small round mirror on a wooden dressing table, reflecting a vase of fresh flowers"],"image_desc_en":"A rectangular mirror reflecting a sunny window, or a round mirror reflecting a vase of flowers on a table.","image_desc_cn":"一面长方形镜子反射出阳光明媚的窗户，或一面圆镜反射出桌上的花瓶。","meaning_cn":"镜子；反映，反射","usage":"n. (可数名词，复数 mirrors) / v. (过去式 mirrored, 过去分词 mirrored)","collocations":"look in the mirror, rearview mirror, mirror image, mirror one's feelings","preposition_combos":"mirror of something, mirror in something","examples":[{"en":"She checked her hair in the mirror before leaving home.","cn":"她在离家前照镜子检查了头发。"},{"en":"The calm lake mirrors the blue sky perfectly.","cn":"平静的湖面完美地映照出蓝天。"}],"socratic_questions":[{"question":"早上你站在一个光滑的玻璃前，看到自己的脸。这个玻璃叫什么？","answer_hint":"这个词指能照出影像的平面物体，不是窗户，也不是照片。"}],"fill_blank":{"sentences":["The lake is so clear that it acts like a ___ for the mountains."],"options":["mirror","window","picture","difference"],"correct_index":0},"audio":"audio/mirror.mp3","audio_ex0":"audio/mirror_ex0.mp3","audio_ex1":"audio/mirror_ex1.mp3"},{"word":"interest","ipa":"/ˈɪntrəst/","image_prompts":["A stack of colorful science magazines on a wooden desk, a magnifying glass resting on top","A chessboard with pieces mid-game, soft sunlight from a window illuminating the board"],"image_desc_en":"A stack of colorful science magazines on a wooden desk with a magnifying glass on top.","image_desc_cn":"一叠彩色科学杂志放在木桌上，上面放着一个放大镜。","meaning_cn":"兴趣；使感兴趣","usage":"n. / v. (过去式 interested, 过去分词 interested)","collocations":"take an interest in, have no interest in, be interested in","preposition_combos":"interest in","examples":[{"en":"She takes a great interest in reading science fiction books.","cn":"她对阅读科幻小说有浓厚的兴趣。"},{"en":"His new hobby of painting interests many of his classmates.","cn":"他画画的新爱好让很多同学感兴趣。"}],"socratic_questions":[{"question":"小明周末总喜欢去图书馆看恐龙百科，一坐就是两小时。他为什么能这么专注？","answer_hint":"这个词表示对某事物感到好奇或喜欢，常与'in'搭配使用。"}],"fill_blank":{"sentences":["She has a strong ___ in learning how to play the guitar."],"options":["interest","hobby","habit","skill"],"correct_index":0},"audio":"audio/interest.mp3","audio_ex0":"audio/interest_ex0.mp3","audio_ex1":"audio/interest_ex1.mp3"},{"word":"novel","ipa":"/ˈnɒvəl/","image_prompts":["A hardcover book with a bookmark sticking out, lying on a park bench under autumn leaves","A typewriter with a half-typed page, a cup of coffee beside it on a wooden table"],"image_desc_en":"A hardcover book with a bookmark sticking out, lying on a park bench under autumn leaves.","image_desc_cn":"一本带书签的精装书放在公园长椅上，上方有秋叶飘落。","meaning_cn":"小说；新颖的","usage":"n. / adj.","collocations":"read a novel, a popular novel, a novel idea","preposition_combos":"novel about","examples":[{"en":"This novel about a time traveler is very popular at school.","cn":"这本关于时间旅行者的小说在学校很受欢迎。"},{"en":"The teacher praised her novel way to solve the math problem.","cn":"老师表扬了她解决数学问题的新颖方法。"}],"socratic_questions":[{"question":"语文老师推荐了一本课外读物，里面讲了一个侦探破案的故事，这本书叫什么？","answer_hint":"这个词可以指一种虚构的文学作品，也可以形容想法很新。"}],"fill_blank":{"sentences":["I borrowed a science fiction ___ from the school library yesterday."],"options":["novel","magazine","dictionary","textbook"],"correct_index":0},"audio":"audio/novel.mp3","audio_ex0":"audio/novel_ex0.mp3","audio_ex1":"audio/novel_ex1.mp3"},{"word":"sense","ipa":"/sens/","image_prompts":["A kitchen counter with a lemon cut in half, steam rising from a hot cup of tea","A compass on a map with a red arrow pointing north, a pencil marking a route"],"image_desc_en":"A kitchen counter with a lemon cut in half and steam rising from a hot cup of tea.","image_desc_cn":"厨房台面上有半个柠檬，一杯热茶冒着蒸汽。","meaning_cn":"感觉；意识；感官；意识到","usage":"n. / v. (过去式 sensed, 过去分词 sensed)","collocations":"a sense of humor, common sense, make sense","preposition_combos":"sense of","examples":[{"en":"A good sense of direction helps you find your way easily.","cn":"好的方向感能帮你轻松找到路。"},{"en":"She sensed something wrong when the lights went out suddenly.","cn":"当灯突然熄灭时，她感觉到有些不对劲。"}],"socratic_questions":[{"question":"小丽闻到厨房飘来烤蛋糕的香味，她知道妈妈在做好吃的。这是哪种能力？","answer_hint":"这个词可以指五官的感觉，也可以指对某事的判断力。"}],"fill_blank":{"sentences":["It doesn't ___ to stay up too late before an exam."],"options":["sense","make sense","feel","sound"],"correct_index":1},"audio":"audio/sense.mp3","audio_ex0":"audio/sense_ex0.mp3","audio_ex1":"audio/sense_ex1.mp3"},{"word":"humour","ipa":"/ˈhjuːmə(r)/","image_prompts":["A cartoon strip on a newspaper page with a laughing emoji drawn in the margin","A banana peel lying on a sidewalk next to a red clown nose"],"image_desc_en":"A cartoon strip on a newspaper page with a laughing emoji drawn in the margin.","image_desc_cn":"报纸上的一幅连环漫画，页边空白处画了一个大笑的表情符号。","meaning_cn":"幽默；幽默感","usage":"n.","collocations":"sense of humour, black humour, dry humour","preposition_combos":"humour in","examples":[{"en":"His sense of humour always makes the class laugh happily.","cn":"他的幽默感总是让全班开心大笑。"},{"en":"There is a lot of humour in this funny comic book.","cn":"这本有趣的漫画书里有很多幽默元素。"}],"socratic_questions":[{"question":"班里有个同学讲笑话总能逗大家笑，大家说他很有这种品质。是什么品质？","answer_hint":"这个词指让人发笑的能力或特质，常与'sense of'搭配。"}],"fill_blank":{"sentences":["My best friend has a great sense of ___ and tells funny jokes."],"options":["humour","humor","humourous","humorous"],"correct_index":0},"audio":"audio/humour.mp3","audio_ex0":"audio/humour_ex0.mp3","audio_ex1":"audio/humour_ex1.mp3"},{"word":"thanks to","ipa":"/θæŋks tuː/","image_prompts":["A bright red fire truck parked in front of a burning house with water spraying, fire nearly out, smoke clearing, thanks to firefighters' equipment","A green plant growing tall under a sunlamp with a water dropper nearby, soil moist, leaves vibrant, thanks to artificial light and water"],"image_desc_en":"A fire truck with water spraying on a house fire, smoke clearing, showing rescue success due to equipment.","image_desc_cn":"一辆消防车向着火房屋喷水，烟雾散去，显示因设备而成功救援。","meaning_cn":"幸亏；由于（表示原因，常指积极结果）","usage":"介词短语 prep. phrase（后接名词或名词短语）","collocations":"thanks to your help, thanks to the rain, thanks to hard work","preposition_combos":"thanks to + 名词/代词","examples":[{"en":"Thanks to the map, we found the park easily.","cn":"多亏了地图，我们轻松找到了公园。"},{"en":"Thanks to your advice, I passed the exam.","cn":"多亏了你的建议，我通过了考试。"}],"socratic_questions":[{"question":"小明考试没复习，但同桌借给他笔记，他考了高分。你想说“因为同桌的帮助，他成功了”，用哪个短语？","answer_hint":"这个短语表示“由于……（积极原因）”，后面直接跟名词，比如“thanks to his classmate's help”。"}],"fill_blank":{"sentences":["___ the early bus, we arrived on time."],"options":["Thanks to","Because","Instead of","Except for"],"correct_inde e is a strong similarity between the two paintings.","cn":"这两幅画之间有很强的相似性。"},{"en":"Can you find any similarity in their writing styles?","cn":"你能发现他们写作风格上的相似之处吗？"}],"socratic_questions":[{"question":"你和同桌都爱打篮球、听周杰伦的歌。你们之间有很多共同点，这个‘共同点’用英语怎么说？","answer_hint":"这个词由‘similar（相似的）’变化而来，表示‘相似的地方’。"}],"fill_blank":{"sentences":["The ___ between the two twins is amazing."],"options":["similarity","difference","distance","height"],"correct_index":0},"audio":"audio/similarity.mp3","audio_ex0":"audio/similarity_ex0.mp3","audio_ex1":"audio/similarity_ex1.mp3"},{"word":"friendship","ipa":"/ˈfrendʃɪp/","image_prompts":["Two intertwined tree branches growing from separate trunks, forming a natural arch","A pair of matching bracelets made of red string lying on a soft blue cloth"],"image_desc_en":"Two tree branches intertwined, symbolizing a close bond between two entities.","image_desc_cn":"两根交织的树枝，象征两个个体之间的紧密联系。","meaning_cn":"友谊；友情","usage":"n. (不可数名词，但可加不定冠词 a friendship 表示一段友谊); 复数 friendships","collocations":"build friendship, value friendship, close friendship","preposition_combos":"friendship with, friendship between","examples":[{"en":"True friendship is more important than money.","cn":"真正的友谊比金钱更重要。"},{"en":"They developed a deep friendship during summer camp.","cn":"他们在夏令营期间建立了深厚的友谊。"}],"socratic_questions":[{"question":"你和好朋友一起分享快乐、互相帮助，这种关系叫什么？","answer_hint":"这个词由‘friend（朋友）’加后缀‘-ship’构成，表示‘朋友之间的关系’。"}],"fill_blank":{"sentences":["A good ___ can last a lifetime."],"options":["friendship","homework","weather","traffic"],"correct_index":0},"audio":"audio/friendship.mp3","audio_ex0":"audio/friendship_ex0.mp3","audio_ex1":"audio/friendship_ex1.mp3"},{"word":"metre","ipa":"/ˈmiːtər/","image_prompts":["A yellow measuring tape stretched across a wooden floor, markings at 1 metre intervals, bright daylight","A swimming pool with lane ropes and a 50-metre distance marker on the tiled wall, clear blue water"],"image_desc_en":"A measuring tape showing metre markings on a floor; cial expressions, dim theater light"],"image_desc_en":"Chinese calligraphy characters on paper; paper masks with different expressions on a stage.","image_desc_cn":"纸上的中国书法汉字；舞台上带有不同表情的纸面具。","meaning_cn":"角色；性格；汉字","usage":"n. (可数名词，复数 characters)","collocations":"main character, strong character, Chinese character","preposition_combos":"character in, character of","examples":[{"en":"The main character in this story is a brave firefighter.","cn":"这个故事的主角是一位勇敢的消防员。"},{"en":"Learning to write Chinese characters takes a lot of practice.","cn":"学习写汉字需要大量练习。"}],"socratic_questions":[{"question":"你读了一本小说，里面那个勇敢的主角叫什么？","answer_hint":"这个词可以指故事中的人物，也可以指一个人的品质或汉字。"}],"fill_blank":{"sentences":["Each Chinese ___ has a special meaning."],"options":["character","letter","number","symbol"],"correct_index":0},"audio":"audio/character.mp3","audio_ex0":"audio/character_ex0.mp3","audio_ex1":"audio/character_ex1.mp3"},{"word":"pauper","ipa":"/ˈpɔːpər/","image_prompts":["A worn-out leather shoe with a hole in the sole, lying on a cobblestone street, grey weather","An empty wooden bowl and a piece of dry bread on a rough stone table, dim candlelight"],"image_desc_en":"A damaged shoe on a street; an empty bowl with dry bread on a stone table.","image_desc_cn":"街上一只破旧的鞋子；石桌上一个空碗和干面包。","meaning_cn":"穷人；乞丐","usage":"n. (可数名词，复数 paupers)","collocations":"poor pauper, live as a pauper, pauper's grave","preposition_combos":"pauper in ...","examples":[{"en":"The pauper had only a thin coat to keep warm.","cn":"那个穷人只有一件薄外套御寒。"},{"en":"In the story, a rich prince and a poor pauper switch places.","cn":"故事里，一个富王子和一个穷乞丐互换了身份。"}],"socratic_questions":[{"question":"一个没有钱、没有房子、生活很困难的人，我们叫他什么？","answer_hint":"这个词指非常贫穷的人，和‘王子’或‘富人’意思相反。"}],"fill_blank":{"sentences":["The ___ begged for food on the street corner."],"options":["pauper","prince","king","soldier"],"correct_index":0},"audio":"audio/pauper.mp3","audio_ex0":"audio/pauper_ex0.mp3","audio_ex1":"audio/pauper_ex1.mp3"},{"word":"exchange","ipa":"/ utifully.","cn":"长笛的声音美妙地充满了音乐厅。"}],"socratic_questions":[{"question":"学校乐队招募新成员，有一种乐器是银色的、细长的，吹奏时声音清脆悠扬。这是什么乐器？","answer_hint":"一种管乐器，通常用金属或木头制成，横着吹奏。"}],"fill_blank":{"sentences":["My sister has been learning to play the ___ for three years."],"options":["flute","guitar","drum","piano"],"correct_index":0},"audio":"audio/flute.mp3","audio_ex0":"audio/flute_ex0.mp3","audio_ex1":"audio/flute_ex1.mp3"},{"word":"congratulation","ipa":"/kənˌɡrætʃuˈleɪʃən/","image_prompts":["A stack of colorful gift boxes tied with ribbons on a wooden table, a small card with a gold seal","A trophy cup on a pedestal with confetti pieces scattered around, bright festive lighting"],"image_desc_en":"A stack of colorful gift boxes tied with ribbons on a wooden table, a small card with a gold seal","image_desc_cn":"一堆系着丝带的彩色礼盒放在木桌上，一张带有金色印章的小卡片","meaning_cn":"祝贺；恭喜","usage":"n. (常用复数形式 congratulations)","collocations":"congratulations on, offer congratulations, warm congratulations, congratulations message","preposition_combos":"congratulations on (sth), congratulations to (sb)","examples":[{"en":"Congratulations on winning the first prize in the contest!","cn":"恭喜你在比赛中获得一等奖！"},{"en":"Please send your congratulations to the new team leader.","cn":"请向新队长表达你的祝贺。"}],"socratic_questions":[{"question":"好朋友在期末考试中取得了全班第一的好成绩，你想对他说一句表示开心和肯定的话，应该说什么？","answer_hint":"表达对他人成功或好事的喜悦和赞美，常用复数形式。"}],"fill_blank":{"sentences":["___ on your excellent performance in the school play!"],"options":["Congratulations","Complaints","Apologies","Suggestions"],"correct_index":0},"audio":"audio/congratulation.mp3","audio_ex0":"audio/congratulation_ex0.mp3","audio_ex1":"audio/congratulation_ex1.mp3"},{"word":"Congratulations","ipa":"/kənˌɡrætʃʊˈleɪʃənz/","image_prompts":["A golden trophy on a red velvet cushion with confetti scattered around, bright stage lights in background","A stack of gift boxes with colorful ribbons and a large greeting card with a gold seal"],"image_desc_en":"A golden trophy on a red velvet cushion with confetti scattered around, bright stage lights in background","image_desc_cn":"红色天鹅绒垫子上的金色奖杯，周围散落着五彩纸屑，背景是明亮的舞台灯光","meaning_cn":"祝贺，恭喜（名词，常用复数形式）","usage":"n. (复数形式，常单独使用或用于短语)","collocations":"offer congratulations, receive congratulations, congratulations on","preposition_combos":"congratulations on sth.","examples":[{"en":"Please accept my warm congratulations on your exam success.","cn":"请接受我对你考试成功的热烈祝贺。"},{"en":"We sent a card with congratulations to the winner.","cn":"我们寄了一张祝贺卡给获胜者。"}],"socratic_questions":[{"question":"你的好朋友在期末考试中取得了全班第一，你想表达为他高兴的心情，该用什么词开头？","answer_hint":"这个词常用于表达对他人成就的喜悦和认可，通常以复数形式出现，后面常接'on'。"}],"fill_blank":{"sentences":["___ on your winning the first prize in the speech contest!"],"options":["Congratulations","Thanks","Sorry","Goodbye"],"correct_index":0},"audio":"audio/Congratulations.mp3","audio_ex0":"audio/Congratulations_ex0.mp3","audio_ex1":"audio/Congratulations_ex1.mp3"},{"word":"prize","ipa":"/praɪz/","image_prompts":["A shiny gold medal with a red ribbon lying on an open wooden box, soft spotlight above","A blue ribbon tied around a large book with 'First Place' printed on the cover"],"meaning_cn":"奖品，奖赏；珍视","usage":"n. (可数名词) / v. (过去式 prized, 过去分词 prized)","collocations":"win a prize, first prize, prize money, prize for","preposition_combos":"prize for sth.","examples":[{"en":"She won the first prize in the school art competition.","cn":"她在学校艺术比赛中获得了一等奖。"},{"en":"The prize for the best essay is a new bicycle.","cn":"最佳作文的奖品是一辆新自行车。"}],"socratic_questions":[{"question":"学校举办了一场英语演讲比赛，你获得了第一名，学校会给你一个什么东西作为奖励？","answer_hint":"这个词指在比赛或竞赛中因表现优异而获得的奖励，可以是奖杯、奖牌或物品。"}],"fill_blank":{"sentences":["He was happy to ___ the first ___ in the science fair."],"options":["win / prize","lose / game","get / ticket","buy / gift"],"correct_index":0},"audio":"audio/prize.mp3","audio_ex0":"audio/prize_ex0.mp3","audio_ex1":"audio/prize_ex1.mp3"},{"word":"attend","ipa":"/əˈtend/","image_prompts":["An empty classroom with desks arranged neatly and a clock showing 8:00 AM, sunlight through window","A concert hall with rows of empty red seats and a stage with musical instruments set up"],"meaning_cn":"参加，出席；上（学）","usage":"v. (过去式 attended, 过去分词 attended)","collocations":"attend school, attend a meeting, attend a concert, attend class","preposition_combos":"attend to (处理，照料)","examples":[{"en":"All students must attend the morning assembly every day.","cn":"所有学生必须每天参加晨会。"},{"en":"I will attend a summer camp next month.","cn":"下个月我将参加一个夏令营。"}],"socratic_questions":[{"question":"明天下午三点学校有一个重要的讲座，老师要求每个同学都要去，用哪个词表示'去参加'？","answer_hint":"这个词强调正式地出现在某个活动或场所，比如上课、开会、听讲座。"}],"fill_blank":{"sentences":["How many students will ___ the sports meeting tomorrow?"],"options":["attend","leave","miss","watch"],"correct_index":0},"audio":"audio/attend.mp3","audio_ex0":"audio/attend_ex0.mp3","audio_ex1":"audio/attend_ex1.mp3"},{"word":"besides","ipa":"/bɪˈsaɪdz/","image_prompts":["A wooden table with three apples and one orange next to them, a note saying 'fruit basket'","A shelf with five books standing and two more books lying flat on top, library background"],"meaning_cn":"除……之外（还）","usage":"prep. / adv.","collocations":"besides this, besides that, besides doing sth.","preposition_combos":"besides + n./pron./doing","examples":[{"en":"Besides English, we also study math and science.","cn":"除了英语，我们还学习数学和科学。"},{"en":"Besides playing basketball, he enjoys reading novels.","cn":"除了打篮球，他还喜欢读小说。"}],"socratic_questions":[{"question":"你周末除了做作业，还打算去游泳和看电影。你想表达'除了作业之外还有别的活动'，该用哪个词？","answer_hint":"这个词表示'包括在内'的附加，即除了提到的内容，还有另外的内容。注意它和'except'（排除在外）的区别。"}],"fill_blank":{"sentences":["___ singing, she is also good at dancing and painting."],"options":["Besides","Except","Without","Instead"],"correct_index":0},"audio":"audio/besides.mp3","audio_ex0":"audio/besides_ex0.mp3","audio_ex1":"audio/besides_ex1.mp3"},{"word":"spare","ipa":"/sper/","image_prompts":["A single spare tire leaning against a garage wall, rubber texture visible","A spare key hanging on a small hook by a wooden door, metal glint"],"image_desc_en":"A spare tire against a wall; a spare key on a hook.","image_desc_cn":"一个备用轮胎靠在墙上；一把备用钥匙挂在钩子上。","meaning_cn":"adj. 备用的；多余的；空闲的","usage":"adj. (无词形变化)","collocations":"spare time, spare key, spare tire, spare room","preposition_combos":"spare for (为…留出)","examples":[{"en":"I keep a spare umbrella in my schoolbag every day.","cn":"我每天在书包里放一把备用雨伞。"},{"en":"Do you have a spare pen for the math exam?","cn":"你有多余的笔用于数学考试吗？"}],"socratic_questions":[{"question":"你的笔突然没墨了，你希望同桌有什么东西可以借给你？","answer_hint":"这个词表示‘额外的、备用的’，不是‘新的’或‘旧的’。"}],"fill_blank":{"sentences":["Could you lend me a ___ pencil? I broke mine."],"options":["spare","sharp","short","special"],"correct_index":0},"audio":"audio/spare.mp3","audio_ex0":"audio/spare_ex0.mp3","audio_ex1":"audio/spare_ex1.mp3"},{"word":"spare time","ipa":"/sper taɪm/","image_prompts":["An open book on a sunny windowsill with a cup of tea beside it, soft afternoon light","A chessboard with pieces mid-game on a wooden table, no players visible"],"image_desc_en":"A book and tea on a windowsill; a chessboard with pieces.","image_desc_cn":"窗台上的书和茶；一盘下到一半的国际象棋。","meaning_cn":"n. 空闲时间","usage":"n. (不可数名词)","collocations":"in one's spare time, spend spare time, use spare time","preposition_combos":"in spare time","examples":[{"en":"She reads science fiction in her spare time at home.","cn":"她在家的空闲时间读科幻小说。"},{"en":"I use my spare time to practice English listening skills.","cn":"我利用空闲时间练习英语听力技巧。"}],"socratic_questions":[{"question":"放学后写完作业，到睡觉前这段时间，你可以做什么？","answer_hint":"这个词组指‘不用上课或做作业的时间’，不是‘上课时间’。"}],"fill_blank":{"sentences":["He enjoys painting in his ___."],"options":["spare time","class time","bedtime","lunchtime"],"correct_index":0},"audio":"audio/spare_time.mp3","audio_ex0":"audio/spare_time_ex0.mp3","audio_ex1":"audio/spare_time_ex1.mp3"},{"word":"pleasure","ipa":"/ˈpleʒər/","image_prompts":["A plate of freshly baked chocolate chip cookies on a cooling rack, steam rising","A cozy armchair with a soft blanket and a stack of colorful magazines"],"image_desc_en":"Fresh cookies with steam; a cozy armchair with magazines.","image_desc_cn":"冒着热气的新鲜饼干；舒适的扶手椅和杂志。","meaning_cn":"n. 快乐；愉快；乐事","usage":"n. (可数/不可数名词)","collocations":"with pleasure, a great pleasure, reading pleasure","preposition_combos":"pleasure in (以…为乐)","examples":[{"en":"It is a great pleasure to help my classmates with math.","cn":"帮助同学学数学是一件很快乐的事。"},{"en":"She finds pleasure in listening to light music after exams.","cn":"她在考试后从听轻音乐中找到快乐。"}],"socratic_questions":[{"question":"你帮朋友捡起掉落的书，朋友说谢谢，你该怎么礼貌回答？","answer_hint":"这个词表示‘愉快’，常用于礼貌回应，不是‘没问题’或‘不客气’的直译。"}],"fill_blank":{"sentences":["Thank you for your help! — It's my ___."],"options":["pleasure","problem","duty","turn"],"correct_index":0},"audio":"audio/pleasure.mp3","audio_ex0":"audio/pleasure_ex0.mp3","audio_ex1":"audio/pleasure_ex1.mp3"},{"word":"have sth in common","ipa":"/hæv ˈsʌmθɪŋ ɪn ˈkɑːmən/","image_prompts":["Two identical blue notebooks placed side by side on a desk, same cover design","Two bicycles of the same model and color parked next to each other in a rack"],"image_desc_en":"Two identical notebooks; two same-model bicycles.","image_desc_cn":"两本相同的笔记本；两辆同款自行车。","meaning_cn":"有共同之处","usage":"v. (短语动词，have 的过去式 had，过去分词 had)","collocations":"have a lot in common, have nothing in common, have something in common with","preposition_combos":"have ... in common with (与…有共同点)","examples":[{"en":"The two clubs have a lot in common about environmental protection.","cn":"这两个俱乐部在环保方面有很多共同点。"},{"en":"I have nothing in common with that boring science project.","cn":"我和那个无聊的科学项目毫无共同之处。"}],"socratic_questions":[{"question":"你和你的好朋友都喜欢打篮球和听流行音乐，这说明你们之间有什么？","answer_hint":"这个短语表示‘共享相同的兴趣或特点’，不是‘一起做某事’。"}],"fill_blank":{"sentences":["My sister and I ___ a lot in common: we both love cats."],"options":["have","make","take","find"],"correct_index":0},"audio":"audio/have_sth_in_common.mp3","audio_ex0":"audio/have_sth_in_common_ex0.mp3","audio_ex1":"audio/have_sth_in_common_ex1.mp3"},{"word":"appearance","ipa":"/əˈpɪərəns/","image_prompts":["A neatly folded school uniform on a wooden hanger against a white wall, bright daylight","A clean white sneaker placed next to a muddy one on a doormat, contrasting textures"],"image_desc_en":"A neatly folded school uniform on a hanger and a clean sneaker next to a muddy one.","image_desc_cn":"一件整齐叠好的校服挂在衣架上，以及一只干净的运动鞋放在一只脏鞋旁边。","meaning_cn":"外貌；外观；出现","usage":"n. (可数名词)","collocations":"physical appearance, outward appearance, change one's appearance","preposition_combos":"in appearance, by appearance","examples":[{"en":"Her appearance at the party surprised all her friends.","cn":"她在派对上的出现让所有朋友都感到惊讶。"},{"en":"The appearance of the old library changed after the rain.","cn":"雨后旧图书馆的外观发生了变化。"}],"socratic_questions":[{"question":"你第一次见到新同学时，最先注意到的是他的长相还是性格？哪个词描述的是“长相”？","answer_hint":"这个词指一个人或物体的外部样子，不是内在品质。"}],"fill_blank":{"sentences":["The ___ of the building is very modern and clean."],"options":["appearance","personality","strength","serious"],"correct_index":0},"audio":"audio/appearance.mp3","audio_ex0":"audio/appearance_ex0.mp3","audio_ex1":"audio/appearance_ex1.mp3"},{"word":"personality","ipa":"/ˌpɜːrsəˈnæləti/","image_prompts":["A colorful jigsaw puzzle with one piece missing on a wooden table, soft lighting","A bright sunflower standing alone in a field of green grass, blue sky background"],"image_desc_en":"A colorful jigsaw puzzle with a missing piece and a single sunflower in a green field.","image_desc_cn":"一块缺了一片的彩色拼图，以及一片绿草地中独自挺立的向日葵。","meaning_cn":"个性；性格","usage":"n. (可数名词，通常单数)","collocations":"strong personality, friendly personality, develop one's personality","preposition_combos":"of personality, with a ... personality","examples":[{"en":"A good personality is more important than good looks.","cn":"好的性格比好看的外貌更重要。"},{"en":"My best friend has a warm and cheerful personality.","cn":"我最好的朋友性格温暖又开朗。"}],"socratic_questions":[{"question":"如果你要描述一个人是否友善、幽默或安静，你是在说他的外貌还是性格？","answer_hint":"这个词描述的是一个人的内在特质，比如是否开朗或认真。"}],"fill_blank":{"sentences":["Her ___ makes her very popular in the class."],"options":["personality","appearance","strength","serious"],"correct_index":0},"audio":"audio/personality.mp3","audio_ex0":"audio/personality_ex0.mp3","audio_ex1":"audio/personality_ex1.mp3"},{"word":"serious","ipa":"/ˈsɪriəs/","image_prompts":["A closed textbook with a pair of glasses on top, on a desk under a desk lamp","A chessboard with pieces in mid-game, no players visible, focused composition"],"image_desc_en":"A closed textbook with glasses on a desk and a chessboard mid-game.","image_desc_cn":"一本合上的课本上放着眼镜，以及一盘进行中的国际象棋。","meaning_cn":"严肃的；认真的；严重的","usage":"adj. (比较级 more serious, 最高级 most serious)","collocations":"serious problem, serious expression, serious about","preposition_combos":"serious about (sth.)","examples":[{"en":"The teacher gave a serious warning about the exam.","cn":"老师对考试给出了严肃的警告。"},{"en":"He is serious about learning English this year.","cn":"他今年对学英语很认真。"}],"socratic_questions":[{"question":"当老师提到中考时，他的表情变得很严肃，不再开玩笑。哪个词能形容这种表情？","answer_hint":"这个词表示不轻松、不搞笑，带有认真或重要的意味。"}],"fill_blank":{"sentences":["The doctor looked ___ when he read the test results."],"options":["serious","funny","happy","tired"],"correct_index":0},"audio":"audio/serious.mp3","audio_ex0":"audio/serious_ex0.mp3","audio_ex1":"audio/serious_ex1.mp3"},{"word":"strength","ipa":"/streŋθ/","image_prompts":["A stack of heavy dumbbells on a gym floor, metal texture, bright light","A thick tree trunk with visible roots gripping the ground, forest background"],"image_desc_en":"A stack of heavy dumbbells on a gym floor and a thick tree trunk with roots.","image_desc_cn":"一堆沉重的哑铃放在健身房地板上，以及一棵粗壮的树干和露出的树根。","meaning_cn":"力量；优点；强度","usage":"n. (不可数名词，可作可数名词表示“优点”)","collocations":"physical strength, inner strength, strengths and weaknesses","preposition_combos":"strength in, strength of","examples":[{"en":"Regular exercise can improve your physical strength.","cn":"定期锻炼能提高你的体力。"},{"en":"One of her strengths is solving math problems quickly.","cn":"她的优点之一是快速解数学题。"}],"socratic_questions":[{"question":"举重运动员需要什么才能举起很重的杠铃？这个词也指一个人擅长的方面。","answer_hint":"这个词既指体力上的力气，也指能力上的长处。"}],"fill_blank":{"sentences":["Swimming is a good way to build up your ___."],"options":["strength","appearance","personality","serious"],"correct_index":0},"audio":"audio/strength.mp3","audio_ex0":"audio/strength_ex0.mp3","audio_ex1":"audio/strength_ex1.mp3"},{"word":"slim","ipa":"/slɪm/","image_prompts":["A slim silver laptop lying open on a wooden desk, thin edge visible","A slim glass bottle of water next to a single green leaf on a white table"],"image_desc_en":"A slim laptop on a desk; a slim water bottle beside a leaf.","image_desc_cn":"一台纤薄的笔记本电脑放在桌上；一个细长的水瓶旁边有一片叶子。","meaning_cn":"adj. 苗条的；薄的；微小的（机会等）","usage":"adj. (比较级 slimmer, 最高级 slimmest)","collocations":"slim chance, slim figure, slim book","preposition_combos":"slim in size, slim for a notebook","examples":[{"en":"She has a slim chance to win the race.","cn":"她赢得比赛的机会很小。"},{"en":"This slim dictionary fits easily in my bag.","cn":"这本薄词典很容易放进我的包里。"}],"socratic_questions":[{"question":"你想描述一本很薄、不占空间的书，应该用哪个形容词？","answer_hint":"这个词表示厚度小或身材纤细，常用来形容物品或体型。"}],"fill_blank":{"sentences":["The ___ phone can slide into a small pocket."],"options":["slim","thick","heavy","wide"],"correct_index":0},"audio":"audio/slim.mp3","audio_ex0":"audio/slim_ex0.mp3","audio_ex1":"audio/slim_ex1.mp3"},{"word":"fact","ipa":"/fækt/","image_prompts":["A stack of books with a magnifying glass on top, a paper labeled 'Fact' sticking out","A chalkboard with the word 'Fact' written in white chalk, an eraser nearby"],"image_desc_en":"Books with a magnifying glass and a 'Fact' label; a chalkboard with the word 'Fact'.","image_desc_cn":"一堆书和放大镜，上面有写着‘事实’的标签；黑板上写着‘事实’二字。","meaning_cn":"n. 事实；真相","usage":"n. (可数名词，复数 facts)","collocations":"in fact, as a matter of fact, hard fact","preposition_combos":"fact about, fact of","examples":[{"en":"In fact, the sun rises in the east.","cn":"事实上，太阳从东方升起。"},{"en":"Check the fact before you write the report.","cn":"写报告前先核实事实。"}],"socratic_questions":[{"question":"你想强调某件事是真实存在的，不是猜测，应该用哪个名词？","answer_hint":"这个词指客观存在或已被证明的真实信息。"}],"fill_blank":{"sentences":["It is a ___ that water freezes at zero degrees."],"options":["fact","dream","story","guess"],"correct_index":0},"audio":"audio/fact.mp3","audio_ex0":"audio/fact_ex0.mp3","audio_ex1":"audio/fact_ex1.mp3"},{"word":"population","ipa":"/ˌpɒpjuˈleɪʃn/","image_prompts":["A city skyline at night with thousands of tiny glowing windows, a sign reading 'Population'","A dense crowd of ants on a tree trunk, forming a line, with a small label 'Population'"],"image_desc_en":"City skyline with glowing windows and a 'Population' sign; ants on a tree trunk labeled 'Population'.","image_desc_cn":"城市天际线亮着窗户，有‘人口’标志；树干上的蚂蚁群标有‘种群’字样。","meaning_cn":"n. 人口；种群数量","usage":"n. (可数名词，常与 the 连用)","collocations":"large population, population growth, population of","preposition_combos":"population of, population in","examples":[{"en":"The population of this town is about ten thousand.","cn":"这个城镇的人口大约有一万。"},{"en":"A large population needs more schools and hospitals.","cn":"大量人口需要更多的学校和医院。"}],"socratic_questions":[{"question":"你想说一个城市里住着多少人，应该用哪个词？","answer_hint":"这个词专门用来表示某个地区居民的总数。"}],"fill_blank":{"sentences":["The ___ of China is over 1.4 billion."],"options":["population","area","weather","history"],"correct_index":0},"audio":"audio/population.mp3","audio_ex0":"audio/population_ex0.mp3","audio_ex1":"audio/population_ex1.mp3"},{"word":"km","ipa":"/ˌkeɪˈem/","image_prompts":["A road sign on a highway showing '50 km' to a city, with a blue sky background","A running track with distance markers, a sign reading '1 km' on the grass"],"image_desc_en":"A highway sign reading '50 km'; a running track with a '1 km' marker.","image_desc_cn":"高速公路路牌显示‘50公里’；跑道旁草地上有‘1公里’标志。","meaning_cn":"abbr. 千米，公里（kilometer 的缩写）","usage":"n. (缩写，可数，复数 km 或 kms)","collocations":"10 km, km per hour, square km","preposition_combos":"km from, km to","examples":[{"en":"The school is about two km from my home.","cn":"学校离我家大约两公里。"},{"en":"We walked five km along the river path.","cn":"我们沿着河边小路走了五公里。"}],"socratic_questions":[{"question":"你想说从家到公园的距离是3公里，应该用哪个缩写？","answer_hint":"这是‘千米’的常用缩写，在路牌和地图上很常见。"}],"fill_blank":{"sentences":["The bridge is 1.5 ___ long."],"options":["km","kg","ml","cm"],"correct_index":0},"audio":"audio/km.mp3","audio_ex0":"audio/km_ex0.mp3","audio_ex1":"audio/km_ex1.mp3"},{"word":"kilometer","ipa":"/ˈkɪləˌmiːtər/","image_prompts":["A straight road with a green signpost reading '5 km' under a clear blue sky, surrounded by fields","A running track on a sports field with distance markers every 100 meters, a white line at the 1 km point"],"image_desc_en":"A road sign showing distance in kilometers, or a track with kilometer markings.","image_desc_cn":"显示公里数的路牌，或带有公里标记的跑道。","meaning_cn":"千米，公里","usage":"n. (可数名词)","collocations":"every kilometer, within a kilometer, kilometers away","preposition_combos":"for kilometers, within kilometers of","examples":[{"en":"The school is only one kilometer from my home.","cn":"学校离我家只有一公里。"},{"en":"We walked three kilometers along the river path.","cn":"我们沿着河边小路走了三公里。"}],"socratic_questions":[{"question":"你想告诉朋友你家离学校有多远，用哪个词表示距离单位？","answer_hint":"这个词是长度单位，等于1000米，常用于描述路程。"}],"fill_blank":{"sentences":["The park is about two ___ from the train station."],"options":["kilometers","kilograms","kilowatts","millimeters"],"correct_index":0},"audio":"audio/kilometer.mp3","audio_ex0":"audio/kilometer_ex0.mp3","audio_ex1":"audio/kilometer_ex1.mp3"},{"word":"average","ipa":"/ˈævərɪdʒ/","image_prompts":["A line graph on a whiteboard showing a fluctuating curve with a straight dashed line labeled 'average' across the middle","A set of five test papers with scores 78, 82, 85, 90, 95 and a calculator displaying 86.0"],"image_desc_en":"A graph with an average line, or a calculator showing the mean of several numbers.","image_desc_cn":"带有平均线的图表，或显示几个数字平均值的计算器。","meaning_cn":"平均的；平均数","usage":"adj. / n.","collocations":"average score, average height, on average","preposition_combos":"above average, below average, average of","examples":[{"en":"His average score in math this term is 85.","cn":"他这学期数学的平均分是85分。"},{"en":"On average, it takes me 20 minutes to get to school.","cn":"平均而言，我到学校需要20分钟。"}],"socratic_questions":[{"question":"老师把五次小测的成绩加起来除以5，得到的是什么？","answer_hint":"这个词表示一组数据的中间值，常用来描述一般水平。"}],"fill_blank":{"sentences":["The ___ temperature in July is 30 degrees Celsius."],"options":["average","total","maximum","minimum"],"correct_index":0},"audio":"audio/average.mp3","audio_ex0":"audio/average_ex0.mp3","audio_ex1":"audio/average_ex1.mp3"},{"word":"accident","ipa":"/ˈæksɪdənt/","image_prompts":["A bicycle lying on its side on a wet road with a broken front wheel and scattered school books nearby","A cracked smartphone screen on a tiled floor with a shattered corner and glass fragments"],"image_desc_en":"A damaged bicycle on a road, or a broken phone screen on the floor.","image_desc_cn":"路上损坏的自行车，或地板上碎裂的手机屏幕。","meaning_cn":"事故；意外","usage":"n. (可数名词)","collocations":"car accident, traffic accident, have an accident","preposition_combos":"in an accident, by accident (注意区分)","examples":[{"en":"There was a serious traffic accident on the highway.","cn":"高速公路上发生了一起严重的交通事故。"},{"en":"He broke his arm in a bike accident last week.","cn":"他上周在自行车事故中摔断了胳膊。"}],"socratic_questions":[{"question":"新闻里说两辆车在十字路口相撞，这属于什么事件？","answer_hint":"这个词指突然发生的、不好的、导致伤害或损失的事件。"}],"fill_blank":{"sentences":["Luckily, no one was hurt in the ___."],"options":["accident","event","party","game"],"correct_index":0},"audio":"audio/accident.mp3","audio_ex0":"audio/accident_ex0.mp3","audio_ex1":"audio/accident_ex1.mp3"},{"word":"by accident","ipa":"/baɪ ˈæksɪdənt/","image_prompts":["A glass of milk tipped over on a kitchen table with white liquid spreading across the surface","A stack of dominoes falling one after another on a wooden floor, the first one knocked by a rolling marble"],"image_desc_en":"A spilled glass of milk on a table, or dominoes falling after a marble rolls into them.","image_desc_cn":"桌上打翻的牛奶杯，或弹珠碰倒多米诺骨牌的场景。","meaning_cn":"偶然地，意外地","usage":"adv. phrase (副词短语)","collocations":"find by accident, discover by accident, happen by accident","preposition_combos":"无","examples":[{"en":"I found my lost key by accident under the sofa.","cn":"我意外地在沙发下找到了丢失的钥匙。"},{"en":"She met her old friend by accident in the supermarket.","cn":"她在超市偶然遇到了老朋友。"}],"socratic_questions":[{"question":"你本来没想找那本书，却在书包里翻到了，这叫什么？","answer_hint":"这个短语表示事情发生不是计划好的，而是碰巧。"}],"fill_blank":{"sentences":["He broke the window ___ while playing football."],"options":["by accident","on purpose","by mistake","in time"],"correct_index":0},"audio":"audio/by_accident.mp3","audio_ex0":"audio/by_accident_ex0.mp3","audio_ex1":"audio/by_accident_ex1.mp3"},{"word":"expect","ipa":"/ɪkˈspekt/","image_prompts":["A calendar on a wall with a red circle around a date, a clock showing 3:00 PM nearby","A mailbox with a letter partially sticking out, sunlight casting a long shadow on the ground"],"image_desc_en":"A calendar with a circled date and a clock; a mailbox with a letter and long shadow.","image_desc_cn":"日历上圈出一个日期，旁边有钟表；邮箱里露出一封信，地面有长影子。","meaning_cn":"期待；预料；指望","usage":"v. (过去式 expected, 过去分词 expected)","collocations":"expect to do sth; expect sb to do sth; as expected","preposition_combos":"expect from; expect of","examples":[{"en":"I expect to finish my homework before dinner.","cn":"我期待在晚饭前完成作业。"},{"en":"She expects good grades from her hard work.","cn":"她期望自己的努力能换来好成绩。"}],"socratic_questions":[{"question":"你明天要考试，心里想着可能会考哪些题目，这种心理活动叫什么？","answer_hint":"这个词表示对未发生事情的推测或盼望，常接不定式或从句。"}],"fill_blank":{"sentences":["We ___ the bus to arrive at 7:30 every morning."],"options":["expect","accept","except","expert"],"correct_ind lmost touching the fruit","A long road stretching toward a distant mountain peak under a clear blue sky"],"image_desc_en":"A hand stretching toward a red apple on a high tree branch, fingertips almost touching the fruit","image_desc_cn":"一只手伸向高树枝上的红苹果，指尖几乎触到果实","meaning_cn":"到达；够到；联系","usage":"v. (过去式 reached, 过去分词 reached) 到达；够到；联系","collocations":"reach school, reach a goal, reach someone by phone","preposition_combos":"reach for, reach to, reach out","examples":[{"en":"We finally reached the top of the mountain after two hours.","cn":"两小时后我们终于到达了山顶。"},{"en":"Can you reach the book on the top shelf for me?","cn":"你能帮我把顶层书架上的书够下来吗？"}],"socratic_questions":[{"question":"你坐公交车去学校，下车后走了五分钟，终于到了校门口，这个动作叫什么？","answer_hint":"这个词表示经过一段路程后最终抵达某个地点，强调结果。"}],"fill_blank":{"sentences":["The train will ___ the station at 8:30 in the morning."],"options":["reach","arrive","get","come"],"correct_index":0},"audio":"audio/reach.mp3","audio_ex0":"audio/reach_ex0.mp3","audio_ex1":"audio/reach_ex1.mp3"},{"word":"reach for","ipa":"/riːtʃ fɔːr/","image_prompts":["A cat stretching one paw toward a dangling toy mouse on a string, claws extended","A hand reaching toward a glass of water on a bedside table, early morning light"],"image_desc_en":"A cat stretching one paw toward a dangling toy mouse on a string, claws extended","image_desc_cn":"一只猫伸出一只爪子，抓向悬挂在绳子上的玩具老鼠，爪子张开","meaning_cn":"伸手去拿；努力争取","usage":"v. (短语动词) 伸手去拿；努力争取 (过去式 reached for, 过去分词 reached for)","collocations":"reach for the stars, reach for a book, reach for a goal","preposition_combos":"reach for + 名词","examples":[{"en":"She reached for her phone when it started ringing.","cn":"手机响起时她伸手去拿。"},{"en":"Always reach for your dreams, no matter how hard it is.","cn":"无论多难，都要努力追求你的梦想。"}],"socratic_questions":[{"question":"你坐在沙发上，想拿茶几上的遥控器，你会做什么动作？","answer_hint":"这个短语强调伸手去够某物的动作，和单纯的'到达'不同。"}],"fill_blank":{"sentences":["The baby ___ the colorful toy on the table."],"options":["reached for","looked at","ran to","jumped over"],"co async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }

    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playAudioPath(path, fallbackText) {
  if (!path && fallbackText) { speakWord(fallbackText); return; }
  const urls = [];
  if (path) {
    if (path.startsWith("http")) urls.push(path);
    else {
      const rel = path.replace(/^Unit\d+\/?/, "");
      if (rel) urls.push(rel);
      const cos = mediaUrl(path);
      if (cos && urls.indexOf(cos) < 0) urls.push(cos);
    }
  }
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { if (fallbackText) speakWord(fallbackText); return; }
    const a = new Audio(urls[i++]);
    a.play().catch(tryNext);
  }
  tryNext();
}
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  playAudioPath(w.audio, w.word);
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
    rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
    alert("无法启动英语语音识别：" + (err?.message || err));
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}
function speakWord(word) {
  const w = String(word || "").trim();
  if (!w) return;
  function fallbackWebSpeech() {
    if ("speechSynthesis" in window) {
      var u = new SpeechSynthesisUtterance(w);
      u.lang = "en-GB";
      window.speechSynthesis.speak(u);
    }
  }
  if (!synthesizer) { fallbackWebSpeech(); return; }
  synthesizer.speakTextAsync(w, function(result) {
    if (result && SpeechSDK.ResultReason.Canceled === result.reason && SpeechSDK.CancellationDetails) {
      var d = SpeechSDK.CancellationDetails.fromResult(result);
      if (d.reason === SpeechSDK.CancellationReason.Error) { console.warn("TTS Error:", d.errorDetails); fallbackWebSpeech(); }
    }
  }, function(e) { console.error("TTS:", e); fallbackWebSpeech(); });
}
function closeWordModal() {
  document.getElementById("word-modal").classList.remove("show");
}

function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
    window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    const en=(ww.examples||[])[i]?.en||"";
    playAudioPath(aud, en);
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
        rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
      alert("无法启动例句朗读评分：" + (err?.message || err));
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function setReviewDots(active) {

    if(el){ if(i<active-1) el.className="step-dot done"; else if(i===active-1) el.className="step-dot active"; else el.className="step-dot"; }

}

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
