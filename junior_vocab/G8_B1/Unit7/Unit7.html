  <script>window.VOCAB_DATA={"units":[{"unit":7,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"traffic","ipa":"/ˈtræfɪk/","image_prompts":["A long line of cars stopped at a red traffic light on a rainy city street, brake lights glowing red","A busy intersection with a traffic light showing green, yellow, and red signals against a clear blue sky"],"image_desc_en":"A line of cars at a red light on a rainy street, or a traffic light at a busy intersection.","image_desc_cn":"雨街上红灯前的一排汽车，或繁忙十字路口的红绿灯。","meaning_cn":"交通；车流","usage":"n. (不可数名词)","collocations":"heavy traffic, traffic jam, traffic light, traffic rule","preposition_combos":"in traffic, on the traffic","examples":[{"en":"There is heavy traffic on the road every morning.","cn":"每天早上路上交通都很拥堵。"},{"en":"We must follow the traffic rules to stay safe.","cn":"我们必须遵守交通规则以保证安全。"}],"socratic_questions":[{"question":"你早上坐车去学校，发现路上全是车，开得很慢，这时候你会说路上什么很严重？","answer_hint":"路上车多、行驶缓慢，通常用 'heavy traffic' 或 'traffic jam' 来形容，核心词是 'traffic'。"}],"fill_blank":{"sentences":["The ___ is very bad during rush hour in the city center."],"options":["traffic","weather","noise","air"],"correct_index":0},"audio":"audio/traffic.mp3","audio_ex0":"audio/traffic_ex0.mp3","audio_ex1":"audio/traffic_ex1.mp3"},{"word":"technology","ipa":"/tekˈnɒlədʒi/","image_prompts":["A modern laptop with a glowing screen showing code, next to a smartphone and a wireless mouse on a wooden desk","A row of robotic arms assembling a car in a factory, sparks flying from welding tools"],"image_desc_en":"A laptop, smartphone, and mouse on a desk, or robotic arms in a factory assembling a car.","image_desc_cn":"桌上放着笔记本电脑、智能手机和鼠标，或工厂里组装汽车的机械臂。","meaning_cn":"技术；科技","usage":"n. (可数/不可数名词，复数 technologies)","collocations":"modern technology, information technology, technology company","preposition_combos":"in technology, with technology","examples":[{"en":"Modern technology helps us learn English more easily.","cn":"现代科技帮助我们更轻松地学习英语。"},{"en":"Many schools use new technology in the classroom.","cn":"许多学校在教室里使用新技术。"}],"socratic_questions":[{"question":"你发现现在可以用手机查单词、用电脑看教学视频，这些工具都属于什么领域？","answer_hint":"手机、电脑、互联网这些工具和知识都属于 'technology'（科技/技术）的范畴。"}],"fill_blank":{"sentences":["The rapid development of ___ has changed our daily life."],"options":["technology","nature","history","sports"],"correct_index":0},"audio":"audio/technology.mp3","audio_ex0":"audio/technology_ex0.mp3","audio_ex1":"audio/technology_ex1.mp3"},{"word":"video","ipa":"/ˈvɪdiəʊ/","image_prompts":["A smartphone screen playing a nature documentary with a waterfall and green forest, play button visible","A stack of old VHS tapes on a shelf next to a dusty VCR player"],"image_desc_en":"A smartphone showing a nature video of a waterfall, or a stack of VHS tapes on a shelf.","image_desc_cn":"手机屏幕上播放着瀑布森林的自然视频，或架子上的一堆旧录像带。","meaning_cn":"视频；录像","usage":"n. (可数名词，复数 videos); v. (过去式 videoed, 过去分词 videoed) 录制视频","collocations":"watch a video, make a video, video game, video call","preposition_combos":"on video, in a video","examples":[{"en":"I watched a short video about how to make a cake.","cn":"我看了一个关于如何做蛋糕的短视频。"},{"en":"We can video our school trip and share it online.","cn":"我们可以把学校旅行录成视频并分享到网上。"}],"socratic_questions":[{"question":"你想记录下周末去动物园的见闻，回家后可以给朋友看，你会用什么方式记录？","answer_hint":"用手机或相机拍摄动态画面和声音，这种记录方式叫 'video'（视频/录像）。"}],"fill_blank":{"sentences":["My brother loves to play ___ games on his computer after school."],"options":["video","board","card","ball"],"correct_index":0},"audio":"audio/video.mp3","audio_ex0":"audio/video_ex0.mp3","audio_ex1":"audio/video_ex1.mp3"},{"word":"transport","ipa":"/ˈtrænspɔːrt/","image_prompts":["A yellow school bus driving on a tree-lined road, autumn leaves falling, clear sky","A bicycle parked next to a subway entrance sign, morning sunlight on the metal frame"],"image_desc_en":"A yellow school bus on a road with autumn trees; a bicycle by a subway entrance in morning light.","image_desc_cn":"一辆黄色校车行驶在秋叶飘落的道路上；一辆自行车停在地铁入口旁，晨光照在金属车架上。","meaning_cn":"运输；交通工具","usage":"n. (不可数) 运输；v. (过去式 transported, 过去分词 transported) 运输","collocations":"public transport, transport system, transport goods","preposition_combos":"transport by bus/train, transport from...to...","examples":[{"en":"We use public transport to go to school every day.","cn":"我们每天使用公共交通去上学。"},{"en":"The truck will transport fresh fruit to the market.","cn":"这辆卡车将把新鲜水果运到市场。"}],"socratic_questions":[{"question":"小明每天坐地铁上学，地铁属于哪种方式？","answer_hint":"地铁是公共的、载人移动的工具，所以是“交通/运输”方式。"}],"fill_blank":{"sentences":["Buses and trains are common forms of public ___."],"options":["transport","education","system","efficient"],"correct_index":0},"audio":"audio/transport.mp3","audio_ex0":"audio/transport_ex0.mp3","audio_ex1":"audio/transport_ex1.mp3"},{"word":"system","ipa":"/ˈsɪstəm/","image_prompts":["A complex network of subway lines on a city map, colored lines crossing at stations","A set of interconnected gears inside a clock, brass and steel, precise alignment"],"image_desc_en":"A subway map with colored lines and station dots; clock gears interlocked in a metal frame.","image_desc_cn":"一张彩色地铁线路图，站点用圆点标记；钟表内部相互咬合的金属齿轮组。","meaning_cn":"系统；体系","usage":"n. (可数) 系统","collocations":"education system, transport system, computer system","preposition_combos":"system of rules, system for doing sth.","examples":[{"en":"Our school has a good education system for students.","cn":"我们学校有一个良好的教育体系。"},{"en":"The new computer system helps us finish work faster.","cn":"新的电脑系统帮助我们更快完成工作。"}],"socratic_questions":[{"question":"学校有上课、考试、放假等安排，这些合起来叫什么？","answer_hint":"这些规则和流程组合在一起形成一个整体，叫做“系统”。"}],"fill_blank":{"sentences":["The public transport ___ in this city is very convenient."],"options":["system","transport","education","efficient"],"correct_index":0},"audio":"audio/system.mp3","audio_ex0":"audio/system_ex0.mp3","audio_ex1":"audio/system_ex1.mp3"},{"word":"efficient","ipa":"/ɪˈfɪʃnt/","image_prompts":["A solar-powered calculator on a desk, bright sunlight through a window, no wires","A single water droplet falling onto a plant leaf, clean and precise, no waste"],"image_desc_en":"A solar calculator on a desk in sunlight; a water droplet on a green leaf, no splashing.","image_desc_cn":"桌上太阳能计算器在阳光下工作；一滴水精准落在绿叶上，没有溅开。","meaning_cn":"高效的；有效率的","usage":"adj. (副词 efficiently)","collocations":"efficient way, efficient system, efficient worker","preposition_combos":"efficient at doing sth.","examples":[{"en":"This new bus system is more efficient than the old one.","cn":"这个新公交系统比旧的更高效。"},{"en":"She found an efficient way to finish her homework quickly.","cn":"她找到了一个高效的方法快速完成作业。"}],"socratic_questions":[{"question":"小华用半小时做完作业，而别人要两小时，小华的方法怎么样？","answer_hint":"用更少时间做同样的事，说明方法很“高效”。"}],"fill_blank":{"sentences":["Using a planner is an ___ way to manage your time."],"options":["efficient","transport","system","education"],"correct_index":0},"audio":"audio/efficient.mp3","audio_ex0":"audio/efficient_ex0.mp3","audio_ex1":"audio/efficient_ex1.mp3"},{"word":"education","ipa":"/ˌedʒuˈkeɪʃn/","image_prompts":["A stack of textbooks on a wooden desk, a globe beside them, soft library lighting","A blackboard with chalk equations and diagrams, eraser and chalk tray below"],"image_desc_en":"A stack of textbooks and a globe on a desk in a library; a blackboard with math equations in chalk.","image_desc_cn":"图书馆桌上的一摞课本和一个地球仪；黑板上用粉笔写的数学公式和图形。","meaning_cn":"教育","usage":"n. (不可数) 教育","collocations":"education system, get a good education, physical education","preposition_combos":"education in science, education for all","examples":[{"en":"Every child should have the right to a good education.","cn":"每个孩子都应该享有良好教育的权利。"},{"en":"Physical education class is my favorite subject this term.","cn":"体育课是我这学期最喜欢的科目。"}],"socratic_questions":[{"question":"你在学校学知识、学做人，这个过程叫什么？","answer_hint":"学校提供的学习知识和培养能力的过程就是“教育”。"}],"fill_blank":{"sentences":["The government spends a lot of money on public ___."],"options":["education","transport","system","efficient"],"correct_index":0},"audio":"audio/education.mp3","audio_ex0":"audio/education_ex0.mp3","audio_ex1":"audio/education_ex1.mp3"},{"word":"length","ipa":"/leŋθ/","image_prompts":["A wooden ruler measuring a green pencil from tip to eraser on a white desk, clear markings in centimeters","A long red silk ribbon stretched across a wooden floor, with a measuring tape beside it showing 150 cm"],"image_desc_en":"A ruler measuring a pencil; a measuring tape beside a stretched ribbon.","image_desc_cn":"一把尺子测量铅笔；一条卷尺放在拉伸的丝带旁。","meaning_cn":"长度；时间的长短","usage":"n. (可数名词，常与 of 连用)","collocations":"the length of, full length, arm's length, at length","preposition_combos":"in length, of length, at length","examples":[{"en":"The length of the bridge is over two hundred meters.","cn":"这座桥的长度超过两百米。"},{"en":"Please cut the rope to the same length as the table.","cn":"请把绳子剪到和桌子一样长。"}],"socratic_questions":[{"question":"你想知道从教室前门到后门有多远，应该问什么词？","answer_hint":"这个词表示从一端到另一端的距离，常和 of 连用，比如 the ___ of the room。"}],"fill_blank":{"sentences":["The ___ of the swimming pool is 50 meters."],"options":["length","width","height","depth"],"correct_index":0},"audio":"audio/length.mp3","audio_ex0":"audio/length_ex0.mp3","audio_ex1":"audio/length_ex1.mp3"},{"word":"topic","ipa":"/ˈtɒpɪk/","image_prompts":["A whiteboard with the word 'Environment' written in blue marker, surrounded by colorful sticky notes","An open textbook on a wooden desk with a highlighted paragraph titled 'Global Warming' and a bookmark"],"image_desc_en":"A whiteboard with a word and sticky notes; an open textbook with a highlighted title.","image_desc_cn":"一块写着单词并贴满便签的白板；一本打开的书，标题被荧光笔标记。","meaning_cn":"话题；主题","usage":"n. (可数名词)","collocations":"main topic, hot topic, discuss a topic, change the topic","preposition_combos":"on the topic of, about a topic","examples":[{"en":"Our group chose the topic of school sports for the report.","cn":"我们小组选择了学校体育作为报告主题。"},{"en":"The teacher asked us to write about a topic we like.","cn":"老师让我们写一个我们喜欢的话题。"}],"socratic_questions":[{"question":"英语课上老师让大家选一个感兴趣的内容来讨论，这个内容叫什么？","answer_hint":"这个词指讨论或写作的中心内容，比如 the ___ of the conversation。"}],"fill_blank":{"sentences":["We need to decide on a ___ for our class debate."],"options":["topic","title","name","subject"],"correct_index":0},"audio":"audio/topic.mp3","audio_ex0":"audio/topic_ex0.mp3","audio_ex1":"audio/topic_ex1.mp3"},{"word":"partner","ipa":"/ˈpɑːrtnər/","image_prompts":["Two identical blue notebooks placed side by side on a wooden desk, with two pens crossed between them","A pair of white sneakers tied together by their laces on a gym floor, forming a neat bow"],"image_desc_en":"Two notebooks with crossed pens; two sneakers tied together by laces.","image_desc_cn":"两本笔记本和交叉的笔；两只运动鞋用鞋带系在一起。","meaning_cn":"搭档；同伴","usage":"n. (可数名词)","collocations":"work partner, dance partner, business partner, partner up","preposition_combos":"partner in, partner with","examples":[{"en":"I need a partner to practice the dialogue with me.","cn":"我需要一个搭档和我练习对话。"},{"en":"My partner and I finished the science project on time.","cn":"我和搭档按时完成了科学项目。"}],"socratic_questions":[{"question":"老师让大家两人一组做练习，和你一起做的那个人叫什么？","answer_hint":"这个词指和你一起完成任务的另一个人，比如 my ___ in the game。"}],"fill_blank":{"sentences":["Please find a ___ to practice the conversation with."],"options":["partner","teacher","friend","classmate"],"correct_index":0},"audio":"audio/partner.mp3","audio_ex0":"audio/partner_ex0.mp3","audio_ex1":"audio/partner_ex1.mp3"},{"word":"shall","ipa":"/ʃæl/","image_prompts":["A closed calendar on a desk with a red circle around tomorrow's date, a question mark drawn next to it","Two empty chairs facing each other in a bright room, with a small whiteboard between them reading 'Plan?'"],"image_desc_en":"A calendar with a circled date and a question mark; two chairs facing each other with a whiteboard.","image_desc_cn":"一本日历上圈出一个日期并画了问号；两把椅子相对，中间有块小白板。","meaning_cn":"（用于提出建议或征求意见）……好吗？要不要……？","usage":"modal v. (情态动词，后接动词原形；过去式 should)","collocations":"shall we, shall I, shall not (shan't)","preposition_combos":"","examples":[{"en":"Shall we meet at the library after school tomorrow?","cn":"我们明天放学后在图书馆见面好吗？"},{"en":"I shall bring some snacks for the picnic this weekend.","cn":"我会为这个周末的野餐带些零食。"}],"socratic_questions":[{"question":"你想礼貌地建议朋友一起去看电影，用哪个词开头提问最合适？","answer_hint":"这个词用于提出建议或征求意见，常放在句首，比如 ___ we go now?。"}],"fill_blank":{"sentences":["___ we start the game now?"],"options":["Shall","Will","Do","Are"],"correct_index":0},"audio":"audio/shall.mp3","audio_ex0":"audio/shall_ex0.mp3","audio_ex1":"audio/shall_ex1.mp3"},{"word":"pass","ipa":"/pæs/","image_prompts":["A soccer ball flying through the air between two goalposts on a green field, motion blur","A hand holding a yellow pencil over a test paper with a red checkmark on the top corner"],"image_desc_en":"A soccer ball in mid-air between goalposts; a pencil over a test paper with a checkmark.","image_desc_cn":"足球在球门间飞过；铅笔放在有红勾的试卷上。","meaning_cn":"v. 通过；传递；及格","usage":"v. (过去式 passed, 过去分词 passed)","collocations":"pass the exam, pass the ball, pass the time","preposition_combos":"pass through, pass by, pass on","examples":[{"en":"I hope I can pass the math exam this Friday.","cn":"我希望这周五能通过数学考试。"},{"en":"Please pass the salt to your sister at dinner.","cn":"晚餐时请把盐递给你姐姐。"}],"socratic_questions":[{"question":"考试结束后，老师发下试卷，你看到分数刚好超过60分，这时你最想用哪个动词描述这个结果？","answer_hint":"这个词表示成功达到标准或把东西递给别人，和考试、传递动作有关。"}],"fill_blank":{"sentences":["She studied hard and ___ the final exam with a high score."],"options":["passed","failed","missed","dropped"],"correct_index":0},"audio":"audio/pass.mp3","audio_ex0":"audio/pass_ex0.mp3","audio_ex1":"audio/pass_ex1.mp3"},{"word":"winner","ipa":"/ˈwɪnər/","image_prompts":["A golden trophy cup on a wooden podium with a red ribbon, bright spotlight above","A blue first-place medal lying on a checkered finish line with confetti around"],"image_desc_en":"A golden trophy on a podium; a blue medal on a finish line with confetti.","image_desc_cn":"金色奖杯在领奖台上；蓝色奖牌在终点线上撒满彩纸。","meaning_cn":"n. 获胜者","usage":"n. (复数 winners)","collocations":"the winner of the game, a lucky winner, winner takes all","preposition_combos":"winner of, winner in","examples":[{"en":"The winner of the spelling bee got a big dictionary.","cn":"拼写比赛的获胜者得到了一本大词典。"},{"en":"Our team was the winner in the school basketball match.","cn":"我们队是学校篮球赛的获胜者。"}],"socratic_questions":[{"question":"学校运动会结束后，广播里宣布了跑步比赛的第一名，这个人的身份用哪个名词称呼？","answer_hint":"这个词指在比赛或竞争中取得第一名的人，和胜利、奖杯相关。"}],"fill_blank":{"sentences":["After the final race, the ___ received a gold medal and a trophy."],"options":["winner","loser","player","judge"],"correct_index":0},"audio":"audio/winner.mp3","audio_ex0":"audio/winner_ex0.mp3","audio_ex1":"audio/winner_ex1.mp3"},{"word":"cure","ipa":"/kjʊr/","image_prompts":["A glass bottle of orange medicine with a spoon next to it on a white table","A green plant leaf with water droplets, sunlight shining through a window onto a bed"],"image_desc_en":"A medicine bottle with a spoon; a green leaf with water droplets in sunlight near a bed.","image_desc_cn":"药瓶和勺子；阳光下水滴落在绿叶上，旁边有床。","meaning_cn":"v./n. 治愈；疗法","usage":"v. (过去式 cured, 过去分词 cured); n. (可数名词)","collocations":"cure a disease, find a cure, cure someone of","preposition_combos":"cure for, cure of","examples":[{"en":"The doctor said rest can cure a common cold quickly.","cn":"医生说休息可以快速治愈普通感冒。"},{"en":"Scientists are working hard to find a cure for cancer.","cn":"科学家们正在努力寻找癌症的疗法。"}],"socratic_questions":[{"question":"你感冒了，妈妈给你喝了一种药，第二天就好了。这种药的作用可以用哪个词描述？","answer_hint":"这个词表示使疾病消失、恢复健康，既是动词也是名词。"}],"fill_blank":{"sentences":["This new medicine can ___ the infection within three days."],"options":["cure","cause","catch","cover"],"correct_index":0},"audio":"audio/cure.mp3","audio_ex0":"audio/cure_ex0.mp3","audio_ex1":"audio/cure_ex1.mp3"},{"word":"cancer","ipa":"/ˈkænsər/","image_prompts":["A microscope slide with abnormal cells under a blue light in a laboratory","A hospital room with an empty bed and an IV drip stand next to a window"],"image_desc_en":"A microscope slide with abnormal cells under blue light; a hospital room with an IV stand.","image_desc_cn":"显微镜下蓝色光中的异常细胞；带输液架的医院病房。","meaning_cn":"n. 癌症","usage":"n. (不可数名词，常与定冠词连用)","collocations":"lung cancer, breast cancer, fight cancer","preposition_combos":"cancer of, cancer in","examples":[{"en":"Smoking can increase the risk of lung cancer greatly.","cn":"吸烟会大大增加患肺癌的风险。"},{"en":"Many charities raise money to help people with cancer.","cn":"许多慈善机构筹款帮助癌症患者。"}],"socratic_questions":[{"question":"新闻里提到一种严重的疾病，需要长期治疗，而且和细胞异常生长有关，这种病叫什么？","answer_hint":"这个词是一种严重疾病的名称，常与健康、治疗、研究话题相关。"}],"fill_blank":{"sentences":["Early detection of ___ can save many lives through timely treatment."],"options":["cancer","cold","fever","cough"],"correct_index":0},"audio":"audio/cancer.mp3","audio_ex0":"audio/cancer_ex0.mp3","audio_ex1":"audio/cancer_ex1.mp3"},{"word":"concert","ipa":"/ˈkɒnsərt/","image_prompts":["A large stage with musical instruments and microphones, colorful stage lights shining down, empty seats in a dark auditorium","A ticket stub for a music show lying on a wooden table next to a pair of headphones"],"image_desc_en":"A stage setup for a musical performance with instruments and lights, no people present.","image_desc_cn":"一个为音乐表演布置的舞台，有乐器和灯光，没有人物。","meaning_cn":"音乐会；演奏会","usage":"n. (可数名词)","collocations":"go to a concert, attend a concert, rock concert, classical concert","preposition_combos":"at a concert, concert for charity","examples":[{"en":"We bought two tickets for the rock concert next Friday.","cn":"我们买了两张下周五摇滚音乐会的票。"},{"en":"The school band will give a concert in the hall this weekend.","cn":"学校乐队这周末将在礼堂举办一场音乐会。"}],"socratic_questions":[{"question":"你最喜欢的歌手要来你的城市演出，你会买票去听什么？","answer_hint":"这个词指现场音乐表演活动，不是看电影或比赛。"}],"fill_blank":{"sentences":["My sister is going to a pop ___ with her friends tonight."],"options":["concert","movie","game","party"],"correct_index":0},"audio":"audio/concert.mp3","audio_ex0":"audio/concert_ex0.mp3","audio_ex1":"audio/concert_ex1.mp3"},{"word":"cash","ipa":"/kæʃ/","image_prompts":["A pile of various banknotes and coins spread on a wooden table, a small calculator nearby","A cash register drawer open with paper money and coins inside, a receipt roll beside it"],"image_desc_en":"Physical money in the form of banknotes and coins on a surface.","image_desc_cn":"以纸币和硬币形式存在的实体货币放在桌面上。","meaning_cn":"现金；现款","usage":"n. (不可数名词)","collocations":"pay in cash, cash payment, cash machine, cash register","preposition_combos":"with cash, by cash","examples":[{"en":"I forgot my wallet, so I have no cash to buy lunch.","cn":"我忘了带钱包，所以没有现金买午餐。"},{"en":"The store only accepts cash, not credit cards.","cn":"这家店只收现金，不收信用卡。"}],"socratic_questions":[{"question":"你去小卖部买水，但手机没电了，你最好带什么来付钱？","answer_hint":"这个词指实体的纸币和硬币，不是银行卡或手机支付。"}],"fill_blank":{"sentences":["Do you have enough ___ to pay for the book?"],"options":["cash","time","room","food"],"correct_index":0},"audio":"audio/cash.mp3","audio_ex0":"audio/cash_ex0.mp3","audio_ex1":"audio/cash_ex1.mp3"},{"word":"wallet","ipa":"/ˈwɒlɪt/","image_prompts":["A brown leather wallet lying open on a table, showing slots for cards and a compartment for bills","A closed black wallet with a zipper, placed next to a set of keys and a smartphone"],"image_desc_en":"A small folding case for holding money and cards, made of leather or fabric.","image_desc_cn":"一个用于装钱和卡片的小折叠包，通常由皮革或布料制成。","meaning_cn":"钱包；皮夹","usage":"n. (可数名词)","collocations":"leather wallet, lose one's wallet, wallet full of cash, put in wallet","preposition_combos":"in a wallet, wallet with coins","examples":[{"en":"He found his wallet under the sofa after searching for an hour.","cn":"他找了一个小时后在沙发下找到了他的钱包。"},{"en":"My mother gave me a new wallet for my birthday last month.","cn":"我妈妈上个月送给我一个新钱包作为生日礼物。"}],"socratic_questions":[{"question":"你出门时会把钱和公交卡放在一个小皮夹子里，这个皮夹子叫什么？","answer_hint":"这个词指随身携带的装钱和卡片的小包，不是书包或手提袋。"}],"fill_blank":{"sentences":["I put my ID card and some money in my ___."],"options":["wallet","backpack","drawer","pocket"],"correct_index":0},"audio":"audio/wallet.mp3","audio_ex0":"audio/wallet_ex0.mp3","audio_ex1":"audio/wallet_ex1.mp3"},{"word":"guest","ipa":"/ɡest/","image_prompts":["A neatly made bed with a welcome note and a small vase of flowers on the nightstand in a spare room","A dining table set with extra plates and silverware, a name card reading 'Guest' on one plate"],"image_desc_en":"A prepared guest room with a bed and welcome items, no people present.","image_desc_cn":"一间准备好的客房，有床和欢迎物品，没有人物。","meaning_cn":"客人；宾客","usage":"n. (可数名词)","collocations":"house guest, wedding guest, guest room, guest list","preposition_combos":"guest at a party, guest of honor","examples":[{"en":"We invited ten guests to my brother's birthday dinner last Saturday.","cn":"上周六我们邀请了十位客人来参加我弟弟的生日晚餐。"},{"en":"The hotel provides a free breakfast for every guest in the morning.","cn":"这家酒店每天早上为每位客人提供免费早餐。"}],"socratic_questions":[{"question":"你家要举办聚会，除了家人之外，还会邀请谁来参加？","answer_hint":"这个词指被邀请到家里或活动中的人，不是家庭成员。"}],"fill_blank":{"sentences":["Each ___ received a small gift at the end of the party."],"options":["guest","teacher","driver","doctor"],"correct_index":0},"audio":"audio/guest.mp3","audio_ex0":"audio/guest_ex0.mp3","audio_ex1":"audio/guest_ex1.mp3"},{"word":"chief","ipa":"/tʃiːf/","image_prompts":["A large wooden gavel resting on a polished oak desk in a courtroom, with a nameplate reading 'Chief'","A single red apple sitting on top of a stack of textbooks, with a gold crown placed on the apple"],"image_desc_en":"A wooden gavel on a desk with a nameplate; an apple with a crown on books.","image_desc_cn":"桌上木槌和名牌；苹果戴皇冠放在书本上。","meaning_cn":"主要的；最重要的；首领","usage":"adj. (无词形变化) / n. (复数 chiefs)","collocations":"chief reason, chief concern, chief executive","preposition_combos":"chief of (e.g., chief of police)","examples":[{"en":"The chief reason for my success is hard work.","cn":"我成功的主要原因是努力工作。"},{"en":"Our chief goal this year is to improve grades.","cn":"我们今年的主要目标是提高成绩。"}],"socratic_questions":[{"question":"你有一堆理由不想写作业，但其中最重要的那个是什么？用一个词来形容这个‘最重要的’理由。","answer_hint":"这个词表示‘首要的、主要的’，常用来强调最关键的因素。"}],"fill_blank":{"sentences":["The ___ reason for the traffic jam was the heavy rain."],"options":["chief","small","funny","quick"],"correct_index":0},"audio":"audio/chief.mp3","audio_ex0":"audio/chief_ex0.mp3","audio_ex1":"audio/chief_ex1.mp3"},{"word":"researcher","ipa":"/rɪˈsɜːrtʃər/","image_prompts":["A microscope on a laboratory table next to a notebook with handwritten notes and a coffee mug","A stack of scientific journals with colorful graphs on the covers, a magnifying glass on top"],"image_desc_en":"A microscope and notebook on a lab table; journals with a magnifying glass.","image_desc_cn":"实验室桌上的显微镜和笔记本；杂志上的放大镜。","meaning_cn":"研究员；调查者","usage":"n. (可数名词，复数 researchers)","collocations":"a medical researcher, a team of researchers, lead researcher","preposition_combos":"researcher in (e.g., researcher in biology)","examples":[{"en":"The researcher studied how plants grow in dry soil.","cn":"研究员研究了植物如何在干燥土壤中生长。"},{"en":"A young researcher won an award for her discovery.","cn":"一位年轻研究员因她的发现获奖。"}],"socratic_questions":[{"question":"有一个人整天在实验室里观察细菌、记录数据，想找到新药。这个人是什么职业？","answer_hint":"这个词指专门做研究、做实验的人，通常和科学有关。"}],"fill_blank":{"sentences":["The ___ carefully recorded the temperature every hour."],"options":["researcher","teacher","driver","cook"],"correct_index":0},"audio":"audio/researcher.mp3","audio_ex0":"audio/researcher_ex0.mp3","audio_ex1":"audio/researcher_ex1.mp3"},{"word":"research","ipa":"/rɪˈsɜːrtʃ/","image_prompts":["An open laptop showing a search engine page with graphs and data charts on the screen","A pile of printed papers with highlighted text and sticky notes attached, on a wooden desk"],"image_desc_en":"A laptop with data charts on screen; papers with highlights and sticky notes.","image_desc_cn":"显示数据图表的笔记本电脑；带高亮和便签的纸张。","meaning_cn":"研究；调查","usage":"n. (不可数名词) / v. (过去式 researched, 过去分词 researched)","collocations":"do research, research project, scientific research","preposition_combos":"research on (e.g., research on climate change)","examples":[{"en":"We need to do more research before writing the report.","cn":"我们在写报告前需要做更多研究。"},{"en":"She researched the history of the old bridge for her project.","cn":"她为项目研究了那座老桥的历史。"}],"socratic_questions":[{"question":"你要写一篇关于熊猫的作文，需要去图书馆查资料、看纪录片。这个过程叫什么？","answer_hint":"这个词表示系统地查找信息、学习知识的过程，可以是名词也可以是动词。"}],"fill_blank":{"sentences":["The students are doing ___ on how to save water."],"options":["research","sports","music","cooking"],"correct_index":0},"audio":"audio/research.mp3","audio_ex0":"audio/research_ex0.mp3","audio_ex1":"audio/research_ex1.mp3"},{"word":"futurist","ipa":"/ˈfjuːtʃərɪst/","image_prompts":["A whiteboard covered with sketches of flying cars, robot arms, and floating buildings","A crystal ball on a desk next to a tablet showing a futuristic city skyline with neon lights"],"image_desc_en":"A whiteboard with futuristic sketches; a crystal ball and tablet with a neon city.","image_desc_cn":"画着未来科技的白板；水晶球和平板显示霓虹城市。","meaning_cn":"未来学家；未来主义者","usage":"n. (可数名词，复数 futurists)","collocations":"a famous futurist, futurist predictions, technology futurist","preposition_combos":"futurist in (e.g., futurist in technology)","examples":[{"en":"A futurist predicted that robots will help with housework.","cn":"一位未来学家预测机器人将帮忙做家务。"},{"en":"The futurist wrote a book about life in 2050.","cn":"这位未来学家写了一本关于2050年生活的书。"}],"socratic_questions":[{"question":"有一个人专门思考50年后人类会怎么生活，比如会不会有飞行汽车。这种人叫什么？","answer_hint":"这个词由‘未来’加上‘-ist’（表示从事某种职业的人）构成，指研究未来趋势的人。"}],"fill_blank":{"sentences":["The ___ believes that schools will use virtual reality in ten years."],"options":["futurist","artist","dentist","scientist"],"correct_index":0},"audio":"audio/futurist.mp3","audio_ex0":"audio/futurist_ex0.mp3","audio_ex1":"audio/futurist_ex1.mp3"},{"word":"prediction","ipa":"/prɪˈdɪkʃən/","image_prompts":["A crystal ball on a wooden table with swirling mist inside, surrounded by tarot cards","A weather forecast chart showing a rain cloud icon and a temperature line rising upward"],"image_desc_en":"A crystal ball with mist and tarot cards; a weather chart with rain and temperature rise.","image_desc_cn":"一个带雾气的玻璃球和塔罗牌；一张显示降雨和升温的天气预报图。","meaning_cn":"预测；预言","usage":"n. (可数名词，复数 predictions)","collocations":"make a prediction, weather prediction, accurate prediction","preposition_combos":"prediction about/of","examples":[{"en":"The weather prediction says it will rain tomorrow.","cn":"天气预报说明天会下雨。"},{"en":"My prediction about the exam result was wrong.","cn":"我对考试结果的预测是错的。"}],"socratic_questions":[{"question":"你看到天空乌云密布，蚂蚁搬家，你心里想‘可能要下雨了’。这个‘可能要下雨’的想法叫什么？","answer_hint":"这个词表示对未来的推测或判断，常和天气、考试结果搭配。"}],"fill_blank":{"sentences":["The weather ___ says it will be sunny tomorrow."],"options":["prediction","predicted","predicting","predict"],"correct_index":0},"audio":"audio/prediction.mp3","audio_ex0":"audio/prediction_ex0.mp3","audio_ex1":"audio/prediction_ex1.mp3"},{"word":"outer","ipa":"/ˈaʊtər/","image_prompts":["A thick brick wall with a sign 'OUTER WALL' on the outside surface, grass on the other side","A telescope pointing at a starry night sky with a crescent moon and distant planets"],"image_desc_en":"A brick wall with an 'OUTER WALL' sign; a telescope aimed at stars and a crescent moon.","image_desc_cn":"一面标有‘外墙’的砖墙；一架望远镜指向星空和弯月。","meaning_cn":"外部的；外面的","usage":"adj. (仅作定语，无比较级)","collocations":"outer space, outer layer, outer wall","preposition_combos":"无常见介词搭配","examples":[{"en":"The outer layer of the cake is covered with chocolate.","cn":"蛋糕的外层覆盖着巧克力。"},{"en":"We need to paint the outer wall of the house.","cn":"我们需要粉刷房子的外墙。"}],"socratic_questions":[{"question":"一个鸡蛋有蛋壳和蛋白，蛋壳是‘里面’还是‘外面’的那一层？","answer_hint":"这个词表示‘外面的’，和‘inner（内部的）’相反，常用来描述空间或层次。"}],"fill_blank":{"sentences":["The ___ space is full of stars and planets."],"options":["outer","inner","upper","lower"],"correct_index":0},"audio":"audio/outer.mp3","audio_ex0":"audio/outer_ex0.mp3","audio_ex1":"audio/outer_ex1.mp3"},{"word":"outer space","ipa":"/ˈaʊtər speɪs/","image_prompts":["A dark starry sky with a spiral galaxy and a bright comet streaking across","A satellite orbiting Earth with blue oceans and white clouds visible below"],"image_desc_en":"A dark sky with a spiral galaxy and a comet; a satellite orbiting Earth with oceans and clouds.","image_desc_cn":"带有螺旋星系和彗星的黑暗天空；一颗绕地球运行的卫星，下方可见海洋和云层。","meaning_cn":"外太空","usage":"n. (不可数名词，常与介词 in/into 连用)","collocations":"go into outer space, explore outer space, in outer space","preposition_combos":"in/into outer space","examples":[{"en":"Astronauts travel into outer space to study the stars.","cn":"宇航员进入外太空研究星星。"},{"en":"There is no air or water in outer space.","cn":"外太空没有空气或水。"}],"socratic_questions":[{"question":"夜晚你抬头看天空，看到星星和月亮，那个星星所在的地方，科学家叫它什么？","answer_hint":"这个词指地球大气层以外的广阔宇宙区域，常和宇航员、火箭搭配。"}],"fill_blank":{"sentences":["Many scientists dream of exploring ___."],"options":["outer space","outer","space","the space"],"correct_index":0},"audio":"audio/outer_space.mp3","audio_ex0":"audio/outer_space_ex0.mp3","audio_ex1":"audio/outer_space_ex1.mp3"},{"word":"worse","ipa":"/wɜːrs/","image_prompts":["Two piles of trash: one small pile with a few cans, another huge pile overflowing with garbage and flies","A cracked smartphone screen next to a completely shattered screen with glass pieces"],"image_desc_en":"A small trash pile vs. an overflowing pile with flies; a cracked screen vs. a shattered screen.","image_desc_cn":"一小堆垃圾与一堆满是苍蝇的垃圾对比；一个裂屏与一个完全碎屏对比。","meaning_cn":"更坏的；更差的","usage":"adj. (bad 的比较级) / adv. (badly 的比较级)","collocations":"get worse, much worse, worse than","preposition_combos":"worse than","examples":[{"en":"The weather today is worse than yesterday.","cn":"今天的天气比昨天更糟。"},{"en":"My headache got worse after the long exam.","cn":"长时间考试后我的头痛更严重了。"}],"socratic_questions":[{"question":"你上次考试得了60分，这次只得了40分。这次成绩比上次是‘更好’还是‘更差’？","answer_hint":"这个词是‘bad’的比较级，表示情况变得更不好，常和‘than’连用。"}],"fill_blank":{"sentences":["This cold is ___ than the one I had last month."],"options":["worse","worst","bad","badly"],"correct_index":0},"audio":"audio/worse.mp3","audio_ex0":"audio/worse_ex0.mp3","audio_ex1":"audio/worse_ex1.mp3"},{"word":"take over","ipa":"/teɪk ˈoʊvər/","image_prompts":["A large clock on a wall with its hands spinning fast, a smaller clock falling off the shelf, symbolizing time taking over","A stack of old books being slowly covered by a pile of new colorful notebooks on a desk, representing new items taking over"],"image_desc_en":"A large clock on a wall with its hands spinning fast, a smaller clock falling off the shelf, symbolizing time taking over","image_desc_cn":"墙上一个大钟的指针快速旋转，一个小钟从架子上掉下来，象征时间接管一切","meaning_cn":"接管；取代","usage":"v. (过去式 took over, 过去分词 taken over)","collocations":"take over sth, take over from sb","preposition_combos":"take over from (从……接手)","examples":[{"en":"My brother will take over the family garden this summer.","cn":"我哥哥今年夏天将接管家里的花园。"},{"en":"Robots may take over some boring jobs in the future.","cn":"未来机器人可能会接管一些无聊的工作。"}],"socratic_questions":[{"question":"你负责班级的植物浇水，但下周你要去旅行，需要让同桌负责这件事，这叫什么？","answer_hint":"这个词组表示接手别人的工作或责任，由两个词组成，第一个词是 take。"}],"fill_blank":{"sentences":["When the teacher was sick, a new teacher came to ___ the class."],"options":["take over","take off","take up","take in"],"correct_index":0},"audio":"audio/take_over.mp3","audio_ex0":"audio/take_over_ex0.mp3","audio_ex1":"audio/take_over_ex1.mp3"},{"word":"sci-fi","ipa":"/ˈsaɪ faɪ/","image_prompts":["A glowing spaceship flying over a futuristic city with tall glass buildings and neon lights at night","A robot arm holding a glowing blue cube on a metallic table, surrounded by holographic screens with star maps"],"image_desc_en":"A glowing spaceship flying over a futuristic city with tall glass buildings and neon lights at night","image_desc_cn":"一艘发光的宇宙飞船飞过一座未来城市，城市里有高大的玻璃建筑和霓虹灯，背景是夜晚","meaning_cn":"科幻（名词/形容词）","usage":"n. / adj. (缩写，全称 science fiction)","collocations":"sci-fi movie, sci-fi book, sci-fi story","preposition_combos":"无常见介词搭配","examples":[{"en":"My favorite sci-fi movie is about time travel.","cn":"我最喜欢的科幻电影是关于时间旅行的。"},{"en":"The library has a new section for sci-fi books.","cn":"图书馆有一个新的科幻书籍区。"}],"socratic_questions":[{"question":"你最近看了一部电影，里面有外星人和宇宙飞船，这种类型的电影叫什么？","answer_hint":"这个词是 science fiction 的缩写，常用来描述关于未来科技或外星人的故事。"}],"fill_blank":{"sentences":["He loves reading ___ novels about robots and space travel."],"options":["sci-fi","horror","romance","comedy"],"correct_index":0},"audio":"audio/sci-fi.mp3","audio_ex0":"audio/sci-fi_ex0.mp3","audio_ex1":"audio/sci-fi_ex1.mp3"},{"word":"ticket","ipa":"/ˈtɪkɪt/","image_prompts":["A red and white train ticket lying on a wooden bench next to a small suitcase, with the word 'TICKET' visible","A torn movie ticket stub on a dark cinema floor, with a faint glow from the screen in the background"],"image_desc_en":"A red and white train ticket lying on a wooden bench next to a small suitcase, with the word 'TICKET' visible","image_desc_cn":"一张红白相间的火车票放在木制长椅上，旁边有一个小手提箱，票上的“TICKET”字样清晰可见","meaning_cn":"票；入场券","usage":"n. (复数 tickets)","collocations":"buy a ticket, train ticket, movie ticket, ticket office","preposition_combos":"ticket for (……的票), ticket to (去……的票)","examples":[{"en":"I bought two tickets for the school concert.","cn":"我买了两张学校音乐会的票。"},{"en":"Please show your ticket before entering the museum.","cn":"进入博物馆前请出示你的票。"}],"socratic_questions":[{"question":"你想去看一场电影，但门口的人让你出示一张小纸片才能进去，这张纸片叫什么？","answer_hint":"这个词是进入电影院、火车或活动场所时需要的东西，通常是一张小纸片或电子凭证。"}],"fill_blank":{"sentences":["We need to buy a ___ for the bus before we get on."],"options":["ticket","map","key","card"],"correct_index":0},"audio":"audio/ticket.mp3","audio_ex0":"audio/ticket_ex0.mp3","audio_ex1":"audio/ticket_ex1.mp3"},{"word":"positive","ipa":"/ˈpɒzətɪv/","image_prompts":["A bright yellow smiley face sticker on a clean white notebook, soft sunlight from a window","A row of green check marks on a whiteboard next to a list of completed tasks, dry-erase markers"],"image_desc_en":"A yellow smiley face sticker on a white notebook with sunlight; green check marks on a whiteboard.","image_desc_cn":"白色笔记本上的黄色笑脸贴纸，阳光照射；白板上的一排绿色对勾。","meaning_cn":"积极的；正面的；肯定的","usage":"adj. (比较级 more positive, 最高级 most positive); 副词形式 positively","collocations":"positive attitude, positive result, positive feedback","preposition_combos":"positive about","examples":[{"en":"She always keeps a positive attitude before exams.","cn":"考试前她总是保持积极的态度。"},{"en":"The teacher gave positive feedback on my project.","cn":"老师对我的项目给予了肯定的反馈。"}],"socratic_questions":[{"question":"小明考试前很紧张，你觉得他应该用什么词来形容自己的心态，才能让自己更自信？","answer_hint":"这个词和“消极”相反，表示看好结果、充满希望。"}],"fill_blank":{"sentences":["Try to stay ___ even when things get difficult."],"options":["positive","negative","nervous","tired"],"correct_index":0},"audio":"audio/positive.mp3","audio_ex0":"audio/positive_ex0.mp3","audio_ex1":"audio/positive_ex1.mp3"},{"word":"everywhere","ipa":"/ˈevriweər/","image_prompts":["A dense forest floor covered entirely with fallen autumn leaves, no visible bare ground","A city street at night with neon signs and glowing shop windows filling every corner of the view"],"image_desc_en":"A forest floor completely covered in autumn leaves; a night street filled with neon signs.","image_desc_cn":"完全被秋叶覆盖的森林地面；夜晚街道到处是霓虹灯招牌。","meaning_cn":"到处；各处","usage":"adv. (无词形变化)","collocations":"look everywhere, go everywhere, found everywhere","preposition_combos":"无常见介词搭配","examples":[{"en":"I looked everywhere for my keys but found nothing.","cn":"我到处找钥匙，但什么都没找到。"},{"en":"During the festival, colorful lights are everywhere in the park.","cn":"节日期间，公园里到处是彩灯。"}],"socratic_questions":[{"question":"你的笔不见了，你翻遍了书包、桌子和地上，可以用哪个词来形容你找的范围？","answer_hint":"这个词表示“所有地方”，比“somewhere”范围更大。"}],"fill_blank":{"sentences":["After the storm, water was ___ on the streets."],"options":["everywhere","somewhere","anywhere","nowhere"],"correct_index":0},"audio":"audio/everywhere.mp3","audio_ex0":"audio/everywhere_ex0.mp3","audio_ex1":"audio/everywhere_ex1.mp3"},{"word":"robotics","ipa":"/rəʊˈbɒtɪks/","image_prompts":["A small wheeled robot with a mechanical arm on a workbench, surrounded by wires and circuit boards","A set of plastic gears and sensors arranged on a blue mat, with a partially built robot frame"],"image_desc_en":"A wheeled robot with a mechanical arm on a workbench; gears and sensors beside a robot frame.","image_desc_cn":"工作台上带机械臂的轮式机器人；齿轮和传感器旁有未完成的机器人框架。","meaning_cn":"机器人学；机器人技术","usage":"n. (不可数名词，常作定语，如 robotics club)","collocations":"robotics club, robotics competition, robotics class","preposition_combos":"无常见介词搭配","examples":[{"en":"Our school has a new robotics club this semester.","cn":"这学期我们学校有了一个新的机器人社团。"},{"en":"He won first prize in the city robotics competition.","cn":"他在市机器人比赛中获得了一等奖。"}],"socratic_questions":[{"question":"你参加了一个社团，大家用零件组装会动的机器，这个社团叫什么名字？","answer_hint":"这个词和“robot”有关，但指的是整个学科或技术领域。"}],"fill_blank":{"sentences":["She joined the ___ team to build a moving car."],"options":["robotics","robots","robotic","robot"],"correct_index":0},"audio":"audio/robotics.mp3","audio_ex0":"audio/robotics_ex0.mp3","audio_ex1":"audio/robotics_ex1.mp3"},{"word":"industry","ipa":"/ˈɪndəstri/","image_prompts":["A large factory with smokestacks at sunset, conveyor belts visible through open doors","Rows of identical metal parts on an assembly line in a well-lit factory hall"],"image_desc_en":"A factory with smokestacks at sunset; rows of metal parts on an assembly line.","image_desc_cn":"日落时分的工厂，烟囱可见；流水线上排列的金属零件。","meaning_cn":"工业；行业；产业","usage":"n. (可数/不可数，复数 industries)","collocations":"heavy industry, car industry, technology industry","preposition_combos":"industry in (a place)","examples":[{"en":"The car industry in this city provides many jobs.","cn":"这座城市的汽车工业提供了许多就业机会。"},{"en":"New technology is changing the food industry quickly.","cn":"新技术正在快速改变食品行业。"}],"socratic_questions":[{"question":"你爸爸在一家生产汽车零件的工厂工作，这个工厂属于哪个大的领域？","answer_hint":"这个词指大规模生产某种产品的领域，比如汽车、钢铁或电子。"}],"fill_blank":{"sentences":["The tourism ___ is very important for this small island."],"options":["industry","factory","company","business"],"correct_index":0},"audio":"audio/industry.mp3","audio_ex0":"audio/industry_ex0.mp3","audio_ex1":"audio/industry_ex1.mp3"},{"word":"service","ipa":"/ˈsɜːrvɪs/","image_prompts":["A clean white plate with a folded napkin on a restaurant table, soft lighting","A red toolbox with a wrench and screwdriver on a wooden workbench"],"image_desc_en":"A clean white plate with a folded napkin on a restaurant table, soft lighting","image_desc_cn":"餐厅桌上一个干净的白色盘子，上面放着折叠好的餐巾，柔和的灯光","meaning_cn":"服务；维修；服役","usage":"n. (可数/不可数) / v. (过去式 serviced, 过去分词 serviced)","collocations":"customer service, room service, public service, service center","preposition_combos":"service to, service for, in service","examples":[{"en":"The hotel service was fast and very friendly.","cn":"酒店的服务又快又友好。"},{"en":"My dad took the car for a service last week.","cn":"我爸爸上周把车送去保养了。"}],"socratic_questions":[{"question":"你去餐厅吃饭时，服务员帮你倒水、上菜，这些行为可以用一个什么词来概括？","answer_hint":"这个词强调为他人提供的帮助或工作，比如酒店或餐厅里的接待。"}],"fill_blank":{"sentences":["The restaurant's ___ is excellent, and the food is delicious too."],"options":["service","menu","price","kitchen"],"correct_index":0},"audio":"audio/service.mp3","audio_ex0":"audio/service_ex0.mp3","audio_ex1":"audio/service_ex1.mp3"},{"word":"disaster","ipa":"/dɪˈzæstər/","image_prompts":["A collapsed wooden bridge over a dry riverbed, broken planks scattered","A dark storm cloud with lightning striking a bare field, heavy rain falling"],"image_desc_en":"A collapsed wooden bridge over a dry riverbed, broken planks scattered","image_desc_cn":"干涸河床上的一座倒塌木桥，断裂的木板散落一地","meaning_cn":"灾难；灾祸；彻底的失败","usage":"n. (可数)","collocations":"natural disaster, disaster area, disaster relief, complete disaster","preposition_combos":"disaster for, disaster in","examples":[{"en":"The earthquake was a terrible disaster for the town.","cn":"这场地震对这个城镇来说是一场可怕的灾难。"},{"en":"My science project was a complete disaster yesterday.","cn":"我的科学项目昨天完全搞砸了。"}],"socratic_questions":[{"question":"如果一场大洪水冲毁了村庄和农田，人们会用什么词来形容这场可怕的事件？","answer_hint":"这个词指造成巨大破坏和痛苦的意外事件，比如地震或洪水。"}],"fill_blank":{"sentences":["The heavy rain caused a terrible ___ in the mountain village."],"options":["disaster","party","game","lesson"],"correct_index":0},"audio":"audio/disaster.mp3","audio_ex0":"audio/disaster_ex0.mp3","audio_ex1":"audio/disaster_ex1.mp3"},{"word":"emergency","ipa":"/ɪˈmɜːrdʒənsi/","image_prompts":["A red fire alarm box on a white wall with a glass cover and a hammer","A flashing red cross sign on a white ambulance parked on a wet road"],"image_desc_en":"A red fire alarm box on a white wall with a glass cover and a hammer","image_desc_cn":"白色墙壁上的红色火警报警箱，带有玻璃罩和一把小锤子","meaning_cn":"紧急情况；突发事件","usage":"n. (可数) / adj. (紧急的)","collocations":"emergency room, emergency exit, emergency call, in an emergency","preposition_combos":"emergency in, emergency for","examples":[{"en":"Please call 120 in case of a medical emergency.","cn":"遇到医疗紧急情况请拨打120。"},{"en":"The school has an emergency plan for fires.","cn":"学校有应对火灾的紧急预案。"}],"socratic_questions":[{"question":"如果有人在操场上突然晕倒，你需要立刻寻求帮助，这种突然发生的危险情况叫什么？","answer_hint":"这个词指需要立即处理的突发危险事件，比如火灾或急病。"}],"fill_blank":{"sentences":["In case of fire, use the ___ exit and do not use the elevator."],"options":["emergency","main","back","side"],"correct_index":0},"audio":"audio/emergency.mp3","audio_ex0":"audio/emergency_ex0.mp3","audio_ex1":"audio/emergency_ex1.mp3"},{"word":"disappear","ipa":"/ˌdɪsəˈpɪr/","image_prompts":["A melting ice cube on a hot metal surface, water puddle forming around it","A trail of footprints on a sandy beach leading to the ocean waves, then vanishing"],"image_desc_en":"A melting ice cube on a hot metal surface, water puddle forming around it","image_desc_cn":"热金属表面上一块正在融化的冰块，周围形成一滩水","meaning_cn":"消失；不见；失踪","usage":"v. (过去式 disappeared, 过去分词 disappeared)","collocations":"disappear from, disappear into, disappear completely","preposition_combos":"disappear from, disappear into","examples":[{"en":"The cat disappeared behind the big sofa quickly.","cn":"那只猫很快消失在大沙发后面。"},{"en":"My keys disappeared from my bag this morning.","cn":"我的钥匙今天早上从包里消失了。"}],"socratic_questions":[{"question":"你把一块糖放进热水里，搅拌几下后糖就看不到了，这种现象可以用哪个动词描述？","answer_hint":"这个词表示某物从视线中完全不见了，比如糖溶化或猫跑掉。"}],"fill_blank":{"sentences":["The sun ___ behind the clouds, and it became dark."],"options":["disappeared","appeared","shined","rose"],"correct_index":0},"audio":"audio/disappear.mp3","audio_ex0":"audio/disappear_ex0.mp3","audio_ex1":"audio/disappear_ex1.mp3"},{"word":"challenging","ipa":"/ˈtʃælɪndʒɪŋ/","image_prompts":["A tall stack of textbooks with a small mountain climber figurine on top, desk lamp casting shadows","A complex jigsaw puzzle with many interlocking pieces scattered on a wooden table, only half completed"],"image_desc_en":"A stack of textbooks with a climber figurine on top, symbolizing a difficult task.","image_desc_cn":"一摞教科书上有一个登山小人，象征困难的任务。","meaning_cn":"具有挑战性的；考验能力的","usage":"adj. (形容词) 比较级 more challenging, 最高级 most challenging","collocations":"challenging task, challenging exam, challenging problem","preposition_combos":"challenging for sb.","examples":[{"en":"The math exam was very challenging for most students.","cn":"这次数学考试对大多数学生来说非常有挑战性。"},{"en":"Climbing this mountain is a challenging but exciting experience.","cn":"攀登这座山是一次有挑战性但令人兴奋的经历。"}],"socratic_questions":[{"question":"你刚拿到一张超难的数学卷子，题目比平时练习难很多，你会怎么形容这张卷子？","answer_hint":"这个词强调任务或事情本身很难，需要付出很多努力，而不是形容人。"}],"fill_blank":{"sentences":["The science project is quite ___ because we have to build a working model."],"options":["challenging","easy","boring","funny"],"correct_index":0},"audio":"audio/challenging.mp3","audio_ex0":"audio/challenging_ex0.mp3","audio_ex1":"audio/challenging_ex1.mp3"},{"word":"pilot","ipa":"/ˈpaɪlət/","image_prompts":["A cockpit dashboard with glowing buttons and a steering wheel, view of clouds through windshield","A model airplane on a runway with a tiny control tower in the background, clear blue sky"],"image_desc_en":"A cockpit dashboard with glowing buttons and a view of clouds through the windshield.","image_desc_cn":"驾驶舱仪表盘上发光的按钮，透过挡风玻璃看到云层。","meaning_cn":"飞行员；驾驶员","usage":"n. (名词) 可数名词，复数 pilots","collocations":"airline pilot, test pilot, pilot program","preposition_combos":"pilot of a plane","examples":[{"en":"The pilot announced that we would land in ten minutes.","cn":"飞行员通知我们十分钟后降落。"},{"en":"My uncle works as a pilot for a big airline company.","cn":"我叔叔在一家大航空公司当飞行员。"}],"socratic_questions":[{"question":"飞机起飞前，广播里有人介绍机组成员，其中负责开飞机的那个人叫什么？","answer_hint":"这个词专指驾驶飞机或飞船的人，不是空乘或地勤。"}],"fill_blank":{"sentences":["The ___ safely landed the plane during the storm."],"options":["pilot","driver","teacher","doctor"],"correct_index":0},"audio":"audio/pilot.mp3","audio_ex0":"audio/pilot_ex0.mp3","audio_ex1":"audio/pilot_ex1.mp3"},{"word":"expert","ipa":"/ˈekspɜːrt/","image_prompts":["A chessboard with a checkmate position, a gold trophy beside it on a velvet cloth","A microscope focused on a leaf sample, with a stack of scientific papers nearby"],"image_desc_en":"A chessboard with a checkmate position and a gold trophy beside it on velvet.","image_desc_cn":"一个将死局面的棋盘，旁边天鹅绒布上放着一座金色奖杯。","meaning_cn":"专家；行家","usage":"n. (名词) 可数名词，复数 experts; adj. (形容词) 熟练的，内行的","collocations":"expert advice, expert in, expert knowledge","preposition_combos":"expert at/in/on (doing) sth.","examples":[{"en":"She is an expert at solving difficult math problems.","cn":"她是解决数学难题的专家。"},{"en":"We asked a computer expert to fix our broken laptop.","cn":"我们请了一位电脑专家来修理坏掉的笔记本电脑。"}],"socratic_questions":[{"question":"你的电脑坏了，你找了一个非常懂电脑、修过很多台电脑的人来帮忙，这个人可以称为什么？","answer_hint":"这个词指在某个领域有丰富知识和技能的人，不是普通爱好者。"}],"fill_blank":{"sentences":["My grandfather is an ___ in traditional Chinese painting."],"options":["expert","artist","student","beginner"],"correct_index":0},"audio":"audio/expert.mp3","audio_ex0":"audio/expert_ex0.mp3","audio_ex1":"audio/expert_ex1.mp3"},{"word":"replace","ipa":"/rɪˈpleɪs/","image_prompts":["A new light bulb being screwed into a lamp socket, the old broken bulb lying on the table","A fresh set of batteries next to an open remote control with old batteries removed"],"image_desc_en":"A new light bulb being screwed into a lamp socket, with the old broken bulb on the table.","image_desc_cn":"一个新灯泡正在拧入灯座，旧灯泡碎在桌子上。","meaning_cn":"代替；取代；更换","usage":"v. (动词) 过去式 replaced, 过去分词 replaced, 现在分词 replacing","collocations":"replace A with B, replace something, replace someone","preposition_combos":"replace sth. with sth.","examples":[{"en":"We need to replace the old printer with a new one.","cn":"我们需要用一台新打印机替换旧的。"},{"en":"Can you replace the empty water bottle in the fridge?","cn":"你能把空水瓶放回冰箱里吗？"}],"socratic_questions":[{"question":"你的自行车轮胎破了，你买了一个新轮胎装上去，把旧的扔掉，这个动作叫什么？","answer_hint":"这个词表示用新的东西换掉旧的或坏的东西，强调一物换一物。"}],"fill_blank":{"sentences":["Please ___ the empty juice carton with a full one from the store."],"options":["replace","remove","repair","return"],"correct_index":0},"audio":"audio/replace.mp3","audio_ex0":"audio/replace_ex0.mp3","audio_ex1":"audio/replace_ex1.mp3"},{"word":"creativity","ipa":"/ˌkriːeɪˈtɪvəti/","image_prompts":["A blank white canvas with colorful paint splashes and a single paintbrush lying beside it, bright studio lighting","A pile of Lego bricks arranged into an unusual abstract shape on a wooden table, soft natural light"],"image_desc_en":"A blank canvas with colorful paint splashes and a brush; Lego bricks in an abstract shape.","image_desc_cn":"一张空白画布上洒满彩色颜料，旁边放着一支画笔；乐高积木搭成抽象形状。","meaning_cn":"创造力；创造性","usage":"n. (不可数名词)","collocations":"show creativity, use creativity, encourage creativity","preposition_combos":"creativity in (doing) sth.","examples":[{"en":"She showed great creativity in her science project design.","cn":"她在科学项目设计中展现了极大的创造力。"},{"en":"Using old boxes for art can boost your creativity.","cn":"用旧盒子做艺术可以提升你的创造力。"}],"socratic_questions":[{"question":"小明用废纸和塑料瓶做了一个小台灯，老师夸他很有想象力。这里形容他做新东西的能力，应该用什么词？","answer_hint":"这个词指创造新事物或新想法的能力，和‘创造’有关。"}],"fill_blank":{"sentences":["Art class helps students develop their ___."],"options":["creativity","strength","memory","speed"],"correct_index":0},"audio":"audio/creativity.mp3","audio_ex0":"audio/creativity_ex0.mp3","audio_ex1":"audio/creativity_ex1.mp3"},{"word":"emotional","ipa":"/ɪˈmoʊʃənl/","image_prompts":["A crumpled tissue paper next to a half-empty coffee cup on a rainy window sill, grey sky outside","A heart-shaped red balloon floating alone against a plain white wall, soft shadow on the floor"],"image_desc_en":"A crumpled tissue and coffee cup by a rainy window; a red heart-shaped balloon against a white wall.","image_desc_cn":"雨窗边揉皱的纸巾和半杯咖啡；白墙前飘着的红色心形气球。","meaning_cn":"情感的；情绪化的","usage":"adj. (副词形式: emotionally)","collocations":"emotional support, emotional problem, emotional moment","preposition_combos":"emotional about sth.","examples":[{"en":"The movie had a very emotional ending that made everyone cry.","cn":"这部电影有一个非常感人的结局，让每个人都哭了。"},{"en":"She felt emotional when she saw her old school again.","cn":"当她再次看到母校时，她感到情绪激动。"}],"socratic_questions":[{"question":"小丽在毕业典礼上看到同学表演时忍不住流泪了，这种和心情、感受有关的形容词是什么？","answer_hint":"这个词描述和内心感受、情绪有关的状态，常用来形容让人感动或难过的时刻。"}],"fill_blank":{"sentences":["Losing a game can be an ___ experience for some players."],"options":["emotional","physical","musical","historical"],"correct_index":0},"audio":"audio/emotional.mp3","audio_ex0":"audio/emotional_ex0.mp3","audio_ex1":"audio/emotional_ex1.mp3"},{"word":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","image_prompts":["A chessboard with pieces arranged in a complex mid-game position, focused lighting on the board","A stack of books with a glowing light bulb on top, dark background"],"image_desc_en":"A chessboard with complex piece arrangement; a stack of books with a glowing light bulb on top.","image_desc_cn":"一个棋子布局复杂的棋盘；一摞书上放着一只发光的灯泡。","meaning_cn":"智力；智慧；情报","usage":"n. (不可数名词)","collocations":"high intelligence, artificial intelligence, use intelligence","preposition_combos":"intelligence in (doing) sth.","examples":[{"en":"Solving this puzzle requires a lot of intelligence and patience.","cn":"解开这个谜题需要很多智力和耐心。"},{"en":"Dogs show great intelligence when learning new tricks.","cn":"狗在学习新把戏时表现出很高的智力。"}],"socratic_questions":[{"question":"小华数学总是考满分，还能快速解开复杂的逻辑题。形容他学习和理解能力很强的名词是什么？","answer_hint":"这个词指学习和解决问题的能力，和‘聪明’、‘智慧’有关。"}],"fill_blank":{"sentences":["Many scientists study animal ___ to understand how they think."],"options":["intelligence","beauty","speed","height"],"correct_index":0},"audio":"audio/intelligence.mp3","audio_ex0":"audio/intelligence_ex0.mp3","audio_ex1":"audio/intelligence_ex1.mp3"},{"word":"emotional intelligence","ipa":"/ɪˈmoʊʃənl ɪnˈtelɪdʒəns/","image_prompts":["Two speech bubbles with a heart and a brain symbol inside each, connected by a dotted line, clean white background","A calm lake reflecting a clear blue sky, with a single leaf floating on the surface, no ripples"],"image_desc_en":"Two speech bubbles with heart and brain symbols connected by a dotted line; a calm lake reflecting sky with a floating leaf.","image_desc_cn":"两个对话气泡里各有心和大脑符号，用虚线相连；平静的湖面倒映蓝天，一片叶子漂浮其上。","meaning_cn":"情商；情绪智力","usage":"n. (不可数名词，常缩写为 EQ)","collocations":"high emotional intelligence, develop emotional intelligence, show emotional intelligence","preposition_combos":"emotional intelligence in (doing) sth.","examples":[{"en":"A good leader needs high emotional intelligence to understand others.","cn":"一个好的领导者需要高情商来理解他人。"},{"en":"She showed great emotional intelligence by calming her friend down.","cn":"她通过安抚朋友展现了很高的情商。"}],"socratic_questions":[{"question":"小刚在朋友吵架时能理解双方感受，并帮他们和好。这种既懂自己情绪又懂别人情绪的能力叫什么？","answer_hint":"这个词由‘情绪’和‘智力’组成，指理解和处理自己及他人情绪的能力。"}],"fill_blank":{"sentences":["People with high ___ can manage their feelings well in difficult situations."],"options":["emotional intelligence","physical strength","musical talent","sports skill"],"correct_index":0},"audio":"audio/emotional_intelligence.mp3","audio_ex0":"audio/emotional_intelligence_ex0.mp3","audio_ex1":"audio/emotional_intelligence_ex1.mp3"},{"word":"mention","ipa":"/ˈmenʃn/","image_prompts":["A speech bubble with the word 'mention' written inside, floating above an open notebook on a wooden desk","A dictionary page open to the word 'mention', highlighted with a yellow marker, soft natural lighting"],"image_desc_en":"A speech bubble with the word 'mention' inside above an open notebook on a wooden desk.","image_desc_cn":"一个写着 'mention' 的对话气泡漂浮在木桌上打开的笔记本上方。","meaning_cn":"提及，说起","usage":"v. (过去式 mentioned, 过去分词 mentioned)","collocations":"mention something to somebody; don't mention it; not to mention","preposition_combos":"mention to; mention in","examples":[{"en":"Did you mention the school trip to your parents?","cn":"你向父母提起学校旅行的事了吗？"},{"en":"She mentioned the exam date in her email.","cn":"她在邮件里提到了考试日期。"}],"socratic_questions":[{"question":"你想告诉朋友明天有社团活动，但不确定他是否已经知道，你会用什么词来轻轻提起这件事？","answer_hint":"这个词表示简单提起或说到某事，不是详细讨论。"}],"fill_blank":{"sentences":["Please ___ the homework deadline in your report."],"options":["mention","forget","hide","ignore"],"correct_index":0},"audio":"audio/mention.mp3","audio_ex0":"audio/mention_ex0.mp3","audio_ex1":"audio/mention_ex1.mp3"},{"word":"refrigerator","ipa":"/rɪˈfrɪdʒəreɪtər/","image_prompts":["A white refrigerator standing in a clean kitchen, door slightly open showing shelves with vegetables and milk cartons","A refrigerator interior with colorful fruit containers and a bottle of water on a glass shelf, bright LED light"],"image_desc_en":"A white refrigerator in a clean kitchen with door slightly open showing vegetables and milk.","image_desc_cn":"一个白色冰箱立在干净厨房里，门微开，露出蔬菜和牛奶。","meaning_cn":"冰箱","usage":"n. (可数名词)","collocations":"in the refrigerator; refrigerator door; refrigerator shelf","preposition_combos":"in the refrigerator; on the refrigerator","examples":[{"en":"Put the leftover pizza in the refrigerator after dinner.","cn":"晚饭后把剩下的披萨放进冰箱。"},{"en":"The refrigerator keeps our food fresh for a long time.","cn":"冰箱能让食物长时间保持新鲜。"}],"socratic_questions":[{"question":"夏天你买了冰淇淋，回家后要放在哪里才不会融化？","answer_hint":"这是一个家用电器，用来冷藏食物和饮料。"}],"fill_blank":{"sentences":["We store milk and eggs in the ___."],"options":["refrigerator","cupboard","microwave","sink"],"correct_index":0},"audio":"audio/refrigerator.mp3","audio_ex0":"audio/refrigerator_ex0.mp3","audio_ex1":"audio/refrigerator_ex1.mp3"},{"word":"low","ipa":"/loʊ/","image_prompts":["A thermometer showing a low temperature near freezing point, frost on the glass outside a window","A stack of three books with the top book titled 'Low Energy', dim lighting in a quiet library corner"],"image_desc_en":"A thermometer showing low temperature near freezing with frost on the window glass.","image_desc_cn":"一个温度计显示接近冰点的低温，窗外玻璃上有霜。","meaning_cn":"低的，矮的；低落的","usage":"adj. (比较级 lower, 最高级 lowest); adv. (比较级 lower, 最高级 lowest)","collocations":"low price; low voice; low energy; low score","preposition_combos":"low in; low on","examples":[{"en":"The price of this jacket is very low this week.","cn":"这件夹克这周价格很低。"},{"en":"He spoke in a low voice during the movie.","cn":"他在电影院里低声说话。"}],"socratic_questions":[{"question":"考试后你发现分数比上次少了很多，心情不太好，可以用哪个词形容分数和心情？","answer_hint":"这个词既可以形容数量少、位置矮，也可以形容情绪不高。"}],"fill_blank":{"sentences":["The battery level is ___; please charge your phone."],"options":["low","high","full","empty"],"correct_index":0},"audio":"audio/low.mp3","audio_ex0":"audio/low_ex0.mp3","audio_ex1":"audio/low_ex1.mp3"},{"word":"run low","ipa":"/rʌn loʊ/","image_prompts":["A nearly empty bottle of water with only a few drops left at the bottom, on a wooden table","A fuel gauge on a car dashboard showing the needle near the red 'E' mark, dim dashboard light"],"image_desc_en":"A nearly empty water bottle with a few drops left at the bottom on a wooden table.","image_desc_cn":"一个几乎空了的矿泉水瓶，底部只剩几滴水，放在木桌上。","meaning_cn":"（供应）变得不足，快用完了","usage":"v.短语 (过去式 ran low, 过去分词 run low)","collocations":"run low on something; supplies run low; time runs low","preposition_combos":"run low on","examples":[{"en":"We are running low on milk, so please buy some.","cn":"我们的牛奶快喝完了，请买一些。"},{"en":"Time is running low before the final exam.","cn":"期末考试前时间不多了。"}],"socratic_questions":[{"question":"你发现冰箱里的鸡蛋只剩两个了，妈妈让你提醒她，你会怎么描述鸡蛋的数量？","answer_hint":"这个短语表示某样东西的数量正在减少，快要没有了。"}],"fill_blank":{"sentences":["Our printer ink is ___; we need to order more."],"options":["running low","running out","running high","running fast"],"correct_index":0},"audio":"audio/run_low.mp3","audio_ex0":"audio/run_low_ex0.mp3","audio_ex1":"audio/run_low_ex1.mp3"},{"word":"accept","ipa":"/əkˈsept/","image_prompts":["A wrapped gift box with a red ribbon on a wooden table, lid slightly open","A hand stamp with the word 'APPROVED' on a white paper document"],"image_desc_en":"A gift box with ribbon and an approved stamp on paper","image_desc_cn":"一个系着丝带的礼物盒和一张盖有‘批准’印章的纸","meaning_cn":"接受；承认","usage":"v. (过去式 accepted, 过去分词 accepted)","collocations":"accept an invitation, accept the truth, accept a challenge","preposition_combos":"accept from, accept as","examples":[{"en":"I will accept your invitation to the birthday party.","cn":"我会接受你的生日派对邀请。"},{"en":"She finally accepted the truth about the broken vase.","cn":"她终于接受了花瓶破碎的事实。"}],"socratic_questions":[{"question":"朋友递给你一张生日派对邀请卡，你开心地拿过来并说‘好’。这个动作叫什么？","answer_hint":"表示‘拿过来并同意’的动作，不是‘拒绝’或‘怀疑’。"}],"fill_blank":{"sentences":["Please ___ this small gift from our class."],"options":["accept","refuse","forget","break"],"correct_index":0},"audio":"audio/accept.mp3","audio_ex0":"audio/accept_ex0.mp3","audio_ex1":"audio/accept_ex1.mp3"},{"word":"influence","ipa":"/ˈɪnfluəns/","image_prompts":["A large magnet attracting small metal paperclips on a white desk","A tree with one side heavily bent by wind, branches all pointing right"],"image_desc_en":"A magnet pulling paperclips and a wind-bent tree","image_desc_cn":"一块磁铁吸引回形针和一棵被风吹弯的树","meaning_cn":"影响；作用","usage":"n. / v. (过去式 influenced, 过去分词 influenced)","collocations":"have an influence on, influence someone's decision, positive influence","preposition_combos":"influence on, influence over","examples":[{"en":"Good friends can have a positive influence on your life.","cn":"好朋友能对你的生活产生积极影响。"},{"en":"The weather greatly influenced our plan for the picnic.","cn":"天气极大地影响了我们的野餐计划。"}],"socratic_questions":[{"question":"你看到天气预报说周末要下雨，于是把户外活动改成了室内游戏。是什么改变了你的决定？","answer_hint":"不是‘控制’或‘命令’，而是像天气一样‘改变想法’的力量。"}],"fill_blank":{"sentences":["Her words had a strong ___ on my final choice."],"options":["influence","temperature","distance","color"],"correct_index":0},"audio":"audio/influence.mp3","audio_ex0":"audio/influence_ex0.mp3","audio_ex1":"audio/influence_ex1.mp3"},{"word":"creative","ipa":"/kriˈeɪtɪv/","image_prompts":["A blank canvas with colorful paint splashes and a palette beside it","A Lego castle built with unusual colored bricks on a blue mat"],"image_desc_en":"A canvas with paint splashes and a Lego castle with colorful bricks","image_desc_cn":"一块溅满颜料的画布和一座用彩色乐高搭成的城堡","meaning_cn":"有创造力的；创新的","usage":"adj. (副词 creatively)","collocations":"creative idea, creative writing, creative solution","preposition_combos":"creative in, creative with","examples":[{"en":"She came up with a creative way to decorate the classroom.","cn":"她想出了一个有创意的方法来装饰教室。"},{"en":"Being creative helps you solve problems in new ways.","cn":"有创造力能帮你用新方法解决问题。"}],"socratic_questions":[{"question":"美术课上，你用废纸盒做了一辆小汽车模型，老师夸你‘很有想象力’。这个特点是什么？","answer_hint":"不是‘聪明’或‘勤奋’，而是‘能想出新颖点子’的能力。"}],"fill_blank":{"sentences":["The students showed a ___ way to reuse old bottles."],"options":["creative","boring","heavy","fast"],"correct_index":0},"audio":"audio/creative.mp3","audio_ex0":"audio/creative_ex0.mp3","audio_ex1":"audio/creative_ex1.mp3"},{"word":"impossible","ipa":"/ɪmˈpɒsəbl/","image_prompts":["A closed door with a huge padlock and a sign saying 'NO ENTRY'","A mountain of stacked books reaching the ceiling with no ladder nearby"],"image_desc_en":"A locked door with a no-entry sign and a tall stack of books with no ladder","image_desc_cn":"一扇锁着的门挂着‘禁止进入’标志，以及一堆高到天花板的书旁没有梯子","meaning_cn":"不可能的；做不到的","usage":"adj. (名词 impossibility)","collocations":"impossible task, almost impossible, find it impossible","preposition_combos":"impossible for, impossible to","examples":[{"en":"It is impossible to finish this huge cake in one hour.","cn":"一小时内吃完这个大蛋糕是不可能的。"},{"en":"Climbing that steep wall without ropes seems impossible.","cn":"没有绳子爬上那面陡峭的墙似乎不可能。"}],"socratic_questions":[{"question":"你面前有一道数学题，所有条件都缺，你试了十次都解不出来。你觉得这件事怎么样？","answer_hint":"不是‘困难’（difficult），而是‘根本没法完成’的意思。"}],"fill_blank":{"sentences":["It is ___ for me to run 10 kilometers in ten minutes."],"options":["impossible","possible","easy","fun"],"correct_index":0},"audio":"audio/impossible.mp3","audio_ex0":"audio/impossible_ex0.mp3","audio_ex1":"audio/impossible_ex1.mp3"},{"word":"quality","ipa":"/ˈkwɒləti/","image_prompts":["A close-up of a hand holding a polished wooden chess piece with smooth grain and no scratches, soft lighting","A stack of crisp, clean white paper sheets with a gold foil seal on top, on a minimalist desk"],"image_desc_en":"A close-up of a polished wooden chess piece with smooth grain, no scratches, soft lighting.","image_desc_cn":"一个抛光木质国际象棋棋子的特写，纹理光滑无划痕，柔光照明。","meaning_cn":"质量；品质；优质的","usage":"n. (可数/不可数) 质量，品质；adj. 优质的","collocations":"high quality, good quality, quality time, quality education","preposition_combos":"quality of (sth.)","examples":[{"en":"The quality of this notebook is very good for writing.","cn":"这本笔记本的质量非常适合书写。"},{"en":"We should spend quality time with our family every week.","cn":"我们每周都应该和家人共度美好时光。"}],"socratic_questions":[{"question":"你买了一支笔，写字很流畅，外壳也没有毛刺，你会怎么形容这支笔的做工？","answer_hint":"这个词强调物品的优良程度，不是价格或颜色。"}],"fill_blank":{"sentences":["The ___ of the air in this room is very poor because of the smoke."],"options":["quality","quantity","quota","quiet"],"correct_index":0},"audio":"audio/quality.mp3","audio_ex0":"audio/quality_ex0.mp3","audio_ex1":"audio/quality_ex1.mp3"},{"word":"develop","ipa":"/dɪˈveləp/","image_prompts":["A series of three potted plants in increasing size, from a small sprout to a leafy bush, on a white shelf","A roll of photographic film being unrolled in a darkroom with red light, showing faint images"],"image_desc_en":"Three potted plants in increasing size from sprout to leafy bush on a white shelf.","image_desc_cn":"三盆盆栽植物从幼苗到茂盛灌木依次增大，放在白色架子上。","meaning_cn":"发展；培养；开发；冲洗（胶卷）","usage":"v. (过去式 developed, 过去分词 developed)","collocations":"develop a habit, develop skills, develop a photo, develop an idea","preposition_combos":"develop into, develop from","examples":[{"en":"You can develop your reading skills by reading every day.","cn":"你可以通过每天阅读来培养阅读技能。"},{"en":"The small town developed into a big city over ten years.","cn":"这个小镇在十年间发展成了一座大城市。"}],"socratic_questions":[{"question":"你每天练习弹吉他，从不会到能弹一首完整的曲子，这个过程叫什么？","answer_hint":"这个词表示从无到有、从小到大的变化过程。"}],"fill_blank":{"sentences":["It takes time to ___ a good study habit."],"options":["develop","destroy","discover","divide"],"correct_index":0},"audio":"audio/develop.mp3","audio_ex0":"audio/develop_ex0.mp3","audio_ex1":"audio/develop_ex1.mp3"},{"word":"German","ipa":"/ˈdʒɜːmən/","image_prompts":["A black, red, and gold flag waving on a flagpole against a clear blue sky","A plate of bratwurst sausages and sauerkraut on a wooden table, with a stein of beer nearby"],"image_desc_en":"A black, red, and gold flag waving on a flagpole against a clear blue sky.","image_desc_cn":"一面黑、红、金三色旗在旗杆上飘扬，背景是清澈的蓝天。","meaning_cn":"德国的；德语；德国人","usage":"adj. 德国的；n. 德语（不可数）；n. 德国人（可数，复数 Germans）","collocations":"German language, German food, German car, German culture","preposition_combos":"in German, from German","examples":[{"en":"My cousin is learning the German language for his trip.","cn":"我的表弟为了旅行正在学习德语。"},{"en":"This car is made by a famous German company.","cn":"这辆车由一家著名的德国公司制造。"}],"socratic_questions":[{"question":"你看到一张照片，上面有啤酒、香肠和一面黑红金三色旗，这代表哪个国家？","answer_hint":"这个词指代一个欧洲国家及其语言、文化。"}],"fill_blank":{"sentences":["She can speak ___ very well because she lived in Berlin for two years."],"options":["German","Germany","Germans","Germanic"],"correct_index":0},"audio":"audio/German.mp3","audio_ex0":"audio/German_ex0.mp3","audio_ex1":"audio/German_ex1.mp3"},{"word":"valuable","ipa":"/ˈvæljuəbl/","image_prompts":["A gold pocket watch with an open lid, resting on a stack of old leather-bound books","A diamond ring placed on a black velvet cloth, with a single beam of light highlighting the gem"],"image_desc_en":"A gold pocket watch with an open lid on a stack of old leather-bound books.","image_desc_cn":"一块打开盖子的金怀表，放在一叠旧皮面书上。","meaning_cn":"有价值的；宝贵的；珍贵的","usage":"adj. 有价值的；n. (pl. valuables) 贵重物品","collocations":"valuable advice, valuable time, valuable experience, valuable lesson","preposition_combos":"valuable to/for (sb./sth.)","examples":[{"en":"The old map is very valuable to the museum.","cn":"这张旧地图对博物馆来说非常珍贵。"},{"en":"My grandmother gave me some valuable advice about friendship.","cn":"我奶奶给了我一些关于友谊的宝贵建议。"}],"socratic_questions":[{"question":"老师给你一条学习建议，你按照它做后成绩提高了，你会怎么形容这条建议？","answer_hint":"这个词表示某物很有用、很珍贵，不一定是金钱上的。"}],"fill_blank":{"sentences":["This painting is extremely ___ and should be kept in a safe place."],"options":["valuable","valueless","volatile","various"],"correct_index":0},"audio":"audio/valuable.mp3","audio_ex0":"audio/valuable_ex0.mp3","audio_ex1":"audio/valuable_ex1.mp3"},{"word":"public","ipa":"/ˈpʌblɪk/","image_prompts":["A large library reading room with rows of bookshelves and empty tables, warm lighting, no people","A city park with a fountain in the center, benches along the path, autumn leaves on the ground, no people"],"image_desc_en":"A quiet public library reading room with bookshelves and tables, or a public park with a fountain and benches.","image_desc_cn":"一个安静的公共图书馆阅览室，有书架和桌子；或一个有喷泉和长椅的公共公园。","meaning_cn":"adj. 公共的，公众的；n. 公众，民众","usage":"adj. (无词形变化); n. (不可数，常与 the 连用)","collocations":"public library, public school, public transport, in public","preposition_combos":"in public (公开地), for the public (为公众)","examples":[{"en":"You should not talk loudly in a public library.","cn":"你不应该在公共图书馆大声说话。"},{"en":"The public park is a good place for a picnic.","cn":"这个公共公园是野餐的好地方。"}],"socratic_questions":[{"question":"小明想去一个所有人都能免费进入、借书的地方，这个地方叫什么？","answer_hint":"这个词表示“公共的”，强调属于所有人的，不是私人的。"}],"fill_blank":{"sentences":["We should keep our voice down in ___ places like hospitals."],"options":["public","private","quiet","noisy"],"correct_index":0},"audio":"audio/public.mp3","audio_ex0":"audio/public_ex0.mp3","audio_ex1":"audio/public_ex1.mp3"},{"word":"medical","ipa":"/ˈmedɪkl/","image_prompts":["A white stethoscope lying on a clean wooden desk next to a small potted plant, soft daylight","A row of medicine bottles with labels on a pharmacy shelf, blurred background"],"image_desc_en":"A stethoscope on a desk or medicine bottles on a pharmacy shelf, representing medical equipment and supplies.","image_desc_cn":"桌子上的听诊器或药架上的药瓶，代表医疗设备和用品。","meaning_cn":"adj. 医学的，医疗的","usage":"adj. (无词形变化)","collocations":"medical care, medical exam, medical history, medical school","preposition_combos":"for medical reasons (因医疗原因), under medical treatment (在接受治疗)","examples":[{"en":"My uncle works as a nurse in a medical center.","cn":"我叔叔在一家医疗中心当护士。"},{"en":"You need a medical check-up before joining the sports team.","cn":"加入运动队之前你需要做一次体检。"}],"socratic_questions":[{"question":"你感冒了，妈妈带你去医院做检查，这个检查跟什么有关？","answer_hint":"这个词和“医生、医院、治疗”相关，意思是“医学的”。"}],"fill_blank":{"sentences":["The doctor gave him a full ___ examination this morning."],"options":["medical","physical","mental","final"],"correct_index":0},"audio":"audio/medical.mp3","audio_ex0":"audio/medical_ex0.mp3","audio_ex1":"audio/medical_ex1.mp3"},{"word":"challenge","ipa":"/ˈtʃælɪndʒ/","image_prompts":["A tall climbing wall with colorful handholds against a blue sky, no climbers visible","A complex jigsaw puzzle with many pieces scattered on a wooden table, one piece being placed"],"image_desc_en":"A climbing wall with handholds or a jigsaw puzzle being assembled, representing a difficult task.","image_desc_cn":"一面有攀岩点的攀岩墙或正在拼装的拼图，代表一项困难的任务。","meaning_cn":"n. 挑战；v. 向……挑战 (过去式 challenged, 过去分词 challenged)","usage":"n. (可数名词); v. (过去式 challenged, 过去分词 challenged)","collocations":"face a challenge, take on a challenge, challenge oneself","preposition_combos":"challenge to (对……的挑战), challenge for (为……而挑战)","examples":[{"en":"Learning a new language is a big challenge for me.","cn":"学习一门新语言对我来说是一个很大的挑战。"},{"en":"He challenged his friend to a chess game after school.","cn":"他放学后向朋友挑战下棋。"}],"socratic_questions":[{"question":"数学考试最后一道题非常难，很多同学都做不出来，这道题对大家来说是什么？","answer_hint":"这个词表示“困难但值得尝试的事情”，不是简单的任务。"}],"fill_blank":{"sentences":["Running a marathon is a huge ___ for most people."],"options":["challenge","game","race","party"],"correct_index":0},"audio":"audio/challenge.mp3","audio_ex0":"audio/challenge_ex0.mp3","audio_ex1":"audio/challenge_ex1.mp3"},{"word":"task","ipa":"/tɑːsk/","image_prompts":["A whiteboard with a checklist written in marker, several boxes checked off, in a bright room","A stack of papers with a red pen on top, next to a cup of coffee on a desk"],"image_desc_en":"A whiteboard with a checklist or a stack of papers with a pen, representing a specific job to do.","image_desc_cn":"带有清单的白板或一叠纸和笔，代表一项具体的工作。","meaning_cn":"n. 任务，工作","usage":"n. (可数名词)","collocations":"finish a task, daily task, main task, task list","preposition_combos":"task for (为……的任务), task of (……的任务)","examples":[{"en":"My first task today is to clean my bedroom.","cn":"我今天的第一项任务是打扫我的卧室。"},{"en":"The teacher gave us a writing task for homework.","cn":"老师给我们布置了一项写作任务作为家庭作业。"}],"socratic_questions":[{"question":"老师让你在放学前把教室里的垃圾倒掉，这件事对你来说是什么？","answer_hint":"这个词指“需要完成的具体工作”，比“作业”范围更广。"}],"fill_blank":{"sentences":["Completing this ___ will take about two hours."],"options":["task","trip","test","talk"],"correct_index":0},"audio":"audio/task.mp3","audio_ex0":"audio/task_ex0.mp3","audio_ex1":"audio/task_ex1.mp3"},{"word":"depend","ipa":"/dɪˈpend/","image_prompts":["A sunflower turning its head toward sunlight through a window, bright yellow petals","A small plant leaning on a wooden stick for support in a garden, green leaves"],"image_desc_en":"A sunflower turning toward sunlight; a plant leaning on a stick.","image_desc_cn":"向日葵转向阳光；植物靠在木棍上。","meaning_cn":"依靠；依赖；取决于","usage":"v. (过去式 depended, 过去分词 depended)","collocations":"depend on/upon","preposition_combos":"depend on/upon sb/sth","examples":[{"en":"Your grade will depend on the final exam.","cn":"你的成绩将取决于期末考试。"},{"en":"We depend on the bus to get to school.","cn":"我们靠公交车去上学。"}],"socratic_questions":[{"question":"小明想知道明天的野餐能不能成行，妈妈说要看天气。这时可以用哪个词表示‘看情况而定’？","answer_hint":"这个词表示结果由某个条件决定，比如天气。"}],"fill_blank":{"sentences":["Whether we go hiking tomorrow will ___ on the weather."],"options":["depend","decide","wait","try"],"correct_index":0},"audio":"audio/depend.mp3","audio_ex0":"audio/depend_ex0.mp3","audio_ex1":"audio/depend_ex1.mp3"},{"word":"depend on","ipa":"/dɪˈpend ɒn/","image_prompts":["A pair of crutches leaning against a wall next to a backpack, indoor setting","A calculator sitting on top of a stack of textbooks, desk lamp shining"],"image_desc_en":"Crutches leaning against a wall; a calculator on textbooks under a lamp.","image_desc_cn":"拐杖靠在墙边；计算器放在课本上，台灯亮着。","meaning_cn":"依靠；依赖；取决于","usage":"phrasal verb (过去式 depended on, 过去分词 depended on)","collocations":"depend on sb/sth for sth","preposition_combos":"depend on/upon","examples":[{"en":"You can depend on the map to find the way.","cn":"你可以靠地图找到路。"},{"en":"The picnic depends on the weather this weekend.","cn":"野餐取决于这个周末的天气。"}],"socratic_questions":[{"question":"小红要完成小组作业，但她的电脑坏了，她需要借用同学的电脑。这时可以用哪个短语表示‘依靠’？","answer_hint":"这个短语由两个词组成，表示需要某物或某人的帮助。"}],"fill_blank":{"sentences":["We can ___ ___ the library for research materials."],"options":["depend on","look for","turn off","give up"],"correct_index":0},"audio":"audio/depend_on.mp3","audio_ex0":"audio/depend_on_ex0.mp3","audio_ex1":"audio/depend_on_ex1.mp3"},{"word":"come over","ipa":"/kʌm ˈəʊvə/","image_prompts":["A bicycle parked outside a front door with a welcome mat, sunny afternoon","A stack of board games on a coffee table next to two empty cups"],"image_desc_en":"A bicycle by a front door with a welcome mat; board games on a coffee table.","image_desc_cn":"自行车停在前门外，门口有迎宾垫；咖啡桌上放着桌游和两个空杯子。","meaning_cn":"过来；来访","usage":"phrasal verb (过去式 came over, 过去分词 come over)","collocations":"come over to + place","preposition_combos":"come over to","examples":[{"en":"My friend will come over after school today.","cn":"我的朋友今天放学后会过来。"},{"en":"Please come over to my house this Saturday.","cn":"请这个周六来我家玩。"}],"socratic_questions":[{"question":"小华邀请同学周末来家里一起复习功课，同学答应了。这时可以用哪个短语表示‘到某人家来’？","answer_hint":"这个短语由两个词组成，表示从别处移动到说话人所在的地方。"}],"fill_blank":{"sentences":["Can you ___ ___ to my place and help me with math?"],"options":["come over","go out","run away","sit down"],"correct_index":0},"audio":"audio/come_over.mp3","audio_ex0":"audio/come_over_ex0.mp3","audio_ex1":"audio/come_over_ex1.mp3"},{"word":"as long as","ipa":"/æz lɒŋ æz/","image_prompts":["A green traffic light glowing against a blue sky, empty crosswalk","A key inserted into a lock with a golden glow around the keyhole"],"image_desc_en":"A green traffic light on a clear day; a key in a lock with a golden glow.","image_desc_cn":"晴朗天空下的绿灯；钥匙插入锁孔，周围有金色光芒。","meaning_cn":"只要（表示条件）","usage":"conj. (连词，引导条件状语从句)","collocations":"as long as + 从句","preposition_combos":"","examples":[{"en":"You can borrow my book as long as you return it.","cn":"只要你还回来，你就可以借我的书。"},{"en":"We will win the game as long as we work together.","cn":"只要我们合作，我们就会赢比赛。"}],"socratic_questions":[{"question":"妈妈对小明说：‘只要你做完作业，就可以看电视。’这里表示条件的短语是什么？","answer_hint":"这个短语由三个词组成，意思是‘在……条件下’。"}],"fill_blank":{"sentences":["You can join the club ___ ___ ___ you follow the rules."],"options":["as long as","as soon as","even though","so that"],"correct_index":0},"audio":"audio/as_long_as.mp3","audio_ex0":"audio/as_long_as_ex0.mp3","audio_ex1":"audio/as_long_as_ex1.mp3"}]}]};</script>

async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);

  if (page === "p1") { showCurrentWord(); return; }

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playAudioPath(path, fallbackText) {
  if (!path && fallbackText) { speakWord(fallbackText); return; }
  const urls = [];
  if (path) {
    if (path.startsWith("http")) urls.push(path);
    else {
      const rel = path.replace(/^Unit\d+\/?/, "");
      if (rel) urls.push(rel);
      const cos = mediaUrl(path);
      if (cos && urls.indexOf(cos) < 0) urls.push(cos);
    }
  }
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { if (fallbackText) speakWord(fallbackText); return; }
    const a = new Audio(urls[i++]);
    a.play().catch(tryNext);
  }
  tryNext();
}
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  playAudioPath(w.audio, w.word);
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
    rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
    alert("无法启动英语语音识别：" + (err?.message || err));
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}
