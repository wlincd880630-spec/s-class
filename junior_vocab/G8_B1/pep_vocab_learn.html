":"这个词形容因为意外的事情而感到惊讶，通常搭配‘be ___ at’或‘be ___ to do’。"}],"fill_blank":{"sentences":["Everyone was ___ to hear that the quiet boy won the speech competition."],"options":["surprised","bored","tired","angry"],"correct_index":0}},{"word":"deer","ipa":"/dɪr/","image_prompts":["A deer standing still in a snowy forest, its antlers covered with frost, no people visible","A deer grazing on grass near a wooden fence in a green meadow at sunset, empty landscape"],"image_desc_en":"A deer in a natural setting, showing its antlers and body, without any humans.","image_desc_cn":"一只鹿在自然环境中，展示其鹿角和身体，无任何人。","meaning_cn":"鹿","usage":"n. (可数名词，复数 deer 或 deers，但常用 deer)","collocations":"a deer in the forest, spot a deer, deer antlers","preposition_combos":"deer in the woods, deer near the river","examples":[{"en":"A deer ran across the road in front of our car.","cn":"一只鹿在我们车前跑过马路。"},{"en":"We saw a deer eating grass near the lake yesterday.","cn":"昨天我们看到一只鹿在湖边吃草。"}],"socratic_questions":[{"question":"你在森林里散步时，突然看到一只长着大角的动物，它很胆小，一听到声音就跑了。这是什么动物？","answer_hint":"这种动物有角，通常生活在森林里，单词以 d 开头，是鹿。"}],"fill_blank":{"sentences":["A ___ stood quietly under the tall tree in the park."],"options":["deer","dog","cat","bird"],"correct_index":0}},{"word":"probably","ipa":"/ˈprɑːbəbli/","image_prompts":["A cloudy sky with a 70% chance of rain sign on a wooden post, no people","A half-filled glass of water on a table, with a question mark drawn in condensation"],"image_desc_en":"A scene suggesting uncertainty or likelihood, like a weather forecast sign or a half-filled glass.","image_desc_cn":"一个暗示不确定性或可能性的场景，比如天气预报标志或半杯水。","meaning_cn":"很可能，大概","usage":"adv.","collocations":"probably will, probably not, most probably","preposition_combos":"","examples":[{"en":"It will probably rain tomorrow, so take an umbrella.","cn":"明天很可能下雨，所以带把伞。"},{"en":"She is probably the best singer in our school club.","cn":"她很可能是我校社团里最好的歌手。"}],"socratic_questions":[{"question":"你看到天空乌云密布，你觉得今天下午会下雨吗？用哪个词表示“很有可能”？","answer_hint":"这个词以 p 开头，表示可能性很大，但不是100%确定。"}],"fill_blank":{"sentences":["He will ___ arrive late because of the heavy traffic."],"options":["probably","certainly","never","hardly"],"correct_index":0}},{"word":"look for","ipa":"/lʊk fɔːr/","image_prompts":["A flashlight beam scanning across a dark forest floor, highlighting a lost key among leaves","A magnifying glass resting on an open map with a red circle drawn around a location"],"image_desc_en":"An object being searched for, like a key under a flashlight or a spot on a map with a magnifying glass.","image_desc_cn":"正在被寻找的物品，比如手电筒下的钥匙或放大镜下的地图位置。","meaning_cn":"寻找","usage":"v. (短语动词，look for + 宾语；过去式 looked for, 过去分词 looked for)","collocations":"look for a book, look for my phone, look for a solution","preposition_combos":"look for something in/on/under...","examples":[{"en":"I am looking for my lost pencil case in the classroom.","cn":"我在教室里找我丢失的铅笔盒。"},{"en":"They are looking for a good place to have lunch together.","cn":"他们在找一个一起吃午饭的好地方。"}],"socratic_questions":[{"question":"你的钥匙不见了，你正在房间里到处检查，想找到它。这个动作叫什么？","answer_hint":"这是一个短语动词，由两个词组成，意思是“试图找到”。"}],"fill_blank":{"sentences":["Can you help me ___ my English dictionary?"],"options":["look for","look at","look after","look up"],"correct_index":0}},{"word":"Guest-Greeting","ipa":"/ɡest ˈɡriːtɪŋ/","image_prompts":["A welcome mat at a front door with the word 'Welcome' woven into it, no people","A reception desk with a small bell and a sign reading 'Please ring for service', empty chair"],"image_desc_en":"Objects associated with welcoming visitors, like a welcome mat or a reception bell.","image_desc_cn":"与欢迎访客相关的物品，比如迎宾垫或接待铃。","meaning_cn":"迎宾，问候客人","usage":"n. (复合名词，不可数；也可作形容词，如 guest-greeting service)","collocations":"guest-greeting service, guest-greeting area, guest-greeting task","preposition_combos":"","examples":[{"en":"The hotel's guest-greeting service starts at eight in the morning.","cn":"酒店的迎宾服务从早上八点开始。"},{"en":"She volunteered for the guest-greeting duty at the school event.","cn":"她在学校活动中自愿承担迎宾任务。"}],"socratic_questions":[{"question":"你参加一个学校开放日，门口有同学负责欢迎来访的家长。这个工作叫什么？","answer_hint":"这是一个复合词，由“客人”和“问候”组成，意思是迎接客人。"}],"fill_blank":{"sentences":["The ___ team stood at the entrance with big smiles."],"options":["guest-greeting","guest-greeted","guest-greets","guest-greeter"],"correct_index":0}},{"word":"Sea of Clouds","ipa":"/siː əv klaʊdz/","image_prompts":["A vast expanse of white cloud tops stretching to the horizon under a clear blue sky, mountain peaks poking through like islands","Thick white clouds filling a valley below a mountain summit, golden sunlight illuminating the cloud surface"],"image_desc_en":"A panoramic view of thick white clouds covering a valley, resembling a sea, with distant mountain peaks visible above the clouds.","image_desc_cn":"厚厚白云覆盖山谷的全景，宛如大海，远处山峰露出云层之上。","meaning_cn":"云海","usage":"n. (名词，常作专有名词或普通名词短语)","collocations":"a sea of clouds, above the sea of clouds, watch the sea of clouds","preposition_combos":"above the sea of clouds, in the sea of clouds","examples":[{"en":"We saw a beautiful sea of clouds from the top of the mountain.","cn":"我们从山顶看到了美丽的云海。"},{"en":"The sea of clouds looked like a white ocean in the morning.","cn":"早晨的云海看起来像一片白色海洋。"}],"socratic_questions":[{"question":"你站在高山顶上，低头看到脚下全是厚厚的白色云层，像一片白色的大海，这个自然景象叫什么？","answer_hint":"这个词由‘海’和‘云’组成，形容云层像海一样广阔。"}],"fill_blank":{"sentences":["From the airplane window, we looked down at a beautiful ___ below us."],"options":["sea of clouds","rainbow","fog","storm"],"correct_index":0}},{"word":"Seattle","ipa":"/siˈætəl/","image_prompts":["A view of the Space Needle tower rising above downtown buildings with Mount Rainier in the background under a clear sky","A ferry boat crossing Elliott Bay with the Seattle skyline and the Great Wheel visible on the waterfront"],"image_desc_en":"A city skyline featuring the Space Needle, surrounded by water and mountains, with modern buildings and a port.","image_desc_cn":"以太空针塔为特色的城市天际线，被水域和山脉环绕，有现代建筑和港口。","meaning_cn":"西雅图（美国城市）","usage":"n. (专有名词，地名)","collocations":"fly to Seattle, live in Seattle, Seattle is famous for","preposition_combos":"in Seattle, from Seattle, to Seattle","examples":[{"en":"My uncle lives in Seattle and works at a coffee company.","cn":"我叔叔住在西雅图，在一家咖啡公司工作。"},{"en":"Seattle is famous for its rainy weather and the Space Needle.","cn":"西雅图以其多雨的天气和太空针塔而闻名。"}],"socratic_questions":[{"question":"美国有一个城市以咖啡文化、多雨天气和一座高塔地标闻名，这个城市叫什么？","answer_hint":"这个城市名字以S开头，是星巴克咖啡的发源地。"}],"fill_blank":{"sentences":["We are planning a family trip to ___ next summer to visit the Space Needle."],"options":["Seattle","London","Tokyo","Paris"],"correct_index":0}},{"word":"Red Square","ipa":"/red skweər/","image_prompts":["A wide cobblestone plaza with Saint Basil's Cathedral with colorful onion domes at one end, under a cloudy sky","The red brick walls of the Kremlin bordering a large open square with a bronze statue in the center"],"image_desc_en":"A large open cobblestone square in Moscow, with Saint Basil's Cathedral and the Kremlin walls visible.","image_desc_cn":"莫斯科的大型露天鹅卵石广场，可见圣瓦西里大教堂和克里姆林宫围墙。","meaning_cn":"红场（莫斯科著名广场）","usage":"n. (专有名词，地名)","collocations":"visit Red Square, walk across Red Square, Red Square in Moscow","preposition_combos":"on Red Square, at Red Square","examples":[{"en":"Tourists from all over the world visit Red Square every year.","cn":"每年来自世界各地的游客参观红场。"},{"en":"Red Square is one of the most famous squares in the world.","cn":"红场是世界上最著名的广场之一。"}],"socratic_questions":[{"question":"俄罗斯莫斯科有一个著名的广场，旁边有彩色洋葱顶的教堂和克里姆林宫，这个广场叫什么？","answer_hint":"名字里有‘红色’这个词，但广场本身不一定是红色的。"}],"fill_blank":{"sentences":["The New Year celebration in Moscow often takes place on ___."],"options":["Red Square","Times Square","Tiananmen Square","Trafalgar Square"],"correct_index":0}},{"word":"Moscow","ipa":"/ˈmɒskoʊ/","image_prompts":["A red brick wall with colorful onion-shaped domes of St. Basil's Cathedral under a clear blue sky, snow on the ground","A large open square with cobblestones, a tall red tower with a star on top, and a long building with many windows"],"image_desc_en":"St. Basil's Cathedral with colorful domes in snow; Red Square with a tall tower and star.","image_desc_cn":"雪中色彩斑斓的圣瓦西里大教堂；红场上有带星星的高塔。","meaning_cn":"莫斯科（俄罗斯首都）","usage":"n. (专有名词)","collocations":"Moscow city, Moscow subway, Moscow winter","preposition_combos":"in Moscow; from Moscow; travel to Moscow","examples":[{"en":"Moscow is a very big city with many old buildings.","cn":"莫斯科是一个有很多古老建筑的大城市。"},{"en":"My uncle went to Moscow for a business trip last winter.","cn":"我叔叔去年冬天去莫斯科出差了。"}],"socratic_questions":[{"question":"地理课上，老师展示了一张图片：红场、彩色洋葱顶的教堂、克里姆林宫。老师说这是某个国家的首都，这个城市名字以M开头。你知道是哪个城市吗？","answer_hint":"这是俄罗斯的首都莫斯科（Moscow），以红场和彩色教堂闻名。"}],"fill_blank":{"sentences":["The capital of Russia is ___, a city famous for its red square and colorful churches."],"options":["Moscow","Vincent","London","Paris"],"correct_index":0}},{"word":"Russia","ipa":"/ˈrʌʃə/","image_prompts":["A vast snowy landscape with birch trees and a frozen lake under a pale winter sky, a wooden cabin in the distance","A map of the world with the largest country highlighted in green, spanning Europe and Asia, with a red star marking its capital"],"image_desc_en":"A snowy landscape with birch trees and a frozen lake; a world map with the largest country highlighted.","image_desc_cn":"有白桦树和冰冻湖泊的雪景；世界地图上最大的国家被高亮标记。","meaning_cn":"俄罗斯（国家名）","usage":"n. (专有名词)","collocations":"Russia country, Russia winter, Russia flag","preposition_combos":"in Russia; from Russia; travel to Russia","examples":[{"en":"Russia is the largest country in the world by area.","cn":"俄罗斯是世界上面积最大的国家。"},{"en":"The winter in Russia is very cold and snowy.","cn":"俄罗斯的冬天非常寒冷且多雪。"}],"socratic_questions":[{"question":"你在看世界地图，发现有一个国家横跨欧洲和亚洲，面积最大，国旗是白、蓝、红三色。这个国家的名字以R开头。你知道是哪个国家吗？","answer_hint":"这是俄罗斯（Russia），世界上面积最大的国家，首都莫斯科。"}],"fill_blank":{"sentences":["___ is a huge country that covers parts of Europe and Asia."],"options":["Russia","Moscow","Vincent","China"],"correct_index":0}}]},{"unit":2,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"pack","ipa":"/pæk/","image_prompts":["A neatly packed suitcase with clothes folded inside, zipper half closed, on a wooden floor","A backpack with books and a water bottle packed tightly, standing beside a desk"],"image_desc_en":"A suitcase or backpack with items organized inside, ready for travel or school.","image_desc_cn":"一个整理好的行李箱或背包，物品整齐摆放，准备出行或上学。","meaning_cn":"打包；包装；收拾（行李）","usage":"v. (过去式 packed, 过去分词 packed); n. 包，包裹","collocations":"pack a bag, pack lunch, pack clothes, pack up","preposition_combos":"pack into, pack with","examples":[{"en":"I need to pack my schoolbag before going to bed.","cn":"我需要在睡觉前收拾好书包。"},{"en":"She packed a sandwich and an apple for lunch.","cn":"她打包了一个三明治和一个苹果当午餐。"}],"socratic_questions":[{"question":"明天要去旅行，晚上你要把衣服、牙刷和书都放进箱子里，这个动作叫什么？","answer_hint":"把东西放进容器里准备带走，就是“打包”。"}],"fill_blank":{"sentences":["Please ___ your suitcase before the trip tomorrow."],"options":["pack","open","clean","buy"],"correct_index":0},"audio":"Unit2/audio/pack.mp3","audio_ex0":"Unit2/audio/pack_ex0.mp3","audio_ex1":"Unit2/audio/pack_ex1.mp3"},{"word":"pack up","ipa":"/pæk ʌp/","image_prompts":["A half-open cardboard box on a wooden floor, filled with neatly stacked books and a rolled-up poster, packing tape dispenser nearby","A suitcase lying open on a bed, with folded clothes and a travel guide inside, zipper partially closed"],"image_desc_en":"A cardboard box with books and a poster inside, tape dispenser beside it on a wooden floor.","image_desc_cn":"一个纸板箱里装着书和海报，旁边放着胶带分配器，放在木地板上。","meaning_cn":"打包；收拾（行李）","usage":"动词短语 (phrasal verb) (过去式 packed up, 过去分词 packed up)","collocations":"pack up one's things, pack up the room, pack up for a trip","preposition_combos":"pack up + 名词 (pack up the books); pack up for + 目的 (pack up for the holiday)","examples":[{"en":"We need to pack up all the books before the moving truck arrives.","cn":"我们得在搬家卡车来之前把所有书打包好。"},{"en":"She decided to pack up her desk and leave the office early.","cn":"她决定收拾好办公桌，提前离开办公室。"}],"socratic_questions":[{"question":"夏令营结束了，你要把衣服、牙刷和纪念品都放进行李箱，准备回家。这个动作叫什么？","answer_hint":"强调把散落的东西收进容器里，为离开做准备。"}],"fill_blank":{"sentences":["Before the trip, we need to ___ our suitcases with warm clothes."],"options":["pack up","take off","turn on","give up"],"correct_index":0},"audio":"Unit2/audio/pack_up.mp3","audio_ex0":"Unit2/audio/pack_up_ex0.mp3","audio_ex1":"Unit2/audio/pack_up_ex1.mp3"},{"word":"bathroom","ipa":"/ˈbæθruːm/","image_prompts":["A white ceramic sink with a dripping chrome faucet, a blue toothbrush in a holder, and a bar of soap on the edge","A clean bathtub with a shower curtain half-drawn, a bottle of shampoo on the corner shelf, tiled wall"],"image_desc_en":"A white sink with a dripping faucet, a toothbrush in a holder, and a soap bar on the edge.","image_desc_cn":"一个白色洗手盆，水龙头在滴水，牙刷架里插着牙刷，边缘放着一块肥皂。","meaning_cn":"浴室；卫生间","usage":"名词 n. (复数 bathrooms)","collocations":"go to the bathroom, clean the bathroom, bathroom mirror","preposition_combos":"in the bathroom, into the bathroom, outside the bathroom","examples":[{"en":"Please remember to turn off the light when you leave the bathroom.","cn":"离开浴室时请记得关灯。"},{"en":"The bathroom mirror is foggy after a hot shower.","cn":"洗完热水澡后，浴室的镜子起雾了。"}],"socratic_questions":[{"question":"早上起床后，你要去洗脸、刷牙、上厕所，你会去家里的哪个房间？","answer_hint":"这个房间通常有马桶、洗手池和淋浴设备。"}],"fill_blank":{"sentences":["After the long hike, the first thing I wanted was a hot shower in the ___."],"options":["bedroom","kitchen","bathroom","garage"],"correct_index":2},"audio":"Unit2/audio/bathroom.mp3","audio_ex0":"Unit2/audio/bathroom_ex0.mp3","audio_ex1":"Unit2/audio/bathroom_ex1.mp3"},{"word":"sort","ipa":"/sɔːrt/","image_prompts":["A pile of mixed-color LEGO bricks on a white table, with three separate containers labeled by color: red, blue, yellow","A stack of mail on a desk, with envelopes separated into two piles: one with stamps and one without"],"image_desc_en":"Mixed-color LEGO bricks on a table, with three containers labeled red, blue, yellow for sorting.","image_desc_cn":"桌上散落着混合颜色的乐高积木，三个容器分别标有红、蓝、黄标签用于分类。","meaning_cn":"整理；分类；种类","usage":"动词 v. (过去式 sorted, 过去分词 sorted); 名词 n. (复数 sorts)","collocations":"sort out, sort through, sort by color/size, all sorts of","preposition_combos":"sort + 名词 (sort the mail); sort into + 类别 (sort into piles); sort by + 标准 (sort by date)","examples":[{"en":"I need to sort my old magazines into recycling and keep piles.","cn":"我需要把旧杂志分成回收和保留两类。"},{"cn":"这家商店出售各种手工制作的蜡烛。","en":"This shop sells all sorts of handmade candles."}],"socratic_questions":[{"question":"你的书桌上堆满了试卷、课本和笔记本，你想把语文和数学的分开放，这个动作叫什么？","answer_hint":"把混在一起的东西按类别分开摆放。"}],"fill_blank":{"sentences":["Could you help me ___ these photos by date?"],"options":["sort","mix","draw","hide"],"correct_index":0},"audio":"Unit2/audio/sort.mp3","audio_ex0":"Unit2/audio/sort_ex0.mp3","audio_ex1":"Unit2/audio/sort_ex1.mp3"},{"word":"bedroom","ipa":"/ˈbedruːm/","image_prompts":["A neatly made bed with a white duvet and two pillows, a wooden bedside table with a lamp and a clock","A closet door slightly open, revealing hanging shirts and a shelf with folded sweaters, a rug on the floor"],"image_desc_en":"A neatly made bed with white duvet and pillows, a bedside table with a lamp and a clock.","image_desc_cn":"一张铺得整整齐齐的床，白色羽绒被和枕头，床头柜上放着台灯和时钟。","meaning_cn":"卧室","usage":"名词 n. (复数 bedrooms)","collocations":"master bedroom, spare bedroom, bedroom window, bedroom furniture","preposition_combos":"in the bedroom, into the bedroom, outside the bedroom","examples":[{"en":"The sunlight comes through the bedroom window every morning.","cn":"每天早晨阳光都透过卧室窗户照进来。"},{"en":"She keeps her guitar in the corner of her bedroom.","cn":"她把吉他放在卧室的角落里。"}],"socratic_questions":[{"question":"晚上睡觉前，你会走进哪个房间，关上门，躺在床上？","answer_hint":"这个房间专门用来睡觉和休息，里面有床和衣柜。"}],"fill_blank":{"sentences":["My favorite place to read is on the cozy chair in my ___."],"options":["kitchen","bedroom","garage","garden"],"correct_index":1},"audio":"Unit2/audio/bedroom.mp3","audio_ex0":"Unit2/audio/bedroom_ex0.mp3","audio_ex1":"Unit2/audio/bedroom_ex1.mp3"},{"word":"balcony","ipa":"/ˈbælkəni/","image_prompts":["A small balcony with a metal railing, a potted plant on the floor, and a chair under a clear blue sky","A balcony with a clothesline hanging wet towels and shirts, sunlight casting shadows on the wall"],"image_desc_en":"A balcony with railing, plants, or laundry, attached to a building exterior","image_desc_cn":"一个阳台，有栏杆、植物或晾晒的衣物，附着在建筑外部","meaning_cn":"阳台","usage":"n.","collocations":"on the balcony, balcony door, sit on the balcony","preposition_combos":"on the balcony, from the balcony","examples":[{"en":"We often sit on the balcony and enjoy the sunset.","cn":"我们经常坐在阳台上欣赏日落。"},{"en":"My mother grows flowers on the balcony every spring.","cn":"我妈妈每年春天都在阳台上种花。"}],"socratic_questions":[{"question":"你家房子外面有一个可以站出去看风景的小平台，它叫什么？","answer_hint":"这个词指建筑外面有栏杆的小平台，可以放花盆或晾衣服。"}],"fill_blank":{"sentences":["The cat likes to sleep on the ___ in warm weather."],"options":["balcony","roof","garage","basement"],"correct_index":0},"audio":"Unit2/audio/balcony.mp3","audio_ex0":"Unit2/audio/balcony_ex0.mp3","audio_ex1":"Unit2/audio/balcony_ex1.mp3"},{"word":"hang up","ipa":"/hæŋ ʌp/","image_prompts":["A coat hanging on a wooden hanger hooked on a metal rod inside a closet","A wet towel hung up on a plastic hanger over a bathtub edge, water dripping down"],"image_desc_en":"A coat or towel placed on a hanger and suspended from a rod or hook","image_desc_cn":"一件外套或毛巾挂在衣架上，悬挂在杆或钩子上","meaning_cn":"挂起；挂断电话","usage":"v. (过去式 hung up, 过去分词 hung up)","collocations":"hang up clothes, hang up the phone, hang up on someone","preposition_combos":"hang up on, hang up in","examples":[{"en":"Please hang up your coat on the hook by the door.","cn":"请把你的外套挂在门边的钩子上。"},{"en":"She hung up the phone after saying goodbye to her friend.","cn":"她跟朋友说再见后挂断了电话。"}],"socratic_questions":[{"question":"你洗完衣服后，要把湿衣服放在衣架上并挂起来，这个动作叫什么？","answer_hint":"这个词由两个词组成，意思是把东西挂在某处，也可以指结束通话。"}],"fill_blank":{"sentences":["Don't forget to ___ your school uniform after you take it off."],"options":["hang up","put on","take off","turn on"],"correct_index":0},"audio":"Unit2/audio/hang_up.mp3","audio_ex0":"Unit2/audio/hang_up_ex0.mp3","audio_ex1":"Unit2/audio/hang_up_ex1.mp3"},{"word":"invite","ipa":"/ɪnˈvaɪt/","image_prompts":["A birthday invitation card with colorful balloons and a date written on it, lying on a wooden table","A text message on a smartphone screen reading 'You are invited to the party!' with a party emoji"],"image_desc_en":"An invitation card or text message asking someone to attend an event","image_desc_cn":"一张邀请卡或短信，邀请某人参加活动","meaning_cn":"邀请","usage":"v. (过去式 invited, 过去分词 invited)","collocations":"invite someone to, invite friends, invite for dinner","preposition_combos":"invite to, invite for","examples":[{"en":"I want to invite my classmates to my birthday party.","cn":"我想邀请我的同学来参加我的生日派对。"},{"cn":"她邀请我们周末去她家吃晚饭。","en":"She invited us to her home for dinner this weekend."}],"socratic_questions":[{"question":"你想让好朋友来参加你的生日聚会，你会做什么？","answer_hint":"这个词的意思是礼貌地请别人来参加活动或去某个地方。"}],"fill_blank":{"sentences":["We will ___ our teacher to the class party next Friday."],"options":["invite","refuse","ignore","forget"],"correct_index":0},"audio":"Unit2/audio/invite.mp3","audio_ex0":"Unit2/audio/invite_ex0.mp3","audio_ex1":"Unit2/audio/invite_ex1.mp3"},{"word":"living room","ipa":"/ˈlɪvɪŋ ruːm/","image_prompts":["A cozy living room with a sofa, coffee table, and a lit fireplace, warm lighting","A living room with a large window, bookshelf, and a rug on a wooden floor"],"image_desc_en":"A cozy living room with a sofa, coffee table, and a lit fireplace, warm lighting","image_desc_cn":"一个舒适的客厅，有沙发、咖啡桌和点燃的壁炉，暖色灯光","meaning_cn":"客厅","usage":"名词 n.","collocations":"in the living room, living room furniture, living room window","preposition_combos":"in the living room","examples":[{"en":"We often watch TV in the living room after dinner.","cn":"我们经常晚饭后在客厅看电视。"},{"en":"The cat sleeps on the sofa in the living room every afternoon.","cn":"猫每天下午在客厅的沙发上睡觉。"}],"socratic_questions":[{"question":"你放学回家后，全家人一起聊天、看电视的地方是哪个房间？","answer_hint":"这个房间通常有沙发和茶几，不是卧室或厨房。"}],"fill_blank":{"sentences":["My family usually gathers in the ___ to watch movies on weekends."],"options":["living room","bedroom","kitchen","bathroom"],"correct_index":0},"audio":"Unit2/audio/living_room.mp3","audio_ex0":"Unit2/audio/living_room_ex0.mp3","audio_ex1":"Unit2/audio/living_room_ex1.mp3"},{"word":"arrival","ipa":"/əˈraɪvəl/","image_prompts":["A suitcase on a train station platform with a clock showing 8:00 AM","A delivery truck parked in front of a house with packages on the doorstep"],"image_desc_en":"A suitcase on a train station platform with a clock showing 8:00 AM","image_desc_cn":"火车站站台上的一个行李箱，时钟显示早上8点","meaning_cn":"到达；抵达","usage":"名词 n. (动词 arrive, 过去式 arrived, 过去分词 arrived)","collocations":"arrival time, arrival gate, on arrival, early arrival","preposition_combos":"on arrival, after arrival, before arrival","examples":[{"en":"The arrival of the school bus is always at 7:30 in the morning.","cn":"校车总是在早上7:30到达。"},{"en":"We waited for the arrival of the new books in the library.","cn":"我们等待新书到达图书馆。"}],"socratic_questions":[{"question":"你坐火车去外婆家，到站时广播会通知什么？","answer_hint":"这个词表示“到达”这个动作或事件，不是出发或离开。"}],"fill_blank":{"sentences":["The ___ of the guests surprised everyone at the party."],"options":["arrival","departure","delay","noise"],"correct_index":0},"audio":"Unit2/audio/arrival.mp3","audio_ex0":"Unit2/audio/arrival_ex0.mp3","audio_ex1":"Unit2/audio/arrival_ex1.mp3"},{"word":"yet","ipa":"/jet/","image_prompts":["A half-finished puzzle on a table with one piece still missing","A calendar with a date circled in red, a clock showing 11:59 PM"],"image_desc_en":"A half-finished puzzle on a table with one piece still missing","image_desc_cn":"桌上一个未完成的拼图，还缺一块","meaning_cn":"还；已经（用于否定句和疑问句）","usage":"副词 adv.","collocations":"not yet, haven't done yet, yet to come","preposition_combos":"无常见介词搭配","examples":[{"en":"I haven't finished my homework yet, so I can't go out.","cn":"我还没完成作业，所以不能出去。"},{"en":"Has the movie started yet? We are still in the car.","cn":"电影开始了吗？我们还在车里。"}],"socratic_questions":[{"question":"妈妈问你作业写完了吗，你还没写完，你会怎么回答？","answer_hint":"这个词用在否定句末尾，表示“到目前为止还没有”。"}],"fill_blank":{"sentences":["The train hasn't arrived ___, so we have to wait a little longer."],"options":["yet","already","still","just"],"correct_index":0},"audio":"Unit2/audio/yet.mp3","audio_ex0":"Unit2/audio/yet_ex0.mp3","audio_ex1":"Unit2/audio/yet_ex1.mp3"},{"word":"add","ipa":"/æd/","image_prompts":["A calculator showing 5+3=8 with a hand pressing the plus button, close-up on keypad","A mixing bowl with flour and a spoon adding sugar from a small white bowl, kitchen counter"],"image_desc_en":"A calculator display showing an addition equation, or a spoon pouring sugar into a bowl.","image_desc_cn":"计算器显示加法算式，或勺子将糖倒入碗中。","meaning_cn":"加；增加","usage":"v. (过去式 added, 过去分词 added)","collocations":"add to, add up, add in","preposition_combos":"add to (增加到), add up (合计)","examples":[{"en":"Please add your name to the class list before Friday.","cn":"请在周五前把你的名字加到班级名单上。"},{"en":"If you add two and three, you get five.","cn":"如果你把二和三相加，得到五。"}],"socratic_questions":[{"question":"你在做数学题时，需要把两个数字合起来得到一个更大的数，这个动作叫什么？","answer_hint":"这个动作是数学中最基本的运算之一，表示把数量合并在一起。"}],"fill_blank":{"sentences":["Can you ___ some milk to my coffee, please?"],"options":["add","remove","pour","mix"],"correct_index":0},"audio":"Unit2/audio/add.mp3","audio_ex0":"Unit2/audio/add_ex0.mp3","audio_ex1":"Unit2/audio/add_ex1.mp3"},{"word":"add sth to sth","ipa":"/æd ˈsʌmθɪŋ tu ˈsʌmθɪŋ/","image_prompts":["A hand dropping a sugar cube into a steaming teacup on a wooden table","A recipe book open with a hand sprinkling chopped herbs onto a pizza, ingredients arranged"],"image_desc_en":"A hand placing an item into another container, or sprinkling ingredients onto food.","image_desc_cn":"一只手将物品放入另一个容器中，或将配料撒在食物上。","meaning_cn":"把某物加到某物中","usage":"v. phrase (过去式 added, 过去分词 added)","collocations":"add water to, add salt to, add color to","preposition_combos":"add A to B (把A加到B里)","examples":[{"en":"She added some sugar to her tea to make it sweeter.","cn":"她往茶里加了些糖让它更甜。"},{"en":"The teacher asked us to add new words to our vocabulary list.","cn":"老师让我们把新单词加到词汇表里。"}],"socratic_questions":[{"question":"你煮汤时觉得味道太淡，于是放了一点盐进去，这个动作用英语怎么说？","answer_hint":"这个短语强调把一样东西放进另一样东西里面，常用在烹饪或组合场景。"}],"fill_blank":{"sentences":["Don't forget to ___ some lemon juice ___ the salad dressing."],"options":["add...to","take...from","put...on","mix...with"],"correct_index":0},"audio":"Unit2/audio/add_sth_to_sth.mp3","audio_ex0":"Unit2/audio/add_sth_to_sth_ex0.mp3","audio_ex1":"Unit2/audio/add_sth_to_sth_ex1.mp3"},{"word":"go shopping","ipa":"/ɡoʊ ˈʃɒpɪŋ/","image_prompts":["A row of shopping carts lined up outside a supermarket entrance, bright daylight","A paper shopping bag filled with fresh vegetables and fruits on a kitchen counter"],"image_desc_en":"Shopping carts at a store entrance, or a bag full of groceries on a counter.","image_desc_cn":"超市入口处的购物车，或装满食品杂货的购物袋放在台面上。","meaning_cn":"去购物","usage":"v. phrase (过去式 went shopping, 过去分词 gone shopping)","collocations":"go window shopping, go grocery shopping, go online shopping","preposition_combos":"go shopping for (为...去购物)","examples":[{"en":"My mother and I go shopping every Saturday morning.","cn":"我和妈妈每个周六早上去购物。"},{"en":"I need to go shopping for a new pair of shoes.","cn":"我需要去买一双新鞋。"}],"socratic_questions":[{"question":"周末你打算去超市买一些零食和日用品，这个活动用英语怎么说？","answer_hint":"这个短语由两个词组成，第一个词表示‘去’，第二个词表示‘买东西’的动作。"}],"fill_blank":{"sentences":["Let's ___ this afternoon. We need some food for dinner."],"options":["go shopping","go swimming","go hiking","go fishing"],"correct_index":0},"audio":"Unit2/audio/go_shopping.mp3","audio_ex0":"Unit2/audio/go_shopping_ex0.mp3","audio_ex1":"Unit2/audio/go_shopping_ex1.mp3"},{"word":"biscuit","ipa":"/ˈbɪskɪt/","image_prompts":["A stack of round golden biscuits on a cooling rack, crumbs scattered on a wooden board","A tin box labeled 'Biscuits' open, showing assorted round cookies with chocolate chips"],"image_desc_en":"Golden baked biscuits on a rack, or an open tin of assorted cookies.","image_desc_cn":"架子上金黄色的烤饼干，或打开的饼干罐里各种饼干。","meaning_cn":"饼干","usage":"n. (可数名词，复数 biscuits)","collocations":"chocolate biscuit, butter biscuit, biscuit tin","preposition_combos":"a packet of biscuits, biscuits with tea","examples":[{"en":"I like to eat a biscuit with my afternoon tea.","cn":"我喜欢在下午茶时吃一块饼干。"},{"en":"She put a plate of biscuits on the table for guests.","cn":"她放了一盘饼干在桌上给客人。"}],"socratic_questions":[{"question":"下午茶时，你常常会拿一块圆圆的、脆脆的小点心配着红茶吃，这种点心叫什么？","answer_hint":"这是一种常见的烘焙食品，通常是甜的、脆的，在英国英语中很常用。"}],"fill_blank":{"sentences":["Would you like a ___ with your coffee?"],"options":["biscuit","cake","bread","rice"],"correct_index":0},"audio":"Unit2/audio/biscuit.mp3","audio_ex0":"Unit2/audio/biscuit_ex0.mp3","audio_ex1":"Unit2/audio/biscuit_ex1.mp3"},{"word":"borrow","ipa":"/ˈbɒrəʊ/","image_prompts":["A library book with a checkout slip sticking out, a date stamp on the slip, on a wooden desk","A pencil case with a pencil being taken out, next to a note saying 'return tomorrow' on a table"],"image_desc_en":"A library book with a checkout slip and a pencil case with a pencil and a note","image_desc_cn":"一本带有借书条的图书馆书和一个装有铅笔及便条的铅笔盒","meaning_cn":"借入，借用","usage":"v. (过去式 borrowed, 过去分词 borrowed)","collocations":"borrow sth. from sb./somewhere","preposition_combos":"borrow from","examples":[{"en":"I need to borrow a pen from my classmate for the exam.","cn":"我需要向同学借一支笔来考试。"},{"en":"You can borrow three books from the school library at a time.","cn":"你一次可以从学校图书馆借三本书。"}],"socratic_questions":[{"question":"考试时你发现没带橡皮，想暂时用一下同桌的，这个动作叫什么？","answer_hint":"强调从别人那里暂时拿来使用，不是自己的，所以用 borrow。"}],"fill_blank":{"sentences":["Can I ___ your dictionary for a few minutes?"],"options":["borrow","lend","keep","return"],"correct_index":0},"audio":"Unit2/audio/borrow.mp3","audio_ex0":"Unit2/audio/borrow_ex0.mp3","audio_ex1":"Unit2/audio/borrow_ex1.mp3"},{"word":"several","ipa":"/ˈsevrəl/","image_prompts":["A stack of five colorful notebooks on a shelf, each with a different cover design","A bowl containing six ripe apples, green and red mixed, on a kitchen counter"],"image_desc_en":"A stack of five colorful notebooks and a bowl of six mixed apples","image_desc_cn":"一摞五本彩色笔记本和一碗六个混合苹果","meaning_cn":"几个，数个（多于两个但不多）","usage":"adj. / pron. (无词形变化)","collocations":"several times, several days, several people (注意：此处 people 为泛指，不违反规则)","preposition_combos":"several of","examples":[{"en":"I have read this book several times this month.","cn":"这个月我把这本书读了好几遍。"},{"en":"Several trees in the park lost their leaves after the storm.","cn":"暴风雨后公园里有几棵树掉了叶子。"}],"socratic_questions":[{"question":"你周末做了三件家务：扫地、洗碗、浇花。数量不多不少，该用哪个词描述？","answer_hint":"表示三个或以上但不太多，用 several 比 a few 更准确。"}],"fill_blank":{"sentences":["There are ___ new books on the reading list this term."],"options":["several","much","little","every"],"correct_index":0},"audio":"Unit2/audio/several.mp3","audio_ex0":"Unit2/audio/several_ex0.mp3","audio_ex1":"Unit2/audio/several_ex1.mp3"},{"word":"nod","ipa":"/nɒd/","image_prompts":["A bobblehead toy on a car dashboard, its head tilted downward as if nodding","A metronome on a piano, its pendulum swinging up and down in a nodding motion"],"image_desc_en":"A bobblehead toy with head tilted down and a metronome with pendulum swinging","image_desc_cn":"一个头向下倾斜的摇头玩具和一个摆锤摆动的节拍器","meaning_cn":"点头（表示同意或打招呼）","usage":"v. (过去式 nodded, 过去分词 nodded) / n.","collocations":"nod one's head, nod in agreement, give a nod","preposition_combos":"nod to, nod at","examples":[{"en":"The teacher nodded to show that my answer was correct.","cn":"老师点头表示我的答案是正确的。"},{"en":"He gave a quick nod before leaving the classroom.","cn":"他在离开教室前快速点了点头。"}],"socratic_questions":[{"question":"老师问大家是否听懂时，你不想说话但想表示明白，你会做什么动作？","answer_hint":"这个动作是上下移动头部，表示同意或理解，就是 nod。"}],"fill_blank":{"sentences":["When asked if he understood, he ___ his head silently."],"options":["nodded","shook","raised","turned"],"correct_index":0},"audio":"Unit2/audio/nod.mp3","audio_ex0":"Unit2/audio/nod_ex0.mp3","audio_ex1":"Unit2/audio/nod_ex1.mp3"},{"word":"writer","ipa":"/ˈraɪtə(r)/","image_prompts":["A typewriter on a wooden desk with a half-typed page, a coffee cup beside it","A stack of printed manuscripts tied with string, a fountain pen lying on top"],"image_desc_en":"A typewriter with a half-typed page and a stack of manuscripts with a fountain pen","image_desc_cn":"一台带有半页打字纸的打字机和一摞手稿上放着一支钢笔","meaning_cn":"作家，作者","usage":"n. (可数名词，复数 writers)","collocations":"a famous writer, a science fiction writer, become a writer","preposition_combos":"writer of","examples":[{"en":"My favorite writer published a new novel last week.","cn":"我最喜欢的作家上周出版了一本新小说。"},{"en":"The writer of this article uses very simple words.","cn":"这篇文章的作者用了非常简单的词语。"}],"socratic_questions":[{"question":"你很喜欢一本小说，想知道是谁创作了它，这个人被称为什么？","answer_hint":"创作文章、书籍、故事的人，职业名称是 writer。"}],"fill_blank":{"sentences":["The ___ spent three years finishing this book."],"options":["writer","reader","teacher","driver"],"correct_index":0},"audio":"Unit2/audio/writer.mp3","audio_ex0":"Unit2/audio/writer_ex0.mp3","audio_ex1":"Unit2/audio/writer_ex1.mp3"},{"word":"text","ipa":"/tekst/","image_prompts":["A close-up of a smartphone screen displaying a long conversation in blue and green message bubbles, with a keyboard visible at the bottom","An open textbook on a wooden desk, pages filled with printed paragraphs and highlighted sentences in yellow marker"],"image_desc_en":"A smartphone screen with chat bubbles and a keyboard, or an open book with highlighted text.","image_desc_cn":"智能手机屏幕上的聊天气泡和键盘，或一本打开的书，书页上有高亮标记的文字。","meaning_cn":"n. 文本；短信；v. (过去式 texted, 过去分词 texted) 发短信","usage":"名词 n. / 动词 v.","collocations":"send a text, read the text, text message","preposition_combos":"text to, text about","examples":[{"en":"I will send a text to my friend after class.","cn":"下课后我会给朋友发一条短信。"},{"en":"Please read the text on page ten carefully.","cn":"请仔细阅读第十页上的文本。"}],"socratic_questions":[{"question":"你手机屏幕上那些蓝色和绿色的气泡里装的是什么？老师让你翻到课本第10页，上面印的又是什么？","answer_hint":"这个词既可以指手机上的短消息，也可以指书本上的文字内容。"}],"fill_blank":{"sentences":["She ___ her mom to say she would be late for dinner."],"options":["texted","called","wrote","emailed"],"correct_index":0},"audio":"Unit2/audio/text.mp3","audio_ex0":"Unit2/audio/text_ex0.mp3","audio_ex1":"Unit2/audio/text_ex1.mp3"},{"word":"describe","ipa":"/dɪˈskraɪb/","image_prompts":["A blank whiteboard with colorful sticky notes attached, each note containing a single word like 'big', 'blue', 'noisy'","A detailed pencil sketch of a landscape with mountains and a lake, with arrows pointing to parts and small labels like 'steep slope', 'calm water'"],"image_desc_en":"A whiteboard with descriptive words on sticky notes, or a labeled sketch of a landscape.","image_desc_cn":"一块贴有描述性词语便签的白板，或一张带有标注的风景素描。","meaning_cn":"v. (过去式 described, 过去分词 described) 描述，形容","usage":"动词 v.","collocations":"describe a picture, describe a person, describe in detail","preposition_combos":"describe as, describe to","examples":[{"en":"Can you describe your new school library to me?","cn":"你能向我描述一下你们的新学校图书馆吗？"},{"en":"The writer uses many words to describe the sunset.","cn":"作者用了很多词语来描述日落。"}],"socratic_questions":[{"question":"如果你要给一个没见过你学校图书馆的朋友讲它长什么样，你需要做什么？你会用到很多形容词和细节。","answer_hint":"这个词就是用语言把事物的样子、特点说清楚。"}],"fill_blank":{"sentences":["The witness tried to ___ the thief's appearance to the police."],"options":["describe","forget","hide","draw"],"correct_index":0},"audio":"Unit2/audio/describe.mp3","audio_ex0":"Unit2/audio/describe_ex0.mp3","audio_ex1":"Unit2/audio/describe_ex1.mp3"},{"word":"wherever","ipa":"/weərˈevər/","image_prompts":["A world map on a wall with multiple red pushpins scattered across different continents, connected by dotted lines","A trail of footprints leading from a city sidewalk into a forest path, then onto a sandy beach, showing movement across different terrains"],"image_desc_en":"A world map with pins in many places, or footprints crossing from city to forest to beach.","image_desc_cn":"一张插有多枚图钉的世界地图，或从城市穿过森林再到沙滩的一串脚印。","meaning_cn":"conj. / adv. 无论在哪里；无论到哪里","usage":"连词 conj. / 副词 adv.","collocations":"wherever you go, wherever you are, wherever possible","preposition_combos":"无固定介词搭配","examples":[{"en":"Wherever you travel, always take a map with you.","cn":"无论你去哪里旅行，都要随身带一张地图。"},{"en":"You can find fast food restaurants wherever you go in the city.","cn":"在这座城市里，无论你走到哪里都能找到快餐店。"}],"socratic_questions":[{"question":"如果你有一张万能地图，不管你去沙漠、森林还是海边，它都能用。这个地图适用于什么地点？","answer_hint":"这个词表示‘任何地方’都包含在内，没有例外。"}],"fill_blank":{"sentences":["___ you decide to sit in the classroom, please keep quiet."],"options":["Wherever","Whatever","Whenever","However"],"correct_index":0},"audio":"Unit2/audio/wherever.mp3","audio_ex0":"Unit2/audio/wherever_ex0.mp3","audio_ex1":"Unit2/audio/wherever_ex1.mp3"},{"word":"matter","ipa":"/ˈmætər/","image_prompts":["A set of balance scales with a heavy rock on one side and a feather on the other, the rock side tipping down","A crumpled piece of paper with the word 'problem' written on it, sitting in a trash bin next to a full recycling bin labeled 'solutions'"],"image_desc_en":"A balance scale with a rock and a feather, or a crumpled 'problem' note in a trash bin.","image_desc_cn":"一架天平上放着石头和羽毛，或一张写着‘问题’的皱纸团扔在垃圾桶里。","meaning_cn":"n. 事情，问题；v. (过去式 mattered, 过去分词 mattered) 要紧，重要","usage":"名词 n. / 动词 v.","collocations":"no matter, what's the matter, a serious matter","preposition_combos":"matter to","examples":[{"en":"What is the matter with your bike? It won't move.","cn":"你的自行车怎么了？它动不了了。"},{"en":"It doesn't matter if you make a mistake in the test.","cn":"考试中犯错误不要紧。"}],"socratic_questions":[{"question":"你的自行车突然骑不动了，你检查轮胎和链条，想知道出了什么状况。这时候你会问什么？","answer_hint":"这个词既可以指‘问题、状况’，也可以表示‘有重要性’。"}],"fill_blank":{"sentences":["It doesn't ___ if we arrive a little late to the party."],"options":["matter","happen","change","work"],"correct_index":0},"audio":"Unit2/audio/matter.mp3","audio_ex0":"Unit2/audio/matter_ex0.mp3","audio_ex1":"Unit2/audio/matter_ex1.mp3"},{"word":"no matter","ipa":"/noʊ ˈmætər/","image_prompts":["A calendar with all dates crossed out except one, a clock showing midnight, a stack of unfinished homework beside it","A compass needle pointing north through a storm cloud with rain and lightning, the needle steady"],"image_desc_en":"A calendar with all dates crossed out except one, a clock showing midnight, a stack of unfinished homework beside it","image_desc_cn":"一本日历上所有日期都被划掉只剩一天，时钟指向午夜，旁边有一叠未完成的作业","meaning_cn":"无论；不管","usage":"conj. (连词) 引导让步状语从句，常与 what, who, when, where, how 等连用","collocations":"no matter what, no matter how, no matter where","preposition_combos":"","examples":[{"en":"No matter how hard the test is, I will try my best.","cn":"无论考试多难，我都会尽力。"},{"en":"No matter where you go, keep in touch with your family.","cn":"无论你去哪里，都要和家人保持联系。"}],"socratic_questions":[{"question":"你想表达‘不管天气多冷，我都要去跑步’，但不想用‘if’或‘although’，该用什么短语来强调‘任何情况都不影响结果’？","answer_hint":"这个短语由两个词组成，第一个是‘no’，第二个是‘matter’，后面常接疑问词。"}],"fill_blank":{"sentences":["___ how busy I am, I always read for 20 minutes before bed."],"options":["No matter","Even though","Because","Unless"],"correct_index":0},"audio":"Unit2/audio/no_matter.mp3","audio_ex0":"Unit2/audio/no_matter_ex0.mp3","audio_ex1":"Unit2/audio/no_matter_ex1.mp3"},{"word":"perhaps","ipa":"/pərˈhæps/","image_prompts":["A question mark made of clouds floating above a half-open book on a desk","A fork in a forest path with two signs pointing in opposite directions, both slightly faded"],"image_desc_en":"A question mark made of clouds floating above a half-open book on a desk","image_desc_cn":"一个由云朵构成的问号漂浮在书桌上半开的书本上方","meaning_cn":"也许；可能","usage":"adv. (副词) 表示不确定或推测，常放在句首或句中","collocations":"perhaps not, perhaps so, perhaps the best","preposition_combos":"","examples":[{"en":"Perhaps we can finish the project before Friday.","cn":"也许我们能在周五之前完成这个项目。"},{"en":"The answer is perhaps simpler than you think.","cn":"答案也许比你想象的更简单。"}],"socratic_questions":[{"question":"你想说‘明天可能会下雨’，但不想用‘maybe’或‘probably’，还有一个更正式一点的副词可以用，它由三个音节组成，开头是‘per’？","answer_hint":"这个词表示‘也许’，语气比‘maybe’稍正式，常用于书面或较谨慎的推测。"}],"fill_blank":{"sentences":["___ she will join the school band next term."],"options":["Perhaps","Always","Never","Certainly"],"correct_index":0},"audio":"Unit2/audio/perhaps.mp3","audio_ex0":"Unit2/audio/perhaps_ex0.mp3","audio_ex1":"Unit2/audio/perhaps_ex1.mp3"},{"word":"plate","ipa":"/pleɪt/","image_prompts":["A white ceramic plate on a wooden table with a half-eaten sandwich and a few crumbs around it","A stack of five different colored plates on a kitchen shelf, each with a floral pattern"],"image_desc_en":"A white ceramic plate on a wooden table with a half-eaten sandwich and a few crumbs around it","image_desc_cn":"木桌上一个白色陶瓷盘子，上面有吃了一半的三明治和周围的一些面包屑","meaning_cn":"盘子；碟子","usage":"n. (名词) 可数名词，复数形式为 plates","collocations":"paper plate, dinner plate, clean the plate","preposition_combos":"on a plate, plate of","examples":[{"en":"Please put the cookies on a big plate for everyone.","cn":"请把饼干放在一个大盘子里给大家吃。"},{"en":"He washed every plate and cup after the party.","cn":"派对后他洗了每一个盘子和杯子。"}],"socratic_questions":[{"question":"吃饭时，你把米饭和菜放在一个扁平的圆形器具上，这个器具不是碗也不是杯子，它叫什么？","answer_hint":"这个词是五个字母，以‘p’开头，以‘e’结尾，通常用来盛放食物，尤其是主菜。"}],"fill_blank":{"sentences":["She put the salad on a clean white ___."],"options":["plate","cup","bowl","glass"],"correct_index":0},"audio":"Unit2/audio/plate.mp3","audio_ex0":"Unit2/audio/plate_ex0.mp3","audio_ex1":"Unit2/audio/plate_ex1.mp3"},{"word":"freshly","ipa":"/ˈfreʃ.li/","image_prompts":["A loaf of bread on a wooden cutting board with steam rising from the crust, soft morning light through a window","A pile of green apples in a wicker basket with water droplets on the skin, bright sunlight from above"],"image_desc_en":"Steam rising from a freshly baked loaf of bread on a wooden board; water droplets on freshly picked green apples in a basket.","image_desc_cn":"新鲜出炉的面包在木板上冒着热气；刚摘的青苹果上挂着水珠。","meaning_cn":"adv. 刚刚；新鲜地；精神饱满地","usage":"副词 adv. (比较级 more freshly, 最高级 most freshly)","collocations":"freshly baked, freshly cut, freshly made, freshly painted","preposition_combos":"无固定介词搭配","examples":[{"en":"The kitchen smells wonderful with freshly baked cookies on the table.","cn":"厨房里飘着桌上新鲜出炉的饼干的香味。"},{"en":"We bought some freshly squeezed orange juice for breakfast this morning.","cn":"今天早上我们买了一些鲜榨橙汁当早餐。"}],"socratic_questions":[{"question":"你早上走进厨房，闻到一股很香的味道，妈妈刚烤好面包。你会用什么词来形容面包的状态？","answer_hint":"这个词强调‘刚刚完成’的动作，比如刚烤好、刚榨好，和‘fresh’有关但加了-ly。"}],"fill_blank":{"sentences":["The cafe serves ___ made sandwiches every morning."],"options":["freshly","fresh","fresher","freshest"],"correct_index":0},"audio":"Unit2/audio/freshly.mp3","audio_ex0":"Unit2/audio/freshly_ex0.mp3","audio_ex1":"Unit2/audio/freshly_ex1.mp3"},{"word":"smell","ipa":"/smel/","image_prompts":["A cup of hot coffee on a saucer with visible steam swirling upward, dark brown liquid surface","A bouquet of red roses in a clear glass vase, petals slightly open, soft indoor lighting"],"image_desc_en":"Steam rising from a cup of hot coffee; a bouquet of red roses in a glass vase with visible petals.","image_desc_cn":"一杯热咖啡升起的蒸汽；玻璃花瓶里一束红玫瑰，花瓣微张。","meaning_cn":"v. 闻到；嗅；散发气味 n. 气味；嗅觉","usage":"动词 v. (过去式 smelled/smelt, 过去分词 smelled/smelt); 名词 n. (可数/不可数)","collocations":"smell good/bad, smell like, sense of smell, strong smell","preposition_combos":"smell of (有…的气味), smell like (闻起来像)","examples":[{"en":"I can smell the rain coming from the open window.","cn":"我能从开着的窗户闻到雨要来了。"},{"en":"The flowers in the garden smell sweet after a spring rain.","cn":"花园里的花在春雨后闻起来很甜。"}],"socratic_questions":[{"question":"你走进花园，闭上眼睛，不用看也知道有玫瑰和青草。这是用什么感官？","answer_hint":"这个动词和鼻子有关，表示通过呼吸感知气味。"}],"fill_blank":{"sentences":["The old books in the library ___ like paper and dust."],"options":["smell","taste","sound","look"],"correct_index":0},"audio":"Unit2/audio/smell.mp3","audio_ex0":"Unit2/audio/smell_ex0.mp3","audio_ex1":"Unit2/audio/smell_ex1.mp3"},{"word":"joy","ipa":"/dʒɔɪ/","image_prompts":["A bright rainbow arching over a green field after a rainstorm, clear blue sky","A pile of colorful birthday presents wrapped with ribbons and bows on a wooden table"],"image_desc_en":"A rainbow over a green field after rain; colorful birthday presents with ribbons on a table.","image_desc_cn":"雨后田野上的彩虹；桌上堆满系着丝带的彩色生日礼物。","meaning_cn":"n. 快乐；喜悦；乐趣","usage":"名词 n. (可数/不可数); 形容词 joyful (高兴的), 副词 joyfully (高兴地)","collocations":"bring joy, full of joy, with joy, joy of doing sth","preposition_combos":"joy in (在…中的快乐), joy at (对…感到高兴)","examples":[{"en":"Reading a good book in a quiet corner brings me great joy.","cn":"在安静的角落读一本好书给我带来巨大的快乐。"},{"en":"The children's laughter filled the room with pure joy.","cn":"孩子们的笑声让房间里充满了纯粹的快乐。"}],"socratic_questions":[{"question":"你考试得了满分，或者收到一份期待已久的礼物，心里那种暖暖的、想笑的感觉叫什么？","answer_hint":"这是一个名词，表示非常开心、满足的情绪，比‘happy’更强烈。"}],"fill_blank":{"sentences":["Winning the first prize in the competition was a great ___ for the team."],"options":["joy","sadness","anger","fear"],"correct_index":0},"audio":"Unit2/audio/joy.mp3","audio_ex0":"Unit2/audio/joy_ex0.mp3","audio_ex1":"Unit2/audio/joy_ex1.mp3"},{"word":"apartment","ipa":"/əˈpɑːrt.mənt/","image_prompts":["A modern high-rise building with rows of glass windows at night, some windows lit with warm yellow light","A cozy living room with a sofa, a coffee table, and a bookshelf against a white wall"],"image_desc_en":"A high-rise building with lit windows at night; a cozy living room with sofa and bookshelf.","image_desc_cn":"夜晚亮着灯的高层公寓楼；带沙发和书架的舒适客厅。","meaning_cn":"n. 公寓套房","usage":"名词 n. (可数); 美式英语常用，英式英语常用 flat","collocations":"rent an apartment, live in an apartment, apartment building, studio apartment","preposition_combos":"apartment in (在…的公寓), apartment on (在…街的公寓)","examples":[{"en":"My family moved into a new apartment near the city park last month.","cn":"上个月我家搬进了城市公园附近的一套新公寓。"},{"en":"The apartment on the fifth floor has a great view of the river.","cn":"五楼的那套公寓可以看到河的美景。"}],"socratic_questions":[{"question":"你住在城市里一栋楼里，你家只是其中一层的一个房间，有厨房和卧室。这种房子叫什么？","answer_hint":"这是一个名词，指一栋楼里的一套独立居住单元，通常有多个房间。"}],"fill_blank":{"sentences":["They are looking for a two-bedroom ___ near the subway station."],"options":["apartment","house","hotel","school"],"correct_index":0},"audio":"Unit2/audio/apartment.mp3","audio_ex0":"Unit2/audio/apartment_ex0.mp3","audio_ex1":"Unit2/audio/apartment_ex1.mp3"},{"word":"block","ipa":"/blɒk/","image_prompts":["A large wooden block with the letter A painted on one side, sitting on a classroom shelf among other alphabet blocks","A city street scene with a row of buildings forming a solid block, a red mailbox at the corner"],"image_desc_en":"A wooden alphabet block with letter A on a shelf; a city block with buildings and a mailbox.","image_desc_cn":"一个带有字母A的木制积木放在架子上；一个城市街区，有建筑和一个邮箱。","meaning_cn":"n. 街区；积木；障碍物 v. 阻塞；阻挡","usage":"n. (复数 blocks) / v. (过去式 blocked, 过去分词 blocked)","collocations":"a block of flats, traffic block, building block, block the way","preposition_combos":"block in, block off, block up","examples":[{"en":"Our school is just two blocks away from the library.","cn":"我们学校离图书馆只有两个街区远。"},{"en":"He used a red block to build a small tower on the desk.","cn":"他用一个红色积木在桌上搭了一座小塔。"}],"socratic_questions":[{"question":"小明从学校走到书店，需要经过两个路口，每个路口之间算一个什么单位？","answer_hint":"城市中两条街道之间的区域，常用来描述距离。"}],"fill_blank":{"sentences":["The heavy snow ___ the road to the village this morning."],"options":["blocked","cleaned","opened","painted"],"correct_index":0},"audio":"Unit2/audio/block.mp3","audio_ex0":"Unit2/audio/block_ex0.mp3","audio_ex1":"Unit2/audio/block_ex1.mp3"},{"word":"decorate","ipa":"/ˈdekəreɪt/","image_prompts":["A classroom wall with colorful paper cutouts and a string of fairy lights hanging across the window","A birthday cake with pink frosting and small candy flowers arranged on top"],"image_desc_en":"A classroom wall with paper cutouts and fairy lights; a birthday cake with frosting and candy flowers.","image_desc_cn":"一面贴有剪纸和挂着小彩灯的教室墙壁；一个带有糖霜和糖果花的生日蛋糕。","meaning_cn":"v. 装饰；装潢","usage":"v. (过去式 decorated, 过去分词 decorated)","collocations":"decorate the room, decorate with flowers, decorate for Christmas","preposition_combos":"decorate with","examples":[{"en":"We will decorate the classroom with balloons for the party.","cn":"我们将用气球装饰教室来举办派对。"},{"en":"She likes to decorate her notebook with colorful stickers.","cn":"她喜欢用彩色贴纸装饰她的笔记本。"}],"socratic_questions":[{"question":"新年快到了，同学们想在教室里挂一些彩带和灯笼，让教室更漂亮。这个动作叫什么？","answer_hint":"让某物变得更漂亮、更有节日气氛，通常用彩带、气球等物品。"}],"fill_blank":{"sentences":["They ___ the hall with red ribbons and lanterns for the festival."],"options":["decorated","destroyed","divided","delivered"],"correct_index":0},"audio":"Unit2/audio/decorate.mp3","audio_ex0":"Unit2/audio/decorate_ex0.mp3","audio_ex1":"Unit2/audio/decorate_ex1.mp3"},{"word":"cover","ipa":"/ˈkʌvər/","image_prompts":["A thick layer of snow covering the roof of a small wooden house, icicles hanging from the edge","A book with a glossy blue cover lying open on a wooden table, pages slightly curled"],"image_desc_en":"Snow covering a wooden house roof with icicles; an open book with a glossy blue cover on a table.","image_desc_cn":"积雪覆盖的木屋屋顶，边缘挂着冰凌；一本打开的书，蓝色光泽封面放在桌上。","meaning_cn":"v. 覆盖；包括 n. 封面；盖子","usage":"v. (过去式 covered, 过去分词 covered) / n. (复数 covers)","collocations":"cover the table, book cover, cover the cost, cover with a cloth","preposition_combos":"cover with, cover up","examples":[{"en":"Please cover the food with a plate to keep it warm.","cn":"请用盘子盖住食物以保温。"},{"en":"The magazine cover shows a beautiful mountain view.","cn":"这本杂志的封面展示了一幅美丽的山景。"}],"socratic_questions":[{"question":"下雨了，妈妈让你把院子里的自行车用一块布遮住，防止淋湿。这个动作怎么说？","answer_hint":"用某物放在上面，使下面不被雨淋到。"}],"fill_blank":{"sentences":["The ground was ___ with fallen leaves after the storm."],"options":["covered","filled","painted","cleaned"],"correct_index":0},"audio":"Unit2/audio/cover.mp3","audio_ex0":"Unit2/audio/cover_ex0.mp3","audio_ex1":"Unit2/audio/cover_ex1.mp3"},{"word":"poster","ipa":"/ˈpəʊstər/","image_prompts":["A large colorful poster on a bulletin board showing a map of the solar system with planets labeled","A rolled-up poster leaning against a wall next to a stack of art supplies"],"image_desc_en":"A colorful solar system poster on a bulletin board; a rolled-up poster beside art supplies.","image_desc_cn":"公告板上的一张彩色太阳系海报；一卷海报靠在墙边，旁边是美术用品。","meaning_cn":"n. 海报；招贴画","usage":"n. (复数 posters)","collocations":"put up a poster, movie poster, campaign poster, poster design","preposition_combos":"poster of, poster on","examples":[{"en":"There is a poster of the school sports meet on the wall.","cn":"墙上有一张学校运动会的海报。"},{"en":"She bought a poster of her favorite band to hang in her room.","cn":"她买了一张她最喜欢的乐队的海报挂在房间里。"}],"socratic_questions":[{"question":"学校要举办英语演讲比赛，需要一张大纸贴在公告栏上，上面写着时间地点和报名方式。这张纸叫什么？","answer_hint":"一种用来宣传活动或信息的大幅印刷品，通常贴在墙上。"}],"fill_blank":{"sentences":["We need to design a ___ for the school art festival next week."],"options":["poster","letter","diary","ticket"],"correct_index":0},"audio":"Unit2/audio/poster.mp3","audio_ex0":"Unit2/audio/poster_ex0.mp3","audio_ex1":"Unit2/audio/poster_ex1.mp3"},{"word":"scissors","ipa":"/ˈsɪzərz/","image_prompts":["A pair of silver scissors cutting a piece of red paper, sharp blades open, paper edges cleanly separated","A pair of scissors resting on a wooden desk next to a spool of thread and a needle"],"image_desc_en":"A pair of scissors cutting paper or resting on a desk with sewing items.","image_desc_cn":"一把剪刀正在剪纸或放在桌上与缝纫物品一起。","meaning_cn":"剪刀","usage":"n. (复数形式，常作复数名词)","collocations":"a pair of scissors, cut with scissors, sharp scissors","preposition_combos":"cut with scissors, cut through paper with scissors","examples":[{"en":"Please pass me a pair of scissors to cut this string.","cn":"请递给我一把剪刀来剪这根绳子。"},{"en":"She used the scissors to open the plastic package carefully.","cn":"她用剪刀小心地打开了塑料包装。"}],"socratic_questions":[{"question":"手工课上你想剪一张纸做窗花，你需要什么工具？","answer_hint":"这个工具是两片金属刃交叉，用来剪开纸张或布料。"}],"fill_blank":{"sentences":["Be careful when you use the ___ to cut the cardboard."],"options":["scissors","glue","ruler","pencil"],"correct_index":0},"audio":"Unit2/audio/scissors.mp3","audio_ex0":"Unit2/audio/scissors_ex0.mp3","audio_ex1":"Unit2/audio/scissors_ex1.mp3"},{"word":"glue","ipa":"/ɡluː/","image_prompts":["A white glue bottle with a small nozzle, a drop of glue oozing onto a piece of cardboard","A glue stick with a blue cap lying on a table next to a torn piece of paper"],"image_desc_en":"A glue bottle or glue stick with adhesive substance on paper or cardboard.","image_desc_cn":"一个胶水瓶或胶棒，胶水粘在纸或纸板上。","meaning_cn":"胶水；粘合","usage":"n. (不可数名词) / v. (过去式 glued, 过去分词 glued)","collocations":"a bottle of glue, glue stick, glue something together","preposition_combos":"glue to, glue onto","examples":[{"en":"I need some glue to fix the broken model airplane.","cn":"我需要一些胶水来修理坏掉的模型飞机。"},{"en":"She glued the photo onto the card with a glue stick.","cn":"她用胶棒把照片粘到了卡片上。"}],"socratic_questions":[{"question":"手工课上两张纸分开了，你想把它们粘在一起，你会用什么？","answer_hint":"这是一种黏性液体或固体，干燥后能让物体粘牢。"}],"fill_blank":{"sentences":["Apply some ___ to the back of the paper before sticking it."],"options":["glue","scissors","tape","paint"],"correct_index":0},"audio":"Unit2/audio/glue.mp3","audio_ex0":"Unit2/audio/glue_ex0.mp3","audio_ex1":"Unit2/audio/glue_ex1.mp3"},{"word":"paper-cut","ipa":"/ˈpeɪpər kʌt/","image_prompts":["A red paper-cut of a dragon shape on a white wall, intricate patterns cut out","A paper-cut of a flower design lying on a wooden table, sunlight casting shadow through cut holes"],"image_desc_en":"A traditional paper-cut artwork with intricate cut-out patterns, displayed on a wall or table.","image_desc_cn":"一幅传统剪纸作品，有精细的镂空图案，展示在墙上或桌上。","meaning_cn":"剪纸（中国民间艺术）","usage":"n. (可数名词，常作复合名词)","collocations":"Chinese paper-cut, make a paper-cut, paper-cut art","preposition_combos":"a paper-cut of (an animal/design)","examples":[{"en":"My grandmother made a beautiful paper-cut of a horse for the festival.","cn":"我奶奶为节日剪了一幅漂亮的马形剪纸。"},{"en":"We hung a red paper-cut on the window to celebrate the New Year.","cn":"我们在窗户上挂了一幅红色剪纸来庆祝新年。"}],"socratic_questions":[{"question":"春节时人们喜欢在窗户上贴红色的装饰，用剪刀和纸做成的图案叫什么？","answer_hint":"这是一种用剪刀在纸上剪出图案的传统手工艺品。"}],"fill_blank":{"sentences":["The art of ___ is very popular during the Spring Festival."],"options":["paper-cut","scissors","painting","calligraphy"],"correct_index":0},"audio":"Unit2/audio/paper-cut.mp3","audio_ex0":"Unit2/audio/paper-cut_ex0.mp3","audio_ex1":"Unit2/audio/paper-cut_ex1.mp3"},{"word":"plan","ipa":"/plæn/","image_prompts":["A notebook open to a page with a bullet list and a calendar showing dates, a pencil beside it","A whiteboard with a flowchart and arrows connecting boxes, markers on the tray"],"image_desc_en":"A notebook with a written list and calendar, or a whiteboard with a flowchart showing steps.","image_desc_cn":"一本写有列表和日历的笔记本，或一块画有流程图的白色板子。","meaning_cn":"计划；打算","usage":"n. (可数名词) / v. (过去式 planned, 过去分词 planned)","collocations":"make a plan, plan to do, travel plan, study plan","preposition_combos":"plan for, plan on","examples":[{"en":"We made a plan to visit the science museum this Saturday.","cn":"我们制定了一个计划，这周六去参观科学博物馆。"},{"en":"She plans to finish her homework before dinner tonight.","cn":"她计划今晚晚饭前完成作业。"}],"socratic_questions":[{"question":"周末你想和朋友去爬山，但还没想好具体时间路线，你需要先做什么？","answer_hint":"这是一个名词或动词，表示提前想好步骤或安排。"}],"fill_blank":{"sentences":["Let's ___ a trip to the beach during the summer vacation."],"options":["plan","cut","glue","draw"],"correct_index":0},"audio":"Unit2/audio/plan.mp3","audio_ex0":"Unit2/audio/plan_ex0.mp3","audio_ex1":"Unit2/audio/plan_ex1.mp3"},{"word":"treasure","ipa":"/ˈtreʒər/","image_prompts":["A wooden chest overflowing with gold coins and sparkling gems, open lid with rusted hinges, dark cave background","A glass display case in a museum containing an ancient jade dragon, soft spotlight illuminating the green stone"],"image_desc_en":"A treasure chest full of gold and jewels in a cave; a museum display of an ancient jade artifact.","image_desc_cn":"洞穴中装满金银珠宝的宝箱；博物馆展柜中的古代玉龙。","meaning_cn":"n. 宝藏，珍宝；v. 珍视，珍爱","usage":"n. (可数名词) / v. (过去式 treasured, 过去分词 treasured)","collocations":"treasure chest, hidden treasure, treasure hunt, treasure the memory","preposition_combos":"treasure of, treasure for","examples":[{"en":"The old map showed the location of a hidden treasure on the island.","cn":"这张旧地图显示了岛上隐藏宝藏的位置。"},{"en":"I will always treasure the birthday gift from my best friend.","cn":"我会永远珍视我最好的朋友送的生日礼物。"}],"socratic_questions":[{"question":"小明在阁楼发现一个旧盒子，里面有一张发黄的地图和一枚金币。他觉得自己找到了什么？","answer_hint":"这个词指非常珍贵、被藏起来的东西，比如金币和宝石。"}],"fill_blank":{"sentences":["The pirates buried their ___ on a small island far away."],"options":["treasure","trash","ticket","tower"],"correct_index":0},"audio":"Unit2/audio/treasure.mp3","audio_ex0":"Unit2/audio/treasure_ex0.mp3","audio_ex1":"Unit2/audio/treasure_ex1.mp3"},{"word":"hunt","ipa":"/hʌnt/","image_prompts":["A flashlight beam sweeping across a dark forest floor, revealing animal tracks in the mud","A magnifying glass resting on a newspaper with a circled word, scattered puzzle pieces around"],"image_desc_en":"A flashlight beam on animal tracks in a forest; a magnifying glass on a newspaper with circled words.","image_desc_cn":"手电筒光束照在森林地面的动物足迹上；放大镜放在圈出单词的报纸上。","meaning_cn":"v. 打猎；搜寻，追捕 n. 打猎；搜索","usage":"v. (过去式 hunted, 过去分词 hunted) / n. (可数名词)","collocations":"hunt for, go hunting, treasure hunt, job hunt","preposition_combos":"hunt for, hunt through","examples":[{"en":"We need to hunt for the missing key before the rain starts.","cn":"我们得在下雨前搜寻丢失的钥匙。"},{"en":"The cat likes to hunt for mice in the garden every morning.","cn":"这只猫喜欢每天早上在花园里捉老鼠。"}],"socratic_questions":[{"question":"你的橡皮掉在教室地板上，你弯下腰在桌子下面到处找。这个动作叫什么？","answer_hint":"这个词表示为了找到某物而仔细搜索，就像猎人找猎物一样。"}],"fill_blank":{"sentences":["Every weekend, my father and I ___ for old coins at the flea market."],"options":["hunt","hide","help","hold"],"correct_index":0},"audio":"Unit2/audio/hunt.mp3","audio_ex0":"Unit2/audio/hunt_ex0.mp3","audio_ex1":"Unit2/audio/hunt_ex1.mp3"},{"word":"treasure hunt","ipa":"/ˈtreʒər hʌnt/","image_prompts":["A rolled parchment map with a red X marking a spot, lying on a wooden table next to a compass","A series of colorful paper arrows taped on a brick wall, leading to a small box wrapped in gold paper"],"image_desc_en":"A parchment map with an X mark and a compass on a table; colored arrows on a wall leading to a gold-wrapped box.","image_desc_cn":"一张标有X的羊皮地图和指南针放在桌上；墙上彩色箭头指向一个金色包装的小盒子。","meaning_cn":"n. 寻宝游戏；寻宝活动","usage":"n. (可数名词，常作复合名词)","collocations":"organize a treasure hunt, treasure hunt clues, outdoor treasure hunt","preposition_combos":"treasure hunt for, treasure hunt in","examples":[{"en":"The class had a fun treasure hunt in the school library last Friday.","cn":"上周五全班在学校图书馆进行了一次有趣的寻宝活动。"},{"en":"My sister wrote five clues for the treasure hunt in our backyard.","cn":"我姐姐为后院的寻宝游戏写了五条线索。"}],"socratic_questions":[{"question":"生日派对上，大家根据纸条上的提示在房间里找礼物。这个游戏叫什么？","answer_hint":"这是两个词组成的活动名称，意思是寻找珍贵物品的搜索游戏。"}],"fill_blank":{"sentences":["We followed the clues and finally finished the ___ in the park."],"options":["treasure hunt","homework","basketball game","science test"],"correct_index":0},"audio":"Unit2/audio/treasure_hunt.mp3","audio_ex0":"Unit2/audio/treasure_hunt_ex0.mp3","audio_ex1":"Unit2/audio/treasure_hunt_ex1.mp3"},{"word":"lift","ipa":"/lɪft/","image_prompts":["A stack of heavy textbooks being raised off a desk by a mechanical scissor lift, cables visible","A dumbbell resting on a weight rack with the barbell slightly raised above the supports"],"image_desc_en":"A scissor lift raising a stack of books off a desk; a dumbbell slightly lifted above a weight rack.","image_desc_cn":"剪式升降机将一摞书抬离桌面；哑铃微微抬离杠铃架。","meaning_cn":"v. 举起，抬起；n. 电梯；搭便车","usage":"v. (过去式 lifted, 过去分词 lifted) / n. (可数名词)","collocations":"lift up, lift weights, give a lift, lift the lid","preposition_combos":"lift off, lift from, lift onto","examples":[{"en":"Can you help me lift this heavy box onto the shelf?","cn":"你能帮我把这个重箱子抬到架子上吗？"},{"en":"My uncle gave me a lift to the train station this morning.","cn":"今天早上我叔叔让我搭便车去了火车站。"}],"socratic_questions":[{"question":"行李箱太重了，你双手握住把手把它从地上拿起来。这个动作叫什么？","answer_hint":"这个词表示把物体从低处向上移动，通常需要用力。"}],"fill_blank":{"sentences":["Please ___ the chair so I can sweep the floor under it."],"options":["lift","push","drop","break"],"correct_index":0},"audio":"Unit2/audio/lift.mp3","audio_ex0":"Unit2/audio/lift_ex0.mp3","audio_ex1":"Unit2/audio/lift_ex1.mp3"},{"word":"give sb a lift","ipa":"/ɡɪv ˈsʌmbədi ə lɪft/","image_prompts":["A red car stopped beside a bus stop with an open passenger door, empty seat visible inside, sunny day","A bicycle with an empty rear seat and a hand gesture pointing to it, parked on a tree-lined street"],"image_desc_en":"A car with its passenger door open at a bus stop, empty seat ready for someone to get in.","image_desc_cn":"一辆停在公交站旁的车，乘客门打开，空座位等待人上车。","meaning_cn":"让某人搭便车","usage":"短语动词 (phrasal verb) — give sb a lift (过去式 gave, 过去分词 given)","collocations":"give a friend a lift, give a neighbor a lift, offer a lift","preposition_combos":"give sb a lift to (place), give sb a lift home","examples":[{"en":"My dad gave me a lift to school this morning.","cn":"今早我爸爸让我搭便车去学校。"},{"en":"Could you give your classmate a lift after the game?","cn":"比赛后你能让你的同学搭便车吗？"}],"socratic_questions":[{"question":"放学时下大雨，你的朋友没带伞，你家正好顺路，你会怎么帮助他回家？","answer_hint":"这个短语表示用交通工具顺路带某人一程，不是借东西或走路陪送。"}],"fill_blank":{"sentences":["Can you ___ to the train station? My car is broken."],"options":["give me a lift","give me a ride","take me a lift","offer me a car"],"correct_index":0},"audio":"Unit2/audio/give_sb_a_lift.mp3","audio_ex0":"Unit2/audio/give_sb_a_lift_ex0.mp3","audio_ex1":"Unit2/audio/give_sb_a_lift_ex1.mp3"},{"word":"until","ipa":"/ənˈtɪl/","image_prompts":["A wall calendar with a red circle on December 31st, and a countdown sign reading '3 days left'","A digital clock showing 11:59 PM with a sign 'Store open' hanging above it"],"image_desc_en":"A calendar with a circled date and a countdown sign showing days remaining until that date.","image_desc_cn":"一本日历上圈出一个日期，旁边有倒计时牌显示距离该日期还剩几天。","meaning_cn":"直到……为止","usage":"介词 prep. / 连词 conj.","collocations":"wait until, stay until, not...until, until midnight, until Friday","preposition_combos":"until + 时间点/从句","examples":[{"en":"The library is open until nine o'clock every evening.","cn":"图书馆每天晚上开到九点。"},{"en":"I will not leave until I finish this homework.","cn":"直到完成这份作业我才会离开。"}],"socratic_questions":[{"question":"你告诉妈妈你会一直学习到晚饭时间，用哪个词可以连接‘学习’和‘晚饭时间’？","answer_hint":"这个词表示动作持续到某个时间点才停止，不是‘在……之前’或‘从……开始’。"}],"fill_blank":{"sentences":["We waited at the bus stop ___ the rain stopped."],"options":["until","since","after","before"],"correct_index":0},"audio":"Unit2/audio/until.mp3","audio_ex0":"Unit2/audio/until_ex0.mp3","audio_ex1":"Unit2/audio/until_ex1.mp3"},{"word":"be careful with","ipa":"/biː ˈkeərfəl wɪð/","image_prompts":["A fragile glass vase on a high shelf with a warning label 'Handle with care' attached to it","A laptop on a desk with a cup of water placed far away, and a sign reading 'Keep dry' nearby"],"image_desc_en":"A glass vase with a 'Handle with care' label on a shelf, emphasizing caution.","image_desc_cn":"一个贴有‘小心轻放’标签的玻璃花瓶放在架子上，强调小心。","meaning_cn":"小心对待（某物/某事）","usage":"动词短语 (phrasal verb) — be careful with (注意：be 随主语变化，如 am/is/are/was/were)","collocations":"be careful with money, be careful with fire, be careful with your words","preposition_combos":"be careful with + 名词","examples":[{"en":"Please be careful with the new library books.","cn":"请小心对待这些新的图书馆书籍。"},{"en":"You should be careful with your phone in the rain.","cn":"下雨时你应该小心保管你的手机。"}],"socratic_questions":[{"question":"你借了同学的相机，它很贵且容易摔坏，你会怎么提醒自己使用时要格外注意？","answer_hint":"这个短语强调对某物要小心处理，避免损坏或丢失，不是‘小心做某事’或‘小心某人’。"}],"fill_blank":{"sentences":["___ the scissors; they are very sharp."],"options":["Be careful with","Be careful of","Take care","Look at"],"correct_index":0},"audio":"Unit2/audio/be_careful_with.mp3","audio_ex0":"Unit2/audio/be_careful_with_ex0.mp3","audio_ex1":"Unit2/audio/be_careful_with_ex1.mp3"},{"word":"movie","ipa":"/ˈmuːvi/","image_prompts":["A cinema screen showing a bright scene from an animated film, empty red seats in front","A stack of DVD cases on a wooden shelf, colorful covers with film titles"],"image_desc_en":"A cinema screen with a colorful animated scene and empty red seats; a stack of DVD cases on a shelf.","image_desc_cn":"一块电影屏幕，上面有色彩鲜艳的动画场景，前面是空着的红色座椅；架子上的一摞DVD盒子。","meaning_cn":"电影","usage":"n. (可数名词) 电影","collocations":"watch a movie, see a movie, action movie, horror movie","preposition_combos":"movie about, movie with","examples":[{"en":"We plan to watch a funny movie this Saturday evening.","cn":"我们计划这周六晚上看一部有趣的电影。"},{"en":"That new movie about space travel is very popular now.","cn":"那部关于太空旅行的新电影现在很受欢迎。"}],"socratic_questions":[{"question":"周末你和朋友想一起看一部有趣的片子，你会用哪个词来指代这个片子？","answer_hint":"这个词是‘电影’的常用说法，比‘film’更口语化。"}],"fill_blank":{"sentences":["My favorite ___ is about a brave dog and its owner."],"options":["movie","book","song","game"],"correct_index":0},"audio":"Unit2/audio/movie.mp3","audio_ex0":"Unit2/audio/movie_ex0.mp3","audio_ex1":"Unit2/audio/movie_ex1.mp3"},{"word":"the movies","ipa":"/ðə ˈmuːviz/","image_prompts":["A dark cinema auditorium with a large screen showing a bright scene, empty seats in rows","A ticket booth at a cinema entrance with a neon 'Now Showing' sign above"],"image_desc_en":"A dark cinema auditorium with a bright screen and empty seats; a ticket booth with a neon sign.","image_desc_cn":"一个黑暗的电影院放映厅，屏幕明亮，座位空着；售票亭上方有霓虹灯‘正在上映’标志。","meaning_cn":"电影院；电影（泛指）","usage":"n. (复数形式，常与the连用) 电影院；电影业","collocations":"go to the movies, at the movies","preposition_combos":"at the movies, go to the movies","examples":[{"en":"My family often goes to the movies on Friday nights.","cn":"我家经常在周五晚上去电影院看电影。"},{"en":"There is a new popcorn machine at the movies this week.","cn":"这周电影院有一台新的爆米花机。"}],"socratic_questions":[{"question":"你想说‘去看电影’这个活动，而不是具体哪一部片子，该用什么短语？","answer_hint":"这个短语特指去电影院看电影这个场所或活动。"}],"fill_blank":{"sentences":["Let's go to ___ after school to relax a bit."],"options":["the movies","the park","the library","the store"],"correct_index":0},"audio":"Unit2/audio/the_movies.mp3","audio_ex0":"Unit2/audio/the_movies_ex0.mp3","audio_ex1":"Unit2/audio/the_movies_ex1.mp3"},{"word":"dead","ipa":"/ded/","image_prompts":["A wilted flower with brown petals lying on dry soil, no water nearby","A broken clock on a wall with its hands stopped at 3:15, dust on the face"],"image_desc_en":"A wilted flower with brown petals on dry soil; a broken clock with stopped hands and dust.","image_desc_cn":"一朵枯萎的花，棕色花瓣落在干土上；一面墙上停摆的钟，指针停在3:15，表盘上有灰尘。","meaning_cn":"死的；无生命的；失效的","usage":"adj. (形容词) 死的；无生命的；不工作的","collocations":"dead battery, dead plant, dead end","preposition_combos":"dead from, dead in","examples":[{"en":"My phone battery is dead, so I cannot call you now.","cn":"我的手机电池没电了，所以我现在不能给你打电话。"},{"en":"The old tree in the garden is dead and has no leaves.","cn":"花园里的那棵老树已经枯死了，没有叶子。"}],"socratic_questions":[{"question":"你的遥控器按了没反应，电池没电了，你会用哪个词形容电池的状态？","answer_hint":"这个词表示‘没电了’或‘不工作了’，常用于电子设备。"}],"fill_blank":{"sentences":["The flashlight is ___ because the batteries ran out."],"options":["dead","broken","lost","empty"],"correct_index":0},"audio":"Unit2/audio/dead.mp3","audio_ex0":"Unit2/audio/dead_ex0.mp3","audio_ex1":"Unit2/audio/dead_ex1.mp3"},{"word":"note","ipa":"/noʊt/","image_prompts":["A yellow sticky note on a refrigerator door with handwritten text 'Buy milk'","A spiral notebook open on a desk, pages filled with handwritten bullet points and a highlighter"],"image_desc_en":"A yellow sticky note on a fridge with 'Buy milk' written; an open notebook with handwritten notes and a highlighter.","image_desc_cn":"冰箱门上贴着一张黄色便签，写着‘买牛奶’；桌上摊开的笔记本，手写要点和一支荧光笔。","meaning_cn":"笔记；便条；音符","usage":"n. (可数名词) 笔记；便条；注释","collocations":"take notes, leave a note, sticky note, note down","preposition_combos":"note on, note about, note from","examples":[{"en":"Please take notes during the science class tomorrow.","cn":"请在明天的科学课上做笔记。"},{"en":"I left a note on the table to remind you about the meeting.","cn":"我在桌上留了张便条，提醒你关于会议的事。"}],"socratic_questions":[{"question":"老师讲课时，你想记下重点内容，你会写什么？","answer_hint":"这个词指写下来的简短记录，可以是课堂笔记或提醒便条。"}],"fill_blank":{"sentences":["She wrote a quick ___ to remind herself of the homework."],"options":["note","letter","diary","report"],"correct_index":0},"audio":"Unit2/audio/note.mp3","audio_ex0":"Unit2/audio/note_ex0.mp3","audio_ex1":"Unit2/audio/note_ex1.mp3"},{"word":"take notes","ipa":"/teɪk noʊts/","image_prompts":["A spiral notebook open on a wooden desk with handwritten bullet points in blue ink, a yellow highlighter pen resting beside it, soft daylight from a window","A stack of loose-leaf papers covered in neat handwriting and small diagrams, a pencil lying across the top sheet, on a clean white table"],"image_desc_en":"A notebook with handwritten notes and a pen on a desk.","image_desc_cn":"桌上一本带有手写笔记的笔记本和一支笔。","meaning_cn":"记笔记","usage":"动词短语 (v. phrase) (过去式 took notes, 过去分词 taken notes)","collocations":"take notes in class, take notes carefully, take notes on a lecture","preposition_combos":"take notes on/about sth.","examples":[{"en":"I always take notes in science class to remember key facts.","cn":"我总是在科学课上记笔记以记住关键事实。"},{"en":"She took notes quickly while the teacher explained the math problem.","cn":"老师讲解数学题时，她快速地记了笔记。"}],"socratic_questions":[{"question":"考试前复习时，你发现有些知识点记不清了。老师上课时你做了什么动作来帮助自己记住重点？","answer_hint":"这个动作是把老师讲的内容快速写在纸上，方便以后回顾。"}],"fill_blank":{"sentences":["During the history lecture, we need to ___ to prepare for the exam."],"options":["take notes","clean up","take photos","draw pictures"],"correct_index":0},"audio":"Unit2/audio/take_notes.mp3","audio_ex0":"Unit2/audio/take_notes_ex0.mp3","audio_ex1":"Unit2/audio/take_notes_ex1.mp3"},{"word":"clean up","ipa":"/kliːn ʌp/","image_prompts":["A kitchen counter with scattered crumbs and a sponge wiping away the mess, a bottle of spray cleaner nearby, bright overhead light","A park lawn covered with fallen leaves and a green trash bag half-full, a rake leaning against a tree trunk, autumn afternoon sunlight"],"image_desc_en":"A sponge cleaning a messy countertop.","image_desc_cn":"一块海绵正在清洁凌乱的台面。","meaning_cn":"打扫干净；清理","usage":"动词短语 (v. phrase) (过去式 cleaned up, 过去分词 cleaned up)","collocations":"clean up the room, clean up after dinner, clean up the mess","preposition_combos":"clean up sth. / clean sth. up","examples":[{"en":"We need to clean up the classroom before the school inspection.","cn":"在学校检查之前，我们需要把教室打扫干净。"},{"en":"After the picnic, everyone helped clean up the park area.","cn":"野餐后，每个人都帮忙清理了公园区域。"}],"socratic_questions":[{"question":"周末你和家人一起大扫除，把客厅里散落的玩具和灰尘都处理掉了。这个动作叫什么？","answer_hint":"这个词组表示把杂乱的地方整理干净，通常包括扫地、擦桌子等。"}],"fill_blank":{"sentences":["Let's ___ the kitchen after cooking dinner."],"options":["clean up","take notes","turn off","put away"],"correct_index":0},"audio":"Unit2/audio/clean_up.mp3","audio_ex0":"Unit2/audio/clean_up_ex0.mp3","audio_ex1":"Unit2/audio/clean_up_ex1.mp3"},{"word":"community","ipa":"/kəˈmjuːnəti/","image_prompts":["A row of colorful houses with front gardens and a shared playground in the middle, a white fence surrounding the area, clear blue sky","A public library building with large glass windows, a community notice board outside displaying event posters, a bicycle rack nearby"],"image_desc_en":"A row of houses and a playground in a neighborhood.","image_desc_cn":"一个社区里的一排房屋和游乐场。","meaning_cn":"社区；团体","usage":"名词 n. (复数 communities)","collocations":"local community, community center, community service","preposition_combos":"in the community, within the community","examples":[{"en":"Our community holds a clean-up day every spring to keep the streets tidy.","cn":"我们社区每年春天举办一次清洁日，保持街道整洁。"},{"en":"The new park in the community provides a safe place for everyone to relax.","cn":"社区里的新公园为大家提供了一个安全的放松场所。"}],"socratic_questions":[{"question":"你住的小区里有一个公共花园，邻居们经常一起在那里种花聊天。这个由许多家庭组成的生活区域叫什么？","answer_hint":"这个词指一群人共同生活或工作的地方，比如一个小区或一个街区。"}],"fill_blank":{"sentences":["The local ___ organized a charity fair to raise money for the library."],"options":["community","classroom","company","country"],"correct_index":0},"audio":"Unit2/audio/community.mp3","audio_ex0":"Unit2/audio/community_ex0.mp3","audio_ex1":"Unit2/audio/community_ex1.mp3"},{"word":"rubbish","ipa":"/ˈrʌbɪʃ/","image_prompts":["A black plastic trash bin overflowing with crumpled paper, empty cans, and banana peels, on a wet sidewalk after rain","A pile of discarded cardboard boxes and plastic bottles on a concrete floor, a recycling symbol on one bottle, dim warehouse lighting"],"image_desc_en":"An overflowing trash bin with waste items.","image_desc_cn":"一个装满垃圾的垃圾桶。","meaning_cn":"垃圾；废弃物","usage":"名词 n. (不可数)","collocations":"throw away rubbish, rubbish bin, rubbish collection","preposition_combos":"a pile of rubbish, full of rubbish","examples":[{"en":"Please put the empty bottles into the rubbish bin after lunch.","cn":"午饭后请把空瓶子扔进垃圾桶。"},{"en":"The street was covered with rubbish after the festival parade.","cn":"节日游行后，街道上覆盖着垃圾。"}],"socratic_questions":[{"question":"吃完零食后，包装袋和果皮应该扔到哪里去？这些东西统称什么？","answer_hint":"这个词指所有不需要的、被丢弃的东西，比如废纸、空罐子等。"}],"fill_blank":{"sentences":["Don't leave ___ on the beach; always take it home."],"options":["rubbish","food","water","sand"],"correct_index":0},"audio":"Unit2/audio/rubbish.mp3","audio_ex0":"Unit2/audio/rubbish_ex0.mp3","audio_ex1":"Unit2/audio/rubbish_ex1.mp3"},{"word":"almost","ipa":"/ˈɔːl.məʊst/","image_prompts":["A clock on a wall with the hour hand nearly touching the 12, minute hand at 11:59, close-up shot","A glass of water filled to the very brim, surface tension holding a tiny bulge above the rim"],"image_desc_en":"A clock face showing 11:59, the hour hand almost at 12.","image_desc_cn":"一个显示11:59的钟面，时针几乎指向12点。","meaning_cn":"几乎，差不多","usage":"adv.","collocations":"almost finished, almost every, almost never","preposition_combos":"N/A","examples":[{"en":"I almost forgot to bring my library book today.","cn":"我今天差点忘了带图书馆的书。"},{"en":"The homework is almost done, just one question left.","cn":"作业差不多做完了，只剩一道题。"}],"socratic_questions":[{"question":"你只差最后一道数学题就完成全部作业了，这时你会怎么形容作业的完成程度？","answer_hint":"表示接近完成但还没完全完成，用这个词最合适。"}],"fill_blank":{"sentences":["The movie was ___ over when we arrived at the cinema."],"options":["almost","already","always","also"],"correct_index":0},"audio":"Unit2/audio/almost.mp3","audio_ex0":"Unit2/audio/almost_ex0.mp3","audio_ex1":"Unit2/audio/almost_ex1.mp3"},{"word":"journey","ipa":"/ˈdʒɜː.ni/","image_prompts":["A winding dirt road stretching across a green valley toward distant mountains, early morning mist","A suitcase on a train seat next to a window showing passing countryside fields"],"image_desc_en":"A winding road through a valley leading to mountains, symbolizing a long trip.","image_desc_cn":"一条蜿蜒穿过山谷通向山脉的道路，象征长途旅行。","meaning_cn":"旅行，旅程","usage":"n. (复数 journeys)","collocations":"long journey, safe journey, begin a journey","preposition_combos":"journey to, journey from, journey through","examples":[{"en":"The train journey from Beijing to Shanghai takes about five hours.","cn":"从北京到上海的火车旅程大约需要五个小时。"},{"en":"We packed some snacks for the long bus journey to the beach.","cn":"我们为去海滩的长途巴士旅程打包了一些零食。"}],"socratic_questions":[{"question":"暑假你坐火车从北京去西藏，路上要花两天时间，你会怎么称呼这次出行？","answer_hint":"强调从出发到到达的整个过程，而不是短途游玩。"}],"fill_blank":{"sentences":["Their ___ across the desert took three days by camel."],"options":["journey","trip","travel","tour"],"correct_index":0},"audio":"Unit2/audio/journey.mp3","audio_ex0":"Unit2/audio/journey_ex0.mp3","audio_ex1":"Unit2/audio/journey_ex1.mp3"},{"word":"pull","ipa":"/pʊl/","image_prompts":["A rope tied to a heavy wooden crate on a concrete floor, rope taut and straight","A drawer half open with a hand-shaped metal handle, the drawer slightly tilted outward"],"image_desc_en":"A rope attached to a heavy crate, pulled tight and straight.","image_desc_cn":"一根绳子系在沉重的板条箱上，绳子被拉紧拉直。","meaning_cn":"拉，拖","usage":"v. (过去式 pulled, 过去分词 pulled)","collocations":"pull open, pull up, pull out","preposition_combos":"pull on, pull at, pull out of","examples":[{"en":"Please pull the door gently; it is very old and fragile.","cn":"请轻轻拉门，它很旧很脆弱。"},{"en":"He had to pull the heavy suitcase up the stairs by himself.","cn":"他不得不自己把沉重的行李箱拉上楼梯。"}],"socratic_questions":[{"question":"教室的门是朝里开的，你要进去，应该对门做什么动作？","answer_hint":"门朝自己方向移动，这个动作就是该词。"}],"fill_blank":{"sentences":["She ___ the curtain aside to let in some sunlight."],"options":["pulled","pushed","lifted","threw"],"correct_index":0},"audio":"Unit2/audio/pull.mp3"},{"word":"luggage","ipa":"/ˈlʌɡ.ɪdʒ/","image_prompts":["Three suitcases of different sizes stacked on an airport baggage cart, one with a red ribbon","A pile of backpacks and duffel bags on a hotel lobby floor near the check-in desk"],"image_desc_en":"Three suitcases stacked on an airport cart, one tied with a red ribbon.","image_desc_cn":"三个行李箱堆放在机场手推车上，其中一个系着红丝带。","meaning_cn":"行李","usage":"n. (不可数名词)","collocations":"carry luggage, pack luggage, heavy luggage","preposition_combos":"luggage with, luggage for","examples":[{"en":"Please put your luggage on the scale before boarding the plane.","cn":"登机前请把行李放在秤上。"},{"en":"My luggage is too heavy to carry up the stairs alone.","cn":"我的行李太重了，一个人搬不上楼梯。"}],"socratic_questions":[{"question":"你去机场坐飞机，带了一个大箱子和一个背包，这些东西统称什么？","answer_hint":"这是一个不可数名词，指旅行时携带的所有箱包物品。"}],"fill_blank":{"sentences":["The airport staff helped us carry our ___ to the bus."],"options":["luggage","luggage's","luggages","luggagees"],"correct_index":0}},{"word":"share sth with sb","ipa":"/ʃeər sʌmθɪŋ wɪð sʌmbədi/","image_prompts":["Two identical lunch boxes placed side by side on a picnic blanket, one open with a sandwich half taken out","A stack of colorful books on a library table, a note saying 'Take one, leave one' attached to the top book"],"image_desc_en":"Two lunch boxes on a blanket with a sandwich half, or a stack of books with a sharing note.","image_desc_cn":"野餐毯上的两个午餐盒和三明治半块，或一摞书上的分享便签。","meaning_cn":"与某人分享某物","usage":"动词短语 v. phrase (share v. 过去式 shared, 过去分词 shared)","collocations":"share food with friends / share ideas with classmates","preposition_combos":"share sth with sb","examples":[{"en":"I always share my snacks with my deskmate at lunch.","cn":"我总是在午餐时和同桌分享我的零食。"},{"en":"She shared her travel photos with the whole class yesterday.","cn":"她昨天和全班同学分享了她的旅行照片。"}],"socratic_questions":[{"question":"你带了好吃的饼干到学校，想给好朋友尝一块，这个动作叫什么？","answer_hint":"这个短语包含两个部分：一个表示‘分给’，一个表示‘和某人一起’。"}],"fill_blank":{"sentences":["Can you ___ your umbrella ___ me? It's raining hard."],"options":["share...with","give...to","lend...from","take...from"],"correct_index":0}},{"word":"familiar","ipa":"/fəˈmɪliər/","image_prompts":["A worn-out school backpack hanging on a hook by a door, scuffed corners and faded logo","A row of identical lockers in a hallway, one with a small sticker of a sunflower on the door"],"image_desc_en":"A worn backpack on a hook, or a row of lockers with a sunflower sticker on one door.","image_desc_cn":"挂在钩子上的旧书包，或一排储物柜中贴有向日葵贴纸的一个。","meaning_cn":"熟悉的；常见的","usage":"形容词 adj. (副词形式 familiarly)","collocations":"familiar face / familiar place / familiar voice","preposition_combos":"be familiar to sb / be familiar with sth","examples":[{"en":"The song on the radio sounds familiar to me.","cn":"收音机里的这首歌我听起来很熟悉。"},{"en":"This park is a familiar place for our weekend walks.","cn":"这个公园是我们周末散步的熟悉地方。"}],"socratic_questions":[{"question":"你走进一家店，觉得里面的气味、摆设好像以前见过，但不确定，可以用什么词形容这种感觉？","answer_hint":"这个词和‘家庭’有关，表示像家一样让人感到不陌生。"}],"fill_blank":{"sentences":["The smell of fresh bread is ___ to everyone in this town."],"options":["familiar","strange","new","different"],"correct_index":0},"audio":"Unit2/audio/familiar.mp3","audio_ex0":"Unit2/audio/familiar_ex0.mp3","audio_ex1":"Unit2/audio/familiar_ex1.mp3"},{"word":"joke","ipa":"/dʒəʊk/","image_prompts":["A single yellow smiley face balloon floating against a plain white wall, with a small tag reading 'punchline' attached to its string","A comic strip panel on a wooden desk, showing only the final frame with a large 'HA HA' text and a banana peel on the ground"],"image_desc_en":"A yellow smiley face balloon with a 'punchline' tag; a comic strip final frame with 'HA HA' and a banana peel.","image_desc_cn":"一个带有‘punchline’标签的黄色笑脸气球；漫画最后一格写着‘HA HA’并画着一块香蕉皮。","meaning_cn":"笑话；玩笑；开玩笑","usage":"n. (可数名词) / v. (过去式 joked, 过去分词 joked)","collocations":"tell a joke, make a joke, play a joke on, no joke","preposition_combos":"joke about, joke with","examples":[{"en":"My grandpa told a funny joke at the family dinner last night.","cn":"昨晚我爷爷在家庭晚餐上讲了一个有趣的笑话。"},{"en":"Don't joke about the exam results; it's a serious topic for us.","cn":"别拿考试成绩开玩笑；这对我们来说是个严肃的话题。"}],"socratic_questions":[{"question":"朋友在聚会上讲了一件很好笑的事，大家都笑了。你如何称呼他说的那件有趣的事？","answer_hint":"这个词是名词，指让人发笑的故事或话语，通常有‘笑点’。"}],"fill_blank":{"sentences":["The teacher told a ___ that made the whole class laugh."],"options":["joke","story","fact","lesson"],"correct_index":0},"audio":"Unit2/audio/joke.mp3","audio_ex0":"U
