nit2/audio/joke_ex0.mp3","audio_ex1":"Unit2/audio/joke_ex1.mp3"}]},{"unit":3,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"compare","ipa":"/kəmˈpeər/","image_prompts":["Two apples side by side on a wooden table, one red and one green, with a measuring tape between them","A split-screen image showing a sunny beach on the left and a snowy mountain on the right, with a large equal sign in the middle"],"image_desc_en":"Two apples side by side on a wooden table, one red and one green, with a measuring tape between them","image_desc_cn":"木桌上并排放着两个苹果，一个红色一个绿色，中间有一把卷尺","meaning_cn":"比较，对比","usage":"v. (过去式 compared, 过去分词 compared)","collocations":"compare A with B, compare A to B","preposition_combos":"compare with, compare to","examples":[{"en":"I often compare my test scores with my best friend's.","cn":"我经常把我的考试成绩和我最好朋友的比较。"},{"en":"The teacher asked us to compare the two poems in class.","cn":"老师让我们在课堂上比较这两首诗。"}],"socratic_questions":[{"question":"你想知道两本词典哪本更好，你会做什么动作？","answer_hint":"这个动作是把两个东西放在一起看异同，就是‘比较’的意思。"}],"fill_blank":{"sentences":["Please ___ your answers with your partner's before handing in."],"options":["compare","complete","collect","correct"],"correct_index":0},"audio":"Unit3/audio/compare.mp3","audio_ex0":"Unit3/audio/compare_ex0.mp3","audio_ex1":"Unit3/audio/compare_ex1.mp3"},{"word":"shy","ipa":"/ʃaɪ/","image_prompts":["A small kitten hiding behind a large green plant pot, only its tail visible","A closed book with a bookmark sticking out, placed on a quiet library desk in soft sunlight"],"image_desc_en":"A small kitten hiding behind a large green plant pot, only its tail visible","image_desc_cn":"一只小猫躲在大绿植花盆后面，只露出尾巴","meaning_cn":"害羞的，腼腆的","usage":"adj. (比较级 shyer, 最高级 shyest)","collocations":"feel shy, too shy to do, shy smile","preposition_combos":"shy of, shy about","examples":[{"en":"She felt too shy to speak in front of the class.","cn":"她太害羞了，不敢在全班面前发言。"},{"en":"The new student gave a shy wave from the back row.","cn":"新来的学生从后排害羞地挥了挥手。"}],"socratic_questions":[{"question":"你第一次上台演讲时，心跳很快，不敢看观众，这种状态叫什么？","answer_hint":"这种紧张、不敢表现自己的感觉，就是‘害羞’。"}],"fill_blank":{"sentences":["My little sister is too ___ to order food by herself."],"options":["shy","lazy","loud","proud"],"correct_index":0},"audio":"Unit3/audio/shy.mp3","audio_ex0":"Unit3/audio/shy_ex0.mp3","audio_ex1":"Unit3/audio/shy_ex1.mp3"},{"word":"lazy","ipa":"/ˈleɪzi/","image_prompts":["A cat curled up sleeping on a pile of unopened books under a desk lamp","A half-finished homework sheet lying on a messy desk next to a smartphone with a game screen"],"image_desc_en":"A cat curled up sleeping on a pile of unopened books under a desk lamp","image_desc_cn":"一只猫蜷缩在一堆未打开的书上睡觉，台灯下","meaning_cn":"懒惰的，懒散的","usage":"adj. (比较级 lazier, 最高级 laziest; 副词 lazily)","collocations":"lazy afternoon, lazy habit, too lazy to do","preposition_combos":"lazy about","examples":[{"en":"He is too lazy to clean his room on weekends.","cn":"他太懒了，周末都不打扫房间。"},{"en":"A lazy cat slept on the sofa all afternoon.","cn":"一只懒猫在沙发上睡了一整个下午。"}],"socratic_questions":[{"question":"周末你只想躺着玩手机，不想写作业，这种状态用一个词形容是什么？","answer_hint":"不想动、不想做事，就是‘懒惰’的表现。"}],"fill_blank":{"sentences":["Don't be so ___; finish your homework before dinner."],"options":["lazy","busy","shy","smart"],"correct_index":0},"audio":"Unit3/audio/lazy.mp3","audio_ex0":"Unit3/audio/lazy_ex0.mp3","audio_ex1":"Unit3/audio/lazy_ex1.mp3"},{"word":"loud","ipa":"/laʊd/","image_prompts":["A red alarm clock ringing on a bedside table with visible sound waves drawn around it","A construction site with a yellow jackhammer hitting concrete, dust flying up"],"image_desc_en":"A red alarm clock ringing on a bedside table with visible sound waves drawn around it","image_desc_cn":"红色闹钟在床头柜上响着，周围画有可见的声波","meaning_cn":"大声的，响亮的；吵闹的","usage":"adj. (比较级 louder, 最高级 loudest; 副词 loudly)","collocations":"loud music, loud voice, loud noise","preposition_combos":"loud in","examples":[{"en":"The loud music from the party kept me awake all night.","cn":"派对上吵闹的音乐让我整晚睡不着。"},{"en":"Please speak in a loud voice so everyone can hear you.","cn":"请大声说话，这样每个人都能听到你。"}],"socratic_questions":[{"question":"图书馆里有人大声打电话，你会用什么词形容他的声音？","answer_hint":"声音很大、很吵，就是‘大声的’。"}],"fill_blank":{"sentences":["The ___ thunder scared the dog under the bed."],"options":["loud","soft","quiet","sweet"],"correct_index":0},"audio":"Unit3/audio/loud.mp3","audio_ex0":"Unit3/audio/loud_ex0.mp3","audio_ex1":"Unit3/audio/loud_ex1.mp3"},{"word":"rainfall","ipa":"/ˈreɪnfɔːl/","image_prompts":["A rain gauge on a wooden post showing 50 mm of water after a heavy storm, surrounded by wet grass","A puddle on a dirt road with ripples from falling raindrops, dark clouds in the sky"],"image_desc_en":"A rain gauge filled with water after a storm, with wet grass around it.","image_desc_cn":"暴雨后装满水的雨量计，周围是湿漉漉的草地。","meaning_cn":"降雨量","usage":"n. (不可数名词)","collocations":"heavy rainfall, annual rainfall, average rainfall","preposition_combos":"rainfall in (地区/月份), rainfall of (数量)","examples":[{"en":"The annual rainfall in this city is about 800 mm.","cn":"这个城市的年降雨量约为800毫米。"},{"en":"Heavy rainfall caused the river to rise quickly.","cn":"强降雨导致河水迅速上涨。"}],"socratic_questions":[{"question":"气象预报说今天会有很多雨水，你想知道具体下了多少毫米，应该查什么数据？","answer_hint":"这个词指降水的总量，不是雨滴本身，而是测量出的数值。"}],"fill_blank":{"sentences":["The ___ in July was much higher than last year."],"options":["rainfall","raincoat","rainbow","raindrop"],"correct_index":0},"audio":"Unit3/audio/rainfall.mp3","audio_ex0":"Unit3/audio/rainfall_ex0.mp3","audio_ex1":"Unit3/audio/rainfall_ex1.mp3"},{"word":"per","ipa":"/pɜːr/","image_prompts":["A speed limit sign on a road showing '60 km per hour' with a blurred car in the background","A grocery store shelf with a price tag reading '$2 per kilogram' on a bag of apples"],"image_desc_en":"A speed limit sign indicating 60 kilometers per hour on a roadside.","image_desc_cn":"路边限速标志，显示每小时60公里。","meaning_cn":"每，每一","usage":"prep. (介词)","collocations":"per day, per person, per hour, per cent","preposition_combos":"per + 单位名词","examples":[{"en":"The ticket costs $10 per person for the show.","cn":"这场演出的门票每人10美元。"},{"en":"We can finish about five math problems per minute.","cn":"我们每分钟大约能完成五道数学题。"}],"socratic_questions":[{"question":"你想知道每个学生需要交多少活动费，老师告诉你一个数字，这个数字是按什么单位计算的？","answer_hint":"这个词表示‘每个’，后面常跟时间或人数单位。"}],"fill_blank":{"sentences":["The bus can carry 50 passengers ___ trip."],"options":["per","for","with","by"],"correct_index":0},"audio":"Unit3/audio/per.mp3","audio_ex0":"Unit3/audio/per_ex0.mp3","audio_ex1":"Unit3/audio/per_ex1.mp3"},{"word":"millimeter","ipa":"/ˈmɪlɪmiːtər/","image_prompts":["A digital caliper measuring a thin metal wire, display showing 0.5 millimeter","A stack of 100 sheets of paper with a label '10 millimeters' on a desk, next to a ruler"],"image_desc_en":"A digital caliper measuring a thin wire, with the display showing 0.5 millimeter.","image_desc_cn":"数显卡尺测量一根细金属丝，显示屏显示0.5毫米。","meaning_cn":"毫米","usage":"n. (可数名词，复数 millimeters)","collocations":"one millimeter, a few millimeters, millimeter by millimeter","preposition_combos":"millimeter in diameter, millimeter of (物质)","examples":[{"en":"The screw is 3 millimeters in diameter and 20 long.","cn":"这颗螺丝直径3毫米，长20毫米。"},{"en":"Move the camera just one millimeter to the left.","cn":"把相机向左移动仅仅一毫米。"}],"socratic_questions":[{"question":"组装模型时，零件需要精确到很小的长度单位，厘米太大，应该用什么单位？","answer_hint":"这个词是‘毫米’的全称，比厘米小10倍，用于精细测量。"}],"fill_blank":{"sentences":["The gap between the two parts is less than one ___."],"options":["millimeter","kilometer","centimeter","meter"],"correct_index":0},"audio":"Unit3/audio/millimeter.mp3","audio_ex0":"Unit3/audio/millimeter_ex0.mp3","audio_ex1":"Unit3/audio/millimeter_ex1.mp3"},{"word":"pleasant","ipa":"/ˈpleznt/","image_prompts":["A bright sunny day with a clear blue sky, green grass, and a single white daisy in the foreground, soft natural lighting","A cup of hot tea on a wooden table next to an open book, steam rising gently, warm golden hour light"],"image_desc_en":"A sunny meadow with a single daisy, or a steaming tea cup beside an open book in warm light.","image_desc_cn":"阳光明媚的草地上有一朵雏菊，或一杯热茶旁放着一本打开的书，光线温暖。","meaning_cn":"令人愉快的，舒适的","usage":"adj. (比较级 pleasanter / more pleasant, 最高级 pleasantest / most pleasant)","collocations":"pleasant weather, pleasant experience, pleasant smile, pleasant voice","preposition_combos":"pleasant to someone, pleasant for someone","examples":[{"en":"The weather today is very pleasant for a picnic.","cn":"今天的天气非常适合野餐。"},{"en":"She has a pleasant voice that makes everyone calm.","cn":"她有一副令人愉快的嗓音，让每个人都平静下来。"}],"socratic_questions":[{"question":"你周末去公园散步，阳光温暖，微风拂面，鸟语花香。你会用什么词形容这种感受？","answer_hint":"这个词描述让人感到舒适、开心、放松的环境或事物，不是‘美丽’或‘有趣’，而是‘舒服’。"}],"fill_blank":{"sentences":["The garden looks very ___ with all the colorful flowers."],"options":["pleasant","angry","noisy","boring"],"correct_index":0},"audio":"Unit3/audio/pleasant.mp3","audio_ex0":"Unit3/audio/pleasant_ex0.mp3","audio_ex1":"Unit3/audio/pleasant_ex1.mp3"},{"word":"difference","ipa":"/ˈdɪfrəns/","image_prompts":["Two apples side by side on a wooden table, one red and one green, with a small arrow pointing between them","A ruler measuring two pencils of different lengths on a white desk, clear contrast in size"],"image_desc_en":"A red apple and a green apple with an arrow between them, or a ruler comparing two pencils of different lengths.","image_desc_cn":"一个红苹果和一个绿苹果，中间有箭头；或一把尺子测量两支不同长度的铅笔。","meaning_cn":"差异，不同之处","usage":"n. (可数名词，复数 differences)","collocations":"make a difference, tell the difference, big difference, cultural difference","preposition_combos":"difference between A and B, difference in something","examples":[{"en":"Can you tell the difference between these two pictures?","cn":"你能看出这两幅画的不同之处吗？"},{"en":"A small effort can make a big difference to the environment.","cn":"一个小小的努力可以对环境产生很大的不同。"}],"socratic_questions":[{"question":"你面前有两支笔，一支蓝色一支红色，长度也不一样。你要怎么描述它们之间的关系？","answer_hint":"这个词强调两者之间‘不一样’的地方，不是‘相同’或‘相似’。"}],"fill_blank":{"sentences":["There is a big ___ between summer and winter in this city."],"options":["difference","similarity","pleasure","mirror"],"correct_index":0},"audio":"Unit3/audio/difference.mp3","audio_ex0":"Unit3/audio/difference_ex0.mp3","audio_ex1":"Unit3/audio/difference_ex1.mp3"},{"word":"alike","ipa":"/əˈlaɪk/","image_prompts":["Two identical white coffee mugs on a shelf, same shape and size, side by side","A pair of matching sneakers placed neatly on a shoe rack, both white with blue stripes"],"image_desc_en":"Two identical white mugs on a shelf, or a pair of matching sneakers with blue stripes.","image_desc_cn":"两个一模一样的白色马克杯放在架子上，或一双带有蓝色条纹的匹配运动鞋。","meaning_cn":"相似的，相同的；同样地","usage":"adj. (只作表语，不作定语) / adv.","collocations":"look alike, treat alike, think alike, very alike","preposition_combos":"alike in something","examples":[{"en":"The two houses look so alike that I often get lost.","cn":"这两栋房子看起来太像了，我经常迷路。"},{"en":"All the books on this shelf are alike in color.","cn":"这个架子上所有的书颜色都一样。"}],"socratic_questions":[{"question":"你看到两片树叶，形状和颜色几乎一模一样，很难区分。你会怎么形容它们？","answer_hint":"这个词表示‘非常相像’，但不是‘相同’（same），也不是‘不同’（different）。"}],"fill_blank":{"sentences":["The twins are so ___ that their teacher cannot tell them apart."],"options":["alike","different","pleasant","mirror"],"correct_index":0},"audio":"Unit3/audio/alike.mp3","audio_ex0":"Unit3/audio/alike_ex0.mp3","audio_ex1":"Unit3/audio/alike_ex1.mp3"},{"word":"mirror","ipa":"/ˈmɪrər/","image_prompts":["A rectangular mirror hanging on a white wall, reflecting a window with sunlight streaming in","A small round mirror on a wooden dressing table, reflecting a vase of fresh flowers"],"image_desc_en":"A rectangular mirror reflecting a sunny window, or a round mirror reflecting a vase of flowers on a table.","image_desc_cn":"一面长方形镜子反射出阳光明媚的窗户，或一面圆镜反射出桌上的花瓶。","meaning_cn":"镜子；反映，反射","usage":"n. (可数名词，复数 mirrors) / v. (过去式 mirrored, 过去分词 mirrored)","collocations":"look in the mirror, rearview mirror, mirror image, mirror one's feelings","preposition_combos":"mirror of something, mirror in something","examples":[{"en":"She checked her hair in the mirror before leaving home.","cn":"她在离家前照镜子检查了头发。"},{"en":"The calm lake mirrors the blue sky perfectly.","cn":"平静的湖面完美地映照出蓝天。"}],"socratic_questions":[{"question":"早上你站在一个光滑的玻璃前，看到自己的脸。这个玻璃叫什么？","answer_hint":"这个词指能照出影像的平面物体，不是窗户，也不是照片。"}],"fill_blank":{"sentences":["The lake is so clear that it acts like a ___ for the mountains."],"options":["mirror","window","picture","difference"],"correct_index":0},"audio":"Unit3/audio/mirror.mp3","audio_ex0":"Unit3/audio/mirror_ex0.mp3","audio_ex1":"Unit3/audio/mirror_ex1.mp3"},{"word":"interest","ipa":"/ˈɪntrəst/","image_prompts":["A stack of colorful science magazines on a wooden desk, a magnifying glass resting on top","A chessboard with pieces mid-game, soft sunlight from a window illuminating the board"],"image_desc_en":"A stack of colorful science magazines on a wooden desk with a magnifying glass on top.","image_desc_cn":"一叠彩色科学杂志放在木桌上，上面放着一个放大镜。","meaning_cn":"兴趣；使感兴趣","usage":"n. / v. (过去式 interested, 过去分词 interested)","collocations":"take an interest in, have no interest in, be interested in","preposition_combos":"interest in","examples":[{"en":"She takes a great interest in reading science fiction books.","cn":"她对阅读科幻小说有浓厚的兴趣。"},{"en":"His new hobby of painting interests many of his classmates.","cn":"他画画的新爱好让很多同学感兴趣。"}],"socratic_questions":[{"question":"小明周末总喜欢去图书馆看恐龙百科，一坐就是两小时。他为什么能这么专注？","answer_hint":"这个词表示对某事物感到好奇或喜欢，常与'in'搭配使用。"}],"fill_blank":{"sentences":["She has a strong ___ in learning how to play the guitar."],"options":["interest","hobby","habit","skill"],"correct_index":0},"audio":"Unit3/audio/interest.mp3","audio_ex0":"Unit3/audio/interest_ex0.mp3","audio_ex1":"Unit3/audio/interest_ex1.mp3"},{"word":"novel","ipa":"/ˈnɒvəl/","image_prompts":["A hardcover book with a bookmark sticking out, lying on a park bench under autumn leaves","A typewriter with a half-typed page, a cup of coffee beside it on a wooden table"],"image_desc_en":"A hardcover book with a bookmark sticking out, lying on a park bench under autumn leaves.","image_desc_cn":"一本带书签的精装书放在公园长椅上，上方有秋叶飘落。","meaning_cn":"小说；新颖的","usage":"n. / adj.","collocations":"read a novel, a popular novel, a novel idea","preposition_combos":"novel about","examples":[{"en":"This novel about a time traveler is very popular at school.","cn":"这本关于时间旅行者的小说在学校很受欢迎。"},{"en":"The teacher praised her novel way to solve the math problem.","cn":"老师表扬了她解决数学问题的新颖方法。"}],"socratic_questions":[{"question":"语文老师推荐了一本课外读物，里面讲了一个侦探破案的故事，这本书叫什么？","answer_hint":"这个词可以指一种虚构的文学作品，也可以形容想法很新。"}],"fill_blank":{"sentences":["I borrowed a science fiction ___ from the school library yesterday."],"options":["novel","magazine","dictionary","textbook"],"correct_index":0},"audio":"Unit3/audio/novel.mp3","audio_ex0":"Unit3/audio/novel_ex0.mp3","audio_ex1":"Unit3/audio/novel_ex1.mp3"},{"word":"sense","ipa":"/sens/","image_prompts":["A kitchen counter with a lemon cut in half, steam rising from a hot cup of tea","A compass on a map with a red arrow pointing north, a pencil marking a route"],"image_desc_en":"A kitchen counter with a lemon cut in half and steam rising from a hot cup of tea.","image_desc_cn":"厨房台面上有半个柠檬，一杯热茶冒着蒸汽。","meaning_cn":"感觉；意识；感官；意识到","usage":"n. / v. (过去式 sensed, 过去分词 sensed)","collocations":"a sense of humor, common sense, make sense","preposition_combos":"sense of","examples":[{"en":"A good sense of direction helps you find your way easily.","cn":"好的方向感能帮你轻松找到路。"},{"en":"She sensed something wrong when the lights went out suddenly.","cn":"当灯突然熄灭时，她感觉到有些不对劲。"}],"socratic_questions":[{"question":"小丽闻到厨房飘来烤蛋糕的香味，她知道妈妈在做好吃的。这是哪种能力？","answer_hint":"这个词可以指五官的感觉，也可以指对某事的判断力。"}],"fill_blank":{"sentences":["It doesn't ___ to stay up too late before an exam."],"options":["sense","make sense","feel","sound"],"correct_index":1},"audio":"Unit3/audio/sense.mp3","audio_ex0":"Unit3/audio/sense_ex0.mp3","audio_ex1":"Unit3/audio/sense_ex1.mp3"},{"word":"humour","ipa":"/ˈhjuːmə(r)/","image_prompts":["A cartoon strip on a newspaper page with a laughing emoji drawn in the margin","A banana peel lying on a sidewalk next to a red clown nose"],"image_desc_en":"A cartoon strip on a newspaper page with a laughing emoji drawn in the margin.","image_desc_cn":"报纸上的一幅连环漫画，页边空白处画了一个大笑的表情符号。","meaning_cn":"幽默；幽默感","usage":"n.","collocations":"sense of humour, black humour, dry humour","preposition_combos":"humour in","examples":[{"en":"His sense of humour always makes the class laugh happily.","cn":"他的幽默感总是让全班开心大笑。"},{"en":"There is a lot of humour in this funny comic book.","cn":"这本有趣的漫画书里有很多幽默元素。"}],"socratic_questions":[{"question":"班里有个同学讲笑话总能逗大家笑，大家说他很有这种品质。是什么品质？","answer_hint":"这个词指让人发笑的能力或特质，常与'sense of'搭配。"}],"fill_blank":{"sentences":["My best friend has a great sense of ___ and tells funny jokes."],"options":["humour","humor","humourous","humorous"],"correct_index":0},"audio":"Unit3/audio/humour.mp3","audio_ex0":"Unit3/audio/humour_ex0.mp3","audio_ex1":"Unit3/audio/humour_ex1.mp3"},{"word":"thanks to","ipa":"/θæŋks tuː/","image_prompts":["A bright red fire truck parked in front of a burning house with water spraying, fire nearly out, smoke clearing, thanks to firefighters' equipment","A green plant growing tall under a sunlamp with a water dropper nearby, soil moist, leaves vibrant, thanks to artificial light and water"],"image_desc_en":"A fire truck with water spraying on a house fire, smoke clearing, showing rescue success due to equipment.","image_desc_cn":"一辆消防车向着火房屋喷水，烟雾散去，显示因设备而成功救援。","meaning_cn":"幸亏；由于（表示原因，常指积极结果）","usage":"介词短语 prep. phrase（后接名词或名词短语）","collocations":"thanks to your help, thanks to the rain, thanks to hard work","preposition_combos":"thanks to + 名词/代词","examples":[{"en":"Thanks to the map, we found the park easily.","cn":"多亏了地图，我们轻松找到了公园。"},{"en":"Thanks to your advice, I passed the exam.","cn":"多亏了你的建议，我通过了考试。"}],"socratic_questions":[{"question":"小明考试没复习，但同桌借给他笔记，他考了高分。你想说“因为同桌的帮助，他成功了”，用哪个短语？","answer_hint":"这个短语表示“由于……（积极原因）”，后面直接跟名词，比如“thanks to his classmate's help”。"}],"fill_blank":{"sentences":["___ the early bus, we arrived on time."],"options":["Thanks to","Because","Instead of","Except for"],"correct_index":0},"audio":"Unit3/audio/thanks_to.mp3","audio_ex0":"Unit3/audio/thanks_to_ex0.mp3","audio_ex1":"Unit3/audio/thanks_to_ex1.mp3"},{"word":"opinion","ipa":"/əˈpɪnjən/","image_prompts":["A white speech bubble with a question mark inside, floating above a wooden table with two different colored pencils pointing at it","A scale with a red book on one side and a blue book on the other, both balanced, representing different views"],"image_desc_en":"A speech bubble with a question mark above a table, two colored pencils pointing at it, symbolizing different viewpoints.","image_desc_cn":"一个带问号的气泡浮在桌子上方，两支彩色铅笔指向它，象征不同观点。","meaning_cn":"意见；看法","usage":"名词 n. (复数 opinions)","collocations":"in my opinion, give an opinion, share opinions, have a different opinion","preposition_combos":"opinion on/about sth.","examples":[{"en":"In my opinion, this movie is very interesting.","cn":"在我看来，这部电影非常有趣。"},{"en":"We should listen to everyone's opinion in class.","cn":"在课堂上我们应该听取每个人的意见。"}],"socratic_questions":[{"question":"老师问大家对春游地点的想法，你想说“我觉得去植物园好”，但需要先表达“我的看法是……”，用哪个词？","answer_hint":"这个词是名词，表示“看法、观点”，常用短语“in my opinion”开头。"}],"fill_blank":{"sentences":["___ my ___, reading books is more useful than watching TV."],"options":["In / opinion","On / mind","At / view","For / idea"],"correct_index":0},"audio":"Unit3/audio/opinion.mp3","audio_ex0":"Unit3/audio/opinion_ex0.mp3","audio_ex1":"Unit3/audio/opinion_ex1.mp3"},{"word":"make a mistake","ipa":"/meɪk ə mɪˈsteɪk/","image_prompts":["A crumpled piece of paper with red ink crossing out a math equation on a wooden desk, an eraser nearby","A broken pencil tip lying on a notebook with a misspelled word written in blue ink, a correction tape beside it"],"image_desc_en":"A crumpled paper with a crossed-out math equation in red ink, an eraser on a wooden desk, showing an error.","image_desc_cn":"一张皱巴巴的纸上用红笔划掉数学算式，橡皮放在木桌上，显示错误。","meaning_cn":"犯错误","usage":"动词短语 v. phrase (过去式 made a mistake, 过去分词 made a mistake)","collocations":"make a spelling mistake, make a silly mistake, learn from mistakes","preposition_combos":"make a mistake in sth.","examples":[{"en":"I made a mistake in the math test yesterday.","cn":"我昨天在数学考试中犯了一个错误。"},{"cn":"每个人都会在生活中犯错误。","en":"Everyone can make a mistake in life."}],"socratic_questions":[{"question":"你写作文时把“their”写成了“there”，老师批改时画了圈。这个行为叫什么？","answer_hint":"这是一个动词短语，表示“出错”，由“make”和“a mistake”组成。"}],"fill_blank":{"sentences":["Don't be afraid to ___ ___ ___ when learning English."],"options":["make a mistake","do a wrong","take an error","have a fault"],"correct_index":0},"audio":"Unit3/audio/make_a_mistake.mp3","audio_ex0":"Unit3/audio/make_a_mistake_ex0.mp3","audio_ex1":"Unit3/audio/make_a_mistake_ex1.mp3"},{"word":"less","ipa":"/les/","image_prompts":["A half-empty glass of water on a table next to a full glass, sunlight casting shadows, showing less water","A small pile of three coins next to a large pile of twenty coins on a wooden surface, contrast in quantity"],"image_desc_en":"A half-empty glass of water beside a full glass, sunlight shadows, illustrating a smaller amount.","image_desc_cn":"半杯水放在满杯水旁边，阳光投下阴影，表示更少的量。","meaning_cn":"更少的；较少地","usage":"形容词 adj. (little的比较级) / 副词 adv.","collocations":"less time, less money, less sugar, less than, more or less","preposition_combos":"less than + 数字/名词","examples":[{"en":"You should eat less sugar to stay healthy.","cn":"你应该少吃糖来保持健康。"},{"en":"He spent less time on games this week.","cn":"这周他花在游戏上的时间更少了。"}],"socratic_questions":[{"question":"医生建议你少喝可乐，因为可乐含糖太多。你想表达“喝更少的可乐”，用哪个词？","answer_hint":"这个词是“little”的比较级，表示“更少的”，修饰不可数名词。"}],"fill_blank":{"sentences":["To save money, we should spend ___ on snacks."],"options":["less","fewer","more","little"],"correct_index":0},"audio":"Unit3/audio/less.mp3","audio_ex0":"Unit3/audio/less_ex0.mp3","audio_ex1":"Unit3/audio/less_ex1.mp3"},{"word":"straightforward","ipa":"/ˌstreɪtˈfɔːrwərd/","image_prompts":["A clear, straight road with no turns or obstacles, leading directly to a bright horizon under a blue sky","A simple jigsaw puzzle with only four large pieces, all fitting perfectly on a wooden table"],"image_desc_en":"A clear, straight road with no turns or obstacles, leading directly to a bright horizon under a blue sky","image_desc_cn":"一条笔直的道路，没有转弯或障碍物，在蓝天白云下直接通向明亮的地平线","meaning_cn":"简单的；易懂的；直截了当的","usage":"adj. (比较级 more straightforward, 最高级 most straightforward)","collocations":"straightforward answer, straightforward task, straightforward explanation","preposition_combos":"straightforward for sb., straightforward to do","examples":[{"en":"The math problem was straightforward and took only two minutes.","cn":"这道数学题很简单，只花了两分钟。"},{"en":"She gave a straightforward answer to the teacher's question.","cn":"她对老师的问题给出了直截了当的回答。"}],"socratic_questions":[{"question":"你正在做一道数学题，步骤很少，不需要绕弯子，一眼就能看出解法。你会用什么词来形容这道题？","answer_hint":"这个词由“straight”（直的）和“forward”（向前）组成，形容事情没有复杂之处，很容易理解或完成。"}],"fill_blank":{"sentences":["The instructions for the game are ___ and easy to follow."],"options":["straightforward","difficult","confusing","boring"],"correct_index":0},"audio":"Unit3/audio/straightforward.mp3","audio_ex0":"Unit3/audio/straightforward_ex0.mp3","audio_ex1":"Unit3/audio/straightforward_ex1.mp3"},{"word":"honest","ipa":"/ˈɒnɪst/","image_prompts":["A clear glass jar filled with coins on a wooden table, sunlight shining through, no shadows or hidden objects","A handwritten note with the word 'TRUTH' in bold black ink on crumpled paper, lying on a plain white surface"],"image_desc_en":"A transparent jar of coins under sunlight, symbolizing openness and no concealment.","image_desc_cn":"阳光下透明的硬币罐，象征公开无隐瞒。","meaning_cn":"诚实的；坦率的","usage":"adj. (比较级 more honest, 最高级 most honest); 副词形式 honestly","collocations":"honest answer, honest opinion, honest mistake","preposition_combos":"honest with, honest about","examples":[{"en":"An honest answer can save you from trouble.","cn":"诚实的回答能帮你避免麻烦。"},{"en":"She gave an honest opinion about the movie.","cn":"她对这部电影给出了诚实的看法。"}],"socratic_questions":[{"question":"小明考试时发现老师多给了分数，他主动告诉老师。你觉得小明的这个行为可以用哪个形容词描述？","answer_hint":"这个词强调不说谎、不欺骗，与‘诚实’直接对应。"}],"fill_blank":{"sentences":["It is important to be ___ when you make a mistake."],"options":["honest","lazy","angry","shy"],"correct_index":0},"audio":"Unit3/audio/honest.mp3","audio_ex0":"Unit3/audio/honest_ex0.mp3","audio_ex1":"Unit3/audio/honest_ex1.mp3"},{"word":"direct","ipa":"/dəˈrekt/","image_prompts":["A straight arrow sign on a wooden post pointing forward on a clear path, no curves or branches","A single beam of sunlight entering a dark room through a small window, hitting the floor in a straight line"],"image_desc_en":"A straight arrow sign on a path, indicating no detours or turns.","image_desc_cn":"小径上笔直的箭头标志，表示没有绕路或转弯。","meaning_cn":"直接的；径直的；坦率的","usage":"adj. (比较级 more direct, 最高级 most direct); 副词形式 directly; 动词 v. (过去式 directed, 过去分词 directed)","collocations":"direct flight, direct answer, direct way","preposition_combos":"direct to, direct from","examples":[{"en":"The direct flight from Beijing to London takes ten hours.","cn":"从北京到伦敦的直飞航班需要十小时。"},{"en":"Please give me a direct answer to my question.","cn":"请直接回答我的问题。"}],"socratic_questions":[{"question":"你想从北京去上海，不想中途在南京停。你会选择什么样的航班？","answer_hint":"这个词表示中间没有停顿或绕路，与‘直飞’意思一致。"}],"fill_blank":{"sentences":["Can you tell me the ___ way to the library?"],"options":["direct","long","funny","quiet"],"correct_index":0},"audio":"Unit3/audio/direct.mp3","audio_ex0":"Unit3/audio/direct_ex0.mp3","audio_ex1":"Unit3/audio/direct_ex1.mp3"},{"word":"similarity","ipa":"/ˌsɪməˈlærəti/","image_prompts":["Two identical red apples placed side by side on a white plate, same size and shape","Two overlapping circles in a Venn diagram, the overlapping area shaded in blue"],"image_desc_en":"Two identical apples on a plate, highlighting their shared features.","image_desc_cn":"盘子里两个一模一样的苹果，突出它们的共同特征。","meaning_cn":"相似性；相似点","usage":"n. (可数名词，复数 similarities); 形容词形式 similar","collocations":"share a similarity, point of similarity, striking similarity","preposition_combos":"similarity between, similarity to","examples":[{"en":"There is a strong similarity between the two paintings.","cn":"这两幅画之间有很强的相似性。"},{"en":"Can you find any similarity in their writing styles?","cn":"你能发现他们写作风格上的相似之处吗？"}],"socratic_questions":[{"question":"你和同桌都爱打篮球、听周杰伦的歌。你们之间有很多共同点，这个‘共同点’用英语怎么说？","answer_hint":"这个词由‘similar（相似的）’变化而来，表示‘相似的地方’。"}],"fill_blank":{"sentences":["The ___ between the two twins is amazing."],"options":["similarity","difference","distance","height"],"correct_index":0},"audio":"Unit3/audio/similarity.mp3","audio_ex0":"Unit3/audio/similarity_ex0.mp3","audio_ex1":"Unit3/audio/similarity_ex1.mp3"},{"word":"friendship","ipa":"/ˈfrendʃɪp/","image_prompts":["Two intertwined tree branches growing from separate trunks, forming a natural arch","A pair of matching bracelets made of red string lying on a soft blue cloth"],"image_desc_en":"Two tree branches intertwined, symbolizing a close bond between two entities.","image_desc_cn":"两根交织的树枝，象征两个个体之间的紧密联系。","meaning_cn":"友谊；友情","usage":"n. (不可数名词，但可加不定冠词 a friendship 表示一段友谊); 复数 friendships","collocations":"build friendship, value friendship, close friendship","preposition_combos":"friendship with, friendship between","examples":[{"en":"True friendship is more important than money.","cn":"真正的友谊比金钱更重要。"},{"en":"They developed a deep friendship during summer camp.","cn":"他们在夏令营期间建立了深厚的友谊。"}],"socratic_questions":[{"question":"你和好朋友一起分享快乐、互相帮助，这种关系叫什么？","answer_hint":"这个词由‘friend（朋友）’加后缀‘-ship’构成，表示‘朋友之间的关系’。"}],"fill_blank":{"sentences":["A good ___ can last a lifetime."],"options":["friendship","homework","weather","traffic"],"correct_index":0},"audio":"Unit3/audio/friendship.mp3","audio_ex0":"Unit3/audio/friendship_ex0.mp3","audio_ex1":"Unit3/audio/friendship_ex1.mp3"},{"word":"metre","ipa":"/ˈmiːtər/","image_prompts":["A yellow measuring tape stretched across a wooden floor, markings at 1 metre intervals, bright daylight","A swimming pool with lane ropes and a 50-metre distance marker on the tiled wall, clear blue water"],"image_desc_en":"A measuring tape showing metre markings on a floor; a pool with a 50-metre sign.","image_desc_cn":"地板上显示米刻度的卷尺；泳池上标有50米距离的标识。","meaning_cn":"米（长度单位）","usage":"n. (可数名词，复数 metres)","collocations":"square metre, 100-metre race, metre by metre","preposition_combos":"in metres, per metre","examples":[{"en":"The classroom is about ten metres long and eight metres wide.","cn":"教室大约十米长，八米宽。"},{"en":"He ran the 100-metre race in under twelve seconds.","cn":"他跑100米用了不到12秒。"}],"socratic_questions":[{"question":"你想知道教室的长度，需要用到什么单位？","answer_hint":"这是国际通用的长度单位，比厘米大，比千米小。"}],"fill_blank":{"sentences":["The swimming pool is 25 ___ long."],"options":["metres","kilos","litres","hours"],"correct_index":0},"audio":"Unit3/audio/metre.mp3","audio_ex0":"Unit3/audio/metre_ex0.mp3","audio_ex1":"Unit3/audio/metre_ex1.mp3"},{"word":"prince","ipa":"/prɪns/","image_prompts":["A golden crown with red velvet lining resting on a silk cushion, soft spotlight","A medieval castle with tall towers and a flag bearing a royal crest, cloudy sky"],"image_desc_en":"A golden crown on a cushion; a castle with a royal flag.","image_desc_cn":"垫子上的金色王冠；挂着皇家旗帜的城堡。","meaning_cn":"王子；亲王","usage":"n. (可数名词，复数 princes)","collocations":"Prince Charming, crown prince, prince of the kingdom","preposition_combos":"prince of ...","examples":[{"en":"The prince wore a golden crown at the royal ceremony.","cn":"王子在皇家仪式上戴着一顶金色王冠。"},{"en":"In the fairy tale, the prince saved the princess from the tower.","cn":"在童话里，王子从塔楼里救出了公主。"}],"socratic_questions":[{"question":"童话故事里，国王的儿子通常被称为什么？","answer_hint":"这个词指国王或女王的儿子，常出现在童话和皇室故事中。"}],"fill_blank":{"sentences":["The young ___ lived in a beautiful castle."],"options":["prince","princess","king","queen"],"correct_index":0},"audio":"Unit3/audio/prince.mp3","audio_ex0":"Unit3/audio/prince_ex0.mp3","audio_ex1":"Unit3/audio/prince_ex1.mp3"},{"word":"character","ipa":"/ˈkærəktər/","image_prompts":["A row of Chinese calligraphy characters written with black ink on white rice paper, brush strokes visible","A wooden stage with a stack of paper masks representing different facial expressions, dim theater light"],"image_desc_en":"Chinese calligraphy characters on paper; paper masks with different expressions on a stage.","image_desc_cn":"纸上的中国书法汉字；舞台上带有不同表情的纸面具。","meaning_cn":"角色；性格；汉字","usage":"n. (可数名词，复数 characters)","collocations":"main character, strong character, Chinese character","preposition_combos":"character in, character of","examples":[{"en":"The main character in this story is a brave firefighter.","cn":"这个故事的主角是一位勇敢的消防员。"},{"en":"Learning to write Chinese characters takes a lot of practice.","cn":"学习写汉字需要大量练习。"}],"socratic_questions":[{"question":"你读了一本小说，里面那个勇敢的主角叫什么？","answer_hint":"这个词可以指故事中的人物，也可以指一个人的品质或汉字。"}],"fill_blank":{"sentences":["Each Chinese ___ has a special meaning."],"options":["character","letter","number","symbol"],"correct_index":0},"audio":"Unit3/audio/character.mp3","audio_ex0":"Unit3/audio/character_ex0.mp3","audio_ex1":"Unit3/audio/character_ex1.mp3"},{"word":"pauper","ipa":"/ˈpɔːpər/","image_prompts":["A worn-out leather shoe with a hole in the sole, lying on a cobblestone street, grey weather","An empty wooden bowl and a piece of dry bread on a rough stone table, dim candlelight"],"image_desc_en":"A damaged shoe on a street; an empty bowl with dry bread on a stone table.","image_desc_cn":"街上一只破旧的鞋子；石桌上一个空碗和干面包。","meaning_cn":"穷人；乞丐","usage":"n. (可数名词，复数 paupers)","collocations":"poor pauper, live as a pauper, pauper's grave","preposition_combos":"pauper in ...","examples":[{"en":"The pauper had only a thin coat to keep warm.","cn":"那个穷人只有一件薄外套御寒。"},{"en":"In the story, a rich prince and a poor pauper switch places.","cn":"故事里，一个富王子和一个穷乞丐互换了身份。"}],"socratic_questions":[{"question":"一个没有钱、没有房子、生活很困难的人，我们叫他什么？","answer_hint":"这个词指非常贫穷的人，和‘王子’或‘富人’意思相反。"}],"fill_blank":{"sentences":["The ___ begged for food on the street corner."],"options":["pauper","prince","king","soldier"],"correct_index":0},"audio":"Unit3/audio/pauper.mp3","audio_ex0":"Unit3/audio/pauper_ex0.mp3","audio_ex1":"Unit3/audio/pauper_ex1.mp3"},{"word":"exchange","ipa":"/ɪksˈtʃeɪndʒ/","image_prompts":["Two wrapped gift boxes on a wooden table, one with a red ribbon and one with a blue ribbon, side by side with a small arrow symbol between them","A stack of foreign coins and banknotes on a world map, with a calculator nearby showing currency conversion numbers"],"image_desc_en":"Two gift boxes with different colored ribbons placed side by side on a wooden table, with an arrow symbol between them indicating swapping.","image_desc_cn":"两个不同颜色丝带的礼盒并排放在木桌上，中间有一个箭头符号表示交换。","meaning_cn":"交换；交流；兑换","usage":"v. (过去式 exchanged, 过去分词 exchanged) / n.","collocations":"exchange gifts, exchange ideas, exchange rate, in exchange for","preposition_combos":"exchange A for B, exchange with someone","examples":[{"en":"We exchange gifts at the class party every year.","cn":"我们每年在班级聚会上交换礼物。"},{"en":"Can I exchange this book for a different one?","cn":"我能把这本书换成另一本吗？"}],"socratic_questions":[{"question":"你和朋友各自买了不同的零食，你们想尝尝对方的，这时候你们会做什么？","answer_hint":"这个词表示互相给与并接收，常用于礼物、想法或货币的互换。"}],"fill_blank":{"sentences":["We decided to ___ phone numbers after the school trip."],"options":["exchange","change","replace","trade"],"correct_index":0},"audio":"Unit3/audio/exchange.mp3","audio_ex0":"Unit3/audio/exchange_ex0.mp3","audio_ex1":"Unit3/audio/exchange_ex1.mp3"},{"word":"outgoing","ipa":"/ˌaʊtˈɡoʊɪŋ/","image_prompts":["A bright yellow smiley face sticker on a classroom door, surrounded by colorful hand-drawn stars and sun rays","A group of 着一本书，柔和的阳光透过窗户洒下","meaning_cn":"独自的；孤独的；单独地","usage":"adj. / adv. (无词形变化)","collocations":"live alone, feel alone, stand alone, all alone","preposition_combos":"alone in, alone with","examples":[{"en":"I finished the whole project alone last weekend.","cn":"上周末我独自完成了整个项目。"},{"en":"She prefers to study alone in her room.","cn":"她更喜欢独自在房间里学习。"}],"socratic_questions":[{"question":"小明周末没有约朋友，自己在家完成了所有作业。他是什么状态？","answer_hint":"强调没有其他人陪伴，用这个词表示独自一人。"}],"fill_blank":{"sentences":["He walked home ___ after the basketball game ended."],"options":["alone","along","aloud","lonely"],"correct_index":0},"audio":"Unit3/audio/alone.mp3","audio_ex0":"Unit3/audio/alone_ex0.mp3","audio_ex1":"Unit3/audio/alone_ex1.mp3"},{"word":"solve","ipa":"/sɒlv/","image_prompts":["A completed jigsaw puzzle with the last piece being placed into the center, puzzle pieces scattered around","A whiteboard covered with mathematical equations, one equation circled in red marker with a checkmark"],"image_desc_en":"A completed jigsaw puzzle with the last piece being placed into the center, puzzle pieces scattered around","image_desc_cn":"一个完成的拼图，最后一块正在放入中心，周围散落着拼图碎片","meaning_cn":"解决；解答","usage":"v. (过去式 solved, 过去分词 solved)","collocations":"solve a problem, solve a puzzle, solve a mystery, solve an equation","preposition_combos":"solve by, solve with","examples":[{"en":"Can you solve this math problem in five minutes?","cn":"你能在五分钟内解出这道数学题吗？"},{"en":"The team worked together to solve the difficult puzzle.","cn":"团队一起努力解开了这个难题。"}],"socratic_questions":[{"question":"数学课上老师出了一道很难的方程，大家都在思考怎么找到答案。这个过程叫什么？","answer_hint":"找到问题的答案或处理困难，用这个词。"}],"fill_blank":{"sentences":["We need to ___ this environmental issue before it gets worse."],"options":["solve","avoid","ignore","create"],"correct_index":0},"audio":"Unit3/audio/solve.mp3","audio_ex0":"Unit3/audio/solve_ex0.mp3","audio_ex1":"Unit3/audio/solve_ex1.mp3"},{"word":"flute","ipa":"/fluːt/","image_prompts":["A silver flute resting on a velvet cloth with sheet m bos":"prize for sth.","examples":[{"en":"She won the first prize in the school art competition.","cn":"她在学校艺术比赛中获得了一等奖。"},{"en":"The prize for the best essay is a new bicycle.","cn":"最佳作文的奖品是一辆新自行车。"}],"socratic_questions":[{"question":"学校举办了一场英语演讲比赛，你获得了第一名，学校会给你一个什么东西作为奖励？","answer_hint":"这个词指在比赛或竞赛中因表现优异而获得的奖励，可以是奖杯、奖牌或物品。"}],"fill_blank":{"sentences":["He was happy to ___ the first ___ in the science fair."],"options":["win / prize","lose / game","get / ticket","buy / gift"],"correct_index":0},"audio":"Unit3/audio/prize.mp3","audio_ex0":"Unit3/audio/prize_ex0.mp3","audio_ex1":"Unit3/audio/prize_ex1.mp3"},{"word":"attend","ipa":"/əˈtend/","image_prompts":["An empty classroom with desks arranged neatly and a clock showing 8:00 AM, sunlight through window","A concert hall with rows of empty red seats and a stage with musical instruments set up"],"meaning_cn":"参加，出席；上（学）","usage":"v. (过去式 attended, 过去分词 attended)","collocations":"attend school, attend a meeting, attend a concert, attend class","preposition_combos":"attend to (处理，照料)","examples":[{"en":"All students must attend the morning assembly every day.","cn":"所有学生必须每天参加晨会。"},{"en":"I will attend a summer camp next month.","cn":"下个月我将参加一个夏令营。"}],"socratic_questions":[{"question":"明天下午三点学校有一个重要的讲座，老师要求每个同学都要去，用哪个词表示'去参加'？","answer_hint":"这个词强调正式地出现在某个活动或场所，比如上课、开会、听讲座。"}],"fill_blank":{"sentences":["How many students will ___ the sports meeting tomorrow?"],"options":["attend","leave","miss","watch"],"correct_index":0},"audio":"Unit3/audio/attend.mp3","audio_ex0":"Unit3/audio/attend_ex0.mp3","audio_ex1":"Unit3/audio/attend_ex1.mp3"},{"word":"besides","ipa":"/bɪˈsaɪdz/","image_prompts":["A wooden table with three apples and one orange next to them, a note saying 'fruit basket'","A shelf with five books standing and two more books lying flat on top, library background"],"meaning_cn":"除……之外（还）","usage":"prep. / adv.","collocations":"besides this, besides that, besides doing sth.","preposition_combos":"besides + n./pron./doing","examples":[{"en":"Besides English, we also study math and science.","cn":"除了英语，我们还学习数学和科学。"},{"en":"Besides playing basketball, he enjoys reading novels.","cn":"除了打篮球，他还喜欢读小说。"}],"socratic_questions":[{"question":"你周末除了做作业，还打算去游泳和看电影。你想表达'除了作业之外还有别的活动'，该用哪个词？","answer_hint":"这个词表示'包括在内'的附加，即除了提到的内容，还有另外的内容。注意它和'except'（排除在外）的区别。"}],"fill_blank":{"sentences":["___ singing, she is also good at dancing and painting."],"options":["Besides","Except","Without","Instead"],"correct_index":0},"audio":"Unit3/audio/besides.mp3","audio_ex0":"Unit3/audio/besides_ex0.mp3","audio_ex1":"Unit3/audio/besides_ex1.mp3"},{"word":"spare","ipa":"/sper/","image_prompts":["A single spare tire leaning against a garage wall, rubber texture visible","A spare key hanging on a small hook by a wooden door, metal glint"],"image_desc_en":"A spare tire against a wall; a spare key on a hook.","image_desc_cn":"一个备用轮胎靠在墙上；一把备用钥匙挂在钩子上。","meaning_cn":"adj. 备用的；多余的；空闲的","usage":"adj. (无词形变化)","collocations":"spare time, spare key, spare tire, spare room","preposition_combos":"spare for (为…留出)","examples":[{"en":"I keep a spare umbrella in my schoolbag every day.","cn":"我每天在书包里放一把备用雨伞。"},{"en":"Do you have a spare pen for the math exam?","cn":"你有多余的笔用于数学考试吗？"}],"socratic_questions":[{"question":"你的笔突然没墨了，你希望同桌有什么东西可以借给你？","answer_hint":"这个词表示‘额外的、备用的’，不是‘新的’或‘旧的’。"}],"fill_blank":{"sentences":["Could you lend me a ___ pencil? I broke mine."],"options":["spare","sharp","short","special"],"correct_index":0},"audio":"Unit3/audio/spare.mp3","audio_ex0":"Unit3/audio/spare_ex0.mp3","audio_ex1":"Unit3/audio/spare_ex1.mp3"},{"word":"spare time","ipa":"/sper taɪm/","image_prompts":["An open book on a sunny windowsill with a cup of tea beside it, soft afternoon light","A chessboard with pieces mid-game on a wooden table, no players visible"],"image_desc_en":"A book and tea on a windowsill; a chessboard with pieces.","image_desc_cn":"窗台上的书和茶；一盘下到一半的国际象棋。","meaning_cn":"n. 空闲时间","usage":"n. (不可数名词)","collocations":"in one's spare time, spend spare time, use spare time","preposition_combos":"in spare time","examples":[{"en":"She reads science fiction in her spare time at home.","cn":"她在家的空闲时间读科幻小说。"},{"en":"I use my spare time to practice English listening skills.","cn":"我利用空闲时间练习英语听力技巧。"}],"socratic_questions":[{"question":"放学后写完作业，到睡觉前这段时间，你可以做什么？","answer_hint":"这个词组指‘不用上课或做作业的时间’，不是‘上课时间’。"}],"fill_blank":{"sentences":["He enjoys painting in his ___."],"options":["spare time","class time","bedtime","lunchtime"],"correct_index":0},"audio":"Unit3/audio/spare_time.mp3","audio_ex0":"Unit3/audio/spare_time_ex0.mp3","audio_ex1":"Unit3/audio/spare_time_ex1.mp3"},{"word":"pleasure","ipa":"/ˈpleʒər/","image_prompts":["A plate of freshly baked chocolate chip cookies on a cooling rack, steam rising","A cozy armchair with a soft blanket and a stack of colorful magazines"],"image_desc_en":"Fresh cookies with steam; a cozy armchair with magazines.","image_desc_cn":"冒着热气的新鲜饼干；舒适的扶手椅和杂志。","meaning_cn":"n. 快乐；愉快；乐事","usage":"n. (可数/不可数名词)","collocations":"with pleasure, a great pleasure, reading pleasure","preposition_combos":"pleasure in (以…为乐)","examples":[{"en":"It is a great pleasure to help my classmates with math.","cn":"帮助同学学数学是一件很快乐的事。"},{"en":"She finds pleasure in listening to light music after exams.","cn":"她在考试后从听轻音乐中找到快乐。"}],"socratic_questions":[{"question":"你帮朋友捡起掉落的书，朋友说谢谢，你该怎么礼貌回答？","answer_hint":"这个词表示‘愉快’，常用于礼貌回应，不是‘没问题’或‘不客气’的直译。"}],"fill_blank":{"sentences":["Thank you for your help! — It's my ___."],"options":["pleasure","problem","duty","turn"],"correct_index":0},"audio":"Unit3/audio/pleasure.mp3","audio_ex0":"Unit3/audio/pleasure_ex0.mp3","audio_ex1":"Unit3/audio/pleasure_ex1.mp3"},{"word":"have sth in common","ipa":"/hæv ˈsʌmθɪŋ ɪn ˈkɑːmən/","image_prompts":["Two identical blue notebooks placed side by side on a desk, same cover design","Two bicycles of the same model and color parked next to each other in a rack"],"image_desc_en":"Two identical notebooks; two same-model bicycles.","image_desc_cn":"两本相同的笔记本；两辆同款自行车。","meaning_cn":"有共同之处","usage":"v. (短语动词，have 的过去式 had，过去分词 had)","collocations":"have a lot in common, have nothing in common, have something in common with","preposition_combos":"have ... in common with (与…有共同点)","examples":[{"en":"The two clubs have a lot in common about environmental protection.","cn":"这两个俱乐部在环保方面有很多共同点。"},{"en":"I have nothing in common with that boring science project.","cn":"我和那个无聊的科学项目毫无共同之处。"}],"socratic_questions":[{"question":"你和你的好朋友都喜欢打篮球和听流行音乐，这说明你们之间有什么？","answer_hint":"这个短语表示‘共享相同的兴趣或特点’，不是‘一起做某事’。"}],"fill_blank":{"sentences":["My sister and I ___ a lot in common: we both love cats."],"options":["have","make","take","find"],"correct_index":0},"audio":"Unit3/audio/have_sth_in_common.mp3","audio_ex0":"Unit3/audio/have_sth_in_common_ex0.mp3","audio_ex1":"Unit3/audio/have_sth_in_common_ex1.mp3"},{"word":"appearance","ipa":"/əˈpɪərəns/","image_prompts":["A neatly folded school uniform on a wooden hanger against a white wall, bright daylight","A clean white sneaker placed next to a muddy one on a doormat, contrasting textures"],"image_desc_en":"A neatly folded school uniform on a hanger and a clean sneaker next to a muddy one.","image_desc_cn":"一件整齐叠好的校服挂在衣架上，以及一只干净的运动鞋放在一只脏鞋旁边。","meaning_cn":"外貌；外观；出现","usage":"n. (可数名词)","collocations":"physical appearance, outward appearance, change one's appearance","preposition_combos":"in appearance, by appearance","examples":[{"en":"Her appearance at the party surprised all her friends.","cn":"她在派对上的出现让所有朋友都感到惊讶。"},{"en":"The appearance of the old library changed after the rain.","cn":"雨后旧图书馆的外观发生了变化。"}],"socratic_questions":[{"question":"你第一次见到新同学时，最先注意到的是他的长相还是性格？哪个词描述的是“长相”？","answer_hint":"这个词指一个人或物体的外部样子，不是内在品质。"}],"fill_blank":{"sentences":["The ___ of the building is very modern and clean."],"options":["appearance","personality","strength","serious"],"correct_index":0},"audio":"Unit3/audio/appearance.mp3","audio_ex0":"Unit3/audio/appearance_ex0.mp3","audio_ex1":"Unit3/audio/appearance_ex1.mp3"},{"word":"personality","ipa":"/ˌpɜːrsəˈnæləti/","image_prompts":["A colorful jigsaw puzzle with one piece missing on a wooden table, soft lighting","A bright sunflower standing alone in a field of green grass, blue sky background"],"image_desc_en":"A colorful jigsaw puzzle with a missing piece and a single sunflower in a green field.","image_desc_cn":"一块缺了一片的彩色拼图，以及一片绿草地中独自挺立的向日葵。","meaning_cn":"个性；性格","usage":"n. (可数名词，通常单数)","collocations":"strong personality, friendly personality, develop one's personality","preposition_combos":"of personality, with a ... personality","examples":[{"en":"A good personality is more important than good looks.","cn":"好的性格比好看的外貌更重要。"},{"en":"My best friend has a warm and cheerful personality.","cn":"我最好的朋友性格温暖又开朗。"}],"socratic_questions":[{"question":"如果你要描述一个人是否友善、幽默或安静，你是在说他的外貌还是性格？","answer_hint":"这个词描述的是一个人的内在特质，比如是否开朗或认真。"}],"fill_blank":{"sentences":["Her ___ makes her very popular in the class."],"options":["personality","appearance","strength","serious"],"correct_index":0},"audio":"Unit3/audio/personality.mp3","audio_ex0":"Unit3/audio/personality_ex0.mp3","audio_ex1":"Unit3/audio/personality_ex1.mp3"},{"word":"serious","ipa":"/ˈsɪriəs/","image_prompts":["A closed textbook with a pair of glasses on top, on a desk under a desk lamp","A chessboard with pieces in mid-game, no players visible, focused composition"],"image_desc_en":"A closed textbook with glasses on a desk and a chessboard mid-game.","image_desc_cn":"一本合上的课本上放着眼镜，以及一盘进行中的国际象棋。","meaning_cn":"严肃的；认真的；严重的","usage":"adj. (比较级 more serious, 最高级 most serious)","collocations":"serious problem, serious expression, serious about","preposition_combos":"serious about (sth.)","examples":[{"en":"The teacher gave a serious warning about the exam.","cn":"老师对考试给出了严肃的警告。"},{"en":"He is serious about learning English this year.","cn":"他今年对学英语很认真。"}],"socratic_questions":[{"question":"当老师提到中考时，他的表情变得很严肃，不再开玩笑。哪个词能形容这种表情？","answer_hint":"这个词表示不轻松、不搞笑，带有认真或重要的意味。"}],"fill_blank":{"sentences":["The doctor looked ___ when he read the test results."],"options":["serious","funny","happy","tired"],"correct_index":0},"audio":"Unit3/audio/serious.mp3","audio_ex0":"Unit3/audio/serious_ex0.mp3","audio_ex1":"Unit3/audio/serious_ex1.mp3"},{"word":"strength","ipa":"/streŋθ/","image_prompts":["A stack of heavy dumbbells on a gym floor, metal texture, bright light","A thick tree trunk with visible roots gripping the ground, forest background"],"image_desc_en":"A stack of heavy dumbbells on a gym floor and a thick tree trunk with roots.","image_desc_cn":"一堆沉重的哑铃放在健身房地板上，以及一棵粗壮的树干和露出的树根。","meaning_cn":"力量；优点；强度","usage":"n. (不可数名词，可作可数名词表示“优点”)","collocations":"physical strength, inner strength, strengths and weaknesses","preposition_combos":"strength in, strength of","examples":[{"en":"Regular exercise can improve your physical strength.","cn":"定期锻炼能提高你的体力。"},{"en":"One of her strengths is solving math problems quickly.","cn":"她的优点之一是快速解数学题。"}],"socratic_questions":[{"question":"举重运动员需要什么才能举起很重的杠铃？这个词也指一个人擅长的方面。","answer_hint":"这个词既指体力上的力气，也指能力上的长处。"}],"fill_blank":{"sentences":["Swimming is a good way to build up your ___."],"options":["strength","appearance","personality","serious"],"correct_index":0},"audio":"Unit3/audio/strength.mp3","audio_ex0":"Unit3/audio/strength_ex0.mp3","audio_ex1":"Unit3/audio/strength_ex1.mp3"},{"word":"slim","ipa":"/slɪm/","image_prompts":["A slim silver laptop lying open on a wooden desk, thin edge visible","A slim glass bottle of water next to a single green leaf on a white table"],"image_desc_en":"A slim laptop on a desk; a slim water bottle beside a leaf.","image_desc_cn":"一台纤薄的笔记本电脑放在桌上；一个细长的水瓶旁边有一片叶子。","meaning_cn":"adj. 苗条的；薄的；微小的（机会等）","usage":"adj. (比较级 slimmer, 最高级 slimmest)","collocations":"slim chance, slim figure, slim book","preposition_combos":"slim in size, slim for a notebook","examples":[{"en":"She has a slim chance to win the race.","cn":"她赢得比赛的机会很小。"},{"en":"This slim dictionary fits easily in my bag.","cn":"这本薄词典很容易放进我的包里。"}],"socratic_questions":[{"question":"你想描述一本很薄、不占空间的书，应该用哪个形容词？","answer_hint":"这个词表示厚度小或身材纤细，常用来形容物品或体型。"}],"fill_blank":{"sentences":["The ___ phone can slide into a small pocket."],"options":["slim","thick","heavy","wide"],"correct_index":0},"audio":"Unit3/audio/slim.mp3","audio_ex0":"Unit3/audio/slim_ex0.mp3","audio_ex1":"Unit3/audio/slim_ex1.mp3"},{"word":"fact","ipa":"/fækt/","image_prompts":["A stack of books with a magnifying glass on top, a paper labeled 'Fact' sticking out","A chalkboard with the word 'Fact' written in white chalk, an eraser nearby"],"image_desc_en":"Books with a magnifying glass and a 'Fact' label; a chalkboard with the word 'Fact'.","image_desc_cn":"一堆书和放大镜，上面有写着‘事实’的标签；黑板上写着‘事实’二字。","meaning_cn":"n. 事实；真相","usage":"n. (可数名词，复数 facts)","collocations":"in fact, as a matter of fact, hard fact","preposition_combos":"fact about, fact of","examples":[{"en":"In fact, the sun rises in the east.","cn":"事实上，太阳从东方升起。"},{"en":"Check the fact before you write the report.","cn":"写报告前先核实事实。"}],"socratic_questions":[{"question":"你想强调某件事是真实存在的，不是猜测，应该用哪个名词？","answer_hint":"这个词指客观存在或已被证明的真实信息。"}],"fill_blank":{"sentences":["It is a ___ that water freezes at zero degrees."],"options":["fact","dream","story","guess"],"correct_index":0},"audio":"Unit3/audio/fact.mp3","audio_ex0":"Unit3/audio/fact_ex0.mp3","audio_ex1":"Unit3/audio/fact_ex1.mp3"},{"word":"population","ipa":"/ˌpɒpjuˈleɪʃn/","image_prompts":["A city skyline at night with thousands of tiny glowing windows, a sign reading 'Population'","A dense crowd of ants on a tree trunk, forming a line, with a small label 'Population'"],"image_desc_en":"City skyline with glowing windows and a 'Population' sign; ants on a tree trunk labeled 'Population'.","image_desc_cn":"城市天际线亮着窗户，有‘人口’标志；树干上的蚂蚁群标有‘种群’字样。","meaning_cn":"n. 人口；种群数量","usage":"n. (可数名词，常与 the 连用)","collocations":"large population, population growth, population of","preposition_combos":"population of, population in","examples":[{"en":"The population of this town is about ten thousand.","cn":"这个城镇的人口大约有一万。"},{"en":"A large population needs more schools and hospitals.","cn":"大量人口需要更多的学校和医院。"}],"socratic_questions":[{"question":"你想说一个城市里住着多少人，应该用哪个词？","answer_hint":"这个词专门用来表示某个地区居民的总数。"}],"fill_blank":{"sentences":["The ___ of China is over 1.4 billion."],"options":["population","area","weather","history"],"correct_index":0},"audio":"Unit3/audio/population.mp3","audio_ex0":"Unit3/audio/population_ex0.mp3","audio_ex1":"Unit3/audio/population_ex1.mp3"},{"word":"km","ipa":"/ˌkeɪˈem/","image_prompts":["A road sign on a highway showing '50 km' to a city, with a blue sky background","A running track with distance markers, a sign reading '1 km' on the grass"],"image_desc_en":"A highway sign reading '50 km'; a running track with a '1 km' marker.","image_desc_cn":"高速公路路牌显示‘50公里’；跑道旁草地上有‘1公里’标志。","meaning_cn":"abbr. 千米，公里（kilometer 的缩写）","usage":"n. (缩写，可数，复数 km 或 kms)","collocations":"10 km, km per hour, square km","preposition_combos":"km from, km to","examples":[{"en":"The school is about two km from my home.","cn":"学校离我家大约两公里。"},{"en":"We walked five km along the river path.","cn":"我们沿着河边小路走了五公里。"}],"socratic_questions":[{"question":"你想说从家到公园的距离是3公里，应该用哪个缩写？","answer_hint":"这是‘千米’的常用缩写，在路牌和地图上很常见。"}],"fill_blank":{"sentences":["The bridge is 1.5 ___ long."],"options":["km","kg","ml","cm"],"correct_index":0},"audio":"Unit3/audio/km.mp3","audio_ex0":"Unit3/audio/km_ex0.mp3","audio_ex1":"Unit3/audio/km_ex1.mp3"},{"word":"kilometer","ipa":"/ˈkɪləˌmiːtər/","image_prompts":["A straight road with a green signpost reading '5 km' under a clear blue sky, surrounded by fields","A running track on a sports field with distance markers every 100 meters, a white line at the 1 km point"],"image_desc_en":"A road sign showing distance in kilometers, or a track with kilometer markings.","image_desc_cn":"显示公里数的路牌，或带有公里标记的跑道。","meaning_cn":"千米，公里","usage":"n. (可数名词)","collocations":"every kilometer, within a kilometer, kilometers away","preposition_combos":"for kilometers, within kilometers of","examples":[{"en":"The school is only one kilometer from my home.","cn":"学校离我家只有一公里。"},{"en":"We walked three kilometers along the river path.","cn":"我们沿着河边小路走了三公里。"}],"socratic_questions":[{"question":"你想告诉朋友你家离学校有多远，用哪个词表示距离单位？","answer_hint":"这个词是长度单位，等于1000米，常用于描述路程。"}],"fill_blank":{"sentences":["The park is about two ___ from the train station."],"options":["kilometers","kilograms","kilowatts","millimeters"],"correct_index":0},"audio":"Unit3/audio/kilometer.mp3","audio_ex0":"Unit3/audio/kilometer_ex0.mp3","audio_ex1":"Unit3/audio/kilometer_ex1.mp3"},{"word":"average","ipa":"/ˈævərɪdʒ/","image_prompts":["A line graph on a whiteboard showing a fluctuating curve with a straight dashed line labeled 'average' across the middle","A set of five test papers with scores 78, 82, 85, 90, 95 and a calculator displaying 86.0"],"image_desc_en":"A graph with an average line, or a calculator showing the mean of several numbers.","image_desc_cn":"带有平均线的图表，或显示几个数字平均值的计算器。","meaning_cn":"平均的；平均数","usage":"adj. / n.","collocations":"average score, average height, on average","preposition_combos":"above average, below average, average of","examples":[{"en":"His average score in math this term is 85.","cn":"他这学期数学的平均分是85分。"},{"en":"On average, it takes me 20 minutes to get to school.","cn":"平均而言，我到学校需要20分钟。"}],"socratic_questions":[{"question":"老师把五次小测的成绩加起来除以5，得到的是什么？","answer_hint":"这个词表示一组数据的中间值，常用来描述一般水平。"}],"fill_blank":{"sentences":["The ___ temperature in July is 30 degrees Celsius."],"options":["average","total","maximum","minimum"],"correct_index":0},"audio":"Unit3/audio/average.mp3","audio_ex0":"Unit3/audio/average_ex0.mp3","audio_ex1":"Unit3/audio/average_ex1.mp3"},{"word":"accident","ipa":"/ˈæksɪdənt/","image_prompts":["A bicycle lying on its side on a wet road with a broken front wheel and scattered school books nearby","A cracked smartphone screen on a tiled floor with a shattered corner and glass fragments"],"image_desc_en":"A damaged bicycle on a road, or a broken phone screen on the floor.","image_desc_cn":"路上损坏的自行车，或地板上碎裂的手机屏幕。","meaning_cn":"事故；意外","usage":"n. (可数名词)","collocations":"car accident, traffic accident, have an accident","preposition_combos":"in an accident, by accident (注意区分)","examples":[{"en":"There was a serious traffic accident on the highway.","cn":"高速公路上发生了一起严重的交通事故。"},{"en":"He broke his arm in a bike accident last week.","cn":"他上周在自行车事故中摔断了胳膊。"}],"socratic_questions":[{"question":"新闻里说两辆车在十字路口相撞，这属于什么事件？","answer_hint":"这个词指突然发生的、不好的、导致伤害或损失的事件。"}],"fill_blank":{"sentences":["Luckily, no one was hurt in the ___."],"options":["accident","event","party","game"],"correct_index":0},"audio":"Unit3/audio/accident.mp3","audio_ex0":"Unit3/audio/accident_ex0.mp3","audio_ex1":"Unit3/audio/accident_ex1.mp3"},{"word":"by accident","ipa":"/baɪ ˈæksɪdənt/","image_prompts":["A glass of milk tipped over on a kitchen table with white liquid spreading across the surface","A stack of dominoes falling one after another on a wooden floor, the first one knocked by a rolling marble"],"image_desc_en":"A spilled glass of milk on a table, or dominoes falling after a marble rolls into them.","image_desc_cn":"桌上打翻的牛奶杯，或弹珠碰倒多米诺骨牌的场景。","meaning_cn":"偶然地，意外地","usage":"adv. phrase (副词短语)","collocations":"find by accident, discover by accident, happen by accident","preposition_combos":"无","examples":[{"en":"I found my lost key by accident under the sofa.","cn":"我意外地在沙发下找到了丢失的钥匙。"},{"en":"She met her old friend by accident in the supermarket.","cn":"她在超市偶然遇到了老朋友。"}],"socratic_questions":[{"question":"你本来没想找那本书，却在书包里翻到了，这叫什么？","answer_hint":"这个短语表示事情发生不是计划好的，而是碰巧。"}],"fill_blank":{"sentences":["He broke the window ___ while playing football."],"options":["by accident","on purpose","by mistake","in time"],"correct_index":0},"audio":"Unit3/audio/by_accident.mp3","audio_ex0":"Unit3/audio/by_accident_ex0.mp3","audio_ex1":"Unit3/audio/by_accident_ex1.mp3"},{"word":"expect","ipa":"/ɪkˈspekt/","image_prompts":["A calendar on a wall with a red circle around a date, a clock showing 3:00 PM nearby","A mailbox with a letter partially sticking out, sunlight casting a long shadow on the ground"],"image_desc_en":"A calendar with a circled date and a clock; a mailbox with a letter and long shadow.","image_desc_cn":"日历上圈出一个日期，旁边有钟表；邮箱里露出一封信，地面有长影子。","meaning_cn":"期待；预料；指望","usage":"v. (过去式 expected, 过去分词 expected)","collocations":"expect to do sth; expect sb to do sth; as expected","preposition_combos":"expect from; expect of","examples":[{"en":"I expect to finish my homework before dinner.","cn":"我期待在晚饭前完成作业。"},{"en":"She expects good grades from her hard work.","cn":"她期望自己的努力能换来好成绩。"}],"socratic_questions":[{"question":"你明天要考试，心里想着可能会考哪些题目，这种心理活动叫什么？","answer_hint":"这个词表示对未发生事情的推测或盼望，常接不定式或从句。"}],"fill_blank":{"sentences":["We ___ the bus to arrive at 7:30 every morning."],"options":["expect","accept","except","expert"],"correct_index":0},"audio":"Unit3/audio/expect.mp3","audio_ex0":"Unit3/audio/expect_ex0.mp3","audio_ex1":"Unit3/audio/expect_ex1.mp3"},{"word":"silver","ipa":"/ˈsɪlvər/","image_prompts":["A shiny silver spoon resting on a dark wooden table, reflecting light","A silver medal placed on a red velvet cushion, with a soft spotlight above"],"image_desc_en":"A shiny silver spoon on dark wood; a silver medal on red velvet under a spotlight.","image_desc_cn":"深色木桌上放着一把闪亮的银勺；红色天鹅绒垫上放着一枚银牌，上方有柔光。","meaning_cn":"银；银色的","usage":"n. / adj.","collocations":"silver medal; silver lining; silver jewelry","preposition_combos":"made of silver; in silver","examples":[{"en":"She wore a beautiful silver necklace to the party.","cn":"她戴着一条漂亮的银项链去派对。"},{"en":"The silver moon shone brightly over the quiet lake.","cn":"银色的月亮在宁静的湖面上明亮地照耀。"}],"socratic_questions":[{"question":"运动会上得了第二名，奖牌是什么颜色的？这种金属颜色常用来形容什么？","answer_hint":"第二名奖牌的颜色，也是贵金属的一种，常用来形容闪亮的浅灰色。"}],"fill_blank":{"sentences":["The ___ ring on her finger sparkled under the sunlight."],"options":["silver","golden","copper","iron"],"correct_index":0},"audio":"Unit3/audio/silver.mp3","audio_ex0":"Unit3/audio/silver_ex0.mp3","audio_ex1":"Unit3/audio/silver_ex1.mp3"},{"word":"lining","ipa":"/ˈlaɪnɪŋ/","image_prompts":["A jacket turned inside out, showing a soft fabric lining with a plaid pattern","A dark cloud with a bright silver edge glowing behind it in a blue sky"],"image_desc_en":"A jacket inside out with plaid lining; a dark cloud with a bright silver edge in the sky.","image_desc_cn":"一件翻过来的夹克，露出格子图案的内衬；天空中乌云边缘透出明亮的银光。","meaning_cn":"内衬；衬里","usage":"n.","collocations":"silver lining; jacket lining; coat lining","preposition_combos":"lining of; with a lining","examples":[{"en":"The coat has a warm wool lining for winter.","cn":"这件外套有温暖的羊毛内衬，适合冬天。"},{"en":"Every cloud has a silver lining, so don't worry.","cn":"每朵乌云都有银边（坏事中总有好的一面），别担心。"}],"socratic_questions":[{"question":"你最喜欢的书包里面有一层布保护书本，这层布叫什么？","answer_hint":"指衣服或包内部的那层材料，常用来比喻困境中的希望。"}],"fill_blank":{"sentences":["The bag has a waterproof ___ to keep things dry."],"options":["lining","lining","lining","lining"],"correct_index":0},"audio":"Unit3/audio/lining.mp3","audio_ex0":"Unit3/audio/lining_ex0.mp3","audio_ex1":"Unit3/audio/lining_ex1.mp3"},{"word":"silver lining","ipa":"/ˈsɪlvər ˈlaɪnɪŋ/","image_prompts":["A stormy sky with dark clouds, but a narrow strip of bright silver light breaking through at the horizon","A broken pencil lying on a desk, with a sharpened tip and a small eraser still usable"],"image_desc_en":"Dark storm clouds with a silver light strip at horizon; a broken pencil with a usable tip and eraser.","image_desc_cn":"暴风雨的乌云中，地平线处有一道银色光芒；一支断铅笔，笔尖和橡皮仍可用。","meaning_cn":"（不幸中的）一线希望","usage":"n. (固定短语)","collocations":"every cloud has a silver lining; find a silver lining","preposition_combos":"silver lining in; silver lining of","examples":[{"en":"Even after losing the game, we found a silver lining.","cn":"即使输了比赛，我们也找到了一线希望。"},{"en":"The silver lining of the rain is that the flowers will grow.","cn":"这场雨的好处是花儿会长得更好。"}],"socratic_questions":[{"question":"考试没考好，但发现自己知道了薄弱点可以改进，这种坏事中的好事叫什么？","answer_hint":"这是一个固定短语，字面意思是‘银色的边’，比喻困境中的积极面。"}],"fill_blank":{"sentences":["Every cloud has a ___, so stay positive."],"options":["silver lining","golden edge","dark shadow","bright center"],"correct_index":0},"audio":"Unit3/audio/silver_lining.mp3","audio_ex0":"Unit3/audio/silver_lining_ex0.mp3","audio_ex1":"Unit3/audio/silver_lining_ex1.mp3"},{"word":"situation","ipa":"/ˌsɪtʃuˈeɪʃən/","image_prompts":["A messy desk with scattered papers, a spilled coffee cup, and a broken pencil, representing a difficult situation","A traffic jam with many cars stopped on a rainy highway, red taillights glowing, showing a stressful situation"],"image_desc_en":"A messy desk with scattered papers, a spilled coffee cup, and a broken pencil, representing a difficult situation","image_desc_cn":"一张凌乱的书桌，散落的纸张、打翻的咖啡杯和断铅笔，代表困难局面","meaning_cn":"情况；局面；形势","usage":"n. (可数名词) 情况，局面","collocations":"in a difficult situation, improve the situation, face a situation","preposition_combos":"in a situation, situation with","examples":[{"en":"We need to find a way to improve this situation quickly.","cn":"我们需要尽快找到改善这个情况的方法。"},{"en":"The teacher helped us understand the math situation better.","cn":"老师帮助我们更好地理解了数学情况。"}],"socratic_questions":[{"question":"考试时你发现时间不够，题目还没做完，这时你处于一个什么样的状态？","answer_hint":"这个词描述的是你当前所处的具体环境或状态，不是情绪也不是动作。"}],"fill_blank":{"sentences":["The heavy rain created a dangerous ___ on the road."],"options":["situation","weather","problem","accident"],"correct_index":0},"audio":"Unit3/audio/situation.mp3","audio_ex0":"Unit3/audio/situation_ex0.mp3","audio_ex1":"Unit3/audio/situation_ex1.mp3"},{"word":"care about","ipa":"/keər əˈbaʊt/","image_prompts":["A watering can gently pouring water onto a small green plant in a pot, sunlight streaming through a window","A neatly arranged set of colorful books on a shelf, with a bookmark sticking out of one book"],"image_desc_en":"A watering can gently pouring water onto a small green plant in a pot, sunlight streaming through a window","image_desc_cn":"一个洒水壶轻轻给盆栽小绿植浇水，阳光透过窗户洒下","meaning_cn":"关心；在乎；在意","usage":"v. (短语动词) 关心，在乎 (过去式 cared about, 过去分词 cared about)","collocations":"care about others, care about grades, care about the environment","preposition_combos":"care about + 名词/代词","examples":[{"en":"She really cares about her friends' feelings and needs.","cn":"她真的很在乎朋友们的感受和需求。"},{"en":"Do you care about protecting the environment in your daily life?","cn":"你在日常生活中关心环境保护吗？"}],"socratic_questions":[{"question":"朋友生病了，你主动去照顾他、问候他，这说明你对他怎么样？","answer_hint":"这个词组表达的是内心对某人或某事的重视和在意，不是简单的喜欢。"}],"fill_blank":{"sentences":["Many students ___ their exam results very much."],"options":["care about","look for","think of","worry about"],"correct_index":0},"audio":"Unit3/audio/care_about.mp3","audio_ex0":"Unit3/audio/care_about_ex0.mp3","audio_ex1":"Unit3/audio/care_about_ex1.mp3"},{"word":"reach","ipa":"/riːtʃ/","image_prompts":["A hand stretching toward a red apple on a high tree branch, fingertips almost touching the fruit","A long road stretching toward a distant mountain peak under a clear blue sky"],"image_desc_en":"A hand stretching toward a red apple on a high tree branch, fingertips almost touching the fruit","image_desc_cn":"一只手伸向高树枝上的红苹果，指尖几乎触到果实","meaning_cn":"到达；够到；联系","usage":"v. (过去式 reached, 过去分词 reached) 到达；够到；联系","collocations":"reach school, reach a goal, reach someone by phone","preposition_combos":"reach for, reach to, reach out","examples":[{"en":"We finally reached the top of the mountain after two hours.","cn":"两小时后我们终于到达了山顶。"},{"en":"Can you reach the book on the top shelf for me?","cn":"你能帮我把顶层书架上的书够下来吗？"}],"socratic_questions":[{"question":"你坐公交车去学校，下车后走了五分钟，终于到了校门口，这个动作叫什么？","answer_hint":"这个词表示经过一段路程后最终抵达某个地点，强调结果。"}],"fill_blank":{"sentences":["The train will ___ the station at 8:30 in the morning."],"options":["reach","arrive","get","come"],"correct_index":0},"audio":"Unit3/audio/reach.mp3","audio_ex0":"Unit3/audio/reach_ex0.mp3","audio_ex1":"Unit3/audio/reach_ex1.mp3"},{"word":"reach for","ipa":"/riːtʃ fɔːr/","image_prompts":["A cat stretching one paw toward a dangling toy mouse on a string, claws extended","A hand reaching toward a glass of water on a bedside table, early morning light"],"image_desc_en":"A cat stretching one paw toward a dangling toy mouse on a string, claws extended","image_desc_cn":"一只猫伸出一只爪子，抓向悬挂在绳子上的玩具老鼠，爪子张开","meaning_cn":"伸手去拿；努力争取","usage":"v. (短语动词) 伸手去拿；努力争取 (过去式 reached for, 过去分词 reached for)","collocations":"reach for the stars, reach for a book, reach for a goal","preposition_combos":"reach for + 名词","examples":[{"en":"She reached for her phone when it started ringing.","cn":"手机响起时她伸手去拿。"},{"en":"Always reach for your dreams, no matter how hard it is.","cn":"无论多难，都要努力追求你的梦想。"}],"socratic_questions":[{"question":"你坐在沙发上，想拿茶几上的遥控器，你会做什么动作？","answer_hint":"这个短语强调伸手去够某物的动作，和单纯的'到达'不同。"}],"fill_blank":{"sentences":["The baby ___ the colorful toy on the table."],"options":["reached for","looked at","ran to","jumped over"],"correct_index":0},"audio":"Unit3/audio/reach_for.mp3","audio_ex0":"Unit3/audio/reach_for_ex0.mp3","audio_ex1":"Unit3/audio/reach_for_ex1.mp3"},{"word":"touch","ipa":"/tʌtʃ/","image_prompts":["A hand gently pressing a piano key, finger tip making contact with white key surface, soft lighting","A fingertip lightly resting on a smooth glass window pane, condensation droplets around the contact point"],"image_desc_en":"A close-up of a finger pressing a piano key, with the key slightly depressed.","image_desc_cn":"手指按压钢琴键的特写，琴键微微下陷。","meaning_cn":"触摸；接触；感动","usage":"v. (过去式 touched, 过去分词 touched); n.","collocations":"keep in touch, lose touch, touch screen, a personal touch","preposition_combos":"touch with, touch on","examples":[{"en":"Please do not touch the paintings in the museum.","cn":"请勿触摸博物馆里的画作。"},{"en":"Her kind words touched my heart deeply.","cn":"她亲切的话语深深触动了我的心。"}],"socratic_questions":[{"question":"你在博物馆参观时，展品旁边有个牌子写着“请勿___”，这个动作是用手去接触物品，是什么词？","answer_hint":"用手接触某物，就是 touch。"}],"fill_blank":{"sentences":["The soft music ___ everyone in the room."],"options":["touched","pushed","pulled","shouted"],"correct_index":0},"audio":"Unit3/audio/touch.mp3","audio_ex0":"Unit3/audio/touch_ex0.mp3","audio_ex1":"Unit3/audio/touch_ex1.mp3"},{"word":"lend","ipa":"/lend/","image_prompts":["A library desk with a book being slid across the counter from one side to the other, library card visible","A hand passing a red pencil to another hand across a wooden desk, pencil tip pointing forward"],"image_desc_en":"A book being passed across a library counter, with a library card on the desk.","image_desc_cn":"一本书在图书馆柜台上被递过去，桌上有借书卡。","meaning_cn":"借出；借给","usage":"v. (过去式 lent, 过去分词 lent)","collocations":"lend a hand, lend money, lend support, lend an ear","preposition_combos":"lend to","examples":[{"en":"Can you lend me your pen for a moment?","cn":"你能把笔借我用一下吗？"},{"en":"My friend lent me her bike for the weekend.","cn":"我朋友把她的自行车借给我周末用。"}],"socratic_questions":[{"question":"你的同桌忘记带橡皮了，你把自己的橡皮暂时给他用，这个动作是“借出”还是“借入”？对应的英文是什么？","answer_hint":"把东西给别人用是“借出”，英文是 lend。"}],"fill_blank":{"sentences":["Could you ___ me your dictionary for a minute?"],"options":["lend","borrow","keep","give"],"correct_index":0},"audio":"Unit3/audio/lend.mp3","audio_ex0":"Unit3/audio/lend_ex0.mp3","audio_ex1":"Unit3/audio/lend_ex1.mp3"},{"word":"Vancouver","ipa":"/vænˈkuːvər/","image_prompts":["A panoramic view of Vancouver harbor with snow-capped mountains in the background and glass skyscrapers","Stanley Park in Vancouver with tall cedar trees and a wooden bridge over a small creek"],"image_desc_en":"A panoramic view of Vancouver harbor with snowy mountains behind glass skyscrapers.","image_desc_cn":"温哥华港口的全景，玻璃摩天大楼背后是雪山。","meaning_cn":"温哥华（加拿大城市）","usage":"n. (专有名词)","collocations":"fly to Vancouver, Vancouver Island, downtown Vancouver","preposition_combos":"in Vancouver, from Vancouver","examples":[{"en":"My cousin lives in Vancouver, Canada.","cn":"我的表兄住在加拿大温哥华。"},{"en":"We took a ferry from Vancouver to Victoria Island.","cn":"我们从温哥华乘渡轮去维多利亚岛。"}],"socratic_questions":[{"question":"有一个加拿大城市以港口和雪山闻名，2010年冬奥会曾在那里举办，这个城市叫什么？","answer_hint":"加拿大西海岸的著名城市，英文是 Vancouver。"}],"fill_blank":{"sentences":["The flight from Beijing to ___ takes about eleven hours."],"options":["Vancouver","London","Tokyo","Sydney"],"correct_index":0},"audio":"Unit3/audio/Vancouver.mp3","audio_ex0":"Unit3/audio/Vancouver_ex0.mp3","audio_ex1":"Unit3/audio/Vancouver_ex1.mp3"}]},{"unit":4,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"goodness","ipa":"/ˈɡʊdnəs/","image_prompts":["A bowl of fresh fruit on a wooden table with a small sign reading 'Natural Goodness'","A jar of honey labeled 'Pure Goodness' next to a spoon dripping golden honey"],"image_desc_en":"A fruit bowl with a 'Natural Goodness' sign; a honey jar labeled 'Pure Goodness' with dripping honey.","image_desc_cn":"一碗水果旁有'天然营养'的牌子；一瓶蜂蜜标着'纯正精华'，蜂蜜正滴落。","meaning_cn":"善良；精华；营养（感叹词：天哪）","usage":"n. (不可数名词)；也可作感叹词 interj.","collocations":"thank goodness (谢天谢地), goodness knows (天知道), for goodness' sake (看在老天份上)","preposition_combos":"goodness of (……的精华/善良)","examples":[{"en":"Thank goodness! The rain stopped before our picnic.","cn":"谢天谢地！雨在我们野餐前停了。"},{"en":"The goodness of fresh vegetables is good for health.","cn":"新鲜蔬菜的营养对健康有益。"}],"socratic_questions":[{"question":"你考试通过了，非常开心，想表达'谢天谢地'，应该用哪个词开头？","answer_hint":"用'Thank goodness'，表示庆幸和感激。"}],"fill_blank":{"sentences":["___! I found my lost wallet under the desk."],"options":["Goodness","Sadly","Quickly","Never"],"correct_index":0},"audio":"Unit4/audio/goodness.mp3","audio_ex0":"Unit4/audio/goodness_ex0.mp3","audio_ex1":"Unit4/audio/goodness_ex1.mp3"},{"word":"tool","ipa":"/tuːl/","image_prompts":["A wooden toolbox with a hammer, screwdriver, and wrench arranged neatly inside","A set of colorful plastic geometry tools (ruler, protractor, compass) on a white desk"],"image_desc_en":"A wooden toolbox with hammer and screwdriver; colorful geometry tools on a white desk.","image_desc_cn":"一个木制工具箱里整齐放着锤子和螺丝刀；白色桌面上放着彩色几何工具。","meaning_cn":"工具；用具","usage":"n. (可数名词，复数形式 tools)","collocations":"a useful tool (有用的工具), a tool box (工具箱), use a tool (使用工具)","preposition_combos":"tool for (用于……的工具), tool of (……的工具)","examples":[{"en":"A dictionary is a helpful tool for learning English.","cn":"词典是学习英语的有用工具。"},{"en":"My father keeps his tools in a red box.","cn":"我父亲把他的工具放在一个红色箱子里。"}],"socratic_questions":[{"question":"你想修好一把椅子，需要锤子和螺丝刀，这些东西统称什么？","answer_hint":"这些东西叫工具（tool），用来完成修理工作。"}],"fill_blank":{"sentences":["A computer is a powerful ___ for students to do research."],"options":["tool","toy","trick","trip"],"correct_index":0},"audio":"Unit4/audio/tool.mp3","audio_ex0":"Unit4/audio/tool_ex0.mp3","audio_ex1":"Unit4/audio/tool_ex1.mp3"},{"word":"actually","ipa":"/ˈæktʃuəli/","image_prompts":["A calendar with a circled date and a red cross over a previous wrong date, with the word 'Actually' written next to it","A signpost pointing in two directions, one labeled 'Wrong Way' crossed out, the other labeled 'Correct Way' with 'Actually' arrow"],"image_desc_en":"A calendar with a corrected date and 'Actually' note; a signpost with 'Wrong Way' crossed out and 'Actually' pointing to correct path.","image_desc_cn":"日历上纠正了日期并写着'Actually'；路标上'错误方向'被划掉，'Actually'指向正确方向。","meaning_cn":"实际上；事实上（用于纠正或强调）","usage":"adv. (副词，常用于句首或句中)","collocations":"actually think (实际上认为), actually mean (实际意思是), actually happen (实际发生)","preposition_combos":"无常见介词搭配","examples":[{"en":"I thought the test was hard, but actually it was easy.","cn":"我以为考试很难，但实际上很简单。"},{"en":"He said he was busy, but actually he was playing games.","cn":"他说他很忙，但实际上他在玩游戏。"}],"socratic_questions":[{"question":"你朋友以为今天是周三，但你知道今天是周四，你想纠正他，可以用哪个词开头？","answer_hint":"用'Actually'，表示'实际上'，用来纠正错误信息。"}],"fill_blank":{"sentences":["She looks young, but ___ she is over forty years old."],"options":["actually","usually","finally","quickly"],"correct_index":0},"audio":"Unit4/audio/actually.mp3","audio_ex0":"Unit4/audio/actually_ex0.mp3","audio_ex1":"Unit4/audio/actually_ex1.mp3"},{"word":"shoot","ipa":"/ʃuːt/","image_prompts":["A basketball flying through a hoop with net swishing, gymnasium background, bright lighting","A camera on a tripod with a red record button pressed, video timeline bars on a monitor"],"image_desc_en":"A basketball going through a hoop with net movement; a camera recording with a pressed button.","image_desc_cn":"一个篮球穿过篮筐，网摆动；一台摄像机按下录制按钮。","meaning_cn":"v. 投篮；拍摄（照片/视频）","usage":"v. (过去式 shot, 过去分词 shot)","collocations":"shoot a basket, shoot a video, shoot photos","preposition_combos":"shoot at, shoot for","examples":[{"en":"He can shoot three-pointers from far away.","cn":"他能从远处投三分球。"},{"en":"We will shoot a short film for the class project.","cn":"我们将为班级项目拍摄一部短片。"}],"socratic_questions":[{"question":"在篮球比赛中，你想把球扔进篮筐得分，这个动作叫什么？","answer_hint":"这个动作和“发射”有关，篮球术语中常用这个词表示投篮。"}],"fill_blank":{"sentences":["The player ___ the ball and scored two points."],"options":["shot","threw","kicked","passed"],"correct_index":0},"audio":"Unit4/audio/shoot.mp3","audio_ex0":"Unit4/audio/shoot_ex0.mp3","audio_ex1":"Unit4/audio/shoot_ex1.mp3"},{"word":"appear","ipa":"/əˈpɪr/","image_prompts":["A sun rising over a calm ocean horizon, golden light spreading across the water","A magician's hat on a table with a white rabbit popping out, stage spotlight"],"image_desc_en":"A sun rising above the ocean; a rabbit emerging from a magician's hat.","image_desc_cn":"太阳从海平面升起；一只兔子从魔术师帽子里出现。","meaning_cn":"v. 出现；似乎","usage":"v. (过去式 appeared, 过去分词 appeared)","collocations":"appear in, appear on, appear to be","preposition_combos":"appear at, appear from","examples":[{"en":"A rainbow appeared after the heavy rain stopped.","cn":"大雨停后，一道彩虹出现了。"},{"en":"Your name will appear on the list tomorrow.","cn":"你的名字明天会出现在名单上。"}],"socratic_questions":[{"question":"雨过天晴，天空突然多了一道彩色弧线，这个现象用哪个词描述？","answer_hint":"这个词表示“从看不见变成看得见”，彩虹就是突然出现的。"}],"fill_blank":{"sentences":["The moon ___ in the dark sky after sunset."],"options":["appeared","disappeared","shone","hid"],"correct_index":0},"audio":"Unit4/audio/appear.mp3","audio_ex0":"Unit4/audio/appear_ex0.mp3","audio_ex1":"Unit4/audio/appear_ex1.mp3"},{"word":"feel free","ipa":"/fiːl friː/","image_prompts":["An open library door with a sign reading 'Welcome' in warm colors, bookshelves inside","A coffee cup on a table with a note saying 'Help yourself' next to a plate of cookies"],"image_desc_en":"An open library door with a welcome sign; a coffee cup and a note saying 'Help yourself' with cookies.","image_desc_cn":"一扇敞开的图书馆门，上有欢迎标志；一杯咖啡和一张写着“请自便”的纸条，旁边有饼干。","meaning_cn":"phr. 随意；别客气（用于允许或邀请）","usage":"固定短语，后接动词原形","collocations":"feel free to ask, feel free to join, feel free to use","preposition_combos":"无","examples":[{"en":"Feel free to ask me any questions about the homework.","cn":"关于作业，请随意问我任何问题。"},{"en":"Feel free to use my dictionary when you need it.","cn":"你需要时，请随意用我的字典。"}],"socratic_questions":[{"question":"老师对你说“有问题随时可以问我”，用哪个短语表达这种“不用拘束”的意思？","answer_hint":"这个短语由“感觉”和“自由”组成，表示让对方放松、随意行动。"}],"fill_blank":{"sentences":["___ to borrow any book from the shelf."],"options":["Feel free","Be careful","Try hard","Hurry up"],"correct_index":0},"audio":"Unit4/audio/feel_free.mp3","audio_ex0":"Unit4/audio/feel_free_ex0.mp3","audio_ex1":"Unit4/audio/feel_free_ex1.mp3"},{"word":"land","ipa":"/lænd/","image_prompts":["An airplane touching down on a runway with wheels smoking slightly, sunset sky","A bird perched on a tree branch with wings folded, green leaves around"],"image_desc_en":"An airplane landing on a runway with wheel smoke; a bird sitting on a tree branch.","image_desc_cn":"一架飞机降落在跑道上，轮子冒烟；一只鸟停在树枝上。","meaning_cn":"v. 着陆；降落；n. 陆地","usage":"v. (过去式 landed, 过去分词 landed); n. 不可数名词","collocations":"land safely, land on, land at","preposition_combos":"land in, land on","examples":[{"en":"The plane will land at the airport in ten minutes.","cn":"飞机将在十分钟后降落在机场。"},{"en":"A butterfly landed on the flower in the garden.","cn":"一只蝴蝶降落在花园的花上。"}],"socratic_questions":[{"question":"飞机从天空回到地面，这个动作叫什么？","answer_hint":"这个词和“地面”有关，表示从空中到达地面。"}],"fill_blank":{"sentences":["The helicopter ___ on the roof of the hospital."],"options":["landed","flew","took off","crashed"],"correct_index":0},"audio":"Unit4/audio/land.mp3","audio_ex0":"Unit4/audio/land_ex0.mp3","audio_ex1":"Unit4/audio/land_ex1.mp3"},{"word":"African","ipa":"/ˈæfrɪkən/","image_prompts":["A close-up of a handwoven African kente cloth with bright yellow, green, and red geometric patterns on a wooden table","A clay pot with traditional African tribal carvings sitting on dry cracked earth under a bright sun"],"image_desc_en":"African kente cloth or carved clay pot","image_desc_cn":"非洲肯特布或雕刻陶罐","meaning_cn":"非洲的；非洲人","usage":"adj. / n.","collocations":"African culture, African wildlife, African country","preposition_combos":"from Africa, in Africa","examples":[{"en":"The African elephant has very large ears and a long trunk.","cn":"非洲象有非常大的耳朵和长鼻子。"},{"en":"Our class learned about African music and traditional dances.","cn":"我们班学习了非洲音乐和传统舞蹈。"}],"socratic_questions":[{"question":"小明在地理课上看到一张地图，上面标着埃及、肯尼亚和南非。这些国家属于哪个大洲？","answer_hint":"这些国家都在非洲，所以用 African 来形容它们的地理位置。"}],"fill_blank":{"sentences":["The ___ savanna is home to lions, giraffes, and zebras."],"options":["African","Asian","European","Australian"],"correct_index":0},"audio":"Unit4/audio/African.mp3","audio_ex0":"Unit4/audio/African_ex0.mp3","audio_ex1":"Unit4/audio/African_ex1.mp3"},{"word":"rose","ipa":"/roʊz/","image_prompts":["A single red rose in a clear glass vase on a windowsill with soft morning light filtering through the curtain","A bouquet of pink and white roses tied with a ribbon lying on a wooden picnic table"],"image_desc_en":"A red rose in a vase or a bouquet of roses on a table","image_desc_cn":"花瓶中的红玫瑰或桌上的玫瑰花束","meaning_cn":"玫瑰；蔷薇","usage":"n. (复数 roses)","collocations":"red rose, rose garden, rose petals","preposition_combos":"a bunch of roses, rose in bloom","examples":[{"en":"My mother loves the smell of fresh roses in the garden.","cn":"我妈妈喜欢花园里新鲜玫瑰的香味。"},{"en":"He gave her a single red rose on Valentine's Day.","cn":"他在情人节给了她一朵红玫瑰。"}],"socratic_questions":[{"question":"母亲节快到了，你想送妈妈一种花，它通常代表爱情和美丽，花瓣层层叠叠，还有刺。这是什么花？","answer_hint":"这种花就是 rose，常见于节日礼物和花园中。"}],"fill_blank":{"sentences":["She picked a beautiful ___ from the garden for her desk."],"options":["rose","tulip","sunflower","lily"],"correct_index":0},"audio":"Unit4/audio/rose.mp3","audio_ex0":"Unit4/audio/rose_ex0.mp3","audio_ex1":"Unit4/audio/rose_ex1.mp3"},{"word":"peony","ipa":"/ˈpiːəni/","image_prompts":["A large pink peony flower fully bloomed in a ceramic vase on a white table, petals overlapping softly","A peony bush in a sunny garden with deep green leaves and several round buds about to open"],"image_desc_en":"A pink peony in a vase or a peony bush in a garden","image_desc_cn":"花瓶中的粉色牡丹或花园里的牡丹丛","meaning_cn":"牡丹；芍药","usage":"n. (复数 peonies)","collocations":"peony flower, peony garden, peony season","preposition_combos":"a peony in bloom, peonies in the garden","examples":[{"en":"The peony is often called the king of flowers in China.","cn":"牡丹在中国常被称为花中之王。"},{"en":"We saw many beautiful peonies in the park last spring.","cn":"去年春天我们在公园里看到了许多美丽的牡丹。"}],"socratic_questions":[{"question":"语文课上学到一句诗‘唯有牡丹真国色’，这种花花朵很大，颜色鲜艳，被称为富贵花。它是什么？","answer_hint":"这种花就是 peony，在中国文化中象征富贵和繁荣。"}],"fill_blank":{"sentences":["The ___ in the botanical garden bloomed in late April."],"options":["peony","cactus","orchid","daisy"],"correct_index":0},"audio":"Unit4/audio/peony.mp3","audio_ex0":"Unit4/audio/peony_ex0.mp3","audio_ex1":"Unit4/audio/peony_ex1.mp3"},{"word":"lotus","ipa":"/ˈloʊtəs/","image_prompts":["A pink lotus flower floating on a calm pond with large round green leaves and
