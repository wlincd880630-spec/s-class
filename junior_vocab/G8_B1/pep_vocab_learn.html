ming in","A pair of dice resting on a green felt table, one showing six dots, the other showing one dot"],"image_desc_en":"A golden lottery ticket on a wooden table with coffee and morning sunlight; two dice on green felt showing six and one.","image_desc_cn":"一张金色彩票放在木桌上，旁边有一杯咖啡，晨光洒入；一对骰子落在绿色毛毡桌上，一个显示六点，一个显示一点。","meaning_cn":"机会；可能性；偶然","usage":"n. (可数/不可数名词) 机会；可能性；偶然","collocations":"by chance, take a chance, have a chance to do","preposition_combos":"chance of, chance for, chance to do","examples":[{"en":"I had a chance to visit the science museum last weekend.","cn":"上周末我有机会参观了科学博物馆。"},{"en":"There is a good chance of rain tomorrow afternoon.","cn":"明天下午很有可能下雨。"}],"socratic_questions":[{"question":"如果你在考试前突然得知可以补考一次，你会用哪个词来形容这个难得的机遇？","answer_hint":"这个词表示可以做某事的时机或可能性，常与have或take搭配。"}],"fill_blank":{"sentences":["I hope I get a ___ to travel to Beijing this summer."],"options":["chance","change","choice","charge"],"correct_index":0},"audio":"Unit8/audio/chance.mp3","audio_ex0":"Unit8/audio/chance_ex0.mp3","audio_ex1":"Unit8/audio/chance_ex1.mp3"},{"word":"meeting","ipa":"/ˈmiːtɪŋ/","image_prompts":["A long wooden conference table with notebooks and water glasses, a whiteboard with colorful markers in the background","A round table with four chairs in a bright room, a clock on the wall showing 3:00 PM"],"image_desc_en":"A long wooden conference table with notebooks and water glasses, a whiteboard with markers; a round table with four chairs and a clock showing 3:00 PM.","image_desc_cn":"一张长木会议桌，上面有笔记本和水杯，背景是带彩色马克笔的白板；一张圆桌配四把椅子，墙上的钟显示下午3点。","meaning_cn":"会议；会面；集合","usage":"n. (可数名词) 会议；会面；集合","collocations":"have a meeting, attend a meeting, class meeting","preposition_combos":"meeting with, meeting about, at a meeting","examples":[{"en":"We will have a class meeting on Friday afternoon.","cn":"我们将在周五下午开班会。"},{"en":"The sports club meeting starts at four o'clock.","cn":"体育俱乐部的会议四点开始。"}],"socratic_questions":[{"question":"班长通知大家放学后留下来讨论运动会的事情，这种集体讨论活动叫什么？","answer_hint":"这个词指一群人聚在一起讨论事情，常与have或hold搭配。"}],"fill_blank":{"sentences":["The school ___ will be held in the library tomorrow."],"options":["meeting","eating","sleeping","running"],"correct_index":0},"audio":"Unit8/audio/meeting.mp3","audio_ex0":"Unit8/audio/meeting_ex0.mp3","audio_ex1":"Unit8/audio/meeting_ex1.mp3"},{"word":"difficulty","ipa":"/ˈdɪfɪkəlti/","image_prompts":["A tangled pile of earphone wires on a white desk, a pair of scissors nearby","A jigsaw puzzle with one piece missing in the center, scattered pieces on a wooden table"],"image_desc_en":"A tangled pile of earphone wires on a white desk with scissors nearby; a jigsaw puzzle missing one center piece, pieces scattered on wood.","image_desc_cn":"白色桌上一团缠绕的耳机线，旁边有一把剪刀；一个拼图缺了中心一块，碎片散落在木桌上。","meaning_cn":"困难；难题；困境","usage":"n. (可数/不可数名词) 困难；难题；困境","collocations":"have difficulty (in) doing, with difficulty, face difficulties","preposition_combos":"difficulty in, difficulty with, without difficulty","examples":[{"en":"She had difficulty finishing the math homework on time.","cn":"她按时完成数学作业有困难。"},{"en":"He climbed the mountain with great difficulty.","cn":"他非常艰难地爬上了山。"}],"socratic_questions":[{"question":"当你做一道复杂的物理题时，感觉怎么想都想不出答案，这种状态可以用哪个词描述？","answer_hint":"这个词表示做某事时遇到的障碍或麻烦，常与have或with搭配。"}],"fill_blank":{"sentences":["I have ___ understanding this English grammar rule."],"options":["difficulty","difference","confidence","importance"],"correct_index":0},"audio":"Unit8/audio/difficulty.mp3","audio_ex0":"Unit8/audio/difficulty_ex0.mp3","audio_ex1":"Unit8/audio/difficulty_ex1.mp3"},{"word":"right","ipa":"/raɪt/","image_prompts":["A wooden arrow sign pointing to the right on a foggy forest path, moss on the post","A hand-drawn checkmark in green ink on a white paper, symbol of correct answer"],"image_desc_en":"A directional sign pointing right or a green checkmark on paper.","image_desc_cn":"指向右边的路标或纸上的绿色对勾。","meaning_cn":"正确的；右边的；权利；向右","usage":"adj. / n. / adv. (比较级 righter, 最高级 rightest)","collocations":"right answer, right side, human rights, turn right","preposition_combos":"on the right, to the right of","examples":[{"en":"Turn right at the second traffic light, please.","cn":"请在第二个红绿灯处右转。"},{"en":"Every student has the right to ask questions.","cn":"每个学生都有提问的权利。"}],"socratic_questions":[{"question":"考试时你选了一个选项，老师批改后画了一个对勾，这个对勾表示什么？","answer_hint":"表示答案正确，即“right”的意思。"}],"fill_blank":{"sentences":["Please turn ___ at the next corner to reach the library."],"options":["right","left","straight","back"],"correct_index":0},"audio":"Unit8/audio/right.mp3","audio_ex0":"Unit8/audio/right_ex0.mp3","audio_ex1":"Unit8/audio/right_ex1.mp3"},{"word":"line","ipa":"/laɪn/","image_prompts":["A long queue of shopping carts lined up outside a supermarket entrance, metal handles reflecting sunlight","A straight white line painted on a dark asphalt road, stretching to the horizon under a blue sky"],"image_desc_en":"A queue of carts or a painted road line.","image_desc_cn":"一排购物车或道路上的一条白线。","meaning_cn":"线；排；队伍；台词","usage":"n. (复数 lines) / v. (过去式 lined, 过去分词 lined)","collocations":"wait in line, draw a line, line up, read between the lines","preposition_combos":"in line, on the line, out of line","examples":[{"en":"We had to wait in line for twenty minutes.","cn":"我们不得不排队等了二十分钟。"},{"en":"Please draw a straight line under the title.","cn":"请在标题下面画一条直线。"}],"socratic_questions":[{"question":"在食堂打饭时，大家一个接一个地站着，这种排列叫什么？","answer_hint":"这种一个接一个的排列就是“line”（队伍）。"}],"fill_blank":{"sentences":["The teacher asked us to stand in a straight ___."],"options":["line","circle","square","row"],"correct_index":0},"audio":"Unit8/audio/line.mp3","audio_ex0":"Unit8/audio/line_ex0.mp3","audio_ex1":"Unit8/audio/line_ex1.mp3"},{"word":"drop sb a line","ipa":"/drɒp ˈsʌmbədi ə laɪn/","image_prompts":["An envelope with a red wax seal lying on a wooden table next to a fountain pen","A smartphone screen showing a text message composition with a paper airplane send icon"],"image_desc_en":"An envelope with wax seal or a phone screen with a message icon.","image_desc_cn":"带火漆封的信封或显示短信图标的手机屏幕。","meaning_cn":"给某人写信/发短信（非正式）","usage":"动词短语 (过去式 dropped, 过去分词 dropped)","collocations":"drop me a line, drop a line to","preposition_combos":"drop a line to sb","examples":[{"en":"Drop me a line when you arrive in Beijing.","cn":"你到北京后给我写封信。"},{"en":"I will drop you a line about the party details.","cn":"我会发短信告诉你派对细节。"}],"socratic_questions":[{"question":"暑假你和朋友分开，你想让他到了新地方后联系你，你会怎么说？","answer_hint":"用“drop sb a line”表示写信或发消息联系，很口语化。"}],"fill_blank":{"sentences":["Please ___ when you have time to chat."],"options":["drop me a line","call me back","visit me","send a gift"],"correct_index":0},"audio":"Unit8/audio/drop_sb_a_line.mp3","audio_ex0":"Unit8/audio/drop_sb_a_line_ex0.mp3","audio_ex1":"Unit8/audio/drop_sb_a_line_ex1.mp3"},{"word":"detail","ipa":"/ˈdiːteɪl/","image_prompts":["A magnifying glass over a complex blueprint showing tiny measurements and annotations","A close-up photo of a woven fabric pattern with visible threads and color variations"],"image_desc_en":"A magnifying glass on a blueprint or a close-up of fabric threads.","image_desc_cn":"放大镜下的蓝图细节或织物特写。","meaning_cn":"细节；详情","usage":"n. (复数 details) / v. (过去式 detailed, 过去分词 detailed)","collocations":"in detail, pay attention to detail, go into detail","preposition_combos":"in detail, with detail","examples":[{"en":"Please describe your plan in more detail.","cn":"请更详细地描述你的计划。"},{"en":"The report includes every small detail of the event.","cn":"报告包含了活动的每一个小细节。"}],"socratic_questions":[{"question":"写作文时，老师让你把场景写得更具体，比如颜色、声音，这些具体内容叫什么？","answer_hint":"这些具体的内容就是“detail”（细节）。"}],"fill_blank":{"sentences":["The teacher asked us to read the instructions in ___."],"options":["detail","speed","silence","anger"],"correct_index":0},"audio":"Unit8/audio/detail.mp3","audio_ex0":"Unit8/audio/detail_ex0.mp3","audio_ex1":"Unit8/audio/detail_ex1.mp3"},{"word":"reunion","ipa":"/riːˈjuːniən/","image_prompts":["A large round dining table covered with a white tablecloth, multiple empty plates and chopsticks arranged around it, warm yellow lighting from a hanging lamp above","A stack of old photo albums tied with a red ribbon on a wooden shelf, dust particles floating in a beam of sunlight"],"image_desc_en":"A dining table set for a family gathering with many plates and chopsticks under a warm lamp; a stack of old photo albums tied with a red ribbon on a dusty shelf.","image_desc_cn":"一张摆满碗筷、暖灯照耀下的团圆饭桌；一摞用红丝带捆扎的旧相册放在落灰的木架上。","meaning_cn":"n. 团圆；重聚","usage":"n. (可数名词，常与 family 连用)","collocations":"family reunion, class reunion, have a reunion","preposition_combos":"reunion with, reunion of","examples":[{"en":"Our family reunion dinner on New Year's Eve is always warm.","cn":"我们除夕夜的团圆饭总是很温馨。"},{"en":"The class reunion brought many old friends back together.","cn":"这次班级重聚让许多老朋友又聚在了一起。"}],"socratic_questions":[{"question":"春节时，全家人从各地赶回老家一起吃年夜饭，这种场景叫什么？","answer_hint":"强调分开后又聚在一起，尤其是家庭或班级的团聚。"}],"fill_blank":{"sentences":["The ___ dinner was held at a big restaurant near the train station."],"options":["reunion","meeting","party","conference"],"correct_index":0},"audio":"Unit8/audio/reunion.mp3","audio_ex0":"Unit8/audio/reunion_ex0.mp3","audio_ex1":"Unit8/audio/reunion_ex1.mp3"},{"word":"seriously","ipa":"/ˈsɪriəsli/","image_prompts":["A pair of round eyeglasses resting on an open textbook with a red pen placed next to it, bright desk lamp illuminating the page","A whiteboard covered with dense math equations and a red 'IMPORTANT' stamp mark in the corner"],"image_desc_en":"Eyeglasses on an open textbook with a red pen under a bright desk lamp; a whiteboard full of math equations with a red 'IMPORTANT' stamp.","image_desc_cn":"一副眼镜放在摊开的课本和红笔旁，台灯明亮；一块写满数学公式的白板，角落有红色‘重要’印章。","meaning_cn":"adv. 认真地；严重地","usage":"adv. (形容词 serious → 副词 seriously)","collocations":"take seriously, seriously consider, seriously ill","preposition_combos":"think seriously about, take something seriously","examples":[{"en":"You should take your homework seriously every day.","cn":"你应该每天认真对待你的家庭作业。"},{"en":"The doctor said the patient was seriously injured in the accident.","cn":"医生说病人在事故中受了重伤。"}],"socratic_questions":[{"question":"老师提醒你要用心对待每一次考试复习，不要马虎，应该用什么词来形容这种态度？","answer_hint":"表示‘认真地’，强调态度严肃、不敷衍。"}],"fill_blank":{"sentences":["If you don't study ___, you may fail the final exam."],"options":["seriously","happily","quickly","loudly"],"correct_index":0},"audio":"Unit8/audio/seriously.mp3","audio_ex0":"Unit8/audio/seriously_ex0.mp3","audio_ex1":"Unit8/audio/seriously_ex1.mp3"},{"word":"training","ipa":"/ˈtreɪnɪŋ/","image_prompts":["A pair of running shoes placed on a rubber track with white lane markings, morning sunlight casting long shadows","A set of dumbbells neatly arranged on a metal rack in a gym, water bottle and towel on a bench nearby"],"image_desc_en":"Running shoes on a rubber track with lane markings under morning sunlight; dumbbells on a rack with a water bottle and towel on a gym bench.","image_desc_cn":"一双跑鞋放在有白色跑道的橡胶跑道上，晨光投下长影；哑铃整齐排列在健身房架子上，旁边长凳上有水瓶和毛巾。","meaning_cn":"n. 训练；培训","usage":"n. (不可数名词，动词 train → 名词 training)","collocations":"training program, training session, physical training","preposition_combos":"training for, training in","examples":[{"en":"The soccer team has training every afternoon after school.","cn":"足球队每天下午放学后都有训练。"},{"en":"Good training helps you improve your skills step by step.","cn":"好的训练能帮助你一步步提高技能。"}],"socratic_questions":[{"question":"为了在校运动会上取得好成绩，你每天放学后都去操场跑步、做俯卧撑，这个过程叫什么？","answer_hint":"指为了提升某项能力而进行的系统练习，常与体育或技能相关。"}],"fill_blank":{"sentences":["The basketball team's ___ starts at 4 p.m. every Tuesday."],"options":["training","meeting","party","class"],"correct_index":0},"audio":"Unit8/audio/training.mp3","audio_ex0":"Unit8/audio/training_ex0.mp3","audio_ex1":"Unit8/audio/training_ex1.mp3"},{"word":"nervous","ipa":"/ˈnɜːrvəs/","image_prompts":["A tightly clenched fist with white knuckles resting on a wooden desk, soft lamp light","A stack of unopened exam papers with a single drop of sweat on the envelope, gray background"],"image_desc_en":"A clenched fist on a desk; a sweaty exam envelope.","image_desc_cn":"桌上紧握的拳头；带汗渍的考试信封。","meaning_cn":"紧张的；焦虑不安的","usage":"adj. (比较级 more nervous, 最高级 most nervous)","collocations":"feel nervous, get nervous, nervous about","preposition_combos":"nervous about (sth./doing sth.)","examples":[{"en":"I always feel nervous before a big math exam.","cn":"在大考数学前我总是感到紧张。"},{"en":"She was too nervous to speak in front of the class.","cn":"她太紧张了，不敢在全班面前说话。"}],"socratic_questions":[{"question":"明天要上台演讲，你的手心出汗、心跳加快，这种状态叫什么？","answer_hint":"这个词描述的是考试或公开场合前的不安感，和‘焦虑’类似但更侧重临场反应。"}],"fill_blank":{"sentences":["He felt ___ when the teacher called his name."],"options":["nervous","excited","angry","bored"],"correct_index":0},"audio":"Unit8/audio/nervous.mp3","audio_ex0":"Unit8/audio/nervous_ex0.mp3","audio_ex1":"Unit8/audio/nervous_ex1.mp3"},{"word":"stranger","ipa":"/ˈstreɪndʒər/","image_prompts":["A closed front door with a shadowy silhouette visible through the frosted glass, night time","An empty park bench with a single lost glove lying on it, autumn leaves scattered"],"image_desc_en":"A shadow behind a frosted door; a lost glove on a bench.","image_desc_cn":"磨砂门后的影子；长椅上的孤手套。","meaning_cn":"陌生人；外地人","usage":"n. (可数名词，复数 strangers)","collocations":"a complete stranger, talk to strangers, stranger danger","preposition_combos":"stranger to (sb./sth.)","examples":[{"en":"Never accept candy from a stranger on the street.","cn":"绝不要接受街上陌生人给的糖果。"},{"en":"He was a stranger to this small town and got lost easily.","cn":"他对这个小镇很陌生，容易迷路。"}],"socratic_questions":[{"question":"你在公园里看到一个从未见过的人，你该怎么称呼他？","answer_hint":"这个词指你不认识、不了解的人，和‘朋友’相反。"}],"fill_blank":{"sentences":["A ___ asked me for directions to the library."],"options":["stranger","teacher","friend","neighbor"],"correct_index":0},"audio":"Unit8/audio/stranger.mp3","audio_ex0":"Unit8/audio/stranger_ex0.mp3","audio_ex1":"Unit8/audio/stranger_ex1.mp3"},{"word":"tip","ipa":"/tɪp/","image_prompts":["A small coin placed on a restaurant receipt next to an empty coffee cup, warm lighting","A handwritten note saying 'Add salt slowly' taped to a kitchen counter, with a salt shaker"],"image_desc_en":"A coin on a receipt; a note with cooking advice on a counter.","image_desc_cn":"收据上的硬币；厨房台面上的烹饪建议便条。","meaning_cn":"小费；提示；尖端","usage":"n. (可数名词，复数 tips) / v. (过去式 tipped, 过去分词 tipped) 给…小费；倾倒","collocations":"leave a tip, useful tip, tip of the finger, tip over","preposition_combos":"tip for (doing sth.), tip on (sth.)","examples":[{"en":"My dad left a five-dollar tip for the waiter.","cn":"我爸爸给服务员留了五美元小费。"},{"en":"Here is a useful tip for keeping your room tidy.","cn":"这里有一条保持房间整洁的实用建议。"}],"socratic_questions":[{"question":"在餐厅吃完饭，你觉得服务很好，额外放一点钱在桌上，这笔钱叫什么？","answer_hint":"这个词既指给服务员的额外报酬，也指一条好建议。"}],"fill_blank":{"sentences":["Can you give me a ___ on how to solve this puzzle?"],"options":["tip","trip","top","tap"],"correct_index":0},"audio":"Unit8/audio/tip.mp3","audio_ex0":"Unit8/audio/tip_ex0.mp3","audio_ex1":"Unit8/audio/tip_ex1.mp3"},{"word":"carefully","ipa":"/ˈkerəfəli/","image_prompts":["A pair of tweezers holding a single grain of rice over a white plate, macro photography","A glass vase being placed on a high shelf with a soft cloth underneath, steady hands"],"image_desc_en":"Tweezers holding a rice grain; a vase placed on a shelf with cloth.","image_desc_cn":"镊子夹着一粒米；用布垫着把花瓶放上架子。","meaning_cn":"小心地；仔细地","usage":"adv. (比较级 more carefully, 最高级 most carefully) 由形容词 careful + -ly 构成","collocations":"read carefully, listen carefully, drive carefully, handle carefully","preposition_combos":"无固定介词搭配，常修饰动词","examples":[{"en":"Please read the exam questions carefully before answering.","cn":"请在作答前仔细阅读考试题目。"},{"en":"She carefully wrapped the gift in colorful paper.","cn":"她小心地用彩纸把礼物包好。"}],"socratic_questions":[{"question":"做化学实验时，老师要求你慢慢倒液体，避免洒出来，这个动作应该怎么做？","answer_hint":"这个词描述的是‘非常专注、避免出错’地做某件事，和‘粗心’相反。"}],"fill_blank":{"sentences":["You should ___ check your homework for mistakes."],"options":["carefully","quickly","loudly","angrily"],"correct_index":0},"audio":"Unit8/audio/carefully.mp3","audio_ex0":"Unit8/audio/carefully_ex0.mp3","audio_ex1":"Unit8/audio/carefully_ex1.mp3"},{"word":"sincerely","ipa":"/sɪnˈsɪrli/","image_prompts":["A handwritten thank-you note on cream paper, a fountain pen resting beside it, soft sunlight on the desk","A red heart-shaped seal stamp on an envelope, wax dripping slightly, on a wooden table"],"image_desc_en":"A handwritten thank-you note on cream paper with a fountain pen beside it, soft sunlight illuminating the desk.","image_desc_cn":"一张奶油色纸上的手写感谢信，旁边放着一支钢笔，柔和的阳光照亮桌面。","meaning_cn":"真诚地；由衷地","usage":"adv.","collocations":"sincerely hope, sincerely believe, sincerely apologize, yours sincerely","preposition_combos":"","examples":[{"en":"I sincerely hope you will enjoy the birthday gift.","cn":"我真诚地希望你会喜欢这份生日礼物。"},{"en":"She sincerely thanked her friend for the help.","cn":"她真诚地感谢朋友的帮助。"}],"socratic_questions":[{"question":"你在给朋友写感谢信时，想表达发自内心的感谢，应该用哪个副词？","answer_hint":"这个词强调感情的真实和诚恳，常用于书信结尾或表达强烈愿望。"}],"fill_blank":{"sentences":["I ___ hope our team can win the basketball game."],"options":["sincerely","hardly","quickly","loudly"],"correct_index":0},"audio":"Unit8/audio/sincerely.mp3","audio_ex0":"Unit8/audio/sincerely_ex0.mp3","audio_ex1":"Unit8/audio/sincerely_ex1.mp3"},{"word":"opening","ipa":"/ˈoʊpənɪŋ/","image_prompts":["A wooden door slightly ajar, a sliver of golden light streaming through the gap onto a dark floor","A red theater curtain being pulled apart, revealing a bright stage with spotlights"],"image_desc_en":"A wooden door slightly ajar with a sliver of golden light streaming through the gap onto a dark floor.","image_desc_cn":"一扇木门微微敞开，一缕金色光线从门缝照在黑暗的地板上。","meaning_cn":"开口；开始；开幕","usage":"n.","collocations":"grand opening, opening ceremony, opening hours, opening night","preposition_combos":"at the opening of, during the opening","examples":[{"en":"The grand opening of the new library is next Monday.","cn":"新图书馆的盛大开幕仪式在下周一。"},{"en":"The opening of the movie was very exciting.","cn":"电影的开头非常激动人心。"}],"socratic_questions":[{"question":"学校新图书馆第一次向学生开放的那天，我们称之为什么仪式？","answer_hint":"这个词表示一个事件或场所的首次公开亮相，常与'grand'搭配。"}],"fill_blank":{"sentences":["We arrived early for the ___ of the art exhibition."],"options":["opening","closing","ending","middle"],"correct_index":0},"audio":"Unit8/audio/opening.mp3","audio_ex0":"Unit8/audio/opening_ex0.mp3","audio_ex1":"Unit8/audio/opening_ex1.mp3"},{"word":"closing","ipa":"/ˈkloʊzɪŋ/","image_prompts":["A metal gate with a padlock being shut at sunset, long shadows on the ground","A bookstore window with a 'CLOSED' sign hanging on the glass, lights off inside"],"image_desc_en":"A metal gate with a padlock being shut at sunset, long shadows stretching on the ground.","image_desc_cn":"日落时分一扇带挂锁的铁门正在关闭，地面上拖着长长的影子。","meaning_cn":"关闭；结束；结尾","usage":"n.","collocations":"closing time, closing ceremony, closing remarks, closing date","preposition_combos":"at the closing of, before closing","examples":[{"en":"The closing ceremony of the sports meet was wonderful.","cn":"运动会的闭幕式非常精彩。"},{"en":"Please hand in your homework before the closing of school.","cn":"请在放学之前交上作业。"}],"socratic_questions":[{"question":"运动会最后一天，所有运动员集合在操场上举行什么仪式？","answer_hint":"这个词表示一个活动的最后部分，与'opening'相对。"}],"fill_blank":{"sentences":["The store's ___ time is 9:00 PM every day."],"options":["closing","opening","starting","working"],"correct_index":0},"audio":"Unit8/audio/closing.mp3","audio_ex0":"Unit8/audio/closing_ex0.mp3","audio_ex1":"Unit8/audio/closing_ex1.mp3"},{"word":"sentence","ipa":"/ˈsentəns/","image_prompts":["A chalkboard with a neatly written English sentence underlined in white chalk, an eraser nearby","A stack of vocabulary flashcards on a desk, each card showing one complete sentence in blue ink"],"image_desc_en":"A chalkboard with a neatly written English sentence underline :"We had a small misunderstanding about the time of the meeting.","cn":"我们对会议时间有一个小小的误会。"}],"socratic_questions":[{"question":"你和朋友约好三点在校门口见，但你等了半小时他都没来，后来发现他以为是四点。这是什么情况？","answer_hint":"双方对时间理解不同，这就是一个误会。"}],"fill_blank":{"sentences":["They had a ___ because he thought she said 'Tuesday' but she said 'Thursday'."],"options":["misunderstanding","agreement","discussion","celebration"],"correct_index":0},"audio":"Unit8/audio/misunderstanding.mp3","audio_ex0":"Unit8/audio/misunderstanding_ex0.mp3","audio_ex1":"Unit8/audio/misunderstanding_ex1.mp3"},{"word":"event","ipa":"/ɪˈvent/","image_prompts":["A large outdoor stage with colorful banners and a banner reading 'School Fair' in the background","A row of gold, silver, and bronze medals on a wooden podium with a number 1, 2, 3"],"image_desc_en":"A large outdoor stage with colorful banners and a banner reading 'School Fair' in the background","image_desc_cn":"一个大型户外舞台，挂着彩色横幅，背景横幅上写着 '学校游园会'","meaning_cn":"事件；活动；比赛项目","usage":"n. (可数名词)","collocations":"sports event, main event, special event, current events","preposition_combos":"event in, event at, event on","examples":[{"en":"The school's annual music event will be held in the gymnasium.","cn":"学校一年一度的音乐活动将在体育馆举行。"},{"cn":"跑步比赛是运动会中最受欢迎的项目之一。","en":"The running race is one of the most popular events in the sports meet."}],"socratic_questions":[{"question":"学校下个月要举办一个大型活动，有表演、比赛和美食摊位。这个大型活动叫什么？","answer_hint":"有组织、有计划的集体活动，称为事件或活动。"}],"fill_blank":{"sentences":["The 100-meter dash is the first ___ of the school sports day."],"options":["event","class","lesson","subject"],"correct_index":0},"audio":"Unit8/audio/event.mp3","audio_ex0":"Unit8/audio/event_ex0.mp3","audio_ex1":"Unit8/audio/event_ex1.mp3"},{"word":"take place","ipa":"/teɪk pleɪs/","image_prompts":["A calendar on a wall with a red circle around a date, a clock showing 3 PM, and a banner reading 'School Sports Day' hanging above","A stage with red curtains and a microphone stand, spotlights shining down, and a sign saying 'Talent Show' on the floor"],"image_desc_en":"A calendar with a marked date and a clock, or a stage with a talent show sign.","image_desc_cn":"日历上标记的日期和时钟，或带有才艺表演标志的舞台。","meaning_cn":"发生；举行","usage":"动词短语 (过去式 took place, 过去分词 taken place)","collocations":"event takes place, competition takes place, meeting takes place","preposition_combos":"take place in/on/at (地点/时间)","examples":[{"en":"The school art festival will take place next Friday afternoon.","cn":"学校艺术节将在下周五下午举行。"},{"en":"Our final exam usually takes place in early January.","cn":"我们的期末考试通常在1月初进行。"}],"socratic_questions":[{"question":"你想说学校的运动会将在下个月举行，但不想用‘hold’这个词，因为它是被动语态。哪个短语可以表示‘发生、举行’？","answer_hint":"这个短语由两个词组成，字面意思是‘占据一个地方’，常用来描述事件的发生。"}],"fill_blank":{"sentences":["The class meeting will ___ in Room 201 tomorrow morning."],"options":["take place","take off","take care","take part"],"correct_index":0},"audio":"Unit8/audio/take_place.mp3","audio_ex0":"Unit8/audio/take_place_ex0.mp3","audio_ex1":"Unit8/audio/take_place_ex1.mp3"},{"word":"cost","ipa":"/kɒst/","image_prompts":["A price tag hanging on a new backpack with the number $35.99 written on it, on a store shelf","A receipt from a supermarket showing a total of $12.50, with coins and a wallet next to it"],"image_desc_en":"A price tag on a backpack or a supermarket receipt with coins.","image_desc_cn":"背包上的价格标签或超市收据和硬币。","meaning_cn":"花费；成本；代价","usage":"v. (过去式 cost, 过去分词 cost) / n.","collocations":"cost money, cost time, low cost, high cost","preposition_combos":"cost (sb) + 金额; at the cost of","examples":[{"en":"This new dictionary cost me thirty yuan at the bookstore.","cn":"这本新词典在书店花了我30元。"},{"en":"The cost of the school trip is fifty dollars per student.","cn":"学校旅行的费用是每个学生50美元。"}],"socratic_questions":[{"question":"你想说‘这本书花了我20块钱’，但不想用‘spend’（因为主语是人）。哪个动词的主语可以是物品，表示‘花费多少钱’？","answer_hint":"这个动词的过去式和原形一样，常用来询问或说明物品的价格。"}],"fill_blank":{"sentences":["How much does this ticket ___ for the concert?"],"options":["cost","spend","pay","take"],"correct_index":0},"audio":"Unit8/audio/cost.mp3","audio_ex0":"Unit8/audio/cost_ex0.mp3","audio_ex1":"Unit8/audio/cost_ex1.mp3"},{"word":"opportunity","ipa":"/ˌɒpəˈtjuːnəti/","image_prompts":["An open door with sunlight streaming through, a golden key lying on the floor in front of it","A blank application form on a desk with a pen, a sign reading 'Volunteer Program' in the background"],"image_desc_en":"An open door with sunlight and a key, or a blank application form with a volunteer sign.","image_desc_cn":"一扇敞开的门，阳光和钥匙，或一张空白申请表和志愿者标志。","meaning_cn":"机会；时机","usage":"n. (可数名词，复数 opportunities)","collocations":"have an opportunity, miss an opportunity, golden opportunity, job opportunity","preposition_combos":"opportunity to do sth; opportunity for sth","examples":[{"en":"This summer camp is a great opportunity to learn English.","cn":"这个夏令营是学习英语的好机会。"},{"en":"Don't miss the opportunity to join the basketball club.","cn":"不要错过加入篮球俱乐部的机会。"}],"socratic_questions":[{"question":"你想说‘这是一个学习新技能的好机会’，但不想用‘chance’（太口语化）。哪个词更正式，常出现在写作中，表示‘有利的时机’？","answer_hint":"这个词以‘-ity’结尾，是名词，常与‘have’或‘miss’搭配使用。"}],"fill_blank":{"sentences":["I hope I will have the ___ to visit the science museum."],"options":["opportunity","ability","activity","difficulty"],"correct_index":0},"audio":"Unit8/audio/opportunity.mp3","audio_ex0":"Unit8/audio/opportunity_ex0.mp3","audio_ex1":"Unit8/audio/opportunity_ex1.mp3"},{"word":"benefit","ipa":"/ˈbenɪfɪt/","image_prompts":["A green plant growing under a sunlamp with water droplets on its leaves, a small sign saying 'Growth'","A stack of library books with a bookmark, a cup of tea next to them, and a glowing light bulb above"],"image_desc_en":"A plant growing under a sunlamp or a stack of books with a glowing light bulb.","image_desc_cn":"在太阳灯下生长的植物，或一堆书和发光的灯泡。","meaning_cn":"好处；益处；对……有益","usage":"n. / v. (过去式 benefited, 过去分词 benefited)","collocations":"health benefit, benefit from, mutual benefit, great benefit","preposition_combos":"benefit from sth; benefit sb/sth","examples":[{"en":"Reading English newspapers every day has many benefits.","cn":"每天阅读英文报纸有很多好处。"},{"en":"We can benefit a lot from doing morning exercises.","cn":"我们可以从做早操中获益良多。"}],"socratic_questions":[{"question":"你想说‘运动对我们的健康有好处’，但不想用‘good’（太简单）。哪个词可以作名词或动词，表示‘利益、好处’？","answer_hint":"这个词以‘-fit’结尾，常与‘from’搭配，表示‘从……中获益’。"}],"fill_blank":{"sentences":["Everyone can ___ from taking part in team sports."],"options":["benefit","borrow","believe","begin"],"correct_index":0},"audio":"Unit8/audio/benefit.mp3","audio_ex0":"Unit8/audio/benefit_ex0.mp3","audio_ex1":"Unit8/audio/benefit_ex1.mp3"},{"word":"reply","ipa":"/rɪˈplaɪ/","image_prompts":["A smartphone screen showing a text message conversation with a blue reply bubble appearing below a received message, bright screen on a wooden desk","An open notebook with a handwritten question mark on one page and a written answer on the opposite page, pen lying beside, soft daylight"],"image_desc_en":"A smartphone screen showing a text message conversation with a blue reply bubble appearing below a received message, bright screen on a wooden desk","image_desc_cn":"智能手机屏幕显示短信对话，蓝色回复气泡出现在收到的消息下方，明亮屏幕在木桌上","meaning_cn":"回答；回复","usage":"v. (过去式 replied, 过去分词 replied) / n.","collocations":"reply to a letter, reply quickly, give a reply","preposition_combos":"reply to sb/sth","examples":[{"en":"Please reply to my email before Friday this week.","cn":"请在本周五之前回复我的邮件。"},{"en":"She gave a short reply to the teacher's question.","cn":"她对老师的问题给出了简短的回答。"}],"socratic_questions":[{"question":"你收到朋友发来的短信问明天几点见面，你打开手机打字回他，这个动作叫什么？","answer_hint":"这个词强调对别人说的话或写的内容做出回应，和‘answer’很像但更正式一点。"}],"fill_blank":{"sentences":["He didn't ___ to my invitation until the last minute."],"options":["reply","replys","replied","replying"],"correct_index":0},"audio":"Unit8/audio/reply.mp3","audio_ex0":"Unit8/audio/reply_ex0.mp3","audio_ex1":"Unit8/audio/reply_ex1.mp3"},{"word":"honour","ipa":"/ˈɒn.ər/","image_prompts":["A shiny golden trophy async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }

    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playAudioPath(path, fallbackText) {
  if (!path && fallbackText) { speakWord(fallbackText); return; }
  const urls = [];
  if (path) {
    if (path.startsWith("http")) urls.push(path);
    else {
      const rel = path.replace(/^Unit\d+\/?/, "");
      if (rel) urls.push(rel);
      const cos = mediaUrl(path);
      if (cos && urls.indexOf(cos) < 0) urls.push(cos);
    }
  }
  let i = 0;
  function tryNext() {
    if (i >= urls.length) { if (fallbackText) speakWord(fallbackText); return; }
    const a = new Audio(urls[i++]);
    a.play().catch(tryNext);
  }
  tryNext();
}
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  playAudioPath(w.audio, w.word);
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
    rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
    alert("无法启动英语语音识别：" + (err?.message || err));
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {

function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";

  modal.classList.add("show");

  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义

3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",

          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");

function speakWord(word) {
  const w = String(word || "").trim();
  if (!w) return;
  function fallbackWebSpeech() {
    if ("speechSynthesis" in window) {
      var u = new SpeechSynthesisUtterance(w);
      u.lang = "en-GB";
      window.speechSynthesis.speak(u);
    }
  }
  if (!synthesizer) { fallbackWebSpeech(); return; }
  synthesizer.speakTextAsync(w, function(result) {
    if (result && SpeechSDK.ResultReason.Canceled === result.reason && SpeechSDK.CancellationDetails) {
      var d = SpeechSDK.CancellationDetails.fromResult(result);
      if (d.reason === SpeechSDK.CancellationReason.Error) { console.warn("TTS Error:", d.errorDetails); fallbackWebSpeech(); }
    }
  }, function(e) { console.error("TTS:", e); fallbackWebSpeech(); });
}

function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
    window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    const en=(ww.examples||[])[i]?.en||"";
    playAudioPath(aud, en);
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
        rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
      alert("无法启动例句朗读评分：" + (err?.message || err));
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function setReviewDots(active) {

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
  setReviewDots(1);
  showPage("p-review");
  showSocraticQuestion();
  saveProgress();
}

  const w = reviewOrders ? reviewBatch[reviewOrders.socratic[reviewIdx]] : reviewBatch[reviewIdx];

  document.getElementById("review-socratic-q").textContent = q.question||"";

  [...reviewBatch].sort(()=>Math.random()-.5).map(x=>x.word).forEach(wo=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=wo;
    b.onclick=()=>{
      opts.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);

      b.classList.add(ok?"correct":"wrong");

/* ═══════════════════════════════════════════════
   翻译朗读 + DeepSeek 评价（持续识别，手动开始/停止）
═══════════════════════════════════════════════ */
function toggleTransRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("review-trans-record");

  if (transRecording) {
    // ── 停止录音 ──
    transRecording = false;
    btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
    btn.classList.remove("recording");
    if (window._transRec) {
      window._transRec.stopContinuousRecognitionAsync(
        async () => {
          const text = (window._transFullText||"").trim();
          const resultDiv = document.getElementById("review-trans-result");
          if (!text) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--sub)">未识别到语音，请重试</div>`;
    return;
  }
          await evaluateTranslation(window._transSentence||"", text, window._transRefCn||"");
        },
        e => console.error("stop err:", e)
      );
    }
    return;
  }

  // ── 开始录音 ──
  transRecording = true;
  window._transFullText = "";
  btn.innerHTML = '<i class="fas fa-stop"></i> 点击停止录音';
  btn.classList.add("recording");
  document.getElementById("review-trans-result").style.display = "none";

  const zhCfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  zhCfg.speechRecognitionLanguage = "zh-CN";
  const rec = new SpeechSDK.SpeechRecognizer(zhCfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  window._transRec = rec;

  // 实时显示识别到的片段
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._transFullText += e.result.text;
      const resultDiv = document.getElementById("review-trans-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text2)">
        识别中：<span style="color:var(--text)">${window._transFullText}</span>
      </div>`;
    }
  };

  rec.startContinuousRecognitionAsync(
    () => {},
    e => {
      transRecording = false;
      btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
      btn.classList.remove("recording");
      console.error("start err:", e);
    }
  );
}

async function evaluateTranslation(enText, studentCn, refCn) {

    const prompt=`你是初中英语翻译评价专家，帮助八年级学生提升英译中能力。
英文原句：${enText}
参考中文：${refCn||"（无）"}
学生朗读的中文翻译：${studentCn}

请用JSON格式返回评价，包含这些字段：
- score: 整数0-100（语义准确度）
- correct: 翻译正确/较好的部分（简洁，1句）
- issues: 主要问题或遗漏（1-2句，没有则写"无明显问题"）
- standard: 最佳参考翻译（1句）

    const resp=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-v4-flash",
        messages:[{role:"user",content:prompt}],
        response_format:{type:"json_object"},
        temperature:0.3,max_tokens:400
      })
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    const data=await resp.json();
    const ev=JSON.parse(data.choices[0].message.content);
    const s=ev.score??0;
    reviewLogs.push({ type:"translation", word:window._dictWord?.word||"", en:enText, studentCn, score:s, correct:ev.correct||"", issues:ev.issues||"", standard:ev.standard||"" });
    const cls=s>=80?"eval-score-hi":s>=55?"eval-score-mid":"eval-score-lo";
    resultDiv.innerHTML=`
      <div class="eval-card">
        <div class="eval-score-row">
          <div class="eval-score-circle ${cls}">${s}</div>
          <div>
            <div style="font-size:.75rem;font-weight:800;color:var(--sub);letter-spacing:.05em;margin-bottom:4px">DEEPSEEK 评分</div>
            <div style="font-size:.85rem;color:var(--sub)">你说的：<span style="color:var(--text)">${studentCn}</span></div>
          </div>

        ${ev.issues?`<div class="eval-row"><span class="eval-lbl">⚠ 问题</span><span class="eval-val" style="color:#fca5a5">${ev.issues}</span></div>`:""}
        <div class="eval-row"><span class="eval-lbl">📝 标准</span><span class="eval-val">${ev.standard||refCn||"—"}</span></div>
        ${ev.tip?`<div class="eval-tip">💡 ${ev.tip}</div>`:""}
      </div>`;
  } catch(e) {
    resultDiv.innerHTML=`<div class="eval-card"><p style="color:var(--sub);font-size:.88rem">评价暂不可用：${e.message}</p></div>`;
    console.error("DeepSeek eval:", e);
  }
}

function escapeHtml(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatDateTime(d) {
  if (!d) return "-";
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)+" "+
    ("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)+":"+("0"+x.getSeconds()).slice(-2);
}
function formatDuration(ms) {
  if (!ms||ms<0) return "0s";
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if (h>0) return h+"h "+m%60+"min "+s%60+"s";
  if (m>0) return m+"min "+s%60+"s";
  return s+"s";
}
function buildReportDetailsHtml() {
  let html = "";
  if (Object.keys(wordTimings).length > 0) {
    html += "<h3 style=\"font-size:14px;margin:12px 0 8px;color:#333;\">⏱️ 每个单词学习时间</h3>";

    Object.entries(wordTimings).forEach(([w,t])=>{
      html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(w)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(t/1000).toFixed(1)+" 秒</td></tr>";
    });
    html += "</table>";
  }
  if (reviewLogs.length > 0) {
    html += "<h3 style=\"font-size:14px;margin:16px 0 8px;color:#333;\">📋 复习阶段做题过程与结果</h3>";
    const socraticLogs = reviewLogs.filter(r=>r.type==="socratic");
    const fillLogs = reviewLogs.filter(r=>r.type==="fill");
    const transLogs = reviewLogs.filter(r=>r.type==="translation");
    if (socraticLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🧠 情景联想</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">题目</th><th style=\"border:1px solid #ddd;padding:5px;\">学生答案</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      socraticLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.question.substring(0,50)+(r.question.length>50?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userAnswer)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correct)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (fillLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">✏️ 句子填空</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">句子</th><th style=\"border:1px solid #ddd;padding:5px;\">学生选择</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      fillLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.sentence.substring(0,40)+(r.sentence.length>40?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correctChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (transLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🌏 翻译朗读 · AI评价</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">英文</th><th style=\"border:1px solid #ddd;padding:5px;\">学生翻译</th><th style=\"border:1px solid #ddd;padding:5px;\">得分</th><th style=\"border:1px solid #ddd;padding:5px;\">标准参考</th></tr>";
      transLogs.forEach(r=>{ html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.en.substring(0,35)+(r.en.length>35?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.studentCn.substring(0,25)+(r.studentCn.length>25?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+r.score+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml((r.standard||"").substring(0,30))+"</td></tr>"; });
      html += "</table>";
    }
  }
  if (!html) html = "<p style=\"color:#999;\">暂无学习数据（需完成部分单词学习或复习后发送）</p>";
  return html;
}
function sendLearningReport() {
  if (reportSent) { alert("报告已发送过"); return; }
  const hasData = Object.keys(wordTimings).length > 0 || reviewLogs.length > 0;
  if (!hasData) { alert("暂无学习数据，请先完成部分单词学习或复习后再发送报告"); return; }
  if (typeof emailjs === "undefined") { alert("邮件服务未加载，请刷新页面后重试"); return; }
  const endTime = new Date();
  const startT = sessionStartTime || endTime;
  const durationMs = endTime - startT;
  const studentName = localStorage.getItem("authing-user") || localStorage.getItem("current-user") || "未登录";
  const contentName = "人教版词汇 Unit" + currentUnit + " - " + (document.title || "词汇学习");
  const choiceLogs = reviewLogs.filter(r=>r.type==="socratic"||r.type==="fill");
  const transLogs = reviewLogs.filter(r=>r.type==="translation");
  const reviewCorrect = choiceLogs.filter(r=>r.ok).length;
  const reviewTotal = choiceLogs.length;
  const avgTransScore = transLogs.length ? Math.round(transLogs.reduce((a,x)=>a+x.score,0)/transLogs.length) : null;
  const score = reviewTotal ? reviewCorrect : (avgTransScore!==null ? avgTransScore : 0);
  const total = reviewTotal || (avgTransScore!==null ? 100 : 0);
  const accuracy = total > 0 ? Math.round((reviewTotal ? reviewCorrect/reviewTotal : avgTransScore/100) * 100) + "%" : "-";
  const templateParams = {
    student_name: studentName,
    content_name: contentName,
    page_url: location.href,
    page_url_display: contentName,
    start_time: formatDateTime(startT),
    end_time: formatDateTime(endTime),
    duration: formatDuration(durationMs),
    score: score,
    total: total,
    accuracy: accuracy,
    details_html: buildReportDetailsHtml()
  };
  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
      .then(() => { reportSent = true; alert("✅ 学习报告已发送给老师"); })
      .catch(() => { alert("❌ 报告发送失败，请检查网络后重试"); });
  } catch (e) { alert("发送失败：" + (e.message || "未知错误")); }
}
