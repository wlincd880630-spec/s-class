<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="vocab_pdf.js"></script>
  <script src="vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>

</head>

  <script>window.VOCAB_DATA={"units":[{"unit":1,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"ancient","ipa":"/ˈeɪnʃənt/","image_prompts":["A close-up of a cracked stone tablet with faded carvings, moss growing in the crevices, soft natural light","A large ancient tree trunk with thick, gnarled roots spreading across a forest floor, fallen leaves around"],"image_desc_en":"A cracked stone tablet with faded carvings and moss in crevices, soft natural light.","image_desc_cn":"一块布满裂纹的石板，刻痕模糊，缝隙中长满苔藓，柔和的自然光。","meaning_cn":"古代的；古老的","usage":"adj.","collocations":"ancient history, ancient building, ancient tree","preposition_combos":"ancient in style, ancient from the past","examples":[{"en":"The museum has a collection of ancient coins from different dynasties.","cn":"博物馆收藏了来自不同朝代的古钱币。"},{"en":"We saw an ancient stone bridge over the river during our trip.","cn":"我们在旅途中看到了一座横跨河流的古石桥。"}],"socratic_questions":[{"question":"如果你在历史课本上看到一座建于几千年前的建筑，你会用什么词来形容它？","answer_hint":"这个词强调时间久远，常用于描述文物、建筑或文明。"}],"fill_blank":{"sentences":["The ___ walls of the castle have stood for over a thousand years."],"options":["ancient","modern","tall","broken"],"correct_index":0}},{"word":"camp","ipa":"/kæmp/","image_prompts":["A green tent pitched on a grassy field with a sleeping bag visible inside, morning sunlight filtering through trees","A campfire with glowing embers and a metal pot hanging above, surrounded by logs and pine needles"],"image_desc_en":"A green tent on a grassy field with a sleeping bag inside, morning sunlight through trees.","image_desc_cn":"草地上的一顶绿色帐篷，里面可见睡袋，晨光透过树林洒下。","meaning_cn":"营地；露营","usage":"n. / v. (过去式 camped, 过去分词 camped)","collocations":"go camping, summer camp, campfire","preposition_combos":"camp in the woods, camp by the lake","examples":[{"en":"Our family will camp near the lake for three days this summer.","cn":"今年夏天我们家将在湖边露营三天。"},{"en":"They set up a small camp under the tall pine trees.","cn":"他们在高大的松树下搭建了一个小营地。"}],"socratic_questions":[{"question":"你和朋友去户外过夜，搭了帐篷、生了火，这种活动叫什么？","answer_hint":"这个词既指过夜的地方，也指搭帐篷过夜的活动。"}],"fill_blank":{"sentences":["We decided to ___ by the river because the view was beautiful."],"options":["camp","swim","climb","drive"],"correct_index":0}},{"word":"landscape","ipa":"/ˈlændskeɪp/","image_prompts":["A wide view of rolling green hills under a blue sky with white clouds, a winding river in the distance","A desert landscape with sand dunes stretching to the horizon, golden sunlight casting long shadows"],"image_desc_en":"Rolling green hills under a blue sky with white clouds, a winding river in the distance.","image_desc_cn":"蓝天白云下起伏的绿色山丘，远处一条蜿蜒的河流。","meaning_cn":"风景；景色","usage":"n.","collocations":"beautiful landscape, natural landscape, landscape painting","preposition_combos":"landscape of mountains, landscape in autumn","examples":[{"en":"The landscape outside the train window changed from fields to forests.","cn":"火车窗外的风景从田野变成了森林。"},{"en":"This painting shows a peaceful landscape with a lake and trees.","cn":"这幅画展示了一幅宁静的风景，有湖泊和树木。"}],"socratic_questions":[{"question":"你站在山顶上，看到远处有山、河流和田野，你会怎么描述眼前的景象？","answer_hint":"这个词指一大片自然景色，包括山、水、树木等。"}],"fill_blank":{"sentences":["The ___ of the countryside was so beautiful that we stopped to take photos."],"options":["landscape","weather","building","traffic"],"correct_index":0}},{"word":"strange","ipa":"/streɪndʒ/","image_prompts":["A bright blue banana lying on a wooden table next to a normal yellow banana, contrasting colors","A clock with its hands spinning backwards, numbers written in reverse order on the face"],"image_desc_en":"A bright blue banana on a wooden table next to a normal yellow banana, contrasting colors.","image_desc_cn":"一张木桌上放着一根亮蓝色的香蕉，旁边是一根正常的黄色香蕉，颜色对比鲜明。","meaning_cn":"奇怪的；陌生的","usage":"adj. (副词 strangely)","collocations":"strange noise, strange feeling, strange place","preposition_combos":"strange to someone, strange in appearance","examples":[{"en":"I heard a strange noise coming from the empty classroom.","cn":"我听到空教室里传来奇怪的声音。"},{"en":"The food had a strange taste, so I did not eat much.","cn":"这食物有股怪味，所以我没有吃太多。"}],"socratic_questions":[{"question":"你看到一只紫色的猫在街上走，你会觉得它怎么样？","answer_hint":"这个词形容不寻常、让人感到意外或难以理解的事物。"}],"fill_blank":{"sentences":["It felt ___ to walk into a room where everything was upside down."],"options":["strange","normal","warm","quiet"],"correct_index":0}},{"word":"vacation","ipa":"/veɪˈkeɪʃən/","image_prompts":["A sandy beach with a single beach umbrella and a folded towel, calm blue ocean in background","A suitcase and a passport lying on a wooden table next to a small globe"],"image_desc_en":"A beach with umbrella and towel, or a suitcase with passport and globe","image_desc_cn":"沙滩上的遮阳伞和毛巾，或行李箱、护照和地球仪","meaning_cn":"假期；休假","usage":"n. (可数名词) 假期；休假","collocations":"summer vacation, on vacation, take a vacation, winter vacation","preposition_combos":"on vacation, during the vacation, go on vacation","examples":[{"en":"We plan to visit the museum during our summer vacation.","cn":"我们计划在暑假期间参观博物馆。"},{"en":"My family went on a vacation to the mountains last week.","cn":"上周我们全家去山里度假了。"}],"socratic_questions":[{"question":"学校放暑假了，你打算和家人出去旅行一周，这段时间叫什么？","answer_hint":"这个词指一段不用上学或工作的休息时间，常与 summer 或 winter 搭配。"}],"fill_blank":{"sentences":["They spent their winter ___ in a small village near the lake."],"options":["vacation","homework","exam","class"],"correct_index":0}},{"word":"fantastic","ipa":"/fænˈtæstɪk/","image_prompts":["A colorful fireworks display bursting over a dark night sky with bright sparks","A plate of fresh fruit arranged in a rainbow pattern on a white tablecloth"],"image_desc_en":"Fireworks in the night sky, or a rainbow fruit platter","image_desc_cn":"夜空中的烟花，或彩虹色水果拼盘","meaning_cn":"极好的；了不起的","usage":"adj. 极好的；非常棒的","collocations":"fantastic idea, fantastic view, fantastic job, fantastic weather","preposition_combos":"无常见介词搭配","examples":[{"en":"The view from the top of the hill was absolutely fantastic.","cn":"从山顶看到的景色简直太棒了。"},{"en":"We had a fantastic time at the school music festival last Friday.","cn":"上周五我们在学校音乐节上玩得非常开心。"}],"socratic_questions":[{"question":"你参加了一场校园音乐会，觉得演出特别精彩，你会用什么词来形容？","answer_hint":"这个词比 good 或 great 语气更强，表示非常棒、令人惊叹。"}],"fill_blank":{"sentences":["The weather during our trip was ___ — sunny and warm every day."],"options":["fantastic","terrible","boring","cloudy"],"correct_index":0}},{"word":"town","ipa":"/taʊn/","image_prompts":["A small main street with a row of shops, a traffic light, and a clock tower in the distance","A wooden signpost pointing to 'Town Center' with a bicycle parked next to it"],"image_desc_en":"A main street with shops and a clock tower, or a signpost pointing to town center","image_desc_cn":"有商店和钟楼的主街，或指向镇中心的指示牌","meaning_cn":"镇；城镇","usage":"n. 城镇（比 city 小，比 village 大）","collocations":"in town, go to town, town center, small town","preposition_combos":"in town, out of town, around town","examples":[{"en":"There is a new library in the center of our town.","cn":"我们镇中心有一个新图书馆。"},{"en":"My grandparents live in a quiet town near the river.","cn":"我的祖父母住在河边一个安静的小镇上。"}],"socratic_questions":[{"question":"你住的地方比村子大，但比大城市小，有超市、邮局和学校，这种地方叫什么？","answer_hint":"这个词比 city 小，比 village 大，通常有中心街道和基本设施。"}],"fill_blank":{"sentences":["The bus will take you from the village to the nearest ___ in twenty minutes."],"options":["town","forest","farm","river"],"correct_index":0}},{"word":"breath","ipa":"/breθ/","image_prompts":["A white misty cloud of warm breath on a cold window pane, frost forming around the edges","A lit birthday cake with five candles, smoke trails rising from extinguished flames"],"image_desc_en":"A visible puff of air on a cold surface or smoke rising from candles","image_desc_cn":"冷玻璃上的白色雾气或蜡烛熄灭后的烟迹","meaning_cn":"呼吸；一口气","usage":"n. (可数名词，常用单数)","collocations":"take a deep breath, hold one's breath, out of breath","preposition_combos":"breath of fresh air","examples":[{"en":"Take a deep breath before you start your English exam.","cn":"开始英语考试前深吸一口气。"},{"en":"He was out of breath after running to the bus stop.","cn":"他跑到公交站后上气不接下气。"}],"socratic_questions":[{"question":"跑步后你大口喘气，需要停下来做什么动作来恢复？这个动作和空气有关。","answer_hint":"指吸入和呼出空气的动作，常用‘take a deep...’搭配。"}],"fill_blank":{"sentences":["She stopped to take a deep ___ before speaking in front of the class."],"options":["breath","breathe","bread","break"],"correct_index":0}},{"word":"take sb","ipa":"/teɪk ˈsʌmbədi/","image_prompts":["A red bicycle parked next to a school gate with a helmet hanging on the handlebar","A family car with an open door and a pet dog's leash on the passenger seat"],"image_desc_en":"A bicycle or car ready to transport someone to a destination","image_desc_cn":"一辆停在门口的自行车或车门打开的小汽车，准备带人去某地","meaning_cn":"带某人（去某处）","usage":"v. (过去式 took, 过去分词 taken) 及物动词短语，后接人+地点","collocations":"take sb to school, take sb home, take sb to the hospital","preposition_combos":"take sb to + 地点","examples":[{"en":"My mother will take me to the library after school.","cn":"我妈妈放学后会带我去图书馆。"},{"en":"Can you take your little brother to the park this weekend?","cn":"这个周末你能带你的弟弟去公园吗？"}],"socratic_questions":[{"question":"你生病了，妈妈开车送你去医院。这个动作是‘带某人去某地’，用哪个动词短语？","answer_hint":"由‘take’和‘某人’组成，后面接地点。"}],"fill_blank":{"sentences":["My dad will ___ me to the train station tomorrow morning."],"options":["take","bring","carry","send"],"correct_index":0}},{"word":"especially","ipa":"/ɪˈspeʃəli/","image_prompts":["A bright red apple standing out among a pile of green apples on a wooden table","A single sunflower in a field of wheat, sunlight highlighting its yellow petals"],"image_desc_en":"One distinct object highlighted among many similar ones","image_desc_cn":"一堆绿色苹果中一个显眼的红苹果，或麦田里一朵突出的向日葵","meaning_cn":"尤其；特别","usage":"adv.","collocations":"especially when, especially for, especially in","preposition_combos":"especially + 介词短语","examples":[{"en":"I love fruits, especially strawberries in summer.","cn":"我喜欢水果，尤其是夏天的草莓。"},{"en":"This book is helpful for English learners, especially beginners.","cn":"这本书对英语学习者有帮助，尤其是初学者。"}],"socratic_questions":[{"question":"你很喜欢运动，但最最喜欢游泳。表达‘尤其’用哪个副词？","answer_hint":"这个词强调某事物比其他更突出，常放在被强调内容前。"}],"fill_blank":{"sentences":["The weather is hot here, ___ in July and August."],"options":["especially","specially","specially","exactly"],"correct_index":0}},{"word":"steamed","ipa":"/stiːmd/","image_prompts":["A bamboo steamer basket on a stove, white steam rising from the lid with drops of water","A plate of bright green broccoli with visible steam wisps above it on a kitchen counter"],"image_desc_en":"A bamboo steamer with steam rising or a plate of steamed vegetables with vapor","image_desc_cn":"竹蒸笼冒着白色蒸汽，或一盘蒸蔬菜上方飘着热气","meaning_cn":"蒸的；蒸熟的","usage":"adj. (由动词 steam 的过去分词转化而来)","collocations":"steamed fish, steamed rice, steamed buns","preposition_combos":"steamed with (搭配某种调料或配菜)","examples":[{"en":"Steamed fish with ginger is a healthy dinner choice.","cn":"清蒸鱼配姜是一道健康的晚餐选择。"},{"en":"My grandmother makes delicious steamed buns for breakfast.","cn":"我奶奶做美味的蒸包子当早餐。"}],"socratic_questions":[{"question":"妈妈把鱼放在锅里，不加油，用水蒸气加热做熟。这种烹饪方式叫什么？","answer_hint":"用热气蒸熟食物，常见于包子、鱼等，形容词形式以-ed结尾。"}],"fill_blank":{"sentences":["We had ___ dumplings for lunch at the Chinese restaurant."],"options":["steamed","fried","boiled","baked"],"correct_index":0}},{"word":"anywhere","ipa":"/ˈeniweər/","image_prompts":["A compass lying on a world map with multiple red dots marking different cities, no people","An open suitcase on a bed with clothes and a passport, a globe beside it, no people"],"image_desc_en":"A compass on a world map with red dots marking cities, no people.","image_desc_cn":"一个指南针放在世界地图上，红点标记多个城市，无人。","meaning_cn":"adv. 任何地方；无论何处","usage":"副词 adv.","collocations":"go anywhere, not find anywhere, anywhere else","preposition_combos":"anywhere in, anywhere near","examples":[{"en":"I can't find my keys anywhere in the house.","cn":"我在房子里任何地方都找不到我的钥匙。"},{"en":"You can sit anywhere you like in the library.","cn":"你可以在图书馆里任何你喜欢的地方坐下。"}],"socratic_questions":[{"question":"你想表达‘我到处都找不到我的铅笔盒’，但不想说具体位置，该用哪个词？","answer_hint":"这个词表示‘任何地方’，常用于否定句或疑问句，强调范围不限。"}],"fill_blank":{"sentences":["Did you go ___ interesting during the summer vacation?"],"options":["anywhere","everywhere","somewhere","nowhere"],"correct_index":0}},{"word":"nothing","ipa":"/ˈnʌθɪŋ/","image_prompts":["An empty white plate on a wooden table with a fork and knife beside it, no food","A blank piece of paper on a desk with a pencil, no writing or drawing"],"image_desc_en":"An empty white plate on a wooden table with cutlery, no food.","image_desc_cn":"一个空的白盘子放在木桌上，旁边有刀叉，没有食物。","meaning_cn":"pron. 没有什么；没有东西","usage":"代词 pron.","collocations":"nothing special, nothing to do, nothing but","preposition_combos":"nothing in, nothing about","examples":[{"en":"There is nothing in the fridge except some milk.","cn":"冰箱里除了牛奶什么都没有。"},{"en":"She said nothing about the test results yesterday.","cn":"她昨天对考试结果什么都没说。"}],"socratic_questions":[{"question":"你想说‘这个盒子里空空的，没有任何东西’，该用哪个词？","answer_hint":"这个词表示‘没有东西’，强调完全空无一物。"}],"fill_blank":{"sentences":["I have ___ to do this weekend, so I feel bored."],"options":["nothing","anything","something","everything"],"correct_index":0}},{"word":"guide","ipa":"/ɡaɪd/","image_prompts":["A travel guidebook open on a park bench, showing a map of a city with landmarks circled","A hiking trail signpost with arrows and distances, wooden post in a forest"],"image_desc_en":"A travel guidebook open on a park bench with a city map and circled landmarks.","image_desc_cn":"一本旅行指南书打开放在公园长椅上，显示城市地图和圈出的地标。","meaning_cn":"n. 指南；导游；v. 引导；带领","usage":"名词 n. / 动词 v. (过去式 guided, 过去分词 guided)","collocations":"tour guide, guide book, guide dog","preposition_combos":"guide to, guide through","examples":[{"en":"The tour guide showed us around the old castle.","cn":"导游带我们参观了古老的城堡。"},{"en":"This map will guide you to the nearest bus stop.","cn":"这张地图会指引你到最近的公交站。"}],"socratic_questions":[{"question":"你去一个陌生城市旅游，需要一本书告诉你哪里好玩、怎么走，这本书叫什么？","answer_hint":"这个词既指‘导游’（人），也指‘指南’（书），能提供方向或信息。"}],"fill_blank":{"sentences":["A ___ can help tourists find interesting places in a city."],"options":["guide","teacher","driver","cook"],"correct_index":0}},{"word":"scenery","ipa":"/ˈsiːnəri/","image_prompts":["A vast mountain landscape with snow-capped peaks and a clear blue lake reflecting the sky, no people","A winding road through autumn forest with red and orange leaves, a wooden fence on the side, no people"],"image_desc_en":"Natural landscape views without any human figures.","image_desc_cn":"没有人物出现的自然风景画面。","meaning_cn":"风景，景色（尤指自然风光）","usage":"n. (不可数名词)","collocations":"enjoy the scenery, beautiful scenery, natural scenery","preposition_combos":"scenery of (the mountains)","examples":[{"en":"We stopped the car to enjoy the beautiful mountain scenery.","cn":"我们停车欣赏美丽的山景。"},{"en":"The scenery along the river is really amazing in spring.","cn":"春天沿河的风景真的很美。"}],"socratic_questions":[{"question":"你和家人去郊外旅行，看到连绵的山脉、清澈的湖泊和茂密的森林，你会用什么词来形容眼前看到的自然风光？","answer_hint":"这个词专门指自然景观，不是指人工建筑或城市景观。"}],"fill_blank":{"sentences":["The ___ in the countryside is much more beautiful than in the city."],"options":["scenery","view","sight","scene"],"correct_index":0}},{"word":"silk","ipa":"/sɪlk/","image_prompts":["A smooth, shiny white silk fabric draped over a wooden table, soft folds visible","A spool of red silk thread next to a sewing needle on a plain cotton cloth"],"image_desc_en":"Soft, shiny fabric or thread material without any people.","image_desc_cn":"柔软有光泽的布料或丝线材料，无人出现。","meaning_cn":"丝绸；丝线","usage":"n. (不可数名词)","collocations":"silk dress, silk scarf, made of silk","preposition_combos":"silk from (China)","examples":[{"en":"She bought a beautiful silk scarf for her mother's birthday.","cn":"她给妈妈买了一条漂亮的丝巾作为生日礼物。"},{"en":"This tie is made of real silk and feels very soft.","cn":"这条领带是真丝做的，摸起来很柔软。"}],"socratic_questions":[{"question":"你摸到一块布料，它非常光滑、柔软，还有淡淡的光泽，你知道它是什么材质吗？","answer_hint":"这种材质来自蚕吐的丝，常用于制作高档衣物和围巾。"}],"fill_blank":{"sentences":["The dress feels so smooth because it is made of ___."],"options":["silk","cotton","wool","nylon"],"correct_index":0}},{"word":"scarf","ipa":"/skɑːrf/","image_prompts":["A red wool scarf neatly folded on a wooden hanger in a closet","A blue silk scarf draped over the back of a white chair near a window"],"image_desc_en":"A piece of fabric worn around the neck, shown without a person.","image_desc_cn":"围在脖子上的织物，画面中无人。","meaning_cn":"围巾","usage":"n. (可数名词，复数 scarves 或 scarfs)","collocations":"wear a scarf, knit a scarf, wool scarf","preposition_combos":"scarf around (the neck)","examples":[{"en":"I always wear a warm scarf in winter to keep my neck warm.","cn":"冬天我总是戴一条暖和的围巾来保暖脖子。"},{"en":"She knitted a long red scarf for her best friend.","cn":"她给最好的朋友织了一条长长的红围巾。"}],"socratic_questions":[{"question":"冬天出门时，你觉得脖子很冷，需要一件什么物品来保暖？","answer_hint":"这是一块长条形的布料，可以绕在脖子上。"}],"fill_blank":{"sentences":["She put on a warm ___ before going out in the snow."],"options":["scarf","hat","glove","coat"],"correct_index":0}},{"word":"ready","ipa":"/ˈredi/","image_prompts":["A fully packed school backpack with zippers closed, sitting on a clean desk","A dining table set with plates, cups, and cutlery, food steaming in bowls"],"image_desc_en":"Objects arranged or prepared for use, no people present.","image_desc_cn":"物品已准备好待用，无人出现。","meaning_cn":"准备好的；乐意的","usage":"adj.","collocations":"get ready, be ready for, ready to do","preposition_combos":"ready for (the exam), ready to (go)","examples":[{"en":"Are you ready for the math test tomorrow morning?","cn":"你准备好明天早上的数学考试了吗？"},{"en":"Dinner is ready, so please wash your hands quickly.","cn":"晚饭准备好了，请快点洗手。"}],"socratic_questions":[{"question":"明天要交作业，你今晚把所有题目都做完了，检查了一遍，现在你的状态可以用哪个词形容？","answer_hint":"这个词表示一切就绪，没有遗漏。"}],"fill_blank":{"sentences":["The students are ___ for the final exam next week."],"options":["ready","happy","tired","busy"],"correct_index":0}},{"word":"ready to do sth","ipa":"/ˈredi tə duː ˈsʌmθɪŋ/","image_prompts":["A backpack packed with books and a water bottle, placed next to a front door, morning sunlight streaming in","A kitchen counter with a lunch box and a note saying 'Have a great day!' beside a clock showing 7:00 AM"],"image_desc_en":"A backpack packed with books and a water bottle, placed next to a front door, morning sunlight streaming in","image_desc_cn":"一个装满书本和水瓶的背包放在前门旁边，晨光洒入","meaning_cn":"准备好做某事","usage":"adj. phrase (ready 是形容词，后接不定式)","collocations":"get ready to, be ready to, feel ready to","preposition_combos":"ready for (后接名词)","examples":[{"en":"I am ready to start my homework after dinner.","cn":"晚饭后我准备好开始做作业了。"},{"en":"The team is ready to play the final match tomorrow.","cn":"队伍准备好明天打决赛了。"}],"socratic_questions":[{"question":"你吃完早餐，背上书包，站在门口，心里想着‘现在可以去上学了’，这时你处于什么状态？","answer_hint":"这个短语表示‘已经准备就绪，可以开始做某事了’，强调行动前的状态。"}],"fill_blank":{"sentences":["She packed her bag and felt ___ ___ ___ leave for the trip."],"options":["ready to","afraid to","tired to","happy to"],"correct_index":0}},{"word":"somewhere","ipa":"/ˈsʌmweər/","image_prompts":["A winding path leading into a dense green forest, sunlight filtering through leaves, no people visible","A quiet beach with a single seashell on golden sand, ocean waves in the distance, empty horizon"],"image_desc_en":"A winding path leading into a dense green forest, sunlight filtering through leaves, no people visible","image_desc_cn":"一条蜿蜒小径通向茂密的绿色森林，阳光透过树叶洒下，无人可见","meaning_cn":"在某处；到某处","usage":"adv.","collocations":"go somewhere, somewhere else, somewhere quiet","preposition_combos":"somewhere in, somewhere near","examples":[{"en":"I want to go somewhere cool for summer vacation.","cn":"我想去某个凉爽的地方过暑假。"},{"en":"My keys must be somewhere in this room.","cn":"我的钥匙一定在这个房间的某个地方。"}],"socratic_questions":[{"question":"你找不到你的笔了，你觉得它可能在书包里、桌子上或者地上，但不确定具体位置，你会怎么说？","answer_hint":"这个词表示‘某个不确定的地方’，常用于描述位置不明确的情况。"}],"fill_blank":{"sentences":["Let's find ___ quiet to read our books."],"options":["somewhere","anywhere","nowhere","everywhere"],"correct_index":0}},{"word":"myself","ipa":"/maɪˈself/","image_prompts":["A mirror reflecting a tidy desk with a notebook and a pen, no person visible","A pair of hands holding a cup of tea, steam rising, soft lighting, no face shown"],"image_desc_en":"A mirror reflecting a tidy desk with a notebook and a pen, no person visible","image_desc_cn":"一面镜子反射出一张整洁的书桌，上面有笔记本和笔，无人可见","meaning_cn":"我自己","usage":"pron. (反身代词)","collocations":"by myself, teach myself, enjoy myself","preposition_combos":"to myself, for myself","examples":[{"en":"I made this birthday card all by myself.","cn":"这张生日卡片完全是我自己做的。"},{"en":"I taught myself how to play the guitar last year.","cn":"去年我自学了弹吉他。"}],"socratic_questions":[{"question":"你一个人完成了整个手工作品，没有别人帮忙，你想强调‘是我一个人做的’，该用哪个词？","answer_hint":"这个词是反身代词，表示动作回到主语本身，常用于强调‘独自’或‘亲自’。"}],"fill_blank":{"sentences":["I hurt ___ while cutting the paper."],"options":["myself","yourself","himself","itself"],"correct_index":0}},{"word":"nothing but","ipa":"/ˈnʌθɪŋ bʌt/","image_prompts":["An empty white plate on a wooden table with only a single apple core left, nothing but the core remains","A clear blue sky with no clouds, only a single white bird flying far away, nothing but the bird visible"],"image_desc_en":"An empty plate with only an apple core, representing 'nothing but' the core left.","image_desc_cn":"一个空盘子里只有一个苹果核，表示只剩下苹果核。","meaning_cn":"只有；仅仅","usage":"短语 prep. 表示“除了……以外什么都没有；仅仅”。","collocations":"nothing but the truth, nothing but trouble, nothing but silence","preposition_combos":"无特殊介词搭配","examples":[{"en":"I want nothing but a glass of cold water.","cn":"我只要一杯冷水。"},{"en":"The room was dark with nothing but a small candle.","cn":"房间里很暗，只有一根小蜡烛。"}],"socratic_questions":[{"question":"你考试考了满分，妈妈问你要什么奖励，你说你只想要一本新书。这里“只想要”用哪个短语？","answer_hint":"强调“除了这个之外什么都不要”，用 nothing but 最准确。"}],"fill_blank":{"sentences":["He ate ___ a piece of bread for breakfast."],"options":["nothing but","something like","anything except","everything but"],"correct_index":0}},{"word":"hotel","ipa":"/hoʊˈtel/","image_prompts":["A tall modern hotel building with many lit windows at night, a glowing sign reading 'HOTEL' above the entrance","A cozy hotel lobby with a check-in desk, a sofa, and a large clock on the wall"],"image_desc_en":"A tall hotel building with illuminated windows and a sign, representing a hotel.","image_desc_cn":"一栋高大的酒店建筑，窗户亮着灯，入口上方有酒店标志。","meaning_cn":"酒店；旅馆","usage":"名词 n. (复数 hotels) 可数名词。","collocations":"stay at a hotel, book a hotel, hotel room, five-star hotel","preposition_combos":"at a hotel, in a hotel","examples":[{"en":"We booked a hotel near the train station.","cn":"我们订了一家火车站附近的酒店。"},{"en":"The hotel has a swimming pool and a gym.","cn":"这家酒店有游泳池和健身房。"}],"socratic_questions":[{"question":"你和家人去外地旅游，晚上需要找地方睡觉和休息，你会去哪里？","answer_hint":"提供住宿和服务的场所，就是 hotel。"}],"fill_blank":{"sentences":["They stayed in a ___ by the beach during the holiday."],"options":["hotel","school","library","hospital"],"correct_index":0}},{"word":"comfortable","ipa":"/ˈkʌmfərtəbl/","image_prompts":["A soft beige sofa with plush cushions and a folded blanket, warm sunlight streaming through a window","A pair of worn leather slippers placed on a fluffy rug near a fireplace with glowing embers"],"image_desc_en":"A soft sofa with cushions and blanket in warm sunlight, representing comfort.","image_desc_cn":"一张柔软的沙发，配有靠垫和毯子，沐浴在温暖的阳光下，代表舒适。","meaning_cn":"舒适的；舒服的","usage":"形容词 adj. (比较级 more comfortable, 最高级 most comfortable) 副词形式 comfortably。","collocations":"comfortable chair, comfortable shoes, feel comfortable, comfortable temperature","preposition_combos":"comfortable with (对……感到舒适)","examples":[{"en":"This old armchair is very comfortable to sit in.","cn":"这把旧扶手椅坐起来很舒服。"},{"en":"Wear comfortable shoes for the long walk.","cn":"长途步行要穿舒适的鞋子。"}],"socratic_questions":[{"question":"你坐了一整天硬板凳，腰酸背痛，现在换到一张有软垫的椅子上，你会觉得怎么样？","answer_hint":"形容身体感觉放松、不难受，用 comfortable。"}],"fill_blank":{"sentences":["The bed in the hotel room was very ___."],"options":["comfortable","hard","small","noisy"],"correct_index":0}},{"word":"bored","ipa":"/bɔːrd/","image_prompts":["A closed book lying on a desk next to an untouched cup of tea, a clock showing a slow passing of time","A blank whiteboard in an empty classroom with a single dry-erase marker left on the tray"],"image_desc_en":"A closed book and untouched tea on a desk, with a clock, representing boredom.","image_desc_cn":"桌上放着一本合上的书和一杯未动过的茶，旁边有钟表，代表无聊。","meaning_cn":"无聊的；厌倦的","usage":"形容词 adj. (比较级 more bored, 最高级 most bored) 动词 bore (过去式 bored, 过去分词 bored)。","collocations":"get bored, feel bored, bored with, bored of","preposition_combos":"bored with / bored of (对……感到厌倦)","examples":[{"en":"I felt bored during the long train ride.","cn":"漫长的火车旅途中我感到无聊。"},{"en":"She is bored with watching the same TV show.","cn":"她厌倦了看同一个电视节目。"}],"socratic_questions":[{"question":"周末下雨不能出去玩，你坐在沙发上翻来翻去，觉得做什么都没意思，这时候你的心情是什么？","answer_hint":"形容因为无事可做或重复做同一件事而感到没劲，用 bored。"}],"fill_blank":{"sentences":["The students looked ___ because the lesson was too long."],"options":["bored","excited","happy","tired"],"correct_index":0}},{"word":"sky","ipa":"/skaɪ/","image_prompts":["A clear blue sky with a few white clouds floating near the horizon, sunlight streaming through","A sunset sky with orange and pink clouds layered above a calm ocean surface"],"image_desc_en":"A wide view of the sky showing clouds and sunlight.","image_desc_cn":"展示云朵和阳光的广阔天空景象。","meaning_cn":"天空","usage":"n. (可数名词，常用单数)","collocations":"blue sky, clear sky, night sky, in the sky","preposition_combos":"in the sky, across the sky","examples":[{"en":"The sky is very blue after the rain stops.","cn":"雨停后天空非常蓝。"},{"en":"Birds fly high in the sky during autumn.","cn":"秋天鸟儿在天空中高高飞翔。"}],"socratic_questions":[{"question":"小明抬头看，看到头顶上方那片广阔、蓝色的区域，里面还有白云。这是什么？","answer_hint":"这个词指头顶上方的大气空间，常与蓝色、云朵搭配。"}],"fill_blank":{"sentences":["Look at the ___! It's full of stars tonight."],"options":["sky","sea","ground","wall"],"correct_index":0}},{"word":"towards","ipa":"/təˈwɔːrdz/","image_prompts":["A long straight road leading towards a distant mountain peak under a cloudy sky","An arrow sign pointing towards a bright red building at the end of a street"],"image_desc_en":"A direction indicator showing movement in a specific direction.","image_desc_cn":"显示朝特定方向移动的方向指示。","meaning_cn":"朝，向，接近","usage":"prep.","collocations":"walk towards, run towards, move towards, towards the end","preposition_combos":"towards the door, towards the park","examples":[{"en":"She walks towards the library every morning.","cn":"她每天早上朝图书馆走去。"},{"en":"The cat runs towards its food bowl quickly.","cn":"猫快速朝它的食碗跑去。"}],"socratic_questions":[{"question":"你站在学校门口，朋友在操场另一边叫你过去。你移动的方向是朋友所在的位置。用哪个介词描述这个方向？","answer_hint":"这个词表示‘朝某个方向移动’，后面常接地点或人。"}],"fill_blank":{"sentences":["The dog ran ___ its owner when called."],"options":["towards","away","behind","under"],"correct_index":0}},{"word":"rainbow","ipa":"/ˈreɪnboʊ/","image_prompts":["A full rainbow arching across a green field after a rain shower, with dark clouds in the background","A double rainbow over a waterfall with mist rising and sunlight refracting into colors"],"image_desc_en":"A colorful arc in the sky with red, orange, yellow, green, blue, indigo, violet bands.","image_desc_cn":"天空中带有红、橙、黄、绿、蓝、靛、紫色彩带的弧形。","meaning_cn":"彩虹","usage":"n. (可数名词)","collocations":"see a rainbow, colorful rainbow, rainbow colors, rainbow in the sky","preposition_combos":"rainbow in the sky, rainbow over the mountain","examples":[{"en":"A beautiful rainbow appears after the summer rain.","cn":"夏雨过后出现了一道美丽的彩虹。"},{"en":"The rainbow has seven different colors in the sky.","cn":"彩虹在天空中有七种不同的颜色。"}],"socratic_questions":[{"question":"雨后太阳出来，天空中出现了一道由七种颜色组成的弧形光带。这是什么自然现象？","answer_hint":"这个词指雨后天空出现的彩色弧形，颜色顺序固定。"}],"fill_blank":{"sentences":["After the storm, a bright ___ appeared in the east."],"options":["rainbow","cloud","moon","star"],"correct_index":0}},{"word":"square","ipa":"/skwer/","image_prompts":["A large public square with a fountain in the center, surrounded by trees and benches, empty of people","A square-shaped wooden table with a chessboard on top, four chairs around it, bright daylight"],"image_desc_en":"A public square with a central fountain and surrounding trees, or a square table with a chessboard.","image_desc_cn":"一个有中央喷泉和周围树木的公共广场，或一张带棋盘的正方形桌子。","meaning_cn":"正方形；广场；平方的","usage":"n. (可数名词) / adj.","collocations":"in the square, square meters, square shape","preposition_combos":"in the square, on the square","examples":[{"en":"The park has a large square where people can walk.","cn":"公园里有一个大广场，人们可以散步。"},{"en":"My bedroom is about fifteen square meters in size.","cn":"我的卧室大约有十五平方米大小。"}],"socratic_questions":[{"question":"你想描述一个城市里没有车辆、人们可以聚集的空地，或者数学课上计算面积时用的形状，该用哪个词？","answer_hint":"这个词既指几何形状，也指城市中的开放空间。"}],"fill_blank":{"sentences":["The city center has a beautiful ___ with a fountain."],"options":["square","circle","bridge","garden"],"correct_index":0}},{"word":"during","ipa":"/ˈdʊrɪŋ/","image_prompts":["A calendar with a red circle around a date, a clock showing 3 PM, sunlight streaming through a window","A closed book with a bookmark inside, a cup of tea next to it, soft lamp light"],"image_desc_en":"A calendar and clock indicating a specific time period, or a book with a bookmark showing an ongoing activity.","image_desc_cn":"一个日历和时钟指示特定时间段，或一本带书签的书表示正在进行的活动。","meaning_cn":"在……期间","usage":"prep.","collocations":"during the day, during class, during the summer","preposition_combos":"during + 名词短语","examples":[{"en":"We must not talk loudly during the exam.","cn":"考试期间我们不得大声说话。"},{"en":"I read three books during the winter holiday.","cn":"寒假期间我读了三本书。"}],"socratic_questions":[{"question":"你想说某个活动发生在某个时间段之内，比如在考试中、在假期里，该用哪个介词？","answer_hint":"这个词强调在某个持续的时间段内发生某事，而不是具体的时间点。"}],"fill_blank":{"sentences":["Please keep quiet ___ the movie."],"options":["during","after","before","until"],"correct_index":0}},{"word":"victory","ipa":"/ˈvɪktəri/","image_prompts":["A golden trophy cup on a wooden podium, confetti scattered around, bright stage lights","A finish line ribbon stretched across a running track, a stopwatch showing a winning time"],"image_desc_en":"A golden trophy on a podium with confetti, or a finish line ribbon on a track with a stopwatch.","image_desc_cn":"领奖台上的金色奖杯和五彩纸屑，或跑道上的终点线丝带和秒表。","meaning_cn":"胜利","usage":"n. (可数名词，常用单数)","collocations":"win a victory, celebrate victory, a great victory","preposition_combos":"victory in, victory over","examples":[{"en":"Our team celebrated a hard-won victory in the final match.","cn":"我们队在决赛中庆祝了一场来之不易的胜利。"},{"en":"The victory gave everyone a sense of pride and joy.","cn":"这场胜利给了每个人自豪和喜悦的感觉。"}],"socratic_questions":[{"question":"你想表达在比赛或竞争中最终获胜的结果，比如赢得奖杯或第一名，该用哪个词？","answer_hint":"这个词强调成功战胜对手或达成目标，常与奖杯、庆祝相关。"}],"fill_blank":{"sentences":["The team's ___ was celebrated with loud cheers."],"options":["victory","defeat","practice","meeting"],"correct_index":0}},{"word":"Russian","ipa":"/ˈrʌʃən/","image_prompts":["A set of colorful matryoshka dolls arranged in size order on a wooden shelf","A bowl of borscht soup with sour cream on top, a spoon beside it, on a checkered tablecloth"],"image_desc_en":"Colorful matryoshka dolls on a shelf, or a bowl of borscht soup with sour cream on a checkered tablecloth.","image_desc_cn":"架子上排列的彩色套娃，或格子桌布上一碗带酸奶油的红菜汤。","meaning_cn":"俄语的；俄罗斯的；俄罗斯人","usage":"adj. / n. (可数名词指人，不可数名词指语言)","collocations":"Russian language, Russian food, Russian culture","preposition_combos":"in Russian, from Russia","examples":[{"en":"She can speak a little Russian after studying for two years.","cn":"她学了两年后能说一点俄语。"},{"en":"Russian dolls are a famous traditional craft from that country.","cn":"俄罗斯套娃是那个国家著名的传统工艺品。"}],"socratic_questions":[{"question":"你想描述来自一个横跨欧亚大陆的国家的人、语言或物品，比如套娃或罗宋汤，该用哪个词？","answer_hint":"这个词指俄罗斯的，包括语言、国籍和文化物品。"}],"fill_blank":{"sentences":["I want to learn ___ because I like its literature."],"options":["Russian","English","Chinese","French"],"correct_index":0}},{"word":"fight","ipa":"/faɪt/","image_prompts":["Two clenched fists colliding in mid-air with dust particles, dramatic lighting on a dark background","A broken wooden chair and scattered papers on a classroom floor, overturned desk with scratches"],"image_desc_en":"Two fists hitting each other with dust flying, or a damaged classroom scene with broken furniture.","image_desc_cn":"两只拳头相撞，尘土飞扬；或一间被破坏的教室，桌椅散落。","meaning_cn":"打架；斗争；奋斗","usage":"v. (过去式 fought, 过去分词 fought) / n.","collocations":"have a fight, put up a fight, fight for, fight against","preposition_combos":"fight for (为…而战), fight against (对抗…), fight with (与…打架)","examples":[{"en":"They had a big fight over the last piece of pizza.","cn":"他们为最后一块披萨大吵了一架。"},{"en":"We must fight for our dreams every single day.","cn":"我们必须每天为梦想而奋斗。"}],"socratic_questions":[{"question":"你和同桌因为谁先使用橡皮发生了争执，最后甚至动手推搡。老师问你们在做什么，你会用哪个词描述这个行为？","answer_hint":"这个词表示双方互相打斗或激烈争吵，常用于描述肢体冲突或激烈对抗。"}],"fill_blank":{"sentences":["The two boys started to ___ over a small misunderstanding."],"options":["fight","dance","sing","sleep"],"correct_index":0}},{"word":"against","ipa":"/əˈɡenst/","image_prompts":["A bicycle leaning against a brick wall with a rusty chain, afternoon shadow cast on the ground","A chessboard with black pieces lined up against white pieces, intense contrast under desk lamp"],"image_desc_en":"A bike resting on a wall, or chess pieces positioned opposite each other on a board.","image_desc_cn":"一辆自行车靠在墙上；或棋盘上黑白棋子对峙。","meaning_cn":"反对；靠着；对抗","usage":"prep.","collocations":"against the wall, against the rules, fight against, stand against","preposition_combos":"against the wall (靠墙), against the wind (逆风), against one's will (违背意愿)","examples":[{"en":"He leaned his umbrella against the door quietly.","cn":"他悄悄把雨伞靠在门上。"},{"en":"It is against the school rules to run in the hallway.","cn":"在走廊里奔跑是违反校规的。"}],"socratic_questions":[{"question":"考试时，老师规定不能使用手机查单词，但你的朋友想偷偷用。你提醒他这样做是违反规定的，该用哪个介词？","answer_hint":"这个介词表示“违反”或“与…相反”，常与rules搭配使用。"}],"fill_blank":{"sentences":["It is ___ the law to copy others' homework."],"options":["against","for","with","under"],"correct_index":0}},{"word":"fight against sb","ipa":"/faɪt əˈɡenst ˈsʌmbədi/","image_prompts":["Two toy soldiers facing each other on a wooden floor, one knocked over with a plastic sword nearby","A crumpled red flag with the word 'STOP' lying on a muddy field, broken fence in background"],"image_desc_en":"Toy soldiers in a battle pose with one fallen, or a torn protest flag on a muddy ground.","image_desc_cn":"两个玩具士兵对峙，其中一个倒下；或一面写着‘停止’的破旗躺在泥地上。","meaning_cn":"与某人斗争/对抗","usage":"v. phrase (fight 的过去式 fought, 过去分词 fought)","collocations":"fight against the enemy, fight against the bully, fight against the team","preposition_combos":"fight against + 对手/对象","examples":[{"en":"The team fought against a stronger opponent and won.","cn":"这支队伍与更强的对手对抗并获胜。"},{"en":"She fought against her fear of speaking in public.","cn":"她克服了在公众面前演讲的恐惧。"}],"socratic_questions":[{"question":"你们班在篮球赛中遇到了去年冠军队伍，实力悬殊，但你们没有放弃，拼尽全力。老师表扬你们的精神，该用哪个短语描述你们的行为？","answer_hint":"这个短语强调“与某人或某物进行对抗”，常用于描述面对强大对手时的努力。"}],"fill_blank":{"sentences":["The soldiers had to ___ the enemy in the forest."],"options":["fight against","play with","talk to","run after"],"correct_index":0}},{"word":"artwork","ipa":"/ˈɑːrtwɜːrk/","image_prompts":["A colorful oil painting of a sunset hanging on a white gallery wall, soft spotlight above","A clay vase with blue floral patterns sitting on a wooden shelf, dried paintbrush beside it"],"image_desc_en":"A sunset oil painting on a gallery wall, or a decorated clay vase with a paintbrush nearby.","image_desc_cn":"一幅挂在画廊墙上的日落油画；或一个带有蓝色花纹的陶罐，旁边放着一支干画笔。","meaning_cn":"艺术作品；美术品","usage":"n. (可数或不可数)","collocations":"create artwork, display artwork, beautiful artwork, original artwork","preposition_combos":"piece of artwork (一件艺术品), artwork on display (展出的艺术品)","examples":[{"en":"The museum has a new artwork made of recycled bottles.","cn":"博物馆有一件用回收瓶子制成的新艺术品。"},{"en":"She spent a whole week finishing this delicate artwork.","cn":"她花了一整周完成这件精致的艺术品。"}],"socratic_questions":[{"question":"美术课上，你用废纸和颜料做了一幅拼贴画，老师觉得很有创意，想把它贴在教室墙上展示。老师会怎么称呼你的作品？","answer_hint":"这个词泛指任何通过绘画、雕塑、手工等创作出来的视觉艺术品。"}],"fill_blank":{"sentences":["The students created a beautiful ___ for the school festival."],"options":["artwork","homework","housework","teamwork"],"correct_index":0}},{"word":"thousands of","ipa":"/ˈθaʊzəndz əv/","image_prompts":["A vast field covered with thousands of blooming sunflowers stretching to the horizon under a clear blue sky","Thousands of colorful origami cranes hanging from strings in a bright room, creating a moving paper curtain"],"image_desc_en":"A vast field of sunflowers or a room full of origami cranes, showing a very large number of items.","image_desc_cn":"一片广阔的向日葵田或挂满千纸鹤的房间，展示数量极多的物品。","meaning_cn":"数以千计的；成千上万的","usage":"adj. (数量短语) 修饰可数名词复数，表示数量巨大","collocations":"thousands of people/books/stars/flowers","preposition_combos":"thousands of + 名词","examples":[{"en":"Thousands of stars shine brightly in the night sky tonight.","cn":"今晚夜空中成千上万颗星星闪闪发光。"},{"en":"The library has thousands of books for students to read.","cn":"图书馆有成千上万本书供学生阅读。"}],"socratic_questions":[{"question":"小明去图书馆，发现书架上的书多到数不清，远远超过一百本。你会用什么短语来形容这个数量？","answer_hint":"这个短语表示数量极大，以千为单位，比 hundreds of 更大。"}],"fill_blank":{"sentences":["There are ___ stars in the sky on a clear night."],"options":["thousands of","hundred of","a thousand","thousand of"],"correct_index":0}},{"word":"tear","ipa":"/tɪr/ (n.) /tɛr/ (v.)","image_prompts":["A single clear teardrop falling from an eye onto a white tissue, with a blurred background","A piece of paper being ripped in half by two hands, with jagged edges visible"],"image_desc_en":"A teardrop falling on tissue or paper being ripped apart, showing either crying or tearing action.","image_desc_cn":"一滴眼泪落在纸巾上，或一张纸被撕成两半，展示哭泣或撕扯的动作。","meaning_cn":"n. 眼泪；v. 撕破，撕裂","usage":"n. (可数名词，常用复数 tears)；v. (过去式 tore, 过去分词 torn)","collocations":"in tears, burst into tears, tear up, tear apart","preposition_combos":"tear at, tear into, tear through","examples":[{"en":"She wiped a tear from her eye after the sad movie.","cn":"看完那部悲伤的电影后，她擦去了一滴眼泪。"},{"en":"Be careful not to tear the page when you turn it.","cn":"翻页时小心别把纸撕破。"}],"socratic_questions":[{"question":"小华看了一部感人的电影，眼睛里有水珠流下来。这个水珠叫什么？","answer_hint":"这个水珠是眼睛流出的液体，表示悲伤或感动，名词形式。"}],"fill_blank":{"sentences":["She tried not to ___ the letter as she opened it quickly."],"options":["tear","cry","break","cut"],"correct_index":0}},{"word":"remind","ipa":"/rɪˈmaɪnd/","image_prompts":["A yellow sticky note on a refrigerator door with a clock drawn on it, next to a calendar","A smartphone alarm screen showing 7:00 AM with a bell icon and the word 'Wake up'"],"image_desc_en":"A sticky note on a fridge or a phone alarm screen, showing something that helps memory.","image_desc_cn":"冰箱上的便利贴或手机闹钟屏幕，展示帮助记忆的东西。","meaning_cn":"v. 提醒；使想起","usage":"v. (过去式 reminded, 过去分词 reminded)","collocations":"remind sb. of sth., remind sb. to do sth.","preposition_combos":"remind of, remind about","examples":[{"en":"This photo reminds me of our happy summer vacation.","cn":"这张照片让我想起我们快乐的暑假。"},{"en":"Please remind me to bring my homework tomorrow morning.","cn":"请提醒我明天早上带作业。"}],"socratic_questions":[{"question":"你怕明天忘记带课本，想让妈妈帮你记住这件事。你会用哪个动词表达？","answer_hint":"这个动词的意思是让别人帮忙记住做某事，后面常接 to do 或 of。"}],"fill_blank":{"sentences":["The old clock on the wall ___ me of my grandfather's house."],"options":["reminds","remembers","recalls","repeats"],"correct_index":0}},{"word":"peace","ipa":"/piːs/","image_prompts":["A white dove flying over a calm blue ocean with a rainbow in the distance","A quiet Zen garden with raked sand, a small rock, and a single green leaf floating in a stone basin"],"image_desc_en":"A dove over calm ocean or a Zen garden, representing tranquility and absence of conflict.","image_desc_cn":"平静海洋上的白鸽或禅意花园，代表宁静和没有冲突。","meaning_cn":"n. 和平；平静，安宁","usage":"n. (不可数名词)","collocations":"in peace, world peace, peace of mind, keep the peace","preposition_combos":"at peace, for peace","examples":[{"en":"Everyone in the world hopes for lasting peace.","cn":"世界上每个人都希望有持久的和平。"},{"en":"I like to sit in the garden and enjoy the peace.","cn":"我喜欢坐在花园里享受宁静。"}],"socratic_questions":[{"question":"考试结束后，教室里非常安静，没有吵闹声，你感觉很放松。这种状态可以用哪个名词形容？","answer_hint":"这个词表示没有战争或噪音的安静状态，与 war 或 noise 相反。"}],"fill_blank":{"sentences":["After the long argument, they finally made ___ with each other."],"options":["peace","piece","place","pace"],"correct_index":0}},{"word":"easily","ipa":"/ˈiːzɪli/","image_prompts":["A smooth, clean whiteboard with a simple math equation written in black marker, no eraser marks","A zipper gliding smoothly along a jacket track, no snags or pauses, bright daylight"],"image_desc_en":"A smooth whiteboard with a simple math equation, no eraser marks; a zipper gliding smoothly on a jacket track.","image_desc_cn":"一块光滑的白板上写着简单的数学等式，没有擦痕；拉链在夹克轨道上顺畅滑动。","meaning_cn":"adv. 容易地；轻松地","usage":"副词 adv. (比较级 more easily, 最高级 most easily)","collocations":"pass easily, find easily, solve easily, learn easily","preposition_combos":"无固定介词搭配","examples":[{"en":"She can solve this math problem easily in five minutes.","cn":"她能轻松地在五分钟内解出这道数学题。"},{"en":"The library book was easily found on the top shelf.","cn":"那本图书馆的书很容易就在顶层书架上找到了。"}],"socratic_questions":[{"question":"小明做一道简单的加减法，几乎不用思考就写出了答案。他完成这件事的状态可以用哪个副词形容？","answer_hint":"这个词表示‘毫不费力地’，强调过程轻松，没有困难。"}],"fill_blank":{"sentences":["He finished the 1000-word essay ___ before the deadline."],"options":["easily","hardly","quickly","carefully"],"correct_index":0}},{"word":"forget","ipa":"/fərˈɡet/","image_prompts":["A half-open school locker with a single key hanging from the lock, a crumpled note on the floor","A calendar on a wall with a red X marked on yesterday's date, a sticky note peeling off"],"image_desc_en":"A half-open locker with a key hanging and a crumpled note on the floor; a calendar with a red X on yesterday's date and a peeling sticky note.","image_desc_cn":"一个半开的储物柜，挂着钥匙，地上有揉皱的纸条；日历上昨天的日期画了红叉，一张便利贴正在脱落。","meaning_cn":"v. 忘记；遗忘","usage":"v. (过去式 forgot, 过去分词 forgotten)","collocations":"forget to do, forget about, forget the way, never forget","preposition_combos":"forget about (忘记某事)","examples":[{"en":"I always forget to bring my water bottle to school.","cn":"我总是忘记带水壶去学校。"},{"en":"Don't forget your umbrella; it might rain this afternoon.","cn":"别忘了你的伞；今天下午可能会下雨。"}],"socratic_questions":[{"question":"你早上出门时妈妈提醒你带作业，但到了学校你才发现作业本还在书桌上。这个动作可以用哪个动词描述？","answer_hint":"这个词表示‘没有记住做某事’，通常后面接to do或直接接名词。"}],"fill_blank":{"sentences":["Please don't ___ to turn off the lights when you leave the classroom."],"options":["forget","remember","leave","keep"],"correct_index":0}},{"word":"noon","ipa":"/nuːn/","image_prompts":["A sundial in a garden casting a short shadow directly under the sun, bright sunlight","A clock tower showing 12:00 with the sun directly overhead, empty streets"],"image_desc_en":"A sundial with a short shadow directly under the sun; a clock tower showing 12:00 with the sun overhead.","image_desc_cn":"日晷在太阳正下方投下短影；钟楼显示12:00，太阳在正上方。","meaning_cn":"n. 中午；正午","usage":"名词 n. (不可数名词，通常不加冠词)","collocations":"at noon, before noon, after noon, noon break","preposition_combos":"at noon (在中午)","examples":[{"en":"The school cafeteria is always crowded at noon every day.","cn":"学校食堂每天中午总是很拥挤。"},{"en":"We usually have a one-hour break from noon to one o'clock.","cn":"我们通常从中午到一点有一小时的休息时间。"}],"socratic_questions":[{"question":"太阳升到天空最高处，影子最短，时钟指针指向12点。这个时间点叫什么？","answer_hint":"这个词指一天中太阳在正上方、影子最短的时刻，即12:00左右。"}],"fill_blank":{"sentences":["The library closes at ___ for lunch, so we need to return books before then."],"options":["noon","night","morning","midnight"],"correct_index":0}},{"word":"sick","ipa":"/sɪk/","image_prompts":["A thermometer showing a high temperature of 39°C on a wooden table next to a glass of water","A crumpled tissue on a bedside table with a half-empty bottle of cough syrup"],"image_desc_en":"A thermometer showing 39°C on a wooden table next to a glass of water; a crumpled tissue and half-empty cough syrup bottle on a bedside table.","image_desc_cn":"木桌上温度计显示39°C，旁边一杯水；床头柜上揉皱的纸巾和半瓶止咳糖浆。","meaning_cn":"adj. 生病的；恶心的","usage":"形容词 adj. (比较级 sicker, 最高级 sickest; 也可作表语形容词)","collocations":"feel sick, get sick, sick leave, sick of (厌烦)","preposition_combos":"sick of (对……感到厌烦)","examples":[{"en":"He felt sick after eating too much ice cream yesterday.","cn":"他昨天吃了太多冰淇淋后感到恶心。"},{"en":"The cat looked sick and stayed in its bed all morning.","cn":"那只猫看起来生病了，整个上午都待在窝里。"}],"socratic_questions":[{"question":"你早上起来觉得头晕、想吐，体温计显示38.5度。你现在的身体状态可以用哪个形容词描述？","answer_hint":"这个词表示‘身体不适、生病’，常与feel或get连用。"}],"fill_blank":{"sentences":["She stayed home because she was ___ and needed to rest."],"options":["sick","tired","happy","busy"],"correct_index":0}},{"word":"metro","ipa":"/ˈmetrəʊ/","image_prompts":["A subway train arriving at an underground platform, bright lights illuminating the tracks and station signs","A metro ticket with a magnetic stripe lying on a stainless steel turnstile, blurred background of tunnel lights"],"image_desc_en":"A metro train at a platform with glowing station signs and tracks.","image_desc_cn":"一列地铁列车停靠在站台，站牌和轨道灯光闪烁。","meaning_cn":"地铁","usage":"n. (可数名词，常作 the metro)","collocations":"take the metro, metro station, metro line, by metro","preposition_combos":"on the metro, in the metro, by metro","examples":[{"en":"We took the metro to the city center this morning.","cn":"今天早上我们坐地铁去了市中心。"},{"en":"The metro line runs under the main street of the town.","cn":"这条地铁线从镇上的主街地下穿过。"}],"socratic_questions":[{"question":"小明要去市中心，但路上堵车很严重，哪种交通工具能最快到达且不堵车？","answer_hint":"这种交通工具在地下行驶，不受地面交通影响，常被称为‘地铁’。"}],"fill_blank":{"sentences":["The fastest way to get downtown is to take the ___."],"options":["metro","bus","taxi","bike"],"correct_index":0}},{"word":"station","ipa":"/ˈsteɪʃn/","image_prompts":["A large railway station with multiple platforms and a digital departure board showing train times","A bus station with several buses parked in rows, a glass shelter and ticket booth visible"],"image_desc_en":"A railway station with platforms and a departure board.","image_desc_cn":"一个火车站，有多个月台和一块出发信息显示屏。","meaning_cn":"车站；站","usage":"n. (可数名词)","collocations":"train station, bus station, subway station, police station, at the station","preposition_combos":"at the station, in the station, to the station","examples":[{"en":"We waited for the train at the station for twenty minutes.","cn":"我们在车站等了二十分钟的火车。"},{"en":"The bus station is just two blocks away from my school.","cn":"公交车站离我的学校只有两个街区。"}],"socratic_questions":[{"question":"你坐火车去外婆家，出发前要在哪里等车、看车次信息？","answer_hint":"这个地方有月台和候车室，是火车停靠和乘客上下车的地方。"}],"fill_blank":{"sentences":["Please meet me at the bus ___ after school."],"options":["station","shop","library","park"],"correct_index":0}},{"word":"palace","ipa":"/ˈpæləs/","image_prompts":["A grand palace with golden spires and red walls under a clear blue sky, surrounded by a wide moat","An ornate palace interior with crystal chandeliers, marble floors, and gilded furniture"],"image_desc_en":"A grand palace with golden spires and red walls under a blue sky.","image_desc_cn":"一座宏伟的宫殿，金色尖顶和红色宫墙，蓝天映衬。","meaning_cn":"宫殿；皇宫","usage":"n. (可数名词)","collocations":"the Summer Palace, the Palace Museum, royal palace, palace garden","preposition_combos":"in the palace, at the palace, to the palace","examples":[{"en":"The Summer Palace is a famous tourist attraction in Beijing.","cn":"颐和园是北京著名的旅游景点。"},{"en":"We visited an old palace with beautiful gardens last weekend.","cn":"上周末我们参观了一座有美丽花园的古老宫殿。"}],"socratic_questions":[{"question":"古代皇帝居住的地方非常宏伟，有高大的城墙和精美的花园，这种建筑叫什么？","answer_hint":"这个词常与‘皇’字搭配，指帝王居住的豪华建筑。"}],"fill_blank":{"sentences":["The emperor once lived in this huge ___."],"options":["palace","house","school","shop"],"correct_index":0}},{"word":"accordion","ipa":"/əˈkɔːrdiən/","image_prompts":["A red accordion with black bellows resting on a wooden table, keys and buttons visible on both sides","An accordion with its bellows fully extended, showing the intricate folds and metal reeds inside"],"image_desc_en":"A red accordion with black bellows on a wooden table.","image_desc_cn":"一架红色手风琴，黑色风箱，放在木桌上。","meaning_cn":"手风琴","usage":"n. (可数名词)","collocations":"play the accordion, accordion player, accordion music, fold like an accordion","preposition_combos":"on the accordion, with an accordion","examples":[{"en":"My grandfather can play the accordion very well.","cn":"我爷爷手风琴拉得很好。"},{"en":"The street musician played a cheerful tune on his accordion.","cn":"街头音乐家用他的手风琴演奏了一首欢快的曲子。"}],"socratic_questions":[{"question":"有一种乐器，演奏时双手要拉开和合拢风箱，按键和按纽都在两侧，这是什么乐器？","answer_hint":"这种乐器有风箱，像折叠的纸一样伸缩，常用于民间音乐。"}],"fill_blank":{"sentences":["He is learning to play the ___ in his music class."],"options":["accordion","guitar","piano","drum"],"correct_index":0}},{"word":"get together","ipa":"/ɡet təˈɡeðər/","image_prompts":["A round wooden dining table with four plates, cups, and a steaming teapot, warm yellow lighting, no people","A living room with a sofa and coffee table, a board game box and scattered cards on the table, cozy fireplace in background"],"image_desc_en":"A dining table set for a meal with plates and cups, suggesting a family or friend gathering.","image_desc_cn":"一张摆好餐具的餐桌，暗示家庭或朋友聚会。","meaning_cn":"聚会；相聚","usage":"动词短语 (phrasal verb) — 过去式 got together，过去分词 gotten together","collocations":"get together with friends, family get together, get together for dinner","preposition_combos":"get together with (someone), get together for (an occasion)","examples":[{"en":"Our family will get together for a big dinner this weekend.","cn":"我们这个周末全家会聚在一起吃一顿大餐。"},{"en":"Let's get together after school to practice the play.","cn":"放学后我们聚在一起排练话剧吧。"}],"socratic_questions":[{"question":"你和几个好朋友约好周末下午一起在公园野餐，大家都会到场。这个活动叫什么？","answer_hint":"强调大家从不同地方来到同一个地方，共同做一件事，用这个短语。"}],"fill_blank":{"sentences":["We usually ___ ___ for a barbecue on National Day."],"options":["get together","get up","get along","get over"],"correct_index":0}},{"word":"in the sun","ipa":"/ɪn ðə sʌn/","image_prompts":["A white towel spread on green grass under bright sunlight, a pair of sunglasses resting on the towel","A glass of lemonade with ice cubes on a wooden table, sunlight casting sharp shadows and a warm glow"],"image_desc_en":"A towel and sunglasses on grass under direct sunlight, showing a sunny outdoor scene.","image_desc_cn":"草地上的一条毛巾和太阳镜，阳光直射，展现晴朗的户外场景。","meaning_cn":"在阳光下","usage":"介词短语 (prepositional phrase) — 常与动词 sit, lie, read, play 等连用","collocations":"sit in the sun, read in the sun, play in the sun, dry in the sun","preposition_combos":"无固定搭配，in the sun 本身为固定短语","examples":[{"en":"The cat likes to sleep in the sun on the windowsill.","cn":"那只猫喜欢在窗台上的阳光下睡觉。"},{"en":"Don't read in the sun for too long; it hurts your eyes.","cn":"不要在阳光下看书太久，会伤害眼睛。"}],"socratic_questions":[{"question":"天气很好，你把湿衣服挂在阳台外面，想让它们快点干。衣服挂在什么环境里？","answer_hint":"强调光线直接照射的位置，而不是阴凉处。"}],"fill_blank":{"sentences":["We should not stay ___ ___ ___ for too long without sunscreen."],"options":["in the sun","under the sun","on the sun","at the sun"],"correct_index":0}},{"word":"tower","ipa":"/ˈtaʊər/","image_prompts":["A tall stone tower with a pointed roof against a blue sky, surrounded by green trees, no people","A wooden observation tower in a forest, with a staircase spiraling up, autumn leaves on the ground"],"image_desc_en":"A tall stone tower with a pointed roof under a clear blue sky, surrounded by trees.","image_desc_cn":"一座尖顶石塔矗立在蓝天之下，四周绿树环绕。","meaning_cn":"塔；高楼","usage":"名词 (n.) — 可数名词，复数 towers","collocations":"clock tower, TV tower, Eiffel Tower, tower block","preposition_combos":"at the top of the tower, from the tower, tower of (e.g., tower of books)","examples":[{"en":"We climbed to the top of the tower and saw the whole city.","cn":"我们爬到塔顶，看到了整座城市。"},{"en":"There is a tall clock tower in the center of the square.","cn":"广场中央有一座高高的钟楼。"}],"socratic_questions":[{"question":"你去一个古老的城市旅游，看到一座很高的石头建筑，可以爬上去看风景。它叫什么？","answer_hint":"这是一种又高又窄的建筑物，通常独立存在，不是普通的楼房。"}],"fill_blank":{"sentences":["The Eiffel ___ is one of the most famous landmarks in the world."],"options":["Tower","Building","House","Bridge"],"correct_index":0}},{"word":"might","ipa":"/maɪt/","image_prompts":["A dark cloud with a few raindrops falling, a half-open umbrella leaning against a wall","A closed book on a desk with a question mark drawn on a sticky note beside it"],"image_desc_en":"A dark cloud with raindrops and an umbrella, suggesting uncertain weather possibility.","image_desc_cn":"乌云和雨滴，一把半开的伞靠在墙边，暗示天气不确定的可能性。","meaning_cn":"可能；也许","usage":"情态动词 (modal v.) — 无人称和时态变化，后接动词原形","collocations":"might be, might have, might not, might as well","preposition_combos":"无固定搭配，后接动词原形","examples":[{"en":"It might rain later, so take an umbrella with you.","cn":"一会儿可能会下雨，所以带上伞吧。"},{"en":"She might not come to the party because she has a test tomorrow.","cn":"她可能不来参加派对，因为她明天有考试。"}],"socratic_questions":[{"question":"你看到天空有乌云，但不确定会不会下雨。你提醒朋友带伞时，用什么词表示“不确定的可能性”？","answer_hint":"这个词比 will 可能性低，比 can 更委婉，表示一种推测。"}],"fill_blank":{"sentences":["He ___ be late because the traffic is very heavy now."],"options":["might","must","can","should"],"correct_index":0}},{"word":"budget","ipa":"/ˈbʌdʒɪt/","image_prompts":["A clear glass jar filled with coins and a few dollar bills, a small notebook labeled 'budget' next to it on a wooden table","A calculator with a paper receipt showing numbers, a pencil and an eraser beside a handwritten list of expenses"],"image_desc_en":"A glass jar with coins and bills, a notebook labeled 'budget' beside it","image_desc_cn":"一个装满硬币和纸币的玻璃罐，旁边有一本标有“预算”的笔记本","meaning_cn":"预算；为…做预算","usage":"n. / v. (过去式 budgeted, 过去分词 budgeted)","collocations":"on a budget, budget for, monthly budget","preposition_combos":"budget for (为…做预算)","examples":[{"en":"We need to make a budget for our school trip.","cn":"我们需要为学校旅行制定一个预算。"},{"en":"She budgeted her pocket money carefully this month.","cn":"这个月她仔细规划了自己的零花钱预算。"}],"socratic_questions":[{"question":"你计划用零花钱买一本新书和一支钢笔，但钱不够。你需要先做什么来合理安排？","answer_hint":"这个词表示对收入和支出进行计划，通常用于控制花费。"}],"fill_blank":{"sentences":["My family made a ___ for our summer vacation."],"options":["budget","passport","forgetful","faraway"],"correct_index":0}},{"word":"passport","ipa":"/ˈpɑːspɔːrt/","image_prompts":["A dark blue passport lying open on a world map, with a small airplane model on the corner","A passport stamp of a foreign country on a page, next to a boarding pass and a luggage tag"],"image_desc_en":"An open passport on a world map with a toy airplane","image_desc_cn":"一本打开的护照放在世界地图上，旁边有一个玩具飞机","meaning_cn":"护照","usage":"n. (可数名词，复数 passports)","collocations":"apply for a passport, passport photo, passport control","preposition_combos":"passport to (…的通行证/途径)","examples":[{"en":"You need a passport to travel to another country.","cn":"你需要护照才能去另一个国家旅行。"},{"en":"He showed his passport at the airport check-in desk.","cn":"他在机场值机柜台出示了护照。"}],"socratic_questions":[{"question":"暑假你计划去国外参加一个夏令营，但出发前必须准备一个重要的证件，这个证件上会有你的照片和国籍信息。它是什么？","answer_hint":"这个词是国际旅行必备的身份证明文件。"}],"fill_blank":{"sentences":["Before flying abroad, you must have a valid ___."],"options":["budget","passport","forgetful","faraway"],"correct_index":1}},{"word":"forgetful","ipa":"/fərˈɡetfl/","image_prompts":["A set of house keys lying on a park bench with autumn leaves, a sticky note reading 'keys' on the bench","An open school backpack with a lunch box and a water bottle, a notebook with a question mark drawn on it"],"image_desc_en":"Keys on a park bench with a sticky note, autumn leaves around","image_desc_cn":"钥匙放在公园长椅上，旁边有一张便利贴，周围有秋叶","meaning_cn":"健忘的；记性差的","usage":"adj. (副词 forgetfully)","collocations":"become forgetful, forgetful of, a forgetful person","preposition_combos":"forgetful of (忘记…)","examples":[{"en":"My grandpa is a little forgetful about his glasses.","cn":"我爷爷有点健忘，总忘记眼镜放哪儿。"},{"en":"She was forgetful and left her umbrella on the bus.","cn":"她太健忘了，把雨伞落在了公交车上。"}],"socratic_questions":[{"question":"你朋友经常找不到自己的笔和橡皮，甚至忘记带作业本。你会怎么形容他？","answer_hint":"这个词描述一个人容易忘记事情，常与丢三落四有关。"}],"fill_blank":{"sentences":["He is so ___ that he often leaves his phone at home."],"options":["forgetful","budget","passport","faraway"],"correct_index":0}},{"word":"faraway","ipa":"/ˌfɑːrəˈweɪ/","image_prompts":["A distant mountain range with snow-capped peaks under a starry night sky, no buildings visible","A lighthouse on a small island far from the shore, with waves and a cloudy horizon"],"image_desc_en":"Snowy mountain peaks under a starry sky, distant and isolated","image_desc_cn":"星空下白雪覆盖的山峰，遥远而孤立","meaning_cn":"遥远的；远方的","usage":"adj. (通常放在名词前)","collocations":"faraway place, faraway land, faraway look","preposition_combos":"无常见介词搭配","examples":[{"en":"She dreams of visiting a faraway island one day.","cn":"她梦想有一天能去一个遥远的岛屿。"},{"cn":"那封信来自一个遥远的国家。","en":"The letter came from a faraway country."}],"socratic_questions":[{"question":"你在地图上看到一个名字很陌生的国家，离你家非常远，需要坐十几个小时飞机才能到。你会怎么形容那个地方？","answer_hint":"这个词强调空间距离很远，常用于描述旅行或梦想中的目的地。"}],"fill_blank":{"sentences":["The postcard was sent from a ___ village in the mountains."],"options":["faraway","forgetful","budget","passport"],"correct_index":0}},{"word":"regular","ipa":"/ˈreɡjələr/","image_prompts":["A weekly pill organizer with seven compartments, each filled with different colored pills, arranged in a row on a white table","A row of identical green plants in terracotta pots spaced evenly on a wooden shelf, soft sunlight from a window"],"image_desc_en":"A weekly pill organizer with seven compartments, each filled with different colored pills, arranged in a row on a white table.","image_desc_cn":"一个每周药盒，有七个隔间，每个隔间里放着不同颜色的药片，整齐地排成一排放在白色桌子上。","meaning_cn":"adj. 有规律的；定期的；常规的","usage":"adj. (副词 regularly)","collocations":"regular exercise, regular check-up, regular customer","preposition_combos":"regular in (doing sth.)","examples":[{"en":"I do regular exercise every morning before school starts.","cn":"我每天早晨上学前做有规律的锻炼。"},{"en":"The bus arrives at regular intervals of fifteen minutes.","cn":"公交车每十五分钟一班，有规律地到达。"}],"socratic_questions":[{"question":"小明每周一、三、五都去跑步，从不间断。这种运动习惯可以用哪个形容词描述？","answer_hint":"这个词强调按固定时间或频率重复发生，比如‘定期的’或‘有规律的’。"}],"fill_blank":{"sentences":["To stay healthy, it is important to have ___ meals and sleep schedules."],"options":["regular","special","sudden","different"],"correct_index":0}},{"word":"countryside","ipa":"/ˈkʌntrisaɪd/","image_prompts":["A winding dirt road stretching across green rolling hills under a clear blue sky, with a small wooden fence on one side","A golden wheat field with a red barn in the distance, fluffy white clouds above, no buildings visible"],"image_desc_en":"A winding dirt road stretching across green rolling hills under a clear blue sky, with a small wooden fence on one side.","image_desc_cn":"一条蜿蜒的土路穿过绿色起伏的山丘，天空湛蓝，路边有一道小木栅栏。","meaning_cn":"n. 乡村；农村地区","usage":"n. (不可数名词，常与 the 连用)","collocations":"in the countryside, go to the countryside, beautiful countryside","preposition_combos":"in the countryside","examples":[{"en":"My family often drives to the countryside on weekends for fresh air.","cn":"我家经常周末开车去乡村呼吸新鲜空气。"},{"en":"The countryside is much quieter than the noisy city center.","cn":"乡村比嘈杂的市中心安静得多。"}],"socratic_questions":[{"question":"暑假你想去一个有很多田野、树木和新鲜空气的地方，而不是高楼大厦的城市。这个地方叫什么？","answer_hint":"这个词指城市以外的区域，有农田、自然风景，没有很多建筑。"}],"fill_blank":{"sentences":["Last summer, we spent a week in the ___ and enjoyed the peaceful environment."],"options":["countryside","city","library","museum"],"correct_index":0}},{"word":"turn around","ipa":"/tɜːrn əˈraʊnd/","image_prompts":["A compass needle rotating 180 degrees on a wooden table, with the north and south labels clearly visible","A bicycle lying on its side with its front wheel turned 180 degrees opposite to the back wheel, on a concrete driveway"],"image_desc_en":"A compass needle rotating 180 degrees on a wooden table, with the north and south labels clearly visible.","image_desc_cn":"一个指南针指针在木桌上旋转180度，南北标记清晰可见。","meaning_cn":"v. 转身；转向；调头","usage":"v. (过去式 turned around, 过去分词 turned around)","collocations":"turn around quickly, turn around and look, make a turn around","preposition_combos":"turn around (无介词，直接跟副词)","examples":[{"en":"The car had to turn around because the road was blocked.","cn":"那辆车不得不调头，因为路被堵住了。"},{"en":"Please turn around and face the blackboard during the lesson.","cn":"上课时请转身面对黑板。"}],"socratic_questions":[{"question":"你走在路上发现走错了方向，需要改变方向往回走。这个动作可以用哪个短语动词表达？","answer_hint":"这个短语由‘转动’和‘朝向相反方向’组成，表示改变方向到对面。"}],"fill_blank":{"sentences":["When she heard her name called, she quickly ___ to see who it was."],"options":["turned around","sat down","stood up","ran away"],"correct_index":0}},{"word":"surprised","ipa":"/sərˈpraɪzd/","image_prompts":["A gift box with a bright red ribbon, the lid slightly lifted, with colorful confetti bursting out against a white background","A cat statue with wide-open painted eyes and an open mouth, sitting on a shelf next to a birthday cake with lit candles"],"image_desc_en":"A gift box with a bright red ribbon, the lid slightly lifted, with colorful confetti bursting out against a white background.","image_desc_cn":"一个系着亮红色丝带的礼物盒，盖子微微掀起，彩色纸屑从里面喷出，背景是白色。","meaning_cn":"adj. 感到惊讶的；吃惊的","usage":"adj. (动词 surprise 的过去分词作形容词；副词 surprisingly)","collocations":"be surprised at, be surprised to do, look surprised","preposition_combos":"surprised at/by","examples":[{"en":"I was very surprised to see my name on the winner list.","cn":"看到我的名字在获奖名单上，我非常惊讶。"},{"en":"She looked surprised when she opened the unexpected gift.","cn":"当她打开那个意想不到的礼物时，她看起来很惊讶。"}],"socratic_questions":[{"question":"考试结果出来，你发现自己得了满分，完全没想到。你当时的心情可以用哪个形容词描述？","answer_hint
