more challenging, 最高级 most challenging","collocations":"challenging task, challenging exam, challenging problem","preposition_combos":"challenging for sb.","examples":[{"en":"The math exam was very challenging for most students.","cn":"这次数学考试对大多数学生来说非常有挑战性。"},{"en":"Climbing this mountain is a challenging but exciting experience.","cn":"攀登这座山是一次有挑战性但令人兴奋的经历。"}],"socratic_questions":[{"question":"你刚拿到一张超难的数学卷子，题目比平时练习难很多，你会怎么形容这张卷子？","answer_hint":"这个词强调任务或事情本身很难，需要付出很多努力，而不是形容人。"}],"fill_blank":{"sentences":["The science project is quite ___ because we have to build a working model."],"options":["challenging","easy","boring","funny"],"correct_index":0},"audio":"Unit7/audio/challenging.mp3","audio_ex0":"Unit7/audio/challenging_ex0.mp3","audio_ex1":"Unit7/audio/challenging_ex1.mp3"},{"word":"pilot","ipa":"/ˈpaɪlət/","image_prompts":["A cockpit dashboard with glowing buttons and a steering wheel, view of clouds through windshield","A model airplane on a runway with a tiny control tower in the background, clear blue sky"],"image_desc_en":"A cockpit dashboard with glowing buttons and a view of clouds through the windshield.","image_desc_cn":"驾驶舱仪表盘上发光的按钮，透过挡风玻璃看到云层。","meaning_cn":"飞行员；驾驶员","usage":"n. (名词) 可数名词，复数 pilots","collocations":"airline pilot, test pilot, pilot program","preposition_combos":"pilot of a plane","examples":[{"en":"The pilot announced that we would land in ten minutes.","cn":"飞行员通知我们十分钟后降落。"},{"en":"My uncle works as a pilot for a big airline company.","cn":"我叔叔在一家大航空公司当飞行员。"}],"socratic_questions":[{"question":"飞机起飞前，广播里有人介绍机组成员，其中负责开飞机的那个人叫什么？","answer_hint":"这个词专指驾驶飞机或飞船的人，不是空乘或地勤。"}],"fill_blank":{"sentences":["The ___ safely landed the plane during the storm."],"options":["pilot","driver","teacher","doctor"],"correct_index":0},"audio":"Unit7/audio/pilot.mp3","audio_ex0":"Unit7/audio/pilot_ex0.mp3","audio_ex1":"Unit7/audio/pilot_ex1.mp3"},{"word":"expert","ipa":"/ˈekspɜːrt/","image_prompts":["A chessboard with a checkmate position, a gold trophy beside it on a velvet cloth","A microscope focused on a leaf sample, with a stack of scientific papers nearby"],"image_desc_en":"A chessboard with a checkmate position and a gold trophy beside it on velvet.","image_desc_cn":"一个将死局面的棋盘，旁边天鹅绒布上放着一座金色奖杯。","meaning_cn":"专家；行家","usage":"n. (名词) 可数名词，复数 experts; adj. (形容词) 熟练的，内行的","collocations":"expert advice, expert in, expert knowledge","preposition_combos":"expert at/in/on (doing) sth.","examples":[{"en":"She is an expert at solving difficult math problems.","cn":"她是解决数学难题的专家。"},{"en":"We asked a computer expert to fix our broken laptop.","cn":"我们请了一位电脑专家来修理坏掉的笔记本电脑。"}],"socratic_questions":[{"question":"你的电脑坏了，你找了一个非常懂电脑、修过很多台电脑的人来帮忙，这个人可以称为什么？","answer_hint":"这个词指在某个领域有丰富知识和技能的人，不是普通爱好者。"}],"fill_blank":{"sentences":["My grandfather is an ___ in traditional Chinese painting."],"options":["expert","artist","student","beginner"],"correct_index":0},"audio":"Unit7/audio/expert.mp3","audio_ex0":"Unit7/audio/expert_ex0.mp3","audio_ex1":"Unit7/audio/expert_ex1.mp3"},{"word":"replace","ipa":"/rɪˈpleɪs/","image_prompts":["A new light bulb being screwed into a lamp socket, the old broken bulb lying on the table","A fresh set of batteries next to an open remote control with old batteries removed"],"image_desc_en":"A new light bulb being screwed into a lamp socket, with the old broken bulb on the table.","image_desc_cn":"一个新灯泡正在拧入灯座，旧灯泡碎在桌子上。","meaning_cn":"代替；取代；更换","usage":"v. (动词) 过去式 replaced, 过去分词 replaced, 现在分词 replacing","collocations":"replace A with B, replace something, replace someone","preposition_combos":"replace sth. with sth.","examples":[{"en":"We need to replace the old printer with a new one.","cn":"我们需要用一台新打印机替换旧的。"},{"en":"Can you replace the empty water bottle in the fridge?","cn":"你能把空水瓶放回冰箱里吗？"}],"socratic_questions":[{"question":"你的自行车轮胎破了，你买了一个新轮胎装上去，把旧的扔掉，这个动作叫什么？","answer_hint":"这个词表示用新的东西换掉旧的或坏的东西，强调一物换一物。"}],"fill_blank":{"sentences":["Please ___ the empty juice carton with a full one from the store."],"options":["replace","remove","repair","return"],"correct_index":0},"audio":"Unit7/audio/replace.mp3","audio_ex0":"Unit7/audio/replace_ex0.mp3","audio_ex1":"Unit7/audio/replace_ex1.mp3"},{"word":"creativity","ipa":"/ˌkriːeɪˈtɪvəti/","image_prompts":["A blank white canvas with colorful paint splashes and a single paintbrush lying beside it, bright studio lighting","A pile of Lego bricks arranged into an unusual abstract shape on a wooden table, soft natural light"],"image_desc_en":"A blank canvas with colorful paint splashes and a brush; Lego bricks in an abstract shape.","image_desc_cn":"一张空白画布上洒满彩色颜料，旁边放着一支画笔；乐高积木搭成抽象形状。","meaning_cn":"创造力；创造性","usage":"n. (不可数名词)","collocations":"show creativity, use creativity, encourage creativity","preposition_combos":"creativity in (doing) sth.","examples":[{"en":"She showed great creativity in her science project design.","cn":"她在科学项目设计中展现了极大的创造力。"},{"en":"Using old boxes for art can boost your creativity.","cn":"用旧盒子做艺术可以提升你的创造力。"}],"socratic_questions":[{"question":"小明用废纸和塑料瓶做了一个小台灯，老师夸他很有想象力。这里形容他做新东西的能力，应该用什么词？","answer_hint":"这个词指创造新事物或新想法的能力，和‘创造’有关。"}],"fill_blank":{"sentences":["Art class helps students develop their ___."],"options":["creativity","strength","memory","speed"],"correct_index":0},"audio":"Unit7/audio/creativity.mp3","audio_ex0":"Unit7/audio/creativity_ex0.mp3","audio_ex1":"Unit7/audio/creativity_ex1.mp3"},{"word":"emotional","ipa":"/ɪˈmoʊʃənl/","image_prompts":["A crumpled tissue paper next to a half-empty coffee cup on a rainy window sill, grey sky outside","A heart-shaped red balloon floating alone against a plain white wall, soft shadow on the floor"],"image_desc_en":"A crumpled tissue and coffee cup by a rainy window; a red heart-shaped balloon against a white wall.","image_desc_cn":"雨窗边揉皱的纸巾和半杯咖啡；白墙前飘着的红色心形气球。","meaning_cn":"情感的；情绪化的","usage":"adj. (副词形式: emotionally)","collocations":"emotional support, emotional problem, emotional moment","preposition_combos":"emotional about sth.","examples":[{"en":"The movie had a very emotional ending that made everyone cry.","cn":"这部电影有一个非常感人的结局，让每个人都哭了。"},{"en":"She felt emotional when she saw her old school again.","cn":"当她再次看到母校时，她感到情绪激动。"}],"socratic_questions":[{"question":"小丽在毕业典礼上看到同学表演时忍不住流泪了，这种和心情、感受有关的形容词是什么？","answer_hint":"这个词描述和内心感受、情绪有关的状态，常用来形容让人感动或难过的时刻。"}],"fill_blank":{"sentences":["Losing a game can be an ___ experience for some players."],"options":["emotional","physical","musical","historical"],"correct_index":0},"audio":"Unit7/audio/emotional.mp3","audio_ex0":"Unit7/audio/emotional_ex0.mp3","audio_ex1":"Unit7/audio/emotional_ex1.mp3"},{"word":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","image_prompts":["A chessboard with pieces arranged in a complex mid-game position, focused lighting on the board","A stack of books with a glowing light bulb on top, dark background"],"image_desc_en":"A chessboard with complex piece arrangement; a stack of books with a glowing light bulb on top.","image_desc_cn":"一个棋子布局复杂的棋盘；一摞书上放着一只发光的灯泡。","meaning_cn":"智力；智慧；情报","usage":"n. (不可数名词)","collocations":"high intelligence, artificial intelligence, use intelligence","preposition_combos":"intelligence in (doing) sth.","examples":[{"en":"Solving this puzzle requires a lot of intelligence and patience.","cn":"解开这个谜题需要很多智力和耐心。"},{"en":"Dogs show great intelligence when learning new tricks.","cn":"狗在学习新把戏时表现出很高的智力。"}],"socratic_questions":[{"question":"小华数学总是考满分，还能快速解开复杂的逻辑题。形容他学习和理解能力很强的名词是什么？","answer_hint":"这个词指学习和解决问题的能力，和‘聪明’、‘智慧’有关。"}],"fill_blank":{"sentences":["Many scientists study animal ___ to understand how they think."],"options":["intelligence","beauty","speed","height"],"correct_index":0},"audio":"Unit7/audio/intelligence.mp3","audio_ex0":"Unit7/audio/intelligence_ex0.mp3","audio_ex1":"Unit7/audio/intelligence_ex1.mp3"},{"word":"emotional intelligence","ipa":"/ɪˈmoʊʃənl ɪnˈtelɪdʒəns/","image_prompts":["Two speech bubbles with a heart and a brain symbol inside each, connected by a dotted line, clean white background","A calm lake reflecting a clear blue sky, with a single leaf floating on the surface, no ripples"],"image_desc_en":"Two speech bubbles with heart and brain symbols connected by a dotted line; a calm lake reflecting sky with a floating leaf.","image_desc_cn":"两个对话气泡里各有心和大脑符号，用虚线相连；平静的湖面倒映蓝天，一片叶子漂浮其上。","meaning_cn":"情商；情绪智力","usage":"n. (不可数名词，常缩写为 EQ)","collocations":"high emotional intelligence, develop emotional intelligence, show emotional intelligence","preposition_combos":"emotional intelligence in (doing) sth.","examples":[{"en":"A good leader needs high emotional intelligence to understand others.","cn":"一个好的领导者需要高情商来理解他人。"},{"en":"She showed great emotional intelligence by calming her friend down.","cn":"她通过安抚朋友展现了很高的情商。"}],"socratic_questions":[{"question":"小刚在朋友吵架时能理解双方感受，并帮他们和好。这种既懂自己情绪又懂别人情绪的能力叫什么？","answer_hint":"这个词由‘情绪’和‘智力’组成，指理解和处理自己及他人情绪的能力。"}],"fill_blank":{"sentences":["People with high ___ can manage their feelings well in difficult situations."],"options":["emotional intelligence","physical strength","musical talent","sports skill"],"correct_index":0},"audio":"Unit7/audio/emotional_intelligence.mp3","audio_ex0":"Unit7/audio/emotional_intelligence_ex0.mp3","audio_ex1":"Unit7/audio/emotional_intelligence_ex1.mp3"},{"word":"mention","ipa":"/ˈmenʃn/","image_prompts":["A speech bubble with the word 'mention' written inside, floating above an open notebook on a wooden desk","A dictionary page open to the word 'mention', highlighted with a yellow marker, soft natural lighting"],"image_desc_en":"A speech bubble with the word 'mention' inside above an open notebook on a wooden desk.","image_desc_cn":"一个写着 'mention' 的对话气泡漂浮在木桌上打开的笔记本上方。","meaning_cn":"提及，说起","usage":"v. (过去式 mentioned, 过去分词 mentioned)","collocations":"mention something to somebody; don't mention it; not to mention","preposition_combos":"mention to; mention in","examples":[{"en":"Did you mention the school trip to your parents?","cn":"你向父母提起学校旅行的事了吗？"},{"en":"She mentioned the exam date in her email.","cn":"她在邮件里提到了考试日期。"}],"socratic_questions":[{"question":"你想告诉朋友明天有社团活动，但不确定他是否已经知道，你会用什么词来轻轻提起这件事？","answer_hint":"这个词表示简单提起或说到某事，不是详细讨论。"}],"fill_blank":{"sentences":["Please ___ the homework deadline in your report."],"options":["mention","forget","hide","ignore"],"correct_index":0},"audio":"Unit7/audio/mention.mp3","audio_ex0":"Unit7/audio/mention_ex0.mp3","audio_ex1":"Unit7/audio/mention_ex1.mp3"},{"word":"refrigerator","ipa":"/rɪˈfrɪdʒəreɪtər/","image_prompts":["A white refrigerator standing in a clean kitchen, door slightly open showing shelves with vegetables and milk cartons","A refrigerator interior with colorful fruit containers and a bottle of water on a glass shelf, bright LED light"],"image_desc_en":"A white refrigerator in a clean kitchen with door slightly open showing vegetables and milk.","image_desc_cn":"一个白色冰箱立在干净厨房里，门微开，露出蔬菜和牛奶。","meaning_cn":"冰箱","usage":"n. (可数名词)","collocations":"in the refrigerator; refrigerator door; refrigerator shelf","preposition_combos":"in the refrigerator; on the refrigerator","examples":[{"en":"Put the leftover pizza in the refrigerator after dinner.","cn":"晚饭后把剩下的披萨放进冰箱。"},{"en":"The refrigerator keeps our food fresh for a long time.","cn":"冰箱能让食物长时间保持新鲜。"}],"socratic_questions":[{"question":"夏天你买了冰淇淋，回家后要放在哪里才不会融化？","answer_hint":"这是一个家用电器，用来冷藏食物和饮料。"}],"fill_blank":{"sentences":["We store milk and eggs in the ___."],"options":["refrigerator","cupboard","microwave","sink"],"correct_index":0},"audio":"Unit7/audio/refrigerator.mp3","audio_ex0":"Unit7/audio/refrigerator_ex0.mp3","audio_ex1":"Unit7/audio/refrigerator_ex1.mp3"},{"word":"low","ipa":"/loʊ/","image_prompts":["A thermometer showing a low temperature near freezing point, frost on the glass outside a window","A stack of three books with the top book titled 'Low Energy', dim lighting in a quiet library corner"],"image_desc_en":"A thermometer showing low temperature near freezing with frost on the window glass.","image_desc_cn":"一个温度计显示接近冰点的低温，窗外玻璃上有霜。","meaning_cn":"低的，矮的；低落的","usage":"adj. (比较级 lower, 最高级 lowest); adv. (比较级 lower, 最高级 lowest)","collocations":"low price; low voice; low energy; low score","preposition_combos":"low in; low on","examples":[{"en":"The price of this jacket is very low this week.","cn":"这件夹克这周价格很低。"},{"en":"He spoke in a low voice during the movie.","cn":"他在电影院里低声说话。"}],"socratic_questions":[{"question":"考试后你发现分数比上次少了很多，心情不太好，可以用哪个词形容分数和心情？","answer_hint":"这个词既可以形容数量少、位置矮，也可以形容情绪不高。"}],"fill_blank":{"sentences":["The battery level is ___; please charge your phone."],"options":["low","high","full","empty"],"correct_index":0},"audio":"Unit7/audio/low.mp3","audio_ex0":"Unit7/audio/low_ex0.mp3","audio_ex1":"Unit7/audio/low_ex1.mp3"},{"word":"run low","ipa":"/rʌn loʊ/","image_prompts":["A nearly empty bottle of water with only a few drops left at the bottom, on a wooden table","A fuel gauge on a car dashboard showing the needle near the red 'E' mark, dim dashboard light"],"image_desc_en":"A nearly empty water bottle with a few drops left at the bottom on a wooden table.","image_desc_cn":"一个几乎空了的矿泉水瓶，底部只剩几滴水，放在木桌上。","meaning_cn":"（供应）变得不足，快用完了","usage":"v.短语 (过去式 ran low, 过去分词 run low)","collocations":"run low on something; supplies run low; time runs low","preposition_combos":"run low on","examples":[{"en":"We are running low on milk, so please buy some.","cn":"我们的牛奶快喝完了，请买一些。"},{"en":"Time is running low before the final exam.","cn":"期末考试前时间不多了。"}],"socratic_questions":[{"question":"你发现冰箱里的鸡蛋只剩两个了，妈妈让你提醒她，你会怎么描述鸡蛋的数量？","answer_hint":"这个短语表示某样东西的数量正在减少，快要没有了。"}],"fill_blank":{"sentences":["Our printer ink is ___; we need to order more."],"options":["running low","running out","running high","running fast"],"correct_index":0},"audio":"Unit7/audio/run_low.mp3","audio_ex0":"Unit7/audio/run_low_ex0.mp3","audio_ex1":"Unit7/audio/run_low_ex1.mp3"},{"word":"accept","ipa":"/əkˈsept/","image_prompts":["A wrapped gift box with a red ribbon on a wooden table, lid slightly open","A hand stamp with the word 'APPROVED' on a white paper document"],"image_desc_en":"A gift box with ribbon and an approved stamp on paper","image_desc_cn":"一个系着丝带的礼物盒和一张盖有‘批准’印章的纸","meaning_cn":"接受；承认","usage":"v. (过去式 accepted, 过去分词 accepted)","collocations":"accept an invitation, accept the truth, accept a challenge","preposition_combos":"accept from, accept as","examples":[{"en":"I will accept your invitation to the birthday party.","cn":"我会接受你的生日派对邀请。"},{"en":"She finally accepted the truth about the broken vase.","cn":"她终于接受了花瓶破碎的事实。"}],"socratic_questions":[{"question":"朋友递给你一张生日派对邀请卡，你开心地拿过来并说‘好’。这个动作叫什么？","answer_hint":"表示‘拿过来并同意’的动作，不是‘拒绝’或‘怀疑’。"}],"fill_blank":{"sentences":["Please ___ this small gift from our class."],"options":["accept","refuse","forget","break"],"correct_index":0},"audio":"Unit7/audio/accept.mp3","audio_ex0":"Unit7/audio/accept_ex0.mp3","audio_ex1":"Unit7/audio/accept_ex1.mp3"},{"word":"influence","ipa":"/ˈɪnfluəns/","image_prompts":["A large magnet attracting small metal paperclips on a white desk","A tree with one side heavily bent by wind, branches all pointing right"],"image_desc_en":"A magnet pulling paperclips and a wind-bent tree","image_desc_cn":"一块磁铁吸引回形针和一棵被风吹弯的树","meaning_cn":"影响；作用","usage":"n. / v. (过去式 influenced, 过去分词 influenced)","collocations":"have an influence on, influence someone's decision, positive influence","preposition_combos":"influence on, influence over","examples":[{"en":"Good friends can have a positive influence on your life.","cn":"好朋友能对你的生活产生积极影响。"},{"en":"The weather greatly influenced our plan for the picnic.","cn":"天气极大地影响了我们的野餐计划。"}],"socratic_questions":[{"question":"你看到天气预报说周末要下雨，于是把户外活动改成了室内游戏。是什么改变了你的决定？","answer_hint":"不是‘控制’或‘命令’，而是像天气一样‘改变想法’的力量。"}],"fill_blank":{"sentences":["Her words had a strong ___ on my final choice."],"options":["influence","temperature","distance","color"],"correct_index":0},"audio":"Unit7/audio/influence.mp3","audio_ex0":"Unit7/audio/influence_ex0.mp3","audio_ex1":"Unit7/audio/influence_ex1.mp3"},{"word":"creative","ipa":"/kriˈeɪtɪv/","image_prompts":["A blank canvas with colorful paint splashes and a palette beside it","A Lego castle built with unusual colored bricks on a blue mat"],"image_desc_en":"A canvas with paint splashes and a Lego castle with colorful bricks","image_desc_cn":"一块溅满颜料的画布和一座用彩色乐高搭成的城堡","meaning_cn":"有创造力的；创新的","usage":"adj. (副词 creatively)","collocations":"creative idea, creative writing, creative solution","preposition_combos":"creative in, creative with","examples":[{"en":"She came up with a creative way to decorate the classroom.","cn":"她想出了一个有创意的方法来装饰教室。"},{"en":"Being creative helps you solve problems in new ways.","cn":"有创造力能帮你用新方法解决问题。"}],"socratic_questions":[{"question":"美术课上，你用废纸盒做了一辆小汽车模型，老师夸你‘很有想象力’。这个特点是什么？","answer_hint":"不是‘聪明’或‘勤奋’，而是‘能想出新颖点子’的能力。"}],"fill_blank":{"sentences":["The students showed a ___ way to reuse old bottles."],"options":["creative","boring","heavy","fast"],"correct_index":0},"audio":"Unit7/audio/creative.mp3","audio_ex0":"Unit7/audio/creative_ex0.mp3","audio_ex1":"Unit7/audio/creative_ex1.mp3"},{"word":"impossible","ipa":"/ɪmˈpɒsəbl/","image_prompts":["A closed door with a huge padlock and a sign saying 'NO ENTRY'","A mountain of stacked books reaching the ceiling with no ladder nearby"],"image_desc_en":"A locked door with a no-entry sign and a tall stack of books with no ladder","image_desc_cn":"一扇锁着的门挂着‘禁止进入’标志，以及一堆高到天花板的书旁没有梯子","meaning_cn":"不可能的；做不到的","usage":"adj. (名词 impossibility)","collocations":"impossible task, almost impossible, find it impossible","preposition_combos":"impossible for, impossible to","examples":[{"en":"It is impossible to finish this huge cake in one hour.","cn":"一小时内吃完这个大蛋糕是不可能的。"},{"en":"Climbing that steep wall without ropes seems impossible.","cn":"没有绳子爬上那面陡峭的墙似乎不可能。"}],"socratic_questions":[{"question":"你面前有一道数学题，所有条件都缺，你试了十次都解不出来。你觉得这件事怎么样？","answer_hint":"不是‘困难’（difficult），而是‘根本没法完成’的意思。"}],"fill_blank":{"sentences":["It is ___ for me to run 10 kilometers in ten minutes."],"options":["impossible","possible","easy","fun"],"correct_index":0},"audio":"Unit7/audio/impossible.mp3","audio_ex0":"Unit7/audio/impossible_ex0.mp3","audio_ex1":"Unit7/audio/impossible_ex1.mp3"},{"word":"quality","ipa":"/ˈkwɒləti/","image_prompts":["A close-up of a hand holding a polished wooden chess piece with smooth grain and no scratches, soft lighting","A stack of crisp, clean white paper sheets with a gold foil seal on top, on a minimalist desk"],"image_desc_en":"A close-up of a polished wooden chess piece with smooth grain, no scratches, soft lighting.","image_desc_cn":"一个抛光木质国际象棋棋子的特写，纹理光滑无划痕，柔光照明。","meaning_cn":"质量；品质；优质的","usage":"n. (可数/不可数) 质量，品质；adj. 优质的","collocations":"high quality, good quality, quality time, quality education","preposition_combos":"quality of (sth.)","examples":[{"en":"The quality of this notebook is very good for writing.","cn":"这本笔记本的质量非常适合书写。"},{"en":"We should spend quality time with our family every week.","cn":"我们每周都应该和家人共度美好时光。"}],"socratic_questions":[{"question":"你买了一支笔，写字很流畅，外壳也没有毛刺，你会怎么形容这支笔的做工？","answer_hint":"这个词强调物品的优良程度，不是价格或颜色。"}],"fill_blank":{"sentences":["The ___ of the air in this room is very poor because of the smoke."],"options":["quality","quantity","quota","quiet"],"correct_index":0},"audio":"Unit7/audio/quality.mp3","audio_ex0":"Unit7/audio/quality_ex0.mp3","audio_ex1":"Unit7/audio/quality_ex1.mp3"},{"word":"develop","ipa":"/dɪˈveləp/","image_prompts":["A series of three potted plants in increasing size, from a small sprout to a leafy bush, on a white shelf","A roll of photographic film being unrolled in a darkroom with red light, showing faint images"],"image_desc_en":"Three potted plants in increasing size from sprout to leafy bush on a white shelf.","image_desc_cn":"三盆盆栽植物从幼苗到茂盛灌木依次增大，放在白色架子上。","meaning_cn":"发展；培养；开发；冲洗（胶卷）","usage":"v. (过去式 developed, 过去分词 developed)","collocations":"develop a habit, develop skills, develop a photo, develop an idea","preposition_combos":"develop into, develop from","examples":[{"en":"You can develop your reading skills by reading every day.","cn":"你可以通过每天阅读来培养阅读技能。"},{"en":"The small town developed into a big city over ten years.","cn":"这个小镇在十年间发展成了一座大城市。"}],"socratic_questions":[{"question":"你每天练习弹吉他，从不会到能弹一首完整的曲子，这个过程叫什么？","answer_hint":"这个词表示从无到有、从小到大的变化过程。"}],"fill_blank":{"sentences":["It takes time to ___ a good study habit."],"options":["develop","destroy","discover","divide"],"correct_index":0},"audio":"Unit7/audio/develop.mp3","audio_ex0":"Unit7/audio/develop_ex0.mp3","audio_ex1":"Unit7/audio/develop_ex1.mp3"},{"word":"German","ipa":"/ˈdʒɜːmən/","image_prompts":["A black, red, and gold flag waving on a flagpole against a clear blue sky","A plate of bratwurst sausages and sauerkraut on a wooden table, with a stein of beer nearby"],"image_desc_en":"A black, red, and gold flag waving on a flagpole against a clear blue sky.","image_desc_cn":"一面黑、红、金三色旗在旗杆上飘扬，背景是清澈的蓝天。","meaning_cn":"德国的；德语；德国人","usage":"adj. 德国的；n. 德语（不可数）；n. 德国人（可数，复数 Germans）","collocations":"German language, German food, German car, German culture","preposition_combos":"in German, from German","examples":[{"en":"My cousin is learning the German language for his trip.","cn":"我的表弟为了旅行正在学习德语。"},{"en":"This car is made by a famous German company.","cn":"这辆车由一家著名的德国公司制造。"}],"socratic_questions":[{"question":"你看到一张照片，上面有啤酒、香肠和一面黑红金三色旗，这代表哪个国家？","answer_hint":"这个词指代一个欧洲国家及其语言、文化。"}],"fill_blank":{"sentences":["She can speak ___ very well because she lived in Berlin for two years."],"options":["German","Germany","Germans","Germanic"],"correct_index":0},"audio":"Unit7/audio/German.mp3","audio_ex0":"Unit7/audio/German_ex0.mp3","audio_ex1":"Unit7/audio/German_ex1.mp3"},{"word":"valuable","ipa":"/ˈvæljuəbl/","image_prompts":["A gold pocket watch with an open lid, resting on a stack of old leather-bound books","A diamond ring placed on a black velvet cloth, with a single beam of light highlighting the gem"],"image_desc_en":"A gold pocket watch with an open lid on a stack of old leather-bound books.","image_desc_cn":"一块打开盖子的金怀表，放在一叠旧皮面书上。","meaning_cn":"有价值的；宝贵的；珍贵的","usage":"adj. 有价值的；n. (pl. valuables) 贵重物品","collocations":"valuable advice, valuable time, valuable experience, valuable lesson","preposition_combos":"valuable to/for (sb./sth.)","examples":[{"en":"The old map is very valuable to the museum.","cn":"这张旧地图对博物馆来说非常珍贵。"},{"en":"My grandmother gave me some valuable advice about friendship.","cn":"我奶奶给了我一些关于友谊的宝贵建议。"}],"socratic_questions":[{"question":"老师给你一条学习建议，你按照它做后成绩提高了，你会怎么形容这条建议？","answer_hint":"这个词表示某物很有用、很珍贵，不一定是金钱上的。"}],"fill_blank":{"sentences":["This painting is extremely ___ and should be kept in a safe place."],"options":["valuable","valueless","volatile","various"],"correct_index":0},"audio":"Unit7/audio/valuable.mp3","audio_ex0":"Unit7/audio/valuable_ex0.mp3","audio_ex1":"Unit7/audio/valuable_ex1.mp3"},{"word":"public","ipa":"/ˈpʌblɪk/","image_prompts":["A large library reading room with rows of bookshelves and empty tables, warm lighting, no people","A city park with a fountain in the center, benches along the path, autumn leaves on the ground, no people"],"image_desc_en":"A quiet public library reading room with bookshelves and tables, or a public park with a fountain and benches.","image_desc_cn":"一个安静的公共图书馆阅览室，有书架和桌子；或一个有喷泉和长椅的公共公园。","meaning_cn":"adj. 公共的，公众的；n. 公众，民众","usage":"adj. (无词形变化); n. (不可数，常与 the 连用)","collocations":"public library, public school, public transport, in public","preposition_combos":"in public (公开地), for the public (为公众)","examples":[{"en":"You should not talk loudly in a public library.","cn":"你不应该在公共图书馆大声说话。"},{"en":"The public park is a good place for a picnic.","cn":"这个公共公园是野餐的好地方。"}],"socratic_questions":[{"question":"小明想去一个所有人都能免费进入、借书的地方，这个地方叫什么？","answer_hint":"这个词表示“公共的”，强调属于所有人的，不是私人的。"}],"fill_blank":{"sentences":["We should keep our voice down in ___ places like hospitals."],"options":["public","private","quiet","noisy"],"correct_index":0},"audio":"Unit7/audio/public.mp3","audio_ex0":"Unit7/audio/public_ex0.mp3","audio_ex1":"Unit7/audio/public_ex1.mp3"},{"word":"medical","ipa":"/ˈmedɪkl/","image_prompts":["A white stethoscope lying on a clean wooden desk next to a small potted plant, soft daylight","A row of medicine bottles with labels on a pharmacy shelf, blurred background"],"image_desc_en":"A stethoscope on a desk or medicine bottles on a pharmacy shelf, representing medical equipment and supplies.","image_desc_cn":"桌子上的听诊器或药架上的药瓶，代表医疗设备和用品。","meaning_cn":"adj. 医学的，医疗的","usage":"adj. (无词形变化)","collocations":"medical care, medical exam, medical history, medical school","preposition_combos":"for medical reasons (因医疗原因), under medical treatment (在接受治疗)","examples":[{"en":"My uncle works as a nurse in a medical center.","cn":"我叔叔在一家医疗中心当护士。"},{"en":"You need a medical check-up before joining the sports team.","cn":"加入运动队之前你需要做一次体检。"}],"socratic_questions":[{"question":"你感冒了，妈妈带你去医院做检查，这个检查跟什么有关？","answer_hint":"这个词和“医生、医院、治疗”相关，意思是“医学的”。"}],"fill_blank":{"sentences":["The doctor gave him a full ___ examination this morning."],"options":["medical","physical","mental","final"],"correct_index":0},"audio":"Unit7/audio/medical.mp3","audio_ex0":"Unit7/audio/medical_ex0.mp3","audio_ex1":"Unit7/audio/medical_ex1.mp3"},{"word":"challenge","ipa":"/ˈtʃælɪndʒ/","image_prompts":["A tall climbing wall with colorful handholds against a blue sky, no climbers visible","A complex jigsaw puzzle with many pieces scattered on a wooden table, one piece being placed"],"image_desc_en":"A climbing wall with handholds or a jigsaw puzzle being assembled, representing a difficult task.","image_desc_cn":"一面有攀岩点的攀岩墙或正在拼装的拼图，代表一项困难的任务。","meaning_cn":"n. 挑战；v. 向……挑战 (过去式 challenged, 过去分词 challenged)","usage":"n. (可数名词); v. (过去式 challenged, 过去分词 challenged)","collocations":"face a challenge, take on a challenge, challenge oneself","preposition_combos":"challenge to (对……的挑战), challenge for (为……而挑战)","examples":[{"en":"Learning a new language is a big challenge for me.","cn":"学习一门新语言对我来说是一个很大的挑战。"},{"en":"He challenged his friend to a chess game after school.","cn":"他放学后向朋友挑战下棋。"}],"socratic_questions":[{"question":"数学考试最后一道题非常难，很多同学都做不出来，这道题对大家来说是什么？","answer_hint":"这个词表示“困难但值得尝试的事情”，不是简单的任务。"}],"fill_blank":{"sentences":["Running a marathon is a huge ___ for most people."],"options":["challenge","game","race","party"],"correct_index":0},"audio":"Unit7/audio/challenge.mp3","audio_ex0":"Unit7/audio/challenge_ex0.mp3","audio_ex1":"Unit7/audio/challenge_ex1.mp3"},{"word":"task","ipa":"/tɑːsk/","image_prompts":["A whiteboard with a checklist written in marker, several boxes checked off, in a bright room","A stack of papers with a red pen on top, next to a cup of coffee on a desk"],"image_desc_en":"A whiteboard with a checklist or a stack of papers with a pen, representing a specific job to do.","image_desc_cn":"带有清单的白板或一叠纸和笔，代表一项具体的工作。","meaning_cn":"n. 任务，工作","usage":"n. (可数名词)","collocations":"finish a task, daily task, main task, task list","preposition_combos":"task for (为……的任务), task of (……的任务)","examples":[{"en":"My first task today is to clean my bedroom.","cn":"我今天的第一项任务是打扫我的卧室。"},{"en":"The teacher gave us a writing task for homework.","cn":"老师给我们布置了一项写作任务作为家庭作业。"}],"socratic_questions":[{"question":"老师让你在放学前把教室里的垃圾倒掉，这件事对你来说是什么？","answer_hint":"这个词指“需要完成的具体工作”，比“作业”范围更广。"}],"fill_blank":{"sentences":["Completing this ___ will take about two hours."],"options":["task","trip","test","talk"],"correct_index":0},"audio":"Unit7/audio/task.mp3","audio_ex0":"Unit7/audio/task_ex0.mp3","audio_ex1":"Unit7/audio/task_ex1.mp3"},{"word":"depend","ipa":"/dɪˈpend/","image_prompts":["A sunflower turning its head toward sunlight through a window, bright yellow petals","A small plant leaning on a wooden stick for support in a garden, green leaves"],"image_desc_en":"A sunflower turning toward sunlight; a plant leaning on a stick.","image_desc_cn":"向日葵转向阳光；植物靠在木棍上。","meaning_cn":"依靠；依赖；取决于","usage":"v. (过去式 depended, 过去分词 depended)","collocations":"depend on/upon","preposition_combos":"depend on/upon sb/sth","examples":[{"en":"Your grade will depend on the final exam.","cn":"你的成绩将取决于期末考试。"},{"en":"We depend on the bus to get to school.","cn":"我们靠公交车去上学。"}],"socratic_questions":[{"question":"小明想知道明天的野餐能不能成行，妈妈说要看天气。这时可以用哪个词表示‘看情况而定’？","answer_hint":"这个词表示结果由某个条件决定，比如天气。"}],"fill_blank":{"sentences":["Whether we go hiking tomorrow will ___ on the weather."],"options":["depend","decide","wait","try"],"correct_index":0},"audio":"Unit7/audio/depend.mp3","audio_ex0":"Unit7/audio/depend_ex0.mp3","audio_ex1":"Unit7/audio/depend_ex1.mp3"},{"word":"depend on","ipa":"/dɪˈpend ɒn/","image_prompts":["A pair of crutches leaning against a wall next to a backpack, indoor setting","A calculator sitting on top of a stack of textbooks, desk lamp shining"],"image_desc_en":"Crutches leaning against a wall; a calculator on textbooks under a lamp.","image_desc_cn":"拐杖靠在墙边；计算器放在课本上，台灯亮着。","meaning_cn":"依靠；依赖；取决于","usage":"phrasal verb (过去式 depended on, 过去分词 depended on)","collocations":"depend on sb/sth for sth","preposition_combos":"depend on/upon","examples":[{"en":"You can depend on the map to find the way.","cn":"你可以靠地图找到路。"},{"en":"The picnic depends on the weather this weekend.","cn":"野餐取决于这个周末的天气。"}],"socratic_questions":[{"question":"小红要完成小组作业，但她的电脑坏了，她需要借用同学的电脑。这时可以用哪个短语表示‘依靠’？","answer_hint":"这个短语由两个词组成，表示需要某物或某人的帮助。"}],"fill_blank":{"sentences":["We can ___ ___ the library for research materials."],"options":["depend on","look for","turn off","give up"],"correct_index":0},"audio":"Unit7/audio/depend_on.mp3","audio_ex0":"Unit7/audio/depend_on_ex0.mp3","audio_ex1":"Unit7/audio/depend_on_ex1.mp3"},{"word":"come over","ipa":"/kʌm ˈəʊvə/","image_prompts":["A bicycle parked outside a front door with a welcome mat, sunny afternoon","A stack of board games on a coffee table next to two empty cups"],"image_desc_en":"A bicycle by a front door with a welcome mat; board games on a coffee table.","image_desc_cn":"自行车停在前门外，门口有迎宾垫；咖啡桌上放着桌游和两个空杯子。","meaning_cn":"过来；来访","usage":"phrasal verb (过去式 came over, 过去分词 come over)","collocations":"come over to + place","preposition_combos":"come over to","examples":[{"en":"My friend will come over after school today.","cn":"我的朋友今天放学后会过来。"},{"en":"Please come over to my house this Saturday.","cn":"请这个周六来我家玩。"}],"socratic_questions":[{"question":"小华邀请同学周末来家里一起复习功课，同学答应了。这时可以用哪个短语表示‘到某人家来’？","answer_hint":"这个短语由两个词组成，表示从别处移动到说话人所在的地方。"}],"fill_blank":{"sentences":["Can you ___ ___ to my place and help me with math?"],"options":["come over","go out","run away","sit down"],"correct_index":0},"audio":"Unit7/audio/come_over.mp3","audio_ex0":"Unit7/audio/come_over_ex0.mp3","audio_ex1":"Unit7/audio/come_over_ex1.mp3"},{"word":"as long as","ipa":"/æz lɒŋ æz/","image_prompts":["A green traffic light glowing against a blue sky, empty crosswalk","A key inserted into a lock with a golden glow around the keyhole"],"image_desc_en":"A green traffic light on a clear day; a key in a lock with a golden glow.","image_desc_cn":"晴朗天空下的绿灯；钥匙插入锁孔，周围有金色光芒。","meaning_cn":"只要（表示条件）","usage":"conj. (连词，引导条件状语从句)","collocations":"as long as + 从句","preposition_combos":"","examples":[{"en":"You can borrow my book as long as you return it.","cn":"只要你还回来，你就可以借我的书。"},{"en":"We will win the game as long as we work together.","cn":"只要我们合作，我们就会赢比赛。"}],"socratic_questions":[{"question":"妈妈对小明说：‘只要你做完作业，就可以看电视。’这里表示条件的短语是什么？","answer_hint":"这个短语由三个词组成，意思是‘在……条件下’。"}],"fill_blank":{"sentences":["You can join the club ___ ___ ___ you follow the rules."],"options":["as long as","as soon as","even though","so that"],"correct_index":0},"audio":"Unit7/audio/as_long_as.mp3","audio_ex0":"Unit7/audio/as_long_as_ex0.mp3","audio_ex1":"Unit7/audio/as_long_as_ex1.mp3"}]},{"unit":8,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"communication","ipa":"/kəˌmjuːnɪˈkeɪʃən/","image_prompts":["Two walkie-talkies on a wooden table with antennas extended, red light blinking on one device","A smartphone screen showing a group chat interface with multiple colorful message bubbles and emojis"],"image_desc_en":"Two walkie-talkies on a wooden table with antennas extended, red light blinking on one device","image_desc_cn":"两个对讲机放在木桌上，天线伸出，其中一个红灯闪烁","meaning_cn":"交流；沟通；通讯","usage":"n. (不可数名词)","collocations":"good communication, communication skills, means of communication","preposition_combos":"communication with, communication between","examples":[{"en":"Good communication with parents helps solve many family problems.","cn":"与父母良好的沟通有助于解决许多家庭问题。"},{"en":"Email is a fast means of communication in modern life.","cn":"电子邮件是现代生活中一种快速的通讯方式。"}],"socratic_questions":[{"question":"你和朋友因为误会吵架了，你觉得缺少什么才导致这个问题？这个词不是‘对话’也不是‘争吵’。","answer_hint":"这个词强调信息传递和理解的过程，不是具体的对话动作。"}],"fill_blank":{"sentences":["Effective ___ is important for team projects at school."],"options":["communication","competition","celebration","conversation"],"correct_index":0},"audio":"Unit8/audio/communication.mp3","audio_ex0":"Unit8/audio/communication_ex0.mp3","audio_ex1":"Unit8/audio/communication_ex1.mp3"},{"word":"face to face","ipa":"/feɪs tə feɪs/","image_prompts":["Two empty chairs facing each other in a bright living room with a coffee table between them","A pair of eyeglasses placed on a desk, directly opposite a small potted plant on the other side"],"image_desc_en":"Two empty chairs facing each other in a bright living room with a coffee table between them","image_desc_cn":"两把空椅子面对面放在明亮的客厅里，中间有一张咖啡桌","meaning_cn":"面对面地","usage":"adv. / adj. (常作状语或定语)","collocations":"talk face to face, meet face to face, face-to-face communication","preposition_combos":"无固定介词搭配","examples":[{"en":"We decided to talk face to face instead of texting.","cn":"我们决定面对面交谈而不是发短信。"},{"en":"A face-to-face meeting is better than a phone call.","cn":"面对面会议比打电话更好。"}],"socratic_questions":[{"question":"你和朋友在网上吵架了，你觉得哪种方式最能消除误会？不是打电话也不是发消息。","answer_hint":"这个词描述两个人直接见面、没有中间媒介的交流方式。"}],"fill_blank":{"sentences":["Sometimes it's better to discuss problems ___."],"options":["face to face","side by side","back to back","hand in hand"],"correct_index":0},"audio":"Unit8/audio/face_to_face.mp3","audio_ex0":"Unit8/audio/face_to_face_ex0.mp3","audio_ex1":"Unit8/audio/face_to_face_ex1.mp3"},{"word":"text message","ipa":"/tekst ˈmesɪdʒ/","image_prompts":["A smartphone lying on a desk, screen showing a blue message bubble with the words 'See you at 5'","A white envelope with a small phone icon printed on it, next to a keyboard"],"image_desc_en":"A smartphone lying on a desk, screen showing a blue message bubble with the words 'See you at 5'","image_desc_cn":"一部智能手机放在桌上，屏幕显示蓝色消息气泡，写着‘5点见’","meaning_cn":"短信；文字消息","usage":"n. (可数名词，复数 text messages)","collocations":"send a text message, receive a text message, reply to a text message","preposition_combos":"text message from, text message to","examples":[{"en":"I sent a text message to remind my friend about the test.","cn":"我发了一条短信提醒朋友考试的事。"},{"en":"She received a text message with the homework assignment.","cn":"她收到了一条带有作业内容的短信。"}],"socratic_questions":[{"question":"你放学后想告诉妈妈晚点回家，但不想打电话，你会用什么方式？这个词不是‘邮件’也不是‘语音’。","answer_hint":"这个词指手机上用文字发送的短信息，通常不超过几百字。"}],"fill_blank":{"sentences":["He quickly typed a ___ to his classmate about the project."],"options":["text message","phone call","letter","postcard"],"correct_index":0},"audio":"Unit8/audio/text_message.mp3","audio_ex0":"Unit8/audio/text_message_ex0.mp3","audio_ex1":"Unit8/audio/text_message_ex1.mp3"},{"word":"sign","ipa":"/saɪn/","image_prompts":["A red octagonal stop sign at a street corner with white letters 'STOP' and a metal pole","A yellow triangular warning sign with a black exclamation mark on a mountain road"],"image_desc_en":"A red octagonal stop sign at a street corner with white letters 'STOP' and a metal pole","image_desc_cn":"街角一个红色八角形停车标志，白色字母‘STOP’，金属杆支撑","meaning_cn":"标志；指示牌；迹象；手势","usage":"n. (可数名词) / v. (过去式 signed, 过去分词 signed)","collocations":"traffic sign, road sign, sign language, sign a document","preposition_combos":"sign for, sign of","examples":[{"en":"The traffic sign shows that we must turn left here.","cn":"交通标志显示我们必须在这里左转。"},{"en":"Dark clouds are a sign that rain is coming soon.","cn":"乌云是即将下雨的迹象。"}],"socratic_questions":[{"question":"你在马路上看到一个红色的八角形牌子，上面写着‘停’，这是什么？不是‘灯’也不是‘地图’。","answer_hint":"这个词指用来传递信息或指示的牌子、符号或手势。"}],"fill_blank":{"sentences":["The ___ at the park entrance says 'No smoking'."],"options":["sign","signal","symbol","sight"],"correct_index":0},"audio":"Unit8/audio/sign.mp3","audio_ex0":"Unit8/audio/sign_ex0.mp3","audio_ex1":"Unit8/audio/sign_ex1.mp3"},{"word":"speaker","ipa":"/ˈspiːkər/","image_prompts":["A black wireless speaker on a wooden table, sound waves visualized as concentric rings in the air","A podium with a microphone and a glass of water in an empty conference room, spotlight on the podium"],"image_desc_en":"A black wireless speaker on a wooden table with visible sound wave rings around it.","image_desc_cn":"一个黑色无线音箱放在木桌上，周围有可见的声波环。","meaning_cn":"n. 演讲者；扬声器","usage":"n. (复数 speakers)","collocations":"guest speaker, loud speaker, main speaker","preposition_combos":"speaker at (a conference), speaker on (a topic)","examples":[{"en":"The guest speaker talked about saving the environment for an hour.","cn":"特邀演讲者就环境保护讲了一个小时。"},{"en":"Please turn up the speaker so everyone can hear the music.","cn":"请把扬声器音量调大，这样大家都能听到音乐。"}],"socratic_questions":[{"question":"学校举办英语演讲比赛，台上站着一个人正在对着话筒讲话，这个人的身份是什么？","answer_hint":"这个词既可以指发出声音的设备，也可以指在台上讲话的人。"}],"fill_blank":{"sentences":["The ___ gave a wonderful speech about teamwork at the school assembly."],"options":["speaker","singer","teacher","player"],"correct_index":0},"audio":"Unit8/audio/speaker.mp3","audio_ex0":"Unit8/audio/speaker_ex0.mp3","audio_ex1":"Unit8/audio/speaker_ex1.mp3"},{"word":"rehearsal","ipa":"/rɪˈhɜːrsl/","image_prompts":["An empty theater stage with chairs arranged in a semicircle, sheet music scattered on the floor","A whiteboard with a rehearsal schedule written in marker, a clock showing 6:30 PM on the wall"],"image_desc_en":"An empty theater stage with chairs in a semicircle and sheet music on the floor.","image_desc_cn":"一个空荡荡的剧院舞台，椅子摆成半圆形，地上散落着乐谱。","meaning_cn":"n. 排练；彩排","usage":"n. (可数名词，复数 rehearsals)","collocations":"dress rehearsal, rehearsal room, rehearsal schedule","preposition_combos":"rehearsal for (a play), at rehearsal","examples":[{"en":"We have a rehearsal for the school play every Friday afternoon.","cn":"我们每周五下午为校园剧进行排练。"},{"en":"The dress rehearsal went smoothly without any mistakes.","cn":"带妆彩排进行得很顺利，没有任何失误。"}],"socratic_questions":[{"question":"下周就要上台表演了，今天全班同学放学后留在音乐教室反复练习歌曲和动作，这个活动叫什么？","answer_hint":"这个词指的是正式演出前的练习过程，不是正式演出。"}],"fill_blank":{"sentences":["The choir had a long ___ before the concert to make sure everything was perfect."],"options":["rehearsal","meeting","party","class"],"correct_index":0},"audio":"Unit8/audio/rehearsal.mp3","audio_ex0":"Unit8/audio/rehearsal_ex0.mp3","audio_ex1":"Unit8/audio/rehearsal_ex1.mp3"},{"word":"show sb around","ipa":"/ʃoʊ ˈsʌmbədi əˈraʊnd/","image_prompts":["A red arrow sign pointing to a school building entrance, a welcome mat on the ground","An open door with a hallway visible inside, a map of the building pinned on a bulletin board"],"image_desc_en":"A red arrow sign pointing to a school building entrance with a welcome mat.","image_desc_cn":"一个红色箭头标志指向学校建筑入口，门口有欢迎垫。","meaning_cn":"v. 带领某人参观","usage":"v. (短语动词，show 的过去式 showed，过去分词 shown)","collocations":"show a visitor around, show a friend around the campus","preposition_combos":"show someone around + 地点","examples":[{"en":"My friend will show me around the new library after school.","cn":"我的朋友放学后会带我参观新图书馆。"},{"en":"The guide showed the tourists around the old castle yesterday.","cn":"导游昨天带领游客参观了那座古老的城堡。"}],"socratic_questions":[{"question":"新学期来了一个新同学，你作为班长带他走遍教学楼、操场和食堂，让他熟悉校园，这个动作叫什么？","answer_hint":"这个短语包含两个部分，一个是‘展示’，一个是‘各处’，合起来就是带人到处看看。"}],"fill_blank":{"sentences":["Could you please ___ the new student ___ the school?"],"options":["show...around","take...out","bring...in","look...for"],"correct_index":0},"audio":"Unit8/audio/show_sb_around.mp3","audio_ex0":"Unit8/audio/show_sb_around_ex0.mp3","audio_ex1":"Unit8/audio/show_sb_around_ex1.mp3"},{"word":"show interest in sth","ipa":"/ʃoʊ ˈɪntrəst ɪn ˈsʌmθɪŋ/","image_prompts":["A magnifying glass resting on an open science textbook with a diagram of a plant cell","A stack of colorful travel brochures on a table, a globe in the background"],"image_desc_en":"A magnifying glass on an open science textbook showing a plant cell diagram.","image_desc_cn":"一个放大镜放在打开的科普课本上，显示植物细胞图。","meaning_cn":"v. 对某事表现出兴趣","usage":"v. (短语动词，show 的过去式 showed，过去分词 shown；interest 为不可数名词)","collocations":"show great interest in, show little interest in, show no interest in","preposition_combos":"show interest in + 名词/动名词","examples":[{"en":"She showed great interest in learning how to cook Chinese food.","cn":"她对学习做中餐表现出极大的兴趣。"},{"en":"Many students show interest in the school's new robotics club.","cn":"许多学生对学校新成立的机器人社团表现出兴趣。"}],"socratic_questions":[{"question":"你的同桌看到一本关于太空探索的书，立刻凑过去翻看，还问了很多问题，这说明他对太空什么？","answer_hint":"这个短语由‘展示’和‘兴趣’组成，后面用介词‘在……方面’。"}],"fill_blank":{"sentences":["Tom ___ great ___ in painting after visiting the art museum."],"options":["showed...interest in","had...fun with","took...part in","felt...worried about"],"correct_index":0},"audio":"Unit8/audio/show_interest_in_sth.mp3","audio_ex0":"Unit8/audio/show_interest_in_sth_ex0.mp3","audio_ex1":"Unit8/audio/show_interest_in_sth_ex1.mp3"},{"word":"listener","ipa":"/ˈlɪs.ən.ər/","image_prompts":["A pair of wireless earphones resting on a wooden desk next to a steaming coffee mug, soft morning light","A vintage radio with a glowing dial and a small sign that says 'LISTENER' on the front, placed on a shelf"],"image_desc_en":"A pair of earphones on a desk with a coffee mug, or a vintage radio with a 'LISTENER' sign.","image_desc_cn":"一副耳机放在桌上，旁边有咖啡杯；或一台老式收音机，前面有‘听众’标志。","meaning_cn":"听众；倾听者","usage":"n. (可数名词，复数 listeners)","collocations":"good listener, radio listener, careful listener","preposition_combos":"listener to (music/radio)","examples":[{"en":"A good listener always makes friends feel understood and valued.","cn":"一个好的倾听者总能让朋友感到被理解和重视。"},{"en":"The radio show has millions of listeners around the country every night.","cn":"这个广播节目每晚有全国数百万听众。"}],"socratic_questions":[{"question":"当你的朋友向你倾诉烦恼时，你安静地听，不打断，别人会怎么形容你？","answer_hint":"这个词强调‘听’这个动作的执行者，而不是‘说话者’或‘观察者’。"}],"fill_blank":{"sentences":["She is a patient ___ who never interrupts others."],"options":["listener","speaker","writer","reader"],"correct_index":0},"audio":"Unit8/audio/listener.mp3","audio_ex0":"Unit8/audio/listener_ex0.mp3","audio_ex1":"Unit8/audio/listener_ex1.mp3"},{"word":"point","ipa":"/pɔɪnt/","image_prompts":["A sharp red arrow pointing at a specific number on a whiteboard with math equations","A compass needle pointing north on a map spread across a wooden table"],"image_desc_en":"A red arrow pointing at a number on a whiteboard, or a compass needle pointing north on a map.","image_desc_cn":"红色箭头指向白板上的数字；或指南针指针指向地图上的北方。","meaning_cn":"点；要点；指向；表明","usage":"n. / v. (过去式 pointed, 过去分词 pointed)","collocations":"point out, point at, main point, point of view","preposition_combos":"point to, point at, point out","examples":[{"en":"Please point to the correct answer on the blackboard.","cn":"请指向黑板上的正确答案。"},{"en":"The main point of the story is to be honest with friends.","cn":"这个故事的主旨是对朋友要诚实。"}],"socratic_questions":[{"question":"老师让你在图表上找出温度最高的那一天，你需要做什么动作？","answer_hint":"这个动作是用手指或指示物‘指向’某个具体位置，而不是‘画’或‘写’。"}],"fill_blank":{"sentences":["Can you ___ to the capital city on this map?"],"options":["point","draw","write","read"],"correct_index":0},"audio":"Unit8/audio/point.mp3","audio_ex0":"Unit8/audio/point_ex0.mp3","audio_ex1":"Unit8/audio/point_ex1.mp3"},{"word":"surely","ipa":"/ˈʃʊr.li/","image_prompts":["A clear blue sky with a bright sun and a wooden sign that reads 'SURELY' in bold letters","A completed jigsaw puzzle with the last piece being placed, all pieces perfectly fitted"],"image_desc_en":"A bright blue sky with a sun and a 'SURELY' sign, or a completed jigsaw puzzle with the last piece placed.","image_desc_cn":"晴朗蓝天和太阳下写着‘肯定’的木牌；或最后一块拼图完美嵌入的完整拼图。","meaning_cn":"肯定地；无疑地","usage":"adv. (副词，修饰动词或整个句子)","collocations":"surely will, surely know, surely can","preposition_combos":"无固定介词搭配","examples":[{"en":"If you practice every day, you will surely improve your English.","cn":"如果你每天练习，你的英语肯定会提高。"},{"en":"The sun will surely rise again tomorrow morning.","cn":"明天早上太阳肯定会再次升起。"}],"socratic_questions":[{"question":"你非常确定明天会下雨，你会用什么词来表达这种‘毫无疑问’的语气？","answer_hint":"这个词表示‘肯定地’，比‘maybe’或‘probably’语气强得多，表示完全相信。"}],"fill_blank":{"sentences":["With enough hard work, you will ___ succeed in the exam."],"options":["surely","maybe","never","hardly"],"correct_index":0},"audio":"Unit8/audio/surely.mp3","audio_ex0":"Unit8/audio/surely_ex0.mp3","audio_ex1":"Unit8/audio/surely_ex1.mp3"},{"word":"continue","ipa":"/kənˈtɪn.juː/","image_prompts":["A marathon runner's bib number pinned to a running shoe on a track, with a long road stretching ahead","A clock showing 11:59 with a hand moving toward 12:00, symbolizing time moving forward without stopping"],"image_desc_en":"A running shoe with a bib on a track and a long road ahead, or a clock hand moving toward 12:00.","image_desc_cn":"跑鞋上别着号码布，前方是长长的跑道；或时钟指针走向12点，象征时间不停前进。","meaning_cn":"继续；持续","usage":"v. (过去式 continued, 过去分词 continued)","collocations":"continue to do, continue doing, continue with","preposition_combos":"continue with, continue to","examples":[{"en":"After a short break, the class will continue the discussion.","cn":"短暂休息后，课堂将继续讨论。"},{"en":"The rain may continue for the whole weekend.","cn":"雨可能会持续整个周末。"}],"socratic_questions":[{"question":"你正在写作文，下课铃响了，但你还差一段没写完，老师让你‘接着写’，用哪个动词？","answer_hint":"这个词表示‘不停下来，接着做下去’，而不是‘开始’或‘结束’。"}],"fill_blank":{"sentences":["Please ___ reading the text from where you stopped."],"options":["continue","stop","start","finish"],"correct_index":0},"audio":"Unit8/audio/continue.mp3","audio_ex0":"Unit8/audio/continue_ex0.mp3","audio_ex1":"Unit8/audio/continue_ex1.mp3"},{"word":"impolite","ipa":"/ˌɪmpəˈlaɪt/","image_prompts":["A hand with a finger pointing directly at a camera lens, harsh shadows, red background","A plate of food with a fork stabbing aggressively into a piece of meat, crumbs scattered"],"image_desc_en":"A hand pointing rudely at a camera lens with a red warning background.","image_desc_cn":"一只手粗鲁地指向相机镜头，红色警告背景。","meaning_cn":"不礼貌的","usage":"adj. (比较级 more impolite, 最高级 most impolite)","collocations":"impolite behavior, impolite to do sth","preposition_combos":"impolite to (sb)","examples":[{"en":"It is impolite to talk with your mouth full of food.","cn":"嘴里塞满食物说话是不礼貌的。"},{"en":"His impolite words made everyone in the room feel angry.","cn":"他不礼貌的话让房间里每个人都感到生气。"}],"socratic_questions":[{"question":"在餐厅里，有人大声打电话，不顾周围人感受。这种行为可以用什么形容词来描述？","answer_hint":"这个词描述的是缺乏基本礼貌、让人不舒服的行为，与'礼貌'相反。"}],"fill_blank":{"sentences":["It is ___ to interrupt others when they are speaking."],"options":["impolite","polite","important","impossible"],"correct_index":0},"audio":"Unit8/audio/impolite.mp3","audio_ex0":"Unit8/audio/impolite_ex0.mp3","audio_ex1":"Unit8/audio/impolite_ex1.mp3"},{"word":"personal","ipa":"/ˈpɜːrsənl/","image_prompts":["A closed diary with a small padlock on a wooden desk, soft sunlight from a window","A toothbrush and a tube of toothpaste placed neatly on a bathroom sink"],"image_desc_en":"A locked diary on a wooden desk with soft window light.","image_desc_cn":"一本带小锁的日记本放在木桌上，窗外柔光照射。","meaning_cn":"个人的；私人的","usage":"adj. (副词 personally)","collocations":"personal information, personal opinion, personal space","preposition_combos":"personal to (sb)","examples":[{"en":"You should not ask others about their personal information.","cn":"你不应该询问他人的个人信息。"},{"en":"This diary contains my personal thoughts and feelings.","cn":"这本日记包含我个人的想法和感受。"}],"socratic_questions":[{"question":"在网上注册账号时，网站要求填写姓名、地址和电话号码。这些信息属于什么类型？","answer_hint":"这个词指只属于某个人自己、不愿公开的信息或物品。"}],"fill_blank":{"sentences":["Please keep your ___ belongings safe at school."],"options":["personal","public","popular","physical"],"correct_index":0},"audio":"Unit8/audio/personal.mp3","audio_ex0":"Unit8/audio/personal_ex0.mp3","audio_ex1":"Unit8/audio/personal_ex1.mp3"},{"word":"argue with sb","ipa":"/ˈɑːrɡjuː wɪð ˈsʌmbədi/","image_prompts":["Two speech bubbles with angry symbols like lightning bolts between them, red background","A broken pencil lying on a torn piece of paper with crossed-out words"],"image_desc_en":"Two speech bubbles with lightning bolts between them on a red background.","image_desc_cn":"两个对话气泡之间带有闪电符号，红色背景。","meaning_cn":"与某人争论/争吵","usage":"v. (过去式 argued, 过去分词 argued)","collocations":"argue with sb about/over sth","preposition_combos":"argue with (sb) about/over (sth)","examples":[{"en":"My sister and I often argue with each other about small things.","cn":"我和姐姐经常为小事争吵。"},{"en":"It is useless to argue with a person who never listens.","cn":"和一个从不听的人争论是没用的。"}],"socratic_questions":[{"question":"你和朋友因为看什么电影意见不同，声音越来越大，气氛变得紧张。你们在做什么？","answer_hint":"这个短语表示双方因意见不合而发生口角，通常带有情绪。"}],"fill_blank":{"sentences":["Don't ___ your parents about homework every day."],"options":["argue with","agree with","play with","talk with"],"correct_index":0},"audio":"Unit8/audio/argue_with_sb.mp3","audio_ex0":"Unit8/audio/argue_with_sb_ex0.mp3","audio_ex1":"Unit8/audio/argue_with_sb_ex1.mp3"},{"word":"argue with sb","audio":"Unit8/audio/argue_with_sb.mp3"},{"word":"move on","ipa":"/muːv ɒn/","image_prompts":["A calendar page being torn off, revealing a new month with a sunrise behind it, no people","A suitcase with a 'next destination' tag on a train station platform, train departing in background"],"image_desc_en":"A calendar page being torn off, revealing a new month with a sunrise behind it.","image_desc_cn":"一张日历页被撕下，露出新的一月和背后的日出。","meaning_cn":"继续前进；继续做别的事；放下过去","usage":"动词短语 (phrasal verb) (过去式 moved on, 过去分词 moved on)","collocations":"move on to something, move on from something, time to move on","preposition_combos":"move on to, move on from","examples":[{"en":"After the exam, we should move on to the next topic.","cn":"考试之后，我们应该继续下一个话题。"},{"en":"It's hard to move on after losing a game.","cn":"输掉比赛后很难继续前进。"}],"socratic_questions":[{"question":"小明考试没考好，一直闷闷不乐。朋友劝他别再想这次失败，开始准备下一次考试。朋友会用什么短语劝他？","answer_hint":"表示‘放下过去，继续前进’的动词短语，由‘移动’和‘在…上’组成。"}],"fill_blank":{"sentences":["It's time to ___ from the past and focus on the future."],"options":["move on","give up","look back","stay up"],"correct_index":0},"audio":"Unit8/audio/move_on.mp3","audio_ex0":"Unit8/audio/move_on_ex0.mp3","audio_ex1":"Unit8/audio/move_on_ex1.mp3"},{"word":"sincere","ipa":"/sɪnˈsɪər/","image_prompts":["A handwritten thank-you note on cream paper with a red heart stamp, lying on a wooden desk","Two hands clasped together in a handshake, with a soft warm light glowing around them"],"image_desc_en":"A handwritten thank-you note on cream paper with a red heart stamp, lying on a wooden desk.","image_desc_cn":"一张手写的感谢信放在奶油色纸上，带有红色爱心印章，置于木桌上。","meaning_cn":"真诚的；诚挚的","usage":"形容词 adj. (副词 sincerely)","collocations":"sincere apology, sincere thanks, sincere friend, sincere smile","preposition_combos":"sincere about, sincere in","examples":[{"en":"She gave a sincere apology for breaking the vase.","cn":"她为打碎花瓶真诚地道了歉。"},{"en":"A sincere smile can make others feel warm.","cn":"一个真诚的微笑能让别人感到温暖。"}],"socratic_questions":[{"question":"你弄丢了同桌的橡皮，你非常抱歉，想表达自己不是假装的，而是真心觉得对不起。应该用哪个形容词描述你的道歉？","answer_hint":"这个词表示‘发自内心的、不虚假的’，常用来形容道歉、感谢或微笑。"}],"fill_blank":{"sentences":["Please accept my ___ thanks for your help."],"options":["sincere","simple","silent","sudden"],"correct_index":0},"audio":"Unit8/audio/sincere.mp3","audio_ex0":"Unit8/audio/sincere_ex0.mp3","audio_ex1":"Unit8/audio/sincere_ex1.mp3"},{"word":"find out","ipa":"/faɪnd aʊt/","image_prompts":["A magnifying glass on top of an open book with highlighted text, library shelf background","A puzzle piece being placed into a nearly complete jigsaw puzzle on a table"],"image_desc_en":"A magnifying glass on top of an open book with highlighted text, library shelf background.","image_desc_cn":"一个放大镜放在一本打开的书上，文字被高亮，背景是图书馆书架。","meaning_cn":"查明；弄清；发现（真相）","usage":"动词短语 (phrasal verb) (过去式 found out, 过去分词 found out)","collocations":"find out the truth, find out the answer, find out about","preposition_combos":"find out about, find out that","examples":[{"en":"Please find out the train schedule before we leave.","cn":"请在我们出发前查一下火车时刻表。"},{"en":"I need to find out who broke the window.","cn":"我需要查明是谁打破了窗户。"}],"socratic_questions":[{"question":"你的手机不见了，你想通过打电话或问同学来‘弄清楚’手机在哪里。应该用哪个短语？","answer_hint":"这个短语由‘找到’和‘出来’组成，意思是‘通过努力得知某个信息或真相’。"}],"fill_blank":{"sentences":["Can you ___ what time the movie starts?"],"options":["find out","look for","give out","put out"],"correct_index":0},"audio":"Unit8/audio/find_out.mp3","audio_ex0":"Unit8/audio/find_out_ex0.mp3","audio_ex1":"Unit8/audio/find_out_ex1.mp3"},{"word":"pay","ipa":"/peɪ/","image_prompts":["A cash register drawer open with coins and a receipt, a credit card on the counter","A wallet with several banknotes partially pulled out, on a café table next to a coffee cup"],"image_desc_en":"A cash register drawer open with coins and a receipt, a credit card on the counter.","image_desc_cn":"一个打开的收银机抽屉，里面有硬币和收据，柜台上有一张信用卡。","meaning_cn":"支付；付款；付出代价","usage":"动词 v. (过去式 paid, 过去分词 paid)","collocations":"pay for, pay attention, pay a bill, pay back","preposition_combos":"pay for, pay to, pay with","examples":[{"en":"I will pay for the tickets with my pocket money.","cn":"我会用我的零花钱买票。"},{"en":"You must pay attention to the teacher in class.","cn":"你必须在课堂上注意听老师讲课。"}],"socratic_questions":[{"question":"你去商店买了一支笔，需要给收银员钱。这个动作叫什么？","answer_hint":"这个词表示‘用钱交换商品或服务’，后面常接‘for’表示为什么付钱。"}],"fill_blank":{"sentences":["How much did you ___ for that book?"],"options":["pay","cost","spend","take"],"correct_index":0},"audio":"Unit8/audio/pay.mp3","audio_ex0":"Unit8/audio/pay_ex0.mp3","audio_ex1":"Unit8/audio/pay_ex1.mp3"},{"word":"attention","ipa":"/əˈtenʃn/","image_prompts":["A bright red arrow pointing at a single word in the middle of a white page, surrounded by blurred text","A magnifying glass focusing sunlight onto a dry leaf, smoke starting to rise"],"image_desc_en":"A red arrow pointing to a word on a page, with other text blurred; a magnifying glass focusing sunlight on a leaf.","image_desc_cn":"一个红色箭头指向页面上的一个单词，周围文字模糊；一个放大镜将阳光聚焦在树叶上，开始冒烟。","meaning_cn":"n. 注意力；关注","usage":"n. (不可数名词)","collocations":"pay attention to, draw attention, catch one's attention, full attention","preposition_combos":"attention to (sth.)","examples":[{"en":"The teacher asked for our full attention during the exam.","cn":"老师要求我们在考试期间全神贯注。"},{"en":"A loud noise outside caught everyone's attention in class.","cn":"外面的一声巨响吸引了课堂上所有人的注意。"}],"socratic_questions":[{"question":"课堂上大家都在低头看书，突然窗外飞进一只鸟，所有同学都抬头去看。这时，鸟得到了什么？","answer_hint":"大家的目光和心思都集中到了鸟身上，这个词表示‘集中关注’的意思。"}],"fill_blank":{"sentences":["Please pay ___ to the safety instructions before the experiment."],"options":["attention","attentive","attend","attending"],"correct_index":0},"audio":"Unit8/audio/attention.mp3","audio_ex0":"Unit8/audio/attention_ex0.mp3","audio_ex1":"Unit8/audio/attention_ex1.mp3"},{"word":"pay attention","ipa":"/peɪ əˈtenʃn/","image_prompts":["A pair of glasses resting on an open textbook with a yellow highlighter marking a sentence","A traffic light showing red with a sign below reading 'STOP' in bold letters"],"image_desc_en":"Glasses on an open textbook with a highlighted sentence; a red traffic light with a STOP sign.","image_desc_cn":"一副眼镜放在打开的书本上，句子被荧光笔标记；红灯和写着‘STOP’的标牌。","meaning_cn":"v. 注意；留心","usage":"v. (短语动词，后接to)","collocations":"pay attention to details, pay close attention, pay no attention","preposition_combos":"pay attention to (sb./sth.)","examples":[{"en":"You must pay attention to the road signs while driving.","cn":"开车时你必须注意路标。"},{"en":"She always pays attention to the teacher's instructions in class.","cn":"她在课堂上总是注意听老师的指令。"}],"socratic_questions":[{"question":"做化学实验时，老师反复强调要看清量筒上的刻度。老师希望你对刻度做什么？","answer_hint":"这是一个短语，意思是‘把心思放在……上’，和‘看’不同，更强调用心。"}],"fill_blank":{"sentences":["When crossing the street, you should ___ ___ ___ the traffic lights."],"options":["pay attention to","take care of","look for","think about"],"correct_index":0},"audio":"Unit8/audio/pay_attention.mp3","audio_ex0":"Unit8/audio/pay_attention_ex0.mp3","audio_ex1":"Unit8/audio/pay_attention_ex1.mp3"},{"word":"be yourself","ipa":"/biː jɔːrˈself/","image_prompts":["A single sunflower standing tall among a field of identical daisies, all facing the sun","A plain white T-shirt hanging on a wooden hanger, with a handwritten tag that says 'original'"],"image_desc_en":"A sunflower standing out among daisies; a plain white T-shirt with an 'original' tag.","image_desc_cn":"一朵向日葵在雏菊中挺立；一件纯白T恤挂着写有‘original’的标签。","meaning_cn":"v. 做自己；保持本色","usage":"v. (短语动词，常用祈使句或情态动词后)","collocations":"just be yourself, learn to be yourself, try to be yourself","preposition_combos":"无固定介词搭配","examples":[{"en":"Don't copy others; just be yourself in the talent show.","cn":"不要模仿别人，在才艺展示中做你自己就好。"},{"en":"My best advice for a new school is to be yourself.","cn":"我给新学校的最好建议就是做你自己。"}],"socratic_questions":[{"question":"朋友要去参加面试，很紧张，想模仿别人的说话方式。你会建议他怎么做？","answer_hint":"这个短语鼓励人展现真实的自己，而不是假装成别人。"}],"fill_blank":{"sentences":["Don't worry about what others think; just ___ ___ in the speech competition."],"options":["be yourself","be careful","be quiet","be late"],"correct_index":0},"audio":"Unit8/audio/be_yourself.mp3","audio_ex0":"Unit8/audio/be_yourself_ex0.mp3","audio_ex1":"Unit8/audio/be_yourself_ex1.mp3"},{"word":"offer","ipa":"/ˈɒfə(r)/","image_prompts":["A hand extending a cup of hot tea on a wooden table, steam rising gently","A help sign with a phone number on a bulletin board next to a stack of free books"],"image_desc_en":"A hand offering a cup of tea on a table; a help sign with a phone number next to free books.","image_desc_cn":"一只手递出一杯茶放在木桌上，热气升腾；公告板上的帮助告示和免费书籍。","meaning_cn":"v. 提供；主动提出；n. 提议；出价","usage":"v. (过去式 offered, 过去分词 offered); n. (可数名词)","collocations":"offer help, offer advice, job offer, special offer","preposition_combos":"offer sth. to sb., offer to do sth.","examples":[{"en":"He offered to carry the heavy box for the old lady.","cn":"他主动提出帮老太太搬重箱子。"},{"en":"The store has a special offer on school bags this week.","cn":"这家商店本周对书包有特价优惠。"}],"socratic_questions":[{"question":"同学搬不动一摞书，你走过去说‘我来帮你吧’。你做了什么动作？","answer_hint":"这个词表示‘主动提出帮助’，不是‘命令’或‘请求’。"}],"fill_blank":{"sentences":["My neighbor ___ to water my plants while I was on vacation."],"options":["offered","asked","told","refused"],"correct_index":0},"audio":"Unit8/audio/offer.mp3","audio_ex0":"Unit8/audio/offer_ex0.mp3","audio_ex1":"Unit8/audio/offer_ex1.mp3"},{"word":"reasonable","ipa":"/ˈriːznəbl/","image_prompts":["A price tag showing $15 on a high-quality backpack, next to a similar tag showing $50, with a balanced scale icon between them","A clock showing 10:00 PM with a lamp on and an open textbook, but the lamp is turned off halfway, suggesting a fair bedtime"],"image_desc_en":"A price tag with a reasonable amount and a balanced scale; a lamp turned off at a fair hour with a textbook.","image_desc_cn":"一个标有合理价格的价签和天平；一盏在合理时间关闭的台灯和一本教科书。","meaning_cn":"adj. 合理的；公平的；适度的","usage":"adj. (比较级 more reasonable, 最高级 most reasonable)","collocations":"reasonable price, reasonable time, reasonable person","preposition_combos":"reasonable for, reasonable about","examples":[{"en":"The price of this book is very reasonable for students.","cn":"这本书的价格对学生来说非常合理。"},{"en":"My mom set a reasonable time for me to play games.","cn":"我妈妈给我设定了一个合理的玩游戏时间。"}],"socratic_questions":[{"question":"你想买一个篮球，但标价500元，你觉得太贵了。你希望价格怎么样？","answer_hint":"这个词表示价格不高不低，公平恰当，不是太贵也不是太便宜。"}],"fill_blank":{"sentences":["The teacher gave us a ___ amount of homework for the weekend."],"options":["reasonable","expensive","difficult","boring"],"correct_index":0},"audio":"Unit8/audio/reasonable.mp3","audio_ex0":"Unit8/audio/reasonable_ex0.mp3","audio_ex1":"Unit8/audio/reasonable_ex1.mp3"},{"word":"social","ipa":"/ˈsoʊʃl/","image_prompts":["A group of colorful speech bubbles floating above a round table with four empty chairs in a bright room","A calendar with several circled dates labeled 'club meeting' and 'party', with a handshake icon next to them"],"image_desc_en":"Colorful speech bubbles above a table with chairs; a calendar with social event dates and a handshake icon.","image_desc_cn":"桌子上方彩色对话气泡和椅子；日历上标有社交活动日期和握手图标。","meaning_cn":"adj. 社交的；社会的","usage":"adj. (无比较级)","collocations":"social life, social skills, social event","preposition_combos":"social with","examples":[{"en":"Joining a club can improve your social skills greatly.","cn":"加入社团可以大大提升你的社交技能。"},{"en":"The school dance is a big social event every year.","cn":"学校舞会是每年一次的大型社交活动。"}],"socratic_questions":[{"question":"你刚转学，想认识新朋友，需要多参加什么类型的活动？","answer_hint":"这个词描述与人交往、集体活动的性质，比如聚会、社团活动。"}],"fill_blank":{"sentences":["Having good ___ skills helps you make friends easily."],"options":["social","math","sports","reading"],"correct_index":0},"audio":"Unit8/audio/social.mp3","audio_ex0":"Unit8/audio/social_ex0.mp3","audio_ex1":"Unit8/audio/social_ex1.mp3"},{"word":"medium","ipa":"/ˈmiːdiəm/","image_prompts":["Three coffee cups in a row: a small espresso cup, a medium-sized mug, and a large travel mug, with labels underneath","A pizza box with three size circles drawn on it: small, medium, large, with the medium circle highlighted in red"],"image_desc_en":"Three cups of different sizes with a medium one labeled; a pizza box with small, medium, large circles, medium highlighted.","image_desc_cn":"三个不同大小的杯子，中等大小有标签；披萨盒上画有小、中、大三个圆圈，中等被标红。","meaning_cn":"adj. 中等的；n. 媒介；方法","usage":"adj. (无比较级) / n. (复数 media 或 mediums)","collocations":"medium size, medium heat, medium rare","preposition_combos":"medium of, medium for","examples":[{"en":"I ordered a medium pizza for our family dinner tonight.","cn":"我为今晚的家庭晚餐点了一个中份披萨。"},{"en":"Please cook the steak on medium heat for ten minutes.","cn":"请用中火把牛排煎十分钟。"}],"socratic_questions":[{"question":"你想买一件T恤，但不确定选S号还是L号，你觉得哪个尺寸最合适？","answer_hint":"这个词表示不大不小、介于两者之间的尺寸。"}],"fill_blank":{"sentences":["She chose a ___ -sized backpack for her school trip."],"options":["medium","small","large","tiny"],"correct_index":0},"audio":"Unit8/audio/medium.mp3","audio_ex0":"Unit8/audio/medium_ex0.mp3","audio_ex1":"Unit8/audio/medium_ex1.mp3"},{"word":"social media","ipa":"/ˈsoʊʃl ˈmiːdiə/","image_prompts":["A smartphone screen showing icons of a blue bird, a camera, and a message bubble, with a notification badge on each","A laptop keyboard with a glowing screen showing a feed of photos and like heart icons, a cup of coffee beside it"],"image_desc_en":"A smartphone with social app icons and notifications; a laptop screen showing a photo feed with like hearts.","image_desc_cn":"智能手机上显示社交应用图标和通知；笔记本电脑屏幕显示照片流和点赞心形图标。","meaning_cn":"n. 社交媒体","usage":"n. (不可数，常作单数)","collocations":"use social media, post on social media, social media platform","preposition_combos":"on social media, through social media","examples":[{"en":"Many students use social media to share their hobbies.","cn":"很多学生用社交媒体分享自己的爱好。"},{"en":"Social media helps us keep in touch with old friends.","cn":"社交媒体帮助我们与老朋友保持联系。"}],"socratic_questions":[{"question":"你想看朋友最近旅行的照片，除了直接打电话，还可以去哪里看？","answer_hint":"这是一个由两个词组成的短语，指在网络上分享信息和照片的平台。"}],"fill_blank":{"sentences":["He spends too much time on ___ every day."],"options":["social media","homework","sports","sleep"],"correct_index":0},"audio":"Unit8/audio/social_media.mp3","audio_ex0":"Unit8/audio/social_media_ex0.mp3","audio_ex1":"Unit8/audio/social_media_ex1.mp3"},{"word":"trust","ipa":"/trʌst/","image_prompts":["A locked metal safe with a golden key inserted, soft warm light illuminating the keyhole","Two hands clasped together in a handshake silhouette against a sunset sky, no people visible"],"image_desc_en":"A locked safe with a key inserted, or two hands shaking in silhouette at sunset.","image_desc_cn":"一个插着钥匙的锁着的保险箱，或日落时分握手的剪影。","meaning_cn":"信任；信赖","usage":"n. / v. (过去式 trusted, 过去分词 trusted)","collocations":"trust sb/sth; have trust in; build trust","preposition_combos":"trust in; trust with","examples":[{"en":"I trust my best friend to keep my secret.","cn":"我相信我最好的朋友会保守我的秘密。"},{"en":"The team built trust through hard work together.","cn":"团队通过共同努力建立了信任。"}],"socratic_questions":[{"question":"你和朋友约好互相保守秘密，你相信他不会说出去。这种‘相信’用哪个词？","answer_hint":"这个词强调对他人可靠性的信心，不是简单的‘相信事实’（believe）。"}],"fill_blank":{"sentences":["You can ___ her to finish the project on time."],"options":["trust","force","allow","teach"],"correct_index":0},"audio":"Unit8/audio/trust.mp3","audio_ex0":"Unit8/audio/trust_ex0.mp3","audio_ex1":"Unit8/audio/trust_ex1.mp3"},{"word":"keep","ipa":"/kiːp/","image_prompts":["A glass jar filled with colorful marbles on a shelf, lid tightly closed","A diary with a small padlock on a wooden desk, a pen lying beside it"],"image_desc_en":"A jar of marbles with a closed lid, or a locked diary on a desk.","image_desc_cn":"一个盖着盖子的弹珠罐，或书桌上带小锁的日记本。","meaning_cn":"保持；保留；继续","usage":"v. (过去式 kept, 过去分词 kept)","collocations":"keep doing; keep + adj.; keep a secret; keep a record","preposition_combos":"keep from; keep on; keep up with","examples":[{"en":"Please keep quiet during the exam in the hall.","cn":"考试期间请在礼堂保持安静。"},{"en":"I keep a diary to record my daily life.","cn":"我写日记来记录我的日常生活。"}],"socratic_questions":[{"question":"考试时老师要求大家不要说话，这个‘保持安静’的‘保持’用哪个动词？","answer_hint":"这个词表示维持某种状态或动作的持续，后面常接形容词或doing。"}],"fill_blank":{"sentences":["She ___ a photo of her family in her wallet."],"options":["keeps","throws","forgets","breaks"],"correct_index":0},"audio":"Unit8/audio/keep.mp3","audio_ex0":"Unit8/audio/keep_ex0.mp3","audio_ex1":"Unit8/audio/keep_ex1.mp3"},{"word":"local","ipa":"/ˈloʊkl/","image_prompts":["A small bakery with a wooden sign reading 'Fresh Bread' on a quiet street corner","A map of a town with a red pin marking a park, surrounded by tiny street names"],"image_desc_en":"A small bakery on a street corner, or a town map with a red pin on a park.","image_desc_cn":"街角的小面包店，或一张标有红色图钉的城镇地图。","meaning_cn":"当地的；本地的","usage":"adj. / n. (复数 locals)","collocations":"local food; local community; local news","preposition_combos":"local to (较少用)","examples":[{"en":"We bought fresh fruit from the local market.","cn":"我们从当地市场买了新鲜水果。"},{"en":"The local library holds a reading club every week.","cn":"当地图书馆每周举办读书俱乐部。"}],"socratic_questions":[{"question":"你想推荐一家学校附近的面包店，这家店不是连锁店，是‘本地的’，用哪个形容词？","answer_hint":"这个词指属于某个特定小区域的，不是全国或全球性的。"}],"fill_blank":{"sentences":["The ___ newspaper reports events in our town."],"options":["local","national","international","ancient"],"correct_index":0},"audio":"Unit8/audio/local.mp3","audio_ex0":"Unit8/audio/local_ex0.mp3","audio_ex1":"Unit8/audio/local_ex1.mp3"},{"word":"face-to-face","ipa":"/ˌfeɪs tə ˈfeɪs/","image_prompts":["Two empty chairs facing each other across a small round table with a coffee cup on it","A video call screen showing two empty chairs in different rooms, a laptop in the middle"],"image_desc_en":"Two chairs facing each other with a coffee cup on a table, or a laptop showing two empty chairs on a video call.","image_desc_cn":"两把椅子面对面摆放，桌上放着一杯咖啡；或笔记本电脑屏幕显示视频通话中的两把空椅子。","meaning_cn":"面对面地","usage":"adv. / adj.","collocations":"face-to-face meeting; talk face-to-face; face-to-face communication","preposition_combos":"无固定介词搭配","examples":[{"en":"We had a face-to-face talk about our plan.","cn":"我们就计划进行了面对面交谈。"},{"en":"Face-to-face communication is better than texting.","cn":"面对面交流比发短信更好。"}],"socratic_questions":[{"question":"你和朋友吵架了，你觉得发信息说不清楚，最好‘当面’谈一谈。这个‘当面’用哪个短语？","answer_hint":"这个短语字面意思是‘脸对脸’，强调直接见面，不是通过手机或网络。"}],"fill_blank":{"sentences":["It is important to have a ___ meeting to solve the problem."],"options":["face-to-face","online","written","phone"],"correct_index":0},"audio":"Unit8/audio/face-to-face.mp3","audio_ex0":"Unit8/audio/face-to-face_ex0.mp3","audio_ex1":"Unit8/audio/face-to-face_ex1.mp3"},{"word":"professor","ipa":"/prəˈfesər/","image_prompts":["A wooden desk in a university lecture hall with a stack of research papers and a coffee mug, chalkboard in background with complex formulas","A leather-bound book titled 'Advanced Physics' on a mahogany bookshelf, reading glasses resting on top, soft library lighting"],"image_desc_en":"A university lecture hall desk with research papers and a coffee mug, chalkboard with formulas behind.","image_desc_cn":"大学讲堂书桌上放着研究论文和咖啡杯，背后黑板上有公式。","meaning_cn":"教授","usage":"n. (可数名词) 教授","collocations":"university professor, history professor, professor of English","preposition_combos":"professor at (a university), professor of (a subject)","examples":[{"en":"The history professor gave a lecture about ancient Rome yesterday.","cn":"历史教授昨天做了一个关于古罗马的讲座。"},{"en":"My uncle is a famous professor at a medical school.","cn":"我叔叔是一所医学院的著名教授。"}],"socratic_questions":[{"question":"你在大学里遇到一位学识渊博、专门研究某个学科的老师，通常怎么称呼他？","answer_hint":"这个词指大学里最高级别的教师，比‘teacher’更正式、更专业。"}],"fill_blank":{"sentences":["The ___ asked us to read three books before next class."],"options":["professor","doctor","coach","driver"],"correct_index":0},"audio":"Unit8/audio/professor.mp3","audio_ex0":"Unit8/audio/professor_ex0.mp3","audio_ex1":"Unit8/audio/professor_ex1.mp3"},{"word":"speech","ipa":"/spiːtʃ/","image_prompts":["A wooden podium with a microphone on an empty stage, spotlight shining down, red curtain in background","A typed manuscript on a lectern with handwritten notes in red ink, a glass of water beside it"],"image_desc_en":"A wooden podium with a microphone on an empty stage under a spotlight, red curtain behind.","image_desc_cn":"空舞台上木制讲台带麦克风，聚光灯照射，红色幕布在后方。","meaning_cn":"演讲；说话的能力","usage":"n. (可数/不可数名词) 演讲；言语","collocations":"give a speech, make a speech, freedom of speech","preposition_combos":"speech about/on (a topic), speech to (an audience)","examples":[{"en":"Our class president will give a speech at the school assembly.","cn":"我们班长将在学校集会上发表演讲。"},{"en":"The winner's speech was short but very touching.","cn":"获胜者的演讲简短但非常感人。"}],"socratic_questions":[{"question":"你在全校师生面前站在台上说一段话，表达自己的想法，这叫什么？","answer_hint":"这个词强调‘说出来的话’，通常是在正式场合对一群人说的。"}],"fill_blank":{"sentences":["She prepared a short ___ for the graduation ceremony."],"options":["speech","song","letter","dance"],"correct_index":0},"audio":"Unit8/audio/speech.mp3","audio_ex0":"Unit8/audio/speech_ex0.mp3","audio_ex1":"Unit8/audio/speech_ex1.mp3"},{"word":"argue","ipa":"/ˈɑːrɡjuː/","image_prompts":["Two crumpled pieces of paper on a wooden table, one with 'YES' and one with 'NO' written in red ink, a broken pencil between them","A whiteboard with two opposing opinion columns written in different colored markers, eraser marks smudging both sides"],"image_desc_en":"Two crumpled papers marked 'YES' and 'NO' on a table with a broken pencil between them.","image_desc_cn":"桌子上两张皱巴巴的纸分别写着‘是’和‘否’，中间有一支断铅笔。","meaning_cn":"争论；争吵","usage":"v. (过去式 argued, 过去分词 argued) 争论","collocations":"argue with someone, argue about/over something","preposition_combos":"argue with (sb), argue about/over (sth)","examples":[{"en":"My friends often argue about which movie is the best.","cn":"我的朋友们经常争论哪部电影最好看。"},{"en":"Don't argue with your parents over small things.","cn":"不要为小事和父母争吵。"}],"socratic_questions":[{"question":"你和同学对一道数学题的答案有不同看法，你们开始大声说出各自的理由，这叫什么？","answer_hint":"这个词表示双方意见不合，用语言表达不同观点，比‘talk’更激烈。"}],"fill_blank":{"sentences":["The two brothers often ___ about which TV show to watch."],"options":["argue","agree","sing","sleep"],"correct_index":0},"audio":"Unit8/audio/argue.mp3","audio_ex0":"Unit8/audio/argue_ex0.mp3","audio_ex1":"Unit8/audio/argue_ex1.mp3"},{"word":"make up","ipa":"/meɪk ʌp/","image_prompts":["Two puzzle pieces fitting together on a wooden table, golden light shining on the joined seam","A broken ceramic vase repaired with gold lacquer (kintsugi style), sitting on a white shelf"],"image_desc_en":"Two puzzle pieces fitting together on a wooden table with golden light on the seam.","image_desc_cn":"木桌上两块拼图拼合在一起，金色光线照在接缝处。","meaning_cn":"和解；编造；组成","usage":"v. (过去式 made up, 过去分词 made up) 和解；编造；组成","collocations":"make up with someone, make up a story, make up a team","preposition_combos":"make up with (sb), make up for (sth)","examples":[{"en":"After the fight, they decided to make up and be friends again.","cn":"吵架之后，他们决定和好，重新做朋友。"},{"en":"She had to make up a story to explain why she was late.","cn":"她不得不编个故事来解释为什么迟到。"}],"socratic_questions":[{"question":"你和好朋友吵架后，两人互相道歉、重新和好，这个动作叫什么？","answer_hint":"这是一个短语动词，表示‘和好’或‘编造’，由两个词组成。"}],"fill_blank":{"sentences":["They had a small quarrel but soon ___ ___ and played together."],"options":["made up","gave up","stood up","woke up"],"correct_index":0},"audio":"Unit8/audio/make_up.mp3","audio_ex0":"Unit8/audio/make_up_ex0.mp3","audio_ex1":"Unit8/audio/make_up_ex1.mp3"},{"word":"in person","ipa":"/ɪn ˈpɜːrsən/","image_prompts":["A handwritten letter on a wooden desk with a stamp, next to a laptop showing a video call screen, contrasting physical presence with digital communication","A theater stage with red curtains and a single microphone on a stand, empty seats in the audience, representing live performance attendance"],"image_desc_en":"A handwritten letter on a wooden desk with a stamp, next to a laptop showing a video call screen, contrasting physical presence with digital communication","image_desc_cn":"一张木桌上放着一封手写信和邮票，旁边是一台显示视频通话屏幕的笔记本电脑，对比实体到场与数字交流","meaning_cn":"亲自；本人","usage":"adv. (副词短语，修饰动词，表示亲自做某事)","collocations":"meet in person, attend in person, see in person, apply in person","preposition_combos":"无固定介词搭配，常直接跟在动词后","examples":[{"en":"I want to thank the teacher in person for her help.","cn":"我想亲自感谢老师的帮助。"},{"en":"You should hand in the form in person before Friday.","cn":"你应该在周五前亲自交表格。"}],"socratic_questions":[{"question":"你有一份重要的申请要交，是让别人代交还是自己跑一趟？哪种方式更能体现诚意？","answer_hint":"强调亲自到场、面对面，而不是通过电话或别人转交。"}],"fill_blank":{"sentences":["She decided to meet the famous writer ___ at the book fair."],"options":["in person","on phone","by email","in group"],"correct_index":0},"audio":"Unit8/audio/in_person.mp3","audio_ex0":"Unit8/audio/in_person_ex0.mp3","audio_ex1":"Unit8/audio/in_person_ex1.mp3"},{"word":"prefer","ipa":"/prɪˈfɜːr/","image_prompts":["A cup of hot tea next to a glass of iced cola on a sunny windowsill, steam rising from the tea, a small arrow pointing to the tea cup","A library shelf with a thick novel and a thin comic book side by side, a hand reaching toward the novel"],"image_desc_en":"A cup of hot tea next to a glass of iced cola on a sunny windowsill, steam rising from the tea, a small arrow pointing to the tea cup","image_desc_cn":"阳光明媚的窗台上放着一杯热茶和一杯冰可乐，茶冒着热气，一个小箭头指向茶杯","meaning_cn":"更喜欢；偏好","usage":"v. (过去式 preferred, 过去分词 preferred) 常见搭配：prefer A to B / prefer doing A to doing B / prefer to do","collocations":"prefer tea to coffee, prefer reading to watching TV, prefer to stay home","preposition_combos":"prefer A to B (比起B更喜欢A)","examples":[{"en":"I prefer cycling to school because it keeps me fit.","cn":"我更喜欢骑自行车上学，因为它让我保持健康。"},{"en":"Most students prefer group study over studying alone.","cn":"大多数学生更喜欢小组学习而不是独自学习。"}],"socratic_questions":[{"question":"周末你有两个选择：去图书馆安静看书，或者去操场打篮球。你更倾向哪一个？为什么？","answer_hint":"表示在两者中选一个更喜欢的，用 prefer...to... 结构。"}],"fill_blank":{"sentences":["She ___ walking in the park to sitting at home all day."],"options":["prefers","hates","forgets","stops"],"correct_index":0},"audio":"Unit8/audio/prefer.mp3","audio_ex0":"Unit8/audio/prefer_ex0.mp3","audio_ex1":"Unit8/audio/prefer_ex1.mp3"},{"word":"calm","ipa":"/kɑːm/","image_prompts":["A still lake surface reflecting a clear blue sky, no ripples, surrounded by pine trees at sunrise","A single white candle burning steadily on a dark wooden table, wax dripping slowly, soft warm glow"],"image_desc_en":"A still lake surface reflecting a clear blue sky, no ripples, surrounded by pine trees at sunrise","image_desc_cn":"平静的湖面倒映着清澈的蓝天，没有涟漪，四周是日出时的松树","meaning_cn":"平静的；冷静的；使平静","usage":"adj. / v. (过去式 calmed, 过去分词 calmed) 形容词：保持冷静；动词：使……平静下来","collocations":"keep calm, stay calm, calm down, calm oneself","preposition_combos":"calm down (冷静下来)；calm sb. down (使某人平静)","examples":[{"en":"Take a deep breath and try to stay calm before the exam.","cn":"考试前深呼吸，尽量保持冷静。"},{"en":"The soft music helped calm my nerves before the speech.","cn":"轻柔的音乐帮助我在演讲前平静了紧张情绪。"}],"socratic_questions":[{"question":"明天就要期末考试了，你心跳很快，手心出汗。这时候你应该怎么做才能让自己不紧张？","answer_hint":"描述一种不慌张、平稳的状态，或者让这种状态发生。"}],"fill_blank":{"sentences":["The teacher asked everyone to ___ down and listen carefully."],"options":["calm","run","shout","jump"],"correct_index":0},"audio":"Unit8/audio/calm.mp3","audio_ex0":"Unit8/audio/calm_ex0.mp3","audio_ex1":"Unit8/audio/calm_ex1.mp3"},{"word":"worry about","ipa":"/ˈwɜːri əˈbaʊt/","image_prompts":["A desk calendar with a red circle around a date, a clock showing late hour, scattered crumpled paper balls around a trash bin","A thermometer showing high fever temperature next to a bottle of medicine and a glass of water on a bedside table"],"image_desc_en":"A desk calendar with a red circle around a date, a clock showing late hour, scattered crumpled paper balls around a trash bin","image_desc_cn":"一本台历上红色圆圈标出一个日期，时钟显示很晚的时间，垃圾桶周围散落着揉皱的纸团","meaning_cn":"担心；忧虑","usage":"v. (短语动词) 过去式 worried about, 过去分词 worried about","collocations":"worry about exams, worry about health, worry about the future, don't worry about","preposition_combos":"worry about + 名词/代词/动名词","examples":[{"en":"Don't worry about the test; you have prepared well.","cn":"别担心考试，你已经准备得很好了。"},{"en":"She always worries about her little brother when he is late.","cn":"她弟弟晚归时她总是担心。"}],"socratic_questions":[{"question":"你的好朋友明天要参加演讲比赛，他反复练习但还是害怕出错。你该怎么安慰他？","answer_hint":"表达对某件事感到不安、焦虑，常用短语搭配 about。"}],"fill_blank":{"sentences":["There is no need to ___ ___ the result if you tried your best."],"options":["worry about","care for","think of","look for"],"correct_index":0},"audio":"Unit8/audio/worry_about.mp3","audio_ex0":"Unit8/audio/worry_about_ex0.mp3","audio_ex1":"Unit8/audio/worry_about_ex1.mp3"},{"word":"expression","ipa":"/ɪkˈspreʃn/","image_prompts":["A close-up of a paintbrush leaving a bold red stroke on a white canvas, paint splatters around","A chalkboard filled with mathematical equations and a single large question mark drawn in yellow chalk"],"image_desc_en":"A paintbrush leaving a bold red stroke on a white canvas with paint splatters; a chalkboard with equations and a large yellow question mark.","image_desc_cn":"画笔在白色画布上留下醒目的红色笔触，周围有颜料飞溅；一块写满数学方程式的黑板，上面有一个黄色的大问号。","meaning_cn":"表达；表情；措辞","usage":"n. (可数名词) 表达；表情；措辞","collocations":"facial expression, an expression of thanks, beyond expression","preposition_combos":"expression of, expression on one's face","examples":[{"en":"Her facial expression showed she was very surprised.","cn":"她的面部表情表明她非常惊讶。"},{"en":"This poem is a beautiful expression of love.","cn":"这首诗是爱的美丽表达。"}],"socratic_questions":[{"question":"当你在作文中想描述一个人看到惊喜礼物时的神态，你会用哪个词来指代他脸上的样子？","answer_hint":"这个词可以指脸上显示的情绪，比如惊讶或快乐，常和facial搭配。"}],"fill_blank":{"sentences":["His ___ showed that he didn't understand the question."],"options":["expression","impression","pressure","discussion"],"correct_index":0},"audio":"Unit8/audio/expression.mp3","audio_ex0":"Unit8/audio/expression_ex0.mp3","audio_ex1":"Unit8/audio/expression_ex1.mp3"},{"word":"chance","ipa":"/tʃɑːns/","image_prompts":["A golden lottery ticket lying on a wooden table next to a cup of coffee, morning sunlight strea
