a blue sky reflection","A lotus bud rising above muddy water in a pond, surrounded by lily pads and a dragonfly nearby"],"image_desc_en":"A pink lotus on a pond or a lotus bud above muddy water","image_desc_cn":"池塘上的粉色莲花或泥水上的莲花花苞","meaning_cn":"莲花；荷花","usage":"n. (复数 lotuses 或 lotus)","collocations":"lotus flower, lotus pond, lotus leaf","preposition_combos":"lotus in the pond, lotus on the water","examples":[{"en":"The lotus grows in muddy water but stays clean and beautiful.","cn":"莲花生长在泥水中，却保持洁净美丽。"},{"en":"We took a boat to see the lotus flowers in the lake.","cn":"我们乘船去看湖里的莲花。"}],"socratic_questions":[{"question":"夏天去公园的池塘边，你会看到一种花从淤泥里长出来，但花瓣很干净，叶子又大又圆。这是什么花？","answer_hint":"这种花就是 lotus，常用来比喻出淤泥而不染的品质。"}],"fill_blank":{"sentences":["The ___ flower is a symbol of purity in many cultures."],"options":["lotus","tulip","daffodil","carnation"],"correct_index":0},"audio":"Unit4/audio/lotus.mp3","audio_ex0":"Unit4/audio/lotus_ex0.mp3","audio_ex1":"Unit4/audio/lotus_ex1.mp3"},{"word":"butterfly","ipa":"/ˈbʌtərflaɪ/","image_prompts":["A bright orange and black butterfly resting on a purple flower in a sunny garden, wings fully open","A blue butterfly with white spots perched on a green leaf, morning dew drops on the leaf surface"],"image_desc_en":"A butterfly with colorful wings resting on a flower or leaf in nature.","image_desc_cn":"一只色彩斑斓的蝴蝶停在花朵或叶子上。","meaning_cn":"蝴蝶","usage":"n. (可数名词，复数 butterflies)","collocations":"a beautiful butterfly, catch a butterfly, butterfly wings","preposition_combos":"butterfly on (a flower), butterfly in (the garden)","examples":[{"en":"A beautiful butterfly landed on the yellow flower in the garden.","cn":"一只美丽的蝴蝶落在花园里的黄色花朵上。"},{"en":"I saw a blue butterfly flying near the river yesterday morning.","cn":"昨天早上我看见一只蓝色蝴蝶在河边飞。"}],"socratic_questions":[{"question":"小明在公园里看到一种昆虫，它有四片大翅膀，颜色很鲜艳，飞起来很轻快。这是什么昆虫？","answer_hint":"这种昆虫翅膀大而美丽，常在花丛中飞舞，就是蝴蝶。"}],"fill_blank":{"sentences":["A ___ flew across the garden and landed on a rose."],"options":["butterfly","bird","bee","dragonfly"],"correct_index":0},"audio":"Unit4/audio/butterfly.mp3","audio_ex0":"Unit4/audio/butterfly_ex0.mp3","audio_ex1":"Unit4/audio/butterfly_ex1.mp3"},{"word":"wing","ipa":"/wɪŋ/","image_prompts":["A close-up of a bird's wing spread wide, showing layered feathers in brown and white","A white paper airplane with one wing folded at an angle, lying on a wooden table"],"image_desc_en":"A wing of a bird or an object shaped like a wing.","image_desc_cn":"鸟类的翅膀或类似翅膀形状的物体。","meaning_cn":"翅膀；机翼","usage":"n. (可数名词，复数 wings)","collocations":"left wing, right wing, bird's wings, airplane wings","preposition_combos":"wing of (a bird/plane), under the wing","examples":[{"en":"The bird hurt its left wing and could not fly away.","cn":"那只鸟伤了左翼，飞不走了。"},{"en":"The airplane's wings are long and made of strong metal.","cn":"飞机的机翼很长，由坚固的金属制成。"}],"socratic_questions":[{"question":"小华在观察一只受伤的小鸟，发现它有一边身体上的羽毛部分不能动了，导致它飞不起来。是哪个部位出了问题？","answer_hint":"鸟用来飞行的身体部位就是翅膀。"}],"fill_blank":{"sentences":["The eagle spread its ___ wide and soared into the sky."],"options":["wings","legs","eyes","beak"],"correct_index":0},"audio":"Unit4/audio/wing.mp3","audio_ex0":"Unit4/audio/wing_ex0.mp3","audio_ex1":"Unit4/audio/wing_ex1.mp3"},{"word":"frog","ipa":"/frɒɡ/","image_prompts":["A green frog sitting on a large lily pad in a pond, water ripples around it","A small brown frog jumping off a wet rock near a stream, splash of water droplets"],"image_desc_en":"A frog sitting or jumping near water, with smooth skin and long legs.","image_desc_cn":"一只青蛙坐在或跳在水边，皮肤光滑，腿长。","meaning_cn":"青蛙","usage":"n. (可数名词，复数 frogs)","collocations":"a green frog, jump like a frog, frog in the pond","preposition_combos":"frog in (the pond), frog on (a leaf)","examples":[{"en":"A small green frog jumped into the pond with a splash.","cn":"一只绿色的小青蛙扑通一声跳进了池塘。"},{"en":"We saw a frog sitting quietly on a rock near the lake.","cn":"我们看到一只青蛙安静地坐在湖边的岩石上。"}],"socratic_questions":[{"question":"在池塘边，你听到“呱呱”的叫声，然后看到一只绿色的小动物从荷叶上跳进水里。这是什么动物？","answer_hint":"这种动物生活在水中和陆地，会跳，叫声“呱呱”，就是青蛙。"}],"fill_blank":{"sentences":["The ___ caught a fly with its long tongue in one second."],"options":["frog","cat","dog","rabbit"],"correct_index":0},"audio":"Unit4/audio/frog.mp3","audio_ex0":"Unit4/audio/frog_ex0.mp3","audio_ex1":"Unit4/audio/frog_ex1.mp3"},{"word":"up to","ipa":"/ʌp tuː/","image_prompts":["A stack of books on a desk, the top book reaching up to a ruler marked 30 centimeters","A thermometer outside a window showing the mercury rising up to 38 degrees Celsius"],"image_desc_en":"A measurement or limit shown by an object reaching a certain point.","image_desc_cn":"一个物体达到某个点或限度，表示测量或上限。","meaning_cn":"多达；直到；由……决定","usage":"prep. (介词短语)","collocations":"up to ten, up to you, up to now, up to 100","preposition_combos":"up to (number/point), up to (someone)","examples":[{"en":"You can borrow up to five books from the library each time.","cn":"你每次最多可以从图书馆借五本书。"},{"en":"It is up to you to decide which movie we watch tonight.","cn":"由你来决定我们今晚看哪部电影。"}],"socratic_questions":[{"question":"老师说这次考试你可以选择做其中三道题，或者做全部五道题，但最多不能超过五道。老师说的“最多”用英语怎么说？","answer_hint":"表示数量上限的短语是“up to”，意思是“多达”。"}],"fill_blank":{"sentences":["You can spend ___ 50 yuan on the gift for your friend."],"options":["up to","as many","more than","less than"],"correct_index":0},"audio":"Unit4/audio/up_to.mp3","audio_ex0":"Unit4/audio/up_to_ex0.mp3","audio_ex1":"Unit4/audio/up_to_ex1.mp3"},{"word":"weigh","ipa":"/weɪ/","image_prompts":["A digital kitchen scale showing 250 grams with a red apple on the weighing platform, bright white background","A luggage scale hooked onto a blue suitcase handle, display showing 15.2 kg, airport check-in counter background"],"image_desc_en":"A digital scale with an apple on it, displaying weight in grams.","image_desc_cn":"一个数字秤上放着一个苹果，显示以克为单位的重量。","meaning_cn":"v. 称重；重达","usage":"v. (过去式 weighed, 过去分词 weighed)","collocations":"weigh oneself, weigh the package, weigh carefully","preposition_combos":"weigh in at, weigh up","examples":[{"en":"The backpack weighs about five kilograms with all the books.","cn":"这个背包装上所有书后重约五公斤。"},{"en":"Please weigh the fruit before putting it into the bag.","cn":"请把水果放进袋子前先称一下重量。"}],"socratic_questions":[{"question":"你想知道这个西瓜有多重，需要用什么动作来得到数字？","answer_hint":"这个动作就是放在秤上得到重量数值，不是测量长度或体积。"}],"fill_blank":{"sentences":["The post office worker will ___ the box before shipping."],"options":["weigh","measure","count","test"],"correct_index":0},"audio":"Unit4/audio/weigh.mp3","audio_ex0":"Unit4/audio/weigh_ex0.mp3","audio_ex1":"Unit4/audio/weigh_ex1.mp3"},{"word":"kg","ipa":"/ˌkeɪˈdʒiː/","image_prompts":["A black dumbbell with '5 kg' printed in white on the side, resting on a gym floor mat","A digital luggage scale display showing '23.0 kg' with a red suitcase handle in the background"],"image_desc_en":"A dumbbell with '5 kg' label on a gym mat.","image_desc_cn":"一个哑铃上标有'5 kg'字样，放在健身房地垫上。","meaning_cn":"n. 千克（kilogram的缩写）","usage":"n. (缩写形式，常与数字连用)","collocations":"10 kg, per kg, kg of rice","preposition_combos":"kg of","examples":[{"en":"My schoolbag is only three kg this term because I use lighter books.","cn":"这学期我的书包只有三公斤，因为我用了更轻的书。"},{"en":"The cat food bag says it contains 1.5 kg of dry food.","cn":"猫粮袋上写着含有1.5公斤干粮。"}],"socratic_questions":[{"question":"超市买米时，袋子上写着'5'后面跟着一个字母缩写，表示重量单位，这个缩写是什么？","answer_hint":"这是千克的英文缩写，两个字母，常出现在食品和行李标签上。"}],"fill_blank":{"sentences":["The maximum weight for this suitcase is 23 ___."],"options":["kg","km","ml","cm"],"correct_index":0},"audio":"Unit4/audio/kg.mp3","audio_ex0":"Unit4/audio/kg_ex0.mp3","audio_ex1":"Unit4/audio/kg_ex1.mp3"},{"word":"ginkgo","ipa":"/ˈɡɪŋkɡoʊ/","image_prompts":["A single bright yellow ginkgo leaf shaped like a fan lying on a gray stone pavement, autumn sunlight casting shadows","A cluster of fresh green ginkgo leaves on a branch against a clear blue sky, with small round ginkgo fruits visible"],"image_desc_en":"A yellow fan-shaped ginkgo leaf on a stone path.","image_desc_cn":"一片黄色的扇形银杏叶落在石板路上。","meaning_cn":"n. 银杏（树或叶）","usage":"n. (可数名词，复数 ginkgoes 或 ginkgos)","collocations":"ginkgo tree, ginkgo leaf, ginkgo nut","preposition_combos":"ginkgo in autumn, leaves of ginkgo","examples":[{"en":"The ginkgo tree in our school yard turns golden every October.","cn":"我们校园里的银杏树每年十月变成金黄色。"},{"en":"I collected a beautiful ginkgo leaf and pressed it in my notebook.","cn":"我捡了一片漂亮的银杏叶，夹在笔记本里。"}],"socratic_questions":[{"question":"秋天校园里有一种树，叶子像小扇子，变成金黄色很漂亮，这是什么树？","answer_hint":"这种树的叶子形状独特，像打开的扇子，秋天会变成明亮的黄色。"}],"fill_blank":{"sentences":["The ___ leaves on the ground looked like a golden carpet."],"options":["ginkgo","maple","oak","pine"],"correct_index":0},"audio":"Unit4/audio/ginkgo.mp3","audio_ex0":"Unit4/audio/ginkgo_ex0.mp3","audio_ex1":"Unit4/audio/ginkgo_ex1.mp3"},{"word":"believe","ipa":"/bɪˈliːv/","image_prompts":["A handwritten note on a desk saying 'You can do it!' next to a cup of hot tea and a glowing lamp","A stack of books with a bookmark sticking out, on top a small sign reading 'Dream Big' in colorful letters"],"image_desc_en":"A motivational note on a desk with a warm lamp and tea.","image_desc_cn":"书桌上有一张鼓励便条，旁边是温暖的台灯和热茶。","meaning_cn":"v. 相信；认为","usage":"v. (过去式 believed, 过去分词 believed)","collocations":"believe in, believe it or not, strongly believe","preposition_combos":"believe in, believe that","examples":[{"en":"I believe practice makes perfect, so I keep trying every day.","cn":"我相信熟能生巧，所以我每天都坚持练习。"},{"en":"Do you believe the weather report says it will rain tomorrow?","cn":"你相信天气预报说明天会下雨吗？"}],"socratic_questions":[{"question":"朋友告诉你他每天练琴两小时，你心里觉得他说的是真的，这个心理活动叫什么？","answer_hint":"这个动词表示内心接受某件事是真的，和'怀疑'意思相反。"}],"fill_blank":{"sentences":["I ___ that hard work leads to good results."],"options":["believe","doubt","forget","wonder"],"correct_index":0},"audio":"Unit4/audio/believe.mp3","audio_ex0":"Unit4/audio/believe_ex0.mp3","audio_ex1":"Unit4/audio/believe_ex1.mp3"},{"word":"province","ipa":"/ˈprɒvɪns/","image_prompts":["A large map of China with several provinces highlighted in different colors, each with a capital city marked by a star","A wooden signpost at a highway border reading 'Welcome to Sichuan Province' with mountains in the background"],"image_desc_en":"A map of China with colored provinces and a border signpost for a province.","image_desc_cn":"一张中国地图，各省份用不同颜色标出，以及一个写着省份名称的边境路牌。","meaning_cn":"省；省份","usage":"名词 n. (复数 provinces)","collocations":"in the province, across the province, home province","preposition_combos":"in a province, from a province","examples":[{"en":"My home province is famous for its spicy food.","cn":"我的家乡省份以辛辣食物闻名。"},{"en":"There are many beautiful lakes in this province.","cn":"这个省有许多美丽的湖泊。"}],"socratic_questions":[{"question":"你在中国地图上看到一个大区域，比如四川或广东，这个区域叫什么？","answer_hint":"这是中国行政区划中的一级单位，比城市大，叫‘省’。"}],"fill_blank":{"sentences":["Guangdong ___ has a long coastline and many big cities."],"options":["province","country","city","town"],"correct_index":0},"audio":"Unit4/audio/province.mp3","audio_ex0":"Unit4/audio/province_ex0.mp3","audio_ex1":"Unit4/audio/province_ex1.mp3"},{"word":"take a walk","ipa":"/teɪk ə wɔːk/","image_prompts":["A winding path through a green park with autumn leaves scattered on the ground, empty bench nearby","A pair of sneakers placed on a gravel trail leading into a forest, sunlight filtering through trees"],"image_desc_en":"A park path with leaves and a forest trail with sneakers.","image_desc_cn":"一条铺满落叶的公园小径和一双放在森林小径上的运动鞋。","meaning_cn":"散步","usage":"动词短语 (过去式 took a walk, 过去分词 taken a walk)","collocations":"take a walk after dinner, take a walk in the park, go for a walk","preposition_combos":"take a walk in/along/through","examples":[{"en":"Let's take a walk along the river after lunch.","cn":"午饭后我们沿着河边散步吧。"},{"en":"My grandparents take a walk in the park every morning.","cn":"我的祖父母每天早上在公园散步。"}],"socratic_questions":[{"question":"吃完晚饭后，你想出去放松一下，慢慢走一走，这个活动叫什么？","answer_hint":"不是跑步或快走，而是悠闲地走，叫‘散步’。"}],"fill_blank":{"sentences":["After finishing homework, I like to ___ in the garden."],"options":["take a walk","run fast","ride a bike","swim"],"correct_index":0},"audio":"Unit4/audio/take_a_walk.mp3","audio_ex0":"Unit4/audio/take_a_walk_ex0.mp3","audio_ex1":"Unit4/audio/take_a_walk_ex1.mp3"},{"word":"connect","ipa":"/kəˈnekt/","image_prompts":["Two puzzle pieces fitting together perfectly on a wooden table, bright colors","A USB cable plugged into a laptop and a smartphone, screen showing 'connected' icon"],"image_desc_en":"Two puzzle pieces joining and a USB cable linking devices.","image_desc_cn":"两块拼图拼合在一起，以及一根USB线连接笔记本电脑和手机。","meaning_cn":"连接；联系","usage":"动词 v. (过去式 connected, 过去分词 connected)","collocations":"connect A to B, connect with, connect online","preposition_combos":"connect to, connect with","examples":[{"en":"This bridge connects the two sides of the city.","cn":"这座桥连接了城市的两边。"},{"en":"We can connect with friends through video calls.","cn":"我们可以通过视频通话与朋友联系。"}],"socratic_questions":[{"question":"你想把手机和电脑用数据线连起来传照片，这个动作叫什么？","answer_hint":"让两个设备之间建立联系，叫‘连接’。"}],"fill_blank":{"sentences":["Please ___ the printer to the computer before printing."],"options":["connect","disconnect","break","open"],"correct_index":0},"audio":"Unit4/audio/connect.mp3","audio_ex0":"Unit4/audio/connect_ex0.mp3","audio_ex1":"Unit4/audio/connect_ex1.mp3"},{"word":"connected","ipa":"/kəˈnektɪd/","image_prompts":["A glowing network of dots and lines on a dark background, like a web of connections","Two train tracks merging at a junction with signals showing green lights"],"image_desc_en":"A glowing network diagram and train tracks merging at a junction.","image_desc_cn":"一张发光的网络连接图和两条铁轨在交汇处合并。","meaning_cn":"连接的；有联系的","usage":"形容词 adj. (由动词 connect 的过去分词转化而来)","collocations":"be connected to, stay connected, well-connected","preposition_combos":"connected to, connected with","examples":[{"en":"The two villages are connected by a new road.","cn":"这两个村庄由一条新路连接。"},{"en":"My phone is connected to the Wi-Fi network now.","cn":"我的手机现在连接到了Wi-Fi网络。"}],"socratic_questions":[{"question":"你的平板电脑已经能上网了，屏幕上显示‘已联网’，这个状态用哪个词形容？","answer_hint":"表示已经和网络建立了联系，叫‘已连接的’。"}],"fill_blank":{"sentences":["Make sure the laptop is ___ to the power source before use."],"options":["connected","disconnected","broken","empty"],"correct_index":0},"audio":"Unit4/audio/connected.mp3","audio_ex0":"Unit4/audio/connected_ex0.mp3","audio_ex1":"Unit4/audio/connected_ex1.mp3"},{"word":"be connected with","ipa":"/biː kəˈnektɪd wɪð/","image_prompts":["Two puzzle pieces fitting together on a wooden table, soft natural light","A network of glowing fiber optic cables linking multiple servers in a dark data center"],"image_desc_en":"Two puzzle pieces interlocking on a wooden surface, or glowing cables linking servers.","image_desc_cn":"两块拼图在木桌上咬合，或发光光缆连接服务器。","meaning_cn":"与……有联系；与……有关联","usage":"动词短语 (verb phrase)，常用于被动语态，表示事物之间的关联。","collocations":"be closely connected with, be directly connected with","preposition_combos":"be connected with (后接名词或代词)","examples":[{"en":"Your success is connected with your daily hard work.","cn":"你的成功与你每天的辛勤工作有关。"},{"en":"This museum is connected with the local history.","cn":"这个博物馆与当地历史有关联。"}],"socratic_questions":[{"question":"你想说“我的头痛和昨晚没睡好有关”，但不想用“because of”，可以用哪个短语表示两者有关联？","answer_hint":"这个短语由“be”加一个过去分词再加“with”组成，强调事物之间的关联性。"}],"fill_blank":{"sentences":["The accident ___ the driver's carelessness."],"options":["was connected with","was filled with","was covered with","was angry with"],"correct_index":0},"audio":"Unit4/audio/be_connected_with.mp3","audio_ex0":"Unit4/audio/be_connected_with_ex0.mp3","audio_ex1":"Unit4/audio/be_connected_with_ex1.mp3"},{"word":"without","ipa":"/wɪˈðaʊt/","image_prompts":["A cup of black coffee on a white saucer, no sugar cubes or cream nearby","An empty bird nest on a bare tree branch in winter, no eggs or birds inside"],"image_desc_en":"A cup of black coffee with no sugar or cream, or an empty bird nest on a branch.","image_desc_cn":"一杯不加糖不加奶的黑咖啡，或树枝上空空的鸟巢。","meaning_cn":"没有；缺乏；不（做某事）","usage":"介词 (prep.)，后接名词、代词或动名词。","collocations":"without doubt, without help, go without","preposition_combos":"without + n./doing","examples":[{"en":"She finished the test without any mistakes.","cn":"她完成了测试，没有任何错误。"},{"en":"We can't live without clean water and fresh air.","cn":"没有干净的水和新鲜的空气，我们无法生存。"}],"socratic_questions":[{"question":"你想说“他一句话没说就走了”，强调“没有”做某件事，应该用哪个介词？","answer_hint":"这个介词表示“缺乏”或“不伴随”，后面常接名词或动名词。"}],"fill_blank":{"sentences":["He left the room ___ saying goodbye."],"options":["without","with","by","for"],"correct_index":0},"audio":"Unit4/audio/without.mp3","audio_ex0":"Unit4/audio/without_ex0.mp3","audio_ex1":"Unit4/audio/without_ex1.mp3"},{"word":"imagine","ipa":"/ɪˈmædʒɪn/","image_prompts":["A sketchbook open to a page with a drawing of a flying castle among clouds, pencil nearby","A glass jar half-filled with colorful paper stars, soft glow from a desk lamp"],"image_desc_en":"An open sketchbook with a drawing of a flying castle, or a jar of colorful paper stars.","image_desc_cn":"一本打开的素描本，画着云中的飞行城堡，或一罐彩色纸星星。","meaning_cn":"想象；设想","usage":"动词 v. (过去式 imagined, 过去分词 imagined)，可接名词、代词、that从句或动名词。","collocations":"imagine doing sth., imagine that...","preposition_combos":"imagine + n./doing/that-clause","examples":[{"en":"Can you imagine living on another planet one day?","cn":"你能想象有一天生活在另一个星球上吗？"},{"en":"I imagine the party will be a lot of fun.","cn":"我设想这个聚会会很有趣。"}],"socratic_questions":[{"question":"你想说“我无法想象没有手机的生活”，表达在脑海里形成画面或想法，该用哪个动词？","answer_hint":"这个动词表示在脑海中创造或设想某种情景，常与“can't”连用。"}],"fill_blank":{"sentences":["It's hard to ___ a world without books."],"options":["imagine","remember","forget","decide"],"correct_index":0},"audio":"Unit4/audio/imagine.mp3","audio_ex0":"Unit4/audio/imagine_ex0.mp3","audio_ex1":"Unit4/audio/imagine_ex1.mp3"},{"word":"moss","ipa":"/mɒs/","image_prompts":["A thick green carpet of moss covering the cracks of an old stone wall in a forest","A close-up of bright green moss growing on a damp tree trunk, tiny dewdrops on the surface"],"image_desc_en":"Green moss covering an old stone wall, or moss on a damp tree trunk with dewdrops.","image_desc_cn":"绿色苔藓覆盖着旧石墙，或潮湿树干上的苔藓带着露珠。","meaning_cn":"苔藓；藓类植物","usage":"名词 n. (不可数名词)，指一种生长在潮湿阴暗处的绿色小型植物。","collocations":"green moss, soft moss, covered with moss","preposition_combos":"moss on + n., covered with moss","examples":[{"en":"The old stones in the garden are covered with soft moss.","cn":"花园里的旧石头上覆盖着柔软的苔藓。"},{"en":"Moss grows well in wet and shady places.","cn":"苔藓在潮湿阴暗的地方长得很好。"}],"socratic_questions":[{"question":"你想描述森林里一块潮湿的石头上长满了绿色的细小植物，这种植物叫什么？","answer_hint":"这是一种生长在阴湿环境中的小型绿色植物，没有真正的根和花，常覆盖在石头或树干上。"}],"fill_blank":{"sentences":["The north side of the tree trunk was covered with thick ___."],"options":["moss","sand","snow","dust"],"correct_index":0},"audio":"Unit4/audio/moss.mp3","audio_ex0":"Unit4/audio/moss_ex0.mp3","audio_ex1":"Unit4/audio/moss_ex1.mp3"},{"word":"redwood","ipa":"/ˈred.wʊd/","image_prompts":["A close-up of a massive redwood tree trunk with thick reddish bark and moss at the base, forest floor covered in fallen needles","A cross-section of a redwood log showing distinct growth rings, placed on a wooden table with a ruler beside it"],"image_desc_en":"A close-up of a massive redwood tree trunk with thick reddish bark and moss at the base, forest floor covered in fallen needles","image_desc_cn":"一棵巨大红杉树干的特写，树皮厚实呈红褐色，基部有苔藓，林地上覆盖着落叶","meaning_cn":"红杉；红木","usage":"n. (可数名词，复数 redwoods)","collocations":"tall redwood, redwood forest, redwood tree, ancient redwood","preposition_combos":"a forest of redwoods; a bench made of redwood","examples":[{"en":"The tall redwood tree stood over fifty meters high in the park.","cn":"那棵高大的红杉树在公园里矗立了五十多米高。"},{"en":"We sat on a redwood bench and enjoyed the cool afternoon breeze.","cn":"我们坐在一张红木长椅上，享受着凉爽的午后微风。"}],"socratic_questions":[{"question":"小明去国家公园看到一种树，树皮是红褐色的，非常高大，比周围的松树高很多。这种树叫什么？","answer_hint":"这种树以颜色和高度闻名，名字里带有‘红’和‘木’的意思。"}],"fill_blank":{"sentences":["The ancient ___ tree in the forest is over a thousand years old."],"options":["redwood","pine","oak","maple"],"correct_index":0},"audio":"Unit4/audio/redwood.mp3","audio_ex0":"Unit4/audio/redwood_ex0.mp3","audio_ex1":"Unit4/audio/redwood_ex1.mp3"},{"word":"cheetah","ipa":"/ˈtʃiː.tə/","image_prompts":["A cheetah sprinting across a dry savanna grassland, dust rising behind its paws, blurred motion effect","A cheetah resting under an acacia tree, its spotted coat visible, tail curled around its body"],"image_desc_en":"A cheetah sprinting across a dry savanna grassland, dust rising behind its paws, blurred motion effect","image_desc_cn":"一只猎豹在干燥的稀树草原草地上奔跑，爪子后扬起尘土，带有动态模糊效果","meaning_cn":"猎豹","usage":"n. (可数名词，复数 cheetahs)","collocations":"fast cheetah, cheetah spots, cheetah running, wild cheetah","preposition_combos":"a cheetah in the wild; the speed of a cheetah","examples":[{"en":"A cheetah can run faster than any car on the road.","cn":"猎豹比路上任何汽车跑得都快。"},{"en":"The cheetah's spots help it hide in the tall grass.","cn":"猎豹的斑点帮助它隐藏在长草丛中。"}],"socratic_questions":[{"question":"动物园里有一种动物，身上有黑色斑点，跑起来像一阵风，是陆地上速度最快的动物。它叫什么？","answer_hint":"这种动物名字发音像‘奇塔’，以速度著称。"}],"fill_blank":{"sentences":["The ___ is known as the fastest land animal on Earth."],"options":["cheetah","lion","tiger","leopard"],"correct_index":0},"audio":"Unit4/audio/cheetah.mp3","audio_ex0":"Unit4/audio/cheetah_ex0.mp3","audio_ex1":"Unit4/audio/cheetah_ex1.mp3"},{"word":"folding","ipa":"/ˈfoʊl.dɪŋ/","image_prompts":["A folding chair made of metal and fabric, collapsed and leaning against a wall in a garage","A folding map spread open on a table, with crease lines visible, next to a coffee cup"],"image_desc_en":"A folding chair made of metal and fabric, collapsed and leaning against a wall in a garage","image_desc_cn":"一把金属和布料制成的折叠椅，收拢后靠在车库的墙上","meaning_cn":"可折叠的；折叠式的","usage":"adj. (无比较级，常作定语)","collocations":"folding chair, folding table, folding bike, folding umbrella","preposition_combos":"a folding chair for camping; a folding table in the kitchen","examples":[{"en":"We brought a folding table and chairs for the picnic.","cn":"我们带了一张折叠桌和几把折叠椅去野餐。"},{"en":"My father bought a folding bike to ride to work every day.","cn":"我父亲买了一辆折叠自行车，每天骑它上班。"}],"socratic_questions":[{"question":"家里要野餐，需要带一种可以收起来、不占空间的桌子和椅子。这种桌子和椅子有什么特点？","answer_hint":"这种物品可以‘折起来’，名字里带有‘折叠’的意思。"}],"fill_blank":{"sentences":["We used a ___ table to save space in the small room."],"options":["folding","wooden","round","heavy"],"correct_index":0},"audio":"Unit4/audio/folding.mp3","audio_ex0":"Unit4/audio/folding_ex0.mp3","audio_ex1":"Unit4/audio/folding_ex1.mp3"},{"word":"folding fan","ipa":"/ˈfoʊl.dɪŋ fæn/","image_prompts":["A closed folding fan with a carved wooden handle and silk fabric, resting on a silk cloth","An open folding fan with painted bamboo and cherry blossom design, placed on a wooden desk"],"image_desc_en":"A closed folding fan with a carved wooden handle and silk fabric, resting on a silk cloth","image_desc_cn":"一把合上的折扇，带有雕刻木柄和丝绸扇面，放在一块丝绸布上","meaning_cn":"折扇","usage":"n. (可数名词，复数 folding fans)","collocations":"open a folding fan, close a folding fan, paper folding fan, silk folding fan","preposition_combos":"a folding fan with flowers; paint on a folding fan","examples":[{"en":"She opened her folding fan to cool down on the hot day.","cn":"她打开折扇，在炎热的日子里凉快一下。"},{"en":"The old man painted a beautiful mountain scene on his folding fan.","cn":"老人在他的折扇上画了一幅美丽的山景。"}],"socratic_questions":[{"question":"夏天很热，有一种可以打开和收拢的扇子，上面常常画着山水或花朵。这种扇子叫什么？","answer_hint":"这种扇子可以‘折起来’，名字由‘折叠’和‘扇子’两个词组成。"}],"fill_blank":{"sentences":["My grandmother gave me a beautiful ___ with a painting of a dragon."],"options":["folding fan","electric fan","paper fan","hand fan"],"correct_index":0},"audio":"Unit4/audio/folding_fan.mp3","audio_ex0":"Unit4/audio/folding_fan_ex0.mp3","audio_ex1":"Unit4/audio/folding_fan_ex1.mp3"},{"word":"bamboo","ipa":"/ˌbæmˈbuː/","image_prompts":["A dense bamboo forest with tall green stalks and sunlight filtering through the leaves, no people.","A set of bamboo chopsticks lying on a wooden table next to a ceramic bowl, no people."],"image_desc_en":"Tall green bamboo stalks in a forest or bamboo chopsticks on a table.","image_desc_cn":"竹林中的高大绿色竹竿，或桌上的竹筷。","meaning_cn":"竹子","usage":"n. (不可数名词，也可作可数名词表示种类)","collocations":"bamboo forest, bamboo shoots, bamboo furniture","preposition_combos":"made of bamboo, in the bamboo forest","examples":[{"en":"The panda eats fresh bamboo leaves every day in the zoo.","cn":"熊猫每天在动物园吃新鲜的竹叶。"},{"en":"My aunt bought a set of bamboo furniture for her garden.","cn":"我阿姨为她的花园买了一套竹制家具。"}],"socratic_questions":[{"question":"熊猫最爱吃的植物是什么？这种植物很坚韧，常用来做家具或筷子。","answer_hint":"这种植物是竹子，熊猫的主食，也是环保材料。"}],"fill_blank":{"sentences":["The chair is made of ___ and it feels very light."],"options":["bamboo","plastic","metal","glass"],"correct_index":0},"audio":"Unit4/audio/bamboo.mp3","audio_ex0":"Unit4/audio/bamboo_ex0.mp3","audio_ex1":"Unit4/audio/bamboo_ex1.mp3"},{"word":"yeah","ipa":"/jeə/","image_prompts":["A green checkmark inside a speech bubble on a bright yellow background, no people.","A thumbs-up emoji drawn on a whiteboard with a marker, no people."],"image_desc_en":"A green checkmark in a speech bubble or a thumbs-up emoji on a whiteboard.","image_desc_cn":"对话框中的绿色对勾，或白板上的竖大拇指表情。","meaning_cn":"是的，对（口语）","usage":"adv. (非正式，用于口语肯定回答或表示赞同)","collocations":"yeah, sure; oh yeah; yeah, right","preposition_combos":"","examples":[{"en":"Yeah, I finished my homework before dinner time.","cn":"是的，我在晚饭前完成了作业。"},{"en":"Yeah, the movie was really exciting and funny.","cn":"对，那部电影真的很刺激又搞笑。"}],"socratic_questions":[{"question":"朋友问你“明天去图书馆吗？”，你想用口语化的方式说“对”，该用什么词？","answer_hint":"这个词是 yeah，比 yes 更随意，常用于日常对话。"}],"fill_blank":{"sentences":["A: Is this your pencil? B: ___, it is mine."],"options":["Yeah","No","Maybe","Sorry"],"correct_index":0},"audio":"Unit4/audio/yeah.mp3","audio_ex0":"Unit4/audio/yeah_ex0.mp3","audio_ex1":"Unit4/audio/yeah_ex1.mp3"},{"word":"popular","ipa":"/ˈpɒpjələ(r)/","image_prompts":["A crowded library reading room with many books on shelves and a 'New Arrivals' sign, no people.","A row of colorful smartphones on a display shelf with a 'Best Seller' tag, no people."],"image_desc_en":"A crowded library with a 'New Arrivals' sign or a shelf of smartphones with a 'Best Seller' tag.","image_desc_cn":"拥挤的图书馆和‘新书’标志，或贴有‘畅销’标签的手机展示架。","meaning_cn":"流行的，受欢迎的","usage":"adj. (比较级 more popular, 最高级 most popular; 副词 popularly)","collocations":"popular with, popular song, popular culture","preposition_combos":"popular among, popular in","examples":[{"en":"This online game is very popular among teenagers in China.","cn":"这款网络游戏在中国青少年中很受欢迎。"},{"en":"The new library became popular because of its quiet study rooms.","cn":"新图书馆因为安静的自习室而变得受欢迎。"}],"socratic_questions":[{"question":"学校食堂新推出了一种牛肉面，很多同学都排队去买，这种面可以用什么形容词来描述？","answer_hint":"这个词是 popular，表示受欢迎、流行。"}],"fill_blank":{"sentences":["The singer's new album is very ___ and sells well."],"options":["popular","expensive","difficult","boring"],"correct_index":0},"audio":"Unit4/audio/popular.mp3","audio_ex0":"Unit4/audio/popular_ex0.mp3","audio_ex1":"Unit4/audio/popular_ex1.mp3"},{"word":"role","ipa":"/rəʊl/","image_prompts":["A theater stage with a spotlight on a single wooden chair and a script on the floor, no people.","A chessboard with a king piece standing alone in the center, other pieces around, no people."],"image_desc_en":"A theater stage with a spotlight on a chair and a script, or a chessboard with a king piece.","image_desc_cn":"舞台聚光灯下的椅子和剧本，或棋盘中央的国王棋子。","meaning_cn":"角色，作用","usage":"n. (可数名词；复数 roles)","collocations":"play a role, lead role, role model","preposition_combos":"role in, role as","examples":[{"en":"Trees play an important role in keeping the air clean.","cn":"树木在保持空气清洁方面起着重要作用。"},{"en":"She got the lead role in the school English play.","cn":"她在学校英语剧中获得了主角角色。"}],"socratic_questions":[{"question":"在班级话剧里，有人演公主，有人演骑士，每个人都有自己的什么？","answer_hint":"这个词是 role，指角色或职责。"}],"fill_blank":{"sentences":["Water plays a key ___ in our daily life."],"options":["role","game","song","book"],"correct_index":0},"audio":"Unit4/audio/role.mp3","audio_ex0":"Unit4/audio/role_ex0.mp3","audio_ex1":"Unit4/audio/role_ex1.mp3"},{"word":"play a role","ipa":"/pleɪ ə roʊl/","image_prompts":["A theater stage with a single spotlight shining on a wooden chair and a script lying open on the floor, empty auditorium seats in dim light","A chessboard with a white king piece standing prominently among scattered pawns, soft natural lighting from a window"],"image_desc_en":"A stage spotlight on an empty chair and script; a chess king piece on a board.","image_desc_cn":"舞台聚光灯照在空椅子和剧本上；棋盘上的国王棋子。","meaning_cn":"发挥作用；扮演角色","usage":"动词短语 (v. phrase) (过去式 played a role, 过去分词 played a role)","collocations":"play an important role, play a key role, play a leading role","preposition_combos":"play a role in","examples":[{"en":"Trees play a big role in cleaning the air around us.","cn":"树木在净化我们周围的空气方面发挥着重要作用。"},{"en":"Teamwork plays a key role in winning the basketball game.","cn":"团队合作在赢得篮球比赛中起着关键作用。"}],"socratic_questions":[{"question":"在班级话剧表演中，每个同学都有自己的任务，有的负责台词，有的负责道具。这些任务对演出都很重要，我们可以说每个任务都‘___’？","answer_hint":"强调‘起作用’或‘扮演某个部分’，用这个短语比单独用‘do’或‘act’更准确。"}],"fill_blank":{"sentences":["Water ___ an important role in our daily life."],"options":["plays","takes","makes","gives"],"correct_index":0},"audio":"Unit4/audio/play_a_role.mp3","audio_ex0":"Unit4/audio/play_a_role_ex0.mp3","audio_ex1":"Unit4/audio/play_a_role_ex1.mp3"},{"word":"pea","ipa":"/piː/","image_prompts":["A close-up of fresh green peas spilling out of an open pod on a white ceramic plate, morning sunlight","A bowl of bright green pea soup with a swirl of cream on top, wooden table background"],"image_desc_en":"Fresh green peas in an open pod on a plate; a bowl of green pea soup with cream.","image_desc_cn":"盘子中新鲜青豌豆从豆荚里滚出；一碗带奶油旋涡的青豌豆汤。","meaning_cn":"豌豆","usage":"名词 n. (复数 peas)","collocations":"green peas, pea soup, pea pod","preposition_combos":"a handful of peas, peas in a pod","examples":[{"en":"My lunch box has rice, chicken, and some green peas.","cn":"我的午餐盒里有米饭、鸡肉和一些青豌豆。"},{"en":"The soup tastes better with a few fresh peas on top.","cn":"汤上面放几颗新鲜豌豆味道更好。"}],"socratic_questions":[{"question":"妈妈做了一道菜，里面有一种小小的、圆圆的、绿色的蔬菜，吃起来有点甜。这种蔬菜是什么？","answer_hint":"这种绿色小圆球常出现在炒饭或汤里，和‘豆’有关，但比黄豆小。"}],"fill_blank":{"sentences":["She added some green ___ to the fried rice for color."],"options":["peas","beans","corn","nuts"],"correct_index":0},"audio":"Unit4/audio/pea.mp3","audio_ex0":"Unit4/audio/pea_ex0.mp3","audio_ex1":"Unit4/audio/pea_ex1.mp3"},{"word":"climate","ipa":"/ˈklaɪmət/","image_prompts":["A vast desert landscape with sand dunes under a blazing sun, no clouds in the sky","A polar landscape with icebergs floating in calm blue water under a grey sky"],"image_desc_en":"A hot desert with sand dunes and bright sun; icebergs in polar water under grey sky.","image_desc_cn":"烈日下沙丘连绵的炎热沙漠；灰色天空下漂浮着冰山的极地水域。","meaning_cn":"气候","usage":"名词 n.","collocations":"climate change, warm climate, dry climate, tropical climate","preposition_combos":"in a ... climate, climate of ...","examples":[{"en":"The climate in the north is much colder than in the south.","cn":"北方的气候比南方冷得多。"},{"en":"Many animals cannot survive in a very dry climate.","cn":"许多动物无法在非常干燥的气候中生存。"}],"socratic_questions":[{"question":"地理课上老师问：一个地区多年平均的天气状况，比如是炎热还是寒冷、干燥还是湿润，这叫什么？","answer_hint":"这个词和‘天气’不同，它描述的是长期的、稳定的气象特征。"}],"fill_blank":{"sentences":["The ___ in this area is warm and rainy all year round."],"options":["climate","weather","temperature","season"],"correct_index":0},"audio":"Unit4/audio/climate.mp3","audio_ex0":"Unit4/audio/climate_ex0.mp3","audio_ex1":"Unit4/audio/climate_ex1.mp3"},{"word":"ocean","ipa":"/ˈoʊʃən/","image_prompts":["A wide view of deep blue ocean waves rolling under a cloudy sky, no land visible on the horizon","A sandy beach with gentle waves washing ashore, seashells scattered on wet sand, distant ocean stretching to the horizon"],"image_desc_en":"Deep blue ocean waves under cloudy sky; a sandy beach with gentle waves and seashells.","image_desc_cn":"多云天空下深蓝色的海浪；沙滩上轻柔的海浪和散落的贝壳。","meaning_cn":"海洋","usage":"名词 n. (复数 oceans)","collocations":"Pacific Ocean, Atlantic Ocean, ocean pollution, ocean current","preposition_combos":"across the ocean, in the ocean, by the ocean","examples":[{"en":"The Pacific Ocean is the largest ocean on Earth.","cn":"太平洋是地球上最大的海洋。"},{"en":"We should stop throwing plastic waste into the ocean.","cn":"我们应该停止向海洋扔塑料垃圾。"}],"socratic_questions":[{"question":"暑假你去海边玩，看到一望无际的蓝色水面，远处和天空连成一条线。这片巨大的水域叫什么？","answer_hint":"比‘海’更大、更深，覆盖地球大部分表面。"}],"fill_blank":{"sentences":["The ship sailed across the ___ for three weeks."],"options":["ocean","river","lake","pool"],"correct_index":0},"audio":"Unit4/audio/ocean.mp3","audio_ex0":"Unit4/audio/ocean_ex0.mp3","audio_ex1":"Unit4/audio/ocean_ex1.mp3"},{"word":"except","ipa":"/ɪkˈsept/","image_prompts":["A group of colorful pencils on a desk, one pencil lying apart from the rest, with a shadow separating it","A plate of cookies with one cookie missing from the center, crumbs around the empty spot"],"image_desc_en":"A set of pencils with one isolated from the group, or a plate of cookies with one missing.","image_desc_cn":"一组铅笔中有一支单独分开，或一盘饼干中缺了一块。","meaning_cn":"除……之外","usage":"prep. 介词","collocations":"except for, except that, all except","preposition_combos":"except for + 名词/代词","examples":[{"en":"All the students passed the exam except Tom.","cn":"除了汤姆，所有学生都通过了考试。"},{"en":"I like all subjects except math this term.","cn":"这学期除了数学，我喜欢所有科目。"}],"socratic_questions":[{"question":"老师说全班都交了作业，但小明没交。你想说‘除了小明，大家都交了作业’，该用哪个词表示‘除了’？","answer_hint":"这个词表示排除某人或某物，常用于‘全部……除了……’的句型。"}],"fill_blank":{"sentences":["Everyone went to the park ___ John, who was sick."],"options":["except","besides","including","with"],"correct_index":0},"audio":"Unit4/audio/except.mp3","audio_ex0":"Unit4/audio/except_ex0.mp3","audio_ex1":"Unit4/audio/except_ex1.mp3"},{"word":"tiny","ipa":"/ˈtaɪni/","image_prompts":["A miniature ceramic teapot next to a full-sized teacup on a wooden table, extreme size contrast","A single grain of rice on a dark surface, photographed with macro lens showing fine texture"],"image_desc_en":"A very small teapot beside a normal cup, or a single rice grain magnified.","image_desc_cn":"一个极小的茶壶放在正常尺寸的杯子旁边，或一粒放大的米粒。","meaning_cn":"极小的；微小的","usage":"adj. (比较级 tinier, 最高级 tiniest)","collocations":"tiny house, tiny bit, tiny piece, tiny spot","preposition_combos":"tiny in size, tiny for (e.g., tiny for its age)","examples":[{"en":"There is a tiny spider in the corner of the window.","cn":"窗户角落有一只极小的蜘蛛。"},{"en":"She added just a tiny bit of sugar to her coffee.","cn":"她只在咖啡里加了一点点糖。"}],"socratic_questions":[{"question":"你在草丛里发现了一朵花，它比你的指甲盖还小，你会用什么词形容它的大小？","answer_hint":"这个词表示 '非常小'，比 small 的程度更强，常用来描述细节或迷你物品。"}],"fill_blank":{"sentences":["The kitten was so ___ that it could fit in a teacup."],"options":["tiny","big","loud","fast"],"correct_index":0},"audio":"Unit4/audio/tiny.mp3","audio_ex0":"Unit4/audio/tiny_ex0.mp3","audio_ex1":"Unit4/audio/tiny_ex1.mp3"},{"word":"lively","ipa":"/ˈlaɪvli/","image_prompts":["A bustling outdoor market with colorful fruit stalls, hanging lanterns, and people walking between stands, bright daylight","A group of colorful birds perched on a tree branch, some with wings spread, against a blue sky"],"image_desc_en":"A busy market with colorful stalls and lanterns, or birds on a branch with active poses.","image_desc_cn":"一个热闹的彩色市场挂着灯笼，或树枝上姿态活跃的彩色鸟群。","meaning_cn":"充满活力的；热闹的；生动的","usage":"adj. (比较级 livelier, 最高级 liveliest; 副词形式 livelily 较少用)","collocations":"lively discussion, lively music, lively atmosphere, lively street","preposition_combos":"lively with (e.g., lively with activity)","examples":[{"en":"The street market was lively with music and laughter.","cn":"街头市场充满了音乐和笑声，非常热闹。"},{"en":"We had a lively discussion about our favorite movies.","cn":"我们就最喜欢的电影进行了一场热烈的讨论。"}],"socratic_questions":[{"question":"你走进一个公园，看到很多人在跳舞、唱歌、放风筝，气氛非常欢乐，你会怎么形容这个场景？","answer_hint":"这个词描述充满能量和活力的状态，常用来形容气氛、讨论或音乐。"}],"fill_blank":{"sentences":["The party became more ___ when the band started playing."],"options":["lively","quiet","dark","empty"],"correct_index":0},"audio":"Unit4/audio/lively.mp3","audio_ex0":"Unit4/audio/lively_ex0.mp3","audio_ex1":"Unit4/audio/lively_ex1.mp3"},{"word":"the Arctic","ipa":"/ði ˈɑːrktɪk/","image_prompts":["A vast snowy landscape with icebergs floating in dark blue water under a pale sky, no people visible","A polar bear walking on a sheet of ice with distant mountains covered in snow, clear cold light"],"image_desc_en":"A snowy landscape with icebergs and dark water, or a polar bear on ice with snowy mountains.","image_desc_cn":"一片冰雪覆盖的景色，冰山漂浮在深蓝海面上，或一只北极熊走在冰面上，远处是雪山。","meaning_cn":"北极；北极地区","usage":"n. (专有名词，常带定冠词 the；形容词形式 Arctic)","collocations":"the Arctic Ocean, the Arctic Circle, Arctic ice, Arctic wildlife","preposition_combos":"in the Arctic, from the Arctic, to the Arctic","examples":[{"en":"The Arctic is one of the coldest places on Earth.","cn":"北极是地球上最寒冷的地方之一。"},{"en":"Many scientists study the ice melting in the Arctic.","cn":"许多科学家研究北极冰层融化。"}],"socratic_questions":[{"question":"地球的最北端是一片冰雪覆盖的区域，那里有北极熊和冰山，这个区域叫什么？","answer_hint":"这是一个地理专有名词，以 'the' 开头，指代地球顶端的寒冷地区。"}],"fill_blank":{"sentences":["Temperatures in ___ can drop below -50°C in winter."],"options":["the Arctic","the desert","the forest","the ocean"],"correct_index":0},"audio":"Unit4/audio/the_Arctic.mp3","audio_ex0":"Unit4/audio/the_Arctic_ex0.mp3","audio_ex1":"Unit4/audio/the_Arctic_ex1.mp3"},{"word":"honey","ipa":"/ˈhʌni/","image_prompts":["A glass jar filled with golden liquid honey, light shining through it onto a wooden table, no people","A close-up of a honeycomb dripping with thick golden honey onto a white plate, no insects or people"],"image_desc_en":"A jar of golden honey on a wooden surface, with a honey dipper resting beside it.","image_desc_cn":"一罐金色蜂蜜放在木桌上，旁边放着一根蜂蜜棒。","meaning_cn":"蜂蜜；亲爱的（昵称）","usage":"n. (不可数名词)","collocations":"a jar of honey, taste like honey, sweet as honey","preposition_combos":"with honey, made from honey","examples":[{"en":"I like to put a spoon of honey in my tea.","cn":"我喜欢在茶里放一勺蜂蜜。"},{"en":"This cake tastes sweet because it has honey inside.","cn":"这块蛋糕尝起来很甜，因为里面加了蜂蜜。"}],"socratic_questions":[{"question":"妈妈做蛋糕时，不想用白糖，想用一种天然的、金黄色的甜味代替品，这是什么？","answer_hint":"这是一种由蜜蜂采集花蜜制成的天然甜味物质。"}],"fill_blank":{"sentences":["The tea tastes better if you add some ___."],"options":["honey","salt","pepper","vinegar"],"correct_index":0},"audio":"Unit4/audio/honey.mp3","audio_ex0":"Unit4/audio/honey_ex0.mp3","audio_ex1":"Unit4/audio/honey_ex1.mp3"},{"word":"disappointed","ipa":"/ˌdɪsəˈpɔɪntɪd/","image_prompts":["A single wilted flower in a cracked vase on a rainy windowsill, raindrops on the glass, no people","A torn birthday card lying on a table next to an unlit candle, no people"],"image_desc_en":"A wilted flower in a cracked vase, with raindrops on a window behind it.","image_desc_cn":"一朵枯萎的花插在破裂的花瓶里，身后窗户上挂着雨滴。","meaning_cn":"失望的","usage":"adj. (形容词，常与 be/get/feel 连用)","collocations":"feel disappointed, be disappointed with, look disappointed","preposition_combos":"disappointed with/in/about","examples":[{"en":"She felt disappointed when the game was cancelled.","cn":"当比赛被取消时，她感到很失望。"},{"en":"My parents were disappointed with my test result.","cn":"我的父母对我的考试成绩感到失望。"}],"socratic_questions":[{"question":"你期待了很久的周末露营，结果因为下雨取消了。你心里是什么感觉？","answer_hint":"这个词描述的是期望落空后那种不开心、沮丧的情绪。"}],"fill_blank":{"sentences":["Tom was ___ because he didn't win the first prize."],"options":["disappointed","excited","surprised","angry"],"correct_index":0},"audio":"Unit4/audio/disappointed.mp3","audio_ex0":"Unit4/audio/disappointed_ex0.mp3","audio_ex1":"Unit4/audio/disappointed_ex1.mp3"},{"word":"connection","ipa":"/kəˈnekʃn/","image_prompts":["Two puzzle pieces fitting together perfectly on a white table, no hands or people","A network of glowing lines connecting several dots on a dark digital screen, no people"],"image_desc_en":"Two jigsaw puzzle pieces interlocking on a white surface.","image_desc_cn":"两块拼图在白色表面上完美地咬合在一起。","meaning_cn":"连接；联系；关系","usage":"n. (可数名词)","collocations":"have a connection, build a connection, lose connection","preposition_combos":"connection between, connection with/to","examples":[{"en":"There is a strong connection between exercise and health.","cn":"锻炼和健康之间有很强的联系。"},{"en":"My phone lost the connection during the call.","cn":"我的手机在通话过程中断线了。"}],"socratic_questions":[{"question":"你在写一篇关于‘友谊’的作文，想表达‘我和好朋友之间有一种特别的纽带’，可以用哪个词？","answer_hint":"这个词表示两件事或两个人之间的关联或纽带。"}],"fill_blank":{"sentences":["The Internet ___ was very slow, so I couldn't watch the video."],"options":["connection","direction","instruction","suggestion"],"correct_index":0},"audio":"Unit4/audio/connection.mp3","audio_ex0":"Unit4/audio/connection_ex0.mp3","audio_ex1":"Unit4/audio/connection_ex1.mp3"},{"word":"pollination","ipa":"/ˌpɒlɪˈneɪʃən/","image_prompts":["A close-up of a bee landing on a bright yellow sunflower, pollen grains visible on its legs, golden sunlight","A butterfly perched on a pink flower, tiny pollen particles floating in the air, soft morning light"],"image_desc_en":"A bee on a sunflower with pollen grains; a butterfly on a pink flower with floating pollen.","image_desc_cn":"一只蜜蜂在向日葵上，花粉颗粒可见；一只蝴蝶停在粉色花朵上，花粉漂浮。","meaning_cn":"授粉；传粉","usage":"n. (不可数名词)","collocations":"cross-pollination, wind pollination, insect pollination","preposition_combos":"pollination by bees, pollination of flowers","examples":[{"en":"Bees play a key role in the pollination of fruit trees.","cn":"蜜蜂在果树的授粉中起着关键作用。"},{"en":"Wind pollination is common among grasses and many trees.","cn":"风媒传粉在草类和许多树木中很常见。"}],"socratic_questions":[{"question":"春天花园里，蜜蜂在花间飞来飞去，它们其实在帮花朵完成一件重要的事，这件事叫什么？","answer_hint":"这个词和花粉、花朵繁殖有关，是蜜蜂帮助花朵的过程。"}],"fill_blank":{"sentences":["Without ___, many plants cannot produce fruits or seeds."],"options":["pollination","pollution","population","position"],"correct_index":0},"audio":"Unit4/audio/pollination.mp3","audio_ex0":"Unit4/audio/pollination_ex0.mp3","audio_ex1":"Unit4/audio/pollination_ex1.mp3"},{"word":"pollen","ipa":"/ˈpɒlən/","image_prompts":["A macro shot of a flower stamen covered in fine yellow powder, bright natural light","A glass slide under a microscope showing tiny round pollen grains, blue-tinted background"],"image_desc_en":"Yellow powder on a flower stamen; microscopic view of round pollen grains.","image_desc_cn":"花朵雄蕊上的黄色粉末；显微镜下圆形花粉颗粒的视图。","meaning_cn":"花粉","usage":"n. (不可数名词)","collocations":"pollen grains, pollen allergy, pollen count","preposition_combos":"covered with pollen, pollen from flowers","examples":[{"en":"The yellow powder on the flower is called pollen.","cn":"花上的黄色粉末叫做花粉。"},{"en":"High pollen levels can cause sneezing and itchy eyes.","cn":"高花粉水平会导致打喷嚏和眼睛发痒。"}],"socratic_questions":[{"question":"春天有些人会打喷嚏、流鼻涕，医生说是因为空气中飘着一种细小的黄色粉末，这种粉末叫什么？","answer_hint":"这个词是植物繁殖时产生的细粉，常引起过敏。"}],"fill_blank":{"sentences":["Bees collect ___ from flowers to make honey."],"options":["pollen","nectar","water","dust"],"correct_index":0},"audio":"Unit4/audio/pollen.mp3","audio_ex0":"Unit4/audio/pollen_ex0.mp3","audio_ex1":"Unit4/audio/pollen_ex1.mp3"},{"word":"action","ipa":"/ˈækʃən/","image_prompts":["A hand pressing a red emergency stop button on a machine, bright warning sign nearby","A stack of books with a sticky note reading 'Take action now!' on a wooden desk"],"image_desc_en":"A hand pressing a red stop button; a sticky note saying 'Take action now!' on books.","image_desc_cn":"一只手按下红色停止按钮；一张写着‘立即行动’的便签贴在书上。","meaning_cn":"行动；动作；行为","usage":"n. (可数/不可数名词)","collocations":"take action, action plan, in action, action movie","preposition_combos":"action against, action on","examples":[{"en":"We need to take action to protect the environment.","cn":"我们需要采取行动来保护环境。"},{"en":"His quick action saved the cat from the tree.","cn":"他的快速行动把猫从树上救了下来。"}],"socratic_questions":[{"question":"看到地上有垃圾，你弯腰捡起来扔进垃圾桶，这个具体的做法可以用哪个词概括？","answer_hint":"这个词指做某件事的具体行为或步骤，不是空想。"}],"fill_blank":{"sentences":["The firefighter's brave ___ saved many lives."],"options":["action","actor","active","actress"],"correct_index":0},"audio":"Unit4/audio/action.mp3","audio_ex0":"Unit4/audio/action_ex0.mp3","audio_ex1":"Unit4/audio/action_ex1.mp3"},{"word":"in fact","ipa":"/ɪn fækt/","image_prompts":["A whiteboard with '2+2=5' crossed out and '2+2=4' written below, red marker correction","A newspaper headline on a table: 'Myth Busted: The Truth Revealed' with a magnifying glass"],"image_desc_en":"A whiteboard with a wrong math equation corrected; a newspaper headline about truth.","image_desc_cn":"白板上被划掉的错误数学等式和正确写法；关于真相的报纸头条。","meaning_cn":"事实上；实际上","usage":"adv. phrase (副词短语，用于强调事实或纠正误解)","collocations":"in fact, ...; ... in fact","preposition_combos":"无","examples":[{"en":"He looks young, but in fact he is over forty.","cn":"他看起来年轻，但实际上他已经四十多岁了。"},{"en":"Many people think spiders are insects. In fact, they are not.","cn":"很多人认为蜘蛛是昆虫。事实上，它们不是。"}],"socratic_questions":[{"question":"有人说企鹅生活在北极，但你知道这是错的，你想纠正这个说法，可以用哪个短语开头？","answer_hint":"这个短语用来引出真实情况，通常前面的话是错的或片面的。"}],"fill_blank":{"sentences":["Some believe the earth is flat, but ___ it is round."],"options":["in fact","in short","in total","in time"],"correct_index":0},"audio":"Unit4/audio/in_fact.mp3","audio_ex0":"Unit4/audio/in_fact_ex0.mp3","audio_ex1":"Unit4/audio/in_fact_ex1.mp3"},{"word":"per cent","ipa":"/pər ˈsent/","image_prompts":["A pie chart on a whiteboard showing 75% shaded in blue, with a marker resting nearby","A digital calculator display showing the number 50 followed by a percent symbol, on a wooden desk"],"image_desc_en":"A pie chart with 75% shaded blue on a whiteboard, marker nearby; a calculator showing 50% on a wooden desk.","image_desc_cn":"白板上一个75%蓝色区域的饼图，旁边有记号笔；木桌上计算器显示50%。","meaning_cn":"百分之……","usage":"n. (常作单数) 百分比；每百中","collocations":"a large/small per cent; per cent of; 100 per cent","preposition_combos":"per cent of","examples":[{"en":"About 80 per cent of the students passed the math exam.","cn":"大约80%的学生通过了数学考试。"},{"en":"The store offers a 20 per cent discount on all shoes.","cn":"这家店所有鞋子打八折。"}],"socratic_questions":[{"question":"老师问全班有多少人完成了作业，班长说‘几乎全部，只有少数没交’。如果全班50人，48人交了，班长可以说‘交了作业的人占全班____？’","answer_hint":"表示‘每百个中有多少个’时用 per cent，这里48/50=96%，所以是96 per cent。"}],"fill_blank":{"sentences":["Only ten ___ of the population live in that area."],"options":["per cent","percent","per cent of","percentage"],"correct_index":0},"audio":"Unit4/audio/per_cent.mp3","audio_ex0":"Unit4/audio/per_cent_ex0.mp3","audio_ex1":"Unit4/audio/per_cent_ex1.mp3"},{"word":"for this reason","ipa":"/fɔːr ðɪs ˈriːzn/","image_prompts":["A cracked smartphone screen with a rain cloud drawn above it, and a sign saying 'No water nearby'","A wilted plant next to a dry watering can, with a note reading 'Forgot to water'"],"image_desc_en":"A cracked smartphone with a rain cloud drawn above and a 'No water' sign; a wilted plant beside a dry watering can with a note.","image_desc_cn":"一部屏幕碎裂的手机，上方画着雨云和‘禁止水’标志；一株枯萎植物旁边是干水壶和便条。","meaning_cn":"因此；由于这个原因","usage":"adv. phrase 连接因果关系的副词短语","collocations":"for this reason, ...; for this reason alone","preposition_combos":"无固定介词搭配","examples":[{"en":"The library is very quiet. For this reason, I often study there.","cn":"图书馆非常安静。因此，我常在那里学习。"},{"en":"He forgot his umbrella. For this reason, he got wet in the rain.","cn":"他忘了带伞，因此被雨淋湿了。"}],"socratic_questions":[{"question":"小明因为早上起晚了，错过了校车，最后迟到了。你想用一句话总结原因和结果，可以说‘他起晚了，____他迟到了。’这里该填什么短语？","answer_hint":"表示‘因为这个原因’引出结果，用 for this reason，相当于‘所以’。"}],"fill_blank":{"sentences":["The movie was boring. ___, we left early."],"options":["For this reason","Because","So that","In order to"],"correct_index":0},"audio":"Unit4/audio/for_this_reason.mp3","audio_ex0":"Unit4/audio/for_this_reason_ex0.mp3","audio_ex1":"Unit4/audio/for_this_reason_ex1.mp3"},{"word":"planet","ipa":"/ˈplænɪt/","image_prompts":["A round blue-and-green globe floating in dark space with tiny stars around it","A solar system model with eight colorful planets orbiting a yellow sun on a classroom shelf"],"image_desc_en":"A blue-green globe floating in dark starry space; a solar system model with eight planets around a yellow sun on a shelf.","image_desc_cn":"深色星空中漂浮的蓝绿色球体；书架上太阳系模型，八颗行星环绕黄色太阳。","meaning_cn":"行星；地球（常加the）","usage":"n. (可数名词) 行星","collocations":"the planet Earth; protect the planet; on the planet","preposition_combos":"on the planet; around the planet","examples":[{"en":"Earth is the third planet from the sun in our solar system.","cn":"地球是太阳系中离太阳第三近的行星。"},{"en":"We should recycle plastic to help protect the planet.","cn":"我们应该回收塑料来帮助保护地球。"}],"socratic_questions":[{"question":"在科学课上，老师展示了一张图片：一个蓝色和绿色相间的球体，周围有云层。老师说‘这是我们居住的____’，请问这个空填什么？","answer_hint":"我们居住的星球叫地球，地球是一颗行星，所以填 planet。"}],"fill_blank":{"sentences":["Mars is a red ___ in the night sky."],"options":["planet","star","moon","comet"],"correct_index":0},"audio":"Unit4/audio/planet.mp3","audio_ex0":"Unit4/audio/planet_ex0.mp3","audio_ex1":"Unit4/audio/planet_ex1.mp3"},{"word":"in order to","ipa":"/ɪn ˈɔːrdər tuː/","image_prompts":["A closed book with a bookmark sticking out, next to a cup of tea and a note saying 'Pass the test'","A pair of running shoes placed neatly beside a stopwatch on a track, with a sign reading 'Win the race'"],"image_desc_en":"A closed book with a bookmark, tea cup, and a note 'Pass the test'; running shoes beside a stopwatch on a track with a 'Win the race' sign.","image_desc_cn":"合上的书插着书签，旁边有茶杯和写着‘通过考试’的便条；跑道上跑鞋旁有秒表和‘赢得比赛’标志。","meaning_cn":"为了……（表示目的）","usage":"prep. phrase 后接动词原形，表示目的","collocations":"in order to do sth.; in order to achieve; in order to get","preposition_combos":"in order to + 动词原形","examples":[{"en":"She studies hard in order to get good grades in exams.","cn":"她努力学习，以便在考试中取得好成绩。"},{"en":"We turn off the lights in order to save electricity.","cn":"我们关灯是为了省电。"}],"socratic_questions":[{"question":"你想告诉朋友你每天早起的原因——因为你想赶上第一班公交车。你可以说‘我每天早起____赶上第一班车。’这里该填什么短语？","answer_hint":"表示‘为了’某个目的，用 in order to，后面接动词原形。"}],"fill_blank":{"sentences":["He exercises every day ___ stay healthy."],"options":["in order to","so that","because","for"],"correct_index":0},"audio":"Unit4/audio/in_order_to.mp3","audio_ex0":"Unit4/audio/in_order_to_ex0.mp3","audio_ex1":"Unit4/audio/in_order_to_ex1.mp3"},{"word":"store","ipa":"/stɔːr/","image_prompts":["A neatly arranged grocery store shelf with colorful cereal boxes and canned goods under bright fluorescent lights","A wooden storage chest in a dusty attic filled with old books and folded blankets, sunlight streaming through a small window"],"image_desc_en":"A grocery store shelf or a storage chest in an attic.","image_desc_cn":"超市货架或阁楼里的储物箱。","meaning_cn":"商店；储存","usage":"n. / v. (过去式 stored, 过去分词 stored)","collocations":"department store, grocery store, store up, store away","preposition_combos":"store in, store at","examples":[{"en":"We need to buy milk from the corner store today.","cn":"我们今天需要从街角商店买牛奶。"},{"en":"She will store her winter clothes in a big box.","cn":"她会把冬衣储存在一个大箱子里。"}],"socratic_questions":[{"question":"你想把暑假读过的旧杂志放在一个地方保存起来，这个地方叫什么？","answer_hint":"这个词既可以指买东西的地方，也可以指把东西收起来的地方。"}],"fill_blank":{"sentences":["Please ___ the leftover food in the fridge before it goes bad."],"options":["store","throw","cook","wash"],"correct_index":0},"audio":"Unit4/audio/store.mp3","audio_ex0":"Unit4/audio/store_ex0.mp3","audio_ex1":"Unit4/audio/store_ex1.mp3"},{"word":"honeycomb","ipa":"/ˈhʌniˌkoʊm/","image_prompts":["A close-up of a golden honeycomb with hexagonal wax cells dripping with honey on a wooden table","A cross-section of a beehive showing multiple layers of honeycomb structure inside a glass observation box"],"image_desc_en":"A honeycomb with hexagonal cells and dripping honey.","image_desc_cn":"带有六边形蜂巢和滴落蜂蜜的蜂巢。","meaning_cn":"蜂巢；蜂窝状物","usage":"n.","collocations":"honeycomb structure, honeycomb pattern, honeycomb of cells","preposition_combos":"honeycomb of","examples":[{"en":"The honeycomb is made of many small hexagonal cells.","cn":"蜂巢由许多小的六边形蜂室组成。"},{"en":"Bees store honey inside the honeycomb for winter.","cn":"蜜蜂把蜂蜜储存在蜂巢里过冬。"}],"socratic_questions":[{"question":"蜜蜂把蜂蜜放在一个有很多小格子的东西里，每个格子都是六边形的，这个东西叫什么？","answer_hint":"这个词听起来像“蜂蜜”和“梳子”的组合，是蜜蜂的家。"}],"fill_blank":{"sentences":["The beekeeper carefully removed the ___ from the hive."],"options":["honeycomb","honey","flower","wax"],"correct_index":0},"audio":"Unit4/audio/honeycomb.mp3","audio_ex0":"Unit4/audio/honeycomb_ex0.mp3","audio_ex1":"Unit4/audio/honeycomb_ex1.mp3"},{"word":"communicate","ipa":"/kəˈmjuːnɪkeɪt/","image_prompts":["Two smartphones on a table with glowing chat bubbles and a green call icon between them","A whiteboard covered with colorful sticky notes and arrows connecting different ideas"],"image_desc_en":"Two phones with chat bubbles or a whiteboard with sticky notes.","image_desc_cn":"两部带有聊天气泡的手机或贴满便利贴的白板。","meaning_cn":"交流；沟通","usage":"v. (过去式 communicated, 过去分词 communicated)","collocations":"communicate with, communicate ideas, communicate clearly","preposition_combos":"communicate with, communicate through","examples":[{"en":"We can communicate with friends by sending emails.","cn":"我们可以通过发送电子邮件与朋友交流。"},{"en":"Good teams communicate their ideas during meetings.","cn":"好的团队在会议中交流他们的想法。"}],"socratic_questions":[{"question":"你和朋友不在同一个城市，但你想告诉对方你最近的心情，你们可以通过什么方式传递信息？","answer_hint":"这个词表示把想法或信息传递给对方，不一定是面对面说话。"}],"fill_blank":{"sentences":["It is important to ___ clearly when working in a group."],"options":["communicate","compete","compare","complain"],"correct_index":0},"audio":"Unit4/audio/communicate.mp3","audio_ex0":"Unit4/audio/communicate_ex0.mp3","audio_ex1":"Unit4/audio/communicate_ex1.mp3"},{"word":"play a part","ipa":"/pleɪ ə pɑːrt/","image_prompts":["A theater stage with a single spotlight shining on an empty wooden chair and a script on the floor","A jigsaw puzzle with one piece being placed into the center of the completed picture"],"image_desc_en":"A stage with a spotlight and script, or a jigsaw puzzle piece being placed.","image_desc_cn":"聚光灯下的舞台和剧本，或正在拼入的拼图块。","meaning_cn":"扮演角色；起作用","usage":"v. phrase (过去式 played a part, 过去分词 played a part)","collocations":"play a part in, play an important part, play a leading part","preposition_combos":"play a part in","examples":[{"en":"Everyone should play a part in keeping the classroom clean.","cn":"每个人都应该在保持教室清洁方面发挥作用。"},{"en":"Sunlight plays a part in helping plants grow strong.","cn":"阳光在帮助植物茁壮成长方面起作用。"}],"socratic_questions":[{"question":"学校要举办环保活动，每个同学都需要做一些事情来帮助活动成功，这可以用什么短语来形容？","answer_hint":"这个短语字面意思是“扮演一个部分”，实际指参与并做出贡献。"}],"fill_blank":{"sentences":["Teamwork ___ in winning the basketball game."],"options":["plays a part","takes a break","makes a wish","has a try"],"correct_index":0},"audio":"Unit4/audio/play_a_part.mp3","audio_ex0":"Unit4/audio/play_a_part_ex0.mp3","audio_ex1":"Unit4/audio/play_a_part_ex1.mp3"},{"word":"ecosystem","ipa":"/ˈiːkəʊsɪstəm/","image_prompts":["A dense forest with sunlight filtering through leaves, a small stream flowing over rocks, moss on tree trunks, no people visible.","A coral reef underwater with colorful fish swimming among coral branches, clear blue water, sunlight rays from above, no divers or swimmers."],"image_desc_en":"A forest ecosystem with stream and moss, or a coral reef ecosystem with fish and coral.","image_desc_cn":"森林生态系统（溪流、苔藓）或珊瑚礁生态系统（鱼群、珊瑚）。","meaning_cn":"生态系统","usage":"n. (可数名词)","collocations":"marine ecosystem, forest ecosystem, fragile ecosystem, balance of the ecosystem","preposition_combos":"in an ecosystem, within the ecosystem","examples":[{"en":"The forest ecosystem provides clean air and water for all living things.","cn":"森林生态系统为所有生物提供清洁的空气和水。"},{"en":"Pollution can destroy the balance of a small pond ecosystem.","cn":"污染会破坏小池塘生态系统的平衡。"}],"socratic_questions":[{"question":"如果一片森林里的树木被砍光，河流干涸，动物离开，这个区域失去了什么？","answer_hint":"这个词指生物与环境相互作用的整体系统，森林、池塘、海洋都有它。"}],"fill_blank":{"sentences":["Every living thing plays a role in the ___ of a lake."],"options":["ecosystem","environment","climate","population"],"correct_index":0},"audio":"Unit4/audio/ecosystem.mp3","audio_ex0":"Unit4/audio/ecosystem_ex0.mp3","audio_ex1":"Unit4/audio/ecosystem_ex1.mp3"},{"word":"protect","ipa":"/prəˈtekt/","image_prompts":["A glass jar with a lid covering a small green plant inside, sunlight outside the jar, no hands or people.","A fence made of wooden posts around a patch of wildflowers in a meadow, blue sky background, no human figures."],"image_desc_en":"A jar covering a plant to protect it, or a fence protecting wildflowers.","image_desc_cn":"用玻璃罐保护植物，或用栅栏保护野花。","meaning_cn":"保护","usage":"v. (过去式 protected, 过去分词 protected)","collocations":"protect the environment, protect animals, protect from harm, protect against pollution","preposition_combos":"protect from, protect against","examples":[{"en":"We should protect the local park by picking up trash every week.","cn":"我们应该每周捡垃圾来保护当地的公园。"},{"en":"Wearing a helmet can protect your head during a bike ride.","cn":"骑自行车时戴头盔可以保护你的头部。"}],"socratic_questions":[{"question":"下雨天你出门时，雨伞的作用是什么？","answer_hint":"这个词表示让某物免受伤害或破坏，雨伞就是用来做这个的。"}],"fill_blank":{"sentences":["We must ___ the endangered animals from hunters."],"options":["protect","attack","ignore","collect"],"correct_index":0},"audio":"Unit4/audio/protect.mp3","audio_ex0":"Unit4/audio/protect_ex0.mp3","audio_ex1":"Unit4/audio/protect_ex1.mp3"},{"word":"importance","ipa":"/ɪmˈpɔːrtns/","image_prompts":["A golden trophy on a wooden pedestal with a spotlight shining on it, dark background, no people.","A stack of textbooks with a red ribbon tied around them, on a desk next to a lit lamp, no hands or persons."],"image_desc_en":"A trophy under a spotlight showing importance, or a stack of books with a ribbon symbolizing importance.","image_desc_cn":"聚光灯下的奖杯或系着丝带的书本，象征重要性。","meaning_cn":"重要性","usage":"n. (不可数名词)","collocations":"the importance of, great importance, realize the importance, stress the importance","preposition_combos":"importance of","examples":[{"en":"The teacher explained the importance of reading every day.","cn":"老师解释了每天阅读的重要性。"},{"en":"Do you understand the importance of saving water at home?","cn":"你理解在家节约用水的重要性吗？"}],"socratic_questions":[{"question":"为什么学校要反复强调按时完成作业？这个词指的是什么？","answer_hint":"这个词表示某件事很有价值、很关键，比如健康、学习、环保。"}],"fill_blank":{"sentences":["Nobody can deny the ___ of teamwork in a project."],"options":["importance","difference","distance","appearance"],"correct_index":0},"audio":"Unit4/audio/importance.mp3","audio_ex0":"Unit4/audio/importance_ex0.mp3","audio_ex1":"Unit4/audio/importance_ex1.mp3"},{"word":"title","ipa":"/ˈtaɪtl/","image_prompts":["A hardcover book lying open on a table, the word 'ADVENTURE' printed in large gold letters on the cover, no hands.","A movie poster on a wall with a large bold font reading 'THE JOURNEY', a mountain landscape behind the text, no actors or people."],"image_desc_en":"A book cover with the title 'ADVENTURE', or a movie poster with the title 'THE JOURNEY'.","image_desc_cn":"印有书名'ADVENTURE'的书封，或印有片名'THE JOURNEY'的电影海报。","meaning_cn":"标题；头衔；冠军称号","usage":"n. (可数名词)","collocations":"book title, song title, win the title, title page, title of the article","preposition_combos":"title of","examples":[{"en":"What is the title of your favorite English novel?","cn":"你最喜欢的英文小说的书名是什么？"},{"en":"Our school team won the basketball title last year.","cn":"去年我们校队赢得了篮球冠军称号。"}],"socratic_questions":[{"question":"你写了一篇作文，最上面一行写的是什么？或者比赛拿了第一名，大家叫你什么？","answer_hint":"这个词可以指文章或书的名字，也可以指冠军或头衔。"}],"fill_blank":{"sentences":["Please write a proper ___ for your essay about summer vacation."],"options":["title","name","word","sign"],"correct_index":0},"audio":"Unit4/audio/title.mp3","audio_ex0":"Unit4/audio/title_ex0.mp3","audio_ex1":"Unit4/audio/title_ex1.mp3"},{"word":"human","ipa":"/ˈhjuːmən/","image_prompts":["A pair of hands holding a glowing light bulb against a dark background, symbolizing human creativity","A silhouette of a head with gears and circuits inside, representing human intelligence and technology"],"image_desc_en":"A pair of hands holding a glowing light bulb against a dark background, symbolizing human creativity","image_desc_cn":"一双在黑暗背景中握着发光灯泡的手，象征人类的创造力","meaning_cn":"人类；人的","usage":"adj. 人的，人类的；n. 人","collocations":"human being, human nature, human rights","preposition_combos":"human of (rare), human in","examples":[{"en":"Every human has the right to clean water and fresh air.","cn":"每个人都有权享有干净的水和新鲜的空气。"},{"en":"The robot can talk and move like a real human.","cn":"这个机器人可以像真人一样说话和移动。"}],"socratic_questions":[{"question":"我们和动物最大的区别是什么？我们能用什么词来形容我们这种会思考、会创造的生命？","answer_hint":"这个词强调我们作为人的属性，区别于其他生物。"}],"fill_blank":{"sentences":["Every ___ being needs food and water to live."],"options":["human","animal","plant","machine"],"correct_index":0},"audio":"Unit4/audio/human.mp3","audio_ex0":"Unit4/audio/human_ex0.mp3","audio_ex1":"Unit4/audio/human_ex1.mp3"},{"word":"ant","ipa":"/ænt/","image_prompts":["A long line of tiny black ants carrying green leaves across a cracked pavement","A single ant standing next to a large sugar cube on a white table, showing size contrast"],"image_desc_en":"A long line of tiny black ants carrying green leaves across a cracked pavement","image_desc_cn":"一长排黑色小蚂蚁扛着绿叶穿过开裂的人行道","meaning_cn":"蚂蚁","usage":"n. 蚂蚁","collocations":"ant colony, worker ant, ant farm","preposition_combos":"ant on, ant in","examples":[{"en":"An ant can carry food many times its own body weight.","cn":"一只蚂蚁能搬运比自己身体重很多倍的食物。"},{"en":"We watched a line of ants march into their small hole.","cn":"我们看着一队蚂蚁排成行走进它们的小洞里。"}],"socratic_questions":[{"question":"有一种很小的昆虫，它们总是成群结队地搬运食物，非常勤劳。你知道是什么吗？","answer_hint":"这种昆虫很小，但力气很大，经常在地上排成一排。"}],"fill_blank":{"sentences":["The ___ is very small but can carry heavy things."],"options":["ant","bee","fly","bird"],"correct_index":0},"audio":"Unit4/audio/ant.mp3","audio_ex0":"Unit4/audio/ant_ex0.mp3","audio_ex1":"Unit4/audio/ant_ex1.mp3"},{"word":"be home to sb","ipa":"/biː həʊm tuː ˈsʌmbədi/","image_prompts":["A cozy wooden birdhouse hanging from a tree branch with a small bird sitting on the perch","A large aquarium with colorful fish swimming among coral reefs, with a sign reading 'Ocean Home'"],"image_desc_en":"A cozy wooden birdhouse hanging from a tree branch with a small bird sitting on the perch","image_desc_cn":"一个舒适的木质鸟屋挂在树枝上，一只小鸟停在栖木上","meaning_cn":"是……的家园；为……提供栖息地","usage":"短语动词，后接名词或代词","collocations":"be home to many species, be home to wildlife","preposition_combos":"be home to (固定搭配)","examples":[{"en":"This forest is home to hundreds of different kinds of birds.","cn":"这片森林是数百种不同鸟类的家园。"},{"en":"The old library is home to thousands of interesting books.","cn":"这座老图书馆是成千上万本有趣书籍的所在地。"}],"socratic_questions":[{"question":"如果我说“这个公园是很多小动物的家”，可以用哪个短语来表达“是……的家”？","answer_hint":"这个短语由三个词组成，表示某地是某人或某物的家园。"}],"fill_blank":{"sentences":["The wetland ___ many rare plants and animals."],"options":["is home to","is home of","has home to","gives home to"],"correct_index":0},"audio":"Unit4/audio/be_home_to_sb.mp3","audio_ex0":"Unit4/audio/be_home_to_sb_ex0.mp3","audio_ex1":"Unit4/audio/be_home_to_sb_ex1.mp3"},{"word":"happiness","ipa":"/ˈhæpinəs/","image_prompts":["A bright rainbow arching over a green field after a rain shower, with sunlight breaking through clouds","A stack of colorful birthday presents with ribbons and a shiny balloon floating above"],"image_desc_en":"A bright rainbow arching over a green field after a rain shower, with sunlight breaking through clouds","image_desc_cn":"一场阵雨后，明亮的彩虹横跨绿色田野，阳光穿透云层","meaning_cn":"幸福；快乐","usage":"n. 不可数名词","collocations":"true happiness, share happiness, bring happiness","preposition_combos":"happiness in, happiness with","examples":[{"en":"True happiness comes from helping others and being kind.","cn":"真正的幸福来自于帮助他人和友善待人。"},{"en":"The children's laughter filled the room with warmth and happiness.","cn":"孩子们的笑声让房间里充满了温暖和幸福。"}],"socratic_questions":[{"question":"当你收到一份期待已久的礼物，或者和朋友一起玩耍时，你心里那种暖暖的、开心的感觉叫什么？","answer_hint":"这是一个名词，描述一种积极、满足的情绪状态。"}],"fill_blank":{"sentences":["Money cannot buy true ___."],"options":["happiness","sadness","anger","fear"],"correct_index":0},"audio":"Unit4/audio/happiness.mp3","audio_ex0":"Unit4/audio/happiness_ex0.mp3","audio_ex1":"Unit4/audio/happiness_ex1.mp3"},{"word":"disappoint","ipa":"/ˌdɪsəˈpɔɪnt/","image_prompts":["A deflated birthday balloon lying on a wooden floor, creased and faded, with no party decorations nearby","A single wilted sunflower in a cracked ceramic pot, dry soil, soft gray background"],"image_desc_en":"A deflated birthday balloon on a wooden floor, creased and faded, no party decorations nearby.","image_desc_cn":"一个泄气的生日气球躺在木地板上，皱巴巴且褪色，附近没有派对装饰。","meaning_cn":"使失望；使扫兴","usage":"v. (过去式 disappointed, 过去分词 disappointed)","collocations":"disappoint someone; be disappointed with/in; disappointing result","preposition_combos":"disappoint with; disappoint in","examples":[{"en":"The low exam score might disappoint your parents.","cn":"考试分数低可能会让你的父母失望。"},{"en":"I hope the movie won't disappoint us tonight.","cn":"我希望今晚的电影不会让我们失望。"}],"socratic_questions":[{"question":"你期待了很久的生日礼物，结果打开盒子发现是空的。你心里是什么感觉？","answer_hint":"这个词表示让别人感到希望落空，常用在期待落空的场景。"}],"fill_blank":{"sentences":["The team's poor performance will ___ their coach."],"options":["disappoint","encourage","surprise","satisfy"],"correct_index":0},"audio":"Unit4/audio/disappoint.mp3","audio_ex0":"Unit4/audio/disappoint_ex0.mp3","audio_ex1":"Unit4/audio/disappoint_ex1.mp3"},{"word":"mushroom","ipa":"/ˈmʌʃruːm/","image_prompts":["A cluster of white button mushrooms on a wooden cutting board, one sliced in half showing gills","A single red mushroom with white spots growing at the base of a mossy tree trunk in a forest"],"image_desc_en":"A cluster of white button mushrooms on a wooden cutting board, one sliced in half showing gills.","image_desc_cn":"一簇白色蘑菇放在木砧板上，其中一个切半露出菌褶。","meaning_cn":"蘑菇；迅速增长","usage":"n. (可数名词) / v. (过去式 mushroomed, 过去分词 mushroomed)","collocations":"mushroom soup; mushroom growth; mushroom cloud","preposition_combos":"mushroom into; mushroom from","examples":[{"en":"We picked fresh mushrooms from the forest for dinner.","cn":"我们从森林里采了新鲜蘑菇做晚餐。"},{"en":"The small town mushroomed into a big city in ten years.","cn":"这个小镇十年间迅速发展成一个大城市。"}],"socratic_questions":[{"question":"雨后草地上突然冒出很多白色小伞状的东西，那是什么？","answer_hint":"这个词既可以指一种可食用的菌类，也可以比喻事物快速增多。"}],"fill_blank":{"sentences":["After the rain, many ___ appeared under the old tree."],"options":["mushrooms","flowers","stones","leaves"],"correct_index":0},"audio":"Unit4/audio/mushroom.mp3","audio_ex0":"Unit4/audio/mushroom_ex0.mp3","audio_ex1":"Unit4/audio/mushroom_ex1.mp3"},{"word":"ton","ipa":"/tʌn/","image_prompts":["A large industrial scale showing 1000 kilograms, with a pile of coal on a metal platform","A shipping container labeled '1 TON' sitting on a dock next to a cargo ship"],"image_desc_en":"A large industrial scale showing 1000 kilograms, with a pile of coal on a metal platform.","image_desc_cn":"一个大型工业秤显示1000公斤，金属平台上有一堆煤。","meaning_cn":"吨（重量单位）；大量","usage":"n. (可数名词)","collocations":"a ton of; tons of; metric ton; weigh a ton","preposition_combos":"ton of","examples":[{"en":"This truck can carry up to five tons of sand.","cn":"这辆卡车最多能运五吨沙子。"},{"en":"I have tons of homework to finish this weekend.","cn":"这个周末我有大量的作业要完成。"}],"socratic_questions":[{"question":"你看到一辆大卡车装满沙子，司机说这车沙子有1000公斤重。这个重量单位叫什么？","answer_hint":"这个词是重量单位，等于1000公斤，也常用来形容数量非常多。"}],"fill_blank":{"sentences":["The elephant weighs about one ___."],"options":["ton","kilogram","meter","liter"],"correct_index":0},"audio":"Unit4/audio/ton.mp3","audio_ex0":"Unit4/audio/ton_ex0.mp3","au nner.","cn":"妈妈让我把土豆切碎准备晚餐。"},{"en":"We need to cut up the old magazines for the art project.","cn":"我们需要把旧杂志剪碎来做美术项目。"}],"socratic_questions":[{"question":"做水果沙拉时，你需要把苹果和香蕉处理成小块，这个动作叫什么？","answer_hint":"把食物切成小块就是 cut up，比如 cut up the fruit。"}],"fill_blank":{"sentences":["Please ___ the onions before adding them to the pan."],"options":["cut up","mix up","clean up","pick up"],"correct_index":0},"audio":"Unit5/audio/cut_up.mp3","audio_ex0":"Unit5/audio/cut_up_ex0.mp3","audio_ex1":"Unit5/audio/cut_up_ex1.mp3"},{"word":"mix","ipa":"/mɪks/","image_prompts":["A glass bowl with flour and eggs being stirred by a wooden spoon, yellow and white swirls forming","Three different colored paints (red, blue, yellow) being poured together on a palette, creating purple and green patches"],"image_desc_en":"A glass bowl with flour and eggs stirred by a wooden spoon; three paints poured together on a palette.","image_desc_cn":"一个玻璃碗中面粉和鸡蛋被木勺搅拌；三种颜料倒在调色板上混合。","meaning_cn":"混合；搅拌","usage":"v. (过去式 mixed, 过去分词 mixed) 混合；搅拌","collocations":"mix together, mix well, mix with, mix up","preposition_combos":"mix with (与...混合), mix into (混入...中)","examples":[{"en":"Mix the flour and sugar together in a large bowl.","cn":"在一个大碗里把面粉和糖混合在一起。"},{"en":"You should mix the blue paint with a little white.","cn":"你应该把蓝色颜料和一点白色混合。"}],"socratic_questions":[{"question":"做蛋糕时，你需要把面粉、鸡蛋和糖放在一个碗里，用勺子搅匀，这个动作叫什么？","answer_hint":"把不同东西搅在一起就是 mix，比如 mix the ingredients。"}],"fill_blank":{"sentences":["___ the eggs and milk together before adding flour."],"options":["Mix","Cut","Bake","Fry"],"correct_index":0},"audio":"Unit5/audio/mix.mp3","audio_ex0":"Unit5/audio/mix_ex0.mp3","audio_ex1":"Unit5/audio/mix_ex1.mp3"},{"word":"bake","ipa":"/beɪk/","image_prompts":["A tray of golden-brown cookies inside a glass oven door, heat waves visible above the tray","A loaf of bread with a crispy crust sitting on a wire cooling rack, steam rising from the cut side"],"image_desc_en":"A tray of golden cookies inside an oven with he ashed bananas with brown sugar, banana chunks breaking apart, kitchen counter background"],"image_desc_en":"A potato masher pressing into boiled potatoes in a bowl, creating soft mash with steam.","image_desc_cn":"一个土豆捣碎器压入碗中的煮土豆，形成柔软的土豆泥，冒着蒸汽。","meaning_cn":"捣碎；捣成泥状","usage":"v. (过去式 mashed, 过去分词 mashed)","collocations":"mash potatoes, mash bananas, mash garlic","preposition_combos":"mash into, mash with","examples":[{"en":"I will mash the boiled potatoes for dinner tonight.","cn":"今晚我会把煮熟的土豆捣成泥做晚餐。"},{"en":"She used a fork to mash the soft bananas quickly.","cn":"她用叉子快速捣碎软香蕉。"}],"socratic_questions":[{"question":"你想做土豆泥当配菜，需要把煮软的土豆变成泥状，该用什么动作？","answer_hint":"这个动作是把固体食物压碎成泥，不是切或搅拌。"}],"fill_blank":{"sentences":["Please ___ the cooked carrots into a smooth puree."],"options":["mash","slice","fry","boil"],"correct_index":0},"audio":"Unit5/audio/mash.mp3","audio_ex0":"Unit5/audio/mash_ex0.mp3","audio_ex1":"Unit5/audio/mash_ex1.mp3"},{"word":"mashed","ipa":"/mæʃt/","image_prompts":["A white plate with a scoop of golden mashed potatoes, a pat of butter melting on top, parsley garnish, soft texture visible","A glass bowl filled with mashed avocado, lime juice drizzled on top, green creamy consistency, wooden table setting"],"image_desc_en":"A plate of golden mashed potatoes with melting butter and parsley.","image_desc_cn":"一盘金色土豆泥，上面有融化的黄油和欧芹。","meaning_cn":"捣碎的；成泥状的","usage":"adj. (由动词 mash 的过去分词转化而来)","collocations":"mashed potatoes, mashed avocado, mashed sweet potato","preposition_combos":"mashed with, mashed into","examples":[{"en":"Mashed potatoes are a popular side dish at Thanksgiving.","cn":"土豆泥是感恩节很受欢迎的配菜。"},{"en":"She spread mashed avocado on whole wheat toast for breakfast.","cn":"她把牛油果泥涂在全麦吐司上当早餐。"}],"socratic_questions":[{"question":"你看到一碗金黄色的、软软的、没有块状的食物，是用土豆做的，它是什么状态？","answer_hint":"这个形容词描述食物被捣碎后的状态，不是整块的。"}],"fill_blank":{"sentences":["My favorite side dish is ___ potatoes with gravy."],"options":["mashed","fried","baked","roasted"],"correct_index":0} 们去远足前请把水瓶装满。"},{"en":"She needs to fill the application form carefully.","cn":"她需要仔细填写申请表。"}],"socratic_questions":[{"question":"你的水壶空了，出发前你要做什么让水壶不再空？","answer_hint":"这个动作是把东西放进去直到容器不再空，不是倒掉或清空。"}],"fill_blank":{"sentences":["Could you ___ my cup with hot tea, please?"],"options":["fill","empty","wash","break"],"correct_index":0},"audio":"Unit5/audio/fill.mp3","audio_ex0":"Unit5/audio/fill_ex0.mp3","audio_ex1":"Unit5/audio/fill_ex1.mp3"},{"word":"sweetness","ipa":"/ˈswiːtnəs/","image_prompts":["A jar of golden honey dripping onto a slice of white bread, soft morning light","A bowl of ripe strawberries with sugar crystals scattered on a wooden table"],"image_desc_en":"A jar of honey dripping onto bread; a bowl of strawberries with sugar.","image_desc_cn":"一罐蜂蜜滴在面包上；一碗撒了糖的草莓。","meaning_cn":"n. 甜；甜蜜；芬芳；悦耳","usage":"n. (不可数名词)","collocations":"the sweetness of...; natural sweetness; add sweetness","preposition_combos":"sweetness of (sth.)","examples":[{"en":"The sweetness of the cake comes from fresh fruit, not sugar.","cn":"蛋糕的甜味来自新鲜水果，而不是糖。"},{"en":"She remembered the sweetness of her grandmother's smile.","cn":"她记得祖母笑容中的甜蜜。"}],"socratic_questions":[{"question":"你咬了一口刚摘的草莓，嘴里那种美好的味道叫什么？","answer_hint":"这个词和‘甜’有关，是名词形式，形容味道或感觉。"}],"fill_blank":{"sentences":["The ___ of the orange juice made me smile."],"options":["sweetness","sourness","bitterness","saltiness"],"correct_index":0},"audio":"Unit5/audio/sweetness.mp3","audio_ex0":"Unit5/audio/sweetness_ex0.mp3","audio_ex1":"Unit5/audio/sweetness_ex1.mp3"},{"word":"college","ipa":"/ˈkɒlɪdʒ/","image_prompts":["A red brick building with a clock tower and a green lawn in front, autumn leaves on the ground","A library interior with tall bookshelves and a large wooden reading table"],"image_desc_en":"A red brick building with a clock tower; a library with tall bookshelves.","image_desc_cn":"一座带钟楼的红砖建筑；一个高书架图书馆。","meaning_cn":"n. 大学；学院","usage":"n. (可数名词)","collocations":"go to college; college student; college life; college entrance exam","preposition_combos":"at college; in college; college of (subject)","examples":[{"en":"My sister plans to go to college after she finishes high school.","cn":"我姐姐计划高中毕业后上大学。"},{"en":"The college library opens from 8 a.m. to 10 p.m. every day.","cn":"大学图书馆每天从早上8点开到晚上10点。"}],"socratic_questions":[{"question":"你高中毕业后，想继续读书的地方叫什么？那里有图书馆、教学楼和宿舍。","answer_hint":"这个词指高等教育机构，比高中高一级。"}],"fill_blank":{"sentences":["After high school, he will go to ___ to study engineering."],"options":["college","hospital","factory","museum"],"correct_index":0},"audio":"Unit5/audio/college.mp3","audio_ex0":"Unit5/audio/college_ex0.mp3","audio_ex1":"Unit5/audio/college_ex1.mp3"},{"word":"host","ipa":"/həʊst/","image_prompts":["A dinner table set with plates and candles, a name card reading 'Host' at one seat","A microphone on a stage with a spotlight, empty chairs in front"],"image_desc_en":"A dinner table with a 'Host' name card; a microphone on a stage under a spotlight.","image_desc_cn":"一张有‘Host’名牌的餐桌；聚光灯下舞台上的麦克风。","meaning_cn":"n. 主人；主持人 v. (过去式 hosted, 过去分词 hosted) 主持；主办","usage":"n. (可数名词) / v. (及物动词)","collocations":"host a party; host a show; host country; host family","preposition_combos":"host of (event); host for (sb.)","examples":[{"en":"Our school will host a science fair next Friday afternoon.","cn":"我们学校将在下周五下午举办一场科学展览。"},{"en":"The host welcomed all the guests with a warm smile.","cn":"主人用温暖的微笑欢迎所有客人。"}],"socratic_questions":[{"question":"你邀请朋友来家里开生日派对，你负责准备食物和游戏，这时你是什么角色？","answer_hint":"这个词指组织活动并招待别人的人，可以是个人或机构。"}],"fill_blank":{"sentences":["Our city will ___ the international sports competition next year."],"options":["host","visit","leave","close"],"correct_index":0},"audio":"Unit5/audio/host.mp3","audio_ex0":"Unit5/audio/host_ex0.mp3","audio_ex1":"Unit5/audio/host_ex1.mp3"},{"word":"hostess","ipa":"/ˈhəʊstəs/","image_prompts":["A welcome desk with a vase of flowers and a sign reading 'Hostess' in a restaurant entrance","A tea set on a lace tablecloth with a small card saying 'Hostess' next to a teapot"],"image_desc_en":"A welcome desk with a 'Hostess' sign and flowers; a tea set with a 'Hostess' card.","image_desc_cn":"一张带‘Hostess’标志和鲜花的迎宾台；一套茶具旁有‘Hostess’卡片。","meaning_cn":"n. 女主人；女主持人","usage":"n. (可数名词)","collocations":"air hostess; hostess gift; hostess at a party","preposition_combos":"hostess of (event); hostess for (group)","examples":[{"en":"The hostess showed us to our seats and offered us drinks.","cn":"女主人带我们就座，并给我们提供了饮料。"},{"en":"My aunt worked as an air hostess for five years before retiring.","cn":"我姑姑退休前当了五年空姐。"}],"socratic_questions":[{"question":"在一家餐厅门口，一位女士微笑着迎接你并带你到餐桌，她是什么职位？","answer_hint":"这个词是‘host’的女性形式，指接待客人的女性。"}],"fill_blank":{"sentences":["The ___ greeted the guests at the door and handed them menus."],"options":["hostess","doctor","teacher","driver"],"correct_index":0},"audio":"Unit5/audio/hostess.mp3","audio_ex0":"Unit5/audio/hostess_ex0.mp3","audio_ex1":"Unit5/audio/hostess_ex1.mp3"},{"word":"recipe","ipa":"/ˈresɪpi/","image_prompts":["A handwritten recipe card on a wooden table, ingredients listed with measurements, a jar of flour and a whisk beside it","An open cookbook on a kitchen counter, a page showing a recipe for chocolate cake with step-by-step instructions and a photo of the cake"],"image_desc_en":"A recipe card or cookbook page showing ingredients and instructions for cooking.","image_desc_cn":"一张食谱卡片或烹饪书页，展示食材和烹饪步骤。","meaning_cn":"食谱；烹饪法；秘诀","usage":"n. (可数名词，复数 recipes)","collocations":"follow a recipe, a recipe for success, secret recipe","preposition_combos":"recipe for (e.g., a recipe for cookies)","examples":[{"en":"My grandmother gave me her secret recipe for apple pie.","cn":"我奶奶给了我她做苹果派的秘方。"},{"en":"You need to follow the recipe carefully to make good bread.","cn":"你需要仔细按照食谱才能做出好面包。"}],"socratic_questions":[{"question":"你想做一道妈妈拿手的菜，但不知道放多少盐和糖，你需要找什么来参考？","answer_hint":"这个词是写满食材和步骤的纸或书，不是调料本身。"}],"fill_blank":{"sentences":["To make this cake, you must follow the ___ exactly."],"options":["recipe","cream","crust","mixture"],"correct_index":0},"audio":"Unit5/audio/recipe.mp3","audio_ex0":"Unit5/audio/recipe_ex0.mp3","audio_ex1":"Unit5/audio/recipe_ex1.mp3"},{"word":"cream","ipa":"/kriːm/","image_prompts":["A bowl of thick white cream being poured from a ceramic pitcher, soft swirls on the surface","A dollop of whipped cream on top of a slice of strawberry cake, glossy texture"],"image_desc_en":"Thick white or off-white dairy product, often used in desserts or coffee.","image_desc_cn":"浓稠的白色或米白色乳制品，常用于甜点或咖啡。","meaning_cn":"奶油；乳脂；面霜","usage":"n. (不可数名词，但可指种类时用 creams)","collocations":"whipped cream, ice cream, face cream, cream cheese","preposition_combos":"cream of (e.g., cream of mushroom soup)","examples":[{"en":"She added a spoonful of cream to her hot coffee.","cn":"她往热咖啡里加了一勺奶油。"},{"en":"This face cream keeps my skin soft in winter.","cn":"这款面霜让我的皮肤在冬天保持柔软。"}],"socratic_questions":[{"question":"你喝热巧克力时，想在表面加一层白色的、甜甜的奶制品，它叫什么？","answer_hint":"这个词是白色的、脂肪含量高的奶制品，不是牛奶也不是黄油。"}],"fill_blank":{"sentences":["Would you like some whipped ___ on your hot chocolate?"],"options":["cream","recipe","crust","mixture"],"correct_index":0},"audio":"Unit5/audio/cream.mp3","audio_ex0":"Unit5/audio/cream_ex0.mp3","audio_ex1":"Unit5/audio/cream_ex1.mp3"},{"word":"crust","ipa":"/krʌst/","image_prompts":["A freshly baked pizza with a golden-brown outer edge, crispy texture visible","A slice of bread showing a hard brown outer layer and soft white inside"],"image_desc_en":"The hard outer layer of bread, pizza, or pie.","image_desc_cn":"面包、披萨或馅饼的硬外皮。","meaning_cn":"面包皮；馅饼皮；地壳","usage":"n. (可数名词，复数 crusts)","collocations":"pizza crust, pie crust, earth's crust, bread crust","preposition_combos":"crust of (e.g., crust of the earth)","examples":[{"en":"The pizza crust was crispy and golden brown.","cn":"披萨的外皮酥脆且呈金棕色。"},{"en":"Some children don't like to eat the bread crust.","cn":"有些孩子不喜欢吃面包皮。"}],"socratic_questions":[{"question":"你吃披萨时，最外面那一圈硬硬的、烤得焦黄的部分叫什么？"
