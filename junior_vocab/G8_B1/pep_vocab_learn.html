,"answer_hint":"这个词是面包或馅饼的外层硬皮，不是里面的馅料。"}],"fill_blank":{"sentences":["The ___ of this apple pie is flaky and buttery."],"options":["crust","cream","recipe","mixture"],"correct_index":0},"audio":"Unit5/audio/crust.mp3","audio_ex0":"Unit5/audio/crust_ex0.mp3","audio_ex1":"Unit5/audio/crust_ex1.mp3"},{"word":"mixture","ipa":"/ˈmɪkstʃər/","image_prompts":["A glass bowl containing a brown batter with flour, eggs, and chocolate chips visible, a whisk resting on the edge","A jar of mixed nuts and dried fruits, different colors and shapes combined"],"image_desc_en":"A combination of different substances or ingredients blended together.","image_desc_cn":"不同物质或成分混合在一起的组合物。","meaning_cn":"混合物；混合体","usage":"n. (可数名词，复数 mixtures)","collocations":"a mixture of, chemical mixture, cake mixture, cough mixture","preposition_combos":"mixture of (e.g., a mixture of sugar and water)","examples":[{"en":"The cake mixture should be smooth with no lumps.","cn":"蛋糕混合物应该顺滑没有结块。"},{"en":"This drink is a mixture of orange juice and soda water.","cn":"这种饮料是橙汁和苏打水的混合物。"}],"socratic_questions":[{"question":"你把面粉、鸡蛋、糖和水放在一个碗里搅匀后，碗里变成了什么？","answer_hint":"这个词是多种东西混在一起后的整体，不是单一成分。"}],"fill_blank":{"sentences":["Pour the ___ of flour and eggs into the baking pan."],"options":["mixture","cream","crust","recipe"],"correct_index":0},"audio":"Unit5/audio/mixture.mp3","audio_ex0":"Unit5/audio/mixture_ex0.mp3","audio_ex1":"Unit5/audio/mixture_ex1.mp3"},{"word":"least","ipa":"/liːst/","image_prompts":["A single small coin on an empty wooden table, bright spotlight highlighting its isolation","A tiny drop of water on a dry leaf, surrounded by cracked earth, minimal moisture visible"],"image_desc_en":"A single small coin on an empty wooden table, bright spotlight highlighting its isolation","image_desc_cn":"一枚小硬币孤零零地放在空木桌上，聚光灯照亮其孤立感","meaning_cn":"最少的；最小的；最不重要的","usage":"adj. (little的最高级) / adv. (修饰形容词或动词，表示程度最低)","collocations":"at least, least of all, not least","preposition_combos":"least of (all)","examples":[{"en":"This is the least difficult math problem in the test.","cn":"这是考试中最不难的数学题。"},{"en":"She chose the least expensive gift for her friend.","cn":"她给朋友选了最不贵的礼物。"}],"socratic_questions":[{"question":"小明有三个苹果，小红有两个，小刚有一个。谁拥有的苹果数量最少？","answer_hint":"这个词表示数量或程度上的最小值，与‘最多’相反。"}],"fill_blank":{"sentences":["Of all the subjects, I like history the ___."],"options":["most","least","best","more"],"correct_index":1},"audio":"Unit5/audio/least.mp3","audio_ex0":"Unit5/audio/least_ex0.mp3","audio_ex1":"Unit5/audio/least_ex1.mp3"},{"word":"at least","ipa":"/æt liːst/","image_prompts":["A kitchen timer showing 5 minutes on a countertop next to a half-filled water glass","A thermometer on a wall reading 10 degrees Celsius, with frost on window edges"],"image_desc_en":"A kitchen timer showing 5 minutes on a countertop next to a half-filled water glass","image_desc_cn":"厨房计时器显示5分钟，旁边放着一杯半满的水","meaning_cn":"至少；起码（表示最低限度）","usage":"adv. phrase (固定短语，用于强调最低数量或程度)","collocations":"at least once, at least try, at least know","preposition_combos":"无","examples":[{"en":"You should drink at least eight glasses of water every day.","cn":"你每天至少应该喝八杯水。"},{"en":"The homework will take at least one hour to finish.","cn":"这份作业至少需要一小时才能完成。"}],"socratic_questions":[{"question":"老师要求每天背10个单词，但小华只背了5个。老师对小华说：‘你___要背完一半吧。’这里该用什么短语？","answer_hint":"这个短语表示最低要求或数量底线，常用于建议或批评。"}],"fill_blank":{"sentences":["We need ___ three people to carry this heavy box."],"options":["at least","at most","less than","more than"],"correct_index":0},"audio":"Unit5/audio/at_least.mp3","audio_ex0":"Unit5/audio/at_least_ex0.mp3","audio_ex1":"Unit5/audio/at_least_ex1.mp3"},{"word":"secret","ipa":"/ˈsiːkrɪt/","image_prompts":["A closed wooden chest with a rusty lock on a dusty attic floor, cobwebs around","A folded note tucked inside a hollow book on a library shelf, only corner visible"],"image_desc_en":"A closed wooden chest with a rusty lock on a dusty attic floor, cobwebs around","image_desc_cn":"一个带锈锁的封闭木箱放在布满灰尘的阁楼地板上，周围有蜘蛛网","meaning_cn":"秘密；秘诀；机密的","usage":"n. (可数名词) / adj. (形容词，修饰名词)","collocations":"keep a secret, secret plan, secret place, top secret","preposition_combos":"secret about, secret from","examples":[{"en":"Can you keep a secret about the surprise party?","cn":"你能保守关于惊喜派对的秘密吗？"},{"en":"She wrote her secret wish on a small piece of paper.","cn":"她把秘密愿望写在一张小纸条上。"}],"socratic_questions":[{"question":"小丽在日记本里写了一件事，不想让任何人知道。这件事对她来说是什么？","answer_hint":"这个词指不公开、只有自己或少数人知道的信息。"}],"fill_blank":{"sentences":["He told me a ___ about the birthday gift."],"options":["secret","story","joke","fact"],"correct_index":0},"audio":"Unit5/audio/secret.mp3","audio_ex0":"Unit5/audio/secret_ex0.mp3","audio_ex1":"Unit5/audio/secret_ex1.mp3"},{"word":"according","ipa":"/əˈkɔːrdɪŋ/","image_prompts":["A calendar on a wall with a red circle around a date, next to a note that says 'schedule'","A thermometer showing 30°C with a weather forecast chart in the background"],"image_desc_en":"A calendar with a circled date and a note reading 'schedule' on a wall; a thermometer at 30°C with a weather chart behind it.","image_desc_cn":"墙上日历中圈出的日期和写着“日程”的便签；温度计显示30°C，背景是天气预报图。","meaning_cn":"根据；按照","usage":"adv. (常用于 according to 短语中)","collocations":"according to, according as","preposition_combos":"according to + 名词/代词","examples":[{"en":"According to the map, the library is on the left.","cn":"根据地图，图书馆在左边。"},{"en":"We will start the game according to the rules.","cn":"我们将按照规则开始比赛。"}],"socratic_questions":[{"question":"老师让你按照课本第20页的内容完成作业，你会用哪个词表示‘按照’？","answer_hint":"这个词常和to连用，表示依据某信息或规则。"}],"fill_blank":{"sentences":["___ the weather report, it will rain tomorrow."],"options":["According to","Because of","Instead of","Thanks to"],"correct_index":0},"audio":"Unit5/audio/according.mp3","audio_ex0":"Unit5/audio/according_ex0.mp3","audio_ex1":"Unit5/audio/according_ex1.mp3"},{"word":"whenever","ipa":"/wenˈevər/","image_prompts":["A clock showing 3:00 PM with a note 'snack time' attached to it","A light switch with a sign that says 'turn on when dark'"],"image_desc_en":"A clock at 3:00 PM with a note reading 'snack time'; a light switch with a sign saying 'turn on when dark'.","image_desc_cn":"显示下午3点的时钟，附有写着“零食时间”的便签；一个电灯开关，旁边标牌写着“天黑时打开”。","meaning_cn":"无论何时；每当","usage":"conj. (连词，引导时间状语从句)","collocations":"whenever possible, whenever you like","preposition_combos":"无固定介词搭配","examples":[{"en":"You can call me whenever you need help.","cn":"无论何时你需要帮助，都可以给我打电话。"},{"en":"Whenever I see a rainbow, I feel happy.","cn":"每当我看到彩虹，我就感到开心。"}],"socratic_questions":[{"question":"你想告诉朋友‘任何时候你想来我家都可以’，用哪个词表示‘任何时候’？","answer_hint":"这个词由‘when’和‘ever’组成，表示‘无论何时’。"}],"fill_blank":{"sentences":["___ you visit the city, you will find something new."],"options":["Whenever","Wherever","However","Whatever"],"correct_index":0},"audio":"Unit5/audio/whenever.mp3","audio_ex0":"Unit5/audio/whenever_ex0.mp3","audio_ex1":"Unit5/audio/whenever_ex1.mp3"},{"word":"item","ipa":"/ˈaɪtəm/","image_prompts":["A shopping cart filled with various groceries like apples, bread, and milk","A list on a clipboard with checkboxes next to words like 'tent', 'sleeping bag', 'flashlight'"],"image_desc_en":"A shopping cart with apples, bread, and milk; a clipboard checklist with 'tent', 'sleeping bag', 'flashlight' checked off.","image_desc_cn":"装满苹果、面包和牛奶的购物车；一个带复选框的清单，上面有‘帐篷’、‘睡袋’、‘手电筒’等已勾选项。","meaning_cn":"物品；项目；条款","usage":"n. (可数名词，复数 items)","collocations":"menu item, news item, item of clothing","preposition_combos":"item on + 列表/菜单","examples":[{"en":"Please check each item on the shopping list.","cn":"请核对购物清单上的每一项。"},{"en":"This item is on sale for only five dollars.","cn":"这件物品特价仅售五美元。"}],"socratic_questions":[{"question":"你在超市购物时，收银员扫描了每一样东西，这些‘东西’用哪个词表示？","answer_hint":"这个词可以指清单上的一个条目或一件具体的商品。"}],"fill_blank":{"sentences":["The first ___ on the menu is a hamburger."],"options":["item","food","drink","price"],"correct_index":0},"audio":"Unit5/audio/item.mp3","audio_ex0":"Unit5/audio/item_ex0.mp3","audio_ex1":"Unit5/audio/item_ex1.mp3"},{"word":"spaghetti","ipa":"/spəˈɡeti/","image_prompts":["A plate of spaghetti with tomato sauce and a fork twirling the noodles","A pot of boiling water with spaghetti sticks sticking out of the pot"],"image_desc_en":"A plate of spaghetti with red tomato sauce, a fork twirling the noodles; a pot of boiling water with spaghetti sticks protruding.","image_desc_cn":"一盘淋着番茄酱的意大利面，叉子卷起面条；一锅沸水中露出几根意大利面条。","meaning_cn":"意大利面","usage":"n. (不可数名词)","collocations":"spaghetti bolognese, spaghetti with meatballs, cook spaghetti","preposition_combos":"spaghetti with + 配料","examples":[{"en":"My favorite food is spaghetti with meatballs.","cn":"我最喜欢的食物是意大利肉丸面。"},{"en":"We need to boil the spaghetti for ten minutes.","cn":"我们需要将意大利面煮十分钟。"}],"socratic_questions":[{"question":"你在餐厅点了一份长条形的、蘸着番茄酱的面食，这道菜叫什么？","answer_hint":"这是一种意大利面食，通常和酱料一起食用，名字以‘spa’开头。"}],"fill_blank":{"sentences":["Mom cooked ___ for dinner last night."],"options":["spaghetti","noodles","rice","bread"],"correct_index":0},"audio":"Unit5/audio/spaghetti.mp3","audio_ex0":"Unit5/audio/spaghetti_ex0.mp3","audio_ex1":"Unit5/audio/spaghetti_ex1.mp3"},{"word":"spoon","ipa":"/spuːn/","image_prompts":["A metal spoon resting in a bowl of hot soup, steam rising above the bowl, soft kitchen lighting","A wooden spoon next to a mixing bowl with flour and eggs on a marble countertop"],"image_desc_en":"A metal spoon in a soup bowl with steam; a wooden spoon beside a mixing bowl with ingredients.","image_desc_cn":"汤碗里的一把金属勺，冒着热气；木勺放在搅拌碗旁，碗里有面粉和鸡蛋。","meaning_cn":"n. 勺，调羹","usage":"n. (复数 spoons)","collocations":"a spoon of sugar, stir with a spoon, wooden spoon","preposition_combos":"spoon for soup, spoon in the cup","examples":[{"en":"I need a spoon to eat my yogurt.","cn":"我需要一把勺子吃酸奶。"},{"en":"She put a spoon of honey into the tea.","cn":"她往茶里放了一勺蜂蜜。"}],"socratic_questions":[{"question":"你喝汤时，手里会拿什么餐具来舀汤？","answer_hint":"这个餐具通常有圆形的头部和长柄，用来舀液体或半固体食物。"}],"fill_blank":{"sentences":["Could you pass me a ___ for the soup?"],"options":["spoon","fork","knife","plate"],"correct_index":0},"audio":"Unit5/audio/spoon.mp3","audio_ex0":"Unit5/audio/spoon_ex0.mp3","audio_ex1":"Unit5/audio/spoon_ex1.mp3"},{"word":"slice","ipa":"/slaɪs/","image_prompts":["A single slice of bread on a cutting board, crumbs scattered around, morning sunlight from a window","A slice of watermelon with seeds visible, resting on a green plate, bright outdoor light"],"image_desc_en":"A bread slice on a cutting board with crumbs; a watermelon slice on a green plate.","image_desc_cn":"砧板上的一片面包，周围有面包屑；绿色盘子里的一片西瓜，籽清晰可见。","meaning_cn":"n. 片，薄片；v. 切（片）","usage":"n. (复数 slices); v. (过去式 sliced, 过去分词 sliced)","collocations":"a slice of pizza, slice the cake, thin slice","preposition_combos":"slice of bread, slice into pieces","examples":[{"en":"He ate a slice of cheese for breakfast.","cn":"他早餐吃了一片奶酪。"},{"en":"Please slice the apple into small pieces.","cn":"请把苹果切成小片。"}],"socratic_questions":[{"question":"你过生日时，蛋糕被切成了好几块，每一块叫什么？","answer_hint":"这个词表示从整体上切下来的一小部分，通常是扁平的形状。"}],"fill_blank":{"sentences":["Can I have another ___ of bread?"],"options":["slice","piece","cup","bowl"],"correct_index":0},"audio":"Unit5/audio/slice.mp3","audio_ex0":"Unit5/audio/slice_ex0.mp3","audio_ex1":"Unit5/audio/slice_ex1.mp3"},{"word":"couple","ipa":"/ˈkʌpəl/","image_prompts":["Two coffee mugs sitting side by side on a wooden table, steam rising from both, cozy cafe setting","A pair of bicycles parked together under a tree in a park, autumn leaves on the ground"],"image_desc_en":"Two coffee mugs side by side on a table; two bicycles parked together under a tree.","image_desc_cn":"桌上并排放着的两个咖啡杯，冒着热气；树下停在一起的两辆自行车，地上有秋叶。","meaning_cn":"n. 一对，两个；夫妇","usage":"n. (复数 couples)","collocations":"a couple of days, a married couple, a couple of friends","preposition_combos":"a couple of minutes, couple with","examples":[{"en":"I will finish the work in a couple of hours.","cn":"我将在几个小时内完成工作。"},{"en":"The couple walked along the beach together.","cn":"那对夫妇一起沿着海滩散步。"}],"socratic_questions":[{"question":"你想说“两三个苹果”时，可以用哪个词来表示“两三个”？","answer_hint":"这个词可以表示数量上的“两个”或“几个”，也常用来指代一对伴侣。"}],"fill_blank":{"sentences":["We stayed there for a ___ of weeks."],"options":["couple","pair","few","double"],"correct_index":0},"audio":"Unit5/audio/couple.mp3","audio_ex0":"Unit5/audio/couple_ex0.mp3","audio_ex1":"Unit5/audio/couple_ex1.mp3"},{"word":"island","ipa":"/ˈaɪlənd/","image_prompts":["A small green island surrounded by blue ocean water, white sandy beach visible, clear sky","A tropical island with palm trees and a single hut, calm sea waves lapping the shore"],"image_desc_en":"A green island in blue ocean with sandy beach; a tropical island with palm trees and a hut.","image_desc_cn":"蓝色海洋中的绿色小岛，有白色沙滩；热带岛屿上有棕榈树和一间小屋，海浪轻拍海岸。","meaning_cn":"n. 岛，岛屿","usage":"n. (复数 islands)","collocations":"a desert island, on the island, island nation","preposition_combos":"island in the sea, island off the coast","examples":[{"en":"They took a boat to the small island.","cn":"他们乘船去了那个小岛。"},{"en":"There is a lighthouse on the island.","cn":"岛上有一座灯塔。"}],"socratic_questions":[{"question":"如果你想去一个四面环水、需要坐船才能到达的地方，那是什么地方？","answer_hint":"这个词指被水完全包围的陆地，面积通常比大陆小。"}],"fill_blank":{"sentences":["The ship stopped at a small ___ in the Pacific."],"options":["island","beach","mountain","river"],"correct_index":0},"audio":"Unit5/audio/island.mp3","audio_ex0":"Unit5/audio/island_ex0.mp3","audio_ex1":"Unit5/audio/island_ex1.mp3"},{"word":"wife","ipa":"/waɪf/","image_prompts":["A wedding ring on a wooden table next to a framed photo of a couple, soft morning light","Two coffee mugs on a kitchen counter with a handwritten note saying 'Thank you', warm lighting"],"image_desc_en":"A wedding ring and a framed photo of a couple on a table; two coffee mugs with a handwritten note on a kitchen counter.","image_desc_cn":"桌上放着一枚婚戒和一张夫妻相框照片；厨房台面上有两个咖啡杯和一张写着‘谢谢’的手写便条。","meaning_cn":"妻子；太太","usage":"n. (可数名词，复数 wives)","collocations":"husband and wife, my wife, his wife, a devoted wife","preposition_combos":"wife of (someone)","examples":[{"en":"My wife and I often take a walk after dinner.","cn":"我和妻子经常晚饭后散步。"},{"en":"His wife bought a new dress for the party.","cn":"他妻子为派对买了一条新裙子。"}],"socratic_questions":[{"question":"小明在作文里写‘我的妈妈和爸爸很恩爱’，如果他想提到‘爸爸的伴侣’这个身份，应该用哪个词？","answer_hint":"这个词指已婚女性配偶，与‘丈夫’相对，常用于家庭话题。"}],"fill_blank":{"sentences":["Tom's ___ works as a nurse in the local hospital."],"options":["wife","sister","daughter","mother"],"correct_index":0},"audio":"Unit5/audio/wife.mp3","audio_ex0":"Unit5/audio/wife_ex0.mp3","audio_ex1":"Unit5/audio/wife_ex1.mp3"},{"word":"separate","ipa":"/ˈsepəreɪt/ (v.) /ˈsepərət/ (adj.)","image_prompts":["Two books placed apart on a long wooden table with a clear gap between them, bright daylight","A pair of scissors cutting a piece of paper into two distinct halves, sharp blade visible"],"image_desc_en":"Two books with a gap on a table; scissors cutting paper into two halves.","image_desc_cn":"桌上两本书中间留有空隙；剪刀将一张纸剪成两半。","meaning_cn":"分开；分离；单独的；各自的","usage":"v. (过去式 separated, 过去分词 separated) / adj. / adv. separately","collocations":"separate from, separate into, keep separate, separate rooms","preposition_combos":"separate from, separate into","examples":[{"en":"Please separate the white clothes from the dark ones.","cn":"请把白色衣服和深色衣服分开。"},{"en":"They live in separate cities but still keep in touch.","cn":"他们住在不同的城市，但仍然保持联系。"}],"socratic_questions":[{"question":"整理书包时，你要把课本和练习本放在不同夹层里，这个动作叫什么？","answer_hint":"这个词表示把混在一起的东西分成不同部分或组。"}],"fill_blank":{"sentences":["We need to ___ the recyclable waste from the kitchen trash."],"options":["separate","mix","collect","throw"],"correct_index":0},"audio":"Unit5/audio/separate.mp3","audio_ex0":"Unit5/audio/separate_ex0.mp3","audio_ex1":"Unit5/audio/separate_ex1.mp3"},{"word":"born","ipa":"/bɔːrn/","image_prompts":["A newborn kitten sleeping in a soft blanket inside a cardboard box, warm lamp light","A calendar with a circled date and a small stork sticker next to it, pastel colors"],"image_desc_en":"A newborn kitten in a blanket in a box; a calendar with a circled date and a stork sticker.","image_desc_cn":"纸箱里毯子上的一只新生小猫；日历上圈出一个日期并贴有鹳鸟贴纸。","meaning_cn":"出生；诞生","usage":"v. (过去分词，常用于被动语态 be born)","collocations":"be born in, be born on, be born into, born and raised","preposition_combos":"born in (place/year), born on (date), born into (family)","examples":[{"en":"She was born in a small town near the sea.","cn":"她出生在靠近海边的一个小镇上。"},{"en":"The puppy was born on a cold winter morning.","cn":"小狗在一个寒冷的冬日早晨出生。"}],"socratic_questions":[{"question":"写自我介绍时，你想说‘我2008年3月来到这个世界’，应该用哪个动词的被动形式？","answer_hint":"这个词表示生命的开始，常与‘be’动词连用，后接时间或地点。"}],"fill_blank":{"sentences":["My grandfather was ___ in 1960."],"options":["born","grown","raised","lived"],"correct_index":0},"audio":"Unit5/audio/born.mp3","audio_ex0":"Unit5/audio/born_ex0.mp3","audio_ex1":"Unit5/audio/born_ex1.mp3"},{"word":"one by one","ipa":"/wʌn baɪ wʌn/","image_prompts":["A row of dominoes falling sequentially from left to right, each hitting the next, white background","A line of ants walking in single file into a small hole in the ground, one after another"],"image_desc_en":"Dominoes falling in sequence; ants walking in a line into a hole.","image_desc_cn":"多米诺骨牌依次倒下；蚂蚁排成一列依次爬进洞里。","meaning_cn":"一个接一个地；逐一地","usage":"adv. phrase (副词短语)","collocations":"check one by one, count one by one, enter one by one, read one by one","preposition_combos":"无固定介词搭配","examples":[{"en":"The teacher checked our homework one by one.","cn":"老师逐一检查了我们的作业。"},{"en":"We counted the coins one by one on the desk.","cn":"我们在桌上一枚一枚地数硬币。"}],"socratic_questions":[{"question":"发试卷时，老师让每组同学按顺序依次上来领取，这个顺序动作可以用哪个短语描述？","answer_hint":"这个短语强调每次只做一件事或只处理一个对象，按顺序进行。"}],"fill_blank":{"sentences":["The students handed in their exam papers ___."],"options":["one by one","at once","all together","in a hurry"],"correct_index":0},"audio":"Unit5/audio/one_by_one.mp3","audio_ex0":"Unit5/audio/one_by_one_ex0.mp3","audio_ex1":"Unit5/audio/one_by_one_ex1.mp3"},{"word":"do with","ipa":"/duː wɪð/","image_prompts":["A messy desk covered with scattered papers, a pencil, and a sticky note reading 'What to do with this?' in neat handwriting, soft daylight from a window.","A cardboard box full of old books and a recycling bin next to it, a label on the box says 'Donate', warm indoor lighting."],"image_desc_en":"A cluttered desk with papers and a note asking what to do with the items, or a donation box with old books.","image_desc_cn":"一张堆满纸张的杂乱书桌，上面有便条询问如何处理这些物品；或一个装满旧书的捐赠箱。","meaning_cn":"处理；与……有关（常与 what 连用）","usage":"v. (过去式 did with, 过去分词 done with)","collocations":"what to do with, have nothing to do with","preposition_combos":"do with + 名词/代词","examples":[{"en":"I don't know what to do with these old magazines.","cn":"我不知道如何处理这些旧杂志。"},{"en":"This problem has nothing to do with our project.","cn":"这个问题与我们的项目无关。"}],"socratic_questions":[{"question":"你有一堆不再需要的旧衣服，不知道该怎么处理它们，你会用哪个短语来表达这种‘处理’的意思？","answer_hint":"这个短语常与 what 连用，表示‘如何处理某物’，强调动作的未知性。"}],"fill_blank":{"sentences":["Can you tell me what to ___ these empty bottles?"],"options":["do with","deal with","put with","go with"],"correct_index":0},"audio":"Unit5/audio/do_with.mp3","audio_ex0":"Unit5/audio/do_with_ex0.mp3","audio_ex1":"Unit5/audio/do_with_ex1.mp3"},{"word":"bowl","ipa":"/boʊl/","image_prompts":["A ceramic bowl filled with fresh fruit on a wooden table, natural sunlight casting soft shadows.","A clear glass bowl containing popcorn kernels, placed on a kitchen counter with a stainless steel spoon beside it."],"image_desc_en":"A ceramic bowl with fruit on a wooden table, or a glass bowl with popcorn kernels on a kitchen counter.","image_desc_cn":"一个陶瓷碗盛着水果放在木桌上；或一个玻璃碗装着爆米花粒放在厨房台面上。","meaning_cn":"碗；一碗的量","usage":"n. (复数 bowls)","collocations":"a bowl of, soup bowl, mixing bowl","preposition_combos":"in a bowl, into a bowl","examples":[{"en":"She poured the milk into a large glass bowl.","cn":"她把牛奶倒进一个大玻璃碗里。"},{"en":"I ate a bowl of noodles for lunch today.","cn":"我今天午餐吃了一碗面条。"}],"socratic_questions":[{"question":"你想描述一个用来盛放汤或水果的容器，它通常是圆形的、开口较大，你会想到哪个词？","answer_hint":"这个词指一种常见的餐具，用于盛放食物，尤其是液体或颗粒状食物。"}],"fill_blank":{"sentences":["He filled the ___ with hot soup for dinner."],"options":["bowl","cup","plate","glass"],"correct_index":0},"audio":"Unit5/audio/bowl.mp3","audio_ex0":"Unit5/audio/bowl_ex0.mp3","audio_ex1":"Unit5/audio/bowl_ex1.mp3"},{"word":"heat","ipa":"/hiːt/","image_prompts":["A metal pot on a gas stove with blue flames licking the bottom, steam rising from the boiling water inside.","A thermometer on a sunny windowsill showing a high temperature, with a heat haze visible over the pavement outside."],"image_desc_en":"A pot on a gas stove with flames and steam, or a thermometer showing high temperature with heat haze outside.","image_desc_cn":"一个放在燃气灶上的锅，火焰舔舐锅底，蒸汽升腾；或一个温度计显示高温，窗外路面有热浪。","meaning_cn":"加热；热量；高温","usage":"n. / v. (过去式 heated, 过去分词 heated)","collocations":"heat up, heat wave, low heat","preposition_combos":"heat over, heat in","examples":[{"en":"Please heat the soup over medium heat for five minutes.","cn":"请用中火加热汤五分钟。"},{"cn":"夏天的热量让柏油路变得很烫。","en":"The heat in summer makes the asphalt road very hot."}],"socratic_questions":[{"question":"你想表达‘把冷牛奶变热’这个动作，或者描述夏天的高温天气，应该用哪个词？","answer_hint":"这个词既可以作动词表示‘加热’，也可以作名词表示‘热量’或‘高温’。"}],"fill_blank":{"sentences":["You should ___ the leftovers in the microwave."],"options":["heat","cool","freeze","wash"],"correct_index":0},"audio":"Unit5/audio/heat.mp3","audio_ex0":"Unit5/audio/heat_ex0.mp3","audio_ex1":"Unit5/audio/heat_ex1.mp3"},{"word":"oil","ipa":"/ɔɪl/","image_prompts":["A glass bottle of olive oil on a kitchen counter, with a small puddle of golden oil spilled on a white plate.","A metal can of motor oil on a garage shelf, with a greasy rag next to it and a few drops on the concrete floor."],"image_desc_en":"A glass bottle of olive oil with a spill on a plate, or a metal can of motor oil on a garage shelf with drops on the floor.","image_desc_cn":"一个橄榄油玻璃瓶，旁边白盘上有一小滩金色油渍；或一个金属机油罐放在车库架子上，地上有几滴油。","meaning_cn":"油；石油；润滑油","usage":"n. (不可数名词，复数 oils 指不同种类)","collocations":"cooking oil, oil painting, oil change","preposition_combos":"in oil, with oil","examples":[{"en":"Add a little oil to the pan before frying the eggs.","cn":"煎鸡蛋前在平底锅里加一点油。"},{"en":"The car needs an oil change every six months.","cn":"这辆车每六个月需要换一次机油。"}],"socratic_questions":[{"question":"你在厨房炒菜时需要一种液体来防止食物粘锅，或者在车库看到汽车保养时用到的黑色液体，你会想到哪个词？","answer_hint":"这个词指一种不溶于水的黏稠液体，常用于烹饪或机械润滑。"}],"fill_blank":{"sentences":["Pour some ___ into the salad dressing to make it taste better."],"options":["oil","water","vinegar","salt"],"correct_index":0},"audio":"Unit5/audio/oil.mp3","audio_ex0":"Unit5/audio/oil_ex0.mp3","audio_ex1":"Unit5/audio/oil_ex1.mp3"},{"word":"pan","ipa":"/pæn/","image_prompts":["A stainless steel frying pan on a gas stove with blue flame underneath, empty and clean","A non-stick pan with scrambled eggs being flipped in mid-air, golden color, kitchen counter background"],"image_desc_en":"A frying pan on a stove with fire; eggs being flipped in a pan.","image_desc_cn":"一个煎锅在炉灶上，火焰在锅底；鸡蛋在锅中翻动。","meaning_cn":"平底锅；煎锅","usage":"n. (可数名词) 平底锅，常用于烹饪","collocations":"frying pan, pan lid, pan handle, hot pan","preposition_combos":"in a pan, from the pan, into the pan","examples":[{"en":"Mom heated some oil in a pan for cooking.","cn":"妈妈在平底锅里热了些油准备做饭。"},{"en":"The pan is too hot to touch without gloves.","cn":"这个平底锅太烫了，不戴手套不能碰。"}],"socratic_questions":[{"question":"你想煎一个鸡蛋，需要用什么厨房工具来盛放油和鸡蛋？","answer_hint":"这个词是一种底部平坦、有手柄的金属容器，专门用来煎炒食物。"}],"fill_blank":{"sentences":["Please pass me the ___ so I can fry the fish."],"options":["pan","pot","plate","bowl"],"correct_index":0},"audio":"Unit5/audio/pan.mp3","audio_ex0":"Unit5/audio/pan_ex0.mp3","audio_ex1":"Unit5/audio/pan_ex1.mp3"},{"word":"put sth back","ipa":"/pʊt sʌmθɪŋ bæk/","image_prompts":["A hand placing a book onto a shelf where other books stand neatly, library setting","A toy block being returned into a plastic storage bin with other blocks, organized playroom"],"image_desc_en":"A book being placed back on a shelf; a block being put into a bin.","image_desc_cn":"一本书被放回书架；一块积木被放回收纳箱。","meaning_cn":"把某物放回原处","usage":"v. (短语动词) 及物，必须分开或一起使用，宾语放在 back 前或后均可","collocations":"put the book back, put it back, put everything back","preposition_combos":"put sth back on/in/into","examples":[{"en":"After reading, please put the magazine back on the shelf.","cn":"读完杂志后，请把它放回书架上。"},{"en":"He put the tools back in the box after fixing the bike.","cn":"修好自行车后，他把工具放回了箱子里。"}],"socratic_questions":[{"question":"你在图书馆借了一本书，看完后应该怎么做才能方便下一个人找到？","answer_hint":"这个短语表示把物品归还到它原本所在的位置，不是随便放。"}],"fill_blank":{"sentences":["Don't forget to ___ the dictionary ___ after you use it."],"options":["put...back","take...away","throw...out","pick...up"],"correct_index":0},"audio":"Unit5/audio/put_sth_back.mp3","audio_ex0":"Unit5/audio/put_sth_back_ex0.mp3","audio_ex1":"Unit5/audio/put_sth_back_ex1.mp3"},{"word":"simple","ipa":"/ˈsɪmpl/","image_prompts":["A plain white plate with a single apple on it, minimalistic table setting","A one-line black ink drawing of a tree on white paper, no extra details"],"image_desc_en":"A white plate with one apple; a minimal line drawing of a tree.","image_desc_cn":"一个白色盘子上放着一个苹果；一幅极简的线条树画。","meaning_cn":"简单的；朴素的；容易的","usage":"adj. (形容词) 可修饰事物或任务","collocations":"simple answer, simple life, simple steps, simple design","preposition_combos":"simple for sb, simple to do","examples":[{"en":"This math problem is simple and easy to solve.","cn":"这道数学题很简单，容易解答。"},{"en":"She prefers a simple life without too many gadgets.","cn":"她更喜欢简单的生活，没有太多电子设备。"}],"socratic_questions":[{"question":"老师出了一道题，你一眼就知道答案，不需要复杂计算，你会怎么形容这道题？","answer_hint":"这个词表示不复杂、不困难，和‘容易’意思相近。"}],"fill_blank":{"sentences":["The instructions are so ___ that even a beginner can follow them."],"options":["simple","difficult","confusing","long"],"correct_index":0},"audio":"Unit5/audio/simple.mp3","audio_ex0":"Unit5/audio/simple_ex0.mp3","audio_ex1":"Unit5/audio/simple_ex1.mp3"},{"word":"ingredient","ipa":"/ɪnˈɡriːdiənt/","image_prompts":["A wooden table with flour, eggs, sugar, and butter arranged in small bowls, baking preparation","A glass jar labeled 'spice mix' surrounded by cinnamon sticks, cloves, and star anise on a marble counter"],"image_desc_en":"Flour, eggs, sugar, butter in bowls; spice jar with cinnamon and cloves.","image_desc_cn":"碗中的面粉、鸡蛋、糖和黄油；装有肉桂和丁香的香料罐。","meaning_cn":"成分；原料；要素","usage":"n. (可数名词) 常用于烹饪或比喻构成某事物的部分","collocations":"main ingredient, secret ingredient, key ingredient, cooking ingredients","preposition_combos":"ingredient in/for","examples":[{"en":"Flour and eggs are basic ingredients for making a cake.","cn":"面粉和鸡蛋是做蛋糕的基本原料。"},{"en":"Honesty is an important ingredient in a good friendship.","cn":"诚实是良好友谊的重要要素。"}],"socratic_questions":[{"question":"你想做一碗番茄鸡蛋面，需要准备番茄、鸡蛋、面条和盐，这些可以统称为什么？","answer_hint":"这个词指组成一道菜或一个混合物的各个部分，比如食谱里列出的东西。"}],"fill_blank":{"sentences":["The most important ___ in this soup is fresh tomatoes."],"options":["ingredient","tool","container","recipe"],"correct_index":0},"audio":"Unit5/audio/ingredient.mp3","audio_ex0":"Unit5/audio/ingredient_ex0.mp3","audio_ex1":"Unit5/audio/ingredient_ex1.mp3"},{"word":"instruction","ipa":"/ɪnˈstrʌkʃən/","image_prompts":["A clear step-by-step manual with numbered diagrams for assembling a wooden bookshelf, open on a desk","A whiteboard filled with bullet-pointed directions for a science experiment, colorful markers"],"image_desc_en":"A manual or whiteboard with numbered steps and diagrams for a task.","image_desc_cn":"一本带编号步骤和图表的手册或一块写有任务步骤的白板。","meaning_cn":"指令；说明；教导","usage":"n. (可数名词，常复数 instructions)","collocations":"follow instructions, give instructions, read the instructions","preposition_combos":"instructions for (doing) sth; instructions on how to do sth","examples":[{"en":"Please read the instructions carefully before you start the test.","cn":"开始测试前请仔细阅读说明。"},{"en":"The teacher gave clear instructions for the group project.","cn":"老师对小组项目给出了清晰的指令。"}],"socratic_questions":[{"question":"你买了一个新书架，打开盒子发现里面有一张纸，上面画着步骤图，这张纸叫什么？","answer_hint":"这个词常与“follow”或“read”搭配，表示操作指南。"}],"fill_blank":{"sentences":["Before using the new printer, you should read the ___ first."],"options":["instructions","invitations","introductions","inventions"],"correct_index":0},"audio":"Unit5/audio/instruction.mp3","audio_ex0":"Unit5/audio/instruction_ex0.mp3","audio_ex1":"Unit5/audio/instruction_ex1.mp3"},{"word":"steamed fish","ipa":"/stiːmd fɪʃ/","image_prompts":["A white ceramic plate holding a whole steamed fish with ginger slices and green onions on top, steam rising","A close-up of a steamed fish fillet on a bamboo steamer basket, soy sauce drizzled around"],"image_desc_en":"A whole fish or fillet cooked by steam, garnished with ginger and scallions on a plate.","image_desc_cn":"一盘用蒸汽烹饪的整鱼或鱼片，上面点缀着姜丝和葱花。","meaning_cn":"清蒸鱼","usage":"n. (不可数名词，常作一道菜名)","collocations":"order steamed fish, cook steamed fish, enjoy steamed fish","preposition_combos":"steamed fish with ginger; steamed fish in soy sauce","examples":[{"en":"My mother often cooks steamed fish for dinner on weekends.","cn":"我妈妈周末晚餐常做清蒸鱼。"},{"en":"Steamed fish is a healthy dish because it uses little oil.","cn":"清蒸鱼是一道健康菜，因为用油很少。"}],"socratic_questions":[{"question":"你去一家中餐馆，想点一道少油、用蒸汽做的鱼，菜名里应该有什么词？","answer_hint":"这个词组描述一种烹饪方式，鱼不是煎或炸的。"}],"fill_blank":{"sentences":["For a light and healthy meal, I would like to order ___."],"options":["steamed fish","fried chicken","roast beef","boiled eggs"],"correct_index":0},"audio":"Unit5/audio/steamed_fish.mp3","audio_ex0":"Unit5/audio/steamed_fish_ex0.mp3","audio_ex1":"Unit5/audio/steamed_fish_ex1.mp3"},{"word":"sour","ipa":"/ˈsaʊər/","image_prompts":["A sliced lemon on a cutting board with juice droplets visible, bright yellow rind","A jar of pickles floating in vinegar, bubbles around the cucumbers"],"image_desc_en":"A lemon slice with visible juice or pickles in vinegar, emphasizing a sharp taste.","image_desc_cn":"一片带可见汁液的柠檬或泡在醋里的腌菜，强调尖锐的酸味。","meaning_cn":"酸的；酸味的","usage":"adj. (比较级 sourer, 最高级 sourest)","collocations":"sour taste, sour candy, go sour","preposition_combos":"sour to the taste; sour like a lemon","examples":[{"en":"The green apple tastes very sour, so I put some sugar on it.","cn":"这个青苹果很酸，所以我放了点糖在上面。"},{"en":"If you leave milk out too long, it will go sour.","cn":"如果你把牛奶放太久，它会变酸。"}],"socratic_questions":[{"question":"你咬了一口没熟的青柠檬，嘴里立刻涌出一种强烈的味道，这种味道叫什么？","answer_hint":"这种味道和甜、苦、咸并列，常让人皱眉。"}],"fill_blank":{"sentences":["The lemon juice made the drink taste too ___ for me."],"options":["sour","sweet","salty","bitter"],"correct_index":0},"audio":"Unit5/audio/sour.mp3","audio_ex0":"Unit5/audio/sour_ex0.mp3","audio_ex1":"Unit5/audio/sour_ex1.mp3"},{"word":"hot and sour","ipa":"/hɒt ænd ˈsaʊər/","image_prompts":["A bowl of hot and sour soup with tofu shreds, wood ear mushrooms, and red chili oil floating on top","A close-up of a steaming bowl of soup with vinegar and pepper visible as seasonings on the surface"],"image_desc_en":"A bowl of soup with tofu, mushrooms, and chili oil, showing both spicy and sour elements.","image_desc_cn":"一碗有豆腐、木耳和辣椒油的汤，同时呈现辣和酸的元素。","meaning_cn":"酸辣的","usage":"adj. (固定短语，常修饰 soup, noodles 等)","collocations":"hot and sour soup, hot and sour flavor, hot and sour noodles","preposition_combos":"hot and sour with vinegar; hot and sour in taste","examples":[{"en":"Hot and sour soup is a popular dish in Chinese restaurants.","cn":"酸辣汤是中餐馆里一道受欢迎的菜。"},{"en":"I like to add extra vinegar to make the noodles more hot and sour.","cn":"我喜欢多加醋让面条更酸辣。"}],"socratic_questions":[{"question":"你感冒了，想喝一碗又辣又酸的汤来发汗，这道汤的名字里应该包含哪两个词？","answer_hint":"这两个词分别描述温度和味道，组合起来是一种经典汤品。"}],"fill_blank":{"sentences":["To warm up on a cold day, I ordered a bowl of ___ soup."],"options":["hot and sour","sweet and sour","cold and spicy","mild and salty"],"correct_index":0},"audio":"Unit5/audio/hot_and_sour.mp3","audio_ex0":"Unit5/audio/hot_and_sour_ex0.mp3","audio_ex1":"Unit5/audio/hot_and_sour_ex1.mp3"},{"word":"mess","ipa":"/mes/","image_prompts":["A cluttered desk covered with scattered papers, crumpled balls of paper, and an overturned cup of coffee, with a single lamp casting a shadow over the chaos","A kitchen counter with spilled flour, broken eggshells, and a tipped-over bowl, sticky liquid dripping onto the floor tiles"],"image_desc_en":"A chaotic pile of objects creating disorder in a room","image_desc_cn":"房间里一堆杂乱无章的物品造成混乱","meaning_cn":"混乱，脏乱；弄乱","usage":"n. (可数名词，常用单数) / v. (过去式 messed, 过去分词 messed)","collocations":"in a mess, make a mess, clean up the mess","preposition_combos":"mess with, mess up","examples":[{"en":"My little brother made a big mess in the living room.","cn":"我弟弟在客厅里弄得一团糟。"},{"en":"Please clean up your mess before dinner starts.","cn":"请在晚餐开始前清理干净你的烂摊子。"}],"socratic_questions":[{"question":"你写完作业后，书桌上堆满了书本、笔和废纸，看起来很不整洁。你会用什么词形容这个状态？","answer_hint":"这个词强调杂乱无章、需要收拾的状态，不是简单的‘脏’（dirty）。"}],"fill_blank":{"sentences":["After the party, the room was a complete ___ with cups and plates everywhere."],"options":["mess","party","game","show"],"correct_index":0},"audio":"Unit5/audio/mess.mp3","audio_ex0":"Unit5/audio/mess_ex0.mp3","audio_ex1":"Unit5/audio/mess_ex1.mp3"},{"word":"pretty","ipa":"/ˈprɪti/","image_prompts":["A garden full of blooming pink roses with dew drops on petals, soft sunlight filtering through leaves","A neatly wrapped gift box with a shiny red ribbon and a small bow on top, placed on a wooden table"],"image_desc_en":"Something visually pleasing and delicate in appearance","image_desc_cn":"外观上令人愉悦且精致的事物","meaning_cn":"漂亮的，好看的；相当，颇","usage":"adj. / adv. (比较级 prettier, 最高级 prettiest)","collocations":"pretty good, pretty soon, pretty girl (但注意避免人物，可用 pretty flower)","preposition_combos":"无常见介词搭配","examples":[{"en":"The sunset looks pretty from the top of the hill.","cn":"从山顶上看，日落非常漂亮。"},{"en":"I think this blue dress is pretty enough for the party.","cn":"我觉得这条蓝裙子穿去派对已经够漂亮了。"}],"socratic_questions":[{"question":"你看到一朵花颜色柔和、形状可爱，让人忍不住想多看几眼。你会怎么形容它？","answer_hint":"这个词比‘beautiful’更日常、更轻快，常用于形容小巧可爱的事物。"}],"fill_blank":{"sentences":["The weather today is ___ nice, so we can go for a walk."],"options":["pretty","ugly","terrible","boring"],"correct_index":0},"audio":"Unit5/audio/pretty.mp3","audio_ex0":"Unit5/audio/pretty_ex0.mp3","audio_ex1":"Unit5/audio/pretty_ex1.mp3"},{"word":"Christmas","ipa":"/ˈkrɪsməs/","image_prompts":["A decorated evergreen tree with colorful ornaments, tinsel, and a glowing star on top, surrounded by wrapped gift boxes underneath","A fireplace mantel with stockings hung in a row, a warm fire burning inside the hearth, and a clock showing midnight"],"image_desc_en":"A festive winter holiday scene with decorations and gifts","image_desc_cn":"一个带有装饰和礼物的冬日节日场景","meaning_cn":"圣诞节","usage":"n. (专有名词，首字母大写)","collocations":"Christmas Eve, Christmas Day, Christmas tree, Christmas gift","preposition_combos":"at Christmas, on Christmas Day","examples":[{"en":"We always put up the Christmas tree in early December.","cn":"我们总是在十二月初就装饰好圣诞树。"},{"en":"My family gets together for a big dinner on Christmas Eve.","cn":"我家人在圣诞夜聚在一起吃一顿丰盛的晚餐。"}],"socratic_questions":[{"question":"一年中有一个节日，人们会装饰树、交换礼物、吃大餐，而且是在冬天。这是什么节日？","answer_hint":"这个节日在12月25日，名字里带有‘基督’的意思，但现在已经是一个全球性的文化节日。"}],"fill_blank":{"sentences":["Children often hang stockings by the fireplace on ___ Eve."],"options":["Christmas","Easter","Halloween","New Year"],"correct_index":0},"audio":"Unit5/audio/Christmas.mp3","audio_ex0":"Unit5/audio/Christmas_ex0.mp3","audio_ex1":"Unit5/audio/Christmas_ex1.mp3"},{"word":"pancake","ipa":"/ˈpænkeɪk/","image_prompts":["A stack of golden pancakes on a white plate with maple syrup dripping down the sides, steam rising","A round pancake in a frying pan with bubbles forming on the surface, kitchen counter background"],"image_desc_en":"A stack of pancakes with syrup and steam","image_desc_cn":"一叠煎饼，淋着糖浆，冒着热气","meaning_cn":"薄煎饼；烙饼","usage":"n. (可数名词，复数 pancakes)","collocations":"make pancakes, eat pancakes, a stack of pancakes","preposition_combos":"pancake with syrup, pancake for breakfast","examples":[{"en":"My mom makes delicious pancakes with fresh fruit every Sunday.","cn":"我妈妈每个周日都会做美味的煎饼配新鲜水果。"},{"en":"We bought a stack of pancakes from the morning market.","cn":"我们从早市买了一叠煎饼。"}],"socratic_questions":[{"question":"周末早上你闻到厨房里飘来香甜的味道，妈妈正在平底锅里煎一种圆圆的、金黄色的面食，这是什么？","answer_hint":"这是一种常见的早餐食品，圆而扁平，通常搭配糖浆或水果食用。"}],"fill_blank":{"sentences":["For breakfast, I like to eat a ___ with honey and butter."],"options":["pancake","sandwich","noodle","rice"],"correct_index":0},"audio":"Unit5/audio/pancake.mp3","audio_ex0":"Unit5/audio/pancake_ex0.mp3","audio_ex1":"Unit5/audio/pancake_ex1.mp3"},{"word":"dream","ipa":"/driːm/","image_prompts":["A glowing light bulb floating above an open notebook with scribbled ideas, soft blue background","A starry night sky with a single bright shooting star crossing above a calm lake"],"image_desc_en":"A light bulb above a notebook with ideas","image_desc_cn":"笔记本上方发光的灯泡，写满想法","meaning_cn":"梦想；梦","usage":"n. (可数名词，复数 dreams); v. (过去式 dreamed/dreamt, 过去分词 dreamed/dreamt)","collocations":"have a dream, realize one's dream, dream of/about","preposition_combos":"dream of becoming, dream about the future","examples":[{"en":"Her dream is to travel around the world after graduation.","cn":"她的梦想是毕业后环游世界。"},{"en":"I dreamed about flying over the mountains last night.","cn":"昨晚我梦见飞过群山。"}],"socratic_questions":[{"question":"你晚上睡觉时脑海里会出现一些奇妙的画面，比如在天空飞翔；白天你也常常想着长大后要做什么，这些想法可以用一个词概括，是什么？","answer_hint":"这个词既指睡眠中的梦，也指对未来的美好愿望。"}],"fill_blank":{"sentences":["Everyone should have a ___ and work hard to make it come true."],"options":["dream","job","test","game"],"correct_index":0},"audio":"Unit5/audio/dream.mp3","audio_ex0":"Unit5/audio/dream_ex0.mp3","audio_ex1":"Unit5/audio/dream_ex1.mp3"},{"word":"university","ipa":"/ˌjuːnɪˈvɜːrsəti/","image_prompts":["A large stone archway with 'University Library' carved above it, autumn leaves on the ground","A row of tall brick buildings with ivy climbing the walls, a clock tower in the distance"],"image_desc_en":"A stone archway of a university library with autumn leaves","image_desc_cn":"大学图书馆的石拱门，地面铺满秋叶","meaning_cn":"大学","usage":"n. (可数名词，复数 universities)","collocations":"go to university, study at university, university campus","preposition_combos":"at university, in a university","examples":[{"en":"My sister studies biology at a famous university in Beijing.","cn":"我姐姐在北京一所著名大学学习生物学。"},{"en":"After high school, he plans to go to university abroad.","cn":"高中毕业后，他计划去国外上大学。"}],"socratic_questions":[{"question":"你表哥高中毕业后去了一个有很多教学楼、图书馆和实验室的地方继续深造，那里比中学大很多，学生都学习专业课程，这是什么地方？","answer_hint":"这是高等教育机构，通常提供本科和研究生课程，比college规模更大。"}],"fill_blank":{"sentences":["She hopes to get a scholarship to study at a top ___."],"options":["university","hospital","museum","factory"],"correct_index":0},"audio":"Unit5/audio/university.mp3","audio_ex0":"Unit5/audio/university_ex0.mp3","audio_ex1":"Unit5/audio/university_ex1.mp3"},{"word":"go boating","ipa":"/ɡoʊ ˈboʊtɪŋ/","image_prompts":["Two wooden rowboats tied to a dock on a calm lake, reflections of trees in the water","A small sailboat with white sails gliding across a blue lake under a clear sky"],"image_desc_en":"Two rowboats tied to a dock on a calm lake","image_desc_cn":"两艘划艇系在平静湖面的码头上","meaning_cn":"去划船","usage":"动词短语 (go + v-ing 结构，用于表示休闲活动)","collocations":"go boating on the lake, go boating with friends","preposition_combos":"go boating on, go boating in","examples":[{"en":"We plan to go boating on the lake this weekend.","cn":"我们计划这个周末去湖上划船。"},{"en":"Going boating is a great way to relax after exams.","cn":"考试后去划船是放松的好方式。"}],"socratic_questions":[{"question":"周末天气晴朗，你和家人来到公园的湖边，租了一艘小船，用桨划水前进，这种活动叫什么？","answer_hint":"这是一个动词短语，由'去'和一个表示水上活动的-ing形式组成。"}],"fill_blank":{"sentences":["On sunny days, my family likes to ___ on the river."],"options":["go boating","go shopping","go fishing","go hiking"],"correct_index":0},"audio":"Unit5/audio/go_boating.mp3","audio_ex0":"Unit5/audio/go_boating_ex0.mp3","audio_ex1":"Unit5/audio/go_boating_ex1.mp3"},{"word":"memory","ipa":"/ˈmeməri/","image_prompts":["A worn-out photo album lying open on a wooden table, faded photographs with curled edges, soft warm lighting","A stack of old letters tied with a red ribbon, sitting on a dusty attic floor, sunlight streaming through a small window"],"image_desc_en":"A worn-out photo album lying open on a wooden table, faded photographs with curled edges, soft warm lighting","image_desc_cn":"一本破旧的相册摊开在木桌上，褪色的照片边缘卷曲，柔和温暖的灯光","meaning_cn":"记忆；回忆","usage":"n. (可数名词，复数 memories)","collocations":"have a good memory, in memory of, bring back memories","preposition_combos":"memory of (sth/sb)","examples":[{"en":"The old photo brings back sweet memories of my childhood.","cn":"这张旧照片带回了童年的美好回忆。"},{"en":"She has a clear memory of the first day at school.","cn":"她对开学第一天有清晰的记忆。"}],"socratic_questions":[{"question":"小明看到一张小学毕业照，突然想起很多过去的事。他脑子里浮现的是什么？","answer_hint":"这个词指过去经历留在脑海中的印象，不是照片本身，而是脑海中的画面。"}],"fill_blank":{"sentences":["The song always brings back happy ___ of our summer vacation."],"options":["memories","dreams","plans","ideas"],"correct_index":0},"audio":"Unit5/audio/memory.mp3","audio_ex0":"Unit5/audio/memory_ex0.mp3","audio_ex1":"Unit5/audio/memory_ex1.mp3"},{"word":"visible","ipa":"/ˈvɪzəbl/","image_prompts":["A tall lighthouse on a rocky cliff, its bright beam cutting through thick fog, clearly seen from a distance","A large clock tower against a clear blue sky, every detail of the clock face sharp and distinct"],"image_desc_en":"A tall lighthouse on a rocky cliff, its bright beam cutting through thick fog, clearly seen from a distance","image_desc_cn":"一座高耸的灯塔在岩石悬崖上，明亮的光束穿透浓雾，从远处清晰可见","meaning_cn":"看得见的；明显的","usage":"adj. (副词 visibly)","collocations":"clearly visible, barely visible, visible to the naked eye","preposition_combos":"visible to (sb), visible from (somewhere)","examples":[{"en":"The mountain peak is visible from our classroom window.","cn":"从我们教室的窗户能看到山顶。"},{"en":"The writing on the blackboard is barely visible in the back row.","cn":"黑板上的字在后排几乎看不见。"}],"socratic_questions":[{"question":"大雾天，你站在窗前，远处的教学楼只能看到一个模糊的轮廓。这个轮廓是什么状态？","answer_hint":"这个词描述的是能被眼睛看到的状态，与'看不见'相反。"}],"fill_blank":{"sentences":["The stars are not ___ in the city because of the bright lights."],"options":["visible","invisible","possible","terrible"],"correct_index":0},"audio":"Unit5/audio/visible.mp3","audio_ex0":"Unit5/audio/visible_ex0.mp3","audio_ex1":"Unit5/audio/visible_ex1.mp3"},{"word":"along with sb","ipa":"/əˈlɒŋ wɪð ˈsʌmbədi/","image_prompts":["A row of three backpacks hanging on hooks in a school hallway, side by side in a line","Two bicycles parked next to each other under a tree, their front wheels touching slightly"],"image_desc_en":"A row of three backpacks hanging on hooks in a school hallway, side by side in a line","image_desc_cn":"三个背包并排挂在走廊的挂钩上，一个挨着一个","meaning_cn":"和……一起；连同","usage":"prepositional phrase (along with + 名词/代词)","collocations":"go along with, work along with, bring sth along with","preposition_combos":"along with (sb/sth)","examples":[{"en":"Please bring your homework along with your textbook tomorrow.","cn":"明天请把作业和课本一起带来。"},{"en":"She went to the library along with her best friend.","cn":"她和最好的朋友一起去了图书馆。"}],"socratic_questions":[{"question":"老师让小明交作业时，还要把家长签字的那张纸也一起交上去。老师用了什么短语表示'一起'？","answer_hint":"这个短语表示两个事物或人同时出现、伴随发生，强调'伴随'关系。"}],"fill_blank":{"sentences":["The teacher came into the classroom ___ a box of new books."],"options":["along with","instead of","because of","without"],"correct_index":0},"audio":"Unit5/audio/along_with_sb.mp3","audio_ex0":"Unit5/audio/along_with_sb_ex0.mp3","audio_ex1":"Unit5/audio/along_with_sb_ex1.mp3"},{"word":"pumpkin","ipa":"/ˈpʌmpkɪn/","image_prompts":["A large orange pumpkin sitting on a wooden crate in a farm field, green vines curling around its base","A carved jack-o'-lantern on a stone step, candlelight flickering through its triangular eyes and jagged smile"],"image_desc_en":"A large orange pumpkin sitting on a wooden crate in a farm field, green vines curling around its base","image_desc_cn":"一个大橙色的南瓜放在农田的木箱上，绿色的藤蔓缠绕在底部","meaning_cn":"南瓜","usage":"n. (可数名词，复数 pumpkins)","collocations":"pumpkin pie, pumpkin lantern, carve a pumpkin","preposition_combos":"pumpkin in (soup/pie), pumpkin with (candles)","examples":[{"en":"We made a big pumpkin lantern for Halloween last night.","cn":"昨晚我们做了一个大南瓜灯来庆祝万圣节。"},{"en":"My mother bakes a delicious pumpkin pie every autumn.","cn":"每年秋天我妈妈都会烤一个美味的南瓜派。"}],"socratic_questions":[{"question":"万圣节到了，同学们在教室里摆了一个橙色的、圆滚滚的东西，还在上面刻了眼睛和嘴巴。这是什么？","answer_hint":"这是一种秋季成熟的蔬菜，颜色橙黄，常被挖空做成灯笼。"}],"fill_blank":{"sentences":["For Halloween, we carved a big ___ and put a candle inside."],"options":["pumpkin","watermelon","apple","potato"],"correct_index":0},"audio":"Unit5/audio/pumpkin.mp3","audio_ex0":"Unit5/audio/pumpkin_ex0.mp3","audio_ex1":"Unit5/audio/pumpkin_ex1.mp3"},{"word":"pie","ipa":"/paɪ/","image_prompts":["A whole apple pie on a wooden table with a slice missing, golden crust and steam rising","A blueberry pie cooling on a wire rack, purple filling bubbling through lattice crust"],"image_desc_en":"A whole apple pie on a wooden table with a slice missing, golden crust and steam rising","image_desc_cn":"一个完整的苹果派放在木桌上，缺了一块，金黄色的外皮冒着热气","meaning_cn":"馅饼；派","usage":"n. (可数名词，复数 pies)","collocations":"apple pie, pumpkin pie, piece of pie, bake a pie","preposition_combos":"pie with... (如 pie with ice cream)","examples":[{"en":"My mom baked an apple pie for the family dinner.","cn":"我妈妈为家庭晚餐烤了一个苹果派。"},{"en":"We shared a warm pumpkin pie after the Thanksgiving meal.","cn":"感恩节大餐后我们分享了一个热南瓜派。"}],"socratic_questions":[{"question":"你参加学校烘焙义卖，想带一种甜点，它通常是圆形的，里面有水果馅，外皮酥脆，你会带什么？","answer_hint":"这是一种常见的甜点，有水果馅和酥皮，比如苹果或南瓜口味。"}],"fill_blank":{"sentences":["For dessert, I would like a slice of apple ___ with ice cream."],"options":["pie","cake","bread","cookie"],"correct_index":0},"audio":"Unit5/audio/pie.mp3","audio_ex0":"Unit5/audio/pie_ex0.mp3","audio_ex1":"Unit5/audio/pie_ex1.mp3"},{"word":"warm up","ipa":"/wɔːrm ʌp/","image_prompts":["A pair of running shoes on a gym floor next to a foam roller and a water bottle","A bicycle parked on a sunny path with a helmet resting on the handlebars"],"image_desc_en":"A pair of running shoes on a gym floor next to a foam roller and a water bottle","image_desc_cn":"一双跑鞋放在健身房地板上，旁边是泡沫轴和水瓶","meaning_cn":"热身；做准备活动","usage":"v. (过去式 warmed up, 过去分词 warmed up) 也可作名词 warm-up","collocations":"warm up before exercise, do a warm-up, warm up muscles","preposition_combos":"warm up for... (如 warm up for a race)","examples":[{"en":"We should warm up before running to avoid injury.","cn":"跑步前我们应该热身以避免受伤。"},{"en":"The team did a ten-minute warm-up before the match.","cn":"队伍在比赛前做了十分钟热身。"}],"socratic_questions":[{"question":"体育课上，老师让大家在跑步前先做一些拉伸和慢跑，这个准备活动叫什么？","answer_hint":"这是运动前让身体活动开、防止受伤的环节，通常包括拉伸和轻度运动。"}],"fill_blank":{"sentences":["Before the basketball game, the players need to ___ for ten minutes."],"options":["warm up","cool down","sit down","stand up"],"correct_index":0},"audio":"Unit5/audio/warm_up.mp3","audio_ex0":"Unit5/audio/warm_up_ex0.mp3","audio_ex1":"Unit5/audio/warm_up_ex1.mp3"},{"word":"cinnamon","ipa":"/ˈsɪnəmən/","image_prompts":["A close-up of cinnamon sticks tied with twine on a rustic wooden counter","A bowl of ground cinnamon powder next to a wooden spoon, soft natural light"],"image_desc_en":"A close-up of cinnamon sticks tied with twine on a rustic wooden counter","image_desc_cn":"肉桂棒用细绳捆在一起，放在乡村风格的木制台面上特写","meaning_cn":"肉桂；肉桂粉","usage":"n. (不可数名词)","collocations":"cinnamon roll, cinnamon powder, cinnamon stick, add cinnamon","preposition_combos":"cinnamon in... (如 cinnamon in tea)","examples":[{"en":"I love the smell of cinnamon in hot apple cider.","cn":"我喜欢热苹果酒里肉桂的香味。"},{"en":"She sprinkled some cinnamon on her oatmeal for breakfast.","cn":"她在早餐的燕麦片上撒了一些肉桂粉。"}],"socratic_questions":[{"question":"你闻到一种温暖甜美的香料味，它常被加在苹果派或热饮里，颜色是棕色的，这是什么香料？","answer_hint":"这是一种常见的烘焙香料，有独特的甜味和香气，常以棒状或粉末形式出现。"}],"fill_blank":{"sentences":["The baker added a teaspoon of ___ to the apple pie filling."],"options":["cinnamon","salt","sugar","pepper"],"correct_index":0},"audio":"Unit5/audio/cinnamon.mp3","audio_ex0":"Unit5/audio/cinnamon_ex0.mp3","audio_ex1":"Unit5/audio/cinnamon_ex1.mp3"}]},{"unit":6,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"bath","ipa":"/bɑːθ/","image_prompts":["A white porcelain bathtub filled with warm water and white foam bubbles, a rubber duck floating on the surface, soft steam rising in a clean bathroom with blue tiles.","A wooden bathtub in a natural hot spring setting, surrounded by smooth stones and green bamboo leaves, clear water reflecting the sky."],"image_desc_en":"A bathtub with foam and a rubber duck; a wooden bathtub in a hot spring.","image_desc_cn":"一个带泡沫和橡皮鸭的浴缸；一个在温泉中的木制浴缸。","meaning_cn":"洗澡；浴缸；沐浴","usage":"n. (可数名词，常用单数形式，如 take a bath / have a bath)","collocations":"take a bath, have a bath, hot bath, bubble bath","preposition_combos":"in the bath, after a bath","examples":[{"en":"After the long run, I took a hot bath to relax.","cn":"长跑之后，我洗了个热水澡来放松。"},{"en":"My cat always sits outside the bathroom when I have a bath.","cn":"我洗澡时，我的猫总是坐在浴室外面。"}],"socratic_questions":[{"question":"你运动完一身汗，回家后最想做什么来清洁身体、放松肌肉？","answer_hint":"这个词指在浴缸里泡水清洁，不是淋浴，也不是游泳。"}],"fill_blank":{"sentences":["After the camping trip, everyone needed a hot ___ to get clean."],"options":["bath","shower","swim","walk"],"correct_index":0},"audio":"Unit6/audio/bath.mp3","audio_ex0":"Unit6/audio/bath_ex0.mp3","audio_ex1":"Unit6/audio/bath_ex1.mp3"},{"word":"miss","ipa":"/mɪs/","image_prompts":["A calendar with a red circle around a past date, a wilted flower placed on the desk next to it, soft morning light through a window.","An empty chair at a dining table with a single plate and a cup of cold tea, a clock showing late evening."],"image_desc_en":"A calendar with a circled date and a wilted flower; an empty chair at a table with cold tea.","image_desc_cn":"一张日历上圈着日期并放着一朵枯萎的花；餐桌旁一把空椅子和冷茶。","meaning_cn":"想念；错过；未击中","usage":"v. (过去式 missed, 过去分词 missed)","collocations":"miss the bus, miss a chance, miss someone, miss a goal","preposition_combos":"miss out on, miss by (e.g., miss by one point)","examples":[{"en":"I missed the early bus and had to walk to school.","cn":"我错过了早班公交车，不得不步行去学校。"},{"en":"She misses her best friend who moved to another city.","cn":"她想念搬到另一个城市的最好的朋友。"}],"socratic_questions":[{"question":"你早上起晚了，跑到车站时公交车刚好开走，你没能赶上它，用哪个词？","answer_hint":"这个词表示没能赶上或没能抓住，也用于表达思念某人。"}],"fill_blank":{"sentences":["If you run fast, you won't ___ the last train."],"options":["miss","catch","find","lose"],"correct_index":0},"audio":"Unit6/audio/miss.mp3","audio_ex0":"Unit6/audio/miss_ex0.mp3","audio_ex1":"Unit6/audio/miss_ex1.mp3"},{"word":"be tired of","ipa":"/biː ˈtaɪərd əv/","image_prompts":["A stack of identical textbooks piled high on a desk, a clock showing late night, a half-empty coffee cup with cold liquid.","A treadmill with a worn-out belt and dust on the display screen, a wilted plant in the corner of a gym."],"image_desc_en":"A tall stack of textbooks with a late-night clock and cold coffee; a dusty treadmill with a wilted plant.","image_desc_cn":"一摞高高的教科书、深夜的钟和冷咖啡；一台布满灰尘的跑步机和枯萎的植物。","meaning_cn":"厌倦；对……感到厌烦","usage":"短语动词 (be tired of + n./doing)","collocations":"be tired of waiting, be tired of the same food, be tired of homework","preposition_combos":"tired of (后接名词或动名词)","examples":[{"en":"I am tired of eating noodles for breakfast every day.","cn":"我厌倦了每天早餐吃面条。"},{"en":"The class is tired of the same math exercises every week.","cn":"全班都厌倦了每周做同样的数学练习。"}],"socratic_questions":[{"question":"你连续一周每天吃同样的午餐，现在看到那个饭盒就觉得没胃口，你是什么感觉？","answer_hint":"这个短语表示因为重复或太久而产生厌烦情绪，不是身体累，而是心理上不想再继续。"}],"fill_blank":{"sentences":["After three hours of waiting, the children ___ ___ ___ the long line."],"options":["were tired of","were excited about","were good at","were afraid of"],"correct_index":0},"audio":"Unit6/audio/be_tired_of.mp3","audio_ex0":"Unit6/audio/be_tired_of_ex0.mp3","audio_ex1":"Unit6/audio/be_tired_of_ex1.mp3"},{"word":"able","ipa":"/ˈeɪbl/","image_prompts":["A small sapling growing out of a crack in a concrete pavement, sunlight shining on its green leaves, showing strength and possibility.","A completed 1000-piece jigsaw puzzle on a wooden table, the last piece being placed into the center, a magnifying glass nearby."],"image_desc_en":"A sapling growing through concrete; a completed jigsaw puzzle with the last piece being placed.","image_desc_cn":"一棵从混凝土裂缝中长出的小树苗；一幅完成的拼图，最后一块正在放入。","meaning_cn":"能够；有能力的","usage":"adj. (常用 be able to do sth.)","collocations":"be able to do, able to finish, able to solve","preposition_combos":"able to (后接动词原形)","examples":[{"en":"With enough practice, you will be able to play the piano well.","cn":"通过足够的练习，你将能够弹好钢琴。"},{"en":"She was able to finish the test before the bell rang.","cn":"她能够在铃响前完成测试。"}],"socratic_questions":[{"question":"你经过一个月的练习，终于可以连续跳绳100次而不中断，你具备了这种能力，用哪个词？","answer_hint":"这个词表示具备做某事的能力或条件，后面常跟 to do。"}],"fill_blank":{"sentences":["With the new map app, we were ___ to find the museum easily."],"options":["able","unable","possible","sure"],"correct_index":0},"audio":"Unit6/audio/able.mp3","audio_ex0":"Unit6/audio/able_ex0.mp3","audio_ex1":"Unit6/audio/able_ex1.mp3"},{"word":"stick","ipa":"/stɪk/","image_prompts":["A wooden stick lying on a pile of autumn leaves, sunlight filtering through trees","A glue stick half-used on a white desk next to a torn piece of paper"],"image_desc_en":"A wooden stick on autumn leaves; a glue stick on a desk with torn paper.","image_desc_cn":"一根木棍躺在秋叶堆上；一支用了一半的胶棒放在白色桌面上，旁边有撕破的纸。","meaning_cn":"v. 粘贴；卡住；坚持 n. 棍子；枝条","usage":"v. (过去式 stuck, 过去分词 stuck) / n. (可数名词)","collocations":"stick to, stick with, stick out, glue stick","preposition_combos":"stick to (坚持/粘在), stick in (卡在), stick on (贴在)","examples":[{"en":"I stuck a note on the fridge for my mom.","cn":"我在冰箱上贴了一张便条给妈妈。"},{"en":"The key stuck in the lock and would not move.","cn":"钥匙卡在锁里动不了了。"}],"socratic_questions":[{"question":"你想把一张照片贴到日记本上，需要用什么动作？","answer_hint":"这个动作表示用胶水或胶带固定，不是钉或夹。"}],"fill_blank":{"sentences":["The stamp won't ___ on the envelope because it's wet."],"options":["stick","stay","stand","strike"],"correct_index":0},"audio":"Unit6/audio/stick.mp3","audio_ex0":"Unit6/audio/stick_ex0.mp3","audio_ex1":"Unit6/audio/stick_ex1.mp3"},{"word":"stick to sth","ipa":"/stɪk tuː ˈsʌmθɪŋ/","image_prompts":["A daily planner with a red pen marking each completed task, a coffee cup beside it","A running track with white lane lines and a pair of worn running shoes at the start line"],"image_desc_en":"A planner with red checkmarks and a coffee cup; a track with lane lines and worn shoes.","image_desc_cn":"一本计划表上红色笔勾出已完成任务，旁边有咖啡杯；一条跑道上有白色分道线和一双旧跑鞋。","meaning_cn":"坚持（做某事）；遵守（计划、原则等）","usage":"动词短语 (过去式 stuck to, 过去分词 stuck to)","collocations":"stick to a plan, stick to a diet, stick to the rules","preposition_combos":"stick to (后接名词或动名词)","examples":[{"en":"You should stick to your study plan every day.","cn":"你应该每天坚持你的学习计划。"},{"en":"He stuck to his decision even when others disagreed.","cn":"即使别人不同意，他也坚持自己的决定。"}],"socratic_questions":[{"question":"你定了一个每天背20个单词的计划，但第三天就想放弃。你需要做什么？","answer_hint":"这个短语强调不改变、不放弃，和‘坚持’意思一样。"}],"fill_blank":{"sentences":["If you want to improve your English, you must ___ your daily practice."],"options":["stick to","give up","look for","put off"],"correct_index":0},"audio":"Unit6/audio/stick_to_sth.mp3","audio_ex0":"Unit6/audio/stick_to_sth_ex0.mp3","audio_ex1":"Unit6/audio/stick_to_sth_ex1.mp3"},{"word":"resolution","ipa":"/ˌrezəˈluːʃn/","image_prompts":["A calendar on a wall with January 1 circled in red and a list of goals written below","A notebook open to a page with bullet points: 'Exercise 3 times a week, Read 2 books a month'"],"image_desc_en":"A wall calendar with Jan 1 circled and a goal list; a notebook with bullet-pointed goals.","image_desc_cn":"墙上日历中1月1日被红笔圈出，下方列着目标清单；一本笔记本上写着要点式目标。","meaning_cn":"n. 决心；决定；决议","usage":"n. (可数名词，复数 resolutions)","collocations":"make a resolution, New Year's resolution, keep a resolution","preposition_combos":"resolution to do sth, resolution about sth","examples":[{"en":"My New Year's resolution is to exercise more often.","cn":"我的新年决心是多锻炼。"},{"en":"She made a resolution to finish her homework before dinner.","cn":"她下定决心在晚饭前完成作业。"}],"socratic_questions":[{"question":"新年到了，你决定今年要早睡早起。这个决定叫什么？","answer_hint":"这个词常和‘新年’搭配，表示一个正式或郑重的决定。"}],"fill_blank":{"sentences":["Tom made a ___ to save money for a new bike."],"options":["resolution","decision","promise","plan"],"correct_index":0},"audio":"Unit6/audio/resolution.mp3","audio_ex0":"Unit6/audio/resolution_ex0.mp3","audio_ex1":"Unit6/audio/resolution_ex1.mp3"},{"word":"have","ipa":"/hæv/","image_prompts":["A kitchen table with a plate of pancakes, a glass of orange juice, and a fork","A bookshelf filled with colorful books, a small globe on the shelf edge"],"image_desc_en":"A table with pancakes and orange juice; a bookshelf with books and a globe.","image_desc_cn":"一张餐桌上有煎饼和橙汁；一个书架上摆满彩色书籍，边缘放着小地球仪。","meaning_cn":"v. 有；拥有；吃；喝；进行（活动）","usage":"v. (过去式 had, 过去分词 had; 第三人称单数 has)","collocations":"have breakfast, have a good time, have a test, have to","preposition_combos":"have + 名词（无固定介词搭配，但常接 for + 餐名）","examples":[{"en":"We usually have lunch at twelve o'clock.","cn":"我们通常十二点吃午饭。"},{"en":"She has a new bicycle that her parents gave her.","cn":"她有一辆父母给她的新自行车。"}],"socratic_questions":[{"question":"你早上饿了，想描述你吃了面包和牛奶，该用哪个动词？","answer_hint":"这个动词既可以表示‘拥有’，也可以表示‘吃/喝’。"}],"fill_blank":{"sentences":["I usually ___ a glass of milk before going to bed."],"options":["have","eat","drink","take"],"correct_index":0},"audio":"Unit6/audio/have.mp3","audio_ex0":"Unit6/audio/have_ex0.mp3","audio_ex1":"Unit6/audio/have_ex1.mp3"},{"word":"mini-goal","ipa":"/ˈmɪni ɡoʊl/","image_prompts":["A whiteboard with a large goal written at the top and three smaller checkboxes labeled Step 1, Step 2, Step 3 below it, marker lines connecting them","A staircase made of wooden blocks, each block labeled with a small task like 'read 10 pages' and a tiny flag on the top block"],"image_desc_en":"A whiteboard with a large goal at the top and three smaller checkboxes labeled Step 1, Step 2, Step 3 below, connected by marker lines.","image_desc_cn":"一块白板，顶部写有大目标，下方有三个标有步骤1、2、3的小复选框，用马克笔线条连接。","meaning_cn":"小目标；阶段性目标","usage":"名词 n. (可数，复数 mini-goals)","collocations":"set a mini-goal, achieve a mini-goal, break into mini-goals","preposition_combos":"mini-goal for, mini-goal of","examples":[{"en":"I set a mini-goal to finish my math homework before dinner.","cn":"我设定了一个小目标，在晚饭前完成数学作业。"},{"en":"Breaking a big task into mini-goals makes it easier to start.","cn":"把大任务分解成小目标会让开始变得更容易。"}],"socratic_questions":[{"question":"你想提高英语成绩，但觉得背100个单词太难了。如果先只背10个，这10个单词可以叫什么？","answer_hint":"这个词由“迷你”和“目标”组成，表示一个很小的、容易完成的目标。"}],"fill_blank":{"sentences":["To finish the project on time, we should break it into several ___."],"options":["mini-goals","dreams","problems","reasons"],"correct_index":0},"audio":"Unit6/audio/mini-goal.mp3","audio_ex0":"Unit6/audio/mini-goal_ex0.mp3","audio_ex1":"Unit6/audio/mini-goal_ex1.mp3"},{"word":"achieve","ipa":"/əˈtʃiːv/","image_prompts":["A gold trophy sitting on a wooden podium with a red ribbon tied around its base, soft spotlight from above","A stack of books with a graduation cap on top, a certificate leaning against the books"],"image_desc_en":"A gold trophy on a wooden podium with a red ribbon, lit by a soft spotlight from above.","image_desc_cn":"一个金色奖杯放在木质领奖台上，底座系着红丝带，上方有柔和的聚光灯。","meaning_cn":"实现；达到；取得","usage":"动词 v. (过去式 achieved, 过去分词 achieved)","collocations":"achieve a goal, achieve success, achieve a dream","preposition_combos":"achieve in, achieve through","examples":[{"en":"She worked hard to achieve her dream of winning the race.","cn":"她努力实现了赢得比赛的梦想。"},{"en":"You can achieve good grades if you study every day.","cn":"如果你每天学习，就能取得好成绩。"}],"socratic_questions":[{"question":"你每天练习弹钢琴，最后终于能在音乐会上演奏一首完整的曲子。这个结果可以用哪个词描述？","answer_hint":"这个词表示通过努力最终成功完成某件事，常和“目标”“梦想”搭配。"}],"fill_blank":{"sentences":["With enough practice, you can ___ anything you set your mind to."],"options":["achieve","forget","avoid","destroy"],"correct_index":0},"audio":"Unit6/audio/achieve.mp3","audio_ex0":"Unit6/audio/achieve_ex0.mp3","audio_ex1":"Unit6/audio/achieve_ex1.mp3"},{"word":"physical","ipa":"/ˈfɪzɪkəl/","image_prompts":["A set of dumbbells and a yoga mat on a wooden floor, a water bottle beside them","A bicycle parked next to a running track with white lane markings, morning sunlight"],"image_desc_en":"A set of dumbbells and a yoga mat on a wooden floor with a water bottle beside them.","image_desc_cn":"一组哑铃和一张瑜伽垫放在木地板上，旁边有一个水瓶。","meaning_cn":"身体的；物理的；体力的","usage":"形容词 adj. (副词形式 physically)","collocations":"physical health, physical activity, physical education","preposition_combos":"physical for, physical in","examples":[{"en":"Doing physical exercise every morning helps me stay healthy.","cn":"每天早上做体育锻炼有助于我保持健康。"},{"en":"The school has a new gym for physical education classes.","cn":"学校有一个新的体育馆用于体育课。"}],"socratic_questions":[{"question":"老师让你多运动，比如跑步、游泳，这些和身体有关的活动可以用哪个形容词？","answer_hint":"这个词和“身体”有关，常用来描述运动、健康或体力活动。"}],"fill_blank":{"sentences":["Regular ___ activity can improve your mood and energy levels."],"options":["physical","mental","musical","digital"],"correct_index":0},"audio":"Unit6/audio/physical.mp3","audio_ex0":"Unit6/audio/physical_ex0.mp3","audio_ex1":"Unit6/audio/physical_ex1.mp3"},{"word":"health","ipa":"/helθ/","image_prompts":["A fresh green salad in a white bowl with cherry tomatoes and cucumber slices, natural light","A glass of water and an apple on a wooden table next to a small potted plant"],"image_desc_en":"A fresh green salad in a white bowl with cherry tomatoes and cucumber slices under natural light.","image_desc_cn":"一碗新鲜绿色沙拉放在白色碗里，有樱桃番茄和黄瓜片，在自然光下。","meaning_cn":"健康；健康状况","usage":"名词 n. (不可数；形容词形式 healthy)","collocations":"good health, in poor health, health problem, health care","preposition_combos":"health of, for health","examples":[{"en":"Eating fruits and vegetables is important for your health.","cn":"吃水果和蔬菜对你的健康很重要。"},{"en":"The doctor gave us some advice about keeping good health.","cn":"医生给了我们一些关于保持良好健康的建议。"}],"socratic_questions":[{"question":"你最近总是熬夜，妈妈很担心你的身体状态。她担心的是你的什么？","answer_hint":"这个词指身体没有生病、状态良好的情况，常和“保持”“关心”搭配。"}],"fill_blank":{"sentences":["Drinking enough water every day is good for your ___."],"options":["health","wealth","height","weight"],"correct_index":0},"audio":"Unit6/audio/health.mp3","audio_ex0":"Unit6/audio/health_ex0.mp3","audio_ex1":"Unit6/audio/health_ex1.mp3"},{"word":"healthily","ipa":"/ˈhelθɪli/","image_prompts":["A wooden cutting board with fresh vegetables and a glass of water, bright natural light from a window","A bowl of oatmeal topped with berries and nuts on a white tablecloth, steam rising gently"],"image_desc_en":"A wooden cutting board with fresh vegetables and a glass of water, bright natural light from a window","image_desc_cn":"一块木砧板上放着新鲜蔬菜和一杯水，明亮的自然光从窗户照入","meaning_cn":"健康地","usage":"adv. (副词，由形容词 healthy + -ly 构成)","collocations":"eat healthily, live healthily, grow healthily","preposition_combos":"无固定介词搭配","examples":[{"en":"To pass the exam, you should eat healthily and sleep well.","cn":"为了通过考试，你应该健康饮食并睡好觉。"},{"en":"The plants in the garden grow healthily under the warm sun.","cn":"花园里的植物在温暖的阳光下健康生长。"}],"socratic_questions":[{"question":"小明最近总吃炸鸡和薯条，你觉得他这样饮食方式对身体好吗？应该用什么词来描述正确的饮食方式？","answer_hint":"这个词强调“以健康的方式”，不是单纯说“健康”这个状态，而是修饰动作“吃”。"}],"fill_blank":{"sentences":["My grandmother always tells me to eat ___ and exercise every day."],"options":["healthily","healthy","health","unhealthy"],"correct_index":0},"audio":"Unit6/audio/healthily.mp3","audio_ex0":"Unit6/audio/healthily_ex0.mp3","audio_ex1":"Unit6/audio/healthily_ex1.mp3"},{"word":"take up","ipa":"/teɪk ʌp/","image_prompts":["A pair of running shoes placed on a gym floor next to a water bottle, laces untied","An open guitar case on a wooden floor with a guitar leaning inside, sheet music nearby"],"meaning_cn":"开始从事（某项活动或爱好）","usage":"v. (动词短语，过去式 took up, 过去分词 taken up)","collocations":"take up a hobby, take up a sport, take up photography","preposition_combos":"take up + 名词（活动/爱好）","examples":[{"en":"I plan to take up swimming this summer to get stronger.","cn":"我计划今年夏天开始学游泳来变得更强壮。"},{"en":"She decided to take up painting after visiting the art museum.","cn":"参观艺术博物馆后，她决定开始学绘画。"}],"socratic_questions":[{"question":"你的朋友最近觉得放学后很无聊，想学点新东西，比如弹吉他或打篮球。你会建议他“开始做”哪件事？用什么短语表达“开始做”这个意思？","answer_hint":"这个短语由两个词组成，表示“开始从事一项新的活动”，不是“拿起”物品的意思。"}],"fill_blank":{"sentences":["My brother wants to ___ a new hobby like playing the piano."],"options":["take up","take off","take away","take down"],"correct_index":0},"audio":"Unit6/audio/take_up.mp3","audio_ex0":"Unit6/audio/take_up_ex0.mp3","audio_ex1":"Unit6/audio/take_up_ex1.mp3"},{"word":"photography","ipa":"/fəˈtɒɡrəfi/","image_prompts":["A vintage camera on a wooden table with a roll of film and a developed photo showing a landscape","A close-up of a camera lens reflecting a sunset sky, with a blurred background of trees"],"meaning_cn":"摄影；摄影艺术","usage":"n. (不可数名词)","collocations":"digital photography, wildlife photography, photography club","preposition_combos":"in photography, photography of + 对象","examples":[{"en":"Our school photography club meets every Friday afternoon in Room 201.","cn":"我们学校摄影社每周五下午在201教室活动。"},{"en":"He showed us his photography of the mountains during the trip.","cn":"他向我们展示了旅行中拍摄的山景照片。"}],"socratic_questions":[{"question":"学校要办一个社团展览，你想展示用相机拍下的校园美景。这个用相机记录画面的活动叫什么？","answer_hint":"这个词以 -graphy 结尾，指的是“用相机拍摄照片的艺术或活动”，不是指相机本身。"}],"fill_blank":{"sentences":["I joined the school ___ club to learn how to take better pictures."],"options":["photography","photograph","photographer","photo"],"correct_index":0},"audio":"Unit6/audio/photography.mp3","audio_ex0":"Unit6/audio/photography_ex0.mp3","audio_ex1":"Unit6/audio/photography_ex1.mp3"},{"word":"self-improvement","ipa":"/ˌself ɪmˈpruːvmənt/","image_prompts":["An open notebook on a desk with a pen and a list titled 'Goals', a small plant beside it","A stack of books on a shelf with titles like 'Learn New Skills' and 'Be Better', soft lamp light"],"meaning_cn":"自我提升；自我完善","usage":"n. (不可数名词，由 self- + improvement 构成)","collocations":"self-improvement plan, self-improvement book, focus on self-improvement","preposition_combos":"for self-improvement, through self-improvement","examples":[{"en":"Reading books every day is a great way for self-improvement.","cn":"每天读书是自我提升的好方法。"},{"en":"She made a self-improvement plan to learn English and exercise more.","cn":"她制定了一个自我提升计划，包括学英语和多锻炼。"}],"socratic_questions":[{"question":"你想在新学期让自己变得更好，比如提高成绩、学会新技能。这种让自己进步的过程叫什么？","answer_hint":"这个词由“自己”和“改进”两个部分合成，强调个人主动让自己变得更好，不是别人帮你。"}],"fill_blank":{"sentences":["Setting small goals every week helps with ___."],"options":["self-improvement","selfishness","self-confidence","self-service"],"correct_index":0},"audio":"Unit6/audio/self-improvement.mp3","audio_ex0":"Unit6/audio/self-improvement_ex0.mp3","audio_ex1":"Unit6/audio/self-improvement_ex1.mp3"},{"word":"confident","ipa":"/ˈkɒnfɪdənt/","image_prompts":["A neatly stacked pile of exam papers with a red A+ mark on top, bright sunlight streaming across the desk","A microphone standing alone on an empty stage with a single spotlight shining down, no person visible"],"image_desc_en":"A pile of exam papers with a red A+ mark on top, bright sunlight on a desk","image_desc_cn":"一叠考试卷，最上面一张有红色A+标记，明亮的阳光照在书桌上","meaning_cn":"自信的；有信心的","usage":"adj. (比较级 more confident, 最高级 most confident; 副词 confidently)","collocations":"feel confident, be confident about, confident smile","preposition_combos":"confident about, confident in","examples":[{"en":"She felt confident before the math exam because she studied hard.","cn":"她在数学考试前感到自信，因为她努力学习。"},{"en":"A confident speaker uses clear words and a strong voice.","cn":"自信的演讲者使用清晰的词语和有力的声音。"}],"socratic_questions":[{"question":"小明复习了整整一周，走进考场时心里很踏实，觉得自己一定能考好。这种心态用一个形容词怎么描述？","answer_hint":"这个词表示对自己能力有把握、不紧张，和‘相信’有关。"}],"fill_blank":{"sentences":["She is ___ that she can finish the project on time."],"options":["confident","nervous","worried","shy"],"correct_index":0},"audio":"Unit6/audio/confident.mp3","audio_ex0":"Unit6/audio/confident_ex0.mp3","audio_ex1":"Unit6/audio/confident_ex1.mp3"},{"word":"organized","ipa":"/ˈɔːrɡənaɪzd/","image_prompts":["A neatly arranged desk with color-coded folders, labeled binders, and a tidy pencil holder","A calendar on a wall with each day filled in different colors, showing a structured weekly schedule"],"image_desc_en":"A clean desk with color-coded folders and binders, and a wall calendar with a structured weekly schedule.","image_desc_cn":"一张整洁的桌子，上面有颜色分类的文件夹和活页夹，以及墙上显示结构化周计划的日历。","meaning_cn":"有条理的；有组织的（adj.）","usage":"adj. (organized) 形容人或事物安排有序、系统化。动词原形：organize (v.)；过去式/过去分词：organized (v.)；名词：organization (n.)","collocations":"well-organized; organized person; organized event","preposition_combos":"organized by; organized into","examples":[{"en":"She keeps her schoolbag very organized with separate folders.","cn":"她用分开的文件夹把书包整理得很有条理。"},{"en":"An organized study plan helps you prepare for exams.","cn":"有条理的学习计划有助于你准备考试。"}],"socratic_questions":[{"question":"如果你的书桌很乱，找不到笔和书，而同桌的书桌每样东西都放得整整齐齐，你会怎么形容同桌？","answer_hint":"这个词表示“有条理的”，形容做事或物品摆放很有秩序。"}],"fill_blank":{"sentences":["A ___ student always finishes homework on time."],"options":["organized","lazy","noisy","careless"],"correct_index":0},"audio":"Unit6/audio/organized.mp3","audio_ex0":"Unit6/audio/organized_ex0.mp3","audio_ex1":"Unit6/audio/organized_ex1.mp3"},{"word":"wisely","ipa":"/ˈwaɪzli/","image_prompts":["A piggy bank with a few coins next to a calculator, symbolizing saving money carefully","A library shelf with a single open book and a lamp, suggesting thoughtful reading choice"],"image_desc_en":"A piggy bank with coins and a calculator, and a library shelf with an open book under a lamp.","image_desc_cn":"一个存钱罐旁边放着几枚硬币和一个计算器，以及图书馆书架上在台灯下打开的一本书。","meaning_cn":"明智地；聪明地（adv.）","usage":"adv. (wisely) 修饰动词，表示以明智、有智慧的方式行事。形容词：wise (adj.)；名词：wisdom (n.)","collocations":"use wisely; spend wisely; choose wisely","preposition_combos":"无固定介词搭配","examples":[{"en":"You should spend your pocket money wisely on useful things.","cn":"你应该明智地把零花钱花在有用的东西上。"},{"en":"He wisely decided to review the notes before the test.","cn":"他明智地决定在考试前复习笔记。"}],"socratic_questions":[{"question":"考试前，有的同学通宵玩游戏，有的同学早早睡觉养足精神。哪种做法更聪明？可以用哪个副词来形容？","answer_hint":"这个词表示“明智地”，形容做出好的、聪明的决定。"}],"fill_blank":{"sentences":["To save time, she ___ chose the shortest route to school."],"options":["wisely","quickly","loudly","angrily"],"correct_index":0},"audio":"Unit6/audio/wisely.mp3","audio_ex0":"Unit6/audio/wisely_ex0.mp3","audio_ex1":"Unit6/audio/wisely_ex1.mp3"},{"word":"possible","ipa":"/ˈpɑːsəbl/","image_prompts":["A calendar with a circled date and a checkmark, indicating a deadline that can be met","A puzzle piece fitting perfectly into a gap, showing that completion is achievable"],"image_desc_en":"A calendar with a circled date and checkmark, and a puzzle piece fitting into a gap.","image_desc_cn":"一个日历上圈出日期并打勾，以及一块拼图完美嵌入空缺中。","meaning_cn":"可能的（adj.）","usage":"adj. (possible) 表示某事可以发生或做到。副词：possibly (adv.)；名词：possibility (n.)；反义词：impossible (adj.)","collocations":"as soon as possible; it is possible to; make it possible","preposition_combos":"possible for; possible with","examples":[{"en":"It is possible to finish the project before Friday.","cn":"在周五之前完成这个项目是可能的。"},{"en":"Please reply to the email as soon as possible.","cn":"请尽快回复这封邮件。"}],"socratic_questions":[{"question":"老师布置了一个很难的任务，你觉得完不成，但同桌说“只要努力，这件事是______的”。这里缺什么词？","answer_hint":"这个词表示“可能的”，强调事情有希望实现。"}],"fill_blank":{"sentences":["Is it ___ to learn English well in one year?"],"options":["possible","impossible","important","popular"],"correct_index":0},"audio":"Unit6/audio/possible.mp3","audio_ex0":"Unit6/audio/possible_ex0.mp3","audio_ex1":"Unit6/audio/possible_ex1.mp3"},{"word":"paragraph","ipa":"/ˈpærəɡrɑːf/","image_prompts":["An open notebook with three distinct blocks of text separated by blank lines, each block starting with an indentation","A page from a textbook with a highlighted section labeled 'Paragraph 2' in the margin"],"image_desc_en":"An open notebook with three distinct blocks of text separated by blank lines, each block starting with an indentation","image_desc_cn":"一本打开的笔记本，有三块文字被空行隔开，每块开头有缩进","meaning_cn":"段落","usage":"n. (复数 paragraphs)","collocations":"write a paragraph, first paragraph, main idea of the paragraph","preposition_combos":"in the paragraph, paragraph about","examples":[{"en":"Each paragraph should have one main idea.","cn":"每个段落应该有一个主要观点。"},{"en":"Read the second paragraph and answer the question.","cn":"阅读第二段并回答问题。"}],"socratic_questions":[{"question":"写作文时，老师要求你把内容分成几个部分，每个部分讲一个意思，开头要空两格。这些部分叫什么？","answer_hint":"这个词指文章中由几个句子组成的一个完整单元，通常有缩进。"}],"fill_blank":{"sentences":["The first ___ of the article describes the writer's hobby."],"options":["paragraph","sentence","word","page"],"correct_index":0},"audio":"Unit6/audio/paragraph.mp3","audio_ex0":"Unit6/audio/paragraph_ex0.mp3","audio_ex1":"Unit6/audio/paragraph_ex1.mp3"},{"word":"introduce","ipa":"/ˌɪntrəˈdjuːs/","image_prompts":["A hand holding a name card with a name written on it, placed on a desk next to a cup of coffee","A book cover with a title and author name, and a speech bubble saying 'Meet the author'"],"image_desc_en":"A hand holding a name card with a name written on it, placed on a desk next to a cup of coffee","image_desc_cn":"一只手拿着写有名字的名片，放在咖啡杯旁边的桌子上","meaning_cn":"介绍；引进","usage":"v. (过去式 introduced, 过去分词 introduced)","collocations":"introduce oneself, introduce a new topic, introduce a friend","preposition_combos":"introduce sb. to sb., introduce sth. into","examples":[{"en":"Let me introduce my best friend to you.","cn":"让我把我的好朋友介绍给你。"},{"en":"The teacher introduced a new game in class today.","cn":"老师今天在课堂上介绍了一个新游戏。"}],"socratic_questions":[{"question":"新学期班里来了新同学，你想让他认识大家，你会怎么做？用一个动词描述这个动作。","answer_hint":"这个词表示让两个人互相认识，或者把新事物展示给别人。"}],"fill_blank":{"sentences":["Can you ___ yourself to the new classmates?"],"options":["introduce","invite","include","imagine"],"correct_index":0},"audio":"Unit6/audio/introduce.mp3","audio_ex0":"Unit6/audio/introduce_ex0.mp3","audio_ex1":"Unit6/audio/introduce_ex1.mp3"},{"word":"meaning","ipa":"/ˈmiːnɪŋ/","image_prompts":["A dictionary open to a page with a word circled and a definition highlighted in yellow","A road sign with an arrow and a question mark drawn next to it, symbolizing the need to understand the sign's message"],"image_desc_en":"A dictionary open to a page with a word circled and a definition highlighted in yellow","image_desc_cn":"一本打开的词典，一个单词被圈出，定义被黄色高亮标记","meaning_cn":"意义；含义","usage":"n. (复数 meanings; 形容词 meaningful, 副词 meaningfully)","collocations":"the meaning of life, real meaning, understand the meaning","preposition_combos":"meaning of sth.","examples":[{"en":"What is the meaning of this new word?","cn":"这个新单词的意思是什么？"},{"en":"The gift has a special meaning for our family.","cn":"这份礼物对我们家有着特殊的意义。"}],"socratic_questions":[{"question":"读英语文章时遇到生词，你查词典想知道它代表什么。词典里给出的解释叫什么？","answer_hint":"这个词指一个词、符号或行为所表达的内容或概念。"}],"fill_blank":{"sentences":["Can you guess the ___ of the word from the sentence?"],"options":["meaning","spelling","sound","letter"],"correct_index":0},"audio":"Unit6/audio/meaning.mp3","audio_ex0":"Unit6/audio/meaning_ex0.mp3","audio_ex1":"Unit6/audio/meaning_ex1.mp3"},{"word":"fail","ipa":"/feɪl/","image_prompts":["A red F grade written on a white test paper with a broken pencil lying next to it","A wilted plant in a cracked pot with dry soil, no water droplets visible"],"image_desc_en":"A red F grade on a test paper with a broken pencil; a wilted plant in a cracked pot.","image_desc_cn":"试卷上红色的F等级和一支断铅笔；裂口花盆中枯萎的植物。","meaning_cn":"失败；未能做到；不及格","usage":"v. (过去式 failed, 过去分词 failed)","collocations":"fail an exam, fail to do sth, fail the test","preposition_combos":"fail in (sth), fail to (do)","examples":[{"en":"I hope I will not fail the math exam this time.","cn":"我希望这次数学考试不会不及格。"},{"en":"He failed to finish his homework on time yesterday.","cn":"他昨天没能按时完成作业。"}],"socratic_questions":[{"question":"小明复习了很久，但考试结果还是不如意，成绩单上有个红色的字母。这个结果叫什么？","answer_hint":"这个词表示没有达到目标或标准，常与考试或任务搭配。"}],"fill_blank":{"sentences":["She ___ the driving test because she was too nervous."],"options":["passed","failed","took","prepared"],"correct_index":1},"audio":"Unit6/audio/fail.mp3","audio_ex0":"Unit6/audio/fail_ex0.mp3","audio_ex1":"Unit6/audio/fail_ex1.mp3"},{"word":"yourself","ipa":"/jɔːrˈself/","image_prompts":["A mirror reflecting a clear image of a single backpack on a chair, no person visible","A handwritten note on a desk saying 'Believe in you' with a small star sticker"],"image_desc_en":"A mirror showing a backpack on a chair; a note saying 'Believe in you' on a desk.","image_desc_cn":"镜子中映出椅子上的背包；桌上写着‘相信自己’的便签和星星贴纸。","meaning_cn":"你自己","usage":"pron.","collocations":"by yourself, teach yourself, enjoy yourself, believe in yourself","preposition_combos":"by yourself, for yourself","examples":[{"en":"You can learn to play the guitar by yourself online.","cn":"你可以自己在网上学弹吉他。"},{"en":"Please take good care of yourself during the trip.","cn":"旅途中请好好照顾自己。"}],"socratic_questions":[{"question":"老师鼓励大家独立完成项目，不要总依赖别人。这个‘自己’用英语怎么说？","answer_hint":"这是一个反身代词，指代‘你’本人，常用于鼓励或提醒。"}],"fill_blank":{"sentences":["You should believe in ___ and try your best."],"options":["myself","yourself","himself","herself"],"correct_index":1},"audio":"Unit6/audio/yourself.mp3","audio_ex0":"Unit6/audio/yourself_ex0.mp3","audio_ex1":"Unit6/audio/yourself_ex1.mp3"},{"word":"engineer","ipa":"/ˌendʒɪˈnɪr/","image_prompts":["A blueprint of a bridge spread on a wooden table with a calculator and a hard hat","A model of a wind turbine on a desk next to a laptop showing a 3D design software"],"image_desc_en":"A bridge blueprint on a table with a calculator and hard hat; a wind turbine model beside a laptop with 3D design.","image_desc_cn":"桌上桥梁蓝图、计算器和安全帽；笔记本电脑旁的风力涡轮机模型和3D设计软件。","meaning_cn":"工程师","usage":"n. (复数 engineers)","collocations":"civil engineer, software engineer, mechanical engineer, become an engineer","preposition_combos":"engineer in (field), engineer for (company)","examples":[{"en":"My uncle works as a software engineer in a big company.","cn":"我叔叔在一家大公司做软件工程师。"},{"en":"The engineer designed a new bridge for the city last year.","cn":"这位工程师去年为城市设计了一座新桥。"}],"socratic_questions":[{"question":"有人设计高楼、桥梁或电脑程序，这种职业叫什么？","answer_hint":"这个词指运用科学和数学知识解决实际问题、设计建造的人。"}],"fill_blank":{"sentences":["He wants to be an ___ and build robots in the future."],"options":["artist","engineer","doctor","teacher"],"correct_index":1},"audio":"Unit6/audio/engineer.mp3","audio_ex0":"Unit6/audio/engineer_ex0.mp3","audio_ex1":"Unit6/audio/engineer_ex1.mp3"},{"word":"fashion","ipa":"/ˈfæʃn/","image_prompts":["A row of colorful dresses hanging on a rack in a boutique, soft lighting on fabric textures","A stack of fashion magazines with glossy covers showing seasonal clothing trends"],"image_desc_en":"A row of colorful dresses on a rack in a boutique, soft lighting highlighting fabric textures.","image_desc_cn":"精品店里一排彩色连衣裙挂在衣架上，柔和灯光凸显面料纹理。","meaning_cn":"时尚；时装","usage":"n. (可数/不可数)","collocations":"in fashion, out of fashion, fashion show, fashion magazine","preposition_combos":"fashion for, fashion in","examples":[{"en":"This s
