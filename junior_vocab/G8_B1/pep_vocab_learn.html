imple dress is always in fashion for school parties.","cn":"这条简单的裙子在学校派对上总是很时尚。"},{"en":"She bought a fashion magazine to learn about new styles.","cn":"她买了一本时尚杂志来了解新款式。"}],"socratic_questions":[{"question":"你看到同学们都在穿某种颜色的运动鞋，这种颜色最近很流行，可以用哪个词来形容这种流行趋势？","answer_hint":"这个词指流行的风格或趋势，常和'in'或'out of'搭配使用。"}],"fill_blank":{"sentences":["Long hair is no longer in ___ this year in our school."],"options":["fashion","style","design","trend"],"correct_index":0},"audio":"Unit6/audio/fashion.mp3","audio_ex0":"Unit6/audio/fashion_ex0.mp3","audio_ex1":"Unit6/audio/fashion_ex1.mp3"},{"word":"designer","ipa":"/dɪˈzaɪnər/","image_prompts":["A sketchbook open on a desk with pencil drawings of a chair and a lamp, ruler nearby","A sewing machine with a half-finished blue fabric on a wooden table, thread spools around"],"image_desc_en":"A sketchbook open on a desk with pencil drawings of a chair and a lamp, a ruler nearby.","image_desc_cn":"桌上摊开的速写本上有椅子和台灯的铅笔草图，旁边放着一把尺子。","meaning_cn":"设计师","usage":"n. (可数)","collocations":"fashion designer, graphic designer, interior designer, designer clothes","preposition_combos":"designer of","examples":[{"en":"The fashion designer showed new clothes at the spring show.","cn":"这位时装设计师在春季秀上展示了新衣服。"},{"en":"My cousin wants to become a designer of video games.","cn":"我表弟想成为一名电子游戏设计师。"}],"socratic_questions":[{"question":"有人专门为手机App设计好看的图标和界面，这种职业叫什么？","answer_hint":"这个词指创造新物品外观或功能的人，比如服装、家具或软件界面。"}],"fill_blank":{"sentences":["The ___ created a beautiful logo for our school club."],"options":["designer","teacher","doctor","driver"],"correct_index":0},"audio":"Unit6/audio/designer.mp3","audio_ex0":"Unit6/audio/designer_ex0.mp3","audio_ex1":"Unit6/audio/designer_ex1.mp3"},{"word":"director","ipa":"/dəˈrektər/","image_prompts":["A clapperboard on a film set with a camera and lighting equipment in the background","A large whiteboard with a timeline and sticky notes for a school play rehearsal schedule"],"image_desc_en":"A clapperboard on a film set with a camera and lighting equipment in the background.","image_desc_cn":"电影片场的一块场记板，背景是摄像机和灯光设备。","meaning_cn":"导演；主任","usage":"n. (可数)","collocations":"film director, school director, music director, director of","preposition_combos":"director of","examples":[{"en":"The film director asked the actors to practice the scene again.","cn":"电影导演让演员们再排练一遍这场戏。"},{"en":"Our school director gave a speech at the opening ceremony.","cn":"我们学校的主任在开幕式上发表了讲话。"}],"socratic_questions":[{"question":"学校文艺汇演时，有一个人负责指挥演员站位、安排灯光和音乐，这个人是什么角色？","answer_hint":"这个词指负责指导整个项目或演出的人，比如电影、戏剧或学校活动。"}],"fill_blank":{"sentences":["The ___ of the movie won an award for best picture."],"options":["director","actor","writer","singer"],"correct_index":0},"audio":"Unit6/audio/director.mp3","audio_ex0":"Unit6/audio/director_ex0.mp3","audio_ex1":"Unit6/audio/director_ex1.mp3"},{"word":"musician","ipa":"/mjuˈzɪʃn/","image_prompts":["A violin resting on a music stand with sheet music open, bow placed beside it","A set of drumsticks on a snare drum with scattered sheet music on a wooden floor"],"image_desc_en":"A violin resting on a music stand with open sheet music, a bow placed beside it.","image_desc_cn":"一把小提琴放在乐谱架上，乐谱翻开，琴弓放在旁边。","meaning_cn":"音乐家","usage":"n. (可数)","collocations":"professional musician, street musician, musician in a band","preposition_combos":"musician from, musician with","examples":[{"en":"The street musician played a beautiful song on his guitar.","cn":"街头音乐家用吉他弹奏了一首优美的歌曲。"},{"en":"Many young musicians practice hard to join the school band.","cn":"许多年轻音乐家刻苦练习，想加入学校乐队。"}],"socratic_questions":[{"question":"一个人能熟练演奏钢琴或小提琴，并且经常在音乐会上表演，他可以被称为什么？","answer_hint":"这个词指以演奏乐器或唱歌为职业或爱好的人。"}],"fill_blank":{"sentences":["The ___ played the piano so well that everyone clapped."],"options":["musician","doctor","teacher","farmer"],"correct_index":0},"audio":"Unit6/audio/musician.mp3","audio_ex0":"Unit6/audio/musician_ex0.mp3","audio_ex1":"Unit6/audio/musician_ex1.mp3"},{"word":"fireman","ipa":"/ˈfaɪərmən/","image_prompts":["A red fire truck parked in front of a burning building with water spraying from a hose, smoke rising into the sky","A yellow fire helmet resting on a wooden bench next to a coiled fire hose and a fire extinguisher"],"image_desc_en":"A fireman's helmet and equipment on a bench, with a fire truck in the background","image_desc_cn":"消防员的头盔和设备放在长凳上，背景是消防车","meaning_cn":"消防员（单数）","usage":"n. (可数名词，复数 firemen)","collocations":"brave fireman, fireman's uniform, call a fireman","preposition_combos":"fireman at the station, fireman with a hose","examples":[{"en":"The fireman quickly put out the kitchen fire.","cn":"消防员迅速扑灭了厨房火灾。"},{"en":"A fireman needs to stay calm in danger.","cn":"消防员在危险中需要保持冷静。"}],"socratic_questions":[{"question":"如果家里发生火灾，你会拨打119求助哪种职业的人？","answer_hint":"这个职业的人负责灭火和救援，穿着防护服，使用消防车和水管。"}],"fill_blank":{"sentences":["The ___ saved a cat from the tall tree."],"options":["fireman","teacher","doctor","pilot"],"correct_index":0},"audio":"Unit6/audio/fireman.mp3","audio_ex0":"Unit6/audio/fireman_ex0.mp3","audio_ex1":"Unit6/audio/fireman_ex1.mp3"},{"word":"firemen","ipa":"/ˈfaɪərmən/","image_prompts":["Three yellow helmets lined up on a shelf inside a fire station, with a red fire truck visible through the open garage door","A row of coiled fire hoses hanging on a wall in a fire station, with boots placed neatly below"],"image_desc_en":"Multiple firemen helmets and equipment in a fire station","image_desc_cn":"消防站里多个消防员的头盔和设备","meaning_cn":"消防员（复数）","usage":"n. (fireman 的复数形式)","collocations":"two firemen, firemen in action, firemen's training","preposition_combos":"firemen from the station, firemen with ladders","examples":[{"en":"The firemen arrived at the burning house in five minutes.","cn":"消防员们在五分钟内到达了着火的房子。"},{"en":"All firemen must practice using the hose every week.","cn":"所有消防员必须每周练习使用水管。"}],"socratic_questions":[{"question":"一场大火需要多名专业人员一起扑救，这些人的复数称呼是什么？","answer_hint":"这个词是 fireman 的复数形式，表示不止一位消防员。"}],"fill_blank":{"sentences":["The ___ worked together to control the forest fire."],"options":["firemen","fireman","policemen","doctors"],"correct_index":0},"audio":"Unit6/audio/firemen.mp3","audio_ex0":"Unit6/audio/firemen_ex0.mp3","audio_ex1":"Unit6/audio/firemen_ex1.mp3"},{"word":"AI","ipa":"/ˌeɪ ˈaɪ/","image_prompts":["A glowing blue circuit board shaped like a human brain on a dark desk, with small lights blinking","A laptop screen displaying a chat interface with a robot icon and flowing text lines"],"image_desc_en":"A circuit board brain and a laptop with AI chat interface","image_desc_cn":"电路板大脑和显示AI聊天界面的笔记本电脑","meaning_cn":"人工智能（缩写）","usage":"n. (不可数名词，缩写自 Artificial Intelligence)","collocations":"AI technology, use AI, AI program, AI assistant","preposition_combos":"AI in education, AI for learning","examples":[{"en":"AI can help students practice English pronunciation at home.","cn":"人工智能可以帮助学生在家练习英语发音。"},{"en":"Many schools now use AI to create study plans.","cn":"许多学校现在使用人工智能来制定学习计划。"}],"socratic_questions":[{"question":"现在有一种技术能让电脑像人一样思考和学习，比如帮你翻译句子或推荐歌曲，它叫什么？","answer_hint":"这是 Artificial Intelligence 的缩写，两个大写字母，常出现在科技新闻中。"}],"fill_blank":{"sentences":["___ can help doctors find diseases faster."],"options":["AI","A.I.","Ai","ai"],"correct_index":0},"audio":"Unit6/audio/AI.mp3","audio_ex0":"Unit6/audio/AI_ex0.mp3","audio_ex1":"Unit6/audio/AI_ex1.mp3"},{"word":"intelligence","ipa":"/ɪnˈtelɪdʒəns/","image_prompts":["An open book with a glowing light bulb above it on a wooden table, surrounded by pencils and notes","A chessboard with pieces arranged in a complex pattern, a clock ticking beside it"],"image_desc_en":"A book with a light bulb and a chessboard with pieces","image_desc_cn":"一本书和灯泡，以及摆有棋子的棋盘","meaning_cn":"智力；情报；智能","usage":"n. (不可数名词)","collocations":"high intelligence, artificial intelligence, use intelligence, develop intelligence","preposition_combos":"intelligence in solving problems, intelligence of a machine","examples":[{"en":"Reading books can improve your intelligence over time.","cn":"读书可以逐渐提高你的智力。"},{"en":"The robot showed great intelligence in finding the exit.","cn":"机器人在寻找出口时展现了很高的智能。"}],"socratic_questions":[{"question":"一个人很聪明，能快速解决难题，这种能力叫什么？","answer_hint":"这个词和“聪明”有关，也出现在“人工智能”这个短语中。"}],"fill_blank":{"sentences":["Puzzles and games can help develop a child's ___."],"options":["intelligence","muscle","height","weight"],"correct_index":0},"audio":"Unit6/audio/intelligence.mp3","audio_ex0":"Unit6/audio/intelligence_ex0.mp3","audio_ex1":"Unit6/audio/intelligence_ex1.mp3"},{"word":"essay","ipa":"/ˈeseɪ/","image_prompts":["A neatly typed page on a wooden desk with a red pen and a cup of coffee beside it, soft morning light","A stack of handwritten papers with blue ink on a white table, a dictionary open nearby"],"image_desc_en":"A typed page on a desk with a red pen and coffee cup, soft morning light.","image_desc_cn":"一张打印好的作文纸放在木桌上，旁边有红笔和咖啡杯，晨光柔和。","meaning_cn":"n. 文章；短文；散文；论文","usage":"n. (可数名词，复数 essays)","collocations":"write an essay, essay topic, short essay, essay contest","preposition_combos":"essay on/about sth","examples":[{"en":"I need to write an essay about my summer vacation.","cn":"我需要写一篇关于暑假的作文。"},{"en":"Her essay on environmental protection won first prize.","cn":"她关于环境保护的作文获得了一等奖。"}],"socratic_questions":[{"question":"老师让你写一篇关于‘我的梦想’的短文，大概300词，这种文体叫什么？","answer_hint":"这个词通常指学校布置的短文或作文，不是诗歌或小说。"}],"fill_blank":{"sentences":["She spent two hours finishing her ___ on Chinese history."],"options":["essay","novel","poem","diary"],"correct_index":0},"audio":"Unit6/audio/essay.mp3","audio_ex0":"Unit6/audio/essay_ex0.mp3","audio_ex1":"Unit6/audio/essay_ex1.mp3"},{"word":"classic","ipa":"/ˈklæsɪk/","image_prompts":["An old leather-bound book with gold lettering on a library shelf, dust particles in sunlight","A vintage black-and-white film poster on a brick wall with faded edges"],"image_desc_en":"An old leather-bound book with gold lettering on a library shelf, dust in sunlight.","image_desc_cn":"一本旧皮装书，烫金书名放在图书馆书架上，阳光中飘着灰尘。","meaning_cn":"adj. 经典的；典型的；n. 经典作品","usage":"adj. (无比较级) / n. (可数名词，复数 classics)","collocations":"classic novel, classic example, classic style, modern classic","preposition_combos":"a classic of literature","examples":[{"en":"This classic novel is still popular among young readers.","cn":"这本经典小说在年轻读者中仍然很受欢迎。"},{"en":"The teacher gave us a classic example of cause and effect.","cn":"老师给我们举了一个因果关系的经典例子。"}],"socratic_questions":[{"question":"有一本书出版了几十年，至今还被很多人阅读和推荐，我们通常怎么形容它？","answer_hint":"这个词表示经过时间考验、具有持久价值的作品或事物。"}],"fill_blank":{"sentences":["The movie is a ___ of science fiction from the 1980s."],"options":["classic","new","boring","short"],"correct_index":0},"audio":"Unit6/audio/classic.mp3","audio_ex0":"Unit6/audio/classic_ex0.mp3","audio_ex1":"Unit6/audio/classic_ex1.mp3"},{"word":"keep on doing sth","ipa":"/kiːp ɒn ˈduːɪŋ ˈsʌmθɪŋ/","image_prompts":["A clock on a wall with its hands spinning fast, a stack of books growing taller beside it","A treadmill with worn-out shoes on it, a water bottle half-empty, sweat drops on the floor"],"image_desc_en":"A clock with fast-spinning hands and a growing stack of books beside it.","image_desc_cn":"墙上时钟指针快速旋转，旁边一摞书越堆越高。","meaning_cn":"继续做某事；坚持做某事","usage":"v. (keep on doing sth，过去式 kept on doing sth，过去分词 kept on doing sth)","collocations":"keep on trying, keep on practicing, keep on working","preposition_combos":"keep on + v-ing","examples":[{"en":"You should keep on practicing English every day.","cn":"你应该坚持每天练习英语。"},{"en":"Even though it was hard, he kept on running.","cn":"尽管很难，他仍然坚持跑步。"}],"socratic_questions":[{"question":"你背单词背到一半觉得很累，但你想提醒自己不要停下来，应该用哪个短语？","answer_hint":"这个短语强调‘持续进行某个动作，不中断’。"}],"fill_blank":{"sentences":["If you want to improve, you must ___ ___ practicing every day."],"options":["keep on","give up","put off","look for"],"correct_index":0},"audio":"Unit6/audio/keep_on_doing_sth.mp3","audio_ex0":"Unit6/audio/keep_on_doing_sth_ex0.mp3","audio_ex1":"Unit6/audio/keep_on_doing_sth_ex1.mp3"},{"word":"make sure","ipa":"/meɪk ʃʊr/","image_prompts":["A checklist on a clipboard with a red checkmark next to each item, a pen lying on top","A locked padlock on a metal door, a key hanging on a hook nearby"],"image_desc_en":"A clipboard checklist with red checkmarks and a pen on top.","image_desc_cn":"一块带检查清单的书写板，每项旁有红色对勾，上面放着一支笔。","meaning_cn":"确保；确认；查明","usage":"v. (make sure，过去式 made sure，过去分词 made sure)","collocations":"make sure that..., make sure of sth, make sure to do sth","preposition_combos":"make sure of sth / make sure that + 从句","examples":[{"en":"Please make sure you lock the door before leaving.","cn":"离开前请确保锁好门。"},{"en":"Make sure to bring your ID card to the exam.","cn":"确保带身份证去考试。"}],"socratic_questions":[{"question":"考试前你检查了两次铅笔和橡皮，你是在做什么？","answer_hint":"这个短语表示‘确认某事无误或已经完成’。"}],"fill_blank":{"sentences":["___ ___ you have all the materials before the test starts."],"options":["Make sure","Look for","Think about","Give up"],"correct_index":0},"audio":"Unit6/audio/make_sure.mp3","audio_ex0":"Unit6/audio/make_sure_ex0.mp3","audio_ex1":"Unit6/audio/make_sure_ex1.mp3"},{"word":"try one","ipa":"/traɪ wʌn/","image_prompts":["A single red apple on a wooden table with a bite taken out, bright natural light","A closed book with a bookmark sticking out, resting on a desk next to a cup of tea"],"image_desc_en":"A single red apple with a bite taken out on a wooden table, bright natural light; a closed book with a bookmark on a desk next to a cup of tea","image_desc_cn":"一个被咬了一口的红苹果放在木桌上，明亮自然光；一本带书签的合上的书放在桌旁，旁边有一杯茶","meaning_cn":"尝试一个；试一下","usage":"v. (过去式 tried, 过去分词 tried) 尝试；试","collocations":"try one's best, try one's luck, try one's hand at","preposition_combos":"try for, try on, try out","examples":[{"en":"You should try one of these fresh cookies.","cn":"你应该尝一块这些新鲜饼干。"},{"en":"I will try one more time to solve the math problem.","cn":"我会再试一次解这道数学题。"}],"socratic_questions":[{"question":"朋友带来一盒新口味的饼干，你想尝一块，该用什么短语表达？","answer_hint":"用'try one'表示尝试其中一个，强调数量为一。"}],"fill_blank":{"sentences":["Why not ___ of these delicious cakes?"],"options":["try one","try two","try all","try none"],"correct_index":0},"audio":"Unit6/audio/try_one.mp3","audio_ex0":"Unit6/audio/try_one_ex0.mp3","audio_ex1":"Unit6/audio/try_one_ex1.mp3"},{"word":"literature","ipa":"/ˈlɪtərətʃər/","image_prompts":["A stack of classic novels with worn covers on a wooden shelf, soft library lighting","An open poetry book with a dried flower pressed between pages, on a windowsill"],"image_desc_en":"A stack of classic novels with worn covers on a wooden shelf, soft library lighting; an open poetry book with a dried flower pressed between pages on a windowsill","image_desc_cn":"一堆经典小说放在木书架上，封面磨损，柔和图书馆灯光；一本打开的诗集，书页间夹着一朵干花，放在窗台上","meaning_cn":"文学；文学作品","usage":"n. 不可数名词","collocations":"classic literature, modern literature, English literature, literature class","preposition_combos":"literature about, literature from","examples":[{"en":"We read classic literature in our English class.","cn":"我们在英语课上阅读经典文学。"},{"en":"This library has a large collection of world literature.","cn":"这个图书馆有大量的世界文学收藏。"}],"socratic_questions":[{"question":"英语课上老师让大家读《小王子》和《老人与海》，这些书属于哪一类？","answer_hint":"这些是文学作品，用'literature'表示文学或文学作品的总称。"}],"fill_blank":{"sentences":["She enjoys reading Chinese ___ in her free time."],"options":["literature","science","history","math"],"correct_index":0},"audio":"Unit6/audio/literature.mp3","audio_ex0":"Unit6/audio/literature_ex0.mp3","audio_ex1":"Unit6/audio/literature_ex1.mp3"},{"word":"athlete","ipa":"/ˈæθliːt/","image_prompts":["A pair of running shoes on a track with worn soles, morning sunlight","A gold medal hanging on a ribbon against a blurred stadium background"],"image_desc_en":"A pair of running shoes on a track with worn soles, morning sunlight; a gold medal hanging on a ribbon against a blurred stadium background","image_desc_cn":"一双跑鞋放在跑道上，鞋底磨损，晨光照射；一枚金牌挂在绶带上，背景是模糊的体育场","meaning_cn":"运动员","usage":"n. 可数名词 (复数 athletes)","c ter","ipa":"/ˈpeɪntər/","image_prompts":["A paintbrush resting on a wooden palette with fresh oil paints in red, blue, and yellow, natural light from a window","A half-finished landscape painting on an easel in a bright studio, paint tubes scattered on a table"],"image_desc_en":"A paintbrush on a palette with colorful paints; a landscape painting on an easel with paint tubes.","image_desc_cn":"画笔和调色板上的彩色颜料；画架上的风景画和散落的颜料管。","meaning_cn":"画家；油漆工","usage":"n. (可数名词) 指从事绘画艺术的人或粉刷墙壁的工人","collocations":"a famous painter, a house painter, become a painter","preposition_combos":"painter of (e.g., a painter of landscapes)","examples":[{"en":"My uncle is a painter who loves to paint mountains.","cn":"我叔叔是一位喜欢画山的画家。"},{"en":"The painter used bright colors for the school wall.","cn":"油漆工用明亮的颜色粉刷学校墙壁。"}],"socratic_questions":[{"question":"小明在美术课上用画笔和颜料画了一幅风景画，大家说他将来可以成为什么职业？","answer_hint":"这个职业和画画有关，用画笔和颜料创作作品。"}],"fill_blank":{"sentences":["The ___ mixed blue and yellow to make green on the canvas."],"options":["painter","teacher","doctor","driver"],"correct_index":0},"audio":"Unit6/audio/painter.mp3","audio_ex0":"Unit6/audio/painter_ex0.mp3","audio_ex1":"Unit6/audio/painter_ex1.mp3"},{"word":"businessman","ipa":"/ˈbɪznəsmæn/","image_prompts":["A leather briefcase open on a polished wooden desk, papers and a laptop inside, a cup of coffee beside it","A stack of dollar bills and a calculator on a glass office table, a pen and a notepad nearby"],"image_desc_en":"An open briefcase with papers and laptop on a desk; a stack of money and calculator on a glass table.","image_desc_cn":"桌上打开的公文包里有文件和笔记本电脑；玻璃桌上的钞票和计算器。","meaning_cn":"商人；企业家","usage":"n. (可数名词) 指从事商业活动的人，尤指男性","collocations":"a successful businessman, become a businessman, a local businessman","preposition_combos":"businessman from (e.g., a businessman from Shanghai)","examples":[{"en":"That businessman often travels to different cities for work.","cn":"那位商人经常去不同的城市出差。"},{"en":"My father wants to be a businessman and open his own shop.","cn":"我父亲想成为一名商人，开一家自己的店。"}],"socratic_questions":[{"question":"李叔叔每天穿着西装去办公室，经常开会和谈生意，他从事什么职业？","answer_hint":"这个职业和做生意、谈合同有关，经常在办公室或出差。"}],"fill_blank":{"sentences":["The ___ signed a contract to sell 100 computers to the school."],"options":["businessman","painter","actress","lawyer"],"correct_index":0},"audio":"Unit6/audio/businessman.mp3","audio_ex0":"Unit6/audio/businessman_ex0.mp3","audio_ex1":"Unit6/audio/businessman_ex1.mp3"},{"word":"actress","ipa":"/ˈæktrəs/","image_prompts":["A theater stage with red curtains and a spotlight shining on a single microphone stand","A movie clapperboard with the words 'Scene 1 Take 2' written on it, a film camera in the background"],"image_desc_en":"A stage with red curtains and a spotlight; a clapperboard with film camera in background.","image_desc_cn":"红色幕布的舞台和聚光灯；写着场次的场记板和背景中的摄影机。","meaning_cn":"女演员","usage":"n. (可数名词) 指在戏剧、电影或电视中扮演角色的女性","collocations":"a famous actress, become an actress, a movie actress","preposition_combos":"actress in (e.g., an actress in a film)","examples":[{"en":"The young actress practiced her lines every day after school.","cn":"那位年轻女演员每天放学后练习台词。"},{"en":"She dreams of becoming an actress in Hollywood one day.","cn":"她梦想有一天成为好莱坞的女演员。"}],"socratic_questions":[{"question":"小红在学校的戏剧节上扮演了白雪公主，大家都说她演得很好，她将来可能成为什么？","answer_hint":"这个职业是在舞台上或电影里扮演角色，而且是女性。"}],"fill_blank":{"sentences":["The ___ won an award for her role in the movie."],"options":["actress","actor","painter","businessman"],"correct_index":0},"audio":"Unit6/audio/actress.mp3","audio_ex0":"Unit6/audio/actress_ex0.mp3","audio_ex1":"Unit6/audio/actress_ex1.mp3"},{"word":"lawyer","ipa":"/ˈlɔːjər/","image_prompts":["A wooden gavel on a polished judge's bench next to a stack of law books with gold lettering","A pair of reading glasses on an open legal document with a pen and a cup of tea on a desk"],"image_desc_en":"A gavel on a judge's bench with law books; glasses on an open legal document with a pen.","image_desc_cn":"法官席上的木槌和法律书籍；眼镜放在打开的法律文件上，旁边有笔。","meaning_cn":"律师","usage":"n. (可数名词) 指提供法律咨询或代表客户出庭的专业人士","collocations":"a good lawyer, become a lawyer, hire a lawyer","preposition_combos":"lawyer for (e.g., a lawyer for the company)","examples":[{"en":"The lawyer explained the rules of the contract to us.","cn":"律师向我们解释了合同的规则。"},{"en":"My cousin works as a lawyer in a big city office.","cn":"我的表姐在大城市的一家事务所做律师。"}],"socratic_questions":[{"question":"王叔叔在法庭上帮别人辩护，他穿着西装，手里拿着很多法律文件，他是什么职业？","answer_hint":"这个职业和法律有关，在法庭上为别人辩护或提供法律建议。"}],"fill_blank":{"sentences":["The ___ helped the family win the case in court."],"options":["lawyer","doctor","teacher","painter"],"correct_index":0},"audio":"Unit6/audio/lawyer.mp3","audio_ex0":"Unit6/audio/lawyer_ex0.mp3","audio_ex1":"Unit6/audio/lawyer_ex1.mp3"},{"word":"law","ipa":"/lɔː/","image_prompts":["A gavel resting on a wooden judge's bench with an open law book beside it, courtroom setting","A stack of thick legal documents tied with red ribbon on a polished oak table, soft natural light"],"image_desc_en":"A gavel on a wooden bench with an open law book, courtroom setting.","image_desc_cn":"木制法官席上的法槌和一本打开的法律书，法庭场景。","meaning_cn":"法律；法规","usage":"n. (可数名词，常作单数或复数 laws)","collocations":"break the law, obey the law, pass a law, by law","preposition_combos":"under the law, against the law","examples":[{"en":"It is against the law to drive without a license.","cn":"无证驾驶是违法的。"},{"en":"Our school has a strict law about using phones in class.","cn":"我们学校有关于课堂上使用手机的严格规定。"}],"socratic_questions":[{"question":"小明在街上骑自行车闯红灯，交警叔叔说他的行为违反了城市里的什么规则？","answer_hint":"这个词指国家或地方制定的正式规则，违反会有惩罚，不是校规或家规。"}],"fill_blank":{"sentences":["Driving after drinking alcohol is against the ___ in most countries."],"options":["law","rule","habit","order"],"correct_index":0},"audio":"Unit6/audio/law.mp3","audio_ex0":"Unit6/audio/law_ex0.mp3","audio_ex1":"Unit6/audio/law_ex1.mp3"},{"word":"ahead","ipa":"/əˈhɛd/","image_prompts":["A winding road stretching far into the distance with a small signpost reading 'Next Town 5 km' at the foreground","A row of green traffic lights glowing brightly against a dark night sky, empty intersection"],"image_desc_en":"A winding road stretching into the distance with a signpost, indicating forward direction.","image_desc_cn":"一条蜿蜒伸向远方的道路，前景有路标，指示前方方向。","meaning_cn":"在前面；向前；提前","usage":"adv.","collocations":"go ahead, look ahead, ahead of time, ahead of schedule","preposition_combos":"ahead of","examples":[{"en":"Finish your homework ahead of time so you can relax later.","cn":"提前完成作业，这样你之后可以放松。"},{"en":"The finish line is just 100 meters ahead on the track.","cn":"终点线就在跑道前方100米处。"}],"socratic_questions":[{"question":"运动会跑步比赛时，你看到终点线还在你前方很远，老师喊你继续努力，该用哪个词描述终点线的位置？","answer_hint":"这个词表示在空间或时间上处于更靠前的位置，不是后面也不是旁边。"}],"fill_blank":{"sentences":["If you want to get good seats, you should arrive ___ of the show time."],"options":["ahead","behind","beside","below"],"correct_index":0},"audio":"Unit6/audio/ahead.mp3","audio_ex0":"Unit6/audio/ahead_ex0.mp3","audio_ex1":"Unit6/audio/ahead_ex1.mp3"},{"word":"put out","ipa":"/pʊt aʊt/","image_prompts":["A fire extinguisher spraying white foam onto a small campfire, flames shrinking and smoke rising","A hand placing a lit candle upside down into a jar, the flame suffocating and disappearing"],"image_desc_en":"A fire extinguisher spraying foam onto a campfire, flames shrinking with smoke.","image_desc_cn":"灭火器向篝火喷射泡沫，火焰缩小并冒烟。","meaning_cn":"扑灭；熄灭；关掉（灯）","usage":"v. (短语动词，及物，可分开用 put sth out) (过去式 put out, 过去分词 put out)","collocations":"put out a fire, put out the lights, put out a cigarette","preposition_combos":"put out + 宾语","examples":[{"en":"Please put out the lights before you leave the classroom.","cn":"离开教室前请关灯。"},{"en":"The firefighters worked hard to put out the big forest fire.","cn":"消防员们努力扑灭了那场森林大火。"}],"socratic_questions":[{"question":"野餐结束后，你们用沙子盖住了篝火的余烬，让火不再燃烧，这个动作叫什么？","answer_hint":"这是一个由两个词组成的动词短语，意思是让火或光停止存在。"}],"fill_blank":{"sentences":["Remember to ___ the candles before going to bed."],"options":["put out","take out","turn on","pick up"],"correct_index":0},"audio":"Unit6/audio/put_out.mp3","audio_ex0":"Unit6/audio/put_out_ex0.mp3","audio_ex1":"Unit6/audio/put_out_ex1.mp3"},{"word":"design","ipa":"/dɪˈzaɪn/","image_prompts":["A sketchbook open to a page with detailed pencil drawings of a modern chair, ruler and eraser nearby","A blueprint of a small house spread on a drafting table, with compass and colored pencils"],"image_desc_en":"A sketchbook open to pencil drawings of a modern chair with drafting tools nearby.","image_desc_cn":"一本打开的速写本，上面有现代椅子的铅笔素描，旁边有绘图工具。","meaning_cn":"设计；构思","usage":"v. (过去式 designed, 过去分词 designed) / n. (可数名词，设计图/方案)","collocations":"design a poster, design a website, fashion design, by design","preposition_combos":"design for, design of","examples":[{"en":"Our art class will design a poster for the school music festival.","cn":"我们的美术课将为学校音乐节设计一张海报。"},{"en":"The design of this new library includes a large reading area.","cn":"这个新图书馆的设计包含一个大的阅读区。"}],"socratic_questions":[{"question":"学校要举办科技节，需要一张漂亮的海报来宣传，美术老师让大家先画出海报的草图，这个创作过程叫什么？","answer_hint":"这个词指在制作之前先构思并画出方案，可以是动词也可以是名词。"}],"fill_blank":{"sentences":["Who ___ the logo for our school sports team?"],"options":["designed","drew","painted","wrote"],"correct_index":0},"audio":"Unit6/audio/design.mp3","audio_ex0":"Unit6/audio/design_ex0.mp3","audio_ex1":"Unit6/audio/design_ex1.mp3"},{"word":"bridge","ipa":"/brɪdʒ/","image_prompts":["A stone arch bridge over a calm river with autumn trees reflected in the water, no people","A wooden bridge crossing a small stream in a forest, sunlight filtering through leaves, no people"],"image_desc_en":"A stone arch bridge over a calm river with autumn trees reflected in the water, no people","image_desc_cn":"一座石拱桥横跨平静的河流，秋树倒映在水中，无人","meaning_cn":"桥；桥梁；沟通","usage":"n. (可数名词) 桥；v. (过去式 bridged, 过去分词 bridged) 架桥；弥合差距","collocations":"build a bridge, cross a bridge, bridge the gap","preposition_combos":"bridge over, bridge between","examples":[{"en":"We need to build a bridge over the river.","cn":"我们需要在河上建一座桥。"},{"en":"This activity can bridge the gap between teachers and students.","cn":"这项活动可以弥合师生之间的隔阂。"}],"socratic_questions":[{"question":"你想连接河的两岸，方便大家通行，需要建造什么结构？","answer_hint":"这个词指横跨河流或道路的建筑物，也比喻连接不同事物。"}],"fill_blank":{"sentences":["The old stone ___ has stood here for over a hundred years."],"options":["bridge","tunnel","tower","wall"],"correct_index":0},"audio":"Unit6/audio/bridge.mp3","audio_ex0":"Unit6/audio/bridge_ex0.mp3","audio_ex1":"Unit6/audio/bridge_ex1.mp3"},{"word":"final","ipa":"/ˈfaɪnəl/","image_prompts":["A calendar page with December 31 circled in red, a clock showing midnight, no people","A stack of exam papers with a red checkmark on the top sheet, no people"],"image_desc_en":"A calendar page with December 31 circled in red, a clock showing midnight, no people","image_desc_cn":"一张日历页，12月31日被红圈标出，时钟指向午夜，无人","meaning_cn":"最后的；最终的；决赛","usage":"adj. 最后的；n. (可数名词) 决赛；期末考试","collocations":"final exam, final decision, final match","preposition_combos":"final for, final in","examples":[{"en":"The final exam will cover all units this term.","cn":"期末考试将涵盖本学期所有单元。"},{"en":"Our team won the final match last Saturday.","cn":"我们队上周六赢了决赛。"}],"socratic_questions":[{"question":"学期结束前，你要参加一次最重要的考试，它叫什么？","answer_hint":"这个词表示‘最后的’，常用来描述学期末的考试或比赛的最后一轮。"}],"fill_blank":{"sentences":["She is preparing hard for the ___ exam next week."],"options":["final","midterm","daily","weekly"],"correct_index":0},"audio":"Unit6/audio/final.mp3","audio_ex0":"Unit6/audio/final_ex0.mp3","audio_ex1":"Unit6/audio/final_ex1.mp3"},{"word":"confidence","ipa":"/ˈkɒnfɪdəns/","image_prompts":["A trophy on a wooden shelf with a golden shine, soft spotlight from above, no people","A stack of books with a glowing light bulb on top, library background, no people"],"image_desc_en":"A trophy on a wooden shelf with a golden shine, soft spotlight from above, no people","image_desc_cn":"木架上的奖杯闪着金光，上方有柔和聚光灯，无人","meaning_cn":"信心；自信；信任","usage":"n. (不可数名词) 信心；自信","collocations":"have confidence in, build confidence, lose confidence","preposition_combos":"confidence in","examples":[{"en":"Practice can help you build confidence in speaking English.","cn":"练习能帮你建立说英语的信心。"},{"en":"She has great confidence in her ability to solve problems.","cn":"她对自己解决问题的能力很有信心。"}],"socratic_questions":[{"question":"你相信自己能做好一件事，这种内心的感觉叫什么？","answer_hint":"这个词表示对自己或他人的信任和把握，常与‘have’或‘build’搭配。"}],"fill_blank":{"sentences":["With enough practice, you will gain ___ in your math skills."],"options":["confidence","knowledge","experience","courage"],"correct_index":0},"audio":"Unit6/audio/confidence.mp3","audio_ex0":"Unit6/audio/confidence_ex0.mp3","audio_ex1":"Unit6/audio/confidence_ex1.mp3"},{"word":"draw to a close","ipa":"/drɔː tuː ə kləʊz/","image_prompts":["A sunset over a calm sea, the sun half below the horizon, orange and purple sky, no people","An hourglass with most sand in the bottom bulb, wooden table, no people"],"image_desc_en":"A sunset over a calm sea, the sun half below the horizon, orange and purple sky, no people","image_desc_cn":"平静海面上的日落，太阳半沉入地平线，橙紫色天空，无人","meaning_cn":"接近尾声；即将结束","usage":"短语动词 (draw 的过去式 drew, 过去分词 drawn) 表示某事逐渐结束","collocations":"draw to a close, draw near to a close","preposition_combos":"无固定介词搭配","examples":[{"en":"The summer vacation is drawing to a close next week.","cn":"暑假下周就要结束了。"},{"en":"As the concert drew to a close, everyone felt happy.","cn":"音乐会接近尾声时，大家都感到开心。"}],"socratic_questions":[{"question":"暑假快要结束了，你该收拾心情准备开学。这个‘快要结束’怎么说？","answer_hint":"这是一个短语，字面意思是‘拉向结束’，常用于描述活动或时期逐渐结束。"}],"fill_blank":{"sentences":["The school year is ___ ___ ___ ___, and students are preparing for exams."],"options":["drawing to a close","starting over","going on","breaking up"],"correct_index":0},"audio":"Unit6/audio/draw_to_a_close.mp3","audio_ex0":"Unit6/audio/draw_to_a_close_ex0.mp3","audio_ex1":"Unit6/audio/draw_to_a_close_ex1.mp3"},{"word":"form","ipa":"/fɔːrm/","image_prompts":["A blank paper form with empty rectangular fields and a pen lying on a wooden desk, soft natural lighting","A stack of printed application forms clipped together on a clipboard, with a coffee cup nearby"],"image_desc_en":"A blank paper form with empty rectangular fields and a pen lying on a wooden desk, soft natural lighting","image_desc_cn":"一张空白表格，带有矩形空白栏，一支笔放在木桌上，柔和的自然光","meaning_cn":"表格；形成","usage":"n. / v. (过去式 formed, 过去分词 formed)","collocations":"fill in a form, form a habit, in the form of","preposition_combos":"form of, form into","examples":[{"en":"Please fill in this form with your name and address.","cn":"请用你的姓名和地址填写这张表格。"},{"en":"Good study habits form over time with practice.","cn":"良好的学习习惯通过练习会逐渐形成。"}],"socratic_questions":[{"question":"老师发了一张纸，上面有很多空白栏需要你写名字、班级和电话，这张纸叫什么？","answer_hint":"这个词指需要填写信息的书面文件，比如报名表或登记表。"}],"fill_blank":{"sentences":["Before the trip, we need to ___ a study group to prepare together."],"options":["form","break","find","draw"],"correct_index":0},"audio":"Unit6/audio/form.mp3","audio_ex0":"Unit6/audio/form_ex0.mp3","audio_ex1":"Unit6/audio/form_ex1.mp3"},{"word":"relationship","ipa":"/rɪˈleɪʃnʃɪp/","image_prompts":["Two intertwined tree roots growing together in a forest, sunlight filtering through leaves","A pair of hands exchanging a small gift wrapped in brown paper, blurred background of a cozy room"],"image_desc_en":"Two intertwined tree roots growing together in a forest, sunlight filtering through leaves","image_desc_cn":"森林中两条交织在一起的树根，阳光透过树叶洒下","meaning_cn":"关系；联系","usage":"n.","collocations":"build a relationship, close relationship, family relationship","preposition_combos":"relationship with, relationship between","examples":[{"en":"A good relationship with classmates makes school life happier.","cn":"与同学的良好关系让学校生活更快乐。"},{"en":"Trust is important in any close relationship.","cn":"在任何亲密关系中，信任都很重要。"}],"socratic_questions":[{"question":"你和好朋友之间互相理解、互相帮助，这种联系叫什么？","answer_hint":"这个词描述两个人或事物之间的连接或纽带，比如朋友之间或家人之间。"}],"fill_blank":{"sentences":["The ___ between teachers and students should be based on respect."],"options":["relationship","distance","competition","silence"],"correct_index":0},"audio":"Unit6/audio/relationship.mp3","audio_ex0":"Unit6/audio/relationship_ex0.mp3","audio_ex1":"Unit6/audio/relationship_ex1.mp3"},{"word":"push-up","ipa":"/ˈpʊʃ ʌp/","image_prompts":["A gym mat on a wooden floor with two handprints pressed into the surface, a water bottle nearby","A set of dumbbells and a stopwatch on a fitness bench, with a diagram showing arm movement for push-ups"],"image_desc_en":"A gym mat on a wooden floor with two handprints pressed into the surface, a water bottle nearby","image_desc_cn":"木地板上的健身垫，表面有两个手印，旁边放着一个水瓶","meaning_cn":"俯卧撑","usage":"n. (可数名词，复数 push-ups)","collocations":"do push-ups, twenty push-ups, push-up challenge","preposition_combos":"push-up on, push-up with","examples":[{"en":"He can do thirty push-ups without stopping for a rest.","cn":"他能不停歇地做三十个俯卧撑。"},{"en":"Doing push-ups every morning helps build arm strength.","cn":"每天早上做俯卧撑有助于增强手臂力量。"}],"socratic_questions":[{"question":"体育课上，老师让大家趴在地上，用手臂把身体撑起来再放下，这个动作叫什么？","answer_hint":"这是一个锻炼上肢力量的常见动作，身体像一条直线上下移动。"}],"fill_blank":{"sentences":["Our coach asked us to do twenty ___ before the warm-up run."],"options":["push-ups","sit-ups","jump ropes","stretches"],"correct_index":0},"audio":"Unit6/audio/push-up.mp3","audio_ex0":"Unit6/audio/push-up_ex0.mp3","audio_ex1":"Unit6/audio/push-up_ex1.mp3"},{"word":"energetic","ipa":"/ˌenərˈdʒetɪk/","image_prompts":["A bright sunrise over a calm lake, with birds flying and ripples on the water surface","A green sprout pushing through cracked dry soil, with dewdrops on its leaves"],"image_desc_en":"A bright sunrise over a calm lake, with birds flying and ripples on the water surface","image_desc_cn":"平静湖面上的明亮日出，鸟儿飞翔，水面泛起涟漪","meaning_cn":"精力充沛的；充满活力的","usage":"adj. (副词 energetically)","collocations":"feel energetic, an energetic person, energetic activity","preposition_combos":"energetic in, energetic about","examples":[{"en":"After a good night's sleep, I feel very energetic in the morning.","cn":"睡个好觉后，我早上感觉精力充沛。"},{"en":"The dance class was full of energetic music and fast movements.","cn":"舞蹈课上充满了充满活力的音乐和快速的动作。"}],"socratic_questions":[{"question":"你早上起床后感觉很有力气，想跑跑步、跳跳绳，这种状态用什么词形容？","answer_hint":"这个词形容一个人充满活力和热情，不觉得累。"}],"fill_blank":{"sentences":["Drinking enough water helps you stay ___ during the whole day."],"options":["energetic","tired","sleepy","bored"],"correct_index":0},"audio":"Unit6/audio/energetic.mp3","audio_ex0":"Unit6/audio/energetic_ex0.mp3","audio_ex1":"Unit6/audio/energetic_ex1.mp3"},{"word":"last but not least","ipa":"/læst bʌt nɒt liːst/","image_prompts":["A podium with three numbered spots, the third spot highlighted with a golden ribbon and a small star above it","A row of three gift boxes on a table, the last one wrapped in shiny gold paper with a bow, others in plain paper"],"image_desc_en":"A podium with three numbered spots, the third spot highlighted with a golden ribbon and a small star above it","image_desc_cn":"一个带有三个编号位置的领奖台，第三个位置用金色丝带和小星星突出显示","meaning_cn":"最后但同样重要的","usage":"短语 (phrase)","collocations":"last but not least, mention last but not least, introduce last but not least","preposition_combos":"无","examples":[{"en":"Last but not least, we should remember to recycle our plastic bottles.","cn":"最后但同样重要的是，我们应该记得回收塑料瓶。"},{"en":"Last but not least, the blue team gave an excellent performance in the game.","cn":"最后但同样重要的是，蓝队在比赛中表现出色。"}],"socratic_questions":[{"question":"你在总结发言时，想强调最后一个要点和前面的同样重要，该用什么短语开头？","answer_hint":"这个短语以‘最后’开头，但强调‘不次要’，常用于列举的结尾。"}],"fill_blank":{"sentences":["___, we must not forget to turn off the lights before leaving."],"options":["First of all","In addition","Last but not least","For example"],"correct_index":2},"audio":"Unit6/audio/last_but_not_least.mp3","audio_ex0":"Unit6/audio/last_but_not_least_ex0.mp3","audio_ex1":"Unit6/audio/last_but_not_least_ex1.mp3"}]},{"unit":7,"source":"D:\\2026\\初中\\人教版英语八年级上单词表\\人教版英语八年级上单词表.pdf","words":[{"word":"traffic","ipa":"/ˈtræfɪk/","image_prompts":["A long line of cars stopped at a red traffic light on a rainy city street, brake lights glowing red","A busy intersection with a traffic light showing green, yellow, and red signals against a clear blue sky"],"image_desc_en":"A line of cars at a red light on a rainy street, or a traffic light at a busy intersection.","image_desc_cn":"雨街上红灯前的一排汽车，或繁忙十字路口的红绿灯。","meaning_cn":"交通；车流","usage":"n. (不可数名词)","collocations":"heavy traffic, traffic jam, traffic light, traffic rule","preposition_combos":"in traffic, on the traffic","examples":[{"en":"There is heavy traffic on the road every morning.","cn":"每天早上路上交通都很拥堵。"},{"en":"We must follow the traffic rules to stay safe.","cn":"我们必须遵守交通规则以保证安全。"}],"socratic_questions":[{"question":"你早上坐车去学校，发现路上全是车，开得很慢，这时候你会说路上什么很严重？","answer_hint":"路上车多、行驶缓慢，通常用 'heavy traffic' 或 'traffic jam' 来形容，核心词是 'traffic'。"}],"fill_blank":{"sentences":["The ___ is very bad during rush hour in the city center."],"options":["traffic","weather","noise","air"],"correct_index":0},"audio":"Unit7/audio/traffic.mp3","audio_ex0":"Unit7/audio/traffic_ex0.mp3","audio_ex1":"Unit7/audio/traffic_ex1.mp3"},{"word":"technology","ipa":"/tekˈnɒlədʒi/","image_prompts":["A modern laptop with a glowing screen showing code, next to a smartphone and a wireless mouse on a wooden desk","A row of robotic arms assembling a car in a factory, sparks flying from welding tools"],"image_desc_en":"A laptop, smartphone, and mouse on a desk, or robotic arms in a factory assembling a car.","image_desc_cn":"桌上放着笔记本电脑、智能手机和鼠标，或工厂里组装汽车的机械臂。","meaning_cn":"技术；科技","usage":"n. (可数/不可数名词，复数 technologies)","collocations":"modern technology, information technology, technology company","preposition_combos":"in technology, with technology","examples":[{"en":"Modern technology helps us learn English more easily.","cn":"现代科技帮助我们更轻松地学习英语。"},{"en":"Many schools use new technology in the classroom.","cn":"许多学校在教室里使用新技术。"}],"socratic_questions":[{"question":"你发现现在可以用手机查单词、用电脑看教学视频，这些工具都属于什么领域？","answer_hint":"手机、电脑、互联网这些工具和知识都属于 'technology'（科技/技术）的范畴。"}],"fill_blank":{"sentences":["The rapid development of ___ has changed our daily life."],"options":["technology","nature","history","sports"],"correct_index":0},"audio":"Unit7/audio/technology.mp3","audio_ex0":"Unit7/audio/technology_ex0.mp3","audio_ex1":"Unit7/audio/technology_ex1.mp3"},{"word":"video","ipa":"/ˈvɪdiəʊ/","image_prompts":["A smartphone screen playing a nature documentary with a waterfall and green forest, play button visible","A stack of old VHS tapes on a shelf next to a dusty VCR player"],"image_desc_en":"A smartphone showing a nature video of a waterfall, or a stack of VHS tapes on a shelf.","image_desc_cn":"手机屏幕上播放着瀑布森林的自然视频，或架子上的一堆旧录像带。","meaning_cn":"视频；录像","usage":"n. (可数名词，复数 videos); v. (过去式 videoed, 过去分词 videoed) 录制视频","collocations":"watch a video, make a video, video game, video call","preposition_combos":"on video, in a video","examples":[{"en":"I watched a short video about how to make a cake.","cn":"我看了一个关于如何做蛋糕的短视频。"},{"en":"We can video our school trip and share it online.","cn":"我们可以把学校旅行录成视频并分享到网上。"}],"socratic_questions":[{"question":"你想记录下周末去动物园的见闻，回家后可以给朋友看，你会用什么方式记录？","answer_hint":"用手机或相机拍摄动态画面和声音，这种记录方式叫 'video'（视频/录像）。"}],"fill_blank":{"sentences":["My brother loves to play ___ games on his computer after school."],"options":["video","board","card","ball"],"correct_index":0},"audio":"Unit7/audio/video.mp3","audio_ex0":"Unit7/audio/video_ex0.mp3","audio_ex1":"Unit7/audio/video_ex1.mp3"},{"word":"transport","ipa":"/ˈtrænspɔːrt/","image_prompts":["A yellow school bus driving on a tree-lined road, autumn leaves falling, clear sky","A bicycle parked next to a subway entrance sign, morning sunlight on the metal frame"],"image_desc_en":"A yellow school bus on a road with autumn trees; a bicycle by a subway entrance in morning light.","image_desc_cn":"一辆黄色校车行驶在秋叶飘落的道路上；一辆自行车停在地铁入口旁，晨光照在金属车架上。","meaning_cn":"运输；交通工具","usage":"n. (不可数) 运输；v. (过去式 transported, 过去分词 transported) 运输","collocations":"public transport, transport system, transport goods","preposition_combos":"transport by bus/train, transport from...to...","examples":[{"en":"We use public transport to go to school every day.","cn":"我们每天使用公共交通去上学。"},{"en":"The truck will transport fresh fruit to the market.","cn":"这辆卡车将把新鲜水果运到市场。"}],"socratic_questions":[{"question":"小明每天坐地铁上学，地铁属于哪种方式？","answer_hint":"地铁是公共的、载人移动的工具，所以是“交通/运输”方式。"}],"fill_blank":{"sentences":["Buses and trains are common forms of public ___."],"options":["transport","education","system","efficient"],"correct_index":0},"audio":"Unit7/audio/transport.mp3","audio_ex0":"Unit7/audio/transport_ex0.mp3","audio_ex1":"Unit7/audio/transport_ex1.mp3"},{"word":"system","ipa":"/ˈsɪstəm/","image_prompts":["A complex network of subway lines on a city map, colored lines crossing at stations","A set of interconnected gears inside a clock, brass and steel, precise alignment"],"image_desc_en":"A subway map with colored lines and station dots; clock gears interlocked in a metal frame.","image_desc_cn":"一张彩色地铁线路图，站点用圆点标记；钟表内部相互咬合的金属齿轮组。","meaning_cn":"系统；体系","usage":"n. (可数) 系统","collocations":"education system, transport system, computer system","preposition_combos":"system of rules, system for doing sth.","examples":[{"en":"Our school has a good education system for students.","cn":"我们学校有一个良好的教育体系。"},{"en":"The new computer system helps us finish work faster.","cn":"新的电脑系统帮助我们更快完成工作。"}],"socratic_questions":[{"question":"学校有上课、考试、放假等安排，这些合起来叫什么？","answer_hint":"这些规则和流程组合在一起形成一个整体，叫做“系统”。"}],"fill_blank":{"sentences":["The public transport ___ in this city is very convenient."],"options":["system","transport","education","efficient"],"correct_index":0},"audio":"Unit7/audio/system.mp3","audio_ex0":"Unit7/audio/system_ex0.mp3","audio_ex1":"Unit7/audio/system_ex1.mp3"},{"word":"efficient","ipa":"/ɪˈfɪʃnt/","image_prompts":["A solar-powered calculator on a desk, bright sunlight through a window, no wires","A single water droplet falling onto a plant leaf, clean and precise, no waste"],"image_desc_en":"A solar calculator on a desk in sunlight; a water droplet on a green leaf, no splashing.","image_desc_cn":"桌上太阳能计算器在阳光下工作；一滴水精准落在绿叶上，没有溅开。","meaning_cn":"高效的；有效率的","usage":"adj. (副词 efficiently)","collocations":"efficient way, efficient system, efficient worker","preposition_combos":"efficient at doing sth.","examples":[{"en":"This new bus system is more efficient than the old one.","cn":"这个新公交系统比旧的更高效。"},{"en":"She found an efficient way to finish her homework quickly.","cn":"她找到了一个高效的方法快速完成作业。"}],"socratic_questions":[{"question":"小华用半小时做完作业，而别人要两小时，小华的方法怎么样？","answer_hint":"用更少时间做同样的事，说明方法很“高效”。"}],"fill_blank":{"sentences":["Using a planner is an ___ way to manage your time."],"options":["efficient","transport","system","education"],"correct_index":0},"audio":"Unit7/audio/efficient.mp3","audio_ex0":"Unit7/audio/efficient_ex0.mp3","audio_ex1":"Unit7/audio/efficient_ex1.mp3"},{"word":"education","ipa":"/ˌedʒuˈkeɪʃn/","image_prompts":["A stack of textbooks on a wooden desk, a globe beside them, soft library lighting","A blackboard with chalk equations and diagrams, eraser and chalk tray below"],"image_desc_en":"A stack of textbooks and a globe on a desk in a library; a blackboard with math equations in chalk.","image_desc_cn":"图书馆桌上的一摞课本和一个地球仪；黑板上用粉笔写的数学公式和图形。","meaning_cn":"教育","usage":"n. (不可数) 教育","collocations":"education system, get a good education, physical education","preposition_combos":"education in science, education for all","examples":[{"en":"Every child should have the right to a good education.","cn":"每个孩子都应该享有良好教育的权利。"},{"en":"Physical education class is my favorite subject this term.","cn":"体育课是我这学期最喜欢的科目。"}],"socratic_questions":[{"question":"你在学校学知识、学做人，这个过程叫什么？","answer_hint":"学校提供的学习知识和培养能力的过程就是“教育”。"}],"fill_blank":{"sentences":["The government spends a lot of money on public ___."],"options":["education","transport","system","efficient"],"correct_index":0},"audio":"Unit7/audio/education.mp3","audio_ex0":"Unit7/audio/education_ex0.mp3","audio_ex1":"Unit7/audio/education_ex1.mp3"},{"word":"length","ipa":"/leŋθ/","image_prompts":["A wooden ruler measuring a green pencil from tip to eraser on a white desk, clear markings in centimeters","A long red silk ribbon stretched across a wooden floor, with a measuring tape beside it showing 150 cm"],"image_desc_en":"A ruler measuring a pencil; a measuring tape beside a stretched ribbon.","image_desc_cn":"一把尺子测量铅笔；一条卷尺放在拉伸的丝带旁。","meaning_cn":"长度；时间的长短","usage":"n. (可数名词，常与 of 连用)","collocations":"the length of, full length, arm's length, at length","preposition_combos":"in length, of length, at length","examples":[{"en":"The length of the bridge is over two hundred meters.","cn":"这座桥的长度超过两百米。"},{"en":"Please cut the rope to the same length as the table.","cn":"请把绳子剪到和桌子一样长。"}],"socratic_questions":[{"question":"你想知道从教室前门到后门有多远，应该问什么词？","answer_hint":"这个词表示从一端到另一端的距离，常和 of 连用，比如 the ___ of the room。"}],"fill_blank":{"sentences":["The ___ of the swimming pool is 50 meters."],"options":["length","width","height","depth"],"correct_index":0},"audio":"Unit7/audio/length.mp3","audio_ex0":"Unit7/audio/length_ex0.mp3","audio_ex1":"Unit7/audio/length_ex1.mp3"},{"word":"topic","ipa":"/ˈtɒpɪk/","image_prompts":["A whiteboard with the word 'Environment' written in blue marker, surrounded by colorful sticky notes","An open textbook on a wooden desk with a highlighted paragraph titled 'Global Warming' and a bookmark"],"image_desc_en":"A whiteboard with a word and sticky notes; an open textbook with a highlighted title.","image_desc_cn":"一块写着单词并贴满便签的白板；一本打开的书，标题被荧光笔标记。","meaning_cn":"话题；主题","usage":"n. (可数名词)","collocations":"main topic, hot topic, discuss a topic, change the topic","preposition_combos":"on the topic of, about a topic","examples":[{"en":"Our group chose the topic of school sports for the report.","cn":"我们小组选择了学校体育作为报告主题。"},{"en":"The teacher asked us to write about a topic we like.","cn":"老师让我们写一个我们喜欢的话题。"}],"socratic_questions":[{"question":"英语课上老师让大家选一个感兴趣的内容来讨论，这个内容叫什么？","answer_hint":"这个词指讨论或写作的中心内容，比如 the ___ of the conversation。"}],"fill_blank":{"sentences":["We need to decide on a ___ for our class debate."],"options":["topic","title","name","subject"],"correct_index":0},"audio":"Unit7/audio/topic.mp3","audio_ex0":"Unit7/audio/topic_ex0.mp3","audio_ex1":"Unit7/audio/topic_ex1.mp3"},{"word":"partner","ipa":"/ˈpɑːrtnər/","image_prompts":["Two identical blue notebooks placed side by side on a wooden desk, with two pens crossed between them","A pair of white sneakers tied together by their laces on a gym floor, forming a neat bow"],"image_desc_en":"Two notebooks with crossed pens; two sneakers tied together by laces.","image_desc_cn":"两本笔记本和交叉的笔；两只运动鞋用鞋带系在一起。","meaning_cn":"搭档；同伴","usage":"n. (可数名词)","collocations":"work partner, dance partner, business partner, partner up","preposition_combos":"partner in, partner with","examples":[{"en":"I need a partner to practice the dialogue with me.","cn":"我需要一个搭档和我练习对话。"},{"en":"My partner and I finished the science project on time.","cn":"我和搭档按时完成了科学项目。"}],"socratic_questions":[{"question":"老师让大家两人一组做练习，和你一起做的那个人叫什么？","answer_hint":"这个词指和你一起完成任务的另一个人，比如 my ___ in the game。"}],"fill_blank":{"sentences":["Please find a ___ to practice the conversation with."],"options":["partner","teacher","friend","classmate"],"correct_index":0},"audio":"Unit7/audio/partner.mp3","audio_ex0":"Unit7/audio/partner_ex0.mp3","audio_ex1":"Unit7/audio/partner_ex1.mp3"},{"word":"shall","ipa":"/ʃæl/","image_prompts":["A closed calendar on a desk with a red circle around tomorrow's date, a question mark drawn next to it","Two empty chairs facing each other in a bright room, with a small whiteboard between them reading 'Plan?'"],"image_desc_en":"A calendar with a circled date and a question mark; two chairs facing each other with a whiteboard.","image_desc_cn":"一本日历上圈出一个日期并画了问号；两把椅子相对，中间有块小白板。","meaning_cn":"（用于提出建议或征求意见）……好吗？要不要……？","usage":"modal v. (情态动词，后接动词原形；过去式 should)","collocations":"shall we, shall I, shall not (shan't)","preposition_combos":"","examples":[{"en":"Shall we meet at the library after school tomorrow?","cn":"我们明天放学后在图书馆见面好吗？"},{"en":"I shall bring some snacks for the picnic this weekend.","cn":"我会为这个周末的野餐带些零食。"}],"socratic_questions":[{"question":"你想礼貌地建议朋友一起去看电影，用哪个词开头提问最合适？","answer_hint":"这个词用于提出建议或征求意见，常放在句首，比如 ___ we go now?。"}],"fill_blank":{"sentences":["___ we start the game now?"],"options":["Shall","Will","Do","Are"],"correct_index":0},"audio":"Unit7/audio/shall.mp3","audio_ex0":"Unit7/audio/shall_ex0.mp3","audio_ex1":"Unit7/audio/shall_ex1.mp3"},{"word":"pass","ipa":"/pæs/","image_prompts":["A soccer ball flying through the air between two goalposts on a green field, motion blur","A hand holding a yellow pencil over a test paper with a red checkmark on the top corner"],"image_desc_en":"A soccer ball in mid-air between goalposts; a pencil over a test paper with a checkmark.","image_desc_cn":"足球在球门间飞过；铅笔放在有红勾的试卷上。","meaning_cn":"v. 通过；传递；及格","usage":"v. (过去式 passed, 过去分词 passed)","collocations":"pass the exam, pass the ball, pass the time","preposition_combos":"pass through, pass by, pass on","examples":[{"en":"I hope I can pass the math exam this Friday.","cn":"我希望这周五能通过数学考试。"},{"en":"Please pass the salt to your sister at dinner.","cn":"晚餐时请把盐递给你姐姐。"}],"socratic_questions":[{"question":"考试结束后，老师发下试卷，你看到分数刚好超过60分，这时你最想用哪个动词描述这个结果？","answer_hint":"这个词表示成功达到标准或把东西递给别人，和考试、传递动作有关。"}],"fill_blank":{"sentences":["She studied hard and ___ the final exam with a high score."],"options":["passed","failed","missed","dropped"],"correct_index":0},"audio":"Unit7/audio/pass.mp3","audio_ex0":"Unit7/audio/pass_ex0.mp3","audio_ex1":"Unit7/audio/pass_ex1.mp3"},{"word":"winner","ipa":"/ˈwɪnər/","image_prompts":["A golden trophy cup on a wooden podium with a red ribbon, bright spotlight above","A blue first-place medal lying on a checkered finish line with confetti around"],"image_desc_en":"A golden trophy on a podium; a blue medal on a finish line with confetti.","image_desc_cn":"金色奖杯在领奖台上；蓝色奖牌在终点线上撒满彩纸。","meaning_cn":"n. 获胜者","usage":"n. (复数 winners)","collocations":"the winner of the game, a lucky winner, winner takes all","preposition_combos":"winner of, winner in","examples":[{"en":"The winner of the spelling bee got a big dictionary.","cn":"拼写比赛的获胜者得到了一本大词典。"},{"en":"Our team was the winner in the school basketball match.","cn":"我们队是学校篮球赛的获胜者。"}],"socratic_questions":[{"question":"学校运动会结束后，广播里宣布了跑步比赛的第一名，这个人的身份用哪个名词称呼？","answer_hint":"这个词指在比赛或竞争中取得第一名的人，和胜利、奖杯相关。"}],"fill_blank":{"sentences":["After the final race, the ___ received a gold medal and a trophy."],"options":["winner","loser","player","judge"],"correct_index":0},"audio":"Unit7/audio/winner.mp3","audio_ex0":"Unit7/audio/winner_ex0.mp3","audio_ex1":"Unit7/audio/winner_ex1.mp3"},{"word":"cure","ipa":"/kjʊr/","image_prompts":["A glass bottle of orange medicine with a spoon next to it on a white table","A green plant leaf with water droplets, sunlight shining through a window onto a bed"],"image_desc_en":"A medicine bottle with a spoon; a green leaf with water droplets in sunlight near a bed.","image_desc_cn":"药瓶和勺子；阳光下水滴落在绿叶上，旁边有床。","meaning_cn":"v./n. 治愈；疗法","usage":"v. (过去式 cured, 过去分词 cured); n. (可数名词)","collocations":"cure a disease, find a cure, cure someone of","preposition_combos":"cure for, cure of","examples":[{"en":"The doctor said rest can cure a common cold quickly.","cn":"医生说休息可以快速治愈普通感冒。"},{"en":"Scientists are working hard to find a cure for cancer.","cn":"科学家们正在努力寻找癌症的疗法。"}],"socratic_questions":[{"question":"你感冒了，妈妈给你喝了一种药，第二天就好了。这种药的作用可以用哪个词描述？","answer_hint":"这个词表示使疾病消失、恢复健康，既是动词也是名词。"}],"fill_blank":{"sentences":["This new medicine can ___ the infection within three days."],"options":["cure","cause","catch","cover"],"correct_index":0},"audio":"Unit7/audio/cure.mp3","audio_ex0":"Unit7/audio/cure_ex0.mp3","audio_ex1":"Unit7/audio/cure_ex1.mp3"},{"word":"cancer","ipa":"/ˈkænsər/","image_prompts":["A microscope slide with abnormal cells under a blue light in a laboratory","A hospital room with an empty bed and an IV drip stand next to a window"],"image_desc_en":"A microscope slide with abnormal cells under blue light; a hospital room with an IV stand.","image_desc_cn":"显微镜下蓝色光中的异常细胞；带输液架的医院病房。","meaning_cn":"n. 癌症","usage":"n. (不可数名词，常与定冠词连用)","collocations":"lung cancer, breast cancer, fight cancer","preposition_combos":"cancer of, cancer in","examples":[{"en":"Smoking can increase the risk of lung cancer greatly.","cn":"吸烟会大大增加患肺癌的风险。"},{"en":"Many charities raise money to help people with cancer.","cn":"许多慈善机构筹款帮助癌症患者。"}],"socratic_questions":[{"question":"新闻里提到一种严重的疾病，需要长期治疗，而且和细胞异常生长有关，这种病叫什么？","answer_hint":"这个词是一种严重疾病的名称，常与健康、治疗、研究话题相关。"}],"fill_blank":{"sentences":["Early detection of ___ can save many lives through timely treatment."],"options":["cancer","cold","fever","cough"],"correct_index":0},"audio":"Unit7/audio/cancer.mp3","audio_ex0":"Unit7/audio/cancer_ex0.mp3","audio_ex1":"Unit7/audio/cancer_ex1.mp3"},{"word":"concert","ipa":"/ˈkɒnsərt/","image_prompts":["A large stage with musical instruments and microphones, colorful stage lights shining down, empty seats in a dark auditorium","A ticket stub for a music show lying on a wooden table next to a pair of headphones"],"image_desc_en":"A stage setup for a musical performance with instruments and lights, no people present.","image_desc_cn":"一个为音乐表演布置的舞台，有乐器和灯光，没有人物。","meaning_cn":"音乐会；演奏会","usage":"n. (可数名词)","collocations":"go to a concert, attend a concert, rock concert, classical concert","preposition_combos":"at a concert, concert for charity","examples":[{"en":"We bought two tickets for the rock concert next Friday.","cn":"我们买了两张下周五摇滚音乐会的票。"},{"en":"The school band will give a concert in the hall this weekend.","cn":"学校乐队这周末将在礼堂举办一场音乐会。"}],"socratic_questions":[{"question":"你最喜欢的歌手要来你的城市演出，你会买票去听什么？","answer_hint":"这个词指现场音乐表演活动，不是看电影或比赛。"}],"fill_blank":{"sentences":["My sister is going to a pop ___ with her friends tonight."],"options":["concert","movie","game","party"],"correct_index":0},"audio":"Unit7/audio/concert.mp3","audio_ex0":"Unit7/audio/concert_ex0.mp3","audio_ex1":"Unit7/audio/concert_ex1.mp3"},{"word":"cash","ipa":"/kæʃ/","image_prompts":["A pile of various banknotes and coins spread on a wooden table, a small calculator nearby","A cash register drawer open with paper money and coins inside, a receipt roll beside it"],"image_desc_en":"Physical money in the form of banknotes and coins on a surface.","image_desc_cn":"以纸币和硬币形式存在的实体货币放在桌面上。","meaning_cn":"现金；现款","usage":"n. (不可数名词)","collocations":"pay in cash, cash payment, cash machine, cash register","preposition_combos":"with cash, by cash","examples":[{"en":"I forgot my wallet, so I have no cash to buy lunch.","cn":"我忘了带钱包，所以没有现金买午餐。"},{"en":"The store only accepts cash, not credit cards.","cn":"这家店只收现金，不收信用卡。"}],"socratic_questions":[{"question":"你去小卖部买水，但手机没电了，你最好带什么来付钱？","answer_hint":"这个词指实体的纸币和硬币，不是银行卡或手机支付。"}],"fill_blank":{"sentences":["Do you have enough ___ to pay for the book?"],"options":["cash","time","room","food"],"correct_index":0},"audio":"Unit7/audio/cash.mp3","audio_ex0":"Unit7/audio/cash_ex0.mp3","audio_ex1":"Unit7/audio/cash_ex1.mp3"},{"word":"wallet","ipa":"/ˈwɒlɪt/","image_prompts":["A brown leather wallet lying open on a table, showing slots for cards and a compartment for bills","A closed black wallet with a zipper, placed next to a set of keys and a smartphone"],"image_desc_en":"A small folding case for holding money and cards, made of leather or fabric.","image_desc_cn":"一个用于装钱和卡片的小折叠包，通常由皮革或布料制成。","meaning_cn":"钱包；皮夹","usage":"n. (可数名词)","collocations":"leather wallet, lose one's wallet, wallet full of cash, put in wallet","preposition_combos":"in a wallet, wallet with coins","examples":[{"en":"He found his wallet under the sofa after searching for an hour.","cn":"他找了一个小时后在沙发下找到了他的钱包。"},{"en":"My mother gave me a new wallet for my birthday last month.","cn":"我妈妈上个月送给我一个新钱包作为生日礼物。"}],"socratic_questions":[{"question":"你出门时会把钱和公交卡放在一个小皮夹子里，这个皮夹子叫什么？","answer_hint":"这个词指随身携带的装钱和卡片的小包，不是书包或手提袋。"}],"fill_blank":{"sentences":["I put my ID card and some money in my ___."],"options":["wallet","backpack","drawer","pocket"],"correct_index":0},"audio":"Unit7/audio/wallet.mp3","audio_ex0":"Unit7/audio/wallet_ex0.mp3","audio_ex1":"Unit7/audio/wallet_ex1.mp3"},{"word":"guest","ipa":"/ɡest/","image_prompts":["A neatly made bed with a welcome note and a small vase of flowers on the nightstand in a spare room","A dining table set with extra plates and silverware, a name card reading 'Guest' on one plate"],"image_desc_en":"A prepared guest room with a bed and welcome items, no people present.","image_desc_cn":"一间准备好的客房，有床和欢迎物品，没有人物。","meaning_cn":"客人；宾客","usage":"n. (可数名词)","collocations":"house guest, wedding guest, guest room, guest list","preposition_combos":"guest at a party, guest of honor","examples":[{"en":"We invited ten guests to my brother's birthday dinner last Saturday.","cn":"上周六我们邀请了十位客人来参加我弟弟的生日晚餐。"},{"en":"The hotel provides a free breakfast for every guest in the morning.","cn":"这家酒店每天早上为每位客人提供免费早餐。"}],"socratic_questions":[{"question":"你家要举办聚会，除了家人之外，还会邀请谁来参加？","answer_hint":"这个词指被邀请到家里或活动中的人，不是家庭成员。"}],"fill_blank":{"sentences":["Each ___ received a small gift at the end of the party."],"options":["guest","teacher","driver","doctor"],"correct_index":0},"audio":"Unit7/audio/guest.mp3","audio_ex0":"Unit7/audio/guest_ex0.mp3","audio_ex1":"Unit7/audio/guest_ex1.mp3"},{"word":"chief","ipa":"/tʃiːf/","image_prompts":["A large wooden gavel resting on a polished oak desk in a courtroom, with a nameplate reading 'Chief'","A single red apple sitting on top of a stack of textbooks, with a gold crown placed on the apple"],"image_desc_en":"A wooden gavel on a desk with a nameplate; an apple with a crown on books.","image_desc_cn":"桌上木槌和名牌；苹果戴皇冠放在书本上。","meaning_cn":"主要的；最重要的；首领","usage":"adj. (无词形变化) / n. (复数 chiefs)","collocations":"chief reason, chief concern, chief executive","preposition_combos":"chief of (e.g., chief of police)","examples":[{"en":"The chief reason for my success is hard work.","cn":"我成功的主要原因是努力工作。"},{"en":"Our chief goal this year is to improve grades.","cn":"我们今年的主要目标是提高成绩。"}],"socratic_questions":[{"question":"你有一堆理由不想写作业，但其中最重要的那个是什么？用一个词来形容这个‘最重要的’理由。","answer_hint":"这个词表示‘首要的、主要的’，常用来强调最关键的因素。"}],"fill_blank":{"sentences":["The ___ reason for the traffic jam was the heavy rain."],"options":["chief","small","funny","quick"],"correct_index":0},"audio":"Unit7/audio/chief.mp3","audio_ex0":"Unit7/audio/chief_ex0.mp3","audio_ex1":"Unit7/audio/chief_ex1.mp3"},{"word":"researcher","ipa":"/rɪˈsɜːrtʃər/","image_prompts":["A microscope on a laboratory table next to a notebook with handwritten notes and a coffee mug","A stack of scientific journals with colorful graphs on the covers, a magnifying glass on top"],"image_desc_en":"A microscope and notebook on a lab table; journals with a magnifying glass.","image_desc_cn":"实验室桌上的显微镜和笔记本；杂志上的放大镜。","meaning_cn":"研究员；调查者","usage":"n. (可数名词，复数 researchers)","collocations":"a medical researcher, a team of researchers, lead researcher","preposition_combos":"researcher in (e.g., researcher in biology)","examples":[{"en":"The researcher studied how plants grow in dry soil.","cn":"研究员研究了植物如何在干燥土壤中生长。"},{"en":"A young researcher won an award for her discovery.","cn":"一位年轻研究员因她的发现获奖。"}],"socratic_questions":[{"question":"有一个人整天在实验室里观察细菌、记录数据，想找到新药。这个人是什么职业？","answer_hint":"这个词指专门做研究、做实验的人，通常和科学有关。"}],"fill_blank":{"sentences":["The ___ carefully recorded the temperature every hour."],"options":["researcher","teacher","driver","cook"],"correct_index":0},"audio":"Unit7/audio/researcher.mp3","audio_ex0":"Unit7/audio/researcher_ex0.mp3","audio_ex1":"Unit7/audio/researcher_ex1.mp3"},{"word":"research","ipa":"/rɪˈsɜːrtʃ/","image_prompts":["An open laptop showing a search engine page with graphs and data charts on the screen","A pile of printed papers with highlighted text and sticky notes attached, on a wooden desk"],"image_desc_en":"A laptop with data charts on screen; papers with highlights and sticky notes.","image_desc_cn":"显示数据图表的笔记本电脑；带高亮和便签的纸张。","meaning_cn":"研究；调查","usage":"n. (不可数名词) / v. (过去式 researched, 过去分词 researched)","collocations":"do research, research project, scientific research","preposition_combos":"research on (e.g., research on climate change)","examples":[{"en":"We need to do more research before writing the report.","cn":"我们在写报告前需要做更多研究。"},{"en":"She researched the history of the old bridge for her project.","cn":"她为项目研究了那座老桥的历史。"}],"socratic_questions":[{"question":"你要写一篇关于熊猫的作文，需要去图书馆查资料、看纪录片。这个过程叫什么？","answer_hint":"这个词表示系统地查找信息、学习知识的过程，可以是名词也可以是动词。"}],"fill_blank":{"sentences":["The students are doing ___ on how to save water."],"options":["research","sports","music","cooking"],"correct_index":0},"audio":"Unit7/audio/research.mp3","audio_ex0":"Unit7/audio/research_ex0.mp3","audio_ex1":"Unit7/audio/research_ex1.mp3"},{"word":"futurist","ipa":"/ˈfjuːtʃərɪst/","image_prompts":["A whiteboard covered with sketches of flying cars, robot arms, and floating buildings","A crystal ball on a desk next to a tablet showing a futuristic city skyline with neon lights"],"image_desc_en":"A whiteboard with futuristic sketches; a crystal ball and tablet with a neon city.","image_desc_cn":"画着未来科技的白板；水晶球和平板显示霓虹城市。","meaning_cn":"未来学家；未来主义者","usage":"n. (可数名词，复数 futurists)","collocations":"a famous futurist, futurist predictions, technology futurist","preposition_combos":"futurist in (e.g., futurist in technology)","examples":[{"en":"A futurist predicted that robots will help with housework.","cn":"一位未来学家预测机器人将帮忙做家务。"},{"en":"The futurist wrote a book about life in 2050.","cn":"这位未来学家写了一本关于2050年生活的书。"}],"socratic_questions":[{"question":"有一个人专门思考50年后人类会怎么生活，比如会不会有飞行汽车。这种人叫什么？","answer_hint":"这个词由‘未来’加上‘-ist’（表示从事某种职业的人）构成，指研究未来趋势的人。"}],"fill_blank":{"sentences":["The ___ believes that schools will use virtual reality in ten years."],"options":["futurist","artist","dentist","scientist"],"correct_index":0},"audio":"Unit7/audio/futurist.mp3","audio_ex0":"Unit7/audio/futurist_ex0.mp3","audio_ex1":"Unit7/audio/futurist_ex1.mp3"},{"word":"prediction","ipa":"/prɪˈdɪkʃən/","image_prompts":["A crystal ball on a wooden table with swirling mist inside, surrounded by tarot cards","A weather forecast chart showing a rain cloud icon and a temperature line rising upward"],"image_desc_en":"A crystal ball with mist and tarot cards; a weather chart with rain and temperature rise.","image_desc_cn":"一个带雾气的玻璃球和塔罗牌；一张显示降雨和升温的天气预报图。","meaning_cn":"预测；预言","usage":"n. (可数名词，复数 predictions)","collocations":"make a prediction, weather prediction, accurate prediction","preposition_combos":"prediction about/of","examples":[{"en":"The weather prediction says it will rain tomorrow.","cn":"天气预报说明天会下雨。"},{"en":"My prediction about the exam result was wrong.","cn":"我对考试结果的预测是错的。"}],"socratic_questions":[{"question":"你看到天空乌云密布，蚂蚁搬家，你心里想‘可能要下雨了’。这个‘可能要下雨’的想法叫什么？","answer_hint":"这个词表示对未来的推测或判断，常和天气、考试结果搭配。"}],"fill_blank":{"sentences":["The weather ___ says it will be sunny tomorrow."],"options":["prediction","predicted","predicting","predict"],"correct_index":0},"audio":"Unit7/audio/prediction.mp3","audio_ex0":"Unit7/audio/prediction_ex0.mp3","audio_ex1":"Unit7/audio/prediction_ex1.mp3"},{"word":"outer","ipa":"/ˈaʊtər/","image_prompts":["A thick brick wall with a sign 'OUTER WALL' on the outside surface, grass on the other side","A telescope pointing at a starry night sky with a crescent moon and distant planets"],"image_desc_en":"A brick wall with an 'OUTER WALL' sign; a telescope aimed at stars and a crescent moon.","image_desc_cn":"一面标有‘外墙’的砖墙；一架望远镜指向星空和弯月。","meaning_cn":"外部的；外面的","usage":"adj. (仅作定语，无比较级)","collocations":"outer space, outer layer, outer wall","preposition_combos":"无常见介词搭配","examples":[{"en":"The outer layer of the cake is covered with chocolate.","cn":"蛋糕的外层覆盖着巧克力。"},{"en":"We need to paint the outer wall of the house.","cn":"我们需要粉刷房子的外墙。"}],"socratic_questions":[{"question":"一个鸡蛋有蛋壳和蛋白，蛋壳是‘里面’还是‘外面’的那一层？","answer_hint":"这个词表示‘外面的’，和‘inner（内部的）’相反，常用来描述空间或层次。"}],"fill_blank":{"sentences":["The ___ space is full of stars and planets."],"options":["outer","inner","upper","lower"],"correct_index":0},"audio":"Unit7/audio/outer.mp3","audio_ex0":"Unit7/audio/outer_ex0.mp3","audio_ex1":"Unit7/audio/outer_ex1.mp3"},{"word":"outer space","ipa":"/ˈaʊtər speɪs/","image_prompts":["A dark starry sky with a spiral galaxy and a bright comet streaking across","A satellite orbiting Earth with blue oceans and white clouds visible below"],"image_desc_en":"A dark sky with a spiral galaxy and a comet; a satellite orbiting Earth with oceans and clouds.","image_desc_cn":"带有螺旋星系和彗星的黑暗天空；一颗绕地球运行的卫星，下方可见海洋和云层。","meaning_cn":"外太空","usage":"n. (不可数名词，常与介词 in/into 连用)","collocations":"go into outer space, explore outer space, in outer space","preposition_combos":"in/into outer space","examples":[{"en":"Astronauts travel into outer space to study the stars.","cn":"宇航员进入外太空研究星星。"},{"en":"There is no air or water in outer space.","cn":"外太空没有空气或水。"}],"socratic_questions":[{"question":"夜晚你抬头看天空，看到星星和月亮，那个星星所在的地方，科学家叫它什么？","answer_hint":"这个词指地球大气层以外的广阔宇宙区域，常和宇航员、火箭搭配。"}],"fill_blank":{"sentences":["Many scientists dream of exploring ___."],"options":["outer space","outer","space","the space"],"correct_index":0},"audio":"Unit7/audio/outer_space.mp3","audio_ex0":"Unit7/audio/outer_space_ex0.mp3","audio_ex1":"Unit7/audio/outer_space_ex1.mp3"},{"word":"worse","ipa":"/wɜːrs/","image_prompts":["Two piles of trash: one small pile with a few cans, another huge pile overflowing with garbage and flies","A cracked smartphone screen next to a completely shattered screen with glass pieces"],"image_desc_en":"A small trash pile vs. an overflowing pile with flies; a cracked screen vs. a shattered screen.","image_desc_cn":"一小堆垃圾与一堆满是苍蝇的垃圾对比；一个裂屏与一个完全碎屏对比。","meaning_cn":"更坏的；更差的","usage":"adj. (bad 的比较级) / adv. (badly 的比较级)","collocations":"get worse, much worse, worse than","preposition_combos":"worse than","examples":[{"en":"The weather today is worse than yesterday.","cn":"今天的天气比昨天更糟。"},{"en":"My headache got worse after the long exam.","cn":"长时间考试后我的头痛更严重了。"}],"socratic_questions":[{"question":"你上次考试得了60分，这次只得了40分。这次成绩比上次是‘更好’还是‘更差’？","answer_hint":"这个词是‘bad’的比较级，表示情况变得更不好，常和‘than’连用。"}],"fill_blank":{"sentences":["This cold is ___ than the one I had last month."],"options":["worse","worst","bad","badly"],"correct_index":0},"audio":"Unit7/audio/worse.mp3","audio_ex0":"Unit7/audio/worse_ex0.mp3","audio_ex1":"Unit7/audio/worse_ex1.mp3"},{"word":"take over","ipa":"/teɪk ˈoʊvər/","image_prompts":["A large clock on a wall with its hands spinning fast, a smaller clock falling off the shelf, symbolizing time taking over","A stack of old books being slowly covered by a pile of new colorful notebooks on a desk, representing new items taking over"],"image_desc_en":"A large clock on a wall with its hands spinning fast, a smaller clock falling off the shelf, symbolizing time taking over","image_desc_cn":"墙上一个大钟的指针快速旋转，一个小钟从架子上掉下来，象征时间接管一切","meaning_cn":"接管；取代","usage":"v. (过去式 took over, 过去分词 taken over)","collocations":"take over sth, take over from sb","preposition_combos":"take over from (从……接手)","examples":[{"en":"My brother will take over the family garden this summer.","cn":"我哥哥今年夏天将接管家里的花园。"},{"en":"Robots may take over some boring jobs in the future.","cn":"未来机器人可能会接管一些无聊的工作。"}],"socratic_questions":[{"question":"你负责班级的植物浇水，但下周你要去旅行，需要让同桌负责这件事，这叫什么？","answer_hint":"这个词组表示接手别人的工作或责任，由两个词组成，第一个词是 take。"}],"fill_blank":{"sentences":["When the teacher was sick, a new teacher came to ___ the class."],"options":["take over","take off","take up","take in"],"correct_index":0},"audio":"Unit7/audio/take_over.mp3","audio_ex0":"Unit7/audio/take_over_ex0.mp3","audio_ex1":"Unit7/audio/take_over_ex1.mp3"},{"word":"sci-fi","ipa":"/ˈsaɪ faɪ/","image_prompts":["A glowing spaceship flying over a futuristic city with tall glass buildings and neon lights at night","A robot arm holding a glowing blue cube on a metallic table, surrounded by holographic screens with star maps"],"image_desc_en":"A glowing spaceship flying over a futuristic city with tall glass buildings and neon lights at night","image_desc_cn":"一艘发光的宇宙飞船飞过一座未来城市，城市里有高大的玻璃建筑和霓虹灯，背景是夜晚","meaning_cn":"科幻（名词/形容词）","usage":"n. / adj. (缩写，全称 science fiction)","collocations":"sci-fi movie, sci-fi book, sci-fi story","preposition_combos":"无常见介词搭配","examples":[{"en":"My favorite sci-fi movie is about time travel.","cn":"我最喜欢的科幻电影是关于时间旅行的。"},{"en":"The library has a new section for sci-fi books.","cn":"图书馆有一个新的科幻书籍区。"}],"socratic_questions":[{"question":"你最近看了一部电影，里面有外星人和宇宙飞船，这种类型的电影叫什么？","answer_hint":"这个词是 science fiction 的缩写，常用来描述关于未来科技或外星人的故事。"}],"fill_blank":{"sentences":["He loves reading ___ novels about robots and space travel."],"options":["sci-fi","horror","romance","comedy"],"correct_index":0},"audio":"Unit7/audio/sci-fi.mp3","audio_ex0":"Unit7/audio/sci-fi_ex0.mp3","audio_ex1":"Unit7/audio/sci-fi_ex1.mp3"},{"word":"ticket","ipa":"/ˈtɪkɪt/","image_prompts":["A red and white train ticket lying on a wooden bench next to a small suitcase, with the word 'TICKET' visible","A torn movie ticket stub on a dark cinema floor, with a faint glow from the screen in the background"],"image_desc_en":"A red and white train ticket lying on a wooden bench next to a small suitcase, with the word 'TICKET' visible","image_desc_cn":"一张红白相间的火车票放在木制长椅上，旁边有一个小手提箱，票上的“TICKET”字样清晰可见","meaning_cn":"票；入场券","usage":"n. (复数 tickets)","collocations":"buy a ticket, train ticket, movie ticket, ticket office","preposition_combos":"ticket for (……的票), ticket to (去……的票)","examples":[{"en":"I bought two tickets for the school concert.","cn":"我买了两张学校音乐会的票。"},{"en":"Please show your ticket before entering the museum.","cn":"进入博物馆前请出示你的票。"}],"socratic_questions":[{"question":"你想去看一场电影，但门口的人让你出示一张小纸片才能进去，这张纸片叫什么？","answer_hint":"这个词是进入电影院、火车或活动场所时需要的东西，通常是一张小纸片或电子凭证。"}],"fill_blank":{"sentences":["We need to buy a ___ for the bus before we get on."],"options":["ticket","map","key","card"],"correct_index":0},"audio":"Unit7/audio/ticket.mp3","audio_ex0":"Unit7/audio/ticket_ex0.mp3","audio_ex1":"Unit7/audio/ticket_ex1.mp3"},{"word":"positive","ipa":"/ˈpɒzətɪv/","image_prompts":["A bright yellow smiley face sticker on a clean white notebook, soft sunlight from a window","A row of green check marks on a whiteboard next to a list of completed tasks, dry-erase markers"],"image_desc_en":"A yellow smiley face sticker on a white notebook with sunlight; green check marks on a whiteboard.","image_desc_cn":"白色笔记本上的黄色笑脸贴纸，阳光照射；白板上的一排绿色对勾。","meaning_cn":"积极的；正面的；肯定的","usage":"adj. (比较级 more positive, 最高级 most positive); 副词形式 positively","collocations":"positive attitude, positive result, positive feedback","preposition_combos":"positive about","examples":[{"en":"She always keeps a positive attitude before exams.","cn":"考试前她总是保持积极的态度。"},{"en":"The teacher gave positive feedback on my project.","cn":"老师对我的项目给予了肯定的反馈。"}],"socratic_questions":[{"question":"小明考试前很紧张，你觉得他应该用什么词来形容自己的心态，才能让自己更自信？","answer_hint":"这个词和“消极”相反，表示看好结果、充满希望。"}],"fill_blank":{"sentences":["Try to stay ___ even when things get difficult."],"options":["positive","negative","nervous","tired"],"correct_index":0},"audio":"Unit7/audio/positive.mp3","audio_ex0":"Unit7/audio/positive_ex0.mp3","audio_ex1":"Unit7/audio/positive_ex1.mp3"},{"word":"everywhere","ipa":"/ˈevriweər/","image_prompts":["A dense forest floor covered entirely with fallen autumn leaves, no visible bare ground","A city street at night with neon signs and glowing shop windows filling every corner of the view"],"image_desc_en":"A forest floor completely covered in autumn leaves; a night street filled with neon signs.","image_desc_cn":"完全被秋叶覆盖的森林地面；夜晚街道到处是霓虹灯招牌。","meaning_cn":"到处；各处","usage":"adv. (无词形变化)","collocations":"look everywhere, go everywhere, found everywhere","preposition_combos":"无常见介词搭配","examples":[{"en":"I looked everywhere for my keys but found nothing.","cn":"我到处找钥匙，但什么都没找到。"},{"en":"During the festival, colorful lights are everywhere in the park.","cn":"节日期间，公园里到处是彩灯。"}],"socratic_questions":[{"question":"你的笔不见了，你翻遍了书包、桌子和地上，可以用哪个词来形容你找的范围？","answer_hint":"这个词表示“所有地方”，比“somewhere”范围更大。"}],"fill_blank":{"sentences":["After the storm, water was ___ on the streets."],"options":["everywhere","somewhere","anywhere","nowhere"],"correct_index":0},"audio":"Unit7/audio/everywhere.mp3","audio_ex0":"Unit7/audio/everywhere_ex0.mp3","audio_ex1":"Unit7/audio/everywhere_ex1.mp3"},{"word":"robotics","ipa":"/rəʊˈbɒtɪks/","image_prompts":["A small wheeled robot with a mechanical arm on a workbench, surrounded by wires and circuit boards","A set of plastic gears and sensors arranged on a blue mat, with a partially built robot frame"],"image_desc_en":"A wheeled robot with a mechanical arm on a workbench; gears and sensors beside a robot frame.","image_desc_cn":"工作台上带机械臂的轮式机器人；齿轮和传感器旁有未完成的机器人框架。","meaning_cn":"机器人学；机器人技术","usage":"n. (不可数名词，常作定语，如 robotics club)","collocations":"robotics club, robotics competition, robotics class","preposition_combos":"无常见介词搭配","examples":[{"en":"Our school has a new robotics club this semester.","cn":"这学期我们学校有了一个新的机器人社团。"},{"en":"He won first prize in the city robotics competition.","cn":"他在市机器人比赛中获得了一等奖。"}],"socratic_questions":[{"question":"你参加了一个社团，大家用零件组装会动的机器，这个社团叫什么名字？","answer_hint":"这个词和“robot”有关，但指的是整个学科或技术领域。"}],"fill_blank":{"sentences":["She joined the ___ team to build a moving car."],"options":["robotics","robots","robotic","robot"],"correct_index":0},"audio":"Unit7/audio/robotics.mp3","audio_ex0":"Unit7/audio/robotics_ex0.mp3","audio_ex1":"Unit7/audio/robotics_ex1.mp3"},{"word":"industry","ipa":"/ˈɪndəstri/","image_prompts":["A large factory with smokestacks at sunset, conveyor belts visible through open doors","Rows of identical metal parts on an assembly line in a well-lit factory hall"],"image_desc_en":"A factory with smokestacks at sunset; rows of metal parts on an assembly line.","image_desc_cn":"日落时分的工厂，烟囱可见；流水线上排列的金属零件。","meaning_cn":"工业；行业；产业","usage":"n. (可数/不可数，复数 industries)","collocations":"heavy industry, car industry, technology industry","preposition_combos":"industry in (a place)","examples":[{"en":"The car industry in this city provides many jobs.","cn":"这座城市的汽车工业提供了许多就业机会。"},{"en":"New technology is changing the food industry quickly.","cn":"新技术正在快速改变食品行业。"}],"socratic_questions":[{"question":"你爸爸在一家生产汽车零件的工厂工作，这个工厂属于哪个大的领域？","answer_hint":"这个词指大规模生产某种产品的领域，比如汽车、钢铁或电子。"}],"fill_blank":{"sentences":["The tourism ___ is very important for this small island."],"options":["industry","factory","company","business"],"correct_index":0},"audio":"Unit7/audio/industry.mp3","audio_ex0":"Unit7/audio/industry_ex0.mp3","audio_ex1":"Unit7/audio/industry_ex1.mp3"},{"word":"service","ipa":"/ˈsɜːrvɪs/","image_prompts":["A clean white plate with a folded napkin on a restaurant table, soft lighting","A red toolbox with a wrench and screwdriver on a wooden workbench"],"image_desc_en":"A clean white plate with a folded napkin on a restaurant table, soft lighting","image_desc_cn":"餐厅桌上一个干净的白色盘子，上面放着折叠好的餐巾，柔和的灯光","meaning_cn":"服务；维修；服役","usage":"n. (可数/不可数) / v. (过去式 serviced, 过去分词 serviced)","collocations":"customer service, room service, public service, service center","preposition_combos":"service to, service for, in service","examples":[{"en":"The hotel service was fast and very friendly.","cn":"酒店的服务又快又友好。"},{"en":"My dad took the car for a service last week.","cn":"我爸爸上周把车送去保养了。"}],"socratic_questions":[{"question":"你去餐厅吃饭时，服务员帮你倒水、上菜，这些行为可以用一个什么词来概括？","answer_hint":"这个词强调为他人提供的帮助或工作，比如酒店或餐厅里的接待。"}],"fill_blank":{"sentences":["The restaurant's ___ is excellent, and the food is delicious too."],"options":["service","menu","price","kitchen"],"correct_index":0},"audio":"Unit7/audio/service.mp3","audio_ex0":"Unit7/audio/service_ex0.mp3","audio_ex1":"Unit7/audio/service_ex1.mp3"},{"word":"disaster","ipa":"/dɪˈzæstər/","image_prompts":["A collapsed wooden bridge over a dry riverbed, broken planks scattered","A dark storm cloud with lightning striking a bare field, heavy rain falling"],"image_desc_en":"A collapsed wooden bridge over a dry riverbed, broken planks scattered","image_desc_cn":"干涸河床上的一座倒塌木桥，断裂的木板散落一地","meaning_cn":"灾难；灾祸；彻底的失败","usage":"n. (可数)","collocations":"natural disaster, disaster area, disaster relief, complete disaster","preposition_combos":"disaster for, disaster in","examples":[{"en":"The earthquake was a terrible disaster for the town.","cn":"这场地震对这个城镇来说是一场可怕的灾难。"},{"en":"My science project was a complete disaster yesterday.","cn":"我的科学项目昨天完全搞砸了。"}],"socratic_questions":[{"question":"如果一场大洪水冲毁了村庄和农田，人们会用什么词来形容这场可怕的事件？","answer_hint":"这个词指造成巨大破坏和痛苦的意外事件，比如地震或洪水。"}],"fill_blank":{"sentences":["The heavy rain caused a terrible ___ in the mountain village."],"options":["disaster","party","game","lesson"],"correct_index":0},"audio":"Unit7/audio/disaster.mp3","audio_ex0":"Unit7/audio/disaster_ex0.mp3","audio_ex1":"Unit7/audio/disaster_ex1.mp3"},{"word":"emergency","ipa":"/ɪˈmɜːrdʒənsi/","image_prompts":["A red fire alarm box on a white wall with a glass cover and a hammer","A flashing red cross sign on a white ambulance parked on a wet road"],"image_desc_en":"A red fire alarm box on a white wall with a glass cover and a hammer","image_desc_cn":"白色墙壁上的红色火警报警箱，带有玻璃罩和一把小锤子","meaning_cn":"紧急情况；突发事件","usage":"n. (可数) / adj. (紧急的)","collocations":"emergency room, emergency exit, emergency call, in an emergency","preposition_combos":"emergency in, emergency for","examples":[{"en":"Please call 120 in case of a medical emergency.","cn":"遇到医疗紧急情况请拨打120。"},{"en":"The school has an emergency plan for fires.","cn":"学校有应对火灾的紧急预案。"}],"socratic_questions":[{"question":"如果有人在操场上突然晕倒，你需要立刻寻求帮助，这种突然发生的危险情况叫什么？","answer_hint":"这个词指需要立即处理的突发危险事件，比如火灾或急病。"}],"fill_blank":{"sentences":["In case of fire, use the ___ exit and do not use the elevator."],"options":["emergency","main","back","side"],"correct_index":0},"audio":"Unit7/audio/emergency.mp3","audio_ex0":"Unit7/audio/emergency_ex0.mp3","audio_ex1":"Unit7/audio/emergency_ex1.mp3"},{"word":"disappear","ipa":"/ˌdɪsəˈpɪr/","image_prompts":["A melting ice cube on a hot metal surface, water puddle forming around it","A trail of footprints on a sandy beach leading to the ocean waves, then vanishing"],"image_desc_en":"A melting ice cube on a hot metal surface, water puddle forming around it","image_desc_cn":"热金属表面上一块正在融化的冰块，周围形成一滩水","meaning_cn":"消失；不见；失踪","usage":"v. (过去式 disappeared, 过去分词 disappeared)","collocations":"disappear from, disappear into, disappear completely","preposition_combos":"disappear from, disappear into","examples":[{"en":"The cat disappeared behind the big sofa quickly.","cn":"那只猫很快消失在大沙发后面。"},{"en":"My keys disappeared from my bag this morning.","cn":"我的钥匙今天早上从包里消失了。"}],"socratic_questions":[{"question":"你把一块糖放进热水里，搅拌几下后糖就看不到了，这种现象可以用哪个动词描述？","answer_hint":"这个词表示某物从视线中完全不见了，比如糖溶化或猫跑掉。"}],"fill_blank":{"sentences":["The sun ___ behind the clouds, and it became dark."],"options":["disappeared","appeared","shined","rose"],"correct_index":0},"audio":"Unit7/audio/disappear.mp3","audio_ex0":"Unit7/audio/disappear_ex0.mp3","audio_ex1":"Unit7/audio/disappear_ex1.mp3"},{"word":"challenging","ipa":"/ˈtʃælɪndʒɪŋ/","image_prompts":["A tall stack of textbooks with a small mountain climber figurine on top, desk lamp casting shadows","A complex jigsaw puzzle with many interlocking pieces scattered on a wooden table, only half completed"],"image_desc_en":"A stack of textbooks with a climber figurine on top, symbolizing a difficult task.","image_desc_cn":"一摞教科书上有一个登山小人，象征困难的任务。","meaning_cn":"具有挑战性的；考验能力的","usage":"adj. (形容词) 比较级
