<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>

</head>

土豆捣碎器压入碗中的煮土豆，形成柔软的土豆泥，冒着蒸汽。","meaning_cn":"捣碎；捣成泥状","usage":"v. (过去式 mashed, 过去分词 mashed)","collocations":"mash potatoes, mash bananas, mash garlic","preposition_combos":"mash into, mash with","examples":[{"en":"I will mash the boiled potatoes for dinner tonight.","cn":"今晚我会把煮熟的土豆捣成泥做晚餐。"},{"en":"She used a fork to mash the soft bananas quickly.","cn":"她用叉子快速捣碎软香蕉。"}],"socratic_questions":[{"question":"你想做土豆泥当配菜，需要把煮软的土豆变成泥状，该用什么动作？","answer_hint":"这个动作是把固体食物压碎成泥，不是切或搅拌。"}],"fill_blank":{"sentences":["Please ___ the cooked carrots into a smooth puree."],"options":["mash","slice","fry","boil"],"correct_index":0},"audio":"audio/mash.mp3","audio_ex0":"audio/mash_ex0.mp3","audio_ex1":"audio/mash_ex1.mp3"},{"word":"mashed","ipa":"/mæʃt/","image_prompts":["A white plate with a scoop of golden mashed potatoes, a pat of butter melting on top, parsley garnish, soft texture visible","A glass bowl filled with mashed avocado, lime juice drizzled on top, green creamy consistency, wooden table setting"],"image_desc_en":"A plate of golden mashed potatoes with melting butter and parsley.","image_desc_cn":"一盘金色土豆泥，上面有融化的黄油和欧芹。","meaning_cn":"捣碎的；成泥状的","usage":"adj. (由动词 mash 的过去分词转化而来)","collocations":"mashed potatoes, mashed avocado, mashed sweet potato","preposition_combos":"mashed with, mashed into","examples":[{"en":"Mashed potatoes are a popular side dish at Thanksgiving.","cn":"土豆泥是感恩节很受欢迎的配菜。"},{"en":"She spread mashed avocado on whole wheat toast for breakfast.","cn":"她把牛油果泥涂在全麦吐司上当早餐。"}],"socratic_questions":[{"question":"你看到一碗金黄色的、软软的、没有块状的食物，是用土豆做的，它是什么状态？","answer_hint":"这个形容词描述食物被捣碎后的状态，不是整块的。"}],"fill_blank":{"sentences":["My favorite side dish is ___ potatoes with gravy."],"options":["mashed","fried","baked","roasted"],"correct_index":0},"audio":"audio/mashed.mp3","audio_ex0":"audio/mashed_ex0.mp3","audio_ex1":"audio/mashed_ex1.mp3"},{"word":"stir-fry","ipa":"/ˈstɜːr fraɪ/","image_prompts":["A hot wok on a gas stove with broccoli florets, carrot slices, and bell pepper strips being tossed in oil, steam and slight smoke rising","A wooden spatula moving chopped chicken pieces and green beans in a non-stick pan, soy sauce glistening on the surface"],"image_desc_en":"A hot wok with colorful vegetables being tossed in oil, steam rising.","image_desc_cn":"一个热炒锅里有彩色蔬菜在油中翻炒，蒸汽升起。","meaning_cn":"炒；翻炒","usage":"v. (过去式 stir-fried, 过去分词 stir-fried)","collocations":"stir-fry vegetables, stir-fry chicken, stir-fry noodles","preposition_combos":"stir-fry in, stir-fry with","examples":[{"en":"My mother taught me how to stir-fry green beans with garlic.","cn":"我妈妈教我怎么用大蒜炒四季豆。"},{"en":"You can stir-fry beef and broccoli for a quick dinner.","cn":"你可以炒牛肉和西兰花做一顿快速晚餐。"}],"socratic_questions":[{"question":"你想做一道快手的家常菜，把肉和蔬菜放在热油锅里快速翻动，这是什么烹饪方法？","answer_hint":"这个动作是在高温下快速翻动食材，不是煮或烤。"}],"fill_blank":{"sentences":["Let's ___ some vegetables for a healthy lunch."],"options":["stir-fry","boil","bake","steam"],"correct_index":0},"audio":"audio/stir-fry.mp3","audio_ex0":"audio/stir-fry_ex0.mp3","audio_ex1":"audio/stir-fry_ex1.mp3"},{"word":"fill","ipa":"/fɪl/","image_prompts":["A clear glass pitcher being filled with orange juice from a carton, liquid rising to the brim, bright orange color","A blue ceramic flowerpot being filled with dark brown potting soil from a bag, soil level reaching the top edge"],"image_desc_en":"A glass pitcher being filled with orange juice from a carton, liquid rising to the brim.","image_desc_cn":"一个玻璃壶正被从纸盒倒入橙汁，液体升到边缘。","meaning_cn":"装满；填满","usage":"v. (过去式 filled, 过去分词 filled)","collocations":"fill a bottle, fill a hole, fill a form","preposition_combos":"fill with, fill in, fill up","examples":[{"en":"Please fill the water bottle before we go hiking.","cn":"我们去远足前请把水瓶装满。"},{"en":"She needs to fill the application form carefully.","cn":"她需要仔细填写申请表。"}],"socratic_questions":[{"question":"你的水壶空了，出发前你要做什么让水壶不再空？","answer_hint":"这个动作是把东西放进去直到容器不再空，不是倒掉或清空。"}],"fill_blank":{"sentences":["Could you ___ my cup with hot tea, please?"],"options":["fill","empty","wash","break"],"correct_index":0},"audio":"audio/fill.mp3","audio_ex0":"audio/fill_ex0.mp3","audio_ex1":"audio/fill_ex1.mp3"},{"word":"sweetness","ipa":"/ˈswiːtnəs/","image_prompts":["A jar of golden honey dripping onto a slice of white bread, soft morning light","A bowl of ripe strawberries with sugar crystals scattered on a wooden table"],"image_desc_en":"A jar of honey dripping onto bread; a bowl of strawberries with sugar.","image_desc_cn":"一罐蜂蜜滴在面包上；一碗撒了糖的草莓。","meaning_cn":"n. 甜；甜蜜；芬芳；悦耳","usage":"n. (不可数名词)","collocations":"the sweetness of...; natural sweetness; add sweetness","preposition_combos":"sweetness of (sth.)","examples":[{"en":"The sweetness of the cake comes from fresh fruit, not sugar.","cn":"蛋糕的甜味来自新鲜水果，而不是糖。"},{"en":"She remembered the sweetness of her grandmother's smile.","cn":"她记得祖母笑容中的甜蜜。"}],"socratic_questions":[{"question":"你咬了一口刚摘的草莓，嘴里那种美好的味道叫什么？","answer_hint":"这个词和‘甜’有关，是名词形式，形容味道或感觉。"}],"fill_blank":{"sentences":["The ___ of the orange juice made me smile."],"options":["sweetness","sourness","bitterness","saltiness"],"correct_index":0},"audio":"audio/sweetness.mp3","audio_ex0":"audio/sweetness_ex0.mp3","audio_ex1":"audio/sweetness_ex1.mp3"},{"word":"college","ipa":"/ˈkɒlɪdʒ/","image_prompts":["A red brick building with a clock tower and a green lawn in front, autumn leaves on the ground","A library interior with tall bookshelves and a large wooden reading table"],"image_desc_en":"A red brick building with a clock tower; a library with tall bookshelves.","image_desc_cn":"一座带钟楼的红砖建筑；一个高书架图书馆。","meaning_cn":"n. 大学；学院","usage":"n. (可数名词)","collocations":"go to college; college student; college life; college entrance exam","preposition_combos":"at college; in college; college of (subject)","examples":[{"en":"My sister plans to go to college after she finishes high school.","cn":"我姐姐计划高中毕业后上大学。"},{"en":"The college library opens from 8 a.m. to 10 p.m. every day.","cn":"大学图书馆每天从早上8点开到晚上10点。"}],"socratic_questions":[{"question":"你高中毕业后，想继续读书的地方叫什么？那里有图书馆、教学楼和宿舍。","answer_hint":"这个词指高等教育机构，比高中高一级。"}],"fill_blank":{"sentences":["After high school, he will go to ___ to study engineering."],"options":["college","hospital","factory","museum"],"correct_index":0},"audio":"audio/college.mp3","audio_ex0":"audio/college_ex0.mp3","audio_ex1":"audio/college_ex1.mp3"},{"word":"host","ipa":"/həʊst/","image_prompts":["A dinner table set with plates and candles, a name card reading 'Host' at one seat","A microphone on a stage with a spotlight, empty chairs in front"],"image_desc_en":"A dinner table with a 'Host' name card; a microphone on a stage under a spotlight.","image_desc_cn":"一张有‘Host’名牌的餐桌；聚光灯下舞台上的麦克风。","meaning_cn":"n. 主人；主持人 v. (过去式 hosted, 过去分词 hosted) 主持；主办","usage":"n. (可数名词) / v. (及物动词)","collocations":"host a party; host a show; host country; host family","preposition_combos":"host of (event); host for (sb.)","examples":[{"en":"Our school will host a science fair next Friday afternoon.","cn":"我们学校将在下周五下午举办一场科学展览。"},{"en":"The host welcomed all the guests with a warm smile.","cn":"主人用温暖的微笑欢迎所有客人。"}],"socratic_questions":[{"question":"你邀请朋友来家里开生日派对，你负责准备食物和游戏，这时你是什么角色？","answer_hint":"这个词指组织活动并招待别人的人，可以是个人或机构。"}],"fill_blank":{"sentences":["Our city will ___ the international sports competition next year."],"options":["host","visit","leave","close"],"correct_index":0},"audio":"audio/host.mp3","audio_ex0":"audio/host_ex0.mp3","audio_ex1":"audio/host_ex1.mp3"},{"word":"hostess","ipa":"/ˈhəʊstəs/","image_prompts":["A welcome desk with a vase of flowers and a sign reading 'Hostess' in a restaurant entrance","A tea set on a lace tablecloth with a small card saying 'Hostess' next to a teapot"],"image_desc_en":"A welcome desk with a 'Hostess' sign and flowers; a tea set with a 'Hostess' card.","image_desc_cn":"一张带‘Hostess’标志和鲜花的迎宾台；一套茶具旁有‘Hostess’卡片。","meaning_cn":"n. 女主人；女主持人","usage":"n. (可数名词)","collocations":"air hostess; hostess gift; hostess at a party","preposition_combos":"hostess of (event); hostess for (group)","examples":[{"en":"The hostess showed us to our seats and offered us drinks.","cn":"女主人带我们就座，并给我们提供了饮料。"},{"en":"My aunt worked as an air hostess for five years before retiring.","cn":"我姑姑退休前当了五年空姐。"}],"socratic_questions":[{"question":"在一家餐厅门口，一位女士微笑着迎接你并带你到餐桌，她是什么职位？","answer_hint":"这个词是‘host’的女性形式，指接待客人的女性。"}],"fill_blank":{"sentences":["The ___ greeted the guests at the door and handed them menus."],"options":["hostess","doctor","teacher","driver"],"correct_index":0},"audio":"audio/hostess.mp3","audio_ex0":"audio/hostess_ex0.mp3","audio_ex1":"audio/hostess_ex1.mp3"},{"word":"recipe","ipa":"/ˈresɪpi/","image_prompts":["A handwritten recipe card on a wooden table, ingredients listed with measurements, a jar of flour and a whisk beside it","An open cookbook on a kitchen counter, a page showing a recipe for chocolate cake with step-by-step instructions and a photo of the cake"],"image_desc_en":"A recipe card or cookbook page showing ingredients and instructions for cooking.","image_desc_cn":"一张食谱卡片或烹饪书页，展示食材和烹饪步骤。","meaning_cn":"食谱；烹饪法；秘诀","usage":"n. (可数名词，复数 recipes)","collocations":"follow a recipe, a recipe for success, secret recipe","preposition_combos":"recipe for (e.g., a recipe for cookies)","examples":[{"en":"My grandmother gave me her secret recipe for apple pie.","cn":"我奶奶给了我她做苹果派的秘方。"},{"en":"You need to follow the recipe carefully to make good bread.","cn":"你需要仔细按照食谱才能做出好面包。"}],"socratic_questions":[{"question":"你想做一道妈妈拿手的菜，但不知道放多少盐和糖，你需要找什么来参考？","answer_hint":"这个词是写满食材和步骤的纸或书，不是调料本身。"}],"fill_blank":{"sentences":["To make this cake, you must follow the ___ exactly."],"options":["recipe","cream","crust","mixture"],"correct_index":0},"audio":"audio/recipe.mp3","audio_ex0":"audio/recipe_ex0.mp3","audio_ex1":"audio/recipe_ex1.mp3"},{"word":"cream","ipa":"/kriːm/","image_prompts":["A bowl of thick white cream being poured from a ceramic pitcher, soft swirls on the surface","A dollop of whipped cream on top of a slice of strawberry cake, glossy texture"],"image_desc_en":"Thick white or off-white dairy product, often used in desserts or coffee.","image_desc_cn":"浓稠的白色或米白色乳制品，常用于甜点或咖啡。","meaning_cn":"奶油；乳脂；面霜","usage":"n. (不可数名词，但可指种类时用 creams)","collocations":"whipped cream, ice cream, face cream, cream cheese","preposition_combos":"cream of (e.g., cream of mushroom soup)","examples":[{"en":"She added a spoonful of cream to her hot coffee.","cn":"她往热咖啡里加了一勺奶油。"},{"en":"This face cream keeps my skin soft in winter.","cn":"这款面霜让我的皮肤在冬天保持柔软。"}],"socratic_questions":[{"question":"你喝热巧克力时，想在表面加一层白色的、甜甜的奶制品，它叫什么？","answer_hint":"这个词是白色的、脂肪含量高的奶制品，不是牛奶也不是黄油。"}],"fill_blank":{"sentences":["Would you like some whipped ___ on your hot chocolate?"],"options":["cream","recipe","crust","mixture"],"correct_index":0},"audio":"audio/cream.mp3","audio_ex0":"audio/cream_ex0.mp3","audio_ex1":"audio/cream_ex1.mp3"},{"word":"crust","ipa":"/krʌst/","image_prompts":["A freshly baked pizza with a golden-brown outer edge, crispy texture visible","A slice of bread showing a hard brown outer layer and soft white inside"],"image_desc_en":"The hard outer layer of bread, pizza, or pie.","image_desc_cn":"面包、披萨或馅饼的硬外皮。","meaning_cn":"面包皮；馅饼皮；地壳","usage":"n. (可数名词，复数 crusts)","collocations":"pizza crust, pie crust, earth's crust, bread crust","preposition_combos":"crust of (e.g., crust of the earth)","examples":[{"en":"The pizza crust was crispy and golden brown.","cn":"披萨的外皮酥脆且呈金棕色。"},{"en":"Some children don't like to eat the bread crust.","cn":"有些孩子不喜欢吃面包皮。"}],"socratic_questions":[{"question":"你吃披萨时，最外面那一圈硬硬的、烤得焦黄的部分叫什么？","answer_hint":"这个词是面包或馅饼的外层硬皮，不是里面的馅料。"}],"fill_blank":{"sentences":["The ___ of this apple pie is flaky and buttery."],"options":["crust","cream","recipe","mixture"],"correct_index":0},"audio":"audio/crust.mp3","audio_ex0":"audio/crust_ex0.mp3","audio_ex1":"audio/crust_ex1.mp3"},{"word":"mixture","ipa":"/ˈmɪkstʃər/","image_prompts":["A glass bowl containing a brown batter with flour, eggs, and chocolate chips visible, a whisk resting on the edge","A jar of mixed nuts and dried fruits, different colors and shapes combined"],"image_desc_en":"A combination of different substances or ingredients blended together.","image_desc_cn":"不同物质或成分混合在一起的组合物。","meaning_cn":"混合物；混合体","usage":"n. (可数名词，复数 mixtures)","collocations":"a mixture of, chemical mixture, cake mixture, cough mixture","preposition_combos":"mixture of (e.g., a mixture of sugar and water)","examples":[{"en":"The cake mixture should be smooth with no lumps.","cn":"蛋糕混合物应该顺滑没有结块。"},{"en":"This drink is a mixture of orange juice and soda water.","cn":"这种饮料是橙汁和苏打水的混合物。"}],"socratic_questions":[{"question":"你把面粉、鸡蛋、糖和水放在一个碗里搅匀后，碗里变成了什么？","answer_hint":"这个词是多种东西混在一起后的整体，不是单一成分。"}],"fill_blank":{"sentences":["Pour the ___ of flour and eggs into the baking pan."],"options":["mixture","cream","crust","recipe"],"correct_index":0},"audio":"audio/mixture.mp3","audio_ex0":"audio/mixture_ex0.mp3","audio_ex1":"audio/mixture_ex1.mp3"},{"word":"least","ipa":"/liːst/","image_prompts":["A single small coin on an empty wooden table, bright spotlight highlighting its isolation","A tiny drop of water on a dry leaf, surrounded by cracked earth, minimal moisture visible"],"image_desc_en":"A single small coin on an empty wooden table, bright spotlight highlighting its isolation","image_desc_cn":"一枚小硬币孤零零地放在空木桌上，聚光灯照亮其孤立感","meaning_cn":"最少的；最小的；最不重要的","usage":"adj. (little的最高级) / adv. (修饰形容词或动词，表示程度最低)","collocations":"at least, least of all, not least","preposition_combos":"least of (all)","examples":[{"en":"This is the least difficult math problem in the test.","cn":"这是考试中最不难的数学题。"},{"en":"She chose the least expensive gift for her friend.","cn":"她给朋友选了最不贵的礼物。"}],"socratic_questions":[{"question":"小明有三个苹果，小红有两个，小刚有一个。谁拥有的苹果数量最少？","answer_hint":"这个词表示数量或程度上的最小值，与‘最多’相反。"}],"fill_blank":{"sentences":["Of all the subjects, I like history the ___."],"options":["most","least","best","more"],"correct_index":1},"audio":"audio/least.mp3","audio_ex0":"audio/least_ex0.mp3","audio_ex1":"audio/least_ex1.mp3"},{"word":"at least","ipa":"/æt liːst/","image_prompts":["A kitchen timer showing 5 minutes on a countertop next to a half-filled water glass","A thermometer on a wall reading 10 degrees Celsius, with frost on window edges"],"image_desc_en":"A kitchen timer showing 5 minutes on a countertop next to a half-filled water glass","image_desc_cn":"厨房计时器显示5分钟，旁边放着一杯半满的水","meaning_cn":"至少；起码（表示最低限度）","usage":"adv. phrase (固定短语，用于强调最低数量或程度)","collocations":"at least once, at least try, at least know","preposition_combos":"无","examples":[{"en":"You should drink at least eight glasses of water every day.","cn":"你每天至少应该喝八杯水。"},{"en":"The homework will take at least one hour to finish.","cn":"这份作业至少需要一小时才能完成。"}],"socratic_questions":[{"question":"老师要求每天背10个单词，但小华只背了5个。老师对小华说：‘你___要背完一半吧。’这里该用什么短语？","answer_hint":"这个短语表示最低要求或数量底线，常用于建议或批评。"}],"fill_blank":{"sentences":["We need ___ three people to carry this heavy box."],"options":["at least","at most","less than","more than"],"correct_index":0},"audio":"audio/at_least.mp3","audio_ex0":"audio/at_least_ex0.mp3","audio_ex1":"audio/at_least_ex1.mp3"},{"word":"secret","ipa":"/ˈsiːkrɪt/","image_prompts":["A closed wooden chest with a rusty lock on a dusty attic floor, cobwebs around","A folded note tucked inside a hollow book on a library shelf, only corner visible"],"image_desc_en":"A closed wooden chest with a rusty lock on a dusty attic floor, cobwebs around","image_desc_cn":"一个带锈锁的封闭木箱放在布满灰尘的阁楼地板上，周围有蜘蛛网","meaning_cn":"秘密；秘诀；机密的","usage":"n. (可数名词) / adj. (形容词，修饰名词)","collocations":"keep a secret, secret plan, secret place, top secret","preposition_combos":"secret about, secret from","examples":[{"en":"Can you keep a secret about the surprise party?","cn":"你能保守关于惊喜派对的秘密吗？"},{"en":"She wrote her secret wish on a small piece of paper.","cn":"她把秘密愿望写在一张小纸条上。"}],"socratic_questions":[{"question":"小丽在日记本里写了一件事，不想让任何人知道。这件事对她来说是什么？","answer_hint":"这个词指不公开、只有自己或少数人知道的信息。"}],"fill_blank":{"sentences":["He told me a ___ about the birthday gift."],"options":["secret","story","joke","fact"],"correct_index":0},"audio":"audio/secret.mp3","audio_ex0":"audio/secret_ex0.mp3","audio_ex1":"audio/secret_ex1.mp3"},{"word":"according","ipa":"/əˈkɔːrdɪŋ/","image_prompts":["A calendar on a wall with a red circle around a date, next to a note that says 'schedule'","A thermometer showing 30°C with a weather forecast chart in the background"],"image_desc_en":"A calendar with a circled date and a note reading 'schedule' on a wall; a thermometer at 30°C with a weather chart behind it.","image_desc_cn":"墙上日历中圈出的日期和写着“日程”的便签；温度计显示30°C，背景是天气预报图。","meaning_cn":"根据；按照","usage":"adv. (常用于 according to 短语中)","collocations":"according to, according as","preposition_combos":"according to + 名词/代词","examples":[{"en":"According to the map, the library is on the left.","cn":"根据地图，图书馆在左边。"},{"en":"We will start the game according to the rules.","cn":"我们将按照规则开始比赛。"}],"socratic_questions":[{"question":"老师让你按照课本第20页的内容完成作业，你会用哪个词表示‘按照’？","answer_hint":"这个词常和to连用，表示依据某信息或规则。"}],"fill_blank":{"sentences":["___ the weather report, it will rain tomorrow."],"options":["According to","Because of","Instead of","Thanks to"],"correct_index":0},"audio":"audio/according.mp3","audio_ex0":"audio/according_ex0.mp3","audio_ex1":"audio/according_ex1.mp3"},{"word":"whenever","ipa":"/wenˈevər/","image_prompts":["A clock showing 3:00 PM with a note 'snack time' attached to it","A light switch with a sign that says 'turn on when dark'"],"image_desc_en":"A clock at 3:00 PM with a note reading 'snack time'; a light switch with a sign saying 'turn on when dark'.","image_desc_cn":"显示下午3点的时钟，附有写着“零食时间”的便签；一个电灯开关，旁边标牌写着“天黑时打开”。","meaning_cn":"无论何时；每当","usage":"conj. (连词，引导时间状语从句)","collocations":"whenever possible, whenever you like","preposition_combos":"无固定介词搭配","examples":[{"en":"You can call me whenever you need help.","cn":"无论何时你需要帮助，都可以给我打电话。"},{"en":"Whenever I see a rainbow, I feel happy.","cn":"每当我看到彩虹，我就感到开心。"}],"socratic_questions":[{"question":"你想告诉朋友‘任何时候你想来我家都可以’，用哪个词表示‘任何时候’？","answer_hint":"这个词由‘when’和‘ever’组成，表示‘无论何时’。"}],"fill_blank":{"sentences":["___ you visit the city, you will find something new."],"options":["Whenever","Wherever","However","Whatever"],"correct_index":0},"audio":"audio/whenever.mp3","audio_ex0":"audio/whenever_ex0.mp3","audio_ex1":"audio/whenever_ex1.mp3"},{"word":"item","ipa":"/ˈaɪtəm/","image_prompts":["A shopping cart filled with various groceries like apples, bread, and milk","A list on a clipboard with checkboxes next to words like 'tent', 'sleeping bag', 'flashlight'"],"image_desc_en":"A shopping cart with apples, bread, and milk; a clipboard checklist with 'tent', 'sleeping bag', 'flashlight' checked off.","image_desc_cn":"装满苹果、面包和牛奶的购物车；一个带复选框的清单，上面有‘帐篷’、‘睡袋’、‘手电筒’等已勾选项。","meaning_cn":"物品；项目；条款","usage":"n. (可数名词，复数 items)","collocations":"menu item, news item, item of clothing","preposition_combos":"item on + 列表/菜单","examples":[{"en":"Please check each item on the shopping list.","cn":"请核对购物清单上的每一项。"},{"en":"This item is on sale for only five dollars.","cn":"这件物品特价仅售五美元。"}],"socratic_questions":[{"question":"你在超市购物时，收银员扫描了每一样东西，这些‘东西’用哪个词表示？","answer_hint":"这个词可以指清单上的一个条目或一件具体的商品。"}],"fill_blank":{"sentences":["The first ___ on the menu is a hamburger."],"options":["item","food","drink","price"],"correct_index":0},"audio":"audio/item.mp3","audio_ex0":"audio/item_ex0.mp3","audio_ex1":"audio/item_ex1.mp3"},{"word":"spaghetti","ipa":"/spəˈɡeti/","image_prompts":["A plate of spaghetti with tomato sauce and a fork twirling the noodles","A pot of boiling water with spaghetti sticks sticking out of the pot"],"image_desc_en":"A plate of spaghetti with red tomato sauce, a fork twirling the noodles; a pot of boiling water with spaghetti sticks protruding.","image_desc_cn":"一盘淋着番茄酱的意大利面，叉子卷起面条；一锅沸水中露出几根意大利面条。","meaning_cn":"意大利面","usage":"n. (不可数名词)","collocations":"spaghetti bolognese, spaghetti with meatballs, cook spaghetti","preposition_combos":"spaghetti with + 配料","examples":[{"en":"My favorite food is spaghetti with meatballs.","cn":"我最喜欢的食物是意大利肉丸面。"},{"en":"We need to boil the spaghetti for ten minutes.","cn":"我们需要将意大利面煮十分钟。"}],"socratic_questions":[{"question":"你在餐厅点了一份长条形的、蘸着番茄酱的面食，这道菜叫什么？","answer_hint":"这是一种意大利面食，通常和酱料一起食用，名字以‘spa’开头。"}],"fill_blank":{"sentences":["Mom cooked ___ for dinner last night."],"options":["spaghetti","noodles","rice","bread"],"correct_index":0},"audio":"audio/spaghetti.mp3","audio_ex0":"audio/spaghetti_ex0.mp3","audio_ex1":"audio/spaghetti_ex1.mp3"},{"word":"spoon","ipa":"/spuːn/","image_prompts":["A metal spoon resting in a bowl of hot soup, steam rising above the bowl, soft kitchen lighting","A wooden spoon next to a mixing bowl with flour and eggs on a marble countertop"],"image_desc_en":"A metal spoon in a soup bowl with steam; a wooden spoon beside a mixing bowl with ingredients.","image_desc_cn":"汤碗里的一把金属勺，冒着热气；木勺放在搅拌碗旁，碗里有面粉和鸡蛋。","meaning_cn":"n. 勺，调羹","usage":"n. (复数 spoons)","collocations":"a spoon of sugar, stir with a spoon, wooden spoon","preposition_combos":"spoon for soup, spoon in the cup","examples":[{"en":"I need a spoon to eat my yogurt.","cn":"我需要一把勺子吃酸奶。"},{"en":"She put a spoon of honey into the tea.","cn":"她往茶里放了一勺蜂蜜。"}],"socratic_questions":[{"question":"你喝汤时，手里会拿什么餐具来舀汤？","answer_hint":"这个餐具通常有圆形的头部和长柄，用来舀液体或半固体食物。"}],"fill_blank":{"sentences":["Could you pass me a ___ for the soup?"],"options":["spoon","fork","knife","plate"],"correct_index":0},"audio":"audio/spoon.mp3","audio_ex0":"audio/spoon_ex0.mp3","audio_ex1":"audio/spoon_ex1.mp3"},{"word":"slice","ipa":"/slaɪs/","image_prompts":["A single slice of bread on a cutting board, crumbs scattered around, morning sunlight from a window","A slice of watermelon with seeds visible, resting on a green plate, bright outdoor light"],"image_desc_en":"A bread slice on a cutting board with crumbs; a watermelon slice on a green plate.","image_desc_cn":"砧板上的一片面包，周围有面包屑；绿色盘子里的一片西瓜，籽清晰可见。","meaning_cn":"n. 片，薄片；v. 切（片）","usage":"n. (复数 slices); v. (过去式 sliced, 过去分词 sliced)","collocations":"a slice of pizza, slice the cake, thin slice","preposition_combos":"slice of bread, slice into pieces","examples":[{"en":"He ate a slice of cheese for breakfast.","cn":"他早餐吃了一片奶酪。"},{"en":"Please slice the apple into small pieces.","cn":"请把苹果切成小片。"}],"socratic_questions":[{"question":"你过生日时，蛋糕被切成了好几块，每一块叫什么？","answer_hint":"这个词表示从整体上切下来的一小部分，通常是扁平的形状。"}],"fill_blank":{"sentences":["Can I have another ___ of bread?"],"options":["slice","piece","cup","bowl"],"correct_index":0},"audio":"audio/slice.mp3","audio_ex0":"audio/slice_ex0.mp3","audio_ex1":"audio/slice_ex1.mp3"},{"word":"couple","ipa":"/ˈkʌpəl/","image_prompts":["Two coffee mugs sitting side by side on a wooden table, steam rising from both, cozy cafe setting","A pair of bicycles parked together under a tree in a park, autumn leaves on the ground"],"image_desc_en":"Two coffee mugs side by side on a table; two bicycles parked together under a tree.","image_desc_cn":"桌上并排放着的两个咖啡杯，冒着热气；树下停在一起的两辆自行车，地上有秋叶。","meaning_cn":"n. 一对，两个；夫妇","usage":"n. (复数 couples)","collocations":"a couple of days, a married couple, a couple of friends","preposition_combos":"a couple of minutes, couple with","examples":[{"en":"I will finish the work in a couple of hours.","cn":"我将在几个小时内完成工作。"},{"en":"The couple walked along the beach together.","cn":"那对夫妇一起沿着海滩散步。"}],"socratic_questions":[{"question":"你想说“两三个苹果”时，可以用哪个词来表示“两三个”？","answer_hint":"这个词可以表示数量上的“两个”或“几个”，也常用来指代一对伴侣。"}],"fill_blank":{"sentences":["We stayed there for a ___ of weeks."],"options":["couple","pair","few","double"],"correct_index":0},"audio":"audio/couple.mp3","audio_ex0":"audio/couple_ex0.mp3","audio_ex1":"audio/couple_ex1.mp3"},{"word":"island","ipa":"/ˈaɪlənd/","image_prompts":["A small green island surrounded by blue ocean water, white sandy beach visible, clear sky","A tropical island with palm trees and a single hut, calm sea waves lapping the shore"],"image_desc_en":"A green island in blue ocean with sandy beach; a tropical island with palm trees and a hut.","image_desc_cn":"蓝色海洋中的绿色小岛，有白色沙滩；热带岛屿上有棕榈树和一间小屋，海浪轻拍海岸。","meaning_cn":"n. 岛，岛屿","usage":"n. (复数 islands)","collocations":"a desert island, on the island, island nation","preposition_combos":"island in the sea, island off the coast","examples":[{"en":"They took a boat to the small island.","cn":"他们乘船去了那个小岛。"},{"en":"There is a lighthouse on the island.","cn":"岛上有一座灯塔。"}],"socratic_questions":[{"question":"如果你想去一个四面环水、需要坐船才能到达的地方，那是什么地方？","answer_hint":"这个词指被水完全包围的陆地，面积通常比大陆小。"}],"fill_blank":{"sentences":["The ship stopped at a small ___ in the Pacific."],"options":["island","beach","mountain","river"],"correct_index":0},"audio":"audio/island.mp3","audio_ex0":"audio/island_ex0.mp3","audio_ex1":"audio/island_ex1.mp3"},{"word":"wife","ipa":"/waɪf/","image_prompts":["A wedding ring on a wooden table next to a framed photo of a couple, soft morning light","Two coffee mugs on a kitchen counter with a handwritten note saying 'Thank you', warm lighting"],"image_desc_en":"A wedding ring and a framed photo of a couple on a table; two coffee mugs with a handwritten note on a kitchen counter.","image_desc_cn":"桌上放着一枚婚戒和一张夫妻相框照片；厨房台面上有两个咖啡杯和一张写着‘谢谢’的手写便条。","meaning_cn":"妻子；太太","usage":"n. (可数名词，复数 wives)","collocations":"husband and wife, my wife, his wife, a devoted wife","preposition_combos":"wife of (someone)","examples":[{"en":"My wife and I often take a walk after dinner.","cn":"我和妻子经常晚饭后散步。"},{"en":"His wife bought a new dress for the party.","cn":"他妻子为派对买了一条新裙子。"}],"socratic_questions":[{"question":"小明在作文里写‘我的妈妈和爸爸很恩爱’，如果他想提到‘爸爸的伴侣’这个身份，应该用哪个词？","answer_hint":"这个词指已婚女性配偶，与‘丈夫’相对，常用于家庭话题。"}],"fill_blank":{"sentences":["Tom's ___ works as a nurse in the local hospital."],"options":["wife","sister","daughter","mother"],"correct_index":0},"audio":"audio/wife.mp3","audio_ex0":"audio/wife_ex0.mp3","audio_ex1":"audio/wife_ex1.mp3"},{"word":"separate","ipa":"/ˈsepəreɪt/ (v.) /ˈsepərət/ (adj.)","image_prompts":["Two books placed apart on a long wooden table with a clear gap between them, bright daylight","A pair of scissors cutting a piece of paper into two distinct halves, sharp blade visible"],"image_desc_en":"Two books with a gap on a table; scissors cutting paper into two halves.","image_desc_cn":"桌上两本书中间留有空隙；剪刀将一张纸剪成两半。","meaning_cn":"分开；分离；单独的；各自的","usage":"v. (过去式 separated, 过去分词 separated) / adj. / adv. separately","collocations":"separate from, separate into, keep separate, separate rooms","preposition_combos":"separate from, separate into","examples":[{"en":"Please separate the white clothes from the dark ones.","cn":"请把白色衣服和深色衣服分开。"},{"en":"They live in separate cities but still keep in touch.","cn":"他们住在不同的城市，但仍然保持联系。"}],"socratic_questions":[{"question":"整理书包时，你要把课本和练习本放在不同夹层里，这个动作叫什么？","answer_hint":"这个词表示把混在一起的东西分成不同部分或组。"}],"fill_blank":{"sentences":["We need to ___ the recyclable waste from the kitchen trash."],"options":["separate","mix","collect","throw"],"correct_index":0},"audio":"audio/separate.mp3","audio_ex0":"audio/separate_ex0.mp3","audio_ex1":"audio/separate_ex1.mp3"},{"word":"born","ipa":"/bɔːrn/","image_prompts":["A newborn kitten sleeping in a soft blanket inside a cardboard box, warm lamp light","A calendar with a circled date and a small stork sticker next to it, pastel colors"],"image_desc_en":"A newborn kitten in a blanket in a box; a calendar with a circled date and a stork sticker.","image_desc_cn":"纸箱里毯子上的一只新生小猫；日历上圈出一个日期并贴有鹳鸟贴纸。","meaning_cn":"出生；诞生","usage":"v. (过去分词，常用于被动语态 be born)","collocations":"be born in, be born on, be born into, born and raised","preposition_combos":"born in (place/year), born on (date), born into (family)","examples":[{"en":"She was born in a small town near the sea.","cn":"她出生在靠近海边的一个小镇上。"},{"en":"The puppy was born on a cold winter morning.","cn":"小狗在一个寒冷的冬日早晨出生。"}],"socratic_questions":[{"question":"写自我介绍时，你想说‘我2008年3月来到这个世界’，应该用哪个动词的被动形式？","answer_hint":"这个词表示生命的开始，常与‘be’动词连用，后接时间或地点。"}],"fill_blank":{"sentences":["My grandfather was ___ in 1960."],"options":["born","grown","raised","lived"],"correct_index":0},"audio":"audio/born.mp3","audio_ex0":"audio/born_ex0.mp3","audio_ex1":"audio/born_ex1.mp3"},{"word":"one by one","ipa":"/wʌn baɪ wʌn/","image_prompts":["A row of dominoes falling sequentially from left to right, each hitting the next, white background","A line of ants walking in single file into a small hole in the ground, one after another"],"image_desc_en":"Dominoes falling in sequence; ants walking in a line into a hole.","image_desc_cn":"多米诺骨牌依次倒下；蚂蚁排成一列依次爬进洞里。","meaning_cn":"一个接一个地；逐一地","usage":"adv. phrase (副词短语)","collocations":"check one by one, count one by one, enter one by one, read one by one","preposition_combos":"无固定介词搭配","examples":[{"en":"The teacher checked our homework one by one.","cn":"老师逐一检查了我们的作业。"},{"en":"We counted the coins one by one on the desk.","cn":"我们在桌上一枚一枚地数硬币。"}],"socratic_questions":[{"question":"发试卷时，老师让每组同学按顺序依次上来领取，这个顺序动作可以用哪个短语描述？","answer_hint":"这个短语强调每次只做一件事或只处理一个对象，按顺序进行。"}],"fill_blank":{"sentences":["The students handed in their exam papers ___."],"options":["one by one","at once","all together","in a hurry"],"correct_index":0},"audio":"audio/one_by_one.mp3","audio_ex0":"audio/one_by_one_ex0.mp3","audio_ex1":"audio/one_by_one_ex1.mp3"},{"word":"do with","ipa":"/duː wɪð/","image_prompts":["A messy desk covered with scattered papers, a pencil, and a sticky note reading 'What to do with this?' in neat handwriting, soft daylight from a window.","A cardboard box full of old books and a recycling bin next to it, a label on the box says 'Donate', warm indoor lighting."],"image_desc_en":"A cluttered desk with papers and a note asking what to do with the items, or a donation box with old books.","image_desc_cn":"一张堆满纸张的杂乱书桌，上面有便条询问如何处理这些物品；或一个装满旧书的捐赠箱。","meaning_cn":"处理；与……有关（常与 what 连用）","usage":"v. (过去式 did with, 过去分词 done with)","collocations":"what to do with, have nothing to do with","preposition_combos":"do with + 名词/代词","examples":[{"en":"I don't know what to do with these old magazines.","cn":"我不知道如何处理这些旧杂志。"},{"en":"This problem has nothing to do with our project.","cn":"这个问题与我们的项目无关。"}],"socratic_questions":[{"question":"你有一堆不再需要的旧衣服，不知道该怎么处理它们，你会用哪个短语来表达这种‘处理’的意思？","answer_hint":"这个短语常与 what 连用，表示‘如何处理某物’，强调动作的未知性。"}],"fill_blank":{"sentences":["Can you tell me what to ___ these empty bottles?"],"options":["do with","deal with","put with","go with"],"correct_index":0},"audio":"audio/do_with.mp3","audio_ex0":"audio/do_with_ex0.mp3","audio_ex1":"audio/do_with_ex1.mp3"},{"word":"bowl","ipa":"/boʊl/","image_prompts":["A ceramic bowl filled with fresh fruit on a wooden table, natural sunlight casting soft shadows.","A clear glass bowl containing popcorn kernels, placed on a kitchen counter with a stainless steel spoon beside it."],"image_desc_en":"A ceramic bowl with fruit on a wooden table, or a glass bowl with popcorn kernels on a kitchen counter.","image_desc_cn":"一个陶瓷碗盛着水果放在木桌上；或一个玻璃碗装着爆米花粒放在厨房台面上。","meaning_cn":"碗；一碗的量","usage":"n. (复数 bowls)","collocations":"a bowl of, soup bowl, mixing bowl","preposition_combos":"in a bowl, into a bowl","examples":[{"en":"She poured the milk into a large glass bowl.","cn":"她把牛奶倒进一个大玻璃碗里。"},{"en":"I ate a bowl of noodles for lunch today.","cn":"我今天午餐吃了一碗面条。"}],"socratic_questions":[{"question":"你想描述一个用来盛放汤或水果的容器，它通常是圆形的、开口较大，你会想到哪个词？","answer_hint":"这个词指一种常见的餐具，用于盛放食物，尤其是液体或颗粒状食物。"}],"fill_blank":{"sentences":["He filled the ___ with hot soup for dinner."],"options":["bowl","cup","plate","glass"],"correct_index":0},"audio":"audio/bowl.mp3","audio_ex0":"audio/bowl_ex0.mp3","audio_ex1":"audio/bowl_ex1.mp3"},{"word":"heat","ipa":"/hiːt/","image_prompts":["A metal pot on a gas stove with blue flames licking the bottom, steam rising from the boiling water inside.","A thermometer on a sunny windowsill showing a high temperature, with a heat haze visible over the pavement outside."],"image_desc_en":"A pot on a gas stove with flames and steam, or a thermometer showing high temperature with heat haze outside.","image_desc_cn":"一个放在燃气灶上的锅，火焰舔舐锅底，蒸汽升腾；或一个温度计显示高温，窗外路面有热浪。","meaning_cn":"加热；热量；高温","usage":"n. / v. (过去式 heated, 过去分词 heated)","collocations":"heat up, heat wave, low heat","preposition_combos":"heat over, heat in","examples":[{"en":"Please heat the soup over medium heat for five minutes.","cn":"请用中火加热汤五分钟。"},{"cn":"夏天的热量让柏油路变得很烫。","en":"The heat in summer makes the asphalt road very hot."}],"socratic_questions":[{"question":"你想表达‘把冷牛奶变热’这个动作，或者描述夏天的高温天气，应该用哪个词？","answer_hint":"这个词既可以作动词表示‘加热’，也可以作名词表示‘热量’或‘高温’。"}],"fill_blank":{"sentences":["You should ___ the leftovers in the microwave."],"options":["heat","cool","freeze","wash"],"correct_index":0},"audio":"audio/heat.mp3","audio_ex0":"audio/heat_ex0.mp3","audio_ex1":"audio/heat_ex1.mp3"},{"word":"oil","ipa":"/ɔɪl/","image_prompts":["A glass bottle of olive oil on a kitchen counter, with a small puddle of golden oil spilled on a white plate.","A metal can of motor oil on a garage shelf, with a greasy rag next to it and a few drops on the concrete floor."],"image_desc_en":"A glass bottle of olive oil with a spill on a plate, or a metal can of motor oil on a garage shelf with drops on the floor.","image_desc_cn":"一个橄榄油玻璃瓶，旁边白盘上有一小滩金色油渍；或一个金属机油罐放在车库架子上，地上有几滴油。","meaning_cn":"油；石油；润滑油","usage":"n. (不可数名词，复数 oils 指不同种类)","collocations":"cooking oil, oil painting, oil change","preposition_combos":"in oil, with oil","examples":[{"en":"Add a little oil to the pan before frying the eggs.","cn":"煎鸡蛋前在平底锅里加一点油。"},{"en":"The car needs an oil change every six months.","cn":"这辆车每六个月需要换一次机油。"}],"socratic_questions":[{"question":"你在厨房炒菜时需要一种液体来防止食物粘锅，或者在车库看到汽车保养时用到的黑色液体，你会想到哪个词？","answer_hint":"这个词指一种不溶于水的黏稠液体，常用于烹饪或机械润滑。"}],"fill_blank":{"sentences":["Pour some ___ into the salad dressing to make it taste better."],"options":["oil","water","vinegar","salt"],"correct_index":0},"audio":"audio/oil.mp3","audio_ex0":"audio/oil_ex0.mp3","audio_ex1":"audio/oil_ex1.mp3"},{"word":"pan","ipa":"/pæn/","image_prompts":["A stainless steel frying pan on a gas stove with blue flame underneath, empty and clean","A non-stick pan with scrambled eggs being flipped in mid-air, golden color, kitchen counter background"],"image_desc_en":"A frying pan on a stove with fire; eggs being flipped in a pan.","image_desc_cn":"一个煎锅在炉灶上，火焰在锅底；鸡蛋在锅中翻动。","meaning_cn":"平底锅；煎锅","usage":"n. (可数名词) 平底锅，常用于烹饪","collocations":"frying pan, pan lid, pan handle, hot pan","preposition_combos":"in a pan, from the pan, into the pan","examples":[{"en":"Mom heated some oil in a pan for cooking.","cn":"妈妈在平底锅里热了些油准备做饭。"},{"en":"The pan is too hot to touch without gloves.","cn":"这个平底锅太烫了，不戴手套不能碰。"}],"socratic_questions":[{"question":"你想煎一个鸡蛋，需要用什么厨房工具来盛放油和鸡蛋？","answer_hint":"这个词是一种底部平坦、有手柄的金属容器，专门用来煎炒食物。"}],"fill_blank":{"sentences":["Please pass me the ___ so I can fry the fish."],"options":["pan","pot","plate","bowl"],"correct_index":0},"audio":"audio/pan.mp3","audio_ex0":"audio/pan_ex0.mp3","audio_ex1":"audio/pan_ex1.mp3"},{"word":"put sth back","ipa":"/pʊt sʌmθɪŋ bæk/","image_prompts":["A hand placing a book onto a shelf where other books stand neatly, library setting","A toy block being returned into a plastic storage bin with other blocks, organized playroom"],"image_desc_en":"A book being placed back on a shelf; a block being put into a bin.","image_desc_cn":"一本书被放回书架；一块积木被放回收纳箱。","meaning_cn":"把某物放回原处","usage":"v. (短语动词) 及物，必须分开或一起使用，宾语放在 back 前或后均可","collocations":"put the book back, put it back, put everything back","preposition_combos":"put sth back on/in/into","examples":[{"en":"After reading, please put the magazine back on the shelf.","cn":"读完杂志后，请把它放回书架上。"},{"en":"He put the tools back in the box after fixing the bike.","cn":"修好自行车后，他把工具放回了箱子里。"}],"socratic_questions":[{"question":"你在图书馆借了一本书，看完后应该怎么做才能方便下一个人找到？","answer_hint":"这个短语表示把物品归还到它原本所在的位置，不是随便放。"}],"fill_blank":{"sentences":["Don't forget to ___ the dictionary ___ after you use it."],"options":["put...back","take...away","throw...out","pick...up"],"correct_index":0},"audio":"audio/put_sth_back.mp3","audio_ex0":"audio/put_sth_back_ex0.mp3","audio_ex1":"audio/put_sth_back_ex1.mp3"},{"word":"simple","ipa":"/ˈsɪmpl/","image_prompts":["A plain white plate with a single apple on it, minimalistic table setting","A one-line black ink drawing of a tree on white paper, no extra details"],"image_desc_en":"A white plate with one apple; a minimal line drawing of a tree.","image_desc_cn":"一个白色盘子上放着一个苹果；一幅极简的线条树画。","meaning_cn":"简单的；朴素的；容易的","usage":"adj. (形容词) 可修饰事物或任务","collocations":"simple answer, simple life, simple steps, simple design","preposition_combos":"simple for sb, simple to do","examples":[{"en":"This math problem is simple and easy to solve.","cn":"这道数学题很简单，容易解答。"},{"en":"She prefers a simple life without too many gadgets.","cn":"她更喜欢简单的生活，没有太多电子设备。"}],"socratic_questions":[{"question":"老师出了一道题，你一眼就知道答案，不需要复杂计算，你会怎么形容这道题？","answer_hint":"这个词表示不复杂、不困难，和‘容易’意思相近。"}],"fill_blank":{"sentences":["The instructions are so ___ that even a beginner can follow them."],"options":["simple","difficult","confusing","long"],"correct_index":0},"audio":"audio/simple.mp3","audio_ex0":"audio/simple_ex0.mp3","audio_ex1":"audio/simple_ex1.mp3"},{"word":"ingredient","ipa":"/ɪnˈɡriːdiənt/","image_prompts":["A wooden table with flour, eggs, sugar, and butter arranged in small bowls, baking preparation","A glass jar labeled 'spice mix' surrounded by cinnamon sticks, cloves, and star anise on a marble counter"],"image_desc_en":"Flour, eggs, sugar, butter in bowls; spice jar with cinnamon and cloves.","image_desc_cn":"碗中的面粉、鸡蛋、糖和黄油；装有肉桂和丁香的香料罐。","meaning_cn":"成分；原料；要素","usage":"n. (可数名词) 常用于烹饪或比喻构成某事物的部分","collocations":"main ingredient, secret ingredient, key ingredient, cooking ingredients","preposition_combos":"ingredient in/for","examples":[{"en":"Flour and eggs are basic ingredients for making a cake.","cn":"面粉和鸡蛋是做蛋糕的基本原料。"},{"en":"Honesty is an important ingredient in a good friendship.","cn":"诚实是良好友谊的重要要素。"}],"socratic_questions":[{"question":"你想做一碗番茄鸡蛋面，需要准备番茄、鸡蛋、面条和盐，这些可以统称为什么？","answer_hint":"这个词指组成一道菜或一个混合物的各个部分，比如食谱里列出的东西。"}],"fill_blank":{"sentences":["The most important ___ in this soup is fresh tomatoes."],"options":["ingredient","tool","container","recipe"],"correct_index":0},"audio":"audio/ingredient.mp3","audio_ex0":"audio/ingredient_ex0.mp3","audio_ex1":"audio/ingredient_ex1.mp3"},{"word":"instruction","ipa":"/ɪnˈstrʌkʃən/","image_prompts":["A clear step-by-step manual with numbered diagrams for assembling a wooden bookshelf, open on a desk","A whiteboard filled with bullet-pointed directions for a science experiment, colorful markers"],"image_desc_en":"A manual or whiteboard with numbered steps and diagrams for a task.","image_desc_cn":"一本带编号步骤和图表的手册或一块写有任务步骤的白板。","meaning_cn":"指令；说明；教导","usage":"n. (可数名词，常复数 instructions)","collocations":"follow instructions, give instructions, read the instructions","preposition_combos":"instructions for (doing) sth; instructions on how to do sth","examples":[{"en":"Please read the instructions carefully before you start the test.","cn":"开始测试前请仔细阅读说明。"},{"en":"The teacher gave clear instructions for the group project.","cn":"老师对小组项目给出了清晰的指令。"}],"socratic_questions":[{"question":"你买了一个新书架，打开盒子发现里面有一张纸，上面画着步骤图，这张纸叫什么？","answer_hint":"这个词常与“follow”或“read”搭配，表示操作指南。"}],"fill_blank":{"sentences":["Before using the new printer, you should read the ___ first."],"options":["instructions","invitations","introductions","inventions"],"correct_index":0},"audio":"audio/instruction.mp3","audio_ex0":"audio/instruction_ex0.mp3","audio_ex1":"audio/instruction_ex1.mp3"},{"word":"steamed fish","ipa":"/stiːmd fɪʃ/","image_prompts":["A white ceramic plate holding a whole steamed fish with ginger slices and green onions on top, steam rising","A close-up of a steamed fish fillet on a bamboo steamer basket, soy sauce drizzled around"],"image_desc_en":"A whole fish or fillet cooked by steam, garnished with ginger and scallions on a plate.","image_desc_cn":"一盘用蒸汽烹饪的整鱼或鱼片，上面点缀着姜丝和葱花。","meaning_cn":"清蒸鱼","usage":"n. (不可数名词，常作一道菜名)","collocations":"order steamed fish, cook steamed fish, enjoy steamed fish","preposition_combos":"steamed fish with ginger; steamed fish in soy sauce","examples":[{"en":"My mother often cooks steamed fish for dinner on weekends.","cn":"我妈妈周末晚餐常做清蒸鱼。"},{"en":"Steamed fish is a healthy dish because it uses little oil.","cn":"清蒸鱼是一道健康菜，因为用油很少。"}],"socratic_questions":[{"question":"你去一家中餐馆，想点一道少油、用蒸汽做的鱼，菜名里应该有什么词？","answer_hint":"这个词组描述一种烹饪方式，鱼不是煎或炸的。"}],"fill_blank":{"sentences":["For a light and healthy meal, I would like to order ___."],"options":["steamed fish","fried chicken","roast beef","boiled eggs"],"correct_index":0},"audio":"audio/steamed_fish.mp3","audio_ex0":"audio/steamed_fish_ex0.mp3","audio_ex1":"audio/steamed_fish_ex1.mp3"},{"word":"sour","ipa":"/ˈsaʊər/","image_prompts":["A sliced lemon on a cutting board with juice droplets visible, bright yellow rind","A jar of pickles floating in vinegar, bubbles around the cucumbers"],"image_desc_en":"A lemon slice with visible juice or pickles in vinegar, emphasizing a sharp taste.","image_desc_cn":"一片带可见汁液的柠檬或泡在醋里的腌菜，强调尖锐的酸味。","meaning_cn":"酸的；酸味的","usage":"adj. (比较级 sourer, 最高级 sourest)","collocations":"sour taste, sour candy, go sour","preposition_combos":"sour to the taste; sour like a lemon","examples":[{"en":"The green apple tastes very sour, so I put some sugar on it.","cn":"这个青苹果很酸，所以我放了点糖在上面。"},{"en":"If you leave milk out too long, it will go sour.","cn":"如果你把牛奶放太久，它会变酸。"}],"socratic_questions":[{"question":"你咬了一口没熟的青柠檬，嘴里立刻涌出一种强烈的味道，这种味道叫什么？","answer_hint":"这种味道和甜、苦、咸并列，常让人皱眉。"}],"fill_blank":{"sentences":["The lemon juice made the drink taste too ___ for me."],"options":["sour","sweet","salty","bitter"],"correct_index":0},"audio":"audio/sour.mp3","audio_ex0":"audio/sour_ex0.mp3","audio_ex1":"audio/sour_ex1.mp3"},{"word":"hot and sour","ipa":"/hɒt ænd ˈsaʊər/","image_prompts":["A bowl of hot and sour soup with tofu shreds, wood ear mushrooms, and red chili oil floating on top","A close-up of a steaming bowl of soup with vinegar and pepper visible as seasonings on the surface"],"image_desc_en":"A bowl of soup with tofu, mushrooms, and chili oil, showing both spicy and sour elements.","image_desc_cn":"一碗有豆腐、木耳和辣椒油的汤，同时呈现辣和酸的元素。","meaning_cn":"酸辣的","usage":"adj. (固定短语，常修饰 soup, noodles 等)","collocations":"hot and sour soup, hot and sour flavor, hot and sour noodles","preposition_combos":"hot and sour with vinegar; hot and sour in taste","examples":[{"en":"Hot and sour soup is a popular dish in Chinese restaurants.","cn":"酸辣汤是中餐馆里一道受欢迎的菜。"},{"en":"I like to add extra vinegar to make the noodles more hot and sour.","cn":"我喜欢多加醋让面条更酸辣。"}],"socratic_questions":[{"question":"你感冒了，想喝一碗又辣又酸的汤来发汗，这道汤的名字里应该包含哪两个词？","answer_hint":"这两个词分别描述温度和味道，组合起来是一种经典汤品。"}],"fill_blank":{"sentences":["To warm up on a cold day, I ordered a bowl of ___ soup."],"options":["hot and sour","sweet and sour","cold and spicy","mild and salty"],"correct_index":0},"audio":"audio/hot_and_sour.mp3","audio_ex0":"audio/hot_and_sour_ex0.mp3","audio_ex1":"audio/hot_and_sour_ex1.mp3"},{"word":"mess","ipa":"/mes/","image_prompts":["A cluttered desk covered with scattered papers, crumpled balls of paper, and an overturned cup of coffee, with a single lamp casting a shadow over the chaos","A kitchen counter with spilled flour, broken eggshells, and a tipped-over bowl, sticky liquid dripping onto the floor tiles"],"image_desc_en":"A chaotic pile of objects creating disorder in a room","image_desc_cn":"房间里一堆杂乱无章的物品造成混乱","meaning_cn":"混乱，脏乱；弄乱","usage":"n. (可数名词，常用单数) / v. (过去式 messed, 过去分词 messed)","collocations":"in a mess, make a mess, clean up the mess","preposition_combos":"mess with, mess up","examples":[{"en":"My little brother made a big mess in the living room.","cn":"我弟弟在客厅里弄得一团糟。"},{"en":"Please clean up your mess before dinner starts.","cn":"请在晚餐开始前清理干净你的烂摊子。"}],"socratic_questions":[{"question":"你写完作业后，书桌上堆满了书本、笔和废纸，看起来很不整洁。你会用什么词形容这个状态？","answer_hint":"这个词强调杂乱无章、需要收拾的状态，不是简单的‘脏’（dirty）。"}],"fill_blank":{"sentences":["After the party, the room was a complete ___ with cups and plates everywhere."],"options":["mess","party","game","show"],"correct_index":0},"audio":"audio/mess.mp3","audio_ex0":"audio/mess_ex0.mp3","audio_ex1":"audio/mess_ex1.mp3"},{"word":"pretty","ipa":"/ˈprɪti/","image_prompts":["A garden full of blooming pink roses with dew drops on petals, soft sunlight filtering through leaves","A neatly wrapped gift box with a shiny red ribbon and a small bow on top, placed on a wooden table"],"image_desc_en":"Something visually pleasing and delicate in appearance","image_desc_cn":"外观上令人愉悦且精致的事物","meaning_cn":"漂亮的，好看的；相当，颇","usage":"adj. / adv. (比较级 prettier, 最高级 prettiest)","collocations":"pretty good, pretty soon, pretty girl (但注意避免人物，可用 pretty flower)","preposition_combos":"无常见介词搭配","examples":[{"en":"The sunset looks pretty from the top of the hill.","cn":"从山顶上看，日落非常漂亮。"},{"en":"I think this blue dress is pretty enough for the party.","cn":"我觉得这条蓝裙子穿去派对已经够漂亮了。"}],"socratic_questions":[{"question":"你看到一朵花颜色柔和、形状可爱，让人忍不住想多看几眼。你会怎么形容它？","answer_hint":"这个词比‘beautiful’更日常、更轻快，常用于形容小巧可爱的事物。"}],"fill_blank":{"sentences":["The weather today is ___ nice, so we can go for a walk."],"options":["pretty","ugly","terrible","boring"],"correct_index":0},"audio":"audio/pretty.mp3","audio_ex0":"audio/pretty_ex0.mp3","audio_ex1":"audio/pretty_ex1.mp3"},{"word":"Christmas","ipa":"/ˈkrɪsməs/","image_prompts":["A decorated evergreen tree with colorful ornaments, tinsel, and a glowing star on top, surrounded by wrapped gift boxes underneath","A fireplace mantel with stockings hung in a row, a warm fire burning inside the hearth, and a clock showing midnight"],"image_desc_en":"A festive winter holiday scene with decorations and gifts","image_desc_cn":"一个带有装饰和礼物的冬日节日场景","meaning_cn":"圣诞节","usage":"n. (专有名词，首字母大写)","collocations":"Christmas Eve, Christmas Day, Christmas tree, Christmas gift","preposition_combos":"at Christmas, on Christmas Day","examples":[{"en":"We always put up the Christmas tree in early December.","cn":"我们总是在十二月初就装饰好圣诞树。"},{"en":"My family gets together for a big dinner on Christmas Eve.","cn":"我家人在圣诞夜聚在一起吃一顿丰盛的晚餐。"}],"socratic_questions":[{"question":"一年中有一个节日，人们会装饰树、交换礼物、吃大餐，而且是在冬天。这是什么节日？","answer_hint":"这个节日在12月25日，名字里带有‘基督’的意思，但现在已经是一个全球性的文化节日。"}],"fill_blank":{"sentences":["Children often hang stockings by the fireplace on ___ Eve."],"options":["Christmas","Easter","Halloween","New Year"],"correct_index":0},"audio":"audio/Christmas.mp3","audio_ex0":"audio/Christmas_ex0.mp3","audio_ex1":"audio/Christmas_ex1.mp3"},{"word":"pancake","ipa":"/ˈpænkeɪk/","image_prompts":["A stack of golden pancakes on a white plate with maple syrup dripping down the sides, steam rising","A round pancake in a frying pan with bubbles forming on the surface, kitchen counter background"],"image_desc_en":"A stack of pancakes with syrup and steam","image_desc_cn":"一叠煎饼，淋着糖浆，冒着热气","meaning_cn":"薄煎饼；烙饼","usage":"n. (可数名词，复数 pancakes)","collocations":"make pancakes, eat pancakes, a stack of pancakes","preposition_combos":"pancake with syrup, pancake for breakfast","examples":[{"en":"My mom makes delicious pancakes with fresh fruit every Sunday.","cn":"我妈妈每个周日都会做美味的煎饼配新鲜水果。"},{"en":"We bought a stack of pancakes from the morning market.","cn":"我们从早市买了一叠煎饼。"}],"socratic_questions":[{"question":"周末早上你闻到厨房里飘来香甜的味道，妈妈正在平底锅里煎一种圆圆的、金黄色的面食，这是什么？","answer_hint":"这是一种常见的早餐食品，圆而扁平，通常搭配糖浆或水果食用。"}],"fill_blank":{"sentences":["For breakfast, I like to eat a ___ with honey and butter."],"options":["pancake","sandwich","noodle","rice"],"correct_index":0},"audio":"audio/pancake.mp3","audio_ex0":"audio/pancake_ex0.mp3","audio_ex1":"audio/pancake_ex1.mp3"},{"word":"dream","ipa":"/driːm/","image_prompts":["A glowing light bulb floating above an open notebook with scribbled ideas, soft blue background","A starry night sky with a single bright shooting star crossing above a calm lake"],"image_desc_en":"A light bulb above a notebook with ideas","image_desc_cn":"笔记本上方发光的灯泡，写满想法","meaning_cn":"梦想；梦","usage":"n. (可数名词，复数 dreams); v. (过去式 dreamed/dreamt, 过去分词 dreamed/dreamt)","collocations":"have a dream, realize one's dream, dream of/about","preposition_combos":"dream of becoming, dream about the future","examples":[{"en":"Her dream is to travel around the world after graduation.","cn":"她的梦想是毕业后环游世界。"},{"en":"I dreamed about flying over the mountains last night.","cn":"昨晚我梦见飞过群山。"}],"socratic_questions":[{"question":"你晚上睡觉时脑海里会出现一些奇妙的画面，比如在天空飞翔；白天你也常常想着长大后要做什么，这些想法可以用一个词概括，是什么？","answer_hint":"这个词既指睡眠中的梦，也指对未来的美好愿望。"}],"fill_blank":{"sentences":["Everyone should have a ___ and work hard to make it come true."],"options":["dream","job","test","game"],"correct_index":0},"audio":"audio/dream.mp3","audio_ex0":"audio/dream_ex0.mp3","audio_ex1":"audio/dream_ex1.mp3"},{"word":"university","ipa":"/ˌjuːnɪˈvɜːrsəti/","image_prompts":["A large stone archway with 'University Library' carved above it, autumn leaves on the ground","A row of tall brick buildings with ivy climbing the walls, a clock tower in the distance"],"image_desc_en":"A stone archway of a university library with autumn leaves","image_desc_cn":"大学图书馆的石拱门，地面铺满秋叶","meaning_cn":"大学","usage":"n. (可数名词，复数 universities)","collocations":"go to university, study at university, university campus","preposition_combos":"at university, in a university","examples":[{"en":"My sister studies biology at a famous university in Beijing.","cn":"我姐姐在北京一所著名大学学习生物学。"},{"en":"After high school, he plans to go to university abroad.","cn":"高中毕业后，他计划去国外上大学。"}],"socratic_questions":[{"question":"你表哥高中毕业后去了一个有很多教学楼、图书馆和实验室的地方继续深造，那里比中学大很多，学生都学习专业课程，这是什么地方？","answer_hint":"这是高等教育机构，通常提供本科和研究生课程，比college规模更大。"}],"fill_blank":{"sentences":["She hopes to get a scholarship to study at a top ___."],"options":["university","hospital","museum","factory"],"correct_index":0},"audio":"audio/university.mp3","audio_ex0":"audio/university_ex0.mp3","audio_ex1":"audio/university_ex1.mp3"},{"word":"go boating","ipa":"/ɡoʊ ˈboʊtɪŋ/","image_prompts":["Two wooden rowboats tied to a dock on a calm lake, reflections of trees in the water","A small sailboat with white sails gliding across a blue lake under a clear sky"],"image_desc_en":"Two rowboats tied to a dock on a calm lake","image_desc_cn":"两艘划艇系在平静湖面的码头上","meaning_cn":"去划船","usage":"动词短语 (go + v-ing 结构，用于表示休闲活动)","collocations":"go boating on the lake, go boating with friends","preposition_combos":"go boating on, go boating in","examples":[{"en":"We plan to go boating on the lake this weekend.","cn":"我们计划这个周末去湖上划船。"},{"en":"Going boating is a great way to relax after exams.","cn":"考试后去划船是放松的好方式。"}],"socratic_questions":[{"question":"周末天气晴朗，你和家人来到公园的湖边，租了一艘小船，用桨划水前进，这种活动叫什么？","answer_hint":"这是一个动词短语，由'去'和一个表示水上活动的-ing形式组成。"}],"fill_blank":{"sentences":["On sunny days, my family likes to ___ on the river."],"options":["go boating","go shopping","go fishing","go hiking"],"correct_index":0},"audio":"audio/go_boating.mp3","audio_ex0":"audio/go_boating_ex0.mp3","audio_ex1":"audio/go_boating_ex1.mp3"},{"word":"memory","ipa":"/ˈmeməri/","image_prompts":["A worn-out photo album lying open on a wooden table, faded photographs with curled edges, soft warm lighting","A stack of old letters tied with a red ribbon, sitting on a dusty attic floor, sunlight streaming through a small window"],"image_desc_en":"A worn-out photo album lying open on a wooden table, faded photographs with curled edges, soft warm lighting","image_desc_cn":"一本破旧的相册摊开在木桌上，褪色的照片边缘卷曲，柔和温暖的灯光","meaning_cn":"记忆；回忆","usage":"n. (可数名词，复数 memories)","collocations":"have a good memory, in memory of, bring back memories","preposition_combos":"memory of (sth/sb)","examples":[{"en":"The old photo brings back sweet memories of my childhood.","cn":"这张旧照片带回了童年的美好回忆。"},{"en":"She has a clear memory of the first day at school.","cn":"她对开学第一天有清晰的记忆。"}],"socratic_questions":[{"question":"小明看到一张小学毕业照，突然想起很多过去的事。他脑子里浮现的是什么？","answer_hint":"这个词指过去经历留在脑海中的印象，不是照片本身，而是脑海中的画面。"}],"fill_blank":{"sentences":["The song always brings back happy ___ of our summer vacation."],"options":["memories","dreams","plans","ideas"],"correct_index":0},"audio":"audio/memory.mp3","audio_ex0":"audio/memory_ex0.mp3","audio_ex1":"audio/memory_ex1.mp3"},{"word":"visible","ipa":"/ˈvɪzəbl/","image_prompts":["A tall lighthouse on a rocky cliff, its bright beam cutting through thick fog, clearly seen from a distance","A large clock tower against a clear blue sky, every detail of the clock face sharp and distinct"],"image_desc_en":"A tall lighthouse on a rocky cliff, its bright beam cutting through thick fog, clearly seen from a distance","image_desc_cn":"一座高耸的灯塔在岩石悬崖上，明亮的光束穿透浓雾，从远处清晰可见","meaning_cn":"看得见的；明显的","usage":"adj. (副词 visibly)","collocations":"clearly visible, barely visible, visible to the naked eye","preposition_combos":"visible to (sb), visible from (somewhere)","examples":[{"en":"The mountain peak is visible from our classroom window.","cn":"从我们教室的窗户能看到山顶。"},{"en":"The writing on the blackboard is barely visible in the back row.","cn":"黑板上的字在后排几乎看不见。"}],"socratic_questions":[{"question":"大雾天，你站在窗前，远处的教学楼只能看到一个模糊的轮廓。这个轮廓是什么状态？","answer_hint":"这个词描述的是能被眼睛看到的状态，与'看不见'相反。"}],"fill_blank":{"sentences":["The stars are not ___ in the city because of the bright lights."],"options":["visible","invisible","possible","terrible"],"correct_index":0},"audio":"audio/visible.mp3","audio_ex0":"audio/visible_ex0.mp3","audio_ex1":"audio/visible_ex1.mp3"},{"word":"along with sb","ipa":"/əˈlɒŋ wɪð ˈsʌmbədi/","image_prompts":["A row of three backpacks hanging on hooks in a school hallway, side by side in a line","Two bicycles parked next to each other under a tree, their front wheels touching slightly"],"image_desc_en":"A row of three backpacks hanging on hooks in a school hallway, side by side in a line","image_desc_cn":"三个背包并排挂在走廊的挂钩上，一个挨着一个","meaning_cn":"和……一起；连同","usage":"prepositional phrase (along with + 名词/代词)","collocations":"go along with, work along with, bring sth along with","preposition_combos":"along with (sb/sth)","examples":[{"en":"Please bring your homework along with your textbook tomorrow.","cn":"明天请把作业和课本一起带来。"},{"en":"She went to the library along with her best friend.","cn":"她和最好的朋友一起去了图书馆。"}],"socratic_questions":[{"question":"老师让小明交作业时，还要把家长签字的那张纸也一起交上去。老师用了什么短语表示'一起'？","answer_hint":"这个短语表示两个事物或人同时出现、伴随发生，强调'伴随'关系。"}],"fill_blank":{"sentences":["The teacher came into the classroom ___ a box of new books."],"options":["along with","instead of","because of","without"],"correct_index":0},"audio":"audio/along_with_sb.mp3","audio_ex0":"audio/along_with_sb_ex0.mp3","audio_ex1":"audio/along_with_sb_ex1.mp3"},{"word":"pumpkin","ipa":"/ˈpʌmpkɪn/","image_prompts":["A large orange pumpkin sitting on a wooden crate in a farm field, green vines curling around its base","A carved jack-o'-lantern on a stone step, candlelight flickering through its triangular eyes and jagged smile"],"image_desc_en":"A large orange pumpkin sitting on a wooden crate in a farm field, green vines curling around its base","image_desc_cn":"一个大橙色的南瓜放在农田的木箱上，绿色的藤蔓缠绕在底部","meaning_cn":"南瓜","usage":"n. (可数名词，复数 pumpkins)","collocations":"pumpkin pie, pumpkin lantern, carve a pumpkin","preposition_combos":"pumpkin in (soup/pie), pumpkin with (candles)","examples":[{"en":"We made a big pumpkin lantern for Halloween last night.","cn":"昨晚我们做了一个大南瓜灯来庆祝万圣节。"},{"en":"My mother bakes a delicious pumpkin pie every autumn.","cn":"每年秋天我妈妈都会烤一个美味的南瓜派。"}],"socratic_questions":[{"question":"万圣节到了，同学们在教室里摆了一个橙色的、圆滚滚的东西，还在上面刻了眼睛和嘴巴。这是什么？","answer_hint":"这是一种秋季成熟的蔬菜，颜色橙黄，常被挖空做成灯笼。"}],"fill_blank":{"sentences":["For Halloween, we carved a big ___ and put a candle inside."],"options":["pumpkin","watermelon","apple","potato"],"correct_index":0},"audio":"audio/pumpkin.mp3","audio_ex0":"audio/pumpkin_ex0.mp3","audio_ex1":"audio/pumpkin_ex1.mp3"},{"word":"pie","ipa":"/paɪ/","image_prompts":["A whole apple pie on a wooden table with a slice missing, golden crust and steam rising","A blueberry pie cooling on a wire rack, purple filling bubbling through lattice crust"],"image_desc_en":"A whole apple pie on a wooden table with a slice missing, golden crust and steam rising","image_desc_cn":"一个完整的苹果派放在木桌上，缺了一块，金黄色的外皮冒着热气","meaning_cn":"馅饼；派","usage":"n. (可数名词，复数 pies)","collocations":"apple pie, pumpkin pie, piece of pie, bake a pie","preposition_combos":"pie with... (如 pie with ice cream)","examples":[{"en":"My mom baked an apple pie for the family dinner.","cn":"我妈妈为家庭晚餐烤了一个苹果派。"},{"en":"We shared a warm pumpkin pie after the Thanksgiving meal.","cn":"感恩节大餐后我们分享了一个热南瓜派。"}],"socratic_questions":[{"question":"你参加学校烘焙义卖，想带一种甜点，它通常是圆形的，里面有水果馅，外皮酥脆，你会带什么？","answer_hint":"这是一种常见的甜点，有水果馅和酥皮，比如苹果或南瓜口味。"}],"fill_blank":{"sentences":["For dessert, I would like a slice of apple ___ with ice cream."],"options":["pie","cake","bread","cookie"],"correct_index":0},"audio":"audio/pie.mp3","audio_ex0":"audio/pie_ex0.mp3","audio_ex1":"audio/pie_ex1.mp3"},{"word":"warm up","ipa":"/wɔːrm ʌp/","image_prompts":["A pair of running shoes on a gym floor next to a foam roller and a water bottle","A bicycle parked on a sunny path with a helmet resting on the handlebars"],"image_desc_en":"A pair of running shoes on a gym floor next to a foam roller and a water bottle","image_desc_cn":"一双跑鞋放在健身房地板上，旁边是泡沫轴和水瓶","meaning_cn":"热身；做准备活动","usage":"v. (过去式 warmed up, 过去分词 warmed up) 也可作名词 warm-up","collocations":"warm up before exercise, do a warm-up, warm up muscles","preposition_combos":"warm up for... (如 warm up for a race)","examples":[{"en":"We should warm up before running to avoid injury.","cn":"跑步前我们应该热身以避免受伤。"},{"en":"The team did a ten-minute warm-up before the match.","cn":"队伍在比赛前做了十分钟热身。"}],"socratic_questions":[{"question":"体育课上，老师让大家在跑步前先做一些拉伸和慢跑，这个准备活动叫什么？","answer_hint":"这是运动前让身体活动开、防止受伤的环节，通常包括拉伸和轻度运动。"}],"fill_blank":{"sentences":["Before the basketball game, the players need to ___ for ten minutes."],"options":["warm up","cool down","sit down","stand up"],"correct_index":0},"audio":"audio/warm_up.mp3","audio_ex0":"audio/warm_up_ex0.mp3","audio_ex1":"audio/warm_up_ex1.mp3"},{"word":"cinnamon","ipa":"/ˈsɪnəmən/","image_prompts":["A close-up of cinnamon sticks tied with twine on a rustic wooden counter","A bowl of ground cinnamon powder next to a wooden spoon, soft natural light"],"image_desc_en":"A close-up of cinnamon sticks tied with twine on a rustic wooden counter","image_desc_cn":"肉桂棒用细绳捆在一起，放在乡村风格的木制台面上特写","meaning_cn":"肉桂；肉桂粉","usage":"n. (不可数名词)","collocations":"cinnamon roll, cinnamon powder, cinnamon stick, add cinnamon","preposition_combos":"cinnamon in... (如 cinnamon in tea)","examples":[{"en":"I love the smell of cinnamon in hot apple cider.","cn":"我喜欢热苹果酒里肉桂的香味。"},{"en":"She sprinkled some cinnamon on her oatmeal for breakfast.","cn":"她在早餐的燕麦片上撒了一些肉桂粉。"}],"socratic_questions":[{"question":"你闻到一种温暖甜美的香料味，它常被加在苹果派或热饮里，颜色是棕色的，这是什么香料？","answer_hint":"这是一种常见的烘焙香料，有独特的甜味和香气，常以棒状或粉末形式出现。"}],"fill_blank":{"sentences":["The baker added a teaspoon of ___ to the apple pie filling."],"options":["cinnamon","salt","sugar","pepper"],"correct_index":0},"audio":"audio/cinnamon.mp3","audio_ex0":"audio/cinnamon_ex0.mp3","audio_ex1":"audio/cinnamon_ex1.mp3"}]}]};</script>

async function initSpeech() {

    reviewIdx = p.reviewIdx||0;

  return null;
}
function updateProgress() {

/* ═══════════════════════════════════════════════
   Unit 加载
═══════════════════════════════════════════════ */
async function selectUnit(n) {
  currentUnit = n; wordIndex = 0;
  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
}
async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {
  unitData = VOCAB_DATA ? (VOCAB_DATA.units||[]).find(u=>(u.unit||u)===n) : null;
  if (!unitData?.words?.length) { alert("该单元无单词数据"); throw new Error("no data"); }
  allWords = unitData.words.filter(w=>w.word&&!w.error);
  saveProgress();
