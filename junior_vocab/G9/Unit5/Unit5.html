<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人教版词汇学习</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="../../vocab_pdf.js"></script>
  <script src="../../vocab_teacher_wordlist.js"></script>
  <style>
    :root {
      --bg:        #0d0f1a;
      --surface:   #161829;
      --surface2:  #1e2137;
      --border:    rgba(255,255,255,0.07);
      --primary:   #7c6df0;
      --primary-d: #5a4dd4;
      --accent:    #22d3c5;
      --pink:      #f472b6;
      --amber:     #fbbf24;
      --green:     #4ade80;
      --red:       #f87171;
      --text:      #e2e8f0;
      --sub:       #94a3b8;
      --muted:     #475569;
      --radius:    20px;
      --radius-sm: 12px;
      --glass:     rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:'Nunito','Noto Sans SC',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,109,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(34,211,197,0.12) 0%, transparent 60%);
    }
    .app{max-width:680px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0;margin-bottom:8px;
    }
    .progress-info{display:flex;align-items:center;gap:10px}
    .progress-text{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
    .progress-track{width:100px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .topbar-btns{display:flex;gap:8px}
    .tb-btn{
      background:var(--surface2);border:1px solid var(--border);color:var(--sub);
      padding:8px 14px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;
      transition:all .2s;
    }
    .tb-btn:hover{background:var(--surface);color:var(--text)}
    .tb-btn.teacher{background:rgba(74,222,128,0.15);color:var(--green);border-color:rgba(74,222,128,0.3)}

    /* ── Pages ── */
    .page{display:none;animation:fadeUp .35s cubic-bezier(.4,0,.2,1)}
    .page.active{display:block}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

    /* ── Card ── */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:28px 24px;
      margin-bottom:12px;
      position:relative;overflow:hidden;
    }
    .card::before{
      content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,transparent 60%);
      pointer-events:none;
    }

    /* ── Step badge ── */
    .step-badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 14px 5px 10px;border-radius:99px;
      font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      margin-bottom:20px;
    }
    .step-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
    .badge-indigo{background:rgba(124,109,240,.18);color:#a78bfa;border:1px solid rgba(124,109,240,.3)}
    .badge-orange{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
    .badge-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
    .badge-emerald{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
    .badge-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .badge-pink{background:rgba(244,114,182,.15);color:#f472b6;border:1px solid rgba(244,114,182,.3)}

    /* ── Review step dots ── */
    .step-dots{display:flex;gap:6px;margin-bottom:18px}
    .step-dot{
      height:4px;border-radius:99px;transition:all .3s;
      background:var(--surface2);flex:1;
    }
    .step-dot.active{background:var(--primary)}
    .step-dot.done{background:var(--accent)}

    /* ── Word display ── */
    .word-hero{
      font-family:'Outfit',sans-serif;
      font-size:3rem;font-weight:900;
      background:linear-gradient(135deg,#fff 0%,#c4b5fd 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:-.03em;line-height:1.1;
      margin-bottom:6px;
    }
    .ipa{
      font-family:'JetBrains Mono',monospace;
      font-size:1.1rem;color:var(--accent);
      margin-bottom:24px;opacity:.85;
    }

    /* ── Buttons ── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:13px 22px;border:none;border-radius:var(--radius-sm);
      font-size:.95rem;font-weight:700;cursor:pointer;
      transition:all .18s cubic-bezier(.4,0,.2,1);
      font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
    .btn-primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-d));
      color:#fff;
      box-shadow:0 4px 20px rgba(124,109,240,.35);
    }
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,109,240,.45)}
    .btn-primary:active:not(:disabled){transform:translateY(1px)}
    .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
    .btn-ghost:hover:not(:disabled){background:var(--glass);border-color:rgba(255,255,255,.12)}

    /* ── 跳过按钮 ── */
    .btn-skip{background:rgba(156,163,175,.1);color:#9ca3af;border:1px dashed rgba(156,163,175,.3);font-size:.82rem;padding:7px 14px;margin-bottom:10px;width:100%;border-radius:var(--radius-sm);transition:all .18s;cursor:pointer}
    .btn-skip:hover{background:rgba(251,191,36,.1);color:#fbbf24;border-color:rgba(251,191,36,.4)}
    .skip-badge{display:inline-block;font-size:.7rem;background:rgba(156,163,175,.15);color:#9ca3af;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
    .btn-play{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
    .btn-play:hover:not(:disabled){background:rgba(251,191,36,.25)}
    .btn-rec{background:rgba(244,114,182,.15);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
    .btn-rec:hover:not(:disabled){background:rgba(244,114,182,.25)}
    .btn-rec.recording{
      background:rgba(244,114,182,.3);
      animation:pulse-rec 1.4s infinite;
    }
    @keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,.5)}60%{box-shadow:0 0 0 12px rgba(244,114,182,0)}}
    .btn-next{width:100%;margin-top:20px;padding:16px}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
    .btn-teal{background:rgba(34,211,197,.15);color:var(--accent);border:1px solid rgba(34,211,197,.3)}
    .btn-teal:hover:not(:disabled){background:rgba(34,211,197,.25)}

    /* ── Pronunciation score ── */
    .score-ring-wrap{display:flex;align-items:center;gap:20px;padding:18px;background:var(--surface2);border-radius:var(--radius-sm);margin:16px 0;border:1px solid var(--border)}
    .score-ring{position:relative;width:72px;height:72px;flex-shrink:0}
    .score-ring svg{transform:rotate(-90deg)}
    .score-ring circle{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
    .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;font-family:'Outfit',sans-serif}
    .score-info{flex:1}
    .score-label{font-size:.75rem;font-weight:700;color:var(--sub);letter-spacing:.05em;margin-bottom:4px}
    .score-feedback{font-size:.9rem;color:var(--sub);line-height:1.5}

    /* ── Image grid ── */
    .img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
    .img-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:transform .2s}
    .img-card:hover{transform:scale(1.02)}
    .img-card img{width:100%;height:160px;object-fit:cover;display:block}
    .img-card .img-cap{padding:10px 12px;font-size:.78rem;color:var(--sub);line-height:1.4}
    .img-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:.9rem;line-height:1.7;margin-top:8px}
    .img-desc-box strong{color:var(--accent);font-weight:700}

    /* ── Choice buttons ── */
    .opt-btn{
      display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);
      cursor:pointer;font-size:.95rem;font-weight:600;
      transition:all .18s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .opt-btn:hover:not(:disabled){border-color:var(--primary);background:rgba(124,109,240,.08)}
    .opt-btn.correct{background:rgba(74,222,128,.12)!important;border-color:var(--green)!important;color:var(--green)!important}
    .opt-btn.wrong{background:rgba(248,113,113,.12)!important;border-color:var(--red)!important;color:var(--red)!important}
    .opt-letter{
      display:inline-flex;align-items:center;justify-content:center;
      width:24px;height:24px;border-radius:6px;font-size:.75rem;font-weight:800;
      background:rgba(124,109,240,.2);color:#a78bfa;margin-right:10px;flex-shrink:0;
    }

    /* ── Feedback box ── */
    .fb-box{
      border-radius:var(--radius-sm);padding:12px 16px;margin-top:10px;
      font-size:.9rem;line-height:1.6;border:1px solid;
    }
    .fb-correct{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--green)}
    .fb-wrong{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}

    /* ── Meaning box ── */
    .meaning-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0;line-height:1.8}
    .meaning-box .row{display:flex;gap:8px;margin-bottom:4px;font-size:.93rem}
    .meaning-box .lbl{color:var(--sub);font-weight:700;flex-shrink:0;min-width:64px}
    .meaning-box .val{color:var(--text)}

    /* ── Example card ── */
    .ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
    .ex-num{font-size:.7rem;font-weight:800;color:var(--primary);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;opacity:.8}
    .ex-en{font-size:1rem;font-weight:700;color:var(--text);line-height:1.6;margin-bottom:10px}
    .ex-cn{font-size:.9rem;color:var(--sub);line-height:1.6;margin-top:6px;padding-top:8px;border-top:1px solid var(--border)}
    .ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reveal-btn{
      background:transparent;border:1px dashed var(--muted);color:var(--sub);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700;
      transition:all .2s;font-family:'Nunito','Noto Sans SC',sans-serif;
    }
    .reveal-btn:hover{border-color:var(--accent);color:var(--accent)}
    .rec-counter{font-size:.75rem;color:var(--sub);font-weight:700;padding:6px 12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)}

    /* ── 例句单词点击发音 ── */
    .word-click{cursor:pointer;padding:2px 2px 2px 0;border-radius:4px;display:inline;transition:all .18s}
    .word-click:hover{background:rgba(124,109,240,.25);color:var(--accent)}
    .word-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
    .word-modal.show{opacity:1;visibility:visible}
    .word-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.95);transition:transform .25s}
    .word-modal.show .word-modal-box{transform:scale(1)}
    .word-modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .word-modal-word{font-size:1.3rem;font-weight:800;color:var(--accent);flex:1}
    .word-modal-speak{background:rgba(251,191,36,.15);color:var(--amber);border:1px solid rgba(251,191,36,.3);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
    .word-modal-speak:hover{background:rgba(251,191,36,.25)}
    .word-modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.2rem;padding:6px;border-radius:6px}
    .word-modal-close:hover{background:var(--surface2);color:var(--text)}
    .word-modal-body{padding:18px 20px;font-size:.95rem;line-height:1.7}
    .word-modal-loading{color:var(--sub);display:flex;align-items:center;gap:10px}
    .word-modal-loading .spin{animation:spin .8s linear infinite}
    .word-modal-error{color:var(--red)}

    /* ── Fill blank ── */
    .fill-sent{
      background:var(--surface2);border:1.5px solid rgba(124,109,240,.3);
      border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;
      font-size:1.05rem;line-height:1.7;color:var(--text);
    }
    .fill-sent mark{background:rgba(124,109,240,.25);color:#c4b5fd;border-radius:4px;padding:1px 4px;font-style:normal}

    /* ── Dictation ── */
    .dict-input{
      width:100%;padding:14px 16px;margin:12px 0;
      background:var(--surface2);border:1.5px solid var(--border);
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem;
      font-family:'Nunito','Noto Sans SC',sans-serif;
      transition:border-color .2s;
    }
    .dict-input:focus{outline:none;border-color:var(--primary)}
    .dict-input::placeholder{color:var(--muted)}

    /* ── Dictation result ── */
    .dict-result{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin:12px 0}
    .dict-result .your{font-size:.85rem;color:var(--sub);margin-bottom:6px}
    .dict-match-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin:8px 0}
    .dict-match-fill{height:100%;border-radius:99px;transition:width .8s}

    /* ── Translation eval (DeepSeek) ── */
    .trans-sent-box{background:rgba(124,109,240,.08);border:1px solid rgba(124,109,240,.2);border-radius:var(--radius-sm);padding:14px 18px;margin:10px 0}
    .trans-en{font-weight:700;color:var(--text);font-size:.97rem;line-height:1.6;margin-bottom:6px}
    .trans-cn-ref{font-size:.88rem;color:var(--accent);line-height:1.5}
    .eval-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin:12px 0}
    .eval-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
    .eval-score-circle{
      width:54px;height:54px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;font-weight:900;font-family:'Outfit',sans-serif;
      border:3px solid;
    }
    .eval-score-hi{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
    .eval-score-mid{border-color:var(--amber);color:var(--amber);background:rgba(251,191,36,.1)}
    .eval-score-lo{border-color:var(--red);color:var(--red);background:rgba(248,113,113,.1)}
    .eval-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;line-height:1.55}
    .eval-lbl{font-weight:800;color:var(--sub);flex-shrink:0;min-width:52px;padding-top:1px}
    .eval-val{color:var(--text)}
    .eval-tip{font-size:.85rem;color:var(--accent);background:rgba(34,211,197,.08);border:1px solid rgba(34,211,197,.2);border-radius:8px;padding:10px 14px;margin-top:8px}
    .eval-loading{text-align:center;color:var(--sub);font-size:.9rem;padding:20px}
    .eval-loading .spin{display:inline-block;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Unit select ── */
    .home-hero{text-align:center;padding:36px 0 28px}
    .home-icon{font-size:3rem;margin-bottom:12px}
    .home-title{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .home-sub{font-size:.9rem;color:var(--sub);margin-bottom:28px}
    .unit-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .unit-card{
      background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;
      padding:14px 22px;font-size:.95rem;font-weight:800;cursor:pointer;
      transition:all .2s;color:var(--text);font-family:'Outfit',sans-serif;
    }
    .unit-card:hover{border-color:var(--primary);background:rgba(124,109,240,.12);color:#c4b5fd;transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,109,240,.2)}

    /* ── Review header ── */
    .review-word-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(124,109,240,.15);border:1px solid rgba(124,109,240,.3);
      border-radius:99px;padding:4px 14px 4px 10px;
      font-size:.8rem;font-weight:800;color:#a78bfa;margin-bottom:14px;
    }
    .review-word-chip .word{font-size:.95rem;color:#c4b5fd}

    /* scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:99px}
  </style>
</head>

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      unit: currentUnit,
      wordIndex,
      page: currentPage,
      reviewStep: currentPage==="review"? reviewStep : undefined,
      reviewIdx: currentPage==="review"? reviewIdx : undefined
    }));
  } catch(e){}
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    if (!p.unit) return null;
    currentUnit = p.unit;
    wordIndex = p.wordIndex||0;
    currentPage = p.page||"unit-select";
    reviewStep = p.reviewStep||1;
    reviewIdx = p.reviewIdx||0;
    return p;
  } catch(e){}
  return null;
}
function updateProgress() {
  const t = allWords.length, d = wordIndex;
  const skipped = allWords.slice(0, d).filter(w => skippedWords.has(w.word)).length;
  const skipTip = skipped > 0 ? ` <span class="skip-badge">跳过 ${skipped}</span>` : '';
  document.getElementById("progress-text").innerHTML = `${d} / ${t}${skipTip}`;
  document.getElementById("progress-fill").style.width = t ? (d/t*100)+"%" : "0%";
}

/* ═══════════════════════════════════════════════
   Unit 加载
═══════════════════════════════════════════════ */
async function selectUnit(n) {
  currentUnit = n; wordIndex = 0;
  sessionStartTime = sessionStartTime || new Date();
  await loadUnitData(n); startWord();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
}
async function resumeUnit() {
  sessionStartTime = sessionStartTime || new Date();
  const btn = document.getElementById("send-report-btn");
  if (btn) btn.style.display = "inline-flex";
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) wordIndex = 0;
  if (currentPage && currentPage !== "unit-select" && currentPage !== "p1") {
    resumeToSavedState(currentPage, reviewStep, reviewIdx);
    return;
  }
  startWord();
}
async function resumeToSavedState(page, revStep, revIdx) {
  await loadUnitData(currentUnit);
  if (wordIndex >= allWords.length) { wordIndex = 0; startWord(); return; }
  if (page === "p1") { showCurrentWord(); return; }
  if (page === "p2") { showCurrentWord(); goP2(); return; }
  if (page === "p3") { showCurrentWord(); goP2(); goP3(); return; }
  if (page === "p4") { showCurrentWord(); goP2(); goP3(); goP4(); return; }
  if (page === "review") {
    const start = Math.max(0, wordIndex - PER_REVIEW);
    reviewBatch = allWords.slice(start, wordIndex);
    if (reviewBatch.length === 0) reviewBatch = allWords.slice(0, Math.min(PER_REVIEW, allWords.length));
    reviewIdx = Math.min(revIdx, reviewBatch.length - 1);
    reviewStep = revStep;
    reviewOrders = _makeReviewOrders(reviewBatch.length);
    ["review-step1","review-step2","review-step4"].forEach(id=>{
      document.getElementById(id).style.display="none";
    });
    showPage("p-review");
    setReviewDots(revStep);
    if (revStep === 1) {
      document.getElementById("review-step1").style.display="block";
      showSocraticQuestion();
    } else if (revStep === 2) {
      document.getElementById("review-step2").style.display="block";
      reviewStep2();
    } else {
      document.getElementById("review-step4").style.display="block";
      goToTranslationStep();
    }
  }
}
async function loadUnitData(n) {
  unitData = VOCAB_DATA ? (VOCAB_DATA.units||[]).find(u=>(u.unit||u)===n) : null;
  if (!unitData?.words?.length) { alert("该单元无单词数据"); throw new Error("no data"); }
  allWords = unitData.words.filter(w=>w.word&&!w.error);
  saveProgress();
}

/* ═══════════════════════════════════════════════
   学习流程：startWord / showCurrentWord
═══════════════════════════════════════════════ */
function startWord() {
  if (wordIndex >= allWords.length) { alert("🎉 本单元已全部完成！"); showPage("unit-select"); return; }
  const w = allWords[wordIndex];
  if (!w?.word) { wordIndex++; startWord(); return; }
  if (wordIndex > 0 && wordIndex % PER_REVIEW === 0) {
    reviewBatch = allWords.slice(wordIndex - PER_REVIEW, wordIndex).filter(w => !skippedWords.has(w.word));
    if (reviewBatch.length === 0) { showCurrentWord(); return; }
    reviewIdx = 0;
    startReview();
    return;
  }
  showCurrentWord();
}
function showCurrentWord() {
  updateProgress();
  wordStartTime = Date.now();
  const w = allWords[wordIndex];
  document.getElementById("p1-word").textContent = w.word;
  document.getElementById("p1-ipa").textContent  = w.ipa || "";
  document.getElementById("p1-score").style.display = "none";
  document.getElementById("p1-next").disabled = true;
  const prevBtn = document.getElementById("p1-prev");
  if (prevBtn) prevBtn.disabled = wordIndex <= 0;
  showPage("p1-pronounce");
  saveProgress();
}

/* ═══════════════════════════════════════════════
   P1 发音
═══════════════════════════════════════════════ */
function playWord() {
  const w = allWords[wordIndex];
  if (!w) return;
  if (w.audio) { new Audio(mediaUrl(w.audio)).play().catch(()=>{}); return; }
  synthesizer?.speakTextAsync(w.word, ()=>{}, e=>console.error(e));
}
function toggleRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("p1-record");
  if (isRecording) {
    try {
      recogStream?.stopContinuousRecognitionAsync(()=>{
        isRecording = false;
        btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
        const res = window._p1LastResult;
        window._p1LastResult = null;
        let score = 0, fb = "";
        if (res) {
          fb = res.text||"";
          try {
            const j = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = j.NBest?.[0];
            if (n?.PronunciationAssessment) { score = n.PronunciationAssessment.AccuracyScore??0; fb = n.Lexical||fb; }
          } catch(e){}
        } else { fb = "未检测到发音"; }
        setScoreRing(score);
        document.getElementById("p1-feedback").textContent = fb;
        document.getElementById("p1-score").style.display = "block";
        document.getElementById("p1-next").disabled = score < MIN_SCORE;
      }, e=>{ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; });
    } catch(e){ isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分'; }
    return;
  }
  isRecording = true;
  window._p1LastResult = null;
  btn.classList.add("recording"); btn.innerHTML='<i class="fas fa-stop"></i> 点击结束录音';
  const refText = allWords[wordIndex].word;
  const rec = new SpeechSDK.SpeechRecognizer(speechConfig, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  try {
    const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
      SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1,
      SpeechSDK.PronunciationAssessmentGranularity?.Word??1, false);
    pa?.applyTo?.(rec);
  } catch(e){}
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._p1LastResult = e.result;
    }
  };
  rec.startContinuousRecognitionAsync(()=>{}, err=>{
    isRecording=false; btn.classList.remove("recording"); btn.innerHTML='<i class="fas fa-microphone"></i> 朗读评分';
    console.error(err);
  });
  recogStream = rec;
}
function setScoreRing(score) {
  const s = Math.round(score);
  const arc = document.getElementById("p1-ring-arc");
  const num = document.getElementById("p1-score-num");
  const circ = 2*Math.PI*30;
  arc.setAttribute("stroke-dashoffset", circ - (score/100)*circ);
  const color = score>=MIN_SCORE?"#4ade80":score>=60?"#fbbf24":"#f87171";
  arc.setAttribute("stroke", color);
  num.textContent = s; num.style.color = color;
}

/* ═══════════════════════════════════════════════

function goP2() {
  const w = allWords[wordIndex];
  document.getElementById("p2-word").textContent = w.word;
  const grid = document.getElementById("p2-imgs");
  grid.innerHTML = "";
  [w.img1, w.img2].forEach((src, i)=>{
    const card = document.createElement("div"); card.className="img-card";
    const img  = document.createElement("img"); img.alt=""; img.src = mediaUrl(src)||"";
    const cap  = document.createElement("div"); cap.className="img-cap";
    cap.textContent = w.image_prompts?.[i] || "";

/* ═══════════════════════════════════════════════
   P3 选义
═══════════════════════════════════════════════ */
function goP3() {
  const w = allWords[wordIndex];
  document.getElementById("p3-word").textContent = w.word;
  const opts = [w.meaning_cn];
  const pool  = (unitData.words||[]).filter(x=>x.meaning_cn&&x.meaning_cn!==w.meaning_cn).map(x=>x.meaning_cn);
  while (opts.length<4&&pool.length) opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  while (opts.length<4) opts.push("—");
  opts.sort(()=>Math.random()-.5);
  const ci = opts.indexOf(w.meaning_cn);
  const div = document.getElementById("p3-opts"); div.innerHTML="";
  opts.forEach((t,i)=>{
    const b = document.createElement("button"); b.className="opt-btn";
    b.innerHTML=`<span class="opt-letter">${String.fromCharCode(65+i)}</span>${t}`;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      b.classList.add(i===ci?"correct":"wrong");
      const fb = document.getElementById("p3-feedback");
      fb.style.display="block";
      fb.className = i===ci ? "fb-box fb-correct" : "fb-box fb-wrong";
      fb.textContent = i===ci ? `✓ 正确！${w.usage?"  "+w.usage:""}` : `✗ 正确答案：${w.meaning_cn}`;
      document.getElementById("p3-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("p3-feedback").style.display="none";
  document.getElementById("p3-next").disabled=true;
  showPage("p3-choice");
  saveProgress();
}

function makeClickableExampleHtml(sentence) {
  if (!sentence) return "";
  const esc = (s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  return sentence.replace(/\b([\w']+)\b/g, (m)=>{
    if (!/[a-zA-Z]/.test(m)) return m;
    const s = esc(sentence), w = esc(m), wJs = m.replace(/'/g,"\\'").replace(/\\/g,"\\\\");
    return `<span class="word-click" data-s="${s}" data-w="${w}" onclick="onWordClick(this,'${wJs}')" title="点击发音并查词">${esc(m)}</span>`;
  });
}
function onWordClick(el, wordJs) {
  speakWord(wordJs);
  lookupWordInContext(el);
}
function lookupWordInContext(el) {
  const sentence = el.getAttribute("data-s")||"";
  const word = el.getAttribute("data-w")||"";
  if (!word) return;
  const modal = document.getElementById("word-modal");
  const bodyEl = document.getElementById("word-modal-body");
  document.getElementById("word-modal-word").textContent = word;
  modal.classList.add("show");
  bodyEl.innerHTML = '<div class="word-modal-loading"><span class="spin">⟳</span> 正在查询（基于句子语境）…</div>';
  (async function(){
    try {
      const prompt = `你是初中英语教师。请根据下面这句话的语境，解释句中划线单词的含义。
【整句】${sentence}
【待解释的词】"${word}"

要求（必须做到）：
1. 词义必须基于该词在此句中的具体用法，给出语境下的释义，而非泛泛的词典释义
2. 1-2句简洁中文解释
3. 可简要说明该词在本句中的词性、搭配或用法
4. 面向八年级学生，控制在100字内`;
      const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DEEPSEEK_KEY },
        body: JSON.stringify({
          model: "deepseek-v4-flash",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2,
          max_tokens: 350
        })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      const content = (data.choices?.[0]?.message?.content || "未获取到释义").replace(/\n/g, "<br>");
      bodyEl.innerHTML = content;
    } catch (e) {
      bodyEl.innerHTML = '<div class="word-modal-error">查词失败：' + (e.message || "网络错误") + '</div>';
    }
  })();
}
function speakWord(word) {
  if (!synthesizer) { alert("语音服务未初始化"); return; }
  const w = String(word || "").trim();
  if (!w) return;
  synthesizer.speakTextAsync(w, ()=>{}, e=>console.error("TTS:", e));
}
function closeWordModal() {
  document.getElementById("word-modal").classList.remove("show");
}

/* ═══════════════════════════════════════════════
   P4 例句

function goP4() {
  const w = allWords[wordIndex];
  document.getElementById("p4-word").textContent = w.word;
  document.getElementById("p4-meaning").textContent = w.meaning_cn||"";
  document.getElementById("p4-usage").textContent   = (w.usage||"")+(w.collocations?" | "+w.collocations:"");
  const list = document.getElementById("p4-examples-list"); list.innerHTML="";
  const exs = w.examples||[];
  const need=2, rc={};
  exs.forEach((_,i)=>rc[i]=0);
  window._p4rc=rc; window._p4need=need;
  window._p4refSentences = exs.map(ex=>ex.en||"");
  window._p4exLastResult = {};
  exs.forEach((ex,i)=>{
    const box = document.createElement("div"); box.className="ex-card";
    const enRaw = ex.en||"";
    const enHtml = makeClickableExampleHtml(enRaw);
    box.innerHTML=`
      <div class="ex-num">例句 ${i+1}</div>
      <div class="ex-en">${enHtml}</div>
      <div class="ex-actions">
        <button class="btn btn-play" style="padding:7px 14px;font-size:.82rem" onclick="playExample(${i})"><i class="fas fa-play"></i> 播放</button>
        <button class="reveal-btn" onclick="toggleCn(this)">显示中文</button>
        <span class="rec-counter" id="ex-cnt-${i}">朗读 0/${need}（需≥75分）</span>
        <button class="btn btn-rec" style="padding:7px 14px;font-size:.82rem" id="ex-rec-${i}" onclick="toggleExRecord(${i})"><i class="fas fa-microphone"></i></button>
      </div>
      <div class="ex-fb" id="ex-fb-${i}" style="display:none;margin-top:8px;font-size:.85rem"></div>
      <div class="ex-cn" id="ex-cn-${i}" style="display:none">${(ex.cn||"").replace(/</g,"&lt;")}</div>
    `;
    list.appendChild(box);
  });
  window.playExample=(i)=>{
    const ww=allWords[wordIndex];
    const aud=i===0?ww.audio_ex0:ww.audio_ex1;
    if(aud){new Audio(mediaUrl(aud)).play().catch(()=>{}); return;}
    const en=(ww.examples||[])[i]?.en||"";
    if(en&&synthesizer) synthesizer.speakTextAsync(en,()=>{},e=>console.error(e));
  };
  window.toggleCn=(btn)=>{
    const cn=btn.closest(".ex-card").querySelector(".ex-cn");
    if(!cn)return;
    const show=cn.style.display==="none";
    cn.style.display=show?"block":"none"; btn.textContent=show?"隐藏中文":"显示中文";
  };
  const EX_MIN_SCORE = 75;
  window.toggleExRecord=(j)=>{
    const rc=window._p4rc, need=window._p4need, refSentences=window._p4refSentences||[];
    if(rc[j]>=need)return;
    const btn=document.getElementById("ex-rec-"+j);
    const cntEl=document.getElementById("ex-cnt-"+j);
    const fbEl=document.getElementById("ex-fb-"+j);
    if(btn.dataset.rec==="1"){
      const rec=window._exRec&&window._exRec[j];
      if(rec){ rec.stopContinuousRecognitionAsync(()=>{
        btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
        const res = window._p4exLastResult[j];
        window._p4exLastResult[j]=null;
        let score = 0;
        if (res) {
          try {
            const json = JSON.parse(res.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult,"{}"));
            const n = json.NBest?.[0];
            if (n?.PronunciationAssessment) score = n.PronunciationAssessment.AccuracyScore??0;
          } catch(e){}
        }
        if (score >= EX_MIN_SCORE) {
          rc[j]++;
          fbEl.style.display="block";
          fbEl.style.color="var(--green)";
          fbEl.innerHTML=`✓ ${Math.round(score)}分 通过`;
          cntEl.textContent=`朗读 ${rc[j]}/${need}（需≥75分）`;
        } else {
          fbEl.style.display="block";
          fbEl.style.color=score>0?"#fbbf24":"var(--red)";
          fbEl.innerHTML=score>0 ? `✗ ${Math.round(score)}分，需达到75分，请重试` : "✗ 未检测到发音，请重试";
        }
        const done=Object.keys(rc).every(k=>rc[k]>=need);
        document.getElementById("p4-next").disabled=!done;
        if(window._exRec) delete window._exRec[j];
      },()=>{btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';}); }
      return;
    }
    btn.dataset.rec="1"; btn.innerHTML='<i class="fas fa-stop"></i> 点击结束';
    fbEl.style.display="none";
    const refText = refSentences[j]||"";
    const rec=new SpeechSDK.SpeechRecognizer(speechConfig,SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
    try {
      const gran = SpeechSDK.PronunciationAssessmentGranularity?.FullSentence ?? 2;
      const pa = new SpeechSDK.PronunciationAssessmentConfig(refText,
        SpeechSDK.PronunciationAssessmentGradingSystem?.HundredMark??1, gran, false);
      pa?.applyTo?.(rec);
    } catch(e){}
    rec.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
        window._p4exLastResult[j] = e.result;
      }
    };
    if(!window._exRec) window._exRec={};
    window._exRec[j]=rec;
    rec.startContinuousRecognitionAsync(()=>{}, (err)=>{
      btn.dataset.rec="0"; btn.innerHTML='<i class="fas fa-microphone"></i>';
      if(window._exRec) delete window._exRec[j];
      console.error(err);
    });
  };
  document.getElementById("p4-next").disabled = exs.length>0;
  showPage("p4-examples");
  saveProgress();
}

function prevWord() {
  if (wordIndex <= 0) return;
  wordIndex--;
  saveProgress();
  startWord();
}

function nextWord() {
  const w = allWords[wordIndex];
  if (w?.word) {
    const dur = Date.now() - wordStartTime;
    wordTimings[w.word] = (wordTimings[w.word] || 0) + dur;
  }
  wordIndex++; saveProgress(); startWord();
}


/* ── 跳过功能（学生自主跳过已认识的单词） ── */
let skippedWords = new Set(JSON.parse(localStorage.getItem('pep_vocab_skipped_'+STORAGE_KEY)||'[]'));
function skipWord() {
  const w = allWords[wordIndex];
  if (!w?.word) { nextWord(); return; }
  skippedWords.add(w.word);
  try { localStorage.setItem('pep_vocab_skipped_'+STORAGE_KEY, JSON.stringify([...skippedWords])); } catch(e) {}
  wordStartTime = Date.now();
  const btn = document.getElementById('p1-skip');
  if (btn) {
    btn.innerHTML = '✓ 已跳过'; btn.disabled = true;
    setTimeout(() => { btn.innerHTML = '<i class="fas fa-forward-step"></i> 跳过（已认识）'; btn.disabled = false; }, 500);
  }
  nextWord();
}

function setReviewDots(active) {
  ["rd1","rd2","rd3"].forEach((id,i)=>{
    const el=document.getElementById(id);
    if(el){ if(i<active-1) el.className="step-dot done"; else if(i===active-1) el.className="step-dot active"; else el.className="step-dot"; }
  });
}
function setReviewChip(word) {
  document.getElementById("review-chip-word").textContent = word||"";
}

// 为每步复习生成独立的随机排列，使各步测试不同单词
function _shuffleIdx(n) {
  const a = Array.from({length:n},(_,i)=>i);
  for (let i=n-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function _makeReviewOrders(n) {
  return { socratic:_shuffleIdx(n), fill:_shuffleIdx(n), dictation:_shuffleIdx(n), translation:_shuffleIdx(n) };
}

function startReview() {
  reviewOrders = _makeReviewOrders(reviewBatch.length);
  reviewStep = 1;
  ["review-step1","review-step2","review-step4"].forEach(id=>{
    document.getElementById(id).style.display=id==="review-step1"?"block":"none";
  });
  setReviewDots(1);
  showPage("p-review");
  showSocraticQuestion();
  saveProgress();
}

function showSocraticQuestion() {
  const w = reviewOrders ? reviewBatch[reviewOrders.socratic[reviewIdx]] : reviewBatch[reviewIdx];
  const q = (w.socratic_questions||[])[0];
  if (!q) { reviewStep2(); return; }
  document.getElementById("review-socratic-q").textContent = q.question||"";
  const opts = document.getElementById("review-socratic-opts"); opts.innerHTML="";
  [...reviewBatch].sort(()=>Math.random()-.5).map(x=>x.word).forEach(wo=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=wo;
    b.onclick=()=>{
      opts.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=wo.toLowerCase()===w.word.toLowerCase();
      reviewLogs.push({ type:"socratic", word:w.word, question:q.question||"", userAnswer:wo, correct:w.word, ok });
      b.classList.add(ok?"correct":"wrong");
      if(!ok) opts.querySelectorAll(".opt-btn").forEach(x=>{ if(x.textContent.toLowerCase()===w.word.toLowerCase()) x.classList.add("correct"); });
      const fb=document.getElementById("review-socratic-fb");
      fb.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb.style.display="block";
      fb.textContent=ok?"✓ 正确！"+(q.answer_hint?"  "+q.answer_hint:""):"✗ 答案是「"+w.word+"」"+(q.answer_hint?"  "+q.answer_hint:"");
      document.getElementById("review-socratic-next").disabled=false;
    };
    opts.appendChild(b);
  });
  document.getElementById("review-socratic-fb").style.display="none";
  document.getElementById("review-socratic-next").disabled=true;
}

function reviewStep2() {
  reviewStep = 2;
  document.getElementById("review-step1").style.display="none";
  document.getElementById("review-step2").style.display="block";
  setReviewDots(2);
  showPage("p-review");
  saveProgress();
  const w = reviewOrders ? reviewBatch[reviewOrders.fill[reviewIdx]] : reviewBatch[reviewIdx];
  const fb=w.fill_blank||{};
  const sents=fb.sentences||[], opts=fb.options||[], ci=fb.correct_index??0;
  const sent=(sents[0]||"").trim();
  const qDiv=document.getElementById("review-fill-q"); qDiv.innerHTML="";
  if(sent){
    const d=document.createElement("div"); d.className="fill-sent";
    d.innerHTML=sent.replace(/___/g,"<mark>___</mark>");
    qDiv.appendChild(d);
  }
  qDiv.innerHTML+='<p style="font-size:.85rem;color:var(--sub);margin-bottom:10px">'+(sent?"选出正确的词填入空白：":"选出最符合词义的选项：")+"</p>";
  const div=document.getElementById("review-fill-opts"); div.innerHTML="";
  const choices=opts.length?opts:sents;
  choices.forEach((t,i)=>{
    const b=document.createElement("button"); b.className="opt-btn"; b.textContent=t;
    b.onclick=()=>{
      div.querySelectorAll(".opt-btn").forEach(x=>x.disabled=true);
      const ok=i===ci;
      reviewLogs.push({ type:"fill", word:w.word, sentence:sent, userChoice:t, correctChoice:choices[ci]||"", ok });
      b.classList.add(ok?"correct":"wrong");
      const fb2=document.getElementById("review-fill-fb");
      fb2.className="fb-box "+(ok?"fb-correct":"fb-wrong");
      fb2.style.display="block";
      fb2.textContent=ok?"✓ 正确！":"✗ 正确答案："+(choices[ci]||"");
      document.getElementById("review-fill-next").disabled=false;
    };
    div.appendChild(b);
  });
  document.getElementById("review-fill-fb").style.display="none";
  document.getElementById("review-fill-next").disabled=true;
}

function goToTranslationStep() {
  reviewStep = 3;
  document.getElementById("review-step2").style.display="none";
  document.getElementById("review-step4").style.display="block";

/* ═══════════════════════════════════════════════
   翻译朗读 + DeepSeek 评价（持续识别，手动开始/停止）
═══════════════════════════════════════════════ */
function toggleTransRecord() {
  if (!speechConfig) { alert("语音服务未初始化"); return; }
  const btn = document.getElementById("review-trans-record");

  if (transRecording) {
    // ── 停止录音 ──
    transRecording = false;
    btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
    btn.classList.remove("recording");
    if (window._transRec) {
      window._transRec.stopContinuousRecognitionAsync(
        async () => {
          const text = (window._transFullText||"").trim();
          const resultDiv = document.getElementById("review-trans-result");
          if (!text) {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--sub)">未识别到语音，请重试</div>`;
    return;
  }
          await evaluateTranslation(window._transSentence||"", text, window._transRefCn||"");
        },
        e => console.error("stop err:", e)
      );
    }
    return;
  }

  // ── 开始录音 ──
  transRecording = true;
  window._transFullText = "";
  btn.innerHTML = '<i class="fas fa-stop"></i> 点击停止录音';
  btn.classList.add("recording");
  document.getElementById("review-trans-result").style.display = "none";

  const zhCfg = SpeechSDK.SpeechConfig.fromSubscription(AZURE_KEY, AZURE_REGION);
  zhCfg.speechRecognitionLanguage = "zh-CN";
  const rec = new SpeechSDK.SpeechRecognizer(zhCfg, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());
  window._transRec = rec;

  // 实时显示识别到的片段
  rec.recognized = (s, e) => {
    if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech && e.result.text) {
      window._transFullText += e.result.text;
      const resultDiv = document.getElementById("review-trans-result");
      resultDiv.style.display = "block";
      resultDiv.innerHTML = `<div class="fb-box" style="background:rgba(148,163,184,.07);border-color:var(--border);color:var(--text2)">
        识别中：<span style="color:var(--text)">${window._transFullText}</span>
      </div>`;
    }
  };

  rec.startContinuousRecognitionAsync(
    () => {},
    e => {
      transRecording = false;
      btn.innerHTML = '<i class="fas fa-microphone"></i> 朗读中文翻译';
      btn.classList.remove("recording");
      console.error("start err:", e);
    }
  );
}

async function evaluateTranslation(enText, studentCn, refCn) {
  const resultDiv=document.getElementById("review-trans-result");
  resultDiv.style.display="block";
  resultDiv.innerHTML=`<div class="eval-loading"><span class="spin">⟳</span> DeepSeek 正在评价…</div>`;
  document.getElementById("review-trans-next").disabled=false;
  try {
    const prompt=`你是初中英语翻译评价专家，帮助八年级学生提升英译中能力。
英文原句：${enText}
参考中文：${refCn||"（无）"}
学生朗读的中文翻译：${studentCn}

请用JSON格式返回评价，包含这些字段：
- score: 整数0-100（语义准确度）
- correct: 翻译正确/较好的部分（简洁，1句）
- issues: 主要问题或遗漏（1-2句，没有则写"无明显问题"）
- standard: 最佳参考翻译（1句）
- tip: 针对性的学习建议（1句，结合初中生水平）`;

    const resp=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-v4-flash",
        messages:[{role:"user",content:prompt}],
        response_format:{type:"json_object"},
        temperature:0.3,max_tokens:400
      })
    });
    if(!resp.ok) throw new Error("API "+resp.status);
    const data=await resp.json();
    const ev=JSON.parse(data.choices[0].message.content);
    const s=ev.score??0;
    reviewLogs.push({ type:"translation", word:window._dictWord?.word||"", en:enText, studentCn, score:s, correct:ev.correct||"", issues:ev.issues||"", standard:ev.standard||"" });
    const cls=s>=80?"eval-score-hi":s>=55?"eval-score-mid":"eval-score-lo";
    resultDiv.innerHTML=`
      <div class="eval-card">
        <div class="eval-score-row">
          <div class="eval-score-circle ${cls}">${s}</div>
          <div>
            <div style="font-size:.75rem;font-weight:800;color:var(--sub);letter-spacing:.05em;margin-bottom:4px">DEEPSEEK 评分</div>
            <div style="font-size:.85rem;color:var(--sub)">你说的：<span style="color:var(--text)">${studentCn}</span></div>
          </div>
        </div>
        ${ev.correct?`<div class="eval-row"><span class="eval-lbl">✓ 正确</span><span class="eval-val" style="color:var(--green)">${ev.correct}</span></div>`:""}
        ${ev.issues?`<div class="eval-row"><span class="eval-lbl">⚠ 问题</span><span class="eval-val" style="color:#fca5a5">${ev.issues}</span></div>`:""}
        <div class="eval-row"><span class="eval-lbl">📝 标准</span><span class="eval-val">${ev.standard||refCn||"—"}</span></div>
        ${ev.tip?`<div class="eval-tip">💡 ${ev.tip}</div>`:""}
      </div>`;
  } catch(e) {
    resultDiv.innerHTML=`<div class="eval-card"><p style="color:var(--sub);font-size:.88rem">评价暂不可用：${e.message}</p></div>`;
    console.error("DeepSeek eval:", e);
  }
}

function escapeHtml(s) { if (!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function formatDateTime(d) {
  if (!d) return "-";
  const x = d instanceof Date ? d : new Date(d);
  return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)+" "+
    ("0"+x.getHours()).slice(-2)+":"+("0"+x.getMinutes()).slice(-2)+":"+("0"+x.getSeconds()).slice(-2);
}
function formatDuration(ms) {
  if (!ms||ms<0) return "0s";
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60);
  if (h>0) return h+"h "+m%60+"min "+s%60+"s";
  if (m>0) return m+"min "+s%60+"s";
  return s+"s";
}
function buildReportDetailsHtml() {
  let html = "";
  if (Object.keys(wordTimings).length > 0) {
    html += "<h3 style=\"font-size:14px;margin:12px 0 8px;color:#333;\">⏱️ 每个单词学习时间</h3>";
    html += "<table style=\"border-collapse:collapse;width:100%;font-size:13px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:6px;text-align:left;\">单词</th><th style=\"border:1px solid #ddd;padding:6px;text-align:left;\">学习时长</th></tr>";
    Object.entries(wordTimings).forEach(([w,t])=>{
      html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(w)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(t/1000).toFixed(1)+" 秒</td></tr>";
    });
    html += "</table>";
  }
  if (reviewLogs.length > 0) {
    html += "<h3 style=\"font-size:14px;margin:16px 0 8px;color:#333;\">📋 复习阶段做题过程与结果</h3>";
    const socraticLogs = reviewLogs.filter(r=>r.type==="socratic");
    const fillLogs = reviewLogs.filter(r=>r.type==="fill");
    const transLogs = reviewLogs.filter(r=>r.type==="translation");
    if (socraticLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🧠 情景联想</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">题目</th><th style=\"border:1px solid #ddd;padding:5px;\">学生答案</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      socraticLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.question.substring(0,50)+(r.question.length>50?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userAnswer)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correct)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (fillLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">✏️ 句子填空</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">句子</th><th style=\"border:1px solid #ddd;padding:5px;\">学生选择</th><th style=\"border:1px solid #ddd;padding:5px;\">正确答案</th><th style=\"border:1px solid #ddd;padding:5px;\">对错</th></tr>";
      fillLogs.forEach(r=>{ html += "<tr style=\"background:"+(r.ok?"#f0fff0":"#fff0f0")+";\"><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.sentence.substring(0,40)+(r.sentence.length>40?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.userChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.correctChoice)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+(r.ok?"✓":"✗")+"</td></tr>"; });
      html += "</table>";
    }
    if (transLogs.length) {
      html += "<p style=\"font-weight:700;margin:8px 0 4px;\">🌏 翻译朗读 · AI评价</p><table style=\"border-collapse:collapse;width:100%;font-size:12px;\"><tr style=\"background:#f0f0f0;\"><th style=\"border:1px solid #ddd;padding:5px;\">单词</th><th style=\"border:1px solid #ddd;padding:5px;\">英文</th><th style=\"border:1px solid #ddd;padding:5px;\">学生翻译</th><th style=\"border:1px solid #ddd;padding:5px;\">得分</th><th style=\"border:1px solid #ddd;padding:5px;\">标准参考</th></tr>";
      transLogs.forEach(r=>{ html += "<tr><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.word)+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.en.substring(0,35)+(r.en.length>35?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml(r.studentCn.substring(0,25)+(r.studentCn.length>25?"…":""))+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+r.score+"</td><td style=\"border:1px solid #ddd;padding:5px;\">"+escapeHtml((r.standard||"").substring(0,30))+"</td></tr>"; });
      html += "</table>";
    }
  }
  if (!html) html = "<p style=\"color:#999;\">暂无学习数据（需完成部分单词学习或复习后发送）</p>";
  return html;
}
function sendLearningReport() {
  if (reportSent) { alert("报告已发送过"); return; }
  const hasData = Object.keys(wordTimings).length > 0 || reviewLogs.length > 0;
  if (!hasData) { alert("暂无学习数据，请先完成部分单词学习或复习后再发送报告"); return; }
  if (typeof emailjs === "undefined") { alert("邮件服务未加载，请刷新页面后重试"); return; }
  const endTime = new Date();
  const startT = sessionStartTime || endTime;
  const durationMs = endTime - startT;
  const studentName = localStorage.getItem("authing-user") || localStorage.getItem("current-user") || "未登录";
  const contentName = "人教版词汇 Unit" + currentUnit + " - " + (document.title || "词汇学习");
  const choiceLogs = reviewLogs.filter(r=>r.type==="socratic"||r.type==="fill");
  const transLogs = reviewLogs.filter(r=>r.type==="translation");
  const reviewCorrect = choiceLogs.filter(r=>r.ok).length;
  const reviewTotal = choiceLogs.length;
  const avgTransScore = transLogs.length ? Math.round(transLogs.reduce((a,x)=>a+x.score,0)/transLogs.length) : null;
  const score = reviewTotal ? reviewCorrect : (avgTransScore!==null ? avgTransScore : 0);
  const total = reviewTotal || (avgTransScore!==null ? 100 : 0);
  const accuracy = total > 0 ? Math.round((reviewTotal ? reviewCorrect/reviewTotal : avgTransScore/100) * 100) + "%" : "-";
  const templateParams = {
    student_name: studentName,
    content_name: contentName,
    page_url: location.href,
    page_url_display: contentName,
    start_time: formatDateTime(startT),
    end_time: formatDateTime(endTime),
    duration: formatDuration(durationMs),
    score: score,
    total: total,
    accuracy: accuracy,
    details_html: buildReportDetailsHtml()
  };
  try {
    emailjs.init(EMAILJS_PUBLIC_KEY);
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
      .then(() => { reportSent = true; alert("✅ 学习报告已发送给老师"); })
      .catch(() => { alert("❌ 报告发送失败，请检查网络后重试"); });
  } catch (e) { alert("发送失败：" + (e.message || "未知错误")); }
}
