<!DOCTYPE html><meta charset="utf-8"><title>TTS probe</title>
<button id="b">Play Baidu</button>
<pre id="o"></pre>
<script>
document.getElementById('b').onclick = async () => {
  const o = document.getElementById('o');
  const url = 'https://fanyi.baidu.com/gettts?lan=en&spd=4&source=web&text=' + encodeURIComponent('There are many new fruit varieties');
  const a = new Audio();
  try { a.referrerPolicy = 'no-referrer'; } catch(e) {}
  a.src = url;
  a.onended = () => { o.textContent += 'ENDED\\n'; };
  a.onerror = (e) => { o.textContent += 'ERROR\\n'; };
  try {
    await a.play();
    o.textContent += 'PLAY_OK ' + url + '\\n';
  } catch (e) {
    o.textContent += 'PLAY_ERR ' + e + '\\n';
  }
};
</script>
