<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 2 · 分段阅读 | Fruit Varieties</title>
  <link rel="stylesheet" href="assets/css/shared.css?v=20260713">
  <style>
    .page { max-width: 900px; margin: 0 auto; padding: 24px 20px 100px; }
    .article-masthead {
      background: linear-gradient(135deg, #1a6b4a 0%, #0d4a32 100%);
      color: #fff; border-radius: 20px; padding: 32px 28px; margin-bottom: 28px;
      box-shadow: var(--shadow);
    }
    .article-masthead h1 {
      font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.2rem);
      line-height: 1.25; margin-bottom: 16px;
    }
    .article-lead { font-size: 1.08rem; line-height: 1.75; opacity: 0.95; margin-bottom: 16px; }
    .article-byline { font-size: 0.82rem; opacity: 0.75; }
    .toolbar {
      position: sticky; top: 56px; z-index: 50;
      background: rgba(247,250,248,0.97); backdrop-filter: blur(10px);
      padding: 12px 14px; margin-bottom: 16px;
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 4px 20px rgba(26,107,74,0.06);
      display: flex; flex-direction: column; gap: 10px;
    }
    .toolbar-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .toolbar-row.main-actions { justify-content: flex-start; flex-wrap: wrap; }
    .read-full-btn.speaking { background: var(--accent2); border-color: var(--accent2); }
    .full-audio-player {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .full-audio-status { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .full-audio-controls {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .full-audio-seek { flex: 1; min-width: 140px; accent-color: var(--primary); cursor: pointer; }
    .full-audio-time { font-size: 0.82rem; color: var(--muted); min-width: 96px; white-space: nowrap; }

    .section-heading {
      font-family: var(--font-display); font-size: 1.35rem; color: var(--primary);
      margin: 8px 0 0; padding: 20px 24px 0; border-top: 3px solid var(--primary-light);
    }
    .section-heading:first-child { border-top: none; }
    .para-block {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); margin-bottom: 32px;
      overflow: hidden; box-shadow: var(--shadow);
    }
    .para-img { width: 100%; max-height: 280px; object-fit: cover; }
    .para-body { padding: 8px 24px 24px; }
    .sentence-block { border-bottom: 1px solid var(--border); }
    .sentence-block:last-child { border-bottom: none; }
    .sentence-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 0; line-height: 1.75; font-size: 1.05rem;
    }
    .sentence-text { flex: 1; min-width: 0; }
    .sentence-actions {
      display: flex; flex-shrink: 0; gap: 6px; align-items: center; padding-top: 2px;
    }
    .sent-btn {
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; font-family: var(--font);
      width: 34px; height: 34px; border-radius: 10px;
      font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center;
      transition: 0.15s;
    }
    .sent-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .sent-btn.translate:hover { background: #fff7ed; border-color: var(--accent); }
    .sent-btn.analyze:hover { background: var(--primary-light); border-color: var(--primary); }
    .sent-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .sentence-panel {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; margin: 0 0 12px;
      animation: panelIn 0.25s ease;
    }
    .sentence-panel[hidden] { display: none !important; }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .panel-header b { color: var(--primary); font-size: 0.92rem; }
    .panel-close {
      border: none; background: var(--surface); width: 28px; height: 28px;
      border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 1rem;
    }
    .panel-close:hover { background: var(--accent2); color: #fff; }
    .panel-quote {
      font-size: 0.88rem; color: var(--muted); margin-bottom: 10px;
      padding: 8px 10px; background: var(--surface); border-radius: 8px;
      border-left: 3px solid var(--primary-light);
    }
    .panel-trans { font-size: 1.08rem; line-height: 1.7; color: var(--text); }
    .panel-body .ai-section-title {
      font-size: 0.82rem; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: 0.04em; margin: 14px 0 6px;
    }
    .panel-body .ai-section-title:first-child { margin-top: 0; }
    .panel-body .ai-subtitle { font-size: 0.9rem; font-weight: 600; color: var(--text); margin: 10px 0 4px; }
    .panel-body p { font-size: 0.92rem; line-height: 1.7; color: var(--text); margin: 0 0 8px; }
    .panel-loading { font-size: 0.9rem; color: var(--muted); font-style: italic; }
    .word-token {
      cursor: pointer; border-bottom: 1px dotted transparent; transition: 0.15s;
    }
    .word-token:hover { background: var(--primary-light); border-bottom-color: var(--primary); }
    .socratic-box {
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      border-top: 1px solid #fde68a; padding: 20px 24px;
    }
    .socratic-box h4 { color: #b45309; margin-bottom: 12px; font-size: 0.95rem; }
    .soc-q {
      background: #fff; border-radius: 10px; padding: 12px 16px;
      margin-bottom: 10px; border: 1px solid #fde68a;
    }
    .soc-q .q-text { font-size: 0.92rem; margin-bottom: 8px; }
    .soc-q .btn-show-ans {
      background: #f59e0b; color: #fff; border: none;
      padding: 5px 14px; border-radius: 999px; cursor: pointer; font-size: 0.8rem;
    }
    .soc-q .answer {
      display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed #fde68a; font-size: 0.88rem; color: #78350f;
    }
    .soc-q .answer.show { display: block; }
    .quiz-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-top: 32px; box-shadow: var(--shadow);
    }
    .quiz-section h2 { font-family: var(--font-display); color: var(--primary); margin-bottom: 16px; }
    .quiz-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .quiz-item:last-child { border-bottom: none; }
    .quiz-item .q-title { font-weight: 600; margin-bottom: 10px; line-height: 1.6; }
    .quiz-opt {
      display: block; width: 100%; text-align: left; padding: 10px 14px;
      margin: 6px 0; border: 1px solid var(--border); border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 0.92rem; transition: 0.15s;
    }
    .quiz-opt:hover { background: var(--primary-light); }
    .quiz-opt.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
    .quiz-opt.correct { background: #f0fdf4; border-color: #27ae60; }
    .quiz-opt.wrong { background: #fff5f5; border-color: #e74c3c; }
    .quiz-analysis { display: none; margin-top: 10px; font-size: 0.88rem; color: var(--muted); }
    .quiz-analysis.show { display: block; }
  </style>
  <link rel="stylesheet" href="../../../scripts/drawing-overlay.css?v=1" />
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <div id="masthead"></div>
    <div class="toolbar" id="read-toolbar">
      <div class="toolbar-row main-actions">
        <button class="btn btn-primary read-full-btn" type="button" id="btn-read-full" onclick="toggleFullRead()">🔊 慢速全文朗读</button>
        <button class="btn btn-outline" type="button" onclick="Courseware.speakText(document.getElementById('lead-text')?.textContent, 'slow')">🔊 朗读导语</button>
        <button class="btn btn-outline" type="button" id="btn-export-pdf" onclick="exportArticlePdfClick()">📄 导出文章 PDF</button>
        <button class="btn btn-ghost" type="button" onclick="Courseware.openConfig()">⚙️ 设置</button>
      </div>
    </div>
    <div class="full-audio-player" id="full-audio-player" hidden>
      <div class="full-audio-status" data-action="status">全文 MP3 播放器</div>
      <div class="full-audio-controls">
        <button type="button" class="btn btn-outline sm" data-action="back">⏪ 10秒</button>
        <button type="button" class="btn btn-primary sm" data-action="play">▶️ 播放</button>
        <button type="button" class="btn btn-outline sm" data-action="forward">10秒 ⏩</button>
        <input type="range" class="full-audio-seek" data-action="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
        <span class="full-audio-time" data-action="time">0:00 / 0:00</span>
        <a class="btn btn-outline sm" data-action="download" href="#" download="article-full-read.mp3">⬇️ 下载 MP3</a>
        <button type="button" class="btn btn-ghost sm" data-action="close">关闭</button>
      </div>
    </div>
    <div id="article"></div>
    <div class="quiz-section" id="quiz-section"></div>
  </div>

  <div class="lookup-popup" id="lookup-popup"></div>

  <script src="assets/js/course-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/shared.js?v=20260712"></script>
  <script>
    document.getElementById('nav').innerHTML = Courseware.renderNav('part2-reading.html');
    Courseware.injectConfigPanel();

    let shownHeadings = new Set();
    let courseData = null;

    function getFullArticleText() {
      if (!courseData) return '';
      const parts = [courseData.article_lead || ''];
      (courseData.paragraphs || []).forEach(p => parts.push(...(p.sentences || [])));
      return parts.filter(Boolean).join(' ');
    }

    function resetFullReadBtn() {
      const btn = document.getElementById('btn-read-full');
      if (!btn) return;
      btn.textContent = '🔊 慢速全文朗读';
      btn.classList.remove('speaking');
      btn.disabled = false;
    }

    async function toggleFullRead() {
      const player = document.getElementById('full-audio-player');
      if (Courseware.isFullSpeakReady()) {
        await Courseware.toggleFullSpeakPlay();
        Courseware.bindFullSpeakPlayer(player, { onClose: resetFullReadBtn });
        return;
      }
      const text = getFullArticleText();
      if (!text) {
        Courseware.showToast('暂无文章内容');
        return;
      }
      const btn = document.getElementById('btn-read-full');
      const statusEl = player.querySelector('[data-action="status"]');
      btn.disabled = true;
      btn.textContent = '⏳ 合成 MP3…';
      btn.classList.add('speaking');
      player.hidden = false;
      if (statusEl) statusEl.textContent = '正在通过 Azure 合成全文 MP3…';
      try {
        await Courseware.prepareFullSpeakAudio(text, 'slow', (cur, total) => {
          if (statusEl) statusEl.textContent = 'Azure 合成中… 第 ' + cur + '/' + total + ' 段';
        });
        if (statusEl) statusEl.textContent = '全文 MP3 已就绪 · 可暂停、拖动进度条或下载';
        btn.textContent = '🔊 全文播放器';
        btn.disabled = false;
        Courseware.bindFullSpeakPlayer(player, {
          filename: (courseData?.title || 'article').replace(/[^a-zA-Z0-9_-]+/g, '_') + '_full-read.mp3',
          onClose: resetFullReadBtn
        });
        await Courseware.playFullSpeak();
      } catch (e) {
        if (e.message === 'cancelled') {
          player.hidden = true;
          resetFullReadBtn();
          return;
        }
        // Azure key/network failure: fall back to browser speech so reading still works
        console.warn('Azure full MP3 failed, using browser TTS', e);
        player.hidden = true;
        resetFullReadBtn();
        if (statusEl) statusEl.textContent = '';
        try {
          await Courseware.speakWithBrowser(text, 'slow');
          Courseware.showToast('Azure 不可用，已用浏览器语音朗读');
        } catch (e2) {
          Courseware.showToast('合成失败，请检查 Azure 配置');
        }
      }
    }
    window.toggleFullRead = toggleFullRead;

    async function exportArticlePdfClick() {
      if (!courseData) {
        Courseware.showToast('文章尚未加载');
        return;
      }
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#1a6b4a';
      const btn = document.getElementById('btn-export-pdf');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ 生成 PDF…'; }
      try {
        await Courseware.exportArticlePdf({
          data: courseData,
          accent,
          pageUrl: location.href.split('#')[0].split('?')[0],
          filename: (courseData.title || 'article').replace(/[^\w\u4e00-\u9fa5-]+/g, '_') + '_Reading.pdf'
        });
        Courseware.showToast('文章 PDF 已下载');
      } catch (e) {
        Courseware.showToast('PDF 导出失败：' + (e.message || '请重试'));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '📄 导出文章 PDF'; }
      }
    }
    window.exportArticlePdfClick = exportArticlePdfClick;

    function getSentenceText(block) {
      return block?.querySelector('.sentence-text')?.textContent?.trim() || '';
    }

    function getSentenceContext(block) {
      const para = block?.closest('.para-block');
      if (!para) return '';
      return [...para.querySelectorAll('.sentence-text')].map(el => el.textContent.trim()).join(' ');
    }

    function closeSentencePanel(btn) {
      const block = btn.closest('.sentence-block');
      const panel = block?.querySelector('.sentence-panel');
      if (!panel) return;
      panel.hidden = true;
      panel.innerHTML = '';
      block.querySelectorAll('.sent-btn').forEach(b => b.classList.remove('active'));
    }

    function openSentencePanel(block, mode, btn) {
      const panel = block.querySelector('.sentence-panel');
      block.querySelectorAll('.sent-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      panel.hidden = false;
      panel.dataset.mode = mode;
      panel.innerHTML = '<div class="panel-loading">🤖 分析中…</div>';
      return panel;
    }

    async function translateSentence(btn) {
      const block = btn.closest('.sentence-block');
      const text = getSentenceText(block);
      if (!text) return;
      const panel = openSentencePanel(block, 'translate', btn);
      try {
        const result = await Courseware.translateSelection(text);
        panel.innerHTML = `<div class="panel-header"><b>🌐 句子翻译</b><button type="button" class="panel-close" onclick="closeSentencePanel(this)">×</button></div><div class="panel-body"><p class="panel-quote">"${Courseware.escapeHtml(text)}"</p><p class="panel-trans">${Courseware.escapeHtml(result)}</p><button type="button" class="btn btn-outline sm" style="margin-top:10px" onclick="Courseware.speakText('${text.replace(/'/g, "\\'")}')">🔊 朗读原句</button></div>`;
      } catch (e) {
        panel.innerHTML = '<div class="panel-header"><b>🌐 句子翻译</b><button type="button" class="panel-close" onclick="closeSentencePanel(this)">×</button></div><p style="color:var(--accent2)">翻译失败，请检查 DeepSeek 配置</p>';
      }
    }

    async function analyzeSentenceBlock(btn) {
      const block = btn.closest('.sentence-block');
      const text = getSentenceText(block);
      if (!text) return;
      const panel = openSentencePanel(block, 'analyze', btn);
      try {
        const result = await Courseware.analyzeSentence(text, getSentenceContext(block));
        panel.innerHTML = `<div class="panel-header"><b>📖 语言解析</b><button type="button" class="panel-close" onclick="closeSentencePanel(this)">×</button></div><div class="panel-body"><p class="panel-quote">"${Courseware.escapeHtml(text)}"</p>${Courseware.formatAiMarkdown(result)}<button type="button" class="btn btn-outline sm" style="margin-top:10px" onclick="Courseware.speakText('${text.replace(/'/g, "\\'")}')">🔊 朗读原句</button></div>`;
      } catch (e) {
        panel.innerHTML = '<div class="panel-header"><b>📖 语言解析</b><button type="button" class="panel-close" onclick="closeSentencePanel(this)">×</button></div><p style="color:var(--accent2)">解析失败，请检查 DeepSeek 配置</p>';
      }
    }

    window.translateSentence = translateSentence;
    window.analyzeSentenceBlock = analyzeSentenceBlock;
    window.closeSentencePanel = closeSentencePanel;

    function showLookupPopup(title, bodyHtml) {
      const popup = document.getElementById('lookup-popup');
      popup.style.cssText = 'left:50%;top:18%;transform:translate(-50%,0);max-width:min(520px,92vw)';
      popup.classList.add('open');
      popup.innerHTML = bodyHtml;
    }

    let lookupGuardUntil = 0;

    async function onWordDblClick(e) {
      const token = e.target.closest('.word-token');
      if (!token) return;
      e.preventDefault();
      e.stopPropagation();
      lookupGuardUntil = Date.now() + 400;
      const word = token.dataset.word;
      const popup = document.getElementById('lookup-popup');
      const rect = token.getBoundingClientRect();
      popup.style.cssText = `left:${Math.min(rect.left, window.innerWidth-380)}px;top:${rect.bottom+8}px;transform:none`;
      popup.classList.add('open');
      popup.innerHTML = `<div class="lookup-loading">🔍 查询 "${word}" …</div>`;
      Courseware.speakText(word);
      try {
        const ctx = token.closest('.sentence-row')?.querySelector('.sentence-text')?.textContent || '';
        const data = await Courseware.lookupWord(word, ctx);
        popup.innerHTML = `<div style="display:flex;justify-content:space-between"><b style="font-size:1.2rem;color:var(--primary)">${Courseware.escapeHtml(data.word||word)}</b><button onclick="closeLookup()" style="border:none;background:none;cursor:pointer">✕</button></div>${data.phonetic?`<p style="color:var(--muted);font-size:0.85rem">${data.phonetic} ${data.pos||''}</p>`:''}<button class="btn-icon sm" onclick="Courseware.speakText('${word}')">🔊</button><p style="margin:8px 0;font-size:0.9rem">${Courseware.escapeHtml(data.definition_en||'')}</p><button class="cn-reveal" onclick="this.nextElementSibling.classList.toggle('show')">显示中文</button><p class="ex-trans">${Courseware.escapeHtml(data.definition_cn||'')}</p>${data.example_en?`<div class="ex-box" style="margin-top:10px"><div class="ex-sent">${Courseware.escapeHtml(data.example_en)} <button class="btn-icon xs" onclick="Courseware.speakText('${(data.example_en||'').replace(/'/g,"\\'")}')">🔊</button></div><div class="ex-trans show">${Courseware.escapeHtml(data.example_cn||'')}</div></div>`:''}`;
      } catch (e) {
        popup.innerHTML = '<p>查询失败</p><button onclick="closeLookup()">关闭</button>';
      }
    }

    function closeLookup() { document.getElementById('lookup-popup').classList.remove('open'); }
    document.addEventListener('click', e => {
      if (Date.now() < lookupGuardUntil) return;
      if (!e.target.closest('#lookup-popup') && !e.target.closest('.word-token')) closeLookup();
    });
    function toggleAnswer(btn) { btn.nextElementSibling.classList.toggle('show'); btn.textContent = btn.nextElementSibling.classList.contains('show') ? '隐藏答案' : '显示答案'; }

    function renderArticle(data) {
      courseData = data;
      document.getElementById('masthead').innerHTML = `
        <header class="article-masthead">
          <h1>${Courseware.escapeHtml(data.title_full)}</h1>
          <p class="article-lead" id="lead-text">${Courseware.escapeHtml(data.article_lead)}</p>
          <p class="article-byline">${Courseware.escapeHtml(data.source)} · Level ${data.level} · ${data.word_count} words</p>
        </header>`;

      shownHeadings = new Set();
      document.getElementById('article').innerHTML = data.paragraphs.map(p => {
        let headingHtml = '';
        if (p.section_heading && !shownHeadings.has(p.section_heading)) {
          shownHeadings.add(p.section_heading);
          headingHtml = `<h2 class="section-heading">${Courseware.escapeHtml(p.section_heading)}</h2>`;
        }
        return `${headingHtml}
        <article class="para-block">
          <img class="para-img" src="${Courseware.imageUrl(p.image)}" alt="${Courseware.escapeHtml(p.title)}">
          <div class="para-body">
            ${p.sentences.map(s => `
              <div class="sentence-block">
                <div class="sentence-row">
                  <div class="sentence-text" ondblclick="onWordDblClick(event)">${Courseware.wrapWordsForLookup(s)}</div>
                  <div class="sentence-actions">
                    <button type="button" class="sent-btn speak" title="朗读" onclick="Courseware.speakText('${s.replace(/'/g,"\\'")}')">🔊</button>
                    <button type="button" class="sent-btn translate" title="翻译" onclick="translateSentence(this)">🌐</button>
                    <button type="button" class="sent-btn analyze" title="语言解析" onclick="analyzeSentenceBlock(this)">📖</button>
                  </div>
                </div>
                <div class="sentence-panel" hidden></div>
              </div>`).join('')}
          </div>
          <div class="socratic-box">
            <h4>🤔 苏格拉底式阅读理解</h4>
            ${p.socratic.map((q,i) => `
              <div class="soc-q">
                <div class="q-text"><b>Q${i+1}.</b> ${Courseware.escapeHtml(q.q)}</div>
                <button class="btn-show-ans" onclick="toggleAnswer(this)">显示答案</button>
                <div class="answer">${Courseware.escapeHtml(q.a)}</div>
              </div>`).join('')}
          </div>
        </article>`;
      }).join('');

      document.getElementById('quiz-section').innerHTML = `
        <h2>📝 阅读理解 Quiz（PDF 原题）</h2>
        ${data.comprehension_questions.map((q, qi) => `
          <div class="quiz-item" data-answer="${q.answer}">
            <div class="q-title"><b>${qi+1}.</b> ${Courseware.escapeHtml(q.q)}</div>
            ${q.options.map((opt, oi) => `
              <button class="quiz-opt" onclick="pickQuiz(this, ${qi}, ${oi}, ${q.answer})">${String.fromCharCode(65+oi)}. ${Courseware.escapeHtml(opt)}</button>
            `).join('')}
            <div class="quiz-analysis" id="qa-${qi}"><b>解析：</b>${Courseware.escapeHtml(q.analysis)}</div>
          </div>`).join('')}
        <button class="btn btn-primary" onclick="checkAllQuiz()">核对全部答案</button>`;
    }

    function pickQuiz(btn, qi, oi, correct) {
      const item = btn.closest('.quiz-item');
      item.querySelectorAll('.quiz-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      btn.dataset.pick = oi;
    }

    function checkAllQuiz() {
      document.querySelectorAll('.quiz-item').forEach((item, qi) => {
        const correct = parseInt(item.dataset.answer, 10);
        const opts = item.querySelectorAll('.quiz-opt');
        opts.forEach((b, oi) => {
          b.classList.remove('correct', 'wrong');
          if (b.classList.contains('selected')) {
            b.classList.add(oi === correct ? 'correct' : 'wrong');
          }
          if (oi === correct) b.classList.add('correct');
        });
        document.getElementById('qa-' + qi)?.classList.add('show');
      });
    }

    Courseware.loadCourseData().then(renderArticle);
  </script>
  <script src="../../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
