cape", "highway at sunset"], "image_paths": ["P6_vocabulary_exercises_1_Q3_road_1.png", "P6_vocabulary_exercises_1_Q3_road_2.png"], "examples": [{"en": "The old road to the village was narrow and bumpy, making the journey difficult.", "cn": "\u901a\u5f80\u6751\u5e84\u7684\u65e7\u8def\u72ed\u7a84\u800c\u98a0\u7c38\uff0c\u4f7f\u5f97\u65c5\u7a0b\u53d8\u5f97\u56f0\u96be\u3002"}, {"en": "We decided to take the scenic road along the coast to enjoy the beautiful views.", "cn": "\u6211\u4eec\u51b3\u5b9a\u6cbf\u7740\u6d77\u5cb8\u8d70\u98ce\u666f\u4f18\u7f8e\u7684\u8def\uff0c\u6b23\u8d4f\u7f8e\u4e3d\u7684\u666f\u8272\u3002"}], "quiz_distractors": []}, {"word": "lane", "ipa": "/le\u026an/", "meanings": {"en": "A narrow road, especially in a rural area or between fields or trees.", "cn": "\u72ed\u7a84\u7684\u9053\u8def\uff0c\u5c24\u5176\u662f\u5728\u4e61\u6751\u5730\u533a\u6216\u7530\u91ce\u6216\u6811\u6728\u4e4b\u95f4\u3002"}, "usage_en": "Describes a narrow pathway or road, often found in the countryside.", "usage_cn": "\u63cf\u8ff0\u4e00\u6761\u72ed\u7a84\u7684\u5c0f\u8def\u6216\u9053\u8def\uff0c\u901a\u5e38\u5728\u4e61\u6751\u5730\u533a\u53d1\u73b0\u3002", "scene_en": "A quiet country lane lined with tall trees and wildflowers on a sunny afternoon.", "scene_cn": "\u4e00\u4e2a\u5b89\u9759\u7684\u4e61\u6751\u5c0f\u8def\uff0c\u9633\u5149\u660e\u5a9a\u7684\u4e0b\u5348\uff0c\u4e24\u65c1\u662f\u9ad8\u5927\u7684\u6811\u6728\u548c\u91ce\u82b1\u3002", "image_prompts": ["country lane wildflowers", "tree lined lane autumn"], "image_paths": ["P6_vocabulary_exercises_1_Q3_lane_1.png", "P6_vocabulary_exercises_1_Q3_lane_2.png"], "examples": [{"en": "The peaceful lane led us through fields of golden wheat, a truly idyllic scene.", "cn": "\u8fd9\u6761\u5b81\u9759\u7684\u5c0f\u8def\u5e26\u9886\u6211\u4eec\u7a7f\u8fc7\u91d1\u8272\u7684\u9ea6\u7530\uff0c\u771f\u662f\u4e00\u4e2a\u7530\u56ed\u8bd7\u822c\u7684\u573a\u666f\u3002"}, {"en": "We walked down the narrow lane, enjoying the quiet sounds of nature all around us.", "cn": "\u6211\u4eec\u8d70\u5728\u72ed\u7a84\u7684\u5c0f\u8def\u4e0a\uff0c\u4eab\u53d7\u7740\u5468\u56f4\u5927\u81ea\u7136\u5b89\u9759\u7684\u58f0\u97f3\u3002"}], "quiz_distractors": []}, {"word": "way", "ipa": "/we\u026a/", "meanings": {"en": "A method, style, or manner of doing something; or a route or direction.", "cn": "\u505a\u4e8b\u7684\u65b9\u6cd5\u3001\u98ce\u683c\u6216\u65b9\u5f0f\uff1b\u6216\u8def\u7ebf\u6216\u65b9\u5411\u3002"}, "usage_en": "Refers to a method or route for achieving a goal or reaching a destination.", "usage_cn": "\u6307\u5b9e\u73b0\u76ee\u6807\u6216\u5230\u8fbe\u76ee\u7684\u5730\u7684\u9014\u5f84\u6216\u8def\u7ebf\u3002", "scene_en": "A traveler standing at a crossroads, contemplating which way to proceed on their journey.", "scene_cn": "\u4e00\u4e2a\u65c5\u884c\u8005\u7ad9\u5728\u5341\u5b57\u8def\u53e3\uff0c\u601d\u8003\u7740\u5728\u4ed6\u4eec\u7684\u65c5\u7a0b\u4e2d\u8be5\u5982\u4f55\u524d\u8fdb\u3002", "image_prompts": ["crossroads decision", "path through forest"], "image_paths": ["P6_vocabulary_exercises_1_Q3_way_1.png", "P6_vocabulary_exercises_1_Q3_way_2.png"], "examples": [{"en": "The quickest way to get to the airport is by taking the highway during off-peak hours.", "cn": "\u5728\u975e\u9ad8\u5cf0\u65f6\u6bb5\u524d\u5f80\u673a\u573a\u7684\u6700\u5feb\u65b9\u5f0f\u662f\u8d70\u9ad8\u901f\u516c\u8def\u3002"}, {"en": "She found a creative way to solve the complex problem, impressing her entire team.", "cn": "\u5979\u627e\u5230\u4e86\u4e00\u79cd\u521b\u9020\u6027\u7684\u65b9\u6cd5\u6765\u89e3\u51b3\u8fd9\u4e2a\u590d\u6742\u7684\u95ee\u9898\uff0c\u7ed9\u5979\u7684\u6574\u4e2a\u56e2\u961f\u7559\u4e0b\u4e86\u6df1\u523b\u7684\u5370\u8c61\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u8def\u5f84, \u5c0f\u8def, \u65b9\u6cd5", "socratic_questions": [{"question": "If a fallen tree blocks the main road, which alternative route might you seek?", "options": ["cut", "road", "lane", "way"], "correct_answer": "way", "explanation": "A 'way' implies a general route or direction, suitable for an alternative path."}, {"question": "In tailoring, what is the initial incision made in fabric called?", "options": ["cut", "road", "lane", "way"], "correct_answer": "cut", "explanation": "A 'cut' refers to an opening or incision made with a sharp object."}, {"question": "What do you call a major, paved route designed for vehicular traffic between cities?", "options": ["cut", "road", "lane", "way"], "correct_answer": "road", "explanation": "A 'road' is a prepared route for vehicles, connecting different locations."}, {"question": "What is a narrow passage in the countryside, often bordered by hedges or trees, called?", "options": ["cut", "road", "lane", "way"], "correct_answer": "lane", "explanation": "A 'lane' is a narrow road, typically found in rural areas."}]}, {"id": 4, "stem": "We are advised not to forget to ______ our luggage in case it gets lost or misplaced.", "correct_index": 2, "options": [{"word": "print", "ipa": "pr\u026ant", "meanings": {"en": "To produce copies of (a text, image, etc.) by applying ink to paper or other material.", "cn": "\u901a\u8fc7\u5c06\u58a8\u6c34\u5e94\u7528\u5230\u7eb8\u5f20\u6216\u5176\u4ed6\u6750\u6599\u4e0a\u6765\u5236\u4f5c\uff08\u6587\u672c\u3001\u56fe\u50cf\u7b49\uff09\u7684\u526f\u672c\u3002"}, "usage_en": "Used to describe the process of creating copies on paper.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u7eb8\u4e0a\u521b\u5efa\u526f\u672c\u7684\u8fc7\u7a0b\u3002", "scene_en": "A printing press churning out newspapers, or a home printer producing documents.", "scene_cn": "\u4e00\u53f0\u5370\u5237\u673a\u5927\u91cf\u5370\u5237\u62a5\u7eb8\uff0c\u6216\u4e00\u53f0\u5bb6\u7528\u6253\u5370\u673a\u6253\u5370\u6587\u4ef6\u3002", "image_prompts": ["A printing press in operation.", "A document being printed by a home printer."], "image_paths": ["P6_vocabulary_exercises_1_Q4_print_1.png", "P6_vocabulary_exercises_1_Q4_print_2.png"], "examples": [{" ning a wedding guest book."], "image_paths": ["P6_vocabulary_exercises_1_Q4_sign_1.png", "P6_vocabulary_exercises_1_Q4_sign_2.png"], "examples": [{"en": "Remember to sign the document before you submit it to the human resources department.", "cn": "\u5728\u5c06\u6587\u4ef6\u63d0\u4ea4\u7ed9\u4eba\u4e8b\u90e8\u95e8\u4e4b\u524d\uff0c\u8bf7\u8bb0\u4f4f\u7b7e\u7f72\u8be5\u6587\u4ef6\u3002"}, {"en": "The artist was happy to sign autographs for his fans after the concert ended last night.", "cn": "\u6628\u665a\u97f3\u4e50\u4f1a\u7ed3\u675f\u540e\uff0c\u8fd9\u4f4d\u827a\u672f\u5bb6\u5f88\u9ad8\u5174\u4e3a\u4ed6\u7684\u7c89\u4e1d\u7b7e\u540d\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u6807\u8bb0\uff0c\u6ce8\u660e", "socratic_questions": [{"question": "Imagine you're distributing flyers. Would you rather ______ them with your contact information or just hand them out blank?", "options": ["print", "name", "label", "sign"], "correct_answer": "label", "explanation": "Labeling flyers ensures people know how to reach you."}, {"question": "If you need multiple copies of a document, do you ______ it, write it by hand, or scan it?", "options": ["print", "name", "label", "sign"], "correct_answer": "print", "explanation": "Printing is the process of producing multiple copies of a document."}, {"question": "When you endorse a check, do you ______ it, or do you leave it blank?", "options": ["print", "name", "label", "sign"], "correct_answer": "sign", "explanation": "Signing a check endorses it, making it valid for deposit or cashing."}, {"question": "When you create a new file on your computer, do you ______ it, leave it unnamed, or delete it?", "options": ["print", "name", "label", "sign"], "correct_answer": "name", "explanation": "Naming a file helps you identify and locate it later."}]}, {"id": 5, "stem": "Don't eat those berries, they may be ______.", "correct_index": 3, "options": [{"word": "infectious", "ipa": "/\u026an\u02c8fek.\u0283\u0259s/", "meanings": {"en": "Capable of causing infection.", "cn": "\u80fd\u591f\u5f15\u8d77\u611f\u67d3\u7684\u3002"}, "usage_en": "Used to describe diseases or conditions that can be transmitted.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u53ef\u4ee5\u4f20\u64ad\u7684\u75be\u75c5\u6216\u72b6\u51b5\u3002", "scene_en": "A doctor examining a patient with a visible skin rash, wearing protective gloves.", "scene_cn": "\u533b\u751f\u6b63\u5728\u68c0\u67e5\u4e00\u4f4d\u6709\u660e\u663e\u76ae\u75b9\u7684\u75c5\u4eba\uff0c\u6234\u7740\u9632\u62a4\u624b\u5957\u3002", "image_prompts": ["A doctor examining a patient with a rash.", "Microscopic view of infectious bacteria."], "image_paths": ["P6_vocabulary_exercises_1_Q5_infectious_1.png", "P6_vocabulary_exercises_1_Q5_infectious_2.png"], "examples": [{"en": "The doctor confirmed that the patient's cough was highly infectious, requiring immediate isolation measures.", "cn": "\u533b\u751f\u786e\u8ba4\u75c5\u4eba\u7684\u54b3\u55fd\u5177\u6709\u9ad8\u5ea6\u4f20\u67d3\u6027\uff0c\u9700\u8981\u7acb\u5373\u91c7\u53d6\u9694\u79bb\u63aa\u65bd\u3002"}, {"en": "Proper handwashing is essential to prevent the spread of infectious diseases in crowded public spaces.", "cn": "\u9002\u5f53\u7684\u6d17\u624b\u5bf9\u4e8e\u9884\u9632\u62e5\u6324\u516c\u5171\u573a\u6240\u4e2d\u4f20\u67d3\u75c5\u7684\u4f20\u64ad\u81f3\u5173\u91cd\u8981\u3002"}], "quiz_distractors": []}, {"word": "contagious", "ipa": "/k\u0259n\u02c8te\u026a.d\u0292\u0259s/", "meanings": {"en": "Easily spread from one person or organism to another by direct or indirect contact.", "cn": "\u901a\u8fc7\u76f4\u63a5\u6216\u95f4\u63a5\u63a5\u89e6\u5bb9\u6613\u4ece\u4e00\u4e2a\u4eba\u6216\u751f\u7269\u4f20\u64ad\u5230\u53e6\u4e00\u4e2a\u4eba\u6216\u751f\u7269\u3002"}, "usage_en": "Describes diseases that spread quickly through a population.", "usage_cn": "\u63cf\u8ff0\u5728\u4eba\u7fa4\u4e2d\u8fc5\u901f\u4f20\u64ad\u7684\u75be\u75c5\u3002", "scene_en": "A crowded subway car with people wearing face masks to avoid catching a c r in life.", "cn": "\u5438\u70df\u662f\u4e00\u79cd\u4e0d\u5065\u5eb7\u7684\u4e60\u60ef\uff0c\u4f1a\u663e\u8457\u589e\u52a0\u65e5\u540e\u60a3\u80ba\u764c\u7684\u98ce\u9669\u3002"}, {"en": "Consuming excessive amounts of sugary drinks is considered unhealthy due to the high calorie and sugar content.", "cn": "\u7531\u4e8e\u9ad8\u5361\u8def\u91cc\u548c\u7cd6\u5206\u542b\u91cf\uff0c\u8fc7\u5ea6\u996e\u7528\u542b\u7cd6\u996e\u6599\u88ab\u8ba4\u4e3a\u662f\u4e0d\u5065\u5eb7\u7684\u3002"}], "quiz_distractors": []}, {"word": "poisonous", "ipa": "/\u02c8p\u0254\u026a.z\u0259n.\u0259s/", "meanings": {"en": "Containing or capable of causing death or illness if taken into the body.", "cn": "\u5982\u679c\u8fdb\u5165\u4f53\u5185\uff0c\u542b\u6709\u6216\u80fd\u591f\u5f15\u8d77\u6b7b\u4ea1\u6216\u75be\u75c5\u7684\u3002"}, "usage_en": "Describes substances that are toxic and harmful if ingested or touched.", "usage_cn": "\u63cf\u8ff0\u5982\u679c\u6444\u5165\u6216\u63a5\u89e6\u6709\u6bd2\u548c\u6709\u5bb3\u7684\u7269\u8d28\u3002", "scene_en": "A brightly colored mushroom growing in a forest, with a warning sign nearby.", "scene_cn": "\u68ee\u6797\u91cc\u751f\u957f\u7740\u4e00\u6735\u989c\u8272\u9c9c\u8273\u7684\u8611\u83c7\uff0c\u9644\u8fd1\u6709\u4e00\u4e2a\u8b66\u544a\u6807\u5fd7\u3002", "image_prompts": ["A skull and crossbones symbol.", "A poisonous snake."], "image_paths": ["P6_vocabulary_exercises_1_Q5_poisonous_1.png", "P6_vocabulary_exercises_1_Q5_poisonous_2.png"], "examples": [{"en": "Some species of mushrooms are poisonous and can cause severe illness or even death if consumed accidentally.", "cn": "\u67d0\u4e9b\u79cd\u7c7b\u7684\u8611\u83c7\u662f\u6709\u6bd2\u7684\uff0c\u5982\u679c\u610f\u5916\u98df\u7528\u4f1a\u5bfc\u81f4\u4e25\u91cd\u7684\u75be\u75c5\u751a\u81f3\u6b7b\u4ea1\u3002"}, {"en": "The factory released poisonous chemicals into the river, causing significant harm to the local ecosystem.", "cn": "\u8be5\u5de5\u5382\u5411\u6cb3\u6d41\u6392\u653e\u6709\u6bd2\u5316\u inking tea from a cup.", "scene_cn": "\u4e00\u4e2a\u4eba\u6162\u6162\u5730\u4ece\u676f\u5b50\u91cc\u559d\u8336\u3002", "image_prompts": ["A person sipping tea in a garden", "Close-up of someone sipping coffee"], "image_paths": ["P6_vocabulary_exercises_1_Q6_sipping_1.png", "P6_vocabulary_exercises_1_Q6_sipping_2.png"], "examples": [{"en": "She was sipping her coffee, enjoying the quiet morning before the day began.", "cn": "\u5979\u555c\u996e\u7740\u5496\u5561\uff0c\u4eab\u53d7\u7740\u4e00\u5929\u5f00\u59cb\u524d\u5b89\u9759\u7684\u65e9\u6668\u3002"}, {"en": "He spent the afternoon sipping iced tea on the porch, watching the world go by.", "cn": "\u4ed6\u6574\u4e2a\u4e0b\u5348\u90fd\u5728\u95e8\u5eca\u4e0a\u555c\u996e\u51b0\u8336\uff0c\u770b\u7740\u4e16\u754c\u6d41\u901d\u3002"}], "quiz_distractors": []}, {"word": "tasting", "ipa": "/\u02c8te\u026ast\u026a\u014b/", "meanings": {"en": "Experiencing the flavor of something.", "cn": "\u4f53\u9a8c\u67d0\u7269\u7684\u5473\u9053\u3002"}, "usage_en": "Used when evaluating the flavor of food or drink.", "usage_cn": "\u7528\u4e8e\u8bc4\u4f30\u98df\u7269\u6216\u996e\u6599\u7684\u5473\u9053\u3002", "scene_en": "A chef carefully tasting a sauce.", "scene_cn": "\u4e00\u4f4d\u53a8\u5e08\u4ed4\u7ec6\u54c1\u5c1d\u9171\u6c41\u3002", "image_prompts": ["A chef tasting soup", "A person tasting wine"], "image_paths": ["P6_vocabulary_exercises_1_Q6_tasting_1.png", "P6_vocabulary_exercises_1_Q6_tasting_2.png"], "examples": [{"en": "The chef was tasting the soup to ensure it had the perfect balance of flavors.", "cn": "\u53a8\u5e08\u6b63\u5728\u54c1\u5c1d\u6c64\uff0c\u4ee5\u786e\u4fdd\u5b83\u5177\u6709\u5b8c\u7f8e\u7684\u98ce\u5473\u5e73\u8861\u3002"}, {"en": "We went wine tasting in Napa Valley and sampled several different varieties of grapes.", "cn": "\u6211\u4eec\u53bb\u7eb3\u5e15\u8c37\u54c1\u5c1d\u8461\u8404\u9152\uff0c\u5e76\u54c1\u5c1d\u4e86\u51e0\u79cd\u4e0d\u540c\u7684\u8461\u8404\u54c1\u79cd\u3002"}], "quiz_distractors": []}, {" rd describes a throat that feels painful, often due to a cold?", "options": ["damaged", "hurt", "sore", "sick"], "correct_answer": "sore", "explanation": "Sore describes a feeling of pain or discomfort, often in muscles or joints."}, {"question": "Which word describes the general feeling of being unwell, often with a fever?", "options": ["damaged", "hurt", "sore", "sick"], "correct_answer": "sick", "explanation": "Sick describes the state of being unwell or experiencing illness."}]}, {"id": 9, "stem": "I ______ that you ought to apologise to him.", "correct_index": 0, "options": [{"word": "think", "ipa": "/\u03b8\u026a\u014bk/", "meanings": {"en": "To have a particular belief or idea.", "cn": "\u62e5\u6709\u7279\u5b9a\u7684\u4fe1\u5ff5\u6216\u60f3\u6cd5\u3002"}, "usage_en": "Used to express an opinion or belief.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u89c2\u70b9\u6216\u4fe1\u5ff5\u3002", "scene_en": "A person sitting at a desk, pondering a complex problem with furrowed brows.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u65c1\uff0c\u7d27\u9501\u7709\u5934\uff0c\u601d\u8003\u4e00\u4e2a\u590d\u6742\u7684\u95ee\u9898\u3002", "image_prompts": ["A person deep in thought, surrounded by books.", "Brainstorming session with sticky notes and diagrams."], "image_paths": ["P6_vocabulary_exercises_1_Q9_think_1.png", "P6_vocabulary_exercises_1_Q9_think_2.png"], "examples": [{"en": "I think that the new policy will benefit the company in the long run.", "cn": "\u6211\u8ba4\u4e3a\u8fd9\u9879\u65b0\u653f\u7b56\u4ece\u957f\u8fdc\u6765\u770b\u5c06\u4f7f\u516c\u53f8\u53d7\u76ca\u3002"}, {"en": "Do you think it will rain later, considering the dark clouds gathering overhead?", "cn": "\u8003\u8651\u5230\u805a\u96c6\u5728\u5934\u9876\u7684\u4e4c\u4e91\uff0c\u4f60\u8ba4\u4e3a\u7a0d\u540e\u4f1a\u4e0b\u96e8\u5417\uff1f"}], "quiz_distractors": []}, {"word": "hope", "ipa": "/ho\u028ap/", "meanings": {"en": "To want something to happen or be true, and usually have a good reason to thin
