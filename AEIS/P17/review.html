d in Southeast Asia.", "cn": "\u6211\u4eec\u7a7f\u7684\u5927\u90e8\u5206\u8863\u670d\u90fd\u662f\u5728\u4f4d\u4e8e\u4e1c\u5357\u4e9a\u7684\u5de5\u5382\u91cc\u751f\u4ea7\u7684\u3002"}]}, {"word": "discovered", "ipa": "/d\u026a\u02c8sk\u028cv\u0259d/", "meanings": {"en": "found something unexpectedly or while looking for something else.", "cn": "\u610f\u5916\u5730\u6216\u5728\u5bfb\u627e\u5176\u4ed6\u4e1c\u897f\u65f6\u53d1\u73b0\u67d0\u7269\u3002"}, "usage_en": "Used when something is found unexpectedly.", "usage_cn": "\u7528\u4e8e\u610f\u5916\u53d1\u73b0\u67d0\u7269\u65f6\u3002", "scene_en": "An explorer in a jungle stumbling upon ancient ruins.", "scene_cn": "\u4e00\u4e2a\u63a2\u9669\u5bb6\u5728\u4e1b\u6797\u4e2d\u5076\u7136\u53d1\u73b0\u53e4\u4ee3\u9057\u5740\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q1_discovered_1.png", "P6_vocabulary_exercises_17_Q1_discovered_2.png"], "examples": [{"en": "Scientists discovered a new species of frog in the Amazon rainforest during their expedition.", "cn": "\u79d1\u5b66\u5bb6\u5728\u4ed6\u4eec\u7684\u63a2\u9669\u4e2d\u5728\u4e9a\u9a6c\u900a\u96e8\u6797\u4e2d\u53d1\u73b0\u4e86\u4e00\u79cd\u65b0\u7684\u9752\u86d9\u3002"}, {"en": "Marie Curie discovered radium and polonium while researching radioactivity, changing science forever.", "cn": "\u739b\u4e3d\u00b7\u5c45\u91cc\u5728\u7814\u7a76\u653e\u5c04\u6027\u65f6\u53d1\u73b0\u4e86\u956d\u548c\u948b\uff0c\u6c38\u8fdc\u6539\u53d8\u4e86\u79d1\u5b66\u3002"}]}], "synonym_cn": "\u8d77\u6e90\uff0c\u53d1\u6e90\uff0c\u521b\u9020\uff0c\u627e\u5230", "socratic_questions": [{"question": "If you create a new recipe by mixing existing ingredients, did you _______ it?", "options": ["invented", "originated", "manufactured", "discovered"], "correct_answer": "invented", "explanation": "Invented means to create something new, while the other options don't fit creating a recipe."}, {"question": "If a river's source is in the mountains, did the river _______ there?", "options": ["invented", "originated", "manufactured", "discovered"], "correct_answer": "originated", "explanation": "Originated means to have its beginning in a particular place, like a river's source."}, {"question": "If a factory produces cars on a large scale, are the cars being _______?", "options": ["invented", "originated", "manufactured", "discovered"], "correct_answer": "manufactured", "explanation": "Manufactured means to produce something in large quantities, usually in a factory."}, {"question": "If you find an old coin while digging in your garden, did you _______ it?", "options": ["invented", "originated", "manufactured", "discovered"], "correct_answer": "discovered", "explanation": "Discovered means to find something unexpectedly or while looking for something else."}]}, {"id": 2, "stem": "A person who is dependent on a habit or vice is known as a/an _______.", "correct_index": 2, "options": [{"word": "culprit", "ipa": "\u02c8k\u028clpr\u026at", "meanings": {"en": "A person who is responsible for a crime or other offense.", "cn": "\u5bf9\u72af\u7f6a\u6216\u5176\u4ed6\u8fc7\u5931\u8d1f\u6709\u8d23\u4efb\u7684\u4eba\u3002"}, "usage_en": "Often used in legal or investigative contexts.", "usage_cn": "\u5e38\u7528\u4e8e\u6cd5\u5f8b\u6216\u8c03\u67e5\u8bed\u5883\u3002", "scene_en": "A detective questioning suspects in a dimly lit room.", "scene_cn": "\u4fa6\u63a2\u5728\u5149\u7ebf\u660f\u6697\u7684\u623f\u95f4\u91cc\u5ba1\u95ee\u5acc\u7591\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q2_culprit_1.png", "P6_vocabulary_exercises_17_Q2_culprit_2.png"], "examples": [{"en": "The police are still searching for the culprit responsible for the bank robbery.", "cn": "\u8b66\u65b9\u4ecd\u5728\u641c\u5bfb\u5bf9\u94f6\u884c\u62a2\u52ab\u6848\u8d1f\u6709\u8d23\u4efb\u7684\u7f6a\u9b41\u7978\u9996\u3002"}, {"en": "The main culprit behind the company's failure was poor management and lack of vision.", "cn": "\u516c\u53f8\u5012\u95ed\u7684\u4e3b\u8981\u7f6a\u9b41\u7978\u9996\u662f\u7cdf\u7cd5\u7684\u7ba1\u7406\u548c\u7f3a\u4e4f\u8fdc\u89c1\u3002"}]}, {"word": "scavenger", "ipa": "\u02c8sk\u00e6v\u026and\u0292\u0259r", "meanings": {"en": "An animal or other organism that feeds on dead organic matter.", "cn": "\u4ee5\u6b7b\u4ea1\u6709\u673a\u7269\u4e3a\u98df\u7684\u52a8\u7269\u6216\u5176\u4ed6\u751f\u7269\u3002"}, "usage_en": "Describes animals or people who search for discarded items.", "usage_cn": "\u63cf\u8ff0\u5bfb\u627e\u88ab\u4e22\u5f03\u7269\u54c1\u7684\u52a8\u7269\u6216\u4eba\u3002", "scene_en": "A vulture circling above a desert landscape, searching for carrion.", "scene_cn": "\u79c3\u9e6b\u5728\u6c99\u6f20\u666f\u89c2\u4e0a\u7a7a\u76d8\u65cb\uff0c\u5bfb\u627e\u8150\u8089\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q2_scavenger_1.png", "P6_vocabulary_exercises_17_Q2_scavenger_2.png"], "examples": [{"en": "Vultures are nature's scavengers, cleaning up carcasses and preventing the spread of disease.", "cn": "\u79c3\u9e6b\u662f\u81ea\u7136\u7684\u6e05\u9053\u592b\uff0c\u6e05\u7406\u52a8\u7269\u5c38\u4f53\u5e76\u9632\u6b62\u75be\u75c5\u4f20\u64ad\u3002"}, {"en": "During the economic crisis, many people became scavengers, searching for food in garbage bins.", "cn": "\u5728\u7ecf\u6d4e\u5371\u673a\u671f\u95f4\uff0c\u8bb8\u591a\u4eba\u6210\u4e3a\u6e05\u9053\u592b\uff0c\u5728\u5783\u573e\u7bb1\u91cc\u5bfb\u627e\u98df\u7269\u3002"}]}, {"word": "addict", "ipa": "\u02c8\u00e6d\u026akt", "meanings": {"en": "A person who is addicted to a particular substance or activity.", "cn": "\u5bf9\u67d0\u79cd\u7279\u5b9a\u7269\u8d28\u6216\u6d3b\u52a8\u4e0a\u763e\u7684\u4eba\u3002"}, "usage_en": "Refers to someone with a compulsive dependence.", "usage_cn": "\u6307\u5bf9\u67d0\u4e8b\u7269\u6709\u5f3a\u8feb\u6027\u4f9d\u8d56\u7684\u4eba\u3002", "scene_en": "A person struggling with withdrawal symptoms in a dimly lit room.", "scene_cn": "\u4e00\u4e2a\u5728\u5149\u7ebf\u660f\u6697\u7684\u623f\u95f4\u91cc\u4e0e\u6212\u65ad\u75c7\u72b6\u4f5c\u6597\u4e89\u7684\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q2_addict_1.png", "P6_vocabulary_exercises_17_Q2_addict_2.png"], "examples": [{"en": "He is a recovering addict who has been clean for five years through therapy and support groups.", "cn": "\u4ed6\u662f\u4e00\u4f4d\u6b63\u5728\u5eb7\u590d\u7684\u763e\u541b\u5b50\uff0c\u901a\u8fc7\u6cbb\u7597\u548c\u652f\u6301\u56e2\u4f53\u5df2\u7ecf\u6212\u6bd2\u4e94\u5e74\u4e86\u3002"}, {"en": "She realized she was becoming an addict to social media, spending hours scrolling every day.", "cn": "\u5979\u610f\u8bc6\u5230\u81ea\u5df1\u6b63\u5728\u5bf9\u793e\u4ea4\u5a92\u4f53\u4e0a\u763e\uff0c\u6bcf\u5929\u82b1\u51e0\u4e2a\u5c0f\u65f6\u6eda\u52a8\u6d4f\u89c8\u3002"}]}, {"word": "edict", "ipa": "\u02c8i\u02d0d\u026akt", "meanings": {"en": "An official order or proclamation issued by a person in authority.", "cn": "\u7531\u5f53\u6743\u8005\u53d1\u5e03\u7684\u5b98\u65b9\u547d\u4ee4\u6216\u516c\u544a\u3002"}, "usage_en": "Used in historical or political contexts.", "usage_cn": "\u7528\u4e8e\u5386\u53f2\u6216\u653f\u6cbb\u8bed\u5883\u3002", "scene_en": "A king signing a royal decree with a quill pen.", "scene_cn": "\u56fd\u738b\u7528\u7fbd\u6bdb\u7b14\u7b7e\u7f72\u7687\u5bb6\u6cd5\u4ee4\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q2_edict_1.png", "P6_vocabulary_exercises_17_Q2_edict_2.png"], "examples": [{"en": "The emperor issued an edict forbidding the practice of certain religious rituals within the empire.", "cn": "\u7687\u5e1d\u9881\u5e03\u6cd5\u4ee4\uff0c\u7981\u6b62\u5728\u8be5\u5e1d\u56fd\u5883\u5185\u8fdb\u884c\u67d0\u4e9b\u5b97\u6559\u4eea\u5f0f\u3002"}, {"en": "The new edict from the government aims to reduce pollution levels in major cities significantly.", "cn": "\u653f\u5e9c\u7684\u65b0\u6cd5\u4ee4\u65e8\u5728\u663e\u7740\u964d\u4f4e\u4e3b\u8981\u57ce\u5e02\u7684\u6c61\u67d3\u6c34\u5e73\u3002"}]}], "synonym_cn": "\u6c89\u8ff7\u8005 vs. \u7f6a\u72af vs. \u6e05\u9053\u592b vs. \u6cd5\u4ee4", "socratic_questions": [{"question": "If someone breaks the law, are they considered a culprit, scavenger, addict, or edict?", "options": ["culprit", "scavenger", "addict", "edict"], "correct_answer": "culprit", "explanation": "A culprit is someone who is responsible for a crime or wrongdoing."}, {"question": "Which term describes someone who compulsively seeks and consumes something harmful, like drugs: culprit, scavenger, addict, or edict?", "options": ["culprit", "scavenger", "addict", "edict"], "correct_answer": "addict", "explanation": "An addict is someone who is dependent on a substance or activity."}, {"question": "If a bird is searching for food in discarded waste, is it a culprit, scavenger, addict, or edict?", "options": ["culprit", "scavenger", "addict", "edict"], "correct_answer": "scavenger", "explanation": "A scavenger is an animal or person that searches for and feeds on discarded waste."}, {"question": "If a king issues a new law, is it a culprit, scavenger, addict, or edict?", "options": ["culprit", "scavenger", "addict", "edict"], "correct_answer": "edict", "explanation": "An edict is an official order or proclamation issued by a person in authority."}]}, {"id": 3, "stem": "It took me a while to regain my _______ after the ordeal.", "correct_index": 1, "options": [{"word": "esteem", "ipa": "/\u026a\u02c8sti\u02d0m/", "meanings": {"en": "Respect and admiration, typically for a person.", "cn": "\u5c0a\u91cd\u548c\u94a6\u4f69\uff0c\u901a\u5e38\u662f\u5bf9\u4eba\u7684\u3002"}, "usage_en": "Used to express high regard or respect for someone.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u67d0\u4eba\u7684\u9ad8\u5ea6\u5c0a\u91cd\u6216\u656c\u4f69\u3002", "scene_en": "A graduation ceremony where students are praised for their achievements.", "scene_cn": "\u4e00\u4e2a\u6bd5\u4e1a\u5178\u793c\uff0c\u5b66\u751f\u4eec\u56e0\u5176\u6210\u5c31\u800c\u53d7\u5230\u8d5e\u626c\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q3_esteem_1.png", "P6_vocabulary_exercises_17_Q3_esteem_2.png"], "examples": [{"en": "The community holds the doctor in high esteem for his selfless service.", "cn": "\u793e\u533a\u56e0\u533b\u751f\u65e0\u79c1\u7684\u670d\u52a1\u800c\u5bf9\u4ed6\u8bc4\u4ef7\u5f88\u9ad8\u3002"}, {"en": "She earned the esteem of her colleagues through her hard work and dedication.", "cn": "\u5979\u901a\u8fc7\u52aa\u529b\u5de5\u4f5c\u548c\u5949\u732e\u7cbe\u795e\u8d62\u5f97\u4e86\u540c\u4e8b\u4eec\u7684\u5c0a\u91cd\u3002"}]}, {"word": "composure", "ipa": "/k\u0259m\u02c8po\u028a\u0292\u0259r/", "meanings": {"en": "The state or feeling of being calm and in control of oneself.", "cn": "\u51b7\u9759\u548c\u63a7\u5236\u81ea\u6211\u7684\u72b6\u6001\u6216\u611f\u89c9\u3002"}, "usage_en": "Refers to maintaining calmness especially in a difficult situation.", "usage_cn": "\u6307\u5728\u56f0\u96be\u60c5\u51b5\u4e0b\u4fdd\u6301\u51b7\u9759\u3002", "scene_en": "A person taking deep breaths before public speaking to calm their nerves.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u516c\u5f00\u6f14\u8bb2\u524d\u6df1\u547c\u5438\u4ee5\u5e73\u9759\u795e\u7ecf\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q3_composure_1.png", "P6_vocabulary_exercises_17_Q3_composure_2.png"], "examples": [{"en": "Despite the pressure, she maintained her composure and delivered a great speech.", "cn": "\u5c3d\u7ba1\u6709\u538b\u529b\uff0c\u5979\u8fd8\u662f\u4fdd\u6301\u4e86\u9547\u5b9a\uff0c\u5e76\u53d1\u8868\u4e86\u7cbe\u5f69\u7684\u6f14\u8bb2\u3002"}, {"en": "It's important to maintain your composure during a crisis to think clearly.", "cn": "\u5728\u5371\u673a\u671f\u95f4\u4fdd\u6301\u51b7\u9759\u4ee5\u6e05\u6670\u601d\u8003\u975e\u5e38\u91cd\u8981\u3002"}]}, {"word": "status", "ipa": "/\u02c8ste\u026at\u0259s/", "meanings": {"en": "The relative social, professional, or other standing of someone or something.", "cn": "\u67d0\u4eba\u6216\u67d0\u7269\u7684\u76f8\u5bf9\u793e\u4f1a\u3001\u804c\u4e1a\u6216\u5176\u4ed6\u5730\u4f4d\u3002"}, "usage_en": "Indicates one's position or rank in a society or organization.", "usage_cn": "\u8868\u793a\u67d0\u4eba\u5728\u793e\u4f1a\u6216\u7ec4\u7ec7\u4e2d\u7684\u5730\u4f4d\u6216\u7b49\u7ea7\u3002", "scene_en": "A corporate ladder showing different levels of employees in a company.", "scene_cn": "\u4e00\u4e2a\u516c\u53f8\u9636\u68af\uff0c\u663e\u793a\u516c\u53f8\u4e2d\u4e0d\u540c\u7ea7\u522b\u7684\u5458\u5de5\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q3_status_1.png", "P6_vocabulary_exercises_17_Q3_status_2.png"], "examples": [{"en": "Achieving a higher status in the company required years of hard work and dedication.", "cn": "\u8981\u5728\u516c\u53f8\u4e2d\u83b7\u5f97\u66f4\u9ad8\u7684\u5730\u4f4d\uff0c\u9700\u8981\u591a\u5e74\u7684\u52aa\u529b\u548c\u5949\u732e\u3002"}, {"en": "Her social status improved after she became a successful entrepreneur in the city.", "cn": "\u5728\u5979\u6210\u4e3a\u57ce\u5e02\u91cc\u6210\u529f\u7684\u4f01\u4e1a\u5bb6\u4e4b\u540e\uff0c\u5979\u7684\u793e\u4f1a\u5730\u4f4d\u63d0\u9ad8\u4e86\u3002"}]}, {"word": "pride", "ipa": "/pra\u026ad/", "meanings": {"en": "A feeling of deep pleasure or satisfaction derived from one's own achievements.", "cn": "\u56e0\u81ea\u5df1\u7684\u6210\u5c31\u800c\u4ea7\u751f\u7684\u6df1\u6df1\u7684\u5feb\u4e50\u6216\u6ee1\u8db3\u611f\u3002"}, "usage_en": "Expresses a sense of accomplishment or satisfaction in one's achievements.", "usage_cn": "\u8868\u8fbe\u5bf9\u81ea\u5df1\u7684\u6210\u5c31\u7684\u6210\u5c31\u611f\u6216\u6ee1\u8db3\u611f\u3002", "scene_en": "A parent watching their child graduate with a sense of accomplishment.", "scene_cn": "\u7236\u6bcd\u770b\u7740\u5b69\u5b50\u6bd5\u4e1a\uff0c\u5fc3\u4e2d\u5145\u6ee1\u6210\u5c31\u611f\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q3_pride_1.png", "P6_vocabulary_exercises_17_Q3_pride_2.png"], "examples": [{"en": "She felt a great sense of pride when she received her diploma at graduation.", "cn": "\u5f53\u5979\u5728\u6bd5\u4e1a\u5178\u793c\u4e0a\u83b7\u5f97\u6587\u51ed\u65f6\uff0c\u5979\u611f\u5230\u975e\u5e38\u81ea\u8c6a\u3002"}, {"en": "He took pride in his work, always striving to deliver the best possible results.", "cn": "\u4ed6\u4ee5\u81ea\u5df1\u7684\u5de5\u4f5c\u4e3a\u8363\uff0c\u603b\u662f\u52aa\u529b\u63d0\u4f9b\u6700\u597d\u7684\u7ed3\u679c\u3002"}]}], "synonym_cn": "\u51b7\u9759\uff0c\u9547\u5b9a\uff0c\u81ea\u5236\u529b", "socratic_questions": [{"question": "After failing an important exam, which helps you face your parents?", "options": ["esteem", "composure", "status", "pride"], "correct_answer": "composure", "explanation": "Composure allows you to face difficult situations calmly."}, {"question": "Which word describes how highly you think of yourself and your abilities?", "options": ["esteem", "composure", "status", "pride"], "correct_answer": "esteem", "explanation": "Esteem reflects your self-respect and confidence."}, {"question": "Which word describes the respect or importance given to someone or something?", "options": ["esteem", "composure", "status", "pride"], "correct_answer": "status", "explanation": "Status refers to one's social or professional standing."}, {"question": "Which word describes a feeling of deep pleasure or satisfaction derived from one's achievements?", "options": ["esteem", "composure", "status", "pride"], "correct_answer": "pride", "explanation": "Pride is a sense of accomplishment and self-worth."}]}, {"id": 4, "stem": "He _______ that he will become his own boss one day.", "correct_index": 0, "options": [{"word": "envisions", "ipa": "/\u026an\u02c8v\u026a\u0292\u0259nz/", "meanings": {"en": "To imagine as a future possibility; to visualize.", "cn": "\u60f3\u8c61\u4e3a\u672a\u6765\u7684\u4e00\u79cd\u53ef\u80fd\u6027\uff1b\u8bbe\u60f3\uff0c\u9884\u89c1\u3002"}, "usage_en": "Used when describing a desired future or a planned outcome.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u671f\u671b\u7684\u672a\u6765\u6216\u8ba1\u5212\u7684\u7ed3\u679c\u3002", "scene_en": "A person sitting at a desk, eyes closed, a faint image of a successful business appearing above their head.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u5b50\u65c1\uff0c\u95ed\u7740\u773c\u775b\uff0c\u4ed6\u4eec\u5934\u9876\u4e0a\u6d6e\u73b0\u51fa\u4e00\u4e2a\u6210\u529f\u7684\u4f01\u4e1a\u7684\u6de1\u6de1\u5f71\u50cf\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q4_envisions_1.png", "P6_vocabulary_exercises_17_Q4_envisions_2.png"], "examples": [{"en": "She envisions a world where renewable energy powers every home and business efficiently.", "cn": "\u5979\u8bbe\u60f3\u4e00\u4e2a\u53ef\u518d\u751f\u80fd\u6e90\u80fd\u591f\u9ad8\u6548\u5730\u4e3a\u6bcf\u4e2a\u5bb6\u5ead\u548c\u4f01\u4e1a\u63d0\u4f9b\u52a8\u529b\u7684\u4e16\u754c\u3002"}, {"en": "The architect envisions a building that blends seamlessly with the natural landscape around it.", "cn": "\u5efa\u7b51\u5e08\u8bbe\u60f3\u4e00\u5ea7\u4e0e\u5468\u56f4\u81ea\u7136\u666f\u89c2\u5b8c\u7f8e\u878d\u5408\u7684\u5efa\u7b51\u3002"}]}, {"word": "perceives", "ipa": "/p\u0259r\u02c8si\u02d0vz/", "meanings": {"en": "To become aware of something through the senses; to understand or interpret.", "cn": "\u901a\u8fc7\u611f\u5b98\u610f\u8bc6\u5230\u67d0\u4e8b\uff1b\u7406\u89e3\u6216\u89e3\u91ca\u3002"}, "usage_en": "Used when describing how someone understands or interprets information.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4eba\u5982\u4f55\u7406\u89e3\u6216\u89e3\u91ca\u4fe1\u606f\u3002", "scene_en": "A detective examining a crime scene, noticing small details that others might miss.", "scene_cn": "\u4e00\u540d\u4fa6\u63a2\u6b63\u5728\u68c0\u67e5\u72af\u7f6a\u73b0\u573a\uff0c\u6ce8\u610f\u5230\u5176\u4ed6\u4eba\u53ef\u80fd\u5ffd\u7565\u7684\u5fae\u5c0f\u7ec6\u8282\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q4_perceives_1.png", "P6_vocabulary_exercises_17_Q4_perceives_2.png"], "examples": [{"en": "The audience perceives the actor's subtle gestures as signs of deep inner turmoil.", "cn": "\u89c2\u4f17\u5c06\u6f14\u5458\u5fae\u5999\u7684\u624b\u52bf\u89c6\u4e3a\u5185\u5fc3\u6df1\u5904\u52a8\u8361\u7684\u8ff9\u8c61\u3002"}, {"en": "He perceives a shift in the market trends, indicating a need for innovative strategies.", "cn": "\u4ed6\u5bdf\u89c9\u5230\u5e02\u573a\u8d8b\u52bf\u7684\u53d8\u5316\uff0c\u8868\u660e\u9700\u8981\u521b\u65b0\u7b56\u7565\u3002"}]}, {"word": "presumes", "ipa": "/pr\u026a\u02c8zju\u02d0mz/", "meanings": {"en": "To suppose that something is the case on the basis of probability; to take for granted.", "cn": "\u6839\u636e\u53ef\u80fd\u6027\u5047\u8bbe\u67d0\u4e8b\u662f\u771f\u5b9e\u7684\uff1b\u8ba4\u4e3a...\u662f\u7406\u6240\u5f53\u7136\u7684\u3002"}, "usage_en": "Used when describing an assumption made without concrete evidence.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u6ca1\u6709\u5177\u4f53\u8bc1\u636e\u7684\u60c5\u51b5\u4e0b\u505a\u51fa\u7684\u5047\u8bbe\u3002", "scene_en": "A person making a quick judgment based on incomplete information, leading to a misunderstanding.", "scene_cn": "\u4e00\u4e2a\u4eba\u6839\u636e\u4e0d\u5b8c\u6574\u7684\u4fe1\u606f\u505a\u51fa\u5feb\u901f\u5224\u65ad\uff0c\u5bfc\u81f4\u8bef\u89e3\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q4_presumes_1.png", "P6_vocabulary_exercises_17_Q4_presumes_2.png"], "examples": [{"en": "The teacher presumes that all students have completed the reading assignment before the class.", "cn": "\u8001\u5e08\u8ba4\u4e3a\u6240\u6709\u5b66\u751f\u5728\u4e0a\u8bfe\u524d\u90fd\u5b8c\u6210\u4e86\u9605\u8bfb\u4f5c\u4e1a\u3002"}, {"en": "She presumes that her friend will be late, as it has happened consistently in the past.", "cn": "\u5979\u8ba4\u4e3a\u5979\u7684\u670b\u53cb\u4f1a\u8fdf\u5230\uff0c\u56e0\u4e3a\u8fc7\u53bb\u4e00\u76f4\u5982\u6b64\u3002"}]}, {"word": "foretells", "ipa": "/f\u0254\u02d0r\u02c8t\u025blz/", "meanings": {"en": "To predict the future; to indicate something in advance.", "cn": "\u9884\u6d4b\u672a\u6765\uff1b\u63d0\u524d\u9884\u793a\u67d0\u4e8b\u3002"}, "usage_en": "Used when describing predictions, prophecies, or indications of future events.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u9884\u6d4b\u3001\u9884\u8a00\u6216\u672a\u6765\u4e8b\u4ef6\u7684\u9884\u5146\u3002", "scene_en": "A fortune teller reading tarot cards, with symbols of future events appearing in the background.", "scene_cn": "\u4e00\u4f4d\u7b97\u547d\u5148\u751f\u6b63\u5728\u9605\u8bfb\u5854\u7f57\u724c\uff0c\u80cc\u666f\u4e2d\u6d6e\u73b0\u51fa\u672a\u6765\u4e8b\u4ef6\u7684\u8c61\u5f81\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q4_foretells_1.png", "P6_vocabulary_exercises_17_Q4_foretells_2.png"], "examples": [{"en": "The ancient prophecy foretells a great flood that will reshape the entire landscape dramatically.", "cn": "\u53e4\u8001\u7684\u9884\u8a00\u9884\u793a\u7740\u4e00\u573a\u5de8\u5927\u7684\u6d2a\u6c34\u5c06\u5f7b\u5e95\u6539\u53d8\u6574\u4e2a\u5730\u8c8c\u3002"}, {"en": "Economic indicators foretell a period of significant growth in the technology sector next year.", "cn": "\u7ecf\u6d4e\u6307\u6807\u9884\u793a\u7740\u660e\u5e74\u79d1\u6280\u9886\u57df\u5c06\u51fa\u73b0\u663e\u8457\u589e\u957f\u3002"}]}], "synonym_cn": "\u8bbe\u60f3\uff0c\u9884\u89c1\uff0c\u5047\u5b9a\uff0c\u9884\u6d4b (\u7740\u91cd\u4e8e\u4e3b\u89c2\u6027\u548c\u786e\u5b9a\u6027\u7a0b\u5ea6\u7684\u6bd4\u8f83)", "socratic_questions": [{"question": "If you are starting a new business, do you merely _______ success, or do you actively plan for it?", "options": ["presumes", "envisions", "foretells", "perceives"], "correct_answer": "envisions", "explanation": "Envisions implies a detailed mental picture and plan, more active than presuming."}, {"question": "When a detective _______ subtle clues at a crime scene, what skill is being demonstrated?", "options": ["foretells", "envisions", "perceives", "presumes"], "correct_answer": "perceives", "explanation": "Perceives means to become aware of something through the senses, especially subtle details."}, {"question": "If someone _______ that their investment will double in a year without any evidence, what are they doing?", "options": ["envisions", "foretells", "presumes", "perceives"], "correct_answer": "presumes", "explanation": "Presumes suggests taking something for granted without proof or solid evidence."}, {"question": "If a fortune teller _______ the future using tarot cards, what method are they employing?", "options": ["perceives", "presumes", "envisions", "foretells"], "correct_answer": "foretells", "explanation": "Foretells means to predict the future, often through supernatural or insightful means."}]}, {"id": 5, "stem": "I am in a _______ and do not know what to do as I do not want to hurt anyone.", "correct_index": 0, "options": [{"word": "dilemma", "ipa": "/d\u026a\u02c8lem\u0259/", "meanings": {"en": "A situation in which a difficult choice has to be made between two or more alternatives.", "cn": "\u5fc5\u987b\u5728\u4e24\u4e2a\u6216\u591a\u4e2a\u9009\u62e9\u4e4b\u95f4\u505a\u51fa\u8270\u96be\u9009\u62e9\u7684\u60c5\u51b5\u3002"}, "usage_en": "Used to describe a difficult choice or problem.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u4e2a\u8270\u96be\u7684\u9009\u62e9\u6216\u95ee\u9898\u3002", "scene_en": "A person standing at a fork in the road, looking uncertain.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u5c94\u8def\u53e3\uff0c\u770b\u8d77\u6765\u4e0d\u786e\u5b9a\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q5_dilemma_1.png", "P6_vocabulary_exercises_17_Q5_dilemma_2.png"], "examples": [{"en": "The company faced a serious dilemma: cut costs or risk going out of business.", "cn": "\u516c\u53f8\u9762\u4e34\u7740\u4e00\u4e2a\u4e25\u5cfb\u7684\u56f0\u5883\uff1a\u524a\u51cf\u6210\u672c\u6216\u9762\u4e34\u5012\u95ed\u7684\u98ce\u9669\u3002"}, {"en": "I'm in a real dilemma about whether to accept the new job offer.", "cn": "\u6211\u662f\u5426\u5e94\u8be5\u63a5\u53d7\u65b0\u7684\u5de5\u4f5c\u9080\u8bf7\uff0c\u6211\u6b63\u5904\u4e8e\u771f\u6b63\u7684\u4e24\u96be\u5883\u5730\u3002"}]}, {"word": "confusion", "ipa": "/k\u0259n\u02c8fju\u02d0\u0292\u0259n/", "meanings": {"en": "The state of being bewildered or unclear in one's mind about something.", "cn": "\u5bf9\u67d0\u4e8b\u611f\u5230\u56f0\u60d1\u6216\u4e0d\u6e05\u695a\u7684\u72b6\u6001\u3002"}, "usage_en": "Describes a state of uncertainty or lack of understanding.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u4e0d\u786e\u5b9a\u6216\u7f3a\u4e4f\u7406\u89e3\u7684\u72b6\u6001\u3002", "scene_en": "A person with a question mark above their head, looking puzzled.", "scene_cn": "\u4e00\u4e2a\u4eba\u5934\u4e0a\u6709\u4e00\u4e2a\u95ee\u53f7\uff0c\u770b\u8d77\u6765\u5f88\u56f0\u60d1\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q5_confusion_1.png", "P6_vocabulary_exercises_17_Q5_confusion_2.png"], "examples": [{"en": "There was a lot of confusion about the new policy changes at the company.", "cn": "\u5173\u4e8e\u516c\u53f8\u65b0\u653f\u7b56\u7684\u53d8\u5316\u6709\u5f88\u591a\u56f0\u60d1\u3002"}, {"en": "The sudden change in plans caused a great deal of confusion among the travelers.", "cn": "\u8ba1\u5212\u7684\u7a81\u7136\u6539\u53d8\u7ed9\u65c5\u5ba2\u4eec\u5e26\u6765\u4e86\u6781\u5927\u7684\u56f0\u60d1\u3002"}]}, {"word": "state", "ipa": "/ste\u026at/", "meanings": {"en": "The condition of something at a particular time.", "cn": "\u67d0\u4e8b\u7269\u5728\u7279\u5b9a\u65f6\u95f4\u7684\u72b6\u6001\u3002"}, "usage_en": "Used to describe the condition or situation of something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u7269\u7684\u72b6\u51b5\u6216\u60c5\u51b5\u3002", "scene_en": "A graph showing the state of the economy over time.", "scene_cn": "\u4e00\u5f20\u663e\u793a\u7ecf\u6d4e\u968f\u65f6\u95f4\u53d8\u5316\u7684\u72b6\u6001\u7684\u56fe\u8868\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q5_state_1.png", "P6_vocabulary_exercises_17_Q5_state_2.png"], "examples": [{"en": "The state of the economy is improving, with unemployment rates steadily decreasing now.", "cn": "\u7ecf\u6d4e\u72b6\u51b5\u6b63\u5728\u6539\u5584\uff0c\u5931\u4e1a\u7387\u7a33\u6b65\u4e0b\u964d\u3002"}, {"en": "The building was in a poor state of repair after the severe storm passed through.", "cn": "\u5728\u5f3a\u98ce\u66b4\u8fc7\u540e\uff0c\u8fd9\u5ea7\u5efa\u7b51\u7684\u7ef4\u4fee\u72b6\u51b5\u5f88\u5dee\u3002"}]}, {"word": "situation", "ipa": "/\u02ccs\u026at\u0283u\u02c8e\u026a\u0283\u0259n/", "meanings": {"en": "A set of circumstances in which one finds oneself; a state of affairs.", "cn": "\u4e00\u4e2a\u4eba\u53d1\u73b0\u81ea\u5df1\u6240\u5904\u7684\u4e00\u7cfb\u5217\u73af\u5883\uff1b\u4e00\u79cd\u4e8b\u6001\u3002"}, "usage_en": "Refers to a specific set of circumstances or conditions.", "usage_cn": "\u6307\u7279\u5b9a\u7684\u73af\u5883\u6216\u6761\u4ef6\u3002", "scene_en": "A group of people discussing a problem around a table.", "scene_cn": "\u4e00\u7fa4\u4eba\u56f4\u5750\u5728\u684c\u65c1\u8ba8\u8bba\u95ee\u9898\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q5_situation_1.png", "P6_vocabulary_exercises_17_Q5_situation_2.png"], "examples": [{"en": "The current economic situation is challenging for many small businesses in the area.", "cn": "\u76ee\u524d\u7684\u7ecf\u6d4e\u5f62\u52bf\u5bf9\u8be5\u5730\u533a\u7684\u8bb8\u591a\u5c0f\u4f01\u4e1a\u6765\u8bf4\u90fd\u662f\u4e00\u4e2a\u6311\u6218\u3002"}, {"en": "It's a difficult situation, but we need to find a solution that works for everyone.", "cn": "\u8fd9\u662f\u4e00\u4e2a\u56f0\u96be\u7684\u5c40\u9762\uff0c\u4f46\u6211\u4eec\u9700\u8981\u627e\u5230\u4e00\u4e2a\u5bf9\u6bcf\u4e2a\u4eba\u90fd\u6709\u6548\u7684\u89e3\u51b3\u65b9\u6848\u3002"}]}], "synonym_cn": "\u56f0\u5883 vs \u56f0\u60d1 vs \u72b6\u6001 vs \u60c5\u51b5", "socratic_questions": [{"question": "Imagine you're facing a tough choice with no easy way out. Which word describes this best?", "options": ["dilemma", "confusion", "state", "situation"], "correct_answer": "dilemma", "explanation": "A dilemma is a situation where you have to choose between two or more difficult options."}, {"question": "You're lost in a new city, unsure of where to go or what to do. Which word captures your feeling?", "options": ["dilemma", "confusion", "state", "situation"], "correct_answer": "confusion", "explanation": "Confusion is the state of being bewildered or unclear in one's mind about something."}, {"question": "Consider the economy of a country at a particular time. Which word best describes its condition?", "options": ["dilemma", "confusion", "state", "situation"], "correct_answer": "state", "explanation": "State refers to the condition of something at a particular time."}, {"question": "Think about being in a job interview. Which word describes the overall setting you are in?", "options": ["dilemma", "confusion", "state", "situation"], "correct_answer": "situation", "explanation": "Situation refers to a set of circumstances in which one finds oneself."}]}, {"id": 6, "stem": "As Gina was not feeling well, the teacher gave her _______ to go home.", "correct_index": 2, "options": [{"word": "allowance", "ipa": "/\u0259\u02c8la\u028a\u0259ns/", "meanings": {"en": "A sum of money given regularly to a person, typically a child.", "cn": "\u5b9a\u671f\u7ed9\u67d0\u4eba\uff08\u901a\u5e38\u662f\u5b69\u5b50\uff09\u7684\u4e00\u7b14\u94b1\u3002"}, "usage_en": "Used to describe a regular payment, often to children.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5b9a\u671f\u652f\u4ed8\u7684\u6b3e\u9879\uff0c\u901a\u5e38\u662f\u7ed9\u5b69\u5b50\u7684\u3002", "scene_en": "A child receiving money from their parent.", "scene_cn": "\u5b69\u5b50\u4ece\u7236\u6bcd\u90a3\u91cc\u6536\u5230\u94b1\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q6_allowance_1.png", "P6_vocabulary_exercises_17_Q6_allowance_2.png"], "examples": [{"en": "My daughter gets a weekly allowance of $10 to spend as she wishes.", "cn": "\u6211\u5973\u513f\u6bcf\u5468\u5f97\u523010\u7f8e\u5143\u7684\u96f6\u7528\u94b1\uff0c\u53ef\u4ee5\u968f\u610f\u652f\u914d\u3002"}, {"en": "The student's allowance helps them learn to manage their own money responsibly.", "cn": "\u5b66\u751f\u7684\u96f6\u7528\u94b1\u5e2e\u52a9\u4ed6\u4eec\u5b66\u4e60\u8d1f\u8d23\u4efb\u5730\u7ba1\u7406\u81ea\u5df1\u7684\u94b1\u3002"}]}, {"word": "license", "ipa": "/\u02c8la\u026asns/", "meanings": {"en": "A permit from an authority to own or use something, do a particular thing, or carry on a trade.", "cn": "\u83b7\u5f97\u5f53\u5c40\u7684\u8bb8\u53ef\uff0c\u4ee5\u62e5\u6709\u6216\u4f7f\u7528\u67d0\u7269\u3001\u505a\u67d0\u4e8b\u6216\u8fdb\u884c\u4ea4\u6613\u3002"}, "usage_en": "Used to describe official permission to do something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u505a\u67d0\u4e8b\u7684\u5b98\u65b9\u8bb8\u53ef\u3002", "scene_en": "A person holding up their driver's license.", "scene_cn": "\u4e00\u4e2a\u4eba\u4e3e\u8d77\u4ed6\u4eec\u7684\u9a7e\u9a76\u6267\u7167\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q6_license_1.png", "P6_vocabulary_exercises_17_Q6_license_2.png"], "examples": [{"en": "You need a fishing license to fish in this lake legally and responsibly.", "cn": "\u4f60\u9700\u8981\u9493\u9c7c\u8bb8\u53ef\u8bc1\u624d\u80fd\u5728\u8fd9\u4e2a\u6e56\u91cc\u5408\u6cd5\u548c\u8d1f\u8d23\u4efb\u5730\u9493\u9c7c\u3002"}, {"en": "She obtained her driver's license after passing the driving test successfully and confidently.", "cn": "\u5979\u901a\u8fc7\u9a7e\u9a76\u8003\u8bd5\u540e\u6210\u529f\u5e76\u81ea\u4fe1\u5730\u83b7\u5f97\u4e86\u9a7e\u9a76\u6267\u7167\u3002"}]}, {"word": "permission", "ipa": "/p\u0259r\u02c8m\u026a\u0283n/", "meanings": {"en": "The action of officially allowing someone to do something; consent or authorization.", "cn": "\u6b63\u5f0f\u5141\u8bb8\u67d0\u4eba\u505a\u67d0\u4e8b\u7684\u884c\u4e3a\uff1b\u540c\u610f\u6216\u6388\u6743\u3002"}, "usage_en": "Used to describe formal consent to do something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u505a\u67d0\u4e8b\u7684\u6b63\u5f0f\u540c\u610f\u3002", "scene_en": "A teacher giving a student permission to leave the classroom.", "scene_cn": "\u8001\u5e08\u5141\u8bb8\u5b66\u751f\u79bb\u5f00\u6559\u5ba4\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q6_permission_1.png", "P6_vocabulary_exercises_17_Q6_permission_2.png"], "examples": [{"en": "You need to ask for permission before using someone else's personal belongings, always.", "cn": "\u5728\u4f7f\u7528\u522b\u4eba\u7684\u79c1\u4eba\u7269\u54c1\u4e4b\u524d\uff0c\u4f60\u9700\u8981\u5f81\u5f97\u8bb8\u53ef\uff0c\u59cb\u7ec8\u5982\u6b64\u3002"}, {"en": "The teacher granted the student permission to present their project on Friday afternoon.", "cn": "\u8001\u5e08\u5141\u8bb8\u5b66\u751f\u5728\u5468\u4e94\u4e0b\u5348\u5c55\u793a\u4ed6\u4eec\u7684\u9879\u76ee\u3002"}]}, {"word": "excuse", "ipa": "/\u026ak\u02c8skju\u02d0s/", "meanings": {"en": "A reason or explanation put forward to defend or justify a fault or offense.", "cn": "\u4e3a\u8fa9\u62a4\u6216\u8bc1\u660e\u9519\u8bef\u6216\u5192\u72af\u884c\u4e3a\u800c\u63d0\u51fa\u7684\u7406\u7531\u6216\u89e3\u91ca\u3002"}, "usage_en": "Used to justify a fault or offense.", "usage_cn": "\u7528\u4e8e\u8bc1\u660e\u9519\u8bef\u6216\u5192\u72af\u884c\u4e3a\u662f\u6b63\u5f53\u7684\u3002", "scene_en": "A student giving the teacher an excuse for being late.", "scene_cn": "\u5b66\u751f\u5411\u8001\u5e08\u89e3\u91ca\u8fdf\u5230\u7684\u539f\u56e0\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q6_excuse_1.png", "P6_vocabulary_exercises_17_Q6_excuse_2.png"], "examples": [{"en": "He made up an elaborate excuse for not completing his assigned homework on time.", "cn": "\u4ed6\u7f16\u9020\u4e86\u4e00\u4e2a\u8be6\u5c3d\u7684\u501f\u53e3\uff0c\u4e3a\u6ca1\u6709\u6309\u65f6\u5b8c\u6210\u4f5c\u4e1a\u8fa9\u89e3\u3002"}, {"en": "Her excuse for missing the meeting was that she had a prior family commitment.", "cn": "\u5979\u7f3a\u5e2d\u4f1a\u8bae\u7684\u7406\u7531\u662f\u5979\u4e4b\u524d\u6709\u5bb6\u5ead\u4e8b\u52a1\u3002"}]}], "synonym_cn": "\u5141\u8bb8 (yun xu), \u8bb8\u53ef (xu ke), \u51c6\u8bb8 (zhun xu)", 7126\u70b9\u6e05\u6670\u7684\u7167\u7247\uff0c\u7ec6\u8282\u6e05\u6670\u53ef\u89c1\uff1b\u4e00\u4f4d\u53e3\u9f7f\u6e05\u6670\u7684\u6f14\u8bb2\u8005\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q8_Distinctly_1.png", "P6_vocabulary_exercises_17_Q8_Distinctly_2.png"], "examples": [{"en": "I distinctly remember her saying she would be late to the meeting today.", "cn": "\u6211\u6e05\u695a\u5730\u8bb0\u5f97\u5979\u8bf4\u5979\u4eca\u5929\u5f00\u4f1a\u8981\u8fdf\u5230\u3002"}, {"en": "The aroma of spices was distinctly present in the air, a very pleasant smell.", "cn": "\u7a7a\u6c14\u4e2d\u660e\u663e\u5f25\u6f2b\u7740\u9999\u6599\u7684\u9999\u5473\uff0c\u4e00\u79cd\u975e\u5e38\u4ee4\u4eba\u6109\u60a6\u7684\u6c14\u5473\u3002"}]}, {"word": "Obviously", "ipa": "/\u02c8\u0252bvi\u0259sli/", "meanings": {"en": "In a way that is easily perceived or understood; clearly.", "cn": "\u4ee5\u4e00\u79cd\u5bb9\u6613\u5bdf\u89c9\u6216\u7406\u89e3\u7684\u65b9\u5f0f\uff1b\u6e05\u6670\u5730\u3002"}, "usage_en": "Used to indicate that something is easily understood or apparent.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u67d0\u4e8b\u5bb9\u6613\u7406\u89e3\u6216\u663e\u800c\u6613\u89c1\u3002", "scene_en": "A situation where the solution to a problem is immediately apparent; a person expressing a clear emotion.", "scene_cn": "\u95ee\u9898\u89e3\u51b3\u65b9\u6848\u7acb\u5373\u663e\u73b0\u7684\u60c5\u51b5\uff1b\u4e00\u4e2a\u4eba\u8868\u8fbe\u6e05\u6670\u7684\u60c5\u7eea\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q8_Obviously_1.png", "P6_vocabulary_exercises_17_Q8_Obviously_2.png"], "examples": [{"en": "Obviously, studying hard is essential if you want to pass the final examination.", "cn": "\u663e\u7136\uff0c\u5982\u679c\u4f60\u60f3\u901a\u8fc7\u671f\u672b\u8003\u8bd5\uff0c\u52aa\u529b\u5b66\u4e60\u662f\u5fc5\u4e0d\u53ef\u5c11\u7684\u3002"}, {"en": "She was obviously upset by the news, as tears started to well up in her eyes.", "cn": "\u5979\u663e\u7136\u5bf9\u8fd9\u4e2a\u6d88\u606f\u611f\u5230\u4e0d\u5b89\uff0c\u56e0\u4e3a\u773c\u6cea\u5f00\u59cb\u5728\u5979\u773c\u4e2d\u6d8c\u51fa\u3002"}]}, {"word": "Quietly", "ipa": "/\u02c8kwa\u026a\u0259tli/", "meanings": {"en": "In a manner that makes little or no noise; without attracting attention.", "cn": "\u4ee5\u4e00\u79cd\u53d1\u51fa\u5f88\u5c11\u6216\u6ca1\u6709\u566a\u97f3\u7684\u65b9\u5f0f\uff1b\u4e0d\u5f15\u8d77\u6ce8\u610f\u3002"}, "usage_en": "Used to describe actions done without making much noise or drawing attention.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u4e0d\u53d1\u51fa\u592a\u591a\u566a\u97f3\u6216\u5f15\u8d77\u6ce8\u610f\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u7684\u52a8\u4f5c\u3002", "scene_en": "A library with people reading silently; a cat sneaking through a room.", "scene_cn": "\u4e00\u4e2a\u4eba\u4eec\u5b89\u9759\u9605\u8bfb\u7684\u56fe\u4e66\u9986\uff1b\u4e00\u53ea\u732b\u5077\u5077\u7a7f\u8fc7\u623f\u95f4\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q8_Quietly_1.png", "P6_vocabulary_exercises_17_Q8_Quietly_2.png"], "examples": [{"en": "She quietly closed the door so as not to wake the sleeping baby upstairs now.", "cn": "\u5979\u6084\u6084\u5730\u5173\u4e0a\u95e8\uff0c\u4ee5\u514d\u5435\u9192\u697c\u4e0a\u6b63\u5728\u7761\u89c9\u7684\u5a74\u513f\u3002"}, {"en": "He quietly slipped the note under the door, hoping she would find it soon.", "cn": "\u4ed6\u6084\u6084\u5730\u628a\u7eb8\u6761\u585e\u5230\u95e8\u4e0b\uff0c\u5e0c\u671b\u5979\u80fd\u5c3d\u5feb\u627e\u5230\u5b83\u3002"}]}, {"word": "Soundly", "ipa": "/\u02c8sa\u028andli/", "meanings": {"en": "Deeply and peacefully; thoroughly and completely.", "cn": "\u6df1\u6df1\u5730\u4e14\u5e73\u9759\u5730\uff1b\u5f7b\u5e95\u4e14\u5b8c\u5168\u5730\u3002"}, "usage_en": "Used to describe sleeping deeply or doing something thoroughly.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7761\u5f97\u5f88\u6df1\u6216\u5f7b\u5e95\u5730\u505a\u67d0\u4e8b\u3002", "scene_en": "A person sleeping deeply in a comfortable bed; a task completed with great care.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u8212\u9002\u7684\u5e8a\u4e0a\u7761\u5f97\u5f88\u9999\uff1b\u4e00\u9879\u975e\u5e38\u4ed4\u7ec6\u5b8c\u6210\u7684\u4efb\u52a1\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q8_Soundly_1.png", "P6_vocabulary_exercises_17_Q8_Soundly_2.png"], "examples": [{"en": "After a long day of hiking, he slept soundly through the entire night peacefully.", "cn": "\u7ecf\u8fc7\u4e00\u5929\u7684\u5f92\u6b65\u65c5\u884c\u540e\uff0c\u4ed6\u6574\u4e2a\u665a\u4e0a\u90fd\u7761\u5f97\u5f88\u9999\u3002"}, {"en": "The proposal was soundly defeated in the vote, showing a clear lack of support.", "cn": "\u8be5\u63d0\u6848\u5728\u6295\u7968\u4e2d\u88ab\u5f7b\u5e95\u5426\u51b3\uff0c\u8868\u660e\u660e\u663e\u7f3a\u4e4f\u652f\u6301\u3002"}]}], "synonym_cn": "\u6084\u6084\u5730 vs. \u660e\u663e\u5730 vs. \u6e05\u6670\u5730 vs. \u5b89\u7a33\u5730", "socratic_questions": [{"question": "If someone wants to avoid being noticed when leaving a meeting, should they leave  _______?", "options": ["Distinctly", "Obviously", "Quietly", "Soundly"], "correct_answer": "Quietly", "explanation": "\"Quietly\" implies a lack of noise or attention, fitting the scenario of avoiding notice."}, {"question": "If a conclusion is reached without any doubt or ambiguity, was it reached  _______?", "options": ["Distinctly", "Obviously", "Quietly", "Soundly"], "correct_answer": "Obviously", "explanation": "\"Obviously\" suggests something is easily perceived or understood without question."}, {"question": "If a speaker articulates each word with precision and clarity, do they speak  _______?", "options": ["Distinctly", "Obviously", "Quietly", "Soundly"], "correct_answer": "Distinctly", "explanation": "\"Distinctly\" means clearly and recognizably, fitting the description of precise articulation."}, {"question": "If someone sleeps deeply and without disturbance, do they sleep  _______?", "options": ["Distinctly", "Obviously", "Quietly", "Soundly"], "correct_answer": "Soundly", "explanation": "\"Soundly\" implies a deep and undisturbed sleep."}]}, {"id": 9, "stem": "I can still remember my childhood days _______.", "correct_index": 3, "options": [{"word": "visibly", "ipa": "/\u02c8v\u026az\u026abli/", "meanings": {"en": "in a way that can be seen or noticed.", "cn": "\u4ee5\u4e00\u79cd\u53ef\u4ee5\u88ab\u770b\u5230\u6216\u6ce8\u610f\u5230\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes something easily seen or apparent.", "usage_cn": "\u63cf\u8ff0\u5bb9\u6613\u770b\u5230\u6216\u663e\u800c\u6613\u89c1\u7684\u4e8b\u7269\u3002", "scene_en": "A bright sign is visibly displayed on a store front.", "scene_cn": "\u4e00\u4e2a\u660e\u4eae\u7684\u6807\u5fd7\u660e\u663e\u5730\u5c55\u793a\u5728\u5e97\u9762\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q9_visibly_1.png", "P6_vocabulary_exercises_17_Q9_visibly_2.png"], "examples": [{"en": "The relief on her face was visibly apparent after receiving the good news.", "cn": "\u6536\u5230\u597d\u6d88\u606f\u540e\uff0c\u5979\u8138\u4e0a\u7684\u6b23\u6170\u4e4b\u60c5\u663e\u800c\u6613\u89c1\u3002"}, {"en": "The damage to the car was visibly noticeable, requiring immediate repairs and attention.", "cn": "\u6c7d\u8f66\u7684\u635f\u574f\u6e05\u6670\u53ef\u89c1\uff0c\u9700\u8981\u7acb\u5373\u7ef4\u4fee\u548c\u6ce8\u610f\u3002"}]}, {"word": "variably", "ipa": "/\u02c8ve\u0259ri\u0259bli/", "meanings": {"en": "in a way that is subject to change or variation; not consistently.", "cn": "\u4ee5\u4e00\u79cd\u6613\u4e8e\u6539\u53d8\u6216\u53d8\u5316\u7684\u65b9\u5f0f\uff1b\u4e0d\u4e00\u81f4\u5730\u3002"}, "usage_en": "Describes something that changes or varies.", "usage_cn": "\u63cf\u8ff0\u53d8\u5316\u6216\u53d8\u5f02\u7684\u4e8b\u7269\u3002", "scene_en": "The weather changes variably throughout the day, from sun to rain.", "scene_cn": "\u5929\u6c14\u5728\u4e00\u5929\u4e2d\u53d8\u5316\u4e0d\u5b9a\uff0c\u4ece\u6674\u5929\u5230\u4e0b\u96e8\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q9_variably_1.png", "P6_vocabulary_exercises_17_Q9_variably_2.png"], "examples": [{"en": "The plant's growth rate changed variably depending on the amount of sunlight it received daily.", "cn": "\u690d\u7269\u7684\u751f\u957f\u901f\u5ea6\u53d8\u5316\u4e0d\u5b9a\uff0c\u53d6\u51b3\u4e8e\u5b83\u6bcf\u5929\u63a5\u6536\u5230\u7684\u9633\u5149\u91cf\u3002"}, {"en": "The price of stocks can change variably, influenced by market trends and economic conditions.", "cn": "\u80a1\u7968\u7684\u4ef7\u683c\u53ef\u80fd\u4f1a\u53d1\u751f\u53d8\u5316\uff0c\u53d7\u5e02\u573a\u8d8b\u52bf\u548c\u7ecf\u6d4e\u72b6\u51b5\u7684\u5f71\u54cd\u3002"}]}, {"word": "virtually", "ipa": "/\u02c8v\u025c\u02d0rt\u0283u\u0259li/", "meanings": {"en": "nearly or almost; also, by means of virtual reality technology.", "cn": "\u51e0\u4e4e\u6216\u5dee\u4e0d\u591a\uff1b\u4e5f\u6307\u901a\u8fc7\u865a\u62df\u73b0\u5b9e\u6280\u672f\u3002"}, "usage_en": "Describes something that is almost true or done using technology.", "usage_cn": "\u63cf\u8ff0\u51e0\u4e4e\u4e3a\u771f\u7684\u4e8b\u7269\u6216\u4f7f\u7528\u6280\u672f\u5b8c\u6210\u7684\u4e8b\u7269\u3002", "scene_en": "A student attends a class virtually through an online video call.", "scene_cn": "\u5b66\u751f\u901a\u8fc7\u5728\u7ebf\u89c6\u9891\u901a\u8bdd\u53c2\u52a0\u865a\u62df\u8bfe\u7a0b\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q9_virtually_1.png", "P6_vocabulary_exercises_17_Q9_virtually_2.png"], "examples": [{"en": "The project was virtually complete, needing only a few minor adjustments before final submission.", "cn": "\u8be5\u9879\u76ee\u51e0\u4e4e\u5b8c\u6210\uff0c\u5728\u6700\u7ec8\u63d0\u4ea4\u4e4b\u524d\u53ea\u9700\u8981\u8fdb\u884c\u4e00\u4e9b\u5c0f\u7684\u8c03\u6574\u3002"}, {"en": "During the pandemic, many meetings were held virtually to maintain social distancing protocols.", "cn": "\u5728\u75ab\u60c5\u671f\u95f4\uff0c\u8bb8\u591a\u4f1a\u8bae\u90fd\u662f\u4ee5\u865a\u62df\u65b9\u5f0f\u4e3e\u884c\u7684\uff0c\u4ee5\u7ef4\u6301\u793e\u4ea4\u8ddd\u79bb\u534f\u8bae\u3002"}]}, {"word": "vividly", "ipa": "/\u02c8v\u026av\u026adli/", "meanings": {"en": "in a way that produces powerful feelings or strong, clear images in the mind.", "cn": "\u4ee5\u4e00\u79cd\u5728\u8111\u6d77\u4e2d\u4ea7\u751f\u5f3a\u70c8\u611f\u89c9\u6216\u6e05\u6670\u56fe\u50cf\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes something remembered or imagined clearly.", "usage_cn": "\u63cf\u8ff0\u6e05\u695a\u5730\u8bb0\u4f4f\u6216\u60f3\u8c61\u7684\u4e8b\u7269\u3002", "scene_en": "A person vividly remembers a childhood memory while looking at old photos.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u770b\u65e7\u7167\u7247\u65f6\uff0c\u751f\u52a8\u5730\u56de\u5fc6\u8d77\u7ae5\u5e74\u7684\u8bb0\u5fc6\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q9_vividly_1.png", "P6_vocabulary_exercises_17_Q9_vividly_2.png"], "examples": [{"en": "I can vividly recall the details of that summer day, like it was yesterday.", "cn": "\u6211\u80fd\u6e05\u6670\u5730\u56de\u5fc6\u8d77\u90a3\u4e2a\u590f\u5929\u7684\u7ec6\u8282\uff0c\u5c31\u50cf\u6628\u5929\u53d1\u751f\u7684\u4e00\u6837\u3002"}, {"en": "She vividly described the beautiful sunset, painting a picture with her descriptive words.", "cn": "\u5979\u751f\u52a8\u5730\u63cf\u8ff0\u4e86\u7f8e\u4e3d\u7684\u65e5\u843d\uff0c\u7528\u5979\u63cf\u8ff0\u6027\u7684\u8bed\u8a00\u63cf\u7ed8\u4e86\u4e00\u5e45\u753b\u3002"}]}], "synonym_cn": "\u6e05\u6670\u5730 vs. \u53ef\u89c1\u5730 vs. \u53d8\u5316\u5730 vs. \u5b9e\u9645\u4e0a", "socratic_questions": [{"question": "If a memory is almost like being there again, which word describes it?", "options": ["visibly", "variably", "virtually", "vividly"], "correct_answer": "vividly", "explanation": "Vividly means producing powerful feelings or strong, clear images in the mind."}, {"question": "If something changes from day to day, which word best describes its nature?", "options": ["visibly", "variably", "virtually", "vividly"], "correct_answer": "variably", "explanation": "Variably means subject to change or variation; not consistent or fixed."}, {"question": "If you can see something clearly with your eyes, which word applies?", "options": ["visibly", "variably", "virtually", "vividly"], "correct_answer": "visibly", "explanation": "Visibly means in a way that can be seen or noticed."}, {"question": "If you are attending a meeting online, which word describes your presence?", "options": ["visibly", "variably", "virtually", "vividly"], "correct_answer": "virtually", "explanation": "Virtually means nearly or almost; also, by means of virtual reality technology."}]}, {"id": 10, "stem": "The dog barked _______ at the stranger.", "correct_index": 0, "options": [{"word": "ferociously", "ipa": "/f\u0259\u02c8ro\u028a\u0283\u0259sli/", "meanings": {"en": "In a savagely fierce, cruel, or violent manner.", "cn": "\u4ee5\u4e00\u79cd\u91ce\u86ee\u51f6\u731b\u3001\u6b8b\u9177\u6216\u66b4\u529b\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes actions done with extreme intensity and aggression.", "usage_cn": "\u63cf\u8ff0\u4ee5\u6781\u5ea6\u5f3a\u5ea6\u548c\u4fb5\u7565\u6027\u5b8c\u6210\u7684\u884c\u4e3a\u3002", "scene_en": "A wolf snarling with bared teeth, eyes narrowed in anger.", "scene_cn": "\u4e00\u53ea\u72fc\u9f87\u7259\u54a7\u5634\u5730\u5486\u54ee\u7740\uff0c\u773c\u775b\u56e0\u6124\u6012\u800c\u772f\u8d77\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q10_ferociously_1.png", "P6_vocabulary_exercises_17_Q10_ferociously_2.png"], "examples": [{"en": "The lion attacked the zebra ferociously, leaving it with no chance of escape.", "cn": "\u72ee\u5b50\u51f6\u731b\u5730\u88ad\u51fb\u4e86\u6591\u9a6c\uff0c\u4f7f\u5176\u6ca1\u6709\u9003\u8131\u7684\u673a\u4f1a\u3002"}, {"en": "The protesters ferociously opposed the new law, chanting slogans and waving banners loudly.", "cn": "\u6297\u8bae\u8005\u51f6\u731b\u5730\u53cd\u5bf9\u8fd9\u9879\u65b0\u6cd5\u5f8b\uff0c\u9ad8\u547c\u53e3\u53f7\u5e76\u5927\u58f0\u6325\u821e\u6a2a\u5e45\u3002"}]}, {"word": "forcefully", "ipa": "/\u02c8f\u0254\u02d0rsf\u0259li/", "meanings": {"en": "In a strong and effective manner; powerfully.", "cn": "\u4ee5\u4e00\u79cd\u5f3a\u5927\u800c\u6709\u6548\u7684\u65b9\u5f0f\uff1b\u5f3a\u6709\u529b\u5730\u3002"}, "usage_en": "Describes actions done with great strength or impact.", "usage_cn": "\u63cf\u8ff0\u4ee5\u5f3a\u5927\u7684\u529b\u91cf\u6216\u5f71\u54cd\u529b\u5b8c\u6210\u7684\u884c\u4e3a\u3002", "scene_en": "A blacksmith hammering a piece of metal with great strength.", "scene_cn": "\u4e00\u4f4d\u94c1\u5320\u7528\u5de8\u5927\u7684\u529b\u91cf\u9524\u51fb\u4e00\u5757\u91d1\u5c5e\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q10_forcefully_1.png", "P6_vocabulary_exercises_17_Q10_forcefully_2.png"], "examples": [{"en": "The lawyer argued his case forcefully, presenting compelling evidence to support his client's innocence.", "cn": "\u5f8b\u5e08\u5f3a\u6709\u529b\u5730\u8fa9\u8bba\u4e86\u4ed6\u7684\u6848\u4ef6\uff0c\u63d0\u51fa\u4e86\u4ee4\u4eba\u4fe1\u670d\u7684\u8bc1\u636e\u6765\u652f\u6301\u4ed6\u5ba2\u6237\u7684\u6e05\u767d\u3002"}, {"en": "The wind blew forcefully against the trees, bending their branches almost to the breaking point.", "cn": "\u98ce\u5f3a\u6709\u529b\u5730\u5439\u6253\u7740\u6811\u6728\uff0c\u5c06\u5b83\u4eec\u7684\u6811\u679d\u5f2f\u66f2\u5230\u51e0\u4e4e\u65ad\u88c2\u7684\u7a0b\u5ea6\u3002"}]}, {"word": "fervently", "ipa": "/\u02c8f\u025c\u02d0rv\u0259ntli/", "meanings": {"en": "With great warmth, intensity, and enthusiasm; passionately.", "cn": "\u4ee5\u6781\u5927\u7684\u70ed\u60c5\u3001\u5f3a\u5ea6\u548c\u70ed\u60c5\uff1b\u5145\u6ee1\u6fc0\u60c5\u5730\u3002"}, "usage_en": "Describes actions done with deep emotion and sincerity.", "usage_cn": "\u63cf\u8ff0\u4ee5\u6df1\u523b\u7684\u60c5\u611f\u548c\u771f\u8bda\u5b8c\u6210\u7684\u884c\u4e3a\u3002", "scene_en": "A person praying with hands clasped and eyes closed in deep devotion.", "scene_cn": "\u4e00\u4e2a\u4eba\u53cc\u624b\u5408\u5341\uff0c\u95ed\u7740\u773c\u775b\uff0c\u8654\u8bda\u5730\u7948\u7977\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q10_fervently_1.png", "P6_vocabulary_exercises_17_Q10_fervently_2.png"], "examples": [{"en": "She prayed fervently for her family's health and happiness, hoping for a brighter future.", "cn": "\u5979\u70ed\u5207\u5730\u7948\u7977\u5bb6\u4eba\u7684\u5065\u5eb7\u548c\u5e78\u798f\uff0c\u5e0c\u671b\u6709\u4e00\u4e2a\u66f4\u5149\u660e\u7684\u672a\u6765\u3002"}, {"en": "The fans cheered fervently as their team scored the winning goal in the final seconds.", "cn": "\u5f53\u4ed6\u4eec\u7684\u7403\u961f\u5728\u6700\u540e\u51e0\u79d2\u949f\u8fdb\u7403\u65f6\uff0c\u7403\u8ff7\u4eec\u70ed\u70c8\u6b22\u547c\u3002"}]}, {"word": "frightfully", "ipa": "/\u02c8fra\u026atf\u0259li/", "meanings": {"en": "In a manner that is alarming, shocking, or terrifying; dreadfully.", "cn": "\u4ee5\u4e00\u79cd\u4ee4\u4eba\u9707\u60ca\u3001\u9707\u60ca\u6216\u6050\u60e7\u7684\u65b9\u5f0f\uff1b\u53ef\u6015\u5730\u3002"}, "usage_en": "Describes actions or situations that cause great fear or anxiety.", "usage_cn": "\u63cf\u8ff0\u5f15\u8d77\u6781\u5927\u6050\u60e7\u6216\u7126\u8651\u7684\u884c\u4e3a\u6216\u60c5\u51b5\u3002", "scene_en": "A dark, shadowy figure lurking in a dimly lit alleyway.", "scene_cn": "\u4e00\u4e2a\u9ed1\u6697\u3001\u9634\u5f71\u7b3c\u7f69\u7684\u8eab\u5f71\u6f5c\u4f0f\u5728\u5149\u7ebf\u660f\u6697\u7684\u5c0f\u5df7\u91cc\u3002", "image_paths": ["P6_vocabulary_exercises_17_Q10_frightfully_1.png", "P6_vocabulary_exercises_17_Q10_frightfully_2.png"], "examples": [{"en": "The storm raged frightfully outside, with thunder and lightning illuminating the dark sky.", "cn": "\u66b4\u98ce\u96e8\u5728\u5916\u9762\u53ef\u6015\u5730\u8086\u8650\uff0c\u96f7\u9e23\u548c\u95ea\u7535\u7167\u4eae\u4e86\u9ed1\u6697\u7684\u5929\u7a7a\u3002"}, {"en": "The old house stood frightfully on the hill, its windows like empty eyes staring into the night.", "cn": "\u90a3\u680b\u8001\u623f\u5b50\u53ef\u6015\u5730\u77d7\u7acb\u5728\u5c71\u9876\u4e0a\uff0c\u5b83\u7684\u7a97\u6237\u5c31\u50cf\u7a7a\u6d1e\u7684\u773c\u775b\u51dd\u89c6\u7740\u591c\u665a\u3002"}]}], "synonym_cn": "\u731b\u70c8\u5730 vs. \u5f3a\u6709\u529b\u5730 vs. \u70ed\u70c8\u5730 vs. \u53ef\u6015\u5730", "socratic_questions": [{"question": "If a lawyer argues with intense passion and conviction, which word best describes their manner?", "options": ["ferociously", "forcefully", "fervently", "frightfully"], "correct_answer": "fervently", "explanation": "Fervently implies a passionate and enthusiastic manner, fitting the lawyer's intense conviction."}, {"question": "If a storm rages with destructive power, which word best describes its intensity?", "options": ["ferociously", "forcefully", "fervently", "frightfully"], "correct_answer": "forcefully", "explanation": "Forcefully suggests great power and impact, aligning with the destructive nature of the storm."}, {"question": "If someone is telling a scary story around a campfire, which word describes how the listeners react?", "options": ["ferociously", "forcefully", "fervently", "frightfully"], "correct_answer": "frightfully", "explanation": "Frightfully means in a manner that causes great fear, matching the reaction to a scary story."}, {"question": "If a lion attacks its prey with wild aggression, which word best describes its attack?", "options": ["ferociously", "forcefully", "fervently", "frightfully"], "correct_answer": "ferociously", "explanation": "Ferociously implies a savage and violent manner, fitting the lion's aggressive attack."}]}]};
