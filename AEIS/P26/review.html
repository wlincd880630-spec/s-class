te.", "cn": "\u8fd9\u4f4d\u653f\u6cbb\u5bb6\u5426\u8ba4\u4e86\u5728\u6fc0\u70c8\u7684\u8fa9\u8bba\u4e2d\u5bf9\u4ed6\u63d0\u51fa\u7684\u6240\u6709\u6697\u793a\u3002"}, {"en": "Her insinuations about his work ethic were unfair and completely unfounded in reality.", "cn": "\u5979\u5bf9\u4ed6\u7684\u804c\u4e1a\u9053\u5fb7\u7684\u6697\u793a\u662f\u4e0d\u516c\u5e73\u7684\uff0c\u5e76\u4e14\u5b8c\u5168\u6ca1\u6709\u6839\u636e\u3002"}]}, {"word": "suspicions", "ipa": "/s\u0259\u02c8sp\u026a\u0283\u0259nz/", "meanings": {"en": "A feeling or belief that someone is guilty of an illegal or wrong act.", "cn": "\u67d0\u4eba\u72af\u6709\u975e\u6cd5\u6216\u9519\u8bef\u884c\u4e3a\u7684\u611f\u89c9\u6216\u4fe1\u5ff5\u3002"}, "usage_en": "Used to describe a feeling of distrust or doubt about someone or something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u7684\u4e0d\u4fe1\u4efb\u6216\u6000\u7591\u7684\u611f\u89c9\u3002", "scene_en": "A detective looking closely at a suspect in a dimly lit room.", "scene_cn": "\u4e00\u540d\u4fa6\u63a2\u5728\u5149\u7ebf\u660f\u6697\u7684\u623f\u95f4\u91cc\u4ed4\u7ec6\u89c2\u5bdf\u5acc\u7591\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q1_suspicions_1.png", "P6_vocabulary_exercises_26_Q1_suspicions_2.png"], "examples": [{"en": "The police had strong suspicions about the man, but lacked enough evidence to arrest him.", "cn": "\u8b66\u65b9\u5bf9\u8fd9\u540d\u7537\u5b50\u6709\u5f3a\u70c8\u7684\u6000\u7591\uff0c\u4f46\u7f3a\u4e4f\u8db3\u591f\u7684\u8bc1\u636e\u902e\u6355\u4ed6\u3002"}, {"en": "Her suspicions grew when she noticed money missing from her purse after his visit.", "cn": "\u5f53\u5979\u6ce8\u610f\u5230\u4ed6\u6765\u8bbf\u540e\u5979\u7684\u94b1\u5305\u91cc\u5c11\u4e86\u94b1\u65f6\uff0c\u5979\u7684\u6000\u7591\u589e\u52a0\u4e86\u3002"}]}], "synonym_cn": "\u8bc1\u636e vs. \u60f3\u6cd5 vs. \u6697\u793a vs. \u6000\u7591", "socratic_questions": [{"question": "If you're considering someone might be guilty, but lack solid facts, what do you hold?", "options": ["thoughts", "proof", "insinuations", "suspicions"], "correct_answer": "suspicions", "explanation": "Suspicions involve a feeling that someone might be guilty without concrete evidence."}, {"question": "What do you possess when you have undeniable video footage showing someone committing a crime?", "options": ["thoughts", "proof", "insinuations", "suspicions"], "correct_answer": "proof", "explanation": "Proof is concrete evidence that establishes the truth of something beyond reasonable doubt."}, {"question": "If you're having a general idea about something, what are you having?", "options": ["thoughts", "proof", "insinuations", "suspicions"], "correct_answer": "thoughts", "explanation": "Thoughts are ideas or opinions produced by thinking or occurring suddenly in the mind."}, {"question": "If you are hinting at something negative about someone without directly saying it, what are you making?", "options": ["thoughts", "proof", "insinuations", "suspicions"], "correct_answer": "insinuations", "explanation": "Insinuations are indirect suggestions or hints, usually negative or unpleasant."}]}, {"id": 2, "stem": "The defendant has decided to ______ guilty in order to get a lighter sentence.", "correct_index": 1, "options": [{"word": "pardon", "ipa": "/\u02c8p\u0251\u02d0rd\u0259n/", "meanings": {"en": "To forgive or excuse (a person) for an offense.", "cn": "\u539f\u8c05\u6216\u5bbd\u6055\uff08\u67d0\u4eba\uff09\u7684\u7f6a\u884c\u3002"}, "usage_en": "Used when officially forgiving someone for a crime or offense.", "usage_cn": "\u7528\u4e8e\u6b63\u5f0f\u5730\u5bbd\u6055\u67d0\u4eba\u7684\u72af\u7f6a\u884c\u4e3a\u6216\u8fc7\u5931\u3002", "scene_en": "A courtroom scene where a judge announces a pardon.", "scene_cn": "\u6cd5\u5ead\u573a\u666f\uff0c\u6cd5\u5b98\u5ba3\u5e03\u8d66\u514d\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q2_pardon_1.png", "P6_vocabulary_exercises_26_Q2_pardon_2.png"], "examples": [{"en": "The rue, often without proof.", "usage_cn": "\u7528\u4e8e\u65ad\u8a00\u67d0\u4e8b\u4e3a\u771f\uff0c\u901a\u5e38\u6ca1\u6709\u8bc1\u636e\u3002", "scene_en": "A person making a statement or assertion in a public setting.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u516c\u5171\u573a\u5408\u53d1\u8868\u58f0\u660e\u6216\u65ad\u8a00\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q2_claim_1.png", "P6_vocabulary_exercises_26_Q2_claim_2.png"], "examples": [{"en": "He continues to claim that he is innocent, despite the overwhelming evidence against him.", "cn": "\u5c3d\u7ba1\u6709\u5927\u91cf\u7684\u8bc1\u636e\u5bf9\u4ed6\u4e0d\u5229\uff0c\u4ed6\u4ecd\u7136\u58f0\u79f0\u81ea\u5df1\u662f\u65e0\u8f9c\u7684\u3002"}, {"en": "The company made a bold claim about the effectiveness of their new weight loss product.", "cn": "\u8be5\u516c\u53f8\u5bf9\u5176\u65b0\u578b\u51cf\u80a5\u4ea7\u54c1\u7684\u6709\u6548\u6027\u63d0\u51fa\u4e86\u5927\u80c6\u7684\u4e3b\u5f20\u3002"}]}, {"word": "confess", "ipa": "/k\u0259n\u02c8fes/", "meanings": {"en": "To admit or state formally that one has committed a crime or done something wrong.", "cn": "\u627f\u8ba4\u6216\u6b63\u5f0f\u58f0\u660e\u81ea\u5df1\u72af\u4e86\u7f6a\u6216\u505a\u4e86\u9519\u4e8b\u3002"}, "usage_en": "Used when admitting guilt or wrongdoing.", "usage_cn": "\u7528\u4e8e\u627f\u8ba4\u6709\u7f6a\u6216\u505a\u9519\u4e8b\u3002", "scene_en": "A person confessing to a crime to the police.", "scene_cn": "\u4e00\u4e2a\u4eba\u5411\u8b66\u5bdf\u5766\u767d\u7f6a\u884c\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q2_confess_1.png", "P6_vocabulary_exercises_26_Q2_confess_2.png"], "examples": [{"en": "After hours of questioning, the suspect finally decided to confess to the crime he committed.", "cn": "\u7ecf\u8fc7\u6570\u5c0f\u65f6\u7684\u5ba1\u95ee\uff0c\u5acc\u7591\u4eba\u6700\u7ec8\u51b3\u5b9a\u5766\u767d\u4ed6\u6240\u72af\u4e0b\u7684\u7f6a\u884c\u3002"}, {"en": "She decided to confess her feelings to him, even though she was afraid of rejection.", "cn": "\u5979\u51b3\u5b9a\u5411\u4ed6\u5766\u767d\u81ea\u5df1\u7684\u611f\u60c5\uff0c\u5373\u4f7f\u5979\u5bb3\u6015\u88ab\u62d2\u7edd\u3002"}]}], "synonym_cn": "\u627f\u8ba4\u7f6a\u884c\uff1a\u5766\u767d > \u627f\u8ba4 > \u58f0\u79f0 > \u539f\u8c05", "socratic_questions": [{"question": "In a trial, which action involves formally stating you are not guilty or responsible?", "options": ["pardon", "plead", "claim", "confess"], "correct_answer": "plead", "explanation": "To 'plead' not guilty is to formally state your innocence in court."}, {"question": "If someone admits to committing a crime, what action are they taking?", "options": ["pardon", "plead", "claim", "confess"], "correct_answer": "confess", "explanation": "To 'confess' is to admit to doing something wrong or illegal."}, {"question": "Which word describes a situation where someone is officially forgiven for an offense?", "options": ["pardon", "plead", "claim", "confess"], "correct_answer": "pardon", "explanation": "To 'pardon' someone is to forgive them for an offense and release them from punishment."}, {"question": "If you state something is true, even without proof, what are you doing?", "options": ["pardon", "plead", "claim", "confess"], "correct_answer": "claim", "explanation": "To 'claim' is to state something is true, often without providing evidence."}]}, {"id": 3, "stem": "Most of us don't believe Diana because she is not a/an ______ girl.", "correct_index": 2, "options": [{"word": "honour", "ipa": "/\u02c8\u0252n\u0259r/", "meanings": {"en": "Respect and admiration; high moral principles.", "cn": "\u5c0a\u656c\u548c\u94a6\u4f69\uff1b\u5d07\u9ad8\u7684\u9053\u5fb7\u539f\u5219\u3002"}, "usage_en": "Often used to describe a code of conduct or a position of respect.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u884c\u4e3a\u51c6\u5219\u6216\u53d7\u4eba\u5c0a\u656c\u7684\u5730\u4f4d\u3002", "scene_en": "A knight receiving a medal for bravery in a grand ceremony.", "scene_cn": "\u4e00\u4f4d\u9a ledge of history made her an excellent tour guide for the museum.", "cn": "\u5979\u5bf9\u5386\u53f2\u7684\u5e7f\u6cdb\u4e86\u89e3\u4f7f\u5979\u6210\u4e3a\u535a\u7269\u9986\u7684\u4f18\u79c0\u5bfc\u6e38\u3002"}, {"en": "The company invested heavily in employee training to improve their technical knowledge and skills.", "cn": "\u8be5\u516c\u53f8\u5728\u5458\u5de5\u57f9\u8bad\u65b9\u9762\u6295\u5165\u5de8\u8d44\uff0c\u4ee5\u63d0\u9ad8\u4ed6\u4eec\u7684\u6280\u672f\u77e5\u8bc6\u548c\u6280\u80fd\u3002"}]}, {"word": "opinion", "ipa": "/\u0259\u02c8p\u026anj\u0259n/", "meanings": {"en": "A view or judgement formed about something, not necessarily based on fact or knowledge.", "cn": "\u5bf9\u67d0\u4e8b\u5f62\u6210\u7684\u89c2\u70b9\u6216\u5224\u65ad\uff0c\u4e0d\u4e00\u5b9a\u57fa\u4e8e\u4e8b\u5b9e\u6216\u77e5\u8bc6\u3002"}, "usage_en": "Expresses a personal belief or viewpoint.", "usage_cn": "\u8868\u8fbe\u4e2a\u4eba\u4fe1\u4ef0\u6216\u89c2\u70b9\u3002", "scene_en": "People discussing different viewpoints around a table, showing diverse opinions.", "scene_cn": "\u4eba\u4eec\u56f4\u5750\u5728\u684c\u65c1\u8ba8\u8bba\u4e0d\u540c\u7684\u89c2\u70b9\uff0c\u5c55\u793a\u4e86\u4e0d\u540c\u7684\u610f\u89c1\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q7_opinion_1.png", "P6_vocabulary_exercises_26_Q7_opinion_2.png"], "examples": [{"en": "In my opinion, the new policy will negatively impact employee morale and productivity levels.", "cn": "\u5728\u6211\u770b\u6765\uff0c\u65b0\u653f\u7b56\u5c06\u5bf9\u5458\u5de5\u58eb\u6c14\u548c\u751f\u4ea7\u529b\u6c34\u5e73\u4ea7\u751f\u8d1f\u9762\u5f71\u54cd\u3002"}, {"en": "Everyone is entitled to their own opinion, even if it differs from the majority view.", "cn": "\u6bcf\u4e2a\u4eba\u90fd\u6709\u6743\u53d1\u8868\u81ea\u5df1\u7684\u610f\u89c1\uff0c\u5373\u4f7f\u5b83\u4e0e\u5927\u591a\u6570\u4eba\u7684\u89c2\u70b9\u4e0d\u540c\u3002"}]}, {"word": "judgement", "ipa": "/\u02c8d\u0292\u028cd\u0292m\u0259nt/", "meanings": {"en": "The ability to make considered decisions or come to sensible conclusions.", "cn": "\u505a\u51fa\u7ecf\u8fc7\u6df1\u601d\u719f\u8651\u7684\u51b3\u5b9a\u6216\u5f97\u51fa\u660e\u667a\u7ed3\u8bba\u7684\u80fd\u529b\u3002"}, "usage_en": "Implies careful evaluation before making a decision.", "usage_cn": "\u610f\u5473\u7740\u5728\u505a\u51fa\u51b3\u5b9a\u4e4b\u524d\u8fdb\u884c\u4ed4\u7ec6\u8bc4\u4f30\u3002", "scene_en": "A judge in a courtroom making a decision, representing careful judgement.", "scene_cn": "\u6cd5\u5ead\u4e0a\u7684\u6cd5\u5b98\u6b63\u5728\u505a\u51fa\u51b3\u5b9a\uff0c\u4ee3\u8868\u7740\u8c28\u614e\u7684\u5224\u65ad\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q7_judgement_1.png", "P6_vocabulary_exercises_26_Q7_judgement_2.png"], "examples": [{"en": "The manager showed poor judgement by ignoring the warning signs and proceeding with the project.", "cn": "\u7ecf\u7406\u65e0\u89c6\u8b66\u544a\u4fe1\u53f7\u5e76\u7ee7\u7eed\u8fdb\u884c\u8be5\u9879\u76ee\uff0c\u8fd9\u8868\u660e\u4ed6\u7684\u5224\u65ad\u529b\u5f88\u5dee\u3002"}, {"en": "Her excellent judgement in financial matters made her a valuable asset to the company.", "cn": "\u5979\u5728\u8d22\u52a1\u65b9\u9762\u7684\u51fa\u8272\u5224\u65ad\u529b\u4f7f\u5979\u6210\u4e3a\u516c\u53f8\u7684\u5b9d\u8d35\u8d44\u4ea7\u3002"}]}], "synonym_cn": "\u89c2\u70b9, \u770b\u6cd5, \u89c1\u89e3", "socratic_questions": [{"question": "If a friend shares a controversial plan, and you want to politely disagree, would you start with your 'idea', 'knowledge', 'opinion', or 'judgement'?", "options": ["idea", "knowledge", "opinion", "judgement"], "correct_answer": "opinion", "explanation": "Expressing your opinion allows you to share your viewpoint without asserting it as fact."}, {"question": "When solving a complex math problem, is it more important to rely on your 'idea', 'knowledge', 'opinion', or 'judgement' of the correct answer?", "options": ["idea", "knowledge", "opinion", "judgement"], "correct_answer": "knowledge", "explanation": "Mathematical problems require reliance on established facts and understanding, which constitutes knowledge."}, {"question": "Before starting a new business, is it better to act on a sudden 'idea', solid 'knowledge', popular 'opinion', or careful 'judgement'?", "options": ["idea", "knowledge", "opinion", "judgement"], "correct_answer": "judgement", "explanation": "Careful judgement involves weighing all factors and making a considered decision."}, {"question": "When brainstorming new marketing strategies, is it more helpful to share every 'idea', every piece of 'knowledge', every 'opinion', or every 'judgement'?", "options": ["idea", "knowledge", "opinion", "judgement"], "correct_answer": "idea", "explanation": "Brainstorming thrives on the free flow of ideas, even if they are not fully formed."}]}, {"id": 8, "stem": "My house looks new as it has recently been ______.", "correct_index": 1, "options": [{"word": "restored", "ipa": "/r\u026a\u02c8st\u0254\u02d0rd/", "meanings": {"en": "Returned to its original condition by repairing or cleaning.", "cn": "\u901a\u8fc7\u4fee\u7406\u6216\u6e05\u6d01\u6062\u590d\u5230\u539f\u59cb\u72b6\u6001\u3002"}, "usage_en": "Often used for historical buildings or artworks.", "usage_cn": "\u5e38\u7528\u4e8e\u5386\u53f2\u5efa\u7b51\u6216\u827a\u672f\u54c1\u3002", "scene_en": "A museum curator carefully cleaning an ancient artifact.", "scene_cn": "\u535a\u7269\u9986\u9986\u957f\u5c0f\u5fc3\u7ffc\u7ffc\u5730\u6e05\u6d01\u4e00\u4ef6\u53e4\u4ee3\u6587\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q8_restored_1.png", "P6_vocabulary_exercises_26_Q8_restored_2.png"], "examples": [{"en": "The old church was carefully restored to its former glory after the fire.", "cn": "\u706b\u707e\u540e\uff0c\u8fd9\u5ea7\u53e4\u8001\u7684\u6559\u5802\u88ab\u7cbe\u5fc3\u4fee\u590d\uff0c\u6062\u590d\u4e86\u6614\u65e5\u7684\u8f89\u714c\u3002"}, {"en": "He restored the antique desk, bringing out the beautiful wood grain underneath layers of old varnish.", "cn": "\u4ed6\u4fee\u590d\u4e86\u53e4\u8463\u4e66\u684c\uff0c\u9732\u51fa\u4e86\u65e7\u6e05\u6f06\u5c42\u4e0b\u7f8e\u4e3d\u7684\u6728\u7eb9\u3002"}]}, {"word": "renovated", "ipa": "/\u02c8r\u025bn\u0259ve\u026at\u026ad/", "meanings": {"en": "Improved by repairing and redecorating.", "cn": "\u901a\u8fc7\u4fee\u7406\u548c\u91cd\u65b0\u88c5\u4fee\u8fdb\u884c\u6539\u8fdb\u3002"}, "usage_en": "Commonly used for houses, apartments, or offices.", "usage_cn": "\u5e38\u7528\u4e8e\u623f\u5c4b\u3001\u516c\u5bd3\u6216\u529e\u516c\u5ba4\u3002", "scene_en": "A construction crew remodeling a kitchen with new cabinets.", "scene_cn": "\u4e00\u4e2a\u5efa\u7b51\u961f\u6b63\u5728\u7528\u65b0\u6a71\u67dc\u6539\u9020\u53a8\u623f\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q8_renovated_1.png", "P6_vocabulary_exercises_26_Q8_renovated_2.png"], "examples": [{"en": "They renovated their kitchen with new appliances and a modern island design.", "cn": "\u4ed6\u4eec\u7528\u65b0\u7684\u7535\u5668\u548c\u4e00\u4e2a\u73b0\u4ee3\u5316\u7684\u5c9b\u53f0\u8bbe\u8ba1\u7ffb\u65b0\u4e86\u4ed6\u4eec\u7684\u53a8\u623f\u3002"}, {"en": "The old theater was renovated to accommodate larger audiences and modern stage equipment.", "cn": "\u65e7\u5267\u9662\u7ecf\u8fc7\u7ffb\u65b0\uff0c\u53ef\u4ee5\u5bb9\u7eb3\u66f4\u591a\u7684\u89c2\u4f17\u548c\u73b0\u4ee3\u5316\u7684\u821e\u53f0\u8bbe\u5907\u3002"}]}, {"word": "redone", "ipa": "/\u02ccri\u02d0\u02c8d\u028cn/", "meanings": {"en": "Done again, often in a different or better way.", "cn": "\u518d\u6b21\u5b8c\u6210\uff0c\u901a\u5e38\u4ee5\u4e0d\u540c\u6216\u66f4\u597d\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Used for smaller projects or tasks.", "usage_cn": "\u7528\u4e8e\u8f83\u5c0f\u7684\u9879\u76ee\u6216\u4efb\u52a1\u3002", "scene_en": "Someone repainting a wall in their living room.", "scene_cn": "\u6709\u4eba\u5728\u91cd\u65b0\u7c89\u5237\u4ed6\u4eec\u5ba2\u5385\u7684\u5899\u58c1\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q8_redone_1.png", "P6_vocabulary_exercises_26_Q8_redone_2.png"], "examples": [{"en": "She redone her bedroom with a new color scheme and updated furniture arrangement.", "cn": "\u5979\u7528\u65b0\u7684\u914d\u8272\u65b9\u6848\u548c\u66f4\u65b0\u7684\u5bb6\u5177\u5e03\u7f6e\u91cd\u65b0\u5e03\u7f6e\u4e86\u5979\u7684\u5367\u5ba4\u3002"}, {"en": "The website was redone to be more user-friendly and visually appealing to attract new customers.", "cn": "\u8be5\u7f51\u7ad9\u7ecf\u8fc7\u91cd\u65b0\u8bbe\u8ba1\uff0c\u66f4\u4fbf\u4e8e\u7528\u6237\u4f7f\u7528\uff0c\u5e76\u4e14\u5728\u89c6\u89c9\u4e0a\u66f4\u5177\u5438\u5f15\u529b\uff0c\u4ee5\u5438\u5f15\u65b0\u5ba2\u6237\u3002"}]}, {"word": "replaced", "ipa": "/r\u026a\u02c8ple\u026ast/", "meanings": {"en": "Took the place of something old or broken with something new.", "cn": "\u7528\u65b0\u7684\u4e1c\u897f\u4ee3\u66ff\u65e7\u7684\u6216\u574f\u7684\u4e1c\u897f\u3002"}, "usage_en": "Used when something is completely exchanged.", "usage_cn": "\u7528\u4e8e\u5b8c\u5168\u4ea4\u6362\u67d0\u7269\u65f6\u3002", "scene_en": "A mechanic replacing a car's engine with a new one.", "scene_cn": "\u4e00\u540d\u673a\u68b0\u5e08\u6b63\u5728\u7528\u65b0\u7684\u53d1\u52a8\u673a\u66f4\u6362\u6c7d\u8f66\u7684\u53d1\u52a8\u673a\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q8_replaced_1.png", "P6_vocabulary_exercises_26_Q8_replaced_2.png"], "examples": [{"en": "The old, leaky roof was replaced with a brand new, energy-efficient roofing system.", "cn": "\u65e7\u7684\u3001\u6f0f\u6c34\u7684\u5c4b\u9876\u88ab\u4e00\u4e2a\u5168\u65b0\u7684\u3001\u8282\u80fd\u7684\u5c4b\u9876\u7cfb\u7edf\u6240\u53d6\u4ee3\u3002"}, {"en": "After years of use, he replaced his old computer with a faster, more powerful model.", "cn": "\u7ecf\u8fc7\u591a\u5e74\u7684\u4f7f\u7528\uff0c\u4ed6\u7528\u4e00\u53f0\u66f4\u5feb\u3001\u66f4\u5f3a\u5927\u7684\u578b\u53f7\u53d6\u4ee3\u4e86\u4ed6\u7684\u65e7\u7535\u8111\u3002"}]}], "synonym_cn": "\u7ffb\u65b0, \u4fee\u5fa9, \u91cd\u505a, \u66f4\u63db (\u90fd\u662f\u4f7f\u6771\u897f\u8b8a\u65b0\u7684\u65b9\u5f0f\uff0c\u4f46\u7a0b\u5ea6\u548c\u5c0d\u8c61\u4e0d\u540c)", "socratic_questions": [{"question": "Imagine an old building's historical features are carefully brought back to their original glory. Which word best describes this process?", "options": ["restored", "renovated", "redone", "replaced"], "correct_answer": "restored", "explanation": "Restored implies returning something to its original condition."}, {"question": "If you completely changed the kitchen layout and installed new appliances, which word best describes what you did?", "options": ["restored", "renovated", "redone", "replaced"], "correct_answer": "renovated", "explanation": "Renovated means to improve something by adding new features."}, {"question": "If you painted a room a different color and rearranged the furniture, which word describes the action?", "options": ["restored", "renovated", "redone", "replaced"], "correct_answer": "redone", "explanation": "Redone suggests a simpler, less extensive change."}, {"question": "If the old windows were broken and you installed completely new ones, which word best describes this?", "options": ["restored", "renovated", "redone", "replaced"], "correct_answer": "replaced", "explanation": "Replaced means to substitute something old with something new."}]}, {"id": 9, "stem": "Sometimes, the weather ______ are not very accurate.", "correct_index": 1, "options": [{"word": "foresights", "ipa": "/\u02c8f\u0254\u02d0rsa\u026ats/", "meanings": {"en": "The ability to predict or the action of predicting what will happen or be needed in the future.", "cn": "\u9884\u6d4b\u672a\u6765\u5c06\u53d1\u751f\u6216\u9700\u8981\u7684\u4e8b\u4ef6\u7684\u80fd\u529b\u6216\u884c\u4e3a\u3002"}, "usage_en": "Often used in business or strategic planning contexts.", "usage_cn": "\u5e38\u7528\u4e8e\u5546\u4e1a\u6216\u6218\u7565\u89c4\u5212\u7684\u8bed\u5883\u4e2d\u3002", "scene_en": "A group of executives discussing long-term business strategies in a modern office.", "scene_cn": "\u4e00\u7fa4\u9ad8\u7ba1\u5728\u73b0\u4ee3\u529e\u516c\u5ba4\u8ba8\u8bba\u957f\u671f\u4e1a\u52a1\u6218\u7565\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q9_foresights_1.png", "P6_vocabulary_exercises_26_Q9_foresights_2.png"], "examples": [{"en": "Her foresights about market trends allowed the company to stay ahead of competitors.", "cn": "\u5979\u5bf9\u5e02\u573a\u8d8b\u52bf\u7684\u8fdc\u89c1\u4f7f\u516c\u53f8\u80fd\u591f\u4fdd\u6301\u5728\u7ade\u4e89\u5bf9\u624b\u7684\u524d\u9762\u3002"}, {"en": "Effective strategic planning requires careful foresights into potential risks and opportunities ahead.", "cn": "\u6709\u6548\u7684\u6218\u7565\u89c4\u5212\u9700\u8981\u4ed4\u7ec6\u9884\u6d4b\u6f5c\u5728\u7684\u98ce\u9669\u548c\u672a\u6765\u7684\u673a\u9047\u3002"}]}, {"word": "forecasts", "ipa": "/\u02c8f\u0254\u02d0rk\u00e6sts/", "meanings": {"en": "Predictions or estimations of future events, especially weather or financial trends.", "cn": "\u5bf9\u672a\u6765\u4e8b\u4ef6\u7684\u9884\u6d4b\u6216\u4f30\u8ba1\uff0c\u7279\u522b\u662f\u5929\u6c14\u6216\u91d1\u878d\u8d8b\u52bf\u3002"}, "usage_en": "Commonly used in meteorology, economics, and business.", "usage_cn": "\u5e38\u7528\u4e8e\u6c14\u8c61\u5b66\u3001\u7ecf\u6d4e\u5b66\u548c\u5546\u4e1a\u9886\u57df\u3002", "scene_en": "A weather reporter presenting the weather forecast on television.", "scene_cn": "\u5929\u6c14\u9884\u62a5\u5458\u5728\u7535\u89c6\u4e0a\u64ad\u62a5\u5929\u6c14\u9884\u62a5\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q9_forecasts_1.png", "P6_vocabulary_exercises_26_Q9_forecasts_2.png"], "examples": [{"en": "The weather forecasts predicted heavy rain for the weekend, so we canceled our picnic.", "cn": "\u5929\u6c14\u9884\u62a5\u9884\u6d4b\u5468\u672b\u6709\u5927\u96e8\uff0c\u6240\u4ee5\u6211\u4eec\u53d6\u6d88\u4e86\u91ce\u9910\u3002"}, {"en": "Economic forecasts suggest a period of slow growth, impacting investment decisions significantly.", "cn": "\u7ecf\u6d4e\u9884\u6d4b\u8868\u660e\u7ecf\u6d4e\u589e\u957f\u7f13\u6162\uff0c\u5bf9\u6295\u8d44\u51b3\u7b56\u4ea7\u751f\u91cd\u5927\u5f71\u54cd\u3002"}]}, {"word": "forewarns", "ipa": "/f\u0254\u02d0r\u02c8w\u0254\u02d0rnz/", "meanings": {"en": "To inform someone of a danger or problem in advance; to give prior warning.", "cn": "\u63d0\u524d\u544a\u77e5\u67d0\u4eba\u5371\u9669\u6216\u95ee\u9898\uff1b\u63d0\u524d\u53d1\u51fa\u8b66\u544a\u3002"}, "usage_en": "Often used in situations involving potential risks or negative outcomes.", "usage_cn": "\u5e38\u7528\u4e8e\u6d89\u53ca\u6f5c\u5728\u98ce\u9669\u6216\u8d1f\u9762\u7ed3\u679c\u7684\u60c5\u51b5\u3002", "scene_en": "A sign warning hikers about potential dangers on a mountain trail.", "scene_cn": "\u4e00\u4e2a\u6807\u5fd7\u8b66\u544a\u5f92\u6b65\u65c5\u884c\u8005\u5173\u4e8e\u5c71\u8def\u4e0a\u6f5c\u5728\u7684\u5371\u9669\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q9_forewarns_1.png", "P6_vocabulary_exercises_26_Q9_forewarns_2.png"], "examples": [{"en": "The doctor forewarns patients about the possible side effects of the new medication.", "cn": "\u533b\u751f\u63d0\u524d\u544a\u77e5\u60a3\u8005\u5173\u4e8e\u65b0\u836f\u53ef\u80fd\u4ea7\u751f\u7684\u526f\u4f5c\u7528\u3002"}, {"en": "Security services forewarns citizens about potential terrorist threats during major public events.", "cn": "\u5b89\u5168\u90e8\u95e8\u63d0\u524d\u8b66\u544a\u5e02\u6c11\u5728\u91cd\u5927\u516c\u5171\u6d3b\u52a8\u671f\u95f4\u53ef\u80fd\u53d1\u751f\u7684\u6050\u6016\u5a01\u80c1\u3002"}]}, {"word": "forethoughts", "ipa": "/\u02c8f\u0254\u02d0r\u03b8\u0254\u02d0ts/", "meanings": {"en": "Thoughts or considerations given to something in advance; prior planning or contemplation.", "cn": "\u4e8b\u5148\u5bf9\u67d0\u4e8b\u7269\u7684\u601d\u8003\u6216\u8003\u8651\uff1b\u4e8b\u5148\u8ba1\u5212\u6216\u6c89\u601d\u3002"}, "usage_en": "Used to describe careful planning or preparation.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4ed4\u7ec6\u7684\u8ba1\u5212\u6216\u51c6\u5907\u3002", "scene_en": "An architect reviewing blueprints and making detailed plans for a new building.", "scene_cn": "\u4e00\u4f4d\u5efa\u7b51\u5e08\u5ba1\u67e5\u84dd\u56fe\u5e76\u4e3a\u65b0\u5efa\u7b51\u5236\u5b9a\u8be6\u7ec6\u7684\u8ba1\u5212\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q9_forethoughts_1.png", "P6_vocabulary_exercises_26_Q9_forethoughts_2.png"], "examples": [{"en": "With careful forethoughts, they managed to avoid many of the common pitfalls of starting a business.", "cn": "\u7ecf\u8fc7\u4ed4\u7ec6\u7684\u8003\u8651\uff0c\u4ed6\u4eec\u8bbe\u6cd5\u907f\u514d\u4e86\u521b\u4e1a\u7684\u8bb8\u591a\u5e38\u89c1\u9677\u9631\u3002"}, {"en": "Her forethoughts about the project ensured that all the necessary resources were available on time.", "cn": "\u5979\u5bf9\u9879\u76ee\u7684\u9884\u5148\u8003\u8651\u786e\u4fdd\u4e86\u6240\u6709\u5fc5\u8981\u7684\u8d44\u6e90\u90fd\u6309\u65f6\u5230\u4f4d\u3002"}]}], "synonym_cn": "\u9884\u62a5 vs. \u9884\u89c1 vs. \u9884\u5148\u8b66\u544a vs. \u9884\u5148\u8003\u8651", "socratic_questions": [{"question": "If you had the power to see into the future, what specific events or dangers would you use your ______ to prepare for?", "options": ["foresights", "forecasts", "forewarns", "forethoughts"], "correct_answer": "foresights", "explanation": "Foresights refer to the ability to predict or anticipate future events or needs."}, {"question": "Which of these is most crucial for pilots before taking off, ensuring a safe flight?", "options": ["foresights", "forecasts", "forewarns", "forethoughts"], "correct_answer": "forecasts", "explanation": "Forecasts are predictions or estimations of future events, especially weather."}, {"question": "Imagine a public health official trying to alert the community about an impending health crisis; what action describes their role?", "options": ["foresights", "forecasts", "forewarns", "forethoughts"], "correct_answer": "forewarns", "explanation": "Forewarns means to inform someone of a danger or problem in advance."}, {"question": "When making a significant life decision, like choosing a career path, what kind of mental preparation is essential?", "options": ["foresights", "forecasts", "forewarns", "forethoughts"], "correct_answer": "forethoughts", "explanation": "Forethoughts are thoughts or considerations given to something in advance."}]}, {"id": 10, "stem": "There was no ______ that he had stolen the goods, so he was set free.", "correct_index": 2, "options": [{"word": "information", "ipa": "\u02cc\u026anf\u0259r\u02c8me\u026a\u0283\u0259n", "meanings": {"en": "Facts provided or learned about something or someone.", "cn": "\u63d0\u4f9b\u7684\u6216\u5b66\u5230\u7684\u5173\u4e8e\u67d0\u4e8b\u6216\u67d0\u4eba\u7684\u4e8b\u5b9e\u3002"}, "usage_en": "Used to describe data or knowledge that is communicated or received.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u88ab\u4f20\u9012\u6216\u63a5\u6536\u7684\u6570\u636e\u6216\u77e5\u8bc6\u3002", "scene_en": "A person reading a newspaper to gather details about current events.", "scene_cn": "\u4e00\u4e2a\u4eba\u6b63\u5728\u9605\u8bfb\u62a5\u7eb8\u4ee5\u6536\u96c6\u6709\u5173\u65f6\u4e8b\u7684\u8be6\u7ec6\u4fe1\u606f\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q10_information_1.png", "P6_vocabulary_exercises_26_Q10_information_2.png"], "examples": [{"en": "The internet provides a vast amount of information on almost every conceivable topic.", "cn": "\u4e92\u8054\u7f51\u63d0\u4f9b\u4e86\u5173\u4e8e\u51e0\u4e4e\u6240\u6709\u53ef\u4ee5\u60f3\u8c61\u7684\u4e3b\u9898\u7684\u5927\u91cf\u4fe1\u606f\u3002"}, {"en": "Before making a decision, gather as much information as possible to ensure success.", "cn": "\u5728\u505a\u51fa\u51b3\u5b9a\u4e4b\u524d\uff0c\u5c3d\u53ef\u80fd\u591a\u5730\u6536\u96c6\u4fe1\u606f\uff0c\u4ee5\u786e\u4fdd\u6210\u529f\u3002"}]}, {"word": "fact", "ipa": "f\u00e6kt", "meanings": {"en": "A thing that is known or proved to be true.", "cn": "\u5df2\u77e5\u6216 ": [{"en": "The police gathered evidence at the crime scene to help identify the perpetrator quickly.", "cn": "\u8b66\u65b9\u5728\u72af\u7f6a\u73b0\u573a\u6536\u96c6\u8bc1\u636e\uff0c\u4ee5\u5e2e\u52a9\u5feb\u901f\u8bc6\u522b\u72af\u7f6a\u8005\u3002"}, {"en": "Scientists need strong evidence to support their theories and publish their research findings.", "cn": "\u79d1\u5b66\u5bb6\u9700\u8981\u5f3a\u6709\u529b\u7684\u8bc1\u636e\u6765\u652f\u6301\u4ed6\u4eec\u7684\u7406\u8bba\u5e76\u53d1\u8868\u4ed6\u4eec\u7684\u7814\u7a76\u7ed3\u679c\u3002"}]}, {"word": "point", "ipa": "p\u0254\u026ant", "meanings": {"en": "A particular spot, place, or position; an idea, opinion, or piece of information that is expressed or considered.", "cn": "\u7279\u5b9a\u7684\u5730\u70b9\u3001\u4f4d\u7f6e\u6216\u65b9\u4f4d\uff1b\u8868\u8fbe\u6216\u8003\u8651\u7684\u60f3\u6cd5\u3001\u89c2\u70b9\u6216\u4fe1\u606f\u3002"}, "usage_en": "Used to indicate a specific idea or argument in a discussion or debate.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u8ba8\u8bba\u6216\u8fa9\u8bba\u4e2d\u7684\u7279\u5b9a\u60f3\u6cd5\u6216\u8bba\u70b9\u3002", "scene_en": "A person making a clear point during a business meeting.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5546\u52a1\u4f1a\u8bae\u4e2d\u63d0\u51fa\u660e\u786e\u7684\u89c2\u70b9\u3002", "image_paths": ["P6_vocabulary_exercises_26_Q10_point_1.png", "P6_vocabulary_exercises_26_Q10_point_2.png"], "examples": [{"en": "He made a valid point about the budget constraints during the project planning meeting.", "cn": "\u4ed6\u5728\u9879\u76ee\u89c4\u5212\u4f1a\u8bae\u4e0a\u5c31\u9884\u7b97\u9650\u5236\u63d0\u51fa\u4e86\u4e00\u4e2a\u6709\u6548\u7684\u89c2\u70b9\u3002"}, {"en": "The main point of the lecture was to highlight the importance of sustainable energy sources.", "cn": "\u8bb2\u5ea7\u7684\u4e3b\u8981\u89c2\u70b9\u662f\u5f3a\u8c03\u53ef\u6301\u7eed\u80fd\u6e90\u7684\u91cd\u8981\u6027\u3002"}]}], "synonym_cn": "\u8bc1\u636e vs \u4fe1\u606f vs \u4e8b\u5b9e vs \u8bba\u70b9", "socratic_questions": [{"question": "If a detective presents a bloody knife at trial linking a suspect to the crime, is this considered 'information', 'fact', 'evidence', or 'point'?", "options": ["information", "fact", "evidence", "point"], "correct_answer": "evidence", "explanation": "Evidence is tangible proof presented to support a claim, like a bloody knife linking a suspect to a crime."}, {"question": "In a debate, if you are trying to persuade someone, are you making an 'information', 'fact', 'evidence', or 'point'?", "options": ["information", "fact", "evidence", "point"], "correct_answer": "point", "explanation": "A point is a specific idea or argument presented in a discussion or debate."}, {"question": "If you read in a news article that the earth is round, is this 'information', 'fact', 'evidence', or 'point'?", "options": ["information", "fact", "evidence", "point"], "correct_answer": "fact", "explanation": "A fact is a statement that is known to be true and can be verified."}, {"question": "A weather report stating the temperature is 30 degrees Celsius is 'information', 'fact', 'evidence', or 'point'?", "options": ["information", "fact", "evidence", "point"], "correct_answer": "information", "explanation": "Information is data or knowledge communicated about a particular fact or circumstance."}]}]};
