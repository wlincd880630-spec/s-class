ctor that allows a patient to obtain medicine."}, {"question": "If someone has a disease, what are they hoping to find?", "options": ["remedy", "recipe", "prescription", "cure"], "correct_answer": "cure", "explanation": "A cure is something that completely eliminates a disease or ailment."}]}, {"id": 3, "stem": "She told a _______ joke to the one I had heard at a party.", "correct_index": 1, "options": [{"word": "same", "ipa": "/se\u026am/", "meanings": {"en": "Exactly alike; not different.", "cn": "\u5b8c\u5168\u4e00\u6837\uff1b\u6ca1\u6709\u4e0d\u540c\u3002"}, "usage_en": "Used to indicate that things are not different.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u4e8b\u7269\u6ca1\u6709\u4e0d\u540c\u3002", "scene_en": "Two identical red apples sitting side by side on a table.", "scene_cn": "\u4e24\u4e2a\u5b8c\u5168\u4e00\u6837\u7684\u7ea2\u82f9\u679c\u5e76\u6392\u653e\u5728\u684c\u5b50\u4e0a\u3002", "image_prompts": ["two identical red apples", "cloned objects"], "image_paths": ["P6_vocabulary_exercises_3_Q3_same_1.png", "P6_vocabulary_exercises_3_Q3_same_2.png"], "examples": [{"en": "We ordered the same pizza, but mine had extra cheese on top.", "cn": "\u6211\u4eec\u70b9\u4e86\u540c\u6837\u7684\u62ab\u8428\uff0c\u4f46\u6211\u7684\u4e0a\u9762\u6709\u989d\u5916\u7684\u5976\u916a\u3002"}, {"en": "They wore the same dress to the party, causing an awkward moment.", "cn": "\u5979\u4eec\u7a7f\u7740\u540c\u6837\u7684\u88d9\u5b50\u53c2\u52a0\u805a\u4f1a\uff0c\u5bfc\u81f4\u4e86\u4e00\u4e2a\u5c34\u5c2c\u7684\u65f6\u523b\u3002"}], "quiz_distractors": []}, {"word": "similar", "ipa": "/\u02c8s\u026am\u026al\u0259r/", "meanings": {"en": "Having a resemblance in appearance, character, or quantity, without being exactly the same.", "cn": "\u5728\u5916\u8c8c\u3001\u6027\u683c\u6216\u6570\u91cf\u4e0a\u5177\u6709\u76f8\u4f3c\u4e4b\u5904\uff0c\u4f46\u5e76\u4e0d\u5b8c\u5168\u76f8\u540c\u3002"}, "usage_en": "Used to describe things that share common characteristics.", "usage_cn": "\u7528\u iar, reminding him of his childhood summers at the lake.", "cn": "\u8fd9\u9996\u65cb\u5f8b\u5f88\u719f\u6089\uff0c\u8ba9\u4ed6\u60f3\u8d77\u4e86\u4ed6\u5728\u6e56\u8fb9\u5ea6\u8fc7\u7684\u7ae5\u5e74\u590f\u5929\u3002"}], "quiz_distractors": []}, {"word": "identical", "ipa": "/a\u026a\u02c8d\u025bnt\u026ak\u0259l/", "meanings": {"en": "Exactly alike or exactly the same.", "cn": "\u5b8c\u5168\u4e00\u6837\u6216\u5b8c\u5168\u76f8\u540c\u3002"}, "usage_en": "Used to describe things that are exactly the same in every detail.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u6bcf\u4e2a\u7ec6\u8282\u4e0a\u90fd\u5b8c\u5168\u76f8\u540c\u7684\u4e8b\u7269\u3002", "scene_en": "Two identical twins standing side by side.", "scene_cn": "\u4e00\u5bf9\u5b8c\u5168\u4e00\u6837\u7684\u53cc\u80de\u80ce\u5e76\u6392\u7ad9\u7740\u3002", "image_prompts": ["identical twins", "perfectly matched objects"], "image_paths": ["P6_vocabulary_exercises_3_Q3_identical_1.png", "P6_vocabulary_exercises_3_Q3_identical_2.png"], "examples": [{"en": "The two fingerprints were identical, proving he was at the crime scene.", "cn": "\u8fd9\u4e24\u4e2a\u6307\u7eb9\u5b8c\u5168\u76f8\u540c\uff0c\u8bc1\u660e\u4ed6\u5f53\u65f6\u5728\u72af\u7f6a\u73b0\u573a\u3002"}, {"en": "The two cars were identical models, making it hard to tell them apart.", "cn": "\u8fd9\u4e24\u8f86\u8f66\u662f\u5b8c\u5168\u76f8\u540c\u7684\u578b\u53f7\uff0c\u5f88\u96be\u533a\u5206\u5b83\u4eec\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u76f8\u4f3c\u7684\uff0c\u7c7b\u4f3c\u7684\uff0c\u76f8\u50cf\u7684", "socratic_questions": [{"question": "If two paintings share several common elements but aren't exact copies, which word describes their relationship?", "options": ["same", "similar", "familiar", "identical"], "correct_answer": "similar", "explanation": "Similar indicates resemblance without being exactly the same."}, {"question": "Which word describes something you've encountered before and recognize?", "options": ["same", "similar", "familiar", "identical"], "correct_answer": "familiar", "explanation": "Familiar describes something known or recognized from past experience."}, {"question": "If two objects are absolutely indistinguishable in every aspect, which term applies?", "options": ["same", "similar", "familiar", "identical"], "correct_answer": "identical", "explanation": "Identical means exactly alike or exactly the same."}, {"question": "If you and your friend are wearing the exact same shirt, which word describes the shirts?", "options": ["same", "similar", "familiar", "identical"], "correct_answer": "same", "explanation": "Same means exactly alike; not different."}]}, {"id": 4, "stem": "When I've _______ enough money, I'm going to buy a computer.", "correct_index": 0, "options": [{"word": "accumulated", "ipa": "/\u0259\u02c8kju\u02d0mj\u0259\u02ccle\u026at\u026ad/", "meanings": {"en": "Gradually gathered or acquired over time.", "cn": "\u968f\u7740\u65f6\u95f4\u7684\u63a8\u79fb\u9010\u6e10\u6536\u96c6\u6216\u83b7\u5f97\u3002"}, "usage_en": "Used to describe the gradual gathering of something, often wealth or knowledge.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u7684\u9010\u6e10\u79ef\u7d2f\uff0c\u901a\u5e38\u662f\u8d22\u5bcc\u6216\u77e5\u8bc6\u3002", "scene_en": "A person saving money in a piggy bank over several months.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u51e0\u4e2a\u6708\u5185\u5c06\u94b1\u5b58\u5165\u5b58\u94b1\u7f50\u3002", "image_prompts": ["Piggy bank gradually filling with coins", "Books stacked higher and higher over time"], "image_paths": ["P6_vocabulary_exercises_3_Q4_accumulated_1.png", "P6_vocabulary_exercises_3_Q4_accumulated_2.png"], "examples": [{"en": "She accumulated a large collection of rare books throughout her academic career.", "cn": "\u5728\u5979\u7684\u5b66\u672f\u751f\u6daf\u4e2d\uff0c\u5979\u79ef\u7d2f\u4e86\u5927\u91cf\u7684\u73cd\u7a00\u4e66\u7c4d\u3002"}, {"en": "Over the years, he accumulated a significant amount of wealth through wise investments.", "cn": "\u591a\u5e74\u6765\uff0c\u4ed6\u901a\u8fc7\u660e\u667a\u7684\u6295\u8d44\u79ef\u7d2f\u4e86\u5927\u91cf\u7684\u8d22\u5bcc\u3002"}], "quiz_distractors": []}, {"word": "assembled", "ipa": "/\u0259\u02c8s\u025bmb\u0259ld/", "meanings": {"en": "Put together or fitted together.", "cn": "\u7ec4\u88c5\u5728\u4e00\u8d77\u6216\u88c5\u914d\u5728\u4e00\u8d77\u3002"}, "usage_en": "Refers to the act of putting parts together to form a complete object.", "usage_cn": "\u6307\u5c06\u96f6\u4ef6\u7ec4\u88c5\u5728\u4e00\u8d77\u4ee5\u5f62\u6210\u5b8c\u6574\u7269\u4f53\u7684\u884c\u4e3a\u3002", "scene_en": "A person putting together a piece of furniture from a flatpack.", "scene_cn": "\u4e00\u4e2a\u4eba\u6b63\u5728\u7ec4\u88c5\u5e73\u677f\u5305\u88c5\u4e2d\u7684\u4e00\u4ef6\u5bb6\u5177\u3002", "image_prompts": ["Hands assembling a complex machine", "A fully assembled car on a production line"], "image_paths": ["P6_vocabulary_exercises_3_Q4_assembled_1.png", "P6_vocabulary_exercises_3_Q4_assembled_2.png"], "examples": [{"en": "The students assembled the robot from the kit provided by the engineering department.", "cn": "\u5b66\u751f\u4eec\u7528\u5de5\u7a0b\u7cfb\u63d0\u4f9b\u7684\u5de5\u5177\u5305\u7ec4\u88c5\u4e86\u673a\u5668\u4eba\u3002"}, {"en": "The team carefully assembled the intricate model airplane, following the detailed instructions.", "cn": "\u8be5\u56e2\u961f\u4ed4\u7ec6\u5730\u7ec4\u88c5\u4e86\u590d\u6742\u7684\u98de\u673a\u6a21\u578b\uff0c\u5e76\u9075\u5faa\u4e86\u8be6\u7ec6\u7684\u8bf4\u660e\u3002"}], "quiz_distractors": []}, {"word": "afforded", "ipa": "/\u0259\u02c8f\u0254\u02d0rd\u026ad/", "meanings": {"en": "Had enough money to pay for something.", "cn": "\u6709\u8db3\u591f\u7684\u94b1\u6765\u652f\u4ed8\u67d0\u7269\u3002"}, "usage_en": "Indicates the ability to pay for something without financial strain.", "usage_cn": "\u8868\u793a\u6709\u80fd\u529b\u652f\u4ed8\u67d0\u7269\u800c\u6ca1\u6709\u7ecf\u6d4e\u538b\u529b\u3002", "scene_en": "A person happily buying a
