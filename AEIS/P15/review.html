 "awe", "gaped"], "correct_answer": "marveled", "explanation": "Marveled suggests a feeling of great wonder and amazement, fitting the experience of seeing a natural wonder."}]}, {"id": 5, "stem": "We plan to engage some comedians to _______ the party.", "correct_index": 3, "options": [{"word": "boost", "ipa": "bu\u02d0st", "meanings": {"en": "To increase or improve something; to push something up.", "cn": "\u589e\u52a0\u6216\u6539\u5584\u67d0\u4e8b\u7269\uff1b\u5411\u4e0a\u63a8\u67d0\u7269\u3002"}, "usage_en": "Often used to describe improving performance or morale.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u63d0\u9ad8\u6027\u80fd\u6216\u58eb\u6c14\u3002", "scene_en": "A graph showing an upward trend, or a person giving a thumbs-up.", "scene_cn": "\u663e\u793a\u4e0a\u5347\u8d8b\u52bf\u7684\u56fe\u8868\uff0c\u6216\u4e00\u4e2a\u4eba\u7ad6\u8d77\u5927\u62c7\u6307\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q5_boost_1.png", "P6_vocabulary_exercises_15_Q5_boost_2.png"], "examples": [{"en": "The company took steps to boost employee morale by offering flexible work hours.", "cn": "\u516c\u53f8\u91c7\u53d6\u63aa\u65bd\uff0c\u901a\u8fc7\u63d0\u4f9b\u7075\u6d3b\u7684\u5de5\u4f5c\u65f6\u95f4\u6765\u63d0\u9ad8\u5458\u5de5\u7684\u58eb\u6c14\u3002"}, {"en": "A good night's sleep can boost your energy levels and improve your focus.", "cn": "\u4e00\u4e2a\u826f\u597d\u7684\u7761\u7720\u53ef\u4ee5\u63d0\u9ad8\u4f60\u7684\u80fd\u91cf\u6c34\u5e73\uff0c\u5e76\u63d0\u9ad8\u4f60\u7684\u6ce8\u610f\u529b\u3002"}]}, {"word": "brighten", "ipa": "\u02c8bra\u026at\u0259n", "meanings": {"en": "To make something lighter or more cheerful; to illuminate.", "cn": "\u4f7f\u67d0\u7269\u66f4\u660e\u4eae\u6216\u66f4\u5feb\u4e50\uff1b\u7167\u4eae\u3002"}, "usage_en": "Used to describe making something physically or emotionally lighter.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4f7f\u67d0\u7269\u5728\u7269\u7406\u4e0a\u6216\u60c5\u611f\u4e0a\u66f4\u8f7b\u677e\u3002", "scene_en": "A sunny day after a storm, or a person smiling broadly.", "scene_cn": "\u66b4\u98ce\u96e8\u540e\u7684\u6674\u5929\uff0c\u6216\u4e00\u4e2a\u4eba\u707f\u70c2\u7684\u7b11\u5bb9\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q5_brighten_1.png", "P6_vocabulary_exercises_15_Q5_brighten_2.png"], "examples": [{"en": "Flowers can brighten any room and bring a sense of joy and peace.", "cn": "\u9c9c\u82b1\u53ef\u4ee5\u70b9\u4eae\u4efb\u4f55\u623f\u95f4\uff0c\u5e26\u6765\u6b22\u4e50\u548c\u5b81\u9759\u7684\u611f\u89c9\u3002"}, {"en": "A kind word can brighten someone's day and make them feel appreciated.", "cn": "\u4e00\u53e5\u53cb\u5584\u7684\u8bdd\u53ef\u4ee5\u70b9\u4eae\u67d0\u4eba\u7684\u4e00\u5929\uff0c\u8ba9\u4ed6\u4eec\u611f\u5230\u88ab\u6b23\u8d4f\u3002"}]}, {"word": "endure", "ipa": "\u026an\u02c8dj\u028a\u0259r", "meanings": {"en": "To withstand or tolerate something difficult or painful.", "cn": "\u627f\u53d7\u6216\u5bb9\u5fcd\u56f0\u96be\u6216\u75db\u82e6\u7684\u4e8b\u7269\u3002"}, "usage_en": "Often used in the context of hardship or challenges.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u56f0\u82e6\u6216\u6311\u6218\u3002", "scene_en": "A person climbing a steep mountain, or a plant surviving in a harsh environment.", "scene_cn": "\u4e00\u4e2a\u4eba\u6500\u767b\u9661\u5ced\u7684\u5c71\u5cf0\uff0c\u6216\u4e00\u79cd\u690d\u7269\u5728\u6076\u52a3\u73af\u5883\u4e2d\u751f\u5b58\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q5_endure_1.png", "P6_vocabulary_exercises_15_Q5_endure_2.png"], "examples": [{"en": "She had to endure a lot of hardship to achieve her goals in life.", "cn": "\u5979\u5fc5\u987b\u5fcd\u53d7\u8bb8\u591a\u82e6\u96be\u624d\u80fd\u5b9e\u73b0\u5979\u7684\u4eba\u751f\u76ee\u6807\u3002"}, {"en": "Some plants can endure extreme temperatures and still thrive in the desert.", "cn": "\u6709\u4e9b\u690d\u7269\u53ef\u4ee5\u5fcd\u53d7\u6781\u7aef\u6e29\u5ea6\uff0c\u5e76\u4e14\u4ecd\u7136\u5728\u6c99\u6f20\u4e2d\u8301\u58ee\u6210\u957f\u3002"}]}, {"word": "enliven", "ipa": "\u026an\u02c8la\u026av\u0259n", "meanings": {"en": "To make something more lively or animated; to add zest.", "cn": "\u4f7f\u67d0\u7269\u66f4\u751f\u52a8\u6216\u6d3b\u8dc3\uff1b\u589e\u6dfb\u8da3\u5473\u3002"}, "usage_en": "Used to describe making an event or atmosphere more exciting.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4f7f\u6d3b\u52a8\u6216\u6c14\u6c1b\u66f4\u52a0\u6fc0\u52a8\u4eba\u5fc3\u3002", "scene_en": "A lively party with music and dancing, or a colorful street festival.", "scene_cn": "\u4e00\u4e2a\u5145\u6ee1\u97f3\u4e50\u548c\u821e\u8e48\u7684\u70ed\u95f9\u6d3e\u5bf9\uff0c\u6216\u4e00\u4e2a\u8272\u5f69\u7f24\u7eb7\u7684\u8857\u5934\u8282\u65e5\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q5_enliven_1.png", "P6_vocabulary_exercises_15_Q5_enliven_2.png"], "examples": [{"en": "The band's energetic performance helped to enliven the entire concert venue.", "cn": "\u4e50\u961f\u5145\u6ee1\u6d3b\u529b\u7684\u8868\u6f14\u6709\u52a9\u4e8e\u6d3b\u8dc3\u6574\u4e2a\u97f3\u4e50\u4f1a\u573a\u5730\u3002"}, {"en": "Adding some colorful decorations can enliven a dull and boring office space.", "cn": "\u6dfb\u52a0\u4e00\u4e9b\u8272\u5f69\u9c9c\u8273\u7684\u88c5\u9970\u54c1\u53ef\u4ee5\u6d3b\u8dc3\u4e00\u4e2a\u6c89\u95f7\u800c\u65e0\u804a\u7684\u529e\u516c\u7a7a\u95f4\u3002"}]}], "synonym_cn": "\u6d3b\u8dc3\uff0c\u4f7f\u751f\u673a\u52c3\u52c3", "socratic_questions": [{"question": "If you want to make a presentation more interesting, you might try to _______ it with humor.", "options": ["boost", "brighten", "endure", "enliven"], "correct_answer": "enliven", "explanation": "Enliven means to make something more lively or animated."}, {"question": "To support a team's morale, what action would you take to _______ their spirits before a big game?", "options": ["boost", "brighten", "endure", "enliven"], "correct_answer": "boost", "explanation": "Boost means to increase or improve something."}, {"question": "After a long day, a colorful sunset can _______ vements, birth records, or completion of training.", "usage_cn": "\u7528\u4e8e\u5b66\u672f\u6210\u5c31\u3001\u51fa\u751f\u8bb0\u5f55\u6216\u5b8c\u6210\u57f9\u8bad\u3002", "scene_en": "A student receiving a graduation certificate at a ceremony.", "scene_cn": "\u5b66\u751f\u5728\u5178\u793c\u4e0a\u83b7\u5f97\u6bd5\u4e1a\u8bc1\u4e66\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q6_certificate_1.png", "P6_vocabulary_exercises_15_Q6_certificate_2.png"], "examples": [{"en": "He received a certificate of completion after finishing the first aid training course.", "cn": "\u5b8c\u6210\u6025\u6551\u57f9\u8bad\u8bfe\u7a0b\u540e\uff0c\u4ed6\u6536\u5230\u4e86\u7ed3\u4e1a\u8bc1\u4e66\u3002"}, {"en": "The company requires a health certificate from all employees before they start working.", "cn": "\u516c\u53f8\u8981\u6c42\u6240\u6709\u5458\u5de5\u5728\u5f00\u59cb\u5de5\u4f5c\u524d\u63d0\u4f9b\u5065\u5eb7\u8bc1\u660e\u3002"}]}, {"word": "permit", "ipa": "/\u02c8p\u025c\u02d0rm\u026at/", "meanings": {"en": "An official document giving someone authorization to do something.", "cn": "\u6388\u6743\u67d0\u4eba\u505a\u67d0\u4e8b\u7684\u5b98\u65b9\u6587\u4ef6\u3002"}, "usage_en": "Used for construction, parking, or special events.", "usage_cn": "\u7528\u4e8e\u5efa\u7b51\u3001\u505c\u8f66\u6216\u7279\u6b8a\u6d3b\u52a8\u3002", "scene_en": "A construction site with a visible building permit posted.", "scene_cn": "\u4e00\u4e2a\u5f20\u8d34\u7740\u53ef\u89c1\u5efa\u7b51\u8bb8\u53ef\u8bc1\u7684\u5efa\u7b51\u5de5\u5730\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q6_permit_1.png", "P6_vocabulary_exercises_15_Q6_permit_2.png"], "examples": [{"en": "You need a parking permit to park your car in the university campus parking lots.", "cn": "\u60a8\u9700\u8981\u505c\u8f66\u8bb8\u53ef\u8bc1\u624d\u80fd\u5c06\u8f66\u505c\u5728\u5927\u5b66\u6821\u56ed\u505c\u8f66\u573a\u3002"}, {"en": "The city requires a building permit before any major construction work can commence.", "cn": "\u5728\u5f00\u59cb\u4efb\u4f55\u91cd\u5927\u5efa\u7b51\u5de5\u7a0b\u4e4b\u524d\uff0c\u8be5\u5e02\u9700\u8981\u5efa\u7b51\u8bb8\u53ef\u8bc1\u3002"}]}, {"word": "award", "ipa": "/\u0259\u02c8w\u0254\u02d0rd/", "meanings": {"en": "Something given to someone as a recognition of their merit.", "cn": "\u4f5c\u4e3a\u5bf9\u5176\u4f18\u70b9\u8ba4\u53ef\u800c\u7ed9\u4e88\u67d0\u4eba\u7684\u4e1c\u897f\u3002"}, "usage_en": "Given for achievements in sports, academics, or professional fields.", "usage_cn": "\u56e0\u5728\u4f53\u80b2\u3001\u5b66\u672f\u6216\u4e13\u4e1a\u9886\u57df\u7684\u6210\u5c31\u800c\u83b7\u5f97\u3002", "scene_en": "A person receiving an award on stage at an awards ceremony.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u9881\u5956\u5178\u793c\u7684\u821e\u53f0\u4e0a\u63a5\u53d7\u5956\u9879\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q6_award_1.png", "P6_vocabulary_exercises_15_Q6_award_2.png"], "examples": [{"en": "She received an award for her outstanding contributions to the field of medical research.", "cn": "\u5979\u56e0\u5bf9\u533b\u5b66\u7814\u7a76\u9886\u57df\u7684\u6770\u51fa\u8d21\u732e\u800c\u83b7\u5f97\u4e86\u5956\u9879\u3002"}, {"en": "The company gives an employee of the month award to recognize exceptional performance.", "cn": "\u516c\u53f8\u9881\u53d1\u6bcf\u6708\u6700\u4f73\u5458\u5de5\u5956\uff0c\u4ee5\u8868\u5f70\u5353\u8d8a\u8868\u73b0\u3002"}]}], "synonym_cn": "\u8bc1\u660e\u6587\u4ef6", "socratic_questions": [{"question": "Which document grants permission to operate a vehicle?", "options": ["license", "certificate", "permit", "award"], "correct_answer": "license", "explanation": "A license grants permission to do something."}, {"question": "Which document confirms completion of a training course?", "options": ["license", "certificate", "permit", "award"], "correct_answer": "certificate", "explanation": "A certificate confirms completion or achievement."}, {"question": "Which document grants temporary permission for a specific activity?", "options": ["license", "certificate", "permit", "award"], "correct_answer": "permit", "explanation": "A permit allows a specific action for a limited time."}, {"question": "Which is given to recognize outstanding achievement?", "options": ["license", "certificate", "permit", "award"], "correct_answer": "award", "explanation": "An award recognizes merit or excellence."}]}, {"id": 7, "stem": "I used to _______ this caf\u00e9, but not anymore.", "correct_index": 0, "options": [{"word": "frequent", "ipa": "/\u02c8fri\u02d0kw\u0259nt/", "meanings": {"en": "To visit a place often or regularly.", "cn": "\u7ecf\u5e38\u6216\u5b9a\u671f\u8bbf\u95ee\u67d0\u4e2a\u5730\u65b9\u3002"}, "usage_en": "Used to describe regularly visiting a place.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5b9a\u671f\u8bbf\u95ee\u67d0\u4e2a\u5730\u65b9\u3002", "scene_en": "A person regularly visiting a coffee shop, a library, or a park.", "scene_cn": "\u4e00\u4e2a\u4eba\u5b9a\u671f\u8bbf\u95ee\u5496\u5561\u5e97\u3001\u56fe\u4e66\u9986\u6216\u516c\u56ed\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q7_frequent_1.png", "P6_vocabulary_exercises_15_Q7_frequent_2.png"], "examples": [{"en": "I used to frequent the library downtown when I was researching my thesis.", "cn": "\u6211\u8fc7\u53bb\u5e38\u5e38\u53bb\u5e02\u4e2d\u5fc3\u7684\u56fe\u4e66\u9986\uff0c\u5f53\u65f6\u6211\u6b63\u5728\u7814\u7a76\u6211\u7684\u8bba\u6587\u3002"}, {"en": "She frequents the local bakery every morning to buy fresh bread for breakfast.", "cn": "\u5979\u6bcf\u5929\u65e9\u4e0a\u90fd\u5149\u987e\u5f53\u5730\u7684\u9762\u5305\u5e97\uff0c\u8d2d\u4e70\u65b0\u9c9c\u7684\u9762\u5305\u4f5c\u4e3a\u65e9\u9910\u3002"}]}, {"word": "oblige", "ipa": "/\u0259\u02c8bla\u026ad\u0292/", "meanings": {"en": "To make (someone) legally or morally bound to do something.", "cn": "\u4f7f\uff08\u67d0\u4eba\uff09\u5728\u6cd5\u5f8b\u4e0a\u6216\u9053\u5fb7\u4e0a\u5fc5\u987b\u505a\u67d0\u4e8b\u3002"}, "usage_en": "Used to express a sense of duty or legal requirement.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u8d23\u4efb\u611f\u6216\u6cd5\u5f8b\u8981\u6c42\u3002", "scene_en": "A person signing a contract, or feeling bound by a promise.", "scene_cn": "\u4e00\u4e2a\u4eba\u7b7e\u7f72\u5408\u540c\uff0c\u6216\u611f\u5230\u53d7\u627f\u8bfa\u7684\u7ea6\u675f\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q7_oblige_1.png", "P6_vocabulary_exercises_15_Q7_oblige_2.png"], "examples": [{"en": "The contract obliges the company to provide health insurance for all its employees.", "cn": "\u5408\u540c\u89c4\u5b9a\u516c\u53f8\u6709\u4e49\u52a1\u4e3a\u6240\u6709\u5458\u5de5\u63d0\u4f9b\u5065\u5eb7\u4fdd\u9669\u3002"}, {"en": "I felt obliged to help my neighbor after he helped me move last month.", "cn": "\u5728\u4ed6\u4e0a\u4e2a\u6708\u5e2e\u6211\u642c\u5bb6\u540e\uff0c\u6211\u89c9\u5f97\u6709\u4e49\u52a1\u5e2e\u52a9\u6211\u7684\u90bb\u5c45\u3002"}]}, {"word": "entertain", "ipa": "/\u02ccent\u0259r\u02c8te\u026an/", "meanings": {"en": "To provide amusement or enjoyment to someone.", "cn": "\u4e3a\u67d0\u4eba\u63d0\u4f9b\u5a31\u4e50\u6216\u4eab\u53d7\u3002"}, "usage_en": "Used to describe providing amusement or hosting guests.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u63d0\u4f9b\u5a31\u4e50\u6216\u62db\u5f85\u5ba2\u4eba\u3002", "scene_en": "A comedian performing on stage, or a host welcoming guests into their home.", "scene_cn": "\u4e00\u4f4d\u559c\u5267\u6f14\u5458\u5728\u821e\u53f0\u4e0a\u8868\u6f14\uff0c\u6216\u4e00\u4f4d\u4e3b\u4eba\u6b22\u8fce\u5ba2\u4eba\u8fdb\u5165\u4ed6\u4eec\u7684\u5bb6\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q7_entertain_1.png", "P6_vocabulary_exercises_15_Q7_entertain_2.png"], "examples": [{"en": "The magician entertained the children with his amazing tricks and illusions.", "cn": "\u9b54\u672f\u5e08\u7528\u4ed6\u60ca\u4eba\u7684\u6280\u5de7\u548c\u5e7b\u89c9\u5a31\u4e50\u4e86\u5b69\u5b50\u4eec\u3002"}, {"en": "We like to entertain friends and family at our house during the holidays.", "cn": "\u6211\u4eec\u559c\u6b22\u5728\u5047\u671f\u671f\u95f4\u5728\u5bb6\u62db\u5f85\u670b\u53cb\u548c\u5bb6\u4eba\u3002"}]}, {"word": "support", "ipa": "/s\u0259\u02c8p\u0254\u02d0rt/", "meanings": {"en": "To give assistance to, especially financially; enable to function or act.", "cn": "\u7ed9\u4e88\u5e2e\u52a9\uff0c\u7279\u522b\u662f\u7ecf\u6d4e\u4e0a\u7684\u5e2e\u52a9\uff1b\u4f7f\u80fd\u591f\u8fd0\u4f5c\u6216\u884c\u52a8\u3002"}, "usage_en": "Used to describe providing assistance or encouragement.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u63d0\u4f9b\u5e2e\u52a9\u6216\u9f13\u52b1\u3002", "scene_en": "People donating to a charity, or a friend offering encouragement to another.", "scene_cn": "\u4eba\u4eec\u5411\u6148\u5584\u673a\u6784\u6350\u6b3e\uff0c\u6216\u670b\u53cb\u4e92\u76f8\u9f13\u52b1\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q7_support_1.png", "P6_vocabulary_exercises_15_Q7_support_2.png"], "examples": [{"en": "I support local businesses by buying my groceries from the farmer's market.", "cn": "\u6211\u901a\u8fc7\u4ece\u519c\u8d38\u5e02\u573a\u8d2d\u4e70\u98df\u54c1\u6765\u652f\u6301\u5f53\u5730\u4f01\u4e1a\u3002"}, {"en": "My family has always supported my dreams, no matter how unrealistic they seemed.", "cn": "\u65e0\u8bba\u6211\u7684\u68a6\u60f3\u770b\u8d77\u6765\u591a\u4e48\u4e0d\u5207\u5b9e\u9645\uff0c\u6211\u7684\u5bb6\u4eba\u603b\u662f\u652f\u6301\u6211\u7684\u68a6\u60f3\u3002"}]}], "synonym_cn": "\u5149\u987e vs. \u8d23\u5907 vs. \u62db\u5f85 vs. \u652f\u6301", "socratic_questions": [{"question": "If a local business is struggling, which action shows your commitment to its survival?", "options": ["support", "frequent", "oblige", "entertain"], "correct_answer": "support", "explanation": "To 'support' means to give assistance to, enabling the business to continue operating."}, {"question": "When you feel morally bound to fulfill a promise, which word describes your situation?", "options": ["oblige", "entertain", "frequent", "support"], "correct_answer": "oblige", "explanation": "To 'oblige' means to feel compelled or required to do something, often due to a sense of duty."}, {"question": "If you visit a restaurant regularly, which verb describes your behavior?", "options": ["frequent", "entertain", "support", "oblige"], "correct_answer": "frequent", "explanation": "To 'frequent' means to visit a place often or regularly."}, {"question": "If you are hosting a party for your friends, what are you trying to do?", "options": ["entertain", "oblige", "support", "frequent"], "correct_answer": "entertain", "explanation": "To 'entertain' means to provide amusement or enjoyment."}]}, {"id": 9, "stem": "Please do not _______ the situation by spreading more gossip.", "correct_index": 2, "options": [{"word": "explode", "ipa": "/\u026ak\u02c8splo\u028ad/", "meanings": {"en": "To burst or shatter violently and noisily as a result of rapid combustion, decomposition, or other chemical reaction.", "cn": "\u7531\u4e8e\u5feb\u901f\u71c3\u70e7\u3001\u5206\u89e3\u6216\u5176\u4ed6\u5316\u5b66\u53cd\u5e94\u800c\u731b\u70c8\u4e14\u5608\u6742\u5730\u7206\u88c2\u6216\u7834\u788e\u3002"}, "usage_en": "Used to describe a sudden and violent release of energy or a sudden increase in something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u80fd\u91cf\u7684\u7a81\u7136\u548c\u731b\u70c8\u7684\u91ca\u653e\u6216\u67d0\u7269\u7684\u7a81\u7136\u589e\u52a0\u3002", "scene_en": "A building collapsing after a bomb detonates inside.", "scene_cn": "\u5efa\u7b51\u7269\u5728\u70b8\u5f39\u5728\u5176\u5185\u90e8\u5f15\u7206\u540e\u5012\u584c\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q9_explode_1.png", "P6_vocabulary_exercises_15_Q9_explode_2.png"], "examples": [{"en": "The old boiler finally exploded, sending shrapnel flying everywhere in the basement.", "cn": "\u65e7\u9505\u7089\u6700\u7ec8\u7206\u70b8\u4e86\uff0c\u5c06\u5f39\u7247\u98de\u6e85\u5230\u5730\u4e0b\u5ba4\u7684\u6bcf\u4e2a\u5730\u65b9\u3002"}, {"en": "The population of the city exploded after the new factory opened, creating housing shortages.", "cn": "\u65b0\u5de5\u5382\u5f00\u4e1a\u540e\uff0c\u57ce\u5e02\u4eba\u53e3\u6fc0\u589e\uff0c\u9020\u6210\u4f4f\u623f\u77ed\u7f3a\u3002"}]}, {"word": "antagonize", "ipa": "/\u00e6n\u02c8t\u00e6\u0261\u0259na\u026az/", "meanings": {"en": "To cause someone to become hostile.", "cn": "\u5bfc\u81f4\u67d0\u4eba\u53d8\u5f97\u6709\u654c\u610f\u3002"}, "usage_en": "To provoke or irritate someone, often intentionally.", "usage_cn": "\u6fc0\u6012\u6216\u523a\u6fc0\u67d0\u4eba\uff0c\u901a\u5e38\u662f\u6545\u610f\u7684\u3002", "scene_en": "A person deliberately provoking another person during an argument.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u4e89\u5435\u4e2d\u6545\u610f\u6311\u8845\u53e6\u4e00\u4e2a\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q9_antagonize_1.png", "P6_vocabulary_exercises_15_Q9_antagonize_2.png"], "examples": [{"en": "He didn't want to antagonize his boss, so he kept his opinions to himself.", "cn": "\u4ed6\u4e0d\u60f3\u4e0e\u8001\u677f\u4f5c\u5bf9\uff0c\u6240\u4ee5\u4ed6\u628a\u81ea\u5df1\u7684\u610f\u89c1\u653e\u5728\u5fc3\u91cc\u3002"}, {"en": "It's never a good idea to antagonize the waiter; you might get bad service later.", "cn": "\u4e0e\u670d\u52a1\u5458\u4f5c\u5bf9\u7edd\u4e0d\u662f\u4e00\u4e2a\u597d\u4e3b\u610f\uff1b\u4f60\u4ee5\u540e\u53ef\u80fd\u4f1a\u5f97\u5230\u4e0d\u597d\u7684\u670d\u52a1\u3002"}]}, {"word": "fuel", "ipa": "/\u02c8fju\u02d0\u0259l/", "meanings": {"en": "To stimulate or intensify (a feeling or situation).", "cn": "\u523a\u6fc0\u6216\u52a0\u5267\uff08\u4e00\u79cd\u611f\u89c9\u6216\u60c5\u51b5\uff09\u3002"}, "usage_en": "To add to or strengthen something, often something negative.", "usage_cn": "\u589e\u52a0\u6216\u52a0\u5f3a\u67d0\u4e8b\u7269\uff0c\u901a\u5e38\u662f\u8d1f\u9762\u7684\u4e8b\u7269\u3002", "scene_en": "A person adding wood to a fire, making it burn brighter.", "scene_cn": "\u4e00\u4e2a\u4eba\u5f80\u706b\u91cc\u52a0\u6728\u5934\uff0c\u4f7f\u706b\u70e7\u5f97\u66f4\u65fa\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q9_fuel_1.png", "P6_vocabulary_exercises_15_Q9_fuel_2.png"], "examples": [{"en": "His angry speech only fueled the protesters' rage, making the situation even more tense.", "cn": "\u4ed6\u6124\u6012\u7684\u6f14\u8bb2\u53ea\u4f1a\u52a9\u957f\u6297\u8bae\u8005\u7684\u6124\u6012\uff0c\u4f7f\u5c40\u52bf\u66f4\u52a0\u7d27\u5f20\u3002"}, {"en": "The constant media coverage fueled public interest in the trial, making it a spectacle.", "cn": "\u5a92\u4f53\u7684\u6301\u7eed\u62a5\u9053\u6fc0\u8d77\u4e86\u516c\u4f17\u5bf9\u5ba1\u5224\u7684\u5174\u8da3\uff0c\u4f7f\u5176\u6210\u4e3a\u4e00\u573a\u95f9\u5267\u3002"}]}, {"word": "aggravate", "ipa": "/\u02c8\u00e6\u0261r\u0259ve\u026at/", "meanings": {"en": "To make (a problem, injury, or other undesirable situation) worse or more serious.", "cn": "\u4f7f\uff08\u95ee\u9898\u3001\u4f24\u5bb3\u6216\u5176\u4ed6\u4e0d\u826f\u60c5\u51b5\uff09\u53d8\u5f97\u66f4\u7cdf\u6216\u66f4\u4e25\u91cd\u3002"}, "usage_en": "To worsen or intensify a negative situation or condition.", "usage_cn": "\u4f7f\u8d1f\u9762\u60c5\u51b5\u6216\u6761\u4ef6\u6076\u5316\u6216\u52a0\u5267\u3002", "scene_en": "A person picking at a wound, making it bleed more.", "scene_cn": "\u4e00\u4e2a\u4eba\u6311\u4f24\u53e3\uff0c\u4f7f\u5176\u6d41\u8840\u66f4\u591a\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q9_aggravate_1.png", "P6_vocabulary_exercises_15_Q9_aggravate_2.png"], "examples": [{"en": "Running on his injured ankle would only aggravate the pain and delay his recovery.", "cn": "\u5728\u4ed6\u7684\u53d7\u4f24\u7684\u811a\u8e1d\u4e0a\u8dd1\u6b65\u53ea\u4f1a\u52a0\u91cd\u75bc\u75db\u5e76\u5ef6\u8bef\u4ed6\u7684\u5eb7\u590d\u3002"}, {"en": "Ignoring the problem will only aggravate the situation; we need to address it directly.", "cn": "\u5ffd\u89c6\u8fd9\u4e2a\u95ee\u9898\u53ea\u4f1a\u4f7f\u60c5\u51b5\u6076\u5316\uff1b\u6211\u4eec\u9700\u8981\u76f4\u63a5\u89e3\u51b3\u5b83\u3002"}]}], "synonym_cn": "\u52a0\u5267, \u4f7f\u6076\u5316", "socratic_questions": [{"question": "If someone is already upset, would you want to _______ them further by being rude?", "options": ["explode", "antagonize", "fuel", "aggravate"], "correct_answer": "antagonize", "explanation": "Antagonizing means to provoke someone to be angry."}, {"question": "If a small fire starts, would you want to _______ it with gasoline, making it much worse?", "options": ["fuel", "aggravate", "explode", "antagonize"], "correct_answer": "fuel", "explanation": "Fueling means to increase or intensify something."}, {"question": "If a bomb is unstable, what might you expect it to do?", "options": ["aggravate", "explode", "antagonize", "fuel"], "correct_answer": "explode", "explanation": "Exploding means to burst or shatter violently."}, {"question": "If a minor injury is not treated, will it likely _______ and become more painful?", "options": ["fuel", "explode", "aggravate", "antagonize"], "correct_answer": "aggravate", "explanation": "Aggravating means to make something worse or more serious."}]}, {"id": 10, "stem": "Crude oil is _______ into various grades and type of oil and petrol", "correct_index": 3, "options": [{"word": "filtered", "ipa": "/\u02c8f\u026alt\u0259rd/", "meanings": {"en": "Having been passed through a filter to remove impurities.", "cn": "\u5df2\u7ecf\u901a\u8fc7\u8fc7\u6ee4\u5668\u4ee5\u53bb\u9664\u6742\u8d28\u3002"}, "usage_en": "Used to describe a substance that has been purified.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5df2\u88ab\u51c0\u5316\u7684\u7269\u8d28\u3002", "scene_en": "A glass of water being poured through a water filter.", "scene_cn": "\u4e00\u676f\u6c34\u6b63\u88ab\u5012\u5165\u6ee4\u6c34\u5668\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q10_filtered_1.png", "P6_vocabulary_exercises_15_Q10_filtered_2.png"], "examples": [{"en": "The filtered water tasted much cleaner and fresher than the tap water.", "cn": "\u8fc7\u6ee4\u540e\u7684\u6c34\u6bd4\u81ea\u6765\u6c34\u5c1d\u8d77\u6765\u66f4\u5e72\u51c0\u3001\u66f4\u65b0\u9c9c\u3002"}, {"en": "We filtered the pond water before drinking it to remove any bacteria.", "cn": "\u6211\u4eec\u5728\u996e\u7528\u6c60\u5858\u6c34\u4e4b\u524d\u5bf9\u5176\u8fdb\u884c\u4e86\u8fc7\u6ee4\uff0c\u4ee5\u53bb\u9664\u6240\u6709\u7ec6\u83cc\u3002"}]}, {"word": "vaporized", "ipa": "/\u02c8ve\u026ap\u0259ra\u026azd/", "meanings": {"en": "Converted into vapor; changed from a liquid or solid into a gaseous state.", "cn": "\u8f6c\u5316\u4e3a\u84b8\u6c7d\uff1b\u4ece\u6db2\u4f53\u6216\u56fa\u4f53\u8f6c\u53d8\u4e3a\u6c14\u6001\u3002"}, "usage_en": "Describes a substance that has been turned into vapor.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u5df2\u8f6c\u5316\u4e3a\u84b8\u6c7d\u7684\u7269\u8d28\u3002", "scene_en": "Steam rising from a boiling pot of water on a stove.", "scene_cn": "\u84b8\u6c7d\u4ece\u7089\u5b50\u4e0a\u6cb8\u817e\u7684\u6c34\u58f6\u4e2d\u5347\u8d77\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q10_vaporized_1.png", "P6_vocabulary_exercises_15_Q10_vaporized_2.png"], "examples": [{"en": "The liquid nitrogen was vaporized instantly when exposed to the warm air.", "cn": "\u6db2\u6c2e\u66b4\u9732\u5728\u6e29\u6696\u7684\u7a7a\u6c14\u4e2d\u65f6\u7acb\u5373\u6c7d\u5316\u3002"}, {"en": "The essential oils were vaporized to create a soothing aroma in the room.", "cn": "\u7cbe\u6cb9\u88ab\u6c7d\u5316\uff0c\u5728\u623f\u95f4\u91cc\u8425\u9020\u51fa\u8212\u7f13\u7684\u9999\u6c14\u3002"}]}, {"word": "evaporated", "ipa": "/\u026a\u02c8v\u00e6p\u0259re\u026at\u026ad/", "meanings": {"en": "Turned from a liquid into a gas or vapor.", "cn": "\u4ece\u6db2\u4f53\u53d8\u6210\u6c14\u4f53\u6216\u84b8\u6c7d\u3002"}, "usage_en": "Describes a liquid that has changed into a gas.", "usage_cn": "\u63cf\u8ff0\u5df2\u53d8\u6210\u6c14\u4f53\u7684\u6db2\u4f53\u3002", "scene_en": "A puddle of water drying up on a hot summer day.", "scene_cn": "\u4e00\u4e2a\u6c34\u5751\u5728\u708e\u70ed\u7684\u590f\u65e5\u91cc\u5e72\u6db8\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q10_evaporated_1.png", "P6_vocabulary_exercises_15_Q10_evaporated_2.png"], "examples": [{"en": "The spilled water evaporated quickly in the hot, dry desert climate.", "cn": "\u5728\u708e\u70ed\u5e72\u71e5\u7684\u6c99\u6f20\u6c14\u5019\u4e2d\uff0c\u6ea2\u51fa\u7684\u6c34\u5f88\u5feb\u84b8\u53d1\u4e86\u3002"}, {"en": "The morning dew had evaporated by the time the sun was high in the sky.", "cn": "\u5f53\u592a\u9633\u9ad8\u6302\u5929\u7a7a\u65f6\uff0c\u65e9\u6668\u7684\u9732\u6c34\u5df2\u7ecf\u84b8\u53d1\u4e86\u3002"}]}, {"word": "refined", "ipa": "/r\u026a\u02c8fa\u026and/", "meanings": {"en": "Processed to remove impurities or unwanted elements.", "cn": "\u7ecf\u8fc7\u5904\u7406\u4ee5\u53bb\u9664\u6742\u8d28\u6216\u4e0d\u9700\u8981\u7684\u5143\u7d20\u3002"}, "usage_en": "Describes a substance that has been purified.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u5df2\u88ab\u63d0\u7eaf\u7684\u7269\u8d28\u3002", "scene_en": "An oil refinery with tall towers and pipelines.", "scene_cn": "\u4e00\u4e2a\u6709\u9ad8\u5854\u548c\u7ba1\u9053\u7684\u70bc\u6cb9\u5382\u3002", "image_paths": ["P6_vocabulary_exercises_15_Q10_refined_1.png", "P6_vocabulary_exercises_15_Q10_refined_2.png"], "examples": [{"en": "The crude oil is refined to produce gasoline, kerosene, and other fuels.", "cn": "\u539f\u6cb9\u7ecf\u8fc7\u63d0\u70bc\uff0c\u53ef\u4ee5\u751f\u4ea7\u6c7d\u6cb9\u3001\u7164\u6cb9\u548c\u5176\u4ed6\u71c3\u6599\u3002"}, {"en": "The sugar was refined to remove any impurities and make it pure white.", "cn": "\u7cd6\u7ecf\u8fc7\u63d0\u70bc\uff0c\u53bb\u9664\u4e86\u6240\u6709\u6742\u8d28\uff0c\u4f7f\u5176\u53d8\u6210\u7eaf\u767d\u8272\u3002"}]}], "synonym_cn": "\u63d0\u70bc vs \u8fc7\u6ee4 vs \u84b8\u53d1 vs \u6c7d\u5316", "socratic_questions": [{"question": "In water purification, which process removes solid particles and impurities?", "options": ["filtered", "vaporized", "evaporated", "refined"], "correct_answer": "filtered", "explanation": "Filtering removes impurities by passing a liquid or gas through a filter."}, {"question": "Which process turns a liquid into a gas by heating it?", "options": ["filtered", "vaporized", "evaporated", "refined"], "correct_answer": "vaporized", "explanation": "Vaporization is the process of converting a liquid into a gaseous state through heat."}, {"question": "When water turns into steam naturally, what process is occurring?", "options": ["filtered", "vaporized", "evaporated", "refined"], "correct_answer": "evaporated", "explanation": "Evaporation is the natural process of a liquid turning into a gas."}, {"question": "Which process improves the quality of a substance by removing unwanted components?", "options": ["filtered", "vaporized", "evaporated", "refined"], "correct_answer": "refined", "explanation": "Refining is the process of purifying a substance by removing unwanted elements."}]}]};
