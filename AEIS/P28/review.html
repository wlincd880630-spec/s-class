esses to invest in renewable energy.", "cn": "\u7a0e\u6536\u51cf\u514d\u53ef\u4ee5\u4e3a\u4f01\u4e1a\u6295\u8d44\u53ef\u518d\u751f\u80fd\u6e90\u63d0\u4f9b\u5f3a\u5927\u7684\u52a8\u529b\u3002"}]}, {"word": "motive", "ipa": "/\u02c8mo\u028at\u026av/", "meanings": {"en": "A reason for doing something, especially a hidden or not obvious one.", "cn": "\u505a\u67d0\u4e8b\u7684\u539f\u56e0\uff0c\u5c24\u5176\u662f\u4e00\u4e2a\u9690\u85cf\u7684\u6216\u4e0d\u660e\u663e\u7684\u539f\u56e0\u3002"}, "usage_en": "The underlying reason or cause for an action, often concealed.", "usage_cn": "\u884c\u52a8\u7684\u6839\u672c\u539f\u56e0\uff0c\u901a\u5e38\u662f\u9690\u85cf\u7684\u3002", "scene_en": "A detective carefully examining clues at a crime scene to determine the suspect's motive.", "scene_cn": "\u4fa6\u63a2\u4ed4\u7ec6\u68c0\u67e5\u72af\u7f6a\u73b0\u573a\u7684\u7ebf\u7d22\uff0c\u4ee5\u786e\u5b9a\u5acc\u7591\u4eba\u7684\u52a8\u673a\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q1_motive_1.png", "P6_vocabulary_exercises_28_Q1_motive_2.png"], "examples": [{"en": "The detective tried to understand the killer's motive for committing such a heinous crime.", "cn": "\u4fa6\u63a2\u8bd5\u56fe\u7406\u89e3\u51f6\u624b\u72af\u4e0b\u5982\u6b64\u6ed4\u5929\u7f6a\u884c\u7684\u52a8\u673a\u3002"}, {"en": "Jealousy was the primary motive behind his actions, fueled by insecurity and resentment.", "cn": "\u5ac9\u5992\u662f\u4ed6\u884c\u4e3a\u7684\u4e3b\u8981\u52a8\u673a\uff0c\u8fd9\u662f\u7531\u4e0d\u5b89\u5168\u611f\u548c\u6028\u6068\u6240\u9a71\u52a8\u7684\u3002"}]}], "synonym_cn": "\u52a8\u673a vs. \u76ee\u7684 vs. \u610f\u56fe vs. \u523a\u6fc0", "socratic_questions": [{"question": "If someone donates anonymously to a charity, what is their underlying ______ for giving?", "options": ["purpose", "intention", "incentive", "motive"], "correct_answer": "motive", "explanation": "Motive refers to the underlying reason or cause for an action, especially when concealed or not immediately obvious."} : "\u7528\u4e8e\u60f3\u8981\u9632\u6b62\u8d1f\u9762\u6216\u4e0d\u6109\u5feb\u7684\u4e8b\u60c5\u53d1\u751f\u65f6\u3002", "scene_en": "A person walking a different route to avoid a muddy puddle.", "scene_cn": "\u4e00\u4e2a\u4eba\u8d70\u4e0d\u540c\u7684\u8def\u7ebf\u4ee5\u907f\u5f00\u6ce5\u6cde\u7684\u6c34\u5751\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q3_avoided_1.png", "P6_vocabulary_exercises_28_Q3_avoided_2.png"], "examples": [{"en": "She avoided the crowded street by taking a quiet side alley instead.", "cn": "\u5979\u907f\u5f00\u4e86\u62e5\u6324\u7684\u8857\u9053\uff0c\u800c\u662f\u8d70\u4e86\u4e00\u6761\u5b89\u9759\u7684\u5c0f\u5df7\u3002"}, {"en": "He avoided talking about his problems to prevent upsetting his family.", "cn": "\u4ed6\u907f\u514d\u8c08\u8bba\u4ed6\u7684\u95ee\u9898\uff0c\u4ee5\u9632\u6b62\u8ba9\u4ed6\u7684\u5bb6\u4eba\u96be\u8fc7\u3002"}]}, {"word": "dared", "ipa": "/de\u0259rd/", "meanings": {"en": "Had the courage to do something risky or challenging.", "cn": "\u6709\u52c7\u6c14\u505a\u4e00\u4e9b\u5192\u9669\u6216\u5177\u6709\u6311\u6218\u6027\u7684\u4e8b\u60c5\u3002"}, "usage_en": "Used to express bravery or willingness to take risks.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u52c7\u6562\u6216\u613f\u610f\u5192\u9669\u3002", "scene_en": "A person standing on the edge of a cliff, looking out at the view.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u60ac\u5d16\u8fb9\uff0c\u773a\u671b\u7740\u8fdc\u5904\u7684\u666f\u8272\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q3_dared_1.png", "P6_vocabulary_exercises_28_Q3_dared_2.png"], "examples": [{"en": "He dared to speak out against the unfair policy, despite the potential consequences.", "cn": "\u5c3d\u7ba1\u6709\u6f5c\u5728\u7684\u540e\u679c\uff0c\u4ed6\u8fd8\u662f\u6562\u4e8e\u516c\u5f00\u53cd\u5bf9\u8fd9\u9879\u4e0d\u516c\u5e73\u7684\u653f\u7b56\u3002"}, {"en": "She dared to dream of a life beyond her small town, full of adventure.", "cn": "\u5979\u6562\u4e8e\u68a6\u60f3\u4e00\u4e2a\u8d85\u8d8a\u5979\u5c0f\u9547\u7684\u751f\u6d3b\uff0c\u5145\u6ee1\u5192\u9669\u3002"}]}, {"word": "offended", "ipa": "/\u0259\u02c8fend\u026ad/", "meanings": {"en": "Caused someone to feel upset, annoyed, or resentful.", "cn": "\u5bfc\u81f4\u67d0\u4eba\u611f\u5230\u5fc3\u70e6\u3001\u607c\u706b\u6216\u6028\u6068\u3002"}, "usage_en": "Used when describing actions or words that cause hurt feelings.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5bfc\u81f4\u53d7\u4f24\u611f\u60c5\u7684\u884c\u4e3a\u6216\u8a00\u8bed\u3002", "scene_en": "A person looking upset after hearing an insensitive comment.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u542c\u5230\u4e0d\u654f\u611f\u7684\u8bc4\u8bba\u540e\u770b\u8d77\u6765\u5f88\u6cae\u4e27\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q3_offended_1.png", "P6_vocabulary_exercises_28_Q3_offended_2.png"], "examples": [{"en": "His rude joke offended many people at the party, creating an awkward atmosphere.", "cn": "\u4ed6\u7c97\u9c81\u7684\u7b11\u8bdd\u5192\u72af\u4e86\u6d3e\u5bf9\u4e0a\u7684\u8bb8\u591a\u4eba\uff0c\u8425\u9020\u4e86\u4e00\u79cd\u5c34\u5c2c\u7684\u6c14\u6c1b\u3002"}, {"en": "She was deeply offended by his dismissive tone and lack of respect during the meeting.", "cn": "\u5979\u5bf9\u4ed6\u5728\u4f1a\u8bae\u671f\u95f4\u7684\u8f7b\u8511\u8bed\u6c14\u548c\u7f3a\u4e4f\u5c0a\u91cd\u611f\u5230\u975e\u5e38\u607c\u706b\u3002"}]}, {"word": "struck", "ipa": "/str\u028ck/", "meanings": {"en": "Hit forcefully and deliberately with a hand or object.", "cn": "\u7528\u624b\u6216\u7269\u4f53\u7528\u529b\u4e14\u6545\u610f\u5730\u51fb\u6253\u3002"}, "usage_en": "Used to describe a physical impact or forceful action.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7269\u7406\u51b2\u51fb\u6216\u5f3a\u6709\u529b\u7684\u52a8\u4f5c\u3002", "scene_en": "A baseball player hitting a ball with a bat.", "scene_cn": "\u4e00\u4e2a\u68d2\u7403\u8fd0\u52a8\u5458\u7528\u7403\u68d2\u51fb\u7403\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q3_struck_1.png", "P6_vocabulary_exercises_28_Q3_struck_2.png"], "examples": [{"en": "The lightning struck the old oak tree, splitting it in half during the storm.", "cn": "\u95ea\u7535\u51fb\u4e2d\u4e86\u8001\u6a61\u6811\uff0c\u5728\u66b4\u98ce\u96e8\u4e2d\u628a\u5b83\u5288\u6210\u4e24\u534a\u3002"}, {"en": "He struck the table in anger, startling everyone in the room with the sudden noise.", "cn": "\u4ed6\u6124\u6012\u5730\u62cd\u6253\u684c\u5b50\uff0c\u7a81\u7136\u7684\u566a\u97f3\u5413\u574f\u4e86\u623f\u95f4\u91cc\u7684\u6240\u6709\u4eba\u3002"}]}], "synonym_cn": "\u5f97\u7f6a vs. \u907f\u514d vs. \u6562\u4e8e vs. \u6253", "socratic_questions": [{"question": "If you see a dangerous dog, would you ______ it or approach it?", "options": ["avoided", "dared", "offended", "struck"], "correct_answer": "avoided", "explanation": "Avoiding means keeping away from something potentially harmful or unpleasant."}, {"question": "Would you have ______ to question the king's decision in public?", "options": ["avoided", "dared", "offended", "struck"], "correct_answer": "dared", "explanation": "Daring implies having the courage or audacity to do something risky."}, {"question": "If you accidentally insulted someone, did you ______ them or compliment them?", "options": ["avoided", "dared", "offended", "struck"], "correct_answer": "offended", "explanation": "Offending means causing someone to feel upset or annoyed."}, {"question": "If you hit a mosquito, did you ______ it or ignore it?", "options": ["avoided", "dared", "offended", "struck"], "correct_answer": "struck", "explanation": "Struck means to hit something forcefully."}]}, {"id": 4, "stem": "The clock is ______ from a hook on the ceiling.", "correct_index": 0, "options": [{"word": "suspended", "ipa": "/s\u0259\u02c8sp\u025bnd\u026ad/", "meanings": {"en": "Temporarily prevented from continuing or being in force or effect; hanging down from something.", "cn": "\u6682\u65f6\u505c\u6b62\u7ee7\u7eed\u6216\u751f\u6548\uff1b\u4ece\u67d0\u7269\u4e0a\u60ac\u6302\u4e0b\u6765\u3002"}, "usage_en": "Used to describe something temporarily stopped or hanging.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6682\u65f6\u505c\u6b62\u6216\u60ac\u6302\u7684\u4e1c\u897f\u3002", "scene_en": "A courtroom scene where a lawyer is informed that the trial is suspended. A bridge hanging over a river.", "scene_cn": "\u6cd5\u5ead\u573a\u666f\uff0c\u5f8b\u5e08\u88ab\u544a\u77e5\u5ba1\u5224\u6682\u505c\u3002 \u4e00\u5ea7\u6865\u6881\u60ac\u6302\u5728\u6cb3\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q4_suspended_1.png", "P6_vocabulary_exercises_28_Q4_suspended_2.png"], "examples": [{"en": "The construction project was suspended due to the unexpected heavy rainfall and flooding.", "cn": "\u7531\u4e8e\u610f\u5916\u7684\u66b4\u96e8\u548c\u6d2a\u6c34\uff0c\u5efa\u7b51\u9879\u76ee\u88ab\u6682\u505c\u4e86\u3002"}, {"en": "Her driver's license was suspended after she received too many traffic violations recently.", "cn": "\u5728\u6700\u8fd1\u6536\u5230\u592a\u591a\u4ea4\u901a\u8fdd\u89c4\u884c\u4e3a\u540e\uff0c\u5979\u7684\u9a7e\u9a76\u6267\u7167\u88ab\u540a\u9500\u4e86\u3002"}]}, {"word": "clinging", "ipa": "/\u02c8kl\u026a\u014b\u026a\u014b/", "meanings": {"en": "Holding on tightly to something; adhering closely.", "cn": "\u7d27\u7d27\u6293\u4f4f\u67d0\u7269\uff1b\u7d27\u5bc6\u9644\u7740\u3002"}, "usage_en": "Describes holding on tightly or sticking closely.", "usage_cn": "\u63cf\u8ff0\u7d27\u7d27\u6293\u4f4f\u6216\u7d27\u5bc6\u9644\u7740\u3002", "scene_en": "A baby clinging to its mother. Ivy clinging to a brick wall.", "scene_cn": "\u4e00\u4e2a\u5a74\u513f\u7d27\u7d27\u6293\u4f4f\u5b83\u7684\u6bcd\u4eb2\u3002 \u5e38\u6625\u85e4\u7d27\u8d34\u5728\u7816\u5899\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q4_clinging_1.png", "P6_vocabulary_exercises_28_Q4_clinging_2.png"], "examples": [{"en": "The lost child was clinging to his teddy bear for comfort in the scary forest.", "cn": "\u8fd9\u4e2a\u8ff7\u8def\u7684\u5b69\u5b50\u7d27\u7d27\u62b1\u7740\u4ed6\u7684\u6cf0\u8fea\u718a\uff0c\u5728\u53ef\u6015\u7684\u68ee\u6797\u91cc\u5bfb\u6c42\u5b89\u6170\u3002"}, {"en": "After the accident, she was clinging to life, hoping for a miracle to happen soon.", "cn": "\u4e8b\u6545\u53d1\u751f\u540e\uff0c\u5979\u7d27\u7d27\u6293\u4f4f\u751f\u547d\uff0c\u5e0c\u671b\u5947\u8ff9\u5f88\u5feb\u53d1\u751f\u3002"}]}, {"word": "groping", "ipa": "/\u02c8\u0261ro\u028ap\u026a\u014b/", "meanings": {"en": "Feeling about or searching blindly or uncertainly with the hands.", "cn": "\u7528\u624b\u76f2\u76ee\u6216\u4e0d\u786e\u5b9a\u5730\u6478\u7d22\u6216\u641c\u7d22\u3002"}, "usage_en": "Used to describe searching uncertainly with hands.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7528\u624b\u4e0d\u786e\u5b9a\u5730\u641c\u7d22\u3002", "scene_en": "A person groping in a dark room for a light switch. A diver groping along the seabed.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u9ed1\u6697\u7684\u623f\u95f4\u91cc\u6478\u7d22\u7535\u706f\u5f00\u5173\u3002 \u6f5c\u6c34\u5458\u5728\u6d77\u5e95\u6478\u7d22\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q4_groping_1.png", "P6_vocabulary_exercises_28_Q4_groping_2.png"], "examples": [{"en": "She was groping for her keys in her purse, unable to see in the dim light.", "cn": "\u5979\u5728\u94b1\u5305\u91cc\u6478\u7d22\u7740\u94a5\u5319\uff0c\u7531\u4e8e\u5149\u7ebf\u660f\u6697\uff0c\u4ec0\u4e48\u4e5f\u770b\u4e0d\u89c1\u3002"}, {"en": "The climber was groping for a handhold on the steep rock face during the difficult climb.", "cn": "\u5728\u8270\u96be\u7684\u6500\u767b\u8fc7\u7a0b\u4e2d\uff0c\u767b\u5c71\u8005\u5728\u9661\u5ced\u7684\u5ca9\u58c1\u4e0a\u6478\u7d22\u7740\u4e00\u4e2a\u53ef\u4ee5\u6293\u4f4f\u7684\u5730\u65b9\u3002"}]}, {"word": "swinging", "ipa": "/\u02c8sw\u026a\u014b\u026a\u014b/", "meanings": {"en": "Moving or hanging freely while pivoting from a fixed point.", "cn": "\u4ece\u56fa\u5b9a\u70b9\u67a2\u8f6c\u65f6\uff0c\u81ea\u7531\u79fb\u52a8\u6216\u60ac\u6302\u3002"}, "usage_en": "Describes movement back and forth from a fixed point.", "usage_cn": "\u63cf\u8ff0\u4ece\u56fa\u5b9a\u70b9\u6765\u56de\u79fb\u52a8\u3002", "scene_en": "A child swinging on a playground swing. A pendulum swinging back and forth.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u5728\u64cd\u573a\u4e0a\u7684\u79cb\u5343\u4e0a\u8361\u79cb\u5343\u3002 \u949f\u6446\u6765\u56de\u6446\u52a8\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q4_swinging_1.png", "P6_vocabulary_exercises_28_Q4_swinging_2.png"], "examples": [{"en": "The monkey was swinging from branch to branch in the jungle, showing off its agility.", "cn": "\u7334\u5b50\u5728\u4e1b\u6797\u4e2d\u4ece\u4e00\u6839\u6811\u679d\u8361\u5230\u53e6\u4e00\u6839\u6811\u679d\uff0c\u70ab\u8000\u7740\u5b83\u7684\u654f\u6377\u6027\u3002"}, {"en": "The old gate was swinging open and shut in the wind, creaking with every movement.", "cn": "\u65e7\u5927\u95e8\u5728\u98ce\u4e2d\u6765\u56de\u6446\u52a8\uff0c\u6bcf\u6b21\u79fb\u52a8\u90fd\u53d1\u51fa\u5431\u5431\u58f0\u3002"}]}], "synonym_cn": "\u60ac\u6302, \u540a, \u5782", "socratic_questions": [{"question": "If a company temporarily halts operations due to unforeseen circumstances, is it being ______?", "options": ["suspended", "clinging", "groping", "swinging"], "correct_answer": "suspended", "explanation": "Suspended implies a temporary cessation or hanging from above."}, {"question": "In a desperate attempt to stay safe during a storm, is a person ______ to a tree?", "options": ["suspended", "clinging", "groping", "swinging"], "correct_answer": "clinging", "explanation": "Clinging suggests holding on tightly for support or safety."}, {"question": "If someone is trying to find their keys in the dark, are they likely ______ around?", "options": ["suspended", "clinging", "groping", "swinging"], "correct_answer": "groping", "explanation": "Groping means feeling around uncertainly with your hands."}, {"question": "If a child is playing on a playground, are they likely ______ on a swing set?", "options": ["suspended", "clinging", "groping", "swinging"], "correct_answer": "swinging", "explanation": "Swinging refers to moving back and forth while hanging from something."}]}, {"id": 5, "stem": "It was obvious that he had been drinking, as his whole body ______ of alcohol.", "correct_index": 1, "options": [{"word": "seeped", "ipa": "/si\u02d0pt/", "meanings": {"en": "To flow or leak slowly through porous material or small holes.", "cn": "\u901a\u8fc7\u591a\u5b54\u6750\u6599\u6216\u5c0f\u5b54\u7f13\u6162\u5730\u6d41\u52a8\u6216\u6e17\u6f0f\u3002"}, "usage_en": "Describes a slow, gradual flow or leakage.", "usage_cn": "\u63cf\u8ff0\u7f13\u6162\u3001\u9010\u6e10\u7684\u6d41\u52a8\u6216\u6cc4\u6f0f\u3002", "scene_en": "Water slowly dripping from a crack in a pipe.", "scene_cn": "\u6c34\u4ece\u7ba1\u9053\u7684\u88c2\u7f1d\u4e2d\u6162\u6162\u6ef4\u843d\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q5_seeped_1.png", "P6_vocabulary_exercises_28_Q5_seeped_2.png"], "examples": [{"en": "The water seeped through the cracked foundation, causing damage to the basement.", "cn": "\u6c34\u6e17\u8fc7\u7834\u88c2\u7684\u5730\u57fa\uff0c\u5bf9\u5730\u4e0b\u5ba4\u9020\u6210\u4e86\u635f\u5bb3\u3002"}, {"en": "The dye seeped into the fabric, creating an uneven and blotchy pattern.", "cn": "\u67d3\u6599\u6e17\u5165\u7ec7\u7269\uff0c\u5f62\u6210\u4e86\u4e0d\u5747\u5300\u4e14\u6709\u6c61\u8ff9\u7684\u56fe\u6848\u3002"}]}, {"word": "reeked", "ipa": "/ri\u02d0kt/", "meanings": {"en": "To have a strong, unpleasant smell; to strongly suggest something unpleasant.", "cn": "\u6709\u5f3a\u70c8\u7684\u3001\u4ee4\u4eba\u4e0d\u5feb\u7684\u6c14\u5473\uff1b\u5f3a\u70c8\u6697\u793a\u4ee4\u4eba\u4e0d\u5feb\u7684\u4e8b\u60c5\u3002"}, "usage_en": "Used to describe a strong, offensive odor or a negative implication.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f3a\u70c8\u7684\u3001\u4ee4\u4eba\u4e0d\u5feb\u7684\u6c14\u5473\u6216\u8d1f\u9762\u7684\u542b\u4e49\u3002", "scene_en": "A garbage dump overflowing with rotting waste.", "scene_cn": "\u4e00\u4e2a\u5783\u573e\u573a\u91cc\u5806\u6ee1\u4e86\u8150\u70c2\u7684\u5783\u573e\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q5_reeked_1.png", "P6_vocabulary_exercises_28_Q5_reeked_2.png"], "examples": [{"en": "The room reeked of stale cigarette smoke and cheap beer after the party.", "cn": "\u6d3e\u5bf9\u7ed3\u675f\u540e\uff0c\u623f\u95f4\u91cc\u5f25\u6f2b\u7740\u9648\u8150\u7684\u70df\u5473\u548c\u5ec9\u4ef7\u5564\u9152\u7684\u5473\u9053\u3002"}, {"en": "His excuse reeked of dishonesty, and nobody believed a single word he said.", "cn": "\u4ed6\u7684\u501f\u53e3\u5145\u6ee1\u4e86\u4e0d\u8bda\u5b9e\u7684\u5473\u9053\uff0c\u6ca1\u6709\u4eba\u76f8\u4fe1\u4ed6\u8bf4\u7684\u4e00\u4e2a\u5b57\u3002"}]}, {"word": "stank", "ipa": "/st\u00e6\u014bk/", "meanings": {"en": "To have a strong, offensive smell; past tense of stink.", "cn": "\u6709\u5f3a\u70c8\u7684\u3001\u4ee4\u4eba\u4e0d\u5feb\u7684\u6c14\u5473\uff1bstink\u7684\u8fc7\u53bb\u5f0f\u3002"}, "usage_en": "Indicates a powerful and unpleasant odor.", "usage_cn": "\u8868\u793a\u5f3a\u70c8\u4e14\u4ee4\u4eba\u4e0d\u5feb\u7684\u6c14\u5473\u3002", "scene_en": "A pile of rotting fish on a hot summer day.", "scene_cn": "\u5728\u708e\u70ed\u7684\u590f\u65e5\u91cc\uff0c\u4e00\u5806\u8150\u70c2\u7684\u9c7c\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q5_stank_1.png", "P6_vocabulary_exercises_28_Q5_stank_2.png"], "examples": [{"en": "The old gym socks stank so badly that I had to throw them away immediately.", "cn": "\u65e7\u7684\u8fd0\u52a8\u889c\u81ed\u6c14\u718f\u5929\uff0c\u6211\u4e0d\u5f97\u4e0d\u7acb\u5373\u628a\u5b83\u4eec\u6254\u6389\u3002"}, {"en": "After the flood, the basement stank of mildew and stagnant water for weeks.", "cn": "\u6d2a\u6c34\u8fc7\u540e\uff0c\u5730\u4e0b\u5ba4\u91cc\u5f25\u6f2b\u7740\u9709\u5473\u548c\u6b7b\u6c34\u5473\uff0c\u6301\u7eed\u4e86\u6570\u5468\u3002"}]}, {"word": "smelt", "ipa": "/sm\u025blt/", "meanings": {"en": "To perceive or detect odor by means of the olfactory sense.", "cn": "\u901a\u8fc7\u55c5\u89c9\u611f\u77e5\u6216\u68c0\u6d4b\u6c14\u5473\u3002"}, "usage_en": "Refers to the act of using the nose to detect a scent.", "usage_cn": "\u6307\u4f7f\u7528\u9f3b\u5b50\u6765\u68c0\u6d4b\u6c14\u5473\u7684\u884c\u4e3a\u3002", "scene_en": "A person smelling a rose in a garden.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u82b1\u56ed\u91cc\u95fb\u73ab\u7470\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q5_smelt_1.png", "P6_vocabulary_exercises_28_Q5_smelt_2.png"], "examples": [{"en": "I smelt the delicious aroma of freshly baked bread as I walked past the bakery.", "cn": "\u5f53\u6211\u8d70\u8fc7\u9762\u5305\u5e97\u65f6\uff0c\u6211\u95fb\u5230\u4e86\u65b0\u9c9c\u51fa\u7089\u7684\u9762\u5305\u7684\u7f8e\u5473\u9999\u6c14\u3002"}, {"en": "She smelt smoke and immediately knew that something was burning in the kitchen.", "cn": "\u5979\u95fb\u5230\u4e86\u70df\u5473\uff0c\u7acb\u523b\u77e5\u9053\u53a8\u623f\u91cc\u6709\u4ec0\u4e48\u4e1c\u897f\u5728\u71c3\u70e7\u3002"}]}], "synonym_cn": "\u6563\u53d1\u6c14\u5473 (san fa qi wei)", "socratic_questions": [{"question": "If a damp cloth slowly releases water, which word describes this process?", "options": ["seeped", "reeked", "stank", "smelt"], "correct_answer": "seeped", "explanation": "Seeped means to slowly flow or leak out."}, {"question": "Which word best describes the strong, unpleasant smell of garbage left in the sun?", "options": ["seeped", "reeked", "stank", "smelt"], "correct_answer": "stank", "explanation": "Stank describes a strong, offensive odor."}, {"question": "Which word describes the action of a dog using its nose to perceive an odor?", "options": ["seeped", "reeked", "stank", "smelt"], "correct_answer": "smelt", "explanation": "Smelt refers to the act of detecting an odor through the nose."}, {"question": "If a room is filled with a strong, unpleasant odor, which word fits best?", "options": ["seeped", "reeked", "stank", "smelt"], "correct_answer": "reeked", "explanation": "Reeked means to emit a strong, unpleasant smell."}]}, {"id": 6, "stem": "His driving licence has been ______ after he was caught drink driving.", "correct_index": 2, "options": [{"word": "detained", "ipa": "/d\u026a\u02c8te\u026and/", "meanings": {"en": "Kept in official custody; prevented from proceeding.", "cn": "\u5b98\u65b9\u62d8\u7559\uff1b\u963b\u6b62\u7ee7\u7eed\u8fdb\u884c\u3002"}, "usage_en": "Often used in legal or security contexts.", "usage_cn": "\u5e38\u7528\u4e8e\u6cd5\u5f8b\u6216\u5b89\u5168\u8bed\u5883\u3002", "scene_en": "A person being held by police at an airport.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u673a\u573a\u88ab\u8b66\u5bdf\u6263\u7559\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q6_detained_1.png", "P6_vocabulary_exercises_28_Q6_detained_2.png"], "examples": [{"en": "The suspect was detained by the police for further questioning about the incident.", "cn": "\u5acc\u7591\u4eba\u88ab\u8b66\u65b9\u62d8\u7559\uff0c\u4ee5\u4fbf\u8fdb\u4e00\u6b65\u8be2\u95ee\u6709\u5173\u8be5\u4e8b\u4ef6\u7684\u60c5\u51b5\u3002"}, {"en": "Immigration officials detained several individuals attempting to enter the country without proper documentation.", "cn": "\u79fb\u6c11\u5b98\u5458\u62d8\u7559\u4e86\u51e0\u540d\u8bd5\u56fe\u5728\u6ca1\u6709\u9002\u5f53\u6587\u4ef6\u7684\u60c5\u51b5\u4e0b\u8fdb\u5165\u8be5\u56fd\u7684\u4eba\u3002"}]}, {"word": "retained", "ipa": "/r\u026a\u02c8te\u026and/", "meanings": {"en": "Continued to have something; kept possession of.", "cn": "\u7ee7\u7eed\u62e5\u6709\u67d0\u7269\uff1b\u4fdd\u6301\u5360\u6709\u3002"}, "usage_en": "Used when keeping something you already have.", "usage_cn": "\u7528\u4e8e\u4fdd\u7559\u4f60\u5df2\u7ecf\u62e5\u6709\u7684\u4e1c\u897f\u3002", "scene_en": "A lawyer keeping important documents in a file.", "scene_cn": "\u5f8b\u5e08\u5c06\u91cd\u8981\u6587\u4ef6\u4fdd\u5b58\u5728\u6587\u4ef6\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q6_retained_1.png", "P6_vocabulary_exercises_28_Q6_retained_2.png"], "examples": [{"en": "The company retained its top employees despite facing economic challenges during the recession period.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u7ecf\u6d4e\u6311\u6218\uff0c\u8be5\u516c\u53f8\u4ecd\u4fdd\u7559\u4e86\u5176\u9876\u7ea7\u5458\u5de5\u3002"}, {"en": "She retained her composure throughout the difficult negotiation, securing a favorable agreement for her client.", "cn": "\u5728\u6574\u4e2a\u8270\u96be\u7684\u8c08\u5224\u8fc7\u7a0b\u4e2d\uff0c\u5979\u4fdd\u6301\u4e86\u9547\u5b9a\uff0c\u4e3a\u5979\u7684\u5ba2\u6237\u4e89\u53d6\u4e86\u6709\u5229\u7684\u534f\u8bae\u3002"}]}, {"word": "suspended", "ipa": "/s\u0259\u02c8sp\u025bnd\u026ad/", "meanings": {"en": "Temporarily prevented from continuing or being in force or effect.", "cn": "\u6682\u65f6\u963b\u6b62\u7ee7\u7eed\u8fdb\u884c\u6216\u751f\u6548\u3002"}, "usage_en": "Often used for licenses, memberships, or activities.", "usage_cn": "\u5e38\u7528\u4e8e\u6267\u7167\u3001\u4f1a\u5458\u8d44\u683c\u6216\u6d3b\u52a8\u3002", "scene_en": "A driver's license with a 'suspended' stamp on it.", "scene_cn": "\u5e26\u6709\u201c\u6682\u505c\u201d\u5370\u7ae0\u7684\u9a7e\u9a76\u6267\u7167\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q6_suspended_1.png", "P6_vocabulary_exercises_28_Q6_suspended_2.png"], "examples": [{"en": "The student was suspended from school for violating the code of conduct during the field trip.", "cn": "\u8be5\u5b66\u751f\u56e0\u5728\u5b9e\u5730\u8003\u5bdf\u671f\u95f4\u8fdd\u53cd\u884c\u4e3a\u51c6\u5219\u800c\u88ab\u505c\u5b66\u3002"}, {"en": "The construction project was suspended due to unexpected environmental concerns discovered during the initial assessment.", "cn": "\u7531\u4e8e\u5728\u521d\u6b65\u8bc4\u4f30\u4e2d\u53d1\u73b0\u610f\u5916\u7684\u73af\u5883\u95ee\u9898\uff0c\u8be5\u5efa\u8bbe\u9879\u76ee\u88ab\u6682\u505c\u3002"}]}, {"word": "rejected", "ipa": "/r\u026a\u02c8d\u0292\u025bkt\u026ad/", "meanings": {"en": "Dismissed as inadequate, unacceptable, or unsuitable.", "cn": "\u56e0\u4e0d\u5145\u5206\u3001\u4e0d\u53ef\u63a5\u53d7\u6216\u4e0d\u5408\u9002\u800c\u88ab\u9a73\u56de\u3002"}, "usage_en": "Used when something is turned down or refused.", "usage_cn": "\u7528\u4e8e\u67d0\u7269\u88ab\u62d2\u7edd\u6216\u62d2\u7edd\u3002", "scene_en": "A job application marked with a 'rejected' stamp.", "scene_cn": "\u6807\u6709\u201c\u62d2\u7edd\u201d\u5370\u7ae0\u7684\u6c42\u804c\u7533\u8bf7\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q6_rejected_1.png", "P6_vocabulary_exercises_28_Q6_rejected_2.png"], "examples": [{"en": "The bank rejected his loan application because he did not meet the minimum credit score requirements.", "cn": "\u94f6\u884c\u62d2\u7edd\u4e86\u4ed6\u7684\u8d37\u6b3e\u7533\u8bf7\uff0c\u56e0\u4e3a\u4ed6\u6ca1\u6709\u8fbe\u5230\u6700\u4f4e\u4fe1\u7528\u8bc4\u5206\u8981\u6c42\u3002"}, {"en": "Her innovative idea was initially rejected by the team, but later proved to be highly successful.", "cn": "\u5979\u7684\u521b\u65b0\u60f3\u6cd5\u6700\u521d\u88ab\u56e2\u961f\u62d2\u7edd\uff0c\u4f46\u540e\u6765\u8bc1\u660e\u975e\u5e38\u6210\u529f\u3002"}]}], "synonym_cn": "\u6682\u505c\uff0c\u4e2d\u6b62\uff0c\u6263\u7559\uff0c\u62d2\u7edd (\u4fa7\u91cd\u4e8e\u4e0d\u540c\u7a0b\u5ea6\u7684\u963b\u6b62\u6216\u53d6\u6d88)", "socratic_questions": [{"question": "If police temporarily take your passport, is it being detained, retained, suspended, or rejected?", "options": ["detained", "retained", "suspended", "rejected"], "correct_answer": "detained", "explanation": "Detained means kept in official custody, implying a temporary holding of something."}, {"question": "If a company decides to keep its existing policies, are they being detained, retained, suspended, or rejected?", "options": ["detained", "retained", "suspended", "rejected"], "correct_answer": "retained", "explanation": "Retained means kept or continued to have something."}, {"question": "If a basketball player is banned from playing for a few games, is he being detained, retained, suspended, or rejected?", "options": ["detained", "retained", "suspended", "rejected"], "correct_answer": "suspended", "explanation": "Suspended means temporarily prevented from continuing or being in force or effect."}, {"question": "If a proposal is not accepted by the committee, is it being detained, retained, suspended, or rejected?", "options": ["detained", "retained", "suspended", "rejected"], "correct_answer": "rejected", "explanation": "Rejected means dismissed as inadequate, unacceptable, or unsuitable."}]}, {"id": 7, "stem": "Our team felt very ______ after we lost by a huge margin that night.", "correct_index": 0, "options": [{"word": "demoralised", "ipa": "/d\u026a\u02c8m\u0252r\u0259la\u026azd/", "meanings": {"en": "Having lost confidence or hope; disheartened.", "cn": "\u5931\u53bb\u4fe1\u5fc3\u6216\u5e0c\u671b\uff1b\u6cae\u4e27\u7684\u3002"}, "usage_en": "Often used when facing setbacks or failures.", "usage_cn": "\u5e38\u7528\u4e8e\u9762\u5bf9\u632b\u6298\u6216\u5931\u8d25\u65f6\u3002", "scene_en": "A sports team in the locker room after a crushing defeat, heads hung low.", "scene_cn": "\u5728\u4e00\u573a\u60e8\u8d25\u540e\uff0c\u8fd0\u52a8\u961f\u5728\u66f4\u8863\u5ba4\u91cc\uff0c\u90fd\u4f4e\u7740\u5934\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q7_demoralised_1.png", "P6_vocabulary_exercises_28_Q7_demoralised_2.png"], "examples": [{"en": "The constant criticism from his boss left him feeling completely demoralised and unmotivated.", "cn": "\u8001\u677f\u4e0d\u65ad\u7684\u6279\u8bc4\u8ba9\u4ed6\u611f\u5230\u5b8c\u5168\u6cae\u4e27\u548c\u7f3a\u4e4f\u52a8\u529b\u3002"}, {"en": "After the project failed, the team felt demoralised and questioned their abilities.", "cn": "\u9879\u76ee\u5931\u8d25\u540e\uff0c\u56e2\u961f\u611f\u5230\u6cae\u4e27\u5e76\u8d28\u7591\u4ed6\u4eec\u7684\u80fd\u529b\u3002"}]}, {"word": "disturbed", "ipa": "/d\u026a\u02c8st\u025c\u02d0bd/", "meanings": {"en": "Having had its normal state or condition interfered with; troubled or upset.", "cn": "\u6b63\u5e38\u72b6\u6001\u6216\u6761\u4ef6\u53d7\u5230\u5e72\u6270\uff1b \u70e6\u607c\u6216\u4e0d\u5b89\u3002"}, "usage_en": "Describes a state of being troubled or disrupted.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u70e6\u607c\u6216\u88ab\u6253\u65ad\u7684\u72b6\u6001\u3002", "scene_en": "A person tossing and turning in bed, unable to sleep due to worries.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5e8a\u4e0a\u8f97\u8f6c\u53cd\u4fa7\uff0c\u56e0\u4e3a\u62c5\u5fc3\u800c\u65e0\u6cd5\u5165\u7761\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q7_disturbed_1.png", "P6_vocabulary_exercises_28_Q7_disturbed_2.png"], "examples": [{"en": "The loud noise from the construction site deeply disturbed her concentration during the exam.", "cn": "\u5efa\u7b51\u5de5\u5730\u53d1\u51fa\u7684\u5de8\u5927\u566a\u97f3\u4e25\u91cd\u5e72\u6270\u4e86\u5979\u8003\u8bd5\u65f6\u7684\u6ce8\u610f\u529b\u3002"}, {"en": "He seemed disturbed by the strange phone call he received late last night.", "cn": "\u4ed6\u4f3c\u4e4e\u5bf9\u6628\u5929\u6df1\u591c\u63a5\u5230\u7684\u5947\u602a\u7535\u8bdd\u611f\u5230\u4e0d\u5b89\u3002"}]}, {"word": "traumatised", "ipa": "/\u02c8tr\u0254\u02d0m\u0259ta\u026azd/", "meanings": {"en": "Having suffered severe emotional shock and distress.", "cn": "\u906d\u53d7\u4e25\u91cd\u7684\u7cbe\u795e\u6253\u51fb\u548c\u75db\u82e6\u3002"}, "usage_en": "Used to describe the lasting effects of a shocking event.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4ee4\u4eba\u9707\u60ca\u7684\u4e8b\u4ef6\u7684\u6301\u4e45\u5f71\u54cd\u3002", "scene_en": "A child hiding under a table during a thunderstorm, visibly shaken.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u5728\u96f7\u96e8\u4e2d\u8eb2\u5728\u684c\u5b50\u5e95\u4e0b\uff0c\u660e\u663e\u5730\u88ab\u5413\u574f\u4e86\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q7_traumatised_1.png", "P6_vocabulary_exercises_28_Q7_traumatised_2.png"], "examples": [{"en": "The victims of the earthquake were traumatised by the devastation they witnessed firsthand.", "cn": "\u5730\u9707\u7684\u53d7\u5bb3\u8005\u56e0\u4eb2\u773c\u76ee\u7779\u7684\u7834\u574f\u800c\u53d7\u5230\u521b\u4f24\u3002"}, {"en": "Witnessing the accident left her traumatised and unable to drive for several months.", "cn": "\u76ee\u7779\u4e8b\u6545\u4f7f\u5979\u53d7\u5230\u521b\u4f24\uff0c\u51e0\u4e2a\u6708\u90fd\u65e0\u6cd5\u5f00\u8f66\u3002"}]}, {"word": "disillusioned", "ipa": "/\u02ccd\u026as\u026a\u02c8lu\u02d0\u0292\u0259nd/", "meanings": {"en": "Disappointed in someone or something that one discovers to be less good than one had believed.", "cn": "\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u611f\u5230\u5931\u671b\uff0c\u53d1\u73b0\u5b83\u4e0d\u5982\u81ea\u5df1\u60f3\u8c61\u7684\u90a3\u4e48\u597d\u3002"}, "usage_en": "Describes a loss of faith or idealism.", "usage_cn": "\u63cf\u8ff0\u4e86\u5931\u53bb\u4fe1\u5ff5\u6216\u7406\u60f3\u4e3b\u4e49\u3002", "scene_en": "A person tearing down a poster of a politician they once admired.", "scene_cn": "\u4e00\u4e2a\u4eba\u6495\u6bc1\u4e00\u5f20\u4ed6\u4eec\u66fe\u7ecf\u94a6\u4f69\u7684\u653f\u6cbb\u5bb6\u7684\u6d77\u62a5\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q7_disillusioned_1.png", "P6_vocabulary_exercises_28_Q7_disillusioned_2.png"], "examples": [{"en": "Many young voters became disillusioned with the political system after the broken promises.", "cn": "\u5728\u627f\u8bfa\u843d\u7a7a\u540e\uff0c\u8bb8\u591a\u5e74\u8f7b\u9009\u6c11\u5bf9\u653f\u6cbb\u4f53\u5236\u611f\u5230\u5931\u671b\u3002"}, {"en": "He grew disillusioned with his job when he realized his efforts were not appreciated.", "cn": "\u5f53\u4ed6\u610f\u8bc6\u5230\u81ea\u5df1\u7684\u52aa\u529b\u6ca1\u6709\u5f97\u5230\u8d4f\u8bc6\u65f6\uff0c\u4ed6\u5bf9\u81ea\u5df1\u7684\u5de5\u4f5c\u611f\u5230\u5931\u671b\u3002"}]}], "synonym_cn": "\u6cae\u4e27\uff0c\u7070\u5fc3\uff0c\u6c14\u9981", "socratic_questions": [{"question": "Imagine a soldier losing faith in their mission after repeated failures. Which word best describes their feeling?", "options": ["demoralised", "disturbed", "traumatised", "disillusioned"], "correct_answer": "demoralised", "explanation": "Demoralised means having lost confidence or hope, fitting the soldier's situation."}, {"question": "Consider someone deeply troubled by a nightmare. Which word reflects their state?", "options": ["demoralised", "disturbed", "traumatised", "disillusioned"], "correct_answer": "disturbed", "explanation": "Disturbed implies being troubled or upset, aligning with the aftermath of a nightmare."}, {"question": "If someone witnessed a terrible accident, which word describes their potential emotional state?", "options": ["demoralised", "disturbed", "traumatised", "disillusioned"], "correct_answer": "traumatised", "explanation": "Traumatised suggests experiencing lasting emotional shock from a distressing event."}, {"question": "If a politician promises change but fails to deliver, how might their supporters feel?", "options": ["demoralised", "disturbed", "traumatised", "disillusioned"], "correct_answer": "disillusioned", "explanation": "Disillusioned means losing faith in something previously believed to be good or true."}]}, {"id": 8, "stem": "I have a sore throat and find it difficult to ______.", "correct_index": 3, "options": [{"word": "chew", "ipa": "/t\u0283u\u02d0/", "meanings": {"en": "To bite and grind food in your mouth so it can be swallowed.", "cn": "\u5728\u5634\u91cc\u54ac\u548c\u78e8\u788e\u98df\u7269\uff0c\u4ee5\u4fbf\u541e\u54bd\u3002"}, "usage_en": "Used to describe the action of breaking down food with your teeth.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7528\u7259\u9f7f\u5206\u89e3\u98df\u7269\u7684\u52a8\u4f5c\u3002", "scene_en": "A person eating a steak and using their teeth to break it down.", "scene_cn": "\u4e00\u4e2a\u4eba\u6b63\u5728\u5403\u725b\u6392\uff0c\u5e76\u7528\u7259\u9f7f\u5c06\u5176\u5206\u89e3\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q8_chew_1.png", "P6_vocabulary_exercises_28_Q8_chew_2.png"], "examples": [{"en": "It is important to chew your food thoroughly to aid in digestion later on.", "cn": "\u5f7b\u5e95\u5480\u56bc\u98df\u7269\u975e\u5e38\u91cd\u8981\uff0c\u6709\u52a9\u4e8e\u4ee5\u540e\u7684\u6d88\u5316\u3002"}, {"en": "The cow continued to chew its cud, seemingly lost in its own thoughts.", "cn": "\u8fd9\u5934\u725b\u7ee7\u7eed\u5480\u56bc\u7740\u5b83\u7684\u98df\u7269\uff0c\u4f3c\u4e4e\u9677\u5165\u4e86\u81ea\u5df1\u7684\u601d\u7eea\u4e2d\u3002"}]}, {"word": "bite", "ipa": "/ba\u026at/", "meanings": {"en": "To use your teeth to cut into something.", "cn": "\u7528\u7259\u9f7f\u54ac\u5165\u67d0\u7269\u3002"}, "usage_en": "Describes the action of cutting into something with the teeth.", "usage_cn": "\u63cf\u8ff0\u7528\u7259\u9f7f\u54ac\u5165\u67d0\u7269\u7684\u52a8\u4f5c\u3002", "scene_en": "A person biting into an apple, leaving a visible mark.", "scene_cn": "\u4e00\u4e2a\u4eba\u54ac\u4e86\u4e00\u53e3\u82f9\u679c\uff0c\u7559\u4e0b\u4e86\u4e00\u4e2a\u53ef\u89c1\u7684\u75d5\u8ff9\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q8_bite_1.png", "P6_vocabulary_exercises_28_Q8_bite_2.png"], "examples": [{"en": "She took a bite of the chocolate bar and savored the sweet, rich flavor.", "cn": "\u5979\u54ac\u4e86\u4e00\u53e3\u5de7\u514b\u529b\u68d2\uff0c\u7ec6\u7ec6\u54c1\u5473\u7740\u9999\u751c\u6d53\u90c1\u7684\u5473\u9053\u3002"}, {"en": "The dog might bite if it feels threatened or if someone approaches its food.", "cn": "\u5982\u679c\u72d7\u611f\u5230\u53d7\u5230\u5a01\u80c1\uff0c\u6216\u8005\u6709\u4eba\u9760\u8fd1\u5b83\u7684\u98df\u7269\uff0c\u5b83\u53ef\u80fd\u4f1a\u54ac\u4eba\u3002"}]}, {"word": "digest", "ipa": "/da\u026a\u02c8d\u0292est/", "meanings": {"en": "To break down food in the stomach and intestines so that it can be absorbed by the body.", "cn": "\u5728\u80c3\u548c\u80a0\u9053\u4e2d\u5206\u89e3\u98df\u7269\uff0c\u4ee5\u4fbf\u8eab\u4f53\u53ef\u4ee5\u5438\u6536\u3002"}, "usage_en": "Refers to the process of breaking down food for absorption.", "usage_cn": "\u6307\u5206\u89e3\u98df\u7269\u4ee5\u4f9b\u5438\u6536\u7684\u8fc7\u7a0b\u3002", "scene_en": "A diagram showing the human digestive system processing food.", "scene_cn": "\u4e00\u5f20\u663e\u793a\u4eba\u4f53\u6d88\u5316\u7cfb\u7edf\u5904\u7406\u98df\u7269\u7684\u56fe\u8868\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q8_digest_1.png", "P6_vocabulary_exercises_28_Q8_digest_2.png"], "examples": [{"en": "It takes several hours for the body to digest a large meal completely and effectively.", "cn": "\u8eab\u4f53\u9700\u8981\u51e0\u4e2a\u5c0f\u65f6\u624d\u80fd\u5b8c\u5168\u6709\u6548\u5730\u6d88\u5316\u4e00\u987f\u5927\u9910\u3002"}, {"en": "Some people find it difficult to digest certain foods, like dairy or gluten products.", "cn": "\u6709\u4e9b\u4eba\u53d1\u73b0\u5f88\u96be\u6d88\u5316\u67d0\u4e9b\u98df\u7269\uff0c\u5982\u4e73\u5236\u54c1\u6216\u9762\u7b4b\u4ea7\u54c1\u3002"}]}, {"word": "swallow", "ipa": "/\u02c8sw\u0252l\u0259\u028a/", "meanings": {"en": "To cause food, drink, pills, etc. to pass from your mouth into your stomach.", "cn": "\u4f7f\u98df\u7269\u3001\u996e\u6599\u3001\u836f\u4e38\u7b49\u4ece\u4f60\u7684\u5634\u91cc\u8fdb\u5165\u4f60\u7684\u80c3\u91cc\u3002"}, "usage_en": "Describes the act of moving something from the mouth to the stomach.", "usage_cn": "\u63cf\u8ff0\u5c06\u4e1c\u897f\u4ece\u5634\u91cc\u79fb\u5230\u80c3\u91cc\u7684\u52a8\u4f5c\u3002", "scene_en": "A person swallowing a pill with a glass of water.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u6c34\u541e\u4e0b\u4e00\u9897\u836f\u4e38\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q8_swallow_1.png", "P6_vocabulary_exercises_28_Q8_swallow_2.png"], "examples": [{"en": "I tried to swallow the large pill, but it got stuck in my throat uncomfortably.", "cn": "\u6211\u8bd5\u56fe\u541e\u4e0b\u90a3\u9897\u5927\u836f\u4e38\uff0c\u4f46\u5b83\u4e0d\u8212\u670d\u5730\u5361\u5728\u6211\u7684\u5589\u5499\u91cc\u3002"}, {"en": "She had to swallow her pride and apologize for her mistake to move forward.", "cn": "\u5979\u4e0d\u5f97\u4e0d\u653e\u4e0b\u81ea\u5c0a\uff0c\u4e3a\u81ea\u5df1\u7684\u9519\u8bef\u9053\u6b49\uff0c\u624d\u80fd\u7ee7\u7eed\u524d\u8fdb\u3002"}]}], "synonym_cn": "\u54bd\u4e0b vs \u5480\u56bc vs \u6d88\u5316 vs \u54ac", "socratic_questions": [{"question": "If you are enjoying a delicious steak, what action are you likely performing?", "options": ["chew", "bite", "digest", "swallow"], "correct_answer": "chew", "explanation": "Chewing involves using your teeth to break down food in your mouth."}, {"question": "When you take a piece of apple, what is the first action you do with your teeth?", "options": ["chew", "bite", "digest", "swallow"], "correct_answer": "bite", "explanation": "Biting is the act of cutting into something with your teeth."}, {"question": "After you eat a meal, what process does your body begin to break down the food?", "options": ["chew", "bite", "digest", "swallow"], "correct_answer": "digest", "explanation": "Digesting is the process of breaking down food in the stomach and intestines."}, {"question": "When you drink water, what action do you perform to move it down your throat?", "options": ["chew", "bite", "digest", "swallow"], "correct_answer": "swallow", "explanation": "Swallowing is the act of causing something to pass from your mouth to your stomach."}]}, {"id": 9, "stem": "The hut stood in the middle of the woods. It was completely ______.", "correct_index": 2, "options": [{"word": "alone", "ipa": "/\u0259\u02c8lo\u028an/", "meanings": {"en": "Having no one else present; solitary.", "cn": "\u6ca1\u6709\u5176\u4ed6\u4eba\u5728\u573a; \u5b64\u72ec\u7684\u3002"}, "usage_en": "Used to describe being physically by oneself.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u72ec\u81ea\u4e00\u4eba\u7684\u72b6\u6001\u3002", "scene_en": "A person sitting on a park bench, reading a book with no one around.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u516c\u56ed\u7684\u957f\u6905\u4e0a\uff0c\u8bfb\u4e66\uff0c\u5468\u56f4\u6ca1\u6709\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q9_alone_1.png", "P6_vocabulary_exercises_28_Q9_alone_2.png"], "examples": [{"en": "She prefers to work alone in her studio to avoid distractions from others.", "cn": "\u5979\u66f4\u559c\u6b22\u5728\u81ea\u5df1\u7684\u5de5\u4f5c\u5ba4\u91cc\u72ec\u81ea\u5de5\u4f5c\uff0c\u4ee5\u907f\u514d\u53d7\u5230\u4ed6\u4eba\u7684\u5e72\u6270\u3002"}, {"en": "After the argument, he felt completely alone, even though he was surrounded by people.", "cn": "\u4e89\u5435\u4e4b\u540e\uff0c\u4ed6\u611f\u5230\u975e\u5e38\u5b64\u72ec\uff0c\u5373\u4f7f\u4ed6\u88ab\u4eba\u7fa4\u5305\u56f4\u7740\u3002"}]}, {"word": "singular", "ipa": "/\u02c8s\u026a\u014b\u0261j\u0259l\u0259r/", "meanings": {"en": "Remarkably good or unusual; unique.", "cn": "\u975e\u5e38\u597d\u7684\u6216\u4e0d\u5bfb\u5e38\u7684; \u72ec\u7279\u7684\u3002"}, "usage_en": "Describes something unique or exceptional.", "usage_cn": "\u63cf\u8ff0\u72ec\u7279\u6216\u975e\u51e1\u7684\u4e8b\u7269\u3002", "scene_en": "A rare and beautiful flower blooming in a field of common flowers.", "scene_cn": "\u4e00\u6735\u7f55\u89c1\u800c\u7f8e\u4e3d\u7684\u82b1\u6735\u76db\u5f00\u5728\u666e\u901a\u7684\u9c9c\u82b1\u7530\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q9_singular_1.png", "P6_vocabulary_exercises_28_Q9_singular_2.png"], "examples": [{"en": "Her singular talent for painting made her one of the most sought-after artists.", "cn": "\u5979\u975e\u51e1\u7684\u7ed8\u753b\u5929\u8d4b\u4f7f\u5979\u6210\u4e3a\u6700\u53d7\u6b22\u8fce\u7684\u827a\u672f\u5bb6\u4e4b\u4e00\u3002"}, {"en": "The restaurant's singular dish, a spicy seafood stew, is famous throughout the region.", "cn": "\u8fd9\u5bb6\u9910\u5385\u7684\u7279\u8272\u83dc\uff0c\u4e00\u9053\u8f9b\u8fa3\u7684\u6d77\u9c9c\u7096\u83dc\uff0c\u5728\u6574\u4e2a\u5730\u533a\u90fd\u5f88\u6709\u540d\u3002"}]}, {"word": "isolated", "ipa": "/\u02c8a\u026as\u0259le\u026at\u026ad/", "meanings": {"en": "Far away from other places, buildings, or people; remote.", "cn": "\u8fdc\u79bb\u5176\u4ed6\u5730\u65b9\u3001\u5efa\u7b51\u7269\u6216\u4eba; \u504f\u8fdc\u7684\u3002"}, "usage_en": "Describes something physically separated from others.", "usage_cn": "\u63cf\u8ff0\u4e0e\u4ed6\u4eba\u7269\u7406\u4e0a\u5206\u79bb\u7684\u4e8b\u7269\u3002", "scene_en": "A small cabin located on top of a snowy mountain, far from civilization.", "scene_cn": "\u4e00\u4e2a\u5c0f\u5c4b\u4f4d\u4e8e\u767d\u96ea\u7691\u7691\u7684\u5c71\u9876\u4e0a\uff0c\u8fdc\u79bb\u6587\u660e\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q9_isolated_1.png", "P6_vocabulary_exercises_28_Q9_isolated_2.png"], "examples": [{"en": "The research team worked in an isolated lab to prevent any contamination of their samples.", "cn": "\u7814\u7a76\u56e2\u961f\u5728\u4e00\u4e2a\u9694\u79bb\u7684\u5b9e\u9a8c\u5ba4\u91cc\u5de5\u4f5c\uff0c\u4ee5\u9632\u6b62\u4ed6\u4eec\u7684\u6837\u672c\u53d7\u5230\u4efb\u4f55\u6c61\u67d3\u3002"}, {"en": "Living on an isolated island can be peaceful, but it also presents unique challenges.", "cn": "\u751f\u6d3b\u5728\u4e00\u4e2a\u504f\u8fdc\u7684\u5c9b\u5c7f\u4e0a\u53ef\u80fd\u5f88\u5e73\u9759\uff0c\u4f46\u4e5f\u5e26\u6765\u72ec\u7279\u7684\u6311\u6218\u3002"}]}, {"word": "desolated", "ipa": "/\u02c8des\u0259le\u026at\u026ad/", "meanings": {"en": "In a state of bleak and dismal emptiness.", "cn": "\u5904\u4e8e\u8352\u51c9\u548c\u4ee4\u4eba\u6cae\u4e27\u7684\u7a7a\u865a\u72b6\u6001\u3002"}, "usage_en": "Describes a place or feeling of emptiness and sadness.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u7a7a\u865a\u548c\u60b2\u4f24\u7684\u5730\u65b9\u6216\u611f\u89c9\u3002", "scene_en": "A barren landscape after a wildfire, with charred trees and ash everywhere.", "scene_cn": "\u91ce\u706b\u8fc7\u540e\u4e00\u7247\u8352\u829c\u7684\u666f\u8c61\uff0c\u5230\u5904\u90fd\u662f\u70e7\u7126\u7684\u6811\u6728\u548c\u7070\u70ec\u3002", "image_paths": ["P6_vocabulary_exercises_28_Q9_desolated_1.png", "P6_vocabulary_exercises_28_Q9_desolated_2.png"], "examples": [{"en": "The town was left desolated after the hurricane, with many homes completely destroyed.", "cn": "\u98d3\u98ce\u8fc7\u540e\uff0c\u8be5\u9547\u4e00\u7247\u8352\u51c9\uff0c\u8bb8\u591a\u623f\u5c4b\u5b8c\u5168\u88ab\u6467\u6bc1\u3002"}, {"en": "She felt desolated after her best friend moved away, leaving her with a profound sense of loss.", "cn": "\u5979\u6700\u597d\u7684\u670b\u53cb\u642c\u8d70\u540e\uff0c\u5979\u611f\u5230\u975e\u5e38\u6cae\u4e27\uff0c\u7559\u4e0b\u4e86\u6df1\u523b\u7684\u5931\u843d\u611f\u3002"}]}], "synonym_cn": "\u5b64\u72ec\u7684; \u504f\u8fdc\u7684; \u8352\u51c9\u7684", "socratic_questions": [{"question": "If a scientist works on a project without any collaborators, is their research considered more 'alone', 'singular', 'isolated', or 'desolated'?", "options": ["alone", "singular", "isolated", "desolated"], "correct_answer": "isolated", "explanation": "'Isolated' best describes being separated from others in a professional context."}, {"question": "Which word describes a feeling of great sadness and emptiness, like after a natural disaster: 'alone', 'singular', 'isolated', or 'desolated'?", "options": ["alone", "singular", "isolated", "desolated"], "correct_answer": "desolated", "explanation": "'Desolated' implies a state of ruin and emotional emptiness."}, {"question": "Which word describes a person who prefers to spend time by themselves, enjoying their own company: 'alone', 'singular', 'isolated', or 'desolated'?", "options": ["alone", "singular", "isolated", "desolated"], "correct_answer": "alone", "explanation": "'Alone' suggests being by oneself, often by choice."}, {"question": "If you are describing something that is unique and one of a kind, would you call it 'alone', 'singular', 'isolated', or 'desolated'?", "options": ["alone", "singular", "isolated", "desolated"], "cor
