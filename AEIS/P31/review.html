    <script>
        const DB = {"meta": {"source_pdf": "D:\\Python\u81ea\u52a8\u5316\\AeisLab_Final\\Vocab\\P6_vocabulary_exercises\\P6_vocabulary_exercises_31.pdf", "azure_key": "DKRXk8ueSfo5NdIOMqFRTCAfpeGDezJ3Snf5K8gGgtyqxiWdugLzJQQJ99BLACHYHv6XJ3w3AAAYACOGUYP9", "azure_region": "eastus2"}, "questions": [{"id": 1, "stem": "Look at the _______ of that book. Its binding is all torn.", "correct_index": 2, "options": [{"word": "result", "ipa": "/r\u026a\u02c8z\u028clt/", "meanings": {"en": "A thing that is caused or produced by something else; a consequence or outcome.", "cn": "\u7531\u5176\u4ed6\u4e8b\u7269\u5f15\u8d77\u6216\u4ea7\u751f\u7684\u4e8b\u7269\uff1b\u7ed3\u679c\u6216\u7ed3\u5c40\u3002"}, "usage_en": "Used to describe the outcome of an action or process.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u884c\u52a8\u6216\u8fc7\u7a0b\u7684\u7ed3\u679c\u3002", "scene_en": "A student receiving a test score, a team winning a game.", "scene_cn": "\u5b66\u751f\u6536\u5230\u8003\u8bd5\u6210\u7ee9\uff0c\u56e2\u961f\u8d62\u5f97\u6bd4\u8d5b\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q1_result_1.png", "P6_vocabulary_exercises_31_Q1_result_2.png"], "examples": [{"en": "The experiment's result confirmed the hypothesis, leading to a significant scientific breakthrough.", "cn": "\u5b9e\u9a8c\u7684\u7ed3\u679c\u8bc1\u5b9e\u4e86\u5047\u8bbe\uff0c\u4ece\u800c\u5e26\u6765\u4e86\u91cd\u5927\u7684\u79d1\u5b66\u7a81\u7834\u3002"}, {"en": "The result of the election was unexpected, changing the political landscape dramatically.", "cn": "\u9009\u4e3e\u7684\u7ed3\u679c\u51fa\u4e4e\u610f\u6599\uff0c\u6781\u5927\u5730\u6539\u53d8\u4e86\u653f\u6cbb\u683c\u5c40\u3002"}]}, {"word": "look", "ipa": "/l\u028ak/", "meanings": {"en": "An act of directing your eyes in order to see.", "cn": "\u4e3a\u4e86\u770b\u800c\u5c06\u89c6\u7ebf\u6295\u5411\u67d0\u5904\u7684\u884c\u4e3a\u3002"}, "usage_en": "Refers to the act of seeing or the appearance of something.", "usage_cn": "\u6307\u770b\u7684\u52a8\u4f5c\u6216\u67d0\u7269\u7684\u5916\u89c2\u3002", "scene_en": "Someone looking at a painting, a person's facial expression.", "scene_cn": "\u67d0\u4eba\u770b\u7740\u4e00\u5e45\u753b\uff0c\u4e00\u4e2a\u4eba\u7684\u9762\u90e8\u8868\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q1_look_1.png", "P6_vocabulary_exercises_31_Q1_look_2.png"], "examples": [{"en": "She gave me a questioning look, wondering if I was telling the truth.", "cn": "\u5979\u7ed9\u4e86\u6211\u4e00\u4e2a\u8d28\u7591\u7684\u773c\u795e\uff0c\u60f3\u77e5\u9053\u6211\u662f\u5426\u5728\u8bf4\u771f\u8bdd\u3002"}, {"en": "Take a look at this beautiful sunset; the colors are absolutely breathtaking tonight.", "cn": "\u770b\u770b\u8fd9\u7f8e\u4e3d\u7684\u65e5\u843d\uff1b\u4eca\u665a\u7684\u989c\u8272\u7edd\u5bf9\u4ee4\u4eba\u53f9\u4e3a\u89c2\u6b62\u3002"}]}, {"word": "condition", "ipa": "/k\u0259n\u02c8d\u026a\u0283\u0259n/", "meanings": {"en": "The state of something with regard to its appearance, quality, or working order.", "cn": "\u67d0\u7269\u7684\u72b6\u6001\uff0c\u5305\u62ec\u5176\u5916\u89c2\u3001\u8d28\u91cf\u6216\u5de5\u4f5c\u72b6\u6001\u3002"}, "usage_en": "Describes the state or shape that something is in.", "usage_cn": "\u63cf\u8ff0\u67d0\u7269\u7684\u72b6\u6001\u6216\u5f62\u72b6\u3002", "scene_en": "A car's condition after an accident, a patient's medical condition.", "scene_cn": "\u4e8b\u6545\u540e\u6c7d\u8f66\u7684\u72b6\u51b5\uff0c\u75c5\u4eba\u7684\u533b\u7597\u72b6\u51b5\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q1_condition_1.png", "P6_vocabulary_exercises_31_Q1_condition_2.png"], "examples": [{"en": "The condition of the old house was poor; it needed extensive repairs and renovations.", "cn": "\u8fd9\u680b\u8001\u623f\u5b50\u7684\u72b6\u51b5\u5f88\u5dee\uff1b\u5b83\u9700\u8981\u5927\u91cf\u7684\u7ef4\u4fee\u548c\u7ffb\u65b0\u3002"}, {"en": "The athlete's physical condition was excellent, allowing him to perform at his best.", "cn": "\u8fd9\u4f4d\u8fd0\u52a8\u5458\u7684\u8eab\u4f53\u72b6\u51b5\u975e\u5e38\u597d\uff0c\u4f7f\u4ed6\u80fd\u591f\u53d1\u6325\u51fa\u6700\u4f73\u6c34\u5e73\u3002"}]}, {"word": "sight", "ipa": "/sa\u026at/", "meanings": {"en": "The ability to see; the power of vision.", "cn": "\u770b\u89c1\u7684\u80fd\u529b\uff1b\u89c6\u89c9\u7684\u529b\u91cf\u3002"}, "usage_en": "Refers to the ability to see or something that is seen.", "usage_cn": "\u6307\u770b\u89c1\u7684\u80fd\u529b\u6216\u88ab\u770b\u89c1\u7684\u4e8b\u7269\u3002", "scene_en": "A person looking at a beautiful landscape, a doctor testing someone's sight.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u7740\u7f8e\u4e3d\u7684\u98ce\u666f\uff0c\u533b\u751f\u6d4b\u8bd5\u67d0\u4eba\u7684\u89c6\u529b\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q1_sight_1.png", "P6_vocabulary_exercises_31_Q1_sight_2.png"], "examples": [{"en": "The sight of the mountains covered in snow was truly breathtaking and unforgettable.", "cn": "\u767d\u96ea\u8986\u76d6\u7684\u5c71\u8109\u666f\u8c61\u771f\u662f\u4ee4\u4eba\u53f9\u4e3a\u89c2\u6b62\uff0c\u96be\u4ee5\u5fd8\u6000\u3002"}, {"en": "After the surgery, his sight improved dramatically, allowing him to see clearly again.", "cn": "\u624b\u672f\u540e\uff0c\u4ed6\u7684\u89c6\u529b\u5927\u5927\u63d0\u9ad8\uff0c\u4f7f\u4ed6\u80fd\u591f\u518d\u6b21\u6e05\u695a\u5730\u770b\u5230\u4e1c\u897f\u3002"}]}], "synonym_cn": "\u72b6\u6001, \u72b6\u51b5, \u60c5\u5f62", "socratic_questions": [{"question": "If you achieve the desired outcome after hard work, is that the final _______?", "options": ["result", "look", "condition", "sight"], "correct_answer": "result", "explanation": "The 'result' is the outcome or consequence of an action or process."}, {"question": "What is your initial _______ when you see a beautiful painting in a gallery?", "options": ["result", "look", "condition", "sight"], "correct_answer": "look", "explanation": "A 'look' refers to an act of directing your eyes to see something."}, {"question": "What is the _______ of the patient after the surgery; are they stable?", "options": ["result", "look", "condition", "sight"], "correct_answer": "condition", "explanation": "'Condition' refers to the state or situation of something or someone."}, {"question": "What is your favorite _______ to see when you visit the beach?", "options": ["result", "look", "condition", "sight"], "correct_answer": "sight", "explanation": "'Sight' refers to the ability to see or something that is seen."}]}, {"id": 2, "stem": "His health has _______ so much that he is now bedridden.", "correct_index": 0, "options": [{"word": "deteriorated", "ipa": "/d\u026a\u02c8t\u026a\u0259ri\u0259re\u026at\u026ad/", "meanings": {"en": "To become progressively worse.", "cn": "\u9010\u6e10\u53d8\u5f97\u66f4\u7cdf\u3002"}, "usage_en": "Used to describe a decline in quality, condition, or strength.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8d28\u91cf\u3001\u72b6\u51b5\u6216\u529b\u91cf\u7684\u4e0b\u964d\u3002", "scene_en": "A rusty old car sitting in a junkyard, paint peeling, parts missing.", "scene_cn": "\u4e00\u8f86\u751f\u9508\u7684\u65e7\u8f66\u505c\u5728\u5783\u573e\u573a\uff0c\u6cb9\u6f06\u5265\u843d\uff0c\u96f6\u4ef6\u7f3a\u5931\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q2_deteriorated_1.png", "P6_vocabulary_exercises_31_Q2_deteriorated_2.png"], "examples": [{"en": "The old bridge deteriorated over time due to neglect and lack of maintenance.", "cn": "\u7531\u4e8e\u758f\u5ffd\u548c\u7f3a\u4e4f\u7ef4\u62a4\uff0c\u8fd9\u5ea7\u65e7\u6865\u968f\u7740\u65f6\u95f4\u7684\u63a8\u79fb\u800c\u6076\u5316\u3002"}, {"en": "Her eyesight deteriorated gradually, requiring her to get stronger prescription glasses yearly.", "cn": "\u5979\u7684\u89c6\u529b\u9010\u6e10\u6076\u5316\uff0c\u9700\u8981\u5979\u6bcf\u5e74\u914d\u66f4\u9ad8\u5ea6\u6570\u7684\u773c\u955c\u3002"}]}, {"word": "decreased", "ipa": "/d\u026a\u02c8kri\u02d0st/", "meanings": {"en": "To become or make less; diminish.", "cn": "\u53d8\u5f97\u6216\u4f7f\u4e4b\u53d8\u5c11\uff1b\u51cf\u5c11\u3002"}, "usage_en": "Used to indicate a reduction in size, quantity, intensity, or degree.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u5c3a\u5bf8\u3001\u6570\u91cf\u3001\u5f3a\u5ea6\u6216\u7a0b\u5ea6\u7684\u51cf\u5c11\u3002", "scene_en": "A graph showing a downward trend, indicating a reduction in sales numbers.", "scene_cn": "\u4e00\u5f20\u663e\u793a\u4e0b\u964d\u8d8b\u52bf\u7684\u56fe\u8868\uff0c\u8868\u660e\u9500\u552e\u989d\u51cf\u5c11\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q2_decreased_1.png", "P6_vocabulary_exercises_31_Q2_decreased_2.png"], "examples": [{"en": "The amount of rainfall decreased significantly this year, leading to a severe drought.", "cn": "\u4eca\u5e74\u7684\u964d\u96e8\u91cf\u663e\u8457\u51cf\u5c11\uff0c\u5bfc\u81f4\u4e25\u91cd\u7684\u5e72\u65f1\u3002"}, {"en": "The company's profits decreased after the introduction of new competitors into the market.", "cn": "\u5728\u65b0\u7ade\u4e89\u5bf9\u624b\u8fdb\u5165\u5e02\u573a\u540e\uff0c\u516c\u53f8\u7684\u5229\u6da6\u4e0b\u964d\u4e86\u3002"}]}, {"word": "Worsen", "ipa": "/\u02c8w\u025c\u02d0rs\u0259n/", "meanings": {"en": "To make or become worse.", "cn": "\u4f7f\u53d8\u5f97\u6216\u53d8\u5f97\u66f4\u7cdf\u3002"}, "usage_en": "Used when something is becoming more severe, serious, or unpleasant.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u53d8\u5f97\u66f4\u4e25\u91cd\u3001\u66f4\u4ee4\u4eba\u4e0d\u5feb\u3002", "scene_en": "A dark stormy sky, with heavy rain and strong winds.", "scene_cn": "\u9ed1\u6697\u66b4\u98ce\u96e8\u7684\u5929\u7a7a\uff0c\u4f34\u968f\u7740\u5927\u96e8\u548c\u5f3a\u98ce\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q2_Worsen_1.png", "P6_vocabulary_exercises_31_Q2_Worsen_2.png"], "examples": [{"en": "The patient's condition began to worsen rapidly, requiring immediate medical intervention and attention.", "cn": "\u75c5\u4eba\u7684\u75c5\u60c5\u5f00\u59cb\u8fc5\u901f\u6076\u5316\uff0c\u9700\u8981\u7acb\u5373\u8fdb\u884c\u533b\u7597\u5e72\u9884\u548c\u5173\u6ce8\u3002"}, {"en": "The relationship between the two countries began to worsen after the trade agreement collapsed.", "cn": "\u4e24\u56fd\u4e4b\u95f4\u7684\u5173\u7cfb\u5728\u8d38\u6613\u534f\u5b9a\u5d29\u6e83\u540e\u5f00\u59cb\u6076\u5316\u3002"}]}, {"word": "crumbled", "ipa": "/\u02c8kr\u028cmb\u0259ld/", "meanings": {"en": "To break or fall apart into small fragments or pieces.", "cn": "\u7834\u788e\u6216\u5d29\u89e3\u6210\u5c0f\u788e\u7247\u6216\u5c0f\u5757\u3002"}, "usage_en": "Used to describe something that has broken down into small pieces, often due to decay or pressure.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7531\u4e8e\u8150\u70c2\u6216\u538b\u529b\u800c\u5206\u89e3\u6210\u5c0f\u5757\u7684\u4e1c\u897f\u3002", "scene_en": "An old, decaying brick wall with pieces falling off.", "scene_cn": "\u4e00\u9762\u53e4\u8001\u3001\u8150\u70c2\u7684\u7816\u5899\uff0c\u788e\u7247\u6b63\u5728\u8131\u843d\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q2_crumbled_1.png", "P6_vocabulary_exercises_31_Q2_crumbled_2.png"], "examples": [{"en": "The ancient statue crumbled to dust after centuries of exposure to the harsh elements outside.", "cn": "\u8fd9\u5ea7\u53e4\u8001\u7684\u96d5\u50cf\u5728\u7ecf\u5386\u4e86\u51e0\u4e2a\u4e16\u7eaa\u7684\u6076\u52a3\u73af\u5883\u540e\uff0c\u5316\u4e3a\u5c18\u571f\u3002"}, {"en": "The cookie crumbled in my hand as I tried to take a bite, making a mess.", "cn": "\u5f53\u6211\u8bd5\u56fe\u54ac\u4e00\u53e3\u65f6\uff0c\u997c\u5e72\u5728\u6211\u624b\u4e2d\u788e\u4e86\uff0c\u5f04\u5f97\u4e00\u56e2\u7cdf\u3002"}]}], "synonym_cn": "\u6076\u5316, \u4e0b\u964d, \u53d8\u574f, \u5d29\u6e83", "socratic_questions": [{"question": "If a building's structure is failing due to neglect, which word describes its condition?", "options": ["deteriorated", "decreased", "Worsen", "crumbled"], "correct_answer": "crumbled", "explanation": "Crumbled implies a breakdown in structure, fitting the building's failing condition."}, {"question": "If the number of students enrolled in a class has fallen from 30 to 20, which word describes this change?", "options": ["deteriorated", "decreased", "Worsen", "crumbled"], "correct_answer": "decreased", "explanation": "Decreased refers to a reduction in quantity or number, as in the student enrollment."}, {"question": "If the quality of air in a city is getting progressively poorer, which word describes this situation?", "options": ["deteriorated", "decreased", "Worsen", "crumbled"], "correct_answer": "Worsen", "explanation": "Worsen indicates a process of becoming worse, fitting the air quality scenario."}, {"question": "If someone's physical condition has declined from being active to being frail, which word describes this?", "options": ["deteriorated", "decreased", "Worsen", "crumbled"], "correct_answer": "deteriorated", "explanation": "Deteriorated suggests a decline in quality or condition, as in someone's health."}]}, {"id": 3, "stem": "The _______ boy just dashed across the road without looking out for any oncoming traffic.", "correct_index": 1, "options": [{"word": "wild", "ipa": "/wa\u026ald/", "meanings": {"en": "Living or growing in the natural environment; not domesticated or cultivated.", "cn": "\u5728\u81ea\u7136\u73af\u5883\u4e2d\u751f\u6d3b\u6216\u751f\u957f\uff1b\u672a\u7ecf\u9a6f\u517b\u6216\u8015\u79cd\u7684\u3002"}, "usage_en": "Describes something untamed or uncontrolled.", "usage_cn": "\u63cf\u8ff0\u672a\u9a6f\u670d\u6216\u4e0d\u53d7\u63a7\u5236\u7684\u4e8b\u7269\u3002", "scene_en": "A dense forest with untamed animals roaming freely.", "scene_cn": "\u4e00\u7247\u8302\u5bc6\u7684\u68ee\u6797\uff0c\u672a\u9a6f\u670d\u7684\u52a8\u7269\u5728\u5176\u4e2d\u81ea\u7531\u6f2b\u6e38\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q3_wild_1.png", "P6_vocabulary_exercises_31_Q3_wild_2.png"], "examples": [{"en": "The wild horses roamed freely across the vast, open plains, enjoying their freedom.", "cn": "\u91ce\u9a6c\u5728\u5e7f\u9614\u7684\u5e73\u539f\u4e0a\u81ea\u7531\u6f2b\u6b65\uff0c\u4eab\u53d7\u7740\u5b83\u4eec\u7684\u81ea\u7531\u3002"}, {"en": "She had a wild imagination, often creating fantastical stories and imaginary worlds.", "cn": "\u5979\u6709\u72c2\u91ce\u7684\u60f3\u8c61\u529b\uff0c\u7ecf\u5e38\u521b\u9020\u51fa\u5947\u5f02\u7684\u6545\u4e8b\u548c\u60f3\u8c61\u4e16\u754c\u3002"}]}, {"word": "careless", "ipa": "/\u02c8kerl\u0259s/", "meanings": {"en": "Not giving sufficient attention to avoiding harm or errors.", "cn": "\u6ca1\u6709\u7ed9\u4e88\u8db3\u591f\u7684\u6ce8\u610f\u4ee5\u907f\u514d\u4f24\u5bb3\u6216\u9519\u8bef\u3002"}, "usage_en": "Describes someone who lacks attention to detail or safety.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u7f3a\u4e4f\u5bf9\u7ec6\u8282\u6216\u5b89\u5168\u5173\u6ce8\u7684\u4eba\u3002", "scene_en": "A person spilling coffee due to not paying attention.", "scene_cn": "\u4e00\u4e2a\u4eba\u56e0\u4e3a\u4e0d\u6ce8\u610f\u800c\u6d12\u4e86\u5496\u5561\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q3_careless_1.png", "P6_vocabulary_exercises_31_Q3_careless_2.png"], "examples": [{"en": "His careless mistake led to a significant error in the final calculations of the project.", "cn": "\u4ed6\u7c97\u5fc3\u7684\u9519\u8bef\u5bfc\u81f4\u4e86\u9879\u76ee\u6700\u7ec8\u8ba1\u7b97\u4e2d\u7684\u91cd\u5927\u9519\u8bef\u3002"}, {"en": "She was careless with her belongings, often misplacing her keys and forgetting her wallet.", "cn": "\u5979\u5bf9\u81ea\u5df1\u7684\u7269\u54c1\u5f88\u7c97\u5fc3\uff0c\u7ecf\u5e38\u653e\u9519\u94a5\u5319\uff0c\u5fd8\u8bb0\u94b1\u5305\u3002"}]}, {"word": "reckless", "ipa": "/\u02c8rekl\u0259s/", "meanings": {"en": "Without thinking or caring about the consequences of one's actions.", "cn": "\u4e0d\u8003\u8651\u6216\u5173\u5fc3\u81ea\u5df1\u884c\u4e3a\u7684\u540e\u679c\u3002"}, "usage_en": "Describes someone who acts impulsively and dangerously.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u884c\u4e3a\u51b2\u52a8\u4e14\u5371\u9669\u7684\u4eba\u3002", "scene_en": "A person driving a car at high speed in a residential area.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u4f4f\u5b85\u533a\u9ad8\u901f\u9a7e\u9a76\u6c7d\u8f66\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q3_reckless_1.png", "P6_vocabulary_exercises_31_Q3_reckless_2.png"], "examples": [{"en": "The reckless driver ignored the warning signs and sped through the dangerous intersection quickly.", "cn": "\u9c81\u83bd\u7684\u53f8\u673a\u65e0\u89c6\u8b66\u544a\u6807\u5fd7\uff0c\u5feb\u901f\u9a76\u8fc7\u5371\u9669\u7684\u5341\u5b57\u8def\u53e3\u3002"}, {"en": "His reckless behavior put himself and others at risk of serious injury or even death.", "cn": "\u4ed6\u9c81\u83bd\u7684\u884c\u4e3a\u4f7f\u81ea\u5df1\u548c\u4ed6\u4eba\u9762\u4e34\u4e25\u91cd\u53d7\u4f24\u751a\u81f3\u6b7b\u4ea1\u7684\u98ce\u9669\u3002"}]}, {"word": "dangerous", "ipa": "/\u02c8de\u026and\u0292\u0259r\u0259s/", "meanings": {"en": "Likely to cause harm or damage.", "cn": "\u53ef\u80fd\u9020\u6210\u4f24\u5bb3\u6216\u635f\u5bb3\u3002"}, "usage_en": "Describes something that poses a threat or risk.", "usage_cn": "\u63cf\u8ff0\u6784\u6210\u5a01\u80c1\u6216\u98ce\u9669\u7684\u4e8b\u7269\u3002", "scene_en": "A construction site with exposed electrical wires.", "scene_cn": "\u4e00\u4e2a\u6709\u88f8\u9732\u7535\u7ebf\u7684\u5efa\u7b51\u5de5\u5730\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q3_dangerous_1.png", "P6_vocabulary_exercises_31_Q3_dangerous_2.png"], "examples": [{"en": "Climbing the mountain without proper equipment is a dangerous activity that should be avoided.", "cn": "\u5728\u6ca1\u6709\u9002\u5f53\u8bbe\u5907\u7684\u60c5\u51b5\u4e0b\u6500\u767b\u8fd9\u5ea7\u5c71\u662f\u4e00\u9879\u5371\u9669\u7684\u6d3b\u52a8\uff0c\u5e94\u8be5\u907f\u514d\u3002"}, {"en": "Swimming in the ocean during a storm is dangerous due to the strong currents and waves.", "cn": "\u5728\u66b4\u98ce\u96e8\u671f\u95f4\u5728\u6d77\u4e2d\u6e38\u6cf3\u662f\u5371\u9669\u7684\uff0c\u56e0\u4e3a\u6709\u5f3a\u70c8\u7684\u6d77\u6d41\u548c\u6d77\u6d6a\u3002"}]}], "synonym_cn": "\u7c97\u5fc3\uff0c\u9c81\u83bd\uff0c\u4e0d\u987e\u540e\u679c", "socratic_questions": [{"question": "If a child frequently disobeys rules and acts without thinking, are they more likely to be described as?", "options": ["wild", "careless", "reckless", "dangerous"], "correct_answer": "reckless", "explanation": "Reckless implies disregard for danger and consequences."}, {"question": "Which word describes a person who forgets to lock the door, leading to a potential robbery?", "options": ["wild", "careless", "reckless", "dangerous"], "correct_answer": "careless", "explanation": "Careless suggests a lack of attention or thought."}, {"question": "If a dog is untamed and unpredictable, running around and biting people, which word best describes it?", "options": ["wild", "careless", "reckless", "dangerous"], "correct_answer": "wild", "explanation": "Wild suggests an untamed, uncontrolled nature."}, {"question": "If someone drives a car at high speed through a crowded market, they are being?", "options": ["wild", "careless", "reckless", "dangerous"], "correct_answer": "dangerous", "explanation": "Dangerous implies a high risk of causing harm."}]}, {"id": 4, "stem": "We must always _______ for excellence and not be too easily satisfied.", "correct_index": 1, "options": [{"word": "work", "ipa": "/w\u025c\u02d0rk/", "meanings": {"en": "To exert effort towards a goal or task.", "cn": "\u4e3a\u5b9e\u73b0\u76ee\u6807\u6216\u5b8c\u6210\u4efb\u52a1\u800c\u4ed8\u51fa\u52aa\u529b\u3002"}, "usage_en": "General effort or activity.", "usage_cn": "\u6cdb\u6307\u52aa\u529b\u6216\u6d3b\u52a8\u3002", "scene_en": "A person sitting at a desk, typing on a computer, surrounded by papers.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u65c1\uff0c\u5728\u7535\u8111\u4e0a\u6253\u5b57\uff0c\u5468\u56f4\u90fd\u662f\u7eb8\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q4_work_1.png", "P6_vocabulary_exercises_31_Q4_work_2.png"], "examples": [{"en": "I have to work late tonight to finish this important project on time.", "cn": "\u6211\u4eca\u665a\u5fc5\u987b\u5de5\u4f5c\u5230\u5f88\u665a\u624d\u80fd\u6309\u65f6\u5b8c\u6210\u8fd9\u4e2a\u91cd\u8981\u7684\u9879\u76ee\u3002"}, {"en": "She works hard every day to provide for her family and secure their future.", "cn": "\u5979\u6bcf\u5929\u52aa\u529b\u5de5\u4f5c\uff0c\u4e3a\u5979\u7684\u5bb6\u4eba\u63d0\u4f9b\u751f\u6d3b\u4fdd\u969c\uff0c\u786e\u4fdd\u4ed6\u4eec\u7684\u672a\u6765\u3002"}]}, {"word": "strive", "ipa": "/stra\u026av/", "meanings": {"en": "To make great efforts to achieve or obtain something.", "cn": "\u4e3a\u4e86\u5b9e\u73b0\u6216\u83b7\u5f97\u67d0\u4e8b\u7269\u800c\u4ed8\u51fa\u5de8\u5927\u7684\u52aa\u529b\u3002"}, "usage_en": "Intense effort towards a specific goal.", "usage_cn": "\u4e3a\u5b9e\u73b0\u7279\u5b9a\u76ee\u6807\u800c\u8fdb\u884c\u7684\u5f3a\u70c8\u52aa\u529b\u3002", "scene_en": "An athlete running a marathon, pushing through exhaustion to reach the finish line.", "scene_cn": "\u4e00\u540d\u8fd0\u52a8\u5458\u8dd1\u9a6c\u62c9\u677e\uff0c\u514b\u670d\u75b2\u60eb\u5230\u8fbe\u7ec8\u70b9\u7ebf\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q4_strive_1.png", "P6_vocabulary_exercises_31_Q4_strive_2.png"], "examples": [{"en": "We must strive for peace and understanding between all nations to prevent future conflicts.", "cn": "\u6211\u4eec\u5fc5\u987b\u52aa\u529b\u5728\u6240\u6709\u56fd\u5bb6\u4e4b\u95f4\u5b9e\u73b0\u548c\u5e73\u4e0e\u7406\u89e3\uff0c\u4ee5\u9632\u6b62\u672a\u6765\u7684\u51b2\u7a81\u3002"}, {"en": "He strives to be the best student in his class by studying diligently every single day.", "cn": "\u4ed6\u52aa\u529b\u6210\u4e3a\u73ed\u4e0a\u6700\u597d\u7684\u5b66\u751f\uff0c\u6bcf\u5929\u90fd\u52e4\u594b\u5b66\u4e60\u3002"}]}, {"word": "aim", "ipa": "/e\u026am/", "meanings": {"en": "To have the intention of achieving a particular goal.", "cn": "\u610f\u56fe\u5b9e\u73b0\u7279\u5b9a\u76ee\u6807\u3002"}, "usage_en": "Setting a goal or objective.", "usage_cn": "\u8bbe\u5b9a\u76ee\u6807\u6216\u76ee\u7684\u3002", "scene_en": "An archer aiming an arrow at a target, focusing on precision and accuracy.", "scene_cn": "\u4e00\u4e2a\u5f13\u7bad\u624b\u5c06\u7bad\u7784\u51c6\u76ee\u6807\uff0c\u4e13\u6ce8\u4e8e\u7cbe\u786e\u548c\u51c6\u786e\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q4_aim_1.png", "P6_vocabulary_exercises_31_Q4_aim_2.png"], "examples": [{"en": "I aim to complete my degree by the end of next year with honors and distinction.", "cn": "\u6211\u7684\u76ee\u6807\u662f\u5728\u660e\u5e74\u5e74\u5e95\u4ee5\u4f18\u5f02\u7684\u6210\u7ee9\u5b8c\u6210\u6211\u7684\u5b66\u4f4d\u3002"}, {"en": "The company aims to increase its market share by launching innovative new products soon.", "cn": "\u8be5\u516c\u53f8\u65e8\u5728\u901a\u8fc7\u5c3d\u5feb\u63a8\u51fa\u521b\u65b0\u4ea7\u54c1\u6765\u589e\u52a0\u5176\u5e02\u573a\u4efd\u989d\u3002"}]}, {"word": "achieve", "ipa": "/\u0259\u02c8t\u0283i\u02d0v/", "meanings": {"en": "To successfully reach or obtain a desired goal or result.", "cn": "\u6210\u529f\u8fbe\u5230\u6216\u83b7\u5f97\u671f\u671b\u7684\u76ee\u6807\u6216\u7ed3\u679c\u3002"}, "usage_en": "Successfully reaching a goal.", "usage_cn": "\u6210\u529f\u8fbe\u5230\u76ee\u6807\u3002", "scene_en": "A graduate receiving a diploma, symbolizing the successful completion of their studies.", "scene_cn": "\u4e00\u4f4d\u6bd5\u4e1a\u751f\u6536\u5230\u6587\u51ed\uff0c\u8c61\u5f81\u7740\u4ed6\u4eec\u6210\u529f\u5b8c\u6210\u4e86\u5b66\u4e1a\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q4_achieve_1.png", "P6_vocabulary_exercises_31_Q4_achieve_2.png"], "examples": [{"en": "With hard work and dedication, she was able to achieve her dream of becoming a doctor.", "cn": "\u901a\u8fc7\u52aa\u529b\u548c\u5949\u732e\uff0c\u5979\u6210\u529f\u5b9e\u73b0\u4e86\u5979\u6210\u4e3a\u4e00\u540d\u533b\u751f\u7684\u68a6\u60f3\u3002"}, {"en": "The team worked tirelessly to achieve their sales targets and exceed all expectations this quarter.", "cn": "\u8be5\u56e2\u961f\u4e0d\u61c8\u52aa\u529b\u4ee5\u5b9e\u73b0\u5176\u9500\u552e\u76ee\u6807\uff0c\u5e76\u5728\u672c\u5b63\u5ea6\u8d85\u51fa\u4e86\u6240\u6709\u9884\u671f\u3002"}]}], "synonym_cn": "\u52aa\u529b, \u594b\u6597, \u4e89\u53d6", "socratic_questions": [{"question": "If you consistently _______ to complete tasks without putting in much effort, can you truly achieve excellence?", "options": ["work", "strive", "aim", "achieve"], "correct_answer": "work", "explanation": "Working implies effort, but not necessarily a pursuit of excellence."}, {"question": "Imagine you are trying to reach a distant shore. Would you simply _______, or would you row with all your might?", "options": ["work", "strive", "aim", "achieve"], "correct_answer": "strive", "explanation": "Striving implies a vigorous effort towards a goal."}, {"question": "If your goal is to win a race, do you _______ to cross the finish line or simply run aimlessly?", "options": ["work", "strive", "aim", "achieve"], "correct_answer": "aim", "explanation": "Aiming refers to having a specific goal or objective."}, {"question": "If you _______ a goal, does it mean you necessarily put in the effort to reach it, or just that you reached it?", "options": ["work", "strive", "aim", "achieve"], "correct_answer": "achieve", "explanation": "Achieving means successfully reaching a goal, regardless of the effort."}]}, {"id": 5, "stem": "Sueis still _______ whether she should go for the school camp.", "correct_index": 2, "options": [{"word": "concentrating", "ipa": "\u02c8k\u0252ns\u0259ntre\u026at\u026a\u014b", "meanings": {"en": "Focusing one's attention or mental effort on a particular object or activity.", "cn": "\u5c06\u6ce8\u610f\u529b\u6216\u8111\u529b\u96c6\u4e2d\u5728\u7279\u5b9a\u7684\u5bf9\u8c61\u6216\u6d3b\u52a8\u4e0a\u3002"}, "usage_en": "Used when someone is giving their full attention to something.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u5168\u795e\u8d2f\u6ce8\u4e8e\u67d0\u4e8b\u65f6\u3002", "scene_en": "A student intensely focused on their textbook in a quiet library.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u5728\u5b89\u9759\u7684\u56fe\u4e66\u9986\u91cc\u5168\u795e\u8d2f\u6ce8\u5730\u770b\u7740\u6559\u79d1\u4e66\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q5_concentrating_1.png", "P6_vocabulary_exercises_31_Q5_concentrating_2.png"], "examples": [{"en": "She was concentrating so hard on the exam that she didn't notice me.", "cn": "\u5979\u975e\u5e38\u4e13\u5fc3\u4e8e\u8003\u8bd5\uff0c\u4ee5\u81f3\u4e8e\u6ca1\u6709\u6ce8\u610f\u5230\u6211\u3002"}, {"en": "I find it hard concentrating on my work when there are distractions around me.", "cn": "\u5f53\u5468\u56f4\u6709\u5e72\u6270\u65f6\uff0c\u6211\u53d1\u73b0\u5f88\u96be\u96c6\u4e2d\u7cbe\u529b\u5de5\u4f5c\u3002"}]}, {"word": "attempting", "ipa": "\u0259\u02c8t\u025bmpt\u026a\u014b", "meanings": {"en": "Trying to do or accomplish something.", "cn": "\u8bd5\u56fe\u505a\u6216\u5b8c\u6210\u67d0\u4e8b\u3002"}, "usage_en": "Used when someone is making an effort to achieve something.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u6b63\u5728\u52aa\u529b\u5b9e\u73b0\u67d0\u4e8b\u65f6\u3002", "scene_en": "A climber attempting to scale a steep mountain face.", "scene_cn": "\u4e00\u4e2a\u767b\u5c71\u8005\u8bd5\u56fe\u6500\u767b\u9661\u5ced\u7684\u5c71\u58c1\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q5_attempting_1.png", "P6_vocabulary_exercises_31_Q5_attempting_2.png"], "examples": [{"en": "He is attempting to break the world record for the fastest marathon time.", "cn": "\u4ed6\u6b63\u8bd5\u56fe\u6253\u7834\u9a6c\u62c9\u677e\u6700\u5feb\u65f6\u95f4\u7684\u4e16\u754c\u7eaa\u5f55\u3002"}, {"en": "The company is attempting to expand its market share in the competitive industry.", "cn": "\u8be5\u516c\u53f8\u6b63\u8bd5\u56fe\u5728\u7ade\u4e89\u6fc0\u70c8\u7684\u884c\u4e1a\u4e2d\u6269\u5927\u5176\u5e02\u573a\u4efd\u989d\u3002"}]}, {"word": "contemplating", "ipa": "\u02c8k\u0252nt\u0259mple\u026at\u026a\u014b", "meanings": {"en": "Looking thoughtfully for a long time at something; thinking deeply about something.", "cn": "\u957f\u65f6\u95f4\u4e13\u6ce8\u5730\u770b\u7740\u67d0\u7269\uff1b\u6df1\u5165\u601d\u8003\u67d0\u4e8b\u3002"}, "usage_en": "Used when someone is considering something carefully.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u6b63\u5728\u4ed4\u7ec6\u8003\u8651\u67d0\u4e8b\u65f6\u3002", "scene_en": "A person sitting by a lake, contemplating the meaning of life.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u6e56\u8fb9\uff0c\u6c89\u601d\u4eba\u751f\u7684\u610f\u4e49\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q5_contemplating_1.png", "P6_vocabulary_exercises_31_Q5_contemplating_2.png"], "examples": [{"en": "She is contemplating whether to accept the new job offer or stay in her current role.", "cn": "\u5979\u6b63\u5728\u8003\u8651\u662f\u63a5\u53d7\u65b0\u7684\u5de5\u4f5c\u9080\u8bf7\u8fd8\u662f\u7559\u5728\u76ee\u524d\u7684\u804c\u4f4d\u4e0a\u3002"}, {"en": "I'm contemplating taking a year off to travel the world and experience different cultures.", "cn": "\u6211\u6b63\u5728\u8003\u8651\u4f11\u4e00\u5e74\u5047\u53bb\u73af\u6e38\u4e16\u754c\uff0c\u4f53\u9a8c\u4e0d\u540c\u7684\u6587\u5316\u3002"}]}, {"word": "consulting", "ipa": "k\u0259n\u02c8s\u028clt\u026a\u014b", "meanings": {"en": "Seeking information or advice from someone with expertise in a particular area.", "cn": "\u5411\u5728\u7279\u5b9a\u9886\u57df\u5177\u6709\u4e13\u4e1a\u77e5\u8bc6\u7684\u4eba\u5bfb\u6c42\u4fe1\u606f\u6216\u5efa\u8bae\u3002"}, "usage_en": "Used when someone is seeking expert advice.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u6b63\u5728\u5bfb\u6c42\u4e13\u5bb6\u5efa\u8bae\u65f6\u3002", "scene_en": "A patient consulting with a doctor about their health concerns.", "scene_cn": "\u4e00\u4f4d\u75c5\u4eba\u5c31\u4ed6\u4eec\u7684\u5065\u5eb7\u95ee\u9898\u54a8\u8be2\u533b\u751f\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q5_consulting_1.png", "P6_vocabulary_exercises_31_Q5_consulting_2.png"], "examples": [{"en": "The company is consulting with a marketing firm to develop a new advertising campaign.", "cn": "\u8be5\u516c\u53f8\u6b63\u5728\u54a8\u8be2\u4e00\u5bb6\u8425\u9500\u516c\u53f8\uff0c\u4ee5\u5236\u5b9a\u65b0\u7684\u5e7f\u544a\u6d3b\u52a8\u3002"}, {"en": "Before making any major financial decisions, it's wise to consulting with a financial advisor.", "cn": "\u5728\u505a\u51fa\u4efb\u4f55\u91cd\u5927\u7684\u8d22\u52a1\u51b3\u5b9a\u4e4b\u524d\uff0c\u54a8\u8be2\u8d22\u52a1\u987e\u95ee\u662f\u660e\u667a\u7684\u3002"}]}], "synonym_cn": "\u8003\u8651, \u601d\u8003, \u76d8\u7b97", "socratic_questions": [{"question": "If you are fully immersed in your studies, dedicating all your attention to understanding a complex concept, you are _______.", "options": ["concentrating", "attempting", "contemplating", "consulting"], "correct_answer": "concentrating", "explanation": "Concentrating means focusing all your attention on something."}, {"question": "If you are making a serious effort to complete a challenging task, even if you are unsure of success, you are _______.", "options": ["concentrating", "attempting", "contemplating", "consulting"], "correct_answer": "attempting", "explanation": "Attempting means trying to do something difficult."}, {"question": "If you are thoughtfully considering different options before making a decision about a significant life change, you are _______.", "options": ["concentrating", "attempting", "contemplating", "consulting"], "correct_answer": "contemplating", "explanation": "Contemplating means thinking deeply about something."}, {"question": "If you are seeking advice from an expert to gain insights before making an important decision, you are _______.", "options": ["concentrating", "attempting", "contemplating", "consulting"], "correct_answer": "consulting", "explanation": "Consulting means seeking advice or information from someone."}]}, {"id": 6, "stem": "The jury will have to remain _______ and not be biased.", "correct_index": 2, "options": [{"word": "calm", "ipa": "/k\u0251\u02d0m/", "meanings": {"en": "Not showing or feeling nervousness, anger, or other emotions.", "cn": "\u4e0d\u8868\u73b0\u6216\u611f\u53d7\u5230\u7d27\u5f20\u3001\u6124\u6012\u6216\u5176\u4ed6\u60c5\u7eea\u3002"}, "usage_en": "Used to describe a state of peace and tranquility.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u79cd\u5e73\u9759\u548c\u5b89\u5b81\u7684\u72b6\u6001\u3002", "scene_en": "A serene beach at sunset, waves gently lapping the shore.", "scene_cn": "\u65e5\u843d\u65f6\u5b81\u9759\u7684\u6d77\u6ee9\uff0c\u6d77\u6d6a\u8f7b\u8f7b\u62cd\u6253\u6d77\u5cb8\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q6_calm_1.png", "P6_vocabulary_exercises_31_Q6_calm_2.png"], "examples": [{"en": "She remained calm despite the chaos around her, a true sign of strength.", "cn": "\u5c3d\u7ba1\u5468\u56f4\u4e00\u7247\u6df7\u4e71\uff0c\u5979\u4ecd\u7136\u4fdd\u6301\u51b7\u9759\uff0c\u8fd9\u662f\u771f\u6b63\u529b\u91cf\u7684\u6807\u5fd7\u3002"}, {"en": "The calm sea reflected the clear blue sky, creating a peaceful atmosphere.", "cn": "\u5e73\u9759\u7684\u6d77\u9762\u6620\u886c\u7740\u851a\u84dd\u7684\u5929\u7a7a\uff0c\u8425\u9020\u51fa\u4e00\u79cd\u5b81\u9759\u7684\u6c1b\u56f4\u3002"}]}, {"word": "serious", "ipa": "/\u02c8s\u026a\u0259ri\u0259s/", "meanings": {"en": "Demanding or characterized by careful consideration or application.", "cn": "\u9700\u8981\u6216\u4ee5\u4ed4\u7ec6\u8003\u8651\u6216\u5e94\u7528\u4e3a\u7279\u5f81\u7684\u3002"}, "usage_en": "Used to describe something important or requiring attention.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u91cd\u8981\u6216\u9700\u8981\u5173\u6ce8\u7684\u4e8b\u60c5\u3002", "scene_en": "A doctor examining an X-ray with a concerned expression.", "scene_cn": "\u533b\u751f\u5e26\u7740\u5173\u5207\u7684\u8868\u60c5\u68c0\u67e5X\u5149\u7247\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q6_serious_1.png", "P6_vocabulary_exercises_31_Q6_serious_2.png"], "examples": [{"en": "The doctor had a serious expression as he explained the diagnosis to the patient.", "cn": "\u533b\u751f\u5728\u5411\u75c5\u4eba\u89e3\u91ca\u8bca\u65ad\u7ed3\u679c\u65f6\uff0c\u8868\u60c5\u4e25\u8083\u3002"}, {"en": "Climate change is a serious issue that requires immediate and global attention now.", "cn": "\u6c14\u5019\u53d8\u5316\u662f\u4e00\u4e2a\u4e25\u91cd\u7684\u95ee\u9898\uff0c\u9700\u8981\u7acb\u5373\u548c\u5168\u7403\u7684\u5173\u6ce8\u3002"}]}, {"word": "impartial", "ipa": "/\u026am\u02c8p\u0251\u02d0r\u0283\u0259l/", "meanings": {"en": "Not partial or biased; treating all rivals or disputants equally.", "cn": "\u4e0d\u504f\u8892\u6216\u6709\u504f\u89c1\uff1b\u5e73\u7b49\u5730\u5bf9\u5f85\u6240\u6709\u7ade\u4e89\u8005\u6216\u4e89\u7aef\u8005\u3002"}, "usage_en": "Used to describe someone who is fair and unbiased.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u516c\u6b63\u548c\u4e0d\u504f\u4e0d\u501a\u7684\u4eba\u3002", "scene_en": "A judge in a courtroom, listening attentively to both sides.", "scene_cn": "\u6cd5\u5ead\u4e0a\u7684\u6cd5\u5b98\uff0c\u4e13\u5fc3\u503e\u542c\u53cc\u65b9\u7684\u610f\u89c1\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q6_impartial_1.png", "P6_vocabulary_exercises_31_Q6_impartial_2.png"], "examples": [{"en": "A judge must remain impartial when hearing a case, ensuring a fair trial.", "cn": "\u6cd5\u5b98\u5728\u5ba1\u7406\u6848\u4ef6\u65f6\u5fc5\u987b\u4fdd\u6301\u516c\u6b63\uff0c\u4ee5\u786e\u4fdd\u516c\u6b63\u7684\u5ba1\u5224\u3002"}, {"en": "The mediator remained impartial throughout the negotiation, helping both parties reach an agreement.", "cn": "\u8c03\u89e3\u5458\u5728\u6574\u4e2a\u8c08\u5224\u8fc7\u7a0b\u4e2d\u4fdd\u6301\u516c\u6b63\uff0c\u5e2e\u52a9\u53cc\u65b9\u8fbe\u6210\u534f\u8bae\u3002"}]}, {"word": "impersonal", "ipa": "/\u026am\u02c8p\u025c\u02d0rs\u0259n\u0259l/", "meanings": {"en": "Not influenced by, showing, or involving personal feelings.", "cn": "\u4e0d\u53d7\u4e2a\u4eba\u611f\u60c5\u5f71\u54cd\u3001\u4e0d\u8868\u73b0\u6216\u4e0d\u6d89\u53ca\u4e2a\u4eba\u611f\u60c5\u7684\u3002"}, "usage_en": "Used to describe something that lacks personal warmth or emotion.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u7f3a\u4e4f\u4e2a\u4eba\u6e29\u6696\u6216\u60c5\u611f\u7684\u4e8b\u7269\u3002", "scene_en": "A modern office building with glass windows and a sterile environment.", "scene_cn": "\u4e00\u680b\u62e5\u6709\u73bb\u7483\u7a97\u548c\u65e0\u83cc\u73af\u5883\u7684\u73b0\u4ee3\u529e\u516c\u697c\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q6_impersonal_1.png", "P6_vocabulary_exercises_31_Q6_impersonal_2.png"], "examples": [{"en": "The automated customer service system felt impersonal and lacked human touch, frustrating many users.", "cn": "\u81ea\u52a8\u5316\u7684\u5ba2\u6237\u670d\u52a1\u7cfb\u7edf\u611f\u89c9\u6ca1\u6709\u4eba\u60c5\u5473\uff0c\u7f3a\u4e4f\u4eba\u60c5\u5473\uff0c\u8ba9\u8bb8\u591a\u7528\u6237\u611f\u5230\u6cae\u4e27\u3002"}, {"en": "His impersonal approach to management made the employees feel like mere numbers, not valued individuals.", "cn": "\u4ed6\u5bf9\u7ba1\u7406\u7684\u5ba2\u89c2\u6001\u5ea6\u8ba9\u5458\u5de5\u611f\u89c9\u81ea\u5df1\u53ea\u662f\u6570\u5b57\uff0c\u800c\u4e0d\u662f\u6709\u4ef7\u503c\u7684\u4e2a\u4f53\u3002"}]}], "synonym_cn": "\u516c\u6b63\u7684\uff0c\u4e0d\u504f\u4e0d\u501a\u7684", "socratic_questions": [{"question": "\u5728\u538b\u529b\u4e0b\u4fdd\u6301\u51b7\u9759\uff0c\u9700\u8981\u54ea\u79cd\u54c1\u8d28\uff1f", "options": ["calm", "serious", "impartial", "impersonal"], "correct_answer": "calm", "explanation": "\u51b7\u9759\u610f\u5473\u7740\u5728\u538b\u529b\u4e0b\u4fdd\u6301\u5e73\u548c\u3002"}, {"question": "\u5982\u679c\u6cd5\u5b98\u5728\u5ba1\u5224\u4e2d\u907f\u514d\u73a9\u7b11\uff0c\u4ed6\u4f1a\u663e\u5f97\u66f4\uff1f", "options": ["calm", "serious", "impartial", "impersonal"], "correct_answer": "serious", "explanation": "\u4e25\u8083\u610f\u5473\u7740\u8ba4\u771f\u5bf9\u5f85\u91cd\u8981\ {"en": "The team prepared for their long expedition to the remote mountain range carefully.", "cn": "\u8be5\u56e2\u961f\u4e3a\u4ed6\u4eec\u524d\u5f80\u504f\u8fdc\u5c71\u8109\u7684\u6f2b\u957f\u63a2\u9669\u505a\u4e86\u4ed4\u7ec6\u7684\u51c6\u5907\u3002"}]}, {"word": "journey", "ipa": "/\u02c8d\u0292\u025c\u02d0rni/", "meanings": {"en": "An act of traveling from one place to another; a trip.", "cn": "\u4ece\u4e00\u4e2a\u5730\u65b9\u5230\u53e6\u4e00\u4e2a\u5730\u65b9\u7684\u65c5\u884c\u884c\u4e3a\uff1b\u4e00\u6b21\u65c5\u884c\u3002"}, "usage_en": "Implies a longer trip, often with personal significance or transformative experiences.", "usage_cn": "\u6697\u793a\u4e00\u6b21\u8f83\u957f\u7684\u65c5\u884c\uff0c\u901a\u5e38\u5177\u6709\u4e2a\u4eba\u610f\u4e49\u6216\u53d8\u9769\u6027\u7684\u7ecf\u5386\u3002", "scene_en": "A person standing on a mountaintop, looking out at a vast landscape after a long hike.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u5c71\u9876\u4e0a\uff0c\u5728\u957f\u9014\u8dcb\u6d89\u540e\u773a\u671b\u5e7f\u9614\u7684\u666f\u8272\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q7_journey_1.png", "P6_vocabulary_exercises_31_Q7_journey_2.png"], "examples": [{"en": "The long journey across the country allowed her time for reflection and self-discovery.", "cn": "\u7a7f\u8d8a\u8fd9\u4e2a\u56fd\u5bb6\u7684\u6f2b\u957f\u65c5\u7a0b\u8ba9\u5979\u6709\u65f6\u95f4\u53cd\u601d\u548c\u81ea\u6211\u53d1\u73b0\u3002"}, {"en": "His journey to becoming a doctor was filled with hard work and dedication.", "cn": "\u4ed6\u6210\u4e3a\u4e00\u540d\u533b\u751f\u7684\u65c5\u7a0b\u5145\u6ee1\u4e86\u52aa\u529b\u548c\u5949\u732e\u3002"}]}, {"word": "excursion", "ipa": "/\u026ak\u02c8sk\u025c\u02d0r\u0292\u0259n/", "meanings": {"en": "A short journey or trip, especially one taken as a leisure activity.", "cn": "\u77ed\u9014\u65c5\u884c\u6216\u51fa\u884c\uff0c\u7279\u522b\u662f\u4f5c\u4e3a\u4f11\u95f2\u6d3b\u52a8\u800c\u8fdb\u884c\u7684\u3002"}, "usage_en": "Used for short trips, often for pleasure or a specific purpose, like a day trip.", "usage_cn": "\u7528\u4e8e\u77ed\u9014\u65c5\u884c\uff0c\u901a\u5e38\u662f\u4e3a\u4e86\u5a31\u4e50\u6216\u7279\u5b9a\u76ee\u7684\uff0c\u6bd4\u5982\u4e00\u65e5\u6e38\u3002", "scene_en": "A group of tourists taking a boat trip to see dolphins in the ocean.", "scene_cn": "\u4e00\u7fa4\u6e38\u5ba2\u4e58\u8239\u51fa\u6d77\u89c2\u770b\u6d77\u8c5a\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q7_excursion_1.png", "P6_vocabulary_exercises_31_Q7_excursion_2.png"], "examples": [{"en": "The students went on an excursion to the museum to learn about ancient history.", "cn": "\u5b66\u751f\u4eec\u53bb\u535a\u7269\u9986\u53c2\u89c2\uff0c\u4e86\u89e3\u53e4\u4ee3\u5386\u53f2\u3002"}, {"en": "We took a short excursion to the nearby beach to enjoy the sunny weather.", "cn": "\u6211\u4eec\u53bb\u9644\u8fd1\u7684\u6d77\u6ee9\u77ed\u9014\u65c5\u884c\uff0c\u4eab\u53d7\u9633\u5149\u660e\u5a9a\u7684\u5929\u6c14\u3002"}]}, {"word": "travel", "ipa": "/\u02c8tr\u00e6vl/", "meanings": {"en": "The act of moving from one place to another.", "cn": "\u4ece\u4e00\u4e2a\u5730\u65b9\u79fb\u52a8\u5230\u53e6\u4e00\u4e2a\u5730\u65b9\u7684\u884c\u4e3a\u3002"}, "usage_en": "Refers to the general act of moving from one place to another, regardless of the purpose.", "usage_cn": "\u6307\u4ece\u4e00\u4e2a\u5730\u65b9\u79fb\u52a8\u5230\u53e6\u4e00\u4e2a\u5730\u65b9\u7684\u4e00\u822c\u884c\u4e3a\uff0c\u65e0\u8bba\u76ee\u7684\u5982\u4f55\u3002", "scene_en": "An airport terminal with people walking with luggage, waiting for their flights.", "scene_cn": "\u673a\u573a\u822a\u7ad9\u697c\uff0c\u4eba\u4eec\u62d6\u7740\u884c\u674e\u8d70\u6765\u8d70\u53bb\uff0c\u7b49\u5f85\u4ed6\u4eec\u7684\u822a\u73ed\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q7_travel_1.png", "P6_vocabulary_exercises_31_Q7_travel_2.png"], "examples": [{"en": "Air travel has become more affordable, allowing more people to see the world.", "cn": "\u822a\u7a7a\u65c5\u884c\u53d8\ cue from harm or danger.", "cn": "\u4fdd\u6301\u5b89\u5168\u6216\u4ece\u4f24\u5bb3\u6216\u5371\u9669\u4e2d\u62ef\u6551\u3002"}, "usage_en": "Used when protecting something or someone from harm.", "usage_cn": "\u7528\u4e8e\u4fdd\u62a4\u67d0\u7269\u6216\u67d0\u4eba\u514d\u53d7\u4f24\u5bb3\u3002", "scene_en": "A lifeguard rescuing a swimmer in distress at the beach.", "scene_cn": "\u6d77\u6ee9\u4e0a\uff0c\u6551\u751f\u5458\u6b63\u5728\u8425\u6551\u9047\u9669\u7684\u6e38\u6cf3\u8005\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q8_save_1.png", "P6_vocabulary_exercises_31_Q8_save_2.png"], "examples": [{"en": "We must save water during this drought to ensure everyone has enough.", "cn": "\u5728\u8fd9\u6b21\u5e72\u65f1\u671f\u95f4\uff0c\u6211\u4eec\u5fc5\u987b\u8282\u7ea6\u7528\u6c34\uff0c\u4ee5\u786e\u4fdd\u6bcf\u4e2a\u4eba\u90fd\u6709\u8db3\u591f\u7684\u6c34\u3002"}, {"en": "The brave firefighter managed to save the family from the burning building.", "cn": "\u52c7\u6562\u7684\u6d88\u9632\u5458\u8bbe\u6cd5\u5c06\u4e00\u5bb6\u4eba\u4ece\u71c3\u70e7\u7684\u5efa\u7b51\u7269\u4e2d\u6551\u4e86\u51fa\u6765\u3002"}]}, {"word": "regard", "ipa": "/r\u026a\u02c8\u0261\u0251\u02d0rd/", "meanings": {"en": "To consider or think of something in a specific way.", "cn": "\u4ee5\u67d0\u79cd\u7279\u5b9a\u7684\u65b9\u5f0f\u8003\u8651\u6216\u770b\u5f85\u67d0\u4e8b\u3002"}, "usage_en": "Used when expressing an opinion or considering something.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u89c2\u70b9\u6216\u8003\u8651\u67d0\u4e8b\u3002", "scene_en": "A professor regarding a student's work with careful consideration.", "scene_cn": "\u4e00\u4f4d\u6559\u6388\u6b63\u5728\u4ed4\u7ec6\u8003\u8651\u5b66\u751f\u7684\u4f5c\u4e1a\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q8_regard_1.png", "P6_vocabulary_exercises_31_Q8_regard_2.png"], "examples": [{"en": "I regard him as a close friend, even though we don't see each other often.", "cn": "\u6211\u628a\u4ed6\u770b\u4f5c\u662f\u4eb2\u5bc6\u7684\u670b\u53cb\uff0c\u5373\u4f7f\u6211\u4eec\u4e0d\u7ecf\u5e38\u89c1\u9762\u3002"}, {"en": "The company regards customer satisfaction as its top priority for long-term success.", "cn": "\u516c\u53f8\u5c06\u5ba2\u6237\u6ee1\u610f\u5ea6\u89c6\u4e3a\u5176\u957f\u671f\u6210\u529f\u7684\u9996\u8981\u4efb\u52a1\u3002"}]}, {"word": "sustain", "ipa": "/s\u0259\u02c8ste\u026an/", "meanings": {"en": "To maintain or support something over a period of time.", "cn": "\u5728\u4e00\u6bb5\u65f6\u95f4\u5185\u7ef4\u6301\u6216\u652f\u6301\u67d0\u4e8b\u7269\u3002"}, "usage_en": "Used when talking about maintaining something over time.", "usage_cn": "\u7528\u4e8e\u8c08\u8bba\u5728\u4e00\u6bb5\u65f6\u95f4\u5185\u7ef4\u6301\u67d0\u4e8b\u7269\u3002", "scene_en": "A farmer irrigating crops to sustain them through a dry season.", "scene_cn": "\u4e00\u4f4d\u519c\u6c11\u6b63\u5728\u704c\u6e89\u519c\u4f5c\u7269\uff0c\u4ee5\u7ef4\u6301\u5b83\u4eec\u5ea6\u8fc7\u65f1\u5b63\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q8_sustain_1.png", "P6_vocabulary_exercises_31_Q8_sustain_2.png"], "examples": [{"en": "A healthy diet and regular exercise can sustain your energy levels throughout the day.", "cn": "\u5065\u5eb7\u7684\u996e\u98df\u548c\u89c4\u5f8b\u7684\u953b\u70bc\u53ef\u4ee5\u7ef4\u6301\u4f60\u4e00\u6574\u5929\u7684\u7cbe\u529b\u3002"}, {"en": "The government implemented policies to sustain economic growth and create more job opportunities.", "cn": "\u653f\u5e9c\u5b9e\u65bd\u4e86\u653f\u7b56\u6765\u7ef4\u6301\u7ecf\u6d4e\u589e\u957f\u5e76\u521b\u9020\u66f4\u591a\u7684\u5c31\u4e1a\u673a\u4f1a\u3002"}]}, {"word": "cherish", "ipa": "/\u02c8t\u0283er\u026a\u0283/", "meanings": {"en": "To protect and care for someone or something lovingly.", "cn": "\u5145\u6ee1\u7231\u610f\u5730\u4fdd\u62a4\u548c\u7167\u987e\u67d0\u4eba\u6216\u67d0\u7269\u3002"}, "usage_en": "Used when expressing deep affection or appreciation.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u6df1\u6df1\u7684\u611f\u60c5\u6216\u611f\u6fc0 escribe their tone as 'grueling', 'forceful', 'harsh', or 'hideous'?", "options": ["grueling", "forceful", "harsh", "hideous"], "correct_answer": "forceful", "explanation": "Forceful implies strength and effectiveness in expression."}, {"question": "If a punishment is excessively severe and cruel, is it considered 'grueling', 'forceful', 'harsh', or 'hideous'?", "options": ["grueling", "forceful", "harsh", "hideous"], "correct_answer": "harsh", "explanation": "Harsh suggests severity and lack of compassion."}, {"question": "If a monster is extremely ugly and repulsive, is it considered 'grueling', 'forceful', 'harsh', or 'hideous'?", "options": ["grueling", "forceful", "harsh", "hideous"], "correct_answer": "hideous", "explanation": "Hideous describes something extremely ugly or unpleasant."}]}, {"id": 10, "stem": "Tom was charged for the _______ murder of his two sisters.", "correct_index": 2, "options": [{"word": "insensitive", "ipa": "/\u026an\u02c8s\u025bns\u0259t\u026av/", "meanings": {"en": "Showing or feeling no concern for others' feelings; unsympathetic.", "cn": "\u5bf9\u4ed6\u4eba\u611f\u60c5\u7f3a\u4e4f\u5173\u5fc3\u6216\u611f\u89c9\uff1b\u4e0d\u4f53\u8c05\u7684\u3002"}, "usage_en": "Describes a lack of empathy or awareness of others' feelings.", "usage_cn": "\u63cf\u8ff0\u7f3a\u4e4f\u540c\u60c5\u5fc3\u6216\u5bf9\u4ed6\u4eba\u7684\u60c5\u611f\u7f3a\u4e4f\u610f\u8bc6\u3002", "scene_en": "A person laughing at someone who has just shared a personal tragedy.", "scene_cn": "\u4e00\u4e2a\u4eba\u5632\u7b11\u521a\u521a\u5206\u4eab\u4e2a\u4eba\u60b2\u5267\u7684\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q10_insensitive_1.png", "P6_vocabulary_exercises_31_Q10_insensitive_2.png"], "examples": [{"en": "His insensitive remarks about her weight made her feel deeply ashamed and hurt.", "cn": "\u4ed6\u5bf9\u5979\u4f53\u91cd\u7684\u9ebb\u6728\u4e0d\u4ec1\u7684\u8bc4\u8bba\u8ba9\u5979\u611f\u5230\u6df1\u6df1\u7684\u7f9e\u6127\u548c\u4f24\u5bb3\u3002"}, {"en": "It was insensitive of him to bring up her past failures during the celebration.", "cn": "\u5728\u5e86\u795d\u6d3b\u52a8\u4e2d\u63d0\u8d77\u5979\u8fc7\u53bb\u7684\u5931\u8d25\uff0c\u8fd9\u662f\u4ed6\u4e0d\u4f53\u8c05\u4eba\u7684\u5730\u65b9\u3002"}]}, {"word": "detailed", "ipa": "/\u02c8di\u02d0te\u026ald/", "meanings": {"en": "Including many specific facts or pieces of information.", "cn": "\u5305\u62ec\u8bb8\u591a\u5177\u4f53\u7684\u4e8b\u5b9e\u6216\u4fe1\u606f\u3002"}, "usage_en": "Describes something that is thorough and comprehensive in its information.", "usage_cn": "\u63cf\u8ff0\u5728\u4fe1\u606f\u65b9\u9762\u5f7b\u5e95\u800c\u5168\u9762\u7684\u4e8b\u7269\u3002", "scene_en": "A close-up of a meticulously drawn architectural blueprint.", "scene_cn": "\u4e00\u5f20\u7cbe\u5fc3\u7ed8\u5236\u7684\u5efa\u7b51\u84dd\u56fe\u7684\u7279\u5199\u955c\u5934\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q10_detailed_1.png", "P6_vocabulary_exercises_31_Q10_detailed_2.png"], "examples": [{"en": "The detective gave a detailed account of the crime scene to the jury members.", "cn": "\u4fa6\u63a2\u5411\u966a\u5ba1\u56e2\u6210\u5458\u8be6\u7ec6\u63cf\u8ff0\u4e86\u72af\u7f6a\u73b0\u573a\u7684\u60c5\u51b5\u3002"}, {"en": "She provided a detailed analysis of the company's financial performance over the past year.", "cn": "\u5979\u5bf9\u516c\u53f8\u8fc7\u53bb\u4e00\u5e74\u7684\u8d22\u52a1\u4e1a\u7ee9\u8fdb\u884c\u4e86\u8be6\u7ec6\u7684\u5206\u6790\u3002"}]}, {"word": "brutal", "ipa": "/\u02c8bru\u02d0tl/", "meanings": {"en": "Savagely violent.", "cn": "\u91ce\u86ee\u66b4\u529b\u3002"}, "usage_en": "Describes something that is extremely harsh or cruel.", "usage_cn": "\u63cf\u8ff0\u975e\u5e38\u4e25\u5389\u6216\u6b8b\u9177\u7684\u4e8b\u7269\u3002", "scene_en": "A scene depicting a fierce battle with soldiers fighting intensely.", "scene_cn": "\u63cf\u7ed8\u58eb\u5175\u6fc0\u70c8\u6218\u6597\u7684\u6fc0\u70c8\u6218\u6597\u573a\u666f\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q10_brutal_1.png", "P6_vocabulary_exercises_31_Q10_brutal_2.png"], "examples": [{"en": "The team faced a brutal defeat, losing by a wide margin in the final game.", "cn": "\u8be5\u961f\u906d\u9047\u4e86\u4e00\u573a\u6b8b\u9177\u7684\u5931\u8d25\uff0c\u5728\u51b3\u8d5b\u4e2d\u4ee5\u5f88\u5927\u7684\u5dee\u8ddd\u5931\u5229\u3002"}, {"en": "The dictator's brutal regime was marked by widespread human rights abuses and oppression.", "cn": "\u72ec\u88c1\u8005\u7684\u6b8b\u9177\u7edf\u6cbb\u4ee5\u666e\u904d\u7684\u4eba\u6743\u4fb5\u72af\u548c\u538b\u8feb\u4e3a\u6807\u5fd7\u3002"}]}, {"word": "cruel", "ipa": "/\u02c8kru\u02d0\u0259l/", "meanings": {"en": "Willfully causing pain or suffering to others, or feeling no pity.", "cn": "\u6545\u610f\u9020\u6210\u4ed6\u4eba\u75db\u82e6\u6216\u6298\u78e8\uff0c\u6216\u6ca1\u6709\u601c\u60af\u4e4b\u5fc3\u3002"}, "usage_en": "Describes someone who enjoys inflicting pain or suffering on others.", "usage_cn": "\u63cf\u8ff0\u559c\u6b22\u7ed9\u4ed6\u4eba\u5e26\u6765\u75db\u82e6\u6216\u6298\u78e8\u7684\u4eba\u3002", "scene_en": "A person deliberately stepping on an insect.", "scene_cn": "\u4e00\u4e2a\u4eba\u6545\u610f\u8e29\u8e0f\u6606\u866b\u3002", "image_paths": ["P6_vocabulary_exercises_31_Q10_cruel_1.png", "P6_vocabulary_exercises_31_Q10_cruel_2.png"], "examples": [{"en": "It was cruel to tease the younger children about their fears of the dark.", "cn": "\u5632\u7b11\u5e74\u5e7c\u7684\u5b69\u5b50\u5bf9\u9ed1\u6697\u7684\u6050\u60e7\u662f\u5f88\u6b8b\u9177\u7684\u3002"}, {"en": "The cruel landlord evicted the family despite knowing they had nowhere else to go.", "cn": "\u5c3d\u7ba1\u77e5\u9053\u8fd9\u5bb6\u4eba\u65e0\u5904\u53ef\u53bb\uff0c\u6b8b\u9177\u7684\u623f\u4e1c\u8fd8\u662f\u9a71\u9010\u4e86\u4ed6\u4eec\u3002"}]}], "synonym_cn": "\u6b8b\u5fcd vs. \u4e0d\u654f\u611f vs. \u8be6\u7ec6 vs. \u4e25\u9177", "socratic_questions": [{"question": "If a comedian makes jokes about a recent tragedy, which word describes their behavior?", "options": ["insensitive", "detailed", "brutal", "cruel"], "correct_answer": "insensitive", "explanation": "Insensitive means lacking awareness or concern for others' feelings."}, {"question": "Which word describes a police report that includes every minor element of a crime scene?", "options": ["detailed", "brutal", "cruel", "insensitive"], "correct_answer": "detailed", "explanation": "Detailed means including many specific facts or pieces of information."}, {"question": "Which word best describes a war that involves extreme violence and suffering?", "options": ["cruel", "insensitive", "detailed", "brutal"], "correct_answer": "brutal", "explanation": "Brutal means savagely violent."}, {"question": "If a dictator inflicts unnecessary suffering on political prisoners, which word describes their actions?", "options": ["detailed", "brutal", "cruel", "insensitive"], "correct_answer": "cruel", "explanation": "Cruel means willfully causing pain or suffering to others."}]}]};
