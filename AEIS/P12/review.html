hind the bookshelf in the library.", "cn": "\u8fd9\u6761\u79d8\u5bc6\u901a\u9053\u901a\u5411\u56fe\u4e66\u9986\u4e66\u67b6\u540e\u9762\u7684\u4e00\u4e2a\u9690\u85cf\u623f\u95f4\u3002"}, {"en": "The passage through the mountains was treacherous due to heavy snowfall last winter.", "cn": "\u7531\u4e8e\u53bb\u5e74\u51ac\u5929\u7684\u5927\u96ea\uff0c\u7a7f\u8fc7\u5c71\u8109\u7684\u901a\u9053\u975e\u5e38\u5371\u9669\u3002"}]}], "synonym_cn": "\u7a7a\u95f4 (kong jian), \u4f4d\u7f6e (wei zhi), \u9053\u8def (dao lu), \u901a\u9053 (tong dao)", "socratic_questions": [{"question": "In a crowded elevator, what do you need to create so others can enter?", "options": ["space", "place", "way", "passage"], "correct_answer": "space", "explanation": "Space refers to the available area needed for movement or accommodation."}, {"question": "Which word describes a designated spot, like a seat at a table?", "options": ["space", "place", "way", "passage"], "correct_answer": "place", "explanation": "Place indicates a specific location or position."}, {"question": "If someone is blocking your path, what do you ask them to move out of?", "options": ["space", "place", "way", "passage"], "correct_answer": "way", "explanation": "Way refers to a route or direction allowing movement forward."}, {"question": "What do you need to create on a crowded train for people to exit?", "options": ["space", "place", "way", "passage"], "correct_answer": "passage", "explanation": "Passage refers to a path or corridor allowing entry or exit."}]}, {"id": 3, "stem": "The policeman was very _______ when he saw a dark figure lurking in the alley.", "correct_index": 0, "options": [{"word": "suspicious", "ipa": "/s\u0259\u02c8sp\u026a\u0283\u0259s/", "meanings": {"en": "Having or showing a cautious distrust of someone or something.", "cn": "\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u62b1\u6709\u6216\u8868\u73b0\u51fa\u8c28\u614e\u7684\u4e0d\u4fe1\u4efb\u611f\u3002"}, "usage_en": "Used to describe someone who doubts or mistrusts.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6000\u7591\u6216\u4e0d\u4fe1\u4efb\u67d0\u4eba\u7684\u4eba\u3002", "scene_en": "A detective carefully examining evidence at a crime scene, looking for inconsistencies.", "scene_cn": "\u4e00\u540d\u4fa6\u63a2\u4ed4\u7ec6\u68c0\u67e5\u72af\u7f6a\u73b0\u573a\u7684\u8bc1\u636e\uff0c\u5bfb\u627e\u4e0d\u4e00\u81f4\u4e4b\u5904\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q3_suspicious_1.png", "P6_vocabulary_exercises_12_Q3_suspicious_2.png"], "examples": [{"en": "The customs officer was suspicious of the traveler's vague answers about his luggage.", "cn": "\u6d77\u5173\u5b98\u5458\u5bf9\u65c5\u5ba2\u5173\u4e8e\u5176\u884c\u674e\u7684\u542b\u7cca\u56de\u7b54\u8868\u793a\u6000\u7591\u3002"}, {"en": "I am suspicious of any deal that sounds too good to be true; it probably isn't.", "cn": "\u6211\u6000\u7591\u4efb\u4f55\u542c\u8d77\u6765\u597d\u5f97\u4ee4\u4eba\u96be\u4ee5\u7f6e\u4fe1\u7684\u4ea4\u6613\uff1b\u5b83\u53ef\u80fd\u4e0d\u662f\u771f\u7684\u3002"}]}, {"word": "superstitious", "ipa": "/\u02ccsu\u02d0p\u0259r\u02c8st\u026a\u0283\u0259s/", "meanings": {"en": "Having or showing a belief in superstitions.", "cn": "\u5177\u6709\u6216\u8868\u73b0\u51fa\u5bf9\u8ff7\u4fe1\u7684\u4fe1\u4ef0\u3002"}, "usage_en": "Believing in supernatural influences or omens.", "usage_cn": "\u76f8\u4fe1\u8d85\u81ea\u7136\u7684\u5f71\u54cd\u6216\u9884\u5146\u3002", "scene_en": "A person avoiding walking under a ladder, fearing bad luck.", "scene_cn": "\u4e00\u4e2a\u4eba\u907f\u514d\u4ece\u68af\u5b50\u4e0b\u8d70\u8fc7\uff0c\u5bb3\u6015\u5e26\u6765\u5384\u8fd0\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q3_superstitious_1.png", "P6_vocabulary_exercises_12_Q3_superstitious_2.png"], "examples": [{"en": "Many people are superstitious about Friday the 13th, considering it an unlucky day.", "cn": "\u8bb8\u591a\u4eba\u5bf913\u53f7\u661f\u671f\u4e94\u5f88\u8ff7\u4fe1\uff0c\u8ba4\u4e3a\u90a3\u662f\u4e0d\u5409\u5229\u7684\u4e00\u5929\u3002"}, {"en": "She is superstitious and always carries a lucky charm to ward off bad luck.", "cn": "\u5979\u5f88\u8ff7\u4fe1\uff0c\u603b\u662f\u5e26\u7740\u5e78\u8fd0\u7b26\u6765\u907f\u5f00\u5384\u8fd0\u3002"}]}, {"word": "wary", "ipa": "/\u02c8weri/", "meanings": {"en": "Feeling or showing caution about possible dangers or problems.", "cn": "\u5bf9\u53ef\u80fd\u7684\u5371\u9669\u6216\u95ee\u9898\u611f\u5230\u6216\u8868\u73b0\u51fa\u8c28\u614e\u3002"}, "usage_en": "Cautious and alert to potential risks.", "usage_cn": "\u8c28\u614e\u5e76\u8b66\u60d5\u6f5c\u5728\u7684\u98ce\u9669\u3002", "scene_en": "A hiker carefully navigating a rocky and uneven mountain trail.", "scene_cn": "\u4e00\u4f4d\u5f92\u6b65\u65c5\u884c\u8005\u5c0f\u5fc3\u7ffc\u7ffc\u5730\u8d70\u8fc7\u5d0e\u5c96\u4e0d\u5e73\u7684\u5c71\u8def\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q3_wary_1.png", "P6_vocabulary_exercises_12_Q3_wary_2.png"], "examples": [{"en": "Travelers should be wary of pickpockets in crowded tourist areas; protect your belongings.", "cn": "\u65c5\u884c\u8005\u5e94\u8b66\u60d5\u62e5\u6324\u65c5\u6e38\u533a\u7684\u6252\u624b\uff1b\u4fdd\u62a4\u597d\u60a8\u7684\u8d22\u7269\u3002"}, {"en": "The company is wary of investing in new technology without thoroughly testing its reliability.", "cn": "\u8be5\u516c\u53f8\u5bf9\u6295\u8d44\u65b0\u6280\u672f\u6301\u8c28\u614e\u6001\u5ea6\uff0c\u5fc5\u987b\u5f7b\u5e95\u6d4b\u8bd5\u5176\u53ef\u9760\u6027\u3002"}]}, {"word": "stunned", "ipa": "/st\u028cnd/", "meanings": {"en": "So shocked that one is temporarily unable to react.", "cn": "\u9707\u60ca\u5230\u4e00\u4e2a\u4eba\u6682\u65f6\u65e0\u6cd5\u505a\u51fa\u53cd\u5e94\u3002"}, "usage_en": "Extremely surprised or shocked; dazed.", "usage_cn": "\u975e\u5e38\u60ca\u8bb6\u6216\u9707\u60ca\uff1b\u832b\u7136\u3002", "scene_en": "A person standing motionless after hearing unexpected and shocking news.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u542c\u5230\u610f\u60f3\u4e0d\u5230\u7684\u4ee4\u4eba\u9707\u60ca\u7684\u6d88\u606f\u540e\u4e00\u52a8\u4e0d\u52a8\u5730\u7ad9\u7740\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q3_stunned_1.png", "P6_vocabulary_exercises_12_Q3_stunned_2.png"], "examples": [{"en": "She was stunned by the sudden announcement of her promotion to senior manager.", "cn": "\u5979\u5bf9\u7a81\u7136\u5ba3\u5e03\u664b\u5347\u4e3a\u9ad8\u7ea7\u7ecf\u7406\u611f\u5230\u9707\u60ca\u3002"}, {"en": "The audience was stunned into silence by the magician's incredible disappearing act on stage.", "cn": "\u9b54\u672f\u5e08\u5728\u821e\u53f0\u4e0a\u4ee4\u4eba\u96be\u4ee5\u7f6e\u4fe1\u7684\u6d88\u5931\u8868\u6f14\u8ba9\u89c2\u4f17\u9707\u60ca\u5f97\u9e26\u96c0\u65e0\u58f0\u3002"}]}], "synonym_cn": "\u8c28\u614e\uff0c\u8b66\u60d5\uff0c\u6000\u7591", "socratic_questions": [{"question": "If you found a hidden door in your old house, would you be more _______ or superstitious?", "options": ["suspicious", "superstitious", "wary", "stunned"], "correct_answer": "suspicious", "explanation": "Suspicious implies a cautious distrust, fitting the context of finding something unexpected."}, {"question": "Seeing a black cat cross your path, are you more likely to become _______ or wary?", "options": ["suspicious", "superstitious", "wary", "stunned"], "correct_answer": "superstitious", "explanation": "Superstitious relates to beliefs in omens and supernatural causes, like a black cat crossing your path."}, {"question": "Approaching a growling dog, would you be more _______ or stunned?", "options": ["suspicious", "superstitious", "wary", "stunned"], "correct_answer": "wary", "explanation": "Wary suggests caution and alertness to danger, appropriate when facing a potentially aggressive animal."}, {"question": "Witnessing a sudden, unexpected magic trick, would you be more _______ or suspicious?", "options": ["suspicious", "superstitious", "wary", "stunned"], "correct_answer": "stunned", "explanation": "Stunned implies being shocked or amazed, which is a likely reaction to a surprising magic trick."}]}, {"id": 4, "stem": "The thief finally _______ to stealing the gold watch.", "correct_index": 3, "options": [{"word": "recognize", "ipa": "/\u02c8rek\u0259\u0261na\u026az/", "meanings": {"en": "To identify someone or something known from previous encounters or knowledge.", "cn": "\u901a\u8fc7\u5148\u524d\u7684\u906d\u9047\u6216\u77e5\u8bc6\u6765\u8bc6\u522b\u67d0\u4eba\u6216\u67d0\u7269\u3002"}, "usage_en": "Used when identifying something or someone familiar.", "usage_cn": "\u7528\u4e8e\u8bc6\u522b\u719f\u6089\u7684\u4e8b\u7269\u6216\u4eba\u3002", "scene_en": "A person spotting a friend in a crowded place, or identifying a song.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u62e5\u6324\u7684\u5730\u65b9\u53d1\u73b0\u670b\u53cb\uff0c\u6216\u8bc6\u522b\u4e00\u9996\u6b4c\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q4_recognize_1.png", "P6_vocabulary_exercises_12_Q4_recognize_2.png"], "examples": [{"en": "I didn't recognize you with your new haircut; it looks fantastic though.", "cn": "\u6211\u6ca1\u8ba4\u51fa\u4f60\u526a\u4e86\u65b0\u53d1\u578b\uff1b\u4e0d\u8fc7\u770b\u8d77\u6765\u68d2\u6781\u4e86\u3002"}, {"en": "She could recognize her mother's handwriting on the envelope immediately upon seeing it.", "cn": "\u5979\u4e00\u770b\u5230\u4fe1\u5c01\u5c31\u80fd\u7acb\u523b\u8ba4\u51fa\u5979\u6bcd\u4eb2\u7684\u7b14\u8ff9\u3002"}]}, {"word": "succumbed", "ipa": "/s\u0259\u02c8k\u028cm/", "meanings": {"en": "To give way to superior force; to yield to disease, temptation, or other pressure.", "cn": "\u5c48\u670d\u4e8e\u4f18\u52bf\u529b\u91cf\uff1b\u5c48\u670d\u4e8e\u75be\u75c5\u3001\u8bf1\u60d1\u6216\u5176\u4ed6\u538b\u529b\u3002"}, "usage_en": "Used when giving in to something overpowering.", "usage_cn": "\u7528\u4e8e\u5c48\u670d\u4e8e\u538b\u5012\u6027\u7684\u4e8b\u7269\u3002", "scene_en": "Someone giving in to peer pressure, or a plant dying from lack of water.", "scene_cn": "\u67d0\u4eba\u5c48\u670d\u4e8e\u540c\u4f34\u7684\u538b\u529b\uff0c\u6216\u690d\u7269\u56e0\u7f3a\u6c34\u800c\u6b7b\u4ea1\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q4_succumbed_1.png", "P6_vocabulary_exercises_12_Q4_succumbed_2.png"], "examples": [{"en": "After resisting for weeks, he finally succumbed to the temptation of chocolate cake.", "cn": "\u5728\u62b5\u6297\u4e86\u6570\u5468\u4e4b\u540e\uff0c\u4ed6\u6700\u7ec8\u5c48\u670d\u4e8e\u5de7\u514b\u529b\u86cb\u7cd5\u7684\u8bf1\u60d1\u3002"}, {"en": "The small business succumbed to the economic downturn and was forced to close down.", "cn": "\u8fd9\u5bb6\u5c0f\u4f01\u4e1a\u5c48\u670d\u4e8e\u7ecf\u6d4e\u8870\u9000\uff0c\u88ab\u8feb\u5012\u95ed\u3002"}]}, {"word": "realise", "ipa": "/\u02c8ri\u02d0\u0259la\u026az/", "meanings": {"en": "To become aware of something; to understand clearly.", "cn": "\u610f\u8bc6\u5230\u67d0\u4e8b\uff1b\u6e05\u695a\u5730\u7406\u89e3\u3002"}, "usage_en": "Used when becoming aware or understanding something.", "usage_cn": "\u7528\u4e8e\u610f\u8bc6\u5230\u6216\u7406\u89e3\u67d0\u4e8b\u3002", "scene_en": "Someone realizing they left their keys at home, or understanding a complex concept.", "scene_cn": "\u67d0\u4eba\u610f\u8bc6\u5230\u4ed6\u4eec\u628a\u94a5\u5319\u5fd8\u5728\u5bb6\u91cc\u4e86\uff0c\u6216\u8005\u7406\u89e3\u4e00\u4e2a\u590d\u6742\u7684\u6982\u5ff5\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q4_realise_1.png", "P6_vocabulary_exercises_12_Q4_realise_2.png"], "examples": [{"en": "I didn't realise how late it was until I looked at the clock just now.", "cn": "\u76f4\u5230\u6211\u521a\u624d\u770b\u4e86\u770b\u949f\uff0c\u6211\u624d\u610f\u8bc6\u5230\u5df2\u7ecf\u8fd9\u4e48\u665a\u4e86\u3002"}, {"en": "She began to realise the importance of hard work after failing the first exam.", "cn": "\u5728\u7b2c\u4e00\u6b21\u8003\u8bd5\u4e0d\u53ca\u683c\u540e\uff0c\u5979\u5f00\u59cb\u610f\u8bc6\u5230\u52aa\u529b\u5de5\u4f5c\u7684\u91cd\u8981\u6027\u3002"}]}, {"word": "admitted", "ipa": "/\u0259d\u02c8m\u026at\u026ad/", "meanings": {"en": "To confess to be true or to be the case; to acknowledge.", "cn": "\u627f\u8ba4\u662f\u771f\u7684\u6216\u5c31\u662f\u90a3\u6837\uff1b\u627f\u8ba4\u3002"}, "usage_en": "Used when confessing or acknowledging something.", "usage_cn": "\u7528\u4e8e\u627f\u8ba4\u6216\u8ba4\u53ef\u67d0\u4e8b\u3002", "scene_en": "Someone admitting to a mistake, or a country admitting refugees.", "scene_cn": "\u67d0\u4eba\u627f\u8ba4\u9519\u8bef\uff0c\u6216\u4e00\u4e2a\u56fd\u5bb6\u63a5\u7eb3\u96be\u6c11\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q4_admitted_1.png", "P6_vocabulary_exercises_12_Q4_admitted_2.png"], "examples": [{"en": "He admitted to breaking the vase, even though he knew he would be punished.", "cn": "\u4ed6\u627f\u8ba4\u6253\u788e\u4e86\u82b1\u74f6\uff0c\u5373\u4f7f\u4ed6\u77e5\u9053\u81ea\u5df1\u4f1a\u53d7\u5230\u60e9\u7f5a\u3002"}, {"en": "The company finally admitted that their product had a serious design flaw.", "cn": "\u8be5\u516c\u53f8\u6700\u7ec8\u627f\u8ba4\u4ed6\u4eec\u7684\u4ea7\u54c1\u5b58\u5728\u4e25\u91cd\u7684\u8bbe\u8ba1\u7f3a\u9677\u3002"}]}], "synonym_cn": "\u627f\u8ba4, \u5c48\u670d, \u610f\u8bc6\u5230, \u8ba4\u8bc6", "socratic_questions": [{"question": "After intense interrogation, which word describes the suspect's action of confessing to the crime?", "options": ["recognize", "succumbed", "realise", "admitted"], "correct_answer": "admitted", "explanation": "Admitted means to confess or acknowledge something, which fits the scenario of confessing to a crime."}, {"question": "Under immense pressure from peers, which word describes giving in to their demands?", "options": ["recognize", "succumbed", "realise", "admitted"], "correct_answer": "succumbed", "explanation": "Succumbed means to give in to pressure or temptation, fitting the scenario of peer pressure."}, {"question": "After reviewing the evidence, which word describes the detective's understanding of the truth?", "options": ["recognize", "succumbed", "realise", "admitted"], "correct_answer": "realise", "explanation": "Realise means to understand or become aware of something, fitting the scenario of understanding the truth."}, {"question": "Seeing a familiar face in the crowd, which word means to identify the person?", "options": ["recognize", "recognize", "realise", "admitted"], "correct_answer": "recognize", "explanation": "Recognize means to identify someone or something previously known, fitting the scenario of seeing a familiar face."}]}, {"id": 5, "stem": "You will have to _______ these potatoes before you cook them.", "correct_index": 3, "options": [{"word": "shave", "ipa": "/\u0283e\u026av/", "meanings": {"en": "To remove hair from the body with a razor or clippers.", "cn": "\u7528\u5243\u5200\u6216\u7406\u53d1\u5668\u53bb\u9664\u8eab\u4f53\u4e0a\u7684\u6bdb\u53d1\u3002"}, "usage_en": "Commonly used for removing facial or body hair.", "usage_cn": "\u5e38\u7528\u4e8e\u53bb\u9664\u9762\u90e8\u6216\u8eab\u4f53\u7684\u6bdb\u53d1\u3002", "scene_en": "A person standing in front of a mirror, shaving their beard with shaving cream.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u955c\u5b50\u524d\uff0c\u7528\u5243\u987b\u818f\u522e\u80e1\u5b50\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q5_shave_1.png", "P6_vocabulary_exercises_12_Q5_shave_2.png"], "examples": [{"en": "He needs to shave his face every morning before going to the office.", "cn": "\u4ed6\u6bcf\u5929\u65e9\u4e0a\u4e0a\u73ed\u524d\u90fd\u9700\u8981\u522e\u8138\u3002"}, {"en": "She decided to shave her legs before wearing the dress to the party.", "cn": "\u5979\u51b3\u5b9a\u5728\u53c2\u52a0\u805a\u4f1a\u7a7f\u88d9\u5b50\u4e4b\u524d\u522e\u6389\u817f\u6bdb\u3002"}]}, {"word": "tear", "ipa": "/t\u025br/", "meanings": {"en": "To damage or separate by pulling apart forcefully.", "cn": "\u901a\u8fc7\u7528\u529b\u62c9\u626f\u6765\u635f\u574f\u6216\u5206\u79bb\u3002"}, "usage_en": "Used to describe ripping paper, fabric, or other materials.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6495\u88c2\u7eb8 formation or sending mail.", "usage_cn": "\u6307\u5c55\u793a\u4fe1\u606f\u6216\u53d1\u9001\u90ae\u4ef6\u3002", "scene_en": "A notice posted on a bulletin board.", "scene_cn": "\u5f20\u8d34\u5728\u516c\u544a\u680f\u4e0a\u7684\u901a\u77e5\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q7_posted_1.png", "P6_vocabulary_exercises_12_Q7_posted_2.png"], "examples": [{"en": "She posted the announcement on the company website to inform all the employees quickly.", "cn": "\u5979\u5728\u516c\u53f8\u7f51\u7ad9\u4e0a\u53d1\u5e03\u4e86\u516c\u544a\uff0c\u4ee5\u4fbf\u5feb\u901f\u901a\u77e5\u6240\u6709\u5458\u5de5\u3002"}, {"en": "I posted the package yesterday, so it should arrive at your house within a week.", "cn": "\u6211\u6628\u5929\u5bc4\u51fa\u4e86\u5305\u88f9\uff0c\u6240\u4ee5\u5b83\u5e94\u8be5\u5728\u4e00\u5468\u5185\u5230\u8fbe\u4f60\u5bb6\u3002"}]}], "synonym_cn": "\u63a8\u8fdf (tu\u012bch\u00ed), \u5ef6\u671f (y\u00e1nq\u00ed), \u987a\u5ef6 (sh\u00f9ny\u00e1n)", "socratic_questions": [{"question": "If a delivery is delayed due to unforeseen circumstances, is it being 'shifted', 'changed', 'postponed', or 'posted'?", "options": ["shifted", "changed", "postponed", "posted"], "correct_answer": "postponed", "explanation": "'Postponed' means delayed or put off to a later time."}, {"question": "When you slightly adjust the position of a table, have you 'shifted', 'changed', 'postponed', or 'posted' it?", "options": ["shifted", "changed", "postponed", "posted"], "correct_answer": "shifted", "explanation": "'Shifted' means to move something slightly."}, {"question": "If you alter your travel plans entirely, have you 'shifted', 'changed', 'postponed', or 'posted' them?", "options": ["shifted", "changed", "postponed", "posted"], "correct_answer": "changed", "explanation": "'Changed' means to make something different."}, {"question": "When you put a letter in the mailbox, have you 'shifted', 'changed', 'postponed', or 'posted' it?", "options": ["shifted", "changed", "postponed", "posted"], "correct_answer": "posted", "explanation": "'Posted' means to send something via mail."}]}, {"id": 8, "stem": "Refreshments will be served at four o'clock _______.", "correct_index": 1, "options": [{"word": "exactly", "ipa": "/\u026a\u0261\u02c8z\u00e6ktli/", "meanings": {"en": "In an exact manner; precisely.", "cn": "\u4ee5\u7cbe\u786e\u7684\u65b9\u5f0f\uff1b\u51c6\u786e\u5730."}, "usage_en": "Used to indicate precision or accuracy.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u7cbe\u786e\u6216\u51c6\u786e\u3002", "scene_en": "A scientist measuring ingredients for an experiment with precise tools.", "scene_cn": "\u4e00\u4f4d\u79d1\u5b66\u5bb6\u4f7f\u7528\u7cbe\u5bc6\u5de5\u5177\u6d4b\u91cf\u5b9e\u9a8c\u6210\u5206\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q8_exactly_1.png", "P6_vocabulary_exercises_12_Q8_exactly_2.png"], "examples": [{"en": "The recipe requires exactly 250 grams of flour for the cake to turn out perfectly.", "cn": "\u8fd9\u4e2a\u98df\u8c31\u9700\u8981\u6b63\u597d250\u514b\u9762\u7c89\uff0c\u86cb\u7cd5\u624d\u80fd\u5b8c\u7f8e\u5730\u505a\u51fa\u6765\u3002"}, {"en": "The meeting will start exactly at 2:00 PM, so please be on time and ready.", "cn": "\u4f1a\u8bae\u5c06\u4e8e\u4e0b\u53482:00\u51c6\u65f6\u5f00\u59cb\uff0c\u8bf7\u51c6\u65f6\u5230\u8fbe\u5e76\u505a\u597d\u51c6\u5907\u3002"}]}, {"word": "sharp", "ipa": "/\u0283\u0251\u02d0rp/", "meanings": {"en": "Exactly at the stated time.", "cn": "\u6b63\u597d\u5728\u6307\u5b9a\u7684\u65f6\u95f4\u3002"}, "usage_en": "Used to indicate a precise time, often without any delay.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u7cbe\u786e\u7684\u65f6\u95f4\uff0c\u901a\u5e38\u6ca1\u6709\u4efb\u4f55\u5ef6\u8fdf\u3002", "scene_en": "A clock showing an exact hour, like 3:00 PM.", "scene_cn": "\u4e00\u4e2a\u663e\u793a\u51c6\u786e\u65f6\u95f4\u7684\u65f6\u949f\uff0c\u6bd4\u5982\u4e0b\u53483:00\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q8_sharp_1.png", "P6_vocabulary_exercises_12_Q8_sharp_2.png" ronological order.", "scene_cn": "\u4e00\u4e2a\u6309\u65f6\u95f4\u987a\u5e8f\u663e\u793a\u4e8b\u4ef6\u7684\u65f6\u95f4\u7ebf\u3002", "image_paths": ["P6_vocabulary_exercises_12_Q8_then_1.png", "P6_vocabulary_exercises_12_Q8_then_2.png"], "examples": [{"en": "First, we will have dinner, and then we will watch a movie together at home.", "cn": "\u9996\u5148\uff0c\u6211\u4eec\u5c06\u5171\u8fdb\u665a\u9910\uff0c\u7136\u540e\u6211\u4eec\u5c06\u5728\u5bb6\u4e00\u8d77\u770b\u7535\u5f71\u3002"}, {"en": "If you finish your homework, then you can go outside and play with your friends.", "cn": "\u5982\u679c\u4f60\u5b8c\u6210\u4e86\u4f5c\u4e1a\uff0c\u90a3\u4e48\u4f60\u53ef\u4ee5\u51fa\u53bb\u548c\u4f60\u7684\u670b\u53cb\u4eec\u73a9\u3002"}]}], "synonym_cn": "\u51c6\u65f6,  \u0442\u043e\u0447\u043d\u043e, p\u00fcnktlich", "socratic_questions": [{"question": "If a train is scheduled to depart at 10:00 AM, and it leaves at 10:00 AM, it leaves _______.", "options": ["exactly", "sharp", "punctually", "then"], "correct_answer": "sharp", "explanation": "\"Sharp\" implies precise timing, aligning with the train's scheduled departure."}, {"question": "If you need to meet a deadline and submit your work right at the cut-off time, you submit it _______.", "options": ["exactly", "sharp", "punctually", "then"], "correct_answer": "exactly", "explanation": "\"Exactly\" means at the precise moment, fitting the deadline scenario."}, {"question": "If a company emphasizes that its employees must arrive at meetings on time, they value arriving ______.", "options": ["exactly", "sharp", "punctually", "then"], "correct_answer": "punctually", "explanation": "\"Punctually\" highlights the importance of adhering to a schedule or time."}, {"question": "After the presentation, _______ we will have a Q&A session to address all your questions.", "options": ["exactly", "sharp", "punctually", "then"], "correct_answer": "then", "explanation": "\"Then\" indicates a sequence of events, where the Q&A follows the
