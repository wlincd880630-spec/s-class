n drifted aimlessly from topic to topic, never settling on one.", "cn": "\u8c08\u8bdd\u6f2b\u65e0\u76ee\u7684\u5730\u4ece\u4e00\u4e2a\u8bdd\u9898\u6f02\u79fb\u5230\u53e6\u4e00\u4e2a\u8bdd\u9898\uff0c\u4ece\u672a\u786e\u5b9a\u5728\u4e00\u4e2a\u8bdd\u9898\u4e0a\u3002"}, {"en": "After college, their lives drifted apart as they pursued different careers in different cities.", "cn": "\u5927\u5b66\u6bd5\u4e1a\u540e\uff0c\u4ed6\u4eec\u7684\u751f\u6d3b\u6e10\u884c\u6e10\u8fdc\uff0c\u56e0\u4e3a\u4ed6\u4eec\u5728\u4e0d\u540c\u7684\u57ce\u5e02\u4ece\u4e8b\u4e0d\u540c\u7684\u804c\u4e1a\u3002"}]}, {"word": "floated", "ipa": "/\u02c8flo\u028at\u026ad/", "meanings": {"en": "Rested or moved on or near the surface of a liquid; remained suspended in air.", "cn": "\u505c\u7559\u5728\u6216\u79fb\u52a8\u5728\u6db2\u4f53\u8868\u9762\u6216\u9644\u8fd1\uff1b\u60ac\u6d6e\u5728\u7a7a\u4e2d\u3002"}, "usage_en": "Describes something resting on a liquid or suspended in air.", "usage_cn": "\u63cf\u8ff0\u6f02\u6d6e\u5728\u6db2\u4f53\u4e0a\u6216\u60ac\u6d6e\u5728\u7a7a\u6c14\u4e2d\u7684\u4e1c\u897f\u3002", "scene_en": "A rubber duck floating in a bathtub full of bubbles.", "scene_cn": "\u4e00\u53ea\u6a61\u76ae\u9e2d\u6f02\u6d6e\u5728\u5145\u6ee1\u6ce1\u6cab\u7684\u6d74\u7f38\u91cc\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q3_floated_1.png", "P6_vocabulary_exercises_19_Q3_floated_2.png"], "examples": [{"en": "The astronaut floated effortlessly in the weightlessness of outer space during the mission.", "cn": "\u5728\u6267\u884c\u4efb\u52a1\u671f\u95f4\uff0c\u5b87\u822a\u5458\u5728\u592a\u7a7a\u7684\u5931\u91cd\u72b6\u6001\u4e0b\u6beb\u4e0d\u8d39\u529b\u5730\u6f02\u6d6e\u7740\u3002"}, {"en": "A single dandelion seed floated gently on the breeze, carried away by the wind.", "cn": "\u4e00\u7c92\u84b2\u516c\u82f1\u79cd\u5b50\u5728\u5fae\u98ce\u4e2d\u8f7b\u8f7b\u98d8\u52a8\uff0c\u88ab\u98ce\u5e26\u8d70\u4e86\u3002"}]}], "synonym_cn": "\u9010\u6e10\u758f\u8fdc", "socratic_questions": [{"question": "If you felt deep regret after an argument, would you say you ______ remorse?", "options": ["felt", "shifted", "drifted", "floated"], "correct_answer": "felt", "explanation": "\"Felt\" implies experiencing an emotion, fitting the context of remorse."}, {"question": "When responsibility for the project was reassigned, the burden ______ to a new team.", "options": ["felt", "shifted", "drifted", "floated"], "correct_answer": "shifted", "explanation": "\"Shifted\" indicates a change in position or responsibility."}, {"question": "After years of silence, old friends sometimes ______ apart, losing touch with each other.", "options": ["felt", "shifted", "drifted", "floated"], "correct_answer": "drifted", "explanation": "\"Drifted\" suggests a gradual separation over time."}, {"question": "The balloon ______ gently in the air, carried by the breeze above the park.", "options": ["felt", "shifted", "drifted", "floated"], "correct_answer": "floated", "explanation": "\"Floated\" describes something suspended or moving lightly in the air."}]}, {"id": 4, "stem": "Vegetables grow well in ______ soil.", "correct_index": 3, "options": [{"word": "rich", "ipa": "/r\u026at\u0283/", "meanings": {"en": "Having a great deal of money or assets; abundant in something.", "cn": "\u62e5\u6709\u5927\u91cf\u91d1\u94b1\u6216\u8d44\u4ea7\uff1b\u5728\u67d0\u4e8b\u7269\u65b9\u9762\u5f88\u4e30\u5bcc\u3002"}, "usage_en": "Used to describe wealth or abundance.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8d22\u5bcc\u6216\u4e30\u5bcc\u7a0b\u5ea6\u3002", "scene_en": "A scene showing a treasure chest overflowing with gold coins and jewels.", "scene_cn": "\u4e00\u4e2a\u573a\u666f\uff0c\u5c55\u793a\u4e00\u4e2a\u88c5\u6ee1\u91d1\u5e01\u548c\u73e0\u5b9d\u7684\u5b9d\u7bb1\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q4_rich_1.png", "P6_vocabulary_exercises_19_Q4_rich_2.png"], "examples": [{"en": "The rich soil in the valley allowed for a bountiful harvest this year.", "cn": "\u5c71\u8c37\u4e2d\u80a5\u6c8 u4e00\u4e2a\u4eba\u52aa\u529b\u4e3e\u8d77\u4e00\u5757\u53c8\u5927\u53c8\u91cd\u7684\u77f3\u5934\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q4_heavy_1.png", "P6_vocabulary_exercises_19_Q4_heavy_2.png"], "examples": [{"en": "The heavy rain made it difficult to see while driving on the highway last night.", "cn": "\u6628\u665a\u7684\u5927\u96e8\u4f7f\u5728\u9ad8\u901f\u516c\u8def\u4e0a\u884c\u9a76\u65f6\u96be\u4ee5\u770b\u6e05\u3002"}, {"en": "The box was so heavy that I needed help to carry it up the stairs carefully.", "cn": "\u8fd9\u4e2a\u7bb1\u5b50\u592a\u91cd\u4e86\uff0c\u6211\u9700\u8981\u5e2e\u52a9\u624d\u80fd\u5c0f\u5fc3\u5730\u628a\u5b83\u62ac\u4e0a\u697c\u68af\u3002"}]}, {"word": "fertile", "ipa": "/\u02c8f\u025c\u02d0rt\u0259l/", "meanings": {"en": "Capable of producing abundant vegetation or crops; highly productive.", "cn": "\u80fd\u591f\u4ea7\u751f\u4e30\u5bcc\u7684\u690d\u88ab\u6216\u4f5c\u7269\uff1b\u751f\u4ea7\u529b\u9ad8\u7684\u3002"}, "usage_en": "Describes the ability to produce abundantly.", "usage_cn": "\u63cf\u8ff0\u80fd\u591f\u5927\u91cf\u751f\u4ea7\u7684\u80fd\u529b\u3002", "scene_en": "A lush green field with rows of healthy crops growing.", "scene_cn": "\u4e00\u7247\u90c1\u90c1\u8471\u8471\u7684\u7eff\u8272\u7530\u91ce\uff0c\u751f\u957f\u7740\u4e00\u6392\u6392\u5065\u5eb7\u7684\u4f5c\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q4_fertile_1.png", "P6_vocabulary_exercises_19_Q4_fertile_2.png"], "examples": [{"en": "The fertile land in the Nile Delta allowed ancient Egypt to flourish agriculturally.", "cn": "\u5c3c\u7f57\u6cb3\u4e09\u89d2\u6d32\u80a5\u6c83\u7684\u571f\u5730\u4f7f\u53e4\u57c3\u53ca\u7684\u519c\u4e1a\u5f97\u4ee5\u84ec\u52c3\u53d1\u5c55\u3002"}, {"en": "Fertile soil is essential for growing healthy plants and ensuring a successful harvest season.", "cn": "\u80a5\u6c83\u7684\u571f\u58e4\u5bf9\u4e8e\u79cd\u690d\u5065\u5eb7\u7684\u690d\u7269\u548c\u786e\u4fdd\u4e30\u6536\u5b63\u8282\u81f3\u5173\u91cd\u8981\u3002 comprehensive manufacturing process."}, {"question": "If a farm cultivates and harvests crops on a large scale, does it ______ or make them?", "options": ["invents", "assembles", "produces", "makes"], "correct_answer": "produces", "explanation": "Producing often refers to creating something on a larger scale, often involving a series of steps."}, {"question": "If a chef prepares a meal from scratch using various ingredients, do they ______ or produce the dish?", "options": ["invents", "assembles", "produces", "makes"], "correct_answer": "makes", "explanation": "Making often refers to the act of creating something by putting together different elements or ingredients."}]}, {"id": 7, "stem": "The students' parents were invited to ______ the school concert.", "correct_index": 0, "options": [{"word": "attend", "ipa": "/\u0259\u02c8tend/", "meanings": {"en": "To be present at an event or meeting.", "cn": "\u51fa\u5e2d\u67d0\u4e2a\u6d3b\u52a8\u6216\u4f1a\u8bae\u3002"}, "usage_en": "Used to indicate presence at a specific event.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u51fa\u5e2d\u67d0\u4e2a\u7279\u5b9a\u7684\u6d3b\u52a8\u3002", "scene_en": "A person sitting in a lecture hall, listening to a speaker.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u6f14\u8bb2\u5385\u91cc\uff0c\u542c\u7740\u6f14\u8bb2\u8005\u8bb2\u8bdd\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q7_attend_1.png", "P6_vocabulary_exercises_19_Q7_attend_2.png"], "examples": [{"en": "All students are required to attend the mandatory safety briefing before the field trip.", "cn": "\u6240\u6709\u5b66\u751f\u90fd\u5fc5\u987b\u53c2\u52a0\u5b9e\u5730\u8003\u5bdf\u524d\u7684\u5f3a\u5236\u6027\u5b89\u5168\u7b80\u62a5\u3002"}, {"en": "She decided to attend the workshop to improve her skills in data analysis.", "cn": "\u5979\u51b3\u5b9a\u53c2\u52a0\u7814\u8ba8\u4f1a\uff0c\u4ee5\u63d0\u9ad8\u5979\u5728\u6570\u636e\u5206\u6790\u65b9\u9762\u7684\u6280\u80fd\u3002"}]}, {"word": "participate", "ipa": "/p\u0251\u02d0r\u02c8t\u026as\u026ape\u026at/", "meanings": {"en": "To take part in an activity or event.", "cn": "\u53c2\u4e0e\u67d0\u4e2a\u6d3b\u52a8\u6216\u4e8b\u4ef6\u3002"}, "usage_en": "Indicates active involvement in an activity.", "usage_cn": "\u8868\u793a\u79ef\u6781\u53c2\u4e0e\u67d0\u4e2a\u6d3b\u52a8\u3002", "scene_en": "A group of people actively engaged in a team-building exercise.", "scene_cn": "\u4e00\u7fa4\u4eba\u79ef\u6781\u53c2\u4e0e\u56e2\u961f\u5efa\u8bbe\u6d3b\u52a8\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q7_participate_1.png", "P6_vocabulary_exercises_19_Q7_participate_2.png"], "examples": [{"en": "We encourage all members to participate actively in the community cleanup initiative this weekend.", "cn": "\u6211\u4eec\u9f13\u52b1\u6240\u6709\u6210\u5458\u79ef\u6781\u53c2\u4e0e\u672c\u5468\u672b\u7684\u793e\u533a\u6e05\u7406\u6d3b\u52a8\u3002"}, {"en": "The company encourages employees to participate in training programs to enhance their professional development.", "cn": "\u516c\u53f8\u9f13\u52b1\u5458\u5de5\u53c2\u52a0\u57f9\u8bad\u8ba1\u5212\uff0c\u4ee5\u4fc3\u8fdb\u4ed6\u4eec\u7684\u804c\u4e1a\u53d1\u5c55\u3002"}]}, {"word": "grace", "ipa": "/\u0261re\u026as/", "meanings": {"en": "To be present in a way that lends dignity or honor.", "cn": "\u4ee5\u4e00\u79cd\u8d4b\u4e88\u5c0a\u4e25\u6216\u8363\u8a89\u7684\u65b9\u5f0f\u5b58\u5728\u3002"}, "usage_en": "Used to describe presence that adds elegance or honor.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u589e\u52a0\u4f18\u96c5\u6216\u8363\u8a89\u7684\u51fa\u5e2d\u3002", "scene_en": "A queen gracing a royal ball with her presence.", "scene_cn": "\u4e00\u4f4d\u5973\u738b\u4ee5\u5979\u7684\u5b58\u5728\u4e3a\u7687\u5bb6\u821e\u4f1a\u589e\u5149\u6dfb\u5f69\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q7_grace_1.png", "P6_vocabulary_exercises_19_Q7_grace_2.png"], "examples": [{"en": "The famous author will grace the literary festival with her presence and sign copies of her book.", "cn": "\u8fd9\u4f4d\u8457\u540d\u4f5c\u5bb6\u5c06\u51fa\u5e2d\u6587\u5b66\u8282\uff0c\u5e76\u4e3a\u5979\u7684\u4e66\u7b7e\u540d\u3002"}, {"en": "Her presence will grace the occasion, making it a memorable and special event for everyone.", "cn": "\u5979\u7684\u51fa\u5e2d\u5c06\u4e3a\u8fd9\u4e2a\u573a\u5408\u589e\u5149\u6dfb\u5f69\uff0c\u4f7f\u5176\u6210\u4e3a\u6bcf\u4e2a\u4eba\u96be\u5fd8\u548c\u7279\u522b\u7684\u6d3b\u52a8\u3002"}]}, {"word": "honour", "ipa": "/\u02c8\u0252n\u0259r/", "meanings": {"en": "To show respect or admiration by one's presence.", "cn": "\u901a\u8fc7\u51fa\u5e2d\u6765\u8868\u8fbe\u5c0a\u91cd\u6216\u94a6\u4f69\u3002"}, "usage_en": "Indicates showing respect or admiration.", "usage_cn": "\u8868\u793a\u8868\u8fbe\u5c0a\u91cd\u6216\u94a6\u4f69\u3002", "scene_en": "A veteran being honored at a ceremony.", "scene_cn": "\u4e00\u4f4d\u9000\u4f0d\u519b\u4eba\u5728\u4eea\u5f0f\u4e0a\u53d7\u5230\u5c0a\u656c\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q7_honour_1.png", "P6_vocabulary_exercises_19_Q7_honour_2.png"], "examples": [{"en": "We are honored to have the mayor attend the opening ceremony of the new community center.", "cn": "\u6211\u4eec\u5f88\u8363\u5e78\u5e02\u957f\u80fd\u51fa\u5e2d\u65b0\u793e\u533a\u4e2d\u5fc3\u7684\u5f00\u5e55\u5178\u793c\u3002"}, {"en": "It would honour us if you could attend our graduation ceremony as a guest speaker.", "cn": "\u5982\u679c\u60a8\u80fd\u4f5c\u4e3a\u6f14\u8bb2\u5609\u5bbe\u51fa\u5e2d\u6211\u4eec\u7684\u6bd5\u4e1a\u5178\u793c\uff0c\u6211\u4eec\u5c06\u611f\u5230\u975e\u5e38\u8363\u5e78\u3002"}]}], "synonym_cn": "\u53c2\u52a0 (c\u0101nji\u0101) vs. \u53c2\u4e0e (c\u0101ny\u00f9) vs. \u8363\u5e78\u51fa\u5e2d (r\u00f3ngx\u00ecng ch\u016bx\u00ed) vs. \u5c0a\u656c (z\u016bnj\u00ecng)", "socratic_questions": [{"question": "If you want to show your support by being physically present, which word fits best?", "options": ["attend", "participate", "grace", "honour"], "correct_answer": "attend", "explanation": "Attend means to be present at an event."}, {"question": "Which word suggests actively taking part in an activity, not just being present?", "options": ["attend", "participate", "grace", "honour"], "correct_answer": "participate", "explanation": "Participate implies taking an active role."}, {"question": "Which word means to be present in a way that adds prestige or elegance to an event?", "options": ["attend", "participate", "grace", "honour"], "correct_answer": "grace", "explanation": "Grace suggests adding elegance or prestige by one's presence."}, {"question": "Which word implies showing respect or admiration by being present?", "options": ["attend", "participate", "grace", "honour"], "correct_answer": "honour", "explanation": "Honour means to show respect or admiration."}]}, {"id": 8, "stem": "This is the only road ______ to my school.", "correct_index": 1, "options": [{"word": "proceeding", "ipa": "/pr\u0259\u02c8si\u02d0d\u026a\u014b/", "meanings": {"en": "Beginning or continuing a course of action.", "cn": "\u5f00\u59cb\u6216\u7ee7\u7eed\u4e00\u4e2a\u884c\u52a8\u8fc7\u7a0b\u3002"}, "usage_en": "Used to describe the act of moving forward or continuing.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5411\u524d\u79fb\u52a8\u6216\u7ee7\u7eed\u7684\u884c\u4e3a\u3002", "scene_en": "A person walking down a path, or a meeting in progress.", "scene_cn": "\u4e00\u4e2a\u4eba\u6cbf\u7740\u5c0f\u8def\u884c\u8d70\uff0c\u6216\u662f\u4e00\u4e2a\u6b63\u5728\u8fdb\u884c\u7684\u4f1a\u8bae\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q8_proceeding_1.png", "P6_vocabulary_exercises_19_Q8_proceeding_2.png"], "examples": [{"en": "The construction work is proceeding smoothly despite the initial delays we experienced last month.", "cn": "\u5c3d\u7ba1\u4e0a\u4e2a\u6708\u6211\u4eec\u7ecf\u5386\u4e86\u6700\u521d\u7684\u5ef6\u8bef\uff0c\u4f46\u5efa\u8bbe\u5de5\u4f5c\u8fdb\u5c55\u987a\u5229\u3002"}, {"en": "After a short break, the conference is proceeding with the next speaker's presentation on AI.", "cn": "\u77ed\u6682\u4f11\u606f\u540e\uff0c\u4f1a\u8bae\u5c06\u7ee7\u7eed\u8fdb\u884c\u4e0b\u4e00\u4f4d\u6f14\u8bb2\u8005\u5173\u4e8e\u4eba\u5de5\u667a\u80fd\u7684\u6f14\u8bb2\u3002"}]}, {"word": "leading", "ipa": "/\u02c8li\u02d0d\u026a\u014b/", "meanings": {"en": "Being in control or showing the way.", "cn": "\u5904\u4e8e\u63a7\u5236\u5730\u4f4d\u6216\u6307\u8def\u3002"}, "usage_en": "Used to describe guiding or directing others.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f15\u5bfc\u6216\u6307\u5bfc\u4ed6\u4eba\u3002", "scene_en": "A leader giving a speech, or a road sign pointing the way.", "scene_cn": "\u9886\u5bfc\u8005\u53d1\u8868\u6f14\u8bb2\uff0c\u6216\u8def\u6807\u6307\u8def\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q8_leading_1.png", "P6_vocabulary_exercises_19_Q8_leading_2.png"], "examples": [{"en": "The experienced guide is leading the group through the dense forest, ensuring their safety.", "cn": "\u7ecf\u9a8c\u4e30\u5bcc\u7684\u5bfc\u6e38\u6b63\u5e26\u9886\u56e2\u961f\u7a7f\u8fc7\u8302\u5bc6\u7684\u68ee\u6797\uff0c\u786e\u4fdd\u4ed6\u4eec\u7684\u5b89\u5168\u3002"}, {"en": "Her innovative ideas are leading the company towards a more sustainable and profitable future now.", "cn": "\u5979\u7684\u521b\u65b0\u7406\u5ff5\u6b63\u5e26\u9886\u516c\u53f8\u8d70\u5411\u66f4\u53ef\u6301\u7eed\u548c\u66f4\u6709\u5229\u53ef\u56fe\u7684\u672a\u6765\u3002"}]}, {"word": "ending", "ipa": "/\u02c8end\u026a\u014b/", "meanings": {"en": "Coming to a stop or conclusion.", "cn": "\u505c\u6b62\u6216\u7ed3\u675f\u3002"}, "usage_en": "Used to describe the termination of something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u7684\u7ec8\u6b62\u3002", "scene_en": "The final scene of a movie, or the last page of a book.", "scene_cn": "\u7535\u5f71\u7684\u6700\u540e\u4e00\u5e55\uff0c\u6216\u4e66\u7684\u6700\u540e\u4e00\u9875\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q8_ending_1.png", "P6_vocabulary_exercises_19_Q8_ending_2.png"], "examples": [{"en": "The school year is ending soon, and students are preparing for their final examinations now.", "cn": "\u5b66\u5e74\u5373\u5c06\u7ed3\u675f\uff0c\u5b66\u751f\u4eec\u6b63\u5728\u4e3a\u671f\u672b\u8003\u8bd5\u505a\u51c6\u5907\u3002"}, {"en": "After a long and tiring journey, they are finally ending their vacation with relaxation.", "cn": "\u7ecf\u8fc7\u6f2b\u957f\u800c\u75b2\u60eb\u7684\u65c5\u7a0b\u540e\uff0c\u4ed6\u4eec\u7ec8\u4e8e\u7ed3\u675f\u4e86\u4ed6\u4eec\u7684\u5047\u671f\uff0c\u653e\u677e\u8eab\u5fc3\u3002"}]}, {"word": "following", "ipa": "/\u02c8f\u0252l\u0259\u028a\u026a\u014b/", "meanings": {"en": "Going or coming after in the same direction.", "cn": "\u5728\u540c\u4e00\u65b9\u5411\u4e0a\u8ddf\u968f\u6216\u6765\u5230\u4e4b\u540e\u3002"}, "usage_en": "Used to describe going after someone or something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8ddf\u968f\u67d0\u4eba\u6216\u67d0\u7269\u4e4b\u540e\u3002", "scene_en": "A group of people following a leader, or a car following another car.", "scene_cn": "\u4e00\u7fa4\u4eba\u8ddf\u968f\u9886\u5bfc\u8005\uff0c\u6216\u4e00\u8f86\u8f66\u8ddf\u968f\u53e6\u4e00\u8f86\u8f66\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q8_following_1.png", "P6_vocabulary_exercises_19_Q8_following_2.png"], "examples": [{"en": "The little ducklings are following their mother in a straight line towards the pond now.", "cn": "\u5c0f\u9e2d\u5b50\u4eec\u6b63\u6392\u6210\u4e00\u6761\u76f4\u7ebf\u8ddf\u968f\u5b83\u4eec\u7684\u6bcd\u4eb2\u8d70\u5411\u6c60\u5858\u3002"}, {"en": "He is following the recipe carefully to ensure the cake turns out perfectly for the party.", "cn": "\u4ed6\u6b63\u5728\u4ed4\u7ec6\u5730\u6309\u7167\u98df\u8c31\u8fdb\u884c\u64cd\u4f5c\uff0c\u4ee5\u786e\u4fdd\u86cb\u7cd5\u5b8c\u7f8e\u5730\u4e3a\u805a\u4f1a\u51c6\u5907\u597d\u3002"}]}], "synonym_cn": "\u5f15\u5bfc; \u901a\u5f80; \u8d70\u5411", "socratic_questions": [{"question": "If you are at the front of a parade, what are you doing?", "options": ["proceeding", "leading", "ending", "following"], "correct_answer": "leading", "explanation": "Leading means to be at the front and guiding the way."}, {"question": "If a meeting is coming to a close, it is...", "options": ["proceeding", "leading", "ending", "following"], "correct_answer": "ending", "explanation": "Ending means coming to a close or finishing."}, {"question": "If you are moving forward with a plan, you are...", "options": ["proceeding", "leading", "ending", "following"], "correct_answer": "proceeding", "explanation": "Proceeding means moving forward or continuing with something."}, {"question": "If you are copying someone else's actions, you are...", "options": ["proceeding", "leading", "ending", "following"], "correct_answer": "following", "explanation": "Following means to come after or to copy someone's actions."}]}, {"id": 9, "stem": "The judge found him ______ of manslaughter and sent him to prison.", "correct_index": 2, "options": [{"word": "wrong", "ipa": "r\u0254\u02d0\u014b", "meanings": {"en": "Not correct or true; incorrect.", "cn": "\u4e0d\u6b63\u786e\u6216\u4e0d\u771f\u5b9e\uff1b\u9519\u8bef\u7684\u3002"}, "usage_en": "Used to describe something that is not correct or appropriate.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e0d\u6b63\u786e\u6216\u4e0d\u9002\u5f53\u7684\u4e8b\u7269\u3002", "scene_en": "A student giving an incorrect answer in class, marked with a red 'X'.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u5728\u8bfe\u5802\u4e0a\u7ed9\u51fa\u4e86\u9519\u8bef\u7684\u7b54\u6848\uff0c\u5e76\u7528\u7ea2\u8272\u7684\u201cX\u201d\u6807\u8bb0\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q9_wrong_1.png", "P6_vocabulary_exercises_19_Q9_wrong_2.png"], "examples": [{"en": "Giving the wrong answer on a test can lower your overall grade significantly.", "cn": "\u5728\u6d4b\u8bd5\u4e2d\u7ed9\u51fa\u9519\u8bef\u7684\u7b54\u6848\u4f1a\u5927\u5927\u964d\u4f4e\u4f60\u7684\u603b\u6210\u7ee9\u3002"}, {"en": "It's wrong to assume things without knowing all the relevant facts first.", "cn": "\u5728\u4e0d\u4e86\u89e3\u6240\u6709\u76f8\u5173\u4e8b\u5b9e\u7684\u60c5\u51b5\u4e0b\u5c31\u5984\u4e0b\u7ed3\u8bba\u662f\u9519\u8bef\u7684\u3002"}]}, {"word": "wicked", "ipa": "\u02c8w\u026ak\u026ad", "meanings": {"en": "Evil or morally bad.", "cn": "\u90aa\u6076\u7684\u6216\u9053\u5fb7\u8d25\u574f\u7684\u3002"}, "usage_en": "Used to describe someone or something that is evil or morally wrong.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u90aa\u6076\u7684\u6216\u9053\u5fb7\u4e0a\u9519\u8bef\u7684\u4eba\u6216\u4e8b\u7269\u3002", "scene_en": "A shadowy figure with a sinister grin, plotting something evil in a dark alley.", "scene_cn": "\u4e00\u4e2a\u9634\u5f71\u4e2d\u7684\u4eba\u7269\u5e26\u7740\u9669\u6076\u7684\u7b11\u5bb9\uff0c\u5728\u9ed1\u6697\u7684\u5c0f\u5df7\u91cc\u7b56\u5212\u7740\u90aa\u6076\u7684\u4e8b\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q9_wicked_1.png", "P6_vocabulary_exercises_19_Q9_wicked_2.png"], "examples": [{"en": "The wicked queen plotted to poison Snow White with a poisoned apple secretly.", "cn": "\u90aa\u6076\u7684\u738b\u540e\u5bc6\u8c0b\u7528\u6bd2\u82f9\u679c\u6bd2\u5bb3\u767d\u96ea\u516c\u4e3b\u3002"}, {"en": "Some people believe that the wicked actions of others will eventually catch up to them.", "cn": "\u6709\u4e9b\u4eba\u8ba4\u4e3a\uff0c\u5176\u4ed6\u4eba\u7684\u90aa\u6076\u884c\u4e3a\u6700\u7ec8\u4f1a\u8d76\u4e0a\u4ed6\u4eec\u3002"}]}, {"word": "guilty", "ipa": "\u02c8\u0261\u026alti", "meanings": {"en": "Responsible for a specified wrongdoing.", "cn": "\u5bf9\u7279\u5b9a\u7684\u4e0d\u5f53\u884c\u4e3a\u8d1f\u8d23\u3002"}, "usage_en": "Used to describe someone who has committed a crime or offense.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u72af\u4e86\u7f6a\u6216\u5192\u72af\u7684\u4eba\u3002", "scene_en": "A person standing in a courtroom looking ashamed after being found guilty by the jury.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u6cd5\u5ead\u4e0a\uff0c\u5728\u88ab\u966a\u5ba1\u56e2\u5224\u51b3\u6709\u7f6a\u540e\u663e\u5f97\u5f88\u60ed\u6127\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q9_guilty_1.png", "P6_vocabulary_exercises_19_Q9_guilty_2.png"], "examples": [{"en": "After reviewing the evidence, the jury found the defendant guilty of all charges.", "cn": "\u5728\u5ba1\u67e5\u8bc1\u636e\u540e\uff0c\u966a\u5ba1\u56e2\u8ba4\u5b9a\u88ab\u544a\u7684\u6240\u6709\u6307\u63a7\u5747\u6210\u7acb\u3002"}, {"en": "He felt guilty about lying to his friend, so he decided to confess immediately.", "cn": "\u4ed6\u5bf9\u670b\u53cb\u6492\u8c0e\u611f\u5230\u5185\u759a\uff0c\u6240\u4ee5\u4ed6\u51b3\u5b9a\u7acb\u5373\u5766\u767d\u3002"}]}, {"word": "innocent", "ipa": "\u02c8\u026an\u0259snt", "meanings": {"en": "Not guilty of a crime or offense.", "cn": "\u6ca1\u6709\u72af\u4e0b\u7f6a\u884c\u6216\u5192\u72af\u3002"}, "usage_en": "Used to describe someone who has not committed a crime or offense.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6ca1\u6709\u72af\u4e0b\u7f6a\u884c\u6216\u5192\u72af\u7684\u4eba\u3002", "scene_en": "A child with a pure and trusting face, symbolizing innocence and lack of guile.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u6709\u4e00\u5f20\u7eaf\u6d01\u548c\u4fe1\u4efb\u7684\u8138\uff0c\u8c61\u5f81\u7740\u5929\u771f\u548c\u7f3a\u4e4f\u72e1\u733e\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q9_innocent_1.png", "P6_vocabulary_exercises_19_Q9_innocent_2.png"], "examples": [{"en": "The court declared him innocent after new evidence proved he was not at the scene.", "cn": "\u5728\u65b0\u7684\u8bc1\u636e\u8bc1\u660e\u4ed6\u4e0d\u5728\u73b0\u573a\u540e\uff0c\u6cd5\u9662\u5ba3\u5e03\u4ed6\u65e0\u7f6a\u3002"}, {"en": "Everyone is presumed innocent until proven guilty beyond a reasonable doubt in court.", "cn": "\u5728\u6cd5\u5ead\u4e0a\uff0c\u5728\u6ca1\u6709\u5408\u7406\u6000\u7591\u7684\u60c5\u51b5\u4e0b\u88ab\u8bc1\u660e\u6709\u7f6a\u4e4b\u524d\uff0c\u6bcf\u4e2a\u4eba\u90fd\u88ab\u5047\u5b9a\u4e3a\u65e0\u7f6a\u3002"}]}], "synonym_cn": "\u6709\u7f6a vs \u90aa\u6076 vs \u9519\u8bef vs \u65e0\u7f6a (\u7f6a\u884c\u65b9\u9762)", "socratic_questions": [{"question": "If a witness gives false testimony in court, are they considered 'wrong', 'wicked', 'guilty', or 'innocent'?", "options": ["wrong", "wicked", "guilty", "innocent"], "correct_answer": "wrong", "explanation": "'Wrong' implies an error or deviation from what is right or correct."}, {"question": "If a person consistently performs cruel and malicious acts, are they considered 'wrong', 'wicked', 'guilty', or 'innocent'?", "options": ["wrong", "wicked", "guilty", "innocent"], "correct_answer": "wicked", "explanation": "'Wicked' describes someone who is evil or morally bad."}, {"question": "If someone is proven to have committed a crime, are they considered 'wrong', 'wicked', 'guilty', or 'innocent'?", "options": ["wrong", "wicked", "guilty", "innocent"], "correct_answer": "guilty", "explanation": "'Guilty' means responsible for a crime or offense."}, {"question": "If a person is found to have no involvement in a crime, are they considered 'wrong', 'wicked', 'guilty', or 'innocent'?", "options": ["wrong", "wicked", "guilty", "innocent"], "correct_answer": "innocent", "explanation": "'Innocent' means not guilty of a crime or offense."}]}, {"id": 10, "stem": "Long skirts are no longer in ______.", "correct_index": 3, "options": [{"word": "craze", "ipa": "/kre\u026az/", "meanings": {"en": "An enthusiasm for a particular activity or object which appears suddenly and achieves widespread but short-lived popularity.", "cn": "\u5bf9\u7279\u5b9a\u6d3b\u52a8\u6216\u7269\u54c1\u7684\u70ed\u60c5\uff0c\u8fd9\u79cd\u70ed\u60c5\u7a81\u7136\u51fa\u73b0\u5e76\u8fc5\u901f\u666e\u53ca\uff0c\u4f46\u6301\u7eed\u65f6\u95f4\u5f88\u77ed\u3002"}, "usage_en": "Used to describe a sudden, widespread, but temporary enthusiasm.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7a81\u7136\u51fa\u73b0\u3001\u5e7f\u6cdb\u4f20\u64ad\u4f46\u77ed\u6682\u7684\u70ed\u60c5\u3002", "scene_en": "A crowd of people eagerly lining up to purchase the latest trendy gadget.", "scene_cn": "\u4e00\u7fa4\u4eba\u6025\u5207\u5730\u6392\u961f\u8d2d\u4e70\u6700\u65b0\u7684\u6d41\u884c\u5c0f\u73a9\u610f\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q10_craze_1.png", "P6_vocabulary_exercises_19_Q10_craze_2.png"], "examples": [{"en": "The new fitness program became a national craze, with everyone joining classes.", "cn": "\u8fd9\u4e2a\u65b0\u7684\u5065\u8eab\u9879\u76ee\u6210\u4e3a\u5168\u56fd\u7684\u70ed\u6f6e\uff0c\u6bcf\u4e2a\u4eba\u90fd\u53c2\u52a0\u4e86\u8bfe\u7a0b\u3002"}, {"en": "The sudden craze for collecting vintage stamps swept through the entire community quickly.", "cn": "\u7a81\u7136\u5174\u8d77\u7684\u6536\u96c6\u8001\u90ae\u7968\u7684\u70ed\u6f6e\u8fc5\u901f\u5e2d\u5377\u4e86\u6574\u4e2a\u793e\u533a\u3002"}]}, {"word": "custom", "ipa": "/\u02c8k\u028cst\u0259m/", "meanings": {"en": "A traditional and widely accepted way of behaving or doing something that is specific to a particular society, place, or time.", "cn": "\u4e00\u79cd\u4f20\u7edf\u7684\u3001\u88ab\u5e7f\u6cdb\u63a5\u53d7\u7684\u884c\u4e3a\u6216\u505a\u4e8b\u65b9\u5f0f\uff0c\u7279\u5b9a\u4e8e\u67d0\u4e2a\u793e\u4f1a\u3001\u5730\u70b9\u6216\u65f6\u95f4\u3002"}, "usage_en": "Refers to established practices within a community or culture.", "usage_cn": "\u6307\u793e\u533a\u6216\u6587\u5316\u4e2d\u5df2\u5efa\u7acb\u7684\u5b9e\u8df5\u3002", "scene_en": "A traditional wedding ceremony with specific rituals and attire.", "scene_cn": "\u4e00\u4e2a\u4f20\u7edf\u7684\u5a5a\u793c\u4eea\u5f0f\uff0c\u6709\u7279\u5b9a\u7684\u4eea\u5f0f\u548c\u670d\u88c5\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q10_custom_1.png", "P6_vocabulary_exercises_19_Q10_custom_2.png"], "examples": [{"en": "It is the local custom to remove your shoes before entering someone's home.", "cn": "\u5728\u8fdb\u5165\u522b\u4eba\u5bb6\u4e4b\u524d\u8131\u978b\u662f\u5f53\u5730\u7684\u4e60\u4fd7\u3002"}, {"en": "The annual harvest festival is a cherished custom passed down through generations.", "cn": "\u4e00\u5e74\u4e00\u5ea6\u7684\u4e30\u6536\u8282\u662f\u4ee3\u4ee3\u76f8\u4f20\u7684\u73cd\u8d35\u4e60\u4fd7\u3002"}]}, {"word": "fad", "ipa": "/f\u00e6d/", "meanings": {"en": "An intense and widely shared enthusiasm for something, especially one that is short-lived and without basis in reason.", "cn": "\u5bf9\u67d0\u4e8b\u7269\u7684\u5f3a\u70c8\u800c\u5e7f\u6cdb\u7684\u5171\u540c\u70ed\u60c5\uff0c\u5c24\u5176\u662f\u77ed\u6682\u4e14\u6ca1\u6709\u7406\u6027\u57fa\u7840\u7684\u70ed\u60c5\u3002"}, "usage_en": "Describes a short-lived trend or enthusiasm.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u77ed\u6682\u7684\u8d8b\u52bf\u6216\u70ed\u60c5\u3002", "scene_en": "A group of teenagers wearing the latest trendy clothing item.", "scene_cn": "\u4e00\u7fa4\u9752\u5c11\u5e74\u7a7f\u7740\u6700\u65b0\u7684\u6d41\u884c\u670d\u88c5\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q10_fad_1.png", "P6_vocabulary_exercises_19_Q10_fad_2.png"], "examples": [{"en": "The fidget spinner was a popular fad that quickly disappeared from school playgrounds.", "cn": "\u6307\u5c16\u9640\u87ba\u662f\u4e00\u79cd\u6d41\u884c\u7684\u65f6\u5c1a\uff0c\u5f88\u5feb\u5c31\u4ece\u5b66\u6821\u64cd\u573a\u4e0a\u6d88\u5931\u4e86\u3002"}, {"en": "Wearing neon colors was a brief fad in the 1980s, now considered outdated and humorous.", "cn": "\u572820\u4e16\u7eaa80\u5e74\u4ee3\uff0c\u7a7f\u9713\u8679\u8272\u670d\u88c5\u662f\u4e00\u79cd\u77ed\u6682\u7684\u65f6\u5c1a\uff0c\u73b0\u5728\u88ab\u8ba4\u4e3a\u5df2\u7ecf\u8fc7\u65f6\u4e14\u53ef\u7b11\u3002"}]}, {"word": "fashion", "ipa": "/\u02c8f\u00e6\u0283\u0259n/", "meanings": {"en": "A popular style or practice, especially in clothing, footwear, accessories, makeup, hairstyle, etc.", "cn": "\u4e00\u79cd\u6d41\u884c\u7684\u98ce\u683c\u6216\u5b9e\u8df5\uff0c\u5c24\u5176\u662f\u5728\u670d\u88c5\u3001\u978b\u7c7b\u3001\u914d\u9970\u3001\u5316\u5986\u3001\u53d1\u578b\u7b49\u65b9\u9762\u3002"}, "usage_en": "Refers to current styles and trends in clothing and appearance.", "usage_cn": "\u6307\u5f53\u524d\u670d\u88c5\u548c\u5916\u89c2\u7684\u98ce\u683c\u548c\u8d8b\u52bf\u3002", "scene_en": "Models walking down a runway showcasing the latest clothing designs.", "scene_cn": "\u6a21\u7279\u8d70\u5728\u8dd1\u9053\u4e0a\uff0c\u5c55\u793a\u6700\u65b0\u7684\u670d\u88c5\u8bbe\u8ba1\u3002", "image_paths": ["P6_vocabulary_exercises_19_Q10_fashion_1.png", "P6_vocabulary_exercises_19_Q10_fashion_2.png"], "examples": [{"en": "High-waisted jeans are back in fashion, after being out of style for many years.", "cn": "\u9ad8\u8170\u725b\u4ed4\u88e4\u5728\u8fc7\u65f6\u591a\u5e74\u540e\u53c8\u91cd\u65b0\u6d41\u884c\u8d77\u6765\u3002"}, {"en": "The fashion industry is constantly evolving, with new trends emerging every season.", "cn": "\u65f6\u5c1a\u4ea7\u4e1a\u5728\u4e0d\u65ad\u53d1\u5c55\uff0c\u6bcf\u4e2a\u5b63\u8282\u90fd\u4f1a\u51fa\u73b0\u65b0\u7684\u8d8b\u52bf\u3002"}]}], "synonym_cn": "\u6f6e\u6d41\uff0c\u65f6\u5c1a\uff0c\u98ce\u5c1a", "socratic_questions": [{"question": "If something is a short-lived enthusiasm, which word best describes it?", "options": ["craze", "custom", "fad", "fashion"], "correct_answer": "fad", "explanation": "A 'fad' is a short-lived enthusiasm or interest; it's trendy for a brief period."}, {"question": "Which word describes a widespread and intense enthusiasm for something?", "options": ["craze", "custom", "fad", "fashion"], "correct_answer": "craze", "explanation": "A 'craze' is a widespread and intense enthusiasm for something, often short-lived."}, {"question": "Which word refers to a traditional and widely accepted way of behaving?", "options": ["craze", "custom", "fad", "fashion"], "correct_answer": "custom", "explanation": "A 'custom' is a traditional and widely accepted way of behaving or doing something."}, {"question": "Which word describes a popular style or practice, especially in clothing?", "options": ["craze", "custom", "fad", "fashion"], "correct_answer": "
