    <script>
        const DB = {"meta": {"source_pdf": "D:\\Python\u81ea\u52a8\u5316\\AeisLab_Final\\Vocab\\P6_vocabulary_exercises\\P6_vocabulary_exercises_21.pdf", "azure_key": "DKRXk8ueSfo5NdIOMqFRTCAfpeGDezJ3Snf5K8gGgtyqxiWdugLzJQQJ99BLACHYHv6XJ3w3AAAYACOGUYP9", "azure_region": "eastus2"}, "questions": [{"id": 1, "stem": "Mrs Koh is always so busy with her work that she has ______ her sons.", "correct_index": 2, "options": [{"word": "rejected", "ipa": "/r\u026a\u02c8d\u0292ekt\u026ad/", "meanings": {"en": "Refused to accept or consider; turned down.", "cn": "\u62d2\u7edd\u63a5\u53d7\u6216\u8003\u8651\uff1b\u5426\u51b3\u3002"}, "usage_en": "Used when something or someone is not accepted.", "usage_cn": "\u7528\u4e8e\u67d0\u4e8b\u6216\u67d0\u4eba\u672a\u88ab\u63a5\u53d7\u65f6\u3002", "scene_en": "A job applicant receiving a rejection letter from a company.", "scene_cn": "\u6c42\u804c\u8005\u6536\u5230\u516c\u53f8\u53d1\u6765\u7684\u62d2\u7edd\u4fe1\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q1_rejected_1.png", "P6_vocabulary_exercises_21_Q1_rejected_2.png"], "examples": [{"en": "The committee rejected his proposal because it was too expensive and impractical to implement.", "cn": "\u59d4\u5458\u4f1a\u62d2\u7edd\u4e86\u4ed6\u7684\u63d0\u8bae\uff0c\u56e0\u4e3a\u5b83\u592a\u6602\u8d35\u4e14\u4e0d\u5207\u5b9e\u9645\uff0c\u65e0\u6cd5\u5b9e\u65bd\u3002"}, {"en": "She felt rejected when her friends didn't invite her to their weekend getaway trip.", "cn": "\u5f53\u5979\u7684\u670b\u53cb\u6ca1\u6709\u9080\u8bf7\u5979\u53c2\u52a0\u5468\u672b\u5ea6\u5047\u65c5\u884c\u65f6\uff0c\u5979\u611f\u5230\u88ab\u62d2\u7edd\u4e86\u3002"}]}, {"word": "dejected", "ipa": "/d\u026a\u02c8d\u0292ekt\u026ad/", "meanings": {"en": "Sad and depressed; dispirited.", "cn": "\u60b2\u4f24\u548c\u6cae\u4e27\uff1b\u7070\u5fc3\u4e27\u6c14\u3002"}, "usage_en": "Describes a state of low spirits and unhappiness.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u60c5\u7eea\u4f4e\u843d\u548c\u4e0d\u5feb\u4e50\u7684\u72b6\u6001\u3002", "scene_en": "A student looking sad after failing an exam.", "scene_cn": "\u5b66\u751f\u8003\u8bd5\u4e0d\u53ca\u683c\u540e\u770b\u8d77\u6765\u5f88\u4f24\u5fc3\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q1_dejected_1.png", "P6_vocabulary_exercises_21_Q1_dejected_2.png"], "examples": [{"en": "After losing the final game, the entire team felt dejected and disappointed in their performance.", "cn": "\u8f93\u6389\u6700\u540e\u4e00\u573a\u6bd4\u8d5b\u540e\uff0c\u6574\u4e2a\u56e2\u961f\u5bf9\u4ed6\u4eec\u7684\u8868\u73b0\u611f\u5230\u6cae\u4e27\u548c\u5931\u671b\u3002"}, {"en": "He was dejected when he learned that his application for the scholarship had been denied.", "cn": "\u5f53\u4ed6\u5f97\u77e5\u4ed6\u7684\u5956\u5b66\u91d1\u7533\u8bf7\u88ab\u62d2\u7edd\u65f6\uff0c\u4ed6\u611f\u5230\u5f88\u6cae\u4e27\u3002"}]}, {"word": "neglected", "ipa": "/n\u026a\u02c8\u0261lekt\u026ad/", "meanings": {"en": "Failed to care for properly; abandoned.", "cn": "\u672a\u80fd\u59a5\u5584\u7167\u987e\uff1b\u9057\u5f03\u3002"}, "usage_en": "Used when someone or something is not given proper attention or care.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u6216\u67d0\u4e8b\u672a\u5f97\u5230\u9002\u5f53\u7684\u5173\u6ce8\u6216\u7167\u987e\u65f6\u3002", "scene_en": "A child left alone at home, looking sad and uncared for.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u72ec\u81ea\u5728\u5bb6\uff0c\u770b\u8d77\u6765\u5f88\u4f24\u5fc3\uff0c\u65e0\u4eba\u7167\u987e\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q1_neglected_1.png", "P6_vocabulary_exercises_21_Q1_neglected_2.png"], "examples": [{"en": "The old house had been neglected for years, with overgrown weeds and peeling paint everywhere.", "cn": "\u8fd9\u5ea7\u8001\u623f\u5b50\u5df2\u7ecf\u88ab\u5ffd\u89c6\u4e86\u5f88\u591a\u5e74\uff0c\u5230\u5904\u90fd\u662f\u6742\u8349\u4e1b\u751f\u548c\u6cb9\u6f06\u5265\u843d\u3002"}, {"en": "She felt neglected by her husband, who was always working and never spent time with her.", "cn": "\u5979\u611f\u5230\u88ab\u4e08\u592b\u5ffd\u89c6\u4e86\uff0c\u4ed6\u603b\u662f\u5de5\u4f5c\uff0c\u4ece\u4e0d\u82b1\u65f6\u95f4\u966a\u5979\u3002"}]}, {"word": "forsaken", "ipa": "/f\u0259r\u02c8se\u026ak\u0259n/", "meanings": {"en": "Abandoned or deserted; given up or renounced.", "cn": "\u629b\u5f03\u6216\u9057\u5f03\uff1b\u653e\u5f03\u6216\u80cc\u5f03\u3002"}, "usage_en": "Describes someone or something that has been completely abandoned.", "usage_cn": "\u63cf\u8ff0\u5df2\u88ab\u5b8c\u5168\u629b\u5f03\u7684\u67d0\u4eba\u6216\u67d0\u4e8b\u3002", "scene_en": "A lone figure standing in a desolate, abandoned landscape.", "scene_cn": "\u4e00\u4e2a\u5b64\u72ec\u7684\u8eab\u5f71\u7ad9\u5728\u8352\u51c9\u3001\u5e9f\u5f03\u7684\u666f\u89c2\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q1_forsaken_1.png", "P6_vocabulary_exercises_21_Q1_forsaken_2.png"], "examples": [{"en": "He felt forsaken by his friends when they all moved away and left him behind alone.", "cn": "\u5f53\u4ed6\u7684\u670b\u53cb\u4eec\u90fd\u642c\u8d70\u5e76\u628a\u4ed6\u72ec\u81ea\u7559\u4e0b\u65f6\uff0c\u4ed6\u611f\u5230\u88ab\u670b\u53cb\u4eec\u629b\u5f03\u4e86\u3002"}, {"en": "The small village was forsaken after the factory closed, leaving the residents without jobs.", "cn": "\u5de5\u5382\u5012\u95ed\u540e\uff0c\u8fd9\u4e2a\u5c0f\u6751\u5e84\u88ab\u9057\u5f03\u4e86\uff0c\u5c45\u6c11\u4eec\u5931\u53bb\u4e86\u5de5\u4f5c\u3002"}]}], "synonym_cn": "\u5ffd\u7565 vs. \u62d2\u7edd vs. \u6cae\u4e27 vs. \u629b\u5f03", "socratic_questions": [{"question": "If a company decides not to hire a candidate after an interview, have they ______ the candidate?", "options": ["rejected", "dejected", "neglected", "forsaken"], "correct_answer": "rejected", "explanation": "Rejected means to refuse to accept or consider something or someone."}, {"question": "If a student feels sad and hopeless after failing an important exam, are they feeling ______?", "options": ["rejected", "dejected", "neglected", "forsaken"], "correct_answer": "dejected", "explanation": "Dejected means feeling sad and without hope."}, {"question": "If a pet owner fails to provide food, water, and care for their dog, have they ______ the dog?", "options": ["rejected", "dejected", "neglected", "forsaken"], "correct_answer": "neglected", "explanation": "Neglected means failed to care for properly."}, {"question": "If a group of friends completely abandon a friend in need, have they ______ that friend?", "options": ["rejected", "dejected", "neglected", "forsaken"], "correct_answer": "forsaken", "explanation": "Forsaken means abandoned or deserted."}]}, {"id": 2, "stem": "This plot of land is so ______ that nothing can be grown from it.", "correct_index": 2, "options": [{"word": "fertile", "ipa": "/\u02c8f\u025c\u02d0rta\u026al/", "meanings": {"en": "Capable of producing abundant vegetation or crops.", "cn": "\u80fd\u591f\u751f\u4ea7\u4e30\u5bcc\u7684\u690d\u88ab\u6216\u519c\u4f5c\u7269\u3002"}, "usage_en": "Used to describe land or soil that is good for growing plants.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u9002\u5408\u690d\u7269\u751f\u957f\u7684\u571f\u5730\u6216\u571f\u58e4\u3002", "scene_en": "A lush green field with crops growing abundantly under the sun.", "scene_cn": "\u9633\u5149\u4e0b\uff0c\u4e00\u7247\u90c1\u90c1\u8471\u8471\u7684\u7eff\u8272\u7530\u91ce\uff0c\u519c\u4f5c\u7269\u751f\u957f\u8302\u76db\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q2_fertile_1.png", "P6_vocabulary_exercises_21_Q2_fertile_2.png"], "examples": [{"en": "The fertile valley provides ideal conditions for growing various types of vegetables and fruits.", "cn": "\u80a5\u6c83\u7684\u5c71\u8c37\u4e3a\u79cd\u690d\u5404\u79cd\u852c\u83dc\u548c\u6c34\u679c\u63d0\u4f9b\u4e86\u7406\u60f3\u7684\u6761\u4ef6\u3002"}, {"en": "After the heavy rains, the fertile land was ready for planting the new season's crops.", "cn": "\u5927\u96e8\u8fc7\u540e\uff0c\u80a5\u6c83\u7684\u571f\u5730\u5df2\u51c6\u5907\u597d\u79cd\u690d\u65b0\u4e00\u5b63\u7684\u4f5c\u7269\u3002"}]}, {"word": "sterile", "ipa": "/\u02c8ster\u0259l/", "meanings": {"en": "Free from bacteria or other living microorganisms; infertile or not productive.", "cn": "\u6ca1\u6709\u7ec6\u83cc\u6216\u5176\u4ed6\u6d3b\u7684\u5fae\u751f\u7269\uff1b\u4e0d\u80b2\u6216\u6ca1\u6709\u751f\u4ea7\u529b\u3002"}, "usage_en": "Used in medical contexts to describe a germ-free environment or to describe infertility.", "usage_cn": "\u5728\u533b\u7597\u73af\u5883\u4e2d\u7528\u4e8e\u63cf\u8ff0\u65e0\u83cc\u73af\u5883\uff0c\u6216\u7528\u4e8e\u63cf\u8ff0\u4e0d\u5b55\u4e0d\u80b2\u3002", "scene_en": "A clean, white operating room with medical equipment, ensuring a germ-free environment.", "scene_cn": "\u4e00\u4e2a\u5e72\u51c0\u7684\u767d\u8272\u624b\u672f\u5ba4\uff0c\u914d\u5907\u533b\u7597\u8bbe\u5907\uff0c\u786e\u4fdd\u65e0\u83cc\u73af\u5883\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q2_sterile_1.png", "P6_vocabulary_exercises_21_Q2_sterile_2.png"], "examples": [{"en": "The surgical instruments must be sterile to prevent any risk of infection during the operation.", "cn": "\u624b\u672f\u5668\u68b0\u5fc5\u987b\u662f\u65e0\u83cc\u7684\uff0c\u4ee5\u9632\u6b62\u624b\u672f\u8fc7\u7a0b\u4e2d\u53d1\u751f\u4efb\u4f55\u611f\u67d3\u7684\u98ce\u9669\u3002"}, {"en": "The sterile environment in the lab is crucial for conducting accurate scientific experiments and research.", "cn": "\u5b9e\u9a8c\u5ba4\u4e2d\u7684\u65e0\u83cc\u73af\u5883\u5bf9\u4e8e\u8fdb\u884c\u51c6\u786e\u7684\u79d1\u5b66\u5b9e\u9a8c\u548c\u7814\u7a76\u81f3\u5173\u91cd\u8981\u3002"}]}, {"word": "barren", "ipa": "/\u02c8b\u00e6r\u0259n/", "meanings": {"en": "Too poor to produce vegetation; completely empty or unproductive.", "cn": "\u8fc7\u4e8e\u8d2b\u7620\u800c\u65e0\u6cd5\u751f\u4ea7\u690d\u88ab\uff1b\u5b8c\u5168\u7a7a\u865a\u6216\u6ca1\u6709\u751f\u4ea7\u529b\u3002"}, "usage_en": "Describes land that is unable to support plant growth or a situation lacking in productivity.", "usage_cn": "\u63cf\u8ff0\u65e0\u6cd5\u652f\u6301\u690d\u7269\u751f\u957f\u7684\u571f\u5730\u6216\u7f3a\u4e4f\u751f\u4ea7\u529b\u7684\u60c5\u51b5\u3002", "scene_en": "A dry, cracked landscape with no signs of plant life under a scorching sun.", "scene_cn": "\u5728\u708e\u70ed\u7684\u9633\u5149\u4e0b\uff0c\u4e00\u7247\u5e72\u71e5\u3001\u9f9f\u88c2\u7684\u666f\u89c2\uff0c\u6ca1\u6709\u690d\u7269\u751f\u547d\u7684\u8ff9\u8c61\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q2_barren_1.png", "P6_vocabulary_exercises_21_Q2_barren_2.png"], "examples": [{"en": "The barren desert stretched for miles, with only sand and rocks visible to the horizon.", "cn": "\u8d2b\u7620\u7684\u6c99\u6f20\u7ef5\u5ef6\u6570\u82f1\u91cc\uff0c\u5730\u5e73\u7ebf\u4e0a\u53ea\u80fd\u770b\u5230\u6c99\u5b50\u548c\u5ca9\u77f3\u3002"}, {"en": "After years of neglect, the once fertile field had become barren and unable to yield crops.", "cn": "\u7ecf\u8fc7\u591a\u5e74\u7684\u5ffd\u89c6\uff0c\u66fe\u7ecf\u80a5\u6c83\u7684\u7530\u5730\u5df2\u7ecf\u53d8\u5f97\u8d2b\u7620\uff0c\u65e0\u6cd5\u4ea7\u51fa\u4f5c\u7269\u3002"}]}, {"word": "fruitless", "ipa": "/\u02c8fru\u02d0tl\u0259s/", "meanings": {"en": "Failing to achieve the desired results; unproductive or without success.", "cn": "\u672a\u80fd\u8fbe\u5230\u9884\u671f\u7684\u7ed3\u679c\uff1b\u6ca1\u6709\u751f\u4ea7\u529b\u6216\u6ca1\u6709\u6210\u529f\u3002"}, "usage_en": "Used to describe efforts or actions that do not yield positive outcomes.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6ca1\u6709\u4ea7\u751f\u79ef\u6781\u7ed3\u679c\u7684\u52aa\u529b\u6216\u884c\u52a8\u3002", "scene_en": "A person looking frustrated after a failed attempt to solve a complex problem.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u8bd5\u56fe\u89e3\u51b3\u4e00\u4e2a\u590d\u6742\u95ee\u9898\u5931\u8d25\u540e\u663e\u5f97\u6cae\u4e27\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q2_fruitless_1.png", "P6_vocabulary_exercises_21_Q2_fruitless_2.png"], "examples": [{"en": "Despite hours of discussion, the negotiations proved fruitless, and no agreement was reached between the parties.", "cn": "\u5c3d\u7ba1\u8fdb\u884c\u4e86\u6570\u5c0f\u65f6\u7684\u8ba8\u8bba\uff0c\u4f46\u8c08\u5224\u8bc1\u660e\u662f\u5f92\u52b3\u7684\uff0c\u53cc\u65b9\u6ca1\u6709\u8fbe\u6210\u4efb\u4f55\u534f\u8bae\u3002"}, {"en": "His fruitless efforts to repair the old car ended with him calling a professional mechanic for assistance.", "cn": "\u4ed6\u4fee\u7406\u65e7\u8f66\u7684\u5f92\u52b3\u52aa\u529b\u6700\u7ec8\u5bfc\u81f4\u4ed6\u6253\u7535\u8bdd\u7ed9\u4e13\u4e1a\u7684\u673a\u68b0\u5e08\u5bfb\u6c42\u5e2e\u52a9\u3002"}]}], "synonym_cn": "\u4e0d\u80b2\u7684\uff0c\u8d2b\u7620\u7684\uff0c\u6ca1\u6709\u7ed3\u679c\u7684 (b\u00f9 y\u00f9 de, p\u00edn j\u00ed de, m\u00e9i y\u01d2u ji\u00e9 gu\u01d2 de)", "socratic_questions": [{"question": "If a farmer wants to grow rice, which type of land is most suitable?", "options": ["fertile", "sterile", "barren", "fruitless"], "correct_answer": "fertile", "explanation": "Fertile land is rich in nutrients and supports plant growth."}, {"question": "In a hospital setting, which environment is crucial to prevent infections?", "options": ["fertile", "sterile", "barren", "fruitless"], "correct_answer": "sterile", "explanation": "A sterile environment is free from bacteria and microorganisms."}, {"question": "After many years of drought, what is the most likely state of the land?", "options": ["fertile", "sterile", "barren", "fruitless"], "correct_answer": "barren", "explanation": "Barren land is unproductive and unable to sustain plant life."}, {"question": "If a negotiation fails to produce any positive outcomes, it can be described as?", "options": ["fertile", "sterile", "barren", "fruitless"], "correct_answer": "fruitless", "explanation": "Fruitless means not producing the desired results or success."}]}, {"id": 3, "stem": "A person often ______ in the desert when there is insufficient water.", "correct_index": 1, "options": [{"word": "starves", "ipa": "/st\u0251\u02d0rvz/", "meanings": {"en": "Suffers severely from hunger; dies or suffers greatly from lack of food.", "cn": "\u56e0\u9965\u997f\u800c\u53d7\u82e6\uff1b\u56e0\u7f3a\u4e4f\u98df\u7269\u800c\u6b7b\u4ea1\u6216\u906d\u53d7\u5de8\u5927\u75db\u82e6\u3002"}, "usage_en": "Used to describe the condition of extreme hunger and deprivation.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6781\u5ea6\u9965\u997f\u548c\u532e\u4e4f\u7684\u72b6\u6001\u3002", "scene_en": "A desolate landscape with emaciated figures struggling to find food.", "scene_cn": "\u4e00\u4e2a\u8352\u51c9\u7684\u666f\u8c61\uff0c\u7626\u5f31\u7684\u4eba\u4eec\u6323\u624e\u7740\u5bfb\u627e\u98df\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q3_starves_1.png", "P6_vocabulary_exercises_21_Q3_starves_2.png"], "examples": [{"en": "During the famine, many people in the village starved to death due to lack of resources.", "cn": "\u5728\u9965\u8352\u671f\u95f4\uff0c\u6751\u91cc\u8bb8\u591a\u4eba\u56e0\u7f3a\u4e4f\u8d44\u6e90\u800c\u997f\u6b7b\u3002"}, {"en": "The neglected animals starved because their owner failed to provide them with adequate food.", "cn": "\u88ab\u5ffd\u89c6\u7684\u52a8\u7269\u997f\u6b7b\u4e86\uff0c\u56e0\u4e3a\u5b83\u4eec\u7684\u4e3b\u4eba\u6ca1\u6709\u7ed9\u5b83\u4eec\u63d0\u4f9b\u8db3\u591f\u7684\u98df\u7269\u3002"}]}, {"word": "hallucinates", "ipa": "/h\u0259\u02c8lu\u02d0s\u026ane\u026ats/", "meanings": {"en": "Experiences sensory perceptions that have no basis in reality; sees or hears things that are not there.", "cn": "\u4f53\u9a8c\u6ca1\u6709\u73b0\u5b9e\u4f9d\u636e\u7684\u611f\u5b98\u77e5\u89c9\uff1b\u770b\u5230\u6216\u542c\u5230\u4e0d\u5b58\u5728\u7684\u4e8b\u7269\u3002"}, "usage_en": "Describes the act of perceiving unreal sensory experiences.", "usage_cn": "\u63cf\u8ff0\u611f\u77e5\u4e0d\u771f\u5b9e\u7684\u611f\u5b98\u4f53\u9a8c\u7684\u884c\u4e3a\u3002", "scene_en": "A person in a desert, seeing mirages and distorted images due to dehydration.", "scene_cn": "\u6c99\u6f20\u4e2d\u7684\u4e00\u4e2a\u4eba\uff0c\u7531\u4e8e\u8131\u6c34\u800c\u770b\u5230\u6d77\u5e02\u8703\u697c\u548c\u626d\u66f2\u7684\u56fe\u50cf\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q3_hallucinates_1.png", "P6_vocabulary_exercises_21_Q3_hallucinates_2.png"], "examples": [{"en": "Due to extreme dehydration, the traveler hallucinates and sees water where there is only sand.", "cn": "\u7531\u4e8e\u6781\u5ea6\u8131\u6c34\uff0c\u65c5\u884c\u8005\u4ea7\u751f\u5e7b\u89c9\uff0c\u770b\u5230\u6709\u6c34\u7684\u5730\u65b9\u53ea\u6709\u6c99\u5b50\u3002"}, {"en": "The patient hallucinates after taking the medication, reporting seeing colorful patterns and hearing voices.", "cn": "\u75c5\u4eba\u670d\u7528\u836f\u7269\u540e\u4ea7\u751f\u5e7b\u89c9\uff0c\u62a5\u544a\u8bf4\u770b\u5230\u5f69\u8272\u56fe\u6848\u5e76\u542c\u5230\u58f0\u97f3\u3002"}]}, {"word": "imagines", "ipa": "/\u026a\u02c8m\u00e6d\u0292\u026anz/", "meanings": {"en": "Forms a mental image or concept of something not present or real; creates a mental picture.", "cn": "\u5f62\u6210\u5bf9\u4e0d\u5b58\u5728\u6216\u4e0d\u771f\u5b9e\u4e8b\u7269\u7684\u5fc3\u7406\u56fe\u50cf\u6216\u6982\u5ff5\uff1b\u521b\u9020\u4e00\u4e2a\u5fc3\u7406\u56fe\u50cf\u3002"}, "usage_en": "Refers to the act of creating mental images or scenarios.", "usage_cn": "\u6307\u521b\u9020\u5fc3\u7406\u56fe\u50cf\u6216\u573a\u666f\u7684\u884c\u4e3a\u3002", "scene_en": "A child lying in bed, imagining fantastical creatures and adventures.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u8eba\u5728\u5e8a\u4e0a\uff0c\u60f3\u8c61\u7740\u5947\u5f02\u7684\u751f\u7269\u548c\u5192\u9669\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q3_imagines_1.png", "P6_vocabulary_exercises_21_Q3_imagines_2.png"], "examples": [{"en": "She imagines herself winning the lottery and traveling the world, enjoying a life of luxury.", "cn": "\u5979\u60f3\u8c61\u81ea\u5df1\u4e2d\u4e86\u5f69\u7968\uff0c\u73af\u6e38\u4e16\u754c\uff0c\u4eab\u53d7\u5962\u534e\u7684\u751f\u6d3b\u3002"}, {"en": "The author imagines a dystopian future where technology controls every aspect of human life and society.", "cn": "\u4f5c\u8005\u60f3\u8c61\u4e86\u4e00\u4e2a\u53cd\u4e4c\u6258\u90a6\u7684\u672a\u6765\uff0c\u6280\u672f\u63a7\u5236\u7740\u4eba\u7c7b\u751f\u6d3b\u548c\u793e\u4f1a\u7684\u65b9\u65b9\u9762\u9762\u3002"}]}, {"word": "creates", "ipa": "/kri\u02c8e\u026ats/", "meanings": {"en": "Brings something into existence; produces or designs something new.", "cn": "\u4f7f\u67d0\u7269\u5b58\u5728\uff1b\u751f\u4ea7\u6216\u8bbe\u8ba1\u65b0\u7684\u4e1c\u897f\u3002"}, "usage_en": "Describes the act of producing something original or new.", "usage_cn": "\u63cf\u8ff0\u751f\u4ea7\u539f\u521b\u6216\u65b0\u4e8b\u7269\u7684\u884c\u4e3a\u3002", "scene_en": "An artist in a studio, creating a painting with vibrant colors and textures.", "scene_cn": "\u5de5\u4f5c\u5ba4\u91cc\u7684\u4e00\u4f4d\u827a\u672f\u5bb6\uff0c\u521b\u4f5c\u4e00\u5e45\u8272\u5f69\u9c9c\u8273\u3001\u8d28\u611f\u4e30\u5bcc\u7684\u753b\u4f5c\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q3_creates_1.png", "P6_vocabulary_exercises_21_Q3_creates_2.png"], "examples": [{"en": "The chef creates a delicious new dish by combining traditional ingredients with modern techniques.", "cn": "\u53a8\u5e08\u901a\u8fc7\u5c06\u4f20\u7edf\u98df\u6750\u4e0e\u73b0\u4ee3\u6280\u672f\u76f8\u7ed3\u5408\uff0c\u521b\u9020\u51fa\u4e00\u9053\u7f8e\u5473\u7684\u65b0\u83dc\u80b4\u3002"}, {"en": "The software engineer creates a new application that simplifies complex tasks for the end-users efficiently.", "cn": "\u8f6f\u4ef6\u5de5\u7a0b\u5e08\u521b\u5efa\u4e86\u4e00\u4e2a\u65b0\u7684\u5e94\u7528\u7a0b\u5e8f\uff0c\u53ef\u4ee5\u6709\u6548\u5730\u7b80\u5316\u6700\u7ec8\u7528\u6237\u7684\u590d\u6742\u4efb\u52a1\u3002"}]}], "synonym_cn": "\u51fa\u73b0\u5e7b\u89c9 vs \u6328\u997f vs \u60f3\u8c61 vs \u521b\u9020", "socratic_questions": [{"question": "If someone lacks food for a long time, what might they eventually do?", "options": ["starves", "hallucinates", "imagines", "creates"], "correct_answer": "starves", "explanation": "Starving refers to suffering severely from lack of food."}, {"question": "When someone's mind produces unreal images or sensations, what are they doing?", "options": ["starves", "hallucinates", "imagines", "creates"], "correct_answer": "hallucinates", "explanation": "Hallucinating means experiencing sensory perceptions that have no basis in reality."}, {"question": "If a child is playing make-believe with toys, what is the child doing?", "options": ["starves", "hallucinates", "imagines", "creates"], "correct_answer": "imagines", "explanation": "Imagining involves forming a mental image or concept of something."}, {"question": "If an artist is making a sculpture from clay, what is the artist doing?", "options": ["starves", "hallucinates", "imagines", "creates"], "correct_answer": "creates", "explanation": "Creating means bringing something into existence."}]}, {"id": 4, "stem": "Please think before you act else you commit another ______.", "correct_index": 2, "options": [{"word": "flaw", "ipa": "fl\u0254\u02d0", "meanings": {"en": "A slight fault, defect, or imperfection.", "cn": "\u8f7b\u5fae\u7684\u9519\u8bef\u3001\u7f3a\u9677\u6216\u7455\u75b5\u3002"}, "usage_en": "Used to describe minor imperfections in something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e8b\u7269\u4e2d\u8f7b\u5fae\u7684\u7455\u75b5\u3002", "scene_en": "A jeweler inspecting a diamond with a magnifying glass, looking for imperfections.", "scene_cn": "\u4e00\u4f4d\u73e0\u5b9d\u5546\u7528\u653e\u5927\u955c\u68c0\u67e5\u94bb\u77f3\uff0c\u5bfb\u627e\u7455\u75b5\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q4_flaw_1.png", "P6_vocabulary_exercises_21_Q4_flaw_2.png"], "examples": [{"en": "The only flaw in the painting was a small scratch near the corner edge.", "cn": "\u8fd9\u5e45\u753b\u552f\u4e00\u7684\u7455\u75b5\u662f\u89d2\u843d\u8fb9\u7f18\u9644\u8fd1\u7684\u4e00\u4e2a\u5c0f\u5212\u75d5\u3002"}, {"en": "The car's design had a major flaw; the engine overheated after only 30 minutes.", "cn": "\u8fd9\u8f86\u8f66\u7684\u8bbe\u8ba1\u6709\u4e00\u4e2a\u91cd\u5927\u7f3a\u9677\uff1b\u53d1\u52a8\u673a\u4ec530\u5206\u949f\u540e\u5c31\u8fc7\u70ed\u4e86\u3002"}]}, {"word": "shortcoming", "ipa": "\u02c8\u0283\u0254\u02d0tk\u028cm\u026a\u014b", "meanings": {"en": "A fault or failure to meet a certain standard, especially in a person's character, a plan, or a system.", "cn": "\u672a\u80fd\u8fbe\u5230\u4e00\u5b9a\u6807\u51c6\u7684\u7f3a\u70b9\u6216\u5931\u8d25\uff0c\u5c24\u5176\u662f\u5728\u4eba\u7684\u6027\u683c\u3001\u8ba1\u5212\u6216\u7cfb\u7edf\u4e2d\u3002"}, "usage_en": "Used to point out deficiencies or areas needing improvement.", "usage_cn": "\u7528\u4e8e\u6307\u51fa\u9700\u8981\u6539\u8fdb\u7684\u7f3a\u9677\u6216\u9886\u57df\u3002", "scene_en": "A business meeting where team members are discussing the shortcomings of a project plan.", "scene_cn": "\u4e00\u6b21\u5546\u52a1\u4f1a\u8bae\uff0c\u56e2\u961f\u6210\u5458\u6b63\u5728\u8ba8\u8bba\u9879\u76ee\u8ba1\u5212\u7684\u4e0d\u8db3\u4e4b\u5904\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q4_shortcoming_1.png", "P6_vocabulary_exercises_21_Q4_shortcoming_2.png"], "examples": [{"en": "One major shortcoming of the proposal was its lack of detail about the budget.", "cn": "\u8be5\u63d0\u6848\u7684\u4e00\u4e2a\u4e3b\u8981\u7f3a\u70b9\u662f\u7f3a\u4e4f\u5173\u4e8e\u9884\u7b97\u7684\u8be6\u7ec6\u4fe1\u606f\u3002"}, {"en": "Her only real shortcoming as a manager was her inability to delegate tasks effectively.", "cn": "\u5979\u4f5c\u4e3a\u7ecf\u7406\u7684\u552f\u4e00\u771f\u6b63\u7f3a\u70b9\u662f\u5979\u65e0\u6cd5\u6709\u6548\u5730\u5206\u914d\u4efb\u52a1\u3002"}]}, {"word": "blunder", "ipa": "\u02c8bl\u028cnd\u0259r", "meanings": {"en": "A stupid or careless mistake.", "cn": "\u611a\u8822\u6216\u7c97\u5fc3\u7684\u9519\u8bef\u3002"}, "usage_en": "Used to describe a significant and often embarrassing mistake.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u91cd\u5927\u4e14\u5e38\u5e38\u4ee4\u4eba\u5c34\u5c2c\u7684\u9519\u8bef\u3002", "scene_en": "A politician giving a speech and making a major factual error.", "scene_cn": "\u4e00\u4f4d\u653f\u6cbb\u5bb6\u53d1\u8868\u6f14\u8bb2\u5e76\u72af\u4e86\u4e00\u4e2a\u91cd\u5927\u7684\u4e8b\u5b9e\u9519\u8bef\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q4_blunder_1.png", "P6_vocabulary_exercises_21_Q4_blunder_2.png"], "examples": [{"en": "I made a terrible blunder by forgetting my wife's birthday this year.", "cn": "\u6211\u4eca\u5e74\u5fd8\u8bb0\u4e86\u6211\u59bb\u5b50\u7684\u751f\u65e5\uff0c\u72af\u4e86\u4e00\u4e2a\u53ef\u6015\u7684\u9519\u8bef\u3002"}, {"en": "The company committed a major blunder when they released the product without proper testing.", "cn": "\u8be5\u516c\u53f8\u5728\u6ca1\u6709\u8fdb\u884c\u9002\u5f53\u6d4b\u8bd5\u7684\u60c5\u51b5\u4e0b\u53d1\u5e03\u4ea7\u54c1\u65f6\u72af\u4e86\u4e00\u4e2a\u91cd\u5927\u9519\u8bef\u3002"}]}, {"word": "problem", "ipa": "\u02c8pr\u0252bl\u0259m", "meanings": {"en": "A matter or situation regarded as unwelcome or harmful and needing to be dealt with and overcome.", "cn": "\u88ab\u8ba4\u4e3a\u662f\u4e0d\u53d7\u6b22\u8fce\u6216\u6709\u5bb3\u7684\uff0c\u9700\u8981\u5904\u7406\u548c\u514b\u670d\u7684\u4e8b\u60c5\u6216\u60c5\u51b5\u3002"}, "usage_en": "Used to describe a general difficulty or challenge.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u822c\u7684\u56f0\u96be\u6216\u6311\u6218\u3002", "scene_en": "A group of people brainstorming solutions to a complex business problem.", "scene_cn": "\u4e00\u7fa4\u4eba\u96c6\u601d\u5e7f\u76ca\uff0c\u5bfb\u627e\u89e3\u51b3\u590d\u6742\u4e1a\u52a1\u95ee\u9898\u7684\u65b9\u6cd5\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q4_problem_1.png", "P6_vocabulary_exercises_21_Q4_problem_2.png"], "examples": [{"en": "The biggest problem we face is the lack of funding for the project's next phase.", "cn": "\u6211\u4eec\u9762\u4e34\u7684\u6700\u5927\u95ee\u9898\u662f\u7f3a\u4e4f\u9879\u76ee\u4e0b\u4e00\u9636\u6bb5\u7684\u8d44\u91d1\u3002"}, {"en": "Solving this problem requires a collaborative effort from all members of the team.", "cn": "\u89e3\u51b3\u8fd9\u4e2a\u95ee\u9898\u9700\u8981\u56e2\u961f\u6240\u6709\u6210\u5458\u7684\u5171\u540c\u52aa\u529b\u3002"}]}], "synonym_cn": "\u9519\u8bef\uff0c\u5931\u8bef\uff0c\u8fc7\u5931", "socratic_questions": [{"question": "If a design has a minor imperfection that doesn't affect its function, is it a major ______?", "options": ["flaw", "shortcoming", "blunder", "problem"], "correct_answer": "flaw", "explanation": "A 'flaw' is a minor imperfection or defect."}, {"question": "If a plan lacks sufficient detail in one area, is this a ______ or a complete failure?", "options": ["flaw", "shortcoming", "blunder", "problem"], "correct_answer": "shortcoming", "explanation": "A 'shortcoming' is a deficiency or lack of something."}, {"question": "If you accidentally send a confidential email to the wrong person, is that a ______ or a simple mistake?", "options": ["flaw", "shortcoming", "blunder", "problem"], "correct_answer": "blunder", "explanation": "A 'blunder' is a serious mistake, often due to carelessness."}, {"question": "If a project is facing unexpected delays and budget overruns, is it facing a ______?", "options": ["flaw", "shortcoming", "blunder", "problem"], "correct_answer": "problem", "explanation": "A 'problem' is a general difficulty or challenge."}]}, {"id": 5, "stem": "As this is my treat, I will ______ the bill for tonight.", "correct_index": 3, "options": [{"word": "check", "ipa": "/t\u0283ek/", "meanings": {"en": "Examine (something) to determine its accuracy, quality, or condition.", "cn": "\u68c0\u67e5\uff08\u67d0\u7269\uff09\u4ee5\u786e\u5b9a\u5176\u51c6\u786e\u6027\u3001\u8d28\u91cf\u6216\u72b6\u51b5\u3002"}, "usage_en": "Used to verify information or inspect something.", "usage_cn": "\u7528\u4e8e\u9a8c\u8bc1\u4fe1\u606f\u6216\u68c0\u67e5\u67d0\u7269\u3002", "scene_en": "A person reviewing a document with a magnifying glass.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u653e\u5927\u955c\u68c0\u67e5\u6587\u4ef6\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q5_check_1.png", "P6_vocabulary_exercises_21_Q5_check_2.png"], "examples": [{"en": "Please check the report for any errors before submitting it to the manager.", "cn": "\u8bf7\u5728\u5c06\u62a5\u544a\u63d0\u4ea4\u7ed9\u7ecf\u7406\u4e4b\u524d\u68c0\u67e5\u62a5\u544a\u4e2d\u662f\u5426\u6709\u4efb\u4f55\u9519\u8bef\u3002"}, {"en": "I need to check my bank account balance to see if I can afford it.", "cn": "\u6211\u9700\u8981\u67e5\u770b\u6211\u7684\u94f6\u884c\u8d26\u6237\u4f59\u989d\uff0c\u770b\u770b\u6211\u662f\u5426\u8d1f\u62c5\u5f97\u8d77\u3002"}]}, {"word": "forgo", "ipa": "/f\u0254\u02d0r\u02c8\u0261o\u028a/", "meanings": {"en": "Omit or decline to take (something pleasant or useful); go without.", "cn": "\u7701\u7565\u6216\u62d2\u7edd\u63a5\u53d7\uff08\u4ee4\u4eba\u6109\u5feb\u6216\u6709\u7528\u7684\u4e1c\u897f\uff09\uff1b\u6ca1\u6709\u4e5f\u884c\u3002"}, "usage_en": "Used when voluntarily giving up something.", "usage_cn": "\u7528\u4e8e\u81ea\u613f\u653e\u5f03\u67d0\u4e8b\u7269\u65f6\u3002", "scene_en": "A person declining a slice of cake at a party.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u805a\u4f1a\u4e0a\u62d2\u7edd\u4e00\u5757\u86cb\u7cd5\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q5_forgo_1.png", "P6_vocabulary_exercises_21_Q5_forgo_2.png"], "examples": [{"en": "I decided to forgo dessert to reduce my sugar intake for health reasons.", "cn": "\u6211\u51b3\u5b9a\u4e0d\u5403\u751c\u70b9\uff0c\u4ee5\u51cf\u5c11\u7cd6\u7684\u6444\u5165\u91cf\uff0c\u4e3a\u4e86\u5065\u5eb7\u539f\u56e0\u3002"}, {"en": "She chose to forgo her vacation this year to save money for a house.", "cn": "\u5979\u9009\u62e9\u4eca\u5e74\u653e\u5f03\u4f11\u5047\uff0c\u4e3a\u4e86\u6512\u94b1\u4e70\u623f\u3002"}]}, {"word": "hand", "ipa": "/h\u00e6nd/", "meanings": {"en": "Give (something) to someone.", "cn": "\u628a\uff08\u67d0\u7269\uff09\u4ea4\u7ed9\u67d0\u4eba\u3002"}, "usage_en": "Used to describe the act of giving something physically.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5b9e\u9645\u7ed9\u4e88\u67d0\u7269\u7684\u884c\u4e3a\u3002", "scene_en": "A person handing a document to another person across a desk.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u529e\u516c\u684c\u524d\u5c06\u6587\u4ef6\u9012\u7ed9\u53e6\u4e00\u4e2a\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q5_hand_1.png", "P6_vocabulary_exercises_21_Q5_hand_2.png"], "examples": [{"en": "Please hand me the stapler so I can bind these papers together quickly.", "cn": "\u8bf7\u628a\u8ba2\u4e66\u673a\u9012\u7ed9\u6211\uff0c\u8fd9\u6837\u6211\u5c31\u53ef\u4ee5\u5feb\u901f\u5730\u628a\u8fd9\u4e9b\u7eb8\u5f20\u88c5\u8ba2\u5728\u4e00\u8d77\u3002"}, {"en": "Could you hand the remote control to me? I want to change the channel.", "cn": "\u4f60\u80fd\u628a\u9065\u63a7\u5668\u9012\u7ed9\u6211\u5417\uff1f\u6211\u60f3\u6362\u4e2a\u9891\u9053\u3002"}]}, {"word": "foot", "ipa": "/f\u028at/", "meanings": {"en": "Pay (a bill or expenses).", "cn": "\u652f\u4ed8\uff08\u8d26\u5355\u6216\u8d39\u7528\uff09\u3002"}, "usage_en": "Used to indicate responsibility for payment.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u4ed8\u6b3e\u8d23\u4efb\u3002", "scene_en": "A person paying a restaurant bill with a credit card.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u4fe1\u7528\u5361\u652f\u4ed8\u9910\u5385\u8d26\u5355\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q5_foot_1.png", "P6_vocabulary_exercises_21_Q5_foot_2.png"], "examples": [{"en": "Since it's your birthday, I will foot the bill for the entire dinner party.", "cn": "\u65e2\u7136\u662f\u4f60\u7684\u751f\u65e5\uff0c\u6211\u5c06\u652f\u4ed8\u6574\u4e2a\u665a\u5bb4\u7684\u8d39\u7528\u3002"}, {"en": "My company will foot the bill for all travel expenses during the conference.", "cn": "\u6211\u7684\u516c\u53f8\u5c06\u652f\u4ed8\u4f1a\u8bae\u671f\u95f4\u7684\u6240\u6709\u5dee\u65c5\u8d39\u7528\u3002"}]}], "synonym_cn": "\u627f\u62c5\u8d39\u7528\uff1b\u652f\u4ed8\u8d26\u5355", "socratic_questions": [{"question": "If you need to verify the details on a document, which action would you take?", "options": ["check", "forgo", "hand", "foot"], "correct_answer": "check", "explanation": "'Check' means to examine something to determine its accuracy or condition."}, {"question": "If you decide to give up a right or advantage, what are you doing?", "options": ["check", "forgo", "hand", "foot"], "correct_answer": "forgo", "explanation": "'Forgo' means to abstain from or give up something."}, {"question": "What action would you take to give something to someone?", "options": ["check", "forgo", "hand", "foot"], "correct_answer": "hand", "explanation": "'Hand' means to give or pass something to someone."}, {"question": "If you are responsible for paying the entire cost of something, you will do what?", "options": ["check", "forgo", "hand", "foot"], "correct_answer": "foot", "explanation": "'Foot' means to pay for something, especially a bill or expense."}]}, {"id": 6, "stem": "He is not a professional football player but a/an ______.", "correct_index": 3, "options": [{"word": "reserve", "ipa": "/r\u026a\u02c8z\u025c\u02d0v/", "meanings": {"en": "Kept in store or saved for future use; a backup.", "cn": "\u7559\u5b58\u6216\u4fdd\u5b58\u4ee5\u5907\u5c06\u6765\u4f7f\u7528\uff1b\u5907\u7528\u3002"}, "usage_en": "Used to describe something kept back or saved.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u88ab\u4fdd\u7559\u6216\u4fdd\u5b58\u7684\u4e1c\u897f\u3002", "scene_en": "A sports team with players on the bench, ready to play.", "scene_cn": "\u4e00\u652f\u8fd0\u52a8\u961f\uff0c\u961f\u5458\u5750\u5728\u677f\u51f3\u4e0a\uff0c\u51c6\u5907\u4e0a\u573a\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q6_reserve_1.png", "P6_vocabulary_exercises_21_Q6_reserve_2.png"], "examples": [{"en": "The coach kept a strong player as a reserve in case of injuries.", "cn": "\u6559\u7ec3\u7559\u4e0b\u4e86\u4e00\u540d\u5f3a\u58ee\u7684\u7403\u5458\u4f5c\u4e3a\u66ff\u8865\uff0c\u4ee5\u9632\u53d7\u4f24\u3002"}, {"en": "We have a reserve supply of water in case the main line breaks.", "cn": "\u6211\u4eec\u50a8\u5907\u4e86\u5907\u7528\u6c34\uff0c\u4ee5\u9632\u4e3b\u7ba1\u9053\u7834\u88c2\u3002"}]}, {"word": "part-timer", "ipa": "/\u02c8p\u0251\u02d0rtta\u026am\u0259r/", "meanings": {"en": "A person who works less than full-time hours.", "cn": "\u5de5\u4f5c\u65f6\u95f4\u5c11\u4e8e\u5168\u804c\u5de5\u4f5c\u65f6\u95f4\u7684\u4eba\u3002"}, "usage_en": "Describes someone working fewer hours than a full-time employee.", "usage_cn": "\u63cf\u8ff0\u67d0\u4eba\u5de5\u4f5c\u65f6\u95f4\u5c11\u4e8e\u5168\u804c\u5458\u5de5\u3002", "scene_en": "A person working at a coffee shop for a few hours each day.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5496\u5561\u5e97\u6bcf\u5929\u5de5\u4f5c\u51e0\u4e2a\u5c0f\u65f6\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q6_part-timer_1.png", "P6_vocabulary_exercises_21_Q6_part-timer_2.png"], "examples": [{"en": "She works as a part-timer at the library to earn some extra money.", "cn": "\u5979\u5728\u56fe\u4e66\u9986\u505a\u517c\u804c\uff0c\u4ee5\u8d5a\u53d6\u4e00\u4e9b\u989d\u5916\u7684\u94b1\u3002"}, {"en": "Many students take on part-timer jobs to help pay for their tuition fees.", "cn": "\u8bb8\u591a\u5b66\u751f\u4ece\u4e8b\u517c\u804c\u5de5\u4f5c\u4ee5\u5e2e\u52a9\u652f\u4ed8\u4ed6\u4eec\u7684\u5b66\u8d39\u3002"}]}, {"word": "recruit", "ipa": "/r\u026a\u02c8kru\u02d0t/", "meanings": {"en": "A newly enlisted or employed person.", "cn": "\u65b0\u5165\u4f0d\u6216\u53d7\u96c7\u7684\u4eba\u3002"}, "usage_en": "Refers to a new member of a group or organization.", "usage_cn": "\u6307\u4e00\u4e2a\u56e2\u4f53\u6216\u7ec4\u7ec7\u7684\u65b0\u6210\u5458\u3002", "scene_en": "A group of new soldiers in basic training.", "scene_cn": "\u4e00\u7fa4\u6b63\u5728\u63a5\u53d7\u57fa\u7840\u8bad\u7ec3\u7684\u65b0\u5175\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q6_recruit_1.png", "P6_vocabulary_exercises_21_Q6_recruit_2.png"], "examples": [{"en": "The company is looking to recruit talented graduates from top universities this year.", "cn": "\u8be5\u516c\u53f8\u4eca\u5e74\u6b63\u5bfb\u6c42\u4ece\u9876\u5c16\u5927\u5b66\u62db\u52df\u6709\u624d\u534e\u7684\u6bd5\u4e1a\u751f\u3002"}, {"en": "The army will recruit new soldiers to strengthen its defense capabilities effectively.", "cn": "\u519b\u961f\u5c06\u62db\u52df\u65b0\u58eb\u5175\u4ee5\u6709\u6548\u52a0\u5f3a\u5176\u9632\u5fa1\u80fd\u529b\u3002"}]}, {"word": "amateur", "ipa": "/\u02c8\u00e6m\u0259t\u0259r/", "meanings": {"en": "A person who engages in a pursuit, especially a sport, on an unpaid basis.", "cn": "\u4e00\u4e2a\u4eba\u4ece\u4e8b\u4e00\u9879\u6d3b\u52a8\uff0c\u5c24\u5176\u662f\u4e00\u9879\u8fd0\u52a8\uff0c\u4f46\u4e0d\u6536\u53d6\u62a5\u916c\u3002"}, "usage_en": "Describes someone who does something for pleasure, not professionally.", "usage_cn": "\u63cf\u8ff0\u67d0\u4eba\u4e3a\u4e86\u4e50\u8da3\u800c\u505a\u67d0\u4e8b\uff0c\u800c\u4e0d\u662f\u4e13\u4e1a\u5730\u505a\u67d0\u4e8b\u3002", "scene_en": "A person painting as a hobby in their free time.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u7a7a\u95f2\u65f6\u95f4\u7ed8\u753b\u4f5c\u4e3a\u7231\u597d\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q6_amateur_1.png", "P6_vocabulary_exercises_21_Q6_amateur_2.png"], "examples": [{"en": "He enjoys playing guitar as an amateur, purely for the love of music.", "cn": "\u4ed6\u559c\u6b22\u4f5c\u4e3a\u4e1a\u4f59\u7231\u597d\u8005\u5f39\u5409\u4ed6\uff0c\u7eaf\u7cb9\u662f\u51fa\u4e8e\u5bf9\u97f3\u4e50\u7684\u70ed\u7231\u3002"}, {"en": "She is an amateur photographer, taking stunning photos during her travels abroad.", "cn": "\u5979\u662f\u4e00\u4f4d\u4e1a\u4f59\u6444\u5f71\u5e08\uff0c\u5728\u56fd\u5916\u65c5\u884c\u671f\u95f4\u62cd\u6444\u4e86\u4ee4\u4eba\u60ca\u53f9\u7684\u7167\u7247\u3002"}]}], "synonym_cn": "\u4e1a\u4f59\u7231\u597d\u8005 vs. \u66ff\u8865\u961f\u5458 vs. \u517c\u804c\u4eba\u5458 vs. \u65b0\u5175", "socratic_questions": [{"question": "In a sports team, who is usually called upon when a regular player is injured or needs a rest?", "options": ["reserve", "part-timer", "recruit", "amateur"], "correct_answer": "reserve", "explanation": "A 'reserve' player is kept on standby to replace regular players when needed."}, {"question": "Which term best describes someone who works at a job for only a portion of the standard working week?", "options": ["reserve", "part-timer", "recruit", "amateur"], "correct_answer": "part-timer", "explanation": "A 'part-timer' works fewer hours than a full-time employee."}, {"question": "If a company is looking for fresh talent, who are they most likely to be seeking?", "options": ["reserve", "part-timer", "recruit", "amateur"], "correct_answer": "recruit", "explanation": "A 'recruit' is a newly hired person, often at an entry-level position."}, {"question": "Which term describes someone who engages in a pursuit, like sports or arts, without pay?", "options": ["reserve", "part-timer", "recruit", "amateur"], "correct_answer": "amateur", "explanation": "An 'amateur' participates in an activity for pleasure, not for financial gain."}]}, {"id": 7, "stem": "Most people in this part of the country ______ cattle for a living.", "correct_index": 2, "options": [{"word": "produce", "ipa": "/pr\u0259\u02c8dju\u02d0s/", "meanings": {"en": "to make or manufacture from components or raw materials.", "cn": "\u7528\u7ec4\u4ef6\u6216\u539f\u6750\u6599\u5236\u9020\u6216\u751f\u4ea7\u3002"}, "usage_en": "Used for manufacturing, creating, or yielding something.", "usage_cn": "\u7528\u4e8e\u5236\u9020\u3001\u521b\u9020\u6216\u4ea7\u751f\u67d0\u7269\u3002", "scene_en": "A factory with machines assembling products on a conveyor belt.", "scene_cn": "\u4e00\u4e2a\u5de5\u5382\uff0c\u673a\u5668\u5728\u4f20\u9001\u5e26\u4e0a\u7ec4\u88c5\u4ea7\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q7_produce_1.png", "P6_vocabulary_exercises_21_Q7_produce_2.png"], "examples": [{"en": "The factory can produce thousands of units each day with its efficient system.", "cn": "\u8fd9\u5bb6\u5de5\u5382\u51ed\u501f\u5176\u9ad8\u6548\u7684\u7cfb\u7edf\uff0c\u6bcf\u5929\u53ef\u4ee5\u751f\u4ea7\u6570\u5343\u53f0\u8bbe\u5907\u3002"}, {"en": "Local farms produce a variety of fresh fruits and vegetables for the market.", "cn": "\u5f53\u5730\u519c\u573a\u4e3a\u5e02\u573a\u751f\u4ea7\u5404\u79cd\u65b0\u9c9c\u6c34\u679c\u548c\u852c\u83dc\u3002"}]}, {"word": "grow", "ipa": "/\u0261ro\u028a/", "meanings": {"en": "to increase in size or develop; to cultivate plants.", "cn": "\u589e\u5927\u5c3a\u5bf8\u6216\u53d1\u5c55\uff1b \u79cd\u690d\u690d\u7269\u3002"}, "usage_en": "Used for natural development or cultivation of plants.", "usage_cn": "\u7528\u4e8e\u81ea\u7136\u53d1\u5c55\u6216\u690d\u7269\u7684\u683d\u57f9\u3002", "scene_en": "A field of crops growing under the sun, with a farmer tending to them.", "scene_cn": "\u9633\u5149\u4e0b\u751f\u957f\u7740\u5e84\u7a3c\u7684\u7530\u91ce\uff0c\u519c\u6c11\u6b63\u5728\u7167\u6599\u5b83\u4eec\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q7_grow_1.png", "P6_vocabulary_exercises_21_Q7_grow_2.png"], "examples": [{"en": "The company continues to grow, expanding its operations into new international markets.", "cn": "\u516c\u53f8\u4e0d\u65ad\u53d1\u5c55\uff0c\u5c06\u5176\u4e1a\u52a1\u6269\u5c55\u5230\u65b0\u7684\u56fd\u9645\u5e02\u573a\u3002"}, {"en": "Farmers grow wheat and corn in the fertile fields of the Midwest every single year.", "cn": "\u519c\u6c11\u6bcf\u5e74\u90fd\u5728\u4e2d\u897f\u90e8\u7684\u80a5\u6c83\u571f\u5730\u4e0a\u79cd\u690d\u5c0f\u9ea6\u548c\u7389\u7c73\u3002"}]}, {"word": "raise", "ipa": "/re\u026az/", "meanings": {"en": "to bring up, nurture, or care for; to elevate or lift.", "cn": "\u517b\u80b2\u3001\u57f9\u80b2\u6216\u7167\u987e\uff1b \u63d0\u5347\u6216\u4e3e\u8d77\u3002"}, "usage_en": "Used for nurturing living beings or lifting objects.", "usage_cn": "\u7528\u4e8e\u517b\u80b2\u751f\u7269\u6216\u62ac\u8d77\u7269\u4f53\u3002", "scene_en": "A family raising children in a loving home environment.", "scene_cn": "\u4e00\u4e2a\u5bb6\u5ead\u5728\u5145\u6ee1\u7231\u7684\u5bb6\u5ead\u73af\u5883\u4e2d\u629a\u517b\u5b69\u5b50\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q7_raise_1.png", "P6_vocabulary_exercises_21_Q7_raise_2.png"], "examples": [{"en": "They raise cattle on their farm, selling the meat at the local farmers market.", "cn": "\u4ed6\u4eec\u5728\u519c\u573a\u9972\u517b\u725b\uff0c\u5e76\u5728\u5f53\u5730\u519c\u8d38\u5e02\u573a\u51fa\u552e\u8089\u7c7b\u3002"}, {"en": "It takes a village to raise a child, providing support and guidance along the way.", "cn": "\u517b\u80b2\u4e00\u4e2a\u5b69\u5b50\u9700\u8981\u4e00\u4e2a\u6751\u5e84\uff0c\u4e00\u8def\u63d0\u4f9b\u652f\u6301\u548c\u6307\u5bfc\u3002"}]}, {"word": "keep", "ipa": "/ki\u02d0p/", "meanings": {"en": "to retain possession of; to maintain in good condition.", "cn": "\u4fdd\u6301\u62e5\u6709\uff1b \u4fdd\u6301\u826f\u597d\u72b6\u6001\u3002"}, "usage_en": "Used for maintaining possession or condition.", "usage_cn": "\u7528\u4e8e\u4fdd\u6301\u6240\u6709\u6743\u6216\u72b6\u6001\u3002", "scene_en": "A person keeping a valuable item safe in a secure location.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c06\u8d35\u91cd\u7269\u54c1\u5b89\u5168\u5730\u4fdd\u5b58\u5728\u5b89\u5168\u7684\u5730\u65b9\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q7_keep_1.png", "P6_vocabulary_exercises_21_Q7_keep_2.png"], "examples": [{"en": "I keep a journal to record my thoughts and experiences from each and every day.", "cn": "\u6211\u5199\u65e5\u8bb0\u6765\u8bb0\u5f55\u6211\u6bcf\u5929\u7684\u60f3\u6cd5\u548c\u7ecf\u5386\u3002"}, {"en": "Please keep the noise down; I am trying to concentrate on my important work.", "cn": "\u8bf7\u4fdd\u6301\u5b89\u9759\uff1b \u6211\u6b63\u5728\u52aa\u529b\u4e13\u6ce8\u4e8e\u6211\u7684\u91cd\u8981\u5de5\u4f5c\u3002"}]}], "synonym_cn": "\u517b\u6b96, \u9972\u517b, \u755c\u517b (\u4fa7\u91cd\u4e8e\u4e0d\u540c\u52a8\u7269\u548c\u76ee\u7684)", "socratic_questions": [{"question": "If you want to mass manufacture goods, would you say you '______' them, or something else?", "options": ["produce", "grow", "raise", "keep"], "correct_answer": "produce", "explanation": "'Produce' means to manufacture or create something, often in large quantities."}, {"question": "If you are cultivating crops like wheat, would you '______' them, or something else?", "options": ["produce", "grow", "raise", "keep"], "correct_answer": "grow", "explanation": "'Grow' means to cultivate or allow something to develop naturally."}, {"question": "If you are taking care of children, would you '______' them, or something else?", "options": ["produce", "grow", "raise", "keep"], "correct_answer": "raise", "explanation": "'Raise' means to bring up or nurture someone or something."}, {"question": "If you are maintaining a secret, would you '______' it, or something else?", "options": ["produce", "grow", "raise", "keep"], "correct_answer": "keep", "explanation": "'Keep' means to maintain or retain possession of something."}]}, {"id": 8, "stem": "Did you watch the ______ about dinosaurs last night?", "correct_index": 3, "options": [{"word": "category", "ipa": "/\u02c8k\u00e6t\u026a\u0261\u0254\u02d0ri/", "meanings": {"en": "A class or division of people or things regarded as having particular shared characteristics.", "cn": "\u88ab\u8ba4\u4e3a\u5177\u6709\u7279\u5b9a\u5171\u540c\u7279\u5f81\u7684\u4eba\u6216\u4e8b\u7269\u7684\u7c7b\u522b\u6216\u5212\u5206\u3002"}, "usage_en": "Used to classify things into groups based on shared characteristics.", "usage_cn": "\u7528\u4e8e\u6839\u636e\u5171\u540c\u7279\u5f81\u5c06\u4e8b\u7269\u5206\u7c7b\u6210\u7ec4\u3002", "scene_en": "A library with books organized into sections like fiction, non-fiction, and biography.", "scene_cn": "\u4e00\u4e2a\u56fe\u4e66\u9986\uff0c\u4e66\u7c4d\u88ab\u7ec4\u7ec7\u6210\u5c0f\u8bf4\u3001\u975e\u5c0f\u8bf4\u548c\u4f20\u8bb0\u7b49\u90e8\u5206\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q8_category_1.png", "P6_vocabulary_exercises_21_Q8_category_2.png"], "examples": [{"en": "The store organizes its products by category, making it easier for customers to find items.", "cn": "\u8fd9\u5bb6\u5546\u5e97\u6309\u7c7b\u522b\u7ec4\u7ec7\u5176\u4ea7\u54c1\uff0c\u4f7f\u987e\u5ba2\u66f4\u5bb9\u6613\u627e\u5230\u5546\u54c1\u3002"}, {"en": "When applying for a job, you often have to select a category that best describes your skills.", "cn": "\u5728\u7533\u8bf7\u5de5\u4f5c\u65f6\uff0c\u4f60\u901a\u5e38\u9700\u8981\u9009\u62e9\u4e00\u4e2a\u6700\u80fd\u63cf\u8ff0\u4f60\u6280\u80fd\u7684\u7c7b\u522b\u3002"}]}, {"word": "item", "ipa": "/\u02c8a\u026at\u0259m/", "meanings": {"en": "A particular article or thing.", "cn": "\u4e00\u4e2a\u7279\u5b9a\u7684\u7269\u54c1\u6216\u4e1c\u897f\u3002"}, "usage_en": "Refers to a single, distinct object or unit.", "usage_cn": "\u6307\u5355\u4e2a\u3001\u72ec\u7279\u7684\u7269\u4f53\u6216\u5355\u4f4d\u3002", "scene_en": "A shopping cart containing various groceries like milk, bread, and eggs.", "scene_cn": "\u4e00\u4e2a\u8d2d\u7269\u8f66\uff0c\u91cc\u9762\u88c5\u7740\u5404\u79cd\u98df\u54c1\u6742\u8d27\uff0c\u5982\u725b\u5976\u3001\u9762\u5305\u548c\u9e21\u86cb\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q8_item_1.png", "P6_vocabulary_exercises_21_Q8_item_2.png"], "examples": [{"en": "Please add this item to the shopping list; we need it for the recipe tonight.", "cn": "\u8bf7\u5c06\u6b64\u7269\u54c1\u6dfb\u52a0\u5230\u8d2d\u7269\u6e05\u5355\u4e2d\uff1b\u6211\u4eec\u4eca\u665a\u7684\u98df\u8c31\u9700\u8981\u5b83\u3002"}, {"en": "Each item in the museum's collection is carefully preserved to maintain its historical value.", "cn": "\u535a\u7269\u9986\u6536\u85cf\u4e2d\u7684\u6bcf\u4ef6\u7269\u54c1\u90fd\u7ecf\u8fc7\u7cbe\u5fc3\u4fdd\u5b58\uff0c\u4ee5\u4fdd\u6301\u5176\u5386\u53f2\u4ef7\u503c\u3002"}]}, {"word": "show", "ipa": "/\u0283o\u028a/", "meanings": {"en": "A performance or event presented to an audience.", "cn": "\u5448\u73b0\u7ed9\u89c2\u4f17\u7684\u8868\u6f14\u6216\u6d3b\u52a8\u3002"}, "usage_en": "Used to describe a performance or exhibition.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8868\u6f14\u6216\u5c55\u89c8\u3002", "scene_en": "A brightly lit stage with performers singing and dancing in front of an audience.", "scene_cn": "\u4e00\u4e2a\u706f\u5149\u660e\u4eae\u7684\u821e\u53f0\uff0c\u8868\u6f14\u8005\u5728\u89c2\u4f17\u9762\u524d\u5531\u6b4c\u8df3\u821e\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q8_show_1.png", "P6_vocabulary_exercises_21_Q8_show_2.png"], "examples": [{"en": "The Broadway show was amazing; the actors were incredibly talented and the music was catchy.", "cn": "\u767e\u8001\u6c47\u7684\u6f14\u51fa\u592a\u68d2\u4e86\uff1b\u6f14\u5458\u4eec\u975e\u5e38\u6709\u624d\u534e\uff0c\u97f3\u4e50\u4e5f\u5f88\u52a8\u542c\u3002"}, {"en": "We went to a magic show last weekend, and the illusions were truly mind-blowing and impressive.", "cn": "\u6211\u4eec\u4e0a\u5468\u672b\u53bb\u770b\u4e86\u4e00\u573a\u9b54\u672f\u8868\u6f14\uff0c\u90a3\u4e9b\u5e7b\u89c9\u771f\u662f\u4ee4\u4eba\u96be\u4ee5\u7f6e\u4fe1\u548c\u5370\u8c61\u6df1\u523b\u3002"}]}, {"word": "documentary", "ipa": "/\u02ccd\u0252kj\u028a\u02c8ment\u0259ri/", "meanings": {"en": "A film or television program presenting the facts about a person or event.", "cn": "\u4e00\u90e8\u5448\u73b0\u5173\u4e8e\u4eba\u7269\u6216\u4e8b\u4ef6\u7684\u4e8b\u5b9e\u7684\u7535\u5f71\u6216\u7535\u89c6\u8282\u76ee\u3002"}, "usage_en": "A factual film or program designed to inform or educate.", "usage_cn": "\u65e8\u5728\u63d0\u4f9b\u4fe1\u606f\u6216\u6559\u80b2\u7684\u4e8b\u5b9e\u7535\u5f71\u6216\u8282\u76ee\u3002", "scene_en": "A scene from a nature documentary showing animals in their natural habitat.", "scene_cn": "\u4e00\u90e8\u81ea\u7136\u7eaa\u5f55\u7247\u4e2d\u7684\u573a\u666f\uff0c\u5c55\u793a\u4e86\u52a8\u7269\u5728\u5176\u81ea\u7136\u6816\u606f\u5730\u4e2d\u7684\u751f\u6d3b\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q8_documentary_1.png", "P6_vocabulary_exercises_21_Q8_documentary_2.png"], "examples": [{"en": "The documentary explored the impact of climate change on polar bear populations in the Arctic region.", "cn": "\u8fd9\u90e8\u7eaa\u5f55\u7247\u63a2\u8ba8\u4e86\u6c14\u5019\u53d8\u5316\u5bf9\u5317\u6781\u5730\u533a\u5317\u6781\u718a\u79cd\u7fa4\u7684\u5f71\u54cd\u3002"}, {"en": "I watched a fascinating documentary about the history of ancient Rome and its lasting legacy.", "cn": "\u6211\u89c2\u770b\u4e86\u4e00\u90e8\u5173\u4e8e\u53e4\u7f57\u9a6c\u5386\u53f2\u53ca\u5176\u6301\u4e45\u9057\u4ea7\u7684\u7cbe\u5f69\u7eaa\u5f55\u7247\u3002"}]}], "synonym_cn": "\u8282\u76ee\u7c7b\u578b vs. \u5355\u4e2a\u9879\u76ee vs. \u6f14\u51fa vs. \u7eaa\u5f55\u7247", "socratic_questions": [{"question": "If you're sorting books in a library, what are you deciding for each book?", "options": ["category", "item", "show", "documentary"], "correct_answer": "category", "explanation": "Category refers to the type or class a book belongs to."}, {"question": "If you lost your keys, what would you be looking for?", "options": ["category", "item", "show", "documentary"], "correct_answer": "item", "explanation": "Item refers to a single, specific object."}, {"question": "If you are watching actors perform live on a stage, what are you watching?", "options": ["category", "item", "show", "documentary"], "correct_answer": "show", "explanation": "Show refers to a performance or event that is presented to an audience."}, {"question": "If you want to learn about the migration patterns of birds, what might you watch?", "options": ["category", "item", "show", "documentary"], "correct_answer": "documentary", "explanation": "Documentary refers to a factual film or program about a specific subject."}]}, {"id": 9, "stem": "My muscles are ______ from lifting those heavy crates up to my flat.", "correct_index": 1, "options": [{"word": "swollen", "ipa": "/\u02c8swo\u028al\u0259n/", "meanings": {"en": "Abnormally expanded or increased in size, typically as a result of an accumulation of fluid.", "cn": "\u5f02\u5e38\u81a8\u80c0\u6216\u5c3a\u5bf8\u589e\u52a0\uff0c\u901a\u5e38\u662f\u7531\u4e8e\u6db2\u4f53\u79ef\u805a\u7684\u7ed3\u679c\u3002"}, "usage_en": "Describes something that has increased in size due to internal pressure or fluid.", "usage_cn": "\u63cf\u8ff0\u7531\u4e8e\u5185\u90e8\u538b\u529b\u6216\u6db2\u4f53\u800c\u5c3a\u5bf8\u589e\u52a0\u7684\u4e1c\u897f\u3002", "scene_en": "A person's ankle is visibly larger than normal after twisting it during a hike.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5f92\u6b65\u65c5\u884c\u4e2d\u626d\u4f24\u811a\u8e1d\u540e\uff0c\u811a\u8e1d\u660e\u663e\u6bd4\u6b63\u5e38\u5927\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q9_swollen_1.png", "P6_vocabulary_exercises_21_Q9_swollen_2.png"], "examples": [{"en": "Her eyes were swollen from crying after she heard the upsetting news yesterday.", "cn": "\u6628\u5929\u542c\u5230\u4ee4\u4eba\u96be\u8fc7\u7684\u6d88\u606f\u540e\uff0c\u5979\u54ed\u5f97\u773c\u775b\u90fd\u80bf\u4e86\u3002"}, {"en": "The river was swollen with rainwater after the heavy storm passed through the area.", "cn": "\u66b4\u96e8\u8fc7\u540e\uff0c\u6cb3\u6c34\u56e0\u96e8\u6c34\u800c\u81a8\u80c0\u3002"}]}, {"word": "sore", "ipa": "/s\u0254\u02d0r/", "meanings": {"en": "Feeling pain or discomfort in a part of the body.", "cn": "\u8eab\u4f53\u7684\u67d0\u4e2a\u90e8\u4f4d\u611f\u5230\u75bc\u75db\u6216\u4e0d\u9002\u3002"}, "usage_en": "Used to describe a feeling of pain or tenderness, often after physical exertion.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u75bc\u75db\u6216\u538b\u75db\u7684\u611f\u89c9\uff0c\u901a\u5e38\u5728\u4f53\u529b\u6d88\u8017\u540e\u3002", "scene_en": "A runner grimaces while stretching their leg muscles after completing a marathon.", "scene_cn": "\u4e00\u540d\u8dd1\u6b65\u8005\u5728\u5b8c\u6210\u9a6c\u62c9\u677e\u540e\uff0c\u4f38\u5c55\u817f\u90e8\u808c\u8089\u65f6\u505a\u7740\u75db\u82e6\u7684\u8868\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q9_sore_1.png", "P6_vocabulary_exercises_21_Q9_sore_2.png"], "examples": [{"en": "After gardening all day, my back was incredibly sore, and I needed a long rest.", "cn": "\u56ed\u827a\u4e86\u4e00\u6574\u5929\u540e\uff0c\u6211\u7684\u80cc\u90e8\u975e\u5e38\u9178\u75db\uff0c\u6211\u9700\u8981\u597d\u597d\u4f11\u606f\u4e00\u4e0b\u3002"}, {"en": "She had a sore throat and found it difficult to swallow anything without feeling discomfort.", "cn": "\u5979\u5589\u5499\u75db\uff0c\u53d1\u73b0\u541e\u54bd\u4efb\u4f55\u4e1c\u897f\u90fd\u611f\u5230\u4e0d\u8212\u670d\u3002"}]}, {"word": "damaged", "ipa": "/\u02c8d\u00e6m\u026ad\u0292d/", "meanings": {"en": "Physically harmed or injured; impaired or spoiled.", "cn": "\u8eab\u4f53\u4e0a\u53d7\u5230\u4f24\u5bb3\u6216\u635f\u4f24\uff1b\u53d7\u635f\u6216\u53d8\u8d28\u3002"}, "usage_en": "Indicates that something has been harmed or broken, either physically or functionally.", "usage_cn": "\u8868\u793a\u67d0\u7269\u53d7\u5230\u635f\u5bb3\u6216\u635f\u574f\uff0c\u65e0\u8bba\u662f\u7269\u7406\u4e0a\u8fd8\u662f\u529f\u80fd\u4e0a\u3002", "scene_en": "A car sits with a dented fender after being involved in a minor traffic accident.", "scene_cn": "\u4e00\u8f86\u6c7d\u8f66\u505c\u5728\u90a3\u91cc\uff0c\u6321\u6ce5\u677f\u51f9\u9677\uff0c\u56e0\u4e3a\u5b83\u5377\u5165\u4e86\u4e00\u8d77\u8f7b\u5fae\u7684\u4ea4\u901a\u4e8b\u6545\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q9_damaged_1.png", "P6_vocabulary_exercises_21_Q9_damaged_2.png"], "examples": [{"en": "The storm damaged the roof of the house, and we had to call a repair service quickly.", "cn": "\u66b4\u98ce\u96e8\u635f\u574f\u4e86\u623f\u5b50\u7684\u5c4b\u9876\uff0c\u6211\u4eec\u4e0d\u5f97\u4e0d\u8d76\u7d27\u6253\u7535\u8bdd\u53eb\u7ef4\u4fee\u670d\u52a1\u3002"}, {"en": "His reputation was damaged after the scandal was revealed, affecting his career prospects badly.", "cn": "\u4e11\u95fb\u66dd\u5149\u540e\uff0c\u4ed6\u7684\u540d\u8a89\u53d7\u635f\uff0c\u4e25\u91cd\u5f71\u54cd\u4e86\u4ed6\u7684\u804c\u4e1a\u524d\u666f\u3002"}]}, {"word": "stretched", "ipa": "/stret\u0283t/", "meanings": {"en": "Extended or elongated beyond the usual or original size or length.", "cn": "\u5ef6\u4f38\u6216\u62c9\u957f\u5230\u8d85\u51fa\u901a\u5e38\u6216\u539f\u59cb\u5c3a\u5bf8\u6216\u957f\u5ea6\u3002"}, "usage_en": "Describes something that has been made longer or wider by pulling or extending it.", "usage_cn": "\u63cf\u8ff0\u901a\u8fc7\u62c9\u52a8\u6216\u5ef6\u4f38\u800c\u53d8\u5f97\u66f4\u957f\u6216\u66f4\u5bbd\u7684\u4e1c\u897f\u3002", "scene_en": "An athlete is doing hamstring stretches before their track and field competition.", "scene_cn": "\u4e00\u540d\u8fd0\u52a8\u5458\u6b63\u5728\u8fdb\u884c\u817f\u7b4b\u4f38\u5c55\u8fd0\u52a8\uff0c\u4e3a\u4ed6\u4eec\u7684\u7530\u5f84\u6bd4\u8d5b\u505a\u51c6\u5907\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q9_stretched_1.png", "P6_vocabulary_exercises_21_Q9_stretched_2.png"], "examples": [{"en": "The fabric was stretched tightly across the frame, creating a smooth surface for painting artwork.", "cn": "\u7ec7\u7269\u7d27\u7d27\u5730\u7ef7\u5728\u6846\u67b6\u4e0a\uff0c\u4e3a\u7ed8\u753b\u521b\u4f5c\u4e86\u4e00\u4e2a\u5149\u6ed1\u7684\u8868\u9762\u3002"}, {"en": "She stretched her arms above her head to relieve the tension in her shoulders and back muscles.", "cn": "\u5979\u5c06\u624b\u81c2\u4f38\u8fc7\u5934\u9876\uff0c\u4ee5\u7f13\u89e3\u80a9\u8180\u548c\u80cc\u90e8\u808c\u8089\u7684\u7d27\u5f20\u3002"}]}], "synonym_cn": "\u75bc\u75db, \u9178\u75db, \u4e0d\u8212\u670d", "socratic_questions": [{"question": "After an intense workout, your legs feel stiff and uncomfortable. Which word describes this feeling?", "options": ["swollen", "sore", "damaged", "stretched"], "correct_answer": "sore", "explanation": "\"Sore\" describes the pain and discomfort experienced after strenuous activity."}, {"question": "If a rubber band is pulled too far, what might happen to it?", "options": ["swollen", "sore", "damaged", "stretched"], "correct_answer": "damaged", "explanation": "\"Damaged\" indicates that the rubber band has been harmed by excessive force."}, {"question": "After eating too much salt, your fingers might feel what?", "options": ["swollen", "sore", "damaged", "stretched"], "correct_answer": "swollen", "explanation": "\"Swollen\" describes the increase in size due to fluid retention."}, {"question": "Before a race, athletes often do what to their muscles?", "options": ["swollen", "sore", "damaged", "stretched"], "correct_answer": "stretched", "explanation": "\"Stretched\" refers to extending muscles to improve flexibility and prevent injury."}]}, {"id": 10, "stem": "On weekends, I like to get my ______ off work by reading a good book.", "correct_index": 1, "options": [{"word": "thoughts", "ipa": "/\u03b8\u0254\u02d0ts/", "meanings": {"en": "Ideas or opinions produced by thinking; reflections.", "cn": "\u901a\u8fc7\u601d\u8003\u4ea7\u751f\u7684\u60f3\u6cd5\u6216\u89c2\u70b9\uff1b\u53cd\u601d\u3002"}, "usage_en": "Often used to describe the content of thinking or reflection.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u601d\u8003\u6216\u53cd\u601d\u7684\u5185\u5bb9\u3002", "scene_en": "A person sitting quietly, writing in a journal, reflecting on their day.", "scene_cn": "\u4e00\u4e2a\u4eba\u5b89\u9759\u5730\u5750\u7740\uff0c\u5728\u65e5\u8bb0\u4e2d\u5199\u4f5c\uff0c\u53cd\u601d\u4ed6\u4eec\u7684\u4e00\u5929\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q10_thoughts_1.png", "P6_vocabulary_exercises_21_Q10_thoughts_2.png"], "examples": [{"en": "Her thoughts were filled with memories of her childhood home and family.", "cn": "\u5979\u7684\u601d\u7eea\u5145\u6ee1\u4e86\u5173\u4e8e\u5979\u7ae5\u5e74\u5bb6\u56ed\u548c\u5bb6\u4eba\u7684\u56de\u5fc6\u3002"}, {"en": "He shared his thoughts on the matter during the meeting, offering a unique perspective.", "cn": "\u4ed6\u5728\u4f1a\u8bae\u4e0a\u5206\u4eab\u4e86\u4ed6\u5bf9\u6b64\u4e8b\u7684\u60f3\u6cd5\uff0c\u63d0\u4f9b\u4e86\u4e00\u4e2a\u72ec\u7279\u7684\u89c6\u89d2\u3002"}]}, {"word": "mind", "ipa": "/ma\u026and/", "meanings": {"en": "The element of a person that enables them to be aware of the world and their experiences, to think, and to feel; the faculty of consciousness and thought.", "cn": "\u4f7f\u4eba\u80fd\u591f\u610f\u8bc6\u5230\u4e16\u754c\u548c\u4ed6\u4eec\u7684\u7ecf\u5386\uff0c\u601d\u8003\u548c\u611f\u53d7\u7684\u5143\u7d20\uff1b\u610f\u8bc6\u548c\u601d\u60f3\u7684\u80fd\u529b\u3002"}, "usage_en": "Refers to the mental capacity, awareness, or state of consciousness.", "usage_cn": "\u6307\u7cbe\u795e\u80fd\u529b\u3001\u610f\u8bc6\u6216\u610f\u8bc6\u72b6\u6001\u3002", "scene_en": "A person meditating with a clear and peaceful expression on their face.", "scene_cn": "\u4e00\u4e2a\u4eba\u51a5\u60f3\uff0c\u8138\u4e0a\u5e26\u7740\u6e05\u6670\u800c\u5e73\u9759\u7684\u8868\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q10_mind_1.png", "P6_vocabulary_exercises_21_Q10_mind_2.png"], "examples": [{"en": "It's important to keep your mind active by learning new things and challenging yourself.", "cn": "\u901a\u8fc7\u5b66\u4e60\u65b0\u4e8b\u7269\u548c\u6311\u6218\u81ea\u5df1\u6765\u4fdd\u6301\u4f60\u7684\u5934\u8111\u6d3b\u8dc3\u975e\u5e38\u91cd\u8981\u3002"}, {"en": "She tried to clear her mind of all worries before going to sleep each night.", "cn": "\u5979\u8bd5\u56fe\u5728\u6bcf\u665a\u7761\u89c9\u524d\u6e05\u9664\u8111\u6d77\u4e2d\u6240\u6709\u7684\u5fe7\u8651\u3002"}]}, {"word": "head", "ipa": "/hed/", "meanings": {"en": "The part of the body above the neck where the brain, eyes, ears, nose, and mouth are.", "cn": "\u9888\u90e8\u4ee5\u4e0a\u8eab\u4f53\u7684\u90e8\u5206\uff0c\u5305\u62ec\u5927\u8111\u3001\u773c\u775b\u3001\u8033\u6735\u3001\u9f3b\u5b50\u548c\u5634\u5df4\u3002"}, "usage_en": "Refers to the physical part of the body.", "usage_cn": "\u6307\u8eab\u4f53\u7684\u7269\u7406\u90e8\u5206\u3002", "scene_en": "A person holding their head in their hands, indicating a headache or stress.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u624b\u62b1\u7740\u5934\uff0c\u8868\u793a\u5934\u75db\u6216\u538b\u529b\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q10_head_1.png", "P6_vocabulary_exercises_21_Q10_head_2.png"], "examples": [{"en": "He bumped his head on the low ceiling and felt a sharp pain immediately afterwards.", "cn": "\u4ed6\u7684\u5934\u649e\u5230\u4e86\u4f4e\u77ee\u7684\u5929\u82b1\u677f\u4e0a\uff0c\u7acb\u523b\u611f\u5230\u4e00\u9635\u5267\u75db\u3002"}, {"en": "She nodded her head in agreement with the speaker's points during the presentation.", "cn": "\u5979\u5728\u6f14\u8bb2\u4e2d\u70b9\u5934\u8868\u793a\u540c\u610f\u6f14\u8bb2\u8005\u7684\u89c2\u70b9\u3002"}]}, {"word": "brain", "ipa": "/bre\u026an/", "meanings": {"en": "An organ of soft nervous tissue contained in the skull of vertebrates, functioning as the coordinating center of sensation and intellectual and nervous activity.", "cn": "\u810a\u690e\u52a8\u7269\u5934\u9aa8\u4e2d\u5305\u542b\u7684\u8f6f\u795e\u7ecf\u7ec4\u7ec7\u5668\u5b98\uff0c\u4f5c\u4e3a\u611f\u89c9\u3001\u667a\u529b\u548c\u795e\u7ecf\u6d3b\u52a8\u7684\u534f\u8c03\u4e2d\u5fc3\u3002"}, "usage_en": "Refers to the physical organ responsible for thought and sensation.", "usage_cn": "\u6307\u8d1f\u8d23\u601d\u8003\u548c\u611f\u89c9\u7684\u7269\u7406\u5668\u5b98\u3002", "scene_en": "A scientific illustration of the human brain, highlighting different regions and functions.", "scene_cn": "\u4eba\u8111\u7684\u79d1\u5b66\u63d2\u56fe\uff0c\u7a81\u51fa\u663e\u793a\u4e0d\u540c\u7684\u533a\u57df\u548c\u529f\u80fd\u3002", "image_paths": ["P6_vocabulary_exercises_21_Q10_brain_1.png", "P6_vocabulary_exercises_21_Q10_brain_2.png"], "examples": [{"en": "The human brain is an incredibly complex organ, capable of amazing feats of processing.", "cn": "\u4eba\u8111\u662f\u4e00\u4e2a\u6781\u5176\u590d\u6742\u7684\u5668\u5b98\uff0c\u80fd\u591f\u5b8c\u6210\u60ca\u4eba\u7684\u5904\u7406\u58ee\u4e3e\u3002"}, {"en": "Scientists are constantly researching the brain to understand how it works and functions.", "cn": "\u79d1\u5b66\u5bb6\u4eec\u4e0d\u65ad\u7814\u7a76\u5927\u8111\uff0c\u4ee5\u4e86\u89e3\u5b83\u662f\u5982\u4f55\u5de5\u4f5c\u548c\u8fd0\u4f5c\u7684\u3002"}]}], "synonym_cn": "\u60f3\u6cd5 vs. \u5fc3\u60c5 vs. \u5934\u8111 vs. \u667a\u529b (\u60f3\u6cd5\u504f\u91cd\u601d\u8003\u5185\u5bb9\uff0c\u5fc3\u60c5\u6307\u60c5\u7eea\u72b6\u6001\uff0c\u5934\u8111\u6307\u7269\u7406\u5668\u5b98\uff0c\u667a\u529b\u6307\u89e3\u51b3\u95ee\u9898\u7684\u80fd\u529b)", "socratic_questions": [{"question": "After a long day of problem-solving at work, what do you need to clear to relax?", "options": ["thoughts", "mind", "head", "brain"], "correct_answer": "mind", "explanation": "The 'mind' refers to your mental state, which needs relaxation after work."}, {"question": "If you're struggling to remember a fact, what part of your body are you trying to stimulate?", "options": ["thoughts", "mind", "head", "brain"], "correct_answer": "brain", "explanation": "The 'brain' is the physical organ responsible for memory and cognitive functions."}, {"question": "When you are contemplating a difficult decision, what are you organizing?", "options": ["thoughts", "mind", "head", "brain"], "correct_answer": "thoughts", "explanation": "'Thoughts' are the individual ideas and considerations you organize when making decisions."}, {"question": "After hitting it on the table, which part of your body hurts?", "options": ["thoughts", "mind", "head", "brain"], "correct_answer": "head", "explanation": "The 'head' is the physical part of your body that contains the brain and can experience pain."}]}]};
