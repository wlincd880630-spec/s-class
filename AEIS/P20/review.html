: "If something is 'known', it is public knowledge, the opposite of private."}, {"question": "If someone is giving you instructions, they are ______ you something.", "options": ["informed", "known", "told", "abreast"], "correct_answer": "told", "explanation": "To be 'told' something means to receive information verbally."}, {"question": "To stay ______ of the latest trends, you need to read industry publications regularly.", "options": ["informed", "known", "told", "abreast"], "correct_answer": "abreast", "explanation": "Staying 'abreast' means staying up-to-date with the latest news or information."}]}, {"id": 2, "stem": "She accepted the expensive birthday gift ______ from her uncle.", "correct_index": 1, "options": [{"word": "greedily", "ipa": "/\u02c8\u0261ri\u02d0d\u026ali/", "meanings": {"en": "In an excessively eager or rapacious manner.", "cn": "\u4ee5\u4e00\u79cd\u8fc7\u5ea6\u6e34\u671b\u6216\u8d2a\u5a6a\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes actions motivated by excessive desire.", "usage_cn": "\u63cf\u8ff0\u7531\u8fc7\u5ea6\u6b32\u671b\u9a71\u52a8\u7684\u884c\u4e3a\u3002", "scene_en": "A person grabbing food from a buffet, ignoring others.", "scene_cn": "\u4e00\u4e2a\u4eba\u4ece\u81ea\u52a9\u9910\u4e2d\u62a2\u98df\u7269\uff0c\u65e0\u89c6\u4ed6\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q2_greedily_1.png", "P6_vocabulary_exercises_20_Q2_greedily_2.png"], "examples": [{"en": "The child greedily devoured the candy, not sharing any with his friends.", "cn": "\u90a3\u4e2a\u5b69\u5b50\u8d2a\u5a6a\u5730\u541e\u566c\u7740\u7cd6\u679c\uff0c\u6ca1\u6709\u548c\u4ed6\u7684\u670b\u53cb\u4eec\u5206\u4eab\u3002"}, {"en": "He greedily accepted the promotion, eager for the increased power and salary.", "cn": "\u4ed6\u8d2a\u5a6a\u5730\u63a5\u53d7\u4e86\u664b\u5347\uff0c\u6e34\u671b\u589e\u52a0\u7684\u6743\u529b\u548c\u85aa\u6c34\u3002"}]}, {"word": "gratefully", "ipa": "/\u02c8\u0261re\u026atf\u0259li/", "meanings": {"en": "In a thankful manner; with gratitude.", "cn": "\u4ee5\u4e00\u79cd\u611f\u6fc0\u7684\u65b9\u5f0f\uff1b\u6000\u7740\u611f\u6fc0\u4e4b\u60c5\u3002"}, "usage_en": "Expressing or feeling gratitude.", "usage_cn": "\u8868\u8fbe\u6216\u611f\u53d7\u5230\u611f\u6fc0\u4e4b\u60c5\u3002", "scene_en": "A person receiving a gift and smiling sincerely.", "scene_cn": "\u4e00\u4e2a\u4eba\u6536\u5230\u793c\u7269\u5e76\u771f\u8bda\u5730\u5fae\u7b11\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q2_gratefully_1.png", "P6_vocabulary_exercises_20_Q2_gratefully_2.png"], "examples": [{"en": "She gratefully accepted the scholarship, knowing it would help her pursue her dreams.", "cn": "\u5979\u611f\u6fc0\u5730\u63a5\u53d7\u4e86\u5956\u5b66\u91d1\uff0c\u77e5\u9053\u8fd9\u4f1a\u5e2e\u52a9\u5979\u8ffd\u6c42\u68a6\u60f3\u3002"}, {"en": "He gratefully acknowledged the applause after his performance, bowing deeply to the audience.", "cn": "\u4ed6\u5728\u6f14\u51fa\u540e\u611f\u6fc0\u5730\u63a5\u53d7\u4e86\u638c\u58f0\uff0c\u5411\u89c2\u4f17\u6df1\u6df1\u97a0\u8eac\u3002"}]}, {"word": "gradually", "ipa": "/\u02c8\u0261r\u00e6d\u0292u\u0259li/", "meanings": {"en": "In a gradual way; slowly; by degrees.", "cn": "\u4ee5\u4e00\u79cd\u6e10\u8fdb\u7684\u65b9\u5f0f\uff1b\u7f13\u6162\u5730\uff1b\u9010\u6e10\u5730\u3002"}, "usage_en": "Describes a process happening over time.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u968f\u7740\u65f6\u95f4\u63a8\u79fb\u53d1\u751f\u7684\u8fc7\u7a0b\u3002", "scene_en": "A plant slowly growing from a seed.", "scene_cn": "\u4e00\u682a\u690d\u7269\u4ece\u79cd\u5b50\u4e2d\u6162\u6162\u751f\u957f\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q2_gradually_1.png", "P6_vocabulary_exercises_20_Q2_gradually_2.png"], "examples": [{"en": "The pain in her leg gradually subsided after she took the medication prescribed by the doctor.", "cn": "\u5728\u5979\u670d\u7528\u533b\u751f\u5f00\u7684\u836f\u540e\uff0c\u5979\u817f\u4e0a\u7684\u75bc\u75db\u9010\u6e10\u6d88\u9000\u4e86\u3002"}, {"en": "He gradually usly?", "options": ["greedily", "gratefully", "gradually", "grievously"], "correct_answer": "greedily", "explanation": "Acting 'greedily' means wanting more than one's fair share, while 'grievously' means causing sorrow."}, {"question": "Does a plant grow ______ or gratefully towards the sun?", "options": ["greedily", "gratefully", "gradually", "grievously"], "correct_answer": "gradually", "explanation": "Plants grow 'gradually' over time, while 'gratefully' implies a feeling of thankfulness."}, {"question": "If you lose a loved one, do you feel ______ or greedily?", "options": ["greedily", "gratefully", "gradually", "grievously"], "correct_answer": "grievously", "explanation": "Feeling 'grievously' means experiencing deep sorrow, while 'greedily' means wanting more."}]}, {"id": 3, "stem": "Where rainfall is ______, crops do not grow well.", "correct_index": 2, "options": [{"word": "scare", "ipa": "/sk\u025br/", "meanings": {"en": "To cause great fear or nervousness in (a person or animal).", "cn": "\u4f7f\uff08\u4eba\u6216\u52a8\u7269\uff09\u611f\u5230\u6781\u5927\u7684\u6050\u60e7\u6216\u7d27\u5f20\u3002"}, "usage_en": "Used to describe the act of frightening someone or something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u60ca\u5413\u67d0\u4eba\u6216\u67d0\u7269\u7684\u884c\u4e3a\u3002", "scene_en": "A person jumping out from behind a door to frighten someone.", "scene_cn": "\u4e00\u4e2a\u4eba\u4ece\u95e8\u540e\u8df3\u51fa\u6765\u5413\u552c\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q3_scare_1.png", "P6_vocabulary_exercises_20_Q3_scare_2.png"], "examples": [{"en": "Sudden loud noises can scare easily startled animals, causing them to flee quickly.", "cn": "\u7a81\u7136\u7684\u5de8\u54cd\u4f1a\u5413\u5230\u5bb9\u6613\u53d7\u60ca\u7684\u52a8\u7269\uff0c\u5bfc\u81f4\u5b83\u4eec\u8fc5\u901f\u9003\u79bb\u3002"}, {"en": "He didn't mean to scare her; he just wanted to surprise her with flowers.", "cn": "\u4ed6\u4e0d\u662f\u6545\u610f\u8981\u5413\u5979\uff1b\u4ed6\u53ea\u662f\u60f3\u7528\u9c9c\u82b1\u7ed9\u5979\u4e00\u4e2a\u60ca\u559c\u3002"}]}, {"word": "scattered", "ipa": "/\u02c8sk\u00e6t\u0259rd/", "meanings": {"en": "Distributed or spread over a wide area in an irregular way.", "cn": "\u4ee5\u4e0d\u89c4\u5219\u7684\u65b9\u5f0f\u5206\u5e03\u6216\u6563\u5e03\u5728\u5e7f\u9614\u7684\u533a\u57df\u3002"}, "usage_en": "Describes items or people spread out randomly.", "usage_cn": "\u63cf\u8ff0\u968f\u673a\u6563\u5e03\u7684\u7269\u54c1\u6216\u4eba\u3002", "scene_en": "Leaves scattered across a lawn after a storm.", "scene_cn": "\u66b4\u98ce\u96e8\u8fc7\u540e\uff0c\u6811\u53f6\u6563\u843d\u5728\u8349\u576a\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q3_scattered_1.png", "P6_vocabulary_exercises_20_Q3_scattered_2.png"], "examples": [{"en": "The protesters were scattered by the police using tear gas and water cannons.", "cn": "\u6297\u8bae\u8005\u88ab\u8b66\u5bdf\u7528\u50ac\u6cea\u74e6\u65af\u548c\u6c34\u70ae\u9a71\u6563\u4e86\u3002"}, {"en": "Her family's ashes were scattered at sea, fulfilling her lifelong wish to return.", "cn": "\u5979\u5bb6\u4eba\u7684\u9aa8\u7070\u88ab\u6492\u5728\u6d77\u4e0a\uff0c\u5b9e\u73b0\u4e86\u5979\u7ec8\u751f\u60f3\u8981\u56de\u5f52\u7684\u613f\u671b\u3002"}]}, {"word": "scarce", "ipa": "/skers/", "meanings": {"en": "Insufficient for the demand; in short supply.", "cn": "\u4e0d\u8db3\u4ee5\u6ee1\u8db3\u9700\u6c42\uff1b\u4f9b\u5e94\u77ed\u7f3a\u3002"}, "usage_en": "Used to describe something that is limited or rare.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6709\u9650\u6216\u7a00\u6709\u7684\u4e8b\u7269\u3002", "scene_en": "A desert landscape where water is scarce.", "scene_cn": "\u4e00\u4e2a\u6c34\u8d44\u6e90\u7a00\u7f3a\u7684\u6c99\u6f20\u666f\u89c2\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q3_scarce_1.png", "P6_vocabulary_exercises_20_Q3_scarce_2.png"], "examples": [{"en": "During the drought, water became so scarce that residents had to ration their usage.", "cn": "\u5728\u5e72\u65f1\u671f\u95f4\uff0c\u6c34\u53d8\u5f97\u975e\u5e38\u7a00\u7f3a\uff0c\u5c45\u6c11\u4e0d\u5f97\u4e0d\u5b9a\u91cf\u4f7f\u7528\u3002"}, {"en": "Job opportunities are scarce in small towns, forcing many young people to move to cities.", "cn": "\u5c0f\u57ce\u9547\u7684\u5c31\u4e1a\u673a\u4f1a\u5f88\u5c11\uff0c\u8feb\u4f7f\u8bb8\u591a\u5e74\u8f7b\u4eba\u642c\u5230\u57ce\u5e02\u3002"}]}, {"word": "sacred", "ipa": "/\u02c8se\u026akr\u026ad/", "meanings": {"en": "Regarded with great respect and reverence by a particular religion, group, or individual.", "cn": "\u88ab\u7279\u5b9a\u5b97\u6559\u3001\u7fa4\u4f53\u6216\u4e2a\u4eba\u89c6\u4e3a\u975e\u5e38\u5c0a\u91cd\u548c\u656c\u754f\u7684\u3002"}, "usage_en": "Describes something holy or highly valued.", "usage_cn": "\u63cf\u8ff0\u795e\u5723\u6216\u9ad8\u5ea6\u91cd\u89c6\u7684\u4e8b\u7269\u3002", "scene_en": "A sacred temple or religious site.", "scene_cn": "\u4e00\u5ea7\u795e\u5723\u7684\u5bfa\u5e99\u6216\u5b97\u6559\u573a\u6240\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q3_sacred_1.png", "P6_vocabulary_exercises_20_Q3_sacred_2.png"], "examples": [{"en": "The ancient burial ground was considered sacred by the indigenous people of the region.", "cn": "\u8fd9\u7247\u53e4\u8001\u7684\u5893\u5730\u88ab\u8be5\u5730\u533a\u7684\u571f\u8457\u5c45\u6c11\u8ba4\u4e3a\u662f\u795e\u5723\u7684\u3002"}, {"en": "For many, the bond between parent and child is a sacred and unbreakable connection.", "cn": "\u5bf9\u8bb8\u591a\u4eba\u6765\u8bf4\uff0c\u7236\u6bcd\u548c\u5b69\u5b50\u4e4b\u95f4\u7684\u7ebd\u5e26\u662f\u795e\u5723\u4e14\u7262\u4e0d\u53ef\u7834\u7684\u8054\u7cfb\u3002"}]}], "synonym_cn": "\u7f3a\u4e4f, \u4e0d\u8db3", "socratic_questions": [{"question": "In a region known for abundant water sources, which of these words is least likely to describe the rainfall?", "options": ["scare", "scattered", "scarce", "sacred"], "correct_answer": "scarce", "explanation": "Scarce means limited or insufficient, which is the opposite of abundant."}, {"question": "If ancient texts are considered holy and inviolable, which term best describes their status?", "options": ["scare", "scattered", "scarce", "sacred"], "correct_answer": "sacred", "explanation": "Sacred means regarded with great respect and reverence by a particular religion, group, or individual."}, {"question": "Imagine you're trying to gather a flock of birds that have flown in different directions. Which word describes their arrangement?", "options": ["scare", "scattered", "scarce", "sacred"], "correct_answer": "scattered", "explanation": "Scattered means distributed or spread over a wide area in an irregular way."}, {"question": "If you want to frighten away crows from a field, which action would you take?", "options": ["scare", "scattered", "scarce", "sacred"], "correct_answer": "scare", "explanation": "Scare means to cause great fear or nervousness in (a person or animal)."}]}, {"id": 4, "stem": "The spy refused to ______ the secrets of their plan", "correct_index": 3, "options": [{"word": "dilute", "ipa": "/da\u026a\u02c8lu\u02d0t/", "meanings": {"en": "To make (a liquid) thinner or weaker by adding water or another solvent to it.", "cn": "\u901a\u8fc7\u52a0\u6c34\u6216\u5176\u4ed6\u6eb6\u5242\u4f7f\uff08\u6db2\u4f53\uff09\u53d8\u7a00\u6216\u53d8\u5f31\u3002"}, "usage_en": "Often used in chemistry, cooking, or when discussing the strength of a solution.", "usage_cn": "\u5e38\u7528\u4e8e\u5316\u5b66\u3001\u70f9\u996a\u6216\u8ba8\u8bba\u6eb6\u6db2\u7684\u6d53\u5ea6\u65f6\u3002", "scene_en": "A chemist carefully adding water to a concentrated acid to reduce its strength.", "scene_cn": "\u4e00\u4f4d\u5316\u5b66\u5bb6\u5c0f\u5fc3\u5730\u5411\u6d53\u9178\u4e2d\u52a0\u6c34\u4ee5\u964d\u4f4e\u5176\u6d53\u5ea6\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q4_dilute_1.png", "P6_vocabulary_exercises_20_Q4_dilute_2.png"], "examples": [{"en": "She tried to dilute the strong juice with water, but it was still potent.", "cn": "\u5979\u8bd5\u56fe\u7528\u6c34\u7a00\u91ca\u6d53\u679c\u6c41\uff0c\u4f46\u5b83\u4ecd\u7136\u5f88\u6d53\u3002"}, {"en": "The company's profits were diluted by the increased costs of raw materials recently.", "cn": "\u7531\u4e8e\u539f\u6750\u6599\u6210\u672c\u7684\u589e\u52a0\uff0c\u516c\u53f8\u7684\u5229\u6da6\u88ab\u7a00\u91ca\u4e86\u3002"}]}, {"word": "discrete", "ipa": "/d\u026a\u02c8skri\u02d0t/", "meanings": {"en": "Intentionally unobtrusive; separate and distinct.", "cn": "\u6709\u610f\u5730\u4e0d\u5f15\u4eba\u6ce8\u76ee; \u5206\u79bb\u4e14\u622a\u7136\u4e0d\u540c\u3002"}, "usage_en": "Used to describe actions or behaviors that are subtle and avoid drawing attention.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5fae\u5999\u4e14\u907f\u514d\u5f15\u8d77\u6ce8\u610f\u7684\u884c\u4e3a\u6216\u4e3e\u6b62\u3002", "scene_en": "A person quietly slipping out of a meeting to avoid being noticed.", "scene_cn": "\u4e00\u4e2a\u4eba\u6084\u6084\u5730\u6e9c\u51fa\u4f1a\u573a\u4ee5\u907f\u514d\u88ab\u6ce8\u610f\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q4_discrete_1.png", "P6_vocabulary_exercises_20_Q4_discrete_2.png"], "examples": [{"en": "He made discrete inquiries about her background without revealing his intentions clearly.", "cn": "\u4ed6\u8c28\u614e\u5730\u8be2\u95ee\u4e86\u5979\u7684\u80cc\u666f\uff0c\u6ca1\u6709\u660e\u786e\u900f\u9732\u81ea\u5df1\u7684\u610f\u56fe\u3002"}, {"en": "The restaurant offered discrete dining areas for private conversations and business meetings.", "cn": "\u8fd9\u5bb6\u9910\u5385\u63d0\u4f9b\u72ec\u7acb\u7684\u7528\u9910\u533a\uff0c\u4f9b\u79c1\u4eba\u8c08\u8bdd\u548c\u5546\u52a1\u4f1a\u8bae\u4f7f\u7528\u3002"}]}, {"word": "diagnose", "ipa": "/\u02c8da\u026a\u0259\u0261no\u028az/", "meanings": {"en": "Identify the nature of an illness or other problem by examination of the symptoms.", "cn": "\u901a\u8fc7\u68c0\u67e5\u75c7\u72b6\u6765\u786e\u5b9a\u75be\u75c5\u6216\u5176\u4ed6\u95ee\u9898\u7684\u6027\u8d28\u3002"}, "usage_en": "Commonly used in medical contexts, but can also apply to identifying problems in systems.", "usage_cn": "\u901a\u5e38\u7528\u4e8e\u533b\u7597\u80cc\u666f\uff0c\u4f46\u4e5f\u9002\u7528\u4e8e\u8bc6\u522b\u7cfb\u7edf\u4e2d\u7684\u95ee\u9898\u3002", "scene_en": "A doctor examining a patient and reviewing test results to determine the illness.", "scene_cn": "\u533b\u751f\u68c0\u67e5\u75c5\u4eba\u5e76\u67e5\u770b\u6d4b\u8bd5\u7ed3\u679c\u4ee5\u786e\u5b9a\u75be\u75c5\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q4_diagnose_1.png", "P6_vocabulary_exercises_20_Q4_diagnose_2.png"], "examples": [{"en": "The doctor was able to diagnose the rare disease after running several complex tests.", "cn": "\u533b\u751f\u5728\u8fdb\u884c\u51e0\u9879\u590d\u6742\u7684\u6d4b\u8bd5\u540e\uff0c\u80fd\u591f\u8bca\u65ad\u51fa\u8fd9\u79cd\u7f55\u89c1\u75be\u75c5\u3002"}, {"en": "The mechanic diagnosed the car's problem as a faulty sensor and replaced it quickly.", "cn": "\u673a\u68b0\u5e08\u5c06\u6c7d\u8f66\u7684\u95ee\u9898\u8bca\u65ad\u4e3a\u4f20\u611f\u5668\u6545\u969c\uff0c\u5e76\u8fc5\u901f\u66f4\u6362\u4e86\u5b83\u3002"}]}, {"word": "divulge", "ipa": "/da\u026a\u02c8v\u028cld\u0292/", "meanings": {"en": "Make known (private or sensitive information).", "cn": "\u6cc4\u9732\uff08\u79c1\u4eba\u6216\u654f\u611f\u4fe1\u606f\uff09\u3002"}, "usage_en": "Often used in contexts involving secrets, confidential information, or sensitive data.", "usage_cn": "\u5e38\u7528\u4e8e\u6d89\u53ca\u79d8\u5bc6\u3001\u673a\u5bc6\u4fe1\u606f\u6216\u654f\u611f\u6570\u636e\u7684\u8bed\u5883\u3002", "scene_en": "A journalist trying to get a politician to reveal a secret during an interview.", "scene_cn": "\u8bb0\u8005\u8bd5\u56fe\u8ba9\u653f\u6cbb\u5bb6\u5728\u91c7\u8bbf\u4e2d\u900f\u9732\u4e00\u4e2a\u79d8\u5bc6\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q4_divulge_1.png", "P6_vocabulary_exercises_20_Q4_divulge_2.png"], "examples": [{"en": "The company director refused to divulge any details about the upcoming merger agreement.", "cn": "\u516c\u53f8\u8463\u4e8b\u62d2\u7edd\u900f\u9732\u6709\u5173\u5373\u5c06\u5230\u6765\u7684\u5408\u5e76\u534f\u8bae\u7684\u4efb\u4f55\u7ec6\u8282\u3002"}, {"en": "Under pressure, the witness divulged the location of the hidden evidence to the police.", "cn": "\u5728\u538b\u529b\u4e0b\uff0c\u8bc1\u4eba\u5411\u8b66\u65b9\u900f\u9732\u4e86\u9690\u85cf\u8bc1\u636e\u7684\u4f4d\u7f6e\u3002"}]}], "synonym_cn": "\u63ed\u9732, \u6cc4\u9732, \u900f\u9732", "socratic_questions": [{"question": "If you need to make a solution weaker by adding water, would you ______ it?", "options": ["dilute", "discrete", "diagnose", "divulge"], "correct_answer": "dilute", "explanation": "Dilute means to make a substance thinner or weaker by adding water or another solvent to it."}, {"question": "When handling sensitive information, should your actions be ______ or public?", "options": ["dilute", "discrete", "diagnose", "divulge"], "correct_answer": "discrete", "explanation": "Discrete means intentionally unobtrusive; separate and distinct."}, {"question": "If a doctor needs to identify the cause of a patient's illness, they will ______ it.", "options": ["dilute", "discrete", "diagnose", "divulge"], "correct_answer": "diagnose", "explanation": "Diagnose means to identify the nature of an illness or other problem by examination."}, {"question": "If you are asked to keep a secret, would you ______ it to others?", "options": ["dilute", "discrete", "diagnose", "divulge"], "correct_answer": "divulge", "explanation": "Divulge means to make known (private or sensitive information)."}]}, {"id": 5, "stem": "Most streets in this small town are narrow and ______.", "correct_index": 2, "options": [{"word": "stretching", "ipa": "/\u02c8stret\u0283\u026a\u014b/", "meanings": {"en": "Extending or capable of being extended in length, area, or duration.", "cn": "\u5728\u957f\u5ea6\u3001\u9762\u79ef\u6216\u6301\u7eed\u65f6\u95f4\u4e0a\u5ef6\u4f38\u6216\u80fd\u591f\u5ef6\u4f38\u3002"}, "usage_en": "Used to describe something that is long or extends over a large area.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u957f\u6216\u5ef6\u4f38\u5230\u5927\u9762\u79ef\u7684\u4e1c\u897f\u3002", "scene_en": "A long, flat desert landscape under a scorching sun, with the horizon appearing to stretch endlessly.", "scene_cn": "\u5728\u708e\u70ed\u7684\u9633\u5149\u4e0b\uff0c\u4e00\u7247\u957f\u800c\u5e73\u5766\u7684\u6c99\u6f20\u666f\u89c2\uff0c\u5730\u5e73\u7ebf\u4f3c\u4e4e\u65e0\u6b62\u5883\u5730\u5ef6\u4f38\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q5_stretching_1.png", "P6_vocabulary_exercises_20_Q5_stretching_2.png"], "examples": [{"en": "The sandy beach was stretching far into the distance, meeting the clear blue sea.", "cn": "\u6c99\u6ee9\u4e00\u76f4\u5ef6\u4f38\u5230\u8fdc\u5904\uff0c\u4e0e\u6e05\u6f88\u7684\u84dd\u8272\u5927\u6d77\u76f8\u63a5\u3002"}, {"en": "The company is stretching its resources thin to cover all the new projects.", "cn": "\u516c\u53f8\u6b63\u5728\u8fc7\u5ea6\u4f7f\u7528\u5176\u8d44\u6e90\u6765\u8986\u76d6\u6240\u6709\u65b0\u9879\u76ee\u3002"}]}, {"word": "extending", "ipa": "/\u026ak\u02c8stend\u026a\u014b/", "meanings": {"en": "Reaching out or continuing in a certain direction or over a particular distance.", "cn": "\u671d\u67d0\u4e2a\u65b9\u5411\u5ef6\u4f38\u6216\u5728\u7279\u5b9a\u8ddd\u79bb\u4e0a\u5ef6\u4f38\u6216\u7ee7\u7eed\u3002"}, "usage_en": "Describes something that reaches out or continues in a specific direction.", "usage_cn": "\u63cf\u8ff0\u671d\u7279\u5b9a\u65b9\u5411\u5ef6\u4f38\u6216\u7ee7\u7eed\u7684\u4e8b\u7269\u3002", "scene_en": "A bridge stretching across a wide river, connecting two distant shores.", "scene_cn": "\u4e00\u5ea7\u6865\u6a2a\u8de8\u4e00\u6761\u5bbd\u9614\u7684\u6cb3\u6d41\uff0c\u8fde\u63a5\u7740\u9065\u8fdc\u7684\u4e24\u5cb8\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q5_extending_1.png", "P6_vocabulary_exercises_20_Q5_extending_2.png"], "examples": [{"en": "The railway line is extending to the new industrial zone outside of the city.", "cn": "\u94c1\u8def\u7ebf\u6b63\u5728\u5ef6\u4f38\u5230\u57ce\u5e02\u5916\u9762\u7684\u65b0\u5de5\u4e1a\u533a\u3002"}, {"en": "The offer is extending until the end of the week, giving everyone a chance.", "cn": "\u8be5\u4f18\u60e0\u5c06\u5ef6\u957f\u81f3\u672c\u5468\u672b\uff0c\u8ba9\u6bcf\u4e2a\u4eba\u90fd\u6709\u673a\u4f1a\u3002"}]}, {"word": "winding", "ipa": "/\u02c8wa\u026and\u026a\u014b/", "meanings": {"en": "Following a course that is not straight; having many curves and bends.", "cn": "\u9075\u5faa\u4e0d\u76f4\u7684\u8def\u7ebf\uff1b\u6709\u8bb8\u591a\u66f2\u7ebf\u548c\u5f2f\u9053\u3002"}, "usage_en": "Used to describe something that has many curves or bends, not straight.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6709\u8bb8\u591a\u66f2\u7ebf\u6216\u5f2f\u66f2\uff0c\u4e0d\u76f4\u7684\u4e1c\u897f\u3002", "scene_en": "A narrow, winding road through a dense forest, with sunlight filtering through the trees.", "scene_cn": "\u4e00\u6761\u72ed\u7a84\u3001\u873f\u8712\u7684\u9053\u8def\u7a7f\u8fc7\u8302\u5bc6\u7684\u68ee\u6797\uff0c\u9633\u5149\u7a7f\u8fc7\u6811\u6728\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q5_winding_1.png", "P6_vocabulary_exercises_20_Q5_winding_2.png"], "examples": [{"en": "We drove along a winding mountain road with breathtaking views at every turn.", "cn": "\u6211\u4eec\u6cbf\u7740\u873f\u8712\u7684\u5c71\u8def\u884c\u9a76\uff0c\u6bcf\u4e2a\u8f6c\u5f2f\u5904\u90fd\u6709\u4ee4\u4eba\u53f9\u4e3a\u89c2\u6b62\u7684\u666f\u8272\u3002"}, {"en": "The old river follows a winding path through the valley before reaching the sea.", "cn": "\u8fd9\u6761\u53e4\u8001\u7684\u6cb3\u6d41\u6cbf\u7740\u873f\u8712\u7684\u8def\u5f84\u7a7f\u8fc7\u5c71\u8c37\uff0c\u7136\u540e\u5230\u8fbe\u5927\u6d77\u3002"}]}, {"word": "continuing", "ipa": "/k\u0259n\u02c8t\u026anju\u02d0\u026a\u014b/", "meanings": {"en": "Extending without interruption; ongoing.", "cn": "\u4e0d\u95f4\u65ad\u5730\u5ef6\u4f38\uff1b\u6301\u7eed\u7684\u3002"}, "usage_en": "Describes something that is ongoing or extends without stopping.", "usage_cn": "\u63cf\u8ff0\u6b63\u5728\u8fdb\u884c\u6216\u5ef6\u4f38\u800c\u4e0d\u505c\u6b62\u7684\u4e8b\u7269\u3002", "scene_en": "A marathon runner continuing the race despite fatigue, showing determination and perseverance.", "scene_cn": "\u4e00\u540d\u9a6c\u62c9\u677e\u8fd0\u52a8\u5458\u4e0d\u987e\u75b2\u52b3\u7ee7\u7eed\u6bd4\u8d5b\uff0c\u8868\u73b0\u51fa\u51b3\u5fc3\u548c\u6bc5\u529b\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q5_continuing_1.png", "P6_vocabulary_exercises_20_Q5_continuing_2.png"], "examples": [{"en": "The rain is continuing to fall heavily, causing floods in the low-lying areas.", "cn": "\u96e8\u8fd8\u5728\u4e0d\u505c\u5730\u4e0b\u7740\uff0c\u5bfc\u81f4\u4f4e\u6d3c\u5730\u533a\u53d1\u751f\u6d2a\u6c34\u3002"}, {"en": "Despite the challenges, the project is continuing on schedule, thanks to the team's efforts.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u6311\u6218\uff0c\u4f46\u7531\u4e8e\u56e2\u961f\u7684\u52aa\u529b\uff0c\u8be5\u9879\u76ee\u4ecd\u5728\u6309\u8ba1\u5212\u8fdb\u884c\u3002"}]}], "synonym_cn": "\u5f2f\u66f2\u7684\uff0c\u873f\u8712\u7684", "socratic_questions": [{"question": "If a river continues in a straight line for miles, is it best described as which of the following?", "options": ["stretching", "extending", "winding", "continuing"], "correct_answer": "continuing", "explanation": "Continuing implies an uninterrupted path, unlike a river with curves."}, {"question": "Which word best describes a road that goes on for a great distance, seemingly without end?", "options": ["stretching", "extending", "winding", "continuing"], "correct_answer": "stretching", "explanation": "Stretching suggests a long, unbroken expanse."}, {"question": "If a company opens new branches in different cities, is it best described as which of the following?", "options": ["stretching", "extending", "winding", "continuing"], "correct_answer": "extending", "explanation": "Extending implies increasing the area or scope of something."}, {"question": "Which word best describes a path that has many turns and curves?", "options": ["stretching", "extending", "winding", "continuing"], "correct_answer": "winding", "explanation": "Winding describes a path with curves and turns."}]}, {"id": 6, "stem": "I am indeed ______ to him for all that he has done for my family.", "correct_index": 1, "options": [{"word": "owed", "ipa": "/o\u028ad/", "meanings": {"en": "Having an obligation to pay or repay something in return for something received.", "cn": "\u6709\u4e49\u52a1\u652f\u4ed8\u6216\u507f\u8fd8\u56e0\u6536\u5230\u67d0\u7269\u800c\u6b20\u4e0b\u7684\u4e1c\u897f\u3002"}, "usage_en": "Used to express a debt or obligation, usually financial.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u503a\u52a1\u6216\u4e49\u52a1\uff0c\u901a\u5e38\u662f\u8d22\u52a1\u4e0a\u7684\u3002", "scene_en": "A person looking at a bill, feeling the pressure to pay it off.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u7740\u8d26\u5355\uff0c\u611f\u5230\u507f\u8fd8\u7684\u538b\u529b\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q6_owed_1.png", "P6_vocabulary_exercises_20_Q6_owed_2.png"], "examples": [{"en": "He owed the bank a large sum of money for his mortgage loan.", "cn": "\u4ed6\u56e0\u62b5\u62bc\u8d37\u6b3e\u800c\u6b20\u94f6\u884c\u4e00\u5927\u7b14\u94b1\u3002"}, {"en": "She owed her friend twenty dollars for the movie tickets last weekend.", "cn": "\u5979\u6b20\u5979\u7684\u670b\u53cb\u4e8c\u5341\u7f8e\u5143\uff0c\u90a3\u662f\u4e0a\u5468\u672b\u7684\u7535\u5f71\u7968\u94b1\u3002"}]}, {"word": "indebted", "ipa": "/\u026an\u02c8d\u025bt\u026ad/", "meanings": {"en": "Feeling grateful and obligated to repay someone for a kindness or service.", "cn": "\u56e0\u4ed6\u4eba\u7684\u5584\u610f\u6216\u670d\u52a1\u800c\u611f\u5230\u611f\u6fc0\u5e76\u6709\u4e49\u52a1\u56de\u62a5\u3002"}, "usage_en": "Used to express gratitude and a sense of obligation.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u611f\u6fc0\u4e4b\u60c5\u548c\u4e49\u52a1\u611f\u3002", "scene_en": "A person receiving a heartfelt gift and feeling deeply grateful.", "scene_cn": "\u4e00\u4e2a\u4eba\u6536\u5230\u4e00\u4efd\u8877\u5fc3\u7684\u793c\u7269\uff0c\u611f\u5230\u975e\u5e38\u611f\u6fc0\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q6_indebted_1.png", "P6_vocabulary_exercises_20_Q6_indebted_2.png"], "examples": [{"en": "I am deeply indebted to my mentor for his guidance and support.", "cn": "\u6211\u975e\u5e38\u611f\u8c22\u6211\u7684\u5bfc\u5e08\u7684\u6307\u5bfc\u548c\u652f\u6301\u3002"}, {"en": "We are indebted to the volunteers who helped clean up the community park.", "cn": "\u6211\u4eec\u611f\u8c22\u5e2e\u52a9\u6e05\u7406\u793e\u533a\u516c\u56ed\u7684\u5fd7\u613f\u8005\u3002"}]}, {"word": "debited", "ipa": "/\u02c8d\u025bb\u026at\u026ad/", "meanings": {"en": "Recorded as a deduction from an account.", "cn": "\u8bb0\u5f55\u4e3a\u4ece\u8d26\u6237\u4e2d\u6263\u9664\u7684\u6b3e\u9879\u3002"}, "usage_en": "Used in accounting to indicate a decrease in an account balance.", "usage_cn": "\u5728\u4f1a\u8ba1\u4e2d\u7528\u4e8e\u8868\u793a\u8d26\u6237\u4f59\u989d\u7684\u51cf\u5c11\u3002", "scene_en": "A bank statement showing a deduction from a checking account.", "scene_cn": "\u94f6\u884c\u5bf9\u8d26\u5355\u663e\u793a\u4ece\u652f\u7968\u8d26\u6237\u4e2d\u6263\u9664\u4e86\u4e00\u7b14\u6b3e\u9879\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q6_debited_1.png", "P6_vocabulary_exercises_20_Q6_debited_2.png"], "examples": [{"en": "My account was debited for the monthly subscription fee automatically this morning.", "cn": "\u4eca\u5929\u65e9\u4e0a\uff0c\u6211\u7684\u8d26\u6237\u81ea\u52a8\u6263\u9664\u4e86\u6bcf\u6708\u7684\u8ba2\u9605\u8d39\u3002"}, {"en": "The bank debited my account after I used my debit card at the store.", "cn": "\u6211\u5728\u5546\u5e97\u4f7f\u7528\u501f\u8bb0\u5361\u540e\uff0c\u94f6\u884c\u4ece\u6211\u7684\u8d26\u6237\u4e2d\u6263\u6b3e\u3002"}]}, {"word": "credited", "ipa": "/\u02c8kr\u025bd\u026at\u026ad/", "meanings": {"en": "Recorded as an addition to an account.", "cn": "\u8bb0\u5f55\u4e3a\u6dfb\u52a0\u5230\u8d26\u6237\u4e2d\u7684\u6b3e\u9879\u3002"}, "usage_en": "Used in accounting to indicate an increase in an account balance.", "usage_cn": "\u5728\u4f1a\u8ba1\u4e2d\u7528\u4e8e\u8868\u793a\u8d26\u6237\u4f59\u989d\u7684\u589e\u52a0\u3002", "scene_en": "A bank statement showing a deposit into a savings account.", "scene_cn": "\u94f6\u884c\u5bf9\u8d26\u5355\u663e\u793a\u5b58\u6b3e\u5230\u50a8\u84c4\u8d26\u6237\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q6_credited_1.png", "P6_vocabulary_exercises_20_Q6_credited_2.png"], "examples": [{"en": "My account was credited with the interest earned over the past month.", "cn": "\u6211\u7684\u8d26\u6237\u88ab\u8bb0\u5165\u4e86\u8fc7\u53bb\u4e00\u4e2a\u6708\u8d5a\u53d6\u7684\u5229\u606f\u3002"}, {"en": "The company credited my account after I returned the defective product yesterday.", "cn": "\u6628\u5929\u6211\u9000\u56de\u6709\u7f3a\u9677\u7684\u4ea7\u54c1\u540e\uff0c\u516c\u53f8\u5c06\u6b3e\u9879\u8bb0\u5165\u6211\u7684\u8d26\u6237\u3002"}]}], "synonym_cn": "\u611f\u6fc0\u7684\uff0c\u8d1f\u503a\u7684", "socratic_questions": [{"question": "Imagine you accidentally damaged a friend's expensive camera. Which word describes your feeling of responsibility?", "options": ["owed", "indebted", "debited", "credited"], "correct_answer": "indebted", "explanation": "Indebted implies a feeling of gratitude and obligation for a favor or kindness received."}, {"question": "If you borrowed money from a bank, which term best describes your financial state regarding the bank?", "options": ["owed", "indebted", "debited", "credited"], "correct_answer": "owed", "explanation": "Owed means having a duty to pay back something, usually money."}, {"question": "In accounting, if money is taken out of an account, is the account 'owed', 'indebted', 'debited', or 'credited'?", "options": ["owed", "indebted", "debited", "credited"], "correct_answer": "debited", "explanation": "Debited means an amount has been recorded as a deduction from an account."}, {"question": "When money is added to your bank account, is your account 'owed', 'indebted', 'debited', or 'credited'?", "options": ["owed", "indebted", "debited", "credited"], "correct_answer": "credited", "explanation": "Credited means an amount has been added to an account."}]}, {"id": 8, "stem": "Our ______ president is serving his last year in office before he retires.", "correct_index": 0, "options": [{"word": "current", "ipa": "/\u02c8k\u025c\u02d0r\u0259nt/", "meanings": {"en": "Happening or existing now; belonging to the present time.", "cn": "\u73b0\u5728\u53d1\u751f\u6216\u5b58\u5728\u7684\uff1b\u5c5e\u4e8e\u73b0\u5728\u7684\u65f6\u95f4\u3002"}, "usage_en": "Used to describe something that is happening or existing at the present time.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u73b0\u5728\u6b63\u5728\u53d1\u751f\u6216\u5b58\u5728\u7684\u4e8b\u7269\u3002", "scene_en": "A news broadcast showing the current president addressing the nation.", "scene_cn": "\u65b0\u95fb\u5e7f\u64ad\u663e\u793a\u73b0\u4efb\u603b\u7edf\u5411\u5168\u56fd\u53d1\u8868\u8bb2\u8bdd\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q8_current_1.png", "P6_vocabulary_exercises_20_Q8_current_2.png"], "examples": [{"en": "The current economic situation is challenging, but we are working towards improvement.", "cn": "\u5f53\u524d\u7684\u7ecf\u6d4e\u5f62\u52bf\u5145\u6ee1\u6311\u6218\uff0c\u4f46\u6211\u4eec\u6b63\u5728\u52aa\u529b\u6539\u5584\u3002"}, {"en": "Our current project focuses on developing sustainable energy solutions for the future.", "cn": "\u6211\u4eec\u76ee\u524d\u7684\u9879\u76ee\u4fa7\u91cd\u4e8e\u4e3a\u672a\u6765\u5f00\u53d1\u53ef\u6301\u7eed\u7684\u80fd\u6e90\u89e3\u51b3\u65b9\u6848\u3002"}]}, {"word": "past", "ipa": "/p\u00e6st/", "meanings": {"en": "Gone by in time; no longer existing.", "cn": "\u5df2\u901d\u53bb\u7684\uff1b\u4e0d\u518d\u5b58\u5728\u7684\u3002"}, "usage_en": "Refers to a time or events that have already happened.", "usage_cn": "\u6307\u5df2\u7ecf\u53d1\u751f\u7684\u65f6\u95f4\u6216\u4e8b\u4ef6\u3002", "scene_en": "A historian studying ancient artifacts in a museum.", "scene_cn": "\u4e00\u4f4d\u5386\u53f2\u5b66\u5bb6\u5728\u535a\u7269\u9986\u7814\u7a76\u53e4\u4ee3\u6587\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q8_past_1.png", "P6_vocabulary_exercises_20_Q8_past_2.png"], "examples": [{"en": "In the past, people relied more on traditional methods of communication.", "cn": "\u5728\u8fc7\u53bb\uff0c\u4eba\u4eec\u66f4\u4f9d\u8d56\u4f20\u7edf\u7684\u6c9f\u901a\u65b9\u5f0f\u3002"}, {"en": "We can learn valuable lessons from the mistakes and successes of the past.", "cn": "\u6211\u4eec\u53ef\u4ee5\u4ece\u8fc7\u53bb\u7684\u9519\u8bef\u548c\u6210\u529f\u4e2d\u5438\u53d6\u5b9d\u8d35\u7684\u6559\u8bad\u3002"}]}, {"word": "former", "ipa": "/\u02c8f\u0254\u02d0rm\u0259r/", "meanings": {"en": "Having previously filled a particular role or position.", "cn": "\u4ee5\u524d\u62c5\u4efb\u8fc7\u7279\u5b9a\u89d2\u8272\u6216\u804c\u4f4d\u7684\u3002"}, "usage_en": "Used to describe someone who used to hold a position but no longer does.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u66fe\u7ecf\u62c5\u4efb\u67d0\u4e2a\u804c\u4f4d\u4f46\u73b0\u5728\u4e0d\u518d\u62c5\u4efb\u7684\u4eba\u3002", "scene_en": "A photograph of a former president giving a speech at a charity event.", "scene_cn": "\u4e00\u4f4d\u524d\u603b\u7edf\u5728\u6148\u5584\u6d3b\u52a8\u4e0a\u53d1\u8868\u6f14\u8bb2\u7684\u7167\u7247\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q8_former_1.png", "P6_vocabulary_exercises_20_Q8_former_2.png"], "examples": [{"en": "The former CEO of the company is now working as a consultant.", "cn": "\u8fd9\u5bb6\u516c\u53f8\u7684\u524d\u4efb\u9996\u5e2d\u6267\u884c\u5b98\u73b0\u5728\u62c5\u4efb\u987e\u95ee\u3002"}, {"en": "The former champion still enjoys playing tennis in his free time.", "cn": "\u8fd9\u4f4d\u524d\u51a0\u519b\u4ecd\u7136\u559c\u6b22\u5728\u7a7a\u95f2\u65f6\u95f4\u6253\u7f51\u7403\u3002"}]}, {"word": "previous", "ipa": "/\u02c8pri\u02d0vi\u0259s/", "meanings": {"en": "Coming or occurring before in time or order.", "cn": "\u5728\u65f6\u95f4\u6216\u987a\u5e8f\u4e0a\u5148\u6765\u6216\u53d1\u751f\u7684\u3002"}, "usage_en": "Refers to something that happened or existed before the current one.", "usage_cn": "\u6307\u5728\u5f53\u524d\u4e8b\u7269\u4e4b\u524d\u53d1\u751f\u6216\u5b58\u5728\u7684\u4e8b\u7269\u3002", "scene_en": "A student reviewing notes from the previous lecture.", "scene_cn": "\u4e00\u540d\u5b66\u751f\u590d\u4e60\u4e0a\u4e00\u8282\u8bfe\u7684\u7b14\u8bb0\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q8_previous_1.png", "P6_vocabulary_exercises_20_Q8_previous_2.png"], "examples": [{"en": "The previous owner of the house made several renovations to the kitchen.", "cn": "\u8fd9\u6240\u623f\u5b50\u7684\u524d\u4efb\u4e3b\u4eba\u5bf9\u53a8\u623f\u8fdb\u884c\u4e86\u591a\u6b21\u7ffb\u65b0\u3002"}, {"en": "In the previous chapter, we discussed the basic principles of economics.", "cn": "\u5728\u524d\u4e00\u7ae0\u4e2d\uff0c\u6211\u4eec\u8ba8\u8bba\u4e86\u7ecf\u6d4e\u5b66\u7684\u57fa\u672c\u539f\u7406\u3002"}]}], "synonym_cn": "\u5f53\u524d (d\u0101ng qi\u00e1n) vs. \u8fc7\u53bb (gu\u00f2 q\u00f9) vs. \u524d\u4efb (qi\u00e1n r\u00e8n) vs. \u4e4b\u524d\u7684 (zh\u012b qi\u00e1n de)", "socratic_questions": [{"question": "If a leader has just been elected, which term describes their position?", "options": ["current", "past", "former", "previous"], "correct_answer": "current", "explanation": "The 'current' leader is the one presently holding the position."}, {"question": "Which word describes a president who held office before the present one?", "options": ["current", "past", "former", "previous"], "correct_answer": "former", "explanation": "A 'former' president is someone who used to be president but isn't anymore."}, {"question": "Which term best describes a president whose term has ended but is not the most recent?", "options": ["current", "past", "former", "previous"], "correct_answer": "past", "explanation": "'Past' describes something that existed or happened before the present time."}, {"question": "Which word indicates a time leading up to the present presidency, but is less specific?", "options": ["current", "past", "former", "previous"], "correct_answer": "previous", "explanation": "'Previous' refers to something that came before in time or order."}]}, {"id": 9, "stem": "This necklace from my mother will always be my ______ and joy.", "correct_index": 2, "options": [{"word": "pride", "ipa": "/pra\u026ad/", "meanings": {"en": "A feeling of deep pleasure or satisfaction derived from one's own achievements.", "cn": "\u56e0\u81ea\u5df1\u7684\u6210\u5c31\u800c\u4ea7\u751f\u7684\u6df1\u6df1\u7684\u5feb\u4e50\u6216\u6ee1\u8db3\u611f\u3002"}, "usage_en": "Used to express satisfaction with oneself or someone else.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u81ea\u5df1\u6216\u4ed6\u4eba\u7684\u6ee1\u610f\u3002", "scene_en": "A graduation ceremony where students receive their diplomas with proud smiles.", "scene_cn": "\u6bd5\u4e1a\u5178\u793c\u4e0a\uff0c\u5b66\u751f\u4eec\u5e26\u7740\u81ea\u8c6a\u7684\u5fae\u7b11\u9886\u53d6\u6bd5\u4e1a\u8bc1\u4e66\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q9_pride_1.png", "P6_vocabulary_exercises_20_Q9_pride_2.png"], "examples": [{"en": "She felt immense pride watching her daughter graduate at the top of her class.", "cn": "\u5f53\u5979\u770b\u5230\u5973\u513f\u4ee5\u73ed\u7ea7\u7b2c\u4e00\u540d\u7684\u6210\u7ee9\u6bd5\u4e1a\u65f6\uff0c\u5979\u611f\u5230\u65e0\u6bd4\u7684\u81ea\u8c6a\u3002"}, {"en": "The team took great pride in their hard work and dedication to the project.", "cn": "\u56e2\u961f\u5bf9\u4ed6\u4eec\u7684\u8f9b\u52e4\u5de5\u4f5c\u548c\u5bf9\u9879\u76ee\u7684\u5949\u732e\u7cbe\u795e\u611f\u5230\u975e\u5e38\u81ea\u8c6a\u3002"}]}, {"word": "sweat", "ipa": "/sw\u025bt/", "meanings": {"en": "Moisture exuded through the pores of the skin, typically as a result of heat or physical exertion.", "cn": "\u901a\u8fc7\u76ae\u80a4\u6bdb\u5b54\u6392\u51fa\u7684\u6c34\u5206\uff0c\u901a\u5e38\u662f\u7531\u4e8e\u9ad8\u6e29\u6216\u4f53\u529b\u6d88\u8017\u6240\u81f4\u3002"}, "usage_en": "Refers to perspiration or hard work.", "usage_cn": "\u6307\u6c57\u6c34\u6216\u52aa\u529b\u5de5\u4f5c\u3002", "scene_en": "A person wiping sweat from their forehead after a strenuous workout at the gym.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5065\u8eab\u623f\u5267\u70c8\u8fd0\u52a8\u540e\u64e6\u62ed\u989d\u5934\u4e0a\u7684\u6c57\u6c34\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q9_sweat_1.png", "P6_vocabulary_exercises_20_Q9_sweat_2.png"], "examples": [{"en": "He wiped the sweat from his brow after finishing the marathon in record time.", "cn": "\u5728\u521b\u7eaa\u5f55\u7684\u65f6\u95f4\u5185\u5b8c\u6210\u9a6c\u62c9\u677e\u540e\uff0c\u4ed6\u64e6\u53bb\u4e86\u989d\u5934\u4e0a\u7684\u6c57\u6c34\u3002"}, {"en": "The success of the company was a result of years of hard work and sweat.", "cn": "\u516c\u53f8\u7684\u6210\u529f\u662f\u591a\u5e74\u8f9b\u52e4\u5de5\u4f5c\u548c\u6c57\u6c34\u7684\u7ed3\u679c\u3002"}]}, {"word": "treasure", "ipa": "/\u02c8tr\u025b\u0292\u0259r/", "meanings": {"en": "Valuable or precious possessions; something considered especially valuable or important.", "cn": "\u6709\u4ef7\u503c\u6216\u73cd\u8d35\u7684\u8d22\u4ea7\uff1b\u88ab\u8ba4\u4e3a\u7279\u522b\u6709\u4ef7\u503c\u6216\u91cd\u8981\u7684\u4e1c\u897f\u3002"}, "usage_en": "Used to describe something highly valued or cherished.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u975e\u5e38\u73cd\u89c6\u6216\u73cd\u60dc\u7684\u4e1c\u897f\u3002", "scene_en": "A child carefully holding a beloved toy, regarding it as a precious treasure.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u5c0f\u5fc3\u7ffc\u7ffc\u5730\u62b1\u7740\u5fc3\u7231\u7684\u73a9\u5177\uff0c\u628a\u5b83\u770b\u4f5c\u662f\u73cd\u8d35\u7684\u5b9d\u8d1d\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q9_treasure_1.png", "P6_vocabulary_exercises_20_Q9_treasure_2.png"], "examples": [{"en": "Her grandmother's antique ring was her most prized treasure, a link to her past.", "cn": "\u5979\u7956\u6bcd\u7684\u53e4\u8463\u6212\u6307\u662f\u5979\u6700\u73cd\u8d35\u7684\u5b9d\u8d1d\uff0c\u662f\u8fde\u63a5\u5979\u8fc7\u53bb\u7684\u7ebd\u5e26\u3002"}, {"en": "Time spent with family is a treasure that should be cherished and never taken lightly.", "cn": "\u4e0e\u5bb6\u4eba\u5171\u5ea6\u7684\u65f6\u5149\u662f\u4e00\u79cd\u5e94\u8be5\u73cd\u60dc\u7684\u8d22\u5bcc\uff0c\u7edd\u4e0d\u5e94\u8be5\u6389\u4ee5\u8f7b\u5fc3\u3002"}]}, {"word": "heart", "ipa": "/h\u0251\u02d0rt/", "meanings": {"en": "The organ that pumps blood through the body, often used metaphorically for emotions or feelings.", "cn": "\u901a\u8fc7\u8eab\u4f53\u6cf5\u8840\u7684\u5668\u5b98\uff0c\u901a\u5e38\u7528\u4f5c\u60c5\u611f\u6216\u611f\u89c9\u7684\u9690\u55bb\u3002"}, "usage_en": "Used to represent emotions, love, or the center of one's being.", "usage_cn": "\u7528\u4e8e\u4ee3\u8868\u60c5\u611f\u3001\u7231\u6216\u4e00\u4e2a\u4eba\u7684\u5b58\u5728\u4e2d\u5fc3\u3002", "scene_en": "A couple holding hands, symbolizing love and affection from the heart.", "scene_cn": "\u4e00\u5bf9\u592b\u5987\u624b\u7275\u7740\u624b\uff0c\u8c61\u5f81\u7740\u53d1\u81ea\u5185\u5fc3\u7684\u7231\u548c\u611f\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q9_heart_1.png", "P6_vocabulary_exercises_20_Q9_heart_2.png"], "examples": [{"en": "She poured her heart and soul into the project, hoping it would be a success.", "cn": "\u5979\u5168\u8eab\u5fc3\u5730\u6295\u5165\u5230\u8fd9\u4e2a\u9879\u76ee\u4e2d\uff0c\u5e0c\u671b\u5b83\u80fd\u6210\u529f\u3002"}, {"en": "He spoke from the heart, expressing his sincere gratitude for their unwavering support.", "cn": "\u4ed6\u53d1\u81ea\u5185\u5fc3\u5730\u8868\u8fbe\u4e86\u4ed6\u5bf9\u4ed6\u4eec\u575a\u5b9a\u4e0d\u79fb\u7684\u652f\u6301\u7684\u8bda\u631a\u611f\u8c22\u3002"}]}], "synonym_cn": "\u73cd\u89c6\u4e4b\u7269, \u5fc3\u7231\u4e4b\u7269, \u8d35\u91cd\u4e4b\u7269", "socratic_questions": [{"question": "If a team wins a championship, what do they feel for their victory?", "options": ["pride", "sweat", "treasure", "heart"], "correct_answer": "pride", "explanation": "Pride is the feeling of satisfaction from one's achievements."}, {"question": "After a long day of physical labor, what is left on your brow?", "options": ["pride", "sweat", "treasure", "heart"], "correct_answer": "sweat", "explanation": "Sweat is the moisture excreted through the skin's pores."}, {"question": "What do pirates seek when they search for buried chests?", "options": ["pride", "sweat", "treasure", "heart"], "correct_answer": "treasure", "explanation": "Treasure refers to valuable items, often hidden or protected."}, {"question": "Where do feelings of love and affection originate?", "options": ["pride", "sweat", "treasure", "heart"], "correct_answer": "heart", "explanation": "Heart is often used metaphorically to represent emotions and feelings."}]}, {"id": 10, "stem": "You should pull yourself together and not ______ in self-pity.", "correct_index": 3, "options": [{"word": "drool", "ipa": "dru\u02d0l", "meanings": {"en": "to let saliva drip from the mouth", "cn": "\u8ba9\u553e\u6db2\u4ece\u5634\u91cc\u6ef4\u4e0b\u6765"}, "usage_en": "Often used to describe babies or someone who is very hungry or ill.", "usage_cn": "\u901a\u5e38\u7528\u6765\u63cf\u8ff0\u5a74\u513f\u6216\u975e\u5e38\u9965\u997f\u6216\u751f\u75c5\u7684\u4eba\u3002", "scene_en": "A baby sleeping soundly with a small puddle of saliva on the blanket.", "scene_cn": "\u4e00\u4e2a\u5a74\u513f\u7761\u5f97\u5f88\u9999\uff0c\u6bef\u5b50\u4e0a\u6709\u4e00\u5c0f\u6ee9\u553e\u6db2\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q10_drool_1.png", "P6_vocabulary_exercises_20_Q10_drool_2.png"], "examples": [{"en": "The baby started to drool after smelling the delicious food being prepared nearby.", "cn": "\u5b9d\u5b9d\u95fb\u5230\u9644\u8fd1\u51c6\u5907\u7684\u7f8e\u5473\u98df\u7269\u540e\u5f00\u59cb\u6d41\u53e3\u6c34\u3002"}, {"en": "He was so tired that he began to drool while sitting in the chair.", "cn": "\u4ed6\u592a\u7d2f\u4e86\uff0c\u4ee5\u81f3\u4e8e\u5750\u5728\u6905\u5b50\u4e0a\u65f6\u5f00\u59cb\u6d41\u53e3\u6c34\u3002"}]}, {"word": "drown", "ipa": "dra\u028an", "meanings": {"en": "to die from being submerged in water and unable to breathe", "cn": "\u56e0\u6d78\u6ca1\u5728\u6c34\u4e2d\u4e14\u65e0\u6cd5\u547c\u5438\u800c\u6b7b\u4ea1"}, "usage_en": "Used to describe death by submersion or being overwhelmed by something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u88ab\u6df9\u6ca1\u81f4\u6b7b\u6216\u88ab\u67d0\u4e8b\u7269\u6df9\u6ca1\u3002", "scene_en": "A person struggling in deep water, unable to stay afloat.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u6df1\u6c34\u4e2d\u6323\u624e\uff0c\u65e0\u6cd5\u6f02\u6d6e\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q10_drown_1.png", "P6_vocabulary_exercises_20_Q10_drown_2.png"], "examples": [{"en": "The swimmer was caught in a strong current and began to drown quickly.", "cn": "\u6e38\u6cf3\u8005\u88ab\u4e00\u80a1\u5f3a\u6d41\u5377\u8d70\uff0c\u5e76\u5f00\u59cb\u8fc5\u901f\u6eba\u6c34\u3002"}, {"en": "She felt like she would drown in paperwork if she didn't get help soon.", "cn": "\u5979\u89c9\u5f97\u5982\u679c\u5979\u4e0d\u5c3d\u5feb\u5f97\u5230\u5e2e\u52a9\uff0c\u5979\u4f1a\u88ab\u6587\u4e66\u5de5\u4f5c\u6df9\u6ca1\u3002"}]}, {"word": "absorb", "ipa": "\u0259b\u02c8z\u0254\u02d0rb", "meanings": {"en": "to soak up or take in a liquid, gas, or other substance", "cn": "\u5438\u6536\u6216\u5438\u5165\u6db2\u4f53\u3001\u6c14\u4f53\u6216\u5176\u4ed6\u7269\u8d28"}, "usage_en": "Describes the process of taking something in, either physically or mentally.", "usage_cn": "\u63cf\u8ff0\u5438\u6536\u67d0\u7269\u7684\u8fc7\u7a0b\uff0c\u65e0\u8bba\u662f\u8eab\u4f53\u4e0a\u8fd8\u662f\u7cbe\u795e\u4e0a\u3002", "scene_en": "A sponge soaking up water spilled on a counter.", "scene_cn": "\u6d77\u7ef5\u5438\u6536\u6d12\u5728\u67dc\u53f0\u4e0a\u7684\u6c34\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q10_absorb_1.png", "P6_vocabulary_exercises_20_Q10_absorb_2.png"], "examples": [{"en": "The dark curtains absorb most of the sunlight, keeping the room cool.", "cn": "\u6df1\u8272\u7a97\u5e18\u5438\u6536\u4e86\u5927\u90e8\u5206\u9633\u5149\uff0c\u4f7f\u623f\u95f4\u4fdd\u6301\u51c9\u723d\u3002"}, {"en": "She tried to absorb as much information as possible during the lecture.", "cn": "\u5979\u8bd5\u56fe\u5728\u8bb2\u5ea7\u4e2d\u5c3d\u53ef\u80fd\u591a\u5730\u5438\u6536\u4fe1\u606f\u3002"}]}, {"word": "wallow", "ipa": "\u02c8w\u0251\u02d0lo\u028a", "meanings": {"en": "to indulge in something (usually negative) with great enjoyment or to remain in a negative state", "cn": "\u6c89\u6eba\u4e8e\u67d0\u4e8b\uff08\u901a\u5e38\u662f\u8d1f\u9762\u7684\uff09\uff0c\u975e\u5e38\u4eab\u53d7\u6216\u4fdd\u6301\u5728\u6d88\u6781\u72b6\u6001"}, "usage_en": "Describes indulging in negative feelings or experiences.", "usage_cn": "\u63cf\u8ff0\u6c89\u6eba\u4e8e\u6d88\u6781\u60c5\u7eea\u6216\u7ecf\u5386\u3002", "scene_en": "A person lying in bed, surrounded by tissues, looking sad and dejected.", "scene_cn": "\u4e00\u4e2a\u4eba\u8eba\u5728\u5e8a\u4e0a\uff0c\u5468\u56f4\u90fd\u662f\u7eb8\u5dfe\uff0c\u770b\u8d77\u6765\u60b2\u4f24\u6cae\u4e27\u3002", "image_paths": ["P6_vocabulary_exercises_20_Q10_wallow_1.png", "P6_vocabulary_exercises_20_Q10_wallow_2.png"], "examples": [{"en": "After the breakup, he decided not to wallow in self-pity and move on.", "cn": "\u5206\u624b\u540e\uff0c\u4ed6\u51b3\u5b9a\u4e0d\u6c89\u6eba\u4e8e\u81ea\u601c\uff0c\u7ee7\u7eed\u524d\u8fdb\u3002"}, {"en": "It's okay to grieve, but don't wallow in your sorrow for too long.", "cn": "\u60b2\u4f24\u662f\u53ef\u4ee5\u7684\uff0c\u4f46\u4e0d\u8981\u57
