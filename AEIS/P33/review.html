        const DB = {"meta": {"source_pdf": "D:\\Python\u81ea\u52a8\u5316\\AeisLab_Final\\Vocab\\P6_vocabulary_exercises\\P6_vocabulary_exercises_33.pdf", "azure_key": "C42UQWeDcluYanbo17WrtUnPhk0vkZy2uQHPTCGDzY6CdEXx99NzJQQJ99BIACqBBLyXJ3w3AAAYACOGjkyu", "azure_region": "southeastasia"}, "questions": [{"id": 1, "stem": "May's _______ for pain is very high as it takes much more than a cut to make her wince in pain.", "correct_index": 0, "options": [{"word": "threshold", "ipa": "/\u02c8\u03b8re\u0283ho\u028ald/", "meanings": {"en": "The level or point at which something starts or changes; a limit.", "cn": "\u67d0\u4e8b\u7269\u5f00\u59cb\u6216\u53d8\u5316\u7684\u6c34\u5e73\u6216\u70b9\uff1b\u4e00\u4e2a\u754c\u9650\u3002"}, "usage_en": "Often used to describe a limit or point of change.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u4e00\u4e2a\u6781\u9650\u6216\u53d8\u5316\u70b9\u3002", "scene_en": "A person stepping over a doorway, representing crossing a threshold.", "scene_cn": "\u4e00\u4e2a\u4eba\u8de8\u8fc7\u95e8\u69db\uff0c\u4ee3\u8868\u8de8\u8d8a\u4e00\u4e2a\u95e8\u69db\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q1_threshold_1.png", "P6_vocabulary_exercises_33_Q1_threshold_2.png"], "examples": [{"en": "The pain threshold varies from person to person, influenced by genetics and psychology.", "cn": "\u75bc\u75db\u9608\u503c\u56e0\u4eba\u800c\u5f02\uff0c\u53d7\u9057\u4f20\u548c\u5fc3\u7406\u56e0\u7d20\u7684\u5f71\u54cd\u3002"}, {"en": "We are on the threshold of a new era in space exploration with private companies involved.", "cn": "\u968f\u7740\u79c1\u8425\u516c\u53f8\u7684\u53c2\u4e0e\uff0c\u6211\u4eec\u6b63\u5904\u4e8e\u592a\u7a7a\u63a2\u7d22\u65b0\u65f6\u4ee3\u7684\u95e8\u69db\u4e0a\u3002"}]}, {"word": "tolerate", "ipa": "/\u02c8t\u0252l\u0259re\u026at/", "meanings": {"en": "To allow the existence, occurrence, or practice of (something that one does not necessarily like or agree with) without interference.", "cn": "\u5141\u8bb8\uff08\u67d0\u4e8b\u7269\uff0c\u4e0d\u4e00\u5b9a\u559c\u6b22\u6216\u540c\u610f\uff09\u5b58\u5728\u3001\u53d1\u751f\u6216\u5b9e\u8df5\uff0c\u800c\u4e0d\u8fdb\u884c\u5e72\u9884\u3002"}, "usage_en": "Used when allowing something despite not liking it.", "usage_cn": "\u5728\u5141\u8bb8\u67d0\u4e8b\u65f6\u4f7f\u7528\uff0c\u5373\u4f7f\u4e0d\u559c\u6b22\u5b83\u3002", "scene_en": "A person patiently listening to someone with differing opinions.", "scene_cn": "\u4e00\u4e2a\u4eba\u8010\u5fc3\u5730\u503e\u542c\u6301\u6709\u4e0d\u540c\u610f\u89c1\u7684\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q1_tolerate_1.png", "P6_vocabulary_exercises_33_Q1_tolerate_2.png"], "examples": [{"en": "I can tolerate spicy food, but only to a certain extent before it becomes unbearable.", "cn": "\u6211\u53ef\u4ee5\u5fcd\u53d7\u8f9b\u8fa3\u98df\u7269\uff0c\u4f46\u5728\u53d8\u5f97\u96be\u4ee5\u5fcd\u53d7\u4e4b\u524d\u53ea\u80fd\u5fcd\u53d7\u5230\u4e00\u5b9a\u7a0b\u5ea6\u3002"}, {"en": "The company will not tolerate any form of discrimination in the workplace environment.", "cn": "\u516c\u53f8\u7edd\u4e0d\u5bb9\u5fcd\u5de5\u4f5c\u573a\u6240\u4e2d\u4efb\u4f55\u5f62\u5f0f\u7684\u6b67\u89c6\u884c\u4e3a\u3002"}]}, {"word": "degree", "ipa": "/d\u026a\u02c8\u0261ri\u02d0/", "meanings": {"en": "A point in a scale, usually indicating level, amount, or extent.", "cn": "\u523b\u5ea6\u4e0a\u7684\u4e00\u4e2a\u70b9\uff0c\u901a\u5e38\u8868\u793a\u6c34\u5e73\u3001\u6570\u91cf\u6216\u7a0b\u5ea6\u3002"}, "usage_en": "Used to describe the extent or intensity of something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u7684\u7a0b\u5ea6\u6216\u5f3a\u5ea6\u3002", "scene_en": "A thermometer showing the temperature in degrees Celsius.", "scene_cn": "\u4e00\u4e2a\u6e29\u5ea6\u8ba1\u663e\u793a\u6444\u6c0f\u6e29\u5ea6\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q1_degree_1.png", "P6_vocabulary_exercises_33_Q1_degree_2.png"], "examples": [{"en": "The degree of difficulty in this math problem is quite high for elementary students.", "cn": "\u5bf9\u4e8e\u5c0f\u5b66\u751f\u6765\u8bf4\uff0c\u8fd9\u4e2a\u6570\u5b66\u95ee\u9898\u7684\u96be\u5ea6\u76f8\u5f53\u9ad8\u3002"}, {"en": "To a large degree, success depends on hard work and dedication to one's goals.", "cn": "\u5f88\u5927\u7a0b\u5ea6\u4e0a\uff0c\u6210\u529f\u53d6\u51b3\u4e8e\u52aa\u529b\u5de5\u4f5c\u548c\u5bf9\u76ee\u6807\u7684\u5949\u732e\u3002"}]}, {"word": "suffering", "ipa": "/\u02c8s\u028cf\u0259r\u026a\u014b/", "meanings": {"en": "The state of undergoing pain, distress, or hardship.", "cn": "\u7ecf\u5386\u75db\u82e6\u3001\u82e6\u607c\u6216\u8270\u96be\u56f0\u82e6\u7684\u72b6\u6001\u3002"}, "usage_en": "Describes the experience of pain or hardship.", "usage_cn": "\u63cf\u8ff0\u75db\u82e6\u6216\u8270\u96be\u7684\u7ecf\u5386\u3002", "scene_en": "A person in distress, receiving comfort from another person.", "scene_cn": "\u4e00\u4e2a\u75db\u82e6\u7684\u4eba\uff0c\u63a5\u53d7\u53e6\u4e00\u4e2a\u4eba\u7684\u5b89\u6170\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q1_suffering_1.png", "P6_vocabulary_exercises_33_Q1_suffering_2.png"], "examples": [{"en": "The earthquake caused widespread suffering among the affected communities in the region.", "cn": "\u5730\u9707\u7ed9\u8be5\u5730\u533a\u53d7\u5f71\u54cd\u7684\u793e\u533a\u9020\u6210\u4e86\u5e7f\u6cdb\u7684\u82e6\u96be\u3002"}, {"en": "His suffering was evident in his eyes as he recounted the tragic events of that day.", "cn": "\u5f53\u4ed6\u8bb2\u8ff0\u90a3\u5929\u53d1\u751f\u7684\u60b2\u60e8\u4e8b\u4ef6\u65f6\uff0c\u4ed6\u7684\u773c\u775b\u91cc\u6d41\u9732\u51fa\u4e86\u75db\u82e6\u3002"}]}], "synonym_cn": "\u5fcd\u8010\u7a0b\u5ea6\uff0c\u8010\u53d7\u6027\uff0c\u754c\u9650\uff0c\u75db\u82e6", "socratic_questions": [{"question": "If a patient has a low _______ for pain, even a small injury might cause significant discomfort.", "options": ["threshold", "tolerate", "degree", "suffering"], "correct_answer": "threshold", "explanation": "Threshold refers to the point at which a stimulus is perceived."}, {"question": "How long can you _______ the loud noise before needing to leave the concert?", "options": ["threshold", "tolerate", "degree", "suffering"], "correct_answer": "tolerate", "explanation": "Tolerate means to endure or put up with something."}, {"question": "To what _______ did the storm damage the coastal town's infrastructure?", "options": ["threshold", "tolerate", "degree", "suffering"], "correct_answer": "degree", "explanation": "Degree refers to the extent or intensity of something."}, {"question": "After the accident, the victim experienced immense _______ both physically and emotionally.", "options": ["threshold", "tolerate", "degree", "suffering"], "correct_answer": "suffering", "explanation": "Suffering refers to the state of undergoing pain, distress, or hardship."}]}, {"id": 2, "stem": "Greg was _______ when Ron accused him of something he did not do.", "correct_index": 3, "options": [{"word": "arrogant", "ipa": "/\u02c8\u00e6r\u0259\u0261\u0259nt/", "meanings": {"en": "Having or revealing an exaggerated sense of one's own importance or abilities.", "cn": "\u5177\u6709\u6216\u663e\u793a\u51fa\u5bf9\u81ea\u8eab\u91cd\u8981\u6027\u6216\u80fd\u529b\u7684\u5938\u5927\u611f\u3002"}, "usage_en": "Use 'arrogant' to describe someone who acts superior and dismissive of others.", "usage_cn": "\u7528\u201carrogant\u201d\u6765\u5f62\u5bb9\u90a3\u4e9b\u8868\u73b0\u5f97\u9ad8\u4eba\u4e00\u7b49\u5e76\u5bf9\u4ed6\u4eba\u4e0d\u5c51\u4e00\u987e\u7684\u4eba\u3002", "scene_en": "A person speaking loudly and interrupting others, believing their opinions are superior.", "scene_cn": "\u4e00\u4e2a\u4eba\u5927\u58f0\u8bf4\u8bdd\u5e76\u6253\u65ad\u522b\u4eba\uff0c\u8ba4\u4e3a\u81ea\u5df1\u7684\u89c2\u70b9\u66f4\u80dc\u4e00\u7b79\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q2_arrogant_1.png", "P6_vocabulary_exercises_33_Q2_arrogant_2.png"], "examples": [{"en": "His arrogant attitude made it difficult for his colleagues to collaborate effectively with him.", "cn": "\u4ed6\u50b2\u6162\u7684\u6001\u5ea6\u4f7f\u4ed6\u7684\u540c\u4e8b\u5f88\u96be\u4e0e\u4ed6\u6709\u6548\u5730\u5408\u4f5c\u3002"}, {"en": "The arrogant CEO dismissed the concerns of the employees, believing he knew best.", "cn": "\u8fd9\u4f4d\u50b2\u6162\u7684\u9996\u5e2d\u6267\u884c\u5b98\u65e0\u89c6\u4e86\u5458\u5de5\u7684\u62c5\u5fe7\uff0c\u8ba4\u4e3a\u4ed6\u6700\u4e86\u89e3\u60c5\u51b5\u3002"}]}, {"word": "antagonistic", "ipa": "/\u00e6n\u02c8t\u00e6\u0261\u0259n\u026ast\u026ak/", "meanings": {"en": "Showing or feeling active opposition or hostility toward someone or something.", "cn": "\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u8868\u73b0\u51fa\u6216\u611f\u89c9\u5230\u79ef\u6781\u7684\u53cd\u5bf9\u6216\u654c\u610f\u3002"}, "usage_en": "Use 'antagonistic' to describe someone who is actively hostile and provokes conflict.", "usage_cn": "\u7528\u201cantagonistic\u201d\u6765\u5f62\u5bb9\u90a3\u4e9b\u79ef\u6781\u6000\u6709\u654c\u610f\u5e76\u5f15\u53d1\u51b2\u7a81\u7684\u4eba\u3002", "scene_en": "Two people arguing intensely, pointing fingers and raising their voices in anger.", "scene_cn": "\u4e24\u4e2a\u4eba\u6fc0\u70c8\u4e89\u5435\uff0c\u6307\u7740\u5bf9\u65b9\uff0c\u6124\u6012\u5730\u63d0\u9ad8\u55d3\u95e8\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q2_antagonistic_1.png", "P6_vocabulary_exercises_33_Q2_antagonistic_2.png"], "examples": [{"en": "His antagonistic behavior created a tense atmosphere during the meeting, hindering progress.", "cn": "\u4ed6\u5bf9\u6297\u6027\u7684\u884c\u4e3a\u5728\u4f1a\u8bae\u671f\u95f4\u9020\u6210\u4e86\u7d27\u5f20\u7684\u6c14\u6c1b\uff0c\u963b\u788d\u4e86\u8fdb\u5c55\u3002"}, {"en": "The politician's antagonistic remarks fueled further division among the opposing parties involved.", "cn": "\u8fd9\u4f4d\u653f\u5ba2\u5bf9\u6297\u6027\u7684\u8a00\u8bba\u8fdb\u4e00\u6b65\u52a0\u5267\u4e86\u5bf9\u7acb\u515a\u6d3e\u4e4b\u95f4\u7684\u5206\u6b67\u3002"}]}, {"word": "indulgent", "ipa": "/\u026an\u02c8d\u028cld\u02 gly accused of something in public.", "scene_cn": "\u4e00\u4e2a\u4eba\u5bf9\u5728\u516c\u5171\u573a\u5408\u88ab\u9519\u8bef\u5730\u6307\u63a7\u67d0\u4e8b\u505a\u51fa\u6124\u6012\u7684\u53cd\u5e94\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q2_indignant_1.png", "P6_vocabulary_exercises_33_Q2_indignant_2.png"], "examples": [{"en": "She was indignant when her hard work was overlooked and someone else received the promotion.", "cn": "\u5f53\u5979\u7684\u52aa\u529b\u5de5\u4f5c\u88ab\u5ffd\u89c6\u800c\u5176\u4ed6\u4eba\u5f97\u5230\u4e86\u664b\u5347\u65f6\uff0c\u5979\u611f\u5230\u6124\u6124\u4e0d\u5e73\u3002"}, {"en": "The citizens were indignant about the corrupt politician's actions, demanding accountability immediately.", "cn": "\u5e02\u6c11\u4eec\u5bf9\u8150\u8d25\u653f\u5ba2\u7684\u884c\u4e3a\u611f\u5230\u6124\u6168\uff0c\u8981\u6c42\u7acb\u5373\u8ffd\u7a76\u8d23\u4efb\u3002"}]}], "synonym_cn": "\u6124\u6012\u7684\uff0c\u4e0d\u6ee1\u7684", "socratic_questions": [{"question": "If someone constantly boasts about their achievements, are they being arrogant, antagonistic, indulgent, or indignant?", "options": ["arrogant", "antagonistic", "indulgent", "indignant"], "correct_answer": "arrogant", "explanation": "Arrogant describes someone who has an exaggerated sense of their own importance or abilities."}, {"question": "If someone is always arguing and trying to provoke others, are they being arrogant, antagonistic, indulgent, or indignant?", "options": ["arrogant", "antagonistic", "indulgent", "indignant"], "correct_answer": "antagonistic", "explanation": "Antagonistic describes someone who shows active opposition or hostility."}, {"question": "If a parent always gives their child whatever they want, are they being arrogant, antagonistic, indulgent, or indignant?", "options": ["arrogant", "antagonistic", "indulgent", "indignant"], "correct_answer": "indulgent", "explanation": "Indulgent describes someone who is overly generous or lenient, especially with themselves or others."}, {"question": "If someone is wrongly accused of cheating and expresses outrage, are they being arrogant, antagonistic, indulgent, or indignant?", "options": ["arrogant", "antagonistic", "indulgent", "indignant"], "correct_answer": "indignant", "explanation": "Indignant describes someone feeling or showing anger or annoyance at what is perceived as unfair treatment."}]}, {"id": 3, "stem": "I don't mind either coffee or tea as I do not have a _______ for either.", "correct_index": 2, "options": [{"word": "taste", "ipa": "/te\u026ast/", "meanings": {"en": "The sensation of flavor perceived in the mouth and throat on contact with a substance.", "cn": "\u5728\u53e3\u8154\u548c\u5589\u5499\u4e2d\u63a5\u89e6\u7269\u8d28\u65f6\u611f\u77e5\u5230\u7684\u5473\u9053\u611f\u89c9\u3002"}, "usage_en": "Often used to describe the flavor of food or drink.", "usage_cn": "\u901a\u5e38\u7528\u4e8e\u63cf\u8ff0\u98df\u7269\u6216\u996e\u6599\u7684\u5473\u9053\u3002", "scene_en": "A person tasting different flavors of ice cream at an ice cream shop.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u51b0\u6dc7\u6dcb\u5e97\u54c1\u5c1d\u4e0d\u540c\u53e3\u5473\u7684\u51b0\u6dc7\u6dcb\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q3_taste_1.png", "P6_vocabulary_exercises_33_Q3_taste_2.png"], "examples": [{"en": "The soup has a delicious taste, with hints of herbs and spices.", "cn": "\u8fd9\u6c64\u5473\u9053\u9c9c\u7f8e\uff0c\u5e26\u6709\u6de1\u6de1\u7684\u9999\u8349\u548c\u9999\u6599\u7684\u5473\u9053\u3002"}, {"en": "She has a refined taste in art, appreciating both classical and modern works.", "cn": "\u5979\u5728\u827a\u672f\u65b9\u9762\u6709\u5f88\u9ad8\u7684\u54c1\u5473\uff0c\u6b23\u8d4f\u53e4\u5178\u548c\u73b0\u4ee3\u4f5c\u54c1\u3002"}]}, {"word": "favourite", "ipa": "/\u02c8fe\u026av\u0259r\u026at/", "meanings": {"en": "Preferred above all others of the same kind.", "cn": "\u5728\u540c\u7c7b\u4e8b\u7269\u4e2d\uff0c\u6700\u559c\u6b22\u7684\u3002"}, "usage_en": "Used to describe something that is liked more than others.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6bd4\u5176\u4ed6\u4e8b\u7269\u66f4\u559c\u6b22\u7684\u4e1c\u897f\u3002", "scene_en": "A child holding their favorite toy with a happy expression.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u62ff\u7740\u4ed6\u4eec\u6700\u559c\u6b22\u7684\u73a9\u5177\uff0c\u8138\u4e0a\u5e26\u7740\u5feb\u4e50\u7684\u8868\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q3_favourite_1.png", "P6_vocabulary_exercises_33_Q3_favourite_2.png"], "examples": [{"en": "My favourite colour is blue, because it reminds me of the ocean and sky.", "cn": "\u6211\u6700\u559c\u6b22\u7684\u989c\u8272\u662f\u84dd\u8272\uff0c\u56e0\u4e3a\u5b83\u8ba9\u6211\u60f3\u8d77\u6d77\u6d0b\u548c\u5929\u7a7a\u3002"}, {"en": "This restaurant is my favourite; I always order the pasta when I come here.", "cn": "\u8fd9\u5bb6\u9910\u5385\u662f\u6211\u6700\u559c\u6b22\u7684\uff1b\u6211\u6bcf\u6b21\u6765\u8fd9\u91cc\u90fd\u4f1a\u70b9\u610f\u5927\u5229\u9762\u3002"}]}, {"word": "preference", "ipa": "/\u02c8pref\u0259r\u0259ns/", "meanings": {"en": "A greater liking for one alternative over another or others.", "cn": "\u5bf9\u4e00\u79cd\u9009\u62e9\u6bd4\u53e6\u4e00\u79cd\u6216\u591a\u79cd\u9009\u62e9\u66f4\u559c\u6b22\u3002"}, "usage_en": "Used to indicate a choice or inclination towards something.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u5bf9\u67d0\u4e8b\u7684\u9009\u62e9\u6216\u503e\u5411\u3002", "scene_en": "A person choosing between different types of coffee at a cafe.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5496\u5561\u9986\u9009\u62e9\u4e0d\u540c\u79cd\u7c7b\u7684\u5496\u5561\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q3_preference_1.png", "P6_vocabulary_exercises_33_Q3_preference_2.png"], "examples": [{"en": "I have a strong preference for dark chocolate over milk chocolate any day.", "cn": "\u6211\u66f4\u559c\u6b22\u9ed1\u5de7\u514b\u529b\u800c\u4e0d\u662f\u725b\u5976\u5de7\u514b\u529b\u3002"}, {"en": "She expressed a clear preference for working from home rather than in the office.", "cn": "\u5979\u660e\u786e\u8868\u793a\u66f4\u559c\u6b22\u5728\u5bb6\u5de5\u4f5c\u800c\u4e0d\u662f\u5728\u529e\u516c\u5ba4\u5de5\u4f5c\u3002"}]}, {"word": "choice", "ipa": "/t\u0283\u0254\u026as/", "meanings": {"en": "An act of selecting or making a decision when faced with two or more possibilities.", "cn": "\u5f53\u9762\u5bf9\u4e24\u79cd\u6216\u591a\u79cd\u53ef\u80fd\u6027\u65f6\uff0c\u9009\u62e9\u6216\u505a\u51fa\u51b3\u5b9a\u7684\u884c\u4e3a\u3002"}, "usage_en": "Refers to the act of choosing or the option selected.", "usage_cn": "\u6307\u9009\u62e9\u7684\u884c\u4e3a\u6216\u9009\u62e9\u7684\u9009\u9879\u3002", "scene_en": "A person standing at a crossroads, deciding which path to take.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u5341\u5b57\u8def\u53e3\uff0c\u51b3\u5b9a\u8d70\u54ea\u6761\u8def\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q3_choice_1.png", "P6_vocabulary_exercises_33_Q3_choice_2.png"], "examples": [{"en": "Making the right choice can be difficult, especially when facing complex decisions.", "cn": "\u505a\u51fa\u6b63\u786e\u7684\u9009\u62e9\u53ef\u80fd\u5f88\u56f0\u96be\uff0c\u5c24\u5176\u662f\u5728\u9762\u5bf9\u590d\u6742\u7684\u51b3\u5b9a\u65f6\u3002"}, {"en": "The restaurant offers a wide choice of dishes, catering to various dietary needs.", "cn": "\u8fd9\u5bb6\u9910\u5385\u63d0\u4f9b\u591a\u79cd\u83dc\u80b4\u9009\u62e9\uff0c\u4ee5\u6ee1\u8db3\u5404\u79cd\u996e\u98df\u9700\u6c42\u3002"}]}], "synonym_cn": "\u504f\u7231 (pi\u0101n'\u00e0i), \u7231\u597d (\u00e0i h\u00e0o), \u503e\u5411 (q\u012bng xi\u00e0ng)", "socratic_questions": [{"question": "If you are allergic to seafood, would you have a strong _______ for it?", "options": ["taste", "favourite", "preference", "choice"], "correct_answer": "taste", "explanation": "Taste refers to the ability to perceive flavors, and allergies can affect one's taste experiences."}, {"question": "Which movie would you watch repeatedly, showing it's your _______?", "options": ["taste", "favourite", "preference", "choice"], "correct_answer": "favourite", "explanation": "Favourite indicates something you like the most and enjoy repeatedly."}, {"question": "Given two job offers, which one aligns with your career _______?", "options": ["taste", "favourite", "preference", "choice"], "correct_answer": "preference", "explanation": "Preference refers to a tendency to select one option over another based on suitability."}, {"question": "Faced with multiple options, which is the best _______ for a quick decision?", "options": ["taste", "favourite", "preference", "choice"], "correct_answer": "choice", "explanation": "Choice refers to the act of selecting from available options."}]}, {"id": 4, "stem": "_______, the cancer patient recovered without any medical aid.", "correct_index": 3, "options": [{"word": "Expectedly", "ipa": "/\u026ak\u02c8spekt\u026adli/", "meanings": {"en": "In a manner that was anticipated or predicted.", "cn": "\u4ee5\u4e00\u79cd\u88ab\u9884\u671f\u6216\u9884\u6d4b\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Used to describe events that happen as anticipated.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6309\u9884\u671f\u53d1\u751f\u7684\u4e8b\u4ef6\u3002", "scene_en": "A person receiving a gift they knew they were getting.", "scene_cn": "\u4e00\u4e2a\u4eba\u6536\u5230\u4ed6\u4eec\u77e5\u9053\u4f1a\u6536\u5230\u7684\u793c\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q4_Expectedly_1.png", "P6_vocabulary_exercises_33_Q4_Expectedly_2.png"], "examples": [{"en": "The package arrived expectedly, right on time, as the tracking had indicated.", "cn": "\u5305\u88f9\u5982\u671f\u800c\u81f3\uff0c\u6b63\u5982\u8ffd\u8e2a\u4fe1\u606f\u663e\u793a\u7684\u90a3\u6837\uff0c\u4e00\u5207\u90fd\u5728\u9884\u6599\u4e4b\u4e2d\u3002"}, {"en": "Expectedly, the stock market rose after the positive economic news was released.", "cn": "\u6b63\u5982\u9884\u671f\u7684\u90a3\u6837\uff0c\u5728\u5229\u597d\u7684\u7ecf\u6d4e\u6d88\u606f\u53d1\u5e03\u540e\uff0c\u80a1\u5e02\u4e0a\u6da8\u4e86\u3002"}]}, {"word": "Predictably", "ipa": "/pr\u026a\u02c8d\u026akt\u0259bli/", "meanings": {"en": "In a way that can be foreseen or anticipated.", "cn": "\u4ee5\u4e00\u79cd\u53ef\u4ee5\u9884\u89c1\u6216\u9884\u671f\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Used to describe events that follow a pattern.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u9075\u5faa\u67d0\u79cd\u6a21\u5f0f\u7684\u4e8b\u4ef6\u3002", "scene_en": "A weather forecast showing rain, and it starts raining.", "scene_cn": "\u5929\u6c14\u9884\u62a5\u663e\u793a\u4e0b\u96e8\uff0c\u7136\u540e\u5f00\u59cb\u4e0b\u96e8\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q4_Predictably_1.png", "P6_vocabulary_exercises_33_Q4_Predictably_2.png"], "examples": [{"en": "The sun rose predictably in the east, just as it does every morning.", "cn": "\u592a\u9633\u50cf\u6bcf\u5929\u65e9\u6668\u4e00\u6837\uff0c\u53ef\u4ee5\u9884\u6d4b\u5730\u4ece\u4e1c\u65b9\u5347\u8d77\u3002"}, {"en": "Predictably, the price of gas increased before the long holiday weekend began.", "cn": "\u53ef\u4ee5\u9884\u89c1\u7684\u662f\uff0c\u5728\u957f\u5468\u672b\u5047\u671f\u5f00\u59cb\u4e4b\u524d\uff0c\u6c7d\u6cb9\u7684\u4ef7\u683c\u4e0a\u6da8\u4e86\u3002"}]}, {"word": "Religiously", "ipa": "/r\u026a\u02c8l\u026ad\u0292\u0259sli/", "meanings": {"en": "With great devotion, consistency, and diligence.", "cn": "\u4ee5\u6781\u5927\u7684\u5949\u732e\u3001\u4e00\u81f4\u6027\u548c\u52e4\u594b\u3002"}, "usage_en": "Used to describe actions done with unwavering commitment.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4ee5\u575a\u5b9a\u4e0d\u79fb\u7684\u627f\u8bfa\u5b8c\u6210\u7684\u884c\u52a8\u3002", "scene_en": "Someone meditating every morning at the same time.", "scene_cn": "\u6709\u4eba\u6bcf\u5929\u65e9\u4e0a\u5728\u540c\u4e00\u65f6\u95f4\u51a5\u60f3\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q4_Religiously_1.png", "P6_vocabulary_exercises_33_Q4_Religiously_2.png"], "examples": [{"en": "She religiously practiced the piano every day to improve her skills quickly.", "cn": "\u5979\u6bcf\u5929\u90fd\u8654\u8bda\u5730\u7ec3\u4e60\u94a2\u7434\uff0c\u4ee5\u5feb\u901f\u63d0\u9ad8\u5979\u7684\u6280\u80fd\u3002"}, {"en": "He religiously checked his email every hour, hoping for an important update.", "cn": "\u4ed6\u6bcf\u5c0f\u65f6\u90fd\u8654\u8bda\u5730\u67e5\u770b\u4ed6\u7684\u7535\u5b50\u90ae\u4ef6\uff0c\u5e0c\u671b\u5f97\u5230\u91cd\u8981\u7684\u66f4\u65b0\u3002"}]}, {"word": "Miraculously", "ipa": "/m\u026a\u02c8r\u00e6kj\u0259l\u0259sli/", "meanings": {"en": "In a way that resembles a miracle; surprisingly and wonderfully.", "cn": "\u4ee5\u4e00\u79cd\u7c7b\u4f3c\u4e8e\u5947\u8ff9\u7684\u65b9\u5f0f\uff1b\u4ee4\u4eba\u60ca\u8bb6\u548c\u7f8e\u5999\u5730\u3002"}, "usage_en": "Used to describe unexpected and fortunate events.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u610f\u60f3\u4e0d\u5230\u7684\u5e78\u8fd0\u4e8b\u4ef6\u3002", "scene_en": "A person surviving a severe accident with no injuries.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u4e00\u6b21\u4e25\u91cd\u4e8b\u6545\u4e2d\u5e78\u5b58\u4e0b\u6765\uff0c\u6ca1\u6709\u53d7\u4f24\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q4_Miraculously_1.png", "P6_vocabulary_exercises_33_Q4_Miraculously_2.png"], "examples": [{"en": "Miraculously, the lost hikers were found safe after being missing for days.", "cn": "\u5947\u8ff9\u822c\u5730\uff0c\u5931\u8e2a\u7684\u5f92\u6b65\u65c5\u884c\u8005\u5728\u5931\u8e2a\u6570\u5929\u540e\u88ab\u5b89\u5168\u627e\u5230\u3002"}, {"en": "The small business miraculously survived the economic downturn and continued to thrive.", "cn": "\u8fd9\u5bb6\u5c0f\u4f01\u4e1a\u5947\u8ff9\u822c\u5730\u5728\u7ecf\u6d4e\u8870\u9000\u4e2d\u5e78\u5b58\u4e0b\u6765\uff0c\u5e76\u7ee7\u7eed\u84ec\u52c3\u53d1\u5c55\u3002"}]}], "synonym_cn": "\u51fa\u4e4e\u610f\u6599\u5730", "socratic_questions": [{"question": "If a team wins a game as everyone predicted, did they win _______?", "options": ["Miraculously", "Religiously", "Predictably", "Expectedly"], "correct_answer": "Predictably", "explanation": "Predictably means as expected. Winning as predicted is a predictable outcome."}, {"question": "If someone always follows their routine, do they do it _______?", "options": ["Expectedly", "Miraculously", "Religiously", "Predictably"], "correct_answer": "Religiously", "explanation": "Religiously means consistently and faithfully. Following a routine consistently is doing it religiously."}, {"question": "If something happens that everyone thought would happen, did it happen _______?", "options": ["Religiously", "Expectedly", "Miraculously", "Predictably"], "correct_answer": "Expectedly", "explanation": "Expectedly means as anticipated. Something happening as anticipated is happening expectedly."}, {"question": "If a very sick person suddenly gets better without any medicine, did they recover _______?", "options": ["Predictably", "Expectedly", "Religiously", "Miraculously"], "correct_answer": "Miraculously", "explanation": "Miraculously means unexpectedly and wonderfully. Recovering without medicine is a miraculous recovery."}]}, {"id": 5, "stem": "After the operation, I suggest that you _______ at your aunt's place.", "correct_index": 1, "options": [{"word": "restore", "ipa": "/r\u026a\u02c8st\u0254\u02d0r/", "meanings": {"en": "To bring back to an original state; to reinstate.", "cn": "\u6062\u590d\u5230\u539f\u59cb\u72b6\u6001\uff1b\u6062\u590d\u3002"}, "usage_en": "Used when returning something to a former condition or place.", "usage_cn": "\u7528\u4e8e\u5c06\u67d0\u7269\u6062\u590d\u5230\u4ee5\u524d\u7684\u72b6\u6001\u6216\u4f4d\u7f6e\u3002", "scene_en": "A museum curator carefully restoring an old painting in a workshop.", "scene_cn": "\u535a\u7269\u9986\u9986\u957f\u5728\u5de5\u4f5c\u5ba4\u91cc\u5c0f\u5fc3\u5730\u4fee\u590d\u4e00\u5e45\u53e4\u8001\u7684\u753b\u4f5c\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q5_restore_1.png", "P6_vocabulary_exercises_33_Q5_restore_2.png"], "examples": [{"en": "The museum plans to restore the ancient artifacts to their original splendor soon.", "cn": "\u535a\u7269\u9986\u8ba1\u5212\u5f88\u5feb\u5c06\u53e4\u4ee3\u6587\u7269\u6062\u590d\u5230\u5b83\u4eec\u539f\u6709\u7684\u8f89\u714c\u3002"}, {"en": "After the fire, the community worked hard to restore the damaged historical building.", "cn": "\u706b\u707e\u8fc7\u540e\uff0c\u793e\u533a\u52aa\u529b\u4fee\u590d\u53d7\u635f\u7684\u5386\u53f2\u5efa\u7b51\u3002"}]}, {"word": "recuperate", "ipa": "/r\u026a\u02c8ku\u02d0p\u0259re\u026at/", "meanings": {"en": "To recover from illness or exertion.", "cn": "\u4ece\u75be\u75c5\u6216\u52b3\u7d2f\u4e2d\u6062\u590d\u3002"}, "usage_en": "Used when recovering health or strength after being ill or tired.", "usage_cn": "\u7528\u4e8e\u5728\u751f\u75c5\u6216\u75b2\u5026\u540e\u6062\u590d\u5065\u5eb7\u6216\u4f53\u529b\u3002", "scene_en": "A person resting in bed, surrounded by pillows and blankets, recuperating from surgery.", "scene_cn": "\u4e00\u4e2a\u4eba\u8eba\u5728\u5e8a\u4e0a\u4f11\u606f\uff0c\u5468\u56f4\u662f\u6795\u5934\u548c\u6bef\u5b50\uff0c\u4ece\u624b\u672f\u4e2d\u6062\u590d\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q5_recuperate_1.png", "P6_vocabulary_exercises_33_Q5_recuperate_2.png"], "examples": [{"en": "After the surgery, it's important to recuperate fully before returning to work again.", "cn": "\u624b\u672f\u540e\uff0c\u91cd\u8981\u7684\u662f\u5728\u91cd\u8fd4\u5de5\u4f5c\u5c97\u4f4d\u4e4b\u524d\u5b8c\u5168\u5eb7\u590d\u3002"}, {"en": "She decided to recuperate at home rather than in the hospital after her illness.", "cn": "\u751f\u75c5\u540e\uff0c\u5979\u51b3\u5b9a\u5728\u5bb6\u4f11\u517b\uff0c\u800c\u4e0d\u662f\u5728\u533b\u9662\u3002"}]}, {"word": "regain", "ipa": "/r\u026a\u02c8\u0261e\u026an/", "meanings": {"en": "To get something back, especially something lost or no longer possessed.", "cn": "\u91cd\u65b0\u83b7\u5f97\u67d0\u7269\uff0c\u7279\u522b\u662f\u4e22\u5931\u6216\u4e0d\u518d\u62e5\u6709\u7684\u4e1c\u897f\u3002"}, "usage_en": "Used when getting back something that was lost or taken away.", "usage_cn": "\u7528\u4e8e\u53d6\u56de\u4e22\u5931\u6216\u88ab\u62ff\u8d70\u7684\u4e1c\u897f\u3002", "scene_en": "A runner pushing hard to regain the lead in a race, sweat dripping from their brow.", "scene_cn": "\u8d5b\u8dd1\u8005\u52aa\u529b\u51b2\u523a\u4ee5\u91cd\u65b0\u83b7\u5f97\u6bd4\u8d5b\u7684\u9886\u5148\u5730\u4f4d\uff0c\u6c57\u6c34\u4ece\u4ed6\u4eec\u7684\u7709\u6bdb\u4e0a\u6ef4\u843d\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q5_regain_1.png", "P6_vocabulary_exercises_33_Q5_regain_2.png"], "examples": [{"en": "After a period of low sales, the company is working hard to regain its market share.", "cn": "\u7ecf\u8fc7\u4e00\u6bb5\u65f6\u95f4\u7684\u4f4e\u8ff7\u9500\u552e\u540e\uff0c\u8be5\u516c\u53f8\u6b63\u5728\u52aa\u529b\u91cd\u65b0\u83b7\u5f97\u5176\u5e02\u573a\u4efd\u989d\u3002"}, {"en": "It took him several months to regain his strength after the serious car accident.", "cn": "\u5728\u4e25\u91cd\u7684\u4ea4\u901a\u4e8b\u6545\u53d1\u751f\u540e\uff0c\u4ed6\u82b1\u4e86\u51e0\u4e2a\u6708\u7684\u65f6\u95f4\u624d\u6062\u590d\u4f53\u529b\u3002"}]}, {"word": "revive", "ipa": "/r\u026a\u02c8va\u026av/", "meanings": {"en": "To restore to life or consciousness; to give new strength or energy to.", "cn": "\u6062\u590d\u751f\u547d\u6216\u610f\u8bc6\uff1b\u8d4b\u4e88\u65b0\u7684\u529b\u91cf\u6216\u80fd\u91cf\u3002"}, "usage_en": "Used when bringing someone or something back to life or vigor.", "usage_cn": "\u7528\u4e8e\u4f7f\u67d0\u4eba\u6216\u67d0\u7269\u6062\u590d\u751f\u547d\u6216\u6d3b\u529b\u3002", "scene_en": "A doctor using CPR to revive a patient who has collapsed on the street.", "scene_cn": "\u533b\u751f\u4f7f\u7528\u5fc3\u80ba\u590d\u82cf\u672f\u6765\u590d\u82cf\u5012\u5728\u8857\u4e0a\u7684\u75c5\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q5_revive_1.png", "P6_vocabulary_exercises_33_Q5_revive_2.png"], "examples": [{"en": "The cold water helped to revive the tired hikers after their long and arduous journey.", "cn": "\u5728\u6f2b\u957f\u800c\u8270\u82e6\u7684\u65c5\u7a0b\u4e4b\u540e\uff0c\u51b7\u6c34\u5e2e\u52a9\u75b2\u60eb\u7684\u5f92\u6b65\u65c5\u884c\u8005\u6062\u590d\u4e86\u6d3b\u529b\u3002"}, {"en": "The new management team hopes to revive the struggling company with innovative strategies.", "cn": "\u65b0\u7684\u7ba1\u7406\u56e2\u961f\u5e0c\u671b\u901a\u8fc7\u521b\u65b0\u6218\u7565\u6765\u632f\u5174\u8fd9\u5bb6\u82e6\u82e6\u6323\u624e\u7684\u516c\u53f8\u3002"}]}], "synonym_cn": "\u6062\u590d, \u5eb7\u590d, \u6062\u590d, \u590d\u5174", "socratic_questions": [{"question": "If a historical building is damaged, which word describes bringing it back to its original condition?", "options": ["restore", "recuperate", "regain", "revive"], "correct_answer": "restore", "explanation": "Restore means to bring something back to its original state."}, {"question": "After a long illness, which word describes the process of getting your health back?", "options": ["restore", "recuperate", "regain", "revive"], "correct_answer": "recuperate", "explanation": "Recuperate means to recover from illness or exertion."}, {"question": "If you lose something valuable, which word describes getting it back?", "options": ["restore", "recuperate", "regain", "revive"], "correct_answer": "regain", "explanation": "Regain means to get something back that was lost."}, {"question": "If a plant is nearly dead, which word describes bringing it back to life?", "options": ["restore", "recuperate", "regain", "revive"], "correct_answer": "revive", "explanation": "Revive means to bring back to life or consciousness."}]}, {"id": 6, "stem": "The mystery movie was so _______ that I held my breath throughout.", "correct_index": 2, "options": [{"word": "stressful", "ipa": "/\u02c8stresfl/", "meanings": {"en": "Causing mental or emotional stress.", "cn": "\u5f15\u8d77\u7cbe\u795e\u6216\u60c5\u7eea\u538b\u529b\u7684\u3002"}, "usage_en": "Used to describe situations or experiences that cause anxiety.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f15\u8d77\u7126\u8651\u7684\u60c5\u51b5\u6216\u7ecf\u5386\u3002", "scene_en": "A person sitting at a desk, surrounded by piles of paperwork, looking overwhelmed.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u529e\u516c\u684c\u65c1\uff0c\u5468\u56f4\u5806\u6ee1\u4e86\u6587\u4ef6\uff0c\u770b\u8d77\u6765\u4e0d\u77e5\u6240\u63aa\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q6_stressful_1.png", "P6_vocabulary_exercises_33_Q6_stressful_2.png"], "examples": [{"en": "The deadline for the project was incredibly stressful, causing many sleepless nights.", "cn": "\u8fd9\u4e2a\u9879\u76ee\u7684\u622a\u6b62\u65e5\u671f\u975e\u5e38\u7d27\u5f20\uff0c\u5bfc\u81f4\u8bb8\u591a\u4e0d\u7720\u4e4b\u591c\u3002"}, {"en": "Navigating the crowded city streets during rush hour can be a very stressful experience.", "cn": "\u5728\u9ad8\u5cf0\u65f6\u6bb5\u7a7f\u68ad\u4e8e\u62e5\u6324\u7684\u57ce\u5e02\u8857\u9053\u53ef\u80fd\u662f\u4e00\u79cd\u975e\u5e38\u7d27\u5f20\u7684\u4f53\u9a8c\u3002"}]}, {"word": "exhausting", "ipa": "/\u026a\u0261\u02c8z\u0254\u02d0st\u026a\u014b/", "meanings": {"en": "Making someone feel very tired; draining.", "cn": "\u4f7f\u4eba\u611f\u5230\u975e\u5e38\u75b2\u5026\uff1b\u8017\u5c3d\u7cbe\u529b\u3002"}, "usage_en": "Describes activities or situations that deplete one's energy.", "usage_cn": "\u63cf\u8ff0\u6d88\u8017\u4e00\u4e2a\u4eba\u7cbe\u529b\u7684\u6d3b\u52a8\u6216\u60c5\u51b5\u3002", "scene_en": "A runner collapsing after finishing a marathon, completely drained of energy.", "scene_cn": "\u4e00\u540d\u8dd1\u6b65\u8005\u5728\u5b8c\u6210\u9a6c\u62c9\u677e\u540e\u5012\u4e0b\uff0c\u7cbe\u529b\u5b8c\u5168\u8017\u5c3d\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q6_exhausting_1.png", "P6_vocabulary_exercises_33_Q6_exhausting_2.png"], "examples": [{"en": "The hike up the mountain was exhausting, but the view from the top was worth it.", "cn": "\u722c\u5c71\u5f88\u7d2f\uff0c\u4f46\u5c71\u9876\u7684\u666f\u8272\u662f\u503c\u5f97\u7684\u3002"}, {"en": "Taking care of three young children all day can be an extremely exhausting job.", "cn": "\u7167\u987e\u4e09\u4e2a\u5e74\u5e7c\u7684\u5b69\u5b50\u4e00\u6574\u5929\u53ef\u80fd\u662f\u4e00\u9879\u975e\u5e38\u7d2f\u4eba\u7684\u5de5\u4f5c\u3002"}]}, {"word": "suspenseful", "ipa": "/s\u0259\u02c8spensfl/", "meanings": {"en": "Full of suspense; causing a feeling of excitement or anxiety about what might happen.", "cn": "\u5145\u6ee1\u60ac\u5ff5\uff1b\u5f15\u8d77\u5bf9\u53ef\u80fd\u53d1\u751f\u7684\u4e8b\u60c5\u611f\u5230\u5174\u594b\u6216\u7126\u8651\u3002"}, "usage_en": "Used to describe stories, movies, or situations that keep you on the edge of your seat.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8ba9\u4f60\u5750\u7acb\u4e0d\u5b89\u7684\u6545\u4e8b\u3001\u7535\u5f71\u6216\u60c5\u51b5\u3002", "scene_en": "A dark, shadowy alleyway with a mysterious figure lurking in the distance.", "scene_cn": "\u4e00\u6761\u9ed1\u6697\u3001\u9634\u6697\u7684\u5c0f\u5df7\uff0c\u8fdc\u5904\u6f5c\u4f0f\u7740\u4e00\u4e2a\u795e\u79d8\u7684\u8eab\u5f71\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q6_suspenseful_1.png", "P6_vocabulary_exercises_33_Q6_suspenseful_2.png"], "examples": [{"en": "The suspenseful music in the movie heightened the tension as the detective closed in.", "cn": "\u7535\u5f71\u4e2d\u60ac\u7591\u7684\u97f3\u4e50\u589e\u5f3a\u4e86\u4fa6\u63a2\u903c\u8fd1\u65f6\u7684\u7d27\u5f20\u6c14\u6c1b\u3002"}, {"en": "The suspenseful silence before the magician revealed the trick had the audience captivated.", "cn": "\u9b54\u672f\u5e08\u63ed\u793a\u9b54\u672f\u4e4b\u524d\u7684\u60ac\u5ff5\u6c89\u9ed8\u8ba9\u89c2\u4f17\u7740\u8ff7\u3002"}]}, {"word": "enthralling", "ipa": "/\u026an\u02c8\u03b8r\u0254\u02d0l\u026a\u014b/", "meanings": {"en": "Captivating; holding one's attention completely.", "cn": "\u8ff7\u4eba\u7684\uff1b\u5b8c\u5168\u5438\u5f15\u4e00\u4e2a\u4eba\u7684\u6ce8\u610f\u529b\u3002"}, "usage_en": "Describes something that is fascinating and holds your attention.", "usage_cn": "\u63cf\u8ff0\u5f15\u4eba\u5165\u80dc\u5e76\u5438\u5f15\u4f60\u6ce8\u610f\u529b\u7684\u4e8b\u7269\u3002", "scene_en": "A packed theater watching a mesmerizing stage performance with elaborate costumes.", "scene_cn": "\u4e00\u4e2a\u62e5\u6324\u7684\u5267\u9662\u89c2\u770b\u4e00\u573a\u8ff7\u4eba\u7684\u821e\u53f0\u8868\u6f14\uff0c\u670d\u88c5\u7cbe\u7f8e\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q6_enthralling_1.png", "P6_vocabulary_exercises_33_Q6_enthralling_2.png"], "examples": [{"en": "The storyteller's enthralling tales of adventure kept the children spellbound for hours.", "cn": "\u8bb2\u6545\u4e8b\u7684\u4eba\u8bb2\u8ff0\u7684\u5f15\u4eba\u5165\u80dc\u7684\u5192\u9669\u6545\u4e8b\u8ba9\u5b69\u5b50\u4eec\u7740\u8ff7\u4e86\u51e0\u4e2a\u5c0f\u65f6\u3002"}, {"en": "The museum's exhibit on ancient civilizations was absolutely enthralling, I spent all day there.", "cn": "\u535a\u7269\u9986\u5173\u4e8e\u53e4\u4ee3\u6587\u660e\u7684\u5c55\u89c8\u975e\u5e38\u5438\u5f15\u4eba\uff0c\u6211\u5728\u90a3\u91cc\u5f85\u4e86\u4e00\u6574\u5929\u3002"}]}], "synonym_cn": "\u7d27\u5f20\u7684\uff0c\u6263\u4eba\u5fc3\u5f26\u7684\uff0c\u5f15\u4eba\u5165\u80dc\u7684", "socratic_questions": [{"question": "After a long day of meetings and deadlines, which feeling describes your state?", "options": ["stressful", "exhausting", "suspenseful", "enthralling"], "correct_answer": "exhausting", "explanation": "Exhausting means extremely tired or drained, fitting the feeling after a demanding day."}, {"question": "Imagine watching a tightrope walker high above the ground. Which word best describes the atmosphere?", "options": ["stressful", "exhausting", "suspenseful", "enthralling"], "correct_answer": "suspenseful", "explanation": "Suspenseful describes a situation filled with uncertainty and anticipation, like watching a risky act."}, {"question": "If you are captivated by a speaker's powerful words, which term describes the experience?", "options": ["stressful", "exhausting", "suspenseful", "enthralling"], "correct_answer": "enthralling", "explanation": "Enthralling means captivating and fascinating, perfectly describing being drawn in by a speaker."}, {"question": "Facing a major exam with little preparation, what feeling might dominate your thoughts?", "options": ["stressful", "exhausting", "suspenseful", "enthralling"], "correct_answer": "stressful", "explanation": "Stressful describes a situation causing worry and tension, like an unprepared exam."}]}, {"id": 7, "stem": "Both father and son took two years to _______ after their bitter quarrel.", "correct_index": 3, "options": [{"word": "resurface", "ipa": "/\u02ccri\u02d0\u02c8s\u025c\u02d0rf\u026as/", "meanings": {"en": "appear again; come to the surface again.", "cn": "\u518d\u6b21\u51fa\u73b0\uff1b\u518d\u6b21\u6d6e\u51fa\u6c34\u9762\u3002"}, "usage_en": "Used when something hidden or forgotten reappears.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u9690\u85cf\u6216\u9057\u5fd8\u7684\u4e8b\u7269\u518d\u6b21\u51fa\u73b0\u3002", "scene_en": "A diver surfacing from underwater; a forgotten memory coming back.", "scene_cn": "\u6f5c\u6c34\u5458\u4ece\u6c34\u4e0b\u6d6e\u51fa\u6c34\u9762\uff1b\u4e00\u6bb5\u88ab\u9057\u5fd8\u7684\u8bb0\u5fc6\u53c8\u56de\u6765\u4e86\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q7_resurface_1.png", "P6_vocabulary_exercises_33_Q7_resurface_2.png"], "examples": [{"en": "After years of being out of print, the author's early novels began to resurface.", "cn": "\u5728\u7edd\u7248\u591a\u5e74\u540e\uff0c\u8fd9\u4f4d\u4f5c\u5bb6\u65e9\u671f\u7684\u51e0\u90e8\u5c0f\u8bf4\u5f00\u59cb\u518d\u6b21\u51fa\u73b0\u3002"}, {"en": "The sunken treasure is expected to resurface after the storm clears the debris.", "cn": "\u9884\u8ba1\u5728\u66b4\u98ce\u96e8\u6e05\u9664\u788e\u7247\u540e\uff0c\u6c89\u6ca1\u7684\u5b9d\u85cf\u5c06\u4f1a\u518d\u6b21\u6d6e\u51fa\u6c34\u9762\u3002"}]}, {"word": "regroup", "ipa": "/\u02ccri\u02d0\u02c8\u0261ru\u02d0p/", "meanings": {"en": "reorganize (oneself or a group) in order to continue an activity more effectively.", "cn": "\u91cd\u7ec4\uff08\u81ea\u5df1\u6216\u4e00\u4e2a\u56e2\u961f\uff09\uff0c\u4ee5\u4fbf\u66f4\u6709\u6548\u5730\u7ee7\u7eed\u6d3b\u52a8\u3002"}, "usage_en": "Used when a team or group needs to reorganize after a setback.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u56e2\u961f\u6216\u5c0f\u7ec4\u5728\u632b\u6298\u540e\u9700\u8981\u91cd\u7ec4\u7684\u60c5\u51b5\u3002", "scene_en": "A sports team huddling during a timeout; soldiers reorganizing after a battle.", "scene_cn": "\u8fd0\u52a8\u961f\u5728\u6682\u505c\u671f\u95f4\u805a\u96c6\u5728\u4e00\u8d77\uff1b\u58eb\u5175\u5728\u6218\u6597\u540e\u91cd\u7ec4\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q7_regroup_1.png", "P6_vocabulary_exercises_33_Q7_regroup_2.png"], "examples": [{"en": "After losing the first set, the tennis players decided to regroup and change their strategy.", "cn": "\u5728\u8f93\u6389\u7b2c\u4e00\u76d8\u540e\uff0c\u7f51\u7403\u8fd0\u52a8\u5458\u51b3\u5b9a\u91cd\u7ec4\u5e76\u6539\u53d8\u4ed6\u4eec\u7684\u7b56\u7565\u3002"}, {"en": "The company had to regroup after the failed product launch to avoid further losses.", "cn": "\u8be5\u516c\u53f8\u5728\u4ea7\u54c1\u53d1\u5e03\u5931\u8d25\u540e\u4e0d\u5f97\u4e0d\u91cd\u7ec4\uff0c\u4ee5\u907f\u514d\u8fdb\u4e00\u6b65\u7684\u635f\u5931\u3002"}]}, {"word": "replenish", "ipa": "/r\u026a\u02c8plen\u026a\u0283/", "meanings": {"en": "restore (a stock or supply) to a former level or condition.", "cn": "\u5c06\uff08\u5e93\u5b58\u6216\u4f9b\u5e94\uff09\u6062\u590d\u5230\u4ee5\u524d\u7684\u6c34\u5e73\u6216\u72b6\u6001\u3002"}, "usage_en": "Used when something is being refilled or restored.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u88ab\u91cd\u65b0\u586b\u5145\u6216\u6062\u590d\u7684\u60c5\u51b5\u3002", "scene_en": "Refilling a water bottle; restocking shelves in a store.", "scene_cn": "\u91cd\u65b0\u88c5\u6ee1\u6c34\u74f6\uff1b\u8865\u5145\u5546\u5e97\u8d27\u67b6\u4e0a\u7684\u5546\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q7_replenish_1.png", "P6_vocabulary_exercises_33_Q7_replenish_2.png"], "examples": [{"en": "It's important to replenish your energy with a healthy meal after a long workout.", "cn": "\u7ecf\u8fc7\u957f\u65f6\u95f4\u7684\u953b\u70bc\u540e\uff0c\u901a\u8fc7\u5065\u5eb7\u7684\u81b3\u98df\u6765\u8865\u5145\u80fd\u91cf\u975e\u5e38\u91cd\u8981\u3002"}, {"en": "The government is working to replenish the depleted fish stocks in the coastal areas.", "cn": "\u653f\u5e9c\u6b63\u5728\u52aa\u529b\u8865\u5145\u6cbf\u6d77\u5730\u533a\u67af\u7aed\u7684\u9c7c\u7c7b\u8d44\u6e90\u3002"}]}, {"word": "reconcile", "ipa": "/\u02c8rek\u0259nsa\u026al/", "meanings": {"en": "restore friendly relations between.", "cn": "\u6062\u590d\u4e4b\u95f4\u7684\u53cb\u597d\u5173\u7cfb\u3002"}, "usage_en": "Used when restoring harmony after a disagreement.", "usage_cn": "\u7528\u4e8e\u5728\u610f\u89c1\u5206\u6b67\u540e\u6062\u590d\u548c\u8c10\u3002", "scene_en": "Two friends hugging after an argument; nations signing a peace treaty.", "scene_cn": "\u4e24\u4e2a\u670b\u53cb\u5728\u4e89\u5435\u540e\u62e5\u62b1\uff1b\u5404\u56fd\u7b7e\u7f72\u548c\u5e73\u6761\u7ea6\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q7_reconcile_1.png", "P6_vocabulary_exercises_33_Q7_reconcile_2.png"], "examples": [{"en": "After a long feud, the two families finally decided to reconcile at the family reunion.", "cn": "\u7ecf\u8fc7\u957f\u671f\u7684\u4e0d\u548c\uff0c\u8fd9\u4e24\u4e2a\u5bb6\u5ead\u7ec8\u4e8e\u51b3\u5b9a\u5728\u5bb6\u5ead\u805a\u4f1a\u4e0a\u548c\u89e3\u3002"}, {"en": "It took a lot of effort to reconcile their differences and work together on the project.", "cn": "\u4ed6\u4eec\u4ed8\u51fa\u4e86\u5f88\u591a\u52aa\u529b\u6765\u8c03\u548c\u5206\u6b67\uff0c\u5e76\u5728\u9879\u76ee\u4e0a\u5408\u4f5c\u3002"}]}], "synonym_cn": "\u548c\u597d\uff0c\u8a00\u5f52\u4e8e\u597d", "socratic_questions": [{"question": "After a natural disaster, which word describes the efforts to bring essential supplies back to normal levels?", "options": ["resurface", "regroup", "replenish", "reconcile"], "correct_answer": "replenish", "explanation": "Replenish means to restore something to its former level or condition, often referring to resources."}, {"question": "If a team decides to meet again to plan a new strategy after a setback, what are they doing?", "options": ["resurface", "regroup", "replenish", "reconcile"], "correct_answer": "regroup", "explanation": "Regroup means to reorganize or come together again, often after a period of disarray or separation."}, {"question": "If a long-lost artifact is found after being hidden for centuries, what verb describes its reappearance?", "options": ["resurface", "regroup", "replenish", "reconcile"], "correct_answer": "resurface", "explanation": "Resurface means to appear again or become known after being lost or forgotten for a period of time."}, {"question": "After a disagreement, what action do people take to restore a friendly relationship?", "options": ["resurface", "regroup", "replenish", "reconcile"], "correct_answer": "reconcile", "explanation": "Reconcile means to restore friendly relations between two parties after a disagreement."}]}, {"id": 8, "stem": "The suspect was _______ as there was insufficient proof to convict him.", "correct_index": 0, "options": [{"word": "acquitted", "ipa": "/\u0259\u02c8kw\u026at\u026ad/", "meanings": {"en": "Declared not guilty of a crime after a trial.", "cn": "\u5ba1\u5224\u540e\u5ba3\u5e03\u65e0\u7f6a\u3002"}, "usage_en": "Used when someone is formally cleared of charges in court.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u5728\u6cd5\u5ead\u4e0a\u88ab\u6b63\u5f0f\u5ba3\u544a\u65e0\u7f6a\u65f6\u3002", "scene_en": "A courtroom scene with a judge, jury, and a relieved defendant.", "scene_cn": "\u4e00\u4e2a\u6cd5\u5ead\u573a\u666f\uff0c\u6709\u6cd5\u5b98\u3001\u966a\u5ba1\u56e2\u548c\u4e00\u4e2a\u5982\u91ca\u91cd\u8d1f\u7684\u88ab\u544a\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q8_acquitted_1.png", "P6_vocabulary_exercises_33_Q8_acquitted_2.png"], "examples": [{"en": "The defendant was acquitted after the key witness recanted their earlier testimony.", "cn": "\u5728\u5173\u952e\u8bc1\u4eba\u64a4\u56de\u5148\u524d\u7684\u8bc1\u8bcd\u540e\uff0c\u88ab\u544a\u88ab\u5ba3\u5224\u65e0\u7f6a\u3002"}, {"en": "She felt relieved when the jury acquitted her of all charges in the case.", "cn": "\u5f53\u966a\u5ba1\u56e2\u5ba3\u5224\u5979\u5728\u6b64\u6848\u4e2d\u6240\u6709\u6307\u63a7\u5747\u4e0d\u6210\u7acb\u65f6\uff0c\u5979\u611f\u5230\u5982\u91ca\u91cd\u8d1f\u3002"}]}, {"word": "absolved", "ipa": "/\u0259b\u02c8z\u0252lvd/", "meanings": {"en": "Freed from guilt, blame, or responsibility.", "cn": "\u514d\u9664\u5185\u759a\u3001\u8d23\u5907\u6216\u8d23\u4efb\u3002"}, "usage_en": "Used when someone is cleared of blame or responsibility for something.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u88ab\u514d\u9664\u5bf9\u67d0\u4e8b\u7684\u8d23\u5907\u6216\u8d23\u4efb\u65f6\u3002", "scene_en": "A person being forgiven by another, symbolizing the removal of blame.", "scene_cn": "\u4e00\u4e2a\u4eba\u88ab\u53e6\u4e00\u4e2a\u4eba\u539f\u8c05\uff0c\u8c61\u5f81\u7740\u6d88\u9664\u8d23\u5907\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q8_absolved_1.png", "P6_vocabulary_exercises_33_Q8_absolved_2.png"], "examples": [{"en": "The investigation absolved him of any involvement in the financial mismanagement scandal.", "cn": "\u8c03\u67e5\u89e3\u9664\u4e86\u4ed6\u5bf9\u91d1\u878d\u7ba1\u7406\u4e0d\u5584\u4e11\u95fb\u7684\u4efb\u4f55\u7275\u8fde\u3002"}, {"en": "After apologizing sincerely, she was absolved of her mistake by her understanding colleagues.", "cn": "\u5728\u771f\u8bda\u9053\u6b49\u540e\uff0c\u5979\u88ab\u5979\u5584\u89e3\u4eba\u610f\u7684\u540c\u4e8b\u4eec\u514d\u9664\u4e86\u5979\u7684\u9519\u8bef\u3002"}]}, {"word": "pardoned", "ipa": "/\u02c8p\u0251\u02d0rd\u0259nd/", "meanings": {"en": "Officially forgiven for a crime and freed from punishment.", "cn": "\u56e0\u72af\u7f6a\u88ab\u6b63\u5f0f\u539f\u8c05\u5e76\u514d\u4e8e\u60e9\u7f5a\u3002"}, "usage_en": "Used when someone is officially forgiven for a crime by an authority.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u56e0\u72af\u7f6a\u88ab\u6743\u5a01\u673a\u6784\u6b63\u5f0f\u539f\u8c05\u65f6\u3002", "scene_en": "A governor signing a document to release a prisoner.", "scene_cn": "\u5dde\u957f\u7b7e\u7f72\u6587\u4ef6\u91ca\u653e\u56da\u72af\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q8_pardoned_1.png", "P6_vocabulary_exercises_33_Q8_pardoned_2.png"], "examples": [{"en": "The president pardoned several inmates on Thanksgiving, showing an act of mercy.", "cn": "\u603b\u7edf\u5728\u611f\u6069\u8282\u8d66\u514d\u4e86\u51e0\u540d\u56da\u72af\uff0c\u8868\u73b0\u51fa\u4e00\u79cd\u4ec1\u6148\u7684\u884c\u4e3a\u3002"}, {"en": "He was pardoned after serving ten years of his sentence due to good behavior.", "cn": "\u7531\u4e8e\u8868\u73b0\u826f\u597d\uff0c\u4ed6\u5728\u670d\u5211\u5341\u5e74\u540e\u88ab\u8d66\u514d\u3002"}]}, {"word": "suspended", "ipa": "/s\u0259\u02c8sp\u025bnd\u026ad/", "meanings": {"en": "Temporarily prevented from continuing or being in force or effect.", "cn": "\u6682\u65f6\u963b\u6b62\u7ee7\u7eed\u6216\u751f\u6548\u3002"}, "usage_en": "Used when something is temporarily stopped or put on hold.", "usage_cn": "\u7528\u4e8e\u67d0\u4e8b\u88ab\u6682\u65f6\u505c\u6b62\u6216\u6401\u7f6e\u65f6\u3002", "scene_en": "A construction site with work temporarily halted.", "scene_cn": "\u4e00\u4e2a\u5efa\u7b51\u5de5\u5730\uff0c\u5de5\u4f5c\u6682\u65f6\u505c\u6b62\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q8_suspended_1.png", "P6_vocabulary_exercises_33_Q8_suspended_2.png"], "examples": [{"en": "The employee was suspended from his duties pending an investigation into the allegations.", "cn": "\u8be5\u96c7\u5458\u88ab\u505c\u804c\uff0c\u7b49\u5f85\u5bf9\u6307\u63a7\u7684\u8c03\u67e5\u3002"}, {"en": "Negotiations between the two companies were suspended due to disagreements over the terms.", "cn": "\u7531\u4e8e\u5bf9\u6761\u6b3e\u5b58\u5728\u5206\u6b67\uff0c\u4e24\u5bb6\u516c\u53f8\u4e4b\u95f4\u7684\u8c08\u5224\u6682\u505c\u3002"}]}], "synonym_cn": "\u5f00\u91ca vs. \u514d\u9664 vs. \u8d66\u514d vs. \u6682\u505c", "socratic_questions": [{"question": "If a judge declares someone not guilty due to a lack of evidence, are they being _______?", "options": ["acquitted", "absolved", "pardoned", "suspended"], "correct_answer": "acquitted", "explanation": "Acquitted means declared not guilty; absolved means freed from blame; pardoned means forgiven; suspended means temporarily prevented."}, {"question": "If someone is found not responsible for a wrongdoing, are they being _______ of the blame?", "options": ["acquitted", "absolved", "pardoned", "suspended"], "correct_answer": "absolved", "explanation": "Absolved means freed from blame; acquitted means declared not guilty; pardoned means forgiven; suspended means temporarily prevented."}, {"question": "If a governor releases a prisoner from jail, are they being _______ of their sentence?", "options": ["acquitted", "absolved", "pardoned", "suspended"], "correct_answer": "pardoned", "explanation": "Pardoned means forgiven or released from punishment; acquitted means declared not guilty; absolved means freed from blame; suspended means temporarily prevented."}, {"question": "If a player is temporarily banned from a game, are they being _______ from playing?", "options": ["acquitted", "absolved", "pardoned", "suspended"], "correct_answer": "suspended", "explanation": "Suspended means temporarily prevented; acquitted means declared not guilty; absolved means freed from blame; pardoned means forgiven."}]}, {"id": 9, "stem": "The clock chimed at regular _______.", "correct_index": 3, "options": [{"word": "sections", "ipa": "\u02c8sek\u0283\u0259nz", "meanings": {"en": "Separate parts or divisions of something.", "cn": "\u67d0\u7269\u7684\u72ec\u7acb\u90e8\u5206\u6216\u5212\u5206\u3002"}, "usage_en": "Used to divide a whole into distinct parts.", "usage_cn": "\u7528\u4e8e\u5c06\u6574\u4f53\u5212\u5206\u4e3a\u4e0d\u540c\u7684\u90e8\u5206\u3002", "scene_en": "A library with different sections for fiction, non-fiction, and reference materials.", "scene_cn": "\u4e00\u4e2a\u56fe\u4e66\u9986\uff0c\u5176\u4e2d\u6709\u5c0f\u8bf4\u3001\u975e\u5c0f\u8bf4\u548c\u53c2\u8003\u8d44\u6599\u7684\u4e0d\u540c\u533a\u57df\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q9_sections_1.png", "P6_vocabulary_exercises_33_Q9_sections_2.png"], "examples": [{"en": "The book is divided into three sections, each covering a different historical period.", "cn": "\u8fd9\u672c\u4e66\u5206\u4e3a\u4e09\u4e2a\u90e8\u5206\uff0c\u6bcf\u4e2a\u90e8\u5206\u6db5\u76d6\u4e0d\u540c\u7684\u5386\u53f2\u65f6\u671f\u3002"}, {"en": "The orchestra is seated in sections: strings, woodwinds, brass, and percussion, for balanced sound.", "cn": "\u7ba1\u5f26\u4e50\u961f\u6309\u90e8\u5206\u5c31\u5ea7\uff1a\u5f26\u4e50\u3001\u6728\u7ba1\u4e50\u5668\u3001\u94dc\u7ba1\u4e50\u5668\u548c\u6253\u51fb\u4e50\u5668\uff0c\u4ee5\u83b7\u5f97\u5e73\u8861\u7684\u58f0\u97f3\u3002"}]}, {"word": "time", "ipa": "ta\u026am", "meanings": {"en": "The indefinite continued progress of existence and events in the past, present, and future regarded as a whole.", "cn": "\u8fc7\u53bb\u3001\u73b0\u5728\u548c\u672a\u6765\u5b58\u5728\u548c\u4e8b\u4ef6\u7684\u65e0\u9650\u6301\u7eed\u8fdb\u5c55\uff0c\u88ab\u89c6\u4e3a\u4e00\u4e2a\u6574\u4f53\u3002"}, "usage_en": "Used to measure duration and sequence of events.", "usage_cn": "\u7528\u4e8e\u6d4b\u91cf\u4e8b\u4ef6\u7684\u6301\u7eed\u65f6\u95f4\u548c\u987a\u5e8f\u3002", "scene_en": "A clock ticking, showing the passage of time.", "scene_cn": "\u4e00\u4e2a\u65f6\u949f\u6ef4\u7b54\u4f5c\u54cd\uff0c\u663e\u793a\u65f6\u95f4\u7684\u6d41\u901d\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q9_time_1.png", "P6_vocabulary_exercises_33_Q9_time_2.png"], "examples": [{"en": "We had a wonderful time at the beach, building sandcastles and swimming in the ocean.", "cn": "\u6211\u4eec\u5728\u6d77\u6ee9\u4e0a\u5ea6\u8fc7\u4e86\u4e00\u6bb5\u7f8e\u597d\u7684\u65f6\u5149\uff0c\u5806\u6c99\u5821\u5e76\u5728\u6d77\u91cc\u6e38\u6cf3\u3002"}, {"en": "The time it takes to complete the project depends on the availability of resources.", "cn": "\u5b8c\u6210\u9879\u76ee\u6240\u9700\u7684\u65f6\u95f4\u53d6\u51b3\u4e8e\u8d44\u6e90\u7684\u53ef\u7528\u6027\u3002"}]}, {"word": "fractions", "ipa": "\u02c8fr\u00e6k\u0283\u0259nz", "meanings": {"en": "Numerical quantities that are not whole numbers.", "cn": "\u4e0d\u662f\u6574\u6570\u7684\u6570\u503c\u91cf\u3002"}, "usage_en": "Used to represent parts of a whole.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u6574\u4f53\u7684\u90e8\u5206\u3002", "scene_en": "A pie cut into several slices, each representing a fraction of the whole.", "scene_cn": "\u4e00\u4e2a\u9985\u997c\u88ab\u5207\u6210\u51e0\u5757\uff0c\u6bcf\u5757\u4ee3\u8868\u6574\u4f53\u7684\u4e00\u90e8\u5206\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q9_fractions_1.png", "P6_vocabulary_exercises_33_Q9_fractions_2.png"], "examples": [{"en": "In mathematics, we learn about fractions and how to add, subtract, multiply, and divide them.", "cn": "\u5728\u6570\u5b66\u4e2d\uff0c\u6211\u4eec\u5b66\u4e60\u5206\u6570\u4ee5\u53ca\u5982\u4f55\u5bf9\u5b83\u4eec\u8fdb\u884c\u52a0\u3001\u51cf\u3001\u4e58\u3001\u9664\u8fd0\u7b97\u3002"}, {"en": "The recipe calls for a fraction of a teaspoon of salt to enhance the flavor.", "cn": "\u8be5\u98df\u8c31\u8981\u6c42\u52a0\u5165\u4e00\u5c0f\u90e8\u5206\u8336\u5319\u7684\u76d0\u6765\u589e\u5f3a\u98ce\u5473\u3002"}]}, {"word": "intervals", "ipa": "\u02c8\u026ant\u0259rv\u0259lz", "meanings": {"en": "Periods of time between events or moments.", "cn": "\u4e8b\u4ef6\u6216\u65f6\u523b\u4e4b\u95f4\u7684\u65f6\u95f4\u6bb5\u3002"}, "usage_en": "Used to describe recurring gaps in time.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u65f6\u95f4\u4e0a\u7684\u91cd\u590d\u95f4\u9694\u3002", "scene_en": "A metronome ticking at regular intervals.", "scene_cn": "\u4e00\u4e2a\u8282\u62cd\u5668\u4ee5\u56fa\u5b9a\u7684\u95f4\u9694\u6ef4\u7b54\u4f5c\u54cd\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q9_intervals_1.png", "P6_vocabulary_exercises_33_Q9_intervals_2.png"], "examples": [{"en": "The medication must be taken at regular intervals throughout the day to maintain its effectiveness.", "cn": "\u836f\u7269\u5fc5\u987b\u5728\u4e00\u5929\u4e2d\u4ee5\u56fa\u5b9a\u7684\u95f4\u9694\u670d\u7528\uff0c\u4ee5\u4fdd\u6301\u5176\u6709\u6548\u6027\u3002"}, {"en": "The train departs from the station at intervals of every thirty minutes during peak hours.", "cn": "\u5728\u9ad8\u5cf0\u65f6\u6bb5\uff0c\u706b\u8f66\u6bcf\u4e09\u5341\u5206\u949f\u4ece\u8f66\u7ad9\u51fa\u53d1\u4e00\u6b21\u3002"}]}], "synonym_cn": "\u5468\u671f\uff0c\u65f6\u6bb5\uff0c\u8282\u5f8b", "socratic_questions": [{"question": "If a recipe calls for adding ingredients at specific points in the cooking process, are these points referred to as 'sections', 'time', 'fractions', or 'intervals'?", "options": ["sections", "time", "fractions", "intervals"], "correct_answer": "intervals", "explanation": "Cooking instructions often specify adding ingredients at regular intervals to ensure proper mixing and cooking."}, {"question": "In a school play, if the stage is divided into different areas for various scenes, are these areas called 'sections', 'time', 'fractions', or 'intervals'?", "options": ["sections", "time", "fractions", "intervals"], "correct_answer": "sections", "explanation": "A stage is often divided into sections to represent different locations or settings within the play."}, {"question": "When measuring ingredients for baking, are you more likely to use 'sections', 'time', 'fractions', or 'intervals' to ensure the correct proportions?", "options": ["sections", "time", "fractions", "intervals"], "correct_answer": "fractions", "explanation": "Baking often requires precise measurements using fractions to achieve the desired outcome."}, {"question": "When scheduling a meeting, are you determining the 'sections', 'time', 'fractions', or 'intervals' at which it will occur?", "options": ["sections", "time", "fractions", "intervals"], "correct_answer": "time", "explanation": "Scheduling involves determining the specific time when an event will take place."}]}, {"id": 10, "stem": "Everyone was waiting in _______ for the daywhen the princess would become their beloved queen.", "correct_index": 1, "options": [{"word": "anxiety", "ipa": "/\u00e6\u014b\u02c8za\u026a\u0259ti/", "meanings": {"en": "A feeling of worry, nervousness, or unease about something with an uncertain outcome.", "cn": "\u5bf9\u7ed3\u679c\u4e0d\u786e\u5b9a\u7684\u4e8b\u60c5\u611f\u5230\u62c5\u5fc3\u3001\u7d27\u5f20\u6216\u4e0d\u5b89\u7684\u611f\u89c9\u3002"}, "usage_en": "Used to describe a state of worry or unease.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u79cd\u62c5\u5fc3\u6216\u4e0d\u5b89\u7684\u72b6\u6001\u3002", "scene_en": "A student biting their nails before an exam, showing worry.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u5728\u8003\u8bd5\u524d\u54ac\u6307\u7532\uff0c\u8868\u73b0\u51fa\u7126\u8651\u3002", "image_paths": ["P6_vocabulary_exercises_33_Q10_anxiety_1.png", "P6_vocabulary_exercises_33_Q10_anxiety_2.png"], "examples": [{"en": "Her anxiety about the presentation was evident in her shaky voice and sweaty palms.", "cn": "\u5979\u5bf9\u6f14\u8bb2\u7684\u7126\u8651\u5728\u5979\u98a4\u6296\u7684\u58f0\u97f3\u548c\u6e7f\u6f09\u6f09\u7684\u624b\u638c\u4e2d\u663e\u800c\u6613\u89c1\u3002"}, {"en": "The constant anxiety he felt about his job security affected his overall health.", "cn": "\u4ed6\u5bf9\u5de5\u4f5c\u4fdd\u969c\u6301\u7eed\u7684\u7126\u8651\u5f71\u54cd\u4e86
