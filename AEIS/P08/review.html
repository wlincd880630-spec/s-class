84\u4e00\u90e8\u5206\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q1_disguise_1.png", "P6_vocabulary_exercises_8_Q1_disguise_2.png"], "examples": [{"en": "She wore a disguise to the party so no one would recognize her true identity.", "cn": "\u5979\u6234\u7740\u4f2a\u88c5\u53bb\u53c2\u52a0\u805a\u4f1a\uff0c\u8fd9\u6837\u5c31\u4e0d\u4f1a\u6709\u4eba\u8ba4\u51fa\u5979\u7684\u771f\u5b9e\u8eab\u4efd\u3002"}, {"en": "The detective used a disguise to infiltrate the criminal organization without raising suspicion.", "cn": "\u4fa6\u63a2\u4f7f\u7528\u4f2a\u88c5\u6e17\u900f\u5230\u72af\u7f6a\u7ec4\u7ec7\u4e2d\uff0c\u800c\u6ca1\u6709\u5f15\u8d77\u6000\u7591\u3002"}]}, {"word": "undercover", "ipa": "/\u02cc\u028cnd\u0259r\u02c8k\u028cv\u0259r/", "meanings": {"en": "involving secret work within a group or organization, especially for the police or government.", "cn": "\u6d89\u53ca\u5728\u4e00\u4e2a\u56e2\u4f53\u6216\u7ec4\u7ec7\u5185\u90e8\u7684\u79d8\u5bc6\u5de5\u4f5c\uff0c\u7279\u522b\u662f\u4e3a\u8b66\u5bdf\u6216\u653f\u5e9c\u5de5\u4f5c\u3002"}, "usage_en": "Undercover operations are risky but can provide valuable intelligence.", "usage_cn": "\u5367\u5e95\u884c\u52a8\u98ce\u9669\u5f88\u9ad8\uff0c\u4f46\u53ef\u4ee5\u63d0\u4f9b\u6709\u4ef7\u503c\u7684\u60c5\u62a5\u3002", "scene_en": "An undercover police officer meeting with informants in a dark alley.", "scene_cn": "\u4e00\u540d\u5367\u5e95\u8b66\u5bdf\u5728\u9ed1\u6697\u7684\u5c0f\u5df7\u91cc\u4e0e\u7ebf\u4eba\u4f1a\u9762\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q1_undercover_1.png", "P6_vocabulary_exercises_8_Q1_undercover_2.png"], "examples": [{"en": "The police sent an undercover agent to investigate the drug trafficking ring effectively.", "cn": "\u8b66\u65b9\u6d3e\u51fa\u4e86\u4e00\u540d\u5367\u5e95\u7279\u5de5\uff0c\u6709\u6548\u5730\u8c03\u67e5\u4e86\u8d29\u6bd2\u56e2\u4f19\u3002"}, {"en": "Working undercover required him to maintain his false identity at all times, carefully.", "cn": "\u5367\u5e95\u5de5\u4f5c\u8981\u6c42\u4ed6\u59cb\u7ec8\u5c0f\u5fc3\u5730\u4fdd\u6301\u865a\u5047\u8eab\u4efd\u3002"}]}], "synonym_cn": "\u6b3a\u9a97 vs. \u5931\u8d25 vs. \u4f2a\u88c5 vs. \u5367\u5e95", "socratic_questions": [{"question": "In a play, which role involves changing your appearance and voice to become someone else?", "options": ["deceit", "defeat", "disguise", "undercover"], "correct_answer": "disguise", "explanation": "Disguise means to change your appearance to conceal your identity."}, {"question": "When a military operation requires a soldier to infiltrate enemy lines secretly, what kind of work is this?", "options": ["deceit", "defeat", "disguise", "undercover"], "correct_answer": "undercover", "explanation": "Undercover work involves concealing one's true identity to gather information."}, {"question": "If someone consistently lies to their friends about their achievements, what are they engaging in?", "options": ["deceit", "defeat", "disguise", "undercover"], "correct_answer": "deceit", "explanation": "Deceit involves intentionally misleading or lying to others."}, {"question": "After a sports team loses a crucial championship game, what do they experience?", "options": ["deceit", "defeat", "disguise", "undercover"], "correct_answer": "defeat", "explanation": "Defeat means losing in a competition or struggle."}]}, {"id": 2, "stem": "He had his _______ told because he wanted to know his future.", "correct_index": 2, "options": [{"word": "chance", "ipa": "/t\u0283\u00e6ns/", "meanings": {"en": "A possibility of something happening.", "cn": "\u67d0\u4e8b\u53d1\u751f\u7684\u53ef\u80fd\u6027\u3002"}, "usage_en": "Used to describe the probability or opportunity for something to occur.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u53d1\u751f\u7684\u6982\u7387\u6216\u673a\u4f1a\u3002", "scene_en": "A person flipping a coin, representing the uncertainty and possibility of different outcomes.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u629b\u786c\u5e01\uff0c\u4ee3\u8868\u7740\u4e0d\u786e\u5b9a\u6027\u548c\u4e0d\u540c\u7ed3\u679c\u7684\u53ef\u80fd\u6027\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q2_chance_1.png", "P6_vocabulary_exercises_8_Q2_chance_2.png"], "examples": [{"en": "There's a good chance that it will rain later this afternoon, so bring umbrella.", "cn": "\u4eca\u5929\u4e0b\u5348\u5f88\u6709\u53ef\u80fd\u4f1a\u4e0b\u96e8\uff0c\u6240\u4ee5\u5e26\u628a\u4f1e\u3002"}, {"en": "He took a chance by investing all his savings in the new company stock.", "cn": "\u4ed6\u5192\u9669\u5c06\u6240\u6709\u79ef\u84c4\u6295\u8d44\u4e8e\u8fd9\u5bb6\u65b0\u516c\u53f8\u7684\u80a1\u7968\u3002"}]}, {"word": "destiny", "ipa": "/\u02c8dest\u026ani/", "meanings": {"en": "The events that will necessarily happen to a particular person or thing in the future.", "cn": "\u5c06\u6765\u4e00\u5b9a\u4f1a\u53d1\u751f\u5728\u7279\u5b9a\u4eba\u6216\u4e8b\u7269\u8eab\u4e0a\u7684\u4e8b\u4ef6\u3002"}, "usage_en": "Refers to a predetermined course of events, often seen as inevitable.", "usage_cn": "\u6307\u9884\u5b9a\u7684\u4e8b\u4ef6\u8fdb\u7a0b\uff0c\u901a\u5e38\u88ab\u8ba4\u4e3a\u662f\u4e0d\u53ef\u907f\u514d\u7684\u3002", "scene_en": "A winding road leading to a distant, glowing city, symbolizing a predetermined path.", "scene_cn": "\u4e00\u6761\u873f\u8712\u7684\u9053\u8def\u901a\u5411\u9065\u8fdc\u7684\u53d1\u5149\u57ce\u5e02\uff0c\u8c61\u5f81\u7740\u9884\u5b9a\u7684\u9053\u8def\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q2_destiny_1.png", "P6_vocabulary_exercises_8_Q2_destiny_2.png"], "examples": [{"en": "She believed it was her destiny to become a famous singer, so she practiced daily.", "cn": "\u5979\u76f8\u4fe1\u6210\u4e3a\u4e00\u540d\u8457\u540d\u7684\u6b4c\u624b\u662f\u5979\u7684\u547d\u8fd0\uff0c\u6240\u4ee5\u5979\u6bcf\u5929\u90fd\u7ec3\u4e60\u3002"}, {"en": "Despite facing many obstacles, he felt it was his destiny to help others in need.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u8bb8\u591a\u969c\u788d\uff0c\u4ed6\u89c9\u5f97\u5e2e\u52a9\u6709\u9700\u8981\u7684\u4eba\u662f\u4ed6\u7684\u547d\u8fd0\u3002"}]}, {"word": "fate", "ipa": "/fe\u026at/", "meanings": {"en": "The development of events beyond a person's control, regarded as predetermined by a supernatural power.", "cn": "\u8d85\u51fa\u4e2a\u4eba\u63a7\u5236\u8303\u56f4\u7684\u4e8b\u4ef6\u53d1\u5c55\uff0c\u88ab\u8ba4\u4e3a\u662f\u8d85\u81ea\u7136\u529b\u91cf\u9884\u5148\u51b3\u5b9a\u7684\u3002"}, "usage_en": "Implies an inevitable and often negative outcome, beyond human control.", "usage_cn": "\u6697\u793a\u7740\u4e0d\u53ef\u907f\u514d\u4e14\u901a\u5e38\u662f\u8d1f\u9762\u7684\u7ed3\u679c\uff0c\u8d85\u51fa\u4eba\u7c7b\u7684\u63a7\u5236\u3002", "scene_en": "A dark and stormy sky with lightning striking, representing uncontrollable and powerful forces.", "scene_cn": "\u9ed1\u6697\u800c\u66b4\u98ce\u96e8\u7684\u5929\u7a7a\uff0c\u95ea\u7535\u51fb\u4e2d\uff0c\u4ee3\u8868\u7740\u65e0\u6cd5\u63a7\u5236\u7684\u5f3a\u5927\u529b\u91cf\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q2_fate_1.png", "P6_vocabulary_exercises_8_Q2_fate_2.png"], "examples": [{"en": "It was fate that brought them together, as they met unexpectedly during a storm.", "cn": "\u662f\u547d\u8fd0\u5c06\u4ed6\u4eec\u8054\u7cfb\u5728\u4e00\u8d77\uff0c\u56e0\u4e3a\u4ed6\u4eec\u5728\u66b4\u98ce\u96e8\u4e2d\u610f\u5916\u76f8\u9047\u3002"}, {"en": "He accepted his fate with courage, knowing there was nothing he could do to change it.", "cn": "\u4ed6\u52c7\u6562\u5730\u63a5\u53d7\u4e86\u81ea\u5df1\u7684\u547d\u8fd0\uff0c\u77e5\u9053\u4ed6\u65e0\u80fd\u4e3a\u529b\u6539\u53d8\u5b83\u3002"}]}, {"word": "fortune", "ipa": "/\u02c8f\u0254\u02d0rt\u0283\u0259n/", "meanings": {"en": "Chance or luck as an external, arbitrary force affecting human affairs.", "cn": "\u4f5c\u4e3a\u5f71\u54cd\u4eba\u7c7b\u4e8b\u52a1\u7684\u5916\u90e8\u3001\u4efb\u610f\u529b\u91cf\u7684\u673a\u9047\u6216\u8fd0\u6c14\u3002"}, "usage_en": "Refers to luck, especially good luck that brings wealth or success.", "usage_cn": "\u6307\u8fd0\u6c14\uff0c\u5c24\u5176\u662f\u5e26\u6765\u8d22\u5bcc\u6216\u6210\u529f\u7684\u826f\u597d\u8fd0\u6c14\u3002", "scene_en": "A pile of gold coins and a winning lottery ticket, symbolizing wealth and good luck.", "scene_cn": "\u4e00\u5806\u91d1\u5e01\u548c\u4e00\u5f20\u4e2d\u5956\u5f69\u7968\uff0c\u8c61\u5f81\u7740\u8d22\u5bcc\u548c\u597d\u8fd0\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q2_fortune_1.png", "P6_vocabulary_exercises_8_Q2_fortune_2.png"], "examples": [{"en": "She made a fortune in the stock market by investing in technology companies early on.", "cn": "\u5979\u901a\u8fc7\u65e9\u671f\u6295\u8d44\u79d1\u6280\u516c\u53f8\u5728\u80a1\u5e02\u4e0a\u53d1\u4e86\u8d22\u3002"}, {"en": "His good fortune continued when he found a valuable antique at a flea market last week.", "cn": "\u4e0a\u5468\u4ed6\u5728\u8df3\u86a4\u5e02\u573a\u53d1\u73b0\u4e86\u4e00\u4ef6\u6709\u4ef7\u503c\u7684\u53e4\u8463\uff0c\u4ed6\u7684\u597d\u8fd0\u8fd8\u5728\u7ee7\u7eed\u3002"}]}], "synonym_cn": "\u547d\u8fd0\uff0c\u5b9a\u6570\uff0c\u5929\u6570 (all related to predetermination)", "socratic_questions": [{"question": "If you study hard for the exam, do you believe you are improving your _______ of passing?", "options": ["chance", "destiny", "fate", "fortune"], "correct_answer": "chance", "explanation": "Chance refers to the possibility of something happening, influenced by effort."}, {"question": "Some people believe that marrying their childhood sweetheart is their _______, something they cannot avoid.", "options": ["chance", "destiny", "fate", "fortune"], "correct_answer": "destiny", "explanation": "Destiny suggests a predetermined course of events, often seen as unavoidable."}, {"question": "In many stories, a hero's _______ is intertwined with a powerful artifact, shaping their journey.", "options": ["chance", "destiny", "fate", "fortune"], "correct_answer": "fate", "explanation": "Fate implies an inevitable and often negative outcome, beyond human control."}, {"question": "Winning the lottery is often seen as a stroke of good _______, bringing unexpected wealth.", "options": ["chance", "destiny", "fate", "fortune"], "correct_answer": "fortune", "explanation": "Fortune refers to luck, especially good luck that brings wealth or success."}]}, {"id": 3, "stem": "My uncle is _______ because he injured his leg when he was small.", "correct_index": 2, "options": [{"word": "deaf", "ipa": "/def/", "meanings": {"en": "Unable to hear, either completely or partially.", "cn": "\u4e0d\u80fd\u542c\u89c1\uff0c\u65e0\u8bba\u662f\u5b8c\u5168\u8fd8\u662f\u90e8\u5206\u3002"}, "usage_en": "Used to describe someone with hearing impairment.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6709\u542c\u529b\u969c\u788d\u7684\u4eba\u3002", "scene_en": "A person using sign language to communicate.", "scene_cn": "\u4e00\u4e2a\u4eba\u4f7f\u7528\u624b\u8bed\u8fdb\u884c\u4ea4\u6d41\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q3_deaf_1.png", "P6_vocabulary_exercises_8_Q3_deaf_2.png"], "examples": [{"en": "The teacher learned sign language to better communicate with her deaf students.", "cn": "\u8001\u5e08\u5b66\u4e60\u4e86\u624b\u8bed\uff0c\u4ee5\u4fbf\u66f4\u597d\u5730\u4e0e\u5979\u7684\u5931\u806a\u5b66\u751f\u4ea4\u6d41\u3002"}, {"en": "Even with a hearing aid, my grandfather is still quite deaf in one ear.", "cn": "\u5373\u4f7f\u6234\u7740\u52a9\u542c\u5668\uff0c\u6211\u7684\u7956\u7236\u4ecd\u7136\u6709\u4e00\u53ea\u8033\u6735\u51e0\u4e4e\u5931\u806a\u3002"}]}, {"word": "dumb", "ipa": "/d\u028cm/", "meanings": {"en": "Unable to speak; also, temporarily speechless.", "cn": "\u4e0d\u80fd\u8bf4\u8bdd\uff1b\u4e5f\u6307\u6682\u65f6\u8bf4\u4e0d\u51fa\u8bdd\u3002"}, "usage_en": "Describes someone who cannot speak or is temporarily speechless.", "usage_cn": "\u63cf\u8ff0\u4e0d\u80fd\u8bf4\u8bdd\u6216\u6682\u65f6\u8bf4\u4e0d\u51fa\u8bdd\u7684\u4eba\u3002", "scene_en": "A person trying to communicate without speaking.", "scene_cn": "\u4e00\u4e2a\u4eba\u8bd5\u56fe\u4e0d\u8bf4\u8bdd\u8fdb\u884c\u4ea4\u6d41\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q3_dumb_1.png", "P6_vocabulary_exercises_8_Q3_dumb_2.png"], "examples": [{"en": "The shock of the accident left her temporarily dumb, unable to utter a word.", "cn": "\u4e8b\u6545\u7684\u9707\u60ca\u4f7f\u5979\u6682\u65f6\u8bf4\u4e0d\u51fa\u8bdd\u6765\uff0c\u65e0\u6cd5\u8bf4\u51fa\u4e00\u4e2a\u5b57\u3002"}, {"en": "Although he is dumb, he communicates effectively using a special communication board.", "cn": "\u867d\u7136\u4ed6\u4e0d\u80fd\u8bf4\u8bdd\uff0c\u4f46\u4ed6\u4f7f\u7528\u7279\u6b8a\u7684\u4ea4\u6d41\u677f\u6709\u6548\u5730\u8fdb\u884c\u4ea4\u6d41\u3002"}]}, {"word": "lame", "ipa": "/le\u026am/", "meanings": {"en": "Having a limb, especially a leg or foot, disabled so as to impair movement.", "cn": "\u56db\u80a2\uff0c\u7279\u522b\u662f\u817f\u6216\u811a\uff0c\u6b8b\u75be\u4ee5\u81f4\u5f71\u54cd\u6d3b\u52a8\u3002"}, "usage_en": "Describes someone with an impaired limb, affecting movement.", "usage_cn": "\u63cf\u8ff0\u56db\u80a2\u53d7\u635f\uff0c\u5f71\u54cd\u6d3b\u52a8\u7684\u4eba\u3002", "scene_en": "A person walking with a limp or using a cane.", "scene_cn": "\u4e00\u4e2a\u4eba\u8ddb\u884c\u6216\u4f7f\u7528\u62d0\u6756\u884c\u8d70\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q3_lame_1.png", "P6_vocabulary_exercises_8_Q3_lame_2.png"], "examples": [{"en": "After the car accident, he was lame for several months while his leg healed.", "cn": "\u8f66\u7978\u540e\uff0c\u4ed6\u7684\u817f\u5728\u6108\u5408\u7684\u51e0\u4e2a\u6708\u91cc\u90fd\u662f\u7638\u7684\u3002"}, {"en": "The old dog was lame and could only walk short distances before needing to rest.", "cn": "\u90a3\u53ea\u8001\u72d7\u662f\u7638\u7684\uff0c\u53ea\u80fd\u8d70\u5f88\u77ed\u7684\u8ddd\u79bb\uff0c\u7136\u540e\u9700\u8981\u4f11\u606f\u3002"}]}, {"word": "blind", "ipa": "/bla\u026and/", "meanings": {"en": "Unable to see because of injury, disease, or a congenital condition.", "cn": "\u7531\u4e8e\u53d7\u4f24\u3001\u75be\u75c5\u6216\u5148\u5929\u6027\u75be\u75c5\u800c\u65e0\u6cd5\u770b\u89c1\u3002"}, "usage_en": "Describes someone who cannot see.", "usage_cn": "\u63cf\u8ff0\u770b\u4e0d\u89c1\u4e1c\u897f\u7684\u4eba\u3002", "scene_en": "A person using a white cane to navigate.", "scene_cn": "\u4e00\u4e2a\u4eba\u4f7f\u7528\u767d\u8272\u624b\u6756\u5bfc\u822a\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q3_blind_1.png", "P6_vocabulary_exercises_8_Q3_blind_2.png"], "examples": [{"en": "The blind man used his cane to navigate the busy city streets safely and confidently.", "cn": "\u8fd9\u4f4d\u76f2\u4eba\u4f7f\u7528\u4ed6\u7684\u624b\u6756\u5b89\u5168\u81ea\u4fe1\u5730\u5728\u7e41\u5fd9\u7684\u57ce\u5e02\u8857\u9053\u4e0a\u884c\u8d70\u3002"}, {"en": "She learned to read Braille after becoming blind, opening up a new world of literature.", "cn": "\u5931\u660e\u540e\uff0c\u5979\u5b66\u4f1a\u4e86\u9605\u8bfb\u76f2\u6587\uff0c\u5f00\u542f\u4e86\u4e00\u4e2a\u65b0\u7684\u6587\u5b66\u4e16\u754c\u3002"}]}], "synonym_cn": "\u6b8b\u75be, \u884c\u52a8\u4e0d\u4fbf", "socratic_questions": [{"question": "If someone cannot hear anything, are they likely to be 'deaf', 'dumb', 'lame', or 'blind'?", "options": ["deaf", "dumb", "lame", "blind"], "correct_answer": "deaf", "explanation": "Deaf means unable to hear. The other options relate to speech, leg injury, and sight, respectively."}, {"question": "If a person cannot speak, would you describe them as 'deaf', 'dumb', 'lame', or 'blind'?", "options": ["deaf", "dumb", "lame", "blind"], "correct_answer": "dumb", "explanation": "Dumb means unable to speak. The other options relate to hearing, leg injury, and sight, respectively."}, {"question": "Which word describes someone who has difficulty walking due to an injury: 'deaf', 'dumb', 'lame', or 'blind'?", "options": ["deaf", "dumb", "lame", "blind"], "correct_answer": "lame", "explanation": "Lame means having difficulty walking, typically due to an injury. The other options relate to hearing, speech, and sight, respectively."}, {"question": "If someone cannot see, are they 'deaf', 'dumb', 'lame', or 'blind'?", "options": ["deaf", "dumb", "lame", "blind"], "correct_answer": "blind", "explanation": "Blind means unable to see. The other options relate to hearing, speech, and leg injury, respectively."}]}, {"id": 4, "stem": "I like her new dress as the colour _______ her.", "correct_index": 0, "options": [{"word": "suits", "ipa": "/su\u02d0ts/", "meanings": {"en": "To be appropriate or flattering for someone.", "cn": "\u5bf9\u67d0\u4eba\u6765\u8bf4\u662f\u5408\u9002\u7684\u6216\u8ba8\u4eba\u559c\u6b22\u7684\u3002"}, "usage_en": "Used to describe something that looks good on someone or is appropriate for a situation.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u5728\u67d0\u4eba\u8eab\u4e0a\u770b\u8d77\u6765\u4e0d\u9519\u6216\u9002\u5408\u67d0\u79cd\u60c5\u51b5\u3002", "scene_en": "A person trying on clothes in a store, deciding if the color and style are flattering.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u5546\u5e97\u8bd5\u7a7f\u8863\u670d\uff0c\u51b3\u5b9a\u989c\u8272\u548c\u6b3e\u5f0f\u662f\u5426\u8ba8\u4eba\u559c\u6b22\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q4_suits_1.png", "P6_vocabulary_exercises_8_Q4_suits_2.png"], "examples": [{"en": "That blue dress really suits you; it brings out the color in your eyes.", "cn": "\u90a3\u4ef6\u84dd\u8272\u8fde\u8863\u88d9\u771f\u9002\u5408\u4f60\uff1b\u5b83\u886c\u6258\u51fa\u4f60\u773c\u775b\u7684\u989c\u8272\u3002"}, {"en": "This calm weather suits my mood perfectly, making me feel relaxed and content.", "cn": "\u8fd9\u79cd\u5e73\u9759\u7684\u5929\u6c14\u975e\u5e38\u9002\u5408\u6211\u7684\u5fc3\u60c5\uff0c\u8ba9\u6211\u611f\u5230\u653e\u677e\u548c\u6ee1\u8db3\u3002"}]}, {"word": "fits", "ipa": "/f\u026ats/", "meanings": {"en": "To be of the right size or shape.", "cn": "\u5c3a\u5bf8\u6216\u5f62\u72b6\u6b63\u786e\u3002"}, "usage_en": "Used to describe something that is the correct size or shape for something else.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u7684\u5c3a\u5bf8\u6216\u5f62\u72b6\u5bf9\u4e8e\u5176\u4ed6\u4e8b\u7269\u6765\u8bf4\u662f\u6b63\u786e\u7684\u3002", "scene_en": "A person trying on shoes to see if they are the right size.", "scene_cn": "\u4e00\u4e2a\u4eba\u8bd5\u7a7f\u978b\u5b50\uff0c\u770b\u770b\u5c3a\u5bf8\u662f\u5426\u5408\u9002\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q4_fits_1.png", "P6_vocabulary_exercises_8_Q4_fits_2.png"], "examples": [{"en": "This key fits the lock perfectly, allowing me to open the door easily now.", "cn": "\u8fd9\u628a\u94a5\u5319\u975e\u5e38\u9002\u5408\u8fd9\u628a\u9501\uff0c\u73b0\u5728\u6211\u53ef\u4ee5\u8f7b\u677e\u5730\u6253\u5f00\u95e8\u4e86\u3002"}, {"en": "The new cover fits the phone snugly, protecting it from scratches and minor damage.", "cn": "\u65b0\u624b\u673a\u58f3\u4e0e\u624b\u673a\u7d27\u5bc6\u8d34\u5408\uff0c\u4fdd\u62a4\u5b83\u514d\u53d7\u522e\u64e6\u548c\u8f7b\u5fae\u635f\u574f\u3002"}]}, {"word": "matches", "ipa": "/\u02c8m\u00e6t\u0283\u026az/", "meanings": {"en": "To be similar or identical to something else.", "cn": "\u4e0e\u522b\u7684\u4e1c\u897f\u76f8\u4f3c\u6216\u76f8\u540c\u3002"}, "usage_en": "Used to describe things that are alike or go well together.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u76f8\u4f3c\u6216\u642d\u914d\u5f97\u5f53\u7684\u4e8b\u7269\u3002", "scene_en": "A person coordinating the colors of their outfit to create a harmonious look.", "scene_cn": "\u4e00\u4e2a\u4eba\u534f\u8c03\u4ed6\u4eec\u670d\u88c5\u7684\u989c\u8272\uff0c\u4ee5\u521b\u9020\u548c\u8c10\u7684\u5916\u89c2\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q4_matches_1.png", "P6_vocabulary_exercises_8_Q4_matches_2.png"], "examples": [{"en": "Her handbag perfectly matches her shoes, creating a stylish and coordinated look overall.", "cn": "\u5979\u7684\u624b\u63d0\u5305\u4e0e\u5979\u7684\u978b\u5b50\u5b8c\u7f8e\u642d\u914d\uff0c\u8425\u9020\u51fa\u65f6\u5c1a\u4e14\u534f\u8c03\u7684\u6574\u4f53\u5916\u89c2\u3002"}, {"en": "The wallpaper matches the curtains, giving the room a cohesive and well-designed appearance.", "cn": "\u5899\u7eb8\u4e0e\u7a97\u5e18\u76f8\u914d\uff0c\u4f7f\u623f\u95f4\u5177\u6709\u51dd\u805a\u529b\u548c\u7cbe\u5fc3\u8bbe\u8ba1\u7684\u5916\u89c2\u3002"}]}, {"word": "shows", "ipa": "/\u0283o\u028az/", "meanings": {"en": "To be visible or apparent.", "cn": "\u53ef\u89c1\u7684\u6216\u660e\u663e\u7684\u3002"}, "usage_en": "Used to indicate that something is displayed or revealed.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u67d0\u4e8b\u7269\u88ab\u5c55\u793a\u6216\u63ed\u793a\u3002", "scene_en": "A person's face revealing their emotions through their expressions.", "scene_cn": "\u4e00\u4e2a\u4eba\u7684\u8138\u901a\u8fc7\u4ed6\u4eec\u7684\u8868\u60c5\u5c55\u73b0\u4ed6\u4eec\u7684\u60c5\u7eea\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q4_shows_1.png", "P6_vocabulary_exercises_8_Q4_shows_2.png"], "examples": [{"en": "The data clearly shows a significant increase in customer satisfaction over the past year.", "cn": "\u6570\u636e\u663e\u793a\uff0c\u8fc7\u53bb\u4e00\u5e74\u5ba2\u6237\u6ee1\u610f\u5ea6\u663e\u7740\u63d0\u9ad8\u3002"}, {"en": "Her tired expression shows that she has been working very hard on the project lately.", "cn": "\u5979\u75b2\u60eb\u7684\u8868\u60c5\u8868\u660e\u5979\u6700\u8fd1\u4e00\u76f4\u5728\u52aa\u529b\u5b8c\u6210\u8fd9\u4e2a\u9879\u76ee\u3002"}]}], "synonym_cn": "\u9002\u5408 (sh\u00ech\u00e9), \u642d\u914d (d\u0101p\u00e8i), \u76f8\u79f0 (xi\u0101ngch\u00e8n)", "socratic_questions": [{"question": "If a job's requirements align perfectly with your skills, does the job _______ you well?", "options": ["suits", "fits", "matches", "shows"], "correct_answer": "suits", "explanation": "\"Suits\" means the job is appropriate for your skills and experience."}, {"question": "If a key is the correct size but doesn't unlock the door, does it _______ the lock?", "options": ["suits", "fits", "matches", "shows"], "correct_answer": "fits", "explanation": "\"Fits\" refers to the physical dimensions being correct."}, {"question": "If two socks are identical in pattern and color, do they _______ each other?", "options": ["suits", "fits", "matches", "shows"], "correct_answer": "matches", "explanation": "\"Matches\" indicates that the two items are alike or correspond with each other."}, {"question": "If someone's nervousness is obvious in their trembling hands, does their anxiety _______?", "options": ["suits", "fits", "matches", "shows"], "correct_answer": "shows", "explanation": "\"Shows\" means that the nervousness is visible or apparent."}]}, {"id": 5, "stem": "When he heard that his mother had passed away, he _______ down and cried.", "correct_index": 1, "options": [{"word": "cracked", "ipa": "/kr\u00e6kt/", "meanings": {"en": "To fail under pressure; to show signs of strain.", "cn": "\u5728\u538b\u529b\u4e0b\u5931\u8d25\uff1b\u663e\u793a\u51fa\u7d27\u5f20\u7684\u8ff9\u8c61\u3002"}, "usage_en": "Used when someone is starting to struggle emotionally or mentally.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4eba\u5728\u60c5\u611f\u6216\u7cbe\u795e\u4e0a\u5f00\u59cb\u6323\u624e\u3002", "scene_en": "A person with dark circles under their eyes, looking stressed at a desk.", "scene_cn": "\u4e00\u4e2a\u4eba\u773c\u775b\u4e0b\u6709\u9ed1\u773c\u5708\uff0c\u5728\u684c\u5b50\u65c1\u770b\u8d77\u6765\u538b\u529b\u5f88\u5927\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q5_cracked_1.png", "P6_vocabulary_exercises_8_Q5_cracked_2.png"], "examples": [{"en": "After weeks of intense studying, he finally cracked under the pressure and took a break.", "cn": "\u7ecf\u8fc7\u51e0\u5468\u7684\u7d27\u5f20\u5b66\u4e60\uff0c\u4ed6\u6700\u7ec8\u5728\u538b\u529b\u4e0b\u5d29\u6e83\uff0c\u4f11\u606f\u4e86\u4e00\u4e0b\u3002"}, {"en": "The detective suspected the suspect would crack during the intense interrogation and reveal the truth.", "cn": "\u4fa6\u63a2\u6000\u7591\u5acc\u7591\u4eba\u5728\u4e25\u5389\u7684\u5ba1\u8baf\u4e2d\u4f1a\u5d29\u6e83\uff0c\u5e76\u63ed\u793a\u771f\u76f8\u3002"}]}, {"word": "broke", "ipa": "/bro\u028ak/", "meanings": {"en": "To succumb to grief or emotional distress.", "cn": "\u5c48\u670d\u4e8e\u60b2\u4f24\u6216\u60c5\u7eea\u56f0\u6270\u3002"}, "usage_en": "Describes someone overwhelmed by sadness or despair.", "usage_cn": "\u63cf\u8ff0\u67d0\u4eba\u88ab\u60b2\u4f24\u6216\u7edd\u671b\u6240\u6df9\u6ca1\u3002", "scene_en": "A person kneeling on the ground, crying with their head in their hands.", "scene_cn": "\u4e00\u4e2a\u4eba\u8dea\u5728\u5730\u4e0a\uff0c\u53cc\u624b\u6342\u7740\u5934\u54ed\u6ce3\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q5_broke_1.png", "P6_vocabulary_exercises_8_Q5_broke_2.png"], "examples": [{"en": "When she heard the news about the accident, she broke down and couldn't stop crying.", "cn": "\u5f53\u5979\u542c\u5230\u5173\u4e8e\u4e8b\u6545\u7684\u6d88\u606f\u65f6\uff0c\u5979\u5d29\u6e83\u4e86\uff0c\u65e0\u6cd5\u505c\u6b62\u54ed\u6ce3\u3002"}, {"en": "He broke down in tears as he spoke about the challenges he had faced in his life.", "cn": "\u5f53\u4ed6\u8c08\u5230\u4ed6\u4e00\u751f\u4e2d\u6240\u9762\u4e34\u7684\u6311\u6218\u65f6\uff0c\u4ed6\u6cea\u6d41\u6ee1\u9762\u3002"}]}, {"word": "shut", "ipa": "/\u0283\u028ct/", "meanings": {"en": "To close off emotionally; to become uncommunicative.", "cn": "\u5728\u60c5\u611f\u4e0a\u5c01\u95ed\u81ea\u5df1\uff1b\u53d8\u5f97\u4e0d\u7231\u8bf4\u8bdd\u3002"}, "usage_en": "Used when someone becomes withdrawn and stops sharing their feelings.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4eba\u53d8\u5f97\u9000\u7f29\u5e76\u505c\u6b62\u5206\u4eab\u4ed6\u4eec\u7684\u611f\u53d7\u3002", "scene_en": "A person sitting alone in a dark room, looking away from the viewer.", "scene_cn": "\u4e00\u4e2a\u4eba\u72ec\u81ea\u5750\u5728\u9ed1\u6697\u7684\u623f\u95f4\u91cc\uff0c\u4e0d\u770b\u89c2\u4f17\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q5_shut_1.png", "P6_vocabulary_exercises_8_Q5_shut_2.png"], "examples": [{"en": "After the argument, she shut down and refused to speak to anyone for several days.", "cn": "\u4e89\u5435\u4e4b\u540e\uff0c\u5979\u5c01\u95ed\u4e86\u81ea\u5df1\uff0c\u51e0\u5929\u4e0d\u548c\u4efb\u4f55\u4eba\u8bf4\u8bdd\u3002"}, {"en": "He shut himself off from the world after the traumatic experience, seeking solace in solitude.", "cn": "\u5728\u7ecf\u5386\u4e86\u521b\u4f24\u4e4b\u540e\uff0c\u4ed6\u628a\u81ea\u5df1\u4e0e\u4e16\u9694\u7edd\uff0c\u5728\u5b64\u72ec\u4e2d\u5bfb\u6c42\u6170\u85c9\u3002"}]}, {"word": "shattered", "ipa": "/\u02c8\u0283\u00e6t\u0259rd/", "meanings": {"en": "Completely destroyed or ruined; emotionally broken.", "cn": "\u5b8c\u5168\u6467\u6bc1\u6216\u6bc1\u574f\uff1b\u60c5\u7eea\u5d29\u6e83\u3002"}, "usage_en": "Describes something completely broken or someone emotionally devastated.", "usage_cn": "\u63cf\u8ff0\u5b8c\u5168\u7834\u788e\u7684\u4e1c\u897f\u6216\u60c5\u7eea\u5d29\u6e83\u7684\u4eba\u3002", "scene_en": "A broken mirror with pieces scattered on the floor.", "scene_cn": "\u4e00\u9762\u7834\u788e\u7684\u955c\u5b50\uff0c\u788e\u7247\u6563\u843d\u5728\u5730\u677f\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q5_shattered_1.png", "P6_vocabulary_exercises_8_Q5_shattered_2.png"], "examples": [{"en": "Her dreams were shattered when she failed to get into the university she wanted.", "cn": "\u5f53\u5979\u672a\u80fd\u8fdb\u5165\u5979\u60f3\u4e0a\u7684\u5927\u5b66\u65f6\uff0c\u5979\u7684\u68a6\u60f3\u7834\u706d\u4e86\u3002"}, {"en": "The vase shattered into a million pieces when it fell from the shelf, a complete disaster.", "cn": "\u5f53\u82b1\u74f6\u4ece\u67b6\u5b50\u4e0a\u6389\u4e0b\u6765\u65f6\uff0c\u5b83\u788e\u6210\u4e86\u65e0\u6570\u788e\u7247\uff0c\u4e00\u573a\u5f7b\u5e95\u7684\u707e\u96be\u3002"}]}], "synonym_cn": "\u5d29\u6e83\uff0c\u74e6\u89e3 (b\u0113ngku\u00ec, w\u01ceji\u011b)", "socratic_questions": [{"question": "Imagine a glass. If you accidentally drop it, what happens to the glass?", "options": ["cracked", "broke", "shut", "shattered"], "correct_answer": "shattered", "explanation": "Shattered means to break suddenly and violently into small pieces, like a glass falling."}, {"question": "If a dam suddenly gives way under immense pressure, what has happened to it?", "options": ["cracked", "broke", "shut", "shattered"], "correct_answer": "broke", "explanation": "Broke suggests a sudden failure under pressure, like a dam unable to hold back the water."}, {"question": "If a person is under a lot of stress and can no longer cope, what might we say they have done?", "options": ["cracked", "broke", "shut", "shattered"], "correct_answer": "cracked", "explanation": "Cracked suggests a person has begun to fail under pressure, but not completely."}, {"question": "If someone refuses to talk about their feelings after a traumatic event, what have they done?", "options": ["cracked", "broke", "shut", "shattered"], "correct_answer": "shut", "explanation": "Shut suggests a person has closed off emotionally, refusing to express their feelings."}]}, {"id": 6, "stem": "Ben was very _______ because he had just lost all his money.", "correct_index": 0, "options": [{"word": "upset", "ipa": "/\u028cp\u02c8s\u025bt/", "meanings": {"en": "Unhappy, disappointed, or worried.", "cn": "\u4e0d\u9ad8\u5174\u3001\u5931\u671b\u6216\u62c5\u5fe7\u3002"}, "usage_en": "Used to describe someone's emotional state when something bad has happened.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4eba\u56e0\u53d1\u751f\u4e0d\u597d\u7684\u4e8b\u60c5\u800c\u4ea7\u751f\u7684\u60c5\u7eea\u72b6\u6001\u3002", "scene_en": "A person sitting alone on a park bench, looking down with a frown.", "scene_cn": "\u4e00\u4e2a\u4eba\u72ec\u81ea\u5750\u5728\u516c\u56ed\u7684\u957f\u6905\u4e0a\uff0c\u76b1\u7740\u7709\u5934\u5411\u4e0b\u770b\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q6_upset_1.png", "P6_vocabulary_exercises_8_Q6_upset_2.png"], "examples": [{"en": "She was very upset when she heard about the accident involving her friend.", "cn": "\u5f53\u5979\u542c\u5230\u5173\u4e8e\u5979\u670b\u53cb\u7684\u4e8b\u6545\u65f6\uff0c\u5979\u975e\u5e38\u96be\u8fc7\u3002"}, {"en": "He felt upset after failing the test, despite having studied very hard for it.", "cn": "\u5c3d\u7ba1\u4ed6\u4e3a\u6b64\u52aa\u529b\u5b66\u4e60\uff0c\u4f46\u5728\u8003\u8bd5\u4e0d\u53ca\u683c\u540e\uff0c\u4ed6\u611f\u5230\u96be\u8fc7\u3002"}]}, {"word": "uptight", "ipa": "/\u02cc\u028cp\u02c8ta\u026at/", "meanings": {"en": "Anxious and tense; rigidly conventional.", "cn": "\u7126\u8651\u548c\u7d27\u5f20\uff1b \u601d\u60f3\u50f5\u5316\u3002"}, "usage_en": "Describes someone who is overly concerned with rules and proper behavior.", "usage_cn": "\u63cf\u8ff0\u90a3\u4e9b\u8fc7\u5ea6\u5173\u6ce8\u89c4\u5219\u548c\u9002\u5f53\u884c\u4e3a\u7684\u4eba\u3002", "scene_en": "A person sitting stiffly in a chair, looking uncomfortable and frowning slightly.", "scene_cn": "\u4e00\u4e2a\u4eba\u50f5\u786c\u5730\u5750\u5728\u6905\u5b50\u4e0a\uff0c\u770b\u8d77\u6765\u4e0d\u8212\u670d\uff0c\u7565\u5fae\u76b1\u7740\u7709\u5934\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q6_uptight_1.png", "P6_vocabulary_exercises_8_Q6_uptight_2.png"], "examples": [{"en": "Don't be so uptight; just relax and enjoy the party with everyone else here.", "cn": "\u522b\u8fd9\u4e48\u7d27\u5f20\uff1b \u653e\u677e\u4e00\u4e0b\uff0c\u548c\u8fd9\u91cc\u7684\u5176\u4ed6\u4eba\u4e00\u8d77\u4eab\u53d7\u6d3e\u5bf9\u5427\u3002"}, {"en": "He gets uptight whenever someone questions his authority or challenges his decisions.", "cn": "\u6bcf\u5f53\u6709\u4eba\u8d28\u7591\u4ed6\u7684\u6743\u5a01\u6216\u6311\u6218\u4ed6\u7684\u51b3\u5b9a\u65f6\uff0c\u4ed6\u5c31\u4f1a\u53d8\u5f97\u7d27\u5f20\u3002"}]}, {"word": "hurt", "ipa": "/h\u025c\u02d0rt/", "meanings": {"en": "Emotionally or physically wounded.", "cn": "\u60c5\u611f\u4e0a\u6216\u8eab\u4f53\u4e0a\u53d7\u5230\u4f24\u5bb3\u3002"}, "usage_en": "Describes the feeling of emotional or physical pain caused by someone or something.", "usage_cn": "\u63cf\u8ff0\u7531\u67d0\u4eba\u6216\u67d0\u4e8b\u5f15\u8d77\u7684\u60c5\u611f\u6216\u8eab\u4f53\u75bc\u75db\u7684\u611f\u89c9\u3002", "scene_en": "A person with a hand over their heart, looking sad and vulnerable.", "scene_cn": "\u4e00\u4e2a\u4eba\u624b\u6342\u7740\u80f8\u53e3\uff0c\u770b\u8d77\u6765\u60b2\u4f24\u800c\u8106\u5f31\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q6_hurt_1.png", "P6_vocabulary_exercises_8_Q6_hurt_2.png"], "examples": [{"en": "She felt hurt when she realized her best friend had betrayed her trust recently.", "cn": "\u5f53\u5979\u610f\u8bc6\u5230\u5979\u6700\u597d\u7684\u670b\u53cb\u80cc\u53db\u4e86\u5979\u7684\u4fe1\u4efb\u65f6\uff0c\u5979\u611f\u5230\u5f88\u53d7\u4f24\u3002"}, {"en": "His harsh words really hurt her feelings, and she needed time to recover from them.", "cn": "\u4ed6\u4e25\u5389\u7684\u8bdd\u8bed\u771f\u7684\u4f24\u5bb3\u4e86\u5979\u7684\u611f\u60c5\uff0c\u5979\u9700\u8981\u65f6\u95f4\u624d\u80fd\u4ece\u4e2d\u6062\u590d\u8fc7\u6765\u3002"}]}, {"word": "confused", "ipa": "/k\u0259n\u02c8fju\u02d0zd/", "meanings": {"en": "Unable to think clearly or understand something.", "cn": "\u65e0\u6cd5\u6e05\u6670\u601d\u8003\u6216\u7406\u89e3\u67d0\u4e8b\u3002"}, "usage_en": "Describes a state of mental uncertainty or lack of understanding.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u7cbe\u795e\u4e0a\u7684\u4e0d\u786e\u5b9a\u6216\u7f3a\u4e4f\u7406\u89e3\u7684\u72b6\u6001\u3002", "scene_en": "A person scratching their head, looking puzzled with a question mark above their head.", "scene_cn": "\u4e00\u4e2a\u4eba\u6320\u7740\u5934\uff0c\u770b\u8d77\u6765\u5f88\u56f0\u60d1\uff0c\u5934\u9876\u4e0a\u6709\u4e00\u4e2a\u95ee\u53f7\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q6_confused_1.png", "P6_vocabulary_exercises_8_Q6_confused_2.png"], "examples": [{"en": "I was confused by the instructions and needed someone to explain them again clearly.", "cn": "\u6211\u5bf9\u8fd9\u4e9b\u8bf4\u660e\u611f\u5230\u56f0\u60d1\uff0c\u9700\u8981\u6709\u4eba\u518d\u6b21\u6e05\u695a\u5730\u89e3\u91ca\u5b83\u4eec\u3002"}, {"en": "The complex plot of the movie left many viewers confused and struggling to follow along.", "cn": "\u8fd9\u90e8\u7535\u5f71\u590d\u6742\u7684\u60c5\u8282\u8ba9\u8bb8\u591a\u89c2\u4f17\u611f\u5230\u56f0\u60d1\uff0c\u96be\u4ee5\u7406\u89e3\u3002"}]}], "synonym_cn": "\u96be\u8fc7 vs \u7d27\u5f20 vs \u53d7\u4f24 vs \u56f0\u60d1", "socratic_questions": [{"question": "After failing an important exam, which feeling best describes a student's initial reaction?", "options": ["upset", "uptight", "hurt", "confused"], "correct_answer": "upset", "explanation": "Feeling upset reflects the immediate disappointment and sadness after a setback."}, {"question": "During a high-stakes negotiation, which describes someone who is overly anxious and tense?", "options": ["upset", "uptight", "hurt", "confused"], "correct_answer": "uptight", "explanation": "Being uptight suggests a state of tension and anxiety, common in stressful situations."}, {"question": "If someone's feelings are deeply affected by a cruel remark, which word best describes their emotional state?", "options": ["upset", "uptight", "hurt", "confused"], "correct_answer": "hurt", "explanation": "Feeling hurt indicates emotional pain caused by someone's words or actions."}, {"question": "When faced with conflicting information, which feeling describes someone struggling to understand?", "options": ["upset", "uptight", "hurt", "confused"], "correct_answer": "confused", "explanation": "Feeling confused reflects a lack of clarity and difficulty in understanding a situation."}]}, {"id": 7, "stem": "You can't _______ how frightened I was when I first saw a tiger.", "correct_index": 2, "options": [{"word": "wonder", "ipa": "/\u02c8w\u028cnd\u0259r/", "meanings": {"en": "To be curious or in doubt about something.", "cn": "\u5bf9\u67d0\u4e8b\u611f\u5230\u597d\u5947\u6216\u6000\u7591\u3002"}, "usage_en": "Used to express curiosity or uncertainty about something.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u67d0\u4e8b\u7684\u597d\u5947\u6216\u4e0d\u786e\u5b9a\u3002", "scene_en": "A person looking at the stars with a thoughtful expression.", "scene_cn": "\u4e00\u4e2a\u4eba\u82e5\u6709\u6240\u601d\u5730\u770b\u7740\u661f\u661f\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q7_wonder_1.png", "P6_vocabulary_exercises_8_Q7_wonder_2.png"], "examples": [{"en": "I wonder if it will rain tomorrow, considering the dark clouds gathering overhead.", "cn": "\u8003\u8651\u5230\u805a\u96c6\u5728\u5934\u9876\u7684\u4e4c\u4e91\uff0c\u6211\u60f3\u77e5\u9053\u660e\u5929\u662f\u5426\u4f1a\u4e0b\u96e8\u3002"}, {"en": "She began to wonder about the true meaning of the mysterious message she received.", "cn": "\u5979\u5f00\u59cb\u6000\u7591\u5979\u6536\u5230\u7684\u795e\u79d8\u4fe1\u606f\u7684\u771f\u6b63\u542b\u4e49\u3002"}]}, {"word": "suppose", "ipa": "/s\u0259\u02c8po\u028az/", "meanings": {"en": "To assume that something is the case on the basis of evidence or probability but without proof.", "cn": "\u6839\u636e\u8bc1\u636e\u6216\u53ef\u80fd\u6027\u5047\u8bbe\u67d0\u4e8b\u662f\u4e8b\u5b9e\uff0c\u4f46\u6ca1\u6709\u8bc1\u636e\u3002"}, "usage_en": "Used to express an assumption or belief.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5047\u8bbe\u6216\u4fe1\u5ff5\u3002", "scene_en": "A person making a calculated guess while looking at data.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u67e5\u770b\u6570\u636e\u65f6\u8fdb\u884c\u6709\u6839\u636e\u7684\u731c\u6d4b\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q7_suppose_1.png", "P6_vocabulary_exercises_8_Q7_suppose_2.png"], "examples": [{"en": "I suppose we should start preparing for the meeting, even though it's still far away.", "cn": "\u6211\u60f3\u6211\u4eec\u5e94\u8be5\u5f00\u59cb\u4e3a\u4f1a\u8bae\u505a\u51c6\u5907\uff0c\u5373\u4f7f\u5b83\u8fd8\u5f88\u9065\u8fdc\u3002"}, {"en": "I suppose that he will be late again, considering he is always unpunctual for appointments.", "cn": "\u6211\u60f3\u4ed6\u4f1a\u518d\u6b21\u8fdf\u5230\uff0c\u8003\u8651\u5230\u4ed6\u603b\u662f\u8d74\u7ea6\u4e0d\u51c6\u65f6\u3002"}]}, {"word": "imagine", "ipa": "/\u026a\u02c8m\u00e6d\u0292\u026an/", "meanings": {"en": "Form a mental image or concept of something.", "cn": "\u5728\u8111\u6d77\u4e2d\u5f62\u6210\u67d0\u7269\u7684\u5fc3\u7406\u56fe\u50cf\u6216\u6982\u5ff5\u3002"}, "usage_en": "Used to form a mental image or concept of something not present.", "usage_cn": "\u7528\u4e8e\u5f62\u6210\u5bf9\u4e0d\u5b58\u5728\u4e8b\u7269\u7684\u5fc3\u7406\u56fe\u50cf\u6216\u6982\u5ff5\u3002", "scene_en": "A person daydreaming, visualizing a tropical beach.", "scene_cn": "\u4e00\u4e2a\u4eba\u505a\u767d\u65e5\u68a6\uff0c\u60f3\u8c61\u7740\u4e00\u4e2a\u70ed\u5e26\u6d77\u6ee9\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q7_imagine_1.png", "P6_vocabulary_exercises_8_Q7_imagine_2.png"], "examples": [{"en": "I can't imagine living in a place without any trees or green spaces around me.", "cn": "\u6211\u65e0\u6cd5\u60f3\u8c61\u751f\u6d3b\u5728\u4e00\u4e2a\u5468\u56f4\u6ca1\u6709\u4efb\u4f55\u6811\u6728\u6216\u7eff\u8272\u7a7a\u95f4\u7684\u5730\u65b9\u3002"}, {"en": "Imagine what it would be like to travel to Mars and explore a new planet.", "cn": "\u60f3\u8c61\u4e00\u4e0b\u53bb\u706b\u661f\u65c5\u884c\u5e76\u63a2\u7d22\u4e00\u9897\u65b0\u884c\u661f\u4f1a\u662f\u4ec0\u4e48\u6837\u5b50\u3002"}]}, {"word": "pretend", "ipa": "/pr\u026a\u02c8t\u025bnd/", "meanings": {"en": "Behave so as to make it appear that something is the case when in fact it is not.", "cn": "\u8868\u73b0\u5f97\u597d\u50cf\u67d0\u4e8b\u662f\u4e8b\u5b9e\uff0c\u800c\u5b9e\u9645\u4e0a\u5e76\u975e\u5982\u6b64\u3002"}, "usage_en": "To give the appearance of being or doing something.", "usage_cn": "\u8868\u73b0\u51fa\u662f\u6216\u6b63\u5728\u505a\u67d0\u4e8b\u7684\u6837\u5b50\u3002", "scene_en": "Children playing dress-up and acting out roles.", "scene_cn": "\u5b69\u5b50\u4eec\u73a9\u88c5\u626e\u6e38\u620f\u5e76\u626e\u6f14\u89d2\u8272\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q7_pretend_1.png", "P6_vocabulary_exercises_8_Q7_pretend_2.png"], "examples": [{"en": "Let's pretend that we are pirates searching for buried treasure on a deserted island.", "cn": "\u8ba9\u6211\u4eec\u5047\u88c5\u6211\u4eec\u662f\u6d77\u76d7\uff0c\u5728\u8352\u5c9b\u4e0a\u5bfb\u627e\u57cb\u85cf\u7684\u5b9d\u85cf\u3002"}, {"en": "He had to pretend to be happy, even though he was feeling incredibly sad inside.", "cn": "\u4ed6\u4e0d\u5f97\u4e0d\u5047\u88c5\u5feb\u4e50\uff0c\u5373\u4f7f\u4ed6\u5185\u5fc3\u611f\u5230\u975e\u5e38\u60b2\u4f24\u3002"}]}], "synonym_cn": "\u8bbe\u60f3\uff0c\u6599\u60f3\uff0c\u63e3\u6d4b", "socratic_questions": [{"question": "If you see a friend looking lost and confused in a new city, what might you do?", "options": ["wonder", "suppose", "imagine", "pretend"], "correct_answer": "wonder", "explanation": "\"Wonder\" fits because you might ask yourself why they are lost, showing curiosity."}, {"question": "If you are making a guess about who will win a competition, what are you doing?", "options": ["wonder", "suppose", "imagine", "pretend"], "correct_answer": "suppose", "explanation": "\"Suppose\" is appropriate because you are making an assumption or guess about the outcome."}, {"question": "If you are writing a fantasy novel and creating a magical world, what are you doing?", "options": ["wonder", "suppose", "imagine", "pretend"], "correct_answer": "imagine", "explanation": "\"Imagine\" is correct because you are creating something new in your mind."}, {"question": "During a children's game, if you are acting like a superhero, what are you doing?", "options": ["wonder", "suppose", "imagine", "pretend"], "correct_answer": "pretend", "explanation": "\"Pretend\" is the right choice because you are acting out a role that is not real."}]}, {"id": 8, "stem": "Mary was _______ on by a famous surgeon in the hospital yesterday.", "correct_index": 2, "options": [{"word": "cut", "ipa": "/k\u028ct/", "meanings": {"en": "To divide or penetrate something with a sharp tool.", "cn": "\u7528\u950b\u5229\u7684\u5de5\u5177\u5206\u5272\u6216\u7a7f\u900f\u67d0\u7269\u3002"}, "usage_en": "Used for general division with a sharp object.", "usage_cn": "\u7528\u4e8e\u7528\u950b\u5229\u7269\u4f53\u8fdb\u884c\u4e00\u822c\u5206\u5272\u3002", "scene_en": "A person using a knife to slice vegetables on a cutting board.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u5200\u5728\u7827\u677f\u4e0a\u5207\u852c\u83dc\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q8_cut_1.png", "P6_vocabulary_exercises_8_Q8_cut_2.png"], "examples": [{"en": "Please cut the cake into equal slices so everyone gets a fair share.", "cn": "\u8bf7\u628a\u86cb\u7cd5\u5207\u6210\u76f8\u7b49\u7684\u8584\u7247\uff0c\u8fd9\u6837\u6bcf\u4e2a\u4eba\u90fd\u80fd\u5f97\u5230\u516c\u5e73\u7684\u4e00\u4efd\u3002"}, {"en": "I accidentally cut my finger while I was preparing dinner last night, it hurt.", "cn": "\u6628\u5929\u665a\u4e0a\u6211\u51c6\u5907\u665a\u9910\u65f6\u4e0d\u5c0f\u5fc3\u5207\u5230\u4e86\u624b\u6307\uff0c\u5f88\u75bc\u3002"}]}, {"word": "incision", "ipa": "/\u026an\u02c8s\u026a\u0292\u0259n/", "meanings": {"en": "A surgical cut made in skin or flesh.", "cn": "\u5728\u76ae\u80a4\u6216\u8089\u4f53\u4e0a\u8fdb\u884c\u7684\u624b\u672f\u5207\u53e3\u3002"}, "usage_en": "Specifically refers to a surgical cut.", "usage_cn": "\u7279\u6307\u624b\u672f\u5207\u53e3\u3002", "scene_en": "A surgeon making a precise cut during an operation.", "scene_cn": "\u5916\u79d1\u533b\u751f\u5728\u624b\u672f\u4e2d\u8fdb\u884c\u7cbe\u786e\u7684\u5207\u5272\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q8_incision_1.png", "P6_vocabulary_exercises_8_Q8_incision_2.png"], "examples": [{"en": "The surgeon made a small incision to remove the patient's infected appendix quickly.", "cn": "\u5916\u79d1\u533b\u751f\u505a\u4e86\u4e00\u4e2a\u5c0f\u5207\u53e3\uff0c\u8fc5\u901f\u5207\u9664\u4e86\u75c5\u4eba\u611f\u67d3\u7684\u9611\u5c3e\u3002"}, {"en": "The doctor cleaned the incision carefully to prevent any potential infection from spreading.", "cn": "\u533b\u751f\u4ed4\u7ec6\u5730\u6e05\u6d01\u4e86\u5207\u53e3\uff0c\u4ee5\u9632\u6b62\u4efb\u4f55\u6f5c\u5728\u7684\u611f\u67d3\u6269\u6563\u3002"}]}, {"word": "operated", "ipa": "/\u02c8\u0252p\u0259re\u026at\u026ad/", "meanings": {"en": "Performed a surgical procedure on someone.", "cn": "\u5bf9\u67d0\u4eba\u8fdb\u884c\u4e86\u5916\u79d1\u624b\u672f\u3002"}, "usage_en": "Refers to the act of performing surgery.", "usage_cn": "\u6307\u8fdb\u884c\u624b\u672f\u7684\u884c\u4e3a\u3002", "scene_en": "A surgical team performing an operation in an operating room.", "scene_cn": "\u4e00\u4e2a\u5916\u79d1\u624b\u672f\u56e2\u961f\u5728\u624b\u672f\u5ba4\u91cc\u505a\u624b\u672f\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q8_operated_1.png", "P6_vocabulary_exercises_8_Q8_operated_2.png"], "examples": [{"en": "The doctor operated on the patient to remove a tumor from her chest successfully.", "cn": "\u533b\u751f\u7ed9\u75c5\u4eba\u505a\u4e86\u624b\u672f\uff0c\u6210\u529f\u5730\u4ece\u5979\u7684\u80f8\u90e8\u53d6\u51fa\u4e86\u80bf\u7624\u3002"}, {"en": "My grandfather operated on many patients during his long and distinguished medical career.", "cn": "\u6211\u7684\u7956\u7236\u5728\u4ed6\u6f2b\u957f\u800c\u6770\u51fa\u7684\u533b\u7597\u751f\u6daf\u4e2d\u4e3a\u8bb8\u591a\u75c5\u4eba\u505a\u4e86\u624b\u672f\u3002"}]}, {"word": "sliced", "ipa": "/sla\u026ast/", "meanings": {"en": "Cut something into thin, flat pieces.", "cn": "\u5c06\u67d0\u7269\u5207\u6210\u8584\u800c\u6241\u5e73\u7684\u7247\u72b6\u3002"}, "usage_en": "Used for cutting into thin pieces.", "usage_cn": "\u7528\u4e8e\u5207\u6210\u8584\u7247\u3002", "scene_en": "A person slicing bread with a bread knife.", "scene_cn": "\u4e00\u4e2a\u4eba\u7528\u9762\u5305\u5200\u5207\u9762\u5305\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q8_sliced_1.png", "P6_vocabulary_exercises_8_Q8_sliced_2.png"], "examples": [{"en": "She sliced the bread thinly so that it would fit perfectly in the toaster.", "cn": "\u5979\u628a\u9762\u5305\u5207\u5f97\u5f88\u8584\uff0c\u8fd9\u6837\u5b83\u5c31\u80fd\u5b8c\u7f8e\u5730\u653e\u8fdb\u70e4\u9762\u5305\u673a\u91cc\u3002"}, {"en": "He carefully sliced the cheese into thin pieces to serve with the crackers later.", "cn": "\u4ed6\u5c0f\u5fc3\u5730\u628a\u5976\u916a\u5207\u6210\u8584\u7247\uff0c\u4ee5\u4fbf\u7a0d\u540e\u4e0e\u997c\u5e72\u4e00\u8d77\u98df\u7528\u3002"}]}], "synonym_cn": "\u624b\u672f; \u5207\u5f00; \u5212\u5f00", "socratic_questions": [{"question": "In a cooking show, the chef expertly _______ the fish with a sharp knife before preparing sushi.", "options": ["cut", "incision", "operated", "sliced"], "correct_answer": "sliced", "explanation": "Sliced means to cut something into thin, flat pieces."}, {"question": "The doctor made a small _______ in my arm to insert the IV line for the medication.", "options": ["cut", "incision", "operated", "sliced"], "correct_answer": "incision", "explanation": "Incision refers to a surgical cut made in skin or flesh."}, {"question": "The lumberjack _______ down the old oak tree with a powerful chainsaw in the forest.", "options": ["cut", "incision", "operated", "sliced"], "correct_answer": "cut", "explanation": "Cut means to use a sharp tool to divide something."}, {"question": "The veterinarian _______ on the injured dog to remove a tumor from its leg.", "options": ["cut", "incision", "operated", "sliced"], "correct_answer": "operated", "explanation": "Operated means to perform a surgical procedure."}]}, {"id": 9, "stem": "May doesn't have the right _______ for the job.", "correct_index": 1, "options": [{"word": "ability", "ipa": "\u0259\u02c8b\u026al\u0259ti", "meanings": {"en": "The power or capacity to do something.", "cn": "\u505a\u67d0\u4e8b\u7684\u529b\u91cf\u6216\u80fd\u529b\u3002"}, "usage_en": "Often refers to a natural talent or a developed skill.", "usage_cn": "\u901a\u5e38\u6307\u4e00\u79cd\u5929\u751f\u7684\u624d\u80fd\u6216\u540e\u5929\u57f9\u517b\u7684\u6280\u80fd\u3002", "scene_en": "A musician effortlessly playing a complex piece on the piano.", "scene_cn": "\u4e00\u4f4d\u97f3\u4e50\u5bb6\u6beb\u4e0d\u8d39\u529b\u5730\u5728\u94a2\u7434\u4e0a\u6f14\u594f\u4e00\u9996\u590d\u6742\u7684\u4e50\u66f2\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q9_ability_1.png", "P6_vocabulary_exercises_8_Q9_ability_2.png"], "examples": [{"en": "Her ability to learn languages quickly made her a valuable asset to the company.", "cn": "\u5979\u5feb\u901f\u5b66\u4e60\u8bed\u8a00\u7684\u80fd\u529b\u4f7f\u5979\u6210\u4e3a\u516c\u53f8\u5b9d\u8d35\u7684\u8d22\u5bcc\u3002"}, {"en": "Despite his age, he still has the ability to run a marathon in under four hours.", "cn": "\u5c3d\u7ba1\u4ed6\u5e74\u7eaa\u5927\u4e86\uff0c\u4ed6\u4ecd\u7136\u6709\u80fd\u529b\u5728\u56db\u5c0f\u65f6\u5185\u8dd1\u5b8c\u9a6c\u62c9\u677e\u3002"}]}, {"word": "qualification", "ipa": "\u02cckw\u0252l\u026af\u026a\u02c8ke\u026a\u0283\u0259n", "meanings": {"en": "A quality or accomplishment that fits a person for some function, office, or the like.", "cn": "\u4f7f\u4e00\u4e2a\u4eba\u9002\u5408\u67d0\u79cd\u529f\u80fd\u3001\u804c\u4f4d\u7b49\u7684\u54c1\u8d28\u6216\u6210\u5c31\u3002"}, "usage_en": "Refers to the credentials or experience needed for a job.", "usage_cn": "\u6307\u5de5\u4f5c\u6240\u9700\u7684\u8bc1\u4e66\u6216\u7ecf\u9a8c\u3002", "scene_en": "A job applicant presenting their diploma during an interview.", "scene_cn": "\u6c42\u804c\u8005\u5728\u9762\u8bd5\u4e2d\u51fa\u793a\u4ed6\u4eec\u7684\u6587\u51ed\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q9_qualification_1.png", "P6_vocabulary_exercises_8_Q9_qualification_2.png"], "examples": [{"en": "A medical degree is a basic qualification for practicing medicine in most countries today.", "cn": "\u533b\u5b66\u5b66\u4f4d\u662f\u5f53\u4eca\u5927\u5 7684\u884c\u52a8\u7684\u60f3\u6cd5\u6216\u5efa\u8bae\u3002"}, "usage_en": "Refers to a concept, thought, or opinion.", "usage_cn": "\u6307\u6982\u5ff5\u3001\u60f3\u6cd5\u6216\u89c2\u70b9\u3002", "scene_en": "A group of people brainstorming around a whiteboard filled with notes.", "scene_cn": "\u4e00\u7fa4\u4eba\u56f4\u7ed5\u7740\u4e00\u4e2a\u5199\u6ee1\u7b14\u8bb0\u7684\u767d\u677f\u8fdb\u884c\u5934\u8111\u98ce\u66b4\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q9_idea_1.png", "P6_vocabulary_exercises_8_Q9_idea_2.png"], "examples": [{"en": "The team came up with a brilliant idea to reduce costs without sacrificing quality standards.", "cn": "\u8be5\u56e2\u961f\u63d0\u51fa\u4e86\u4e00\u4e2a\u7edd\u5999\u7684\u4e3b\u610f\uff0c\u53ef\u4ee5\u5728\u4e0d\u727a\u7272\u8d28\u91cf\u6807\u51c6\u7684\u60c5\u51b5\u4e0b\u964d\u4f4e\u6210\u672c\u3002"}, {"en": "I had the idea to start a community garden to promote sustainable living in our neighborhood.", "cn": "\u6211\u6709\u4e00\u4e2a\u60f3\u6cd5\uff0c\u5c31\u662f\u5efa\u7acb\u4e00\u4e2a\u793e\u533a\u82b1\u56ed\uff0c\u4ee5\u4fc3\u8fdb\u6211\u4eec\u793e\u533a\u7684\u53ef\u6301\u7eed\u751f\u6d3b\u3002"}]}], "synonym_cn": "\u80fd\u529b vs \u8d44\u683c vs \u77e5\u8bc6 vs \u60f3\u6cd5", "socratic_questions": [{"question": "In a crisis, which do you rely on: raw talent or learned expertise?", "options": ["ability", "qualification", "knowledge", "idea"], "correct_answer": "ability", "explanation": "Ability refers to a natural or acquired skill or talent, useful in unpredictable situations."}, {"question": "Which is more important for a surgeon: a medical degree or steady hands?", "options": ["ability", "qualification", "knowledge", "idea"], "correct_answer": "qualification", "explanation": "Qualification refers to the formal certification needed to practice medicine legally."}, {"question": "What do you gain more from books: practical skills or theoretical understanding?", "options": ["ability", "qualification", "knowledge", "idea"], "correct_answer": "knowledge", "explanation": "Knowledge is the theoretical or practical understanding of a subject, gained through study."}, {"question": "Which is more important in brainstorming: wild guesses or proven methods?", "options": ["ability", "qualification", "knowledge", "idea"], "correct_answer": "idea", "explanation": "An idea is a thought or suggestion as to a possible course of action, especially in brainstorming."}]}, {"id": 10, "stem": "My new skirt _______ when I first washed it. I had to return it to the store.", "correct_index": 2, "options": [{"word": "shrivelled", "ipa": "/\u02c8\u0283r\u026av\u0259ld/", "meanings": {"en": "Wrinkled and shrunken, especially as a result of loss of moisture.", "cn": "\u8d77\u76b1\u548c\u6536\u7f29\uff0c\u7279\u522b\u662f\u7531\u4e8e\u5931\u53bb\u6c34\u5206\u3002"}, "usage_en": "Often used to describe plants or skin that has dried out.", "usage_cn": "\u5e38\u7528\u4e8e\u63cf\u8ff0\u5df2\u7ecf\u5e72\u71e5\u7684\u690d\u7269\u6216\u76ae\u80a4\u3002", "scene_en": "A close-up of a dried-out leaf, curled and brittle.", "scene_cn": "\u4e00\u7247\u5e72\u67af\u7684\u53f6\u5b50\u7684\u7279\u5199\uff0c\u5377\u66f2\u800c\u6613\u788e\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q10_shrivelled_1.png", "P6_vocabulary_exercises_8_Q10_shrivelled_2.png"], "examples": [{"en": "The grapes shrivelled on the vine after weeks without any rain at all.", "cn": "\u8461\u8404\u85e4\u4e0a\u7684\u8461\u8404\u5728\u8fde\u7eed\u51e0\u5468\u6ca1\u6709\u4e0b\u96e8\u540e\u90fd\u67af\u840e\u4e86\u3002"}, {"en": "Her skin had shrivelled slightly in the desert heat, despite using sunscreen daily.", "cn": "\u5c3d\u7ba1\u6bcf\u5929\u90fd\u4f7f\u7528\u9632\u6652\u971c\uff0c\u5979\u7684\u76ae\u80a4\u5728\u6c99\u6f20\u7684\u708e\u70ed\u4e2d\u8fd8\u662f\u7565\u5fae\u840e\u7f29\u4e86\u3002"}]}, {"word": "shivered", "ipa": "/\u02c8\u0283\u026av\u0259rd/", "meanings": {"en": "To shake slightly and uncontrollably as a result of being cold, frightened, or excited.", "cn": "\u56e0\u5bd2\u51b7\u3001\u6050\u60e7\u6216\u5174\u594b\u800c\u8f7b\u5fae\u4e14\u4e0d\u53d7\u63a7\u5236\u5730\u98a4\u6296\u3002"}, "usage_en": "Describes the body's reaction to cold or strong emotions.", "usage_cn": "\u63cf\u8ff0\u8eab\u4f53\u5bf9\u5bd2\u51b7\u6216\u5f3a\u70c8\u60c5\u7eea\u7684\u53cd\u5e94\u3002", "scene_en": "A person wrapped in a blanket, visibly shaking in the cold.", "scene_cn": "\u4e00\u4e2a\u4eba\u88f9\u7740\u6bef\u5b50\uff0c\u5728\u5bd2\u51b7\u4e2d\u660e\u663e\u5730\u98a4\u6296\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q10_shivered_1.png", "P6_vocabulary_exercises_8_Q10_shivered_2.png"], "examples": [{"en": "I shivered as I stepped out of the shower into the freezing cold bathroom.", "cn": "\u5f53\u6211\u8d70\u51fa\u6dcb\u6d74\uff0c\u8d70\u8fdb\u51b0\u51b7\u7684\u6d74\u5ba4\u65f6\uff0c\u6211\u4e0d\u7981\u6253\u4e86\u4e2a\u5bd2\u98a4\u3002"}, {"en": "She shivered with anticipation as she waited to hear if she got the job.", "cn": "\u5f53\u5979\u7b49\u5f85\u5f97\u77e5\u81ea\u5df1\u662f\u5426\u5f97\u5230\u8fd9\u4efd\u5de5\u4f5c\u65f6\uff0c\u5979\u6fc0\u52a8\u5f97\u6d51\u8eab\u53d1\u6296\u3002"}]}, {"word": "shrank", "ipa": "/\u0283r\u00e6\u014bk/", "meanings": {"en": "To become or make smaller in size or amount.", "cn": "\u5728\u5c3a\u5bf8\u6216\u6570\u91cf\u4e0a\u53d8\u5c0f\u6216\u4f7f\u53d8\u5c0f\u3002"}, "usage_en": "Used to describe something becoming smaller, often due to washing or heat.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u53d8\u5c0f\uff0c\u901a\u5e38\u662f\u7531\u4e8e\u6d17\u6da4\u6216\u52a0\u70ed\u3002", "scene_en": "A wool sweater that is much smaller than it used to be.", "scene_cn": "\u4e00\u4ef6\u6bd4\u4ee5\u524d\u5c0f\u5f97\u591a\u7684\u7f8a\u6bdb\u886b\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q10_shrank_1.png", "P6_vocabulary_exercises_8_Q10_shrank_2.png"], "examples": [{"en": "My favorite cotton t-shirt shrank in the dryer after I washed it on high heat.", "cn": "\u6211\u6700\u559c\u6b22\u7684\u68c9\u8d28T\u6064\u5728\u7528\u9ad8\u6e29\u6d17\u6da4\u540e\uff0c\u5728\u70d8\u5e72\u673a\u91cc\u7f29\u6c34\u4e86\u3002"}, {"en": "The company's profits shrank significantly during the economic downturn last year.", "cn": "\u5728\u53bb\u5e74\u7684\u7ecf\u6d4e\u8870\u9000\u671f\u95f4\uff0c\u516c\u53f8\u7684\u5229\u6da6\u5927\u5e45\u7f29\u6c34\u3002"}]}, {"word": "shrieked", "ipa": "/\u0283ri\u02d0kt/", "meanings": {"en": "To utter a piercing cry, typically expressing pain, terror, or excitement.", "cn": "\u53d1\u51fa\u5c16\u9510\u7684\u53eb\u58f0\uff0c\u901a\u5e38\u8868\u8fbe\u75db\u82e6\u3001\u6050\u60e7\u6216\u5174\u594b\u3002"}, "usage_en": "Describes a high-pitched, loud cry or scream.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u9ad8\u4ea2\u3001\u54cd\u4eae\u7684\u54ed\u558a\u6216\u5c16\u53eb\u3002", "scene_en": "A person screaming in fear while watching a scary movie.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u770b\u6050\u6016\u7535\u5f71\u65f6\u56e0\u6050\u60e7\u800c\u5c16\u53eb\u3002", "image_paths": ["P6_vocabulary_exercises_8_Q10_shrieked_1.png", "P6_vocabulary_exercises_8_Q10_shrieked_2.png"], "examples": [{"en": "The little girl shrieked with delight when she saw the pony at her birthday party.", "cn": "\u5f53\u5c0f\u5973\u5b69\u5728\u5979\u7684\u751f\u65e5\u6d3e\u5bf9\u4e0a\u770b\u5230\u5c0f\u9a6c\u65f6\uff0c\u5979\u9ad8\u5174\u5730\u5c16\u53eb\u8d77\u6765\u3002"}, {"en": "She shrieked in surprise when a spider suddenly dropped from the ceiling above her.", "cn": "\u5f53\u4e00\u53ea\u8718\u86db\u7a81\u7136\u4ece\u5979\u4e0a\u65b9\u7684\u5929\u82b1\u677f\u4e0a\u6389\u4e0b\u6765\u65f6\uff0c\u5979\u60ca\u53eb\u4e86\u4e00\u58f0\u3002"}]}], "synonym_cn": "\u6536\u7f29, \u7f29\u5c0f, \u840e\u7f29", "socratic_questions": [{"question": "If a plant dries out from lack of water, which word describes how it looks?", "options": ["shrivelled", "shivered", "shrank", "shrieked"], "correct_answer": "shrivelled", "explanation": "Shrivelled means to become reduced in size and wrinkled, often due to drying out."}, {"question": "Which word describes what you might do if you are very cold?", "options": ["shrivelled", "shivered", "shrank", "shrieked"], "correct_answer": "shivered", "explanation": "Shivered means to shake slightly and uncontrollably as a result of being cold, frightened, or excited."}, {"question": "If you accidentally put a wool sweater in the dryer, which word describes what might happen to it?", "options": ["shrivelled", "shivered", "shrank", "shrieked"], "correct_answer": "shrank", "explanation": "Shrank means to become or make smaller in size or amount."}, {"question": "Which word describes a loud, piercing cry, often expressing fear or pain?", "options": ["shrivelled", "shivered", "shrank", "shrieked"], "correct_answer": "shrieked", "explanation": "Shrieked means to utter a piercing cry, typically expressing pain, terror, or excitement."}]}]};
