 their own way.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u56fa\u6267\u4e14\u51b3\u5fc3\u6309\u81ea\u5df1\u65b9\u5f0f\u884c\u4e8b\u7684\u4eba\u3002", "scene_en": "A child refusing to follow instructions despite being told repeatedly.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u5c3d\u7ba1\u88ab\u53cd\u590d\u544a\u77e5\uff0c\u4f46\u4ecd\u62d2\u7edd\u542c\u4ece\u6307\u793a\u3002", "image_prompts": ["A child crossing their arms and refusing to listen.", "A person stubbornly insisting on their own opinion."], "image_paths": ["P6_vocabulary_exercises_4_Q2_willful_1.png", "P6_vocabulary_exercises_4_Q2_willful_2.png"], "examples": [{"en": "The willful child refused to eat his vegetables, no matter how much his parents pleaded.", "cn": "\u8fd9\u4e2a\u4efb\u6027\u7684\u5b69\u5b50\u62d2\u7edd\u5403\u852c\u83dc\uff0c\u65e0\u8bba\u4ed6\u7684\u7236\u6bcd\u600e\u4e48\u6073\u6c42\u3002"}, {"en": "Her willful nature often led her to make decisions without considering the advice of others.", "cn": "\u5979\u4efb\u6027\u7684\u5929\u6027\u5e38\u5e38\u5bfc\u81f4\u5979\u5728\u4e0d\u8003\u8651\u4ed6\u4eba\u5efa\u8bae\u7684\u60c5\u51b5\u4e0b\u505a\u51fa\u51b3\u5b9a\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u4e0d\u60c5\u613f vs \u5bb3\u7f9e vs \u7f9e\u602f vs \u4efb\u6027", "socratic_questions": [{"question": "Imagine a child being asked to share their favorite toy. Which word describes their reluctance?", "options": ["reluctant", "shy", "bashful", "willful"], "correct_answer": "reluctant", "explanation": "Reluctant means unwilling or hesitant, fitting the child's feelings about sharing."}, {"question": "A student avoids eye contact during a presentation. Which word best describes their behavior?", "options": ["reluctant", "shy", "bashful", "willful"], "correct_answer": "shy", "explanation": "Shy describes someone who is reserved or uncomfortable in social situations."}, {"question": "A young girl blushes when complimented on her singing. Which word describes her reaction?", "options": word": "failed", "ipa": "/fe\u026ald/", "meanings": {"en": "Not succeeded; did not achieve the desired outcome.", "cn": "\u672a\u6210\u529f\uff1b\u6ca1\u6709\u8fbe\u5230\u9884\u671f\u7684\u7ed3\u679c\u3002"}, "usage_en": "Used when an attempt does not produce the intended result.", "usage_cn": "\u7528\u4e8e\u5c1d\u8bd5\u6ca1\u6709\u4ea7\u751f\u9884\u671f\u7ed3\u679c\u65f6\u3002", "scene_en": "A student receiving a failing grade on an exam, looking disappointed.", "scene_cn": "\u5b66\u751f\u6536\u5230\u8003\u8bd5\u4e0d\u53ca\u683c\u7684\u6210\u7ee9\uff0c\u770b\u8d77\u6765\u5f88\u5931\u671b\u3002", "image_prompts": ["A test with a large red 'F'.", "A deflated balloon."], "image_paths": ["P6_vocabulary_exercises_4_Q3_failed_1.png", "P6_vocabulary_exercises_4_Q3_failed_2.png"], "examples": [{"en": "Despite her best efforts, she failed to pass the exam on advanced quantum physics.", "cn": "\u5c3d\u7ba1\u5979\u5c3d\u4e86\u6700\u5927\u52aa\u529b\uff0c\u5979\u8fd8\u662f\u672a\u80fd\u901a\u8fc7\u9ad8\u7b49\u91cf\u5b50\u7269\u7406\u8003\u8bd5\u3002"}, {"en": "The company failed to meet its sales targets due to poor marketing strategies implemented recently.", "cn": "\u7531\u4e8e\u6700\u8fd1\u5b9e\u65bd\u7684\u7cdf\u7cd5\u8425\u9500\u7b56\u7565\uff0c\u8be5\u516c\u53f8\u672a\u80fd\u8fbe\u5230\u5176\u9500\u552e\u76ee\u6807\u3002"}], "quiz_distractors": []}, {"word": "succeeded", "ipa": "/s\u0259k\u02c8si\u02d0d\u026ad/", "meanings": {"en": "Achieved the desired aim or result.", "cn": "\u5b9e\u73b0\u4e86\u9884\u671f\u7684\u76ee\u6807\u6216\u7ed3\u679c\u3002"}, "usage_en": "Indicates a positive outcome after effort.", "usage_cn": "\u8868\u793a\u52aa\u529b\u540e\u7684\u79ef\u6781\u7ed3\u679c\u3002", "scene_en": "A graduate receiving a diploma, smiling proudly.", "scene_cn": "\u6bd5\u4e1a\u751f\u6536\u5230\u6587\u51ed\uff0c\u81ea\u8c6a\u5730\u5fae\u7b11\u3002", "image_prompts": ["A person holding a trophy.", "Fireworks celebrating a victory."], "image_paths": ["P6_vocabulary_exercises_4_Q3_succeeded_1.png", "P6_vocabulary_exercises_4_Q3_succeeded_2.png"], "examples": [{"en": "After years of hard work, she finally succeeded in publishing her first novel successfully.", "cn": "\u7ecf\u8fc7\u591a\u5e74\u7684\u52aa\u529b\uff0c\u5979\u7ec8\u4e8e\u6210\u529f\u51fa\u7248\u4e86\u5979\u7684\u7b2c\u4e00\u90e8\u5c0f\u8bf4\u3002"}, {"en": "The team succeeded in developing a new technology that could revolutionize the industry entirely.", "cn": "\u8be5\u56e2\u961f\u6210\u529f\u5f00\u53d1\u51fa\u4e00\u79cd\u53ef\u4ee5\u5f7b\u5e95\u6539\u53d8\u884c\u4e1a\u7684\u65b0\u6280\u672f\u3002"}], "quiz_distractors": []}, {"word": "ceased", "ipa": "/si\u02d0st/", "meanings": {"en": "Brought to an end; stopped.", "cn": "\u7ed3\u675f\uff1b\u505c\u6b62\u3002"}, "usage_en": "Describes something that has stopped happening.", "usage_cn": "\u63cf\u8ff0\u5df2\u7ecf\u505c\u6b62\u53d1\u751f\u7684\u4e8b\u60c5\u3002", "scene_en": "A factory shutting down its machines, workers leaving.", "scene_cn": "\u4e00\u5bb6\u5de5\u5382\u5173\u95ed\u673a\u5668\uff0c\u5de5\u4eba\u79bb\u5f00\u3002", "image_prompts": ["A stop sign.", "A light switch in the off position."], "image_paths": ["P6_vocabulary_exercises_4_Q3_ceased_1.png", "P6_vocabulary_exercises_4_Q3_ceased_2.png"], "examples": [{"en": "The rain ceased abruptly, and the sun began to shine brightly through the clouds.", "cn": "\u96e8\u7a81\u7136\u505c\u6b62\u4e86\uff0c\u9633\u5149\u5f00\u59cb\u900f\u8fc7\u4e91\u5c42\u660e\u4eae\u5730\u7167\u8000\u3002"}, {"en": "The company ceased operations due to financial difficulties and increasing debts over time.", "cn": "\u7531\u4e8e\u8d22\u52a1\u56f0\u96be\u548c\u503a\u52a1\u4e0d\u65ad\u589e\u52a0\uff0c\u8be5\u516c\u53f8\u505c\u6b62\u4e86\u8fd0\u8425\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u5931\u8d25 vs. \u6210\u529f vs. \u505c\u6b62 vs. \u7ba1\u7406", "socratic_questions": [{"question": "If a project misses its deadline despite your best efforts, have you _______?", "options": [" 684\u5bc6\u7801\u3002"}, {"en": "The teacher granted her student's request for an extension on the project deadline.", "cn": "\u8001\u5e08\u6279\u51c6\u4e86\u5979\u7684\u5b66\u751f\u5173\u4e8e\u5ef6\u957f\u9879\u76ee\u622a\u6b62\u65e5\u671f\u7684\u8bf7\u6c42\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u7533\u8bf7\u4e66 vs. \u8bb8\u53ef\u8bc1 vs. \u8bb8\u53ef vs. \u8bf7\u6c42", "socratic_questions": [{"question": "Which document is typically required when you're seeking official permission to build a house?", "options": ["permit", "license", "application", "request"], "correct_answer": "permit", "explanation": "A permit is an official document allowing you to do something."}, {"question": "Which document do you need to legally operate a vehicle on public roads?", "options": ["permit", "license", "application", "request"], "correct_answer": "license", "explanation": "A license grants you the legal right to do something, like driving."}, {"question": "What kind of document do you fill out when you want to be considered for a job?", "options": ["permit", "license", "application", "request"], "correct_answer": "application", "explanation": "An application is a formal submission to be considered for something."}, {"question": "If you need extra time to finish a project, what would you likely make to your teacher?", "options": ["permit", "license", "application", "request"], "correct_answer": "request", "explanation": "A request is a polite way of asking for something."}]}, {"id": 5, "stem": "Animals that eat both meat and plants are known as _______.", "correct_index": 3, "options": [{"word": "cannibals", "ipa": "\u02c8k\u00e6n\u026ab\u0259lz", "meanings": {"en": "Individuals who consume the flesh of their own species.", "cn": "\u98df\u7528\u540c\u7c7b\u7269\u79cd\u7684\u4e2a\u4f53\u3002"}, "usage_en": "Used to describe the act of consuming one's own species.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u98df\u7528\u81ea\u5df1\u7269\u79cd\u7684\u884c\u4e3a\u3002", "sce 269\uff0c\u4f9d\u9760\u5b83\u4eec\u7684\u72e9\u730e\u6280\u80fd\u6765\u6355\u83b7\u730e\u7269\u4ee5\u6c42\u751f\u5b58\u3002"}, {"en": "The ecosystem relies on carnivores to control the population of herbivores and maintain balance.", "cn": "\u751f\u6001\u7cfb\u7edf\u4f9d\u8d56\u98df\u8089\u52a8\u7269\u6765\u63a7\u5236\u98df\u8349\u52a8\u7269\u7684\u6570\u91cf\u5e76\u7ef4\u6301\u5e73\u8861\u3002"}], "quiz_distractors": []}, {"word": "herbivores", "ipa": "\u02c8h\u025c\u02d0rb\u026av\u0254\u02d0rz", "meanings": {"en": "Animals that primarily eat plants.", "cn": "\u4e3b\u8981\u4ee5\u690d\u7269\u4e3a\u98df\u7684\u52a8\u7269\u3002"}, "usage_en": "Refers to animals with a diet mainly consisting of plants.", "usage_cn": "\u6307\u4e3b\u8981\u4ee5\u690d\u7269\u4e3a\u98df\u7684\u52a8\u7269\u3002", "scene_en": "A herd of deer grazing peacefully in a meadow.", "scene_cn": "\u4e00\u7fa4\u9e7f\u5728\u8349\u5730\u4e0a\u5e73\u9759\u5730\u5403\u8349\u3002", "image_prompts": ["A herd of deer grazing in a meadow.", "A cow eating grass in a field."], "image_paths": ["P6_vocabulary_exercises_4_Q5_herbivores_1.png", "P6_vocabulary_exercises_4_Q5_herbivores_2.png"], "examples": [{"en": "Cows are herbivores, spending most of their day grazing on grass and other vegetation.", "cn": "\u725b\u662f\u98df\u8349\u52a8\u7269\uff0c\u5b83\u4eec\u4e00\u5929\u4e2d\u7684\u5927\u90e8\u5206\u65f6\u95f4\u90fd\u5728\u8349\u5730\u4e0a\u5403\u8349\u548c\u5176\u4ed6\u690d\u88ab\u3002"}, {"en": "Herbivores play a crucial role in the ecosystem by consuming plants and supporting other animals.", "cn": "\u98df\u8349\u52a8\u7269\u5728\u751f\u6001\u7cfb\u7edf\u4e2d\u53d1\u6325\u7740\u5173\u952e\u4f5c\u7528\uff0c\u5b83\u4eec\u901a\u8fc7\u6d88\u8017\u690d\u7269\u6765\u652f\u6301\u5176\u4ed6\u52a8\u7269\u3002"}], "quiz_distractors": []}, {"word": "omnivores", "ipa": "\u02c8\u0251\u02d0mn\u026av\u0254\u02d0rz", "meanings": {"en": "Animals that eat both plants and meat.", "cn": "\u65e2\u5403\u690d\u7269\u4e5f\u5403\u80 tate that one refuses to admit the truth or existence of.", "cn": "\u58f0\u660e\u67d0\u4eba\u62d2\u7edd\u627f\u8ba4\u771f\u76f8\u6216\u5b58\u5728\u3002"}, "usage_en": "Used when refusing to accept or acknowledge something as true.", "usage_cn": "\u7528\u4e8e\u62d2\u7edd\u63a5\u53d7\u6216\u627f\u8ba4\u67d0\u4e8b\u4e3a\u771f\u65f6\u3002", "scene_en": "A person shaking their head while being questioned in a courtroom.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u6cd5\u5ead\u4e0a\u88ab\u8d28\u95ee\u65f6\u6447\u7740\u5934\u3002", "image_prompts": ["A person on a witness stand looking defiant.", "A hand with a 'stop' gesture in front of a serious face."], "image_paths": ["P6_vocabulary_exercises_4_Q6_deny_1.png", "P6_vocabulary_exercises_4_Q6_deny_2.png"], "examples": [{"en": "The suspect continued to deny all the charges brought against him in court.", "cn": "\u5acc\u7591\u4eba\u7ee7\u7eed\u5426\u8ba4\u6cd5\u5ead\u4e0a\u5bf9\u4ed6\u7684\u6240\u6709\u6307\u63a7\u3002"}, {"en": "She cannot deny the fact that she was at the scene of the accident.", "cn": "\u5979\u4e0d\u80fd\u5426\u8ba4\u5979\u5728\u4e8b\u6545\u73b0\u573a\u7684\u4e8b\u5b9e\u3002"}], "quiz_distractors": []}, {"word": "remove", "ipa": "r\u026a\u02c8mu\u02d0v", "meanings": {"en": "Take (something) away or off from a position.", "cn": "\u5c06\uff08\u67d0\u7269\uff09\u4ece\u67d0\u4e2a\u4f4d\u7f6e\u62ff\u8d70\u6216\u79fb\u5f00\u3002"}, "usage_en": "Used when physically taking something away or off.", "usage_cn": "\u7528\u4e8e\u7269\u7406\u4e0a\u62ff\u8d70\u6216\u79fb\u5f00\u67d0\u7269\u65f6\u3002", "scene_en": "A construction worker removing a traffic cone from the road.", "scene_cn": "\u4e00\u540d\u5efa\u7b51\u5de5\u4eba\u4ece\u9053\u8def\u4e0a\u79fb\u8d70\u4e00\u4e2a\u4ea4\u901a\u9525\u3002", "image_prompts": ["A hand carefully peeling a sticker off a surface.", "A person taking a dish out of a dishwasher."], "image_paths": ["P6_vocabulary_exercises_4_Q6_remove_1.png", "P6_vocabulary_exercises_4_Q6_remove_2.png"], "examples": [{"en": "Please remove your shoes before entering the house to keep the floors clean.", "cn": "\u8bf7\u5728\u8fdb\u5165\u623f\u5b50\u4e4b\u524d\u8131\u6389\u978b\u5b50\uff0c\u4ee5\u4fdd\u6301\u5730\u677f\u6e05\u6d01\u3002"}, {"en": "The dentist will remove the damaged tooth during the scheduled appointment tomorrow.", "cn": "\u7259\u533b\u5c06\u5728\u660e\u5929\u5b89\u6392\u7684\u9884\u7ea6\u4e2d\u62d4\u6389\u635f\u574f\u7684\u7259\u9f7f\u3002"}], "quiz_distractors": []}, {"word": "miss", "ipa": "m\u026as", "meanings": {"en": "Fail to hit, reach, or come into contact with (something aimed at).", "cn": "\u672a\u80fd\u51fb\u4e2d\u3001\u5230\u8fbe\u6216\u63a5\u89e6\u5230\uff08\u7784\u51c6\u7684\u4e1c\u897f\uff09\u3002"}, "usage_en": "Used when failing to take advantage of an opportunity or failing to attend.", "usage_cn": "\u7528\u4e8e\u672a\u80fd\u5229\u7528\u673a\u4f1a\u6216\u672a\u80fd\u53c2\u52a0\u3002", "scene_en": "A student regretting missing a school event with friends.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u540e\u6094\u9519\u8fc7\u548c\u670b\u53cb\u4e00\u8d77\u53c2\u52a0\u5b66\u6821\u6d3b\u52a8\u3002", "image_prompts": ["A clock showing a time that has already passed.", "An empty seat at a concert or event."], "image_paths": ["P6_vocabulary_exercises_4_Q6_miss_1.png", "P6_vocabulary_exercises_4_Q6_miss_2.png"], "examples": [{"en": "Don't miss the chance to see the famous cherry blossoms during your trip to Japan.", "cn": "\u4e0d\u8981\u9519\u8fc7\u5728\u65e5\u672c\u65c5\u884c\u671f\u95f4\u770b\u5230\u8457\u540d\u7684\u6a31\u82b1\u7684\u673a\u4f1a\u3002"}, {"en": "I really miss my family when I am away from home for a long period.", "cn": "\u5f53\u6211\u79bb\u5f00\u5bb6\u5f88\u957f\u4e00\u6bb5\u65f6\u95f4\u65f6\uff0c\u6211\u771f\u7684\u5f88\u60f3\u5ff5\u6211\u7684\u5bb6\u4eba\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u9519\u8fc7 vs. \u4e22\u5931 vs. \u62d2\u7edd vs. \u79fb\u9664 (\u6bd4\u8f83\u4fa7\u91cd\u4e8e\u672a\u6293\u4f4f\u673a\u4f1a)", "socratic_questions": [{"question": "If you accidentally _______ your keys, you might have to retrace your steps to find them.", "options": ["lose", "deny", "remove", "miss"], "correct_answer": "lose", "explanation": "Losing something means you no longer have it because you don't know where it is."}, {"question": "If you _______ a claim, you are stating that it is not true.", "options": ["lose", "deny", "remove", "miss"], "correct_answer": "deny", "explanation": "Denying something means to state that something is not true."}, {"question": "To _______ a stain from a shirt, you might use a stain remover.", "options": ["lose", "deny", "remove", "miss"], "correct_answer": "remove", "explanation": "Removing something means to take it away or get rid of it."}, {"question": "If you _______ a train, you arrive at the station after it has departed.", "options": ["lose", "deny", "remove", "miss"], "correct_answer": "miss", "explanation": "Missing something means failing to catch or attend something."}]}, {"id": 7, "stem": "The cows died because they had all been _______ by an old diseased goat.", "correct_index": 1, "options": [{"word": "affected", "ipa": "/\u0259\u02c8fekt\u026ad/", "meanings": {"en": "Influenced or touched by something.", "cn": "\u53d7\u5230\u67d0\u4e8b\u7269\u7684\u5f71\u54cd\u6216\u89e6\u52a8\u3002"}, "usage_en": "Used to describe being influenced or changed by something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u53d7\u5230\u67d0\u4e8b\u7269\u7684\u5f71\u54cd\u6216\u6539\u53d8\u3002", "scene_en": "A person looking thoughtful after hearing some news.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u542c\u5230\u4e00\u4e9b\u6d88\u606f\u540e\uff0c\u770b\u8d77\u6765\u82e5\u6709\u6240\u601d\u3002", "image_prompts": ["A person with a pensive expression, bathed in soft light.", "A close-up of a face showing a subtle change in emotion."], "image_paths": ["P6_vocabulary_exercises_4_Q7_affected_1.png", "P6_vocabulary_exercises_4_Q7_affected_2.png"], "examples": [{"en": "The heavy rain affected our plans for a picnic, forcing us to stay inside.", "cn": "\u5927\u96e8\u5f71\u54cd\u4e86\u6211\u4eec\u7684\u91ce\u9910\u8ba1\u5212\uff0c\u8feb\u4f7f\u6211\u4eec\u5f85\u5728\u5ba4\u5185\u3002"}, {"en": "His speech deeply affected the audience, moving many to tears with its sincerity.", "cn": "\u4ed6\u7684\u6f14\u8bb2\u6df1\u6df1\u5730\u611f\u52a8\u4e86\u89c2\u4f17\uff0c\u5176\u771f\u8bda\u611f\u52a8\u4e86\u8bb8\u591a\u4eba\uff0c\u4f7f\u4ed6\u4eec\u6d41\u4e0b\u4e86\u773c\u6cea\u3002"}], "quiz_distractors": []}, {"word": "infected", "ipa": "/\u026an\u02c8fekt\u026ad/", "meanings": {"en": "Contaminated with a disease-causing organism.", "cn": "\u88ab\u5f15\u8d77\u75be\u75c5\u7684\u6709\u673a\u7269\u6c61\u67d3\u3002"}, "usage_en": "Used to describe being contaminated with a disease or harmful agent.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u88ab\u75be\u75c5\u6216\u6709\u5bb3\u7269\u8d28\u6c61\u67d3\u3002", "scene_en": "A wound on a person's arm that looks red and inflamed.", "scene_cn": "\u4e00\u4e2a\u4eba\u624b\u81c2\u4e0a\u7684\u4f24\u53e3\u770b\u8d77\u6765\u53c8\u7ea2\u53c8\u80bf\u3002", "image_prompts": ["A microscopic view of bacteria infecting cells.", "A person with a visible rash or skin infection."], "image_paths": ["P6_vocabulary_exercises_4_Q7_infected_1.png", "P6_vocabulary_exercises_4_Q7_infected_2.png"], "examples": [{"en": "The cut on his hand became infected, requiring antibiotics to prevent further complications.", "cn": "\u4ed6\u624b\u4e0a\u7684\u4f24\u53e3\u88ab\u611f\u67d3\u4e86\uff0c\u9700\u8981\u6297\u751f\u7d20\u6765\u9632\u6b62\u8fdb\u4e00\u6b65\u7684\u5e76\u53d1\u75c7\u3002"}, {"en": "The computer system was infected with a virus, causing it to run very slowly.", "cn": "\u8ba1\u7b97\u673a\u7cfb\u7edf\u611f\u67d3\u4e86\u75c5\u6bd2\uff0c\u5bfc\u81f4\u5176\u8fd0\u884c\u975e\u5e38\u7f13\u6162\u3002"}], "quiz_distractors": []}, {"word": "inflated", "ipa": "/\u026an\u02c8fle\u026at\u026ad/", "meanings": {"en": "Filled with air or gas; exaggerated or increased.", "cn": "\u5145\u6ee1\u4e86\u7a7a\u6c14\u6216\u6c14\u4f53\uff1b\u5938\u5927\u6216\u589e\u52a0\u3002"}, "usage_en": "Used to describe something filled with air or exaggerated.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5145\u6ee1\u4e86\u7a7a\u6c14\u6216\u88ab\u5938\u5927\u7684\u4e8b\u7269\u3002", "scene_en": "A balloon being filled with air, growing larger and rounder.", "scene_cn": "\u4e00\u4e2a\u6c14\u7403\u88ab\u7a7a\u6c14\u586b\u5145\uff0c\u53d8\u5f97\u8d8a\u6765\u8d8a\u5927\u548c\u5706\u3002", "image_prompts": ["A hot air balloon being inflated before a flight.", "A graph showing inflated prices or economic growth."], "image_paths": ["P6_vocabulary_exercises_4_Q7_inflated_1.png", "P6_vocabulary_exercises_4_Q7_inflated_2.png"], "examples": [{"en": "The company inflated its sales figures to attract investors, which was highly unethical.", "cn": "\u8be5\u516c\u53f8\u5938\u5927\u4e86\u9500\u552e\u989d\u4ee5\u5438\u5f15\u6295\u8d44\u8005\uff0c\u8fd9\u662f\u975e\u5e38\u4e0d\u9053\u5fb7\u7684\u3002"}, {"en": "He inflated the tires on his bicycle before going for a long ride in the countryside.", "cn": "\u4ed6\u5728\u53bb\u4e61\u4e0b\u957f\u9014\u9a91\u884c\u4e4b\u524d\uff0c\u7ed9\u81ea\u884c\u8f66\u7684\u8f6e\u80ce\u5145\u6c14\u3002"}], "quiz_distractors": []}, {"word": "effected", "ipa": "/\u026a\u02c8fekt\u026ad/", "meanings": {"en": "Brought about or caused to happen.", "cn": "\u5b9e\u73b0\u6216\u5bfc\u81f4\u53d1\u751f\u3002"}, "usage_en": "Used to describe causing something to happen or bringing about a result.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5bfc\u81f4\u67d0\u4e8b\u53d1\u751f\u6216\u5e26\u6765\u7ed3\u679c\u3002", "scene_en": "A group of people working together to complete a project successfully.", "scene_cn": "\u4e00\u7fa4\u4eba\u4e00\u8d77\u5de5\u4f5c\uff0c\u6210\u529f\u5b8c\u6210\u4e00\u4e2a\u9879\u76ee\u3002", "image_prompts": ["A lever being pulled to start a machine.", "A group of people celebrating the successful completion of a task."], "image_paths": ["P6_vocabulary_exercises_4_Q7_effected_1.png", "P6_vocabulary_exercises_4_Q7_effected_2.png"], "examples": [{"en": "The new management effected significant changes in the company's operational procedures quickly.", "cn": "\u65b0\u7684\u7ba1\u7406\u5c42\u8fc5\u901f\u5730\u5bf9\u516c\u53f8\u7684\u8fd0\u8425\u7a0b\u5e8f\u8fdb\u884c\u4e86\u91cd\u5927\u53d8\u66f4\u3002"}, {"en": "The doctor effected a complete recovery for the patient through surgery and rehabilitation therapy.", "cn": "\u533b\u751f\u901a\u8fc7\u624b\u672f\u548c\u5eb7\u590d\u6cbb\u7597\u4f7f\u60a3\u8005\u5b8c\u5168\u5eb7\u590d\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u611f\u67d3 vs. \u5f71\u54cd vs. \u81a8\u80c0 vs. \u5b9e\u73b0", "socratic_questions": [{"question": "If a rumor spreads and changes people's opinions, are they being 'affected' or 'infected' by it?", "options": ["affected", "infected", "inflated", "effected"], "correct_answer": "affected", "explanation": "'Affected' means influenced, while 'infected' implies the spread of disease or harmful ideas."}, {"question": "If a computer gets a virus, has it been 'affected', 'infected', 'inflated', or 'effected'?", "options": ["affected", "infected", "inflated", "effected"], "correct_answer": "infected", "explanation": "'Infected' refers to the spread of a harmful agent, like a virus, into a system."}, {"question": "If a balloon is filled with too much air, is it being 'affected', 'infected', 'inflated', or 'effected'?", "options": ["affected", "infected", "inflated", "effected"], "correct_answer": "inflated", "explanation": "'Inflated' means to fill with air or gas, or to increase in size or importance."}, {"question": "If a new law is put into place, has it been 'affected', 'infected', 'inflated', or 'effected'?", "options": ["affected", "infected", "inflated", "effected"], "correct_answer": "effected", "explanation": "'Effected' means to bring about or cause to happen."}]}, {"id": 8, "stem": "My brother is _______ about football that he never misses a match.", "correct_index": 2, "options": [{"word": "interested", "ipa": "\u02c8\u026antr\u0259st\u026ad", "meanings": {"en": "Showing curiosity or concern about something or someone.", "cn": "\u5bf9\u67d0\u4e8b\u6216\u67d0\u4eba\u8868\u73b0\u51fa\u597d\u5947\u6216\u5173\u5fc3\u3002"}, "usage_en": "Used to describe a state of curiosity or concern.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u79cd\u597d\u5947\u6216\u5173\u5fc3\u7684\u72b6\u6001\u3002", "scene_en": "A person browsing books at a library, showing a general curiosity.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u56fe\u4e66\u9986\u6d4f\u89c8\u4e66\u7c4d\uff0c\u8868\u73b0\u51fa\u4e00\u822c\u7684\u597d\u5947\u5fc3\u3002", "image_prompts": ["A person browsing books at a library.", "A student raising their hand in class."], "image_paths": ["P6_vocabulary_exercises_4_Q8_interested_1.png", "P6_vocabulary_exercises_4_Q8_interested_2.png"], "examples": [{"en": "She was interested in the history of ancient Rome and its impact today.", "cn": "\u5979\u5bf9\u53e4\u7f57\u9a6c\u7684\u5386\u53f2\u53ca\u5176\u5bf9\u4eca\u5929\u7684\u5f71\u54cd\u5f88\u611f\u5174\u8da3\u3002"}, {"en": "He became interested in learning to play the guitar during his vacation last summer.", "cn": "\u53bb\u5e74\u590f\u5929\u5ea6\u5047\u671f\u95f4\uff0c\u4ed6\u5bf9\u5b66\u4e60\u5f39\u5409\u4ed6\u4ea7\u751f\u4e86\u5174\u8da3\u3002"}], "quiz_distractors": []}, {"word": "keen", "ipa": "ki\u02d0n", "meanings": {"en": "Having or showing eagerness or enthusiasm; sharp.", "cn": "\u5177\u6709\u6216\u8868\u73b0\u51fa\u6e34\u671b\u6216\u70ed\u60c5\uff1b\u654f\u9510\u7684\u3002"}, "usage_en": "Describes a strong desire or enthusiasm for something.", "usage_cn": "\u63cf\u8ff0\u5bf9\u67d0\u4e8b\u7684\u5f3a\u70c8\u6e34\u671b\u6216\u70ed\u60c5\u3002", "scene_en": "A runner at the starting line, eager to begin the race.", "scene_cn": "\u8d5b\u8dd1\u8005\u5728\u8d77\u8dd1\u7ebf\u4e0a\uff0c\u6e34\u671b\u5f00\u59cb\u6bd4\u8d5b\u3002", "image_prompts": ["A runner at the starting line.", "A student eagerly raising their hand in class."], "image_paths": ["P6_vocabulary_exercises_4_Q8_keen_1.png", "P6_vocabulary_exercises_4_Q8_keen_2.png"], "examples": [{"en": "She is very keen to start her new job and meet her new colleagues.", "cn": "\u5979\u975e\u5e38\u6e34\u671b\u5f00\u59cb\u5979\u7684\u65b0\u5de5\u4f5c\u5e76\u7ed3\u8bc6\u5979\u7684\u65b0\u540c\u4e8b\u3002"}, {"en": "He is keen on improving his skills in programming to advance his career.", "cn": "\u4ed6\u70ed\u8877\u4e8e\u63d0\u9ad8\u4ed6\u7684\u7f16\u7a0b\u6280\u80fd\u4ee5\u53d1\u5c55\u4ed6\u7684\u4e8b\u4e1a\u3002"}], "quiz_distractors": []}, {"word": "enthusiastic", "ipa": "\u026an\u02cc\u03b8ju\u02d0zi\u02c8\u00e6st\u026ak", "meanings": {"en": "Having or showing intense and eager enjoyment, interest, or approval.", "cn": "\u5177\u6709\u6216\u8868\u73b0\u51fa\u5f3a\u70c8\u800c\u70ed\u5207\u7684\u4eab\u53d7\u3001\u5174\u8da3\u6216\u8d5e\u540c\u3002"}, "usage_en": "Used to describe someone who shows great excitement and passion.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8868\u73b0\u51fa\u6781\u5927\u7684\u5174\u594b\u548c\u70ed\u60c5\u7684\u4eba\u3002", "scene_en": "A crowd cheering loudly at a concert, showing great excitement.", "scene_cn": "\u4eba\u7fa4\u5728\u97f3\u4e50\u4f1a\u4e0a\u5927\u58f0\u6b22\u547c\uff0c\u8868\u73b0\u51fa\u6781\u5927\u7684\u5174\u594b\u3002", "image_prompts": ["A crowd cheering at a concert.", "A group of volunteers working with passion."], "image_paths": ["P6_vocabulary_exercises_4_Q8_enthusiastic_1.png", "P6_vocabulary_exercises_4_Q8_enthusiastic_2.png"], "examples": [{"en": "The team was enthusiastic about the new project and its potential impact on society.", "cn": "\u56e2\u961f\u5bf9\u65b0\u9879\u76ee\u53ca\u5176\u5bf9\u793e\u4f1a\u7684\u6f5c\u5728\u5f71\u54cd\u5145\u6ee1\u70ed\u60c5\u3002"}, {"en": "She is an enthusiastic supporter of environmental conservation and sustainable living practices.", "cn": "\u5979\u662f\u73af\u5883\u4fdd\u62a4\u548c\u53ef\u6301\u7eed\u751f\u6d3b\u65b9\u5f0f\u7684\u70ed\u60c5\u652f\u6301\u8005\u3002"}], "quiz_distractors": []}, {"word": "engrossed", "ipa": "\u026an\u02c8\u0261ro\u028ast", "meanings": {"en": "Completely occupied or absorbed; deeply involved.", "cn": "\u5b8c\u5168\u5360\u636e\u6216\u5438\u6536\uff1b \u6df1\u5ea6\u53c2\u4e0e\u3002"}, "usage_en": "Describes being completely focused and absorbed in something.", "usage_cn": "\u63cf\u8ff0\u5b8c\u5168\u4e13\u6ce8\u4e8e\u5e76\u6c89\u6d78\u4e8e\u67d0\u4e8b\u3002", "scene_en": "A person reading a book, completely lost in the story.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u8bfb\u4e66\uff0c\u5b8c\u5168\u6c89\u6d78\u5728\u6545\u4e8b\u4e2d\u3002", "image_prompts": ["A person reading a book.", "A scientist focused on an experiment."], "image_paths": ["P6_vocabulary_exercises_4_Q8_engrossed_1.png", "P6_vocabulary_exercises_4_Q8_engrossed_2.png"], "examples": [{"en": "She was so engrossed in the novel that she forgot to eat her dinner.", "cn": "\u5979\u592a\u4e13\u6ce8\u4e8e\u5c0f\u8bf4\u4e86\uff0c\u4ee5\u81f3\u4e8e\u5fd8\u8bb0\u5403\u665a\u996d\u4e86\u3002"}, {"en": "He was engrossed in his work and didn't notice the time passing by quickly.", "cn": "\u4ed6\u4e13\u6ce8\u4e8e\u4ed6\u7684\u5de5\u4f5c\uff0c\u6ca1\u6709\u6ce8\u610f\u5230\u65f6\u95f4\u8fc7\u5f97\u5f88\u5feb\u3002"}], "quiz_distractors": []}], "synonym_cn": "\u70ed\u8877 vs. \u611f\u5174\u8da3 vs. \u4e13\u6ce8 vs. \u6e34\u671b", "socratic_questions": [{"question": "If you are following a scientific theory with great focus, are you generally _______?", "options": ["interested", "keen", "enthusiastic", "engrossed"], "correct_answer": "engrossed", "explanation": "Engrossed implies complete attention and absorption, fitting the context of deeply following a theory."}, {"question": "When you show a mild curiosity in learning a new language, are you _______ in it?", "options": ["interested", "keen", "enthusiastic", "engrossed"], "correct_answer": "interested", "explanation": "Interested suggests a general curiosity or mild engagement, suitable for initial language learning."}, {"question": "If you are very eager to start a new project, are you _______ to begin immediately?", "options": ["interested", "keen", "enthusiastic", "engrossed"], "correct_answer": "keen", "explanation": "Keen indicates eagerness and a strong desire, aligning with the eagerness to start a project."}, {"question": "If you are showing passionate support for a political candidate, are you _______ about their campaign?", "options": ["interested", "keen", "enthusiastic", "engrossed"], "correct_answer": "enthusiastic", "explanation": "Enthusiastic implies strong positive feelings and excitement, fitting the passionate support for a candidate."}]}, {"id": 9, "stem": "I felt a/an _______ pain in the stomach when the ball hit me.", "correct_index": 0, "options": [{"word": "acute", "ipa": "/\u0259\u02c8kju\u02d0t/", "meanings": {"en": "Sharp or severe; having a sudden onset.", "cn": "\u5267\u70c8\u7684\uff1b\u4e25\u91cd\u7684\uff1b\u7a81\u7136\u53d1\u4f5c\u7684\u3002"}, "usage_en": "Used to describe intense pain or a sudden illness.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5267\u70c8\u7684\u75bc\u75db\u6216\u7a81\u7136\u7684\u75be\u75c5\u3002", "scene_en": "A doctor examining a patient complaining of sudden, sharp abdominal pain.", "scene_cn": "\u533b\u751f\u68c0\u67e5\u4e00\u4f4d\u62b1\u6028\u7a81\u53d1\u6027\u8179\u90e8\u5267\u75db\u7684\u75c5\u4eba\u3002", "image_prompts": ["A close-up of a person wincing in sharp pain.", "A medical professional examining a patient experiencing acute symptoms."], "image_paths": ["P6_vocabulary_exercises_4_Q9_acute_1.png", "P6_vocabulary_exercises_4_Q9_acute_2.png"], "examples": [{"en": "She felt an acute pain in her chest and immediately called for help.", "cn": "\u5979\u611f\u5230\u80f8\u53e3\u4e00\u9635\u5267\u75db\uff0c\u7acb\u5373\u6253\u7535\u8bdd\u6c42\u52a9\u3002"}, {"en": "The patient experienced an acute episode of anxiety after receiving the bad news.", "cn": "\u75c5\u4eba\u5728\u6536\u5230\u574f\u6d88\u606f\u540e\uff0c\u7ecf\u5386\u4e86\u4e00\u6b21\u4e25\u91cd\u7684\u7126\u8651\u53d1\u4f5c\u3002"}], "quiz_distractors": []}, {"word": "piercing", "ipa": "/\u02c8p\u026a\u0259rs\u026a\u014b/", "meanings": {"en": "Sharp and penetrating; like something is stabbing you.", "cn": "\u5c16\u9510\u7684\uff0c\u523a\u7a7f\u7684\uff1b\u50cf\u6709\u4ec0\u4e48\u4e1c\u897f\u5728\u523a\u4f60\u3002"}, "usage_en": "Describes a sharp, stabbing pain or a loud, shrill sound.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u5c16\u9510\u3001\u523a\u75db\u7684\u75bc\u75db\u6216\u4e00\u79cd\u54cd\u4eae\u3001\u523a\u8033\u7684\u58f0\u97f3\u3002", "scene_en": "A person reacting to a sharp, stabbing pain in their foot after stepping on glass.", "scene_cn": "\u4e00\u4e2a\u4eba\u8e29\u5230\u73bb\u7483\u540e\uff0c\u5bf9\u811a\u90e8\u4f20\u6765\u7684\u5c16\u9510\u523a\u75db\u505a\u51fa\u53cd\u5e94\u3002", "image_prompts": ["A foot with a shard of glass, causing piercing pain.", "A person wincing from a sharp, stabbing pain."], "image_paths": ["P6_vocabulary_exercises_4_Q9_piercing_1.png", "P6_vocabulary_exercises_4_Q9_piercing_2.png"], "examples": [{"en": "The piercing pain in my head made it difficult to concentrate on anything else.", "cn": "\u6211\u5934\u90e8\u90a3\u9635\u523a\u75db\u8ba9\u6211\u96be\u4ee5\u96c6\u4e2d\u7cbe\u529b\u505a\u4efb\u4f55\u4e8b\u60c5\u3002"}, {"en": "A piercing scream echoed through the dark alley, sending chills down my spine instantly.", "cn": "\u4e00\u58f0\u5c16\u9510\u7684\u5c16\u53eb\u58f0\u5728\u9ed1\u6697\u7684\u5c0f\u5df7\u4e2d\u56de\u8361\uff0c\u7acb\u523b\u8ba9\u6211\u611f\u5230\u810a\u80cc\u53d1\u51c9\u3002"}], "quiz_distractors": []}, {"word": "deafening", "ipa": "/\u02c8def\u0259n\u026a\u014b/", "meanings": {"en": "Extremely loud; so loud as to make it impossible to hear anything else.", "cn": "\u9707\u8033\u6b32\u804b\u7684\uff1b
