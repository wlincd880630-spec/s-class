ng well.", "scene_cn": "\u4e00\u4e2a\u4eba\u5f80\u8bb8\u613f\u4e95\u91cc\u6254\u786c\u5e01\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q1_wish_1.png", "P6_vocabulary_exercises_14_Q1_wish_2.png"], "examples": [{"en": "I wish I could fly to the moon and explore its surface someday soon.", "cn": "\u6211\u5e0c\u671b\u6709\u4e00\u5929\u6211\u80fd\u98de\u5230\u6708\u7403\u5e76\u63a2\u7d22\u5b83\u7684\u8868\u9762\u3002"}, {"en": "She made a wish on her birthday to have good health and happiness always.", "cn": "\u5979\u5728\u751f\u65e5\u65f6\u8bb8\u613f\uff0c\u5e0c\u671b\u6c38\u8fdc\u62e5\u6709\u5065\u5eb7\u548c\u5e78\u798f\u3002"}]}, {"word": "appetite", "ipa": "/\u02c8\u00e6p\u026ata\u026at/", "meanings": {"en": "A physical desire for food.", "cn": "\u5bf9\u98df\u7269\u7684\u751f\u7406\u6b32\u671b\u3002"}, "usage_en": "Refers to the physical need or desire to eat.", "usage_cn": "\u6307\u8eab\u4f53\u4e0a\u9700\u8981\u6216\u6e34\u671b\u8fdb\u98df\u3002", "scene_en": "A person sitting at a table with a plate of delicious food.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u65c1\uff0c\u684c\u4e0a\u653e\u7740\u4e00\u76d8\u7f8e\u5473\u7684\u98df\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q1_appetite_1.png", "P6_vocabulary_exercises_14_Q1_appetite_2.png"], "examples": [{"en": "After a long day of hiking, he had a huge appetite and ate everything.", "cn": "\u5f92\u6b65\u65c5\u884c\u4e86\u4e00\u5929\u540e\uff0c\u4ed6\u80c3\u53e3\u5927\u5f00\uff0c\u5403\u5149\u4e86\u6240\u6709\u7684\u4e1c\u897f\u3002"}, {"en": "The smell of freshly baked bread gave her an appetite for a sandwich.", "cn": "\u65b0\u9c9c\u51fa\u7089\u7684\u9762\u5305\u5473\u8ba9\u5979\u60f3\u5403\u4e09\u660e\u6cbb\u3002"}]}, {"word": "longing", "ipa": "/\u02c8l\u0254\u02d0\u014b\u026a\u014b/", "meanings": {"en": "A strong feeling of wanting something or someone.", "cn": "\u5f3a\u70c8\u5730\u60f3\u8981\u67d0\u7269\u6216\u67d0\u4eba\u7684\u611f\u89c9\u3002"}, "usage_en": "Used to describe a deep and persistent desire or yearning.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u79cd\u6df1\u523b\u800c\u6301\u4e45\u7684\u6e34\u671b\u6216\u5411\u5f80\u3002", "scene_en": "A person gazing out at the ocean, looking wistful.", "scene_cn": "\u4e00\u4e2a\u4eba\u51dd\u89c6\u7740\u5927\u6d77\uff0c\u770b\u8d77\u6765\u5f88\u60c6\u6005\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q1_longing_1.png", "P6_vocabulary_exercises_14_Q1_longing_2.png"], "examples": [{"en": "She felt a deep longing for her family while she was away at college.", "cn": "\u5f53\u5979\u5728\u5927\u5b66\u8bfb\u4e66\u65f6\uff0c\u5979\u6df1\u6df1\u5730\u601d\u5ff5\u7740\u5979\u7684\u5bb6\u4eba\u3002"}, {"en": "He had a longing to return to his hometown and see his old friends.", "cn": "\u4ed6\u6e34\u671b\u56de\u5230\u5bb6\u4e61\uff0c\u770b\u770b\u4ed6\u7684\u8001\u670b\u53cb\u3002"}]}], "synonym_cn": "\u98df\u6b32 (sh\u00edy\u00f9) vs. \u6e34\u671b (k\u011bw\u00e0ng) vs. \u613f\u671b (yu\u00e0nw\u00e0ng) vs. \u6b32\u671b (y\u00f9w\u00e0ng)", "socratic_questions": [{"question": "After a long hike, which feeling best describes your need for water?", "options": ["desire", "wish", "appetite", "longing"], "correct_answer": "appetite", "explanation": "Appetite refers to a physical need, like thirst or hunger."}, {"question": "Which word describes a strong hope for something that is unlikely to happen?", "options": ["desire", "wish", "appetite", "longing"], "correct_answer": "wish", "explanation": "A wish is a hope or desire for something that is often unrealistic."}, {"question": "Which word describes a general feeling of wanting something, like success or recognition?", "options": ["desire", "wish", "appetite", "longing"], "correct_answer": "desire", "explanation": "Desire is a strong feeling of wanting something."}, {"question": "Which word describes a deep and persistent feeling of missing someone or something?", "options": ["desire", "wish", "appetite", "longing"], "correct_answer": "longing", "explanation": "Longing is a strong feeling of missing someone or something."}]}, {"id": 2, "stem": "A person who looks on the bright side of things is a/an ______.", "correct_index": 3, "options": [{"word": "opportunist", "ipa": "/\u02cc\u0252p\u0259\u02c8tju\u02d0n\u026ast/", "meanings": {"en": "A person who takes advantage of opportunities as they arise, regardless of consequences.", "cn": "\u4e00\u4e2a\u5229\u7528\u673a\u4f1a\u7684\u4eba\uff0c\u4e0d\u8003\u8651\u540e\u679c\u3002"}, "usage_en": "Describes someone who exploits situations for personal gain.", "usage_cn": "\u5f62\u5bb9\u4e3a\u4e2a\u4eba\u5229\u76ca\u800c\u5229\u7528\u60c5\u51b5\u7684\u4eba\u3002", "scene_en": "A crowded marketplace where someone is seen quickly grabbing valuable items left unattended.", "scene_cn": "\u4e00\u4e2a\u62e5\u6324\u7684\u5e02\u573a\uff0c\u6709\u4eba\u8fc5\u901f\u6293\u4f4f\u65e0\u4eba\u770b\u7ba1\u7684\u8d35\u91cd\u7269\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q2_opportunist_1.png", "P6_vocabulary_exercises_14_Q2_opportunist_2.png"], "examples": [{"en": "He was an opportunist, always looking for ways to advance his career quickly.", "cn": "\u4ed6\u662f\u4e2a\u673a\u4f1a\u4e3b\u4e49\u8005\uff0c\u603b\u662f\u5bfb\u627e\u5feb\u901f\u63d0\u5347\u81ea\u5df1\u804c\u4e1a\u751f\u6daf\u7684\u65b9\u6cd5\u3002"}, {"en": "The opportunist saw the company's crisis as a chance to seize more power.", "cn": "\u673a\u4f1a\u4e3b\u4e49\u8005\u5c06\u516c\u53f8\u7684\u5371\u673a\u89c6\u4e3a\u593a\u53d6\u66f4\u591a\u6743\u529b\u7684\u673a\u4f1a\u3002"}]}, {"word": "objective", "ipa": "/\u0259b\u02c8d\u0292ekt\u026av/", "meanings": {"en": "Not influenced by personal feelings or opinions; based on facts.", "cn": "\u4e0d\u53d7\u4e2a\u4eba\u611f\u60c5\u6216\u610f\u89c1\u7684\u5f71\u54cd\uff1b\u57fa\u4e8e\u4e8b\u5b9e\u3002"}, "usage_en": "Describes judgments or analyses based on empirical evidence.", "usage_cn": "\u63cf\u8ff0\u57fa\u4e8e\u7ecf\u9a8c\u8bc1\u636e\u7684\u5224\u65ad\u62 4ed6\u611f\u5230\u7126\u8651\u3002"}, {"en": "As a pessimist, she doubted the project's success from the very beginning stages.", "cn": "\u4f5c\u4e3a\u4e00\u4e2a\u60b2\u89c2\u4e3b\u4e49\u8005\uff0c\u5979\u4ece\u4e00\u5f00\u59cb\u5c31\u6000\u7591\u8fd9\u4e2a\u9879\u76ee\u7684\u6210\u529f\u3002"}]}, {"word": "optimist", "ipa": "/\u02c8\u0252pt\u026am\u026ast/", "meanings": {"en": "A person who tends to be hopeful and confident about the future or the success of something.", "cn": "\u4e00\u4e2a\u5bf9\u672a\u6765\u6216\u67d0\u4e8b\u7684\u6210\u529f\u62b1\u6709\u5e0c\u671b\u548c\u4fe1\u5fc3\u7684\u4eba\u3002"}, "usage_en": "Describes someone who maintains a positive outlook.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u4fdd\u6301\u79ef\u6781\u6001\u5ea6\u7684\u4eba\u3002", "scene_en": "A person looking at a sunrise with a smile, radiating positivity.", "scene_cn": "\u4e00\u4e2a\u4eba\u9762\u5e26\u5fae\u7b11\u5730\u770b\u7740\u65e5\u51fa\uff0c\u6563\u53d1\u7740\u79ef\u6781\u7684\u6c14\u606f\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q2_optimist_1.png", "P6_vocabulary_exercises_14_Q2_optimist_2.png"], "examples": [{"en": "Despite the challenges, the optimist believed that everything would eventually work out fine.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u6311\u6218\uff0c\u4e50\u89c2\u4e3b\u4e49\u8005\u76f8\u4fe1\u4e00\u5207\u6700\u7ec8\u90fd\u4f1a\u597d\u8d77\u6765\u7684\u3002"}, {"en": "As an optimist, he always looked for the silver lining in every difficult situation.", "cn": "\u4f5c\u4e3a\u4e00\u4e2a\u4e50\u89c2\u4e3b\u4e49\u8005\uff0c\u4ed6\u603b\u662f\u5728\u6bcf\u4e00\u4e2a\u56f0\u96be\u7684\u60c5\u51b5\u4e0b\u5bfb\u627e\u4e00\u7ebf\u5e0c\u671b\u3002"}]}], "synonym_cn": "\u79ef\u6781\u5206\u5b50, \u4e50\u5929\u6d3e, \u8fbe\u89c2\u8005 vs. \u673a\u4f1a\u4e3b\u4e49\u8005, \u5ba2\u89c2\u8005, \u60b2\u89c2\u4e3b\u4e49\u8005", "socratic_questions": [{"question": "If you see a glass as half empty, are you an optimist, pessimist, opportunist, or objective?", "options": ["optimist", "pessimist", "opportunist", "objective"], "correct_answer": "pessimist", "explanation": "A pessimist focuses on the negative aspects of situations."}, {"question": "If you exploit a situation for personal gain, are you an optimist, pessimist, opportunist, or objective?", "options": ["optimist", "pessimist", "opportunist", "objective"], "correct_answer": "opportunist", "explanation": "An opportunist takes advantage of opportunities without considering ethics."}, {"question": "If you analyze facts without bias, are you an optimist, pessimist, opportunist, or objective?", "options": ["optimist", "pessimist", "opportunist", "objective"], "correct_answer": "objective", "explanation": "Being objective means basing judgments on facts, not feelings."}, {"question": "If you maintain a positive outlook despite difficulties, are you an optimist, pessimist, opportunist, or objective?", "options": ["optimist", "pessimist", "opportunist", "objective"], "correct_answer": "optimist", "explanation": "An optimist always expects the best possible outcome from any situation."}]}, {"id": 3, "stem": "Jim suffers from a/an ______ complex and always thinks the worse of himself.", "correct_index": 1, "options": [{"word": "humility", "ipa": "/hju\u02d0\u02c8m\u026al\u0259ti/", "meanings": {"en": "The quality of having a modest or low view of one's importance.", "cn": "\u4ee5\u8c26\u865a\u6216\u4f4e\u7684\u89c6\u89d2\u770b\u5f85\u81ea\u5df1\u91cd\u8981\u6027\u7684\u54c1\u8d28\u3002"}, "usage_en": "Humility is often seen as a virtue, especially in leaders and public figures.", "usage_cn": "\u8c26\u900a\u901a\u5e38\u88ab\u89c6\u4e3a\u4e00\u79cd\u7f8e\u5fb7\uff0c\u5c24\u5176\u662f\u5728\u9886\u5bfc\u4eba\u548c\u516c\u4f17\u4eba\u7269\u4e2d\u3002", "scene_en": "A monk bowing deeply in prayer, symbolizing a lack of ego and self-importance.", "scene_cn": "\u4e00\u4f4d\u50e7\u4fa3\u6df1\u6df1\u5730\u97a0\u8eac\u7948\u7977\uff0c\u8c61\u5f81\u7740\u7f3a\u4e4f\u81ea\u6211\u548c\u81ea\u8d1f\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q3_humility_1.png", "P6_vocabulary_exercises_14_Q3_humility_2.png"], "examples": [{"en": "Despite his wealth, he always displayed humility and treated everyone with respect.", "cn": "\u5c3d\u7ba1\u4ed6\u5f88\u5bcc\u6709\uff0c\u4f46\u4ed6\u603b\u662f\u8868\u73b0\u51fa\u8c26\u900a\uff0c\u5e76\u5c0a\u91cd\u6bcf\u4e2a\u4eba\u3002"}, {"en": "Her humility allowed her to learn from her mistakes and grow as a person.", "cn": "\u5979\u7684\u8c26\u900a\u4f7f\u5979\u80fd\u591f\u4ece\u9519\u8bef\u4e2d\u5b66\u4e60\u5e76\u6210\u957f\u3002"}]}, {"word": "inferiority", "ipa": "/\u026an\u02ccf\u026a\u0259ri\u02c8\u0252r\u026ati/", "meanings": {"en": "The condition of being lower in status or quality than another or others.", "cn": "\u5728\u5730\u4f4d\u6216\u8d28\u91cf\u4e0a\u4f4e\u4e8e\u53e6\u4e00\u4e2a\u6216\u591a\u4e2a\u7684\u72b6\u6001\u3002"}, "usage_en": "Inferiority can significantly impact self-esteem and mental well-being.", "usage_cn": "\u81ea\u5351\u4f1a\u4e25\u91cd\u5f71\u54cd\u81ea\u5c0a\u548c\u5fc3\u7406\u5065\u5eb7\u3002", "scene_en": "A person looking downcast, standing in the shadow of a taller figure.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u8d77\u6765\u6cae\u4e27\uff0c\u7ad9\u5728\u4e00\u4e2a\u8f83\u9ad8\u4eba\u7269\u7684\u9634\u5f71\u4e0b\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q3_inferiority_1.png", "P6_vocabulary_exercises_14_Q3_inferiority_2.png"], "examples": [{"en": "He struggled with feelings of inferiority after being passed over for the promotion.", "cn": "\u5728\u664b\u5347\u88ab\u5ffd\u7565\u540e\uff0c\u4ed6\u4e0e\u81ea\u5351\u611f\u4f5c\u6597\u4e89\u3002"}, {"en": "The constant criticism fueled her inferiority complex, making her doubt her abilities.", "cn": "\u4e0d\u65ad\u7684\u6279\u8bc4\u52a0\u5267\u4e86\u5979\u7684\u81ea\u5351\u60c5\u7ed3\uff0c\u4f7f\u5979\u6000\u7591\u81ea\u5df1\u7684\u80fd\u529b\u3002"}]}, {"word": "superior", "ipa": "/su\u02d0\u02c8p\u026a\u0259ri\u0259r/", "meanings": {"en": "Higher in rank, status, or quality.", "cn": "\u5728\u7b49\u7ea7\u3001\u5730\u4f4d\u6216\u8d28\u91cf\u4e0a\u66f4\u9ad8\u3002"}, "usage_en": "A superior attitude can alienate others and damage relationships.", "usage_cn": "\u4e00\u79cd\u4f18\u8d8a\u7684\u6001\u5ea6\u4f1a\u758f\u8fdc\u4ed6\u4eba\u5e76\u635f\u5bb3\u4eba\u9645\u5173\u7cfb\u3002", "scene_en": "A person looking down on others from a high platform, symbolizing arrogance.", "scene_cn": "\u4e00\u4e2a\u4eba\u4ece\u9ad8\u5904\u4fef\u89c6\u4ed6\u4eba\uff0c\u8c61\u5f81\u7740\u50b2\u6162\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q3_superior_1.png", "P6_vocabulary_exercises_14_Q3_superior_2.png"], "examples": [{"en": "She adopted a superior tone when speaking to her colleagues, which made them uncomfortable.", "cn": "\u5979\u548c\u540c\u4e8b\u8bf4\u8bdd\u65f6\u5e26\u7740\u4e00\u79cd\u4f18\u8d8a\u7684\u8bed\u6c14\uff0c\u8fd9\u8ba9\u4ed6\u4eec\u611f\u5230\u4e0d\u8212\u670d\u3002"}, {"en": "His superior knowledge of the subject made him a valuable asset to the team.", "cn": "\u4ed6\u5bf9\u8be5\u4e3b\u9898\u7684\u5353\u8d8a\u77e5\u8bc6\u4f7f\u4ed6\u6210\u4e3a\u56e2\u961f\u7684\u5b9d\u8d35\u8d44\u4ea7\u3002"}]}, {"word": "destructive", "ipa": "/d\u026a\u02c8str\u028ckt\u026av/", "meanings": {"en": "Causing great and irreparable damage.", "cn": "\u9020\u6210\u5de8\u5927\u4e14\u65e0\u6cd5\u5f25\u8865\u7684\u635f\u5bb3\u3002"}, "usage_en": "Destructive behavior can have long-lasting consequences for both the individual and society.", "usage_cn": "\u7834\u574f\u6027\u884c\u4e3a\u53ef\u80fd\u5bf9\u4e2a\u4eba\u548c\u793e\u4f1a\u4ea7\u751f\u957f\u671f\u5f71\u54cd\u3002", "scene_en": "A building collapsing after an earthquake, symbolizing devastation and ruin.", "scene_cn": "\u5730\u9707\u540e\u5efa\u7b51\u7269\u5012\u584c\uff0c\u8c61\u5f81\u7740\u7834\u574f\u548c\u6bc1\u706d\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q3_destructive_1.png", "P6_vocabulary_exercises_14_Q3_destructive_2.png"], "examples": [{"en": "His destructive habits ruined his health and strained his relationships with his family.", "cn": "\u4ed6\u7684\u7834\u574f\u6027\u4e60\u60ef\u6bc1\u4e86\u4ed6\u7684\u5065\u5eb7\uff0c\u5e76\u4f7f\u4ed6\u4e0e\u5bb6\u4eba\u7684\u5173\u7cfb\u7d27\u5f20\u3002"}, {"en": "The destructive criticism undermined her confidence and prevented her from pursuing her dreams.", "cn": "\u7834\u574f\u6027\u7684\u6279\u8bc4\u524a\u5f31\u4e86\u5979\u7684\u4fe1\u5fc3\uff0c\u5e76\u963b\u6b62\u4e86\u5979\u8ffd\u6c42\u68a6\u60f3\u3002"}]}], "synonym_cn": "\u81ea\u5351\u611f vs \u8c26\u900a vs \u4f18\u8d8a\u611f vs \u7834\u574f\u6027", "socratic_questions": [{"question": "Which trait describes someone who consistently underestimates their abilities and worth?", "options": ["humility", "inferiority", "superior", "destructive"], "correct_answer": "inferiority", "explanation": "Inferiority describes a feeling of being less worthy or capable than others."}, {"question": "Which word characterizes a modest view of one's own importance?", "options": ["humility", "inferiority", "superior", "destructive"], "correct_answer": "humility", "explanation": "Humility is the quality of being humble and not thinking you are better than others."}, {"question": "Which term describes a belief that you are better than others?", "options": ["humility", "inferiority", "superior", "destructive"], "correct_answer": "superior", "explanation": "Superior describes the feeling or belief that one is better or more important than others."}, {"question": "Which adjective describes something causing significant damage or harm?", "options": ["humility", "inferiority", "superior", "destructive"], "correct_answer": "destructive", "explanation": "Destructive means causing or capable of causing damage or harm."}]}, {"id": 4, "stem": "As the ______ of the students wanted to go to the zoo, we had no choice but to agree.", "correct_index": 1, "options": [{"word": "minority", "ipa": "/ma\u026a\u02c8n\u0252r.\u0259.ti/", "meanings": {"en": "A smaller number or part; a number less than half of the whole.", "cn": "\u8f83\u5c0f\u7684\u6570\u91cf\u6216\u90e8\u5206\uff1b\u5c0f\u4e8e\u6574\u4f53\u4e00\u534a\u7684\u6570\u91cf\u3002"}, "usage_en": "Used to describe a smaller group within a larger one, often in social contexts.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8f83\u5927\u7fa4\u4f53\u4e2d\u7684\u8f83\u5c0f\u7fa4\u4f53\uff0c\u901a\u5e38\u5728\u793e\u4f1a\u8bed\u5883\u4e2d\u3002", "scene_en": "A group of students representing a small percentage of the total student body.", "scene_cn": "\u4ee3\u8868\u5b66\u751f\u603b\u6570\u4e00\u5c0f\u90e8\u5206\u7684\u51e0\u4e2a\u5b66\u751f\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q4_minority_1.png", "P6_vocabulary_exercises_14_Q4_minority_2.png"], "examples": [{"en": "The minority of shareholders voted against the proposed merger, but it passed anyway.", "cn": "\u5c11\u6570\u80a1\u4e1c\u6295\u7968\u53cd\u5bf9\u62df\u8bae\u7684\u5408\u5e76\uff0c\u4f46\u5408\u5e76\u8fd8\u662f\u901a\u8fc7\u4e86\u3002"}, {"en": "In our town, the Spanish-speaking population represents a significant minority group.", "cn": "\u5728\u6211\u4eec\u9547\u4e0a\uff0c\u8bf4\u897f\u73ed\u7259\u8bed\u7684\u4eba\u53e3\u5360\u4e86\u5f88\u5927\u7684\u5c11\u6570\u7fa4\u4f53\u3002"}]}, {"word": "majority", "ipa": "/m\u0259\u02c8d\u0292\u0252r.\u0259.ti/", "meanings": {"en": "The greater number; more than half of the whole.", "cn": "\u8f83\u5927\u7684\u6570\u5b57\uff1b\u8d85\u8fc7\u6574\u4f53\u7684\u4e00\u534a\u3002"}, "usage_en": "Used to indicate that more than half of a group agrees or is in favor.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u4e00\u4e2a\u7fa4\u4f53\u4e2d\u8d85\u8fc7\u4e00\u534a\u7684\u4eba\u540c\u610f\u6216\u8d5e\u6210\u3002", "scene_en": "A large group of people raising their hands in agreement.", "scene_cn": "\u4e00\u5927\u7fa4\u4eba\u4e3e\u624b\u8868\u793a\u540c\u610f\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q4_majority_1.png", "P6_vocabulary_exercises_14_Q4_majority_2.png"], "examples": [{"en": "The majority of voters supported the new education policy, ensuring its implementation.", "cn": "\u5927\u591a\u6570\u9009\u6c11\u652f\u6301\u65b0\u7684\u6559\u80b2\u653f\u7b56\uff0c\u786e\u4fdd\u4e86\u5b83\u7684\u5b9e\u65bd\u3002"}, {"en": "The proposal passed because the majority of the committee members voted in favor of it.", "cn": "\u8be5\u63d0\u6848\u83b7\u5f97\u901a\u8fc7\uff0c\u56e0\u4e3a\u59d4\u5458\u4f1a\u7684\u5927\u591a\u6570\u6210\u5458\u6295\u7968\u8d5e\u6210\u3002"}]}, {"word": "maximum", "ipa": "/\u02c8m\u00e6k.s\u026a.m\u0259m/", "meanings": {"en": "The greatest possible amount or degree.", "cn": "\u53ef\u80fd\u7684\u6700\u5927\u6570\u91cf\u6216\u7a0b\u5ea6\u3002"}, "usage_en": "Used to describe the highest limit or capacity.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6700\u9ad8\u9650\u5ea6\u6216\u5bb9\u91cf\u3002", "scene_en": "A speedometer showing the highest speed limit.", "scene_cn": "\u663e\u793a\u6700\u9ad8\u901f\u5ea6\u9650\u5236\u7684\u901f\u5ea6\u8868\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q4_maximum_1.png", "P6_vocabulary_exercises_14_Q4_maximum_2.png"], "examples": [{"en": "The stadium has a maximum capacity of 80,000 people for concerts and sporting events.", "cn": "\u4f53\u80b2\u573a\u5bf9\u97f3\u4e50\u4f1a\u548c\u4f53\u80b2\u8d5b\u4e8b\u7684\u6700\u5927\u5bb9\u91cf\u4e3a80,000\u4eba\u3002"}, {"en": "Please note that the maximum weight allowed on this bridge is ten tons for safety.", "cn": "\u8bf7\u6ce8\u610f\uff0c\u4e3a\u4e86\u5b89\u5168\u8d77\u89c1\uff0c\u8fd9\u5ea7\u6865\u4e0a\u5141\u8bb8\u7684\u6700\u5927\u91cd\u91cf\u662f\u5341\u5428\u3002"}]}, {"word": "optimum", "ipa": "/\u02c8\u0252p.t\u026a.m\u0259m/", "meanings": {"en": "Most conducive to a favorable outcome; best.", "cn": "\u6700\u6709\u5229\u4e8e\u53d6\u5f97\u826f\u597d\u7ed3\u679c\u7684\uff1b\u6700\u4f73\u7684\u3002"}, "usage_en": "Used to describe the best or most favorable condition or level for something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u7269\u7684\u6700\u4f73\u6216\u6700\u6709\u5229\u7684\u6761\u4ef6\u6216\u6c34\u5e73\u3002", "scene_en": "A plant growing healthily in ideal conditions.", "scene_cn": "\u5728\u7406\u60f3\u6761\u4ef6\u4e0b\u5065\u5eb7\u751f\u957f\u7684\u690d\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q4_optimum_1.png", "P6_vocabulary_exercises_14_Q4_optimum_2.png"], "examples": [{"en": "The optimum temperature for brewing coffee is around 90 to 96 degrees Celsius.", "cn": "\u51b2\u6ce1\u5496\u5561\u7684\u6700\u4f73\u6e29\u5ea6\u7ea6\u4e3a90\u81f396\u6444\u6c0f\u5ea6\u3002"}, {"en": "Achieving the optimum balance between work and leisure is crucial for overall well-being.", "cn": "\u5728\u5de5\u4f5c\u548c\u4f11\u95f2\u4e4b\u95f4\u53d6\u5f97\u6700\u4f73\u5e73\u8861\u5bf9\u4e8e\u6574\u4f53\u5e78\u798f\u81f3\u5173\u91cd\u8981\u3002"}]}], "synonym_cn": "\u591a\u6570 vs \u5c11\u6570 vs \u6700\u5927 vs \u6700\u4f73", "socratic_questions": [{"question": "If only a small number of people support a proposal, would you describe them as the ______?", "options": ["minority", "majority", "maximum", "optimum"], "correct_answer": "minority", "explanation": "The 'minority' represents a smaller group within a larger one."}, {"question": "When a group achieves the best possible outcome with available resources, is it operating at its ______?", "options": ["minority", "majority", "maximum", "optimum"], "correct_answer": "optimum", "explanation": "'Optimum' refers to the most favorable or advantageous condition."}, {"question": "If a class has 30 students, and 25 agree on a decision, the agreeing students represent the ______?", "options": ["minority", "majority", "maximum", "optimum"], "correct_answer": "majority", "explanation": "The 'majority' represents the larger part or more than half of a group."}, {"question": "What word describes the highest possible number or amount, like the ______ capacity of a stadium?", "options": ["minority", "majority", "maximum", "optimum"], "correct_answer": "maximum", "explanation": "'Maximum' indicates the greatest possible quantity or degree."}]}, {"id": 5, "stem": "The suspect was ______ by the police for questioning.", "correct_index": 2, "options": [{"word": "retained", "ipa": "/r\u026a\u02c8te\u026and/", "meanings": {"en": "to keep possession of something; to continue to employ someone", "cn": "\u4fdd\u6301\u62e5\u6709\u67d0\u7269\uff1b\u7ee7\u7eed\u96c7\u7528\u67d0\u4eba"}, "usage_en": "Used when keeping something or someone in one's possession or employment.", "usage_cn": "\u7528\u4e8e\u4fdd\u6301\u67d0\u7269\u6216\u67d0\u4eba\u5728\u67d0\u4eba\u7684\u8d22\u4ea7\u6216\u96c7\u7528\u4e2d\u3002", "scene_en": "A lawyer being kept on staff; a company keeping its profits.", "scene_cn": "\u5f8b\u5e08\u88ab\u4fdd\u7559\u5728\u804c\uff1b\u516c\u53f8\u4fdd\u7559\u5176\u5229\u6da6\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q5_retained_1.png", "P6_vocabulary_exercises_14_Q5_retained_2.png"], "examples": [{"en": "The company retained the consultant to advise them on the new project's strategy.", "cn": "\u8be5\u516c\u53f8\u8058\u8bf7\u4e86\u987e\u95ee\uff0c\u5c31\u65b0\u9879\u76ee\u7684\u6218\u7565\u5411\u4ed6\u4eec\u63d0\u4f9b\u5efa\u8bae\u3002"}, {"en": "She retained all the old letters, cherishing the memories they brought back to her.", "cn": "\u5979\u4fdd\u7559\u4e86\u6240\u6709\u7684\u65e7\u4fe1\u4ef6\uff0c\u73cd\u60dc\u5b83\u4eec\u5e26\u7ed9\u5979\u7684\u56de\u5fc6\u3002"}]}, {"word": "prevented", "ipa": "/pr\u026a\u02c8vent\u026ad/", "meanings": {"en": "to stop something from happening or someone from doing something", "cn": "\u963b\u6b62\u67d0\u4e8b\u53d1\u751f\u6216\u963b\u6b62\u67d0\u4eba\u505a\u67d0\u4e8b"}, "usage_en": "Used when stopping an action or event from occurring.", "usage_cn": "\u7528\u4e8e\u963b\u6b62\u884c\u52a8\u6216\u4e8b\u4ef6\u7684\u53d1\u751f\u3002", "scene_en": "A barrier stopping a car; a medicine preventing a disease.", "scene_cn": "\u tart of the outdoor concert later than planned, it was what?", "options": ["retained", "prevented", "detained", "delayed"], "correct_answer": "delayed", "explanation": "Delayed means to postpone or make something happen at a later time than originally planned."}, {"question": "If security measures stopped someone from entering a restricted area, they were being what?", "options": ["retained", "prevented", "detained", "delayed"], "correct_answer": "prevented", "explanation": "Prevented means to stop something from happening or someone from doing something."}]}, {"id": 6, "stem": "The judge ______ the thief to six months in prison.", "correct_index": 2, "options": [{"word": "recommended", "ipa": "/\u02ccrek\u0259\u02c8mend\u026ad/", "meanings": {"en": "Advised or suggested as a good course of action.", "cn": "\u5efa\u8bae\u6216\u63a8\u8350\u4f5c\u4e3a\u597d\u7684\u884c\u52a8\u65b9\u6848\u3002"}, "usage_en": "Used when suggesting something beneficial or suitable.", "usage_cn": "\u7528\u4e8e\u5efa\u8bae\u6709\u76ca\u6216\u5408\u9002\u7684\u4e8b\u7269\u3002", "scene_en": "A doctor advising a patient, a teacher suggesting a book, or a friend giving advice.", "scene_cn": "\u533b\u751f\u5efa\u8bae\u75c5\u4eba\uff0c\u8001\u5e08\u63a8\u8350\u4e00\u672c\u4e66\uff0c\u6216\u8005\u670b\u53cb\u7ed9\u51fa\u5efa\u8bae\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q6_recommended_1.png", "P6_vocabulary_exercises_14_Q6_recommended_2.png"], "examples": [{"en": "The nutritionist recommended a diet rich in fruits and vegetables for better health.", "cn": "\u8425\u517b\u5e08\u5efa\u8bae\u91c7\u7528\u5bcc\u542b\u6c34\u679c\u548c\u852c\u83dc\u7684\u996e\u98df\uff0c\u4ee5\u83b7\u5f97\u66f4\u597d\u7684\u5065\u5eb7\u3002"}, {"en": "My financial advisor recommended investing in a diversified portfolio to minimize risks effectively.", "cn": "\u6211\u7684\u8d22\u52a1\u987e\u95ee\u5efa\u8bae\u6295\u8d44\u4e8e\u591a\u5143\u5316\u7684\u6295\u8d44\u7ec4\u5408\uff0c\u4ee5\u6709\u6548\u964d\u4f4e\ defendant to ten years in prison for his involvement in the crime.", "cn": "\u6cd5\u5b98\u5224\u5904\u88ab\u544a\u5341\u5e74\u6709\u671f\u5f92\u5211\uff0c\u56e0\u4e3a\u4ed6\u53c2\u4e0e\u4e86\u72af\u7f6a\u3002"}, {"en": "She was sentenced to community service after being found guilty of petty theft and vandalism.", "cn": "\u5979\u56e0\u72af\u6709\u5c0f\u5077\u5c0f\u6478\u548c\u6545\u610f\u7834\u574f\u7f6a\u800c\u88ab\u5224\u5904\u793e\u533a\u670d\u52a1\u3002"}]}, {"word": "punished", "ipa": "/\u02c8p\u028cn\u026a\u0283t/", "meanings": {"en": "Subjected to a penalty or suffering for an offense, crime, or fault.", "cn": "\u56e0\u5192\u72af\u3001\u72af\u7f6a\u6216\u8fc7\u5931\u800c\u53d7\u5230\u60e9\u7f5a\u6216\u906d\u53d7\u75db\u82e6\u3002"}, "usage_en": "Used when someone receives a penalty for doing something wrong.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u56e0\u505a\u9519\u4e8b\u800c\u53d7\u5230\u60e9\u7f5a\u65f6\u3002", "scene_en": "A child being scolded by a parent, or a sports team receiving a penalty.", "scene_cn": "\u5b69\u5b50\u88ab\u7236\u6bcd\u8d23\u9a82\uff0c\u6216\u8005\u8fd0\u52a8\u961f\u53d7\u5230\u5904\u7f5a\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q6_punished_1.png", "P6_vocabulary_exercises_14_Q6_punished_2.png"], "examples": [{"en": "The student was punished with detention for cheating on the exam and disrupting the class.", "cn": "\u8be5\u5b66\u751f\u56e0\u5728\u8003\u8bd5\u4e2d\u4f5c\u5f0a\u548c\u6270\u4e71\u8bfe\u5802\u79e9\u5e8f\u800c\u88ab\u5904\u4ee5\u7559\u6821\u5bdf\u770b\u3002"}, {"en": "The company was punished with a heavy fine for violating environmental regulations and polluting the river.", "cn": "\u8be5\u516c\u53f8\u56e0\u8fdd\u53cd\u73af\u5883\u6cd5\u89c4\u548c\u6c61\u67d3\u6cb3\u6d41\u800c\u88ab\u5904\u4ee5\u5de8\u989d\u7f5a\u6b3e\u3002"}]}], "synonym_cn": "\u5224\u5211 vs \u5efa\u8bae vs \u76d1\u7981 vs \u60e9\u7f5a (p\u00e0nx\u00edng vs ji\u00e0ny\u00ec vs ji\u0101nj\u00ecn vs ch\u00e9ngf\u00e1)", "socratic_questions": [{"question": "If a doctor suggests a treatment plan, did they 'jail', 'sentence', 'recommend', or 'punish' the patient?", "options": ["jailed", "sentenced", "recommended", "punished"], "correct_answer": "recommended", "explanation": "'Recommended' means to suggest something as good or suitable."}, {"question": "If someone is found guilty of a crime and put in prison, did the court 'jail', 'sentence', 'recommend', or 'punish' them?", "options": ["jailed", "sentenced", "recommended", "punished"], "correct_answer": "jailed", "explanation": "'Jailed' means to put someone in prison as a punishment."}, {"question": "If a teacher gives extra homework for bad behavior, did they 'jail', 'sentence', 'recommend', or 'punish' the student?", "options": ["jailed", "sentenced", "recommended", "punished"], "correct_answer": "punished", "explanation": "'Punished' means to inflict a penalty for wrongdoing."}, {"question": "If a judge declares the consequences for a crime, did they 'jail', 'sentence', 'recommend', or 'punish' the criminal?", "options": ["jailed", "sentenced", "recommended", "punished"], "correct_answer": "sentenced", "explanation": "To 'sentence' means to declare the punishment for an offense."}]}, {"id": 7, "stem": "My uncle read the contract ______ before signing it.", "correct_index": 0, "options": [{"word": "thoroughly", "ipa": "/\u02c8\u03b8\u025c\u02d0r\u0259li/", "meanings": {"en": "In a detailed and careful manner; completely.", "cn": "\u4ee5\u8be6\u7ec6\u548c\u4ed4\u7ec6\u7684\u65b9\u5f0f\uff1b\u5b8c\u5168\u5730\u3002"}, "usage_en": "Used to describe actions done with great attention to detail.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u975e\u5e38\u6ce8\u91cd\u7ec6\u8282\u7684\u884c\u4e3a\u3002", "scene_en": "A detective examining a crime scene with a magnifying glass.", "scene_cn": "\u4e00\u540d\u4fa6\u63a2\u7528\u653e\u5927\u955c\u68c0\u67e5\u72af\u7f6a\u73b0\u573a\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q7_thoroughly_1.png", "P6_vocabulary_exercises_14_Q7_thoroughly_2.png"], "examples": [{"en": "The surgeon thoroughly cleaned the wound before applying the bandage to prevent infection.", "cn": "\u5916\u79d1\u533b\u751f\u5728\u5305\u624e\u4f24\u53e3\u4e4b\u524d\u5f7b\u5e95\u6e05\u6d01\u4e86\u4f24\u53e3\uff0c\u4ee5\u9632\u6b62\u611f\u67d3\u3002"}, {"en": "She thoroughly researched the topic before presenting her findings to the committee members.", "cn": "\u5979\u5728\u5411\u59d4\u5458\u4f1a\u6210\u5458\u5c55\u793a\u5979\u7684\u53d1\u73b0\u4e4b\u524d\u5f7b\u5e95\u7814\u7a76\u4e86\u8fd9\u4e2a\u4e3b\u9898\u3002"}]}, {"word": "randomly", "ipa": "/\u02c8r\u00e6nd\u0259mli/", "meanings": {"en": "Without a specific pattern, purpose, or method.", "cn": "\u6ca1\u6709\u7279\u5b9a\u7684\u6a21\u5f0f\u3001\u76ee\u7684\u6216\u65b9\u6cd5\u3002"}, "usage_en": "Used to describe actions or selections made without a deliberate choice.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u6ca1\u6709\u523b\u610f\u9009\u62e9\u7684\u60c5\u51b5\u4e0b\u91c7\u53d6\u7684\u884c\u52a8\u6216\u9009\u62e9\u3002", "scene_en": "A lottery machine selecting numbered balls.", "scene_cn": "\u4e00\u53f0\u5f69\u7968\u673a\u9009\u62e9\u5e26\u7f16\u53f7\u7684\u7403\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q7_randomly_1.png", "P6_vocabulary_exercises_14_Q7_randomly_2.png"], "examples": [{"en": "The teacher randomly selected students to answer questions during the lesson about the solar system.", "cn": "\u8001\u5e08\u968f\u673a\u9009\u62e9\u5b66\u751f\u6765\u56de\u7b54\u5173\u4e8e\u592a\u9633\u7cfb\u7684\u8bfe\u7a0b\u4e2d\u7684\u95ee\u9898\u3002"}, {"en": "The computer program randomly generated a series of numbers for the statistical analysis project.", "cn": "\u8be5\u8ba1\u7b97\u673a\u7a0b\u5e8f\u968f\u673a\u751f\u6210\u4e00\u7cfb\u5217\u6570\u5b57\uff0c\u7528\u4e8e\u7edf\u8ba1\u5206\u6790\u9879\u76ee\u3002"}]}, {"word": "haphazardly", "ipa": "/\u02cch\u00e6p\u02c8h\u00e6z\u0259rdli/", "meanings": {"en": "In a disorganized, careless, or random manner.", "cn": "\u4ee5\u4e00\u79cd\u65e0\u7ec4\u7ec7\u3001\u7c97\u5fc3\u6216\u968f\u673a\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes actions done without planning or care.", "usage_cn": "\u63cf\u8ff0\u5728\u6ca1\u6709\u8ba1\u5212\u6216\u5c0f\u5fc3\u7684\u60c5\u51b5\u4e0b\u5b8c\u6210\u7684\u52a8\u4f5c\u3002", "scene_en": "A messy room with items scattered everywhere.", "scene_cn": "\u4e00\u4e2a\u51cc\u4e71\u7684\u623f\u95f4\uff0c\u7269\u54c1\u6563\u843d\u5404\u5904\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q7_haphazardly_1.png", "P6_vocabulary_exercises_14_Q7_haphazardly_2.png"], "examples": [{"en": "He haphazardly threw his clothes into the suitcase before rushing to catch his flight.", "cn": "\u4ed6\u5306\u5fd9\u5730\u628a\u8863\u670d\u6254\u8fdb\u624b\u63d0\u7bb1\uff0c\u7136\u540e\u8d76\u7740\u53bb\u8d76\u98de\u673a\u3002"}, {"en": "The books were stacked haphazardly on the shelf, threatening to topple over at any moment.", "cn": "\u4e66\u672c\u6742\u4e71\u65e0\u7ae0\u5730\u5806\u653e\u5728\u67b6\u5b50\u4e0a\uff0c\u968f\u65f6\u53ef\u80fd\u5012\u584c\u3002"}]}, {"word": "briefly", "ipa": "/\u02c8bri\u02d0fli/", "meanings": {"en": "For a short time; concisely.", "cn": "\u5728\u77ed\u65f6\u95f4\u5185\uff1b\u7b80\u6d01\u5730\u3002"}, "usage_en": "Used to describe actions done quickly or in a short amount of time.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5feb\u901f\u6216\u5728\u77ed\u65f6\u95f4\u5185\u5b8c\u6210\u7684\u52a8\u4f5c\u3002", "scene_en": "A person giving a short presentation.", "scene_cn": "\u4e00\u4e2a\u4eba\u505a\u4e00\u4e2a\u7b80\u77ed\u7684\u6f14\u793a\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q7_briefly_1.png", "P6_vocabulary_exercises_14_Q7_briefly_2.png"], "examples": [{"en": "The speaker briefly mentioned the main points of the proposal before opening the floor for questions.", "cn": "\u53d1\u8a00\u4eba\u5728\u5f00\u59cb\u63d0\u95ee\u4e4b\u524d\u7b80\u8981\u5730\u63d0\u5230\u4e86\u63d0\u6848\u7684\u8981\u70b9\u3002"}, {"en": "She briefly summarized the plot of the movie for her friend who had missed the beginning.", "cn": "\u5979\u4e3a\u9519\u8fc7\u4e86\u5f00\u5934\u7684\u5979\u7684\u670b\u53cb\u7b80\u8981\u5730\u603b\u7ed3\u4e86\u7535\u5f71\u7684\u60c5\u8282\u3002"}]}], "synonym_cn": "\u4ed4\u7ec6\u5730 vs. \u968f\u610f\u5730 vs. \u6f2b\u4e0d\u7ecf\u5fc3\u5730 vs. \u7b80\u8981\u5730", "socratic_questions": [{"question": "If you examine a document with great attention to detail, do you read it thoroughly, randomly, haphazardly, or briefly?", "options": ["thoroughly", "randomly", "haphazardly", "briefly"], "correct_answer": "thoroughly", "explanation": "Thoroughly means with great attention to detail."}, {"question": "If you choose numbers without any pattern, do you choose them thoroughly, randomly, haphazardly, or briefly?", "options": ["thoroughly", "randomly", "haphazardly", "briefly"], "correct_answer": "randomly", "explanation": "Randomly means without a specific pattern or purpose."}, {"question": "If you pack your suitcase without any organization, do you pack it thoroughly, randomly, haphazardly, or briefly?", "options": ["thoroughly", "randomly", "haphazardly", "briefly"], "correct_answer": "haphazardly", "explanation": "Haphazardly means in a disorganized and careless manner."}, {"question": "If you glance at a newspaper to get the main idea, do you read it thoroughly, randomly, haphazardly, or briefly?", "options": ["thoroughly", "randomly", "haphazardly", "briefly"], "correct_answer": "briefly", "explanation": "Briefly means for a short time or in a concise way."}]}, {"id": 8, "stem": "This is a genuine painting, not a/an ______.", "correct_index": 3, "options": [{"word": "artifact", "ipa": "\u02c8\u0251\u02d0rt\u026af\u00e6kt", "meanings": {"en": "An object made by a human being, typically an item of cultural or historical interest.", "cn": "\u7531\u4eba\u7c7b\u5236\u9020\u7684\u7269\u4f53\uff0c\u901a\u5e38\u662f\u5177\u6709\u6587\u5316\u6216\u5386\u53f2\u610f\u4e49\u7684\u7269\u54c1\u3002"}, "usage_en": "Used to describe historical or culturally significant objects.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5177\u6709\u5386\u53f2\u6216\u6587\u5316\u610f\u4e49\u7684\u7269\u4f53\u3002", "scene_en": "A museum display case with ancient pottery shards and tools.", "scene_cn": "\u535a\u7269\u9986\u7684\u9648\u5217\u67dc\u91cc\u6446\u653e\u7740\u53e4\u4ee3\u9676\u5668\u788e\u7247\u548c\u5de5\u5177\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q8_artifact_1.png", "P6_vocabulary_exercises_14_Q8_artifact_2.png"], "examples": [{"en": "The museum displayed ancient artifacts from the Roman Empire, attracting many history enthusiasts.", "cn": "\u535a\u7269\u9986\u5c55\u51fa\u4e86\u6765\u81ea\u7f57\u9a6c\u5e1d\u56fd\u7684\u53e4\u4ee3\u6587\u7269\uff0c\u5438\u5f15\u4e86\u8bb8\u591a\u5386\u53f2\u7231\u597d\u8005\u3002"}, {"en": "Archaeologists discovered a rare artifact during the excavation, shedding light on ancient civilization.", "cn": "\u8003\u53e4\u5b66\u5bb6\u5728\u6316\u6398\u8fc7\u7a0b\u4e2d\u53d1\u73b0\u4e86\u4e00\u4ef6\u7f55\u89c1\u7684\u6587\u7269\uff0c\u63ed\u793a\u4e86\u53e4\u4ee3\u6587\u660e\u3002"}]}, {"word": "duplicate", "ipa": "\u02c8du\u02d0pl\u026ake\u026at", "meanings": {"en": "Exactly like something else, especially through having been copied.", "cn": "\u4e0e\u67d0\u7269\u5b8c\u5168\u76f8\u540c\uff0c\u7279\u522b\u662f\u901a\u8fc7\u590d\u5236\u800c\u5f97\u6765\u7684\u3002"}, "usage_en": "Used to describe exact copies of documents, items, or data.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6587\u4ef6\u3001\u7269\u54c1\u6216\u6570\u636e\u7684\u7cbe\u786e\u526f\u672c\u3002", "scene_en": "A photocopier making an exact copy of a document.", "scene_cn": "\u4e00\u53f0\u590d\u5370\u673a\u6b63\u5728\u5236\u4f5c\u4e00\u4efd\u6587\u4ef6\u7684\u7cbe\u786e\u526f\u672c\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q8_duplicate_1.png", "P6_vocabulary_exercises_14_Q8_duplicate_2.png"], "examples": [{"en": "I need a duplicate of the contract; please make another copy for my records.", "cn": "\u6211\u9700\u8981\u4e00\u4efd\u5408\u540c\u7684\u526f\u672c\uff1b\u8bf7\u518d\u5236\u4f5c\u4e00\u4efd\u526f\u672c\u4f9b\u6211\u8bb0\u5f55\u3002"}, {"en": "The software created a duplicate file to ensure data backup in case of system failure.", "cn": "\u8be5\u8f6f\u4ef6\u521b\u5efa\u4e86\u4e00\u4e2a\u91cd\u590d\u7684\u6587\u4ef6\uff0c\u4ee5\u786e\u4fdd\u5728\u7cfb\u7edf\u6545\u969c\u65f6\u8fdb\u884c\u6570\u636e\u5907\u4efd\u3002"}]}, {"word": "illegal", "ipa": "\u026a\u02c8li\u02d0\u0261\u0259l", "meanings": {"en": "Contrary to or forbidden by law, especially criminal law.", "cn": "\u8fdd\u53cd\u6216\u88ab\u6cd5\u5f8b\u7981\u6b62\u7684\uff0c\u7279\u522b\u662f\u5211\u6cd5\u3002"}, "usage_en": "Used to describe actions or activities that are against the law.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8fdd\u53cd\u6cd5\u5f8b\u7684\u884c\u4e3a\u6216\u6d3b\u52a8\u3002", "scene_en": "A police officer arresting someone for breaking the law.", "scene_cn": "\u4e00\u540d\u8b66\u5bdf\u902e\u6355\u67d0\u4eba\uff0c\u56e0\u4e3a\u4ed6\u8fdd\u53cd\u4e86\u6cd5\u5f8b\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q8_illegal_1.png", "P6_vocabulary_exercises_14_Q8_illegal_2.png"], "examples": [{"en": "It is illegal to drive under the influence of alcohol; it endangers everyone's safety.", "cn": "\u9152\u540e\u9a7e\u8f66\u662f\u8fdd\u6cd5\u7684\uff1b\u5b83\u5371\u53ca\u6bcf\u4e2a\u4eba\u7684\u5b89\u5168\u3002"}, {"en": "Selling counterfeit goods is an illegal activity that harms legitimate businesses and consumers.", "cn": "\u9500\u552e\u5047\u5192\u5546\u54c1\u662f\u4e00\u79cd\u975e\u6cd5\u6d3b\u52a8\uff0c\u635f\u5bb3\u4e86\u5408\u6cd5\u4f01\u4e1a\u548c\u6d88\u8d39\u8005\u3002"}]}, {"word": "imitation", "ipa": "\u02cc\u026am\u026a\u02c8te\u026a\u0283\u0259n", "meanings": {"en": "A thing intended to simulate or copy something else.", "cn": "\u65e8\u5728\u6a21\u4eff\u6216\u590d\u5236\u5176\u4ed6\u4e8b\u7269\u7684\u7269\u54c1\u3002"}, "usage_en": "Used to describe copies or simulations, often of lower quality.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u590d\u5236\u54c1\u6216\u6a21\u62df\u54c1\uff0c\u901a\u5e38\u8d28\u91cf\u8f83\u4f4e\u3002", "scene_en": "A fake designer handbag being sold on the street.", "scene_cn": "\u4e00\u4e2a\u5047\u7684\u54c1\u724c\u624b\u63d0\u5305\u5728\u8857\u4e0a\u51fa\u552e\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q8_imitation_1.png", "P6_vocabulary_exercises_14_Q8_imitation_2.png"], "examples": [{"en": "The store sold imitation leather jackets that looked similar to the real thing but were cheaper.", "cn": "\u8fd9\u5bb6\u5546\u5e97\u51fa\u552e\u4eff\u76ae\u5939\u514b\uff0c\u770b\u8d77\u6765\u4e0e\u771f\u54c1\u76f8\u4f3c\uff0c\u4f46\u66f4\u4fbf\u5b9c\u3002"}, {"en": "Her performance was a poor imitation of the original singer; it lacked the same passion.", "cn": "\u5979\u7684\u8868\u6f14\u662f\u5bf9\u539f\u5531\u6b4c\u624b\u7684\u62d9\u52a3\u6a21\u4eff\uff1b\u7f3a\u4e4f\u540c\u6837\u7684\u6fc0\u60c5\u3002"}]}], "synonym_cn": "\u4eff\u88fd\u54c1, \u8d5d\u54c1, \u5192\u724c\u8d27", "socratic_questions": [{"question": "If a museum discovers a painting is not original, but made to resemble it, what is it?", "options": ["artifact", "duplicate", "illegal", "imitation"], "correct_answer": "imitation", "explanation": "An imitation is a copy made to resemble something genuine."}, {"question": "Which term describes something made as an exact copy of an original document or artwork?", "options": ["artifact", "duplicate", "illegal", "imitation"], "correct_answer": "duplicate", "explanation": "A duplicate is an exact copy of something else."}, {"question": "If a historical object is discovered during an archeological dig, what is it likely to be called?", "options": ["artifact", "duplicate", "illegal", "imitation"], "correct_answer": "artifact", "explanation": "An artifact is a man-made object of historical or cultural interest."}, {"question": "If someone downloads a movie from an unauthorized website, what kind of activity is this?", "options": ["artifact", "duplicate", "illegal", "imitation"], "correct_answer": "illegal", "explanation": "Something illegal is against the law."}]}, {"id": 9, "stem": "The soldiers ______ their enemies and defeated them.", "correct_index": 0, "options": [{"word": "ambushed", "ipa": "/\u02c8\u00e6m\u02ccb\u028a\u0283t/", "meanings": {"en": "to make a surprise attack on someone from a hidden place", "cn": "\u4ece\u9690\u85cf\u7684\u5730\u65b9\u5bf9\u67d0\u4eba\u8fdb\u884c\u7a81\u7136\u88ad\u51fb"}, "usage_en": "Used to describe a surprise attack, often from a concealed position.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u6b21\u7a81\u88ad\uff0c\u901a\u5e38\u662f\u4ece\u9690\u853d\u7684\u4f4d\u7f6e\u53d1\u8d77\u3002", "scene_en": "Imagine soldiers hiding behind trees, suddenly attacking an unsuspecting convoy on a narrow road.", "scene_cn": "\u60f3\u8c61\u4e00\u4e0b\u58eb\u5175\u85cf\u5728\u6811\u540e\uff0c\u7a81\u7136\u88ad\u51fb\u5728\u72ed\u7a84\u9053\u8def\u4e0a\u6beb\u65e0\u6212\u5907\u7684\u8f66\u961f\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q9_ambushed_1.png", "P6_vocabulary_exercises_14_Q9_ambushed_2.png"], "examples": [{"en": "The rebels ambushed the patrol, catching them completely off guard in the mountains.", "cn": "\u53db\u519b\u4f0f\u51fb\u4e86\u5de1\u903b\u961f\uff0c\u5728\u5c71\u533a\u8ba9\u4ed6\u4eec\u63aa\u624b\u4e0d\u53ca\u3002"}, {"en": "We ambushed the opposing team's strategy by predicting their next move and countering it.", "cn": "\u6211\u4eec\u901a\u8fc7\u9884\u6d4b\u5bf9\u65b9\u7684\u4e0b\u4e00\u6b65\u884c\u52a8\u5e76\u53cd\u51fb\uff0c\u4ece\u800c\u4f0f\u51fb\u4e86\u5bf9\u65b9\u7684\u7b56\u7565\u3002"}]}, {"word": "entrap", "ipa": "/\u026an\u02c8tr\u00e6p/", "meanings": {"en": "to catch someone or something in a trap", "cn": "\u7528\u9677\u9631\u6355\u6349\u67d0\u4eba\u6216\u67d0\u7269"}, "usage_en": "To catch or involve someone in a situation from which they cannot escape.", "usage_cn": "\u6355\u6349\u6216\u4f7f\u67d0\u4eba\u9677\u5165\u65e0\u6cd5\u9003\u8131\u7684\u5883\u5730\u3002", "scene_en": "Picture a detective setting a trap to catch a criminal in a sting operation.", "scene_cn": "\u60f3\u8c61\u4e00\u4e0b\u4fa6\u63a2\u8bbe\u7f6e\u9677\u9631\uff0c\u5728\u8bf1\u6355\u884c\u52a8\u4e2d\u6293\u4f4f\u7f6a\u72af\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q9_entrap_1.png", "P6_vocabulary_exercises_14_Q9_entrap_2.png"], "examples": [{"en": "The con artist tried to entrap the elderly woman into investing in a fake company.", "cn": "\u9a97\u5b50\u8bd5\u56fe\u8bf1\u9a97\u8fd9\u4f4d\u8001\u5987\u4eba\u6295\u8d44\u4e00\u5bb6\u5047\u516c\u53f8\u3002"}, {"en": "The spider spun a web to entrap insects, providing it with a constant food source.", "cn": "\u8718\u86db\u7ed3\u7f51\u662f\u4e3a\u4e86\u8bf1\u6355\u6606\u866b\uff0c\u4e3a\u5b83\u63d0\u4f9b\u6301\u7eed\u7684\u98df\u7269\u6765\u6e90\u3002"}]}, {"word": "besiege", "ipa": "/b\u026a\u02c8si\u02d0d\u0292/", "meanings": {"en": "to surround a place with armed forces in order to capture it or force it to surrender", "cn": "\u7528\u6b66\u88c5\u90e8\u961f\u5305\u56f4\u4e00\u4e2a\u5730\u65b9\uff0c\u4ee5\u4fbf\u5360\u9886\u5b83\u6216\u8feb\u4f7f\u5176\u6295\u964d"}, "usage_en": "To surround a place with armed forces to compel surrender; to harass persistently.", "usage_cn": "\u7528\u6b66\u88c5\u90e8\u961f\u5305\u56f4\u4e00\u4e2a\u5730\u65b9\u4ee5\u8feb\u4f7f\u5176\u6295\u964d\uff1b\u4e0d\u65ad\u9a9a\u6270\u3002", "scene_en": "Visualize a medieval castle completely surrounded by an enemy army, cutting off all supplies.", "scene_cn": "\u60f3\u8c61\u4e00\u5ea7\u4e2d\u4e16\u7eaa\u57ce\u5821\u5b8c\u5168\u88ab\u654c\u519b\u5305\u56f4\uff0c\u5207\u65ad\u4e86\u6240\u6709\u8865\u7ed9\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q9_besiege_1.png", "P6_vocabulary_exercises_14_Q9_besiege_2.png"], "examples": [{"en": "The journalists besieged the politician with questions after the controversial statement was released.", "cn": "\u5728\u6709\u4e89\u8bae\u7684\u58f0\u660e\u53d1\u5e03\u540e\uff0c\u8bb0\u8005\u4eec\u7528\u95ee\u9898\u5305\u56f4\u4e86\u8fd9\u4f4d\u653f\u6cbb\u5bb6\u3002"}, {"en": "During the war, the enemy forces besieged the city, hoping to starve the inhabitants into submission.", "cn": "\u6218\u4e89\u671f\u95f4\uff0c\u654c\u519b\u5305\u56f4\u4e86\u8fd9\u5ea7\u57ce\u5e02\uff0c\u5e0c\u671b\u901a\u8fc7\u9965\u997f\u8feb\u4f7f\u5c45\u6c11\u5c48\u670d\u3002"}]}, {"word": "trampled", "ipa": "/\u02c8tr\u00e6mpld/", "meanings": {"en": "to step on and crush something or someone", "cn": "\u8e29\u8e0f\u5e76\u538b\u788e\u67d0\u7269\u6216\u67d0\u4eba"}, "usage_en": "To step heavily on something, causing damage or destruction.", "usage_cn": "\u91cd\u91cd\u5730\u8e29\u5728\u67d0\u7269\u4e0a\uff0c\u9020\u6210\u635f\u574f\u6216\u7834\u574f\u3002", "scene_en": "Imagine a crowd of people running through a field of flowers, crushing them underfoot.", "scene_cn": "\u60f3\u8c61\u4e00\u7fa4\u4eba\u8dd1\u8fc7\u4e00\u7247\u82b1\u7530\uff0c\u5c06\u5b83\u4eec\u8e29\u5728\u811a\u4e0b\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q9_trampled_1.png", "P6_vocabulary_exercises_14_Q9_trampled_2.png"], "examples": [{"en": "The protesters trampled the government's flag in a sign of their strong disapproval and anger.", "cn": "\u6297\u8bae\u8005\u8e29\u8e0f\u4e86\u653f\u5e9c\u7684\u65d7\u5e1c\uff0c\u4ee5\u8868\u793a\u4ed6\u4eec\u5f3a\u70c8\u7684\u4e0d\u6ee1\u548c\u6124\u6012\u3002"}, {"en": "The herd of elephants trampled the crops, leaving the farmer with nothing to harvest that season.", "cn": "\u8c61\u7fa4\u8df5\u8e0f\u4e86\u5e84\u7a3c\uff0c\u5bfc\u81f4\u519c\u6c11\u90a3\u4e2a\u5b63\u8282\u9897\u7c92\u65e0\u6536\u3002"}]}], "synonym_cn": "\u4f0f\u51fb vs. \u8bf1\u6355 vs. \u56f4\u653b vs. \u8df5\u8e0f", "socratic_questions": [{"question": "In a dense forest, which action involves a surprise attack on unsuspecting travelers?", "options": ["ambushed", "entrap", "besiege", "trampled"], "correct_answer": "ambushed", "explanation": "Ambushed implies a surprise attack from a hidden position, fitting the scenario of a dense forest."}, {"question": "Which strategy is best described as using bait or a hidden device to capture an animal?", "options": ["ambushed", "entrap", "besiege", "trampled"], "correct_answer": "entrap", "explanation": "Entrap refers to capturing someone or something using a trap or trick, aligning with the use of bait."}, {"question": "If an army surrounds a castle to cut off supplies, what action are they performing?", "options": ["ambushed", "entrap", "besiege", "trampled"], "correct_answer": "besiege", "explanation": "Besiege means to surround a place with armed forces to compel it to surrender, matching the scenario."}, {"question": "During a protest, if a crowd walks over flowers, what action describes their movement?", "options": ["ambushed", "entrap", "besiege", "trampled"], "correct_answer": "trampled", "explanation": "Trampled means to step on and crush something, which accurately describes walking over flowers."}]}, {"id": 10, "stem": "My cousin is ______ to arrive on the six o'clock flight from Japan.", "correct_index": 1, "options": [{"word": "hoped", "ipa": "ho\u028apt", "meanings": {"en": "To want something to happen or be true, and usually have a good reason to think that it might.", "cn": "\u60f3\u8981\u67d0\u4e8b\u53d1\u751f\u6216\u6210\u771f\uff0c\u5e76\u4e14\u901a\u5e38\u6709\u5145\u5206\u7684\u7406\u7531\u8ba4\u4e3a\u5b83\u53ef\u80fd\u4f1a\u53d1\u751f\u3002"}, "usage_en": "Used to express a desire for a particular outcome.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u7279\u5b9a\u7ed3\u679c\u7684\u6e34\u671b\u3002", "scene_en": "A person looking at the sky, wishing for the rain to stop.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u7740\u5929\u7a7a\uff0c\u5e0c\u671b\u96e8\u505c\u4e0b\u6765\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q10_hoped_1.png", "P6_vocabulary_exercises_14_Q10_hoped_2.png"], "examples": [{"en": "She hoped that her application would be accepted, as she really needed the job.", "cn": "\u5979\u5e0c\u671b\u5979\u7684\u7533\u8bf7\u80fd\u88ab\u63a5\u53d7\uff0c\u56e0\u4e3a\u5979\u771f\u7684\u5f88\u9700\u8981\u8fd9\u4efd\u5de5\u4f5c\u3002"}, {"en": "We hoped for good weather on our vacation, but it rained every single day.", "cn": "\u6211\u4eec\u5e0c\u671b\u5047\u671f\u5929\u6c14\u597d\uff0c\u4f46\u662f\u6bcf\u5929\u90fd\u4e0b\u96e8\u3002"}]}, {"word": "scheduled", "ipa": "\u02c8\u0283edju\u02d0ld", "meanings": {"en": "Planned to happen at a particular time.", "cn": "\u8ba1\u5212\u5728\u7279\u5b9a\u65f6\u95f4\u53d1\u751f\u3002"}, "usage_en": "Used to indicate that an event has been assigned a specific time.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u4e8b\u4ef6\u5df2\u88ab\u5206\u914d\u4e86\u7279\u5b9a\u65f6\u95f4\u3002", "scene_en": "A calendar with appointments marked on specific dates.", "scene_cn": "\u65e5\u5386\u4e0a\u6807\u6709\u7279\u5b9a\u65e5\u671f\u7684\u7ea6\u4f1a\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q10_scheduled_1.png", "P6_vocabulary_exercises_14_Q10_scheduled_2.png"], "examples": [{"en": "The meeting is scheduled for 10 AM tomorrow, so please be on time for it.", "cn": "\u4f1a\u8bae\u5b89\u6392\u5728\u660e\u5929\u4e0a\u534810\u70b9\uff0c\u6240\u4ee5\u8bf7\u51c6\u65f6\u53c2\u52a0\u3002"}, {"en": "Our flight is scheduled to depart at 3 PM, giving us plenty of time to pack.", "cn": "\u6211\u4eec\u7684\u822a\u73ed\u8ba1\u5212\u5728\u4e0b\u53483\u70b9\u8d77\u98de\uff0c\u8fd9\u7ed9\u6211\u4eec\u5145\u8db3\u7684\u65f6\u95f4\u6253\u5305\u884c\u674e\u3002"}]}, {"word": "planned", "ipa": "pl\u00e6nd", "meanings": {"en": "Decided on or arranged in advance.", "cn": "\u63d0\u524d\u51b3\u5b9a\u6216\u5b89\u6392\u3002"}, "usage_en": "Used to describe something that has been thought out and prepared for.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7ecf\u8fc7\u6df1\u601d\u719f\u8651\u548c\u51c6\u5907\u7684\u4e8b\u60c5\u3002", "scene_en": "Architects reviewing blueprints for a new building.", "scene_cn": "\u5efa\u7b51\u5e08\u5ba1\u67e5\u65b0\u5efa\u7b51\u7684\u84dd\u56fe\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q10_planned_1.png", "P6_vocabulary_exercises_14_Q10_planned_2.png"], "examples": [{"en": "We planned a surprise birthday party for my mother, and she was very happy.", "cn": "\u6211\u4eec\u4e3a\u6211\u5988\u5988\u8ba1\u5212\u4e86\u4e00\u4e2a\u60ca\u559c\u751f\u65e5\u6d3e\u5bf9\uff0c\u5979\u975e\u5e38\u9ad8\u5174\u3002"}, {"en": "The company planned to launch a new product line in the next fiscal quarter.", "cn": "\u516c\u53f8\u8ba1\u5212\u5728\u4e0b\u4e00\u4e2a\u8d22\u653f\u5b63\u5ea6\u63a8\u51fa\u4e00\u6761\u65b0\u7684\u4ea7\u54c1\u7ebf\u3002"}]}, {"word": "arranged", "ipa": "\u0259\u02c8re\u026and\u0292d", "meanings": {"en": "Put in a particular order or position; organized.", "cn": "\u4ee5\u7279\u5b9a\u987a\u5e8f\u6216\u4f4d\u7f6e\u653e\u7f6e\uff1b\u6709\u7ec4\u7ec7\u7684\u3002"}, "usage_en": "Used to indicate that something has been organized or prepared.", "usage_cn": "\u7528\u4e8e\u8868\u793a\u67d0\u4e8b\u5df2\u88ab\u7ec4\u7ec7\u6216\u51c6\u5907\u597d\u3002", "scene_en": "A beautifully arranged bouquet of flowers in a vase.", "scene_cn": "\u82b1\u74f6\u91cc\u6446\u653e\u7740\u4e00\u675f\u7cbe\u7f8e\u7684\u9c9c\u82b1\u3002", "image_paths": ["P6_vocabulary_exercises_14_Q10_arranged_1.png", "P6_vocabulary_exercises_14_Q10_arranged_2.png"], "examples": [{"en": "I arranged for a taxi to pick us up from the airport when we arrive in London.", "cn": "\u6211\u5b89\u6392\u4e86\u4e00\u8f86\u51fa\u79df\u8f66\uff0c\u5728\u6211\u4eec\u5230\u8fbe\u4f26\u6566\u65f6\u4ece\u673a\u573a\u63a5\u6211\u4eec\u3002"}, {"en": "The museum arranged a special exhibition of ancient artifacts from around the world.", "cn": "\u535a\u7269\u9986\u5b89\u6392\u4e86\u4e00\u4e2a\u6765\u81ea\u4e16\u754c\u5404\u5730\u7684\u53e4\u4ee3\u6587\u7269\u7684\u7279\u522b\u5c55\u89c8\u3002"}]}], "synonym_cn": "\u9884\u5b9a vs. \u5e0c\u671b vs. \u8ba1\u5212 vs. \u5b89\u6392", "socratic_questions": [{"question": "If you are eagerly anticipating a positive outcome, which word best describes your feeling?", "options": ["hoped", "scheduled", "planned", "arranged"], "correct_answer": "hoped", "explanation": "\"Hoped\" implies a desire and expectation for something good to happen."}, {"question": "Which word suggests that something has been officially placed on a timetable or agenda?", "options": ["hoped", "scheduled", "planned", "arranged"], "correct_answer": "scheduled", "explanation": "\"Scheduled\" means that an event has been assigned a specific time."}, {"question": "If you're carefully thinking through the steps to achieve a goal, which word fits best?", "options": ["hoped", "scheduled", "planned", "arranged"], "correct_answer": "planned", "explanation": "\"Planned\" suggests a detailed strategy for achieving something."}, {"question": "Which word implies that preparations have been made to ensure something happens?", "options": ["hoped", "scheduled", "planned", "arranged"], "correct_answer": "arranged", "explanation": "\"Arranged\" indicates that necessary preparations have been completed."}]}]};
