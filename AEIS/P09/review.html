        const DB = {"meta": {"source_pdf": "D:\\Python\u81ea\u52a8\u5316\\AeisLab_Final\\Vocab\\P6_vocabulary_exercises\\P6_vocabulary_exercises_9.pdf", "azure_key": "8d055d682fcd4af98a51828e04542cd4", "azure_region": "eastasia"}, "questions": [{"id": 1, "stem": "After his release from prison, the ex-convict managed to earn a ________ income as a carpenter to support his family.", "correct_index": 0, "options": [{"word": "sufficient", "ipa": "/s\u0259\u02c8f\u026a\u0283\u0259nt/", "meanings": {"en": "Enough to meet a need or purpose.", "cn": "\u8db3\u591f\u6ee1\u8db3\u9700\u6c42\u6216\u76ee\u7684\u3002"}, "usage_en": "Used to describe an amount that is adequate.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8db3\u591f\u7684\u6570\u91cf\u3002", "scene_en": "A person having enough food on their plate.", "scene_cn": "\u4e00\u4e2a\u4eba\u76d8\u5b50\u91cc\u6709\u8db3\u591f\u7684\u98df\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q1_sufficient_1.png", "P6_vocabulary_exercises_9_Q1_sufficient_2.png"], "examples": [{"en": "We have sufficient evidence to prove his guilt beyond a reasonable doubt in court.", "cn": "\u6211\u4eec\u6709\u8db3\u591f\u7684\u8bc1\u636e\u6765\u8bc1\u660e\u4ed6\u5728\u6cd5\u5ead\u4e0a\u65e0\u53ef\u7f6e\u7591\u7684\u7f6a\u884c\u3002"}, {"en": "The small donation was sufficient to provide the family with a warm meal tonight.", "cn": "\u8fd9\u7b14\u5c0f\u989d\u6350\u6b3e\u8db3\u4ee5\u8ba9\u8fd9\u4e2a\u5bb6\u5ead\u4eca\u665a\u5403\u4e0a\u4e00\u987f\u70ed\u996d\u3002"}]}, {"word": "surplus", "ipa": "/\u02c8s\u025c\u02d0rpl\u028cs/", "meanings": {"en": "An amount of something left over when requirements have been met; an excess of production or supply.", "cn": "\u6ee1\u8db3\u9700\u6c42\u540e\u5269\u4f59\u7684\u91cf\uff1b\u751f\u4ea7\u6216\u4f9b\u5e94\u8fc7\u5269\u3002"}, "usage_en": "Describes an excess or overabundance.", "usage_cn": "\u63cf\u8ff0\u8fc7\u5269\u6216\u8fc7\u591a\u7684\u60c5\u51b5\u3002", "scene_en": "A warehouse filled with extra goods.", "scene_cn": "\u4e00\u4e2a\u88c5\u6ee1\u989d\u5916\u5546\u54c1\u7684\u4ed3\u5e93\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q1_surplus_1.png", "P6_vocabulary_exercises_9_Q1_surplus_2.png"], "examples": [{"en": "The company had a surplus of profits this year due to increased sales revenue.", "cn": "\u7531\u4e8e\u9500\u552e\u6536\u5165\u7684\u589e\u52a0\uff0c\u8be5\u516c\u53f8\u4eca\u5e74\u83b7\u5f97\u4e86\u5927\u91cf\u7684\u5229\u6da6\u76c8\u4f59\u3002"}, {"en": "We donated the surplus food from the event to the local homeless shelter yesterday.", "cn": "\u6628\u5929\u6211\u4eec\u5c06\u6d3b\u52a8\u4e2d\u5269\u4f59\u7684\u98df\u7269\u6350\u8d60\u7ed9\u4e86\u5f53\u5730\u7684\u65e0\u5bb6\u53ef\u5f52\u8005\u6536\u5bb9\u6240\u3002"}]}, {"word": "scarcity", "ipa": "/\u02c8skers\u0259ti/", "meanings": {"en": "The state of being scarce or in short supply; a shortage.", "cn": "\u7a00\u7f3a\u6216\u4f9b\u5e94\u4e0d\u8db3\u7684\u72b6\u6001\uff1b\u77ed\u7f3a\u3002"}, "usage_en": "Refers to a lack of availability.", "usage_cn": "\u6307\u7f3a\u4e4f\u53ef\u7528\u6027\u3002", "scene_en": "Empty shelves in a store due to supply chain issues.", "scene_cn": "\u7531\u4e8e\u4f9b\u5e94\u94fe\u95ee\u9898\uff0c\u5546\u5e97\u91cc\u7684\u8d27\u67b6\u7a7a\u7a7a\u5982\u4e5f\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q1_scarcity_1.png", "P6_vocabulary_exercises_9_Q1_scarcity_2.png"], "examples": [{"en": "The scarcity of clean water is a major problem in many developing countries today.", "cn": "\u6e05\u6d01\u6c34\u7684\u7a00\u7f3a\u662f\u5f53\u4eca\u8bb8\u591a\u53d1\u5c55\u4e2d\u56fd\u5bb6\u7684\u4e00\u4e2a\u4e3b\u8981\u95ee\u9898\u3002"}, {"en": "Due to the drought, there was a scarcity of crops, leading to higher food prices.", "cn": "\u7531\u4e8e\u5e72\u65f1\uff0c\u519c\u4f5c\u7269\u77ed\u7f3a\uff0c\u5bfc\u81f4\u98df\u54c1\u4ef7\u683c\u4e0a\u6da8\u3002"}]}, {"word": "decent", "ipa": "/\u02c8di\u02d0snt/", "meanings": {"en": "Of an acceptable standard; satisfactory.", "cn": "\u8fbe\u5230\u53ef\u63a5\u53d7\u7684\u6807\u51c6\uff1b\u4ee4\u4eba\u6ee1\u610f\u3002"}, "usage_en": "Describes something that is adequate or respectable.", "usage_cn": "\u63cf\u8ff0\u8db3\u591f\u6216\u4f53\u9762\u7684\u4e8b\u7269\u3002", "scene_en": "A person living in a clean and comfortable home.", "scene_cn": "\u4e00\u4e2a\u4eba\u4f4f\u5728\u4e00\u4e2a\u5e72\u51c0\u8212\u9002\u7684\u5bb6\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q1_decent_1.png", "P6_vocabulary_exercises_9_Q1_decent_2.png"], "examples": [{"en": "He earns a decent salary, which allows him to support his family comfortably now.", "cn": "\u4ed6\u6323\u7740\u4e00\u4efd\u4f53\u9762\u7684\u5de5\u8d44\uff0c\u8fd9\u4f7f\u4ed6\u73b0\u5728\u80fd\u591f\u8212\u9002\u5730\u517b\u5bb6\u7cca\u53e3\u3002"}, {"en": "The hotel offered a decent room for the night, providing basic amenities and comfort.", "cn": "\u8fd9\u5bb6\u9152\u5e97\u63d0\u4f9b\u4e86\u4e00\u4e2a\u4f53\u9762\u7684\u623f\u95f4\u8fc7\u591c\uff0c\u63d0\u4f9b\u57fa\u672c\u7684\u8bbe\u65bd\u548c\u8212\u9002\u6027\u3002"}]}], "synonym_cn": "\u8db3\u591f vs. \u5269\u4f59 vs. \u7a00\u7f3a vs. \u4f53\u9762", "socratic_questions": [{"question": "If a family has just enough money to cover their basic needs, which income do they have?", "options": ["sufficient", "surplus", "scarcity", "decent"], "correct_answer": "sufficient", "explanation": "Sufficient means enough to meet needs."}, {"question": "If a company's profits are much higher than expected, what kind of income does it have?", "options": ["sufficient", "surplus", "scarcity", "decent"], "correct_answer": "surplus", "explanation": "Surplus means more than what is needed."}, {"question": "If a country is experiencing a food shortage, what is the state of food availability?", "options": ["sufficient", "surplus", "scarcity", "decent"], "correct_answer": "scarcity", "explanation": "Scarcity means a lack of something."}, {"question": "If someone is paid fairly and respectfully for their work, what kind of income do they have?", "options": ["sufficient", "surplus", "scarcity", "decent"], "correct_answer": "decent", "explanation": "Decent means respectable and adequate."}]}, {"id": 2, "stem": "He expressed his ________ at not being able to attend the meeting.", "correct_index": 0, "options": [{"word": "regret", "ipa": "/r\u026a\u02c8\u0261ret/", "meanings": {"en": "A feeling of sadness, disappointment, or repentance over something that has happened or been done.", "cn": "\u5bf9\u5df2\u7ecf\u53d1\u751f\u6216\u505a\u8fc7\u7684\u4e8b\u60c5\u611f\u5230\u60b2\u4f24\u3001\u5931\u671b\u6216\u540e\u6094\u7684\u611f\u89c9\u3002"}, "usage_en": "Used to express sorrow or disappointment about something.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u67d0\u4e8b\u7684\u60b2\u4f24\u6216\u5931\u671b\u3002", "scene_en": "A person looking back on a past decision with a frown, feeling remorse.", "scene_cn": "\u4e00\u4e2a\u4eba\u56de\u987e\u8fc7\u53bb\u7684\u51b3\u5b9a\uff0c\u76b1\u7740\u7709\u5934\uff0c\u611f\u5230\u61ca\u6094\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q2_regret_1.png", "P6_vocabulary_exercises_9_Q2_regret_2.png"], "examples": [{"en": "I deeply regret not studying harder for the final exams in my university years.", "cn": "\u6211\u975e\u5e38\u540e\u6094\u5927\u5b66\u671f\u95f4\u6ca1\u6709\u66f4\u52aa\u529b\u5730\u5b66\u4e60\u671f\u672b\u8003\u8bd5\u3002"}, {"en": "She expressed regret for her harsh words after realizing their impact on her friend.", "cn": "\u5728\u610f\u8bc6\u5230\u5979\u4e25\u5389\u7684\u8bdd\u5bf9\u670b\u53cb\u7684\u5f71\u54cd\u540e\uff0c\u5979\u5bf9\u81ea\u5df1\u7684\u8bdd\u8868\u793a\u540e\u6094\u3002"}]}, {"word": "sympathy", "ipa": "/\u02c8s\u026amp\u0259\u03b8i/", "meanings": {"en": "Feelings of pity and sorrow for someone else's misfortune.", "cn": "\u5bf9\u4ed6\u4eba\u4e0d\u5e78\u906d\u9047\u7684\u601c\u60af\u548c\u60b2\u4f24\u4e4b\u60c5\u3002"}, "usage_en": "Used to express understanding and care for someone who is suffering.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u6b63\u5728\u53d7\u82e6\u7684\u4eba\u7684\u7406\u89e3\u548c\u5173\u6000\u3002", "scene_en": "A group of people comforting a grieving person, showing support and care.", "scene_cn": "\u4e00\u7fa4\u4eba\u5b89\u6170\u4e00\u4e2a\u60b2\u4f24\u7684\u4eba\uff0c\u8868\u8fbe\u652f\u6301\u548c\u5173\u7231\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q2_sympathy_1.png", "P6_vocabulary_exercises_9_Q2_sympathy_2.png"], "examples": [{"en": "We offered our deepest sympathy to the family after hearing about their tragic loss recently.", "cn": "\u5728\u5f97\u77e5\u4ed6\u4eec\u6700\u8fd1\u7684\u60b2\u60e8\u635f\u5931\u540e\uff0c\u6211\u4eec\u5411\u8fd9\u4e2a\u5bb6\u5ead\u8868\u793a\u6700\u6df1\u5207\u7684\u540c\u60c5\u3002"}, {"en": "She felt sympathy for the homeless man and offered him some food and warm clothing.", "cn": "\u5979\u5bf9\u90a3\u4e2a\u65e0\u5bb6\u53ef\u5f52\u7684\u7537\u4eba\u611f\u5230\u540c\u60c5\uff0c\u5e76\u7ed9\u4ed6\u63d0\u4f9b\u4e86\u4e00\u4e9b\u98df\u7269\u548c\u4fdd\u6696\u7684\u8863\u670d\u3002"}]}, {"word": "respect", "ipa": "/r\u026a\u02c8spekt/", "meanings": {"en": "A feeling of deep admiration for someone or something elicited by their abilities, qualities, or achievements.", "cn": "\u56e0\u67d0\u4eba\u7684\u80fd\u529b\u3001\u54c1\u8d28\u6216\u6210\u5c31\u800c\u5f15\u8d77\u7684\u6df1\u6df1\u7684\u94a6\u4f69\u4e4b\u60c5\u3002"}, "usage_en": "Used to show admiration and high regard for someone or something.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u7684\u94a6\u4f69\u548c\u9ad8\u5ea6\u5c0a\u91cd\u3002", "scene_en": "People applauding a speaker on stage, showing admiration and respect.", "scene_cn": "\u4eba\u4eec\u5728\u821e\u53f0\u4e0a\u4e3a\u6f14\u8bb2\u8005\u9f13\u638c\uff0c\u8868\u8fbe\u94a6\u4f69\u548c\u5c0a\u91cd\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q2_respect_1.png", "P6_vocabulary_exercises_9_Q2_respect_2.png"], "examples": [{"en": "I have great respect for doctors who dedicate their lives to helping others in need.", "cn": "\u6211\u975e\u5e38\u5c0a\u91cd\u90a3\u4e9b\u5949\u732e\u4e00\u751f\u5e2e\u52a9\u6709\u9700\u8981\u7684\u4eba\u7684\u533b\u751f\u3002"}, {"en": "The students showed respect for their teacher by listening attentively during the entire lecture.", "cn": "\u5b66\u751f\u4eec\u5728\u6574\u4e2a\u8bb2\u5ea7\u8fc7\u7a0b\u4e2d\u4e13\u5fc3\u542c\u8bb2\uff0c\u8868\u8fbe\u4e86\u5bf9\u8001\u5e08\u7684\u5c0a\u91cd\u3002"}]}, {"word": "request", "ipa": "/r\u026a\u02c8kwest/", "meanings": {"en": "An act of asking politely or formally for something.", "cn": "\u793c\u8c8c\u6216\u6b63\u5f0f\u5730\u8bf7\u6c42\u67d0\u4e8b\u7269\u7684\u884c\u4e3a\u3002"}, "usage_en": "Used to ask for something in a polite or formal way.", "usage_cn": "\u7528\u4e8e\u4ee5\u793c\u8c8c\u6216\u6b63\u5f0f\u7684\u65b9\u5f0f\u8bf7\u6c42\u67d0\u4e8b\u3002", "scene_en": "A person politely asking a waiter for a glass of water in a restaurant.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u9910\u5385\u91cc\u793c\u8c8c\u5730\u5411\u670d\u52a1\u5458\u8981\u4e00\u676f\u6c34\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q2_request_1.png", "P6_vocabulary_exercises_9_Q2_request_2.png"], "examples": [{"en": "The company sent a formal request to the city council for permission to build the new park.", "cn": "\u8be5\u516c\u53f8\u5411\u5e02\u8bae\u4f1a\u53d1\u51fa\u4e86\u6b63\u5f0f\u8bf7\u6c42\uff0c\u8981\u6c42\u5141\u8bb8\u5efa\u9020\u65b0\u516c\u56ed\u3002"}, {"en": "I made a request to the librarian to renew my borrowed books for another two weeks.", "cn": "\u6211\u5411\u56fe\u4e66\u9986\u5458\u63d0\u51fa\u7eed\u501f\u6211\u501f\u9605\u7684\u4e66\u7c4d\u4e24\u5468\u7684\u8bf7\u6c42\u3002"}]}], "synonym_cn": "\u9057\u61be\uff0c\u60cb\u60dc (y\u00ed h\u00e0n, w\u01cen x\u012b)", "socratic_questions": [{"question": "After accidentally breaking a friend's valuable vase, which feeling would you express?", "options": ["regret", "sympathy", "respect", "request"], "correct_answer": "regret", "explanation": "Regret is the appropriate feeling to express when you feel sorry for something you did."}, {"question": "If a colleague's family member passed away, what would you offer them?", "options": ["regret", "sympathy", "respect", "request"], "correct_answer": "sympathy", "explanation": "Sympathy is the feeling of pity and sorrow for someone else's misfortune."}, {"question": "When addressing a professor during a formal presentation, what would you show?", "options": ["regret", "sympathy", "respect", "request"], "correct_answer": "respect", "explanation": "Respect is a feeling of deep admiration for someone or something elicited by their abilities."}, {"question": "What would you make to the librarian to renew your borrowed books?", "options": ["regret", "sympathy", "respect", "request"], "correct_answer": "request", "explanation": "A request is an act of asking politely or formally for something."}]}, {"id": 3, "stem": "Ray has a very big ________ of old coins.", "correct_index": 1, "options": [{"word": "correction", "ipa": "k\u0259\u02c8r\u025bk\u0283\u0259n", "meanings": {"en": "The act of correcting or the state of being corrected.", "cn": "\u7ea0\u6b63\u7684\u884c\u4e3a\u6216\u88ab\u7ea0\u6b63\u7684\u72b6\u6001\u3002"}, "usage_en": "Used to describe fixing errors.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4fee\u6b63\u9519\u8bef\u3002", "scene_en": "A teacher marking a student's paper with red pen.", "scene_cn": "\u8001\u5e08\u7528\u7ea2\u7b14\u6279\u6539\u5b66\u751f\u7684\u8bd5\u5377\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q3_correction_1.png", "P6_vocabulary_exercises_9_Q3_correction_2.png"], "examples": [{"en": "The teacher made a small correction to the student's grammar in the essay.", "cn": "\u8001\u5e08\u5bf9\u5b66\u751f\u6587\u7ae0\u4e2d\u7684\u8bed\u6cd5\u505a\u4e86\u4e00\u4e2a\u5c0f\u5c0f\u7684\u66f4\u6b63\u3002"}, {"en": "The software update included a correction for a security vulnerability that was found.", "cn": "\u8be5\u8f6f\u4ef6\u66f4\u65b0\u5305\u62ec\u5bf9\u53d1\u73b0\u7684\u5b89\u5168\u6f0f\u6d1e\u7684\u4fee\u590d\u3002"}]}, {"word": "collection", "ipa": "k\u0259\u02c8l\u025bk\u0283\u0259n", "meanings": {"en": "A group of things gathered or acquired.", "cn": "\u6536\u96c6\u6216\u83b7\u5f97\u7684\u7269\u54c1\u7684\u96c6\u5408\u3002"}, "usage_en": "Refers to a set of accumulated items.", "usage_cn": "\u6307\u4e00\u7ec4\u79ef\u7d2f\u7684\u7269\u54c1\u3002", "scene_en": "Shelves filled with various collectible items.", "scene_cn": "\u67b6\u5b50\u4e0a\u6446\u6ee1\u4e86\u5404\u79cd\u6536\u85cf\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q3_collection_1.png", "P6_vocabulary_exercises_9_Q3_collection_2.png"], "examples": [{"en": "My grandfather has a vast collection of rare books that he keeps locked away.", "cn": "\u6211\u7684\u7956\u7236\u6536\u85cf\u4e86\u5927\u91cf\u7684\u73cd\u7a00\u4e66\u7c4d\uff0c\u4ed6\u628a\u5b83\u4eec\u9501\u8d77\u6765\u4e86\u3002"}, {"en": "The museum's art collection includes paintings from many different historical periods and styles.", "cn": "\u535a\u7269\u9986\u7684\u827a\u672f\u6536\u85cf\u54c1\u5305\u62ec\u6765\u81ea\u8bb8\u591a\u4e0d\u540c\u5386\u53f2\u65f6\u671f\u548c\u98ce\u683c\u7684\u7ed8\u753b\u3002"}]}, {"word": "group", "ipa": "\u0261ru\u02d0p", "meanings": {"en": "A number of people or things that are located close together or are considered or classed together.", "cn": "\u4f4d\u7f6e\u9760\u8fd1\u6216\u88ab\u4e00\u8d77\u8003\u8651\u6216\u5206\u7c7b\u7684\u4e00\u7fa4\u4eba\u6216\u7269\u3002"}, "usage_en": "Describes a set of people or things.", "usage_cn": "\u63cf\u8ff0\u4e00\u7ec4\u4eba\u6216\u7269\u3002", "scene_en": "A group of friends laughing together at a cafe.", "scene_cn": "\u4e00\u7fa4\u670b\u53cb\u5728\u5496\u5561\u9986\u91cc\u4e00\u8d77\u6b22\u7b11\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q3_group_1.png", "P6_vocabulary_exercises_9_Q3_group_2.png"], "examples": [{"en": "The students formed a study group to prepare for their upcoming final examinations together.", "cn": "\u5b66\u751f\u4eec\u7ec4\u6210\u4e86\u4e00\u4e2a\u5b66\u4e60\u5c0f\u7ec4\uff0c\u4e00\u8d77\u4e3a\u5373\u5c06\u5230\u6765\u7684\u671f\u672b\u8003\u8bd5\u505a\u51c6\u5907\u3002"}, {"en": "A small group of tourists gathered around the tour guide to listen to the explanation.", "cn": "\u4e00\u5c0f\u7fa4\u6e38\u5ba2\u805a\u96c6\u5728\u5bfc\u6e38\u5468\u56f4\uff0c\u542c\u53d6\u8bb2\u89e3\u3002"}]}, {"word": "gathering", "ipa": "\u02c8\u0261\u00e6\u00f0\u0259r\u026a\u014b", "meanings": {"en": "An assembly or meeting, especially one held for a specific purpose.", "cn": "\u96c6\u4f1a\u6216\u4f1a\u8bae\uff0c\u7279\u522b\u662f\u4e3a\u7279\u5b9a\u76ee\u7684\u800c\u4e3e\u884c\u7684\u96c6\u4f1a\u6216\u4f1a\u8bae\u3002"}, "usage_en": "Indicates a meeting or assembly.", "usage_cn": "\u8868\u793a\u4f1a\u8bae\u6216\u96c6\u4f1a\u3002", "scene_en": "A family gathering in a park with picnic blankets.", "scene_cn": "\u516c\u56ed\u91cc\uff0c\u4e00\u5bb6\u4eba\u805a\u96c6\u5728\u4e00\u8d77\uff0c\u94fa\u7740\u91ce\u9910\u6bef\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q3_gathering_1.png", "P6_vocabulary_exercises_9_Q3_gathering_2.png"], "examples": [{"en": "The annual family gathering is always a joyous occasion filled with laughter and good food.", "cn": "\u4e00\u5e74\u4e00\u5ea6\u7684\u5bb6\u5ead\u805a\u4f1a\u603b\u662f\u4e00\u4e2a\u5145\u6ee1\u6b22\u7b11\u548c\u7f8e\u98df\u7684\u6b22\u4e50\u65f6\u523b\u3002"}, {"en": "The town held a community gathering to discuss the proposed new park development project.", "cn": "\u8be5\u9547\u4e3e\u884c\u4e86\u4e00\u6b21\u793e\u533a\u805a\u4f1a\uff0c\u8ba8\u8bba\u62df\u8bae\u7684\u65b0\u516c\u56ed\u5f00\u53d1\u9879\u76ee\u3002"}]}], "synonym_cn": "\u6536\u85cf; \u805a\u96c6", "socratic_questions": [{"question": "If a teacher marks errors in your essay, what are they doing?", "options": ["correction", "collection", "group", "gathering"], "correct_answer": "correction", "explanation": "A 'correction' involves fixing errors or mistakes."}, {"question": "If you have many stamps from different countries, what do you have?", "options": ["correction", "collection", "group", "gathering"], "correct_answer": "collection", "explanation": "A 'collection' is an accumulation of items, often of a specific type."}, {"question": "If students are working together on a project, what are they?", "options": ["correction", "collection", "group", "gathering"], "correct_answer": "group", "explanation": "A 'group' is a set of individuals working or associated together."}, {"question": "If people are meeting for a party, what is it called?", "options": ["correction", "collection", "group", "gathering"], "correct_answer": "gathering", "explanation": "A 'gathering' is an assembly of people, often for a specific purpose."}]}, {"id": 4, "stem": "After several months of regular exercise, Ken has become ________.", "correct_index": 3, "options": [{"word": "plump", "ipa": "/pl\u028cmp/", "meanings": {"en": "Having a full, rounded shape; somewhat fat.", "cn": "\u62e5\u6709\u4e30\u6ee1\u3001\u5706\u6da6\u7684\u4f53\u578b\uff1b\u6709\u70b9\u80d6\u3002"}, "usage_en": "Used to describe someone who is slightly fat in a healthy or attractive way.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u67d0\u4eba\u7565\u80d6\uff0c\u4f46\u770b\u8d77\u6765\u5065\u5eb7\u6216\u6709\u5438\u5f15\u529b\u3002", "scene_en": "A baby with chubby cheeks; a woman with a pleasantly rounded figure.", "scene_cn": "\u4e00\u4e2a\u8138\u988a\u80d6\u4e4e\u4e4e\u7684\u5a74\u513f\uff1b\u4e00\u4f4d\u8eab\u6750\u5706\u6da6\u7684\u5973\u58eb\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q4_plump_1.png", "P6_vocabulary_exercises_9_Q4_plump_2.png"], "examples": [{"en": "The baby was plump and healthy, with adorable, squeezable cheeks that everyone loved.", "cn": "\u8fd9\u4e2a\u5a74\u513f\u80d6\u4e4e\u4e4e\u7684\u5f88\u5065\u5eb7\uff0c\u6709\u7740\u4eba\u89c1\u4eba\u7231\u7684\u3001\u53ef\u4ee5\u634f\u7684\u53ef\u7231\u8138\u988a\u3002"}, {"en": "She preferred to be plump rather than skinny, enjoying her food and feeling content.", "cn": "\u5979\u5b81\u613f\u80d6\u4e4e\u4e4e\u7684\u4e5f\u4e0d\u613f\u9aa8\u7626\u5982\u67f4\uff0c\u4eab\u53d7\u7740\u7f8e\u98df\uff0c\u611f\u5230\u5f88\u6ee1\u8db3\u3002"}]}, {"word": "skinny", "ipa": "/\u02c8sk\u026ani/", "meanings": {"en": "Very thin; excessively thin.", "cn": "\u975e\u5e38\u7626\uff1b\u8fc7\u4e8e\u7626\u3002"}, "usage_en": "Used to describe someone who is very thin, often in an unhealthy way.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u67d0\u4eba\u975e\u5e38\u7626\uff0c\u901a\u5e38\u662f\u4e0d\u5065\u5eb7\u7684\u65b9\u5f0f\u3002", "scene_en": "A person with visible bones; a model who is excessively thin.", "scene_cn": "\u4e00\u4e2a\u80fd\u770b\u5230\u9aa8\u5934\u7684\u4eba\uff1b\u4e00\u4e2a\u8fc7\u5ea6\u7626\u5f31\u7684\u6a21\u7279\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q4_skinny_1.png", "P6_vocabulary_exercises_9_Q4_skinny_2.png"], "examples": [{"en": "He was so skinny that his clothes hung loosely on him, making him look frail.", "cn": "\u4ed6\u592a\u7626\u4e86\uff0c\u8863\u670d\u677e\u57ae\u5730\u6302\u5728\u4ed6\u8eab\u4e0a\uff0c\u8ba9\u4ed6\u770b\u8d77\u6765\u5f88\u865a\u5f31\u3002"}, {"en": "The doctor advised her to gain weight because she was becoming dangerously skinny and weak.", "cn": "\u533b\u751f\u5efa\u8bae\u5979\u589e\u91cd\uff0c\u56e0\u4e3a\u5979\u53d8\u5f97\u975e\u5e38\u7626\u5f31\uff0c\u800c\u4e14\u5f88\u5371\u9669\u3002"}]}, {"word": "flabby", "ipa": "/\u02c8fl\u00e6bi/", "meanings": {"en": "Soft, loose, and fleshy; lacking firmness or muscle tone.", "cn": "\u67d4\u8f6f\u3001\u677e\u5f1b\u3001\u8089\u611f\u7684\uff1b\u7f3a\u4e4f\u7d27\u81f4\u6216\u808c\u8089\u5f20\u529b\u3002"}, "usage_en": "Used to describe body parts that are soft and loose, often due to lack of exercise.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u8eab\u4f53\u90e8\u4f4d\u67d4\u8f6f\u677e\u5f1b\uff0c\u901a\u5e38\u662f\u7531\u4e8e\u7f3a\u4e4f\u953b\u70bc\u3002", "scene_en": "A person with loose skin on their arms; a stomach that lacks muscle definition.", "scene_cn": "\u4e00\u4e2a\u624b\u81c2\u76ae\u80a4\u677e\u5f1b\u7684\u4eba\uff1b\u4e00\u4e2a\u7f3a\u4e4f\u808c\u8089\u7ebf\u6761\u7684\u8179\u90e8\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q4_flabby_1.png", "P6_vocabulary_exercises_9_Q4_flabby_2.png"], "examples": [{"en": "After years of inactivity, his muscles had become flabby and lacked their former strength.", "cn": "\u7ecf\u8fc7\u591a\u5e74\u7684\u4e0d\u8fd0\u52a8\uff0c\u4ed6\u7684\u808c\u8089\u53d8\u5f97\u677e\u5f1b\uff0c\u5931\u53bb\u4e86\u4ee5\u524d\u7684\u529b\u91cf\u3002"}, {"en": "She wanted to tone her flabby stomach with regular exercise and a healthy diet plan.", "cn": "\u5979\u60f3\u901a\u8fc7\u6709\u89c4\u5f8b\u7684\u953b\u70bc\u548c\u5065\u5eb7\u7684\u996e\u98df\u8ba1\u5212\u6765\u953b\u70bc\u5979\u677e\u5f1b\u7684\u8179\u90e8\u3002"}]}, {"word": "lean", "ipa": "/li\u02d0n/", "meanings": {"en": "Thin and muscular; having little fat.", "cn": "\u7626\u800c\u808c\u8089\u53d1\u8fbe\uff1b\u51e0\u4e4e\u6ca1\u6709\u8102\u80aa\u3002"}, "usage_en": "Used to describe someone who is thin and fit, with well-defined muscles.", "usage_cn": "\u7528\u6765\u5f62\u5bb9\u67d0\u4eba\u7626\u800c\u5065\u5eb7\uff0c\u808c\u8089\u7ebf\u6761\u5206\u660e\u3002", "scene_en": "A runner with a toned physique; a person with a slender, muscular build.", "scene_cn": "\u4e00\u4e2a\u4f53\u683c\u5065\u7f8e\u7684\u8dd1\u6b65\u8005\uff1b\u4e00\u4e2a\u8eab\u6750\u82d7\u6761\u3001\u808c\u8089\u53d1\u8fbe\u7684\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q4_lean_1.png", "P6_vocabulary_exercises_9_Q4_lean_2.png"], "examples": [{"en": "The marathon runner had a lean physique, honed by years of intense training and discipline.", "cn": "\u8fd9\u4f4d\u9a6c\u62c9\u677e\u8fd0\u52a8\u5458\u8eab\u6750\u7cbe\u5e72\uff0c\u8fd9\u662f\u591a\u5e74\u9ad8\u5f3a\u5ea6\u8bad\u7ec3\u548c\u81ea\u5f8b\u7684\u7ed3\u679c\u3002"}, {"en": "He admired the lean, muscular build of the swimmer, a testament to his dedication.", "cn": "\u4ed6\u6b23\u8d4f\u8fd9\u4f4d\u6e38\u6cf3\u8fd0\u52a8\u5458\u7cbe\u5e72\u3001\u808c\u8089\u53d1\u8fbe\u7684\u8eab\u6750\uff0c\u8fd9\u662f\u4ed6\u5949\u732e\u7cbe\u795e\u7684\u8bc1\u660e\u3002"}]}], "synonym_cn": "\u82d7\u6761, \u7cbe\u5e72, \u5065\u58ee", "socratic_questions": [{"question": "If someone has gained weight and is noticeably rounder, would you describe them as plump, skinny, flabby, or lean?", "options": ["plump", "skinny", "flabby", "lean"], "correct_answer": "plump", "explanation": "Plump suggests a fullness of figure, often in a pleasant way."}, {"question": "If a person is underweight and their clothes hang loosely, are they plump, skinny, flabby, or lean?", "options": ["plump", "skinny", "flabby", "lean"], "correct_answer": "skinny", "explanation": "Skinny means very thin, often suggesting being underweight."}, {"question": "If someone has soft, loose flesh due to lack of exercise, are they plump, skinny, flabby, or lean?", "options": ["plump", "skinny", "flabby", "lean"], "correct_answer": "flabby", "explanation": "Flabby describes soft, loose flesh, lacking muscle tone."}, {"question": "If a person has a body with little fat and well-defined muscles, are they plump, skinny, flabby, or lean?", "options": ["plump", "skinny", "flabby", "lean"], "correct_answer": "lean", "explanation": "Lean describes someone thin and muscular, with little excess fat."}]}, {"id": 5, "stem": "All passengers were asked to ________ their seat belts as the aeroplane was landing.", "correct_index": 3, "options": [{"word": "attach", "ipa": "/\u0259\u02c8t\u00e6t\u0283/", "meanings": {"en": "To join or connect something to something else.", "cn": "\u5c06\u67d0\u7269\u8fde\u63a5\u6216\u9644\u52a0\u5230\u53e6\u4e00\u7269\u4e0a\u3002"}, "usage_en": "Used to describe connecting items together, often temporarily.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5c06\u7269\u54c1\u8fde\u63a5\u5728\u4e00\u8d77\uff0c\u901a\u5e38\u662f\u6682\u65f6\u6027\u7684\u3002", "scene_en": "A document being added to an email; a trailer connected to a car.", "scene_cn": "\u5c06\u6587\u6863\u6dfb\u52a0\u5230\u7535\u5b50\u90ae\u4ef6\uff1b\u62d6\u8f66\u8fde\u63a5\u5230\u6c7d\u8f66\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q5_attach_1.png", "P6_vocabulary_exercises_9_Q5_attach_2.png"], "examples": [{"en": "Please attach the signed contract to the email before sending it to the client.", "cn": "\u8bf7\u5728\u53d1\u9001\u7ed9\u5ba2\u6237\u4e4b\u524d\uff0c\u5c06\u5df2\u7b7e\u7f72\u7684\u5408\u540c\u9644\u52a0\u5230\u7535\u5b50\u90ae\u4ef6\u4e2d\u3002"}, {"en": "I need to attach this label to the package before I ship it out.", "cn": "\u5728\u53d1\u8d27\u4e4b\u524d\uff0c\u6211\u9700\u8981\u5c06\u6b64\u6807\u7b7e\u9644\u52a0\u5230\u5305\u88f9\u4e0a\u3002"}]}, {"word": "tie", "ipa": "/ta\u026a/", "meanings": {"en": "To fasten or bind something with a string, rope, or similar material.", "cn": "\u7528\u7ef3\u5b50\u6216\u7c7b\u4f3c\u6750\u6599\u7cfb\u7d27\u6216\u6346\u7ed1\u67d0\u7269\u3002"}, "usage_en": "Refers to using knots to secure items or create a bond.", "usage_cn": "\u6307\u4f7f\u7528\u7ed3\u6765\u56fa\u5b9a\u7269\u54c1\u6216\u5efa\u7acb\u8054\u7cfb\u3002", "scene_en": "Tying shoelaces; tying a boat to a dock.", "scene_cn": "\u7cfb\u978b\u5e26\uff1b\u5c06\u8239\u7cfb\u5728\u7801\u5934\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q5_tie_1.png", "P6_vocabulary_exercises_9_Q5_tie_2.png"], "examples": [{"en": "Could you please tie the ribbon around the gift box to make it prettier?", "cn": "\u4f60\u80fd\u5e2e\u6211\u5728\u793c\u54c1\u76d2\u4e0a\u7cfb\u4e0a\u4e1d\u5e26\uff0c\u8ba9\u5b83\u66f4\u6f02\u4eae\u5417\uff1f"}, {"en": "Remember to tie your shoelaces tightly so you don't trip and fall down.", "cn": "\u8bb0\u4f4f\u8981\u7cfb\u7d27\u4f60\u7684\u978b\u5e26\uff0c\u8fd9\u6837\u4f60\u5c31\u4e0d\u4f1a\u7eca\u5012\u6454\u5012\u4e86\u3002"}]}, {"word": "fix", "ipa": "/f\u026aks/", "meanings": {"en": "To repair or mend something; to make something secure or stable.", "cn": "\u4fee\u7406\u6216\u4fee\u8865\u67d0\u7269\uff1b\u4f7f\u67d0\u7269\u5b89\u5168\u6216\u7a33\u5b9a\u3002"}, "usage_en": "Implies repairing something broken or making something secure.", "usage_cn": "\u610f\u5473\u7740\u4fee\u7406\u635f\u574f\u7684\u4e1c\u897f\u6216\u4f7f\u67d0\u7269\u5b89\u5168\u3002", "scene_en": "Fixing a broken bicycle; fixing a shelf to a wall.", "scene_cn": "\u4fee\u7406\u574f\u4e86\u7684\u81ea\u884c\u8f66\uff1b\u5c06\u67b6\u5b50\u56fa\u5b9a\u5728\u5899\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q5_fix_1.png", "P6_vocabulary_exercises_9_Q5_fix_2.png"], "examples": [{"en": "I need to fix the leaky faucet in the bathroom before it wastes more water.", "cn": "\u6211\u9700\u8981\u5728\u6d74\u5ba4\u91cc\u4fee\u7406\u6f0f\u6c34\u7684\u6c34\u9f99\u5934\uff0c\u4ee5\u514d\u6d6a\u8d39\u66f4\u591a\u7684\u6c34\u3002"}, {"en": "He tried to fix the old computer, but it was beyond repair and too outdated.", "cn": "\u4ed6\u8bd5\u56fe\u4fee\u7406\u65e7\u7535\u8111\uff0c\u4f46\u5b83\u5df2\u7ecf\u65e0\u6cd5\u4fee\u590d\u5e76\u4e14\u592a\u65e7\u4e86\u3002"}]}, {"word": "fasten", "ipa": "/\u02c8f\u00e6s\u0259n/", "meanings": {"en": "To close or secure something; to attach or connect securely.", "cn": "\u5173\u95ed\u6216\u56fa\u5b9a\u67d0\u7269\uff1b\u5b89\u5168\u5730\u8fde\u63a5\u6216\u9644\u52a0\u3002"}, "usage_en": "Used for securing closures like seatbelts, buttons, or zippers.", "usage_cn": "\u7528\u4e8e\u56fa\u5b9a\u5b89\u5168\u5e26\u3001\u6309\u94ae\u6216\u62c9\u94fe\u7b49\u95ed\u5408\u88c5\u7f6e\u3002", "scene_en": "Fastening a seatbelt in a car; fastening buttons on a shirt.", "scene_cn": "\u5728\u6c7d\u8f66\u4e2d\u7cfb\u5b89\u5168\u5e26\uff1b\u7cfb\u886c\u886b\u4e0a\u7684\u7ebd\u6263\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q5_fasten_1.png", "P6_vocabulary_exercises_9_Q5_fasten_2.png"], "examples": [{"en": "Please fasten your seatbelts before the car starts moving for your own safety.", "cn": "\u4e3a\u4e86\u60a8\u81ea\u8eab\u7684\u5b89\u5168\uff0c\u8bf7\u5728\u6c7d\u8f66\u542f\u52a8\u524d\u7cfb\u597d\u5b89\u5168\u5e26\u3002"}, {"en": "Make sure to fasten all the buttons on your coat before going outside in the cold.", "cn": "\u5728\u5bd2\u51b7\u7684\u5929\u6c14\u91cc\u5916\u51fa\u4e4b\u524d\uff0c\u8bf7\u52a1\u5fc5\u7cfb\u597d\u5916\u5957\u4e0a\u7684\u6240\u6709\u7ebd\u6263\u3002"}]}], "synonym_cn": "\u8fde\u63a5\uff0c\u7cfb\u7d27\uff0c\u56fa\u5b9a", "socratic_questions": [{"question": "\u5728\u5efa\u9020\u6a21\u578b\u65f6\uff0c\u4f60\u4f1a\u5982\u4f55\u5c06\u4e24\u4e2a\u5851\u6599\u90e8\u4ef6\u8fde\u63a5\u5728\u4e00\u8d77\uff1f", "options": ["attach", "tie", "fix", "fasten"], "correct_answer": "attach", "explanation": "Attach\u610f\u5473\u7740\u5c06\u4e24\u4e2a\u7269\u4f53\u8fde\u63a5\u5728\u4e00\u8d77\uff0c\u901a\u5e38\u662f\u6682\u65f6\u6027\u7684\u3002"}, {"question": "\u5982\u679c\u4f60\u9700\u8981\u5c06\u4e24\u6839\u7ef3\u5b50\u8fde\u63a5\u8d77\u6765\uff0c\u4f60\u4f1a\u600e\u4e48\u505a\uff1f", "options": ["attach", "tie", "fix", "fasten"], "correct_answer": "tie", "explanation": "Tie\u610f\u5473\u7740\u7528\u7ef3\u5b50\u6216\u7c7b\u4f3c\u7269\u5c06\u7269\u4f53\u7ed1\u5728\u4e00\u8d77\u3002"}, {"question": "\u5982\u679c\u4f60\u7684\u81ea\u884c\u8f66\u80ce\u6f0f\u6c14\u4e86\uff0c\u4f60\u4f1a\u600e\u4e48\u5904\u7406\uff1f", "options": ["attach", "tie", "fix", "fasten"], "correct_answer": "fix", "explanation": "Fix\u610f\u5473\u7740\u4fee\u7406\u6216\u4f7f\u67d0\u7269\u6062\u590d\u6b63\u5e38\u8fd0\u4f5c\u72b6\u6001\u3002"}, {"question": "\u4e3a\u4e86\u5b89\u5168\u8d77\u89c1\uff0c\u4e58\u5750\u8fc7\u5c71\u8f66\u65f6\u5e94\u8be5\u600e\u4e48\u505a\uff1f", "options": ["attach", "tie", "fix", "fasten"], "correct_answer": "fasten", "explanation": "Fasten\u610f\u5473\u7740\u7262\u56fa\u5730\u7cfb\u7d27\u6216\u56fa\u5b9a\u67d0\u7269\u3002"}]}, {"id": 6, "stem": "You must never ________ a single word of this to anyone.", "correct_index": 0, "options": [{"word": "breathe", "ipa": "bri\u02d0\u00f0", "meanings": {"en": "To utter or whisper (a secret or rumor).", "cn": "\u5410\u9732\u6216\u4f4e\u8bed\uff08\u79d8\u5bc6\u6216\u8c23\u8a00\uff09\u3002"}, "usage_en": "Used to emphasize the importance of keeping a secret.", "usage_cn": "\u7528\u4e8e\u5f3a\u8c03\u4fdd\u5b88\u79d8\u5bc6\u7684\u91cd\u8981\u6027\u3002", "scene_en": "A person holding their breath, symbolizing keeping a secret.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c4f\u4f4f\u547c\u5438\uff0c\u8c61\u5f81\u7740\u4fdd\u5b88\u79d8\u5bc6\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q6_breathe_1.png", "P6_vocabulary_exercises_9_Q6_breathe_2.png"], "examples": [{"en": "Don't breathe a word about the surprise party; it must remain a secret.", "cn": "\u4e0d\u8981\u900f\u9732\u5173\u4e8e\u60ca\u559c\u6d3e\u5bf9\u7684\u4efb\u4f55\u6d88\u606f\uff1b\u5b83\u5fc5\u987b\u4fdd\u5bc6\u3002"}, {"en": "If you breathe even a hint of this information, there will be consequences.", "cn": "\u5982\u679c\u4f60\u900f\u9732\u54ea\u6015\u4e00\u4e1d\u5173\u4e8e\u8fd9\u4e2a\u4fe1\u606f\u7684\u6d88\u606f\uff0c\u5c06\u4f1a\u627f\u62c5\u540e\u679c\u3002"}]}, {"word": "slip", "ipa": "sl\u026ap", "meanings": {"en": "To disclose (a secret) unintentionally or tactlessly.", "cn": "\u65e0\u610f\u6216\u4e0d\u5f97\u4f53\u5730\u6cc4\u9732\uff08\u79d8\u5bc6\uff09\u3002"}, "usage_en": "Describes an accidental revelation of sensitive information.", "usage_cn": "\u63cf\u8ff0\u4e86\u654f\u611f\u4fe1\u606f\u7684\u610f\u5916\u6cc4\u9732\u3002", "scene_en": "Someone tripping and accidentally dropping papers with sensitive information.", "scene_cn": "\u6709\u4eba\u7eca\u5012\uff0c\u4e0d\u5c0f\u5fc3\u6389\u843d\u4e86\u5e26\u6709\u654f\u611f\u4fe1\u606f\u7684\u6587\u4ef6\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q6_slip_1.png", "P6_vocabulary_exercises_9_Q6_slip_2.png"], "examples": [{"en": "I didn't mean to slip the news about her promotion; it just came out.", "cn": "\u6211\u4e0d\u662f\u6545\u610f\u6cc4\u9732\u5979\u5347\u804c\u7684\u6d88\u606f\u7684\uff1b\u5b83\u53ea\u662f\u8131\u53e3\u800c\u51fa\u4e86\u3002"}, {"en": "Be careful not to slip any details during the meeting; confidentiality is key.", "cn": "\u5728\u4f1a\u8bae\u671f\u95f4\u5c0f\u5fc3\u4e0d\u8981\u6cc4\u9732\u4efb\u4f55\u7ec6\u8282\uff1b\u4fdd\u5bc6\u662f\u5173\u952e\u3002"}]}, {"word": "leak", "ipa": "li\u02d0k", "meanings": {"en": "To disclose confidential information to the public.", "cn": "\u5411\u516c\u4f17\u6cc4\u9732\u673a\u5bc6\u4fe1\u606f\u3002"}, "usage_en": "Refers to the unauthorized release of private information.", "usage_cn": "\u6307\u672a\u7ecf\u6388\u6743\u53d1\u5e03\u79c1\u4eba\u4fe1\u606f\u3002", "scene_en": "A pipe with water leaking out, symbolizing information leaking.", "scene_cn": "\u4e00\u6839\u6f0f\u6c34\u7684\u7ba1\u9053\uff0c\u8c61\u5f81\u7740\u4fe1\u606f\u6cc4\u9732\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q6_leak_1.png", "P6_vocabulary_exercises_9_Q6_leak_2.png"], "examples": [{"en": "The company is investigating who decided to leak the internal memo to the press.", "cn": "\u516c\u53f8\u6b63\u5728\u8c03\u67e5\u662f\u8c01\u51b3\u5b9a\u5c06\u5185\u90e8\u5907\u5fd8\u5f55\u6cc4\u9732\u7ed9\u5a92\u4f53\u7684\u3002"}, {"en": "If you leak this data, you will face severe consequences and legal repercussions.", "cn": "\u5982\u679c\u4f60\u6cc4\u9732\u8fd9\u4e9b\u6570\u636e\uff0c\u4f60\u5c06\u9762\u4e34\u4e25\u91cd\u7684\u540e\u679c\u548c\u6cd5\u5f8b\u5f71\u54cd\u3002"}]}, {"word": "announce", "ipa": "\u0259\u02c8na\u028ans", "meanings": {"en": "To make a formal or public declaration about a fact, occurrence, or intention.", "cn": "\u5bf9\u4e8b\u5b9e\u3001\u4e8b\u4ef6\u6216\u610f\u56fe\u8fdb\u884c\u6b63\u5f0f\u6216\u516c\u5f00\u7684\u58f0\u660e\u3002"}, "usage_en": "Used when making an official statement or declaration.", "usage_cn": "\u7528\u4e8e\u53d1\u8868\u6b63\u5f0f\u58f0\u660e\u6216\u5ba3\u544a\u3002", "scene_en": "A person standing on a stage, announcing important news to a crowd.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u821e\u53f0\u4e0a\uff0c\u5411\u4eba\u7fa4\u5ba3\u5e03\u91cd\u8981\u6d88\u606f\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q6_announce_1.png", "P6_vocabulary_exercises_9_Q6_announce_2.png"], "examples": [{"en": "The CEO will announce the company's new strategy at the annual conference tomorrow.", "cn": "\u9996\u5e2d\u6267\u884c\u5b98\u5c06\u4e8e\u660e\u5929\u5728\u5e74\u5ea6\u4f1a\u8bae\u4e0a\u5ba3\u5e03\u516c\u53f8\u7684\u65b0\u6218\u7565\u3002"}, {"en": "They will announce the winners of the competition during the awards ceremony.", "cn": "\u4ed6\u4eec\u5c06\u5728\u9881\u5956\u5178\u793c\u4e0a\u5ba3\u5e03\u6bd4\u8d5b\u7684\u83b7\u80dc\u8005\u3002"}]}], "synonym_cn": "\u900f\u9732\uff0c\u6cc4\u9732\uff0c\u8bf4\u51fa", "socratic_questions": [{"question": "Imagine you accidentally overheard a secret. Which action is most crucial to maintain trust?", "options": ["breathe", "slip", "leak", "announce"], "correct_answer": "breathe", "explanation": "To 'breathe' implies not uttering a word, keeping the secret completely safe."}, {"question": "If a secret almost escaped your lips, but you stopped yourself just in time, you almost did what?", "options": ["breathe", "slip", "leak", "announce"], "correct_answer": "slip", "explanation": "'Slip' suggests an unintentional, almost-made mistake in revealing something."}, {"question": "If someone carelessly shares confidential information, they might unintentionally do what?", "options": ["breathe", "slip", "leak", "announce"], "correct_answer": "leak", "explanation": "'Leak' implies an uncontrolled release of information, often unintentionally."}, {"question": "What would you do if you wanted everyone to know a secret immediately?", "options": ["breathe", "slip", "leak", "announce"], "correct_answer": "announce", "explanation": "'Announce' means to formally or publicly declare something."}]}, {"id": 7, "stem": "The dress that she wore ________ her lovely figure.", "correct_index": 1, "options": [{"word": "accented", "ipa": "/\u02c8\u00e6ksent\u026ad/", "meanings": {"en": "Spoken with a particular way of pronouncing words, typically associated with a region.", "cn": "\u4ee5\u7279\u5b9a\u7684\u53d1\u97f3\u65b9\u5f0f\u8bf4\u8bdd\uff0c\u901a\u5e38\u4e0e\u67d0\u4e2a\u5730\u533a\u76f8\u5173\u3002"}, "usage_en": "Used to describe speech or writing that has a specific regional or stylistic characteristic.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5177\u6709\u7279\u5b9a\u533a\u57df\u6216\u98ce\u683c\u7279\u5f81\u7684\u8bed\u97f3\u6216\u5199\u4f5c\u3002", "scene_en": "A person speaking with a noticeable British accent in an American film.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u7f8e\u56fd\u7535\u5f71\u4e2d\u8bf4\u7740\u660e\u663e\u7684\u82f1\u56fd\u53e3\u97f3\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q7_accented_1.png", "P6_vocabulary_exercises_9_Q7_accented_2.png"], "examples": [{"en": "Her French accented English was charming, adding to her exotic appeal greatly.", "cn": "\u5979\u7684\u6cd5\u8bed\u53e3\u97f3\u82f1\u8bed\u5f88\u8ff7\u4eba\uff0c\u5927\u5927\u589e\u52a0\u4e86\u5979\u7684\u5f02\u56fd\u60c5\u8c03\u3002"}, {"en": "The novel's dialogue was accented with the local dialect, making it authentic.", "cn": "\u8fd9\u90e8\u5c0f\u8bf4\u91cc\u7684\u5bf9\u8bdd\u5e26\u6709\u5730\u65b9\u65b9\u8a00\uff0c\u4f7f\u5b83\u663e\u5f97\u975e\u5e38\u771f\u5b9e\u3002"}]}, {"word": "accentuated", "ipa": "/\u0259k\u02c8sent\u0283ue\u026at\u026ad/", "meanings": {"en": "Made more noticeable or prominent; emphasized.", "cn": "\u4f7f\u66f4\u52a0\u660e\u663e\u6216\u7a81\u51fa\uff1b\u5f3a\u8c03\u3002"}, "usage_en": "Used to describe something that has been highlighted or emphasized to draw attention.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5df2\u88ab\u7a81\u51fa\u6216\u5f3a\u8c03\u4ee5\u5f15\u8d77\u6ce8\u610f\u7684\u4e8b\u7269\u3002", "scene_en": "A fashion designer adjusting a dress on a model to highlight the waistline.", "scene_cn": "\u65f6\u88c5\u8bbe\u8ba1\u5e08\u5728\u6a21\u7279\u8eab\u4e0a\u8c03\u6574\u8fde\u8863\u88d9\u4ee5\u7a81\u51fa\u8170\u7ebf\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q7_accentuated_1.png", "P6_vocabulary_exercises_9_Q7_accentuated_2.png"], "examples": [{"en": "The low lighting accentuated the shadows on his face, creating a mysterious look.", "cn": "\u660f\u6697\u7684\u706f\u5149\u7a81\u51fa\u4e86\u4ed6\u8138\u4e0a\u7684\u9634\u5f71\uff0c\u8425\u9020\u51fa\u4e00\u79cd\u795e\u79d8\u7684\u8868\u60c5\u3002"}, {"en": "Her bright red lipstick accentuated her full lips, making them even more attractive.", "cn": "\u5979\u9c9c\u7ea2\u8272\u7684\u53e3\u7ea2\u7a81\u51fa\u4e86\u5979\u4e30\u6ee1\u7684\u5634\u5507\uff0c\u4f7f\u5b83\u4eec\u66f4\u5177\u5438\u5f15\u529b\u3002"}]}, {"word": "alerted", "ipa": "/\u0259\u02c8l\u025c\u02d0rt\u026ad/", "meanings": {"en": "Informed someone of a danger or problem.", "cn": "\u544a\u77e5\u67d0\u4eba\u5371\u9669\u6216\u95ee\u9898\u3002"}, "usage_en": "Used when someone is warned about a potential threat or issue.", "usage_cn": "\u7528\u4e8e\u8b66\u544a\u67d0\u4eba\u6709\u5173\u6f5c\u5728\u5a01\u80c1\u6216\u95ee\u9898\u65f6\u3002", "scene_en": "A security guard notifying residents about a fire alarm in the building.", "scene_cn": "\u4e00\u540d\u4fdd\u5b89\u4eba\u5458\u901a\u77e5\u5c45\u6c11\u5927\u697c\u5185\u7684\u706b\u8b66\u8b66\u62a5\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q7_alerted_1.png", "P6_vocabulary_exercises_9_Q7_alerted_2.png"], "examples": [{"en": "The dog barked loudly, alerted the family to the presence of an intruder outside.", "cn": "\u72d7\u5927\u58f0\u5420\u53eb\uff0c\u63d0\u9192\u5bb6\u4eba\u6ce8\u610f\u5916\u9762\u6709\u5165\u4fb5\u8005\u3002"}, {"en": "The news report alerted the public to the dangers of the approaching hurricane quickly.", "cn": "\u65b0\u95fb\u62a5\u9053\u8fc5\u901f\u63d0\u9192\u516c\u4f17\u6ce8\u610f\u5373\u5c06\u6765\u4e34\u7684\u98d3\u98ce\u7684\u5371\u9669\u3002"}]}, {"word": "accelerated", "ipa": "/\u0259k\u02c8sel\u0259re\u026at\u026ad/", "meanings": {"en": "Increased in speed or rate.", "cn": "\u901f\u5ea6\u6216\u901f\u7387\u589e\u52a0\u3002"}, "usage_en": "Used to describe something that has sped up or increased in pace.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5df2\u52a0\u901f\u6216\u52a0\u5feb\u901f\u5ea6\u7684\u4e8b\u7269\u3002", "scene_en": "A race car speeding down a track, leaving a blur of motion behind it.", "scene_cn": "\u4e00\u8f86\u8d5b\u8f66\u5728\u8d5b\u9053\u4e0a\u98de\u9a70\uff0c\u8eab\u540e\u7559\u4e0b\u4e00\u7247\u6a21\u7cca\u7684\u8fd0\u52a8\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q7_accelerated_1.png", "P6_vocabulary_exercises_9_Q7_accelerated_2.png"], "examples": [{"en": "The company accelerated its production schedule to meet the growing demand effectively.", "cn": "\u8be5\u516c\u53f8\u52a0\u5feb\u4e86\u751f\u4ea7\u8fdb\u5ea6\uff0c\u4ee5\u6709\u6548\u6ee1\u8db3\u4e0d\u65ad\u589e\u957f\u7684\u9700\u6c42\u3002"}, {"en": "The runner accelerated his pace in the final stretch of the race, winning easily.", "cn": "\u8d5b\u8dd1\u8005\u5728\u6bd4\u8d5b\u7684\u6700\u540e\u9636\u6bb5\u52a0\u5feb\u4e86\u6b65\u4f10\uff0c\u8f7b\u677e\u83b7\u80dc\u3002"}]}], "synonym_cn": "\u51f8\u663e\uff0c\u886c\u6258\uff0c\u5f3a\u8c03", "socratic_questions": [{"question": "If a speaker speeds up their speech, which word describes this change in pace?", "options": ["accented", "accentuated", "alerted", "accelerated"], "correct_answer": "accelerated", "explanation": "Accelerated means to increase in speed or rate, fitting the scenario of a speaker speeding up."}, {"question": "Which word describes drawing attention to a specific detail or feature?", "options": ["accented", "accentuated", "alerted", "accelerated"], "correct_answer": "accentuated", "explanation": "Accentuating means to make something more noticeable or prominent, highlighting a detail."}, {"question": "If a security system warns you of potential danger, which word best describes its action?", "options": ["accented", "accentuated", "alerted", "accelerated"], "correct_answer": "alerted", "explanation": "Alerted means to warn someone of a danger or problem, as a security system would do."}, {"question": "If someone speaks with a distinct regional sound, which word describes their speech?", "options": ["accented", "accentuated", "alerted", "accelerated"], "correct_answer": "accented", "explanation": "Accented means spoken with a particular way of pronouncing words, typically associated with a region."}]}, {"id": 8, "stem": "There is not a single ________ in this diamond.", "correct_index": 1, "options": [{"word": "mistake", "ipa": "m\u026a\u02c8ste\u026ak", "meanings": {"en": "An action or judgment that is misguided or wrong.", "cn": "\u4e00\u79cd\u9519\u8bef\u7684\u6216\u9519\u8bef\u7684\u884c\u52a8\u6216\u5224\u65ad\u3002"}, "usage_en": "Used to describe minor errors or slips.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5c0f\u9519\u8bef\u6216\u5931\u8bef\u3002", "scene_en": "A student accidentally writing the wrong answer on a test.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u5728\u8003\u8bd5\u4e2d\u4e0d\u5c0f\u5fc3\u5199\u9519\u4e86\u7b54\u6848\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q8_mistake_1.png", "P6_vocabulary_exercises_9_Q8_mistake_2.png"], "examples": [{"en": "I made a mistake in the calculation, but I quickly corrected it.", "cn": "\u6211\u5728\u8ba1\u7b97\u4e2d\u72af\u4e86\u4e00\u4e2a\u9519\u8bef\uff0c\u4f46\u6211\u5f88\u5feb\u5c31\u7ea0\u6b63\u4e86\u5b83\u3002"}, {"en": "It was a simple mistake to overlook the deadline for the application form.", "cn": "\u5ffd\u7565\u7533\u8bf7\u8868\u7684\u622a\u6b62\u65e5\u671f\u662f\u4e00\u4e2a\u7b80\u5355\u7684\u9519\u8bef\u3002"}]}, {"word": "flaw", "ipa": "fl\u0254\u02d0", "meanings": {"en": "A mark, blemish, or other imperfection that mars a substance or object.", "cn": "\u4e00\u79cd\u6c61\u70b9\u3001\u7455\u75b5\u6216\u5176\u4ed6\u4f7f\u7269\u8d28\u6216\u7269\u4f53\u53d7\u635f\u7684\u7f3a\u9677\u3002"}, "usage_en": "Used to describe imperfections that reduce the value or effectiveness of something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u964d\u4f4e\u4e8b\u7269\u4ef7\u503c\u6216\u6548\u7528\u7684\u7f3a\u9677\u3002", "scene_en": "A visible scratch on a brand new car's paint job.", "scene_cn": "\u4e00\u8f86\u5d2d\u65b0\u6c7d\u8f66\u7684\u6cb9\u6f06\u4e0a\u6709\u4e00\u9053\u53ef\u89c1\u7684\u5212\u75d5\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q8_flaw_1.png", "P6_vocabulary_exercises_9_Q8_flaw_2.png"], "examples": [{"en": "The only flaw in her argument was that she lacked sufficient supporting evidence.", "cn": "\u5979\u8bba\u70b9\u4e2d\u552f\u4e00\u7684\u7f3a\u9677\u662f\u5979\u7f3a\u4e4f\u8db3\u591f\u7684\u4f50\u8bc1\u3002"}, {"en": "Despite its flaws, the antique vase was still a valuable piece of art.", "cn": "\u5c3d\u7ba1\u5b58\u5728\u7f3a\u9677\uff0c\u8fd9\u4ef6\u53e4\u8463\u82b1\u74f6\u4ecd\u7136\u662f\u4e00\u4ef6\u6709\u4ef7\u503c\u7684\u827a\u672f\u54c1\u3002"}]}, {"word": "defect", "ipa": "\u02c8di\u02d0f\u025bkt", "meanings": {"en": "A shortcoming, imperfection, or lack.", "cn": "\u7f3a\u70b9\u3001\u4e0d\u5b8c\u5584\u6216\u7f3a\u4e4f\u3002"}, "usage_en": "Used to describe inherent faults or deficiencies, often in manufactured items or systems.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u56fa\u6709\u7684\u7f3a\u9677\u6216\u4e0d\u8db3\uff0c\u901a\u5e38\u5728\u5236\u9020\u7684\u7269\u54c1\u6216\u7cfb\u7edf\u4e2d\u3002", "scene_en": "A newly built bridge with structural weaknesses.", "scene_cn": "\u4e00\u5ea7\u65b0\u5efa\u7684\u6865\u6881\u5b58\u5728\u7ed3\u6784\u6027\u7f3a\u9677\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q8_defect_1.png", "P6_vocabulary_exercises_9_Q8_defect_2.png"], "examples": [{"en": "The car was recalled due to a manufacturing defect in the braking system.", "cn": "\u7531\u4e8e\u5236\u52a8\u7cfb\u7edf\u5b58\u5728\u5236\u9020\u7f3a\u9677\uff0c\u8be5\u6c7d\u8f66\u88ab\u53ec\u56de\u3002"}, {"en": "A birth defect can sometimes be corrected with surgery shortly after the baby's birth.", "cn": "\u5148\u5929\u7f3a\u9677\u6709\u65f6\u53ef\u4ee5\u5728\u5a74\u513f\u51fa\u751f\u540e\u4e0d\u4e45\u901a\u8fc7\u624b\u672f\u8fdb\u884c\u7ea0\u6b63\u3002"}]}, {"word": "problem", "ipa": "\u02c8pr\u0252bl\u0259m", "meanings": {"en": "A matter or situation regarded as unwelcome or harmful and needing to be dealt with and overcome.", "cn": "\u88ab\u8ba4\u4e3a\u662f\u4e0d\u53d7\u6b22\u8fce\u6216\u6709\u5bb3\u7684\uff0c\u9700\u8981\u5904\u7406\u548c\u514b\u670d\u7684\u4e8b\u60c5\u6216\u60c5\u51b5\u3002"}, "usage_en": "A broad term for any difficulty or challenge.", "usage_cn": "\u4efb\u4f55\u56f0\u96be\u6216\u6311\u6218\u7684\u5e7f\u4e49\u672f\u8bed\u3002", "scene_en": "A car stuck in heavy traffic during rush hour.", "scene_cn": "\u4e00\u8f86\u6c7d\u8f66\u5728\u9ad8\u5cf0\u65f6\u6bb5\u5835\u5728\u62e5\u6324\u7684\u4ea4\u901a\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q8_problem_1.png", "P6_vocabulary_exercises_9_Q8_problem_2.png"], "examples": [{"en": "The biggest problem we face is the lack of funding for the project.", "cn": "\u6211\u4eec\u9762\u4e34\u7684\u6700\u5927\u95ee\u9898\u662f\u9879\u76ee\u7f3a\u4e4f\u8d44\u91d1\u3002"}, {"en": "I'm having a problem with my computer; it keeps freezing unexpectedly all the time.", "cn": "\u6211\u7684\u7535\u8111\u6709\u95ee\u9898\uff1b\u5b83\u603b\u662f\u610f\u5916\u5730\u6b7b\u673a\u3002"}]}], "synonym_cn": "\u7455\u75b5\uff0c\u7f3a\u70b9\uff0c\u9519\u8bef\uff0c\u95ee\u9898", "socratic_questions": [{"question": "In a legal document, what do you call a significant error that could change its validity?", "options": ["mistake", "flaw", "defect", "problem"], "correct_answer": "flaw", "explanation": "A 'flaw' in a legal document represents a critical error affecting its integrity."}, {"question": "If a newly manufactured car has a faulty engine right from the start, what is this issue called?", "options": ["mistake", "flaw", "defect", "problem"], "correct_answer": "defect", "explanation": "A 'defect' refers to an inherent fault or imperfection in the car's engine."}, {"question": "What do you call a simple miscalculation in your taxes that can be easily corrected?", "options": ["mistake", "flaw", "defect", "problem"], "correct_answer": "mistake", "explanation": "A 'mistake' is a simple error, like a miscalculation, easily rectified."}, {"question": "If your computer suddenly stops working, what general term describes this unexpected malfunction?", "options": ["mistake", "flaw", "defect", "problem"], "correct_answer": "problem", "explanation": "A 'problem' is a general term for any issue causing the computer to malfunction."}]}, {"id": 9, "stem": "Sarah's speech was interesting. It made a/an ________ on the audience.", "correct_index": 2, "options": [{"word": "result", "ipa": "/r\u026a\u02c8z\u028clt/", "meanings": {"en": "A thing that is caused or produced by something else; a consequence or outcome.", "cn": "\u7531\u5176\u4ed6\u4e8b\u7269\u5f15\u8d77\u6216\u4ea7\u751f\u7684\u4e8b\u7269\uff1b\u7ed3\u679c\u6216\u540e\u679c\u3002"}, "usage_en": "Often used to describe the outcome of an action or process.", "usage_cn": "\u901a\u5e38\u7528\u4e8e\u63cf\u8ff0\u884c\u52a8\u6216\u8fc7\u7a0b\u7684\u7ed3\u679c\u3002", "scene_en": "A scientist observing data from an experiment, analyzing the results.", "scene_cn": "\u4e00\u4f4d\u79d1\u5b66\u5bb6\u89c2\u5bdf\u5b9e\u9a8c\u6570\u636e\uff0c\u5206\u6790\u7ed3\u679c\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q9_result_1.png", "P6_vocabulary_exercises_9_Q9_result_2.png"], "examples": [{"en": "The result of the election was a surprise to many political analysts.", "cn": "\u9009\u4e3e\u7ed3\u679c\u8ba9\u8bb8\u591a\u653f\u6cbb\u5206\u6790\u5bb6\u611f\u5230\u60ca\u8bb6\u3002"}, {"en": "Hard work and dedication often result in success and personal fulfillment.", "cn": "\u52aa\u529b\u5de5\u4f5c\u548c\u5949\u732e\u7cbe\u795e\u901a\u5e38\u4f1a\u5e26\u6765\u6210\u529f\u548c\u4e2a\u4eba\u6210\u5c31\u611f\u3002"}]}, {"word": "sign", "ipa": "/sa\u026an/", "meanings": {"en": "An object, quality, or event whose presence or occurrence indicates the probable presence or occurrence of something else.", "cn": "\u4e00\u79cd\u7269\u4f53\u3001\u8d28\u91cf\u6216\u4e8b\u4ef6\uff0c\u5176\u5b58\u5728\u6216\u53d1\u751f\u8868\u660e\u53ef\u80fd\u5b58\u5728\u6216\u53d1\u751f\u5176\u4ed6\u4e8b\u7269\u3002"}, "usage_en": "Used to indicate something else is likely present or going to happen.", "usage_cn": "\u7528\u4e8e\u8868\u660e\u5176\u4ed6\u4e8b\u7269\u53ef\u80fd\u5b58\u5728\u6216\u5c06\u4f1a\u53d1\u751f\u3002", "scene_en": "A road sign indicating a sharp turn ahead, warning drivers.", "scene_cn": "\u4e00\u4e2a\u8def\u6807\u6307\u793a\u524d\u65b9\u6025\u8f6c\u5f2f\uff0c\u8b66\u544a\u53f8\u673a\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q9_sign_1.png", "P6_vocabulary_exercises_9_Q9_sign_2.png"], "examples": [{"en": "A fever can be a sign of infection, so it's important to see a doctor.", "cn": "\u53d1\u70e7\u53ef\u80fd\u662f\u611f\u67d3\u7684\u8ff9\u8c61\uff0c\u6240\u4ee5\u53bb\u770b\u533b\u751f\u5f88\u91cd\u8981\u3002"}, {"en": "The early bloom of flowers is a sign that spring is just around the corner.", "cn": "\u9c9c\u82b1\u7684\u65e9\u5f00\u662f\u6625\u5929\u5373\u5c06\u6765\u4e34\u7684\u8ff9\u8c61\u3002"}]}, {"word": "impact", "ipa": "/\u02c8\u026amp\u00e6kt/", "meanings": {"en": "The action of one object coming forcibly into contact with another.", "cn": "\u4e00\u4e2a\u7269\u4f53\u4e0e\u53e6\u4e00\u4e2a\u7269\u4f53\u5f3a\u70c8\u63a5\u89e6\u7684\u52a8\u4f5c\u3002"}, "usage_en": "Describes a significant or forceful effect or influence.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u663e\u8457\u6216\u6709\u529b\u7684\u5f71\u54cd\u6216\u4f5c\u7528\u3002", "scene_en": "A meteor impacting the earth, causing widespread destruction and change.", "scene_cn": "\u4e00\u9897\u6d41\u661f\u649e\u51fb\u5730\u7403\uff0c\u9020\u6210\u5e7f\u6cdb\u7684\u7834\u574f\u548c\u53d8\u5316\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q9_impact_1.png", "P6_vocabulary_exercises_9_Q9_impact_2.png"], "examples": [{"en": "The new regulations will have a significant impact on small businesses in the area.", "cn": "\u65b0\u6cd5\u89c4\u5c06\u5bf9\u8be5\u5730\u533a\u7684\u5c0f\u4f01\u4e1a\u4ea7\u751f\u91cd\u5927\u5f71\u54cd\u3002"}, {"en": "The speaker's powerful words had a lasting impact on everyone in the audience.", "cn": "\u6f14\u8bb2\u8005\u5145\u6ee1\u529b\u91cf\u7684\u8bdd\u8bed\u5bf9\u5728\u573a\u7684\u6bcf\u4e2a\u4eba\u90fd\u4ea7\u751f\u4e86\u6301\u4e45\u7684\u5f71\u54cd\u3002"}]}, {"word": "effect", "ipa": "/\u026a\u02c8f\u025bkt/", "meanings": {"en": "A change that is a result or consequence of an action or other cause.", "cn": "\u7531\u4e8e\u884c\u52a8\u6216\u5176\u4ed6\u539f\u56e0\u800c\u4ea7\u751f\u7684\u53d8\u5316\u6216\u7ed3\u679c\u3002"}, "usage_en": "Often used to describe the consequence or result of something.", "usage_cn": "\u901a\u5e38\u7528\u4e8e\u63cf\u8ff0\u67d0\u4e8b\u7684\u540e\u679c\u6216\u7ed3\u679c\u3002", "scene_en": "A butterfly flapping its wings, theoretically causing a hurricane far away.", "scene_cn": "\u4e00\u53ea\u8774\u8776\u6247\u52a8\u7fc5\u8180\uff0c\u7406\u8bba\u4e0a\u5728\u9065\u8fdc\u7684\u5730\u65b9\u5f15\u8d77\u98d3\u98ce\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q9_effect_1.png", "P6_vocabulary_exercises_9_Q9_effect_2.png"], "examples": [{"en": "The medicine had a positive effect on her health, reducing her pain significantly.", "cn": "\u8fd9\u79cd\u836f\u5bf9\u5979\u7684\u5065\u5eb7\u6709\u79ef\u6781\u7684\u5f71\u54cd\uff0c\u5927\u5927\u51cf\u8f7b\u4e86\u5979\u7684\u75db\u82e6\u3002"}, {"en": "The effect of climate change is evident in rising sea levels and extreme weather.", "cn": "\u6c14\u5019\u53d8\u5316\u7684\u5f71\u54cd\u5728\u6d77\u5e73\u9762\u4e0a\u5347\u548c\u6781\u7aef\u5929\u6c14\u4e2d\u663e\u800c\u6613\u89c1\u3002"}]}], "synonym_cn": "\u5f71\u54cd; \u7ed3\u679c; \u8c61\u5f81; \u6548\u679c", "socratic_questions": [{"question": "If a carefully planned project yields a positive and tangible outcome, is that a 'result', 'sign', 'impact', or 'effect'?", "options": ["result", "sign", "impact", "effect"], "correct_answer": "result", "explanation": "A 'result' is a tangible outcome or consequence of an action or process."}, {"question": "When dark clouds gather, suggesting rain, is that a 'result', 'sign', 'impact', or 'effect'?", "options": ["result", "sign", "impact", "effect"], "correct_answer": "sign", "explanation": "A 'sign' indicates the presence or likelihood of something else."}, {"question": "If a new policy drastically changes the way a company operates, is that a 'result', 'sign', 'impact', or 'effect'?", "options": ["result", "sign", "impact", "effect"], "correct_answer": "impact", "explanation": "An 'impact' is a significant or major influence or effect."}, {"question": "If taking medicine alleviates a headache, is that a 'result', 'sign', 'impact', or 'effect'?", "options": ["result", "sign", "impact", "effect"], "correct_answer": "effect", "explanation": "An 'effect' is a change that is a result or consequence of an action."}]}, {"id": 10, "stem": "Have you had any ________ of Jan recently?", "correct_index": 1, "options": [{"word": "information", "ipa": "\u02cc\u026anf\u0259r\u02c8me\u026a\u0283n", "meanings": {"en": "Facts provided or learned about something or someone.", "cn": "\u63d0\u4f9b\u7684\u6216\u5b66\u5230\u7684\u5173\u4e8e\u67d0\u4e8b\u6216\u67d0\u4eba\u7684\u4e8b\u5b9e\u3002"}, "usage_en": "Used to describe general knowledge or facts.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u822c\u7684\u77e5\u8bc6\u6216\u4e8b\u5b9e\u3002", "scene_en": "A library with books and computers, people researching.", "scene_cn": "\u4e00\u4e2a\u6709\u4e66\u7c4d\u548c\u7535\u8111\u7684\u56fe\u4e66\u9986\uff0c\u4eba\u4eec\u5728\u505a\u7814\u7a76\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q10_information_1.png", "P6_vocabulary_exercises_9_Q10_information_2.png"], "examples": [{"en": "The internet provides a vast amount of information on almost any topic imaginable.", "cn": "\u4e92\u8054\u7f51\u63d0\u4f9b\u4e86\u5173\u4e8e\u51e0\u4e4e\u4efb\u4f55\u53ef\u4ee5\u60f3\u8c61\u7684\u4e3b\u9898\u7684\u5927\u91cf\u4fe1\u606f\u3002"}, {"en": "We need more information before we can make a well-informed decision about this project.", "cn": "\u5728\u5bf9\u8fd9\u4e2a\u9879\u76ee\u505a\u51fa\u660e\u667a\u7684\u51b3\u5b9a\u4e4b\u524d\uff0c\u6211\u4eec\u9700\u8981\u66f4\u591a\u7684\u4fe1\u606f\u3002"}]}, {"word": "news", "ipa": "nu\u02d0z", "meanings": {"en": "Newly received or noteworthy information, especially about recent events.", "cn": "\u65b0\u6536\u5230\u7684\u6216\u503c\u5f97\u6ce8\u610f\u7684\u4fe1\u606f\uff0c\u7279\u522b\u662f\u5173\u4e8e\u6700\u8fd1\u53d1\u751f\u7684\u4e8b\u4ef6\u3002"}, "usage_en": "Refers to current events and happenings.", "usage_cn": "\u6307\u5f53\u524d\u53d1\u751f\u7684\u4e8b\u4ef6\u548c\u65b0\u95fb\u3002", "scene_en": "A television broadcasting the news, a newspaper stand.", "scene_cn": "\u4e00\u53f0\u64ad\u653e\u65b0\u95fb\u7684\u7535\u89c6\uff0c\u4e00\u4e2a\u62a5\u644a\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q10_news_1.png", "P6_vocabulary_exercises_9_Q10_news_2.png"], "examples": [{"en": "I heard the news about the company's merger on the radio this morning.", "cn": "\u4eca\u5929\u65e9\u4e0a\u6211\u5728\u6536\u97f3\u673a\u91cc\u542c\u5230\u4e86\u5173\u4e8e\u516c\u53f8\u5408\u5e76\u7684\u6d88\u606f\u3002"}, {"en": "The evening news reported on the latest developments in the ongoing political debate.", "cn": "\u665a\u95f4\u65b0\u95fb\u62a5\u9053\u4e86\u6b63\u5728\u8fdb\u884c\u7684\u653f\u6cbb\u8fa9\u8bba\u7684\u6700\u65b0\u8fdb\u5c55\u3002"}]}, {"word": "particulars", "ipa": "p\u0259r\u02c8t\u026akj\u028al\u0259rz", "meanings": {"en": "The details of something; items of information.", "cn": "\u67d0\u4e8b\u7684\u7ec6\u8282\uff1b\u4fe1\u606f\u9879\u76ee\u3002"}, "usage_en": "Used when needing specific details or information.", "usage_cn": "\u5f53\u9700\u8981\u5177\u4f53\u7684\u7ec6\u8282\u6216\u4fe1\u606f\u65f6\u4f7f\u7528\u3002", "scene_en": "Filling out a form, examining a contract closely.", "scene_cn": "\u586b\u5199\u8868\u683c\uff0c\u4ed4\u7ec6\u68c0\u67e5\u5408\u540c\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q10_particulars_1.png", "P6_vocabulary_exercises_9_Q10_particulars_2.png"], "examples": [{"en": "Please provide the particulars of your flight reservation, including the flight number and time.", "cn": "\u8bf7\u63d0\u4f9b\u60a8\u7684\u822a\u73ed\u9884\u8ba2\u7684\u8be6\u7ec6\u4fe1\u606f\uff0c\u5305\u62ec\u822a\u73ed\u53f7\u548c\u65f6\u95f4\u3002"}, {"en": "The police asked for the particulars of the suspect's appearance and any identifying marks.", "cn": "\u8b66\u65b9\u8be2\u95ee\u4e86\u5acc\u7591\u4eba\u5916\u8c8c\u7684\u7ec6\u8282\u548c\u4efb\u4f55\u8bc6\u522b\u6807\u8bb0\u3002"}]}, {"word": "details", "ipa": "\u02c8di\u02d0te\u026alz", "meanings": {"en": "Individual features, facts, or items.", "cn": "\u4e2a\u522b\u7279\u5f81\u3001\u4e8b\u5b9e\u6216\u9879\u76ee\u3002"}, "usage_en": "Refers to specific and individual pieces of information.", "usage_cn": "\u6307\u5177\u4f53\u548c\u4e2a\u522b\u7684\u4fe1\u606f\u3002", "scene_en": "A detective investigating a crime scene, an artist working on a painting.", "scene_cn": "\u4fa6\u63a2\u8c03\u67e5\u72af\u7f6a\u73b0\u573a\uff0c\u827a\u672f\u5bb6\u521b\u4f5c\u7ed8\u753b\u3002", "image_paths": ["P6_vocabulary_exercises_9_Q10_details_1.png", "P6_vocabulary_exercises_9_Q10_details_2.png"], "examples": [{"en": "The architect paid close attention to the details when designing the new building's facade.", "cn": "\u5efa\u7b51\u5e08\u5728\u8bbe\u8ba1\u65b0\u5efa\u7b51\u7684\u6b63\u9762\u65f6\u5bc6\u5207\u5173\u6ce8\u7ec6\u8282\u3002"}, {"en": "She remembered all the important details of their first date, even after many years.", "cn": "\u5373\u4f7f\u8fc7\u4e86\u5f88\u591a\u5e74\uff0c\u5979\u4ecd\u7136\u8bb0\u5f97\u4ed6\u4eec\u7b2c\u4e00\u6b21\u7ea6\u4f1a\u7684\u6240\u6709\u91cd\u8981\u7ec6\u8282\u3002"}]}], "synonym_cn": "\u6d88\u606f\uff0c\u4fe1\u606f\uff0c\u8be6\u60c5\uff0c\u8d44\u6599", "socratic_questions": [{"question": "If you're gathering facts for a report, are you seeking general ________ or specific details?", "options": ["information", "news", "particulars", "details"], "correct_answer": "information", "explanation": "Information refers to general facts or knowledge."}, {"question": "If you're eager to know what's happening locally and globally, are you looking for ________ or deep analysis?", "options": ["information", "news", "particulars", "details"], "correct_answer": "news", "explanation": "News refers to recent events or happenings."}, {"question": "When planning a surprise party, do you need to know the ________ of the guest's schedule?", "options": ["information", "news", "particulars", "details"], "correct_answer": "particulars", "explanation": "Particulars refer to specific or individual details."}, {"question": "When investigating a crime, do detectives look for general ________ or specific ________ to solve the case?", "options": ["information", "news", "particulars", "details"], "correct_answer": "details", "explanation": "Details refer to individual features, facts, or items."}]}]};
