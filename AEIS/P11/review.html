rvices.", "cn": "\u653f\u5e9c\u6539\u9769\u4e86\u533b\u7597\u4fdd\u5065\u7cfb\u7edf\uff0c\u4ee5\u63d0\u4f9b\u66f4\u597d\u7684\u533b\u7597\u670d\u52a1\u3002"}, {"en": "After years of bad habits, he reformed his lifestyle by exercising and eating healthier foods.", "cn": "\u5728\u591a\u5e74\u4e0d\u826f\u4e60\u60ef\u4e4b\u540e\uff0c\u4ed6\u901a\u8fc7\u953b\u70bc\u548c\u98df\u7528\u66f4\u5065\u5eb7\u7684\u98df\u7269\u6765\u6539\u5584\u81ea\u5df1\u7684\u751f\u6d3b\u65b9\u5f0f\u3002"}]}, {"word": "retired", "ipa": "/r\u026a\u02c8ta\u026a\u0259rd/", "meanings": {"en": "Withdrew from one's position or occupation, especially upon reaching a certain age.", "cn": "\u9000\u51fa\u67d0\u4eba\u7684\u804c\u4f4d\u6216\u804c\u4e1a\uff0c\u5c24\u5176\u662f\u5728\u8fbe\u5230\u4e00\u5b9a\u5e74\u9f84\u65f6\u3002"}, "usage_en": "Describes the act of leaving employment, typically in older age.", "usage_cn": "\u63cf\u8ff0\u79bb\u5f00\u5de5\u4f5c\u5c97\u4f4d\u7684\u884c\u4e3a\uff0c\u901a\u5e38\u5728\u8001\u5e74\u65f6\u3002", "scene_en": "An elderly man celebrating his retirement with family and friends at a party.", "scene_cn": "\u4e00\u4f4d\u8001\u4eba\u5728\u805a\u4f1a\u4e0a\u4e0e\u5bb6\u4eba\u548c\u670b\u53cb\u5e86\u795d\u4ed6\u7684\u9000\u4f11\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q1_retired_1.png", "P6_vocabulary_exercises_11_Q1_retired_2.png"], "examples": [{"en": "She retired from her teaching career after 35 years of dedicated service to her students.", "cn": "\u5979\u5728\u4e3a\u5b66\u751f\u5949\u732e\u4e8635\u5e74\u540e\uff0c\u4ece\u5979\u7684\u6559\u5b66\u751f\u6daf\u4e2d\u9000\u4f11\u3002"}, {"en": "After a long and successful career, he retired to a quiet life in the countryside.", "cn": "\u5728\u6f2b\u957f\u800c\u6210\u529f\u7684\u804c\u4e1a\u751f\u6daf\u4e4b\u540e\uff0c\u4ed6\u9000\u4f11\u5230\u4e61\u6751\u8fc7\u7740\u5e73\u9759\u7684\u751f\u6d3b\u3002"}]}], "synonym_cn": "\u9690\u9000, \u89e3\u96c7, \u6539\u9769, \u9000\u4f11 (y\u01d0n tu\u00ec, ji\u011b g\u00f9, ers_2.png"], "examples": [{"en": "The security guard warned the trespassers to leave the construction site immediately or face legal consequences.", "cn": "\u4fdd\u5b89\u8b66\u544a\u5165\u4fb5\u8005\u7acb\u5373\u79bb\u5f00\u5efa\u7b51\u5de5\u5730\uff0c\u5426\u5219\u5c06\u9762\u4e34\u6cd5\u5f8b\u540e\u679c\u3002"}, {"en": "The farmer put up signs to deter trespassers from entering his fields and damaging his crops.", "cn": "\u519c\u6c11\u7ad6\u8d77\u6807\u5fd7\uff0c\u4ee5\u963b\u6b62\u5165\u4fb5\u8005\u8fdb\u5165\u4ed6\u7684\u7530\u5730\u5e76\u7834\u574f\u4ed6\u7684\u5e84\u7a3c\u3002"}]}, {"word": "translators", "ipa": "\u02c8tr\u00e6nzle\u026at\u0259rz", "meanings": {"en": "People who convert text or speech from one language into another.", "cn": "\u5c06\u6587\u672c\u6216\u8bed\u97f3\u4ece\u4e00\u79cd\u8bed\u8a00\u8f6c\u6362\u4e3a\u53e6\u4e00\u79cd\u8bed\u8a00\u7684\u4eba\u3002"}, "usage_en": "Essential in international communication, literature, and business.", "usage_cn": "\u5728\u56fd\u9645\u4ea4\u6d41\u3001\u6587\u5b66\u548c\u5546\u4e1a\u4e2d\u81f3\u5173\u91cd\u8981\u3002", "scene_en": "A person sitting at a desk with multiple language dictionaries and a computer.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u5b50\u65c1\uff0c\u684c\u4e0a\u6709\u591a\u79cd\u8bed\u8a00\u8bcd\u5178\u548c\u4e00\u53f0\u7535\u8111\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q2_translators_1.png", "P6_vocabulary_exercises_11_Q2_translators_2.png"], "examples": [{"en": "The translators worked tirelessly to ensure the accurate translation of the complex legal documents.", "cn": "\u7ffb\u8bd1\u4eba\u5458\u4e0d\u61c8\u52aa\u529b\uff0c\u4ee5\u786e\u4fdd\u590d\u6742\u6cd5\u5f8b\u6587\u4ef6\u7684\u51c6\u786e\u7ffb\u8bd1\u3002"}, {"en": "Good translators must possess not only linguistic skills but also cultural understanding and subject matter expertise.", "cn": "\u4f18\u79c0\u7684\u7ffb\u8bd1\u4eba\u5458\u4e0d\u4ec5\u5fc5\u987b\u5177\u5907\u8bed\u8a00\u6280\u80fd\uff0c\u8fd8\u5 eachery"], "correct_answer": "treachery", "explanation": "Treachery involves betrayal or deceitful actions."}, {"question": "Which word describes people who convert text from one language to another?", "options": ["transfers", "trespassers", "translators", "treachery"], "correct_answer": "translators", "explanation": "Translators are skilled in converting languages."}, {"question": "Which word describes the act of moving something from one place to another?", "options": ["transfers", "trespassers", "translators", "treachery"], "correct_answer": "transfers", "explanation": "Transfers involve moving items or rights."}]}, {"id": 3, "stem": "The brave captain of the ship ______ the ship to safety despite the raging storm.", "correct_index": 0, "options": [{"word": "steered", "ipa": "/st\u026a\u0259rd/", "meanings": {"en": "To control the direction of a vehicle.", "cn": "\u63a7\u5236\u8f66\u8f86\u7684\u65b9\u5411\u3002"}, "usage_en": "Used to describe the act of guiding a vehicle.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f15\u5bfc\u8f66\u8f86\u7684\u884c\u4e3a\u3002", "scene_en": "A captain on the bridge of a ship, turning the wheel.", "scene_cn": "\u8239\u957f\u5728\u8239\u6865\u4e0a\uff0c\u8f6c\u52a8\u65b9\u5411\u76d8\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q3_steered_1.png", "P6_vocabulary_exercises_11_Q3_steered_2.png"], "examples": [{"en": "The experienced sailor steered the boat skillfully through the narrow channel, avoiding obstacles.", "cn": "\u7ecf\u9a8c\u4e30\u5bcc\u7684\u6d77\u5458\u719f\u7ec3\u5730\u9a7e\u9a76\u8239\u53ea\u7a7f\u8fc7\u72ed\u7a84\u7684\u822a\u9053\uff0c\u907f\u5f00\u4e86\u969c\u788d\u7269\u3002"}, {"en": "She steered her career towards marketing after gaining experience in sales and customer service.", "cn": "\u5728\u83b7\u5f97\u9500\u552e\u548c\u5ba2\u6237\u670d\u52a1\u7ecf\u9a8c\u540e\uff0c\u5979\u5c06\u81ea\u5df1\u7684\u804c\u4e1a\u751f\u6daf\u5bfc\u5411\u4e86\u5e02\u573a\u8425\u9500\u3002"}]}, {"word": "veered", "ipa": "/v\u0 n": "Used to seek information or test understanding.", "usage_cn": "\u7528\u4e8e\u5bfb\u6c42\u4fe1\u606f\u6216\u6d4b\u8bd5\u7406\u89e3\u3002", "scene_en": "A student raising their hand to ask a question in class.", "scene_cn": "\u4e00\u4e2a\u5b66\u751f\u4e3e\u624b\u5728\u8bfe\u5802\u4e0a\u63d0\u95ee\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q6_questions_1.png", "P6_vocabulary_exercises_11_Q6_questions_2.png"], "examples": [{"en": "The interviewer asked several challenging questions to assess the candidate's skills.", "cn": "\u9762\u8bd5\u5b98\u95ee\u4e86\u51e0\u4e2a\u5177\u6709\u6311\u6218\u6027\u7684\u95ee\u9898\u6765\u8bc4\u4f30\u5019\u9009\u4eba\u7684\u6280\u80fd\u3002"}, {"en": "If you have any questions about the assignment, please feel free to ask me.", "cn": "\u5982\u679c\u60a8\u5bf9\u4f5c\u4e1a\u6709\u4efb\u4f55\u7591\u95ee\uff0c\u8bf7\u968f\u65f6\u95ee\u6211\u3002"}]}, {"word": "riddles", "ipa": "/\u02c8r\u026ad\u0259lz/", "meanings": {"en": "Puzzling questions or statements designed to be solved or guessed.", "cn": "\u65e8\u5728\u88ab\u89e3\u51b3\u6216\u731c\u6d4b\u7684\u4ee4\u4eba\u56f0\u60d1\u7684\u95ee\u9898\u6216\u9648\u8ff0\u3002"}, "usage_en": "Used for entertainment and mental stimulation.", "usage_cn": "\u7528\u4e8e\u5a31\u4e50\u548c\u667a\u529b\u523a\u6fc0\u3002", "scene_en": "Children sitting in a circle trying to solve a riddle.", "scene_cn": "\u5b69\u5b50\u4eec\u56f4\u6210\u4e00\u5708\u8bd5\u56fe\u89e3\u51b3\u4e00\u4e2a\u8c1c\u8bed\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q6_riddles_1.png", "P6_vocabulary_exercises_11_Q6_riddles_2.png"], "examples": [{"en": "The children enjoyed solving riddles during their playtime, laughing at the clever answers.", "cn": "\u5b69\u5b50\u4eec\u5728\u73a9\u800d\u65f6\u559c\u6b22\u89e3\u51b3\u8c1c\u8bed\uff0c\u5e76\u4e3a\u806a\u660e\u7684\u7b54\u6848\u800c\u7b11\u3002"}, {"en": "Ancient cultures often used riddles to test the wisdom and intelligence of individuals.", "cn": "\u53e4\u4ee3\u6587 2a\u4eba\u8eba\u5728\u533b\u9662\u7684\u75c5\u5e8a\u4e0a\uff0c\u8138\u8272\u660e\u663e\u82cd\u767d\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q7_pale_1.png", "P6_vocabulary_exercises_11_Q7_pale_2.png"], "examples": [{"en": "She looked pale and unwell after staying up all night studying for exams.", "cn": "\u5979\u71ac\u591c\u590d\u4e60\u8003\u8bd5\u540e\u8138\u8272\u82cd\u767d\uff0c\u770b\u8d77\u6765\u5f88\u4e0d\u8212\u670d\u3002"}, {"en": "The sudden shock made his face turn pale, and he struggled to speak clearly.", "cn": "\u7a81\u5982\u5176\u6765\u7684\u9707\u60ca\u4f7f\u4ed6\u7684\u8138\u8272\u53d8\u5f97\u82cd\u767d\uff0c\u4ed6\u52aa\u529b\u6e05\u6670\u5730\u8bf4\u51fa\u6765\u3002"}]}, {"word": "white", "ipa": "/wa\u026at/", "meanings": {"en": "Having a color like that of milk or fresh snow.", "cn": "\u5177\u6709\u50cf\u725b\u5976\u6216\u65b0\u96ea\u4e00\u6837\u7684\u989c\u8272\u3002"}, "usage_en": "Used to describe objects or things that are of a white color.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u767d\u8272\u7269\u4f53\u6216\u4e8b\u7269\u3002", "scene_en": "A field covered in fresh, white snow on a sunny winter day.", "scene_cn": "\u9633\u5149\u660e\u5a9a\u7684\u51ac\u65e5\u91cc\uff0c\u7530\u91ce\u8986\u76d6\u7740\u65b0\u9c9c\u7684\u767d\u96ea\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q7_white_1.png", "P6_vocabulary_exercises_11_Q7_white_2.png"], "examples": [{"en": "The bride wore a beautiful white dress as she walked down the aisle gracefully.", "cn": "\u65b0\u5a18\u7a7f\u7740\u4e00\u4ef6\u7f8e\u4e3d\u7684\u767d\u8272\u8fde\u8863\u88d9\uff0c\u4f18\u96c5\u5730\u8d70\u8fc7\u901a\u9053\u3002"}, {"en": "He painted the walls white to make the small room appear larger and brighter.", "cn": "\u4ed6\u628a\u5899\u58c1\u6d82\u6210\u767d\u8272\uff0c\u4f7f\u5c0f\u623f\u95f4\u770b\u8d77\u6765\u66f4\u5927\u66f4\u660e\u4eae\u3002"}]}, {"word": "faded", "ipa": "/\u02c8fe\u026ad\u026ad/", "meanings": {"en": "Having lost freshness or intensity of color or flavor.", "cn": "\u5931\u53bb\u4e86\u989c\u8272\u6216\u5473\u9053\u7684\u65b0\u9c9c\u5ea6\u6216\u5f3a\u5ea6\u3002"}, "usage_en": "Used to describe something that has lost its original color or vibrancy.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5931\u53bb\u539f\u6709\u989c\u8272\u6216\u6d3b\u529b\u7684\u4e8b\u7269\u3002", "scene_en": "An old photograph with faded colors lying on a dusty table.", "scene_cn": "\u4e00\u5f20\u65e7\u7167\u7247\uff0c\u989c\u8272\u892a\u8272\uff0c\u653e\u5728\u4e00\u5f20\u5e03\u6ee1\u7070\u5c18\u7684\u684c\u5b50\u4e0a\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q7_faded_1.png", "P6_vocabulary_exercises_11_Q7_faded_2.png"], "examples": [{"en": "The old curtains had faded over the years from exposure to direct sunlight daily.", "cn": "\u591a\u5e74\u6765\uff0c\u65e7\u7a97\u5e18\u56e0\u6bcf\u5929\u66b4\u9732\u5728\u9633\u5149\u76f4\u5c04\u4e0b\u800c\u892a\u8272\u3002"}, {"en": "The memories of that summer vacation had faded, but the joy remained vivid still.", "cn": "\u90a3\u4e2a\u6691\u5047\u7684\u8bb0\u5fc6\u5df2\u7ecf\u892a\u8272\uff0c\u4f46\u5feb\u4e50\u4ecd\u7136\u5386\u5386\u5728\u76ee\u3002"}]}, {"word": "light", "ipa": "/la\u026at/", "meanings": {"en": "Of a pale color; not dark.", "cn": "\u989c\u8272\u6d45\u6de1\uff1b\u4e0d\u6df1\u3002"}, "usage_en": "Used to describe colors that are not dark or intense.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e0d\u6df1\u6216\u4e0d\u5f3a\u70c8\u7684\u989c\u8272\u3002", "scene_en": "A room painted in light pastel colors with sunlight streaming through the window.", "scene_cn": "\u4e00\u4e2a\u623f\u95f4\u6d82\u4e0a\u4e86\u6d45\u8272\u7684\u7c89\u5f69\u8272\uff0c\u9633\u5149\u900f\u8fc7\u7a97\u6237\u7167\u5c04\u8fdb\u6765\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q7_light_1.png", "P6_vocabulary_exercises_11_Q7_light_2.png"], "examples": [{"en": "She chose a light blue for the walls to create a calming atmosphere in her bedroom.", "cn": "\u5979\u9009\u62e9\u4e86\u6d45\u84dd\u8272\u4f5c\u4e3a\u5899\u58c1\u7684\u989c\u8272\uff0c\u4ee5\u5728\u5367\u5ba4\u91cc\u8425\u9020\u4e00\u79cd\u5e73\u9759\u7684\u6c1b\u56f4\u3002"}, {"en": "The light breeze rustled through the leaves, creating a soothing and peaceful sound.", "cn": "\u5fae\u98ce\u5439\u8fc7\u6811\u53f6\uff0c\u53d1\u51fa\u8212\u7f13\u800c\u5e73\u9759\u7684\u58f0\u97f3\u3002"}]}], "synonym_cn": "\u82cd\u767d vs. \u767d\u8272 vs. \u892a\u8272 vs. \u6d45\u8272", "socratic_questions": [{"question": "After running a marathon, which word describes someone's face due to exhaustion?", "options": ["pale", "white", "faded", "light"], "correct_answer": "pale", "explanation": "Pale suggests a loss of color due to physical exertion."}, {"question": "Which word describes the color of a wedding dress?", "options": ["pale", "white", "faded", "light"], "correct_answer": "white", "explanation": "White is the traditional color for wedding dresses."}, {"question": "After years in the sun, which word describes the color of an old photograph?", "options": ["pale", "white", "faded", "light"], "correct_answer": "faded", "explanation": "Faded describes something that has lost its color intensity over time."}, {"question": "Which word describes the color of a pastel-colored shirt?", "options": ["pale", "white", "faded", "light"], "correct_answer": "light", "explanation": "Light describes a color that is not dark or intense."}]}, {"id": 8, "stem": "I am willing to ______ you $100 that our team will win the match.", "correct_index": 2, "options": [{"word": "risk", "ipa": "/r\u026ask/", "meanings": {"en": "Expose (someone or something valued) to danger, harm, or loss.", "cn": "\u5c06\uff08\u67d0\u4eba\u6216\u67d0\u7269\uff09\u66b4\u9732\u4e8e\u5371\u9669\u3001\u4f24\u5bb3\u6216\u635f\u5931\u4e4b\u4e2d\u3002"}, "usage_en": "Used when exposing something valuable to potential danger.", "usage_cn": "\u7528\u4e8e\u5c06\u6709\u4ef7\u503c\u7684\u4e1c\u897f\u66b4\u9732\u4e8e\u6f5c\u5728\u5371\u9669\u4e4b\u4e2d\u3002", "scene_en": "A tightrope walker carefully balancing high above the ground, with no safety net.", "scene_cn": "\u8d70\u94a2\u4e1d\u7684\u4eba\u5c0f\u5fc3\u7ffc\u7ffc\u5730\u5728\u9ad8\u7a7a\u4fdd\u6301\u5e73\u8861\uff0c\u6ca1\u6709\u4efb\u4f55\u5b89\u5168\u7f51\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q8_risk_1.png", "P6_vocabulary_exercises_11_Q8_risk_2.png"], "examples": [{"en": "She decided to risk everything on this venture, hoping for substantial returns later.", "cn": "\u5979\u51b3\u5b9a\u5728\u8fd9\u9879\u4e8b\u4e1a\u4e0a\u5192\u9669\u4e00\u5207\uff0c\u5e0c\u671b\u4ee5\u540e\u80fd\u83b7\u5f97\u4e30\u539a\u7684\u56de\u62a5\u3002"}, {"en": "We can't risk losing our market share if we don't innovate and adapt quickly.", "cn": "\u5982\u679c\u6211\u4eec\u4e0d\u8fc5\u901f\u521b\u65b0\u548c\u9002\u5e94\uff0c\u6211\u4eec\u5c31\u6709\u5931\u53bb\u5e02\u573a\u4efd\u989d\u7684\u98ce\u9669\u3002"}]}, {"word": "offer", "ipa": "/\u02c8\u0252f\u0259r/", "meanings": {"en": "Present or proffer (something) for (someone) to accept or reject as so desired.", "cn": "\u63d0\u51fa\u6216\u63d0\u4f9b\uff08\u67d0\u7269\uff09\u4f9b\uff08\u67d0\u4eba\uff09\u63a5\u53d7\u6216\u62d2\u7edd\uff0c\u968f\u5176\u610f\u613f\u3002"}, "usage_en": "Used when presenting something for acceptance or rejection.", "usage_cn": "\u7528\u4e8e\u63d0\u4f9b\u67d0\u7269\u4ee5\u4f9b\u63a5\u53d7\u6216\u62d2\u7edd\u3002", "scene_en": "A waiter presenting a dish to a customer in a restaurant.", "scene_cn": "\u9910\u5385\u670d\u52a1\u5458\u5411\u987e\u5ba2\u5c55\u793a\u4e00\u9053\u83dc\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q8_offer_1.png", "P6_vocabulary_exercises_11_Q8_offer_2.png"], "examples": [{"en": "The company decided to offer employees a bonus for their hard work during the year.", "cn": "\u516c\u53f8\u51b3\u5b9a\u4e3a\u5458\u5de5\u5728\u8fd9\u4e00\u5e74\u4e2d\u7684\u8f9b\u52e4\u5de5\u4f5c\u63d0\u4f9b\u5956\u91d1\u3002"}, {"en": "I want to offer my sincere apologies for any inconvenience caused by the delay yesterday.", "cn": "\u5bf9\u4e8e\u6628\u5929\u5ef6\u8bef\u9020\u6210\u7684\u4efb\u4f55\u4e0d\u4fbf\uff0c\u6211\u60f3\u8868\u8fbe\u6211\u8bda\u631a\u7684\u6b49\u610f\u3002"}]}, {"word": "bet", "ipa": "/bet/", "meanings": {"en": "Risk something, usually money, against someone else's on the basis of the outcome of an unpredictable event.", "cn": "\u6839\u636e\u4e0d\u53ef\u9884\u6d4b\u4e8b\u4ef6\u7684\u7ed3\u679c\uff0c\u7528\u67d0\u7269\uff08\u901a\u5e38\u662f\u91d1\u94b1\uff09\u4e0e\u4ed6\u4eba\u5bf9\u8d4c\u3002"}, "usage_en": "Used when wagering on an uncertain outcome.", "usage_cn": "\u7528\u4e8e\u5bf9\u4e0d\u786e\u5b9a\u7684\u7ed3\u679c\u8fdb\u884c\u4e0b\u6ce8\u3002", "scene_en": "People watching a horse race and placing bets.", "scene_cn": "\u4eba\u4eec\u89c2\u770b\u8d5b\u9a6c\u5e76\u4e0b\u6ce8\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q8_bet_1.png", "P6_vocabulary_exercises_11_Q8_bet_2.png"], "examples": [{"en": "I'd bet that it will rain tomorrow, given the dark clouds gathering overhead right now.", "cn": "\u6211\u6562\u6253\u8d4c\u660e\u5929\u4f1a\u4e0b\u96e8\uff0c\u56e0\u4e3a\u73b0\u5728\u5934\u9876\u4e0a\u805a\u96c6\u7740\u4e4c\u4e91\u3002"}, {"en": "He decided to bet a significant amount of money on the underdog team winning the championship.", "cn": "\u4ed6\u51b3\u5b9a\u628a\u4e00\u5927\u7b14\u94b1\u62bc\u5728\u4e0d\u88ab\u770b\u597d\u7684\u7403\u961f\u8d62\u5f97\u51a0\u519b\u4e0a\u3002"}]}, {"word": "gamble", "ipa": "/\u02c8\u0261\u00e6mbl/", "meanings": {"en": "Take risky action in the hope of a desired result.", "cn": "\u91c7\u53d6\u5192\u9669\u884c\u52a8\uff0c\u4ee5\u671f\u83b7\u5f97\u7406\u60f3\u7684\u7ed3\u679c\u3002"}, "usage_en": "Used when taking a chance with uncertain outcomes.", "usage_cn": "\u7528\u4e8e\u5728\u7ed3\u679c\u4e0d\u786e\u5b9a\u7684\u60c5\u51b5\u4e0b\u5192\u9669\u3002", "scene_en": "A person playing poker in a casino.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u8d4c\u573a\u73a9\u6251\u514b\u3002", "image_paths": ["P6_vocabulary_exercises_11_Q8_gamble_1.png", "P6_vocabulary_exercises_11_Q8_gamble_2.png"], "examples": [{"en": "Starting a new business is always a gamble, but the potential rewards can be great.", "cn": "\u521b\u529e\u4e00\u5bb6\u65b0\u516c\u53f8\u603b\u662f\u4e00\u79cd\u8d4c\u535a\uff0c\u4f46\u6f5c\u5728\u7684\u56de\u62a5\u53ef\u80fd\u975e\u5e38\u4e30\u539a\u3002"}, {"en": "They decided to gamble their savings on a new technology stock, hoping for rapid growth.", "cn": "\u4ed6\u4eec\u51b3\u5b9a\u628a\u79ef\u84c4\u62bc\u5728\u4e00\u652f\u65b0\u7684\u79d1\u6280\u80a1\u4e0a\uff0c\u5e0c\u671b\u5b83\u80fd\u5feb\u901f\u589e\u957f\u3002"}]}], "synonym_cn": "\u6253\u8d4c\uff0c\u4e0b\u6ce8\uff0c\u5192\u9669", "socratic_questions": [{"question": "If you are uncertain about an investment's outcome, would you rather ______ a small amount than lose everything?", "options": ["risk", "offer", "bet", "gamble"], "correct_answer": "risk", "explanation": "Risk implies facing the possibility of loss or harm, suitable for uncertain situations."}, {"question": "During a negotiation, what would you do to ______ a compromise to the opposing party to reach an agreement?", "options": ["risk", "offer", "bet", "gamble"], "correct_answer": "offer", "explanation": "Offer means to present something for acceptance or rejection, fitting for proposing compromises."}, {"question": "Knowing your friend always wins, would you ______ on them to win the local chess tournament?", "options": ["risk", "offer", "bet", "gamble"], "correct_answer": "bet", "explanation": "Bet means to wager something, typically money, on the outcome of an event."}, {"question": "If you're unsure about the rules of the game, should you ______ your allowance on it?", "options": ["risk", "offer", "bet", "gamble"], "correct_answer": "gamble", "explanation": "Gamble implies taking a chance with the hope of gain but with the possibility of loss."}]}, {"id": 9, "stem": "Tina was badly scratched by her pet cat's ______.", "correct_
