row after a race.", "scene_cn": "\u4e00\u540d\u8fd0\u52a8\u5458\u5728\u6bd4\u8d5b\u540e\u64e6\u62ed\u989d\u5934\u4e0a\u7684\u6c57\u6c34\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q2_sweat_1.png", "P6_vocabulary_exercises_24_Q2_sweat_2.png"], "examples": [{"en": "Beads of sweat dripped down his face as he finished the marathon race strongly.", "cn": "\u5f53\u4ed6\u6709\u529b\u5730\u5b8c\u6210\u9a6c\u62c9\u677e\u6bd4\u8d5b\u65f6\uff0c\u6c57\u73e0\u4ece\u4ed6\u7684\u8138\u4e0a\u6ef4\u843d\u4e0b\u6765\u3002"}, {"en": "The intense heat caused her to sweat profusely during the outdoor yoga session.", "cn": "\u5728\u6237\u5916\u745c\u4f3d\u8bfe\u7a0b\u4e2d\uff0c\u5f3a\u70c8\u7684\u70ed\u91cf\u5bfc\u81f4\u5979\u5927\u91cf\u51fa\u6c57\u3002"}]}, {"word": "labour", "ipa": "/\u02c8le\u026ab\u0259r/", "meanings": {"en": "Productive activity, especially for the sake of economic gain; work.", "cn": "\u751f\u4ea7\u6027\u6d3b\u52a8\uff0c\u7279\u522b\u662f\u4e3a\u4e86\u7ecf\u6d4e\u5229\u76ca\uff1b\u5de5\u4f5c\u3002"}, "usage_en": "Denotes work, especially physical or manual work.", "usage_cn": "\u8868\u793a\u5de5\u4f5c\uff0c\u7279\u522b\u662f\u4f53\u529b\u6216\u624b\u5de5\u52b3\u52a8\u3002", "scene_en": "A group of construction workers building a new skyscraper.", "scene_cn": "\u4e00\u7fa4\u5efa\u7b51\u5de5\u4eba\u6b63\u5728\u5efa\u9020\u4e00\u5ea7\u65b0\u7684\u6469\u5929\u5927\u697c\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q2_labour_1.png", "P6_vocabulary_exercises_24_Q2_labour_2.png"], "examples": [{"en": "The factory relies heavily on manual labour to assemble their electronic products efficiently.", "cn": "\u8be5\u5de5\u5382\u4e25\u91cd\u4f9d\u8d56\u4f53\u529b\u52b3\u52a8\u6765\u6709\u6548\u5730\u7ec4\u88c5\u5176\u7535\u5b50\u4ea7\u54c1\u3002"}, {"en": "After years of hard labour, the farmer finally reaped a bountiful harvest this season.", "cn": "\u7ecf\u8fc7\u591a\u5e74\u7684\u8f9b\u52e4\u52b3\u52a8\uff0c\u519c\u6c11\u7ec8\u4e8e\u5728\u672c\u5b63\u83b7\u5f9 ercises_24_Q3_employer_1.png", "P6_vocabulary_exercises_24_Q3_employer_2.png"], "examples": [{"en": "The company is a large employer in the local community, providing many jobs.", "cn": "\u8be5\u516c\u53f8\u662f\u5f53\u5730\u793e\u533a\u7684\u5927\u96c7\u4e3b\uff0c\u63d0\u4f9b\u4e86\u8bb8\u591a\u5c31\u4e1a\u673a\u4f1a\u3002"}, {"en": "As an employer, she is responsible for ensuring a safe working environment.", "cn": "\u4f5c\u4e3a\u96c7\u4e3b\uff0c\u5979\u6709\u8d23\u4efb\u786e\u4fdd\u5b89\u5168\u7684\u5de5\u4f5c\u73af\u5883\u3002"}]}, {"word": "giver", "ipa": "/\u02c8\u0261\u026av\u0259r/", "meanings": {"en": "A person who gives things, especially money or help.", "cn": "\u7ed9\u4e88\u4e1c\u897f\u7684\u4eba\uff0c\u7279\u522b\u662f\u91d1\u94b1\u6216\u5e2e\u52a9"}, "usage_en": "Describes someone who provides resources to others.", "usage_cn": "\u63cf\u8ff0\u5411\u4ed6\u4eba\u63d0\u4f9b\u8d44\u6e90\u7684\u4eba\u3002", "scene_en": "A person donating to a charity.", "scene_cn": "\u4e00\u4e2a\u4eba\u5411\u6148\u5584\u673a\u6784\u6350\u6b3e\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q3_giver_1.png", "P6_vocabulary_exercises_24_Q3_giver_2.png"], "examples": [{"en": "She is a generous giver, always willing to help those in need around her.", "cn": "\u5979\u662f\u4e00\u4e2a\u6177\u6168\u7684\u7ed9\u4e88\u8005\uff0c\u603b\u662f\u613f\u610f\u5e2e\u52a9\u5468\u56f4\u9700\u8981\u5e2e\u52a9\u7684\u4eba\u3002"}, {"en": "He is known as a giver in his community, supporting various local initiatives.", "cn": "\u4ed6\u5728\u4ed6\u7684\u793e\u533a\u4e2d\u88ab\u79f0\u4e3a\u7ed9\u4e88\u8005\uff0c\u652f\u6301\u5404\u79cd\u5f53\u5730\u7684\u5021\u8bae\u3002"}]}], "synonym_cn": "\u517b\u5bb6\u7cca\u53e3\u7684\u4eba; \u7ecf\u6d4e\u652f\u67f1", "socratic_questions": [{"question": "In a company, who is responsible for paying the employees' salaries?", "options": ["earner", "breadwinner", "employer", "giver"], "correct_answer": "employer", "explanation": "The employer is the one who hires and pays the employees."}, {"question": "If a person consistently donates a significant portion of their income to charity, what are they?", "options": ["earner", "breadwinner", "employer", "giver"], "correct_answer": "giver", "explanation": "A giver is someone who provides resources, often money or time, to others."}, {"question": "Who brings home the money to support the family's needs?", "options": ["earner", "breadwinner", "employer", "giver"], "correct_answer": "breadwinner", "explanation": "The breadwinner is the person who earns the main income for a family."}, {"question": "If someone works and receives a salary, what are they?", "options": ["earner", "breadwinner", "employer", "giver"], "correct_answer": "earner", "explanation": "An earner is someone who gains money through work or investments."}]}, {"id": 4, "stem": "This piece of metal is not _______ at all. It is very rigid.", "correct_index": 2, "options": [{"word": "soft", "ipa": "/s\u0252ft/", "meanings": {"en": "Yielding easily to pressure or touch; not hard or firm.", "cn": "\u5bb9\u6613\u53d7\u538b\u6216\u89e6\u78b0\uff1b\u4e0d\u786c\u6216\u4e0d\u575a\u56fa\u3002"}, "usage_en": "Describing texture or character.", "usage_cn": "\u63cf\u8ff0\u8d28\u5730\u6216\u6027\u683c\u3002", "scene_en": "A fluffy pillow.", "scene_cn": "\u4e00\u4e2a\u84ec\u677e\u7684\u6795\u5934\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q4_soft_1.png", "P6_vocabulary_exercises_24_Q4_soft_2.png"], "examples": [{"en": "The baby's skin was incredibly soft to the touch, like velvet.", "cn": "\u5a74\u513f\u7684\u76ae\u80a4\u6478\u8d77\u6765\u975e\u5e38\u67d4\u8f6f\uff0c\u50cf\u5929\u9e45\u7ed2\u4e00\u6837\u3002"}, {"en": "She has a soft spot for stray animals and always tries to help them.", "cn": "\u5979\u5bf9\u6d41\u6d6a\u52a8\u7269\u6709\u7279\u522b\u7684\u611f\u60c5\uff0c\u603b\u662f\u5c3d\u529b\u5e2e\u52a9\u5b83\u4eec\u3002"}]}, {"word": "frigid", "ipa": "/\u02c8fr\u026ad\u0292\u026ad/", "meanings": {"en": "Extremely e", "bendable"], "correct_answer": "bendable", "explanation": "Bendable means capable of being bent without breaking."}]}, {"id": 5, "stem": "Sue studied painting in Paris for a/an _______ of four years.", "correct_index": 0, "options": [{"word": "period", "ipa": "\u02c8p\u026a\u0259ri\u0259d", "meanings": {"en": "A length or portion of time.", "cn": "\u4e00\u6bb5\u65f6\u95f4\u6216\u90e8\u5206\u65f6\u95f4\u3002"}, "usage_en": "Used to describe a specific duration or segment of time.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7279\u5b9a\u7684\u6301\u7eed\u65f6\u95f4\u6216\u4e00\u6bb5\u65f6\u95f4\u3002", "scene_en": "A calendar marking months, a historical timeline, or a school timetable.", "scene_cn": "\u4e00\u4e2a\u6807\u8bb0\u6708\u4efd\u7684\u65e5\u5386\uff0c\u4e00\u4e2a\u5386\u53f2\u65f6\u95f4\u8f74\uff0c\u6216\u4e00\u4e2a\u5b66\u6821\u65f6\u95f4\u8868\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q5_period_1.png", "P6_vocabulary_exercises_24_Q5_period_2.png"], "examples": [{"en": "The Renaissance period was a time of great artistic and intellectual flourishing.", "cn": "\u6587\u827a\u590d\u5174\u65f6\u671f\u662f\u827a\u672f\u548c\u667a\u6167\u84ec\u52c3\u53d1\u5c55\u7684\u65f6\u4ee3\u3002"}, {"en": "Each class period is fifty minutes long, with a short break in between.", "cn": "\u6bcf\u8282\u8bfe\u65f6\u957f\u4e94\u5341\u5206\u949f\uff0c\u4e2d\u95f4\u6709\u77ed\u6682\u7684\u4f11\u606f\u65f6\u95f4\u3002"}]}, {"word": "lapse", "ipa": "l\u00e6ps", "meanings": {"en": "A temporary failure of concentration, memory, or judgment.", "cn": "\u6ce8\u610f\u529b\u3001\u8bb0\u5fc6\u529b\u6216\u5224\u65ad\u529b\u7684\u6682\u65f6\u6027\u5931\u6548\u3002"}, "usage_en": "Describes a brief slip or error.", "usage_cn": "\u63cf\u8ff0\u4e00\u4e2a\u77ed\u6682\u7684\u5931\u8bef\u6216\u9519\u8bef\u3002", "scene_en": "Someone forgetting keys, a momentary loss of focus, or a brief memory blank.", "scene_cn": "\u67d0\u4eba\u5fd8\u8bb0\u94a5\u5319\uff0c\u6ce8\u610f\u529b\u77ed\u6682\u4e27\u5931\uff0c\u6216\u8bb0\u5fc6\u77ed\u6682\u7a7a\u767d\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q5_lapse_1.png", "P6_vocabulary_exercises_24_Q5_lapse_2.png"], "examples": [{"en": "A brief lapse in concentration caused her to miss an important detail in the instructions.", "cn": "\u77ed\u6682\u7684\u6ce8\u610f\u529b\u4e0d\u96c6\u4e2d\u5bfc\u81f4\u5979\u9519\u8fc7\u4e86\u8bf4\u660e\u4e66\u4e2d\u7684\u4e00\u4e2a\u91cd\u8981\u7ec6\u8282\u3002"}, {"en": "After a lapse of several years, they finally decided to revisit their childhood home.", "cn": "\u65f6\u9694\u51e0\u5e74\u4e4b\u540e\uff0c\u4ed6\u4eec\u7ec8\u4e8e\u51b3\u5b9a\u91cd\u8bbf\u7ae5\u5e74\u65f6\u7684\u5bb6\u3002"}]}, {"word": "time", "ipa": "ta\u026am", "meanings": {"en": "The indefinite continued progress of existence and events in the past, present, and future regarded as a whole.", "cn": "\u8fc7\u53bb\u3001\u73b0\u5728\u548c\u672a\u6765\u5b58\u5728\u548c\u4e8b\u4ef6\u7684\u4e0d\u786e\u5b9a\u7684\u6301\u7eed\u8fdb\u5c55\u88ab\u89c6\u4e3a\u4e00\u4e2a\u6574\u4f53\u3002"}, "usage_en": "General measurement of duration.", "usage_cn": "\u6301\u7eed\u65f6\u95f4\u7684\u4e00\u822c\u6d4b\u91cf\u3002", "scene_en": "Clocks, calendars, watches, and the movement of the sun across the sky.", "scene_cn": "\u65f6\u949f\u3001\u65e5\u5386\u3001\u624b\u8868\u4ee5\u53ca\u592a\u9633\u5728\u5929\u7a7a\u4e2d\u7684\u8fd0\u52a8\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q5_time_1.png", "P6_vocabulary_exercises_24_Q5_time_2.png"], "examples": [{"en": "Time flies when you are having fun, so enjoy every moment to its fullest.", "cn": "\u5f53\u4f60\u73a9\u5f97\u5f00\u5fc3\u65f6\uff0c\u65f6\u95f4\u8fc7\u5f97\u98de\u5feb\uff0c\u6240\u4ee5\u8981\u5145\u5206\u4eab\u53d7\u6bcf\u4e00\u523b\u3002"}, {"en": "What time is it? I need to know if I am going to be late.", "cn": "\u73b0\u5728\u51e0\u70b9\u4e86\uff1f \u6211\u9700\u8981\u77e5\u9053\u6211\u662f\u5426\u4f1a\u8fdf\u5230\u3002"}]}, {"word": "interval", "ipa": "\u02c8\u026ant\u0259rv\u0259l", "meanings": {"en": "A space of time between events or states.", "cn": "\u4e8b\u4ef6\u6216\u72b6\u6001\u4e4b\u95f4\u7684\u65f6\u95f4\u95f4\u9694\u3002"}, "usage_en": "A specific segment of time, often with breaks.", "usage_cn": "\u4e00\u4e2a\u7279\u5b9a\u7684\u65f6\u95f4\u6bb5\uff0c\u901a\u5e38\u5e26\u6709\u4f11\u606f\u65f6\u95f4\u3002", "scene_en": "A theater intermission, breaks between exercises, or scheduled pauses in a meeting.", "scene_cn": "\u5267\u9662\u7684\u4e2d\u573a\u4f11\u606f\uff0c\u7ec3\u4e60\u4e4b\u95f4\u7684\u4f11\u606f\uff0c\u6216\u4f1a\u8bae\u4e2d\u5b89\u6392\u7684\u6682\u505c\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q5_interval_1.png", "P6_vocabulary_exercises_24_Q5_interval_2.png"], "examples": [{"en": "The train departs every hour, with a short interval for boarding passengers safely.", "cn": "\u706b\u8f66\u6bcf\u5c0f\u65f6\u53d1\u8f66\u4e00\u6b21\uff0c\u4e2d\u95f4\u6709\u77ed\u6682\u7684\u95f4\u9694\u4f9b\u4e58\u5ba2\u5b89\u5168\u767b\u673a\u3002"}, {"en": "During the play's interval, the audience members stretched their legs and grabbed refreshments.", "cn": "\u5728\u620f\u5267\u7684\u5e55\u95f4\u4f11\u606f\u671f\u95f4\uff0c\u89c2\u4f17\u4eec\u4f38\u5c55\u4e86\u53cc\u817f\u5e76\u62ff\u4e86\u70b9\u5fc3\u3002"}]}], "synonym_cn": "\u4e00\u6bb5\u65f6\u95f4\uff1b\u4e00\u6bb5\u65f6\u671f", "socratic_questions": [{"question": "If a class is divided into segments with short breaks in between, what are these segments called?", "options": ["period", "lapse", "time", "interval"], "correct_answer": "interval", "explanation": "An 'interval' refers to a specific segment of time, often with breaks or pauses in between."}, {"question": "What is the term for a temporary failure of concentration, memory, or judgment?", "options": ["period", "lapse", "time", "interval"], "correct_answer": "lapse", "explanation": "A 'lapse' signifies a brief slip or error, often in memory or judgment."}, {"question": "If you are referring to the duration in history when dinosaurs roamed the earth, what word would you use?", "options": ["period", "lapse", "time", "interval"], "correct_answer": "period", "explanation": "A 'period' refers to a significant and extended duration in history or development."}, {"question": "If someone asks you what the current _______ is, what are they asking about?", "options": ["period", "lapse", "time", "interval"], "correct_answer": "time", "explanation": "'Time' refers to the current moment or a general measurement of duration."}]}, {"id": 6, "stem": "You may send in your application form if you are interested in becoming a _______ of this club.", "correct_index": 2, "options": [{"word": "partner", "ipa": "/\u02c8p\u0251\u02d0rtn\u0259r/", "meanings": {"en": "A person who shares a business or activity with another.", "cn": "\u4e0e\u4ed6\u4eba\u5206\u4eab\u4e1a\u52a1\u6216\u6d3b\u52a8\u7684\u4eba\u3002"}, "usage_en": "Used to describe someone who shares a business or activity.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e0e\u4ed6\u4eba\u5206\u4eab\u4e1a\u52a1\u6216\u6d3b\u52a8\u7684\u4eba\u3002", "scene_en": "Two people shaking hands after agreeing to a business deal.", "scene_cn": "\u4e24\u4e2a\u4eba\u63e1\u624b\uff0c\u5728\u8fbe\u6210\u5546\u4e1a\u4ea4\u6613\u540e\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q6_partner_1.png", "P6_vocabulary_exercises_24_Q6_partner_2.png"], "examples": [{"en": "She is my business partner, and we share all the profits equally.", "cn": "\u5979\u662f\u6211\u7684\u5546\u4e1a\u4f19\u4f34\uff0c\u6211\u4eec\u5e73\u7b49\u5730\u5206\u4eab\u6240\u6709\u5229\u6da6\u3002"}, {"en": "They became partners in a new restaurant venture downtown last year.", "cn": "\u53bb\u5e74\uff0c\u4ed6\u4eec\u6210\u4e3a\u5e02\u4e2d\u5fc3\u4e00\u5bb6\u65b0\u9910\u5385\u4f01\u4e1a\u7684\u5408\u4f19\u4eba\u3002"}]}, {"word": "inmate", "ipa": "/\u02c8\u026anme\u026at/", "meanings": {"en": "A person confined to an institution such as a prison or hospital.", "cn": "\u88ab\  "inmate", "member", "client"], "correct_answer": "member", "explanation": "\u6210\u5458\u662f\u6307\u56e2\u961f\u6216\u7ec4\u7ec7\u4e2d\u7684\u4e00\u4efd\u5b50\uff0c\u5171\u540c\u53c2\u4e0e\u6d3b\u52a8\u3002"}, {"question": "\u5982\u679c\u4f60\u548c\u67d0\u4eba\u5171\u540c\u62e5\u6709\u4e00\u5bb6\u516c\u53f8\uff0c\u4f60\u4eec\u4e4b\u95f4\u7684\u5173\u7cfb\u662f\u4ec0\u4e48\uff1f", "options": ["partner", "inmate", "member", "client"], "correct_answer": "partner", "explanation": "\u5408\u4f19\u4eba\u662f\u6307\u5171\u540c\u7ecf\u8425\u4e1a\u52a1\u7684\u4eba\uff0c\u5206\u4eab\u5229\u6da6\u548c\u98ce\u9669\u3002"}, {"question": "\u5728\u76d1\u72f1\u91cc\u670d\u5211\u7684\u4eba\u88ab\u79f0\u4e3a\uff1f", "options": ["partner", "inmate", "member", "client"], "correct_answer": "inmate", "explanation": "\u56da\u72af\u662f\u6307\u88ab\u76d1\u7981\u7684\u4eba\u3002"}]}, {"id": 7, "stem": "We caught a _______ of the movie star as she walked into the hotel.", "correct_index": 1, "options": [{"word": "glare", "ipa": "/\u0261l\u025b\u0259r/", "meanings": {"en": "To look at someone in an angry or hostile way.", "cn": "\u4ee5\u6124\u6012\u6216\u654c\u5bf9\u7684\u65b9\u5f0f\u770b\u7740\u67d0\u4eba\u3002"}, "usage_en": "Used to describe an angry or hostile look.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6124\u6012\u6216\u654c\u5bf9\u7684\u773c\u795e\u3002", "scene_en": "A person with furrowed brows and narrowed eyes looking intensely at another person.", "scene_cn": "\u4e00\u4e2a\u4eba\u76b1\u7740\u7709\u5934\uff0c\u772f\u7740\u773c\u775b\uff0c\u4e13\u6ce8\u5730\u770b\u7740\u53e6\u4e00\u4e2a\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q7_glare_1.png", "P6_vocabulary_exercises_24_Q7_glare_2.png"], "examples": [{"en": "She gave him a fierce glare after he made the rude comment.", "cn": "\u5728\u4ed6\u8bf4\u4e86\u7c97\u9c81\u7684\u8bc4\u8bba\u540e\uff0c\u5979\u72e0\u72e0\u5730\u77aa\u4e86\u4ed6\u4e00\u773c\u3002"}, {"en": "The teacher glared at the students who were talking during the exam.", "cn": "\u8001\u5e08\u77aa\u7740\u8003\u8bd5\u65f6\u8bf4\u8bdd\u7684\u5b66\u751f\u3002"}]}, {"word": "glimpse", "ipa": "/\u0261l\u026amps/", "meanings": {"en": "To see something or someone briefly or partially.", "cn": "\u77ed\u6682\u6216\u90e8\u5206\u5730\u770b\u5230\u67d0\u7269\u6216\u67d0\u4eba\u3002"}, "usage_en": "Used to describe a brief or fleeting view.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u77ed\u6682\u6216\u4e00\u77a5\u7684\u666f\u8c61\u3002", "scene_en": "A quick, fleeting view of a celebrity in a crowd.", "scene_cn": "\u5728\u4eba\u7fa4\u4e2d\u5feb\u901f\u4e00\u77a5\u540d\u4eba\u7684\u8eab\u5f71\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q7_glimpse_1.png", "P6_vocabulary_exercises_24_Q7_glimpse_2.png"], "examples": [{"en": "I caught a glimpse of her as she hurried down the busy street.", "cn": "\u6211\u770b\u5230\u5979\u5306\u5306\u8d70\u5728\u7e41\u5fd9\u7684\u8857\u9053\u4e0a\u3002"}, {"en": "He only got a glimpse of the suspect before he disappeared into the crowd.", "cn": "\u5728\u4ed6\u6d88\u5931\u5728\u4eba\u7fa4\u4e2d\u4e4b\u524d\uff0c\u4ed6\u53ea\u77a5\u89c1\u4e86\u5acc\u7591\u4eba\u3002"}]}, {"word": "look", "ipa": "/l\u028ak/", "meanings": {"en": "To direct one's eyes in a specified direction.", "cn": "\u5c06\u67d0\u4eba\u7684\u773c\u775b\u6307\u5411\u7279\u5b9a\u65b9\u5411\u3002"}, "usage_en": "A general term for directing one's gaze.", "usage_cn": "\u7528\u4e8e\u5f15\u5bfc\u89c6\u7ebf\u7684\u4e00\u822c\u672f\u8bed\u3002", "scene_en": "A person looking out of a window at a scenic view.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u7740\u7a97\u5916\u7684\u98ce\u666f\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q7_look_1.png", "P6_vocabulary_exercises_24_Q7_look_2.png"], "examples": [{"en": "Please look at the document carefully before you sign it, please.", "cn": "\u8bf7\u5728\u7b7e\u7f72\u6587\u4ef6\u4e4b\u524d\u4ed4\u7ec6\u9605\u8bfb\u8be5\u6587\u4ef6\u3002"}, {"en": "She took a long look at the old photograph, remembering her childhood.", "cn": "\u5979\u4e45\u4e45\u5730\u770b\u7740\u65e7\u7167\u7247\uff0c\u56de\u5fc6\u8d77\u5979\u7684\u7ae5\u5e74\u3002"}]}, {"word": "stare", "ipa": "/st\u025b\u0259r/", "meanings": {"en": "To look fixedly or vacantly at someone or something with one's eyes wide open.", "cn": "\u773c\u775b\u7741\u5927\u5730\u51dd\u89c6\u6216\u832b\u7136\u5730\u770b\u7740\u67d0\u4eba\u6216\u67d0\u7269\u3002"}, "usage_en": "To look intently for a prolonged period.", "usage_cn": "\u957f\u65f6\u95f4\u4e13\u6ce8\u5730\u89c2\u770b\u3002", "scene_en": "A person staring blankly into space, lost in thought.", "scene_cn": "\u4e00\u4e2a\u4eba\u832b\u7136\u5730\u51dd\u89c6\u7740\u592a\u7a7a\uff0c\u9677\u5165\u6c89\u601d\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q7_stare_1.png", "P6_vocabulary_exercises_24_Q7_stare_2.png"], "examples": [{"en": "It's impolite to stare at people you don't know; it can make them uncomfortable.", "cn": "\u76ef\u7740\u4f60\u4e0d\u8ba4\u8bc6\u7684\u4eba\u662f\u4e0d\u793c\u8c8c\u7684\uff1b\u8fd9\u4f1a\u8ba9\u4ed6\u4eec\u611f\u5230\u4e0d\u8212\u670d\u3002"}, {"en": "He began to stare blankly at the wall, lost in his own thoughts and memories.", "cn": "\u4ed6\u5f00\u59cb\u832b\u7136\u5730\u76ef\u7740\u5899\u58c1\uff0c\u6c89\u6d78\u5728\u81ea\u5df1\u7684\u601d\u60f3\u548c\u8bb0\u5fc6\u4e2d\u3002"}]}], "synonym_cn": "\u77a5\u89c1 vs. \u77aa\u773c vs. \u770b vs. \u6ce8\u89c6", "socratic_questions": [{"question": "In a crowded room, which word describes briefly noticing someone across the room?", "options": ["glare", "glimpse", "look", "stare"], "correct_answer": "glimpse", "explanation": "A 'glimpse' suggests a brief, fleeting view, perfect for a crowded room."}, {"question": "If you are angrily focusing on someone, what action are you most likely doing?", "options": ["glare", "glimpse", "look", "stare"], "correct_answer": "glare", "explanation": "A 'glare' implies an angry or hostile gaze, often intense and prolonged."}, {"question": "If someone asks you to '____ at this picture,' what are they requesting?", "options": ["glare", "glimpse", "look", "stare"], "correct_answer": "look", "explanation": "'Look' is a general term for directing your eyes towards something."}, {"question": "Which action suggests a prolonged, intent gaze, possibly making someone uncomfortable?", "options": ["glare", "glimpse", "look", "stare"], "correct_answer": "stare", "explanation": "To 'stare' is to look intently for a considerable amount of time."}]}, {"id": 8, "stem": "He was so ill that he was _______ of walking on his own.", "correct_index": 3, "options": [{"word": "unable", "ipa": "/\u028cn\u02c8e\u026abl/", "meanings": {"en": "lacking the skill, strength, or opportunity to do something.", "cn": "\u7f3a\u4e4f\u6280\u80fd\u3001\u529b\u91cf\u6216\u673a\u4f1a\u53bb\u505a\u67d0\u4e8b\u3002"}, "usage_en": "Describes a temporary or circumstantial lack of ability.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u6682\u65f6\u7684\u6216\u73af\u5883\u9020\u6210\u7684\u7f3a\u4e4f\u80fd\u529b\u3002", "scene_en": "A person trying to lift a heavy box but failing because it's too heavy.", "scene_cn": "\u4e00\u4e2a\u4eba\u8bd5\u56fe\u4e3e\u8d77\u4e00\u4e2a\u6c89\u91cd\u7684\u7bb1\u5b50\uff0c\u4f46\u56e0\u4e3a\u592a\u91cd\u800c\u5931\u8d25\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q8_unable_1.png", "P6_vocabulary_exercises_24_Q8_unable_2.png"], "examples": [{"en": "Due to the power outage, I was unable to complete my work assignment.", "cn": "\u7531\u4e8e\u505c\u7535\uff0c\u6211\u65e0\u6cd5\u5b8c\u6210\u6211\u7684\u5de5\u4f5c\u4efb\u52a1\u3002"}, {"en": "She was unable to attend the meeting because of a prior commitment already scheduled.", "cn": "\u7531\u4e8e\u4e8b\u5148\u5b89\u6392\u597d\u7684\u4e8b\u60c5\uff0c\u5979\u65e0\u6cd5\u53c2\u52a0\u4f1a\u8bae\u3002"}]}, {"word": "impossible", "ipa": "/\u026am\u02c8p\u0252s\u026abl/", "meanings": {"en": "not able to occur or be done.", "cn": "\u4e0d\u53ef\u80fd\u53d1\u751f\u6216\u5b8c\u6210\u3002"}, "usage_en": "Describes something that cannot happen or be achieved.", "usage_cn": "\u63cf\u8ff0\u65e0\u6cd5\u53d1\u751f\u6216\u5b9e\u73b0\u7684\u4e8b\u60c5\u3002", "scene_en": "A person trying to climb a vertical, smooth wall with no holds.", "scene_cn": "\u4e00\u4e2a\u4eba\u8bd5\u56fe\u6500\u767b\u4e00\u4e2a\u5782\u76f4\u7684\u3001\u5149\u6ed1\u7684\u3001\u6ca1\u6709\u652f\u6491\u70b9\u7684\u5899\u58c1\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q8_impossible_1.png", "P6_vocabulary_exercises_24_Q8_impossible_2.png"], "examples": [{"en": "It is impossible to predict the future with complete accuracy, despite many attempts.", "cn": "\u5c3d\u7ba1\u5c1d\u8bd5\u4e86\u5f88\u591a\u6b21\uff0c\u4f46\u5b8c\u5168\u51c6\u786e\u5730\u9884\u6d4b\u672a\u6765\u662f\u4e0d\u53ef\u80fd\u7684\u3002"}, {"en": "Reversing time is scientifically impossible according to our current understanding of physics today.", "cn": "\u6839\u636e\u6211\u4eec\u76ee\u524d\u5bf9\u7269\u7406\u5b66\u7684\u7406\u89e3\uff0c\u5012\u8f6c\u65f6\u95f4\u5728\u79d1\u5b66\u4e0a\u662f\u4e0d\u53ef\u80fd\u7684\u3002"}]}, {"word": "unlikely", "ipa": "/\u028cn\u02c8la\u026akli/", "meanings": {"en": "not likely to happen, be done, or be true; improbable.", "cn": "\u4e0d\u592a\u53ef\u80fd\u53d1\u751f\u3001\u5b8c\u6210\u6216\u771f\u5b9e\uff1b\u4e0d\u5927\u53ef\u80fd\u3002"}, "usage_en": "Describes something that probably will not happen.", "usage_cn": "\u63cf\u8ff0\u53ef\u80fd\u4e0d\u4f1a\u53d1\u751f\u7684\u4e8b\u60c5\u3002", "scene_en": "A dark, cloudy sky with a small patch of blue, suggesting rain is coming.", "scene_cn": "\u4e00\u7247\u9ed1\u6697\u591a\u4e91\u7684\u5929\u7a7a\uff0c\u53ea\u6709\u4e00\u5c0f\u5757\u84dd\u8272\uff0c\u6697\u793a\u7740\u5373\u5c06\u4e0b\u96e8\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q8_unlikely_1.png", "P6_vocabulary_exercises_24_Q8_unlikely_2.png"], "examples": [{"en": "It is unlikely that the team will win the championship, given their current performance.", "cn": "\u9274\u4e8e\u4ed6\u4eec\u76ee\u524d\u7684\u8868\u73b0\uff0c\u8be5\u56e2\u961f\u4e0d\u592a\u53ef\u80fd\u8d62\u5f97\u51a0\u519b\u3002"}, {"en": "With such a small chance of success, it's unlikely that the project will be approved.", "cn": "\u7531\u4e8e\u6210\u529f\u7684\u673a\u4f1a\u5982\u6b64\u4e4b\u5c0f\uff0c\u8be5\u9879\u76ee\u4e0d\u592a\u53ef\u80fd\u83b7\u5f97\u6279\u51c6\u3002"}]}, {"word": "incapable", "ipa": "/\u026an\u02c8ke\u026ap\u0259bl/", "meanings": {"en": "lacking the ability or capacity to do something.", "cn": "\u7f3a\u4e4f\u505a\u67d0\u4e8b\u7684\u80fd\u529b\u6216\u5bb9\u91cf\u3002"}, "usage_en": "Describes a fundamental lack of ability or qualification.", "usage_cn": "\u63cf\u8ff0\u4e00\u79cd\u57fa\u672c\u7684\u80fd\u529b\u6216\u8d44\u683c\u7684\u7f3a\u4e4f\u3002", "scene_en": "A person with a broken leg trying to run a marathon.", "scene_cn": "\u4e00\u4e2a\u817f\u90e8\u9aa8\u6298\u7684\u4eba\u8bd5\u56fe\u8dd1\u9a6c\u62c9\u677e\u3002", "image_paths": ["P6_vocabulary_exercises_24_Q8_incapable_1.png", "P6_vocabulary_exercises_24_Q8_incapable_2.png"], "examples": [{"en": "Due to his lack of training, he was incapable of completing the advanced course.", "cn": "\u7531\u4e8e\u7f3a\u4e4f\u57f9\u8bad\uff0c\u4ed6\u65e0\u6cd5\u5b8c\u6210\u9ad8\u7ea7\u8bfe\u7a0b\u3002"}, {"en": "She felt incapable of handling the pressure after the recent stressful events at work.", "cn": "\u5728\u6700\u8fd1\u5de5\u4f5c\u4e2d\u53d1\u751f\u538b\u529b\u4e8b\u4ef6\u540e\uff0c\u5979\u611f\u5230\u65e0\u6cd5\u627f\u53d7\u538b\u529b\u3002"}]}], "synonym_cn": "\u65e0\u80fd\u4e3a\u529b vs \u4e0d\u53ef\u80fd vs \u4e0d\u592a\u53ef\u80fd vs \u6ca1\u6709\u80fd\u529b", "socratic_questions": [{"question": "If a bridge is structurally unsound and collapses, making crossing impossible, would you say it's 'unable,' 'impossible,' 'unlikely,' or 'incapable' to cross?", "options": ["unable", "impossible", "unlikely", "incapable"], "correct_answer": "impossible", "explanation": "'Impossi
