u67d0\u4e8b\u7269\u6216\u5177\u6709\u76f4\u89c9\u3002", "scene_en": "A person closing their eyes and feeling the warmth of the sun on their face.", "scene_cn": "\u4e00\u4e2a\u4eba\u95ed\u4e0a\u773c\u775b\uff0c\u611f\u53d7\u9633\u5149\u7167\u5728\u8138\u4e0a\u7684\u6e29\u6696\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q1_sense_1.png", "P6_vocabulary_exercises_7_Q1_sense_2.png"], "examples": [{"en": "I could sense her disappointment even though she tried to hide it from everyone.", "cn": "\u5373\u4f7f\u5979\u8bd5\u56fe\u5bf9\u6240\u6709\u4eba\u9690\u7792\uff0c\u6211\u8fd8\u662f\u80fd\u611f\u89c9\u5230\u5979\u7684\u5931\u671b\u3002"}, {"en": "Animals can often sense impending natural disasters before humans are even aware of them.", "cn": "\u52a8\u7269\u901a\u5e38\u53ef\u4ee5\u5728\u4eba\u7c7b\u610f\u8bc6\u5230\u4e4b\u524d\u611f\u77e5\u5230\u5373\u5c06\u5230\u6765\u7684\u81ea\u7136\u707e\u5bb3\u3002"}]}, {"word": "feel", "ipa": "fi\u02d0l", "meanings": {"en": "To experience an emotion or sensation.", "cn": "\u4f53\u9a8c\u4e00\u79cd\u60c5\u7eea\u6216\u611f\u89c9\u3002"}, "usage_en": "Describes experiencing emotions, physical sensations, or having an opinion.", "usage_cn": "\u63cf\u8ff0\u4f53\u9a8c\u60c5\u7eea\u3001\u8eab\u4f53\u611f\u89c9\u6216\u6301\u6709\u89c2\u70b9\u3002", "scene_en": "A woman feeling happy and content while sitting in a cozy armchair.", "scene_cn": "\u4e00\u4f4d\u5973\u58eb\u5750\u5728\u8212\u9002\u7684\u6276\u624b\u6905\u4e0a\uff0c\u611f\u5230\u5feb\u4e50\u548c\u6ee1\u8db3\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q1_feel_1.png", "P6_vocabulary_exercises_7_Q1_feel_2.png"], "examples": [{"en": "After a long day of work, I feel exhausted and just want to relax at home.", "cn": "\u7ecf\u8fc7\u6f2b\u957f\u7684\u4e00\u5929\u5de5\u4f5c\u540e\uff0c\u6211\u611f\u5230\u7b4b\u75b2\u529b\u5c3d\uff0c\u53ea\u60f3\u5728\u5bb6\u653e\u677e\u4e00\u4e0b\u3002"}, {"en": "I feel that it is important to support local businesses in our community whenever possible.", "cn": "\u6211\u8ba4\u4e3a\u5c3d\u53ef\u80fd\u652f\u6301\u6211\u4eec\u793e\u533a\u7684\u5f53\u5730\u4f01\u4e1a\u975e\u5e38\u91cd\u8981\u3002"}]}, {"word": "detect", "ipa": "d\u026a\u02c8t\u025bkt", "meanings": {"en": "To discover or identify the presence or existence of something.", "cn": "\u53d1\u73b0\u6216\u8bc6\u522b\u67d0\u7269\u7684\u5b58\u5728\u3002"}, "usage_en": "Used to describe discovering or noticing something, often with instruments.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u53d1\u73b0\u6216\u6ce8\u610f\u5230\u67d0\u4e8b\u7269\uff0c\u901a\u5e38\u501f\u52a9\u4eea\u5668\u3002", "scene_en": "Scientists using advanced equipment in a laboratory to detect a new particle.", "scene_cn": "\u79d1\u5b66\u5bb6\u5728\u5b9e\u9a8c\u5ba4\u4e2d\u4f7f\u7528\u5148\u8fdb\u8bbe\u5907\u6765\u63a2\u6d4b\u4e00\u79cd\u65b0\u7c92\u5b50\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q1_detect_1.png", "P6_vocabulary_exercises_7_Q1_detect_2.png"], "examples": [{"en": "The security system can detect any unauthorized entry into the building after working hours.", "cn": "\u5b89\u5168\u7cfb\u7edf\u53ef\u4ee5\u68c0\u6d4b\u5230\u4e0b\u73ed\u540e\u4efb\u4f55\u672a\u7ecf\u6388\u6743\u8fdb\u5165\u5927\u697c\u7684\u884c\u4e3a\u3002"}, {"en": "Doctors can detect early signs of cancer through regular screenings and medical examinations.", "cn": "\u533b\u751f\u53ef\u4ee5\u901a\u8fc7\u5b9a\u671f\u7b5b\u67e5\u548c\u4f53\u68c0\u6765\u68c0\u6d4b\u764c\u75c7\u7684\u65e9\u671f\u8ff9\u8c61\u3002"}]}], "synonym_cn": "\u5bdf\u89c9, \u611f\u77e5, \u53d1\u89c9", "socratic_questions": [{"question": "If a disease spreads rapidly through a population, would you say it's likely to ______ many people?", "options": ["infect", "sense", "feel", "detect"], "correct_answer": "infect", "explanation": "Infect means to transmit a disease, fitting the context of a spreading illness."}, {"question": "If you ______ a change in the weather, like a drop in temperature, what are you experiencing?", "options": ["infect", "sense", "feel", "detect"], "correct_answer": "feel", "explanation": "Feel implies experiencing a physical sensation or emotion, like a change in weather."}, {"question": "If you ______ danger approaching, are you using your intuition or senses to become aware of it?", "options": ["infect", "sense", "feel", "detect"], "correct_answer": "sense", "explanation": "Sense means to become aware of something through your senses or intuition."}, {"question": "If security cameras ______ someone entering a restricted area, what action are they performing?", "options": ["infect", "sense", "feel", "detect"], "correct_answer": "detect", "explanation": "Detect means to discover or notice something, especially using equipment."}]}, {"id": 2, "stem": "When I looked in the river, I saw my ______ in the water.", "correct_index": 3, "options": [{"word": "refraction", "ipa": "/r\u026a\u02c8fr\u00e6k\u0283\u0259n/", "meanings": {"en": "The bending of light as it passes from one substance to another.", "cn": "\u5149\u7ebf\u4ece\u4e00\u79cd\u7269\u8d28\u4f20\u9012\u5230\u53e6\u4e00\u79cd\u7269\u8d28\u65f6\u53d1\u751f\u7684\u5f2f\u66f2\u3002"}, "usage_en": "Used in physics and optics to describe light's behavior.", "usage_cn": "\u5728\u7269\u7406\u5b66\u548c\u5149\u5b66\u4e2d\u7528\u4e8e\u63cf\u8ff0\u5149\u7684\u884c\u4e3a\u3002", "scene_en": "A prism splitting white light into a rainbow of colors.", "scene_cn": "\u4e00\u4e2a\u68f1\u955c\u5c06\u767d\u5149\u5206\u6210\u5f69\u8679\u7684\u989c\u8272\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q2_refraction_1.png", "P6_vocabulary_exercises_7_Q2_refraction_2.png"], "examples": [{"en": "The refraction of light through the lens creates a clear image on the screen.", "cn": "\u5149\u7ebf\u901a\u8fc7\u900f\u955c\u7684\u6298\u5c04\u5728\u5c4f\u5e55\u4e0a\u5f62\u6210\u6e05\u6670\u7684\u56fe\u50cf\u3002"}, {"en": "Understanding refraction is crucial for designing effective optical instruments like telescopes and microscopes.", "cn": "\u7406\u89e3\u6298\u5c04\u5bf9\u4e8e\u8bbe\u8ba1\u6709\u6548\u7684\u5149\u5b66\u4eea\u5668\uff08\u5982\u671b\u8fdc\u955c\u548c\u663e\u5fae\u955c\uff09\u81f3\u5173\u91cd\u8981\u3002"}]}, {"word": "relation", "ipa": "/r\u026a\u02c8le\u026a\u0283\u0259n/", "meanings": {"en": "The way in which two or more people or things are connected.", "cn": "\u4e24\u4e2a\u6216\u591a\u4e2a\u4eba\u6216\u4e8b\u7269\u8fde\u63a5\u7684\u65b9\u5f0f\u3002"}, "usage_en": "Describes connections between people, things, or ideas.", "usage_cn": "\u63cf\u8ff0\u4eba\u3001\u4e8b\u7269\u6216\u60f3\u6cd5\u4e4b\u95f4\u7684\u8054\u7cfb\u3002", "scene_en": "A family gathering, showing connections between relatives.", "scene_cn": "\u5bb6\u5ead\u805a\u4f1a\uff0c\u5c55\u793a\u4eb2\u621a\u4e4b\u95f4\u7684\u8054\u7cfb\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q2_relation_1.png", "P6_vocabulary_exercises_7_Q2_relation_2.png"], "examples": [{"en": "The relation between cause and effect is fundamental to scientific understanding and critical thinking.", "cn": "\u56e0\u679c\u5173\u7cfb\u662f\u79d1\u5b66\u7406\u89e3\u548c\u6279\u5224\u6027\u601d\u7ef4\u7684\u57fa\u7840\u3002"}, {"en": "Maintaining a positive relation with your colleagues is essential for a productive work environment.", "cn": "\u4e0e\u540c\u4e8b\u4fdd\u6301\u79ef\u6781\u7684\u5173\u7cfb\u5bf9\u4e8e\u9ad8\u6548\u7684\u5de5\u4f5c\u73af\u5883\u81f3\u5173\u91cd\u8981\u3002"}]}, {"word": "shadow", "ipa": "/\u02c8\u0283\u00e6do\u028a/", "meanings": {"en": "A dark area or shape produced by a body coming between light and a surface.", "cn": "\u7269\u4f53\u6321\u4f4f\u5149\u7ebf\u800c\u5728\u8868\u9762\u4e0a\u4ea7\u751f\u7684\u9ed1\u6697\u533a\u57df\u6216\u5f62\u72b6\u3002"}, "usage_en": "Refers to the dark area created when light is blocked.", "usage_cn": "\u6307\u5149\u7ebf\u88ab\u963b\u6321\u65f6\u4ea7\u751f\u7684\u9ed1\u6697\u533a\u57df\u3002", "scene_en": "A person standing in the sun, casting a shadow on the ground.", "scene_cn": "\u4e00\u4e2a\u4eba\u7ad9\u5728\u9633\u5149\u4e0b\uff0c\u5728\u5730\u9762\u4e0a\u6295\u4e0b\u9634\u5f71\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q2_shadow_1.png", "P6_vocabulary_exercises_7_Q2_shadow_2.png"], "examples": [{"en": "The tall building cast a long shadow across the park as the sun began to set.", "cn": "\u592a\u9633\u5f00\u59cb\u843d\u5c71\u65f6\uff0c\u9ad8\u5927\u7684\u5efa\u7b51\u7269\u5728\u516c\u56ed\u91cc\u6295\u4e0b\u957f\u957f\u7684\u9634\u5f71\u3002"}, {"en": "He always seemed to live in the shadow of his older, more successful brother.", "cn": "\u4ed6\u4f3c\u4e4e\u603b\u662f\u751f\u6d3b\u5728\u4ed6\u66f4\u5e74\u957f\u3001\u66f4\u6210\u529f\u7684\u54e5\u54e5\u7684\u9634\u5f71\u4e0b\u3002"}]}, {"word": "reflection", "ipa": "/r\u026a\u02c8fl\u025bk\u0283\u0259n/", "meanings": {"en": "The throwing back by a body or surface of light, heat, or sound without absorbing it.", "cn": "\u7269\u4f53\u6216\u8868\u9762\u53cd\u5c04\u5149\u3001\u70ed\u6216\u58f0\u97f3\u800c\u4e0d\u5438\u6536\u5b83\u3002"}, "usage_en": "Describes the bouncing back of light or sound.", "usage_cn": "\u63cf\u8ff0\u5149\u6216\u58f0\u97f3\u7684\u53cd\u5c04\u3002", "scene_en": "A mirror showing a clear image of the person standing in front of it.", "scene_cn": "\u4e00\u9762\u955c\u5b50\u6e05\u6670\u5730\u663e\u793a\u7ad9\u5728\u5b83\u524d\u9762\u7684\u4eba\u7684\u56fe\u50cf\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q2_reflection_1.png", "P6_vocabulary_exercises_7_Q2_reflection_2.png"], "examples": [{"en": "The still lake provided a perfect reflection of the surrounding mountains and the clear blue sky.", "cn": "\u9759\u6b62\u7684\u6e56\u9762\u5b8c\u7f8e\u5730\u5012\u6620\u51fa\u5468\u56f4\u7684\u7fa4\u5c71\u548c\u851a\u84dd\u7684\u5929\u7a7a\u3002"}, {"en": "After the argument, she needed some time for reflection to understand her own feelings better.", "cn": "\u4e89\u5435\u4e4b\u540e\uff0c\u5979\u9700\u8981\u4e00\u4e9b\u65f6\u95f4\u53cd\u601d\uff0c\u4ee5\u4fbf\u66f4\u597d\u57 who.", "scene_cn": "\u4e24\u4e2a\u4e00\u6a21\u4e00\u6837\u7684\u53cc\u80de\u80ce\u5e76\u6392\u7ad9\u7740\uff0c\u6709\u4eba\u8bd5\u56fe\u5206\u8fa8\u51fa\u8c01\u662f\u8c01\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q3_tell_1.png", "P6_vocabulary_exercises_7_Q3_tell_2.png"], "examples": [{"en": "It's hard to tell the difference between these two brands of coffee beans.", "cn": "\u5f88\u96be\u533a\u5206\u8fd9\u4e24\u79cd\u54c1\u724c\u7684\u5496\u5561\u8c46\u4e4b\u95f4\u7684\u533a\u522b\u3002"}, {"en": "Can you tell which one is the original and which is the copy?", "cn": "\u4f60\u80fd\u5206\u8fa8\u51fa\u54ea\u4e2a\u662f\u539f\u4ef6\uff0c\u54ea\u4e2a\u662f\u590d\u5236\u54c1\u5417\uff1f"}]}, {"word": "pick", "ipa": "/p\u026ak/", "meanings": {"en": "Choose or select (someone or something) from a group.", "cn": "\u4ece\u4e00\u7ec4\u4e2d\u9009\u62e9\u6216\u6311\u9009\uff08\u67d0\u4eba\u6216\u67d0\u7269\uff09\u3002"}, "usage_en": "Used to select a specific item from a larger group.", "usage_cn": "\u7528\u4e8e\u4ece\u8f83\u5927\u7684\u7ec4\u4e2d\u9009\u62e9\u7279\u5b9a\u9879\u76ee\u3002", "scene_en": "A person choosing a ripe apple from a tree full of apples.", "scene_cn": "\u4e00\u4e2a\u4eba\u4ece\u4e00\u68f5\u6ee1\u662f\u82f9\u679c\u7684\u6811\u4e0a\u9009\u62e9\u4e00\u4e2a\u6210\u719f\u7684\u82f9\u679c\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q3_pick_1.png", "P6_vocabulary_exercises_7_Q3_pick_2.png"], "examples": [{"en": "She had to pick a partner for the project, and she chose him.", "cn": "\u5979\u5fc5\u987b\u4e3a\u8fd9\u4e2a\u9879\u76ee\u6311\u9009\u4e00\u4e2a\u4f19\u4f34\uff0c\u5979\u9009\u62e9\u4e86\u4ed6\u3002"}, {"en": "Please pick the best option from the list provided for the company's future.", "cn": "\u8bf7\u4ece\u63d0\u4f9b\u7684\u6e05\u5355\u4e2d\u9009\u62e9\u6700\u9002\u5408\u516c\u53f8\u672a\u6765\u7684\u9009\u9879\u3002"}]}, {"word": "make", "ipa": "/me\u026ak/", "meanings": {"en": "Create or construct (something).", "cn": "\u521b\u9020\u6216\u6784\u5efa\uff08\u67d0\u7269\uff09\u3002"}, "usage_en": "Used when referring to the creation of something new.", "usage_cn": "\u7528\u4e8e\u6307\u4ee3\u521b\u9020\u65b0\u4e8b\u7269\u3002", "scene_en": "A person crafting a clay pot on a pottery wheel.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u9676\u8f6e\u4e0a\u5236\u4f5c\u4e00\u4e2a\u9676\u7f50\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q3_make_1.png", "P6_vocabulary_exercises_7_Q3_make_2.png"], "examples": [{"en": "He decided to make a cake for his friend's birthday celebration this weekend.", "cn": "\u4ed6\u51b3\u5b9a\u4e3a\u4ed6\u670b\u53cb\u8fd9\u4e2a\u5468\u672b\u7684\u751f\u65e5\u5e86\u795d\u6d3b\u52a8\u505a\u4e00\u4e2a\u86cb\u7cd5\u3002"}, {"en": "The company aims to make a positive impact on the environment with its new policies.", "cn": "\u8be5\u516c\u53f8\u65e8\u5728\u901a\u8fc7\u5176\u65b0\u653f\u7b56\u5bf9\u73af\u5883\u4ea7\u751f\u79ef\u6781\u5f71\u54cd\u3002"}]}, {"word": "detect", "ipa": "/d\u026a\u02c8tekt/", "meanings": {"en": "Discover or notice something not easily noticed.", "cn": "\u53d1\u73b0\u6216\u6ce8\u610f\u5230\u4e0d\u5bb9\u6613\u88ab\u6ce8\u610f\u5230\u7684\u4e8b\u7269\u3002"}, "usage_en": "Used to find something subtle or hidden.", "usage_cn": "\u7528\u4e8e\u53d1\u73b0\u5fae\u5999\u6216\u9690\u85cf\u7684\u4e1c\u897f\u3002", "scene_en": "A scientist using equipment to detect a faint signal.", "scene_cn": "\u4e00\u4f4d\u79d1\u5b66\u5bb6\u4f7f\u7528\u8bbe\u5907\u6765\u68c0\u6d4b\u5fae\u5f31\u7684\u4fe1\u53f7\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q3_detect_1.png", "P6_vocabulary_exercises_7_Q3_detect_2.png"], "examples": [{"en": "The sensor can detect even the slightest movement in the dark of the night.", "cn": "\u8be5\u4f20\u611f\u5668\u751a\u81f3\u53ef\u4ee5\u68c0\u6d4b\u5230\u9ed1\u591c\u4e2d\u6700\u8f7b\u5fae\u7684\u79fb\u52a8\u3002"}, {"en": "She could detect a hint of sadness in his voice during their phone conversation.", "cn": "\u5728\u4ed6\u4eec\u7684\u7535\u8bdd\u4ea4\u8c08\u4e2d\uff0c\u5979\u80fd\u611f\u89c9\u5230\u4ed6\u58f0\u97f3\u4e2d\u6709\u4e00\u4e1d\u60b2\u4f24\u3002"}]}], "synonym_cn": "\u8fa8\u522b\uff0c\u533a\u5206\uff0c\u8bc6\u522b", "socratic_questions": [{"question": "In a noisy room, what verb describes successfully understanding a faint whisper?", "options": ["tell", "pick", "make", "detect"], "correct_answer": "detect", "explanation": "Detect means to discover or notice something not easily noticed."}, {"question": "If you need to select a specific item from a group, which verb would you use?", "options": ["tell", "pick", "make", "detect"], "correct_answer": "pick", "explanation": "Pick means to choose or select someone or something from a group."}, {"question": "What verb describes creating a cake from flour, eggs, and sugar?", "options": ["tell", "pick", "make", "detect"], "correct_answer": "make", "explanation": "Make means to create or construct something."}, {"question": "When you can't differentiate between two similar items, what verb describes the action you can't do?", "options": ["tell", "pick", "make", "detect"], "correct_answer": "tell", "explanation": "Tell means to distinguish or differentiate between two or more things."}]}, {"id": 4, "stem": "The movie 'Batman and Robin' is the ______ to 'Batman Forever'.", "correct_index": 1, "options": [{"word": "successor", "ipa": "/s\u0259k\u02c8ses\u0259r/", "meanings": {"en": "A person or thing that succeeds another.", "cn": "\u63a5\u66ff\u53e6\u4e00\u4e2a\u4eba\u6216\u4e8b\u7269\u7684\u4eba\u6216\u4e8b\u7269\u3002"}, "usage_en": "Often used in business, politics, or family inheritance contexts.", "usage_cn": "\u5e38\u7528\u4e8e\u5546\u4e1a\u3001\u653f\u6cbb\u6216\u5bb6\u5ead\u7ee7\u627f\u8bed\u5883\u3002", "scene_en": "A CEO handing over the company to the new CEO.", "scene_cn": "\u4e00\u4f4dCEO\u5c06\u516c\u53f8\u4ea4\u7ed9\u65b0\u4efbCEO\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q4_successor_1.png", "P6_vocabulary_exercises_7_Q4_successor_2.png"], "examples": [{"en": "He was appointed as the direct successor to the retiring CEO of the company.", "cn": "\u4ed6\u88ab\u4efb\u547d\u4e3a\u516c\u53f8\u5373\u5c06\u9000\u4f11\u7684\u9996\u5e2d\u6267\u884c\u5b98\u7684\u76f4\u63a5\u7ee7\u4efb\u8005\u3002"}, {"en": "The prince is the natural successor to the throne after his father's reign.", "cn": "\u738b\u5b50\u662f\u4ed6\u7236\u4eb2\u7edf\u6cbb\u4e4b\u540e\u738b\u4f4d\u7684\u5f53\u7136\u7ee7\u627f\u4eba\u3002"}]}, {"word": "sequel", "ipa": "/\u02c8si\u02d0kw\u0259l/", "meanings": {"en": "A published, broadcast, or recorded work that continues the story or develops the theme of an earlier one.", "cn": "\u5df2\u51fa\u7248\u3001\u5e7f\u64ad\u6216\u5f55\u5236\u7684\u4f5c\u54c1\uff0c\u5ef6\u7eed\u4e86\u5148\u524d\u4f5c\u54c1\u7684\u6545\u4e8b\u6216\u53d1\u5c55\u4e86\u4e3b\u9898\u3002"}, "usage_en": "Commonly used in the context of movies, books, and video games.", "usage_cn": "\u5e38\u7528\u4e8e\u7535\u5f71\u3001\u4e66\u7c4d\u548c\u89c6\u9891\u6e38\u620f\u7684\u8bed\u5883\u3002", "scene_en": "People lining up to watch the next installment of a movie franchise.", "scene_cn": "\u4eba\u4eec\u6392\u961f\u89c2\u770b\u7535\u5f71\u7cfb\u5217\u7684\u4e0b\u4e00\u90e8\u4f5c\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q4_sequel_1.png", "P6_vocabulary_exercises_7_Q4_sequel_2.png"], "examples": [{"en": "The sequel to the popular film was even more successful than the original.", "cn": "\u8fd9\u90e8\u70ed\u95e8\u7535\u5f71\u7684\u7eed\u96c6\u6bd4\u539f\u7248\u66f4\u6210\u529f\u3002"}, {"en": "She eagerly awaited the sequel to her favorite book series, released last month.", "cn": "\u5979\u6025\u5207\u5730\u7b49\u5f85\u7740\u5979\u6700\u559c\u6b22\u7684\u7cfb\u5217\u4e1b\u4e66\u7684\u7eed\u96c6\uff0c\u4e0a\u4e2a\u6708\u53d1\u884c\u4e86\u3002"}]}, {"word": "continuation", "ipa": "/k\u0259n\u02cct\u026anju\u02c8e\u026a\u0283\u0259n/", "meanings": {"en": "The action of carrying on something over a period of time; the process of continuing.", "cn": "\u5728\u4e00\u6bb5\u65f6\u95f4\u5185\u6301\u7eed\u8fdb\u884c\u67d0\u4e8b\u7684\u884c\u4e3a\uff1b\u6301\u7eed\u7684\u8fc7\u7a0b\u3002"}, "usage_en": "Used to describe something that extends or prolongs an activity or state.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5ef6\u957f\u6216\u5ef6\u957f\u6d3b\u52a8\u6216\u72b6\u6001\u7684\u4e8b\u7269\u3002", "scene_en": "A long road stretching into the distance, symbolizing a journey's continuation.", "scene_cn": "\u4e00\u6761\u5ef6\u4f38\u5230\u8fdc\u65b9\u7684\u957f\u8def\uff0c\u8c61\u5f81\u7740\u65c5\u7a0b\u7684\u5ef6\u7eed\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q4_continuation_1.png", "P6_vocabulary_exercises_7_Q4_continuation_2.png"], "examples": [{"en": "The continuation of the project depended on securing additional funding from investors.", "cn": "\u8be5\u9879\u76ee\u7684\u7ee7\u7eed\u53d6\u51b3\u4e8e\u4ece\u6295\u8d44\u8005\u90a3\u91cc\u83b7\u5f97\u989d\u5916\u7684\u8d44\u91d1\u3002"}, {"en": "The doctor recommended the continuation of the medication to manage her chronic condition.", "cn": "\u533b\u751f\u5efa\u8bae\u7ee7\u7eed\u670d\u836f\u4ee5\u63a7\u5236\u5979\u7684\u6162\u6027\u75c5\u3002"}]}, {"word": "chapter", "ipa": "/\u02c8t\u0283\u00e6pt\u0259r/", "meanings": {"en": "A main division of a book.", "cn": "\u4e66\u7684\u4e3b\u8981\u7ae0\u8282\u3002"}, "usage_en": "Refers to a section of a book or a significant period in history or life.", "usage_cn": "\u6307\u4e66\u4e2d\u7684\u4e00\u4e2a\u7ae0\u8282\u6216\u5386\u53f2\u6216\u751f\u6d3b\u4e2d\u7684\u91cd\u8981\u65f6\u671f\u3002", "scene_en": "A person reading a book, pausing at the end of a chapter.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u8bfb\u4e66\uff0c\u5728\u4e00\u7ae0\u7684\u7ed3\u5c3e\u505c\u987f\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q4_chapter_1.png", "P6_vocabulary_exercises_7_Q4_chapter_2.png"], "examples": [{"en": "Each chapter of the book explored a different aspect of ancient Roman history.", "cn": "\u672c\u4e66\u7684\u6bcf\u4e00\u7ae0\u90fd\u63a2\u8ba8\u4e86\u53e4\u7f57\u9a6c\u5386\u53f2\u7684\u4e0d\u540c\u65b9\u9762\u3002"}, {"en": "Closing that business was the end of one chapter in his entrepreneurial journey.", "cn": "\u5173\u95ed\u90a3\u5bb6\u516c\u53f8\u662f\u4ed6\u521b\u4e1a\u65c5\u7a0b\u4e2d\u4e00\u4e2a\u7ae0\u8282\u7684\u7ed3\u675f\u3002"}]}], "synonym_cn": "\u540e\u7eed\u4f5c\u54c1", "socratic_questions": [{"question": "If a new leader takes over a company after the previous one retires, what is the new leader called?", "options": ["successor", "sequel", "continuation", "chapter"], "correct_answer": "successor", "explanation": "A successor is someone who takes over a position or role after someone else."}, {"question": "If a book series releases a new book that follows the same characters and story, what is the new book called?", "options": ["successor", "sequel", "continuation", "chapter"], "correct_answer": "sequel", "explanation": "A sequel is a book, film, or game that continues the story of a previous one."}, {"question": "If a TV show is renewed for another season with the same storyline, what is the new season called?", "options": ["successor", "sequel", "continuation", "chapter"], "correct_answer": "continuation", "explanation": "A continuation is something that extends or prolongs something else."}, {"question": "What do you call one of the sections that a book is divided into?", "options": ["successor", "sequel", "continuation", "chapter"], "correct_answer": "chapter", "explanation": "A chapter is a main division of a book."}]}, {"id": 5, "stem": "You ought to take the ______ and apologise to Mary.", "correct_index": 1, "options": [{"word": "step", "ipa": "step", "meanings": {"en": "A stage in a process; an action or measure.", "cn": "\u8fc7\u7a0b\u4e2d\u7684\u4e00\u4e2a\u9636\u6bb5\uff1b\u4e00\u4e2a\u884c\u52a8\u6216\u63aa\u65bd\u3002"}, "usage_en": "Used to describe a stage in a process or a course of action.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u8fc7\u7a0b\u4e2d\u7684\u4e00\u4e2a\u9636\u6bb5\u6216\u884c\u52a8\u65b9\u6848\u3002", "scene_en": "A person climbing stairs, each stair representing a step in a process.", "scene_cn": "\u4e00\u4e2a\u4eba\u722c\u697c\u68af\uff0c\u6bcf\u4e2a\u697c\u68af\u4ee3\u8868\u8fc7\u7a0b\u4e2d\u7684\u4e00\u4e2a\u6b65\u9aa4\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q5_step_1.png", "P6_vocabulary_exercises_7_Q5_step_2.png"], "examples": [{"en": "Taking small steps each day will eventually lead to achieving your long-term goals.", "cn": "\u6bcf\u5929\u91c7\u53d6\u5c0f\u6b65\u9aa4\u6700\u7ec8\u5c06\u5bfc\u81f4\u5b9e\u73b0\u4f60\u7684\u957f\u671f\u76ee\u6807\u3002"}, {"en": "The first step in solving the problem is to identify the root cause.", "cn": "\u89e3\u51b3\u95ee\u9898\u7684\u7b2c\u4e00\u6b65\u662f\u786e\u5b9a\u6839\u672c\u539f\u56e0\u3002"}]}, {"word": "initiative", "ipa": "\u026a\u02c8n\u026a\u0283\u0259t\u026av", "meanings": {"en": "The ability to assess and start things independently.", "cn": "\u8bc4\u4f30\u5e76\u72ec\u7acb\u542f\u52a8\u4e8b\u60c5\u7684\u80fd\u529b\u3002"}, "usage_en": "Used to describe the act of taking the first step or starting something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u91c7\u53d6\u7b2c\u4e00\u6b65\u6216\u5f00\u59cb\u67d0\u4e8b\u7684\u884c\u4e3a\u3002", "scene_en": "A person launching a rocket, symbolizing taking the initiative.", "scene_cn": "\u4e00\u4e2a\u4eba\u53d1\u5c04\u706b\u7bad\uff0c\u8c61\u5f81\u7740\u91c7\u53d6\u4e3b\u52a8\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q5_initiative_1.png", "P6_vocabulary_exercises_7_Q5_initiative_2.png"], "examples": [{"en": "She showed great initiative by reorganizing the files without being asked to.", "cn": "\u5979\u901a\u8fc7\u91cd\u65b0\u7ec4\u7ec7\u6587\u4ef6\u800c\u65e0\u9700\u88ab\u8981\u6c42\uff0c\u8868\u73b0\u51fa\u4e86\u6781\u5927\u7684\u4e3b\u52a8\u6027\u3002"}, {"en": "Taking the initiative to learn a new skill can significantly boost your career.", "cn": "\u4e3b\u52a8\u5b66\u4e60\u4e00\u9879\u65b0\u6280\u80fd\u53ef\u4ee5\u663e\u8457\u63d0\u5347\u4f60\u7684\u804c\u4e1a\u751f\u6daf\u3002"}]}, {"word": "defence", "ipa": "d\u026a\u02c8fens", "meanings": {"en": "The action of protecting oneself or something else from attack.", "cn": "\u4fdd\u62a4\u81ea\u5df1\u6216\u67d0\u7269\u514d\u53d7\u653b\u51fb\u7684\u884c\u4e3a\u3002"}, "usage_en": "Used to describe the act of protecting or defending against something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4fdd\u62a4\u6216\u9632\u5fa1\u67d0\u7269\u7684\u884c\u4e3a\u3002", "scene_en": "A shield protecting a castle from arrows, representing defense.", "scene_cn": "\u4e00\u4e2a\u76fe\u724c\u4fdd\u62a4\u57ce\u5821\u514d\u53d7\u7bad\u7684\u653b\u51fb\uff0c\u4ee3\u8868\u9632\u5fa1\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q5_defence_1.png", "P6_vocabulary_exercises_7_Q5_defence_2.png"], "examples": [{"en": "The country's strong military defence protects it from external threats and potential invasions.", "cn": "\u8be5\u56fd\u5f3a\u5927\u7684\u519b\u4e8b\u9632\u5fa1\u4fdd\u62a4\u5b83\u514d\u53d7\u5916\u90e8\u5a01\u80c1\u548c\u6f5c\u5728\u5165\u4fb5\u3002"}, {"en": "A good lawyer will provide a strong defence for their client in court.", "cn": "\u4e00\u4f4d\u4f18\u79c0\u7684\u5f8b\u5e08\u5c06\u5728\u6cd5\u5ead\u4e0a\u4e3a\u4ed6\u4eec\u7684\u5ba2\u6237\u63d0\u4f9b\u5f3a\u6709\u529b\u7684\u8fa9\u62a4\u3002"}]}, {"word": "trouble", "ipa": "\u02c8tr\u028cbl", "meanings": {"en": "Difficulty or problems.", "cn": "\u56f0\u96be\u6216\u95ee\u9898\u3002"}, "usage_en": "Used to describe a situation that causes difficulty or problems.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f15\u8d77\u56f0\u96be\u6216\u95ee\u9898\u7684\u60c5\u51b5\u3002", "scene_en": "A car stuck in mud, representing trouble.", "scene_cn": "\u4e00\u8f86\u9677\u5728\u6ce5\u91cc\u7684\u6c7d\u8f66\uff0c\u4ee3\u8868\u9ebb\u70e6\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q5_trouble_1.png", "P6_vocabulary_exercises_7_Q5_trouble_2.png"], "examples": [{"en": "If you don't follow the instructions carefully, you might run into some serious trouble.", "cn": "\u5982\u679c\u4f60\u4e0d\u4ed4\u7ec6\u6309\u7167\u8bf4\u660e\u64cd\u4f5c\uff0c\u4f60\u53ef\u80fd\u4f1a\u9047\u5230\u4e00\u4e9b\u4e25\u91cd\u7684\u9ebb\u70e6\u3002"}, {"en": "The heavy rain caused a lot of trouble for commuters during the morning rush hour.", "cn": "\u5927\u96e8\u7ed9\u65e9\u9ad8\u5cf0\u671f\u95f4\u7684\u901a\u52e4\u8005\u5e26\u6765\u4e86\u5f88\u591a\u9ebb\u70e6\u3002"}]}], "synonym_cn": "\u884c\u52a8, \u4e3b\u52a8\u6027, \u6b65\u9aa4 (all relate to starting something)", "socratic_questions": [{"question": "If you consistently defend your mistakes instead of admitting them, what are you creating?", "options": ["step", "initiative", "defence", "trouble"], "correct_answer": "defence", "explanation": "Consistently defending mistakes creates a pattern of defensiveness."}, {"question": "If you are always causing problems for others, what are you creating for them?", "options": ["step", "initiative", "defence", "trouble"], "correct_answer": "trouble", "explanation": "Causing problems for others creates trouble for them."}, {"question": "To start a new project, what must you take?", "options": ["step", "initiative", "defence", "trouble"], "correct_answer": "initiative", "explanation": "Taking the initiative means starting a new project or task."}, {"question": "What is the first thing you must do to solve a problem?", "options": ["step", "initiative", "defence", "trouble"], "correct_answer": "step", "explanation": "The first step is the initial action to solve a problem."}]}, {"id": 7, "stem": "Things are already bad enough as it is, please don't add ______ to fire.", "correct_index": 3, "options": [{"word": "oil", "ipa": "/\u0254\u026al/", "meanings": {"en": "A viscous liquid derived from petroleum, used as a fuel or lubricant.", "cn": "\u4e00\u79cd\u4ece\u77f3\u6cb9\u4e2d\u63d0\u53d6\u7684\u7c98\u7a20\u6db2\u4f53\uff0c\u7528\u4f5c\u71c3\u6599\u6216\u6da6\u6ed1\u5242\u3002"}, "usage_en": "Used to exacerbate a situation, making it worse.", "usage_cn": "\u7528\u4e8e\u52a0\u5267\u60c5\u51b5\uff0c\u4f7f\u5176\u53d8\u5f97\u66f4\u7cdf\u3002", "scene_en": "A person pouring oil onto a fire, causing it to grow larger and more intense.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c06\u6cb9\u5012\u5728\u706b\u4e0a\uff0c\u5bfc\u81f4\u706b\u52bf\u53d8\u5f97\u66f4\u5927\u66f4\u731b\u70c8\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q7_oil_1.png", "P6_vocabulary_exercises_7_Q7_oil_2.png"], "examples": [{"en": "His constant complaining only added oil to the fire of their already tense relationship.", "cn": "\u4ed6\u4e0d\u505c\u7684\u62b1\u6028\u53ea\u4f1a\u706b\u4e0a\u6d47\u6cb9\uff0c\u4f7f\u4ed6\u4eec\u672c\u5df2\u7d27\u5f20\u7684\u5173\u7cfb\u66f4\u52a0\u6076\u5316\u3002"}, {"en": "The inflammatory article added oil to the fire of public discontent with the government.", "cn": "\u8fd9\u7bc7\u717d\u52a8\u6027\u7684\u6587\u7ae0\u706b\u4e0a\u6d47\u6cb9\uff0c\u52a0\u5267\u4e86\u516c\u4f17\u5bf9\u653f\u5e9c\u7684\u4e0d\u6ee1\u3002"}]}, {"word": "petrol", "ipa": "/\u02c8petr\u0259l/", "meanings": {"en": "A light, volatile flammable liquid used as fuel for internal combustion engines.", "cn": "\u4e00\u79cd\u8f7b\u8d28\u3001\u6613\u6325\u53d1\u7684\u6613\u71c3\u6db2\u4f53\uff0c\u7528\u4f5c\u5185\u71c3\u673a\u7684\u71c3\u6599\u3002"}, "usage_en": "Similar to 'oil', but often implies a more rapid and explosive escalation.", "usage_cn": "\u7c7b\u4f3c\u4e8e\u201c\u6cb9\u201d\uff0c\u4f46\u901a\u5e38\u610f\u5473\u7740\u66f4\u5feb\u901f\u548c\u7206\u70b8\u6027\u7684\u5347\u7ea7\u3002", "scene_en": "A person pouring petrol onto a small flame, resulting in a sudden burst of fire.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c06\u6c7d\u6cb9\u5012\u5728\u5c0f\u706b\u7130\u4e0a\uff0c\u5bfc\u81f4\u706b\u7130\u7a81\u7136\u7206\u53d1\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q7_petrol_1.png", "P6_vocabulary_exercises_7_Q7_petrol_2.png"], "examples": [{"en": "Spreading rumors about the scandal only added petrol to the fire of public outrage.", "cn": "\u6563\u5e03\u5173\u4e8e\u4e11\u95fb\u7684\u8c23\u8a00\u53ea\u4f1a\u706b\u4e0a\u6d47\u6cb9\uff0c\u52a0\u5267\u516c\u4f17\u7684\u6124\u6012\u3002"}, {"en": "His aggressive comments added petrol to the fire of the already heated debate.", "cn": "\u4ed6\u5177\u6709\u653b\u51fb\u6027\u7684\u8a00\u8bba\u706b\u4e0a\u6d47\u6cb9\uff0c\u52a0\u5267\u4e86\u672c\u5df2\u6fc0\u70c8\u7684\u8fa9\u8bba\u3002"}]}, {"word": "fuel", "ipa": "/\u02c8fju\u02d0\u0259l/", "meanings": {"en": "Material that releases energy when it burns or undergoes nuclear fission or fusion.", "cn": "\u71c3\u70e7\u6216\u7ecf\u5386\u6838\u88c2\u53d8\u6216\u805a\u53d8\u65f6\u91ca\u653e\u80fd\u91cf\u7684\u6750\u6599\u3002"}, "usage_en": "To intensify or worsen a situation, often over a longer period.", "usage_cn": "\u52a0\u5267\u6216\u6076\u5316\u4e00\u79cd\u60c5\u51b5\uff0c\u901a\u5e38\u5728\u8f83\u957f\u4e00\u6bb5\u65f6\u95f4\u5185\u3002", "scene_en": "A pile of fuel being added to a large bonfire, sustaining the flames.", "scene_cn": "\u5c06\u4e00\u5806\u71c3\u6599\u6dfb\u52a0\u5230\u5927\u578b\u7bdd\u706b\u4e2d\uff0c\u7ef4\u6301\u706b\u7130\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q7_fuel_1.png", "P6_vocabulary_exercises_7_Q7_fuel_2.png"], "examples": [{"en": "The politician's divisive rhetoric only added fuel to the fire of social unrest.", "cn": "\u8fd9\u4f4d\u653f\u5ba2\u5206\u88c2\u6027\u7684\u8a00\u8bba\u53ea\u4f1a\u706b\u4e0a\u6d47\u6cb9\uff0c\u52a0\u5267\u793e\u4f1a\u52a8\u8361\u3002"}, {"en": "Ignoring the problem will only add fuel to the fire, making it harder to resolve.", "cn": "\u5ffd\u89c6\u8fd9\u4e2a\u95ee\u9898\u53ea\u4f1a\u706b\u4e0a\u6d47\u6cb9\uff0c\u4f7f\u5176\u66f4\u96be\u89e3\u51b3\u3002"}]}, {"word": "water", "ipa": "/\u02c8w\u0254\u02d0t\u0259r/", "meanings": {"en": "A colorless, transparent, odorless liquid that forms the seas, lakes, rivers, and rain.", "cn": "\u4e00\u79cd\u65e0\u8272\u3001\u900f\u660e\u3001\u65e0\u5473\u7684\u6db2\u4f53\uff0c\u5f62\u6210\u6d77\u6d0b\u3001\u6e56\u6cca\u3001\u6cb3\u6d41\u548c\u96e8\u6c34\u3002"}, "usage_en": "To calm or resolve a situation; the opposite of exacerbating it.", "usage_cn": "\u5e73\u606f\u6216\u89e3\u51b3\u4e00\u79cd\u60c5\u51b5\uff1b\u4e0e\u52a0\u5267\u60c5\u51b5\u76f8\u53cd\u3002", "scene_en": "A person pouring water on a fire, extinguishing the flames.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c06\u6c34\u5012\u5728\u706b\u4e0a\uff0c\u7184\u706d\u706b\u7130\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q7_water_1.png", "P6_vocabulary_exercises_7_Q7_water_2.png"], "examples": [{"en": "Instead of arguing, try to add water to the fire by listening and understanding.", "cn": "\u4e0e\u5176\u4e89\u5435\uff0c\u4e0d\u5982\u8bd5\u7740\u503e\u542c\u548c\u7406\u89e3\uff0c\u4ece\u800c\u5e73\u606f\u4e8b\u6001\u3002"}, {"en": "Mediation can add water to the fire of a conflict, helping both sides find common ground.", "cn": "\u8c03\u89e3\u53ef\u4ee5\u5e73\u606f\u51b2\u7a81\uff0c\u5e2e\u52a9\u53cc\u65b9\u627e\u5230\u5171\u540c\u70b9\u3002"}]}], "synonym_cn": "\u706b\u4e0a\u6d47\u6cb9 (hu\u01d2 sh\u00e0ng ji\u0101o y\u00f3u) vs. \u706b\u4e0a\u6d47\u6c7d\u6cb9 (hu\u01d2 sh\u00e0ng ji\u0101o q\u00ecy\u00f3u) vs. \u706b\u4e0a\u6d47\u71c3\u6599 (hu\u01d2 sh\u00e0ng ji\u0101o r\u00e1nli\u00e0o) vs. \u96ea\u4e0a\u52a0\u971c (xu\u011b sh\u00e0ng ji\u0101 shu\u0101ng)", "socratic_questions": [{"question": "If a company is already facing financial losses, would laying off employees be adding ______ to the fire?", "options": ["oil", "petrol", "fuel", "water"], "correct_answer": "oil", "explanation": "Adding 'oil' to the fire means making a bad situation even worse."}, {"question": "If a protest is already heated, would throwing Molotov cocktails be adding ______ to the fire?", "options": ["oil", "petrol", "fuel", "water"], "correct_answer": "petrol", "explanation": "Adding 'petrol' to the fire implies escalating a dangerous situation rapidly."}, {"question": "If a political crisis is worsening, would foreign intervention be adding ______ to the fire?", "options": ["oil", "petrol", "fuel", "water"], "correct_answer": "fuel", "explanation": "Adding 'fuel' to the fire means intensifying an already volatile situation."}, {"question": "If a relationship is strained, would open communication and compromise be adding ______ to the fire?", "options": ["oil", "petrol", "fuel", "water"], "correct_answer": "water", "explanation": "Adding 'water' to the fire means to calm or resolve a situation, the opposite of worsening it."}]}, {"id": 8, "stem": "Many times we are ______ to do things that we do not like.", "correct_index": 0, "options": [{"word": "compelled", "ipa": "/k\u0259m\u02c8peld/", "meanings": {"en": "Forced or obliged to do something.", "cn": "\u88ab\u8feb\u6216\u4e0d\u5f97\u4e0d\u505a\u67d0\u4e8b\u3002"}, "usage_en": "Used when someone is forced to do something against their will.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u88ab\u8feb\u505a\u67d0\u4e8b\uff0c\u8fdd\u80cc\u4ed6\u4eec\u7684\u610f\u613f\u65f6\u3002", "scene_en": "A person reluctantly signing a contract under pressure.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u538b\u529b\u4e0b\u4e0d\u60c5\u613f\u5730\u7b7e\u7f72\u5408\u540c\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q8_compelled_1.png", "P6_vocabulary_exercises_7_Q8_compelled_2.png"], "examples": [{"en": "The heavy rain compelled us to cancel our picnic at the park today.", "cn": "\u5927\u96e8\u8feb\u4f7f\u6211\u4eec\u53d6\u6d88\u4e86\u4eca\u5929\u5728\u516c\u56ed\u7684\u91ce\u9910\u3002"}, {"en": "Financial difficulties compelled the family to sell their beloved old family home.", "cn": "\u7ecf\u6d4e\u56f0\u96be\u8feb\u4f7f\u8fd9\u5bb6\u4eba\u5356\u6389\u4e86\u4ed6\u4eec\u5fc3\u7231\u7684\u8001\u623f\u5b50\u3002"}]}, {"word": "instructed", "ipa": "/\u026an\u02c8str\u028ckt\u026ad/", "meanings": {"en": "Given instructions or orders.", "cn": "\u7ed9\u51fa\u6307\u793a\u6216\u547d\u4ee4\u3002"}, "usage_en": "Used when someone is given specific instructions or orders to follow.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u88ab\u7ed9\u4e88\u660e\u786e\u7684\u6307\u793a\u6216\u547d\u4ee4\u53bb\u9075\u5faa\u65f6\u3002", "scene_en": "A teacher giving instructions to students in a classroom.", "scene_cn": "\u8001\u5e08\u5728\u6559\u5ba4\u91cc\u7ed9\u5b66\u751f\u4eec\u6307\u793a\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q8_instructed_1.png", "P6_vocabulary_exercises_7_Q8_instructed_2.png"], "examples": [{"en": "The manual instructed users to install the software before connecting the hardware components.", "cn": "\u8be5\u624b\u518c\u6307\u793a\u7528\u6237\u5728\u8fde\u63a5\u786c\u4ef6\u7ec4\u4ef6\u4e4b\u524d\u5b89\u88c5\u8f6f\u4ef6\u3002"}, {"en": "The officer instructed the soldiers to hold their positions until further notice arrived soon.", "cn": "\u519b\u5b98\u6307\u793a\u58eb\u5175\u4eec\u575a\u5b88\u9635\u5730\uff0c\u76f4\u5230\u8fdb\u4e00\u6b65\u7684\u901a\u77e5\u5f88\u5feb\u5230\u8fbe\u3002"}]}, {"word": "persuaded", "ipa": "/p\u0259r\u02c8swe\u026ad\u026ad/", "meanings": {"en": "Caused (someone) to do something through reasoning or argument.", "cn": "\u901a\u8fc7\u63a8\u7406\u6216\u8bba\u8bc1\u4f7f\uff08\u67d0\u4eba\uff09\u505a\u67d0\u4e8b\u3002"}, "usage_en": "Used when someone is convinced to do something through reasoning.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u901a\u8fc7\u63a8\u7406\u88ab\u8bf4\u670d\u505a\u67d0\u4e8b\u65f6\u3002", "scene_en": "A salesperson persuading a customer to buy a product.", "scene_cn": "\u9500\u552e\u4eba\u5458\u8bf4\u670d\u987e\u5ba2\u8d2d\u4e70\u4ea7\u54c1\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q8_persuaded_1.png", "P6_vocabulary_exercises_7_Q8_persuaded_2.png"], "examples": [{"en": "She persuaded her friend to try the new Italian restaurant downtown last weekend together.", "cn": "\u5979\u8bf4\u670d\u5979\u7684\u670b\u53cb\u4e0a\u5468\u672b\u4e00\u8d77\u53bb\u5e02\u4e2d\u5fc3\u7684\u65b0\u610f\u5927\u5229\u9910\u5385\u5c1d\u8bd5\u4e00\u4e0b\u3002"}, {"en": "The charity worker persuaded many people to donate to their cause by sharing stories.", "cn": "\u6148\u5584\u5de5\u4f5c\u8005\u901a\u8fc7\u5206\u4eab\u6545\u4e8b\u8bf4\u670d\u8bb8\u591a\u4eba\u6350\u6b3e\u7ed9\u4ed6\u4eec\u7684\u4e8b\u4e1a\u3002"}]}, {"word": "provoked", "ipa": "/pr\u0259\u02c8vo\u028akt/", "meanings": {"en": "Stimulated or gave rise to (a reaction or emotion, typically a strong or unwelcome one) in someone.", "cn": "\u5728\u67d0\u4eba\u8eab\u4e0a\u523a\u6fc0\u6216\u5f15\u8d77\uff08\u4e00\u79cd\u53cd\u5e94\u6216\u60c5\u7eea\uff0c\u901a\u5e38\u662f\u5f3a\u70c8\u6216\u4e0d\u53d7\u6b22\u8fce\u7684\u60c5\u7eea\uff09\u3002"}, "usage_en": "Used when someone or something causes a strong reaction, often negative.", "usage_cn": "\u7528\u4e8e\u67d0\u4eba\u6216\u67d0\u4e8b\u5f15\u8d77\u5f3a\u70c8\u53cd\u5e94\u65f6\uff0c\u901a\u5e38\u662f\u8d1f\u9762\u7684\u3002", "scene_en": "A person being provoked by an insult during an argument.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u4e89\u5435\u4e2d\u53d7\u5230\u4fae\u8fb1\u800c\u53d7\u5230\u6311\u8845\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q8_provoked_1.png", "P6_vocabulary_exercises_7_Q8_provoked_2.png"], "examples": [{"en": "His rude comments provoked an angry response from the audience during the presentation.", "cn": "\u4ed6\u5728\u6f14\u8bb2\u4e2d\u7c97\u9c81\u7684\u8bc4\u8bba\u5f15\u8d77\u4e86\u89c2\u4f17\u7684\u6124\u6012\u56de\u5e94\u3002"}, {"en": "The government's new policies provoked widespread protests across the entire country recently.", "cn": "\u653f\u5e9c\u7684\u65b0\u653f\u7b56\u6700\u8fd1\u5728\u5168\u56fd\u8303\u56f4\u5185\u5f15\u53d1\u4e86\u5e7f\u6cdb\u7684\u6297\u8bae\u6d3b\u52a8\u3002"}]}], "synonym_cn": "\u88ab\u8feb, \u6307\u793a, \u8bf4\u670d, \u6fc0\u6012", "socratic_questions": [{"question": "If your boss demands you work overtime against your will, are you being?", "options": ["compelled", "instructed", "persuaded", "provoked"], "correct_answer": "compelled", "explanation": "Compelled means forced or obliged to do something."}, {"question": "When a teacher gives you homework, are you being?", "options": ["compelled", "instructed", "persuaded", "provoked"], "correct_answer": "instructed", "explanation": "Instructed means given directions or orders."}, {"question": "If a friend convinces you to try a new restaurant, are you being?", "options": ["compelled", "instructed", "persuaded", "provoked"], "correct_answer": "persuaded", "explanation": "Persuaded means convinced to do something."}, {"question": "If someone insults you and you become angry, are you being?", "options": ["compelled", "instructed", "persuaded", "provoked"], "correct_answer": "provoked", "explanation": "Provoked means stimulated or incited to do something, often anger."}]}, {"id": 9, "stem": "It is ______ from his facial expression that he is in great pain.", "correct_index": 0, "options": [{"word": "apparent", "ipa": "/\u0259\u02c8p\u00e6r\u0259nt/", "meanings": {"en": "Clearly visible or understood; obvious.", "cn": "\u6e05\u6670\u53ef\u89c1\u6216\u53ef\u7406\u89e3\u7684\uff1b\u660e\u663e\u7684\u3002"}, "usage_en": "Used to describe something that is easily seen or understood.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5bb9\u6613\u770b\u5230\u6216\u7406\u89e3\u7684\u4e8b\u7269\u3002", "scene_en": "A sunny day with clear blue skies.", "scene_cn": "\u9633\u5149\u660e\u5a9a\uff0c\u5929\u7a7a\u851a\u84dd\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q9_apparent_1.png", "P6_vocabulary_exercises_7_Q9_apparent_2.png"], "examples": [{"en": "It became apparent that the project would require more funding than initially anticipated.", "cn": "\u5f88\u660e\u663e\uff0c\u8fd9\u4e2a\u9879\u76ee\u9700\u8981\u7684\u8d44\u91d1\u6bd4\u6700\u521d\u9884\u671f\u7684\u8981\u591a\u3002"}, {"en": "The reasons for his sudden departure were not immediately apparent to his colleagues.", "cn": "\u4ed6\u7a81\u7136\u79bb\u5f00\u7684\u539f\u56e0\u5bf9\u4ed6\u7684\u540c\u4e8b\u6765\u8bf4\u5e76\u4e0d\u660e\u663e\u3002"}]}, {"word": "shown", "ipa": "/\u0283o\u028an/", "meanings": {"en": "Displayed or made visible.", "cn": "\u5c55\u793a\u6216\u4f7f\u53ef\u89c1\u3002"}, "usage_en": "Used to describe something that has been presented or revealed.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5df2\u7ecf\u5448\u73b0\u6216\u63ed\u793a\u7684\u4e8b\u7269\u3002", "scene_en": "A movie theater showing a new film.", "scene_cn": "\u4e00\u5bb6\u7535\u5f71\u9662\u6b63\u5728\u4e0a\u6620\u4e00\u90e8\u65b0\u7535\u5f71\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q9_shown_1.png", "P6_vocabulary_exercises_7_Q9_shown_2.png"], "examples": [{"en": "The data shown in the graph clearly indicates a significant increase in sales figures.", "cn": "\u56fe\u8868\u4e2d\u663e\u793a\u7684\u6570\u636e\u6e05\u695a\u5730\u8868\u660e\u9500\u552e\u989d\u663e\u8457\u589e\u52a0\u3002"}, {"en": "The artist's latest exhibition has shown a remarkable evolution in his creative style.", "cn": "\u8fd9\u4f4d\u827a\u672f\u5bb6\u7684\u6700\u65b0\u5c55\u89c8\u663e\u793a\u4e86\u4ed6\u7684\u521b\u4f5c\u98ce\u683c\u53d1\u751f\u4e86\u663e\u8457\u7684\u6f14\u53d8\u3002"}]}, {"word": "drawn", "ipa": "/dr\u0254\u02d0n/", "meanings": {"en": "Having had (something) pulled or dragged.", "cn": "\u5df2\u7ecf\uff08\u67d0\u7269\uff09\u88ab\u62c9\u6216\u62d6\u52a8\u3002"}, "usage_en": "Used to describe something that has been pulled or extracted.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5df2\u88ab\u62c9\u52a8\u6216\u63d0\u53d6\u7684\u4e8b\u7269\u3002", "scene_en": "A well with a bucket being drawn up.", "scene_cn": "\u4e00\u53e3\u4e95\uff0c\u6c34\u6876\u88ab\u62c9\u4e0a\u6765\u3002", "image_paths": ["P6_vocabulary_exercises_7_Q9_drawn_1.png", "P6_vocabulary_exercises_7_Q9_drawn_2.png"], "examples": [{"en": "A conclusion can be drawn from the evidence presented during the investigation process.", "cn": "\u53ef\u4
