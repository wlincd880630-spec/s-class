.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7269\u4f53\u6216\u5efa\u7b51\u7684\u7ed3\u6784\u652f\u6491\u3002", "scene_en": "The wooden frame of a house under construction, showing the basic structure.", "scene_cn": "\u6b63\u5728\u5efa\u9020\u7684\u623f\u5c4b\u7684\u6728\u5236\u6846\u67b6\uff0c\u663e\u793a\u4e86\u57fa\u672c\u7ed3\u6784\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q1_frame_1.png", "P6_vocabulary_exercises_16_Q1_frame_2.png"], "examples": [{"en": "The bicycle's lightweight frame made it easy to handle on the steep, winding mountain trails.", "cn": "\u81ea\u884c\u8f66\u8f7b\u5de7\u7684\u8f66\u67b6\u4f7f\u5176\u5728\u9661\u5ced\u873f\u8712\u7684\u5c71\u8def\u4e0a\u6613\u4e8e\u64cd\u63a7\u3002"}, {"en": "The artist carefully selected a frame to complement the colors and style of her painting.", "cn": "\u827a\u672f\u5bb6\u7cbe\u5fc3\u6311\u9009\u4e86\u4e00\u4e2a\u6846\u67b6\uff0c\u4ee5\u886c\u6258\u5979\u753b\u4f5c\u7684\u989c\u8272\u548c\u98ce\u683c\u3002"}]}, {"word": "structure", "ipa": "/\u02c8str\u028ckt\u0283\u0259r/", "meanings": {"en": "The arrangement of parts in a complex entity; the organization of something.", "cn": "\u590d\u6742\u5b9e\u4f53\u4e2d\u5404\u90e8\u5206\u7684\u6392\u5217\uff1b\u67d0\u7269\u7684\u7ec4\u7ec7\u3002"}, "usage_en": "Used to describe the way something is organized or built.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u7269\u7684\u7ec4\u7ec7\u6216\u6784\u5efa\u65b9\u5f0f\u3002", "scene_en": "The complex structure of a skyscraper, showing its many floors and levels.", "scene_cn": "\u6469\u5929\u5927\u697c\u7684\u590d\u6742\u7ed3\u6784\uff0c\u663e\u793a\u4e86\u5b83\u7684\u8bb8\u591a\u697c\u5c42\u548c\u5c42\u7ea7\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q1_structure_1.png", "P6_vocabulary_exercises_16_Q1_structure_2.png"], "examples": [{"en": "The company's hierarchical structure ensures clear lines of communication and efficient decision-making processes overall.", "cn": "\u516c\u53f8\u7b49\u7ea7\u7ed3\u6784\u786e\u4fdd\u4e86\u6e05\u6670\u7684\u6c9f\u901a\u6e20\u9053\u548c\u9ad8\u6548\u7684\u51b3\u7b56\u8fc7\u7a0b\u3002"}, {"en": "The bridge's innovative structure allowed it to span the wide river without any central supports.", "cn": "\u8fd9\u5ea7\u6865\u6881\u7684\u521b\u65b0\u7ed3\u6784\u4f7f\u5176\u80fd\u591f\u8de8\u8d8a\u5bbd\u9614\u7684\u6cb3\u6d41\uff0c\u800c\u65e0\u9700\u4efb\u4f55\u4e2d\u592e\u652f\u6491\u3002"}]}, {"word": "outlook", "ipa": "/\u02c8a\u028atl\u028ak/", "meanings": {"en": "A person's point of view or general attitude to life.", "cn": "\u4e00\u4e2a\u4eba\u7684\u89c2\u70b9\u6216\u5bf9\u751f\u6d3b\u7684\u603b\u4f53\u6001\u5ea6\u3002"}, "usage_en": "Used to describe someone's perspective or forecast.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u67d0\u4eba\u7684\u89c2\u70b9\u6216\u9884\u6d4b\u3002", "scene_en": "A person looking out over a scenic landscape, contemplating their future outlook.", "scene_cn": "\u4e00\u4e2a\u4eba\u773a\u671b\u7740\u98ce\u666f\u5982\u753b\u7684\u666f\u8272\uff0c\u601d\u8003\u7740\u4ed6\u4eec\u672a\u6765\u7684\u524d\u666f\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q1_outlook_1.png", "P6_vocabulary_exercises_16_Q1_outlook_2.png"], "examples": [{"en": "Despite facing many challenges, she maintained a positive outlook and never lost her hope.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u8bb8\u591a\u6311\u6218\uff0c\u5979\u4ecd\u7136\u4fdd\u6301\u7740\u79ef\u6781\u7684\u5c55\u671b\uff0c\u4ece\u672a\u5931\u53bb\u5e0c\u671b\u3002"}, {"en": "The economic outlook for the next quarter is uncertain due to global market fluctuations currently.", "cn": "\u7531\u4e8e\u5168\u7403\u5e02\u573a\u6ce2\u52a8\uff0c\u4e0b\u4e00\u5b63\u5ea6\u7684\u7ecf\u6d4e\u524d\u666f\u5c1a\u4e0d\u660e\u6717\u3002"}]}], "synonym_cn": "\u4f53\u6001\uff0c\u8eab\u6bb5\uff0c\u5916\u5f62", "socratic_questions": [{"question": "If someone is admired for their graceful movements and overall appearance, which word best describes what they possess?", "options": ["figure", "frame", "structure", "outlook"], "correct_answer": "figure", "explanation": "A 'figure' refers to the overall impression created by someone's body shape and posture."}, {"question": "Which word best describes the basic skeletal support of a building or a person?", "options": ["figure", "frame", "structure", "outlook"], "correct_answer": "frame", "explanation": "A 'frame' is the essential supporting skeleton of something, whether a building or a body."}, {"question": "If you're discussing the arrangement of parts in a complex system, which word is most appropriate?", "options": ["figure", "frame", "structure", "outlook"], "correct_answer": "structure", "explanation": "'Structure' refers to the way parts of something are arranged or organized."}, {"question": "When describing someone's general attitude or perspective on life, which word is most suitable?", "options": ["figure", "frame", "structure", "outlook"], "correct_answer": "outlook", "explanation": "'Outlook' refers to a person's point of view or general attitude towards life."}]}, {"id": 2, "stem": "Mr Tan often _____ his sons in public, saying that they are useless.", "correct_index": 1, "options": [{"word": "begrudge", "ipa": "/b\u026a\u02c8\u0261r\u028cd\u0292/", "meanings": {"en": "To envy someone for possessing or enjoying something; to give reluctantly or resentfully.", "cn": "\u56e0\u67d0\u4eba\u62e5\u6709\u6216\u4eab\u53d7\u67d0\u4e8b\u7269\u800c\u5ac9\u5992\uff1b\u4e0d\u60c5\u613f\u6216\u6028\u6068\u5730\u7ed9\u4e88\u3002"}, "usage_en": "Used to express resentment or reluctance towards someone else's possessions or enjoyment.", "usage_cn": "\u7528\u4e8e\u8868\u8fbe\u5bf9\u4ed6\u4eba\u8d22\u4ea7\u6216\u4eab\u53d7\u7684\u6028\u6068\u6216\u4e0d\u60c5\u613f\u3002", "scene_en": "A person watching someone else enjoy a luxury vacation, feeling envious and resentful.", "scene_cn": "\u4e00\u4e2a\u4eba\u770b\u7740\u53e6\u4e00\u4e2a\u4eba\u4eab\u53d7\u8c6a\u534e\u5047\u671f\uff0c\u611f\u5230\u7fa1\u6155\u548c\u6028\u6068\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q2_begrudge_1.png", "P6_vocabulary_exercises_16_Q2_begrudge_2.png"], "examples": [{"en": "She began to begrudge him his fame and fortune after his sudden success.", "cn": "\u5728\u4ed6\u7a81\u7136\u6210\u529f\u540e\uff0c\u5979\u5f00\u59cb\u5ac9\u5992\u4ed6\u7684\u540d\u58f0\u548c\u8d22\u5bcc\u3002"}, {"en": "I don't begrudge her the promotion; she worked hard to earn it.", "cn": "\u6211\u4e0d\u5ac9\u5992\u5979\u5347\u804c\uff1b\u5979\u52aa\u529b\u5de5\u4f5c\u624d\u5f97\u5230\u5b83\u3002"}]}, {"word": "belittles", "ipa": "/b\u026a\u02c8l\u026at\u0259lz/", "meanings": {"en": "To make someone or something seem unimportant or less impressive; to disparage.", "cn": "\u4f7f\u67d0\u4eba\u6216\u67d0\u4e8b\u663e\u5f97\u4e0d\u91cd\u8981\u6216\u4e0d\u90a3\u4e48\u4ee4\u4eba\u5370\u8c61\u6df1\u523b\uff1b\u8d2c\u4f4e\u3002"}, "usage_en": "Used to describe the act of diminishing the importance or value of someone or something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u51cf\u5c11\u67d0\u4eba\u6216\u67d0\u7269\u7684\u91cd\u8981\u6027\u6216\u4ef7\u503c\u7684\u884c\u4e3a\u3002", "scene_en": "A person making sarcastic remarks to undermine someone's achievements in a meeting.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u4f1a\u8bae\u4e0a\u53d1\u8868\u8bbd\u523a\u8a00\u8bba\u4ee5\u7834\u574f\u67d0\u4eba\u7684\u6210\u5c31\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q2_belittles_1.png", "P6_vocabulary_exercises_16_Q2_belittles_2.png"], "examples": [{"en": "He constantly belittles her efforts, making her feel inadequate and unappreciated.", "cn": "\u4ed6\u4e0d\u65ad\u8d2c\u4f4e\u5979\u7684\u52aa\u529b\uff0c\u8ba9\u5979\u611f\u5230\u4e0d\u8db3\u548c\u4e0d\u88ab\u8d4f\u8bc6\u3002"}, {"en": "The manager belittles the team's accomplishments to maintain his own authority.", "cn": "\u7ecf\u7406\u8d2c\u4f4e\u56e2\u961f\u7684\u6210\u5c31\u4ee5\u7ef4\u6301\u81ea\u5df1\u7684\u6743\u5a01\u3002"}]}, {"word": "irritates", "ipa": "/\u02c8\u026ar\u026ate\u026ats/", "meanings": {"en": "To make someone annoyed, impatient, or angry; to provoke or exacerbate.", "cn": "\u4f7f\u67d0\u4eba\u70e6\u607c\u3001\u4e0d\u8010\u70e6\u6216\u751f\u6c14\uff1b\u6fc0\u6012\u6216\u52a0\u5267\u3002"}, "usage_en": "Used to describe the act of causing annoyance or frustration.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5f15\u8d77\u70e6\u607c\u6216\u6cae\u4e27\u7684\u884c\u4e3a\u3002", "scene_en": "A person tapping their pen repeatedly, causing annoyance to others in the room.", "scene_cn": "\u4e00\u4e2a\u4eba\u53cd\u590d\u6572\u51fb\u7b14\uff0c\u5f15\u8d77\u623f\u95f4\u91cc\u5176\u4ed6\u4eba\u7684\u70e6\u607c\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q2_irritates_1.png", "P6_vocabulary_exercises_16_Q2_irritates_2.png"], "examples": [{"en": "His constant complaining irritates everyone in the office, lowering team morale.", "cn": "\u4ed6\u4e0d\u65ad\u7684\u62b1\u6028\u60f9\u607c\u4e86\u529e\u516c\u5ba4\u91cc\u7684\u6bcf\u4e00\u4e2a\u4eba\uff0c\u964d\u4f4e\u4e86\u56e2\u961f\u7684\u58eb\u6c14\u3002"}, {"en": "The loud music from next door irritates me when I'm trying to concentrate.", "cn": "\u5f53\u6211\u8bd5\u56fe\u96c6\u4e2d\u6ce8\u610f\u529b\u65f6\uff0c\u9694\u58c1\u4f20\u6765\u7684\u5608\u6742\u97f3\u4e50\u8ba9\u6211\u5f88\u70e6\u8e81\u3002"}]}, {"word": "faults", "ipa": "/f\u0254\u02d0lts/", "meanings": {"en": "To find fault with; to criticize or blame for shortcomings or mistakes.", "cn": "\u6311\u5254\uff1b\u6279\u8bc4\u6216\u6307\u8d23\u7f3a\u70b9\u6216\u9519\u8bef\u3002"}, "usage_en": "Used to describe the act of finding errors or imperfections in someone or something.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u67d0\u4eba\u6216\u67d0\u4e8b\u4e2d\u53d1\u73b0\u9519\u8bef\u6216\u7f3a\u9677\u7684\u884c\u4e3a\u3002", "scene_en": "A strict teacher pointing out errors in a student's essay with a red pen.", "scene_cn": "\u4e00\u4f4d\u4e25\u5389\u7684\u8001\u5e08\u7528\u7ea2\u7b14\u6307\u51fa\u5b66\u751f\u6587\u7ae0\u4e2d\u7684\u9519\u8bef\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q2_faults_1.png", "P6_vocabulary_exercises_16_Q2_faults_2.png"], "examples": [{"en": "She always faults her husband for leaving his socks on the floor carelessly.", "cn": "\u5979\u603b\u662f\u8d23\u602a\u5979\u7684\u4e08\u592b\u7c97\u5fc3\u5730\u628a\u889c\u5b50\u7559\u5728\u5730\u677f\u4e0a\u3002"}, {"en": "The manager faults the team for not meeting the deadline, despite the challenges.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u6311\u6218\uff0c\u7ecf\u7406\u8fd8\u662f\u6307\u8d23\u56e2\u961f\u6ca1\u6709\u6309\u65f6\u5b8c\u6210\u4efb\u52a1\u3002"}]}], "synonym_cn": "\u8d2c\u4f4e (bi\u01cen d\u012b) vs. \u62b1\u6028 (b\u00e0o yu\u00e0n) vs. \u6fc0\u6012 (j\u012b n\u00f9) vs. \u8d23\u5907 (z\u00e9 b\u00e8i)", "socratic_questions": [{"question": "If you constantly complain about your friend's minor flaws, do you _____ them or support them?", "options": ["begrudge", "belittles", "irritates", "faults"], "correct_answer": "faults", "explanation": "Faulting someone involves finding and pointing out their flaws, often repeatedly."}, {"question": "When a boss publicly criticizes an employee's work to make themselves look superior, do they _____ the employee?", "options": ["begrudge", "belittles", "irritates", "faults"], "correct_answer": "belittles", "explanation": "Belittling involves making someone or something seem unimportant or less valuable."}, {"question": "If someone is envious of another person's success and shows resentment, do they _____ their achievements?", "options": ["begrudge", "belittles", "irritates", "faults"], "correct_answer": "begrudge", "explanation": "To begrudge means to resent someone else's success or good fortune."}, {"question": "If your younger sibling keeps making noise while you are studying, do they _____ you?", "options": ["begrudge", "belittles", "irritates", "faults"], "correct_answer": "irritates", "explanation": "To irritate means to annoy or provoke someone."}]}, {"id": 3, "stem": "Some children learn to do things by _____ their parents.", "correct_index": 2, "options": [{"word": "acting", "ipa": "\u02c8\u00e6kt\u026a\u014b", "meanings": {"en": "The art or occupation of performing fictional roles in plays, films, or television.", "cn": "\u5728\u620f\u5267\u3001\u7535\u5f71\u6216\u7535\u89c6\u4e2d\u626e\u6f14\u865a\u6784\u89d2\u8272\u7684\u827a\u672f\u6216\u804c\u4e1a\u3002"}, "usage_en": "Used to describe the profession or activity of performing in plays or films.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5728\u620f\u5267\u6216\u7535\u5f71\u4e2d\u8868\u6f14\u7684\u804c\u4e1a\u6216\u6d3b\u52a8\u3002", "scene_en": "A stage with actors performing a scene from a play, showcasing costumes and dramatic expressions.", "scene_cn": "\u4e00\u4e2a\u821e\u53f0\uff0c\u6f14\u5458\u4eec\u6b63\u5728\u8868\u6f14\u620f\u5267\u4e2d\u7684\u4e00\u4e2a\u573a\u666f\uff0c\u5c55\u793a\u7740\u670d\u88c5\u548c\u620f\u5267\u6027\u7684\u8868\u60c5\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q3_acting_1.png", "P6_vocabulary_exercises_16_Q3_acting_2.png"], "examples": [{"en": "Her acting was superb; she completely embodied the character's emotions and motivations.", "cn": "\u5979\u7684\u8868\u6f14\u975e\u5e38\u51fa\u8272\uff1b\u5979\u5b8c\u5168\u4f53\u73b0\u4e86\u89d2\u8272\u7684\u60c5\u611f\u548c\u52a8\u673a\u3002"}, {"en": "He pursued acting as a career after performing in several school plays and local productions.", "cn": "\u5728\u5b66\u6821\u7684\u51e0\u90e8\u620f\u5267\u548c\u5f53\u5730\u4f5c\u54c1\u4e2d\u8868\u6f14\u540e\uff0c\u4ed6\u5c06\u8868\u6f14\u4f5c\u4e3a\u4e00\u9879\u4e8b\u4e1a\u6765\u8ffd\u6c42\u3002"}]}, {"word": "pretending", "ipa": "pr\u026a\u02c8t\u025bnd\u026a\u014b", "meanings": {"en": "Engaging in make-believe; behaving as if something is true when it is not.", "cn": "\u53c2\u4e0e\u5047\u88c5\uff1b\u8868\u73b0\u5f97\u597d\u50cf\u67d0\u4e8b\u662f\u771f\u7684\uff0c\u4f46\u5b9e\u9645\u4e0a\u4e0d\u662f\u3002"}, "usage_en": "Used when someone is not being genuine or truthful in their actions or words.", "usage_cn": "\u5f53\u67d0\u4eba\u5728\u4ed6\u4eec\u7684\u884c\u4e3a\u6216\u8a00\u8bed\u4e2d\u4e0d\u771f\u8bda\u6216\u4e0d\u771f\u5b9e\u65f6\u4f7f\u7528\u3002", "scene_en": "A child wearing a superhero cape and mask, running around the backyard, pretending to fly.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u7a7f\u7740\u8d85\u7ea7\u82f1\u96c4\u7684\u6597\u7bf7\u548c\u9762\u5177\uff0c\u5728\u540e\u9662\u8dd1\u6765\u8dd1\u53bb\uff0c\u5047\u88c5\u98de\u884c\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q3_pretending_1.png", "P6_vocabulary_exercises_16_Q3_pretending_2.png"], "examples": [{"en": "The children were pretending to be pirates, searching for buried treasure in the sandbox.", "cn": "\u5b69\u5b50\u4eec\u5047\u88c5\u662f\u6d77\u76d7\uff0c\u5728\u6c99\u7bb1\u91cc\u5bfb\u627e\u57cb\u85cf\u7684\u5b9d\u85cf\u3002"}, {"en": "She was pretending to be busy, but she was actually just avoiding the difficult conversation.", "cn": "\u5979\u5047\u88c5\u5f88\u5fd9\uff0c\u4f46\u5b9e\u9645\u4e0a\u53ea\u662f\u5728\u907f\u514d\u90a3\u573a\u8270\u96be\u7684\u8c08\u8bdd\u3002"}]}, {"word": "imitating", "ipa": "\u02c8\u026am\u026ate\u026at\u026a\u014b", "meanings": {"en": "Copying the actions, behavior, or speech of someone or something.", "cn": "\u6a21\u4eff\u67d0\u4eba\u6216\u67d0\u7269\u7684\u884c\u4e3a\u3001\u4e3e\u6b62\u6216\u8a00\u8bed\u3002"}, "usage_en": "Used to describe the act of copying someone's behavior, often for learning or entertainment.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u6a21\u4eff\u67d0\u4eba\u884c\u4e3a\u7684\u884c\u4e3a\uff0c\u901a\u5e38\u7528\u4e8e\u5b66\u4e60\u6216\u5a31\u4e50\u3002", "scene_en": "A young child standing next to their parent, imitating their movements while dancing to music.", "scene_cn": "\u4e00\u4e2a\u5c0f\u5b69\u7ad9\u5728\u7236\u6bcd\u65c1\u8fb9\uff0c\u6a21\u4eff\u4ed6\u4eec\u968f\u7740\u97f3\u4e50\u8df3\u821e\u7684\u52a8\u4f5c\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q3_imitating_1.png", "P6_vocabulary_exercises_16_Q3_imitating_2.png"], "examples": [{"en": "The young bird was imitating the songs of its parents to learn how to communicate effectively.", "cn": "\u8fd9\u53ea\u5c0f\u9e1f\u6b63\u5728\u6a21\u4eff\u7236\u6bcd\u7684\u6b4c\u58f0\uff0c\u4ee5\u5b66\u4e60\u5982\u4f55\u6709\u6548\u5730\u4ea4\u6d41\u3002"}, {"en": "He was imitating the comedian's voice and mannerisms, making everyone laugh at the party.", "cn": "\u4ed6\u6b63\u5728\u6a21\u4eff\u559c\u5267\u6f14\u5458\u7684\u58f0\u97f3\u548c\u4e3e\u6b62\uff0c\u8ba9\u805a\u4f1a\u4e0a\u7684\u6bcf\u4e2a\u4eba\u90fd\u7b11\u4e86\u3002"}]}, {"word": "trying", "ipa": "\u02c8tra\u026a\u026a\u014b", "meanings": {"en": "Making an effort to do something; attempting to accomplish a task.", "cn": "\u52aa\u529b\u505a\u67d0\u4e8b\uff1b\u8bd5\u56fe\u5b8c\u6210\u4e00\u9879\u4efb\u52a1\u3002"}, "usage_en": "Used when someone is making an effort to achieve a goal or complete a task.", "usage_cn": "\u5f53\u67d0\u4eba\u52aa\u529b\u5b9e\u73b0\u76ee\u6807\u6216\u5b8c\u6210\u4efb\u52a1\u65f6\u4f7f\u7528\u3002", "scene_en": "A person sitting at a desk, surrounded by books and papers, trying to solve a difficult problem.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u5b50\u65c1\uff0c\u5468\u56f4\u662f\u4e66\u7c4d\u548c\u6587\u4ef6\uff0c\u8bd5\u56fe\u89e3\u51b3\u4e00\u4e2a\u96be\u9898\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q3_trying_1.png", "P6_vocabulary_exercises_16_Q3_trying_2.png"], "examples": [{"en": "She was trying her best to finish the project before the deadline, working late into the night.", "cn": "\u5979\u6b63\u5728\u5c3d\u6700\u5927\u52aa\u529b\u5728\u622a\u6b62\u65e5\u671f\u524d\u5b8c\u6210\u9879\u76ee\uff0c\u5de5\u4f5c\u5230\u6df1\u591c\u3002"}, {"en": "Despite the challenges, he kept trying to improve his skills and achieve his professional goals.", "cn": "\u5c3d\u7ba1\u9762\u4e34\u6311\u6218\uff0c\u4ed6\u4ecd\u7136\u4e0d\u65ad\u52aa\u529b\u63d0\u9ad8\u81ea\u5df1\u7684\u6280\u80fd\u5e76\u5b9e\u73b0\u81ea\u5df1\u7684\u804c\u4e1a\u76ee\u6807\u3002"}]}], "synonym_cn": "\u6a21\u4eff\uff0c\u6548\u4eff\uff0c\u5b66\u4e60", "socratic_questions": [{"question": "If a director tells an actor to copy a famous person's behavior, what are they asking the actor to do?", "options": ["acting", "pretending", "imitating", "trying"], "correct_answer": "imitating", "explanation": "Imitating means to copy someone's behavior or actions."}, {"question": "When a child is experimenting with a new sport, what are they doing to learn the rules?", "options": ["acting", "pretending", "imitating", "trying"], "correct_answer": "trying", "explanation": "Trying means making an attempt to do something."}, {"question": "If someone is performing a role in a play, what are they doing on the stage?", "options": ["acting", "pretending", "imitating", "trying"], "correct_answer": "acting", "explanation": "Acting means performing a role in a play or movie."}, {"question": "If you are not actually a doctor but you are acting like one, what are you doing?", "options": ["acting", "pretending", "imitating", "trying"], "correct_answer": "pretending", "explanation": "Pretending means behaving as if something is true when it is not."}]}, {"id": 4, "stem": "The pupils were told to use their _____ when writing their essays.", "correct_index": 0, "options": [{"word": "imagination", "ipa": "/\u026a\u02ccm\u00e6d\u0292\u026a\u02c8ne\u026a\u0283\u0259n/", "meanings": {"en": "The faculty or action of forming new ideas, or images or concepts of external objects not present to the senses.", "cn": "\u5f62\u6210\u65b0\u60f3\u6cd5\u3001\u56fe\u50cf\u6216\u5bf9\u611f\u5b98\u672a\u5448\u73b0\u7684\u5916\u90e8\u7269\u4f53\u7684\u6982\u5ff5\u7684\u80fd\u529b\u6216\u884c\u4e3a\u3002"}, "usage_en": "Imagination is crucial for creativity and problem-solving.", "usage_cn": "\u60f3\u8c61\u529b\u5bf9\u4e8e\u521b\u9020\u529b\u548c\u89e3\u51b3\u95ee\u9898\u81f3\u5173\u91cd\u8981\u3002", "scene_en": "A child is drawing a fantastical creature with bright colors.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u6b63\u5728\u7528\u9c9c\u8273\u7684\u8272\u5f69\u753b\u4e00\u4e2a\u5947\u5f02\u7684\u751f\u7269\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q4_imagination_1.png", "P6_vocabulary_exercises_16_Q4_imagination_2.png"], "examples": [{"en": "Her imagination allowed her to create a world filled with magical creatures and talking animals.", "cn": "\u5979\u7684\u60f3\u8c61\u529b\u8ba9\u5979\u521b\u9020\u4e86\u4e00\u4e2a\u5145\u6ee1\u9b54\u6cd5\u751f\u7269\u548c\u4f1a\u8bf4\u8bdd\u7684\u52a8\u7269\u7684\u4e16\u754c\u3002"}, {"en": "The architect used his imagination to design a building that defied conventional architectural norms.", "cn": "\u5efa\u7b51\u5e08\u8fd0\u7528\u4ed6\u7684\u60f3\u8c61\u529b\u8bbe\u8ba1\u4e86\u4e00\u5ea7\u6253\u7834\u4f20\u7edf\u5efa\u7b51\u89c4\u8303\u7684\u5efa\u7b51\u3002"}]}, {"word": "thoughts", "ipa": "/\u03b8\u0254\u02d0ts/", "meanings": {"en": "An idea or opinion produced by thinking, or occurring suddenly in the mind.", "cn": "\u901a\u8fc7\u601d\u8003\u4ea7\u751f\u7684\uff0c\u6216\u7a81\u7136\u51fa\u73b0\u5728\u8111\u6d77\u4e2d\u7684\u60f3\u6cd5\u6216\u610f\u89c1\u3002"}, "usage_en": "Thoughts can be fleeting or deeply considered reflections.", "usage_cn": "\u60f3\u6cd5\u53ef\u4ee5\u662f\u8f6c\u77ac\u5373\u901d\u7684\uff0c\u4e5f\u53ef\u4ee5\u662f\u7ecf\u8fc7\u6df1\u601d\u719f\u8651\u7684\u3002", "scene_en": "A person sitting quietly, pondering a complex problem.", "scene_cn": "\u4e00\u4e2a\u4eba\u5b89\u9759\u5730\u5750\u7740\uff0c\u601d\u8003\u4e00\u4e2a\u590d\u6742\u7684\u95ee\u9898\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q4_thoughts_1.png", "P6_vocabulary_exercises_16_Q4_thoughts_2.png"], "examples": [{"en": "His thoughts were interrupted by the sudden ringing of the telephone in the quiet room.", "cn": "\u4ed6\u7684\u601d\u7eea\u88ab\u5b89\u9759\u623f\u95f4\u91cc\u7a81\u7136\u54cd\u8d77\u7684\u7535\u8bdd\u94c3\u58f0\u6253\u65ad\u4e86\u3002"}, {"en": "She collected her thoughts before presenting her argument to the board of directors effectively.", "cn": "\u5728\u5411\u8463\u4e8b\u4f1a\u9648\u8ff0\u5979\u7684\u8bba\u70b9\u4e4b\u524d\uff0c\u5979\u6574\u7406\u4e86\u4e00\u4e0b\u601d\u8def\uff0c\u4ee5\u4fbf\u6709\u6548\u5730\u8868\u8fbe\u3002"}]}, {"word": "expectations", "ipa": "/\u02ccekspek\u02c8te\u026a\u0283\u0259nz/", "meanings": {"en": "A strong belief that something will happen or be the case in the future.", "cn": "\u5f3a\u70c8\u5730\u76f8\u4fe1\u67d0\u4e8b\u4f1a\u5728\u672a\u6765\u53d1\u751f\u6216\u6210\u4e3a\u73b0\u5b9e\u3002"}, "usage_en": "Expectations can influence our perception of events.", "usage_cn": "\u671f\u671b\u4f1a\u5f71\u54cd\u6211\u4eec\u5bf9\u4e8b\u4ef6\u7684\u770b\u6cd5\u3002", "scene_en": "People waiting eagerly for the results of an election.", "scene_cn": "\u4eba\u4eec\u7126\u6025\u5730\u7b49\u5f85\u9009\u4e3e\u7ed3\u679c\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q4_expectations_1.png", "P6_vocabulary_exercises_16_Q4_expectations_2.png"], "examples": [{"en": "The company's earnings exceeded analysts' expectations, leading to a surge in the stock price.", "cn": "\u516c\u53f8\u7684\u6536\u76ca\u8d85\u8fc7\u4e86\u5206\u6790\u5e08\u7684\u9884\u671f\uff0c\u5bfc\u81f4\u80a1\u4ef7\u98d9\u5347\u3002"}, {"en": "Setting realistic expectations can help manage disappointment when things don't go as planned.", "cn": "\u8bbe\u5b9a\u73b0\u5b9e\u7684\u671f\u671b\u53ef\u4ee5\u5e2e\u52a9\u7ba1\u7406\u4e8b\u60c5\u4e0d\u5982\u9884\u671f\u65f6\u4ea7\u751f\u7684\u5931\u671b\u60c5\u7eea\u3002"}]}, {"word": "pretense", "ipa": "/pr\u026a\u02c8tens/", "meanings": {"en": "An attempt to make something that is not the case appear true.", "cn": "\u8bd5\u56fe\u4f7f\u67d0\u79cd\u4e0d\u662f\u4e8b\u5b9e\u7684\u4e8b\u60c5\u770b\u8d77\u6765\u662f\u771f\u7684\u3002"}, "usage_en": "Pretense often involves concealing one's true feelings.", "usage_cn": "\u4f2a\u88c5\u901a\u5e38\u6d89\u53ca\u9690\u85cf\u4e00\u4e2a\u4eba\u7684\u771f\u5b9e\u611f\u53d7\u3002", "scene_en": "A person smiling while secretly feeling sad.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u79d8\u5bc6\u611f\u5230\u60b2\u4f24\u65f6\u5fae\u7b11\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q4_pretense_1.png", "P6_vocabulary_exercises_16_Q4_pretense_2.png"], "examples": [{"en": "He maintained a pretense of calm despite the chaos surrounding him during the emergency situation.", "cn": "\u5c3d\u7ba1\u7d27\u6025\u60c5\u51b5\u4e0b\u4ed6\u5468\u56f4\u4e00\u7247\u6df7\u4e71\uff0c\u4f46\u4ed6\u8fd8\u662f\u88c5\u4f5c\u9547\u5b9a\u81ea\u82e5\u7684\u6837\u5b50\u3002"}, {"en": "Under the pretense of friendship, he gathered information to use against his supposed allies later.", "cn": "\u4ed6\u4ee5\u53cb\u8c0a\u4e3a\u5e4c\u5b50\uff0c\u6536\u96c6\u4fe1\u606f\u4ee5\u4fbf\u65e5\u540e\u7528\u6765\u5bf9\u4ed8\u4ed6\u6240\u8c13\u7684\u76df\u53cb\u3002"}]}], "synonym_cn": "\u60f3\u8c61\u529b vs \u60f3\u6cd5 vs \u671f\u671b vs \u5047\u88c5", "socratic_questions": [{"question": "If you are asked to create a fantasy world, which faculty would be most helpful?", "options": ["imagination", "thoughts", "expectations", "pretense"], "correct_answer": "imagination", "explanation": "Imagination is the ability to form new ideas and images in the mind."}, {"question": "When facing a difficult problem, what do you rely on to find a solution?", "options": ["imagination", "thoughts", "expectations", "pretense"], "correct_answer": "thoughts", "explanation": "Thoughts are the ideas or opinions that you have in your mind."}, {"question": "Before a big competition, what feelings do athletes often experience about the outcome?", "options": ["imagination", "thoughts", "expectations", "pretense"], "correct_answer": "expectations", "explanation": "Expectations are strong beliefs about what will happen in the future."}, {"question": "In a play, what do actors use to portray a character they are not?", "options": ["imagination", "thoughts", "expectations", "pretense"], "correct_answer": "pretense", "explanation": "Pretense is an attempt to make something that is not the case appear true."}]}, {"id": 5, "stem": "The village is experiencing a _____ right now and all their crops are withering.", "correct_index": 1, "options": [{"word": "draft", "ipa": "dr\u00e6ft", "meanings": {"en": "A preliminary version of a piece of writing.", "cn": "\u4f5c\u54c1\u7684\u521d\u6b65\u7248\u672c\u3002"}, "usage_en": "Often used in writing or planning contexts.", "usage_cn": "\u5e38\u7528\u4e8e\u5199\u4f5c\u6216\u8ba1\u5212\u7684\u8bed\u5883\u4e2d\u3002", "scene_en": "A person sitting at a desk, writing on a piece of paper, with crumpled papers around.", "scene_cn": "\u4e00\u4e2a\u4eba\u5750\u5728\u684c\u5b50\u65c1\uff0c\u5728\u4e00\u5f20\u7eb8\u4e0a\u5199\u4f5c\uff0c\u5468\u56f4\u662f\u63c9\u76b1\u7684\u7eb8\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q5_draft_1.png", "P6_vocabulary_exercises_16_Q5_draft_2.png"], "examples": [{"en": "She wrote a quick draft of the email before sending it to her boss.", "cn": "\u5979\u5728\u53d1\u9001\u7ed9\u8001\u677f\u4e4b\u524d\u5feb\u901f\u8d77\u8349\u4e86\u8fd9\u5c01\u7535\u5b50\u90ae\u4ef6\u3002"}, {"en": "The architect presented the first draft of the building plans to the committee.", "cn": "\u5efa\u7b51\u5e08\u5411\u59d4\u5458\u4f1a\u63d0\u4ea4\u4e86\u5efa\u7b51\u8ba1\u5212\u7684\u521d\u7a3f\u3002"}]}, {"word": "drought", "ipa": "dra\u028at", "meanings": {"en": "A prolonged period of abnormally low rainfall; a shortage of water.", "cn": "\u957f\u65f6\u95f4\u7684\u5f02\u5e38\u4f4e\u964d\u96e8\u91cf\uff1b\u7f3a\u6c34\u3002"}, "usage_en": "Used to describe periods of water scarcity.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u7f3a\u6c34\u65f6\u671f\u3002", "scene_en": "Cracked earth in a field, with a barren landscape stretching into the distance.", "scene_cn": "\u7530\u91ce\u91cc\u9f9f\u88c2\u7684\u571f\u5730\uff0c\u8d2b\u7620\u7684\u666f\u89c2\u5ef6\u4f38\u5230\u8fdc\u5904\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q5_drought_1.png", "P6_vocabulary_exercises_16_Q5_drought_2.png"], "examples": [{"en": "The severe drought caused widespread crop failure and food shortages this past summer.", "cn": "\u4e25\u91cd\u7684\u5e72\u65f1\u5bfc\u81f4\u4e86\u53bb\u5e74\u590f\u5929\u666e\u904d\u7684\u4f5c\u7269\u6b49\u6536\u548c\u98df\u7269\u77ed\u7f3a\u3002"}, {"en": "Many regions are implementing water restrictions due to the ongoing drought conditions currently affecting them.", "cn": "\u7531\u4e8e\u76ee\u524d\u5f71\u54cd\u5b83\u4eec\u7684\u6301\u7eed\u5e72\u65f1\u60c5\u51b5\uff0c\u8bb8\u591a\u5730\u533a\u6b63\u5728\u5b9e\u65bd\u7528\u6c34\u9650\u5236\u3002"}]}, {"word": "monsoon", "ipa": "m\u0252n\u02c8su\u02d0n", "meanings": {"en": "A seasonal reversing wind accompanied by corresponding changes in precipitation.", "cn": "\u5b63\u8282\u6027\u53cd\u8f6c\u7684\u98ce\uff0c\u4f34\u968f\u7740\u76f8\u5e94\u7684\u964d\u6c34\u53d8\u5316\u3002"}, "usage_en": "Describes seasonal weather patterns with heavy rainfall.", "usage_cn": "\u63cf\u8ff0\u4e86\u5177\u6709\u5927\u91cf\u964d\u96e8\u7684\u5b63\u8282\u6027\u5929\u6c14\u6a21\u5f0f\u3002", "scene_en": "Heavy rain falling in a tropical area, with lush green vegetation.", "scene_cn": "\u70ed\u5e26\u5730\u533a\u4e0b\u7740\u5927\u96e8\uff0c\u690d\u88ab\u8302\u76db\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q5_monsoon_1.png", "P6_vocabulary_exercises_16_Q5_monsoon_2.png"], "examples": [{"en": "The annual monsoon season brings much-needed water to the parched lands of Southeast Asia.", "cn": "\u4e00\u5e74\u4e00\u5ea6\u7684\u5b63\u98ce\u5b63\u8282\u4e3a\u4e1c\u5357\u4e9a\u5e72\u65f1\u7684\u571f\u5730\u5e26\u6765\u4e86\u6025\u9700\u7684\u6c34\u6e90\u3002"}, {"en": "During the monsoon, many roads become impassable due to the heavy flooding and landslides.", "cn": "\u5728\u5b63\u98ce\u671f\u95f4\uff0c\u7531\u4e8e\u4e25\u91cd\u7684\u6d2a\u6c34\u548c\u5c71\u4f53\u6ed1\u5761\uff0c\u8bb8\u591a\u9053\u8def\u53d8\u5f97\u65e0\u6cd5\u901a\u884c\u3002"}]}, {"word": "drain", "ipa": "dre\u026an", "meanings": {"en": "A channel or pipe carrying off surplus liquid, especially water or sewage.", "cn": "\u7528\u4e8e\u6392\u8d70\u591a\u4f59\u6db2\u4f53\u7684\u901a\u9053\u6216\u7ba1\u9053\uff0c\u5c24\u5176\u662f\u6c34\u6216\u6c61\u6c34\u3002"}, "usage_en": "Used to remove excess liquid.", "usage_cn": "\u7528\u4e8e\u53bb\u9664\u591a\u4f59\u7684\u6db2\u4f53\u3002", "scene_en": "A metal grate covering a drain in a street, with water flowing into it.", "scene_cn": "\u8857\u9053\u4e0a\u8986\u76d6\u7740\u6392\u6c34\u6c9f\u7684\u91d1\u5c5e\u683c\u6805\uff0c\u6c34\u6d41\u5411\u5176\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q5_drain_1.png", "P6_vocabulary_exercises_16_Q5_drain_2.png"], "examples": [{"en": "The plumber cleared the drain to prevent the sink from overflowing with dirty water.", "cn": "\u6c34\u7ba1\u5de5\u6e05\u7406\u4e86\u6392\u6c34\u6c9f\uff0c\u4ee5\u9632\u6b62\u6c34\u69fd\u6ea2\u51fa\u810f\u6c34\u3002"}, {"en": "The city installed new drains to improve flood control during periods of heavy rainfall.", "cn": "\u8be5\u5e02\u5b89\u88c5\u4e86\u65b0\u7684\u6392\u6c34\u6c9f\uff0c\u4ee5\u6539\u5584\u66b4\u96e8\u671f\u95f4\u7684\u6d2a\u6c34\u63a7\u5236\u3002"}]}], "synonym_cn": "\u5e72\u65f1 vs \u8349\u7a3f vs \u5b63\u98ce vs \u6392\u6c34", "socratic_questions": [{"question": "If you are writing the first version of an essay, which of the following is it?", "options": ["draft", "drought", "monsoon", "drain"], "correct_answer": "draft", "explanation": "A 'draft' is a preliminary version of a piece of writing."}, {"question": "Which of the following describes a long period with little or no rain, causing widespread crop damage?", "options": ["draft", "drought", "monsoon", "drain"], "correct_answer": "drought", "explanation": "A 'drought' is a prolonged period of abnormally low rainfall, leading to a shortage of water."}, {"question": "Which of the following refers to the seasonal reversing wind accompanied by corresponding changes in precipitation?", "options": ["draft", "drought", "monsoon", "drain"], "correct_answer": "monsoon", "explanation": "A 'monsoon' is a seasonal change in the direction of the prevailing winds, often bringing heavy rainfall."}, {"question": "If you need to remove water from a swimming pool, which of the following would you use?", "options": ["draft", "drought", "monsoon", "drain"], "correct_answer": "drain", "explanation": "A 'drain' is a channel or pipe carrying off surplus liquid, especially water or sewage."}]}, {"id": 6, "stem": "The tycoon just made a generous _____ to his favourite charity.", "correct_index": 2, "options": [{"word": "distribution", "ipa": "/\u02ccd\u026astr\u026a\u02c8bju\u02d0\u0283\u0259n/", "meanings": {"en": "The action of sharing something out among a number of recipients.", "cn": "\u5728\u8bb8\u591a\u63a5\u53d7\u8005\u4e4b\u95f4\u5206\u4eab\u67d0\u7269\u7684\u884c\u4e3a\u3002"}, "usage_en": "Used when dividing resources or items among a group.", "usage_cn": "\u7528\u4e8e\u5728\u4e00\u7fa4\u4eba\u4e4b\u95f4\u5206\u914d\u8d44\u6e90\u6216\u7269\u54c1\u3002", "scene_en": "A teacher handing out worksheets to students in a classroom.", "scene_cn": "\u4e00\u4f4d\u8001\u5e08\u5728\u6559\u5ba4\u91cc\u5411\u5b66\u751f\u5206\u53d1\u5de5\u4f5c\u8868\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q6_distribution_1.png", "P6_vocabulary_exercises_16_Q6_distribution_2.png"], "examples": [{"en": "The distribution of wealth is uneven, with a large gap between rich and poor.", "cn": "\u8d22\u5bcc\u7684\u5206\u914d\u662f\u4e0d\u5747\u8861\u7684\uff0c\u8d2b\u5bcc\u5dee\u8ddd\u5f88\u5927\u3002"}, {"en": "The company is responsible for the distribution of goods to retail stores nationwide.", "cn": "\u8be5\u516c\u53f8\u8d1f\u8d23\u5c06\u8d27\u7269\u5206\u53d1\u5230\u5168\u56fd\u5404\u5730\u7684\u96f6\u552e\u5546\u5e97\u3002"}]}, {"word": "award", "ipa": "/\u0259\u02c8w\u0254\u02d0rd/", "meanings": {"en": "A prize or other mark of recognition given in honor of an achievement.", "cn": "\u4e3a\u8868\u5f70\u6210\u5c31\u800c\u9881\u53d1\u7684\u5956\u54c1\u6216\u5176\u4ed6\u8ba4\u53ef\u6807\u5fd7\u3002"}, "usage_en": "Used to describe prizes or recognitions for achievements.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u56e0\u6210\u5c31\u800c\u83b7\u5f97\u7684\u5956\u54c1\u6216\u8ba4\u53ef\u3002", "scene_en": "A person receiving a trophy on a stage during an awards ceremony.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u9881\u5956\u5178\u793c\u7684\u821e\u53f0\u4e0a\u63a5\u53d7\u5956\u676f\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q6_award_1.png", "P6_vocabulary_exercises_16_Q6_award_2.png"], "examples": [{"en": "She received an award for her outstanding contributions to environmental conservation efforts.", "cn": "\u5979\u56e0\u5bf9\u73af\u5883\u4fdd\u62a4\u5de5\u4f5c\u7684\u6770\u51fa\u8d21\u732e\u800c\u83b7\u5956\u3002"}, {"en": "The film received several awards, including Best Picture and Best Director at the festival.", "cn": "\u8fd9\u90e8\u7535\u5f71\u83b7\u5f97\u4e86\u591a\u4e2a\u5956\u9879\uff0c\u5305\u62ec\u7535\u5f71\u8282\u7684\u6700\u4f73\u5f71\u7247\u548c\u6700\u4f73\u5bfc\u6f14\u5956\u3002"}]}, {"word": "donation", "ipa": "/do\u028a\u02c8ne\u026a\u0283\u0259n/", "meanings": {"en": "Something that is given to a charity, especially a sum of money.", "cn": "\u6350\u8d60\u7ed9\u6148\u5584\u673a\u6784\u7684\u4e1c\u897f\uff0c\u5c24\u5176\u662f\u4e00\u7b14\u94b1\u3002"}, "usage_en": "Used when giving money or items to a charity or cause.", "usage_cn": "\u7528\u4e8e\u5411\u6148\u5584\u673a\u6784\u6216\u4e8b\u4e1a\u6350\u6b3e\u6216\u7269\u54c1\u3002", "scene_en": "A person putting money into a donation box for a charity.", "scene_cn": "\u4e00\u4e2a\u4eba\u5c06\u94b1\u653e\u5165\u6148\u5584\u673a\u6784\u7684\u6350\u6b3e\u7bb1\u4e2d\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q6_donation_1.png", "P6_vocabulary_exercises_16_Q6_donation_2.png"], "examples": [{"en": "The company made a large donation to support the local hospital's new cancer treatment center.", "cn": "\u8be5\u516c\u53f8\u6350\u8d60\u4e86\u4e00\u5927\u7b14\u94b1\u6765\u652f\u6301\u5f53\u5730\u533b\u9662\u65b0\u7684\u764c\u75c7\u6cbb\u7597\u4e2d\u5fc3\u3002"}, {"en": "We are asking for donations to help the victims of the recent natural disaster overseas.", "cn": "\u6211\u4eec\u6b63\u5728\u8bf7\u6c42\u6350\u6b3e\uff0c\u4ee5\u5e2e\u52a9\u6700\u8fd1\u6d77\u5916\u81ea\u7136\u707e\u5bb3\u7684\u53d7\u5bb3\u8005\u3002"}]}, {"word": "favour", "ipa": "/\u02c8fe\u026av\u0259r/", "meanings": {"en": "An act of kindness beyond what is due or usual.", "cn": "\u8d85\u51fa\u5e94\u6709\u6216\u901a\u5e38\u7684\u5584\u4e3e\u3002"}, "usage_en": "Used to describe an act of kindness or a good deed.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4e00\u79cd\u5584\u610f\u7684\u884c\u4e3a\u6216\u5584\u4e3e\u3002", "scene_en": "A person helping an elderly woman carry her groceries.", "scene_cn": "\u4e00\u4e2a\u4eba\u5e2e\u52a9\u4e00\u4f4d\u8001\u5987\u4eba\u63d0\u7740\u5979\u7684\u6742\u8d27\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q6_favour_1.png", "P6_vocabulary_exercises_16_Q6_favour_2.png"], "examples": [{"en": "Could you do me a favour and help me move this heavy box to the garage?", "cn": "\u4f60\u80fd\u5e2e\u6211\u4e00\u4e2a\u5fd9\uff0c\u5e2e\u6211\u628a\u8fd9\u4e2a\u6c89\u91cd\u7684\u7bb1\u5b50\u642c\u5230\u8f66\u5e93\u5417\uff1f"}, {"en": "She asked her neighbor for a favour to watch her dog while she was on vacation.", "cn": "\u5979\u8bf7\u90bb\u5c45\u5e2e\u4e2a\u5fd9\uff0c\u5728\u5979\u5ea6\u5047\u65f6\u7167\u770b\u5979\u7684\u72d7\u3002"}]}], "synonym_cn": "\u6350\u8d60 vs. \u5206\u914d vs. \u5956\u52b1 vs. \u6069\u60e0", "socratic_questions": [{"question": "Which term describes the act of allocating resources or items among a group?", "options": ["distribution", "award", "donation", "favour"], "correct_answer": "distribution", "explanation": "Distribution refers to the act of dividing and allocating something among several recipients."}, {"question": "Which word best describes a prize or recognition given for achievement?", "options": ["distribution", "award", "donation", "favour"], "correct_answer": "award", "explanation": "An award is something given to someone as a recognition of their merit."}, {"question": "If someone gives money to a non-profit, what is this act called?", "options": ["distribution", "award", "donation", "favour"], "correct_answer": "donation", "explanation": "A donation is a voluntary contribution, typically of money, to a cause or organization."}, {"question": "Which term refers to an act of kindness or a good deed done for someone?", "options": ["distribution", "award", "donation", "favour"], "correct_answer": "favour", "explanation": "A favour is an act of kindness or a good deed done for someone, often in return for something."}]}, {"id": 7, "stem": "I am not _____ but I never like the number 13.", "correct_index": 2, "options": [{"word": "religious", "ipa": "/r\u026a\u02c8l\u026ad\u0292\u0259s/", "meanings": {"en": "Relating to or believing in a religion.", "cn": "\u4e0e\u5b97\u6559\u6709\u5173\u6216\u4fe1\u4ef0\u5b97\u6559\u7684\u3002"}, "usage_en": "Used to describe someone who follows a particular religion or belief system.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u9075\u5faa\u7279\u5b9a\u5b97\u6559\u6216\u4fe1\u4ef0\u4f53\u7cfb\u7684\u4eba\u3002", "scene_en": "A person praying in a church, a group celebrating a religious holiday.", "scene_cn": "\u4e00\u4e2a\u4eba\u5728\u6559\u5802\u7948\u7977\uff0c\u4e00\u7fa4\u4eba\u5e86\u795d\u5b97\u6559\u8282\u65e5\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q7_religious_1.png", "P6_vocabulary_exercises_16_Q7_religious_2.png"], "examples": [{"en": "She is deeply religious and attends church every Sunday without fail without any hesitations.", "cn": "\u5979\u975e\u5e38\u8654\u8bda\uff0c\u6bcf\u4e2a\u661f\u671f\u5929\u90fd\u6beb\u4e0d\u72b9\u8c6b\u5730\u53bb\u6559\u5802\uff0c\u4ece\u4e0d\u95f4\u65ad\u3002"}, {"en": "The religious community gathered to celebrate the festival with traditional songs and dances joyfully.", "cn": "\u5b97\u6559\u56e2\u4f53\u805a\u96c6\u5728\u4e00\u8d77\uff0c\u7528\u4f20\u7edf\u7684\u6b4c\u821e\u6b22\u5feb\u5730\u5e86\u795d\u8282\u65e5\u3002"}]}, {"word": "supernatural", "ipa": "/\u02ccsu\u02d0p\u0259r\u02c8n\u00e6t\u0283\u0259r\u0259l/", "meanings": {"en": "Attributed to some force beyond scientific understanding or the laws of nature.", "cn": "\u5f52\u56e0\u4e8e\u79d1\u5b66\u7406\u89e3\u6216\u81ea\u7136\u89c4\u5f8b\u4e4b\u5916\u7684\u67d0\u79cd\u529b\u91cf\u3002"}, "usage_en": "Describes events or phenomena that cannot be explained by science or natural laws.", "usage_cn": "\u63cf\u8ff0\u65e0\u6cd5\u7528\u79d1\u5b66\u6216\u81ea\u7136\u89c4\u5f8b\u89e3\u91ca\u7684\u4e8b\u4ef6\u6216\u73b0\u8c61\u3002", "scene_en": "A haunted house, a person levitating, a ghostly apparition.", "scene_cn": "\u4e00\u95f4\u9b3c\u5c4b\uff0c\u4e00\u4e2a\u4eba\u60ac\u6d6e\u5728\u7a7a\u4e2d\uff0c\u4e00\u4e2a\u5e7d\u7075\u822c\u7684\u5e7b\u5f71\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q7_supernatural_1.png", "P6_vocabulary_exercises_16_Q7_supernatural_2.png"], "examples": [{"en": "The movie featured supernatural events that defied logic and frightened the audience greatly last night.", "cn": "\u8fd9\u90e8\u7535\u5f71\u4ee5\u8d85\u81ea\u7136\u4e8b\u4ef6\u4e3a\u7279\u8272\uff0c\u8fd9\u4e9b\u4e8b\u4ef6\u8fdd\u80cc\u903b\u8f91\uff0c\u6628\u665a\u8ba9\u89c2\u4f17\u975e\u5e38\u5bb3\u6015\u3002"}, {"en": "Many cultures have stories about supernatural beings and forces that influence human lives significantly.", "cn": "\u8bb8\u591a\u6587\u5316\u90fd\u6709\u5173\u4e8e\u5f71\u54cd\u4eba\u7c7b\u751f\u6d3b\u7684\u8d85\u81ea\u7136\u751f\u7269\u548c\u529b\u91cf\u7684\u6545\u4e8b\uff0c\u610f\u4e49\u91cd\u5927\u3002"}]}, {"word": "superstitious", "ipa": "/\u02ccsu\u02d0p\u0259r\u02c8st\u026a\u0283\u0259s/", "meanings": {"en": "Having or showing a belief in superstitions.", "cn": "\u5177\u6709\u6216\u8868\u73b0\u51fa\u5bf9\u8ff7\u4fe1\u7684\u4fe1\u4ef0\u3002"}, "usage_en": "Describes someone who believes in superstitions and omens.", "usage_cn": "\u63cf\u8ff0\u76f8\u4fe1\u8ff7\u4fe1\u548c\u9884\u5146\u7684\u4eba\u3002", "scene_en": "Someone avoiding walking under a ladder, knocking on wood, carrying a lucky charm.", "scene_cn": "\u6709\u4eba\u907f\u514d\u4ece\u68af\u5b50\u4e0b\u8d70\u8fc7\uff0c\u6572\u6728\u5934\uff0c\u643a\u5e26\u5e78\u8fd0\u7b26\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q7_superstitious_1.png", "P6_vocabulary_exercises_16_Q7_superstitious_2.png"], "examples": [{"en": "Although I am not superstitious, I still avoid walking under ladders just to be safe.", "cn": "\u867d\u7136\u6211\u4e0d\u8ff7\u4fe1\uff0c\u4f46\u6211\u8fd8\u662f\u907f\u514d\u4ece\u68af\u5b50\u4e0b\u8d70\u8fc7\uff0c\u53ea\u662f\u4e3a\u4e86\u5b89\u5168\u8d77\u89c1\u3002"}, {"en": "She is very superstitious and always carries a lucky charm to ward off bad luck.", "cn": "\u5979\u975e\u5e38\u8ff7\u4fe1\uff0c\u603b\u662f\u5e26\u7740\u5e78\u8fd0\u7b26\u6765\u907f\u5f00\u5384\u8fd0\u3002"}]}, {"word": "suspicious", "ipa": "/s\u0259\u02c8sp\u026a\u0283\u0259s/", "meanings": {"en": "Having or showing a cautious distrust of someone or something.", "cn": "\u5bf9\u67d0\u4eba\u6216\u67d0\u4e8b\u62b1\u6709\u6216\u8868\u73b0\u51fa\u8c28\u614e\u7684\u4e0d\u4fe1\u4efb\u3002"}, "usage_en": "Describes someone who is distrustful and questions the motives of others.", "usage_cn": "\u63cf\u8ff0\u4e0d\u4fe1\u4efb\u4ed6\u4eba\u5e76\u8d28\u7591\u4ed6\u4eba\u52a8\u673a\u7684\u4eba\u3002", "scene_en": "A detective investigating a crime scene, someone looking over their shoulder, a guarded expression.", "scene_cn": "\u4e00\u540d\u4fa6\u63a2\u8c03\u67e5\u72af\u7f6a\u73b0\u573a\uff0c\u6709\u4eba\u56de\u5934\u770b\uff0c\u4e00\u79cd\u8c28\u614e\u7684\u8868\u60c5\u3002", " cious", "explanation": "Suspicious individuals tend to distrust others and their intentions."}]}, {"id": 8, "stem": "The contractors will be _____ the row of shophouses to make way for a new office building.", "correct_index": 3, "options": [{"word": "extracting", "ipa": "/\u026ak\u02c8str\u00e6kt\u026a\u014b/", "meanings": {"en": "Removing or taking out something, often with some effort or force.", "cn": "\u79fb\u9664\u6216\u53d6\u51fa\u67d0\u7269\uff0c\u901a\u5e38\u9700\u8981\u4e00\u4e9b\u52aa\u529b\u6216\u529b\u91cf\u3002"}, "usage_en": "Used when removing something from a larger context or whole.", "usage_cn": "\u7528\u4e8e\u4ece\u66f4\u5927\u7684\u80cc\u666f\u6216\u6574\u4f53\u4e2d\u79fb\u9664\u67d0\u7269\u3002", "scene_en": "A dentist carefully pulling a tooth, or a miner digging ore from the earth.", "scene_cn": "\u7259\u533b\u5c0f\u5fc3\u5730\u62d4\u7259\uff0c\u6216\u8005\u77ff\u5de5\u4ece\u5730\u4e0b\u6316\u77ff\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q8_extracting_1.png", "P6_vocabulary_exercises_16_Q8_extracting_2.png"], "examples": [{"en": "The dentist is extracting the wisdom tooth causing the patient significant discomfort now.", "cn": "\u7259\u533b\u6b63\u5728\u62d4\u9664\u667a\u9f7f\uff0c\u8fd9\u7ed9\u75c5\u4eba\u5e26\u6765\u4e86\u6781\u5927\u7684\u4e0d\u9002\u3002"}, {"en": "Scientists are extracting DNA samples from ancient bones to study human evolution patterns.", "cn": "\u79d1\u5b66\u5bb6\u4eec\u6b63\u5728\u4ece\u53e4\u4ee3\u9aa8\u9abc\u4e2d\u63d0\u53d6DNA\u6837\u672c\uff0c\u4ee5\u7814\u7a76\u4eba\u7c7b\u8fdb\u5316\u6a21\u5f0f\u3002"}]}, {"word": "damaging", "ipa": "/\u02c8d\u00e6m\u026ad\u0292\u026a\u014b/", "meanings": {"en": "Causing harm or injury to something, reducing its value or effectiveness.", "cn": "\u5bf9\u67d0\u7269\u9020\u6210\u635f\u5bb3\u6216\u4f24\u5bb3\uff0c\u964d\u4f4e\u5176\u4ef7\u503c\u6216\u6548\u7528\u3002"}, "usage_en": "Describes actions that cause physical or non-physical harm.", "usage_cn": "\u63cf\u8ff0\u9020\u6210\u8eab\u4f53\u6216\u975e\u8eab\u4f53\u4f24\u5bb3\u7684\u884c\u4e3a\u3002", "scene_en": "A car crash causing dents and scratches, or a scandal ruining someone's reputation.", "scene_cn": "\u4e00\u573a\u9020\u6210\u51f9\u75d5\u548c\u5212\u75d5\u7684\u8f66\u7978\uff0c\u6216\u662f\u4e00\u573a\u6bc1\u6389\u67d0\u4eba\u540d\u8a89\u7684\u4e11\u95fb\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q8_damaging_1.png", "P6_vocabulary_exercises_16_Q8_damaging_2.png"], "examples": [{"en": "The flood was damaging homes and businesses along the river, causing widespread destruction.", "cn": "\u6d2a\u6c34\u6b63\u5728\u7834\u574f\u6cbf\u6cb3\u7684\u623f\u5c4b\u548c\u4f01\u4e1a\uff0c\u9020\u6210\u5927\u8303\u56f4\u7684\u7834\u574f\u3002"}, {"en": "Spreading false rumors online can be damaging to someone's reputation and mental well-being.", "cn": "\u5728\u7f51\u4e0a\u6563\u5e03\u865a\u5047\u8c23\u8a00\u53ef\u80fd\u4f1a\u635f\u5bb3\u67d0\u4eba\u7684\u58f0\u8a89\u548c\u7cbe\u795e\u5065\u5eb7\u3002"}]}, {"word": "tearing", "ipa": "/\u02c8te\u0259r\u026a\u014b/", "meanings": {"en": "Pulling something apart by force, often resulting in a rip or split.", "cn": "\u7528\u529b\u5c06\u67d0\u7269\u62c9\u5f00\uff0c\u901a\u5e38\u5bfc\u81f4\u6495\u88c2\u6216\u5206\u88c2\u3002"}, "usage_en": "Indicates a forceful separation of materials or emotional distress.", "usage_cn": "\u8868\u793a\u6750\u6599\u7684\u5f3a\u884c\u5206\u79bb\u6216\u60c5\u7eea\u4e0a\u7684\u75db\u82e6\u3002", "scene_en": "Ripping a piece of paper, or the emotional pain of tearing apart a relationship.", "scene_cn": "\u6495\u6bc1\u4e00\u5f20\u7eb8\uff0c\u6216\u8005\u4e00\u6bb5\u5173\u7cfb\u7834\u88c2\u5e26\u6765\u7684\u60c5\u611f\u75db\u82e6\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q8_tearing_1.png", "P6_vocabulary_exercises_16_Q8_tearing_2.png"], "examples": [{"en": "The strong winds were tearing the sails of the boat, making it difficult to navigate safely.", "cn": "\u5f3a\u98ce\u6b63\u5728\u6495\u88c2\u8239\u7684\u5e06\uff0c\u4f7f\u5176\u96be\u4ee5\u5b89\u5168\u822a\u884c\u3002"}, {"en": "The emotional stress of the divorce was tearing the family apart, affecting everyone involved.", "cn": "\u79bb\u5a5a\u7684\u60c5\u611f\u538b\u529b\u6b63\u5728\u6495\u88c2\u8fd9\u4e2a\u5bb6\u5ead\uff0c\u5f71\u54cd\u5230\u6240\u6709\u76f8\u5173\u4eba\u5458\u3002"}]}, {"word": "demolishing", "ipa": "/d\u026a\u02c8m\u0252l\u026a\u0283\u026a\u014b/", "meanings": {"en": "Completely destroying or tearing down a building or other structure.", "cn": "\u5b8c\u5168\u6467\u6bc1\u6216\u62c6\u9664\u5efa\u7b51\u7269\u6216\u5176\u4ed6\u7ed3\u6784\u3002"}, "usage_en": "Used for the complete destruction of structures, often for redevelopment.", "usage_cn": "\u7528\u4e8e\u5b8c\u5168\u6467\u6bc1\u5efa\u7b51\u7269\uff0c\u901a\u5e38\u662f\u4e3a\u4e86\u91cd\u5efa\u3002", "scene_en": "A building being torn down with explosives, or a wrecking ball hitting a wall.", "scene_cn": "\u4e00\u5ea7\u5efa\u7b51\u7269\u88ab\u70b8\u836f\u70b8\u6bc1\uff0c\u6216\u8005\u4e00\u4e2a\u7834\u574f\u7403\u51fb\u4e2d\u5899\u58c1\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q8_demolishing_1.png", "P6_vocabulary_exercises_16_Q8_demolishing_2.png"], "examples": [{"en": "The city decided on demolishing the old stadium to make room for a modern sports complex.", "cn": "\u8be5\u5e02\u51b3\u5b9a\u62c6\u9664\u65e7\u4f53\u80b2\u573a\uff0c\u4e3a\u73b0\u4ee3\u4f53\u80b2\u4e2d\u5fc3\u817e\u51fa\u7a7a\u95f4\u3002"}, {"en": "After the earthquake, the authorities were demolishing unsafe buildings to prevent further accidents.", "cn": "\u5730\u9707\u8fc7\u540e\uff0c\u5f53\u5c40\u6b63\u5728\u62c6\u9664\u4e0d\u5b89\u5168\u7684\u5efa\u7b51\u7269\uff0c\u4ee5\u9632\u6b62\u8fdb\u4e00\u6b65\u7684\u4e8b\u6545\u3002"}]}], "synonym_cn": "\u6467\u6bc1, \u62c6\u9664, \u7834\u574f", "socratic_questions": [{"question": "If a dentist needs to remove a problematic tooth, would they be _____ it?", "options": ["extracting", "damaging", "tearing", "demolishing"], "correct_answer": "extracting", "explanation": "Extracting means to remove or take out, fitting the context of removing a tooth."}, {"question": "If vandals spray paint on a public monument, are they _____ it?", "options": ["extracting", "damaging", "tearing", "demolishing"], "correct_answer": "damaging", "explanation": "Damaging implies causing harm or impairment to something."}, {"question": "If you are angry and rip a piece of paper into shreds, are you _____ it?", "options": ["extracting", "damaging", "tearing", "demolishing"], "correct_answer": "tearing", "explanation": "Tearing means to pull apart or rip something, often with force."}, {"question": "If a building is unsafe and needs to be completely taken down, are they _____ it?", "options": ["extracting", "damaging", "tearing", "demolishing"], "correct_answer": "demolishing", "explanation": "Demolishing means to completely destroy or tear down a structure."}]}, {"id": 9, "stem": "She wore her hat to _____ her newly styled hair from the wind.", "correct_index": 3, "options": [{"word": "shelter", "ipa": "/\u02c8\u0283elt\u0259r/", "meanings": {"en": "A place giving temporary protection from bad weather or danger.", "cn": "\u63d0\u4f9b\u4e34\u65f6\u4fdd\u62a4\uff0c\u514d\u53d7\u6076\u52a3\u5929\u6c14\u6216\u5371\u9669\u7684\u5730\u65b9\u3002"}, "usage_en": "Used to describe a place or structure that provides protection.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u63d0\u4f9b\u4fdd\u62a4\u7684\u573a\u6240\u6216\u7ed3\u6784\u3002", "scene_en": "A bus stop with a roof, people huddling under an awning during a rainstorm.", "scene_cn": "\u5e26\u5c4b\u9876\u7684\u5df4\u58eb\u7ad9\uff0c\u4eba\u4eec\u5728\u66b4\u98ce\u96e8\u4e2d\u805a\u96c6\u5728\u96e8\u68da\u4e0b\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q9_shelter_1.png", "P6_vocabulary_exercises_16_Q9_shelter_2.png"], "examples": [{"en": "The old barn offered a much-needed shelter from the sudden downpour that surprised us.", "cn": "\u65e7\u8c37\u4ed3\u4e3a\u6211\u4eec\u63d0\u4f9b\u4e86\u6025\u9700\u7684\u5e87\u62a4\uff0c\u8eb2\u907f\u4e86\u7a81\u5982\u5176\u6765\u7684\u503e\u76c6\u5927\u96e8\u3002"}, {"en": "During the earthquake, we sought shelter under a sturdy table for safety and protection.", "cn": "\u5730\u9707\u671f\u95f4\uff0c\u4e3a\u4e86\u5b89\u5168\u548c\u4fdd\u62a4\uff0c\u6211\u4eec\u5728\u575a\u56fa\u7684\u684c\u5b50\u4e0b\u5bfb\u6c42\u5e87\u62a4\u3002"}]}, {"word": "cover", "ipa": "/\u02c8k\u028cv\u0259r/", "meanings": {"en": "Place something over or in front of (something) so as to conceal or protect it.", "cn": "\u5c06\u67d0\u7269\u653e\u7f6e\u5728\uff08\u67d0\u7269\uff09\u4e4b\u4e0a\u6216\u524d\u65b9\uff0c\u4ee5\u9690\u85cf\u6216\u4fdd\u62a4\u5b83\u3002"}, "usage_en": "Used to describe the act of placing something over something else.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5c06\u67d0\u7269\u653e\u7f6e\u5728\u53e6\u4e00\u7269\u4e4b\u4e0a\u7684\u884c\u4e3a\u3002", "scene_en": "A book with a dust jacket, a table with a tablecloth, a person under a blanket.", "scene_cn": "\u5e26\u6709\u5c01\u9762\u7684\u4e66\uff0c\u5e26\u6709\u684c\u5e03\u7684\u684c\u5b50\uff0c\u6bef\u5b50\u4e0b\u7684\u4eba\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q9_cover_1.png", "P6_vocabulary_exercises_16_Q9_cover_2.png"], "examples": [{"en": "Please cover the food with plastic wrap to keep it fresh in the refrigerator.", "cn": "\u8bf7\u7528\u4fdd\u9c9c\u819c\u76d6\u4f4f\u98df\u7269\uff0c\u4ee5\u4fdd\u6301\u5176\u5728\u51b0\u7bb1\u4e2d\u7684\u65b0\u9c9c\u5ea6\u3002"}, {"en": "The thick blanket will cover you and keep you warm during the cold winter nights.", "cn": "\u539a\u539a\u7684\u6bef\u5b50\u4f1a\u76d6\u4f4f\u4f60\uff0c\u8ba9\u4f60\u5728\u5bd2\u51b7\u7684\u51ac\u591c\u91cc\u4fdd\u6301\u6e29\u6696\u3002"}]}, {"word": "hide", "ipa": "/ha\u026ad/", "meanings": {"en": "Put or keep out of sight; conceal from the view or notice of others.", "cn": "\u653e\u7f6e\u6216\u4fdd\u6301\u5728\u89c6\u7ebf\u4e4b\u5916\uff1b \u9690\u85cf\u8d77\u6765\uff0c\u4e0d\u8ba9\u522b\u4eba\u770b\u5230\u6216\u6ce8\u610f\u5230\u3002"}, "usage_en": "Used to describe the act of concealing something from sight.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u5c06\u67d0\u7269\u9690\u85cf\u8d77\u6765\u7684\u884c\u4e3a\u3002", "scene_en": "A child hiding behind a tree, a treasure chest buried in the sand.", "scene_cn": "\u4e00\u4e2a\u5b69\u5b50\u8eb2\u5728\u6811\u540e\uff0c\u4e00\u4e2a\u57cb\u5728\u6c99\u5b50\u91cc\u7684\u5b9d\u7bb1\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q9_hide_1.png", "P6_vocabulary_exercises_16_Q9_hide_2.png"], "examples": [{"en": "She tried to hide her disappointment when she didn't win the first prize at the competition.", "cn": "\u5f53\u5979\u5728\u6bd4\u8d5b\u4e2d\u6ca1\u6709\u83b7\u5f97\u4e00\u7b49\u5956\u65f6\uff0c\u5979\u8bd5\u56fe\u9690\u85cf\u5979\u7684\u5931\u671b\u3002"}, {"en": "The squirrel likes to hide nuts in the garden for the winter months, preparing for scarcity.", "cn": "\u677e\u9f20\u559c\u6b22\u5728\u82b1\u56ed\u91cc\u85cf\u575a\u679c\u8fc7\u51ac\uff0c\u4e3a\u7a00\u7f3a\u505a\u51c6\u5907\u3002"}]}, {"word": "protect", "ipa": "/pr\u0259\u02c8tekt/", "meanings": {"en": "Keep safe from harm or injury.", "cn": "\u4fdd\u62a4...\u514d\u53d7\u4f24\u5bb3\u6216\u635f\u4f24\u3002"}, "usage_en": "Used to describe the act of keeping something safe from harm.", "usage_cn": "\u7528\u4e8e\u63cf\u8ff0\u4fdd\u62a4\u67d0\u7269\u514d\u53d7\u4f24\u5bb3\u7684\u884c\u4e3a\u3002", "scene_en": "A bodyguard shielding someone, a helmet protecting a head, sunscreen protecting skin.", "scene_cn": "\u4fdd\u9556\u4fdd\u62a4\u67d0\u4eba\uff0c\u5934\u76d4\u4fdd\u62a4\u5934\u90e8\uff0c\u9632\u6652\u971c\u4fdd\u62a4\u76ae\u80a4\u3002", "image_paths": ["P6_vocabulary_exercises_16_Q9_protect_1.png", "P6_vocabulary_exercises_16_Q9_protect_2.png"], "examples": [{"en": "Wearing a helmet will protect your head from serious injury during a bicycle accident.", "cn": "\u6234\u5934\u76d4\u53ef\u4ee5\u4fd
