<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全彩标本卡 · World's Largest Deserts</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --forest:#4a2f1c; --clay:#d76549; --amber:#eab13d; --paper:#f5eee2; --muted:#71695d; }
    body { margin:0; background:linear-gradient(145deg,#d6c7ad,#e8dfd1); font-family:"Nunito","Noto Sans SC",sans-serif; color:var(--forest); }
    .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:14px 18px; background:var(--forest); color:#fff; }
    .bar a, .bar button { color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:8px 14px; text-decoration:none; font-weight:800; cursor:pointer; }
    .card { max-width:900px; margin:18px auto; background:#fffdf8; border-radius:22px; overflow:hidden; box-shadow:0 16px 40px rgba(74,47,28,.12); page-break-after:always; }
    .card img { width:100%; height:min(52vw,420px); object-fit:cover; display:block; }
    .card .body { padding:22px 24px 28px; }
    .card h1 { margin:0; font-family:"Fraunces",serif; font-size:clamp(2rem,5vw,3.4rem); }
    .zh { color:var(--clay); font-weight:900; font-size:1.2rem; margin:8px 0 14px; }
    .phonemes { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px; }
    .phonemes span { min-width:42px; padding:6px 8px; border-radius:10px; background:#fff1d2; text-align:center; font-weight:900; font-size:.82rem; }
    .note { border-left:5px solid var(--amber); padding:10px 14px; background:#fff8e8; border-radius:0 12px 12px 0; }
    .note small { display:block; color:var(--muted); margin-top:4px; }
    @media print { .bar{display:none!important} body{background:#fff} .card{box-shadow:none;border:1px solid #ddd;margin:0;border-radius:0} }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../index.html">⌂ 大本营</a>
    <button onclick="print()">打印全彩标本卡</button>
    <span style="margin-left:auto;opacity:.75;font-size:.82rem;">一词一页 · A4</span>
  </div>
  <div id="cards"></div>
  <script src="../worlds-largest-deserts-courseware/assets/data/words-data.js"></script>
  <script>
    document.getElementById("cards").innerHTML = DESERT_COURSE.words.map(function(w,i){
      var key = (w.image || w.word || "desert").toLowerCase();
      var s = (w.sentences && w.sentences[0]) || {en:"",zh:""};
      var ph = (w.phonemes||[]).map(function(p){return "<span><b>"+p.letter+"</b><br><small>"+p.symbol+"</small></span>";}).join("");
      return '<article class="card"><img src="../worlds-largest-deserts-courseware/images/words/'+key+'.jpg" onerror="this.src=\'../worlds-largest-deserts-courseware/images/words/desert.jpg\'" alt="'+w.word+'"><div class="body"><div style="color:var(--muted);font-weight:900;">SPECIMEN '+String(i+1).padStart(2,"0")+' / '+DESERT_COURSE.words.length+'</div><h1>'+w.word+'</h1><div class="zh">'+w.chinese+'</div><div class="phonemes">'+ph+'</div><div class="note">'+s.en+'<small>'+s.zh+'</small></div></div></article>';
    }).join("");
  </script>
</body>
</html>
