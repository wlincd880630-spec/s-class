<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>World's Largest Deserts · 互动课件</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/desert-course.css" />
  <script src="audio/audio-manifest.js"></script>
  <script src="audio/local-audio.js"></script>
  <script src="../../assets/ng-azure-tts-enhance.js"></script>
  <script>NgAzureTTS.enhance("LocalAudio");</script>
  <style>
    .book-top { display:flex; flex-wrap:wrap; justify-content:space-between; gap:0.75rem; align-items:flex-start; margin-bottom:0.75rem; padding-bottom:0.5rem; border-bottom:1px solid rgba(196,120,42,.25); }
    .book-title { font-family: var(--display); font-size:clamp(1.35rem,3vw,1.85rem); color:var(--accent-dark); margin:0; }
    .book-sub { color:var(--muted); font-size:0.88rem; margin-top:0.25rem; }
    .nav-bar { display:flex; flex-wrap:wrap; gap:0.4rem; }
    .story-layout { display:grid; grid-template-columns: 1.1fr 1fr; gap:0.85rem; align-items:stretch; }
    .story-art { position:relative; border-radius:14px; overflow:hidden; min-height:220px; background:#efe4d4; }
    .story-art img { width:100%; height:100%; object-fit:cover; display:block; min-height:220px; animation: fadeRise .55s ease; }
    @keyframes fadeRise { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
    .story-text { display:flex; flex-direction:column; gap:0.55rem; }
    .story-en { font-family: var(--display); font-size:clamp(1.05rem,2.2vw,1.35rem); line-height:1.55; color:var(--ink); }
    .story-zh { color:var(--muted); font-size:0.95rem; }
    .page-dots { display:flex; flex-wrap:wrap; gap:0.35rem; margin-top:auto; }
    .page-dot { width:1.6rem; height:1.6rem; border-radius:50%; border:2px solid var(--accent-light); background:#fff; font-size:0.7rem; font-weight:700; cursor:pointer; color:var(--accent-dark); }
    .page-dot.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .focus-words { display:flex; flex-wrap:wrap; gap:0.35rem; }
    .focus-words span { background:#f7efe3; border-radius:999px; padding:0.2rem 0.55rem; font-size:0.78rem; font-weight:700; color:var(--accent-dark); }
    .rank-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    .rank-table th, .rank-table td { padding:0.4rem 0.45rem; text-align:left; border-bottom:1px solid rgba(196,120,42,.15); }
    .rank-table th { color:var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:.06em; }
    .badge { display:inline-block; padding:0.12rem 0.45rem; border-radius:999px; font-size:0.72rem; font-weight:700; }
    .badge-hot { background:#fde7c7; color:#8a5120; }
    .badge-polar { background:#d7eef5; color:#1a5a6e; }
    .badge-cold { background:#e8e4f0; color:#4a3d6b; }
    .panel { display:none; }
    .panel.active { display:block; animation: fadeRise .4s ease; }
    @media (max-width:820px) { .story-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body class="tv-layout">
  <a class="back-link" href="../index.html" style="position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:20;background:rgba(255,255,255,.95);color:var(--accent-dark);border-color:var(--accent);"><i class="fa-solid fa-house"></i> 课程首页</a>
  <div class="tv-frame">
    <div class="tv-inner">
      <div class="book-top">
        <div>
          <h1 class="book-title" id="courseTitle">World's Largest Deserts</h1>
          <p class="book-sub" id="courseSub">Britannica · Lexile 600 · 小学五年级</p>
        </div>
        <div class="nav-bar">
          <button class="btn btn-primary" data-panel="story"><i class="fa-solid fa-book"></i> 课文</button>
          <button class="btn btn-secondary" data-panel="rank"><i class="fa-solid fa-list-ol"></i> 十大沙漠</button>
          <button class="btn btn-ice" data-panel="facts"><i class="fa-solid fa-lightbulb"></i> 知识点</button>
          <a class="btn btn-secondary" href="learn.html"><i class="fa-solid fa-spell-check"></i> 单词</a>
          <a class="btn btn-secondary" href="activities.html"><i class="fa-solid fa-gamepad"></i> 活动</a>
        </div>
      </div>

      <section class="panel active" id="panel-story">
        <div class="card story-layout">
          <div class="story-art">
            <img id="storyImg" src="images/story/cover.jpg" alt="story" onerror="this.onerror=null;this.src='images/words/desert.jpg'">
          </div>
          <div class="story-text">
            <div class="focus-words" id="focusWords"></div>
            <p class="story-en" id="storyEn"></p>
            <p class="story-zh" id="storyZh"></p>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
              <button class="btn btn-primary" id="btnRead"><i class="fa-solid fa-volume-high"></i> 朗读本页</button>
              <button class="btn btn-secondary" id="btnPrevPage"><i class="fa-solid fa-chevron-left"></i> 上一页</button>
              <button class="btn btn-secondary" id="btnNextPage">下一页 <i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="page-dots" id="pageDots"></div>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-rank">
        <div class="card">
          <h2 style="font-family:var(--display);color:var(--accent-dark);margin-bottom:0.65rem;">The 10 Largest Deserts · 世界十大沙漠</h2>
          <p style="color:var(--muted);font-size:0.9rem;margin-bottom:0.75rem;">面积数据来自 Encyclopaedia Britannica（约数）。</p>
          <table class="rank-table" id="rankTable">
            <thead><tr><th>#</th><th>Desert</th><th>沙漠</th><th>Area (km²)</th><th>Type</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="panel-facts">
        <div class="card" id="factsBox"></div>
      </section>
    </div>
  </div>
  <script src="assets/data/words-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    const C = DESERT_COURSE;
    document.getElementById('courseTitle').textContent = C.title + ' · ' + C.titleZh;
    document.getElementById('courseSub').textContent = C.source + ' · Lexile ' + C.lexile + ' · ' + C.grade;
    let page = 0;
    const pages = C.story.pages;
    function renderPage() {
      const p = pages[page];
      const img = document.getElementById('storyImg');
      img.style.animation = 'none'; img.offsetHeight; img.style.animation = '';
      img.src = desertImagePath(p.imageKey, 'story');
      document.getElementById('storyEn').textContent = p.en;
      document.getElementById('storyZh').textContent = p.zh;
      document.getElementById('focusWords').innerHTML = (p.focusWords||[]).map(w => `<span>${w}</span>`).join('');
      document.querySelectorAll('.page-dot').forEach((d,i)=>d.classList.toggle('active', i===page));
    }
    const dots = document.getElementById('pageDots');
    pages.forEach((_,i)=>{
      const b=document.createElement('button'); b.className='page-dot'+(i===0?' active':''); b.textContent=i+1;
      b.onclick=()=>{page=i;renderPage();}; dots.appendChild(b);
    });
    document.getElementById('btnPrevPage').onclick=()=>{page=(page-1+pages.length)%pages.length;renderPage();};
    document.getElementById('btnNextPage').onclick=()=>{page=(page+1)%pages.length;renderPage();};
    document.getElementById('btnRead').onclick=()=>speakText(pages[page].en);
    renderPage();

    document.querySelectorAll('[data-panel]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        document.getElementById('panel-'+btn.dataset.panel).classList.add('active');
      });
    });

    const tb = document.querySelector('#rankTable tbody');
    (C.ranking||[]).forEach(r=>{
      const type = r.type==='hot'?'badge-hot':(r.type==='polar'?'badge-polar':'badge-cold');
      const label = r.type==='hot'?'热沙漠':(r.type==='polar'?'极地':'冷冬');
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r.rank}</td><td><strong>${r.name}</strong></td><td>${r.nameZh}</td><td>${Number(r.km2).toLocaleString()}</td><td><span class="badge ${type}">${label}</span></td>`;
      tb.appendChild(tr);
    });
    document.getElementById('factsBox').innerHTML = '<h2 style="font-family:var(--display);color:var(--accent-dark);margin-bottom:0.75rem;">Key Facts · 知识点</h2>' +
      (C.facts||[]).map((f,i)=>`<div class="sentence-item"><div class="sentence-en">${i+1}. ${f.en}
 <button class="speak-mini" onclick='speakText(${JSON.stringify(f.en)})'><i class="fa-solid fa-volume-high"></i></button></div><div class="sentence-zh">${f.zh}</div></div>`).join('');
  </script>
</body>
</html>
