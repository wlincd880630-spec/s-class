<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>课文打印 · World's Largest Deserts</title>
  <link rel="stylesheet" href="assets/css/desert-course.css" />
  <style>
    @media print { .no-print{display:none!important} body{background:#fff} .tv-frame{box-shadow:none;width:100%;height:auto;aspect-ratio:auto} }
    .page { page-break-after:always; padding:1rem; }
    .page img { width:100%; max-height:280px; object-fit:cover; border-radius:12px; }
  </style>
</head>
<body class="tv-layout">
  <div class="tv-frame" style="height:auto;aspect-ratio:auto;max-height:none;">
    <header class="top-bar no-print">
      <a class="back-link" href="index.html">返回课件</a>
      <h1>课文打印</h1>
      <button class="back-link" onclick="print()">打印</button>
    </header>
    <div class="tv-inner" id="out"></div>
  </div>
  <script src="assets/data/words-data.js"></script>
  <script>
    document.getElementById('out').innerHTML = DESERT_COURSE.story.pages.map((p,i)=>`
      <div class="page card">
        <h2 style="color:var(--accent-dark)">Page ${i+1}</h2>
        <img src="${desertImagePath(p.imageKey,'story')}" onerror="this.src='images/words/desert.jpg'">
        <p class="story-en" style="margin-top:0.75rem;font-size:1.15rem;font-weight:600;">${p.en}</p>
        <p class="sentence-zh">${p.zh}</p>
      </div>`).join('');
  </script>
</body>
</html>
