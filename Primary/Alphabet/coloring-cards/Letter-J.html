<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 02 · Letter J 涂色卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coloring-shared.css">
</head>
<body class="coloring-body">
    <div class="coloring-toolbar no-print">
        <a class="btn-ghost" href="../Lesson 02 - 作业 - 字母涂色卡片.html">← 全部字母</a>
        <a class="btn-all" href="Print-All.html">打印全部 26 页</a>
        <button type="button" class="btn-teal" onclick="window.print()">打印本页 🖨️</button>
    </div>

    <div class="coloring-sheet" style="--hue:40">

        <header class="sheet-top">
            <div class="letter-trace-row" aria-label="Colour the letters">
                <span class="trace-letter cap">J</span>
                <span class="trace-letter sm">j</span>
            </div>
        </header>
        <div class="sheet-main">
            <div class="sheet-left">
                <div class="art-box"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Alphabet/assets/coloring/J-juice.png" alt="Juice" width="320" height="320"></div>
                <div class="art-box"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Alphabet/assets/coloring/J-jam.png" alt="Jam" width="320" height="320"></div>
            </div>
            <div class="sheet-right">
                <div class="word-block">
                    <div class="trace-word">juice</div>
                    <div class="word-zh">果汁</div>
                </div>
                <div class="word-block">
                    <div class="trace-word">jam</div>
                    <div class="word-zh">果酱</div>
                </div>
            </div>
        </div>
    </div>
