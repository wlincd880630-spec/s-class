<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lesson 02 · Letter H 涂色卡片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coloring-shared.css">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body.coloring-body {
            min-height: 100dvh;
            overflow-x: clip;
            -webkit-tap-highlight-color: rgba(126, 87, 194, 0.12);
            padding-bottom: max(48px, env(safe-area-inset-bottom));
        }
        .coloring-toolbar {
            padding-top: max(14px, env(safe-area-inset-top));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
        }
        .coloring-toolbar a,
        .coloring-toolbar button {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .page-viewport {
            width: min(210mm, calc(100vw - 24px));
            margin: 16px auto;
            overflow: hidden;
        }
        .page-viewport .coloring-sheet {
            margin: 0;
        }
        @media screen and (max-width: 720px) {
            .coloring-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .coloring-toolbar a,
            .coloring-toolbar button {
                width: 100%;
            }
            .page-viewport {
                width: calc(100vw - 16px);
                margin: 12px auto;
            }
        }
        @media (hover: none) and (pointer: coarse) {
            .coloring-toolbar a:hover,
            .coloring-toolbar button:hover { transform: none; }
        }
        @media print {
            body.coloring-body { padding-bottom: 0; }
            .page-viewport {
                width: auto;
                height: auto;
                overflow: visible;
                margin: 0;
            }
            .page-viewport .coloring-sheet {
                transform: none !important;
                margin: 20px 0;
            }
        }
    </style>
  <link rel="stylesheet" href="../../assets/primary-responsive.css?v=2" />
</head>
<body class="coloring-body">
    <div class="coloring-toolbar no-print">
        <a class="btn-ghost" href="../Lesson 02 - 作业 - 字母涂色卡片.html">← 全部字母</a>
        <a class="btn-all" href="Print-All.html">打印全部 26 页</a>
        <button type="button" class="btn-teal" onclick="window.print()">打印本页 🖨️</button>
    </div>

    <div class="coloring-sheet" style="--hue:180">

        <header class="sheet-top">
            <div class="letter-trace-row" aria-label="Colour the letters">
                <span class="trace-letter cap">H</span>
                <span class="trace-letter sm">h</span>
            </div>
        </header>
        <div class="sheet-main">
            <div class="sheet-left">
                <div class="art-box"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Alphabet/assets/coloring/H-hat.png" alt="Hat" width="320" height="320"></div>
                <div class="art-box"><img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Alphabet/assets/coloring/H-house.png" alt="House" width="320" height="320"></div>
            </div>
            <div class="sheet-right">
                <div class="word-block">
                    <div class="trace-word">hat</div>
                    <div class="word-zh">帽子</div>
                </div>
                <div class="word-block">
                    <div class="trace-word">house</div>
                    <div class="word-zh">房子</div>
                </div>
            </div>
        </div>
    </div>
    <script>
    (function () {
        var sheet = document.querySelector('.coloring-sheet');
        if (sheet) {
            var vp = document.createElement('div');
            vp.className = 'page-viewport';
            sheet.parentNode.insertBefore(vp, sheet);
            vp.appendChild(sheet);
        }

        function fitPageViewports() {
            if (window.matchMedia('print').matches) return;
            document.querySelectorAll('.page-viewport').forEach(function (vp) {
                var el = vp.querySelector('.coloring-sheet');
                if (!el) return;
                el.style.transform = 'none';
                el.style.transformOrigin = 'top left';
                var naturalW = el.offsetWidth;
                var targetW = vp.clientWidth;
                if (!naturalW || !targetW) return;
                var scale = Math.min(1, targetW / naturalW);
                el.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
                vp.style.height = scale < 1 ? el.offsetHeight * scale + 'px' : 'auto';
            });
        }

        var fitTimer;
        window.addEventListener('resize', function () {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(fitPageViewports, 120);
        });
        window.addEventListener('orientationchange', fitPageViewports);
        window.addEventListener('load', fitPageViewports);
    })();
    </script>
  <script src="../../assets/primary-responsive.js?v=2" defer></script>
</body>
</html>
