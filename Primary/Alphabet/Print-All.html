<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lesson 02 · 打印全部涂色卡片 A–Z</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="coloring-shared.css">
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body.coloring-body {
            min-height: 100dvh;
            overflow-x: clip;
            -webkit-tap-highlight-color: rgba(126, 87, 194, 0.12);
            padding-bottom: max(48px, env(safe-area-inset-bottom));
        }
        .coloring-toolbar {
            padding-top: max(14px, env(safe-area-inset-top));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
        }
        .coloring-toolbar a,
        .coloring-toolbar button {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .print-hint {
            text-align: center;
            color: #78909c;
            font-family: Fredoka, sans-serif;
            margin: 0 auto 12px;
            max-width: 640px;
            line-height: 1.5;
            padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
        }
        #all-sheets {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 0 max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        }
        .page-viewport {
            width: min(210mm, calc(100vw - 24px));
            overflow: hidden;
        }
        .page-viewport .coloring-sheet {
            margin: 0;
        }
        @media screen and (max-width: 720px) {
            .coloring-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .coloring-toolbar a,
            .coloring-toolbar button {
                width: 100%;
            }
            .page-viewport {
                width: calc(100vw - 16px);
            }
        }
        @media (hover: none) and (pointer: coarse) {
            .coloring-toolbar a:hover,
            .coloring-toolbar button:hover { transform: none; }
        }
        @media print {
            body.coloring-body { padding-bottom: 0; }
            #all-sheets {
                padding: 0;
                gap: 0;
            }
            .page-viewport {
                width: auto;
                height: auto;
                overflow: visible;
            }
            .page-viewport .coloring-sheet {
                transform: none !important;
                margin: 0;
            }
        }
    </style>
  <link rel="stylesheet" href="../assets/primary-responsive.css?v=2" />
  <link rel="stylesheet" href="../../scripts/drawing-overlay.css?v=1" />
</head>
<body class="coloring-body">
    <div class="coloring-toolbar no-print">
        <a class="btn-ghost" href="Lesson 02 - 作业 - 字母涂色卡片.html">← 返回索引</a>
        <button type="button" class="btn-all" onclick="exportAllPdf()">📄 导出 PDF (26页)</button>
        <button type="button" class="btn-teal" onclick="preloadThenPrint()">🖨️ 打印 / 另存 PDF</button>
    </div>
    <p class="no-print print-hint">
        共 26 页 A4 · 打印时选 A4、<strong>边距：无</strong>、关闭页眉页脚 · 图片加载完再导出
    </p>
    <div id="all-sheets"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    <script src="lesson02-coloring-data.js"></script>
    <script src="coloring-shared.js"></script>
    <script>
        function renderAll() {
            document.getElementById('all-sheets').innerHTML =
                window.LESSON02_COLORING.map((e) => ColoringCards.buildSheet(e, '')).join('');
        }

        function wrapPageViewports() {
            document.querySelectorAll('#all-sheets .coloring-sheet').forEach(function (sheet) {
                if (sheet.parentElement && sheet.parentElement.classList.contains('page-viewport')) return;
                var vp = document.createElement('div');
                vp.className = 'page-viewport';
                sheet.parentNode.insertBefore(vp, sheet);
                vp.appendChild(sheet);
            });
        }

        function fitPageViewports() {
            if (window.matchMedia('print').matches) return;
            document.querySelectorAll('#all-sheets .page-viewport').forEach(function (vp) {
                var el = vp.querySelector('.coloring-sheet');
                if (!el) return;
                el.style.transform = 'none';
                el.style.transformOrigin = 'top left';
                var naturalW = el.offsetWidth;
                var targetW = vp.clientWidth;
                if (!naturalW || !targetW) return;
                var scale = Math.min(1, targetW / naturalW);
                el.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
                vp.style.height = scale < 1 ? el.offsetHeight * scale + 'px' : 'auto';
            });
        }

        var fitTimer;
        window.addEventListener('resize', function () {
            clearTimeout(fitTimer);
            fitTimer = setTimeout(fitPageViewports, 120);
        });
        window.addEventListener('orientationchange', fitPageViewports);

        function preloadImages() {
            return new Promise((resolve) => {
                const imgs = [...document.querySelectorAll('#all-sheets img')];
                if (!imgs.length) { resolve(); return; }
                let n = 0;
                const done = () => { if (++n >= imgs.length) resolve(); };
                imgs.forEach((img) => {
                    if (img.complete) done();
                    else { img.onload = done; img.onerror = done; }
                });
            });
        }

        function preloadThenPrint() {
            preloadImages().then(() => setTimeout(() => window.print(), 200));
        }

        async function exportAllPdf() {
            const btn = document.querySelector('.btn-all');
            const old = btn ? btn.textContent : '';
            if (btn) { btn.textContent = '生成中…'; btn.disabled = true; }
            await preloadImages();
            await document.fonts.ready.catch(() => {});
            const el = document.getElementById('all-sheets');
            const opt = {
                margin: [0, 0, 0, 0],
                filename: 'Lesson02-Coloring-Cards-A-Z.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    letterRendering: true,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: el.scrollWidth,
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'], after: '.coloring-sheet' },
            };
            try {
                if (typeof html2pdf !== 'undefined') {
                    await html2pdf().set(opt).from(el).save();
                } else {
                    window.print();
                }
            } finally {
                if (btn) { btn.textContent = old; btn.disabled = false; }
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderAll();
            wrapPageViewports();
            fitPageViewports();
            preloadImages().then(fitPageViewports);
        });
    </script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/assets/primary-responsive.js?v=2" defer></script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
