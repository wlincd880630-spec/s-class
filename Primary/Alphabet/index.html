<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alphabet · 课程入口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #7e57c2;
      --accent-dim: #5c6bc0;
      --text: #e8eaed;
      --muted: #9aa5b8;
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.11);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100dvh;
      color: var(--text);
      background: #0d1117;
      line-height: 1.5;
      overflow-x: clip;
      -webkit-tap-highlight-color: rgba(126, 87, 194, 0.12);
    }
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 45% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 50%),
        linear-gradient(180deg, #0a0e14, #121820 45%, #0d1117);
    }
    .page {
      position: relative; z-index: 1;
      max-width: 720px; margin: 0 auto;
      padding:
        max(clamp(1.25rem, 4vw, 2rem), env(safe-area-inset-top))
        max(clamp(1rem, 4vw, 1.75rem), env(safe-area-inset-right))
        max(2rem, env(safe-area-inset-bottom))
        max(clamp(1rem, 4vw, 1.75rem), env(safe-area-inset-left));
    }
    .back {
      display: inline-flex; align-items: center; gap: 0.45rem;
      color: var(--muted); text-decoration: none;
      font-size: 0.88rem; font-weight: 500;
      margin-bottom: 1.25rem;
      min-height: 44px;
      padding: 0.4rem 0.75rem 0.4rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      transition: color .2s, border-color .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .back:hover,
    .back:active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .back img { opacity: 0.85; }
    .hero {
      display: flex; align-items: center; gap: 1.1rem;
      padding: 1.35rem 1.25rem;
      margin-bottom: 2rem;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex-wrap: wrap;
    }
    .hero-icon {
      width: 72px; height: 72px; flex-shrink: 0;
      border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .hero-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-tag {
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.25rem;
    }
    .hero h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700; color: #fff; line-height: 1.15;
    }
    .hero > div:last-child { flex: 1; min-width: 0; }
    .hero p { font-size: clamp(0.85rem, 2.5vw, 0.92rem); color: var(--muted); margin-top: 0.35rem; }
    h2 {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 0.85rem 0.2rem;
    }
    .grid { display: grid; gap: 0.75rem; margin-bottom: 2rem; }
    a.card {
      display: flex; align-items: center; gap: 0.9rem;
      min-height: 56px;
      padding: 1rem 1.05rem;
      border-radius: 14px;
      text-decoration: none; color: inherit;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      transition: transform .3s, border-color .3s, box-shadow .3s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    a.card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
    }
    .card-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 11px; overflow: hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }
    .card-icon img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { flex: 1; min-width: 0; }
    .card-label { font-weight: 600; font-size: 1rem; color: #fff; }
    .card-desc { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .card-arrow {
      width: 36px; height: 36px; min-width: 36px; min-height: 36px; flex-shrink: 0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,.04);
      transition: background .25s;
    }
    a.card:hover .card-arrow { background: var(--accent); border-color: var(--accent); }
    .hw-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.55rem;
    }
    a.hw {
      display: flex; align-items: center; justify-content: center;
      gap: 0.65rem;
      min-height: 48px;
      padding: 0.75rem 0.9rem;
      border-radius: 12px;
      text-decoration: none; color: #fff;
      font-size: 0.9rem; font-weight: 500;
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      transition: transform .2s, border-color .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    a.hw:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    footer {
      margin-top: 2.5rem; padding-top: 1.25rem;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid var(--glass-border);
      text-align: center;
      font-size: 0.78rem; color: var(--muted);
    }

    @media (max-width: 768px) {
      .hero { padding: 1.15rem 1rem; margin-bottom: 1.5rem; }
      .hero-icon { width: 64px; height: 64px; }
      .grid { margin-bottom: 1.5rem; }
      .hw-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 380px) {
      a.card { padding: 0.9rem 0.95rem; gap: 0.75rem; }
      .card-label { font-size: 0.95rem; }
      .card-desc { font-size: 0.76rem; }
      a.hw { font-size: 0.88rem; }
    }

    @media (hover: none) and (pointer: coarse) {
      a.card:hover,
      a.hw:hover {
        transform: none;
        box-shadow: none;
      }
      a.card:active {
        border-color: color-mix(in srgb, var(--accent) 50%, transparent);
        background: color-mix(in srgb, var(--accent) 8%, var(--glass));
        transform: scale(0.99);
      }
      a.card:active .card-arrow {
        background: var(--accent);
        border-color: var(--accent);
      }
      a.hw:active {
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
        transform: scale(0.99);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      a.card, a.hw, .card-arrow { transition: none !important; }
    }
  </style>

<script src="../../scripts/site-nav.js" defer></script>
</head>
