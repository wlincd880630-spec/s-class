<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Magic E · 单词</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* magic-e-word.html · 学单词页（仅本页） */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body[data-page="magic-e-word"] {
        min-height: 100dvh;
        overflow-x: clip;
        -webkit-tap-highlight-color: rgba(79, 172, 247, 0.15);
      }
      body[data-page="magic-e-word"] .topbar {
        padding-top: env(safe-area-inset-top, 0);
      }
      body[data-page="magic-e-word"] .topbar-inner {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      body[data-page="magic-e-word"] .container {
        margin-top: 24px;
        margin-bottom: max(48px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      body[data-page="magic-e-word"] #meWordValue {
        font-size: clamp(2.25rem, 10vw, 3.625rem) !important;
        letter-spacing: clamp(1px, 0.5vw, 4px) !important;
        word-break: break-word;
      }
      body[data-page="magic-e-word"] .hint.cn-hint {
        font-size: clamp(1.15rem, 4.5vw, 1.625rem);
      }
      body[data-page="magic-e-word"] #meWordHint {
        font-size: clamp(0.9rem, 3.5vw, 1rem) !important;
        line-height: 1.6;
      }
      @media (max-width: 860px) {
        body[data-page="magic-e-word"] .topbar-inner {
          flex-wrap: wrap;
          row-gap: 10px;
        }
        body[data-page="magic-e-word"] .nav-buttons {
          display: flex !important;
          flex: 1 1 100%;
          order: 3;
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 4px;
          gap: 8px;
        }
        body[data-page="magic-e-word"] .nav-buttons::-webkit-scrollbar { display: none; }
        body[data-page="magic-e-word"] .nav-chip {
          flex-shrink: 0;
          min-height: 44px;
          padding: 10px 16px;
          font-size: 15px;
        }
        body[data-page="magic-e-word"] .brand { font-size: 24px; }
        body[data-page="magic-e-word"] .hero-layout {
          gap: 24px;
        }
        body[data-page="magic-e-word"] .image-box {
          min-height: 220px;
        }
        body[data-page="magic-e-word"] .image-box img {
          min-height: 200px;
        }
      }
      @media (max-width: 520px) {
        body[data-page="magic-e-word"] .card {
          padding: 20px 16px;
        }
        body[data-page="magic-e-word"] .hero-layout {
          gap: 20px;
        }
        body[data-page="magic-e-word"] .image-box {
          min-height: 200px;
          border-radius: var(--r-lg);
        }
        body[data-page="magic-e-word"] .image-box img {
          min-height: 180px;
        }
        body[data-page="magic-e-word"] .info-row {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }
        body[data-page="magic-e-word"] .info-row .btn,
        body[data-page="magic-e-word"] #btnMeBackList {
          width: 100%;
          min-height: 48px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        body[data-page="magic-e-word"] #btnMeBackList {
          margin-top: 10px !important;
        }
        body[data-page="magic-e-word"] .hint {
          padding: 12px 14px;
          font-size: 1rem;
        }
      }
      @media (hover: none) and (pointer: coarse) {
        body[data-page="magic-e-word"] .btn:hover { transform: none; filter: none; }
        body[data-page="magic-e-word"] .nav-chip:hover { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        body[data-page="magic-e-word"] .btn,
        body[data-page="magic-e-word"] .nav-chip { transition: none !important; }
      }
    </style>
    <link rel="stylesheet" href="../assets/primary-responsive.css?v=2" />
  <link rel="stylesheet" href="../../scripts/drawing-overlay.css?v=1" />
</head>
  <body data-page="magic-e-word">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./magic-e.html">Magic <span>E</span></a>
        <nav id="navMagicE" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card hero-layout" data-accent="blue">
        <div class="image-box">
          <img id="meWordImage" alt="word image" />
        </div>
        <div>
          <h1 id="meWordValue" class="title" style="font-size: 58px; letter-spacing: 4px"></h1>
          <div id="meWordCn" class="hint cn-hint" style="margin-bottom: 14px"></div>
          <div class="info-row" style="margin-top: 0">
            <button id="btnMeSpeakWord" type="button" class="btn primary">🔊 读单词</button>
            <button id="btnMeShowCn" type="button" class="btn orange">🈳 显示中文</button>
          </div>
          <div class="divider"></div>
          <div class="info-row" style="margin-top: 0">
            <a id="btnMeWordPrev" class="btn soft sm" href="#">◀ 上一个</a>
            <a id="btnMeToSentence" class="btn primary sm" href="#">📝 例句</a>
            <a id="btnMeWordNext" class="btn success sm" href="#">下一个 ▶</a>
          </div>
          <a id="btnMeBackList" class="btn soft sm" href="#" style="margin-top: 14px; display: inline-block">📋 返回本组列表</a>
          <div class="hint" id="meWordHint" style="margin-top: 16px; font-size: 16px; color: var(--text-lite)"></div>
        </div>
      </section>
    </main>
    <script src="./magic-e-data.js"></script>
    <script src="./magic-e-app.js"></script>
    <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/assets/primary-responsive.js?v=2" defer></script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
