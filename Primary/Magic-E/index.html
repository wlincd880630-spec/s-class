    <style>
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Nunito", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background: linear-gradient(160deg, #e8f5e9 0%, #e3f2fd 50%, #f3e5f5 100%);
        color: #37474f;
        overflow-x: clip;
        -webkit-tap-highlight-color: rgba(67, 160, 71, 0.12);
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 40px rgba(55, 71, 79, 0.12);
      }
      h1 {
        font-size: clamp(1.1rem, 4vw, 1.35rem);
        font-weight: 800;
        margin-bottom: 8px;
      }
      p {
        font-size: 0.92rem;
        color: #607d8b;
        line-height: 1.55;
        margin-bottom: 18px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 10px 24px;
        border-radius: 999px;
        background: #43a047;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
      }
      a:active { background: #2e7d32; }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #c8e6c9;
        border-top-color: #43a047;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; border-top-color: #81c784; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="../assets/primary-responsive.css?v=1" />
