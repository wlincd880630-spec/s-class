    .book-title em { color: var(--ng-gold-dim); font-style: normal; font-weight: 800; }
    .book-sub { color: var(--ink-soft); font-size: clamp(0.7rem, 1.1vw, 0.86rem); margin: 0.2rem 0 0.15rem; font-weight: 500; }

    @keyframes ok-pop {
      0%   { transform: scale(0.12) translateY(0.35em) rotate(-7deg); opacity: 0; }
      42%  { transform: scale(1.22) translateY(-0.1em) rotate(2.5deg); opacity: 1; }
      68%  { transform: scale(0.92) translateY(0) rotate(0); }
      88%  { transform: scale(1.04) translateY(0) rotate(0); }
      100% { transform: scale(1) translateY(0) rotate(0); }
    }
    @keyframes ok-glow {
      0%   { filter: drop-shadow(0 0 0 transparent); }
      25%  { filter: drop-shadow(0 0 3px rgba(255, 240, 160, 0.95)) drop-shadow(0 0 18px rgba(40, 200, 90, 0.6)) drop-shadow(0 0 8px rgba(255, 200, 50, 0.45)); }
      55%  { filter: drop-shadow(0 0 6px rgba(30, 160, 70, 0.75)) drop-shadow(0 0 14px rgba(200, 240, 100, 0.4)); }
      100% { filter: drop-shadow(0 0 1px rgba(20, 120, 50, 0.35)); }

    @keyframes ok-tint {

      100% { background: transparent; box-shadow: 0 0 0 0 rgba(30, 180, 80, 0), 0 0 0 0 rgba(255, 220, 80, 0); }
    }
    @keyframes ok-spark {
      0%   { opacity: 0; transform: scale(0) rotate(0deg); }
      35%  { opacity: 1; transform: scale(1.15) rotate(18deg); }
      100% { opacity: 0; transform: scale(0.75) rotate(30deg); }
    }
    @keyframes view-msg-ok {
      0%   { background-color: transparent; box-shadow: none; }

      45%  { background-color: rgba(255, 230, 120, 0.12); box-shadow: inset 0 0 0 2px rgba(200, 180, 50, 0.2), 0 0 20px rgba(255, 210, 60, 0.15); }
      100% { background-color: transparent; box-shadow: none; }
    }
    .ok {
      color: #0d6b24; font-weight: 800; font-size: 1.1em; letter-spacing: 0.04em;
      display: inline-block; vertical-align: middle; position: relative; z-index: 0;
      line-height: 1.2; padding: 0.12em 0.32em; margin: -0.12em 0; border-radius: 0.4em;
      transform-origin: 50% 60%;
      animation: ok-pop 0.8s cubic-bezier(0.32, 1.6, 0.52, 1) both, ok-glow 1.15s ease-out 0.04s both, ok-tint 0.95s ease-out 0.05s both;
    }
    .ok::before,
    .ok::after {
      content: "✦"; position: absolute; font-size: 0.5em; line-height: 1; color: #c9a008;
      pointer-events: none; z-index: 1; text-shadow: 0 0 6px rgba(255, 250, 200, 0.8);
    }
    .ok::before { top: -0.15em; left: 0.05em; animation: ok-spark 0.88s ease-out 0.12s both; }
    .ok::after  { content: "✧"; bottom: 0.05em; right: 0.02em; font-size: 0.45em; animation: ok-spark 0.88s ease-out 0.3s both; }

    /* 全屏：答对庆祝 */
    @keyframes ok-cele-bg {

    @keyframes ok-cele-sub {

    .ok-celebrate {
      position: fixed; inset: 0; z-index: 50000; width: 100vw; height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.25rem;
      pointer-events: none; box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 0; visibility: hidden; transition: opacity 0.18s ease, visibility 0.18s;

    .ok-celebrate.is-on { opacity: 1; visibility: visible; }
    .ok-celebrate__bg {

      width: 140vmax; height: 2.5rem; margin-left: -70vmax; margin-top: -1.25rem;
      background: linear-gradient(90deg, transparent, rgba(255, 250, 200, 0.4), rgba(100, 220, 150, 0.25), transparent);
      border-radius: 0.2rem; transform-origin: 50% 50%; opacity: 0;

    .ok-celebrate__ray.n1 { transform: rotate(0deg); animation: ok-cele-ray 0.7s ease-out 0.02s 1; }
    .ok-celebrate__ray.n2 { transform: rotate(45deg); animation: ok-cele-ray 0.72s ease-out 0.04s 1; }
    .ok-celebrate__ray.n3 { transform: rotate(90deg); animation: ok-cele-ray 0.7s ease-out 0.06s 1; }

        cands.forEach(function (oo) {
          d = document.createElement("button");
          d.type = "button";
          d.className = "opt-img";
          (function (oo2, btn) {
            var i2a = new Image();
            i2a.className = "opt-thumb";
            i2a.alt = oo2.key;
            i2a.src = wordImg(oo2);
            i2a.onerror = function () { i2a.remove(); var sp = document.createElement("span"); sp.className = "opt-emoji"; sp.textContent = oo2.emoji; btn.appendChild(sp); };
            btn.appendChild(i2a);
            btn._key = oo2.key;
            btn.addEventListener("click", function () {
              pickImg = btn._key;
              row.querySelectorAll(".opt-img").forEach(function (x) { x.classList.remove("on"); });
              btn.classList.add("on");
            });
          })(oo, d);
          row.appendChild(d);
        });
        s = document.createElement("p");
        s.className = "review-word-bling";
        s.textContent = w.key;
        p = document.createElement("div");
        p.className = "btns";
        p.innerHTML = "<button type='button' class='btn' id='rHear1'>再听单词</button> <button type='button' class='btn primary' id='rOk1'>我选好了</button>";
        block = document.createElement("div");
        block.className = "review-center-block review-block--pick3";
        block.appendChild(s);
        block.appendChild(row);
        block.appendChild(p);
        body.appendChild(block);
        document.getElementById("rHear1").onclick = function () { speakText(w.key, { slow: true }); };
        document.getElementById("rOk1").onclick = function () {
          var rEl = document.getElementById("rMsg");
          if (pickImg === w.key) { rEl.innerHTML = "<span class='ok'>对！</span>"; showOkCelebrate(); } else { rEl.innerHTML = "<span class='bad'>再选选</span>"; }
        };
        speakText(w.key, { slow: true });
      } else if (mode === "zhPick3") {
        q.textContent = "「" + w.key + "」的中文应该是哪一个？三选一。";
        zhWrong = [];
        cands = shuffled(WORDS.filter(function (o) { return o.key !== w.key; }));
        for (i2 = 0; i2 < cands.length; i2++) {
          if (cands[i2].zh === w.zh) continue;
          if (zhWrong.indexOf(cands[i2].zh) < 0) zhWrong.push(cands[i2].zh);
          if (zhWrong.length >= 2) break;
        }
        while (zhWrong.length < 2) zhWrong.push("其他词义 " + (zhWrong.length + 1));
        cands = shuffled([w.zh].concat(zhWrong.slice(0, 2)));
        p = document.createElement("div");
        p.className = "r-zh-opts";
        cands.forEach(function (zz) {
          b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.textContent = zz;
          b.addEventListener("click", function () {
            var re = document.getElementById("rMsg");
            if (zz === w.zh) { re.innerHTML = "<span class='ok'>对！</span>"; showOkCelebrate(); } else { re.innerHTML = "<span class='bad'>再想想</span>"; }
          });
          p.appendChild(b);
        });
        zbox = document.createElement("div");
        zbox.className = "review-center-block";
        zbox.appendChild(p);
        zbox.appendChild((function () { var p2 = document.createElement("div"); p2.className = "btns"; p2.innerHTML = "<button type='button' class='btn' id='rHearW'>再听单词</button>"; return p2; })());
        body.appendChild(zbox);
        document.getElementById("rHearW").onclick = function () { speakText(w.key, { slow: true }); };
        speakText(w.key, { slow: true });
      } else {
        ptext = w.ex;
        toks = ptext.split(/\s+/).filter(function (x) { return x; });
        sh = shuffled(toks.map(function (x) { return { x: x }; }));
        out = document.createElement("div");
        out.className = "jumble";
        out.style.minHeight = "1.2rem";
        out.style.margin = "0.2rem 0 0.15rem";
        line = document.createElement("div");
        line.className = "jumble";
        chosen = [];
        sh.forEach(function (oo) {
          c = document.createElement("span");
          c.className = "chip";
          c.textContent = oo.x;
          c.addEventListener("click", function (ev) {
            chosen.push(oo);
            (ev.currentTarget).style.visibility = "hidden";
            out.textContent = chosen.map(function (x) { return x.x; }).join(" ");
          });
          line.appendChild(c);
        });
        art = document.createElement("div");
        art.className = "hero-art";
        art.style.minHeight = "0";
        art.style.margin = "0.1rem 0 0.25rem";
        art.innerHTML = artFromSrc(wordImg(w), w.emoji);
        q.textContent = "先听例句，再把下面打乱的词点回正确顺序；可多次点「再听例句」。";
        t2 = document.createElement("div");
        t2.className = "btns";
        t2.style.margin = "0.1rem 0 0.35rem";
        t2.innerHTML = "<button type='button' class='btn primary' id='rHearJ'>再听例句</button> " +
          "<button type='button' class='btn' id='rResetJ'>重排</button> " +
          "<button type='button' class='btn' id='rChkJ'>检查</button>";
        jbox = document.createElement("div");
        jbox.className = "review-center-block jumble-hold";
        jbox.appendChild(t2);
        jbox.appendChild(art);
        jbox.appendChild(line);
        jbox.appendChild(out);
        body.appendChild(jbox);
        document.getElementById("rHearJ").onclick = function () { speakText(w.ex, { slow: true }); };
        document.getElementById("rChkJ").onclick = function () {
          var a = chosen.map(function (c) { return c.x; }).join(" ").replace(/\s+/g, " ").trim();
          var b2 = ptext.replace(/\s+/g, " ").trim();
          var rj = document.getElementById("rMsg");
          if (a === b2) { rj.innerHTML = "<span class='ok'>对！</span>"; showOkCelebrate(); } else { rj.innerHTML = "<span class='bad'>再试试</span>"; }
        };
        document.getElementById("rResetJ").onclick = function () {
          chosen = [];
          line.querySelectorAll(".chip").forEach(function (c2) { c2.style.visibility = "visible"; });
          out.textContent = "";
        };
        speakText(w.ex, { slow: true });
      }
    }
    document.getElementById("rNext").onclick = function () {
      if (rMode < reviewModes.length - 1) { rMode++; } else { rMode = 0; if (rPos < WORDS.length - 1) rPos++; else initReviewOrder(); }
      renderReview();
    };
    document.getElementById("rPrev").onclick = function () {
      if (rMode > 0) { rMode--; } else { if (rPos > 0) { rPos--; rMode = reviewModes.length - 1; } }
      renderReview();
    };

    var storyIndex = 0, storyLoop = false, loopToken = 0;
    window.__storySlow = true;
    function stopStoryLoop() { storyLoop = false; loopToken++; document.getElementById("sLoopState").textContent = "已停"; stopStoryNarration(); }
    function renderStorySlide() {
      var c = document.getElementById("storySlide");
      var pr = document.getElementById("storyProgress");
      if (!c || !STORY.length) return;
      var row = STORY[storyIndex];
      /* 第 n 句用 images/story/ 编号 0n，与 STORY 顺序一一对应 */
      var n = storyIndex + 1;
      if (n > STORY.length) n = STORY.length;
      var z = n < 10 ? "0" : "";
      var imgSrc = MEDIA_COS + "images/story/" + z + n + ".png";
      if (pr) pr.textContent = "第 " + (storyIndex + 1) + " / " + STORY.length + " 句";
      c.innerHTML =
        "<div class=\"story-sentence story-sentence--xl story-sentence-row\">" +
        "<div class=\"story-col story-col--art\">" +
        "<div class=\"hero-art\">" + artFromSrc(imgSrc, "🐬") + "</div></div>" +
        "<div class=\"story-col story-col--text\">" +
        "<p><span style='color:#7a5a2a'>#" + (storyIndex + 1) + "</span> " + row.en + "</p>" +
        "<button type=\"button\" class=\"story-zh-hold\" aria-expanded=\"false\" title=\"点按显示或隐藏中文\" aria-label=\"点按显示或隐藏中文\">" +
        "<span class=\"story-zh-ghost\">点按显示中文</span>" +
        "<span class=\"story-zh\" aria-hidden=\"true\">" + row.zh + "</span>" +
        "</button></div></div>";
      (function () {
        var hb = c.querySelector(".story-zh-hold");
        var ch = c.querySelector(".story-zh");
        if (!hb || !ch) return;
        function syncA11y() {
          var on = hb.classList.contains("is-on");
          hb.setAttribute("aria-expanded", on ? "true" : "false");
          ch.setAttribute("aria-hidden", on ? "false" : "true");
        }
        hb.onclick = function () { hb.classList.toggle("is-on"); syncA11y(); };
        syncA11y();
      })();
      document.getElementById("sPrev").disabled = storyIndex === 0;
      document.getElementById("sNext").disabled = storyIndex === STORY.length - 1;
      syncLoopToggleUi();
    }
    function syncLoopToggleUi() {
      var sl = document.getElementById("sSlow");
      var sn = document.getElementById("sNormal");
      if (window.__storySlow) { sl.className = "btn primary"; sn.className = "btn"; } else { sl.className = "btn"; sn.className = "btn primary"; }
    }
    document.getElementById("sSlow").onclick = function () { window.__storySlow = true; syncLoopToggleUi(); };
    document.getElementById("sNormal").onclick = function () { window.__storySlow = false; syncLoopToggleUi(); };
    document.getElementById("sPrev").onclick = function () {
      if (storyIndex <= 0) return;
      stopStoryLoop();
      stopStoryNarration();
      storyIndex--;
      renderStorySlide();
    };
    document.getElementById("sNext").onclick = function () {
      if (storyIndex >= STORY.length - 1) return;
      stopStoryLoop();
      stopStoryNarration();
      storyIndex++;
      renderStorySlide();
    };
    document.getElementById("sHearLine").onclick = function () {
      stopStoryLoop();
      var r2 = __storySlow ? 0.8 : 1.0;
      speakStoryLine(storyIndex, { rate: r2, slow: __storySlow });
    };
    renderStorySlide();
    document.getElementById("sLoop").onclick = function () {
      if (storyLoop) { stopStoryLoop(); return; }
      storyLoop = true;
      var myL = ++loopToken;
      document.getElementById("sLoopState").textContent = "循环中，再点停";
      (function L2() {
        if (!storyLoop) return;
        if (myL !== loopToken) return;
        var r = __storySlow ? 0.8 : 1.0;
        speakStoryLine(storyIndex, { rate: r, slow: __storySlow }).then(function () { if (storyLoop && myL === loopToken) setTimeout(L2, 500); });
      })();
    };
    function updateTopNavActive(name) {
      var nav = document.getElementById("topNav");
      if (!nav) return;
      var t = (name === "words" || name === "review" || name === "story") ? name : "words";
      nav.querySelectorAll("[data-goto]").forEach(function (btn) {
        var g = btn.getAttribute("data-goto");
        if (g === t) { btn.className = "btn primary"; } else { btn.className = "btn"; }
      });
    }
    function showView(name) {
      var el, n;
      n = (name === "words" || name === "review" || name === "story") ? name : "words";
      if (n !== "story") stopStoryNarration();
      document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("on"); });
      el = document.getElementById("view-" + n);
      if (el) el.classList.add("on");
      updateTopNavActive(n);
      if (n === "words") renderWordStep();
      if (n === "review") { initReviewOrder(); renderReview(); }
      if (n === "story") { loadStoryNarration(function () { renderStorySlide(); }); }
    }
    document.querySelectorAll("[data-goto]").forEach(function (b2) { b2.addEventListener("click", function () { showView(b2.getAttribute("data-goto") || "words"); }); });
    updateTopNavActive("words");
    loadStoryNarration();
    renderWordStep();
  })();
  </script>
  <script src="../../assets/primary-responsive.js?v=2" defer></script>
</body>
</html>
