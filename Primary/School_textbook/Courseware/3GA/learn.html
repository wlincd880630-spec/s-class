<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>单词学习 · 三年级上册</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="course-logo" href="index.html" title="Steven's Class English Studio">
        <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/3GA/assets/images/logo.png" alt="Steven's Class English Studio">
      </a>
      <a class="back-link" href="index.html"><i class="fa-solid fa-house"></i> 返回主页</a>
      <h1 class="page-title"><i class="fa-solid fa-graduation-cap"></i> 单词学习</h1>
    </div>

    <div class="card">
      <div class="control-row">
        <label for="unitSelect"><i class="fa-solid fa-book"></i> 选择单元：</label>
        <select id="unitSelect"></select>
      </div>
      <div id="wordTabs" class="word-tabs"></div>
    </div>

    <div class="card word-display" id="wordPanel">
      <div class="word-media" id="wordMedia">
        <div class="media-toggle">
          <button type="button" class="media-tab active" id="tabImage" data-mode="image">
            <i class="fa-solid fa-image"></i> 图片
          </button>
          <button type="button" class="media-tab" id="tabTrace" data-mode="trace">
            <i class="fa-solid fa-pen-fancy"></i> 描红书写
          </button>
        </div>
        <div class="media-panel" id="imagePanel">
          <img id="wordImg" class="word-image" src="" alt="单词图片">
        </div>
        <div class="media-panel hidden" id="tracePanel">
          <div class="four-line-sheet">
            <canvas id="traceCanvas"></canvas>
          </div>
          <div class="trace-toolbar">
            <button type="button" class="btn btn-secondary btn-sm" id="btnClearTrace">
              <i class="fa-solid fa-eraser"></i> 清除笔迹
            </button>
          </div>
          <p class="trace-hint">用手指或触控笔在四线格上描红书写单词（适合平板）</p>
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="btnSpeak"><i class="fa-solid fa-volume-high"></i> 朗读单词</button>
        <button class="btn btn-danger" id="btnRecord"><i class="fa-solid fa-microphone"></i> 跟读录音</button>
      </div>
      <div id="assessResult" class="hidden">
        <div class="stars" id="starDisplay"></div>
        <div class="score-bar"><div class="score-bar-fill" id="scoreFill" style="width:0%"></div></div>
        <p id="assessText" style="text-align:center;margin-top:8px;"></p>
      </div>
      <div id="phonemeBoxes" class="phoneme-boxes"></div>
      <div class="chinese-hidden" id="chineseHint">点击显示中文意思</div>
      <p id="wordChinese" class="sentence-zh" style="font-size:1.2rem;text-align:center;margin-bottom:12px;"></p>
      <label class="familiar-check">
        <input type="checkbox" id="familiarCheck">
        <span>⭐ 我熟悉这个词</span>
      </label>
    </div>

    <div class="card">
      <h3 class="card-title"><i class="fa-solid fa-comment-dots"></i> 例句 <small style="font-size:0.8rem;color:#b2bec3;font-weight:normal;">（点击单词可查词）</small></h3>
      <div id="sentences"></div>
    </div>

    <div class="timer-bar">
      <span><i class="fa-solid fa-clock"></i> 当前单词：<strong id="currentTime">0:00</strong></span>
      <span><i class="fa-solid fa-hourglass-half"></i> 累计学习：<strong id="totalTime">0:00</strong></span>
    </div>

    <div id="statsPanel" class="stats-panel hidden" style="margin-top:20px;">
      <h3><i class="fa-solid fa-trophy"></i> 本单元复习完成！</h3>
      <p class="progress-ring" id="statsText"></p>
    </div>
  </div>

  <script src="assets/data/data.js"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/audio-manifest.js?v=1"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/local-audio.js?v=1"></script>
<script src="../../../assets/ng-word-ipa.js?v=1"></script>
<script src="assets/js/utils.js"></script>
  <script>
    let currentUnit = null;
    let currentWord = null;
    let timer = new WordTimer();
    let mediaMode = 'image';
    let handwritingPad = null;

    const unitSelect = document.getElementById('unitSelect');
    const wordTabs = document.getElementById('wordTabs');
    const wordImg = document.getElementById('wordImg');
    const imagePanel = document.getElementById('imagePanel');
    const tracePanel = document.getElementById('tracePanel');
    const tabImage = document.getElementById('tabImage');
    const tabTrace = document.getElementById('tabTrace');
    const traceCanvas = document.getElementById('traceCanvas');
    const wordChinese = document.getElementById('wordChinese');
    const chineseHint = document.getElementById('chineseHint');
    const phonemeBoxes = document.getElementById('phonemeBoxes');
    const sentences = document.getElementById('sentences');
    const familiarCheck = document.getElementById('familiarCheck');
    const statsPanel = document.getElementById('statsPanel');

    timer.onTick = sec => {
      document.getElementById('currentTime').textContent = formatTime(sec);
    };

    function updateTotalTime() {
      document.getElementById('totalTime').textContent = formatTime(Storage.getTotalTime());
    }

    function setMediaMode(mode) {
      mediaMode = mode;
      const isImage = mode === 'image';
      tabImage.classList.toggle('active', isImage);
      tabTrace.classList.toggle('active', !isImage);
      imagePanel.classList.toggle('hidden', !isImage);
      tracePanel.classList.toggle('hidden', isImage);
      if (!isImage) {
        if (!handwritingPad) handwritingPad = new HandwritingPad(traceCanvas);
        handwritingPad.setWord(currentWord ? currentWord.word : '');
        requestAnimationFrame(() => handwritingPad.resize());
      }
    }

    tabImage.addEventListener('click', () => setMediaMode('image'));
    tabTrace.addEventListener('click', () => setMediaMode('trace'));
    document.getElementById('btnClearTrace').addEventListener('click', () => {
      if (handwritingPad) handwritingPad.clear();
    });
    window.addEventListener('resize', () => {
      if (handwritingPad && mediaMode === 'trace') handwritingPad.resize();
    });

    function renderWordTabs() {
      wordTabs.innerHTML = '';
      const familiar = Storage.getFamiliar();
      currentUnit.words.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'word-tab' + (familiar[w.id] ? ' familiar' : '');
        if (currentWord && w.id === currentWord.id) btn.classList.add('active');
        btn.textContent = w.word;
        btn.addEventListener('click', () => switchWord(w));
        wordTabs.appendChild(btn);
      });
    }

    function switchWord(word) {
      if (currentWord && timer.running) {
        const sec = timer.stop();
        Storage.setWordTime(currentWord.id, sec);
        Storage.addTotalTime(sec);
        updateTotalTime();
      }
      currentWord = word;
      renderWordTabs();
      loadWord(word);
      timer.reset();
      timer.start();
      checkUnitComplete();
    }

    function loadWord(w) {
      wordImg.src = w.image;
      wordImg.alt = w.word;
      if (handwritingPad) handwritingPad.setWord(w.word);
      else if (mediaMode === 'trace') {
        handwritingPad = new HandwritingPad(traceCanvas);
        handwritingPad.setWord(w.word);
        handwritingPad.resize();
      }
      wordChinese.textContent = w.chinese;
      wordChinese.classList.remove('show');
      chineseHint.textContent = '点击显示中文意思';
      chineseHint.classList.remove('revealed', 'hidden');
      familiarCheck.checked = !!Storage.getFamiliar()[w.id];
      document.getElementById('assessResult').classList.add('hidden');

      renderPhonemeBoxes(phonemeBoxes, w);

      sentences.innerHTML = '';
      w.sentences.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        const wrapped = wrapSentenceWords(s.en);
        card.innerHTML = `
          <div class="sentence-en">
            <span class="sentence-text" data-sentence="${s.en.replace(/"/g, '&quot;')}">${wrapped}</span>
            ${s.source === 'textbook' ? '<span style="font-size:0.75rem;background:#ffeaa7;padding:2px 8px;border-radius:8px;margin-left:8px;">📖 教材原文</span>' : '<span style="font-size:0.75rem;background:#dfe6e9;padding:2px 8px;border-radius:8px;margin-left:8px;">🌍 拓展语境</span>'}
            <button class="btn btn-sm btn-outline" style="margin-left:10px;vertical-align:middle;" data-si="${i}">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <div class="sentence-zh" id="zh${i}">${s.zh}</div>
          <button class="btn btn-sm btn-secondary show-zh-btn" data-zi="${i}" style="margin-top:8px;">
            <i class="fa-solid fa-eye"></i> 显示翻译
          </button>`;
        sentences.appendChild(card);
      });

      bindSentenceWordClicks(sentences);

      sentences.querySelectorAll('[data-si]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.si;
          speakText(w.sentences[idx].en);
        });
      });
      sentences.querySelectorAll('.show-zh-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('zh' + btn.dataset.zi).classList.add('show');
          btn.style.display = 'none';
        });
      });
    }

    function checkUnitComplete() {
      const familiar = Storage.getFamiliar();
      const total = currentUnit.words.length;
      const done = currentUnit.words.filter(w => familiar[w.id]).length;
      if (done === total) {
        statsPanel.classList.remove('hidden');
        document.getElementById('statsText').textContent =
          `已熟悉 ${done}/${total} · ${Math.round(done / total * 100)}%`;
      } else {
        statsPanel.classList.add('hidden');
      }
    }

    familiarCheck.addEventListener('change', () => {
      Storage.setFamiliar(currentWord.id, familiarCheck.checked);
      if (familiarCheck.checked && timer.running) {
        const sec = timer.stop();
        Storage.setWordTime(currentWord.id, sec);
        Storage.addTotalTime(sec);
        updateTotalTime();
      }
      renderWordTabs();
      checkUnitComplete();
    });

    chineseHint.addEventListener('click', () => {
      wordChinese.classList.add('show');
      chineseHint.classList.add('hidden');
    });

    document.getElementById('btnSpeak').addEventListener('click', () => {
      speakText(currentWord.word);
    });

    document.getElementById('btnRecord').addEventListener('click', async () => {
      const btn = document.getElementById('btnRecord');
      const resultEl = document.getElementById('assessResult');
      const assessText = document.getElementById('assessText');

      if (!pronunciationRecorder.isRecording) {
        try {
          resultEl.classList.add('hidden');
          await pronunciationRecorder.start(currentWord.word);
          btn.classList.add('recording');
          btn.innerHTML = '<i class="fa-solid fa-stop"></i> 停止录音';
        } catch (e) {
          assessText.textContent = '无法启动录音：' + e.message;
          resultEl.classList.remove('hidden');
        }
        return;
      }

      btn.classList.remove('recording');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 评估中…';
      btn.disabled = true;

      const result = await pronunciationRecorder.stop();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-microphone"></i> 跟读录音';
      resultEl.classList.remove('hidden');

      if (result && (getPronunciationDisplayScore(result) > 0 || result.recognized)) {
        const score = getPronunciationDisplayScore(result);
        renderStars(document.getElementById('starDisplay'), scoreToStars(score));
        document.getElementById('scoreFill').style.width = score + '%';
        assessText.textContent = `发音 ${Math.round(score)} 分 · 准确度 ${Math.round(result.accuracy)} · 流畅度 ${Math.round(result.fluency)}`;
      } else {
        assessText.textContent = '没有听清，请再试一次！靠近麦克风，清晰朗读。';
      }
    });

    unitSelect.addEventListener('change', () => {
      currentUnit = getUnitById(unitSelect.value);
      if (currentUnit.words.length) switchWord(currentUnit.words[0]);
      else statsPanel.classList.add('hidden');
    });

    buildUnitSelector(unitSelect);
    currentUnit = getUnitById(unitSelect.value);
    updateTotalTime();
    if (currentUnit.words.length) switchWord(currentUnit.words[0]);
  </script>
</body>
</html>
