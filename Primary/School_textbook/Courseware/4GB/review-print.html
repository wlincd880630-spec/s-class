<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>纸质练习 / PDF · 四年级下册</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/print-worksheets.css">
<script src="../../../../scripts/site-nav.js" defer></script>
</head>
<body class="print-worksheet-page">
  <div class="container">
    <div class="top-bar no-print">
      <a class="course-logo" href="index.html" title="Steven's Class English Studio">
        <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/4GB/assets/images/logo.png" alt="Steven's Class English Studio">
      </a>
      <a class="back-link" href="index.html"><i class="fa-solid fa-house"></i> 返回</a>
      <h1 class="page-title"><i class="fa-solid fa-print"></i> 纸质练习 / PDF</h1>
    </div>

    <div class="pw-toolbar no-print">
      <h1>📄 纸质练习 · 打印 / 导出 PDF</h1>
      <p class="pw-desc">根据首页所选复习单词生成可在纸上完成的练习。导出 PDF：点「打印」→ 目标选「另存为 PDF」→ 缩放 <strong>100%</strong>、边距 <strong>无/默认</strong>。</p>
      <div id="reviewWordSummary"></div>
      <p class="pw-chip-count" id="pwWordCount">已选 0 个单词</p>
      <div class="pw-chips" id="pwWordChips"></div>
      <div class="pw-row">
        <label><input type="checkbox" id="optMaze" checked /> 单词迷宫（每组 4 词 / 页）</label>
        <label><input type="checkbox" id="optSpell" checked /> 字母排序（看图拼词）</label>
        <label><input type="checkbox" id="optConnect" checked /> 图片单词连线</label>
        <label><input type="checkbox" id="optZhPickEn" checked /> 看中文选英文</label>
        <label><input type="checkbox" id="optEnPickZh" checked /> 看单词选中文</label>
        <label><input type="checkbox" id="optPickImg" checked /> 看单词选图</label>
        <label><input type="checkbox" id="optMemory" checked /> 翻翻配对卡片</label>
        <label><input type="checkbox" id="optSentence" checked /> 句子排序</label>
        <label><input type="checkbox" id="optAnswers" /> 含答案页（教师用）</label>
      </div>
      <div class="pw-row" style="margin-top:0.75rem;">
        <button type="button" class="btn btn-primary" id="btnGen"><i class="fa-solid fa-file-lines"></i> 生成练习纸</button>
        <button type="button" class="btn btn-success" id="btnPrint"><i class="fa-solid fa-print"></i> 打印 / 导出 PDF</button>
      </div>
    </div>

    <div id="printArea">
      <p class="pw-empty no-print" id="placeholder">请选择单元与单词，练习纸将自动生成</p>
    </div>
  </div>
  <script>
    window.PRINT_WORKSHEETS = { bookName: "外研版四年级下册" };
  </script>
  <script src="assets/data/data.js"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/audio-manifest.js?v=1"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/local-audio.js?v=1"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderReviewWordSummary(document.getElementById('reviewWordSummary'));
    });
  </script>
  <script src="../assets/js/print-worksheets.js"></script>
</body>
</html>
