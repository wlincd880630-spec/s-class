<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>单词抄写作业 · 四年级上册</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="top-bar no-print">
      <a class="course-logo" href="index.html" title="Steven's Class English Studio">
        <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/4GA/assets/images/logo.png" alt="Steven's Class English Studio">
      </a>
      <a class="back-link" href="index.html"><i class="fa-solid fa-house"></i> 返回主页</a>
      <h1 class="page-title"><i class="fa-solid fa-pen-fancy"></i> 单词抄写作业</h1>
    </div>

    <div class="card no-print">
      <div class="control-row">
        <label for="unitSelect"><i class="fa-solid fa-book"></i> 选择单元：</label>
        <select id="unitSelect"></select>
      </div>
      <div class="copy-legend">
        <span><i class="dot trace"></i> 描红 ×3（浅蓝底字）</span>
        <span><i class="dot write"></i> 独立书写 ×3（空白四线格）</span>
      </div>
      <p class="trace-hint" style="margin-top:8px;">
        本页为<strong>纸质作业单</strong>：打印或导出 PDF 后，学生在纸上书写。屏幕可预览、点 🔊 听发音。
        导出 PDF 时请将缩放设为 <strong>100%</strong>；页边距约 15mm（左右）/ 12mm（上下）。
      </p>
      <div class="copy-toolbar">
        <button type="button" class="btn btn-primary btn-sm" id="btnPrint">
          <i class="fa-solid fa-print"></i> 打印 / 导出 PDF
        </button>
      </div>
    </div>

    <div class="card copy-card" id="workbookCard">
      <div class="copy-workbook" id="copyWorkbook"></div>
    </div>
  </div>

  <script src="assets/data/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    const unitSelect = document.getElementById('unitSelect');
    const copyWorkbook = document.getElementById('copyWorkbook');

    function renderUnit(unit) {
      copyWorkbook.innerHTML = '';
      if (!unit) return;

      const header = document.createElement('div');
      header.className = 'copy-unit-header';
      header.innerHTML = `
        <h2>${unit.name} · ${unit.title} · 单词抄写作业</h2>`;
      copyWorkbook.appendChild(header);

      unit.words.forEach(w => buildCopySheet(w, copyWorkbook));
    }

    TEXTBOOK_DATA.units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.title;
      unitSelect.appendChild(opt);
    });

    unitSelect.addEventListener('change', () => {
      renderUnit(getUnitById(unitSelect.value));
    });

    function startPrint() {
      document.body.classList.add('copy-print-body');
      window.print();
    }

    document.getElementById('btnPrint').addEventListener('click', startPrint);
    window.addEventListener('beforeprint', () => document.body.classList.add('copy-print-body'));
    window.addEventListener('afterprint', () => document.body.classList.remove('copy-print-body'));

    renderUnit(TEXTBOOK_DATA.units[0]);
  </script>
</body>
</html>
