<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>游戏八：图片单词连线 · 五年级下册</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a class="course-logo" href="index.html" title="Steven's Class English Studio">
        <img src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/5GB/assets/images/logo.png" alt="Steven's Class English Studio">
      </a>
      <a class="back-link" href="index.html"><i class="fa-solid fa-house"></i> 返回</a>
      <h1 class="page-title"><i class="fa-solid fa-link"></i> 图片单词连线</h1>
    </div>
    <div class="card" id="setupPanel">
      <div id="reviewWordSummary"></div>
      <p style="color:#636e72;font-size:0.9rem;">每页 3 组：左侧图片与右侧单词配对连线（不显示中文）</p>
      <button class="btn btn-primary btn-lg" id="btnStart"><i class="fa-solid fa-play"></i> 开始游戏</button>
    </div>

    <div class="card game-area hidden" id="gamePanel">
      <div class="timer-bar">
        <span><i class="fa-solid fa-file"></i> 第 <strong id="pageNum">1</strong> / <strong id="pageTotal">1</strong> 页</span>
        <span>已完成 <strong id="doneCount">0</strong> / <strong id="pageSize">3</strong></span>
        <span><i class="fa-solid fa-stopwatch"></i> <strong id="gameTime">0:00</strong></span>
      </div>
      <p class="connect-hint"><i class="fa-solid fa-hand-pointer"></i> 先点左侧图片，再点右侧对应英文单词；配对成功会自动连线</p>
      <div class="connect-wrap" id="connectWrap">
        <svg class="connect-svg" id="linesSvg" aria-hidden="true"></svg>
        <div class="connect-col" id="leftCol"></div>
        <div class="connect-col" id="rightCol"></div>
      </div>
      <div id="feedback" class="feedback hidden"></div>
    </div>

    <div class="card hidden" id="donePanel"></div>
  </div>
  <script src="assets/data/data.js"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/audio-manifest.js?v=1"></script>
  <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/School_textbook/Courseware/audio/local-audio.js?v=1"></script>
  <script src="assets/js/utils.js"></script>
  <script>
    const CONNECT_SIZE = 3;
    let groups = [], groupIdx = 0, pageWords = [];
    let matched = {}, selSide = null, selId = null;
    let statCorrect = 0, statWrong = 0, totalWords = 0;
    let gameTimer = null;

    renderReviewWordSummary(document.getElementById('reviewWordSummary'), { minCount: 3 });
    document.getElementById('btnStart').addEventListener('click', startGame);
    window.addEventListener('resize', () => {
      if (Object.keys(matched).length) redrawLines();
    });

    function itemSel(id) {
      return `.connect-item[data-id="${CSS.escape(String(id))}"]`;
    }

    function clearSelection() {
      document.querySelectorAll('.connect-item.selected').forEach((e) => e.classList.remove('selected'));
      selSide = null;
      selId = null;
    }

    function startGame() {
      const all = requireReviewWords({ minCount: 3 });
      if (!all) return;
      groups = [];
      for (let i = 0; i < all.length; i += CONNECT_SIZE) {
        groups.push(all.slice(i, i + CONNECT_SIZE));
      }
      groupIdx = 0; statCorrect = 0; statWrong = 0; totalWords = all.length;
      document.getElementById('setupPanel').classList.add('hidden');
      document.getElementById('donePanel').classList.add('hidden');
      document.getElementById('gamePanel').classList.remove('hidden');
      gameTimer = new GameTimer(document.getElementById('gameTime'));
      gameTimer.start();
      loadPage();
    }

    function loadPage() {
      if (groupIdx >= groups.length) { finishGame(); return; }
      pageWords = shuffle(groups[groupIdx].slice());
      matched = {};
      clearSelection();
      document.getElementById('pageNum').textContent = groupIdx + 1;
      document.getElementById('pageTotal').textContent = groups.length;
      document.getElementById('pageSize').textContent = pageWords.length;
      document.getElementById('doneCount').textContent = '0';
      document.getElementById('linesSvg').innerHTML = '';
      document.getElementById('feedback').classList.add('hidden');

      const left = document.getElementById('leftCol');
      const right = document.getElementById('rightCol');
      left.innerHTML = '';
      right.innerHTML = '';

      pageWords.forEach((w) => {
        const li = document.createElement('div');
        li.className = 'connect-item connect-item--img';
        li.dataset.id = w.id;
        const img = document.createElement('img');
        img.src = w.image;
        img.alt = w.word;
        img.draggable = false;
        li.appendChild(img);
        li.addEventListener('click', () => onPick('img', w.id, li));
        left.appendChild(li);
      });

      shuffle(pageWords.slice()).forEach((w) => {
        const ri = document.createElement('div');
        ri.className = 'connect-item connect-item--word';
        ri.dataset.id = w.id;
        const lbl = document.createElement('div');
        lbl.className = 'en-label';
        lbl.textContent = w.word;
        ri.appendChild(lbl);
        ri.addEventListener('click', () => onPick('word', w.id, ri));
        right.appendChild(ri);
      });
    }

    function wordById(id) {
      return pageWords.find((w) => w.id === id);
    }

    function onPick(side, id, el) {
      if (matched[id]) return;
      const fb = document.getElementById('feedback');

      if (!selSide) {
        selSide = side;
        selId = id;
        el.classList.add('selected');
        return;
      }

      if (selSide === side) {
        clearSelection();
        selSide = side;
        selId = id;
        el.classList.add('selected');
        return;
      }

      if (selId === id) {
        const w = wordById(id);
        statCorrect++;
        matched[id] = true;
        document.querySelectorAll(itemSel(id)).forEach((e) => {
          e.classList.remove('selected');
          e.classList.add('matched');
        });
        drawLine(id);
        if (w) speakText(w.word);
        showFeedback(fb, '配对成功！🎉', true);
        document.getElementById('doneCount').textContent = String(Object.keys(matched).length);
        clearSelection();
        if (Object.keys(matched).length === pageWords.length) {
          groupIdx++;
          setTimeout(loadPage, 1000);
        }
      } else {
        statWrong++;
        showFeedback(fb, '不对，再试试！', false);
        clearSelection();
      }
    }

    function drawLine(id) {
      const leftEl = document.querySelector(`#leftCol ${itemSel(id)}`);
      const rightEl = document.querySelector(`#rightCol ${itemSel(id)}`);
      if (!leftEl || !rightEl) return;
      const wrap = document.getElementById('connectWrap').getBoundingClientRect();
      const a = leftEl.getBoundingClientRect();
      const b = rightEl.getBoundingClientRect();
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', String(a.right - wrap.left));
      line.setAttribute('y1', String(a.top + a.height / 2 - wrap.top));
      line.setAttribute('x2', String(b.left - wrap.left));
      line.setAttribute('y2', String(b.top + b.height / 2 - wrap.top));
      line.setAttribute('stroke', '#0984e3');
      line.setAttribute('stroke-width', '3');
      line.setAttribute('stroke-linecap', 'round');
      line.dataset.id = id;
      document.getElementById('linesSvg').appendChild(line);
    }

    function redrawLines() {
      const svg = document.getElementById('linesSvg');
      svg.innerHTML = '';
      Object.keys(matched).forEach(drawLine);
    }

    function finishGame() {
      const timeSec = gameTimer.stop();
      document.getElementById('gamePanel').classList.add('hidden');
      const donePanel = document.getElementById('donePanel');
      donePanel.classList.remove('hidden');
      showFinalGameStats(donePanel, {
        title: '连线完成！',
        groups: groups.length,
        totalItems: totalWords,
        itemLabel: '个配对',
        correct: statCorrect,
        wrong: statWrong,
        timeSec,
        onRetry: () => {
          donePanel.classList.add('hidden');
          document.getElementById('setupPanel').classList.remove('hidden');
        }
      });
    }
  </script>

</body>
</html>
