<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>教师教具卡 · 剪裁互动</title>
  <script src="../../scripts/auth-check.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body class="lab">
  <div class="wrap">
    <div class="topbar no-print">
      <a class="brand" href="index.html">
        <img src="assets/img/mascot.jpg" alt="" />
        <div>
          <strong>教师教具卡</strong>
          <span>沿虚线剪下 · 课堂互动</span>
        </div>
      </a>
      <nav class="nav-pills">
        <a class="pill" href="index.html">课程</a>
        <a class="pill" href="print.html">练习纸</a>
        <a class="pill active" href="print-aids.html">教具</a>
      </nav>
    </div>
    <div class="card no-print" style="margin-bottom:1rem">
      <p>完整教具套可一次打印：字母卡、大写/小写正反面卡、字母组合卡、课堂用语卡，以及本课图卡、奇形词、金字塔句条、交流角色卡、规律海报、拼读垫板。彩色打印后沿虚线剪下，磁贴或信封分类使用。</p>
      <div class="btn-row">
        <label>课时词条
          <select id="lessonSel" style="min-height:42px;border-radius:12px;padding:0.3rem 0.6rem;font-weight:800"></select>
        </label>
        <label>教具种类
          <select id="aidType" style="min-height:42px;border-radius:12px;padding:0.3rem 0.6rem;font-weight:800">
            <option value="kit">完整教具套（推荐）</option>
            <option value="pack">本课教具套</option>
            <option value="letters">字母卡 Aa–Zz</option>
            <option value="lettersUpper">大写字母闪卡</option>
            <option value="lettersLower">小写字母 + 音素卡</option>
            <option value="graphemes">字母组合卡</option>
            <option value="classroom">课堂日常用语卡</option>
            <option value="pictures">声音先行图卡</option>
            <option value="heart">奇形词卡</option>
            <option value="strips">金字塔句条</option>
            <option value="roles">日常交流角色卡</option>
            <option value="mats">拼读垫板 CVC</option>
            <option value="posters">规律海报</option>
          </select>
        </label>
        <button class="btn coral" id="btnPrint" type="button">打印 / 导出 PDF</button>
      </div>
    </div>
    <div id="printArea"></div>
  </div>
  <script src="data/phonemes.js"></script>
  <script src="data/words.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/texts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/aids.js"></script>
</body>
</html>
