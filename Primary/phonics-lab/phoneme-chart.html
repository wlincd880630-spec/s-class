<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>音素表 · IPA</title>
  <script src="../../scripts/auth-check.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body class="lab">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <img src="assets/img/mascot.jpg" alt="" />
        <div>
          <strong>音素实验室</strong>
          <span>点按播放单独音素 · 同步国际音标</span>
        </div>
      </a>
      <nav class="nav-pills">
        <a class="pill" href="index.html">课程</a>
        <a class="pill active" href="phoneme-chart.html">音素 IPA</a>
        <a class="pill" href="games.html">游戏</a>
      </nav>
    </div>
    <section class="hero" style="grid-template-columns:1fr">
      <div>
        <div class="kicker">Azure Speech · IPA / UPS / SAPI 回退</div>
        <h1>单独音素怎么发音？</h1>
        <p class="lede">易漏音素（<strong>th 清 /θ/</strong>、<strong>th 浊 /ð/</strong>、sh、ng、zh）已置顶。点「辅音」也能看到 digraph，不会再把 th 滤掉。单音朗读先走 IPA 拉长（内文用中点，避免把 <code>thhh</code> 读成字母），再试 UPS / SAPI；仍不准就读例词。爆破音（p t k）神经 TTS 常带轻微 schwa，这是引擎限制，请用「纯音 + 例词」。</p>
      </div>
    </section>
    <div class="chart-tools">
      <input class="chart-search" id="chartSearch" type="search" placeholder="搜索 th、清、thumb、/θ/ …" autocomplete="off" />
    </div>
    <div class="mode-tabs" id="filters"></div>
    <div class="pin-row" id="pinned"></div>
    <div class="grid-auto" id="chart"></div>
    <div class="card" id="detail" style="margin-top:1rem;display:none"></div>
  </div>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="data/phonemes.js"></script>
  <script src="data/words.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var filter = "all";
      var q = "";
      var PINNED = ["th", "thv", "sh", "ch", "ng", "zh", "wh", "nk"];
      var types = ["all", "easy-miss", "consonant", "vowel", "digraph", "cluster", "vowel-team", "r-controlled", "diphthong", "rule"];
      var labels = {
        all: "全部",
        "easy-miss": "易漏",
        consonant: "辅音",
        vowel: "元音",
        digraph: "Digraph",
        cluster: "辅音簇",
        "vowel-team": "元音组合",
        "r-controlled": "Bossy R",
        diphthong: "双元音",
        rule: "拼读规则"
      };

      function typeMatch(p) {
        if (filter === "all") return true;
        if (filter === "easy-miss") return PINNED.indexOf(p.id) !== -1;
        if (filter === "consonant") {
          return p.type === "consonant" || p.type === "digraph" || p.type === "cluster";
        }
        return p.type === filter;
      }

      function textMatch(p) {
        if (!q) return true;
        var blob = [p.id, p.label, p.ipa, p.ipaDisplay, p.keyword, p.keywordZh, p.tip]
          .concat(p.graphemes || [])
          .join(" ")
          .toLowerCase();
        return blob.indexOf(q) !== -1;
      }

      function cardHtml(p, extraClass) {
        return (
          "<button class=\"card" + (extraClass ? " " + extraClass : "") + "\" type=\"button\" data-id=\"" + p.id + "\">" +
          "<img class=\"pic\" src=\"" + Lab.img(p.img) + "\" alt=\"" + p.keywordZh + "\">" +
          "<h3>" + (p.label || p.graphemes[0]) + " <span class=\"ipa\">" + p.ipaDisplay + "</span></h3>" +
          "<p class=\"muted\">" + p.keyword + " · " + p.keywordZh + "</p></button>"
        );
      }

      function openDetail(id) {
        var p = PHONEMES[id];
        if (!p) return;
        var box = document.getElementById("detail");
        box.style.display = "block";
        box.innerHTML =
          "<div class=\"sound-card\"><img class=\"pic\" src=\"" + Lab.img(p.img) + "\" alt=\"\">" +
          "<div><div class=\"grapheme-xl\">" + (p.label || p.graphemes[0]) + "</div>" +
          "<div class=\"ipa-xl\">" + p.ipaDisplay + "</div>" +
          "<p class=\"muted\">拼法 " + p.graphemes.join(" / ") + "</p>" +
          "<p>" + p.tip + "</p>" +
          "<p class=\"muted\">Azure IPA: " + (p.azureIsolate || p.azureIpa) + " · UPS: " + (p.azureUps || "—") + " · SAPI: " + p.azureSapi + " · " + (p.holdable ? "可拉长" : "需截断") + "</p>" +
          "<p class=\"teacher-note\">音素由教师示范</p>" +
          "<div class=\"btn-row\">" +
          "<button class=\"btn sun\" id=\"p3\" type=\"button\">听例词 " + p.keyword + "</button></div></div></div>";
        document.getElementById("p3").onclick = function () { PhonicsTTS.speakWord(p.keyword); };
        box.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function bindCards(root) {
        (root || document).querySelectorAll("[data-id]").forEach(function (card) {
          card.onclick = function () { openDetail(card.getAttribute("data-id")); };
        });
      }

      function render() {
        document.getElementById("filters").innerHTML = types.map(function (t) {
          return "<button class=\"mode-tab" + (t === filter ? " active" : "") + "\" data-f=\"" + t + "\" type=\"button\">" + labels[t] + "</button>";
        }).join("");
        document.querySelectorAll("[data-f]").forEach(function (b) {
          b.onclick = function () { filter = b.getAttribute("data-f"); render(); };
        });

        var pinBox = document.getElementById("pinned");
        if (filter === "all" && !q) {
          pinBox.style.display = "grid";
          pinBox.innerHTML =
            "<p class=\"kicker\" style=\"grid-column:1/-1;margin:0\">易漏音素 · th 清浊、sh、ch、ng、zh</p>" +
            PINNED.map(function (id) {
              var p = PHONEMES[id];
              return p ? cardHtml(p, "star") : "";
            }).join("");
        } else {
          pinBox.style.display = "none";
          pinBox.innerHTML = "";
        }

        var list = PHONEME_LIST.filter(function (p) { return typeMatch(p) && textMatch(p); });
        document.getElementById("chart").innerHTML = list.length
          ? list.map(function (p) { return cardHtml(p, PINNED.indexOf(p.id) !== -1 ? "star" : ""); }).join("")
          : "<p class=\"muted\">没有匹配的音素。试试 th、清、/ð/ 或 Digraph。</p>";
        bindCards(document);
      }

      var search = document.getElementById("chartSearch");
      search.addEventListener("input", function () {
        q = (search.value || "").trim().toLowerCase();
        render();
      });
      render();
    })();
  </script>
</body>
</html>
