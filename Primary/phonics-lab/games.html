<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>拼读复习游戏</title>
  <script src="../../scripts/auth-check.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body class="lab" data-page="games-lobby">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <img src="assets/img/mascot.jpg" alt="" />
        <div>
          <strong>复习游戏大厅</strong>
          <span>按阶段选题库 · 三种难度</span>
        </div>
      </a>
      <nav class="nav-pills">
        <a class="pill" href="index.html">课程</a>
        <a class="pill active" href="games.html">游戏</a>
        <a class="pill" href="print.html">PDF</a>
      </nav>
    </div>
    <p class="lede">听词点图、听词点首/中/尾字母、听辨打叉、歌谣、小组抢答。只朗读单词，音素由教师示范。</p>
    <form class="card" id="opts" style="margin:1rem 0">
      <div class="btn-row">
        <label>阶段
          <select id="stage" style="min-height:42px;border-radius:12px;padding:0.3rem 0.6rem;font-weight:800">
            <option value="1">1 字母单音 I</option>
            <option value="2">2 字母单音 II</option>
            <option value="3">3 Digraph / Blend</option>
            <option value="4">4 Magic E / 元音组合</option>
            <option value="5">5 Bossy R / 双元音</option>
            <option value="6">6 多音节 / 流利</option>
          </select>
        </label>
        <label>难度
          <select id="diff" style="min-height:42px;border-radius:12px;padding:0.3rem 0.6rem;font-weight:800">
            <option value="easy">简单</option>
            <option value="medium">进阶</option>
            <option value="hard">挑战</option>
          </select>
        </label>
      </div>
    </form>
    <div class="grid-auto" id="lobby"></div>
  </div>
  <script src="data/phonemes.js"></script>
  <script src="data/words.js"></script>
  <script src="data/letters.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/letter-packs.js"></script>
  <script src="data/texts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/games.js"></script>
  <script>
    (function () {
      function refresh() {
        var s = document.getElementById("stage").value;
        var d = document.getElementById("diff").value;
        location.replace("games.html?stage=" + s + "&diff=" + d + "&lesson=" + (Lab.qs("lesson") || "L01"));
      }
      var stage = Lab.qs("stage", "1");
      var diff = Lab.qs("diff", "easy");
      document.getElementById("stage").value = stage;
      document.getElementById("diff").value = diff;
      document.getElementById("stage").addEventListener("change", refresh);
      document.getElementById("diff").addEventListener("change", refresh);
    })();
  </script>
</body>
</html>
