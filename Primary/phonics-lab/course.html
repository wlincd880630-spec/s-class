<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>拼读课 · Oxford 课型</title>
  <script src="../../scripts/auth-check.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body class="lab opw">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <img src="assets/img/mascot.jpg" alt="" />
        <div>
          <strong id="lessonTitle">拼读课</strong>
          <span id="lessonKicker">课时</span>
        </div>
      </a>
      <nav class="nav-pills">
        <a class="pill" href="index.html">总览</a>
        <a class="pill" href="games.html">游戏</a>
        <a class="pill" href="print.html">作业 PDF</a>
      </nav>
    </div>

    <div class="opw-bar">
      <select id="lessonJump" aria-label="跳转课时"></select>
      <span class="muted" id="progressHint"></span>
      <button class="btn ghost" id="markDone" type="button">本课完成</button>
    </div>

    <nav class="step-nav" id="contentNav">
      <button class="step" data-content="letter" type="button">字母</button>
      <button class="step" data-content="blend" type="button">拼读</button>
      <button class="step" data-content="listen" type="button">听辨</button>
      <button class="step" data-content="story" type="button">故事</button>
      <button class="step" data-content="sentence" type="button">句子</button>
      <button class="step" data-content="talk" type="button">对话</button>
      <button class="step" data-content="homework" type="button">作业</button>
    </nav>

    <nav class="mode-nav" id="modeNav">
      <button class="mode-tab" data-mode="iDo" type="button">Teacher I Do</button>
      <button class="mode-tab" data-mode="youDo" type="button">Student You Do</button>
      <button class="mode-tab" data-mode="group" type="button">小组竞赛</button>
      <button class="mode-tab" data-mode="games" type="button">复习游戏</button>
    </nav>

    <div id="subnav"></div>
    <main id="stage" class="opw-stage"></main>
  </div>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="data/phonemes.js"></script>
  <script src="data/words.js"></script>
  <script src="data/letters.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/texts.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pyramid.js"></script>
  <script src="js/course.js"></script>
</body>
</html>
