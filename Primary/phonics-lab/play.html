<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>拼读游戏</title>
  <script src="../../scripts/auth-check.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/lab.css" />
</head>
<body class="lab" data-page="games-play">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="games.html">
        <img src="assets/img/mascot.jpg" alt="" />
        <div>
          <strong id="gameTitle">游戏</strong>
          <span id="gameDesc">复习</span>
        </div>
      </a>
      <nav class="nav-pills">
        <a class="pill" href="games.html">大厅</a>
        <a class="pill" href="index.html">课程</a>
      </nav>
    </div>
    <div class="scoreboard" id="hud"></div>
    <p id="prompt" style="font-weight:800;margin-bottom:0.7rem"></p>
    <div class="game-stage" id="board"></div>
    <div class="btn-row">
      <button class="btn teal" id="replay" type="button">再听一遍</button>
      <button class="btn sun" id="nextQ" type="button">下一题</button>
      <a class="btn ghost" href="games.html">换游戏</a>
    </div>
  </div>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="data/phonemes.js"></script>
  <script src="data/words.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="data/texts.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
