<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>综合练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* quiz.html · 听音选图（仅本页） */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body[data-page="quiz"] {
        min-height: 100dvh;
        overflow-x: clip;
        -webkit-tap-highlight-color: rgba(79, 172, 247, 0.15);
      }
      body[data-page="quiz"] .topbar {
        padding-top: env(safe-area-inset-top, 0);
      }
      body[data-page="quiz"] .topbar-inner {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      body[data-page="quiz"] .container {
        margin-top: 24px;
        margin-bottom: max(48px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      body[data-page="quiz"] .title {
        font-size: clamp(1.5rem, 6vw, 2.25rem);
        line-height: 1.35;
        text-align: center;
      }
      body[data-page="quiz"] .subtitle {
        font-size: clamp(0.95rem, 3.5vw, 1.05rem);
        line-height: 1.65;
        text-align: center;
      }
      body[data-page="quiz"] .choices {
        justify-content: center;
        gap: 16px;
        margin-top: 20px;
      }
      body[data-page="quiz"] .choice-card {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      body[data-page="quiz"] #quizFeedback {
        text-align: center;
        margin-top: 12px;
      }
      @media (max-width: 860px) {
        body[data-page="quiz"] .topbar-inner {
          flex-wrap: wrap;
          row-gap: 10px;
        }
        body[data-page="quiz"] .nav-buttons {
          display: flex !important;
          flex: 1 1 100%;
          order: 3;
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 4px;
          gap: 8px;
        }
        body[data-page="quiz"] .nav-buttons::-webkit-scrollbar { display: none; }
        body[data-page="quiz"] .nav-chip {
          flex-shrink: 0;
          min-height: 44px;
          padding: 10px 16px;
          font-size: 15px;
        }
        body[data-page="quiz"] .brand { font-size: 24px; }
        body[data-page="quiz"] .choice-card {
          width: calc(50% - 8px);
          height: auto;
          aspect-ratio: 6 / 5;
          min-height: 140px;
        }
      }
      @media (max-width: 520px) {
        body[data-page="quiz"] .card { padding: 20px 16px; }
        body[data-page="quiz"] .info-row {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }
        body[data-page="quiz"] .info-row .btn {
          width: 100%;
          min-height: 52px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          touch-action: manipulation;
        }
        body[data-page="quiz"] .choices {
          flex-direction: column;
          align-items: center;
          gap: 14px;
          margin-top: 16px;
        }
        body[data-page="quiz"] .choice-card {
          width: min(100%, 280px);
          max-width: 280px;
          height: auto;
          aspect-ratio: 6 / 5;
          min-height: 168px;
        }
        body[data-page="quiz"] #quizFeedback {
          font-size: 1rem;
          padding: 12px 14px;
        }
      }
      @media (hover: none) and (pointer: coarse) {
        body[data-page="quiz"] .choice-card:hover {
          transform: none;
          box-shadow: 0 6px 0 var(--blue-soft), var(--sh-sm);
          border-color: var(--line);
        }
        body[data-page="quiz"] .choice-card:active {
          transform: scale(0.98);
          top: 2px;
        }
        body[data-page="quiz"] .btn:hover { transform: none; filter: none; }
        body[data-page="quiz"] .nav-chip:hover { transform: none; }
        body[data-page="quiz"] .btn:active { transform: scale(0.98); }
      }
      @media (prefers-reduced-motion: reduce) {
        body[data-page="quiz"] .choice-card,
        body[data-page="quiz"] .btn,
        body[data-page="quiz"] .nav-chip {
          transition: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="../assets/primary-responsive.css?v=2" />
  <link rel="stylesheet" href="../../scripts/drawing-overlay.css?v=1" />
</head>
  <body data-page="quiz">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card">
        <h1 id="quizTitle" class="title"></h1>
        <p id="quizPrompt" class="subtitle"></p>
        <div class="info-row">
          <button id="btnQuizAudio" class="btn primary">🔊 播放单词</button>
          <button id="btnNextQuiz" class="btn success">下一题</button>
        </div>
        <div id="quizChoices" class="choices"></div>
        <div id="quizFeedback" class="feedback"></div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
    <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/assets/primary-responsive.js?v=2" defer></script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
