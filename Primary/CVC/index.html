<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CVC 自然拼读乐园</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* index.html · 首页自适应（仅本页） */
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body[data-page="home"] {
        min-height: 100dvh;
        overflow-x: clip;
        -webkit-tap-highlight-color: rgba(79, 172, 247, 0.15);
      }
      body[data-page="home"] .topbar {
        padding-top: env(safe-area-inset-top, 0);
      }
      body[data-page="home"] .topbar-inner {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      body[data-page="home"] .container {
        margin-top: 24px;
        margin-bottom: max(48px, env(safe-area-inset-bottom));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
      .back-hub {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 16px;
        min-height: 44px;
        padding: 6px 14px 6px 10px;
        border-radius: 999px;
        border: 2px solid var(--blue-soft);
        background: rgba(255, 255, 255, 0.9);
        color: var(--text-lite);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .back-hub:active { color: var(--blue-deep); border-color: var(--blue); }
      .home-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }
      @media (max-width: 860px) {
        body[data-page="home"] .topbar-inner {
          flex-wrap: wrap;
          row-gap: 10px;
        }
        body[data-page="home"] .nav-buttons {
          display: flex !important;
          flex: 1 1 100%;
          order: 3;
          justify-content: flex-start;
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 4px;
          gap: 8px;
        }
        body[data-page="home"] .nav-buttons::-webkit-scrollbar { display: none; }
        body[data-page="home"] .nav-chip {
          flex-shrink: 0;
          min-height: 44px;
          padding: 10px 16px;
          font-size: 15px;
        }
        body[data-page="home"] .brand { font-size: 24px; }
        body[data-page="home"] .title { font-size: clamp(1.75rem, 7vw, 2.25rem); letter-spacing: 1px; }
        body[data-page="home"] .subtitle { font-size: 1rem; }
        body[data-page="home"] .vowel-grid {
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr));
          gap: 14px;
        }
        body[data-page="home"] .vowel-big { font-size: clamp(3rem, 14vw, 3.5rem); }
      }
      @media (max-width: 520px) {
        body[data-page="home"] .card { padding: 20px 16px; }
        body[data-page="home"] .vowel-grid { grid-template-columns: 1fr 1fr; }
        body[data-page="home"] .home-actions {
          flex-direction: column;
          align-items: stretch;
        }
        body[data-page="home"] .home-actions .btn {
          width: 100%;
          min-height: 52px;
          white-space: normal;
          text-align: center;
        }
      }
      @media (max-width: 360px) {
        body[data-page="home"] .vowel-grid { grid-template-columns: 1fr; }
      }
      @media (hover: none) and (pointer: coarse) {
        body[data-page="home"] .vowel-card:hover {
          transform: none;
          box-shadow: var(--sh-card);
        }
        body[data-page="home"] .vowel-card:active {
          transform: scale(0.98);
          box-shadow: 0 10px 28px rgba(60, 130, 200, 0.18);
        }
        body[data-page="home"] .btn:hover { transform: none; filter: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        body[data-page="home"] .vowel-card,
        body[data-page="home"] .btn { transition: none !important; }
      }
    </style>
    <link rel="stylesheet" href="../assets/primary-responsive.css?v=2" />
  <link rel="stylesheet" href="../../scripts/drawing-overlay.css?v=1" />
</head>
  <body data-page="home">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <a class="back-hub" href="../phonics/index.html">← 启蒙语音</a>
      <section class="card">
        <h1 class="title">🌈 英语 CVC 单词乐园</h1>
        <p class="subtitle">选一个元音字母，开始今天的拼读之旅！</p>
        <div id="vowelGrid" class="vowel-grid"></div>
        <div class="divider" style="margin:28px 0 20px"></div>
        <div class="home-actions">
          <a href="practice-teacher.html" class="btn primary">🎯 课堂练习</a>
          <a href="test-teacher.html" class="btn orange">📝 听音辨音测试</a>
        </div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
    <script src="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/assets/primary-responsive.js?v=2" defer></script>
  <script src="../../scripts/drawing-overlay.js?v=1" defer></script>
</body>
</html>
