<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼写练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="spelling">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card">
        <h1 id="spellTitle" class="title"></h1>
        <p class="subtitle">听发音后，把字母拖到 3 个空格完成拼写。</p>
        <div id="spellSlots" class="slots"></div>
        <div id="spellLetters" class="letters"></div>
        <div class="info-row">
          <button id="btnSpellAudio" class="btn primary">🔊 播放单词</button>
          <button id="btnCheckSpell" class="btn">检查答案</button>
          <button id="btnNextWord" class="btn success">下一词</button>
        </div>
        <div id="spellFeedback" class="feedback"></div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
