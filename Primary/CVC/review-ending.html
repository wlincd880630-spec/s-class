<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>尾音练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="review-ending">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card card-single">
        <h1 id="reviewTitle" class="title"></h1>
        <p class="subtitle">听发音，拖拽正确尾字母到空格。</p>
        <div class="hero-layout">
          <div class="image-box">
            <img id="reviewImage" alt="word" />
          </div>
          <div class="review-content">
            <div id="reviewSlots" class="slots"></div>
            <div id="reviewOptions" class="letters"></div>
            <div id="reviewFeedback" class="feedback"></div>
            <div class="info-row">
              <button id="btnPlayReview" class="btn primary">🔊 播放单词</button>
              <button id="btnNextStage" class="btn success">下一词</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
