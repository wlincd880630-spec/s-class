<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>动作词与句子抄写 · Words & Sentences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
:root {
  --font-hand  : 'Patrick Hand', cursive;
  --font-ui    : 'Fredoka', sans-serif;
  --img-w      : 40mm;
  --line-blue  : #90CAF9;
  --line-red   : #EF9A9A;
  --line-dash  : rgba(33,150,243,.32);
  --text-dark  : #2C3E50;
  --trace-color: rgba(144,202,249,.55);
  --accent     : #FB8C00;
  --accent-bg  : #FFF3E0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font-ui);
  background: #455A64;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  min-height: 100dvh;
  overflow-x: clip;
  -webkit-tap-highlight-color: rgba(251, 140, 0, 0.12);
}

.back-hub {
  align-self: flex-start;
  margin: max(12px, env(safe-area-inset-top)) 0 0 max(16px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  border: 2px solid #90CAF9;
  background: rgba(255, 255, 255, 0.95);
  color: #1565C0;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  touch-action: manipulation;
}
.back-hub:active { background: #E3F2FD; }

#app {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.toolbar {
  width: 100%; padding: 12px 24px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  background: #fff;
  box-shadow: 0 2px 18px rgba(0,0,0,.2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 999;
}

.toolbar-left {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; color: #37474F; font-size: 1.05rem;
}
.toolbar-left .icon { font-size: 1.4rem; }

.mode-tabs { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; max-width: 100%; }
.mode-tabs::-webkit-scrollbar { display: none; }
.mtab {
  border: 2.5px solid transparent;
  border-radius: 50px;
  padding: 9px 22px;
  min-height: 44px;
  font-family: var(--font-ui);
  font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: .18s;
  background: #F5F5F5; color: #888;
  white-space: nowrap;
  flex-shrink: 0;
  touch-action: manipulation;
}
.mtab:hover { transform: translateY(-2px); }
.mtab[data-m="words"] { --c: #FB8C00; --bg: #FFF3E0; }
.mtab[data-m="sentences"] { --c: #00897B; --bg: #E0F2F1; }
.mtab.active {
  background: var(--bg);
  border-color: var(--c);
  color: var(--c);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.btn-print {
  background: #FF7043; color: #fff; border: none;
  padding: 10px 28px; min-height: 44px;
  border-radius: 50px;
  font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: .18s;
  box-shadow: 0 4px 12px rgba(255,112,67,.35);
  white-space: nowrap;
  touch-action: manipulation;
  flex-shrink: 0;
}
.btn-print:hover { transform: scale(1.05); background: #E64A19; }

.mode-section { display: none; width: 100%; }
.mode-section.active { display: flex; flex-direction: column; align-items: center; }

.page-viewport {
  width: min(210mm, calc(100vw - 24px));
  margin: 24px auto;
  overflow: hidden;
}

.page {
  background: #fff;
  width: 210mm; height: 297mm;
  padding: 14mm 14mm 10mm;
  margin: 0;
  box-shadow: 0 0 36px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
  page-break-after: always;
  overflow: hidden;
}

.page-hdr {
  flex-shrink: 0;
  height: 15mm;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2.5px solid #ECEFF1;
  padding-bottom: 3mm;
  margin-bottom: 3mm;
  font-size: .84rem; color: #9E9E9E;
  white-space: nowrap;
  gap: 3mm;
}
.page-hdr > span { white-space: nowrap; }
.page-hdr .topic-badge {
  font-size: 1.05rem; font-weight: 700;
  padding: 2px 14px; border-radius: 8px;
}

.page-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.page-ftr {
  flex-shrink: 0;
  height: 7mm;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: #BDBDBD;
  border-top: 1px solid #F5F5F5;
  padding-top: 2mm;
}

/* ── 单词块（与 CVC 抄写作业一致） ── */
.word-block {
  flex: 1;
  display: grid;
  grid-template-columns: var(--img-w) 1fr;
  grid-template-rows: 1fr 1fr;
  border-bottom: 1px solid #F5F5F5;
  min-height: 0;
}
.word-block:last-child { border-bottom: none; }

.img-col {
  grid-row: 1 / 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2.5mm;
  padding: 3mm 2mm 3mm 0;
  border-right: 1px dashed #E0E0E0;
}
.img-frame {
  width: 30mm; height: 30mm;
  border-radius: 10px;
  border: 2px solid #FFF3E0;
  background: #FFFAF5;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.img-frame img { width: 100%; height: 100%; object-fit: cover; }
.word-lbl {
  font-family: var(--font-hand);
  font-size: 1.1rem; font-weight: 700;
  letter-spacing: 1px;
}

.write-row {
  position: relative;
  min-height: 0;
  overflow: hidden;
}
.write-row:first-of-type { border-bottom: 1px dashed #EEEEEE; }

.grid-bg {
  position: absolute;
  top: 25%; height: 50%;
  left: 2mm; right: 1mm;
  pointer-events: none;
}
.gl { position: absolute; left: 0; right: 0; height: 0; }
.gl-sky   { top: 0%;   border-top: 1.3pt solid var(--line-blue); }
.gl-cloud { top: 33%;  border-top: 1.3pt dashed var(--line-dash); }
.gl-grass { top: 67%;  border-top: 2.8pt solid var(--line-blue); }
.gl-dirt  { top: 100%; border-top: 1.3pt solid var(--line-red); }

.cells {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding: 0 2mm;
  gap: 1mm;
}
.cell {
  flex: 1; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand);
  font-size: 2.58rem;
  letter-spacing: 0;
  transform: translateY(-1.4mm);
  user-select: none;
  text-align: center;
  line-height: 1.05;
  padding: 0 1mm;
}
.cell.model { color: var(--text-dark); font-weight: 700; }
.cell.trace { color: var(--trace-color); font-weight: 700; }
.cell.empty { color: transparent; }

.vsep {
  width: 1px; height: 36%; background: #DEDEDE;
  flex-shrink: 0;
  transform: translateY(-1.4mm);
  align-self: center;
}

.write-row.row2 .cell.trace { color: rgba(144,202,249,.28); }

/* ── 句子块：与单词块相同栅格（左 story 图 + 两行书写） ── */
.sentence-block.word-block .img-frame {
  border-color: #E0F2F1;
  background: #F9FDFC;
}
.sentence-block.word-block .word-lbl {
  font-size: 0.76rem;
  line-height: 1.22;
  text-align: center;
  max-width: 36mm;
  letter-spacing: 0;
  hyphens: auto;
  word-break: break-word;
}

.sentence-block .cell {
  font-size: 1.42rem;
  transform: translateY(-0.9mm);
}
.sentence-block .vsep {
  transform: translateY(-0.9mm);
}

@media screen and (max-width: 720px) {
  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  .toolbar-left { justify-content: center; }
  .mode-tabs { justify-content: center; }
  .btn-print { width: 100%; }
  .page-viewport {
    width: calc(100vw - 16px);
    margin: 12px auto;
  }
}

@media (hover: none) and (pointer: coarse) {
  .mtab:hover { transform: none; }
  .btn-print:hover { transform: none; }
  .btn-print:active { transform: scale(0.98); }
}

@media (prefers-reduced-motion: reduce) {
  .mtab, .btn-print { transition: none !important; }
}

@media print {
  body { background: #fff; padding: 0; }
  .back-hub { display: none !important; }
  .toolbar { display: none !important; }
  .mode-section { display: none !important; }
  .mode-section.active { display: block !important; }
  .page-viewport {
    width: auto;
    height: auto;
    overflow: visible;
    margin: 0;
  }
  .page-viewport .page {
    transform: none !important;
  }
  .page {
    margin: 0; box-shadow: none; border: none;
    width: 210mm; height: 297mm;
    padding: 14mm 14mm 10mm;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

</head>
<body>

<a class="back-hub" href="index.html">← CVC 乐园</a>

<div class="toolbar">
  <div class="toolbar-left">
    <span class="icon">✏️</span>
    <span>Words & Sentences 抄写</span>
  </div>
  <div class="mode-tabs" id="modeTabs">
    <button type="button" class="mtab active" data-m="words" onclick="showMode('words')">Words 单词</button>
    <button type="button" class="mtab" data-m="sentences" onclick="showMode('sentences')">Sentences 句子</button>
  </div>
  <button type="button" class="btn-print" onclick="window.print()">🖨️ Print / 打印</button>
</div>

<div id="app"></div>

<script>
const WORDS = ['tug', 'run', 'jump', 'roll', 'catch'];
/** 每句抄写 + 左侧 story 配图（课件 images/story 下编号图） */
const SENTENCES = [
  { text: 'This is my cat.', story: '01.png' },
  { text: 'My cat is cute.', story: '08.png' },
  { text: 'I like my cat.', story: '12.png' }
];

/**
 * 课件图片根目录（与 Jump Pup 课件 index.html 一致：images/story、images/words）
 * 本页在「小一/CVC」下时，相对路径指向 D:\DS\国家地理分级\jump-pup-courseware\images\
 * 若移动了 HTML，可把下面改成绝对地址，例如：
 * file:///D:/DS/国家地理分级/jump-pup-courseware/images/
 */
const PUP_MEDIA = "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Jump%20Pup/jump-pup-courseware/images/";
var PUP_IMAGES_BASE = '';
var STORY_BASE = '';
var WORDS_PNG_BASE = '';

/** 与课件课文句顺序对应：Jump pup → Tug → Run → Roll → Catch a ball（见 index.html STORY） */
const WORD_STORY_FILE = {
  jump: '02.png',
  tug: '03.png',
  run: '04.png',
  roll: '05.png',
  catch: '06.png'
};

const THEME_WORDS = { color: '#FB8C00', bg: '#FFF3E0', label: 'Action Words', badge: 'tug · run · jump · roll · catch' };
const THEME_SENT = { color: '#00897B', bg: '#E0F2F1', label: 'My Cat', badge: 'Unit sentences' };

function svgPlaceholderDataUrl(line1, line2) {
  const esc = (t) => String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff3e0"/><stop offset="100%" stop-color="#fffde7"/></linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="50%" y="40%" text-anchor="middle" font-size="32" fill="#E65100" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${esc(line1)}</text>
    <text x="50%" y="54%" text-anchor="middle" font-size="13" fill="#546E7A" font-family="Segoe UI,Arial,sans-serif">${esc(line2)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function buildWriteRow(text, rowClass) {
  return `
    <div class="write-row ${rowClass}">
      <div class="grid-bg">
        <div class="gl gl-sky"></div>
        <div class="gl gl-cloud"></div>
        <div class="gl gl-grass"></div>
        <div class="gl gl-dirt"></div>
      </div>
      <div class="cells">
        <div class="cell model">${escapeHtml(text)}</div>
        <div class="vsep"></div>
        <div class="cell trace">${escapeHtml(text)}</div>
        <div class="cell trace">${escapeHtml(text)}</div>
        <div class="vsep"></div>
        <div class="cell empty">${escapeHtml(text)}</div>
        <div class="cell empty">${escapeHtml(text)}</div>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function chainImgSrc(img, list, finalSvg) {
  var i = 0;
  function next() {
    if (i < list.length) {
      img.src = list[i++];
    } else {
      img.onerror = null;
      img.src = finalSvg;
    }
  }
  img.onerror = next;
  next();
}

function buildWordBlock(word) {
  const block = document.createElement('div');
  block.className = 'word-block';
  const storyFile = WORD_STORY_FILE[word] || (word + '.png');
  const tryList = [
    STORY_BASE + storyFile,
    WORDS_PNG_BASE + word + '.png'
  ];
  block.innerHTML = `
    <div class="img-col">
      <div class="img-frame">
        <img src="" alt="${escapeHtml(word)}" />
      </div>
      <div class="word-lbl" style="color:${THEME_WORDS.color}">${escapeHtml(word)}</div>
    </div>
    ${buildWriteRow(word, 'row1')}
    ${buildWriteRow(word, 'row2')}
  `;
  const img = block.querySelector('.img-frame img');
  chainImgSrc(
    img,
    tryList,
    svgPlaceholderDataUrl(word, tryList[0])
  );
  return block;
}

function buildSentenceBlock(entry) {
  const sentence = entry.text;
  const block = document.createElement('div');
  block.className = 'word-block sentence-block';
  const tryList = [STORY_BASE + entry.story];
  block.innerHTML = `
    <div class="img-col">
      <div class="img-frame">
        <img src="" alt="" />
      </div>
      <div class="word-lbl" style="color:${THEME_SENT.color}">${escapeHtml(sentence)}</div>
    </div>
    ${buildWriteRow(sentence, 'row1')}
    ${buildWriteRow(sentence, 'row2')}
  `;
  const img = block.querySelector('.img-frame img');
  chainImgSrc(
    img,
    tryList,
    svgPlaceholderDataUrl(sentence.slice(0, 18), STORY_BASE + entry.story)
  );
  return block;
}

function buildWordsPage() {
  const viewport = document.createElement('div');
  viewport.className = 'page-viewport';

  const page = document.createElement('div');
  page.className = 'page';

  const hdr = document.createElement('div');
  hdr.className = 'page-hdr';
  hdr.innerHTML = `
    <span>Name: ___________________</span>
    <span class="topic-badge" style="background:${THEME_WORDS.bg};color:${THEME_WORDS.color}">${THEME_WORDS.label}</span>
    <span>Date: ____ / ____ / ____</span>
  `;
  page.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'page-body';
  WORDS.forEach((w) => body.appendChild(buildWordBlock(w)));
  page.appendChild(body);

  const ftr = document.createElement('div');
  ftr.className = 'page-ftr';
  ftr.textContent =
    'Magic English • Action Words Handwriting • ' +
    WORDS.join(', ') +
    '  |  Page 1 / 1';
  page.appendChild(ftr);

  viewport.appendChild(page);
  return viewport;
}

function buildSentencesPage() {
  const viewport = document.createElement('div');
  viewport.className = 'page-viewport';

  const page = document.createElement('div');
  page.className = 'page';

  const hdr = document.createElement('div');
  hdr.className = 'page-hdr';
  hdr.innerHTML = `
    <span>Name: ___________________</span>
    <span class="topic-badge" style="background:${THEME_SENT.bg};color:${THEME_SENT.color}">${THEME_SENT.label}</span>
    <span>Date: ____ / ____ / ____</span>
  `;
  page.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'page-body';
  SENTENCES.forEach((entry) => body.appendChild(buildSentenceBlock(entry)));
  page.appendChild(body);

  const ftr = document.createElement('div');
  ftr.className = 'page-ftr';
  ftr.textContent =
    'Magic English • Sentence Copy Practice • ' +
    THEME_SENT.badge +
    '  |  Page 1 / 1';
  page.appendChild(ftr);

  viewport.appendChild(page);
  return viewport;
}

function fitPageViewports() {
  if (window.matchMedia('print').matches) return;
  document.querySelectorAll('.page-viewport').forEach((vp) => {
    const page = vp.querySelector('.page');
    if (!page) return;
    page.style.transform = 'none';
    page.style.transformOrigin = 'top left';
    const naturalW = page.offsetWidth;
    const targetW = vp.clientWidth;
    if (!naturalW || !targetW) return;
    const scale = Math.min(1, targetW / naturalW);
    page.style.transform = scale < 1 ? `scale(${scale})` : 'none';
    vp.style.height = scale < 1 ? `${page.offsetHeight * scale}px` : 'auto';
  });
}

function showMode(m) {
  document.querySelectorAll('.mode-section').forEach((el) => el.classList.remove('active'));
  document.getElementById('section-' + m).classList.add('active');
  document.querySelectorAll('.mtab').forEach((t) => t.classList.remove('active'));
  document.querySelector(`.mtab[data-m="${m}"]`).classList.add('active');
  window.scrollTo({
    top: 0,
    behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
  });
  fitPageViewports();
}

function init() {
  STORY_BASE = PUP_MEDIA + 'story/';
  WORDS_PNG_BASE = PUP_MEDIA + 'words/';

  const app = document.getElementById('app');

  const secWords = document.createElement('div');
  secWords.id = 'section-words';
  secWords.className = 'mode-section active';
  secWords.appendChild(buildWordsPage());
  app.appendChild(secWords);

  const secSent = document.createElement('div');
  secSent.id = 'section-sentences';
  secSent.className = 'mode-section';
  secSent.appendChild(buildSentencesPage());
  app.appendChild(secSent);
  fitPageViewports();
}

let fitTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitPageViewports, 120);
});
window.addEventListener('orientationchange', fitPageViewports);

window.addEventListener('load', init);
</script>

</body>
