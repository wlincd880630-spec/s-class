<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>自我介绍 - 句子抄写作业</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
:root {
  --font-hand  : 'Patrick Hand', cursive;
  --font-ui    : 'Fredoka', sans-serif;
  --row-h      : 31mm;
  --line-blue  : #90CAF9;
  --line-red   : #EF9A9A;
  --line-dash  : rgba(33,150,243,.32);
  --text-dark  : #2C3E50;
  --trace-color: rgba(144, 202, 249, 0.65);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: #455A64;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  min-height: 100dvh;
  overflow-x: clip;
  -webkit-tap-highlight-color: rgba(30, 136, 229, 0.12);
}

.back-hub {
  align-self: flex-start;
  margin: 12px 0 0 max(16px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  border: 2px solid #90CAF9;
  background: rgba(255, 255, 255, 0.95);
  color: #1565C0;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  touch-action: manipulation;
}
.back-hub:active { background: #E3F2FD; }

#app {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
}

.toolbar {
  width: 100%; padding: 12px 24px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  background: #fff;
  box-shadow: 0 2px 18px rgba(0,0,0,.2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 999;
}

.toolbar-left { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #37474F; font-size: 1.05rem; }

.btn-print {
  background: #FF7043; color: #fff; border: none;
  padding: 10px 28px; min-height: 44px;
  border-radius: 50px;
  font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: .18s;
  box-shadow: 0 4px 12px rgba(255,112,67,.35);
  touch-action: manipulation;
  flex-shrink: 0;
}
.btn-print:hover { transform: scale(1.05); background: #E64A19; }

.page-viewport {
  width: min(210mm, calc(100vw - 24px));
  margin: 24px auto;
  overflow: hidden;
}

.page {
  background: #fff;
  width: 210mm; height: 297mm;
  padding: 14mm 14mm 10mm;
  margin: 24px 0;
  box-shadow: 0 0 36px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
  page-break-after: always;
  overflow: hidden;
}

.page-hdr {
  flex-shrink: 0;
  height: 15mm;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2.5px solid #ECEFF1;
  padding-bottom: 3mm;
  margin-bottom: 4mm;
  font-size: .84rem; color: #9E9E9E;
}

.page-ftr {
  flex-shrink: 0;
  height: 7mm;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: #BDBDBD;
  border-top: 1px solid #F5F5F5;
  padding-top: 2mm;
}

.sentence-block {
  display: flex;
  flex-direction: column;
  gap: 4mm;
  border-bottom: none;
  padding-bottom: 0;
  margin-bottom: 0;
  min-height: 0;
  flex: 1;
}

.sen-imgs {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: stretch;
  gap: 3mm;
  padding: 0 0 3mm;
  border-bottom: 1px dashed #E0E0E0;
}
.sen-img-frame {
  width: 56mm;
  height: 36mm;
  border-radius: 8px;
  border: 2px solid #E3F2FD;
  background: #F8FBFF;
  overflow: hidden;
  flex: 0 0 auto;
}
.sen-img-frame img { width: 100%; height: 100%; object-fit: cover; }

.sen-model {
  font-family: var(--font-hand);
  font-size: clamp(1.2rem, 2.5vw, 2.674rem);
  font-weight: 700;
  color: var(--text-dark);
  letter-spacing: 0.5px;
  padding: 2mm 3mm 1mm;
  text-align: center;
  transform: translateY(-0.2cm);
  line-height: 1.25;
  word-break: break-word;
}

.copy-rows {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.copy-line {
  position: relative;
  height: var(--row-h);
  min-height: var(--row-h);
  overflow: hidden;
}
.copy-line + .copy-line {
  border-top: 1px dashed #EEEEEE;
}
.copy-line .grid-bg {
  position: absolute;
  top: 25%;
  height: 50%;
  left: 10mm;
  right: 2mm;
  pointer-events: none;
}
.copy-line .gl {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
}
.copy-line .gl-sky   { top: 0%;   border-top: 1.3pt solid var(--line-blue); }
.copy-line .gl-cloud { top: 33%;  border-top: 1.3pt dashed var(--line-dash); }
.copy-line .gl-grass { top: 67%;  border-top: 2.8pt solid var(--line-blue); }
.copy-line .gl-dirt  { top: 100%; border-top: 1.3pt solid var(--line-red); }
.copy-line .line-label {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(calc(-50% - 0.2cm));
  font-size: 1.338rem;
  color: #9E9E9E;
  width: 8mm;
}
.copy-line.trace-line .trace-text {
  position: absolute;
  left: 10mm;
  right: 2mm;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 1mm;
  transform: translateY(-1.4mm);
  font-family: var(--font-hand);
  font-size: 2.605rem;
  font-weight: 700;
  color: var(--trace-color);
  letter-spacing: 0.5px;
  pointer-events: none;
  line-height: 1;
}

@media screen and (max-width: 720px) {
  .toolbar-left span:not(:first-child) {
    font-size: 0.92rem;
    line-height: 1.35;
  }
  .toolbar {
    justify-content: center;
  }
  .btn-print {
    width: 100%;
  }
  .page-viewport {
    width: calc(100vw - 16px);
    margin: 12px auto;
  }
  .page {
    margin: 0;
    box-shadow: 0 0 24px rgba(0,0,0,.45);
  }
}

@media (hover: none) and (pointer: coarse) {
  .btn-print:hover { transform: none; }
  .btn-print:active { transform: scale(0.98); }
}

@media (prefers-reduced-motion: reduce) {
  .btn-print { transition: none !important; }
}

@page {
  size: A4;
  margin: 10mm;
}

@media print {
  body { background: #fff; padding: 0; }
  .back-hub { display: none !important; }
  .toolbar { display: none !important; }
  #app { width: 100%; padding: 0; }
  .page-viewport {
    width: auto;
    height: auto;
    overflow: visible;
    margin: 0;
  }
  .page-viewport .page {
    transform: none !important;
  }

  .page {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 8mm 0 !important;
    box-shadow: none;
    page-break-after: always;
    page-break-inside: avoid;
    overflow: visible !important;
  }

  .sen-model {
    font-size: 38.828pt;
    transform: translateY(-1mm);
  }
  .sen-model span {
    font-size: 20.801pt !important;
  }
  .copy-line.trace-line .trace-text {
    font-size: 37.441pt;
    transform: translateY(-1.5mm);
  }
  .copy-line .line-label {
    font-size: 19.414pt;
    transform: translateY(calc(-50% - 1mm));
  }

  .page-hdr { font-size: 12.48pt; }
  .page-ftr { font-size: 11.094pt; }

  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
  <link rel="stylesheet" href="../assets/primary-responsive.css?v=1" />
</head>
<body>

<a class="back-hub" href="./index.html">← CVC 首页</a>

<div class="toolbar">
  <div class="toolbar-left">
    <span>✏️</span>
    <span>自我介绍 · 句子抄写作业</span>
  </div>
  <button class="btn-print" onclick="window.print()">🖨️ 打印</button>
</div>

<div id="app"></div>

<script>
const SENTENCES = [
  {
    en: "What is your name?",
    zh: "你叫什么名字？",
    imgs: [
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-name-1.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-name-2.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-name-3.png"
    ]
  },
  {
    en: "I am Xinyu",
    zh: "我是心雨。",
    imgs: [
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-xinyu-1.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-xinyu-2.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-xinyu-3.png"
    ]
  },
  {
    en: "I am a girl",
    zh: "我是一个女孩。",
    imgs: [
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-girl-1.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-girl-2.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-girl-3.png"
    ]
  },
  {
    en: "I am a student",
    zh: "我是一名学生。",
    imgs: [
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-student-1.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-student-2.png",
      "https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/sentences/intro-student-3.png"
    ]
  }
];

function svgPlaceholderDataUrl(line1, line2) {
  const esc = (t) => String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#fff8e1"/></linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="50%" y="42%" text-anchor="middle" font-size="22" fill="#1565C0" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${esc(line1)}</text>
    <text x="50%" y="58%" text-anchor="middle" font-size="12" fill="#546E7A" font-family="Segoe UI,Arial,sans-serif">${esc(line2)}</text>
    <text x="50%" y="76%" text-anchor="middle" font-size="11" fill="#90A4AE" font-family="Segoe UI,Arial,sans-serif">请将 PNG 放入 sentences 文件夹后刷新</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function buildPage() {
  const app = document.getElementById('app');
  const total = SENTENCES.length;

  SENTENCES.forEach((s, i) => {
    const viewport = document.createElement('div');
    viewport.className = 'page-viewport';

    const page = document.createElement('div');
    page.className = 'page';

    const hdr = document.createElement('div');
    hdr.className = 'page-hdr';
    hdr.innerHTML = `
      <span>Name: ___________________</span>
      <span style="font-weight:700;color:#8E24AA;">自我介绍 · 每页一句 · 抄写4遍</span>
      <span>Date: ____ / ____ / ____</span>
    `;
    page.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'page-body';
    body.style.flex = '1';
    body.style.display = 'flex';
    body.style.flexDirection = 'column';

    const block = document.createElement('div');
    block.className = 'sentence-block';
    block.innerHTML = `
      <div class="sen-imgs">
        <div class="sen-img-frame"><img class="sen-panel-img" data-idx="0" src="${s.imgs[0]}" alt="图1" /></div>
        <div class="sen-img-frame"><img class="sen-panel-img" data-idx="1" src="${s.imgs[1]}" alt="图2" /></div>
        <div class="sen-img-frame"><img class="sen-panel-img" data-idx="2" src="${s.imgs[2]}" alt="图3" /></div>
      </div>
      <div class="sen-model">${s.en}<span style="font-size:1.478rem;color:#9E9E9E;font-weight:500;margin-left:8px;">（${s.zh}）</span></div>
      <div class="copy-rows">
        <div class="copy-line trace-line">
          <div class="grid-bg">
            <div class="gl gl-sky"></div>
            <div class="gl gl-cloud"></div>
            <div class="gl gl-grass"></div>
            <div class="gl gl-dirt"></div>
          </div>
          <span class="trace-text">${s.en}</span>
          <span class="line-label">①</span>
        </div>
        <div class="copy-line">
          <div class="grid-bg">
            <div class="gl gl-sky"></div>
            <div class="gl gl-cloud"></div>
            <div class="gl gl-grass"></div>
            <div class="gl gl-dirt"></div>
          </div>
          <span class="line-label">②</span>
        </div>
        <div class="copy-line">
          <div class="grid-bg">
            <div class="gl gl-sky"></div>
            <div class="gl gl-cloud"></div>
            <div class="gl gl-grass"></div>
            <div class="gl gl-dirt"></div>
          </div>
          <span class="line-label">③</span>
        </div>
        <div class="copy-line">
          <div class="grid-bg">
            <div class="gl gl-sky"></div>
            <div class="gl gl-cloud"></div>
            <div class="gl gl-grass"></div>
            <div class="gl gl-dirt"></div>
          </div>
          <span class="line-label">④</span>
        </div>
      </div>
    `;
    body.appendChild(block);
    block.querySelectorAll('.sen-panel-img').forEach((img) => {
      const idx = parseInt(img.dataset.idx, 10);
      const path = s.imgs[idx];
      const shortPath = path.replace(/^\.\//, '');
      img.addEventListener('error', function onErr() {
        this.removeEventListener('error', onErr);
        this.src = svgPlaceholderDataUrl('句子连环图 ' + (idx + 1), shortPath);
      }, { once: true });
    });

    page.appendChild(body);

    const ftr = document.createElement('div');
    ftr.className = 'page-ftr';
    ftr.textContent = `Magic English • 自我介绍句子抄写（抄写4遍）|  ${s.en}  |  ${i + 1} / ${total}`;
    page.appendChild(ftr);

    viewport.appendChild(page);
    app.appendChild(viewport);
  });
  fitPageViewports();
}

function fitPageViewports() {
  if (window.matchMedia('print').matches) return;
  document.querySelectorAll('.page-viewport').forEach((vp) => {
    const page = vp.querySelector('.page');
    if (!page) return;
    page.style.transform = 'none';
    page.style.transformOrigin = 'top left';
    const naturalW = page.offsetWidth;
    const targetW = vp.clientWidth;
    if (!naturalW || !targetW) return;
    const scale = Math.min(1, targetW / naturalW);
    page.style.transform = scale < 1 ? `scale(${scale})` : 'none';
    vp.style.height = scale < 1 ? `${page.offsetHeight * scale}px` : 'auto';
  });
}

let fitTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitPageViewports, 120);
});
window.addEventListener('orientationchange', fitPageViewports);

window.addEventListener('load', buildPage);
</script>
  <script src="../assets/primary-responsive.js?v=1" defer></script>
</body>
</html>
