<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>句子学习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="sentence">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card">
        <h1 class="title"><span id="sentenceWord"></span> 句子学习</h1>
        <p id="sentenceEn" class="sentence"></p>
        <div id="sentenceCn" class="hint"></div>
        <div class="info-row">
          <button id="btnPlaySentence" class="btn primary">🔊 朗读整句</button>
          <button id="btnShowSentenceCn" class="btn">显示/隐藏中文</button>
        </div>
      </section>
      <section class="card" style="margin-top: 20px">
        <div class="panel3">
          <div class="image-box"><img id="senImg1" alt="panel 1" /></div>
          <div class="image-box"><img id="senImg2" alt="panel 2" /></div>
          <div class="image-box"><img id="senImg3" alt="panel 3" /></div>
        </div>
        <div class="info-row" style="margin-top: 18px">
          <a id="btnPrevSentence" class="btn soft" href="#">上一个</a>
          <a id="btnNextSentence" class="btn success" href="#">下一个</a>
          <a id="btnSentenceOrder" class="btn primary" href="#">排序练习</a>
          <a id="btnSentenceBlank" class="btn primary" href="#">填空练习</a>
          <a id="btnSentencePicture" class="btn primary" href="#">选图练习</a>
        </div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
