<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>句子填空练习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="sentence-blank">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html">CVC <span>Kids</span></a>
        <nav id="navVowels" class="nav-buttons"></nav>
      </div>
    </header>
    <main class="container">
      <section class="card card-single">
        <h1 id="blankTitle" class="title"></h1>
        <p class="subtitle">听句子发音，拖拽正确单词填入空格。</p>
        <div id="blankSentence" class="blank-sentence"></div>
        <div class="blank-options-label">可选单词：</div>
        <div id="blankOptions" class="letters blank-options"></div>
        <div class="info-row">
          <button id="btnBlankAudio" class="btn primary">🔊 播放句子</button>
          <button id="btnBlankCheck" class="btn success">检查填空</button>
        </div>
        <div id="blankFeedback" class="feedback"></div>
      </section>
    </main>
    <script src="./cvc-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
