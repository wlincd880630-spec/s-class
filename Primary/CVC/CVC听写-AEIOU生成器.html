<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CVC 听写生成器 · AEIOU（多选元音 · PDF）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.42.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>

<style>
:root {
  --font-hand  : 'Patrick Hand', cursive;
  --font-ui    : 'Fredoka', sans-serif;
  --row-h      : 31mm;
  --line-blue  : #90CAF9;
  --line-red   : #EF9A9A;
  --line-dash  : rgba(33,150,243,.32);
  --text-dark  : #2C3E50;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: #455A64;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  min-height: 100dvh;
  overflow-x: clip;
  -webkit-tap-highlight-color: rgba(30, 136, 229, 0.12);
}

.back-hub {
  align-self: flex-start;
  margin: 12px 0 0 max(16px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  border: 2px solid #90CAF9;
  background: rgba(255, 255, 255, 0.95);
  color: #1565C0;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  touch-action: manipulation;
}
.back-hub:active { background: #E3F2FD; }

/* —— 控制面板（屏幕-only） —— */
.gen-panel {
  width: 100%;
  max-width: 920px;
  margin: 0 auto;
  padding: 16px 20px 20px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,.2);
  position: sticky;
  top: 0;
  z-index: 1000;
  border-radius: 0 0 16px 16px;
}

.gen-panel h1 {
  font-size: 1.15rem;
  color: #37474F;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.vowel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px 14px;
  margin-bottom: 14px;
}

.vowel-cell {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 2px solid #ECEFF1;
  transition: .15s;
}
.vowel-cell.on { border-color: currentColor; background: rgba(0,0,0,.02); }
.vowel-cell[data-v="a"] { --vc:#1E88E5; --vbg:#E3F2FD; color: var(--vc); }
.vowel-cell[data-v="e"] { --vc:#43A047; --vbg:#E8F5E9; color: var(--vc); }
.vowel-cell[data-v="i"] { --vc:#D81B60; --vbg:#FCE4EC; color: var(--vc); }
.vowel-cell[data-v="o"] { --vc:#FB8C00; --vbg:#FFF3E0; color: var(--vc); }
.vowel-cell[data-v="u"] { --vc:#8E24AA; --vbg:#F3E5F5; color: var(--vc); }

.vowel-cell input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  flex-shrink: 0;
  touch-action: manipulation;
}
.vowel-cell label.lbl {
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  min-width: 2.2em;
  user-select: none;
}
.vowel-cell .count-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}
.vowel-cell .count-wrap span { font-size: .75rem; color: #78909C; }
.vowel-cell input[type="number"] {
  width: 52px;
  min-height: 40px;
  padding: 6px 8px;
  border: 1px solid #CFD8DC;
  border-radius: 8px;
  font-weight: 700;
  font-size: .95rem;
  text-align: center;
  touch-action: manipulation;
}
.vowel-cell input[type="number"]:disabled {
  opacity: .45;
  cursor: not-allowed;
  background: #F5F5F5;
}

.gen-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px solid #ECEFF1;
}

.btn-gen {
  background: #5E35B1;
  color: #fff;
  border: none;
  padding: 11px 22px;
  min-height: 48px;
  border-radius: 50px;
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(94,53,177,.35);
  touch-action: manipulation;
}
.btn-gen:hover { filter: brightness(1.08); transform: scale(1.02); }

.btn-pdf {
  background: #00838F;
  color: #fff;
  border: none;
  padding: 11px 22px;
  min-height: 48px;
  border-radius: 50px;
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
.btn-pdf:hover { background: #006064; }

.voice-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: .85rem;
  color: #546E7A;
}
.voice-row select {
  padding: 8px 12px;
  min-height: 44px;
  border-radius: 8px;
  border: 1px solid #CFD8DC;
  font-size: .85rem;
  touch-action: manipulation;
}

.hint {
  font-size: .78rem;
  color: #90A4AE;
  line-height: 1.45;
  flex: 1 1 220px;
}

.summary {
  font-size: .88rem;
  color: #455A64;
  font-weight: 600;
  margin-top: 10px;
}

label.chk-answers {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-size: .88rem;
  color: #546E7A;
  cursor: pointer;
  touch-action: manipulation;
}
label.chk-answers input { width: 20px; height: 20px; }

body:not(.show-answers) .answer-word { display: none !important; }

/* —— 听写页 —— */
#app {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
}

.page-viewport {
  width: min(210mm, calc(100vw - 24px));
  margin: 24px auto;
  overflow: hidden;
}

.page {
  background: #fff;
  width: 210mm;
  min-height: 297mm;
  height: 297mm;
  padding: 14mm 14mm 10mm;
  margin: 24px 0;
  box-shadow: 0 0 36px rgba(0,0,0,.55);
  display: flex;
  flex-direction: column;
  page-break-after: always;
  overflow: hidden;
}

.page-hdr {
  flex-shrink: 0;
  height: 15mm;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2.5px solid #ECEFF1;
  padding-bottom: 3mm;
  margin-bottom: 4mm;
  font-size: .84rem;
  color: #9E9E9E;
  gap: 2mm;
}

.page-hdr .title-chip {
  font-weight: 700;
  font-size: .88rem;
  padding: 2px 12px;
  border-radius: 8px;
  background: #ECEFF1;
  color: #455A64;
  text-align: center;
}

.page-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0;
  min-height: 0;
}

.dict-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 0;
  padding: 2mm 0 3mm;
  border-bottom: 1px dashed #E0E0E0;
}
.dict-block:last-child { border-bottom: none; }
.dict-block.only-one { flex: 1.2; }

.block-hdr {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  padding: 0 2mm 2mm;
}
.idx-label { font-size: .8rem; color: #BDBDBD; }

.img-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2mm;
  padding: 2mm 0 3mm;
}
.img-frame {
  width: 52mm;
  height: 52mm;
  border-radius: 12px;
  border: 2px solid #E3F2FD;
  background: #F8FBFF;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-frame img { width: 100%; height: 100%; object-fit: cover; }

.answer-word {
  font-family: var(--font-hand);
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 2px 16px;
  border-radius: 8px;
  border: 2px dashed #B0BEC5;
}

.speak-row {
  display: flex;
  justify-content: center;
  padding: 0 0 3mm;
}
.btn-speak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-ui);
  font-size: .9rem;
  font-weight: 700;
  padding: 10px 18px;
  min-height: 44px;
  border-radius: 50px;
  border: 2px solid #00897B;
  background: #E0F2F1;
  color: #00695C;
  cursor: pointer;
  touch-action: manipulation;
}
.btn-speak:hover:not(:disabled) { background: #B2DFDB; }
.btn-speak:disabled { opacity: .55; cursor: wait; }

.blank-rows { width: 100%; padding-top: 1mm; }
.blank-line {
  position: relative;
  height: var(--row-h);
  min-height: var(--row-h);
  overflow: hidden;
}
.blank-line .grid-bg {
  position: absolute;
  top: 25%;
  height: 50%;
  left: 8mm;
  right: 8mm;
  pointer-events: none;
}
.blank-line .gl { position: absolute; left: 0; right: 0; height: 0; }
.blank-line .gl-sky   { top: 0%;   border-top: 1.3pt solid var(--line-blue); }
.blank-line .gl-cloud { top: 33%;  border-top: 1.3pt dashed var(--line-dash); }
.blank-line .gl-grass { top: 67%;  border-top: 2.8pt solid var(--line-blue); }
.blank-line .gl-dirt  { top: 100%; border-top: 1.3pt solid var(--line-red); }

.page-ftr {
  flex-shrink: 0;
  height: 7mm;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .72rem;
  color: #BDBDBD;
  border-top: 1px solid #F5F5F5;
  padding-top: 2mm;
}

.empty-tip {
  color: #B0BEC5;
  padding: 48px 24px;
  text-align: center;
  font-size: 1rem;
  line-height: 1.6;
}

@media screen and (max-width: 720px) {
  .gen-panel h1 {
    font-size: clamp(1rem, 4.2vw, 1.15rem);
    line-height: 1.45;
  }
  .vowel-grid {
    grid-template-columns: 1fr;
  }
  .vowel-cell {
    flex-wrap: wrap;
    min-height: 48px;
  }
  .vowel-cell .count-wrap {
    margin-left: 0;
    width: 100%;
    justify-content: flex-end;
    padding-left: 28px;
  }
  .gen-actions {
    flex-direction: column;
    align-items: stretch;
  }
  .btn-gen,
  .btn-pdf {
    width: 100%;
  }
  .voice-row {
    width: 100%;
  }
  .voice-row select {
    flex: 1 1 auto;
    min-width: 0;
  }
  .hint {
    flex: 1 1 auto;
    font-size: 0.82rem;
  }
  .page-viewport {
    width: calc(100vw - 16px);
    margin: 12px auto;
  }
  .page {
    margin: 0;
    box-shadow: 0 0 24px rgba(0,0,0,.45);
  }
  .btn-speak {
    width: 100%;
    justify-content: center;
  }
}

@media (hover: none) and (pointer: coarse) {
  .btn-gen:hover { filter: none; transform: none; }
  .btn-pdf:hover { background: #00838F; }
  .btn-gen:active { filter: brightness(0.95); }
  .btn-pdf:active { background: #006064; }
  .btn-speak:hover:not(:disabled) { background: #E0F2F1; }
  .btn-speak:active:not(:disabled) { background: #B2DFDB; }
}

@media (prefers-reduced-motion: reduce) {
  .vowel-cell,
  .btn-gen,
  .btn-pdf { transition: none !important; }
  .btn-gen:hover { transform: none !important; }
}

@media print {
  body { background: #fff; padding: 0; }
  .back-hub { display: none !important; }
  .no-print { display: none !important; }
  .answer-word { display: none !important; }
  #app { padding: 0; }
  .page-viewport {
    width: auto;
    height: auto;
    overflow: visible;
    margin: 0;
  }
  .page-viewport .page {
    transform: none !important;
  }
  .page {
    margin: 0;
    box-shadow: none;
    page-break-after: always;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<a class="back-hub no-print" href="./index.html">← CVC 首页</a>

<div class="gen-panel no-print">
  <h1>📝 CVC 听写生成器 <small style="font-weight:600;color:#78909C;">AEIOU</small></h1>
  <div class="vowel-grid" id="vowelGrid"></div>
  <div class="gen-actions">
    <button type="button" class="btn-gen" id="btnGenerate">生成听写</button>
    <button type="button" class="btn-pdf" id="btnPdf">导出 PDF</button>
    <label class="chk-answers">
      <input type="checkbox" id="toggleAnswers" />
      屏幕显示答案词（打印仍隐藏）
    </label>
    <div class="voice-row">
      <span>Azure 音色</span>
      <select id="azureVoice" title="神经网络语音">
        <option value="en-US-JennyNeural">en-US-JennyNeural</option>
        <option value="en-US-GuyNeural">en-US-GuyNeural</option>
        <option value="en-US-AriaNeural">en-US-AriaNeural</option>
        <option value="en-GB-SoniaNeural">en-GB-SoniaNeural</option>
      </select>
    </div>
    <p class="hint">
      勾选元音并填写每个元音抽词数量（从词库随机不重复抽取，总表再随机打乱）。<br />
      <strong>导出 PDF</strong>：将打开打印对话框，打印机选「另存为 PDF」或「Microsoft Print to PDF」。<br />
      <span style="color:#C62828;">密钥已写在页面脚本中，勿上传公网；建议在 Azure 轮换密钥。</span>
    </p>
  </div>
  <div class="summary" id="genSummary"></div>
</div>

<div id="app">
  <p class="empty-tip no-print">请先设置元音与数量，点击「生成听写」。</p>
</div>

<script>
/**
 * ⚠️ Azure Speech 密钥写在源码中，仅限本机使用；勿提交 Git / 勿发网盘。
 * 若密钥曾泄露，请到 Azure 门户重新生成。
 */
const AZURE_SPEECH_KEY = 'DKRXk8ueSfo5NdIOMqFRTCAfpeGDezJ3Snf5K8gGgtyqxiWdugLzJQQJ99BLACHYHv6XJ3w3AAAYACOGUYP9';
const AZURE_SPEECH_REGION = 'eastus2';

const VOWEL_ORDER = ['a', 'e', 'i', 'o', 'u'];
const VOWEL_DATA = {
  a: { label: 'Short A', color: '#1E88E5', bg: '#E3F2FD', words: ['cat','bat','hat','mat','map','jam','fan','cap'] },
  e: { label: 'Short E', color: '#43A047', bg: '#E8F5E9', words: ['bed','red','pet','hen','ten','pen','wet','jet'] },
  i: { label: 'Short I', color: '#D81B60', bg: '#FCE4EC', words: ['pig','big','sit','hit','zip','win','kid','mix'] },
  o: { label: 'Short O', color: '#FB8C00', bg: '#FFF3E0', words: ['dog','hot','pot','fox','box','mop','top','hop'] },
  u: { label: 'Short U', color: '#8E24AA', bg: '#F3E5F5', words: ['sun','run','fun','bug','cup','hug','mud','nut'] },
};

const IMG_BASE = 'https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/CVC/assets/images/words/';
const WORDS_PER_PAGE = 2;

let ttsBusy = false;
let lastBuiltWords = [];

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandomWords(pool, n) {
  const cap = Math.max(0, Math.min(n, pool.length));
  return shuffleArray(pool).slice(0, cap);
}

function svgPlaceholderDataUrl(line1, line2) {
  const esc = (t) => String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#fff8e1"/></linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="50%" y="38%" text-anchor="middle" font-size="34" fill="#1565C0" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${esc(line1)}</text>
    <text x="50%" y="52%" text-anchor="middle" font-size="14" fill="#546E7A" font-family="Segoe UI,Arial,sans-serif">${esc(line2)}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

function buildVowelGrid() {
  const grid = document.getElementById('vowelGrid');
  grid.innerHTML = '';
  VOWEL_ORDER.forEach((v) => {
    const d = VOWEL_DATA[v];
    const cell = document.createElement('div');
    cell.className = 'vowel-cell on';
    cell.dataset.v = v;
    cell.style.background = d.bg + '44';
    cell.innerHTML = `
      <input type="checkbox" id="chk-${v}" checked data-v="${v}" />
      <label class="lbl" for="chk-${v}">${v.toUpperCase()}</label>
      <div class="count-wrap">
        <span>词数</span>
        <input type="number" id="cnt-${v}" min="0" max="${d.words.length}" value="2" data-v="${v}" />
      </div>
    `;
    const chk = cell.querySelector('input[type="checkbox"]');
    const num = cell.querySelector('input[type="number"]');
    chk.addEventListener('change', () => {
      cell.classList.toggle('on', chk.checked);
      num.disabled = !chk.checked;
      if (!chk.checked) num.value = '0';
      else if (parseInt(num.value, 10) === 0) num.value = '2';
    });
    grid.appendChild(cell);
  });
}

function collectSelection() {
  const items = [];
  VOWEL_ORDER.forEach((v) => {
    const chk = document.getElementById('chk-' + v);
    const num = document.getElementById('cnt-' + v);
    if (!chk.checked) return;
    const n = parseInt(num.value, 10);
    if (!Number.isFinite(n) || n <= 0) return;
    const pool = VOWEL_DATA[v].words;
    const picked = pickRandomWords(pool, n);
    picked.forEach((word) => {
      const meta = VOWEL_DATA[v];
      items.push({ word, vowel: v, color: meta.color, bg: meta.bg });
    });
  });
  return shuffleArray(items);
}

function getVoiceName() {
  const sel = document.getElementById('azureVoice');
  return (sel && sel.value) || 'en-US-JennyNeural';
}

function speakWord(word, buttonEl) {
  const SpeechSDK = window.SpeechSDK;
  if (!SpeechSDK) {
    alert('Speech SDK 未加载，请用 http(s) 打开本页。');
    return;
  }
  if (!AZURE_SPEECH_KEY || !AZURE_SPEECH_REGION) {
    alert('未配置 Azure 密钥或区域。');
    return;
  }
  if (ttsBusy) return;
  ttsBusy = true;
  if (buttonEl) buttonEl.disabled = true;

  const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(
    AZURE_SPEECH_KEY,
    AZURE_SPEECH_REGION
  );
  speechConfig.speechSynthesisVoiceName = getVoiceName();
  const synthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig);

  synthesizer.speakTextAsync(
    word,
    function (result) {
      ttsBusy = false;
      if (buttonEl) buttonEl.disabled = false;
      if (result.reason === SpeechSDK.ResultReason.Canceled) {
        const detail = result.errorDetails || '已取消';
        console.warn(detail);
        alert('朗读未成功：' + detail);
      }
      synthesizer.close();
    },
    function (err) {
      ttsBusy = false;
      if (buttonEl) buttonEl.disabled = false;
      console.error(err);
      alert('朗读失败：' + err);
      synthesizer.close();
    }
  );
}

function buildSingleBlankLine() {
  return `
    <div class="blank-rows">
      <div class="blank-line">
        <div class="grid-bg">
          <div class="gl gl-sky"></div>
          <div class="gl gl-cloud"></div>
          <div class="gl gl-grass"></div>
          <div class="gl gl-dirt"></div>
        </div>
      </div>
    </div>`;
}

function buildDictBlock(item, globalIndex, totalOnPage) {
  const wrap = document.createElement('div');
  wrap.className = 'dict-block' + (totalOnPage === 1 ? ' only-one' : '');
  const safeWord = item.word.replace(/"/g, '&quot;');
  wrap.innerHTML = `
    <div class="block-hdr">
      <span class="idx-label">第 ${globalIndex + 1} 题</span>
    </div>
    <div class="img-wrap">
      <div class="img-frame">
        <img src="${IMG_BASE}${item.word}.png" alt="" />
      </div>
      <div class="answer-word" style="border-color:${item.color};color:${item.color};">${item.word}</div>
    </div>
    <div class="speak-row no-print">
      <button type="button" class="btn-speak">🔊 朗读</button>
    </div>
    ${buildSingleBlankLine()}
  `;
  const img = wrap.querySelector('.img-frame img');
  img.addEventListener('error', function onErr() {
    this.removeEventListener('error', onErr);
    this.src = svgPlaceholderDataUrl(item.word, IMG_BASE + item.word + '.png');
  }, { once: true });
  wrap.querySelector('.btn-speak').addEventListener('click', function () {
    speakWord(item.word, this);
  });
  return wrap;
}

function buildPage(pair, pageIndex, totalPages, startIdx) {
  const viewport = document.createElement('div');
  viewport.className = 'page-viewport';

  const page = document.createElement('div');
  page.className = 'page';

  const hdr = document.createElement('div');
  hdr.className = 'page-hdr';
  hdr.innerHTML = `
    <span>Name: ___________________</span>
    <span class="title-chip">CVC 听写 · AEIOU</span>
    <span>Date: ____ / ____ / ____</span>
  `;
  page.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'page-body';
  const n = pair.length;
  pair.forEach((item, j) => body.appendChild(buildDictBlock(item, startIdx + j, n)));
  page.appendChild(body);

  const ftr = document.createElement('div');
  ftr.className = 'page-ftr';
  ftr.textContent = `Magic English • CVC 听写生成器 · 顺序随机 | ${pageIndex + 1} / ${totalPages}`;
  page.appendChild(ftr);

  viewport.appendChild(page);
  return viewport;
}

function updateSummary(items) {
  const el = document.getElementById('genSummary');
  if (!items.length) {
    el.textContent = '';
    return;
  }
  const byV = {};
  items.forEach((it) => {
    byV[it.vowel] = (byV[it.vowel] || 0) + 1;
  });
  const parts = VOWEL_ORDER.filter((v) => byV[v]).map((v) => `${v.toUpperCase()}×${byV[v]}`);
  el.textContent = `本次共 ${items.length} 词：${parts.join('，')} · 已随机打乱 · ${chunkArray(items, WORDS_PER_PAGE).length} 页（每页 ${WORDS_PER_PAGE} 词）`;
}

function runGenerate() {
  const items = collectSelection();
  if (!items.length) {
    alert('请至少勾选一个元音，并填写大于 0 的词数。');
    return;
  }
  lastBuiltWords = items.map((x) => x.word);
  const app = document.getElementById('app');
  app.innerHTML = '';
  const pages = chunkArray(items, WORDS_PER_PAGE);
  pages.forEach((pair, pi) => {
    app.appendChild(buildPage(pair, pi, pages.length, pi * WORDS_PER_PAGE));
  });
  updateSummary(items);
  fitPageViewports();
  app.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function fitPageViewports() {
  if (window.matchMedia('print').matches) return;
  document.querySelectorAll('.page-viewport').forEach((vp) => {
    const page = vp.querySelector('.page');
    if (!page) return;
    page.style.transform = 'none';
    page.style.transformOrigin = 'top left';
    const naturalW = page.offsetWidth;
    const targetW = vp.clientWidth;
    if (!naturalW || !targetW) return;
    const scale = Math.min(1, targetW / naturalW);
    page.style.transform = scale < 1 ? `scale(${scale})` : 'none';
    vp.style.height = scale < 1 ? `${page.offsetHeight * scale}px` : 'auto';
  });
}

function runPdf() {
  if (!lastBuiltWords.length) {
    alert('请先生成听写内容，再导出 PDF。');
    return;
  }
  window.print();
}

document.getElementById('btnGenerate').addEventListener('click', runGenerate);
document.getElementById('btnPdf').addEventListener('click', runPdf);
document.getElementById('toggleAnswers').addEventListener('change', function () {
  document.body.classList.toggle('show-answers', this.checked);
});

let fitTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitPageViewports, 120);
});
window.addEventListener('orientationchange', fitPageViewports);

window.addEventListener('load', buildVowelGrid);
</script>
</body>
</html>
