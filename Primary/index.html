<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>国家地理分级阅读 · 启蒙字母与语音</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ng-gold: #f5c400;
      --ng-gold-dim: #c9a000;
      --ink: #0d1117;
      --text: #e8eaed;
      --text-muted: #9aa5b8;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --radius: 20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100dvh;
      color: var(--text);
      background: var(--ink);
      line-height: 1.55;
      overflow-x: clip;
      -webkit-tap-highlight-color: rgba(245, 196, 0, 0.12);
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.03);
    }
    .bg-frost {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 22, 0.42);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }
    .bg-frost::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245, 196, 0, 0.12), transparent 55%),
        radial-gradient(ellipse 55% 40% at 100% 60%, rgba(0, 131, 143, 0.08), transparent 50%),
        linear-gradient(180deg, rgba(10, 14, 22, 0.15) 0%, rgba(10, 14, 22, 0.35) 100%);
      pointer-events: none;
    }
    .page {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding:
        max(clamp(1.5rem, 5vw, 3.5rem), env(safe-area-inset-top))
        max(clamp(1rem, 4vw, 2.5rem), env(safe-area-inset-right))
        max(2.5rem, env(safe-area-inset-bottom))
        max(clamp(1rem, 4vw, 2.5rem), env(safe-area-inset-left));
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      min-height: 44px;
      padding: 0.35rem 0;
      -webkit-tap-highlight-color: transparent;
    }
    .back-home:hover,
    .back-home:active { color: var(--ng-gold); }
    header {
      text-align: center;
      margin-bottom: clamp(2.5rem, 6vw, 4rem);
    }
    .logo-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      max-width: 100%;
    }
    .logo-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(245, 196, 0, 0.28);
      border: 1px solid rgba(245, 196, 0, 0.25);
    }
    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo-text {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ng-gold);
    }
    h1 {
      font-family: "Cormorant Garamond", "Georgia", "Songti SC", serif;
      font-weight: 600;
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #fff 0%, #c5cdd8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      color: var(--text-muted);
      max-width: 32rem;
      margin: 0 auto;
      padding: 0 0.25rem;
      font-weight: 400;
      line-height: 1.65;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 1.25rem;
    }
    a.card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 1.75rem 1.6rem 1.5rem;
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.35s,
                  box-shadow 0.35s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    a.card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent 80%);
      opacity: 0.9;
    }
    a.card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.08;
      filter: blur(48px);
      top: -60px;
      right: -40px;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    a.card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    a.card:hover::after { opacity: 0.18; }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-arrow {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      transition: background 0.3s, transform 0.3s, border-color 0.3s;
      overflow: hidden;
    }
    .card-arrow img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    a.card:hover .card-arrow {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateX(2px);
    }
    a.card:hover .card-arrow img { opacity: 1; }
    .card-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.35rem;
      letter-spacing: 0.01em;
    }
    .card-tag {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.85rem;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
    }
    .tag {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.06);
      line-height: 1.3;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid var(--glass-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    footer strong { color: var(--ng-gold); font-weight: 600; }

    @media (max-width: 768px) {
      header { margin-bottom: 2rem; }
      h1 { font-size: clamp(1.9rem, 7.5vw, 2.5rem); }
      .grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      a.card {
        min-height: auto;
        padding: 1.35rem 1.25rem 1.2rem;
      }
      .card-title { font-size: 1.45rem; }
    }

    @media (max-width: 640px) {
      a.card { min-height: 0; }
      footer { flex-direction: column; text-align: center; }
      .logo-text {
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-align: center;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (hover: none) and (pointer: coarse) {
      a.card:hover {
        transform: none;
        box-shadow: none;
      }
      a.card:active {
        transform: scale(0.985);
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.09);
      }
      a.card:hover .card-arrow {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.12);
        transform: none;
      }
      a.card:active .card-arrow {
        background: var(--accent);
        border-color: var(--accent);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      a.card,
      .card-arrow,
      .card-arrow img {
        transition: none !important;
      }
    }
  </style>
</head>
