<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Jj · 练习册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/jj-print.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body class="wb-app">
  <header class="topbar">
    <a class="btn-icon" href="../index.html#J" title="返回">←</a>
    <h1 id="step-title">练习册 A · 描红</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel wb-part" id="wb-1">
      <h2>A Trace, write, and say</h2>
      <p class="lead">描红大写 J 和小写 j，再大声说 /dʒ/。</p>
      <div class="letter-stage">
        <div>
          <div class="caption">J · 大写</div>
          <div class="stave-line wb-stave" id="stave-J">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-J"></canvas>
            <canvas class="wb-draw" id="canvas-J"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">j · 小写</div>
          <div class="stave-line wb-stave" id="stave-j">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-j"></canvas>
            <canvas class="wb-draw" id="canvas-j"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">听 Jj · /dʒ/</button>
        <a class="btn btn-sky" href="print.html">导出教材 PDF</a>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-2">
      <h2>B Which ones begin with the j sound?</h2>
      <p class="lead">点图圈出开头音是 /dʒ/ 的词。jet 已示范圈好。</p>
      <div class="word-grid" id="circle-grid"></div>
      <p class="feedback" id="fb-b"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-b">检查</button>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-3">
      <h2>C Connect, say, and write Jj.</h2>
      <p class="lead">沿着 J 形迷宫连线：jet → juice → jacket → jam → 机场。说一说，再写 Jj。</p>
      <figure style="margin:0 0 12px;text-align:center;"><img src="assets/img/j-maze.jpg" alt="J maze" style="max-width:100%;border-radius:12px;"></figure>
      <p class="feedback ok" id="fb-c">在纸上完成连线后，大声说 jet、juice、jacket、jam。</p>
      <div class="btn-row">
        <a class="btn btn-leaf" href="print.html">去教具工坊导出教材 PDF</a>
      </div>
    </section>

    <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一页</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一页</button>
    </div>
  </main>
  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/jj-data.js"></script>
  <script src="../assets/js/lesson-audio.js"></script>
  <script src="assets/js/jj-workbook.js"></script>
</body>
</html>
