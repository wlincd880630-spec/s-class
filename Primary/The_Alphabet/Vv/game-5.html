<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>写 Vv 还是 ✗ · Vv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body class="deck" data-game="5">
  <div class="board">
    <header class="topbar">
      <a class="btn-icon" href="games.html" title="回目录">←</a>
      <h1 id="game-title">写 Vv 还是 ✗</h1>
      <span class="pill" id="score-pill">★ 0</span>
    </header>
    <nav class="game-rail" id="game-rail" aria-label="切换游戏"></nav>

    <main class="page deck-main">
      <section id="play">
        <div class="panel play-panel">
          <p class="lead" id="play-lead"></p>
          <div class="btn-row" id="play-tools"></div>
          <div id="play-board"></div>
          <p class="feedback" id="play-fb"></p>
          <div class="btn-row play-actions" id="play-actions"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="result">
    <div class="result-card">
      <h3 id="result-title">完成</h3>
      <p id="result-msg"></p>
      <div class="btn-row" style="justify-content:center;">
        <button type="button" class="btn btn-apple" id="btn-replay">再玩一次</button>
        <a class="btn btn-leaf" id="btn-next-game" href="game-6.html">下一游戏</a>
        <a class="btn btn-ghost" href="games.html">回目录</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/letters.js"></script>
  <script src="assets/js/vv-data.js"></script>
  <script src="../assets/js/lesson-audio.js"></script>
  <script src="assets/js/vv-games.js"></script>
</body>
</html>
