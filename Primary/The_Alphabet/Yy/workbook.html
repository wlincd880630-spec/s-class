<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Yy · 练习册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/yy-print.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body class="wb-app">
  <header class="topbar">
    <a class="btn-icon" href="../index.html#Y" title="返回">←</a>
    <h1 id="step-title">练习册 A · 描红</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel wb-part" id="wb-1">
      <h2>A Trace, write, and say</h2>
      <p class="lead">描红大写 Y 和小写 y，再大声说 /j/。</p>
      <figure style="margin:0 0 12px;text-align:center;"><img src="assets/img/yoyo.jpg" alt="yo-yo" style="max-width:220px;border-radius:12px;"></figure>
      <div class="letter-stage">
        <div>
          <div class="caption">Y · 大写</div>
          <div class="stave-line wb-stave" id="stave-Y">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-Y"></canvas>
            <canvas class="wb-draw" id="canvas-Y"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">y · 小写</div>
          <div class="stave-line wb-stave" id="stave-y">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-y"></canvas>
            <canvas class="wb-draw" id="canvas-y"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">听 Yy · /j/</button>
        <a class="btn btn-sky" href="print.html">导出教材 PDF</a>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-2">
      <h2>B Which ones begin with the y sound? Match and write.</h2>
      <p class="lead">每行点选 y 开头的图，再在心里写 Yy。</p>
      <div class="word-grid" id="match-grid"></div>
      <p class="feedback" id="fb-b"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-b">检查</button>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-3">
      <h2>C Say. Then write Yy or cross it out.</h2>
      <p class="lead">听一听，是 /j/ 开头就点 Yy，不是就打叉。</p>
      <div class="word-grid" id="cross-grid"></div>
      <p class="feedback" id="fb-c"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-c">检查</button>
        <a class="btn btn-leaf" href="print.html">去教具工坊导出教材 PDF</a>
      </div>
    </section>

    <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一页</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一页</button>
    </div>
  </main>
  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/yy-data.js"></script>
  <script src="../assets/js/lesson-audio.js"></script>
  <script src="assets/js/yy-workbook.js"></script>
</body>
</html>
