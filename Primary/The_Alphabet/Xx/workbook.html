<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Xx · 练习册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/xx-print.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body class="wb-app">
  <header class="topbar">
    <a class="btn-icon" href="../index.html#X" title="返回">←</a>
    <h1 id="step-title">练习册 A · 描红</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel wb-part" id="wb-1">
      <h2>A Trace, write, and say</h2>
      <p class="lead">描红大写 X 和小写 x，再大声说词尾 /ks/。</p>
      <figure style="margin:0 0 12px;text-align:center;"><img src="assets/img/fox-in-box.jpg" alt="fox in a box" style="max-width:220px;border-radius:12px;"></figure>
      <div class="letter-stage">
        <div>
          <div class="caption">X · 大写</div>
          <div class="stave-line wb-stave" id="stave-X">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-X"></canvas>
            <canvas class="wb-draw" id="canvas-X"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">x · 小写</div>
          <div class="stave-line wb-stave" id="stave-x">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-x"></canvas>
            <canvas class="wb-draw" id="canvas-x"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">听 Xx · /ks/</button>
        <a class="btn btn-sky" href="print.html">导出教材 PDF</a>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-2">
      <h2>B Circle the pictures ending with the x sound.</h2>
      <p class="lead">点选词尾有 /ks/ 音的图（fox、box、wax、six）。</p>
      <div class="word-grid" id="circle-grid"></div>
      <p class="feedback" id="fb-b"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-b">检查</button>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-3">
      <h2>C Connect, say, and write Xx.</h2>
      <p class="lead">按顺序点路径：fox → envelope → six → box。</p>
      <div class="word-grid" id="path-grid"></div>
      <p class="feedback" id="fb-c"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-c">检查</button>
        <a class="btn btn-leaf" href="print.html">去教具工坊导出教材 PDF</a>
      </div>
    </section>

    <nav class="deck-nav">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一页</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一页</button>
    </nav>
  </main>
  <script src="../assets/js/letters.js"></script>
  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/xx-data.js"></script>
  <script src="../assets/js/lesson-audio.js"></script>
  <script src="assets/js/xx-workbook.js"></script>
</body>
</html>
