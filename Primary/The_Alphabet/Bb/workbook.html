<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Bb · 练习册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/bb-print.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body class="wb-app">
  <header class="topbar">
    <a class="btn-icon" href="../index.html#B" title="返回">←</a>
    <h1 id="step-title">练习册 A · 描红</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel wb-part" id="wb-1">
      <h2>A Trace, write, and say</h2>
      <p class="lead">用手指或鼠标沿着浅色字母描。大写 A 顶到顶线、落到第三线；小写 a 顶到中线、落到第三线。再大声说 /b/。</p>
      <div class="letter-stage">
        <div>
          <div class="caption">A · 三笔 · 大写贴齐顶线到底线</div>
          <div class="stave-line wb-stave" id="stave-A">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-A"></canvas>
            <canvas class="wb-draw" id="canvas-A"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">a · 两笔 · 小写贴齐中线到底线</div>
          <div class="stave-line wb-stave" id="stave-a">
            <div class="grid-lines" aria-hidden="true">
              <i class="gl gl-sky"></i><i class="gl gl-cloud"></i><i class="gl gl-grass"></i><i class="gl gl-dirt"></i>
            </div>
            <canvas class="trace-ghost-cv" id="ghost-a"></canvas>
            <canvas class="wb-draw" id="canvas-a"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">听 Bb · /b/</button>
        <a class="btn btn-sky" href="print.html">导出教材 PDF</a>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-2">
      <h2>B Circle the a sound</h2>
      <p class="lead">点图圈出开头音是 /b/ 的词。bear 已示范圈好。apple、ant 不要圈。</p>
      <div class="word-grid" id="circle-grid"></div>
      <p class="feedback" id="fb-b"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-b">检查</button>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-3">
      <h2>C Color A and a</h2>
      <p class="lead">只给大写 A 和小写 a 涂色。点一下就会涂上。B、b、C、c 不要涂。</p>
      <div class="choice-grid" id="balloon-grid" style="grid-template-columns:repeat(4,1fr);"></div>
      <p class="feedback" id="fb-c"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-c">检查</button>
        <a class="btn btn-leaf" href="print.html">去教具工坊导出教材 PDF</a>
      </div>
    </section>

    <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一页</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一页</button>
    </div>
  </main>
  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/bb-data.js"></script>
  <script src="assets/js/bb-audio.js"></script>
  <script src="assets/js/bb-workbook.js"></script>
</body>
</html>
