<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Gg · 教具工坊 · 导出 PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fraunces:ital,wght@0,500;0,700;1,500&family=Fredoka:wght@500;600;700&family=Source+Serif+4:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/gg-print.css" />
  <link rel="stylesheet" href="assets/css/gg-book-playful.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body>
  <header class="topbar no-print">
    <a class="btn-icon" href="../index.html#G" title="返回">←</a>
    <h1>Gg 教具工坊</h1>
    <span class="pill">打印 PDF</span>
  </header>

  <div class="workshop no-print">
    <div class="tab-bar" role="tablist">
      <button type="button" class="tab is-on" data-pack="book">教材</button>
      <button type="button" class="tab" data-pack="games">纸质游戏</button>
      <button type="button" class="tab" data-pack="cards">教学教具</button>
    </div>

    <section class="pack-intro" id="intro-book">
      <h2>教材</h2>
      <p>一册导出：封面到 M（14 页）。含 SB p.24–25 听读、描红、连线写字、Chant，以及练习册写 Gg 连线与鱼身涂色。</p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="book">导出教材 PDF</button>
        <a class="btn btn-ghost" href="workbook.html">屏幕练习册</a>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-games">
      <h2>纸质游戏</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="games">导出纸质游戏 PDF</button>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-cards">
      <h2>教学教具</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="cards">导出教具卡 PDF</button>
      </div>
    </section>
  </div>

  <p class="preview-label no-print">A4 预览</p>

  <div id="print-root" class="print-root">
    <div class="pack pack-book is-on" id="pack-book"></div>
    <div class="pack pack-games" id="pack-games"></div>
    <div class="pack pack-cards" id="pack-cards"></div>
  </div>

  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/gg-data.js"></script>
  <script src="assets/js/gg-print.js"></script>
</body>
</html>
