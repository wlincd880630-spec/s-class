<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Aa · 练习册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/aa-print.css" />
</head>
<body class="wb-app">
  <header class="topbar">
    <a class="btn-icon" href="index.html" title="返回">←</a>
    <h1 id="step-title">练习册 A · 描红</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel wb-part" id="wb-1">
      <h2>A Trace, write, and say</h2>
      <p class="lead">绿点起笔。用手指或鼠标沿虚线描大写 A、小写 a，再大声说 /æ/。</p>
      <div class="letter-stage">
        <div>
          <div class="caption">A · 三笔</div>
          <div class="stave" id="stave-A">
            <svg viewBox="0 0 320 160" aria-hidden="true">
              <path d="M70 132 L160 28 L250 132" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <path d="M112 92 H208" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <circle cx="70" cy="132" r="6" fill="#43a047"/>
            </svg>
            <canvas id="canvas-A" width="640" height="320"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">a · 两笔</div>
          <div class="stave" id="stave-a">
            <svg viewBox="0 0 320 160" aria-hidden="true">
              <circle cx="150" cy="88" r="36" fill="none" stroke="#b0bec5" stroke-width="8" stroke-dasharray="10 12"/>
              <path d="M186 88 V128" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <circle cx="150" cy="52" r="6" fill="#43a047"/>
            </svg>
            <canvas id="canvas-a" width="640" height="320"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">听 Aa · /æ/</button>
        <a class="btn btn-sky" href="print.html">导出纸质练习册 PDF</a>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-2">
      <h2>B Circle the a sound</h2>
      <p class="lead">点图圈出开头音是 /æ/ 的词。apple 已示范圈好。banana、computer 不要圈。</p>
      <div class="word-grid" id="circle-grid"></div>
      <p class="feedback" id="fb-b"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-b">检查</button>
      </div>
    </section>

    <section class="panel wb-part hidden" id="wb-3">
      <h2>C Color A and a</h2>
      <p class="lead">只给大写 A 和小写 a 涂色。点一下就会涂上。B、b、C、c 不要涂。</p>
      <div class="choice-grid" id="balloon-grid" style="grid-template-columns:repeat(4,1fr);"></div>
      <p class="feedback" id="fb-c"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-check-c">检查</button>
        <a class="btn btn-leaf" href="print.html">去教具工坊导出 PDF</a>
      </div>
    </section>

    <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一页</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一页</button>
    </div>
  </main>
  <script src="assets/js/aa-data.js"></script>
  <script src="assets/js/aa-audio.js"></script>
  <script src="assets/js/aa-workbook.js"></script>
</body>
</html>
