<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Aa · 教具工坊 · 导出 PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Source+Serif+4:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
  <link rel="stylesheet" href="assets/css/aa-print.css" />
<script src="../../../scripts/site-nav.js" defer></script>
</head>
<body>
  <header class="topbar no-print">
    <a class="btn-icon" href="../index.html#A" title="返回">←</a>
    <h1>Aa 教具工坊</h1>
    <span class="pill">打印 PDF</span>
  </header>

  <div class="workshop no-print">
    <div class="tab-bar" role="tablist">
      <button type="button" class="tab is-on" data-pack="book">教材</button>
      <button type="button" class="tab" data-pack="workbook">练习册</button>
      <button type="button" class="tab" data-pack="games">纸质游戏</button>
      <button type="button" class="tab" data-pack="copy">四线格抄写</button>
      <button type="button" class="tab" data-pack="cards">教学教具</button>
      <button type="button" class="tab" data-pack="guide">怎么玩</button>
    </div>

    <section class="pack-intro" id="intro-book">
      <h2>教材</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="book">导出教材 PDF</button>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-workbook">
      <h2>练习册</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="workbook">导出练习册 PDF</button>
        <a class="btn btn-ghost" href="workbook.html">屏幕练习册</a>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-games">
      <h2>纸质游戏</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="games">导出纸质游戏 PDF</button>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-copy">
      <h2>四线格抄写</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-copy-vocab">四个单词</button>
        <button type="button" class="btn btn-ghost" id="btn-copy-all">全选</button>
        <button type="button" class="btn btn-ghost" id="btn-copy-none">清空</button>
      </div>
      <div class="copy-picker-grid" id="copy-picker"></div>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="copy">导出四线格 PDF</button>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-cards">
      <h2>教学教具</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="cards">导出教具卡 PDF</button>
      </div>
    </section>

    <section class="pack-intro hidden" id="intro-guide">
      <h2>怎么玩</h2>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" data-export="guide">导出使用说明 PDF</button>
      </div>
    </section>
  </div>

  <p class="preview-label no-print">A4 预览</p>

  <div id="print-root" class="print-root">
    <div class="pack pack-book is-on" id="pack-book"></div>
    <div class="pack pack-workbook" id="pack-workbook"></div>
    <div class="pack pack-games" id="pack-games"></div>
    <div class="pack pack-copy" id="pack-copy"></div>
    <div class="pack pack-cards" id="pack-cards"></div>
    <div class="pack pack-guide" id="pack-guide"></div>
  </div>

  <script src="../assets/js/stave-fit.js"></script>
  <script src="assets/js/aa-data.js"></script>
  <script src="assets/js/aa-print.js"></script>
</body>
</html>
