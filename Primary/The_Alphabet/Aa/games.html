<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Aa · 六个游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn-icon" href="index.html" id="btn-back" title="返回">←</a>
    <h1 id="game-title">六个巩固游戏</h1>
    <span class="pill" id="score-pill">★ 0</span>
  </header>

  <main class="page">
    <section id="hub">
      <p class="lead" style="margin-top:0;">先玩「开头音小侦探」。每个游戏都可以反复练。</p>
      <div class="card-grid" id="hub-grid"></div>
    </section>

    <section id="play" class="hidden">
      <div class="panel">
        <p class="lead" id="play-lead"></p>
        <div class="btn-row" id="play-tools"></div>
        <div id="play-board"></div>
        <p class="feedback" id="play-fb"></p>
        <div class="btn-row" id="play-actions"></div>
      </div>
    </section>
  </main>

  <div class="overlay hidden" id="result">
    <div class="result-card">
      <h3 id="result-title">太棒了！</h3>
      <p id="result-msg"></p>
      <div class="btn-row" style="justify-content:center;">
        <button type="button" class="btn btn-apple" id="btn-replay">再玩一次</button>
        <button type="button" class="btn btn-ghost" id="btn-hub">回大厅</button>
      </div>
    </div>
  </div>

  <script src="assets/js/aa-data.js"></script>
  <script src="assets/js/aa-audio.js"></script>
  <script src="assets/js/aa-games.js"></script>
</body>
</html>
