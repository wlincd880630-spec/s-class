<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>字母 Aa · 游戏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
</head>
<body class="deck">
  <div class="board">
    <header class="topbar">
      <a class="btn-icon" href="../index.html#A" id="btn-back" title="返回">←</a>
      <h1 id="game-title">练一练</h1>
      <span class="pill" id="score-pill">★ 0</span>
    </header>
    <nav class="az-rail" id="az-rail" aria-label="选择字母"></nav>

    <main class="page deck-main">
      <section id="hub">
        <div class="card-grid" id="hub-grid"></div>
      </section>

      <section id="play" class="hidden">
        <div class="panel play-panel">
          <p class="lead" id="play-lead"></p>
          <div class="btn-row" id="play-tools"></div>
          <div id="play-board"></div>
          <p class="feedback" id="play-fb"></p>
          <div class="btn-row play-actions" id="play-actions"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="result">
    <div class="result-card">
      <h3 id="result-title">完成</h3>
      <p id="result-msg"></p>
      <div class="btn-row" style="justify-content:center;">
        <button type="button" class="btn btn-apple" id="btn-replay">再玩一次</button>
        <button type="button" class="btn btn-ghost" id="btn-hub">回目录</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/letters.js"></script>
  <script src="assets/js/aa-data.js"></script>
  <script src="assets/js/aa-audio.js"></script>
  <script src="assets/js/aa-games.js"></script>
  <script>
    ALPHABET.mountRail(document.getElementById("az-rail"), ALPHABET.letterFromPath());
  </script>
</body>
</html>
