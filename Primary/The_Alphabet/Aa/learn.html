<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../../../scripts/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>学字母 Aa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/aa.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn-icon" href="index.html" title="返回">←</a>
    <h1 id="step-title">Aa · 学字母</h1>
    <span class="pill" id="step-pill">1 / 3</span>
  </header>
  <main class="page">
    <div class="steps" aria-hidden="true">
      <i class="step-dot on" data-step="1"></i>
      <i class="step-dot" data-step="2"></i>
      <i class="step-dot" data-step="3"></i>
    </div>

    <section class="panel" id="step-1">
      <h2>A Listen and repeat</h2>
      <p class="lead">教材 Disc 1 Track 03 · Hi, I'm an angry apple. 开头音是 /æ/。</p>
      <div class="letter-stage">
        <div class="mascot-wrap">
          <img src="assets/img/angry-apple.jpg" alt="angry apple" />
          <div class="caption">angry apple</div>
        </div>
        <div class="aa-card">
          <div class="big">Aa</div>
          <div class="ipa">/æ/</div>
          <div class="caption">the letter A</div>
        </div>
        <div class="vid-wrap">
          <video id="letter-video" controls playsinline preload="metadata" src="assets/video/letter-a.mp4" poster="assets/img/angry-apple.jpg"></video>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-track03">▶ 教材音频 Track 03</button>
        <button type="button" class="btn btn-leaf" id="btn-phoneme">Azure · 听 /æ/</button>
        <button type="button" class="btn btn-sky" id="btn-letter">Azure · 字母名 A</button>
        <button type="button" class="btn btn-ghost" id="btn-prompt">Azure · beginning sound</button>
      </div>
    </section>

    <section class="panel hidden" id="step-2">
      <h2>B Listen, point, and repeat</h2>
      <p class="lead">教材 Disc 1 Track 04 · 点图可听单词（先教材片段，再英式男声）。</p>
      <div class="btn-row">
        <button type="button" class="btn btn-apple" id="btn-track04">▶ 整段 Track 04</button>
      </div>
      <div class="word-grid" id="vocab-grid" style="margin-top:14px;"></div>
    </section>

    <section class="panel hidden" id="step-3">
      <h2>C Trace, write, and say</h2>
      <p class="lead">手指或鼠标沿虚线描大写 A、小写 a，然后听 Azure 读字母。</p>
      <div class="letter-stage">
        <div>
          <div class="caption">A · 三笔</div>
          <div class="stave" id="stave-A">
            <svg viewBox="0 0 320 160" aria-hidden="true">
              <path d="M70 132 L160 28 L250 132" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <path d="M112 92 H208" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <circle cx="70" cy="132" r="6" fill="#43a047"/>
            </svg>
            <canvas id="canvas-A" width="640" height="320"></canvas>
          </div>
        </div>
        <div>
          <div class="caption">a · 两笔</div>
          <div class="stave" id="stave-a">
            <svg viewBox="0 0 320 160" aria-hidden="true">
              <circle cx="150" cy="88" r="36" fill="none" stroke="#b0bec5" stroke-width="8" stroke-dasharray="10 12"/>
              <path d="M186 88 V128" fill="none" stroke="#b0bec5" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
              <circle cx="150" cy="52" r="6" fill="#43a047"/>
            </svg>
            <canvas id="canvas-a" width="640" height="320"></canvas>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btn-clear-trace">清除笔迹</button>
        <button type="button" class="btn btn-leaf" id="btn-say-trace">Azure · 读 Aa</button>
      </div>
    </section>

    <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
      <button type="button" class="btn btn-ghost" id="btn-prev">上一步</button>
      <button type="button" class="btn btn-apple" id="btn-next">下一步</button>
    </div>
  </main>
  <script src="assets/js/aa-data.js"></script>
  <script src="assets/js/aa-audio.js"></script>
  <script src="assets/js/aa-learn.js"></script>
</body>
</html>
