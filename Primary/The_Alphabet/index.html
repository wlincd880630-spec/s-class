<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Alphabet · Level 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Aa/assets/css/aa.css" />
</head>
<body>
  <header class="topbar">
    <a class="btn-icon" href="../index.html" title="返回小学总目录">←</a>
    <h1>The Alphabet · Level 1</h1>
  </header>
  <main class="page">
    <section class="hero">
      <img src="Aa/assets/img/hero-aa.jpg" alt="Angry apple 与字母 Aa" />
      <div class="hero-cap">
        <h2>字母 Aa 实验课</h2>
        <p>Student's Book p.4–5 · 练习册 · 纸质教具 PDF · 短元音 /æ/</p>
      </div>
    </section>

    <div class="panel" style="margin-bottom:20px;">
      <h2>先打开 Aa</h2>
      <p class="lead">学习页、六个游戏、互动练习册，以及可导出的教材 / 练习册 / 四线格 / 图词教具卡。</p>
      <div class="btn-row">
        <a class="btn btn-apple" href="Aa/index.html">进入字母 Aa →</a>
        <a class="btn btn-leaf" href="Aa/print.html">教具工坊 PDF</a>
        <a class="btn btn-ghost" href="../Alphabet/index.html">字母世界 A–Z</a>
      </div>
    </div>

    <h2 style="margin:0 0 8px;">26 个字母</h2>
    <p style="margin:0 0 12px;color:#607d8b;">目前只开放 Aa，其余字母等这一课定稿后再做。</p>
    <div class="letter-grid" id="letters"></div>
  </main>
  <script>
    var box = document.getElementById("letters");
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function (ch) {
      if (ch === "A") {
        box.insertAdjacentHTML("beforeend",
          '<a class="letter-cell live" href="Aa/index.html"><img src="Aa/assets/img/angry-apple.jpg" alt=""><span>Aa</span><small>开放</small></a>');
      } else {
        box.insertAdjacentHTML("beforeend",
          '<div class="letter-cell locked"><span>' + ch + ch.toLowerCase() + '</span><small>稍后</small></div>');
      }
    });
  </script>
</body>
</html>
