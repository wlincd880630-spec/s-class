<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Play Kitty 单词抄写作业 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════
   全局变量
══════════════════════════════════════════════════ */
:root {
  --font-hand  : 'Patrick Hand', cursive;
  --font-ui    : 'Fredoka', sans-serif;
  --img-w      : 40mm;
  --block-h    : 62mm;
  --row-h      : 31mm;
  --line-blue  : #90CAF9;
  --line-red   : #EF9A9A;
  --line-dash  : rgba(33,150,243,.32);
  --text-dark  : #2C3E50;
  --trace-color: rgba(144,202,249,.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: #455A64;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 48px;
}

.toolbar {
  width: 100%; padding: 12px 24px;
  background: #fff;
  box-shadow: 0 2px 18px rgba(0,0,0,.2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 999;
}

.toolbar-left {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; color: #37474F; font-size: 1.05rem;
}
.toolbar-left .icon { font-size: 1.4rem; }

.btn-print {
  background: #FF7043; color: #fff; border: none;
  padding: 10px 28px; border-radius: 50px;
  font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: .18s;
  box-shadow: 0 4px 12px rgba(255,112,67,.35);
  white-space: nowrap;
}
.btn-print:hover { transform: scale(1.05); background: #E64A19; }

.hw-section { display: none; }
.hw-section.active { display: block; }

.page {
  background: #fff;
  width: 210mm; height: 297mm;
  padding: 14mm 14mm 10mm;
  margin: 24px 0;
  box-shadow: 0 0 36px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
  page-break-after: always;
  overflow: hidden;
}

.page-hdr {
  flex-shrink: 0;
  height: 15mm;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2.5px solid #ECEFF1;
  padding-bottom: 3mm;
  margin-bottom: 3mm;
  font-size: .84rem; color: #9E9E9E;
  white-space: nowrap;
  gap: 3mm;
}
.page-hdr > span { white-space: nowrap; }
.page-hdr .vowel-badge {
  font-size: 1.15rem; font-weight: 700;
  padding: 2px 14px; border-radius: 8px;
}

.page-body {
  flex: 1;
  display: flex; flex-direction: column;
}

.page-ftr {
  flex-shrink: 0;
  height: 7mm;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: #BDBDBD;
  border-top: 1px solid #F5F5F5;
  padding-top: 2mm;
}

.word-block {
  /* 固定高度：避免本页词数少于 4 时 flex:1 把块拉高，四线格变大而字号不变 */
  flex: 0 0 var(--block-h);
  height: var(--block-h);
  display: grid;
  grid-template-columns: var(--img-w) 1fr;
  grid-template-rows: var(--row-h) var(--row-h);
  border-bottom: 1px solid #F5F5F5;
  min-height: 0;
}
.word-block:last-child { border-bottom: none; }

.img-col {
  grid-row: 1 / 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2.5mm;
  padding: 3mm 2mm 3mm 0;
  border-right: 1px dashed #E0E0E0;
}
.img-frame {
  width: 30mm; height: 30mm;
  border-radius: 10px;
  border: 2px solid #E8F5E9;
  background: #F9FFF9;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.img-frame img { width: 100%; height: 100%; object-fit: contain; }
.word-lbl {
  font-family: var(--font-hand);
  font-size: 1.1rem; font-weight: 700;
  letter-spacing: 1px;
}

.write-row {
  position: relative;
  height: var(--row-h);
  min-height: var(--row-h);
  max-height: var(--row-h);
  overflow: hidden;
}
.write-row:first-of-type { border-bottom: 1px dashed #EEEEEE; }

.grid-bg {
  position: absolute;
  top: 25%; height: 50%;
  left: 2mm; right: 1mm;
  pointer-events: none;
}
.gl {
  position: absolute;
  left: 0; right: 0; height: 0;
}
.gl-sky   { top: 0%;   border-top: 1.3pt solid var(--line-blue); }
.gl-cloud { top: 33%;  border-top: 1.3pt dashed var(--line-dash); }
.gl-grass { top: 67%;  border-top: 2.8pt solid var(--line-blue); }
.gl-dirt  { top: 100%; border-top: 1.3pt solid var(--line-red); }

.cells {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding: 0 2mm;
  gap: 1mm;
}
.cell {
  flex: 1; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand);
  font-size: 2.58rem;
  letter-spacing: 0;
  transform: translateY(-1.4mm);
  user-select: none;
}
.cell.model { color: var(--text-dark); font-weight: 700; }
.cell.trace { color: var(--trace-color); font-weight: 700; }
.cell.empty { color: transparent; }

.vsep {
  width: 1px; height: 36%; background: #DEDEDE;
  flex-shrink: 0;
  transform: translateY(-1.4mm);
  align-self: center;
}

.write-row.row2 .cell.trace { color: rgba(144,202,249,.28); }

@media print {
  body { background: #fff; padding: 0; }
  .toolbar { display: none !important; }
  .hw-section { display: none !important; }
  .hw-section.active { display: block !important; }
  .page {
    margin: 0; box-shadow: none; border: none;
    width: 210mm; height: 297mm;
    padding: 14mm 14mm 10mm;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <span class="icon">🐱</span>
    <span>Play Kitty 单词抄写作业 01</span>
  </div>
  <button class="btn-print" onclick="window.print()">🖨️ 打印</button>
</div>

<div id="app"></div>

<script>
/* 抄写 01：play … swat（配图 ../play-kitty-courseware/images/words/*.png 小写） */
const LESSON = {
  label: 'Play Kitty',
  color: '#AD1457',
  bg   : '#FCE4EC',
  words: ['play', 'swing', 'stretch', 'climb', 'hide', 'see', 'swat']
};

const IMG_BASE = '../play-kitty-courseware/images/words/';

function svgPlaceholderDataUrl(line1, line2) {
  const esc = (t) => String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fce4ec"/><stop offset="100%" stop-color="#fff8e1"/></linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="50%" y="38%" text-anchor="middle" font-size="34" fill="#AD1457" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${esc(line1)}</text>
    <text x="50%" y="52%" text-anchor="middle" font-size="14" fill="#546E7A" font-family="Segoe UI,Arial,sans-serif">${esc(line2)}</text>
    <text x="50%" y="68%" text-anchor="middle" font-size="12" fill="#90A4AE" font-family="Segoe UI,Arial,sans-serif">请将 PNG 放入 play-kitty-courseware/images/words/ 后刷新</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function buildAll() {
  const app = document.getElementById('app');
  const section = document.createElement('div');
  section.className = 'hw-section active';
  section.id = 'section-play-kitty-hw01';
  const pages = chunkArray(LESSON.words, 4);
  pages.forEach((pageWords, pi) => {
    section.appendChild(buildPage(LESSON, pageWords, pi + 1, pages.length));
  });
  app.appendChild(section);
}

function buildPage(vData, words, pageNum, totalPages) {
  const page = document.createElement('div');
  page.className = 'page';

  const hdr = document.createElement('div');
  hdr.className = 'page-hdr';
  hdr.innerHTML = `
    <span>姓名: ___________________</span>
    <span class="vowel-badge"
          style="background:${vData.bg}; color:${vData.color}">
      ${vData.label} · 英语抄写
    </span>
    <span>日期: ____ 年 __ 月 __ 日</span>
  `;
  page.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'page-body';
  words.forEach(word => body.appendChild(buildWordBlock(word, vData.color)));
  page.appendChild(body);

  const ftr = document.createElement('div');
  ftr.className = 'page-ftr';
  ftr.textContent =
    `Play Kitty · 国家地理分级 · 单词抄写 01  |  ` +
    `本页: ${words.join(', ')}  |  第 ${pageNum} / ${totalPages} 页`;
  page.appendChild(ftr);

  return page;
}

function buildWordBlock(word, accentColor) {
  const block = document.createElement('div');
  block.className = 'word-block';

  block.innerHTML = `
    <div class="img-col">
      <div class="img-frame">
        <img src="${IMG_BASE}${word}.png" alt="${word}" />
      </div>
      <div class="word-lbl" style="color:${accentColor}">${word}</div>
    </div>
    ${buildWriteRow(word, 'row1')}
    ${buildWriteRow(word, 'row2')}
  `;
  const img = block.querySelector('.img-frame img');
  img.addEventListener('error', function onImgErr() {
    this.removeEventListener('error', onImgErr);
    this.src = svgPlaceholderDataUrl(word, IMG_BASE + word + '.png');
  }, { once: true });

  return block;
}

function buildWriteRow(word, rowClass) {
  return `
    <div class="write-row ${rowClass}">
      <div class="grid-bg">
        <div class="gl gl-sky"></div>
        <div class="gl gl-cloud"></div>
        <div class="gl gl-grass"></div>
        <div class="gl gl-dirt"></div>
      </div>
      <div class="cells">
        <div class="cell model">${word}</div>
        <div class="vsep"></div>
        <div class="cell trace">${word}</div>
        <div class="cell trace">${word}</div>
        <div class="vsep"></div>
        <div class="cell empty">${word}</div>
        <div class="cell empty">${word}</div>
      </div>
    </div>
  `;
}

function chunkArray(arr, size) {
  const result = [];
  for (let i = 0; i < arr.length; i += size) result.push(arr.slice(i, i + size));
  return result;
}

window.addEventListener('load', buildAll);
</script>
</body>
</html>
