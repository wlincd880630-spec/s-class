<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>What are reptiles? · 46 词全彩科学标本卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Noto+Sans+SC:wght@400;600;700;900&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --forest:#153a2c; --clay:#d6674b; --amber:#e8ae3c; --paper:#f5eee3; --ink:#282218; --muted:#6f675c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:#cfc1aa; font-family:"Nunito","Noto Sans SC",sans-serif; }
    .toolbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:13px max(16px,env(safe-area-inset-left)); color:#fff; background:var(--forest); box-shadow:0 8px 25px rgba(0,0,0,.2); }
    .toolbar h1 { margin:0; font-family:"Fraunces",serif; font-size:clamp(1.1rem,2.5vw,1.65rem); }
    .toolbar p { margin:2px 0 0; color:rgba(255,255,255,.68); font-size:.78rem; }
    .toolbar-actions { display:flex; gap:8px; margin-left:auto; }
    .btn { display:inline-flex; align-items:center; min-height:42px; padding:8px 14px; border:1px solid rgba(255,255,255,.25); border-radius:999px; color:#fff; background:rgba(255,255,255,.08); cursor:pointer; text-decoration:none; font-weight:900; }
    .btn.primary { color:var(--forest); border-color:var(--amber); background:var(--amber); }
    .guide { max-width:210mm; margin:22px auto 0; padding:16px 20px; border-radius:15px; background:rgba(255,255,255,.8); box-shadow:0 9px 24px rgba(30,45,35,.12); }
    .guide strong { color:var(--forest); }
    #printArea { width:210mm; margin:20px auto 50px; }
    .page { width:210mm; height:297mm; padding:11mm; page-break-after:always; break-after:page; page-break-inside:avoid; break-inside:avoid; overflow:hidden; background:#fffdf8; box-shadow:0 14px 45px rgba(0,0,0,.25); }
    .page:last-child { page-break-after:auto; break-after:auto; }
    .page-header { display:flex; align-items:center; justify-content:space-between; height:12mm; margin-bottom:5mm; border-bottom:1px solid rgba(40,34,24,.15); color:var(--muted); font-size:8.5pt; }
    .page-header b { color:var(--forest); font-family:"Fraunces",serif; font-size:13pt; }
    .cards { height:255mm; }
    .word-card { display:grid; grid-template-rows:145mm 1fr; height:255mm; overflow:hidden; border:1px solid rgba(21,58,44,.18); border-radius:7mm; background:linear-gradient(135deg,#fff,#faf2e5); box-shadow:0 3mm 7mm rgba(27,52,40,.08); }
    .visuals { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:4mm; min-height:0; padding:5mm; background:#e9e0d2; }
    .visuals img { width:100%; min-height:0; height:100%; border-radius:4mm; background:#fff; object-fit:cover; }
    .visuals .tag { position:absolute; top:7mm; left:7mm; padding:1.5mm 3mm; border-radius:99px; color:#fff; background:rgba(21,58,44,.88); font-size:7pt; font-weight:900; }
    .card-copy { position:relative; display:flex; flex-direction:column; justify-content:center; min-height:0; padding:7mm 9mm; }
    .card-number { position:absolute; top:5mm; right:6mm; color:var(--clay); font-size:8pt; font-weight:1000; letter-spacing:.12em; }
    .word { margin:0; color:var(--forest); font-family:"Fraunces",serif; font-size:36pt; line-height:1; overflow-wrap:anywhere; }
    .zh { margin:2mm 0 4mm; color:var(--clay); font-size:15pt; font-weight:900; }
    .phonemes { display:flex; flex-wrap:wrap; gap:1.5mm; margin-bottom:4mm; }
    .phoneme { min-width:11mm; padding:1.5mm 2mm; border:1px solid rgba(21,58,44,.18); border-radius:2.5mm; color:var(--forest); background:#edf3ec; text-align:center; font-size:8pt; font-weight:900; }
    .sentence { padding:3.5mm; border-left:2mm solid var(--amber); border-radius:0 3mm 3mm 0; background:#fff8e7; font-size:11pt; line-height:1.45; }
    .sentence span { display:block; margin-top:1mm; color:var(--muted); font-size:9pt; }
    .science-note { margin:3mm 0 0; color:var(--muted); font-size:8pt; line-height:1.4; }
    @media(max-width:850px){
      .toolbar p{display:none}.toolbar{flex-wrap:wrap}.toolbar-actions{width:100%;margin-left:0}.btn{flex:1;justify-content:center}
      .guide{margin:14px 12px 0}.viewport{width:calc(100vw - 18px);margin:14px auto;overflow:hidden}
      #printArea{transform-origin:top left;margin:0}
    }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .toolbar,.guide{display:none!important}.viewport{width:auto!important;margin:0!important;overflow:visible!important}
      #printArea{width:210mm!important;margin:0!important;transform:none!important}
      .page{height:296mm;margin:0;box-shadow:none}
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div>
      <h1>46 词全彩科学标本卡</h1>
      <p>真实主体图 + 词义场景 + 音形对应 + 科学例句</p>
    </div>
    <div class="toolbar-actions">
      <a class="btn" href="../index.html">← 大本营</a>
      <button class="btn primary" onclick="window.print()">🖨️ 打印 / 保存 PDF</button>
    </div>
  </header>
  <aside class="guide"><strong>一词一页：</strong>每张 A4 只展示 1 个词，共 46 页。主体图与词义图完整呈现，适合彩色打印或保存 PDF。</aside>
  <div class="viewport"><main id="printArea"></main></div>

  <script src="../what-are-reptiles-courseware/assets/data/words-data.js"></script>
  <script>
  (function(){
    "use strict";
    var COS="https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/What%20are%20reptiles/what-are-reptiles-courseware/images/";
    var words=REPTILE_COURSE.words;
    function esc(t){return String(t||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
    function slug(w){return w.word.toLowerCase().replace(/ /g,"-");}
    function note(w){
      var map={
        "cold-blooded":"“冷血”是俗称；更准确的词是“变温”。",
        "turtle":"turtle 可泛指龟类；sea turtle 才明确指海龟。",
        "exoskeleton":"龟壳不是外骨骼；昆虫外部的硬支撑结构才是典型外骨骼。",
        "tuatara":"喙头蜥不是蜥蜴，是古老类群唯一现生成员。",
        "dinosaur":"鸟类是今天仍然存活的恐龙。"
      };
      return map[w.word.toLowerCase()]||"观察图片中的真实形态、结构或行为。";
    }
    function card(w,index){
      var s=(w.sentences&&w.sentences[0])||{en:"",zh:""};
      return '<article class="word-card">'+
        '<div class="visuals"><span class="tag">SUBJECT / MEANING</span>'+
        '<img src="'+COS+'words/'+slug(w)+'.png" alt="'+esc(w.chinese)+'主体图">'+
        '<img src="'+COS+'words-meaning/'+slug(w)+'.png" alt="'+esc(w.chinese)+'词义场景"></div>'+
        '<div class="card-copy"><span class="card-number">SPECIMEN '+String(index+1).padStart(2,"0")+'</span>'+
        '<h2 class="word">'+esc(w.word)+'</h2><p class="zh">'+esc(w.chinese)+'</p>'+
        '<div class="phonemes">'+(w.phonemes||[]).map(function(p){return '<span class="phoneme">'+esc(p.letter)+' · '+esc(p.symbol)+'</span>';}).join("")+'</div>'+
        '<div class="sentence">'+esc(s.en)+'<span>'+esc(s.zh)+'</span></div>'+
        '<p class="science-note">FIELD NOTE · '+esc(note(w))+'</p></div></article>';
    }
    var html="";
    for(var i=0;i<words.length;i++){
      html+='<section class="page"><div class="page-header"><b>What are reptiles?</b><span>S-Class Science · 全彩标本卡</span><span>'+(i+1)+' / '+words.length+'</span></div><div class="cards">'+card(words[i],i)+'</div></section>';
    }
    document.getElementById("printArea").innerHTML=html;
    function fit(){var v=document.querySelector(".viewport");if(innerWidth<=850){var scale=v.clientWidth/(210*3.7795275591);document.getElementById("printArea").style.transform="scale("+scale+")";v.style.height=(297*3.7795275591*words.length*scale)+"px";}}
    addEventListener("resize",fit);fit();
  })();
  </script>
</body>
</html>
