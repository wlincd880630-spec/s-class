<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jump, Pup! 单词抄写作业</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════
   全局变量
══════════════════════════════════════════════════ */
:root {
  --font-hand  : 'Patrick Hand', cursive;
  --font-ui    : 'Fredoka', sans-serif;
  --img-w      : 40mm;
  --block-h    : 62mm;   /* 每个单词块高度（2行） */
  --row-h      : 31mm;   /* 每行高度 */
  --line-blue  : #90CAF9;
  --line-red   : #EF9A9A;
  --line-dash  : rgba(33,150,243,.32);
  --text-dark  : #2C3E50;
  --trace-color: rgba(144,202,249,.55);
}

/* ══════════════════════════════════════════════════
   基础
══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: #455A64;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  min-height: 100dvh;
  overflow-x: clip;
  -webkit-tap-highlight-color: rgba(67, 160, 71, 0.12);
}

.back-hub {
  align-self: flex-start;
  margin: 12px 0 0 max(16px, env(safe-area-inset-left));
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  border: 2px solid #81C784;
  background: rgba(255, 255, 255, 0.95);
  color: #2E7D32;
  font-size: 0.9rem;
  font-weight: 700;
  text-decoration: none;
  touch-action: manipulation;
}
.back-hub:active { background: #E8F5E9; }

#app {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 max(8px, env(safe-area-inset-right)) 0 max(8px, env(safe-area-inset-left));
}

/* ══════════════════════════════════════════════════
   工具栏
══════════════════════════════════════════════════ */
.toolbar {
  width: 100%; padding: 12px 24px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  background: #fff;
  box-shadow: 0 2px 18px rgba(0,0,0,.2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 999;
}

.toolbar-left {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; color: #37474F; font-size: 1.05rem;
}
.toolbar-left .icon { font-size: 1.4rem; }

/* 打印按钮 */
.btn-print {
  background: #43A047; color: #fff; border: none;
  padding: 10px 28px; min-height: 44px;
  border-radius: 50px;
  font-family: var(--font-ui); font-size: 1.05rem; font-weight: 700;
  cursor: pointer; transition: .18s;
  box-shadow: 0 4px 12px rgba(67,160,71,.35);
  white-space: nowrap;
  touch-action: manipulation;
  flex-shrink: 0;
}
.btn-print:hover { transform: scale(1.05); background: #2E7D32; }

/* ══════════════════════════════════════════════════
   内容区（所有页面）
══════════════════════════════════════════════════ */
.hw-section { display: none; width: 100%; }
.hw-section.active { display: flex; flex-direction: column; align-items: center; }

/* ══════════════════════════════════════════════════
   A4 页面
══════════════════════════════════════════════════ */
.page-viewport {
  width: min(210mm, calc(100vw - 24px));
  margin: 24px auto;
  overflow: hidden;
}

.page {
  background: #fff;
  width: 210mm; height: 297mm;
  padding: 14mm 14mm 10mm;
  margin: 24px 0;
  box-shadow: 0 0 36px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
  page-break-after: always;
  overflow: hidden;
}

/* 页眉 */
.page-hdr {
  flex-shrink: 0;
  height: 15mm;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2.5px solid #ECEFF1;
  padding-bottom: 3mm;
  margin-bottom: 3mm;
  font-size: .84rem; color: #9E9E9E;
  white-space: nowrap;
  gap: 3mm;
}
.page-hdr > span { white-space: nowrap; }
.page-hdr .vowel-badge {
  font-size: 1.15rem; font-weight: 700;
  padding: 2px 14px; border-radius: 8px;
}

/* 页体 */
.page-body {
  flex: 1;
  display: flex; flex-direction: column;
}

/* 页脚 */
.page-ftr {
  flex-shrink: 0;
  height: 7mm;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; color: #BDBDBD;
  border-top: 1px solid #F5F5F5;
  padding-top: 2mm;
}

/* ══════════════════════════════════════════════════
   单词块：图片列 + 两行书写
══════════════════════════════════════════════════ */
.word-block {
  /* 固定高度：避免本页词数少于 4 时 flex:1 把块拉高，四线格变大而字号不变 */
  flex: 0 0 var(--block-h);
  height: var(--block-h);
  display: grid;
  grid-template-columns: var(--img-w) 1fr;
  grid-template-rows: var(--row-h) var(--row-h);
  border-bottom: 1px solid #F5F5F5;
  min-height: 0;
}
.word-block:last-child { border-bottom: none; }

/* 图片列：跨两行 */
.img-col {
  grid-row: 1 / 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2.5mm;
  padding: 3mm 2mm 3mm 0;
  border-right: 1px dashed #E0E0E0;
}
.img-frame {
  width: 30mm; height: 30mm;
  border-radius: 10px;
  border: 2px solid #E3F2FD;
  background: #F8FBFF;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.img-frame img { width: 100%; height: 100%; object-fit: cover; }
.img-frame .no-img {
  font-size: .65rem; color: #aaa;
  text-align: center; line-height: 1.4; padding: 4px;
  display: none;
}
.word-lbl {
  font-family: var(--font-hand);
  font-size: 1.1rem; font-weight: 700;
  letter-spacing: 1px;
}

/* 书写行 */
.write-row {
  position: relative;
  height: var(--row-h);
  min-height: var(--row-h);
  max-height: var(--row-h);
  overflow: hidden;
}
.write-row:first-of-type { border-bottom: 1px dashed #EEEEEE; }

/* ── 四线格背景
     top:25% / height:50% 与 Lesson 5 保持一致
     31mm行 × 50% = 15.5mm 格区 → 线间距 5.2mm（适合一年级）
─────────────────────────────────────────── */
.grid-bg {
  position: absolute;
  top: 25%; height: 50%;          /* 书写区占行高 50%，线间距适中 */
  left: 2mm; right: 1mm;
  pointer-events: none;
}
.gl {
  position: absolute;
  left: 0; right: 0; height: 0;
}
.gl-sky   { top: 0%;   border-top: 1.3pt solid var(--line-blue); }
.gl-cloud { top: 33%;  border-top: 1.3pt dashed var(--line-dash); }
.gl-grass { top: 67%;  border-top: 2.8pt solid var(--line-blue); }
.gl-dirt  { top: 100%; border-top: 1.3pt solid var(--line-red); }

/* ── 书写格 ── */
.cells {
  position: absolute; inset: 0;
  display: flex; align-items: center;
  padding: 0 2mm;
  gap: 1mm;                       /* 格间距收紧，给字体留空间 */
}
.cell {
  flex: 1; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand);
  font-size: 2.58rem;             /* 2.72rem × 95% */
  letter-spacing: 0;
  transform: translateY(-1.4mm); /* -2.2mm + 0.8mm */
  user-select: none;
}
.cell.model { color: var(--text-dark); font-weight: 700; }
.cell.trace { color: var(--trace-color); font-weight: 700; }
.cell.empty { color: transparent; }

/* 竖分隔线 */
.vsep {
  width: 1px; height: 36%; background: #DEDEDE;
  flex-shrink: 0;
  transform: translateY(-1.4mm);
  align-self: center;
}

/* 行2描红更浅，鼓励半独立书写 */
.write-row.row2 .cell.trace { color: rgba(144,202,249,.28); }

@media screen and (max-width: 720px) {
  .toolbar-left span:not(.icon) {
    font-size: 0.92rem;
    line-height: 1.35;
  }
  .toolbar {
    justify-content: center;
  }
  .btn-print {
    width: 100%;
  }
  .page-viewport {
    width: calc(100vw - 16px);
    margin: 12px auto;
  }
  .page {
    margin: 0;
    box-shadow: 0 0 24px rgba(0,0,0,.45);
  }
}

@media (hover: none) and (pointer: coarse) {
  .btn-print:hover { transform: none; }
  .btn-print:active { transform: scale(0.98); }
}

@media (prefers-reduced-motion: reduce) {
  .btn-print { transition: none !important; }
}

/* ══════════════════════════════════════════════════
   打印样式
══════════════════════════════════════════════════ */
@media print {
  body { background: #fff; padding: 0; }
  .back-hub { display: none !important; }
  .toolbar { display: none !important; }
  .hw-section { display: none !important; }
  .hw-section.active { display: block !important; }
  .page-viewport {
    width: auto;
    height: auto;
    overflow: visible;
    margin: 0;
  }
  .page-viewport .page {
    transform: none !important;
  }
  .page {
    margin: 0; box-shadow: none; border: none;
    width: 210mm; height: 297mm;
    padding: 14mm 14mm 10mm;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
  <link rel="stylesheet" href="../../assets/primary-responsive.css?v=2" />
<script src="../../../scripts/site-nav.js?v=5" defer></script>
</head>
<body>

<a class="back-hub" href="../index.html">← Jump, Pup! 首页</a>

<!-- ══ 工具栏 ══ -->
<div class="toolbar">
  <div class="toolbar-left">
    <span class="icon">🐶</span>
    <span>Jump, Pup! 单词抄写作业</span>
  </div>
  <button class="btn-print" onclick="window.print()">🖨️ 打印</button>
</div>

<!-- ══ 页面容器 ══ -->
<div id="app"></div>

<script>
/* ──────────────────────────────────────────────────────
   Jump, Pup! 抄写词表 + 配图（assets/images/jump-pup-hw/*.png）
────────────────────────────────────────────────────── */
const LESSON = {
  label: 'Jump, Pup!',
  color: '#5C6BC0',
  bg   : '#E8EAF6',
  words: ['pup', 'jump', 'cute', 'roll', 'catch', 'tug', 'run']
};

/* 抄写配图目录（含 cute.png）；课件 words/ 下缺 cute，勿改回该路径 */
const IMG_BASE = 'https://s-class-1403296481.cos.ap-chengdu.myqcloud.com/s-class/Primary/Jump%20Pup/jump-pup-homework/assets/images/jump-pup-hw/';

/** PNG 不存在时用内嵌 SVG 占位（浏览器可显示），放入同名文件后自动显示真图 */
function svgPlaceholderDataUrl(line1, line2) {
  const esc = (t) => String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#fff8e1"/></linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <text x="50%" y="38%" text-anchor="middle" font-size="34" fill="#1565C0" font-family="Segoe UI,Arial,sans-serif" font-weight="700">${esc(line1)}</text>
    <text x="50%" y="52%" text-anchor="middle" font-size="14" fill="#546E7A" font-family="Segoe UI,Arial,sans-serif">${esc(line2)}</text>
    <text x="50%" y="68%" text-anchor="middle" font-size="12" fill="#90A4AE" font-family="Segoe UI,Arial,sans-serif">请将 PNG 放入 jump-pup-homework/assets/images/jump-pup-hw/ 后刷新</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ──────────────────────────────────────────────────────
   构建页面
────────────────────────────────────────────────────── */
function buildAll() {
  const app = document.getElementById('app');
  const section = document.createElement('div');
  section.className = 'hw-section active';
  section.id = 'section-jump-pup';
  const pages = chunkArray(LESSON.words, 4);
  pages.forEach((pageWords, pi) => {
    section.appendChild(buildPage(LESSON, pageWords, pi + 1, pages.length));
  });
  app.appendChild(section);
}

/* 构建单页 */
function buildPage(vData, words, pageNum, totalPages) {
  const viewport = document.createElement('div');
  viewport.className = 'page-viewport';

  const page = document.createElement('div');
  page.className = 'page';

  // 页眉
  const hdr = document.createElement('div');
  hdr.className = 'page-hdr';
  hdr.innerHTML = `
    <span>姓名: ___________________</span>
    <span class="vowel-badge"
          style="background:${vData.bg}; color:${vData.color}">
      ${vData.label} · 英语抄写
    </span>
  `;
  page.appendChild(hdr);

  // 页体
  const body = document.createElement('div');
  body.className = 'page-body';
  words.forEach(word => body.appendChild(buildWordBlock(word, vData.color)));
  page.appendChild(body);

  // 页脚
  const ftr = document.createElement('div');
  ftr.className = 'page-ftr';
  ftr.textContent =
    `Jump, Pup! · 国家地理分级 · 单词抄写  |  ` +
    `本页: ${words.join(', ')}  |  第 ${pageNum} / ${totalPages} 页`;
  page.appendChild(ftr);

  viewport.appendChild(page);
  return viewport;
}

/* 构建单词块（图片 + 2 行书写） */
function buildWordBlock(word, accentColor) {
  const block = document.createElement('div');
  block.className = 'word-block';

  // ─ 图片列 ─
  block.innerHTML = `
    <div class="img-col">
      <div class="img-frame">
        <img class="hw-word-img" alt="${word}" />
      </div>
      <div class="word-lbl" style="color:${accentColor}">${word}</div>
    </div>
    ${buildWriteRow(word, 'row1')}
    ${buildWriteRow(word, 'row2')}
  `;
  const img = block.querySelector('.hw-word-img');
  img.src = IMG_BASE + word + '.png';
  img.addEventListener('error', function onImgErr() {
    this.removeEventListener('error', onImgErr);
    this.src = svgPlaceholderDataUrl(word, IMG_BASE + word + '.png');
  }, { once: true });

  return block;
}

/* 生成书写行 HTML */
function buildWriteRow(word, rowClass) {
  return `
    <div class="write-row ${rowClass}">
      <div class="grid-bg">
        <div class="gl gl-sky"></div>
        <div class="gl gl-cloud"></div>
        <div class="gl gl-grass"></div>
        <div class="gl gl-dirt"></div>
      </div>
      <div class="cells">
        <div class="cell model">${word}</div>
        <div class="vsep"></div>
        <div class="cell trace">${word}</div>
        <div class="cell trace">${word}</div>
        <div class="vsep"></div>
        <div class="cell empty">${word}</div>
        <div class="cell empty">${word}</div>
      </div>
    </div>
  `;
}

/* 工具函数 */
function chunkArray(arr, size) {
  const result = [];
  for (let i = 0; i < arr.length; i += size) result.push(arr.slice(i, i + size));
  return result;
}

function buildAllAndFit() {
  buildAll();
  fitPageViewports();
}

function fitPageViewports() {
  if (window.matchMedia('print').matches) return;
  document.querySelectorAll('.page-viewport').forEach((vp) => {
    const page = vp.querySelector('.page');
    if (!page) return;
    page.style.transform = 'none';
    page.style.transformOrigin = 'top left';
    const naturalW = page.offsetWidth;
    const targetW = vp.clientWidth;
    if (!naturalW || !targetW) return;
    const scale = Math.min(1, targetW / naturalW);
    page.style.transform = scale < 1 ? `scale(${scale})` : 'none';
    vp.style.height = scale < 1 ? `${page.offsetHeight * scale}px` : 'auto';
  });
}

let fitTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitPageViewports, 120);
});
window.addEventListener('orientationchange', fitPageViewports);

/* ── 初始化 ── */
window.addEventListener('load', buildAllAndFit);
</script>
  <script src="../../assets/primary-responsive.js?v=2" defer></script>
</body>
</html>
